id: az140-1d-life-gallery-flags
objective: "1.5.4"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    You manage the lifecycle of Azure Virtual Desktop images in an Azure Compute Gallery named **galAvd**. Image versions of the definition **win11-multi** are replicated to West Europe and North Europe.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous gérez le cycle de vie des images Azure Virtual Desktop dans une galerie Azure Compute Gallery nommée **galAvd**. Les versions d'image de la définition **win11-multi** sont répliquées dans West Europe et North Europe.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: After the end-of-life date of a version has passed, deployments of session hosts that reference that version fail.
        fr: Une fois la date de fin de vie d'une version dépassée, les déploiements d'hôtes de session qui référencent cette version échouent.
    - id: s2
      text:
        en: The BlockDeletionBeforeEndOfLife setting prevents a version from being deleted before its end-of-life date.
        fr: Le paramètre BlockDeletionBeforeEndOfLife empêche de supprimer une version avant sa date de fin de vie.
    - id: s3
      text:
        en: If a version has excludeFromLatest set to false and regionalExcludeFromLatest set to true for North Europe, latest in North Europe doesn't resolve to that version.
        fr: Si une version a excludeFromLatest à false et regionalExcludeFromLatest à true pour North Europe, la plus récente dans North Europe ne désigne pas cette version.
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: |
      The end-of-life date is informational: users can still deploy from a version past that date, so retire old versions by deleting them once nothing references them. `BlockDeletionBeforeEndOfLife` blocks the deletion of an image before its end-of-life date. When both `excludeFromLatest` and `regionalExcludeFromLatest` are set, the regional flag takes precedence in that region.
    fr: |
      La date de fin de vie est informative : il reste possible de déployer une version au-delà de cette date ; retirez donc les anciennes versions en les supprimant quand plus rien ne les référence. `BlockDeletionBeforeEndOfLife` bloque la suppression d'une image avant sa date de fin de vie. Quand `excludeFromLatest` et `regionalExcludeFromLatest` sont tous deux définis, l'indicateur régional l'emporte dans cette région.
references:
  - title: Store and share images in an Azure Compute Gallery
    url: https://learn.microsoft.com/en-us/azure/virtual-machines/shared-image-galleries
  - title: Store and share resources in Azure Compute Gallery
    url: https://learn.microsoft.com/en-us/azure/virtual-machines/azure-compute-gallery
