id: az140-1a-st-sizing
objective: "1.2.1"
type: dropdown
difficulty: 3
status: draft
shuffle: false
stem:
  en: |
    Fabrikam plans a pooled Azure Virtual Desktop host pool for 2,000 concurrent users. FSLogix profile containers will be stored on one Azure Files SSD share that uses the provisioned v2 billing model. You estimate the following:

    - average profile size: 30 GiB per user;
    - steady-state load: about 20,000 IOPS;
    - sign-in and sign-out peaks: 75,000 IOPS, twice a day.

    For this share, the burst IOPS limit is `MIN(MAX(3 × provisioned IOPS, 10000), 102400)`. Credit-based bursting must cover the peaks, and the provisioned IOPS must be minimized.

    What should you provision? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam planifie un pool d'hôtes Azure Virtual Desktop partagé pour 2 000 utilisateurs simultanés. Les conteneurs de profils FSLogix seront stockés sur un partage Azure Files SSD qui utilise le modèle de facturation provisionné v2. Vous estimez ce qui suit :

    - taille moyenne des profils : 30 Gio par utilisateur ;
    - charge en régime établi : environ 20 000 IOPS ;
    - pics de connexion et de déconnexion : 75 000 IOPS, deux fois par jour.

    Pour ce partage, la limite d'IOPS en rafale est `MIN(MAX(3 × provisioned IOPS, 10000), 102400)`. Le bursting à base de crédits doit couvrir les pics, et les IOPS provisionnées doivent être réduites au minimum.

    Que devez-vous provisionner ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Provisioned storage: [[cap]]

      Provisioned IOPS: [[iops]]
    fr: |
      Stockage provisionné : [[cap]]

      IOPS provisionnées : [[iops]]
  slots:
    - id: cap
      options:
        - { id: c6, text: { en: "6 TiB", fr: "6 Tio" } }
        - { id: c60, text: { en: "60 TiB", fr: "60 Tio" } }
        - { id: c600, text: { en: "600 TiB", fr: "600 Tio" } }
    - id: iops
      options:
        - { id: i10, text: "10,000" }
        - { id: i20, text: "20,000" }
        - { id: i25, text: "25,000" }
        - { id: i75, text: "75,000" }
answer:
  values: { cap: c60, iops: i25 }
explanation:
  correct:
    en: |
      2,000 users × 30 GiB is about 60 TiB of profile data. To reach a 75,000 IOPS burst limit, you provision 75,000 / 3 = 25,000 IOPS: this covers the 20,000 IOPS steady state, so credits accumulate between the peaks, and the bill is based on 25,000 IOPS instead of 75,000. Microsoft notes that bursting is best effort: provision for the peak when you need guaranteed performance.
    fr: |
      2 000 utilisateurs × 30 Gio représentent environ 60 Tio de données de profils. Pour atteindre une limite de rafale de 75 000 IOPS, vous provisionnez 75 000 / 3 = 25 000 IOPS : cela couvre les 20 000 IOPS du régime établi, si bien que des crédits s'accumulent entre les pics, et la facture repose sur 25 000 IOPS au lieu de 75 000. Microsoft précise que le bursting est fourni au mieux : provisionnez pour le pic si vous avez besoin de performances garanties.
  options:
    i10: { en: "10,000 IOPS gives a burst limit of 30,000 and doesn't even cover the steady state.", fr: "10 000 IOPS donnent une limite de rafale de 30 000 et ne couvrent même pas le régime établi." }
    i20: { en: "20,000 IOPS gives a burst limit of 60,000, below the 75,000 IOPS peak, and leaves no margin to earn credits.", fr: "20 000 IOPS donnent une limite de rafale de 60 000, inférieure au pic de 75 000 IOPS, et ne laissent aucune marge pour gagner des crédits." }
    i75: { en: "Provisioning 75,000 IOPS meets the peak without bursting but bills three times more IOPS than needed.", fr: "Provisionner 75 000 IOPS couvre le pic sans rafale, mais facture trois fois plus d'IOPS que nécessaire." }
references:
  - title: Azure Files guidance for virtual desktop workloads
    url: https://learn.microsoft.com/en-us/azure/storage/files/virtual-desktop-workloads
