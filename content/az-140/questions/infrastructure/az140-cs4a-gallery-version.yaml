id: az140-cs4a-gallery-version
objective: "1.5.7"
type: dropdown
caseStudy: az140-cs4a-woodgrove-bank
difficulty: 3
status: draft
shuffle: false
stem:
  en: |
    After each build, a release engineer publishes the managed image as a new version of win11-ms-agents by deploying an ARM template.

    You need to complete the `publishingProfile` section of the image version resource to meet the image publishing requirement.

    How should you complete the template? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Après chaque build, un ingénieur de publication publie l'image managée comme nouvelle version de win11-ms-agents en déployant un modèle ARM.

    Vous devez compléter la section `publishingProfile` de la ressource de version d'image pour satisfaire l'exigence de publication des images.

    Comment devez-vous compléter le modèle ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: json
  template: |
    "publishingProfile": {
      "[[regions]]": [
        {
          "name": "westeurope",
          "regionalReplicaCount": [[count]],
          "storageAccountType": "[[storage]]"
        },
        {
          "name": "northeurope",
          "regionalReplicaCount": 1,
          "storageAccountType": "Standard_LRS"
        }
      ],
      "[[latest]]": true
    }
  slots:
    - id: regions
      options:
        - { id: replication, text: replicationRegions }
        - { id: target, text: targetRegions }
        - { id: locations, text: locations }
    - id: count
      options:
        - { id: c1, text: "1" }
        - { id: c3, text: "3" }
        - { id: c4, text: "4" }
        - { id: c80, text: "80" }
    - id: storage
      options:
        - { id: lrs, text: Standard_LRS }
        - { id: zrs, text: Standard_ZRS }
        - { id: premium, text: Premium_LRS }
    - id: latest
      options:
        - { id: exclude, text: excludeFromLatest }
        - { id: regional, text: regionalExcludeFromLatest }
        - { id: block, text: blockDeletionBeforeEndOfLife }
answer:
  values: { regions: target, count: c4, storage: zrs, latest: exclude }
explanation:
  correct:
    en: |
      The regions and replicas of a gallery image version are listed in `targetRegions`, each with its own replica count and storage account type. Microsoft recommends one replica for every 20 VMs created at the same time and at least three replicas for production images, so 80 concurrent session hosts need 4 replicas in West Europe. `Standard_ZRS` stores the replicas on zone-redundant storage in regions that have availability zones. The global `excludeFromLatest` flag keeps the version from being selected as the latest version in every region until the pilot validates it.
    fr: |
      Les régions et les réplicas d'une version d'image de galerie sont listés dans `targetRegions`, chacun avec son nombre de réplicas et son type de compte de stockage. Microsoft recommande un réplica pour 20 machines virtuelles créées en même temps et au moins trois réplicas pour les images de production : 80 hôtes de session simultanés nécessitent donc 4 réplicas en West Europe. `Standard_ZRS` stocke les réplicas sur un stockage redondant interzone dans les régions qui disposent de zones de disponibilité. L'indicateur global `excludeFromLatest` empêche la version d'être choisie comme dernière version (latest) dans toutes les régions tant que le pilote ne l'a pas validée.
  options:
    replication: { en: "replicationRegions comes from the distribution settings of Image Builder templates; the publishing profile of a gallery image version declares its regions in targetRegions.", fr: "replicationRegions provient des paramètres de distribution des modèles du Générateur d'images ; le profil de publication d'une version d'image de galerie déclare ses régions dans targetRegions." }
    locations: { en: "locations isn't a property of the publishing profile; target regions are declared in targetRegions.", fr: "locations n'est pas une propriété du profil de publication ; les régions cibles sont déclarées dans targetRegions." }
    c1: { en: "One replica supports about 20 concurrent deployments and is below the three replicas recommended for production images.", fr: "Un seul réplica supporte environ 20 déploiements simultanés et reste en dessous des trois réplicas recommandés pour les images de production." }
    c3: { en: "Three replicas are the minimum for a production image, but they cover only about 60 concurrent deployments, not 80.", fr: "Trois réplicas sont le minimum pour une image de production, mais ils ne couvrent qu'environ 60 déploiements simultanés, pas 80." }
    c80: { en: "One replica per VM isn't needed: the guideline is one replica per 20 VMs created at the same time.", fr: "Un réplica par machine virtuelle n'est pas nécessaire : la recommandation est d'un réplica pour 20 machines virtuelles créées en même temps." }
    lrs: { en: "Standard_LRS, the default, keeps the replicas in a single datacenter and isn't zone-redundant.", fr: "Standard_LRS, la valeur par défaut, conserve les réplicas dans un seul centre de données et n'est pas redondant interzone." }
    premium: { en: "Premium_LRS is locally redundant, not zone-redundant.", fr: "Premium_LRS est localement redondant, pas redondant interzone." }
    regional: { en: "regionalExcludeFromLatest is set on one target region; at the profile level the flag that applies to every region is excludeFromLatest.", fr: "regionalExcludeFromLatest se définit sur une région cible ; au niveau du profil, l'indicateur qui s'applique à toutes les régions est excludeFromLatest." }
    block: { en: "blockDeletionBeforeEndOfLife protects the version from deletion before its end-of-life date; it doesn't affect latest selection.", fr: "blockDeletionBeforeEndOfLife empêche la suppression de la version avant sa date de fin de vie ; il n'a aucun effet sur le choix de la dernière version." }
references:
  - title: Store and share resources in Azure Compute Gallery
    url: https://learn.microsoft.com/en-us/azure/virtual-machines/azure-compute-gallery
