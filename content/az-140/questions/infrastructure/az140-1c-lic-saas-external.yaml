id: az140-1c-lic-saas-external
objective: "1.3.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Fabrikam, Inc. is a software vendor that sells access to its accounting application to other companies. Fabrikam will publish the application as a RemoteApp from Azure Virtual Desktop session hosts that run Windows 11 Enterprise multi-session.

    The users of the customer companies are not members of Fabrikam's organization, and Fabrikam does not assign them any Microsoft license.

    You need to recommend a licensing model that makes the deployment compliant for the customers' users.

    What should you recommend?
  fr: |
    Fabrikam, Inc. est un éditeur de logiciels qui vend l'accès à son application de comptabilité à d'autres entreprises. Fabrikam publiera l'application en tant que RemoteApp depuis des hôtes de session Azure Virtual Desktop qui exécutent Windows 11 Entreprise multisession.

    Les utilisateurs des entreprises clientes ne sont pas membres de l'organisation de Fabrikam, et Fabrikam ne leur attribue aucune licence Microsoft.

    Vous devez recommander un modèle de licence qui rend le déploiement conforme pour les utilisateurs des clients.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "An RDS per-user CAL with Software Assurance for each customer user", fr: "Une CAL RDS par utilisateur avec Software Assurance pour chaque utilisateur client" } }
    - { id: b, text: { en: "A Windows VDA per user license for each customer user", fr: "Une licence Windows VDA par utilisateur pour chaque utilisateur client" } }
    - { id: c, text: { en: "A Microsoft 365 F3 license for each customer user", fr: "Une licence Microsoft 365 F3 pour chaque utilisateur client" } }
    - { id: d, text: { en: "Per-user access pricing, by enrolling the Azure subscription", fr: "La tarification de l'accès par utilisateur, en inscrivant l'abonnement Azure" } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      The customers' users are external users, and the access is for external commercial purposes. For these users, Microsoft requires per-user access pricing, which you activate by enrolling the Azure subscription; each user who connects in a month is then billed on the Azure invoice.
    fr: |
      Les utilisateurs des clients sont des utilisateurs externes, et l'accès sert un usage commercial externe. Pour ces utilisateurs, Microsoft exige la tarification de l'accès par utilisateur, que vous activez en inscrivant l'abonnement Azure ; chaque utilisateur qui se connecte dans le mois est alors facturé sur la facture Azure.
  options:
    a: { en: "RDS CALs apply to Windows Server session hosts used for internal purposes.", fr: "Les CAL RDS s'appliquent aux hôtes de session Windows Server utilisés à des fins internes." }
    b: { en: "Windows VDA per user is an eligible license for internal users, not a way to serve external customers.", fr: "Windows VDA par utilisateur est une licence éligible pour les utilisateurs internes, pas un moyen de servir des clients externes." }
    c: { en: "Microsoft 365 F3 grants access rights for internal users; external commercial use requires per-user access pricing.", fr: "Microsoft 365 F3 donne des droits d'accès aux utilisateurs internes ; l'usage commercial externe exige la tarification de l'accès par utilisateur." }
references:
  - title: Licensing Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/licensing
  - title: Enroll in per-user access pricing for Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/enroll-per-user-access-pricing
