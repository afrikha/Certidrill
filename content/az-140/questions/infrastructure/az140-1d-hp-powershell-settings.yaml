id: az140-1d-hp-powershell-settings
objective: "1.4.3"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    You have an Azure Virtual Desktop pooled host pool named **hp-finance** in a resource group named **rg-avd**. One of its session hosts is named **hp-finance-2.contoso.com**.

    You need to use Azure PowerShell to meet the following requirements:

    - The host pool must fill each session host up to 12 sessions before it uses the next one.
    - No new session must start on hp-finance-2.contoso.com, while the existing sessions on it continue.

    How should you complete the script? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un pool d'hôtes regroupé Azure Virtual Desktop nommé **hp-finance** dans un groupe de ressources nommé **rg-avd**. L'un de ses hôtes de session se nomme **hp-finance-2.contoso.com**.

    Vous devez utiliser Azure PowerShell pour respecter les exigences suivantes :

    - Le pool d'hôtes doit remplir chaque hôte de session jusqu'à 12 sessions avant d'utiliser le suivant.
    - Aucune nouvelle session ne doit démarrer sur hp-finance-2.contoso.com, tandis que les sessions existantes s'y poursuivent.

    Comment devez-vous compléter le script ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: powershell
  template: |
    Update-AzWvdHostPool -ResourceGroupName rg-avd -Name hp-finance `
        -LoadBalancerType [[lb]] -MaxSessionLimit 12

    [[cmd]] -ResourceGroupName rg-avd -HostPoolName hp-finance `
        -Name hp-finance-2.contoso.com -[[param]]:$false
  slots:
    - id: lb
      options:
        - { id: bf, text: BreadthFirst }
        - { id: df, text: DepthFirst }
        - { id: pers, text: Persistent }
    - id: cmd
      options:
        - { id: upsh, text: Update-AzWvdSessionHost }
        - { id: uphp, text: Update-AzWvdHostPool }
        - { id: rmsh, text: Remove-AzWvdSessionHost }
    - id: param
      options:
        - { id: svm, text: StartVMOnConnect }
        - { id: ans, text: AllowNewSession }
        - { id: val, text: ValidationEnvironment }
answer:
  values: { lb: df, cmd: upsh, param: ans }
explanation:
  correct:
    en: |
      `DepthFirst` sends new sessions to the available host with the most sessions until it reaches the max session limit, which depth-first requires. Drain mode is a session host property: `Update-AzWvdSessionHost` with `-AllowNewSession:$false` stops new sessions on that host while existing sessions continue.
    fr: |
      `DepthFirst` envoie les nouvelles sessions vers l'hôte disponible qui a le plus de sessions jusqu'à ce qu'il atteigne la limite maximale de sessions, que depth-first exige. Le mode drainage est une propriété de l'hôte de session : `Update-AzWvdSessionHost` avec `-AllowNewSession:$false` bloque les nouvelles sessions sur cet hôte tandis que les sessions existantes continuent.
  options:
    bf: { en: "BreadthFirst spreads new sessions across the hosts instead of filling one host at a time.", fr: "BreadthFirst répartit les nouvelles sessions entre les hôtes au lieu de remplir un hôte à la fois." }
    pers: { en: "Persistent is the load balancer type of personal host pools, where each user has an assigned host.", fr: "Persistent est le type d'équilibreur de charge des pools d'hôtes personnels, où chaque utilisateur a un hôte attribué." }
    uphp: { en: "Update-AzWvdHostPool changes host pool properties; it can't target one session host.", fr: "Update-AzWvdHostPool modifie les propriétés du pool d'hôtes ; il ne peut pas cibler un hôte de session." }
    rmsh: { en: "Remove-AzWvdSessionHost removes the host from the host pool instead of draining it.", fr: "Remove-AzWvdSessionHost retire l'hôte du pool d'hôtes au lieu de le drainer." }
    svm: { en: "StartVMOnConnect is a host pool parameter that powers on deallocated hosts.", fr: "StartVMOnConnect est un paramètre du pool d'hôtes qui démarre les hôtes libérés." }
    val: { en: "ValidationEnvironment is a host pool parameter for receiving service updates early.", fr: "ValidationEnvironment est un paramètre du pool d'hôtes qui permet de recevoir les mises à jour du service en avance." }
references:
  - title: Update-AzWvdHostPool
    url: https://learn.microsoft.com/en-us/powershell/module/az.desktopvirtualization/update-azwvdhostpool
  - title: Update-AzWvdSessionHost
    url: https://learn.microsoft.com/en-us/powershell/module/az.desktopvirtualization/update-azwvdsessionhost
