id: az140-cs3a-private-link
objective: "1.1.4"
type: dragdrop
caseStudy: az140-cs3a-trey-research
difficulty: 2
status: draft
stem:
  en: |
    You need to create the private endpoints in snet-endpoints to meet the connectivity requirement.

    Which target sub-resource should you select for the private endpoint of each resource? To answer, drag the appropriate sub-resources to the correct resources. Each sub-resource may be used once, more than once, or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez créer les points de terminaison privés dans snet-endpoints pour satisfaire l'exigence de connectivité.

    Quelle sous-ressource cible devez-vous sélectionner pour le point de terminaison privé de chaque ressource ? Pour répondre, faites glisser les sous-ressources appropriées vers les ressources correspondantes. Chaque sous-ressource peut être utilisée une fois, plusieurs fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: true
  items:
    - { id: connection, text: connection }
    - { id: feed, text: feed }
    - { id: global, text: global }
    - { id: file, text: file }
  targets:
    - { id: hpoffice, text: "HP-Office" }
    - { id: hplab, text: "HP-Lab" }
    - { id: wstrey, text: "WS-Trey" }
    - { id: wsdisc, text: "WS-Discovery" }
answer:
  mapping: { hpoffice: connection, hplab: connection, wstrey: feed, wsdisc: global }
explanation:
  correct:
    en: |
      Each host pool needs its own private endpoint with the connection sub-resource for remote sessions. Each workspace that holds application groups needs a private endpoint with the feed sub-resource. Initial feed discovery uses the global sub-resource, created only once for the whole deployment on a separate workspace that has no application groups, which is the role of WS-Discovery.
    fr: |
      Chaque pool d'hôtes a besoin de son propre point de terminaison privé avec la sous-ressource connection pour les sessions à distance. Chaque espace de travail qui contient des groupes d'applications a besoin d'un point de terminaison privé avec la sous-ressource feed. La découverte initiale du flux utilise la sous-ressource global, créée une seule fois pour tout le déploiement sur un espace de travail distinct sans groupe d'applications : c'est le rôle de WS-Discovery.
  options:
    file: { en: "file is the sub-resource of a storage account for Azure Files, not of an Azure Virtual Desktop host pool or workspace.", fr: "file est la sous-ressource d'un compte de stockage pour Azure Files, pas celle d'un pool d'hôtes ou d'un espace de travail Azure Virtual Desktop." }
    global: { en: "Only one global private endpoint exists for all Azure Virtual Desktop deployments, on a placeholder workspace; WS-Trey must not be used for it because it holds application groups.", fr: "Un seul point de terminaison privé global existe pour l'ensemble des déploiements Azure Virtual Desktop, sur un espace de travail réservé ; WS-Trey ne doit pas jouer ce rôle car il contient des groupes d'applications." }
references:
  - title: Azure Private Link with Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/private-link-overview
