id: az140-1a-bw-branch-estimate
objective: "1.1.1"
type: single
difficulty: 2
status: draft
shuffle: false
stem:
  en: |
    A branch office of Northwind will use an Azure Virtual Desktop host pool named **HP1**. At peak time, the branch office has the following concurrent users, all on a single 1920 × 1080 monitor in the default graphics mode:

    - 30 users who edit documents in Microsoft Word;
    - 10 users who browse the web.

    You need to estimate the peak RDP bandwidth of the branch office by using the upper bound of Microsoft's reference figures for remote graphics.

    Which value should you use?
  fr: |
    Une agence de Northwind utilisera un pool d'hôtes Azure Virtual Desktop nommé **HP1**. En période de pointe, l'agence compte les utilisateurs simultanés suivants, tous sur un seul écran 1920 × 1080 en mode graphique par défaut :

    - 30 utilisateurs qui modifient des documents dans Microsoft Word ;
    - 10 utilisateurs qui naviguent sur le web.

    Vous devez estimer la bande passante RDP de pointe de l'agence en utilisant la borne supérieure des valeurs de référence de Microsoft pour les graphiques distants.

    Quelle valeur devez-vous retenir ?
body:
  options:
    - { id: a, text: "11 Mbps" }
    - { id: b, text: "69.5 Mbps" }
    - { id: c, text: "195 Mbps" }
    - { id: d, text: "260 Mbps" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      In the default mode, Microsoft Word uses 100–150 Kbps and web browsing 6–6.5 Mbps. With the upper bounds: 30 × 0.15 Mbps = 4.5 Mbps, plus 10 × 6.5 Mbps = 65 Mbps, for a total of 69.5 Mbps. Monitoring a pilot would refine this estimate.
    fr: |
      En mode par défaut, Microsoft Word utilise 100–150 Kbit/s et la navigation web 6–6,5 Mbit/s. Avec les bornes supérieures : 30 × 0,15 Mbit/s = 4,5 Mbit/s, plus 10 × 6,5 Mbit/s = 65 Mbit/s, soit 69,5 Mbit/s au total. La surveillance d'un pilote affinerait cette estimation.
  options:
    a: { en: "11 Mbps counts the Word users correctly but only one web-browsing user.", fr: "11 Mbit/s compte correctement les utilisateurs de Word mais un seul utilisateur qui navigue sur le web." }
    c: { en: "195 Mbps applies the web-browsing figure to the 30 Word users.", fr: "195 Mbit/s applique la valeur de la navigation web aux 30 utilisateurs de Word." }
    d: { en: "260 Mbps applies the web-browsing figure to all 40 users.", fr: "260 Mbit/s applique la valeur de la navigation web aux 40 utilisateurs." }
references:
  - title: Remote Desktop Protocol (RDP) bandwidth requirements
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/rdp-bandwidth
