id: az140-1a-bw-activity-figures
objective: "1.1.1"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    You are preparing a bandwidth estimate for the users of an Azure Virtual Desktop host pool named **HP1**. Users work on a single 1920 × 1080 monitor in the default graphics mode.

    Which bandwidth figure from Microsoft's reference table matches each activity? To answer, drag the appropriate values to the correct activities. Each value may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous préparez une estimation de bande passante pour les utilisateurs d'un pool d'hôtes Azure Virtual Desktop nommé **HP1**. Les utilisateurs travaillent sur un seul écran 1920 × 1080 en mode graphique par défaut.

    Quelle valeur du tableau de référence de Microsoft correspond à chaque activité ? Pour répondre, faites glisser les valeurs appropriées vers les activités correspondantes. Chaque valeur peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: v1, text: { en: "0.3 Kbps", fr: "0,3 Kbit/s" } }
    - { id: v2, text: { en: "100–150 Kbps", fr: "100–150 Kbit/s" } }
    - { id: v3, text: { en: "200–300 Kbps", fr: "200–300 Kbit/s" } }
    - { id: v4, text: { en: "0.9–1 Mbps", fr: "0,9–1 Mbit/s" } }
    - { id: v5, text: { en: "4–4.5 Mbps", fr: "4–4,5 Mbit/s" } }
    - { id: v6, text: { en: "8.5–9.5 Mbps", fr: "8,5–9,5 Mbit/s" } }
  targets:
    - { id: idle, text: { en: "Idle session", fr: "Session inactive" } }
    - { id: word, text: { en: "Editing a document in Microsoft Word", fr: "Modification d'un document dans Microsoft Word" } }
    - { id: ppt, text: { en: "Working in Microsoft PowerPoint", fr: "Travail dans Microsoft PowerPoint" } }
    - { id: video, text: { en: "Video playback on half of the screen at 30 FPS", fr: "Lecture vidéo sur la moitié de l'écran à 30 i/s" } }
answer:
  mapping: { idle: v1, word: v2, ppt: v5, video: v6 }
explanation:
  correct:
    en: |
      In the default graphics mode at 1920 × 1080, Microsoft gives about 0.3 Kbps for an idle session, 100–150 Kbps for Word, 4–4.5 Mbps for PowerPoint and 8.5–9.5 Mbps for half-screen video at 30 FPS. The values 200–300 Kbps (Word) and 0.9–1 Mbps (web browsing) are H.264/AVC 444 figures.
    fr: |
      En mode graphique par défaut à 1920 × 1080, Microsoft indique environ 0,3 Kbit/s pour une session inactive, 100–150 Kbit/s pour Word, 4–4,5 Mbit/s pour PowerPoint et 8,5–9,5 Mbit/s pour une vidéo en demi-écran à 30 i/s. Les valeurs 200–300 Kbit/s (Word) et 0,9–1 Mbit/s (navigation web) sont des valeurs du mode H.264/AVC 444.
references:
  - title: Direct Stream (DS) bandwidth requirements
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/rdp-bandwidth
