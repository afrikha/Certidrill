id: az140-1c-cap-quota-deallocated
objective: "1.3.6"
type: single
difficulty: 3
status: draft
shuffle: false
stem:
  en: |
    You have an Azure Virtual Desktop pooled host pool named HP-Sales in the West Europe region. HP-Sales contains 24 session hosts of the D8s_v5 size (8 vCPUs, Standard DSv5 family).

    A scaling plan keeps 6 session hosts running during off-peak hours and deallocates the other 18.

    You are planning the vCPU quota for a new host pool in the same subscription and region.

    How many Standard DSv5 Family vCPUs of quota does HP-Sales consume during off-peak hours?
  fr: |
    Vous disposez d'un pool d'hôtes Azure Virtual Desktop regroupé nommé HP-Sales dans la région West Europe. HP-Sales contient 24 hôtes de session de taille D8s_v5 (8 vCPU, famille Standard DSv5).

    Un plan de mise à l'échelle laisse 6 hôtes de session en marche pendant les heures creuses et libère les 18 autres.

    Vous planifiez le quota de vCPU d'un nouveau pool d'hôtes dans le même abonnement et la même région.

    Combien de vCPU de quota Standard DSv5 Family HP-Sales consomme-t-il pendant les heures creuses ?
body:
  options:
    - { id: a, text: "48" }
    - { id: b, text: "96" }
    - { id: c, text: "144" }
    - { id: d, text: "192" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      vCPU quota is calculated from the cores of all deployed VMs, allocated and deallocated. The 24 session hosts therefore consume 24 × 8 = 192 vCPUs of the DSv5 family quota, and of the total regional vCPU quota, even when autoscale has deallocated 18 of them.
    fr: |
      Le quota de vCPU se calcule à partir des cœurs de toutes les machines virtuelles déployées, allouées et libérées. Les 24 hôtes de session consomment donc 24 × 8 = 192 vCPU du quota de la famille DSv5, et du quota total de vCPU régionaux, même quand la mise à l'échelle automatique en a libéré 18.
  options:
    a: { en: "48 counts only the 6 running hosts, but deallocated VMs still count toward quota.", fr: "48 ne compte que les 6 hôtes en marche, or les machines virtuelles libérées comptent toujours dans le quota." }
    b: { en: "96 doesn't match the number of deployed hosts; quota counts every deployed host.", fr: "96 ne correspond pas au nombre d'hôtes déployés ; le quota compte chaque hôte déployé." }
    c: { en: "144 counts only the 18 deallocated hosts; the running hosts consume quota too.", fr: "144 ne compte que les 18 hôtes libérés ; les hôtes en marche consomment aussi du quota." }
references:
  - title: Check vCPU quotas
    url: https://learn.microsoft.com/en-us/azure/virtual-machines/quotas
