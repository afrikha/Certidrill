id: az140-1e-regkey-window
objective: "1.5.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You plan to add 40 session hosts to an Azure Virtual Desktop host pool named **HP2** from a custom image stored in Azure Compute Gallery. The session hosts will be deployed in several waves over the next 18 days by a script that uses one registration key.

    During a pilot, a registration key generated with a 4-hour lifetime caused the session hosts deployed the next day to fail with the error `EXPIRED_MACHINE_TOKEN`.

    You need to prevent the error for all the waves.

    What should you do?
  fr: |
    Vous prévoyez d'ajouter 40 hôtes de session à un pool d'hôtes Azure Virtual Desktop nommé **HP2** à partir d'une image personnalisée stockée dans Azure Compute Gallery. Les hôtes de session seront déployés en plusieurs vagues au cours des 18 prochains jours par un script qui utilise une seule clé d'inscription.

    Lors d'un pilote, une clé d'inscription générée avec une durée de vie de 4 heures a fait échouer les hôtes de session déployés le lendemain avec l'erreur `EXPIRED_MACHINE_TOKEN`.

    Vous devez éviter l'erreur pour toutes les vagues.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Generate a registration key whose expiration covers the whole 18-day window.", fr: "Générer une clé d'inscription dont l'expiration couvre toute la période de 18 jours." }
    - id: b
      text: { en: "Rebuild the custom image so that it contains the registration key.", fr: "Reconstruire l'image personnalisée pour qu'elle contienne la clé d'inscription." }
    - id: c
      text: { en: "Power on each session host for at least 20 minutes every 90 days.", fr: "Démarrer chaque hôte de session pendant au moins 20 minutes tous les 90 jours." }
    - id: d
      text: { en: "Set the custom image version to be excluded from latest.", fr: "Exclure la version de l'image personnalisée de la dernière version (Exclude from latest)." }
answer: { optionId: a }
explanation:
  correct:
    en: A registration key authorizes session hosts to join the host pool only for the lifetime you set. For a rollout spread over days, set a lifetime that covers the full window, up to the maximum of 27 days, so that hosts provisioned later don't fail with `EXPIRED_MACHINE_TOKEN`.
    fr: "Une clé d'inscription n'autorise les hôtes de session à rejoindre le pool d'hôtes que pendant la durée que vous définissez. Pour un déploiement étalé sur plusieurs jours, définissez une durée qui couvre toute la période, jusqu'au maximum de 27 jours, pour que les hôtes déployés plus tard n'échouent pas avec `EXPIRED_MACHINE_TOKEN`."
  options:
    b: { en: "The image must never contain the agent or a registration token: the key is supplied when each session host is deployed.", fr: "L'image ne doit jamais contenir l'agent ni un jeton d'inscription : la clé est fournie lors du déploiement de chaque hôte de session." }
    c: { en: "This guidance refreshes the machine token of hosts that stay powered off for more than 90 days; it doesn't extend a registration key.", fr: "Cette recommandation renouvelle le jeton machine des hôtes qui restent éteints plus de 90 jours ; elle ne prolonge pas une clé d'inscription." }
    d: { en: "Exclude from latest changes which image version is picked, not how long the registration key is valid.", fr: "L'exclusion de la dernière version change la version d'image choisie, pas la durée de validité de la clé d'inscription." }
references:
  - title: Add session hosts to a host pool
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/add-session-hosts-host-pool
