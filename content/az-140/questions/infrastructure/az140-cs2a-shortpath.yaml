id: az140-cs2a-shortpath
objective: "1.1.3"
type: single
caseStudy: az140-cs2a-munsons
difficulty: 2
status: draft
stem:
  en: |
    You need to meet the plant connectivity requirement for HP-Office. The RDP Shortpath settings of the host pool are at their default values.

    What should you do?
  fr: |
    Vous devez respecter l'exigence de connectivité des usines pour HP-Office. Les paramètres RDP Shortpath du pool d'hôtes ont leurs valeurs par défaut.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text:
        en: "On the session hosts, enable the **Enable RDP Shortpath for managed networks** policy setting, and allow inbound UDP port 3390 in Windows Defender Firewall and in NSG-Hosts."
        fr: "Sur les hôtes de session, activer le paramètre de stratégie **Enable RDP Shortpath for managed networks**, et autoriser le port UDP 3390 entrant dans le Pare-feu Windows Defender et dans NSG-Hosts."
    - id: b
      text:
        en: "On HP-Office, set **RDP Shortpath for public networks (via TURN)** to Enabled, and allow outbound UDP ports 49152–65535 from snet-hosts through FW1."
        fr: "Sur HP-Office, définir **RDP Shortpath for public networks (via TURN)** sur Enabled, et autoriser les ports UDP 49152-65535 sortants de snet-hosts à travers FW1."
    - id: c
      text:
        en: "On the session hosts, enable the **RDP Shortpath for managed networks using NAT traversal** policy setting, and allow outbound UDP from snet-hosts to the STUN servers through FW1."
        fr: "Sur les hôtes de session, activer le paramètre de stratégie **RDP Shortpath for managed networks using NAT traversal**, et autoriser l'UDP sortant de snet-hosts vers les serveurs STUN à travers FW1."
    - id: d
      text:
        en: "On HP-Office, select **Allow Direct UDP network path over Private Link**, and create a private endpoint for the connection sub-resource in VNet-Hub."
        fr: "Sur HP-Office, sélectionner **Allow Direct UDP network path over Private Link**, et créer un point de terminaison privé pour la sous-ressource connection dans VNet-Hub."
answer: { optionId: a }
explanation:
  correct:
    en: |
      RDP Shortpath for managed networks in direct mode uses a listener on the session hosts and a direct UDP connection over the private path (ExpressRoute private peering here). You enable the listener with the Enable RDP Shortpath for managed networks policy setting and allow the inbound UDP port, 3390 by default, in Windows Firewall and in any NSG. The host pool setting is Enabled by default, and this mode needs no outbound UDP to the internet.
    fr: |
      RDP Shortpath pour les réseaux managés en mode direct utilise un écouteur sur les hôtes de session et une connexion UDP directe par le chemin privé (ici le peering privé ExpressRoute). Vous activez l'écouteur avec le paramètre de stratégie Enable RDP Shortpath for managed networks et autorisez le port UDP entrant, 3390 par défaut, dans le Pare-feu Windows et dans tout groupe de sécurité réseau. Le paramètre du pool d'hôtes est Enabled par défaut, et ce mode n'a besoin d'aucun trafic UDP sortant vers Internet.
  options:
    b: { en: "TURN relays the UDP traffic through an intermediate server on the internet, which the requirement forbids.", fr: "TURN relaie le trafic UDP par un serveur intermédiaire sur Internet, ce que l'exigence interdit." }
    c: { en: "The ICE/STUN mode gives a direct path over ExpressRoute, but it depends on outbound UDP from the session hosts to the STUN servers on the internet.", fr: "Le mode ICE/STUN donne un chemin direct sur ExpressRoute, mais il dépend d'un trafic UDP sortant des hôtes de session vers les serveurs STUN sur Internet." }
    d: { en: "This option only lets UDP flow over an existing Private Link deployment; Private Link is neither in place nor required, and it does not create the direct listener.", fr: "Cette option permet seulement le passage d'UDP sur un déploiement Private Link existant ; Private Link n'est ni en place ni exigé, et elle ne crée pas l'écouteur direct." }
references:
  - title: Configure RDP Shortpath for Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/configure-rdp-shortpath
