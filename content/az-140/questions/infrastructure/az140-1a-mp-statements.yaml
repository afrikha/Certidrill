id: az140-1a-mp-statements
objective: "1.1.3"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Northwind Traders has an Azure Virtual Desktop host pool named **HP1** in the Azure public cloud. RDP Shortpath is configured as the primary transport. Users connect from Windows devices with Windows App 2.0.1069.0. You are evaluating RDP Multipath.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind Traders dispose d'un pool d'hôtes Azure Virtual Desktop nommé **HP1** dans le cloud public Azure. RDP Shortpath est configuré comme transport principal. Les utilisateurs se connectent depuis des appareils Windows avec Windows App 2.0.1069.0. Vous évaluez RDP Multipath.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: You must enable a dedicated RDP Multipath option in the networking settings of HP1.
        fr: Vous devez activer une option RDP Multipath dédiée dans les paramètres réseau de HP1.
    - id: s2
      text:
        en: Sessions can keep redundant TCP reverse connect paths on standby in addition to UDP paths.
        fr: Les sessions peuvent garder en attente des chemins TCP reverse connect redondants en plus des chemins UDP.
    - id: s3
      text:
        en: If the active path degrades, the session switches to the next best available path.
        fr: Si le chemin actif se dégrade, la session bascule sur le meilleur chemin disponible suivant.
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: |
      RDP Multipath needs no configuration change beyond an environment that supports RDP Shortpath. ICE discovers several UDP paths over STUN and TURN and keeps backup paths on standby; with Windows App 2.0.1069.0 or later, redundant TCP paths are also available. When the active path degrades or fails, the session moves to the next best path.
    fr: |
      RDP Multipath n'exige aucune modification de configuration au-delà d'un environnement qui prend en charge RDP Shortpath. ICE découvre plusieurs chemins UDP par STUN et TURN et garde des chemins de secours en attente ; avec Windows App 2.0.1069.0 ou ultérieure, des chemins TCP redondants sont aussi disponibles. Quand le chemin actif se dégrade ou échoue, la session passe au meilleur chemin suivant.
references:
  - title: Use RDP Multipath to improve connection reliability to Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/rdp-multipath
