id: az140-1b-os-statements
objective: "1.3.2"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam, Inc. is reviewing the operating systems and platforms it can use for Azure Virtual Desktop session hosts.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam, Inc. examine les systèmes d'exploitation et les plateformes qu'elle peut utiliser pour les hôtes de session Azure Virtual Desktop.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: Fabrikam can use Windows 11 Enterprise N for session hosts deployed in its European subsidiaries.
        fr: Fabrikam peut utiliser Windows 11 Entreprise N pour les hôtes de session déployés dans ses filiales européennes.
    - id: s2
      text:
        en: Fabrikam can use Windows Server 2016 for the session hosts of a pooled host pool.
        fr: Fabrikam peut utiliser Windows Server 2016 pour les hôtes de session d'un pool d'hôtes regroupé.
    - id: s3
      text:
        en: Fabrikam can run session hosts on-premises by using Azure Local.
        fr: Fabrikam peut exécuter des hôtes de session en local à l'aide d'Azure Local.
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: |
      N, KN, LTSC and other editions that aren't listed are not supported for session hosts. Windows Server 2016, 2019, 2022 and 2025 are supported. Session hosts can be located in any Azure region and on-premises with Azure Local.
    fr: |
      Les éditions N, KN, LTSC et les autres éditions non listées ne sont pas prises en charge pour les hôtes de session. Windows Server 2016, 2019, 2022 et 2025 sont pris en charge. Les hôtes de session peuvent se trouver dans n'importe quelle région Azure et en local avec Azure Local.
references:
  - title: Prerequisites for Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/prerequisites
