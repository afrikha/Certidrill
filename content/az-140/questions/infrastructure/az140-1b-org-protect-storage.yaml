id: az140-1b-org-protect-storage
objective: "1.3.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam, Inc. uses a deployment pipeline to deploy Azure Virtual Desktop. The pipeline's service principal has the Contributor role on the subscription. At each image update, the pipeline deletes and recreates the resource group that contains the session hosts.

    You need to recommend a solution that prevents the pipeline and the administrators who have the Contributor role from accidentally deleting the storage accounts that hold the FSLogix profile containers. The pipeline must keep replacing the session hosts.

    Which two actions should you recommend? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam, Inc. utilise un pipeline de déploiement pour déployer Azure Virtual Desktop. Le principal de service du pipeline dispose du rôle Contributor sur l'abonnement. À chaque mise à jour de l'image, le pipeline supprime et recrée le groupe de ressources qui contient les hôtes de session.

    Vous devez recommander une solution qui empêche le pipeline et les administrateurs disposant du rôle Contributor de supprimer accidentellement les comptes de stockage qui contiennent les conteneurs de profils FSLogix. Le pipeline doit continuer à remplacer les hôtes de session.

    Quelles sont les deux actions à recommander ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Apply a ReadOnly lock to the resource group that contains the session hosts.", fr: "Appliquer un verrou Lecture seule au groupe de ressources qui contient les hôtes de session." } }
    - { id: b, text: { en: "Move the storage accounts to a dedicated resource group.", fr: "Déplacer les comptes de stockage vers un groupe de ressources dédié." } }
    - { id: c, text: { en: "Add a Protected=true tag to the storage accounts.", fr: "Ajouter une étiquette Protected=true aux comptes de stockage." } }
    - { id: d, text: { en: "Apply a CanNotDelete lock to the resource group that contains the storage accounts.", fr: "Appliquer un verrou Suppression au groupe de ressources qui contient les comptes de stockage." } }
    - { id: e, text: { en: "Move the storage accounts to the resource group that contains the host pool objects.", fr: "Déplacer les comptes de stockage vers le groupe de ressources qui contient les objets du pool d'hôtes." } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |
      Storage holds user data and has a different lifecycle from the session hosts, so it belongs in its own resource group, outside the group the pipeline deletes. A CanNotDelete lock on that resource group is inherited by the storage accounts and blocks their deletion even by Contributors, who can't remove locks; only roles with Microsoft.Authorization/locks permissions, such as Owner or User Access Administrator, can.
    fr: |
      Le stockage contient les données des utilisateurs et a un cycle de vie différent de celui des hôtes de session : il doit avoir son propre groupe de ressources, en dehors du groupe que le pipeline supprime. Un verrou Suppression sur ce groupe de ressources est hérité par les comptes de stockage et bloque leur suppression, même par les Contributors, qui ne peuvent pas supprimer de verrous ; seuls les rôles disposant des autorisations Microsoft.Authorization/locks, comme Owner ou User Access Administrator, le peuvent.
  options:
    a: { en: "A ReadOnly lock on the session host resource group would stop the pipeline from replacing the session hosts.", fr: "Un verrou Lecture seule sur le groupe de ressources des hôtes de session empêcherait le pipeline de remplacer les hôtes de session." }
    c: { en: "Tags are metadata; they don't block any operation.", fr: "Les étiquettes sont des métadonnées ; elles ne bloquent aucune opération." }
    e: { en: "Mixing user data with service objects doesn't protect it from deletion and mixes lifecycles.", fr: "Mélanger les données des utilisateurs avec les objets de service ne les protège pas contre la suppression et mélange les cycles de vie." }
references:
  - title: Lock your Azure resources to protect your infrastructure
    url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/management/lock-resources
