id: az140-sr1-profile-auth-3
objective: "1.2.3"
type: series_yesno
series: az140-sr1-profile-auth
seriesOrder: 3
difficulty: 2
status: draft
stem:
  en: You enable Microsoft Entra Kerberos on litwareprof1.
  fr: Vous activez Microsoft Entra Kerberos sur litwareprof1.
body:
  solution:
    en: |
      You enable **Microsoft Entra Kerberos** as the identity source of litwareprof1, grant admin consent to the app registration of the storage account, and exclude that app from the Conditional Access policies that require MFA. You assign share-level permissions on the profiles share to the users, and you set `CloudKerberosTicketRetrievalEnabled` to 1 on the session hosts by using an Intune settings catalog policy.
    fr: |
      Vous activez **Microsoft Entra Kerberos** comme source d'identité de litwareprof1, vous accordez le consentement administrateur à l'inscription d'application du compte de stockage et vous excluez cette application des stratégies d'accès conditionnel qui exigent l'authentification multifacteur. Vous attribuez aux utilisateurs des autorisations au niveau du partage sur profiles, et vous définissez `CloudKerberosTicketRetrievalEnabled` sur 1 sur les hôtes de session au moyen d'une stratégie de catalogue de paramètres Intune.
answer: { value: true }
explanation:
  correct:
    en: |
      Microsoft Entra Kerberos issues Kerberos tickets for hybrid identities to Microsoft Entra joined clients without any connectivity to domain controllers. The admin consent, the MFA exclusion for the storage account app and the cloud Kerberos ticket retrieval setting on the session hosts are the required steps, so FSLogix can mount the containers silently at sign-in.
    fr: |
      Microsoft Entra Kerberos émet des tickets Kerberos pour des identités hybrides vers des clients joints à Microsoft Entra, sans aucune connectivité avec les contrôleurs de domaine. Le consentement administrateur, l'exclusion de l'application du compte de stockage de l'authentification multifacteur et le paramètre de récupération du ticket Kerberos cloud sur les hôtes de session sont les étapes requises : FSLogix peut alors monter les conteneurs sans invite à la connexion.
references:
  - title: Enable Microsoft Entra Kerberos authentication for hybrid and cloud-only identities on Azure Files
    url: https://learn.microsoft.com/en-us/azure/storage/files/storage-files-identity-auth-hybrid-identities-enable
