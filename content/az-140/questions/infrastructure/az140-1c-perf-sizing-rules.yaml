id: az140-1c-perf-sizing-rules
objective: "1.3.5"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    You are reviewing a sizing proposal for Azure Virtual Desktop multi-session session hosts against Microsoft's sizing guidelines.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous examinez une proposition de dimensionnement d'hôtes de session Azure Virtual Desktop multisession au regard des recommandations de dimensionnement de Microsoft.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          Resizing a session host from 8 vCPUs to 16 vCPUs doubles the number of users that it supports.
        fr: |
          Redimensionner un hôte de session de 8 à 16 vCPU double le nombre d'utilisateurs qu'il prend en charge.
    - id: s2
      text:
        en: |
          The guidelines recommend at least 30 GB of profile storage per user for every workload type.
        fr: |
          Les recommandations prévoient au moins 30 Go de stockage de profil par utilisateur pour chaque type de charge de travail.
    - id: s3
      text:
        en: |
          The guidelines recommend that a multi-session VM have no more than 32 cores.
        fr: |
          Les recommandations prévoient qu'une machine virtuelle multisession n'ait pas plus de 32 cœurs.
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: |
      Doubling the cores doesn't double capacity; the scaling factor is typically between 1.5 and 1.9. The minimum profile storage is 30 GB for light, medium, heavy and power workloads. Microsoft recommends not exceeding 32 cores per VM, with returns diminishing around 16 cores, and favors the 4 to 24 vCPU range.
    fr: |
      Doubler les cœurs ne double pas la capacité ; le facteur d'échelle se situe en général entre 1,5 et 1,9. Le stockage de profil minimal est de 30 Go pour les charges légères, moyennes, lourdes et intensives. Microsoft recommande de ne pas dépasser 32 cœurs par machine virtuelle, le rendement diminuant vers 16 cœurs, et privilégie la plage de 4 à 24 vCPU.
references:
  - title: Session host virtual machine sizing guidelines for Azure Virtual Desktop and Remote Desktop Services
    url: https://learn.microsoft.com/en-us/windows-server/remote/remote-desktop-services/virtual-machine-recs
