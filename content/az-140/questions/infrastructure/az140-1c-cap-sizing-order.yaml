id: az140-1c-cap-sizing-order
objective: "1.3.6"
type: ordering
difficulty: 1
status: draft
stem:
  en: |
    Northwind Traders is planning the capacity of a new Azure Virtual Desktop pooled host pool for its customer service department. The VM size and the workload type are already known.

    You need to produce a capacity plan that the deployment can use.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Northwind Traders planifie la capacité d'un nouveau pool d'hôtes Azure Virtual Desktop regroupé pour son service client. La taille des machines virtuelles et le type de charge de travail sont déjà connus.

    Vous devez produire un plan de capacité utilisable par le déploiement.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: peak, text: { en: "Estimate the peak number of concurrent user sessions.", fr: "Estimer le nombre maximal de sessions utilisateur simultanées." } }
    - { id: perhost, text: { en: "Derive the number of users per session host from the workload type and the vCPUs of the VM size.", fr: "Déduire le nombre d'utilisateurs par hôte de session du type de charge de travail et des vCPU de la taille de machine virtuelle." } }
    - { id: hosts, text: { en: "Calculate the number of session hosts, including headroom for hosts in maintenance.", fr: "Calculer le nombre d'hôtes de session, avec une marge pour les hôtes en maintenance." } }
    - { id: quota, text: { en: "Compare the total vCPUs with the regional and VM family quotas, and request an increase if needed.", fr: "Comparer le total de vCPU aux quotas régional et de famille de machines virtuelles, et demander une augmentation si besoin." } }
    - { id: bf, text: { en: "Set the load balancing algorithm of the host pool to breadth-first.", fr: "Définir l'algorithme d'équilibrage de charge du pool d'hôtes sur breadth-first." } }
    - { id: svc, text: { en: "Enable Start VM on Connect on the host pool.", fr: "Activer Start VM on Connect sur le pool d'hôtes." } }
answer:
  sequence: [ peak, perhost, hosts, quota ]
explanation:
  correct:
    en: |
      Capacity starts from peak concurrency, not from the headcount. The users per host come from the workload baseline (users per vCPU) multiplied by the vCPUs of the size. Dividing the peak sessions by the users per host, rounding up and adding headroom gives the host count, and the host count times the vCPUs per host is what the regional and family quotas must allow.
    fr: |
      La capacité part de la simultanéité de pointe, pas de l'effectif. Le nombre d'utilisateurs par hôte provient de la base de la charge (utilisateurs par vCPU) multipliée par les vCPU de la taille. Diviser les sessions de pointe par les utilisateurs par hôte, arrondir et ajouter une marge donne le nombre d'hôtes, et ce nombre multiplié par les vCPU par hôte correspond à ce que les quotas régional et de famille doivent permettre.
  options:
    bf: { en: "The load balancing algorithm is a host pool setting, not a step of the capacity calculation.", fr: "L'algorithme d'équilibrage de charge est un paramètre du pool d'hôtes, pas une étape du calcul de capacité." }
    svc: { en: "Start VM on Connect reduces cost at run time; it doesn't determine the capacity to plan.", fr: "Start VM on Connect réduit le coût à l'exécution ; il ne détermine pas la capacité à prévoir." }
references:
  - title: Session host virtual machine sizing guidelines for Azure Virtual Desktop and Remote Desktop Services
    url: https://learn.microsoft.com/en-us/windows-server/remote/remote-desktop-services/virtual-machine-recs
  - title: Check vCPU quotas
    url: https://learn.microsoft.com/en-us/azure/virtual-machines/quotas
