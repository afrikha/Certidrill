id: az140-1c-cap-features
objective: "1.3.6"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Contoso is designing the VM capacity of its Azure Virtual Desktop deployment in one Azure region. The design has the requirements shown in the answer area.

    Which feature should you recommend for each requirement? To answer, drag the appropriate features to the correct requirements. Each feature may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso conçoit la capacité de machines virtuelles de son déploiement Azure Virtual Desktop dans une seule région Azure. La conception comporte les exigences indiquées dans la zone de réponse.

    Quelle fonctionnalité devez-vous recommander pour chaque exigence ? Pour répondre, faites glisser les fonctionnalités appropriées vers les exigences correspondantes. Chaque fonctionnalité peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: plan, text: { en: "An autoscale scaling plan", fr: "Un plan de mise à l'échelle automatique" } }
    - { id: svc, text: Start VM on Connect }
    - { id: zones, text: { en: "Availability zones", fr: "Des zones de disponibilité" } }
    - { id: avset, text: { en: "An availability set", fr: "Un groupe à haute disponibilité" } }
    - { id: reserve, text: { en: "An on-demand capacity reservation", fr: "Une réservation de capacité à la demande" } }
  targets:
    - id: t1
      text: { en: "The number of running pooled session hosts follows a schedule: more hosts during office hours, fewer at night", fr: "Le nombre d'hôtes de session regroupés en marche suit une planification : plus d'hôtes aux heures de bureau, moins la nuit" }
    - id: t2
      text: { en: "Personal session hosts stay deallocated until their user connects", fr: "Les hôtes de session personnels restent libérés jusqu'à ce que leur utilisateur se connecte" }
    - id: t3
      text: { en: "The host pool keeps serving users if one datacenter of the region fails", fr: "Le pool d'hôtes continue de servir les utilisateurs si un centre de données de la région tombe en panne" }
    - id: t4
      text: { en: "Compute capacity for 30 VMs of a specific size is guaranteed in the region", fr: "La capacité de calcul de 30 machines virtuelles d'une taille donnée est garantie dans la région" }
answer:
  mapping: { t1: plan, t2: svc, t3: zones, t4: reserve }
explanation:
  correct:
    en: |
      A scaling plan turns pooled session hosts on and off according to its ramp-up, peak, ramp-down and off-peak phases. Start VM on Connect powers on a deallocated personal host when its user connects. Spreading session hosts across availability zones protects against the loss of a datacenter. Quota and capacity are checked separately, and an on-demand capacity reservation guarantees capacity for a VM size.
    fr: |
      Un plan de mise à l'échelle démarre et arrête les hôtes de session regroupés selon ses phases de montée en charge, de pointe, de réduction et d'heures creuses. Start VM on Connect démarre un hôte personnel libéré quand son utilisateur se connecte. Répartir les hôtes de session entre des zones de disponibilité protège contre la perte d'un centre de données. Le quota et la capacité sont vérifiés séparément, et une réservation de capacité à la demande garantit de la capacité pour une taille de machine virtuelle.
  options:
    avset: { en: "An availability set spreads VMs across fault and update domains inside one datacenter, so it doesn't survive a datacenter failure.", fr: "Un groupe à haute disponibilité répartit les machines virtuelles entre domaines d'erreur et de mise à jour au sein d'un même centre de données : il ne résiste pas à la panne d'un centre de données." }
references:
  - title: Create and assign an autoscale scaling plan for Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/autoscale-scaling-plan
  - title: Configure Start VM on Connect for Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/start-virtual-machine-connect
