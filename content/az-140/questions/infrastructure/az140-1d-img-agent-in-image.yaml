id: az140-1d-img-agent-in-image
objective: "1.5.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An administrator at Proseware created a golden image manually. To test it, the administrator installed the Azure Virtual Desktop Agent on the build virtual machine and registered it with a host pool named **HP-Test**. The administrator then ran Sysprep and captured the virtual machine as image version 1.0.0 in an Azure Compute Gallery. Snapshots of the OS disk were taken before and after each customization step.

    Six weeks later, you deploy session hosts from version 1.0.0 to a host pool named **HP-Prod**. The new session hosts fail to register with HP-Prod.

    What should you do?
  fr: |
    Un administrateur de Proseware a créé manuellement une image de référence. Pour la tester, il a installé l'agent Azure Virtual Desktop sur la machine virtuelle de build et l'a inscrite dans un pool d'hôtes nommé **HP-Test**. Il a ensuite exécuté Sysprep et capturé la machine virtuelle comme version d'image 1.0.0 dans une galerie Azure Compute Gallery. Des instantanés du disque du système d'exploitation ont été pris avant et après chaque étape de personnalisation.

    Six semaines plus tard, vous déployez des hôtes de session à partir de la version 1.0.0 dans un pool d'hôtes nommé **HP-Prod**. Les nouveaux hôtes de session ne parviennent pas à s'inscrire dans HP-Prod.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Generate a new registration key for HP-Prod, then redeploy the session hosts from version 1.0.0.", fr: "Générer une nouvelle clé d'inscription pour HP-Prod, puis redéployer les hôtes de session à partir de la version 1.0.0." } }
    - { id: b, text: { en: "Build a new version from a snapshot taken before the agent was installed.", fr: "Construire une nouvelle version à partir d'un instantané pris avant l'installation de l'agent." } }
    - { id: c, text: { en: "Replicate version 1.0.0 to more regions, then redeploy the session hosts.", fr: "Répliquer la version 1.0.0 dans davantage de régions, puis redéployer les hôtes de session." } }
    - { id: d, text: { en: "Change the security type of the image definition to TrustedLaunchSupported.", fr: "Changer le type de sécurité de la définition d'image en TrustedLaunchSupported." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      A golden image must not contain the Azure Virtual Desktop Agent: an image that has joined a host pool carries a registration token that expires, so the hosts created from it later fail to join new host pools. Rebuild the image from the last snapshot taken before the agent was installed, generalize it and capture a new version; the host pool deployment installs the agent on each new session host.
    fr: |
      Une image de référence ne doit pas contenir l'agent Azure Virtual Desktop : une image qui a rejoint un pool d'hôtes porte un jeton d'inscription qui expire, et les hôtes créés plus tard à partir d'elle ne parviennent pas à rejoindre de nouveaux pools d'hôtes. Reconstruisez l'image à partir du dernier instantané pris avant l'installation de l'agent, généralisez-la et capturez une nouvelle version ; le déploiement du pool d'hôtes installe l'agent sur chaque nouvel hôte de session.
  options:
    a:
      en: The problem comes from the agent and expired token baked into the image; a new key for HP-Prod doesn't remove them from version 1.0.0.
      fr: Le problème vient de l'agent et du jeton expiré intégrés à l'image ; une nouvelle clé pour HP-Prod ne les retire pas de la version 1.0.0.
    c:
      en: Replicas affect where and how fast hosts deploy, not their registration with the host pool.
      fr: Les réplicas déterminent où et à quelle vitesse les hôtes se déploient, pas leur inscription dans le pool d'hôtes.
    d:
      en: The security type controls Trusted launch support; it has nothing to do with agent registration.
      fr: Le type de sécurité contrôle la prise en charge de Trusted launch ; il n'a aucun rapport avec l'inscription de l'agent.
references:
  - title: Create a golden image in Azure
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/set-up-golden-image
