id: az140-1e-tl-security-type
objective: "1.5.7"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Contoso has a generation 2 build VM named **VM-Gold** that was deployed as a Trusted launch virtual machine. VM-Gold contains the applications for an Azure Virtual Desktop host pool whose session hosts are all Trusted launch VMs.

    You plan to open VM-Gold in the Azure portal, select **Capture**, and store the result as an image version in a new image definition of the Azure Compute Gallery **galAvd**.

    Which security type should you set on the new image definition?
  fr: |
    Contoso dispose d'une machine virtuelle de build de génération 2 nommée **VM-Gold**, déployée comme machine virtuelle Trusted launch. VM-Gold contient les applications d'un pool d'hôtes Azure Virtual Desktop dont tous les hôtes de session sont des machines virtuelles Trusted launch.

    Vous prévoyez d'ouvrir VM-Gold dans le portail Azure, de sélectionner **Capturer** et de stocker le résultat comme version d'image dans une nouvelle définition d'image de la galerie Azure Compute Gallery **galAvd**.

    Quel type de sécurité devez-vous définir sur la nouvelle définition d'image ?
body:
  options:
    - { id: a, text: Standard }
    - { id: b, text: TrustedLaunchSupported }
    - { id: c, text: ConfidentialVmSupported }
    - { id: d, text: TrustedLaunch }
answer: { optionId: d }
explanation:
  correct:
    en: When the source is a capture of a Trusted launch VM (or its managed OS disk or snapshot), the image definition must have the security type TrustedLaunch. The resulting image versions can be used to create Trusted launch VMs only, which suits a host pool of Trusted launch session hosts.
    fr: "Quand la source est la capture d'une machine virtuelle Trusted launch (ou de son disque de système d'exploitation managé ou de son instantané), la définition d'image doit avoir le type de sécurité TrustedLaunch. Les versions d'image obtenues ne permettent de créer que des machines virtuelles Trusted launch, ce qui convient à un pool d'hôtes de session Trusted launch."
  options:
    a: { en: "Standard is for images of VMs without Trusted launch; a Trusted launch VM capture needs the TrustedLaunch security type.", fr: "Standard concerne les images de machines virtuelles sans Trusted launch ; la capture d'une machine virtuelle Trusted launch exige le type de sécurité TrustedLaunch." }
    b: { en: "TrustedLaunchSupported is for Gen2 sources that aren't Trusted launch VMs, such as a Gen2 VHD, managed image or gallery image version.", fr: "TrustedLaunchSupported concerne les sources Gen2 qui ne sont pas des machines virtuelles Trusted launch, comme un VHD, une image managée ou une version d'image de galerie Gen2." }
    c: { en: "ConfidentialVmSupported is for images meant for confidential VMs, not for a Trusted launch VM capture.", fr: "ConfidentialVmSupported concerne les images destinées aux machines virtuelles confidentielles, pas la capture d'une machine virtuelle Trusted launch." }
references:
  - title: Deploy a virtual machine with Trusted Launch enabled
    url: https://learn.microsoft.com/en-us/azure/virtual-machines/trusted-launch-portal
  - title: az sig image-definition
    url: https://learn.microsoft.com/en-us/cli/azure/sig/image-definition?view=azure-cli-latest
