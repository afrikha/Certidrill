id: az140-1b-share-ntfs-order
objective: "1.2.4"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    You created an Azure file share named **profiles** in a storage account named **stavdprof09** that is joined to the contoso.com AD DS domain. The default share-level permission is Storage File Data SMB Share Contributor. You configured VHDLocations on the session hosts of an Azure Virtual Desktop host pool.

    You need to set the recommended NTFS permissions on the share by using the storage account key, and then confirm that FSLogix creates profiles in the share.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Vous avez créé un partage de fichiers Azure nommé **profiles** dans un compte de stockage nommé **stavdprof09**, joint au domaine AD DS contoso.com. L'autorisation par défaut au niveau du partage est Storage File Data SMB Share Contributor. Vous avez configuré VHDLocations sur les hôtes de session d'un pool d'hôtes Azure Virtual Desktop.

    Vous devez définir les autorisations NTFS recommandées sur le partage à l'aide de la clé du compte de stockage, puis vérifier que FSLogix crée les profils dans le partage.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: key, text: { en: "Copy key1 from the Access keys page of stavdprof09.", fr: "Copier key1 depuis la page Clés d'accès de stavdprof09." } }
    - { id: mount, text: { en: "On a domain-joined session host, map the share with net use, the key and the user Azure\\stavdprof09.", fr: "Sur un hôte de session joint au domaine, mapper le partage avec net use, la clé et l'utilisateur Azure\\stavdprof09." } }
    - { id: acl, text: { en: "Run icacls to remove inheritance and grant the CREATOR OWNER, administrators and users entries.", fr: "Exécuter icacls pour supprimer l'héritage et accorder les entrées CREATOR OWNER, administrateurs et utilisateurs." } }
    - { id: test, text: { en: "Sign in as a test user without a local profile and check for a folder named with the user's SID and user name.", fr: "Se connecter en tant qu'utilisateur de test sans profil local et vérifier la présence d'un dossier nommé avec le SID et le nom de l'utilisateur." } }
    - { id: nokey, text: { en: "Disable storage account key access on stavdprof09.", fr: "Désactiver l'accès par clé du compte de stockage sur stavdprof09." } }
    - { id: regen, text: { en: "Regenerate key2 of stavdprof09.", fr: "Régénérer key2 de stavdprof09." } }
answer:
  sequence: [ key, mount, acl, test ]
explanation:
  correct:
    en: |
      You copy a storage account key, map the share with it (user name `Azure\<storage-account-name>`), which gives administrator-level access to the share, and set the NTFS permissions with icacls. A test user without a local profile then signs in; FSLogix creates a folder named `<SID>_<username>` by default that contains the container.
    fr: |
      Vous copiez une clé du compte de stockage, mappez le partage avec elle (nom d'utilisateur `Azure\<storage-account-name>`), ce qui donne un accès de niveau administrateur au partage, puis définissez les autorisations NTFS avec icacls. Un utilisateur de test sans profil local se connecte ensuite ; FSLogix crée par défaut un dossier nommé `<SID>_<username>` qui contient le conteneur.
  options:
    nokey: { en: "Disabling key access would prevent mounting the share with the key, and the AD DS procedure requires key access to stay enabled.", fr: "Désactiver l'accès par clé empêcherait de monter le partage avec la clé, et la procédure AD DS exige que l'accès par clé reste activé." }
    regen: { en: "Regenerating a key isn't needed to set permissions; it only invalidates the previous value of that key.", fr: "Régénérer une clé n'est pas nécessaire pour définir les autorisations ; cela invalide seulement la valeur précédente de cette clé." }
references:
  - title: Store FSLogix profile containers on Azure Files and Active Directory Domain Services or Microsoft Entra Domain Services
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/fslogix-profile-container-configure-azure-files-active-directory
  - title: Configure SMB Storage Permissions
    url: https://learn.microsoft.com/en-us/fslogix/how-to-configure-storage-permissions
