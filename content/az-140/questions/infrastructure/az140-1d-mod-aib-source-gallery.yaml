id: az140-1d-mod-aib-source-gallery
objective: "1.5.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    The platform team of Litware publishes a generalized base image as version 2.0.0 of an image definition named **win11-base** in an Azure Compute Gallery. You need to modify that image for the sales department: add a CRM client and distribute the result to another image definition named **win11-sales**.

    You will use Azure VM Image Builder.

    Which source type should you set in the image template?
  fr: |
    L'équipe plateforme de Litware publie une image de base généralisée sous la forme de la version 2.0.0 d'une définition d'image nommée **win11-base** dans une galerie Azure Compute Gallery. Vous devez modifier cette image pour le service commercial : ajouter un client CRM et distribuer le résultat vers une autre définition d'image nommée **win11-sales**.

    Vous allez utiliser Azure VM Image Builder.

    Quel type de source devez-vous définir dans le modèle d'image ?
body:
  options:
    - { id: a, text: PlatformImage }
    - { id: b, text: ManagedImage }
    - { id: c, text: SharedImageVersion }
    - { id: d, text: VHD }
answer: { optionId: c }
explanation:
  correct:
    en: |
      `SharedImageVersion` starts the build from an Azure Compute Gallery image version, referenced by its resource ID. Image Builder supports only generalized images as sources, which is the case of win11-base. The customizers then add the CRM client, and the `SharedImage` distribution creates a version of win11-sales.
    fr: |
      `SharedImageVersion` démarre le build à partir d'une version d'image Azure Compute Gallery, référencée par son ID de ressource. Image Builder ne prend en charge que des images généralisées comme sources, ce qui est le cas de win11-base. Les personnalisateurs ajoutent ensuite le client CRM, et la distribution `SharedImage` crée une version de win11-sales.
  options:
    a:
      en: PlatformImage starts from an Azure Marketplace image, so the platform team's customizations would be lost.
      fr: |
        PlatformImage part d'une image de la Place de marché Azure : les personnalisations de l'équipe plateforme seraient perdues.
    b:
      en: ManagedImage starts from a standalone managed image, not from a gallery image version.
      fr: ManagedImage part d'une image managée autonome, pas d'une version d'image de galerie.
    d:
      en: VHD is a distribution target of Image Builder, not a source type.
      fr: VHD est une cible de distribution d'Image Builder, pas un type de source.
references:
  - title: Create an Azure Image Builder Bicep or ARM template JSON template
    url: https://learn.microsoft.com/en-us/azure/virtual-machines/linux/image-builder-json
