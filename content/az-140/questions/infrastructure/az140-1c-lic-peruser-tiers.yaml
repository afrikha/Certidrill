id: az140-1c-lic-peruser-tiers
objective: "1.3.3"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Wingtip Toys enrolled an Azure subscription named Sub-Partners in per-user access pricing. Sub-Partners contains two host pools for external customers:

    - **HP-Apps** publishes RemoteApps only.
    - **HP-Desk** publishes a full desktop and RemoteApps.

    During October, the following external users have access:

    | User | Assignments | Activity in October |
    | --- | --- | --- |
    | User1 | RemoteApp application group in HP-Apps | Launched a RemoteApp on 12 different days |
    | User2 | Desktop and RemoteApp application groups in HP-Desk | Connected to the desktop once and used RemoteApps every day |
    | User3 | RemoteApp application group in HP-Apps and desktop application group in HP-Desk | Didn't connect |

    What is charged to Sub-Partners for each user in October? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Wingtip Toys a inscrit un abonnement Azure nommé Sub-Partners à la tarification de l'accès par utilisateur. Sub-Partners contient deux pools d'hôtes destinés à des clients externes :

    - **HP-Apps** ne publie que des RemoteApp.
    - **HP-Desk** publie un bureau complet et des RemoteApp.

    En octobre, les utilisateurs externes suivants ont un accès :

    | Utilisateur | Attributions | Activité en octobre |
    | --- | --- | --- |
    | User1 | Groupe d'applications RemoteApp de HP-Apps | A lancé une RemoteApp 12 jours différents |
    | User2 | Groupes d'applications de bureau et RemoteApp de HP-Desk | S'est connecté une fois au bureau et a utilisé des RemoteApp tous les jours |
    | User3 | Groupe d'applications RemoteApp de HP-Apps et groupe d'applications de bureau de HP-Desk | Ne s'est pas connecté |

    Qu'est-ce qui est facturé à Sub-Partners pour chaque utilisateur en octobre ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      User1: [[u1]]

      User2: [[u2]]

      User3: [[u3]]
    fr: |
      User1 : [[u1]]

      User2 : [[u2]]

      User3 : [[u3]]
  slots:
    - id: u1
      options:
        - { id: none, text: { en: "No charge", fr: "Aucuns frais" } }
        - { id: apps, text: { en: "One Apps charge", fr: "Une facturation Apps" } }
        - { id: daily, text: { en: "One Apps charge for each day of use", fr: "Une facturation Apps par jour d'utilisation" } }
        - { id: desk, text: { en: "One Desktops + apps charge", fr: "Une facturation Desktops + apps" } }
    - id: u2
      options:
        - { id: apps, text: { en: "One Apps charge", fr: "Une facturation Apps" } }
        - { id: desk, text: { en: "One Desktops + apps charge", fr: "Une facturation Desktops + apps" } }
        - { id: both, text: { en: "One Apps charge and one Desktops + apps charge", fr: "Une facturation Apps et une facturation Desktops + apps" } }
    - id: u3
      options:
        - { id: none, text: { en: "No charge", fr: "Aucuns frais" } }
        - { id: apps, text: { en: "One Apps charge", fr: "Une facturation Apps" } }
        - { id: desk, text: { en: "One Desktops + apps charge", fr: "Une facturation Desktops + apps" } }
answer:
  values: { u1: apps, u2: desk, u3: none }
explanation:
  correct:
    en: |
      Per-user access pricing charges a flat monthly price only to users who connect at least once in the billing month, whatever the number of days or hours. A user who accessed only RemoteApps is charged the Apps tier; a user who accessed at least one full desktop is charged the Desktops + apps tier, which also covers apps. A user who doesn't connect incurs no charge, even with assignments.
    fr: |
      La tarification de l'accès par utilisateur ne facture un prix mensuel forfaitaire qu'aux utilisateurs qui se connectent au moins une fois dans le mois de facturation, quel que soit le nombre de jours ou d'heures. Un utilisateur qui n'a accédé qu'à des RemoteApp est facturé au niveau Apps ; un utilisateur qui a accédé à au moins un bureau complet est facturé au niveau Desktops + apps, qui couvre aussi les applications. Un utilisateur qui ne se connecte pas n'entraîne aucuns frais, même s'il a des attributions.
  options:
    daily: { en: "The charge is flat for the billing period, not per day of use.", fr: "La facturation est forfaitaire pour la période de facturation, pas par jour d'utilisation." }
    both: { en: "At most one access charge is issued per user per billing period; the desktop tier already includes apps.", fr: "Au plus une facturation d'accès est émise par utilisateur et par période de facturation ; le niveau bureau inclut déjà les applications." }
references:
  - title: Licensing Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/licensing
