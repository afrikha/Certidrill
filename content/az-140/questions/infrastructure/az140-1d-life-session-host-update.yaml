id: az140-1d-life-session-host-update
objective: "1.5.4"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    You have an Azure Virtual Desktop pooled host pool named **HP-Call** that was created with a session host configuration. HP-Call contains 12 session hosts deployed from version 4.1.0 of an Azure Compute Gallery image in the same subscription. An autoscale scaling plan is assigned to HP-Call and enabled.

    You have tested version 4.2.0 of the image. You need to move all the session hosts of HP-Call to version 4.2.0 by using the built-in capabilities of Azure Virtual Desktop.

    Which two actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un pool d'hôtes regroupé Azure Virtual Desktop nommé **HP-Call** créé avec une configuration d'hôte de session. HP-Call contient 12 hôtes de session déployés à partir de la version 4.1.0 d'une image Azure Compute Gallery du même abonnement. Un plan de mise à l'échelle automatique est attribué à HP-Call et activé.

    Vous avez testé la version 4.2.0 de l'image. Vous devez faire passer tous les hôtes de session de HP-Call à la version 4.2.0 avec les fonctionnalités intégrées d'Azure Virtual Desktop.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Disable the scaling plan of HP-Call until the update finishes.", fr: "Désactiver le plan de mise à l'échelle de HP-Call jusqu'à la fin de la mise à jour." } }
    - { id: b, text: { en: "Turn on drain mode on all the session hosts before the update starts.", fr: "Activer le mode drainage sur tous les hôtes de session avant le début de la mise à jour." } }
    - { id: c, text: { en: "Schedule a session host update that uses image version 4.2.0.", fr: "Planifier une mise à jour des hôtes de session qui utilise la version d'image 4.2.0." } }
    - { id: d, text: { en: "Generate a new registration key for HP-Call.", fr: "Générer une nouvelle clé d'inscription pour HP-Call." } }
    - { id: e, text: { en: "Delete image version 4.1.0 from the gallery.", fr: "Supprimer la version d'image 4.1.0 de la galerie." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |
      Session host update is available for host pools that use a session host configuration: you edit the configuration with the new image and schedule the update, which replaces the hosts in batches, after one initial host, and notifies users before signing them out. Microsoft says to disable autoscale before the update and keep it disabled until the update finishes, because an enabled scaling plan can cause a runtime error.
    fr: |
      La mise à jour des hôtes de session est disponible pour les pools d'hôtes qui utilisent une configuration d'hôte de session : vous modifiez la configuration avec la nouvelle image et planifiez la mise à jour, qui remplace les hôtes par lots, après un premier hôte initial, et prévient les utilisateurs avant de les déconnecter. Microsoft indique de désactiver la mise à l'échelle automatique avant la mise à jour et de la laisser désactivée jusqu'à la fin, car un plan de mise à l'échelle activé peut provoquer une erreur d'exécution.
  options:
    b:
      en: The update drains each batch of session hosts itself; draining every host first would block new sessions on the whole pool.
      fr: La mise à jour draine elle-même chaque lot d'hôtes de session ; drainer tous les hôtes au préalable bloquerait les nouvelles sessions sur tout le pool.
    d:
      en: The service registers the new session hosts itself; with a session host configuration you don't retrieve a registration key for them.
      fr: Le service inscrit lui-même les nouveaux hôtes de session ; avec une configuration d'hôte de session, vous ne récupérez pas de clé d'inscription pour eux.
    e:
      en: Version 4.1.0 is your rollback target and is in use until the update completes; deleting it isn't part of the update.
      fr: La version 4.1.0 est votre cible de retour arrière et reste utilisée jusqu'à la fin de la mise à jour ; la supprimer ne fait pas partie de la mise à jour.
references:
  - title: Session host update for Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/session-host-update
