id: az140-1c-lic-windows-client-type
objective: "1.3.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Proseware, Inc. deploys Azure Virtual Desktop session hosts with a pipeline that runs `New-AzVM` from a Windows 11 Enterprise multi-session image. All users are licensed with Microsoft 365 E3.

    The Azure invoice shows that the session host VMs are billed at a rate that includes a Windows license.

    You need to stop paying for a Windows license on the existing session hosts. The solution must not redeploy the VMs.

    What should you do?
  fr: |
    Proseware, Inc. déploie des hôtes de session Azure Virtual Desktop avec un pipeline qui exécute `New-AzVM` à partir d'une image Windows 11 Entreprise multisession. Tous les utilisateurs sont licenciés avec Microsoft 365 E3.

    La facture Azure montre que les machines virtuelles des hôtes de session sont facturées à un tarif qui inclut une licence Windows.

    Vous devez cesser de payer une licence Windows pour les hôtes de session existants. La solution ne doit pas redéployer les machines virtuelles.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Set the LicenseType property of each VM to Windows_Server", fr: "Définir la propriété LicenseType de chaque machine virtuelle sur Windows_Server" } }
    - { id: b, text: { en: "Set the LicenseType property of each VM to Windows_Client", fr: "Définir la propriété LicenseType de chaque machine virtuelle sur Windows_Client" } }
    - { id: c, text: { en: "Enroll the subscription in per-user access pricing", fr: "Inscrire l'abonnement à la tarification de l'accès par utilisateur" } }
    - { id: d, text: { en: "Point the session hosts to an RDS license server", fr: "Diriger les hôtes de session vers un serveur de licences RDS" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Users with an eligible license can run Windows client session hosts without paying for another Windows license by applying the Windows_Client license type. The portal and the Microsoft templates apply it automatically; for VMs created another way, set `$vm.LicenseType = "Windows_Client"` and run `Update-AzVM`.
    fr: |
      Des utilisateurs disposant d'une licence éligible peuvent exécuter des hôtes de session Windows client sans payer une autre licence Windows en appliquant le type de licence Windows_Client. Le portail et les modèles Microsoft l'appliquent automatiquement ; pour les machines virtuelles créées autrement, définissez `$vm.LicenseType = "Windows_Client"` puis exécutez `Update-AzVM`.
  options:
    a: { en: "Windows_Server is the Azure Hybrid Benefit license type for Windows Server VMs, not for Windows 11.", fr: "Windows_Server est le type de licence Azure Hybrid Benefit des machines virtuelles Windows Server, pas de Windows 11." }
    c: { en: "Per-user access pricing licenses external users; it doesn't change how the VMs are billed and would add charges for licensed employees.", fr: "La tarification de l'accès par utilisateur licencie des utilisateurs externes ; elle ne change pas la facturation des machines virtuelles et ajouterait des frais pour des employés déjà licenciés." }
    d: { en: "An RDS license server issues CALs for Windows Server session hosts; it has no effect on Windows 11 VM billing.", fr: "Un serveur de licences RDS délivre des CAL pour les hôtes de session Windows Server ; il n'a aucun effet sur la facturation des machines virtuelles Windows 11." }
references:
  - title: Apply Windows license to session host virtual machines
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/apply-windows-license
