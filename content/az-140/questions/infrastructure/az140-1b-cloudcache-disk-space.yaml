id: az140-1b-cloudcache-disk-space
objective: "1.2.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    You have an Azure Virtual Desktop pooled host pool named **HP-Ops** that uses FSLogix Cloud Cache with two SMB providers in different regions. Breadth-first load balancing sends users to a different session host at almost every sign-in.

    The OS disks of the session hosts are filling up with data in `C:\ProgramData\FSLogix\Cache`, including data of users who signed out days ago.

    You need to reduce the disk space used on the session hosts. The solution must keep writing profile changes to both providers.

    What should you do?
  fr: |
    Vous disposez d'un pool d'hôtes regroupé Azure Virtual Desktop nommé **HP-Ops** qui utilise FSLogix Cloud Cache avec deux fournisseurs SMB dans des régions différentes. L'équilibrage de charge en largeur (breadth-first) envoie les utilisateurs sur un hôte de session différent à presque chaque ouverture de session.

    Les disques du système d'exploitation des hôtes de session se remplissent de données dans `C:\ProgramData\FSLogix\Cache`, y compris des données d'utilisateurs qui ont fermé leur session il y a plusieurs jours.

    Vous devez réduire l'espace disque utilisé sur les hôtes de session. La solution doit continuer à écrire les modifications des profils dans les deux fournisseurs.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Set ClearCacheOnLogoff to 1 so that the local cache is deleted at sign-out.", fr: "Définir ClearCacheOnLogoff sur 1 pour que le cache local soit supprimé à la fermeture de session." }
    - id: b
      text: { en: "Lower SizeInMBs to 10000 so that each local cache is smaller.", fr: "Abaisser SizeInMBs à 10000 pour que chaque cache local soit plus petit." }
    - id: c
      text: { en: "Replace CCDLocations with VHDLocations that lists both providers.", fr: "Remplacer CCDLocations par VHDLocations en listant les deux fournisseurs." }
    - id: d
      text: { en: "Set DeleteLocalProfileWhenVHDShouldApply to 1 so that local data is removed.", fr: "Définir DeleteLocalProfileWhenVHDShouldApply sur 1 pour que les données locales soient supprimées." }
answer: { optionId: a }
explanation:
  correct:
    en: "Cloud Cache keeps a local copy of each user's container on the session host. Microsoft recommends ClearCacheOnLogoff = 1 for pooled desktops: the local cache is removed when the user signs out, which saves disk space and reduces the risk of data loss, while Cloud Cache keeps writing to all the providers during the session."
    fr: "Cloud Cache conserve une copie locale du conteneur de chaque utilisateur sur l'hôte de session. Microsoft recommande ClearCacheOnLogoff = 1 pour les bureaux regroupés : le cache local est supprimé quand l'utilisateur ferme sa session, ce qui économise de l'espace disque et réduit le risque de perte de données, tandis que Cloud Cache continue d'écrire dans tous les fournisseurs pendant la session."
  options:
    b: { en: "SizeInMBs can't be decreased for existing containers, and it limits the container size, not the number of stale caches left on the host.", fr: "SizeInMBs ne peut pas être diminué pour les conteneurs existants, et il limite la taille du conteneur, pas le nombre de caches obsolètes laissés sur l'hôte." }
    c: { en: "VHDLocations would remove Cloud Cache: a container would be written to only one location.", fr: "VHDLocations supprimerait Cloud Cache : un conteneur ne serait écrit que dans un seul emplacement." }
    d: { en: "This value deletes an existing local Windows profile that would block the container; it doesn't clean the Cloud Cache folder.", fr: "Cette valeur supprime un profil Windows local existant qui bloquerait le conteneur ; elle ne nettoie pas le dossier de Cloud Cache." }
references:
  - title: "Tutorial: Configure profile containers with Cloud Cache"
    url: https://learn.microsoft.com/en-us/fslogix/tutorial-cloud-cache-containers
  - title: Configuration Setting Reference
    url: https://learn.microsoft.com/en-us/fslogix/reference-configuration-settings
