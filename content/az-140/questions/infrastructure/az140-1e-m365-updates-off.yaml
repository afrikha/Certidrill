id: az140-1e-m365-updates-off
objective: "1.5.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Fabrikam installs Microsoft 365 Apps for enterprise in the custom image of an Azure Virtual Desktop pooled host pool by using the Office Deployment Tool and a configuration.xml file. Users sign in to the session hosts all day.

    You need to make sure that Microsoft 365 Apps on the session hosts change only when a new image version is deployed.

    Which element should you include in configuration.xml?
  fr: |
    Fabrikam installe Microsoft 365 Apps for enterprise dans l'image personnalisée d'un pool d'hôtes regroupé Azure Virtual Desktop à l'aide de l'outil de déploiement d'Office (Office Deployment Tool) et d'un fichier configuration.xml. Les utilisateurs se connectent aux hôtes de session toute la journée.

    Vous devez vous assurer que Microsoft 365 Apps ne change sur les hôtes de session que lorsqu'une nouvelle version d'image est déployée.

    Quel élément devez-vous inclure dans configuration.xml ?
body:
  options:
    - id: a
      text: "`<Property Name=\"SharedComputerLicensing\" Value=\"1\"/>`"
    - id: b
      text: "`<Property Name=\"FORCEAPPSHUTDOWN\" Value=\"TRUE\"/>`"
    - id: c
      text: "`<Updates Enabled=\"FALSE\"/>`"
    - id: d
      text: "`<RemoveMSI/>`"
answer: { optionId: c }
explanation:
  correct:
    en: Microsoft recommends disabling automatic updates of Microsoft 365 Apps in the image with `<Updates Enabled="FALSE"/>`. Updates are then added to a new version of the custom image and redeployed regularly, so Office apps aren't updated while users are working.
    fr: "Microsoft recommande de désactiver les mises à jour automatiques de Microsoft 365 Apps dans l'image avec `<Updates Enabled=\"FALSE\"/>`. Les mises à jour sont alors ajoutées à une nouvelle version de l'image personnalisée et redéployées régulièrement : les applications Office ne sont pas mises à jour pendant que les utilisateurs travaillent."
  options:
    a: { en: "SharedComputerLicensing enables shared computer activation, which multi-session hosts need, but it doesn't control updates.", fr: "SharedComputerLicensing active l'activation d'ordinateurs partagés, nécessaire aux hôtes multisession, mais ne contrôle pas les mises à jour." }
    b: { en: "FORCEAPPSHUTDOWN closes running Office apps during the installation; it doesn't stop later automatic updates.", fr: "FORCEAPPSHUTDOWN ferme les applications Office ouvertes pendant l'installation ; il n'empêche pas les mises à jour automatiques ultérieures." }
    d: { en: "RemoveMSI removes existing MSI-based Office installations before the install; it has no effect on updates.", fr: "RemoveMSI supprime les installations d'Office de type MSI existantes avant l'installation ; il n'a aucun effet sur les mises à jour." }
references:
  - title: Install Office on a custom VHD image
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/install-office-on-wvd-master-image
