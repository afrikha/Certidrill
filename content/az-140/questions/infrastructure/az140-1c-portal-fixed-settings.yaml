id: az140-1c-portal-fixed-settings
objective: "1.4.1"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    You use the Azure portal to create an Azure Virtual Desktop host pool named HP1 with the following settings on the **Basics** tab:

    - **Deployment scope**: Geographical
    - **Host pool type**: Pooled
    - **Load balancing algorithm**: Breadth-first
    - **Management approach**: Standard

    After HP1 is created, the requirements change.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous utilisez le portail Azure pour créer un pool d'hôtes Azure Virtual Desktop nommé HP1 avec les paramètres suivants dans l'onglet **Basics** :

    - **Deployment scope** : Geographical
    - **Host pool type** : Pooled
    - **Load balancing algorithm** : Breadth-first
    - **Management approach** : Standard

    Une fois HP1 créé, les exigences changent.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          You can change the load balancing algorithm of HP1 to depth-first in its Properties.
        fr: |
          Vous pouvez passer l'algorithme d'équilibrage de charge de HP1 en depth-first dans ses propriétés.
    - id: s2
      text:
        en: |
          You can change the deployment scope of HP1 to Regional.
        fr: |
          Vous pouvez passer l'étendue de déploiement de HP1 en Regional.
    - id: s3
      text:
        en: |
          You can change HP1 to a personal host pool.
        fr: |
          Vous pouvez transformer HP1 en pool d'hôtes personnel.
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: |
      The load balancing algorithm of a pooled host pool can be switched at any time in the Properties page. The deployment scope (regional or geographical metadata) can't be changed after creation, and neither can the host pool type or the management approach; changing them means creating a new host pool.
    fr: |
      L'algorithme d'équilibrage de charge d'un pool regroupé peut être changé à tout moment dans la page des propriétés. L'étendue de déploiement (métadonnées régionales ou géographiques) ne peut pas être modifiée après la création, pas plus que le type de pool d'hôtes ou l'approche de gestion ; les changer impose de créer un nouveau pool d'hôtes.
references:
  - title: Deploy Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/deploy-azure-virtual-desktop
  - title: Configure host pool load balancing in Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/host-pool-load-balancing
