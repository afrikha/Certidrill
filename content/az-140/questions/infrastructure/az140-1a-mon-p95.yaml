id: az140-1a-mon-p95
objective: "1.1.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You review the **Connection Performance** tab of Azure Virtual Desktop Insights for a host pool named **HP1**. For one gateway region, the **RTT median and 95th percentile for all regions** graph shows a median round-trip time of 45 ms and a 95th percentile of 310 ms.

    What does this indicate?
  fr: |
    Vous examinez l'onglet **Connection Performance** d'Azure Virtual Desktop Insights pour un pool d'hôtes nommé **HP1**. Pour une région de passerelle, le graphique **RTT median and 95th percentile for all regions** affiche une durée aller-retour médiane de 45 ms et un 95e centile de 310 ms.

    Qu'est-ce que cela indique ?
body:
  options:
    - id: a
      text: { en: "All the users of this gateway region have a consistently high round-trip time.", fr: "Tous les utilisateurs de cette région de passerelle ont une durée aller-retour constamment élevée." }
    - id: b
      text: { en: "Some users of this gateway region experience periods of much higher latency.", fr: "Certains utilisateurs de cette région de passerelle subissent des périodes de latence nettement plus élevée." }
    - id: c
      text: { en: "The sessions through this gateway region use TCP instead of UDP.", fr: "Les sessions passant par cette région de passerelle utilisent TCP au lieu d'UDP." }
    - id: d
      text: { en: "The session hosts of HP1 are overloaded during the sign-in peak.", fr: "Les hôtes de session de HP1 sont surchargés pendant le pic de connexions." }
answer: { optionId: b }
explanation:
  correct:
    en: |
      A median of 45 ms means that most connections have good latency. A 95th percentile substantially above the median indicates that some users experience periods of higher latency; you then select the gateway to see its top users by round-trip time and drill down into their connections.
    fr: |
      Une médiane de 45 ms signifie que la plupart des connexions ont une bonne latence. Un 95e centile nettement supérieur à la médiane indique que certains utilisateurs subissent des périodes de latence plus élevée ; vous sélectionnez alors la passerelle pour voir ses utilisateurs ayant la durée aller-retour la plus élevée et examiner leurs connexions en détail.
  options:
    a: { en: "With a median of 45 ms, most connections have a low round-trip time.", fr: "Avec une médiane de 45 ms, la plupart des connexions ont une faible durée aller-retour." }
    c: { en: "Round-trip time percentiles don't show the transport; the Transport pivot of Connection Reliability does.", fr: "Les centiles de durée aller-retour n'indiquent pas le transport ; c'est l'axe Transport de Connection Reliability qui le fait." }
    d: { en: "The graph measures network round-trip time; it doesn't show session host load.", fr: "Le graphique mesure la durée aller-retour réseau ; il n'indique pas la charge des hôtes de session." }
references:
  - title: Use cases for Azure Virtual Desktop Insights
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/insights-use-cases
