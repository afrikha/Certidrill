id: az140-1b-anf-objects
objective: "1.2.5"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    You are deploying Azure NetApp Files to store the FSLogix profile containers of an Azure Virtual Desktop host pool.

    Which Azure NetApp Files component matches each description? To answer, drag the appropriate components to the correct descriptions. Each component may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous déployez Azure NetApp Files pour stocker les conteneurs de profils FSLogix d'un pool d'hôtes Azure Virtual Desktop.

    Quel composant Azure NetApp Files correspond à chaque description ? Pour répondre, faites glisser les composants appropriés vers les descriptions correspondantes. Chaque composant peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: account, text: { en: "NetApp account", fr: "Compte NetApp" } }
    - { id: pool, text: { en: "Capacity pool", fr: "Pool de capacité" } }
    - { id: volume, text: { en: "Volume", fr: "Volume" } }
    - { id: subnet, text: { en: "Delegated subnet", fr: "Sous-réseau délégué" } }
    - { id: snap, text: { en: "Snapshot", fr: "Instantané" } }
    - { id: pe, text: { en: "Private endpoint", fr: "Point de terminaison privé" } }
  targets:
    - { id: t1, text: { en: "Holds the Active Directory connection", fr: "Contient la connexion Active Directory" } }
    - { id: t2, text: { en: "Defines the service level and the QoS type", fr: "Définit le niveau de service et le type de QoS" } }
    - { id: t3, text: { en: "Has the Continuous Availability setting and the SMB share path", fr: "Possède le paramètre de disponibilité continue et le chemin du partage SMB" } }
    - { id: t4, text: { en: "Provides the IP address that session hosts connect to", fr: "Fournit l'adresse IP à laquelle les hôtes de session se connectent" } }
answer:
  mapping: { t1: account, t2: pool, t3: volume, t4: subnet }
explanation:
  correct:
    en: |
      The Active Directory connection is configured once per NetApp account. A capacity pool, created in the account, has a size, a service level (Standard, Premium, Ultra or Flexible) and a QoS type. Volumes are created in a pool; an SMB volume has the share path and the Continuous Availability option. Each volume gets its IP address from the subnet delegated to Microsoft.NetApp/volumes.
    fr: |
      La connexion Active Directory est configurée une fois par compte NetApp. Un pool de capacité, créé dans le compte, possède une taille, un niveau de service (Standard, Premium, Ultra ou Flexible) et un type de QoS. Les volumes sont créés dans un pool ; un volume SMB possède le chemin du partage et l'option de disponibilité continue. Chaque volume obtient son adresse IP dans le sous-réseau délégué à Microsoft.NetApp/volumes.
  options:
    snap: { en: "A snapshot is a point-in-time copy of a volume, used for recovery.", fr: "Un instantané est une copie à un instant donné d'un volume, utilisée pour la récupération." }
    pe: { en: "Azure NetApp Files volumes are injected into the delegated subnet; they aren't reached through private endpoints.", fr: "Les volumes Azure NetApp Files sont injectés dans le sous-réseau délégué ; ils ne sont pas joints par des points de terminaison privés." }
references:
  - title: Create a capacity pool for Azure NetApp Files
    url: https://learn.microsoft.com/en-us/azure/azure-netapp-files/azure-netapp-files-set-up-capacity-pool
  - title: Delegate a subnet to Azure NetApp Files
    url: https://learn.microsoft.com/en-us/azure/azure-netapp-files/azure-netapp-files-delegate-subnet
