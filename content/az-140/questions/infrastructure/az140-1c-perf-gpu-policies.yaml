id: az140-1c-perf-gpu-policies
objective: "1.3.5"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    You have an Azure Virtual Desktop host pool whose session hosts are NVadsA10 v5-series VMs with the NVIDIA GRID driver installed. You plan a Group Policy object for the session hosts by using the Azure Virtual Desktop administrative template.

    Which policy setting should you enable to meet each requirement? To answer, drag the appropriate policy settings to the correct requirements. Each policy setting may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un pool d'hôtes Azure Virtual Desktop dont les hôtes de session sont des machines virtuelles de la série NVadsA10 v5 sur lesquelles le pilote NVIDIA GRID est installé. Vous préparez un objet de stratégie de groupe pour les hôtes de session à l'aide du modèle d'administration Azure Virtual Desktop.

    Quel paramètre de stratégie devez-vous activer pour répondre à chaque exigence ? Pour répondre, faites glisser les paramètres de stratégie appropriés vers les exigences correspondantes. Chaque paramètre de stratégie peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: hw, text: Use hardware graphics adapters for all Remote Desktop Services sessions }
    - { id: avc, text: Configure H.264/AVC hardware encoding for Remote Desktop connections }
    - { id: avc444, text: Prioritize H.264/AVC 444 Graphics mode for Remote Desktop connections }
    - { id: hevc, text: Configure H.265/HEVC hardware encoding for Remote Desktop Connections }
    - { id: depth, text: Limit maximum color depth }
  targets:
    - id: t1
      text: { en: "Applications render on the GPU", fr: "Les applications effectuent leur rendu sur le GPU" }
    - id: t2
      text: { en: "Remote frames are encoded with AVC/H.264 on the GPU", fr: "Les images distantes sont encodées en AVC/H.264 sur le GPU" }
    - id: t3
      text: { en: "Full-screen AVC video encoding is used for the session", fr: "L'encodage vidéo AVC plein écran est utilisé pour la session" }
    - id: t4
      text: { en: "Remote frames are encoded with HEVC/H.265 on the GPU", fr: "Les images distantes sont encodées en HEVC/H.265 sur le GPU" }
answer:
  mapping: { t1: hw, t2: avc, t3: avc444, t4: hevc }
explanation:
  correct:
    en: |
      Use hardware graphics adapters for all Remote Desktop Services sessions turns on GPU application rendering. Configure H.264/AVC hardware encoding enables GPU frame encoding in AVC, and Prioritize H.264/AVC 444 Graphics mode enables full-screen AVC encoding (with hardware encoding enabled, otherwise the CPU encodes). Configure H.265/HEVC hardware encoding, under the Azure Virtual Desktop node, enables HEVC GPU encoding. Restart the session hosts after the policy applies.
    fr: |
      Use hardware graphics adapters for all Remote Desktop Services sessions active le rendu des applications par le GPU. Configure H.264/AVC hardware encoding active l'encodage des images en AVC par le GPU, et Prioritize H.264/AVC 444 Graphics mode active l'encodage AVC plein écran (avec l'encodage matériel activé, sinon c'est le processeur qui encode). Configure H.265/HEVC hardware encoding, sous le nœud Azure Virtual Desktop, active l'encodage HEVC par le GPU. Redémarrez les hôtes de session une fois la stratégie appliquée.
  options:
    depth: { en: "Limit maximum color depth caps the color depth of sessions; it doesn't enable any GPU feature.", fr: "Limit maximum color depth plafonne la profondeur de couleur des sessions ; elle n'active aucune fonctionnalité GPU." }
references:
  - title: Enable GPU acceleration for Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/graphics-enable-gpu-acceleration
