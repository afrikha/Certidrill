id: az140-1c-hp-validation
objective: "1.3.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Adatum Corporation runs several production Azure Virtual Desktop host pools. After a recent service update, users reported connection issues.

    You need to recommend a way to detect issues caused by Azure Virtual Desktop service updates before the updates reach the production host pools.

    What should you recommend?
  fr: |
    Adatum Corporation exploite plusieurs pools d'hôtes Azure Virtual Desktop de production. Après une récente mise à jour du service, des utilisateurs ont signalé des problèmes de connexion.

    Vous devez recommander un moyen de détecter les problèmes causés par les mises à jour du service Azure Virtual Desktop avant qu'elles n'atteignent les pools d'hôtes de production.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "Configure scheduled agent updates on the production host pools", fr: "Configurer les mises à jour planifiées de l'agent sur les pools de production" } }
    - { id: b, text: { en: "Turn on drain mode on one session host of each production pool", fr: "Activer le mode drainage sur un hôte de session de chaque pool de production" } }
    - { id: c, text: { en: "Deploy a personal host pool for the IT team to test new images", fr: "Déployer un pool d'hôtes personnel pour que l'équipe informatique teste les nouvelles images" } }
    - { id: d, text: { en: "Deploy a non-production host pool with Validation environment set to Yes", fr: "Déployer un pool hors production avec Validation environment défini sur Yes" } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      A host pool designated as a validation environment receives service updates before the other host pools. It should mirror the production configuration, and users should connect to it regularly so that problems surface before the update reaches production.
    fr: |
      Un pool d'hôtes désigné comme environnement de validation reçoit les mises à jour du service avant les autres pools d'hôtes. Il doit refléter la configuration de production, et des utilisateurs doivent s'y connecter régulièrement pour que les problèmes apparaissent avant que la mise à jour n'atteigne la production.
  options:
    a: { en: "Scheduled agent updates choose when the agent updates are installed; they don't preview service updates.", fr: "Les mises à jour planifiées de l'agent choisissent quand installer les mises à jour de l'agent ; elles ne donnent pas d'aperçu des mises à jour du service." }
    b: { en: "Drain mode only blocks new sessions on a host; the host still gets updates at the same time as production.", fr: "Le mode drainage bloque seulement les nouvelles sessions sur un hôte ; l'hôte reçoit toujours les mises à jour en même temps que la production." }
    c: { en: "Testing images doesn't preview service updates unless the host pool is a validation environment.", fr: "Tester des images ne donne pas d'aperçu des mises à jour du service, sauf si le pool d'hôtes est un environnement de validation." }
references:
  - title: Azure Virtual Desktop terminology
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/terminology
