id: az140-1d-aib-identity-order
objective: "1.5.2"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    You plan to use Azure VM Image Builder with the Azure CLI to create the first image version of an Azure Virtual Desktop image. The required resource providers are registered. An Azure Compute Gallery named **galAvd** and an image definition named **win11-multi** already exist in a resource group named **rg-images**.

    Which three actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Vous prévoyez d'utiliser Azure VM Image Builder avec Azure CLI pour créer la première version d'image d'une image Azure Virtual Desktop. Les fournisseurs de ressources requis sont inscrits. Une galerie Azure Compute Gallery nommée **galAvd** et une définition d'image nommée **win11-multi** existent déjà dans un groupe de ressources nommé **rg-images**.

    Quelles sont les trois actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - { id: identity, text: { en: "Create a user-assigned managed identity and grant it image read and write permissions on rg-images.", fr: "Créer une identité managée affectée par l'utilisateur et lui accorder les autorisations de lecture et d'écriture d'images sur rg-images." } }
    - { id: template, text: { en: "Create the image template that references the identity and win11-multi.", fr: "Créer le modèle d'image qui référence l'identité et win11-multi." } }
    - { id: run, text: { en: "Run the image template.", fr: "Exécuter le modèle d'image." } }
    - { id: version, text: { en: "Create image version 1.0.0 in win11-multi.", fr: "Créer la version d'image 1.0.0 dans win11-multi." } }
    - { id: sysprep, text: { en: "Deploy a build VM and run Sysprep on it.", fr: "Déployer une machine virtuelle de build et y exécuter Sysprep." } }
    - { id: sysid, text: { en: "Enable a system-assigned managed identity on galAvd.", fr: "Activer une identité managée affectée par le système sur galAvd." } }
answer:
  sequence: [ identity, template, run ]
explanation:
  correct:
    en: |
      The image template must reference an existing user-assigned identity that can write to the gallery, so you create the identity and its role assignment first. Submitting the template creates the image template resource but doesn't build anything; the `Run` action (`az image builder run` or `az resource invoke-action --action Run`) starts the build, which creates the image version.
    fr: |
      Le modèle d'image doit référencer une identité affectée par l'utilisateur existante qui peut écrire dans la galerie : vous créez donc d'abord l'identité et son attribution de rôle. Soumettre le modèle crée la ressource de modèle d'image sans rien construire ; l'action `Run` (`az image builder run` ou `az resource invoke-action --action Run`) démarre le build, qui crée la version d'image.
  options:
    version:
      en: Image Builder creates the image version when the build distributes the result.
      fr: Image Builder crée la version d'image quand le build distribue le résultat.
    sysprep:
      en: Image Builder deploys its own temporary build VM and generalizes it; you don't deploy one.
      fr: Image Builder déploie sa propre machine virtuelle de build temporaire et la généralise ; vous n'en déployez pas.
    sysid:
      en: The image template identity is user-assigned; a gallery doesn't need a managed identity.
      fr: L'identité du modèle d'image est affectée par l'utilisateur ; une galerie n'a pas besoin d'identité managée.
references:
  - title: Azure VM Image Builder overview
    url: https://learn.microsoft.com/en-us/azure/virtual-machines/image-builder-overview
