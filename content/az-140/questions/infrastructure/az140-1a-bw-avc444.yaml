id: az140-1a-bw-avc444
objective: "1.1.1"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    The users of an Azure Virtual Desktop host pool named **HP1** work on a single 1920 × 1080 monitor. You are evaluating whether to use the H.264/AVC 444 graphics mode instead of the default graphics mode.

    How does the bandwidth of the sessions change, based on Microsoft's reference figures? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Les utilisateurs d'un pool d'hôtes Azure Virtual Desktop nommé **HP1** travaillent sur un seul écran 1920 × 1080. Vous évaluez l'utilisation du mode graphique H.264/AVC 444 à la place du mode graphique par défaut.

    Comment la bande passante des sessions évolue-t-elle, d'après les valeurs de référence de Microsoft ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      For Microsoft Word and Microsoft Excel, H.264/AVC 444 mode [[office]] the bandwidth compared with the default mode.

      For web browsing and video playback, H.264/AVC 444 mode [[video]] the bandwidth compared with the default mode.

      When a user minimizes the client window, the session host [[min]].
    fr: |
      Pour Microsoft Word et Microsoft Excel, le mode H.264/AVC 444 [[office]] la bande passante par rapport au mode par défaut.

      Pour la navigation web et la lecture vidéo, le mode H.264/AVC 444 [[video]] la bande passante par rapport au mode par défaut.

      Quand un utilisateur réduit la fenêtre du client, l'hôte de session [[min]].
  slots:
    - id: office
      options:
        - { id: inc, text: { en: "increases", fr: "augmente" } }
        - { id: dec, text: { en: "reduces", fr: "réduit" } }
        - { id: same, text: { en: "doesn't change", fr: "ne change pas" } }
    - id: video
      options:
        - { id: inc, text: { en: "increases", fr: "augmente" } }
        - { id: dec, text: { en: "reduces", fr: "réduit" } }
        - { id: same, text: { en: "doesn't change", fr: "ne change pas" } }
    - id: min
      options:
        - { id: none, text: { en: "sends no graphics updates", fr: "n'envoie aucune mise à jour graphique" } }
        - { id: frame, text: { en: "sends one full frame every five seconds", fr: "envoie une image complète toutes les cinq secondes" } }
        - { id: rate, text: { en: "keeps sending updates at the last frame rate", fr: "continue d'envoyer des mises à jour à la dernière fréquence d'images" } }
answer:
  values: { office: inc, video: dec, min: none }
explanation:
  correct:
    en: |
      In Microsoft's reference figures, H.264/AVC 444 mode raises Word from 100–150 Kbps to 200–300 Kbps and Excel from 150–200 Kbps to 400–500 Kbps, but it cuts web browsing from 6–6.5 Mbps to 0.9–1 Mbps and half-screen video from 8.5–9.5 Mbps to 2.5–2.8 Mbps. A minimized client window receives no graphics updates at all.
    fr: |
      Dans les valeurs de référence de Microsoft, le mode H.264/AVC 444 fait passer Word de 100–150 Kbit/s à 200–300 Kbit/s et Excel de 150–200 Kbit/s à 400–500 Kbit/s, mais il réduit la navigation web de 6–6,5 Mbit/s à 0,9–1 Mbit/s et la vidéo en demi-écran de 8,5–9,5 Mbit/s à 2,5–2,8 Mbit/s. Une fenêtre de client réduite ne reçoit aucune mise à jour graphique.
references:
  - title: Remote Desktop Protocol (RDP) bandwidth requirements
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/rdp-bandwidth
