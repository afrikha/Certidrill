id: az140-1b-os-vm-config
objective: "1.3.2"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    You are designing the session hosts of a new Azure Virtual Desktop pooled host pool that will run Windows 11 Enterprise multi-session.

    You need to choose a supported configuration that provides the lowest OS disk latency among the supported options.

    How should you configure the session hosts? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous concevez les hôtes de session d'un nouveau pool d'hôtes regroupé Azure Virtual Desktop qui exécutera Windows 11 Entreprise multisession.

    Vous devez choisir une configuration prise en charge qui offre la latence de disque du système d'exploitation la plus faible parmi les options prises en charge.

    Comment devez-vous configurer les hôtes de session ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      OS disk: [[disk]]

      Deployment model: [[deploy]]
    fr: |
      Disque du système d'exploitation : [[disk]]

      Modèle de déploiement : [[deploy]]
  slots:
    - id: disk
      options:
        - { id: premium, text: { en: "Premium SSD managed disk", fr: "Disque managé SSD Premium" } }
        - { id: ultra, text: { en: "Ultra Disk", fr: "Disque Ultra" } }
        - { id: ephemeral, text: { en: "Ephemeral OS disk", fr: "Disque de système d'exploitation éphémère" } }
        - { id: hdd, text: { en: "Standard HDD managed disk", fr: "Disque managé HDD Standard" } }
    - id: deploy
      options:
        - { id: vms, text: { en: "Individual Azure virtual machines", fr: "Machines virtuelles Azure individuelles" } }
        - { id: flex, text: { en: "Virtual Machine Scale Sets with Flexible orchestration", fr: "Groupes de machines virtuelles identiques avec orchestration flexible" } }
        - { id: uniform, text: { en: "Virtual Machine Scale Sets with Uniform orchestration", fr: "Groupes de machines virtuelles identiques avec orchestration uniforme" } }
answer:
  values: { disk: premium, deploy: vms }
explanation:
  correct:
    en: |
      Ultra Disks for the OS disk and ephemeral OS disks aren't supported for session hosts, so Premium SSD is the lowest-latency supported choice; Standard HDD is supported but slower. Session hosts are deployed as individual virtual machines: Virtual Machine Scale Sets aren't supported.
    fr: |
      Les disques Ultra comme disque du système d'exploitation et les disques de système d'exploitation éphémères ne sont pas pris en charge pour les hôtes de session : SSD Premium est donc le choix pris en charge le plus rapide ; HDD Standard est pris en charge, mais plus lent. Les hôtes de session sont déployés en tant que machines virtuelles individuelles : les groupes de machines virtuelles identiques ne sont pas pris en charge.
  options:
    ultra: { en: "Ultra Disks aren't supported as the OS disk type of session hosts.", fr: "Les disques Ultra ne sont pas pris en charge comme type de disque du système d'exploitation des hôtes de session." }
    ephemeral: { en: "Ephemeral OS disks aren't supported for session hosts.", fr: "Les disques de système d'exploitation éphémères ne sont pas pris en charge pour les hôtes de session." }
    hdd: { en: "Standard HDD is supported but has higher latency than Premium SSD.", fr: "HDD Standard est pris en charge, mais sa latence est plus élevée que celle de SSD Premium." }
    flex: { en: "Virtual Machine Scale Sets aren't supported for session hosts, whatever the orchestration mode.", fr: "Les groupes de machines virtuelles identiques ne sont pas pris en charge pour les hôtes de session, quel que soit le mode d'orchestration." }
    uniform: { en: "Virtual Machine Scale Sets aren't supported for session hosts, whatever the orchestration mode.", fr: "Les groupes de machines virtuelles identiques ne sont pas pris en charge pour les hôtes de session, quel que soit le mode d'orchestration." }
references:
  - title: Prerequisites for Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/prerequisites
