id: az140-1d-hp-drain-behaviour
objective: "1.4.3"
type: yesno_statements
difficulty: 3
status: draft
stem:
  en: |
    You have an Azure Virtual Desktop pooled host pool named **HP-Ops** that uses the breadth-first load balancing algorithm. HP-Ops contains four session hosts named OPS-0 to OPS-3.

    You turn on drain mode for OPS-1. At that time:

    - User1 has an active session on OPS-1.
    - User2 has a disconnected session on OPS-1.
    - User3 has no session in HP-Ops.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un pool d'hôtes regroupé Azure Virtual Desktop nommé **HP-Ops** qui utilise l'algorithme d'équilibrage de charge breadth-first. HP-Ops contient quatre hôtes de session nommés OPS-0 à OPS-3.

    Vous activez le mode drainage pour OPS-1. À ce moment-là :

    - User1 a une session active sur OPS-1.
    - User2 a une session déconnectée sur OPS-1.
    - User3 n'a aucune session dans HP-Ops.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: When User2 connects again, User2 is reconnected to the session on OPS-1.
        fr: Quand User2 se connecte de nouveau, User2 est reconnecté à sa session sur OPS-1.
    - id: s2
      text:
        en: When User3 connects, the load balancer can place the new session on OPS-1.
        fr: Quand User3 se connecte, l'équilibreur de charge peut placer la nouvelle session sur OPS-1.
    - id: s3
      text:
        en: If you later lower the max session limit of HP-Ops below the number of sessions on OPS-0, the excess sessions on OPS-0 are disconnected.
        fr: Si vous abaissez ensuite la limite maximale de sessions de HP-Ops sous le nombre de sessions d'OPS-0, les sessions excédentaires d'OPS-0 sont déconnectées.
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: |
      A user who already has an active or disconnected session in the host pool is redirected to that session host, even if drain mode is enabled on it, so User2 returns to OPS-1. A user without a session is never placed on a host in drain mode. Lowering the max session limit doesn't affect sessions that already exist; it only applies to new connections.
    fr: |
      Un utilisateur qui a déjà une session active ou déconnectée dans le pool d'hôtes est redirigé vers cet hôte de session, même si le mode drainage y est activé : User2 revient donc sur OPS-1. Un utilisateur sans session n'est jamais placé sur un hôte en mode drainage. Abaisser la limite maximale de sessions n'affecte pas les sessions existantes ; elle ne s'applique qu'aux nouvelles connexions.
references:
  - title: Configure host pool load balancing in Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/configure-host-pool-load-balancing
  - title: Drain session hosts for maintenance in Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/drain-mode
