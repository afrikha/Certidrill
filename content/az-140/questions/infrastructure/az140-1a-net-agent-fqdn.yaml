id: az140-1a-net-agent-fqdn
objective: "1.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Wingtip Toys deploys Azure Virtual Desktop session hosts in the West Europe region. The security team doesn't allow wildcard FQDNs in firewall rules when a specific FQDN can be used instead. The agent traffic of the session hosts currently uses the wildcard entry `*.prod.warm.ingest.monitor.core.windows.net`.

    You need to identify the region-specific FQDNs that replace this wildcard entry.

    Where should you look?
  fr: |
    Wingtip Toys déploie des hôtes de session Azure Virtual Desktop dans la région West Europe. L'équipe de sécurité n'autorise pas les FQDN génériques dans les règles de pare-feu lorsqu'un FQDN précis peut être utilisé. Le trafic de l'agent des hôtes de session utilise actuellement l'entrée générique `*.prod.warm.ingest.monitor.core.windows.net`.

    Vous devez identifier les FQDN propres à la région qui remplacent cette entrée générique.

    Où devez-vous chercher ?
body:
  options:
    - id: a
      text: { en: "Event ID 3701 in the WVD-Agent source of the Application log on a registered session host", fr: "L'ID d'événement 3701 de la source WVD-Agent du journal Application sur un hôte de session inscrit" } 
    - id: b
      text: { en: "The Activity log of the host pool after a session host is added to it", fr: "Le journal d'activité du pool d'hôtes après l'ajout d'un hôte de session" }
    - id: c
      text: { en: "The Connection Information dialog box of a user session on a session host", fr: "La boîte de dialogue Connection Information d'une session utilisateur sur un hôte de session" }
    - id: d
      text: { en: "The downloadable list of IP ranges published for the AzureMonitor service tag", fr: "La liste téléchargeable des plages IP publiées pour l'étiquette de service AzureMonitor" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      For agent traffic, Microsoft lets you avoid the wildcard: on a session host that is registered to a host pool, open Event Viewer, **Windows Logs** > **Application** > **WVD-Agent**, and find event ID 3701, which lists the region-specific FQDNs. You repeat this for each Azure region you use. Wildcards remain mandatory for service traffic FQDNs.
    fr: |
      Pour le trafic de l'agent, Microsoft permet d'éviter le caractère générique : sur un hôte de session inscrit dans un pool d'hôtes, ouvrez l'Observateur d'événements, **Journaux Windows** > **Application** > **WVD-Agent**, et recherchez l'ID d'événement 3701, qui liste les FQDN propres à la région. Vous répétez l'opération pour chaque région Azure utilisée. Les caractères génériques restent obligatoires pour les FQDN du trafic du service.
  options:
    b: { en: "The Activity log records management operations on Azure resources, not the endpoints used by the agent.", fr: "Le journal d'activité enregistre les opérations de gestion sur les ressources Azure, pas les points de terminaison utilisés par l'agent." }
    c: { en: "Connection Information shows the transport and round-trip time of a session, not agent endpoints.", fr: "Connection Information affiche le transport et la durée aller-retour d'une session, pas les points de terminaison de l'agent." }
    d: { en: "Service tag files contain IP prefixes, not FQDNs, so they can't replace an FQDN entry in an application rule.", fr: "Les fichiers d'étiquettes de service contiennent des préfixes IP, pas des FQDN : ils ne peuvent pas remplacer une entrée FQDN dans une règle d'application." }
references:
  - title: Required FQDNs and endpoints for Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/required-fqdn-endpoint
