id: az140-1a-pl-sessions-only
objective: "1.1.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Litware has two Azure Virtual Desktop host pools named **HP1** and **HP2**, and a workspace named **WS1**. Users connect from the corporate network over ExpressRoute.

    You need to ensure that the remote session traffic to HP1 and HP2 uses private routes. Initial feed discovery and feed download can use public routes. The solution must minimize the number of private endpoints.

    Which private endpoints should you create?
  fr: |
    Litware dispose de deux pools d'hôtes Azure Virtual Desktop nommés **HP1** et **HP2**, et d'un espace de travail nommé **WS1**. Les utilisateurs se connectent depuis le réseau de l'entreprise par ExpressRoute.

    Vous devez faire en sorte que le trafic des sessions à distance vers HP1 et HP2 utilise des itinéraires privés. La découverte initiale du flux et le téléchargement du flux peuvent utiliser des itinéraires publics. La solution doit réduire au minimum le nombre de points de terminaison privés.

    Quels points de terminaison privés devez-vous créer ?
body:
  options:
    - id: a
      text: { en: "One private endpoint with the feed sub-resource on WS1", fr: "Un point de terminaison privé avec la sous-ressource feed sur WS1" }
    - id: b
      text: { en: "One private endpoint with the connection sub-resource on each host pool", fr: "Un point de terminaison privé avec la sous-ressource connection sur chaque pool d'hôtes" }
    - id: c
      text: { en: "One private endpoint with the global sub-resource on WS1", fr: "Un point de terminaison privé avec la sous-ressource global sur WS1" }
    - id: d
      text: { en: "One private endpoint with the connection sub-resource on WS1", fr: "Un point de terminaison privé avec la sous-ressource connection sur WS1" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Connections to host pools use the `connection` sub-resource of the host pool resource, and you need one private endpoint per host pool. When only remote sessions must be private, the `connection` endpoints are the only ones required; `feed` and `global` are needed only to make the feed download and initial feed discovery private.
    fr: |
      Les connexions aux pools d'hôtes utilisent la sous-ressource `connection` de la ressource pool d'hôtes, et il faut un point de terminaison privé par pool d'hôtes. Quand seules les sessions à distance doivent être privées, les points de terminaison `connection` sont les seuls nécessaires ; `feed` et `global` ne servent qu'à rendre privés le téléchargement du flux et la découverte initiale du flux.
  options:
    a: { en: "The feed sub-resource makes the feed download private, which isn't required, and doesn't cover session traffic.", fr: "La sous-ressource feed rend privé le téléchargement du flux, ce qui n'est pas exigé, et ne couvre pas le trafic des sessions." }
    c: { en: "The global sub-resource is for initial feed discovery only.", fr: "La sous-ressource global ne sert qu'à la découverte initiale du flux." }
    d: { en: "Workspaces expose the feed and global sub-resources; connection belongs to host pools.", fr: "Les espaces de travail exposent les sous-ressources feed et global ; connection appartient aux pools d'hôtes." }
references:
  - title: Azure Private Link with Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/private-link-overview
