id: az140-cs1a-shortpath
objective: "1.1.3"
type: multi
caseStudy: az140-cs1a-humongous-insurance
difficulty: 3
status: draft
stem:
  en: |
    You need to meet the transport requirement for the sessions from the contact centers.

    Which two actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez satisfaire l'exigence de transport pour les sessions ouvertes depuis les centres de contact.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Enable the Enable RDP Shortpath for managed networks policy setting on the session hosts.", fr: "Activer le paramètre de stratégie Enable RDP Shortpath for managed networks sur les hôtes de session." } }
    - { id: b, text: { en: "In NSG-Hosts, allow inbound TCP 3389 from the contact center address ranges.", fr: "Dans NSG-Hosts, autoriser le trafic entrant TCP 3389 depuis les plages d'adresses des centres de contact." } }
    - { id: c, text: { en: "In NSG-Hosts, allow inbound UDP 3390 from the contact center address ranges.", fr: "Dans NSG-Hosts, autoriser le trafic entrant UDP 3390 depuis les plages d'adresses des centres de contact." } }
    - { id: d, text: { en: "Allow outbound UDP 3478 from snet-hosts to 51.5.0.0/16.", fr: "Autoriser le trafic sortant UDP 3478 de snet-hosts vers 51.5.0.0/16." } }
    - { id: e, text: { en: "Enable the Use port range for RDP Shortpath for unmanaged networks policy setting on the session hosts.", fr: "Activer le paramètre de stratégie Use port range for RDP Shortpath for unmanaged networks sur les hôtes de session." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |
      Only RDP Shortpath for managed networks in direct mode gives a UDP path over ExpressRoute without STUN or TURN: the client connects straight to a UDP listener on the session host. The listener is off by default, so you enable it with the policy setting (UDP 3390 by default). Because NSG-Hosts denies all inbound traffic at priority 4000, you must also allow UDP 3390 from the contact center ranges; the host pool setting for managed networks is already enabled by default.
    fr: |
      Seul RDP Shortpath pour les réseaux managés en mode direct fournit un chemin UDP par ExpressRoute sans STUN ni TURN : le client se connecte directement à un écouteur UDP de l'hôte de session. L'écouteur est désactivé par défaut ; vous l'activez donc avec le paramètre de stratégie (UDP 3390 par défaut). Comme NSG-Hosts refuse tout le trafic entrant à la priorité 4000, vous devez aussi autoriser UDP 3390 depuis les plages des centres de contact ; le paramètre du pool d'hôtes pour les réseaux managés est déjà activé par défaut.
  options:
    b: { en: "Azure Virtual Desktop uses reverse connect for TCP: session hosts need no inbound TCP 3389 rule, and TCP is not the required transport.", fr: "Azure Virtual Desktop utilise la connexion inverse pour TCP : les hôtes de session n'ont besoin d'aucune règle entrante TCP 3389, et TCP n'est pas le transport demandé." }
    d: { en: "UDP 3478 to 51.5.0.0/16 reaches the Azure Virtual Desktop STUN and TURN servers, which the requirement excludes.", fr: "UDP 3478 vers 51.5.0.0/16 atteint les serveurs STUN et TURN d'Azure Virtual Desktop, que l'exigence exclut." }
    e: { en: "This setting limits the ephemeral ports used by STUN and TURN connections; it does not enable a direct managed-network listener.", fr: "Ce paramètre limite les ports éphémères utilisés par les connexions STUN et TURN ; il n'active pas d'écouteur direct pour les réseaux managés." }
references:
  - title: RDP Shortpath
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/rdp-shortpath
  - title: Configure RDP Shortpath for Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/configure-rdp-shortpath
