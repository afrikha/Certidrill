id: az140-1d-img-base-image
objective: "1.5.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You plan to create a golden image manually for an Azure Virtual Desktop pooled host pool. Several users must share each session host. Every user needs Microsoft 365 Apps. The users have Microsoft 365 E3 licenses, and the company has no RDS CALs.

    You need to choose the Azure Marketplace image for the build virtual machine. The solution must minimize customization effort.

    Which image should you choose?
  fr: |
    Vous prévoyez de créer manuellement une image de référence pour un pool d'hôtes regroupé Azure Virtual Desktop. Plusieurs utilisateurs doivent partager chaque hôte de session. Chaque utilisateur a besoin de Microsoft 365 Apps. Les utilisateurs disposent de licences Microsoft 365 E3, et l'entreprise n'a pas de CAL RDS.

    Vous devez choisir l'image de la Place de marché Azure pour la machine virtuelle de build. La solution doit réduire au minimum l'effort de personnalisation.

    Quelle image devez-vous choisir ?
body:
  options:
    - { id: a, text: { en: "Windows 11 Enterprise", fr: "Windows 11 Entreprise" } }
    - { id: b, text: { en: "Windows Server 2022 Datacenter", fr: "Windows Server 2022 Datacenter" } }
    - { id: c, text: { en: "Windows 11 Enterprise multi-session + Microsoft 365 Apps", fr: "Windows 11 Entreprise multisession + Microsoft 365 Apps" } }
    - { id: d, text: { en: "Windows 11 Enterprise multi-session", fr: "Windows 11 Entreprise multisession" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      For pooled host pools, Microsoft recommends a Windows 11 or Windows 10 multi-session image, with or without Microsoft 365. The image that already includes Microsoft 365 Apps avoids installing and configuring them on the build VM, and Microsoft 365 E3 covers access to Windows client session hosts.
    fr: |
      Pour les pools d'hôtes regroupés, Microsoft recommande une image Windows 11 ou Windows 10 multisession, avec ou sans Microsoft 365. L'image qui inclut déjà Microsoft 365 Apps évite de les installer et de les configurer sur la machine virtuelle de build, et Microsoft 365 E3 couvre l'accès aux hôtes de session Windows client.
  options:
    a:
      en: Windows 11 Enterprise accepts one interactive user at a time; it is the image for personal host pools.
      fr: Windows 11 Entreprise n'accepte qu'un utilisateur interactif à la fois ; c'est l'image des pools d'hôtes personnels.
    b:
      en: Windows Server session hosts require RDS CALs, which the company doesn't have, and Microsoft 365 Apps would still need to be installed.
      fr: Les hôtes de session Windows Server exigent des CAL RDS, que l'entreprise n'a pas, et Microsoft 365 Apps devrait encore être installé.
    d:
      en: This image meets the multi-user requirement, but you would have to install and configure Microsoft 365 Apps yourself, which adds customization effort.
      fr: Cette image répond à l'exigence multi-utilisateur, mais vous devriez installer et configurer Microsoft 365 Apps vous-même, ce qui ajoute de l'effort de personnalisation.
references:
  - title: Create a golden image in Azure
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/set-up-golden-image
