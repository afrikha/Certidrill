id: az140-1d-hp-direct-no-resources
objective: "1.4.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have an Azure Virtual Desktop personal host pool named **HP-Dev** that uses the **Direct** assignment type. HP-Dev contains five session hosts that are joined to an Active Directory Domain Services (AD DS) domain. The IT team must decide which session host each developer uses.

    You assign a group named Developers to the desktop application group of HP-Dev. When the developers connect, they receive the message "No resources available".

    What should you do to allow the developers to connect?
  fr: |
    Vous disposez d'un pool d'hôtes personnel Azure Virtual Desktop nommé **HP-Dev** qui utilise le type d'attribution **Direct**. HP-Dev contient cinq hôtes de session joints à un domaine Active Directory Domain Services (AD DS). L'équipe informatique doit décider de l'hôte de session qu'utilise chaque développeur.

    Vous affectez un groupe nommé Developers au groupe d'applications de bureau de HP-Dev. Quand les développeurs se connectent, ils reçoivent le message « No resources available ».

    Que devez-vous faire pour permettre aux développeurs de se connecter ?
body:
  options:
    - { id: a, text: { en: "Change the load balancing algorithm of HP-Dev to breadth-first.", fr: "Passer l'algorithme d'équilibrage de charge de HP-Dev à breadth-first." } }
    - { id: b, text: { en: "Assign the Virtual Machine User Login role to Developers on the session hosts.", fr: "Attribuer le rôle Virtual Machine User Login à Developers sur les hôtes de session." } }
    - { id: c, text: { en: "Enable Start VM on Connect on HP-Dev.", fr: "Activer Start VM on Connect sur HP-Dev." } }
    - { id: d, text: { en: "Assign each developer to a specific session host of HP-Dev.", fr: "Attribuer chaque développeur à un hôte de session précis de HP-Dev." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      With the Direct assignment type, a user must be assigned to the host pool and to a specific session host before connecting. Users who only have the application group assignment get "No resources available". In the portal, you assign a session host with **Assign VM** on the application group assignments, or from the session host's **Assignment** menu.
    fr: |
      Avec le type d'attribution Direct, un utilisateur doit être affecté au pool d'hôtes et à un hôte de session précis avant de se connecter. Les utilisateurs qui n'ont que l'affectation au groupe d'applications obtiennent « No resources available ». Dans le portail, vous attribuez un hôte de session avec **Assign VM** dans les affectations du groupe d'applications, ou depuis le menu **Assignment** de l'hôte de session.
  options:
    a:
      en: Load balancing doesn't apply to personal host pools, where users have a one-to-one mapping to a session host.
      fr: L'équilibrage de charge ne s'applique pas aux pools d'hôtes personnels, où chaque utilisateur est associé à un seul hôte de session.
    b:
      en: The Virtual Machine User Login role is needed to sign in to Microsoft Entra joined session hosts; these hosts are joined to AD DS, and the role doesn't create a desktop assignment.
      fr: Le rôle Virtual Machine User Login sert à se connecter à des hôtes de session joints à Microsoft Entra ; ces hôtes sont joints à AD DS, et le rôle ne crée aucune attribution de bureau.
    c:
      en: Start VM on Connect powers on a session host that is already assigned; it doesn't assign one.
      fr: Start VM on Connect démarre un hôte de session déjà attribué ; il n'en attribue pas.
references:
  - title: Configure personal desktop assignment
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/configure-host-pool-personal-desktop-assignment-type
