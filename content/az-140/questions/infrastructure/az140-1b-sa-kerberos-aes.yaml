id: az140-1b-sa-kerberos-aes
objective: "1.2.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    You have an Azure Virtual Desktop host pool whose session hosts are joined to the contoso.com AD DS domain. FSLogix profile containers are stored in a storage account named **stavdprof05** that was joined to AD DS by using Join-AzStorageAccount in 2021. The AD DS account that represents stavdprof05 still uses RC4 Kerberos encryption.

    Contoso plans to install the April 2026 Windows Server update on its domain controllers. You need to prevent FSLogix profile access failures after the update.

    What should you do before the update is installed?
  fr: |
    Vous disposez d'un pool d'hôtes Azure Virtual Desktop dont les hôtes de session sont joints au domaine AD DS contoso.com. Les conteneurs de profils FSLogix sont stockés dans un compte de stockage nommé **stavdprof05**, joint à AD DS en 2021 à l'aide de Join-AzStorageAccount. Le compte AD DS qui représente stavdprof05 utilise toujours le chiffrement Kerberos RC4.

    Contoso prévoit d'installer la mise à jour Windows Server d'avril 2026 sur ses contrôleurs de domaine. Vous devez éviter les échecs d'accès aux profils FSLogix après la mise à jour.

    Que devez-vous faire avant l'installation de la mise à jour ?
body:
  options:
    - id: a
      text: { en: "Rotate the Kerberos key of stavdprof05 by running Update-AzStorageAccountADObjectPassword.", fr: "Effectuer la rotation de la clé Kerberos de stavdprof05 en exécutant Update-AzStorageAccountADObjectPassword." }
    - id: b
      text: { en: "Set AccessNetworkAsComputerObject to 1 on the session hosts.", fr: "Définir AccessNetworkAsComputerObject sur 1 sur les hôtes de session." }
    - id: c
      text: { en: "Enable Microsoft Entra Domain Services authentication on stavdprof05.", fr: "Activer l'authentification Microsoft Entra Domain Services sur stavdprof05." }
    - id: d
      text: { en: "Configure the AD DS account of stavdprof05 to use AES Kerberos encryption.", fr: "Configurer le compte AD DS de stavdprof05 pour qu'il utilise le chiffrement Kerberos AES." }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Starting with the April 2026 Windows Server update, the default Kerberos encryption type changes from RC4 to AES-SHA1. Microsoft warns that file shares hosting FSLogix containers that weren't upgraded to AES can have access issues, so the storage account's AD DS identity must be moved to AES encryption before the update is installed.
    fr: |
      À partir de la mise à jour Windows Server d'avril 2026, le type de chiffrement Kerberos par défaut passe de RC4 à AES-SHA1. Microsoft avertit que les partages de fichiers qui hébergent des conteneurs FSLogix non mis à niveau vers AES peuvent rencontrer des problèmes d'accès : l'identité AD DS du compte de stockage doit donc passer au chiffrement AES avant l'installation de la mise à jour.
  options:
    a: { en: "Rotating the password regenerates a Kerberos key but doesn't change the encryption types the account supports.", fr: "La rotation du mot de passe régénère une clé Kerberos, mais ne change pas les types de chiffrement pris en charge par le compte." }
    b: { en: "Attaching the container as the computer account is a security risk and still relies on the same Kerberos encryption of the storage account.", fr: "Attacher le conteneur avec le compte d'ordinateur constitue un risque de sécurité et repose toujours sur le même chiffrement Kerberos du compte de stockage." }
    c: { en: "The session hosts are joined to AD DS, not to a Microsoft Entra Domain Services domain, so they couldn't use that identity source.", fr: "Les hôtes de session sont joints à AD DS, pas à un domaine Microsoft Entra Domain Services : ils ne pourraient pas utiliser cette source d'identité." }
references:
  - title: Store FSLogix profile containers on Azure Files and Active Directory Domain Services or Microsoft Entra Domain Services
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/fslogix-profile-container-configure-azure-files-active-directory
