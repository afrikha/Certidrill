stem:
  en: You enroll Sub-Customers in per-user access pricing.
  fr: Vous inscrivez Sub-Customers à la tarification de l'accès par utilisateur.
body:
  solution:
    en: |
      You enroll **Sub-Customers** in per-user access pricing for Azure Virtual Desktop.
    fr: |
      Vous inscrivez **Sub-Customers** à la tarification de l'accès par utilisateur d'Azure Virtual Desktop.
answer: { value: true }
explanation:
  correct:
    en: |
      Per-user access pricing covers Azure Virtual Desktop access rights for external commercial purposes, such as selling access to an application to customers, and the customers need no license of their own. Proseware pays a monthly charge through the enrolled subscription for each user who connects at least once in the month. Session hosts that run Windows client editions, like Windows 11 Enterprise multi-session, are supported.
    fr: |
      La tarification de l'accès par utilisateur couvre les droits d'accès à Azure Virtual Desktop pour un usage commercial externe, comme la vente de l'accès à une application à des clients, et les clients n'ont besoin d'aucune licence. Proseware paie, via l'abonnement inscrit, un montant mensuel pour chaque utilisateur qui se connecte au moins une fois dans le mois. Les hôtes de session qui exécutent une édition cliente de Windows, comme Windows 11 Entreprise multisession, sont pris en charge.
references:
  - title: Licensing Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/licensing
