id: az140-1a-sp-symmetric-nat
objective: "1.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    The session hosts of an Azure Virtual Desktop host pool named **HP1** reach the internet through an Azure NAT Gateway associated with their subnet. All the RDP Shortpath options of HP1 have their default values, and outbound UDP from the session hosts is allowed, including UDP 3478 to 51.5.0.0/16.

    Users connect from home over the internet.

    Which transport will most of their sessions use?
  fr: |
    Les hôtes de session d'un pool d'hôtes Azure Virtual Desktop nommé **HP1** joignent Internet par une passerelle Azure NAT Gateway associée à leur sous-réseau. Toutes les options RDP Shortpath de HP1 ont leur valeur par défaut, et l'UDP sortant des hôtes de session est autorisé, y compris UDP 3478 vers 51.5.0.0/16.

    Les utilisateurs se connectent depuis leur domicile par Internet.

    Quel transport la plupart de leurs sessions utiliseront-elles ?
body:
  options:
    - id: a
      text: { en: "RDP Shortpath for public networks with UDP relayed through TURN", fr: "RDP Shortpath pour les réseaux publics avec UDP relayé par TURN" }
    - id: b
      text: { en: "RDP Shortpath for public networks with direct UDP through STUN", fr: "RDP Shortpath pour les réseaux publics avec UDP direct grâce à STUN" }
    - id: c
      text: { en: "RDP Shortpath for managed networks to the UDP 3390 listener", fr: "RDP Shortpath pour les réseaux managés vers l'écouteur UDP 3390" }
    - id: d
      text: { en: "TCP reverse connect through an Azure Virtual Desktop gateway", fr: "TCP reverse connect par une passerelle Azure Virtual Desktop" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Azure NAT Gateway is a symmetric NAT: it maps a private IP address and port to a unique public IP address and port for each destination, so the direct path discovered through STUN usually fails. RDP Shortpath then uses a TURN relay in 51.5.0.0/16, which is why Microsoft strongly recommends keeping TURN enabled.
    fr: |
      Azure NAT Gateway est un NAT symétrique : il associe une adresse IP et un port privés à une adresse IP et un port publics uniques pour chaque destination, si bien que le chemin direct découvert par STUN échoue généralement. RDP Shortpath utilise alors un relais TURN dans 51.5.0.0/16, d'où la recommandation de Microsoft de laisser TURN activé.
  options:
    b: { en: "Direct STUN connections usually fail behind a symmetric NAT such as Azure NAT Gateway.", fr: "Les connexions STUN directes échouent généralement derrière un NAT symétrique comme Azure NAT Gateway." }
    c: { en: "Users connect over the internet, not over a managed network, and nothing says the listener is enabled.", fr: "Les utilisateurs se connectent par Internet, pas par un réseau managé, et rien n'indique que l'écouteur est activé." }
    d: { en: "UDP is allowed and TURN is enabled by default, so the session moves from TCP to a relayed UDP path.", fr: "UDP est autorisé et TURN est activé par défaut : la session passe de TCP à un chemin UDP relayé." }
references:
  - title: RDP Shortpath for Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/rdp-shortpath
