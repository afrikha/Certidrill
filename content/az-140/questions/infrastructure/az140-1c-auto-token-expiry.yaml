id: az140-1c-auto-token-expiry
objective: "1.4.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    You have an Azure Virtual Desktop host pool named HP1 that uses the standard management approach. A pipeline deploys 300 session hosts to HP1 in batches over six weeks. At the start of the project, you generated a registration token with the longest lifetime allowed and stored it as a pipeline secret.

    The session hosts deployed during week 5 don't appear as available, and the agent logs show `EXPIRED_MACHINE_TOKEN`. The VMs can reach the required URLs.

    You need to ensure that the remaining batches register successfully.

    What should you do?
  fr: |
    Vous disposez d'un pool d'hôtes Azure Virtual Desktop nommé HP1 qui utilise l'approche de gestion standard. Un pipeline déploie 300 hôtes de session dans HP1 par lots sur six semaines. Au début du projet, vous avez généré un jeton d'inscription avec la durée de vie la plus longue autorisée et l'avez stocké comme secret du pipeline.

    Les hôtes de session déployés pendant la semaine 5 n'apparaissent pas comme disponibles, et les journaux de l'agent indiquent `EXPIRED_MACHINE_TOKEN`. Les machines virtuelles peuvent joindre les URL requises.

    Vous devez vous assurer que les lots restants s'inscrivent correctement.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Generate one new token valid for 60 days and store it in the pipeline", fr: "Générer un nouveau jeton valide 60 jours et le stocker dans le pipeline" } }
    - { id: b, text: { en: "Generate a new token, and renew it in the pipeline before each expiry", fr: "Générer un nouveau jeton, et le renouveler dans le pipeline avant chaque expiration" } }
    - { id: c, text: { en: "Keep the failed VMs running for 20 minutes to refresh the token", fr: "Laisser les machines virtuelles en échec en marche 20 minutes pour renouveler le jeton" } }
    - { id: d, text: { en: "Allow inbound TCP 443 from the internet to the session hosts", fr: "Autoriser le trafic entrant TCP 443 depuis Internet vers les hôtes de session" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      A registration token can be valid for at most 27 days, so a six-week rollout needs a new token before the previous one expires. Hosts that try to register with an expired token fail with EXPIRED_MACHINE_TOKEN; generating a new token and giving it to the remaining batches (and reinstalling the agent with it on the failed VMs) fixes the registration.
    fr: |
      Un jeton d'inscription peut être valide 27 jours au plus : un déploiement sur six semaines exige un nouveau jeton avant l'expiration du précédent. Les hôtes qui tentent de s'inscrire avec un jeton expiré échouent avec EXPIRED_MACHINE_TOKEN ; générer un nouveau jeton et le fournir aux lots restants (et réinstaller l'agent avec ce jeton sur les machines virtuelles en échec) corrige l'inscription.
  options:
    a: { en: "The maximum lifetime of a registration token is 27 days.", fr: "La durée de vie maximale d'un jeton d'inscription est de 27 jours." }
    c: { en: "Powering a VM on for 20 minutes every 90 days refreshes the machine token of hosts that are already registered, not of hosts that never registered.", fr: "Démarrer une machine virtuelle 20 minutes tous les 90 jours renouvelle le jeton machine d'hôtes déjà inscrits, pas celui d'hôtes jamais inscrits." }
    d: { en: "Registration uses outbound connections; session hosts need no inbound port.", fr: "L'inscription utilise des connexions sortantes ; les hôtes de session n'ont besoin d'aucun port entrant." }
references:
  - title: Add session hosts to a host pool
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/add-session-hosts-host-pool
