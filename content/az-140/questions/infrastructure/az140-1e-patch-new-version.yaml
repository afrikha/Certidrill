id: az140-1e-patch-new-version
objective: "1.5.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Contoso builds the image of an Azure Virtual Desktop pooled host pool named **Pool1** manually, without Azure VM Image Builder. Image version **1.1.0** of the image definition **win11-multi** in the Azure Compute Gallery **galAvd** was captured from a build VM named **VMBuild**. Before running Sysprep, an administrator took a final snapshot of the VMBuild OS disk. After the capture, VMBuild was kept in a stopped (deallocated) state.

    You need to produce an image that contains this month's Windows cumulative update for the session hosts of Pool1. The solution must follow Microsoft's recommendations for golden images.

    What should you do?
  fr: |
    Contoso construit manuellement l'image d'un pool d'hôtes regroupé Azure Virtual Desktop nommé **Pool1**, sans Azure VM Image Builder. La version d'image **1.1.0** de la définition d'image **win11-multi** de la galerie Azure Compute Gallery **galAvd** a été capturée à partir d'une machine virtuelle de build nommée **VMBuild**. Avant d'exécuter Sysprep, un administrateur a pris un dernier instantané du disque du système d'exploitation de VMBuild. Après la capture, VMBuild a été conservée à l'état arrêté (libéré).

    Vous devez produire une image qui contient la mise à jour cumulative Windows de ce mois-ci pour les hôtes de session de Pool1. La solution doit respecter les recommandations de Microsoft pour les images de référence.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Start VMBuild, install the update, run Sysprep again, and capture VMBuild as image version 1.2.0.", fr: "Démarrer VMBuild, installer la mise à jour, réexécuter Sysprep et capturer VMBuild comme version d'image 1.2.0." }
    - id: b
      text: { en: "Create a VM from the final snapshot of VMBuild, install the update, run Sysprep, and capture the VM as image version 1.2.0.", fr: "Créer une machine virtuelle à partir du dernier instantané de VMBuild, installer la mise à jour, exécuter Sysprep et capturer la machine virtuelle comme version d'image 1.2.0." }
    - id: c
      text: { en: "Deploy a VM from image version 1.1.0, install the update, run Sysprep, and capture the VM as image version 1.2.0.", fr: "Déployer une machine virtuelle à partir de la version d'image 1.1.0, installer la mise à jour, exécuter Sysprep et capturer la machine virtuelle comme version d'image 1.2.0." }
    - id: d
      text: { en: "Install the update on a session host of Pool1, run Sysprep, and capture the session host as image version 1.2.0.", fr: "Installer la mise à jour sur un hôte de session de Pool1, exécuter Sysprep et capturer l'hôte de session comme version d'image 1.2.0." }
answer: { optionId: b }
explanation:
  correct:
    en: An image is never patched in place; you produce a new image version. With the manual method, Microsoft recommends starting a new base VM from the last snapshot taken before Sysprep, applying the updates, generalizing it, capturing it as the next version and then deleting the VM.
    fr: "Une image ne se corrige jamais sur place : on produit une nouvelle version d'image. Avec la méthode manuelle, Microsoft recommande de repartir d'une nouvelle machine virtuelle de base créée à partir du dernier instantané pris avant Sysprep, d'appliquer les mises à jour, de la généraliser, de la capturer comme version suivante, puis de supprimer la machine virtuelle."
  options:
    a: { en: "A captured, generalized VM must be deleted and never captured twice; VMBuild shouldn't be reused for the next version.", fr: "Une machine virtuelle généralisée et capturée doit être supprimée et ne jamais être capturée deux fois ; VMBuild ne doit pas servir à la version suivante." }
    c: { en: "Microsoft recommends not creating a new base VM from an existing custom image; start from a clean source such as the pre-Sysprep snapshot.", fr: "Microsoft recommande de ne pas créer de machine virtuelle de base à partir d'une image personnalisée existante ; repartez d'une source propre, comme l'instantané d'avant Sysprep." }
    d: { en: "You shouldn't capture a VM that is already a session host of a host pool: it carries the agent registration and user data.", fr: "Il ne faut pas capturer une machine virtuelle qui est déjà un hôte de session d'un pool d'hôtes : elle porte l'inscription de l'agent et des données utilisateur." }
references:
  - title: Create a golden image in Azure
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/set-up-golden-image
