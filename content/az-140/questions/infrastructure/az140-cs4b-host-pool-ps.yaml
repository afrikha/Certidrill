id: az140-cs4b-host-pool-ps
objective: "1.4.2"
type: dropdown
caseStudy: az140-cs4b-proseware
difficulty: 2
status: draft
stem:
  en: |
    You need to create HP-Dev to meet the developer desktop requirement.

    How should you complete the command? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez créer HP-Dev pour satisfaire l'exigence relative aux bureaux des développeurs.

    Comment devez-vous compléter la commande ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: powershell
  template: |
    New-AzWvdHostPool -ResourceGroupName RG-AVD-Dev -Name HP-Dev -Location eastus2 `
      -HostPoolType [[type]] `
      -LoadBalancerType [[lb]] `
      -PreferredAppGroupType Desktop `
      [[assign]] `
      [[start]]
  slots:
    - id: type
      options:
        - { id: pooled, text: Pooled }
        - { id: personal, text: Personal }
        - { id: desktop, text: Desktop }
    - id: lb
      options:
        - { id: breadth, text: BreadthFirst }
        - { id: depth, text: DepthFirst }
        - { id: persistent, text: Persistent }
    - id: assign
      options:
        - { id: direct, text: "-PersonalDesktopAssignmentType Direct" }
        - { id: automatic, text: "-PersonalDesktopAssignmentType Automatic" }
        - { id: maxone, text: "-MaxSessionLimit 1" }
    - id: start
      options:
        - { id: startvm, text: "-StartVMOnConnect" }
        - { id: validation, text: "-ValidationEnvironment" }
        - { id: agent, text: "-AgentUpdateType Scheduled" }
answer:
  values: { type: personal, lb: persistent, assign: automatic, start: startvm }
explanation:
  correct:
    en: |
      A personal host pool uses the HostPoolType value Personal and the Persistent load-balancing type, because each user always returns to the same session host. With the Automatic assignment type, a developer gets a free personal desktop the first time they connect, without an administrator assigning it. The StartVMOnConnect switch starts a deallocated session host when its user connects; the Azure Virtual Desktop service principal also needs a power-on role on the VMs.
    fr: |
      Un pool d'hôtes personnel utilise la valeur HostPoolType Personal et le type d'équilibrage de charge Persistent, car chaque utilisateur revient toujours sur le même hôte de session. Avec le type d'attribution Automatic, un développeur obtient un bureau personnel libre lors de sa première connexion, sans qu'un administrateur l'attribue. Le commutateur StartVMOnConnect démarre un hôte de session désalloué quand son utilisateur se connecte ; le principal de service Azure Virtual Desktop a aussi besoin d'un rôle de démarrage sur les machines virtuelles.
  options:
    pooled: { en: "A pooled host pool shares session hosts between users and doesn't assign personal desktops.", fr: "Un pool d'hôtes regroupé partage les hôtes de session entre les utilisateurs et n'attribue pas de bureaux personnels." }
    desktop: { en: "Desktop is a value of PreferredAppGroupType, not a host pool type.", fr: "Desktop est une valeur de PreferredAppGroupType, pas un type de pool d'hôtes." }
    breadth: { en: "BreadthFirst and DepthFirst are load-balancing algorithms of pooled host pools.", fr: "BreadthFirst et DepthFirst sont des algorithmes d'équilibrage de charge des pools d'hôtes regroupés." }
    depth: { en: "DepthFirst fills one session host before the next; it applies to pooled host pools.", fr: "DepthFirst remplit un hôte de session avant le suivant ; il s'applique aux pools d'hôtes regroupés." }
    direct: { en: "With Direct assignment, an administrator must assign each desktop before the developer can connect.", fr: "Avec l'attribution Direct, un administrateur doit attribuer chaque bureau avant que le développeur puisse se connecter." }
    maxone: { en: "A session limit doesn't assign a desktop to a user; personal host pools are already limited to one user per session host.", fr: "Une limite de sessions n'attribue pas de bureau à un utilisateur ; les pools d'hôtes personnels sont déjà limités à un utilisateur par hôte de session." }
    validation: { en: "ValidationEnvironment marks the host pool as a validation pool that receives service updates first; it doesn't start VMs.", fr: "ValidationEnvironment marque le pool d'hôtes comme pool de validation qui reçoit les mises à jour du service en premier ; il ne démarre pas de machines virtuelles." }
    agent: { en: "AgentUpdateType Scheduled sets a maintenance window for agent updates; it doesn't start VMs.", fr: "AgentUpdateType Scheduled définit une fenêtre de maintenance pour les mises à jour de l'agent ; il ne démarre pas de machines virtuelles." }
references:
  - title: New-AzWvdHostPool (Az.DesktopVirtualization)
    url: https://learn.microsoft.com/en-us/powershell/module/az.desktopvirtualization/new-azwvdhostpool
  - title: Configure personal desktop assignment in Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/configure-host-pool-personal-desktop-assignment-type
