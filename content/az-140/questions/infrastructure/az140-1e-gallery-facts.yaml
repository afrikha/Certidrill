id: az140-1e-gallery-facts
objective: "1.5.7"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Litware has an Azure Compute Gallery named **galAvd** in West Europe. galAvd contains an image definition named **win10-legacy** with the Hyper-V generation **V1**. Its image versions are replicated to West Europe and North Europe and are used to deploy Azure Virtual Desktop session hosts in both regions.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware dispose d'une galerie Azure Compute Gallery nommée **galAvd** dans West Europe. galAvd contient une définition d'image nommée **win10-legacy** de génération Hyper-V **V1**. Ses versions d'image sont répliquées dans West Europe et North Europe et servent à déployer des hôtes de session Azure Virtual Desktop dans les deux régions.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: If West Europe becomes unavailable, session hosts can still be deployed in North Europe from the replicated image versions.
        fr: Si West Europe devient indisponible, des hôtes de session peuvent toujours être déployés dans North Europe à partir des versions d'image répliquées.
    - id: s2
      text:
        en: You can update the Hyper-V generation of win10-legacy to V2 so that its next image versions support Trusted launch.
        fr: Vous pouvez modifier la génération Hyper-V de win10-legacy en V2 pour que ses prochaines versions d'image prennent en charge Trusted launch.
    - id: s3
      text:
        en: Session hosts can still be created from an image version of win10-legacy after the end-of-life date of the version has passed.
        fr: Des hôtes de session peuvent toujours être créés à partir d'une version d'image de win10-legacy une fois la date de fin de vie de la version dépassée.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: "A gallery is a regional resource; if its region is down you can't create or update gallery resources there, but the image versions replicated to other regions stay usable. The Hyper-V generation isn't an updatable property of an image definition, so V2 images need a new definition. End-of-life dates are informational: VMs can still be created from versions past that date."
    fr: "Une galerie est une ressource régionale : si sa région est indisponible, vous ne pouvez pas y créer ni y modifier de ressources de galerie, mais les versions d'image répliquées dans d'autres régions restent utilisables. La génération Hyper-V n'est pas une propriété modifiable d'une définition d'image : les images V2 exigent une nouvelle définition. Les dates de fin de vie sont informatives : des machines virtuelles peuvent toujours être créées à partir de versions qui ont dépassé cette date."
references:
  - title: Store and share resources in Azure Compute Gallery
    url: https://learn.microsoft.com/en-us/azure/virtual-machines/azure-compute-gallery
  - title: Store and share images in an Azure Compute Gallery
    url: https://learn.microsoft.com/en-us/azure/virtual-machines/shared-image-galleries
