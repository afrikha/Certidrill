id: az140-1c-lic-external-os
objective: "1.3.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Litware, Inc. plans to offer a SaaS version of its inventory application to external customers by using Azure Virtual Desktop. Litware will license the customers' users with per-user access pricing.

    The application vendor supports the following operating systems: Windows Server 2022, Windows Server 2025 and Windows 11 Enterprise multi-session.

    You need to recommend an operating system for the session hosts. The solution must keep the deployment compliant.

    What should you recommend?
  fr: |
    Litware, Inc. prévoit de proposer une version SaaS de son application de gestion des stocks à des clients externes à l'aide d'Azure Virtual Desktop. Litware licenciera les utilisateurs des clients avec la tarification de l'accès par utilisateur.

    L'éditeur de l'application prend en charge les systèmes d'exploitation suivants : Windows Server 2022, Windows Server 2025 et Windows 11 Entreprise multisession.

    Vous devez recommander un système d'exploitation pour les hôtes de session. La solution doit maintenir la conformité du déploiement.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "Windows 11 Enterprise multi-session", fr: "Windows 11 Entreprise multisession" } }
    - { id: b, text: { en: "Windows Server 2022 Datacenter", fr: "Windows Server 2022 Datacenter" } }
    - { id: c, text: { en: "Windows Server 2025 Datacenter", fr: "Windows Server 2025 Datacenter" } }
    - { id: d, text: { en: "Windows 11 Enterprise LTSC", fr: "Windows 11 Entreprise LTSC" } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Per-user access pricing covers Windows 11 and Windows 10 Enterprise session hosts, single-session or multi-session. It isn't available for Windows Server operating systems, so Windows 11 Enterprise multi-session is the only supported choice that keeps external use compliant.
    fr: |
      La tarification de l'accès par utilisateur couvre les hôtes de session Windows 11 et Windows 10 Entreprise, mono-session ou multisession. Elle n'est pas disponible pour les systèmes d'exploitation Windows Server : Windows 11 Entreprise multisession est donc le seul choix pris en charge qui garde l'usage externe conforme.
  options:
    b: { en: "Per-user access pricing isn't available for Windows Server, so external commercial use isn't supported on it.", fr: "La tarification de l'accès par utilisateur n'est pas disponible pour Windows Server : l'usage commercial externe n'y est pas pris en charge." }
    c: { en: "Windows Server 2025 has the same restriction: no per-user access pricing for external users.", fr: "Windows Server 2025 a la même restriction : pas de tarification de l'accès par utilisateur pour les utilisateurs externes." }
    d: { en: "LTSC editions aren't supported as Azure Virtual Desktop session hosts.", fr: "Les éditions LTSC ne sont pas prises en charge comme hôtes de session Azure Virtual Desktop." }
references:
  - title: Licensing Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/licensing
  - title: Prerequisites for Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/prerequisites
