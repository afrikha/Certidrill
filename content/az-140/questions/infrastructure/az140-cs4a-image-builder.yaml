id: az140-cs4a-image-builder
objective: "1.5.2"
type: ordering
caseStudy: az140-cs4a-woodgrove-bank
difficulty: 2
status: draft
stem:
  en: |
    You need to replace the manual monthly image process with a solution that meets the image build requirement.

    Which three actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Vous devez remplacer le processus manuel de création mensuelle de l'image par une solution qui satisfait l'exigence de création des images.

    Quelles sont les trois actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - { id: identity, text: { en: "Create a user-assigned managed identity and assign it a custom role that contains the image read, write and delete actions at the scope of RG-Images.", fr: "Créer une identité managée affectée par l'utilisateur et lui attribuer un rôle personnalisé qui contient les actions de lecture, d'écriture et de suppression d'images à l'étendue de RG-Images." } }
    - { id: template, text: { en: "Deploy an image template that uses the identity, runs the PowerShell and Windows Update customizers, and distributes a managed image to RG-Images.", fr: "Déployer un modèle d'image qui utilise l'identité, exécute les personnalisations PowerShell et Windows Update, et distribue une image managée dans RG-Images." } }
    - { id: build, text: { en: "Start the build by running the Start-AzImageBuilderTemplate cmdlet.", fr: "Démarrer le build en exécutant la cmdlet Start-AzImageBuilderTemplate." } }
    - { id: contributor, text: { en: "Create a user-assigned managed identity and assign it the Contributor role at the scope of RG-Images.", fr: "Créer une identité managée affectée par l'utilisateur et lui attribuer le rôle Contributor à l'étendue de RG-Images." } }
    - { id: sysprep, text: { en: "Deploy a reference VM, run Sysprep on it, and capture it to RG-Images.", fr: "Déployer une machine virtuelle de référence, y exécuter Sysprep et la capturer dans RG-Images." } }
    - { id: systemid, text: { en: "Enable a system-assigned managed identity on the image template.", fr: "Activer une identité managée affectée par le système sur le modèle d'image." } }
answer:
  sequence: [ identity, template, build ]
explanation:
  correct:
    en: |
      Azure VM Image Builder requires a user-assigned managed identity, which it uses to read and write images, so you create it first and give it a custom role with only the image actions it needs, scoped to the resource group where the image is written. The image template references the identity and lists the customizers and the distribution target; deploying it doesn't build anything. Start-AzImageBuilderTemplate then runs the build on a temporary VM in a staging resource group.
    fr: |
      Le Générateur d'images de machine virtuelle Azure exige une identité managée affectée par l'utilisateur, qu'il utilise pour lire et écrire les images : vous la créez d'abord et lui accordez un rôle personnalisé qui ne contient que les actions d'image nécessaires, à l'étendue du groupe de ressources où l'image est écrite. Le modèle d'image référence l'identité et décrit les personnalisations et la cible de distribution ; son déploiement ne crée aucune image. Start-AzImageBuilderTemplate exécute ensuite le build sur une machine virtuelle temporaire dans un groupe de ressources intermédiaire.
  options:
    contributor: { en: "Image Builder doesn't need Contributor on the resource group to distribute images, and Contributor grants far more than the build needs.", fr: "Le Générateur d'images n'a pas besoin du rôle Contributor sur le groupe de ressources pour distribuer des images, et ce rôle accorde bien plus que ce dont le build a besoin." }
    sysprep: { en: "A manually captured reference VM is the current process that Image Builder replaces; Image Builder creates and deletes its own build VM.", fr: "La capture manuelle d'une machine virtuelle de référence est le processus actuel que le Générateur d'images remplace ; il crée et supprime lui-même sa machine virtuelle de build." }
    systemid: { en: "Image Builder uses a user-assigned managed identity that you create and reference in the template, not a system-assigned identity.", fr: "Le Générateur d'images utilise une identité managée affectée par l'utilisateur que vous créez et référencez dans le modèle, pas une identité affectée par le système." }
references:
  - title: Create an Azure Virtual Desktop image by using Azure VM Image Builder
    url: https://learn.microsoft.com/en-us/azure/virtual-machines/windows/image-builder-virtual-desktop
  - title: Configure Azure VM Image Builder permissions by using PowerShell
    url: https://learn.microsoft.com/en-us/azure/virtual-machines/linux/image-builder-permissions-powershell
