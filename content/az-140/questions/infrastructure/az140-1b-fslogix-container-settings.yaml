id: az140-1b-fslogix-container-settings
objective: "1.2.2"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    You are configuring FSLogix profile containers for an Azure Virtual Desktop pooled host pool. The containers are stored in an Azure file share.

    You need to meet the following requirements:

    - Containers must be created as VHDX files.
    - A container must be able to grow to 50,000 MB.
    - Each user folder in the share must start with the user name instead of the SID.
    - The full maximum size of each container must be allocated when the container is created.

    Which registry value should you configure for each requirement? To answer, drag the appropriate values to the correct requirements. Each value may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous configurez des conteneurs de profils FSLogix pour un pool d'hôtes regroupé Azure Virtual Desktop. Les conteneurs sont stockés dans un partage de fichiers Azure.

    Vous devez répondre aux exigences suivantes :

    - Les conteneurs doivent être créés sous forme de fichiers VHDX.
    - Un conteneur doit pouvoir atteindre 50 000 Mo.
    - Chaque dossier utilisateur du partage doit commencer par le nom d'utilisateur plutôt que par le SID.
    - La taille maximale complète de chaque conteneur doit être allouée à sa création.

    Quelle valeur de Registre devez-vous configurer pour chaque exigence ? Pour répondre, faites glisser les valeurs appropriées vers les exigences correspondantes. Chaque valeur peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: vol, text: VolumeType }
    - { id: size, text: SizeInMBs }
    - { id: flip, text: FlipFlopProfileDirectoryName }
    - { id: dyn, text: IsDynamic }
    - { id: comp, text: AccessNetworkAsComputerObject }
    - { id: ptype, text: ProfileType }
  targets:
    - { id: t1, text: { en: "Create VHDX files", fr: "Créer des fichiers VHDX" } }
    - { id: t2, text: { en: "Allow containers of up to 50,000 MB", fr: "Autoriser des conteneurs jusqu'à 50 000 Mo" } }
    - { id: t3, text: { en: "Name folders with the user name first", fr: "Nommer les dossiers en commençant par le nom d'utilisateur" } }
    - { id: t4, text: { en: "Allocate the full size at creation", fr: "Allouer la taille complète à la création" } }
answer:
  mapping: { t1: vol, t2: size, t3: flip, t4: dyn }
explanation:
  correct:
    en: VolumeType defaults to vhd; set it to vhdx. SizeInMBs (default 30000) sets the maximum container size and can be increased. FlipFlopProfileDirectoryName = 1 names folders `%username%_%sid%` instead of `%sid%_%username%`. IsDynamic = 0 creates a fixed-size, fully allocated file instead of the default dynamic one.
    fr: "VolumeType vaut vhd par défaut ; définissez-le sur vhdx. SizeInMBs (30000 par défaut) définit la taille maximale du conteneur et peut être augmenté. FlipFlopProfileDirectoryName = 1 nomme les dossiers `%username%_%sid%` au lieu de `%sid%_%username%`. IsDynamic = 0 crée un fichier de taille fixe, entièrement alloué, au lieu du fichier dynamique par défaut."
  options:
    comp: { en: "AccessNetworkAsComputerObject makes FSLogix attach the container as the computer account; it doesn't change size, format or naming.", fr: "AccessNetworkAsComputerObject fait attacher le conteneur par le compte d'ordinateur ; il ne change ni la taille, ni le format, ni le nommage." }
    ptype: { en: "ProfileType controls read-write and read-only access for concurrent sessions.", fr: "ProfileType contrôle l'accès en lecture-écriture et en lecture seule pour les sessions simultanées." }
references:
  - title: Configuration Setting Reference
    url: https://learn.microsoft.com/en-us/fslogix/reference-configuration-settings
