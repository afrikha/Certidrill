id: az140-1d-img-generalize-capture
objective: "1.5.1"
type: ordering
difficulty: 1
status: draft
stem:
  en: |
    You are creating a golden image for an Azure Virtual Desktop host pool. A virtual machine named **vm-golden** runs Windows 11 Enterprise multi-session. It isn't joined to a domain, all applications and updates are installed, and you took a final snapshot of its OS disk.

    You need to generalize vm-golden and capture it to an Azure Compute Gallery.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Vous créez une image de référence pour un pool d'hôtes Azure Virtual Desktop. Une machine virtuelle nommée **vm-golden** exécute Windows 11 Entreprise multisession. Elle n'est jointe à aucun domaine, toutes les applications et mises à jour sont installées, et vous avez pris un dernier instantané de son disque du système d'exploitation.

    Vous devez généraliser vm-golden et la capturer dans une galerie Azure Compute Gallery.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - id: panther
      text:
        en: Delete the `C:\Windows\Panther` folder.
        fr: Supprimer le dossier `C:\Windows\Panther`.
    - id: sysprep
      text:
        en: Run `sysprep.exe /generalize /shutdown`.
        fr: Exécuter `sysprep.exe /generalize /shutdown`.
    - id: mark
      text:
        en: Mark vm-golden as generalized in Azure.
        fr: Marquer vm-golden comme généralisée dans Azure.
    - id: capture
      text:
        en: Capture vm-golden as an image version in the gallery.
        fr: Capturer vm-golden comme version d'image dans la galerie.
    - id: start
      text:
        en: Start vm-golden to check that Sysprep completed.
        fr: Démarrer vm-golden pour vérifier que Sysprep s'est terminé.
    - id: agent
      text:
        en: Install the Azure Virtual Desktop Agent on vm-golden.
        fr: Installer l'agent Azure Virtual Desktop sur vm-golden.
answer:
  sequence: [ panther, sysprep, mark, capture ]
explanation:
  correct:
    en: |
      Logs left in the Panther folder by an earlier Sysprep run can make Sysprep fail, so you delete it first. `sysprep.exe /generalize /shutdown` removes the machine-specific information and shuts the VM down. You then mark the VM as generalized on the platform (`Set-AzVm -Generalized`) and capture it as a gallery image version.
    fr: |
      Les journaux laissés dans le dossier Panther par une exécution antérieure de Sysprep peuvent le faire échouer : vous le supprimez donc d'abord. `sysprep.exe /generalize /shutdown` supprime les informations propres à la machine et arrête la machine virtuelle. Vous la marquez ensuite comme généralisée sur la plateforme (`Set-AzVm -Generalized`) et la capturez comme version d'image de la galerie.
  options:
    start:
      en: |
        Once generalized, the VM can't be restarted: you capture it directly and keep the final snapshot for later builds.
      fr: |
        Une fois généralisée, la machine virtuelle ne peut pas être redémarrée : vous la capturez directement et conservez le dernier instantané pour les builds suivants.
    agent:
      en: The golden image must not contain the Azure Virtual Desktop Agent; it is installed on each session host when the host pool deploys it.
      fr: L'image de référence ne doit pas contenir l'agent Azure Virtual Desktop ; il est installé sur chaque hôte de session lors de son déploiement dans le pool d'hôtes.
references:
  - title: Remove machine specific information by deprovisioning or generalizing a VM before creating an image
    url: https://learn.microsoft.com/en-us/azure/virtual-machines/generalize
  - title: Create a golden image in Azure
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/set-up-golden-image
