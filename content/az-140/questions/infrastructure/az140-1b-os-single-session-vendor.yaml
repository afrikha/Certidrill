id: az140-1b-os-single-session-vendor
objective: "1.3.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Adatum Corporation plans an Azure Virtual Desktop personal host pool for 40 engineers. Each engineer gets a dedicated session host. The vendor of the engineering application supports it only on single-session editions of the Windows client operating system.

    You need to recommend an operating system for the session hosts. The solution must be supported by both Azure Virtual Desktop and the vendor and must provide the latest Windows client release.

    What should you recommend?
  fr: |
    Adatum Corporation prévoit un pool d'hôtes personnel Azure Virtual Desktop pour 40 ingénieurs. Chaque ingénieur dispose d'un hôte de session dédié. L'éditeur de l'application d'ingénierie ne la prend en charge que sur les éditions monosession du système d'exploitation client Windows.

    Vous devez recommander un système d'exploitation pour les hôtes de session. La solution doit être prise en charge à la fois par Azure Virtual Desktop et par l'éditeur, et doit fournir la dernière version du client Windows.

    Que devez-vous recommander ?
body:
  options:
    - id: a
      text: Windows 11 Enterprise LTSC 2024
    - id: b
      text: Windows 11 Enterprise N
    - id: c
      text: Windows 11 Enterprise multi-session
    - id: d
      text: Windows 11 Enterprise
answer: { optionId: d }
explanation:
  correct:
    en: |
      Windows 11 Enterprise is the single-session Windows 11 edition supported for Azure Virtual Desktop session hosts, typically in personal host pools. It meets the vendor's single-session requirement.
    fr: |
      Windows 11 Entreprise est l'édition monosession de Windows 11 prise en charge pour les hôtes de session Azure Virtual Desktop, généralement dans les pools d'hôtes personnels. Elle répond à l'exigence monosession de l'éditeur.
  options:
    a: { en: "LTSC editions are single-session but aren't supported as Azure Virtual Desktop session hosts.", fr: "Les éditions LTSC sont monosession, mais ne sont pas prises en charge comme hôtes de session Azure Virtual Desktop." }
    b: { en: "N and KN editions aren't supported as Azure Virtual Desktop session hosts.", fr: "Les éditions N et KN ne sont pas prises en charge comme hôtes de session Azure Virtual Desktop." }
    c: { en: "A multi-session edition is supported in Azure Virtual Desktop, but the vendor supports single-session editions only.", fr: "Une édition multisession est prise en charge dans Azure Virtual Desktop, mais l'éditeur ne prend en charge que les éditions monosession." }
references:
  - title: Prerequisites for Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/prerequisites
