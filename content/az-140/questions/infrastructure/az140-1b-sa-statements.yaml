id: az140-1b-sa-statements
objective: "1.2.3"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    You are preparing a storage account named **stavdprof08** for the FSLogix profile containers of an Azure Virtual Desktop host pool whose session hosts are joined to AD DS.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous préparez un compte de stockage nommé **stavdprof08** pour les conteneurs de profils FSLogix d'un pool d'hôtes Azure Virtual Desktop dont les hôtes de session sont joints à AD DS.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: You can enable AD DS and Microsoft Entra Kerberos authentication on stavdprof08 at the same time.
        fr: Vous pouvez activer en même temps l'authentification AD DS et l'authentification Microsoft Entra Kerberos sur stavdprof08.
    - id: s2
      text:
        en: Storage account key access must remain enabled on stavdprof08 for the AD DS configuration procedure.
        fr: L'accès par clé du compte de stockage doit rester activé sur stavdprof08 pour la procédure de configuration AD DS.
    - id: s3
      text:
        en: The session hosts connect to the file share over TCP port 445.
        fr: Les hôtes de session se connectent au partage de fichiers sur le port TCP 445.
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: |
      A storage account supports a single identity source: AD DS, Microsoft Entra Domain Services or Microsoft Entra Kerberos. The Azure Virtual Desktop procedure for AD DS requires Enable storage account key access to stay enabled, and the key is used to mount the share when you set the first NTFS permissions. Azure Files is accessed over SMB, which uses TCP port 445.
    fr: |
      Un compte de stockage ne prend en charge qu'une seule source d'identité : AD DS, Microsoft Entra Domain Services ou Microsoft Entra Kerberos. La procédure Azure Virtual Desktop pour AD DS exige que l'option d'accès par clé du compte de stockage reste activée, et la clé sert à monter le partage quand vous définissez les premières autorisations NTFS. Azure Files est accessible en SMB, qui utilise le port TCP 445.
references:
  - title: Store FSLogix profile containers on Azure Files and Active Directory Domain Services or Microsoft Entra Domain Services
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/fslogix-profile-container-configure-azure-files-active-directory
  - title: Overview of Azure Files identity-based authentication for SMB access
    url: https://learn.microsoft.com/en-us/azure/storage/files/storage-files-active-directory-overview
