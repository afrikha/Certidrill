id: az140-1b-anf-manual-qos
objective: "1.2.5"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    You have an Azure NetApp Files capacity pool named **pool-ultra** with a size of 4 TiB, the Ultra service level and the auto QoS type. It contains two SMB volumes:

    | Volume | Quota | Use |
    | --- | --- | --- |
    | vol-profiles | 3 TiB | FSLogix profile containers |
    | vol-apps | 1 TiB | App attach packages |

    You need vol-profiles to get a throughput limit of 480 MiB/s and vol-apps a limit of 32 MiB/s. The solution must not change the quotas of the volumes or the size of the pool.

    Which two actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un pool de capacité Azure NetApp Files nommé **pool-ultra** d'une taille de 4 Tio, avec le niveau de service Ultra et le type de QoS automatique. Il contient deux volumes SMB :

    | Volume | Quota | Usage |
    | --- | --- | --- |
    | vol-profiles | 3 Tio | Conteneurs de profils FSLogix |
    | vol-apps | 1 Tio | Packages App attach |

    Vous devez faire en sorte que vol-profiles obtienne une limite de débit de 480 Mio/s et vol-apps une limite de 32 Mio/s. La solution ne doit modifier ni les quotas des volumes ni la taille du pool.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Change the QoS type of pool-ultra to manual.", fr: "Passer le type de QoS de pool-ultra à manuel." } }
    - { id: b, text: { en: "Change the service level of pool-ultra to Premium.", fr: "Passer le niveau de service de pool-ultra à Premium." } }
    - { id: c, text: { en: "Set the throughput of each volume in MiB/s.", fr: "Définir le débit de chaque volume en Mio/s." } }
    - { id: d, text: { en: "Move vol-apps to a new capacity pool that uses the Standard service level.", fr: "Déplacer vol-apps vers un nouveau pool de capacité qui utilise le niveau de service Standard." } }
    - { id: e, text: { en: "Enable Continuous Availability on vol-profiles.", fr: "Activer la disponibilité continue sur vol-profiles." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |
      With auto QoS, throughput follows the quota: 3 TiB × 128 MiB/s gives vol-profiles 384 MiB/s, and vol-apps gets 128 MiB/s. In a manual QoS pool you set each volume's throughput independently of its quota, within the pool total of 4 TiB × 128 MiB/s = 512 MiB/s, which covers 480 + 32 MiB/s. An auto QoS pool can be converted to manual, but not back.
    fr: |
      Avec la QoS automatique, le débit suit le quota : 3 Tio × 128 Mio/s donnent 384 Mio/s à vol-profiles, et vol-apps obtient 128 Mio/s. Dans un pool à QoS manuelle, vous définissez le débit de chaque volume indépendamment de son quota, dans la limite du total du pool de 4 Tio × 128 Mio/s = 512 Mio/s, qui couvre 480 + 32 Mio/s. Un pool à QoS automatique peut être converti en manuel, mais pas l'inverse.
  options:
    b: { en: "Premium provides 64 MiB/s per TiB: the pool total would fall to 256 MiB/s, below the 512 MiB/s needed.", fr: "Premium fournit 64 Mio/s par Tio : le total du pool tomberait à 256 Mio/s, sous les 512 Mio/s nécessaires." }
    d: { en: "A new pool adds provisioned capacity, and vol-profiles would still be limited by its quota under auto QoS.", fr: "Un nouveau pool ajoute de la capacité provisionnée, et vol-profiles resterait limité par son quota en QoS automatique." }
    e: { en: "Continuous Availability protects SMB sessions; it doesn't change throughput limits.", fr: "La disponibilité continue protège les sessions SMB ; elle ne change pas les limites de débit." }
references:
  - title: Service levels for Azure NetApp Files
    url: https://learn.microsoft.com/en-us/azure/azure-netapp-files/azure-netapp-files-service-levels
  - title: Create a capacity pool for Azure NetApp Files
    url: https://learn.microsoft.com/en-us/azure/azure-netapp-files/azure-netapp-files-set-up-capacity-pool
