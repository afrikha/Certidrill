id: az140-1b-anf-statements
objective: "1.2.5"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    Litware, Inc. plans to store FSLogix profile containers on Azure NetApp Files for an Azure Virtual Desktop host pool. The users are hybrid identities synced from the litware.com AD DS domain to Microsoft Entra ID. Volumes will be created in a virtual network named **VNet-AVD**.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware, Inc. prévoit de stocker les conteneurs de profils FSLogix sur Azure NetApp Files pour un pool d'hôtes Azure Virtual Desktop. Les utilisateurs sont des identités hybrides synchronisées du domaine AD DS litware.com vers Microsoft Entra ID. Les volumes seront créés dans un réseau virtuel nommé **VNet-AVD**.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: Each NetApp account can have only one Active Directory connection.
        fr: Chaque compte NetApp ne peut avoir qu'une seule connexion Active Directory.
    - id: s2
      text:
        en: Volumes can be spread across two subnets of VNet-AVD that are both delegated to Microsoft.NetApp/volumes.
        fr: Les volumes peuvent être répartis sur deux sous-réseaux de VNet-AVD tous deux délégués à Microsoft.NetApp/volumes.
    - id: s3
      text:
        en: Microsoft Entra joined session hosts can use the profile volumes for these users.
        fr: Des hôtes de session joints à Microsoft Entra peuvent utiliser les volumes de profils pour ces utilisateurs.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |
      The Active Directory configuration is limited to one connection per NetApp account. Only one delegated subnet can be used per virtual network; volume creation fails when more than one is used. Azure NetApp Files requires Kerberos from AD DS or Microsoft Entra Domain Services, but Microsoft Entra joined and hybrid joined session hosts are supported when the user identities are backed by AD DS, as in this hybrid scenario.
    fr: |
      La configuration Active Directory est limitée à une connexion par compte NetApp. Un seul sous-réseau délégué peut être utilisé par réseau virtuel ; la création de volume échoue quand plusieurs le sont. Azure NetApp Files exige Kerberos fourni par AD DS ou Microsoft Entra Domain Services, mais les hôtes de session joints à Microsoft Entra et joints hybrides sont pris en charge quand les identités des utilisateurs proviennent d'AD DS, comme dans ce scénario hybride.
references:
  - title: Store FSLogix profile containers on Azure NetApp Files
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/create-fslogix-profile-container
  - title: Create and manage Active Directory connections for Azure NetApp Files
    url: https://learn.microsoft.com/en-us/azure/azure-netapp-files/create-active-directory-connections
