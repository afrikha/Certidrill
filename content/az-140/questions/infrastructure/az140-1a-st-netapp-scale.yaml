id: az140-1a-st-netapp-scale
objective: "1.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Contoso plans a pooled Azure Virtual Desktop deployment for graphic designers and 3D modelers. The session hosts will be joined to an AD DS domain. The profile storage must meet the following requirements:

    - support profile volumes of up to 460,000 IOPS;
    - provide a storage latency of about 1 ms;
    - be an Azure-native platform service.

    You need to recommend the storage for the FSLogix profile containers.

    What should you recommend?
  fr: |
    Contoso planifie un déploiement Azure Virtual Desktop partagé pour des graphistes et des modélistes 3D. Les hôtes de session seront joints à un domaine AD DS. Le stockage des profils doit répondre aux exigences suivantes :

    - prendre en charge des volumes de profils jusqu'à 460 000 IOPS ;
    - fournir une latence de stockage d'environ 1 ms ;
    - être un service de plateforme natif d'Azure.

    Vous devez recommander le stockage des conteneurs de profils FSLogix.

    Que devez-vous recommander ?
body:
  options:
    - id: a
      text: { en: "Azure Files standard (HDD) file shares", fr: "Des partages de fichiers Azure Files standard (HDD)" }
    - id: b
      text: { en: "Azure Files premium (SSD) file shares", fr: "Des partages de fichiers Azure Files Premium (SSD)" }
    - id: c
      text: { en: "Storage Spaces Direct with Premium SSD disks", fr: "Storage Spaces Direct avec des disques SSD Premium" }
    - id: d
      text: { en: "Azure NetApp Files volumes", fr: "Des volumes Azure NetApp Files" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Azure NetApp Files is an Azure-native service that offers up to 460,000 IOPS and 4.5 GBps per volume at about 1 ms latency, with Standard, Premium and Ultra tiers. Microsoft suggests the Ultra or Premium tier for power users such as graphic designers and 3D modelers, depending on the user count.
    fr: |
      Azure NetApp Files est un service natif d'Azure qui offre jusqu'à 460 000 IOPS et 4,5 Go/s par volume avec une latence d'environ 1 ms, avec les niveaux Standard, Premium et Ultra. Microsoft suggère le niveau Ultra ou Premium pour des utilisateurs intensifs comme des graphistes et des modélistes 3D, selon le nombre d'utilisateurs.
  options:
    a: { en: "Standard HDD shares can't reach this IOPS level or latency.", fr: "Les partages HDD standard ne peuvent pas atteindre ce niveau d'IOPS ni cette latence." }
    b: { en: "Azure Files reaches up to 100,000 IOPS per share at about 3 ms latency.", fr: "Azure Files atteint jusqu'à 100 000 IOPS par partage avec une latence d'environ 3 ms." }
    c: { en: "Storage Spaces Direct is self-managed on VMs and limited by per-disk IOPS; it isn't a platform service.", fr: "Storage Spaces Direct est autogéré sur des machines virtuelles et limité par les IOPS de chaque disque ; ce n'est pas un service de plateforme." }
references:
  - title: Storage options for FSLogix profile containers in Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/store-fslogix-profile
