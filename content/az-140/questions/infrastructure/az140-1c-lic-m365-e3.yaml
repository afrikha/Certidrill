id: az140-1c-lic-m365-e3
objective: "1.3.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso, Ltd. has 400 employees. Each employee is assigned a Microsoft 365 E3 license in the contoso.com Microsoft Entra tenant.

    Contoso plans an Azure Virtual Desktop pooled host pool whose session hosts run Windows 11 Enterprise multi-session. The employees will connect to a full desktop.

    You need to recommend the access licensing for the employees. The solution must minimize costs.

    What should you recommend?
  fr: |
    Contoso, Ltd. compte 400 employés. Chaque employé dispose d'une licence Microsoft 365 E3 dans le locataire Microsoft Entra contoso.com.

    Contoso prévoit un pool d'hôtes Azure Virtual Desktop regroupé dont les hôtes de session exécutent Windows 11 Entreprise multisession. Les employés se connecteront à un bureau complet.

    Vous devez recommander les licences d'accès des employés. La solution doit réduire les coûts au minimum.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "An RDS per-user CAL with Software Assurance for each employee", fr: "Une CAL RDS par utilisateur avec Software Assurance pour chaque employé" } }
    - { id: b, text: { en: "No additional access license for the employees", fr: "Aucune licence d'accès supplémentaire pour les employés" } }
    - { id: c, text: { en: "Per-user access pricing on the Azure subscription", fr: "La tarification de l'accès par utilisateur sur l'abonnement Azure" } }
    - { id: d, text: { en: "A Windows VDA per user license for each employee", fr: "Une licence Windows VDA par utilisateur pour chaque employé" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Microsoft 365 E3 is one of the eligible licenses that grant access rights to Windows 11 Enterprise and Windows 11 Enterprise multi-session session hosts for internal users. The employees need nothing more; Contoso pays only for the Azure compute, storage and networking.
    fr: |
      Microsoft 365 E3 fait partie des licences éligibles qui donnent aux utilisateurs internes le droit d'accéder à des hôtes de session Windows 11 Entreprise et Windows 11 Entreprise multisession. Les employés n'ont besoin de rien de plus ; Contoso ne paie que le calcul, le stockage et le réseau Azure.
  options:
    a: { en: "RDS CALs license access to Windows Server session hosts, not to Windows 11 multi-session.", fr: "Les CAL RDS couvrent l'accès aux hôtes de session Windows Server, pas à Windows 11 multisession." }
    c: { en: "Per-user access pricing is for external users only, and it would charge employees who are already licensed.", fr: "La tarification de l'accès par utilisateur est réservée aux utilisateurs externes, et elle facturerait des employés déjà licenciés." }
    d: { en: "Windows VDA per user is also eligible, but buying it duplicates rights that Microsoft 365 E3 already includes.", fr: "Windows VDA par utilisateur est aussi éligible, mais l'acheter fait double emploi avec les droits déjà inclus dans Microsoft 365 E3." }
references:
  - title: Licensing Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/licensing
