id: az140-1d-img-before-sysprep
objective: "1.5.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    You are building a golden image for an Azure Virtual Desktop pooled host pool. To apply Group Policy settings during customization, you joined the build virtual machine **vm-build** to the AD DS domain contoso.com. A security script also enabled BitLocker on the OS drive of vm-build. You have finished installing the applications.

    Which two actions must you perform before you run Sysprep on vm-build? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous construisez une image de référence pour un pool d'hôtes regroupé Azure Virtual Desktop. Pour appliquer des paramètres de stratégie de groupe pendant la personnalisation, vous avez joint la machine virtuelle de build **vm-build** au domaine AD DS contoso.com. Un script de sécurité a également activé BitLocker sur le lecteur du système d'exploitation de vm-build. Vous avez terminé l'installation des applications.

    Quelles sont les deux actions à effectuer avant d'exécuter Sysprep sur vm-build ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Remove vm-build from the contoso.com domain.", fr: "Retirer vm-build du domaine contoso.com." } }
    - { id: b, text: { en: "Install the Azure Virtual Desktop Agent and the Agent Boot Loader.", fr: "Installer l'agent Azure Virtual Desktop et le chargeur de démarrage de l'agent." } }
    - { id: c, text: { en: "Fully decrypt the OS drive of vm-build.", fr: "Déchiffrer entièrement le lecteur du système d'exploitation de vm-build." } }
    - { id: d, text: { en: "Enable the Unified Write Filter (UWF) on vm-build.", fr: "Activer le filtre d'écriture unifié (UWF) sur vm-build." } }
    - { id: e, text: { en: "Install the Microsoft Entra ID login extension on vm-build.", fr: "Installer l'extension de connexion Microsoft Entra ID sur vm-build." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |
      Microsoft says to remove a build VM from the domain before running Sysprep; each session host joins the domain when it's deployed. Sysprep requires fully decrypted drives, so BitLocker must be turned off on vm-build before you generalize it.
    fr: |
      Microsoft indique de retirer une machine virtuelle de build du domaine avant d'exécuter Sysprep ; chaque hôte de session rejoint le domaine lors de son déploiement. Sysprep exige des lecteurs entièrement déchiffrés : BitLocker doit donc être désactivé sur vm-build avant de la généraliser.
  options:
    b:
      en: The agent must never be in the golden image; its registration token expires and hosts created from the image fail to register.
      fr: L'agent ne doit jamais se trouver dans l'image de référence ; son jeton d'inscription expire et les hôtes créés à partir de l'image ne parviennent pas à s'inscrire.
    d:
      en: Unified Write Filter isn't supported for session hosts and must not be enabled in the image.
      fr: Le filtre d'écriture unifié n'est pas pris en charge pour les hôtes de session et ne doit pas être activé dans l'image.
    e:
      en: The build VM must be deployed without Microsoft Entra ID login; Microsoft Entra join is configured when the session hosts are deployed.
      fr: La machine virtuelle de build doit être déployée sans connexion Microsoft Entra ID ; la jonction à Microsoft Entra est configurée lors du déploiement des hôtes de session.
references:
  - title: Create a golden image in Azure
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/set-up-golden-image
  - title: Remove machine specific information by deprovisioning or generalizing a VM before creating an image
    url: https://learn.microsoft.com/en-us/azure/virtual-machines/generalize
