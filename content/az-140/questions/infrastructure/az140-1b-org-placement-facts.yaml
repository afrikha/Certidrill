id: az140-1b-org-placement-facts
objective: "1.3.1"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    You are planning the placement of Azure Virtual Desktop resources. A host pool named **HP1** will be created in the West Europe region, in a resource group named **RG-AVD-Service**.

    Which two statements are true?

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous planifiez l'emplacement des ressources Azure Virtual Desktop. Un pool d'hôtes nommé **HP1** sera créé dans la région West Europe, dans un groupe de ressources nommé **RG-AVD-Service**.

    Quelles sont les deux affirmations vraies ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "The session hosts of HP1 can run in an Azure region other than West Europe.", fr: "Les hôtes de session de HP1 peuvent s'exécuter dans une région Azure autre que West Europe." } }
    - { id: b, text: { en: "The virtual network of a session host must be in the same region as the session host.", fr: "Le réseau virtuel d'un hôte de session doit se trouver dans la même région que l'hôte de session." } }
    - { id: c, text: { en: "Deleting RG-AVD-Service also deletes the session host VMs of HP1 that are in another resource group.", fr: "Supprimer RG-AVD-Service supprime aussi les machines virtuelles hôtes de session de HP1 qui se trouvent dans un autre groupe de ressources." } }
    - { id: d, text: { en: "RG-AVD-Service can contain only resources located in West Europe.", fr: "RG-AVD-Service ne peut contenir que des ressources situées dans West Europe." } }
answer: { optionIds: [ a, b ] }
explanation:
  correct:
    en: |
      The region of a host pool determines where its metadata is stored; session hosts can be located in any Azure region, and on-premises with Azure Local. A VM's virtual network must be in the same region as the VM.
    fr: |
      La région d'un pool d'hôtes détermine l'emplacement de stockage de ses métadonnées ; les hôtes de session peuvent se trouver dans n'importe quelle région Azure, et en local avec Azure Local. Le réseau virtuel d'une machine virtuelle doit être dans la même région que la machine virtuelle.
  options:
    c: { en: "Deleting a resource group deletes only the resources it contains; VMs in another resource group remain.", fr: "Supprimer un groupe de ressources ne supprime que les ressources qu'il contient ; les machines virtuelles d'un autre groupe de ressources restent." }
    d: { en: "A resource group has a location for its metadata, but it can contain resources from any region.", fr: "Un groupe de ressources a un emplacement pour ses métadonnées, mais il peut contenir des ressources de n'importe quelle région." }
references:
  - title: Prerequisites for Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/prerequisites
  - title: What is Azure Resource Manager?
    url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/management/overview
