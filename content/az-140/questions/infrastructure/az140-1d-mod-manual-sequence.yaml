id: az140-1d-mod-manual-sequence
objective: "1.5.3"
type: ordering
difficulty: 3
status: draft
stem:
  en: |
    Version 1.3.0 of the Azure Virtual Desktop golden image of Fabrikam was built manually and captured to an Azure Compute Gallery. The build virtual machine was deleted after the capture. You kept a snapshot named **snap-v13** of its OS disk, taken after all the customizations and before Sysprep.

    You need to modify the image to add an application and publish version 1.4.0, while keeping the ability to restart the next build from a clean state.

    Which five actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    La version 1.3.0 de l'image de référence Azure Virtual Desktop de Fabrikam a été construite manuellement et capturée dans une galerie Azure Compute Gallery. La machine virtuelle de build a été supprimée après la capture. Vous avez conservé un instantané nommé **snap-v13** de son disque du système d'exploitation, pris après toutes les personnalisations et avant Sysprep.

    Vous devez modifier l'image pour ajouter une application et publier la version 1.4.0, tout en gardant la possibilité de redémarrer le build suivant depuis un état propre.

    Quelles sont les cinq actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 5
  actions:
    - { id: vm, text: { en: "Create a managed disk from snap-v13, then a VM from that disk.", fr: "Créer un disque managé à partir de snap-v13, puis une machine virtuelle à partir de ce disque." } }
    - { id: app, text: { en: "Install the application and the latest updates.", fr: "Installer l'application et les dernières mises à jour." } }
    - { id: snap, text: { en: "Take a snapshot of the OS disk.", fr: "Prendre un instantané du disque du système d'exploitation." } }
    - { id: sysprep, text: { en: "Generalize the VM with Sysprep.", fr: "Généraliser la machine virtuelle avec Sysprep." } }
    - { id: capture, text: { en: "Capture the VM as image version 1.4.0.", fr: "Capturer la machine virtuelle comme version d'image 1.4.0." } }
    - { id: agent, text: { en: "Install the Azure Virtual Desktop Agent.", fr: "Installer l'agent Azure Virtual Desktop." } }
    - { id: hostcap, text: { en: "Capture a session host deployed from version 1.3.0.", fr: "Capturer un hôte de session déployé à partir de la version 1.3.0." } }
answer:
  sequence: [ vm, app, snap, sysprep, capture ]
explanation:
  correct:
    en: |
      An image is never patched in place: you start a new build VM from the last snapshot, customize it, take a new snapshot (the clean starting point of the next build), generalize it with Sysprep and capture it as the next version. Snapshots taken before Sysprep are what make the manual process repeatable.
    fr: |
      Une image ne se corrige jamais sur place : vous démarrez une nouvelle machine virtuelle de build à partir du dernier instantané, la personnalisez, prenez un nouvel instantané (point de départ propre du build suivant), la généralisez avec Sysprep et la capturez comme version suivante. Ce sont les instantanés pris avant Sysprep qui rendent le processus manuel reproductible.
  options:
    agent:
      en: The agent must not be in the image; the host pool deployment installs it on each session host.
      fr: L'agent ne doit pas se trouver dans l'image ; le déploiement du pool d'hôtes l'installe sur chaque hôte de session.
    hostcap:
      en: Microsoft says not to capture a VM that is already a session host in a host pool.
      fr: Microsoft recommande de ne pas capturer une machine virtuelle qui est déjà un hôte de session d'un pool d'hôtes.
references:
  - title: Create a golden image in Azure
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/set-up-golden-image
