id: az140-1b-os-license-driven
objective: "1.3.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Tailspin Toys has 250 users who are licensed with Microsoft 365 Business Premium. The users currently connect to Windows Server 2019 session hosts in an Azure Virtual Desktop pooled host pool, licensed with RDS CALs. The RDS CAL agreement ends in three months and won't be renewed.

    You need to recommend an operating system for a new pooled host pool. The solution must meet the following requirements:

    - Several users must share each session host.
    - Users must get a Windows client desktop experience.
    - Licensing costs must be minimized.

    What should you recommend?
  fr: |
    Tailspin Toys compte 250 utilisateurs disposant de licences Microsoft 365 Business Premium. Les utilisateurs se connectent actuellement à des hôtes de session Windows Server 2019 d'un pool d'hôtes regroupé Azure Virtual Desktop, sous licence avec des CAL RDS. Le contrat des CAL RDS se termine dans trois mois et ne sera pas renouvelé.

    Vous devez recommander un système d'exploitation pour un nouveau pool d'hôtes regroupé. La solution doit répondre aux exigences suivantes :

    - Plusieurs utilisateurs doivent partager chaque hôte de session.
    - Les utilisateurs doivent bénéficier d'une expérience de bureau client Windows.
    - Les coûts de licence doivent être réduits au minimum.

    Que devez-vous recommander ?
body:
  options:
    - id: a
      text: { en: "Windows Server 2025 with new per-user RDS CALs", fr: "Windows Server 2025 avec de nouvelles CAL RDS par utilisateur" }
    - id: b
      text: { en: "Windows Server 2022 with per-device RDS CALs", fr: "Windows Server 2022 avec des CAL RDS par appareil" }
    - id: c
      text: { en: "Windows 11 Enterprise in a personal host pool for each user", fr: "Windows 11 Entreprise dans un pool d'hôtes personnel pour chaque utilisateur" }
    - id: d
      text: { en: "Windows 11 Enterprise multi-session with the users' existing licenses", fr: "Windows 11 Entreprise multisession avec les licences existantes des utilisateurs" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Microsoft 365 Business Premium is one of the per-user licenses that entitle users to access Windows 11 Enterprise multi-session and Windows 11 Enterprise session hosts in Azure Virtual Desktop. Windows 11 Enterprise multi-session gives a Windows client experience, lets several users share a session host, and needs no RDS CALs.
    fr: |
      Microsoft 365 Business Premium fait partie des licences par utilisateur qui donnent le droit d'accéder aux hôtes de session Windows 11 Entreprise multisession et Windows 11 Entreprise dans Azure Virtual Desktop. Windows 11 Entreprise multisession offre une expérience client Windows, permet à plusieurs utilisateurs de partager un hôte de session et n'exige pas de CAL RDS.
  options:
    a: { en: "Windows Server session hosts require RDS CALs, which adds a licensing cost and doesn't give a Windows client experience.", fr: "Les hôtes de session Windows Server exigent des CAL RDS, ce qui ajoute un coût de licence et ne donne pas d'expérience client Windows." }
    b: { en: "Per-device or per-user, RDS CALs are an extra cost, and Windows Server isn't a Windows client desktop.", fr: "Par appareil ou par utilisateur, les CAL RDS sont un coût supplémentaire, et Windows Server n'est pas un bureau client Windows." }
    c: { en: "Windows 11 Enterprise is single-session: users couldn't share session hosts.", fr: "Windows 11 Entreprise est monosession : les utilisateurs ne pourraient pas partager les hôtes de session." }
references:
  - title: Licensing Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/licensing
  - title: Prerequisites for Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/prerequisites
