id: az140-1b-org-mg-policy
objective: "1.3.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso, Ltd. runs Azure Virtual Desktop in three subscriptions: **Sub-AVD-Prod**, **Sub-AVD-Dev** and **Sub-AVD-Lab**. The tenant also contains subscriptions for other workloads. Contoso plans to add more Azure Virtual Desktop subscriptions next year.

    You need to apply an Azure Policy initiative that requires a **CostCenter** tag on all session host VMs. The initiative must apply to the current and future Azure Virtual Desktop subscriptions only. The solution must minimize administrative effort.

    Where should you assign the initiative?
  fr: |
    Contoso, Ltd. exécute Azure Virtual Desktop dans trois abonnements : **Sub-AVD-Prod**, **Sub-AVD-Dev** et **Sub-AVD-Lab**. Le locataire contient aussi des abonnements pour d'autres charges de travail. Contoso prévoit d'ajouter d'autres abonnements Azure Virtual Desktop l'année prochaine.

    Vous devez appliquer une initiative Azure Policy qui exige une étiquette **CostCenter** sur toutes les machines virtuelles hôtes de session. L'initiative doit s'appliquer aux abonnements Azure Virtual Desktop actuels et futurs uniquement. La solution doit réduire au minimum l'effort d'administration.

    Où devez-vous attribuer l'initiative ?
body:
  options:
    - id: a
      text: { en: "To each Azure Virtual Desktop subscription", fr: "À chaque abonnement Azure Virtual Desktop" }
    - id: b
      text: { en: "To the tenant root management group", fr: "Au groupe d'administration racine du locataire" }
    - id: c
      text: { en: "To a management group that contains only the Azure Virtual Desktop subscriptions", fr: "À un groupe d'administration qui contient uniquement les abonnements Azure Virtual Desktop" }
    - id: d
      text: { en: "To the resource group that contains the session hosts in each subscription", fr: "Au groupe de ressources qui contient les hôtes de session dans chaque abonnement" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Policy and Azure RBAC assignments made on a management group are inherited by every subscription in it, including subscriptions moved into it later. A dedicated management group for the Azure Virtual Desktop subscriptions applies the initiative once, to those subscriptions only.
    fr: |
      Les attributions Azure Policy et Azure RBAC effectuées sur un groupe d'administration sont héritées par tous ses abonnements, y compris ceux qui y sont déplacés plus tard. Un groupe d'administration dédié aux abonnements Azure Virtual Desktop applique l'initiative une seule fois, à ces abonnements uniquement.
  options:
    a: { en: "Per-subscription assignments must be repeated for every new subscription.", fr: "Les attributions par abonnement doivent être répétées pour chaque nouvel abonnement." }
    b: { en: "The root management group contains every subscription of the tenant, including the other workloads.", fr: "Le groupe d'administration racine contient tous les abonnements du locataire, y compris ceux des autres charges de travail." }
    d: { en: "Resource group assignments must be repeated in every subscription and don't cover resources placed in other resource groups.", fr: "Les attributions sur des groupes de ressources doivent être répétées dans chaque abonnement et ne couvrent pas les ressources placées dans d'autres groupes de ressources." }
references:
  - title: What are Azure management groups?
    url: https://learn.microsoft.com/en-us/azure/governance/management-groups/overview
