series: az140-sr1-saas-licensing
seriesOrder: 3
difficulty: 3
status: draft
stem:
  en: You move HP-Ledger to Windows Server 2025 and buy RDS CALs.
  fr: Vous passez HP-Ledger à Windows Server 2025 et achetez des CAL RDS.
body:
  solution:
    en: |
      You replace the session hosts of HP-Ledger with session hosts that run Windows Server 2025. Proseware purchases one RDS per-user Client Access License (CAL) with Software Assurance for each customer user.
    fr: |
      Vous remplacez les hôtes de session de HP-Ledger par des hôtes de session qui exécutent Windows Server 2025. Proseware achète une licence d'accès client (CAL) RDS par utilisateur avec Software Assurance pour chaque utilisateur client.
answer: { value: false }
explanation:
  correct:
    en: |
      RDS CALs with Software Assurance license Windows Server session hosts for internal purposes only. Azure Virtual Desktop doesn't support external commercial use of Windows Server session hosts, because per-user access pricing isn't available for Windows Server.
    fr: |
      Les CAL RDS avec Software Assurance couvrent les hôtes de session Windows Server uniquement pour un usage interne. Azure Virtual Desktop ne prend pas en charge l'usage commercial externe d'hôtes de session Windows Server, car la tarification de l'accès par utilisateur n'est pas disponible pour Windows Server.
references:
  - title: Licensing Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/licensing
