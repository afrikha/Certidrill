id: az140-1d-aib-identity
objective: "1.5.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You are writing an Azure VM Image Builder image template that builds a Windows 11 Enterprise multi-session image for Azure Virtual Desktop and distributes it to an image definition in an Azure Compute Gallery named **galAvd**.

    You need to configure the `identity` property of the image template.

    What should you specify?
  fr: |
    Vous rédigez un modèle d'image Azure VM Image Builder qui construit une image Windows 11 Entreprise multisession pour Azure Virtual Desktop et la distribue vers une définition d'image d'une galerie Azure Compute Gallery nommée **galAvd**.

    Vous devez configurer la propriété `identity` du modèle d'image.

    Que devez-vous spécifier ?
body:
  options:
    - { id: a, text: { en: "A system-assigned managed identity of the image template", fr: "Une identité managée affectée par le système du modèle d'image" } }
    - { id: b, text: { en: "A user-assigned managed identity that can read and write images", fr: "Une identité managée affectée par l'utilisateur qui peut lire et écrire des images" } }
    - { id: c, text: { en: "A service principal whose client secret is stored in the template", fr: "Un principal de service dont le secret client est stocké dans le modèle" } }
    - { id: d, text: { en: "A shared access signature for the gallery's storage account", fr: "Une signature d'accès partagé pour le compte de stockage de la galerie" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      The image template identity is required: Image Builder uses it to read and write images in the gallery and to read scripts from storage. The type is `UserAssigned` and the template supports a single identity, which you grant a role (usually a custom role) with the image read and write actions.
    fr: |
      L'identité du modèle d'image est obligatoire : Image Builder l'utilise pour lire et écrire des images dans la galerie et pour lire les scripts dans le stockage. Le type est `UserAssigned` et le modèle prend en charge une seule identité, à laquelle vous attribuez un rôle (en général un rôle personnalisé) avec les actions de lecture et d'écriture d'images.
  options:
    a:
      en: Image templates support only a user-assigned identity, not a system-assigned one.
      fr: Les modèles d'image ne prennent en charge qu'une identité affectée par l'utilisateur, pas une identité affectée par le système.
    c:
      en: Image Builder doesn't take a service principal and secret in the template; access is granted through Azure RBAC to the managed identity.
      fr: Image Builder n'accepte pas de principal de service ni de secret dans le modèle ; l'accès est accordé par Azure RBAC à l'identité managée.
    d:
      en: A gallery isn't accessed with a SAS; images are written through Azure RBAC permissions of the identity.
      fr: On n'accède pas à une galerie avec une SAS ; les images sont écrites grâce aux autorisations Azure RBAC de l'identité.
references:
  - title: Azure VM Image Builder overview
    url: https://learn.microsoft.com/en-us/azure/virtual-machines/image-builder-overview
  - title: Create an Azure Image Builder Bicep or ARM template JSON template
    url: https://learn.microsoft.com/en-us/azure/virtual-machines/linux/image-builder-json
