id: az140-1d-life-latest-pick
objective: "1.5.4"
type: single
difficulty: 3
shuffle: false
status: draft
stem:
  en: |
    An Azure Compute Gallery image definition named **win11-ops** contains the image versions shown in the following table. All versions are replicated to the region of your Azure Virtual Desktop host pool, and no version has a regional exclusion.

    | Version | Exclude from latest |
    | --- | --- |
    | 1.2.5 | No |
    | 1.9.3 | No |
    | 1.10.0 | No |
    | 2.0.0 | Yes |

    You add a session host to the host pool by using an Azure Resource Manager template whose `imageReference` contains the ID of win11-ops without a version.

    Which image version does the new session host use?
  fr: |
    Une définition d'image Azure Compute Gallery nommée **win11-ops** contient les versions d'image du tableau suivant. Toutes les versions sont répliquées dans la région de votre pool d'hôtes Azure Virtual Desktop, et aucune version n'a d'exclusion régionale.

    | Version | Exclude from latest |
    | --- | --- |
    | 1.2.5 | Non |
    | 1.9.3 | Non |
    | 1.10.0 | Non |
    | 2.0.0 | Oui |

    Vous ajoutez un hôte de session au pool d'hôtes avec un modèle Azure Resource Manager dont l'`imageReference` contient l'ID de win11-ops sans version.

    Quelle version d'image utilise le nouvel hôte de session ?
body:
  options:
    - { id: a, text: 1.2.5 }
    - { id: b, text: 1.9.3 }
    - { id: c, text: 1.10.0 }
    - { id: d, text: 2.0.0 }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Referencing the image definition without a version means latest. Azure compares versions numerically, highest major version first, then minor, then patch, and skips versions marked Exclude from latest. 2.0.0 is excluded, and minor version 10 is higher than 9, so 1.10.0 is used.
    fr: |
      Référencer la définition d'image sans version signifie la plus récente. Azure compare les versions numériquement, d'abord la version majeure la plus élevée, puis la mineure, puis le correctif, et ignore les versions marquées Exclude from latest. 2.0.0 est exclue, et la version mineure 10 est supérieure à 9 : c'est donc 1.10.0 qui est utilisée.
  options:
    a:
      en: 1.2.5 has the lowest minor version of the eligible versions.
      fr: 1.2.5 a la version mineure la plus basse des versions éligibles.
    b:
      en: Versions aren't compared as text; minor version 9 is lower than 10.
      fr: Les versions ne sont pas comparées comme du texte ; la version mineure 9 est inférieure à 10.
    d:
      en: 2.0.0 is the highest version but is excluded from latest, so it's used only when referenced explicitly.
      fr: |
        2.0.0 est la version la plus élevée, mais elle est exclue de la plus récente : elle n'est utilisée que si elle est référencée explicitement.
references:
  - title: Store and share images in an Azure Compute Gallery
    url: https://learn.microsoft.com/en-us/azure/virtual-machines/shared-image-galleries
