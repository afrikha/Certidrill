id: az140-1c-perf-region-latency
objective: "1.3.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Contoso has an Azure Virtual Desktop host pool named HP-EU in the West Europe region. Its FSLogix profiles are stored in a premium file share in West Europe. RDP Shortpath is already enabled.

    Contoso opens an office in Singapore. The users of this office connect to HP-EU and report slow input response. The measured round-trip time between their devices and West Europe is about 250 ms.

    You need to recommend a solution that brings the round-trip time below 150 ms for the Singapore users.

    What should you recommend?
  fr: |
    Contoso dispose d'un pool d'hôtes Azure Virtual Desktop nommé HP-EU dans la région West Europe. Ses profils FSLogix sont stockés dans un partage de fichiers premium en West Europe. RDP Shortpath est déjà activé.

    Contoso ouvre un bureau à Singapour. Les utilisateurs de ce bureau se connectent à HP-EU et signalent une réponse lente à la saisie. Le temps aller-retour mesuré entre leurs appareils et West Europe est d'environ 250 ms.

    Vous devez recommander une solution qui ramène le temps aller-retour sous 150 ms pour les utilisateurs de Singapour.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "Resize the session hosts of HP-EU to a larger VM size", fr: "Redimensionner les hôtes de session de HP-EU vers une taille plus grande" } }
    - { id: b, text: { en: "Deploy a host pool and its profile storage in Southeast Asia", fr: "Déployer un pool d'hôtes et son stockage de profils en Southeast Asia" } }
    - { id: c, text: { en: "Add GPU-enabled session hosts to HP-EU for these users", fr: "Ajouter à HP-EU des hôtes de session avec GPU pour ces utilisateurs" } }
    - { id: d, text: { en: "Move the FSLogix profiles of HP-EU to Azure NetApp Files", fr: "Déplacer les profils FSLogix de HP-EU vers Azure NetApp Files" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Microsoft recommends a round-trip time under 150 ms between clients and the Azure region of the session hosts, and the distance to West Europe sets the 250 ms. A host pool in a region close to the Singapore users, with its profile storage in the same region, removes that distance; session hosts of one host pool shouldn't be mixed across regions.
    fr: |
      Microsoft recommande un temps aller-retour inférieur à 150 ms entre les clients et la région Azure des hôtes de session, et c'est la distance jusqu'à West Europe qui impose les 250 ms. Un pool d'hôtes dans une région proche des utilisateurs de Singapour, avec son stockage de profils dans la même région, supprime cette distance ; il ne faut pas mélanger les régions des hôtes de session d'un même pool.
  options:
    a: { en: "A larger VM helps when the host is overloaded, not when network distance causes the latency.", fr: "Une machine virtuelle plus grande aide quand l'hôte est surchargé, pas quand la distance réseau cause la latence." }
    c: { en: "GPUs accelerate graphics on the host but don't shorten the network path to Europe.", fr: "Les GPU accélèrent le graphisme sur l'hôte mais ne raccourcissent pas le chemin réseau vers l'Europe." }
    d: { en: "Faster profile storage improves sign-in, not the round-trip time between the client and the session host.", fr: "Un stockage de profils plus rapide améliore l'ouverture de session, pas le temps aller-retour entre le client et l'hôte de session." }
references:
  - title: Prerequisites for Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/prerequisites
