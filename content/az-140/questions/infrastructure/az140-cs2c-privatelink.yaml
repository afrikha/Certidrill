id: az140-cs2c-privatelink
objective: "1.1.4"
type: dragdrop
caseStudy: az140-cs2c-humongous
difficulty: 2
status: draft
stem:
  en: |
    Private Link with Azure Virtual Desktop is enabled on Sub-Internal. You create a workspace named **WS-Discovery** that contains no application group. You plan to create three private endpoints in the hub virtual network to meet the private access requirement.

    What should you configure for each endpoint? To answer, drag the appropriate values to the correct settings. Each value may be used once, more than once, or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Private Link avec Azure Virtual Desktop est activé sur Sub-Internal. Vous créez un espace de travail nommé **WS-Discovery** qui ne contient aucun groupe d'applications. Vous prévoyez de créer trois points de terminaison privés dans le réseau virtuel hub pour respecter l'exigence d'accès privé.

    Que devez-vous configurer pour chaque point de terminaison ? Pour répondre, faites glisser les valeurs appropriées vers les paramètres correspondants. Chaque valeur peut être utilisée une fois, plusieurs fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: true
  items:
    - { id: connection, text: connection }
    - { id: feed, text: feed }
    - { id: global, text: global }
    - { id: zonepl, text: privatelink.wvd.microsoft.com }
    - { id: zoneglobal, text: privatelink-global.wvd.microsoft.com }
  targets:
    - id: hp
      text: { en: "Target sub-resource of the endpoint on HP-Claims", fr: "Sous-ressource cible du point de terminaison sur HP-Claims" }
    - id: ws
      text: { en: "Target sub-resource of the endpoint on WS-Internal", fr: "Sous-ressource cible du point de terminaison sur WS-Internal" }
    - id: disc
      text: { en: "Target sub-resource of the endpoint on WS-Discovery", fr: "Sous-ressource cible du point de terminaison sur WS-Discovery" }
    - id: dns
      text: { en: "Private DNS zone of the endpoint on WS-Discovery", fr: "Zone DNS privée du point de terminaison sur WS-Discovery" }
answer:
  mapping: { hp: connection, ws: feed, disc: global, dns: zoneglobal }
explanation:
  correct:
    en: |
      The connection sub-resource of a host pool carries the remote sessions, and the feed sub-resource of a workspace carries the feed download. Initial feed discovery uses a single global sub-resource for all deployments, which Microsoft recommends placing on a dedicated workspace without application groups. The global endpoint uses its own zone, privatelink-global.wvd.microsoft.com; sharing privatelink.wvd.microsoft.com with it is not supported.
    fr: |
      La sous-ressource connection d'un pool d'hôtes transporte les sessions à distance, et la sous-ressource feed d'un espace de travail transporte le téléchargement du flux. La découverte initiale du flux utilise une seule sous-ressource global pour tous les déploiements, que Microsoft recommande de placer sur un espace de travail dédié sans groupe d'applications. Le point de terminaison global utilise sa propre zone, privatelink-global.wvd.microsoft.com ; partager privatelink.wvd.microsoft.com avec lui n'est pas pris en charge.
  options:
    zonepl: { en: "privatelink.wvd.microsoft.com serves the feed, connection and gateway endpoints, not the global endpoint.", fr: "privatelink.wvd.microsoft.com sert aux points de terminaison feed, connection et de passerelle, pas au point de terminaison global." }
references:
  - title: Azure Private Link with Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/private-link-overview
