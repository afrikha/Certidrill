id: az140-cs2a-profiles
objective: "1.2.4"
type: ordering
caseStudy: az140-cs2a-munsons
difficulty: 2
status: draft
stem:
  en: |
    You need to configure the profiles share and the HP-Office session hosts to meet the profile requirements.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Vous devez configurer le partage profiles et les hôtes de session HP-Office pour respecter les exigences relatives aux profils.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - id: join
      text:
        en: "From a domain-joined computer, run `Join-AzStorageAccount` from the AzFilesHybrid module for stmunprofiles."
        fr: "Depuis un ordinateur joint au domaine, exécuter `Join-AzStorageAccount` du module AzFilesHybrid pour stmunprofiles."
    - id: rbac
      text:
        en: "Assign the Storage File Data SMB Share Contributor role on the profiles share to GRP-Office."
        fr: "Attribuer le rôle Storage File Data SMB Share Contributor sur le partage profiles à GRP-Office."
    - id: ntfs
      text:
        en: "Mount the share and use `icacls` to grant Modify to GRP-Office and to CREATOR OWNER on subfolders and files only, and to remove Authenticated Users and Builtin\\Users."
        fr: "Monter le partage et utiliser `icacls` pour accorder Modify à GRP-Office et à CREATOR OWNER sur les sous-dossiers et fichiers uniquement, puis retirer Authenticated Users et Builtin\\Users."
    - id: reg
      text:
        en: "On the session hosts, set `Enabled` to 1 and `VHDLocations` to the UNC path of the share under HKLM\\SOFTWARE\\FSLogix\\Profiles."
        fr: "Sur les hôtes de session, définir `Enabled` sur 1 et `VHDLocations` sur le chemin UNC du partage sous HKLM\\SOFTWARE\\FSLogix\\Profiles."
    - id: kerb
      text:
        en: "Enable Microsoft Entra Kerberos as the identity source of stmunprofiles."
        fr: "Activer Microsoft Entra Kerberos comme source d'identité de stmunprofiles."
    - id: elev
      text:
        en: "Assign the Storage File Data SMB Share Elevated Contributor role on the profiles share to GRP-Office."
        fr: "Attribuer le rôle Storage File Data SMB Share Elevated Contributor sur le partage profiles à GRP-Office."
    - id: keyoff
      text:
        en: "Disable storage account key access on stmunprofiles."
        fr: "Désactiver l'accès par clé du compte de stockage sur stmunprofiles."
answer:
  sequence: [ join, rbac, ntfs, reg ]
explanation:
  correct:
    en: |
      Microsoft's procedure first joins the storage account to AD DS with Join-AzStorageAccount, then grants share-level access with Storage File Data SMB Share Contributor, then sets the NTFS permissions (Modify for the users, CREATOR OWNER on subfolders and files only, and removal of the broad built-in groups) so that each user reaches only their own folder. Finally, the session hosts are configured with the Enabled and VHDLocations values and restarted.
    fr: |
      La procédure de Microsoft joint d'abord le compte de stockage à AD DS avec Join-AzStorageAccount, accorde ensuite l'accès au niveau du partage avec Storage File Data SMB Share Contributor, puis définit les autorisations NTFS (Modify pour les utilisateurs, CREATOR OWNER sur les sous-dossiers et fichiers uniquement, et retrait des groupes intégrés trop larges) afin que chaque utilisateur n'atteigne que son propre dossier. Enfin, les hôtes de session sont configurés avec les valeurs Enabled et VHDLocations, puis redémarrés.
  options:
    kerb: { en: "A storage account has a single identity source, and the requirement is AD DS identity-based access.", fr: "Un compte de stockage n'a qu'une source d'identité, et l'exigence impose un accès basé sur l'identité AD DS." }
    elev: { en: "Elevated Contributor also lets users change NTFS permissions, which exceeds what profile users need.", fr: "Elevated Contributor permet aussi aux utilisateurs de modifier les autorisations NTFS, ce qui dépasse le besoin des utilisateurs de profils." }
    keyoff: { en: "The documented procedure mounts the share with the storage account key to set the NTFS permissions, so key access must stay enabled.", fr: "La procédure documentée monte le partage avec la clé du compte de stockage pour définir les autorisations NTFS : l'accès par clé doit rester activé." }
references:
  - title: Store FSLogix profile containers on Azure Files and Active Directory Domain Services or Microsoft Entra Domain Services
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/fslogix-profile-container-configure-azure-files-active-directory
