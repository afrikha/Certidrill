id: az140-cs1a-transport-kql
objective: "1.1.5"
type: dropdown
caseStudy: az140-cs1a-humongous-insurance
difficulty: 1
status: draft
stem:
  en: |
    You need to create the query for the weekly report of the operations team. The query will run in LAW-AVD.

    How should you complete the query? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez créer la requête du rapport hebdomadaire de l'équipe d'exploitation. La requête s'exécutera dans LAW-AVD.

    Comment devez-vous compléter la requête ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: kusto
  template: |
    [[table]]
    | where TimeGenerated > ago(7d)
    | where [[column]] == "Websocket"
    | summarize Connections = count() by [[group]]
  slots:
    - id: table
      options:
        - { id: errors, text: WVDErrors }
        - { id: conn, text: WVDConnections }
        - { id: checkpoints, text: WVDCheckpoints }
        - { id: agent, text: WVDAgentHealthStatus }
    - id: column
      options:
        - { id: ctype, text: ConnectionType }
        - { id: client, text: ClientType }
        - { id: transport, text: TransportType }
    - id: group
      options:
        - { id: host, text: SessionHostName }
        - { id: region, text: GatewayRegion }
        - { id: user, text: UserName }
answer:
  values: { table: conn, column: transport, group: user }
explanation:
  correct:
    en: |
      The WVDConnections table records each connection, and its TransportType column shows the transport used: Shortpath, TURN or Websocket. Websocket means that the connection stayed on the TCP reverse connect transport instead of UDP. Grouping by UserName gives the list of agents that the operations team needs.
    fr: |
      La table WVDConnections enregistre chaque connexion, et sa colonne TransportType indique le transport utilisé : Shortpath, TURN ou Websocket. Websocket signifie que la connexion est restée sur le transport TCP de connexion inverse au lieu d'UDP. Le regroupement par UserName fournit la liste des gestionnaires dont l'équipe d'exploitation a besoin.
  options:
    column: { en: "ConnectionType tells whether the connection is a desktop or a RemoteApp (RAIL); ClientType identifies the client application.", fr: "ConnectionType indique si la connexion est un bureau ou une RemoteApp (RAIL) ; ClientType identifie l'application cliente." }
    group: { en: "Grouping by session host or gateway region does not identify the agents.", fr: "Le regroupement par hôte de session ou par région de passerelle n'identifie pas les gestionnaires." }
references:
  - title: WVDConnections
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/reference/tables/wvdconnections
