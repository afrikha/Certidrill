id: az140-1b-share-acl-admin
objective: "1.2.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have an Azure file share named **profiles** that stores FSLogix profile containers for an Azure Virtual Desktop host pool. The storage account is joined to AD DS, and the default share-level permission is Storage File Data SMB Share Contributor.

    Members of a synced group named **AVD-Admins** must be able to change the NTFS permissions on the root of the share by using their own identities. Security policy forbids sharing the storage account key with them.

    Which role should you assign to AVD-Admins on the share? The solution must follow the principle of least privilege.
  fr: |
    Vous disposez d'un partage de fichiers Azure nommé **profiles** qui stocke les conteneurs de profils FSLogix d'un pool d'hôtes Azure Virtual Desktop. Le compte de stockage est joint à AD DS, et l'autorisation par défaut au niveau du partage est Storage File Data SMB Share Contributor.

    Les membres d'un groupe synchronisé nommé **AVD-Admins** doivent pouvoir modifier les autorisations NTFS à la racine du partage avec leur propre identité. La stratégie de sécurité interdit de leur communiquer la clé du compte de stockage.

    Quel rôle devez-vous attribuer à AVD-Admins sur le partage ? La solution doit respecter le principe du moindre privilège.
body:
  options:
    - id: a
      text: Storage Account Contributor
    - id: b
      text: Storage File Data SMB Share Contributor
    - id: c
      text: Owner
    - id: d
      text: Storage File Data SMB Share Elevated Contributor
answer: { optionId: d }
explanation:
  correct:
    en: |
      Storage File Data SMB Share Elevated Contributor adds the right to modify ACLs to read, write and delete. FSLogix guidance states that only users with this role can set permissions on the share root without the storage account key.
    fr: |
      Storage File Data SMB Share Elevated Contributor ajoute le droit de modifier les listes ACL à la lecture, l'écriture et la suppression. Les recommandations FSLogix indiquent que seuls les utilisateurs disposant de ce rôle peuvent définir les autorisations à la racine du partage sans la clé du compte de stockage.
  options:
    a: { en: "Storage Account Contributor manages the account and can read its keys, which the policy forbids using, but it grants no identity-based SMB data access.", fr: "Storage Account Contributor gère le compte et peut lire ses clés, dont la stratégie interdit l'usage, mais il n'accorde aucun accès SMB aux données basé sur l'identité." }
    b: { en: "The users already have this level through the default permission; it doesn't allow changing ACLs.", fr: "Les utilisateurs disposent déjà de ce niveau grâce à l'autorisation par défaut ; il ne permet pas de modifier les listes ACL." }
    c: { en: "Owner is a management-plane role with far more rights than required, and it doesn't grant SMB data access by itself.", fr: "Owner est un rôle du plan de gestion qui accorde bien plus de droits que nécessaire, et il n'accorde pas à lui seul d'accès SMB aux données." }
references:
  - title: Configure SMB Storage Permissions
    url: https://learn.microsoft.com/en-us/fslogix/how-to-configure-storage-permissions
  - title: Assign share-level permissions for Azure file shares
    url: https://learn.microsoft.com/en-us/azure/storage/files/storage-files-identity-assign-share-level-permissions
