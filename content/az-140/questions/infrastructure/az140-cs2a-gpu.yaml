id: az140-cs2a-gpu
objective: "1.3.5"
type: dropdown
caseStudy: az140-cs2a-munsons
difficulty: 2
status: draft
stem:
  en: |
    You need to design the HP-Eng session hosts to meet the CAD performance requirement. The solution must use NVIDIA GPUs.

    What should you configure? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez concevoir les hôtes de session HP-Eng pour respecter l'exigence de performances de la CAO. La solution doit utiliser des GPU NVIDIA.

    Que devez-vous configurer ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      VM series: [[vm]]

      Graphics driver: [[drv]]

      Policy setting for GPU-accelerated rendering: [[render]]

      Policy setting for hardware frame encoding: [[enc]]
    fr: |
      Série de machines virtuelles : [[vm]]

      Pilote graphique : [[drv]]

      Paramètre de stratégie pour le rendu accéléré par GPU : [[render]]

      Paramètre de stratégie pour l'encodage matériel des images : [[enc]]
  slots:
    - id: vm
      options:
        - { id: nva10, text: NVadsA10 v5-series }
        - { id: ncv3, text: NCv3-series }
        - { id: ndv2, text: NDv2-series }
        - { id: dasv5, text: Dasv5-series }
    - id: drv
      options:
        - { id: grid, text: { en: "NVIDIA GRID driver installed by the NVIDIA GPU Driver Extension", fr: "Pilote NVIDIA GRID installé par l'extension NVIDIA GPU Driver Extension" } }
        - { id: cuda, text: { en: "NVIDIA CUDA driver downloaded from the NVIDIA website", fr: "Pilote NVIDIA CUDA téléchargé sur le site web de NVIDIA" } }
        - { id: amd, text: { en: "AMD driver installed by the AMD GPU Driver Extension", fr: "Pilote AMD installé par l'extension AMD GPU Driver Extension" } }
    - id: render
      options:
        - { id: hw, text: Use hardware graphics adapters for all Remote Desktop Services sessions }
        - { id: avc444, text: Prioritize H.264/AVC 444 Graphics mode for Remote Desktop connections }
        - { id: avcenc, text: Configure H.264/AVC hardware encoding for Remote Desktop connections }
    - id: enc
      options:
        - { id: avcenc, text: Configure H.264/AVC hardware encoding for Remote Desktop connections }
        - { id: avc444, text: Prioritize H.264/AVC 444 Graphics mode for Remote Desktop connections }
        - { id: hw, text: Use hardware graphics adapters for all Remote Desktop Services sessions }
answer:
  values: { vm: nva10, drv: grid, render: hw, enc: avcenc }
explanation:
  correct:
    en: |
      NVadsA10 v5 is a GPU-optimized size that supports GPU-accelerated rendering and hardware frame encoding for Azure Virtual Desktop. NVIDIA sizes need the GRID driver, which the NVIDIA GPU Driver Extension installs. The policy setting Use hardware graphics adapters for all Remote Desktop Services sessions turns on GPU rendering, and Configure H.264/AVC hardware encoding for Remote Desktop connections makes the GPU encode the remote frames.
    fr: |
      NVadsA10 v5 est une taille optimisée pour GPU qui prend en charge le rendu accéléré par GPU et l'encodage matériel des images pour Azure Virtual Desktop. Les tailles NVIDIA nécessitent le pilote GRID, que l'extension NVIDIA GPU Driver Extension installe. Le paramètre de stratégie Use hardware graphics adapters for all Remote Desktop Services sessions active le rendu par GPU, et Configure H.264/AVC hardware encoding for Remote Desktop connections fait encoder les images distantes par le GPU.
  options:
    ncv3: { en: "NC, NCv2, NCv3, ND and NDv2 sizes target CUDA and machine learning workloads; Microsoft advises against them for session hosts.", fr: "Les tailles NC, NCv2, NCv3, ND et NDv2 visent les charges CUDA et d'apprentissage automatique ; Microsoft les déconseille pour les hôtes de session." }
    ndv2: { en: "NC, NCv2, NCv3, ND and NDv2 sizes target CUDA and machine learning workloads; Microsoft advises against them for session hosts.", fr: "Les tailles NC, NCv2, NCv3, ND et NDv2 visent les charges CUDA et d'apprentissage automatique ; Microsoft les déconseille pour les hôtes de session." }
    dasv5: { en: "Dasv5 is a general-purpose size without a GPU.", fr: "Dasv5 est une taille à usage général sans GPU." }
    cuda: { en: "Graphics acceleration needs the GRID driver distributed by Azure, not the CUDA driver.", fr: "L'accélération graphique nécessite le pilote GRID distribué par Azure, pas le pilote CUDA." }
    amd: { en: "The solution must use NVIDIA GPUs.", fr: "La solution doit utiliser des GPU NVIDIA." }
    avc444: { en: "AVC 444 mode prioritizes full-screen video encoding; without the hardware encoding setting, the encoding can stay on the CPU.", fr: "Le mode AVC 444 privilégie l'encodage vidéo plein écran ; sans le paramètre d'encodage matériel, l'encodage peut rester sur le processeur." }
references:
  - title: Enable GPU acceleration for Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/graphics-enable-gpu-acceleration
