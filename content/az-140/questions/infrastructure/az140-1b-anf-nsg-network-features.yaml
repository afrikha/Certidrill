id: az140-1b-anf-nsg-network-features
objective: "1.2.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have an Azure NetApp Files SMB volume named **vol-profiles** that stores FSLogix profile containers. The volume was created with **Basic** network features in a subnet named **snet-anf** of a virtual network named **VNet-AVD**. snet-anf is delegated to `Microsoft.NetApp/volumes`.

    Security policy requires a network security group (NSG) to be associated with snet-anf to restrict SMB traffic to the session host subnet.

    What should you do first?
  fr: |
    Vous disposez d'un volume SMB Azure NetApp Files nommé **vol-profiles** qui stocke des conteneurs de profils FSLogix. Le volume a été créé avec les fonctionnalités réseau **Basic** dans un sous-réseau nommé **snet-anf** d'un réseau virtuel nommé **VNet-AVD**. snet-anf est délégué à `Microsoft.NetApp/volumes`.

    La stratégie de sécurité exige qu'un groupe de sécurité réseau (NSG) soit associé à snet-anf pour limiter le trafic SMB au sous-réseau des hôtes de session.

    Que devez-vous faire en premier ?
body:
  options:
    - id: a
      text: { en: "Change the network features of vol-profiles to Standard.", fr: "Passer les fonctionnalités réseau de vol-profiles à Standard." }
    - id: b
      text: { en: "Delegate a second subnet of VNet-AVD to Microsoft.NetApp/volumes and associate the NSG with it.", fr: "Déléguer un second sous-réseau de VNet-AVD à Microsoft.NetApp/volumes et lui associer le NSG." }
    - id: c
      text: { en: "Change the service level of the capacity pool to Ultra.", fr: "Passer le niveau de service du pool de capacité à Ultra." }
    - id: d
      text: { en: "Create a private endpoint for vol-profiles in the session host subnet.", fr: "Créer un point de terminaison privé pour vol-profiles dans le sous-réseau des hôtes de session." }
answer: { optionId: a }
explanation:
  correct:
    en: |
      With Basic network features, you can't assign an NSG or a service endpoint to the delegated subnet; delegation fails if you do. Standard network features support NSGs on the delegated subnet, so you upgrade the volume to Standard and then associate the NSG.
    fr: |
      Avec les fonctionnalités réseau Basic, vous ne pouvez pas attribuer de NSG ni de point de terminaison de service au sous-réseau délégué ; la délégation échoue dans ce cas. Les fonctionnalités réseau Standard prennent en charge les NSG sur le sous-réseau délégué : vous passez donc le volume à Standard, puis vous associez le NSG.
  options:
    b: { en: "Only one delegated subnet can be used per virtual network; volume creation fails when more than one is used.", fr: "Un seul sous-réseau délégué peut être utilisé par réseau virtuel ; la création de volume échoue quand plusieurs le sont." }
    c: { en: "The service level sets throughput; it doesn't change what the delegated subnet supports.", fr: "Le niveau de service définit le débit ; il ne change pas ce que le sous-réseau délégué prend en charge." }
    d: { en: "Azure NetApp Files volumes get their IP address in the delegated subnet; you don't reach them through private endpoints.", fr: "Les volumes Azure NetApp Files obtiennent leur adresse IP dans le sous-réseau délégué ; vous ne les joignez pas par des points de terminaison privés." }
references:
  - title: Delegate a subnet to Azure NetApp Files
    url: https://learn.microsoft.com/en-us/azure/azure-netapp-files/azure-netapp-files-delegate-subnet
