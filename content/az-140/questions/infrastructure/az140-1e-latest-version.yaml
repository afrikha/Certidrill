id: az140-1e-latest-version
objective: "1.5.6"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Proseware has an Azure Compute Gallery named **galAvd** that contains the image definition **win11-multi**. The definition has the image versions shown in the following table. All the versions are replicated to West Europe.

    | Image version | Exclude from latest |
    | --- | --- |
    | 1.0.0 | No |
    | 1.1.0 | No |
    | 1.2.0 | Yes |

    You create Azure Virtual Desktop session hosts in West Europe by running `az vm create` scripts.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware dispose d'une galerie Azure Compute Gallery nommée **galAvd** qui contient la définition d'image **win11-multi**. La définition contient les versions d'image indiquées dans le tableau suivant. Toutes les versions sont répliquées dans West Europe.

    | Version d'image | Exclure de la dernière version |
    | --- | --- |
    | 1.0.0 | Non |
    | 1.1.0 | Non |
    | 1.2.0 | Oui |

    Vous créez des hôtes de session Azure Virtual Desktop dans West Europe en exécutant des scripts `az vm create`.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: A session host created with `--image` set to the resource ID of win11-multi uses image version 1.2.0.
        fr: Un hôte de session créé avec `--image` défini sur l'ID de ressource de win11-multi utilise la version d'image 1.2.0.
    - id: s2
      text:
        en: To deploy a test session host from image version 1.2.0, you can set `--image` to the resource ID of win11-multi followed by `/versions/1.2.0`.
        fr: Pour déployer un hôte de session de test à partir de la version d'image 1.2.0, vous pouvez définir `--image` sur l'ID de ressource de win11-multi suivi de `/versions/1.2.0`.
    - id: s3
      text:
        en: A session host created with `--image` set to the resource ID of win11-multi is automatically updated to a newer version when that version becomes the latest.
        fr: Un hôte de session créé avec `--image` défini sur l'ID de ressource de win11-multi est automatiquement mis à jour vers une version plus récente quand celle-ci devient la dernière version.
answer:
  values: { s1: false, s2: true, s3: false }
explanation:
  correct:
    en: The image definition ID means "latest", which is the highest version not excluded from latest, so the host gets 1.1.0. You can still deploy an excluded version explicitly with its image version ID. The latest version is resolved only at deployment time; an existing VM isn't updated when a newer version is published, so you redeploy or update the session hosts.
    fr: "L'ID de la définition d'image signifie « dernière version », c'est-à-dire la version la plus élevée non exclue de la dernière version : l'hôte reçoit 1.1.0. Vous pouvez quand même déployer explicitement une version exclue avec son ID de version d'image. La dernière version n'est résolue qu'au moment du déploiement ; une machine virtuelle existante n'est pas mise à jour quand une version plus récente est publiée : il faut redéployer ou mettre à jour les hôtes de session."
references:
  - title: Create a VM from a generalized image version
    url: https://learn.microsoft.com/en-us/azure/virtual-machines/vm-generalized-image-version
  - title: Store and share images in an Azure Compute Gallery
    url: https://learn.microsoft.com/en-us/azure/virtual-machines/shared-image-galleries
