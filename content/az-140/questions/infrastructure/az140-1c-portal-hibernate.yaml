id: az140-1c-portal-hibernate
objective: "1.4.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You plan to add session hosts to the following Azure Virtual Desktop host pools by using the Azure portal. All the session hosts will use a VM size and an image that support hibernation.

    | Host pool | Type | User profiles | Applications |
    | --- | --- | --- | --- |
    | HP1 | Pooled | Local profiles | Installed in the image |
    | HP2 | Pooled | FSLogix profile containers | Installed in the image |
    | HP3 | Personal | Local profiles | Installed in the image |
    | HP4 | Personal | FSLogix profile containers | Installed in the image |

    You need to enable the **Hibernate** option on the **Virtual machines** tab. The configuration must be supported.

    For which host pool should you enable the option?
  fr: |
    Vous prévoyez d'ajouter des hôtes de session aux pools d'hôtes Azure Virtual Desktop suivants à l'aide du portail Azure. Tous les hôtes de session utiliseront une taille de machine virtuelle et une image qui prennent en charge la mise en veille prolongée.

    | Pool d'hôtes | Type | Profils utilisateur | Applications |
    | --- | --- | --- | --- |
    | HP1 | Regroupé | Profils locaux | Installées dans l'image |
    | HP2 | Regroupé | Conteneurs de profils FSLogix | Installées dans l'image |
    | HP3 | Personnel | Profils locaux | Installées dans l'image |
    | HP4 | Personnel | Conteneurs de profils FSLogix | Installées dans l'image |

    Vous devez activer l'option **Hibernate** dans l'onglet **Virtual machines**. La configuration doit être prise en charge.

    Pour quel pool d'hôtes devez-vous activer l'option ?
body:
  options:
    - { id: a, text: HP1 }
    - { id: b, text: HP2 }
    - { id: c, text: HP3 }
    - { id: d, text: HP4 }
answer: { optionId: c }
explanation:
  correct:
    en: |
      The Hibernate option is available only for personal host pools, and Microsoft says not to enable it on session hosts that use FSLogix or App attach. HP3 is personal, keeps local profiles and installs applications in the image, so it meets both conditions.
    fr: |
      L'option Hibernate n'est disponible que pour les pools d'hôtes personnels, et Microsoft indique de ne pas l'activer sur des hôtes de session qui utilisent FSLogix ou App attach. HP3 est personnel, conserve des profils locaux et installe les applications dans l'image : il remplit les deux conditions.
  options:
    a: { en: "HP1 is a pooled host pool; hibernation is offered for personal host pools only.", fr: "HP1 est un pool regroupé ; la mise en veille prolongée n'est proposée que pour les pools personnels." }
    b: { en: "HP2 is pooled and also uses FSLogix.", fr: "HP2 est regroupé et utilise en plus FSLogix." }
    d: { en: "HP4 is personal, but hibernation isn't supported with FSLogix profile containers.", fr: "HP4 est personnel, mais la mise en veille prolongée n'est pas prise en charge avec les conteneurs de profils FSLogix." }
references:
  - title: Deploy Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/deploy-azure-virtual-desktop
