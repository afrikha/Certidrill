id: az140-1a-net-endpoint-statements
objective: "1.1.2"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Proseware routes all outbound traffic of its Azure Virtual Desktop session hosts through a web proxy and a firewall. You are reviewing the network design.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware fait passer tout le trafic sortant de ses hôtes de session Azure Virtual Desktop par un proxy web et un pare-feu. Vous examinez la conception réseau.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: The Azure Virtual Desktop Agent URL Tool confirms that the wildcard entries of the required endpoint list are allowed.
        fr: L'outil Azure Virtual Desktop Agent URL Tool confirme que les entrées génériques de la liste des points de terminaison requis sont autorisées.
    - id: s2
      text:
        en: Traffic from the session hosts to 168.63.129.16 can be sent through the web proxy.
        fr: Le trafic des hôtes de session vers 168.63.129.16 peut passer par le proxy web.
    - id: s3
      text:
        en: The session hosts need outbound UDP 3478 to 51.5.0.0/16 for relayed RDP connectivity.
        fr: Les hôtes de session ont besoin d'UDP 3478 sortant vers 51.5.0.0/16 pour la connectivité RDP relayée.
answer:
  values: { s1: false, s2: false, s3: true }
explanation:
  correct:
    en: |
      The Agent URL Tool doesn't verify wildcard FQDNs, only the specific entries that depend on the session host location, so you must confirm wildcard entries yourself. 169.254.169.254 (IMDS) and 168.63.129.16 (WireServer) must not be intercepted, proxied or redirected. Relayed RDP connectivity (TURN) uses UDP 3478 to 51.5.0.0/16, listed with the WindowsVirtualDesktop service tag.
    fr: |
      L'outil Agent URL Tool ne vérifie pas les FQDN génériques, seulement les entrées précises qui dépendent de l'emplacement de l'hôte de session : vous devez confirmer vous-même les entrées génériques. 169.254.169.254 (IMDS) et 168.63.129.16 (WireServer) ne doivent jamais être interceptés, passer par un proxy ni être redirigés. La connectivité RDP relayée (TURN) utilise UDP 3478 vers 51.5.0.0/16, listé avec l'étiquette de service WindowsVirtualDesktop.
references:
  - title: Required FQDNs and endpoints for Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/required-fqdn-endpoint
  - title: Check access to required FQDNs and endpoints for Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/check-access-validate-required-fqdn-endpoint
