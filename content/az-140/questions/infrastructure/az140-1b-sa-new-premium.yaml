id: az140-1b-sa-new-premium
objective: "1.2.3"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    You plan to store the FSLogix profile containers of an Azure Virtual Desktop host pool in an Azure file share. The session hosts run in the West Europe region.

    You need to create a storage account that meets the following requirements:

    - The file share must use SSD storage.
    - The profiles must remain available if one availability zone of West Europe fails.

    How should you complete the command? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous prévoyez de stocker les conteneurs de profils FSLogix d'un pool d'hôtes Azure Virtual Desktop dans un partage de fichiers Azure. Les hôtes de session s'exécutent dans la région West Europe.

    Vous devez créer un compte de stockage qui répond aux exigences suivantes :

    - Le partage de fichiers doit utiliser un stockage SSD.
    - Les profils doivent rester disponibles si une zone de disponibilité de West Europe tombe en panne.

    Comment devez-vous compléter la commande ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: powershell
  template: |
    New-AzStorageAccount -ResourceGroupName "rg-avd-storage" `
        -Name "stavdprof01" `
        -Location "westeurope" `
        -SkuName [[sku]] `
        -Kind [[kind]]
  slots:
    - id: sku
      options:
        - { id: pzrs, text: Premium_ZRS }
        - { id: plrs, text: Premium_LRS }
        - { id: szrs, text: Standard_ZRS }
        - { id: sgzrs, text: Standard_GZRS }
    - id: kind
      options:
        - { id: fs, text: FileStorage }
        - { id: v2, text: StorageV2 }
        - { id: bbs, text: BlockBlobStorage }
        - { id: blob, text: BlobStorage }
answer:
  values: { sku: pzrs, kind: fs }
explanation:
  correct:
    en: |
      SSD (premium) Azure file shares are created in a storage account of kind FileStorage with a Premium SKU. SSD file shares support only LRS and ZRS; ZRS copies the data synchronously across three availability zones of the region, so Premium_ZRS meets the zone requirement.
    fr: |
      Les partages de fichiers Azure SSD (premium) sont créés dans un compte de stockage de type FileStorage avec une référence SKU Premium. Les partages de fichiers SSD ne prennent en charge que LRS et ZRS ; ZRS copie les données de façon synchrone dans trois zones de disponibilité de la région : Premium_ZRS répond donc à l'exigence de zone.
  options:
    plrs: { en: "LRS keeps the three copies in a single datacenter; a zone failure can make the share unavailable.", fr: "LRS conserve les trois copies dans un seul centre de données ; une panne de zone peut rendre le partage indisponible." }
    szrs: { en: "Standard SKUs provide HDD file shares, not SSD.", fr: "Les références SKU Standard fournissent des partages de fichiers HDD, pas SSD." }
    sgzrs: { en: "Standard SKUs provide HDD file shares, not SSD.", fr: "Les références SKU Standard fournissent des partages de fichiers HDD, pas SSD." }
    v2: { en: "A general-purpose v2 account hosts HDD (standard) file shares only.", fr: "Un compte v2 universel n'héberge que des partages de fichiers HDD (standard)." }
    bbs: { en: "BlockBlobStorage is the premium account kind for block blobs, not for file shares.", fr: "BlockBlobStorage est le type de compte premium pour les objets blob de blocs, pas pour les partages de fichiers." }
    blob: { en: "BlobStorage is a legacy blob-only account kind; it can't host file shares.", fr: "BlobStorage est un ancien type de compte réservé aux objets blob ; il ne peut pas héberger de partages de fichiers." }
references:
  - title: Azure Files data redundancy
    url: https://learn.microsoft.com/en-us/azure/storage/files/files-redundancy
  - title: Plan an Azure Files deployment
    url: https://learn.microsoft.com/en-us/azure/storage/files/storage-files-planning
