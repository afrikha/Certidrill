id: az140-1a-sp-options-hotarea
objective: "1.1.3"
type: hotarea
difficulty: 2
status: draft
stem:
  en: |
    Contoso has an Azure Virtual Desktop host pool named **HP1**. The following table shows the RDP Shortpath options of HP1.

    - Users at the headquarters connect over ExpressRoute private peering. The session hosts have the RDP Shortpath listener enabled on UDP 3390, and the network security groups allow it from the headquarters.
    - Remote users connect from home routers that use symmetric NAT.

    Answer each prompt by selecting the option that the connection uses.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso dispose d'un pool d'hôtes Azure Virtual Desktop nommé **HP1**. Le tableau suivant présente les options RDP Shortpath de HP1.

    - Les utilisateurs du siège se connectent par le peering privé ExpressRoute. L'écouteur RDP Shortpath est activé sur UDP 3390 sur les hôtes de session, et les groupes de sécurité réseau l'autorisent depuis le siège.
    - Les utilisateurs distants se connectent depuis des routeurs domestiques qui utilisent un NAT symétrique.

    Répondez à chaque consigne en sélectionnant l'option qu'utilise la connexion.

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
    - id: p1
      text: { en: "A direct UDP connection from the headquarters to the UDP 3390 listener", fr: "Une connexion UDP directe du siège vers l'écouteur UDP 3390" }
    - id: p2
      text: { en: "A UDP connection from a remote user behind symmetric NAT", fr: "Une connexion UDP d'un utilisateur distant derrière un NAT symétrique" }
  grid:
    caption: { en: "HP1 > Networking > RDP Shortpath", fr: "HP1 > Networking > RDP Shortpath" }
    header: [ { en: "RDP Shortpath option", fr: "Option RDP Shortpath" }, { en: "Value", fr: "Valeur" } ]
    rows:
      - [ { text: { en: "RDP Shortpath for managed networks", fr: "RDP Shortpath pour les réseaux managés" }, area: mgd }, { text: Enabled } ]
      - [ { text: { en: "RDP Shortpath for managed networks with ICE/STUN", fr: "RDP Shortpath pour les réseaux managés avec ICE/STUN" }, area: mgdstun }, { text: Enabled } ]
      - [ { text: { en: "RDP Shortpath for public networks with ICE/STUN", fr: "RDP Shortpath pour les réseaux publics avec ICE/STUN" }, area: pubstun }, { text: Enabled } ]
      - [ { text: { en: "RDP Shortpath for public networks via TURN", fr: "RDP Shortpath pour les réseaux publics via TURN" }, area: turn }, { text: Enabled } ]
answer:
  values: { p1: mgd, p2: turn }
explanation:
  correct:
    en: |
      The managed-network option is the only one where the client connects directly to a listener on the session host (UDP 3390 by default), over ExpressRoute private peering or a VPN. Behind a symmetric NAT, a direct STUN path usually fails, so the connection falls back to a UDP relay through TURN.
    fr: |
      L'option des réseaux managés est la seule où le client se connecte directement à un écouteur de l'hôte de session (UDP 3390 par défaut), par le peering privé ExpressRoute ou un VPN. Derrière un NAT symétrique, un chemin STUN direct échoue généralement : la connexion se rabat sur un relais UDP par TURN.
  options:
    mgdstun: { en: "The ICE/STUN option for managed networks doesn't use the inbound listener; it needs no inbound port.", fr: "L'option ICE/STUN pour les réseaux managés n'utilise pas l'écouteur entrant ; elle n'exige aucun port entrant." }
    pubstun: { en: "Direct STUN connections usually fail behind symmetric NAT.", fr: "Les connexions STUN directes échouent généralement derrière un NAT symétrique." }
references:
  - title: RDP Shortpath for Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/rdp-shortpath
  - title: Configure RDP Shortpath for Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/configure-rdp-shortpath
