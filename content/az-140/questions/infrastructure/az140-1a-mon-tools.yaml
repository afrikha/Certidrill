id: az140-1a-mon-tools
objective: "1.1.5"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    You support an Azure Virtual Desktop host pool named **HP1**. Azure Virtual Desktop Insights is configured for HP1, and Network Watcher is enabled in the region of the session hosts.

    Which tool should you use for each task? To answer, drag the appropriate tools to the correct tasks. Each tool may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous assurez le support d'un pool d'hôtes Azure Virtual Desktop nommé **HP1**. Azure Virtual Desktop Insights est configuré pour HP1, et Network Watcher est activé dans la région des hôtes de session.

    Quel outil devez-vous utiliser pour chaque tâche ? Pour répondre, faites glisser les outils appropriés vers les tâches correspondantes. Chaque outil peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: ci, text: { en: "Connection Information in the client", fr: "Connection Information dans le client" } }
    - { id: perf, text: { en: "Insights: Connection Performance", fr: "Insights : Connection Performance" } }
    - { id: rel, text: { en: "Insights: Connection Reliability", fr: "Insights : Connection Reliability" } }
    - { id: ipflow, text: { en: "Network Watcher: IP flow verify", fr: "Network Watcher : vérification des flux IP" } }
    - { id: nettest, text: avdnettest.exe }
    - { id: urltool, text: WVDAgentUrlTool.exe }
  targets:
    - { id: t1, text: { en: "Show the transport and round-trip time of your own current session", fr: "Afficher le transport et la durée aller-retour de votre session en cours" } }
    - { id: t2, text: { en: "Find the gateway regions with the highest median round-trip time for HP1", fr: "Trouver les régions de passerelle qui ont la durée aller-retour médiane la plus élevée pour HP1" } }
    - { id: t3, text: { en: "View disconnections over time, grouped by transport and client version", fr: "Afficher les déconnexions dans le temps, regroupées par transport et par version du client" } }
    - { id: t4, text: { en: "Identify the security rule that denies a flow from a session host to a given IP address and port", fr: "Identifier la règle de sécurité qui refuse un flux d'un hôte de session vers une adresse IP et un port donnés" } }
answer:
  mapping: { t1: ci, t2: perf, t3: rel, t4: ipflow }
explanation:
  correct:
    en: |
      Connection Information, opened from the connection bar, shows the transport and round-trip time of the current session. In Insights, Connection Performance shows round-trip time by gateway region with drill-down to the slowest users, and Connection Reliability graphs disconnections with pivots such as Transport, Client version and Gateway region. IP flow verify tells you whether a flow is allowed or denied and by which security rule.
    fr: |
      Connection Information, ouvert depuis la barre de connexion, affiche le transport et la durée aller-retour de la session en cours. Dans Insights, Connection Performance présente la durée aller-retour par région de passerelle avec un accès détaillé aux utilisateurs les plus lents, et Connection Reliability représente les déconnexions avec des axes comme Transport, Client version et Gateway region. La vérification des flux IP indique si un flux est autorisé ou refusé, et par quelle règle de sécurité.
references:
  - title: Use cases for Azure Virtual Desktop Insights
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/insights-use-cases
  - title: Configure RDP Shortpath for Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/configure-rdp-shortpath
