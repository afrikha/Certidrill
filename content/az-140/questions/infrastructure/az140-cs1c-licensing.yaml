id: az140-cs1c-licensing
objective: "1.3.3"
type: dropdown
caseStudy: az140-cs1c-alpine-ski-house
difficulty: 2
status: draft
stem:
  en: |
    You need to recommend a licensing model for Azure Virtual Desktop. The solution must meet the licensing requirement.

    What should you recommend? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez recommander un modèle de licence pour Azure Virtual Desktop. La solution doit respecter l'exigence relative aux licences.

    Que devez-vous recommander ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Permanent and seasonal employees: [[emp]]

      Travel agency agents: [[ext]]

      Location of HP-Partners: [[sub]]
    fr: |
      Employés permanents et saisonniers : [[emp]]

      Agents des agences de voyages : [[ext]]

      Emplacement de HP-Partners : [[sub]]
  slots:
    - id: emp
      options:
        - { id: rdscal, text: { en: "An RDS CAL with Software Assurance for each user", fr: "Une CAL RDS avec Software Assurance pour chaque utilisateur" } }
        - { id: m365, text: { en: "No additional license", fr: "Aucune licence supplémentaire" } }
        - { id: vda, text: { en: "A Windows VDA per user license for each user", fr: "Une licence Windows VDA par utilisateur pour chaque utilisateur" } }
    - id: ext
      options:
        - { id: f3, text: { en: "A Microsoft 365 F3 license assigned in alpineskihouse.com", fr: "Une licence Microsoft 365 F3 attribuée dans alpineskihouse.com" } }
        - { id: peruser, text: { en: "Per-user access pricing", fr: "La tarification de l'accès par utilisateur" } }
        - { id: rdscal2, text: { en: "An RDS CAL with Software Assurance for each agent", fr: "Une CAL RDS avec Software Assurance pour chaque agent" } }
    - id: sub
      options:
        - { id: internalenrolled, text: { en: "Sub-Internal, after you enroll Sub-Internal in per-user access pricing", fr: "Sub-Internal, après avoir inscrit Sub-Internal à la tarification de l'accès par utilisateur" } }
        - { id: internal, text: { en: "Sub-Internal, without changing its billing", fr: "Sub-Internal, sans modifier sa facturation" } }
        - { id: dedicated, text: { en: "A new subscription that is enrolled in per-user access pricing", fr: "Un nouvel abonnement inscrit à la tarification de l'accès par utilisateur" } }
answer:
  values: { emp: m365, ext: peruser, sub: dedicated }
explanation:
  correct:
    en: |
      Microsoft 365 E3 and F3 already grant the right to access Windows 11 Enterprise multi-session session hosts, so employees need nothing more. Per-user access pricing covers external users such as the agency agents and is billed on the Azure invoice of an enrolled subscription. Because every user who connects to resources in an enrolled subscription is charged, HP-Partners goes in a separate enrolled subscription, so employees who use Sub-Internal are not charged twice.
    fr: |
      Microsoft 365 E3 et F3 donnent déjà le droit d'accéder à des hôtes de session Windows 11 Entreprise multisession : les employés n'ont besoin de rien de plus. La tarification de l'accès par utilisateur couvre les utilisateurs externes tels que les agents des agences et elle est facturée sur la facture Azure d'un abonnement inscrit. Comme chaque utilisateur qui se connecte aux ressources d'un abonnement inscrit est facturé, HP-Partners est placé dans un abonnement inscrit distinct, afin que les employés qui utilisent Sub-Internal ne soient pas facturés deux fois.
  options:
    emp: { en: "RDS CALs are for Windows Server session hosts, and a Windows VDA license would duplicate the rights that Microsoft 365 E3 and F3 already include.", fr: "Les CAL RDS concernent les hôtes de session Windows Server, et une licence Windows VDA ferait double emploi avec les droits déjà inclus dans Microsoft 365 E3 et F3." }
    ext: { en: "A Microsoft 365 F3 license is a Microsoft 365 purchase, which the requirement excludes; RDS CALs do not apply to Windows 11 session hosts.", fr: "Une licence Microsoft 365 F3 est un achat Microsoft 365, ce que l'exigence exclut ; les CAL RDS ne s'appliquent pas aux hôtes de session Windows 11." }
    sub: { en: "Enrolling Sub-Internal would charge employees too; without enrollment, the agents would have no access rights.", fr: "Inscrire Sub-Internal facturerait aussi les employés ; sans inscription, les agents n'auraient aucun droit d'accès." }
references:
  - title: Licensing Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/licensing
