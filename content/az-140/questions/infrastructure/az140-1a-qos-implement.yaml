id: az140-1a-qos-implement
objective: "1.1.3"
type: ordering
difficulty: 3
status: draft
stem:
  en: |
    Fabrikam users connect to an Azure Virtual Desktop host pool named **HP1** over an ExpressRoute circuit that is often congested. The session hosts are joined to an AD DS domain and are in an organizational unit named **OU-AVD**. Today, the sessions use the TCP reverse connect transport. The routers on the ExpressRoute path already place DSCP 46 traffic in a priority queue.

    You need to prioritize the RDP traffic of HP1 on the ExpressRoute path by following Microsoft's recommendations.

    Which three actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Les utilisateurs de Fabrikam se connectent à un pool d'hôtes Azure Virtual Desktop nommé **HP1** par un circuit ExpressRoute souvent saturé. Les hôtes de session sont joints à un domaine AD DS et se trouvent dans une unité d'organisation nommée **OU-AVD**. Aujourd'hui, les sessions utilisent le transport TCP reverse connect. Les routeurs du chemin ExpressRoute placent déjà le trafic DSCP 46 dans une file prioritaire.

    Vous devez donner la priorité au trafic RDP de HP1 sur le chemin ExpressRoute en suivant les recommandations de Microsoft.

    Quelles sont les trois actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - { id: sp, text: { en: "Enable RDP Shortpath for managed networks on the session hosts and allow inbound UDP 3390.", fr: "Activer RDP Shortpath pour les réseaux managés sur les hôtes de session et autoriser UDP 3390 en entrée." } }
    - { id: gpo, text: { en: "In a GPO linked to OU-AVD, create a Policy-based QoS policy with DSCP value 46 for svchost.exe, UDP source port 3390.", fr: "Dans un objet de stratégie de groupe lié à OU-AVD, créer une stratégie Policy-based QoS avec la valeur DSCP 46 pour svchost.exe, port source UDP 3390." } }
    - { id: refresh, text: { en: "Run gpupdate /force on each session host.", fr: "Exécuter gpupdate /force sur chaque hôte de session." } }
    - { id: tcp, text: { en: "In a GPO linked to OU-AVD, create a Policy-based QoS policy with DSCP value 46 for TCP destination port 443.", fr: "Dans un objet de stratégie de groupe lié à OU-AVD, créer une stratégie Policy-based QoS avec la valeur DSCP 46 pour le port de destination TCP 443." } }
    - { id: turn, text: { en: "Set RDP Shortpath for public networks via TURN to Disabled on HP1.", fr: "Définir RDP Shortpath pour les réseaux publics via TURN sur Désactivé dans HP1." } }
    - { id: dscp34, text: { en: "Create a Policy-based QoS policy with DSCP value 34 for svchost.exe on the client devices.", fr: "Créer une stratégie Policy-based QoS avec la valeur DSCP 34 pour svchost.exe sur les appareils clients." } }
answer:
  sequence: [ sp, gpo, refresh ]
explanation:
  correct:
    en: |
      Microsoft's checklist is: make sure the network is ready, make sure RDP Shortpath for managed networks is enabled (QoS policies aren't supported for reverse connect), then insert the DSCP marker on the session hosts. The recommended marking is DSCP 46 (Expedited Forwarding) for svchost.exe, UDP source port 3390. Policies apply only after a Group Policy refresh, which `gpupdate /force` triggers.
    fr: |
      La liste de contrôle de Microsoft est la suivante : vérifier que le réseau est prêt, vérifier que RDP Shortpath pour les réseaux managés est activé (les stratégies QoS ne sont pas prises en charge pour reverse connect), puis insérer le marqueur DSCP sur les hôtes de session. Le marquage recommandé est DSCP 46 (Expedited Forwarding) pour svchost.exe, port source UDP 3390. Les stratégies ne s'appliquent qu'après une actualisation de la stratégie de groupe, que `gpupdate /force` déclenche.
  options:
    tcp: { en: "QoS policies aren't supported for the reverse connect transport, which is the TCP 443 traffic.", fr: "Les stratégies QoS ne sont pas prises en charge pour le transport reverse connect, c'est-à-dire le trafic TCP 443." }
    turn: { en: "TURN doesn't affect the managed-network path, and Microsoft recommends keeping it enabled.", fr: "TURN n'a pas d'effet sur le chemin des réseaux managés, et Microsoft recommande de le laisser activé." }
    dscp34: { en: "Microsoft recommends DSCP 46 inserted on the session hosts, not DSCP 34 on clients.", fr: "Microsoft recommande DSCP 46 inséré sur les hôtes de session, pas DSCP 34 sur les clients." }
references:
  - title: Implement Quality of Service (QoS) for Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/rdp-quality-of-service-qos
