id: az140-1b-anf-throughput-quota
objective: "1.2.5"
type: single
difficulty: 2
status: draft
shuffle: false
stem:
  en: |
    You have an Azure NetApp Files capacity pool named **pool-avd** that uses the Premium service level and the auto QoS type. You plan to create an SMB volume in pool-avd for FSLogix profile containers.

    Load tests show that the volume needs a throughput limit of at least 512 MiB/s during the morning sign-in peak.

    What is the minimum quota that you should assign to the volume?
  fr: |
    Vous disposez d'un pool de capacité Azure NetApp Files nommé **pool-avd** qui utilise le niveau de service Premium et le type de QoS automatique. Vous prévoyez de créer un volume SMB dans pool-avd pour les conteneurs de profils FSLogix.

    Les tests de charge montrent que le volume a besoin d'une limite de débit d'au moins 512 Mio/s pendant le pic d'ouvertures de session du matin.

    Quel est le quota minimal que vous devez attribuer au volume ?
body:
  options:
    - { id: a, text: { en: "4 TiB", fr: "4 Tio" } }
    - { id: b, text: { en: "8 TiB", fr: "8 Tio" } }
    - { id: c, text: { en: "16 TiB", fr: "16 Tio" } }
    - { id: d, text: { en: "32 TiB", fr: "32 Tio" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      In an auto QoS capacity pool, a volume's throughput limit is its quota multiplied by the throughput of the service level. Premium provides up to 64 MiB/s per TiB, so 512 MiB/s requires 512 / 64 = 8 TiB of quota.
    fr: |
      Dans un pool de capacité avec QoS automatique, la limite de débit d'un volume est égale à son quota multiplié par le débit du niveau de service. Premium fournit jusqu'à 64 Mio/s par Tio : 512 Mio/s exigent donc 512 / 64 = 8 Tio de quota.
  options:
    a: { en: "4 TiB of Premium gives 256 MiB/s.", fr: "4 Tio en Premium donnent 256 Mio/s." }
    c: { en: "16 TiB would give 1,024 MiB/s, more than the minimum required.", fr: "16 Tio donneraient 1 024 Mio/s, plus que le minimum nécessaire." }
    d: { en: "32 TiB would be the quota needed at the Standard level (16 MiB/s per TiB), not at Premium.", fr: "32 Tio correspondraient au quota nécessaire au niveau Standard (16 Mio/s par Tio), pas au niveau Premium." }
references:
  - title: Service levels for Azure NetApp Files
    url: https://learn.microsoft.com/en-us/azure/azure-netapp-files/azure-netapp-files-service-levels
