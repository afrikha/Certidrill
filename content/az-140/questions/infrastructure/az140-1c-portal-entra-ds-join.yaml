id: az140-1c-portal-entra-ds-join
objective: "1.4.1"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    Contoso uses a Microsoft Entra Domain Services managed domain named aadds.contoso.com. You are creating Azure Virtual Desktop session hosts in the Azure portal, and they must be joined to aadds.contoso.com.

    How should you complete the domain join settings? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso utilise un domaine managé Microsoft Entra Domain Services nommé aadds.contoso.com. Vous créez des hôtes de session Azure Virtual Desktop dans le portail Azure, et ils doivent être joints à aadds.contoso.com.

    Comment devez-vous compléter les paramètres de jonction de domaine ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Domain to join: [[join]]

      The domain join account must be a member of: [[grp]]

      Multifactor authentication on the domain join account: [[mfa]]
    fr: |
      Domain to join : [[join]]

      Le compte de jonction de domaine doit être membre de : [[grp]]

      Authentification multifacteur sur le compte de jonction de domaine : [[mfa]]
  slots:
    - id: join
      options:
        - { id: entra, text: Microsoft Entra ID }
        - { id: ad, text: Active Directory }
    - id: grp
      options:
        - { id: aaddc, text: { en: "The AAD DC Administrators group", fr: "Le groupe AAD DC Administrators" } }
        - { id: da, text: { en: "The Domain Admins group", fr: "Le groupe Domain Admins" } }
        - { id: hia, text: { en: "The Hybrid Identity Administrator role", fr: "Le rôle Hybrid Identity Administrator" } }
    - id: mfa
      options:
        - { id: nomfa, text: { en: "Must not be enabled", fr: "Ne doit pas être activée" } }
        - { id: mfareq, text: { en: "Must be enabled", fr: "Doit être activée" } }
        - { id: ca, text: { en: "Must be enforced by Conditional Access", fr: "Doit être imposée par l'accès conditionnel" } }
answer:
  values: { join: ad, grp: aaddc, mfa: nomfa }
explanation:
  correct:
    en: |
      A Microsoft Entra Domain Services managed domain is an Active Directory domain, so you select Active Directory and enter its domain name and join credentials. Joining computers to the managed domain requires an account that is a member of the AAD DC Administrators group, and the domain join account can't have multifactor authentication enabled.
    fr: |
      Un domaine managé Microsoft Entra Domain Services est un domaine Active Directory : vous sélectionnez Active Directory et indiquez son nom de domaine et les informations d'identification de jonction. Joindre des ordinateurs au domaine managé exige un compte membre du groupe AAD DC Administrators, et le compte de jonction de domaine ne peut pas avoir l'authentification multifacteur activée.
  options:
    entra: { en: "Microsoft Entra ID join doesn't join the VMs to the managed domain aadds.contoso.com.", fr: "La jonction Microsoft Entra ID ne joint pas les machines virtuelles au domaine managé aadds.contoso.com." }
    da: { en: "In a managed domain, the delegated administration group is AAD DC Administrators.", fr: "Dans un domaine managé, le groupe d'administration délégué est AAD DC Administrators." }
    hia: { en: "A Microsoft Entra role doesn't grant rights to join computers to the managed domain.", fr: "Un rôle Microsoft Entra ne donne pas le droit de joindre des ordinateurs au domaine managé." }
    mfareq: { en: "Azure Virtual Desktop requires a domain join account that doesn't have MFA enabled.", fr: "Azure Virtual Desktop exige un compte de jonction de domaine sans authentification multifacteur activée." }
references:
  - title: Prerequisites for Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/prerequisites
