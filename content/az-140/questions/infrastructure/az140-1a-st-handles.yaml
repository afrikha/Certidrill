id: az140-1a-st-handles
objective: "1.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Contoso stores the FSLogix profile containers of 12,000 concurrent users on a single Azure Files SSD share. Metadata caching isn't enabled. During the morning peak, users beyond about 10,000 can't attach their profile container, although the share has enough provisioned IOPS and capacity.

    You need to support all the users. The solution must not use preview features.

    What should you do?
  fr: |
    Contoso stocke les conteneurs de profils FSLogix de 12 000 utilisateurs simultanés sur un seul partage Azure Files SSD. La mise en cache des métadonnées n'est pas activée. Pendant le pic du matin, les utilisateurs au-delà d'environ 10 000 ne parviennent pas à attacher leur conteneur de profil, bien que le partage dispose d'assez de capacité et d'IOPS provisionnées.

    Vous devez prendre en charge tous les utilisateurs. La solution ne doit pas utiliser de fonctionnalités en préversion.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Increase the provisioned IOPS and throughput of the share.", fr: "Augmenter les IOPS et le débit provisionnés du partage." }
    - id: b
      text: { en: "Create another share and distribute the profile containers across both shares.", fr: "Créer un autre partage et répartir les conteneurs de profils entre les deux partages." }
    - id: c
      text: { en: "Increase the SizeInMBs value of the profile containers.", fr: "Augmenter la valeur SizeInMBs des conteneurs de profils." }
    - id: d
      text: { en: "Change the redundancy of the storage account to ZRS.", fr: "Changer la redondance du compte de stockage en ZRS." }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Each user opens one handle on the root directory of the share, and Azure Files allows 10,000 concurrent handles on a share's root directory, so one share supports up to about 10,000 FSLogix users. When you reach this limit, you add a share and distribute the containers across shares. Raising the handle limits on SSD shares requires metadata caching and increased handle limits, which are in preview.
    fr: |
      Chaque utilisateur ouvre un handle sur le répertoire racine du partage, et Azure Files autorise 10 000 handles simultanés sur le répertoire racine d'un partage : un partage prend donc en charge environ 10 000 utilisateurs FSLogix au maximum. Quand cette limite est atteinte, vous ajoutez un partage et répartissez les conteneurs entre les partages. Relever les limites de handles sur les partages SSD exige la mise en cache des métadonnées et l'augmentation des limites de handles, qui est en préversion.
  options:
    a: { en: "The limit reached is the number of root directory handles, not performance.", fr: "La limite atteinte est le nombre de handles du répertoire racine, pas les performances." }
    c: { en: "SizeInMBs sets the maximum size of each container; it doesn't change the number of handles.", fr: "SizeInMBs définit la taille maximale de chaque conteneur ; il ne change pas le nombre de handles." }
    d: { en: "Redundancy protects data against failures; it doesn't raise handle limits.", fr: "La redondance protège les données contre les pannes ; elle ne relève pas les limites de handles." }
references:
  - title: Azure Files guidance for virtual desktop workloads
    url: https://learn.microsoft.com/en-us/azure/storage/files/virtual-desktop-workloads
