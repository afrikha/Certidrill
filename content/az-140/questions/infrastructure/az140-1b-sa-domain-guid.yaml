id: az140-1b-sa-domain-guid
objective: "1.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have an Azure Virtual Desktop host pool whose session hosts are Microsoft Entra joined. The users are hybrid identities from the litware.com AD DS domain. You are enabling Microsoft Entra Kerberos authentication on a storage account named **stlitprof01** for the FSLogix profile share.

    Litware administrators want to set the directory permissions of the share by using Windows File Explorer from a domain-joined computer.

    Which information should you provide when you enable Microsoft Entra Kerberos on stlitprof01?
  fr: |
    Vous disposez d'un pool d'hôtes Azure Virtual Desktop dont les hôtes de session sont joints à Microsoft Entra. Les utilisateurs sont des identités hybrides du domaine AD DS litware.com. Vous activez l'authentification Microsoft Entra Kerberos sur un compte de stockage nommé **stlitprof01** pour le partage de profils FSLogix.

    Les administrateurs de Litware veulent définir les autorisations des répertoires du partage avec l'Explorateur de fichiers Windows depuis un ordinateur joint au domaine.

    Quelles informations devez-vous fournir quand vous activez Microsoft Entra Kerberos sur stlitprof01 ?
body:
  options:
    - id: a
      text: { en: "The distinguished name of an OU and the name of a computer account", fr: "Le nom unique d'une unité d'organisation et le nom d'un compte d'ordinateur" }
    - id: b
      text: { en: "The tenant ID and the application ID of the storage account application", fr: "L'ID du locataire et l'ID d'application de l'application du compte de stockage" }
    - id: c
      text: { en: "The AD DS domain name and the domain GUID", fr: "Le nom du domaine AD DS et le GUID du domaine" }
    - id: d
      text: { en: "The IP addresses of two domain controllers and the AD site name", fr: "Les adresses IP de deux contrôleurs de domaine et le nom du site AD" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      For hybrid identities, the Microsoft Entra Kerberos settings of the storage account optionally take the AD domain name and domain GUID, which you get from Get-ADDomain (DNSRoot and ObjectGUID). They're needed to manage directory and file permissions with Windows File Explorer.
    fr: |
      Pour les identités hybrides, les paramètres Microsoft Entra Kerberos du compte de stockage acceptent de manière facultative le nom de domaine AD et le GUID du domaine, que vous obtenez avec Get-ADDomain (DNSRoot et ObjectGUID). Ils sont nécessaires pour gérer les autorisations des répertoires et des fichiers avec l'Explorateur de fichiers Windows.
  options:
    a: { en: "An OU and computer account are used when joining a storage account to AD DS with Join-AzStorageAccount, not with Microsoft Entra Kerberos.", fr: "Une unité d'organisation et un compte d'ordinateur servent à joindre un compte de stockage à AD DS avec Join-AzStorageAccount, pas avec Microsoft Entra Kerberos." }
    b: { en: "The application is created automatically when you enable Microsoft Entra Kerberos; you don't supply its IDs.", fr: "L'application est créée automatiquement quand vous activez Microsoft Entra Kerberos ; vous ne fournissez pas ses ID." }
    d: { en: "DNS servers and the AD site name are fields of an Azure NetApp Files Active Directory connection, not of Microsoft Entra Kerberos.", fr: "Les serveurs DNS et le nom du site AD sont des champs d'une connexion Active Directory Azure NetApp Files, pas de Microsoft Entra Kerberos." }
references:
  - title: Enable Microsoft Entra Kerberos authentication for hybrid and cloud-only identities on Azure Files
    url: https://learn.microsoft.com/en-us/azure/storage/files/storage-files-identity-auth-hybrid-identities-enable
