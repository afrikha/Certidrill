id: az140-1b-org-two-regions
objective: "1.3.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Northwind Traders has 600 users in France and 400 users in Japan. All users need the same pooled Windows desktop and FSLogix profile containers.

    You need to recommend an Azure Virtual Desktop architecture that minimizes the latency for both user populations, both between users and their session hosts and between session hosts and profile storage.

    What should you recommend?
  fr: |
    Northwind Traders compte 600 utilisateurs en France et 400 au Japon. Tous les utilisateurs ont besoin du même bureau Windows regroupé et de conteneurs de profils FSLogix.

    Vous devez recommander une architecture Azure Virtual Desktop qui réduit au minimum la latence pour les deux populations d'utilisateurs, à la fois entre les utilisateurs et leurs hôtes de session et entre les hôtes de session et le stockage des profils.

    Que devez-vous recommander ?
body:
  options:
    - id: a
      text: { en: "One host pool with session hosts in France Central and Japan East, and one profile share in France Central", fr: "Un pool d'hôtes avec des hôtes de session dans France Central et Japan East, et un partage de profils dans France Central" }
    - id: b
      text: { en: "Two host pools in France Central, one for each user population, and one profile share in France Central", fr: "Deux pools d'hôtes dans France Central, un pour chaque population d'utilisateurs, et un partage de profils dans France Central" }
    - id: c
      text: { en: "One host pool with session hosts and a profile share in France Central, and RDP Shortpath for the users in Japan", fr: "Un pool d'hôtes avec des hôtes de session et un partage de profils dans France Central, et RDP Shortpath pour les utilisateurs au Japon" }
    - id: d
      text: { en: "Two host pools, each with session hosts and a profile share in the region of its users", fr: "Deux pools d'hôtes, chacun avec des hôtes de session et un partage de profils dans la région de ses utilisateurs" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Session hosts should run in the Azure region closest to their users, and profile storage should be in the same region as the session hosts because every profile read and write crosses the network. Load balancing in a host pool doesn't send a user to the closest session host, so each population gets its own host pool with its session hosts, virtual network and profile storage in its region. The session host virtual network must be in the same region as the session hosts.
    fr: |
      Les hôtes de session doivent s'exécuter dans la région Azure la plus proche de leurs utilisateurs, et le stockage des profils doit se trouver dans la même région que les hôtes de session, car chaque lecture et écriture de profil traverse le réseau. L'équilibrage de charge d'un pool d'hôtes n'envoie pas un utilisateur vers l'hôte de session le plus proche : chaque population obtient donc son propre pool d'hôtes avec ses hôtes de session, son réseau virtuel et son stockage de profils dans sa région. Le réseau virtuel des hôtes de session doit être dans la même région que les hôtes de session.
  options:
    a: { en: "Load balancing could send users to the distant region, and the session hosts in Japan East would read profiles from France.", fr: "L'équilibrage de charge pourrait envoyer les utilisateurs vers la région lointaine, et les hôtes de session de Japan East liraient les profils depuis la France." }
    b: { en: "The users in Japan would still connect to session hosts in France, far from them.", fr: "Les utilisateurs au Japon se connecteraient toujours à des hôtes de session en France, loin d'eux." }
    c: { en: "RDP Shortpath improves the transport but can't remove the distance between Japan and France.", fr: "RDP Shortpath améliore le transport, mais ne peut pas supprimer la distance entre le Japon et la France." }
references:
  - title: Prerequisites for Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/prerequisites
