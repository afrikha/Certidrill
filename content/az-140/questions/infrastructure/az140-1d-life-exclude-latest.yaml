id: az140-1d-life-exclude-latest
objective: "1.5.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Your Azure Virtual Desktop production session hosts are deployed from an Azure Compute Gallery image definition named **win11-multi** without a version number, so they use the latest version. The current version is 2.0.0.

    You publish version 2.1.0 of win11-multi. Until testers approve it, new production session hosts must keep using 2.0.0, while test session hosts must be able to deploy 2.1.0 by referencing its version number.

    What should you do?
  fr: |
    Vos hôtes de session Azure Virtual Desktop de production sont déployés à partir d'une définition d'image Azure Compute Gallery nommée **win11-multi** sans numéro de version : ils utilisent donc la version la plus récente. La version actuelle est 2.0.0.

    Vous publiez la version 2.1.0 de win11-multi. Tant que les testeurs ne l'ont pas approuvée, les nouveaux hôtes de session de production doivent continuer à utiliser 2.0.0, tandis que les hôtes de session de test doivent pouvoir déployer 2.1.0 en référençant son numéro de version.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Set an end-of-life date on version 2.1.0.", fr: "Définir une date de fin de vie sur la version 2.1.0." } }
    - { id: b, text: { en: "Set Exclude from latest on version 2.1.0.", fr: "Activer Exclude from latest sur la version 2.1.0." } }
    - { id: c, text: { en: "Set Exclude from latest on version 2.0.0.", fr: "Activer Exclude from latest sur la version 2.0.0." } }
    - { id: d, text: { en: "Apply a ReadOnly lock to win11-multi.", fr: "Appliquer un verrou Lecture seule à win11-multi." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      A version with **Exclude from latest** (`excludeFromLatest`) is never chosen when a deployment asks for the latest version, but it can still be deployed by its explicit version number. Production keeps resolving to 2.0.0 until you clear the flag on 2.1.0 after approval.
    fr: |
      Une version avec **Exclude from latest** (`excludeFromLatest`) n'est jamais choisie quand un déploiement demande la version la plus récente, mais elle peut toujours être déployée par son numéro de version explicite. La production continue à utiliser 2.0.0 jusqu'à ce que vous retiriez l'indicateur de 2.1.0 après approbation.
  options:
    a:
      en: The end-of-life date is informational; it doesn't keep a version out of latest.
      fr: La date de fin de vie est informative ; elle n'exclut pas une version de la plus récente.
    c:
      en: Excluding 2.0.0 would make latest resolve to the untested 2.1.0.
      fr: Exclure 2.0.0 ferait pointer la plus récente vers 2.1.0, non testée.
    d:
      en: A lock protects the resource from changes or deletion; it doesn't change which version latest resolves to.
      fr: Un verrou protège la ressource contre les modifications ou la suppression ; il ne change pas la version désignée comme la plus récente.
references:
  - title: Store and share images in an Azure Compute Gallery
    url: https://learn.microsoft.com/en-us/azure/virtual-machines/shared-image-galleries
