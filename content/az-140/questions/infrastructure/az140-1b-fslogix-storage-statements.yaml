id: az140-1b-fslogix-storage-statements
objective: "1.2.2"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    You have an Azure Virtual Desktop pooled host pool named **HP3** that stores FSLogix profile containers in an Azure file share. Only the **Enabled** and **VHDLocations** values are configured under `HKLM\SOFTWARE\FSLogix\Profiles`. Some users already have containers of 25 GB.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un pool d'hôtes regroupé Azure Virtual Desktop nommé **HP3** qui stocke les conteneurs de profils FSLogix dans un partage de fichiers Azure. Seules les valeurs **Enabled** et **VHDLocations** sont configurées sous `HKLM\SOFTWARE\FSLogix\Profiles`. Certains utilisateurs ont déjà des conteneurs de 25 Go.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: The containers that FSLogix creates for new users are VHD files.
        fr: Les conteneurs que FSLogix crée pour les nouveaux utilisateurs sont des fichiers VHD.
    - id: s2
      text:
        en: You can add SizeInMBs = 20000 to reduce the maximum size of the existing containers.
        fr: Vous pouvez ajouter SizeInMBs = 20000 pour réduire la taille maximale des conteneurs existants.
    - id: s3
      text:
        en: If you set IsDynamic to 0, new containers immediately use their full maximum size in the file share.
        fr: Si vous définissez IsDynamic sur 0, les nouveaux conteneurs occupent immédiatement leur taille maximale complète dans le partage de fichiers.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: VolumeType defaults to vhd, so new containers are VHD files unless you set vhdx. SizeInMBs (default 30000) can be increased but never decreased. IsDynamic defaults to 1 (the file grows as needed); with 0, the file is fully allocated at creation, which consumes its full size in the share.
    fr: VolumeType vaut vhd par défaut ; les nouveaux conteneurs sont donc des fichiers VHD tant que vous ne définissez pas vhdx. SizeInMBs (30000 par défaut) peut être augmenté, mais jamais diminué. IsDynamic vaut 1 par défaut (le fichier croît selon les besoins) ; avec 0, le fichier est entièrement alloué à sa création, ce qui occupe toute sa taille dans le partage.
references:
  - title: Configuration Setting Reference
    url: https://learn.microsoft.com/en-us/fslogix/reference-configuration-settings
