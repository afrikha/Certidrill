id: az140-1d-lic-server-steps
objective: "1.4.4"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    Litware deploys an Azure Virtual Desktop pooled host pool whose session hosts run Windows Server 2022 and are joined to AD DS. Litware purchased RDS Per User CALs with Software Assurance. No Remote Desktop license server exists yet.

    A Group Policy object that specifies a license server named SRV-LIC and the Per User licensing mode is already linked to the session hosts. SRV-LIC is a new Windows Server 2022 virtual machine that the session hosts can reach.

    You need to complete the licensing configuration.

    Which three actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Litware déploie un pool d'hôtes regroupé Azure Virtual Desktop dont les hôtes de session exécutent Windows Server 2022 et sont joints à AD DS. Litware a acheté des CAL RDS Par utilisateur avec Software Assurance. Aucun serveur de licences Bureau à distance n'existe encore.

    Un objet de stratégie de groupe qui désigne un serveur de licences nommé SRV-LIC et le mode de licence Par utilisateur est déjà lié aux hôtes de session. SRV-LIC est une nouvelle machine virtuelle Windows Server 2022 que les hôtes de session peuvent joindre.

    Vous devez terminer la configuration des licences.

    Quelles sont les trois actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - { id: role, text: { en: "Install the Remote Desktop Licensing role service on SRV-LIC.", fr: "Installer le service de rôle Gestionnaire de licences des services Bureau à distance sur SRV-LIC." } }
    - { id: broker, text: { en: "Install the Remote Desktop Connection Broker role service on SRV-LIC.", fr: "Installer le service de rôle Service Broker pour les connexions Bureau à distance sur SRV-LIC." } }
    - { id: activate, text: { en: "Activate the license server.", fr: "Activer le serveur de licences." } }
    - { id: cals, text: { en: "Install the RDS Per User CALs on the license server.", fr: "Installer les CAL RDS Par utilisateur sur le serveur de licences." } }
    - { id: client, text: { en: "Set the LicenseType property of the session hosts to Windows_Client.", fr: "Définir la propriété LicenseType des hôtes de session sur Windows_Client." } }
    - { id: pupa, text: { en: "Enroll the subscription in per-user access pricing.", fr: "Inscrire l'abonnement à la tarification de l'accès par utilisateur." } }
answer:
  sequence: [ role, activate, cals ]
explanation:
  correct:
    en: |
      Windows Server session hosts need an RDS CAL for each user or device, issued by a Remote Desktop license server that they can reach. You install the Remote Desktop Licensing role service, activate the license server, and then install the CALs on it. The session hosts already know the server and the licensing mode through the existing GPO.
    fr: |
      Des hôtes de session Windows Server exigent une CAL RDS par utilisateur ou par appareil, délivrée par un serveur de licences Bureau à distance qu'ils peuvent joindre. Vous installez le service de rôle Gestionnaire de licences des services Bureau à distance, activez le serveur de licences, puis y installez les CAL. Les hôtes de session connaissent déjà le serveur et le mode de licence grâce à l'objet de stratégie de groupe existant.
  options:
    broker:
      en: Azure Virtual Desktop provides the connection brokering; an RD Connection Broker isn't needed to issue CALs.
      fr: Azure Virtual Desktop fournit le service broker de connexion ; un service Broker pour les connexions Bureau à distance n'est pas nécessaire pour délivrer des CAL.
    client:
      en: Windows_Client applies to Windows client session hosts covered by eligible per-user licenses, not to Windows Server.
      fr: Windows_Client s'applique aux hôtes de session Windows client couverts par des licences éligibles par utilisateur, pas à Windows Server.
    pupa:
      en: Per-user access pricing is for external users and isn't available for Windows Server session hosts.
      fr: La tarification de l'accès par utilisateur est destinée aux utilisateurs externes et n'est pas disponible pour les hôtes de session Windows Server.
references:
  - title: License Remote Desktop Services with Client Access Licenses (CALs)
    url: https://learn.microsoft.com/en-us/windows-server/remote/remote-desktop-services/rds-client-access-license
  - title: Apply Windows license to session host virtual machines
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/apply-windows-license
