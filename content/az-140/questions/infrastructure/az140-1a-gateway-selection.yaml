id: az140-1a-gateway-selection
objective: "1.1.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A user of Fabrikam connects to an Azure Virtual Desktop session from a Windows device in the Azure public cloud. Before the connection, the client measures the following latency to the Azure Virtual Desktop gateways.

    | Gateway | Measured latency | Existing connections |
    | --- | --- | --- |
    | GW1 | 12 ms | 9,000 |
    | GW2 | 17 ms | 1,200 |
    | GW3 | 14 ms | 4,000 |
    | GW4 | 45 ms | 100 |

    Which gateway will the client use for the connection?
  fr: |
    Un utilisateur de Fabrikam se connecte à une session Azure Virtual Desktop depuis un appareil Windows, dans le cloud public Azure. Avant la connexion, le client mesure la latence suivante vers les passerelles Azure Virtual Desktop.

    | Passerelle | Latence mesurée | Connexions existantes |
    | --- | --- | --- |
    | GW1 | 12 ms | 9 000 |
    | GW2 | 17 ms | 1 200 |
    | GW3 | 14 ms | 4 000 |
    | GW4 | 45 ms | 100 |

    Quelle passerelle le client utilisera-t-il pour la connexion ?
body:
  options:
    - { id: a, text: GW1 }
    - { id: b, text: GW3 }
    - { id: c, text: GW4 }
    - { id: d, text: GW2 }
answer: { optionId: d }
explanation:
  correct:
    en: |
      The client evaluates the latency to the gateways and groups them into 10 ms buckets. It picks the bucket with the lowest latency, then, inside that bucket, the gateway with the fewest existing connections. GW1, GW2 and GW3 all fall in the same 10 ms bucket, and GW2 has the fewest connections of the three.
    fr: |
      Le client évalue la latence vers les passerelles et les regroupe par tranches de 10 ms. Il retient la tranche de latence la plus faible, puis, dans cette tranche, la passerelle qui a le moins de connexions existantes. GW1, GW2 et GW3 tombent dans la même tranche de 10 ms, et GW2 a le moins de connexions des trois.
  options:
    a: { en: "GW1 has the lowest latency, but latency only decides the bucket; inside the bucket, the number of connections decides.", fr: "GW1 a la latence la plus faible, mais la latence ne décide que de la tranche ; dans la tranche, c'est le nombre de connexions qui décide." }
    b: { en: "GW3 is in the best bucket but has more connections than GW2.", fr: "GW3 est dans la meilleure tranche mais a plus de connexions que GW2." }
    c: { en: "GW4 has the fewest connections overall, but it is in a higher latency bucket.", fr: "GW4 a le moins de connexions au total, mais il se trouve dans une tranche de latence plus élevée." }
references:
  - title: Understanding Azure Virtual Desktop network connectivity
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/network-connectivity
