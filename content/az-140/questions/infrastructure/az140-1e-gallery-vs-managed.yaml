id: az140-1e-gallery-vs-managed
objective: "1.5.7"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Wingtip plans to store the custom images of its Azure Virtual Desktop session hosts. The images must meet the following requirements:

    - Session hosts are deployed from the same image in three Azure regions.
    - Each monthly build is kept as a separate version so that session hosts can be redeployed from a previous build.
    - Administrative effort is minimized.

    Where should you store the images?
  fr: |
    Wingtip prévoit de stocker les images personnalisées de ses hôtes de session Azure Virtual Desktop. Les images doivent satisfaire les exigences suivantes :

    - Les hôtes de session sont déployés à partir de la même image dans trois régions Azure.
    - Chaque build mensuel est conservé comme une version distincte pour pouvoir redéployer les hôtes de session à partir d'un build précédent.
    - L'effort d'administration est réduit au minimum.

    Où devez-vous stocker les images ?
body:
  options:
    - id: a
      text: { en: "Managed images, one per build in each region", fr: "Des images managées, une par build dans chaque région" }
    - id: b
      text: { en: "An Azure Compute Gallery image definition with one version per build", fr: "Une définition d'image Azure Compute Gallery avec une version par build" }
    - id: c
      text: { en: "VHD files in a blob container of a storage account", fr: "Des fichiers VHD dans un conteneur d'objets blob d'un compte de stockage" }
    - id: d
      text: { en: "An Azure Container Registry repository with one tag per build", fr: "Un référentiel Azure Container Registry avec une balise par build" }
answer: { optionId: b }
explanation:
  correct:
    en: Azure Compute Gallery groups image versions under an image definition and replicates each version to the target regions you choose, so one build can serve session hosts in several regions and previous versions stay available for a rollback. Microsoft recommends gallery images for production Azure Virtual Desktop environments.
    fr: "Azure Compute Gallery regroupe les versions d'image sous une définition d'image et réplique chaque version dans les régions cibles choisies : un même build peut servir des hôtes de session dans plusieurs régions et les versions précédentes restent disponibles pour un retour arrière. Microsoft recommande les images de galerie pour les environnements Azure Virtual Desktop de production."
  options:
    a: { en: "Managed images have no versioning or replication; you would manage a separate image per build and per region by hand.", fr: "Les images managées n'ont ni gestion des versions ni réplication : vous devriez gérer à la main une image par build et par région." }
    c: { en: "VHD files must be turned into an image before you can deploy VMs from them, and they offer no versioning or regional replication.", fr: "Les fichiers VHD doivent être transformés en image avant de pouvoir déployer des machines virtuelles, et ils n'offrent ni gestion des versions ni réplication régionale." }
    d: { en: "Azure Container Registry stores container images, not virtual machine images.", fr: "Azure Container Registry stocke des images conteneur, pas des images de machine virtuelle." }
references:
  - title: Store and share resources in Azure Compute Gallery
    url: https://learn.microsoft.com/en-us/azure/virtual-machines/azure-compute-gallery
  - title: Create a golden image in Azure
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/set-up-golden-image
