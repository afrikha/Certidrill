id: az140-1c-auto-cli-pooled
objective: "1.4.2"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    You need to create an Azure Virtual Desktop pooled host pool named hp-ops by using the Azure CLI, and then obtain the registration token that a deployment pipeline will use to register session hosts.

    The host pool must fill each session host up to its session limit before sending users to the next host, so that idle hosts can be shut down. The registration token must be generated when the host pool is created.

    How should you complete the commands? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez créer un pool d'hôtes Azure Virtual Desktop regroupé nommé hp-ops à l'aide d'Azure CLI, puis obtenir le jeton d'inscription qu'un pipeline de déploiement utilisera pour inscrire les hôtes de session.

    Le pool d'hôtes doit remplir chaque hôte de session jusqu'à sa limite de sessions avant d'envoyer des utilisateurs vers l'hôte suivant, afin de pouvoir arrêter les hôtes inactifs. Le jeton d'inscription doit être généré à la création du pool d'hôtes.

    Comment devez-vous compléter les commandes ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: bash
  template: |
    az desktopvirtualization hostpool create -g rg-avd -n hp-ops --location westeurope \
      --host-pool-type Pooled \
      --load-balancer-type [[lb]] \
      --max-session-limit 12 \
      --preferred-app-group-type Desktop \
      --registration-info expiration-time="2026-12-01T08:00:00.000Z" registration-token-operation=[[op]]

    az desktopvirtualization hostpool [[sub]] -g rg-avd -n hp-ops
  slots:
    - id: lb
      options:
        - { id: bf, text: BreadthFirst }
        - { id: df, text: DepthFirst }
        - { id: persistent, text: Persistent }
    - id: op
      options:
        - { id: update, text: Update }
        - { id: none, text: None }
        - { id: delete, text: Delete }
    - id: sub
      options:
        - { id: show, text: show }
        - { id: retrieve, text: retrieve-registration-token }
        - { id: list, text: list }
answer:
  values: { lb: df, op: update, sub: retrieve }
explanation:
  correct:
    en: |
      Depth-first load balancing sends new sessions to the available host with the most sessions until it reaches the max session limit, which keeps fewer hosts busy. In `--registration-info`, the token operation `Update` creates (or renews) the registration token with the given expiration time. `retrieve-registration-token` then returns the token to pass to the pipeline.
    fr: |
      L'équilibrage depth-first envoie les nouvelles sessions vers l'hôte disponible qui a le plus de sessions jusqu'à ce qu'il atteigne la limite maximale, ce qui occupe moins d'hôtes. Dans `--registration-info`, l'opération de jeton `Update` crée (ou renouvelle) le jeton d'inscription avec la date d'expiration indiquée. `retrieve-registration-token` renvoie ensuite le jeton à transmettre au pipeline.
  options:
    bf: { en: "Breadth-first spreads sessions across hosts instead of filling one host at a time.", fr: "Breadth-first répartit les sessions entre les hôtes au lieu de remplir un hôte à la fois." }
    persistent: { en: "Persistent is the load balancer type of personal host pools.", fr: "Persistent est le type d'équilibreur des pools d'hôtes personnels." }
    none: { en: "None leaves the registration info unchanged and generates no token.", fr: "None laisse les informations d'inscription inchangées et ne génère aucun jeton." }
    delete: { en: "Delete removes the registration token.", fr: "Delete supprime le jeton d'inscription." }
    show: { en: "show returns the host pool properties; the token itself is obtained with retrieve-registration-token.", fr: "show renvoie les propriétés du pool d'hôtes ; le jeton lui-même s'obtient avec retrieve-registration-token." }
    list: { en: "list returns the host pools of the resource group or subscription.", fr: "list renvoie les pools d'hôtes du groupe de ressources ou de l'abonnement." }
references:
  - title: az desktopvirtualization hostpool
    url: https://learn.microsoft.com/en-us/cli/azure/desktopvirtualization/hostpool
  - title: Configure host pool load balancing in Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/host-pool-load-balancing
