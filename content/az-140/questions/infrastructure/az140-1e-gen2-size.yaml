id: az140-1e-gen2-size
objective: "1.5.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You use a custom image template in Azure Virtual Desktop to build an image from a generation 2 Windows 11 Enterprise multi-session Marketplace image. The template distributes the image to an Azure Compute Gallery image definition whose Hyper-V generation is V2.

    You add session hosts to a host pool named **HP3** and select this image. The deployment validation fails because the selected virtual machine size can't use the image.

    What should you do?
  fr: |
    Vous utilisez un modèle d'image personnalisée d'Azure Virtual Desktop pour construire une image à partir d'une image Windows 11 Entreprise multisession de génération 2 de la Place de marché. Le modèle distribue l'image vers une définition d'image Azure Compute Gallery dont la génération Hyper-V est V2.

    Vous ajoutez des hôtes de session à un pool d'hôtes nommé **HP3** et sélectionnez cette image. La validation du déploiement échoue, car la taille de machine virtuelle sélectionnée ne peut pas utiliser l'image.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Select a virtual machine size that supports generation 2 VMs.", fr: "Sélectionner une taille de machine virtuelle qui prend en charge les machines virtuelles de génération 2." }
    - id: b
      text: { en: "Change the Hyper-V generation of the image definition to V1.", fr: "Changer la génération Hyper-V de la définition d'image en V1." }
    - id: c
      text: { en: "Add a replica of the image version in the region of HP3.", fr: "Ajouter un réplica de la version d'image dans la région de HP3." }
    - id: d
      text: { en: "Change the OS state of the image definition to Specialized.", fr: "Changer l'état du système d'exploitation de la définition d'image en Specialized." }
answer: { optionId: a }
explanation:
  correct:
    en: When you create session hosts from a custom image, you must select a VM size that matches the generation of the image. A generation 2 image needs a size that supports generation 2 VMs.
    fr: Quand vous créez des hôtes de session à partir d'une image personnalisée, vous devez sélectionner une taille de machine virtuelle qui correspond à la génération de l'image. Une image de génération 2 exige une taille qui prend en charge les machines virtuelles de génération 2.
  options:
    b: { en: "The Hyper-V generation of an image definition can't be updated, and it must match the generation of the source image.", fr: "La génération Hyper-V d'une définition d'image n'est pas modifiable, et elle doit correspondre à la génération de l'image source." }
    c: { en: "A missing regional replica is a different problem; the failure here comes from the size and generation mismatch.", fr: "L'absence de réplica régional est un autre problème ; l'échec vient ici de l'incompatibilité entre la taille et la génération." }
    d: { en: "The OS state isn't updatable, and session hosts need a generalized image to get unique names and join a directory.", fr: "L'état du système d'exploitation n'est pas modifiable, et les hôtes de session ont besoin d'une image généralisée pour obtenir des noms uniques et rejoindre un annuaire." }
references:
  - title: Use custom image templates to create custom images in Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/create-custom-image-templates
