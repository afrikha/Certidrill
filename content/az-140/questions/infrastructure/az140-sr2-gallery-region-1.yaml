id: az140-sr2-gallery-region-1
objective: "1.5.7"
type: series_yesno
series: az140-sr2-gallery-region
seriesOrder: 1
difficulty: 2
status: draft
stem:
  en: |
    You add North Europe to the replication of version 1.4.0 with four replicas.
  fr: |
    Vous ajoutez North Europe à la réplication de la version 1.4.0 avec quatre réplicas.
body:
  solution:
    en: |
      In galAvd, you open **win11-m365** > **1.4.0** > **Update replication** and add **North Europe** as a target region with a replica count of **4**. When the replication status of North Europe is completed, you deploy the 80 session hosts of Pool-NE from image version 1.4.0.
    fr: |
      Dans galAvd, vous ouvrez **win11-m365** > **1.4.0** > **Update replication** et ajoutez **North Europe** comme région cible avec un nombre de réplicas de **4**. Quand l'état de réplication de North Europe est terminé, vous déployez les 80 hôtes de session de Pool-NE à partir de la version d'image 1.4.0.
answer: { value: true }
explanation:
  correct:
    en: The target regions of an existing image version can be updated after creation, and once replication to a region completes, VMs can be deployed from that version in the region. Microsoft recommends one replica for every 20 VMs created concurrently and at least three replicas for production images; 80 / 20 = 4 replicas in North Europe meets both recommendations. No new image or gallery is needed, so administrative effort stays minimal.
    fr: "Les régions cibles d'une version d'image existante peuvent être modifiées après sa création et, une fois la réplication vers une région terminée, des machines virtuelles peuvent être déployées à partir de cette version dans cette région. Microsoft recommande un réplica pour 20 machines virtuelles créées simultanément et au moins trois réplicas pour les images de production : 80 / 20 = 4 réplicas dans North Europe respectent les deux recommandations. Aucune nouvelle image ni galerie n'est nécessaire : l'effort d'administration reste minimal."
references:
  - title: Store and share resources in Azure Compute Gallery
    url: https://learn.microsoft.com/en-us/azure/virtual-machines/azure-compute-gallery
