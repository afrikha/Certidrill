stem:
  en: You assign Microsoft 365 E3 licenses to the customer accounts.
  fr: Vous attribuez des licences Microsoft 365 E3 aux comptes des clients.
body:
  solution:
    en: |
      Proseware purchases Microsoft 365 E3 licenses and assigns one license to each customer user account in its Microsoft Entra tenant.
    fr: |
      Proseware achète des licences Microsoft 365 E3 et attribue une licence à chaque compte d'utilisateur client de son locataire Microsoft Entra.
answer: { value: false }
explanation:
  correct:
    en: |
      Microsoft 365 and Windows licenses grant Azure Virtual Desktop access rights for internal business purposes only, even when the accounts are in your own tenant. Selling access to an application to external customers is an external commercial purpose, which requires per-user access pricing.
    fr: |
      Les licences Microsoft 365 et Windows accordent des droits d'accès à Azure Virtual Desktop uniquement pour un usage professionnel interne, même lorsque les comptes se trouvent dans votre propre locataire. Vendre l'accès à une application à des clients externes est un usage commercial externe, qui exige la tarification de l'accès par utilisateur.
references:
  - title: Licensing Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/licensing
