id: az140-1d-life-rollout-plan
objective: "1.5.4"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    Tailspin Toys has two Azure Virtual Desktop pooled host pools that use standard management:

    | Host pool | Use | Image reference of the session hosts |
    | --- | --- | --- |
    | HP-Prod | Production | Image definition win11-multi, latest version |
    | HP-Test | Image testing | Explicit version number |

    Version 3.1.0 of win11-multi is in production. You publish version 3.2.0 with **Exclude from latest** set to Yes.

    You need to plan the lifecycle of version 3.2.0. Version 3.2.0 must be tested before any production session host uses it, and you must be able to return HP-Prod to 3.1.0 if a problem appears after the release.

    What should you include in the plan? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin Toys dispose de deux pools d'hôtes regroupés Azure Virtual Desktop qui utilisent la gestion standard :

    | Pool d'hôtes | Usage | Référence d'image des hôtes de session |
    | --- | --- | --- |
    | HP-Prod | Production | Définition d'image win11-multi, version la plus récente |
    | HP-Test | Test des images | Numéro de version explicite |

    La version 3.1.0 de win11-multi est en production. Vous publiez la version 3.2.0 avec **Exclude from latest** défini sur Yes.

    Vous devez planifier le cycle de vie de la version 3.2.0. La version 3.2.0 doit être testée avant qu'un hôte de session de production ne l'utilise, et vous devez pouvoir ramener HP-Prod à 3.1.0 si un problème apparaît après la mise en production.

    Que devez-vous inclure dans le plan ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Test: [[test]]

      Release: [[release]]

      Rollback: [[rollback]]
    fr: |
      Test : [[test]]

      Mise en production : [[release]]

      Retour arrière : [[rollback]]
  slots:
    - id: test
      options:
        - { id: hptest, text: { en: "Deploy session hosts in HP-Test that reference version 3.2.0", fr: "Déployer dans HP-Test des hôtes de session qui référencent la version 3.2.0" } }
        - { id: valenv, text: { en: "Set Validation environment to Yes on HP-Prod", fr: "Définir Validation environment sur Yes sur HP-Prod" } }
        - { id: sau, text: { en: "Enable scheduled agent updates on HP-Test", fr: "Activer les mises à jour planifiées de l'agent sur HP-Test" } }
    - id: release
      options:
        - { id: delete, text: { en: "Delete version 3.1.0 so that latest resolves to 3.2.0", fr: "Supprimer la version 3.1.0 pour que la plus récente désigne 3.2.0" } }
        - { id: clear, text: { en: "Set Exclude from latest to No on 3.2.0, then replace the HP-Prod session hosts", fr: "Définir Exclude from latest sur No sur 3.2.0, puis remplacer les hôtes de session de HP-Prod" } }
        - { id: eol, text: { en: "Set an end-of-life date on 3.1.0, then wait for the session hosts to update", fr: "Définir une date de fin de vie sur 3.1.0, puis attendre la mise à jour des hôtes de session" } }
    - id: rollback
      options:
        - { id: snapshot, text: { en: "Restore the OS disks of the session hosts from the build VM snapshot", fr: "Restaurer les disques du système d'exploitation des hôtes de session à partir de l'instantané de la machine virtuelle de build" } }
        - { id: exclude, text: { en: "Set Exclude from latest to Yes on 3.2.0 and wait for the session hosts to revert", fr: "Définir Exclude from latest sur Yes sur 3.2.0 et attendre que les hôtes de session reviennent en arrière" } }
        - { id: redeploy, text: { en: "Replace the HP-Prod session hosts with hosts deployed from version 3.1.0", fr: "Remplacer les hôtes de session de HP-Prod par des hôtes déployés à partir de la version 3.1.0" } }
answer:
  values: { test: hptest, release: clear, rollback: redeploy }
explanation:
  correct:
    en: |
      An excluded version can still be deployed by its explicit version number, so HP-Test validates 3.2.0 while HP-Prod keeps resolving latest to 3.1.0. To release, you clear the exclusion and replace the production session hosts (new hosts from the new version, old hosts drained and removed), because existing hosts never change image by themselves. Keeping 3.1.0 in the gallery lets you roll back by redeploying session hosts from it.
    fr: |
      Une version exclue peut toujours être déployée par son numéro de version explicite : HP-Test valide 3.2.0 pendant que la plus récente reste 3.1.0 pour HP-Prod. Pour la mise en production, vous retirez l'exclusion et remplacez les hôtes de session de production (nouveaux hôtes à partir de la nouvelle version, anciens hôtes drainés puis supprimés), car les hôtes existants ne changent jamais d'image d'eux-mêmes. Conserver 3.1.0 dans la galerie permet de revenir en arrière en redéployant des hôtes de session à partir d'elle.
  options:
    test:
      en: A validation environment receives Azure Virtual Desktop service updates early, not image versions, and it must not be a production pool; scheduled agent updates only control agent update windows.
      fr: Un environnement de validation reçoit en avance les mises à jour du service Azure Virtual Desktop, pas des versions d'image, et il ne doit pas s'agir d'un pool de production ; les mises à jour planifiées de l'agent ne contrôlent que les fenêtres de mise à jour de l'agent.
    release:
      en: Deleting 3.1.0 removes the rollback target and latest would still skip the excluded 3.2.0; an end-of-life date is informational and doesn't update hosts.
      fr: Supprimer 3.1.0 retire la cible de retour arrière et la plus récente ignorerait toujours 3.2.0, exclue ; une date de fin de vie est informative et ne met à jour aucun hôte.
    rollback:
      en: Changing a gallery flag doesn't change the image of existing session hosts, and a build VM snapshot isn't a session host disk.
      fr: Modifier un indicateur de la galerie ne change pas l'image des hôtes de session existants, et l'instantané d'une machine virtuelle de build n'est pas un disque d'hôte de session.
references:
  - title: Store and share images in an Azure Compute Gallery
    url: https://learn.microsoft.com/en-us/azure/virtual-machines/shared-image-galleries
  - title: Configure a host pool as a validation environment
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/configure-validation-environment
