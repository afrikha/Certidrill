id: az140-1b-share-default-perm
objective: "1.2.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have an Azure Virtual Desktop host pool whose session hosts are joined to the contoso.com AD DS domain. FSLogix profile containers are stored in an Azure file share named **profiles** in a storage account joined to contoso.com. Several user accounts of contoso.com aren't synced to Microsoft Entra ID.

    You need to grant every identity that authenticates to the share read, write and delete access at the share level, including identities that aren't synced. The solution must follow the principle of least privilege and minimize administrative effort.

    What should you do?
  fr: |
    Vous disposez d'un pool d'hôtes Azure Virtual Desktop dont les hôtes de session sont joints au domaine AD DS contoso.com. Les conteneurs de profils FSLogix sont stockés dans un partage de fichiers Azure nommé **profiles**, dans un compte de stockage joint à contoso.com. Plusieurs comptes d'utilisateur de contoso.com ne sont pas synchronisés avec Microsoft Entra ID.

    Vous devez accorder à toute identité qui s'authentifie auprès du partage un accès en lecture, écriture et suppression au niveau du partage, y compris aux identités non synchronisées. La solution doit respecter le principe du moindre privilège et réduire au minimum l'effort d'administration.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Set the default share-level permission to Storage File Data SMB Share Elevated Contributor.", fr: "Définir l'autorisation par défaut au niveau du partage sur Storage File Data SMB Share Elevated Contributor." }
    - id: b
      text: { en: "Assign the Contributor role on the storage account to a group that contains the users.", fr: "Attribuer le rôle Contributor sur le compte de stockage à un groupe qui contient les utilisateurs." }
    - id: c
      text: { en: "Set the default share-level permission to Storage File Data SMB Share Contributor.", fr: "Définir l'autorisation par défaut au niveau du partage sur Storage File Data SMB Share Contributor." }
    - id: d
      text: { en: "Assign the Storage File Data SMB Share Reader role on the share to a group that contains the users.", fr: "Attribuer le rôle Storage File Data SMB Share Reader sur le partage à un groupe qui contient les utilisateurs." }
answer: { optionId: c }
explanation:
  correct:
    en: |
      The default share-level permission applies to all authenticated identities, so the identities don't need to be synced to Microsoft Entra ID and you don't manage individual role assignments. Storage File Data SMB Share Contributor grants read, write and delete, which is the level FSLogix recommends for all users of the profile share.
    fr: |
      L'autorisation par défaut au niveau du partage s'applique à toutes les identités authentifiées : les identités n'ont pas besoin d'être synchronisées avec Microsoft Entra ID et vous ne gérez pas d'attributions de rôles individuelles. Storage File Data SMB Share Contributor accorde la lecture, l'écriture et la suppression, le niveau que FSLogix recommande pour tous les utilisateurs du partage de profils.
  options:
    a: { en: "Elevated Contributor also lets users modify ACLs, which is more than required.", fr: "Elevated Contributor permet aussi de modifier les listes ACL, ce qui dépasse le besoin." }
    b: { en: "Contributor is a management-plane role; it doesn't grant SMB access to the share's data.", fr: "Contributor est un rôle du plan de gestion ; il n'accorde pas d'accès SMB aux données du partage." }
    d: { en: "Reader gives read access only, and role assignments to specific identities require them to be synced to Microsoft Entra ID.", fr: "Reader ne donne qu'un accès en lecture, et les attributions de rôles à des identités précises exigent leur synchronisation avec Microsoft Entra ID." }
references:
  - title: Assign share-level permissions for Azure file shares
    url: https://learn.microsoft.com/en-us/azure/storage/files/storage-files-identity-assign-share-level-permissions
  - title: Configure SMB Storage Permissions
    url: https://learn.microsoft.com/en-us/fslogix/how-to-configure-storage-permissions
