id: az140-1b-anf-ad-entra-ds
objective: "1.2.5"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    Adatum Corporation has no on-premises AD DS. Its Azure Virtual Desktop session hosts are joined to a Microsoft Entra Domain Services managed domain named **aadds.adatum.com**. You plan to store FSLogix profile containers on Azure NetApp Files.

    You are creating the Active Directory connection of a NetApp account named **anf-adatum** by using a member of the AAD DC Administrators group.

    How should you configure the connection? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum Corporation n'a pas d'AD DS local. Ses hôtes de session Azure Virtual Desktop sont joints à un domaine managé Microsoft Entra Domain Services nommé **aadds.adatum.com**. Vous prévoyez de stocker les conteneurs de profils FSLogix sur Azure NetApp Files.

    Vous créez la connexion Active Directory d'un compte NetApp nommé **anf-adatum** à l'aide d'un membre du groupe AAD DC Administrators.

    Comment devez-vous configurer la connexion ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Primary DNS: [[dns]]

      Organizational unit path: [[ou]]

      AD Site Name: [[site]]
    fr: |
      DNS principal : [[dns]]

      Chemin de l'unité d'organisation : [[ou]]

      Nom du site AD : [[site]]
  slots:
    - id: dns
      options:
        - { id: dc, text: { en: "An IP address of the managed domain's domain controllers", fr: "Une adresse IP des contrôleurs de domaine du domaine managé" } }
        - { id: azure, text: "168.63.129.16" }
        - { id: gw, text: { en: "The private IP address of the virtual network gateway", fr: "L'adresse IP privée de la passerelle de réseau virtuel" } }
    - id: ou
      options:
        - { id: aaddc, text: "OU=AADDC Computers" }
        - { id: cn, text: "CN=Computers" }
        - { id: dcs, text: "OU=Domain Controllers" }
        - { id: users, text: "CN=Users" }
    - id: site
      options:
        - { id: default, text: Default-First-Site-Name }
        - { id: region, text: { en: "The name of the Azure region of the volumes", fr: "Le nom de la région Azure des volumes" } }
        - { id: vnet, text: { en: "The name of the virtual network of the volumes", fr: "Le nom du réseau virtuel des volumes" } }
answer:
  values: { dns: dc, ou: aaddc, site: default }
explanation:
  correct:
    en: |
      With Microsoft Entra Domain Services, the Primary and Secondary DNS of the connection are the IP addresses of the managed domain's domain controllers. Computer accounts must be created in OU=AADDC Computers; the default CN=Computers applies to AD DS. The AD site name is used for domain controller discovery, and its default, Default-First-Site-Name, applies to Microsoft Entra Domain Services.
    fr: |
      Avec Microsoft Entra Domain Services, les DNS principal et secondaire de la connexion sont les adresses IP des contrôleurs de domaine du domaine managé. Les comptes d'ordinateur doivent être créés dans OU=AADDC Computers ; la valeur par défaut CN=Computers s'applique à AD DS. Le nom du site AD sert à la découverte des contrôleurs de domaine, et sa valeur par défaut, Default-First-Site-Name, s'applique à Microsoft Entra Domain Services.
  options:
    azure: { en: "Azure-provided DNS doesn't resolve the managed domain's service records needed for domain join, Kerberos and LDAP.", fr: "Le DNS fourni par Azure ne résout pas les enregistrements de service du domaine managé nécessaires à la jonction au domaine, à Kerberos et à LDAP." }
    gw: { en: "A virtual network gateway isn't a DNS server.", fr: "Une passerelle de réseau virtuel n'est pas un serveur DNS." }
    cn: { en: "CN=Computers is the default for AD DS; Microsoft Entra Domain Services requires OU=AADDC Computers.", fr: "CN=Computers est la valeur par défaut pour AD DS ; Microsoft Entra Domain Services exige OU=AADDC Computers." }
    dcs: { en: "The Domain Controllers OU is reserved for domain controllers.", fr: "L'unité d'organisation Domain Controllers est réservée aux contrôleurs de domaine." }
    users: { en: "CN=Users is a container for user accounts, not the OU for the SMB server's computer account in a managed domain.", fr: "CN=Users est un conteneur de comptes d'utilisateur, pas l'unité d'organisation du compte d'ordinateur du serveur SMB dans un domaine managé." }
references:
  - title: Create and manage Active Directory connections for Azure NetApp Files
    url: https://learn.microsoft.com/en-us/azure/azure-netapp-files/create-active-directory-connections
