id: az140-1b-sa-identity-map
objective: "1.2.3"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam, Inc. has four Azure Virtual Desktop host pools. Each host pool will store FSLogix profile containers in its own Azure Files storage account.

    | Host pool | Session hosts | Users |
    | --- | --- | --- |
    | HP-A | Joined to the fabrikam.com AD DS domain only | Synced from AD DS to Microsoft Entra ID |
    | HP-B | Joined to a Microsoft Entra Domain Services managed domain | Synced to Microsoft Entra ID |
    | HP-C | Microsoft Entra joined, no line of sight to a domain controller | Synced from AD DS to Microsoft Entra ID |
    | HP-D | Microsoft Entra joined | Cloud-only Microsoft Entra users |

    You need to choose the identity-based access source to enable on each storage account.

    Which source should you enable for each host pool? To answer, drag the appropriate sources to the correct host pools. Each source may be used once, more than once, or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam, Inc. dispose de quatre pools d'hôtes Azure Virtual Desktop. Chaque pool d'hôtes stockera ses conteneurs de profils FSLogix dans son propre compte de stockage Azure Files.

    | Pool d'hôtes | Hôtes de session | Utilisateurs |
    | --- | --- | --- |
    | HP-A | Joints uniquement au domaine AD DS fabrikam.com | Synchronisés d'AD DS vers Microsoft Entra ID |
    | HP-B | Joints à un domaine managé Microsoft Entra Domain Services | Synchronisés vers Microsoft Entra ID |
    | HP-C | Joints à Microsoft Entra, sans visibilité directe sur un contrôleur de domaine | Synchronisés d'AD DS vers Microsoft Entra ID |
    | HP-D | Joints à Microsoft Entra | Utilisateurs Microsoft Entra cloud uniquement |

    Vous devez choisir la source d'accès basé sur l'identité à activer sur chaque compte de stockage.

    Quelle source devez-vous activer pour chaque pool d'hôtes ? Pour répondre, faites glisser les sources appropriées vers les pools d'hôtes correspondants. Chaque source peut être utilisée une fois, plusieurs fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: true
  items:
    - { id: adds, text: AD DS }
    - { id: aadds, text: Microsoft Entra Domain Services }
    - { id: kerb, text: Microsoft Entra Kerberos }
    - { id: key, text: { en: "Storage account key", fr: "Clé du compte de stockage" } }
  targets:
    - { id: a, text: HP-A }
    - { id: b, text: HP-B }
    - { id: c, text: HP-C }
    - { id: d, text: HP-D }
answer:
  mapping: { a: adds, b: aadds, c: kerb, d: kerb }
explanation:
  correct:
    en: |
      Session hosts joined only to AD DS authenticate to a storage account joined to that domain. Hosts joined to a Microsoft Entra Domain Services domain use the storage account's Microsoft Entra Domain Services authentication. Microsoft Entra Kerberos requires Microsoft Entra joined or hybrid joined clients and doesn't need line of sight to a domain controller; it supports hybrid users and, in the Azure public cloud, cloud-only users.
    fr: |
      Les hôtes de session joints uniquement à AD DS s'authentifient auprès d'un compte de stockage joint à ce domaine. Les hôtes joints à un domaine Microsoft Entra Domain Services utilisent l'authentification Microsoft Entra Domain Services du compte de stockage. Microsoft Entra Kerberos exige des clients joints à Microsoft Entra ou joints hybrides et n'a pas besoin de visibilité directe sur un contrôleur de domaine ; il prend en charge les utilisateurs hybrides et, dans le cloud public Azure, les utilisateurs cloud uniquement.
  options:
    key: { en: "The storage account key gives administrator-level access to the whole share; it isn't an identity-based access source for users' profiles.", fr: "La clé du compte de stockage donne un accès de niveau administrateur à tout le partage ; ce n'est pas une source d'accès basé sur l'identité pour les profils des utilisateurs." }
references:
  - title: Overview of Azure Files identity-based authentication for SMB access
    url: https://learn.microsoft.com/en-us/azure/storage/files/storage-files-active-directory-overview
  - title: Enable Microsoft Entra Kerberos authentication for hybrid and cloud-only identities on Azure Files
    url: https://learn.microsoft.com/en-us/azure/storage/files/storage-files-identity-auth-hybrid-identities-enable
