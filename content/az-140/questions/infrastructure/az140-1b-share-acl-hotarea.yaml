id: az140-1b-share-acl-hotarea
objective: "1.2.4"
type: hotarea
difficulty: 3
status: draft
stem:
  en: |
    You have an Azure file share named **profiles** that stores FSLogix profile containers for an Azure Virtual Desktop pooled host pool. Inheritance is disabled on the root of the share, and the root has the NTFS permissions shown in the following table.

    A security review reports that a user can open the profile folder of another user.

    Answer each prompt by selecting the appropriate permission entry.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un partage de fichiers Azure nommé **profiles** qui stocke les conteneurs de profils FSLogix d'un pool d'hôtes regroupé Azure Virtual Desktop. L'héritage est désactivé à la racine du partage, et la racine possède les autorisations NTFS présentées dans le tableau suivant.

    Une revue de sécurité signale qu'un utilisateur peut ouvrir le dossier de profil d'un autre utilisateur.

    Répondez à chaque consigne en sélectionnant l'entrée d'autorisation appropriée.

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
    - id: p1
      text: { en: "The entry you must change to resolve the issue", fr: "L'entrée que vous devez modifier pour résoudre le problème" }
    - id: p2
      text: { en: "The entry that gives each user Modify rights on the profile folder that the user creates", fr: "L'entrée qui donne à chaque utilisateur le droit Modification sur le dossier de profil qu'il crée" }
  grid:
    header: [{ en: "Principal", fr: "Principal" }, { en: "Access", fr: "Accès" }, { en: "Applies to", fr: "S'applique à" }]
    rows:
      - [{ text: "NT AUTHORITY\\SYSTEM", area: sys }, { text: { en: "Full control", fr: "Contrôle total" } }, { text: { en: "This folder, subfolders and files", fr: "Ce dossier, les sous-dossiers et les fichiers" } }]
      - [{ text: "CREATOR OWNER", area: co }, { text: { en: "Modify", fr: "Modification" } }, { text: { en: "Subfolders and files only", fr: "Les sous-dossiers et les fichiers seulement" } }]
      - [{ text: "CONTOSO\\AVD-Admins", area: adm }, { text: { en: "Full control", fr: "Contrôle total" } }, { text: { en: "This folder, subfolders and files", fr: "Ce dossier, les sous-dossiers et les fichiers" } }]
      - [{ text: "CONTOSO\\AVD-Users", area: usr }, { text: { en: "Modify", fr: "Modification" } }, { text: { en: "This folder, subfolders and files", fr: "Ce dossier, les sous-dossiers et les fichiers" } }]
answer:
  values: { p1: usr, p2: co }
explanation:
  correct:
    en: |
      The users' group must have Modify on this folder only, so that its members can create their profile folder at the root without inheriting rights on the folders of other users. Here the entry applies to subfolders and files too, so every member can modify every profile. CREATOR OWNER with Modify on subfolders and files only gives each user rights on the folder they create; the administrators' entry is the recommended full control for the admin group.
    fr: |
      Le groupe des utilisateurs doit disposer de Modification sur ce dossier seulement, pour que ses membres puissent créer leur dossier de profil à la racine sans hériter de droits sur les dossiers des autres utilisateurs. Ici, l'entrée s'applique aussi aux sous-dossiers et aux fichiers : chaque membre peut donc modifier tous les profils. CREATOR OWNER avec Modification sur les sous-dossiers et fichiers seulement donne à chaque utilisateur des droits sur le dossier qu'il crée ; l'entrée des administrateurs correspond au contrôle total recommandé pour le groupe d'administration.
references:
  - title: Configure SMB Storage Permissions
    url: https://learn.microsoft.com/en-us/fslogix/how-to-configure-storage-permissions
