id: az140-1d-mod-aib-rerun
objective: "1.5.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have an Azure VM Image Builder image template named **tpl-m365**. Its source is the Windows 11 Enterprise multi-session + Microsoft 365 Apps image from Azure Marketplace with the version `latest`. It contains a `WindowsUpdate` customizer and distributes to an Azure Compute Gallery image definition.

    Every month, you need a new image version that contains the latest Marketplace build and the pending Windows updates. No other change is needed. The solution must minimize administrative effort.

    What should you do each month?
  fr: |
    Vous disposez d'un modèle d'image Azure VM Image Builder nommé **tpl-m365**. Sa source est l'image Windows 11 Entreprise multisession + Microsoft 365 Apps de la Place de marché Azure avec la version `latest`. Il contient un personnalisateur `WindowsUpdate` et distribue vers une définition d'image Azure Compute Gallery.

    Chaque mois, vous avez besoin d'une nouvelle version d'image qui contient la dernière build de la Place de marché et les mises à jour Windows en attente. Aucune autre modification n'est nécessaire. La solution doit réduire au minimum l'effort d'administration.

    Que devez-vous faire chaque mois ?
body:
  options:
    - { id: a, text: { en: "Run tpl-m365 again.", fr: "Exécuter de nouveau tpl-m365." } }
    - { id: b, text: { en: "Create a new image template that targets the same image definition.", fr: "Créer un nouveau modèle d'image qui cible la même définition d'image." } }
    - { id: c, text: { en: "Deploy a VM from the latest version, install updates, then capture it.", fr: "Déployer une machine virtuelle à partir de la dernière version, installer les mises à jour, puis la capturer." } }
    - { id: d, text: { en: "Update the latest image version in place with the new updates.", fr: "Mettre à jour sur place la dernière version d'image avec les nouvelles mises à jour." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Each run of an image template builds from the source again: with a `PlatformImage` source at version `latest`, the run picks up the newest Marketplace build, the `WindowsUpdate` customizer installs the pending updates, and the distribution creates a new image version. Nothing in the template needs to change.
    fr: |
      Chaque exécution d'un modèle d'image repart de la source : avec une source `PlatformImage` en version `latest`, l'exécution récupère la build la plus récente de la Place de marché, le personnalisateur `WindowsUpdate` installe les mises à jour en attente et la distribution crée une nouvelle version d'image. Rien ne doit changer dans le modèle.
  options:
    b:
      en: The existing template already does the work; creating a new one each month adds effort for the same result.
      fr: Le modèle existant fait déjà le travail ; en créer un nouveau chaque mois ajoute de l'effort pour le même résultat.
    c:
      en: A manual rebuild is more work, and Microsoft advises against building a new image from an existing custom image.
      fr: Une reconstruction manuelle demande plus de travail, et Microsoft déconseille de construire une nouvelle image à partir d'une image personnalisée existante.
    d:
      en: The content of an image version can't be changed; each update produces a new version.
      fr: Le contenu d'une version d'image ne peut pas être modifié ; chaque mise à jour produit une nouvelle version.
references:
  - title: Azure VM Image Builder overview
    url: https://learn.microsoft.com/en-us/azure/virtual-machines/image-builder-overview
  - title: Create an Azure Image Builder Bicep or ARM template JSON template
    url: https://learn.microsoft.com/en-us/azure/virtual-machines/linux/image-builder-json
