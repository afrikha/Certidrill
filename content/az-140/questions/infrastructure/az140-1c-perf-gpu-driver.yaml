id: az140-1c-perf-gpu-driver
objective: "1.3.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You deploy Azure Virtual Desktop session hosts of the NVadsA10 v5-series from a custom image. An administrator installed the NVIDIA CUDA toolkit and driver downloaded from the NVIDIA website. The GPU rendering and encoding policies are applied, and the hosts were restarted.

    Task Manager on the session hosts shows no GPU utilization while users run graphics applications.

    You need to ensure that the session hosts use the GPU for Azure Virtual Desktop sessions.

    What should you do?
  fr: |
    Vous déployez des hôtes de session Azure Virtual Desktop de la série NVadsA10 v5 à partir d'une image personnalisée. Un administrateur a installé le kit et le pilote NVIDIA CUDA téléchargés sur le site de NVIDIA. Les stratégies de rendu et d'encodage GPU sont appliquées et les hôtes ont été redémarrés.

    Le Gestionnaire des tâches des hôtes de session n'indique aucune utilisation du GPU quand les utilisateurs exécutent des applications graphiques.

    Vous devez vous assurer que les hôtes de session utilisent le GPU pour les sessions Azure Virtual Desktop.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Install the GRID driver by adding the NVIDIA GPU Driver Extension", fr: "Installer le pilote GRID en ajoutant l'extension NVIDIA GPU Driver" } }
    - { id: b, text: { en: "Install the AMD GPU driver distributed by Azure", fr: "Installer le pilote GPU AMD distribué par Azure" } }
    - { id: c, text: { en: "Resize the session hosts to the NCv3-series", fr: "Redimensionner les hôtes de session vers la série NCv3" } }
    - { id: d, text: { en: "Install the multimedia redirection host component", fr: "Installer le composant hôte de la redirection multimédia" } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Azure Virtual Desktop GPU acceleration on NVIDIA sizes requires the GRID driver; CUDA drivers don't accelerate these sizes for graphics. Only drivers distributed by Azure are supported, and the NVIDIA GPU Driver Extension installs the GRID driver for you.
    fr: |
      L'accélération GPU d'Azure Virtual Desktop sur les tailles NVIDIA exige le pilote GRID ; les pilotes CUDA n'accélèrent pas le graphisme de ces tailles. Seuls les pilotes distribués par Azure sont pris en charge, et l'extension NVIDIA GPU Driver installe le pilote GRID pour vous.
  options:
    b: { en: "NVadsA10 v5 sizes have NVIDIA GPUs; the AMD driver is for AMD-based sizes.", fr: "Les tailles NVadsA10 v5 ont des GPU NVIDIA ; le pilote AMD est destiné aux tailles à base d'AMD." }
    c: { en: "NC-series sizes are built for compute workloads and don't accelerate the Windows desktop.", fr: "Les tailles de la série NC sont conçues pour le calcul et n'accélèrent pas le bureau Windows." }
    d: { en: "Multimedia redirection offloads browser video to the client; it doesn't make the host use its GPU.", fr: "La redirection multimédia déporte la vidéo du navigateur vers le client ; elle ne fait pas utiliser son GPU à l'hôte." }
references:
  - title: Enable GPU acceleration for Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/graphics-enable-gpu-acceleration
