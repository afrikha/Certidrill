id: az140-1a-mon-network-data
objective: "1.1.5"
type: ordering
difficulty: 1
status: draft
stem:
  en: |
    Northwind Traders has an Azure Virtual Desktop host pool named **HP1**. No diagnostic setting is configured for HP1, and the subscription contains no Log Analytics workspace.

    You need to query the round-trip time and available bandwidth of the RDP connections to HP1.

    Which three actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Northwind Traders dispose d'un pool d'hôtes Azure Virtual Desktop nommé **HP1**. Aucun paramètre de diagnostic n'est configuré pour HP1, et l'abonnement ne contient aucun espace de travail Log Analytics.

    Vous devez interroger la durée aller-retour et la bande passante disponible des connexions RDP à HP1.

    Quelles sont les trois actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - { id: law, text: { en: "Create a Log Analytics workspace.", fr: "Créer un espace de travail Log Analytics." } }
    - { id: diag, text: { en: "On HP1, add a diagnostic setting that sends the logs to the workspace.", fr: "Sur HP1, ajouter un paramètre de diagnostic qui envoie les journaux vers l'espace de travail." } }
    - { id: query, text: { en: "Run a query on the WVDConnectionNetworkData table.", fr: "Exécuter une requête sur la table WVDConnectionNetworkData." } }
    - { id: dcr, text: { en: "Create a data collection rule that collects Windows performance counters from the session hosts.", fr: "Créer une règle de collecte de données qui collecte les compteurs de performances Windows des hôtes de session." } }
    - { id: nw, text: { en: "Create a connection monitor in Network Watcher for the session hosts.", fr: "Créer un moniteur de connexion dans Network Watcher pour les hôtes de session." } }
    - { id: queryconn, text: { en: "Run a query on the AzureDiagnostics table.", fr: "Exécuter une requête sur la table AzureDiagnostics." } }
answer:
  sequence: [ law, diag, query ]
explanation:
  correct:
    en: |
      The diagnostic setting of the host pool needs a destination, so you create the Log Analytics workspace first. Then you add a diagnostic setting on HP1 that includes the network data logs (for example with **allLogs**) and sends them to the workspace. Once users have connected, you query WVDConnectionNetworkData, whose data can take up to 15 minutes to appear.
    fr: |
      Le paramètre de diagnostic du pool d'hôtes a besoin d'une destination : vous créez donc d'abord l'espace de travail Log Analytics. Vous ajoutez ensuite sur HP1 un paramètre de diagnostic qui inclut les journaux de données réseau (par exemple avec **allLogs**) et les envoie vers l'espace de travail. Une fois que des utilisateurs se sont connectés, vous interrogez WVDConnectionNetworkData, dont les données peuvent mettre jusqu'à 15 minutes à apparaître.
  options:
    dcr: { en: "Performance counters describe the session host, not the RDP round-trip time and bandwidth estimates.", fr: "Les compteurs de performances décrivent l'hôte de session, pas les estimations de durée aller-retour et de bande passante RDP." }
    nw: { en: "Connection monitor measures Azure network paths, not the RDP connections of users.", fr: "Le moniteur de connexion mesure des chemins réseau Azure, pas les connexions RDP des utilisateurs." }
    queryconn: { en: "Azure Virtual Desktop logs go to their own WVD* tables in Log Analytics.", fr: "Les journaux Azure Virtual Desktop sont envoyés dans leurs propres tables WVD* de Log Analytics." }
references:
  - title: Collect and query connection quality data
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/connection-quality-monitoring
