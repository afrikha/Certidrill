id: az140-1b-org-rg-compute
objective: "1.3.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam, Inc. has an Azure Virtual Desktop pooled host pool named **HP-Office**. Every month, a pipeline replaces all the session hosts of HP-Office with new VMs built from the latest image.

    You need to recommend a resource organization that lets the pipeline delete all the old session host VMs, disks and network interfaces in a single operation. The operation must not affect the host pool, its application groups, workspace and scaling plan, or the FSLogix storage account.

    What should you recommend?
  fr: |
    Fabrikam, Inc. dispose d'un pool d'hôtes regroupé Azure Virtual Desktop nommé **HP-Office**. Chaque mois, un pipeline remplace tous les hôtes de session de HP-Office par de nouvelles machines virtuelles créées à partir de la dernière image.

    Vous devez recommander une organisation des ressources qui permet au pipeline de supprimer en une seule opération toutes les anciennes machines virtuelles hôtes de session, leurs disques et leurs interfaces réseau. L'opération ne doit affecter ni le pool d'hôtes, ni ses groupes d'applications, son espace de travail et son plan de mise à l'échelle, ni le compte de stockage FSLogix.

    Que devez-vous recommander ?
body:
  options:
    - id: a
      text: { en: "Place the session host VMs and their disks and network interfaces in a dedicated resource group.", fr: "Placer les machines virtuelles hôtes de session, leurs disques et leurs interfaces réseau dans un groupe de ressources dédié." }
    - id: b
      text: { en: "Place the session host VMs in the host pool's resource group and tag them with Role=SessionHost.", fr: "Placer les machines virtuelles hôtes de session dans le groupe de ressources du pool d'hôtes et leur attribuer l'étiquette Role=SessionHost." }
    - id: c
      text: { en: "Apply a CanNotDelete lock to the resource group that contains the host pool and the session hosts.", fr: "Appliquer un verrou Suppression au groupe de ressources qui contient le pool d'hôtes et les hôtes de session." }
    - id: d
      text: { en: "Place the session host VMs in the FSLogix storage account's resource group.", fr: "Placer les machines virtuelles hôtes de session dans le groupe de ressources du compte de stockage FSLogix." }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Resources that share a lifecycle belong in the same resource group. Session host VMs are rebuilt at every image update, while the host pool, application groups, workspace and scaling plan are long-lived service objects, and the storage holds user data. A dedicated compute resource group can be deleted and recreated in one operation without touching the other groups; session hosts don't have to be in the host pool's resource group.
    fr: |
      Les ressources qui partagent un même cycle de vie doivent se trouver dans le même groupe de ressources. Les machines virtuelles hôtes de session sont reconstruites à chaque mise à jour de l'image, alors que le pool d'hôtes, les groupes d'applications, l'espace de travail et le plan de mise à l'échelle sont des objets de service durables, et que le stockage contient les données des utilisateurs. Un groupe de ressources dédié au calcul peut être supprimé et recréé en une seule opération sans toucher aux autres groupes ; les hôtes de session n'ont pas besoin d'être dans le groupe de ressources du pool d'hôtes.
  options:
    b: { en: "Deleting the resource group would also delete the host pool objects; tags don't give a single delete operation for a subset of resources.", fr: "Supprimer le groupe de ressources supprimerait aussi les objets du pool d'hôtes ; les étiquettes ne permettent pas de supprimer un sous-ensemble de ressources en une seule opération." }
    c: { en: "A CanNotDelete lock would also block the deletion of the old session hosts.", fr: "Un verrou Suppression bloquerait aussi la suppression des anciens hôtes de session." }
    d: { en: "Deleting that resource group would delete the storage account and the users' profiles.", fr: "Supprimer ce groupe de ressources supprimerait le compte de stockage et les profils des utilisateurs." }
references:
  - title: What is Azure Resource Manager?
    url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/management/overview
