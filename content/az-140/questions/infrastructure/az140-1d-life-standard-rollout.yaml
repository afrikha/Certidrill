id: az140-1d-life-standard-rollout
objective: "1.5.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have an Azure Virtual Desktop pooled host pool named **HP-Std** that uses standard management (no session host configuration). HP-Std contains 10 session hosts deployed from version 1.5.0 of an Azure Compute Gallery image.

    Version 1.6.0 of the image has been tested and approved. You need to move HP-Std to version 1.6.0. Signed-in users must be able to finish their work before their session host is removed.

    What should you do?
  fr: |
    Vous disposez d'un pool d'hôtes regroupé Azure Virtual Desktop nommé **HP-Std** qui utilise la gestion standard (sans configuration d'hôte de session). HP-Std contient 10 hôtes de session déployés à partir de la version 1.5.0 d'une image Azure Compute Gallery.

    La version 1.6.0 de l'image a été testée et approuvée. Vous devez faire passer HP-Std à la version 1.6.0. Les utilisateurs connectés doivent pouvoir terminer leur travail avant que leur hôte de session ne soit retiré.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Schedule a session host update for HP-Std that uses version 1.6.0.", fr: "Planifier pour HP-Std une mise à jour des hôtes de session qui utilise la version 1.6.0." } }
    - { id: b, text: { en: "Run az vm redeploy on each session host after you publish version 1.6.0.", fr: "Exécuter az vm redeploy sur chaque hôte de session après avoir publié la version 1.6.0." } }
    - { id: c, text: { en: "Add hosts from 1.6.0, drain the old hosts, and remove them when their users sign out.", fr: "Ajouter des hôtes à partir de 1.6.0, drainer les anciens hôtes et les retirer quand leurs utilisateurs se déconnectent." } }
    - { id: d, text: { en: "Set Exclude from latest on version 1.5.0 so that the session hosts move to 1.6.0.", fr: "Activer Exclude from latest sur la version 1.5.0 pour que les hôtes de session passent à 1.6.0." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      An image is never applied to running session hosts: on a standard host pool, you deploy new session hosts from the new version, turn on drain mode on the old hosts so that they accept no new sessions, wait for users to sign out, then remove the old hosts from the host pool and delete their virtual machines.
    fr: |
      Une image ne s'applique jamais à des hôtes de session en service : sur un pool d'hôtes standard, vous déployez de nouveaux hôtes de session à partir de la nouvelle version, activez le mode drainage sur les anciens hôtes pour qu'ils n'acceptent plus de nouvelles sessions, attendez la déconnexion des utilisateurs, puis retirez les anciens hôtes du pool d'hôtes et supprimez leurs machines virtuelles.
  options:
    a:
      en: Session host update requires a host pool that uses the session host configuration management approach.
      fr: La mise à jour des hôtes de session exige un pool d'hôtes qui utilise l'approche de gestion par configuration d'hôte de session.
    b:
      en: az vm redeploy moves a VM to another Azure host with the same disks; it doesn't change its image.
      fr: az vm redeploy déplace une machine virtuelle vers un autre hôte Azure avec les mêmes disques ; il ne change pas son image.
    d:
      en: Exclude from latest only affects new deployments; existing session hosts keep the image they were created from.
      fr: Exclude from latest n'affecte que les nouveaux déploiements ; les hôtes de session existants conservent l'image à partir de laquelle ils ont été créés.
references:
  - title: Drain session hosts for maintenance in Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/drain-mode
  - title: Session host update for Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/session-host-update
