id: az140-1a-pl-setup-order
objective: "1.1.4"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    Proseware has an Azure Virtual Desktop host pool named **HP1** in a subscription named **Sub1**. Users connect to HP1 from the corporate network over ExpressRoute. Private Link has never been used with Azure Virtual Desktop in Sub1.

    You need to ensure that connections to HP1 are allowed only when both the client and the session host use private routes. The solution must minimize the disruption for users.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Proseware dispose d'un pool d'hôtes Azure Virtual Desktop nommé **HP1** dans un abonnement nommé **Sub1**. Les utilisateurs se connectent à HP1 depuis le réseau de l'entreprise par ExpressRoute. Private Link n'a jamais été utilisé avec Azure Virtual Desktop dans Sub1.

    Vous devez faire en sorte que les connexions à HP1 ne soient autorisées que lorsque le client et l'hôte de session utilisent tous deux des itinéraires privés. La solution doit réduire au minimum les perturbations pour les utilisateurs.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: provider, text: { en: "Re-register the Microsoft.DesktopVirtualization resource provider on Sub1.", fr: "Réinscrire le fournisseur de ressources Microsoft.DesktopVirtualization sur Sub1." } }
    - { id: pe, text: { en: "Create a private endpoint with the connection sub-resource for HP1 and integrate it with a private DNS zone.", fr: "Créer un point de terminaison privé avec la sous-ressource connection pour HP1 et l'intégrer à une zone DNS privée." } }
    - { id: access, text: { en: "Set the public access of HP1 to Disable public access and use private access.", fr: "Définir l'accès public de HP1 sur Disable public access and use private access." } }
    - { id: restart, text: { en: "Restart the RDAgentBootLoader service on each session host.", fr: "Redémarrer le service RDAgentBootLoader sur chaque hôte de session." } }
    - { id: file, text: { en: "Create a private endpoint with the file sub-resource for the profile storage account.", fr: "Créer un point de terminaison privé avec la sous-ressource file pour le compte de stockage des profils." } }
    - { id: rdp, text: { en: "Allow inbound TCP 3389 to the session hosts from the private endpoint subnet.", fr: "Autoriser TCP 3389 en entrée vers les hôtes de session depuis le sous-réseau du point de terminaison privé." } }
answer:
  sequence: [ provider, pe, access, restart ]
explanation:
  correct:
    en: |
      Private Link with Azure Virtual Desktop must first be enabled on each subscription by re-registering the Microsoft.DesktopVirtualization resource provider. You then create the `connection` private endpoint with its private DNS zone, and only after the private route exists do you close public access with **Disable public access and use private access**. After a change to a host pool's private endpoint or network settings, you restart the Remote Desktop Agent Loader (RDAgentBootLoader) service on each session host.
    fr: |
      Private Link avec Azure Virtual Desktop doit d'abord être activé sur chaque abonnement en réinscrivant le fournisseur de ressources Microsoft.DesktopVirtualization. Vous créez ensuite le point de terminaison privé `connection` avec sa zone DNS privée, et ce n'est qu'une fois l'itinéraire privé en place que vous fermez l'accès public avec **Disable public access and use private access**. Après une modification du point de terminaison privé ou des paramètres réseau d'un pool d'hôtes, vous redémarrez le service Remote Desktop Agent Loader (RDAgentBootLoader) sur chaque hôte de session.
  options:
    file: { en: "A storage private endpoint can be useful for profiles, but it isn't part of making HP1 connections private.", fr: "Un point de terminaison privé de stockage peut être utile pour les profils, mais il ne contribue pas à rendre privées les connexions à HP1." }
    rdp: { en: "Session traffic through the connection endpoint is outbound from the session hosts; no inbound RDP rule is needed.", fr: "Le trafic des sessions par le point de terminaison connection est sortant depuis les hôtes de session ; aucune règle RDP entrante n'est nécessaire." }
references:
  - title: Set up Private Link with Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/private-link-setup
