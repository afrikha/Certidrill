id: az140-1a-st-light-standard
objective: "1.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Tailspin Toys has 150 users who perform basic data entry tasks. They will use a pooled Azure Virtual Desktop host pool named **HP1**, and their FSLogix profile containers will be stored in Azure Files.

    You need to recommend a file share type for the profile containers. The solution must follow Microsoft's recommendation for this workload and minimize costs.

    What should you recommend?
  fr: |
    Tailspin Toys compte 150 utilisateurs qui effectuent des tâches simples de saisie de données. Ils utiliseront un pool d'hôtes Azure Virtual Desktop partagé nommé **HP1**, et leurs conteneurs de profils FSLogix seront stockés dans Azure Files.

    Vous devez recommander un type de partage de fichiers pour les conteneurs de profils. La solution doit suivre la recommandation de Microsoft pour cette charge de travail et réduire les coûts au minimum.

    Que devez-vous recommander ?
body:
  options:
    - id: a
      text: { en: "Standard (HDD) file shares in a general-purpose v2 account", fr: "Des partages de fichiers Standard (HDD) dans un compte v2 universel" }
    - id: b
      text: { en: "Premium (SSD) file shares in a FileStorage account", fr: "Des partages de fichiers Premium (SSD) dans un compte FileStorage" }
    - id: c
      text: { en: "Premium (SSD) file shares with metadata caching enabled", fr: "Des partages de fichiers Premium (SSD) avec la mise en cache des métadonnées activée" }
    - id: d
      text: { en: "Several Premium (SSD) file shares across availability zones", fr: "Plusieurs partages de fichiers Premium (SSD) répartis sur des zones de disponibilité" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      For a light workload with fewer than 200 users, Microsoft recommends standard file shares, which use HDDs, are deployed in general-purpose v2 accounts and are the cheapest option. Premium (SSD) shares are recommended for light workloads above 200 users and for medium, heavy and power workloads.
    fr: |
      Pour une charge de travail légère de moins de 200 utilisateurs, Microsoft recommande les partages de fichiers standard, qui utilisent des disques HDD, sont déployés dans des comptes v2 universels et constituent l'option la moins chère. Les partages Premium (SSD) sont recommandés pour les charges légères au-delà de 200 utilisateurs et pour les charges moyennes, lourdes et intensives.
  options:
    b: { en: "Premium shares cost more and aren't needed for a light workload below 200 users.", fr: "Les partages Premium coûtent plus cher et ne sont pas nécessaires pour une charge légère de moins de 200 utilisateurs." }
    c: { en: "Metadata caching helps large SSD deployments; it adds cost without benefit at this scale.", fr: "La mise en cache des métadonnées aide les grands déploiements SSD ; elle ajoute un coût sans bénéfice à cette échelle." }
    d: { en: "Multiple premium shares are for large user counts and handle limits, not for 150 light users.", fr: "Plusieurs partages Premium servent aux grands nombres d'utilisateurs et aux limites de handles, pas à 150 utilisateurs légers." }
references:
  - title: Storage options for FSLogix profile containers in Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/store-fslogix-profile
