id: az140-1c-auto-register-appgroup
objective: "1.4.2"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    A script created an Azure Virtual Desktop host pool named hp-finance and a desktop application group named hp-finance-dag in a resource group named rg-avd, and assigned the finance users to hp-finance-dag. A workspace named ws-finance exists in rg-avd and doesn't reference any application group.

    The finance users don't see the desktop in Windows App.

    You need to make the desktop appear in the users' feed.

    Which two actions can you perform? Each correct answer presents a complete solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Un script a créé un pool d'hôtes Azure Virtual Desktop nommé hp-finance et un groupe d'applications de bureau nommé hp-finance-dag dans un groupe de ressources nommé rg-avd, puis y a attribué les utilisateurs de la finance. Un espace de travail nommé ws-finance existe dans rg-avd et ne référence aucun groupe d'applications.

    Les utilisateurs de la finance ne voient pas le bureau dans Windows App.

    Vous devez faire apparaître le bureau dans le flux des utilisateurs.

    Quelles sont les deux actions possibles ? Chaque bonne réponse constitue une solution complète.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Run `Register-AzWvdApplicationGroup` with `-WorkspaceName ws-finance` and `-ApplicationGroupPath` set to the resource ID of hp-finance-dag.", fr: "Exécuter `Register-AzWvdApplicationGroup` avec `-WorkspaceName ws-finance` et `-ApplicationGroupPath` défini sur l'ID de ressource de hp-finance-dag." } }
    - { id: b, text: { en: "Run `Update-AzWvdHostPool` with `-PreferredAppGroupType Desktop` on hp-finance.", fr: "Exécuter `Update-AzWvdHostPool` avec `-PreferredAppGroupType Desktop` sur hp-finance." } }
    - { id: c, text: { en: "Deploy a Bicep file that sets the `applicationGroupReferences` property of ws-finance to the resource ID of hp-finance-dag.", fr: "Déployer un fichier Bicep qui définit la propriété `applicationGroupReferences` de ws-finance sur l'ID de ressource de hp-finance-dag." } }
    - { id: d, text: { en: "Run `New-AzRoleAssignment` to give the finance users the Desktop Virtualization User role on ws-finance.", fr: "Exécuter `New-AzRoleAssignment` pour donner aux utilisateurs de la finance le rôle Desktop Virtualization User sur ws-finance." } }
    - { id: e, text: { en: "Run `New-AzWvdApplicationGroup` with `-HostPoolArmPath` set to the resource ID of ws-finance.", fr: "Exécuter `New-AzWvdApplicationGroup` avec `-HostPoolArmPath` défini sur l'ID de ressource de ws-finance." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |
      Users see an application group's resources only when the application group is associated with a workspace. `Register-AzWvdApplicationGroup` registers an application group in a workspace, and the Bicep property `applicationGroupReferences` of a workspace lists the resource IDs of its application groups; either one creates the missing association.
    fr: |
      Les utilisateurs ne voient les ressources d'un groupe d'applications que lorsque celui-ci est associé à un espace de travail. `Register-AzWvdApplicationGroup` inscrit un groupe d'applications dans un espace de travail, et la propriété Bicep `applicationGroupReferences` d'un espace de travail liste les ID de ressource de ses groupes d'applications ; l'un ou l'autre crée l'association manquante.
  options:
    b: { en: "The preferred type only decides what users assigned both types see; it doesn't associate the group with a workspace.", fr: "Le type préféré décide seulement de ce que voient les utilisateurs qui ont les deux types ; il n'associe pas le groupe à un espace de travail." }
    d: { en: "Access is granted on the application group, which is already done; a role on the workspace doesn't publish the desktop.", fr: "L'accès s'accorde sur le groupe d'applications, ce qui est déjà fait ; un rôle sur l'espace de travail ne publie pas le bureau." }
    e: { en: "hostPoolArmPath must reference a host pool, and a new application group still wouldn't be in any workspace.", fr: "hostPoolArmPath doit référencer un pool d'hôtes, et un nouveau groupe d'applications ne serait toujours dans aucun espace de travail." }
references:
  - title: Register-AzWvdApplicationGroup
    url: https://learn.microsoft.com/en-us/powershell/module/az.desktopvirtualization/register-azwvdapplicationgroup
  - title: Microsoft.DesktopVirtualization/workspaces
    url: https://learn.microsoft.com/en-us/azure/templates/microsoft.desktopvirtualization/workspaces
