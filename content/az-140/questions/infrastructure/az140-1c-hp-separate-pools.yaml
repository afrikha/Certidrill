id: az140-1c-hp-separate-pools
objective: "1.3.4"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam, Inc. is planning its Azure Virtual Desktop host pool architecture. The architects list several requirements and want to know which of them call for separate host pools.

    Which two requirements should lead you to plan separate host pools?

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam, Inc. planifie l'architecture de ses pools d'hôtes Azure Virtual Desktop. Les architectes listent plusieurs exigences et veulent savoir lesquelles imposent des pools d'hôtes distincts.

    Quelles sont les deux exigences qui doivent vous conduire à prévoir des pools d'hôtes distincts ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Sales users need an image with Microsoft 365 Apps, and engineers need a different image with CAD tools.", fr: "Les commerciaux ont besoin d'une image avec Microsoft 365 Apps, et les ingénieurs d'une autre image avec des outils de CAO." } }
    - { id: b, text: { en: "Some users need a full desktop, and other users need only two RemoteApps.", fr: "Certains utilisateurs ont besoin d'un bureau complet, et d'autres seulement de deux RemoteApp." } }
    - { id: c, text: { en: "Users in Europe and users in Australia each need session hosts close to them.", fr: "Les utilisateurs d'Europe et ceux d'Australie ont chacun besoin d'hôtes de session proches d'eux." } }
    - { id: d, text: { en: "The HR and legal departments must each see a different set of RemoteApps.", fr: "Les services RH et juridique doivent chacun voir un ensemble différent de RemoteApp." } }
    - { id: e, text: { en: "Administrators must be able to put individual session hosts in drain mode.", fr: "Les administrateurs doivent pouvoir mettre des hôtes de session individuels en mode drainage." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |
      All the session hosts of a host pool should be built from the same image for a consistent experience, so two different images mean two host pools. Session hosts from different Azure regions shouldn't be mixed in one host pool, so users on two continents get a host pool per region, close to them.
    fr: |
      Tous les hôtes de session d'un pool doivent provenir de la même image pour une expérience cohérente : deux images différentes impliquent deux pools d'hôtes. Il ne faut pas mélanger dans un pool des hôtes de session de régions Azure différentes : des utilisateurs sur deux continents reçoivent un pool d'hôtes par région, près d'eux.
  options:
    b: { en: "One pooled host pool can have a desktop application group and RemoteApp application groups at the same time.", fr: "Un même pool d'hôtes regroupé peut avoir en même temps un groupe d'applications de bureau et des groupes d'applications RemoteApp." }
    d: { en: "A host pool can have several RemoteApp application groups, each assigned to a different department.", fr: "Un pool d'hôtes peut avoir plusieurs groupes d'applications RemoteApp, chacun attribué à un service différent." }
    e: { en: "Drain mode is set per session host inside any host pool.", fr: "Le mode drainage se définit par hôte de session, dans n'importe quel pool d'hôtes." }
references:
  - title: Azure Virtual Desktop terminology
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/terminology
