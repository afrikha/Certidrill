id: az140-1b-org-regional-scope
objective: "1.3.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Proseware, Inc. plans to deploy an Azure Virtual Desktop host pool with session hosts in the East US 2 region. A compliance rule requires that the customer data that Azure Virtual Desktop stores for the host pool and its related objects, such as host pool names, VM names and user principal names, is stored only in the Azure region where those objects are created, not anywhere in the geography.

    You need to recommend a deployment that meets the compliance rule.

    What should you recommend?
  fr: |
    Proseware, Inc. prévoit de déployer un pool d'hôtes Azure Virtual Desktop dont les hôtes de session seront dans la région East US 2. Une règle de conformité exige que les données client qu'Azure Virtual Desktop stocke pour le pool d'hôtes et ses objets associés, comme les noms de pools d'hôtes, les noms de machines virtuelles et les noms d'utilisateur principaux, soient stockées uniquement dans la région Azure où ces objets sont créés, et non n'importe où dans la zone géographique.

    Vous devez recommander un déploiement qui respecte la règle de conformité.

    Que devez-vous recommander ?
body:
  options:
    - id: a
      text: { en: "Create the host pool in East US with the geographical deployment scope.", fr: "Créer le pool d'hôtes dans East US avec l'étendue de déploiement géographique." }
    - id: b
      text: { en: "Create the host pool in East US 2 with the geographical deployment scope and Azure Private Link.", fr: "Créer le pool d'hôtes dans East US 2 avec l'étendue de déploiement géographique et Azure Private Link." }
    - id: c
      text: { en: "Create the host pool in West US 3 with the regional deployment scope.", fr: "Créer le pool d'hôtes dans West US 3 avec l'étendue de déploiement régionale." }
    - id: d
      text: { en: "Create the host pool in East US 2 with the regional deployment scope.", fr: "Créer le pool d'hôtes dans East US 2 avec l'étendue de déploiement régionale." }
answer: { optionId: d }
explanation:
  correct:
    en: |
      With the default geographical scope, Azure Virtual Desktop stores the metadata in the geography of the chosen region, not in that region only. The regional scope stores the host pool's customer input and customer data only in the Azure region where the objects are created, with replicas across its availability zones. The regional scope is offered in a few regions, including East US 2 and Central US.
    fr: |
      Avec l'étendue géographique par défaut, Azure Virtual Desktop stocke les métadonnées dans la zone géographique de la région choisie, et pas uniquement dans cette région. L'étendue régionale ne stocke les données saisies et les données client du pool d'hôtes que dans la région Azure où les objets sont créés, avec des réplicas dans ses zones de disponibilité. L'étendue régionale est proposée dans quelques régions, dont East US 2 et Central US.
  options:
    a: { en: "The geographical scope stores metadata anywhere in the United States geography, not in a single region.", fr: "L'étendue géographique stocke les métadonnées n'importe où dans la zone géographique des États-Unis, pas dans une seule région." }
    b: { en: "Private Link controls the network path to the service; it doesn't change where metadata is stored.", fr: "Private Link contrôle le chemin réseau vers le service ; il ne change pas l'emplacement de stockage des métadonnées." }
    c: { en: "The regional scope isn't offered in West US 3; in regions without it, host pools are created with the geographical scope.", fr: "L'étendue régionale n'est pas proposée dans West US 3 ; dans les régions qui ne la proposent pas, les pools d'hôtes sont créés avec l'étendue géographique." }
references:
  - title: Data locations for Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/data-locations
