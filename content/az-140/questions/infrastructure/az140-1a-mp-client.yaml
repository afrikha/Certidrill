id: az140-1a-mp-client
objective: "1.1.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso has an Azure Virtual Desktop host pool named **HP1** in the Azure public cloud. RDP Shortpath for public networks works for all users. Users have Windows 11 laptops, which have Windows App 2.0.1069.0 and Remote Desktop Connection, and Android tablets, which have Windows App.

    You need to ensure that users can benefit from RDP Multipath with multiple UDP transport paths.

    What should you instruct the users to use?
  fr: |
    Contoso dispose d'un pool d'hôtes Azure Virtual Desktop nommé **HP1** dans le cloud public Azure. RDP Shortpath pour les réseaux publics fonctionne pour tous les utilisateurs. Les utilisateurs ont des ordinateurs portables Windows 11, équipés de Windows App 2.0.1069.0 et de Connexion Bureau à distance, et des tablettes Android, équipées de Windows App.

    Vous devez faire en sorte que les utilisateurs puissent bénéficier de RDP Multipath avec plusieurs chemins de transport UDP.

    Que devez-vous demander aux utilisateurs d'utiliser ?
body:
  options:
    - id: a
      text: { en: "Windows App on the Android tablets", fr: "Windows App sur les tablettes Android" }
    - id: b
      text: { en: "Remote Desktop Connection (mstsc.exe) on the Windows 11 laptops", fr: "Connexion Bureau à distance (mstsc.exe) sur les ordinateurs portables Windows 11" }
    - id: c
      text: { en: "Windows App on the Windows 11 laptops", fr: "Windows App sur les ordinateurs portables Windows 11" }
    - id: d
      text: { en: "Windows App in a web browser on either device", fr: "Windows App dans un navigateur web sur l'un ou l'autre appareil" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      RDP Multipath needs no configuration beyond RDP Shortpath, but it requires a supported client: Windows App for Windows 2.0.559.0 or later for multiple UDP paths (2.0.1069.0 or later adds redundant TCP paths). Windows App for macOS supports it in Beta; other platforms aren't currently supported.
    fr: |
      RDP Multipath n'exige aucune configuration au-delà de RDP Shortpath, mais il faut un client pris en charge : Windows App pour Windows 2.0.559.0 ou ultérieure pour plusieurs chemins UDP (2.0.1069.0 ou ultérieure ajoute les chemins TCP redondants). Windows App pour macOS le prend en charge en bêta ; les autres plateformes ne sont pas prises en charge actuellement.
  options:
    a: { en: "Android isn't a supported platform for RDP Multipath.", fr: "Android n'est pas une plateforme prise en charge par RDP Multipath." }
    b: { en: "RDP Multipath is documented for Windows App, not for the Remote Desktop Connection client.", fr: "RDP Multipath est documenté pour Windows App, pas pour le client Connexion Bureau à distance." }
    d: { en: "The web browser client isn't a supported platform for RDP Multipath.", fr: "Le client de navigateur web n'est pas une plateforme prise en charge par RDP Multipath." }
references:
  - title: Use RDP Multipath to improve connection reliability to Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/rdp-multipath
