id: az140-4b-rs-personal-replace
objective: "4.2.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Adatum has an Azure Virtual Desktop personal host pool. A session host named **pd-adatum-07** is assigned to a user named **User4**. The VM uses managed disks that aren't encrypted with Azure Disk Encryption, and Azure Backup protects it with a daily policy.

    After a failed driver installation, pd-adatum-07 no longer starts correctly. The VM still exists. You need to return pd-adatum-07 to the state of last night's backup. The VM must keep its name, network interface and assignment to User4. The solution must minimize administrative effort.

    Which restore option should you use?
  fr: |
    Adatum dispose d'un pool d'hôtes Azure Virtual Desktop personnel. Un hôte de session nommé **pd-adatum-07** est attribué à un utilisateur nommé **User4**. La machine virtuelle utilise des disques managés qui ne sont pas chiffrés avec Azure Disk Encryption, et Sauvegarde Azure la protège avec une stratégie quotidienne.

    Après l'échec de l'installation d'un pilote, pd-adatum-07 ne démarre plus correctement. La machine virtuelle existe toujours. Vous devez ramener pd-adatum-07 à l'état de la sauvegarde de la nuit dernière. La machine virtuelle doit conserver son nom, son interface réseau et son attribution à User4. La solution doit réduire au minimum l'effort d'administration.

    Quelle option de restauration devez-vous utiliser ?
body:
  options:
    - { id: a, text: Create a new VM }
    - { id: b, text: Restore disk }
    - { id: c, text: Replace existing }
    - { id: d, text: File Recovery }
answer: { optionId: c }
explanation:
  correct:
    en: Replace existing restores the disks of the recovery point onto the existing VM, after Azure Backup takes a snapshot of the current disks. The VM keeps its name and network interface, so the session host stays registered and assigned to User4. The option requires the VM to still exist and is supported for unencrypted managed VMs.
    fr: "L'option Replace existing restaure les disques du point de récupération sur la machine virtuelle existante, après que Sauvegarde Azure a pris une capture instantanée des disques actuels. La machine virtuelle conserve son nom et son interface réseau : l'hôte de session reste inscrit et attribué à User4. L'option exige que la machine virtuelle existe toujours et est prise en charge pour les machines virtuelles managées non chiffrées."
  options:
    a: { en: "Create a new VM builds another VM, which isn't the session host assigned to User4.", fr: "Create a new VM crée une autre machine virtuelle, qui n'est pas l'hôte de session attribué à User4." }
    b: { en: "Restore disk only creates disks; attaching them or building a VM is extra manual work.", fr: "Restore disk crée seulement des disques ; les attacher ou créer une machine virtuelle représente un travail manuel supplémentaire." }
    d: { en: "File Recovery mounts a recovery point to copy individual files; it doesn't repair the operating system of the VM.", fr: "File Recovery monte un point de récupération pour copier des fichiers individuels ; il ne répare pas le système d'exploitation de la machine virtuelle." }
references:
  - title: Restore VMs by using the Azure portal using Azure Backup
    url: https://learn.microsoft.com/en-us/azure/backup/backup-azure-arm-restore-vms
