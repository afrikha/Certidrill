id: az140-4a-insights-statements
objective: "4.1.2"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    You use Azure Virtual Desktop Insights to review the activity of a pooled host pool named **HP1** over the last seven days. Users connect from several countries, and some of them use RDP Shortpath.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous utilisez Azure Virtual Desktop Insights pour examiner l'activité d'un pool d'hôtes regroupé nommé **HP1** au cours des sept derniers jours. Les utilisateurs se connectent depuis plusieurs pays, et certains d'entre eux utilisent RDP Shortpath.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: In the Connection Performance report, a median round-trip time of 180 ms for a gateway region is within the range that Microsoft describes as ideal.
        fr: Dans le rapport Connection Performance, un temps d'aller-retour médian de 180 ms pour une région de passerelle se situe dans la plage que Microsoft décrit comme idéale.
    - id: s2
      text:
        en: The Connection Reliability report can break down disconnections by transport, such as ShortpathPublic or Relay.
        fr: Le rapport Connection Reliability peut ventiler les déconnexions par transport, comme ShortpathPublic ou Relay.
    - id: s3
      text:
        en: The Utilization report shows the number of active and idle session hosts over time, which helps you design a scaling plan for HP1.
        fr: Le rapport Utilization montre le nombre d'hôtes de session actifs et inactifs au fil du temps, ce qui aide à concevoir un plan de mise à l'échelle pour HP1.
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: Microsoft states that latency should generally be below 100 ms for ideal interaction and that sessions become low quality above 200 ms, so 180 ms isn't ideal. Connection Reliability lets you pivot disconnections by transport, session host, client, gateway region and more. Utilization shows the session history and the session host count over time; scoped to one host pool, it shows the patterns used to build a scaling plan.
    fr: Microsoft indique que la latence doit généralement rester sous 100 ms pour une interaction idéale et que les sessions deviennent de mauvaise qualité au-delà de 200 ms ; 180 ms n'est donc pas idéal. Connection Reliability permet de ventiler les déconnexions par transport, hôte de session, client, région de passerelle, etc. Utilization montre l'historique des sessions et le nombre d'hôtes de session au fil du temps ; limité à un pool d'hôtes, il révèle les tendances qui servent à bâtir un plan de mise à l'échelle.
references:
  - title: Use cases for Azure Virtual Desktop Insights
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/insights-use-cases
