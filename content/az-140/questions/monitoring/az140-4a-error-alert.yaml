id: az140-4a-error-alert
objective: "4.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    The diagnostic settings of an Azure Virtual Desktop host pool named **HP1** send all the log categories to a Log Analytics workspace named **LAW1**. An action group named **AG-HelpDesk** sends an email to the help desk.

    You need the help desk to be notified when more than 20 records for HP1 are written to the WVDErrors table within 15 minutes.

    What should you create?
  fr: |
    Les paramètres de diagnostic d'un pool d'hôtes Azure Virtual Desktop nommé **HP1** envoient toutes les catégories de journaux vers un espace de travail Log Analytics nommé **LAW1**. Un groupe d'actions nommé **AG-HelpDesk** envoie un e-mail au support technique.

    Le support technique doit être averti quand plus de 20 enregistrements concernant HP1 sont écrits dans la table WVDErrors en 15 minutes.

    Que devez-vous créer ?
body:
  options:
    - { id: a, text: { en: "A Service Health alert for Azure Virtual Desktop that uses AG-HelpDesk", fr: "Une alerte Service Health pour Azure Virtual Desktop qui utilise AG-HelpDesk" } }
    - { id: b, text: { en: "An activity log alert on HP1 for the Administrative category that uses AG-HelpDesk", fr: "Une alerte de journal d'activité sur HP1 pour la catégorie Administrative qui utilise AG-HelpDesk" } }
    - { id: c, text: { en: "An Azure Advisor alert for the Operational Excellence category that uses AG-HelpDesk", fr: "Une alerte Azure Advisor pour la catégorie Excellence opérationnelle qui utilise AG-HelpDesk" } }
    - { id: d, text: { en: "A log search alert rule on LAW1 that counts WVDErrors records and uses AG-HelpDesk", fr: "Une règle d'alerte de recherche dans les journaux sur LAW1 qui compte les enregistrements WVDErrors et utilise AG-HelpDesk" } }
answer: { optionId: d }
explanation:
  correct:
    en: The WVDErrors records are log data in LAW1, so a log search alert rule that runs a query counting them over a 15-minute window, with a threshold of 20, is the way to alert on them. Insights itself doesn't create alerts; alert rules are configured separately in Azure Monitor and use action groups for notifications.
    fr: Les enregistrements WVDErrors sont des données de journal dans LAW1 ; une règle d'alerte de recherche dans les journaux qui exécute une requête les comptant sur une fenêtre de 15 minutes, avec un seuil de 20, est donc le moyen d'alerter sur ces données. Insights ne crée pas d'alertes ; les règles d'alerte se configurent séparément dans Azure Monitor et utilisent des groupes d'actions pour les notifications.
  options:
    a: { en: "Service Health alerts report incidents and maintenance of the Azure service itself, not errors written by your deployment.", fr: "Les alertes Service Health signalent les incidents et la maintenance du service Azure lui-même, pas les erreurs écrites par votre déploiement." }
    b: { en: "The activity log records control-plane operations on HP1, such as updates of its properties, not user errors.", fr: "Le journal d'activité enregistre les opérations du plan de contrôle sur HP1, comme les mises à jour de ses propriétés, pas les erreurs des utilisateurs." }
    c: { en: "Advisor alerts notify you of new recommendations, not of log records crossing a threshold.", fr: "Les alertes Advisor signalent de nouvelles recommandations, pas des enregistrements de journal qui dépassent un seuil." }
references:
  - title: Send diagnostic data to Log Analytics for Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/diagnostics-log-analytics
  - title: Enable Insights to monitor Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/insights
