id: az140-cs2b-insights
objective: "4.1.1"
type: multi
caseStudy: az140-cs2b-bellows
difficulty: 1
status: draft
stem:
  en: |
    You need to meet the monitoring requirement by using LAW-Labs.

    Which two actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez respecter l'exigence de supervision en utilisant LAW-Labs.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text:
        en: "Configure the diagnostic settings of HP-Labs to send the host pool log categories, including Connections, Errors and Checkpoints, to LAW-Labs."
        fr: "Configurer les paramètres de diagnostic de HP-Labs pour envoyer les catégories de journaux du pool d'hôtes, dont Connections, Errors et Checkpoints, vers LAW-Labs."
    - id: b
      text:
        en: "Install the Azure Monitor Agent on the session hosts and associate them with a data collection rule that collects the recommended performance counters and Windows event logs."
        fr: "Installer l'agent Azure Monitor sur les hôtes de session et les associer à une règle de collecte de données qui collecte les compteurs de performances et les journaux d'événements Windows recommandés."
    - id: c
      text:
        en: "Install the Log Analytics agent on the session hosts and connect it to LAW-Labs by using the workspace ID and key."
        fr: "Installer l'agent Log Analytics sur les hôtes de session et le connecter à LAW-Labs avec l'ID et la clé de l'espace de travail."
    - id: d
      text:
        en: "Create a Network Watcher connection monitor that tests the connectivity from the session hosts to the Azure Virtual Desktop gateway."
        fr: "Créer un moniteur de connexion Network Watcher qui teste la connectivité des hôtes de session vers la passerelle Azure Virtual Desktop."
    - id: e
      text:
        en: "Configure the diagnostic settings of the Sub-Labs subscription to send the activity log to LAW-Labs."
        fr: "Configurer les paramètres de diagnostic de l'abonnement Sub-Labs pour envoyer le journal d'activité vers LAW-Labs."
answer: { optionIds: [ a, b ] }
explanation:
  correct:
    en: |
      Azure Virtual Desktop Insights needs the diagnostics of the host pool and of the workspace in a Log Analytics workspace, plus performance counters and Windows event logs from the session hosts. The WS-Labs diagnostics are already configured, so you add the host pool diagnostic settings and a data collection rule associated with session hosts that run the Azure Monitor Agent.
    fr: |
      Azure Virtual Desktop Insights a besoin des diagnostics du pool d'hôtes et de l'espace de travail dans un espace de travail Log Analytics, ainsi que des compteurs de performances et des journaux d'événements Windows des hôtes de session. Les diagnostics de WS-Labs sont déjà configurés : vous ajoutez donc les paramètres de diagnostic du pool d'hôtes et une règle de collecte de données associée aux hôtes de session qui exécutent l'agent Azure Monitor.
  options:
    c: { en: "The Log Analytics agent is retired; Insights collects session host data with the Azure Monitor Agent and a data collection rule.", fr: "L'agent Log Analytics est mis hors service ; Insights collecte les données des hôtes de session avec l'agent Azure Monitor et une règle de collecte de données." }
    d: { en: "Connection monitor tests network paths; it does not provide the connection, error and performance data that Insights uses.", fr: "Le moniteur de connexion teste des chemins réseau ; il ne fournit pas les données de connexion, d'erreur et de performances qu'utilise Insights." }
    e: { en: "The activity log records control plane operations; it does not contain the Azure Virtual Desktop connection data or the session host counters.", fr: "Le journal d'activité enregistre les opérations du plan de contrôle ; il ne contient ni les données de connexion Azure Virtual Desktop ni les compteurs des hôtes de session." }
references:
  - title: Enable Insights to monitor Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/insights
