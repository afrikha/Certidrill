id: az140-4a-disconnect-vs-logoff
objective: "4.1.6"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    You have a pooled host pool named **HP1**. A power management scaling plan is assigned to HP1. In the Azure portal, you open the sessions of a session host named **SH1** and **disconnect** the session of a user named **User1**. You don't sign out User1.

    Which two statements are true?

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un pool d'hôtes regroupé nommé **HP1**. Un plan de mise à l'échelle de type gestion de l'alimentation est attribué à HP1. Dans le portail Azure, vous ouvrez les sessions d'un hôte de session nommé **SH1** et **déconnectez** la session d'un utilisateur nommé **User1**. Vous ne fermez pas la session de User1.

    Quelles sont les deux affirmations vraies ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "The applications that User1 had open keep running on SH1.", fr: "Les applications que User1 avait ouvertes continuent de s'exécuter sur SH1." } }
    - { id: b, text: { en: "The unsaved work in the applications of User1 is lost when the session is disconnected.", fr: "Le travail non enregistré dans les applications de User1 est perdu lors de la déconnexion de la session." } }
    - { id: c, text: { en: "The session no longer counts in the used capacity calculated by autoscale.", fr: "La session n'est plus prise en compte dans la capacité utilisée calculée par la mise à l'échelle automatique." } }
    - { id: d, text: { en: "If User1 signs in again, User1 returns to the session on SH1, even if SH1 is in drain mode.", fr: "Si User1 se reconnecte, User1 retrouve sa session sur SH1, même si SH1 est en mode drainage." } }
    - { id: e, text: { en: "SH1 is automatically put in drain mode until User1 reconnects to the disconnected session.", fr: "SH1 est automatiquement placé en mode drainage jusqu'à ce que User1 se reconnecte à la session déconnectée." } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: A disconnected session remains on the session host with its applications running, and it becomes active again when the user reconnects. A user who has an active or disconnected session in the host pool is redirected to that session host, even if drain mode is turned on.
    fr: Une session déconnectée reste sur l'hôte de session avec ses applications en cours d'exécution, et elle redevient active quand l'utilisateur se reconnecte. Un utilisateur qui a une session active ou déconnectée dans le pool d'hôtes est redirigé vers cet hôte de session, même si le mode drainage est activé.
  options:
    b: { en: "Work is lost when a user is signed out (logged off), not when the session is only disconnected.", fr: "Le travail est perdu quand la session de l'utilisateur est fermée, pas quand elle est seulement déconnectée." }
    c: { en: "Used capacity counts active and disconnected sessions, because disconnected users may reconnect.", fr: "La capacité utilisée compte les sessions actives et déconnectées, car les utilisateurs déconnectés peuvent se reconnecter." }
    e: { en: "Disconnecting a session doesn't change the drain mode of the host.", fr: "Déconnecter une session ne change pas le mode drainage de l'hôte." }
references:
  - title: Azure Virtual Desktop autoscale glossary for Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/autoscale-glossary
  - title: Configure host pool load balancing in Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/configure-host-pool-load-balancing
