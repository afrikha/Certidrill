id: az140-cs1c-disaster-recovery
objective: "4.2.3"
type: multi
caseStudy: az140-cs1c-alpine-ski-house
difficulty: 3
status: draft
stem:
  en: |
    You deploy the identity solution that meets the identity requirement. You need to meet the disaster recovery requirement.

    Which two actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous déployez la solution d'identité qui satisfait l'exigence relative à l'identité. Vous devez satisfaire l'exigence de reprise d'activité.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Add a replica set for the managed domain in Germany West Central.", fr: "Ajouter un jeu de réplicas pour le domaine managé dans Germany West Central." } }
    - { id: b, text: { en: "Install a Microsoft Entra Connect server in staging mode in Germany West Central.", fr: "Installer un serveur Microsoft Entra Connect en mode intermédiaire dans Germany West Central." } }
    - { id: c, text: { en: "Register the application groups of HP-Front-DR in WS-Alpine.", fr: "Inscrire les groupes d'applications de HP-Front-DR dans WS-Alpine." } }
    - { id: d, text: { en: "Create a workspace in Germany West Central for the application groups of HP-Front-DR.", fr: "Créer un espace de travail dans Germany West Central pour les groupes d'applications de HP-Front-DR." } }
    - { id: e, text: { en: "Change the redundancy of stalpprofchn to geo-redundant storage (GRS).", fr: "Changer la redondance de stalpprofchn en stockage géoredondant (GRS)." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |
      Microsoft Entra Domain Services remains available during a regional outage only if the managed domain has a replica set in another region, so you add one in Germany West Central. In an active-passive design, the secondary host pool has its own application groups, and registering them in the same workspace lets users keep using WS-Alpine; at failover, administrators assign the users to these groups.
    fr: |
      Microsoft Entra Domain Services ne reste disponible pendant une panne régionale que si le domaine managé dispose d'un jeu de réplicas dans une autre région : vous en ajoutez donc un dans Germany West Central. Dans une conception actif-passif, le pool d'hôtes secondaire a ses propres groupes d'applications, et les inscrire dans le même espace de travail permet aux utilisateurs de continuer à utiliser WS-Alpine ; lors du basculement, les administrateurs attribuent les utilisateurs à ces groupes.
  options:
    b: { en: "Microsoft Entra Connect synchronizes an on-premises AD DS; Alpine has cloud-only accounts and no AD DS to synchronize.", fr: "Microsoft Entra Connect synchronise un AD DS local ; Alpine a des comptes cloud uniquement et aucun AD DS à synchroniser." }
    d: { en: "A separate workspace suits an active-active design; the requirement says that users must keep using WS-Alpine.", fr: "Un espace de travail distinct convient à une conception actif-actif ; l'exigence impose que les utilisateurs continuent à utiliser WS-Alpine." }
    e: { en: "Azure Files premium does not support GRS, and the profiles are already replicated between regions by Cloud Cache.", fr: "Azure Files Premium ne prend pas en charge GRS, et les profils sont déjà répliqués entre les régions par Cloud Cache." }
references:
  - title: Multiregion BCDR for Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/architecture/example-scenario/azure-virtual-desktop/azure-virtual-desktop-multi-region-bcdr
