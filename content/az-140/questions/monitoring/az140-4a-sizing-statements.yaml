id: az140-4a-sizing-statements
objective: "4.1.4"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    You are reviewing the sizing of the session hosts of a pooled host pool that runs Windows 11 Enterprise multi-session.

    Which two statements match Microsoft's session host sizing guidelines?

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous examinez le dimensionnement des hôtes de session d'un pool d'hôtes regroupé qui exécute Windows 11 Entreprise multisession.

    Quelles sont les deux affirmations conformes aux recommandations de dimensionnement des hôtes de session de Microsoft ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "For a light workload, plan a maximum of one user per vCPU.", fr: "Pour une charge légère, prévoir au maximum un utilisateur par processeur virtuel." } }
    - { id: b, text: { en: "For a heavy workload, plan a maximum of two users per vCPU.", fr: "Pour une charge lourde, prévoir au maximum deux utilisateurs par processeur virtuel." } }
    - { id: c, text: { en: "Two session hosts with 16 vCPUs each perform better than one with 32 vCPUs.", fr: "Deux hôtes de session de 16 processeurs virtuels chacun sont plus performants qu'un hôte de 32 processeurs virtuels." } }
    - { id: d, text: { en: "Session hosts with 2 vCPUs are the recommended size for multi-session.", fr: "Les hôtes de session à 2 processeurs virtuels sont la taille recommandée en multisession." } }
    - { id: e, text: { en: "Plan a minimum of 5 GB of profile storage per user.", fr: "Prévoir au minimum 5 Go de stockage de profil par utilisateur." } }
answer: { optionIds: [ b, c ] }
explanation:
  correct:
    en: The multi-session guidelines set a maximum of 6, 4, 2 and 1 users per vCPU for light, medium, heavy and power workloads. Returns diminish around 16 cores because of synchronization overhead, so two 16-core VMs are better than one 32-core VM; the recommended range is 4 to 24 cores.
    fr: Les recommandations multisession fixent au maximum 6, 4, 2 et 1 utilisateurs par processeur virtuel pour les charges légère, moyenne, lourde et intensive (power). Le gain diminue vers 16 cœurs à cause de la surcharge de synchronisation ; deux machines virtuelles de 16 cœurs valent donc mieux qu'une de 32 cœurs, et la plage recommandée va de 4 à 24 cœurs.
  options:
    a: { en: "A light workload allows up to six users per vCPU; one user per vCPU is the power workload ratio.", fr: "Une charge légère permet jusqu'à six utilisateurs par processeur virtuel ; un utilisateur par processeur virtuel est le ratio de la charge intensive (power)." }
    d: { en: "Multi-session VMs need more than two cores: with two, the UI and apps become unstable. Four cores is the lowest recommended count.", fr: "Les machines virtuelles multisession ont besoin de plus de deux cœurs : avec deux, l'interface et les applications deviennent instables. Quatre cœurs est le minimum recommandé." }
    e: { en: "The guidelines plan a minimum of 30 GB of profile storage per user.", fr: "Les recommandations prévoient au minimum 30 Go de stockage de profil par utilisateur." }
references:
  - title: Session host virtual machine sizing guidelines for Azure Virtual Desktop and Remote Desktop Services
    url: https://learn.microsoft.com/en-us/windows-server/remote/remote-desktop-services/virtual-machine-recs
