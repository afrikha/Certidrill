id: az140-4a-capacity-threshold
objective: "4.1.5"
type: single
difficulty: 2
shuffle: false
status: draft
stem:
  en: |
    You have a pooled host pool named **HP1** that contains 10 session hosts and has a max session limit of 20. A power management scaling plan is assigned to HP1. During the ramp-up phase, the capacity threshold is 60 percent.

    At 08:30, during ramp-up, four session hosts are running and available, and the other six are deallocated.

    What is the minimum number of user sessions (active and disconnected) that makes autoscale start a fifth session host?
  fr: |
    Vous disposez d'un pool d'hôtes regroupé nommé **HP1** qui contient 10 hôtes de session et dont la limite maximale de sessions est de 20. Un plan de mise à l'échelle de type gestion de l'alimentation est attribué à HP1. Pendant la phase de montée en charge (ramp-up), le seuil de capacité est de 60 %.

    À 08:30, pendant la montée en charge, quatre hôtes de session sont allumés et disponibles, et les six autres sont libérés.

    Quel est le nombre minimal de sessions utilisateur (actives et déconnectées) qui amène la mise à l'échelle automatique à démarrer un cinquième hôte de session ?
body:
  options:
    - { id: a, text: "40" }
    - { id: b, text: "48" }
    - { id: c, text: "49" }
    - { id: d, text: "60" }
answer: { optionId: c }
explanation:
  correct:
    en: Available host pool capacity is the max session limit multiplied by the available session hosts, 20 × 4 = 80 sessions, and used capacity is the active plus disconnected sessions divided by that capacity. Autoscale starts a host only when used capacity is greater than the threshold; at exactly 48 sessions (60 percent) it does nothing, so the 49th session triggers the start.
    fr: La capacité disponible du pool d'hôtes est la limite maximale de sessions multipliée par le nombre d'hôtes disponibles, 20 × 4 = 80 sessions, et la capacité utilisée est le nombre de sessions actives et déconnectées divisé par cette capacité. La mise à l'échelle automatique ne démarre un hôte que si la capacité utilisée dépasse le seuil ; à exactement 48 sessions (60 %), elle ne fait rien, et c'est la 49e session qui déclenche le démarrage.
  options:
    a: { en: "40 sessions is 50 percent of the available capacity, below the threshold.", fr: "40 sessions représentent 50 % de la capacité disponible, sous le seuil." }
    b: { en: "At 48 sessions, used capacity equals the threshold, and autoscale acts only when it's greater or lower.", fr: "À 48 sessions, la capacité utilisée est égale au seuil, et la mise à l'échelle automatique n'agit que si elle est supérieure ou inférieure." }
    d: { en: "60 sessions are 75 percent of the available capacity; autoscale already acts once used capacity exceeds 60 percent.", fr: "60 sessions représentent 75 % de la capacité disponible ; la mise à l'échelle automatique agit dès que la capacité utilisée dépasse 60 %." }
references:
