id: az140-cs3c-insights
objective: "4.1.1"
type: multi
caseStudy: az140-cs3c-relecloud
difficulty: 1
status: draft
stem:
  en: |
    You need to configure data collection so that Azure Virtual Desktop Insights meets the monitoring requirement.

    Which two actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez configurer la collecte des données pour qu'Azure Virtual Desktop Insights satisfasse l'exigence de supervision.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Install the Log Analytics agent on the session hosts and connect it to law-avd.", fr: "Installer l'agent Log Analytics sur les hôtes de session et le connecter à law-avd." } }
    - { id: b, text: { en: "Create diagnostic settings on the host pools and the Azure Virtual Desktop workspace that send logs to law-avd.", fr: "Créer des paramètres de diagnostic sur les pools d'hôtes et l'espace de travail Azure Virtual Desktop qui envoient les journaux vers law-avd." } }
    - { id: c, text: { en: "Enable boot diagnostics on the session hosts with a managed storage account.", fr: "Activer les diagnostics de démarrage sur les hôtes de session avec un compte de stockage managé." } }
    - { id: d, text: { en: "Install the Azure Monitor Agent on the session hosts and associate a data collection rule that sends to law-avd.", fr: "Installer l'agent Azure Monitor sur les hôtes de session et associer une règle de collecte de données qui envoie vers law-avd." } }
    - { id: e, text: { en: "Create an Application Insights resource that is based on law-avd.", fr: "Créer une ressource Application Insights basée sur law-avd." } }
answer: { optionIds: [b, d] }
explanation:
  correct:
    en: |
      Azure Virtual Desktop Insights needs two data sources in a Log Analytics workspace. Diagnostic settings on the host pools and workspaces send service data such as connections, errors and agent health. The Azure Monitor Agent with a data collection rule sends the recommended performance counters and Windows event logs of the session hosts.
    fr: |
      Azure Virtual Desktop Insights a besoin de deux sources de données dans un espace de travail Log Analytics. Les paramètres de diagnostic des pools d'hôtes et des espaces de travail envoient les données du service, comme les connexions, les erreurs et l'intégrité de l'agent. L'agent Azure Monitor avec une règle de collecte de données envoie les compteurs de performances et les journaux d'événements Windows recommandés des hôtes de session.
  options:
    a: { en: "The Log Analytics agent (MMA) is retired; Insights uses the Azure Monitor Agent with a data collection rule.", fr: "L'agent Log Analytics (MMA) est mis hors service ; Insights utilise l'agent Azure Monitor avec une règle de collecte de données." }
    c: { en: "Boot diagnostics capture console screenshots and serial logs for troubleshooting startup; Insights doesn't use them.", fr: "Les diagnostics de démarrage capturent des captures d'écran de la console et des journaux série pour dépanner le démarrage ; Insights ne les utilise pas." }
    e: { en: "Application Insights monitors application telemetry, not Azure Virtual Desktop connections or session host performance.", fr: "Application Insights supervise la télémétrie des applications, pas les connexions Azure Virtual Desktop ni les performances des hôtes de session." }
references:
  - title: Enable Insights to monitor Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/insights
