id: az140-4b-mr-identity
objective: "4.2.3"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    Woodgrove Bank has an Active Directory Domain Services (AD DS) domain. Two domain controllers run as Azure VMs in the UK South region, and a Microsoft Entra Connect server in UK South synchronizes the domain with Microsoft Entra ID. The Azure Virtual Desktop session hosts in UK South are Microsoft Entra hybrid joined.

    You are deploying a secondary host pool in UK West. Identity services must remain available to the secondary session hosts if UK South fails.

    Which two actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove Bank dispose d'un domaine Active Directory Domain Services (AD DS). Deux contrôleurs de domaine s'exécutent en tant que machines virtuelles Azure dans la région UK South, et un serveur Microsoft Entra Connect de UK South synchronise le domaine avec Microsoft Entra ID. Les hôtes de session Azure Virtual Desktop de UK South sont joints à Microsoft Entra hybride.

    Vous déployez un pool d'hôtes secondaire dans UK West. Les services d'identité doivent rester disponibles pour les hôtes de session secondaires si UK South tombe en panne.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Deploy a domain controller with the global catalog and DNS roles in UK West.", fr: "Déployer un contrôleur de domaine avec les rôles de catalogue global et DNS dans UK West." } }
    - { id: b, text: { en: "Install a Microsoft Entra Connect server in staging mode in UK West.", fr: "Installer un serveur Microsoft Entra Connect en mode intermédiaire dans UK West." } }
    - { id: c, text: { en: "Add a replica set for Microsoft Entra Domain Services in UK West.", fr: "Ajouter un jeu de réplicas pour Microsoft Entra Domain Services dans UK West." } }
    - { id: d, text: { en: "Create a second Microsoft Entra tenant for the UK West session hosts.", fr: "Créer un second locataire Microsoft Entra pour les hôtes de session de UK West." } }
answer: { optionIds: [ a, b ] }
explanation:
  correct:
    en: Microsoft recommends at least one more domain controller, with the global catalog and DNS roles, in the secondary region so that the session hosts can authenticate if the primary region is lost. A second Microsoft Entra Connect server in staging mode in the secondary region can be switched to active to keep synchronization running.
    fr: Microsoft recommande au moins un contrôleur de domaine supplémentaire, avec les rôles de catalogue global et DNS, dans la région secondaire, pour que les hôtes de session puissent s'authentifier en cas de perte de la région principale. Un second serveur Microsoft Entra Connect en mode intermédiaire dans la région secondaire peut être rendu actif pour que la synchronisation continue.
  options:
    c: { en: "Replica sets apply to a Microsoft Entra Domain Services managed domain; Woodgrove uses its own AD DS domain.", fr: "Les jeux de réplicas s'appliquent à un domaine managé Microsoft Entra Domain Services ; Woodgrove utilise son propre domaine AD DS." }
    d: { en: "Microsoft Entra ID is a global service that needs no extra disaster recovery action; a second tenant would split the identities.", fr: "Microsoft Entra ID est un service global qui ne demande aucune action de reprise d'activité supplémentaire ; un second locataire scinderait les identités." }
references:
  - title: Multiregion BCDR for Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/architecture/example-scenario/azure-virtual-desktop/azure-virtual-desktop-multi-region-bcdr
