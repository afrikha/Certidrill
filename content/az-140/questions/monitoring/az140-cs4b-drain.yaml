id: az140-cs4b-drain
objective: "4.1.6"
type: multi
caseStudy: az140-cs4b-proseware
difficulty: 1
status: draft
stem:
  en: |
    The platform team will patch SH-CTR-2 tonight. Three contractors are connected to SH-CTR-2.

    You need to meet the maintenance requirement.

    Which two actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    L'équipe plateforme mettra à jour SH-CTR-2 ce soir. Trois prestataires sont connectés à SH-CTR-2.

    Vous devez satisfaire l'exigence de maintenance.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Run Update-AzWvdSessionHost with -AllowNewSession:$false for SH-CTR-2.", fr: "Exécuter Update-AzWvdSessionHost avec -AllowNewSession:$false pour SH-CTR-2." } }
    - { id: b, text: { en: "Run Disconnect-AzWvdUserSession for each user session on SH-CTR-2.", fr: "Exécuter Disconnect-AzWvdUserSession pour chaque session utilisateur de SH-CTR-2." } }
    - { id: c, text: { en: "Run Send-AzWvdUserSessionMessage for each user session on SH-CTR-2.", fr: "Exécuter Send-AzWvdUserSessionMessage pour chaque session utilisateur de SH-CTR-2." } }
    - { id: d, text: { en: "Run Remove-AzWvdUserSession for each user session on SH-CTR-2.", fr: "Exécuter Remove-AzWvdUserSession pour chaque session utilisateur de SH-CTR-2." } }
    - { id: e, text: { en: "Stop and deallocate SH-CTR-2 from the Azure portal.", fr: "Arrêter et désallouer SH-CTR-2 depuis le portail Azure." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |
      Setting AllowNewSession to false turns on drain mode: SH-CTR-2 accepts no new sessions and new connections go to the other session hosts, while existing sessions stay active until the users sign out. Send-AzWvdUserSessionMessage displays a message in each user session, so the connected contractors are warned and can save their work and sign out themselves.
    fr: |
      Définir AllowNewSession sur false active le mode drainage : SH-CTR-2 n'accepte plus de nouvelles sessions et les nouvelles connexions sont dirigées vers les autres hôtes de session, tandis que les sessions existantes restent actives jusqu'à ce que les utilisateurs les ferment. Send-AzWvdUserSessionMessage affiche un message dans chaque session utilisateur : les prestataires connectés sont avertis et peuvent enregistrer leur travail et fermer leur session eux-mêmes.
  options:
    b: { en: "Disconnecting the sessions interrupts the contractors without a warning, and it doesn't prevent new connections to SH-CTR-2.", fr: "Déconnecter les sessions interrompt les prestataires sans avertissement et n'empêche pas les nouvelles connexions à SH-CTR-2." }
    d: { en: "Removing the user sessions ends them before the contractors can save their work.", fr: "Supprimer les sessions utilisateur y met fin avant que les prestataires puissent enregistrer leur travail." }
    e: { en: "Deallocating the VM ends every session on it at once, without a warning.", fr: "Désallouer la machine virtuelle met fin immédiatement à toutes ses sessions, sans avertissement." }
references:
  - title: Drain session hosts for maintenance in Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/drain-mode
  - title: Send-AzWvdUserSessionMessage (Az.DesktopVirtualization)
    url: https://learn.microsoft.com/en-us/powershell/module/az.desktopvirtualization/send-azwvdusersessionmessage
