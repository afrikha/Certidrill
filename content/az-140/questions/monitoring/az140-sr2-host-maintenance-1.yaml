id: az140-sr2-host-maintenance-1
objective: "4.1.6"
type: series_yesno
series: az140-sr2-host-maintenance
seriesOrder: 1
difficulty: 3
status: draft
stem:
  en: |
    You turn on drain mode for SH4.
  fr: |
    Vous activez le mode drainage pour SH4.
body:
  solution:
    en: |
      In the Azure portal, you open **Host pools** > **Pool4** > **Session hosts**, select SH4 and select **Turn drain mode on**. You don't change SP1 or the tags of SH4.
    fr: |
      Dans le portail Azure, vous ouvrez **Host pools** > **Pool4** > **Session hosts**, sélectionnez SH4 et sélectionnez **Turn drain mode on**. Vous ne modifiez ni SP1 ni les étiquettes de SH4.
answer: { value: false }
explanation:
  correct:
    en: Drain mode blocks new sessions while existing sessions continue, but for pooled host pools autoscale overwrites drain mode, so SP1 can put SH4 back into service. During ramp-down, autoscale can also select SH4 once it has no sessions, put it in drain mode and turn it off, so SH4 wouldn't stay running. A host under maintenance in a pool covered by a scaling plan also needs the exclusion tag.
    fr: "Le mode drainage bloque les nouvelles sessions tandis que les sessions existantes continuent, mais pour les pools d'hôtes regroupés la mise à l'échelle automatique écrase le mode drainage : SP1 peut remettre SH4 en service. Pendant la baisse de charge, la mise à l'échelle automatique peut aussi choisir SH4 dès qu'il n'a plus de session, le mettre en mode drainage et l'arrêter : SH4 ne resterait pas en cours d'exécution. Un hôte en maintenance dans un pool couvert par un plan de mise à l'échelle a aussi besoin de l'étiquette d'exclusion."
references:
  - title: Autoscale scaling plans and example scenarios in Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/autoscale-scenarios
