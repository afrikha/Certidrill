id: az140-cs3a-lab-dr
objective: "4.2.2"
type: single
caseStudy: az140-cs3a-trey-research
difficulty: 2
status: draft
stem:
  en: |
    You need to meet the disaster recovery requirement for HP-Lab. What should you implement?
  fr: |
    Vous devez satisfaire l'exigence de reprise d'activité de HP-Lab. Que devez-vous implémenter ?
body:
  options:
    - { id: a, text: { en: "Azure Backup for the HP-Lab VMs with a daily policy and Cross Region Restore enabled on the vault", fr: "Sauvegarde Azure pour les machines virtuelles de HP-Lab avec une stratégie quotidienne et la restauration interrégion activée sur le coffre" } }
    - { id: b, text: { en: "Azure Site Recovery replication of the HP-Lab VMs from West Europe to North Europe", fr: "La réplication Azure Site Recovery des machines virtuelles de HP-Lab de West Europe vers North Europe" } }
    - { id: c, text: { en: "FSLogix Cloud Cache on the HP-Lab session hosts with one location in each region", fr: "FSLogix Cloud Cache sur les hôtes de session de HP-Lab avec un emplacement dans chaque région" } }
    - { id: d, text: { en: "A second personal host pool in North Europe deployed from the same Azure Compute Gallery image", fr: "Un second pool d'hôtes personnel dans North Europe déployé à partir de la même image Azure Compute Gallery" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Microsoft's multiregion guidance for Azure Virtual Desktop recommends Site Recovery for personal host pools, configured at the VM level. It replicates the OS and data disks continuously, with a typical RPO of 5 to 15 minutes, so the acquisition data on the data disks is recovered with the VMs. Don't use test failover for session hosts: the duplicate VM would register with the Azure Virtual Desktop service.
    fr: |
      Les recommandations multirégions de Microsoft pour Azure Virtual Desktop préconisent Site Recovery pour les pools d'hôtes personnels, configuré au niveau de chaque machine virtuelle. Il réplique en continu les disques du système d'exploitation et de données, avec un RPO typique de 5 à 15 minutes : les données d'acquisition des disques de données sont récupérées avec les machines virtuelles. N'utilisez pas le test de basculement pour des hôtes de session : la machine virtuelle dupliquée s'inscrirait auprès du service Azure Virtual Desktop.
  options:
    a: { en: "A daily backup gives an RPO of up to 24 hours, far above the 15-minute target.", fr: "Une sauvegarde quotidienne donne un RPO pouvant atteindre 24 heures, bien au-delà de l'objectif de 15 minutes." }
    c: { en: "Cloud Cache replicates FSLogix profile containers; the acquisition data is on the VM data disks, not in a profile.", fr: "Cloud Cache réplique des conteneurs de profils FSLogix ; les données d'acquisition se trouvent sur les disques de données des machines virtuelles, pas dans un profil." }
    d: { en: "New VMs built from the image contain no acquisition data, so the scientists' data would be lost.", fr: "De nouvelles machines virtuelles créées à partir de l'image ne contiennent aucune donnée d'acquisition : les données des scientifiques seraient perdues." }
references:
  - title: Multiregion BCDR for Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/architecture/example-scenario/azure-virtual-desktop/azure-virtual-desktop-multi-region-bcdr
