id: az140-4a-scaling-plan-order
objective: "4.1.5"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    You have a pooled host pool named **HP1** in a subscription named **Sub1**. A custom max session limit is already set on HP1. No role is assigned to the Azure Virtual Desktop service principal.

    You need to create a power management scaling plan named **SP1** in the Azure portal and use it to scale HP1.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Vous disposez d'un pool d'hôtes regroupé nommé **HP1** dans un abonnement nommé **Sub1**. Une limite maximale de sessions personnalisée est déjà définie sur HP1. Aucun rôle n'est attribué au principal de service Azure Virtual Desktop.

    Vous devez créer dans le portail Azure un plan de mise à l'échelle de type gestion de l'alimentation nommé **SP1** et l'utiliser pour mettre à l'échelle HP1.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: role, text: { en: "Assign the Desktop Virtualization Power On Off Contributor role to the Azure Virtual Desktop service principal on Sub1.", fr: "Attribuer le rôle Desktop Virtualization Power On Off Contributor au principal de service Azure Virtual Desktop sur Sub1." } }
    - { id: basics, text: { en: "On the Basics tab, select the time zone, the Pooled host pool type and Power management autoscaling.", fr: "Dans l'onglet Basics, sélectionner le fuseau horaire, le type de pool d'hôtes Pooled et Power management autoscaling." } }
    - { id: sched, text: { en: "On the Schedules tab, add a schedule with its ramp-up, peak, ramp-down and off-peak settings.", fr: "Dans l'onglet Schedules, ajouter une planification avec ses paramètres de montée en charge, pointe, baisse de charge et heures creuses." } }
    - { id: assign, text: { en: "On the Host pool assignments tab, select HP1 and keep Enable autoscale selected.", fr: "Dans l'onglet Host pool assignments, sélectionner HP1 et laisser Enable autoscale coché." } }
    - { id: poweron, text: { en: "Assign the Desktop Virtualization Power On Contributor role to the Azure Virtual Desktop service principal on HP1.", fr: "Attribuer le rôle Desktop Virtualization Power On Contributor au principal de service Azure Virtual Desktop sur HP1." } }
    - { id: svmoc, text: { en: "Enable Start VM on Connect in the properties of HP1.", fr: "Activer Start VM on Connect dans les propriétés de HP1." } }
    - { id: drain, text: { en: "Turn on drain mode on all the session hosts of HP1.", fr: "Activer le mode drainage sur tous les hôtes de session de HP1." } }
answer:
  sequence: [ role, basics, sched, assign ]
explanation:
  correct:
    en: Before autoscale can work, the Azure Virtual Desktop service principal (or a managed identity of the host pool) needs Desktop Virtualization Power On Off Contributor on each subscription that contains the host pools and session hosts. You then create the scaling plan in the order of the wizard tabs, Basics, Schedules and Host pool assignments; assigning HP1 with Enable autoscale selected applies the plan.
    fr: Avant que la mise à l'échelle automatique puisse fonctionner, le principal de service Azure Virtual Desktop (ou une identité managée du pool d'hôtes) doit disposer de Desktop Virtualization Power On Off Contributor sur chaque abonnement qui contient les pools d'hôtes et les hôtes de session. Vous créez ensuite le plan dans l'ordre des onglets de l'assistant, Basics, Schedules et Host pool assignments ; attribuer HP1 avec Enable autoscale coché applique le plan.
  options:
    poweron: { en: "Power On Contributor only starts VMs, and a scope lower than the subscription prevents autoscale from working properly.", fr: "Power On Contributor permet seulement de démarrer les machines virtuelles, et une étendue inférieure à l'abonnement empêche la mise à l'échelle automatique de fonctionner correctement." }
    svmoc: { en: "Start VM on Connect is recommended for personal host pools; it isn't required to create a pooled scaling plan.", fr: "Start VM on Connect est recommandé pour les pools personnels ; il n'est pas requis pour créer un plan de mise à l'échelle regroupé." }
    drain: { en: "Autoscale manages drain mode itself; draining every host would block new sessions.", fr: "La mise à l'échelle automatique gère elle-même le mode drainage ; drainer tous les hôtes bloquerait les nouvelles sessions." }
references:
  - title: Create and assign an autoscale scaling plan for Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/autoscale-scaling-plan
