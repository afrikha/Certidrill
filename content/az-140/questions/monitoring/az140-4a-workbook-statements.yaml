id: az140-4a-workbook-statements
objective: "4.1.3"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    You open Azure Virtual Desktop Insights, select **Edit**, add several steps and save the result as a workbook named **AVD-Ops**.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous ouvrez Azure Virtual Desktop Insights, sélectionnez **Modifier**, ajoutez plusieurs étapes et enregistrez le résultat comme workbook nommé **AVD-Ops**.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: Saving AVD-Ops creates an Azure Resource Manager resource, and the Insights template that other administrators open stays unchanged.
        fr: L'enregistrement d'AVD-Ops crée une ressource Azure Resource Manager, et le modèle Insights qu'ouvrent les autres administrateurs reste inchangé.
    - id: s2
      text:
        en: A parameter that you create inside a group of AVD-Ops can be referenced by the steps that are outside that group.
        fr: Un paramètre créé à l'intérieur d'un groupe d'AVD-Ops peut être référencé par les étapes situées en dehors de ce groupe.
    - id: s3
      text:
        en: To declare a global parameter in AVD-Ops, you select **Treat this parameter as a global** in the advanced settings of a parameters step.
        fr: Pour déclarer un paramètre global dans AVD-Ops, vous sélectionnez **Treat this parameter as a global** dans les paramètres avancés d'une étape de paramètres.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: Saving a workbook creates an associated Azure Resource Manager resource, while opening a template only creates a transient workbook; your changes leave the original template untouched. A group is a scope, so parameters created inside it are visible only inside it. A global parameter must be declared in a parameters step with the Treat this parameter as a global option; other steps can only update it.
    fr: "L'enregistrement d'un workbook crée une ressource Azure Resource Manager associée, alors que l'ouverture d'un modèle ne crée qu'un workbook transitoire ; vos modifications laissent le modèle d'origine intact. Un groupe est une étendue : les paramètres créés à l'intérieur ne sont visibles qu'à l'intérieur. Un paramètre global doit être déclaré dans une étape de paramètres avec l'option Treat this parameter as a global ; les autres étapes peuvent seulement le mettre à jour."
references:
  - title: Azure Workbooks templates
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/visualize/workbooks-templates
  - title: Create workbook parameters
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/visualize/workbooks-parameters
