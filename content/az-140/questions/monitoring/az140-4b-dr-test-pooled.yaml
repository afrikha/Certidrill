id: az140-4b-dr-test-pooled
objective: "4.2.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Wingtip Toys has an active-passive disaster recovery design for Azure Virtual Desktop:

    | Host pool | Region | Application groups | Assigned group |
    | --- | --- | --- | --- |
    | HP-WEU (pooled) | West Europe | DAG-WEU, APPG-WEU | GRP-Staff |
    | HP-NEU (pooled) | North Europe | DAG-NEU, APPG-NEU | None |

    All four application groups are registered in the same workspace. FSLogix Cloud Cache replicates the profiles between both regions. The HP-NEU session hosts are deallocated.

    You need to validate every quarter that the applications work on HP-NEU. Members of GRP-Staff must not be affected.

    What should you do?
  fr: |
    Wingtip Toys utilise une conception de reprise d'activité actif-passif pour Azure Virtual Desktop :

    | Pool d'hôtes | Région | Groupes d'applications | Groupe attribué |
    | --- | --- | --- | --- |
    | HP-WEU (regroupé) | West Europe | DAG-WEU, APPG-WEU | GRP-Staff |
    | HP-NEU (regroupé) | North Europe | DAG-NEU, APPG-NEU | Aucun |

    Les quatre groupes d'applications sont inscrits dans le même espace de travail. FSLogix Cloud Cache réplique les profils entre les deux régions. Les hôtes de session de HP-NEU sont désalloués.

    Vous devez vérifier chaque trimestre que les applications fonctionnent sur HP-NEU. Les membres de GRP-Staff ne doivent pas être affectés.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Replicate two HP-WEU session hosts with Azure Site Recovery and run a test failover to North Europe.", fr: "Répliquer deux hôtes de session de HP-WEU avec Azure Site Recovery et exécuter un test de basculement vers North Europe." } }
    - { id: b, text: { en: "Start some HP-NEU session hosts, then assign a group of test users to DAG-NEU and APPG-NEU.", fr: "Démarrer quelques hôtes de session de HP-NEU, puis attribuer un groupe d'utilisateurs de test à DAG-NEU et APPG-NEU." } }
    - { id: c, text: { en: "Start some HP-NEU session hosts, then assign GRP-Staff to DAG-NEU and APPG-NEU as well.", fr: "Démarrer quelques hôtes de session de HP-NEU, puis attribuer également GRP-Staff à DAG-NEU et APPG-NEU." } }
    - { id: d, text: { en: "Start some HP-NEU session hosts, then move the GRP-Staff assignments to DAG-NEU and APPG-NEU.", fr: "Démarrer quelques hôtes de session de HP-NEU, puis déplacer les attributions de GRP-Staff vers DAG-NEU et APPG-NEU." } }
answer: { optionId: b }
explanation:
  correct:
    en: Microsoft's guidance is to test with a dedicated group (for example GRP-TEST) that contains test accounts and to fail over only that group to the secondary application groups. Production users keep their assignments on HP-WEU, so they aren't affected, and the test exercises the same failover procedure as a real outage.
    fr: Les recommandations de Microsoft consistent à tester avec un groupe dédié (par exemple GRP-TEST) contenant des comptes de test, et à ne basculer que ce groupe vers les groupes d'applications secondaires. Les utilisateurs de production gardent leurs attributions sur HP-WEU et ne sont donc pas affectés, et le test reprend la même procédure de basculement qu'une véritable panne.
  options:
    a: { en: "Don't use Site Recovery test failover on session hosts: the duplicate VM registers with the control plane and conflicts with the original.", fr: "N'utilisez pas le test de basculement Site Recovery sur des hôtes de session : la machine virtuelle dupliquée s'inscrit auprès du plan de contrôle et entre en conflit avec l'originale." }
    c: { en: "GRP-Staff members would see both sets of resources and could open sessions in both host pools, which conflicts with the FSLogix profile lock.", fr: "Les membres de GRP-Staff verraient les deux ensembles de ressources et pourraient ouvrir des sessions dans les deux pools d'hôtes, ce qui entre en conflit avec le verrou de profil FSLogix." }
    d: { en: "Moving the production assignments is a real failover: GRP-Staff users would be disconnected from HP-WEU.", fr: "Déplacer les attributions de production revient à un véritable basculement : les utilisateurs de GRP-Staff seraient déconnectés de HP-WEU." }
references:
  - title: Multiregion BCDR for Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/architecture/example-scenario/azure-virtual-desktop/azure-virtual-desktop-multi-region-bcdr
