id: az140-4b-bk-primary-only
objective: "4.2.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam has an active-passive Azure Virtual Desktop deployment. FSLogix Cloud Cache writes every profile container to two Azure file shares:

    | Storage account | Region | Role |
    | --- | --- | --- |
    | stprofcus | Central US | Primary region |
    | stprofeus2 | East US 2 | Disaster recovery region |

    You need to protect the profiles against accidental deletion and corruption, for example by ransomware. The solution must minimize cost.

    What should you back up with Azure Backup?
  fr: |
    Fabrikam dispose d'un déploiement Azure Virtual Desktop actif-passif. FSLogix Cloud Cache écrit chaque conteneur de profil dans deux partages de fichiers Azure :

    | Compte de stockage | Région | Rôle |
    | --- | --- | --- |
    | stprofcus | Central US | Région principale |
    | stprofeus2 | East US 2 | Région de reprise d'activité |

    Vous devez protéger les profils contre une suppression accidentelle et une corruption, par exemple par un rançongiciel. La solution doit réduire les coûts au minimum.

    Que devez-vous sauvegarder avec Sauvegarde Azure ?
body:
  options:
    - { id: a, text: { en: "The profile shares in both stprofcus and stprofeus2", fr: "Les partages de profils de stprofcus et de stprofeus2" } }
    - { id: b, text: { en: "Only the profile share in stprofcus", fr: "Uniquement le partage de profils de stprofcus" } }
    - { id: c, text: { en: "Only the profile share in stprofeus2", fr: "Uniquement le partage de profils de stprofeus2" } }
    - { id: d, text: { en: "Nothing, because Cloud Cache already keeps two copies of each profile", fr: "Rien, car Cloud Cache conserve déjà deux copies de chaque profil" } }
answer: { optionId: b }
explanation:
  correct:
    en: Microsoft recommends backing up the primary-region storage and generally not backing up the disaster recovery environment. The DR share holds the same data, so backing it up too would double the cost without adding protection.
    fr: "Microsoft recommande de sauvegarder le stockage de la région principale et, en général, de ne pas sauvegarder l'environnement de reprise d'activité. Le partage de reprise contient les mêmes données : le sauvegarder lui aussi doublerait le coût sans ajouter de protection."
  options:
    a: { en: "Both shares contain the same profiles; backing up the DR copy adds cost but no extra recovery point.", fr: "Les deux partages contiennent les mêmes profils ; sauvegarder la copie de reprise ajoute un coût sans point de récupération supplémentaire." }
    c: { en: "The primary-region storage is the one to back up; the DR region is used only during a failover.", fr: "C'est le stockage de la région principale qu'il faut sauvegarder ; la région de reprise n'est utilisée que pendant un basculement." }
    d: { en: "Cloud Cache replicates every change, including deletions and corrupted data, to all locations; it isn't a backup.", fr: "Cloud Cache réplique chaque modification, y compris les suppressions et les données corrompues, vers tous les emplacements ; ce n'est pas une sauvegarde." }
references:
  - title: Multiregion BCDR for Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/architecture/example-scenario/azure-virtual-desktop/azure-virtual-desktop-multi-region-bcdr
