id: az140-4a-depth-first-limit
objective: "4.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have a pooled host pool named **HP1** that contains six session hosts. HP1 was created with the breadth-first load balancing algorithm and its default settings. To reduce costs, you change the load balancing algorithm of HP1 to depth-first.

    The next morning, Azure Virtual Desktop Insights shows that all the user sessions are on the first session host, which has a very high input delay, while the other five session hosts have no sessions. You need to fix the issue. The solution must keep depth-first load balancing.

    What should you do?
  fr: |
    Vous disposez d'un pool d'hôtes regroupé nommé **HP1** qui contient six hôtes de session. HP1 a été créé avec l'algorithme d'équilibrage de charge en largeur d'abord (breadth-first) et ses paramètres par défaut. Pour réduire les coûts, vous passez l'algorithme d'équilibrage de charge de HP1 en profondeur d'abord (depth-first).

    Le lendemain matin, Azure Virtual Desktop Insights montre que toutes les sessions utilisateur se trouvent sur le premier hôte de session, dont le délai d'entrée est très élevé, alors que les cinq autres hôtes n'ont aucune session. Vous devez corriger le problème. La solution doit conserver l'équilibrage de charge en profondeur d'abord.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Enable Start VM on Connect on HP1.", fr: "Activer Start VM on Connect sur HP1." } }
    - { id: b, text: { en: "Turn on drain mode on the five idle session hosts.", fr: "Activer le mode drainage sur les cinq hôtes de session inactifs." } }
    - { id: c, text: { en: "Change the host pool type of HP1 to personal with automatic assignment.", fr: "Changer le type de HP1 en pool personnel avec attribution automatique." } }
    - { id: d, text: { en: "Set the max session limit of HP1 to the number of users a host supports.", fr: "Définir la limite maximale de sessions de HP1 sur le nombre d'utilisateurs qu'un hôte peut accueillir." } }
answer: { optionId: d }
explanation:
  correct:
    en: When breadth-first is selected at creation, the max session limit defaults to 999999. Depth-first fills one session host until it reaches the max session limit before it uses the next one, so with the default value every session lands on the first host. Setting a realistic max session limit makes depth-first move to the next host once a host is full.
    fr: Quand breadth-first est choisi à la création, la limite maximale de sessions vaut 999999 par défaut. Depth-first remplit un hôte de session jusqu'à sa limite maximale de sessions avant d'utiliser le suivant ; avec la valeur par défaut, toutes les sessions arrivent donc sur le premier hôte. Une limite maximale de sessions réaliste fait passer depth-first à l'hôte suivant dès qu'un hôte est plein.
  options:
    a: { en: "Start VM on Connect starts a deallocated VM when a user connects; the five hosts are already running and receive no sessions.", fr: "Start VM on Connect démarre une machine virtuelle libérée quand un utilisateur se connecte ; les cinq hôtes tournent déjà et ne reçoivent aucune session." }
    b: { en: "Drain mode would block new sessions on the idle hosts, which makes the problem worse.", fr: "Le mode drainage bloquerait les nouvelles sessions sur les hôtes inactifs, ce qui aggraverait le problème." }
    c: { en: "Load balancing doesn't apply to personal host pools, so this wouldn't keep depth-first, and each user would need a dedicated session host.", fr: "L'équilibrage de charge ne s'applique pas aux pools personnels : cela ne conserverait pas depth-first, et chaque utilisateur aurait besoin d'un hôte de session dédié." }
references:
  - title: Configure host pool load balancing in Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/configure-host-pool-load-balancing
