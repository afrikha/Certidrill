id: az140-4b-update-shu-batches
objective: "4.2.1"
type: dropdown
difficulty: 2
status: draft
shuffle: false
stem:
  en: |
    Northwind Traders has an Azure Virtual Desktop pooled host pool named **HP-Sales** that was created with a session host configuration. HP-Sales contains 12 session hosts, and all of them are running.

    You create a session host update for HP-Sales and set the batch size (the maximum number of session hosts removed from the host pool at a time) to 4.

    How will the update run? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind Traders dispose d'un pool d'hôtes Azure Virtual Desktop regroupé nommé **HP-Sales**, créé avec une configuration d'hôte de session. HP-Sales contient 12 hôtes de session, tous en cours d'exécution.

    Vous créez une mise à jour des hôtes de session pour HP-Sales et définissez la taille de lot (le nombre maximal d'hôtes de session retirés du pool d'hôtes en même temps) sur 4.

    Comment la mise à jour va-t-elle se dérouler ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      The update first replaces [[first]] session host(s).

      During each of the following batches, at least [[avail]] session hosts remain available to users.

      If the first session host fails to update, [[fail]].
    fr: |
      La mise à jour remplace d'abord [[first]] hôte(s) de session.

      Pendant chacun des lots suivants, au moins [[avail]] hôtes de session restent disponibles pour les utilisateurs.

      Si la mise à jour du premier hôte de session échoue, [[fail]].
  slots:
    - id: first
      options:
        - { id: f1, text: "1" }
        - { id: f2, text: "2" }
        - { id: f4, text: "4" }
        - { id: f12, text: "12" }
    - id: avail
      options:
        - { id: a4, text: "4" }
        - { id: a7, text: "7" }
        - { id: a8, text: "8" }
        - { id: a11, text: "11" }
    - id: fail
      options:
        - { id: cont, text: { en: "the update continues with the next batch", fr: "la mise à jour continue avec le lot suivant" } }
        - { id: roll, text: { en: "the update rolls back every session host to the previous image", fr: "la mise à jour ramène chaque hôte de session à l'image précédente" } }
        - { id: stop, text: { en: "the update stops", fr: "la mise à jour s'arrête" } }
answer:
  values: { first: f1, avail: a8, fail: stop }
explanation:
  correct:
    en: |
      Session host update starts with an initial run on a single session host to validate the process. If that initial update fails, the update stops, which protects the rest of the host pool. The remaining 11 hosts are then updated in batches of up to 4, so at most 4 hosts are unavailable at a time and at least 8 of the 12 stay available.
    fr: |
      La mise à jour des hôtes de session commence par une exécution initiale sur un seul hôte de session pour valider le processus. Si cette mise à jour initiale échoue, la mise à jour s'arrête, ce qui protège le reste du pool d'hôtes. Les 11 hôtes restants sont ensuite mis à jour par lots de 4 au plus : au plus 4 hôtes sont indisponibles en même temps, et au moins 8 des 12 restent disponibles.
  options:
    f4: { en: "The batch size applies after the initial run on one session host.", fr: "La taille de lot s'applique après l'exécution initiale sur un seul hôte de session." }
    a11: { en: "11 hosts stay available only during the initial run; later batches remove up to 4 hosts.", fr: "11 hôtes ne restent disponibles que pendant l'exécution initiale ; les lots suivants retirent jusqu'à 4 hôtes." }
    roll: { en: "When the initial update fails, the update stops and nothing is rolled out to the other hosts; you can then retry or cancel it.", fr: "Quand la mise à jour initiale échoue, la mise à jour s'arrête sans toucher aux autres hôtes ; vous pouvez ensuite la réessayer ou l'annuler." }
references:
  - title: Session host update
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/session-host-update
  - title: Update session hosts in a host pool with a session host configuration in Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/session-host-update-configure
