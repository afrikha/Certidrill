id: az140-4a-insights-reports
objective: "4.1.2"
type: hotarea
difficulty: 1
status: draft
stem:
  en: |
    You use Azure Virtual Desktop Insights to monitor a host pool named **HP1**. The following table lists the reports that Insights shows for HP1.

    Which report should you open for each task? Answer each prompt by selecting the appropriate report.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous utilisez Azure Virtual Desktop Insights pour superviser un pool d'hôtes nommé **HP1**. Le tableau suivant liste les rapports qu'Insights affiche pour HP1.

    Quel rapport devez-vous ouvrir pour chaque tâche ? Répondez à chaque consigne en sélectionnant le rapport approprié.

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
    - id: p1
      text: { en: "List the users who connect with an older version of Windows App than the newest one", fr: "Lister les utilisateurs qui se connectent avec une version de Windows App plus ancienne que la plus récente" }
    - id: p2
      text: { en: "Compare the median round-trip time of the sessions by gateway region", fr: "Comparer le temps d'aller-retour médian des sessions par région de passerelle" }
  grid:
    header: [{ en: "Insights report", fr: "Rapport Insights" }]
    rows:
      - [{ text: Connection Reliability, area: rel }]
      - [{ text: Connection Performance, area: perf }]
      - [{ text: Host Performance, area: hostperf }]
      - [{ text: Host Diagnostics, area: hostdiag }]
      - [{ text: Utilization, area: util }]
      - [{ text: Clients, area: clients }]
answer:
  values: { p1: clients, p2: perf }
explanation:
  correct:
    en: The Clients report summarizes the client versions in use, marks the newest version of each client and lists the users with potentially outdated clients. The Connection Performance report shows round-trip time (RTT) by gateway region, with the median and 95th percentile, and lets you drill down to the users with the highest RTT.
    fr: Le rapport Clients résume les versions de client utilisées, signale la version la plus récente de chaque client et liste les utilisateurs dont le client est potentiellement obsolète. Le rapport Connection Performance affiche le temps d'aller-retour (RTT) par région de passerelle, avec la médiane et le 95e centile, et permet d'explorer les utilisateurs dont le RTT est le plus élevé.
  options:
    rel: { en: "Connection Reliability shows disconnections compared with concurrent connections.", fr: "Connection Reliability montre les déconnexions par rapport aux connexions simultanées." }
    hostperf: { en: "Host Performance shows user input delay and CPU, memory and disk metrics of the hosts.", fr: "Host Performance montre le délai d'entrée utilisateur et les métriques de processeur, de mémoire et de disque des hôtes." }
references:
  - title: Use cases for Azure Virtual Desktop Insights
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/insights-use-cases
