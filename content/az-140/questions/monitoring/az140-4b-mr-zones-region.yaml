id: az140-4b-mr-zones-region
objective: "4.2.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Northwind Traders has an Azure Virtual Desktop pooled host pool named **HP-Ops** in the Sweden Central region. The session hosts are spread across availability zones 1, 2 and 3, and the FSLogix profiles are stored in a zone-redundant (ZRS) storage account in Sweden Central.

    A new requirement states that users must be able to keep working on Azure Virtual Desktop if the whole Sweden Central region becomes unavailable.

    What should you add to the design?
  fr: |
    Northwind Traders dispose d'un pool d'hôtes Azure Virtual Desktop regroupé nommé **HP-Ops** dans la région Sweden Central. Les hôtes de session sont répartis entre les zones de disponibilité 1, 2 et 3, et les profils FSLogix sont stockés dans un compte de stockage redondant interzone (ZRS) de Sweden Central.

    Une nouvelle exigence impose que les utilisateurs puissent continuer à travailler sur Azure Virtual Desktop si toute la région Sweden Central devient indisponible.

    Que devez-vous ajouter à la conception ?
body:
  options:
    - { id: a, text: { en: "More session hosts in each availability zone of Sweden Central", fr: "Davantage d'hôtes de session dans chaque zone de disponibilité de Sweden Central" } }
    - { id: b, text: { en: "A second host pool in another region, with profiles replicated there", fr: "Un second pool d'hôtes dans une autre région, avec les profils répliqués vers celle-ci" } }
    - { id: c, text: { en: "An availability set for the session hosts of HP-Ops", fr: "Un groupe à haute disponibilité pour les hôtes de session de HP-Ops" } }
    - { id: d, text: { en: "A second zone-redundant profile storage account in Sweden Central", fr: "Un second compte de stockage de profils redondant interzone dans Sweden Central" } }
answer: { optionId: b }
explanation:
  correct:
    en: Availability zones protect against the failure of a datacenter inside a region, not against a regional outage; they aren't a disaster recovery solution. To survive the loss of Sweden Central, you need session hosts in a second region (a secondary host pool) and the profiles available there, for example with FSLogix Cloud Cache.
    fr: Les zones de disponibilité protègent contre la défaillance d'un centre de données au sein d'une région, pas contre une panne régionale ; elles ne constituent pas une solution de reprise d'activité. Pour survivre à la perte de Sweden Central, il faut des hôtes de session dans une seconde région (un pool d'hôtes secondaire) et des profils disponibles dans celle-ci, par exemple avec FSLogix Cloud Cache.
  options:
    a: { en: "Extra hosts in the same region give more capacity and zone resilience, but they are lost with the region.", fr: "Des hôtes supplémentaires dans la même région apportent de la capacité et de la résilience de zone, mais ils sont perdus avec la région." }
    c: { en: "An availability set protects against host and rack failures inside one datacenter; it gives less protection than zones, not more.", fr: "Un groupe à haute disponibilité protège contre les défaillances d'hôte et de rack au sein d'un centre de données ; il protège moins que les zones, pas plus." }
    d: { en: "A second account in the same region doesn't help if the region is unavailable.", fr: "Un second compte dans la même région n'aide pas si la région est indisponible." }
references:
  - title: Multiregion BCDR for Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/architecture/example-scenario/azure-virtual-desktop/azure-virtual-desktop-multi-region-bcdr
