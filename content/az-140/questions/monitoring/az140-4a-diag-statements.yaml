id: az140-4a-diag-statements
objective: "4.1.1"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    You have an Azure Virtual Desktop host pool named **HP1** that users have been using for several months. Today, you add a diagnostic setting to HP1 that sends the Connections, Errors and Checkpoints categories to a Log Analytics workspace named **LAW1**.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un pool d'hôtes Azure Virtual Desktop nommé **HP1** que les utilisateurs utilisent depuis plusieurs mois. Aujourd'hui, vous ajoutez à HP1 un paramètre de diagnostic qui envoie les catégories Connections, Errors et Checkpoints vers un espace de travail Log Analytics nommé **LAW1**.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: The WVDConnections table in LAW1 will contain the connections that users made to HP1 during the week before you added the diagnostic setting.
        fr: La table WVDConnections de LAW1 contiendra les connexions établies par les utilisateurs vers HP1 pendant la semaine précédant l'ajout du paramètre de diagnostic.
    - id: s2
      text:
        en: A WVDErrors record whose ServiceError value is false usually indicates a problem that an administrator can resolve.
        fr: Un enregistrement WVDErrors dont la valeur ServiceError est false indique généralement un problème qu'un administrateur peut résoudre.
    - id: s3
      text:
        en: A connection attempt that fails on the user's home network before it reaches Azure Virtual Desktop is recorded in WVDConnections.
        fr: Une tentative de connexion qui échoue sur le réseau domestique de l'utilisateur avant d'atteindre Azure Virtual Desktop est enregistrée dans WVDConnections.
answer:
  values: { s1: false, s2: true, s3: false }
explanation:
  correct:
    en: Diagnostic data exists only for activity that happens after the diagnostic setting is enabled, so earlier connections are not backfilled. ServiceError = false means the cause is outside the service and can usually be fixed by administrative tasks; true means an issue to escalate to Microsoft with the CorrelationId. Connections that never reach Azure Virtual Desktop don't appear in the diagnostics, because the diagnostics role service is part of Azure Virtual Desktop.
    fr: "Les données de diagnostic n'existent que pour l'activité qui suit l'activation du paramètre de diagnostic : les connexions antérieures ne sont pas rétroactivement chargées. ServiceError = false signifie que la cause est extérieure au service et peut généralement être corrigée par des tâches d'administration ; true signale un problème à remonter à Microsoft avec le CorrelationId. Les connexions qui n'atteignent jamais Azure Virtual Desktop n'apparaissent pas dans les diagnostics, car le service de diagnostic fait partie d'Azure Virtual Desktop."
references:
  - title: Azure Virtual Desktop diagnostics log analytics
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/diagnostics-log-analytics
