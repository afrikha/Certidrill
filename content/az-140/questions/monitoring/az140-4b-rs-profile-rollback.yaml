id: az140-4b-rs-profile-rollback
objective: "4.2.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso stores the FSLogix profile containers of 400 Azure Virtual Desktop users in an Azure file share named **profiles**. Each user has a folder that contains their VHDX file. Azure Backup protects the share with a daily Snapshot tier policy.

    The profile of a user named **User1** became corrupted this morning. User1 is signed out of all sessions. You need to return User1's profile to its state of yesterday. The other users must not be affected.

    What should you do?
  fr: |
    Contoso stocke les conteneurs de profils FSLogix de 400 utilisateurs Azure Virtual Desktop dans un partage de fichiers Azure nommé **profiles**. Chaque utilisateur dispose d'un dossier qui contient son fichier VHDX. Sauvegarde Azure protège le partage avec une stratégie quotidienne du niveau Snapshot.

    Le profil d'un utilisateur nommé **User1** a été corrompu ce matin. User1 est déconnecté de toutes ses sessions. Vous devez ramener le profil de User1 à son état de la veille. Les autres utilisateurs ne doivent pas être affectés.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Run a Full Share Restore of yesterday's recovery point to the original location.", fr: "Exécuter une restauration complète du partage (Full Share Restore) du point de récupération de la veille vers l'emplacement d'origine." } }
    - { id: b, text: { en: "Run an Item Level Restore of User1's folder to the original location and overwrite.", fr: "Exécuter une restauration au niveau de l'élément (Item Level Restore) du dossier de User1 vers l'emplacement d'origine, avec remplacement." } }
    - { id: c, text: { en: "Restore the OS disk of the session host that User1 last used from a VM backup.", fr: "Restaurer le disque du système d'exploitation du dernier hôte de session utilisé par User1 à partir d'une sauvegarde de machine virtuelle." } }
    - { id: d, text: { en: "Delete User1's folder so that FSLogix creates a new profile at the next sign-in.", fr: "Supprimer le dossier de User1 pour que FSLogix crée un nouveau profil à la prochaine connexion." } }
answer: { optionId: b }
explanation:
  correct:
    en: Item Level Restore restores selected files or folders, here User1's profile folder, from a recovery point. Restoring to the original location and overwriting the conflicting files returns the VHDX to yesterday's state without touching the other profiles. The user must be signed out because the VHDX is locked while it's mounted.
    fr: La restauration au niveau de l'élément restaure les fichiers ou dossiers sélectionnés, ici le dossier de profil de User1, à partir d'un point de récupération. La restauration vers l'emplacement d'origine avec remplacement des fichiers en conflit ramène le VHDX à son état de la veille sans toucher aux autres profils. L'utilisateur doit être déconnecté, car le VHDX est verrouillé tant qu'il est monté.
  options:
    a: { en: "A full share restore to the original location rolls back the profiles of all 400 users.", fr: "Une restauration complète du partage vers l'emplacement d'origine ramène en arrière les profils des 400 utilisateurs." }
    c: { en: "The profile is stored in the file share, not on the session host's disks.", fr: "Le profil est stocké dans le partage de fichiers, pas sur les disques de l'hôte de session." }
    d: { en: "A new empty profile doesn't return User1's settings and data to yesterday's state.", fr: "Un nouveau profil vide ne ramène pas les paramètres et les données de User1 à leur état de la veille." }
references:
  - title: Restore Azure Files
    url: https://learn.microsoft.com/en-us/azure/backup/restore-afs
  - title: Support Matrix for Azure Files backup by using Azure Backup
    url: https://learn.microsoft.com/en-us/azure/backup/azure-file-share-support-matrix
