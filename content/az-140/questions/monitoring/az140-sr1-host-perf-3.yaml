stem:
  en: You install the Log Analytics agent on the session hosts.
  fr: Vous installez l'agent Log Analytics sur les hôtes de session.
body:
  solution:
    en: |
      You install the Log Analytics agent on each session host, connect it to LAW-AVD, and add the performance counters and event logs on the **Legacy agents management** page of the workspace.
    fr: |
      Vous installez l'agent Log Analytics sur chaque hôte de session, vous le connectez à LAW-AVD et vous ajoutez les compteurs de performances et les journaux d'événements dans la page **Legacy agents management** de l'espace de travail.
answer: { value: false }
explanation:
  correct:
    en: |
      The Log Analytics agent is retired and Azure Virtual Desktop Insights now relies on the Azure Monitor Agent and a data collection rule for session host data. Configure the session host data through the Session host data settings of the configuration workbook, or deploy the Azure Monitor Agent with a data collection rule.
    fr: |
      L'agent Log Analytics est mis hors service et Azure Virtual Desktop Insights s'appuie désormais sur l'agent Azure Monitor et une règle de collecte de données pour les données des hôtes de session. Configurez les données des hôtes de session avec l'onglet Session host data settings du workbook de configuration, ou déployez l'agent Azure Monitor avec une règle de collecte de données.
references:
  - title: Enable Insights to monitor Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/insights
