id: az140-4a-exclusion-tag
objective: "4.1.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have a pooled host pool named **HP1** that contains eight session hosts. A power management scaling plan named **SP1** is assigned to HP1 with autoscale enabled. The exclusion tag of SP1 is `excludeFromScaling`.

    You turn on drain mode on a session host named **SH2** to troubleshoot a driver. Twenty minutes later, new users are connecting to SH2 because drain mode was turned off.

    You need to keep SH2 out of service until the troubleshooting ends. The other session hosts must keep scaling.

    What should you do?
  fr: |
    Vous disposez d'un pool d'hôtes regroupé nommé **HP1** qui contient huit hôtes de session. Un plan de mise à l'échelle de type gestion de l'alimentation nommé **SP1** est attribué à HP1, avec la mise à l'échelle automatique activée. L'étiquette d'exclusion de SP1 est `excludeFromScaling`.

    Vous activez le mode drainage sur un hôte de session nommé **SH2** pour dépanner un pilote. Vingt minutes plus tard, de nouveaux utilisateurs se connectent à SH2, car le mode drainage a été désactivé.

    Vous devez maintenir SH2 hors service jusqu'à la fin du dépannage. Les autres hôtes de session doivent continuer à être mis à l'échelle.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Clear Enable autoscale for HP1 in SP1, then turn on drain mode on SH2.", fr: "Décocher Enable autoscale pour HP1 dans SP1, puis activer le mode drainage sur SH2." } }
    - { id: b, text: { en: "Add the excludeFromScaling tag to SH2, then turn on drain mode on SH2.", fr: "Ajouter l'étiquette excludeFromScaling à SH2, puis activer le mode drainage sur SH2." } }
    - { id: c, text: { en: "Set the minimum percentage of hosts of SP1 to 0, then turn on drain mode on SH2.", fr: "Définir à 0 le pourcentage minimal d'hôtes de SP1, puis activer le mode drainage sur SH2." } }
    - { id: d, text: { en: "Assign yourself Session Host Operator, then turn on drain mode on SH2.", fr: "Vous attribuer Session Host Operator, puis activer le mode drainage sur SH2." } }
answer: { optionId: b }
explanation:
  correct:
    en: Autoscale turns drain mode on or off for the session hosts it scales, whoever set it. A session host that carries the exclusion tag of the scaling plan is ignored by autoscale, which no longer starts, stops or changes the drain mode of that host, while it keeps scaling the other hosts.
    fr: "La mise à l'échelle automatique active ou désactive le mode drainage des hôtes de session qu'elle gère, quel que soit l'auteur du réglage. Un hôte de session qui porte l'étiquette d'exclusion du plan de mise à l'échelle est ignoré : la mise à l'échelle automatique ne le démarre plus, ne l'arrête plus et ne change plus son mode drainage, tout en continuant à gérer les autres hôtes."
  options:
    a: { en: "Disabling autoscale for HP1 would stop the scaling of all the other session hosts too.", fr: "Désactiver la mise à l'échelle automatique pour HP1 arrêterait aussi la mise à l'échelle de tous les autres hôtes de session." }
    c: { en: "The minimum percentage of hosts sets how many hosts stay on; autoscale would still manage the drain mode of SH2.", fr: "Le pourcentage minimal d'hôtes fixe combien d'hôtes restent allumés ; la mise à l'échelle automatique gérerait toujours le mode drainage de SH2." }
    d: { en: "You already had the permission to turn on drain mode; the problem is that autoscale overwrites it.", fr: "Vous aviez déjà l'autorisation d'activer le mode drainage ; le problème est que la mise à l'échelle automatique l'écrase." }
references:
  - title: Azure Virtual Desktop autoscale FAQ
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/autoscale-faq
  - title: Create and assign an autoscale scaling plan for Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/autoscale-scaling-plan
