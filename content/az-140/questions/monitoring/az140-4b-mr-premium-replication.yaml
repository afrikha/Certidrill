id: az140-4b-mr-premium-replication
objective: "4.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Tailspin Toys stores the FSLogix profile containers of an Azure Virtual Desktop pooled host pool on an Azure Files **premium** file share named **profiles** in a storage account named **stproftsp1** in the East US 2 region. The storage account uses zone-redundant storage (ZRS).

    You are adding a secondary host pool in Central US. You need the profiles to be available to the secondary session hosts if East US 2 fails. The profiles must stay on premium storage.

    What should you do?
  fr: |
    Tailspin Toys stocke les conteneurs de profils FSLogix d'un pool d'hôtes Azure Virtual Desktop regroupé dans un partage de fichiers Azure Files **Premium** nommé **profiles**, dans un compte de stockage nommé **stproftsp1** de la région East US 2. Le compte de stockage utilise le stockage redondant interzone (ZRS).

    Vous ajoutez un pool d'hôtes secondaire dans Central US. Les profils doivent être disponibles pour les hôtes de session secondaires si East US 2 tombe en panne. Les profils doivent rester sur un stockage Premium.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Change the redundancy of stproftsp1 to geo-zone-redundant storage (GZRS).", fr: "Changer la redondance de stproftsp1 en stockage géoredondant interzone (GZRS)." } }
    - { id: b, text: { en: "Configure FSLogix Cloud Cache with a premium file share in Central US.", fr: "Configurer FSLogix Cloud Cache avec un partage de fichiers Premium dans Central US." } }
    - { id: c, text: { en: "Add a cloud endpoint in Central US to an Azure File Sync group for profiles.", fr: "Ajouter un point de terminaison cloud dans Central US à un groupe Azure File Sync pour profiles." } }
    - { id: d, text: { en: "Configure object replication from stproftsp1 to a storage account in Central US.", fr: "Configurer la réplication d'objets de stproftsp1 vers un compte de stockage de Central US." } }
answer: { optionId: b }
explanation:
  correct:
    en: Azure Files premium doesn't support geo-redundant storage, so Microsoft recommends FSLogix Cloud Cache for cross-region replication when premium performance is needed. With a premium share in each region listed in CCDLocations, every profile change is written to both locations.
    fr: Azure Files Premium ne prend pas en charge le stockage géoredondant ; Microsoft recommande donc FSLogix Cloud Cache pour la réplication interrégion quand les performances Premium sont nécessaires. Avec un partage Premium dans chaque région indiqué dans CCDLocations, chaque modification de profil est écrite dans les deux emplacements.
  options:
    a: { en: "Premium file shares support only LRS and ZRS; GRS and GZRS aren't available for them.", fr: "Les partages de fichiers Premium ne prennent en charge que LRS et ZRS ; GRS et GZRS ne sont pas disponibles pour eux." }
    c: { en: "Azure File Sync synchronizes Windows Server endpoints with one cloud endpoint per sync group; it doesn't replicate a share to another region for FSLogix.", fr: "Azure File Sync synchronise des points de terminaison Windows Server avec un seul point de terminaison cloud par groupe de synchronisation ; il ne réplique pas un partage vers une autre région pour FSLogix." }
    d: { en: "Object replication copies block blobs between storage accounts; it doesn't apply to Azure file shares.", fr: "La réplication d'objets copie des objets blob de blocs entre comptes de stockage ; elle ne s'applique pas aux partages de fichiers Azure." }
references:
  - title: Multiregion BCDR for Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/architecture/example-scenario/azure-virtual-desktop/azure-virtual-desktop-multi-region-bcdr
