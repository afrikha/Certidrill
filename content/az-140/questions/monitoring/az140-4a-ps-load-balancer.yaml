id: az140-4a-ps-load-balancer
objective: "4.1.4"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    You have a pooled host pool named **hp-sales** in a resource group named **rg-avd**. Each session host can support 12 users.

    You need to configure hp-sales to fill each session host up to 12 sessions before new sessions are placed on another session host.

    How should you complete the PowerShell command? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un pool d'hôtes regroupé nommé **hp-sales** dans un groupe de ressources nommé **rg-avd**. Chaque hôte de session peut accueillir 12 utilisateurs.

    Vous devez configurer hp-sales pour remplir chaque hôte de session jusqu'à 12 sessions avant que les nouvelles sessions soient placées sur un autre hôte de session.

    Comment devez-vous compléter la commande PowerShell ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: powershell
  template: |
    [[cmd]] -ResourceGroupName rg-avd -Name hp-sales `
      -LoadBalancerType [[lb]] `
      [[limit]] 12
  slots:
    - id: cmd
      options:
        - { id: updhp, text: Update-AzWvdHostPool }
        - { id: updsh, text: Update-AzWvdSessionHost }
        - { id: updsp, text: Update-AzWvdScalingPlan }
    - id: lb
      options:
        - { id: breadth, text: BreadthFirst }
        - { id: depth, text: DepthFirst }
        - { id: persistent, text: Persistent }
    - id: limit
      options:
        - { id: rdp, text: -CustomRdpProperty }
        - { id: max, text: -MaxSessionLimit }
        - { id: assign, text: -PersonalDesktopAssignmentType }
answer:
  values: { cmd: updhp, lb: depth, limit: max }
explanation:
  correct:
    en: The load balancing algorithm and the max session limit are host pool properties, changed with `Update-AzWvdHostPool`. Depth-first places new sessions on the host with the most sessions until it reaches the max session limit, then moves to the next host, which is the required behavior with `-MaxSessionLimit 12`.
    fr: L'algorithme d'équilibrage de charge et la limite maximale de sessions sont des propriétés du pool d'hôtes, modifiées avec `Update-AzWvdHostPool`. Depth-first place les nouvelles sessions sur l'hôte qui en compte le plus jusqu'à la limite maximale de sessions, puis passe à l'hôte suivant, ce qui correspond au comportement demandé avec `-MaxSessionLimit 12`.
  options:
    updsh: { en: "Update-AzWvdSessionHost changes one session host (for example drain mode), not the host pool load balancing.", fr: "Update-AzWvdSessionHost modifie un hôte de session (par exemple le mode drainage), pas l'équilibrage de charge du pool d'hôtes." }
    updsp: { en: "Update-AzWvdScalingPlan changes a scaling plan, not the load balancing properties of the host pool.", fr: "Update-AzWvdScalingPlan modifie un plan de mise à l'échelle, pas les propriétés d'équilibrage de charge du pool d'hôtes." }
    breadth: { en: "Breadth-first spreads new sessions across the hosts instead of filling one host first.", fr: "Breadth-first répartit les nouvelles sessions entre les hôtes au lieu de remplir d'abord un hôte." }
    persistent: { en: "Persistent is the load balancer type of personal host pools.", fr: "Persistent est le type d'équilibrage des pools d'hôtes personnels." }
    rdp: { en: "CustomRdpProperty sets RDP properties, not the number of sessions per host.", fr: "CustomRdpProperty définit des propriétés RDP, pas le nombre de sessions par hôte." }
    assign: { en: "PersonalDesktopAssignmentType applies to personal host pools.", fr: "PersonalDesktopAssignmentType s'applique aux pools d'hôtes personnels." }
references:
  - title: Update-AzWvdHostPool
    url: https://learn.microsoft.com/en-us/powershell/module/az.desktopvirtualization/update-azwvdhostpool
  - title: Configure host pool load balancing in Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/configure-host-pool-load-balancing
