id: az140-4a-sizing-medium
objective: "4.1.4"
type: single
difficulty: 2
shuffle: false
status: draft
stem:
  en: |
    Adatum plans a pooled host pool for 240 users who run a medium workload (Microsoft Office apps, line-of-business apps and web browsing). All 240 users can be connected at the same time. The session hosts will run Windows 11 Enterprise multi-session on the Standard_D8s_v5 size (8 vCPUs, 32 GiB of memory).

    Based on Microsoft's session host sizing guidelines for multi-session, what is the minimum number of session hosts that you should deploy?
  fr: |
    Adatum prévoit un pool d'hôtes regroupé pour 240 utilisateurs qui exécutent une charge de travail moyenne (applications Microsoft Office, applications métier et navigation web). Les 240 utilisateurs peuvent être connectés en même temps. Les hôtes de session exécuteront Windows 11 Entreprise multisession sur la taille Standard_D8s_v5 (8 processeurs virtuels, 32 Gio de mémoire).

    D'après les recommandations de dimensionnement des hôtes de session multisession de Microsoft, quel est le nombre minimal d'hôtes de session à déployer ?
body:
  options:
    - { id: a, text: "5" }
    - { id: b, text: "8" }
    - { id: c, text: "10" }
    - { id: d, text: "15" }
answer: { optionId: b }
explanation:
  correct:
    en: Microsoft's starting point for a medium multi-session workload is a maximum of four users per vCPU. A D8s_v5 host therefore supports up to 32 users, and 240 ÷ 32 = 7.5, rounded up to 8 session hosts. Validate the estimate with a pilot or load test, and keep headroom for logon peaks.
    fr: Le point de départ de Microsoft pour une charge de travail moyenne multisession est de quatre utilisateurs au maximum par processeur virtuel. Un hôte D8s_v5 accepte donc jusqu'à 32 utilisateurs, et 240 ÷ 32 = 7,5, arrondi à 8 hôtes de session. Validez l'estimation par un pilote ou un test de charge, et gardez une marge pour les pics d'ouverture de session.
  options:
    a: { en: "Five hosts assume six users per vCPU, the light workload ratio.", fr: "Cinq hôtes supposent six utilisateurs par processeur virtuel, le ratio d'une charge légère." }
    c: { en: "Ten hosts assume three users per vCPU, which isn't one of Microsoft's ratios; it's more than the minimum.", fr: "Dix hôtes supposent trois utilisateurs par processeur virtuel, ce qui n'est pas un ratio de Microsoft ; c'est plus que le minimum." }
    d: { en: "Fifteen hosts assume two users per vCPU, the heavy workload ratio.", fr: "Quinze hôtes supposent deux utilisateurs par processeur virtuel, le ratio d'une charge lourde." }
references:
  - title: Session host virtual machine sizing guidelines for Azure Virtual Desktop and Remote Desktop Services
    url: https://learn.microsoft.com/en-us/windows-server/remote/remote-desktop-services/virtual-machine-recs
