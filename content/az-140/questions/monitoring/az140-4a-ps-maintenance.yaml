id: az140-4a-ps-maintenance
objective: "4.1.6"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    You have a pooled host pool named **hp-sales** in a resource group named **rg-avd**. No scaling plan is assigned to hp-sales. A session host named **sh-2.contoso.com** must be restarted. One user still has a session on sh-2.contoso.com, with the session ID 3.

    You need to run commands that perform the following actions in order:

    1. Prevent new sessions on sh-2.contoso.com.
    2. Warn the user of session 3.
    3. Sign out the user of session 3 so that the session ends on the session host.

    How should you complete the commands? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un pool d'hôtes regroupé nommé **hp-sales** dans un groupe de ressources nommé **rg-avd**. Aucun plan de mise à l'échelle n'est attribué à hp-sales. Un hôte de session nommé **sh-2.contoso.com** doit être redémarré. Un utilisateur a encore une session sur sh-2.contoso.com, avec l'ID de session 3.

    Vous devez exécuter des commandes qui effectuent les actions suivantes dans l'ordre :

    1. Empêcher les nouvelles sessions sur sh-2.contoso.com.
    2. Avertir l'utilisateur de la session 3.
    3. Fermer la session de l'utilisateur de la session 3 afin que la session se termine sur l'hôte de session.

    Comment devez-vous compléter les commandes ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: powershell
  template: |
    [[drain]] -ResourceGroupName rg-avd -HostPoolName hp-sales -Name sh-2.contoso.com -AllowNewSession:$false

    [[warn]] -ResourceGroupName rg-avd -HostPoolName hp-sales -SessionHostName sh-2.contoso.com `
      -UserSessionId 3 -MessageTitle "Maintenance" -MessageBody "Save your work. You will be signed out in 10 minutes."

    [[signout]] -ResourceGroupName rg-avd -HostPoolName hp-sales -SessionHostName sh-2.contoso.com -Id 3 -Force
  slots:
    - id: drain
      options:
        - { id: updsh, text: Update-AzWvdSessionHost }
        - { id: updhp, text: Update-AzWvdHostPool }
        - { id: rmsh, text: Remove-AzWvdSessionHost }
    - id: warn
      options:
        - { id: getus, text: Get-AzWvdUserSession }
        - { id: send, text: Send-AzWvdUserSessionMessage }
        - { id: disc1, text: Disconnect-AzWvdUserSession }
    - id: signout
      options:
        - { id: disc2, text: Disconnect-AzWvdUserSession }
        - { id: rmsh2, text: Remove-AzWvdSessionHost }
        - { id: rmus, text: Remove-AzWvdUserSession }
answer:
  values: { drain: updsh, warn: send, signout: rmus }
explanation:
  correct:
    en: "`Update-AzWvdSessionHost -AllowNewSession:$false` turns on drain mode for one session host. `Send-AzWvdUserSessionMessage` displays a message in the user's session. `Remove-AzWvdUserSession` signs the user out, which ends the session on the host; `-Force` forces the deletion of the user session."
    fr: "`Update-AzWvdSessionHost -AllowNewSession:$false` active le mode drainage d'un hôte de session. `Send-AzWvdUserSessionMessage` affiche un message dans la session de l'utilisateur. `Remove-AzWvdUserSession` ferme la session de l'utilisateur, ce qui met fin à la session sur l'hôte ; `-Force` force la suppression de la session utilisateur."
  options:
    updhp: { en: "Update-AzWvdHostPool changes host pool properties; drain mode (AllowNewSession) is a property of each session host.", fr: "Update-AzWvdHostPool modifie les propriétés du pool d'hôtes ; le mode drainage (AllowNewSession) est une propriété de chaque hôte de session." }
    rmsh: { en: "Remove-AzWvdSessionHost removes the session host from the host pool instead of draining it.", fr: "Remove-AzWvdSessionHost retire l'hôte de session du pool d'hôtes au lieu de le drainer." }
    getus: { en: "Get-AzWvdUserSession lists sessions; it doesn't send anything to the user.", fr: "Get-AzWvdUserSession liste les sessions ; il n'envoie rien à l'utilisateur." }
    disc1: { en: "Disconnecting the session closes the user's connection without warning; it isn't a message.", fr: "Déconnecter la session coupe la connexion de l'utilisateur sans l'avertir ; ce n'est pas un message." }
    disc2: { en: "A disconnected session stays open on the host, so the session wouldn't end.", fr: "Une session déconnectée reste ouverte sur l'hôte : la session ne se terminerait pas." }
    rmsh2: { en: "Removing the session host from the host pool doesn't sign out the user.", fr: "Retirer l'hôte de session du pool d'hôtes ne ferme pas la session de l'utilisateur." }
references:
  - title: Update-AzWvdSessionHost
    url: https://learn.microsoft.com/en-us/powershell/module/az.desktopvirtualization/update-azwvdsessionhost
  - title: Remove-AzWvdUserSession
    url: https://learn.microsoft.com/en-us/powershell/module/az.desktopvirtualization/remove-azwvdusersession
