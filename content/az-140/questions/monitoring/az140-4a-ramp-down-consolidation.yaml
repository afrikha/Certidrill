id: az140-4a-ramp-down-consolidation
objective: "4.1.5"
type: single
difficulty: 3
shuffle: false
status: draft
stem:
  en: |
    You have a pooled host pool named **HP1** that contains eight session hosts and has a max session limit of 10. A power management scaling plan is assigned to HP1. The ramp-down phase uses the following settings:

    | Setting | Value |
    | --- | --- |
    | Capacity threshold | 70 % |
    | Minimum percentage of hosts | 10 % |
    | Force logoff of users | No |
    | Stop VMs when | VMs have no active sessions |

    During ramp-down, 13 users have disconnected sessions on HP1. No user has an active session.

    What is the minimum number of session hosts that autoscale keeps running while these sessions exist?
  fr: |
    Vous disposez d'un pool d'hôtes regroupé nommé **HP1** qui contient huit hôtes de session et dont la limite maximale de sessions est de 10. Un plan de mise à l'échelle de type gestion de l'alimentation est attribué à HP1. La phase de baisse de charge (ramp-down) utilise les paramètres suivants :

    | Paramètre | Valeur |
    | --- | --- |
    | Capacity threshold | 70 % |
    | Minimum percentage of hosts | 10 % |
    | Force logoff of users | No |
    | Stop VMs when | VMs have no active sessions |

    Pendant la baisse de charge, 13 utilisateurs ont une session déconnectée sur HP1. Aucun utilisateur n'a de session active.

    Quel est le nombre minimal d'hôtes de session que la mise à l'échelle automatique laisse allumés tant que ces sessions existent ?
body:
  options:
    - { id: a, text: "0" }
    - { id: b, text: "1" }
    - { id: c, text: "2" }
    - { id: d, text: "3" }
answer: { optionId: c }
explanation:
  correct:
    en: With VMs have no active sessions, autoscale still treats disconnected sessions as active for capacity, because their users may reconnect, and consolidates them onto the fewest hosts that keep used capacity under the threshold. Required hosts = 13 ÷ (10 × 70 %) = 1.86, rounded up to 2. The minimum percentage of hosts (10 % of 8 = 0.8, rounded up to 1) is lower, so 2 hosts stay running.
    fr: Avec VMs have no active sessions, la mise à l'échelle automatique traite toujours les sessions déconnectées comme actives pour la capacité, car leurs utilisateurs peuvent se reconnecter, et les consolide sur le plus petit nombre d'hôtes qui maintient la capacité utilisée sous le seuil. Hôtes requis = 13 ÷ (10 × 70 %) = 1,86, arrondi à 2. Le pourcentage minimal d'hôtes (10 % de 8 = 0,8, arrondi à 1) est inférieur ; 2 hôtes restent donc allumés.
  options:
    a: { en: "No host has an active session, but the setting doesn't remove disconnected sessions: autoscale treats them as active for capacity because their users may reconnect.", fr: "Aucun hôte n'a de session active, mais ce paramètre ne supprime pas les sessions déconnectées : la mise à l'échelle automatique les traite comme actives pour la capacité, car leurs utilisateurs peuvent se reconnecter." }
    b: { en: "One host comes from the minimum percentage of hosts only; it ignores the 13 sessions that must fit under the threshold.", fr: "Un hôte découle uniquement du pourcentage minimal d'hôtes ; ce chiffre ignore les 13 sessions qui doivent tenir sous le seuil." }
    d: { en: "Two hosts provide 20 sessions of capacity, and 13 sessions use 65 percent of it, under the 70 percent threshold, so a third host isn't required.", fr: "Deux hôtes offrent 20 sessions de capacité, et 13 sessions en utilisent 65 %, sous le seuil de 70 % : un troisième hôte n'est pas nécessaire." }
references:
