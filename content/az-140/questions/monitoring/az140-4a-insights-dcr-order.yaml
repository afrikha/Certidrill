id: az140-4a-insights-dcr-order
objective: "4.1.2"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    You have an Azure Virtual Desktop host pool named **HP1**. The diagnostic settings of HP1 and of its workspace already send the required categories to a Log Analytics workspace named **LAW1**. Every session host of HP1 already has the Azure Monitor Agent and a system-assigned managed identity. No data collection rule exists.

    You open the configuration workbook from the Insights page of HP1 and select the **Session host data settings** tab. You need the session hosts to send their performance counters and event logs to LAW1.

    Which three actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Vous disposez d'un pool d'hôtes Azure Virtual Desktop nommé **HP1**. Les paramètres de diagnostic de HP1 et de son espace de travail envoient déjà les catégories requises vers un espace de travail Log Analytics nommé **LAW1**. Chaque hôte de session de HP1 dispose déjà de l'agent Azure Monitor et d'une identité managée affectée par le système. Aucune règle de collecte de données n'existe.

    Vous ouvrez le workbook de configuration depuis la page Insights de HP1 et sélectionnez l'onglet **Session host data settings**. Les hôtes de session doivent envoyer leurs compteurs de performances et leurs journaux d'événements vers LAW1.

    Quelles sont les trois actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - { id: dest, text: { en: "Select LAW1 as the workspace destination and select the DCR resource group.", fr: "Sélectionner LAW1 comme destination (Workspace destination) et sélectionner le groupe de ressources de la DCR." } }
    - { id: create, text: { en: "Select **Create data collection rule**.", fr: "Sélectionner **Create data collection rule**." } }
    - { id: assoc, text: { en: "Select **Deploy association**.", fr: "Sélectionner **Deploy association**." } }
    - { id: hpdiag, text: { en: "Select **Configure host pool** on the Resource diagnostic settings tab.", fr: "Sélectionner **Configure host pool** dans l'onglet Resource diagnostic settings." } }
    - { id: mma, text: { en: "Install the Log Analytics agent by using the ID and primary key of LAW1.", fr: "Installer l'agent Log Analytics avec l'ID et la clé primaire de LAW1." } }
    - { id: vmdiag, text: { en: "Add a diagnostic setting to each session host VM that sends AllMetrics to LAW1.", fr: "Ajouter à chaque machine virtuelle hôte de session un paramètre de diagnostic qui envoie AllMetrics vers LAW1." } }
answer:
  sequence: [ dest, create, assoc ]
explanation:
  correct:
    en: The Create data collection rule button appears only after you select the workspace destination and the DCR resource group. Once the rule exists, Deploy association associates the session hosts of the host pool with it; because the agent and the managed identity are already present, the hosts then start sending data.
    fr: "Le bouton Create data collection rule n'apparaît qu'après la sélection de la destination et du groupe de ressources de la DCR. Une fois la règle créée, Deploy association y associe les hôtes de session du pool d'hôtes ; comme l'agent et l'identité managée sont déjà présents, les hôtes commencent alors à envoyer des données."
  options:
    hpdiag: { en: "The host pool diagnostic settings are already configured, and they don't collect session host counters.", fr: "Les paramètres de diagnostic du pool d'hôtes sont déjà configurés, et ils ne collectent pas les compteurs des hôtes de session." }
    mma: { en: "The Log Analytics agent is retired; Insights uses the Azure Monitor Agent with a data collection rule.", fr: "L'agent Log Analytics est mis hors service ; Insights utilise l'agent Azure Monitor avec une règle de collecte de données." }
    vmdiag: { en: "VM diagnostic settings send platform metrics, not the guest counters and event logs that Insights needs.", fr: "Les paramètres de diagnostic d'une machine virtuelle envoient les métriques de plateforme, pas les compteurs invités et les journaux d'événements dont Insights a besoin." }
references:
  - title: Enable Insights to monitor Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/insights
