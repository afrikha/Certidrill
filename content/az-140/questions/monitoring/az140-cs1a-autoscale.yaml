id: az140-cs1a-autoscale
objective: "4.1.5"
type: yesno_statements
caseStudy: az140-cs1a-humongous-insurance
difficulty: 2
status: draft
stem:
  en: |
    You are planning SP-Claims. For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous planifiez SP-Claims. Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: You can create SP-Claims in France Central and assign it to HP-Claims.
        fr: Vous pouvez créer SP-Claims dans la région France Central et l'attribuer à HP-Claims.
    - id: s2
      text:
        en: To let SP-Claims start and stop session hosts, you can assign the Desktop Virtualization Power On Off Contributor role to the Azure Virtual Desktop service principal at the scope of the resource group that contains the session hosts.
        fr: Pour permettre à SP-Claims de démarrer et d'arrêter les hôtes de session, vous pouvez attribuer le rôle Desktop Virtualization Power On Off Contributor au principal de service Azure Virtual Desktop à l'étendue du groupe de ressources qui contient les hôtes de session.
    - id: s3
      text:
        en: If 10 session hosts are available during the ramp-up phase, autoscale starts another session host when more than 120 user sessions are active.
        fr: Si 10 hôtes de session sont disponibles pendant la phase de montée en charge, la mise à l'échelle automatique démarre un autre hôte de session dès que plus de 120 sessions utilisateur sont actives.
answer:
  values: { s1: false, s2: false, s3: true }
explanation:
  correct:
    en: |
      A scaling plan must be in the same Azure region as the host pool metadata, which is West Europe for HP-Claims; the session hosts themselves can be in another region. The Desktop Virtualization Power On Off Contributor role must be assigned at the subscription scope; a lower scope prevents autoscale from working properly. Ten hosts with a max session limit of 16 offer 160 sessions, and a 75 percent capacity threshold is reached above 120 sessions, so autoscale starts another host.
    fr: |
      Un plan de mise à l'échelle doit se trouver dans la même région Azure que les métadonnées du pool d'hôtes, soit West Europe pour HP-Claims ; les hôtes de session eux-mêmes peuvent se trouver dans une autre région. Le rôle Desktop Virtualization Power On Off Contributor doit être attribué à l'étendue de l'abonnement ; une étendue inférieure empêche la mise à l'échelle automatique de fonctionner correctement. Dix hôtes avec une limite de 16 sessions offrent 160 sessions, et un seuil de capacité de 75 % est atteint au-delà de 120 sessions : la mise à l'échelle automatique démarre alors un autre hôte.
references:
  - title: Create and assign an autoscale scaling plan for Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/autoscale-scaling-plan
