id: az140-4a-workbook-tabs
objective: "4.1.3"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    You are customizing a saved copy of Azure Virtual Desktop Insights. You need to add two tabs named **Errors** and **Capacity** at the top of the workbook. When a user selects a tab, only the steps that belong to that tab must be displayed.

    Which two actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous personnalisez une copie enregistrée d'Azure Virtual Desktop Insights. Vous devez ajouter deux onglets nommés **Errors** et **Capacity** en haut du workbook. Quand un utilisateur sélectionne un onglet, seules les étapes de cet onglet doivent s'afficher.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Set the load type of each group to Explicit so that it loads only when its tab is selected.", fr: "Définir le type de chargement de chaque groupe sur Explicit pour qu'il ne se charge qu'à la sélection de son onglet." } }
    - { id: b, text: { en: "Add a links step with the Tabs style, where each tab sets the same parameter to a different value.", fr: "Ajouter une étape de liens avec le style Tabs, où chaque onglet fixe le même paramètre à une valeur différente." } }
    - { id: c, text: { en: "Change the style of the parameters step to Form horizontal so that the tab names are always visible.", fr: "Changer le style de l'étape de paramètres en Form horizontal pour que les noms d'onglets soient toujours visibles." } }
    - { id: d, text: { en: "Make each content step conditionally visible when the parameter equals the value of its tab.", fr: "Rendre chaque étape de contenu visible sous condition quand le paramètre est égal à la valeur de son onglet." } }
    - { id: e, text: { en: "Add a group of type From a template that loads the Insights workbook into each of the two tabs.", fr: "Ajouter un groupe de type From a template qui charge le workbook Insights dans chacun des deux onglets." } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: Workbook tabs are a links step with the Tabs style whose links use the Set a parameter value action, all on the same parameter (for example selectedTab) with a different value per tab. Each content step then uses Make this item conditionally visible, with the condition that the parameter equals its tab value.
    fr: Les onglets d'un workbook sont une étape de liens au style Tabs dont les liens utilisent l'action Set a parameter value, tous sur le même paramètre (par exemple selectedTab) avec une valeur différente par onglet. Chaque étape de contenu utilise ensuite Make this item conditionally visible, avec pour condition que le paramètre soit égal à la valeur de son onglet.
  options:
    a: { en: "Explicit loads a group only when the user selects a button; it doesn't hide the other tab's content.", fr: "Explicit charge un groupe uniquement quand l'utilisateur sélectionne un bouton ; il ne masque pas le contenu de l'autre onglet." }
    c: { en: "The parameter style changes how controls are displayed, not which steps are visible.", fr: "Le style des paramètres change l'affichage des contrôles, pas les étapes visibles." }
    e: { en: "A group from a template merges another workbook into this one; it doesn't create tabs.", fr: "Un groupe issu d'un modèle fusionne un autre workbook dans celui-ci ; il ne crée pas d'onglets." }
references:
  - title: Create or edit an Azure Workbook
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/visualize/workbooks-create-workbook
