id: az140-4a-input-delay-dcr
objective: "4.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have an Azure Virtual Desktop host pool named **HP1** that contains 10 session hosts running Windows 11 Enterprise multi-session. A diagnostic setting on HP1 sends all the log categories to a Log Analytics workspace named **LAW1**.

    You need to collect the `User Input Delay per Session(*)\Max Input Delay` performance counter of the session hosts in LAW1.

    What should you do?
  fr: |
    Vous disposez d'un pool d'hôtes Azure Virtual Desktop nommé **HP1** qui contient 10 hôtes de session exécutant Windows 11 Entreprise multisession. Un paramètre de diagnostic de HP1 envoie toutes les catégories de journaux vers un espace de travail Log Analytics nommé **LAW1**.

    Vous devez collecter dans LAW1 le compteur de performances `User Input Delay per Session(*)\Max Input Delay` des hôtes de session.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Install the Azure Monitor Agent and associate the hosts with a DCR that collects the counter.", fr: "Installer l'agent Azure Monitor et associer les hôtes à une DCR qui collecte le compteur." } }
    - { id: b, text: { en: "Add the Network category to the existing diagnostic setting of the HP1 host pool.", fr: "Ajouter la catégorie Network au paramètre de diagnostic existant du pool d'hôtes HP1." } }
    - { id: c, text: { en: "Enable boot diagnostics on each session host and send the boot logs to LAW1.", fr: "Activer les diagnostics de démarrage sur chaque hôte de session et envoyer leurs journaux vers LAW1." } }
    - { id: d, text: { en: "Add a diagnostic setting that sends AllMetrics of each session host VM to LAW1.", fr: "Ajouter un paramètre de diagnostic qui envoie AllMetrics de chaque machine virtuelle hôte de session vers LAW1." } }
answer: { optionId: a }
explanation:
  correct:
    en: Guest performance counters, such as the input delay counters used by Azure Virtual Desktop Insights, are collected by the Azure Monitor Agent according to a data collection rule associated with each session host. The data lands in the Perf table of the destination workspace.
    fr: Les compteurs de performances invités, comme les compteurs de délai d'entrée utilisés par Azure Virtual Desktop Insights, sont collectés par l'agent Azure Monitor selon une règle de collecte de données associée à chaque hôte de session. Les données arrivent dans la table Perf de l'espace de travail de destination.
  options:
    b: { en: "The Network category records the average network data of user sessions, such as round-trip time, not guest performance counters.", fr: "La catégorie Network enregistre les données réseau moyennes des sessions utilisateur, comme le temps d'aller-retour, pas les compteurs de performances invités." }
    c: { en: "Boot diagnostics captures a screenshot and the serial log of the VM in a storage account; it doesn't collect performance counters.", fr: "Les diagnostics de démarrage capturent une capture d'écran et le journal série de la machine virtuelle dans un compte de stockage ; ils ne collectent pas de compteurs de performances." }
    d: { en: "The platform metrics of a VM (CPU, disk, network seen by the host) don't include the input delay counters, which exist only inside the guest operating system.", fr: "Les métriques de plateforme d'une machine virtuelle (processeur, disque, réseau vus par l'hôte) n'incluent pas les compteurs de délai d'entrée, qui n'existent que dans le système d'exploitation invité." }
references:
  - title: Enable Insights to monitor Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/insights
  - title: Azure Virtual Desktop Insights glossary
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/insights-glossary
