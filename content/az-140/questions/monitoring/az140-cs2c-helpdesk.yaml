id: az140-cs2c-helpdesk
objective: "4.1.6"
type: single
caseStudy: az140-cs2c-humongous
difficulty: 1
status: draft
stem:
  en: |
    You need to grant GRP-Helpdesk the permissions to meet the help desk requirement.

    Which role should you assign to GRP-Helpdesk on HP-Claims?
  fr: |
    Vous devez accorder à GRP-Helpdesk les autorisations qui permettent de respecter l'exigence relative au support technique.

    Quel rôle devez-vous attribuer à GRP-Helpdesk sur HP-Claims ?
body:
  options:
    - { id: a, text: Desktop Virtualization Session Host Operator }
    - { id: b, text: Desktop Virtualization Host Pool Contributor }
    - { id: c, text: Desktop Virtualization User Session Operator }
    - { id: d, text: Desktop Virtualization Host Pool Reader }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Desktop Virtualization User Session Operator lets a user send messages to users, disconnect their sessions and sign them out of session hosts. It cannot remove session hosts or change drain mode, and Microsoft recommends assigning it on specific host pools.
    fr: |
      Desktop Virtualization User Session Operator permet d'envoyer des messages aux utilisateurs, de déconnecter leurs sessions et de fermer leur session sur les hôtes de session. Il ne peut ni supprimer d'hôtes de session ni changer le mode drainage, et Microsoft recommande de l'attribuer sur des pools d'hôtes précis.
  options:
    a: { en: "Session Host Operator can change drain mode and remove session hosts, which the requirement forbids.", fr: "Session Host Operator peut changer le mode drainage et supprimer des hôtes de session, ce que l'exigence interdit." }
    b: { en: "Host Pool Contributor manages every aspect of the host pool, including drain mode, which violates least privilege.", fr: "Host Pool Contributor gère tous les aspects du pool d'hôtes, y compris le mode drainage, ce qui ne respecte pas le moindre privilège." }
    d: { en: "Host Pool Reader can only view the host pool; it cannot send messages or sign users out.", fr: "Host Pool Reader peut seulement consulter le pool d'hôtes ; il ne peut ni envoyer de messages ni fermer les sessions des utilisateurs." }
references:
  - title: Built-in Azure RBAC roles for Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/rbac
