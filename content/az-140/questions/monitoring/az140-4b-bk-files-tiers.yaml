id: az140-4b-bk-files-tiers
objective: "4.2.4"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    Adatum stores FSLogix profile containers in an Azure file share named **profiles** in a storage account named **stprofadatum**. You configure Azure Backup for the share by using a policy for the **Snapshot** tier.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum stocke des conteneurs de profils FSLogix dans un partage de fichiers Azure nommé **profiles** d'un compte de stockage nommé **stprofadatum**. Vous configurez Sauvegarde Azure pour le partage à l'aide d'une stratégie du niveau **Snapshot**.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: The backup data is copied to the Recovery Services vault.
        fr: Les données de sauvegarde sont copiées dans le coffre Recovery Services.
    - id: s2
      text:
        en: Azure Backup enables soft delete for file shares on stprofadatum.
        fr: Sauvegarde Azure active la suppression réversible des partages de fichiers sur stprofadatum.
    - id: s3
      text:
        en: Azure Backup takes a lease on the snapshots that it creates.
        fr: Sauvegarde Azure prend un bail sur les captures instantanées qu'il crée.
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: |
      In the Snapshot tier, the backup is a share snapshot kept in the storage account; the vault stores only its metadata. Only the Vault-Standard tier transfers the changed data to the vault. When you configure backup, Azure Backup enables soft delete at the storage account level with a 14-day retention, and it takes a lease of infinite duration on each backup snapshot so that it can't be deleted by accident.
    fr: |
      Au niveau Snapshot, la sauvegarde est une capture instantanée du partage conservée dans le compte de stockage ; le coffre ne stocke que ses métadonnées. Seul le niveau Vault-Standard transfère les données modifiées vers le coffre. Quand vous configurez la sauvegarde, Sauvegarde Azure active la suppression réversible au niveau du compte de stockage avec une rétention de 14 jours, et prend un bail de durée infinie sur chaque capture instantanée de sauvegarde pour qu'elle ne puisse pas être supprimée par accident.
references:
  - title: About Azure Files backup
    url: https://learn.microsoft.com/en-us/azure/backup/azure-file-share-backup-overview
