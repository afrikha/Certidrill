id: az140-sr2-host-maintenance-3
objective: "4.1.6"
type: series_yesno
series: az140-sr2-host-maintenance
seriesOrder: 3
difficulty: 3
status: draft
stem:
  en: |
    You add the exclusion tag of SP1 to SH4, then you turn on drain mode for SH4.
  fr: |
    Vous ajoutez l'étiquette d'exclusion de SP1 à SH4, puis vous activez le mode drainage pour SH4.
body:
  solution:
    en: |
      You add an Azure tag named `excludeFromScaling` to the virtual machine of SH4. Then, in **Host pools** > **Pool4** > **Session hosts**, you select SH4 and select **Turn drain mode on**.
    fr: |
      Vous ajoutez une étiquette Azure nommée `excludeFromScaling` à la machine virtuelle de SH4. Ensuite, dans **Host pools** > **Pool4** > **Session hosts**, vous sélectionnez SH4 et sélectionnez **Turn drain mode on**.
answer: { value: true }
explanation:
  correct:
    en: Drain mode stops new sessions from being placed on SH4 while the existing sessions continue until users sign out. The exclusion tag prevents autoscale from turning SH4 on or off or changing its drain mode in any phase of SP1, so SH4 stays running and drained. Tagged hosts still count in the minimum percentage of hosts of SP1.
    fr: "Le mode drainage empêche le placement de nouvelles sessions sur SH4 tandis que les sessions existantes continuent jusqu'à leur fermeture. L'étiquette d'exclusion empêche la mise à l'échelle automatique de démarrer ou d'arrêter SH4 et de modifier son mode drainage, dans toutes les phases de SP1 : SH4 reste en cours d'exécution et drainé. Les hôtes étiquetés comptent toujours dans le pourcentage minimal d'hôtes de SP1."
references:
  - title: Drain session hosts for maintenance in Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/drain-mode
  - title: Autoscale scaling plans and example scenarios in Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/autoscale-scenarios
