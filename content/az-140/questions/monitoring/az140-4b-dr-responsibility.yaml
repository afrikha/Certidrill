id: az140-4b-dr-responsibility
objective: "4.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Adatum is writing a disaster recovery plan for its Azure Virtual Desktop deployment. The plan must cover only the components that Adatum is responsible for, not the components that Microsoft manages.

    Which component must the plan cover?
  fr: |
    Adatum rédige un plan de reprise d'activité pour son déploiement Azure Virtual Desktop. Le plan doit couvrir uniquement les composants dont Adatum est responsable, et non ceux que Microsoft gère.

    Quel composant le plan doit-il couvrir ?
body:
  options:
    - { id: a, text: { en: "The Azure Virtual Desktop gateway", fr: "La passerelle Azure Virtual Desktop" } }
    - { id: b, text: { en: "The Azure Virtual Desktop connection broker", fr: "Le service Broker de connexion Azure Virtual Desktop" } }
    - { id: c, text: { en: "The session host virtual machines", fr: "Les machines virtuelles hôtes de session" } }
    - { id: d, text: { en: "The Azure Virtual Desktop web service that publishes the feed", fr: "Le service web Azure Virtual Desktop qui publie le flux" } }
answer: { optionId: c }
explanation:
  correct:
    en: The customer or partner manages the session host VMs, profile management (usually FSLogix), applications, user data and user identities. Azure Virtual Desktop has no native disaster recovery feature for these, so the plan must use features such as a secondary host pool, Site Recovery, storage redundancy and backups.
    fr: Le client ou le partenaire gère les machines virtuelles hôtes de session, la gestion des profils (généralement FSLogix), les applications, les données utilisateur et les identités des utilisateurs. Azure Virtual Desktop n'offre aucune fonctionnalité native de reprise d'activité pour ces composants ; le plan doit donc s'appuyer sur un pool d'hôtes secondaire, Site Recovery, la redondance du stockage et des sauvegardes.
  options:
    a: { en: "The gateway is part of the control plane that Microsoft manages.", fr: "La passerelle fait partie du plan de contrôle géré par Microsoft." }
    b: { en: "The connection broker is part of the control plane that Microsoft manages.", fr: "Le service Broker de connexion fait partie du plan de contrôle géré par Microsoft." }
    d: { en: "The web service that delivers the feed is part of the control plane that Microsoft manages.", fr: "Le service web qui fournit le flux fait partie du plan de contrôle géré par Microsoft." }
references:
  - title: Azure Virtual Desktop disaster recovery concepts
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/disaster-recovery-concepts
