id: az140-4a-workbook-save-role
objective: "4.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An administrator named **Admin1** has the Desktop Virtualization Reader role on the Azure Virtual Desktop resources and the Log Analytics Reader role on the Log Analytics workspace used by Azure Virtual Desktop Insights. Admin1 can view the Insights reports.

    Admin1 customizes Insights and must save the result as a shared workbook in a resource group named **RG-Mon**. The solution must follow the principle of least privilege.

    Which additional role should you assign to Admin1 on RG-Mon?
  fr: |
    Un administrateur nommé **Admin1** dispose du rôle Desktop Virtualization Reader sur les ressources Azure Virtual Desktop et du rôle Log Analytics Reader sur l'espace de travail Log Analytics utilisé par Azure Virtual Desktop Insights. Admin1 peut consulter les rapports Insights.

    Admin1 personnalise Insights et doit enregistrer le résultat comme workbook partagé dans un groupe de ressources nommé **RG-Mon**. La solution doit respecter le principe du moindre privilège.

    Quel rôle supplémentaire devez-vous attribuer à Admin1 sur RG-Mon ?
body:
  options:
    - { id: a, text: Workbook Reader }
    - { id: b, text: Monitoring Reader }
    - { id: c, text: Desktop Virtualization Contributor }
    - { id: d, text: Workbook Contributor }
answer: { optionId: d }
explanation:
  correct:
    en: Saving a shared workbook requires the `microsoft.insights/workbooks/write` permission. Workbook Contributor ("Can save shared workbooks") grants it with only workbook and workbook template actions, which is less than Monitoring Contributor, the other built-in role that includes it.
    fr: Enregistrer un workbook partagé exige l'autorisation `microsoft.insights/workbooks/write`. Workbook Contributor (« Can save shared workbooks ») l'accorde avec les seules actions sur les workbooks et modèles de workbook, ce qui est moins que Monitoring Contributor, l'autre rôle intégré qui l'inclut.
  options:
    a: { en: "Workbook Reader can only read workbooks and their revisions.", fr: "Workbook Reader peut seulement lire les workbooks et leurs révisions." }
    b: { en: "Monitoring Reader has read privileges only; it can't save a shared workbook.", fr: "Monitoring Reader n'a que des privilèges de lecture ; il ne peut pas enregistrer de workbook partagé." }
    c: { en: "Desktop Virtualization Contributor manages Azure Virtual Desktop objects; it doesn't include workbook write permissions.", fr: "Desktop Virtualization Contributor gère les objets Azure Virtual Desktop ; il n'inclut pas les autorisations d'écriture sur les workbooks." }
references:
  - title: Azure built-in roles for Monitor
    url: https://learn.microsoft.com/en-us/azure/role-based-access-control/built-in-roles/monitor
  - title: Azure Workbooks overview
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/visualize/workbooks-overview
