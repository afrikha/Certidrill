id: az140-4a-data-source-mapping
objective: "4.1.1"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    You are configuring the monitoring of an Azure Virtual Desktop deployment that has one host pool, one workspace and a Log Analytics workspace named **LAW1**.

    You need to collect the following data in LAW1. What should you configure for each type of data? To answer, drag the appropriate configurations to the correct data types. Each configuration may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous configurez la supervision d'un déploiement Azure Virtual Desktop qui comporte un pool d'hôtes, un espace de travail et un espace de travail Log Analytics nommé **LAW1**.

    Vous devez collecter les données suivantes dans LAW1. Que devez-vous configurer pour chaque type de données ? Pour répondre, faites glisser les configurations appropriées vers les types de données correspondants. Chaque configuration peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: hpdiag, text: { en: "A diagnostic setting on the host pool", fr: "Un paramètre de diagnostic sur le pool d'hôtes" } }
    - { id: wsdiag, text: { en: "A diagnostic setting on the workspace", fr: "Un paramètre de diagnostic sur l'espace de travail" } }
    - { id: perf, text: { en: "Performance counters in a data collection rule", fr: "Des compteurs de performances dans une règle de collecte de données" } }
    - { id: events, text: { en: "Windows event logs in a data collection rule", fr: "Des journaux d'événements Windows dans une règle de collecte de données" } }
    - { id: actlog, text: { en: "A diagnostic setting for the subscription activity log", fr: "Un paramètre de diagnostic pour le journal d'activité de l'abonnement" } }
  targets:
    - id: t1
      text: { en: "Whether each session host registered successfully with the service", fr: "Si chaque hôte de session s'est inscrit correctement auprès du service" }
    - id: t2
      text: { en: "The maximum input delay of each user session", fr: "Le délai d'entrée maximal de chaque session utilisateur" }
    - id: t3
      text: { en: "Errors written to the Microsoft-FSLogix-Apps/Operational log", fr: "Les erreurs écrites dans le journal Microsoft-FSLogix-Apps/Operational" }
answer:
  mapping: { t1: hpdiag, t2: perf, t3: events }
explanation:
  correct:
    en: Host registration is a log category of the host pool diagnostic setting. The input delay per session is a guest performance counter, and the FSLogix operational log is a Windows event log; both are collected by the Azure Monitor Agent according to a data collection rule. The workspace diagnostic setting records feed, errors, checkpoints and management activities, and the activity log records control-plane operations on Azure resources.
    fr: L'inscription des hôtes est une catégorie de journaux du paramètre de diagnostic du pool d'hôtes. Le délai d'entrée par session est un compteur de performances invité, et le journal opérationnel FSLogix est un journal d'événements Windows ; les deux sont collectés par l'agent Azure Monitor selon une règle de collecte de données. Le paramètre de diagnostic de l'espace de travail enregistre le flux, les erreurs, les points de contrôle et les activités de gestion, et le journal d'activité enregistre les opérations du plan de contrôle sur les ressources Azure.
references:
  - title: Azure Virtual Desktop Insights glossary
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/insights-glossary
  - title: Enable Insights to monitor Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/insights
