id: az140-4a-ingestion-cost
objective: "4.1.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Fabrikam uses Azure Virtual Desktop Insights for a host pool of 200 session hosts. The diagnostic settings of the host pool and the workspace, and a data collection rule named **DCR-AVD** that uses the recommended Insights configuration, send data to a dedicated Log Analytics workspace named **LAW-AVD**.

    The daily ingestion into LAW-AVD is higher than the monitoring budget. You need to reduce the ingestion. The solution must keep the data that administrators use to diagnose unhealthy session hosts and must have the largest effect on the volume ingested.

    What should you do?
  fr: |
    Fabrikam utilise Azure Virtual Desktop Insights pour un pool d'hôtes de 200 hôtes de session. Les paramètres de diagnostic du pool d'hôtes et de l'espace de travail, ainsi qu'une règle de collecte de données nommée **DCR-AVD** qui utilise la configuration Insights recommandée, envoient les données vers un espace de travail Log Analytics dédié nommé **LAW-AVD**.

    L'ingestion quotidienne dans LAW-AVD dépasse le budget de supervision. Vous devez réduire l'ingestion. La solution doit conserver les données que les administrateurs utilisent pour diagnostiquer les hôtes de session défaillants et avoir le plus grand effet sur le volume ingéré.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Remove the Windows event logs from DCR-AVD and keep only the performance counters.", fr: "Supprimer les journaux d'événements Windows de DCR-AVD et ne conserver que les compteurs de performances." } }
    - { id: b, text: { en: "Remove the Checkpoints and Errors categories from the host pool diagnostic setting.", fr: "Supprimer les catégories Checkpoints et Errors du paramètre de diagnostic du pool d'hôtes." } }
    - { id: c, text: { en: "Increase the sample interval of the counters that produce the most records in DCR-AVD.", fr: "Augmenter l'intervalle d'échantillonnage des compteurs qui produisent le plus d'enregistrements dans DCR-AVD." } }
    - { id: d, text: { en: "Send the host pool and workspace diagnostic settings to a storage account instead.", fr: "Envoyer plutôt les paramètres de diagnostic du pool d'hôtes et de l'espace de travail vers un compte de stockage." } }
answer: { optionId: c }
explanation:
  correct:
    en: Performance counters make up most of the Insights ingestion (80 to 99 percent), so finding the counters with the most records in the Perf table and lowering their sample rate, or removing the least useful ones, has the largest effect. Windows event logs are small and are critical to diagnose unhealthy hosts, and Azure Virtual Desktop diagnostics represent less than 1 percent of the cost.
    fr: Les compteurs de performances représentent l'essentiel de l'ingestion d'Insights (80 à 99 %) ; trouver dans la table Perf les compteurs qui produisent le plus d'enregistrements et réduire leur fréquence d'échantillonnage, ou supprimer les moins utiles, a donc le plus grand effet. Les journaux d'événements Windows sont peu volumineux et essentiels pour diagnostiquer les hôtes défaillants, et les diagnostics Azure Virtual Desktop représentent moins de 1 % du coût.
  options:
    a: { en: "Event logs are a small, variable part of the volume, and Microsoft recommends keeping them because they're critical to diagnose unhealthy hosts.", fr: "Les journaux d'événements sont une part faible et variable du volume, et Microsoft recommande de les conserver car ils sont essentiels pour diagnostiquer les hôtes défaillants." }
    b: { en: "Azure Virtual Desktop diagnostics are less than 1 percent of the ingestion; removing them saves almost nothing and breaks the Insights reports.", fr: "Les diagnostics Azure Virtual Desktop représentent moins de 1 % de l'ingestion ; les supprimer n'économise presque rien et casse les rapports Insights." }
    d: { en: "Insights reads the diagnostics from the Log Analytics workspace, and they're a negligible part of the volume, so this breaks the reports for almost no saving.", fr: "Insights lit les diagnostics dans l'espace de travail Log Analytics, et ils sont une part négligeable du volume : cela casse les rapports pour une économie quasi nulle." }
references:
  - title: Estimate Azure Virtual Desktop Insights monitoring costs
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/insights-costs
