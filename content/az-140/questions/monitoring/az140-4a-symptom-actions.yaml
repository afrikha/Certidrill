id: az140-4a-symptom-actions
objective: "4.1.4"
type: dragdrop
difficulty: 3
status: draft
stem:
  en: |
    Contoso has a pooled host pool named **HP1** in the West Europe region. The session hosts use the Standard_D8s_v5 size and HP1 uses depth-first load balancing with a max session limit of 24. Azure Virtual Desktop Insights shows the following findings.

    Which action should you take for each finding? To answer, drag the appropriate actions to the correct findings. Each action may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso dispose d'un pool d'hôtes regroupé nommé **HP1** dans la région West Europe. Les hôtes de session utilisent la taille Standard_D8s_v5, et HP1 utilise l'équilibrage de charge en profondeur d'abord avec une limite maximale de sessions de 24. Azure Virtual Desktop Insights présente les constats suivants.

    Quelle action devez-vous entreprendre pour chaque constat ? Pour répondre, faites glisser les actions appropriées vers les constats correspondants. Chaque action peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: memory, text: { en: "Resize the session hosts to a size with more memory per vCPU", fr: "Redimensionner les hôtes de session vers une taille offrant plus de mémoire par processeur virtuel" } }
    - { id: breadth, text: { en: "Use breadth-first load balancing during working hours", fr: "Utiliser l'équilibrage de charge en largeur d'abord pendant les heures de travail" } }
    - { id: region, text: { en: "Deploy session hosts in an Azure region closer to those users", fr: "Déployer des hôtes de session dans une région Azure plus proche de ces utilisateurs" } }
    - { id: gpu, text: { en: "Move the session hosts to a GPU-enabled VM size", fr: "Passer les hôtes de session à une taille de machine virtuelle avec GPU" } }
    - { id: drain, text: { en: "Turn on drain mode on the busiest session host", fr: "Activer le mode drainage sur l'hôte de session le plus chargé" } }
  targets:
    - id: t1
      text: { en: "Host Diagnostics: at peak, every host shows low Available MBytes and high Page Faults/sec, while CPU stays below 50 percent.", fr: "Host Diagnostics : en période de pointe, chaque hôte présente un Available MBytes faible et un Page Faults/sec élevé, alors que le processeur reste sous 50 %." }
    - id: t2
      text: { en: "Host Performance: during the morning, the first host has a high input delay while three other running hosts have only a few sessions.", fr: "Host Performance : le matin, le premier hôte présente un délai d'entrée élevé alors que trois autres hôtes allumés n'ont que quelques sessions." }
    - id: t3
      text: { en: "Connection Performance: users in Singapore have a median round-trip time of 250 ms.", fr: "Connection Performance : les utilisateurs de Singapour ont un temps d'aller-retour médian de 250 ms." }
answer:
  mapping: { t1: memory, t2: breadth, t3: region }
explanation:
  correct:
    en: Low available memory with many page faults and moderate CPU on every host indicates memory pressure, fixed by more memory per vCPU (or fewer sessions per host). Depth-first concentrates sessions on one host until it reaches the limit, so a saturated host next to lightly used running hosts calls for breadth-first, which spreads new sessions while hosts are running. A median RTT well above 200 ms for one group of users comes from the distance to the session hosts' region, so hosts closer to them reduce it.
    fr: Une mémoire disponible faible avec beaucoup de défauts de page et un processeur modéré sur chaque hôte indique une pression mémoire, corrigée par davantage de mémoire par processeur virtuel (ou moins de sessions par hôte). Depth-first concentre les sessions sur un hôte jusqu'à sa limite ; un hôte saturé à côté d'hôtes allumés peu utilisés demande donc breadth-first, qui répartit les nouvelles sessions sur les hôtes en marche. Un RTT médian bien au-delà de 200 ms pour un groupe d'utilisateurs vient de la distance jusqu'à la région des hôtes de session ; des hôtes plus proches le réduisent.
  options:
    gpu: { en: "A GPU helps graphics-intensive workloads; it doesn't address memory pressure, session placement or network latency.", fr: "Un GPU aide les charges graphiques ; il ne règle ni la pression mémoire, ni le placement des sessions, ni la latence réseau." }
    drain: { en: "Drain mode only stops new sessions on one host; the users already on it keep the high input delay, and the cause remains.", fr: "Le mode drainage arrête seulement les nouvelles sessions sur un hôte ; les utilisateurs déjà présents gardent un délai d'entrée élevé, et la cause demeure." }
references:
  - title: Use cases for Azure Virtual Desktop Insights
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/insights-use-cases
  - title: Configure host pool load balancing in Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/configure-host-pool-load-balancing
