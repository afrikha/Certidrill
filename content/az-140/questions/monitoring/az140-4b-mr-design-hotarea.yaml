id: az140-4b-mr-design-hotarea
objective: "4.2.3"
type: hotarea
difficulty: 3
status: draft
stem:
  en: |
    Contoso is adding a secondary region to an Azure Virtual Desktop deployment. The session hosts are joined to an Active Directory Domain Services (AD DS) domain, and the FSLogix profile shares on Azure Files use AD DS authentication. The planned design is shown in the following table.

    The deployment must keep working if the whole West Europe region fails, and each session host must use the profile storage of its own region first.

    Answer each prompt by selecting the planned configuration that must be changed.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso ajoute une région secondaire à un déploiement Azure Virtual Desktop. Les hôtes de session sont joints à un domaine Active Directory Domain Services (AD DS), et les partages de profils FSLogix sur Azure Files utilisent l'authentification AD DS. La conception prévue figure dans le tableau suivant.

    Le déploiement doit continuer à fonctionner si toute la région West Europe tombe en panne, et chaque hôte de session doit utiliser d'abord le stockage de profils de sa propre région.

    Répondez à chaque consigne en sélectionnant la configuration prévue qui doit être modifiée.

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
    - id: p1
      text: { en: "The configuration that prevents users from signing in to HP-NEU during a West Europe outage", fr: "La configuration qui empêche les utilisateurs de se connecter à HP-NEU pendant une panne de West Europe" }
    - id: p2
      text: { en: "The configuration that makes the HP-NEU session hosts use the West Europe profile storage first", fr: "La configuration qui fait utiliser d'abord le stockage de profils de West Europe par les hôtes de session de HP-NEU" }
  grid:
    header: [{ en: Component, fr: Composant }, { en: "West Europe (primary)", fr: "West Europe (principale)" }, { en: "North Europe (secondary)", fr: "North Europe (secondaire)" }]
    rows:
      - - { text: { en: Host pool, fr: Pool d'hôtes } }
        - { text: { en: "HP-WEU, pooled, 30 session hosts", fr: "HP-WEU, regroupé, 30 hôtes de session" } }
        - { text: { en: "HP-NEU, pooled, 2 running session hosts and a scaling plan", fr: "HP-NEU, regroupé, 2 hôtes de session en cours d'exécution et un plan de mise à l'échelle" }, area: hp }
      - - { text: { en: Domain controllers, fr: Contrôleurs de domaine } }
        - { text: { en: "DC1 in zone 1, DC2 in zone 2", fr: "DC1 dans la zone 1, DC2 dans la zone 2" } }
        - { text: { en: "None; the session hosts use DC1 and DC2 over global virtual network peering", fr: "Aucun ; les hôtes de session utilisent DC1 et DC2 via le peering de réseaux virtuels mondial" }, area: dc }
      - - { text: Microsoft Entra Connect }
        - { text: { en: "SYNC1, active", fr: "SYNC1, actif" } }
        - { text: { en: "SYNC2, staging mode", fr: "SYNC2, mode intermédiaire" }, area: sync }
      - - { text: CCDLocations }
        - { text: "stprofweu;stprofneu" }
        - { text: "stprofweu;stprofneu", area: ccd }
      - - { text: { en: Session host image, fr: Image des hôtes de session } }
        - { text: { en: "gal-weu, image version replicated to West Europe", fr: "gal-weu, version d'image répliquée dans West Europe" } }
        - { text: { en: "gal-neu, image version replicated to North Europe", fr: "gal-neu, version d'image répliquée dans North Europe" }, area: img }
answer:
  values: { p1: dc, p2: ccd }
explanation:
  correct:
    en: |
      With no domain controller in North Europe, the HP-NEU session hosts and the AD DS-authenticated profile shares depend on DC1 and DC2, which are lost with West Europe: deploy at least one domain controller with the global catalog and DNS roles in the secondary region. Cloud Cache uses the providers in the order of CCDLocations, so the HP-NEU hosts must list stprofneu first; the secondary value must be the primary value reversed. The host pool, the staging-mode Microsoft Entra Connect server and the gallery per region follow Microsoft's recommendations.
    fr: |
      Sans contrôleur de domaine dans North Europe, les hôtes de session de HP-NEU et les partages de profils authentifiés par AD DS dépendent de DC1 et DC2, qui sont perdus avec West Europe : déployez au moins un contrôleur de domaine avec les rôles de catalogue global et DNS dans la région secondaire. Cloud Cache utilise les fournisseurs dans l'ordre de CCDLocations : les hôtes de HP-NEU doivent donc indiquer stprofneu en premier ; la valeur secondaire doit être la valeur principale inversée. Le pool d'hôtes, le serveur Microsoft Entra Connect en mode intermédiaire et la galerie par région suivent les recommandations de Microsoft.
references:
  - title: Multiregion BCDR for Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/architecture/example-scenario/azure-virtual-desktop/azure-virtual-desktop-multi-region-bcdr
