id: az140-4a-lb-statements
objective: "4.1.4"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    You have a pooled host pool named **HP1** that contains nine session hosts. HP1 uses breadth-first load balancing with a max session limit of 20. Each session host currently has between 11 and 19 sessions.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un pool d'hôtes regroupé nommé **HP1** qui contient neuf hôtes de session. HP1 utilise l'équilibrage de charge en largeur d'abord avec une limite maximale de sessions de 20. Chaque hôte de session compte actuellement entre 11 et 19 sessions.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: A new user session always goes to the session host that has the fewest sessions.
        fr: Une nouvelle session utilisateur est toujours placée sur l'hôte de session qui compte le moins de sessions.
    - id: s2
      text:
        en: If you lower the max session limit of HP1 to 12, the existing sessions on the hosts that have more than 12 sessions stay connected.
        fr: Si vous abaissez la limite maximale de sessions de HP1 à 12, les sessions existantes des hôtes qui en comptent plus de 12 restent connectées.
    - id: s3
      text:
        en: A user who has a disconnected session on a session host that is in drain mode is reconnected to that session host.
        fr: Un utilisateur qui a une session déconnectée sur un hôte de session en mode drainage est reconnecté à cet hôte de session.
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: Breadth-first picks a host at random among the half of the available hosts with the fewest sessions, so the new session can go to any of the five least-loaded hosts. Lowering the max session limit doesn't affect sessions that already exist. A user who already has an active or disconnected session in the host pool is redirected to that session host, even if drain mode is turned on.
    fr: Breadth-first choisit un hôte au hasard parmi la moitié des hôtes disponibles qui comptent le moins de sessions ; la nouvelle session peut donc aller sur l'un des cinq hôtes les moins chargés. Abaisser la limite maximale de sessions n'affecte pas les sessions déjà ouvertes. Un utilisateur qui a déjà une session active ou déconnectée dans le pool d'hôtes est redirigé vers cet hôte de session, même si le mode drainage est activé.
references:
  - title: Configure host pool load balancing in Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/configure-host-pool-load-balancing
