id: az140-4b-update-shu-order
objective: "4.2.1"
type: ordering
difficulty: 3
status: draft
stem:
  en: |
    Tailspin Toys has an Azure Virtual Desktop pooled host pool named **HP-Call** that was created with a session host configuration. A scaling plan with autoscale is assigned to HP-Call. The image of the session hosts is stored in an Azure Compute Gallery named **gal-tailspin**.

    You patched a reference VM and generalized it. You need to deploy the patched image to all the session hosts of HP-Call. Autoscale must stay enabled on HP-Call for as long as possible.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Tailspin Toys dispose d'un pool d'hôtes Azure Virtual Desktop regroupé nommé **HP-Call**, créé avec une configuration d'hôte de session. Un plan de mise à l'échelle avec mise à l'échelle automatique est attribué à HP-Call. L'image des hôtes de session est stockée dans une galerie Azure Compute Gallery nommée **gal-tailspin**.

    Vous avez corrigé une machine virtuelle de référence et l'avez généralisée. Vous devez déployer l'image corrigée sur tous les hôtes de session de HP-Call. La mise à l'échelle automatique doit rester activée sur HP-Call le plus longtemps possible.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: img, text: { en: "Create a new image version in gal-tailspin from the reference VM.", fr: "Créer une nouvelle version d'image dans gal-tailspin à partir de la machine virtuelle de référence." } }
    - { id: off, text: { en: "Disable autoscale for HP-Call.", fr: "Désactiver la mise à l'échelle automatique pour HP-Call." } }
    - { id: upd, text: { en: "Create a session host update for HP-Call that uses the new image version.", fr: "Créer une mise à jour des hôtes de session pour HP-Call qui utilise la nouvelle version d'image." } }
    - { id: on, text: { en: "Enable autoscale for HP-Call after the update completes.", fr: "Activer la mise à l'échelle automatique pour HP-Call une fois la mise à jour terminée." } }
    - { id: drain, text: { en: "Turn on drain mode for all the session hosts of HP-Call.", fr: "Activer le mode drainage sur tous les hôtes de session de HP-Call." } }
    - { id: token, text: { en: "Generate a new registration key for HP-Call.", fr: "Générer une nouvelle clé d'inscription pour HP-Call." } }
    - { id: del, text: { en: "Delete the existing session hosts of HP-Call.", fr: "Supprimer les hôtes de session existants de HP-Call." } }
answer:
  sequence: [ img, off, upd, on ]
explanation:
  correct:
    en: |
      The session host update needs the new image version to exist, so you publish it in the gallery first. Autoscale must be disabled before the update starts and stay disabled until it finishes, otherwise the update can fail; disabling it just before the update keeps it enabled as long as possible. The update itself drains, removes and recreates the session hosts in batches, then you enable autoscale again.
    fr: |
      La mise à jour des hôtes de session exige que la nouvelle version d'image existe : vous la publiez donc d'abord dans la galerie. La mise à l'échelle automatique doit être désactivée avant le démarrage de la mise à jour et le rester jusqu'à sa fin, sinon la mise à jour peut échouer ; la désactiver juste avant la mise à jour la laisse active le plus longtemps possible. La mise à jour elle-même draine, retire et recrée les hôtes de session par lots, puis vous réactivez la mise à l'échelle automatique.
  options:
    drain: { en: "The update drains each batch itself; draining every host at once would block all new connections.", fr: "La mise à jour draine elle-même chaque lot ; drainer tous les hôtes en même temps bloquerait toutes les nouvelles connexions." }
    token: { en: "The service registers the new VMs with the host pool during the update; no manual registration key is needed.", fr: "Le service inscrit les nouvelles machines virtuelles dans le pool d'hôtes pendant la mise à jour ; aucune clé d'inscription manuelle n'est nécessaire." }
    del: { en: "The update deletes the original VMs after the new ones have joined the host pool; deleting them first would cause an outage.", fr: "La mise à jour supprime les machines virtuelles d'origine une fois les nouvelles jointes au pool d'hôtes ; les supprimer d'abord provoquerait une interruption." }
references:
  - title: Session host update
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/session-host-update
