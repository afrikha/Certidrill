id: az140-cs1b-desktop-backup
objective: "4.2.5"
type: yesno_statements
caseStudy: az140-cs1b-lucerne-publishing
difficulty: 2
status: draft
stem:
  en: |
    You are planning the backup of the personal desktops. For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous planifiez la sauvegarde des bureaux personnels. Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: To meet the backup requirement, the desktops must be protected by an Enhanced backup policy.
        fr: Pour satisfaire l'exigence de sauvegarde, les bureaux doivent être protégés par une stratégie de sauvegarde améliorée (Enhanced).
    - id: s2
      text:
        en: After the desktops are protected, you can switch them to a Standard backup policy later if you need to reduce costs.
        fr: Une fois les bureaux protégés, vous pourrez les basculer plus tard vers une stratégie de sauvegarde Standard pour réduire les coûts.
    - id: s3
      text:
        en: If a second vault is needed later, you can protect the desktops in a Recovery Services vault in Canada East.
        fr: Si un deuxième coffre devient nécessaire, vous pourrez protéger les bureaux dans un coffre Recovery Services de la région Canada East.
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: |
      A Standard policy backs up a VM once a day at most, whereas an Enhanced policy supports schedules every 4, 6, 8, 12 or 24 hours, so the 4-hour requirement needs an Enhanced policy. Azure Backup does not allow you to change a VM protected by an Enhanced policy back to a Standard policy. A Recovery Services vault protects only VMs in its own region, so the Canada Central desktops cannot be protected by a vault in Canada East.
    fr: |
      Une stratégie Standard sauvegarde une machine virtuelle au plus une fois par jour, alors qu'une stratégie améliorée prend en charge des planifications toutes les 4, 6, 8, 12 ou 24 heures : l'exigence de 4 heures impose donc une stratégie améliorée. Sauvegarde Azure ne permet pas de repasser à une stratégie Standard une machine virtuelle protégée par une stratégie améliorée. Un coffre Recovery Services ne protège que les machines virtuelles de sa propre région : les bureaux de Canada Central ne peuvent pas être protégés par un coffre de Canada East.
references:
  - title: Back Up Azure VMs with the Enhanced Policy
    url: https://learn.microsoft.com/en-us/azure/backup/backup-azure-vms-enhanced-policy
