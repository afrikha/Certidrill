id: az140-4a-feed-category
objective: "4.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have an Azure Virtual Desktop workspace named **WS1** and a Log Analytics workspace named **LAW1**.

    Several users report that Windows App sometimes fails to refresh their list of desktops and apps. You need to record in LAW1 every attempt by users to subscribe to WS1, including the attempts that succeed.

    Which diagnostic category should you enable in the diagnostic setting of WS1?
  fr: |
    Vous disposez d'un espace de travail Azure Virtual Desktop nommé **WS1** et d'un espace de travail Log Analytics nommé **LAW1**.

    Plusieurs utilisateurs signalent que Windows App ne parvient pas toujours à actualiser leur liste de bureaux et d'applications. Vous devez enregistrer dans LAW1 chaque tentative d'abonnement des utilisateurs à WS1, y compris les tentatives réussies.

    Quelle catégorie de diagnostic devez-vous activer dans le paramètre de diagnostic de WS1 ?
body:
  options:
    - { id: a, text: Feed }
    - { id: b, text: Management Activities }
    - { id: c, text: Checkpoints }
    - { id: d, text: Errors }
answer: { optionId: a }
explanation:
  correct:
    en: The Feed category records whether users can subscribe to a workspace, that is, download the list of resources published to them. It logs successful and failed subscriptions, so it shows every attempt.
    fr: La catégorie Feed enregistre si les utilisateurs parviennent à s'abonner à un espace de travail, c'est-à-dire à télécharger la liste des ressources qui leur sont publiées. Elle journalise les abonnements réussis et échoués, et montre donc chaque tentative.
  options:
    b: { en: "Management Activities records changes made to Azure Virtual Desktop objects through the APIs or PowerShell, not user subscriptions.", fr: "Management Activities enregistre les modifications apportées aux objets Azure Virtual Desktop par les API ou PowerShell, pas les abonnements des utilisateurs." }
    c: { en: "Checkpoints records steps reached during an activity, such as an app launch; it doesn't record each feed subscription.", fr: "Checkpoints enregistre les étapes atteintes pendant une activité, comme le lancement d'une application ; il n'enregistre pas chaque abonnement au flux." }
    d: { en: "Errors records only the problems users meet; successful subscriptions wouldn't appear.", fr: "Errors n'enregistre que les problèmes rencontrés par les utilisateurs ; les abonnements réussis n'y figureraient pas." }
references:
  - title: Send diagnostic data to Log Analytics for Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/diagnostics-log-analytics
