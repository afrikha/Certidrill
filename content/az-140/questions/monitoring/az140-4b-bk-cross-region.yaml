id: az140-4b-bk-cross-region
objective: "4.2.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Woodgrove Bank stores the FSLogix profile containers of an Azure Virtual Desktop host pool in an Azure file share named **profiles** in the Germany West Central region. The storage account uses zone-redundant storage (ZRS). The profiles aren't replicated to any other region.

    You need a backup design that meets the following requirements:

    - If Germany West Central is unavailable, an administrator must be able to restore the profile share in the paired region.
    - A ransomware attack on the storage account must not be able to destroy all the backup copies.

    What should you configure?
  fr: |
    Woodgrove Bank stocke les conteneurs de profils FSLogix d'un pool d'hôtes Azure Virtual Desktop dans un partage de fichiers Azure nommé **profiles** de la région Germany West Central. Le compte de stockage utilise le stockage redondant interzone (ZRS). Les profils ne sont répliqués vers aucune autre région.

    Vous avez besoin d'une conception de sauvegarde qui satisfait les exigences suivantes :

    - si Germany West Central est indisponible, un administrateur doit pouvoir restaurer le partage de profils dans la région jumelée ;
    - une attaque par rançongiciel sur le compte de stockage ne doit pas pouvoir détruire toutes les copies de sauvegarde.

    Que devez-vous configurer ?
body:
  options:
    - { id: a, text: { en: "A Snapshot tier policy, in a Recovery Services vault that uses geo-redundant storage", fr: "Une stratégie du niveau Snapshot, dans un coffre Recovery Services qui utilise le stockage géoredondant" } }
    - { id: b, text: { en: "A Vault-Standard tier policy, in a geo-redundant vault with Cross Region Restore enabled", fr: "Une stratégie du niveau Vault-Standard, dans un coffre géoredondant avec la restauration interrégion activée" } }
    - { id: c, text: { en: "A Vault-Standard tier policy, in a Recovery Services vault that uses locally redundant storage", fr: "Une stratégie du niveau Vault-Standard, dans un coffre Recovery Services qui utilise le stockage localement redondant" } }
    - { id: d, text: { en: "A Snapshot tier policy, with soft delete enabled on the storage account", fr: "Une stratégie du niveau Snapshot, avec la suppression réversible activée sur le compte de stockage" } }
answer: { optionId: b }
explanation:
  correct:
    en: The vaulted (Vault-Standard) tier copies the changed data from each snapshot to the vault, outside the storage account, which provides ransomware protection. With a geo-redundant vault and Cross Region Restore enabled, the vaulted recovery points can be restored in the paired region when the primary region is unavailable.
    fr: Le niveau de sauvegarde dans le coffre (Vault-Standard) copie les données modifiées de chaque capture instantanée vers le coffre, en dehors du compte de stockage, ce qui protège contre les rançongiciels. Avec un coffre géoredondant et la restauration interrégion activée, les points de récupération du coffre peuvent être restaurés dans la région jumelée quand la région principale est indisponible.
  options:
    a: { en: "In the Snapshot tier, the backups stay as snapshots in the storage account and the vault holds only metadata, so the vault redundancy doesn't protect the data.", fr: "Au niveau Snapshot, les sauvegardes restent des captures instantanées dans le compte de stockage et le coffre ne contient que des métadonnées : la redondance du coffre ne protège pas les données." }
    c: { en: "A locally redundant vault keeps the copies in Germany West Central only, so nothing can be restored in the paired region.", fr: "Un coffre localement redondant ne conserve les copies que dans Germany West Central : rien ne peut être restauré dans la région jumelée." }
    d: { en: "Soft delete and snapshots stay in the same storage account in the same region; they give no copy that survives the loss of the region or of the account.", fr: "La suppression réversible et les captures instantanées restent dans le même compte de stockage, dans la même région ; elles ne donnent aucune copie qui survive à la perte de la région ou du compte." }
references:
