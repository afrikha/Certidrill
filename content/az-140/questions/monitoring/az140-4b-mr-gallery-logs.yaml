id: az140-4b-mr-gallery-logs
objective: "4.2.3"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Proseware is extending its Azure Virtual Desktop deployment from West US 2 to a secondary region, East US 2. The deployment includes the following resources in West US 2:

    - An Azure Compute Gallery named **gal-wus2** that contains the image version **1.4.0** of the session host image, replicated only to West US 2
    - A Log Analytics workspace named **law-wus2** used by Azure Virtual Desktop Insights for all the session hosts

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware étend son déploiement Azure Virtual Desktop de West US 2 vers une région secondaire, East US 2. Le déploiement comprend les ressources suivantes dans West US 2 :

    - une galerie Azure Compute Gallery nommée **gal-wus2** qui contient la version d'image **1.4.0** de l'image des hôtes de session, répliquée uniquement dans West US 2 ;
    - un espace de travail Log Analytics nommé **law-wus2** utilisé par Azure Virtual Desktop Insights pour tous les hôtes de session.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: To create session hosts in East US 2 from image version 1.4.0, you must replicate the image version to East US 2.
        fr: Pour créer des hôtes de session dans East US 2 à partir de la version d'image 1.4.0, vous devez répliquer la version d'image dans East US 2.
    - id: s2
      text:
        en: If West US 2 becomes unavailable, you can still create a new image version in gal-wus2.
        fr: Si West US 2 devient indisponible, vous pouvez toujours créer une nouvelle version d'image dans gal-wus2.
    - id: s3
      text:
        en: If West US 2 becomes unavailable, the session hosts in East US 2 can still send their data to law-wus2.
        fr: Si West US 2 devient indisponible, les hôtes de session de East US 2 peuvent toujours envoyer leurs données à law-wus2.
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: |
      Azure Compute Gallery isn't a global resource: VMs are created from a replica of the image version in their region, so you replicate 1.4.0 to East US 2 (Microsoft also recommends at least two galleries in separate regions). When a gallery's region is down, you can't create or update gallery resources there. A single Log Analytics workspace gives a unified view, but if its region is unavailable the secondary region can't use it; use a workspace per region or plan workspace replication.
    fr: |
      Azure Compute Gallery n'est pas une ressource globale : les machines virtuelles sont créées à partir d'un réplica de la version d'image dans leur région ; vous répliquez donc 1.4.0 dans East US 2 (Microsoft recommande aussi au moins deux galeries dans des régions distinctes). Quand la région d'une galerie est en panne, vous ne pouvez pas y créer ni mettre à jour de ressources de galerie. Un espace de travail Log Analytics unique offre une vue unifiée, mais si sa région est indisponible, la région secondaire ne peut pas l'utiliser ; utilisez un espace de travail par région ou prévoyez la réplication de l'espace de travail.
references:
  - title: Overview of Azure Compute Gallery
    url: https://learn.microsoft.com/en-us/azure/virtual-machines/azure-compute-gallery
  - title: Multiregion BCDR for Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/architecture/example-scenario/azure-virtual-desktop/azure-virtual-desktop-multi-region-bcdr
