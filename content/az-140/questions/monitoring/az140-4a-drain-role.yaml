id: az140-4a-drain-role
objective: "4.1.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have a pooled host pool named **HP1**. The members of a group named **GRP-Ops** patch the session hosts of HP1 every month.

    GRP-Ops must be able to turn drain mode on and off for the session hosts of HP1. GRP-Ops must not be able to change the properties of HP1, such as its load balancing algorithm. The solution must follow the principle of least privilege.

    Which role should you assign to GRP-Ops on HP1?
  fr: |
    Vous disposez d'un pool d'hôtes regroupé nommé **HP1**. Les membres d'un groupe nommé **GRP-Ops** appliquent chaque mois les correctifs aux hôtes de session de HP1.

    GRP-Ops doit pouvoir activer et désactiver le mode drainage des hôtes de session de HP1. GRP-Ops ne doit pas pouvoir modifier les propriétés de HP1, comme son algorithme d'équilibrage de charge. La solution doit respecter le principe du moindre privilège.

    Quel rôle devez-vous attribuer à GRP-Ops sur HP1 ?
body:
  options:
    - { id: a, text: Desktop Virtualization Session Host Operator }
    - { id: b, text: Desktop Virtualization User Session Operator }
    - { id: c, text: Desktop Virtualization Host Pool Contributor }
    - { id: d, text: Desktop Virtualization Host Pool Reader }
answer: { optionId: a }
explanation:
  correct:
    en: Desktop Virtualization Session Host Operator lets users view and remove session hosts and change drain mode, without write access to the host pool itself. It's the role that Microsoft lists as required to drain session hosts.
    fr: Desktop Virtualization Session Host Operator permet de consulter et de supprimer des hôtes de session et de changer le mode drainage, sans accès en écriture au pool d'hôtes lui-même. C'est le rôle que Microsoft indique comme requis pour drainer les hôtes de session.
  options:
    b: { en: "User Session Operator manages user sessions (message, disconnect, sign out) and can't change drain mode.", fr: "User Session Operator gère les sessions utilisateur (message, déconnexion, fermeture de session) et ne peut pas changer le mode drainage." }
    c: { en: "Host Pool Contributor manages every aspect of the host pool, including its load balancing algorithm.", fr: "Host Pool Contributor gère tous les aspects du pool d'hôtes, y compris son algorithme d'équilibrage de charge." }
    d: { en: "Host Pool Reader can only view the host pool.", fr: "Host Pool Reader peut seulement consulter le pool d'hôtes." }
references:
  - title: Built-in Azure RBAC roles for Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/rbac
  - title: Drain session hosts for maintenance in Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/drain-mode
