id: az140-4b-dr-models
objective: "4.2.2"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove Bank has three Azure Virtual Desktop host pools in the West Europe region. You need a disaster recovery solution for each host pool that protects against an outage of the entire West Europe region and meets the requirements shown in the answer area.

    Which solution should you use for each host pool? To answer, drag the appropriate solutions to the correct host pools. Each solution may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove Bank dispose de trois pools d'hôtes Azure Virtual Desktop dans la région West Europe. Vous avez besoin, pour chaque pool d'hôtes, d'une solution de reprise d'activité qui protège contre une panne de toute la région West Europe et satisfait les exigences indiquées dans la zone de réponse.

    Quelle solution devez-vous utiliser pour chaque pool d'hôtes ? Pour répondre, faites glisser les solutions appropriées vers les pools d'hôtes correspondants. Chaque solution peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: aa, text: { en: "Active-active host pools in two regions with FSLogix Cloud Cache", fr: "Des pools d'hôtes actif-actif dans deux régions avec FSLogix Cloud Cache" } }
    - { id: ap, text: { en: "Active-passive host pools in two regions with FSLogix Cloud Cache", fr: "Des pools d'hôtes actif-passif dans deux régions avec FSLogix Cloud Cache" } }
    - { id: asr, text: { en: "Azure Site Recovery replication of each session host VM", fr: "La réplication Azure Site Recovery de chaque machine virtuelle hôte de session" } }
    - { id: az, text: { en: "Session hosts spread across availability zones", fr: "Des hôtes de session répartis entre les zones de disponibilité" } }
    - { id: bk, text: { en: "Azure Backup of the session hosts with Cross Region Restore", fr: "Sauvegarde Azure des hôtes de session avec la restauration interrégion" } }
  targets:
    - id: t1
      text: { en: "HP-Traders (personal): each trader keeps data and apps on their own VM; RPO of 15 minutes or less", fr: "HP-Traders (personnel) : chaque trader conserve ses données et applications sur sa propre machine virtuelle ; RPO de 15 minutes ou moins" }
    - id: t2
      text: { en: "HP-Branch (pooled): no administrator action during an outage; RTO close to zero", fr: "HP-Branch (regroupé) : aucune action d'administrateur pendant une panne ; RTO proche de zéro" }
    - id: t3
      text: { en: "HP-Back (pooled): minimize compute cost in the secondary region; RTO of one hour; users keep a single workspace", fr: "HP-Back (regroupé) : réduire au minimum le coût de calcul dans la région secondaire ; RTO d'une heure ; les utilisateurs gardent un seul espace de travail" }
answer:
  mapping: { t1: asr, t2: aa, t3: ap }
explanation:
  correct:
    en: |
      Personal session hosts hold user state, so Microsoft recommends Site Recovery at the VM level, with a typical RPO of 5 to 15 minutes. Active-active pooled host pools serve users in both regions all the time, so an outage needs no administrator action and the RTO is near zero. Active-passive keeps few running hosts in the secondary region and uses one workspace; failover needs an administrator and takes roughly 15 to 60 minutes.
    fr: |
      Les hôtes de session personnels contiennent l'état des utilisateurs : Microsoft recommande donc Site Recovery au niveau de chaque machine virtuelle, avec un RPO typique de 5 à 15 minutes. Des pools d'hôtes regroupés actif-actif servent les utilisateurs dans les deux régions en permanence : une panne ne demande aucune action d'administrateur et le RTO est proche de zéro. Le modèle actif-passif garde peu d'hôtes en cours d'exécution dans la région secondaire et utilise un seul espace de travail ; le basculement demande l'intervention d'un administrateur et prend environ 15 à 60 minutes.
  options:
    az: { en: "Availability zones protect against a datacenter failure, not against the loss of the whole region.", fr: "Les zones de disponibilité protègent contre la défaillance d'un centre de données, pas contre la perte de toute la région." }
    bk: { en: "Restoring VMs from a daily backup gives an RPO of up to a day and a long RTO.", fr: "Restaurer des machines virtuelles à partir d'une sauvegarde quotidienne donne un RPO pouvant atteindre une journée et un RTO long." }
references:
  - title: Multiregion BCDR for Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/architecture/example-scenario/azure-virtual-desktop/azure-virtual-desktop-multi-region-bcdr
