id: az140-4b-bk-anf-backup
objective: "4.2.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Litware stores the FSLogix profile containers of an Azure Virtual Desktop host pool on an Azure NetApp Files SMB volume named **vol-profiles**. A snapshot policy creates hourly and daily snapshots of the volume.

    Compliance requires a monthly copy of the profiles to be kept for 12 months. The copies must remain available even if vol-profiles is deleted. The solution must minimize administrative effort.

    What should you configure?
  fr: |
    Litware stocke les conteneurs de profils FSLogix d'un pool d'hôtes Azure Virtual Desktop sur un volume SMB Azure NetApp Files nommé **vol-profiles**. Une stratégie de capture instantanée crée des captures instantanées horaires et quotidiennes du volume.

    La conformité exige qu'une copie mensuelle des profils soit conservée pendant 12 mois. Les copies doivent rester disponibles même si vol-profiles est supprimé. La solution doit réduire au minimum l'effort d'administration.

    Que devez-vous configurer ?
body:
  options:
    - { id: a, text: { en: "Add 12 monthly snapshots to the snapshot policy of vol-profiles", fr: "Ajouter 12 captures instantanées mensuelles à la stratégie de capture instantanée de vol-profiles" } }
    - { id: b, text: { en: "An Azure NetApp Files backup policy that keeps 12 monthly backups", fr: "Une stratégie de sauvegarde Azure NetApp Files qui conserve 12 sauvegardes mensuelles" } }
    - { id: c, text: { en: "An Azure Backup policy for Azure Files that keeps 12 monthly points", fr: "Une stratégie Sauvegarde Azure pour Azure Files qui conserve 12 points mensuels" } }
    - { id: d, text: { en: "A monthly restore of the latest snapshot to a new volume", fr: "Une restauration mensuelle de la dernière capture instantanée vers un nouveau volume" } }
answer: { optionId: b }
explanation:
  correct:
    en: Azure NetApp Files backup copies snapshots to ZRS-enabled Azure storage for long-term retention, with a backup policy that sets how many daily, weekly and monthly backups to keep. After a baseline, backups are block-incremental, and they are retained in the backup vault even if the volume is deleted.
    fr: La sauvegarde Azure NetApp Files copie les captures instantanées vers un stockage Azure compatible ZRS pour une rétention à long terme, avec une stratégie de sauvegarde qui définit le nombre de sauvegardes quotidiennes, hebdomadaires et mensuelles à conserver. Après une copie de référence, les sauvegardes sont incrémentielles au niveau des blocs, et elles sont conservées dans le coffre de sauvegarde même si le volume est supprimé.
  options:
    a: { en: "Snapshots are stored in the volume itself, so they don't survive the deletion of vol-profiles.", fr: "Les captures instantanées sont stockées dans le volume lui-même : elles ne survivent pas à la suppression de vol-profiles." }
    c: { en: "Azure Backup for Azure Files protects Azure file shares, not Azure NetApp Files volumes.", fr: "Sauvegarde Azure pour Azure Files protège des partages de fichiers Azure, pas des volumes Azure NetApp Files." }
    d: { en: "Creating and keeping a new volume every month is manual work and doubles capacity pool consumption each time.", fr: "Créer et conserver un nouveau volume chaque mois est un travail manuel qui double à chaque fois la consommation du pool de capacité." }
references:
  - title: Understand Azure NetApp Files snapshot-based data protection
    url: https://learn.microsoft.com/en-us/azure/azure-netapp-files/snapshots-introduction
