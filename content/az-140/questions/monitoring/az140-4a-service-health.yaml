id: az140-4a-service-health
objective: "4.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Tailspin Toys has Azure Virtual Desktop host pools in the West Europe region. The operations team must receive an email when Microsoft reports a service issue that affects the connectivity of users to Azure Virtual Desktop or the management of the service, and when Microsoft publishes a health advisory for Azure Virtual Desktop.

    What should you configure?
  fr: |
    Tailspin Toys dispose de pools d'hôtes Azure Virtual Desktop dans la région West Europe. L'équipe d'exploitation doit recevoir un e-mail quand Microsoft signale un problème de service qui affecte la connectivité des utilisateurs à Azure Virtual Desktop ou la gestion du service, et quand Microsoft publie un avis d'intégrité pour Azure Virtual Desktop.

    Que devez-vous configurer ?
body:
  options:
    - { id: a, text: { en: "A log search alert rule that counts WVDErrors records whose ServiceError value is true", fr: "Une règle d'alerte de recherche dans les journaux qui compte les enregistrements WVDErrors dont la valeur ServiceError est true" } }
    - { id: b, text: { en: "A Service Health alert for Azure Virtual Desktop in West Europe with an action group", fr: "Une alerte Service Health pour Azure Virtual Desktop dans West Europe avec un groupe d'actions" } }
    - { id: c, text: { en: "An activity log alert on the host pools for the Administrative category with an action group", fr: "Une alerte de journal d'activité sur les pools d'hôtes pour la catégorie Administrative avec un groupe d'actions" } }
    - { id: d, text: { en: "A data collection rule that collects the System event log of every session host", fr: "Une règle de collecte de données qui collecte le journal d'événements System de chaque hôte de session" } }
answer: { optionId: b }
explanation:
  correct:
    en: Azure Service Health reports service issues and health advisories for Azure services, including Azure Virtual Desktop, and you can create alerts on these service notifications for the services and regions you use. The alert sends notifications, such as email, through an action group.
    fr: Azure Service Health signale les problèmes de service et les avis d'intégrité des services Azure, dont Azure Virtual Desktop, et vous pouvez créer des alertes sur ces notifications de service pour les services et régions que vous utilisez. L'alerte envoie des notifications, comme un e-mail, par un groupe d'actions.
  options:
    a: { en: "Errors flagged as service errors appear only when your users hit them, and health advisories never appear in WVDErrors.", fr: "Les erreurs signalées comme erreurs de service n'apparaissent que si vos utilisateurs les rencontrent, et les avis d'intégrité n'apparaissent jamais dans WVDErrors." }
    c: { en: "The Administrative category records operations performed on your resources, not incidents reported by Microsoft.", fr: "La catégorie Administrative enregistre les opérations effectuées sur vos ressources, pas les incidents signalés par Microsoft." }
    d: { en: "The System log of the session hosts describes the guest operating system, not incidents or advisories of the Azure service.", fr: "Le journal System des hôtes de session décrit le système d'exploitation invité, pas les incidents ou avis du service Azure." }
references:
  - title: Set up service alerts for Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/set-up-service-alerts
