status: draft
stem:
  en: You add diagnostic settings to the application groups.
  fr: Vous ajoutez des paramètres de diagnostic aux groupes d'applications.
body:
  solution:
    en: |
      You add a diagnostic setting to each application group of HP-Ops that sends the **Checkpoints**, **Errors** and **Management** categories to LAW-AVD.
    fr: |
      Vous ajoutez à chaque groupe d'applications de HP-Ops un paramètre de diagnostic qui envoie les catégories **Checkpoints**, **Errors** et **Management** à LAW-AVD.
answer: { value: false }
explanation:
  correct:
    en: |
      Diagnostic settings on Azure Virtual Desktop objects only send service logs, such as checkpoints, errors and management activities, to the `WVD*` tables. Performance counters and Windows event logs come from inside the session hosts and must be collected by the Azure Monitor Agent with a data collection rule.
    fr: |
      Les paramètres de diagnostic des objets Azure Virtual Desktop envoient uniquement des journaux de service, comme les points de contrôle, les erreurs et les activités de gestion, vers les tables `WVD*`. Les compteurs de performances et les journaux d'événements Windows proviennent de l'intérieur des hôtes de session et doivent être collectés par l'agent Azure Monitor avec une règle de collecte de données.
references:
  - title: Enable Insights to monitor Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/insights
