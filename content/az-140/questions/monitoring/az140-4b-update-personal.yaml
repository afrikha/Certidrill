id: az140-4b-update-personal
objective: "4.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Litware has an Azure Virtual Desktop personal host pool named **HP-Dev** that contains 40 session hosts. Each developer is assigned one session host and installs their own tools and SDKs on it. The session hosts were deployed from a gallery image six months ago.

    You need to recommend an update strategy for the operating system of the HP-Dev session hosts. The developers must keep the tools that they installed.

    Which strategy should you recommend?
  fr: |
    Litware dispose d'un pool d'hôtes Azure Virtual Desktop personnel nommé **HP-Dev** qui contient 40 hôtes de session. Chaque développeur se voit attribuer un hôte de session et y installe ses propres outils et SDK. Les hôtes de session ont été déployés à partir d'une image de galerie il y a six mois.

    Vous devez recommander une stratégie de mise à jour du système d'exploitation des hôtes de session de HP-Dev. Les développeurs doivent conserver les outils qu'ils ont installés.

    Quelle stratégie devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "Update each session host in place with a patch management tool.", fr: "Mettre à jour chaque hôte de session sur place avec un outil de gestion des correctifs." } }
    - { id: b, text: { en: "Publish a patched image version and run a session host update.", fr: "Publier une version d'image corrigée et exécuter une mise à jour des hôtes de session." } }
    - { id: c, text: { en: "Redeploy the session hosts from a patched image and reassign the users.", fr: "Redéployer les hôtes de session à partir d'une image corrigée et réattribuer les utilisateurs." } }
    - { id: d, text: { en: "Reimage each session host from the gallery image every month.", fr: "Réinitialiser chaque hôte de session à partir de l'image de galerie chaque mois." } }
answer: { optionId: a }
explanation:
  correct:
    en: In a personal host pool, each VM holds its user's state, here the tools the developer installed, so it can't be replaced by a fresh VM. Personal session hosts are therefore patched in place, for example with Configuration Manager or Microsoft Intune.
    fr: Dans un pool d'hôtes personnel, chaque machine virtuelle contient l'état de son utilisateur, ici les outils installés par le développeur ; elle ne peut donc pas être remplacée par une machine virtuelle neuve. Les hôtes de session personnels sont donc corrigés sur place, par exemple avec Configuration Manager ou Microsoft Intune.
  options:
    b: { en: "Session host update requires a pooled host pool created with a session host configuration, and it replaces the VMs, which would remove the developers' tools.", fr: "La mise à jour des hôtes de session exige un pool d'hôtes regroupé créé avec une configuration d'hôte de session, et elle remplace les machines virtuelles, ce qui supprimerait les outils des développeurs." }
    c: { en: "New VMs built from an image don't contain the tools that the developers installed on their current VMs.", fr: "De nouvelles machines virtuelles créées à partir d'une image ne contiennent pas les outils installés par les développeurs sur leurs machines virtuelles actuelles." }
    d: { en: "Reimaging resets the OS disk to the image and removes everything the developers installed; the six-month-old image isn't patched either.", fr: "La réinitialisation ramène le disque du système d'exploitation à l'image et supprime tout ce que les développeurs ont installé ; l'image vieille de six mois n'est pas non plus corrigée." }
references:
  - title: Update session hosts in a host pool with a session host configuration in Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/session-host-update-configure
  - title: Multiregion BCDR for Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/architecture/example-scenario/azure-virtual-desktop/azure-virtual-desktop-multi-region-bcdr
