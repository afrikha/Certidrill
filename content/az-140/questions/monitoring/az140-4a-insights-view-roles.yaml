id: az140-4a-insights-view-roles
objective: "4.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso has an Azure Virtual Desktop host pool named **HP1**, its workspace and its session hosts in a resource group named **RG-AVD**. Azure Virtual Desktop Insights uses a Log Analytics workspace named **LAW1** in a resource group named **RG-Mon**.

    The members of a group named **GRP-HelpDesk** must be able to view the Insights reports of HP1. The solution must follow the principle of least privilege.

    Which roles should you assign to GRP-HelpDesk?
  fr: |
    Contoso dispose d'un pool d'hôtes Azure Virtual Desktop nommé **HP1**, de son espace de travail et de ses hôtes de session dans un groupe de ressources nommé **RG-AVD**. Azure Virtual Desktop Insights utilise un espace de travail Log Analytics nommé **LAW1** situé dans un groupe de ressources nommé **RG-Mon**.

    Les membres d'un groupe nommé **GRP-HelpDesk** doivent pouvoir consulter les rapports Insights de HP1. La solution doit respecter le principe du moindre privilège.

    Quels rôles devez-vous attribuer à GRP-HelpDesk ?
body:
  options:
    - { id: a, text: { en: "Desktop Virtualization Contributor on RG-AVD and Log Analytics Contributor on LAW1", fr: "Desktop Virtualization Contributor sur RG-AVD et Log Analytics Contributor sur LAW1" } }
    - { id: b, text: { en: "Desktop Virtualization Host Pool Reader on HP1 only", fr: "Desktop Virtualization Host Pool Reader sur HP1 uniquement" } }
    - { id: c, text: { en: "Desktop Virtualization Reader on RG-AVD and Log Analytics Reader on LAW1", fr: "Desktop Virtualization Reader sur RG-AVD et Log Analytics Reader sur LAW1" } }
    - { id: d, text: { en: "Log Analytics Reader on LAW1 only", fr: "Log Analytics Reader sur LAW1 uniquement" } }
answer: { optionId: c }
explanation:
  correct:
    en: Microsoft documents the minimum access to view Insights as Desktop Virtualization Reader on the resource group or subscription that contains the host pools, workspaces and session hosts, plus Log Analytics Reader on each Log Analytics workspace used by Insights. Read access lets the help desk view the data without managing the resources.
    fr: Microsoft documente l'accès minimal pour consulter Insights ainsi Desktop Virtualization Reader sur le groupe de ressources ou l'abonnement qui contient les pools d'hôtes, les espaces de travail et les hôtes de session, plus Log Analytics Reader sur chaque espace de travail Log Analytics utilisé par Insights. L'accès en lecture permet au support de consulter les données sans gérer les ressources.
  options:
    a: { en: "Both roles allow changes to the resources, which exceeds what viewing the reports requires.", fr: "Les deux rôles permettent de modifier les ressources, ce qui dépasse ce qu'exige la consultation des rapports." }
    b: { en: "Without read access to LAW1, the reports can't query the logs; the workspace and session hosts aren't covered either.", fr: "Sans accès en lecture à LAW1, les rapports ne peuvent pas interroger les journaux ; l'espace de travail et les hôtes de session ne sont pas couverts non plus." }
    d: { en: "Insights also needs read access to the Azure Virtual Desktop resources to list the host pools, workspaces and session hosts.", fr: "Insights a aussi besoin d'un accès en lecture aux ressources Azure Virtual Desktop pour lister les pools d'hôtes, les espaces de travail et les hôtes de session." }
references:
  - title: Enable Insights to monitor Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/insights
