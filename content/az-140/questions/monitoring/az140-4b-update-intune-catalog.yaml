id: az140-4b-update-intune-catalog
objective: "4.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam has an Azure Virtual Desktop pooled host pool named **HP-Ops**. The session hosts run Windows 11 Enterprise multi-session, are Microsoft Entra joined and are enrolled in Microsoft Intune. Fabrikam doesn't use Group Policy.

    The operations team decides to patch the HP-Ops session hosts in place. Quality updates must be deferred for 7 days after release and must be installed no later than 3 days after they are offered.

    Which Intune policy should you create?
  fr: |
    Fabrikam dispose d'un pool d'hôtes Azure Virtual Desktop regroupé nommé **HP-Ops**. Les hôtes de session exécutent Windows 11 Enterprise multisession, sont joints à Microsoft Entra et sont inscrits dans Microsoft Intune. Fabrikam n'utilise pas la stratégie de groupe.

    L'équipe d'exploitation décide de corriger les hôtes de session de HP-Ops sur place. Les mises à jour qualité doivent être différées de 7 jours après leur publication et installées au plus tard 3 jours après avoir été proposées.

    Quelle stratégie Intune devez-vous créer ?
body:
  options:
    - { id: a, text: { en: "An update rings for Windows 10 and later policy", fr: "Une stratégie Anneaux de mise à jour pour Windows 10 et versions ultérieures" } }
    - { id: b, text: { en: "A settings catalog profile with Windows Update for Business settings", fr: "Un profil de catalogue des paramètres avec les paramètres Windows Update for Business" } }
    - { id: c, text: { en: "An Administrative Templates profile with Windows Update settings", fr: "Un profil Modèles d'administration avec les paramètres Windows Update" } }
    - { id: d, text: { en: "A compliance policy that requires a minimum OS build", fr: "Une stratégie de conformité qui exige une build minimale du système d'exploitation" } }
answer: { optionId: b }
explanation:
  correct:
    en: On Windows Enterprise multi-session, Intune manages quality updates through the settings catalog. Filtering the catalog on Enterprise multi-session and opening the Windows Update for Business category gives settings such as Defer Quality Updates Period (Days) and Quality Update Deadline Period (Days).
    fr: "Sur Windows Enterprise multisession, Intune gère les mises à jour qualité avec le catalogue des paramètres. En filtrant le catalogue sur Enterprise multi-session et en ouvrant la catégorie Windows Update for Business, vous obtenez des paramètres tels que Defer Quality Updates Period (Days) et Quality Update Deadline Period (Days)."
  options:
    a: { en: "Windows update rings policies aren't supported on Windows Enterprise multi-session VMs.", fr: "Les stratégies d'anneaux de mise à jour Windows ne sont pas prises en charge sur les machines virtuelles Windows Enterprise multisession." }
    c: { en: "For multi-session, Intune supports only the Trusted certificate, SCEP, PKCS and VPN (Device Tunnel) templates; other templates aren't supported.", fr: "Pour le multisession, Intune ne prend en charge que les modèles Certificat approuvé, SCEP, PKCS et VPN (Device Tunnel) ; les autres modèles ne le sont pas." }
    d: { en: "A compliance policy only evaluates the device state; it doesn't defer or install any update.", fr: "Une stratégie de conformité évalue seulement l'état de l'appareil ; elle ne diffère ni n'installe aucune mise à jour." }
references:
  - title: Using Azure Virtual Desktop multi-session with Microsoft Intune
    url: https://learn.microsoft.com/en-us/intune/intune-service/fundamentals/azure-virtual-desktop-multi-session
