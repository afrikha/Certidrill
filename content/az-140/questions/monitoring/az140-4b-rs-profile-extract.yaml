id: az140-4b-rs-profile-extract
objective: "4.2.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam stores the FSLogix profile containers of its Azure Virtual Desktop users in an Azure file share named **profiles** in a storage account named **stproffab**. Azure Backup protects the share with a daily Snapshot tier policy. The storage account also contains an empty file share named **restore**.

    A user named **User2** deleted a folder of documents from their profile four days ago. Since then, User2 has changed many settings and other files in the profile, and wants to keep these changes.

    You need to recover the deleted folder for User2. The solution must minimize the amount of data restored.

    What should you do first?
  fr: |
    Fabrikam stocke les conteneurs de profils FSLogix de ses utilisateurs Azure Virtual Desktop dans un partage de fichiers Azure nommé **profiles** d'un compte de stockage nommé **stproffab**. Sauvegarde Azure protège le partage avec une stratégie quotidienne du niveau Snapshot. Le compte de stockage contient aussi un partage de fichiers vide nommé **restore**.

    Un utilisateur nommé **User2** a supprimé un dossier de documents de son profil il y a quatre jours. Depuis, User2 a modifié de nombreux paramètres et d'autres fichiers du profil, et souhaite conserver ces modifications.

    Vous devez récupérer le dossier supprimé pour User2. La solution doit réduire au minimum la quantité de données restaurées.

    Que devez-vous faire en premier ?
body:
  options:
    - { id: a, text: { en: "Run an Item Level Restore of User2's VHDX from a five-day-old recovery point to the original location.", fr: "Exécuter une restauration au niveau de l'élément du VHDX de User2 à partir d'un point de récupération de cinq jours vers l'emplacement d'origine." } }
    - { id: b, text: { en: "Run an Item Level Restore of User2's VHDX from a five-day-old recovery point to the restore share.", fr: "Exécuter une restauration au niveau de l'élément du VHDX de User2 à partir d'un point de récupération de cinq jours vers le partage restore." } }
    - { id: c, text: { en: "Run a Full Share Restore of a five-day-old recovery point to the restore share.", fr: "Exécuter une restauration complète du partage d'un point de récupération de cinq jours vers le partage restore." } }
    - { id: d, text: { en: "Run a Full Share Restore of a five-day-old recovery point to the original location.", fr: "Exécuter une restauration complète du partage d'un point de récupération de cinq jours vers l'emplacement d'origine." } }
answer: { optionId: b }
explanation:
  correct:
    en: Restoring only User2's VHDX to an alternate location keeps the current profile intact. You then mount the restored copy and copy the deleted folder back to User2, so the settings and files changed since the deletion are kept.
    fr: "Restaurer uniquement le VHDX de User2 vers un autre emplacement laisse le profil actuel intact. Vous montez ensuite la copie restaurée et recopiez le dossier supprimé pour User2 : les paramètres et fichiers modifiés depuis la suppression sont conservés."
  options:
    a: { en: "Overwriting the current VHDX would discard every change User2 made in the last four days.", fr: "Remplacer le VHDX actuel effacerait toutes les modifications effectuées par User2 au cours des quatre derniers jours." }
    c: { en: "Restoring the whole share copies every user's profile, far more data than needed.", fr: "Restaurer tout le partage copie le profil de chaque utilisateur, bien plus de données que nécessaire." }
    d: { en: "This rolls back every profile in the share and discards the recent changes of all users.", fr: "Cette opération ramène en arrière tous les profils du partage et efface les modifications récentes de tous les utilisateurs." }
references:
  - title: Restore Azure Files
    url: https://learn.microsoft.com/en-us/azure/backup/restore-afs
