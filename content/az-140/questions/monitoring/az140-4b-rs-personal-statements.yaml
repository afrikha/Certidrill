id: az140-4b-rs-personal-statements
objective: "4.2.5"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    Woodgrove Bank has an Azure Virtual Desktop personal host pool in the East US region. The session hosts use unencrypted managed disks and are protected by Azure Backup in a Recovery Services vault in East US. The vault uses geo-redundant storage, and Cross Region Restore is enabled.

    You are documenting the restore options for the personal desktops.

    Which two statements are true?

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove Bank dispose d'un pool d'hôtes Azure Virtual Desktop personnel dans la région East US. Les hôtes de session utilisent des disques managés non chiffrés et sont protégés par Sauvegarde Azure dans un coffre Recovery Services de East US. Le coffre utilise le stockage géoredondant, et la restauration interrégion est activée.

    Vous documentez les options de restauration des bureaux personnels.

    Quelles sont les deux affirmations vraies ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Replace existing can be used only if the desktop VM still exists.", fr: "Replace existing ne peut être utilisé que si la machine virtuelle du bureau existe toujours." } }
    - { id: b, text: { en: "A desktop can be restored as a new VM in the paired region from a vault-tier recovery point.", fr: "Un bureau peut être restauré en tant que nouvelle machine virtuelle dans la région jumelée à partir d'un point de récupération du niveau coffre." } }
    - { id: c, text: { en: "A desktop can be restored in the paired region from a snapshot-tier recovery point.", fr: "Un bureau peut être restauré dans la région jumelée à partir d'un point de récupération du niveau capture instantanée." } }
    - { id: d, text: { en: "Replace existing can be used in the paired region to replace the disks of a failed-over VM.", fr: "Replace existing peut être utilisé dans la région jumelée pour remplacer les disques d'une machine virtuelle basculée." } }
    - { id: e, text: { en: "Create a new VM can create the restored VM in any region of the same geography as the vault.", fr: "Create a new VM peut créer la machine virtuelle restaurée dans n'importe quelle région de la même zone géographique que le coffre." } }
answer: { optionIds: [ a, b ] }
explanation:
  correct:
    en: Replace existing puts the recovery point's disks back on the current VM, so the VM must still exist. Cross Region Restore restores to the Azure paired region from vault-tier recovery points, with the Create a VM and Restore disks options.
    fr: Replace existing remet les disques du point de récupération sur la machine virtuelle actuelle, qui doit donc toujours exister. La restauration interrégion restaure vers la région jumelée Azure à partir de points de récupération du niveau coffre, avec les options de création de machine virtuelle et de restauration de disques.
  options:
    c: { en: "Snapshots aren't replicated to the secondary region, so Cross Region Restore supports only vault-tier recovery points.", fr: "Les captures instantanées ne sont pas répliquées vers la région secondaire : la restauration interrégion ne prend en charge que les points de récupération du niveau coffre." }
    d: { en: "Cross Region Restore supports Create a VM and Restore disks, not replacing existing disks.", fr: "La restauration interrégion prend en charge la création d'une machine virtuelle et la restauration de disques, pas le remplacement de disques existants." }
    e: { en: "Outside Cross Region Restore, Create a new VM creates the VM in the same region as the source VM.", fr: "En dehors de la restauration interrégion, Create a new VM crée la machine virtuelle dans la même région que la machine virtuelle source." }
references:
  - title: Restore VMs by using the Azure portal using Azure Backup
    url: https://learn.microsoft.com/en-us/azure/backup/backup-azure-arm-restore-vms
