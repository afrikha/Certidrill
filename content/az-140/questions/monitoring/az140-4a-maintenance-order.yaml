id: az140-4a-maintenance-order
objective: "4.1.6"
type: ordering
difficulty: 1
status: draft
stem:
  en: |
    You have a pooled host pool named **HP1** that has no scaling plan. A session host named **SH4** has six active user sessions. You must install an update on SH4 that requires a restart.

    The solution must minimize the disruption for users: they must be warned before they are signed out, and no new session must be placed on SH4 until the update is installed. SH4 must accept sessions again after the update.

    Which five actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Vous disposez d'un pool d'hôtes regroupé nommé **HP1** auquel aucun plan de mise à l'échelle n'est attribué. Un hôte de session nommé **SH4** compte six sessions utilisateur actives. Vous devez installer sur SH4 une mise à jour qui exige un redémarrage.

    La solution doit réduire au minimum la gêne pour les utilisateurs : ils doivent être avertis avant la fermeture de leur session, et aucune nouvelle session ne doit être placée sur SH4 avant l'installation de la mise à jour. SH4 doit de nouveau accepter des sessions après la mise à jour.

    Quelles sont les cinq actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 5
  actions:
    - { id: drainon, text: { en: "Turn on drain mode on SH4.", fr: "Activer le mode drainage sur SH4." } }
    - { id: message, text: { en: "Send a message to the users of SH4 asking them to save their work.", fr: "Envoyer un message aux utilisateurs de SH4 pour leur demander d'enregistrer leur travail." } }
    - { id: logoff, text: { en: "Sign out the users who are still on SH4 after the notice period.", fr: "Fermer la session des utilisateurs encore présents sur SH4 après le délai de prévenance." } }
    - { id: update, text: { en: "Install the update and restart SH4.", fr: "Installer la mise à jour et redémarrer SH4." } }
    - { id: drainoff, text: { en: "Turn off drain mode on SH4.", fr: "Désactiver le mode drainage sur SH4." } }
    - { id: disconnect, text: { en: "Disconnect all the sessions on SH4.", fr: "Déconnecter toutes les sessions de SH4." } }
    - { id: remove, text: { en: "Remove SH4 from HP1.", fr: "Retirer SH4 de HP1." } }
answer:
  sequence: [ drainon, message, logoff, update, drainoff ]
explanation:
  correct:
    en: Drain mode first stops new sessions from being placed on SH4 while existing sessions continue. You then warn the users, sign out those who remain after the notice period, install the update and restart the host, and finally turn off drain mode so that SH4 accepts new sessions again.
    fr: Le mode drainage empêche d'abord le placement de nouvelles sessions sur SH4 tandis que les sessions existantes continuent. Vous avertissez ensuite les utilisateurs, fermez la session de ceux qui restent après le délai de prévenance, installez la mise à jour et redémarrez l'hôte, puis désactivez le mode drainage pour que SH4 accepte de nouveau des sessions.
  options:
    disconnect: { en: "A disconnected session stays open on the host, so it doesn't free SH4 for the restart, and users lose their connection without warning.", fr: "Une session déconnectée reste ouverte sur l'hôte : elle ne libère pas SH4 pour le redémarrage, et les utilisateurs perdent leur connexion sans avertissement." }
    remove: { en: "Removing SH4 from the host pool isn't needed for maintenance and would require registering it again.", fr: "Retirer SH4 du pool d'hôtes n'est pas nécessaire pour la maintenance et obligerait à l'inscrire de nouveau." }
references:
  - title: Drain session hosts for maintenance in Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/drain-mode
