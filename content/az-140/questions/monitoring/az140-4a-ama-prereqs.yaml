id: az140-4a-ama-prereqs
objective: "4.1.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    You have an Azure Virtual Desktop host pool named **HP1** and a Log Analytics workspace named **LAW1**.

    You create a data collection rule named **DCR1** that collects the recommended performance counters and Windows event logs of Azure Virtual Desktop Insights and sends them to LAW1. You associate DCR1 with every session host of HP1. No data from the session hosts arrives in LAW1.

    Which two components must be present on each session host? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un pool d'hôtes Azure Virtual Desktop nommé **HP1** et d'un espace de travail Log Analytics nommé **LAW1**.

    Vous créez une règle de collecte de données nommée **DCR1** qui collecte les compteurs de performances et les journaux d'événements Windows recommandés par Azure Virtual Desktop Insights et les envoie vers LAW1. Vous associez DCR1 à chaque hôte de session de HP1. Aucune donnée des hôtes de session n'arrive dans LAW1.

    Quels sont les deux composants qui doivent être présents sur chaque hôte de session ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "The Azure Monitor Agent VM extension", fr: "L'extension de machine virtuelle de l'agent Azure Monitor" } }
    - { id: b, text: { en: "The Log Analytics agent connected by using the workspace ID and key", fr: "L'agent Log Analytics connecté avec l'ID et la clé de l'espace de travail" } }
    - { id: c, text: { en: "A managed identity, such as a system-assigned managed identity", fr: "Une identité managée, par exemple une identité managée affectée par le système" } }
    - { id: d, text: { en: "The Dependency agent VM extension", fr: "L'extension de machine virtuelle de l'agent de dépendances" } }
    - { id: e, text: { en: "A diagnostic setting on the VM resource that targets LAW1", fr: "Un paramètre de diagnostic sur la ressource de machine virtuelle qui cible LAW1" } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: A data collection rule is applied by the Azure Monitor Agent, which runs as a VM extension and authenticates to Azure Monitor with a managed identity of the VM. The Insights configuration workbook adds both with its Add extension and Add system managed identity buttons.
    fr: Une règle de collecte de données est appliquée par l'agent Azure Monitor, qui s'exécute comme extension de machine virtuelle et s'authentifie auprès d'Azure Monitor avec une identité managée de la machine virtuelle. Le workbook de configuration d'Insights ajoute les deux avec ses boutons Add extension et Add system managed identity.
  options:
    b: { en: "The Log Analytics agent is retired and doesn't use data collection rules.", fr: "L'agent Log Analytics est mis hors service et n'utilise pas les règles de collecte de données." }
    d: { en: "The Dependency agent collects process and connection data for VM insights maps; Azure Virtual Desktop Insights doesn't need it.", fr: "L'agent de dépendances collecte les données de processus et de connexions pour les cartes de VM Insights ; Azure Virtual Desktop Insights n'en a pas besoin." }
    e: { en: "A diagnostic setting on a VM sends platform metrics; guest counters and event logs need the agent and the data collection rule.", fr: "Un paramètre de diagnostic sur une machine virtuelle envoie les métriques de plateforme ; les compteurs invités et les journaux d'événements exigent l'agent et la règle de collecte de données." }
references:
  - title: Enable Insights to monitor Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/insights
