id: az140-4a-personal-plan
objective: "4.1.5"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    Proseware has a personal host pool named **HP-Dev** that contains 40 session hosts; 30 of them are assigned to developers. Hibernation isn't enabled on the session hosts. You are configuring the schedule of a personal scaling plan for HP-Dev.

    The schedule must meet the following requirements:

    - At the start of ramp-up, only the desktops that are assigned to a developer must be started.
    - During off-peak hours, a developer's deallocated desktop must start when the developer connects.
    - During off-peak hours, a desktop must stop incurring compute charges 30 minutes after its developer signs out.

    How should you configure the schedule? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware dispose d'un pool d'hôtes personnel nommé **HP-Dev** qui contient 40 hôtes de session ; 30 d'entre eux sont attribués à des développeurs. La mise en veille prolongée (hibernation) n'est pas activée sur les hôtes de session. Vous configurez la planification d'un plan de mise à l'échelle personnel pour HP-Dev.

    La planification doit répondre aux exigences suivantes :

    - Au début de la montée en charge, seuls les bureaux attribués à un développeur doivent être démarrés.
    - Pendant les heures creuses, le bureau libéré d'un développeur doit démarrer quand le développeur se connecte.
    - Pendant les heures creuses, un bureau ne doit plus générer de frais de calcul 30 minutes après la fermeture de session de son développeur.

    Comment devez-vous configurer la planification ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Ramp-up, VMs to start: [[start]]

      Off-peak, Start VM on Connect: [[svmoc]]

      Off-peak, sign-out settings: when logged off for 30 minutes, perform [[action]]
    fr: |
      Montée en charge, VMs to start : [[start]]

      Heures creuses, Start VM on Connect : [[svmoc]]

      Heures creuses, sign-out settings : après 30 minutes de fermeture de session, effectuer [[action]]
  slots:
    - id: start
      options:
        - { id: assigned, text: Assigned VMs only }
        - { id: all, text: Assigned and unassigned VMs }
        - { id: none, text: "Don't turn VMs on at start time" }
    - id: svmoc
      options:
        - { id: "yes", text: { en: "Yes", fr: "Oui (Yes)" } }
        - { id: "no", text: { en: "No", fr: "Non (No)" } }
    - id: action
      options:
        - { id: deallocate, text: Deallocate }
        - { id: hibernate, text: Hibernate }
        - { id: nothing, text: Do nothing }
answer:
  values: { start: assigned, svmoc: "yes", action: deallocate }
explanation:
  correct:
    en: "Assigned VMs only starts at ramp-up the personal desktops that are assigned to a user at that time. Start VM on Connect, set for the off-peak phase, starts a deallocated desktop when its user connects. Deallocate stops the compute charges; Hibernate would do nothing here, because autoscale takes no action when hibernation is selected but not enabled on the session hosts."
    fr: "Assigned VMs only démarre à la montée en charge les bureaux personnels attribués à un utilisateur à ce moment-là. Start VM on Connect, défini pour la phase d'heures creuses, démarre un bureau libéré quand son utilisateur se connecte. Deallocate arrête les frais de calcul ; Hibernate n'aurait aucun effet ici, car la mise à l'échelle automatique n'agit pas quand la mise en veille prolongée est choisie sans être activée sur les hôtes de session."
  options:
    all: { en: "This also starts the 10 unassigned desktops, which the requirement excludes.", fr: "Ce choix démarre aussi les 10 bureaux non attribués, ce que l'exigence exclut." }
    none: { en: "No desktop would be started at the beginning of ramp-up.", fr: "Aucun bureau ne serait démarré au début de la montée en charge." }
    "no": { en: "Without Start VM on Connect, a deallocated desktop stays off when its developer connects during off-peak hours.", fr: "Sans Start VM on Connect, un bureau libéré reste éteint quand son développeur se connecte pendant les heures creuses." }
    hibernate: { en: "Hibernation isn't enabled on the hosts, so autoscale would neither hibernate nor deallocate them.", fr: "La mise en veille prolongée n'est pas activée sur les hôtes : la mise à l'échelle automatique ne les mettrait ni en veille prolongée ni ne les libérerait." }
    nothing: { en: "The desktop would keep running and incurring compute charges.", fr: "Le bureau resterait allumé et continuerait à générer des frais de calcul." }
references:
  - title: Create and assign an autoscale scaling plan for Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/autoscale-scaling-plan
  - title: Azure Virtual Desktop autoscale FAQ
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/autoscale-faq
