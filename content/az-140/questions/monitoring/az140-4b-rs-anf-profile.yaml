id: az140-4b-rs-anf-profile
objective: "4.2.5"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Litware stores the FSLogix profile containers of 600 Azure Virtual Desktop users on an Azure NetApp Files SMB volume named **vol-profiles**. A snapshot policy takes hourly snapshots, and snapshot path visibility is enabled on the volume.

    The VHDX file of a user named **User3** is corrupted. User3 is signed out. You need to restore User3's VHDX from the snapshot taken two hours ago. The profiles of the other users must not change.

    Which two actions can you perform? Each correct answer presents a complete solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware stocke les conteneurs de profils FSLogix de 600 utilisateurs Azure Virtual Desktop sur un volume SMB Azure NetApp Files nommé **vol-profiles**. Une stratégie de capture instantanée prend des captures instantanées toutes les heures, et la visibilité du chemin des captures instantanées est activée sur le volume.

    Le fichier VHDX d'un utilisateur nommé **User3** est corrompu. User3 est déconnecté. Vous devez restaurer le VHDX de User3 à partir de la capture instantanée prise il y a deux heures. Les profils des autres utilisateurs ne doivent pas changer.

    Quelles sont les deux actions possibles ? Chaque bonne réponse constitue une solution complète.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Run a single-file snapshot restore of User3's VHDX to its original path.", fr: "Exécuter une restauration de fichier unique à partir de la capture instantanée pour le VHDX de User3 vers son chemin d'origine." } }
    - { id: b, text: { en: "Revert vol-profiles to the snapshot taken two hours ago.", fr: "Rétablir vol-profiles à la capture instantanée prise il y a deux heures." } }
    - { id: c, text: { en: "Copy User3's VHDX from the snapshot folder of the volume over the current file.", fr: "Copier le VHDX de User3 depuis le dossier de captures instantanées du volume par-dessus le fichier actuel." } }
    - { id: d, text: { en: "Run an Azure Backup Item Level Restore of User3's VHDX to the original location.", fr: "Exécuter une restauration au niveau de l'élément Sauvegarde Azure du VHDX de User3 vers l'emplacement d'origine." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: Single-file snapshot restore puts the file from the snapshot back in place, almost instantly and without copying data through a client. Because snapshot path visibility is enabled, you can also do a client-side restore by copying the VHDX out of the snapshot folder. Both actions touch only User3's file.
    fr: La restauration de fichier unique à partir d'une capture instantanée remet le fichier de la capture en place, presque instantanément et sans copie de données par un client. Comme la visibilité du chemin des captures instantanées est activée, vous pouvez aussi effectuer une restauration côté client en copiant le VHDX depuis le dossier de captures instantanées. Les deux actions ne touchent que le fichier de User3.
  options:
    b: { en: "Reverting the volume rolls back all 600 profiles and irreversibly loses the data and snapshots created after the selected snapshot.", fr: "Rétablir le volume ramène en arrière les 600 profils et perd de façon irréversible les données et captures instantanées créées après la capture sélectionnée." }
    d: { en: "Azure Backup item-level restore applies to Azure file shares; Azure NetApp Files volumes use their own snapshots and backups.", fr: "La restauration au niveau de l'élément de Sauvegarde Azure s'applique aux partages de fichiers Azure ; les volumes Azure NetApp Files utilisent leurs propres captures instantanées et sauvegardes." }
references:
  - title: Understand Azure NetApp Files snapshot-based data protection
    url: https://learn.microsoft.com/en-us/azure/azure-netapp-files/snapshots-introduction
