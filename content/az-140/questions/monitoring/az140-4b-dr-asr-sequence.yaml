id: az140-4b-dr-asr-sequence
objective: "4.2.2"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    Proseware has an Azure Virtual Desktop personal host pool named **HP-Design** in the West Europe region. Azure Site Recovery replicates the session host VMs to North Europe, and replication is healthy.

    West Europe has an outage. You need the designers to work on their desktops in North Europe during the outage. When West Europe is available again, the desktops must run in West Europe again, with the changes made during the outage.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Proseware dispose d'un pool d'hôtes Azure Virtual Desktop personnel nommé **HP-Design** dans la région West Europe. Azure Site Recovery réplique les machines virtuelles hôtes de session vers North Europe, et la réplication est saine.

    West Europe subit une panne. Les designers doivent pouvoir travailler sur leurs bureaux dans North Europe pendant la panne. Quand West Europe sera de nouveau disponible, les bureaux devront de nouveau s'exécuter dans West Europe, avec les modifications effectuées pendant la panne.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: fo, text: { en: "Fail over the replicated VMs to North Europe.", fr: "Basculer les machines virtuelles répliquées vers North Europe." } }
    - { id: commit, text: { en: "Commit the failover of the VMs.", fr: "Valider le basculement des machines virtuelles." } }
    - { id: rep, text: { en: "Reprotect the VMs so that they replicate from North Europe to West Europe.", fr: "Reprotéger les machines virtuelles pour qu'elles soient répliquées de North Europe vers West Europe." } }
    - { id: fb, text: { en: "Fail back the VMs to West Europe.", fr: "Effectuer la restauration automatique des machines virtuelles vers West Europe." } }
    - { id: test, text: { en: "Run a test failover of the VMs to North Europe.", fr: "Exécuter un test de basculement des machines virtuelles vers North Europe." } }
    - { id: dis, text: { en: "Disable replication of the VMs.", fr: "Désactiver la réplication des machines virtuelles." } }
answer:
  sequence: [ fo, commit, rep, fb ]
explanation:
  correct:
    en: |
      You fail over the VMs to North Europe, then commit the failover once the VMs are verified; committing is required before reprotection. Reprotect reverses the replication direction so that North Europe replicates to West Europe, which carries the changes made during the outage. Once replication is complete, you fail back to West Europe.
    fr: |
      Vous basculez les machines virtuelles vers North Europe, puis vous validez le basculement après les avoir vérifiées ; la validation est nécessaire avant la reprotection. La reprotection inverse le sens de réplication pour que North Europe soit répliqué vers West Europe, ce qui transporte les modifications effectuées pendant la panne. Une fois la réplication terminée, vous effectuez la restauration automatique vers West Europe.
  options:
    test: { en: "A test failover doesn't let users work during an outage, and on session hosts the duplicate VM registers with the Azure Virtual Desktop control plane and conflicts with the original.", fr: "Un test de basculement ne permet pas aux utilisateurs de travailler pendant une panne et, pour des hôtes de session, la machine virtuelle dupliquée s'inscrit auprès du plan de contrôle Azure Virtual Desktop et entre en conflit avec l'originale." }
    dis: { en: "Without replication, the changes made in North Europe can't be replicated back to West Europe.", fr: "Sans réplication, les modifications effectuées dans North Europe ne peuvent pas être répliquées vers West Europe." }
references:
  - title: "Tutorial: Fail over Azure VMs to a secondary region"
    url: https://learn.microsoft.com/en-us/azure/site-recovery/azure-to-azure-tutorial-failover-failback
  - title: Multiregion BCDR for Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/architecture/example-scenario/azure-virtual-desktop/azure-virtual-desktop-multi-region-bcdr
