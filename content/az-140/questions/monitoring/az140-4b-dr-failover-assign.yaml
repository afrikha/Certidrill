id: az140-4b-dr-failover-assign
objective: "4.2.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam has two Azure Virtual Desktop pooled host pools in an active-passive design:

    - **HP-EUS** in East US, with the desktop application group **DAG-EUS**, assigned to the group **GRP-Agents**
    - **HP-WUS** in West US, with the desktop application group **DAG-WUS**, not assigned to any group

    Both application groups are registered in a workspace named **WS-Agents**. FSLogix Cloud Cache is configured on both host pools, with the local storage account listed first. A scaling plan assigned to HP-WUS starts session hosts as users connect.

    East US has an outage. You need the members of GRP-Agents to connect to HP-WUS. Users must never be able to connect to both host pools at the same time.

    Which two actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam dispose de deux pools d'hôtes Azure Virtual Desktop regroupés dans une conception actif-passif :

    - **HP-EUS** dans East US, avec le groupe d'applications de bureau **DAG-EUS**, attribué au groupe **GRP-Agents** ;
    - **HP-WUS** dans West US, avec le groupe d'applications de bureau **DAG-WUS**, attribué à aucun groupe.

    Les deux groupes d'applications sont inscrits dans un espace de travail nommé **WS-Agents**. FSLogix Cloud Cache est configuré sur les deux pools d'hôtes, avec le compte de stockage local en premier. Un plan de mise à l'échelle attribué à HP-WUS démarre des hôtes de session à mesure que les utilisateurs se connectent.

    East US subit une panne. Les membres de GRP-Agents doivent se connecter à HP-WUS. Les utilisateurs ne doivent jamais pouvoir se connecter aux deux pools d'hôtes en même temps.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Remove the GRP-Agents assignment from DAG-EUS.", fr: "Supprimer l'attribution de GRP-Agents de DAG-EUS." } }
    - { id: b, text: { en: "Assign GRP-Agents to DAG-WUS.", fr: "Attribuer GRP-Agents à DAG-WUS." } }
    - { id: c, text: { en: "Register DAG-WUS in a new workspace in West US.", fr: "Inscrire DAG-WUS dans un nouvel espace de travail dans West US." } }
    - { id: d, text: { en: "Run an Azure Site Recovery failover of the HP-EUS session hosts.", fr: "Exécuter un basculement Azure Site Recovery des hôtes de session de HP-EUS." } }
    - { id: e, text: { en: "Reverse the order of CCDLocations on the HP-WUS session hosts.", fr: "Inverser l'ordre de CCDLocations sur les hôtes de session de HP-WUS." } }
answer: { optionIds: [ a, b ] }
explanation:
  correct:
    en: In an active-passive design, failover happens at the application group level. You remove the user group's assignments from the primary application groups, which disconnects connected users, then assign the group to the secondary application groups; the scaling plan provides the capacity. Because the users are never assigned to both, they can't open sessions in both host pools.
    fr: "Dans une conception actif-passif, le basculement se fait au niveau des groupes d'applications. Vous supprimez les attributions du groupe d'utilisateurs sur les groupes d'applications principaux, ce qui déconnecte les utilisateurs connectés, puis vous attribuez le groupe aux groupes d'applications secondaires ; le plan de mise à l'échelle fournit la capacité. Comme les utilisateurs ne sont jamais attribués aux deux, ils ne peuvent pas ouvrir de sessions dans les deux pools d'hôtes."
  options:
    c: { en: "DAG-WUS is already registered in WS-Agents; a single workspace keeps the failover transparent for users.", fr: "DAG-WUS est déjà inscrit dans WS-Agents ; un espace de travail unique rend le basculement transparent pour les utilisateurs." }
    d: { en: "Pooled host pools fail over to a secondary host pool; Site Recovery is for personal desktops, and the HP-EUS hosts aren't replicated.", fr: "Les pools d'hôtes regroupés basculent vers un pool d'hôtes secondaire ; Site Recovery est destiné aux bureaux personnels, et les hôtes de HP-EUS ne sont pas répliqués." }
    e: { en: "Each region already lists its local storage account first, which is the recommended order; Cloud Cache fails over to the next location by itself.", fr: "Chaque région place déjà son compte de stockage local en premier, ce qui est l'ordre recommandé ; Cloud Cache passe de lui-même à l'emplacement suivant." }
references:
  - title: Multiregion BCDR for Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/architecture/example-scenario/azure-virtual-desktop/azure-virtual-desktop-multi-region-bcdr
