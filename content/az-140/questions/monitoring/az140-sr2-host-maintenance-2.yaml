id: az140-sr2-host-maintenance-2
objective: "4.1.6"
type: series_yesno
series: az140-sr2-host-maintenance
seriesOrder: 2
difficulty: 2
status: draft
stem:
  en: |
    You add the exclusion tag of SP1 to SH4.
  fr: |
    Vous ajoutez l'étiquette d'exclusion de SP1 à SH4.
body:
  solution:
    en: |
      You add an Azure tag named `excludeFromScaling` to the virtual machine of SH4. You don't change the drain mode setting of SH4.
    fr: |
      Vous ajoutez une étiquette Azure nommée `excludeFromScaling` à la machine virtuelle de SH4. Vous ne modifiez pas le paramètre de mode drainage de SH4.
answer: { value: false }
explanation:
  correct:
    en: With the exclusion tag, autoscale doesn't start, stop or change the drain mode of SH4, so SH4 stays running. However, the tag doesn't block connections. SH4 still accepts new sessions, and the broker can place new users on it, so the update can't be installed when the current users sign out.
    fr: "Avec l'étiquette d'exclusion, la mise à l'échelle automatique ne démarre pas, n'arrête pas SH4 et ne modifie pas son mode drainage : SH4 reste en cours d'exécution. En revanche, l'étiquette ne bloque pas les connexions. SH4 accepte toujours de nouvelles sessions et le service peut y placer de nouveaux utilisateurs : la mise à jour ne peut pas être installée quand les utilisateurs actuels ferment leur session."
references:
  - title: Create and assign an autoscale scaling plan for Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/autoscale-scaling-plan
