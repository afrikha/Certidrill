id: az140-cs2a-autoscale
objective: "4.1.5"
type: yesno_statements
caseStudy: az140-cs2a-munsons
difficulty: 2
status: draft
stem:
  en: |
    You plan to create a power management autoscale scaling plan named **SP-Office** and assign it to HP-Office to meet the shift scaling requirement.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous prévoyez de créer un plan de mise à l'échelle automatique avec gestion de l'alimentation nommé **SP-Office** et de l'attribuer à HP-Office pour respecter l'exigence de mise à l'échelle par équipe.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: SP-Office must be created in the same Azure region as the HP-Office host pool object.
        fr: SP-Office doit être créé dans la même région Azure que l'objet pool d'hôtes HP-Office.
    - id: s2
      text:
        en: |
          For autoscale to work properly, you can assign the required role to the Azure Virtual Desktop service principal at the scope of the resource group that contains HP-Office.
        fr: |
          Pour que la mise à l'échelle automatique fonctionne correctement, vous pouvez attribuer le rôle requis au principal de service Azure Virtual Desktop à l'étendue du groupe de ressources qui contient HP-Office.
    - id: s3
      text:
        en: |
          If you disable Force logoff users for the ramp-down phase and select the stop condition VMs have no active sessions, autoscale can shut down a session host that has only disconnected sessions.
        fr: |
          Si vous désactivez Force logoff users pour la phase de ralentissement et sélectionnez la condition d'arrêt VMs have no active sessions, la mise à l'échelle automatique peut arrêter un hôte de session qui n'a que des sessions déconnectées.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |
      A scaling plan can only be assigned to host pools in the same region as the plan, although the session hosts themselves can be anywhere. Microsoft requires the Desktop Virtualization Power On Off Contributor assignment at the subscription scope; a resource group, host pool or VM scope prevents autoscale from working properly. Without forced sign-out, the stop condition VMs have no active sessions lets autoscale stop hosts that keep only disconnected sessions, as long as the capacity threshold is respected.
    fr: |
      Un plan de mise à l'échelle ne peut être attribué qu'à des pools d'hôtes de la même région que lui, même si les hôtes de session peuvent se trouver ailleurs. Microsoft exige l'attribution de Desktop Virtualization Power On Off Contributor à l'étendue de l'abonnement ; une étendue de groupe de ressources, de pool d'hôtes ou de machine virtuelle empêche la mise à l'échelle automatique de fonctionner correctement. Sans déconnexion forcée, la condition d'arrêt VMs have no active sessions permet d'arrêter des hôtes qui n'ont plus que des sessions déconnectées, tant que le seuil de capacité est respecté.
references:
  - title: Create and assign an autoscale scaling plan for Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/autoscale-scaling-plan
