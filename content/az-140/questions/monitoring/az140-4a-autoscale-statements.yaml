id: az140-4a-autoscale-statements
objective: "4.1.5"
type: yesno_statements
difficulty: 3
status: draft
stem:
  en: |
    You have a pooled host pool named **HP1** that contains 10 session hosts named **SH1** to **SH10**. A power management scaling plan named **SP1** is assigned to HP1. SP1 has the following configuration:

    - Exclusion tag: `excludeFromScaling`, set on SH9 and SH10
    - Ramp-down: 17:00 to 18:00, **Force logoff of users** set to **Yes**, wait time 30 minutes
    - Off-peak: from 18:00, minimum percentage of hosts 20 percent

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un pool d'hôtes regroupé nommé **HP1** qui contient 10 hôtes de session nommés **SH1** à **SH10**. Un plan de mise à l'échelle de type gestion de l'alimentation nommé **SP1** est attribué à HP1. SP1 présente la configuration suivante :

    - Étiquette d'exclusion : `excludeFromScaling`, définie sur SH9 et SH10
    - Baisse de charge (ramp-down) : de 17:00 à 18:00, **Force logoff of users** défini sur **Yes**, délai d'attente de 30 minutes
    - Heures creuses (off-peak) : à partir de 18:00, pourcentage minimal d'hôtes de 20 %

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: SH9 and SH10 count toward the minimum percentage of hosts of the off-peak phase.
        fr: SH9 et SH10 comptent dans le pourcentage minimal d'hôtes de la phase d'heures creuses.
    - id: s2
      text:
        en: Users who are still signed in to a session host after 18:00 are forced to sign out during the off-peak phase.
        fr: Les utilisateurs encore connectés à un hôte de session après 18:00 sont déconnectés de force pendant la phase d'heures creuses.
    - id: s3
      text:
        en: You can also assign SP1 to a personal host pool named HP2 that is in the same region as HP1.
        fr: Vous pouvez aussi attribuer SP1 à un pool d'hôtes personnel nommé HP2 situé dans la même région que HP1.
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: Hosts that carry the exclusion tag aren't started, stopped or drained by autoscale, but they still count toward the minimum percentage of hosts. Forced sign-out happens only during ramp-down; sessions that remain when the phase changes to off-peak aren't forced out, and autoscale waits for the users to sign out. A scaling plan applies only to host pools of its own type (pooled or personal), and the type can't be changed after creation.
    fr: Les hôtes qui portent l'étiquette d'exclusion ne sont ni démarrés, ni arrêtés, ni drainés par la mise à l'échelle automatique, mais ils comptent toujours dans le pourcentage minimal d'hôtes. La déconnexion forcée n'a lieu que pendant la baisse de charge ; les sessions qui subsistent au passage en heures creuses ne sont pas fermées de force, et la mise à l'échelle automatique attend que les utilisateurs se déconnectent. Un plan de mise à l'échelle ne s'applique qu'aux pools d'hôtes de son type (regroupé ou personnel), et ce type ne peut pas être modifié après la création.
references:
  - title: Create and assign an autoscale scaling plan for Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/autoscale-scaling-plan
  - title: Azure Virtual Desktop autoscale FAQ
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/autoscale-faq
