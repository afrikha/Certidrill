id: az140-4a-remoteapp-usage
objective: "4.1.6"
type: single
difficulty: 3
status: draft
stem:
  en: |
    You have a pooled host pool named **HP1** that has a desktop application group named **DAG1** and a RemoteApp application group named **RAG1**. The diagnostic settings of HP1 and of the two application groups send all the log categories to a Log Analytics workspace named **LAW1**.

    Users often open several RemoteApp applications in the same connection. You need a report that lists every RemoteApp application each user opened, including the applications opened after the first one in a connection.

    Which table should you query?
  fr: |
    Vous disposez d'un pool d'hôtes regroupé nommé **HP1** qui possède un groupe d'applications de bureau nommé **DAG1** et un groupe d'applications RemoteApp nommé **RAG1**. Les paramètres de diagnostic de HP1 et des deux groupes d'applications envoient toutes les catégories de journaux vers un espace de travail Log Analytics nommé **LAW1**.

    Les utilisateurs ouvrent souvent plusieurs applications RemoteApp dans la même connexion. Vous avez besoin d'un rapport qui liste chaque application RemoteApp ouverte par chaque utilisateur, y compris les applications ouvertes après la première dans une connexion.

    Quelle table devez-vous interroger ?
body:
  options:
    - { id: a, text: WVDFeeds }
    - { id: b, text: WVDConnections }
    - { id: c, text: WVDAgentHealthStatus }
    - { id: d, text: WVDCheckpoints }
answer: { optionId: d }
explanation:
  correct:
    en: In WVDConnections, the ResourceAlias column shows only the first resource opened in a connection. The published apps opened later in the same connection are tracked as checkpoints in WVDCheckpoints, which is where you find every RemoteApp launch. App usage inside a full desktop session isn't tracked there.
    fr: Dans WVDConnections, la colonne ResourceAlias n'indique que la première ressource ouverte dans une connexion. Les applications publiées ouvertes ensuite dans la même connexion sont suivies comme points de contrôle dans WVDCheckpoints, où se trouve donc chaque lancement de RemoteApp. L'utilisation d'applications dans une session de bureau complet n'y est pas suivie.
  options:
    a: { en: "WVDFeeds records workspace subscriptions (downloads of the resource list), not application launches.", fr: "WVDFeeds enregistre les abonnements aux espaces de travail (téléchargements de la liste des ressources), pas les lancements d'applications." }
    b: { en: "WVDConnections shows only the first app opened in a connection, so later RemoteApp launches would be missing.", fr: "WVDConnections n'indique que la première application ouverte dans une connexion : les lancements RemoteApp suivants manqueraient." }
    c: { en: "WVDAgentHealthStatus records the health of the Azure Virtual Desktop agent on the session hosts.", fr: "WVDAgentHealthStatus enregistre l'intégrité de l'agent Azure Virtual Desktop sur les hôtes de session." }
references:
  - title: Azure Virtual Desktop diagnostics log analytics
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/diagnostics-log-analytics
