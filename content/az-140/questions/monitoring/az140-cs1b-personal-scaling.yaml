id: az140-cs1b-personal-scaling
objective: "4.1.5"
type: single
caseStudy: az140-cs1b-lucerne-publishing
difficulty: 1
status: draft
stem:
  en: |
    You need to meet the cost requirement for HP-Design. The solution must minimize administrative effort.

    What should you do?
  fr: |
    Vous devez satisfaire l'exigence de coûts pour HP-Design. La solution doit réduire au minimum l'effort d'administration.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Enable Start VM on Connect on HP-Design, and set a Windows time limit of 60 minutes for disconnected sessions.", fr: "Activer Start VM on Connect sur HP-Design et définir dans Windows une limite de 60 minutes pour les sessions déconnectées." } }
    - { id: b, text: { en: "Create a pooled scaling plan that uses depth-first load balancing and a minimum percentage of hosts of 0, and assign it to HP-Design.", fr: "Créer un plan de mise à l'échelle regroupé qui utilise l'équilibrage en profondeur d'abord et un pourcentage minimal d'hôtes de 0, et l'attribuer à HP-Design." } }
    - { id: c, text: { en: "Create a personal scaling plan that enables Start VM on Connect and deallocates desktops after 60 minutes of disconnection.", fr: "Créer un plan de mise à l'échelle personnel qui active Start VM on Connect et libère les bureaux après 60 minutes de déconnexion." } }
    - { id: d, text: { en: "Create a personal scaling plan that hibernates desktops after 60 minutes of disconnection, and enable hibernation on the hosts.", fr: "Créer un plan de mise à l'échelle personnel qui met les bureaux en veille prolongée après 60 minutes de déconnexion, et activer la veille prolongée sur les hôtes." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      A personal scaling plan lets you enable Start VM on Connect in each phase and choose what happens after a desktop has been disconnected for a set time (0 to 360 minutes): deallocate, hibernate or do nothing. Deallocating after 60 minutes and starting the VM when its user connects meets both parts of the requirement without scripts.
    fr: |
      Un plan de mise à l'échelle personnel permet d'activer Start VM on Connect dans chaque phase et de choisir l'action exécutée quand un bureau est déconnecté depuis une durée donnée (0 à 360 minutes) : libérer, mettre en veille prolongée ou ne rien faire. Libérer le bureau après 60 minutes et démarrer la machine virtuelle quand son utilisateur se connecte satisfait les deux parties de l'exigence sans script.
  options:
    a: { en: "Start VM on Connect only powers on VMs, and a Windows session time limit signs the user out without deallocating the VM.", fr: "Start VM on Connect ne fait que démarrer les machines virtuelles, et une limite de session Windows déconnecte l'utilisateur sans libérer la machine virtuelle." }
    b: { en: "A scaling plan can only be assigned to host pools of the same type as the plan; HP-Design is a personal host pool.", fr: "Un plan de mise à l'échelle ne peut être attribué qu'à des pools d'hôtes du même type que le plan ; HP-Design est un pool d'hôtes personnel." }
    d: { en: "The requirement asks for deallocation; hibernation is a different action that keeps the memory state.", fr: "L'exigence demande la libération ; la veille prolongée est une autre action qui conserve l'état de la mémoire." }
references:
  - title: Create and assign an autoscale scaling plan for Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/autoscale-scaling-plan
  - title: Configure Start VM on Connect for Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/start-virtual-machine-connect
