id: az140-4a-app-not-visible
objective: "4.1.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have two pooled host pools named **HP1** and **HP2** and an Azure Virtual Desktop workspace named **WS1**. The desktop application group of HP1 is registered with WS1. The preferred application group type of HP2 is RemoteApp.

    You create a RemoteApp application group named **RAG-Finance** for HP2, add an application named **Ledger** to it, and assign it to a group named **GRP-Finance**. When you created RAG-Finance, you skipped the **Workspace** tab.

    The members of GRP-Finance see the HP1 desktop in Windows App, but they don't see Ledger. You need to ensure that the members of GRP-Finance can see Ledger.

    What should you do?
  fr: |
    Vous disposez de deux pools d'hôtes regroupés nommés **HP1** et **HP2** et d'un espace de travail Azure Virtual Desktop nommé **WS1**. Le groupe d'applications de bureau de HP1 est inscrit dans WS1. Le type de groupe d'applications préféré de HP2 est RemoteApp.

    Vous créez pour HP2 un groupe d'applications RemoteApp nommé **RAG-Finance**, y ajoutez une application nommée **Ledger** et l'attribuez à un groupe nommé **GRP-Finance**. À la création de RAG-Finance, vous avez ignoré l'onglet **Workspace**.

    Les membres de GRP-Finance voient le bureau de HP1 dans Windows App, mais pas Ledger. Vous devez faire en sorte que les membres de GRP-Finance voient Ledger.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Assign GRP-Finance the Desktop Virtualization Application Group Reader role on RAG-Finance.", fr: "Attribuer à GRP-Finance le rôle Desktop Virtualization Application Group Reader sur RAG-Finance." } }
    - { id: b, text: { en: "Turn off drain mode on the session hosts of HP2.", fr: "Désactiver le mode drainage sur les hôtes de session de HP2." } }
    - { id: c, text: { en: "Add RAG-Finance to the application groups of WS1.", fr: "Ajouter RAG-Finance aux groupes d'applications de WS1." } }
    - { id: d, text: { en: "Assign GRP-Finance to the desktop application group of HP1.", fr: "Attribuer GRP-Finance au groupe d'applications de bureau de HP1." } }
answer: { optionId: c }
explanation:
  correct:
    en: Users can access resources only when the application group is assigned to them and added to a workspace. RAG-Finance isn't in any workspace, so Ledger doesn't appear in the feed; in WS1, select Application groups, then + Add, and select RAG-Finance (only application groups that aren't already in a workspace are listed).
    fr: Les utilisateurs n'accèdent aux ressources que si le groupe d'applications leur est attribué et ajouté à un espace de travail. RAG-Finance n'est dans aucun espace de travail, donc Ledger n'apparaît pas dans le flux ; dans WS1, sélectionnez Application groups, puis + Add, et choisissez RAG-Finance (seuls les groupes d'applications qui ne sont pas déjà dans un espace de travail sont listés).
  options:
    a: { en: "Application Group Reader lets administrators view the application group; users get access through the assignment, which already exists.", fr: "Application Group Reader permet aux administrateurs de consulter le groupe d'applications ; les utilisateurs obtiennent l'accès par l'attribution, qui existe déjà." }
    b: { en: "Drain mode affects where new sessions are placed, not which resources appear in the feed.", fr: "Le mode drainage influe sur le placement des nouvelles sessions, pas sur les ressources qui apparaissent dans le flux." }
    d: { en: "The users already see the HP1 desktop; the missing resource is the RemoteApp application group of HP2.", fr: "Les utilisateurs voient déjà le bureau de HP1 ; la ressource manquante est le groupe d'applications RemoteApp de HP2." }
references:
  - title: Deploy Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/create-application-group-workspace
  - title: Publish applications with RemoteApp in Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/manage-app-groups
