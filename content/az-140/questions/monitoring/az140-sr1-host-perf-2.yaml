stem:
  en: You use the Session host data settings tab of the configuration workbook.
  fr: Vous utilisez l'onglet Session host data settings du workbook de configuration.
body:
  solution:
    en: |
      In the configuration workbook of Azure Virtual Desktop Insights, on the **Session host data settings** tab, you select LAW-AVD and create a data collection rule. You select **Deploy association**, **Add extension** and **Add system managed identity**, and then you configure the missing performance counters and event logs.
    fr: |
      Dans le workbook de configuration d'Azure Virtual Desktop Insights, sous l'onglet **Session host data settings**, vous sélectionnez LAW-AVD et créez une règle de collecte de données. Vous sélectionnez **Deploy association**, **Add extension** et **Add system managed identity**, puis vous configurez les compteurs de performances et les journaux d'événements manquants.
answer: { value: true }
explanation:
  correct:
    en: |
      This tab creates the data collection rule that defines the counters, the event logs and the destination workspace, associates it with the session hosts, and deploys the Azure Monitor Agent with the managed identity it needs. The automated deployment from the workbook supports up to 1,000 session hosts, so the 120 hosts of HP-Ops are covered.
    fr: |
      Cet onglet crée la règle de collecte de données qui définit les compteurs, les journaux d'événements et l'espace de travail de destination, l'associe aux hôtes de session et déploie l'agent Azure Monitor avec l'identité managée dont il a besoin. Le déploiement automatisé depuis le workbook prend en charge jusqu'à 1 000 hôtes de session : les 120 hôtes de HP-Ops sont donc couverts.
references:
  - title: Enable Insights to monitor Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/insights
