id: az140-4a-workbook-text-step
objective: "4.1.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You are editing a custom workbook based on Azure Virtual Desktop Insights. At the top of the workbook, you need to display a highlighted warning message that tells readers that log data can arrive with a delay of several minutes.

    Which element should you add?
  fr: |
    Vous modifiez un workbook personnalisé basé sur Azure Virtual Desktop Insights. En haut du workbook, vous devez afficher un message d'avertissement mis en évidence qui indique aux lecteurs que les données de journal peuvent arriver avec un retard de plusieurs minutes.

    Quel élément devez-vous ajouter ?
body:
  options:
    - { id: a, text: { en: "A parameters step that has a text parameter", fr: "Une étape de paramètres qui comporte un paramètre de texte" } }
    - { id: b, text: { en: "A links step that uses the Toolbar style", fr: "Une étape de liens qui utilise le style Toolbar" } }
    - { id: c, text: { en: "A metric step that uses the Grid visualization", fr: "Une étape de métrique qui utilise la visualisation Grid" } }
    - { id: d, text: { en: "A text step that uses the warning text style", fr: "Une étape de texte qui utilise le style de texte warning" } }
answer: { optionId: d }
explanation:
  correct:
    en: A text step displays Markdown content, and its Text Style option renders it as plain, info, error, success, upsell or warning, which highlights the message.
    fr: Une étape de texte affiche du contenu Markdown, et son option Text Style la présente en plain, info, error, success, upsell ou warning, ce qui met le message en évidence.
  options:
    a: { en: "A text parameter collects input from the reader; it doesn't display a message.", fr: "Un paramètre de texte recueille une saisie du lecteur ; il n'affiche pas de message." }
    b: { en: "A links step creates links, buttons or tabs, not a styled message.", fr: "Une étape de liens crée des liens, des boutons ou des onglets, pas un message mis en forme." }
    c: { en: "A metric step charts Azure Monitor metrics; it can't display free text.", fr: "Une étape de métrique représente des métriques Azure Monitor ; elle ne peut pas afficher de texte libre." }
references:
  - title: Create or edit an Azure Workbook
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/visualize/workbooks-create-workbook
