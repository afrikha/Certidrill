id: az140-4a-hosts-not-sending
objective: "4.1.2"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    You have a pooled host pool named **HP1** that contains six session hosts named **SH1** to **SH6**. You configured Azure Virtual Desktop Insights for HP1 by using a Log Analytics workspace named **LAW1** and a data collection rule named **DCR1**.

    In the configuration workbook, the **Session host data settings** tab shows the message "Some hosts in the host pool are not sending data to the selected Log Analytics workspace" for SH5 and SH6. SH1 to SH4 send data normally.

    Which two issues could cause this?

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un pool d'hôtes regroupé nommé **HP1** qui contient six hôtes de session nommés **SH1** à **SH6**. Vous avez configuré Azure Virtual Desktop Insights pour HP1 avec un espace de travail Log Analytics nommé **LAW1** et une règle de collecte de données nommée **DCR1**.

    Dans le workbook de configuration, l'onglet **Session host data settings** affiche le message « Some hosts in the host pool are not sending data to the selected Log Analytics workspace » pour SH5 et SH6. SH1 à SH4 envoient normalement des données.

    Quels sont les deux problèmes qui peuvent en être la cause ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "The diagnostic setting of HP1 doesn't include the AgentHealthStatus category.", fr: "Le paramètre de diagnostic de HP1 n'inclut pas la catégorie AgentHealthStatus." } }
    - { id: b, text: { en: "SH5 and SH6 aren't associated with DCR1.", fr: "SH5 et SH6 ne sont pas associés à DCR1." } }
    - { id: c, text: { en: "Drain mode is turned on for SH5 and SH6.", fr: "Le mode drainage est activé sur SH5 et SH6." } }
    - { id: d, text: { en: "The Azure Monitor Agent extension isn't installed on SH5 and SH6.", fr: "L'extension de l'agent Azure Monitor n'est pas installée sur SH5 et SH6." } }
    - { id: e, text: { en: "The diagnostic setting of the workspace doesn't include the Feed category.", fr: "Le paramètre de diagnostic de l'espace de travail n'inclut pas la catégorie Feed." } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: Session host data reaches LAW1 only if each host runs the Azure Monitor Agent, has the required managed identity and is associated with the data collection rule. Hosts that miss the association or the agent are reported in the Session hosts section of the configuration workbook, which offers Deploy association and Add extension to fix them.
    fr: Les données d'un hôte de session n'arrivent dans LAW1 que si l'hôte exécute l'agent Azure Monitor, possède l'identité managée requise et est associé à la règle de collecte de données. Les hôtes auxquels il manque l'association ou l'agent sont signalés dans la section Session hosts du workbook de configuration, qui propose Deploy association et Add extension pour les corriger.
  options:
    a: { en: "AgentHealthStatus is a service log category of the whole host pool; it doesn't decide whether two hosts send counters and events.", fr: "AgentHealthStatus est une catégorie de journaux de service de tout le pool d'hôtes ; elle ne détermine pas si deux hôtes envoient des compteurs et des événements." }
    c: { en: "Drain mode only blocks new user sessions; the agent keeps sending data.", fr: "Le mode drainage bloque seulement les nouvelles sessions utilisateur ; l'agent continue d'envoyer des données." }
    e: { en: "Workspace diagnostics are service logs; they have no effect on the data sent by individual session hosts.", fr: "Les diagnostics de l'espace de travail sont des journaux de service ; ils n'ont aucun effet sur les données envoyées par chaque hôte de session." }
references:
  - title: Enable Insights to monitor Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/insights
