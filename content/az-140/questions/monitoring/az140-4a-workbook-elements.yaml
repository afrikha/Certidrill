id: az140-4a-workbook-elements
objective: "4.1.3"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    You are editing a custom workbook based on Azure Virtual Desktop Insights.

    Which workbook element should you add for each requirement? To answer, drag the appropriate elements to the correct requirements. Each element may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous modifiez un workbook personnalisé basé sur Azure Virtual Desktop Insights.

    Quel élément de workbook devez-vous ajouter pour chaque exigence ? Pour répondre, faites glisser les éléments appropriés vers les exigences correspondantes. Chaque élément peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: text, text: { en: "Text", fr: "Texte (Text)" } }
    - { id: param, text: { en: "Parameters", fr: "Paramètres (Parameters)" } }
    - { id: query, text: { en: "Query", fr: "Requête (Query)" } }
    - { id: metric, text: { en: "Metric", fr: "Métrique (Metric)" } }
    - { id: links, text: { en: "Links/tabs", fr: "Liens/onglets (Links/tabs)" } }
    - { id: group, text: { en: "Group", fr: "Groupe (Group)" } }
  targets:
    - id: t1
      text: { en: "Let users choose a host pool from a drop-down list that filters the other steps", fr: "Permettre aux utilisateurs de choisir un pool d'hôtes dans une liste déroulante qui filtre les autres étapes" }
    - id: t2
      text: { en: "Chart the Percentage CPU platform metric of the session host VMs", fr: "Représenter la métrique de plateforme Percentage CPU des machines virtuelles hôtes de session" }
    - id: t3
      text: { en: "Display a grid of the WVDErrors records returned by a KQL statement", fr: "Afficher une grille des enregistrements WVDErrors renvoyés par une instruction KQL" }
    - id: t4
      text: { en: "Split the workbook content into tabs", fr: "Répartir le contenu du workbook en onglets" }
answer:
  mapping: { t1: param, t2: metric, t3: query, t4: links }
explanation:
  correct:
    en: Parameters collect input, such as a drop-down list of host pools, that the other steps reference. A metric step charts an Azure Monitor metric of selected resources with an aggregation. A query step runs a KQL query and shows it as a grid or chart. A links step with the Tabs style creates tabs, each setting a parameter value that controls which content is visible.
    fr: Les paramètres recueillent une saisie, comme une liste déroulante de pools d'hôtes, que les autres étapes référencent. Une étape de métrique représente une métrique Azure Monitor des ressources sélectionnées avec une agrégation. Une étape de requête exécute une requête KQL et l'affiche en grille ou en graphique. Une étape de liens avec le style Tabs crée des onglets, chacun fixant une valeur de paramètre qui contrôle le contenu visible.
  options:
    text: { en: "A text step displays Markdown content; it doesn't query data or collect input.", fr: "Une étape de texte affiche du contenu Markdown ; elle n'interroge pas de données et ne recueille pas de saisie." }
    group: { en: "A group scopes and loads several steps together; it doesn't create tabs on its own.", fr: "Un groupe délimite et charge plusieurs étapes ensemble ; il ne crée pas d'onglets à lui seul." }
references:
  - title: Create or edit an Azure Workbook
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/visualize/workbooks-create-workbook
