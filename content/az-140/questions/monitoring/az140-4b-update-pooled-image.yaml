id: az140-4b-update-pooled-image
objective: "4.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso has an Azure Virtual Desktop pooled host pool named **HP1** that contains 20 session hosts running Windows 11 Enterprise multi-session. HP1 was created with a session host configuration that references an image in an Azure Compute Gallery named **gal1**.

    Each month, you must apply the latest Windows quality updates to HP1. Every session host must stay identical to the image referenced by the host pool, and the solution must minimize administrative effort.

    What should you do each month?
  fr: |
    Contoso dispose d'un pool d'hôtes Azure Virtual Desktop regroupé nommé **HP1** qui contient 20 hôtes de session exécutant Windows 11 Enterprise multisession. HP1 a été créé avec une configuration d'hôte de session qui référence une image d'une galerie Azure Compute Gallery nommée **gal1**.

    Chaque mois, vous devez appliquer les dernières mises à jour qualité de Windows à HP1. Chaque hôte de session doit rester identique à l'image référencée par le pool d'hôtes, et la solution doit réduire au minimum l'effort d'administration.

    Que devez-vous faire chaque mois ?
body:
  options:
    - { id: a, text: { en: "Patch the running session hosts by using an Azure Update Manager maintenance configuration.", fr: "Corriger les hôtes de session en cours d'exécution à l'aide d'une configuration de maintenance Azure Update Manager." } }
    - { id: b, text: { en: "Publish a patched image version in gal1 and schedule a session host update for HP1.", fr: "Publier une version d'image corrigée dans gal1 et planifier une mise à jour des hôtes de session pour HP1." } }
    - { id: c, text: { en: "Assign a Microsoft Intune Windows update ring to a group that contains the session hosts.", fr: "Attribuer un anneau de mise à jour Windows Microsoft Intune à un groupe contenant les hôtes de session." } }
    - { id: d, text: { en: "Put each session host in drain mode in turn and run Windows Update on it.", fr: "Mettre tour à tour chaque hôte de session en mode drainage et y exécuter Windows Update." } }
answer: { optionId: b }
explanation:
  correct:
    en: For pooled host pools, Microsoft recommends updating the source image rather than each session host. Because HP1 uses a session host configuration, a session host update replaces the session hosts in batches with new VMs built from the new image version, so every host matches the image and no host is patched by hand.
    fr: "Pour les pools d'hôtes regroupés, Microsoft recommande de mettre à jour l'image source plutôt que chaque hôte de session. Comme HP1 utilise une configuration d'hôte de session, une mise à jour des hôtes de session remplace les hôtes par lots par de nouvelles machines virtuelles créées à partir de la nouvelle version d'image : chaque hôte correspond à l'image et aucun hôte n'est corrigé à la main."
  options:
    a: { en: "Patching the running VMs leaves the image referenced by HP1 unpatched: any host created later from it is out of date, so the hosts no longer match the image.", fr: "Corriger les machines virtuelles en cours d'exécution laisse non corrigée l'image référencée par HP1 : tout hôte créé ensuite à partir d'elle est obsolète, et les hôtes ne correspondent plus à l'image." }
    c: { en: "Windows update rings aren't supported on Windows Enterprise multi-session, and in-place patching would still leave the image out of date.", fr: "Les anneaux de mise à jour Windows ne sont pas pris en charge sur Windows Enterprise multisession, et une correction sur place laisserait de toute façon l'image obsolète." }
    d: { en: "Patching each host manually is the highest-effort option and creates drift between the hosts and the image.", fr: "Corriger chaque hôte manuellement est l'option la plus coûteuse en effort et crée un écart entre les hôtes et l'image." }
references:
  - title: Session host update
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/session-host-update
  - title: Using Azure Virtual Desktop multi-session with Microsoft Intune
    url: https://learn.microsoft.com/en-us/intune/intune-service/fundamentals/azure-virtual-desktop-multi-session
