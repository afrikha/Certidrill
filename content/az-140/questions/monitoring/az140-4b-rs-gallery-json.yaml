id: az140-4b-rs-gallery-json
objective: "4.2.5"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    Tailspin Toys publishes the session host image of its Azure Virtual Desktop host pools as image versions in an Azure Compute Gallery. You are writing the properties of the next image version. The image version must meet the following requirements:

    - Be used when a deployment references the latest version of the image definition.
    - Use the recommended number of replicas per region for up to 60 session hosts created at the same time in each region.
    - Keep its replicas available if a datacenter of the region fails.
    - Prevent a region from being removed from the replication by accident.

    How should you complete the fragment? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin Toys publie l'image des hôtes de session de ses pools d'hôtes Azure Virtual Desktop sous forme de versions d'image dans une galerie Azure Compute Gallery. Vous écrivez les propriétés de la prochaine version d'image. La version d'image doit satisfaire les exigences suivantes :

    - être utilisée quand un déploiement référence la dernière version de la définition d'image ;
    - utiliser le nombre de réplicas par région recommandé pour jusqu'à 60 hôtes de session créés en même temps dans chaque région ;
    - garder ses réplicas disponibles si un centre de données de la région tombe en panne ;
    - empêcher qu'une région soit retirée de la réplication par accident.

    Comment devez-vous compléter le fragment ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: json
  template: |
    "properties": {
      "publishingProfile": {
        "targetRegions": [
          { "name": "westeurope" },
          { "name": "northeurope" }
        ],
        "replicaCount": [[count]],
        "storageAccountType": "[[sku]]",
        "excludeFromLatest": [[latest]]
      },
      "safetyProfile": {
        "allowDeletionOfReplicatedLocations": [[del]]
      }
    }
  slots:
    - id: count
      options:
        - { id: c1, text: "1" }
        - { id: c3, text: "3" }
        - { id: c20, text: "20" }
        - { id: c60, text: "60" }
    - id: sku
      options:
        - { id: lrs, text: Standard_LRS }
        - { id: zrs, text: Standard_ZRS }
        - { id: plrs, text: Premium_LRS }
    - id: latest
      options:
        - { id: lt, text: "true" }
        - { id: lf, text: "false" }
    - id: del
      options:
        - { id: dt, text: "true" }
        - { id: df, text: "false" }
answer:
  values: { count: c3, sku: zrs, latest: lf, del: df }
explanation:
  correct:
    en: |
      Microsoft recommends one replica for every 20 VMs created concurrently and at least three replicas for production images, so 60 concurrent session hosts need 3 replicas per region. Standard_ZRS keeps the replicas available if a zone fails, in regions that have availability zones. excludeFromLatest must be false for the version to be picked as latest, and setting allowDeletionOfReplicatedLocations to false prevents the accidental removal of replicated regions.
    fr: |
      Microsoft recommande un réplica pour 20 machines virtuelles créées simultanément et au moins trois réplicas pour les images de production : 60 hôtes de session simultanés nécessitent donc 3 réplicas par région. Standard_ZRS garde les réplicas disponibles en cas de panne d'une zone, dans les régions dotées de zones de disponibilité. excludeFromLatest doit valoir false pour que la version soit retenue comme dernière version, et définir allowDeletionOfReplicatedLocations sur false empêche la suppression accidentelle de régions répliquées.
  options:
    c60: { en: "One replica per VM isn't required; one replica serves about 20 concurrent VM creations.", fr: "Un réplica par machine virtuelle n'est pas nécessaire ; un réplica permet environ 20 créations simultanées de machines virtuelles." }
    plrs: { en: "Premium storage is supported only with locally redundant storage, which doesn't survive a zone failure.", fr: "Le stockage Premium n'est pris en charge qu'avec le stockage localement redondant, qui ne survit pas à la panne d'une zone." }
    lt: { en: "true excludes the version from latest, so deployments would keep using the previous version.", fr: "true exclut la version de la dernière version : les déploiements continueraient à utiliser la version précédente." }
references:
  - title: Overview of Azure Compute Gallery
    url: https://learn.microsoft.com/en-us/azure/virtual-machines/azure-compute-gallery
