id: az140-4b-update-shu-statements
objective: "4.2.1"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Adatum has an Azure Virtual Desktop pooled host pool named **HP-Finance** that was created with a session host configuration. The session hosts are connected to a subnet named **snet-avd** in a virtual network named **vnet-hub-weu**. After the hosts were deployed, an administrator manually added a registry key on each session host to configure a line-of-business app.

    You schedule a session host update that changes the image of HP-Finance to a new image version. In the update, you set the sign-out delay to 15 minutes and enter a sign-out message.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum dispose d'un pool d'hôtes Azure Virtual Desktop regroupé nommé **HP-Finance**, créé avec une configuration d'hôte de session. Les hôtes de session sont connectés à un sous-réseau nommé **snet-avd** d'un réseau virtuel nommé **vnet-hub-weu**. Après le déploiement des hôtes, un administrateur a ajouté manuellement une clé de Registre sur chaque hôte de session pour configurer une application métier.

    Vous planifiez une mise à jour des hôtes de session qui remplace l'image de HP-Finance par une nouvelle version d'image. Dans la mise à jour, vous définissez un délai de déconnexion de 15 minutes et saisissez un message de déconnexion.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: Users who are still signed in to a session host when its batch starts receive the message and are signed out after 15 minutes.
        fr: Les utilisateurs encore connectés à un hôte de session au démarrage de son lot reçoivent le message et sont déconnectés au bout de 15 minutes.
    - id: s2
      text:
        en: The registry key that the administrator added manually is present on the new session hosts.
        fr: La clé de Registre ajoutée manuellement par l'administrateur est présente sur les nouveaux hôtes de session.
    - id: s3
      text:
        en: The new session hosts are connected to snet-avd.
        fr: Les nouveaux hôtes de session sont connectés à snet-avd.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |
      Before a batch is updated, connected users receive the administrator's message, and the service waits for the configured delay (0 to 60 minutes) before signing out the remaining users. Manual customizations such as files, registry keys or certificates aren't carried over to the new VMs: put them in the image, Intune, Group Policy or the custom configuration script. Network configuration, availability configuration and location persist across updates, so the new hosts use the same subnet.
    fr: |
      Avant la mise à jour d'un lot, les utilisateurs connectés reçoivent le message de l'administrateur, et le service attend le délai configuré (de 0 à 60 minutes) avant de déconnecter les utilisateurs restants. Les personnalisations manuelles, comme des fichiers, des clés de Registre ou des certificats, ne sont pas reportées sur les nouvelles machines virtuelles : placez-les dans l'image, dans Intune, dans une stratégie de groupe ou dans le script de configuration personnalisé. La configuration réseau, la configuration de disponibilité et l'emplacement sont conservés lors des mises à jour : les nouveaux hôtes utilisent le même sous-réseau.
references:
  - title: Session host update
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/session-host-update
  - title: Update session hosts in a host pool with a session host configuration in Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/session-host-update-configure
