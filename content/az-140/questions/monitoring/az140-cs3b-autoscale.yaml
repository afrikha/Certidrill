id: az140-cs3b-autoscale
objective: "4.1.5"
type: dropdown
caseStudy: az140-cs3b-alpine-ski-house
difficulty: 2
status: draft
stem:
  en: |
    You are creating a power management scaling plan for HP-Resorts to meet the autoscale requirement.

    How should you complete the configuration? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous créez un plan de mise à l'échelle de type gestion de l'alimentation pour HP-Resorts afin de satisfaire l'exigence de mise à l'échelle automatique.

    Comment devez-vous compléter la configuration ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Assign the [[role]] role to the Azure Virtual Desktop service principal at the scope of [[scope]].

      In the ramp-down phase, set **Force logoff of users** to **No** and stop session hosts when [[stop]].
    fr: |
      Attribuer le rôle [[role]] au principal de service Azure Virtual Desktop à l'étendue de [[scope]].

      Dans la phase de ralentissement (ramp-down), définir **Force logoff of users** sur **No** et arrêter les hôtes de session quand [[stop]].
  slots:
    - id: role
      options:
        - { id: poweron, text: Desktop Virtualization Power On Contributor }
        - { id: poweronoff, text: Desktop Virtualization Power On Off Contributor }
        - { id: shoperator, text: Desktop Virtualization Session Host Operator }
        - { id: vmcontrib, text: Virtual Machine Contributor }
    - id: scope
      options:
        - { id: hostpool, text: { en: "the HP-Resorts host pool", fr: "le pool d'hôtes HP-Resorts" } }
        - { id: rg, text: { en: "the resource group of the session hosts", fr: "le groupe de ressources des hôtes de session" } }
        - { id: sub, text: { en: "the Sub-Resorts subscription", fr: "l'abonnement Sub-Resorts" } }
    - id: stop
      options:
        - { id: noactive, text: { en: "VMs have no active sessions", fr: "les machines virtuelles n'ont aucune session active (VMs have no active sessions)" } }
        - { id: noactivedisc, text: { en: "VMs have no active or disconnected sessions", fr: "les machines virtuelles n'ont aucune session active ou déconnectée (VMs have no active or disconnected sessions)" } }
        - { id: minpct, text: { en: "the minimum percentage of hosts is reached", fr: "le pourcentage minimal d'hôtes est atteint" } }
answer:
  values: { role: poweronoff, scope: sub, stop: noactivedisc }
explanation:
  correct:
    en: |
      A power management scaling plan needs Desktop Virtualization Power On Off Contributor on the Azure Virtual Desktop service principal, because autoscale both starts and stops session hosts. Microsoft Learn says to assign it on each subscription that contains the host pools and session hosts; a lower scope prevents autoscale from working properly. Without forced logoff, stopping only hosts that have no active or disconnected sessions preserves the disconnected sessions of the employees.
    fr: |
      Un plan de mise à l'échelle de type gestion de l'alimentation exige Desktop Virtualization Power On Off Contributor sur le principal de service Azure Virtual Desktop, car la mise à l'échelle automatique démarre et arrête les hôtes de session. Microsoft Learn indique de l'attribuer sur chaque abonnement qui contient les pools d'hôtes et les hôtes de session ; une étendue inférieure empêche la mise à l'échelle automatique de fonctionner correctement. Sans déconnexion forcée, n'arrêter que les hôtes sans session active ni déconnectée préserve les sessions déconnectées des employés.
  options:
    poweron: { en: "This role only starts VMs (Start VM on Connect); autoscale must also stop them.", fr: "Ce rôle permet seulement de démarrer les machines virtuelles (Start VM on Connect) ; la mise à l'échelle automatique doit aussi les arrêter." }
    shoperator: { en: "This role is for administrators who manage drain mode and remove session hosts; it doesn't let the service power VMs on or off.", fr: "Ce rôle est destiné aux administrateurs qui gèrent le mode drainage et suppriment des hôtes de session ; il ne permet pas au service d'allumer ou d'éteindre les machines virtuelles." }
    vmcontrib: { en: "Virtual Machine Contributor grants far more than power operations and isn't the role documented for autoscale.", fr: "Virtual Machine Contributor accorde bien plus que les opérations d'alimentation et n'est pas le rôle documenté pour la mise à l'échelle automatique." }
    hostpool: { en: "A scope lower than the subscription prevents autoscale from working properly.", fr: "Une étendue inférieure à l'abonnement empêche la mise à l'échelle automatique de fonctionner correctement." }
    rg: { en: "A scope lower than the subscription prevents autoscale from working properly.", fr: "Une étendue inférieure à l'abonnement empêche la mise à l'échelle automatique de fonctionner correctement." }
    noactive: { en: "This condition can shut down a host that still has disconnected sessions, which ends those sessions.", fr: "Cette condition peut arrêter un hôte qui a encore des sessions déconnectées, ce qui met fin à ces sessions." }
    minpct: { en: "The minimum percentage of hosts limits how many hosts stay running; it isn't the condition for stopping a host without forced logoff.", fr: "Le pourcentage minimal d'hôtes limite le nombre d'hôtes qui restent allumés ; ce n'est pas la condition d'arrêt d'un hôte sans déconnexion forcée." }
references:
  - title: Create and assign an autoscale scaling plan for Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/autoscale-scaling-plan
