id: az140-4b-bk-files-limits
objective: "4.2.4"
type: dropdown
difficulty: 1
status: draft
shuffle: false
stem:
  en: |
    Northwind Traders is designing the backup of the Azure file shares that store the FSLogix profile containers of its Azure Virtual Desktop host pools. You use Azure Backup.

    How should you complete the design notes? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind Traders conçoit la sauvegarde des partages de fichiers Azure qui stockent les conteneurs de profils FSLogix de ses pools d'hôtes Azure Virtual Desktop. Vous utilisez Sauvegarde Azure.

    Comment devez-vous compléter les notes de conception ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      A Snapshot tier policy can take up to [[snaps]] scheduled snapshots per day.

      A file share can have up to [[points]] recovery points at any time.

      To keep a copy of the backups outside the storage account, the policy must use the [[tier]] tier.
    fr: |
      Une stratégie du niveau Snapshot peut prendre jusqu'à [[snaps]] captures instantanées planifiées par jour.

      Un partage de fichiers peut avoir jusqu'à [[points]] points de récupération à tout moment.

      Pour conserver une copie des sauvegardes en dehors du compte de stockage, la stratégie doit utiliser le niveau [[tier]].
  slots:
    - id: snaps
      options:
        - { id: s4, text: "4" }
        - { id: s6, text: "6" }
        - { id: s12, text: "12" }
        - { id: s24, text: "24" }
    - id: points
      options:
        - { id: p99, text: "99" }
        - { id: p200, text: "200" }
        - { id: p255, text: "255" }
        - { id: p500, text: "500" }
    - id: tier
      options:
        - { id: snap, text: Snapshot }
        - { id: vault, text: Vault-Standard }
        - { id: archive, text: Archive }
answer:
  values: { snaps: s24, points: p200, tier: vault }
explanation:
  correct:
    en: |
      Azure Files backup supports up to 24 scheduled snapshots per day and 200 recovery points per file share at any time. The Snapshot tier keeps the backups as share snapshots in the storage account; the Vault-Standard (vaulted) tier also transfers the changed data to the vault, which gives an offsite copy and protection against ransomware.
    fr: |
      La sauvegarde Azure Files prend en charge jusqu'à 24 captures instantanées planifiées par jour et 200 points de récupération par partage de fichiers à tout moment. Le niveau Snapshot conserve les sauvegardes sous forme de captures instantanées de partage dans le compte de stockage ; le niveau Vault-Standard (sauvegarde dans le coffre) transfère en plus les données modifiées vers le coffre, ce qui donne une copie hors site et une protection contre les rançongiciels.
  options:
    p99: { en: "99 is the maximum number of files or folders in one item-level restore.", fr: "99 est le nombre maximal de fichiers ou dossiers d'une restauration au niveau de l'élément." }
    p255: { en: "255 is the snapshot limit of an Azure NetApp Files volume.", fr: "255 est la limite de captures instantanées d'un volume Azure NetApp Files." }
    archive: { en: "Archive is a blob access tier, not an Azure Files backup tier.", fr: "Archive est un niveau d'accès des objets blob, pas un niveau de sauvegarde Azure Files." }
references:
  - title: Support Matrix for Azure Files backup by using Azure Backup
    url: https://learn.microsoft.com/en-us/azure/backup/azure-file-share-support-matrix
  - title: About Azure Files backup
    url: https://learn.microsoft.com/en-us/azure/backup/azure-file-share-backup-overview
