id: az140-4a-workbook-param
objective: "4.1.3"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    You are customizing your saved copy of Azure Virtual Desktop Insights. The workbook has a time range parameter named **TimeRange**.

    You add a query step that counts the completed connections in the WVDConnections table, and a text step above it. You need the query to return only the records of the selected time range, and the text step to display the selected range in a readable form, such as "Last 24 hours".

    How should you complete the configuration? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous personnalisez votre copie enregistrée d'Azure Virtual Desktop Insights. Le workbook possède un paramètre d'intervalle de temps nommé **TimeRange**.

    Vous ajoutez une étape de requête qui compte les connexions terminées de la table WVDConnections, et une étape de texte au-dessus. La requête doit renvoyer uniquement les enregistrements de l'intervalle sélectionné, et l'étape de texte doit afficher l'intervalle sélectionné sous une forme lisible, comme « Last 24 hours ».

    Comment devez-vous compléter la configuration ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Query step: `WVDConnections | where TimeGenerated` [[query]] `| where State == "Completed" | count`

      Text step: Completed connections for [[text]]
    fr: |
      Étape de requête : `WVDConnections | where TimeGenerated` [[query]] `| where State == "Completed" | count`

      Étape de texte : Completed connections for [[text]]
  slots:
    - id: query
      options:
        - { id: plain, text: "{TimeRange}" }
        - { id: label, text: "{TimeRange:label}" }
        - { id: gt, text: "> {TimeRange}" }
        - { id: b64, text: "{TimeRange:base64}" }
    - id: text
      options:
        - { id: raw, text: "{TimeRange}" }
        - { id: lbl, text: "{TimeRange:label}" }
        - { id: json, text: "{TimeRange:escapejson}" }
answer:
  values: { query: plain, text: lbl }
explanation:
  correct:
    en: "In a query, a time range parameter expands to a complete KQL condition: `where TimeGenerated {TimeRange}` becomes, for example, `where TimeGenerated > ago(1d)`. In a text step, the `:label` format displays the label of the selected value, such as Last 24 hours."
    fr: "Dans une requête, un paramètre d'intervalle de temps se développe en une condition KQL complète : `where TimeGenerated {TimeRange}` devient par exemple `where TimeGenerated > ago(1d)`. Dans une étape de texte, le format `:label` affiche l'étiquette de la valeur sélectionnée, comme Last 24 hours."
  options:
    label: { en: "In the query, the label is display text such as Last 24 hours, which isn't valid KQL.", fr: "Dans la requête, l'étiquette est un texte d'affichage comme Last 24 hours, qui n'est pas du KQL valide." }
    gt: { en: "The parameter already contains the operator, so this would produce `> > ago(1d)`.", fr: "Le paramètre contient déjà l'opérateur : on obtiendrait `> > ago(1d)`." }
    b64: { en: "The base64 format encodes the text; the result isn't a time condition.", fr: "Le format base64 encode le texte ; le résultat n'est pas une condition de temps." }
    raw: { en: "In a text step, the raw value is the KQL condition, not a readable label.", fr: "Dans une étape de texte, la valeur brute est la condition KQL, pas une étiquette lisible." }
    json: { en: "escapejson escapes the value for use in a JSON string; it doesn't display the label.", fr: "escapejson échappe la valeur pour l'utiliser dans une chaîne JSON ; il n'affiche pas l'étiquette." }
references:
  - title: Create workbook parameters
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/visualize/workbooks-parameters
