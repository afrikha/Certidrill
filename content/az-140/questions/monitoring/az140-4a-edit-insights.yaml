id: az140-4a-edit-insights
objective: "4.1.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Your team uses Azure Virtual Desktop Insights to monitor a host pool named **HP1**.

    You need a grid that lists the WVDErrors records of the last 24 hours grouped by CodeSymbolic, displayed in the Insights workbook alongside the existing reports. The Microsoft template that other administrators open must stay unchanged.

    What should you do?
  fr: |
    Votre équipe utilise Azure Virtual Desktop Insights pour superviser un pool d'hôtes nommé **HP1**.

    Vous avez besoin d'une grille qui liste les enregistrements WVDErrors des dernières 24 heures regroupés par CodeSymbolic, affichée dans le workbook Insights à côté des rapports existants. Le modèle Microsoft qu'ouvrent les autres administrateurs doit rester inchangé.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Open Check Configuration and select Configure host pool again.", fr: "Ouvrir Check Configuration et sélectionner de nouveau Configure host pool." } }
    - { id: b, text: { en: "Run the query in Log Analytics and pin the result to an Azure dashboard.", fr: "Exécuter la requête dans Log Analytics et épingler le résultat dans un tableau de bord Azure." } }
    - { id: c, text: { en: "Select Edit in Insights, add a query step, and save the result as a workbook.", fr: "Sélectionner Modifier dans Insights, ajouter une étape de requête et enregistrer le résultat comme workbook." } }
    - { id: d, text: { en: "Add the WVDErrors table to the data collection rule used by Insights.", fr: "Ajouter la table WVDErrors à la règle de collecte de données utilisée par Insights." } }
answer: { optionId: c }
explanation:
  correct:
    en: Insights is a workbook template. When you open a template, make changes in edit mode and save, the result is saved as a new workbook resource and the original template is left untouched, so other administrators still get the Microsoft version.
    fr: Insights est un modèle de workbook. Quand vous ouvrez un modèle, le modifiez en mode édition et l'enregistrez, le résultat est enregistré comme une nouvelle ressource workbook et le modèle d'origine reste intact ; les autres administrateurs obtiennent toujours la version Microsoft.
  options:
    a: { en: "Configure host pool deploys diagnostic settings; it doesn't add visualizations.", fr: "Configure host pool déploie des paramètres de diagnostic ; il n'ajoute pas de visualisations." }
    b: { en: "A pinned query appears on a dashboard, not in the Insights workbook alongside its reports.", fr: "Une requête épinglée apparaît dans un tableau de bord, pas dans le workbook Insights à côté de ses rapports." }
    d: { en: "WVDErrors comes from diagnostic settings, not from a data collection rule, and a rule doesn't change what the workbook displays.", fr: "WVDErrors provient des paramètres de diagnostic, pas d'une règle de collecte de données, et une règle ne change pas ce qu'affiche le workbook." }
references:
  - title: Azure Workbooks templates
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/visualize/workbooks-templates
  - title: Create or edit an Azure Workbook
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/visualize/workbooks-create-workbook
