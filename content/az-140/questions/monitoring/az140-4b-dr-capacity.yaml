id: az140-4b-dr-capacity
objective: "4.2.2"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Contoso plans an active-passive disaster recovery design for an Azure Virtual Desktop pooled host pool named **HP-Main** in the France Central region. A secondary host pool named **HP-DR** will be deployed in another region. To reduce costs, the HP-DR session hosts will stay deallocated until a failover.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso prévoit une conception de reprise d'activité actif-passif pour un pool d'hôtes Azure Virtual Desktop regroupé nommé **HP-Main** dans la région France Central. Un pool d'hôtes secondaire nommé **HP-DR** sera déployé dans une autre région. Pour réduire les coûts, les hôtes de session de HP-DR resteront désalloués jusqu'à un basculement.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: Buying Azure reserved VM instances for the HP-DR VM size guarantees that the HP-DR session hosts can start during a regional outage.
        fr: L'achat d'instances de machines virtuelles réservées Azure pour la taille de machine virtuelle de HP-DR garantit que les hôtes de session de HP-DR pourront démarrer pendant une panne régionale.
    - id: s2
      text:
        en: An on-demand capacity reservation in the secondary region guarantees that the HP-DR session hosts can start during a failover.
        fr: Une réservation de capacité à la demande dans la région secondaire garantit que les hôtes de session de HP-DR pourront démarrer pendant un basculement.
    - id: s3
      text:
        en: Each HP-DR session host must be started for a few hours at least once every 90 days.
        fr: Chaque hôte de session de HP-DR doit être démarré pendant quelques heures au moins une fois tous les 90 jours.
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: |
      Reserved instances reduce the price of VMs but don't reserve capacity, and neither do deallocated VMs or quotas. On-demand capacity reservations are the feature that guarantees that the VMs can start in a disaster. Deallocated session hosts must run for a few hours at least every 90 days to refresh the token they use to reach the Azure Virtual Desktop control plane, and to receive updates.
    fr: |
      Les instances réservées réduisent le prix des machines virtuelles mais ne réservent pas de capacité, pas plus que les machines virtuelles désallouées ou les quotas. Les réservations de capacité à la demande sont la fonctionnalité qui garantit que les machines virtuelles pourront démarrer lors d'un sinistre. Les hôtes de session désalloués doivent s'exécuter pendant quelques heures au moins tous les 90 jours pour actualiser le jeton qu'ils utilisent pour joindre le plan de contrôle Azure Virtual Desktop, et pour recevoir les mises à jour.
references:
  - title: Multiregion BCDR for Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/architecture/example-scenario/azure-virtual-desktop/azure-virtual-desktop-multi-region-bcdr
