id: az140-4b-bk-components
objective: "4.2.4"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Tailspin Toys is designing the backup strategy of its Azure Virtual Desktop deployment. Data that can be rebuilt from another source must not be backed up, to minimize cost.

    Which approach should you use for each component? To answer, drag the appropriate approaches to the correct components. Each approach may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin Toys conçoit la stratégie de sauvegarde de son déploiement Azure Virtual Desktop. Les données qui peuvent être reconstruites à partir d'une autre source ne doivent pas être sauvegardées, afin de réduire les coûts au minimum.

    Quelle approche devez-vous utiliser pour chaque composant ? Pour répondre, faites glisser les approches appropriées vers les composants correspondants. Chaque approche peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: afs, text: { en: "Azure Backup for Azure Files", fr: "Sauvegarde Azure pour Azure Files" } }
    - { id: anf, text: { en: "Azure NetApp Files backup", fr: "Sauvegarde Azure NetApp Files" } }
    - { id: vm, text: { en: "Azure Backup for Azure VMs", fr: "Sauvegarde Azure pour les machines virtuelles Azure" } }
    - { id: img, text: { en: "No backup: redeploy from the golden image", fr: "Aucune sauvegarde : redéployer à partir de l'image de référence" } }
    - { id: m365, text: { en: "No backup: data is resynchronized from Microsoft 365", fr: "Aucune sauvegarde : les données sont resynchronisées depuis Microsoft 365" } }
  targets:
    - id: t1
      text: { en: "Profile containers stored in an Azure file share", fr: "Conteneurs de profils stockés dans un partage de fichiers Azure" }
    - id: t2
      text: { en: "Personal desktops where users keep data on the local disks", fr: "Bureaux personnels sur lesquels les utilisateurs conservent des données sur les disques locaux" }
    - id: t3
      text: { en: "Pooled session hosts", fr: "Hôtes de session regroupés" }
    - id: t4
      text: { en: "ODFC containers that hold the Outlook and Teams caches", fr: "Conteneurs ODFC qui contiennent les caches Outlook et Teams" }
answer:
  mapping: { t1: afs, t2: vm, t3: img, t4: m365 }
explanation:
  correct:
    en: |
      Profile containers on Azure Files are protected with Azure Backup for Azure Files. Personal desktops are backed up at the VM level when users store data locally. Pooled session hosts are stateless and are recreated from the image. ODFC containers usually don't need a backup because their content can be rebuilt from Microsoft 365, which is why Microsoft recommends separate storage for Profile and ODFC containers.
    fr: |
      Les conteneurs de profils sur Azure Files sont protégés par Sauvegarde Azure pour Azure Files. Les bureaux personnels sont sauvegardés au niveau de la machine virtuelle quand les utilisateurs stockent des données en local. Les hôtes de session regroupés sont sans état et sont recréés à partir de l'image. Les conteneurs ODFC n'ont généralement pas besoin de sauvegarde, car leur contenu peut être reconstruit depuis Microsoft 365 ; c'est pourquoi Microsoft recommande un stockage distinct pour les conteneurs de profils et ODFC.
  options:
    anf: { en: "Azure NetApp Files backup protects Azure NetApp Files volumes; no component here is stored on Azure NetApp Files.", fr: "La sauvegarde Azure NetApp Files protège des volumes Azure NetApp Files ; aucun composant ici n'est stocké sur Azure NetApp Files." }
references:
  - title: Multiregion BCDR for Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/architecture/example-scenario/azure-virtual-desktop/azure-virtual-desktop-multi-region-bcdr
