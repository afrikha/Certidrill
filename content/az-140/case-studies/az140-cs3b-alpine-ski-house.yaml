id: az140-cs3b-alpine-ski-house
status: draft
title:
  en: |
    Alpine Ski House
  fr: |
    Alpine Ski House
tabs:
  - key: overview
    title: { en: "Overview", fr: "Vue d'ensemble" }
    body:
      en: |
        Alpine Ski House operates 14 ski resorts in France and Switzerland. Each resort has ticket offices, equipment rental shops and hotels. The company hires about 2,000 seasonal employees every winter.

        Alpine Ski House uses Azure Virtual Desktop to deliver its booking application, named **SnowBook**, and office desktops to the resorts. Travel agencies that resell ski passes also use SnowBook.
      fr: |
        Alpine Ski House exploite 14 stations de ski en France et en Suisse. Chaque station dispose de guichets de vente, de magasins de location de matériel et d'hôtels. L'entreprise recrute environ 2 000 saisonniers chaque hiver.

        Alpine Ski House utilise Azure Virtual Desktop pour fournir aux stations son application de réservation, nommée **SnowBook**, ainsi que des bureaux pour le personnel administratif. Des agences de voyages qui revendent des forfaits de ski utilisent aussi SnowBook.
  - key: existing
    title: { en: "Existing environment", fr: "Environnement existant" }
    body:
      en: |
        **Identity.** The AD DS domain alpineskihouse.com has two domain controllers in Azure. Microsoft Entra Connect Sync synchronizes the users, and the session hosts are Microsoft Entra hybrid joined. Single sign-on (SSO) is enabled on all host pools, and a Kerberos Server object exists. Employees have Microsoft 365 F3 or Microsoft 365 E3 licenses.

        **Azure Virtual Desktop** (France Central region):

        | Host pool | Subscription | Configuration |
        | --- | --- | --- |
        | HP-Resorts | Sub-Resorts | Pooled, breadth-first, maximum session limit 12, Windows 11 Enterprise multi-session, preferred application group type: Desktop. Application group **DAG-Resorts** (desktop). |
        | HP-Partners | Sub-Partners | Pooled, Windows 11 Enterprise multi-session. Application group **RAG-Partners** (RemoteApp) publishes SnowBook. |

        **Users.** The **Managers** group uses DAG-Resorts. The **FrontDesk** group (ticket office and rental staff) works on shared kiosk PCs. About 300 agents from external travel agencies use RAG-Partners; their accounts exist in the alpineskihouse.com domain, and Alpine Ski House invoices the agencies for this service.

        **Applications.** SnowBook is installed in the session host image. The rental shops use a point-of-sale application named **SkiRent**, packaged in MSIX format and stored as disk images on an Azure Files share named **apps** in the storage account **stappsash**. The storage account uses AD DS authentication.
      fr: |
        **Identité.** Le domaine AD DS alpineskihouse.com dispose de deux contrôleurs de domaine dans Azure. Microsoft Entra Connect Sync synchronise les utilisateurs, et les hôtes de session sont joints à Microsoft Entra hybride. L'authentification unique (SSO) est activée sur tous les pools d'hôtes, et un objet serveur Kerberos existe. Les employés ont une licence Microsoft 365 F3 ou Microsoft 365 E3.

        **Azure Virtual Desktop** (région France Central) :

        | Pool d'hôtes | Abonnement | Configuration |
        | --- | --- | --- |
        | HP-Resorts | Sub-Resorts | Regroupé (pooled), en largeur d'abord (breadth-first), limite de sessions 12, Windows 11 Enterprise multisession, type de groupe d'applications préféré : Desktop. Groupe d'applications **DAG-Resorts** (bureau). |
        | HP-Partners | Sub-Partners | Regroupé (pooled), Windows 11 Enterprise multisession. Le groupe d'applications **RAG-Partners** (RemoteApp) publie SnowBook. |

        **Utilisateurs.** Le groupe **Managers** utilise DAG-Resorts. Le groupe **FrontDesk** (personnel des guichets et de la location) travaille sur des PC kiosques partagés. Environ 300 agents d'agences de voyages externes utilisent RAG-Partners ; leurs comptes existent dans le domaine alpineskihouse.com, et Alpine Ski House facture ce service aux agences.

        **Applications.** SnowBook est installée dans l'image des hôtes de session. Les magasins de location utilisent une application de point de vente nommée **SkiRent**, empaquetée au format MSIX et stockée sous forme d'images disque dans un partage Azure Files nommé **apps** du compte de stockage **stappsash**. Le compte de stockage utilise l'authentification AD DS.
  - key: requirements
    title: { en: "Requirements", fr: "Exigences" }
    body:
      en: |
        Alpine Ski House identifies the following requirements:

        1. **FrontDesk** users must access only SnowBook, from HP-Resorts, without a full desktop. Managers keep their full desktop.
        2. SkiRent must be delivered to the HP-Resorts session hosts by using App attach, without installing it in the image.
        3. HP-Resorts must use an autoscale scaling plan. After the resorts close, session hosts must be shut down, but a user who leaves a disconnected session at the end of a shift must keep that session until it is signed out.
        4. Connections to Azure Virtual Desktop from outside the resort networks must require multifactor authentication (MFA), including when users sign in to the session hosts.
        5. In all HP-Resorts sessions, local drives and the clipboard must not be available, and the headset microphones of the kiosk PCs must work in SnowBook.
        6. The access of travel agency users must be licensed without buying Microsoft 365 or Windows licenses for them, and Alpine Ski House must not pay twice for its employees.
      fr: |
        Alpine Ski House a défini les exigences suivantes :

        1. Les utilisateurs de **FrontDesk** doivent accéder uniquement à SnowBook, depuis HP-Resorts, sans bureau complet. Les managers conservent leur bureau complet.
        2. SkiRent doit être fournie aux hôtes de session de HP-Resorts avec App attach, sans l'installer dans l'image.
        3. HP-Resorts doit utiliser un plan de mise à l'échelle automatique. Après la fermeture des stations, les hôtes de session doivent être arrêtés, mais un utilisateur qui laisse une session déconnectée en fin de service doit la conserver jusqu'à ce qu'elle soit fermée.
        4. Les connexions à Azure Virtual Desktop depuis l'extérieur des réseaux des stations doivent exiger l'authentification multifacteur (MFA), y compris lorsque les utilisateurs se connectent aux hôtes de session.
        5. Dans toutes les sessions de HP-Resorts, les lecteurs locaux et le Presse-papiers ne doivent pas être disponibles, et les micros des casques des PC kiosques doivent fonctionner dans SnowBook.
        6. L'accès des utilisateurs des agences de voyages doit être couvert par une licence sans acheter de licence Microsoft 365 ni Windows pour eux, et Alpine Ski House ne doit pas payer deux fois pour ses employés.
