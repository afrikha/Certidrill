id: az140-cs2b-bellows
status: draft
title:
  en: Bellows College
  fr: Bellows College
tabs:
  - key: overview
    title: { en: "Overview", fr: "Vue d'ensemble" }
    body:
      en: |
        Bellows College is a private college with 6,000 students and 450 staff members. The college is replacing its on-campus computer labs with Azure Virtual Desktop so that students can use their own devices: Windows and macOS computers, iPads, and Chromebooks that connect through a web browser.

        In 2025, Bellows decommissioned its on-premises Active Directory. All the identities are now cloud-only accounts in a Microsoft Entra tenant, and all the college devices are managed by Microsoft Intune.
      fr: |
        Bellows College est un établissement privé qui compte 6 000 étudiants et 450 membres du personnel. L'établissement remplace ses salles informatiques sur le campus par Azure Virtual Desktop pour que les étudiants puissent utiliser leurs propres appareils : ordinateurs Windows et macOS, iPad, et Chromebook qui se connectent par un navigateur web.

        En 2025, Bellows a mis hors service son Active Directory local. Toutes les identités sont désormais des comptes cloud uniquement dans un locataire Microsoft Entra, et tous les appareils de l'établissement sont gérés par Microsoft Intune.
  - key: existing
    title: { en: "Existing environment", fr: "Environnement existant" }
    body:
      en: |
        Bellows has an Azure subscription named **Sub-Labs** in the Canada Central region. The IT team has the Owner role on Sub-Labs.

        | Resource | Configuration |
        | --- | --- |
        | HP-Labs | Pooled host pool, breadth-first load balancing, no session host configuration |
        | Session hosts | 30 VMs, Windows 11 Enterprise multi-session version 24H2 with the latest cumulative updates, Microsoft Entra joined, enrolled in Intune, in a resource group named **RG-LabHosts** |
        | HP-Labs-DAG | Desktop application group of HP-Labs, registered in the workspace **WS-Labs**, assigned to **GRP-Students** |
        | stbellowsprof | Storage account with an Azure file share named **profiles** |
        | LAW-Labs | Log Analytics workspace |

        The diagnostic settings of WS-Labs already send all the log categories to LAW-Labs.

        **Groups.** GRP-Students contains all students. **GRP-LabAdmins** contains the lab technicians. Both are cloud-only security groups.

        **Conditional Access.** A policy named **CA-AllApps** requires multifactor authentication (MFA) for all users and all cloud apps.

        **Licensing.** Students have Microsoft 365 A3 licenses. Staff members have Microsoft 365 A5 licenses.
      fr: |
        Bellows dispose d'un abonnement Azure nommé **Sub-Labs** dans la région Canada Central. L'équipe informatique a le rôle Owner sur Sub-Labs.

        | Ressource | Configuration |
        | --- | --- |
        | HP-Labs | Pool d'hôtes Pooled, équilibrage de charge en largeur (breadth-first), sans configuration d'hôte de session |
        | Hôtes de session | 30 machines virtuelles, Windows 11 Enterprise multi-session version 24H2 avec les dernières mises à jour cumulatives, jointes à Microsoft Entra, inscrites dans Intune, dans un groupe de ressources nommé **RG-LabHosts** |
        | HP-Labs-DAG | Groupe d'applications de bureau de HP-Labs, inscrit dans l'espace de travail **WS-Labs**, attribué à **GRP-Students** |
        | stbellowsprof | Compte de stockage avec un partage de fichiers Azure nommé **profiles** |
        | LAW-Labs | Espace de travail Log Analytics |

        Les paramètres de diagnostic de WS-Labs envoient déjà toutes les catégories de journaux vers LAW-Labs.

        **Groupes.** GRP-Students contient tous les étudiants. **GRP-LabAdmins** contient les techniciens de laboratoire. Ce sont deux groupes de sécurité cloud uniquement.

        **Accès conditionnel.** Une stratégie nommée **CA-AllApps** exige l'authentification multifacteur (MFA) pour tous les utilisateurs et toutes les applications cloud.

        **Licences.** Les étudiants disposent de licences Microsoft 365 A3. Les membres du personnel disposent de licences Microsoft 365 A5.
  - key: requirements
    title: { en: "Requirements", fr: "Exigences" }
    body:
      en: |
        Bellows identifies the following requirements:

        1. **Sign-in.** After students sign in to their Azure Virtual Desktop client, they must not be prompted for credentials again when they connect to a session host, on every client platform.
        2. **Profiles.** Students must store FSLogix profile containers on the profiles share. Bellows will not deploy domain controllers or Microsoft Entra Domain Services.
        3. **Access.** Students must be able to sign in to the HP-Labs session hosts as standard users. Lab technicians must have local administrator rights on the session hosts.
        4. **Proctored exams.** In HP-Labs sessions, no local drive and no local clipboard must be available. Webcams and microphones must be redirected so that students can take oral exams.
        5. **Monitoring.** The IT team must use Azure Virtual Desktop Insights to review connection reliability, errors, and the performance counters of the session hosts.
        6. **Operations.** Administrative effort and permissions must be kept to a minimum.
      fr: |
        Bellows a défini les exigences suivantes :

        1. **Connexion.** Une fois connectés à leur client Azure Virtual Desktop, les étudiants ne doivent plus être invités à saisir leurs informations d'identification quand ils se connectent à un hôte de session, sur toutes les plateformes clientes.
        2. **Profils.** Les étudiants doivent stocker leurs conteneurs de profils FSLogix sur le partage profiles. Bellows ne déploiera ni contrôleurs de domaine ni Microsoft Entra Domain Services.
        3. **Accès.** Les étudiants doivent pouvoir se connecter aux hôtes de session HP-Labs en tant qu'utilisateurs standard. Les techniciens de laboratoire doivent avoir les droits d'administrateur local sur les hôtes de session.
        4. **Examens surveillés.** Dans les sessions HP-Labs, aucun lecteur local et aucun presse-papiers local ne doivent être disponibles. Les webcams et les microphones doivent être redirigés pour que les étudiants puissent passer des examens oraux.
        5. **Supervision.** L'équipe informatique doit utiliser Azure Virtual Desktop Insights pour examiner la fiabilité des connexions, les erreurs et les compteurs de performances des hôtes de session.
        6. **Exploitation.** L'effort d'administration et les autorisations doivent être réduits au minimum.
