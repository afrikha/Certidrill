id: az140-cs3a-trey-research
status: draft
title:
  en: |
    Trey Research
  fr: |
    Trey Research
tabs:
  - key: overview
    title: { en: "Overview", fr: "Vue d'ensemble" }
    body:
      en: |
        Trey Research is a pharmaceutical research company. It has laboratories in Leiden and Dublin and runs clinical trials for partner hospitals. A team of four administrators manages the IT infrastructure.

        Trey Research plans to replace its physical workstations with Azure Virtual Desktop.
      fr: |
        Trey Research est une société de recherche pharmaceutique. Elle dispose de laboratoires à Leyde et à Dublin et conduit des essais cliniques pour des hôpitaux partenaires. Une équipe de quatre administrateurs gère l'infrastructure informatique.

        Trey Research prévoit de remplacer ses stations de travail physiques par Azure Virtual Desktop.
  - key: existing
    title: { en: "Existing environment", fr: "Environnement existant" }
    body:
      en: |
        **Identity.** The on-premises Active Directory Domain Services (AD DS) forest treyresearch.com has two domain controllers in the Leiden datacenter. Microsoft Entra Connect Sync synchronizes all the user accounts to the Microsoft Entra tenant, so every user has a hybrid identity. All users have Microsoft 365 E5 licenses. Microsoft Intune manages all Windows devices.

        **Conditional Access.** A policy named **CA-MFA-All** requires multifactor authentication (MFA) for all users and all resources.

        **Network.** ExpressRoute private peering connects both laboratories to a virtual network named **VNet-AVD** in the West Europe region. VNet-AVD contains the subnets **snet-hosts** and **snet-endpoints**. Users access the internet through the laboratory proxies.

        **Planned Azure Virtual Desktop resources** (subscription **Sub-AVD**, West Europe):

        | Resource | Type | Configuration |
        | --- | --- | --- |
        | HP-Office | Pooled host pool | 400 office staff, Windows 11 Enterprise multi-session, Microsoft Entra joined session hosts |
        | HP-Lab | Personal host pool | 60 laboratory scientists, Windows 11 Enterprise, Microsoft Entra joined session hosts, automatic assignment |
        | HP-Trials | Personal host pool | 12 clinical trial analysts, Windows 11 Enterprise, Microsoft Entra joined session hosts |
        | WS-Trey | Workspace | Contains the application groups of the three host pools |
        | WS-Discovery | Workspace | Contains no application group |
        | stprofilestrey | Storage account | Premium file shares, share **profiles** for the FSLogix profile containers of HP-Office |

        Instrument control software on the HP-Lab session hosts writes acquisition data to the data disk of each virtual machine (VM). HP-Lab session hosts are deallocated outside working hours.
      fr: |
        **Identité.** La forêt Active Directory Domain Services (AD DS) locale treyresearch.com comprend deux contrôleurs de domaine dans le centre de données de Leyde. Microsoft Entra Connect Sync synchronise tous les comptes d'utilisateur vers le locataire Microsoft Entra : chaque utilisateur dispose donc d'une identité hybride. Tous les utilisateurs ont une licence Microsoft 365 E5. Microsoft Intune gère tous les appareils Windows.

        **Accès conditionnel.** Une stratégie nommée **CA-MFA-All** exige l'authentification multifacteur (MFA) pour tous les utilisateurs et toutes les ressources.

        **Réseau.** Le peering privé ExpressRoute relie les deux laboratoires à un réseau virtuel nommé **VNet-AVD** dans la région West Europe. VNet-AVD contient les sous-réseaux **snet-hosts** et **snet-endpoints**. Les utilisateurs accèdent à Internet par les proxys des laboratoires.

        **Ressources Azure Virtual Desktop prévues** (abonnement **Sub-AVD**, West Europe) :

        | Ressource | Type | Configuration |
        | --- | --- | --- |
        | HP-Office | Pool d'hôtes regroupé (pooled) | 400 employés de bureau, Windows 11 Enterprise multisession, hôtes de session joints à Microsoft Entra |
        | HP-Lab | Pool d'hôtes personnel | 60 scientifiques de laboratoire, Windows 11 Enterprise, hôtes de session joints à Microsoft Entra, attribution automatique |
        | HP-Trials | Pool d'hôtes personnel | 12 analystes des essais cliniques, Windows 11 Enterprise, hôtes de session joints à Microsoft Entra |
        | WS-Trey | Espace de travail | Contient les groupes d'applications des trois pools d'hôtes |
        | WS-Discovery | Espace de travail | Ne contient aucun groupe d'applications |
        | stprofilestrey | Compte de stockage | Partages de fichiers Premium, partage **profiles** pour les conteneurs de profils FSLogix de HP-Office |

        Le logiciel de pilotage des instruments installé sur les hôtes de session de HP-Lab écrit les données d'acquisition sur le disque de données de chaque machine virtuelle. Les hôtes de session de HP-Lab sont désalloués en dehors des heures de travail.
  - key: requirements
    title: { en: "Requirements", fr: "Exigences" }
    body:
      en: |
        Trey Research identifies the following requirements:

        1. Users must sign in to the session hosts by using single sign-on (SSO) with their Microsoft Entra identity.
        2. The FSLogix profile containers of HP-Office must be stored in the **profiles** share and accessed by using Microsoft Entra Kerberos. No domain controller must be deployed in Azure.
        3. Feed discovery, feed download and remote sessions must use private endpoints in snet-endpoints over ExpressRoute only. Session hosts must also reach the service through private endpoints.
        4. The memory of the HP-Trials session hosts must be encrypted with keys that the hypervisor and the host operating system cannot read.
        5. When a scientist connects to HP-Lab outside working hours, the assigned session host must start automatically. Permissions must follow the principle of least privilege.
        6. If the West Europe region fails, the HP-Lab session hosts, including their acquisition data, must be recoverable in North Europe with a recovery point objective (RPO) of 15 minutes or less.
        7. Administrative effort must be minimized.
      fr: |
        Trey Research a défini les exigences suivantes :

        1. Les utilisateurs doivent se connecter aux hôtes de session par authentification unique (SSO) avec leur identité Microsoft Entra.
        2. Les conteneurs de profils FSLogix de HP-Office doivent être stockés dans le partage **profiles** et accessibles avec Microsoft Entra Kerberos. Aucun contrôleur de domaine ne doit être déployé dans Azure.
        3. La découverte du flux, le téléchargement du flux et les sessions à distance doivent utiliser uniquement des points de terminaison privés de snet-endpoints, via ExpressRoute. Les hôtes de session doivent eux aussi joindre le service par des points de terminaison privés.
        4. La mémoire des hôtes de session de HP-Trials doit être chiffrée avec des clés que l'hyperviseur et le système d'exploitation hôte ne peuvent pas lire.
        5. Quand un scientifique se connecte à HP-Lab en dehors des heures de travail, l'hôte de session qui lui est attribué doit démarrer automatiquement. Les autorisations doivent respecter le principe du moindre privilège.
        6. En cas de défaillance de la région West Europe, les hôtes de session de HP-Lab, données d'acquisition comprises, doivent pouvoir être récupérés dans la région North Europe avec un objectif de point de récupération (RPO) de 15 minutes au plus.
        7. L'effort d'administration doit être réduit au minimum.
