id: az140-cs3c-relecloud
status: draft
title:
  en: |
    Relecloud
  fr: |
    Relecloud
tabs:
  - key: overview
    title: { en: "Overview", fr: "Vue d'ensemble" }
    body:
      en: |
        Relecloud is an engineering and architecture firm that designs bridges and public buildings. It has 650 employees: 250 designers who work with 3D modeling (BIM) applications and 400 project and support staff. Its offices are in Rotterdam, Antwerp and Glasgow, and many employees work from home.

        Relecloud is moving all its users to Azure Virtual Desktop and wants the service to stay available if an Azure region fails.
      fr: |
        Relecloud est un cabinet d'ingénierie et d'architecture qui conçoit des ponts et des bâtiments publics. Il compte 650 employés : 250 concepteurs qui travaillent avec des applications de modélisation 3D (BIM) et 400 chefs de projet et membres du personnel de support. Ses bureaux se trouvent à Rotterdam, Anvers et Glasgow, et de nombreux employés travaillent à domicile.

        Relecloud migre tous ses utilisateurs vers Azure Virtual Desktop et souhaite que le service reste disponible en cas de défaillance d'une région Azure.
  - key: existing
    title: { en: "Existing environment", fr: "Environnement existant" }
    body:
      en: |
        **Identity.** The AD DS domain relecloud.com has domain controllers in a hub virtual network in West Europe and in North Europe. Microsoft Entra Connect Sync synchronizes the users to Microsoft Entra ID. Device synchronization and Microsoft Entra hybrid join aren't configured.

        **Network.** The three offices connect to the hub virtual networks through ExpressRoute private peering. Home workers connect over the internet.

        **Azure Virtual Desktop (pilot).**

        | Resource | Region | Configuration |
        | --- | --- | --- |
        | HP-CAD-WEU | West Europe | Pooled host pool for designers, session hosts joined to the AD DS domain only, subnet **snet-cad** protected by the NSG **nsg-cad** |
        | HP-CAD-NEU | North Europe | Pooled host pool for designers, same configuration, currently empty |
        | HP-Staff-WEU | West Europe | Pooled host pool for project and support staff, session hosts joined to the AD DS domain only |
        | anf-relecloud-weu | West Europe | NetApp account with a 4-TiB Premium capacity pool; delegated subnet **snet-anf** in the spoke virtual network |
        | anf-relecloud-neu | North Europe | NetApp account with a 4-TiB Premium capacity pool; delegated subnet **snet-anf** in the spoke virtual network |
        | law-avd | West Europe | Log Analytics workspace |

        During the pilot, the session hosts of HP-CAD-WEU use general purpose VMs, and designers report slow 3D rendering.
      fr: |
        **Identité.** Le domaine AD DS relecloud.com dispose de contrôleurs de domaine dans un réseau virtuel hub en West Europe et en North Europe. Microsoft Entra Connect Sync synchronise les utilisateurs vers Microsoft Entra ID. La synchronisation des appareils et la jonction Microsoft Entra hybride ne sont pas configurées.

        **Réseau.** Les trois bureaux sont reliés aux réseaux virtuels hub par le peering privé ExpressRoute. Les employés à domicile se connectent par Internet.

        **Azure Virtual Desktop (pilote).**

        | Ressource | Région | Configuration |
        | --- | --- | --- |
        | HP-CAD-WEU | West Europe | Pool d'hôtes regroupé (pooled) pour les concepteurs, hôtes de session joints uniquement au domaine AD DS, sous-réseau **snet-cad** protégé par le groupe de sécurité réseau **nsg-cad** |
        | HP-CAD-NEU | North Europe | Pool d'hôtes regroupé (pooled) pour les concepteurs, même configuration, actuellement vide |
        | HP-Staff-WEU | West Europe | Pool d'hôtes regroupé (pooled) pour les chefs de projet et le personnel de support, hôtes de session joints uniquement au domaine AD DS |
        | anf-relecloud-weu | West Europe | Compte NetApp avec un pool de capacité Premium de 4 Tio ; sous-réseau délégué **snet-anf** dans le réseau virtuel spoke |
        | anf-relecloud-neu | North Europe | Compte NetApp avec un pool de capacité Premium de 4 Tio ; sous-réseau délégué **snet-anf** dans le réseau virtuel spoke |
        | law-avd | West Europe | Espace de travail Log Analytics |

        Pendant le pilote, les hôtes de session de HP-CAD-WEU utilisent des machines virtuelles à usage général, et les concepteurs signalent un rendu 3D lent.
  - key: requirements
    title: { en: "Requirements", fr: "Exigences" }
    body:
      en: |
        Relecloud identifies the following requirements:

        1. The designers' session hosts must provide GPU-accelerated rendering of the BIM applications and HEVC/H.265 frame encoding.
        2. The FSLogix profile containers of the designers must be stored on SMB volumes in Azure NetApp Files, one volume in each region.
        3. Profile data must be written to both regions without relying on storage replication. On the HP-CAD-WEU session hosts, the West Europe volume must be used first. The local cache must be removed from the session host when a user signs out.
        4. Users in the offices must use RDP Shortpath for managed networks with a direct UDP connection to the session hosts. Home workers must use RDP Shortpath for public networks.
        5. Administrators must use Azure Virtual Desktop Insights to analyze connections and session host performance, with data stored in law-avd.
        6. Users must sign in to the session hosts by using Microsoft Entra single sign-on (SSO). The session hosts must remain members of the relecloud.com domain, because the BIM license server only accepts domain computers.
      fr: |
        Relecloud a défini les exigences suivantes :

        1. Les hôtes de session des concepteurs doivent fournir le rendu accéléré par GPU des applications BIM et l'encodage des images en HEVC/H.265.
        2. Les conteneurs de profils FSLogix des concepteurs doivent être stockés sur des volumes SMB Azure NetApp Files, un volume dans chaque région.
        3. Les données de profil doivent être écrites dans les deux régions sans dépendre de la réplication du stockage. Sur les hôtes de session de HP-CAD-WEU, le volume de West Europe doit être utilisé en premier. Le cache local doit être supprimé de l'hôte de session quand un utilisateur ferme sa session.
        4. Les utilisateurs des bureaux doivent utiliser RDP Shortpath pour les réseaux managés avec une connexion UDP directe vers les hôtes de session. Les employés à domicile doivent utiliser RDP Shortpath pour les réseaux publics.
        5. Les administrateurs doivent utiliser Azure Virtual Desktop Insights pour analyser les connexions et les performances des hôtes de session, avec des données stockées dans law-avd.
        6. Les utilisateurs doivent se connecter aux hôtes de session avec l'authentification unique (SSO) Microsoft Entra. Les hôtes de session doivent rester membres du domaine relecloud.com, car le serveur de licences BIM n'accepte que les ordinateurs du domaine.
