id: az140-cs4b-proseware
status: draft
title:
  en: |
    Proseware, Inc.
  fr: |
    Proseware, Inc.
tabs:
  - key: overview
    title: { en: "Overview", fr: "Vue d'ensemble" }
    body:
      en: |
        Proseware, Inc. is a software publisher based in Seattle that develops project management tools. It has 220 employees, including 120 developers. About 80 external contractors test Proseware products from their own devices.

        Proseware already provides Azure Virtual Desktop to the contractors and is adding personal desktops for the developers.
      fr: |
        Proseware, Inc. est un éditeur de logiciels basé à Seattle qui développe des outils de gestion de projet. Il compte 220 employés, dont 120 développeurs. Environ 80 prestataires externes testent les produits de Proseware depuis leurs propres appareils.

        Proseware fournit déjà Azure Virtual Desktop aux prestataires et ajoute des bureaux personnels pour les développeurs.
  - key: existing
    title: { en: "Existing environment", fr: "Environnement existant" }
    body:
      en: |
        **Identity.** Proseware uses a cloud-only Microsoft Entra tenant. There is no AD DS domain and no Microsoft Entra Domain Services. Every user signs in with a FIDO2 security key, and the FIDO2 security key authentication method is enabled for all users in Microsoft Entra ID. Microsoft Intune manages the devices of the employees.

        **Azure Virtual Desktop.** All resources are in the East US 2 region.

        | Resource | Configuration |
        | --- | --- |
        | HP-Contractors | Pooled host pool in the resource group **RG-AVD**, Windows 11 Enterprise multi-session, four Microsoft Entra joined session hosts named SH-CTR-0 to SH-CTR-3, RemoteApp application group |
        | RG-AVD-Dev | Empty resource group for the developer resources |
        | stproseapps | Storage account with an Azure Files share named **appattach** |

        The custom RDP properties of HP-Contractors are:

        `enablerdsaadauth:i:1;redirectwebauthn:i:0;drivestoredirect:s:;redirectclipboard:i:0`

        **Image of HP-Contractors.** Microsoft 365 Apps is installed by using the Office Deployment Tool, without OneDrive. The OneDrive sync app is installed per-machine and starts at sign-in for all users. The `SilentAccountConfig` value is set to 1 under `HKLM\SOFTWARE\Policies\Microsoft\OneDrive`.

        **DevTool.** The tools team distributes an internal test application named DevTool as a Win32 installer, DevToolSetup.exe. Proseware has a code-signing certificate issued by a public certification authority.
      fr: |
        **Identité.** Proseware utilise un locataire Microsoft Entra uniquement cloud. Il n'y a ni domaine AD DS ni Microsoft Entra Domain Services. Chaque utilisateur se connecte avec une clé de sécurité FIDO2, et la méthode d'authentification par clé de sécurité FIDO2 est activée pour tous les utilisateurs dans Microsoft Entra ID. Microsoft Intune gère les appareils des employés.

        **Azure Virtual Desktop.** Toutes les ressources se trouvent dans la région East US 2.

        | Ressource | Configuration |
        | --- | --- |
        | HP-Contractors | Pool d'hôtes regroupé (pooled) dans le groupe de ressources **RG-AVD**, Windows 11 Entreprise multisession, quatre hôtes de session joints à Microsoft Entra nommés SH-CTR-0 à SH-CTR-3, groupe d'applications RemoteApp |
        | RG-AVD-Dev | Groupe de ressources vide pour les ressources des développeurs |
        | stproseapps | Compte de stockage avec un partage Azure Files nommé **appattach** |

        Les propriétés RDP personnalisées de HP-Contractors sont :

        `enablerdsaadauth:i:1;redirectwebauthn:i:0;drivestoredirect:s:;redirectclipboard:i:0`

        **Image de HP-Contractors.** Microsoft 365 Apps est installé avec l'outil de déploiement d'Office (Office Deployment Tool), sans OneDrive. L'application de synchronisation OneDrive est installée par ordinateur et démarre à la connexion pour tous les utilisateurs. La valeur `SilentAccountConfig` est définie sur 1 sous `HKLM\SOFTWARE\Policies\Microsoft\OneDrive`.

        **DevTool.** L'équipe outils distribue une application de test interne nommée DevTool sous la forme d'un programme d'installation Win32, DevToolSetup.exe. Proseware dispose d'un certificat de signature de code émis par une autorité de certification publique.
  - key: requirements
    title: { en: "Requirements", fr: "Exigences" }
    body:
      en: |
        Proseware identifies the following requirements:

        1. **Developer desktops.** A personal host pool named HP-Dev must be created in RG-AVD-Dev by using Azure PowerShell. Developers must get a full desktop. Each developer must be assigned a personal desktop automatically the first time they connect, and a deallocated desktop must start when its developer connects.
        2. **Passwordless in the session.** Contractors must be able to sign in to Proseware web apps inside their RemoteApp sessions by using their FIDO2 security keys. The other RDP settings of HP-Contractors must stay unchanged.
        3. **DevTool.** DevTool must be delivered to HP-Contractors by using App attach from the appattach share, without installing it in the image. The disk image must use the format that mounts fastest and uses the least CPU and memory on Windows 11 session hosts.
        4. **OneDrive.** On HP-Contractors, the Desktop, Documents and Pictures folders of the users must be redirected to OneDrive without any prompt.
        5. **Maintenance.** Before maintenance windows, the platform team must prevent new connections to the session host being patched. Contractors already connected to it must be warned and must be able to save their work and sign out themselves.
      fr: |
        Proseware a défini les exigences suivantes :

        1. **Bureaux des développeurs.** Un pool d'hôtes personnel nommé HP-Dev doit être créé dans RG-AVD-Dev avec Azure PowerShell. Les développeurs doivent disposer d'un bureau complet. Chaque développeur doit se voir attribuer automatiquement un bureau personnel lors de sa première connexion, et un bureau désalloué doit démarrer quand son développeur se connecte.
        2. **Sans mot de passe dans la session.** Les prestataires doivent pouvoir se connecter aux applications web de Proseware dans leurs sessions RemoteApp avec leurs clés de sécurité FIDO2. Les autres paramètres RDP de HP-Contractors doivent rester inchangés.
        3. **DevTool.** DevTool doit être distribué à HP-Contractors avec App attach depuis le partage appattach, sans être installé dans l'image. L'image disque doit utiliser le format qui se monte le plus vite et consomme le moins de processeur et de mémoire sur des hôtes de session Windows 11.
        4. **OneDrive.** Sur HP-Contractors, les dossiers Bureau, Documents et Images des utilisateurs doivent être redirigés vers OneDrive sans aucune invite.
        5. **Maintenance.** Avant les fenêtres de maintenance, l'équipe plateforme doit empêcher les nouvelles connexions à l'hôte de session en cours de mise à jour. Les prestataires déjà connectés à cet hôte doivent être avertis et pouvoir enregistrer leur travail et fermer leur session eux-mêmes.
