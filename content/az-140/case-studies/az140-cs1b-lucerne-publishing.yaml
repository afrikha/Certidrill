id: az140-cs1b-lucerne-publishing
status: draft
title:
  en: Lucerne Publishing
  fr: Lucerne Publishing
tabs:
  - key: overview
    title: { en: "Overview", fr: "Vue d'ensemble" }
    body:
      en: |
        Lucerne Publishing publishes illustrated books and magazines. It has studios in Montreal and Lyon and 140 designers and editors, many of whom work from home.

        The designers use GPU-intensive layout and 3D software. Lucerne gives each designer a personal desktop in Azure Virtual Desktop and wants to improve sign-in security and reduce compute costs.
      fr: |
        Lucerne Publishing publie des livres illustrés et des magazines. L'entreprise possède des studios à Montréal et à Lyon et compte 140 graphistes et éditeurs, dont beaucoup travaillent à domicile.

        Les graphistes utilisent des logiciels de mise en page et de 3D qui sollicitent fortement le GPU. Lucerne fournit à chaque graphiste un bureau personnel dans Azure Virtual Desktop et veut renforcer la sécurité de connexion et réduire les coûts de calcul.
  - key: existing
    title: { en: "Existing environment", fr: "Environnement existant" }
    body:
      en: |
        Lucerne has no on-premises Active Directory. All user accounts are cloud-only accounts in a Microsoft Entra tenant named **lucernepublishing.com**, and every user has a Microsoft 365 E5 license. The users' laptops run Windows 11 and are Microsoft Entra joined and managed by Microsoft Intune. Security defaults and per-user MFA are disabled.

        | Resource | Type | Configuration |
        | --- | --- | --- |
        | HP-Design | Host pool | Personal, assignment type **Automatic**, no session host configuration, Start VM on Connect disabled, Canada Central |
        | vm-design-01 to vm-design-60 | Session hosts | Windows 11 Enterprise, NVadsA10 v5 series, Trusted Launch, Microsoft Entra joined, enrolled in Intune, resource group **RG-AVD-Hosts** in Canada Central |
        | HP-Design-DAG | Desktop application group | Assigned to the group **Designers** |
        | CA-AVD | Conditional Access policy | Targets the Azure Virtual Desktop app for Designers, requires multifactor authentication, sign-in frequency 8 hours |
        | RSV-Design | Recovery Services vault | Canada Central, no protected items |

        The group **LP-Admins** contains the desktop support technicians. Single sign-on is not configured for HP-Design.
      fr: |
        Lucerne ne dispose d'aucun Active Directory local. Tous les comptes d'utilisateur sont des comptes cloud uniquement dans un locataire Microsoft Entra nommé **lucernepublishing.com**, et chaque utilisateur dispose d'une licence Microsoft 365 E5. Les ordinateurs portables des utilisateurs exécutent Windows 11, sont joints à Microsoft Entra et sont gérés par Microsoft Intune. Les paramètres de sécurité par défaut et l'authentification multifacteur par utilisateur sont désactivés.

        | Ressource | Type | Configuration |
        | --- | --- | --- |
        | HP-Design | Pool d'hôtes | Personnel, type d'attribution **Automatic**, sans configuration d'hôte de session, Start VM on Connect désactivé, Canada Central |
        | vm-design-01 à vm-design-60 | Hôtes de session | Windows 11 Entreprise, série NVadsA10 v5, lancement fiable (Trusted Launch), joints à Microsoft Entra, inscrits dans Intune, groupe de ressources **RG-AVD-Hosts** dans la région Canada Central |
        | HP-Design-DAG | Groupe d'applications de bureau | Attribué au groupe **Designers** |
        | CA-AVD | Stratégie d'accès conditionnel | Cible l'application Azure Virtual Desktop pour Designers, exige l'authentification multifacteur, fréquence de connexion de 8 heures |
        | RSV-Design | Coffre Recovery Services | Canada Central, aucun élément protégé |

        Le groupe **LP-Admins** contient les techniciens du support poste de travail. L'authentification unique n'est pas configurée pour HP-Design.
  - key: requirements
    title: { en: "Requirements", fr: "Exigences" }
    body:
      en: |
        Lucerne identifies the following requirements:

        1. **Access.** Members of Designers must be able to sign in to the session hosts. Members of LP-Admins must be local administrators of the session hosts. Follow the principle of least privilege.
        2. **Single sign-on.** After they authenticate to Azure Virtual Desktop, users must not be prompted again for credentials by the session host. A consent prompt the first time a user connects to a session host is acceptable.
        3. **MFA.** When single sign-on is enabled, users must perform multifactor authentication each time they open a connection to a session host. Refreshing the feed must not prompt users more often than today.
        4. **Assignment.** From now on, an administrator must assign each personal desktop before the user can connect. A new designer, Designer1, must receive vm-design-07.
        5. **Costs.** Desktops that stay disconnected for 60 minutes must be deallocated, and a deallocated desktop must start automatically when its user connects. The Azure Virtual Desktop service principal will be used for power management.
        6. **Backup.** Back up every personal desktop every 4 hours by using RSV-Design.
        7. Administrative effort must be minimized.
      fr: |
        Lucerne a défini les exigences suivantes :

        1. **Accès.** Les membres de Designers doivent pouvoir se connecter aux hôtes de session. Les membres de LP-Admins doivent être administrateurs locaux des hôtes de session. Appliquer le principe du moindre privilège.
        2. **Authentification unique.** Après s'être authentifiés auprès d'Azure Virtual Desktop, les utilisateurs ne doivent pas être invités à nouveau à saisir leurs informations d'identification par l'hôte de session. Une invite de consentement la première fois qu'un utilisateur se connecte à un hôte de session est acceptable.
        3. **MFA.** Quand l'authentification unique est activée, les utilisateurs doivent effectuer une authentification multifacteur chaque fois qu'ils ouvrent une connexion à un hôte de session. L'actualisation du flux ne doit pas solliciter les utilisateurs plus souvent qu'aujourd'hui.
        4. **Attribution.** Désormais, un administrateur doit attribuer chaque bureau personnel avant que l'utilisateur puisse se connecter. Un nouveau graphiste, Designer1, doit recevoir vm-design-07.
        5. **Coûts.** Les bureaux qui restent déconnectés pendant 60 minutes doivent être libérés (deallocated), et un bureau libéré doit démarrer automatiquement quand son utilisateur se connecte. Le principal de service Azure Virtual Desktop sera utilisé pour la gestion de l'alimentation.
        6. **Sauvegarde.** Sauvegarder chaque bureau personnel toutes les 4 heures à l'aide de RSV-Design.
        7. L'effort d'administration doit être réduit au minimum.
