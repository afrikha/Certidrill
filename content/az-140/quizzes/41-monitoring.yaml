chapter: 41-monitoring
questions:
  # ------------------------------------------------------------------ 1
  - id: az140-qz-41-01
    objective: "4.1.1"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        You add 10 new virtual machines to an Azure Virtual Desktop host pool named **HP1**. Some of them never become available to users.

        You need a Log Analytics workspace named **LAW1** to show, for each new VM, whether the Azure Virtual Desktop service accepted it as a session host of HP1 when its agent connected.

        Which category should you select in the diagnostic setting of HP1?
      fr: |
        Vous ajoutez 10 nouvelles machines virtuelles à un pool d'hôtes Azure Virtual Desktop nommé **HP1**. Certaines d'entre elles ne deviennent jamais disponibles pour les utilisateurs.

        Vous avez besoin qu'un espace de travail Log Analytics nommé **LAW1** indique, pour chaque nouvelle machine virtuelle, si le service Azure Virtual Desktop l'a acceptée comme hôte de session de HP1 quand son agent s'est connecté.

        Quelle catégorie devez-vous sélectionner dans le paramètre de diagnostic de HP1 ?
    body:
      options:
        - { id: a, text: Agent Health Status }
        - { id: b, text: Host registration }
        - { id: c, text: Session Host Management Activity }
        - { id: d, text: Management Activities }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          The Host registration category records whether a session host successfully registered with the Azure Virtual Desktop service when it connected. It's one of the host pool categories that Azure Virtual Desktop Insights needs, and its records show which new VMs were never accepted as session hosts.
        fr: |
          La catégorie Host registration enregistre si un hôte de session s'est bien inscrit auprès du service Azure Virtual Desktop lors de sa connexion. C'est l'une des catégories du pool d'hôtes dont Azure Virtual Desktop Insights a besoin, et ses enregistrements montrent quelles nouvelles machines virtuelles n'ont jamais été acceptées comme hôtes de session.
      options:
        a: { en: "Agent Health Status reports the health and status of the Azure Virtual Desktop agent on each session host, not the result of its registration with the service.", fr: "Agent Health Status indique l'intégrité et l'état de l'agent Azure Virtual Desktop sur chaque hôte de session, pas le résultat de son inscription auprès du service." }
        c: { en: "Session Host Management Activity records management activity on the session hosts, not whether a VM registered with the service.", fr: "Session Host Management Activity enregistre l'activité de gestion sur les hôtes de session, pas l'inscription d'une machine virtuelle auprès du service." }
        d: { en: "Management Activities records the changes made to Azure Virtual Desktop objects through the APIs or PowerShell, and whether they succeeded.", fr: "Management Activities enregistre les modifications faites aux objets Azure Virtual Desktop par les API ou PowerShell, et leur réussite." }
    references:
      - title: Send diagnostic data to Log Analytics for Azure Virtual Desktop
        url: https://learn.microsoft.com/en-us/azure/virtual-desktop/diagnostics-log-analytics

  # ------------------------------------------------------------------ 2
  - id: az140-qz-41-02
    objective: "4.1.3"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        In March, an administrator at Fabrikam opened Azure Virtual Desktop Insights, saved a copy as a workbook named **AVD-Ops** to keep the team's favorite settings, and customized it.

        In September, Microsoft adds a new report to Azure Virtual Desktop Insights. The administrators who open AVD-Ops don't see the new report.

        What explains this?
      fr: |
        En mars, un administrateur de Fabrikam a ouvert Azure Virtual Desktop Insights, en a enregistré une copie comme workbook nommé **AVD-Ops** pour conserver les paramètres favoris de l'équipe, puis l'a personnalisée.

        En septembre, Microsoft ajoute un nouveau rapport à Azure Virtual Desktop Insights. Les administrateurs qui ouvrent AVD-Ops ne voient pas le nouveau rapport.

        Qu'est-ce qui explique ce résultat ?
    body:
      options:
        - { id: a, text: { en: "Log data needs up to 15 minutes to appear, so AVD-Ops shows the new report after its next refresh.", fr: "Les données de journal mettent jusqu'à 15 minutes à apparaître : AVD-Ops affichera le nouveau rapport après sa prochaine actualisation." } }
        - { id: b, text: { en: "A report that Microsoft adds is displayed only to users who hold the Workbook Contributor role on AVD-Ops.", fr: "Un rapport ajouté par Microsoft n'est affiché qu'aux utilisateurs qui détiennent le rôle Workbook Contributor sur AVD-Ops." } }
        - { id: c, text: { en: "A custom copy of the Insights template doesn't automatically adopt the updates that Microsoft publishes.", fr: "Une copie personnalisée du modèle Insights n'adopte pas automatiquement les mises à jour publiées par Microsoft." } }
        - { id: d, text: { en: "New reports appear only after you run the configuration workbook again for the host pools of AVD-Ops.", fr: "Les nouveaux rapports n'apparaissent qu'après une nouvelle exécution du workbook de configuration pour les pools d'hôtes d'AVD-Ops." } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          Insights is built on Azure Monitor workbooks: you can save a copy of the template and customize it, and saving favorite settings also requires such a copy. By design, custom copies don't automatically adopt the updates that the product group publishes to the template, so AVD-Ops keeps the reports it had in March.
        fr: |
          Insights repose sur des workbooks Azure Monitor : vous pouvez enregistrer une copie du modèle et la personnaliser, et l'enregistrement de paramètres favoris exige aussi une telle copie. Par conception, les copies personnalisées n'adoptent pas automatiquement les mises à jour que l'équipe produit publie dans le modèle : AVD-Ops conserve donc les rapports qu'il avait en mars.
      options:
        a: { en: "The 15-minute latency delays the data shown in existing reports; it never adds a report to a saved copy.", fr: "La latence de 15 minutes retarde les données des rapports existants ; elle n'ajoute jamais de rapport à une copie enregistrée." }
        b: { en: "Workbook Contributor lets a user save shared workbooks; viewing a report only needs read access to the data it queries.", fr: "Workbook Contributor permet d'enregistrer des workbooks partagés ; consulter un rapport n'exige qu'un accès en lecture aux données qu'il interroge." }
        d: { en: "The configuration workbook deploys diagnostic settings and session host data collection; it doesn't change the content of a saved workbook.", fr: "Le workbook de configuration déploie les paramètres de diagnostic et la collecte des données des hôtes de session ; il ne modifie pas le contenu d'un workbook enregistré." }
    references:
      - title: Troubleshoot Azure Virtual Desktop Insights
        url: https://learn.microsoft.com/en-us/azure/virtual-desktop/troubleshoot-insights

  # ------------------------------------------------------------------ 3
  - id: az140-qz-41-03
    objective: "4.1.6"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        You manage a pooled host pool named **hp-sales** in a resource group named **rg-avd**. A user reports that Windows App stopped responding while their session on **sh-3.contoso.com**, with the session ID 4, was open. Several documents with unsaved changes are open in that session.

        You need to end the user's current connection so that the user can connect again and find the open documents in the same session.

        Which command should you run?
      fr: |
        Vous gérez un pool d'hôtes regroupé nommé **hp-sales** dans un groupe de ressources nommé **rg-avd**. Un utilisateur signale que Windows App a cessé de répondre alors que sa session sur **sh-3.contoso.com**, d'ID de session 4, était ouverte. Plusieurs documents contenant des modifications non enregistrées sont ouverts dans cette session.

        Vous devez mettre fin à la connexion actuelle de l'utilisateur pour qu'il puisse se reconnecter et retrouver les documents ouverts dans la même session.

        Quelle commande devez-vous exécuter ?
    body:
      options:
        - { id: a, text: "`Remove-AzWvdUserSession`" }
        - { id: b, text: "`Update-AzWvdSessionHost`" }
        - { id: c, text: "`Send-AzWvdUserSessionMessage`" }
        - { id: d, text: "`Disconnect-AzWvdUserSession`" }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          `Disconnect-AzWvdUserSession` disconnects a user session on a session host without signing the user out. The session and its applications keep running on sh-3.contoso.com, so the user returns to the same session, with the open documents, at the next connection.
        fr: |
          `Disconnect-AzWvdUserSession` déconnecte une session utilisateur d'un hôte de session sans fermer la session. La session et ses applications continuent de s'exécuter sur sh-3.contoso.com : l'utilisateur retrouve la même session, avec les documents ouverts, à sa prochaine connexion.
      options:
        a: { en: "`Remove-AzWvdUserSession` signs the user out: the session ends on the session host and the unsaved changes are lost.", fr: "`Remove-AzWvdUserSession` ferme la session de l'utilisateur : elle se termine sur l'hôte de session et les modifications non enregistrées sont perdues." }
        b: { en: "`Update-AzWvdSessionHost` changes the properties of a session host, such as drain mode with `-AllowNewSession`; it doesn't act on an existing session.", fr: "`Update-AzWvdSessionHost` modifie les propriétés d'un hôte de session, comme le mode drainage avec `-AllowNewSession` ; il n'agit pas sur une session existante." }
        c: { en: "`Send-AzWvdUserSessionMessage` only displays a message in the session; the frozen connection stays as it is.", fr: "`Send-AzWvdUserSessionMessage` ne fait qu'afficher un message dans la session ; la connexion bloquée reste en l'état." }
    references:
      - title: Disconnect-AzWvdUserSession (Az.DesktopVirtualization)
        url: https://learn.microsoft.com/en-us/powershell/module/az.desktopvirtualization/disconnect-azwvdusersession
      - title: Built-in Azure RBAC roles for Azure Virtual Desktop
        url: https://learn.microsoft.com/en-us/azure/virtual-desktop/rbac

  # ------------------------------------------------------------------ 4
  - id: az140-qz-41-04
    objective: "4.1.5"
    difficulty: 2
    status: draft
    type: single
    shuffle: false
    stem:
      en: |
        Tailspin Toys has a pooled host pool named **HP1** that contains nine session hosts. A power management scaling plan is assigned to HP1. In the off-peak phase of the plan, the minimum percentage of hosts is 15 percent. None of the session hosts has the exclusion tag of the plan.

        At 23:00, during the off-peak phase, no user has a session on HP1.

        How many session hosts does autoscale keep running?
      fr: |
        Tailspin Toys dispose d'un pool d'hôtes regroupé nommé **HP1** qui contient neuf hôtes de session. Un plan de mise à l'échelle de type gestion de l'alimentation est attribué à HP1. Pendant la phase des heures creuses (off-peak) du plan, le pourcentage minimal d'hôtes est de 15 %. Aucun des hôtes de session ne porte l'étiquette d'exclusion du plan.

        À 23 h 00, pendant les heures creuses, aucun utilisateur n'a de session sur HP1.

        Combien d'hôtes de session la mise à l'échelle automatique maintient-elle en marche ?
    body:
      options:
        - { id: a, text: "1" }
        - { id: b, text: "2" }
        - { id: c, text: "3" }
        - { id: d, text: "4" }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          The minimum percentage of hosts sets how many session hosts stay available in the phase, whatever the load. 15 percent of nine hosts is 1.35, and autoscale rounds a value that isn't a whole number up to the next whole number, so two session hosts keep running.
        fr: |
          Le pourcentage minimal d'hôtes fixe le nombre d'hôtes de session qui restent disponibles pendant la phase, quelle que soit la charge. 15 % de neuf hôtes donne 1,35, et la mise à l'échelle automatique arrondit une valeur non entière au nombre entier supérieur : deux hôtes de session restent en marche.
      options:
        a: { en: "One host would be the result of rounding 1.35 down; autoscale always rounds the minimum up.", fr: "Un hôte correspondrait à un arrondi de 1,35 à l'entier inférieur ; la mise à l'échelle automatique arrondit toujours le minimum au supérieur." }
        c: { en: "Three hosts would be kept with a minimum percentage above about 22 percent, for example 25 percent of nine hosts (2.25, rounded up to 3).", fr: "Trois hôtes seraient maintenus avec un pourcentage minimal supérieur à 22 % environ, par exemple 25 % de neuf hôtes (2,25, arrondi à 3)." }
        d: { en: "Four hosts would require a minimum percentage above about 33 percent; with no session, no host is started for capacity.", fr: "Quatre hôtes exigeraient un pourcentage minimal supérieur à 33 % environ ; sans aucune session, aucun hôte n'est démarré pour la capacité." }
    references:
      - title: Create and assign an autoscale scaling plan for Azure Virtual Desktop
        url: https://learn.microsoft.com/en-us/azure/virtual-desktop/autoscale-scaling-plan
      - title: Autoscale scaling plans and example scenarios in Azure Virtual Desktop
        url: https://learn.microsoft.com/en-us/azure/virtual-desktop/autoscale-scenarios

  # ------------------------------------------------------------------ 5
  - id: az140-qz-41-05
    objective: "4.1.2"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Woodgrove Bank is deploying a pooled host pool named **HP-Branch** that will contain 1,400 session hosts, created by an Azure Resource Manager (ARM) template. The diagnostic settings of HP-Branch and of its workspace already send the categories that Azure Virtual Desktop Insights needs to a Log Analytics workspace named **LAW-AVD**. A data collection rule named **DCR-AVD** that uses the recommended Insights configuration and targets LAW-AVD already exists.

        You need every session host of HP-Branch to send the Insights performance counters and Windows event logs to LAW-AVD.

        What should you do?
      fr: |
        Woodgrove Bank déploie un pool d'hôtes regroupé nommé **HP-Branch** qui contiendra 1 400 hôtes de session, créés par un modèle Azure Resource Manager (ARM). Les paramètres de diagnostic de HP-Branch et de son espace de travail envoient déjà les catégories dont Azure Virtual Desktop Insights a besoin vers un espace de travail Log Analytics nommé **LAW-AVD**. Une règle de collecte de données nommée **DCR-AVD**, qui utilise la configuration Insights recommandée et cible LAW-AVD, existe déjà.

        Vous devez faire en sorte que chaque hôte de session de HP-Branch envoie les compteurs de performances et les journaux d'événements Windows d'Insights vers LAW-AVD.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "In the configuration workbook of HP-Branch, select Deploy association, Add extension and Add system managed identity.", fr: "Dans le workbook de configuration de HP-Branch, sélectionner Deploy association, Add extension et Add system managed identity." } }
        - { id: b, text: { en: "Add the Azure Monitor Agent and a system-assigned managed identity to the ARM template, and associate the hosts with DCR-AVD.", fr: "Ajouter l'agent Azure Monitor et une identité managée affectée par le système au modèle ARM, puis associer les hôtes à DCR-AVD." } }
        - { id: c, text: { en: "Add the Log Analytics agent to the ARM template, and connect each session host to LAW-AVD with the workspace ID and key.", fr: "Ajouter l'agent Log Analytics au modèle ARM, puis connecter chaque hôte de session à LAW-AVD avec l'ID et la clé de l'espace de travail." } }
        - { id: d, text: { en: "Add the Network and Connection Graphics categories to the diagnostic setting of HP-Branch that targets LAW-AVD.", fr: "Ajouter les catégories Network et Connection Graphics au paramètre de diagnostic de HP-Branch qui cible LAW-AVD." } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          The automated deployment from the Insights configuration workbook supports up to 1,000 session hosts. For larger host pools, Microsoft recommends installing the Azure Monitor Agent when you create the session hosts with an ARM template; the agent needs a managed identity, and the association with DCR-AVD tells it which counters and events to send to LAW-AVD.
        fr: |
          Le déploiement automatisé depuis le workbook de configuration d'Insights prend en charge jusqu'à 1 000 hôtes de session. Pour des pools d'hôtes plus grands, Microsoft recommande d'installer l'agent Azure Monitor à la création des hôtes de session par un modèle ARM ; l'agent a besoin d'une identité managée, et l'association à DCR-AVD lui indique quels compteurs et événements envoyer vers LAW-AVD.
      options:
        a: { en: "The automated deployment of the configuration workbook is limited to 1,000 session hosts or fewer, and HP-Branch will have 1,400.", fr: "Le déploiement automatisé du workbook de configuration est limité à 1 000 hôtes de session au plus, et HP-Branch en aura 1 400." }
        c: { en: "The Log Analytics agent is retired; Insights collects session host data through the Azure Monitor Agent and a data collection rule.", fr: "L'agent Log Analytics est retiré ; Insights collecte les données des hôtes de session par l'agent Azure Monitor et une règle de collecte de données." }
        d: { en: "Diagnostic settings send service logs to the WVD tables; they never collect the performance counters or event logs of the session hosts.", fr: "Les paramètres de diagnostic envoient les journaux du service vers les tables WVD ; ils ne collectent jamais les compteurs de performances ni les journaux d'événements des hôtes de session." }
    references:
      - title: Enable Insights to monitor Azure Virtual Desktop
        url: https://learn.microsoft.com/en-us/azure/virtual-desktop/insights

  # ------------------------------------------------------------------ 6
  - id: az140-qz-41-06
    objective: "4.1.4"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Litware plans a pooled host pool named **HP-Eng** for 96 engineers who all work at the same time. Their workload is classified as heavy: engineering applications, large spreadsheets and many browser tabs. The session hosts will run Windows 11 Enterprise multi-session.

        The design must meet the following requirements:

        - Follow Microsoft's multi-session sizing guidelines, including the recommended vCPU range of a session host.
        - Use the smallest number of session hosts that meets the previous requirement.

        Which configuration should you deploy?
      fr: |
        Litware prévoit un pool d'hôtes regroupé nommé **HP-Eng** pour 96 ingénieurs qui travaillent tous en même temps. Leur charge de travail est classée lourde (Heavy) : applications d'ingénierie, grandes feuilles de calcul et nombreux onglets de navigateur. Les hôtes de session exécuteront Windows 11 Entreprise multisession.

        La conception doit répondre aux exigences suivantes :

        - Respecter les recommandations de dimensionnement multisession de Microsoft, y compris la plage de vCPU recommandée pour un hôte de session.
        - Utiliser le plus petit nombre d'hôtes de session qui respecte l'exigence précédente.

        Quelle configuration devez-vous déployer ?
    body:
      options:
        - { id: a, text: { en: "Two Standard_D32s_v5 session hosts (32 vCPUs each)", fr: "Deux hôtes de session Standard_D32s_v5 (32 vCPU chacun)" } }
        - { id: b, text: { en: "Three Standard_D16s_v5 session hosts (16 vCPUs each)", fr: "Trois hôtes de session Standard_D16s_v5 (16 vCPU chacun)" } }
        - { id: c, text: { en: "Six Standard_D8s_v5 session hosts (8 vCPUs each)", fr: "Six hôtes de session Standard_D8s_v5 (8 vCPU chacun)" } }
        - { id: d, text: { en: "Twelve Standard_D4s_v5 session hosts (4 vCPUs each)", fr: "Douze hôtes de session Standard_D4s_v5 (4 vCPU chacun)" } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          A heavy workload allows a maximum of two users per vCPU, so 96 users need 48 vCPUs. Three 16-vCPU hosts give 48 vCPUs (32 users each), stay inside the recommended range of 4 to 24 vCPUs per host and meet the 8-vCPU minimum of a heavy workload. No configuration with fewer hosts stays inside that range.
        fr: |
          Une charge lourde admet au maximum deux utilisateurs par vCPU : 96 utilisateurs demandent 48 vCPU. Trois hôtes de 16 vCPU fournissent 48 vCPU (32 utilisateurs chacun), restent dans la plage recommandée de 4 à 24 vCPU par hôte et respectent le minimum de 8 vCPU d'une charge lourde. Aucune configuration avec moins d'hôtes ne reste dans cette plage.
      options:
        a: { en: "32 vCPUs per host is outside the recommended range: gains diminish around 16 cores, and two 16-core VMs perform better than one 32-core VM.", fr: "32 vCPU par hôte sort de la plage recommandée : le gain diminue vers 16 cœurs, et deux machines de 16 cœurs offrent de meilleures performances qu'une machine de 32 cœurs." }
        c: { en: "Six 8-vCPU hosts also give 48 vCPUs within the guidelines, but they use twice as many session hosts as needed.", fr: "Six hôtes de 8 vCPU fournissent aussi 48 vCPU dans les recommandations, mais ils utilisent deux fois plus d'hôtes de session que nécessaire." }
        d: { en: "4 vCPUs is below the minimum of 8 vCPUs per VM for a heavy multi-session workload, and it doubles the number of hosts again.", fr: "4 vCPU est en dessous du minimum de 8 vCPU par machine virtuelle pour une charge multisession lourde, et cela double encore le nombre d'hôtes." }
    references:
      - title: Session host virtual machine sizing guidelines for Azure Virtual Desktop and Remote Desktop Services
        url: https://learn.microsoft.com/en-us/windows-server/remote/remote-desktop-services/session-host-virtual-machine-sizing-guidelines

  # ------------------------------------------------------------------ 7
  - id: az140-qz-41-07
    objective: "4.1.5"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        Contoso has two pooled host pools in the West Europe region:

        | Host pool | Session hosts | Scaling plan |
        | --- | --- | --- |
        | HP1 | 12 | SP1 |
        | HP2 | 8 | SP2 |

        SP1 and SP2 are power management scaling plans created in West Europe. The time zone of SP1 is **(UTC-05:00) Eastern Time (US & Canada)**, and its ramp-up phase starts at 07:00 with a capacity threshold of 80 percent. The users of HP1 work in Paris.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Contoso dispose de deux pools d'hôtes regroupés dans la région Europe Ouest :

        | Pool d'hôtes | Hôtes de session | Plan de mise à l'échelle |
        | --- | --- | --- |
        | HP1 | 12 | SP1 |
        | HP2 | 8 | SP2 |

        SP1 et SP2 sont des plans de mise à l'échelle de type gestion de l'alimentation créés dans la région Europe Ouest. Le fuseau horaire de SP1 est **(UTC-05:00) Eastern Time (US & Canada)**, et sa phase de montée en charge (ramp-up) commence à 07 h 00 avec un seuil de capacité de 80 %. Les utilisateurs de HP1 travaillent à Paris.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text: { en: "The ramp-up phase of SP1 starts when it's 07:00 in Paris.", fr: "La phase de montée en charge de SP1 commence quand il est 07 h 00 à Paris." }
        - id: s2
          text: { en: "During the ramp-up phase of SP1, if most users sign out and the used capacity of HP1 drops to 20 percent, autoscale stops the session hosts that have no sessions.", fr: "Pendant la montée en charge de SP1, si la plupart des utilisateurs ferment leur session et que la capacité utilisée de HP1 tombe à 20 %, la mise à l'échelle automatique arrête les hôtes de session qui n'ont aucune session." }
        - id: s3
          text: { en: "You can assign SP1 to HP2 after you remove the assignment of SP2 from HP2.", fr: "Vous pouvez attribuer SP1 à HP2 après avoir retiré l'attribution de SP2 à HP2." }
    answer:
      values: { s1: false, s2: false, s3: true }
    explanation:
      correct:
        en: |
          A scaling plan has one time zone, and its schedule times are read in that time zone: SP1 starts ramp-up at 07:00 Eastern Time, which is early afternoon in Paris. Autoscale never turns off session hosts during the ramp-up phase, to avoid a bad user experience. One plan can be assigned to several host pools of the same type in its region, but a host pool can have only one plan, so SP2 must be removed from HP2 first.
        fr: |
          Un plan de mise à l'échelle a un seul fuseau horaire, et les heures de son planning sont lues dans ce fuseau : SP1 commence la montée en charge à 07 h 00, heure de l'Est, soit en début d'après-midi à Paris. La mise à l'échelle automatique n'arrête jamais d'hôte de session pendant la montée en charge, pour éviter de dégrader l'expérience des utilisateurs. Un plan peut être attribué à plusieurs pools d'hôtes du même type dans sa région, mais un pool d'hôtes ne peut avoir qu'un seul plan : il faut d'abord retirer SP2 de HP2.
      options:
        s1: { en: "The schedule follows the time zone of the plan, not the location of the users or of the host pool: set the plan's time zone to Paris time to match the users.", fr: "Le planning suit le fuseau horaire du plan, pas l'emplacement des utilisateurs ni du pool d'hôtes : réglez le fuseau du plan sur l'heure de Paris pour l'adapter aux utilisateurs." }
        s2: { en: "Pooled autoscale doesn't turn off session hosts in the ramp-up phase; it only starts hosts when the used capacity exceeds the threshold.", fr: "La mise à l'échelle automatique des pools regroupés n'arrête pas d'hôtes de session pendant la montée en charge ; elle ne fait qu'en démarrer quand la capacité utilisée dépasse le seuil." }
    references:
      - title: Create and assign an autoscale scaling plan for Azure Virtual Desktop
        url: https://learn.microsoft.com/en-us/azure/virtual-desktop/autoscale-scaling-plan
      - title: Autoscale scaling plans and example scenarios in Azure Virtual Desktop
        url: https://learn.microsoft.com/en-us/azure/virtual-desktop/autoscale-scenarios

  # ------------------------------------------------------------------ 8
  - id: az140-qz-41-08
    objective: "4.1.1"
    difficulty: 3
    status: draft
    type: dropdown
    stem:
      en: |
        The diagnostic settings of the Azure Virtual Desktop host pools and workspaces of Adatum send all the log categories to a Log Analytics workspace named **LAW1**.

        You need a query that covers the last seven days and lists the errors that the Adatum administrators can usually resolve themselves, with the number of distinct users affected by each error code, the most widespread error first.

        How should you complete the query? Select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Les paramètres de diagnostic des pools d'hôtes et des espaces de travail Azure Virtual Desktop d'Adatum envoient toutes les catégories de journaux vers un espace de travail Log Analytics nommé **LAW1**.

        Vous avez besoin d'une requête qui couvre les sept derniers jours et liste les erreurs que les administrateurs d'Adatum peuvent en général résoudre eux-mêmes, avec le nombre d'utilisateurs distincts touchés par chaque code d'erreur, l'erreur la plus répandue en premier.

        Comment devez-vous compléter la requête ? Sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: code
      language: kusto
      template: |
        [[table]]
        | where TimeGenerated > ago(7d)
        | where [[filter]]
        | summarize Users = [[agg]] by CodeSymbolic
        | sort by Users desc
      slots:
        - id: table
          options:
            - { id: conn, text: WVDConnections }
            - { id: chk, text: WVDCheckpoints }
            - { id: err, text: WVDErrors }
            - { id: feed, text: WVDFeeds }
        - id: filter
          options:
            - { id: sefalse, text: "ServiceError == false" }
            - { id: setrue, text: "ServiceError == true" }
            - { id: completed, text: "State == \"Completed\"" }
        - id: agg
          options:
            - { id: cnt, text: "count()" }
            - { id: dcorr, text: "dcount(CorrelationId)" }
            - { id: duser, text: "dcount(UserName)" }
    answer:
      values: { table: err, filter: sefalse, agg: duser }
    explanation:
      correct:
        en: |
          WVDErrors records the problems users meet during an activity, including management, host registration and feed subscription errors, with a CodeSymbolic value. A ServiceError value of false means the cause is on the customer side and an administrator can usually resolve it, whereas true means an issue to escalate to Microsoft with the CorrelationId. `dcount(UserName)` counts the distinct users per error code, as the requirement asks.
        fr: |
          WVDErrors enregistre les problèmes rencontrés par les utilisateurs pendant une activité, y compris les erreurs de gestion, d'inscription des hôtes et d'abonnement au flux, avec une valeur CodeSymbolic. Une valeur ServiceError à false signifie que la cause est côté client et qu'un administrateur peut en général la résoudre, alors que true signale un problème à remonter à Microsoft avec le CorrelationId. `dcount(UserName)` compte les utilisateurs distincts par code d'erreur, comme l'exige le besoin.
      options:
        conn: { en: "WVDConnections records the states of the connections (Started, Connected, Completed); it has no ServiceError or CodeSymbolic column.", fr: "WVDConnections enregistre les états des connexions (Started, Connected, Completed) ; il n'a ni colonne ServiceError ni colonne CodeSymbolic." }
        chk: { en: "WVDCheckpoints records the steps reached during an activity, such as a RemoteApp launched, not the errors.", fr: "WVDCheckpoints enregistre les étapes atteintes pendant une activité, comme le lancement d'une RemoteApp, pas les erreurs." }
        feed: { en: "WVDFeeds records the feed subscriptions; the errors met during a subscription are written to WVDErrors.", fr: "WVDFeeds enregistre les abonnements au flux ; les erreurs rencontrées pendant un abonnement sont écrites dans WVDErrors." }
        setrue: { en: "ServiceError == true selects the service errors, which must be escalated to Microsoft rather than fixed by the administrators.", fr: "ServiceError == true sélectionne les erreurs du service, à remonter à Microsoft plutôt qu'à corriger par les administrateurs." }
        cnt: { en: "count() returns the number of error records: a single user who retries ten times is counted ten times.", fr: "count() renvoie le nombre d'enregistrements d'erreur : un seul utilisateur qui réessaie dix fois est compté dix fois." }
        dcorr: { en: "dcount(CorrelationId) counts distinct activities, not distinct users.", fr: "dcount(CorrelationId) compte les activités distinctes, pas les utilisateurs distincts." }
    references:
      - title: Send diagnostic data to Log Analytics for Azure Virtual Desktop
        url: https://learn.microsoft.com/en-us/azure/virtual-desktop/diagnostics-log-analytics
      - title: WVDErrors
        url: https://learn.microsoft.com/en-us/azure/azure-monitor/reference/tables/wvderrors

  # ------------------------------------------------------------------ 9
  - id: az140-qz-41-09
    objective: "4.1.5"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Fabrikam has a pooled host pool named **HP-Office** with a max session limit of 16. A power management scaling plan named **SP-Office** is assigned to HP-Office. Many users close Windows App at the end of the day without signing out, and their disconnected sessions keep several session hosts running all night.

        The solution must meet the following requirements:

        - A disconnected session must be signed out once it has been disconnected for two hours, in every phase of the schedule.
        - A user who has an active session must never be signed out by the solution.

        What should you do?
      fr: |
        Fabrikam dispose d'un pool d'hôtes regroupé nommé **HP-Office** avec une limite maximale de sessions de 16. Un plan de mise à l'échelle de type gestion de l'alimentation nommé **SP-Office** est attribué à HP-Office. De nombreux utilisateurs ferment Windows App en fin de journée sans fermer leur session, et leurs sessions déconnectées maintiennent plusieurs hôtes de session en marche toute la nuit.

        La solution doit répondre aux exigences suivantes :

        - Une session déconnectée doit être fermée dès qu'elle est déconnectée depuis deux heures, dans toutes les phases du planning.
        - Un utilisateur qui a une session active ne doit jamais voir sa session fermée par la solution.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Enable Force logoff of users in the ramp-down phase of SP-Office, with a wait time of 120 minutes.", fr: "Activer Forcer la déconnexion des utilisateurs dans la phase de baisse de charge de SP-Office, avec un délai d'attente de 120 minutes." } }
        - { id: b, text: { en: "Configure SP-Office to deallocate a session host 120 minutes after its users disconnect from it.", fr: "Configurer SP-Office pour libérer un hôte de session 120 minutes après la déconnexion de ses utilisateurs." } }
        - { id: c, text: { en: "Set the ramp-down stop condition of SP-Office to VMs have no active sessions.", fr: "Régler la condition d'arrêt de la baisse de charge de SP-Office sur VMs have no active sessions." } }
        - { id: d, text: { en: "Set the policy Set time limit for disconnected sessions to two hours by using Intune or Group Policy.", fr: "Régler la stratégie Set time limit for disconnected sessions sur deux heures par Intune ou par stratégie de groupe." } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          The Remote Desktop Session Host policy Set time limit for disconnected sessions signs out a session after it has been disconnected for the configured time, on every session host and at any hour. It reduces the used capacity of the host pool, so autoscale can stop hosts during the night, and it never touches active sessions.
        fr: |
          La stratégie Remote Desktop Session Host Set time limit for disconnected sessions ferme une session une fois qu'elle est déconnectée depuis la durée configurée, sur chaque hôte de session et à toute heure. Elle réduit la capacité utilisée du pool d'hôtes, ce qui permet à la mise à l'échelle automatique d'arrêter des hôtes la nuit, et elle ne touche jamais aux sessions actives.
      options:
        a: { en: "Force logoff applies only to the ramp-down phase and signs out every user of the drained hosts after the wait time, active users included.", fr: "Forcer la déconnexion ne s'applique qu'à la baisse de charge et ferme, après le délai d'attente, la session de tous les utilisateurs des hôtes drainés, utilisateurs actifs compris." }
        b: { en: "Actions after a disconnection (deallocate, hibernate) exist only in personal scaling plans; a pooled plan can't be configured this way.", fr: "Les actions après une déconnexion (libérer, mettre en veille prolongée) n'existent que dans les plans de mise à l'échelle personnels ; un plan regroupé ne se configure pas ainsi." }
        c: { en: "This stop condition applies only during ramp-down and lets autoscale stop a host that has disconnected sessions, whatever the time since the disconnection.", fr: "Cette condition d'arrêt ne s'applique qu'en baisse de charge et laisse la mise à l'échelle automatique arrêter un hôte qui a des sessions déconnectées, quel que soit le temps écoulé depuis la déconnexion." }
    references:
      - title: Create and assign an autoscale scaling plan for Azure Virtual Desktop
        url: https://learn.microsoft.com/en-us/azure/virtual-desktop/autoscale-scaling-plan

  # ------------------------------------------------------------------ 10
  - id: az140-qz-41-10
    objective: "4.1.4"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        Northwind Traders has a pooled host pool named **HP1** that contains 12 session hosts of the Standard_D8s_v5 size. HP1 has a max session limit of 20. A power management scaling plan named **SP1** is assigned to HP1. During the peak phase, SP1 uses breadth-first load balancing and a capacity threshold of 90 percent.

        At peak hours, Azure Virtual Desktop Insights shows that seven session hosts are running, each with 17 or 18 sessions (about 122 sessions in total), and that the user input delay and the CPU usage are high on all of them. The other five session hosts are deallocated. The session hosts must keep the Standard_D8s_v5 size.

        Which two actions will reduce the number of sessions on each running session host during peak hours? Each correct answer presents a complete solution.

        NOTE: Each correct selection is worth one point.
      fr: |
        Northwind Traders dispose d'un pool d'hôtes regroupé nommé **HP1** qui contient 12 hôtes de session de taille Standard_D8s_v5. HP1 a une limite maximale de sessions de 20. Un plan de mise à l'échelle de type gestion de l'alimentation nommé **SP1** est attribué à HP1. Pendant la phase de pointe (peak), SP1 utilise l'équilibrage de charge breadth-first et un seuil de capacité de 90 %.

        Aux heures de pointe, Azure Virtual Desktop Insights montre que sept hôtes de session sont en marche, avec chacun 17 ou 18 sessions (environ 122 sessions au total), et que le délai d'entrée utilisateur et l'utilisation du processeur sont élevés sur tous. Les cinq autres hôtes de session sont libérés. Les hôtes de session doivent conserver la taille Standard_D8s_v5.

        Quelles sont les deux actions qui réduiront le nombre de sessions sur chaque hôte de session en marche aux heures de pointe ? Chaque bonne réponse constitue une solution complète.

        Remarque : chaque sélection correcte vaut un point.
    body:
      options:
        - { id: a, text: { en: "Lower the max session limit of HP1 to 12.", fr: "Baisser la limite maximale de sessions de HP1 à 12." } }
        - { id: b, text: { en: "Use depth-first load balancing during the peak phase of SP1.", fr: "Utiliser l'équilibrage de charge depth-first pendant la phase de pointe de SP1." } }
        - { id: c, text: { en: "Lower the capacity threshold that SP1 uses at peak hours to 60 percent.", fr: "Baisser à 60 % le seuil de capacité que SP1 utilise aux heures de pointe." } }
        - { id: d, text: { en: "Enable Start VM on Connect on HP1 for the five deallocated hosts.", fr: "Activer Démarrer la machine virtuelle à la connexion sur HP1 pour les cinq hôtes libérés." } }
        - { id: e, text: { en: "Raise the minimum percentage of hosts of the off-peak phase of SP1.", fr: "Augmenter le pourcentage minimal d'hôtes de la phase des heures creuses de SP1." } }
        - { id: f, text: { en: "Add the exclusion tag of SP1 to the seven running session hosts.", fr: "Ajouter l'étiquette d'exclusion de SP1 aux sept hôtes de session en marche." } }
      choose: 2
    answer: { optionIds: [a, c] }
    explanation:
      correct:
        en: |
          Today, the used capacity is about 122 ÷ (7 × 20) = 87 percent, below the 90 percent threshold, so autoscale starts no host. A max session limit of 12 caps each host at 12 sessions and raises the used capacity above the threshold, so autoscale starts the deallocated hosts. A 60 percent threshold makes autoscale start hosts until the used capacity falls below 60 percent (about 11 hosts), and breadth-first spreads the sessions across them. The peak phase uses the threshold set in ramp-up, so you change it there.
        fr: |
          Aujourd'hui, la capacité utilisée est d'environ 122 ÷ (7 × 20) = 87 %, sous le seuil de 90 % : la mise à l'échelle automatique ne démarre aucun hôte. Une limite maximale de 12 sessions plafonne chaque hôte à 12 sessions et fait passer la capacité utilisée au-dessus du seuil : la mise à l'échelle automatique démarre les hôtes libérés. Un seuil de 60 % lui fait démarrer des hôtes jusqu'à ce que la capacité utilisée passe sous 60 % (environ 11 hôtes), et breadth-first répartit les sessions entre eux. La phase de pointe utilise le seuil défini en montée en charge : c'est là que vous le modifiez.
      options:
        b: { en: "Depth-first fills each host up to the max session limit before using the next one, which keeps the per-host load high.", fr: "Depth-first remplit chaque hôte jusqu'à la limite maximale de sessions avant d'utiliser le suivant, ce qui maintient une charge élevée par hôte." }
        d: { en: "In a pooled host pool, Start VM on Connect starts a VM only when no session host is available; seven hosts are available below their limit.", fr: "Dans un pool regroupé, Démarrer la machine virtuelle à la connexion ne démarre une machine que si aucun hôte de session n'est disponible ; sept hôtes sont disponibles sous leur limite." }
        e: { en: "The minimum percentage of the off-peak phase applies only during off-peak hours, not at peak.", fr: "Le pourcentage minimal des heures creuses ne s'applique que pendant les heures creuses, pas en pointe." }
        f: { en: "The exclusion tag only stops autoscale from starting, stopping or draining the tagged hosts; it doesn't make autoscale start the deallocated hosts.", fr: "L'étiquette d'exclusion empêche seulement la mise à l'échelle automatique de démarrer, d'arrêter ou de drainer les hôtes étiquetés ; elle ne lui fait pas démarrer les hôtes libérés." }
    references:
      - title: Autoscale scaling plans and example scenarios in Azure Virtual Desktop
        url: https://learn.microsoft.com/en-us/azure/virtual-desktop/autoscale-scenarios
      - title: Create and assign an autoscale scaling plan for Azure Virtual Desktop
        url: https://learn.microsoft.com/en-us/azure/virtual-desktop/autoscale-scaling-plan
