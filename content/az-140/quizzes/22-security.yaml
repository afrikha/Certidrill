chapter: 22-security
questions:
  # ------------------------------------------------------------------ 1
  - id: az140-qz-22-01
    objective: "2.2.6"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Contoso has a pooled Azure Virtual Desktop host pool whose session hosts run Windows 11 Enterprise multi-session. The security team requires that only approved applications, scripts and MSI installers can run on the session hosts, for every user who signs in.

        Which feature should you deploy to the session hosts?
      fr: |
        Contoso dispose d'un pool d'hôtes Azure Virtual Desktop regroupé dont les hôtes de session exécutent Windows 11 Entreprise multisession. L'équipe de sécurité exige que seuls des applications, des scripts et des programmes d'installation MSI approuvés puissent s'exécuter sur les hôtes de session, pour chaque utilisateur qui s'y connecte.

        Quelle fonctionnalité devez-vous déployer sur les hôtes de session ?
    body:
      options:
        - { id: a, text: { en: "Controlled folder access", fr: "L'accès contrôlé aux dossiers" } }
        - { id: b, text: { en: "Tamper protection", fr: "La protection contre les falsifications" } }
        - { id: c, text: Microsoft Defender SmartScreen }
        - { id: d, text: App Control for Business }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          App Control for Business allows only approved code to run on a device: applications, drivers, scripts and MSI installers, with PowerShell restricted to Constrained Language Mode. Its policies apply to the whole device, so on a multi-session host they cover every user who signs in, which is what the requirement asks for.
        fr: |
          App Control for Business n'autorise que le code approuvé à s'exécuter sur un appareil : applications, pilotes, scripts et programmes d'installation MSI, avec PowerShell limité au mode de langage contraint. Ses stratégies s'appliquent à tout l'appareil ; sur un hôte multisession, elles couvrent donc chaque utilisateur qui se connecte, ce que demande l'exigence.
      options:
        a: { en: "Controlled folder access decides which applications can change files in protected folders such as Documents; it doesn't stop unapproved code from running.", fr: "L'accès contrôlé aux dossiers décide quelles applications peuvent modifier les fichiers des dossiers protégés comme Documents ; il n'empêche pas du code non approuvé de s'exécuter." }
        b: { en: "Tamper protection prevents the Defender security settings from being turned off; it doesn't restrict which applications run.", fr: "La protection contre les falsifications empêche la désactivation des paramètres de sécurité de Defender ; elle ne limite pas les applications qui s'exécutent." }
        c: { en: "SmartScreen warns about or blocks malicious websites and downloads; it isn't an allowlist of approved code.", fr: "SmartScreen avertit ou bloque les sites web et les téléchargements malveillants ; ce n'est pas une liste d'autorisation du code approuvé." }
    references:
      - title: Security recommendations for Azure Virtual Desktop
        url: https://learn.microsoft.com/en-us/azure/virtual-desktop/security-recommendations

  # ------------------------------------------------------------------ 2
  - id: az140-qz-22-02
    objective: "2.2.7"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Fabrikam plans to add session hosts that use the **Confidential virtual machines** security type to an Azure Virtual Desktop host pool. An auditor asks how the memory of these session hosts is protected from the Azure host and the hypervisor.

        What protects the memory of the session hosts?
      fr: |
        Fabrikam prévoit d'ajouter à un pool d'hôtes Azure Virtual Desktop des hôtes de session qui utilisent le type de sécurité **Confidential virtual machines**. Un auditeur demande comment la mémoire de ces hôtes de session est protégée de l'hôte Azure et de l'hyperviseur.

        Qu'est-ce qui protège la mémoire des hôtes de session ?
    body:
      options:
        - id: a
          text:
            en: "Encryption with keys that a secure processor inside the CPU generates and keeps (AMD SEV-SNP or Intel TDX)"
            fr: "Le chiffrement avec des clés que génère et conserve un processeur sécurisé intégré au CPU (AMD SEV-SNP ou Intel TDX)"
        - id: b
          text:
            en: "Encryption at host, which encrypts the temporary disk and the disk caches stored on the Azure host"
            fr: "Le chiffrement sur l'hôte, qui chiffre le disque temporaire et les caches de disque stockés sur l'hôte Azure"
        - id: c
          text:
            en: "BitLocker, with keys that the vTPM of each session host keeps in a secure environment outside the VM"
            fr: "BitLocker, avec des clés que le vTPM de chaque hôte de session conserve dans un environnement sécurisé hors de la machine virtuelle"
        - id: d
          text:
            en: "Secure Boot, which allows only signed boot loaders, operating system kernels and drivers to start"
            fr: "Secure Boot, qui n'autorise que les chargeurs de démarrage, noyaux de système d'exploitation et pilotes signés à démarrer"
    answer: { optionId: a }
    explanation:
      correct:
        en: |
          Confidential VMs run on AMD SEV-SNP or Intel TDX processors. Their memory is encrypted with keys generated and kept by a dedicated secure processor inside the CPU, which software can't read, so the data in use is isolated from the host and the hypervisor.
        fr: |
          Les machines virtuelles confidentielles s'exécutent sur des processeurs AMD SEV-SNP ou Intel TDX. Leur mémoire est chiffrée avec des clés générées et conservées par un processeur sécurisé dédié intégré au CPU, que les logiciels ne peuvent pas lire : les données en cours d'utilisation sont ainsi isolées de l'hôte et de l'hyperviseur.
      options:
        b: { en: "Encryption at host protects data at rest on the host (temporary disk, caches); it doesn't encrypt the memory of a running VM.", fr: "Le chiffrement sur l'hôte protège les données au repos sur l'hôte (disque temporaire, caches) ; il ne chiffre pas la mémoire d'une machine virtuelle en cours d'exécution." }
        c: { en: "BitLocker with the vTPM encrypts volumes at rest; the memory of the VM stays readable by the hypervisor.", fr: "BitLocker avec le vTPM chiffre les volumes au repos ; la mémoire de la machine virtuelle reste lisible par l'hyperviseur." }
        d: { en: "Secure Boot protects the boot chain against rootkits and bootkits; it doesn't encrypt memory.", fr: "Secure Boot protège la chaîne de démarrage contre les rootkits et les bootkits ; il ne chiffre pas la mémoire." }
    references:
      - title: Security recommendations for Azure Virtual Desktop
        url: https://learn.microsoft.com/en-us/azure/virtual-desktop/security-recommendations
      - title: About Azure confidential VMs
        url: https://learn.microsoft.com/en-us/azure/confidential-computing/confidential-vm-overview

  # ------------------------------------------------------------------ 3
  - id: az140-qz-22-03
    objective: "2.2.2"
    difficulty: 2
    status: draft
    type: multi
    stem:
      en: |
        Litware stores the FSLogix profile containers of a pooled host pool in `\\stlitprof.file.core.windows.net\profiles`. Microsoft Defender Antivirus on the session hosts already excludes the VHDX containers on this share and the temporary VHDX files on the session hosts. Antivirus events still show scans of other files that FSLogix keeps next to each container on the share.

        You need to complete the exclusions for the share. The exclusions must cover only items that Microsoft lists for FSLogix.

        Which three exclusions should you add? Each correct answer presents part of the solution.

        NOTE: Each correct selection is worth one point.
      fr: |
        Litware stocke les conteneurs de profils FSLogix d'un pool d'hôtes regroupé dans `\\stlitprof.file.core.windows.net\profiles`. Microsoft Defender Antivirus exclut déjà, sur les hôtes de session, les conteneurs VHDX de ce partage et les fichiers VHDX temporaires des hôtes de session. Les événements de l'antivirus montrent toujours l'analyse d'autres fichiers que FSLogix conserve à côté de chaque conteneur sur le partage.

        Vous devez compléter les exclusions du partage. Les exclusions ne doivent couvrir que des éléments que Microsoft liste pour FSLogix.

        Quelles sont les trois exclusions que vous devez ajouter ? Chaque bonne réponse présente une partie de la solution.

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 3
      options:
        - { id: a, text: '`\\stlitprof.file.core.windows.net\profiles\*\*.VHDX.lock`' }
        - { id: b, text: '`\\stlitprof.file.core.windows.net\profiles\*\*.VHDX.meta`' }
        - { id: c, text: '`\\stlitprof.file.core.windows.net\profiles\*`' }
        - { id: d, text: '`\\stlitprof.file.core.windows.net\profiles\*\*.VHDX.metadata`' }
        - { id: e, text: '`%USERPROFILE%\Documents\*`' }
        - { id: f, text: '`%LOCALAPPDATA%\Microsoft\Outlook\*`' }
    answer: { optionIds: [a, b, d] }
    explanation:
      correct:
        en: |
          For an SMB share, Microsoft lists the VHD and VHDX containers together with their associated `.lock`, `.meta` and `.metadata` files. Scanning these files while FSLogix uses them can lock or corrupt them and delay sign-ins, so each of the three patterns must be excluded on the share.
        fr: |
          Pour un partage SMB, Microsoft liste les conteneurs VHD et VHDX avec leurs fichiers associés `.lock`, `.meta` et `.metadata`. Analyser ces fichiers pendant que FSLogix les utilise peut les verrouiller ou les corrompre et retarder les connexions : chacun des trois modèles doit donc être exclu sur le partage.
      options:
        c: { en: "Excluding the whole share also skips every other file stored there; Microsoft lists only the container files and their associated files.", fr: "Exclure tout le partage ignore aussi tous les autres fichiers qui y sont stockés ; Microsoft ne liste que les fichiers de conteneur et leurs fichiers associés." }
        e: { en: "The Documents folder holds user data that must stay scanned; it isn't an FSLogix exclusion and isn't on the share.", fr: "Le dossier Documents contient des données utilisateur qui doivent rester analysées ; ce n'est pas une exclusion FSLogix et il n'est pas sur le partage." }
        f: { en: "The Outlook folder is profile data inside the container, not an FSLogix file on the share; it isn't in Microsoft's FSLogix list.", fr: "Le dossier Outlook fait partie des données de profil à l'intérieur du conteneur, ce n'est pas un fichier FSLogix du partage ; il ne figure pas dans la liste FSLogix de Microsoft." }
    references:
      - title: Prerequisites for FSLogix
        url: https://learn.microsoft.com/en-us/fslogix/overview-prerequisites

  # ------------------------------------------------------------------ 4
  - id: az140-qz-22-04
    objective: "2.2.3"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Proseware onboarded the 40 session hosts of a pooled host pool to Microsoft Defender for Endpoint. Every session host runs a full scan each day at 10:00, and users complain that their sessions slow down at that time.

        You need to change the scanning options to reduce the impact on users. The solution must follow Microsoft's recommendations for virtual desktops.

        What should you configure?
      fr: |
        Proseware a intégré les 40 hôtes de session d'un pool d'hôtes regroupé à Microsoft Defender for Endpoint. Chaque hôte de session exécute une analyse complète tous les jours à 10:00, et les utilisateurs se plaignent que leurs sessions ralentissent à ce moment-là.

        Vous devez modifier les options d'analyse pour réduire l'impact sur les utilisateurs. La solution doit suivre les recommandations de Microsoft pour les bureaux virtuels.

        Que devez-vous configurer ?
    body:
      options:
        - id: a
          text:
            en: "Keep real-time protection on, replace the full scan with a daily quick scan, and enable Randomize scheduled scans."
            fr: "Garder la protection en temps réel activée, remplacer l'analyse complète par une analyse rapide quotidienne, et activer Randomize scheduled scans."
        - id: b
          text:
            en: "Turn off real-time protection, and run a full scan on all the session hosts every Sunday at 02:00."
            fr: "Désactiver la protection en temps réel, et exécuter une analyse complète sur tous les hôtes de session chaque dimanche à 02:00."
        - id: c
          text:
            en: "Replace the daily full scan with a full scan every Monday at 10:00, and turn off catch-up scans."
            fr: "Remplacer l'analyse complète quotidienne par une analyse complète chaque lundi à 10:00, et désactiver les analyses de rattrapage."
        - id: d
          text:
            en: "Keep the daily full scan, and exclude `C:\\Windows` and `C:\\Program Files` from all the scans."
            fr: "Garder l'analyse complète quotidienne, et exclure `C:\\Windows` et `C:\\Program Files` de toutes les analyses."
    answer: { optionId: a }
    explanation:
      correct:
        en: |
          Onboarding to Defender for Endpoint doesn't set the antivirus scanning options, so they must follow the VDI guidance: real-time protection stays on, a daily quick scan replaces full scans, and randomized start times stop all the hosts from scanning at the same moment on shared infrastructure.
        fr: |
          L'intégration à Defender for Endpoint ne définit pas les options d'analyse de l'antivirus : elles doivent suivre les recommandations VDI. La protection en temps réel reste activée, une analyse rapide quotidienne remplace les analyses complètes, et des heures de démarrage aléatoires évitent que tous les hôtes analysent au même moment sur une infrastructure partagée.
      options:
        b: { en: "Real-time protection is the main protection layer; turning it off leaves the hosts unprotected between scans.", fr: "La protection en temps réel est la principale couche de protection ; la désactiver laisse les hôtes sans protection entre les analyses." }
        c: { en: "A full scan on every host at 10:00 still slows the sessions during working hours, and catch-up scans are recommended for hosts that miss a scan.", fr: "Une analyse complète sur chaque hôte à 10:00 ralentit toujours les sessions pendant les heures de travail, et les analyses de rattrapage sont recommandées pour les hôtes qui manquent une analyse." }
        d: { en: "Excluding system folders weakens protection without addressing the simultaneous full scans; exclusions should be added only when needed.", fr: "Exclure des dossiers système affaiblit la protection sans traiter les analyses complètes simultanées ; il ne faut ajouter des exclusions que si nécessaire." }
    references:
      - title: Configure Microsoft Defender Antivirus on a remote desktop or virtual desktop infrastructure environment
        url: https://learn.microsoft.com/en-us/defender-endpoint/deployment-vdi-microsoft-defender-antivirus
      - title: Onboard non-persistent VDI devices to Microsoft Defender for Endpoint
        url: https://learn.microsoft.com/en-us/defender-endpoint/configure-endpoints-vdi

  # ------------------------------------------------------------------ 5
  - id: az140-qz-22-05
    objective: "2.2.1"
    difficulty: 2
    status: draft
    type: yesno_statements
    stem:
      en: |
        Woodgrove Bank has two Azure Virtual Desktop host pools in a subscription where Microsoft Defender for Servers Plan 2 is enabled:

        - **HP-Personal**: personal desktops that persist and are never re-created.
        - **HP-Pooled**: pooled session hosts that are deleted and re-created from a golden image in Azure Compute Gallery every week.

        Microsoft Defender for Cloud shows the same recommendation, with a **Fix** action, about a misconfigured Windows security setting on the session hosts of both host pools.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Woodgrove Bank dispose de deux pools d'hôtes Azure Virtual Desktop dans un abonnement où Microsoft Defender pour serveurs Plan 2 est activé :

        - **HP-Personal** : des bureaux personnels persistants, jamais recréés.
        - **HP-Pooled** : des hôtes de session regroupés, supprimés et recréés chaque semaine à partir d'une image de référence stockée dans Azure Compute Gallery.

        Microsoft Defender pour le cloud affiche la même recommandation, avec une action **Fix**, concernant un paramètre de sécurité Windows mal configuré sur les hôtes de session des deux pools d'hôtes.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text: { en: "Applying the Fix action to the HP-Personal session hosts remediates the finding for those hosts until the setting is changed again.", fr: "Appliquer l'action Fix aux hôtes de session de HP-Personal corrige le constat pour ces hôtes jusqu'à ce que le paramètre soit de nouveau modifié." }
        - id: s2
          text: { en: "Applying the Fix action to the HP-Pooled session hosts prevents the finding on the hosts that are created next week.", fr: "Appliquer l'action Fix aux hôtes de session de HP-Pooled empêche le constat sur les hôtes créés la semaine prochaine." }
        - id: s3
          text: { en: "Defender for Cloud can show the vulnerable software that the vulnerability management of Microsoft Defender for Endpoint finds on the session hosts.", fr: "Defender pour le cloud peut afficher les logiciels vulnérables que la gestion des vulnérabilités de Microsoft Defender for Endpoint trouve sur les hôtes de session." }
    answer:
      values: { s1: true, s2: false, s3: true }
    explanation:
      correct:
        en: |
          Defender for Cloud remediates the running resources, not the image they come from. A persistent personal desktop keeps the fix, whereas a pooled host re-created from the unchanged golden image brings the finding back: fix the setting in the image and redeploy. Defender for Cloud also surfaces the threat and vulnerability management findings of Defender for Endpoint, so vulnerable software on the hosts is visible there.
        fr: |
          Defender pour le cloud corrige les ressources en cours d'exécution, pas l'image dont elles proviennent. Un bureau personnel persistant garde la correction, alors qu'un hôte regroupé recréé à partir de l'image de référence inchangée fait réapparaître le constat : corrigez le paramètre dans l'image et redéployez. Defender pour le cloud expose aussi les résultats de la gestion des menaces et des vulnérabilités de Defender for Endpoint ; les logiciels vulnérables des hôtes y sont donc visibles.
      options:
        s2: { en: "The new hosts are created from the same golden image, so they start with the misconfigured setting; the fix belongs in the image.", fr: "Les nouveaux hôtes sont créés à partir de la même image de référence et démarrent donc avec le paramètre mal configuré ; la correction doit être faite dans l'image." }
    references:
      - title: Remediate recommendations in Microsoft Defender for Cloud
        url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/implement-security-recommendations
      - title: Security recommendations for Azure Virtual Desktop
        url: https://learn.microsoft.com/en-us/azure/virtual-desktop/security-recommendations

  # ------------------------------------------------------------------ 6
  - id: az140-qz-22-06
    objective: "2.2.2"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Tailspin has a pooled host pool named **HP-Lab** whose session hosts use FSLogix profile containers with Cloud Cache. To keep the local cache off the OS disk, `CacheDirectory` is set to `E:\FSLogix\Cache` on a Premium SSD data disk. `ProxyDirectory` keeps its default value.

        Microsoft Defender Antivirus on the session hosts has the following exclusions:

        - The VHD and VHDX containers and their `.lock`, `.meta` and `.metadata` files on both storage providers
        - The VHD and VHDX files under `%TEMP%` and `%WINDIR%\TEMP`
        - `%ProgramData%\FSLogix\Cache\*` and `%ProgramData%\FSLogix\Proxy\*`
        - The `frxsvc.exe` and `frxccds.exe` processes

        Since the change, sign-ins are slow, and antivirus events show real-time scans of VHDX files under `E:\FSLogix\Cache`.

        You need to resolve the issue. Real-time protection must stay on for drive E, and only FSLogix-specific locations can be excluded.

        What should you do?
      fr: |
        Tailspin dispose d'un pool d'hôtes regroupé nommé **HP-Lab** dont les hôtes de session utilisent des conteneurs de profils FSLogix avec Cloud Cache. Pour garder le cache local hors du disque du système d'exploitation, `CacheDirectory` est défini sur `E:\FSLogix\Cache`, sur un disque de données SSD Premium. `ProxyDirectory` garde sa valeur par défaut.

        Microsoft Defender Antivirus a les exclusions suivantes sur les hôtes de session :

        - Les conteneurs VHD et VHDX et leurs fichiers `.lock`, `.meta` et `.metadata` sur les deux fournisseurs de stockage
        - Les fichiers VHD et VHDX sous `%TEMP%` et `%WINDIR%\TEMP`
        - `%ProgramData%\FSLogix\Cache\*` et `%ProgramData%\FSLogix\Proxy\*`
        - Les processus `frxsvc.exe` et `frxccds.exe`

        Depuis la modification, les connexions sont lentes, et les événements de l'antivirus montrent des analyses en temps réel de fichiers VHDX sous `E:\FSLogix\Cache`.

        Vous devez résoudre le problème. La protection en temps réel doit rester activée pour le lecteur E, et seuls des emplacements propres à FSLogix peuvent être exclus.

        Que devez-vous faire ?
    body:
      options:
        - id: a
          text:
            en: "Add `E:\\FSLogix\\Cache\\*` as a folder exclusion in the Defender Antivirus configuration of the session hosts."
            fr: "Ajouter `E:\\FSLogix\\Cache\\*` comme exclusion de dossier dans la configuration de Defender Antivirus des hôtes de session."
        - id: b
          text:
            en: "Set `ProxyDirectory` to `E:\\FSLogix\\Cache` so that the existing Proxy folder exclusion also covers the cache."
            fr: "Définir `ProxyDirectory` sur `E:\\FSLogix\\Cache` pour que l'exclusion existante du dossier Proxy couvre aussi le cache."
        - id: c
          text:
            en: "Add `.vhdx` as a file extension exclusion so that VHDX files are skipped on every drive of the session hosts."
            fr: "Ajouter `.vhdx` comme exclusion d'extension de fichier pour que les fichiers VHDX soient ignorés sur tous les lecteurs des hôtes de session."
        - id: d
          text:
            en: "Set `ClearCacheOnLogoff` to 1 so that the local cache is deleted at sign-out and is no longer scanned."
            fr: "Définir `ClearCacheOnLogoff` sur 1 pour que le cache local soit supprimé à la déconnexion et ne soit plus analysé."
    answer: { optionId: a }
    explanation:
      correct:
        en: |
          The Cloud Cache exclusions are path based: `%ProgramData%\FSLogix\Cache\*` no longer matches once `CacheDirectory` points to drive E. Microsoft says to adjust the exclusions when you move the cache or proxy folder, so adding the new cache folder stops the scans while drive E keeps real-time protection everywhere else.
        fr: |
          Les exclusions de Cloud Cache reposent sur des chemins : `%ProgramData%\FSLogix\Cache\*` ne correspond plus dès que `CacheDirectory` pointe vers le lecteur E. Microsoft indique d'ajuster les exclusions quand vous déplacez le dossier du cache ou du proxy : ajouter le nouveau dossier du cache arrête les analyses, et le lecteur E garde la protection en temps réel partout ailleurs.
      options:
        b: { en: "`CacheDirectory` and `ProxyDirectory` must never be the same location, because the proxy and cache files have the same name; and the existing exclusion still targets `%ProgramData%`.", fr: "`CacheDirectory` et `ProxyDirectory` ne doivent jamais être au même emplacement, car les fichiers de proxy et de cache portent le même nom ; et l'exclusion existante cible toujours `%ProgramData%`." }
        c: { en: "An extension exclusion skips every VHDX file on every drive, not only FSLogix locations, which breaks the stated constraint.", fr: "Une exclusion d'extension ignore tous les fichiers VHDX sur tous les lecteurs, pas seulement les emplacements FSLogix, ce qui enfreint la contrainte donnée." }
        d: { en: "The cache is scanned while the session is open; deleting it at sign-out doesn't remove the scans that slow the sign-in.", fr: "Le cache est analysé pendant que la session est ouverte ; le supprimer à la déconnexion n'élimine pas les analyses qui ralentissent la connexion." }
    references:
      - title: Prerequisites for FSLogix
        url: https://learn.microsoft.com/en-us/fslogix/overview-prerequisites
      - title: Configuration Settings
        url: https://learn.microsoft.com/en-us/fslogix/reference-configuration-settings

  # ------------------------------------------------------------------ 7
  - id: az140-qz-22-07
    objective: "2.2.6"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        Northwind Traders manages the session hosts of a pooled Azure Virtual Desktop host pool by using Microsoft Intune. You plan to enforce an App Control for Business policy on the session hosts. The policy trusts Windows components and **apps from managed installers**. A managed installer policy that enables the Intune Management Extension as a managed installer is assigned to the session hosts.

        Two line-of-business apps must keep working:

        - **Ledger**: Intune deploys it to the session hosts as a Win32 app and deploys a new version every month, after the managed installer policy is in effect.
        - **Planner**: a script installs it in the golden image of the session hosts.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Northwind Traders gère les hôtes de session d'un pool d'hôtes Azure Virtual Desktop regroupé à l'aide de Microsoft Intune. Vous prévoyez d'appliquer une stratégie App Control for Business sur les hôtes de session. La stratégie approuve les composants Windows et les **applications provenant de programmes d'installation managés**. Une stratégie de programme d'installation managé qui active l'extension de gestion Intune (Intune Management Extension) comme programme d'installation managé est attribuée aux hôtes de session.

        Deux applications métier doivent continuer à fonctionner :

        - **Ledger** : Intune la déploie sur les hôtes de session comme application Win32 et en déploie une nouvelle version chaque mois, après l'entrée en vigueur de la stratégie de programme d'installation managé.
        - **Planner** : un script l'installe dans l'image de référence des hôtes de session.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text: { en: "Each monthly version of Ledger that Intune deploys runs without any change to the App Control for Business policy.", fr: "Chaque version mensuelle de Ledger déployée par Intune s'exécute sans aucune modification de la stratégie App Control for Business." }
        - id: s2
          text: { en: "Planner runs because the managed installer policy is assigned to the session hosts.", fr: "Planner s'exécute parce que la stratégie de programme d'installation managé est attribuée aux hôtes de session." }
        - id: s3
          text: { en: "You can assign the managed installer policy to the Microsoft Entra user group of the finance team so that it applies only to their sessions.", fr: "Vous pouvez attribuer la stratégie de programme d'installation managé au groupe d'utilisateurs Microsoft Entra de l'équipe financière pour qu'elle ne s'applique qu'à leurs sessions." }
    answer:
      values: { s1: true, s2: false, s3: false }
    explanation:
      correct:
        en: |
          The managed installer tags the apps that the Intune Management Extension installs after the policy is in effect, and an App Control policy that trusts apps from managed installers lets them run, so each new Ledger version runs. Tagging isn't retroactive and only covers apps installed by the managed installer: Planner, installed by a script in the image, needs an explicit rule, for example in a supplemental policy. App Control and managed installer policies have device scope only.
        fr: |
          Le programme d'installation managé marque les applications que l'extension de gestion Intune installe après l'entrée en vigueur de la stratégie, et une stratégie App Control qui approuve les applications provenant de programmes d'installation managés les laisse s'exécuter : chaque nouvelle version de Ledger s'exécute. Le marquage n'est pas rétroactif et ne couvre que les applications installées par le programme d'installation managé : Planner, installée par un script dans l'image, a besoin d'une règle explicite, par exemple dans une stratégie supplémentaire. Les stratégies App Control et de programme d'installation managé ont une étendue d'appareil uniquement.
      options:
        s2: { en: "Planner wasn't installed by the managed installer, so it isn't tagged; allow it with an explicit rule such as a supplemental policy.", fr: "Planner n'a pas été installée par le programme d'installation managé, elle n'est donc pas marquée ; autorisez-la par une règle explicite, comme une stratégie supplémentaire." }
        s3: { en: "Managed installer policies apply to devices only; on a multi-session host they affect every user, like App Control policies.", fr: "Les stratégies de programme d'installation managé s'appliquent uniquement aux appareils ; sur un hôte multisession, elles touchent tous les utilisateurs, comme les stratégies App Control." }
    references:
      - title: Manage approved apps for Windows devices with App Control for Business policy and Managed Installers for Microsoft Intune
        url: https://learn.microsoft.com/en-us/intune/device-configuration/endpoint-security/manage-app-control
      - title: Security recommendations for Azure Virtual Desktop
        url: https://learn.microsoft.com/en-us/azure/virtual-desktop/security-recommendations

  # ------------------------------------------------------------------ 8
  - id: az140-qz-22-08
    objective: "2.2.7"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Adatum has a pooled host pool named **HP-Risk**. Its 12 session hosts were deployed last month with the **Confidential virtual machines** security type, without confidential OS disk encryption. User profiles are FSLogix containers on an Azure Files share.

        A new compliance rule requires the following for HP-Risk:

        - The content of each OS disk must be accessible only to its session host, with the disk encryption keys bound to the VM's vTPM.
        - Adatum must manage the encryption keys in its own Azure Key Vault.

        You need to meet the requirements. What should you do?
      fr: |
        Adatum dispose d'un pool d'hôtes regroupé nommé **HP-Risk**. Ses 12 hôtes de session ont été déployés le mois dernier avec le type de sécurité **Confidential virtual machines**, sans chiffrement confidentiel du disque du système d'exploitation. Les profils utilisateur sont des conteneurs FSLogix sur un partage Azure Files.

        Une nouvelle règle de conformité exige ce qui suit pour HP-Risk :

        - Le contenu de chaque disque du système d'exploitation ne doit être accessible qu'à son hôte de session, avec des clés de chiffrement du disque liées au vTPM de la machine virtuelle.
        - Adatum doit gérer les clés de chiffrement dans son propre Azure Key Vault.

        Vous devez répondre aux exigences. Que devez-vous faire ?
    body:
      options:
        - id: a
          text:
            en: "Add new session hosts that use confidential OS disk encryption with a customer-managed key, and then remove the 12 existing session hosts."
            fr: "Ajouter de nouveaux hôtes de session qui utilisent le chiffrement confidentiel du disque du système d'exploitation avec une clé gérée par le client, puis supprimer les 12 hôtes de session existants."
        - id: b
          text:
            en: "Deallocate each existing session host, and then enable confidential OS disk encryption with a customer-managed key on its OS disk."
            fr: "Libérer chaque hôte de session existant, puis activer le chiffrement confidentiel du disque du système d'exploitation avec une clé gérée par le client sur son disque."
        - id: c
          text:
            en: "Create a disk encryption set that uses a customer-managed key, and then assign it to the OS disk of each existing session host."
            fr: "Créer un jeu de chiffrement de disque qui utilise une clé gérée par le client, puis l'attribuer au disque du système d'exploitation de chaque hôte de session existant."
        - id: d
          text:
            en: "Enable Azure Disk Encryption on each existing session host with a key encryption key stored in the Adatum key vault."
            fr: "Activer Azure Disk Encryption sur chaque hôte de session existant avec une clé de chiffrement de clé (KEK) stockée dans le coffre de clés d'Adatum."
    answer: { optionId: a }
    explanation:
      correct:
        en: |
          Confidential OS disk encryption binds the disk keys to the VM's vTPM so that only the VM can read the disk, and it supports platform-managed or customer-managed keys. It's chosen when the VM is created and can't be changed afterward, so the hosts must be replaced. Pooled hosts are disposable and the profiles live on Azure Files, so adding new hosts and removing the old ones loses no user data.
        fr: |
          Le chiffrement confidentiel du disque du système d'exploitation lie les clés du disque au vTPM de la machine virtuelle pour que seule celle-ci puisse lire le disque, et il prend en charge des clés gérées par la plateforme ou par le client. Il se choisit à la création de la machine virtuelle et ne peut pas être modifié ensuite : les hôtes doivent donc être remplacés. Les hôtes regroupés sont jetables et les profils résident sur Azure Files ; ajouter de nouveaux hôtes et supprimer les anciens ne fait perdre aucune donnée utilisateur.
      options:
        b: { en: "Confidential OS disk encryption can't be enabled or changed after the VM is deployed, even when the VM is deallocated.", fr: "Le chiffrement confidentiel du disque du système d'exploitation ne peut être ni activé ni modifié après le déploiement de la machine virtuelle, même quand elle est libérée." }
        c: { en: "A disk encryption set encrypts the disk at rest in storage with your key, but the keys aren't bound to the VM's vTPM.", fr: "Un jeu de chiffrement de disque chiffre le disque au repos dans le stockage avec votre clé, mais les clés ne sont pas liées au vTPM de la machine virtuelle." }
        d: { en: "Azure Disk Encryption encrypts volumes with BitLocker inside the guest; it isn't confidential OS disk encryption, and it's scheduled for retirement.", fr: "Azure Disk Encryption chiffre les volumes avec BitLocker dans l'invité ; ce n'est pas le chiffrement confidentiel du disque du système d'exploitation, et sa mise hors service est planifiée." }
    references:
      - title: About Azure confidential VMs
        url: https://learn.microsoft.com/en-us/azure/confidential-computing/confidential-vm-overview
      - title: Security recommendations for Azure Virtual Desktop
        url: https://learn.microsoft.com/en-us/azure/virtual-desktop/security-recommendations

  # ------------------------------------------------------------------ 9
  - id: az140-qz-22-09
    objective: "2.2.5"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        Woodgrove Bank configured just-in-time (JIT) VM access on the session hosts of an Azure Virtual Desktop host pool. Members of a group named **AVD-Support** must be able to request JIT access to the session hosts. They must not be able to change JIT policies or modify the virtual machines.

        You create a custom role for AVD-Support. The role already contains `Microsoft.Network/networkInterfaces/*/read` and `Microsoft.Network/publicIPAddresses/read`.

        Which three actions should you add to the custom role? Each correct answer presents part of the solution.

        NOTE: Each correct selection is worth one point.
      fr: |
        Woodgrove Bank a configuré l'accès JIT (just-in-time) aux machines virtuelles sur les hôtes de session d'un pool d'hôtes Azure Virtual Desktop. Les membres d'un groupe nommé **AVD-Support** doivent pouvoir demander l'accès JIT aux hôtes de session. Ils ne doivent pas pouvoir modifier les stratégies JIT ni modifier les machines virtuelles.

        Vous créez un rôle personnalisé pour AVD-Support. Le rôle contient déjà `Microsoft.Network/networkInterfaces/*/read` et `Microsoft.Network/publicIPAddresses/read`.

        Quelles sont les trois actions que vous devez ajouter au rôle personnalisé ? Chaque bonne réponse présente une partie de la solution.

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 3
      options:
        - { id: a, text: "`Microsoft.Security/locations/jitNetworkAccessPolicies/initiate/action`" }
        - { id: b, text: "`Microsoft.Security/locations/jitNetworkAccessPolicies/write`" }
        - { id: c, text: "`Microsoft.Security/locations/jitNetworkAccessPolicies/*/read`" }
        - { id: d, text: "`Microsoft.Compute/virtualMachines/write`" }
        - { id: e, text: "`Microsoft.Compute/virtualMachines/read`" }
        - { id: f, text: "`Microsoft.Network/networkSecurityGroups/securityRules/write`" }
    answer: { optionIds: [a, c, e] }
    explanation:
      correct:
        en: |
          Requesting JIT access requires the `initiate/action` operation on JIT network access policies, read access to those policies, and reads on the virtual machine, its network interfaces and its public IP addresses. With the two network reads already in the role, these three actions complete it without granting any write permission.
        fr: |
          Demander l'accès JIT exige l'opération `initiate/action` sur les stratégies d'accès réseau JIT, la lecture de ces stratégies, et des lectures sur la machine virtuelle, ses interfaces réseau et ses adresses IP publiques. Avec les deux lectures réseau déjà présentes dans le rôle, ces trois actions le complètent sans accorder aucune autorisation d'écriture.
      options:
        b: { en: "`jitNetworkAccessPolicies/write` is needed to configure or edit a JIT policy, which AVD-Support must not do.", fr: "`jitNetworkAccessPolicies/write` sert à configurer ou modifier une stratégie JIT, ce qu'AVD-Support ne doit pas faire." }
        d: { en: "`virtualMachines/write` belongs to the permissions that configure JIT on a VM; it would also let the group modify the VMs.", fr: "`virtualMachines/write` fait partie des autorisations de configuration de JIT sur une machine virtuelle ; il permettrait aussi au groupe de modifier les machines virtuelles." }
        f: { en: "Defender for Cloud creates the temporary NSG rule when it approves the request; the requester doesn't need write access to the NSG.", fr: "Defender pour le cloud crée la règle NSG temporaire quand il approuve la demande ; le demandeur n'a pas besoin d'un accès en écriture au NSG." }
    references:
      - title: Enable Just-in-Time Access
        url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/just-in-time-access-usage

  # ------------------------------------------------------------------ 10
  - id: az140-qz-22-10
    objective: "2.2.4"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Contoso has a hub-and-spoke network. The session hosts of a pooled host pool are in a spoke subnet whose route table sends `0.0.0.0/0` to an Azure Firewall named **FW1** in the hub. The firewall policy of FW1 has an application rule that allows the `WindowsVirtualDesktop` FQDN tag and the other required HTTPS endpoints from an IP group of the session hosts. DNS proxy is disabled, and the spoke virtual network uses the Azure-provided DNS.

        New session hosts fail to activate Windows. The firewall logs show denied traffic from the session hosts to TCP port 1688.

        You need to allow Windows activation by destination name, without allowing any other destination on that port.

        What should you do?
      fr: |
        Contoso dispose d'un réseau hub-and-spoke. Les hôtes de session d'un pool d'hôtes regroupé se trouvent dans un sous-réseau spoke dont la table de routage envoie `0.0.0.0/0` vers un Pare-feu Azure nommé **FW1** dans le hub. La stratégie de pare-feu de FW1 contient une règle d'application qui autorise l'étiquette FQDN `WindowsVirtualDesktop` et les autres points de terminaison HTTPS requis depuis un groupe IP des hôtes de session. Le proxy DNS est désactivé, et le réseau virtuel spoke utilise le DNS fourni par Azure.

        Les nouveaux hôtes de session n'arrivent pas à activer Windows. Les journaux du pare-feu montrent du trafic refusé des hôtes de session vers le port TCP 1688.

        Vous devez autoriser l'activation de Windows par nom de destination, sans autoriser aucune autre destination sur ce port.

        Que devez-vous faire ?
    body:
      options:
        - id: a
          text:
            en: "Add `azkms.core.windows.net` with port 1688 as a target FQDN of the application rule that allows the `WindowsVirtualDesktop` FQDN tag."
            fr: "Ajouter `azkms.core.windows.net` avec le port 1688 comme FQDN cible de la règle d'application qui autorise l'étiquette FQDN `WindowsVirtualDesktop`."
        - id: b
          text:
            en: "Enable DNS proxy on FW1, set FW1 as the DNS server of the spoke virtual network, and add a network rule for `azkms.core.windows.net` on TCP 1688."
            fr: "Activer le proxy DNS sur FW1, définir FW1 comme serveur DNS du réseau virtuel spoke, et ajouter une règle de réseau pour `azkms.core.windows.net` sur TCP 1688."
        - id: c
          text:
            en: "Add a route for `azkms.core.windows.net` with the next hop type Internet to the route table of the session host subnet, and restart the session hosts."
            fr: "Ajouter un itinéraire pour `azkms.core.windows.net` avec Internet comme type de tronçon suivant dans la table de routage du sous-réseau des hôtes de session, puis redémarrer les hôtes de session."
        - id: d
          text:
            en: "Add a network rule that allows TCP 1688 from the IP group of the session hosts to the `WindowsVirtualDesktop` service tag."
            fr: "Ajouter une règle de réseau qui autorise TCP 1688 depuis le groupe IP des hôtes de session vers l'étiquette de service `WindowsVirtualDesktop`."
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          Windows activation uses `azkms.core.windows.net` on TCP 1688, which isn't HTTP, HTTPS or MSSQL, so only a network rule can filter it by FQDN. FQDNs in network rules require DNS proxy, and the clients must use the firewall as their DNS server so that the firewall and the session hosts resolve the name to the same addresses.
        fr: |
          L'activation de Windows utilise `azkms.core.windows.net` sur TCP 1688, qui n'est ni HTTP, ni HTTPS, ni MSSQL : seule une règle de réseau peut le filtrer par FQDN. Les FQDN des règles de réseau exigent le proxy DNS, et les clients doivent utiliser le pare-feu comme serveur DNS pour que le pare-feu et les hôtes de session résolvent le nom vers les mêmes adresses.
      options:
        a: { en: "Application rules filter FQDNs only for HTTP, HTTPS and MSSQL; KMS on TCP 1688 must go through a network rule.", fr: "Les règles d'application ne filtrent les FQDN que pour HTTP, HTTPS et MSSQL ; KMS sur TCP 1688 doit passer par une règle de réseau." }
        c: { en: "User-defined routes take address prefixes or service tags, not FQDNs; and bypassing the firewall doesn't filter the destination.", fr: "Les itinéraires définis par l'utilisateur acceptent des préfixes d'adresse ou des étiquettes de service, pas des FQDN ; et contourner le pare-feu ne filtre pas la destination." }
        d: { en: "The KMS endpoint isn't part of the `WindowsVirtualDesktop` service tag; Microsoft lists it under the Internet service tag.", fr: "Le point de terminaison KMS ne fait pas partie de l'étiquette de service `WindowsVirtualDesktop` ; Microsoft le classe sous l'étiquette de service Internet." }
    references:
      - title: Azure Firewall FQDN filtering in network rules
        url: https://learn.microsoft.com/en-us/azure/firewall/fqdn-filtering-network-rules
      - title: Required FQDNs and endpoints for Azure Virtual Desktop
        url: https://learn.microsoft.com/en-us/azure/virtual-desktop/required-fqdn-endpoint
