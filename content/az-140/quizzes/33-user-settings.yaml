chapter: 33-user-settings
questions:
  # ------------------------------------------------------------------ 1
  - id: az140-qz-33-01
    objective: "3.2.10"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        You are creating a personal host pool named **hp-lab** in the Azure portal. The developers' session hosts will be deallocated outside working hours, and you plan to use Start VM on Connect for hp-lab.

        When and where can you turn on Start VM on Connect?
      fr: |
        Vous créez un pool d'hôtes personnel nommé **hp-lab** dans le portail Azure. Les hôtes de session des développeurs seront libérés en dehors des heures de travail, et vous prévoyez d'utiliser Start VM on Connect pour hp-lab.

        Quand et où pouvez-vous activer Start VM on Connect ?
    body:
      options:
        - { id: a, text: { en: "During the creation of hp-lab, on the Basics tab of the wizard", fr: "Pendant la création de hp-lab, dans l'onglet Informations de base de l'assistant" } }
        - { id: b, text: { en: "During the creation of hp-lab, on the Virtual Machines tab of the wizard", fr: "Pendant la création de hp-lab, dans l'onglet Machines virtuelles de l'assistant" } }
        - { id: c, text: { en: "After the creation of hp-lab, in the RDP Properties of the host pool", fr: "Après la création de hp-lab, dans les Propriétés RDP du pool d'hôtes" } }
        - { id: d, text: { en: "After the creation of hp-lab, in the Properties of the host pool", fr: "Après la création de hp-lab, dans les Propriétés du pool d'hôtes" } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          Start VM on Connect can only be configured on an existing host pool: you can't enable it while you create the host pool. Once hp-lab exists, you set **Start VM on connect** to **Yes** in the **Properties** of the host pool (or with `Update-AzWvdHostPool -StartVMOnConnect:$true`).
        fr: |
          Start VM on Connect ne se configure que sur un pool d'hôtes existant : vous ne pouvez pas l'activer pendant la création du pool d'hôtes. Une fois hp-lab créé, vous définissez **Start VM on connect** sur **Oui** dans les **Propriétés** du pool d'hôtes (ou avec `Update-AzWvdHostPool -StartVMOnConnect:$true`).
      options:
        a: { en: "The creation wizard doesn't offer the setting: it can only be enabled on an existing host pool.", fr: "L'assistant de création ne propose pas ce paramètre : il ne peut être activé que sur un pool d'hôtes existant." }
        b: { en: "The Virtual Machines tab configures the session hosts to create, not Start VM on Connect, which needs an existing host pool.", fr: "L'onglet Machines virtuelles configure les hôtes de session à créer, pas Start VM on Connect, qui exige un pool d'hôtes existant." }
        c: { en: "RDP properties define the connection settings in the .rdp file; Start VM on Connect is a host pool property, not an RDP property.", fr: "Les propriétés RDP définissent les paramètres de connexion du fichier .rdp ; Start VM on Connect est une propriété du pool d'hôtes, pas une propriété RDP." }
    references:
      - title: Configure Start VM on Connect for Azure Virtual Desktop - Azure Virtual Desktop
        url: https://learn.microsoft.com/en-us/azure/virtual-desktop/start-virtual-machine-connect

  # ------------------------------------------------------------------ 2
  - id: az140-qz-33-02
    objective: "3.2.7"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Litware has a pooled host pool named **hp-sales**. Litware has no Active Directory Domain Services (AD DS) domain, and you are adding session hosts that will be Microsoft Entra joined.

        The session hosts must be managed by Microsoft Intune. The solution must minimize administrative effort.

        What should you do?
      fr: |
        Litware dispose d'un pool d'hôtes regroupé nommé **hp-sales**. Litware n'a pas de domaine Active Directory Domain Services (AD DS), et vous ajoutez des hôtes de session qui seront joints à Microsoft Entra.

        Les hôtes de session doivent être gérés par Microsoft Intune. La solution doit réduire au minimum l'effort administratif.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Enable Intune enrollment of the VMs in the session host deployment settings.", fr: "Activer l'inscription des machines virtuelles auprès d'Intune dans les paramètres de déploiement des hôtes de session." } }
        - { id: b, text: { en: "Register the session hosts with Windows Autopilot before you add them to hp-sales.", fr: "Inscrire les hôtes de session dans Windows Autopilot avant de les ajouter à hp-sales." } }
        - { id: c, text: { en: "Configure automatic MDM enrollment with device credentials by using Group Policy.", fr: "Configurer l'inscription MDM automatique avec les informations d'identification d'appareil au moyen d'une stratégie de groupe." } }
        - { id: d, text: { en: "Ask each user to enroll the session host from Access work or school in Windows Settings.", fr: "Demander à chaque utilisateur d'inscrire l'hôte de session depuis Accès Professionnel ou Scolaire dans les Paramètres Windows." } }
    answer: { optionId: a }
    explanation:
      correct:
        en: |
          Microsoft Entra joined session hosts are enrolled in Intune by enabling **Enroll the VM with Intune** when you add them to the host pool in the Azure portal. Each new session host is then joined and enrolled automatically, with no extra step.
        fr: |
          Les hôtes de session joints à Microsoft Entra s'inscrivent dans Intune en activant l'option d'inscription de la machine virtuelle auprès d'Intune quand vous les ajoutez au pool d'hôtes dans le portail Azure. Chaque nouvel hôte de session est alors joint et inscrit automatiquement, sans étape supplémentaire.
      options:
        b: { en: "Windows Autopilot and out-of-box enrollment aren't supported for Windows Enterprise multi-session.", fr: "Windows Autopilot et l'inscription lors de l'OOBE ne sont pas pris en charge pour Windows Entreprise multisession." }
        c: { en: "Group Policy auto-enrollment is the method for Microsoft Entra hybrid joined hosts; Litware has no AD DS domain to deliver the GPO.", fr: "L'inscription automatique par stratégie de groupe est la méthode des hôtes joints à Microsoft Entra hybride ; Litware n'a pas de domaine AD DS pour délivrer le GPO." }
        d: { en: "Enrollment with user credentials isn't supported for multi-session hosts, and it would require an action from each user.", fr: "L'inscription avec des informations d'identification utilisateur n'est pas prise en charge pour les hôtes multisession, et elle exigerait une action de chaque utilisateur." }
    references:
      - title: Using Azure Virtual Desktop multi-session with Microsoft Intune - Microsoft Intune
        url: https://learn.microsoft.com/en-us/intune/intune-service/fundamentals/azure-virtual-desktop-multi-session

  # ------------------------------------------------------------------ 3
  - id: az140-qz-33-03
    objective: "3.2.9"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Contoso has a pooled host pool named **hp-mixed** whose session hosts are domain-joined. hp-mixed publishes full desktops to analysts and, through a RemoteApp application group, individual applications to sales users.

        When sales users close their last published application, their sessions stay disconnected on the session hosts indefinitely. You need these sessions to be signed out 15 minutes after the last application is closed. Analysts often disconnect from their desktop in the evening and must find their desktop session as they left it the next morning.

        Which Group Policy setting should you configure for the session hosts?
      fr: |
        Contoso dispose d'un pool d'hôtes regroupé nommé **hp-mixed** dont les hôtes de session sont joints au domaine. hp-mixed publie des bureaux complets pour les analystes et, par un groupe d'applications RemoteApp, des applications individuelles pour les commerciaux.

        Quand les commerciaux ferment leur dernière application publiée, leurs sessions restent déconnectées indéfiniment sur les hôtes de session. Vous devez faire en sorte que ces sessions soient fermées 15 minutes après la fermeture de la dernière application. Les analystes se déconnectent souvent de leur bureau le soir et doivent retrouver leur session de bureau telle qu'ils l'ont laissée le lendemain matin.

        Quel paramètre de stratégie de groupe devez-vous configurer pour les hôtes de session ?
    body:
      options:
        - { id: a, text: Set time limit for disconnected sessions }
        - { id: b, text: Set time limit for logoff of RemoteApp sessions }
        - { id: c, text: Set time limit for active but idle Remote Desktop Services sessions }
        - { id: d, text: End session when time limits are reached }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          When all RemoteApp windows are closed, the session is disconnected and, by default, stays disconnected indefinitely. **Set time limit for logoff of RemoteApp sessions** signs out these disconnected RemoteApp sessions after the configured delay, and it doesn't apply to the analysts' desktop sessions.
        fr: |
          Quand toutes les fenêtres RemoteApp sont fermées, la session est déconnectée et, par défaut, le reste indéfiniment. **Set time limit for logoff of RemoteApp sessions** ferme ces sessions RemoteApp déconnectées après le délai configuré, et ne s'applique pas aux sessions de bureau des analystes.
      options:
        a: { en: "A 15-minute disconnected limit would also sign out the analysts' disconnected desktop sessions overnight.", fr: "Une limite de 15 minutes pour les sessions déconnectées fermerait aussi les sessions de bureau déconnectées des analystes pendant la nuit." }
        c: { en: "The idle limit applies to connected sessions without input; these sessions are already disconnected.", fr: "La limite d'inactivité s'applique aux sessions connectées sans saisie ; ces sessions sont déjà déconnectées." }
        d: { en: "End session changes what happens when the idle or active limit is reached; it sets no delay for disconnected RemoteApp sessions.", fr: "End session modifie ce qui se passe quand la limite d'inactivité ou d'activité est atteinte ; il ne fixe aucun délai pour les sessions RemoteApp déconnectées." }
    references:
      - title: RemoteApp sessions are disconnected - Windows Server
        url: https://learn.microsoft.com/en-us/troubleshoot/windows-server/remote/remoteapp-sessions-disconnected
      - title: Configure session timeout properties - Training
        url: https://learn.microsoft.com/en-us/training/modules/configure-user-experience-settings/6-configure-session-timeout-properties

  # ------------------------------------------------------------------ 4
  - id: az140-qz-33-04
    objective: "3.2.8"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Fabrikam has several Azure Virtual Desktop host pools in a resource group named **rg-avd**. Members of a group named **G-AVD-Display** must be able to change the RDP properties of a host pool named **hp-design**, and only of that host pool.

        The solution must follow the principle of least privilege.

        Which role should you assign to G-AVD-Display on hp-design?
      fr: |
        Fabrikam dispose de plusieurs pools d'hôtes Azure Virtual Desktop dans un groupe de ressources nommé **rg-avd**. Les membres d'un groupe nommé **G-AVD-Display** doivent pouvoir modifier les propriétés RDP d'un pool d'hôtes nommé **hp-design**, et de ce seul pool d'hôtes.

        La solution doit respecter le principe du moindre privilège.

        Quel rôle devez-vous attribuer à G-AVD-Display sur hp-design ?
    body:
      options:
        - { id: a, text: Desktop Virtualization Session Host Operator }
        - { id: b, text: Desktop Virtualization Host Pool Reader }
        - { id: c, text: Desktop Virtualization Host Pool Contributor }
        - { id: d, text: Desktop Virtualization Application Group Contributor }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          RDP properties are a setting of the host pool, and changing them requires the Desktop Virtualization Host Pool Contributor role or equivalent. Assigned on hp-design, the role manages that host pool only and gives no right on the other host pools of rg-avd.
        fr: |
          Les propriétés RDP sont un paramètre du pool d'hôtes, et leur modification exige le rôle Desktop Virtualization Host Pool Contributor ou équivalent. Attribué sur hp-design, le rôle ne gère que ce pool d'hôtes et ne donne aucun droit sur les autres pools d'hôtes de rg-avd.
      options:
        a: { en: "Session Host Operator views and removes session hosts and changes drain mode; it can't change host pool properties.", fr: "Session Host Operator consulte et supprime des hôtes de session et modifie le mode de drainage ; il ne peut pas modifier les propriétés du pool d'hôtes." }
        b: { en: "Host Pool Reader views every aspect of the host pool but can't make any change.", fr: "Host Pool Reader consulte tous les aspects du pool d'hôtes mais ne peut rien modifier." }
        d: { en: "Application Group Contributor manages application groups, not the RDP properties, which belong to the host pool.", fr: "Application Group Contributor gère les groupes d'applications, pas les propriétés RDP, qui appartiennent au pool d'hôtes." }
    references:
      - title: Built-in Azure RBAC roles Azure Virtual Desktop - Azure Virtual Desktop
        url: https://learn.microsoft.com/en-us/azure/virtual-desktop/rbac

  # ------------------------------------------------------------------ 5
  - id: az140-qz-33-05
    objective: "3.2.7"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Adatum has a pooled host pool named **hp-ops**. The session hosts run Windows 11 Enterprise multi-session and are Microsoft Entra hybrid joined. Adatum doesn't use Configuration Manager.

        A GPO linked to the organizational unit (OU) of the session hosts enables **Enable automatic MDM enrollment using default Microsoft Entra credentials** with the credential type set to **User Credential**. The session hosts never appear as enrolled devices in Microsoft Intune.

        You need the session hosts to be enrolled in Intune. What should you do?
      fr: |
        Adatum dispose d'un pool d'hôtes regroupé nommé **hp-ops**. Les hôtes de session exécutent Windows 11 Entreprise multisession et sont joints à Microsoft Entra hybride. Adatum n'utilise pas Configuration Manager.

        Un GPO lié à l'unité d'organisation (UO) des hôtes de session active **Enable automatic MDM enrollment using default Microsoft Entra credentials** avec le type d'informations d'identification défini sur **User Credential**. Les hôtes de session n'apparaissent jamais comme appareils inscrits dans Microsoft Intune.

        Vous devez faire en sorte que les hôtes de session soient inscrits dans Intune. Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Redeploy the session hosts with the option to enroll the VMs with Intune enabled.", fr: "Redéployer les hôtes de session avec l'option d'inscription des machines virtuelles auprès d'Intune activée." } }
        - { id: b, text: { en: "Link the GPO to the OU of the users so that it runs with each user's credentials.", fr: "Lier le GPO à l'UO des utilisateurs pour qu'il s'exécute avec les informations d'identification de chaque utilisateur." } }
        - { id: c, text: { en: "Register the session hosts as Windows Autopilot devices, then restart them.", fr: "Inscrire les hôtes de session comme appareils Windows Autopilot, puis les redémarrer." } }
        - { id: d, text: { en: "Change the credential type of the GPO setting to Device Credential.", fr: "Changer le type d'informations d'identification du paramètre du GPO en Device Credential." } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          Microsoft Entra hybrid joined multi-session hosts must be enrolled with device credentials, through Group Policy auto-enrollment or Configuration Manager co-management; enrollment with user credentials isn't supported. Setting **Select Credential Type to Use** to **Device Credential** in the same GPO lets the session hosts enroll.
        fr: |
          Les hôtes multisession joints à Microsoft Entra hybride doivent s'inscrire avec des informations d'identification d'appareil, par l'inscription automatique par stratégie de groupe ou la cogestion Configuration Manager ; l'inscription avec des informations d'identification utilisateur n'est pas prise en charge. Définir **Select Credential Type to Use** sur **Device Credential** dans le même GPO permet aux hôtes de session de s'inscrire.
      options:
        a: { en: "The Intune enrollment option of the session host deployment applies to Microsoft Entra joined session hosts, not to hybrid joined ones.", fr: "L'option d'inscription auprès d'Intune du déploiement des hôtes de session concerne les hôtes de session joints à Microsoft Entra, pas les hôtes joints hybrides." }
        b: { en: "The enrollment policy is a computer setting, and user-credential enrollment is exactly what multi-session hosts don't support.", fr: "La stratégie d'inscription est un paramètre ordinateur, et l'inscription avec les informations d'identification utilisateur est justement ce que les hôtes multisession ne prennent pas en charge." }
        c: { en: "Windows Autopilot isn't supported for Windows Enterprise multi-session.", fr: "Windows Autopilot n'est pas pris en charge pour Windows Entreprise multisession." }
    references:
      - title: Using Azure Virtual Desktop multi-session with Microsoft Intune - Microsoft Intune
        url: https://learn.microsoft.com/en-us/intune/intune-service/fundamentals/azure-virtual-desktop-multi-session
      - title: Enroll a Windows device automatically using Group Policy
        url: https://learn.microsoft.com/en-us/windows/client-management/enroll-a-windows-10-device-automatically-using-group-policy

  # ------------------------------------------------------------------ 6
  - id: az140-qz-33-06
    objective: "3.2.10"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        Tailspin Toys has a personal host pool named **hp-eng** that uses the Automatic assignment type. hp-eng is in a resource group named **rg-avd**, and its 20 session host VMs are in a resource group named **rg-eng-vms** of the same subscription. A system-assigned managed identity is enabled on hp-eng.

        You plan to use Start VM on Connect so that the session hosts can stay deallocated when nobody uses them. Every session host is currently deallocated, and 15 of them are assigned to engineers.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Tailspin Toys dispose d'un pool d'hôtes personnel nommé **hp-eng** qui utilise le type d'attribution Automatique. hp-eng se trouve dans un groupe de ressources nommé **rg-avd**, et ses 20 machines virtuelles d'hôtes de session se trouvent dans un groupe de ressources nommé **rg-eng-vms** du même abonnement. Une identité managée affectée par le système est activée sur hp-eng.

        Vous prévoyez d'utiliser Start VM on Connect pour que les hôtes de session puissent rester libérés quand personne ne les utilise. Tous les hôtes de session sont actuellement libérés, et 15 d'entre eux sont attribués à des ingénieurs.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text: { en: "If you assign the Desktop Virtualization Power On Contributor role to the managed identity of hp-eng on rg-avd only, Start VM on Connect can start the session hosts.", fr: "Si vous attribuez le rôle Desktop Virtualization Power On Contributor à l'identité managée de hp-eng sur rg-avd uniquement, Start VM on Connect peut démarrer les hôtes de session." }
        - id: s2
          text: { en: "Once the feature is working, a new engineer who connects for the first time gets one of the unassigned session hosts, which is started for that engineer.", fr: "Une fois la fonctionnalité opérationnelle, un nouvel ingénieur qui se connecte pour la première fois reçoit l'un des hôtes de session non attribués, qui est démarré pour lui." }
        - id: s3
          text: { en: "An administrator who holds only the Desktop Virtualization Host Pool Contributor role on hp-eng can turn on Start VM on Connect for hp-eng.", fr: "Un administrateur qui détient uniquement le rôle Desktop Virtualization Host Pool Contributor sur hp-eng peut activer Start VM on Connect pour hp-eng." }
    answer:
      values: { s1: false, s2: true, s3: true }
    explanation:
      correct:
        en: |
          The Power On role can go to the Azure Virtual Desktop service principal or to the managed identity of the host pool, but its scope must contain the session host VMs, which are in rg-eng-vms. In a personal host pool, Start VM on Connect powers on the VM assigned to the user or one that can be assigned to them, so a new engineer gets an unassigned VM, started for them. Turning the setting on is a host pool change, which the Desktop Virtualization Host Pool Contributor role allows.
        fr: |
          Le rôle Power On peut aller au principal de service Azure Virtual Desktop ou à l'identité managée du pool d'hôtes, mais son étendue doit contenir les machines virtuelles des hôtes de session, qui se trouvent dans rg-eng-vms. Dans un pool d'hôtes personnel, Start VM on Connect démarre la machine virtuelle attribuée à l'utilisateur ou une qui peut lui être attribuée : un nouvel ingénieur reçoit donc une machine virtuelle non attribuée, démarrée pour lui. Activer le paramètre est une modification du pool d'hôtes, que permet le rôle Desktop Virtualization Host Pool Contributor.
      options:
        s1: { en: "rg-avd contains the host pool but not the VMs: the role must be assigned at a scope that contains rg-eng-vms, such as rg-eng-vms or the subscription.", fr: "rg-avd contient le pool d'hôtes mais pas les machines virtuelles : le rôle doit être attribué à une étendue qui contient rg-eng-vms, comme rg-eng-vms ou l'abonnement." }
    references:
      - title: Configure Start VM on Connect for Azure Virtual Desktop - Azure Virtual Desktop
        url: https://learn.microsoft.com/en-us/azure/virtual-desktop/start-virtual-machine-connect

  # ------------------------------------------------------------------ 7
  - id: az140-qz-33-07
    objective: "3.2.8"
    difficulty: 3
    status: draft
    type: dropdown
    stem:
      en: |
        Woodgrove Bank has a pooled host pool named **hp-traders** in a resource group named **rg-avd**. The session hosts are joined to an Active Directory Domain Services (AD DS) domain, and hp-traders has no custom RDP properties. Users connect from Windows devices by using Windows App.

        You need to configure hp-traders to meet the following requirements:

        - Users who connect from outside the corporate network get Kerberos tickets through the KDC proxy published at `kdc.woodgrove.com`.
        - Windows key combinations such as Alt+Tab apply to the remote desktop whenever its window has the focus, including when it isn't full screen.
        - The resolution of the session doesn't change when users resize the window, and the content isn't scaled to the window.

        How should you complete the Azure CLI command? Select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Woodgrove Bank dispose d'un pool d'hôtes regroupé nommé **hp-traders** dans un groupe de ressources nommé **rg-avd**. Les hôtes de session sont joints à un domaine Active Directory Domain Services (AD DS), et hp-traders n'a aucune propriété RDP personnalisée. Les utilisateurs se connectent depuis des appareils Windows avec Windows App.

        Vous devez configurer hp-traders pour répondre aux exigences suivantes :

        - Les utilisateurs qui se connectent depuis l'extérieur du réseau de l'entreprise obtiennent leurs tickets Kerberos par le proxy KDC publié sur `kdc.woodgrove.com`.
        - Les combinaisons de touches Windows comme Alt+Tab s'appliquent au bureau à distance dès que sa fenêtre a le focus, y compris quand il n'est pas en plein écran.
        - La résolution de la session ne change pas quand les utilisateurs redimensionnent la fenêtre, et le contenu n'est pas mis à l'échelle de la fenêtre.

        Comment devez-vous compléter la commande Azure CLI ? Sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: code
      language: bash
      template: |
        az desktopvirtualization hostpool update \
          --resource-group rg-avd --name hp-traders \
          --custom-rdp-property "[[kdc]];[[keys]];[[res]];"
      slots:
        - id: kdc
          options:
            - { id: rdsaad, text: "enablerdsaadauth:i:1" }
            - { id: kdcproxy, text: "kdcproxyname:s:kdc.woodgrove.com" }
            - { id: aadjoined, text: "targetisaadjoined:i:1" }
            - { id: credssp, text: "enablecredsspsupport:i:0" }
        - id: keys
          options:
            - { id: kh0, text: "keyboardhook:i:0" }
            - { id: kh1, text: "keyboardhook:i:1" }
            - { id: kh2, text: "keyboardhook:i:2" }
        - id: res
          options:
            - { id: dyn1, text: "dynamic resolution:i:1" }
            - { id: smart, text: "smart sizing:i:1" }
            - { id: dyn0, text: "dynamic resolution:i:0" }
    answer:
      values: { kdc: kdcproxy, keys: kh1, res: dyn0 }
    explanation:
      correct:
        en: |
          `kdcproxyname:s:` gives the FQDN of the Kerberos KDC proxy that clients use outside the corporate network. `keyboardhook:i:1` sends Windows key combinations to the remote desktop when its window has the focus, whereas the default value 2 does so only in full screen. `dynamic resolution:i:0` keeps the resolution static when the window is resized, and leaving `smart sizing` at its default doesn't scale the content.
        fr: |
          `kdcproxyname:s:` indique le FQDN du proxy KDC Kerberos que les clients utilisent hors du réseau de l'entreprise. `keyboardhook:i:1` envoie les combinaisons de touches Windows au bureau à distance quand sa fenêtre a le focus, alors que la valeur par défaut 2 ne le fait qu'en plein écran. `dynamic resolution:i:0` garde la résolution statique quand la fenêtre est redimensionnée, et laisser `smart sizing` à sa valeur par défaut ne met pas le contenu à l'échelle.
      options:
        rdsaad: { en: "enablerdsaadauth enables single sign-on with Microsoft Entra authentication; it doesn't use a KDC proxy.", fr: "enablerdsaadauth active l'authentification unique avec l'authentification Microsoft Entra ; il n'utilise pas de proxy KDC." }
        aadjoined: { en: "targetisaadjoined is a legacy property for Microsoft Entra joined session hosts; these hosts are AD DS domain-joined.", fr: "targetisaadjoined est une propriété héritée pour les hôtes de session joints à Microsoft Entra ; ces hôtes sont joints à un domaine AD DS." }
        credssp: { en: "Disabling CredSSP changes how credentials are passed; it doesn't route Kerberos traffic through a proxy.", fr: "Désactiver CredSSP modifie la transmission des informations d'identification ; cela ne fait pas passer Kerberos par un proxy." }
        kh0: { en: "The value 0 keeps Windows key combinations on the local device.", fr: "La valeur 0 garde les combinaisons de touches Windows sur l'appareil local." }
        kh2: { en: "The value 2, the default, applies the key combinations to the session only in full screen.", fr: "La valeur 2, par défaut, n'applique les combinaisons de touches à la session qu'en plein écran." }
        dyn1: { en: "The value 1, the default, updates the resolution when the window is resized.", fr: "La valeur 1, par défaut, met à jour la résolution quand la fenêtre est redimensionnée." }
        smart: { en: "Smart sizing scales the content to the window, which the requirement excludes.", fr: "Smart sizing met le contenu à l'échelle de la fenêtre, ce que l'exigence exclut." }
    references:
      - title: Supported RDP properties - Azure Virtual Desktop
        url: https://learn.microsoft.com/en-us/azure/virtual-desktop/rdp-properties

  # ------------------------------------------------------------------ 8
  - id: az140-qz-33-08
    objective: "3.2.7"
    difficulty: 3
    status: draft
    type: dropdown
    stem:
      en: |
        Northwind Traders has an Active Directory Domain Services (AD DS) domain. The Azure Virtual Desktop session hosts are domain-joined and are in an organizational unit (OU) named **AVD-Hosts**. User accounts are in an OU named **Staff**, where a GPO named **GPO-Staff** configures user settings such as drive mappings and the desktop wallpaper for the users' physical PCs.

        You create a GPO named **GPO-AVD-User** that contains the Start menu and desktop settings for remote sessions. You need to meet the following requirements:

        - When users sign in to a session host, they receive the user settings of GPO-AVD-User, and none of the user settings of GPO-Staff.
        - On the physical PCs, the users keep receiving GPO-Staff.

        How should you complete the configuration? Select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Northwind Traders dispose d'un domaine Active Directory Domain Services (AD DS). Les hôtes de session Azure Virtual Desktop sont joints au domaine et se trouvent dans une unité d'organisation (UO) nommée **AVD-Hosts**. Les comptes d'utilisateur se trouvent dans une UO nommée **Staff**, où un GPO nommé **GPO-Staff** configure des paramètres utilisateur comme les mappages de lecteurs et le fond d'écran pour les PC physiques des utilisateurs.

        Vous créez un GPO nommé **GPO-AVD-User** qui contient les paramètres du menu Démarrer et du bureau pour les sessions distantes. Vous devez répondre aux exigences suivantes :

        - Quand les utilisateurs se connectent à un hôte de session, ils reçoivent les paramètres utilisateur de GPO-AVD-User, et aucun des paramètres utilisateur de GPO-Staff.
        - Sur les PC physiques, les utilisateurs continuent de recevoir GPO-Staff.

        Comment devez-vous compléter la configuration ? Sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: text
      template:
        en: |
          Link GPO-AVD-User to: [[link]]

          Configure the Start menu and desktop settings of GPO-AVD-User in: [[section]]

          In GPO-AVD-User, enable **Configure user Group Policy loopback processing mode** under: [[loopsec]]

          Loopback processing mode: [[mode]]
        fr: |
          Lier GPO-AVD-User à : [[link]]

          Configurer les paramètres du menu Démarrer et du bureau de GPO-AVD-User dans : [[section]]

          Dans GPO-AVD-User, activer **Configure user Group Policy loopback processing mode** sous : [[loopsec]]

          Mode de traitement en boucle de rappel : [[mode]]
      slots:
        - id: link
          options:
            - { id: staff, text: { en: "The Staff OU", fr: "L'UO Staff" } }
            - { id: hosts, text: { en: "The AVD-Hosts OU", fr: "L'UO AVD-Hosts" } }
            - { id: domain, text: { en: "The domain", fr: "Le domaine" } }
        - id: section
          options:
            - { id: usercfg, text: { en: "User Configuration", fr: "Configuration utilisateur" } }
            - { id: compcfg, text: { en: "Computer Configuration", fr: "Configuration ordinateur" } }
        - id: loopsec
          options:
            - { id: userpath, text: { en: "User Configuration > Policies > Administrative Templates > System > Group Policy", fr: "Configuration utilisateur > Stratégies > Modèles d'administration > Système > Stratégie de groupe" } }
            - { id: comppath, text: { en: "Computer Configuration > Policies > Administrative Templates > System > Group Policy", fr: "Configuration ordinateur > Stratégies > Modèles d'administration > Système > Stratégie de groupe" } }
            - { id: rdshpath, text: { en: "Computer Configuration > Policies > Administrative Templates > Windows Components > Remote Desktop Services > Remote Desktop Session Host", fr: "Configuration ordinateur > Stratégies > Modèles d'administration > Composants Windows > Services Bureau à distance > Hôte de session Bureau à distance" } }
        - id: mode
          options:
            - { id: merge, text: { en: "Merge", fr: "Fusion" } }
            - { id: replace, text: { en: "Replace", fr: "Remplacer" } }
    answer:
      values: { link: hosts, section: usercfg, loopsec: comppath, mode: replace }
    explanation:
      correct:
        en: |
          Loopback processing applies the User Configuration settings of the GPOs that apply to the computer, so GPO-AVD-User is linked to the OU of the session hosts and its settings are user settings. The loopback setting itself is a computer setting under **Computer Configuration > Policies > Administrative Templates > System > Group Policy**. In Replace mode, the GPO list of the user isn't gathered at all, so GPO-Staff doesn't apply on the session hosts, while it still applies on the physical PCs.
        fr: |
          Le traitement en boucle de rappel applique les paramètres de Configuration utilisateur des GPO qui s'appliquent à l'ordinateur : GPO-AVD-User est donc lié à l'UO des hôtes de session et ses paramètres sont des paramètres utilisateur. Le paramètre de boucle de rappel lui-même est un paramètre ordinateur sous **Configuration ordinateur > Stratégies > Modèles d'administration > Système > Stratégie de groupe**. En mode Remplacer, la liste des GPO de l'utilisateur n'est pas du tout collectée : GPO-Staff ne s'applique donc pas sur les hôtes de session, alors qu'il s'applique toujours sur les PC physiques.
      options:
        staff: { en: "A GPO linked to Staff applies to the users wherever they sign in, including on their physical PCs.", fr: "Un GPO lié à Staff s'applique aux utilisateurs où qu'ils se connectent, y compris sur leurs PC physiques." }
        domain: { en: "Linked to the domain, GPO-AVD-User and its loopback setting would also apply to the physical PCs, where GPO-Staff would then be replaced.", fr: "Lié au domaine, GPO-AVD-User et son paramètre de boucle de rappel s'appliqueraient aussi aux PC physiques, où GPO-Staff serait alors remplacé." }
        compcfg: { en: "Start menu and desktop settings for the user are user settings; loopback exists to apply them based on the computer.", fr: "Les paramètres du menu Démarrer et du bureau de l'utilisateur sont des paramètres utilisateur ; la boucle de rappel sert à les appliquer en fonction de l'ordinateur." }
        merge: { en: "Merge adds the computer's GPOs after the user's GPOs, so the user settings of GPO-Staff would still apply where they don't conflict.", fr: "Fusion ajoute les GPO de l'ordinateur après ceux de l'utilisateur : les paramètres utilisateur de GPO-Staff s'appliqueraient donc encore là où ils n'entrent pas en conflit." }
    references:
      - title: Group Policy processing for Windows
        url: https://learn.microsoft.com/en-us/windows-server/identity/ad-ds/manage/group-policy/group-policy-processing

  # ------------------------------------------------------------------ 9
  - id: az140-qz-33-09
    objective: "3.2.9"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        Contoso has two pooled host pools. The session hosts run Windows 11 Enterprise multi-session with the latest cumulative updates.

        | Host pool | Session host identity | Authentication |
        | --- | --- | --- |
        | hp-cloud | Microsoft Entra joined | Single sign-on with Microsoft Entra ID (`enablerdsaadauth:i:1`) |
        | hp-legacy | Domain-joined | User name and password (CredSSP), no single sign-on |

        No session lock setting is configured. The hp-cloud session hosts have the following policies: **Interactive logon: Machine inactivity limit** = 900 seconds, and **Set time limit for disconnected sessions** = 1 hour. No other time limit is configured.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Contoso dispose de deux pools d'hôtes regroupés. Les hôtes de session exécutent Windows 11 Entreprise multisession avec les dernières mises à jour cumulatives.

        | Pool d'hôtes | Identité des hôtes de session | Authentification |
        | --- | --- | --- |
        | hp-cloud | Joints à Microsoft Entra | Authentification unique avec Microsoft Entra ID (`enablerdsaadauth:i:1`) |
        | hp-legacy | Joints au domaine | Nom d'utilisateur et mot de passe (CredSSP), sans authentification unique |

        Aucun paramètre de verrouillage de session n'est configuré. Les hôtes de session de hp-cloud ont les stratégies suivantes : **Interactive logon: Machine inactivity limit** = 900 secondes, et **Set time limit for disconnected sessions** = 1 heure. Aucune autre limite de durée n'est configurée.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text: { en: "A user of hp-cloud who stops using the session at 10:00 and doesn't come back is signed out at about 11:15.", fr: "Un utilisateur de hp-cloud qui cesse d'utiliser la session à 10:00 et ne revient pas voit sa session fermée vers 11:15." }
        - id: s2
          text: { en: "When a user of hp-legacy locks the session, the remote lock screen is shown in the session.", fr: "Quand un utilisateur de hp-legacy verrouille la session, l'écran de verrouillage distant s'affiche dans la session." }
        - id: s3
          text: { en: "Enabling Disconnect remote session on lock for Microsoft identity platform authentication on the hp-legacy session hosts makes hp-legacy sessions disconnect when they're locked.", fr: "Activer Disconnect remote session on lock for Microsoft identity platform authentication sur les hôtes de session de hp-legacy fait se déconnecter les sessions de hp-legacy quand elles sont verrouillées." }
    answer:
      values: { s1: true, s2: true, s3: false }
    explanation:
      correct:
        en: |
          The inactivity limit locks the idle hp-cloud session at about 10:15. With single sign-on through Microsoft Entra ID, a locked session is disconnected by default, and the disconnected session limit then signs it out one hour later, at about 11:15. With legacy authentication such as CredSSP, the default on lock is the remote lock screen; changing it requires **Disconnect remote session on lock for legacy authentication**, not the Microsoft identity platform setting.
        fr: |
          La limite d'inactivité verrouille la session inactive de hp-cloud vers 10:15. Avec l'authentification unique par Microsoft Entra ID, une session verrouillée est déconnectée par défaut, puis la limite des sessions déconnectées la ferme une heure plus tard, vers 11:15. Avec une authentification héritée comme CredSSP, le comportement par défaut au verrouillage est l'écran de verrouillage distant ; le modifier exige **Disconnect remote session on lock for legacy authentication**, pas le paramètre de la plateforme d'identités Microsoft.
      options:
        s3: { en: "The Microsoft identity platform setting applies to sessions that use Microsoft Entra single sign-on; hp-legacy uses legacy authentication.", fr: "Le paramètre de la plateforme d'identités Microsoft s'applique aux sessions qui utilisent l'authentification unique Microsoft Entra ; hp-legacy utilise une authentification héritée." }
    references:
      - title: Configure the session lock behavior for Azure Virtual Desktop - Azure Virtual Desktop
        url: https://learn.microsoft.com/en-us/azure/virtual-desktop/configure-session-lock-behavior

  # ------------------------------------------------------------------ 10
  - id: az140-qz-33-10
    objective: "3.2.11"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        Fabrikam has a personal host pool named **hp-dev** that uses the Automatic assignment type. Developers are assigned individually to the desktop application group of hp-dev. The session hosts include:

        | Session host | Assigned user | Notes |
        | --- | --- | --- |
        | SH3 | Bob | Bob has left the company |
        | SH9 | None | Standard session host |
        | SH10 | None | GPU session host |

        You need to meet the following requirements:

        - A new developer named Ana must connect to SH10 at her first connection.
        - Bob must no longer be able to connect to any desktop of hp-dev.
        - SH3 must be available to the next new developer who connects, without an administrator choosing the session host.
        - New developers other than Ana must keep receiving a desktop automatically.

        Which three actions should you perform? Each correct answer presents part of the solution.

        NOTE: Each correct selection is worth one point.
      fr: |
        Fabrikam dispose d'un pool d'hôtes personnel nommé **hp-dev** qui utilise le type d'attribution Automatique. Les développeurs sont affectés individuellement au groupe d'applications de bureau de hp-dev. Les hôtes de session comprennent :

        | Hôte de session | Utilisateur attribué | Remarques |
        | --- | --- | --- |
        | SH3 | Bob | Bob a quitté l'entreprise |
        | SH9 | Aucun | Hôte de session standard |
        | SH10 | Aucun | Hôte de session GPU |

        Vous devez répondre aux exigences suivantes :

        - Une nouvelle développeuse nommée Ana doit se connecter à SH10 dès sa première connexion.
        - Bob ne doit plus pouvoir se connecter à aucun bureau de hp-dev.
        - SH3 doit être disponible pour le prochain nouveau développeur qui se connecte, sans qu'un administrateur choisisse l'hôte de session.
        - Les nouveaux développeurs autres qu'Ana doivent continuer à recevoir un bureau automatiquement.

        Quelles sont les trois actions que vous devez effectuer ? Chaque bonne réponse présente une partie de la solution.

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 3
      options:
        - { id: a, text: { en: "Remove Bob from the desktop application group of hp-dev.", fr: "Retirer Bob du groupe d'applications de bureau de hp-dev." } }
        - { id: b, text: { en: "Change the assignment type of hp-dev to Direct.", fr: "Changer le type d'attribution de hp-dev en Direct." } }
        - { id: c, text: { en: "In Session hosts, select SH3, then select Assignment > Unassign user.", fr: "Dans Hôtes de session, sélectionner SH3, puis Attribution > Annuler l'attribution de l'utilisateur." } }
        - { id: d, text: { en: "Turn on drain mode for SH3 so that Bob's sessions are refused.", fr: "Activer le mode de drainage sur SH3 pour que les sessions de Bob soient refusées." } }
        - { id: e, text: { en: "Add Ana to the desktop application group, then assign SH10 to Ana.", fr: "Ajouter Ana au groupe d'applications de bureau, puis lui attribuer SH10." } }
        - { id: f, text: { en: "Clear the assigned user of SH3 by using Azure CLI.", fr: "Effacer l'utilisateur attribué de SH3 au moyen d'Azure CLI." } }
    answer: { optionIds: [a, c, e] }
    explanation:
      correct:
        en: |
          Removing Bob from the application group takes away his access to the desktops of hp-dev, and unassigning him from SH3 frees the session host so that automatic assignment can give it to the next new developer. Even with the Automatic type, you can assign a user directly to a session host before the first connection, so Ana is added to the application group and assigned to SH10 while the other new developers keep automatic assignment.
        fr: |
          Retirer Bob du groupe d'applications lui retire l'accès aux bureaux de hp-dev, et annuler son attribution sur SH3 libère l'hôte de session pour que l'attribution automatique le donne au prochain nouveau développeur. Même avec le type Automatique, vous pouvez attribuer directement un utilisateur à un hôte de session avant sa première connexion : Ana est donc ajoutée au groupe d'applications et SH10 lui est attribué, pendant que les autres nouveaux développeurs gardent l'attribution automatique.
      options:
        b: { en: "With Direct assignment, a new developer without a session host assignment gets No resources available, which breaks the last requirement.", fr: "Avec l'attribution directe, un nouveau développeur sans attribution d'hôte de session reçoit No resources available, ce qui enfreint la dernière exigence." }
        d: { en: "Drain mode blocks new sessions on SH3 for everyone, including the next developer, and keeps SH3 assigned to Bob.", fr: "Le mode de drainage bloque les nouvelles sessions sur SH3 pour tout le monde, y compris le prochain développeur, et laisse SH3 attribué à Bob." }
        f: { en: "Azure CLI can't assign, unassign or reassign personal desktops; use the Azure portal or Azure PowerShell.", fr: "Azure CLI ne peut ni attribuer, ni annuler l'attribution, ni réattribuer des bureaux personnels ; utilisez le portail Azure ou Azure PowerShell." }
    references:
      - title: Configure personal desktop assignment in Azure Virtual Desktop - Azure Virtual Desktop
        url: https://learn.microsoft.com/en-us/azure/virtual-desktop/configure-host-pool-personal-desktop-assignment-type
