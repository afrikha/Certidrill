chapter: 35-microsoft-365-apps
questions:
  # ------------------------------------------------------------------ 1
  - id: az140-qz-35-01
    objective: "3.3.5"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        The sample `configuration.xml` file that the Azure Virtual Desktop documentation provides for Microsoft 365 Apps contains the element `<ExcludeApp ID="Lync" />`.

        Why is this application excluded?
      fr: |
        L'exemple de fichier `configuration.xml` que fournit la documentation Azure Virtual Desktop pour Microsoft 365 Apps contient l'élément `<ExcludeApp ID="Lync" />`.

        Pourquoi cette application est-elle exclue ?
    body:
      options:
        - { id: a, text: { en: "Skype for Business isn't supported on Azure Virtual Desktop.", fr: "Skype Entreprise n'est pas pris en charge sur Azure Virtual Desktop." } }
        - { id: b, text: { en: "The OneDrive sync app is installed separately, per machine.", fr: "L'application de synchronisation OneDrive est installée à part, par ordinateur." } }
        - { id: c, text: { en: "Microsoft Teams is installed separately, per machine.", fr: "Microsoft Teams est installé à part, par ordinateur." } }
        - { id: d, text: { en: "Shared computer activation doesn't license this application.", fr: "L'activation d'ordinateurs partagés n'accorde pas de licence pour cette application." } }
    answer: { optionId: a }
    explanation:
      correct:
        en: |
          `Lync` is the product ID of Skype for Business, which isn't supported on Azure Virtual Desktop, so the sample configuration doesn't install it. OneDrive and Teams are excluded by their own `ExcludeApp` elements.
        fr: |
          `Lync` est l'identificateur de produit de Skype Entreprise, qui n'est pas pris en charge sur Azure Virtual Desktop : l'exemple de configuration ne l'installe donc pas. OneDrive et Teams sont exclus par leurs propres éléments `ExcludeApp`.
      options:
        b: { en: "OneDrive is excluded by `<ExcludeApp ID=\"OneDrive\" />`, not by the Lync element.", fr: "OneDrive est exclu par `<ExcludeApp ID=\"OneDrive\" />`, pas par l'élément Lync." }
        c: { en: "Teams is excluded by `<ExcludeApp ID=\"Teams\" />` and installed separately; Lync is another product.", fr: "Teams est exclu par `<ExcludeApp ID=\"Teams\" />` et installé à part ; Lync est un autre produit." }
        d: { en: "Shared computer activation licenses the Microsoft 365 Apps suite for each user; it isn't the reason for this exclusion.", fr: "L'activation d'ordinateurs partagés accorde la licence de la suite Microsoft 365 Apps à chaque utilisateur ; ce n'est pas la raison de cette exclusion." }
    references:
      - title: Install Office on a custom VHD image
        url: https://learn.microsoft.com/en-us/azure/virtual-desktop/install-office-on-wvd-master-image

  # ------------------------------------------------------------------ 2
  - id: az140-qz-35-02
    objective: "3.3.7"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Users of an Azure Virtual Desktop pooled host pool run new Microsoft Teams and connect by using Windows App on Windows 11 devices. Teams uses the SlimCore-based media optimization.

        Where does the SlimCore media engine (`MsTeamsVdi.exe`) run?
      fr: |
        Les utilisateurs d'un pool d'hôtes Azure Virtual Desktop regroupé exécutent le nouveau Microsoft Teams et se connectent à l'aide de Windows App sur des appareils Windows 11. Teams utilise l'optimisation multimédia basée sur SlimCore.

        Où s'exécute le moteur multimédia SlimCore (`MsTeamsVdi.exe`) ?
    body:
      options:
        - { id: a, text: { en: "On the session host, in the user session", fr: "Sur l'hôte de session, dans la session de l'utilisateur" } }
        - { id: b, text: { en: "On the user's local device", fr: "Sur l'appareil local de l'utilisateur" } }
        - { id: c, text: { en: "In the Azure Virtual Desktop gateway service", fr: "Dans le service de passerelle Azure Virtual Desktop" } }
        - { id: d, text: { en: "On the file server that stores the FSLogix containers", fr: "Sur le serveur de fichiers qui stocke les conteneurs FSLogix" } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          With SlimCore, the media engine runs on the endpoint, started by Windows App, and makes the signaling and media connections itself. Calls and meetings are offloaded from the session host to the local device, which is the purpose of media optimization.
        fr: |
          Avec SlimCore, le moteur multimédia s'exécute sur le point de terminaison, lancé par Windows App, et établit lui-même les connexions de signalisation et multimédias. Les appels et les réunions sont déchargés de l'hôte de session vers l'appareil local, ce qui est le but de l'optimisation multimédia.
      options:
        a: { en: "The session host runs Teams and its server-side virtual channel module; running the media on the host is the unoptimized behavior.", fr: "L'hôte de session exécute Teams et son module de canal virtuel côté serveur ; traiter le multimédia sur l'hôte est le comportement non optimisé." }
        c: { en: "The gateway brokers the RDP connection; it doesn't process Teams audio and video.", fr: "La passerelle relaie la connexion RDP ; elle ne traite pas l'audio et la vidéo de Teams." }
        d: { en: "The file server holds the profile and Office containers; it runs no Teams component.", fr: "Le serveur de fichiers héberge les conteneurs de profils et Office ; il n'exécute aucun composant Teams." }
    references:
      - title: New VDI solution for Teams
        url: https://learn.microsoft.com/en-us/microsoftteams/vdi-2

  # ------------------------------------------------------------------ 3
  - id: az140-qz-35-03
    objective: "3.3.6"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Tailspin Toys has an Azure Virtual Desktop pooled host pool named **hp-ops**. The session hosts are joined to an Active Directory Domain Services (AD DS) domain and aren't registered in Microsoft Entra ID. The OneDrive sync app is installed per machine, and `SilentAccountConfig` is set to 1 under `HKLM\SOFTWARE\Policies\Microsoft\OneDrive`. Users have hybrid identities.

        Users report that they must enter their account in OneDrive in every new session.

        What should you do?
      fr: |
        Tailspin Toys dispose d'un pool d'hôtes Azure Virtual Desktop regroupé nommé **hp-ops**. Les hôtes de session sont joints à un domaine Active Directory Domain Services (AD DS) et ne sont pas inscrits dans Microsoft Entra ID. L'application de synchronisation OneDrive est installée par ordinateur, et `SilentAccountConfig` vaut 1 sous `HKLM\SOFTWARE\Policies\Microsoft\OneDrive`. Les utilisateurs ont des identités hybrides.

        Les utilisateurs signalent qu'ils doivent saisir leur compte dans OneDrive à chaque nouvelle session.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Set the data of SilentAccountConfig to the Microsoft Entra tenant ID.", fr: "Régler les données de SilentAccountConfig sur l'ID du locataire Microsoft Entra." } }
        - { id: b, text: { en: "Set KFMSilentOptIn to the Microsoft Entra tenant ID.", fr: "Régler KFMSilentOptIn sur l'ID du locataire Microsoft Entra." } }
        - { id: c, text: { en: "Make the session hosts Microsoft Entra hybrid joined.", fr: "Rendre les hôtes de session joints hybrides à Microsoft Entra." } }
        - { id: d, text: { en: "Reinstall the OneDrive sync app in per-user mode.", fr: "Réinstaller l'application de synchronisation OneDrive en mode par utilisateur." } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          Silent account configuration signs users in with their Windows credentials only when the machine is connected to Microsoft Entra ID. Hosts joined only to AD DS don't meet this condition; making them Microsoft Entra hybrid joined lets `SilentAccountConfig` = 1 work for the hybrid users.
        fr: |
          La configuration silencieuse du compte connecte les utilisateurs avec leurs informations d'identification Windows uniquement quand la machine est connectée à Microsoft Entra ID. Des hôtes joints seulement à AD DS ne remplissent pas cette condition ; les rendre joints hybrides à Microsoft Entra permet à `SilentAccountConfig` = 1 de fonctionner pour les utilisateurs hybrides.
      options:
        a: { en: "SilentAccountConfig is a DWORD set to 1; the tenant ID is the data of KFMSilentOptIn.", fr: "SilentAccountConfig est un DWORD à 1 ; l'ID du locataire est la donnée de KFMSilentOptIn." }
        b: { en: "KFMSilentOptIn moves the known folders to OneDrive once the user is signed in; it doesn't sign the user in.", fr: "KFMSilentOptIn déplace les dossiers connus vers OneDrive une fois l'utilisateur connecté ; il ne connecte pas l'utilisateur." }
        d: { en: "Non-persistent environments require the per-machine installation; a per-user installation doesn't fix the sign-in.", fr: "Les environnements non persistants exigent l'installation par ordinateur ; une installation par utilisateur ne règle pas la connexion." }
    references:
      - title: Use the sync app on virtual desktops
        url: https://learn.microsoft.com/en-us/sharepoint/sync-vdi-support

  # ------------------------------------------------------------------ 4
  - id: az140-qz-35-04
    objective: "3.3.8"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Litware has an Azure Virtual Desktop pooled host pool named **hp-web** of 20 session hosts created from a golden image. Microsoft Edge updates itself on each session host. Users who reconnect to another session host sometimes get a different Edge version, and a web application certified for one Edge version fails on the others.

        You need to ensure that all the session hosts of hp-web run the same Edge version. What should you do?
      fr: |
        Litware dispose d'un pool d'hôtes Azure Virtual Desktop regroupé nommé **hp-web** de 20 hôtes de session créés à partir d'une image de référence. Microsoft Edge se met à jour lui-même sur chaque hôte de session. Les utilisateurs qui se reconnectent à un autre hôte de session obtiennent parfois une autre version d'Edge, et une application web certifiée pour une version d'Edge échoue sur les autres.

        Vous devez faire en sorte que tous les hôtes de session de hp-web exécutent la même version d'Edge. Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Turn on Edge sync with the users' Microsoft Entra accounts so that each user keeps one version.", fr: "Activer la synchronisation Edge avec les comptes Microsoft Entra des utilisateurs pour que chacun garde une seule version." } }
        - { id: b, text: { en: "Turn off Edge automatic updates, and update Edge in the golden image before you redeploy the hosts.", fr: "Désactiver les mises à jour automatiques d'Edge, et mettre Edge à jour dans l'image de référence avant de redéployer les hôtes." } }
        - { id: c, text: { en: "Keep Edge automatic updates, and restart all the session hosts of hp-web every night.", fr: "Conserver les mises à jour automatiques d'Edge, et redémarrer chaque nuit tous les hôtes de session de hp-web." } }
        - { id: d, text: { en: "Install the Edge MSI on each session host from a logon script at every user sign-in.", fr: "Installer le MSI d'Edge sur chaque hôte de session par un script d'ouverture de session à chaque connexion." } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          For non-persistent machines, Microsoft recommends turning off Edge automatic updates and updating Edge by updating the golden image. Every session host deployed from the image then runs the same version, which prevents mismatches across the pool.
        fr: |
          Pour les machines non persistantes, Microsoft recommande de désactiver les mises à jour automatiques d'Edge et de mettre Edge à jour en mettant à jour l'image de référence. Chaque hôte de session déployé à partir de l'image exécute alors la même version, ce qui évite les écarts dans le pool.
      options:
        a: { en: "Edge sync roams favorites and settings across sessions; it doesn't control which Edge version is installed on a host.", fr: "La synchronisation Edge fait suivre les favoris et les paramètres entre les sessions ; elle ne contrôle pas la version d'Edge installée sur un hôte." }
        c: { en: "Each host still updates on its own schedule, so restarts don't keep the hosts on the same version.", fr: "Chaque hôte continue de se mettre à jour selon son propre calendrier : les redémarrages ne gardent pas les hôtes sur la même version." }
        d: { en: "Users don't have the rights to install the MSI, and installing at each sign-in adds load without controlling the version centrally.", fr: "Les utilisateurs n'ont pas les droits d'installer le MSI, et installer à chaque connexion ajoute de la charge sans contrôler la version de façon centralisée." }
    references:
      - title: Microsoft Edge for Virtual desktop infrastructure (VDI)
        url: https://learn.microsoft.com/en-us/deployedge/edge-for-virtualized-desktop-infrastructure

  # ------------------------------------------------------------------ 5
  - id: az140-qz-35-05
    objective: "3.3.5"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Proseware is creating a new Azure Virtual Desktop pooled host pool for a pilot that starts tomorrow. Users have Microsoft 365 E3 licenses. The session hosts must provide Microsoft 365 Apps to several users at the same time.

        You need to provide Microsoft 365 Apps with the least administrative effort. You don't need to choose the languages, the update channel or the excluded applications.

        Which image should you select when you add the session hosts?
      fr: |
        Proseware crée un nouveau pool d'hôtes Azure Virtual Desktop regroupé pour un pilote qui commence demain. Les utilisateurs disposent de licences Microsoft 365 E3. Les hôtes de session doivent fournir Microsoft 365 Apps à plusieurs utilisateurs en même temps.

        Vous devez fournir Microsoft 365 Apps avec un minimum d'effort administratif. Vous n'avez pas besoin de choisir les langues, le canal de mise à jour ni les applications exclues.

        Quelle image devez-vous sélectionner quand vous ajoutez les hôtes de session ?
    body:
      options:
        - { id: a, text: { en: "Windows 11 Enterprise multi-session, with users installing Microsoft 365 Apps from the Microsoft 365 portal", fr: "Windows 11 Entreprise multisession, les utilisateurs installant Microsoft 365 Apps depuis le portail Microsoft 365" } }
        - { id: b, text: { en: "A custom image built with the Office Deployment Tool from Windows 11 Enterprise multi-session", fr: "Une image personnalisée créée avec l'Outil de déploiement d'Office à partir de Windows 11 Entreprise multisession" } }
        - { id: c, text: { en: "Windows 11 Enterprise multi-session + Microsoft 365 Apps, from the Azure Marketplace", fr: "Windows 11 Entreprise multisession + Microsoft 365 Apps, depuis la Place de marché Azure" } }
        - { id: d, text: { en: "Windows 11 Enterprise with Office LTSC Professional Plus 2024 installed in a custom image", fr: "Windows 11 Entreprise avec Office LTSC Professionnel Plus 2024 installé dans une image personnalisée" } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          Windows Enterprise multi-session images with Microsoft 365 Apps preinstalled are offered when you deploy a host pool and in the Azure Marketplace. They start the pilot without building or capturing an image, and Microsoft 365 E3 includes Microsoft 365 Apps for enterprise, which is supported on multi-session.
        fr: |
          Des images Windows Entreprise multisession avec Microsoft 365 Apps préinstallé sont proposées lors du déploiement d'un pool d'hôtes et dans la Place de marché Azure. Elles lancent le pilote sans créer ni capturer d'image, et Microsoft 365 E3 inclut Microsoft 365 Apps for enterprise, pris en charge en multisession.
      options:
        a: { en: "Users can't install software on shared session hosts, and an installation from the portal isn't configured for the shared computer activation that multi-session hosts need.", fr: "Les utilisateurs ne peuvent pas installer de logiciels sur des hôtes de session partagés, et une installation depuis le portail n'est pas configurée pour l'activation d'ordinateurs partagés dont les hôtes multisession ont besoin." }
        b: { en: "A custom image built with the ODT is the choice when you must control languages, channel or excluded apps; here it only adds work.", fr: "Une image personnalisée créée avec l'ODT est le choix quand il faut maîtriser les langues, le canal ou les applications exclues ; ici, elle ne fait qu'ajouter du travail." }
        d: { en: "Only Microsoft 365 Apps for enterprise or for business (with Business Premium) are supported on multi-session, and single-session Windows can't host several users at once.", fr: "Seules Microsoft 365 Apps for enterprise ou for business (avec Business Premium) sont prises en charge en multisession, et Windows mono-session ne peut pas accueillir plusieurs utilisateurs à la fois." }
    references:
      - title: Install Office on a custom VHD image
        url: https://learn.microsoft.com/en-us/azure/virtual-desktop/install-office-on-wvd-master-image

  # ------------------------------------------------------------------ 6
  - id: az140-qz-35-06
    objective: "3.3.5"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Woodgrove Bank builds a custom image for an Azure Virtual Desktop pooled host pool. The session hosts are in a domain where you aren't allowed to create Group Policy objects, and they aren't managed by Intune. Microsoft 365 Apps for enterprise is installed in the image with the Office Deployment Tool.

        Every user profile created on the session hosts must use Outlook Cached Exchange Mode with a limited mail synchronization window, to keep the OST files small. You need to configure the settings in the image.

        What should you do on the image virtual machine before you capture it?
      fr: |
        Woodgrove Bank crée une image personnalisée pour un pool d'hôtes Azure Virtual Desktop regroupé. Les hôtes de session se trouvent dans un domaine où vous n'êtes pas autorisé à créer des objets de stratégie de groupe, et ils ne sont pas gérés par Intune. Microsoft 365 Apps for enterprise est installé dans l'image avec l'Outil de déploiement d'Office.

        Chaque profil utilisateur créé sur les hôtes de session doit utiliser le mode Exchange mis en cache d'Outlook avec une fenêtre de synchronisation du courrier limitée, pour que les fichiers OST restent petits. Vous devez configurer ces paramètres dans l'image.

        Que devez-vous faire sur la machine virtuelle de l'image avant de la capturer ?
    body:
      options:
        - { id: a, text: { en: "Add the cached mode values under HKEY_CURRENT_USER while you're signed in with your administrator account.", fr: "Ajouter les valeurs du mode mis en cache sous HKEY_CURRENT_USER pendant que vous êtes connecté avec votre compte d'administrateur." } }
        - { id: b, text: { en: "Add the cached mode values under HKEY_USERS\\.DEFAULT, then restart the image virtual machine.", fr: "Ajouter les valeurs du mode mis en cache sous HKEY_USERS\\.DEFAULT, puis redémarrer la machine virtuelle de l'image." } }
        - { id: c, text: { en: "Load C:\\Users\\Default\\NTUSER.DAT, add the cached mode values to the loaded hive, then unload it.", fr: "Charger C:\\Users\\Default\\NTUSER.DAT, ajouter les valeurs du mode mis en cache dans la ruche chargée, puis la décharger." } }
        - { id: d, text: { en: "Set IncludeOutlook to 1 in the FSLogix ODFC container settings of the image virtual machine.", fr: "Régler IncludeOutlook sur 1 dans les paramètres du conteneur ODFC FSLogix de la machine virtuelle de l'image." } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          New profiles are created from the default user profile, so values written to its hive (`reg load HKU\TempDefault C:\Users\Default\NTUSER.DAT`, `reg add` under its `software\policies\microsoft\office\16.0\outlook\cached mode` key, `reg unload`) are inherited by every user who signs in to a session host. This is the method the Azure Virtual Desktop documentation uses for the Outlook cached mode settings.
        fr: |
          Les nouveaux profils sont créés à partir du profil utilisateur par défaut : les valeurs écrites dans sa ruche (`reg load HKU\TempDefault C:\Users\Default\NTUSER.DAT`, `reg add` sous sa clé `software\policies\microsoft\office\16.0\outlook\cached mode`, `reg unload`) sont héritées par chaque utilisateur qui se connecte à un hôte de session. C'est la méthode qu'utilise la documentation Azure Virtual Desktop pour les paramètres du mode mis en cache d'Outlook.
      options:
        a: { en: "HKEY_CURRENT_USER is the hive of the administrator's own profile; other users' new profiles don't inherit it.", fr: "HKEY_CURRENT_USER est la ruche du profil de l'administrateur lui-même ; les nouveaux profils des autres utilisateurs n'en héritent pas." }
        b: { en: "HKEY_USERS\\.DEFAULT is the profile of the LocalSystem account, not the default user profile copied to new profiles.", fr: "HKEY_USERS\\.DEFAULT est le profil du compte LocalSystem, pas le profil utilisateur par défaut copié dans les nouveaux profils." }
        d: { en: "IncludeOutlook decides whether the Outlook data is stored in the ODFC container; it doesn't configure cached mode or the synchronization window.", fr: "IncludeOutlook décide si les données Outlook sont stockées dans le conteneur ODFC ; il ne configure ni le mode mis en cache ni la fenêtre de synchronisation." }
    references:
      - title: Install Office on a custom VHD image
        url: https://learn.microsoft.com/en-us/azure/virtual-desktop/install-office-on-wvd-master-image

  # ------------------------------------------------------------------ 7
  - id: az140-qz-35-07
    objective: "3.3.6"
    difficulty: 3
    status: draft
    type: hotarea
    stem:
      en: |
        Contoso has an Azure Virtual Desktop pooled host pool named **hp-sales**. The session hosts are Microsoft Entra joined. While signed in to the image virtual machine with your administrator account, you installed the OneDrive sync app with `OneDriveSetup.exe /allusers` and configured the registry values shown in the following table. Then you captured the image and deployed the session hosts.

        Users report two problems:

        - OneDrive doesn't start when they sign in; they must start it from the Start menu.
        - Their Desktop, Documents and Pictures folders aren't moved to OneDrive.

        Which registry value causes each problem? To answer, select the appropriate value in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Contoso dispose d'un pool d'hôtes Azure Virtual Desktop regroupé nommé **hp-sales**. Les hôtes de session sont joints à Microsoft Entra. Connecté à la machine virtuelle de l'image avec votre compte d'administrateur, vous avez installé l'application de synchronisation OneDrive avec `OneDriveSetup.exe /allusers` et configuré les valeurs de registre du tableau suivant. Vous avez ensuite capturé l'image et déployé les hôtes de session.

        Les utilisateurs signalent deux problèmes :

        - OneDrive ne démarre pas quand ils se connectent ; ils doivent le démarrer depuis le menu Démarrer.
        - Leurs dossiers Bureau, Documents et Images ne sont pas déplacés vers OneDrive.

        Quelle valeur de registre provoque chaque problème ? Pour répondre, sélectionnez la valeur appropriée dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      prompts:
        - { id: p1, text: { en: "OneDrive doesn't start at sign-in", fr: "OneDrive ne démarre pas à la connexion" } }
        - { id: p2, text: { en: "Known folders aren't moved to OneDrive", fr: "Les dossiers connus ne sont pas déplacés vers OneDrive" } }
      grid:
        header:
          - { en: Key, fr: Clé }
          - { en: Name, fr: Nom }
          - { en: Type, fr: Type }
          - { en: Data, fr: Données }
        rows:
          - - { text: "HKLM\\Software\\Microsoft\\OneDrive" }
            - { area: allusers, text: AllUsersInstall }
            - { text: REG_DWORD }
            - { text: "1" }
          - - { text: "HKCU\\Software\\Microsoft\\Windows\\CurrentVersion\\Run" }
            - { area: run, text: OneDrive }
            - { text: REG_SZ }
            - { text: "\"C:\\Program Files\\Microsoft OneDrive\\OneDrive.exe\" /background" }
          - - { text: "HKLM\\SOFTWARE\\Policies\\Microsoft\\OneDrive" }
            - { area: silent, text: SilentAccountConfig }
            - { text: REG_DWORD }
            - { text: "1" }
          - - { text: "HKLM\\Software\\Microsoft\\OneDrive" }
            - { area: kfm, text: KFMSilentOptIn }
            - { text: REG_SZ }
            - { text: { en: "<tenant ID>", fr: "<ID du locataire>" } }
    answer: { values: { p1: run, p2: kfm } }
    explanation:
      correct:
        en: |
          The Run value was written to HKEY_CURRENT_USER while you were signed in with your administrator account, so it starts OneDrive only for that account; the documented value is under `HKLM\Software\Microsoft\Windows\CurrentVersion\Run`, for every user. KFMSilentOptIn has the right data (the tenant ID, as a string) but sits in the non-policy key: like SilentAccountConfig, it must be under `HKLM\SOFTWARE\Policies\Microsoft\OneDrive`. AllUsersInstall belongs under `HKLM\Software\Microsoft\OneDrive`, where it is.
        fr: |
          La valeur Run a été écrite sous HKEY_CURRENT_USER pendant que vous étiez connecté avec votre compte d'administrateur : elle ne démarre OneDrive que pour ce compte ; la valeur documentée se trouve sous `HKLM\Software\Microsoft\Windows\CurrentVersion\Run`, pour tous les utilisateurs. KFMSilentOptIn a la bonne donnée (l'ID du locataire, sous forme de chaîne) mais se trouve dans la clé hors stratégie : comme SilentAccountConfig, elle doit être sous `HKLM\SOFTWARE\Policies\Microsoft\OneDrive`. AllUsersInstall se place sous `HKLM\Software\Microsoft\OneDrive`, là où elle se trouve.
      options:
        allusers: { en: "AllUsersInstall = 1 under HKLM\\Software\\Microsoft\\OneDrive is the documented value for the per-machine installation; it plays no part in either problem.", fr: "AllUsersInstall = 1 sous HKLM\\Software\\Microsoft\\OneDrive est la valeur documentée pour l'installation par ordinateur ; elle n'est pour rien dans ces problèmes." }
        silent: { en: "SilentAccountConfig is a DWORD set to 1 in the policy key, as documented, and the hosts are Microsoft Entra joined: silent sign-in works.", fr: "SilentAccountConfig est un DWORD à 1 dans la clé de stratégie, comme documenté, et les hôtes sont joints à Microsoft Entra : la connexion silencieuse fonctionne." }
    references:
      - title: Install Office on a custom VHD image
        url: https://learn.microsoft.com/en-us/azure/virtual-desktop/install-office-on-wvd-master-image

  # ------------------------------------------------------------------ 8
  - id: az140-qz-35-08
    objective: "3.3.8"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Adatum has an Azure Virtual Desktop pooled host pool named **hp-ops**. User profiles are stored in FSLogix profile containers. A company policy forbids synchronizing browser data to cloud services, so Microsoft Edge sync is turned off.

        Today, the whole `%LocalAppData%\Microsoft\Edge\User Data` folder roams in the profile containers. The containers grow quickly, sign-ins are slow, and Edge sometimes hangs after a rolling update of the session hosts.

        You need to keep the users' favorites, settings and history between sessions and follow Microsoft's guidance for Edge on virtual desktops. What should you do?
      fr: |
        Adatum dispose d'un pool d'hôtes Azure Virtual Desktop regroupé nommé **hp-ops**. Les profils utilisateur sont stockés dans des conteneurs de profils FSLogix. Une stratégie de l'entreprise interdit de synchroniser les données du navigateur vers des services cloud : la synchronisation Microsoft Edge est donc désactivée.

        Aujourd'hui, tout le dossier `%LocalAppData%\Microsoft\Edge\User Data` est itinérant dans les conteneurs de profils. Les conteneurs grossissent vite, les connexions sont lentes, et Edge se bloque parfois après une mise à jour progressive des hôtes de session.

        Vous devez conserver les favoris, les paramètres et l'historique des utilisateurs d'une session à l'autre et suivre les recommandations de Microsoft pour Edge sur les bureaux virtuels. Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Keep roaming the whole User Data folder, and exclude the Default\\Cache and Default\\Code Cache folders from it.", fr: "Continuer de faire suivre tout le dossier User Data, et en exclure les dossiers Default\\Cache et Default\\Code Cache." } }
        - { id: b, text: { en: "Roam only the Bookmarks, Preferences and History data of the Default profile, without the cache folders.", fr: "Ne faire suivre que les données Bookmarks, Preferences et History du profil Default, sans les dossiers de cache." } }
        - { id: c, text: { en: "Turn on Edge sync with the users' Microsoft Entra accounts, and stop roaming the User Data folder.", fr: "Activer la synchronisation Edge avec les comptes Microsoft Entra des utilisateurs, et cesser de faire suivre le dossier User Data." } }
        - { id: d, text: { en: "Roam only the Default\\Cache and Default\\Code Cache folders, so that pages load faster after sign-in.", fr: "Ne faire suivre que les dossiers Default\\Cache et Default\\Code Cache, pour que les pages se chargent plus vite après la connexion." } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          Microsoft advises against redirecting the entire user data folder: an Edge update can change its storage format, and hosts on different versions then read data they can't handle, which causes hangs. If you roam part of it, limit it to a small subset such as Bookmarks, Preferences and History, and keep the caches, known to cause performance issues, out of it.
        fr: |
          Microsoft déconseille de rediriger tout le dossier de données utilisateur : une mise à jour d'Edge peut changer son format de stockage, et des hôtes en versions différentes lisent alors des données qu'ils ne savent pas traiter, d'où les blocages. Si vous en faites suivre une partie, limitez-la à un petit sous-ensemble comme Bookmarks, Preferences et History, et laissez de côté les caches, connus pour dégrader les performances.
      options:
        a: { en: "Excluding the caches reduces the size, but roaming the whole folder keeps the incompatible-format risk that causes the hangs during rolling updates.", fr: "Exclure les caches réduit la taille, mais faire suivre tout le dossier conserve le risque de format incompatible qui provoque les blocages pendant les mises à jour progressives." }
        c: { en: "Microsoft Entra ID sync is Microsoft's preferred option, but the company policy forbids synchronizing browser data to cloud services.", fr: "La synchronisation Microsoft Entra ID est l'option préférée de Microsoft, mais la stratégie de l'entreprise interdit de synchroniser les données du navigateur vers des services cloud." }
        d: { en: "The cache folders are exactly the ones to exclude, and roaming them alone keeps neither favorites, settings nor history.", fr: "Les dossiers de cache sont justement ceux à exclure, et les faire suivre seuls ne conserve ni favoris, ni paramètres, ni historique." }
    references:
      - title: Microsoft Edge for Virtual desktop infrastructure (VDI)
        url: https://learn.microsoft.com/en-us/deployedge/edge-for-virtualized-desktop-infrastructure

  # ------------------------------------------------------------------ 9
  - id: az140-qz-35-09
    objective: "3.3.7"
    difficulty: 3
    status: draft
    type: dropdown
    stem:
      en: |
        Fabrikam has an Azure Virtual Desktop pooled host pool named **hp-collab** with a RemoteApp application group named **ag-collab** in a resource group named **rg-avd**. You build the session host image on a virtual machine that has no internet access. The new Microsoft Teams MSIX package and an icon file are copied to `C:\Staging` in the image.

        You need to provision new Teams for all the users of the session hosts and publish it in ag-collab. The RemoteApp must keep starting after Teams updates.

        How should you complete the commands? Select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Fabrikam dispose d'un pool d'hôtes Azure Virtual Desktop regroupé nommé **hp-collab** avec un groupe d'applications RemoteApp nommé **ag-collab** dans un groupe de ressources nommé **rg-avd**. Vous créez l'image des hôtes de session sur une machine virtuelle sans accès à Internet. Le package MSIX du nouveau Microsoft Teams et un fichier d'icône sont copiés dans `C:\Staging` dans l'image.

        Vous devez provisionner le nouveau Teams pour tous les utilisateurs des hôtes de session et le publier dans ag-collab. La RemoteApp doit continuer à démarrer après les mises à jour de Teams.

        Comment devez-vous compléter les commandes ? Sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: code
      language: powershell
      template: |
        # In the image, from an elevated prompt in C:\Staging
        New-ItemProperty -Path "HKLM:\SOFTWARE\Microsoft\Teams" -Name IsWVDEnvironment -PropertyType DWORD -Value 1 -Force
        .\teamsbootstrapper.exe [[prov]]

        # From an administration workstation
        New-AzWvdApplication -Name Teams -GroupName ag-collab -ResourceGroupName rg-avd `
          -FilePath [[path]] `
          -IconPath "C:\Staging\teams.ico" -IconIndex 0 -CommandLineSetting DoNotAllow
      slots:
        - id: prov
          options:
            - { id: online, text: "-p" }
            - { id: relative, text: "-p -o \".\\MSTeams-x64.msix\"" }
            - { id: full, text: "-p -o \"C:\\Staging\\MSTeams-x64.msix\"" }
            - { id: remove, text: "-x -o \"C:\\Staging\\MSTeams-x64.msix\"" }
        - id: path
          options:
            - { id: windowsapps, text: "\"C:\\Program Files\\WindowsApps\\MSTeams_25290.205.4069.4894_x64__8wekyb3d8bbwe\\ms-teams.exe\"" }
            - { id: appsfolder, text: "\"shell:appsFolder\\MSTeams_8wekyb3d8bbwe!MSTeams\"" }
            - { id: localappdata, text: "\"%LocalAppData%\\Microsoft\\Teams\\current\\Teams.exe\"" }
    answer: { values: { prov: full, path: appsfolder } }
    explanation:
      correct:
        en: |
          `teamsbootstrapper.exe -p` provisions new Teams for all users, and `-o` installs it from a local MSIX package, which an offline image builder needs; the path must be a full path, because a relative path starting with `.` fails. New Teams is an MSIX package whose folder under WindowsApps changes with every version, so it's published with the stable path `shell:appsFolder\MSTeams_8wekyb3d8bbwe!MSTeams` and a local icon file.
        fr: |
          `teamsbootstrapper.exe -p` provisionne le nouveau Teams pour tous les utilisateurs, et `-o` l'installe à partir d'un package MSIX local, ce dont a besoin une machine de création d'image hors connexion ; le chemin doit être complet, car un chemin relatif commençant par `.` échoue. Le nouveau Teams est un package MSIX dont le dossier sous WindowsApps change à chaque version : il se publie donc avec le chemin stable `shell:appsFolder\MSTeams_8wekyb3d8bbwe!MSTeams` et un fichier d'icône local.
      options:
        online: { en: "-p alone downloads the latest Teams package from the internet, which the image virtual machine can't reach.", fr: "-p seul télécharge le dernier package Teams depuis Internet, que la machine virtuelle de l'image ne peut pas joindre." }
        relative: { en: "The bootstrapper needs the full path of the MSIX package; a relative path with `.` returns an error.", fr: "Le programme d'amorçage exige le chemin complet du package MSIX ; un chemin relatif avec `.` renvoie une erreur." }
        remove: { en: "-x deprovisions and uninstalls Teams for all users instead of provisioning it.", fr: "-x déprovisionne et désinstalle Teams pour tous les utilisateurs au lieu de le provisionner." }
        windowsapps: { en: "The WindowsApps folder name contains the version, so the RemoteApp would break at the next Teams update.", fr: "Le nom du dossier WindowsApps contient la version : la RemoteApp cesserait de fonctionner à la prochaine mise à jour de Teams." }
        localappdata: { en: "This is the per-user location of classic Teams; new Teams is provisioned per machine as an MSIX package.", fr: "C'est l'emplacement par utilisateur du Teams classique ; le nouveau Teams est provisionné par ordinateur sous forme de package MSIX." }
    references:
      - title: Microsoft Teams for Virtualized Desktop Infrastructure (VDI)
        url: https://learn.microsoft.com/en-us/microsoftteams/new-teams-vdi-requirements-deploy
      - title: Use Microsoft Teams on Azure Virtual Desktop
        url: https://learn.microsoft.com/en-us/azure/virtual-desktop/teams-on-avd

  # ------------------------------------------------------------------ 10
  - id: az140-qz-35-10
    objective: "3.3.7"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        Northwind Traders has an Azure Virtual Desktop pooled host pool named **hp-sales** that runs new Microsoft Teams, installed per machine. `IsWVDEnvironment` is set to 1, and the Remote Desktop WebRTC Redirector Service is installed on the session hosts.

        Sales users connect from Windows 11 laptops by using the current version of Windows App. Some of them also connect from thin clients whose remote desktop client supports only the WebRTC-based optimization. Contractors connect from Windows 11 laptops by using Windows App and are assigned a Teams VDI policy in which `VDI2Optimization` is set to **Disabled**.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Northwind Traders dispose d'un pool d'hôtes Azure Virtual Desktop regroupé nommé **hp-sales** qui exécute le nouveau Microsoft Teams, installé par ordinateur. `IsWVDEnvironment` vaut 1, et le service redirecteur WebRTC Bureau à distance est installé sur les hôtes de session.

        Les commerciaux se connectent depuis des ordinateurs portables Windows 11 à l'aide de la version actuelle de Windows App. Certains se connectent aussi depuis des clients légers dont le client Bureau à distance ne prend en charge que l'optimisation basée sur WebRTC. Les prestataires se connectent depuis des ordinateurs portables Windows 11 à l'aide de Windows App et se voient attribuer une stratégie VDI Teams dans laquelle `VDI2Optimization` vaut **Disabled**.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si elle est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - { id: s1, text: { en: "When a sales user moves from a laptop to a thin client, Teams calls in hp-sales can still be optimized.", fr: "Quand un commercial passe d'un ordinateur portable à un client léger, les appels Teams dans hp-sales peuvent rester optimisés." } }
        - { id: s2, text: { en: "The contractors can't get the SlimCore-based optimization in hp-sales.", fr: "Les prestataires ne peuvent pas obtenir l'optimisation basée sur SlimCore dans hp-sales." } }
        - { id: s3, text: { en: "When no media optimization can be used, Teams blocks calls and meetings in the session.", fr: "Quand aucune optimisation multimédia n'est utilisable, Teams bloque les appels et les réunions dans la session." } }
    answer: { values: { s1: true, s2: true, s3: false } }
    explanation:
      correct:
        en: |
          Yes: Teams tries SlimCore first and falls back to WebRTC when the endpoint doesn't support SlimCore, which is why Microsoft recommends keeping the WebRTC Redirector Service on the session hosts. Yes: `VDI2Optimization` = Disabled in the Teams VDI policy assigned to a user prevents that user from being optimized with SlimCore. No: without optimization, Teams falls back to server-side rendering; calls and meetings still work, with media processed on the session host and a degraded experience.
        fr: |
          Oui : Teams essaie d'abord SlimCore et se replie sur WebRTC quand le point de terminaison ne prend pas en charge SlimCore, c'est pourquoi Microsoft recommande de garder le service redirecteur WebRTC sur les hôtes de session. Oui : `VDI2Optimization` = Disabled dans la stratégie VDI Teams attribuée à un utilisateur empêche son optimisation avec SlimCore. Non : sans optimisation, Teams se replie sur le rendu côté serveur ; les appels et les réunions fonctionnent toujours, avec un traitement multimédia sur l'hôte de session et une expérience dégradée.
    references:
      - title: New VDI solution for Teams
        url: https://learn.microsoft.com/en-us/microsoftteams/vdi-2
      - title: Use Microsoft Teams on Azure Virtual Desktop
        url: https://learn.microsoft.com/en-us/azure/virtual-desktop/teams-on-avd
