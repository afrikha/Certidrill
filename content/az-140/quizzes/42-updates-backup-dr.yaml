chapter: 42-updates-backup-dr
questions:
  # ------------------------------------------------------------------ 1
  - id: az140-qz-42-01
    objective: "4.2.4"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Adatum stores the FSLogix profile containers of an Azure Virtual Desktop host pool in an Azure file share named **profiles**. The share is in a storage account named **stprofadt** in the West Europe region, in a subscription named **Sub-AVD**. West Europe is paired with North Europe.

        You need to protect the share by using Azure Backup.

        Where should you create the Recovery Services vault?
      fr: |
        Adatum stocke les conteneurs de profils FSLogix d'un pool d'hôtes Azure Virtual Desktop dans un partage de fichiers Azure nommé **profiles**. Le partage se trouve dans un compte de stockage nommé **stprofadt** dans la région Europe Ouest, dans un abonnement nommé **Sub-AVD**. La région Europe Ouest est jumelée avec la région Europe Nord.

        Vous devez protéger le partage à l'aide de Sauvegarde Azure.

        Où devez-vous créer le coffre Recovery Services ?
    body:
      options:
        - { id: a, text: { en: "In North Europe, in Sub-AVD", fr: "En Europe Nord, dans Sub-AVD" } }
        - { id: b, text: { en: "In West Europe, in Sub-AVD", fr: "En Europe Ouest, dans Sub-AVD" } }
        - { id: c, text: { en: "In any region of Europe, in Sub-AVD", fr: "Dans n'importe quelle région d'Europe, dans Sub-AVD" } }
        - { id: d, text: { en: "In the region of the Log Analytics workspace of Insights", fr: "Dans la région de l'espace de travail Log Analytics d'Insights" } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          Azure Files backup requires a Recovery Services vault in the same region and subscription as the storage account that hosts the file share. A storage account in another region doesn't even appear in the discovery list of the vault.
        fr: |
          La sauvegarde Azure Files exige un coffre Recovery Services dans la même région et le même abonnement que le compte de stockage qui héberge le partage de fichiers. Un compte de stockage d'une autre région n'apparaît même pas dans la liste de découverte du coffre.
      options:
        a: { en: "A vault in the paired region can't discover stprofadt; protection against a regional outage comes from a geo-redundant vault, not from the vault's location.", fr: "Un coffre de la région jumelée ne peut pas découvrir stprofadt ; la protection contre une panne régionale vient d'un coffre géoredondant, pas de l'emplacement du coffre." }
        c: { en: "The vault must be in the exact region of the storage account, not just in the same geography.", fr: "Le coffre doit se trouver dans la région exacte du compte de stockage, pas seulement dans la même zone géographique." }
        d: { en: "The Log Analytics workspace has no role in Azure Files backup; the region of the storage account decides.", fr: "L'espace de travail Log Analytics ne joue aucun rôle dans la sauvegarde Azure Files ; c'est la région du compte de stockage qui décide." }
    references:
      - title: Back up Azure Files
        url: https://learn.microsoft.com/en-us/azure/backup/backup-azure-files

  # ------------------------------------------------------------------ 2
  - id: az140-qz-42-02
    objective: "4.2.2"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Proseware replicates the session hosts of a personal host pool named **HP-Design** from East US to West US by using Azure Site Recovery. Each session host has a custom VM extension named **ext-license** that configures a licensing agent.

        After an outage of East US, you fail over the session hosts to West US. In the Azure portal, the failed-over VMs don't list ext-license.

        What should you do?
      fr: |
        Proseware réplique les hôtes de session d'un pool d'hôtes personnel nommé **HP-Design** de la région USA Est vers la région USA Ouest à l'aide d'Azure Site Recovery. Chaque hôte de session a une extension de machine virtuelle personnalisée nommée **ext-license** qui configure un agent de licence.

        Après une panne de la région USA Est, vous basculez les hôtes de session vers la région USA Ouest. Dans le portail Azure, les machines virtuelles basculées ne listent pas ext-license.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Reprotect the failed-over VMs so that Site Recovery copies ext-license to them.", fr: "Reprotéger les machines virtuelles basculées pour que Site Recovery leur copie ext-license." } }
        - { id: b, text: { en: "Apply the joindomain and DSC extensions again to the failed-over VMs.", fr: "Appliquer de nouveau les extensions joindomain et DSC aux machines virtuelles basculées." } }
        - { id: c, text: { en: "Set up ext-license again on each failed-over VM in West US.", fr: "Configurer de nouveau ext-license sur chaque machine virtuelle basculée en USA Ouest." } }
        - { id: d, text: { en: "Run a test failover of the session hosts to recreate the extensions.", fr: "Exécuter un test de basculement des hôtes de session pour recréer les extensions." } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          Site Recovery doesn't maintain VM extensions during replication. If the session hosts use custom extensions, you must set them up again after a failover or a failback.
        fr: |
          Site Recovery ne conserve pas les extensions de machine virtuelle pendant la réplication. Si les hôtes de session utilisent des extensions personnalisées, vous devez les configurer de nouveau après un basculement ou une restauration automatique.
      options:
        a: { en: "Reprotection starts the replication of the failed-over VMs back to East US for the failback; it doesn't add extensions.", fr: "La reprotection lance la réplication des machines virtuelles basculées vers la région USA Est en vue de la restauration automatique ; elle n'ajoute pas d'extensions." }
        b: { en: "The built-in joindomain and DSC extensions apply only when a session host is first created; you can disregard them after a failover.", fr: "Les extensions intégrées joindomain et DSC ne s'appliquent qu'à la première création d'un hôte de session ; vous pouvez les ignorer après un basculement." }
        d: { en: "A test failover doesn't replicate extensions either, and Microsoft advises against it for session hosts: the copy registers with the control plane and conflicts with the original.", fr: "Un test de basculement ne réplique pas non plus les extensions, et Microsoft le déconseille pour les hôtes de session : la copie s'inscrit auprès du plan de contrôle et entre en conflit avec l'original." }
    references:
      - title: Multiregion BCDR for Azure Virtual Desktop
        url: https://learn.microsoft.com/en-us/azure/architecture/example-scenario/azure-virtual-desktop/azure-virtual-desktop-multi-region-bcdr

  # ------------------------------------------------------------------ 3
  - id: az140-qz-42-03
    objective: "4.2.1"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Litware has a pooled host pool named **HP-Std** that was created two years ago with the standard management approach. Its 16 session hosts were deployed from image version **1.0.0** of an Azure Compute Gallery image definition. You published a patched image version, **2.0.0**.

        You need all the session hosts of HP-Std to run image version 2.0.0.

        What should you do?
      fr: |
        Litware dispose d'un pool d'hôtes regroupé nommé **HP-Std** créé il y a deux ans avec l'approche de gestion standard. Ses 16 hôtes de session ont été déployés à partir de la version d'image **1.0.0** d'une définition d'image d'Azure Compute Gallery. Vous avez publié une version d'image corrigée, **2.0.0**.

        Vous devez faire en sorte que tous les hôtes de session de HP-Std exécutent la version d'image 2.0.0.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Add a session host configuration that references 2.0.0 to HP-Std, then schedule a session host update.", fr: "Ajouter à HP-Std une configuration d'hôte de session qui référence 2.0.0, puis planifier une mise à jour des hôtes de session." } }
        - { id: b, text: { en: "Schedule a session host update of HP-Std that changes the image of the session hosts to version 2.0.0.", fr: "Planifier une mise à jour des hôtes de session de HP-Std qui remplace l'image des hôtes de session par la version 2.0.0." } }
        - { id: c, text: { en: "Deploy new session hosts from 2.0.0 with a registration token, then drain and remove the old session hosts.", fr: "Déployer de nouveaux hôtes de session à partir de 2.0.0 avec un jeton d'inscription, puis drainer et supprimer les anciens hôtes." } }
        - { id: d, text: { en: "Change the image reference of each existing session host VM to version 2.0.0, then restart the VM.", fr: "Remplacer la référence d'image de chaque machine virtuelle hôte de session existante par la version 2.0.0, puis redémarrer la machine." } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          With the standard management approach, you use your own tools and processes, such as pipelines and scripts, to update the image of the session hosts: session host update isn't available. You add new session hosts from the new image with a registration token, drain the old hosts so that no new session lands on them, and remove them once their users have signed out.
        fr: |
          Avec l'approche de gestion standard, vous utilisez vos propres outils et processus, comme des pipelines et des scripts, pour mettre à jour l'image des hôtes de session : la mise à jour des hôtes de session n'est pas disponible. Vous ajoutez de nouveaux hôtes à partir de la nouvelle image avec un jeton d'inscription, drainez les anciens hôtes pour qu'aucune nouvelle session n'y arrive, puis les supprimez une fois que leurs utilisateurs ont fermé leur session.
      options:
        a: { en: "The management approach is chosen when the host pool is created: a host pool created without a session host configuration can't get one afterwards.", fr: "L'approche de gestion se choisit à la création du pool d'hôtes : un pool créé sans configuration d'hôte de session ne peut pas en recevoir une ensuite." }
        b: { en: "Session host update works only in host pools that use a session host configuration, which HP-Std doesn't have.", fr: "La mise à jour des hôtes de session ne fonctionne que dans les pools d'hôtes qui utilisent une configuration d'hôte de session, ce que HP-Std n'a pas." }
        d: { en: "The source image of an existing VM can't be changed in place; the session hosts must be replaced by VMs created from the new image.", fr: "L'image source d'une machine virtuelle existante ne peut pas être modifiée sur place ; les hôtes de session doivent être remplacés par des machines créées à partir de la nouvelle image." }
    references:
      - title: Host pool management approaches for Azure Virtual Desktop
        url: https://learn.microsoft.com/en-us/azure/virtual-desktop/host-pool-management-approaches

  # ------------------------------------------------------------------ 4
  - id: az140-qz-42-04
    objective: "4.2.3"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Contoso stores the FSLogix profile containers of an Azure Virtual Desktop host pool on an Azure NetApp Files volume named **vol-prof** in the West Europe region. Cross-zone replication copies vol-prof to another availability zone of West Europe.

        You are adding a secondary host pool in North Europe. A new requirement states that the profiles must be recoverable in North Europe if the whole West Europe region fails.

        What should you do?
      fr: |
        Contoso stocke les conteneurs de profils FSLogix d'un pool d'hôtes Azure Virtual Desktop sur un volume Azure NetApp Files nommé **vol-prof** dans la région Europe Ouest. La réplication interzone (cross-zone replication) copie vol-prof vers une autre zone de disponibilité de la région Europe Ouest.

        Vous ajoutez un pool d'hôtes secondaire en Europe Nord. Une nouvelle exigence impose que les profils soient récupérables en Europe Nord si toute la région Europe Ouest tombe en panne.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Add cross-region replication from vol-prof to a volume in North Europe, and keep the cross-zone replication.", fr: "Ajouter une réplication interrégion de vol-prof vers un volume en Europe Nord, et conserver la réplication interzone." } }
        - { id: b, text: { en: "Add a snapshot policy to vol-prof that takes hourly snapshots and keeps them for 30 days.", fr: "Ajouter à vol-prof une stratégie d'instantanés qui prend des instantanés toutes les heures et les conserve 30 jours." } }
        - { id: c, text: { en: "Restore the latest snapshot of vol-prof every night to a new volume in another availability zone.", fr: "Restaurer chaque nuit le dernier instantané de vol-prof vers un nouveau volume dans une autre zone de disponibilité." } }
        - { id: d, text: { en: "Replace the cross-zone replication of vol-prof with cross-region replication to a volume in North Europe.", fr: "Remplacer la réplication interzone de vol-prof par une réplication interrégion vers un volume en Europe Nord." } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          Cross-region replication keeps an asynchronous replica of the volume, snapshots included, in another region, which makes the profiles recoverable after a regional outage. Cross-region replication and cross-zone replication are mutually exclusive on a volume: you choose zone-level or region-level recoverability, so the cross-zone replication must be replaced.
        fr: |
          La réplication interrégion conserve un réplica asynchrone du volume, instantanés compris, dans une autre région, ce qui rend les profils récupérables après une panne régionale. La réplication interrégion et la réplication interzone s'excluent mutuellement sur un volume : vous choisissez une récupérabilité au niveau de la zone ou de la région, il faut donc remplacer la réplication interzone.
      options:
        a: { en: "You can't use cross-region replication while cross-zone replication is active on the same volume.", fr: "Vous ne pouvez pas utiliser la réplication interrégion tant que la réplication interzone est active sur le même volume." }
        b: { en: "Snapshots are stored in the volume itself, in West Europe: they're lost with the region.", fr: "Les instantanés sont stockés dans le volume lui-même, en Europe Ouest : ils sont perdus avec la région." }
        c: { en: "A volume in another availability zone of West Europe doesn't survive the failure of the whole region.", fr: "Un volume dans une autre zone de disponibilité de la région Europe Ouest ne survit pas à la panne de toute la région." }
    references:
      - title: Multiregion BCDR for Azure Virtual Desktop
        url: https://learn.microsoft.com/en-us/azure/architecture/example-scenario/azure-virtual-desktop/azure-virtual-desktop-multi-region-bcdr
      - title: Understand Azure NetApp Files snapshot-based data protection
        url: https://learn.microsoft.com/en-us/azure/azure-netapp-files/snapshots-introduction

  # ------------------------------------------------------------------ 5
  - id: az140-qz-42-05
    objective: "4.2.5"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Litware stores the FSLogix profile containers of 500 users on an Azure NetApp Files volume named **vol-profiles**. A snapshot policy takes a snapshot every night. For security reasons, the snapshot path of the volume is hidden from clients, and it must stay hidden.

        After a faulty application update, the support team must examine the profiles of about 60 users as they were in last night's snapshot. The current content of vol-profiles must not change, and the data must be available to the support team as quickly as possible.

        What should you do?
      fr: |
        Litware stocke les conteneurs de profils FSLogix de 500 utilisateurs sur un volume Azure NetApp Files nommé **vol-profiles**. Une stratégie d'instantanés prend un instantané chaque nuit. Pour des raisons de sécurité, le chemin d'accès aux instantanés du volume est masqué pour les clients, et il doit le rester.

        Après une mise à jour d'application défectueuse, l'équipe de support doit examiner les profils d'environ 60 utilisateurs tels qu'ils étaient dans l'instantané de la nuit dernière. Le contenu actuel de vol-profiles ne doit pas changer, et les données doivent être disponibles pour l'équipe de support le plus rapidement possible.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Revert vol-profiles to last night's snapshot, then share the volume with the support team.", fr: "Rétablir vol-profiles à l'instantané de la nuit dernière, puis partager le volume avec l'équipe de support." } }
        - { id: b, text: { en: "Restore last night's snapshot to a new volume, then share the new volume with the support team.", fr: "Restaurer l'instantané de la nuit dernière vers un nouveau volume, puis partager ce volume avec l'équipe de support." } }
        - { id: c, text: { en: "Run a single-file snapshot restore of each of the 60 VHDX files to its original path in vol-profiles.", fr: "Exécuter une restauration d'instantané de fichier unique de chacun des 60 fichiers VHDX vers son chemin d'origine dans vol-profiles." } }
        - { id: d, text: { en: "Make the snapshot path of vol-profiles visible, then let the support team copy the files from the snapshot.", fr: "Rendre visible le chemin d'accès aux instantanés de vol-profiles, puis laisser l'équipe de support copier les fichiers depuis l'instantané." } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          Restoring a snapshot to a new volume creates an independent clone that is available almost immediately, whatever the volume size, while the data blocks are copied in the background. The support team works on the clone, and vol-profiles and its snapshot path settings stay unchanged.
        fr: |
          Restaurer un instantané vers un nouveau volume crée un clone indépendant disponible presque immédiatement, quelle que soit la taille du volume, pendant que les blocs de données sont copiés en arrière-plan. L'équipe de support travaille sur le clone, et vol-profiles ainsi que la visibilité de son chemin d'accès aux instantanés restent inchangés.
      options:
        a: { en: "Reverting replaces all the data of vol-profiles with the snapshot and deletes the later data and snapshots, irreversibly.", fr: "Le rétablissement remplace toutes les données de vol-profiles par celles de l'instantané et supprime les données et instantanés plus récents, de façon irréversible." }
        c: { en: "Restoring the files to their original path overwrites the current profiles of the 60 users in vol-profiles.", fr: "Restaurer les fichiers vers leur chemin d'origine écrase les profils actuels des 60 utilisateurs dans vol-profiles." }
        d: { en: "Client-side copy from the snapshot folder needs the snapshot path to be visible, which the security requirement forbids.", fr: "La copie côté client depuis le dossier d'instantanés exige que le chemin d'accès aux instantanés soit visible, ce que l'exigence de sécurité interdit." }
    references:
      - title: Understand Azure NetApp Files snapshot-based data protection
        url: https://learn.microsoft.com/en-us/azure/azure-netapp-files/snapshots-introduction

  # ------------------------------------------------------------------ 6
  - id: az140-qz-42-06
    objective: "4.2.1"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        Fabrikam has a pooled host pool named **HP-Sales** that was created with a session host configuration. HP-Sales is monitored with Azure Virtual Desktop Insights. Last month, you ran a session host update that changed the image of HP-Sales. Since the update:

        - The session hosts no longer appear in the Host Performance report of Insights.
        - A client certificate that an administrator had imported manually on each session host for a line-of-business app is missing.

        You'll run a session host update every month. You need both issues to be resolved automatically on the session hosts that future updates create. The solution must minimize administrative effort.

        Which two actions should you perform? Each correct answer presents part of the solution.

        NOTE: Each correct selection is worth one point.
      fr: |
        Fabrikam dispose d'un pool d'hôtes regroupé nommé **HP-Sales** créé avec une configuration d'hôte de session. HP-Sales est supervisé avec Azure Virtual Desktop Insights. Le mois dernier, vous avez exécuté une mise à jour des hôtes de session qui a changé l'image de HP-Sales. Depuis la mise à jour :

        - Les hôtes de session n'apparaissent plus dans le rapport Host Performance d'Insights.
        - Un certificat client qu'un administrateur avait importé manuellement sur chaque hôte de session pour une application métier a disparu.

        Vous exécuterez une mise à jour des hôtes de session chaque mois. Vous devez faire en sorte que les deux problèmes soient résolus automatiquement sur les hôtes de session que créeront les prochaines mises à jour. La solution doit réduire l'effort administratif.

        Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

        Remarque : chaque sélection correcte vaut un point.
    body:
      options:
        - { id: a, text: { en: "Assign Azure Policy definitions that install the Azure Monitor Agent on the session hosts and associate them with the data collection rule of Insights.", fr: "Attribuer des définitions Azure Policy qui installent l'agent Azure Monitor sur les hôtes de session et les associent à la règle de collecte de données d'Insights." } }
        - { id: b, text: { en: "After each update, open the configuration workbook of Insights and select Add extension and Deploy association for the new session hosts.", fr: "Après chaque mise à jour, ouvrir le workbook de configuration d'Insights et sélectionner Add extension et Deploy association pour les nouveaux hôtes de session." } }
        - { id: c, text: { en: "Import the certificate in the custom configuration script of the session host configuration, or include it in the image.", fr: "Importer le certificat dans le script de configuration personnalisé de la configuration d'hôte de session, ou l'inclure dans l'image." } }
        - { id: d, text: { en: "Disable autoscale on HP-Sales before each update, and enable it again when the update is complete.", fr: "Désactiver la mise à l'échelle automatique sur HP-Sales avant chaque mise à jour, puis la réactiver une fois la mise à jour terminée." } }
        - { id: e, text: { en: "Turn on drain mode on every session host before each update, so that the update keeps their configuration.", fr: "Activer le mode drainage sur chaque hôte de session avant chaque mise à jour, pour que la mise à jour conserve leur configuration." } }
      choose: 2
    answer: { optionIds: [a, c] }
    explanation:
      correct:
        en: |
          Session host update replaces the VMs: the Azure Monitor Agent isn't installed automatically on the new session hosts, and Microsoft suggests Azure Policy to install it. Files, registry keys or certificates added manually aren't present after the update, so they belong in the image, in configuration management or in the custom configuration script.
        fr: |
          La mise à jour des hôtes de session remplace les machines virtuelles : l'agent Azure Monitor n'est pas installé automatiquement sur les nouveaux hôtes de session, et Microsoft suggère Azure Policy pour l'installer. Les fichiers, clés de Registre ou certificats ajoutés manuellement ne sont plus présents après la mise à jour : ils doivent figurer dans l'image, dans la gestion de la configuration ou dans le script de configuration personnalisé.
      options:
        b: { en: "Adding the new hosts from Insights works, but it's a manual task after every update, not an automatic one.", fr: "Ajouter les nouveaux hôtes depuis Insights fonctionne, mais c'est une tâche manuelle après chaque mise à jour, pas une solution automatique." }
        d: { en: "Autoscale must be disabled during an update so that the update doesn't fail, but this has no effect on the agent or the certificate.", fr: "La mise à l'échelle automatique doit être désactivée pendant une mise à jour pour que celle-ci n'échoue pas, mais cela n'a aucun effet sur l'agent ni sur le certificat." }
        e: { en: "The update drains and deletes the old VMs anyway; drain mode doesn't carry any configuration over to the new VMs.", fr: "La mise à jour draine et supprime de toute façon les anciennes machines ; le mode drainage ne transfère aucune configuration vers les nouvelles machines." }
    references:
      - title: Session host update for Azure Virtual Desktop
        url: https://learn.microsoft.com/en-us/azure/virtual-desktop/session-host-update

  # ------------------------------------------------------------------ 7
  - id: az140-qz-42-07
    objective: "4.2.5"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Tailspin Toys deploys the session hosts of its pooled host pools with a pipeline that always references the latest version of an image definition named **img-win11-m365** in an Azure Compute Gallery. Yesterday, you published image version **1.5.0**. Session hosts created from 1.5.0 can't start a line-of-business app, while the previous version, **1.4.0**, works.

        You need new session hosts to be created from 1.4.0 until the vendor of the app publishes a fix. Image version 1.5.0 must remain in the gallery so that the vendor can test it. You must not modify the pipeline.

        What should you do?
      fr: |
        Tailspin Toys déploie les hôtes de session de ses pools d'hôtes regroupés avec un pipeline qui référence toujours la dernière version d'une définition d'image nommée **img-win11-m365** dans une galerie Azure Compute Gallery. Hier, vous avez publié la version d'image **1.5.0**. Les hôtes de session créés à partir de 1.5.0 ne parviennent pas à démarrer une application métier, alors que la version précédente, **1.4.0**, fonctionne.

        Vous devez faire en sorte que les nouveaux hôtes de session soient créés à partir de 1.4.0 jusqu'à ce que l'éditeur de l'application publie un correctif. La version d'image 1.5.0 doit rester dans la galerie pour que l'éditeur puisse la tester. Vous ne devez pas modifier le pipeline.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Set `excludeFromLatest` to `true` on image version 1.4.0.", fr: "Régler `excludeFromLatest` sur `true` sur la version d'image 1.4.0." } }
        - { id: b, text: { en: "Set `BlockDeletionBeforeEndOfLife` on image version 1.5.0.", fr: "Définir `BlockDeletionBeforeEndOfLife` sur la version d'image 1.5.0." } }
        - { id: c, text: { en: "Set `excludeFromLatest` to `true` on image version 1.5.0.", fr: "Régler `excludeFromLatest` sur `true` sur la version d'image 1.5.0." } }
        - { id: d, text: { en: "Set `allowDeletionOfReplicatedLocations` to `false` on image version 1.4.0.", fr: "Régler `allowDeletionOfReplicatedLocations` sur `false` sur la version d'image 1.4.0." } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          An image version with `excludeFromLatest` set to `true` is skipped when a VM is created from the latest version of the image definition. Once 1.5.0 is excluded, the pipeline's latest reference resolves to 1.4.0, and 1.5.0 stays in the gallery for the vendor; set the flag back to `false` (or publish a fixed version) when the fix arrives.
        fr: |
          Une version d'image dont `excludeFromLatest` vaut `true` est ignorée quand une machine virtuelle est créée à partir de la dernière version de la définition d'image. Une fois 1.5.0 exclue, la référence à la dernière version du pipeline désigne 1.4.0, et 1.5.0 reste dans la galerie pour l'éditeur ; remettez l'indicateur à `false` (ou publiez une version corrigée) à l'arrivée du correctif.
      options:
        a: { en: "Excluding 1.4.0 removes the working version from the latest resolution: new hosts would still be created from 1.5.0.", fr: "Exclure 1.4.0 retire la version fonctionnelle de la résolution de la dernière version : les nouveaux hôtes seraient toujours créés à partir de 1.5.0." }
        b: { en: "`BlockDeletionBeforeEndOfLife` only protects 1.5.0 against deletion; it remains the latest version used by the pipeline.", fr: "`BlockDeletionBeforeEndOfLife` protège seulement 1.5.0 contre la suppression ; elle reste la dernière version utilisée par le pipeline." }
        d: { en: "This setting prevents the accidental removal of replicated regions of 1.4.0; it doesn't change which version is the latest.", fr: "Ce paramètre empêche la suppression accidentelle des régions répliquées de 1.4.0 ; il ne change pas la version considérée comme la dernière." }
    references:
      - title: Store and share resources in Azure Compute Gallery
        url: https://learn.microsoft.com/en-us/azure/virtual-machines/azure-compute-gallery

  # ------------------------------------------------------------------ 8
  - id: az140-qz-42-08
    objective: "4.2.2"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        Woodgrove Bank has the following Azure Virtual Desktop host pools in the Canada Central region:

        | Host pool | Type | Disaster recovery design |
        | --- | --- | --- |
        | HP-Call | Pooled | Active-passive with a secondary pooled host pool named **HP-Call-DR** in Canada East. The application groups of both host pools are registered in a workspace named **WS-Call**. The HP-Call-DR session hosts are deallocated. |
        | HP-Dev | Personal | The session hosts are replicated to Canada East by Azure Site Recovery. |

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Woodgrove Bank dispose des pools d'hôtes Azure Virtual Desktop suivants dans la région Canada Centre :

        | Pool d'hôtes | Type | Conception de la reprise d'activité |
        | --- | --- | --- |
        | HP-Call | Regroupé | Actif-passif avec un pool d'hôtes regroupé secondaire nommé **HP-Call-DR** en Canada Est. Les groupes d'applications des deux pools d'hôtes sont inscrits dans un espace de travail nommé **WS-Call**. Les hôtes de session de HP-Call-DR sont libérés. |
        | HP-Dev | Personnel | Les hôtes de session sont répliqués vers la région Canada Est par Azure Site Recovery. |

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text: { en: "During a failover of HP-Call to HP-Call-DR, the users keep using WS-Call and don't see duplicate desktops in Windows App.", fr: "Pendant un basculement de HP-Call vers HP-Call-DR, les utilisateurs continuent d'utiliser WS-Call et ne voient pas de bureaux en double dans Windows App." }
        - id: s2
          text: { en: "To check every quarter that HP-Dev can run in Canada East, you should run a Site Recovery test failover of the HP-Dev session hosts.", fr: "Pour vérifier chaque trimestre que HP-Dev peut fonctionner en Canada Est, vous devez exécuter un test de basculement Site Recovery des hôtes de session de HP-Dev." }
        - id: s3
          text: { en: "If HP-Call becomes active-active, with the same users assigned to both host pools, Microsoft recommends keeping all the application groups in WS-Call so that users see a single desktop.", fr: "Si HP-Call devient actif-actif, avec les mêmes utilisateurs attribués aux deux pools d'hôtes, Microsoft recommande de garder tous les groupes d'applications dans WS-Call pour que les utilisateurs voient un seul bureau." }
    answer:
      values: { s1: true, s2: false, s3: false }
    explanation:
      correct:
        en: |
          In an active-passive design, users keep the same workspace and the client doesn't show duplicate entries, because a group is assigned to only one host pool at a time; the failover needs an administrator to move the assignments. A Site Recovery test failover creates a duplicate VM that registers with the control plane and conflicts with the original session host. In an active-active design, users assigned to both host pools see duplicate entries, so Microsoft recommends separate, clearly named workspaces.
        fr: |
          Dans une conception actif-passif, les utilisateurs conservent le même espace de travail et le client n'affiche pas d'entrées en double, car un groupe n'est attribué qu'à un pool d'hôtes à la fois ; le basculement exige qu'un administrateur déplace les attributions. Un test de basculement Site Recovery crée une machine virtuelle en double qui s'inscrit auprès du plan de contrôle et entre en conflit avec l'hôte de session d'origine. Dans une conception actif-actif, les utilisateurs attribués aux deux pools d'hôtes voient des entrées en double : Microsoft recommande des espaces de travail séparés, aux noms explicites.
      options:
        s2: { en: "Validate readiness by starting the secondary session hosts on a schedule, checking that they register with the control plane, and running the failover procedure with a test user group.", fr: "Validez la préparation en démarrant les hôtes de session secondaires selon un planning, en vérifiant qu'ils s'inscrivent auprès du plan de contrôle et en exécutant la procédure de basculement avec un groupe d'utilisateurs de test." }
        s3: { en: "Keeping both host pools in one workspace doesn't merge the entries: users see two desktops, and separate workspaces with clear names are recommended.", fr: "Garder les deux pools d'hôtes dans un seul espace de travail ne fusionne pas les entrées : les utilisateurs voient deux bureaux, et des espaces de travail séparés aux noms explicites sont recommandés." }
    references:
      - title: Multiregion BCDR for Azure Virtual Desktop
        url: https://learn.microsoft.com/en-us/azure/architecture/example-scenario/azure-virtual-desktop/azure-virtual-desktop-multi-region-bcdr

  # ------------------------------------------------------------------ 9
  - id: az140-qz-42-09
    objective: "4.2.3"
    difficulty: 3
    status: draft
    type: dropdown
    shuffle: false
    stem:
      en: |
        Northwind Traders is adding a secondary region to an Azure Virtual Desktop deployment. Each region will have one pooled host pool. Users have FSLogix Profile containers and Office (ODFC) containers on Azure Files premium file shares, and applications are delivered by App attach.

        After a failover and a failback, profile and Office data must be consistent between the two regions, and users must be able to sign in without errors.

        You are writing a design that follows Microsoft's multiregion BCDR guidance for Azure Virtual Desktop. How should you complete the design? Select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Northwind Traders ajoute une région secondaire à un déploiement Azure Virtual Desktop. Chaque région aura un pool d'hôtes regroupé. Les utilisateurs ont des conteneurs de profil FSLogix et des conteneurs Office (ODFC) sur des partages de fichiers Azure Files premium, et les applications sont fournies par App attach.

        Après un basculement et une restauration automatique, les données de profil et Office doivent être cohérentes entre les deux régions, et les utilisateurs doivent pouvoir se connecter sans erreur.

        Vous rédigez une conception qui suit les recommandations de Microsoft pour la continuité d'activité et la reprise d'activité multirégion d'Azure Virtual Desktop. Comment devez-vous compléter la conception ? Sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: text
      template:
        en: |
          Configure FSLogix Cloud Cache for [[containers]].

          Use [[disk]] managed disks for the local cache of the session hosts, sized to be at least as large as [[size]].

          Plan at least [[accounts]] storage accounts for each of the two host pools.
        fr: |
          Configurez FSLogix Cloud Cache pour [[containers]].

          Utilisez des disques managés [[disk]] pour le cache local des hôtes de session, dimensionnés au moins à la taille [[size]].

          Prévoyez au moins [[accounts]] comptes de stockage pour chacun des deux pools d'hôtes.
      slots:
        - id: containers
          options:
            - { id: prof, text: { en: "the Profile container only", fr: "le conteneur de profil uniquement" } }
            - { id: odfc, text: { en: "the Office container only", fr: "le conteneur Office uniquement" } }
            - { id: both, text: { en: "both the Profile container and the Office container", fr: "le conteneur de profil et le conteneur Office" } }
        - id: disk
          options:
            - { id: hdd, text: Standard HDD }
            - { id: ssd, text: Standard SSD }
            - { id: premium, text: Premium SSD }
        - id: size
          options:
            - { id: avg, text: { en: "the average user profile", fr: "du profil utilisateur moyen" } }
            - { id: largest, text: { en: "the largest expected user profile", fr: "du plus gros profil utilisateur attendu" } }
            - { id: total, text: { en: "all the user profiles of the host pool", fr: "de l'ensemble des profils utilisateur du pool d'hôtes" } }
        - id: accounts
          options:
            - { id: one, text: { en: "one", fr: "un" } }
            - { id: two, text: { en: "two", fr: "deux" } }
            - { id: three, text: { en: "three", fr: "trois" } }
    answer:
      values: { containers: both, disk: premium, size: largest, accounts: three }
    explanation:
      correct:
        en: |
          Cloud Cache must be set up twice in the registry, once for the Profile container and once for the Office container; turning it off for the Office container can misalign data between regions after a failover and a failback. Microsoft recommends Premium managed disks for the local cache, at least as large as the largest expected profile VHDX, because an undersized cache disk causes sign-in failures. The guidance uses at least two storage accounts per host pool (Profile containers and Office containers) plus one for the App attach packages.
        fr: |
          Cloud Cache doit être configuré deux fois dans le Registre, une fois pour le conteneur de profil et une fois pour le conteneur Office ; le désactiver pour le conteneur Office peut désaligner les données entre les régions après un basculement et une restauration automatique. Microsoft recommande des disques managés Premium pour le cache local, au moins aussi grands que le plus gros VHDX de profil attendu, car un disque de cache sous-dimensionné provoque des échecs de connexion. Les recommandations prévoient au moins deux comptes de stockage par pool d'hôtes (conteneurs de profil et conteneurs Office), plus un pour les packages App attach.
      options:
        prof: { en: "Without Cloud Cache for the Office container, its data can be misaligned between the regions after a failover and a failback.", fr: "Sans Cloud Cache pour le conteneur Office, ses données peuvent être désalignées entre les régions après un basculement et une restauration automatique." }
        odfc: { en: "The Profile container also needs Cloud Cache to be replicated to the second region.", fr: "Le conteneur de profil a aussi besoin de Cloud Cache pour être répliqué vers la seconde région." }
        hdd: { en: "Cloud Cache reads and writes every profile through the local cache: Microsoft recommends the Premium tier for these disks.", fr: "Cloud Cache lit et écrit chaque profil par le cache local : Microsoft recommande le niveau Premium pour ces disques." }
        ssd: { en: "Microsoft recommends the Premium tier of managed disks for Cloud Cache, not Standard SSD.", fr: "Microsoft recommande le niveau Premium des disques managés pour Cloud Cache, pas Standard SSD." }
        avg: { en: "A cache sized for the average profile is too small for the largest ones and causes sign-in failures.", fr: "Un cache dimensionné pour le profil moyen est trop petit pour les plus gros profils et provoque des échecs de connexion." }
        total: { en: "The local cache holds the profiles of the users signed in to that session host, not every profile of the host pool.", fr: "Le cache local contient les profils des utilisateurs connectés à cet hôte de session, pas tous les profils du pool d'hôtes." }
        two: { en: "Two accounts cover the Profile and Office containers; App attach packages need one more storage account.", fr: "Deux comptes couvrent les conteneurs de profil et Office ; les packages App attach exigent un compte de stockage de plus." }
    references:
      - title: Multiregion BCDR for Azure Virtual Desktop
        url: https://learn.microsoft.com/en-us/azure/architecture/example-scenario/azure-virtual-desktop/azure-virtual-desktop-multi-region-bcdr

  # ------------------------------------------------------------------ 10
  - id: az140-qz-42-10
    objective: "4.2.5"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        Contoso stores the FSLogix profile containers of 300 users in an Azure file share named **profiles** in a storage account named **stprofcto**. Azure Backup protects the share with a Vault-Standard policy: a daily backup, a snapshot retention of 5 days and a vault retention of 30 days.

        A ransomware attack that started nine days ago has encrypted most of the VHDX files. The last clean recovery point is 10 days old. The security team requires stprofcto to remain unchanged during the investigation. All the users are signed out.

        You need the users to sign in with their profiles as they were in the last clean recovery point.

        Which two actions should you perform? Each correct answer presents part of the solution.

        NOTE: Each correct selection is worth one point.
      fr: |
        Contoso stocke les conteneurs de profils FSLogix de 300 utilisateurs dans un partage de fichiers Azure nommé **profiles** dans un compte de stockage nommé **stprofcto**. Sauvegarde Azure protège le partage avec une stratégie Vault-Standard : une sauvegarde quotidienne, une rétention des instantanés de 5 jours et une rétention dans le coffre de 30 jours.

        Une attaque par rançongiciel commencée il y a neuf jours a chiffré la plupart des fichiers VHDX. Le dernier point de récupération sain date de 10 jours. L'équipe de sécurité exige que stprofcto reste inchangé pendant l'enquête. Tous les utilisateurs ont fermé leur session.

        Vous devez faire en sorte que les utilisateurs se connectent avec leur profil tel qu'il était dans le dernier point de récupération sain.

        Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

        Remarque : chaque sélection correcte vaut un point.
    body:
      options:
        - { id: a, text: { en: "Run an Item Level Restore of each user's folder from the clean recovery point to a share in another storage account.", fr: "Exécuter une restauration au niveau de l'élément (Item Level Restore) du dossier de chaque utilisateur depuis le point de récupération sain vers un partage d'un autre compte de stockage." } }
        - { id: b, text: { en: "Run a Full Share Restore of the clean recovery point to a file share in another storage account.", fr: "Exécuter une restauration du partage complet (Full Share Restore) du point de récupération sain vers un partage de fichiers d'un autre compte de stockage." } }
        - { id: c, text: { en: "Run a Full Share Restore of the clean recovery point to the original location and overwrite the conflicting files.", fr: "Exécuter une restauration du partage complet (Full Share Restore) du point de récupération sain vers l'emplacement d'origine en écrasant les fichiers en conflit." } }
        - { id: d, text: { en: "Change the FSLogix VHDLocations setting of the session hosts to the path of the restored file share.", fr: "Remplacer le paramètre FSLogix VHDLocations des hôtes de session par le chemin du partage de fichiers restauré." } }
        - { id: e, text: { en: "Recover the profiles share of stprofcto from soft delete as it was before the attack.", fr: "Récupérer le partage profiles de stprofcto depuis la suppression réversible tel qu'il était avant l'attaque." } }
      choose: 2
    answer: { optionIds: [b, d] }
    explanation:
      correct:
        en: |
          The 10-day-old recovery point is older than the 5-day snapshot retention, so it exists only in the vault. Vaulted backup supports only full share recovery, and when the snapshot of the recovery point isn't found, the share can be restored to an alternate location, which also keeps stprofcto unchanged. FSLogix then has to find the containers in the restored share, so VHDLocations must point to it.
        fr: |
          Le point de récupération de 10 jours est plus ancien que la rétention des instantanés de 5 jours : il n'existe que dans le coffre. La sauvegarde dans le coffre ne permet que la récupération du partage complet, et quand l'instantané du point de récupération est introuvable, le partage peut être restauré vers un autre emplacement, ce qui laisse aussi stprofcto inchangé. FSLogix doit ensuite trouver les conteneurs dans le partage restauré : VHDLocations doit donc pointer vers lui.
      options:
        a: { en: "Vaulted backup currently supports only full share recovery, and an Item Level Restore is limited to 99 files or folders per restore.", fr: "La sauvegarde dans le coffre ne prend actuellement en charge que la récupération du partage complet, et une restauration au niveau de l'élément est limitée à 99 fichiers ou dossiers par restauration." }
        c: { en: "A restore to the original location needs the snapshot of the recovery point, which expired after 5 days, and it would change stprofcto.", fr: "Une restauration vers l'emplacement d'origine exige l'instantané du point de récupération, qui a expiré après 5 jours, et elle modifierait stprofcto." }
        e: { en: "Soft delete only protects a deleted share; the profiles share wasn't deleted, its files were encrypted.", fr: "La suppression réversible ne protège qu'un partage supprimé ; le partage profiles n'a pas été supprimé, ses fichiers ont été chiffrés." }
    references:
      - title: Restore Azure Files
        url: https://learn.microsoft.com/en-us/azure/backup/restore-afs
      - title: About Azure Files backup
        url: https://learn.microsoft.com/en-us/azure/backup/azure-file-share-backup-overview
