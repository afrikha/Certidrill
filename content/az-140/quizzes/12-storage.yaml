chapter: 12-storage
questions:
  # ------------------------------------------------------------------ 1
  - id: az140-qz-12-01
    objective: "1.2.2"
    difficulty: 1
    status: draft
    type: single
    shuffle: false
    stem:
      en: |
        You enable FSLogix profile containers on the session hosts of an Azure Virtual Desktop host pool. Under `HKLM\SOFTWARE\FSLogix\Profiles`, you configure only the `Enabled` and `VHDLocations` values.

        Up to which maximum size can the container of a new user grow?
      fr: |
        Vous activez les conteneurs de profil FSLogix sur les hôtes de session d'un pool d'hôtes Azure Virtual Desktop. Sous `HKLM\SOFTWARE\FSLogix\Profiles`, vous configurez uniquement les valeurs `Enabled` et `VHDLocations`.

        Jusqu'à quelle taille maximale le conteneur d'un nouvel utilisateur peut-il croître ?
    body:
      options:
        - { id: a, text: "5,000 MB" }
        - { id: b, text: "10,000 MB" }
        - { id: c, text: "30,000 MB" }
        - { id: d, text: "100,000 MB" }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          When `SizeInMBs` isn't configured, FSLogix uses its default of 30,000 MB. Containers are dynamic by default (`IsDynamic` = 1), so the file grows as data is written, up to that maximum. You can raise `SizeInMBs` later, but not lower it for existing containers.
        fr: |
          Quand `SizeInMBs` n'est pas configuré, FSLogix utilise sa valeur par défaut de 30 000 Mo. Les conteneurs sont dynamiques par défaut (`IsDynamic` = 1) : le fichier croît au fur et à mesure de l'écriture des données, jusqu'à ce maximum. Vous pouvez augmenter `SizeInMBs` plus tard, mais pas le réduire pour les conteneurs existants.
      options:
        a: { en: "5,000 MB isn't an FSLogix default; it would be too small for most profiles.", fr: "5 000 Mo n'est pas une valeur par défaut de FSLogix ; ce serait trop petit pour la plupart des profils." }
        b: { en: "10,000 MB isn't the default of SizeInMBs; you would have to set it explicitly.", fr: "10 000 Mo n'est pas la valeur par défaut de SizeInMBs ; il faudrait la définir explicitement." }
        d: { en: "100,000 MB requires setting SizeInMBs explicitly; the default is 30,000 MB.", fr: "100 000 Mo exige de définir explicitement SizeInMBs ; la valeur par défaut est 30 000 Mo." }
    references:
      - title: Configuration Setting Reference
        url: https://learn.microsoft.com/en-us/fslogix/reference-configuration-settings

  # ------------------------------------------------------------------ 2
  - id: az140-qz-12-02
    objective: "1.2.1"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Fabrikam is moving 400 users to a pooled Azure Virtual Desktop host pool named **HP1**. The project team asks why the user profiles must be stored in FSLogix profile containers on a file share instead of the default local Windows profiles.

        What is the main reason?
      fr: |
        Fabrikam déplace 400 utilisateurs vers un pool d'hôtes Azure Virtual Desktop regroupé nommé **HP1**. L'équipe projet demande pourquoi les profils utilisateur doivent être stockés dans des conteneurs de profil FSLogix sur un partage de fichiers plutôt que dans les profils Windows locaux par défaut.

        Quelle est la raison principale ?
    body:
      options:
        - { id: a, text: { en: "Windows Enterprise multi-session doesn't support local user profiles on the OS disk.", fr: "Windows Entreprise multisession ne prend pas en charge les profils utilisateur locaux sur le disque du système d'exploitation." } }
        - { id: b, text: { en: "The OS disks of pooled session hosts are read-only, so a profile can't be written locally.", fr: "Les disques du système d'exploitation des hôtes de session regroupés sont en lecture seule : un profil ne peut pas être écrit localement." } }
        - { id: c, text: { en: "Azure Virtual Desktop licensing requires user data to be stored outside the session hosts.", fr: "Les licences Azure Virtual Desktop exigent que les données utilisateur soient stockées hors des hôtes de session." } }
        - { id: d, text: { en: "Users can land on a different session host at each sign-in, so a local profile stays behind.", fr: "Les utilisateurs peuvent arriver sur un hôte de session différent à chaque connexion : un profil local ne les suit donc pas." } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          In a pooled host pool, a user might connect to a different session host at each sign-in, and session hosts are also replaced or reimaged. A remote profile separates user data from the operating system: FSLogix attaches the user's container from the SMB share at sign-in, so the profile is the same on every host.
        fr: |
          Dans un pool d'hôtes regroupé, un utilisateur peut se connecter à un hôte de session différent à chaque connexion, et les hôtes de session sont aussi remplacés ou recréés. Un profil distant sépare les données utilisateur du système d'exploitation : FSLogix attache le conteneur de l'utilisateur depuis le partage SMB à la connexion, et le profil est le même sur chaque hôte.
      options:
        a: { en: "Windows creates a local profile by default on multi-session too; the problem is that it stays on one host.", fr: "Windows crée aussi par défaut un profil local en multisession ; le problème est qu'il reste sur un seul hôte." }
        b: { en: "Session host OS disks are writable; local profiles work but are lost for the user on the next host.", fr: "Les disques du système d'exploitation des hôtes de session sont accessibles en écriture ; les profils locaux fonctionnent mais sont perdus pour l'utilisateur sur l'hôte suivant." }
        c: { en: "Licensing rules cover access rights to Windows and Azure Virtual Desktop, not where profiles are stored.", fr: "Les règles de licence portent sur les droits d'accès à Windows et à Azure Virtual Desktop, pas sur l'emplacement des profils." }
    references:
      - title: User profile management for Azure Virtual Desktop with FSLogix profile containers
        url: https://learn.microsoft.com/en-us/azure/virtual-desktop/fslogix-containers-azure-files

  # ------------------------------------------------------------------ 3
  - id: az140-qz-12-03
    objective: "1.2.3"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        The FSLogix profile containers of an Azure Virtual Desktop host pool are stored in an Azure file share in a storage account named **stavdprof21**. You create a private endpoint for stavdprof21 in the session host virtual network, and you integrate it with a private DNS zone that is linked to that virtual network.

        Session hosts must resolve `stavdprof21.file.core.windows.net` to the private IP address of the endpoint. Which private DNS zone should you use?
      fr: |
        Les conteneurs de profil FSLogix d'un pool d'hôtes Azure Virtual Desktop sont stockés dans un partage de fichiers Azure d'un compte de stockage nommé **stavdprof21**. Vous créez un point de terminaison privé pour stavdprof21 dans le réseau virtuel des hôtes de session, et vous l'intégrez à une zone DNS privée liée à ce réseau virtuel.

        Les hôtes de session doivent résoudre `stavdprof21.file.core.windows.net` vers l'adresse IP privée du point de terminaison. Quelle zone DNS privée devez-vous utiliser ?
    body:
      options:
        - { id: a, text: "`privatelink.blob.core.windows.net`" }
        - { id: b, text: "`privatelink.file.core.windows.net`" }
        - { id: c, text: "`privatelink.afs.azure.net`" }
        - { id: d, text: "`privatelink.wvd.microsoft.com`" }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          A private endpoint for the `file` sub-resource of a storage account uses the private DNS zone `privatelink.file.core.windows.net`. Session hosts in the linked virtual network then resolve the account's file endpoint to the private IP address, so SMB traffic on TCP 445 stays inside Azure.
        fr: |
          Un point de terminaison privé pour la sous-ressource `file` d'un compte de stockage utilise la zone DNS privée `privatelink.file.core.windows.net`. Les hôtes de session du réseau virtuel lié résolvent alors le point de terminaison de fichiers du compte vers l'adresse IP privée, et le trafic SMB sur TCP 445 reste dans Azure.
      options:
        a: { en: "This zone serves the blob sub-resource; it doesn't resolve the file endpoint used by SMB.", fr: "Cette zone sert la sous-ressource blob ; elle ne résout pas le point de terminaison de fichiers utilisé par SMB." }
        c: { en: "This zone is for the private endpoint of an Azure File Sync service, not for a storage account.", fr: "Cette zone sert au point de terminaison privé d'un service Azure File Sync, pas à un compte de stockage." }
        d: { en: "This zone serves the connection and feed sub-resources of Azure Virtual Desktop, not Azure Files.", fr: "Cette zone sert les sous-ressources connection et feed d'Azure Virtual Desktop, pas Azure Files." }
    references:
      - title: Azure Private Endpoint private DNS zone values
        url: https://learn.microsoft.com/en-us/azure/private-link/private-endpoint-dns

  # ------------------------------------------------------------------ 4
  - id: az140-qz-12-04
    objective: "1.2.4"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Contoso configured FSLogix profile containers on the session hosts of an Azure Virtual Desktop host pool named **HP1**. The share-level and NTFS permissions are set as Microsoft recommends. Before FSLogix was configured, several pilot users signed in to the session hosts.

        A new user who signs in gets a folder named `<user SID>_<username>` in the share. A pilot user named **User1** gets no folder and sees the old desktop. No pilot user has data to keep in a local profile.

        You need every pilot user to get a profile container at the next sign-in, on any session host. What should you do?
      fr: |
        Contoso a configuré les conteneurs de profil FSLogix sur les hôtes de session d'un pool d'hôtes Azure Virtual Desktop nommé **HP1**. Les autorisations au niveau du partage et NTFS sont définies comme Microsoft le recommande. Avant la configuration de FSLogix, plusieurs utilisateurs pilotes se sont connectés aux hôtes de session.

        Un nouvel utilisateur qui se connecte obtient un dossier nommé `<user SID>_<username>` dans le partage. Un utilisateur pilote nommé **User1** n'obtient aucun dossier et retrouve son ancien bureau. Aucun utilisateur pilote n'a de données à conserver dans un profil local.

        Vous devez faire en sorte que chaque utilisateur pilote obtienne un conteneur de profil à sa prochaine connexion, sur n'importe quel hôte de session. Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Set FlipFlopProfileDirectoryName to 1 on the session hosts.", fr: "Définir FlipFlopProfileDirectoryName sur 1 sur les hôtes de session." } }
        - { id: b, text: { en: "Set DeleteLocalProfileWhenVHDShouldApply to 1 on the session hosts.", fr: "Définir DeleteLocalProfileWhenVHDShouldApply sur 1 sur les hôtes de session." } }
        - { id: c, text: { en: "Set AccessNetworkAsComputerObject to 1 on the session hosts.", fr: "Définir AccessNetworkAsComputerObject sur 1 sur les hôtes de session." } }
        - { id: d, text: { en: "Assign Storage File Data SMB Share Elevated Contributor to User1.", fr: "Attribuer Storage File Data SMB Share Elevated Contributor à User1." } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          By default, FSLogix honours an existing local profile instead of creating or attaching a profile container, which is why the pilot users keep their old desktop. With `DeleteLocalProfileWhenVHDShouldApply` set to 1, FSLogix permanently deletes the local profile at sign-in and creates or attaches the container. This is acceptable here because no pilot user has data to keep.
        fr: |
          Par défaut, FSLogix respecte un profil local existant au lieu de créer ou d'attacher un conteneur de profil : c'est pourquoi les utilisateurs pilotes retrouvent leur ancien bureau. Avec `DeleteLocalProfileWhenVHDShouldApply` sur 1, FSLogix supprime définitivement le profil local à la connexion et crée ou attache le conteneur. C'est acceptable ici, car aucun utilisateur pilote n'a de données à conserver.
      options:
        a: { en: "FlipFlopProfileDirectoryName only changes the folder name to `<username>_<SID>`; it doesn't override an existing local profile.", fr: "FlipFlopProfileDirectoryName ne change que le nom du dossier en `<username>_<SID>` ; il ne passe pas outre un profil local existant." }
        c: { en: "AccessNetworkAsComputerObject makes FSLogix reach the share as the computer account, a security risk that doesn't address the local profile.", fr: "AccessNetworkAsComputerObject fait accéder FSLogix au partage avec le compte d'ordinateur, un risque de sécurité qui ne règle pas le problème du profil local." }
        d: { en: "Permissions already work, as the new user's folder shows; Elevated Contributor is for administrators who change ACLs.", fr: "Les autorisations fonctionnent déjà, comme le montre le dossier du nouvel utilisateur ; Elevated Contributor est destiné aux administrateurs qui modifient les ACL." }
    references:
      - title: Troubleshooting issues with old, temporary, or local profiles
        url: https://learn.microsoft.com/en-us/fslogix/fslogix-trouble-shooting-ht
      - title: Configuration Setting Reference
        url: https://learn.microsoft.com/en-us/fslogix/reference-configuration-settings

  # ------------------------------------------------------------------ 5
  - id: az140-qz-12-05
    objective: "1.2.2"
    difficulty: 2
    status: draft
    type: yesno_statements
    stem:
      en: |
        Litware stores the FSLogix profile containers of an Azure Virtual Desktop host pool with Cloud Cache. `CCDLocations` lists two SMB providers: an Azure file share in West Europe, where the session hosts run, then an Azure file share in North Europe. The operations team wants to understand how sign-ins and outages of one share affect the users.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Litware stocke les conteneurs de profil FSLogix d'un pool d'hôtes Azure Virtual Desktop avec Cloud Cache. `CCDLocations` liste deux fournisseurs SMB : un partage de fichiers Azure dans West Europe, où s'exécutent les hôtes de session, puis un partage de fichiers Azure dans North Europe. L'équipe d'exploitation veut comprendre comment les connexions et les pannes d'un partage affectent les utilisateurs.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - { id: s1, text: { en: "At sign-in, FSLogix reads the profile data from both providers at the same time to fill the local cache.", fr: "À la connexion, FSLogix lit les données du profil depuis les deux fournisseurs en même temps pour remplir le cache local." } }
        - { id: s2, text: { en: "If the North Europe share becomes unhealthy during a session, FSLogix queues the changes and flushes them when the share is healthy again.", fr: "Si le partage de North Europe devient défaillant pendant une session, FSLogix met les modifications en file d'attente et les vide vers ce partage quand il redevient sain." } }
        - { id: s3, text: { en: "FSLogix uses the providers in the order of the entries in CCDLocations, which is why the closer share is listed first.", fr: "FSLogix utilise les fournisseurs dans l'ordre des entrées de CCDLocations : c'est pourquoi le partage le plus proche est listé en premier." } }
    answer:
      values: { s1: false, s2: true, s3: true }
    explanation:
      correct:
        en: |
          Cloud Cache hydrates the local cache from only one provider, but writes every change to all the providers listed in `CCDLocations`. When a provider is unhealthy, changes are queued and flushed when it recovers. Providers are used in the order of the entries, so they should be listed by proximity, then preference.
        fr: |
          Cloud Cache remplit le cache local depuis un seul fournisseur, mais écrit chaque modification sur tous les fournisseurs listés dans `CCDLocations`. Quand un fournisseur est défaillant, les modifications sont mises en file d'attente et vidées quand il se rétablit. Les fournisseurs sont utilisés dans l'ordre des entrées : il faut donc les lister par proximité, puis par préférence.
      options:
        s1: { en: "Only one provider is used to hydrate the local cache; the writes, not the reads, go to all providers.", fr: "Un seul fournisseur sert à remplir le cache local ; ce sont les écritures, pas les lectures, qui vont vers tous les fournisseurs." }
    references:
      - title: Cloud Cache Overview
        url: https://learn.microsoft.com/en-us/fslogix/concepts-fslogix-cloud-cache

  # ------------------------------------------------------------------ 6
  - id: az140-qz-12-06
    objective: "1.2.5"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        Woodgrove Bank stores the FSLogix profile containers of an Azure Virtual Desktop pooled host pool on an Azure NetApp Files SMB volume named **vol-profiles**. The NetApp account has an Active Directory connection to woodgrove.com, and the volume has Continuous Availability enabled. The root of the volume grants Full control to **WOODGROVE\AVD-Admins** only.

        You need to ensure that members of **WOODGROVE\AVD-Users** can create their own profile container but can't open the profile folders of other users. The solution must follow the principle of least privilege.

        Which two actions should you perform? Each correct answer presents part of the solution.

        NOTE: Each correct selection is worth one point.
      fr: |
        Woodgrove Bank stocke les conteneurs de profil FSLogix d'un pool d'hôtes Azure Virtual Desktop regroupé sur un volume SMB Azure NetApp Files nommé **vol-profiles**. Le compte NetApp dispose d'une connexion Active Directory à woodgrove.com, et Continuous Availability est activé sur le volume. La racine du volume n'accorde Contrôle total qu'à **WOODGROVE\AVD-Admins**.

        Vous devez faire en sorte que les membres de **WOODGROVE\AVD-Users** puissent créer leur propre conteneur de profil sans pouvoir ouvrir les dossiers de profil des autres utilisateurs. La solution doit respecter le principe du privilège minimum.

        Quelles sont les deux actions que vous devez effectuer ? Chaque bonne réponse présente une partie de la solution.

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "Assign the Storage File Data SMB Share Contributor role on the NetApp account to AVD-Users.", fr: "Attribuer le rôle Storage File Data SMB Share Contributor sur le compte NetApp à AVD-Users." } }
        - { id: b, text: { en: "Grant AVD-Users Modify on the volume root, applied to this folder only.", fr: "Accorder Modifier à AVD-Users sur la racine du volume, appliqué à ce dossier seulement." } }
        - { id: c, text: { en: "Grant AVD-Users Modify on the volume root, applied to this folder, subfolders and files.", fr: "Accorder Modifier à AVD-Users sur la racine du volume, appliqué à ce dossier, aux sous-dossiers et aux fichiers." } }
        - { id: d, text: { en: "Grant CREATOR OWNER Modify on the volume root, applied to subfolders and files only.", fr: "Accorder Modifier à CREATOR OWNER sur la racine du volume, appliqué aux sous-dossiers et aux fichiers seulement." } }
        - { id: e, text: { en: "Set the default share-level permission of the volume to Storage File Data SMB Share Contributor.", fr: "Définir l'autorisation par défaut au niveau du partage du volume sur Storage File Data SMB Share Contributor." } }
    answer: { optionIds: [b, d] }
    explanation:
      correct:
        en: |
          Azure NetApp Files relies only on Windows ACLs for SMB access, so the FSLogix recommendations apply directly to the volume. Users get Modify on the root for this folder only, which lets them create their own folder without seeing inside others. CREATOR OWNER gets Modify on subfolders and files only, so each user has Modify on the folder and container they created.
        fr: |
          Azure NetApp Files s'appuie uniquement sur les ACL Windows pour l'accès SMB : les recommandations FSLogix s'appliquent donc directement au volume. Les utilisateurs obtiennent Modifier sur la racine pour ce dossier seulement, ce qui leur permet de créer leur propre dossier sans voir l'intérieur de ceux des autres. CREATOR OWNER obtient Modifier sur les sous-dossiers et les fichiers seulement : chaque utilisateur a ainsi Modifier sur le dossier et le conteneur qu'il a créés.
      options:
        a: { en: "The Storage File Data SMB Share roles belong to Azure Files; they play no part in access to an Azure NetApp Files SMB volume.", fr: "Les rôles Storage File Data SMB Share appartiennent à Azure Files ; ils ne jouent aucun rôle dans l'accès à un volume SMB Azure NetApp Files." }
        c: { en: "Inherited Modify on subfolders and files would let every user open the profile folders of other users.", fr: "Un droit Modifier hérité sur les sous-dossiers et les fichiers permettrait à chaque utilisateur d'ouvrir les dossiers de profil des autres." }
        e: { en: "A default share-level permission is an Azure Files setting of a storage account; Azure NetApp Files volumes don't have one.", fr: "L'autorisation par défaut au niveau du partage est un paramètre Azure Files d'un compte de stockage ; les volumes Azure NetApp Files n'en ont pas." }
    references:
      - title: Configure SMB Storage Permissions
        url: https://learn.microsoft.com/en-us/fslogix/how-to-configure-storage-permissions
      - title: Store FSLogix profile containers on Azure NetApp Files
        url: https://learn.microsoft.com/en-us/azure/virtual-desktop/create-fslogix-profile-container

  # ------------------------------------------------------------------ 7
  - id: az140-qz-12-07
    objective: "1.2.3"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Tailspin Toys has no AD DS domain. All users are cloud-only Microsoft Entra identities in the Azure public cloud, and the session hosts of an Azure Virtual Desktop host pool are Microsoft Entra joined. FSLogix profile containers are stored in a storage account named **sttail22**.

        You performed the following tasks:

        - enabled Microsoft Entra Kerberos on sttail22 and granted admin consent to its application;
        - excluded the application from the conditional access policy that requires MFA;
        - set the default share-level permission to Storage File Data SMB Share Contributor;
        - granted the cloud-only group **AVD-Users** Modify on the share root by using the **Manage access** tab;
        - enabled `CloudKerberosTicketRetrievalEnabled` and `LoadCredKeyFromProfile` on the session hosts.

        FSLogix still can't attach the containers, and authentication to the share fails. What should you do?
      fr: |
        Tailspin Toys ne dispose d'aucun domaine AD DS. Tous les utilisateurs sont des identités Microsoft Entra cloud uniquement dans le cloud public Azure, et les hôtes de session d'un pool d'hôtes Azure Virtual Desktop sont joints à Microsoft Entra. Les conteneurs de profil FSLogix sont stockés dans un compte de stockage nommé **sttail22**.

        Vous avez effectué les tâches suivantes :

        - activé Microsoft Entra Kerberos sur sttail22 et accordé le consentement administrateur à son application ;
        - exclu l'application de la stratégie d'accès conditionnel qui exige l'authentification multifacteur ;
        - défini l'autorisation par défaut au niveau du partage sur Storage File Data SMB Share Contributor ;
        - accordé Modifier sur la racine du partage au groupe cloud uniquement **AVD-Users** à l'aide de l'onglet **Manage access** ;
        - activé `CloudKerberosTicketRetrievalEnabled` et `LoadCredKeyFromProfile` sur les hôtes de session.

        FSLogix ne parvient toujours pas à attacher les conteneurs, et l'authentification auprès du partage échoue. Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Enable Microsoft Entra Domain Services authentication on sttail22 in addition to Microsoft Entra Kerberos.", fr: "Activer l'authentification Microsoft Entra Domain Services sur sttail22 en plus de Microsoft Entra Kerberos." } }
        - { id: b, text: { en: "Set AccessNetworkAsComputerObject to 1 so that FSLogix reaches the share as the session host.", fr: "Définir AccessNetworkAsComputerObject sur 1 pour que FSLogix joigne le partage en tant qu'hôte de session." } }
        - { id: c, text: { en: "Change the default share-level permission to Storage File Data SMB Share Elevated Contributor.", fr: "Remplacer l'autorisation par défaut au niveau du partage par Storage File Data SMB Share Elevated Contributor." } }
        - { id: d, text: { en: "Add the kdc_enable_cloud_group_sids tag to the manifest of the application of sttail22.", fr: "Ajouter la balise kdc_enable_cloud_group_sids au manifeste de l'application de sttail22." } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          For cloud-only identities, adding the `kdc_enable_cloud_group_sids` tag to the application manifest is mandatory: it makes Microsoft Entra ID include cloud-only group SIDs in the Kerberos ticket, and without it authentication fails. Every other prerequisite listed in the scenario is already in place.
        fr: |
          Pour les identités cloud uniquement, l'ajout de la balise `kdc_enable_cloud_group_sids` au manifeste de l'application est obligatoire : elle fait inclure par Microsoft Entra ID les SID des groupes cloud uniquement dans le ticket Kerberos, et sans elle l'authentification échoue. Tous les autres prérequis listés dans le scénario sont déjà en place.
      options:
        a: { en: "A storage account can use only one identity source, and cloud-only users without a managed domain need Microsoft Entra Kerberos.", fr: "Un compte de stockage ne peut utiliser qu'une seule source d'identité, et des utilisateurs cloud uniquement sans domaine managé ont besoin de Microsoft Entra Kerberos." }
        b: { en: "Accessing the share as the computer object is a security risk and doesn't fix the user's Kerberos authentication.", fr: "Accéder au partage avec l'objet ordinateur est un risque de sécurité et ne corrige pas l'authentification Kerberos de l'utilisateur." }
        c: { en: "Users don't need to change ACLs, and a higher share-level role doesn't fix a failed Kerberos authentication.", fr: "Les utilisateurs n'ont pas à modifier les ACL, et un rôle plus élevé au niveau du partage ne corrige pas un échec d'authentification Kerberos." }
    references:
      - title: Store FSLogix profile containers on Azure Files using Microsoft Entra ID
        url: https://learn.microsoft.com/en-us/azure/virtual-desktop/create-profile-container-azure-ad
      - title: Enable Microsoft Entra Kerberos authentication for hybrid and cloud-only identities on Azure Files
        url: https://learn.microsoft.com/en-us/azure/storage/files/storage-files-identity-auth-hybrid-identities-enable

  # ------------------------------------------------------------------ 8
  - id: az140-qz-12-08
    objective: "1.2.5"
    difficulty: 3
    status: draft
    type: dropdown
    shuffle: false
    stem:
      en: |
        Adatum stores the FSLogix profile containers of two Azure Virtual Desktop host pools on Azure NetApp Files. Each volume will be in its own capacity pool, which uses the auto QoS type.

        | Volume | Quota | Throughput required during the sign-in peak |
        | --- | --- | --- |
        | vol-hp1 | 4 TiB | At least 400 MiB/s |
        | vol-hp2 | 3 TiB | At least 150 MiB/s |

        You must choose the lowest service level that meets each requirement without changing the quotas.

        How should you configure the capacity pools? To answer, select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Adatum stocke les conteneurs de profil FSLogix de deux pools d'hôtes Azure Virtual Desktop sur Azure NetApp Files. Chaque volume se trouvera dans son propre pool de capacité, qui utilise le type de QoS automatique.

        | Volume | Quota | Débit requis pendant le pic de connexion |
        | --- | --- | --- |
        | vol-hp1 | 4 Tio | Au moins 400 Mio/s |
        | vol-hp2 | 3 Tio | Au moins 150 Mio/s |

        Vous devez choisir le niveau de service le plus bas qui répond à chaque exigence sans modifier les quotas.

        Comment devez-vous configurer les pools de capacité ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: text
      template:
        en: |
          Service level of the capacity pool of vol-hp1: [[svc1]]

          Service level of the capacity pool of vol-hp2: [[svc2]]

          Throughput limit of vol-hp1 with the selected service level: [[lim1]]
        fr: |
          Niveau de service du pool de capacité de vol-hp1 : [[svc1]]

          Niveau de service du pool de capacité de vol-hp2 : [[svc2]]

          Limite de débit de vol-hp1 avec le niveau de service sélectionné : [[lim1]]
      slots:
        - id: svc1
          options:
            - { id: std, text: Standard }
            - { id: prem, text: Premium }
            - { id: ultra, text: Ultra }
        - id: svc2
          options:
            - { id: std, text: Standard }
            - { id: prem, text: Premium }
            - { id: ultra, text: Ultra }
        - id: lim1
          options:
            - { id: l256, text: { en: "256 MiB/s", fr: "256 Mio/s" } }
            - { id: l400, text: { en: "400 MiB/s", fr: "400 Mio/s" } }
            - { id: l512, text: { en: "512 MiB/s", fr: "512 Mio/s" } }
            - { id: l768, text: { en: "768 MiB/s", fr: "768 Mio/s" } }
    answer:
      values: { svc1: ultra, svc2: prem, lim1: l512 }
    explanation:
      correct:
        en: |
          With auto QoS, a volume's throughput limit is its quota times the throughput per TiB of the service level: Standard 16, Premium 64 and Ultra 128 MiB/s per TiB. For vol-hp1 (4 TiB), Premium gives only 256 MiB/s, so Ultra is needed and gives 4 × 128 = 512 MiB/s. For vol-hp2 (3 TiB), Standard gives 48 MiB/s and Premium gives 192 MiB/s, which meets 150 MiB/s.
        fr: |
          Avec la QoS automatique, la limite de débit d'un volume est son quota multiplié par le débit par Tio du niveau de service : Standard 16, Premium 64 et Ultra 128 Mio/s par Tio. Pour vol-hp1 (4 Tio), Premium ne donne que 256 Mio/s : il faut Ultra, qui donne 4 × 128 = 512 Mio/s. Pour vol-hp2 (3 Tio), Standard donne 48 Mio/s et Premium 192 Mio/s, ce qui couvre 150 Mio/s.
      options:
        l256: { en: "256 MiB/s is the limit of a 4 TiB Premium volume, below the 400 MiB/s required.", fr: "256 Mio/s est la limite d'un volume Premium de 4 Tio, en dessous des 400 Mio/s requis." }
        l400: { en: "Auto QoS doesn't set the limit to the requirement; it's always quota × throughput per TiB.", fr: "La QoS automatique ne règle pas la limite sur le besoin ; elle vaut toujours quota × débit par Tio." }
    references:
      - title: Service levels for Azure NetApp Files
        url: https://learn.microsoft.com/en-us/azure/azure-netapp-files/azure-netapp-files-service-levels

  # ------------------------------------------------------------------ 9
  - id: az140-qz-12-09
    objective: "1.2.1"
    difficulty: 3
    status: draft
    type: dragdrop
    stem:
      en: |
        Northwind Traders is planning user data storage for three Azure Virtual Desktop host pools in the West Europe region. The session hosts are joined to the northwind.com AD DS domain.

        | Host pool | Type | Users | Requirements |
        | --- | --- | --- | --- |
        | HP-Dev | Personal | 40 developers, each always on the same VM | Minimize cost; no profile data needs to be kept when a VM is replaced |
        | HP-Call | Pooled | 900 call center agents | Profiles must stay available if one availability zone fails; minimize administrative effort |
        | HP-Eng | Pooled | 6,000 concurrent engineers | Storage latency of about 1 ms; Azure-native platform service |

        Which storage should you recommend for the profiles of each host pool? To answer, drag the appropriate storage options to the correct host pools. Each option may be used once or not at all.

        NOTE: Each correct selection is worth one point.
      fr: |
        Northwind Traders planifie le stockage des données utilisateur de trois pools d'hôtes Azure Virtual Desktop dans la région West Europe. Les hôtes de session sont joints au domaine AD DS northwind.com.

        | Pool d'hôtes | Type | Utilisateurs | Exigences |
        | --- | --- | --- | --- |
        | HP-Dev | Personnel | 40 développeurs, chacun toujours sur la même machine virtuelle | Réduire les coûts ; aucune donnée de profil ne doit être conservée quand une machine virtuelle est remplacée |
        | HP-Call | Regroupé | 900 agents du centre d'appels | Les profils doivent rester disponibles si une zone de disponibilité tombe en panne ; réduire l'effort administratif |
        | HP-Eng | Regroupé | 6 000 ingénieurs simultanés | Latence de stockage d'environ 1 ms ; service de plateforme natif Azure |

        Quel stockage devez-vous recommander pour les profils de chaque pool d'hôtes ? Pour répondre, faites glisser les options de stockage appropriées vers les pools d'hôtes correspondants. Chaque option peut être utilisée une fois ou pas du tout.

        Remarque : chaque sélection correcte vaut un point.
    body:
      reuse: false
      items:
        - { id: local, text: { en: "Local profiles on the OS disk of each session host", fr: "Profils locaux sur le disque du système d'exploitation de chaque hôte de session" } }
        - { id: lrs, text: { en: "FSLogix on an Azure Files SSD share with LRS", fr: "FSLogix sur un partage Azure Files SSD avec LRS" } }
        - { id: zrs, text: { en: "FSLogix on an Azure Files SSD share with ZRS", fr: "FSLogix sur un partage Azure Files SSD avec ZRS" } }
        - { id: anf, text: { en: "FSLogix on Azure NetApp Files SMB volumes", fr: "FSLogix sur des volumes SMB Azure NetApp Files" } }
        - { id: s2d, text: { en: "FSLogix on a Storage Spaces Direct cluster of VMs", fr: "FSLogix sur un cluster Storage Spaces Direct de machines virtuelles" } }
      targets:
        - { id: dev, text: HP-Dev }
        - { id: call, text: HP-Call }
        - { id: eng, text: HP-Eng }
    answer:
      mapping: { dev: local, call: zrs, eng: anf }
    explanation:
      correct:
        en: |
          In a personal host pool, each user always returns to the same VM, so the default local profile follows the user; with nothing to keep when a VM is replaced, extra profile storage only adds cost. A zone-redundant (ZRS) Azure Files SSD share survives the loss of a zone with no storage VM to manage. Azure NetApp Files is the Azure-native service that offers about 1 ms latency at enterprise scale, against about 3 ms for Azure Files.
        fr: |
          Dans un pool d'hôtes personnel, chaque utilisateur revient toujours sur la même machine virtuelle : le profil local par défaut le suit, et comme rien ne doit être conservé lors d'un remplacement, un stockage de profils supplémentaire ne fait qu'ajouter des coûts. Un partage Azure Files SSD redondant interzone (ZRS) survit à la perte d'une zone sans machine virtuelle de stockage à gérer. Azure NetApp Files est le service natif Azure qui offre une latence d'environ 1 ms à l'échelle de l'entreprise, contre environ 3 ms pour Azure Files.
      options:
        lrs: { en: "LRS keeps all copies in one datacenter, so the profiles of HP-Call would be lost with that zone.", fr: "LRS conserve toutes les copies dans un seul centre de données : les profils de HP-Call seraient perdus avec cette zone." }
        s2d: { en: "Storage Spaces Direct is self-managed on VMs: it isn't a platform service and adds administrative effort.", fr: "Storage Spaces Direct est autogéré sur des machines virtuelles : ce n'est pas un service de plateforme et il ajoute de l'effort administratif." }
    references:
      - title: Storage options for FSLogix profile containers in Azure Virtual Desktop
        url: https://learn.microsoft.com/en-us/azure/virtual-desktop/store-fslogix-profile
      - title: User profile management for Azure Virtual Desktop with FSLogix profile containers
        url: https://learn.microsoft.com/en-us/azure/virtual-desktop/fslogix-containers-azure-files

  # ------------------------------------------------------------------ 10
  - id: az140-qz-12-10
    objective: "1.2.4"
    difficulty: 3
    status: draft
    type: hotarea
    stem:
      en: |
        Contoso stores the FSLogix profile containers of an Azure Virtual Desktop host pool in an Azure file share named **profiles**. The storage account is joined to the contoso.com AD DS domain, and its default share-level permission is **None**. The root of the share has only these NTFS entries: CREATOR OWNER Modify (subfolders and files only), CONTOSO\AVD-Admins Full control, and CONTOSO\AVD-Users Modify (this folder only).

        None of the following users has signed in yet. The roles in the table are assigned at the scope shown.

        Answer each prompt by selecting the appropriate user.

        NOTE: Each correct selection is worth one point.
      fr: |
        Contoso stocke les conteneurs de profil FSLogix d'un pool d'hôtes Azure Virtual Desktop dans un partage de fichiers Azure nommé **profiles**. Le compte de stockage est joint au domaine AD DS contoso.com, et son autorisation par défaut au niveau du partage est **None**. La racine du partage ne contient que ces entrées NTFS : CREATOR OWNER Modifier (sous-dossiers et fichiers seulement), CONTOSO\AVD-Admins Contrôle total et CONTOSO\AVD-Users Modifier (ce dossier seulement).

        Aucun des utilisateurs suivants ne s'est encore connecté. Les rôles du tableau sont attribués à l'étendue indiquée.

        Répondez à chaque consigne en sélectionnant l'utilisateur approprié.

        Remarque : chaque sélection correcte vaut un point.
    body:
      prompts:
        - { id: p1, text: { en: "The only user for whom FSLogix can create a profile container at the first sign-in", fr: "Le seul utilisateur pour lequel FSLogix peut créer un conteneur de profil à la première connexion" } }
        - { id: p2, text: { en: "The user who is allowed at the share level but blocked by the NTFS permissions", fr: "L'utilisateur autorisé au niveau du partage mais bloqué par les autorisations NTFS" } }
      grid:
        header:
          - { en: "User", fr: "Utilisateur" }
          - { en: "Synced to Microsoft Entra ID", fr: "Synchronisé avec Microsoft Entra ID" }
          - { en: "Azure role assignment", fr: "Attribution de rôle Azure" }
          - { en: "Member of CONTOSO\\AVD-Users", fr: "Membre de CONTOSO\\AVD-Users" }
        rows:
          - [ { text: User1, area: u1 }, { text: { en: "Yes", fr: "Oui" } }, { text: { en: "Contributor on the storage account", fr: "Contributor sur le compte de stockage" } }, { text: { en: "Yes", fr: "Oui" } } ]
          - [ { text: User2, area: u2 }, { text: { en: "Yes", fr: "Oui" } }, { text: { en: "Storage File Data SMB Share Reader on profiles", fr: "Storage File Data SMB Share Reader sur profiles" } }, { text: { en: "Yes", fr: "Oui" } } ]
          - [ { text: User3, area: u3 }, { text: { en: "Yes", fr: "Oui" } }, { text: { en: "Storage File Data SMB Share Contributor on profiles", fr: "Storage File Data SMB Share Contributor sur profiles" } }, { text: { en: "No", fr: "Non" } } ]
          - [ { text: User4, area: u4 }, { text: { en: "Yes", fr: "Oui" } }, { text: { en: "Storage File Data SMB Share Contributor on profiles", fr: "Storage File Data SMB Share Contributor sur profiles" } }, { text: { en: "Yes", fr: "Oui" } } ]
          - [ { text: User5, area: u5 }, { text: { en: "No", fr: "Non" } }, { text: { en: "None", fr: "Aucune" } }, { text: { en: "Yes", fr: "Oui" } } ]
    answer:
      values: { p1: u4, p2: u3 }
    explanation:
      correct:
        en: |
          A user needs both a share-level role that allows writing and NTFS permissions on the root. User4 has Storage File Data SMB Share Contributor and Modify on the root through AVD-Users, so FSLogix can create the folder and container. User3 has the share-level role, but no NTFS entry lets this user create a folder: CREATOR OWNER only applies to objects that the user has created.
        fr: |
          Un utilisateur a besoin à la fois d'un rôle au niveau du partage qui autorise l'écriture et d'autorisations NTFS sur la racine. User4 dispose de Storage File Data SMB Share Contributor et de Modifier sur la racine par AVD-Users : FSLogix peut créer le dossier et le conteneur. User3 a le rôle au niveau du partage, mais aucune entrée NTFS ne permet à cet utilisateur de créer un dossier : CREATOR OWNER ne s'applique qu'aux objets que l'utilisateur a créés.
      options:
        u1: { en: "Contributor is a management role: it grants no data access to the share over SMB, and the default permission is None.", fr: "Contributor est un rôle de gestion : il ne donne aucun accès aux données du partage en SMB, et l'autorisation par défaut est None." }
        u2: { en: "Storage File Data SMB Share Reader allows read access only, so the container can't be created.", fr: "Storage File Data SMB Share Reader n'autorise que la lecture : le conteneur ne peut pas être créé." }
        u5: { en: "An unsynced user can only get share-level access through the default permission, which is None.", fr: "Un utilisateur non synchronisé ne peut obtenir un accès au niveau du partage que par l'autorisation par défaut, qui est None." }
    references:
      - title: Assign share-level permissions for Azure file shares
        url: https://learn.microsoft.com/en-us/azure/storage/files/storage-files-identity-assign-share-level-permissions
      - title: Configure SMB Storage Permissions
        url: https://learn.microsoft.com/en-us/fslogix/how-to-configure-storage-permissions
