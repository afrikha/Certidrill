chapter: 32-clients-redirection
questions:
  # ------------------------------------------------------------------ 1
  - id: az140-qz-32-01
    objective: "3.2.1"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Contoso users connect to Azure Virtual Desktop from Windows 11 laptops by using the Remote Desktop client for Windows (MSI). Contoso uses the Azure public cloud.

        You need to move the users to a client that Microsoft supports for Azure Virtual Desktop.

        Which client should you deploy?
      fr: |
        Les utilisateurs de Contoso se connectent à Azure Virtual Desktop depuis des ordinateurs portables Windows 11 avec le client Bureau à distance pour Windows (MSI). Contoso utilise le cloud public Azure.

        Vous devez faire passer les utilisateurs à un client que Microsoft prend en charge pour Azure Virtual Desktop.

        Quel client devez-vous déployer ?
    body:
      options:
        - { id: a, text: { en: "The latest version of the Remote Desktop client for Windows (MSI)", fr: "La dernière version du client Bureau à distance pour Windows (MSI)" } }
        - { id: b, text: { en: "The Remote Desktop app from the Microsoft Store", fr: "L'application Bureau à distance du Microsoft Store" } }
        - { id: c, text: { en: "Windows App", fr: "Windows App" } }
        - { id: d, text: { en: "The Remote Desktop web client", fr: "Le client web Bureau à distance" } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          Windows App is the client for Azure Virtual Desktop on every platform, including in a web browser. In public cloud environments, the Remote Desktop client for Windows (MSI) and the Remote Desktop web client are no longer supported since March 27, 2026, and users must move to Windows App.
        fr: |
          Windows App est le client d'Azure Virtual Desktop sur toutes les plateformes, y compris dans un navigateur web. Dans le cloud public, le client Bureau à distance pour Windows (MSI) et le client web Bureau à distance ne sont plus pris en charge depuis le 27 mars 2026, et les utilisateurs doivent passer à Windows App.
      options:
        a: { en: "Updating the MSI client doesn't help: the client itself is no longer supported in public cloud and is no longer available for download.", fr: "Mettre à jour le client MSI ne sert à rien : le client lui-même n'est plus pris en charge dans le cloud public et n'est plus disponible au téléchargement." }
        b: { en: "The Remote Desktop app from the Microsoft Store reached end of support in September 2025 and is no longer available.", fr: "L'application Bureau à distance du Microsoft Store a atteint sa fin de support en septembre 2025 et n'est plus disponible." }
        d: { en: "The Remote Desktop web client lost support in public cloud on the same date as the MSI client; Windows App in a browser replaces it.", fr: "Le client web Bureau à distance n'est plus pris en charge dans le cloud public depuis la même date que le client MSI ; Windows App dans un navigateur le remplace." }
    references:
      - title: Remote Desktop client overview - Remote Desktop client
        url: https://learn.microsoft.com/en-us/previous-versions/remote-desktop-client/overview

  # ------------------------------------------------------------------ 2
  - id: az140-qz-32-02
    objective: "3.2.4"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Help desk agents at Wingtip Toys use a USB VoIP headset. Windows App on Windows redirects the headset to their Azure Virtual Desktop sessions by using opaque low-level redirection (`usbdevicestoredirect`).

        Which statement about the headset is true?
      fr: |
        Les agents du support de Wingtip Toys utilisent un casque VoIP USB. Windows App sur Windows redirige le casque vers leurs sessions Azure Virtual Desktop au moyen de la redirection de bas niveau opaque (`usbdevicestoredirect`).

        Quelle affirmation concernant le casque est vraie ?
    body:
      options:
        - { id: a, text: { en: "Its driver must be on the local devices only, and local apps can still use it while it's redirected.", fr: "Son pilote doit se trouver uniquement sur les appareils locaux, et les applications locales peuvent encore l'utiliser pendant sa redirection." } }
        - { id: b, text: { en: "Its driver must be on the session hosts, and local apps can still use it while it's redirected.", fr: "Son pilote doit se trouver sur les hôtes de session, et les applications locales peuvent encore l'utiliser pendant sa redirection." } }
        - { id: c, text: { en: "Its driver must be on the local devices only, and local apps can't use it while it's redirected.", fr: "Son pilote doit se trouver uniquement sur les appareils locaux, et les applications locales ne peuvent pas l'utiliser pendant sa redirection." } }
        - { id: d, text: { en: "Its driver must be on the session hosts, and local apps can't use it while it's redirected.", fr: "Son pilote doit se trouver sur les hôtes de session, et les applications locales ne peuvent pas l'utiliser pendant sa redirection." } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          Opaque low-level redirection forwards the raw USB traffic to the remote session without interpreting it, so the driver of the device must be installed in the session, on the session host. While the device is redirected, it can't be used on the local device and it can be used by only one remote session at a time.
        fr: |
          La redirection de bas niveau opaque transmet le trafic USB brut à la session distante sans l'interpréter : le pilote du périphérique doit donc être installé dans la session, sur l'hôte de session. Pendant sa redirection, le périphérique n'est pas utilisable sur l'appareil local et ne peut servir qu'à une seule session distante à la fois.
      options:
        a: { en: "This describes high-level redirection (cameras, microphones, printers), not the opaque low-level redirection used here.", fr: "Cela décrit la redirection de haut niveau (caméras, microphones, imprimantes), pas la redirection de bas niveau opaque utilisée ici." }
        b: { en: "The driver location is right, but an opaquely redirected device is unavailable on the local device during the redirection.", fr: "L'emplacement du pilote est correct, mais un périphérique redirigé de façon opaque n'est pas disponible sur l'appareil local pendant la redirection." }
        c: { en: "Opaque low-level redirection doesn't need the driver on the local device; the session host must interpret the raw USB traffic.", fr: "La redirection de bas niveau opaque n'a pas besoin du pilote sur l'appareil local ; c'est l'hôte de session qui doit interpréter le trafic USB brut." }
    references:
      - title: Peripheral and resource redirection over the Remote Desktop Protocol - Azure Virtual Desktop
        url: https://learn.microsoft.com/en-us/azure/virtual-desktop/redirection-remote-desktop-protocol

  # ------------------------------------------------------------------ 3
  - id: az140-qz-32-03
    objective: "3.2.2"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Fabrikam installed Windows App from the Microsoft Store on 300 Windows 11 devices that are managed by Configuration Manager.

        The change advisory board now requires that Windows App never updates itself automatically: IT tests each new version, then deploys it with Configuration Manager.

        What should you do?
      fr: |
        Fabrikam a installé Windows App depuis le Microsoft Store sur 300 appareils Windows 11 gérés par Configuration Manager.

        Le comité consultatif des changements exige désormais que Windows App ne se mette jamais à jour automatiquement : le service informatique teste chaque nouvelle version, puis la déploie avec Configuration Manager.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Keep the Store installation, and set DisableAutomaticUpdates to 1 on the devices.", fr: "Conserver l'installation depuis le Store, et définir DisableAutomaticUpdates sur 1 sur les appareils." } }
        - { id: b, text: { en: "Deploy the standalone MSIX package instead, and set DisableAutomaticUpdates to 1.", fr: "Déployer plutôt le package MSIX autonome, et définir DisableAutomaticUpdates sur 1." } }
        - { id: c, text: { en: "Keep the Store installation, and set DisableAutomaticUpdates to 2 on the devices.", fr: "Conserver l'installation depuis le Store, et définir DisableAutomaticUpdates sur 2 sur les appareils." } }
        - { id: d, text: { en: "Deploy the standalone MSIX package instead, and set DisableAutomaticUpdates to 3.", fr: "Déployer plutôt le package MSIX autonome, et définir DisableAutomaticUpdates sur 3." } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          Automatic updates of Windows App can be disabled only when it was installed from the standalone MSIX package; a Store installation follows the Microsoft Store update settings. With the MSIX package deployed by Configuration Manager, the value 1 of `DisableAutomaticUpdates` under `HKLM\SOFTWARE\Microsoft\WindowsApp` disables updates from all locations, and IT deploys each tested version itself.
        fr: |
          Les mises à jour automatiques de Windows App ne peuvent être désactivées que s'il a été installé à partir du package MSIX autonome ; une installation depuis le Store suit les paramètres de mise à jour du Microsoft Store. Avec le package MSIX déployé par Configuration Manager, la valeur 1 de `DisableAutomaticUpdates` sous `HKLM\SOFTWARE\Microsoft\WindowsApp` désactive les mises à jour de toutes les sources, et le service informatique déploie lui-même chaque version testée.
      options:
        a: { en: "A Store installation can't have its automatic updates disabled by this value: the Microsoft Store keeps pushing updates.", fr: "Les mises à jour automatiques d'une installation depuis le Store ne peuvent pas être désactivées par cette valeur : le Microsoft Store continue de pousser les mises à jour." }
        c: { en: "The value 2 only stops Windows App from contacting the Store; for a Store installation, the Microsoft Store still pushes updates as usual.", fr: "La valeur 2 empêche seulement Windows App de contacter le Store ; pour une installation depuis le Store, le Microsoft Store pousse toujours les mises à jour comme d'habitude." }
        d: { en: "The value 3 disables only the updates from the CDN; updates from the Microsoft Store stay enabled, so Windows App can still update without IT.", fr: "La valeur 3 désactive seulement les mises à jour depuis le CDN ; les mises à jour depuis le Microsoft Store restent activées, et Windows App peut donc encore se mettre à jour sans le service informatique." }
    references:
      - title: Configure Windows App Updates on Windows - Windows App
        url: https://learn.microsoft.com/en-us/windows-app/configure-updates-windows

  # ------------------------------------------------------------------ 4
  - id: az140-qz-32-04
    objective: "3.2.3"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Adatum users connect to an Azure Virtual Desktop host pool in the West Europe region. Adatum will open an office in Singapore, and the users of that office will connect by using Windows App. No session host exists outside West Europe.

        Before you decide whether to deploy a second host pool in another Azure region, you need to estimate the round-trip time from the Singapore office to several Azure regions.

        What should you use?
      fr: |
        Les utilisateurs d'Adatum se connectent à un pool d'hôtes Azure Virtual Desktop dans la région Europe Ouest. Adatum va ouvrir un bureau à Singapour, et les utilisateurs de ce bureau se connecteront avec Windows App. Aucun hôte de session n'existe en dehors d'Europe Ouest.

        Avant de décider de déployer un second pool d'hôtes dans une autre région Azure, vous devez estimer le temps d'aller-retour entre le bureau de Singapour et plusieurs régions Azure.

        Que devez-vous utiliser ?
    body:
      options:
        - { id: a, text: { en: "The connection information of Windows App during a session", fr: "Les informations de connexion de Windows App pendant une session" } }
        - { id: b, text: { en: "The Azure Virtual Desktop Experience Estimator", fr: "Azure Virtual Desktop Experience Estimator" } }
        - { id: c, text: { en: "The connection reports of Azure Virtual Desktop Insights", fr: "Les rapports de connexion d'Azure Virtual Desktop Insights" } }
        - { id: d, text: { en: "The connection troubleshoot tool of Azure Network Watcher", fr: "L'outil de résolution des problèmes de connexion d'Azure Network Watcher" } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          The Azure Virtual Desktop Experience Estimator measures, from the location of the browser that opens it, the estimated round-trip time to the Azure regions. It works before any session host exists in a region, which is what a region choice for a new office needs.
        fr: |
          Azure Virtual Desktop Experience Estimator mesure, depuis l'emplacement du navigateur qui l'ouvre, le temps d'aller-retour estimé vers les régions Azure. Il fonctionne avant qu'un hôte de session existe dans une région, ce dont a besoin le choix de région pour un nouveau bureau.
      options:
        a: { en: "The connection information shows the round-trip time and transport of the current connection only, here to West Europe.", fr: "Les informations de connexion indiquent le temps d'aller-retour et le transport de la connexion en cours uniquement, ici vers Europe Ouest." }
        c: { en: "Insights reports the performance of connections to existing host pools; it can't measure regions where no session host exists.", fr: "Insights présente les performances des connexions aux pools d'hôtes existants ; il ne peut pas mesurer des régions où aucun hôte de session n'existe." }
        d: { en: "Connection troubleshoot tests connectivity from an Azure source such as a virtual machine; it can't measure from the users' office.", fr: "La résolution des problèmes de connexion teste la connectivité depuis une source Azure comme une machine virtuelle ; elle ne peut pas mesurer depuis le bureau des utilisateurs." }
    references:
      - title: Basic troubleshooting for Windows App - Windows App
        url: https://learn.microsoft.com/en-us/windows-app/troubleshoot-basic

  # ------------------------------------------------------------------ 5
  - id: az140-qz-32-05
    objective: "3.2.5"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Proseware has an Azure Virtual Desktop host pool named **hp-portal**. Multimedia redirection is installed on the session hosts, and an Intune settings catalog profile force-installs the multimedia redirection extension in Microsoft Edge by using the **Configure extension management settings** policy.

        An internal web app at `portal.proseware.com` displays incorrectly when the extension is active. The extension must keep working on every other site.

        What should you add to the JSON entry of the extension?
      fr: |
        Proseware dispose d'un pool d'hôtes Azure Virtual Desktop nommé **hp-portal**. La redirection multimédia est installée sur les hôtes de session, et un profil de catalogue de paramètres Intune installe de force l'extension de redirection multimédia dans Microsoft Edge au moyen de la stratégie **Configure extension management settings**.

        Une application web interne sur `portal.proseware.com` s'affiche mal quand l'extension est active. L'extension doit continuer de fonctionner sur tous les autres sites.

        Que devez-vous ajouter à l'entrée JSON de l'extension ?
    body:
      options:
        - { id: a, text: "`\"runtime_allowed_hosts\": [ \"*://portal.proseware.com\" ]`" }
        - { id: b, text: "`\"installation_mode\": \"blocked\"`" }
        - { id: c, text: "`\"runtime_blocked_hosts\": [ \"*://portal.proseware.com\" ]`" }
        - { id: d, text: "`\"toolbar_state\": \"default_hidden\"`" }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          `runtime_blocked_hosts` lists the domains on which the browser stops the extension from interacting with pages, so multimedia redirection no longer runs on `portal.proseware.com`. The extension stays installed and keeps working on every other site.
        fr: |
          `runtime_blocked_hosts` liste les domaines sur lesquels le navigateur empêche l'extension d'interagir avec les pages : la redirection multimédia ne s'exécute donc plus sur `portal.proseware.com`. L'extension reste installée et continue de fonctionner sur tous les autres sites.
      options:
        a: { en: "`runtime_allowed_hosts` lists exceptions to a browser block: it lets the extension interact with the domain instead of stopping it.", fr: "`runtime_allowed_hosts` liste des exceptions à un blocage du navigateur : il laisse l'extension interagir avec le domaine au lieu de l'arrêter." }
        b: { en: "The blocked installation mode blocks the extension in the browser, so redirection stops on every site.", fr: "Le mode d'installation blocked bloque l'extension dans le navigateur : la redirection s'arrête alors sur tous les sites." }
        d: { en: "`toolbar_state` only controls whether the extension icon appears on the toolbar; the extension still runs on the site.", fr: "`toolbar_state` contrôle seulement l'affichage de l'icône de l'extension dans la barre d'outils ; l'extension s'exécute toujours sur le site." }
    references:
      - title: Multimedia redirection for video playback and calls in a remote session - Azure Virtual Desktop
        url: https://learn.microsoft.com/en-us/azure/virtual-desktop/multimedia-redirection

  # ------------------------------------------------------------------ 6
  - id: az140-qz-32-06
    objective: "3.2.1"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        Litware is moving its users to an Azure Virtual Desktop host pool named **hp-corp**. Public network access is disabled on hp-corp and on its workspace, and every connection must use Azure Private Link from the corporate network.

        Litware users have corporate Windows 11 laptops, MacBooks, iPads and Android tablets. Each device is connected to two monitors or to a dock that supports two monitors. The sessions must meet the following requirements:

        - The remote desktop spans the two monitors.
        - Microsoft Teams in the session uses media optimization.

        Which two clients meet all the requirements? Each correct answer presents a complete solution.

        NOTE: Each correct selection is worth one point.
      fr: |
        Litware fait passer ses utilisateurs sur un pool d'hôtes Azure Virtual Desktop nommé **hp-corp**. L'accès au réseau public est désactivé sur hp-corp et sur son espace de travail, et toutes les connexions doivent passer par Azure Private Link depuis le réseau de l'entreprise.

        Les utilisateurs de Litware disposent d'ordinateurs portables Windows 11, de MacBook, d'iPad et de tablettes Android de l'entreprise. Chaque appareil est relié à deux moniteurs ou à une station d'accueil qui prend en charge deux moniteurs. Les sessions doivent répondre aux exigences suivantes :

        - Le bureau à distance s'étend sur les deux moniteurs.
        - Microsoft Teams dans la session utilise l'optimisation multimédia.

        Quels sont les deux clients qui répondent à toutes les exigences ? Chaque bonne réponse constitue une solution complète.

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "Windows App installed on the Windows 11 laptops", fr: "Windows App installé sur les ordinateurs portables Windows 11" } }
        - { id: b, text: { en: "Windows App in Microsoft Edge on the Windows 11 laptops", fr: "Windows App dans Microsoft Edge sur les ordinateurs portables Windows 11" } }
        - { id: c, text: { en: "Windows App installed on the iPads", fr: "Windows App installé sur les iPad" } }
        - { id: d, text: { en: "Windows App installed on the MacBooks", fr: "Windows App installé sur les MacBook" } }
        - { id: e, text: { en: "Windows App installed on the Android tablets", fr: "Windows App installé sur les tablettes Android" } }
    answer: { optionIds: [a, d] }
    explanation:
      correct:
        en: |
          Windows App on Windows and on macOS supports Private Link, multiple monitors and the Teams media optimization, so both meet every requirement. The other clients each miss at least one requirement: multiple monitors on iPadOS and Android tablets, and Private Link, multiple monitors and the Teams optimization in a web browser.
        fr: |
          Windows App sur Windows et sur macOS prend en charge Private Link, plusieurs moniteurs et l'optimisation multimédia de Teams : les deux répondent donc à toutes les exigences. Les autres clients manquent chacun au moins une exigence : plusieurs moniteurs sur iPadOS et sur les tablettes Android, et Private Link, plusieurs moniteurs et l'optimisation de Teams dans un navigateur web.
      options:
        b: { en: "Windows App in a web browser supports neither Private Link nor multiple monitors nor the Teams media optimization.", fr: "Windows App dans un navigateur web ne prend en charge ni Private Link, ni plusieurs moniteurs, ni l'optimisation multimédia de Teams." }
        c: { en: "Windows App on iPadOS supports Private Link and the Teams optimization, but it doesn't display a session on multiple monitors.", fr: "Windows App sur iPadOS prend en charge Private Link et l'optimisation de Teams, mais il n'affiche pas une session sur plusieurs moniteurs." }
        e: { en: "Windows App on Android tablets supports Private Link and the Teams optimization, but not a session spanning multiple monitors.", fr: "Windows App sur les tablettes Android prend en charge Private Link et l'optimisation de Teams, mais pas une session étendue sur plusieurs moniteurs." }
    references:
      - title: Compare Windows App features across platforms and devices - Windows App
        url: https://learn.microsoft.com/en-us/windows-app/compare-platforms-features

  # ------------------------------------------------------------------ 7
  - id: az140-qz-32-07
    objective: "3.2.6"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Tailspin Toys has a pooled host pool named **hp-office**. The session hosts run Windows 11 Enterprise multi-session, version 24H2, are Microsoft Entra joined, and store user profiles in FSLogix profile containers. Users connect from their Windows laptops at home and at the office by using Windows App. The RDP properties of hp-office contain `redirectprinters:i:1`.

        Each laptop has several printers, including home printers and PDF printers, and all of them appear in the sessions. Tailspin has no print server.

        The security team requires that users see and print only to the two office printers in their sessions, from any location. A printer that a user adds must be available on every session host that the user signs in to. The solution must minimize administrative effort.

        What should you do?
      fr: |
        Tailspin Toys dispose d'un pool d'hôtes regroupé nommé **hp-office**. Les hôtes de session exécutent Windows 11 Entreprise multisession, version 24H2, sont joints à Microsoft Entra et stockent les profils utilisateur dans des conteneurs de profils FSLogix. Les utilisateurs se connectent depuis leurs ordinateurs portables Windows, à domicile et au bureau, avec Windows App. Les propriétés RDP de hp-office contiennent `redirectprinters:i:1`.

        Chaque ordinateur portable dispose de plusieurs imprimantes, dont des imprimantes personnelles et des imprimantes PDF, et toutes apparaissent dans les sessions. Tailspin n'a pas de serveur d'impression.

        L'équipe de sécurité exige que les utilisateurs ne voient et n'utilisent dans leurs sessions que les deux imprimantes du bureau, depuis n'importe quel lieu. Une imprimante ajoutée par un utilisateur doit être disponible sur chaque hôte de session auquel il se connecte. La solution doit réduire au minimum l'effort administratif.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Keep `redirectprinters:i:1`, and select the two office printers in the **Printer redirection** RDP property of hp-office.", fr: "Conserver `redirectprinters:i:1`, et sélectionner les deux imprimantes du bureau dans la propriété RDP **Printer redirection** de hp-office." } }
        - { id: b, text: { en: "Keep `redirectprinters:i:1`, and add `SmartRawPrinters:s:` with the driver name prefix of the two office printers.", fr: "Conserver `redirectprinters:i:1`, et ajouter `SmartRawPrinters:s:` avec le préfixe du nom de pilote des deux imprimantes du bureau." } }
        - { id: c, text: { en: "Set `redirectprinters:i:0`, and share the two office printers with the users through Universal Print.", fr: "Définir `redirectprinters:i:0`, et partager les deux imprimantes du bureau avec les utilisateurs par Universal Print." } }
        - { id: d, text: { en: "Set `redirectprinters:i:0`, and install the drivers of the two office printers on every session host.", fr: "Définir `redirectprinters:i:0`, et installer les pilotes des deux imprimantes du bureau sur chaque hôte de session." } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          Printer redirection always redirects every printer of the local device, so it must be disabled to hide the home and PDF printers. Universal Print is a cloud service that needs no print server: the office printers are registered and shared, and users install them in the session from any location. On Windows 11 Enterprise multi-session 22H2 or later, each user sees only the printers they install, and those printers follow the FSLogix profile to the other session hosts.
        fr: |
          La redirection d'imprimantes redirige toujours toutes les imprimantes de l'appareil local : elle doit donc être désactivée pour masquer les imprimantes personnelles et PDF. Universal Print est un service cloud qui ne demande aucun serveur d'impression : les imprimantes du bureau sont inscrites et partagées, et les utilisateurs les installent dans la session depuis n'importe quel lieu. Sur Windows 11 Entreprise multisession 22H2 ou version ultérieure, chaque utilisateur ne voit que les imprimantes qu'il installe, et elles suivent le profil FSLogix sur les autres hôtes de session.
      options:
        a: { en: "Printer redirection can't select printers: all the printers of the local device are redirected, never a selection.", fr: "La redirection d'imprimantes ne permet pas de choisir les imprimantes : toutes les imprimantes de l'appareil local sont redirigées, jamais une sélection." }
        b: { en: "`SmartRawPrinters` only sends RAW jobs to the matching redirected printers; it doesn't hide the other redirected printers.", fr: "`SmartRawPrinters` envoie seulement des travaux RAW aux imprimantes redirigées correspondantes ; il ne masque pas les autres imprimantes redirigées." }
        d: { en: "A driver on the session hosts doesn't connect the office printers to the sessions, and there's no print server to share them.", fr: "Un pilote sur les hôtes de session ne relie pas les imprimantes du bureau aux sessions, et aucun serveur d'impression ne les partage." }
    references:
      - title: Configure printer redirection over the Remote Desktop Protocol - Azure Virtual Desktop
        url: https://learn.microsoft.com/en-us/azure/virtual-desktop/redirection-configure-printers
      - title: Universal Print and Azure Virtual Desktop
        url: https://learn.microsoft.com/en-us/universal-print/fundamentals/universal-print-avd

  # ------------------------------------------------------------------ 8
  - id: az140-qz-32-08
    objective: "3.2.3"
    difficulty: 3
    status: draft
    type: ordering
    stem:
      en: |
        Northwind Traders has x64 Windows 11 Enterprise devices on an isolated factory network. The devices can reach only the Azure Virtual Desktop endpoints: they have no access to the internet or to the Microsoft Store, and a policy disables the Microsoft Store app. A device named **DEV1** must get Windows App.

        You have an administrator workstation that has internet access and the Windows Package Manager (winget).

        Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
      fr: |
        Northwind Traders dispose d'appareils Windows 11 Entreprise x64 sur un réseau d'usine isolé. Les appareils ne peuvent joindre que les points de terminaison Azure Virtual Desktop : ils n'ont accès ni à Internet ni au Microsoft Store, et une stratégie désactive l'application Microsoft Store. Un appareil nommé **DEV1** doit recevoir Windows App.

        Vous disposez d'un poste d'administration qui a accès à Internet et au Gestionnaire de package Windows (winget).

        Quelles sont les quatre actions que vous devez effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste des actions vers la zone de réponse et classez-les dans le bon ordre.
    body:
      count: 4
      actions:
        - { id: dl, text: { en: "On the administrator workstation, run `winget download --id 9N1F85V9T8BN`.", fr: "Sur le poste d'administration, exécuter `winget download --id 9N1F85V9T8BN`." } }
        - { id: copy, text: { en: "Copy the downloaded files to DEV1.", fr: "Copier les fichiers téléchargés sur DEV1." } }
        - { id: deps, text: { en: "On DEV1, run `Add-AppxPackage` for the x64 VCLibs and Windows App Runtime packages of the Dependencies folder.", fr: "Sur DEV1, exécuter `Add-AppxPackage` pour les packages VCLibs et Windows App Runtime x64 du dossier Dependencies." } }
        - { id: app, text: { en: "On DEV1, run `Add-AppxPackage` for the x64 Windows App `.msix` package of the root folder.", fr: "Sur DEV1, exécuter `Add-AppxPackage` pour le package `.msix` x64 de Windows App du dossier racine." } }
        - { id: wgi, text: { en: "On DEV1, run `winget install --id 9N1F85V9T8BN`.", fr: "Sur DEV1, exécuter `winget install --id 9N1F85V9T8BN`." } }
        - { id: msi, text: { en: "On DEV1, run `msiexec /i` with the Windows App package and the `/qn` switch.", fr: "Sur DEV1, exécuter `msiexec /i` avec le package Windows App et le commutateur `/qn`." } }
        - { id: store, text: { en: "Exclude DEV1 from the policy that disables the Microsoft Store app.", fr: "Exclure DEV1 de la stratégie qui désactive l'application Microsoft Store." } }
    answer:
      sequence: [dl, copy, deps, app]
    explanation:
      correct:
        en: |
          For a device that is offline or has the Store disabled, you download the Windows App package and its framework dependencies with `winget download` on a connected computer, then copy them to the device. On the device, the dependencies (VCLibs and Windows App Runtime) are installed first with `Add-AppxPackage`, then the Windows App `.msix` package from the root folder of the download.
        fr: |
          Pour un appareil hors connexion ou dont le Store est désactivé, vous téléchargez le package Windows App et ses dépendances de framework avec `winget download` sur un ordinateur connecté, puis vous les copiez sur l'appareil. Sur l'appareil, les dépendances (VCLibs et Windows App Runtime) s'installent d'abord avec `Add-AppxPackage`, puis le package `.msix` de Windows App depuis le dossier racine du téléchargement.
      options:
        wgi: { en: "`winget install` on DEV1 must download the package, which DEV1 can't do without internet or Store access.", fr: "`winget install` sur DEV1 doit télécharger le package, ce que DEV1 ne peut pas faire sans accès à Internet ni au Store." }
        msi: { en: "Windows App is an MSIX package, installed with `Add-AppxPackage`, not a Windows Installer package for msiexec.", fr: "Windows App est un package MSIX, installé avec `Add-AppxPackage`, et non un package Windows Installer pour msiexec." }
        store: { en: "Enabling the Store app wouldn't help: DEV1 still has no network access to the Microsoft Store.", fr: "Activer l'application Store ne servirait à rien : DEV1 n'a toujours aucun accès réseau au Microsoft Store." }
    references:
      - title: Basic troubleshooting for Windows App - Windows App
        url: https://learn.microsoft.com/en-us/windows-app/troubleshoot-basic

  # ------------------------------------------------------------------ 9
  - id: az140-qz-32-09
    objective: "3.2.5"
    difficulty: 3
    status: draft
    type: dropdown
    stem:
      en: |
        Contoso has an Azure Virtual Desktop host pool named **hp-contact**. Multimedia redirection is installed on the session hosts, and the extension is enabled in Microsoft Edge for all users. Agents connect by using Windows App on Windows 11 devices that meet the multimedia redirection requirements.

        Agents take calls in an internal WebRTC calling app at `https://voice.contoso.com`. Video playback is redirected on YouTube, but calls on voice.contoso.com aren't redirected.

        You need to enable call redirection on voice.contoso.com for every user of the session hosts, without enabling it on any other additional site. You will run a script as an administrator on each session host.

        How should you complete the script? Select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Contoso dispose d'un pool d'hôtes Azure Virtual Desktop nommé **hp-contact**. La redirection multimédia est installée sur les hôtes de session, et l'extension est activée dans Microsoft Edge pour tous les utilisateurs. Les agents se connectent avec Windows App sur des appareils Windows 11 qui respectent les prérequis de la redirection multimédia.

        Les agents prennent des appels dans une application d'appel WebRTC interne sur `https://voice.contoso.com`. La lecture vidéo est redirigée sur YouTube, mais les appels sur voice.contoso.com ne sont pas redirigés.

        Vous devez activer la redirection des appels sur voice.contoso.com pour tous les utilisateurs des hôtes de session, sans l'activer sur aucun autre site supplémentaire. Vous exécuterez un script en tant qu'administrateur sur chaque hôte de session.

        Comment devez-vous compléter le script ? Sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: code
      language: powershell
      template: |
        $path = "[[path]]"
        New-Item -Path $path -Force
        New-ItemProperty -Path $path -Name [[name]] -PropertyType String `
          -Value "[[value]]" -Force
      slots:
        - id: path
          options:
            - { id: hkcu, text: "HKCU:\\Software\\Microsoft\\MMR" }
            - { id: edge, text: "HKLM:\\SOFTWARE\\Policies\\Microsoft\\Edge\\3rdparty\\extensions\\joeclbldhdmoijbaagobkhlpfjglcihd\\policy" }
            - { id: winapp, text: "HKLM:\\SOFTWARE\\Microsoft\\WindowsApp" }
        - id: name
          options:
            - { id: video, text: AllowedVideoRedirectionSites }
            - { id: allsites, text: AllowCallRedirectionAllSites }
            - { id: call, text: AllowedCallRedirectionSites }
        - id: value
          options:
            - { id: url, text: "https://voice.contoso.com/" }
            - { id: fqdn, text: voice.contoso.com }
            - { id: pattern, text: "*://*.contoso.com" }
    answer:
      values: { path: edge, name: call, value: fqdn }
    explanation:
      correct:
        en: |
          Extra call redirection sites are added on the session hosts with the `AllowedCallRedirectionSites` string value under the policy key of the Microsoft Edge extension (`joeclbldhdmoijbaagobkhlpfjglcihd`). The value lists FQDNs without a scheme and without a trailing slash, separated by semicolons, so `voice.contoso.com` enables call redirection on that site only.
        fr: |
          Les sites supplémentaires de redirection des appels s'ajoutent sur les hôtes de session avec la valeur de chaîne `AllowedCallRedirectionSites` sous la clé de stratégie de l'extension Microsoft Edge (`joeclbldhdmoijbaagobkhlpfjglcihd`). La valeur liste des FQDN sans schéma ni barre oblique finale, séparés par des points-virgules : `voice.contoso.com` active donc la redirection des appels sur ce seul site.
      options:
        hkcu: { en: "HKCU\\Software\\Microsoft\\MMR is the key of an experimental test setting on the local device, not the extension policy of the session hosts.", fr: "HKCU\\Software\\Microsoft\\MMR est la clé d'un paramètre de test expérimental sur l'appareil local, pas la stratégie de l'extension sur les hôtes de session." }
        winapp: { en: "HKLM\\SOFTWARE\\Microsoft\\WindowsApp holds the update settings of Windows App, not multimedia redirection settings.", fr: "HKLM\\SOFTWARE\\Microsoft\\WindowsApp contient les paramètres de mise à jour de Windows App, pas ceux de la redirection multimédia." }
        video: { en: "AllowedVideoRedirectionSites adds sites for video playback redirection, not for call redirection.", fr: "AllowedVideoRedirectionSites ajoute des sites pour la redirection de la lecture vidéo, pas pour la redirection des appels." }
        allsites: { en: "AllowCallRedirectionAllSites is an experimental DWORD for testing on all sites, which the requirement excludes.", fr: "AllowCallRedirectionAllSites est un DWORD expérimental pour tester sur tous les sites, ce que l'exigence exclut." }
        url: { en: "The list takes FQDNs without a scheme and without a trailing slash.", fr: "La liste attend des FQDN sans schéma ni barre oblique finale." }
        pattern: { en: "A wildcard pattern isn't the expected format, and it would cover the other contoso.com sites.", fr: "Un modèle avec caractères génériques n'est pas le format attendu, et il couvrirait les autres sites contoso.com." }
    references:
      - title: Multimedia redirection for video playback and calls in a remote session - Azure Virtual Desktop
        url: https://learn.microsoft.com/en-us/azure/virtual-desktop/multimedia-redirection

  # ------------------------------------------------------------------ 10
  - id: az140-qz-32-10
    objective: "3.2.4"
    difficulty: 3
    status: draft
    type: dropdown
    stem:
      en: |
        Adatum has a pooled host pool named **hp-clinic** in a resource group named **rg-avd**. Doctors connect by using Windows App on Windows 11 devices. The session hosts and the local devices are already configured to allow opaque low-level USB redirection, and no other policy restricts redirection.

        The custom RDP properties of hp-clinic must meet the following requirements:

        - The webcam of each device is available in the session for video consultations, and local apps can use it at the same time.
        - The fingerprint readers, whose device setup class GUID is `{53d29ef7-377c-4d14-864b-eb3a85769359}`, are redirected. No other USB device uses opaque low-level redirection.
        - The USB flash drives that doctors plug in during a session are redirected. The drives that are present when the session starts, such as C:, aren't.

        How should you complete the command? Select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Adatum dispose d'un pool d'hôtes regroupé nommé **hp-clinic** dans un groupe de ressources nommé **rg-avd**. Les médecins se connectent avec Windows App sur des appareils Windows 11. Les hôtes de session et les appareils locaux sont déjà configurés pour autoriser la redirection USB de bas niveau opaque, et aucune autre stratégie ne restreint la redirection.

        Les propriétés RDP personnalisées de hp-clinic doivent répondre aux exigences suivantes :

        - La webcam de chaque appareil est disponible dans la session pour les téléconsultations, et les applications locales peuvent l'utiliser en même temps.
        - Les lecteurs d'empreintes digitales, dont le GUID de classe d'installation de périphérique est `{53d29ef7-377c-4d14-864b-eb3a85769359}`, sont redirigés. Aucun autre périphérique USB n'utilise la redirection de bas niveau opaque.
        - Les clés USB que les médecins branchent pendant une session sont redirigées. Les lecteurs présents au démarrage de la session, comme C:, ne le sont pas.

        Comment devez-vous compléter la commande ? Sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: code
      language: powershell
      template: |
        Update-AzWvdHostPool -ResourceGroupName rg-avd -Name hp-clinic `
          -CustomRdpProperty "[[cam]];[[usb]];[[drv]]"
      slots:
        - id: cam
          options:
            - { id: usbstar, text: "usbdevicestoredirect:s:*" }
            - { id: camstar, text: "camerastoredirect:s:*" }
            - { id: devstar, text: "devicestoredirect:s:*" }
            - { id: camnone, text: "camerastoredirect:s:" }
        - id: usb
          options:
            - { id: usball, text: "usbdevicestoredirect:s:*" }
            - { id: usbnone, text: "usbdevicestoredirect:s:" }
            - { id: usbclass, text: "usbdevicestoredirect:s:{53d29ef7-377c-4d14-864b-eb3a85769359}" }
            - { id: devclass, text: "devicestoredirect:s:{53d29ef7-377c-4d14-864b-eb3a85769359}" }
        - id: drv
          options:
            - { id: drvall, text: "drivestoredirect:s:*" }
            - { id: drvdyn, text: "drivestoredirect:s:DynamicDrives" }
            - { id: drvnone, text: "drivestoredirect:s:" }
            - { id: devdyn, text: "devicestoredirect:s:DynamicDevices" }
    answer:
      values: { cam: camstar, usb: usbclass, drv: drvdyn }
    explanation:
      correct:
        en: |
          `camerastoredirect:s:*` redirects the cameras with high-level redirection, so the webcam stays usable by local apps. Fingerprint readers use opaque low-level redirection, and a device setup class GUID in `usbdevicestoredirect` limits it to that class. `DynamicDrives` redirects only the drives connected after the session starts, whereas `*` would also redirect C:.
        fr: |
          `camerastoredirect:s:*` redirige les caméras par la redirection de haut niveau : la webcam reste donc utilisable par les applications locales. Les lecteurs d'empreintes digitales utilisent la redirection de bas niveau opaque, et un GUID de classe d'installation de périphérique dans `usbdevicestoredirect` la limite à cette classe. `DynamicDrives` ne redirige que les lecteurs connectés après le démarrage de la session, alors que `*` redirigerait aussi C:.
      options:
        usbstar: { en: "Redirecting the webcam opaquely would make it unavailable to local apps, and `*` would also redirect every other supported USB device.", fr: "Rediriger la webcam de façon opaque la rendrait indisponible pour les applications locales, et `*` redirigerait aussi tous les autres périphériques USB pris en charge." }
        devstar: { en: "`devicestoredirect` redirects MTP and PTP devices such as digital cameras and media players, not webcams.", fr: "`devicestoredirect` redirige les périphériques MTP et PTP comme les appareils photo numériques et les lecteurs multimédias, pas les webcams." }
        usball: { en: "`*` redirects every USB device that isn't handled by high-level redirection, not only the fingerprint readers.", fr: "`*` redirige tous les périphériques USB non pris en charge par la redirection de haut niveau, et pas seulement les lecteurs d'empreintes digitales." }
        devclass: { en: "Fingerprint readers aren't MTP or PTP devices; they need opaque low-level redirection through `usbdevicestoredirect`.", fr: "Les lecteurs d'empreintes digitales ne sont pas des périphériques MTP ou PTP ; ils exigent la redirection de bas niveau opaque par `usbdevicestoredirect`." }
        drvall: { en: "`*` redirects all drives, including those present at the start of the session such as C:.", fr: "`*` redirige tous les lecteurs, y compris ceux présents au démarrage de la session comme C:." }
    references:
      - title: Supported RDP properties - Azure Virtual Desktop
        url: https://learn.microsoft.com/en-us/azure/virtual-desktop/rdp-properties
      - title: Peripheral and resource redirection over the Remote Desktop Protocol - Azure Virtual Desktop
        url: https://learn.microsoft.com/en-us/azure/virtual-desktop/redirection-remote-desktop-protocol
