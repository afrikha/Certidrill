chapter: 15-session-host-images
questions:
  # ------------------------------------------------------------------ 1
  - id: az140-qz-15-01
    objective: "1.5.7"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        You store the custom images of your Azure Virtual Desktop session hosts in an Azure Compute Gallery.

        Which gallery resource sets the OS state (generalized or specialized) and the Hyper-V generation that apply to every image you publish under it?
      fr: |
        Vous stockez les images personnalisées de vos hôtes de session Azure Virtual Desktop dans une galerie Azure Compute Gallery.

        Quelle ressource de la galerie fixe l'état du système d'exploitation (généralisé ou spécialisé) et la génération Hyper-V qui s'appliquent à toutes les images que vous y publiez ?
    body:
      options:
        - { id: a, text: { en: "The gallery", fr: "La galerie" } }
        - { id: b, text: { en: "The image definition", fr: "La définition d'image" } }
        - { id: c, text: { en: "The image version", fr: "La version d'image" } }
        - { id: d, text: { en: "The regional replica", fr: "Le réplica régional" } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          An image definition groups the versions of one image and carries the properties they all share: OS type, OS state, Hyper-V generation and security type. These properties are fixed when the definition is created; each build is then published as a new image version under it.
        fr: |
          Une définition d'image regroupe les versions d'une même image et porte les propriétés qu'elles partagent toutes : type de système d'exploitation, état du système d'exploitation, génération Hyper-V et type de sécurité. Ces propriétés sont fixées à la création de la définition ; chaque build est ensuite publié comme nouvelle version d'image sous cette définition.
      options:
        a: { en: "The gallery is the container of definitions, can be shared with Azure RBAC and is a regional resource; it holds no OS or generation property.", fr: "La galerie est le conteneur des définitions, peut être partagée avec Azure RBAC et est une ressource régionale ; elle ne porte aucune propriété de système d'exploitation ni de génération." }
        c: { en: "An image version holds one build, its target regions and replicas; it inherits the OS state and generation of its definition.", fr: "Une version d'image contient un build, ses régions cibles et ses réplicas ; elle hérite de l'état du système d'exploitation et de la génération de sa définition." }
        d: { en: "A replica is a copy of an image version in a target region, used to deploy virtual machines there; it has no OS property of its own.", fr: "Un réplica est une copie d'une version d'image dans une région cible, utilisée pour y déployer des machines virtuelles ; il n'a aucune propriété de système d'exploitation propre." }
    references:
      - title: Overview of Azure Compute Gallery - Azure Virtual Machines
        url: https://learn.microsoft.com/en-us/azure/virtual-machines/azure-compute-gallery

  # ------------------------------------------------------------------ 2
  - id: az140-qz-15-02
    objective: "1.5.1"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        You are creating a golden image manually for an Azure Virtual Desktop host pool. You have installed all the applications of the host pool and the latest Windows updates on the build virtual machine, and you have taken a final snapshot of its OS disk.

        What should you do before you run Sysprep?
      fr: |
        Vous créez manuellement une image de référence pour un pool d'hôtes Azure Virtual Desktop. Vous avez installé sur la machine virtuelle de build toutes les applications du pool d'hôtes et les dernières mises à jour Windows, et vous avez pris un dernier instantané de son disque du système d'exploitation.

        Que devez-vous faire avant d'exécuter Sysprep ?
    body:
      options:
        - { id: a, text: { en: "Uninstall FSLogix, so that the session hosts install it at deployment.", fr: "Désinstaller FSLogix, pour que les hôtes de session l'installent au déploiement." } }
        - { id: b, text: { en: "Disable Remote Desktop, so that no user connects during the generalization.", fr: "Désactiver le Bureau à distance, pour qu'aucun utilisateur ne se connecte pendant la généralisation." } }
        - { id: c, text: { en: "Disable the antivirus programs, so that they don't interfere with Sysprep.", fr: "Désactiver les programmes antivirus, pour qu'ils ne perturbent pas Sysprep." } }
        - { id: d, text: { en: "Turn off Windows Defender Firewall, so that Sysprep can reach Azure.", fr: "Désactiver le Pare-feu Windows Defender, pour que Sysprep puisse joindre Azure." } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          Microsoft warns that an antivirus app in the image can cause issues when Sysprep runs, and recommends disabling all antivirus programs before you generalize. An antivirus app installed in the image stays in it, so the session hosts still get it.
        fr: |
          Microsoft signale qu'une application antivirus présente dans l'image peut poser des problèmes à l'exécution de Sysprep, et recommande de désactiver tous les programmes antivirus avant la généralisation. Une application antivirus installée dans l'image y reste : les hôtes de session la reçoivent toujours.
      options:
        a: { en: "FSLogix belongs in the image; removing it would only force you to install it on every session host.", fr: "FSLogix a sa place dans l'image ; le retirer obligerait seulement à l'installer sur chaque hôte de session." }
        b: { en: "Sysprep doesn't require Remote Desktop to be disabled, and nobody signs in to a build virtual machine that isn't a session host.", fr: "Sysprep n'exige pas de désactiver le Bureau à distance, et personne ne se connecte à une machine virtuelle de build qui n'est pas un hôte de session." }
        d: { en: "Sysprep runs locally and doesn't need to reach Azure; turning off the firewall isn't part of the preparation.", fr: "Sysprep s'exécute localement et n'a pas besoin de joindre Azure ; désactiver le pare-feu ne fait pas partie de la préparation." }
    references:
      - title: Create an Azure Virtual Desktop golden image - Azure Virtual Desktop
        url: https://learn.microsoft.com/en-us/azure/virtual-desktop/set-up-golden-image

  # ------------------------------------------------------------------ 3
  - id: az140-qz-15-03
    objective: "1.5.2"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        You have an Azure VM Image Builder image template named **tpl-eng** for Azure Virtual Desktop session hosts. The template doesn't set `buildTimeoutInMinutes`. Its customizers install engineering applications and Windows updates, and a test run on a separate virtual machine shows that they take about seven hours.

        Every build of tpl-eng fails with a timeout error. You need the build to complete.

        What should you do?
      fr: |
        Vous disposez d'un modèle d'image Azure VM Image Builder nommé **tpl-eng** pour des hôtes de session Azure Virtual Desktop. Le modèle ne définit pas `buildTimeoutInMinutes`. Ses personnalisations installent des applications d'ingénierie et des mises à jour Windows ; un essai sur une machine virtuelle distincte montre qu'elles prennent environ sept heures.

        Chaque build de tpl-eng échoue avec une erreur de délai d'expiration. Vous devez faire en sorte que le build se termine.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Set `buildTimeoutInMinutes` to 0.", fr: "Définir `buildTimeoutInMinutes` sur 0." } }
        - { id: b, text: { en: "Set `buildTimeoutInMinutes` to 540.", fr: "Définir `buildTimeoutInMinutes` sur 540." } }
        - { id: c, text: { en: "Set `buildTimeoutInMinutes` to 1440.", fr: "Définir `buildTimeoutInMinutes` sur 1440." } }
        - { id: d, text: { en: "Set `osDiskSizeGB` in `vmProfile` to 256.", fr: "Définir `osDiskSizeGB` dans `vmProfile` sur 256." } }
    answer: { optionId: b }
    shuffle: false
    explanation:
      correct:
        en: |
          Without `buildTimeoutInMinutes`, Image Builder uses the default of 240 minutes (four hours), which a seven-hour build exceeds. The maximum value is 960 minutes, so 540 minutes (nine hours) is valid and leaves a margin for the customizations, the generalization and the distribution.
        fr: |
          Sans `buildTimeoutInMinutes`, Image Builder applique la valeur par défaut de 240 minutes (quatre heures), qu'un build de sept heures dépasse. La valeur maximale est de 960 minutes : 540 minutes (neuf heures) est donc valide et laisse une marge pour les personnalisations, la généralisation et la distribution.
      options:
        a: { en: "A value of 0 doesn't remove the limit: Image Builder then applies the default of 240 minutes, as when the property is absent.", fr: "La valeur 0 ne supprime pas la limite : Image Builder applique alors la valeur par défaut de 240 minutes, comme quand la propriété est absente." }
        c: { en: "1440 minutes exceeds the maximum of 960 minutes (16 hours) that Image Builder accepts.", fr: "1440 minutes dépasse le maximum de 960 minutes (16 heures) qu'accepte Image Builder." }
        d: { en: "`osDiskSizeGB` only enlarges the OS disk of the build virtual machine; it doesn't change how long the build is allowed to run.", fr: "`osDiskSizeGB` agrandit seulement le disque du système d'exploitation de la machine virtuelle de build ; il ne change pas la durée autorisée du build." }
    references:
      - title: Create an Azure Image Builder Bicep file or ARM template JSON template - Azure Virtual Machines
        url: https://learn.microsoft.com/en-us/azure/virtual-machines/linux/image-builder-json

  # ------------------------------------------------------------------ 4
  - id: az140-qz-15-04
    objective: "1.5.5"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Litware builds the image of a pooled host pool with a custom image template in Azure Virtual Desktop. After a few weeks in production, inbox apps such as Calculator and Photos run in different versions on different session hosts, because the Microsoft Store installs newer versions after deployment.

        Inbox apps must change only when a new image version is deployed. You must use a built-in script in the next build.

        Which built-in script should you add to the customizations?
      fr: |
        Litware construit l'image d'un pool d'hôtes regroupés avec un modèle d'image personnalisée dans Azure Virtual Desktop. Après quelques semaines en production, des applications intégrées comme Calculatrice et Photos s'exécutent dans des versions différentes selon les hôtes de session, car le Microsoft Store installe des versions plus récentes après le déploiement.

        Les applications intégrées ne doivent changer que lorsqu'une nouvelle version d'image est déployée. Vous devez utiliser un script intégré dans le prochain build.

        Quel script intégré devez-vous ajouter aux personnalisations ?
    body:
      options:
        - { id: a, text: { en: "Apply Windows Updates", fr: "Appliquer les mises à jour Windows (Apply Windows Updates)" } }
        - { id: b, text: { en: "Disable Storage Sense", fr: "Désactiver l'Assistant Stockage (Disable Storage Sense)" } }
        - { id: c, text: { en: "Configure session timeouts", fr: "Configurer les délais d'expiration de session (Configure session timeouts)" } }
        - { id: d, text: { en: "Disable automatic updates for MSIX applications", fr: "Désactiver les mises à jour automatiques des applications MSIX (Disable automatic updates for MSIX applications)" } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          Inbox apps such as Calculator are MSIX packages. The built-in script that disables automatic updates of MSIX applications keeps them unchanged on the pooled session hosts. The apps are then refreshed only by the next image version, so every session host stays identical.
        fr: |
          Les applications intégrées comme Calculatrice sont des packages MSIX. Le script intégré qui désactive les mises à jour automatiques des applications MSIX les maintient inchangées sur les hôtes de session regroupés. Les applications ne sont alors actualisées que par la version d'image suivante : tous les hôtes de session restent identiques.
      options:
        a: { en: "Apply Windows Updates installs pending Windows updates during the build; it doesn't stop MSIX apps from updating after deployment.", fr: "Appliquer les mises à jour Windows installe les mises à jour Windows en attente pendant le build ; il n'empêche pas les applications MSIX de se mettre à jour après le déploiement." }
        b: { en: "Storage Sense frees disk space automatically; disabling it has no effect on app updates.", fr: "L'Assistant Stockage libère automatiquement de l'espace disque ; le désactiver n'a aucun effet sur les mises à jour des applications." }
        c: { en: "Session timeouts control when idle or disconnected sessions are ended, not how apps are updated.", fr: "Les délais d'expiration de session déterminent quand les sessions inactives ou déconnectées sont fermées, pas la façon dont les applications sont mises à jour." }
    references:
      - title: Custom image templates - Azure Virtual Desktop
        url: https://learn.microsoft.com/en-us/azure/virtual-desktop/custom-image-templates

  # ------------------------------------------------------------------ 5
  - id: az140-qz-15-05
    objective: "1.5.6"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        You have an Azure Virtual Desktop pooled host pool named **HP-Fin** that was created with a session host configuration. Its session hosts are created from an Azure Compute Gallery image built by Azure VM Image Builder. The image has a 127 GB OS disk.

        From now on, every session host of HP-Fin must have a 256 GB OS disk, including after future session host updates. The solution must not require any change on individual session hosts.

        What should you do?
      fr: |
        Vous disposez d'un pool d'hôtes regroupés Azure Virtual Desktop nommé **HP-Fin**, créé avec une configuration d'hôte de session. Ses hôtes de session sont créés à partir d'une image Azure Compute Gallery construite par Azure VM Image Builder. L'image a un disque du système d'exploitation de 127 Go.

        Désormais, chaque hôte de session de HP-Fin doit avoir un disque du système d'exploitation de 256 Go, y compris après les futures mises à jour des hôtes de session. La solution ne doit exiger aucune modification sur les hôtes de session individuels.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Schedule a session host update with the current image, and set the OS disk size to 256 GB in the update.", fr: "Planifier une mise à jour des hôtes de session avec l'image actuelle, et définir la taille du disque du système d'exploitation sur 256 Go dans la mise à jour." } }
        - { id: b, text: { en: "Set `osDiskSizeGB` to 256 in the template, build a new version, then schedule a session host update with it.", fr: "Définir `osDiskSizeGB` sur 256 dans le modèle, construire une nouvelle version, puis planifier une mise à jour des hôtes de session avec elle." } }
        - { id: c, text: { en: "Resize the OS disk of every session host to 256 GB, then extend the system volume inside Windows.", fr: "Redimensionner le disque du système d'exploitation de chaque hôte de session à 256 Go, puis étendre le volume système dans Windows." } }
        - { id: d, text: { en: "Set `osDiskSizeGB` to 0 in the template, build a new version, then schedule a session host update with it.", fr: "Définir `osDiskSizeGB` sur 0 dans le modèle, construire une nouvelle version, puis planifier une mise à jour des hôtes de session avec elle." } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          With a session host configuration, the OS disk size of the session hosts follows the image: a session host update can't change it and uses the size defined by the gallery image. Image Builder can enlarge the OS disk of the image with `osDiskSizeGB` in `vmProfile`, so a new version built with 256 GB gives every re-created session host a 256 GB disk.
        fr: |
          Avec une configuration d'hôte de session, la taille du disque du système d'exploitation des hôtes de session suit celle de l'image : une mise à jour des hôtes de session ne peut pas la modifier et utilise la taille définie par l'image de la galerie. Image Builder peut agrandir le disque du système d'exploitation de l'image avec `osDiskSizeGB` dans `vmProfile` : une nouvelle version construite avec 256 Go donne un disque de 256 Go à chaque hôte de session recréé.
      options:
        a: { en: "The OS disk size can't be changed during a session host update; the update keeps the size defined by the image.", fr: "La taille du disque du système d'exploitation ne peut pas être modifiée pendant une mise à jour des hôtes de session ; la mise à jour conserve la taille définie par l'image." }
        c: { en: "This is a change on each session host, and the next session host update re-creates the virtual machines with the image's 127 GB disk.", fr: "C'est une modification sur chaque hôte de session, et la prochaine mise à jour des hôtes de session recrée les machines virtuelles avec le disque de 127 Go de l'image." }
        d: { en: "A value of 0 keeps the size of the source image, so the new version still has a 127 GB OS disk.", fr: "La valeur 0 conserve la taille de l'image source : la nouvelle version a toujours un disque du système d'exploitation de 127 Go." }
    references:
      - title: Session host update - Azure Virtual Desktop
        url: https://learn.microsoft.com/en-us/azure/virtual-desktop/session-host-update
      - title: Create an Azure Image Builder Bicep file or ARM template JSON template - Azure Virtual Machines
        url: https://learn.microsoft.com/en-us/azure/virtual-machines/linux/image-builder-json

  # ------------------------------------------------------------------ 6
  - id: az140-qz-15-06
    objective: "1.5.4"
    difficulty: 3
    status: draft
    type: dragdrop
    stem:
      en: |
        Fabrikam stores its Azure Virtual Desktop images in an Azure Compute Gallery named **galFab**. The image definition **win11-multi** has the Hyper-V generation **V1**. All the production host pools deploy their session hosts from win11-multi without a version number, so they use the latest version. The current version is **2.4.0**.

        Fabrikam follows these lifecycle rules:

        - Production host pools must only receive images built for them.
        - Image versions are never modified after they're built, except for their publishing settings.

        You need to plan how to handle the changes listed in the answer area.

        What should you do for each change? To answer, drag the appropriate actions to the correct changes. Each action may be used once, more than once, or not at all.

        NOTE: Each correct selection is worth one point.
      fr: |
        Fabrikam stocke ses images Azure Virtual Desktop dans une galerie Azure Compute Gallery nommée **galFab**. La définition d'image **win11-multi** a la génération Hyper-V **V1**. Tous les pools d'hôtes de production déploient leurs hôtes de session à partir de win11-multi sans numéro de version : ils utilisent donc la dernière version. La version actuelle est **2.4.0**.

        Fabrikam applique les règles de cycle de vie suivantes :

        - Les pools d'hôtes de production ne doivent recevoir que les images construites pour eux.
        - Les versions d'image ne sont jamais modifiées après leur build, à l'exception de leurs paramètres de publication.

        Vous devez planifier le traitement des changements listés dans la zone de réponse.

        Que devez-vous faire pour chaque changement ? Pour répondre, faites glisser les actions appropriées vers les changements correspondants. Chaque action peut être utilisée une fois, plusieurs fois ou pas du tout.

        Remarque : chaque sélection correcte vaut un point.
    body:
      reuse: true
      items:
        - { id: newver, text: { en: "Publish a new image version of win11-multi", fr: "Publier une nouvelle version d'image de win11-multi" } }
        - { id: newdef, text: { en: "Create a new image definition", fr: "Créer une nouvelle définition d'image" } }
        - { id: update, text: { en: "Update the settings of version 2.4.0", fr: "Mettre à jour les paramètres de la version 2.4.0" } }
        - { id: managed, text: { en: "Create a managed image", fr: "Créer une image managée" } }
      targets:
        - { id: t1, text: { en: "Include this month's Windows cumulative update for the production host pools.", fr: "Inclure la mise à jour cumulative Windows de ce mois pour les pools d'hôtes de production." } }
        - { id: t2, text: { en: "Provide an image with CAD applications for a new engineering host pool only.", fr: "Fournir une image avec des applications de CAO pour un nouveau pool d'hôtes d'ingénierie uniquement." } }
        - { id: t3, text: { en: "Deploy future session hosts as Trusted launch virtual machines.", fr: "Déployer les futurs hôtes de session comme machines virtuelles Trusted launch." } }
        - { id: t4, text: { en: "Deploy session hosts in a new region from the current build.", fr: "Déployer des hôtes de session dans une nouvelle région à partir du build actuel." } }
    answer:
      mapping: { t1: newver, t2: newdef, t3: newdef, t4: update }
    explanation:
      correct:
        en: |
          The monthly update is a new build of the same image, so it's a new version of win11-multi that the production host pools pick up as latest. The CAD image serves another purpose: as a version of win11-multi it would become latest for every production host pool, so it needs its own definition. Trusted launch requires a generation 2 definition, and the generation of an existing definition can't be changed, so a new V2 definition is needed. Adding a target region is a publishing setting of the existing version 2.4.0.
        fr: |
          La mise à jour mensuelle est un nouveau build de la même image : c'est une nouvelle version de win11-multi que les pools d'hôtes de production prennent comme dernière version. L'image de CAO sert un autre usage : en tant que version de win11-multi, elle deviendrait la dernière version pour tous les pools d'hôtes de production ; elle exige donc sa propre définition. Trusted launch exige une définition de génération 2, et la génération d'une définition existante ne peut pas être modifiée : il faut une nouvelle définition V2. Ajouter une région cible est un paramètre de publication de la version 2.4.0 existante.
      options:
        managed: { en: "A managed image has no versions, no replication and no Trusted launch support: it fits none of the changes and is the legacy option.", fr: "Une image managée n'a ni versions, ni réplication, ni prise en charge de Trusted launch : elle ne convient à aucun changement et c'est l'option héritée." }
        update: { en: "Updating 2.4.0 can't add an update or applications to the image content, and it can't change the generation.", fr: "Mettre à jour 2.4.0 ne peut ni ajouter une mise à jour ou des applications au contenu de l'image, ni changer la génération." }
    references:
      - title: Overview of Azure Compute Gallery - Azure Virtual Machines
        url: https://learn.microsoft.com/en-us/azure/virtual-machines/azure-compute-gallery
      - title: Create an image definition and image version - Azure Virtual Machines
        url: https://learn.microsoft.com/en-us/azure/virtual-machines/image-version

  # ------------------------------------------------------------------ 7
  - id: az140-qz-15-07
    objective: "1.5.2"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        Woodgrove plans a custom image template in Azure Virtual Desktop. The template will use a user-assigned managed identity named **id-images**, which has a custom role with the gallery and image actions on the resource group **rg-images**.

        The template must run a custom script named **install-apps.ps1**. The script is stored in a blob container of a storage account named **stwgbuild**, whose anonymous access is disabled and must stay disabled. The script copies installers from a file server that is reachable only from a subnet named **snet-build** of a virtual network named **vnet-shared**, in a resource group named **rg-network**. snet-build already has the network settings that Azure VM Image Builder requires.

        Which three actions should you perform? Each correct answer presents part of the solution.

        NOTE: Each correct selection is worth one point.
      fr: |
        Woodgrove prévoit un modèle d'image personnalisée dans Azure Virtual Desktop. Le modèle utilisera une identité managée affectée par l'utilisateur nommée **id-images**, qui dispose d'un rôle personnalisé avec les actions sur la galerie et les images sur le groupe de ressources **rg-images**.

        Le modèle doit exécuter un script personnalisé nommé **install-apps.ps1**. Le script est stocké dans un conteneur d'objets blob d'un compte de stockage nommé **stwgbuild**, dont l'accès anonyme est désactivé et doit le rester. Le script copie des programmes d'installation depuis un serveur de fichiers joignable uniquement depuis un sous-réseau nommé **snet-build** d'un réseau virtuel nommé **vnet-shared**, dans un groupe de ressources nommé **rg-network**. snet-build dispose déjà des paramètres réseau qu'exige Azure VM Image Builder.

        Quelles sont les trois actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 3
      options:
        - { id: a, text: { en: "Assign the Storage Blob Data Reader role on stwgbuild to id-images.", fr: "Attribuer le rôle Storage Blob Data Reader sur stwgbuild à id-images." } }
        - { id: b, text: { en: "Enable a system-assigned managed identity on the custom image template.", fr: "Activer une identité managée affectée par le système sur le modèle d'image personnalisée." } }
        - { id: c, text: { en: "Grant id-images access to vnet-shared or to rg-network.", fr: "Accorder à id-images l'accès à vnet-shared ou à rg-network." } }
        - { id: d, text: { en: "Deploy Azure Bastion in vnet-shared so that the build VM can reach the file server.", fr: "Déployer Azure Bastion dans vnet-shared pour que la machine virtuelle de build puisse joindre le serveur de fichiers." } }
        - { id: e, text: { en: "Select vnet-shared and snet-build in the build properties of the template.", fr: "Sélectionner vnet-shared et snet-build dans les propriétés de build du modèle." } }
        - { id: f, text: { en: "Assign the Storage Account Contributor role on stwgbuild to id-images.", fr: "Attribuer le rôle Storage Account Contributor sur stwgbuild à id-images." } }
    answer: { optionIds: [a, c, e] }
    explanation:
      correct:
        en: |
          A custom script must be reachable by URI; in a storage account without anonymous access, the managed identity of the template needs a data role such as Storage Blob Data Reader. Without a virtual network, the build VM gets a temporary network that can't reach the file server, so you select vnet-shared and snet-build in the build properties. With an existing virtual network, the managed identity also needs access to the virtual network or to its resource group.
        fr: |
          Un script personnalisé doit être accessible par URI ; dans un compte de stockage sans accès anonyme, l'identité managée du modèle a besoin d'un rôle de données comme Storage Blob Data Reader. Sans réseau virtuel, la machine virtuelle de build reçoit un réseau temporaire qui ne peut pas joindre le serveur de fichiers : vous sélectionnez donc vnet-shared et snet-build dans les propriétés de build. Avec un réseau virtuel existant, l'identité managée doit aussi avoir accès au réseau virtuel ou à son groupe de ressources.
      options:
        b: { en: "Image Builder and custom image templates use a user-assigned managed identity; a system-assigned identity isn't used for the build.", fr: "Image Builder et les modèles d'images personnalisées utilisent une identité managée affectée par l'utilisateur ; une identité affectée par le système n'est pas utilisée pour le build." }
        d: { en: "Azure Bastion gives administrators RDP or SSH access to virtual machines; it doesn't route the build VM's traffic to the file server.", fr: "Azure Bastion donne aux administrateurs un accès RDP ou SSH aux machines virtuelles ; il n'achemine pas le trafic de la machine virtuelle de build vers le serveur de fichiers." }
        f: { en: "Storage Account Contributor manages the account through the control plane; it isn't the data role that lets the identity read the blob, and it grants far more than needed.", fr: "Storage Account Contributor gère le compte par le plan de contrôle ; ce n'est pas le rôle de données qui permet à l'identité de lire l'objet blob, et il accorde bien plus que nécessaire." }
    references:
      - title: Use custom image templates to create custom images - Azure Virtual Desktop
        url: https://learn.microsoft.com/en-us/azure/virtual-desktop/create-custom-image-templates

  # ------------------------------------------------------------------ 8
  - id: az140-qz-15-08
    objective: "1.5.6"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Tailspin has two Azure subscriptions in the same Microsoft Entra tenant:

        | Subscription | Contains |
        | --- | --- |
        | Sub-Images | An Azure Compute Gallery named **galShared**, in West Europe, filled every month by an Azure VM Image Builder template |
        | Sub-AVD | A pooled host pool named **HP-Ops**, in West Europe, created with a session host configuration |

        The session hosts of HP-Ops are created from a Marketplace image. Tailspin wants HP-Ops to move to the monthly image and to receive each new image by scheduling a session host update.

        What should you do?
      fr: |
        Tailspin dispose de deux abonnements Azure dans le même locataire Microsoft Entra :

        | Abonnement | Contient |
        | --- | --- |
        | Sub-Images | Une galerie Azure Compute Gallery nommée **galShared**, en West Europe, alimentée chaque mois par un modèle Azure VM Image Builder |
        | Sub-AVD | Un pool d'hôtes regroupés nommé **HP-Ops**, en West Europe, créé avec une configuration d'hôte de session |

        Les hôtes de session de HP-Ops sont créés à partir d'une image de la Place de marché. Tailspin veut faire passer HP-Ops à l'image mensuelle et lui appliquer chaque nouvelle image en planifiant une mise à jour des hôtes de session.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Assign the Reader role on galShared to the administrators of HP-Ops, then select the galShared image in the session host configuration.", fr: "Attribuer le rôle Reader sur galShared aux administrateurs de HP-Ops, puis sélectionner l'image de galShared dans la configuration d'hôte de session." } }
        - { id: b, text: { en: "Add West Europe as a target region of each galShared version, then select the galShared image in the session host configuration.", fr: "Ajouter West Europe comme région cible de chaque version de galShared, puis sélectionner l'image de galShared dans la configuration d'hôte de session." } }
        - { id: c, text: { en: "Remove the session host configuration from HP-Ops, then add session hosts to HP-Ops from the galShared image every month.", fr: "Supprimer la configuration d'hôte de session de HP-Ops, puis ajouter chaque mois des hôtes de session à HP-Ops à partir de l'image de galShared." } }
        - { id: d, text: { en: "Publish each monthly image to a gallery in Sub-AVD as well, then select that image in the session host configuration.", fr: "Publier aussi chaque image mensuelle dans une galerie de Sub-AVD, puis sélectionner cette image dans la configuration d'hôte de session." } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          Session host configurations don't support an Azure Compute Gallery image located in a different subscription from the host pool. Publishing the monthly image to a gallery in Sub-AVD, for example with a second distribution target in the Image Builder template, gives HP-Ops an image in its own subscription that session host update can use.
        fr: |
          Les configurations d'hôte de session ne prennent pas en charge une image Azure Compute Gallery située dans un autre abonnement que le pool d'hôtes. Publier l'image mensuelle dans une galerie de Sub-AVD, par exemple avec une seconde cible de distribution dans le modèle Image Builder, donne à HP-Ops une image dans son propre abonnement, utilisable par la mise à jour des hôtes de session.
      options:
        a: { en: "Read access lets administrators see the image, but the gallery stays in Sub-Images, which the session host configuration doesn't support.", fr: "Un accès en lecture permet aux administrateurs de voir l'image, mais la galerie reste dans Sub-Images, ce que la configuration d'hôte de session ne prend pas en charge." }
        b: { en: "Target regions replicate a version to regions, not to subscriptions; galShared is already in West Europe and still in another subscription.", fr: "Les régions cibles répliquent une version vers des régions, pas vers des abonnements ; galShared est déjà en West Europe et reste dans un autre abonnement." }
        c: { en: "The management approach is set when the host pool is created and can't be changed; and without a session host configuration there is no session host update.", fr: "Le mode de gestion est défini à la création du pool d'hôtes et ne peut pas être modifié ; et sans configuration d'hôte de session, il n'y a pas de mise à jour des hôtes de session." }
    references:
      - title: Session host update - Azure Virtual Desktop
        url: https://learn.microsoft.com/en-us/azure/virtual-desktop/session-host-update
      - title: Host pool management approaches - Azure Virtual Desktop
        url: https://learn.microsoft.com/en-us/azure/virtual-desktop/host-pool-management-approaches

  # ------------------------------------------------------------------ 9
  - id: az140-qz-15-09
    objective: "1.5.3"
    difficulty: 3
    status: draft
    type: dropdown
    stem:
      en: |
        You modify the Azure VM Image Builder template that builds the image of an Azure Virtual Desktop host pool for Proseware engineers. The next image version must also contain a CAD application:

        - The script **install-cad.ps1** installs the application and creates the folder `C:\Program Files\Proseware\CAD`. The build must fail if the script file was altered after you published it.
        - The installer returns exit code 3010 when it succeeds and needs a restart. This code must not fail the build.
        - A 40 KB configuration file, **cad.json**, must be copied to the application folder without writing any code.

        How should you complete the `customize` section? Select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Vous modifiez le modèle Azure VM Image Builder qui construit l'image d'un pool d'hôtes Azure Virtual Desktop pour les ingénieurs de Proseware. La prochaine version d'image doit aussi contenir une application de CAO :

        - Le script **install-cad.ps1** installe l'application et crée le dossier `C:\Program Files\Proseware\CAD`. Le build doit échouer si le fichier de script a été modifié après sa publication.
        - Le programme d'installation renvoie le code de sortie 3010 quand il réussit et demande un redémarrage. Ce code ne doit pas faire échouer le build.
        - Un fichier de configuration de 40 Ko, **cad.json**, doit être copié dans le dossier de l'application sans écrire de code.

        Comment devez-vous compléter la section `customize` ? Sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: code
      language: json
      template:
        en: |
          "customize": [
            {
              "type": "PowerShell",
              "name": "installCad",
              "scriptUri": "https://stprosebuild.blob.core.windows.net/build/install-cad.ps1",
              "runElevated": true,
              "[[hash]]": "<SHA256 of install-cad.ps1>",
              "[[codes]]": [ 0, 3010 ]
            },
            { "type": "WindowsRestart", "restartTimeout": "10m" },
            {
              "type": "[[copy]]",
              "name": "cadConfig",
              "sourceUri": "https://stprosebuild.blob.core.windows.net/build/cad.json",
              "destination": "C:\\Program Files\\Proseware\\CAD\\cad.json"
            }
          ]
        fr: |
          "customize": [
            {
              "type": "PowerShell",
              "name": "installCad",
              "scriptUri": "https://stprosebuild.blob.core.windows.net/build/install-cad.ps1",
              "runElevated": true,
              "[[hash]]": "<SHA256 of install-cad.ps1>",
              "[[codes]]": [ 0, 3010 ]
            },
            { "type": "WindowsRestart", "restartTimeout": "10m" },
            {
              "type": "[[copy]]",
              "name": "cadConfig",
              "sourceUri": "https://stprosebuild.blob.core.windows.net/build/cad.json",
              "destination": "C:\\Program Files\\Proseware\\CAD\\cad.json"
            }
          ]
      slots:
        - id: hash
          options:
            - { id: sha, text: "sha256Checksum" }
            - { id: elev, text: "runAsSystem" }
            - { id: valid, text: "validExitCodes" }
        - id: codes
          options:
            - { id: sha, text: "sha256Checksum" }
            - { id: elev, text: "runAsSystem" }
            - { id: valid, text: "validExitCodes" }
        - id: copy
          options:
            - { id: file, text: "File" }
            - { id: ps, text: "PowerShell" }
            - { id: wu, text: "WindowsUpdate" }
    answer:
      values: { hash: sha, codes: valid, copy: file }
    explanation:
      correct:
        en: |
          `sha256Checksum` makes Image Builder compare the script with the checksum you computed, so an altered file fails the build. `validExitCodes` lists the codes that the script can return without being reported as a failure, here 0 and 3010; the next WindowsRestart customizer completes the pending restart. The `File` customizer downloads one small file (under 20 MB) to an existing path without code, and the folder exists because the installer created it earlier.
        fr: |
          `sha256Checksum` fait comparer par Image Builder le script à la somme de contrôle que vous avez calculée : un fichier modifié fait échouer le build. `validExitCodes` liste les codes que le script peut renvoyer sans être signalé en échec, ici 0 et 3010 ; le personnalisateur WindowsRestart suivant effectue le redémarrage en attente. Le personnalisateur `File` télécharge un petit fichier (moins de 20 Mo) vers un chemin existant sans code, et le dossier existe car le programme d'installation l'a créé auparavant.
      options:
        elev: { en: "`runAsSystem` runs the script as the System user; it neither checks the file's integrity nor accepts extra exit codes.", fr: "`runAsSystem` exécute le script avec le compte System ; il ne vérifie pas l'intégrité du fichier et n'accepte pas de codes de sortie supplémentaires." }
        ps: { en: "A PowerShell customizer would need code to download and copy the file, which the requirement excludes.", fr: "Un personnalisateur PowerShell exigerait du code pour télécharger et copier le fichier, ce que l'exigence exclut." }
        wu: { en: "The WindowsUpdate customizer installs Windows updates; it doesn't copy files.", fr: "Le personnalisateur WindowsUpdate installe des mises à jour Windows ; il ne copie pas de fichiers." }
    references:
      - title: Create an Azure Image Builder Bicep file or ARM template JSON template - Azure Virtual Machines
        url: https://learn.microsoft.com/en-us/azure/virtual-machines/linux/image-builder-json

  # ------------------------------------------------------------------ 10
  - id: az140-qz-15-10
    objective: "1.5.7"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        Adatum has an Azure Compute Gallery named **galAvd** in West Europe. An Azure VM Image Builder template publishes a new image version to galAvd every month, and the session hosts of a host pool in West Europe are deployed from it.

        Adatum creates a disaster recovery host pool named **HP-DR** in North Europe. The solution must meet the following requirements:

        - If West Europe becomes unavailable, administrators must be able to deploy 60 session hosts at the same time in HP-DR from the current image, and publish new image versions for HP-DR during the outage.
        - The number of replicas must follow Microsoft's recommendation.
        - Costs must be minimized.

        Which two actions should you perform? Each correct answer presents part of the solution.

        NOTE: Each correct selection is worth one point.
      fr: |
        Adatum dispose d'une galerie Azure Compute Gallery nommée **galAvd** en West Europe. Un modèle Azure VM Image Builder publie chaque mois une nouvelle version d'image dans galAvd, et les hôtes de session d'un pool d'hôtes en West Europe sont déployés à partir d'elle.

        Adatum crée un pool d'hôtes de reprise d'activité nommé **HP-DR** en North Europe. La solution doit répondre aux exigences suivantes :

        - Si West Europe devient indisponible, les administrateurs doivent pouvoir déployer 60 hôtes de session en même temps dans HP-DR à partir de l'image actuelle, et publier de nouvelles versions d'image pour HP-DR pendant la panne.
        - Le nombre de réplicas doit suivre la recommandation de Microsoft.
        - Les coûts doivent être réduits au minimum.

        Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "Add North Europe as a target region of each galAvd version, and use it for HP-DR.", fr: "Ajouter North Europe comme région cible de chaque version de galAvd, et l'utiliser pour HP-DR." } }
        - { id: b, text: { en: "Create a gallery in North Europe, and have the template publish each version to it too.", fr: "Créer une galerie en North Europe, et faire publier aussi chaque version dans celle-ci par le modèle." } }
        - { id: c, text: { en: "Keep three replicas in North Europe of each version that HP-DR uses.", fr: "Conserver trois réplicas en North Europe de chaque version qu'utilise HP-DR." } }
        - { id: d, text: { en: "Keep twelve replicas in North Europe of each version that HP-DR uses.", fr: "Conserver douze réplicas en North Europe de chaque version qu'utilise HP-DR." } }
        - { id: e, text: { en: "Use Premium_LRS storage for the North Europe replicas of each version.", fr: "Utiliser le stockage Premium_LRS pour les réplicas North Europe de chaque version." } }
        - { id: f, text: { en: "Apply a CanNotDelete lock to galAvd and to its image definitions.", fr: "Appliquer un verrou CanNotDelete à galAvd et à ses définitions d'image." } }
    answer: { optionIds: [b, c] }
    explanation:
      correct:
        en: |
          Azure Compute Gallery isn't a global resource: if the region of a gallery goes down, you can still deploy from its replicas in other regions, but you can't create or update its resources, so new versions can't be published to galAvd. A second gallery in North Europe, fed by the same template, meets both needs. Microsoft recommends one replica per 20 virtual machines created at the same time, and at least three for production: 60 simultaneous deployments need three replicas.
        fr: |
          Azure Compute Gallery n'est pas une ressource globale : si la région d'une galerie tombe, vous pouvez encore déployer à partir de ses réplicas dans d'autres régions, mais vous ne pouvez ni créer ni mettre à jour ses ressources ; de nouvelles versions ne peuvent donc pas être publiées dans galAvd. Une seconde galerie en North Europe, alimentée par le même modèle, répond aux deux besoins. Microsoft recommande un réplica pour 20 machines virtuelles créées en même temps, et au moins trois en production : 60 déploiements simultanés exigent trois réplicas.
      options:
        a: { en: "Replicas of galAvd versions in North Europe allow deployments during the outage, but no new version can be published to galAvd while West Europe is down; with the second gallery they only add cost.", fr: "Des réplicas des versions de galAvd en North Europe permettent de déployer pendant la panne, mais aucune nouvelle version ne peut être publiée dans galAvd tant que West Europe est en panne ; avec la seconde galerie, ils ne font qu'ajouter du coût." }
        d: { en: "Twelve replicas would suit 240 simultaneous deployments; for 60 they add storage cost beyond the recommendation.", fr: "Douze réplicas conviendraient à 240 déploiements simultanés ; pour 60, ils ajoutent un coût de stockage au-delà de la recommandation." }
        e: { en: "No requirement calls for premium storage of the replicas; Premium_LRS only increases the cost.", fr: "Aucune exigence n'impose un stockage premium pour les réplicas ; Premium_LRS ne fait qu'augmenter le coût." }
        f: { en: "A lock prevents accidental deletion, but it doesn't make the gallery usable when its region is down.", fr: "Un verrou empêche une suppression accidentelle, mais il ne rend pas la galerie utilisable quand sa région est en panne." }
    references:
      - title: Overview of Azure Compute Gallery - Azure Virtual Machines
        url: https://learn.microsoft.com/en-us/azure/virtual-machines/azure-compute-gallery
