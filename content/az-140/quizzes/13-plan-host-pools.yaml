chapter: 13-plan-host-pools
questions:
  # ------------------------------------------------------------------ 1
  - id: az140-qz-13-01
    objective: "1.3.2"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Contoso, Ltd. plans an Azure Virtual Desktop pooled host pool for 250 office workers who are licensed with Microsoft 365 E3. Several users will share each session host, and every user needs Microsoft 365 Apps for enterprise.

        You need to choose the source image of the session hosts. The solution must minimize the effort required to prepare the image.

        What should you use?
      fr: |
        Contoso, Ltd. prévoit un pool d'hôtes Azure Virtual Desktop regroupé pour 250 employés de bureau licenciés avec Microsoft 365 E3. Plusieurs utilisateurs partageront chaque hôte de session, et chaque utilisateur a besoin de Microsoft 365 Apps for enterprise.

        Vous devez choisir l'image source des hôtes de session. La solution doit réduire au minimum l'effort de préparation de l'image.

        Que devez-vous utiliser ?
    body:
      options:
        - { id: a, text: { en: "A Windows 11 Enterprise image from Azure Marketplace, then Microsoft 365 Apps installed on each session host", fr: "Une image Windows 11 Entreprise de la Place de marché Azure, puis Microsoft 365 Apps installé sur chaque hôte de session" } }
        - { id: b, text: { en: "A Windows Server 2025 Datacenter image from Azure Marketplace, then Microsoft 365 Apps installed with shared computer activation", fr: "Une image Windows Server 2025 Datacenter de la Place de marché Azure, puis Microsoft 365 Apps installé avec l'activation d'ordinateurs partagés" } }
        - { id: c, text: { en: "A Windows 11 Enterprise multi-session image from Azure Marketplace that already includes Microsoft 365 Apps", fr: "Une image Windows 11 Entreprise multisession de la Place de marché Azure qui inclut déjà Microsoft 365 Apps" } }
        - { id: d, text: { en: "A Windows 11 Enterprise multi-session image from Azure Marketplace, then Microsoft 365 Apps installed with the Office Deployment Tool", fr: "Une image Windows 11 Entreprise multisession de la Place de marché Azure, puis Microsoft 365 Apps installé avec l'outil de déploiement d'Office" } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          Windows 11 Enterprise multi-session accepts several concurrent sessions and is covered by the users' Microsoft 365 E3 licenses. Microsoft publishes Windows Enterprise multi-session images with Microsoft 365 Apps preinstalled, selectable when you deploy a host pool, so there is nothing to install or configure in the image.
        fr: |
          Windows 11 Entreprise multisession accepte plusieurs sessions simultanées et il est couvert par les licences Microsoft 365 E3 des utilisateurs. Microsoft publie des images Windows Entreprise multisession avec Microsoft 365 Apps préinstallé, sélectionnables au déploiement d'un pool d'hôtes : il n'y a donc rien à installer ni à configurer dans l'image.
      options:
        a: { en: "Windows 11 Enterprise accepts one session per VM, so several users can't share a session host.", fr: "Windows 11 Entreprise n'accepte qu'une session par machine virtuelle : plusieurs utilisateurs ne peuvent pas partager un hôte de session." }
        b: { en: "Windows Server session hosts need RDS CALs, which Microsoft 365 E3 doesn't include, and the installation adds image preparation work.", fr: "Les hôtes de session Windows Server exigent des CAL RDS, que Microsoft 365 E3 n'inclut pas, et l'installation ajoute du travail de préparation de l'image." }
        d: { en: "The operating system fits, but installing Microsoft 365 Apps yourself is extra work that the preinstalled image avoids.", fr: "Le système d'exploitation convient, mais installer vous-même Microsoft 365 Apps représente un travail que l'image préinstallée évite." }
    references:
      - title: Install Office on a custom VHD image
        url: https://learn.microsoft.com/en-us/azure/virtual-desktop/install-office-on-wvd-master-image
      - title: Prerequisites for Azure Virtual Desktop
        url: https://learn.microsoft.com/en-us/azure/virtual-desktop/prerequisites

  # ------------------------------------------------------------------ 2
  - id: az140-qz-13-02
    objective: "1.3.1"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Fabrikam, Inc. plans to give 650 employees access to the desktop application group of an Azure Virtual Desktop host pool named **HP-Office**. A draft script assigns the Desktop Virtualization User role to each employee individually on the application group.

        You need to recommend a way to grant the access that stays within the Azure Virtual Desktop service limits.

        What should you recommend?
      fr: |
        Fabrikam, Inc. prévoit de donner à 650 employés l'accès au groupe d'applications de bureau d'un pool d'hôtes Azure Virtual Desktop nommé **HP-Office**. Un script provisoire attribue le rôle Desktop Virtualization User à chaque employé individuellement sur le groupe d'applications.

        Vous devez recommander une façon d'accorder l'accès qui respecte les limites du service Azure Virtual Desktop.

        Que devez-vous recommander ?
    body:
      options:
        - { id: a, text: { en: "Split the employees between two desktop application groups of HP-Office", fr: "Répartir les employés entre deux groupes d'applications de bureau de HP-Office" } }
        - { id: b, text: { en: "Assign the role once to a Microsoft Entra group that contains the employees", fr: "Attribuer le rôle une seule fois à un groupe Microsoft Entra qui contient les employés" } }
        - { id: c, text: { en: "Assign the role to each employee on the workspace instead of the application group", fr: "Attribuer le rôle à chaque employé sur l'espace de travail plutôt que sur le groupe d'applications" } }
        - { id: d, text: { en: "Assign the role to half of the employees on HP-Office and to the others on the application group", fr: "Attribuer le rôle à la moitié des employés sur HP-Office et aux autres sur le groupe d'applications" } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          Azure Virtual Desktop allows at most 200 role assignments per object, so 650 individual assignments on one application group exceed the limit. A single assignment to a Microsoft Entra group counts once, whatever the number of members, and membership changes then need no new role assignment.
        fr: |
          Azure Virtual Desktop autorise au plus 200 attributions de rôles par objet : 650 attributions individuelles sur un même groupe d'applications dépassent la limite. Une seule attribution à un groupe Microsoft Entra compte pour une, quel que soit le nombre de membres, et les changements d'appartenance n'exigent ensuite aucune nouvelle attribution de rôle.
      options:
        a: { en: "A host pool has only one desktop application group, so a second one can't be created.", fr: "Un pool d'hôtes n'a qu'un seul groupe d'applications de bureau : un second ne peut pas être créé." }
        c: { en: "Users get the desktop through an assignment on the application group; an assignment on the workspace gives no access, and 650 assignments still exceed the limit.", fr: "Les utilisateurs obtiennent le bureau par une attribution sur le groupe d'applications ; une attribution sur l'espace de travail ne donne aucun accès, et 650 attributions dépassent toujours la limite." }
        d: { en: "An assignment on the host pool gives no access to a desktop, and each half still exceeds 200 assignments.", fr: "Une attribution sur le pool d'hôtes ne donne accès à aucun bureau, et chaque moitié dépasse toujours 200 attributions." }
    references:
      - title: Azure subscription and service limits, quotas, and constraints
        url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/management/azure-subscription-service-limits
      - title: Built-in Azure RBAC roles for Azure Virtual Desktop
        url: https://learn.microsoft.com/en-us/azure/virtual-desktop/rbac

  # ------------------------------------------------------------------ 3
  - id: az140-qz-13-03
    objective: "1.3.5"
    difficulty: 2
    status: draft
    type: single
    shuffle: false
    stem:
      en: |
        Litware, Inc. plans an Azure Virtual Desktop personal host pool for 80 software testers. Each tester gets a dedicated session host that runs Windows 11 Enterprise. The testers run a medium workload.

        You need to recommend the smallest VM size that meets Microsoft's sizing guidelines for single-session session hosts.

        Which size should you recommend?
      fr: |
        Litware, Inc. prévoit un pool d'hôtes Azure Virtual Desktop personnel pour 80 testeurs logiciels. Chaque testeur reçoit un hôte de session dédié qui exécute Windows 11 Entreprise. Les testeurs exécutent une charge de travail moyenne.

        Vous devez recommander la plus petite taille de machine virtuelle qui respecte les recommandations de dimensionnement de Microsoft pour les hôtes de session mono-session.

        Quelle taille devez-vous recommander ?
    body:
      options:
        - { id: a, text: { en: "D2s_v5 (2 vCPUs, 8 GB of RAM)", fr: "D2s_v5 (2 vCPU, 8 Go de RAM)" } }
        - { id: b, text: { en: "D4s_v5 (4 vCPUs, 16 GB of RAM)", fr: "D4s_v5 (4 vCPU, 16 Go de RAM)" } }
        - { id: c, text: { en: "D8s_v5 (8 vCPUs, 32 GB of RAM)", fr: "D8s_v5 (8 vCPU, 32 Go de RAM)" } }
        - { id: d, text: { en: "D16s_v5 (16 vCPUs, 64 GB of RAM)", fr: "D16s_v5 (16 vCPU, 64 Go de RAM)" } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          For single-session hosts, Microsoft's guidelines start at 2 vCPUs and 8 GB for a light workload, 4 vCPUs and 16 GB for a medium workload, and 8 vCPUs and 32 GB for a heavy workload. A medium workload therefore calls for at least a D4s_v5.
        fr: |
          Pour les hôtes mono-session, les recommandations de Microsoft partent de 2 vCPU et 8 Go pour une charge légère, de 4 vCPU et 16 Go pour une charge moyenne et de 8 vCPU et 32 Go pour une charge lourde. Une charge moyenne exige donc au moins un D4s_v5.
      options:
        a: { en: "2 vCPUs and 8 GB is the baseline for a light single-session workload, below the medium baseline.", fr: "2 vCPU et 8 Go est la base d'une charge mono-session légère, en dessous de la base moyenne." }
        c: { en: "8 vCPUs and 32 GB is the baseline for a heavy workload: larger, and more expensive, than needed.", fr: "8 vCPU et 32 Go est la base d'une charge lourde : plus grand, et plus cher, que nécessaire." }
        d: { en: "16 vCPUs suits a multi-session host shared by many users, not one tester with a medium workload.", fr: "16 vCPU convient à un hôte multisession partagé par de nombreux utilisateurs, pas à un testeur avec une charge moyenne." }
    references:
      - title: Session host virtual machine sizing guidelines for Azure Virtual Desktop and Remote Desktop Services
        url: https://learn.microsoft.com/en-us/windows-server/remote/remote-desktop-services/virtual-machine-recs

  # ------------------------------------------------------------------ 4
  - id: az140-qz-13-04
    objective: "1.3.4"
    difficulty: 2
    status: draft
    type: yesno_statements
    stem:
      en: |
        You have an Azure Virtual Desktop pooled host pool named **HP1** that uses the breadth-first load balancing algorithm with a max session limit of 20. HP1 contains four session hosts. All of them are available and none of them is in drain mode.

        | Session host | Current sessions |
        | --- | --- |
        | SH-0 | 9 |
        | SH-1 | 4 |
        | SH-2 | 12 |
        | SH-3 | 6 |

        A user who has no session in HP1 connects.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Vous disposez d'un pool d'hôtes Azure Virtual Desktop regroupé nommé **HP1** qui utilise l'algorithme d'équilibrage de charge breadth-first avec une limite maximale de sessions de 20. HP1 contient quatre hôtes de session. Tous sont disponibles et aucun n'est en mode drainage.

        | Hôte de session | Sessions actuelles |
        | --- | --- |
        | SH-0 | 9 |
        | SH-1 | 4 |
        | SH-2 | 12 |
        | SH-3 | 6 |

        Un utilisateur qui n'a aucune session dans HP1 se connecte.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - { id: s1, text: { en: "The new session is always placed on SH-1.", fr: "La nouvelle session est toujours placée sur SH-1." } }
        - { id: s2, text: { en: "The new session can be placed on SH-3.", fr: "La nouvelle session peut être placée sur SH-3." } }
        - { id: s3, text: { en: "The new session can be placed on SH-0.", fr: "La nouvelle session peut être placée sur SH-0." } }
    answer:
      values: { s1: false, s2: true, s3: false }
    explanation:
      correct:
        en: |
          Breadth-first doesn't always pick the host with the fewest sessions: it selects a host at random among the half of the available hosts that have the fewest sessions. With four available hosts, that half is SH-1 (4 sessions) and SH-3 (6 sessions), so either can receive the session, but SH-0 and SH-2 can't.
        fr: |
          Breadth-first ne choisit pas toujours l'hôte qui a le moins de sessions : il sélectionne un hôte au hasard parmi la moitié des hôtes disponibles qui ont le moins de sessions. Avec quatre hôtes disponibles, cette moitié comprend SH-1 (4 sessions) et SH-3 (6 sessions) : l'un ou l'autre peut recevoir la session, mais pas SH-0 ni SH-2.
      options:
        s1: { en: "SH-1 has the fewest sessions, but the choice is random between SH-1 and SH-3.", fr: "SH-1 a le moins de sessions, mais le choix est aléatoire entre SH-1 et SH-3." }
        s3: { en: "SH-0 belongs to the half of the hosts with the most sessions, so breadth-first doesn't consider it.", fr: "SH-0 fait partie de la moitié des hôtes qui ont le plus de sessions : breadth-first ne le prend pas en compte." }
    references:
      - title: Configure host pool load balancing in Azure Virtual Desktop
        url: https://learn.microsoft.com/en-us/azure/virtual-desktop/host-pool-load-balancing

  # ------------------------------------------------------------------ 5
  - id: az140-qz-13-05
    objective: "1.3.3"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Tailspin Toys has 300 employees. Each employee is assigned an Office 365 E3 license and has no other Microsoft license. Tailspin plans an Azure Virtual Desktop pooled host pool whose session hosts run Windows 11 Enterprise multi-session.

        You need to ensure that the employees are licensed to access the session hosts. The employees must keep their Office 365 E3 licenses.

        What should you do?
      fr: |
        Tailspin Toys compte 300 employés. Chaque employé dispose d'une licence Office 365 E3 et d'aucune autre licence Microsoft. Tailspin prévoit un pool d'hôtes Azure Virtual Desktop regroupé dont les hôtes de session exécutent Windows 11 Entreprise multisession.

        Vous devez faire en sorte que les employés soient licenciés pour accéder aux hôtes de session. Les employés doivent conserver leurs licences Office 365 E3.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Assign a Windows Enterprise E3 license to each employee", fr: "Attribuer une licence Windows Entreprise E3 à chaque employé" } }
        - { id: b, text: { en: "Buy an RDS CAL with Software Assurance for each employee", fr: "Acheter une CAL RDS avec Software Assurance pour chaque employé" } }
        - { id: c, text: { en: "Enroll the Azure subscription in per-user access pricing", fr: "Inscrire l'abonnement Azure à la tarification de l'accès par utilisateur" } }
        - { id: d, text: { en: "Do nothing, because Office 365 E3 includes the access rights", fr: "Ne rien faire, car Office 365 E3 inclut les droits d'accès" } }
    answer: { optionId: a }
    explanation:
      correct:
        en: |
          Windows client session hosts require each user to hold an eligible license: Microsoft 365 E3, E5, A3, A5, F3 or Business Premium, Windows Enterprise E3 or E5, Windows Education A3 or A5, or Windows VDA per user. Office 365 E3 isn't on that list because it contains no Windows entitlement, so adding Windows Enterprise E3 licenses the employees while they keep Office 365 E3.
        fr: |
          Les hôtes de session Windows client exigent que chaque utilisateur détienne une licence éligible : Microsoft 365 E3, E5, A3, A5, F3 ou Business Premium, Windows Entreprise E3 ou E5, Windows Éducation A3 ou A5, ou Windows VDA par utilisateur. Office 365 E3 ne figure pas dans cette liste car il ne contient aucun droit Windows : ajouter Windows Entreprise E3 licencie les employés tout en leur laissant Office 365 E3.
      options:
        b: { en: "RDS CALs license connections to Windows Server session hosts, not to Windows 11 Enterprise multi-session.", fr: "Les CAL RDS licencient les connexions aux hôtes de session Windows Server, pas à Windows 11 Entreprise multisession." }
        c: { en: "Per-user access pricing is for external commercial use, such as customers of a SaaS application, not for employees.", fr: "La tarification de l'accès par utilisateur est réservée à l'usage commercial externe, comme les clients d'une application SaaS, pas aux employés." }
        d: { en: "Office 365 E3 isn't an eligible license: unlike Microsoft 365 E3, it doesn't include Windows Enterprise.", fr: "Office 365 E3 n'est pas une licence éligible : contrairement à Microsoft 365 E3, il n'inclut pas Windows Entreprise." }
    references:
      - title: Licensing Azure Virtual Desktop
        url: https://learn.microsoft.com/en-us/azure/virtual-desktop/licensing

  # ------------------------------------------------------------------ 6
  - id: az140-qz-13-06
    objective: "1.3.5"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Woodgrove Bank has an Azure Virtual Desktop pooled host pool named **HP-Ops**. Its session hosts are D16s_v5 VMs (16 vCPUs, no GPU) that run Windows 11 Enterprise multi-session. HP-Ops serves 400 back-office users and 30 traders.

        Each trader works on a full desktop spread across two 4K monitors (3840 × 2160 each). Since they moved to HP-Ops, the traders report pixelation, block artifacts and frozen frames, while the back-office users report no issue. CPU usage is high on the session hosts that run trader sessions.

        You need to recommend a solution that resolves the traders' issue. The solution must not increase the cost of the session hosts that serve the back-office users.

        What should you recommend?
      fr: |
        Woodgrove Bank dispose d'un pool d'hôtes Azure Virtual Desktop regroupé nommé **HP-Ops**. Ses hôtes de session sont des machines virtuelles D16s_v5 (16 vCPU, sans GPU) qui exécutent Windows 11 Entreprise multisession. HP-Ops sert 400 utilisateurs du back-office et 30 traders.

        Chaque trader travaille sur un bureau complet réparti sur deux écrans 4K (3840 × 2160 chacun). Depuis leur passage sur HP-Ops, les traders signalent de la pixellisation, des artefacts en blocs et des images figées, alors que les utilisateurs du back-office ne signalent aucun problème. L'utilisation du processeur est élevée sur les hôtes de session qui exécutent des sessions de traders.

        Vous devez recommander une solution qui résout le problème des traders. La solution ne doit pas augmenter le coût des hôtes de session qui servent les utilisateurs du back-office.

        Que devez-vous recommander ?
    body:
      options:
        - { id: a, text: { en: "Enable the H.264/AVC hardware encoding policy on the HP-Ops session hosts, and then restart them", fr: "Activer la stratégie d'encodage matériel H.264/AVC sur les hôtes de session de HP-Ops, puis les redémarrer" } }
        - { id: b, text: { en: "Move the traders to a new host pool of NVadsA10 v5 hosts with the GRID driver and the GPU policies", fr: "Déplacer les traders vers un nouveau pool d'hôtes NVadsA10 v5 avec le pilote GRID et les stratégies GPU" } }
        - { id: c, text: { en: "Move the traders to a new host pool of D32s_v5 hosts with a max session limit of 10 users", fr: "Déplacer les traders vers un nouveau pool d'hôtes D32s_v5 avec une limite maximale de 10 sessions" } }
        - { id: d, text: { en: "Resize every HP-Ops session host to D32s_v5, and then lower the max session limit of HP-Ops", fr: "Redimensionner tous les hôtes de session de HP-Ops en D32s_v5, puis abaisser la limite maximale de sessions de HP-Ops" } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          Two 4K monitors exceed a total resolution of 3840 × 2160, the point beyond which CPU contention causes artifacts, pixelation and frozen frames: Microsoft recommends moving such users to GPU-enabled session hosts. An NVadsA10 v5 host with the NVIDIA GRID driver and the hardware rendering and encoding policies offloads the work to the GPU. A separate host pool is required because all the hosts of a pool share one size and image, and it keeps the back-office hosts unchanged.
        fr: |
          Deux écrans 4K dépassent une résolution totale de 3840 × 2160, seuil au-delà duquel la contention du processeur provoque artefacts, pixellisation et images figées : Microsoft recommande de déplacer ces utilisateurs vers des hôtes de session équipés d'un GPU. Un hôte NVadsA10 v5 avec le pilote NVIDIA GRID et les stratégies de rendu et d'encodage matériels confie ce travail au GPU. Un pool d'hôtes distinct est nécessaire car tous les hôtes d'un pool partagent une taille et une image, et il laisse les hôtes du back-office inchangés.
      options:
        a: { en: "Hardware encoding needs a GPU: the D16s_v5 hosts have none, so the policy changes nothing.", fr: "L'encodage matériel exige un GPU : les hôtes D16s_v5 n'en ont pas, la stratégie ne change donc rien." }
        c: { en: "More vCPUs keep the encoding on the CPU; above 3840 × 2160 the guidance is a GPU host, not a larger CPU host.", fr: "Davantage de vCPU laissent l'encodage sur le processeur ; au-delà de 3840 × 2160, la recommandation est un hôte GPU, pas un hôte processeur plus gros." }
        d: { en: "Resizing every host raises the cost of the back-office hosts and still encodes the traders' displays on the CPU.", fr: "Redimensionner tous les hôtes augmente le coût des hôtes du back-office et encode toujours l'affichage des traders sur le processeur." }
    references:
      - title: Session host virtual machine sizing guidelines for Azure Virtual Desktop and Remote Desktop Services
        url: https://learn.microsoft.com/en-us/windows-server/remote/remote-desktop-services/virtual-machine-recs
      - title: Enable GPU acceleration for Azure Virtual Desktop
        url: https://learn.microsoft.com/en-us/azure/virtual-desktop/graphics-enable-gpu-acceleration

  # ------------------------------------------------------------------ 7
  - id: az140-qz-13-07
    objective: "1.3.2"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Adatum Corporation runs a laboratory application whose vendor certifies it only on Windows 10 Enterprise, including the multi-session edition. The vendor won't certify Windows 11 before 2028. The 120 laboratory users are licensed with Microsoft 365 E3 and will share pooled Azure Virtual Desktop session hosts.

        You need to recommend an operating system for the session hosts. The solution must meet the following requirements:

        - The session hosts must keep receiving security updates.
        - The configuration must be supported by Azure Virtual Desktop and by the vendor.
        - Licensing costs must be minimized.

        What should you recommend?
      fr: |
        Adatum Corporation exploite une application de laboratoire que son éditeur ne certifie que sur Windows 10 Entreprise, édition multisession comprise. L'éditeur ne certifiera pas Windows 11 avant 2028. Les 120 utilisateurs du laboratoire sont licenciés avec Microsoft 365 E3 et partageront des hôtes de session Azure Virtual Desktop regroupés.

        Vous devez recommander un système d'exploitation pour les hôtes de session. La solution doit répondre aux exigences suivantes :

        - Les hôtes de session doivent continuer à recevoir les mises à jour de sécurité.
        - La configuration doit être prise en charge par Azure Virtual Desktop et par l'éditeur.
        - Les coûts de licence doivent être réduits au minimum.

        Que devez-vous recommander ?
    body:
      options:
        - { id: a, text: { en: "Windows 10 Enterprise multi-session, version 22H2, with ESU licenses bought for each session host", fr: "Windows 10 Entreprise multisession, version 22H2, avec des licences ESU achetées pour chaque hôte de session" } }
        - { id: b, text: { en: "Windows 10 Enterprise LTSC 2021, with security updates from its own long-term servicing lifecycle", fr: "Windows 10 Entreprise LTSC 2021, avec les mises à jour de sécurité de son propre cycle de maintenance à long terme" } }
        - { id: c, text: { en: "Windows Server 2019 with Desktop Experience, with RDS CALs bought for the 120 users", fr: "Windows Server 2019 avec l'Expérience de bureau, avec des CAL RDS achetées pour les 120 utilisateurs" } }
        - { id: d, text: { en: "Windows 10 Enterprise multi-session, version 22H2, with the ESU that Azure Virtual Desktop includes", fr: "Windows 10 Entreprise multisession, version 22H2, avec les ESU qu'Azure Virtual Desktop inclut" } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          Windows 10 reached end of support on October 14, 2025, but Windows 10 virtual machines in Azure Virtual Desktop receive Extended Security Updates at no additional cost, on version 22H2. Windows 10 Enterprise multi-session is a supported session host OS covered by Microsoft 365 E3, so this choice meets the vendor's certification and keeps licensing costs at zero; Microsoft recommends it only when, as here, an application blocks Windows 11.
        fr: |
          Windows 10 a atteint la fin de son support le 14 octobre 2025, mais les machines virtuelles Windows 10 dans Azure Virtual Desktop reçoivent les mises à jour de sécurité étendues (ESU) sans coût supplémentaire, en version 22H2. Windows 10 Entreprise multisession est un système d'hôte de session pris en charge et couvert par Microsoft 365 E3 : ce choix respecte la certification de l'éditeur sans coût de licence ; Microsoft ne le recommande que lorsque, comme ici, une application empêche le passage à Windows 11.
      options:
        a: { en: "ESU is already included for Windows 10 VMs in Azure Virtual Desktop: buying ESU licenses adds a cost for nothing.", fr: "Les ESU sont déjà incluses pour les machines virtuelles Windows 10 dans Azure Virtual Desktop : acheter des licences ESU ajoute un coût inutile." }
        b: { en: "LTSC editions aren't supported for session hosts, and LTSC isn't a multi-session edition that several users can share.", fr: "Les éditions LTSC ne sont pas prises en charge pour les hôtes de session, et LTSC n'est pas une édition multisession que plusieurs utilisateurs peuvent partager." }
        c: { en: "The vendor certifies only Windows 10 Enterprise, and Windows Server adds the cost of RDS CALs that Microsoft 365 E3 doesn't cover.", fr: "L'éditeur ne certifie que Windows 10 Entreprise, et Windows Server ajoute le coût de CAL RDS que Microsoft 365 E3 ne couvre pas." }
    references:
      - title: Extended Security Updates (ESU) program for Windows 10
        url: https://learn.microsoft.com/en-us/windows/whats-new/extended-security-updates
      - title: Prerequisites for Azure Virtual Desktop
        url: https://learn.microsoft.com/en-us/azure/virtual-desktop/prerequisites

  # ------------------------------------------------------------------ 8
  - id: az140-qz-13-08
    objective: "1.3.4"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        Northwind Traders has an Azure Virtual Desktop pooled host pool named **HP-Sales** that uses the depth-first load balancing algorithm with a max session limit of 20. HP-Sales contains the session hosts shown in the following table. All of them are running.

        | Session host | Drain mode | Current sessions |
        | --- | --- | --- |
        | SH-0 | Off | 20 |
        | SH-1 | Off | 14 |
        | SH-2 | On | 17 |
        | SH-3 | Off | 3 |

        The users who connect next have no existing session in HP-Sales.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Northwind Traders dispose d'un pool d'hôtes Azure Virtual Desktop regroupé nommé **HP-Sales** qui utilise l'algorithme d'équilibrage de charge depth-first avec une limite maximale de sessions de 20. HP-Sales contient les hôtes de session présentés dans le tableau suivant. Tous sont démarrés.

        | Hôte de session | Mode drainage | Sessions actuelles |
        | --- | --- | --- |
        | SH-0 | Désactivé | 20 |
        | SH-1 | Désactivé | 14 |
        | SH-2 | Activé | 17 |
        | SH-3 | Désactivé | 3 |

        Les prochains utilisateurs qui se connectent n'ont aucune session existante dans HP-Sales.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - { id: s1, text: { en: "The next new session is placed on SH-1.", fr: "La prochaine nouvelle session est placée sur SH-1." } }
        - { id: s2, text: { en: "After SH-1 reaches 20 sessions, the next new session is placed on SH-2.", fr: "Une fois que SH-1 atteint 20 sessions, la nouvelle session suivante est placée sur SH-2." } }
        - { id: s3, text: { en: "If you lower the max session limit of HP-Sales to 14, the next new session is placed on SH-3.", fr: "Si vous abaissez la limite maximale de sessions de HP-Sales à 14, la prochaine nouvelle session est placée sur SH-3." } }
    answer:
      values: { s1: true, s2: false, s3: true }
    explanation:
      correct:
        en: |
          Depth-first first keeps the session hosts that allow new connections and are below the max session limit, then picks the one with the most sessions. SH-0 is at the limit and SH-2 is in drain mode, so SH-1 (14 sessions) is chosen before SH-3. With a limit of 14, SH-1 has reached the limit too, so SH-3 becomes the only candidate.
        fr: |
          Depth-first retient d'abord les hôtes de session qui acceptent de nouvelles connexions et sont sous la limite maximale de sessions, puis choisit celui qui a le plus de sessions. SH-0 a atteint la limite et SH-2 est en mode drainage : SH-1 (14 sessions) est donc choisi avant SH-3. Avec une limite de 14, SH-1 a lui aussi atteint la limite : SH-3 devient le seul candidat.
      options:
        s2: { en: "A host in drain mode accepts no new session, even if it has the most sessions under the limit: the session goes to SH-3.", fr: "Un hôte en mode drainage n'accepte aucune nouvelle session, même s'il a le plus de sessions sous la limite : la session va sur SH-3." }
    references:
      - title: Configure host pool load balancing in Azure Virtual Desktop
        url: https://learn.microsoft.com/en-us/azure/virtual-desktop/host-pool-load-balancing
      - title: Drain session hosts for maintenance in Azure Virtual Desktop
        url: https://learn.microsoft.com/en-us/azure/virtual-desktop/drain-mode

  # ------------------------------------------------------------------ 9
  - id: az140-qz-13-09
    objective: "1.3.3"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        Proseware, Inc. sells access to a design application to other companies. The application is published as a RemoteApp from Windows 11 Enterprise multi-session session hosts in the following Azure subscriptions of the same Microsoft Entra tenant:

        | Subscription | Content | Per-user access pricing |
        | --- | --- | --- |
        | Sub-EU | Host pool HP-EU | Enrolled |
        | Sub-US | Host pool HP-US | Enrolled |
        | Sub-Test | Azure Dev/Test subscription with a test copy of the application | Not enrolled |

        In March, a customer user named User1 opens the RemoteApp from HP-EU on March 3 and from HP-US on March 20. A customer user named User2 connects only to the test copy in Sub-Test, to perform acceptance tests before a release.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Proseware, Inc. vend l'accès à une application de conception à d'autres entreprises. L'application est publiée en RemoteApp depuis des hôtes de session Windows 11 Entreprise multisession dans les abonnements Azure suivants, d'un même locataire Microsoft Entra :

        | Abonnement | Contenu | Tarification de l'accès par utilisateur |
        | --- | --- | --- |
        | Sub-EU | Pool d'hôtes HP-EU | Inscrit |
        | Sub-US | Pool d'hôtes HP-US | Inscrit |
        | Sub-Test | Abonnement Azure Dev/Test avec une copie de test de l'application | Non inscrit |

        En mars, un utilisateur client nommé User1 ouvre la RemoteApp depuis HP-EU le 3 mars et depuis HP-US le 20 mars. Un utilisateur client nommé User2 se connecte uniquement à la copie de test de Sub-Test, pour effectuer des tests d'acceptation avant une version.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - { id: s1, text: { en: "User1 generates an access charge in Sub-US for March.", fr: "User1 génère des frais d'accès dans Sub-US pour le mois de mars." } }
        - { id: s2, text: { en: "User2 can connect to the test copy without a separate license entitlement.", fr: "User2 peut se connecter à la copie de test sans droit de licence distinct." } }
        - { id: s3, text: { en: "The access charge of User1 includes the compute cost of the HP-EU session hosts.", fr: "Les frais d'accès de User1 incluent le coût de calcul des hôtes de session de HP-EU." } }
    answer:
      values: { s1: false, s2: true, s3: false }
    explanation:
      correct:
        en: |
          Azure Virtual Desktop issues at most one access charge per user per billing period: when a user accesses several enrolled subscriptions of the tenant, only the first subscription accessed is charged, here Sub-EU. In an Azure Dev/Test subscription, end users may connect without a separate license entitlement to perform acceptance tests. Per-user access pricing covers access rights only, on top of the charges for virtual machines and storage.
        fr: |
          Azure Virtual Desktop émet au plus un frais d'accès par utilisateur et par période de facturation : quand un utilisateur accède à plusieurs abonnements inscrits du locataire, seul le premier abonnement utilisé est facturé, ici Sub-EU. Dans un abonnement Azure Dev/Test, les utilisateurs finaux peuvent se connecter sans droit de licence distinct pour effectuer des tests d'acceptation. La tarification de l'accès par utilisateur ne couvre que les droits d'accès, en plus des frais des machines virtuelles et du stockage.
      options:
        s1: { en: "User1 accessed Sub-EU first in March, so the single charge of the month goes to Sub-EU, not Sub-US.", fr: "User1 a d'abord accédé à Sub-EU en mars : l'unique frais du mois va à Sub-EU, pas à Sub-US." }
        s3: { en: "Session host VMs, storage and networking are always billed by Azure in addition to the per-user access charge.", fr: "Les machines virtuelles hôtes de session, le stockage et le réseau sont toujours facturés par Azure en plus des frais d'accès par utilisateur." }
    references:
      - title: Licensing Azure Virtual Desktop
        url: https://learn.microsoft.com/en-us/azure/virtual-desktop/licensing
      - title: Prerequisites for Azure Virtual Desktop
        url: https://learn.microsoft.com/en-us/azure/virtual-desktop/prerequisites

  # ------------------------------------------------------------------ 10
  - id: az140-qz-13-10
    objective: "1.3.6"
    difficulty: 3
    status: draft
    type: dropdown
    shuffle: false
    stem:
      en: |
        Contoso, Ltd. has 2,400 employees who run a light workload. At peak, 55 percent of the employees are connected at the same time. Contoso plans a new pooled host pool named **HP-North** of Windows 11 Enterprise multi-session session hosts of the D8s_v5 size (8 vCPUs, Standard DSv5 family) in the West Europe region.

        The design must meet the following requirements:

        - Size the session hosts with the maximum users per vCPU of Microsoft's multi-session sizing guidelines.
        - Plan one additional session host, so that one host can be in drain mode for maintenance at peak.
        - A scaling plan will deallocate the idle session hosts outside office hours.

        The same subscription already contains a host pool named **HP-Legacy** in West Europe with 12 session hosts of the D8s_v5 size. A scaling plan keeps all of them deallocated at night.

        How should you complete the design? Select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Contoso, Ltd. compte 2 400 employés qui exécutent une charge de travail légère. Au pic, 55 % des employés sont connectés en même temps. Contoso prévoit un nouveau pool d'hôtes regroupé nommé **HP-North**, d'hôtes de session Windows 11 Entreprise multisession de taille D8s_v5 (8 vCPU, famille Standard DSv5) dans la région West Europe.

        La conception doit répondre aux exigences suivantes :

        - Dimensionner les hôtes de session avec le nombre maximal d'utilisateurs par vCPU des recommandations de dimensionnement multisession de Microsoft.
        - Prévoir un hôte de session supplémentaire, pour qu'un hôte puisse être en mode drainage pour maintenance au pic.
        - Un plan de mise à l'échelle libérera les hôtes de session inactifs en dehors des heures de bureau.

        Le même abonnement contient déjà un pool d'hôtes nommé **HP-Legacy** dans West Europe, avec 12 hôtes de session de taille D8s_v5. Un plan de mise à l'échelle les garde tous libérés la nuit.

        Comment devez-vous compléter la conception ? Sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: text
      template:
        en: |
          Max session limit of HP-North: [[limit]]

          Number of session hosts in HP-North: [[hosts]]

          Minimum Standard DSv5 Family vCPU quota of the subscription in West Europe: [[quota]]
        fr: |
          Limite maximale de sessions de HP-North : [[limit]]

          Nombre d'hôtes de session de HP-North : [[hosts]]

          Quota minimal de vCPU de la famille Standard DSv5 de l'abonnement dans West Europe : [[quota]]
      slots:
        - id: limit
          options:
            - { id: l32, text: "32" }
            - { id: l40, text: "40" }
            - { id: l48, text: "48" }
            - { id: l64, text: "64" }
        - id: hosts
          options:
            - { id: h28, text: "28" }
            - { id: h29, text: "29" }
            - { id: h43, text: "43" }
            - { id: h51, text: "51" }
        - id: quota
          options:
            - { id: q224, text: "224" }
            - { id: q232, text: "232" }
            - { id: q328, text: "328" }
            - { id: q504, text: "504" }
    answer:
      values: { limit: l48, hosts: h29, quota: q328 }
    explanation:
      correct:
        en: |
          A light workload allows six users per vCPU, so a D8s_v5 host takes 48 sessions, the max session limit that depth-first and autoscale use. Capacity follows concurrency: 55 percent of 2,400 is 1,320 sessions, 1,320 ÷ 48 = 27.5, rounded up to 28 hosts, plus one for maintenance: 29. The vCPU quota counts allocated and deallocated cores, so HP-North needs 29 × 8 = 232 vCPUs on top of the 96 vCPUs of HP-Legacy, which still count while deallocated: 328.
        fr: |
          Une charge légère autorise six utilisateurs par vCPU : un hôte D8s_v5 prend 48 sessions, la limite maximale de sessions qu'utilisent depth-first et la mise à l'échelle automatique. La capacité suit la simultanéité : 55 % de 2 400 donne 1 320 sessions, 1 320 ÷ 48 = 27,5, arrondi à 28 hôtes, plus un pour la maintenance : 29. Le quota de vCPU compte les cœurs alloués et libérés : HP-North a besoin de 29 × 8 = 232 vCPU en plus des 96 vCPU de HP-Legacy, qui comptent toujours une fois libérés : 328.
      options:
        l32: { en: "32 uses four users per vCPU, the medium workload ratio.", fr: "32 utilise quatre utilisateurs par vCPU, le ratio de la charge moyenne." }
        l64: { en: "64 assumes eight users per vCPU, more than the guidelines allow for any workload.", fr: "64 suppose huit utilisateurs par vCPU, plus que les recommandations n'en autorisent pour toute charge." }
        h28: { en: "28 covers the peak but leaves no host for maintenance.", fr: "28 couvre le pic mais ne laisse aucun hôte pour la maintenance." }
        h43: { en: "43 sizes the hosts for a medium workload (32 users per host).", fr: "43 dimensionne les hôtes pour une charge moyenne (32 utilisateurs par hôte)." }
        h51: { en: "51 sizes for the whole headcount instead of the peak concurrency.", fr: "51 dimensionne pour tout l'effectif au lieu de la simultanéité de pointe." }
        q232: { en: "232 forgets HP-Legacy: deallocated VMs still consume vCPU quota.", fr: "232 oublie HP-Legacy : les machines virtuelles libérées consomment toujours du quota de vCPU." }
        q504: { en: "504 counts 51 hosts sized for the headcount, not for the peak.", fr: "504 compte 51 hôtes dimensionnés pour l'effectif, pas pour le pic." }
    references:
      - title: Session host virtual machine sizing guidelines for Azure Virtual Desktop and Remote Desktop Services
        url: https://learn.microsoft.com/en-us/windows-server/remote/remote-desktop-services/virtual-machine-recs
      - title: Check vCPU quotas
        url: https://learn.microsoft.com/en-us/azure/virtual-machines/quotas
