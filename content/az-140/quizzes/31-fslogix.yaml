chapter: 31-fslogix
questions:
  # ------------------------------------------------------------------ 1
  - id: az140-qz-31-01
    objective: "3.1.4"
    difficulty: 1
    status: draft
    type: single
    shuffle: false
    stem:
      en: |
        You plan to configure FSLogix Cloud Cache for the profile containers of a pooled Azure Virtual Desktop host pool.

        What is the maximum number of storage providers that you can list in the `CCDLocations` value?
      fr: |
        Vous prévoyez de configurer FSLogix Cloud Cache pour les conteneurs de profils d'un pool d'hôtes Azure Virtual Desktop regroupé.

        Quel est le nombre maximal de fournisseurs de stockage que vous pouvez lister dans la valeur `CCDLocations` ?
    body:
      options:
        - { id: a, text: "2" }
        - { id: b, text: "3" }
        - { id: c, text: "4" }
        - { id: d, text: "8" }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          `CCDLocations` accepts SMB and Azure page blob providers, with up to four remote container locations. The first provider listed is used for reads while it's healthy, and every provider receives the writes.
        fr: |
          `CCDLocations` accepte des fournisseurs SMB et des objets blob de pages Azure, avec quatre emplacements de conteneurs distants au maximum. Le premier fournisseur listé sert aux lectures tant qu'il est sain, et tous les fournisseurs reçoivent les écritures.
      options:
        a: { en: "Two providers is the minimum for resiliency, not the maximum.", fr: "Deux fournisseurs constituent le minimum pour la résilience, pas le maximum." }
        b: { en: "Cloud Cache supports one more provider than three.", fr: "Cloud Cache prend en charge un fournisseur de plus que trois." }
        d: { en: "Cloud Cache doesn't support more than four remote locations.", fr: "Cloud Cache ne prend pas en charge plus de quatre emplacements distants." }
    references:
      - title: Configuration Settings
        url: https://learn.microsoft.com/en-us/fslogix/reference-configuration-settings

  # ------------------------------------------------------------------ 2
  - id: az140-qz-31-02
    objective: "3.1.5"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        An FSLogix Rule Set named **HideCAD** hides an application from a group named **Interns** on the session hosts of a pooled host pool. You change the Rule Set so that it also applies to a group named **Contractors**. The hiding rules themselves don't change.

        Which file of the Rule Set contains this change?
      fr: |
        Un Rule Set FSLogix nommé **HideCAD** masque une application à un groupe nommé **Interns** sur les hôtes de session d'un pool d'hôtes regroupé. Vous modifiez le Rule Set pour qu'il s'applique aussi à un groupe nommé **Contractors**. Les règles de masquage elles-mêmes ne changent pas.

        Quel fichier du Rule Set contient cette modification ?
    body:
      options:
        - { id: a, text: "`HideCAD.fxr`" }
        - { id: b, text: "`HideCAD.fxa`" }
        - { id: c, text: "`redirections.xml`" }
        - { id: d, text: "`fslogix.admx`" }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          A Rule Set is saved as two files: the `.fxr` file holds the rules and the `.fxa` file holds the assignments. Adding a group changes only the assignments, so the updated `.fxa` file is the one to copy to `C:\Program Files\FSLogix\Apps\Rules`, where it applies immediately.
        fr: |
          Un Rule Set est enregistré dans deux fichiers : le fichier `.fxr` contient les règles et le fichier `.fxa` contient les attributions. Ajouter un groupe ne modifie que les attributions : c'est donc le fichier `.fxa` mis à jour qu'il faut copier dans `C:\Program Files\FSLogix\Apps\Rules`, où il s'applique immédiatement.
      options:
        a: { en: "The `.fxr` file holds the hiding rules, which didn't change.", fr: "Le fichier `.fxr` contient les règles de masquage, qui n'ont pas changé." }
        c: { en: "`redirections.xml` lists folders to keep out of the profile container; it has nothing to do with Rule Sets.", fr: "`redirections.xml` liste les dossiers à garder hors du conteneur de profil ; il n'a aucun rapport avec les Rule Sets." }
        d: { en: "The ADMX template adds FSLogix settings to Group Policy; Rule Set assignments aren't stored in it.", fr: "Le modèle ADMX ajoute les paramètres FSLogix à la stratégie de groupe ; les attributions de Rule Set n'y sont pas stockées." }
    references:
      - title: "Tutorial: Create and Implement Rule Sets (Application Masking)"
        url: https://learn.microsoft.com/en-us/fslogix/tutorial-application-rule-sets

  # ------------------------------------------------------------------ 3
  - id: az140-qz-31-03
    objective: "3.1.3"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Woodgrove keeps a third-party roaming profile solution on the session hosts of a pooled host pool and uses FSLogix ODFC containers for the Microsoft 365 app data. Only `Enabled`, `VHDLocations` and `VolumeType` are configured for the ODFC container.

        Users now keep notebooks in the OneNote desktop app, and the notebook files must follow them to any session host in the ODFC container.

        What should you do?
      fr: |
        Woodgrove garde une solution de profils itinérants tierce sur les hôtes de session d'un pool d'hôtes regroupé et utilise des conteneurs ODFC FSLogix pour les données des applications Microsoft 365. Seules les valeurs `Enabled`, `VHDLocations` et `VolumeType` sont configurées pour le conteneur ODFC.

        Les utilisateurs conservent désormais des blocs-notes dans l'application de bureau OneNote, et les fichiers de blocs-notes doivent les suivre sur n'importe quel hôte de session, dans le conteneur ODFC.

        Que devez-vous faire ?
    body:
      options:
        - id: a
          text:
            en: "Create `IncludeOneNote` with a value of 1 under `HKLM\\SOFTWARE\\Policies\\FSLogix\\ODFC`."
            fr: "Créer `IncludeOneNote` avec la valeur 1 sous `HKLM\\SOFTWARE\\Policies\\FSLogix\\ODFC`."
        - id: b
          text:
            en: "Create `IncludeSharepoint` with a value of 1 under `HKLM\\SOFTWARE\\Policies\\FSLogix\\ODFC`."
            fr: "Créer `IncludeSharepoint` avec la valeur 1 sous `HKLM\\SOFTWARE\\Policies\\FSLogix\\ODFC`."
        - id: c
          text:
            en: "Create `IncludeOneDrive` with a value of 1 under `HKLM\\SOFTWARE\\Policies\\FSLogix\\ODFC`."
            fr: "Créer `IncludeOneDrive` avec la valeur 1 sous `HKLM\\SOFTWARE\\Policies\\FSLogix\\ODFC`."
        - id: d
          text:
            en: "Create `IncludeOneNote` with a value of 1 under `HKLM\\SOFTWARE\\FSLogix\\Profiles`."
            fr: "Créer `IncludeOneNote` avec la valeur 1 sous `HKLM\\SOFTWARE\\FSLogix\\Profiles`."
    answer: { optionId: a }
    explanation:
      correct:
        en: |
          `IncludeOneNote` decides whether OneNote notebook files are redirected to the ODFC container, and its default is 0. Because FSLogix creates no value at installation, you must create it with 1 under the ODFC key for the notebooks to be stored in the container.
        fr: |
          `IncludeOneNote` décide si les fichiers de blocs-notes OneNote sont redirigés vers le conteneur ODFC, et sa valeur par défaut est 0. Comme FSLogix ne crée aucune valeur à l'installation, vous devez la créer avec 1 sous la clé ODFC pour que les blocs-notes soient stockés dans le conteneur.
      options:
        b: { en: "`IncludeSharepoint` already defaults to 1 and concerns SharePoint data, not OneNote notebooks.", fr: "`IncludeSharepoint` vaut déjà 1 par défaut et concerne les données SharePoint, pas les blocs-notes OneNote." }
        c: { en: "`IncludeOneDrive` already defaults to 1 and redirects the OneDrive cache, not the OneNote notebook files.", fr: "`IncludeOneDrive` vaut déjà 1 par défaut et redirige le cache OneDrive, pas les fichiers de blocs-notes OneNote." }
        d: { en: "The Include values are ODFC settings; under the profile container key they don't configure the ODFC container.", fr: "Les valeurs Include sont des paramètres ODFC ; sous la clé du conteneur de profil, elles ne configurent pas le conteneur ODFC." }
    references:
      - title: Configuration Settings
        url: https://learn.microsoft.com/en-us/fslogix/reference-configuration-settings

  # ------------------------------------------------------------------ 4
  - id: az140-qz-31-04
    objective: "3.1.2"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        The session hosts of a pooled host pool at Fabrikam use FSLogix profile containers. Administrators sometimes connect to the session hosts through Azure Bastion to troubleshoot them, and FSLogix then creates containers for their accounts on the profile share. Some administrators also use the same accounts in Azure Virtual Desktop sessions and must keep their containers there.

        You need FSLogix to process only the sessions that are opened through Azure Virtual Desktop. The solution must minimize administrative effort.

        What should you configure on the session hosts?
      fr: |
        Les hôtes de session d'un pool d'hôtes regroupé de Fabrikam utilisent des conteneurs de profils FSLogix. Les administrateurs se connectent parfois aux hôtes de session via Azure Bastion pour les dépanner, et FSLogix crée alors des conteneurs pour leurs comptes sur le partage de profils. Certains administrateurs utilisent aussi les mêmes comptes dans des sessions Azure Virtual Desktop et doivent y garder leurs conteneurs.

        Vous devez faire en sorte que FSLogix ne traite que les sessions ouvertes via Azure Virtual Desktop. La solution doit réduire l'effort administratif.

        Que devez-vous configurer sur les hôtes de session ?
    body:
      options:
        - id: a
          text:
            en: "Set `IgnoreNonWVD` to 1 under `HKLM\\SOFTWARE\\FSLogix\\Profiles`."
            fr: "Définir `IgnoreNonWVD` sur 1 sous `HKLM\\SOFTWARE\\FSLogix\\Profiles`."
        - id: b
          text:
            en: "Add each administrator account to the FSLogix Profile Exclude List local group."
            fr: "Ajouter chaque compte d'administrateur au groupe local FSLogix Profile Exclude List."
        - id: c
          text:
            en: "Set `AccessNetworkAsComputerObject` to 1 under `HKLM\\SOFTWARE\\FSLogix\\Profiles`."
            fr: "Définir `AccessNetworkAsComputerObject` sur 1 sous `HKLM\\SOFTWARE\\FSLogix\\Profiles`."
        - id: d
          text:
            en: "Set `PreventLoginWithFailure` to 1 under `HKLM\\SOFTWARE\\FSLogix\\Profiles`."
            fr: "Définir `PreventLoginWithFailure` sur 1 sous `HKLM\\SOFTWARE\\FSLogix\\Profiles`."
    answer: { optionId: a }
    explanation:
      correct:
        en: |
          With `IgnoreNonWVD` set to 1, FSLogix is enabled only for Azure Virtual Desktop sessions; other sessions, such as an RDP connection through Azure Bastion, are ignored. The setting works by session type, so the same account still gets its container in Azure Virtual Desktop, and no list has to be maintained.
        fr: |
          Avec `IgnoreNonWVD` défini sur 1, FSLogix n'est activé que pour les sessions Azure Virtual Desktop ; les autres sessions, comme une connexion RDP via Azure Bastion, sont ignorées. Le paramètre agit par type de session : le même compte reçoit toujours son conteneur dans Azure Virtual Desktop, et aucune liste n'est à tenir à jour.
      options:
        b: { en: "The exclude list works per account, not per session type: these administrators would lose their containers in Azure Virtual Desktop too, and the list must be maintained.", fr: "La liste d'exclusion agit par compte, pas par type de session : ces administrateurs perdraient aussi leurs conteneurs dans Azure Virtual Desktop, et la liste est à tenir à jour." }
        c: { en: "`AccessNetworkAsComputerObject` changes the account used to attach the disk; it doesn't filter sessions and is a security risk.", fr: "`AccessNetworkAsComputerObject` change le compte utilisé pour attacher le disque ; il ne filtre pas les sessions et présente un risque de sécurité." }
        d: { en: "`PreventLoginWithFailure` blocks a sign-in when the container fails to attach; it doesn't skip non-Azure Virtual Desktop sessions.", fr: "`PreventLoginWithFailure` bloque une connexion quand le conteneur ne s'attache pas ; il n'ignore pas les sessions hors Azure Virtual Desktop." }
    references:
      - title: Configuration Settings
        url: https://learn.microsoft.com/en-us/fslogix/reference-configuration-settings

  # ------------------------------------------------------------------ 5
  - id: az140-qz-31-05
    objective: "3.1.2"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        The session hosts of a pooled host pool named **HP-Design** use FSLogix profile containers, and `SizeInMBs` isn't configured. Several users have filled their containers.

        You need the existing and the new containers to be able to grow to 60 GB. Users must keep their profile data, and the solution must minimize administrative effort.

        What should you do?
      fr: |
        Les hôtes de session d'un pool d'hôtes regroupé nommé **HP-Design** utilisent des conteneurs de profils FSLogix, et `SizeInMBs` n'est pas configuré. Plusieurs utilisateurs ont rempli leurs conteneurs.

        Vous devez faire en sorte que les conteneurs existants et les nouveaux puissent atteindre 60 Go. Les utilisateurs doivent garder leurs données de profil, et la solution doit réduire l'effort administratif.

        Que devez-vous faire ?
    body:
      options:
        - id: a
          text:
            en: "Set `SizeInMBs` to 61440 on the session hosts; existing containers are extended when their users next sign in."
            fr: "Définir `SizeInMBs` sur 61440 sur les hôtes de session ; les conteneurs existants sont étendus à la prochaine connexion de leurs utilisateurs."
        - id: b
          text:
            en: "Set `SizeInMBs` to 61440 on the session hosts, and then delete the existing containers so that FSLogix re-creates them."
            fr: "Définir `SizeInMBs` sur 61440 sur les hôtes de session, puis supprimer les conteneurs existants pour que FSLogix les recrée."
        - id: c
          text:
            en: "Set `IsDynamic` to 0 on the session hosts so that the containers can use all the free space of the share."
            fr: "Définir `IsDynamic` sur 0 sur les hôtes de session pour que les conteneurs puissent utiliser tout l'espace libre du partage."
        - id: d
          text:
            en: "Create a 60 GB container for each user with the frx utility, and then copy each profile into its new container."
            fr: "Créer un conteneur de 60 Go pour chaque utilisateur avec l'utilitaire frx, puis copier chaque profil dans son nouveau conteneur."
    answer: { optionId: a }
    explanation:
      correct:
        en: |
          `SizeInMBs` sets the maximum size of the containers (30000 by default). You can increase it at any time: new containers are created at the new size, and existing containers are extended automatically to it during the user's sign-in, with their data intact.
        fr: |
          `SizeInMBs` définit la taille maximale des conteneurs (30000 par défaut). Vous pouvez l'augmenter à tout moment : les nouveaux conteneurs sont créés à la nouvelle taille, et les conteneurs existants y sont étendus automatiquement pendant la connexion de l'utilisateur, avec leurs données intactes.
      options:
        b: { en: "Deleting the containers destroys the users' profiles, and it isn't needed because existing containers are extended automatically.", fr: "Supprimer les conteneurs détruit les profils des utilisateurs, et c'est inutile car les conteneurs existants sont étendus automatiquement." }
        c: { en: "`IsDynamic` = 0 allocates the full maximum size at creation; it doesn't raise the maximum size.", fr: "`IsDynamic` = 0 alloue la taille maximale complète à la création ; il n'augmente pas cette taille maximale." }
        d: { en: "Re-creating and copying every profile works but adds effort that a single setting change avoids.", fr: "Recréer et copier chaque profil fonctionne, mais ajoute un effort qu'une seule modification de paramètre évite." }
    references:
      - title: Configuration Settings
        url: https://learn.microsoft.com/en-us/fslogix/reference-configuration-settings

  # ------------------------------------------------------------------ 6
  - id: az140-qz-31-06
    objective: "3.1.1"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        Litware is deploying a new pooled host pool named **HP-Ops** for 600 users in the West Europe region. Users have no other roaming profile solution. The draft FSLogix design contains the following elements:

        - Profile containers in VHDX format, with `ProfileType` left at its default value
        - `FlipFlopProfileDirectoryName` set to 1 before the first user signs in
        - The containers stored on an Azure Files Premium share in the North Europe region, where Litware already has a storage account
        - A second Azure Files share listed as the second entry of `VHDLocations`, so that users keep their profiles if the first share is unavailable
        - The FSLogix antivirus exclusions deployed to the session hosts

        You need to change the elements that don't follow Microsoft's recommendations.

        Which two elements should you change?

        NOTE: Each correct selection is worth one point.
      fr: |
        Litware déploie un nouveau pool d'hôtes regroupé nommé **HP-Ops** pour 600 utilisateurs dans la région Europe Ouest. Les utilisateurs n'ont aucune autre solution de profils itinérants. La conception FSLogix provisoire contient les éléments suivants :

        - Des conteneurs de profils au format VHDX, avec `ProfileType` laissé à sa valeur par défaut
        - `FlipFlopProfileDirectoryName` défini sur 1 avant la première connexion d'un utilisateur
        - Des conteneurs stockés sur un partage Azure Files Premium dans la région Europe Nord, où Litware dispose déjà d'un compte de stockage
        - Un deuxième partage Azure Files listé comme deuxième entrée de `VHDLocations`, pour que les utilisateurs gardent leurs profils si le premier partage est indisponible
        - Les exclusions antivirus FSLogix déployées sur les hôtes de session

        Vous devez modifier les éléments qui ne suivent pas les recommandations de Microsoft.

        Quels sont les deux éléments que vous devez modifier ?

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "The VHDX format with the default ProfileType", fr: "Le format VHDX avec le ProfileType par défaut" } }
        - { id: b, text: { en: "FlipFlopProfileDirectoryName set before the first sign-in", fr: "FlipFlopProfileDirectoryName défini avant la première connexion" } }
        - { id: c, text: { en: "The Azure Files Premium share in North Europe", fr: "Le partage Azure Files Premium en Europe Nord" } }
        - { id: d, text: { en: "The second share in VHDLocations for availability", fr: "Le deuxième partage dans VHDLocations pour la disponibilité" } }
        - { id: e, text: { en: "The FSLogix antivirus exclusions on the session hosts", fr: "Les exclusions antivirus FSLogix sur les hôtes de session" } }
    answer: { optionIds: [c, d] }
    explanation:
      correct:
        en: |
          The storage account that holds the profile containers must be in the same region as the session hosts, so the share must move to West Europe. Multiple `VHDLocations` entries don't provide resiliency: FSLogix uses the first location the user can reach and can create a new, empty profile in the second one when the first is down. Availability of the profiles requires Cloud Cache with `CCDLocations`.
        fr: |
          Le compte de stockage qui contient les conteneurs de profils doit se trouver dans la même région que les hôtes de session : le partage doit donc passer en Europe Ouest. Plusieurs entrées dans `VHDLocations` n'apportent pas de résilience : FSLogix utilise le premier emplacement que l'utilisateur peut atteindre et peut créer un nouveau profil vide dans le deuxième quand le premier est indisponible. La disponibilité des profils exige Cloud Cache avec `CCDLocations`.
      options:
        a: { en: "VHDX is the recommended format, and ProfileType 0 (one read-write connection) is the recommended value for Azure Virtual Desktop.", fr: "VHDX est le format recommandé, et ProfileType 0 (une seule connexion en lecture-écriture) est la valeur recommandée pour Azure Virtual Desktop." }
        b: { en: "FlipFlopProfileDirectoryName = 1 is recommended for new deployments; only changing it on an existing deployment causes new, empty profiles.", fr: "FlipFlopProfileDirectoryName = 1 est recommandé pour les nouveaux déploiements ; seule sa modification sur un déploiement existant provoque de nouveaux profils vides." }
        e: { en: "Microsoft recommends the FSLogix antivirus exclusions on every session host that uses containers.", fr: "Microsoft recommande les exclusions antivirus FSLogix sur chaque hôte de session qui utilise des conteneurs." }
    references:
      - title: User profile management for Azure Virtual Desktop with FSLogix profile containers
        url: https://learn.microsoft.com/en-us/azure/virtual-desktop/fslogix-containers-azure-files
      - title: Configuration Examples
        url: https://learn.microsoft.com/en-us/fslogix/concepts-configuration-examples

  # ------------------------------------------------------------------ 7
  - id: az140-qz-31-07
    objective: "3.1.2"
    difficulty: 3
    status: draft
    type: dropdown
    stem:
      en: |
        Contoso has a pooled host pool whose session hosts are joined to an Active Directory Domain Services (AD DS) domain that is synchronized to Microsoft Entra ID. FSLogix profile containers of all users are stored on `\\stcontprof.file.core.windows.net\profiles`.

        The following objects are relevant:

        | Object | AD DS SID | Microsoft Entra object ID |
        | --- | --- | --- |
        | Group **Engineering** | `S-1-5-21-3623811015-3361044348-30300820-1107` | `7c1e4a2b-90d3-4f5e-8a61-2b9c0d3e4f17` |
        | User **Ben** (member of Engineering) | `S-1-5-21-3623811015-3361044348-30300820-2215` | `0b8d61f4-2e7a-4c39-95d0-6a1f3e8b7c42` |

        You need to meet the following requirements by using object-specific settings:

        - The members of Engineering must use `\\stconteng.file.core.windows.net\profiles`.
        - Ben must use `\\stcontlab.file.core.windows.net\profiles`.
        - All the other users keep the current share.

        How should you complete the configuration? Select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Contoso dispose d'un pool d'hôtes regroupé dont les hôtes de session sont joints à un domaine Active Directory Domain Services (AD DS) synchronisé avec Microsoft Entra ID. Les conteneurs de profils FSLogix de tous les utilisateurs sont stockés sur `\\stcontprof.file.core.windows.net\profiles`.

        Les objets suivants sont concernés :

        | Objet | SID AD DS | ID d'objet Microsoft Entra |
        | --- | --- | --- |
        | Groupe **Engineering** | `S-1-5-21-3623811015-3361044348-30300820-1107` | `7c1e4a2b-90d3-4f5e-8a61-2b9c0d3e4f17` |
        | Utilisateur **Ben** (membre d'Engineering) | `S-1-5-21-3623811015-3361044348-30300820-2215` | `0b8d61f4-2e7a-4c39-95d0-6a1f3e8b7c42` |

        Vous devez répondre aux exigences suivantes à l'aide de paramètres propres à un objet :

        - Les membres d'Engineering doivent utiliser `\\stconteng.file.core.windows.net\profiles`.
        - Ben doit utiliser `\\stcontlab.file.core.windows.net\profiles`.
        - Tous les autres utilisateurs gardent le partage actuel.

        Comment devez-vous compléter la configuration ? Sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: text
      template:
        en: |
          Key for the Engineering setting, under HKLM\SOFTWARE\FSLogix\Profiles: [[k1]]

          Value to create in each object-specific key: [[val]]

          Share that Ben's container uses: [[res]]
        fr: |
          Clé du paramètre d'Engineering, sous HKLM\SOFTWARE\FSLogix\Profiles : [[k1]]

          Valeur à créer dans chaque clé propre à un objet : [[val]]

          Partage qu'utilise le conteneur de Ben : [[res]]
      slots:
        - id: k1
          options:
            - { id: sid, text: 'ObjectSpecific\S-1-5-21-3623811015-3361044348-30300820-1107' }
            - { id: name, text: 'ObjectSpecific\Engineering' }
            - { id: entra, text: 'ObjectSpecific\7c1e4a2b-90d3-4f5e-8a61-2b9c0d3e4f17' }
            - { id: odfc, text: 'ODFC\S-1-5-21-3623811015-3361044348-30300820-1107' }
        - id: val
          options:
            - { id: vhd, text: VHDLocations }
            - { id: ccd, text: CCDLocations }
            - { id: redir, text: RedirXMLSourceFolder }
            - { id: flip, text: FlipFlopProfileDirectoryName }
        - id: res
          options:
            - { id: lab, text: { en: "stcontlab, because a user setting takes precedence over a group setting", fr: "stcontlab, car un paramètre d'utilisateur l'emporte sur un paramètre de groupe" } }
            - { id: eng, text: { en: "stconteng, because a group setting takes precedence over a user setting", fr: "stconteng, car un paramètre de groupe l'emporte sur un paramètre d'utilisateur" } }
            - { id: prof, text: { en: "stcontprof, because conflicting object-specific settings are ignored", fr: "stcontprof, car les paramètres propres à un objet en conflit sont ignorés" } }
    answer:
      values: { k1: sid, val: vhd, res: lab }
    explanation:
      correct:
        en: |
          Object-specific settings live in a key named after the SID of the AD DS user or group under `ObjectSpecific`, below the Profiles key, and any profile setting can be created there; `VHDLocations` sends the matching users to another share. The order of precedence is the user's object-specific setting, then the group's, then the system-wide settings, so Ben uses stcontlab while the other members of Engineering use stconteng.
        fr: |
          Les paramètres propres à un objet se trouvent dans une clé nommée d'après le SID de l'utilisateur ou du groupe AD DS sous `ObjectSpecific`, sous la clé Profiles, et n'importe quel paramètre de profil peut y être créé ; `VHDLocations` envoie les utilisateurs concernés vers un autre partage. L'ordre de priorité est le paramètre propre à l'utilisateur, puis celui du groupe, puis les paramètres de tout le système : Ben utilise donc stcontlab, tandis que les autres membres d'Engineering utilisent stconteng.
      options:
        name: { en: "The key must be named with the SID, not the group name.", fr: "La clé doit porter le SID, pas le nom du groupe." }
        entra: { en: "Object-specific settings use AD DS SIDs; Microsoft Entra object IDs and cloud-only identities aren't supported.", fr: "Les paramètres propres à un objet utilisent des SID AD DS ; les ID d'objet Microsoft Entra et les identités cloud uniquement ne sont pas pris en charge." }
        odfc: { en: "The ODFC settings are under HKLM\\SOFTWARE\\Policies\\FSLogix\\ODFC and concern the ODFC container, not the profile container.", fr: "Les paramètres ODFC se trouvent sous HKLM\\SOFTWARE\\Policies\\FSLogix\\ODFC et concernent le conteneur ODFC, pas le conteneur de profil." }
        ccd: { en: "CCDLocations configures Cloud Cache providers; the requirement is a different standard share.", fr: "CCDLocations configure des fournisseurs Cloud Cache ; l'exigence porte sur un autre partage standard." }
        eng: { en: "The user's object-specific setting is evaluated before the group's.", fr: "Le paramètre propre à l'utilisateur est évalué avant celui du groupe." }
    references:
      - title: Configure object specific container settings
        url: https://learn.microsoft.com/en-us/fslogix/how-to-configure-object-specific-settings

  # ------------------------------------------------------------------ 8
  - id: az140-qz-31-08
    objective: "3.1.3"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        Proseware keeps a third-party roaming profile solution on the session hosts of a pooled host pool named **HP-Sales**, and FSLogix ODFC containers store the Microsoft 365 app data. The following values exist under `HKLM\SOFTWARE\Policies\FSLogix\ODFC`:

        - `Enabled` = 1
        - `VHDLocations` = `\\stproseodfc.file.core.windows.net\odfc`
        - `VolumeType` = vhdx

        No value is configured under `HKLM\SOFTWARE\FSLogix\Profiles`. An Azure NetApp Files volume, `\\anf-prose.proseware.com\odfc`, is available in the same region.

        You need the ODFC containers to stay available if either storage service fails. The third-party solution must keep managing the rest of the profile.

        Which two actions should you perform? Each correct answer presents part of the solution.

        NOTE: Each correct selection is worth one point.
      fr: |
        Proseware garde une solution de profils itinérants tierce sur les hôtes de session d'un pool d'hôtes regroupé nommé **HP-Sales**, et des conteneurs ODFC FSLogix stockent les données des applications Microsoft 365. Les valeurs suivantes existent sous `HKLM\SOFTWARE\Policies\FSLogix\ODFC` :

        - `Enabled` = 1
        - `VHDLocations` = `\\stproseodfc.file.core.windows.net\odfc`
        - `VolumeType` = vhdx

        Aucune valeur n'est configurée sous `HKLM\SOFTWARE\FSLogix\Profiles`. Un volume Azure NetApp Files, `\\anf-prose.proseware.com\odfc`, est disponible dans la même région.

        Vous devez faire en sorte que les conteneurs ODFC restent disponibles si l'un ou l'autre des services de stockage tombe en panne. La solution tierce doit continuer à gérer le reste du profil.

        Quelles sont les deux actions que vous devez effectuer ? Chaque bonne réponse présente une partie de la solution.

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 2
      options:
        - id: a
          text:
            en: "Under the ODFC key, create `CCDLocations` that lists the Azure Files share and the Azure NetApp Files volume as `smb` providers."
            fr: "Sous la clé ODFC, créer `CCDLocations` qui liste le partage Azure Files et le volume Azure NetApp Files comme fournisseurs `smb`."
        - id: b
          text:
            en: "Under the ODFC key, delete the `VHDLocations` value that points to the Azure Files share."
            fr: "Sous la clé ODFC, supprimer la valeur `VHDLocations` qui pointe vers le partage Azure Files."
        - id: c
          text:
            en: "Under the Profiles key, create `CCDLocations` that lists the Azure Files share and the Azure NetApp Files volume as `smb` providers."
            fr: "Sous la clé Profiles, créer `CCDLocations` qui liste le partage Azure Files et le volume Azure NetApp Files comme fournisseurs `smb`."
        - id: d
          text:
            en: "Under the ODFC key, add the Azure NetApp Files volume as the second entry of the `VHDLocations` value."
            fr: "Sous la clé ODFC, ajouter le volume Azure NetApp Files comme deuxième entrée de la valeur `VHDLocations`."
        - id: e
          text:
            en: "Under the Profiles key, set `Enabled` to 1 so that the Cloud Cache service can start for the ODFC container."
            fr: "Sous la clé Profiles, définir `Enabled` sur 1 pour que le service Cloud Cache puisse démarrer pour le conteneur ODFC."
    answer: { optionIds: [a, b] }
    explanation:
      correct:
        en: |
          Cloud Cache works for ODFC containers as well as profile containers: its settings go in the key of the container they protect, here `HKLM\SOFTWARE\Policies\FSLogix\ODFC`. `CCDLocations` replaces `VHDLocations`, and the two must never be present in the same key, so you create `CCDLocations` with both SMB providers and delete `VHDLocations`.
        fr: |
          Cloud Cache fonctionne pour les conteneurs ODFC comme pour les conteneurs de profil : ses paramètres se placent dans la clé du conteneur qu'ils protègent, ici `HKLM\SOFTWARE\Policies\FSLogix\ODFC`. `CCDLocations` remplace `VHDLocations`, et les deux ne doivent jamais être présents dans la même clé : vous créez donc `CCDLocations` avec les deux fournisseurs SMB et supprimez `VHDLocations`.
      options:
        c: { en: "The Profiles key configures the profile container, which isn't used here; Cloud Cache there wouldn't protect the ODFC container.", fr: "La clé Profiles configure le conteneur de profil, qui n'est pas utilisé ici ; Cloud Cache à cet endroit ne protégerait pas le conteneur ODFC." }
        d: { en: "A second VHDLocations entry isn't resiliency: FSLogix uses the first reachable location and can create a new, empty container in the other one.", fr: "Une deuxième entrée VHDLocations n'est pas de la résilience : FSLogix utilise le premier emplacement accessible et peut créer un nouveau conteneur vide dans l'autre." }
        e: { en: "Enabling the profile container would make FSLogix take over the whole profile from the third-party solution; Cloud Cache doesn't need it.", fr: "Activer le conteneur de profil ferait prendre en charge tout le profil par FSLogix à la place de la solution tierce ; Cloud Cache n'en a pas besoin." }
    references:
      - title: Configuration Settings
        url: https://learn.microsoft.com/en-us/fslogix/reference-configuration-settings
      - title: Cloud Cache Overview
        url: https://learn.microsoft.com/en-us/fslogix/concepts-fslogix-cloud-cache

  # ------------------------------------------------------------------ 9
  - id: az140-qz-31-09
    objective: "3.1.4"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        The session hosts of a pooled host pool named **HP-Claims** use FSLogix profile containers with Cloud Cache and two SMB storage providers. The Cloud Cache settings are the following:

        | Setting | Value |
        | --- | --- |
        | `HealthyProvidersRequiredForRegister` | Not configured |
        | `HealthyProvidersRequiredForUnregister` | Not configured |
        | `CcdUnregisterTimeout` | 900 |
        | `ClearCacheOnLogoff` | 1 |
        | `ClearCacheOnForcedUnregister` | Not configured |

        During a storage incident, both providers are unavailable for two hours.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Les hôtes de session d'un pool d'hôtes regroupé nommé **HP-Claims** utilisent des conteneurs de profils FSLogix avec Cloud Cache et deux fournisseurs de stockage SMB. Les paramètres de Cloud Cache sont les suivants :

        | Paramètre | Valeur |
        | --- | --- |
        | `HealthyProvidersRequiredForRegister` | Non configuré |
        | `HealthyProvidersRequiredForUnregister` | Non configuré |
        | `CcdUnregisterTimeout` | 900 |
        | `ClearCacheOnLogoff` | 1 |
        | `ClearCacheOnForcedUnregister` | Non configuré |

        Pendant un incident de stockage, les deux fournisseurs sont indisponibles pendant deux heures.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text: { en: "A user who signs in during the incident can open a session.", fr: "Un utilisateur qui se connecte pendant l'incident peut ouvrir une session." }
        - id: s2
          text: { en: "A user who signs out during the incident is signed out after 15 minutes, even though no provider received the changes of the session.", fr: "Un utilisateur qui se déconnecte pendant l'incident est déconnecté au bout de 15 minutes, même si aucun fournisseur n'a reçu les modifications de la session." }
        - id: s3
          text: { en: "When a sign-out ends after this 15-minute wait, the local cache of the user is deleted because ClearCacheOnLogoff is set to 1.", fr: "Quand une déconnexion se termine après cette attente de 15 minutes, le cache local de l'utilisateur est supprimé car ClearCacheOnLogoff est défini sur 1." }
    answer:
      values: { s1: true, s2: true, s3: false }
    explanation:
      correct:
        en: |
          `HealthyProvidersRequiredForRegister` defaults to 0, so users can always sign in, even with no healthy provider. At sign-out, fewer providers than `HealthyProvidersRequiredForUnregister` (default 1) are healthy, so the sign-out is held for `CcdUnregisterTimeout`, 900 seconds, and then proceeds without a flush. When the sign-out is forced this way, the local cache is kept even if `ClearCacheOnLogoff` is set, so that the data can be recovered; only `ClearCacheOnForcedUnregister` = 1 would delete it.
        fr: |
          `HealthyProvidersRequiredForRegister` vaut 0 par défaut : les utilisateurs peuvent toujours se connecter, même sans fournisseur sain. À la déconnexion, moins de fournisseurs que `HealthyProvidersRequiredForUnregister` (1 par défaut) sont sains : la déconnexion est retenue pendant `CcdUnregisterTimeout`, soit 900 secondes, puis se poursuit sans écriture vers les fournisseurs. Quand la déconnexion est ainsi forcée, le cache local est conservé même si `ClearCacheOnLogoff` est défini, pour que les données puissent être récupérées ; seul `ClearCacheOnForcedUnregister` = 1 le supprimerait.
      options:
        s3: { en: "After a forced unregister, the local cache isn't deleted even with ClearCacheOnLogoff = 1, unless ClearCacheOnForcedUnregister is set to 1.", fr: "Après une désinscription forcée, le cache local n'est pas supprimé, même avec ClearCacheOnLogoff = 1, sauf si ClearCacheOnForcedUnregister est défini sur 1." }
    references:
      - title: Configuration Settings
        url: https://learn.microsoft.com/en-us/fslogix/reference-configuration-settings
      - title: Cloud Cache Overview
        url: https://learn.microsoft.com/en-us/fslogix/concepts-fslogix-cloud-cache

  # ------------------------------------------------------------------ 10
  - id: az140-qz-31-10
    objective: "3.1.5"
    difficulty: 3
    status: draft
    type: dragdrop
    stem:
      en: |
        An FSLogix Rule Set named **HideTrader** contains hiding rules for an application named **Trader**, installed on the session hosts of a pooled host pool. The session hosts use AD DS accounts that are synchronized to Microsoft Entra ID and can reach a domain controller.

        You need to configure the assignments of HideTrader to meet the following requirements:

        - Trader must be hidden from all users except the members of the group **CONTOSO\Markets**.
        - Members of CONTOSO\Markets who are also members of the group **CONTOSO\Interns** must not see Trader.

        How should you configure the assignment list? To answer, drag the appropriate assignments to the correct positions. Each assignment may be used once or not at all.

        NOTE: Each correct selection is worth one point.
      fr: |
        Un Rule Set FSLogix nommé **HideTrader** contient des règles de masquage pour une application nommée **Trader**, installée sur les hôtes de session d'un pool d'hôtes regroupé. Les hôtes de session utilisent des comptes AD DS synchronisés avec Microsoft Entra ID et peuvent joindre un contrôleur de domaine.

        Vous devez configurer les attributions de HideTrader pour répondre aux exigences suivantes :

        - Trader doit être masquée à tous les utilisateurs, sauf aux membres du groupe **CONTOSO\Markets**.
        - Les membres de CONTOSO\Markets qui sont aussi membres du groupe **CONTOSO\Interns** ne doivent pas voir Trader.

        Comment devez-vous configurer la liste des attributions ? Pour répondre, faites glisser les attributions appropriées vers les positions correctes. Chaque attribution peut être utilisée une fois ou pas du tout.

        Remarque : chaque sélection correcte vaut un point.
    body:
      reuse: false
      items:
        - { id: eyes, text: "Everyone (Applies: Yes)" }
        - { id: eno, text: "Everyone (Applies: No)" }
        - { id: myes, text: "CONTOSO\\Markets (Applies: Yes)" }
        - { id: mno, text: "CONTOSO\\Markets (Applies: No)" }
        - { id: iyes, text: "CONTOSO\\Interns (Applies: Yes)" }
        - { id: ino, text: "CONTOSO\\Interns (Applies: No)" }
      targets:
        - { id: t1, text: { en: "Position 1 (top of the list)", fr: "Position 1 (haut de la liste)" } }
        - { id: t2, text: { en: "Position 2", fr: "Position 2" } }
        - { id: t3, text: { en: "Position 3 (bottom of the list)", fr: "Position 3 (bas de la liste)" } }
    answer:
      mapping: { t1: eyes, t2: mno, t3: iyes }
    explanation:
      correct:
        en: |
          Assignments are processed from top to bottom, and a later matching entry overrides an earlier one. Everyone with Applies: Yes at the top hides Trader from all users; Markets with Applies: No below it shows Trader again to its members; Interns with Applies: Yes at the bottom hides it again from interns, including those in Markets.
        fr: |
          Les attributions sont traitées de haut en bas, et une entrée correspondante plus basse remplace une entrée plus haute. Everyone avec Applies: Yes en haut masque Trader à tous les utilisateurs ; Markets avec Applies: No en dessous affiche de nouveau Trader à ses membres ; Interns avec Applies: Yes en bas la masque de nouveau aux stagiaires, y compris ceux de Markets.
      options:
        eno: { en: "Everyone with Applies: No would leave Trader visible to every user who matches no later entry, including non-members of Markets.", fr: "Everyone avec Applies: No laisserait Trader visible pour tout utilisateur qui ne correspond à aucune entrée suivante, y compris les non-membres de Markets." }
        myes: { en: "Markets with Applies: Yes would hide Trader from the only group that must see it.", fr: "Markets avec Applies: Yes masquerait Trader au seul groupe qui doit la voir." }
        ino: { en: "Interns with Applies: No would show Trader to all interns, including those outside Markets.", fr: "Interns avec Applies: No afficherait Trader à tous les stagiaires, y compris ceux hors de Markets." }
    references:
      - title: FSLogix Apps RuleEditor and Rule Sets
        url: https://learn.microsoft.com/en-us/fslogix/concepts-fslogix-apps-rule-editor-rule-sets
