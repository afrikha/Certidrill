chapter: 34-app-delivery
questions:
  # ------------------------------------------------------------------ 1
  - id: az140-qz-34-01
    objective: "3.3.2"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Woodgrove Bank has an Azure Virtual Desktop **personal** host pool named **hp-dev** for its developers.

        Which application group types can you create for hp-dev?
      fr: |
        Woodgrove Bank dispose d'un pool d'hôtes Azure Virtual Desktop **personnel** nommé **hp-dev** pour ses développeurs.

        Quels types de groupes d'applications pouvez-vous créer pour hp-dev ?
    body:
      options:
        - { id: a, text: { en: "Desktop only", fr: "Bureau (Desktop) uniquement" } }
        - { id: b, text: { en: "RemoteApp only", fr: "RemoteApp uniquement" } }
        - { id: c, text: { en: "Desktop and RemoteApp", fr: "Bureau (Desktop) et RemoteApp" } }
        - { id: d, text: { en: "Desktop, and RemoteApp once the preferred application group type is RemoteApp", fr: "Bureau (Desktop), et RemoteApp une fois le type de groupe d'applications préféré réglé sur RemoteApp" } }
    answer: { optionId: a }
    explanation:
      correct:
        en: |
          Desktop application groups are available for pooled and personal host pools, while RemoteApp application groups are available for pooled host pools only. A personal host pool such as hp-dev therefore publishes a full desktop through a desktop application group.
        fr: |
          Les groupes d'applications de bureau sont disponibles pour les pools d'hôtes regroupés et personnels, alors que les groupes d'applications RemoteApp ne sont disponibles que pour les pools d'hôtes regroupés. Un pool d'hôtes personnel comme hp-dev publie donc un bureau complet par un groupe d'applications de bureau.
      options:
        b: { en: "RemoteApp application groups are the type that personal host pools don't support; the desktop type is the one they support.", fr: "Les groupes d'applications RemoteApp sont justement le type que les pools d'hôtes personnels ne prennent pas en charge ; c'est le type Bureau qu'ils prennent en charge." }
        c: { en: "Both types can coexist only in a pooled host pool; a personal host pool supports desktop application groups only.", fr: "Les deux types ne peuvent coexister que dans un pool d'hôtes regroupé ; un pool d'hôtes personnel ne prend en charge que les groupes d'applications de bureau." }
        d: { en: "The preferred application group type is a setting of pooled host pools; it decides what a user assigned to both types sees and doesn't make RemoteApp available.", fr: "Le type de groupe d'applications préféré est un paramètre des pools d'hôtes regroupés ; il décide de ce que voit un utilisateur affecté aux deux types et ne rend pas RemoteApp disponible." }
    references:
      - title: Azure Virtual Desktop terminology
        url: https://learn.microsoft.com/en-us/azure/virtual-desktop/terminology

  # ------------------------------------------------------------------ 2
  - id: az140-qz-34-02
    objective: "3.3.10"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Tailspin Toys packages a line-of-business application as MSIX for App attach. The code signing certificate issued by the company's certification authority expires in six months.

        The package must remain usable on the session hosts after the certificate expires, without being signed again. What should you do?
      fr: |
        Tailspin Toys empaquette une application métier en MSIX pour App attach. Le certificat de signature de code délivré par l'autorité de certification de l'entreprise expire dans six mois.

        Le package doit rester utilisable sur les hôtes de session après l'expiration du certificat, sans être signé à nouveau. Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Sign the package with a self-signed certificate that is valid for 10 years.", fr: "Signer le package avec un certificat auto-signé valide 10 ans." } }
        - { id: b, text: { en: "Expand the package into a CIM disk image before you sign it.", fr: "Développer le package dans une image disque CIM avant de le signer." } }
        - { id: c, text: { en: "Add a timestamp to the signature when you sign the package.", fr: "Ajouter un horodatage à la signature lors de la signature du package." } }
        - { id: d, text: { en: "Set the registration type of the package to Log on blocking.", fr: "Régler le type d'inscription du package sur Log on blocking." } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          A timestamped signature proves that the package was signed while the certificate was valid, so the package stays valid after the certificate expires. Microsoft recommends timestamping App attach packages for this reason.
        fr: |
          Une signature horodatée prouve que le package a été signé pendant la validité du certificat : le package reste donc valide après l'expiration du certificat. Microsoft recommande d'horodater les packages App attach pour cette raison.
      options:
        a: { en: "Self-signed certificates are meant for testing only, and they must be trusted on every session host; a long validity doesn't replace a timestamp.", fr: "Les certificats auto-signés sont réservés aux tests et doivent être approuvés sur chaque hôte de session ; une longue validité ne remplace pas un horodatage." }
        b: { en: "The package is signed first and then expanded into a disk image; reversing the order doesn't make the signature outlive the certificate.", fr: "Le package est d'abord signé, puis développé dans une image disque ; inverser l'ordre ne prolonge pas la signature au-delà du certificat." }
        d: { en: "The registration type only decides when the application is registered for the user; it has no effect on the validity of the signature.", fr: "Le type d'inscription décide seulement du moment où l'application est inscrite pour l'utilisateur ; il n'a aucun effet sur la validité de la signature." }
    references:
      - title: App Attach in Azure Virtual Desktop
        url: https://learn.microsoft.com/en-us/azure/virtual-desktop/app-attach-overview

  # ------------------------------------------------------------------ 3
  - id: az140-qz-34-03
    objective: "3.3.4"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Northwind Traders has an Azure Virtual Desktop pooled host pool named **hp-ops**. An autoscale scaling plan deallocates all the session hosts of hp-ops every evening. You create a RemoteApp application group named **ag-ops** for hp-ops at 22:00.

        When you open **Applications > + Add** in ag-ops and select the **Start menu** source, you can't select any application.

        What should you do first?
      fr: |
        Northwind Traders dispose d'un pool d'hôtes Azure Virtual Desktop regroupé nommé **hp-ops**. Un plan de mise à l'échelle automatique libère tous les hôtes de session de hp-ops chaque soir. Vous créez un groupe d'applications RemoteApp nommé **ag-ops** pour hp-ops à 22 h 00.

        Quand vous ouvrez **Applications > + Ajouter** dans ag-ops et que vous sélectionnez la source **Menu Démarrer**, vous ne pouvez sélectionner aucune application.

        Que devez-vous faire en premier ?
    body:
      options:
        - { id: a, text: { en: "Register ag-ops to a workspace.", fr: "Inscrire ag-ops dans un espace de travail." } }
        - { id: b, text: { en: "Start at least one session host of hp-ops.", fr: "Démarrer au moins un hôte de session de hp-ops." } }
        - { id: c, text: { en: "Set the preferred application group type of hp-ops to RemoteApp.", fr: "Régler le type de groupe d'applications préféré de hp-ops sur RemoteApp." } }
        - { id: d, text: { en: "Assign yourself the Desktop Virtualization User role on ag-ops.", fr: "Vous attribuer le rôle Desktop Virtualization User sur ag-ops." } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          Publishing applications requires at least one powered-on session host in the host pool of the application group: the Start menu list is read from the session hosts. With every host deallocated, no application can be selected, so start a session host, then add the applications.
        fr: |
          La publication d'applications exige au moins un hôte de session démarré dans le pool d'hôtes du groupe d'applications : la liste du menu Démarrer est lue sur les hôtes de session. Tous les hôtes étant libérés, aucune application ne peut être sélectionnée ; démarrez donc un hôte de session, puis ajoutez les applications.
      options:
        a: { en: "Workspace registration makes the published applications visible to users; it doesn't populate the list of applications that you can publish.", fr: "L'inscription dans un espace de travail rend les applications publiées visibles des utilisateurs ; elle ne remplit pas la liste des applications à publier." }
        c: { en: "The preferred application group type decides what users assigned to both group types see; it doesn't affect which applications an administrator can add.", fr: "Le type de groupe d'applications préféré décide de ce que voient les utilisateurs affectés aux deux types de groupes ; il n'influe pas sur les applications qu'un administrateur peut ajouter." }
        d: { en: "Desktop Virtualization User lets users connect to published resources; publishing applications is an administrative task that needs a contributor-type role.", fr: "Desktop Virtualization User permet aux utilisateurs de se connecter aux ressources publiées ; publier des applications est une tâche d'administration qui exige un rôle de type contributeur." }
    references:
      - title: Publish applications with RemoteApp in Azure Virtual Desktop
        url: https://learn.microsoft.com/en-us/azure/virtual-desktop/publish-applications

  # ------------------------------------------------------------------ 4
  - id: az140-qz-34-04
    objective: "3.3.9"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Litware has an Azure Virtual Desktop pooled host pool named **hp-eng**. You add six App attach packages, stored as CIM disk images, assign them to hp-eng and to the engineering group, and set their registration type to **Log on blocking**.

        Engineers now report that signing in takes much longer than before. They must keep getting all six applications.

        You need to reduce the sign-in time. What should you do?
      fr: |
        Litware dispose d'un pool d'hôtes Azure Virtual Desktop regroupé nommé **hp-eng**. Vous ajoutez six packages App attach, stockés en images disque CIM, vous les affectez à hp-eng et au groupe des ingénieurs, et vous réglez leur type d'inscription sur **Log on blocking**.

        Les ingénieurs signalent désormais que la connexion prend beaucoup plus de temps qu'avant. Ils doivent continuer à recevoir les six applications.

        Vous devez réduire la durée de connexion. Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Set the state of the six packages to Inactive.", fr: "Régler l'état des six packages sur Inactive." } }
        - { id: b, text: { en: "Re-create the six disk images in the VHDX format.", fr: "Recréer les six images disque au format VHDX." } }
        - { id: c, text: { en: "Set the registration type of the six packages to On-demand.", fr: "Régler le type d'inscription des six packages sur On-demand." } }
        - { id: d, text: { en: "Move the six disk images to the FSLogix profile share.", fr: "Déplacer les six images disque vers le partage des profils FSLogix." } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          With Log on blocking, every assigned application is fully registered during sign-in, which lengthens it. On-demand, the default and recommended type, registers the applications partially at sign-in and completes the registration when the user starts the application, so sign-in time isn't affected.
        fr: |
          Avec Log on blocking, chaque application affectée est entièrement inscrite pendant la connexion, ce qui l'allonge. On-demand, le type par défaut et recommandé, inscrit partiellement les applications à la connexion et termine l'inscription quand l'utilisateur démarre l'application : la durée de connexion n'est pas affectée.
      options:
        a: { en: "Inactive packages are ignored at sign-in: sign-in gets faster, but the engineers lose the six applications.", fr: "Les packages inactifs sont ignorés à la connexion : la connexion devient plus rapide, mais les ingénieurs perdent les six applications." }
        b: { en: "CIM images mount faster and use less CPU and memory than VHDX images; switching to VHDX would make sign-ins slower, not faster.", fr: "Les images CIM se montent plus vite et consomment moins de processeur et de mémoire que les images VHDX ; passer en VHDX ralentirait les connexions." }
        d: { en: "Microsoft recommends not sharing the App attach share with FSLogix profile containers; moving the images there adds load without changing the registration.", fr: "Microsoft recommande de ne pas partager le partage App attach avec les conteneurs de profils FSLogix ; y déplacer les images ajoute de la charge sans changer l'inscription." }
    references:
      - title: App Attach in Azure Virtual Desktop
        url: https://learn.microsoft.com/en-us/azure/virtual-desktop/app-attach-overview

  # ------------------------------------------------------------------ 5
  - id: az140-qz-34-05
    objective: "3.3.4"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Proseware deploys Azure Virtual Desktop with a pipeline that runs Azure CLI commands. The pipeline creates a host pool named **hp-legal**, a RemoteApp application group named **ag-legal** and a workspace.

        You need to extend the pipeline so that it publishes three applications that are installed on the session hosts in ag-legal.

        What should you add to the pipeline?
      fr: |
        Proseware déploie Azure Virtual Desktop avec un pipeline qui exécute des commandes Azure CLI. Le pipeline crée un pool d'hôtes nommé **hp-legal**, un groupe d'applications RemoteApp nommé **ag-legal** et un espace de travail.

        Vous devez étendre le pipeline pour qu'il publie dans ag-legal trois applications installées sur les hôtes de session.

        Que devez-vous ajouter au pipeline ?
    body:
      options:
        - { id: a, text: { en: "A step that runs `az desktopvirtualization applicationgroup update` on ag-legal", fr: "Une étape qui exécute `az desktopvirtualization applicationgroup update` sur ag-legal" } }
        - { id: b, text: { en: "A step that runs `az desktopvirtualization workspace update` on the workspace", fr: "Une étape qui exécute `az desktopvirtualization workspace update` sur l'espace de travail" } }
        - { id: c, text: { en: "A step that runs `az vm run-command invoke` on each session host", fr: "Une étape qui exécute `az vm run-command invoke` sur chaque hôte de session" } }
        - { id: d, text: { en: "A step that runs the `New-AzWvdApplication` cmdlet of Azure PowerShell", fr: "Une étape qui exécute la cmdlet `New-AzWvdApplication` d'Azure PowerShell" } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          Applications can't be published with Azure CLI: Microsoft documents the Azure portal and Azure PowerShell for this task. A pipeline step that runs `New-AzWvdApplication` adds each application to ag-legal, from its file path or its Start menu alias.
        fr: |
          Les applications ne peuvent pas être publiées avec Azure CLI : Microsoft documente le portail Azure et Azure PowerShell pour cette tâche. Une étape du pipeline qui exécute `New-AzWvdApplication` ajoute chaque application à ag-legal, à partir de son chemin d'accès ou de son alias du menu Démarrer.
      options:
        a: { en: "This command changes the properties of the application group itself (description, friendly name, tags); it doesn't publish applications in it.", fr: "Cette commande modifie les propriétés du groupe d'applications lui-même (description, nom convivial, étiquettes) ; elle n'y publie pas d'applications." }
        b: { en: "Updating the workspace changes which application groups are registered to it; the applications must still be published in ag-legal.", fr: "La mise à jour de l'espace de travail change les groupes d'applications qui y sont inscrits ; les applications doivent toujours être publiées dans ag-legal." }
        c: { en: "Run commands execute scripts inside the virtual machines; the applications are already installed, and publishing is done on the application group.", fr: "Les commandes d'exécution lancent des scripts dans les machines virtuelles ; les applications sont déjà installées, et la publication se fait sur le groupe d'applications." }
    references:
      - title: Publish applications with RemoteApp in Azure Virtual Desktop
        url: https://learn.microsoft.com/en-us/azure/virtual-desktop/publish-applications
      - title: New-AzWvdApplication
        url: https://learn.microsoft.com/en-us/powershell/module/az.desktopvirtualization/new-azwvdapplication

  # ------------------------------------------------------------------ 6
  - id: az140-qz-34-06
    objective: "3.3.1"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Fabrikam has an Azure Virtual Desktop pooled host pool named **hp-corp**. The session hosts run Windows 11 Enterprise multi-session and are joined to a **Microsoft Entra Domain Services** managed domain. Users work all day in full desktop sessions published by the desktop application group of hp-corp.

        The finance department uses an application named **App1** and the engineering department uses an application named **App2**. Both applications are available as MSIX packages and as MSI installers. You need to meet the following requirements:

        - Use a single image for all the session hosts.
        - Users of the other departments must not see or start App1 and App2, for licensing reasons.

        What should you use?
      fr: |
        Fabrikam dispose d'un pool d'hôtes Azure Virtual Desktop regroupé nommé **hp-corp**. Les hôtes de session exécutent Windows 11 Entreprise multisession et sont joints à un domaine managé **Microsoft Entra Domain Services**. Les utilisateurs travaillent toute la journée dans des sessions de bureau complet publiées par le groupe d'applications de bureau de hp-corp.

        Le service financier utilise une application nommée **App1** et le service d'ingénierie une application nommée **App2**. Les deux applications existent en packages MSIX et en programmes d'installation MSI. Vous devez répondre aux exigences suivantes :

        - Utiliser une seule image pour tous les hôtes de session.
        - Les utilisateurs des autres services ne doivent ni voir ni démarrer App1 et App2, pour des raisons de licence.

        Que devez-vous utiliser ?
    body:
      options:
        - { id: a, text: { en: "App attach, with each package assigned to hp-corp and to the group of its department", fr: "App attach, avec chaque package affecté à hp-corp et au groupe de son service" } }
        - { id: b, text: { en: "Intune Win32 apps with the Available intent, each assigned to the group of its department", fr: "Des applications Win32 Intune avec l'intention Disponible, chacune affectée au groupe de son service" } }
        - { id: c, text: { en: "Both applications installed in the image, with FSLogix application masking rules for each department", fr: "Les deux applications installées dans l'image, avec des règles de masquage d'applications FSLogix pour chaque service" } }
        - { id: d, text: { en: "Both applications installed in the image, with one RemoteApp application group for each department", fr: "Les deux applications installées dans l'image, avec un groupe d'applications RemoteApp pour chaque service" } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          App attach would be the usual answer, but it supports session hosts joined to Microsoft Entra ID or AD DS, not to Microsoft Entra Domain Services. Installing both applications in the single image and hiding each one with FSLogix application masking rule sets assigned by group keeps one image and prevents the other departments from seeing or starting the applications.
        fr: |
          App attach serait la réponse habituelle, mais il prend en charge les hôtes de session joints à Microsoft Entra ID ou à AD DS, pas à Microsoft Entra Domain Services. Installer les deux applications dans l'image unique et masquer chacune avec des ensembles de règles de masquage d'applications FSLogix affectés par groupe conserve une seule image et empêche les autres services de voir ou de démarrer les applications.
      options:
        a: { en: "Microsoft Entra Domain Services isn't a supported identity provider for App attach, so the packages can't be delivered to these session hosts.", fr: "Microsoft Entra Domain Services n'est pas un fournisseur d'identité pris en charge par App attach : les packages ne peuvent pas être distribués sur ces hôtes de session." }
        b: { en: "On Windows Enterprise multi-session, Intune installs applications per device in the system context with the Required or Uninstall intent only; the Available intent isn't supported.", fr: "Sur Windows Entreprise multisession, Intune installe les applications par appareil dans le contexte système avec l'intention Obligatoire ou Désinstaller uniquement ; l'intention Disponible n'est pas prise en charge." }
        d: { en: "Users work in full desktops, where every application installed in the image stays visible; RemoteApp groups don't hide applications inside a desktop session.", fr: "Les utilisateurs travaillent dans des bureaux complets, où chaque application installée dans l'image reste visible ; les groupes RemoteApp ne masquent pas d'applications dans une session de bureau." }
    references:
      - title: App Attach in Azure Virtual Desktop
        url: https://learn.microsoft.com/en-us/azure/virtual-desktop/app-attach-overview
      - title: Create and Implement Rule Sets (Application Masking)
        url: https://learn.microsoft.com/en-us/fslogix/tutorial-application-rule-sets

  # ------------------------------------------------------------------ 7
  - id: az140-qz-34-07
    objective: "3.3.10"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        Adatum has two Azure Virtual Desktop pooled host pools: **hp-w10**, whose session hosts run Windows 10 Enterprise multi-session, and **hp-w11**, whose session hosts run Windows 11 Enterprise multi-session. You prepare App attach disk images on a packaging virtual machine that runs Windows 11 Enterprise.

        You have a signed MSIX package of an application named **App1**, and the signing certificate is trusted on all the session hosts. You need to deliver App1 to both host pools by using App attach.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Adatum dispose de deux pools d'hôtes Azure Virtual Desktop regroupés : **hp-w10**, dont les hôtes de session exécutent Windows 10 Entreprise multisession, et **hp-w11**, dont les hôtes de session exécutent Windows 11 Entreprise multisession. Vous préparez les images disque App attach sur une machine virtuelle d'empaquetage qui exécute Windows 11 Entreprise.

        Vous disposez d'un package MSIX signé d'une application nommée **App1**, et le certificat de signature est approuvé sur tous les hôtes de session. Vous devez distribuer App1 aux deux pools d'hôtes à l'aide d'App attach.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si elle est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - { id: s1, text: { en: "A CIM image of App1 created on the packaging virtual machine is the recommended image for the session hosts of hp-w10.", fr: "Une image CIM d'App1 créée sur la machine virtuelle d'empaquetage est l'image recommandée pour les hôtes de session de hp-w10." } }
        - { id: s2, text: { en: "For hp-w11, you copy to the file share the .cim file of App1 together with the other files that MSIXMGR creates in the same destination folder.", fr: "Pour hp-w11, vous copiez sur le partage de fichiers le fichier .cim d'App1 ainsi que les autres fichiers que MSIXMGR crée dans le même dossier de destination." } }
        - { id: s3, text: { en: "For hp-w10, you can run msixmgr.exe -Unpack with -fileType vhdx on the packaging virtual machine to create the disk image of App1.", fr: "Pour hp-w10, vous pouvez exécuter msixmgr.exe -Unpack avec -fileType vhdx sur la machine virtuelle d'empaquetage pour créer l'image disque d'App1." } }
    answer: { values: { s1: false, s2: true, s3: true } }
    explanation:
      correct:
        en: |
          No: CimFS is recommended only when the session hosts run Windows 11, and a CIM image must be generated on a Windows version lower than or equal to the one of the session hosts; a CIM built on Windows 11 may not work on Windows 10. Yes: a CIM image is made of several files (the .cim file plus objectid_ and region_ files), which is why each image gets its own folder and all its files are copied. Yes: VHDX is the format to use for the Windows 10 hosts, and MSIXMGR creates it from the same signed package with `-fileType vhdx`.
        fr: |
          Non : CimFS n'est recommandé que si les hôtes de session exécutent Windows 11, et une image CIM doit être générée sur une version de Windows inférieure ou égale à celle des hôtes de session ; une image CIM créée sous Windows 11 peut ne pas fonctionner sous Windows 10. Oui : une image CIM se compose de plusieurs fichiers (le fichier .cim plus des fichiers objectid_ et region_), c'est pourquoi chaque image a son propre dossier et tous ses fichiers sont copiés. Oui : VHDX est le format à utiliser pour les hôtes Windows 10, et MSIXMGR le crée à partir du même package signé avec `-fileType vhdx`.
    references:
      - title: Create an MSIX image to use with App Attach in Azure Virtual Desktop
        url: https://learn.microsoft.com/en-us/azure/virtual-desktop/app-attach-create-msix-image
      - title: App Attach in Azure Virtual Desktop
        url: https://learn.microsoft.com/en-us/azure/virtual-desktop/app-attach-overview

  # ------------------------------------------------------------------ 8
  - id: az140-qz-34-08
    objective: "3.3.9"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        Contoso has an App attach package named **Planner** that contains version 2.0 of an MSIX application. Planner is assigned to two pooled host pools named **hp-north** and **hp-south**, and to a group named **Planners**. The registration type is On-demand.

        A defect is found in version 2.0. You need to meet the following requirements:

        - Until a corrected image is available, Planner must no longer be added to user sessions at sign-in. The host pool and group assignments of Planner must be kept so that you can deliver the application again in a single change.
        - The Microsoft Store must not update the MSIX applications delivered by App attach on the session hosts.

        Which two actions should you perform? Each correct answer presents part of the solution.

        NOTE: Each correct selection is worth one point.
      fr: |
        Contoso dispose d'un package App attach nommé **Planner** qui contient la version 2.0 d'une application MSIX. Planner est affecté à deux pools d'hôtes regroupés nommés **hp-north** et **hp-south**, et à un groupe nommé **Planners**. Le type d'inscription est On-demand.

        Un défaut est découvert dans la version 2.0. Vous devez répondre aux exigences suivantes :

        - Tant qu'une image corrigée n'est pas disponible, Planner ne doit plus être ajouté aux sessions des utilisateurs à la connexion. Les affectations de pools d'hôtes et de groupe de Planner doivent être conservées pour que vous puissiez de nouveau distribuer l'application en une seule modification.
        - Le Microsoft Store ne doit pas mettre à jour les applications MSIX distribuées par App attach sur les hôtes de session.

        Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

        Remarque : chaque sélection correcte vaut un point.
    body:
      options:
        - { id: a, text: { en: "Set the state of Planner to Inactive.", fr: "Régler l'état de Planner sur Inactive." } }
        - { id: b, text: { en: "Remove hp-north and hp-south from the host pool assignments of Planner.", fr: "Retirer hp-north et hp-south des affectations de pools d'hôtes de Planner." } }
        - { id: c, text: { en: "Set the Health check status on failure of Planner to NeedsAssistance.", fr: "Régler l'état du contrôle d'intégrité en cas d'échec (Health check status on failure) de Planner sur NeedsAssistance." } }
        - { id: d, text: { en: "Set the AutoDownload DWORD value to 2 under HKLM\\Software\\Policies\\Microsoft\\WindowsStore on the session hosts.", fr: "Régler la valeur DWORD AutoDownload sur 2 sous HKLM\\Software\\Policies\\Microsoft\\WindowsStore sur les hôtes de session." } }
        - { id: e, text: { en: "Set the registration type of Planner to Log on blocking.", fr: "Régler le type d'inscription de Planner sur Log on blocking." } }
      choose: 2
    answer: { optionIds: [a, d] }
    explanation:
      correct:
        en: |
          An Inactive package is ignored at sign-in, but it keeps its host pool and user assignments: setting it back to Active delivers it again in one change. Setting AutoDownload to 2 under the WindowsStore policy key (by registry, Group Policy or Intune) turns off Microsoft Store automatic updates, so attached applications aren't updated outside your images.
        fr: |
          Un package inactif est ignoré à la connexion, mais il conserve ses affectations de pools d'hôtes et d'utilisateurs : le remettre sur Active le distribue de nouveau en une seule modification. Régler AutoDownload sur 2 sous la clé de stratégie WindowsStore (par registre, stratégie de groupe ou Intune) désactive les mises à jour automatiques du Microsoft Store : les applications attachées ne sont pas mises à jour en dehors de vos images.
      options:
        b: { en: "Removing the host pools stops the delivery, but it loses the assignments: delivering the application again needs both host pools to be assigned again.", fr: "Retirer les pools d'hôtes arrête la distribution, mais perd les affectations : redistribuer l'application exige de réaffecter les deux pools d'hôtes." }
        c: { en: "This setting only chooses the status reported for AppAttachHealthCheck when staging fails; the package is still delivered when staging succeeds.", fr: "Ce paramètre choisit seulement l'état signalé pour AppAttachHealthCheck quand la préparation échoue ; le package reste distribué quand la préparation réussit." }
        e: { en: "Log on blocking registers the application completely at sign-in: it changes when the application is registered, not whether it's delivered.", fr: "Log on blocking inscrit complètement l'application à la connexion : il change le moment de l'inscription, pas le fait que l'application soit distribuée." }
    references:
      - title: Add and manage App Attach applications in Azure Virtual Desktop
        url: https://learn.microsoft.com/en-us/azure/virtual-desktop/app-attach-setup
      - title: App Attach in Azure Virtual Desktop
        url: https://learn.microsoft.com/en-us/azure/virtual-desktop/app-attach-overview

  # ------------------------------------------------------------------ 9
  - id: az140-qz-34-09
    objective: "3.3.4"
    difficulty: 3
    status: draft
    type: dropdown
    stem:
      en: |
        Wingtip Toys has an Azure Virtual Desktop RemoteApp application group named **ag-docs** in a resource group named **rg-avd**. An application named **Contoso Docs** is installed on every session host and appears in their Start menu.

        You need to publish Contoso Docs in ag-docs by using its Start menu entry. The solution must meet the following requirements:

        - Users must be able to start Contoso Docs without any argument.
        - A line-of-business portal must also be able to start Contoso Docs with the path of a document as an argument.
        - No argument is defined when the application is published.

        How should you complete the Azure PowerShell script? Select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Wingtip Toys dispose d'un groupe d'applications RemoteApp Azure Virtual Desktop nommé **ag-docs** dans un groupe de ressources nommé **rg-avd**. Une application nommée **Contoso Docs** est installée sur chaque hôte de session et apparaît dans leur menu Démarrer.

        Vous devez publier Contoso Docs dans ag-docs à partir de son entrée du menu Démarrer. La solution doit répondre aux exigences suivantes :

        - Les utilisateurs doivent pouvoir démarrer Contoso Docs sans aucun argument.
        - Un portail métier doit aussi pouvoir démarrer Contoso Docs avec le chemin d'un document comme argument.
        - Aucun argument n'est défini lors de la publication de l'application.

        Comment devez-vous compléter le script Azure PowerShell ? Sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: code
      language: powershell
      template: |
        $item = [[find]] -ApplicationGroupName ag-docs -ResourceGroupName rg-avd |
          Where-Object { $_.Name -like '*Contoso Docs*' }

        New-AzWvdApplication -Name ContosoDocs -GroupName ag-docs -ResourceGroupName rg-avd `
          [[source]] $item.AppAlias -CommandLineSetting [[cmd]]
      slots:
        - id: find
          options:
            - { id: startmenu, text: Get-AzWvdStartMenuItem }
            - { id: getapp, text: Get-AzWvdApplication }
            - { id: getdesktop, text: Get-AzWvdDesktop }
            - { id: getsh, text: Get-AzWvdSessionHost }
        - id: source
          options:
            - { id: filepath, text: -FilePath }
            - { id: alias, text: -AppAlias }
            - { id: friendly, text: -FriendlyName }
            - { id: msixid, text: -MsixPackageApplicationId }
        - id: cmd
          options:
            - { id: require, text: Require }
            - { id: donot, text: DoNotAllow }
            - { id: allow, text: Allow }
    answer: { values: { find: startmenu, source: alias, cmd: allow } }
    explanation:
      correct:
        en: |
          `Get-AzWvdStartMenuItem` lists the Start menu entries found on the session hosts of the application group's host pool, and `-AppAlias` publishes the application from that entry. `CommandLineSetting` `Allow` means the application can optionally be started with command line arguments, which covers both a start without arguments and a start with a document path, with nothing defined at publishing time.
        fr: |
          `Get-AzWvdStartMenuItem` liste les entrées du menu Démarrer trouvées sur les hôtes de session du pool d'hôtes du groupe d'applications, et `-AppAlias` publie l'application à partir de cette entrée. `CommandLineSetting` `Allow` signifie que l'application peut éventuellement être démarrée avec des arguments de ligne de commande, ce qui couvre un démarrage sans argument et un démarrage avec le chemin d'un document, sans rien définir lors de la publication.
      options:
        require: { en: "Require forces the arguments defined at publishing time on every start, which contradicts both a start without arguments and no argument defined at publishing.", fr: "Require impose à chaque démarrage les arguments définis lors de la publication, ce qui contredit à la fois le démarrage sans argument et l'absence d'argument à la publication." }
        donot: { en: "DoNotAllow blocks all command line arguments, so the portal couldn't pass the document path.", fr: "DoNotAllow bloque tout argument de ligne de commande : le portail ne pourrait pas transmettre le chemin du document." }
        filepath: { en: "-FilePath publishes from the path of the executable, not from a Start menu alias returned by Get-AzWvdStartMenuItem.", fr: "-FilePath publie à partir du chemin de l'exécutable, pas à partir d'un alias du menu Démarrer renvoyé par Get-AzWvdStartMenuItem." }
        getapp: { en: "Get-AzWvdApplication lists the applications already published in the group, not the Start menu entries available on the session hosts.", fr: "Get-AzWvdApplication liste les applications déjà publiées dans le groupe, pas les entrées du menu Démarrer disponibles sur les hôtes de session." }
    references:
      - title: Applications - Create Or Update
        url: https://learn.microsoft.com/en-us/rest/api/desktopvirtualization/applications/create-or-update
      - title: Get-AzWvdStartMenuItem
        url: https://learn.microsoft.com/en-us/powershell/module/az.desktopvirtualization/get-azwvdstartmenuitem

  # ------------------------------------------------------------------ 10
  - id: az140-qz-34-10
    objective: "3.3.3"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Adatum has a resource group named **rg-avd** that contains Azure Virtual Desktop host pools, application groups and workspaces, and the session host virtual machines. A help desk group named **HD-Access** must handle the access requests of users.

        You need to meet the following requirements:

        - HD-Access can add and remove users and groups on the **Assignments** page of every application group in rg-avd.
        - HD-Access can't grant any other role in rg-avd, including to its own members.
        - HD-Access can't change the application groups, host pools or session hosts.
        - The solution follows the principle of least privilege.

        What should you do?
      fr: |
        Adatum dispose d'un groupe de ressources nommé **rg-avd** qui contient des pools d'hôtes, des groupes d'applications et des espaces de travail Azure Virtual Desktop, ainsi que les machines virtuelles des hôtes de session. Un groupe du support nommé **HD-Access** doit traiter les demandes d'accès des utilisateurs.

        Vous devez répondre aux exigences suivantes :

        - HD-Access peut ajouter et retirer des utilisateurs et des groupes dans la page **Affectations** de chaque groupe d'applications de rg-avd.
        - HD-Access ne peut attribuer aucun autre rôle dans rg-avd, y compris à ses propres membres.
        - HD-Access ne peut pas modifier les groupes d'applications, les pools d'hôtes ni les hôtes de session.
        - La solution respecte le principe du moindre privilège.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Assign User Access Administrator to HD-Access on each application group of rg-avd.", fr: "Attribuer User Access Administrator à HD-Access sur chaque groupe d'applications de rg-avd." } }
        - { id: b, text: { en: "Assign Desktop Virtualization Application Group Contributor to HD-Access on rg-avd.", fr: "Attribuer Desktop Virtualization Application Group Contributor à HD-Access sur rg-avd." } }
        - { id: c, text: { en: "Assign Role Based Access Control Administrator to HD-Access on rg-avd, with a condition that allows only the Desktop Virtualization User role.", fr: "Attribuer Role Based Access Control Administrator à HD-Access sur rg-avd, avec une condition qui n'autorise que le rôle Desktop Virtualization User." } }
        - { id: d, text: { en: "Assign Desktop Virtualization Contributor to HD-Access on rg-avd, with Role Based Access Control Administrator limited to Desktop Virtualization User.", fr: "Attribuer Desktop Virtualization Contributor à HD-Access sur rg-avd, avec Role Based Access Control Administrator limité à Desktop Virtualization User." } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          Assigning users to an application group creates Desktop Virtualization User role assignments, which needs `Microsoft.Authorization/roleAssignments/write`. Role Based Access Control Administrator provides this permission without the right to manage the Azure Virtual Desktop resources, and a condition that constrains roles to Desktop Virtualization User makes any other role assignment fail.
        fr: |
          Affecter des utilisateurs à un groupe d'applications crée des attributions du rôle Desktop Virtualization User, ce qui exige `Microsoft.Authorization/roleAssignments/write`. Role Based Access Control Administrator fournit cette autorisation sans le droit de gérer les ressources Azure Virtual Desktop, et une condition qui limite les rôles à Desktop Virtualization User fait échouer toute autre attribution de rôle.
      options:
        a: { en: "User Access Administrator includes the permission, but it can assign any role, including Owner, to any principal, members of HD-Access included.", fr: "User Access Administrator inclut l'autorisation, mais peut attribuer n'importe quel rôle, y compris Owner, à n'importe quel principal, membres de HD-Access compris." }
        b: { en: "Desktop Virtualization Application Group Contributor manages application groups but doesn't include roleAssignments/write, so it can't add users to the assignments.", fr: "Desktop Virtualization Application Group Contributor gère les groupes d'applications mais n'inclut pas roleAssignments/write : il ne peut pas ajouter d'utilisateurs aux affectations." }
        d: { en: "The constrained role would allow the assignments, but Desktop Virtualization Contributor lets HD-Access change host pools and application groups, which breaks a requirement.", fr: "Le rôle limité permettrait les affectations, mais Desktop Virtualization Contributor permet à HD-Access de modifier les pools d'hôtes et les groupes d'applications, ce qui enfreint une exigence." }
    references:
      - title: Delegate Azure access management to others
        url: https://learn.microsoft.com/en-us/azure/role-based-access-control/delegate-role-assignments-overview
      - title: Add and manage App Attach applications in Azure Virtual Desktop
        url: https://learn.microsoft.com/en-us/azure/virtual-desktop/app-attach-setup
