chapter: 21-identity
questions:
  # ------------------------------------------------------------------ 1
  - id: az140-qz-21-01
    objective: "2.1.4"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        You need to create the policies that require users to perform multifactor authentication when they connect to Azure Virtual Desktop. Your administrator account must follow the principle of least privilege.

        Which Microsoft Entra role should you use?
      fr: |
        Vous devez créer les stratégies qui exigent des utilisateurs une authentification multifacteur quand ils se connectent à Azure Virtual Desktop. Votre compte d'administrateur doit respecter le principe du moindre privilège.

        Quel rôle Microsoft Entra devez-vous utiliser ?
    body:
      options:
        - { id: a, text: Global Administrator }
        - { id: b, text: Cloud Application Administrator }
        - { id: c, text: Conditional Access Administrator }
        - { id: d, text: Authentication Administrator }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          Multifactor authentication for Azure Virtual Desktop is enforced with Conditional Access policies, which Microsoft documents that you create as at least a Conditional Access Administrator. This role manages Conditional Access policies without the other permissions of a tenant-wide administrator role.
        fr: |
          L'authentification multifacteur pour Azure Virtual Desktop s'impose par des stratégies d'accès conditionnel, que Microsoft recommande de créer avec au minimum le rôle Conditional Access Administrator. Ce rôle gère les stratégies d'accès conditionnel sans les autres autorisations d'un rôle d'administration de tout le locataire.
      options:
        a: { en: "Global Administrator can create the policies, but it grants every permission in the tenant: it breaks least privilege.", fr: "Global Administrator peut créer les stratégies, mais il accorde toutes les autorisations du locataire : il enfreint le moindre privilège." }
        b: { en: "Cloud Application Administrator manages app registrations and enterprise applications, for example the Windows Cloud Login settings of single sign-on; it doesn't manage Conditional Access policies.", fr: "Cloud Application Administrator gère les inscriptions d'applications et les applications d'entreprise, par exemple les paramètres Windows Cloud Login de l'authentification unique ; il ne gère pas les stratégies d'accès conditionnel." }
        d: { en: "Authentication Administrator manages the authentication methods of non-administrator users, such as resetting their MFA registration; it doesn't create Conditional Access policies.", fr: "Authentication Administrator gère les méthodes d'authentification des utilisateurs non administrateurs, par exemple la réinitialisation de leur inscription MFA ; il ne crée pas de stratégies d'accès conditionnel." }
    references:
      - title: Enforce Microsoft Entra multifactor authentication for Azure Virtual Desktop using Conditional Access - Azure
        url: https://learn.microsoft.com/en-us/azure/virtual-desktop/set-up-mfa

  # ------------------------------------------------------------------ 2
  - id: az140-qz-21-02
    objective: "2.1.1"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Contoso plans a host pool for consultants who will sign in with the Microsoft Entra accounts of their own organization, invited as external identities into the Contoso tenant. The session hosts will be Microsoft Entra joined, single sign-on will be enabled, and every image will have the latest cumulative updates.

        Which operating system can the session hosts run?
      fr: |
        Contoso prévoit un pool d'hôtes pour des consultants qui se connecteront avec les comptes Microsoft Entra de leur propre organisation, invités comme identités externes dans le locataire Contoso. Les hôtes de session seront joints à Microsoft Entra, l'authentification unique sera activée et chaque image aura les dernières mises à jour cumulatives.

        Quel système d'exploitation les hôtes de session peuvent-ils exécuter ?
    body:
      options:
        - { id: a, text: "Windows 10 Enterprise multi-session, version 22H2" }
        - { id: b, text: "Windows 11 Enterprise multi-session, version 23H2" }
        - { id: c, text: "Windows 11 Enterprise multi-session, version 24H2" }
        - { id: d, text: "Windows Server 2022 Datacenter" }
    answer: { optionId: c }
    shuffle: false
    explanation:
      correct:
        en: |
          External identities have stricter OS requirements than other Microsoft Entra joined session hosts: Windows 11 Enterprise single or multi-session version 24H2 or later with a recent cumulative update, or Windows Server 2025 with a recent cumulative update. The session hosts must also be Microsoft Entra joined and use single sign-on, as planned here.
        fr: |
          Les identités externes ont des exigences de système d'exploitation plus strictes que les autres hôtes de session joints à Microsoft Entra : Windows 11 Entreprise session unique ou multisession version 24H2 ou ultérieure avec une mise à jour cumulative récente, ou Windows Server 2025 avec une mise à jour cumulative récente. Les hôtes de session doivent aussi être joints à Microsoft Entra et utiliser l'authentification unique, comme prévu ici.
      options:
        a: { en: "Windows 10 can be Microsoft Entra joined for cloud-only or hybrid users, but it isn't supported for external identities.", fr: "Windows 10 peut être joint à Microsoft Entra pour des utilisateurs cloud ou hybrides, mais il n'est pas pris en charge pour les identités externes." }
        b: { en: "Version 23H2 is earlier than the minimum version 24H2 that external identities require.", fr: "La version 23H2 est antérieure à la version minimale 24H2 qu'exigent les identités externes." }
        d: { en: "Windows Server 2022 supports Microsoft Entra join for internal users; for external identities the supported server OS is Windows Server 2025.", fr: "Windows Server 2022 prend en charge la jonction à Microsoft Entra pour les utilisateurs internes ; pour les identités externes, le système d'exploitation serveur pris en charge est Windows Server 2025." }
    references:
      - title: Azure Virtual Desktop identities and authentication - Azure
        url: https://learn.microsoft.com/en-us/azure/virtual-desktop/authentication

  # ------------------------------------------------------------------ 3
  - id: az140-qz-21-03
    objective: "2.1.2"
    difficulty: 2
    status: draft
    type: yesno_statements
    stem:
      en: |
        Contoso has a host pool named **HP-Corp** whose session hosts are joined to the contoso.com AD DS domain. Employees are synchronized to Microsoft Entra ID and use file shares on on-premises servers. Contoso now hires contractors who exist only in Microsoft Entra ID.

        You plan to deploy Microsoft Entra joined session hosts in a new virtual network for the contractors and for some employees.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Contoso dispose d'un pool d'hôtes nommé **HP-Corp** dont les hôtes de session sont joints au domaine AD DS contoso.com. Les employés sont synchronisés avec Microsoft Entra ID et utilisent des partages de fichiers sur des serveurs locaux. Contoso embauche maintenant des prestataires qui n'existent que dans Microsoft Entra ID.

        Vous prévoyez de déployer des hôtes de session joints à Microsoft Entra dans un nouveau réseau virtuel, pour les prestataires et pour certains employés.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - { id: s1, text: { en: "You should add the Microsoft Entra joined session hosts to HP-Corp, so that employees and contractors share one host pool.", fr: "Vous devez ajouter les hôtes de session joints à Microsoft Entra à HP-Corp, afin qu'employés et prestataires partagent un seul pool d'hôtes." } }
        - { id: s2, text: { en: "The new virtual network doesn't need DNS servers that point to the contoso.com domain controllers for the Microsoft Entra joined session hosts to be deployed.", fr: "Le nouveau réseau virtuel n'a pas besoin de serveurs DNS pointant vers les contrôleurs de domaine contoso.com pour que les hôtes de session joints à Microsoft Entra soient déployés." } }
        - { id: s3, text: { en: "Employees who use the Microsoft Entra joined session hosts can open their on-premises file shares even if the new virtual network has no line of sight to the domain controllers.", fr: "Les employés qui utilisent les hôtes de session joints à Microsoft Entra peuvent ouvrir leurs partages de fichiers locaux même si le nouveau réseau virtuel n'a aucune visibilité directe sur les contrôleurs de domaine." } }
    answer:
      values: { s1: false, s2: true, s3: false }
    explanation:
      correct:
        en: |
          A host pool should only contain session hosts of the same join type, so the Microsoft Entra joined hosts go to a new host pool. Microsoft Entra join needs no domain controller, so the deployment doesn't depend on DNS servers pointing to AD DS. Access to on-premises resources from Microsoft Entra joined hosts still requires AD DS and line of sight to it.
        fr: |
          Un pool d'hôtes ne doit contenir que des hôtes de session du même type de jonction : les hôtes joints à Microsoft Entra vont donc dans un nouveau pool d'hôtes. La jonction à Microsoft Entra ne nécessite aucun contrôleur de domaine : le déploiement ne dépend pas de serveurs DNS pointant vers AD DS. L'accès aux ressources locales depuis des hôtes joints à Microsoft Entra exige toujours AD DS et une visibilité directe sur celui-ci.
      options:
        s1: { en: "Mixing AD DS joined and Microsoft Entra joined session hosts in one host pool isn't recommended: create a separate host pool.", fr: "Mélanger des hôtes de session joints à AD DS et joints à Microsoft Entra dans un même pool d'hôtes n'est pas recommandé : créez un pool d'hôtes distinct." }
        s3: { en: "Without line of sight to a domain controller, the session hosts can't get the Kerberos tickets that the on-premises file servers require.", fr: "Sans visibilité directe sur un contrôleur de domaine, les hôtes de session ne peuvent pas obtenir les tickets Kerberos qu'exigent les serveurs de fichiers locaux." }
    references:
      - title: Microsoft Entra joined session hosts in Azure Virtual Desktop - Azure Virtual Desktop
        url: https://learn.microsoft.com/en-us/azure/virtual-desktop/azure-ad-joined-session-hosts

  # ------------------------------------------------------------------ 4
  - id: az140-qz-21-04
    objective: "2.1.6"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Fabrikam has a host pool named **HP-Analytics** that doesn't use a session host configuration. Its session hosts are Microsoft Entra joined and are in a resource group named **RG-Analytics**. A group named **Analysts** is assigned to the desktop application group of HP-Analytics.

        On RG-Analytics, Analysts has both the Virtual Machine User Login role and the Virtual Machine Administrator Login role. Analysts can install software on the session hosts.

        Analysts must keep access to their desktops with standard user rights only. What should you do?
      fr: |
        Fabrikam dispose d'un pool d'hôtes nommé **HP-Analytics** qui n'utilise pas de configuration d'hôte de session. Ses hôtes de session sont joints à Microsoft Entra et se trouvent dans un groupe de ressources nommé **RG-Analytics**. Un groupe nommé **Analysts** est attribué au groupe d'applications de bureau de HP-Analytics.

        Sur RG-Analytics, Analysts dispose à la fois du rôle Virtual Machine User Login et du rôle Virtual Machine Administrator Login. Les membres d'Analysts peuvent installer des logiciels sur les hôtes de session.

        Les membres d'Analysts doivent conserver l'accès à leurs bureaux avec des droits d'utilisateur standard uniquement. Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Remove the Virtual Machine User Login role assignment of Analysts.", fr: "Supprimer l'attribution du rôle Virtual Machine User Login d'Analysts." } }
        - { id: b, text: { en: "Remove the Virtual Machine Administrator Login role assignment of Analysts.", fr: "Supprimer l'attribution du rôle Virtual Machine Administrator Login d'Analysts." } }
        - { id: c, text: { en: "Replace both role assignments of Analysts with the Reader role on RG-Analytics.", fr: "Remplacer les deux attributions de rôle d'Analysts par le rôle Reader sur RG-Analytics." } }
        - { id: d, text: { en: "Replace the Desktop Virtualization User assignment of Analysts with Desktop Virtualization Reader.", fr: "Remplacer l'attribution Desktop Virtualization User d'Analysts par Desktop Virtualization Reader." } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          On Microsoft Entra joined session hosts of a host pool without a session host configuration, Virtual Machine User Login lets users sign in as standard users and Virtual Machine Administrator Login makes them local administrators. Removing only the administrator assignment leaves Analysts with the sign-in right and the application group assignment they need.
        fr: |
          Sur les hôtes de session joints à Microsoft Entra d'un pool d'hôtes sans configuration d'hôte de session, Virtual Machine User Login permet aux utilisateurs de se connecter en tant qu'utilisateurs standard et Virtual Machine Administrator Login fait d'eux des administrateurs locaux. Supprimer uniquement l'attribution administrateur laisse à Analysts le droit de connexion et l'attribution au groupe d'applications dont ils ont besoin.
      options:
        a: { en: "Analysts would still have Virtual Machine Administrator Login, which also allows sign-in, so they would stay local administrators.", fr: "Analysts conserverait Virtual Machine Administrator Login, qui permet aussi de se connecter : ses membres resteraient administrateurs locaux." }
        c: { en: "Reader gives no sign-in right to the session hosts: Analysts would lose access to their desktops.", fr: "Reader ne donne aucun droit de connexion aux hôtes de session : Analysts perdrait l'accès à ses bureaux." }
        d: { en: "Desktop Virtualization Reader doesn't allow using the desktop, so Analysts would lose access, and the local administrator rights wouldn't change.", fr: "Desktop Virtualization Reader ne permet pas d'utiliser le bureau : Analysts perdrait l'accès, et les droits d'administrateur local ne changeraient pas." }
    references:
      - title: Microsoft Entra joined session hosts in Azure Virtual Desktop - Azure Virtual Desktop
        url: https://learn.microsoft.com/en-us/azure/virtual-desktop/azure-ad-joined-session-hosts

  # ------------------------------------------------------------------ 5
  - id: az140-qz-21-05
    objective: "2.1.3"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        At Litware, the members of a group named **Portal-Team** have the Desktop Virtualization Workspace Contributor role on a workspace named **WS-Main**. They can manage WS-Main and choose the application groups it publishes, but they can't see the applications that the application groups contain.

        You need Portal-Team to see these applications. The solution must follow the principle of least privilege.

        Which role should you assign to Portal-Team on the application groups?
      fr: |
        Chez Litware, les membres d'un groupe nommé **Portal-Team** disposent du rôle Desktop Virtualization Workspace Contributor sur un espace de travail nommé **WS-Main**. Ils peuvent gérer WS-Main et choisir les groupes d'applications qu'il publie, mais ils ne voient pas les applications que contiennent ces groupes d'applications.

        Vous devez permettre à Portal-Team de voir ces applications. La solution doit respecter le principe du moindre privilège.

        Quel rôle devez-vous attribuer à Portal-Team sur les groupes d'applications ?
    body:
      options:
        - { id: a, text: Desktop Virtualization Application Group Contributor }
        - { id: b, text: Desktop Virtualization User }
        - { id: c, text: Desktop Virtualization Host Pool Reader }
        - { id: d, text: Desktop Virtualization Application Group Reader }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          Desktop Virtualization Workspace Contributor manages workspaces only. To get information on the applications of the related application groups, Microsoft documents that it must be combined with Desktop Virtualization Application Group Reader, which views application groups without allowing any change.
        fr: |
          Desktop Virtualization Workspace Contributor ne gère que les espaces de travail. Pour obtenir les informations sur les applications des groupes d'applications associés, Microsoft indique qu'il faut l'associer à Desktop Virtualization Application Group Reader, qui permet de consulter les groupes d'applications sans autoriser aucune modification.
      options:
        a: { en: "Application Group Contributor would show the applications, but it also lets Portal-Team change the application groups: more than needed.", fr: "Application Group Contributor afficherait les applications, mais il permet aussi à Portal-Team de modifier les groupes d'applications : plus que nécessaire." }
        b: { en: "Desktop Virtualization User lets its holders use the desktop or apps of the application group; it isn't a management role for viewing its content in Azure.", fr: "Desktop Virtualization User permet à ses détenteurs d'utiliser le bureau ou les applications du groupe d'applications ; ce n'est pas un rôle de gestion pour consulter son contenu dans Azure." }
        c: { en: "Host Pool Reader views host pools, not application groups, and it isn't assigned on application groups.", fr: "Host Pool Reader permet de consulter les pools d'hôtes, pas les groupes d'applications, et il ne s'attribue pas sur les groupes d'applications." }
    references:
      - title: Built-in Azure RBAC roles Azure Virtual Desktop - Azure Virtual Desktop
        url: https://learn.microsoft.com/en-us/azure/virtual-desktop/rbac

  # ------------------------------------------------------------------ 6
  - id: az140-qz-21-06
    objective: "2.1.5"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Northwind Traders has a host pool named **HP-Office** whose session hosts are Microsoft Entra hybrid joined and run Windows 11 Enterprise multi-session with the latest updates. Microsoft Entra single sign-on is enabled. The custom RDP properties of HP-Office don't contain `redirectwebauthn`. Users sign in to Windows App with their password and Microsoft Authenticator.

        In their remote sessions, users must sign in to a Microsoft Entra protected web app by using the FIDO2 security key plugged into their local PC. When they try, the browser in the session finds the key, but Microsoft Entra ID refuses the sign-in.

        What should you do?
      fr: |
        Northwind Traders dispose d'un pool d'hôtes nommé **HP-Office** dont les hôtes de session sont joints à Microsoft Entra hybride et exécutent Windows 11 Entreprise multisession avec les dernières mises à jour. L'authentification unique Microsoft Entra est activée. Les propriétés RDP personnalisées de HP-Office ne contiennent pas `redirectwebauthn`. Les utilisateurs se connectent à Windows App avec leur mot de passe et Microsoft Authenticator.

        Dans leurs sessions distantes, les utilisateurs doivent se connecter à une application web protégée par Microsoft Entra à l'aide de la clé de sécurité FIDO2 branchée sur leur PC local. Quand ils essaient, le navigateur de la session trouve la clé, mais Microsoft Entra ID refuse la connexion.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Add `redirectwebauthn:i:1` to the custom RDP properties of HP-Office.", fr: "Ajouter `redirectwebauthn:i:1` aux propriétés RDP personnalisées de HP-Office." } }
        - { id: b, text: { en: "Add `redirectsmartcards:i:1` to the custom RDP properties of HP-Office.", fr: "Ajouter `redirectsmartcards:i:1` aux propriétés RDP personnalisées de HP-Office." } }
        - { id: c, text: { en: "Enable the FIDO2 security key authentication method for the users.", fr: "Activer la méthode d'authentification par clé de sécurité FIDO2 pour les utilisateurs." } }
        - { id: d, text: { en: "Deploy a KDC proxy and add `kdcproxyname` to the custom RDP properties of HP-Office.", fr: "Déployer un proxy KDC et ajouter `kdcproxyname` aux propriétés RDP personnalisées de HP-Office." } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          WebAuthn redirection is enabled by default on supported session host OS versions, which is why the browser in the session finds the local key. To use these keys with Microsoft Entra resources, the FIDO2 security key method must also be enabled for the users; otherwise Microsoft Entra ID refuses the sign-in even though the key is redirected.
        fr: |
          La redirection WebAuthn est activée par défaut sur les versions de système d'exploitation d'hôte de session prises en charge : c'est pourquoi le navigateur de la session trouve la clé locale. Pour utiliser ces clés avec des ressources Microsoft Entra, la méthode par clé de sécurité FIDO2 doit aussi être activée pour les utilisateurs ; sinon Microsoft Entra ID refuse la connexion même si la clé est redirigée.
      options:
        a: { en: "WebAuthn redirection is already on by default, as the browser finding the key shows; setting it explicitly doesn't change what Microsoft Entra ID accepts.", fr: "La redirection WebAuthn est déjà activée par défaut, comme le montre le navigateur qui trouve la clé ; la définir explicitement ne change pas ce qu'accepte Microsoft Entra ID." }
        b: { en: "Smart card redirection makes local smart cards available in the session; a FIDO2 key in a browser uses WebAuthn redirection instead.", fr: "La redirection de carte à puce rend les cartes à puce locales disponibles dans la session ; une clé FIDO2 dans un navigateur passe par la redirection WebAuthn." }
        d: { en: "A KDC proxy gives Kerberos access to a domain controller for smart card or Windows Hello for Business sign-in to the session host; it doesn't affect sign-in to a Microsoft Entra web app.", fr: "Un proxy KDC donne un accès Kerberos à un contrôleur de domaine pour la connexion à l'hôte de session par carte à puce ou Windows Hello Entreprise ; il n'a aucun effet sur la connexion à une application web Microsoft Entra." }
    references:
      - title: Azure Virtual Desktop identities and authentication - Azure
        url: https://learn.microsoft.com/en-us/azure/virtual-desktop/authentication

  # ------------------------------------------------------------------ 7
  - id: az140-qz-21-07
    objective: "2.1.7"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Adatum has a host pool named **HP-Cloud** whose session hosts are Microsoft Entra joined. Microsoft Entra single sign-on is enabled on HP-Cloud, and users sign in without any credential prompt.

        The users are synchronized from the adatum.com AD DS domain. They must open files on a share named **\\fs01\projects** hosted by an on-premises file server. The virtual network of HP-Cloud reaches the domain controllers and fs01 through a site-to-site VPN. When users open the share, an authentication dialog asks them for credentials.

        You need users to open the share without being prompted. The solution must minimize administrative effort.

        What should you do?
      fr: |
        Adatum dispose d'un pool d'hôtes nommé **HP-Cloud** dont les hôtes de session sont joints à Microsoft Entra. L'authentification unique Microsoft Entra est activée sur HP-Cloud, et les utilisateurs se connectent sans aucune demande d'informations d'identification.

        Les utilisateurs sont synchronisés depuis le domaine AD DS adatum.com. Ils doivent ouvrir des fichiers sur un partage nommé **\\fs01\projects** hébergé par un serveur de fichiers local. Le réseau virtuel de HP-Cloud joint les contrôleurs de domaine et fs01 par un VPN de site à site. Quand les utilisateurs ouvrent le partage, une boîte de dialogue d'authentification leur demande des informations d'identification.

        Vous devez permettre aux utilisateurs d'ouvrir le partage sans demande d'identification. La solution doit réduire au minimum l'effort administratif.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Configure the HP-Cloud session hosts as Microsoft Entra hybrid joined devices.", fr: "Configurer les hôtes de session de HP-Cloud comme appareils joints à Microsoft Entra hybride." } }
        - { id: b, text: { en: "Add a dynamic group of the session hosts to the target device groups of Windows Cloud Login.", fr: "Ajouter un groupe dynamique des hôtes de session aux groupes d'appareils cibles de Windows Cloud Login." } }
        - { id: c, text: { en: "Add the RDP property `targetisaadjoined:i:1` to the HP-Cloud host pool.", fr: "Ajouter la propriété RDP `targetisaadjoined:i:1` au pool d'hôtes HP-Cloud." } }
        - { id: d, text: { en: "Create a Microsoft Entra Kerberos server object in the adatum.com domain.", fr: "Créer un objet serveur Kerberos Microsoft Entra dans le domaine adatum.com." } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          With single sign-on, a Microsoft Entra Kerberos server object is required for Microsoft Entra joined session hosts when users must reach AD DS resources such as SMB shares. It lets the session host exchange the Microsoft Entra sign-in for Kerberos tickets from adatum.com; without it, users see a standard authentication dialog.
        fr: |
          Avec l'authentification unique, un objet serveur Kerberos Microsoft Entra est nécessaire pour les hôtes de session joints à Microsoft Entra quand les utilisateurs doivent joindre des ressources AD DS comme des partages SMB. Il permet à l'hôte de session d'échanger la connexion Microsoft Entra contre des tickets Kerberos d'adatum.com ; sans lui, les utilisateurs voient une boîte de dialogue d'authentification standard.
      options:
        a: { en: "Hybrid join would also need the Kerberos server object for single sign-on, and redeploying or reconfiguring every host adds effort without solving the prompt by itself.", fr: "La jonction hybride exigerait aussi l'objet serveur Kerberos pour l'authentification unique, et redéployer ou reconfigurer chaque hôte ajoute de l'effort sans résoudre seul la demande d'identification." }
        b: { en: "Target device groups only hide the consent prompt for the Remote Desktop connection to the session host; they don't give Kerberos access to on-premises shares.", fr: "Les groupes d'appareils cibles masquent seulement la demande de consentement pour la connexion Bureau à distance à l'hôte de session ; ils ne donnent pas d'accès Kerberos aux partages locaux." }
        c: { en: "`targetisaadjoined:i:1` lets clients on unmanaged devices connect to Microsoft Entra joined hosts without single sign-on; it doesn't give Kerberos access to on-premises shares.", fr: "`targetisaadjoined:i:1` permet aux clients d'appareils non gérés de se connecter aux hôtes joints à Microsoft Entra sans authentification unique ; il ne donne pas d'accès Kerberos aux partages locaux." }
    references:
      - title: Configure single sign-on for Azure Virtual Desktop using Microsoft Entra ID - Azure Virtual Desktop
        url: https://learn.microsoft.com/en-us/azure/virtual-desktop/configure-single-sign-on

  # ------------------------------------------------------------------ 8
  - id: az140-qz-21-08
    objective: "2.1.4"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        Tailspin Toys has a host pool named **HP-Sales** whose session hosts are Microsoft Entra joined. Microsoft Entra single sign-on is enabled on HP-Sales. Users sign in with passwords or with FIDO2 security keys, and both methods are enabled in Microsoft Entra ID. The following Conditional Access policies target a group named **Sales-Users**:

        | Policy | Target resource | Grant | Sign-in frequency |
        | --- | --- | --- | --- |
        | CA-1 | Azure Virtual Desktop | Require multifactor authentication | Periodic reauthentication, 8 hours |
        | CA-2 | Windows Cloud Login | Require multifactor authentication | Every time |

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Tailspin Toys dispose d'un pool d'hôtes nommé **HP-Sales** dont les hôtes de session sont joints à Microsoft Entra. L'authentification unique Microsoft Entra est activée sur HP-Sales. Les utilisateurs se connectent avec un mot de passe ou avec une clé de sécurité FIDO2, et les deux méthodes sont activées dans Microsoft Entra ID. Les stratégies d'accès conditionnel suivantes ciblent un groupe nommé **Sales-Users** :

        | Stratégie | Ressource cible | Accorder | Fréquence de connexion |
        | --- | --- | --- | --- |
        | CA-1 | Azure Virtual Desktop | Exiger l'authentification multifacteur | Réauthentification périodique, 8 heures |
        | CA-2 | Windows Cloud Login | Exiger l'authentification multifacteur | Chaque fois |

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - { id: s1, text: { en: "CA-2 is evaluated when a user subscribes to the HP-Sales feed in Windows App.", fr: "CA-2 est évaluée quand un utilisateur s'abonne au flux de HP-Sales dans Windows App." } }
        - { id: s2, text: { en: "Changing the sign-in frequency of CA-1 to Every time, and deleting CA-2, would keep the same prompts at each new connection to a session host.", fr: "Passer la fréquence de connexion de CA-1 sur Chaque fois, et supprimer CA-2, conserverait les mêmes demandes à chaque nouvelle connexion à un hôte de session." } }
        - { id: s3, text: { en: "A user who signs in to the session host with a FIDO2 security key satisfies the grant control of CA-2.", fr: "Un utilisateur qui se connecte à l'hôte de session avec une clé de sécurité FIDO2 satisfait le contrôle d'octroi de CA-2." } }
    answer:
      values: { s1: false, s2: false, s3: true }
    explanation:
      correct:
        en: |
          The Azure Virtual Desktop app (CA-1) applies when users subscribe to the feed and connect through the gateway; Windows Cloud Login (CA-2) applies only when users authenticate to the session host with single sign-on. Every time is supported only on Windows Cloud Login with single sign-on; on the Azure Virtual Desktop app it would prompt at feed refreshes, which is why Microsoft recommends two policies. With single sign-on, a FIDO2 security key is a passwordless, multifactor method that satisfies Require multifactor authentication at the session host.
        fr: |
          L'application Azure Virtual Desktop (CA-1) s'applique quand les utilisateurs s'abonnent au flux et se connectent par la passerelle ; Windows Cloud Login (CA-2) ne s'applique que quand les utilisateurs s'authentifient auprès de l'hôte de session avec l'authentification unique. Chaque fois n'est pris en charge que sur Windows Cloud Login avec l'authentification unique ; sur l'application Azure Virtual Desktop, il solliciterait l'utilisateur à chaque actualisation du flux : c'est pourquoi Microsoft recommande deux stratégies. Avec l'authentification unique, une clé de sécurité FIDO2 est une méthode sans mot de passe et multifacteur qui satisfait Exiger l'authentification multifacteur sur l'hôte de session.
      options:
        s1: { en: "Subscribing to the feed is covered by the Azure Virtual Desktop app, so CA-1 applies, not CA-2.", fr: "L'abonnement au flux relève de l'application Azure Virtual Desktop : c'est CA-1 qui s'applique, pas CA-2." }
        s2: { en: "Every time is only supported on Windows Cloud Login with single sign-on; on the Azure Virtual Desktop app it doesn't target the session host sign-in.", fr: "Chaque fois n'est pris en charge que sur Windows Cloud Login avec l'authentification unique ; sur l'application Azure Virtual Desktop, il ne cible pas la connexion à l'hôte de session." }
    references:
      - title: Enforce Microsoft Entra multifactor authentication for Azure Virtual Desktop using Conditional Access - Azure
        url: https://learn.microsoft.com/en-us/azure/virtual-desktop/set-up-mfa

  # ------------------------------------------------------------------ 9
  - id: az140-qz-21-09
    objective: "2.1.2"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        Woodgrove Bank has two kinds of users:

        | Users | Source | Microsoft Entra sign-in |
        | --- | --- | --- |
        | Employees | woodgrove.com AD DS, synchronized by Microsoft Entra Connect Sync | Federated with AD FS; password hash synchronization isn't enabled |
        | Auditors | Created directly in Microsoft Entra ID | Cloud password |

        Woodgrove enables Microsoft Entra Domain Services and deploys a host pool named **HP-Audit** whose session hosts are joined to the managed domain. Both kinds of users are assigned to the desktop application group of HP-Audit. They subscribe to the feed successfully, but none of them can sign in to the session hosts.

        Which two actions should you perform? Each correct answer presents part of the solution.

        NOTE: Each correct selection is worth one point.
      fr: |
        Woodgrove Bank a deux types d'utilisateurs :

        | Utilisateurs | Source | Connexion à Microsoft Entra |
        | --- | --- | --- |
        | Employés | AD DS woodgrove.com, synchronisés par Microsoft Entra Connect Sync | Fédérés avec AD FS ; la synchronisation du hachage de mot de passe n'est pas activée |
        | Auditeurs | Créés directement dans Microsoft Entra ID | Mot de passe cloud |

        Woodgrove active Microsoft Entra Domain Services et déploie un pool d'hôtes nommé **HP-Audit** dont les hôtes de session sont joints au domaine managé. Les deux types d'utilisateurs sont attribués au groupe d'applications de bureau de HP-Audit. Ils s'abonnent au flux sans problème, mais aucun ne peut se connecter aux hôtes de session.

        Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "Enable password hash synchronization in Microsoft Entra Connect Sync.", fr: "Activer la synchronisation du hachage de mot de passe dans Microsoft Entra Connect Sync." } }
        - { id: b, text: { en: "Assign the Virtual Machine User Login role on the session hosts to both groups.", fr: "Attribuer le rôle Virtual Machine User Login sur les hôtes de session aux deux groupes." } }
        - { id: c, text: { en: "Have each auditor change their password after Domain Services is enabled.", fr: "Faire changer son mot de passe à chaque auditeur après l'activation de Domain Services." } }
        - { id: d, text: { en: "Create a Microsoft Entra Kerberos server object in the managed domain.", fr: "Créer un objet serveur Kerberos Microsoft Entra dans le domaine managé." } }
        - { id: e, text: { en: "Add `enablerdsaadauth:i:1` to the custom RDP properties of HP-Audit.", fr: "Ajouter `enablerdsaadauth:i:1` aux propriétés RDP personnalisées de HP-Audit." } }
        - { id: f, text: { en: "Add both groups to the AAD DC Administrators group.", fr: "Ajouter les deux groupes au groupe AAD DC Administrators." } }
    answer: { optionIds: [a, c] }
    explanation:
      correct:
        en: |
          Users sign in to session hosts joined to Microsoft Entra Domain Services with Kerberos or NTLM, which require password hashes in the managed domain. Synchronized users get them only if Microsoft Entra Connect Sync synchronizes password hashes, which a federated configuration doesn't do by default. Cloud-only users must change their password after Domain Services is enabled, so that the hashes are generated.
        fr: |
          Les utilisateurs se connectent aux hôtes de session joints à Microsoft Entra Domain Services avec Kerberos ou NTLM, qui exigent des hachages de mot de passe dans le domaine managé. Les utilisateurs synchronisés ne les obtiennent que si Microsoft Entra Connect Sync synchronise les hachages de mot de passe, ce qu'une configuration fédérée ne fait pas par défaut. Les utilisateurs cloud doivent changer leur mot de passe après l'activation de Domain Services, pour que les hachages soient générés.
      options:
        b: { en: "Virtual Machine User Login is for Microsoft Entra joined session hosts; hosts joined to the managed domain authenticate users against the domain.", fr: "Virtual Machine User Login concerne les hôtes de session joints à Microsoft Entra ; les hôtes joints au domaine managé authentifient les utilisateurs auprès du domaine." }
        d: { en: "A Microsoft Entra Kerberos server object is created in AD DS for single sign-on with hybrid joined or Microsoft Entra joined hosts; it doesn't provide password hashes to a managed domain.", fr: "Un objet serveur Kerberos Microsoft Entra se crée dans AD DS pour l'authentification unique avec des hôtes joints hybrides ou joints à Microsoft Entra ; il ne fournit pas de hachages de mot de passe à un domaine managé." }
        e: { en: "Microsoft Entra single sign-on isn't supported on session hosts joined to Microsoft Entra Domain Services.", fr: "L'authentification unique Microsoft Entra n'est pas prise en charge sur les hôtes de session joints à Microsoft Entra Domain Services." }
        f: { en: "AAD DC Administrators grants administrative rights on the managed domain, which users don't need and which doesn't create their password hashes.", fr: "AAD DC Administrators accorde des droits d'administration sur le domaine managé, dont les utilisateurs n'ont pas besoin et qui ne créent pas leurs hachages de mot de passe." }
    references:
      - title: Tutorial - Create a Microsoft Entra Domain Services managed domain - Microsoft Entra ID
        url: https://learn.microsoft.com/en-us/entra/identity/domain-services/tutorial-create-instance

  # ------------------------------------------------------------------ 10
  - id: az140-qz-21-10
    objective: "2.1.7"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        Contoso has a host pool named **HP-Legal** whose session hosts are Microsoft Entra hybrid joined to the contoso.com domain, the domain of the user accounts. A Microsoft Entra Kerberos server object exists in contoso.com. Contoso doesn't use AD FS.

        Lawyers must sign in to the feed and to the session hosts with their smart cards, including from home without a VPN. Users must enter their credentials only once per connection. The solution must not require deploying any server.

        Which two actions should you perform? Each correct answer presents part of the solution.

        NOTE: Each correct selection is worth one point.
      fr: |
        Contoso dispose d'un pool d'hôtes nommé **HP-Legal** dont les hôtes de session sont joints à Microsoft Entra hybride au domaine contoso.com, celui des comptes d'utilisateur. Un objet serveur Kerberos Microsoft Entra existe dans contoso.com. Contoso n'utilise pas AD FS.

        Les avocats doivent se connecter au flux et aux hôtes de session avec leur carte à puce, y compris depuis leur domicile sans VPN. Les utilisateurs ne doivent saisir leurs informations d'identification qu'une seule fois par connexion. La solution ne doit exiger le déploiement d'aucun serveur.

        Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "Configure Microsoft Entra certificate-based authentication for the lawyers.", fr: "Configurer l'authentification par certificat Microsoft Entra pour les avocats." } }
        - { id: b, text: { en: "Add `kdcproxyname:s:kdc.contoso.com` to the RDP properties of HP-Legal.", fr: "Ajouter `kdcproxyname:s:kdc.contoso.com` aux propriétés RDP de HP-Legal." } }
        - { id: c, text: { en: "Add `redirectsmartcards:i:1` to the RDP properties of HP-Legal.", fr: "Ajouter `redirectsmartcards:i:1` aux propriétés RDP de HP-Legal." } }
        - { id: d, text: { en: "Configure Microsoft Entra single sign-on for HP-Legal.", fr: "Configurer l'authentification unique Microsoft Entra pour HP-Legal." } }
        - { id: e, text: { en: "Add `targetisaadjoined:i:1` to the RDP properties of HP-Legal.", fr: "Ajouter `targetisaadjoined:i:1` aux propriétés RDP de HP-Legal." } }
    answer: { optionIds: [a, d] }
    explanation:
      correct:
        en: |
          Without AD FS, Microsoft Entra certificate-based authentication is how users sign in to Microsoft Entra ID, and therefore to the feed, with a smart card. With Microsoft Entra single sign-on, the session host accepts the Microsoft Entra sign-in, whatever method was used, so users don't enter credentials a second time. Without single sign-on, smart card sign-in to the session host uses Kerberos and needs line of sight to a domain controller, through a VPN or a KDC proxy server.
        fr: |
          Sans AD FS, l'authentification par certificat Microsoft Entra est le moyen de se connecter à Microsoft Entra ID, et donc au flux, avec une carte à puce. Avec l'authentification unique Microsoft Entra, l'hôte de session accepte la connexion Microsoft Entra, quelle que soit la méthode utilisée : les utilisateurs ne saisissent pas leurs informations d'identification une seconde fois. Sans authentification unique, la connexion à l'hôte de session par carte à puce utilise Kerberos et exige une visibilité directe sur un contrôleur de domaine, par un VPN ou un serveur proxy KDC.
      options:
        b: { en: "A KDC proxy needs a Windows Server running the KDC proxy service, which the constraint excludes, and the session host would still prompt a second time.", fr: "Un proxy KDC exige un serveur Windows Server exécutant le service proxy KDC, ce que la contrainte exclut, et l'hôte de session demanderait encore une seconde fois les informations d'identification." }
        c: { en: "Smart card redirection makes the card available to apps inside the session; it doesn't sign users in to the feed or to the session host.", fr: "La redirection de carte à puce rend la carte disponible pour les applications dans la session ; elle ne connecte pas les utilisateurs au flux ni à l'hôte de session." }
        e: { en: "`targetisaadjoined:i:1` applies to Microsoft Entra joined hosts and limits the host sign-in to user name and password.", fr: "`targetisaadjoined:i:1` concerne les hôtes joints à Microsoft Entra et limite la connexion à l'hôte au nom d'utilisateur et au mot de passe." }
    references:
      - title: Azure Virtual Desktop identities and authentication - Azure
        url: https://learn.microsoft.com/en-us/azure/virtual-desktop/authentication
      - title: Configure single sign-on for Azure Virtual Desktop using Microsoft Entra ID - Azure Virtual Desktop
        url: https://learn.microsoft.com/en-us/azure/virtual-desktop/configure-single-sign-on
