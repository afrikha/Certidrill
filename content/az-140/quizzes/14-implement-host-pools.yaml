chapter: 14-implement-host-pools
questions:
  # ------------------------------------------------------------------ 1
  - id: az140-qz-14-01
    objective: "1.4.1"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        You are deploying Azure Virtual Desktop session hosts in the Azure portal. The deployment reads the local administrator password and the domain join password from secrets stored in a key vault named **kv-avd**, which uses the Azure role-based access control permission model.

        You need to grant the deploying account access to the secrets. The solution must follow the principle of least privilege.

        Which role should you assign to the account on kv-avd?
      fr: |
        Vous déployez des hôtes de session Azure Virtual Desktop dans le portail Azure. Le déploiement lit le mot de passe de l'administrateur local et le mot de passe de jonction au domaine dans des secrets stockés dans un coffre de clés nommé **kv-avd**, qui utilise le modèle d'autorisation du contrôle d'accès en fonction du rôle Azure.

        Vous devez accorder au compte qui déploie l'accès aux secrets. La solution doit respecter le principe du moindre privilège.

        Quel rôle devez-vous attribuer au compte sur kv-avd ?
    body:
      options:
        - { id: a, text: Key Vault Reader }
        - { id: b, text: Key Vault Contributor }
        - { id: c, text: Key Vault Secrets Officer }
        - { id: d, text: Key Vault Secrets User }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          The Azure Virtual Desktop deployment prerequisites list Key Vault Secrets User on the key vault that holds the local and domain credentials. This role reads secret contents and nothing more, which is exactly what the deployment needs.
        fr: |
          Les prérequis du déploiement d'Azure Virtual Desktop indiquent Key Vault Secrets User sur le coffre de clés qui contient les identifiants locaux et de domaine. Ce rôle lit le contenu des secrets et rien de plus, ce dont le déploiement a exactement besoin.
      options:
        a: { en: "Key Vault Reader reads the metadata of secrets but can't read their values.", fr: "Key Vault Reader lit les métadonnées des secrets mais ne peut pas lire leurs valeurs." }
        b: { en: "Key Vault Contributor manages the vault on the control plane and gives no access to secret contents.", fr: "Key Vault Contributor gère le coffre au niveau du plan de contrôle et ne donne aucun accès au contenu des secrets." }
        c: { en: "Key Vault Secrets Officer can read secrets, but it can also create, change and delete them: more than needed.", fr: "Key Vault Secrets Officer peut lire les secrets, mais aussi les créer, les modifier et les supprimer : plus que nécessaire." }
    references:
      - title: Deploy Azure Virtual Desktop
        url: https://learn.microsoft.com/en-us/azure/virtual-desktop/deploy-azure-virtual-desktop
      - title: Provide access to Key Vault keys, certificates, and secrets with Azure role-based access control
        url: https://learn.microsoft.com/en-us/azure/key-vault/general/rbac-guide

  # ------------------------------------------------------------------ 2
  - id: az140-qz-14-02
    objective: "1.4.3"
    difficulty: 1
    status: draft
    type: single
    shuffle: false
    stem:
      en: |
        You create an Azure Virtual Desktop pooled host pool named **HP1**. You select the breadth-first load balancing algorithm and don't set a max session limit.

        What is the max session limit of HP1 after its creation?
      fr: |
        Vous créez un pool d'hôtes Azure Virtual Desktop regroupé nommé **HP1**. Vous sélectionnez l'algorithme d'équilibrage de charge breadth-first et ne définissez aucune limite maximale de sessions.

        Quelle est la limite maximale de sessions de HP1 après sa création ?
    body:
      options:
        - { id: a, text: "10" }
        - { id: b, text: "100" }
        - { id: c, text: "999999" }
        - { id: d, text: { en: "No value: breadth-first host pools have no max session limit", fr: "Aucune valeur : les pools d'hôtes breadth-first n'ont pas de limite maximale de sessions" } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          When a host pool is created with breadth-first, the max session limit defaults to 999999, which is also the highest value you can set. Breadth-first doesn't need a lower value, but depth-first and autoscale rely on a limit that matches the capacity of the hosts, so change it before you use them.
        fr: |
          Quand un pool d'hôtes est créé en breadth-first, la limite maximale de sessions vaut 999999 par défaut, qui est aussi la valeur la plus élevée possible. Breadth-first n'a pas besoin d'une valeur plus basse, mais depth-first et la mise à l'échelle automatique reposent sur une limite adaptée à la capacité des hôtes : modifiez-la avant de les utiliser.
      options:
        a: { en: "10 is a typical value set by an administrator, not the default of a breadth-first host pool.", fr: "10 est une valeur typique définie par un administrateur, pas la valeur par défaut d'un pool d'hôtes breadth-first." }
        b: { en: "100 isn't a default value of the max session limit.", fr: "100 n'est pas une valeur par défaut de la limite maximale de sessions." }
        d: { en: "Every pooled host pool has a max session limit; breadth-first only doesn't require you to set one.", fr: "Tout pool d'hôtes regroupé a une limite maximale de sessions ; breadth-first n'exige simplement pas que vous la définissiez." }
    references:
      - title: Configure host pool load balancing in Azure Virtual Desktop
        url: https://learn.microsoft.com/en-us/azure/virtual-desktop/host-pool-load-balancing

  # ------------------------------------------------------------------ 3
  - id: az140-qz-14-03
    objective: "1.4.2"
    difficulty: 2
    status: draft
    type: dropdown
    stem:
      en: |
        You have an Azure Virtual Desktop pooled host pool named **hp-sales** in a resource group named **rg-avd**. The desktop application group of hp-sales is named **hp-sales-dag** and is registered in a workspace named **ws-sales**. The object ID of a Microsoft Entra group named Sales-Users is stored in `$groupId`.

        You need to allow the members of Sales-Users to connect to the desktop of hp-sales by using Azure PowerShell. The solution must follow the principle of least privilege.

        How should you complete the command? Select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Vous disposez d'un pool d'hôtes Azure Virtual Desktop regroupé nommé **hp-sales** dans un groupe de ressources nommé **rg-avd**. Le groupe d'applications de bureau de hp-sales s'appelle **hp-sales-dag** et il est inscrit dans un espace de travail nommé **ws-sales**. L'ID d'objet d'un groupe Microsoft Entra nommé Sales-Users est stocké dans `$groupId`.

        Vous devez permettre aux membres de Sales-Users de se connecter au bureau de hp-sales à l'aide d'Azure PowerShell. La solution doit respecter le principe du moindre privilège.

        Comment devez-vous compléter la commande ? Sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: code
      language: powershell
      template: |
        New-AzRoleAssignment -ObjectId $groupId `
            -RoleDefinitionName [[role]] `
            -ResourceName [[res]] `
            -ResourceGroupName rg-avd `
            -ResourceType [[type]]
      slots:
        - id: role
          options:
            - { id: user, text: "'Desktop Virtualization User'" }
            - { id: reader, text: "'Desktop Virtualization Reader'" }
            - { id: agcontrib, text: "'Desktop Virtualization Application Group Contributor'" }
        - id: res
          options:
            - { id: dag, text: hp-sales-dag }
            - { id: hp, text: hp-sales }
            - { id: ws, text: ws-sales }
        - id: type
          options:
            - { id: ag, text: "'Microsoft.DesktopVirtualization/applicationGroups'" }
            - { id: hostpools, text: "'Microsoft.DesktopVirtualization/hostPools'" }
            - { id: workspaces, text: "'Microsoft.DesktopVirtualization/workspaces'" }
    answer:
      values: { role: user, res: dag, type: ag }
    explanation:
      correct:
        en: |
          Users get a desktop through the Desktop Virtualization User role assigned on the application group: its only data action is the use of the applications of that group. `-ResourceName` and `-ResourceType` must therefore designate hp-sales-dag, of type `Microsoft.DesktopVirtualization/applicationGroups`. Assigning the group, not each user, keeps a single role assignment.
        fr: |
          Les utilisateurs obtiennent un bureau par le rôle Desktop Virtualization User attribué sur le groupe d'applications : sa seule action de données est l'utilisation des applications de ce groupe. `-ResourceName` et `-ResourceType` doivent donc désigner hp-sales-dag, de type `Microsoft.DesktopVirtualization/applicationGroups`. Attribuer le groupe, et non chaque utilisateur, ne crée qu'une seule attribution de rôle.
      options:
        reader: { en: "Desktop Virtualization Reader only views Azure Virtual Desktop resources; it doesn't let users connect.", fr: "Desktop Virtualization Reader ne fait que consulter les ressources Azure Virtual Desktop ; il ne permet pas aux utilisateurs de se connecter." }
        agcontrib: { en: "Desktop Virtualization Application Group Contributor manages the application group; it doesn't grant the use of its desktop.", fr: "Desktop Virtualization Application Group Contributor gère le groupe d'applications ; il n'accorde pas l'utilisation de son bureau." }
        hp: { en: "A role assignment on the host pool gives users no access to any resource.", fr: "Une attribution de rôle sur le pool d'hôtes ne donne aux utilisateurs accès à aucune ressource." }
        ws: { en: "The workspace only shows the application groups it references; access comes from the application group assignment.", fr: "L'espace de travail affiche seulement les groupes d'applications qu'il référence ; l'accès vient de l'attribution sur le groupe d'applications." }
    references:
      - title: Built-in Azure RBAC roles for Azure Virtual Desktop
        url: https://learn.microsoft.com/en-us/azure/virtual-desktop/rbac
      - title: Deploy Azure Virtual Desktop
        url: https://learn.microsoft.com/en-us/azure/virtual-desktop/deploy-azure-virtual-desktop

  # ------------------------------------------------------------------ 4
  - id: az140-qz-14-04
    objective: "1.4.4"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Litware, Inc. runs a warehouse in three shifts. The 150 warehouse employees share 45 thin clients: each thin client is used by a different employee in each shift, and the employees never connect from other devices.

        The employees connect to an Azure Virtual Desktop pooled host pool whose session hosts run Windows Server 2025 and are joined to AD DS. A Remote Desktop license server that runs Windows Server 2025 is reachable from the session hosts.

        You need to license the connections. The solution must minimize the number of RDS CALs.

        What should you buy and configure?
      fr: |
        Litware, Inc. exploite un entrepôt en trois équipes. Les 150 employés de l'entrepôt se partagent 45 clients légers : chaque client léger est utilisé par un employé différent à chaque équipe, et les employés ne se connectent jamais depuis d'autres appareils.

        Les employés se connectent à un pool d'hôtes Azure Virtual Desktop regroupé dont les hôtes de session exécutent Windows Server 2025 et sont joints à AD DS. Un serveur de licences Bureau à distance qui exécute Windows Server 2025 est joignable depuis les hôtes de session.

        Vous devez licencier les connexions. La solution doit réduire au minimum le nombre de CAL RDS.

        Que devez-vous acheter et configurer ?
    body:
      options:
        - { id: a, text: { en: "150 Windows Server 2025 RDS Per User CALs, with the licensing mode set to Per User", fr: "150 CAL RDS Windows Server 2025 par utilisateur, avec le mode de licence Per User" } }
        - { id: b, text: { en: "45 Windows Server 2025 RDS Per Device CALs, with the licensing mode set to Per Device", fr: "45 CAL RDS Windows Server 2025 par appareil, avec le mode de licence Per Device" } }
        - { id: c, text: { en: "45 Windows Server 2025 RDS Per User CALs, with the licensing mode set to Per User", fr: "45 CAL RDS Windows Server 2025 par utilisateur, avec le mode de licence Per User" } }
        - { id: d, text: { en: "45 Windows Server 2022 RDS Per Device CALs, with the licensing mode set to Per Device", fr: "45 CAL RDS Windows Server 2022 par appareil, avec le mode de licence Per Device" } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          The per device model suits two or more shifts of workers who use the same computers: each of the 45 thin clients needs one CAL, whatever the number of employees who use it. The CALs must be of the session hosts' version or later, and the session hosts must use the Per Device licensing mode that matches them.
        fr: |
          Le modèle par appareil convient à plusieurs équipes de travailleurs qui utilisent les mêmes ordinateurs : chacun des 45 clients légers a besoin d'une CAL, quel que soit le nombre d'employés qui l'utilisent. Les CAL doivent être de la version des hôtes de session ou d'une version ultérieure, et les hôtes de session doivent utiliser le mode de licence Per Device correspondant.
      options:
        a: { en: "Per User CALs are compliant but need one CAL for each of the 150 employees, more than the 45 devices.", fr: "Les CAL par utilisateur sont conformes mais exigent une CAL pour chacun des 150 employés, plus que les 45 appareils." }
        c: { en: "A Per User CAL is assigned to one user: 45 of them can't license 150 employees.", fr: "Une CAL par utilisateur est attribuée à un seul utilisateur : 45 CAL ne peuvent pas licencier 150 employés." }
        d: { en: "Windows Server 2022 CALs can't be used to connect to session hosts that run Windows Server 2025.", fr: "Des CAL Windows Server 2022 ne permettent pas de se connecter à des hôtes de session qui exécutent Windows Server 2025." }
    references:
      - title: License Remote Desktop Services with Client Access Licenses (CALs)
        url: https://learn.microsoft.com/en-us/windows-server/remote/remote-desktop-services/rds-client-access-license

  # ------------------------------------------------------------------ 5
  - id: az140-qz-14-05
    objective: "1.4.3"
    difficulty: 2
    status: draft
    type: yesno_statements
    stem:
      en: |
        You are creating an Azure Virtual Desktop pooled host pool named **HP-Plant**. Once HP-Plant is in production, the Azure Virtual Desktop agent components of its session hosts must be updated only on Sundays between 03:00 and 05:00.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Vous créez un pool d'hôtes Azure Virtual Desktop regroupé nommé **HP-Plant**. Une fois HP-Plant en production, les composants de l'agent Azure Virtual Desktop de ses hôtes de session ne doivent être mis à jour que le dimanche entre 03:00 et 05:00.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - { id: s1, text: { en: "You can configure the Sunday window in the host pool creation wizard, so that it applies from the first session host.", fr: "Vous pouvez configurer la fenêtre du dimanche dans l'assistant de création du pool d'hôtes, pour qu'elle s'applique dès le premier hôte de session." } }
        - { id: s2, text: { en: "The schedule also controls when the side-by-side stack and the Geneva Monitoring agent are updated.", fr: "La planification détermine aussi quand la pile côte à côte et l'agent Geneva Monitoring sont mis à jour." } }
        - { id: s3, text: { en: "A critical agent component update can be installed outside the Sunday window.", fr: "Une mise à jour critique d'un composant de l'agent peut être installée en dehors de la fenêtre du dimanche." } }
    answer:
      values: { s1: false, s2: true, s3: true }
    explanation:
      correct:
        en: |
          Scheduled agent updates apply to the Azure Virtual Desktop agent, the side-by-side stack and the Geneva Monitoring agent, in one or two maintenance windows of two hours. The feature can be enabled only on an existing host pool, not when you create it. Non-critical updates wait for a window, but a critical update is installed by force for security reasons.
        fr: |
          Les mises à jour planifiées de l'agent s'appliquent à l'agent Azure Virtual Desktop, à la pile côte à côte et à l'agent Geneva Monitoring, dans une ou deux fenêtres de maintenance de deux heures. La fonctionnalité ne peut être activée que sur un pool d'hôtes existant, pas à sa création. Les mises à jour non critiques attendent une fenêtre, mais une mise à jour critique est installée de force pour des raisons de sécurité.
      options:
        s1: { en: "Scheduled agent updates can't be enabled when you create a host pool: configure them on HP-Plant after its creation.", fr: "Les mises à jour planifiées de l'agent ne peuvent pas être activées à la création d'un pool d'hôtes : configurez-les sur HP-Plant après sa création." }
    references:
      - title: Scheduled Agent Updates for Azure Virtual Desktop host pools
        url: https://learn.microsoft.com/en-us/azure/virtual-desktop/scheduled-agent-updates

  # ------------------------------------------------------------------ 6
  - id: az140-qz-14-06
    objective: "1.4.3"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        Fabrikam, Inc. has an Azure Virtual Desktop pooled host pool named **HP-Finance** that uses breadth-first load balancing and contains four session hosts named FIN-0 to FIN-3. Tonight, you must run a maintenance procedure on FIN-2 that can start only when no user session remains on the host.

        At 19:00, FIN-2 hosts five user sessions. All five are disconnected: the users closed Windows App without signing out and will connect again tomorrow morning.

        You need to prepare FIN-2 so that the maintenance can start tonight. No new session must start on FIN-2, and the five users must be able to work on another session host tomorrow.

        Which two actions should you perform? Each correct answer presents part of the solution.

        NOTE: Each correct selection is worth one point.
      fr: |
        Fabrikam, Inc. dispose d'un pool d'hôtes Azure Virtual Desktop regroupé nommé **HP-Finance** qui utilise l'équilibrage de charge breadth-first et contient quatre hôtes de session nommés FIN-0 à FIN-3. Ce soir, vous devez exécuter sur FIN-2 une procédure de maintenance qui ne peut démarrer que lorsqu'il ne reste aucune session utilisateur sur l'hôte.

        À 19:00, FIN-2 héberge cinq sessions utilisateur. Toutes les cinq sont déconnectées : les utilisateurs ont fermé Windows App sans fermer leur session et se reconnecteront demain matin.

        Vous devez préparer FIN-2 pour que la maintenance puisse démarrer ce soir. Aucune nouvelle session ne doit démarrer sur FIN-2, et les cinq utilisateurs doivent pouvoir travailler sur un autre hôte de session demain.

        Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

        Remarque : chaque sélection correcte vaut un point.
    body:
      options:
        - { id: a, text: { en: "Turn on drain mode for FIN-2.", fr: "Activer le mode drainage pour FIN-2." } }
        - { id: b, text: { en: "Disconnect the five user sessions on FIN-2.", fr: "Déconnecter les cinq sessions utilisateur de FIN-2." } }
        - { id: c, text: { en: "Send a message to the five users of FIN-2 asking them to sign out.", fr: "Envoyer un message aux cinq utilisateurs de FIN-2 pour leur demander de fermer leur session." } }
        - { id: d, text: { en: "Sign out the five user sessions on FIN-2.", fr: "Fermer les cinq sessions utilisateur de FIN-2 (Log off)." } }
        - { id: e, text: { en: "Change the load balancing algorithm of HP-Finance to depth-first.", fr: "Changer l'algorithme d'équilibrage de charge de HP-Finance en depth-first." } }
      choose: 2
    answer: { optionIds: [a, d] }
    explanation:
      correct:
        en: |
          Drain mode stops new sessions on FIN-2, but existing connections, disconnected ones included, stay until the user signs out or an administrator ends the session, and a user with a session on a drained host is still sent back to it. Signing out the five sessions from the session host's user sessions leaves FIN-2 empty for the maintenance, and the users get a new session on another host tomorrow because FIN-2 accepts no new session.
        fr: |
          Le mode drainage arrête les nouvelles sessions sur FIN-2, mais les connexions existantes, déconnectées comprises, restent jusqu'à ce que l'utilisateur ferme sa session ou qu'un administrateur y mette fin, et un utilisateur qui a une session sur un hôte drainé y est toujours renvoyé. Fermer les cinq sessions depuis les sessions utilisateur de l'hôte laisse FIN-2 vide pour la maintenance, et les utilisateurs obtiennent demain une nouvelle session sur un autre hôte, car FIN-2 n'accepte aucune nouvelle session.
      options:
        b: { en: "The sessions are already disconnected: disconnecting doesn't end them, so they remain on FIN-2.", fr: "Les sessions sont déjà déconnectées : déconnecter ne les ferme pas, elles restent donc sur FIN-2." }
        c: { en: "The users aren't connected tonight and won't read the message, so the sessions remain on FIN-2.", fr: "Les utilisateurs ne sont pas connectés ce soir et ne liront pas le message : les sessions restent sur FIN-2." }
        e: { en: "The algorithm decides where new sessions go; it neither blocks FIN-2 nor ends the existing sessions.", fr: "L'algorithme décide où vont les nouvelles sessions ; il ne bloque pas FIN-2 et ne ferme pas les sessions existantes." }
    references:
      - title: Drain session hosts for maintenance in Azure Virtual Desktop
        url: https://learn.microsoft.com/en-us/azure/virtual-desktop/drain-mode
      - title: Built-in Azure RBAC roles for Azure Virtual Desktop
        url: https://learn.microsoft.com/en-us/azure/virtual-desktop/rbac

  # ------------------------------------------------------------------ 7
  - id: az140-qz-14-07
    objective: "1.4.1"
    difficulty: 3
    status: draft
    type: dropdown
    stem:
      en: |
        You are adding 20 session hosts to an Azure Virtual Desktop host pool named **HP-Core** that uses the standard management approach. You use the **Virtual machines** tab in the Azure portal. The session hosts will use the D8s_v5 size and a Windows 11 Enterprise multi-session Gen2 image from Azure Marketplace.

        The session hosts must meet the following requirements:

        - HP-Core must keep serving users if one datacenter of the region fails.
        - Secure Boot and a virtual TPM must be enabled on each session host.
        - Traffic filtering must rely only on the network security group that the network team already applies to the session host subnet.

        How should you configure the Virtual machines tab? Select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Vous ajoutez 20 hôtes de session à un pool d'hôtes Azure Virtual Desktop nommé **HP-Core** qui utilise l'approche de gestion standard. Vous utilisez l'onglet **Machines virtuelles** du portail Azure. Les hôtes de session utiliseront la taille D8s_v5 et une image Windows 11 Entreprise multisession Gen2 de la Place de marché Azure.

        Les hôtes de session doivent répondre aux exigences suivantes :

        - HP-Core doit continuer à servir les utilisateurs si un centre de données de la région tombe en panne.
        - Le démarrage sécurisé (Secure Boot) et un TPM virtuel doivent être activés sur chaque hôte de session.
        - Le filtrage du trafic doit reposer uniquement sur le groupe de sécurité réseau que l'équipe réseau applique déjà au sous-réseau des hôtes de session.

        Comment devez-vous configurer l'onglet Machines virtuelles ? Sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: text
      template:
        en: |
          Availability options: [[avail]]

          Security type: [[sec]]

          Network security group of the network interfaces: [[nsg]]
        fr: |
          Options de disponibilité : [[avail]]

          Type de sécurité : [[sec]]

          Groupe de sécurité réseau des interfaces réseau : [[nsg]]
      slots:
        - id: avail
          options:
            - { id: zone, text: Availability zone }
            - { id: set, text: Availability set }
            - { id: none, text: No infrastructure redundancy required }
        - id: sec
          options:
            - { id: std, text: Standard }
            - { id: tl, text: Trusted launch virtual machines }
            - { id: cvm, text: Confidential virtual machines }
        - id: nsg
          options:
            - { id: nnone, text: None }
            - { id: basic, text: Basic }
            - { id: adv, text: Advanced }
    answer:
      values: { avail: zone, sec: tl, nsg: nnone }
    explanation:
      correct:
        en: |
          Spreading the session hosts across availability zones keeps the host pool available when one datacenter of the region fails. Trusted launch provides Secure Boot and a vTPM on Gen2 images and standard sizes such as D8s_v5. Microsoft recommends no network security group on the network interfaces of session hosts and an NSG on the subnet instead, which is the one the network team already manages.
        fr: |
          Répartir les hôtes de session entre les zones de disponibilité maintient le pool d'hôtes disponible quand un centre de données de la région tombe en panne. Trusted launch fournit le démarrage sécurisé et un vTPM sur les images Gen2 et les tailles standard comme D8s_v5. Microsoft recommande de ne mettre aucun groupe de sécurité réseau sur les interfaces réseau des hôtes de session, et plutôt un NSG sur le sous-réseau, celui que l'équipe réseau gère déjà.
      options:
        set: { en: "An availability set spreads VMs across fault and update domains inside one datacenter; it doesn't survive the loss of that datacenter.", fr: "Un groupe à haute disponibilité répartit les machines virtuelles entre domaines d'erreur et de mise à jour dans un seul centre de données ; il ne survit pas à la perte de ce centre." }
        std: { en: "The Standard security type has neither Secure Boot nor a vTPM.", fr: "Le type de sécurité Standard n'a ni démarrage sécurisé ni vTPM." }
        cvm: { en: "Confidential virtual machines require confidential VM sizes (DC- or EC-series), not D8s_v5.", fr: "Les machines virtuelles confidentielles exigent des tailles confidentielles (séries DC ou EC), pas D8s_v5." }
        basic: { en: "Basic creates an NSG on each network interface, in addition to the subnet NSG.", fr: "Basic crée un NSG sur chaque interface réseau, en plus du NSG du sous-réseau." }
        adv: { en: "Advanced also attaches an NSG to each network interface, in addition to the subnet NSG.", fr: "Advanced associe lui aussi un NSG à chaque interface réseau, en plus du NSG du sous-réseau." }
    references:
      - title: Deploy Azure Virtual Desktop
        url: https://learn.microsoft.com/en-us/azure/virtual-desktop/deploy-azure-virtual-desktop
      - title: Trusted Launch for Azure virtual machines
        url: https://learn.microsoft.com/en-us/azure/virtual-machines/trusted-launch

  # ------------------------------------------------------------------ 8
  - id: az140-qz-14-08
    objective: "1.4.1"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        Contoso, Ltd. has an Azure Virtual Desktop pooled host pool named **HP-Ops** that uses the standard management approach. A resource group named **RG-AVD** contains HP-Ops, its application groups and workspace, other host pools, all the session host VMs and their virtual network.

        An operator named Op1 must add session hosts to HP-Ops from the **Session hosts** page of HP-Ops in the Azure portal. Op1 must not be able to change application groups, workspaces or the settings of other host pools. The deployment doesn't use a key vault.

        You need to grant the required permissions to Op1. The solution must follow the principle of least privilege.

        Which two role assignments should you create? Each correct answer presents part of the solution.

        NOTE: Each correct selection is worth one point.
      fr: |
        Contoso, Ltd. dispose d'un pool d'hôtes Azure Virtual Desktop regroupé nommé **HP-Ops** qui utilise l'approche de gestion standard. Un groupe de ressources nommé **RG-AVD** contient HP-Ops, ses groupes d'applications et son espace de travail, d'autres pools d'hôtes, toutes les machines virtuelles hôtes de session et leur réseau virtuel.

        Un opérateur nommé Op1 doit ajouter des hôtes de session à HP-Ops depuis la page **Hôtes de session** de HP-Ops dans le portail Azure. Op1 ne doit pas pouvoir modifier les groupes d'applications, les espaces de travail ni les paramètres des autres pools d'hôtes. Le déploiement n'utilise pas de coffre de clés.

        Vous devez accorder à Op1 les autorisations nécessaires. La solution doit respecter le principe du moindre privilège.

        Quelles sont les deux attributions de rôles à créer ? Chaque bonne réponse présente une partie de la solution.

        Remarque : chaque sélection correcte vaut un point.
    body:
      options:
        - { id: a, text: { en: "Desktop Virtualization Session Host Operator on HP-Ops", fr: "Desktop Virtualization Session Host Operator sur HP-Ops" } }
        - { id: b, text: { en: "Desktop Virtualization Host Pool Contributor on HP-Ops", fr: "Desktop Virtualization Host Pool Contributor sur HP-Ops" } }
        - { id: c, text: { en: "Desktop Virtualization Contributor on RG-AVD", fr: "Desktop Virtualization Contributor sur RG-AVD" } }
        - { id: d, text: { en: "Virtual Machine Contributor on RG-AVD", fr: "Virtual Machine Contributor sur RG-AVD" } }
        - { id: e, text: { en: "Desktop Virtualization Application Group Contributor on RG-AVD", fr: "Desktop Virtualization Application Group Contributor sur RG-AVD" } }
      choose: 2
    answer: { optionIds: [b, d] }
    explanation:
      correct:
        en: |
          Adding session hosts to a host pool requires Desktop Virtualization Host Pool Contributor, which manages every aspect of the host pool, including its registration key, and Virtual Machine Contributor to create the VMs and their network interfaces. Scoping the first role to HP-Ops keeps Op1 away from the other host pools, the application groups and the workspace.
        fr: |
          Ajouter des hôtes de session à un pool d'hôtes exige Desktop Virtualization Host Pool Contributor, qui gère tous les aspects du pool d'hôtes, dont sa clé d'inscription, et Virtual Machine Contributor pour créer les machines virtuelles et leurs interfaces réseau. Limiter le premier rôle à HP-Ops tient Op1 à l'écart des autres pools d'hôtes, des groupes d'applications et de l'espace de travail.
      options:
        a: { en: "Session Host Operator can view and remove session hosts and change drain mode, but it can't add session hosts in the portal because it has no write permission on the host pool.", fr: "Session Host Operator peut consulter et supprimer des hôtes de session et changer le mode drainage, mais il ne peut pas ajouter d'hôtes de session dans le portail, faute d'autorisation d'écriture sur le pool d'hôtes." }
        c: { en: "Desktop Virtualization Contributor on RG-AVD manages every Azure Virtual Desktop object of the resource group, including the application groups, the workspace and the other host pools.", fr: "Desktop Virtualization Contributor sur RG-AVD gère tous les objets Azure Virtual Desktop du groupe de ressources, y compris les groupes d'applications, l'espace de travail et les autres pools d'hôtes." }
        e: { en: "Application Group Contributor manages application groups, which Op1 must not change, and gives no right to add session hosts.", fr: "Application Group Contributor gère les groupes d'applications, que Op1 ne doit pas modifier, et ne donne aucun droit d'ajouter des hôtes de session." }
    references:
      - title: Add session hosts to a host pool
        url: https://learn.microsoft.com/en-us/azure/virtual-desktop/add-session-hosts-host-pool
      - title: Built-in Azure RBAC roles for Azure Virtual Desktop
        url: https://learn.microsoft.com/en-us/azure/virtual-desktop/rbac

  # ------------------------------------------------------------------ 9
  - id: az140-qz-14-09
    objective: "1.4.4"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        Fabrikam, Inc. has the following virtual machines in an Azure subscription. All users have Microsoft 365 E3 licenses.

        | VM | Operating system | Use |
        | --- | --- | --- |
        | SH-W1 | Windows 11 Enterprise multi-session | Session host of HP-Win, created by a Bicep file that doesn't set a license type |
        | SH-S1 | Windows Server 2022 | Session host of HP-Srv, a pooled host pool for a server-only application |
        | FS1 | Windows Server 2022 | File server that stores the FSLogix profile containers of HP-Win |

        `Get-AzVM` on SH-W1 shows an empty `LicenseType` value.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Fabrikam, Inc. dispose des machines virtuelles suivantes dans un abonnement Azure. Tous les utilisateurs ont des licences Microsoft 365 E3.

        | Machine virtuelle | Système d'exploitation | Usage |
        | --- | --- | --- |
        | SH-W1 | Windows 11 Entreprise multisession | Hôte de session de HP-Win, créé par un fichier Bicep qui ne définit aucun type de licence |
        | SH-S1 | Windows Server 2022 | Hôte de session de HP-Srv, un pool d'hôtes regroupé pour une application uniquement serveur |
        | FS1 | Windows Server 2022 | Serveur de fichiers qui stocke les conteneurs de profils FSLogix de HP-Win |

        `Get-AzVM` sur SH-W1 affiche une valeur `LicenseType` vide.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - { id: s1, text: { en: "SH-W1 is currently billed at a rate that includes a Windows license.", fr: "SH-W1 est actuellement facturée à un tarif qui inclut une licence Windows." } }
        - { id: s2, text: { en: "Fabrikam can apply the Azure Virtual Desktop license benefit to FS1, because FS1 serves the session hosts of HP-Win.", fr: "Fabrikam peut appliquer l'avantage de licence Azure Virtual Desktop à FS1, car FS1 sert les hôtes de session de HP-Win." } }
        - { id: s3, text: { en: "SH-S1 needs network connectivity to a Remote Desktop license server, which can run on-premises.", fr: "SH-S1 a besoin d'une connectivité réseau vers un serveur de licences Bureau à distance, qui peut s'exécuter en local." } }
    answer:
      values: { s1: true, s2: false, s3: true }
    explanation:
      correct:
        en: |
          A session host without the `Windows_Client` license type is billed with a Windows license, and an empty `LicenseType` shows that the benefit isn't applied; setting it with `Update-AzVM` fixes this. The Azure Virtual Desktop license applies only to VMs registered as session hosts that receive user connections, not to file servers or domain controllers. Windows Server session hosts need a Remote Desktop license server that they can reach, on-premises or in Azure.
        fr: |
          Un hôte de session sans le type de licence `Windows_Client` est facturé avec une licence Windows, et un `LicenseType` vide montre que l'avantage n'est pas appliqué ; le définir avec `Update-AzVM` corrige ce point. La licence Azure Virtual Desktop ne s'applique qu'aux machines virtuelles inscrites comme hôtes de session qui reçoivent des connexions d'utilisateurs, pas aux serveurs de fichiers ni aux contrôleurs de domaine. Les hôtes de session Windows Server ont besoin d'un serveur de licences Bureau à distance qu'ils peuvent joindre, en local ou dans Azure.
      options:
        s2: { en: "The benefit covers only session hosts that receive user connections; file share servers and domain controllers are excluded.", fr: "L'avantage ne couvre que les hôtes de session qui reçoivent des connexions d'utilisateurs ; les serveurs de partage de fichiers et les contrôleurs de domaine en sont exclus." }
    references:
      - title: Apply Windows license to session host virtual machines
        url: https://learn.microsoft.com/en-us/azure/virtual-desktop/apply-windows-license

  # ------------------------------------------------------------------ 10
  - id: az140-qz-14-10
    objective: "1.4.2"
    difficulty: 3
    status: draft
    type: dropdown
    stem:
      en: |
        A pipeline deploys a Bicep file at the start of each Azure Virtual Desktop rollout. The file creates a pooled host pool named **hp-field**, its desktop application group **hp-field-dag**, a workspace **ws-field**, and a role assignment for a Microsoft Entra group whose object ID is passed in the `groupId` parameter. The pipeline then deploys session hosts in batches over the following 14 days.

        The file must meet the following requirements:

        - The registration token must stay valid for the 14 days of the rollout, counted from the time of the deployment.
        - The members of the group must be able to connect to the desktop of hp-field and get no other permission.

        How should you complete the file? Select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Un pipeline déploie un fichier Bicep au début de chaque déploiement progressif d'Azure Virtual Desktop. Le fichier crée un pool d'hôtes regroupé nommé **hp-field**, son groupe d'applications de bureau **hp-field-dag**, un espace de travail **ws-field** et une attribution de rôle pour un groupe Microsoft Entra dont l'ID d'objet est passé dans le paramètre `groupId`. Le pipeline déploie ensuite des hôtes de session par lots pendant les 14 jours suivants.

        Le fichier doit répondre aux exigences suivantes :

        - Le jeton d'inscription doit rester valide pendant les 14 jours du déploiement progressif, à compter de l'heure du déploiement.
        - Les membres du groupe doivent pouvoir se connecter au bureau de hp-field et n'obtenir aucune autre autorisation.

        Comment devez-vous compléter le fichier ? Sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: code
      language: bicep
      template: |
        param location string = resourceGroup().location
        param groupId string
        param baseTime string = utcNow('u')

        // Desktop Virtualization User
        var roleId = subscriptionResourceId('Microsoft.Authorization/roleDefinitions', '1d18fff3-a72a-46b5-b4a9-0b38a3cd7e63')

        resource hostPool 'Microsoft.DesktopVirtualization/hostPools@2024-04-03' = {
          name: 'hp-field'
          location: location
          properties: {
            hostPoolType: 'Pooled'
            loadBalancerType: 'BreadthFirst'
            preferredAppGroupType: 'Desktop'
            registrationInfo: {
              expirationTime: [[exp]]
              registrationTokenOperation: 'Update'
            }
          }
        }

        resource dag 'Microsoft.DesktopVirtualization/applicationGroups@2024-04-03' = {
          name: 'hp-field-dag'
          location: location
          properties: {
            applicationGroupType: 'Desktop'
            hostPoolArmPath: hostPool.id
          }
        }

        resource ws 'Microsoft.DesktopVirtualization/workspaces@2024-04-03' = {
          name: 'ws-field'
          location: location
          properties: {
            applicationGroupReferences: [
              dag.id
            ]
          }
        }

        resource access 'Microsoft.Authorization/roleAssignments@2022-04-01' = {
          name: guid(resourceGroup().id, groupId, 'hp-field-users')
          scope: [[scope]]
          properties: {
            roleDefinitionId: roleId
            principalId: groupId
            principalType: 'Group'
          }
        }
      slots:
        - id: exp
          options:
            - { id: p14d, text: "dateTimeAdd(baseTime, 'P14D')" }
            - { id: utc, text: "dateTimeAdd(utcNow(), 'P14D')" }
            - { id: pt14h, text: "dateTimeAdd(baseTime, 'PT14H')" }
            - { id: p30d, text: "dateTimeAdd(baseTime, 'P30D')" }
        - id: scope
          options:
            - { id: dag, text: dag }
            - { id: hostPool, text: hostPool }
            - { id: ws, text: ws }
    answer:
      values: { exp: p14d, scope: dag }
    explanation:
      correct:
        en: |
          In Bicep, `utcNow()` can be used only in the default value of a parameter, so the deployment time comes from `baseTime`, and `dateTimeAdd` adds the ISO 8601 duration `P14D` (14 days), within the 27-day maximum lifetime of a registration token. The Desktop Virtualization User role gives access only when it is assigned on the application group, so the role assignment, an extension resource, takes `scope: dag`.
        fr: |
          En Bicep, `utcNow()` ne peut s'utiliser que dans la valeur par défaut d'un paramètre : l'heure du déploiement vient donc de `baseTime`, et `dateTimeAdd` ajoute la durée ISO 8601 `P14D` (14 jours), dans la limite de la durée de vie maximale de 27 jours d'un jeton d'inscription. Le rôle Desktop Virtualization User ne donne accès que s'il est attribué sur le groupe d'applications : l'attribution de rôle, une ressource d'extension, prend donc `scope: dag`.
      options:
        utc: { en: "utcNow() used outside the default value of a parameter makes the Bicep file fail to compile.", fr: "utcNow() utilisé hors de la valeur par défaut d'un paramètre empêche la compilation du fichier Bicep." }
        pt14h: { en: "PT14H is 14 hours, not 14 days: the later batches would fail with EXPIRED_MACHINE_TOKEN.", fr: "PT14H correspond à 14 heures, pas 14 jours : les lots suivants échoueraient avec EXPIRED_MACHINE_TOKEN." }
        p30d: { en: "30 days exceeds the 27-day maximum lifetime of a registration token.", fr: "30 jours dépasse la durée de vie maximale de 27 jours d'un jeton d'inscription." }
        hostPool: { en: "A Desktop Virtualization User assignment on the host pool gives users no access.", fr: "Une attribution Desktop Virtualization User sur le pool d'hôtes ne donne aucun accès aux utilisateurs." }
        ws: { en: "The workspace only lists the application groups; the users' access comes from the assignment on the application group.", fr: "L'espace de travail ne fait que lister les groupes d'applications ; l'accès des utilisateurs vient de l'attribution sur le groupe d'applications." }
    references:
      - title: Date functions for Bicep
        url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/bicep/bicep-functions-date
      - title: Add session hosts to a host pool
        url: https://learn.microsoft.com/en-us/azure/virtual-desktop/add-session-hosts-host-pool
