chapter: 11-networking
questions:
  # ------------------------------------------------------------------ 1
  - id: az140-qz-11-01
    objective: "1.1.2"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        A user of Contoso opens a desktop in an Azure Virtual Desktop host pool named **HP1**. The session uses the default reverse connect transport.

        How does the session host take part in the connection?
      fr: |
        Un utilisateur de Contoso ouvre un bureau dans un pool d'hôtes Azure Virtual Desktop nommé **HP1**. La session utilise le transport reverse connect par défaut.

        Comment l'hôte de session participe-t-il à la connexion ?
    body:
      options:
        - { id: a, text: { en: "It accepts an inbound TCP 3389 connection that the gateway forwards to its private IP address.", fr: "Il accepte une connexion TCP 3389 entrante que la passerelle transfère vers son adresse IP privée." } }
        - { id: b, text: { en: "It opens an outbound TLS connection on TCP 443 to the gateway instance that the client reached.", fr: "Il ouvre une connexion TLS sortante sur TCP 443 vers l'instance de passerelle que le client a jointe." } }
        - { id: c, text: { en: "It accepts an inbound TCP 443 connection from Azure Front Door on its public IP address.", fr: "Il accepte une connexion TCP 443 entrante depuis Azure Front Door sur son adresse IP publique." } }
        - { id: d, text: { en: "It opens an outbound UDP 3390 connection to the broker, which then relays the session data.", fr: "Il ouvre une connexion UDP 3390 sortante vers le broker, qui relaie ensuite les données de la session." } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          With reverse connect, the broker uses the persistent channel that the agent opened at startup to tell the session host about the connection. The session host then opens its own outbound TLS connection to the same gateway instance as the client, and the gateway relays the traffic. No inbound port and no public IP address are needed on the session host.
        fr: |
          Avec reverse connect, le broker utilise le canal persistant que l'agent a ouvert au démarrage pour signaler la connexion à l'hôte de session. L'hôte de session ouvre alors sa propre connexion TLS sortante vers la même instance de passerelle que le client, et la passerelle relaie le trafic. Aucun port entrant ni aucune adresse IP publique n'est nécessaire sur l'hôte de session.
      options:
        a: { en: "Reverse connect doesn't use a listener on the session host: the gateway never opens a connection to TCP 3389.", fr: "Reverse connect n'utilise pas d'écouteur sur l'hôte de session : la passerelle n'ouvre jamais de connexion vers TCP 3389." }
        c: { en: "Azure Front Door helps the client reach a gateway; it doesn't connect to the session host, which needs no public IP address.", fr: "Azure Front Door aide le client à joindre une passerelle ; il ne se connecte pas à l'hôte de session, qui n'a besoin d'aucune adresse IP publique." }
        d: { en: "UDP 3390 is the inbound listener port of RDP Shortpath for managed networks, and the broker orchestrates the connection without relaying the data.", fr: "UDP 3390 est le port d'écoute entrant de RDP Shortpath pour les réseaux gérés, et le broker orchestre la connexion sans relayer les données." }
    references:
      - title: Understanding Azure Virtual Desktop network connectivity
        url: https://learn.microsoft.com/en-us/azure/virtual-desktop/network-connectivity

  # ------------------------------------------------------------------ 2
  - id: az140-qz-11-02
    objective: "1.1.1"
    difficulty: 1
    status: draft
    type: single
    shuffle: false
    stem:
      en: |
        Fabrikam is choosing the Azure region of a new Azure Virtual Desktop host pool for the users of its Lyon office. Microsoft publishes a latency target between the client's network and the Azure region that contains the host pools.

        Which round-trip time (RTT) should the chosen region offer to the Lyon office?
      fr: |
        Fabrikam choisit la région Azure d'un nouveau pool d'hôtes Azure Virtual Desktop pour les utilisateurs de son agence de Lyon. Microsoft publie un objectif de latence entre le réseau du client et la région Azure qui contient les pools d'hôtes.

        Quelle durée aller-retour (RTT) la région choisie doit-elle offrir à l'agence de Lyon ?
    body:
      options:
        - { id: a, text: { en: "Less than 30 ms", fr: "Moins de 30 ms" } }
        - { id: b, text: { en: "Less than 75 ms", fr: "Moins de 75 ms" } }
        - { id: c, text: { en: "Less than 150 ms", fr: "Moins de 150 ms" } }
        - { id: d, text: { en: "Less than 300 ms", fr: "Moins de 300 ms" } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          Microsoft states that the round-trip time from the client's network to the Azure region that contains the host pools should be less than 150 ms. Above that, and especially above 200 ms, users notice input delay; placing session hosts in the region closest to the users is the main lever.
        fr: |
          Microsoft indique que la durée aller-retour entre le réseau du client et la région Azure qui contient les pools d'hôtes doit être inférieure à 150 ms. Au-delà, et surtout au-delà de 200 ms, les utilisateurs perçoivent un retard de saisie ; placer les hôtes de session dans la région la plus proche des utilisateurs est le levier principal.
      options:
        a: { en: "30 ms is far stricter than the published target; requiring it would rule out regions that meet Microsoft's recommendation.", fr: "30 ms est bien plus strict que l'objectif publié ; l'exiger écarterait des régions qui respectent la recommandation de Microsoft." }
        b: { en: "75 ms isn't the published figure; the prerequisite target is less than 150 ms.", fr: "75 ms n'est pas la valeur publiée ; l'objectif des prérequis est inférieur à 150 ms." }
        d: { en: "300 ms is well above the target: at that latency users see input delay and disconnections.", fr: "300 ms est très au-dessus de l'objectif : à cette latence, les utilisateurs subissent un retard de saisie et des déconnexions." }
    references:
      - title: Prerequisites for Azure Virtual Desktop
        url: https://learn.microsoft.com/en-us/azure/virtual-desktop/prerequisites

  # ------------------------------------------------------------------ 3
  - id: az140-qz-11-03
    objective: "1.1.1"
    difficulty: 2
    status: draft
    type: single
    shuffle: false
    stem:
      en: |
        Tailspin Toys moves its finance team to an Azure Virtual Desktop host pool named **HP-Fin**. The sessions use the H.264/AVC 444 graphics mode on a single 1920 × 1080 monitor. At peak time, the team has these concurrent users:

        - 20 users who update Microsoft Excel workbooks with many formulas and charts;
        - 4 users who watch 30 FPS training videos on half of the screen.

        You must size the link of the team from the upper bound of Microsoft's reference figures. Which value should you use?
      fr: |
        Tailspin Toys déplace son équipe financière vers un pool d'hôtes Azure Virtual Desktop nommé **HP-Fin**. Les sessions utilisent le mode graphique H.264/AVC 444 sur un seul écran 1920 × 1080. En période de pointe, l'équipe compte ces utilisateurs simultanés :

        - 20 utilisateurs qui mettent à jour des classeurs Microsoft Excel contenant de nombreuses formules et de nombreux graphiques ;
        - 4 utilisateurs qui regardent des vidéos de formation à 30 i/s sur la moitié de l'écran.

        Vous devez dimensionner la liaison de l'équipe à partir de la borne haute des valeurs de référence de Microsoft. Quelle valeur devez-vous utiliser ?
    body:
      options:
        - { id: a, text: { en: "18 Mbps", fr: "18 Mbit/s" } }
        - { id: b, text: { en: "21.2 Mbps", fr: "21,2 Mbit/s" } }
        - { id: c, text: { en: "42 Mbps", fr: "42 Mbit/s" } }
        - { id: d, text: { en: "48 Mbps", fr: "48 Mbit/s" } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          In H.264/AVC 444 mode, the reference figures are 400–500 Kbps for Excel and 2.5–2.8 Mbps for half-screen video at 30 FPS. With the upper bounds: 20 × 0.5 Mbps = 10 Mbps, plus 4 × 2.8 Mbps = 11.2 Mbps, so 21.2 Mbps.
        fr: |
          En mode H.264/AVC 444, les valeurs de référence sont de 400–500 Kbit/s pour Excel et de 2,5–2,8 Mbit/s pour une vidéo en demi-écran à 30 i/s. Avec les bornes hautes : 20 × 0,5 Mbit/s = 10 Mbit/s, plus 4 × 2,8 Mbit/s = 11,2 Mbit/s, soit 21,2 Mbit/s.
      options:
        a: { en: "18 Mbps uses the lower bounds (20 × 0.4 + 4 × 2.5), not the upper bounds that the sizing requires.", fr: "18 Mbit/s utilise les bornes basses (20 × 0,4 + 4 × 2,5), pas les bornes hautes que le dimensionnement exige." }
        c: { en: "42 Mbps uses the default-mode figures (20 × 0.2 + 4 × 9.5), but the sessions use H.264/AVC 444 mode.", fr: "42 Mbit/s utilise les valeurs du mode par défaut (20 × 0,2 + 4 × 9,5), alors que les sessions utilisent le mode H.264/AVC 444." }
        d: { en: "48 Mbps mixes the H.264/AVC 444 figure for Excel with the default-mode figure for video (10 + 38).", fr: "48 Mbit/s mélange la valeur H.264/AVC 444 d'Excel et la valeur du mode par défaut de la vidéo (10 + 38)." }
    references:
      - title: Direct Stream (DS) bandwidth requirements
        url: https://learn.microsoft.com/en-us/azure/virtual-desktop/rdp-bandwidth

  # ------------------------------------------------------------------ 4
  - id: az140-qz-11-04
    objective: "1.1.4"
    difficulty: 2
    status: draft
    type: multi
    stem:
      en: |
        Northwind Traders has one Azure Virtual Desktop host pool named **HP1** and one workspace named **WS1**, which contains the application groups of HP1. Users work in offices connected to Azure over ExpressRoute. Private Link with Azure Virtual Desktop is enabled on the subscription.

        You need the feed download and the remote sessions to use private routes, while the initial feed discovery stays on public routes. You must create as few private endpoints as possible.

        Which two private endpoints should you create? Each correct answer presents part of the solution.

        NOTE: Each correct selection is worth one point.
      fr: |
        Northwind Traders dispose d'un pool d'hôtes Azure Virtual Desktop nommé **HP1** et d'un espace de travail nommé **WS1**, qui contient les groupes d'applications de HP1. Les utilisateurs travaillent dans des bureaux reliés à Azure par ExpressRoute. Private Link avec Azure Virtual Desktop est activé sur l'abonnement.

        Le téléchargement du flux et les sessions à distance doivent utiliser des routes privées, tandis que la découverte initiale du flux reste sur des routes publiques. Vous devez créer le moins de points de terminaison privés possible.

        Quels sont les deux points de terminaison privés que vous devez créer ? Chaque bonne réponse présente une partie de la solution.

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "A private endpoint on HP1 with the connection sub-resource", fr: "Un point de terminaison privé sur HP1 avec la sous-ressource connection" } }
        - { id: b, text: { en: "A private endpoint on WS1 with the global sub-resource", fr: "Un point de terminaison privé sur WS1 avec la sous-ressource global" } }
        - { id: c, text: { en: "A private endpoint on WS1 with the feed sub-resource", fr: "Un point de terminaison privé sur WS1 avec la sous-ressource feed" } }
        - { id: d, text: { en: "A private endpoint on HP1 with the feed sub-resource", fr: "Un point de terminaison privé sur HP1 avec la sous-ressource feed" } }
        - { id: e, text: { en: "A private endpoint on a new empty workspace with the global sub-resource", fr: "Un point de terminaison privé sur un nouvel espace de travail vide avec la sous-ressource global" } }
    answer: { optionIds: [a, c] }
    explanation:
      correct:
        en: |
          When only the initial feed discovery stays public, you need the `connection` sub-resource on each host pool for the remote sessions and the `feed` sub-resource on each workspace for the feed download. With one host pool and one workspace, that is two private endpoints.
        fr: |
          Quand seule la découverte initiale du flux reste publique, il faut la sous-ressource `connection` sur chaque pool d'hôtes pour les sessions à distance et la sous-ressource `feed` sur chaque espace de travail pour le téléchargement du flux. Avec un pool d'hôtes et un espace de travail, cela fait deux points de terminaison privés.
      options:
        b: { en: "The global sub-resource makes the initial feed discovery private, which isn't required; it also belongs on a dedicated workspace without application groups.", fr: "La sous-ressource global rend privée la découverte initiale du flux, ce qui n'est pas demandé ; elle doit en outre se trouver sur un espace de travail dédié, sans groupe d'applications." }
        d: { en: "The feed sub-resource is created on a workspace; a host pool only offers the connection sub-resource.", fr: "La sous-ressource feed se crée sur un espace de travail ; un pool d'hôtes ne propose que la sous-ressource connection." }
        e: { en: "A placeholder workspace with the global sub-resource is the right design for private discovery, but discovery may stay public here, so this endpoint adds nothing.", fr: "Un espace de travail réservé avec la sous-ressource global est la bonne conception pour une découverte privée, mais la découverte peut rester publique ici : ce point de terminaison n'apporte rien." }
    references:
      - title: Azure Private Link with Azure Virtual Desktop
        url: https://learn.microsoft.com/en-us/azure/virtual-desktop/private-link-overview

  # ------------------------------------------------------------------ 5
  - id: az140-qz-11-05
    objective: "1.1.3"
    difficulty: 2
    status: draft
    type: yesno_statements
    stem:
      en: |
        Woodgrove Bank users connect to an Azure Virtual Desktop host pool named **HP1** from the head office over ExpressRoute and from home over the internet. RDP Shortpath for managed networks is configured for HP1. You plan a Policy-based QoS policy on the session hosts to prioritize RDP traffic on the congested ExpressRoute links.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Les utilisateurs de Woodgrove Bank se connectent à un pool d'hôtes Azure Virtual Desktop nommé **HP1** depuis le siège par ExpressRoute et depuis leur domicile par internet. RDP Shortpath pour les réseaux gérés est configuré pour HP1. Vous prévoyez une stratégie de QoS basée sur une stratégie (Policy-based QoS) sur les hôtes de session pour donner la priorité au trafic RDP sur les liaisons ExpressRoute saturées.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - { id: s1, text: { en: "Microsoft recommends marking the RDP traffic with DSCP value 46, which maps to Expedited Forwarding.", fr: "Microsoft recommande de marquer le trafic RDP avec la valeur DSCP 46, qui correspond à Expedited Forwarding." } }
        - { id: s2, text: { en: "The DSCP marking gives the sessions of home users priority along their whole path across the internet.", fr: "Le marquage DSCP donne la priorité aux sessions des utilisateurs à domicile sur tout leur trajet à travers internet." } }
        - { id: s3, text: { en: "A session that falls back to the TCP reverse connect transport is also prioritized by the policy.", fr: "Une session qui se rabat sur le transport reverse connect TCP est elle aussi priorisée par la stratégie." } }
    answer:
      values: { s1: true, s2: false, s3: false }
    explanation:
      correct:
        en: |
          Microsoft recommends DSCP 46 (Expedited Forwarding) for RDP Shortpath for managed networks, matched on `svchost.exe`, UDP source port 3390. QoS works only when every link between client and session host honours it, so a remote user is prioritized only inside your managed network. QoS policies aren't supported for the reverse connect transport, so TCP sessions get no priority.
        fr: |
          Microsoft recommande DSCP 46 (Expedited Forwarding) pour RDP Shortpath pour les réseaux gérés, en ciblant `svchost.exe`, port source UDP 3390. La QoS ne fonctionne que si toutes les liaisons entre le client et l'hôte de session la respectent : un utilisateur distant n'est donc priorisé qu'à l'intérieur de votre réseau géré. Les stratégies QoS ne sont pas prises en charge pour le transport reverse connect : les sessions TCP n'obtiennent aucune priorité.
      options:
        s2: { en: "Internet links don't honour your DSCP marks: you can prioritize only within your internal, managed network.", fr: "Les liaisons internet ne respectent pas vos marquages DSCP : vous ne pouvez prioriser qu'à l'intérieur de votre réseau interne géré." }
        s3: { en: "QoS policies apply to RDP Shortpath for managed networks only; they aren't supported for reverse connect.", fr: "Les stratégies QoS ne s'appliquent qu'à RDP Shortpath pour les réseaux gérés ; elles ne sont pas prises en charge pour reverse connect." }
    references:
      - title: Implement Quality of Service (QoS) for Azure Virtual Desktop
        url: https://learn.microsoft.com/en-us/azure/virtual-desktop/rdp-quality-of-service-qos

  # ------------------------------------------------------------------ 6
  - id: az140-qz-11-06
    objective: "1.1.2"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Litware has an Azure Virtual Desktop host pool named **HP1**. The session hosts are in a spoke virtual network. Today, all their outbound traffic goes through a web proxy named **PX1**, which requires the session host computer accounts to authenticate and inspects all HTTPS traffic. An Azure Firewall named **FW1** in the hub virtual network can also route traffic to the internet.

        Since the deployment, the session hosts intermittently show as **Unavailable**, user sign-ins are slow, and **Connection Information** shows the transport **TCP** for every session.

        You need to resolve the issues by following Microsoft's guidance. Web browsing from the sessions must keep using PX1. What should you do?
      fr: |
        Litware dispose d'un pool d'hôtes Azure Virtual Desktop nommé **HP1**. Les hôtes de session se trouvent dans un réseau virtuel spoke. Aujourd'hui, tout leur trafic sortant passe par un proxy web nommé **PX1**, qui exige l'authentification des comptes d'ordinateur des hôtes de session et inspecte tout le trafic HTTPS. Un Pare-feu Azure nommé **FW1** dans le réseau virtuel hub peut aussi acheminer le trafic vers internet.

        Depuis le déploiement, les hôtes de session apparaissent par intermittence comme **Unavailable**, les connexions des utilisateurs sont lentes et **Informations de connexion** affiche le transport **TCP** pour chaque session.

        Vous devez résoudre ces problèmes en suivant les recommandations de Microsoft. La navigation web depuis les sessions doit continuer à utiliser PX1. Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Import the root certificate of PX1 on each session host so that the agent accepts the inspected TLS connections.", fr: "Importer le certificat racine de PX1 sur chaque hôte de session pour que l'agent accepte les connexions TLS inspectées." } }
        - { id: b, text: { en: "Configure RDAgent and Remote Desktop Services to use PX1 with the stored credentials of a dedicated service account.", fr: "Configurer RDAgent et les services Bureau à distance pour utiliser PX1 avec les informations d'identification stockées d'un compte de service dédié." } }
        - { id: c, text: { en: "Exclude Azure Virtual Desktop traffic from PX1 and route it through FW1 by using the WindowsVirtualDesktop service tag.", fr: "Exclure le trafic Azure Virtual Desktop de PX1 et l'acheminer par FW1 à l'aide de l'étiquette de service WindowsVirtualDesktop." } }
        - { id: d, text: { en: "Allow inbound UDP 3390 on the session hosts so that the RDP Shortpath traffic of the users can traverse PX1.", fr: "Autoriser UDP 3390 entrant sur les hôtes de session pour que le trafic RDP Shortpath des utilisateurs puisse traverser PX1." } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          Microsoft recommends bypassing proxies for Azure Virtual Desktop traffic, for example with service tags on Azure Firewall, a PAC file or a bypass list. A proxy that is the only path forces RDP over TCP, TLS inspection lengthens sign-ins and can stop the agent from working, and the agent can't authenticate to a proxy. Sending the service traffic through FW1 removes all three causes while browsing stays on PX1.
        fr: |
          Microsoft recommande de contourner les proxys pour le trafic Azure Virtual Desktop, par exemple avec des étiquettes de service sur le Pare-feu Azure, un fichier PAC ou une liste d'exclusion. Un proxy qui est le seul chemin force RDP sur TCP, l'inspection TLS allonge les connexions et peut empêcher l'agent de fonctionner, et l'agent ne peut pas s'authentifier auprès d'un proxy. Envoyer le trafic du service par FW1 supprime ces trois causes, tandis que la navigation reste sur PX1.
      options:
        a: { en: "Trusting the proxy certificate doesn't make TLS inspection supported: Microsoft says not to use SSL termination, and the TCP and authentication problems remain.", fr: "Approuver le certificat du proxy ne rend pas l'inspection TLS prise en charge : Microsoft demande de ne pas utiliser de terminaison SSL, et les problèmes de TCP et d'authentification demeurent." }
        b: { en: "Azure Virtual Desktop components run in the context of the operating system and don't support proxies that require authentication.", fr: "Les composants Azure Virtual Desktop s'exécutent dans le contexte du système d'exploitation et ne prennent pas en charge les proxys qui exigent une authentification." }
        d: { en: "UDP doesn't go through a web proxy, and the inbound listener is used only for managed networks; the agent and sign-in issues remain.", fr: "UDP ne passe pas par un proxy web, et l'écouteur entrant ne sert qu'aux réseaux gérés ; les problèmes d'agent et de connexion demeurent." }
    references:
      - title: Proxy server guidelines for Azure Virtual Desktop
        url: https://learn.microsoft.com/en-us/azure/virtual-desktop/proxy-server-support

  # ------------------------------------------------------------------ 7
  - id: az140-qz-11-07
    objective: "1.1.2"
    difficulty: 3
    status: draft
    type: hotarea
    stem:
      en: |
        Adatum is deploying an Azure Virtual Desktop host pool named **HP-East**. You will create the session hosts in the **East US** region in the same deployment as the host pool, and join them to the AD DS domain adatum.com. The domain controllers DC1 (10.10.0.4) and DC2 (10.10.0.5) run DNS and are in a virtual network named **VNet-Hub** in East US. VNet-Hub contains no firewall or network virtual appliance.

        The following table shows the virtual networks that you can select for the session hosts. Every listed subnet has enough free addresses.

        Which virtual network should you select? To answer, select the appropriate virtual network in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Adatum déploie un pool d'hôtes Azure Virtual Desktop nommé **HP-East**. Vous allez créer les hôtes de session dans la région **East US** dans le même déploiement que le pool d'hôtes, et les joindre au domaine AD DS adatum.com. Les contrôleurs de domaine DC1 (10.10.0.4) et DC2 (10.10.0.5) exécutent DNS et se trouvent dans un réseau virtuel nommé **VNet-Hub** dans East US. VNet-Hub ne contient ni pare-feu ni appliance virtuelle réseau.

        Le tableau suivant présente les réseaux virtuels que vous pouvez sélectionner pour les hôtes de session. Chaque sous-réseau listé dispose de suffisamment d'adresses libres.

        Quel réseau virtuel devez-vous sélectionner ? Pour répondre, sélectionnez le réseau virtuel approprié dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      prompts:
        - id: p1
          text: { en: "Virtual network for the session hosts of HP-East", fr: "Réseau virtuel des hôtes de session de HP-East" }
      grid:
        header:
          - { en: "Virtual network", fr: "Réseau virtuel" }
          - { en: "Region", fr: "Région" }
          - { en: "DNS servers", fr: "Serveurs DNS" }
          - { en: "Peering with VNet-Hub", fr: "Peering avec VNet-Hub" }
          - { en: "Outbound access of the subnet", fr: "Accès sortant du sous-réseau" }
        rows:
          - [ { text: VNet1, area: v1 }, { text: West Europe }, { text: "10.10.0.4, 10.10.0.5" }, { text: Connected }, { text: { en: "NAT gateway", fr: "Passerelle NAT" } } ]
          - [ { text: VNet2, area: v2 }, { text: East US }, { text: { en: "Default (Azure-provided)", fr: "Par défaut (fourni par Azure)" } }, { text: Connected }, { text: { en: "NAT gateway", fr: "Passerelle NAT" } } ]
          - [ { text: VNet3, area: v3 }, { text: East US }, { text: "10.10.0.4, 10.10.0.5" }, { text: Connected }, { text: { en: "None (private subnet)", fr: "Aucun (sous-réseau privé)" } } ]
          - [ { text: VNet4, area: v4 }, { text: East US }, { text: "10.10.0.4, 10.10.0.5" }, { text: Connected }, { text: { en: "NAT gateway", fr: "Passerelle NAT" } } ]
          - [ { text: VNet5, area: v5 }, { text: East US }, { text: "10.10.0.4, 10.10.0.5" }, { text: { en: "None", fr: "Aucun" } }, { text: { en: "NAT gateway", fr: "Passerelle NAT" } } ]
    answer:
      values: { p1: v4 }
    explanation:
      correct:
        en: |
          The session host virtual network must be in the same region as the session hosts, must reach the domain controllers and DNS servers for the domain join, and must give outbound access to the required endpoints. VNet4 is in East US, uses the domain controllers as DNS servers, is peered with VNet-Hub and has a NAT gateway for explicit outbound access.
        fr: |
          Le réseau virtuel des hôtes de session doit se trouver dans la même région que les hôtes de session, joindre les contrôleurs de domaine et les serveurs DNS pour la jonction au domaine, et offrir un accès sortant vers les points de terminaison requis. VNet4 est dans East US, utilise les contrôleurs de domaine comme serveurs DNS, est relié à VNet-Hub par un peering et dispose d'une passerelle NAT pour l'accès sortant explicite.
      options:
        v1: { en: "VNet1 is in West Europe: the virtual network must be in the same region as the session hosts.", fr: "VNet1 est dans West Europe : le réseau virtuel doit se trouver dans la même région que les hôtes de session." }
        v2: { en: "With Azure-provided DNS, the session hosts can't locate the adatum.com domain, so the domain join fails.", fr: "Avec le DNS fourni par Azure, les hôtes de session ne trouvent pas le domaine adatum.com : la jonction au domaine échoue." }
        v3: { en: "A private subnet without a NAT gateway or other outbound method can't reach the required Azure Virtual Desktop endpoints, Windows activation or updates.", fr: "Un sous-réseau privé sans passerelle NAT ni autre méthode sortante ne peut pas joindre les points de terminaison Azure Virtual Desktop requis, l'activation de Windows ni les mises à jour." }
        v5: { en: "Without peering, the DNS servers 10.10.0.4 and 10.10.0.5 and the domain controllers are unreachable from VNet5.", fr: "Sans peering, les serveurs DNS 10.10.0.4 et 10.10.0.5 et les contrôleurs de domaine sont injoignables depuis VNet5." }
    references:
      - title: Prerequisites for Azure Virtual Desktop
        url: https://learn.microsoft.com/en-us/azure/virtual-desktop/prerequisites

  # ------------------------------------------------------------------ 8
  - id: az140-qz-11-08
    objective: "1.1.4"
    difficulty: 3
    status: draft
    type: dragdrop
    stem:
      en: |
        Contoso uses Azure Private Link with Azure Virtual Desktop. Every host pool has a private endpoint with the connection sub-resource, and every workspace has a private endpoint with the feed sub-resource. Staff connect over ExpressRoute; contractors connect from the internet without VPN. You must configure public access as follows:

        - **HP-Fin**: a session must be refused unless both the user's device and the session host use private routes.
        - **HP-Lab**: contractors must be able to connect, and the session hosts must never reach the service over public routes.
        - **HP-Test**: the session hosts still reach the service over public routes during a network migration, and staff and contractors must keep working.
        - **WS-Fin**, the workspace of HP-Fin: feed requests from public routes must be denied.

        Which public access setting should you configure for each resource? To answer, drag the appropriate settings to the correct resources. Each setting may be used once, more than once, or not at all.

        NOTE: Each correct selection is worth one point.
      fr: |
        Contoso utilise Azure Private Link avec Azure Virtual Desktop. Chaque pool d'hôtes dispose d'un point de terminaison privé avec la sous-ressource connection, et chaque espace de travail d'un point de terminaison privé avec la sous-ressource feed. Les employés se connectent par ExpressRoute ; les prestataires se connectent depuis internet sans VPN. Vous devez configurer l'accès public comme suit :

        - **HP-Fin** : une session doit être refusée sauf si l'appareil de l'utilisateur et l'hôte de session utilisent tous deux des routes privées.
        - **HP-Lab** : les prestataires doivent pouvoir se connecter, et les hôtes de session ne doivent jamais joindre le service par des routes publiques.
        - **HP-Test** : les hôtes de session joignent encore le service par des routes publiques pendant une migration réseau, et les employés comme les prestataires doivent continuer à travailler.
        - **WS-Fin**, l'espace de travail de HP-Fin : les demandes de flux venant de routes publiques doivent être refusées.

        Quel paramètre d'accès public devez-vous configurer pour chaque ressource ? Pour répondre, faites glisser les paramètres appropriés vers les ressources correspondantes. Chaque paramètre peut être utilisé une fois, plusieurs fois ou pas du tout.

        Remarque : chaque sélection correcte vaut un point.
    body:
      reuse: true
      items:
        - { id: all, text: Enable public access from all networks }
        - { id: users, text: "Enable public access for end users, use private access for session hosts" }
        - { id: none, text: Disable public access and use private access }
      targets:
        - { id: fin, text: HP-Fin }
        - { id: lab, text: HP-Lab }
        - { id: test, text: HP-Test }
        - { id: ws, text: WS-Fin }
    answer:
      mapping: { fin: none, lab: users, test: all, ws: none }
    explanation:
      correct:
        en: |
          **Disable public access and use private access** allows a session only when both the client and the session host use private routes (HP-Fin), and on a workspace it denies feed requests from public routes (WS-Fin). **Enable public access for end users, use private access for session hosts** accepts any client route as long as the session host is private (HP-Lab). Only **Enable public access from all networks** accepts session hosts that still use public routes (HP-Test).
        fr: |
          **Disable public access and use private access** n'autorise une session que si le client et l'hôte de session utilisent tous deux des routes privées (HP-Fin) ; sur un espace de travail, il refuse les demandes de flux venant de routes publiques (WS-Fin). **Enable public access for end users, use private access for session hosts** accepte toute route côté client tant que l'hôte de session est privé (HP-Lab). Seul **Enable public access from all networks** accepte des hôtes de session qui utilisent encore des routes publiques (HP-Test).
      options:
        users: { en: "On HP-Test, this setting would refuse every session, because the session hosts still use public routes.", fr: "Sur HP-Test, ce paramètre refuserait toutes les sessions, car les hôtes de session utilisent encore des routes publiques." }
        none: { en: "On HP-Lab, this setting would block the contractors, whose devices use public routes.", fr: "Sur HP-Lab, ce paramètre bloquerait les prestataires, dont les appareils utilisent des routes publiques." }
    references:
      - title: Azure Private Link with Azure Virtual Desktop
        url: https://learn.microsoft.com/en-us/azure/virtual-desktop/private-link-overview
      - title: Set up Private Link with Azure Virtual Desktop
        url: https://learn.microsoft.com/en-us/azure/virtual-desktop/private-link-setup

  # ------------------------------------------------------------------ 9
  - id: az140-qz-11-09
    objective: "1.1.5"
    difficulty: 3
    status: draft
    type: dropdown
    stem:
      en: |
        The diagnostic settings of an Azure Virtual Desktop host pool named **HP1** send all logs to a Log Analytics workspace. HP1 has a private endpoint, and its public access is set to **Enable public access for end users, use private access for session hosts**.

        The network team wants to know how many connections of the last seven days used a public route on the client side, for each gateway region. Each connection must be counted once.

        How should you complete the query? To answer, select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Les paramètres de diagnostic d'un pool d'hôtes Azure Virtual Desktop nommé **HP1** envoient tous les journaux vers un espace de travail Log Analytics. HP1 dispose d'un point de terminaison privé, et son accès public est réglé sur **Enable public access for end users, use private access for session hosts**.

        L'équipe réseau veut connaître, pour chaque région de passerelle, le nombre de connexions des sept derniers jours qui ont utilisé une route publique côté client. Chaque connexion doit être comptée une seule fois.

        Comment devez-vous compléter la requête ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: code
      language: kusto
      template: |
        [[tbl]]
        | where TimeGenerated > ago(7d)
        | where [[col]] =~ "false"
        | summarize Connections = [[agg]] by [[grp]]
      slots:
        - id: tbl
          options:
            - { id: conn, text: WVDConnections }
            - { id: net, text: WVDConnectionNetworkData }
            - { id: err, text: WVDErrors }
            - { id: chk, text: WVDCheckpoints }
        - id: col
          options:
            - { id: shpl, text: IsSessionHostPrivateLink }
            - { id: clpl, text: IsClientPrivateLink }
            - { id: tt, text: TransportType }
            - { id: cip, text: ClientSideIPAddress }
        - id: agg
          options:
            - { id: cnt, text: "count()" }
            - { id: dcu, text: "dcount(UserName)" }
            - { id: dcc, text: "dcount(CorrelationId)" }
            - { id: dch, text: "dcount(SessionHostName)" }
        - id: grp
          options:
            - { id: gw, text: GatewayRegion }
            - { id: host, text: SessionHostName }
            - { id: ctype, text: ClientType }
            - { id: hostos, text: SessionHostOSVersion }
    answer:
      values: { tbl: conn, col: clpl, agg: dcc, grp: gw }
    explanation:
      correct:
        en: |
          `WVDConnections` holds the orchestration data of each connection, including `IsClientPrivateLink`, which is true when the client side used a private endpoint, and `GatewayRegion`. The table has one record per connection state, so `count()` would count each connection several times; `dcount(CorrelationId)` counts each connection once.
        fr: |
          `WVDConnections` contient les données d'orchestration de chaque connexion, dont `IsClientPrivateLink`, vrai quand le côté client a utilisé un point de terminaison privé, et `GatewayRegion`. La table contient un enregistrement par état de connexion : `count()` compterait chaque connexion plusieurs fois, alors que `dcount(CorrelationId)` compte chaque connexion une seule fois.
      options:
        net: { en: "WVDConnectionNetworkData holds round-trip time and bandwidth samples, not the Private Link columns.", fr: "WVDConnectionNetworkData contient des mesures de durée aller-retour et de bande passante, pas les colonnes Private Link." }
        shpl: { en: "IsSessionHostPrivateLink describes the session host side; with this setting, session hosts always use private routes.", fr: "IsSessionHostPrivateLink décrit le côté hôte de session ; avec ce paramètre, les hôtes de session utilisent toujours des routes privées." }
        cnt: { en: "count() counts every state record of a connection, so each connection is counted more than once.", fr: "count() compte chaque enregistrement d'état d'une connexion : chaque connexion est comptée plusieurs fois." }
        dcu: { en: "dcount(UserName) counts users, not connections: a user who connects several times is counted once.", fr: "dcount(UserName) compte des utilisateurs, pas des connexions : un utilisateur qui se connecte plusieurs fois n'est compté qu'une fois." }
    references:
      - title: Azure Monitor Logs reference - WVDConnections
        url: https://learn.microsoft.com/en-us/azure/azure-monitor/reference/tables/wvdconnections

  # ------------------------------------------------------------------ 10
  - id: az140-qz-11-10
    objective: "1.1.3"
    difficulty: 3
    status: draft
    type: dropdown
    stem:
      en: |
        Fabrikam has two Azure Virtual Desktop host pools named **HP1** and **HP2**. The session host subnets of both host pools reach the internet through an Azure NAT Gateway. On every session host, the **Enable RDP Shortpath for managed networks** policy setting is enabled and the host was restarted. Windows Firewall and the network security groups allow inbound UDP 3390 from the head office range, and outbound UDP from the session hosts is allowed, including UDP 3478 to 51.5.0.0/16.

        Head office users connect over ExpressRoute private peering. Home users connect over the internet through routers that use cone-shaped NAT.

        | RDP Shortpath setting | HP1 | HP2 |
        | --- | --- | --- |
        | RDP Shortpath for managed networks | Enabled | Enabled |
        | RDP Shortpath for managed networks with ICE/STUN | Enabled | Enabled |
        | RDP Shortpath for public networks with ICE/STUN | Enabled | Disabled |
        | RDP Shortpath for public networks via TURN | Disabled | Enabled |

        Which transport will each connection use? To answer, select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Fabrikam dispose de deux pools d'hôtes Azure Virtual Desktop nommés **HP1** et **HP2**. Les sous-réseaux des hôtes de session des deux pools joignent internet par une Azure NAT Gateway. Sur chaque hôte de session, le paramètre de stratégie **Enable RDP Shortpath for managed networks** est activé et l'hôte a été redémarré. Le Pare-feu Windows et les groupes de sécurité réseau autorisent UDP 3390 entrant depuis la plage du siège, et l'UDP sortant depuis les hôtes de session est autorisé, y compris UDP 3478 vers 51.5.0.0/16.

        Les utilisateurs du siège se connectent par le peering privé ExpressRoute. Les utilisateurs à domicile se connectent par internet via des routeurs qui utilisent un NAT de type cône.

        | Paramètre RDP Shortpath | HP1 | HP2 |
        | --- | --- | --- |
        | RDP Shortpath for managed networks | Enabled | Enabled |
        | RDP Shortpath for managed networks with ICE/STUN | Enabled | Enabled |
        | RDP Shortpath for public networks with ICE/STUN | Enabled | Disabled |
        | RDP Shortpath for public networks via TURN | Disabled | Enabled |

        Quel transport chaque connexion utilisera-t-elle ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: text
      template:
        en: |
          A head office user connects to HP2: [[hq2]]

          A home user connects to HP1: [[home1]]

          A home user connects to HP2: [[home2]]
        fr: |
          Un utilisateur du siège se connecte à HP2 : [[hq2]]

          Un utilisateur à domicile se connecte à HP1 : [[home1]]

          Un utilisateur à domicile se connecte à HP2 : [[home2]]
      slots:
        - id: hq2
          options:
            - { id: mgd, text: { en: "Direct UDP to the listener on UDP 3390", fr: "UDP direct vers l'écouteur sur UDP 3390" } }
            - { id: stun, text: { en: "Direct UDP found through public STUN", fr: "UDP direct trouvé par STUN public" } }
            - { id: turn, text: { en: "UDP relayed by a TURN server", fr: "UDP relayé par un serveur TURN" } }
            - { id: tcp, text: { en: "TCP reverse connect through a gateway", fr: "Reverse connect TCP par une passerelle" } }
        - id: home1
          options:
            - { id: mgd, text: { en: "Direct UDP to the listener on UDP 3390", fr: "UDP direct vers l'écouteur sur UDP 3390" } }
            - { id: stun, text: { en: "Direct UDP found through public STUN", fr: "UDP direct trouvé par STUN public" } }
            - { id: turn, text: { en: "UDP relayed by a TURN server", fr: "UDP relayé par un serveur TURN" } }
            - { id: tcp, text: { en: "TCP reverse connect through a gateway", fr: "Reverse connect TCP par une passerelle" } }
        - id: home2
          options:
            - { id: mgd, text: { en: "Direct UDP to the listener on UDP 3390", fr: "UDP direct vers l'écouteur sur UDP 3390" } }
            - { id: stun, text: { en: "Direct UDP found through public STUN", fr: "UDP direct trouvé par STUN public" } }
            - { id: turn, text: { en: "UDP relayed by a TURN server", fr: "UDP relayé par un serveur TURN" } }
            - { id: tcp, text: { en: "TCP reverse connect through a gateway", fr: "Reverse connect TCP par une passerelle" } }
    answer:
      values: { hq2: mgd, home1: tcp, home2: turn }
    explanation:
      correct:
        en: |
          Head office users reach the 3390 listener over ExpressRoute, and disabling public STUN on HP2 doesn't affect the managed-network options; the direct managed path is usually established first. Azure NAT Gateway is a symmetric NAT, so a direct STUN path from the internet fails even when the home router uses cone NAT: HP1 has TURN disabled, so its home sessions stay on TCP reverse connect, while HP2 relays them through TURN.
        fr: |
          Les utilisateurs du siège joignent l'écouteur 3390 par ExpressRoute, et la désactivation de STUN public sur HP2 n'affecte pas les options des réseaux gérés ; le chemin géré direct est généralement établi en premier. Azure NAT Gateway est un NAT symétrique : un chemin STUN direct depuis internet échoue même quand le routeur domestique utilise un NAT de type cône. HP1 a TURN désactivé, ses sessions à domicile restent donc sur reverse connect TCP, alors que HP2 les relaie par TURN.
      options:
        stun: { en: "Public STUN needs a NAT that keeps the same public IP:port mapping; the symmetric NAT of Azure NAT Gateway prevents it, and on HP2 it's also disabled.", fr: "STUN public exige un NAT qui conserve le même mappage IP:port public ; le NAT symétrique d'Azure NAT Gateway l'empêche, et sur HP2 il est en plus désactivé." }
        turn: { en: "TURN is the fallback for symmetric NAT, but it's disabled on HP1, and head office users get the faster direct managed path on HP2.", fr: "TURN est le recours en cas de NAT symétrique, mais il est désactivé sur HP1, et les utilisateurs du siège obtiennent sur HP2 le chemin géré direct, plus rapide." }
    references:
      - title: RDP Shortpath for Azure Virtual Desktop
        url: https://learn.microsoft.com/en-us/azure/virtual-desktop/rdp-shortpath
      - title: Configure RDP Shortpath for Azure Virtual Desktop
        url: https://learn.microsoft.com/en-us/azure/virtual-desktop/configure-rdp-shortpath
