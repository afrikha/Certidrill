# AWS EN -> FR terminology glossary for the AWS certifications (SAA-C03, CLF-C02, AIF-C01), same term format as content/glossary.yaml.
# Built from AWS's own French documentation (docs.aws.amazon.com/fr_fr/...), plus a few aws.amazon.com/fr pages
# where no fr_fr docs page was available (shared responsibility, responsible AI, Free Tier, some ML 'what is' pages).
# confirmed: true  = the French form was seen verbatim (case/plural-insensitive) on the fetched page in `source`.
# confirmed: false = not seen on any fetched page; `note` says why. Do not use without checking.
# also_seen = other French variants AWS itself uses for the same concept on fetched pages.
# avoid = variants writers must not use in French prose (case-sensitive, whole-word matching). None of them is a
#   form AWS fr_fr uses in French prose; the few exceptions (code, URLs, untranslated console labels, stray slips) are explained in `note`.
# keep_in_english = AWS service / feature names that AWS fr_fr keeps in English (all seen in English on fetched pages).
# Note: AWS fr_fr translates the IAM service long name ('Gestion des identités et des accès AWS (IAM)') and
#   'Reserved Instances' ('instances réservées', followed in our texts: owner decision 2026-11-20).
# Check date: 2026-11-19.
