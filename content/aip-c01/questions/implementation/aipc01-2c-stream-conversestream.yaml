id: aipc01-2c-stream-conversestream
objective: "2.4.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company's support chat calls the Amazon Bedrock `Converse` API. Users complain that they look at an empty window for about 15 seconds before the full answer appears. The company wants the text to appear while the model generates it.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Lower `maxTokens` in `inferenceConfig` so that the model finishes each answer sooner.
    - id: b
      text:
        en: |-
          Call `ConverseStream`, and send the text of each `contentBlockDelta` event to the chat window.
    - id: c
      text:
        en: |-
          Add `stopSequences` to the request so that the model returns the answer in several shorter responses.
    - id: d
      text:
        en: |-
          Submit the questions as a batch inference job, and display each result when it is written to Amazon S3.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      `ConverseStream` returns the response as a stream of events, and each `contentBlockDelta` event carries incremental text that the application can display immediately.
  options:
    a:
      en: |-
        A lower limit truncates answers, and each answer is still delivered only when it is complete.
    c:
      en: |-
        Stop sequences end generation; they do not split one answer into increments.
    d:
      en: |-
        Batch inference is asynchronous offline processing and does not suit an interactive chat.
references:
  - title: "ConverseStream - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/APIReference/API_runtime_ConverseStream.html
