id: aipc01-2a-reviewer-edits-output
objective: "2.1.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A marketing company uses an AWS Step Functions Standard workflow in which a foundation model drafts a customer email, and a Task state with .waitForTaskToken sends the draft and the task token to a review application. Reviewers can approve the draft as is, edit it and approve it, or reject it. When a reviewer edits a draft, the edited version must be the one that the next state sends to the customer, and the workflow must resume as soon as the reviewer submits.

    How should the review application return an edited and approved draft?
body:
  options:
    - id: a
      text:
        en: |-
          Call SendTaskSuccess with the task token and an output that contains the edited draft, and have the next state send the draft from that output.
    - id: b
      text:
        en: |-
          Call SendTaskFailure with the task token and the edited draft in the cause, and route the error to the sending state with a catcher.
    - id: c
      text:
        en: |-
          Call SendTaskHeartbeat with the task token and the edited draft so that the Task state receives the new content.
    - id: d
      text:
        en: |-
          Save the edited draft in Amazon S3, and add a Wait state after the Task state that waits one hour before the sending state reads the draft from S3.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      SendTaskSuccess completes the waiting Task state with the output that the caller provides, so the reviewer's edited draft becomes the state's result and flows to the next state, which resumes immediately.
  options:
    b:
      en: |-
        SendTaskFailure is for rejections and errors; sending approvals through the failure path mixes the two outcomes and passes the draft as an error cause string.
    c:
      en: |-
        SendTaskHeartbeat only reports that the work is still in progress so that the heartbeat timeout does not fire; it does not complete the task or pass content.
    d:
      en: |-
        A fixed Wait state delays every approved email and does not resume as soon as the reviewer submits.
references:
  - title: Discover service integration patterns in Step Functions - AWS Step Functions
    url: https://docs.aws.amazon.com/step-functions/latest/dg/connect-to-resource.html
