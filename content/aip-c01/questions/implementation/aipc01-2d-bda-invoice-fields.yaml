id: aipc01-2d-bda-invoice-fields
objective: "2.5.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An accounting firm receives supplier invoices as PDF files in an Amazon S3 bucket. For every invoice, it must extract the invoice number, supplier name, due date, and total amount as JSON, with a confidence score for each value, and load the values into its ERP system. The firm doesn't want to train, fine-tune, or host any model.

    Which solution will meet these requirements?
body:
  options:
    - { id: a, text: { en: "Process the files with Amazon Bedrock Data Automation using standard output only, and read the four values from the document summary." } }
    - { id: b, text: { en: "Process the files with Amazon Bedrock Data Automation using a project with an invoice blueprint that defines the four fields." } }
    - { id: c, text: { en: "Train an Amazon Comprehend custom entity recognizer on labeled invoices, and run it on the text of each invoice file." } }
    - { id: d, text: { en: "Fine-tune a foundation model on sample invoices in Amazon SageMaker AI, and host it on a SageMaker AI endpoint." } }
answer: { optionId: b }
explanation:
  correct:
    en: "Bedrock Data Automation custom output uses a blueprint, a list of the fields to extract, which can be created or taken from the BDA blueprint catalog. A project that contains the blueprint is passed to InvokeDataAutomationAsync, and the document results include confidence scores, with no model to train or host."
  options:
    a:
      en: "Standard output returns default results for the data type, such as a document summary, not a defined set of named fields in a fixed JSON shape."
    c:
      en: "A custom entity recognizer must be trained on labeled examples, which the firm doesn't want to do."
    d:
      en: "Fine-tuning and hosting a model is exactly the training and hosting effort the firm wants to avoid."
references:
  - title: "How Bedrock Data Automation works - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/bda-how-it-works.html
  - title: "Blueprints - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/bda-blueprint-info.html
