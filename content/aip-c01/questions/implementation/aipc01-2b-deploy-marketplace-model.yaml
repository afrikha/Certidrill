id: aipc01-2b-deploy-marketplace-model
objective: "2.2.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A legal-tech company wants to use a specialized model that is listed in Amazon Bedrock Marketplace. Its application already uses Amazon Bedrock Guardrails and Amazon Bedrock Knowledge Bases with other models through the Converse API, and the team wants to keep the same APIs and features for the new model.

    Which two steps should the company take? (Choose two.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Subscribe to the model and deploy it to an endpoint managed by SageMaker AI.
    - id: b
      text:
        en: |-
          Download the model weights from the Marketplace listing and import them with Amazon Bedrock Custom Model Import.
    - id: c
      text:
        en: |-
          Call the model through the Bedrock Converse API with the Marketplace endpoint as the model ID and the existing guardrail.
    - id: d
      text:
        en: |-
          Purchase Provisioned Throughput for the Marketplace model so that it can be invoked through Amazon Bedrock.
    - id: e
      text:
        en: |-
          Call the endpoint with the SageMaker AI InvokeEndpoint API and pass the guardrail configuration in the request body.
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |-
      After subscribing to a Bedrock Marketplace model, the company deploys it to an endpoint managed by SageMaker AI. The model is then accessed through Bedrock APIs (InvokeModel, Converse or the console), which lets it work natively with Bedrock tools such as Guardrails, Knowledge Bases and Agents.
  options:
    b:
      en: |-
        Custom Model Import is for customized open-source models in Hugging Face format; Marketplace models are deployed from the Marketplace catalog.
    d:
      en: |-
        Marketplace models run on the SageMaker AI endpoint that the company deploys; no Provisioned Throughput purchase is involved.
    e:
      en: |-
        Calling the endpoint through SageMaker AI bypasses the Bedrock APIs, so Bedrock Guardrails isn't applied through that call.
references:
  - title: "Amazon Bedrock Marketplace - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/amazon-bedrock-marketplace.html
