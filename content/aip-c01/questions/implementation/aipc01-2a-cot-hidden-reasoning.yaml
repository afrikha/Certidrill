id: aipc01-2a-cot-hidden-reasoning
objective: "2.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An accounting software company has an assistant that answers multi-step questions about expense allocations. Tests show that answers are more accurate when the model writes out its intermediate reasoning before the answer. Users must see only the final answer, and auditors must be able to review the reasoning that produced each answer. The company wants to use one model call per question.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Instruct the model to answer directly without intermediate reasoning, and log each prompt and each answer to Amazon CloudWatch Logs so that the auditors can review them.
    - id: b
      text:
        en: |-
          Ask the model for its reasoning inside thinking tags and its answer inside answer tags, and have a Lambda function log the reasoning and return only the answer.
    - id: c
      text:
        en: |-
          Instruct the model to reason step by step, and configure an Amazon Bedrock guardrail with a denied topic that blocks the reasoning text before the response reaches users.
    - id: d
      text:
        en: |-
          Send each question twice: once with a prompt that asks for a direct answer for the user, and once with a prompt that asks for step-by-step reasoning for the auditors.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      Chain-of-thought prompting with separate tags keeps the accuracy benefit of written reasoning while letting the application parse the response. The Lambda function stores the reasoning for audit and returns only the content of the answer tags, all from a single model call.
  options:
    a:
      en: |-
        Removing the reasoning loses the accuracy gain that tests showed, and there would be no reasoning for auditors to review.
    c:
      en: |-
        A denied topic blocks the response or the prompt when it detects the topic; it does not cut one part of a response out, so the user could receive a blocked message instead of the answer.
    d:
      en: |-
        Two calls double the cost, break the one-call requirement, and the logged reasoning would not be the reasoning that produced the answer the user saw.
references:
  - title: Design a prompt - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/design-a-prompt.html
