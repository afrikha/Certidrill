id: aipc01-2c-api-batch-offline
objective: "2.4.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An e-commerce company must rewrite 400,000 product descriptions with a model on Amazon Bedrock within the next week. No user waits for the results, which will be loaded into the catalog after all of them are ready. The company wants the MOST cost-effective solution with minimal custom code.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Put each description in an Amazon SQS queue, and have a Lambda function call the `Converse` API on demand for each message.
    - id: b
      text:
        en: |-
          Purchase Provisioned Throughput for one month, and run a batch inference job on the provisioned model to process the records.
    - id: c
      text:
        en: |-
          Upload the records to Amazon S3, run a batch inference job, and load the output when EventBridge reports that the job completed.
    - id: d
      text:
        en: |-
          Use a Step Functions Distributed Map state that calls the Amazon Bedrock `InvokeModel` task for each description.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      Batch inference reads the prompts from S3 and writes the outputs to S3 at a lower price than on-demand inference, and Amazon EventBridge reports job state changes so that no polling code is needed.
  options:
    a:
      en: |-
        Each message is an on-demand call at the higher on-demand price, and the queue and concurrency settings need extra code and tuning.
    b:
      en: |-
        Batch inference is not supported for provisioned models, and the commitment adds cost.
    d:
      en: |-
        Each item is still an on-demand invocation, and the workflow must handle throttling across 400,000 calls.
references:
  - title: "Process multiple prompts with batch inference - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/batch-inference.html
