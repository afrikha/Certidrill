id: aipc01-2b-llm-speculative-decoding
objective: "2.2.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company's coding assistant uses an LLM hosted on Amazon SageMaker AI. Users complain about slow generation. The company must keep the same instance type and must not accept any change in the quality of the generated text.

    Which SageMaker AI inference optimization technique will reduce generation latency?
body:
  options:
    - id: a
      text:
        en: |-
          Quantization of the weights to FP8 to reduce the memory and bandwidth that the model needs.
    - id: b
      text:
        en: |-
          Fast model loading so that the weights are streamed directly onto the GPUs.
    - id: c
      text:
        en: |-
          Speculative decoding, in which a draft model proposes tokens that the model verifies.
    - id: d
      text:
        en: |-
          Replacement of the model with a smaller student model distilled from it.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      Speculative decoding uses a smaller, faster draft model to propose candidate tokens that the larger target model verifies, which optimizes latency without compromising the quality of the generated text. SageMaker AI provides a pre-built draft model and also supports custom draft models.
  options:
    a:
      en: |-
        A quantized model might be less accurate than the source model, which the quality requirement forbids.
    b:
      en: |-
        Fast model loading speeds up deployment and scale-out, not token generation for requests being served.
    d:
      en: |-
        A distilled model is a different, smaller model whose outputs can differ from the original model's.
references:
  - title: "Inference optimization for Amazon SageMaker AI models - Amazon SageMaker AI"
    url: https://docs.aws.amazon.com/sagemaker/latest/dg/model-optimize.html
