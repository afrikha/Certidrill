id: aipc01-2c-stream-websocket-worker
objective: "2.4.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company builds a chat assistant with an API Gateway WebSocket API whose route integration is a Lambda function. Users must see tokens as they are generated and must be able to send a "stop" message while an answer is being written. Some answers take more than 60 seconds to generate.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Have the route's Lambda function call `Converse` and return the complete answer to the client as the route response.
    - id: b
      text:
        en: |-
          Request an increase of the WebSocket integration timeout to 120 seconds, and have the route function return the tokens in its response.
    - id: c
      text:
        en: |-
          Have the route function start a worker asynchronously and return; the worker calls `ConverseStream` and posts each delta to the connection ID.
    - id: d
      text:
        en: |-
          Replace the WebSocket API with a REST API that uses response streaming, and send stop requests to the same REST endpoint.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      The WebSocket integration timeout is at most 29 seconds and cannot be adjusted, so the route handler only starts the work. The worker pushes each delta to the client with the `@connections` API (`PostToConnection`), and the open connection still carries the user's stop message to the backend.
  options:
    a:
      en: |-
        The answer arrives all at once, and generations longer than 29 seconds exceed the integration timeout.
    b:
      en: |-
        The WebSocket integration timeout is not adjustable.
    d:
      en: |-
        REST response streaming is one-way and does not support request streaming; a stop message would be an unrelated request, whereas the WebSocket connection already carries both directions.
references:
  - title: "Quotas for configuring and running a WebSocket in API Gateway - Amazon API Gateway"
    url: https://docs.aws.amazon.com/apigateway/latest/developerguide/apigateway-execution-service-websocket-limits-table.html
  - title: "Use @connections commands in your backend service - Amazon API Gateway"
    url: https://docs.aws.amazon.com/apigateway/latest/developerguide/apigateway-how-to-call-websocket-api-connections.html
