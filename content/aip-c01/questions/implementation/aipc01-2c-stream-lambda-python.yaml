id: aipc01-2c-stream-lambda-python
objective: "2.4.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A team runs a Python web application on AWS Lambda that calls `ConverseStream`. The team wants to stream tokens to browsers through a Lambda function URL instead of returning a buffered response, and it does not want to rewrite the application in another language. The function does not run in a VPC.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Use the Lambda Web Adapter or a custom runtime, and configure the function URL for response streaming.
    - id: b
      text:
        en: |-
          Keep the Python managed runtime, and wrap the handler with the `awslambda.streamifyResponse` function.
    - id: c
      text:
        en: |-
          Increase the function memory so that the buffered response is returned to the browser faster.
    - id: d
      text:
        en: |-
          Attach the function to a VPC, and invoke it through its function URL with response streaming enabled.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      Node.js managed runtimes support Lambda response streaming natively; other languages such as Python stream through a custom runtime or the Lambda Web Adapter. The stream is then delivered through a function URL or the `InvokeWithResponseStream` API.
  options:
    b:
      en: |-
        `streamifyResponse` is provided by the Node.js runtime; the Python managed runtime does not stream natively.
    c:
      en: |-
        More memory does not change buffered delivery; the browser still waits for the complete response.
    d:
      en: |-
        Function URLs do not support response streaming in a VPC.
references:
  - title: "Response streaming for Lambda Event Functions - AWS Lambda"
    url: https://docs.aws.amazon.com/lambda/latest/dg/configuration-response-streaming.html
