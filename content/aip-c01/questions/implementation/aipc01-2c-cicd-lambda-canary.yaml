id: aipc01-2c-cicd-lambda-canary
objective: "2.3.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A team deploys a GenAI summarization API as an AWS Lambda function with AWS SAM. Each release can change the prompt and the model ID. The team wants each new version to receive 10 percent of the traffic for 10 minutes and then all the traffic, and it wants an automatic rollback if an error-rate CloudWatch alarm fires during the release.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Set `AutoPublishAlias`, and set a `DeploymentPreference` of type `Linear10PercentEvery10Minutes` with the alarm in its `Alarms` list.
    - id: b
      text:
        en: |-
          Set `AutoPublishAlias`, and set a `DeploymentPreference` of type `Canary10Percent10Minutes` with the alarm in its `Alarms` list.
    - id: c
      text:
        en: |-
          Set a `DeploymentPreference` of type `AllAtOnce`, and add a `PostTraffic` hook that reports a failure when the summary is empty.
    - id: d
      text:
        en: |-
          Publish each version manually, point an API Gateway stage variable at it, and switch the variable back when the alarm fires.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      With `AutoPublishAlias`, AWS SAM publishes a new version and AWS CodeDeploy shifts the alias traffic. `Canary10Percent10Minutes` shifts 10 percent first and the remaining 90 percent 10 minutes later, and if an alarm in the `Alarms` list fires during the deployment, CodeDeploy rolls back.
  options:
    a:
      en: |-
        A linear configuration shifts another 10 percent every 10 minutes, so traffic is not held at 10 percent and the full rollout takes much longer than 10 minutes.
    c:
      en: |-
        All-at-once shifts all traffic immediately, and a `PostTraffic` hook runs only after the shift is complete.
    d:
      en: |-
        Switching a stage variable by hand is not an automatic rollback triggered by the alarm.
references:
  - title: "Deploying serverless applications gradually with AWS SAM - AWS Serverless Application Model"
    url: https://docs.aws.amazon.com/serverless-application-model/latest/developerguide/automating-updates-to-serverless-apps.html
  - title: "Working with deployment configurations in CodeDeploy - AWS CodeDeploy"
    url: https://docs.aws.amazon.com/codedeploy/latest/userguide/deployment-configurations.html
