id: aipc01-2c-gateway-cost-attribution
objective: "2.3.5"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A GenAI gateway forwards requests from 12 business units to the same model on Amazon Bedrock in one AWS account. Finance needs the Amazon Bedrock cost of each business unit in AWS Cost Explorer, and the platform team needs to query input and output tokens by business unit and by feature. The solution must require the LEAST operational effort.

    Which combination of steps will meet these requirements? (Choose two.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Create a tagged application inference profile for each business unit, and have the gateway use that profile as the model ID.
    - id: b
      text:
        en: |-
          Move each business unit to its own AWS account, and deploy and operate a copy of the gateway in each of these accounts.
    - id: c
      text:
        en: |-
          Send the business unit and feature in `requestMetadata`, enable model invocation logging, and query the logs with Logs Insights.
    - id: d
      text:
        en: |-
          Tag the gateway's Lambda function with the business unit names, and activate those tags as cost allocation tags in Billing.
    - id: e
      text:
        en: |-
          Build a CloudWatch dashboard of the `InputTokenCount` and `OutputTokenCount` metrics grouped by the `ModelId` dimension.
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |-
      Application inference profiles track usage and costs for the requests made through them and accept tags that can be used as cost allocation tags. `requestMetadata` key-value pairs are written to the model invocation logs, so Logs Insights queries can sum token counts by business unit and feature.
  options:
    b:
      en: |-
        Separate accounts would separate costs, but operating 12 copies of the gateway is far more effort.
    d:
      en: |-
        Tags on the Lambda function allocate the function's own charges, not the Amazon Bedrock charges of the requests it forwards.
    e:
      en: |-
        Every business unit calls the same model, so the `ModelId` dimension cannot separate their usage.
references:
  - title: "Create an application inference profile - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/inference-profiles-create.html
  - title: "Monitor model invocation using CloudWatch Logs and Amazon S3 - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/model-invocation-logging.html
