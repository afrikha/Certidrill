id: aipc01-2c-stream-midstream-errors
objective: "2.4.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A web application consumes `ConverseStream` responses and forwards only the `contentBlockDelta` events to the browser. Users sometimes receive answers that stop in mid-sentence with no error, both when the model reaches its output limit and during periods of throttling. The company wants the application to detect both cases and tell the user what happened.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Check the HTTP status code of the `ConverseStream` response before reading the events, and show an error when it is not 200.
    - id: b
      text:
        en: |-
          Handle the exception events that arrive inside the stream, and read the `stopReason` of the `messageStop` event.
    - id: c
      text:
        en: |-
          Set the SDK retry mode to `adaptive` so that interrupted streams are resumed automatically from the last delta.
    - id: d
      text:
        en: |-
          Increase `maxTokens` to the model's maximum, and call `InvokeModelWithResponseStream` instead of `ConverseStream`.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      Errors such as throttling or model stream errors can arrive as events inside the stream after it has started. The `messageStop` event carries the `stopReason`, and `max_tokens` means that the answer was truncated, so the consumer must process these events instead of only the deltas.
  options:
    a:
      en: |-
        The stream can start successfully and fail later, so the initial status does not reveal errors that arrive within the event stream.
    c:
      en: |-
        SDK retry modes retry failed requests; they do not resume a stream from a previous delta.
    d:
      en: |-
        A larger limit addresses only one cause, and the application would still ignore the error events that end a stream early.
references:
  - title: "ConverseStream - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/APIReference/API_runtime_ConverseStream.html
  - title: "Converse - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/APIReference/API_runtime_Converse.html
