id: aipc01-2b-llm-uncompressed-artifacts
objective: "2.2.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company serves a 180 GB LLM on Amazon SageMaker AI real-time endpoints. The model artifacts are stored in Amazon S3 as a single model.tar.gz file. During traffic spikes, auto scaling adds instances, but each new instance spends a long time decompressing the archive before it can serve requests. The company wants new instances to start serving sooner without changing the model or the instance type.

    What should the company do?
body:
  options:
    - id: a
      text:
        en: |-
          Increase ModelDataDownloadTimeoutInSeconds so that new instances have more time to download and decompress the archive.
    - id: b
      text:
        en: |-
          Store the artifacts uncompressed under an S3 prefix, and use ModelDataSource with S3Prefix and CompressionType None.
    - id: c
      text:
        en: |-
          Move the model to a multi-model endpoint so that the archive is decompressed once and shared by all instances.
    - id: d
      text:
        en: |-
          Keep a single S3 object and set S3DataType to S3Object and CompressionType to Gzip in the model's ModelDataSource.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      Compressing and decompressing artifacts with hundreds of billions of parameters takes significant time, so AWS recommends deploying large models uncompressed. Artifacts stored under a common S3 prefix and referenced through ModelDataSource with S3Prefix and CompressionType None are downloaded directly to /opt/ml/model.
  options:
    a:
      en: |-
        A longer timeout prevents failed deployments but doesn't make decompression any faster.
    c:
      en: |-
        ModelDataSource isn't supported with multi-model endpoints, and multi-model endpoints are designed to share instances among many models, not to remove decompression time for one large model.
    d:
      en: |-
        A gzip-compressed artifact still has to be decompressed on every new instance, which is the delay to remove.
references:
  - title: "Deploying uncompressed models - Amazon SageMaker AI"
    url: https://docs.aws.amazon.com/sagemaker/latest/dg/large-model-inference-uncompressed.html
