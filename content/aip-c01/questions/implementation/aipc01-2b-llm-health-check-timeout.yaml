id: aipc01-2b-llm-health-check-timeout
objective: "2.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company deploys a 65 GB open-weight LLM to an Amazon SageMaker AI real-time endpoint with a large model inference (LMI) container. Endpoint creation fails. Amazon CloudWatch logs show that the model artifacts finished downloading and that the container was still loading the weights onto the GPUs when the health check timed out. The container is otherwise configured correctly.

    What should the company do?
body:
  options:
    - id: a
      text:
        en: |-
          Increase the ContainerStartupHealthCheckTimeoutInSeconds value in the endpoint configuration.
    - id: b
      text:
        en: |-
          Increase the VolumeSizeInGB value so that the artifacts fit on the instance storage.
    - id: c
      text:
        en: |-
          Grant the SageMaker AI execution role s3:GetObject permission on the model artifacts.
    - id: d
      text:
        en: |-
          Redeploy the model to a SageMaker Serverless Inference endpoint with the maximum memory size.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      When the container is set up correctly and CloudWatch logs show a health check timeout, AWS recommends increasing ContainerStartupHealthCheckTimeoutInSeconds so that the container has enough time to finish loading a large model before it must answer health checks.
  options:
    b:
      en: |-
        The download completed, so storage isn't the problem; VolumeSizeInGB matters when a model larger than 30 GB doesn't fit on an instance without local disk.
    c:
      en: |-
        The logs show that the artifacts downloaded successfully, so the S3 permissions are already in place.
    d:
      en: |-
        Serverless Inference provides no GPUs, so it can't host a 65 GB LLM.
references:
  - title: "SageMaker AI endpoint parameters for large model inference - Amazon SageMaker AI"
    url: https://docs.aws.amazon.com/sagemaker/latest/dg/large-model-inference-hosting.html
