id: aipc01-2b-mcp-gateway-aggregate-servers
objective: "2.1.7"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company's product teams operate five MCP servers on different hosts. Some run behind Lambda function URLs and others run in Amazon Bedrock AgentCore Runtime. A platform team wants every agent to connect to one MCP endpoint that lists and calls the tools of all five servers as a single catalog, without any change to the servers.

    Which Amazon Bedrock AgentCore Gateway configuration will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Add each MCP server as an HTTP target so that the gateway sends agent traffic directly to the servers.
    - id: b
      text:
        en: |-
          Write an AWS Lambda function for each MCP server that forwards tool calls to it, and add the functions as Lambda targets with their tool schemas.
    - id: c
      text:
        en: |-
          Add each MCP server as an MCP server target so that the gateway exposes their combined capabilities as one virtual MCP server.
    - id: d
      text:
        en: |-
          Add each MCP server as an inference target and use model-based routing to select the server for each request.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      MCP targets operate in aggregation mode: the gateway acts as an MCP server whose capabilities combine those of all its MCP targets into a single unified virtual MCP server. The gateway synchronizes each server's tools into one catalog, so agents use one endpoint and the servers stay unchanged.
  options:
    a:
      en: |-
        HTTP targets receive traffic directly, without aggregation or protocol translation, so agents would not get one combined tool catalog.
    b:
      en: |-
        Wrapping each server in a Lambda function adds forwarding code and tool schemas to maintain, which the existing MCP servers make unnecessary.
    d:
      en: |-
        Inference targets route LLM traffic to model providers; they don't connect agents to MCP tool servers.
references:
  - title: "Supported targets for Amazon Bedrock AgentCore gateways - Amazon Bedrock AgentCore"
    url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/gateway-supported-targets.html
  - title: "MCP servers targets - Amazon Bedrock AgentCore"
    url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/gateway-target-MCPservers.html
