id: aipc01-2c-api-additional-fields
objective: "2.4.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A team calls several models on Amazon Bedrock through the `Converse` API. For one Anthropic Claude model, the team wants to set the `top_k` inference parameter, which is not one of the base fields of `inferenceConfig`. The rest of the code must keep using the same `Converse` request for every model.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Add `top_k` to the `inferenceConfig` object of the request, next to `maxTokens` and `temperature`.
    - id: b
      text:
        en: |-
          Switch the calls for this model to `InvokeModel`, and build the provider's native request body with `top_k`.
    - id: c
      text:
        en: |-
          Add `top_k` to the `requestMetadata` map of the request so that the model receives it with the prompt.
    - id: d
      text:
        en: |-
          Pass `{"top_k": 200}` in the `additionalModelRequestFields` field of the `Converse` request.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      `Converse` passes model-specific inference parameters that are not part of the base `inferenceConfig` fields in `additionalModelRequestFields`, so the same request shape keeps working for every model.
  options:
    a:
      en: |-
        `inferenceConfig` accepts only the base fields such as `maxTokens`, `temperature`, `topP` and `stopSequences`.
    b:
      en: |-
        Native request bodies create a provider-specific code path, which the team wants to avoid.
    c:
      en: |-
        `requestMetadata` tags the request for filtering invocation logs; it is not sent to the model as an inference parameter.
references:
  - title: "Inference using Converse API - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/conversation-inference.html
  - title: "Converse - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/APIReference/API_runtime_Converse.html
