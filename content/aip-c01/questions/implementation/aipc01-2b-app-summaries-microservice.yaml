id: aipc01-2b-app-summaries-microservice
objective: "2.3.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company's microservices are exposed through an Amazon API Gateway REST API that uses an Amazon Cognito user pool authorizer. Several services now need to summarize customer messages with Amazon Bedrock. The company wants one reusable summarization capability that is secured like the other services and can evolve without breaking its callers.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Add the AWS SDK and Amazon Bedrock calls, with their own prompts, to the code of each microservice that needs summaries.
    - id: b
      text:
        en: |-
          Add a versioned /v1/summaries resource with a Lambda integration that calls Amazon Bedrock, protected by the existing authorizer.
    - id: c
      text:
        en: |-
          Create an IAM user with Amazon Bedrock permissions, and share its access keys with every team that needs summaries.
    - id: d
      text:
        en: |-
          Have each microservice write messages to an Amazon S3 bucket, and read the generated summaries from the bucket on the next business day.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      Adding GenAI as a new microservice behind the existing API keeps one implementation of the prompts and model calls, and enabling the same COGNITO_USER_POOLS authorizer on the new method secures it like the other services. A versioned path lets the capability evolve without breaking callers.
  options:
    a:
      en: |-
        Duplicating model calls in every service spreads prompts, model IDs and error handling across teams.
    c:
      en: |-
        Shared long-term access keys violate least privilege and are hard to rotate.
    d:
      en: |-
        A next-day file exchange doesn't provide the on-request summaries the services need.
references:
  - title: "Control access to REST APIs using Amazon Cognito user pools as an authorizer - Amazon API Gateway"
    url: https://docs.aws.amazon.com/apigateway/latest/developerguide/apigateway-integrate-with-cognito.html
