id: aipc01-2a-custom-router-multilingual
objective: "2.1.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A global HR software company offers an assistant in English, French, and Japanese. Benchmarks show that an Anthropic Claude model gives the best results for Japanese contract analysis, and a Meta Llama model is accurate enough and cheaper for English and French FAQ answers. The model for each combination of language and task type must change when new benchmark results arrive, without redeploying the application, and the rules must be validated before they take effect.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Create an Amazon Bedrock prompt router with the Claude model as the fallback model and the Llama model as the other model, and send all requests to the router.
    - id: b
      text:
        en: |-
          Send every request to the Claude model through a global cross-Region inference profile so that one model serves all languages at the lowest latency.
    - id: c
      text:
        en: |-
          Hardcode the routing rules in the application, and release a new version of the application each time the benchmark results change.
    - id: d
      text:
        en: |-
          Route requests in a Lambda function that detects the language and task type and reads the model mapping from an AWS AppConfig configuration profile with a validator.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      A model selection framework keeps the rules as configuration: the Lambda router detects the language and task type, and AWS AppConfig lets the company change the mapping without redeploying code. AppConfig validators check the configuration before deployment, and a bad change is rolled back.
  options:
    a:
      en: |-
        Intelligent prompt routing works with two models of the same family and is optimized for English prompts, so it cannot route between Claude and Llama or by language and task type.
    b:
      en: |-
        Using one model for everything ignores the benchmark results: it raises the cost of the English and French FAQ answers, and it provides no rules to change.
    c:
      en: |-
        Hardcoded rules require a new release for every change, which the company wants to avoid.
references:
  - title: Understanding intelligent prompt routing in Amazon Bedrock - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/prompt-routing.html
  - title: What is AWS AppConfig? - AWS AppConfig
    url: https://docs.aws.amazon.com/appconfig/latest/userguide/what-is-appconfig.html
