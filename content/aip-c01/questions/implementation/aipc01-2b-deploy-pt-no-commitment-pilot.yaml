id: aipc01-2b-deploy-pt-no-commitment-pilot
objective: "2.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company fine-tuned a model in Amazon Bedrock in early 2025, so the model can't use an on-demand custom model deployment. The company wants to run a two-week pilot with steady traffic on the custom model and might stop the pilot early. All charges for the model's capacity must end as soon as the pilot ends.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Purchase Provisioned Throughput with no commitment for the custom model, and delete it when the pilot ends.
    - id: b
      text:
        en: |-
          Purchase Provisioned Throughput with a one-month commitment for the custom model to get a lower hourly price.
    - id: c
      text:
        en: |-
          Purchase Provisioned Throughput with a six-month commitment for the custom model to get the lowest hourly price.
    - id: d
      text:
        en: |-
          Call the custom model's ARN with on-demand InvokeModel requests without purchasing any capacity.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      A customized model that can't use an on-demand custom model deployment must be served with Provisioned Throughput. Provisioned Throughput without commitment is billed hourly and can be deleted at any time, and billing continues only until it is deleted, so the company can stop all charges when the pilot ends.
  options:
    b:
      en: |-
        A one-month commitment can't be deleted before the term is over, so billing would continue after a two-week pilot.
    c:
      en: |-
        A six-month commitment can't be deleted for six months, far beyond the pilot.
    d:
      en: |-
        A customized model that isn't served through an on-demand custom model deployment requires Provisioned Throughput before it can be used.
references:
  - title: "Increase model invocation capacity with Provisioned Throughput in Amazon Bedrock - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/prov-throughput.html
