id: aipc01-2b-deploy-async-long-documents
objective: "2.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A legal company self-hosts a fine-tuned LLM on Amazon SageMaker AI to produce detailed analyses of contract bundles. Each request carries up to 400 MB of documents and takes 20 to 40 minutes to process. Requests arrive a few times a day, and users are notified when their results are ready. The company wants to avoid paying for GPU instances when there are no requests.

    Which deployment option will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          A real-time endpoint that the application calls with InvokeEndpointWithResponseStream to stream each analysis back as it is generated.
    - id: b
      text:
        en: |-
          An asynchronous inference endpoint with S3 input and output, Amazon SNS notifications, and scaling to zero when idle.
    - id: c
      text:
        en: |-
          A SageMaker Serverless Inference endpoint configured with the maximum memory size and concurrency.
    - id: d
      text:
        en: |-
          An Amazon Bedrock batch inference job for each request, with the documents and results in Amazon S3.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      Asynchronous inference queues requests and is designed for large payloads (up to 1 GB), long processing times (up to one hour) and near real-time needs. The payload is read from Amazon S3, the result is written to S3 with optional SNS success or error notifications, and the instance count can scale to zero when there are no requests.
  options:
    a:
      en: |-
        Real-time invocations are synchronous with small payload limits and short response timeouts, far below 400 MB and 40 minutes, and the endpoint keeps its instances running.
    c:
      en: |-
        Serverless Inference provides no GPUs, so it can't host the LLM.
    d:
      en: |-
        Bedrock batch inference runs models served by Amazon Bedrock; the company's self-hosted SageMaker AI model isn't one of them.
references:
  - title: "Asynchronous inference - Amazon SageMaker AI"
    url: https://docs.aws.amazon.com/sagemaker/latest/dg/async-inference.html
