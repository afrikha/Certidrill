id: aipc01-2b-llm-quantization-smaller-gpus
objective: "2.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company serves an open-weight LLM on Amazon SageMaker AI GPU instances that are expensive and often unavailable in its Region. The company wants to run the model on smaller, less expensive GPU instances. An evaluation showed that a small loss of accuracy is acceptable.

    Which SageMaker AI inference optimization technique should the company apply?
body:
  options:
    - id: a
      text:
        en: |-
          Speculative decoding with the pre-built draft model.
    - id: b
      text:
        en: |-
          Quantization of the weights to a format such as INT4-AWQ or FP8.
    - id: c
      text:
        en: |-
          Fast model loading with pre-sharded weights streamed from Amazon S3.
    - id: d
      text:
        en: |-
          Compilation for the target GPU hardware.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      Quantization uses a less precise data type for the weights (and, for some formats, the activations), which reduces hardware requirements so that the model can run on less expensive GPUs. The trade-off is that the quantized model might be less accurate than the source model, which the company accepts.
  options:
    a:
      en: |-
        Speculative decoding lowers latency by adding a draft model; it doesn't reduce the memory that the target model needs.
    c:
      en: |-
        Fast model loading shortens deployment and scale-out; the model still needs the same GPUs.
    d:
      en: |-
        Compilation optimizes performance on the chosen hardware without loss of accuracy; it isn't the technique that lowers the hardware requirements.
references:
  - title: "Inference optimization for Amazon SageMaker AI models - Amazon SageMaker AI"
    url: https://docs.aws.amazon.com/sagemaker/latest/dg/model-optimize.html
