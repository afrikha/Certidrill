id: aipc01-2c-cicd-redteam-gate
objective: "2.3.5"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    A company's AWS CodePipeline pipeline deploys guardrail configuration changes for a public chatbot. The security team requires the pipeline to stop automatically if the updated guardrail lets through any prompt from a library of 500 known jailbreak prompts. The results of every run must be kept for 1 year and must be reviewable as test reports.

    Which combination of steps will meet these requirements? (Choose two.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Add a manual approval action that sends the jailbreak library to the security team through an Amazon SNS topic before each deployment.
    - id: b
      text:
        en: |-
          Add a CodeBuild action that tests each jailbreak prompt against the new guardrail version with `ApplyGuardrail` and fails if one passes.
    - id: c
      text:
        en: |-
          In the build, send the jailbreak prompts to Amazon Comprehend prompt safety classification, and fail when a prompt is classified as safe.
    - id: d
      text:
        en: |-
          Write the results as JUnit XML in the buildspec `reports` section, and have the report group export the raw files to Amazon S3.
    - id: e
      text:
        en: |-
          Rely on the CodeBuild report group alone, because CodeBuild keeps each test report for as long as its report group exists.
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |-
      `ApplyGuardrail` evaluates content against the new guardrail version without invoking a model, and a non-zero exit fails the build and stops the pipeline. CodeBuild builds test reports from JUnit XML files declared in the buildspec; reports expire after 30 days, so exporting the raw test files to S3, where they do not expire, keeps a year of results.
  options:
    a:
      en: |-
        A manual approval is not an automatic test and does not check that the guardrail blocks the prompts.
    c:
      en: |-
        Comprehend prompt safety classification is no longer available to new customers, and it would test a different classifier instead of the guardrail being deployed.
    e:
      en: |-
        CodeBuild test reports expire 30 days after they are created.
references:
  - title: "Test reports in AWS CodeBuild - AWS CodeBuild"
    url: https://docs.aws.amazon.com/codebuild/latest/userguide/test-reporting.html
