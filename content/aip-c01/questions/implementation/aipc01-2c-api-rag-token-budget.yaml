id: aipc01-2c-api-rag-token-budget
objective: "2.5.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A RAG API adds up to 20 retrieved chunks to each prompt that it sends to a model on Amazon Bedrock. Some broad questions fail because the input exceeds the model's context window. Finance also wants the token cost of each request to be attributed to the calling application. The company wants to keep the most relevant context and prevent the failures.

    Which combination of steps will meet these requirements? (Choose two.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Raise `maxTokens` in the request so that the model accepts prompts with more retrieved chunks.
    - id: b
      text:
        en: |-
          Count input tokens with `CountTokens`, and drop the lowest-ranked chunks until the prompt fits.
    - id: c
      text:
        en: |-
          Increase the number of retrieved chunks so that the model has more context to choose its answer from.
    - id: d
      text:
        en: |-
          Retry the failed requests with exponential backoff and jitter until the model accepts them.
    - id: e
      text:
        en: |-
          Pass the caller in `requestMetadata` with invocation logging on, and record each response's `usage`.
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: |-
      Counting tokens before the call and dropping the least relevant chunks keeps the input within the context window while keeping the most relevant context. The `usage` field reports the input and output tokens of each call, and `requestMetadata` tags each call in the model invocation logs for attribution.
  options:
    a:
      en: |-
        `maxTokens` limits the output, not the size of the input.
    c:
      en: |-
        More chunks make the overflow worse.
    d:
      en: |-
        The same oversized input fails on every attempt.
references:
  - title: "Monitor your token usage by counting tokens before running inference - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/count-tokens.html
  - title: "Monitor model invocation using CloudWatch Logs and Amazon S3 - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/model-invocation-logging.html
