id: aipc01-2d-bda-multi-blueprints
objective: "2.5.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A mortgage lender receives loan packets in which each file is one of about 25 document types, such as pay stubs, bank statements, and tax forms. Each document type needs its own set of extracted fields. The lender processes the files with Amazon Bedrock Data Automation and wants each file to be extracted with the right set of fields.

    Which solution will meet these requirements with the LEAST operational overhead?
body:
  options:
    - { id: a, text: { en: "Create one blueprint that contains the fields of all 25 document types, and discard the fields that come back empty for each file." } }
    - { id: b, text: { en: "Create 25 projects with one blueprint each, and add a Lambda function that calls a model to classify each file and choose the project." } }
    - { id: c, text: { en: "Use standard output only, and add a Lambda function with a prompt that maps each document summary to the fields of its type." } }
    - { id: d, text: { en: "Create one project that contains a document blueprint for each type, and let the service match each file to the best-fitting blueprint." } }
answer: { optionId: d }
explanation:
  correct:
    en: "A BDA project can hold up to 40 document blueprints. When a project has several document blueprints, BDA sends each document to the blueprint that best matches its expected layout, so one call per file with one project handles all 25 types without custom classification code."
  options:
    a:
      en: "One blueprint per file class is the documented approach; a single blueprint for 25 types mixes unrelated instructions, and the fields of 25 types can quickly exceed the limit of 100 fields per blueprint."
    b:
      en: "Separate projects plus a custom classification function add code and model calls that BDA's own blueprint matching already provides."
    c:
      en: "Standard output returns summaries, not the per-type fields, and the mapping prompt is extra code and an extra model call to maintain."
references:
  - title: "Custom output and blueprints - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/bda-custom-output-idp.html
  - title: "Blueprints - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/bda-blueprint-info.html
