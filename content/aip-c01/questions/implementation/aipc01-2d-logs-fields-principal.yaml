id: aipc01-2d-logs-fields-principal
objective: "2.5.6"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    An account's Amazon Bedrock token consumption spiked overnight. Model invocation logging delivers logs to CloudWatch Logs, and the applications in the account don't set requestMetadata. The security team needs a CloudWatch Logs Insights query that lists which IAM principals sent requests with more than 50,000 input tokens.

    Which two fields of the invocation log records must the query use? (Choose two.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "identity.arn" } }
    - { id: b, text: { en: "requestMetadata.team" } }
    - { id: c, text: { en: "input.inputTokenCount" } }
    - { id: d, text: { en: "output.outputTokenCount" } }
    - { id: e, text: { en: "modelId" } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: "Bedrock fills identity.arn with the STS or IAM principal that made the call and input.inputTokenCount with the number of input tokens of the request. Filtering on input.inputTokenCount greater than 50,000 and grouping by identity.arn lists the principals, without any request metadata."
  options:
    b:
      en: "requestMetadata is the only field supplied by the caller, and it is present only when the caller sets it, which these applications don't."
    d:
      en: "The output token count measures the response, not the size of the requests that the team is looking for."
    e:
      en: "modelId identifies the model or inference profile that was called, not the principal that sent the request."
references:
  - title: "Monitor model invocation using CloudWatch Logs and Amazon S3 - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/model-invocation-logging.html
