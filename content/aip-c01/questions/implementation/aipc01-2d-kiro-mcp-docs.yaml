id: aipc01-2d-kiro-mcp-docs
objective: "2.5.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Developers use Kiro to write code that calls Amazon Bedrock and the company's internal pricing API. The agent's code suggestions often use outdated Bedrock request parameters and guess the operations of the internal API. The company wants suggestions that are based on the current AWS documentation and on the internal API's live definition, without copying documentation into the repository.

    Which solution will meet these requirements?
body:
  options:
    - { id: a, text: { en: "Paste the relevant Bedrock documentation pages and the internal API reference into steering files that are included in every interaction." } }
    - { id: b, text: { en: "Connect the AWS Documentation MCP server and an MCP server that serves the internal API's definition to Kiro." } }
    - { id: c, text: { en: "Fine-tune a foundation model on the internal API's source code with Amazon Bedrock, and use it to answer the developers' questions." } }
    - { id: d, text: { en: "Create an agent hook that runs the unit tests after every file save so that the agent can correct its wrong suggestions." } }
answer: { optionId: b }
explanation:
  correct:
    en: "MCP servers give the Kiro agent tools, prompts, and resources from external systems. The AWS Documentation MCP server lets the agent search and read current AWS documentation, and an internal MCP server can expose the live API definition, so suggestions use current information without copies in the repository."
  options:
    a:
      en: "Copying documentation into steering files is what the company wants to avoid; the copies go stale and fill the context of every request."
    c:
      en: "A fine-tuned model reflects the code at training time, needs retraining after each API change, and still doesn't know the current Bedrock documentation."
    d:
      en: "Tests catch some wrong calls after the code is written, but they don't give the agent the current documentation or API definition."
references:
  - title: "MCP - Features - Docs - Kiro"
    url: https://kiro.dev/docs/mcp/
