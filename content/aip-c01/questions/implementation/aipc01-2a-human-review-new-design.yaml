id: aipc01-2a-human-review-new-design
objective: "2.1.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A bank is starting a new project in which a foundation model drafts credit memo summaries. A loan officer must approve or reject each summary in a web application before it is sent to the customer, and the process must continue automatically after the decision. The bank has never used AWS human review services before.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Create an Amazon Augmented AI flow definition with a private work team of loan officers, and start a human loop for each summary.
    - id: b
      text:
        en: |-
          Use an AWS Step Functions callback task, and have the web application return the officer's decision through Amazon API Gateway and Lambda.
    - id: c
      text:
        en: |-
          Create an Amazon SageMaker Ground Truth labeling job with a private workforce of loan officers for each batch of summaries.
    - id: d
      text:
        en: |-
          Create an Amazon Q Business application in which loan officers review each summary and approve it with a custom plugin action.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      A Step Functions task with .waitForTaskToken pauses the process until the web application returns the token with SendTaskSuccess or SendTaskFailure through API Gateway and Lambda. This builds the approval step from services that are open to new customers.
  options:
    a:
      en: |-
        Amazon Augmented AI has been closed to new customers since July 30, 2026, so a bank that has never used it cannot adopt it.
    c:
      en: |-
        SageMaker Ground Truth has been closed to new customers since July 30, 2026, and it is designed for labeling data, not for approving individual outputs in a business process.
    d:
      en: |-
        Amazon Q Business has been closed to new customers since July 30, 2026, so it is not an option for a new design.
references:
  - title: Discover service integration patterns in Step Functions - AWS Step Functions
    url: https://docs.aws.amazon.com/step-functions/latest/dg/connect-to-resource.html
