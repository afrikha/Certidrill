id: aipc01-2d-xray-annotations-search
objective: "2.5.6"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    A multi-tenant generative AI assistant is instrumented with AWS Distro for OpenTelemetry (ADOT), and its traces are sent to AWS X-Ray. Engineers must be able to search for the traces of one tenant with X-Ray filter expressions. When they open a trace, they must also see the retrieved-context payload of the request, a nested JSON object that they never search on.

    Which combination of steps will meet these requirements? (Choose two.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "Record the tenant ID as a span attribute, and list its key in the aws.xray.annotations attribute of the span." } }
    - { id: b, text: { en: "Record the tenant ID as a plain span attribute, because span attributes are indexed for filter expressions by default." } }
    - { id: c, text: { en: "Record the retrieved-context payload as a span attribute that isn't listed in aws.xray.annotations." } }
    - { id: d, text: { en: "Record the retrieved-context payload as an annotation so that each of its nested fields is indexed." } }
    - { id: e, text: { en: "Add the tenant ID to the Root field of the X-Amzn-Trace-Id header of each incoming request." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: "When OpenTelemetry spans are converted for X-Ray, span attributes become metadata by default, and only the keys listed in aws.xray.annotations become annotations. Annotations are indexed and usable in filter expressions, which fits the tenant ID; metadata isn't indexed but can hold any type, including objects, which fits the payload."
  options:
    b:
      en: "By default, span attributes become X-Ray metadata, which isn't indexed, so filter expressions can't find the tenant ID."
    d:
      en: "Annotations are simple key-value pairs, and X-Ray indexes at most 50 annotations per trace; a nested object that is never searched belongs in metadata."
    e:
      en: "The Root field carries the trace ID; the tracing header holds only the trace ID, the parent segment ID, and the sampling decision."
references:
  - title: "Migrating from X-Ray instrumentation to OpenTelemetry instrumentation - AWS X-Ray"
    url: https://docs.aws.amazon.com/xray/latest/devguide/xray-sdk-migration.html
  - title: "AWS X-Ray concepts - AWS X-Ray"
    url: https://docs.aws.amazon.com/xray/latest/devguide/xray-concepts.html
