id: aipc01-2a-react-s3-payload
objective: "2.1.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A research company runs a ReAct loop in an AWS Step Functions Standard workflow. The Reason state uses the optimized Amazon Bedrock InvokeModel integration and passes the whole conversation history, including tool observations, in the Body field. A Lambda Act state runs each tool and appends the observation to the history in the state output. Long investigations now fail when the history grows beyond 256 KiB. The company wants to keep the same workflow and model with the LEAST development effort.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Convert the state machine to an Express workflow, and keep passing the whole conversation history in the Body field of the InvokeModel state.
    - id: b
      text:
        en: |-
          Have the Act state compress the history with gzip and pass the compressed history as a Base64 string in the Body field of the InvokeModel state.
    - id: c
      text:
        en: |-
          Have the Act state write the request body to Amazon S3, use the Input and Output fields with S3 URIs in the InvokeModel state, and pass only S3 references.
    - id: d
      text:
        en: |-
          Replace the InvokeModel state with a Lambda function that calls InvokeModel with the history and returns the full model response to the next state.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      The optimized Bedrock integration accepts a Body of up to 256 KiB and recommends the Input field with an S3Uri for larger requests; the Output field writes the response to S3 and replaces the response body with a reference. Keeping only S3 references in the state also stays under the 256 KiB limit on state input and output.
  options:
    a:
      en: |-
        The 256 KiB limit on task and state input and output applies to the workflow regardless of type, and Express workflows also stop after 5 minutes.
    b:
      en: |-
        Compression only delays the failure, and the model expects a JSON request body, not a compressed Base64 string.
    d:
      en: |-
        The Lambda function would still return the history and the full response in the state output, so the 256 KiB state payload limit would still be reached.
references:
  - title: Invoke and customize Amazon Bedrock models with Step Functions - AWS Step Functions
    url: https://docs.aws.amazon.com/step-functions/latest/dg/connect-bedrock.html
  - title: Step Functions service quotas - AWS Step Functions
    url: https://docs.aws.amazon.com/step-functions/latest/dg/service-quotas.html
