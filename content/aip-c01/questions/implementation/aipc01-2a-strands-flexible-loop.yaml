id: aipc01-2a-strands-flexible-loop
objective: "2.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company is building a new IT helpdesk agent. The agent must reason about each request, call tools such as password reset, license lookup, and ticket creation as needed, read the results, and decide the next step until the request is resolved. The number and order of steps differ for every request. There is no requirement to record each step as a separate workflow state. The company wants the LEAST development effort.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Build an AWS Step Functions state machine with one Lambda state per tool and Choice states that route between the tools based on the model output.
    - id: b
      text:
        en: |-
          Build the agent with Strands Agents, pass the model and the tools to the agent, and host the agent on Amazon Bedrock AgentCore Runtime.
    - id: c
      text:
        en: |-
          Build an Amazon Bedrock flow with a prompt node for each tool and condition nodes that connect the prompt nodes in a fixed order.
    - id: d
      text:
        en: |-
          Create an Amazon Bedrock agent with an action group for each tool, and invoke the agent through an agent alias.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      Strands Agents uses a model-driven loop: the developer supplies a model, a system prompt, and tools, and the model reasons, calls tools, reads the results, and repeats until it produces an answer. This implements the ReAct pattern with little code, and AgentCore Runtime hosts the agent without managing servers.
  options:
    a:
      en: |-
        A hand-built Step Functions loop is useful when every step must be a visible state with deterministic limits, but that is not required here and it needs more development work.
    c:
      en: |-
        Flows run a sequence of nodes defined in advance; they suit fixed prompt chains, not a dynamic reason-and-act loop whose steps differ per request.
    d:
      en: |-
        Amazon Bedrock Agents (now Agents Classic) has been closed to new customers since July 30, 2026, so it is not an option for a new agent.
references:
  - title: Strands Agents - AWS Prescriptive Guidance
    url: https://docs.aws.amazon.com/prescriptive-guidance/latest/agentic-ai-frameworks/strands-agents.html
