id: aipc01-2a-strands-hooks-tool-limit
objective: "2.1.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company runs a research agent built with Strands Agents that has 12 tools maintained by different teams. The platform team must log every tool call with its duration and must limit the costly web_search tool to three calls per agent invocation, cancelling any further calls. The platform team must not modify the code of the tools or of the agent loop.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Register a hook provider whose before and after tool call callbacks log durations, count web_search calls, and cancel calls over the limit.
    - id: b
      text:
        en: |-
          Add a rule to the system prompt that states that web_search can be called at most three times for each user request.
    - id: c
      text:
        en: |-
          Ask each tool team to add timing, logging, and a per-invocation call counter to its own tool function, and redeploy the tools.
    - id: d
      text:
        en: |-
          Set the reserved concurrency of the Lambda function behind web_search to 3 so that no more than three searches can run at any moment.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      Strands hooks attach callbacks to agent lifecycle events, such as before and after each tool call, without changing the tools or the loop. A before-tool-call callback can count calls and cancel a tool call, and the pair of callbacks can measure and log durations.
  options:
    b:
      en: |-
        A prompt rule is not enforced, so the agent can still exceed three searches.
    c:
      en: |-
        Changing every tool function breaks the requirement not to modify the tools, and it spreads the same logic across 12 teams.
    d:
      en: |-
        Reserved concurrency limits simultaneous executions across all invocations; it does not count calls per agent invocation and throttles other users.
references:
  - title: Strands Agents - AWS Prescriptive Guidance
    url: https://docs.aws.amazon.com/prescriptive-guidance/latest/agentic-ai-frameworks/strands-agents.html
