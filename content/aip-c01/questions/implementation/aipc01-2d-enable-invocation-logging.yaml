id: aipc01-2d-enable-invocation-logging
objective: "2.5.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company's chatbot calls Amazon Bedrock with the Converse API from Lambda functions. Users report some inappropriate answers, but the team can't find the prompts and responses of those conversations anywhere in Amazon CloudWatch. The team wants to analyze the prompts and responses with CloudWatch Logs Insights.

    What should the team do first?
body:
  options:
    - { id: a, text: { en: "Enable Amazon Bedrock model invocation logging in the Region, with a CloudWatch Logs log group as the destination." } }
    - { id: b, text: { en: "Enable AWS X-Ray active tracing on the Lambda functions, and open the traces of the reported conversations." } }
    - { id: c, text: { en: "Create a CloudWatch alarm on the Amazon Bedrock Invocations metric for each model that the chatbot uses." } }
    - { id: d, text: { en: "Increase the retention period of the Lambda functions' log groups so that older log events are kept longer." } }
answer: { optionId: a }
explanation:
  correct:
    en: "Model invocation logging is disabled by default and is configured per Region. Once enabled, it records the full request and response data and metadata of Converse, ConverseStream, InvokeModel, and InvokeModelWithResponseStream calls, and with a CloudWatch Logs destination the team can query them with Logs Insights."
  options:
    b:
      en: "Traces show timing and the path of requests across services, not the text of prompts and responses."
    c:
      en: "Metrics and alarms count invocations; they don't contain any prompt or response content."
    d:
      en: "The prompts and responses were never written to these log groups, so keeping logs longer doesn't make them appear."
references:
  - title: "Monitor model invocation using CloudWatch Logs and Amazon S3 - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/model-invocation-logging.html
