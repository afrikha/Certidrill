id: aipc01-2d-bda-blueprint-inferred
objective: "2.5.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A tax-preparation company uses Amazon Bedrock Data Automation to extract data from scanned employment income forms. The downstream system requires the taxpayer ID without dashes (111223333 instead of 111-22-3333), dates in YYYY-MM-DD format, and each line of the form's earnings table as a separate record with a description and an amount. The company wants BDA to return the data in this shape without any post-processing code.

    Which blueprint design will meet these requirements?
body:
  options:
    - { id: a, text: { en: "Define every field with the explicit extraction type and no instructions, and add a Lambda function that reformats the taxpayer ID, the dates, and the table text." } }
    - { id: b, text: { en: "Use standard output only, and add a Converse call with a prompt that converts each document summary into the taxpayer ID, dates, and earnings lines." } }
    - { id: c, text: { en: "Define the taxpayer ID and dates as explicit fields, and define a group named earnings that contains one string field holding the whole earnings table." } }
    - { id: d, text: { en: "Define the taxpayer ID and dates as inferred fields with instructions for the required format, and define a table field with description and amount columns." } }
answer: { optionId: d }
explanation:
  correct:
    en: "Inferred extraction returns information transformed from how it appears in the document, such as a taxpayer ID with the dashes removed, and each field's natural-language description can state the format, for example a date in YYYY-MM-DD format. A table field defines column fields, so each earnings line comes back as its own row with a description and an amount."
  options:
    a:
      en: "Explicit extraction returns the values as they appear, so the dashes and original date formats stay, and the Lambda function is the post-processing code the company wants to avoid."
    b:
      en: "Standard output returns default summaries, and converting them requires an extra model call and code outside BDA."
    c:
      en: "Explicit fields keep the original formats, and a group only organizes related fields; one string field for the table doesn't return one record per line."
references:
  - title: "Blueprints - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/bda-blueprint-info.html
