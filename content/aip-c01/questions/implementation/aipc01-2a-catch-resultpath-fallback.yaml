id: aipc01-2a-catch-resultpath-fallback
objective: "2.1.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A developer builds an agent workflow in AWS Step Functions with JSONPath. A Task state calls a weather tool and has a Retry for transient errors. To degrade gracefully, the Task state has a catcher with ErrorEquals set to States.ALL and Next set to a Fallback state, which asks the model to answer without the tool by using the question and conversation history from its input. When the tool fails after the retries, the Fallback state fails because the question and history are missing from its input. The Fallback state must receive the original input and the error details.

    Which change will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Set ResultPath of the catcher to $.error so that the error output is added to the original input instead of replacing it.
    - id: b
      text:
        en: |-
          Replace States.ALL with States.TaskFailed in the catcher so that only task failures are sent to the Fallback state.
    - id: c
      text:
        en: |-
          Set ResultPath of the Task state to $.toolResult so that the tool output is stored next to the original input.
    - id: d
      text:
        en: |-
          Increase MaxAttempts of the Retry so that transient errors are retried more times before the catcher runs.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      In JSONPath workflows, a catcher without ResultPath defaults to $, so the error output overwrites the whole input that is sent to the Next state. Setting the catcher's ResultPath to a field such as $.error keeps the original input and adds the error details to it, so the Fallback state has the question, the history, and the error.
  options:
    b:
      en: |-
        Changing which errors are caught does not change what the catcher passes on; the error output still replaces the input.
    c:
      en: |-
        The Task state's ResultPath applies to a successful result; on the error path, the catcher's ResultPath decides the input of the Next state.
    d:
      en: |-
        More retries may reduce how often the catcher runs, but when it does, the Fallback state still receives only the error output.
references:
  - title: Handling errors in Step Functions workflows - AWS Step Functions
    url: https://docs.aws.amazon.com/step-functions/latest/dg/concepts-error-handling.html
