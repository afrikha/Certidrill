id: aipc01-2c-cicd-eval-gate
objective: "2.3.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company versions its prompt templates and model parameters in a Git repository, and an AWS CodePipeline pipeline deploys them to a customer support assistant. A recent prompt change reduced answer quality in production. The company wants every change to be scored automatically against a golden dataset of 300 questions, and the pipeline must stop before deployment when the average score is below 0.85. The solution must require the LEAST manual effort.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Add a manual approval action before the deploy stage, and send the reviewers a link to sample responses generated with the new prompt.
    - id: b
      text:
        en: |-
          Deploy every change, and create a CloudWatch alarm on a custom quality metric that triggers a rollback when the score drops below 0.85.
    - id: c
      text:
        en: |-
          Add an AWS CodeBuild action before the deploy stage that scores the golden dataset with the new prompt and fails when the average is below 0.85.
    - id: d
      text:
        en: |-
          Add an AWS CodeDeploy canary deployment that sends 10 percent of production traffic to the new prompt for 30 minutes before the full rollout.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      A CodeBuild action that runs the evaluation script and exits with an error below the threshold fails its stage, so the pipeline stops before the change reaches production without any human review. The scores can also be published as a CodeBuild test report.
  options:
    a:
      en: |-
        A manual approval depends on people reading samples; it is manual effort and not a scored comparison against the whole dataset.
    b:
      en: |-
        The change reaches users before the alarm detects the drop, but the requirement is to stop the change before deployment.
    d:
      en: |-
        A canary still exposes real users to the change and measures production behavior, not the score on the golden dataset.
references:
  - title: "Test reports in AWS CodeBuild - AWS CodeBuild"
    url: https://docs.aws.amazon.com/codebuild/latest/userguide/test-reporting.html
  - title: "Add a manual approval action to a stage - AWS CodePipeline"
    url: https://docs.aws.amazon.com/codepipeline/latest/userguide/approvals.html
