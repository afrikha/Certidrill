id: aipc01-2b-llm-volume-download-timeout
objective: "2.2.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company deploys a 120 GB LLM to an Amazon SageMaker AI real-time endpoint on an instance type that has no local disk. The first deployment fails because the instance runs out of storage space while downloading the model artifacts. Logs from a later test show that the download from Amazon S3 also takes longer than the default time allowed.

    Which two endpoint configuration changes should the company make? (Choose two.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Set MinInstanceCount to 0 in the production variant's managed instance scaling.
    - id: b
      text:
        en: |-
          Set VolumeSizeInGB slightly larger than the size of the model.
    - id: c
      text:
        en: |-
          Set InitialInstanceCount to 2 so that the download is split between two instances.
    - id: d
      text:
        en: |-
          Increase ModelDataDownloadTimeoutInSeconds to allow enough time to download the model from Amazon S3.
    - id: e
      text:
        en: |-
          Increase ContainerStartupHealthCheckTimeoutInSeconds so that the health check waits for the download to finish.
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |-
      AWS recommends raising VolumeSizeInGB slightly above the model size when a model larger than 30 GB runs on an instance without a local disk, and raising ModelDataDownloadTimeoutInSeconds for models larger than 40 GB so that the download from Amazon S3 to the instance can finish.
  options:
    a:
      en: |-
        MinInstanceCount 0 enables scaling to zero; it affects neither storage nor download time.
    c:
      en: |-
        Each instance downloads the full model, so more instances don't split the download.
    e:
      en: |-
        This timeout gives the container time to answer health checks after startup; it doesn't add storage or extend the time allowed for the download.
references:
  - title: "SageMaker AI endpoint parameters for large model inference - Amazon SageMaker AI"
    url: https://docs.aws.amazon.com/sagemaker/latest/dg/large-model-inference-hosting.html
