id: aipc01-2a-mcp-tool-discovery
objective: "2.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A logistics company has five agents built with different frameworks. All of them need the same internal tools to track parcels, book pickups, and check warehouse stock. The tools team adds or changes tools every week, and today each agent team must copy the new tool definitions into its code and redeploy. The company wants the agents to discover the current tools and their input schemas at run time.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Store the tool definitions as a prompt in Amazon Bedrock Prompt Management, and have each agent load the latest prompt version when it starts.
    - id: b
      text:
        en: |-
          Publish the tool definitions as a JSON file in an Amazon S3 bucket, and have each agent team update its toolSpec entries from the file before each release.
    - id: c
      text:
        en: |-
          Expose the tools through a Model Context Protocol (MCP) server, and configure each agent as an MCP client that lists the available tools when it connects.
    - id: d
      text:
        en: |-
          Define the tools as action groups of an Amazon Bedrock agent, and have the other agents invoke that Bedrock agent when they need a tool.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      MCP standardizes agent-tool interactions: an MCP server exposes tools with their names, descriptions, and input schemas, and any MCP client, whatever its framework, discovers them at run time. Tool changes are made once on the server, without redeploying the agents.
  options:
    a:
      en: |-
        Prompt Management stores and versions prompts; it is not a tool discovery protocol, and each agent would still need custom code to turn the prompt into callable tools.
    b:
      en: |-
        Updating the toolSpec entries before each release keeps the copy-and-redeploy cycle that the company wants to remove.
    d:
      en: |-
        Amazon Bedrock Agents (now Agents Classic) has been closed to new customers since July 30, 2026, and action groups do not give other frameworks a standard way to discover tools.
references:
  - title: Strands Agents - AWS Prescriptive Guidance
    url: https://docs.aws.amazon.com/prescriptive-guidance/latest/agentic-ai-frameworks/strands-agents.html
