id: aipc01-2b-deploy-pt-legacy-custom-model
objective: "2.2.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company fine-tuned a model in Amazon Bedrock in March 2025. The custom model now serves a document-classification service that runs 24 hours a day with a steady, predictable load. The company will use the model unchanged for at least the next 6 months and wants the lowest cost for consistent throughput.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Create a custom model deployment and call the model with on-demand inference.
    - id: b
      text:
        en: |-
          Purchase Provisioned Throughput with no commitment and keep it running.
    - id: c
      text:
        en: |-
          Purchase Provisioned Throughput with a six-month commitment for the custom model.
    - id: d
      text:
        en: |-
          Run the classification as Amazon Bedrock batch inference jobs against the provisioned model.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      A customized model that can't use an on-demand custom model deployment must be served with Provisioned Throughput. Longer commitments give a more discounted hourly price, and a six-month term, which can't be deleted before it ends, matches six months of steady 24-hour use.
  options:
    a:
      en: |-
        On-demand custom model deployments require a model customized on or after July 16, 2025, from a supported base model and Region; a model fine-tuned in March 2025 doesn't qualify.
    b:
      en: |-
        No-commitment Provisioned Throughput works, but its hourly price is higher than with a commitment, so it isn't the lowest cost for six months of steady use.
    d:
      en: |-
        Batch inference isn't supported for provisioned models, and a continuously running service needs immediate responses.
references:
  - title: "Increase model invocation capacity with Provisioned Throughput in Amazon Bedrock - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/prov-throughput.html
  - title: "Deploy a custom model for on-demand inference - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/deploy-custom-model-on-demand.html
