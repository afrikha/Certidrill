id: aipc01-2d-flows-dowhile-judge
objective: "2.5.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A publisher's flow in Amazon Bedrock Flows writes a book description with one prompt node and scores it with a second prompt node that acts as a judge. When the score is below the threshold, the description must be rewritten with the judge's feedback, with at most five attempts in total. The loop must stay inside Bedrock Flows without Lambda functions or Step Functions, and the flow must have the fewest nodes to maintain.

    Which solution will meet these requirements?
body:
  options:
    - { id: a, text: { en: "Place the writer and judge prompt nodes after an iterator node that receives an array of five items, and collect the results with a collector node." } }
    - { id: b, text: { en: "Add a condition node after the judge node that routes low scores to a second writer node, then a third, up to five copies of the writer and judge nodes." } }
    - { id: c, text: { en: "Ask the writer prompt node for five alternative descriptions in one response, and have the judge prompt node choose the best of the five." } }
    - { id: d, text: { en: "Place the writer and judge prompt nodes in a DoWhile loop node that repeats while the score is below the threshold, with maxIterations set to 5." } }
answer: { optionId: d }
explanation:
  correct:
    en: "A DoWhile loop node runs its node sequence at least once and repeats it while its condition is true; the condition is evaluated after each iteration. maxIterations (default 10) caps the attempts at five, and the loop exits early as soon as the judge's score passes, which implements the evaluator-optimizer pattern inside the flow."
  options:
    a:
      en: "An iterator node processes every item of the array, so all five attempts always run, without early exit and without passing the judge's feedback from one attempt to the next."
    b:
      en: "Copying the writer and judge nodes five times works but multiplies the nodes to maintain, which the fewest-nodes requirement rules out."
    c:
      en: "Picking the best of five drafts doesn't use the judge's feedback, and all five drafts can still score below the threshold."
references:
  - title: "Node types for your flow - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/flows-nodes.html
  - title: "Workflow for evaluators and reflect-refine loops - AWS Prescriptive Guidance"
    url: https://docs.aws.amazon.com/prescriptive-guidance/latest/agentic-ai-patterns/workflow-for-evaluators-and-reflect-refine-loops.html
