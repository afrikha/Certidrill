id: aipc01-2d-connect-crm-summary
objective: "2.5.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A bank's contact center uses Amazon Connect. When a call arrives, the agent must see a summary of the caller's interactions recorded in the CRM system over the last 12 months. A contact flow invokes a Lambda function that reads the CRM records and calls Amazon Bedrock to generate the summary, but generation takes about 20 seconds, and the contact often follows the error branch of the flow. A summary can be up to one day old.

    Which solution will meet these requirements?
body:
  options:
    - { id: a, text: { en: "Increase the Lambda function's timeout to 60 seconds, and keep calling the function synchronously from the Invoke AWS Lambda function block." } }
    - { id: b, text: { en: "Set the timeout of the Invoke AWS Lambda function block to 30 seconds, and add a Play prompt block before it to keep the caller informed." } }
    - { id: c, text: { en: "Regenerate each customer's summary asynchronously when the CRM record changes, store it in Amazon DynamoDB, and have the flow's Lambda function read it." } }
    - { id: d, text: { en: "Split the work into two Lambda functions that the flow invokes in sequence, one that reads the CRM records and one that calls Amazon Bedrock." } }
answer: { optionId: c }
explanation:
  correct:
    en: "Amazon Connect waits at most 8 seconds for a Lambda function in a contact flow, so a 20-second generation can't run in the call path. Generating summaries ahead of time, which the one-day freshness tolerance allows, leaves the flow with a fast key lookup in DynamoDB that returns well within the timeout."
  options:
    a:
      en: "The function's own timeout doesn't matter: the Invoke AWS Lambda function block times out after at most 8 seconds and follows the error branch."
    b:
      en: "The block's timeout can't exceed 8 seconds, so it can't be set to 30 seconds."
    d:
      en: "Each invocation is still limited to 8 seconds, and a sequence of Lambda functions in a flow is limited to 20 seconds in total, so the generation step still fails."
references:
  - title: "Grant Connect Customer access to your AWS Lambda functions - Amazon Connect Customer"
    url: https://docs.aws.amazon.com/connect/latest/adminguide/connect-lambda-functions.html
