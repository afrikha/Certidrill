id: aipc01-2b-deploy-imported-qwen3-invoke
objective: "2.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company fine-tuned a Qwen3 model with the Qwen3ForCausalLM architecture and imported it into Amazon Bedrock with Custom Model Import in us-east-1. The application calls every other model through the Converse API. The team wants to call the imported model on demand, with no inference infrastructure to manage.

    How should the application call the imported model?
body:
  options:
    - id: a
      text:
        en: |-
          Call the Converse API with the imported model's ARN as the model ID, as it does for the other models.
    - id: b
      text:
        en: |-
          Call InvokeModel with the imported model's ARN and a request body in the model's native format.
    - id: c
      text:
        en: |-
          Create a custom model deployment for the imported model, and call the Converse API with the deployment ARN.
    - id: d
      text:
        en: |-
          Purchase Provisioned Throughput for the imported model so that it accepts Converse API requests.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      Imported models run with on-demand throughput and are called with InvokeModel or InvokeModelWithResponseStream. Because the Converse API isn't supported for imported Qwen3 models, the application must send this model a request body in its native format through InvokeModel.
  options:
    a:
      en: |-
        Custom Model Import doesn't support the Converse API for Qwen3 models.
    c:
      en: |-
        Custom model deployments serve supported models customized in Amazon Bedrock; an imported model is already invoked on demand by its own ARN.
    d:
      en: |-
        Purchasing capacity doesn't add Converse support for Qwen3 imported models, and imported models already run with on-demand throughput.
references:
  - title: "Use Custom model import to import a customized open-source model into Amazon Bedrock - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/model-customization-import-model.html
