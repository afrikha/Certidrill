id: aipc01-2b-mcp-gateway-oauth-target
objective: "2.1.7"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A logistics company hosts an MCP server for shipment tools on Amazon ECS behind an Application Load Balancer and adds it as an MCP server target of an Amazon Bedrock AgentCore gateway. Security requires that the gateway authenticate to the MCP server with short-lived access tokens issued by the company's Amazon Cognito user pool and that the server validate those tokens. No long-lived shared secret may be sent to the server.

    How should the company configure outbound authorization for the target?
body:
  options:
    - id: a
      text:
        en: |-
          Configure IAM outbound authorization with an IAM credential provider so that the gateway signs its requests to the load balancer with Signature Version 4.
    - id: b
      text:
        en: |-
          Configure an OAuth credential provider in AgentCore Identity that uses the client credentials grant with the Cognito user pool, and attach it to the target.
    - id: c
      text:
        en: |-
          Configure an API key credential provider in AgentCore Identity and have the MCP server compare the key with a value stored in AWS Secrets Manager.
    - id: d
      text:
        en: |-
          Configure the target with no authorization and restrict the load balancer's security group to the gateway's traffic.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      MCP server targets support OAuth outbound authorization with a credential provider configured in AgentCore Identity in the gateway's account and Region. With the client credentials (two-legged) grant, the gateway obtains short-lived access tokens from the Cognito user pool and sends them to the server, which validates them.
  options:
    a:
      en: |-
        IAM outbound authorization works only with targets that natively verify SigV4, such as API Gateway, AgentCore Runtime or Lambda function URLs; an Application Load Balancer doesn't verify SigV4 signatures.
    c:
      en: |-
        An API key is a long-lived shared secret sent with each request, which the security requirement forbids.
    d:
      en: |-
        Invoking an MCP server without authorization isn't recommended, and network filtering gives the server no token to validate.
references:
  - title: "MCP servers targets - Amazon Bedrock AgentCore"
    url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/gateway-target-MCPservers.html
