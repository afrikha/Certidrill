id: aipc01-2a-tool-definitions-quality
objective: "2.1.6"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A retailer's assistant uses the Amazon Bedrock Converse API with two tools: get_order_status and get_return_status. Each tool has a one-word description. Logs show that the model often calls get_order_status for questions about returns, and that it passes free-text values such as "shipped already" in the status filter parameter, which accepts only pending, shipped, or delivered. The company wants to improve tool selection and parameter quality without changing models.

    Which combination of changes will meet these requirements? (Choose two.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Rename the tools to tool_1 and tool_2 so that the tool names use fewer input tokens in each request to the model.
    - id: b
      text:
        en: |-
          Write a description for each tool that states what it returns, when to use it, and when to use the other tool instead.
    - id: c
      text:
        en: |-
          Increase the temperature of the requests so that the model considers more of the available tools before it chooses the one to call.
    - id: d
      text:
        en: |-
          Define the status filter as a string with an enum of pending, shipped, and delivered, and mark the mandatory parameters as required.
    - id: e
      text:
        en: |-
          Set toolChoice to any so that the model must request at least one of the tools for every message it receives.
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |-
      The model chooses tools from their names and descriptions, so a description that says when to use each tool, and when not to, reduces confusion between similar tools. Typed parameters with enum values and required fields in the JSON input schema tell the model exactly which values are valid.
  options:
    a:
      en: |-
        Meaningless names remove information that the model uses to choose the right tool, so selection gets worse.
    c:
      en: |-
        A higher temperature makes choices more random, which increases wrong tool calls and invalid values.
    e:
      en: |-
        toolChoice any forces the model to call some tool, even when it should answer in text; it does not help it choose the right tool or values.
references:
  - title: ToolSpecification - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/APIReference/API_runtime_ToolSpecification.html
  - title: ToolChoice - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/APIReference/API_runtime_ToolChoice.html
