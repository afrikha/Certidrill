id: aipc01-2c-api-batch-tool-use
objective: "2.4.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company runs Amazon Bedrock batch inference jobs to extract fields from 200,000 support emails. To force structured arguments, each record includes a `toolConfig` with a tool definition, and the job uses the `Converse` invocation type. Every record fails with a 400 error. The company wants to keep tool calling and batch pricing.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Use the `InvokeModel` invocation type, and write each `modelInput` in the model's native format with the tool.
    - id: b
      text:
        en: |-
          Remove `toolConfig` from the records, and process each email on demand with the `Converse` API and the same tool definition.
    - id: c
      text:
        en: |-
          Run the job on a Provisioned Throughput model ARN so that tool calling is enabled for the batch inference job.
    - id: d
      text:
        en: |-
          Split the input into smaller files of 1,000 records so that the job validates each tool definition separately.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      Batch inference does not support tool calling in jobs that use the `Converse` invocation type, and records with `toolConfig` fail with a 400 error. With the `InvokeModel` invocation type, each `modelInput` uses the model's native format, which can carry the tool definition.
  options:
    b:
      en: |-
        On-demand calls keep tool calling but give up batch pricing.
    c:
      en: |-
        Batch inference is not supported for provisioned models.
    d:
      en: |-
        File size is not the cause; the `Converse` invocation type rejects records with `toolConfig`.
references:
  - title: "Process multiple prompts with batch inference - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/batch-inference.html
