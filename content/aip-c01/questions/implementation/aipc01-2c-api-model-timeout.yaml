id: aipc01-2c-api-model-timeout
objective: "2.5.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A Lambda function generates long technical guides with the Amazon Bedrock `Converse` API. Occasionally, a call fails with a `ModelTimeoutException` (HTTP 408) after the model has worked for a long time. The guides must still be produced, and the team wants to avoid repeating long failed generations many times.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Retry each failed call with exponential backoff until it succeeds, without a limit on the number of attempts.
    - id: b
      text:
        en: |-
          Treat the error as a permissions problem, and add `bedrock:InvokeModelWithResponseStream` to the execution role.
    - id: c
      text:
        en: |-
          Retry the call once, and if it fails again, generate the guide section by section with shorter, separate requests.
    - id: d
      text:
        en: |-
          Increase the memory of the Lambda function so that the model processes the request faster.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      A `ModelTimeoutException` means that processing took longer than the model timeout. One retry can succeed, but repeated failures call for smaller requests, such as generating the guide in shorter sections.
  options:
    a:
      en: |-
        Repeating a request that exceeds the model timeout wastes time and cost and may never succeed.
    b:
      en: |-
        HTTP 408 is a timeout, not an authorization error.
    d:
      en: |-
        The function's memory does not change how long the model takes to process the request in Amazon Bedrock.
references:
  - title: "Converse - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/APIReference/API_runtime_Converse.html
