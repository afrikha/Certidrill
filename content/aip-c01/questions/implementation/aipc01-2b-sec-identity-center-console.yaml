id: aipc01-2b-sec-identity-center-console
objective: "2.3.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company with an organization in AWS Organizations wants 300 employees to use the Amazon Bedrock playgrounds in the console of a shared AWS account. Employees sign in with the corporate SAML 2.0 identity provider, and access must follow job functions such as analyst and developer. The company does not want to create IAM users.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Create an IAM user for each employee, and add the users to IAM groups that match their job functions.
    - id: b
      text:
        en: |-
          Create an Amazon Cognito user pool for the employees and have them sign in to the Amazon Bedrock console with their user pool credentials.
    - id: c
      text:
        en: |-
          Connect IAM Identity Center to the corporate identity provider, and assign job-function permission sets to groups.
    - id: d
      text:
        en: |-
          Generate Amazon Bedrock API keys for each employee, and distribute the keys to them by email.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      IAM Identity Center connects workforce users from an existing identity provider, such as a SAML 2.0 provider, to AWS accounts. Permission sets define permissions for common job functions and are assigned to users and groups across accounts of the organization, so no IAM users are needed.
  options:
    a:
      en: |-
        IAM users are what the company wants to avoid, and they duplicate identities that already exist in the corporate provider.
    b:
      en: |-
        Cognito user pools serve the users of web and mobile applications, not workforce sign-in to the AWS Management Console.
    d:
      en: |-
        API keys aren't console sign-in credentials, and distributing keys by email bypasses the corporate identity provider.
references:
  - title: "What is IAM Identity Center? - AWS IAM Identity Center"
    url: https://docs.aws.amazon.com/singlesignon/latest/userguide/what-is.html
