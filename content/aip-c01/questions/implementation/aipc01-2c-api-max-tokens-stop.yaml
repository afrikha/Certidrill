id: aipc01-2c-api-max-tokens-stop
objective: "2.5.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A report generator calls the Amazon Bedrock `Converse` API with `maxTokens` set to 500. Users report that some reports end in mid-sentence. These responses have a `stopReason` of `max_tokens`, and no errors are returned. The developer must make sure that users receive complete reports.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Retry each request with exponential backoff when the response is shorter than the expected report.
    - id: b
      text:
        en: |-
          Reduce the size of the input prompt, because the model's context window was exceeded by the request.
    - id: c
      text:
        en: |-
          Raise `maxTokens` for this use case, and handle any `max_tokens` stop reason as a truncated response.
    - id: d
      text:
        en: |-
          Raise the temperature in `inferenceConfig` so that the model writes shorter and simpler sentences.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      A `stopReason` of `max_tokens` means that the model stopped because it reached the output token limit, so the text is truncated. Setting a limit that fits the use case and checking the stop reason of every response makes sure that reports are complete.
  options:
    a:
      en: |-
        Retrying the same request with the same limit truncates the report again.
    b:
      en: |-
        An input that is too large has its own stop reason, `model_context_window_exceeded`.
    d:
      en: |-
        Temperature controls randomness, not the length of the output.
references:
  - title: "Converse - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/APIReference/API_runtime_Converse.html
