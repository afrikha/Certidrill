id: aipc01-2a-prompt-router-same-family
objective: "2.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A publishing company runs an English-language writing assistant on Amazon Nova Lite. Some complex requests would get noticeably better answers from Amazon Nova Pro, but sending every request to Nova Pro would cost too much. The company wants Amazon Bedrock to predict, for each request, which of the two models gives the better balance of response quality and cost, and to send the request to that model. Nova Lite must remain the default choice. The company does not want to build or maintain routing code.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Create a configured prompt router with Nova Lite as the fallback model and Nova Pro as the second model, and invoke the router ARN as the model ID.
    - id: b
      text:
        en: |-
          Write a Lambda function that classifies each request by length and keywords, and read the model mapping for each class from AWS AppConfig.
    - id: c
      text:
        en: |-
          Invoke Nova Lite through a geographic cross-Region inference profile, and send a request to Nova Pro only when the Nova Lite profile is throttled.
    - id: d
      text:
        en: |-
          Create an application inference profile for each of the two models, and split the requests between the profiles in proportion to their cost.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      Intelligent prompt routing gives a single serverless endpoint that predicts the response quality of two models of the same family for each request. With a configured router, the fallback model is the baseline, and the router switches to the other model only when its predicted quality is better by more than the response quality difference. The feature is optimized for English prompts, which fits this assistant.
  options:
    b:
      en: |-
        A custom classifier would work but requires the routing code that the company does not want to build or maintain.
    c:
      en: |-
        A cross-Region inference profile spreads requests for one model across Regions to increase throughput; sending requests to Nova Pro only on throttling does not predict which model answers each request better.
    d:
      en: |-
        Application inference profiles track usage and cost of a model; splitting traffic by cost does not predict which model answers each request better.
references:
  - title: Understanding intelligent prompt routing in Amazon Bedrock - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/prompt-routing.html
