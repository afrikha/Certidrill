id: aipc01-2a-strands-invocation-limits
objective: "2.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A media company runs a research agent built with Strands Agents. For some requests, the agent calls its web search tool dozens of times, and token costs spike. The company wants a hard cap on the number of model turns and on the total tokens that one invocation can use. When a cap is reached, the agent must stop with a clear reason and keep a valid message history so that the application can re-invoke it with a larger budget for approved requests.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Set the maximum output tokens in the model's inference configuration to 2,000 so that each model response in the loop is shorter.
    - id: b
      text:
        en: |-
          Add an instruction to the system prompt that tells the agent to use no more than five turns and to keep its answers brief.
    - id: c
      text:
        en: |-
          Configure invocation limits for turns and total tokens on the agent, and handle the limit_turns and limit_total_tokens stop reasons.
    - id: d
      text:
        en: |-
          Lower the idle session timeout of the AgentCore Runtime that hosts the agent so that long-running sessions are stopped sooner.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      The Strands agent loop applies no turn or token limit unless one is passed. With limits for turns and total tokens, the loop ends with the limit_turns or limit_total_tokens stop reason, and the message history stays valid so the application can re-invoke the agent with a higher budget.
  options:
    a:
      en: |-
        The output token setting caps each response, not the number of turns or the total for the invocation; a response cut at that limit ends with the max_tokens stop reason, which ends the loop with an error.
    b:
      en: |-
        A prompt instruction is not a hard cap, and the model can ignore it.
    d:
      en: |-
        The idle timeout applies to sessions without activity; a looping agent is active, so the timeout neither caps its turns nor its tokens.
references:
  - title: Strands Agents - AWS Prescriptive Guidance
    url: https://docs.aws.amazon.com/prescriptive-guidance/latest/agentic-ai-frameworks/strands-agents.html
