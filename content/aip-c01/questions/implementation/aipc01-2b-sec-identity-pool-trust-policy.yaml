id: aipc01-2b-sec-identity-pool-trust-policy
objective: "2.3.3"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    A company's mobile app gets temporary credentials from an Amazon Cognito identity pool to call Amazon Bedrock. The IAM role for authenticated users trusts the cognito-identity.amazonaws.com principal for sts:AssumeRoleWithWebIdentity, with no conditions. A security review requires that only authenticated identities from this specific identity pool can assume the role.

    Which two conditions should the company add to the role's trust policy? (Choose two.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          A StringEquals condition on cognito-identity.amazonaws.com:aud with the ID of the identity pool.
    - id: b
      text:
        en: |-
          A condition on aws:SourceIp with the IP address ranges of the company's offices.
    - id: c
      text:
        en: |-
          A ForAnyValue:StringLike condition on cognito-identity.amazonaws.com:amr with the value authenticated.
    - id: d
      text:
        en: |-
          A StringEquals condition on sts:ExternalId with a secret value that is embedded in the app.
    - id: e
      text:
        en: |-
          A StringEquals condition on aws:PrincipalOrgID with the ID of the company's organization.
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |-
      The aud condition restricts the tokens that can assume the role to the company's identity pool, and the amr condition requires the authenticated value, so guest identities and other identity pools are rejected. AWS's example trust policy for identity pool roles uses these two conditions.
  options:
    b:
      en: |-
        Mobile users connect from any network, and an IP condition doesn't tie the role to the identity pool.
    d:
      en: |-
        An external ID is for third parties that assume roles across accounts, and a value embedded in an app isn't secret.
    e:
      en: |-
        Web identities from an identity pool aren't principals of the company's organization, so this doesn't restrict them to the identity pool.
references:
  - title: "Using role-based access control - Amazon Cognito"
    url: https://docs.aws.amazon.com/cognito/latest/developerguide/role-based-access-control.html
