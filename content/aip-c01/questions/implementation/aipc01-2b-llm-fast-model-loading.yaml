id: aipc01-2b-llm-fast-model-loading
objective: "2.2.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company's LLM endpoint on Amazon SageMaker AI scales out during daily peaks, but each new instance takes many minutes before it serves traffic. Logs show that most of that time is spent downloading the model artifacts to disk, loading them into host memory, and sharding them across the GPUs. The company wants faster scale-out without any loss of accuracy.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Prepare the model for fast model loading so that pre-sharded weights stream from S3 onto the GPUs.
    - id: b
      text:
        en: |-
          Quantize the model to INT8-SmoothQuant so that each new instance downloads fewer bytes.
    - id: c
      text:
        en: |-
          Increase ModelDataDownloadTimeoutInSeconds and ContainerStartupHealthCheckTimeoutInSeconds on the endpoint.
    - id: d
      text:
        en: |-
          Configure the endpoint to scale to zero instances outside the daily peaks to save cost.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      Fast model loading stores the model pre-sharded in equal-sized chunks and streams the weights from Amazon S3 directly onto the instance's GPUs, skipping the download to disk, the load into host memory and the sharding on the host. New instances serve sooner and auto scaling scales out faster, with no change to the model's accuracy.
  options:
    b:
      en: |-
        Quantization can reduce accuracy, which the company doesn't accept.
    c:
      en: |-
        Longer timeouts prevent failed deployments but don't shorten the loading.
    d:
      en: |-
        Scaling to zero saves cost off-peak, but new instances still load slowly, and the endpoint can't serve requests while it provisions from zero.
references:
  - title: "Inference optimization for Amazon SageMaker AI models - Amazon SageMaker AI"
    url: https://docs.aws.amazon.com/sagemaker/latest/dg/model-optimize.html
