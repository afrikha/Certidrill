id: aipc01-2c-res-partner-usage-plans
objective: "2.4.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company exposes a GenAI API to 30 partners through an API Gateway REST API, and partners authenticate with IAM. One partner occasionally floods the API, which exhausts the company's Amazon Bedrock quota and causes throttling for every partner. Partners call from changing IP addresses. Each partner must be limited to its contracted request rate, and excess requests must be rejected with HTTP 429 before any model is invoked.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Give each partner an API key in a usage plan for its contract tier, and require API keys on the methods in addition to IAM.
    - id: b
      text:
        en: |-
          Configure stage-level throttling on the API stage with a rate equal to the contracted rate of the largest partner.
    - id: c
      text:
        en: |-
          Set reserved concurrency on the Lambda function so that the function cannot exceed the Amazon Bedrock quota.
    - id: d
      text:
        en: |-
          Associate an AWS WAF web ACL with a rate-based rule that limits the number of requests from each source IP address.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      A usage plan throttles each API key with its own rate and burst, and per-client usage plan limits are the first throttling settings that API Gateway applies. Excess requests receive HTTP 429 before the integration runs, while IAM still authenticates the partners.
  options:
    b:
      en: |-
        Stage throttling is shared by all callers, so one partner can still consume the whole limit.
    c:
      en: |-
        Reserved concurrency limits the function for all partners together, so a flood from one partner still blocks the others.
    d:
      en: |-
        Partners call from changing IP addresses, so an IP-based rule cannot apply each partner's contracted rate.
references:
  - title: "Throttle requests to your REST APIs for better throughput in API Gateway - Amazon API Gateway"
    url: https://docs.aws.amazon.com/apigateway/latest/developerguide/api-gateway-request-throttling.html
  - title: "Usage plans and API keys for REST APIs in API Gateway - Amazon API Gateway"
    url: https://docs.aws.amazon.com/apigateway/latest/developerguide/api-gateway-api-usage-plans.html
