id: aipc01-2c-route-choice-order
objective: "2.4.4"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    A Step Functions workflow routes documents by size. A `Choice` state has two rules, in this order: rule 1 sends documents whose `$.inputTokens` is `NumericGreaterThan` 20000 to a mid-size model, and rule 2 sends documents whose `$.inputTokens` is `NumericGreaterThan` 100000 to a long-context model. Documents of 150,000 tokens are sent to the mid-size model and fail. Documents of 20,001 to 100,000 tokens must still go to the mid-size model.

    Which solutions will meet these requirements? (Choose two.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Add a `Default` field to the `Choice` state that transitions to the long-context model task.
    - id: b
      text:
        en: |-
          Move the rule for more than 100,000 tokens before the rule for more than 20,000 tokens.
    - id: c
      text:
        en: |-
          Change both rules to `StringGreaterThan` comparisons so that the values are compared as text.
    - id: d
      text:
        en: |-
          Rewrite rule 1 as an `And` of `NumericGreaterThan` 20000 and `NumericLessThanEquals` 100000.
    - id: e
      text:
        en: |-
          Replace the `Choice` state with a `Parallel` state that runs both model tasks for each document.
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |-
      Step Functions evaluates the rules of a `Choice` state in order and follows the first rule that matches, so a 150,000-token document matches rule 1 first. Evaluating the more specific rule first, or limiting rule 1 to the 20,001–100,000 range with an `And` rule, sends each document to the right model.
  options:
    a:
      en: |-
        `Default` applies only when no rule matches; a 150,000-token document still matches rule 1.
    c:
      en: |-
        Step Functions does not match a numeric field with a string comparison, so the rules would stop matching at all.
    e:
      en: |-
        A `Parallel` state runs both models for every document, which doubles the cost, and the mid-size model still fails on long documents.
references:
  - title: "Choice workflow state - AWS Step Functions"
    url: https://docs.aws.amazon.com/step-functions/latest/dg/state-choice.html
