id: aipc01-2d-appflow-salesforce-cases
objective: "2.5.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A software company uses Salesforce for customer support. When a support case is created, the company wants Amazon Bedrock to classify the case and draft a first reply, and the result must be written back to the case in Salesforce. Processing must start from the case-creation event, not from a polling schedule. The company prefers managed integration services over custom code that reads data from Salesforce.

    Which combination of steps will meet these requirements? (Choose two.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "Enable change data capture for the Case object in Salesforce, and create an Amazon AppFlow flow that runs on Salesforce events and writes new cases to Amazon S3." } }
    - { id: b, text: { en: "Create an Amazon Bedrock knowledge base with a Salesforce data source connector, and start a data source sync job every five minutes." } }
    - { id: c, text: { en: "Create a scheduled Amazon AppFlow flow that runs every minute and copies all Salesforce cases to an Amazon S3 bucket." } }
    - { id: d, text: { en: "Invoke a Lambda function for each new case object in Amazon S3 that calls Bedrock and updates the case through the Salesforce API with credentials in AWS Secrets Manager." } }
    - { id: e, text: { en: "Index the cases with the Amazon Kendra Salesforce connector, and query the index from a Lambda function each time a new case appears." } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: "Amazon AppFlow supports Salesforce change data capture events as a flow trigger once change data capture is enabled for the object, so each new case lands in S3 without custom extraction code. An S3 event then invokes a Lambda function that calls Bedrock and writes the classification and draft reply back to the case, the CRM-enhancement pattern."
  options:
    b:
      en: "A knowledge base is for retrieval, not event processing; since September 30, 2026, new Salesforce connectors can't be created on customer-managed knowledge bases, and a sync schedule is polling."
    c:
      en: "A schedule-triggered flow is polling, which the requirement rules out, and copying all cases every minute reprocesses unchanged records."
    e:
      en: "Amazon Kendra has been closed to new customers since July 30, 2026, and an index doesn't trigger processing when a case is created."
references:
  - title: "Salesforce connector for Amazon AppFlow - Amazon AppFlow"
    url: https://docs.aws.amazon.com/appflow/latest/userguide/salesforce.html
