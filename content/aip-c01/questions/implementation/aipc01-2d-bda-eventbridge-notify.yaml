id: aipc01-2d-bda-eventbridge-notify
objective: "2.5.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A logistics company submits scanned delivery notes, stored as multipage PDF files in Amazon S3, to Amazon Bedrock Data Automation with a project that uses a custom blueprint of 40 fields. A Lambda function calls GetDataAutomationStatus in a loop until each job finishes, which wastes compute time and sometimes reaches the function's timeout. The company wants downstream processing to start as soon as a job completes, with the LEAST custom code.

    Which combination of steps will meet these requirements? (Choose two.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "Switch to the synchronous InvokeDataAutomation API so that the extraction results are returned in the API response." } }
    - { id: b, text: { en: "Enable EventBridge notifications in the notificationConfiguration parameter of each InvokeDataAutomationAsync request." } }
    - { id: c, text: { en: "Increase the polling Lambda function's timeout to the maximum value of 1,800 seconds." } }
    - { id: d, text: { en: "Reduce the blueprint to 15 fields so that each job finishes before the Lambda function's timeout." } }
    - { id: e, text: { en: "Create an Amazon EventBridge rule that matches the Data Automation job events and starts the downstream workflow." } }
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: "InvokeDataAutomationAsync accepts a notificationConfiguration whose eventBridgeConfiguration.eventBridgeEnabled flag makes BDA send job events to Amazon EventBridge. A rule on those events starts the downstream processing when a job finishes, which replaces the polling loop without custom code."
  options:
    a:
      en: "The synchronous operation supports images only; multipage PDF documents must be processed with InvokeDataAutomationAsync."
    c:
      en: "A longer timeout only lets the function poll longer; it still wastes compute time and doesn't react to completion."
    d:
      en: "Dropping 25 required fields changes the output the company needs, and the function would still poll."
references:
  - title: "Using the Bedrock Data Automation API - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/bda-using-api.html
  - title: "Lambda quotas - AWS Lambda"
    url: https://docs.aws.amazon.com/lambda/latest/dg/gettingstarted-limits.html
