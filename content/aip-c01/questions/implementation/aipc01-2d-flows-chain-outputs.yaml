id: aipc01-2d-flows-chain-outputs
objective: "2.5.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A developer builds a prompt chain in Amazon Bedrock Flows. A first prompt node summarizes a support ticket. A second prompt node uses a prompt from Amazon Bedrock Prompt Management with the variables {{summary}} and {{customer_tier}} to draft a reply; customer_tier comes from the flow input. The developer wants the chain to use the fewest additional nodes.

    How should the developer pass the summary to the second prompt node?
body:
  options:
    - { id: a, text: { en: "Store the summary with an S3 storage node, and read it back with an S3 retrieval node that is connected to the second prompt node." } }
    - { id: b, text: { en: "Add a Lambda function node between the two prompt nodes that copies the generated summary into a flow session attribute." } }
    - { id: c, text: { en: "Connect the modelCompletion output of the first prompt node directly to the summary input of the second prompt node." } }
    - { id: d, text: { en: "Add a collector node after the first prompt node, and connect the collector's array output to the second prompt node." } }
answer: { optionId: c }
explanation:
  correct:
    en: "A prompt node's inputs are the values of its prompt variables, and its output is modelCompletion. Connecting the first node's modelCompletion to the summary input of the second node chains the prompts, and the input node's output feeds customer_tier, with no extra node."
  options:
    a:
      en: "Writing to and reading from S3 adds two nodes and storage calls that a direct connection makes unnecessary."
    b:
      en: "A Lambda node adds code to maintain, and prompt variables are filled from connected node outputs, not from a copy step."
    d:
      en: "A collector node gathers the results of an iterator node into an array; there is no iteration in this chain."
references:
  - title: "Node types for your flow - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/flows-nodes.html
