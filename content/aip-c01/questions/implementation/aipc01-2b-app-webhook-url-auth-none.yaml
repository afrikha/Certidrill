id: aipc01-2b-app-webhook-url-auth-none
objective: "2.3.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company wants a code-hosting SaaS to send pull-request webhooks to an AWS Lambda function that queues each pull request for an AI review with Amazon Bedrock. The SaaS can only send HTTPS POST requests with a shared-secret HMAC signature header; it cannot sign requests with AWS credentials. The company wants to use a Lambda function URL with no other AWS service in front of the function.

    Which configuration will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Set the auth type to AWS_IAM, and give the SaaS vendor an IAM role in the company's account that it can assume to sign its calls to the function URL.
    - id: b
      text:
        en: |-
          Set the auth type to AWS_IAM, and add the HMAC secret as a condition in the function's resource-based policy.
    - id: c
      text:
        en: |-
          Set the auth type to NONE, allow public invocation in the resource-based policy, and verify the HMAC signature in the function.
    - id: d
      text:
        en: |-
          Set the auth type to NONE, and rely on Lambda to reject the requests that don't come from the SaaS vendor.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      With AWS_IAM, callers must be authenticated IAM principals, which the SaaS can't be. With NONE, Lambda performs no authentication, and the resource-based policy must grant public access for the URL to receive requests; the function must therefore verify the HMAC signature itself and reject invalid requests before queuing any work.
  options:
    a:
      en: |-
        With AWS_IAM, every request must come from an authenticated IAM principal, which the SaaS can't provide, so its webhooks would be rejected.
    b:
      en: |-
        A resource-based policy can't validate an application-level HMAC signature header.
    d:
      en: |-
        With NONE, Lambda performs no authentication, so anyone with the URL could trigger reviews unless the function verifies the signature.
references:
  - title: "Control access to Lambda function URLs - AWS Lambda"
    url: https://docs.aws.amazon.com/lambda/latest/dg/urls-auth.html
