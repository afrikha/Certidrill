id: aipc01-2a-long-approval-agent-session
objective: "2.1.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A manufacturing company runs a supplier-negotiation agent built with Strands Agents on Amazon Bedrock AgentCore Runtime. When the agent drafts a contract change, the legal team must approve it before the agent sends it to the supplier. Legal reviews take up to three business days. After approval, the agent must continue with the full context of the negotiation. The company wants a reliable design that does not keep compute running during the review.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Have the agent stay in its Runtime session and poll an approval table every few minutes until the legal team records its decision in the table.
    - id: b
      text:
        en: |-
          Give the agent an approval tool backed by a Lambda function that waits until the legal team approves and then returns the decision to the agent.
    - id: c
      text:
        en: |-
          Save the negotiation context in AgentCore Memory, have a Step Functions Standard workflow wait for the decision with a task token, and then reinvoke the agent.
    - id: d
      text:
        en: |-
          Increase the idle session timeout of the agent runtime so that the session and its in-memory context remain available until the legal review ends.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      A Runtime session lasts at most 8 hours per lifecycle, so a three-day human review must happen outside the agent. Persisting the context in AgentCore Memory, waiting with a Step Functions callback that consumes no compute, and re-invoking the agent with the decision lets the agent resume with full context.
  options:
    a:
      en: |-
        Polling keeps the session active and consuming compute, and the session still ends when it reaches its 8-hour maximum lifetime, long before a three-day review completes.
    b:
      en: |-
        A Lambda function can run for at most 1,800 seconds, so it cannot wait three days for a decision.
    d:
      en: |-
        The idle timeout does not extend the session beyond its maximum lifetime of 8 hours, and the microVM's in-memory data is lost when the session stops.
references:
  - title: Use isolated sessions for agents - Amazon Bedrock AgentCore
    url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/runtime-sessions.html
  - title: Discover service integration patterns in Step Functions - AWS Step Functions
    url: https://docs.aws.amazon.com/step-functions/latest/dg/connect-to-resource.html
