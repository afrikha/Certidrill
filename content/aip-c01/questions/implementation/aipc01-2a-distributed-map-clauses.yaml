id: aipc01-2a-distributed-map-clauses
objective: "2.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A legal technology company decomposes contract reviews into small reasoning steps. For each contract, a workflow splits the contract into clauses, asks a foundation model on Amazon Bedrock to analyze each clause against a checklist, and then aggregates the findings. Large contracts have up to 2,000 clauses, the clause list is stored as a JSON file in Amazon S3, and the review must finish within one hour, which requires about 200 clause analyses at the same time. The execution history of a run would exceed 25,000 events if every clause ran in the parent workflow.

    Which AWS Step Functions design will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Use a Map state in Inline mode with a maximum concurrency of 200 that reads the clause list from the state input.
    - id: b
      text:
        en: |-
          Use a Map state in Distributed mode that reads the clause list from Amazon S3 and runs each clause analysis as a child workflow execution.
    - id: c
      text:
        en: |-
          Use a Parallel state with one branch for each clause type and a Task state in each branch that analyzes all clauses of that type.
    - id: d
      text:
        en: |-
          Use an Express workflow with a Choice state that loops over the clause list and analyzes one clause per iteration.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      Distributed mode runs each iteration as a child workflow execution, supports up to 10,000 parallel child executions, accepts an S3 data source as input, and is recommended when the event history would exceed 25,000 entries or more than 40 concurrent iterations are needed.
  options:
    a:
      en: |-
        Inline mode supports up to 40 concurrent iterations, accepts only a JSON array from the state input, and keeps every iteration in the parent's execution history.
    c:
      en: |-
        A few branches that each loop over many clauses do not give 200 concurrent analyses, and the branches are fixed in the definition.
    d:
      en: |-
        Express workflows stop after 5 minutes, and a sequential loop cannot analyze 2,000 clauses within that time.
references:
  - title: Map workflow state - AWS Step Functions
    url: https://docs.aws.amazon.com/step-functions/latest/dg/state-map.html
