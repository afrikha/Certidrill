id: aipc01-2a-model-cascade
objective: "2.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A software company's support assistant sends every question to a large foundation model on Amazon Bedrock. An analysis shows that about 75 % of the questions are simple and that a smaller, faster model answers them correctly. The application already has an automated validator that checks whether an answer cites the knowledge base and follows the required format. The company wants to reduce inference cost significantly without lowering answer quality on the difficult questions. Users expect answers in real time.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Replace the large model with the smaller model for all questions, and add more few-shot examples to the prompt to compensate for its lower capability.
    - id: b
      text:
        en: |-
          Send each question to the smaller model first, run the validator on its answer, and send the question to the large model only when the validation fails.
    - id: c
      text:
        en: |-
          Purchase Provisioned Throughput for the large model so that the cost per request is lower, and keep sending every question to the large model.
    - id: d
      text:
        en: |-
          Collect the questions every few minutes and submit them to the large model as Amazon Bedrock batch inference jobs, which are priced lower than on-demand inference.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      A model cascade starts with a small, inexpensive model and escalates to a larger model only when a check fails or confidence is low. Most questions are answered at the lower price, and the difficult questions still reach the large model, so quality is preserved.
  options:
    a:
      en: |-
        Using only the smaller model lowers quality on the difficult questions, which the company does not accept.
    c:
      en: |-
        Provisioned Throughput reserves capacity for a fixed hourly price; it does not route the simple questions to a cheaper model, and it saves money only at high, steady utilization.
    d:
      en: |-
        Batch inference is asynchronous, so it cannot serve a real-time support assistant.
references:
  - title: Understanding intelligent prompt routing in Amazon Bedrock - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/prompt-routing.html
  - title: Process multiple prompts with batch inference - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/batch-inference.html
