id: aipc01-2a-planner-worker-models
objective: "2.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A consulting company generates due-diligence reports with a large reasoning model on Amazon Bedrock. For each report, the model writes a plan, then performs about 30 simple steps that each extract figures from one document, and finally writes the report. Reviews show that the plan and the final report need the large model, but a much cheaper model performs the extraction steps equally well. Reports must be ready within a few minutes of the request. The company wants the MOST cost-effective solution that keeps the report quality.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Keep the large model for all steps, and turn on prompt caching for the system prompt that the steps share.
    - id: b
      text:
        en: |-
          Use the cheaper model for all steps, including the plan and the final report.
    - id: c
      text:
        en: |-
          Use the large model to write the plan and the final report, and the cheaper model to perform the extraction steps.
    - id: d
      text:
        en: |-
          Submit the plan, the extraction steps, and the report as one Amazon Bedrock batch inference job to the large model.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      In a planner and workers pattern, a capable model handles planning and synthesis, where its reasoning matters, and a cheaper model executes the many simple steps. Most tokens move to the cheaper model while the parts that determine quality keep the large model.
  options:
    a:
      en: |-
        Prompt caching lowers the cost of a repeated prompt prefix only; the 30 steps would still pay large-model prices for their other input and all their output tokens.
    b:
      en: |-
        Reviews show that the plan and the report need the large model, so the cheaper model alone lowers report quality.
    d:
      en: |-
        Batch inference is asynchronous and does not fit a report that must be ready within minutes; the steps also depend on the plan, so they cannot all be submitted at once.
references:
  - title: Prompt caching for faster model inference - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/prompt-caching.html
  - title: Process multiple prompts with batch inference - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/batch-inference.html
