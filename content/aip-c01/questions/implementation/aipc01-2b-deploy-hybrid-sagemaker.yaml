id: aipc01-2b-deploy-hybrid-sagemaker
objective: "2.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company uses foundation models on Amazon Bedrock for its customer assistant. It also owns a proprietary model that requires its own inference container with custom pre-processing code and a specific GPU instance type. The application must call both models through one internal API, and the company accepts managing the proprietary model's infrastructure.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Import the proprietary model with Amazon Bedrock Custom Model Import, and call both models through the Converse API.
    - id: b
      text:
        en: |-
          Package the proprietary model in an AWS Lambda container image, and call it and Amazon Bedrock from the same function.
    - id: c
      text:
        en: |-
          Subscribe to the proprietary model in Amazon Bedrock Marketplace, and deploy it to an endpoint managed by SageMaker AI on the required GPU instance type.
    - id: d
      text:
        en: |-
          Host the proprietary model on a SageMaker AI real-time endpoint, and route requests to it or to Bedrock behind one API Gateway API.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      A hybrid deployment keeps managed models on Amazon Bedrock and hosts what Bedrock can't serve on SageMaker AI, where the company chooses the container image and the instance type. One internal API in front of both lets the routing change without changes to the clients.
  options:
    a:
      en: |-
        Custom Model Import accepts only supported open-source architectures in Hugging Face format and serves them on Bedrock's own stack; it can't run a custom inference container or code.
    b:
      en: |-
        Lambda provides no GPUs, so it can't host a model that needs a specific GPU instance type.
    c:
      en: |-
        Bedrock Marketplace offers models from its catalog of providers; a company's own proprietary model isn't available there.
references:
  - title: "Deploy models for real-time inference - Amazon SageMaker AI"
    url: https://docs.aws.amazon.com/sagemaker/latest/dg/realtime-endpoints-deploy-models.html
  - title: "Use Custom model import to import a customized open-source model into Amazon Bedrock - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/model-customization-import-model.html
