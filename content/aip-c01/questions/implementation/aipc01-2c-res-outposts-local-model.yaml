id: aipc01-2c-res-outposts-local-model
objective: "2.3.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A hospital group must keep patient records inside its own data center to comply with national health data law. It wants a GenAI assistant that summarizes clinical notes next to its electronic health record (EHR) systems, by using the same AWS APIs and tools as its cloud workloads. Only aggregated, de-identified usage statistics may be sent to the cloud. An AWS Outposts rack is already installed in the data center.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Call Amazon Bedrock in the parent Region through an interface VPC endpoint so that prompts travel over the Outpost service link instead of the internet.
    - id: b
      text:
        en: |-
          Deploy the assistant in an AWS Wavelength Zone, and connect the EHR systems to it through a carrier gateway.
    - id: c
      text:
        en: |-
          Provision Amazon Bedrock on the Outpost, and invoke the model locally through the Amazon Bedrock Runtime API.
    - id: d
      text:
        en: |-
          Host an open-weight model in containers on Outpost compute, reach it from the EHR systems through the local gateway, and send only statistics to the Region.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      An Outposts rack runs Amazon EC2 instances, Amazon ECS clusters and Amazon EKS nodes on premises, so a self-hosted open-weight model processes the clinical notes inside the data center. The local gateway connects the Outpost subnets to the on-premises network, and only the de-identified statistics leave the site.
  options:
    a:
      en: |-
        Amazon Bedrock runs in the Region: even over a private path, the prompts and the patient data they contain would leave the data center.
    b:
      en: |-
        Wavelength Zones are located in telecommunications carrier networks, not in the hospital's data center, so patient data would leave the premises.
    c:
      en: |-
        Amazon Bedrock is not one of the services that run on Outposts racks; managed Bedrock models run in AWS Regions.
references:
  - title: "What is AWS Outposts? - AWS Outposts"
    url: https://docs.aws.amazon.com/outposts/latest/userguide/what-is-outposts.html
  - title: "Local gateways for your Outposts racks - AWS Outposts"
    url: https://docs.aws.amazon.com/outposts/latest/userguide/outposts-local-gateways.html
