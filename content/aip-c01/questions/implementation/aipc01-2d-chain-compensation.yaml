id: aipc01-2d-chain-compensation
objective: "2.5.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A travel company runs a prompt chain in an AWS Step Functions Standard workflow. Step 1 uses Amazon Bedrock to extract trip details from a customer request, step 2 reserves a hotel through a partner API, and step 3 uses Bedrock to generate a personalized itinerary and send it. Step 3 has a Retry field for throttling errors. If step 3 still fails after its retries, the hotel reservation must be canceled so that the customer isn't charged, and the execution must end as failed.

    Which solution will meet these requirements?
body:
  options:
    - { id: a, text: { en: "Increase the MaxAttempts value of the Retry field on step 3 so that the itinerary generation keeps retrying until it eventually succeeds." } }
    - { id: b, text: { en: "Add a Catch field to step 3 that routes all errors to a task that cancels the hotel reservation, followed by a Fail state." } }
    - { id: c, text: { en: "Add a Choice state after step 3 that checks the step's output for an error field and routes failed runs to a cancellation task." } }
    - { id: d, text: { en: "Run steps 2 and 3 as two branches of a Parallel state so that a failure in step 3 automatically rolls back the hotel reservation." } }
answer: { optionId: b }
explanation:
  correct:
    en: "Catchers run when a state has no retrier or its retries fail to resolve the error, so a Catch on step 3 routes the error to a compensating task that cancels the reservation, the saga pattern. A Fail state then ends the execution as failed."
  options:
    a:
      en: "More retries don't guarantee success, and when they run out the execution fails without canceling the reservation."
    c:
      en: "When a task fails without a catcher, the execution stops with an error, so the Choice state never runs."
    d:
      en: "A failed branch stops the Parallel state and the other branches, but nothing undoes work that a branch already did; there is no automatic rollback."
references:
  - title: "Handling errors in Step Functions workflows - AWS Step Functions"
    url: https://docs.aws.amazon.com/step-functions/latest/dg/concepts-error-handling.html
  - title: "Prompt chaining saga patterns - AWS Prescriptive Guidance"
    url: https://docs.aws.amazon.com/prescriptive-guidance/latest/agentic-ai-patterns/prompt-chaining-saga-patterns.html
