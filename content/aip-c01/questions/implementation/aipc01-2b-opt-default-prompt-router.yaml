id: aipc01-2b-opt-default-prompt-router
objective: "2.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A team wants to try intelligent prompt routing in Amazon Bedrock this week for an English-language assistant that already uses an Amazon Nova model. The team doesn't want to choose the models, the fallback model or the response quality difference yet, and it wants to start with routing settings that Amazon Bedrock provides.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Send the assistant's requests to the default prompt router that Amazon Bedrock provides for the Nova family.
    - id: b
      text:
        en: |-
          Create a configured prompt router with create-prompt-router and set its response quality difference to 0.
    - id: c
      text:
        en: |-
          Create an AWS Step Functions workflow that sends each request to two Nova models and keeps the better answer.
    - id: d
      text:
        en: |-
          Create a prompt router that combines a Nova model with a model from another provider as the fallback model.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      Default prompt routers are pre-configured routing systems provided by Amazon Bedrock with predefined settings, and AWS recommends starting with them. Configured routers come later, when a team needs to choose two models of the same family, the fallback model and the response quality difference itself.
  options:
    b:
      en: |-
        A configured router requires the team to choose the two models, the fallback model and the routing criteria, which it wants to avoid.
    c:
      en: |-
        This is custom orchestration that pays for two model calls on every request; it isn't intelligent prompt routing.
    d:
      en: |-
        A prompt router routes between models of the same family, and creating one still requires choosing models and criteria.
references:
  - title: "Understanding intelligent prompt routing in Amazon Bedrock - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/prompt-routing.html
