id: aipc01-2a-confidence-based-review
objective: "2.1.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A mortgage lender uses a foundation model to extract fields from loan documents. Today, a human checks every extraction before it enters the loan system, and the review backlog delays approvals. Audits show that 92 % of the extractions are correct. Each extraction includes a confidence score per field, and business rules can check totals and dates. The lender wants to reduce the review workload significantly, and no extraction may enter the loan system without either passing the checks or being reviewed by a human.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Send every extraction to a SageMaker Ground Truth labeling job with a private workforce of reviewers before it enters the loan system.
    - id: b
      text:
        en: |-
          Send to human review only the extractions with a field below a confidence threshold or a failed business rule, and send the others directly to the loan system.
    - id: c
      text:
        en: |-
          Send a random 10 % of the extractions to human review before they enter the loan system, and send all the remaining extractions directly to the system.
    - id: d
      text:
        en: |-
          Stop human review, and apply an Amazon Bedrock guardrail with content filters to the model's responses before they enter the loan system.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      Confidence-based routing sends only uncertain or rule-breaking outputs to a human, which cuts the review volume while every extraction either passes the checks or is reviewed. The threshold can be tuned over time with the results of the reviews.
  options:
    a:
      en: |-
        SageMaker Ground Truth has been closed to new customers since July 30, 2026, and reviewing every extraction does not reduce the workload.
    c:
      en: |-
        Random sampling lets 90 % of the extractions, including uncertain ones, enter the loan system without checks or review.
    d:
      en: |-
        Content filters detect harmful content such as hate or violence; they do not check whether extracted values are correct.
references:
  - title: Discover service integration patterns in Step Functions - AWS Step Functions
    url: https://docs.aws.amazon.com/step-functions/latest/dg/connect-to-resource.html
