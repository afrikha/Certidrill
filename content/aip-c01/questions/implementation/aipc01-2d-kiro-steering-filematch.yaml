id: aipc01-2d-kiro-steering-filematch
objective: "2.5.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A team's repository contains a generative AI application whose prompt templates are under the prompts/ folder. The team has detailed rules for editing these templates, such as variable naming, mandatory safety instructions, and a maximum length. Kiro must apply the rules automatically whenever the agent works on files under prompts/, but must not load them into the context for other work. The rules must be shared with every developer through the repository.

    Which solution will meet these requirements?
body:
  options:
    - { id: a, text: { en: "Put the rules in a steering file in ~/.kiro/steering/ on each developer's computer, and keep the default inclusion mode." } }
    - { id: b, text: { en: "Put the rules in an AGENTS.md file in the prompts/ folder, next to the templates that they describe." } }
    - { id: c, text: { en: "Put the rules in a steering file in .kiro/steering/ with the fileMatch inclusion mode and a pattern for prompts/**." } }
    - { id: d, text: { en: "Put the rules in a steering file in .kiro/steering/ with the manual inclusion mode, and reference it in chat." } }
answer: { optionId: c }
explanation:
  correct:
    en: "Workspace steering files live in .kiro/steering/ in the repository, so every developer gets them. The fileMatch inclusion mode, set in the file's front matter, loads the file only when the agent works with files that match the pattern, which keeps the rules out of the context for other work."
  options:
    a:
      en: "Global steering in the home folder isn't shared through the repository, and the default mode (always) loads the rules in every interaction."
    b:
      en: "AGENTS.md files are always included and don't support inclusion modes, so the rules would be loaded for all work."
    d:
      en: "Manual inclusion loads the file only when a developer references it, so the rules aren't applied automatically."
references:
  - title: "Steering - Features - Docs - Kiro"
    url: https://kiro.dev/docs/steering/
