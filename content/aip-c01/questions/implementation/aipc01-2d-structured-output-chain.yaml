id: aipc01-2d-structured-output-chain
objective: "2.5.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company chains two Amazon Bedrock calls with the Converse API. The first call extracts order details from a customer email as JSON, and the second call uses that JSON to draft a reply. About 3% of the first call's responses contain extra prose or miss required keys, which breaks the second step. The company wants the first call to always return JSON that matches a defined schema, with the LEAST custom code.

    Which solution will meet these requirements?
body:
  options:
    - { id: a, text: { en: "Add \"Return only valid JSON\" to the first call's system prompt, set the temperature to 0, and keep the rest of the chain unchanged." } }
    - { id: b, text: { en: "Add a Lambda function between the two calls that strips text around the JSON and repeats the first call when required keys are missing." } }
    - { id: c, text: { en: "Attach an Amazon Bedrock guardrail with a denied topic for non-JSON content to the first call so that invalid responses are blocked." } }
    - { id: d, text: { en: "Set outputConfig.textFormat on the first call to a JSON schema that lists the required keys and sets additionalProperties to false." } }
answer: { optionId: d }
explanation:
  correct:
    en: "Structured outputs make the Converse response conform to a JSON schema given in outputConfig.textFormat, so the next step can parse it without custom validation. Every object in the schema must set additionalProperties to false. maxTokens must still be high enough for the whole JSON, or the response stops with max_tokens."
  options:
    a:
      en: "Instructions and a low temperature make valid JSON more likely but don't guarantee that every response matches the schema."
    b:
      en: "Parsing and retry logic is the custom code the company wants to avoid, and retries add latency and cost."
    c:
      en: "Guardrails filter harmful or unwanted content; they don't enforce a JSON structure or required keys."
references:
  - title: "Get validated JSON results from models - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/structured-output.html
