id: aipc01-2b-sec-cognito-group-roles
objective: "2.3.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A mobile app calls Amazon Bedrock directly with temporary AWS credentials from an Amazon Cognito identity pool. Users sign in through a Cognito user pool. Members of the premium user pool group must receive an IAM role that can invoke a larger model, and all other users must receive a role that is limited to a small model. Users must not be able to choose their own role.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Attach IAM roles to a premium group and a standard group, and have the identity pool choose the role from the token.
    - id: b
      text:
        en: |-
          Add a custom:tier attribute that users can edit, and map custom:tier equal to premium to the premium role with an identity pool rule.
    - id: c
      text:
        en: |-
          Use one authenticated role that allows both models, and have the app choose the model based on the user's group.
    - id: d
      text:
        en: |-
          Allow the larger model in the identity pool's unauthenticated role and give all users guest credentials.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      Roles attached to user pool groups are passed in the ID token through the cognito:roles and cognito:preferred_role claims, with the preferred role taken from the group with the best precedence. With role selection set to choose the role from the token, the identity pool issues credentials for the group's role, which users can't change.
  options:
    b:
      en: |-
        If a mapped claim can be modified by the end user, any user can assume the premium role.
    c:
      en: |-
        The credentials themselves allow both models, so any user can bypass the app's choice.
    d:
      en: |-
        Guest credentials don't distinguish premium users and let anyone invoke the larger model without signing in.
references:
  - title: "Using role-based access control - Amazon Cognito"
    url: https://docs.aws.amazon.com/cognito/latest/developerguide/role-based-access-control.html
