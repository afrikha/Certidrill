id: aipc01-2a-memory-user-preferences
objective: "2.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A travel company is building a booking assistant with Strands Agents and hosts it on Amazon Bedrock AgentCore Runtime. Customers often come back weeks after their last conversation. The assistant must remember each customer's stated preferences, such as window seats, a preferred hotel chain, and a formal tone, and apply them automatically in later conversations. The preferences of one customer must never be returned to another customer. The company wants the solution with the LEAST operational overhead.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Reuse the same runtimeSessionId for every conversation of a customer so that AgentCore Runtime routes the customer back to the session that holds the earlier conversation.
    - id: b
      text:
        en: |-
          Configure a SummarizingConversationManager on the Strands agent so that older messages, including stated preferences, are condensed into a summary instead of being discarded.
    - id: c
      text:
        en: |-
          Write each turn to AgentCore Memory with CreateEvent and the customer ID as the actor, add the built-in user preference strategy, and retrieve the customer's records in each new session.
    - id: d
      text:
        en: |-
          Save every conversation transcript to an Amazon S3 prefix per customer, and have a Lambda function prepend all earlier transcripts of the customer to the prompt of each new conversation.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      AgentCore Memory long-term memory extracts insights from the events written with CreateEvent asynchronously, and the built-in user preference strategy is designed to capture preferences, choices, and styles. Its default namespace includes the actor ID, so records are stored per customer and can be retrieved for that customer only. The extraction and consolidation pipeline is fully managed, which keeps operational overhead low.
  options:
    a:
      en: |-
        A Runtime session is stopped after 15 minutes of inactivity by default or after its 8-hour lifetime, and its memory and disk are ephemeral, so a conversation from weeks ago is no longer there.
    b:
      en: |-
        A conversation manager only manages the message history of the current agent; it does not persist anything across sessions that start weeks later.
    d:
      en: |-
        Prepending every past transcript grows the prompt without limit, raises token cost and latency, and eventually exceeds the context window. It also requires custom storage and retrieval code.
references:
  - title: User preference memory strategy - Amazon Bedrock AgentCore
    url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/user-preference-memory-strategy.html
  - title: Memory types - Amazon Bedrock AgentCore
    url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/memory-types.html
