id: aipc01-2c-route-multimodal-sfn
objective: "2.4.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A Step Functions workflow routes insurance claims to models on Amazon Bedrock. A `Choice` state sends claims with a damage photo to a multimodal model and other claims to a text model, both through the optimized `InvokeModel` task without Lambda functions. An intake service writes each claim's complete model request, including the encoded photo, to Amazon S3. Some requests are several megabytes in size, and executions fail when the request is copied into the task's `Body` field. The company must process every claim without adding Lambda functions or changing the intake service.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Encode the photo again in Base64 with a smaller resolution, and keep passing the request in the `Body` field of the task.
    - id: b
      text:
        en: |-
          Replace the `Choice` state with an Amazon Bedrock prompt router that selects the multimodal model when a photo is present.
    - id: c
      text:
        en: |-
          Set the task's `Input` field to the S3 URI of the model request, and set its `Output` field to an S3 location for the response.
    - id: d
      text:
        en: |-
          Convert the workflow to an Express workflow so that larger payloads can be passed to the task.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      The `Body` of the Step Functions `InvokeModel` task is limited to 256 KiB. The `Input` field takes an S3 URI as the source of the request, and the `Output` field writes the model response to S3, replacing the response body with a reference to that location.
  options:
    a:
      en: |-
        Re-encoding the photo changes the intake service, and a smaller photo can still exceed the 256 KiB limit of `Body`.
    b:
      en: |-
        A prompt router chooses between two models of the same family by predicted quality, not by the presence of a photo, and it does not solve the size problem.
    d:
      en: |-
        The workflow type does not raise the limit on the `Body` field of the task.
references:
  - title: "Invoke and customize Amazon Bedrock models with Step Functions - AWS Step Functions"
    url: https://docs.aws.amazon.com/step-functions/latest/dg/connect-bedrock.html
  - title: "Choice workflow state - AWS Step Functions"
    url: https://docs.aws.amazon.com/step-functions/latest/dg/state-choice.html
