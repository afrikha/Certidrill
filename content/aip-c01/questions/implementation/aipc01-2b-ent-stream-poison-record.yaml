id: aipc01-2b-ent-stream-poison-record
objective: "2.3.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An AWS Lambda function processes an Amazon DynamoDB stream and generates product descriptions with Amazon Bedrock. A malformed item now makes the function fail on every attempt, and the processing of later changes in that shard has stopped. The company wants later changes to keep flowing even when one record can't be processed.

    What should the company do?
body:
  options:
    - id: a
      text:
        en: |-
          Increase the function's timeout to the maximum value so that each attempt has more time to finish.
    - id: b
      text:
        en: |-
          Increase the batch size of the event source mapping so that more records are processed in each attempt.
    - id: c
      text:
        en: |-
          Configure a retry limit and a maximum record age on the function's event source mapping.
    - id: d
      text:
        en: |-
          Subscribe a second Lambda function to the same stream to process the later changes.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      When the function returns an error, Lambda retries the batch until it is processed successfully or the data expires, which blocks the later records of the shard. A retry limit, smaller batches or discarding records older than a maximum age lets processing move past a record that can't be processed.
  options:
    a:
      en: |-
        The record is malformed, so more time doesn't make the attempt succeed.
    b:
      en: |-
        A larger batch still contains the failing record, so the whole batch keeps failing.
    d:
      en: |-
        The second function reads every record independently and doesn't unblock the first function's shard.
references:
  - title: "DynamoDB Streams and AWS Lambda triggers - Amazon DynamoDB"
    url: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/Streams.Lambda.html
