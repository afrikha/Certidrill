id: aipc01-2a-strict-tool-schema
objective: "2.1.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A fintech company's assistant calls a create_invoice tool through the Amazon Bedrock Converse API. The model sometimes omits the required currency field or adds properties that the schema does not define, and the Lambda function that implements the tool fails on these inputs. The model that the company uses supports structured outputs. The company wants Amazon Bedrock to make the model's tool calls follow the tool's input schema.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Set toolChoice to any in the tool configuration so that the model must request a tool in every response that it returns.
    - id: b
      text:
        en: |-
          Set toolChoice to tool with the name create_invoice so that the model always requests this tool with its parameters.
    - id: c
      text:
        en: |-
          Add an Amazon Bedrock guardrail with a denied topic that blocks every request that creates an invoice without a currency field.
    - id: d
      text:
        en: |-
          Set strict to true in the tool specification, and set additionalProperties to false and list the required fields in every schema object.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      Adding strict: true to a tool definition turns on schema validation of tool names and inputs, so the model's tool calls follow the input schema. With structured outputs, every object in the schema must set additionalProperties to false, otherwise Amazon Bedrock returns a ValidationException.
  options:
    a:
      en: |-
        toolChoice any forces the model to request a tool, but it does not make the input match the schema.
    b:
      en: |-
        Forcing a specific tool decides which tool is requested, not whether its input is complete and valid.
    c:
      en: |-
        A denied topic filters subjects in text; it does not validate the structure of tool inputs.
references:
  - title: Get validated JSON results from models - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/structured-output.html
  - title: ToolSpecification - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/APIReference/API_runtime_ToolSpecification.html
