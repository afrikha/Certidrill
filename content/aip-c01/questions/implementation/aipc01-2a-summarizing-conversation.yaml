id: aipc01-2a-summarizing-conversation
objective: "2.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An insurance company has a claims assistant built with Strands Agents that uses the default conversation manager. Claim conversations are long and include many tool results. Agents report that late in a conversation the assistant forgets details that the customer gave at the start, such as the policy number and the date of the incident. The assistant must keep the essential facts from early in the conversation while staying within the model's context window, and the company does not want to send the full history with every request.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Replace the default conversation manager with a NullConversationManager so that no messages are removed from the conversation history.
    - id: b
      text:
        en: |-
          Increase the window size of the SlidingWindowConversationManager so that more of the most recent messages are kept in the history.
    - id: c
      text:
        en: |-
          Add the built-in user preference strategy of AgentCore Memory so that facts from the conversation are extracted into long-term memory.
    - id: d
      text:
        en: |-
          Configure a SummarizingConversationManager that replaces the oldest messages with a summary and keeps the most recent messages intact.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      The default SlidingWindowConversationManager removes the oldest messages when the context is too large, which drops the early facts. The SummarizingConversationManager condenses the oldest part of the history into a summary and preserves a number of recent messages, so key facts stay available while the context remains bounded.
  options:
    a:
      en: |-
        Keeping the full history sends everything with every request and eventually exceeds the context window, which the company wants to avoid.
    b:
      en: |-
        A larger sliding window delays the problem but still discards the oldest messages, including the policy number given at the start.
    c:
      en: |-
        The user preference strategy extracts preferences, choices, and styles across sessions asynchronously; it is not designed to keep claim facts available within the current conversation.
references:
  - title: Strands Agents - AWS Prescriptive Guidance
    url: https://docs.aws.amazon.com/prescriptive-guidance/latest/agentic-ai-frameworks/strands-agents.html
