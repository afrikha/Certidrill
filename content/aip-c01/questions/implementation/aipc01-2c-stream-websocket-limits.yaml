id: aipc01-2c-stream-websocket-limits
objective: "2.4.2"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    A research assistant streams answers over an API Gateway WebSocket API. Two problems appear. When the worker posts a complete generated report table in a single `@connections` message, some connections close with code 1009. Analysts who keep the assistant open all day lose their session every 2 hours. The company must fix both problems.

    Which combination of actions will meet these requirements? (Choose two.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Request a Service Quotas increase of the WebSocket frame size so that a complete report table fits in one frame.
    - id: b
      text:
        en: |-
          Send the report as several smaller messages within the frame size limit instead of one large message.
    - id: c
      text:
        en: |-
          Request an increase of the idle connection timeout of the WebSocket API to 24 hours through Service Quotas.
    - id: d
      text:
        en: |-
          Keep the conversation state in DynamoDB, and have the client reconnect and resume when the connection closes.
    - id: e
      text:
        en: |-
          Replace the WebSocket API with REST API response streaming, which has no maximum connection duration.
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |-
      WebSocket frames are limited to 32 KB and messages to 128 KB, and a larger frame or message closes the connection with code 1009, so the worker must send smaller messages. The connection duration is limited to 2 hours and cannot be adjusted, so the client must reconnect and resume from stored state.
  options:
    a:
      en: |-
        The frame size quota is not adjustable.
    c:
      en: |-
        The idle timeout, 10 minutes, is not adjustable, and the 2-hour limit is the maximum connection duration, not an idle timeout.
    e:
      en: |-
        Streamed REST responses also have a maximum duration, 15 minutes.
references:
  - title: "Quotas for configuring and running a WebSocket in API Gateway - Amazon API Gateway"
    url: https://docs.aws.amazon.com/apigateway/latest/developerguide/apigateway-execution-service-websocket-limits-table.html
  - title: "Stream the integration response for your proxy integrations in API Gateway - Amazon API Gateway"
    url: https://docs.aws.amazon.com/apigateway/latest/developerguide/response-transfer-mode.html
