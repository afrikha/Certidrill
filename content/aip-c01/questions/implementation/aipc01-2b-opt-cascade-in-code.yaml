id: aipc01-2b-opt-cascade-in-code
objective: "2.2.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company extracts fields from supplier invoices written in French and German. A small model from one provider handles most invoices correctly. When the company's JSON Schema validator rejects the output, or when the model stops because it reached the token limit, the request must be retried on a larger model from a different provider. The company also wants a metric of how often requests escalate.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Cascade in application code: call the small model, escalate on a failed validation or a max_tokens stop, and publish a CloudWatch metric.
    - id: b
      text:
        en: |-
          Create an Amazon Bedrock intelligent prompt router with the small model as the fallback model and the larger model as the other model.
    - id: c
      text:
        en: |-
          Send every invoice to both models in parallel, and keep the larger model's answer whenever the two outputs differ.
    - id: d
      text:
        en: |-
          Distill the larger model into the small model, and send every invoice only to the distilled model from then on.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      API-based cascading sends each request to an inexpensive model first and escalates only when an application-specific check fails, here schema validation or a max_tokens stop. Because the rule depends on the company's own validator and spans providers, it belongs in application code, which can also publish the escalation metric.
  options:
    b:
      en: |-
        A prompt router chooses between two models of the same family, is optimized for English prompts, and decides on predicted response quality; it can't act on the company's validator result.
    c:
      en: |-
        Calling both models for every invoice pays for the larger model on every request, which defeats the purpose of starting small.
    d:
      en: |-
        A distilled model can still fail validation, and the requirement is to escalate failed requests to the larger model.
references:
  - title: "Understanding intelligent prompt routing in Amazon Bedrock - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/prompt-routing.html
