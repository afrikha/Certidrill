id: aipc01-2c-res-cloudtrail-inference-region
objective: "2.3.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A healthcare software company calls a model from us-east-1 through a US geographic cross-Region inference profile. For each inference request, auditors want evidence of the AWS Region that actually processed the request. The compliance team wants to use records that AWS generates instead of adding application logging.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Query the Amazon Bedrock `InvocationLatency` metric in CloudWatch with the `ModelId` dimension, and compare the values across the Regions of the profile.
    - id: b
      text:
        en: |-
          Review the AWS CloudTrail events in us-east-1, and report the `additionalEventData.inferenceRegion` field of each inference request.
    - id: c
      text:
        en: |-
          Ask the application teams to add the processing Region to `requestMetadata`, and query the model invocation logs with CloudWatch Logs Insights.
    - id: d
      text:
        en: |-
          Enable VPC Flow Logs for the `bedrock-runtime` interface endpoint, and report the destination address of each flow.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      CloudTrail logs every cross-Region inference request in the source Region, and the `additionalEventData.inferenceRegion` field records the Region where the request was processed. This gives per-request evidence generated by AWS.
  options:
    a:
      en: |-
        CloudWatch metrics are aggregates; they do not identify the Region that processed an individual request.
    c:
      en: |-
        `requestMetadata` is supplied by the caller, which does not know which Region Amazon Bedrock chose, and this is application logging.
    d:
      en: |-
        Flow logs show traffic between the VPC and the endpoint in the source Region, not the Region where Amazon Bedrock processed the request.
references:
  - title: "Route model inference requests across AWS Regions with cross-Region inference - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/cross-region-inference.html
  - title: "Monitor model invocation using CloudWatch Logs and Amazon S3 - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/model-invocation-logging.html
