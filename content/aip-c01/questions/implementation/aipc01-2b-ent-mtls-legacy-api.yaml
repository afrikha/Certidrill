id: aipc01-2b-ent-mtls-legacy-api
objective: "2.3.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company publishes ClaimSummarized events to an Amazon EventBridge event bus after Amazon Bedrock summarizes each claim. Each summary must be posted to a legacy claims API that runs in the company's VPC and requires mutual TLS with a client certificate. The API can take up to 20 seconds to respond, and failed deliveries must be retried.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Create an API destination for the legacy API with a connection to the private API, and add the client certificate to the connection.
    - id: b
      text:
        en: |-
          Create an API destination with an OAuth connection, and raise its invocation rate so that slow responses don't time out.
    - id: c
      text:
        en: |-
          Expose the legacy API through a public endpoint without mutual TLS so that an API destination can reach it.
    - id: d
      text:
        en: |-
          Send the events to an Amazon SQS queue, and have a Lambda function in the VPC post each summary to the API with the client certificate.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      API destination connections don't support mutual TLS, and EventBridge times out API destination requests that take longer than 5 seconds. A queue with a Lambda function in the VPC can present the client certificate, wait for the slow API, and retry failed deliveries from the queue.
  options:
    a:
      en: |-
        API destination connections don't support mutual TLS, and EventBridge times out API destination requests after 5 seconds.
    b:
      en: |-
        OAuth doesn't satisfy the mutual TLS requirement, and the invocation rate doesn't change the 5-second timeout.
    c:
      en: |-
        Removing mutual TLS violates the API's security requirement, and 20-second responses still exceed the 5-second timeout.
references:
  - title: "API destinations as targets in Amazon EventBridge - Amazon EventBridge"
    url: https://docs.aws.amazon.com/eventbridge/latest/userguide/eb-api-destinations.html
