id: aipc01-2b-sec-per-function-model-roles
objective: "2.3.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Three AWS Lambda functions in a company's GenAI application share one execution role whose policy allows bedrock:* on all resources. Each function calls a different foundation model with the Converse API. A security review requires least-privilege access to models.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Keep the shared role and add a permissions boundary that allows bedrock:* on all resources.
    - id: b
      text:
        en: |-
          Give each function its own role that allows bedrock:InvokeModel only on the ARN of its model.
    - id: c
      text:
        en: |-
          Keep the shared role, and restrict it to bedrock:InvokeModel on all foundation models in the account.
    - id: d
      text:
        en: |-
          Keep the shared role and enable model invocation logging to audit which function calls which model.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      Least privilege gives each principal only what it needs: one execution role per function, allowing bedrock:InvokeModel (the permission that Converse requires) only on that function's model ARN. A faulty or compromised function can then neither call the other models nor use other Amazon Bedrock APIs.
  options:
    a:
      en: |-
        A boundary that allows bedrock:* on everything removes no permission.
    c:
      en: |-
        Every function could still invoke every model.
    d:
      en: |-
        Logging records calls after they happen; it doesn't restrict access.
references:
  - title: "Inference using Converse API - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/conversation-inference.html
  - title: "Identity-based policy examples for Amazon Bedrock - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/security_iam_id-based-policy-examples.html
