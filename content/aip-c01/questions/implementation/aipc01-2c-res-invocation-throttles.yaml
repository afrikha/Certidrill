id: aipc01-2c-res-invocation-throttles
objective: "2.4.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An operations team monitors a GenAI application with alarms on the Amazon Bedrock `InvocationClientErrors` and `InvocationServerErrors` metrics. During traffic peaks, users receive errors caused by throttling, but neither alarm fires and both error metrics stay flat. The team needs an alarm that detects throttled model invocations by using a metric that Amazon Bedrock publishes.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Create an alarm on `EstimatedTPMQuotaUsage` that fires when the estimate approaches the tokens-per-minute quota.
    - id: b
      text:
        en: |-
          Create an alarm on `InvocationThrottles`, because throttled requests are excluded from the invocation and error metrics.
    - id: c
      text:
        en: |-
          Create an alarm on `InvocationLatency`, because throttled requests are recorded as invocations with a longer latency.
    - id: d
      text:
        en: |-
          Create an alarm that fires when `Invocations` falls below its usual level, because throttled calls are counted as failed calls.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      `InvocationThrottles` counts the invocations that were throttled, and throttled requests are not counted in `Invocations`, `InvocationClientErrors` or `InvocationServerErrors`. The number of throttles seen also depends on the SDK retry settings.
  options:
    a:
      en: |-
        `EstimatedTPMQuotaUsage` is an approximation that does not reflect the reservation-based token consumption that drives throttling, and AWS advises against using it as the only quota indicator.
    c:
      en: |-
        Latency does not identify throttled requests, which are not counted as invocations.
    d:
      en: |-
        Throttled requests are not counted in `Invocations`, and a drop in traffic has many other causes.
references:
  - title: "Monitor bedrock-runtime inference using CloudWatch metrics - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/monitoring-cw.html
