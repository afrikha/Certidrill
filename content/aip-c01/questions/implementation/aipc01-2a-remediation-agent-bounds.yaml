id: aipc01-2a-remediation-agent-bounds
objective: "2.1.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company is building an operations agent that diagnoses alarms and can reboot Amazon EC2 instances through a Lambda tool. Each remediation runs as an AWS Step Functions Standard workflow execution. The security team requires that the tool must never reboot an instance that has the tag env=production, regardless of what the model requests. The operations team requires that no remediation run for more than 15 minutes.

    Which combination of actions will meet these requirements? (Choose two.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Add a rule to the agent's system prompt that instances tagged env=production must never be rebooted under any circumstances.
    - id: b
      text:
        en: |-
          Configure an Amazon Bedrock guardrail with a denied topic that blocks responses that mention rebooting production instances.
    - id: c
      text:
        en: |-
          Set the TimeoutSeconds field of the Step Functions state machine to 900 seconds so that executions fail after 15 minutes.
    - id: d
      text:
        en: |-
          Create an Amazon EventBridge rule on AWS CloudTrail events that notifies the operations team when a production instance is rebooted.
    - id: e
      text:
        en: |-
          Give the Lambda tool an execution role that allows ec2:RebootInstances only when the aws:ResourceTag/env key is not equal to production.
answer: { optionIds: [ c, e ] }
explanation:
  correct:
    en: |-
      A condition on the resource tag in the tool's IAM role makes any reboot of a production-tagged instance fail with an access error, whatever the model asks for. A state machine TimeoutSeconds of 900 makes Step Functions fail the execution with States.Timeout when a run exceeds 15 minutes.
  options:
    a:
      en: |-
        A system prompt rule can be ignored or overridden by prompt injection, so it is not a guarantee.
    b:
      en: |-
        A denied topic filters text; it does not stop the tool from calling the EC2 API with a production instance ID.
    d:
      en: |-
        A notification after the reboot detects the problem but does not prevent it.
references:
  - title: Handling errors in Step Functions workflows - AWS Step Functions
    url: https://docs.aws.amazon.com/step-functions/latest/dg/concepts-error-handling.html
  - title: Defining Lambda Event Function permissions with an execution role - AWS Lambda
    url: https://docs.aws.amazon.com/lambda/latest/dg/lambda-intro-execution-role.html
