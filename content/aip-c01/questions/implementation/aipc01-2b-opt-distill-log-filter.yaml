id: aipc01-2b-opt-distill-log-filter
objective: "2.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Several applications in one AWS account call the same large teacher model on Amazon Bedrock, and model invocation logging stores all of their prompts and responses. Each application tags its requests with an app value in requestMetadata. The company wants to distill a smaller student model for the claims application only by reusing that application's logged prompt-response pairs, with the LEAST effort.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Create a distillation job that uses all the invocation logs, and rely on the student model to ignore the other applications' prompts.
    - id: b
      text:
        en: |-
          Query the logs with Amazon Athena, build a training file from the claims records, and run a separate fine-tuning job on the student model.
    - id: c
      text:
        en: |-
          Create a distillation job that uses the invocation logs and filters them on the claims application's requestMetadata value.
    - id: d
      text:
        en: |-
          Create a distillation job with a different teacher model from the one in the logs so that only fresh responses are generated.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      Model Distillation can take its data from invocation logs and filter those logs by requestMetadata, so only the claims application's records are used. Because the job's teacher matches the model in the logs, the logged prompt-response pairs are reused instead of generating new teacher responses.
  options:
    a:
      en: |-
        The student would be trained on every application's data instead of the claims use case.
    b:
      en: |-
        This works but requires building the dataset and the training job by hand, which is more effort than letting distillation read the logs.
    d:
      en: |-
        When the teacher doesn't match the model in the logs, the logs aren't used at all, and nothing limits the job to the claims application.
references:
  - title: "Customize a model with distillation in Amazon Bedrock - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/model-distillation.html
