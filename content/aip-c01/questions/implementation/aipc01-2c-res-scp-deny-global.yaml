id: aipc01-2c-res-scp-deny-global
objective: "2.3.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company uses AWS Organizations to manage 40 accounts that call Amazon Bedrock. The data protection officer allows geographic cross-Region inference profiles but forbids global cross-Region inference profiles in every account, whatever IAM role or network path a team uses. The security team attached an SCP that denies `bedrock:*` when `aws:RequestedRegion` equals any Region outside the company's geography, but teams can still use global profiles.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Create an interface VPC endpoint for `bedrock-runtime` in each VPC, and attach an endpoint policy that denies inference profiles whose ARNs match `global.*`.
    - id: b
      text:
        en: |-
          Attach an SCP that denies `bedrock:*` when `aws:RequestedRegion` equals `unspecified` and `bedrock:InferenceProfileArn` matches the ARN pattern of global profiles.
    - id: c
      text:
        en: |-
          Turn on model invocation logging in every account, and create an EventBridge rule that alerts the security team when a request uses a global profile.
    - id: d
      text:
        en: |-
          Attach a permissions boundary to every developer role that denies `bedrock:InvokeModel` on foundation model ARNs in Regions outside the geography.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      For a global profile, Amazon Bedrock evaluates the global foundation model with `aws:RequestedRegion` set to `unspecified`, so deny statements that name specific Regions never match it. An SCP that denies requests when the Region is `unspecified` and the profile ARN matches `global.*` blocks global routing in all member accounts, while geographic profiles keep working.
  options:
    a:
      en: |-
        An endpoint policy applies only to requests that pass through that VPC endpoint. Calls from other networks or through the public endpoint are not covered, so the control is not organization-wide.
    c:
      en: |-
        Logging and alerting detect global inference after the requests have already been processed outside the geography; they do not prevent it.
    d:
      en: |-
        Global routing is authorized on a global foundation model ARN that names no Region, so Region-specific denies don't match it. A boundary also protects only the roles it is attached to, not every role in 40 accounts.
references:
  - title: "Global cross-Region inference - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/global-cross-region-inference.html
  - title: "Route model inference requests across AWS Regions with cross-Region inference - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/cross-region-inference.html
