id: aipc01-2a-ensemble-branch-catch
objective: "2.1.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company runs an ensemble of three foundation models in an AWS Step Functions Parallel state with one branch per model, followed by a Lambda function that aggregates the answers. When one model is throttled, its branch fails and the whole execution fails, even though the other two models answered. The company wants the aggregation to run whenever at least two models answer, and the aggregator must know which models did not answer.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Add a Catch with ErrorEquals set to States.ALL to the Parallel state that goes to the aggregation function when any of the branches fails.
    - id: b
      text:
        en: |-
          Add a Retry with ErrorEquals set to States.ALL to the Parallel state so that the three branches run again when one of them fails.
    - id: c
      text:
        en: |-
          Add a Catch to the model Task state in each branch that goes to a Pass state returning an abstention, so that the branch still ends successfully.
    - id: d
      text:
        en: |-
          Replace the Parallel state with three Task states that invoke the models one after the other before the aggregation function.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      If any branch fails, the entire Parallel state fails and its other branches are stopped. Catching the error inside each branch turns a failed model call into a normal branch output that marks the abstention, so the Parallel state returns an array with all three results and the aggregator can count how many models answered.
  options:
    a:
      en: |-
        A catcher on the Parallel state runs only after the whole state has failed; the outputs of the branches that succeeded are not passed to the aggregator.
    b:
      en: |-
        Retrying the Parallel state re-invokes all three models, which adds cost and latency, and the execution still fails if the throttling persists.
    d:
      en: |-
        Sequential calls add the latencies of the three models, and an unhandled error in any Task state still fails the execution.
references:
  - title: Parallel workflow state - AWS Step Functions
    url: https://docs.aws.amazon.com/step-functions/latest/dg/state-parallel.html
  - title: Handling errors in Step Functions workflows - AWS Step Functions
    url: https://docs.aws.amazon.com/step-functions/latest/dg/concepts-error-handling.html
