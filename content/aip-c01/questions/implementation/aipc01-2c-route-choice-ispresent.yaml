id: aipc01-2c-route-choice-ispresent
objective: "2.4.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A Step Functions workflow receives support requests as JSON. Some requests contain an optional `screenshot` field with the S3 location of an image. Requests that have a screenshot must be answered by a multimodal model on Amazon Bedrock, and the others by a text model, in the same workflow.

    Which state configuration will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          A `Choice` state with an `IsPresent` rule on `$.screenshot` for the multimodal model task and a `Default` text model task.
    - id: b
      text:
        en: |-
          A `Parallel` state that sends every request to the multimodal model task and to the text model task at the same time.
    - id: c
      text:
        en: |-
          A `Map` state that iterates over the fields of each request and calls the multimodal model task once for each field.
    - id: d
      text:
        en: |-
          A `Pass` state that adds the model ID of the multimodal model to every request before one shared model task runs.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      A `Choice` rule with `IsPresent` checks whether the field exists and transitions to the matching task, and the `Default` branch handles the requests without a screenshot.
  options:
    b:
      en: |-
        Both models run for every request, which doubles the cost and routes nothing.
    c:
      en: |-
        A `Map` state iterates over the items of an array; it does not choose a model.
    d:
      en: |-
        Every request goes to the multimodal model, so nothing is routed.
references:
  - title: "Choice workflow state - AWS Step Functions"
    url: https://docs.aws.amazon.com/step-functions/latest/dg/state-choice.html
