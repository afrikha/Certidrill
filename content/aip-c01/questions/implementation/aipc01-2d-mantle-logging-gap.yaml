id: aipc01-2d-mantle-logging-gap
objective: "2.5.6"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A team migrated an application from the Amazon Bedrock Converse API to an OpenAI-compatible Chat Completions client and pointed the client at the bedrock-mantle endpoint. Since the migration, the application's prompts and responses no longer appear in the model invocation logs in CloudWatch Logs, while the logs of other applications in the same account and Region still appear. The team wants to keep its OpenAI-compatible client code.

    Which solution will restore the invocation logs?
body:
  options:
    - { id: a, text: { en: "Delete and re-create the Region's model invocation logging configuration, and select the Text data type again for the destination." } }
    - { id: b, text: { en: "Enable AWS X-Ray tracing for the application so that the Chat Completions requests and responses are captured in the traces." } }
    - { id: c, text: { en: "Add an Amazon S3 location for large data delivery so that the Chat Completions request and response bodies are stored in S3." } }
    - { id: d, text: { en: "Point the OpenAI-compatible client at the Chat Completions API on the bedrock-runtime endpoint instead of the bedrock-mantle endpoint." } }
answer: { optionId: d }
explanation:
  correct:
    en: "Model invocation logging captures calls made through the bedrock-runtime endpoint, including the OpenAI-compatible Responses and Chat Completions APIs on that endpoint. Calls through the bedrock-mantle endpoint aren't currently captured, so moving the client to bedrock-runtime restores the logs without rewriting it."
  options:
    a:
      en: "Logging works for the other applications, so the configuration isn't the problem; the endpoint the application calls is."
    b:
      en: "Traces record timing and request paths, not the prompt and response content that invocation logging captures."
    c:
      en: "Large data delivery stores oversized or binary bodies of logged calls; it doesn't make bedrock-mantle calls appear in the logs."
references:
  - title: "Monitor model invocation using CloudWatch Logs and Amazon S3 - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/model-invocation-logging.html
