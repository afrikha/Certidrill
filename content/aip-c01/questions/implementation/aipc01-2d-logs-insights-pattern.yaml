id: aipc01-2d-logs-insights-pattern
objective: "2.5.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A generative AI application writes every failed model call to Amazon CloudWatch Logs as a free-text message, such as throttling messages, validation errors, and notices about truncated answers. Each message includes request IDs, timestamps, and model IDs that vary from event to event. The on-call team wants to see which kinds of failures are the most frequent without writing a regular expression for each message format.

    Which solution will meet these requirements?
body:
  options:
    - { id: a, text: { en: "Run a CloudWatch Logs Insights query that uses parse with one regular expression per known message format, followed by stats count(*)." } }
    - { id: b, text: { en: "Run a CloudWatch Logs Insights query that filters the error messages, applies the pattern command, and sorts by @sampleCount." } }
    - { id: c, text: { en: "Enable AWS X-Ray tracing for the application, and look for faulted nodes in the trace map of the model calls." } }
    - { id: d, text: { en: "Create one CloudWatch metric filter for each known error string, and graph the metrics on a CloudWatch dashboard." } }
answer: { optionId: b }
explanation:
  correct:
    en: "The pattern command automatically clusters log events into patterns, replacing values that vary, such as request IDs and timestamps, with dynamic tokens. Each pattern comes with @sampleCount, @ratio, and @severityLabel, so sorting by @sampleCount shows the most frequent failure types without hand-written expressions."
  options:
    a:
      en: "Writing a regular expression for each message format is exactly the work the team wants to avoid, and unknown formats are missed."
    c:
      en: "Traces show where requests fail and how long they take, but they don't group free-text error messages by type."
    d:
      en: "Metric filters need every error string in advance, so new failure types go unnoticed."
references:
  - title: "pattern - Amazon CloudWatch Logs"
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/logs/CWL_QuerySyntax-Pattern.html
