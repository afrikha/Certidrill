id: aipc01-2b-ent-as2-partner-documents
objective: "2.3.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A wholesaler's trading partners send purchase-order documents over the AS2 protocol. The company wants the documents stored in Amazon S3, where an existing pipeline extracts order details with Amazon Bedrock. The partners must keep their AS2 setup, and the company does not want to run transfer servers.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Install an AWS DataSync agent at each partner site to copy the purchase-order documents to Amazon S3.
    - id: b
      text:
        en: |-
          Use AWS Transfer Family to receive the partners' AS2 messages and store the documents in Amazon S3.
    - id: c
      text:
        en: |-
          Use Amazon AppFlow to pull the purchase-order documents from each partner's AS2 server into Amazon S3.
    - id: d
      text:
        en: |-
          Run an AS2 server on Amazon EC2 instances that writes the purchase-order documents to Amazon S3.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      Transfer Family provides fully managed AS2, SFTP, FTPS and FTP endpoints that store files in Amazon S3 without any server infrastructure to run, and partners keep their existing client configurations.
  options:
    a:
      en: |-
        Agents at every partner site would change how partners work, and DataSync doesn't receive AS2 messages.
    c:
      en: |-
        AppFlow moves data from SaaS applications such as Salesforce or Zendesk; it doesn't receive AS2 transfers.
    d:
      en: |-
        An AS2 server on EC2 is a transfer server that the company must operate.
references:
  - title: "What is AWS Transfer Family? - AWS Transfer Family"
    url: https://docs.aws.amazon.com/transfer/latest/userguide/what-is-aws-transfer-family.html
