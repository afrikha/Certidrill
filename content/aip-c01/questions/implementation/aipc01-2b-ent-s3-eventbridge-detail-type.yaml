id: aipc01-2b-ent-s3-eventbridge-detail-type
objective: "2.3.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company enabled Amazon EventBridge on an Amazon S3 bucket of policy documents and created a rule whose event pattern matches only the source aws.s3 and the bucket name. The rule starts a workflow that summarizes each new document with Amazon Bedrock. The workflow now also starts when objects are deleted, restored or retagged, and those executions fail. The company wants the workflow to start only for new or overwritten documents.

    What should the company do?
body:
  options:
    - id: a
      text:
        en: |-
          Configure S3 Event Notifications on the bucket for s3:ObjectCreated:* events only, in addition to the EventBridge setting.
    - id: b
      text:
        en: |-
          Add a detail-type condition with the value Object Created to the rule's event pattern.
    - id: c
      text:
        en: |-
          Add a first step to the workflow that ends the execution when the object no longer exists in the bucket.
    - id: d
      text:
        en: |-
          Move the rule to a custom event bus so that only object creation events from the bucket are delivered to it.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      Once EventBridge is enabled for a bucket, S3 sends all of its event types to EventBridge; unlike other destinations, event types aren't selected. The rule's event pattern must therefore also match detail-type Object Created, which S3 emits when an object is created with PutObject, POST Object, CopyObject or CompleteMultipartUpload.
  options:
    a:
      en: |-
        Event types are selected for the other notification destinations; once EventBridge is enabled, S3 sends all event types to EventBridge, and the rule still matches them.
    c:
      en: |-
        Executions would still start for every event type, and retagged or restored objects still exist, so the check doesn't filter them.
    d:
      en: |-
        A custom bus doesn't filter S3 event types; the event pattern of the rule is what selects events.
references:
  - title: "Using EventBridge - Amazon Simple Storage Service"
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/EventBridge.html
  - title: "Amazon EventBridge event patterns - Amazon EventBridge"
    url: https://docs.aws.amazon.com/eventbridge/latest/userguide/eb-event-patterns.html
