id: aipc01-2c-res-adaptive-batch-worker
objective: "2.4.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A nightly job on Amazon ECS uses one SDK client to call a single model on Amazon Bedrock as fast as possible. The job is not latency sensitive, but it receives many `ThrottlingException` errors, and most retries are throttled again. The team wants the SDK to slow down the job's request rate automatically when throttling occurs, without writing rate-limiting code.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Set the SDK retry mode to `adaptive`, and raise the maximum number of attempts.
    - id: b
      text:
        en: |-
          Set the SDK retry mode to `legacy` so that the SDK applies its original retry behavior.
    - id: c
      text:
        en: |-
          Set the maximum number of attempts to 1 so that throttled requests fail fast.
    - id: d
      text:
        en: |-
          Write a loop that retries each throttled call immediately until it succeeds.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      Adaptive mode adds a client-side rate limiter to the standard retry behavior and can delay requests when it detects throttling. AWS recommends it for single-resource, throttling-heavy workloads that tolerate latency, like this job.
  options:
    b:
      en: |-
        Legacy mode exists only for backward compatibility and has no client-side rate limiting.
    c:
      en: |-
        A maximum of 1 attempt disables retries, so throttled calls simply fail.
    d:
      en: |-
        Immediate retries without backoff add load and make throttling worse.
references:
  - title: "Retry behavior - AWS SDKs and Tools"
    url: https://docs.aws.amazon.com/sdkref/latest/guide/feature-retry-behavior.html
