id: aipc01-2d-openapi-mock-first
objective: "2.5.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A software company is building a text-summarization API for its partners. The internal front-end team and two partner teams must start building their clients now, but the backend Lambda function that calls Amazon Bedrock won't be ready for six weeks. The company follows an API-first approach: the contract must be agreed on once, shared as a machine-readable definition, and reused for the production API without being rewritten.

    Which solution will meet these requirements?
body:
  options:
    - { id: a, text: { en: "Write an OpenAPI 3.0 definition, import it into an Amazon API Gateway REST API with mock integrations that return sample responses, and switch each method to the Lambda integration when the backend is ready." } }
    - { id: b, text: { en: "Build the Lambda function first, create an Amazon API Gateway REST API with a Lambda proxy integration, and export the OpenAPI definition from the deployed stage for the client teams." } }
    - { id: c, text: { en: "Describe the request and response formats on a shared wiki page, and ask each client team to build its own stub server until the backend Lambda function is ready." } }
    - { id: d, text: { en: "Create an Amazon Bedrock Flows flow with an input node and an output node now, and give the client teams the flow alias ARN to use as the API contract." } }
answer: { optionId: a }
explanation:
  correct:
    en: "API Gateway imports REST APIs from OpenAPI 2.0 or 3.0 definitions, so the agreed contract becomes the API itself. Mock integrations return responses directly from API Gateway without a backend, which lets client teams build and test against the real endpoints. When the Lambda function is ready, only the integrations change, not the contract."
  options:
    b:
      en: "This is a code-first approach: the contract exists only after the backend is built, so the client teams wait six weeks."
    c:
      en: "A wiki page isn't a machine-readable definition, it can't be imported into API Gateway, and separate stub servers let each team drift from the contract."
    d:
      en: "A flow alias isn't a REST API contract for partners, and calling InvokeFlow requires AWS credentials and the Bedrock runtime API rather than the agreed HTTP interface."
references:
  - title: "Develop REST APIs using OpenAPI in API Gateway - Amazon API Gateway"
    url: https://docs.aws.amazon.com/apigateway/latest/developerguide/api-gateway-import-api.html
  - title: "Mock integrations for REST APIs in API Gateway - Amazon API Gateway"
    url: https://docs.aws.amazon.com/apigateway/latest/developerguide/how-to-mock-integration.html
