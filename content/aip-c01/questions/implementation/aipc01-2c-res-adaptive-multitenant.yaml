id: aipc01-2c-res-adaptive-multitenant
objective: "2.4.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A GenAI gateway serves many tenants with one shared SDK client that calls several different models on Amazon Bedrock. After a developer set the retry mode to `adaptive`, a throttling spike on one model slowed down requests for all tenants, including tenants that use other models. The gateway must keep retrying transient errors with backoff but must not delay requests to models that are not throttled.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Keep the `adaptive` retry mode, and raise the maximum number of attempts so that delayed requests eventually succeed.
    - id: b
      text:
        en: |-
          Set the maximum number of attempts to 1 for the client so that no request waits for the rate limiter.
    - id: c
      text:
        en: |-
          Switch the client to the `standard` retry mode, which retries with backoff and a retry quota without delaying initial requests.
    - id: d
      text:
        en: |-
          Switch the client to the `legacy` retry mode so that throttling information is not shared between requests.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      Standard mode retries transient and throttling errors with exponential backoff and jitter and uses a retry quota, but it never delays a first attempt. The rate limiter of adaptive mode is shared by a client instance, so throttling on one resource slows every request of that client, which AWS advises against for multi-tenant or multi-resource clients.
  options:
    a:
      en: |-
        More attempts keep the shared rate limiter that delays every tenant.
    b:
      en: |-
        Disabling retries also stops the retries of transient errors that the gateway must keep.
    d:
      en: |-
        Legacy mode is not standardized across SDKs and is kept only for backward compatibility; AWS recommends moving to standard mode.
references:
  - title: "Retry behavior - AWS SDKs and Tools"
    url: https://docs.aws.amazon.com/sdkref/latest/guide/feature-retry-behavior.html
