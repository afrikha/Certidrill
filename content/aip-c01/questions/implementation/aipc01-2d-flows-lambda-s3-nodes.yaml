id: aipc01-2d-flows-lambda-s3-nodes
objective: "2.5.5"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company is building a prompt chain in Amazon Bedrock Flows. A first prompt node extracts the customer ID from an email. The chain must then get the customer's current account status from an internal REST API, pass it to a second prompt node that drafts the reply, and save each final reply as an object in Amazon S3 for auditing before the flow returns it. The company doesn't use Bedrock agents.

    Which two node types should the developer add to the flow? (Choose two.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "A Lambda function node that calls the internal API with the customer ID and returns the account status" } }
    - { id: b, text: { en: "A knowledge base node that looks up the customer's account status from the customer ID" } }
    - { id: c, text: { en: "An agent node that calls the internal API through an action group of a Bedrock agent" } }
    - { id: d, text: { en: "An S3 retrieval node that writes the final reply to the audit bucket with an object key" } }
    - { id: e, text: { en: "An S3 storage node that stores the final reply in the audit bucket under an object key" } }
answer: { optionIds: [ a, e ] }
explanation:
  correct:
    en: "A Lambda function node runs business logic, such as a call to an internal API, and returns its functionResponse to the next node, the reply prompt. An S3 storage node takes content and an object key and stores the data in an S3 bucket, returning the S3 URI."
  options:
    b:
      en: "A knowledge base node queries indexed documents; it can't return live data from an internal API."
    c:
      en: "An agent node sends the prompt to a Bedrock agent alias; the company doesn't use agents, and Bedrock Agents (now Agents Classic) is closed to new customers."
    d:
      en: "An S3 retrieval node reads an object from S3; it doesn't write the reply."
references:
  - title: "Node types for your flow - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/flows-nodes.html
