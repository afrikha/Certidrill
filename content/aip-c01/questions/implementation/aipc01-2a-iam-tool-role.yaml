id: aipc01-2a-iam-tool-role
objective: "2.1.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A retail company gives its support agent a Lambda tool that looks up orders in an Amazon DynamoDB table named Orders. The system prompt tells the model never to modify or delete orders. A security review requires that the tool be technically unable to change any data, even if the model is manipulated by a prompt injection.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Configure an Amazon Bedrock guardrail with a denied topic that blocks every request to modify or delete an order in the Orders table.
    - id: b
      text:
        en: |-
          Repeat the instruction never to modify or delete orders at the end of the user message of every request that is sent to the model.
    - id: c
      text:
        en: |-
          Turn on Amazon Bedrock model invocation logging and create an alarm on log entries that mention deleting orders.
    - id: d
      text:
        en: |-
          Give the Lambda function an execution role that allows only dynamodb:GetItem and dynamodb:Query on the Orders table ARN.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      The tool's permissions are the real boundary: a least-privilege execution role that allows only read actions on one table makes write and delete calls fail with an access error whatever the model requests. Prompts and filters reduce how often the model tries, but only IAM enforces the limit.
  options:
    a:
      en: |-
        A denied topic classifies text and can miss rephrased or injected requests; it does not remove the tool's ability to change data.
    b:
      en: |-
        Prompt instructions can be overridden by prompt injection and do not limit what the tool can do.
    c:
      en: |-
        Logging and alarms detect misuse after it happens; they do not prevent the change.
references:
  - title: Defining Lambda Event Function permissions with an execution role - AWS Lambda
    url: https://docs.aws.amazon.com/lambda/latest/dg/lambda-intro-execution-role.html
