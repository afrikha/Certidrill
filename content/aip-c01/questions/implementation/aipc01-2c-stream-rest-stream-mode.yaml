id: aipc01-2c-stream-rest-stream-mode
objective: "2.4.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A Regional API Gateway REST API uses a Lambda proxy integration to answer research questions with a model on Amazon Bedrock. Answers take 40 to 90 seconds, so requests fail at the 29-second integration timeout. The Lambda function already streams its response. The company wants server-sent events to reach the browser as tokens arrive, with the LEAST change to the architecture.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Request an integration timeout increase to 120 seconds, and keep the default response transfer mode of the integration.
    - id: b
      text:
        en: |-
          Enable API caching on the stage so that answers to repeated questions are returned within the timeout.
    - id: c
      text:
        en: |-
          Switch to a non-proxy integration, and add a VTL mapping template that splits the integration response into chunks.
    - id: d
      text:
        en: |-
          Set the response transfer mode of the integration to `STREAM` so that API Gateway forwards the function output as it is produced.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      In `STREAM` mode, API Gateway sends the response of an `HTTP_PROXY` or `AWS_PROXY` integration as it is produced, which lowers the time to first byte. Streamed responses are not limited by the 29-second integration timeout and can last up to 15 minutes.
  options:
    a:
      en: |-
        A longer timeout removes the error, but in the default `BUFFERED` mode the user still waits for the complete answer.
    b:
      en: |-
        Caching is not supported with response streaming, and it does not help with new questions.
    c:
      en: |-
        VTL response transformation is not supported with streaming, and a mapping template cannot create incremental delivery.
references:
  - title: "Stream the integration response for your proxy integrations in API Gateway - Amazon API Gateway"
    url: https://docs.aws.amazon.com/apigateway/latest/developerguide/response-transfer-mode.html
  - title: "Quotas for configuring and running a REST API in API Gateway - Amazon API Gateway"
    url: https://docs.aws.amazon.com/apigateway/latest/developerguide/api-gateway-execution-service-limits-table.html
