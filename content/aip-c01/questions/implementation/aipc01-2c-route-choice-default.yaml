id: aipc01-2c-route-choice-default
objective: "2.4.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A Step Functions workflow classifies each customer message, and a `Choice` state routes the `billing`, `technical`, and `contract` categories to tasks that call specialized models on Amazon Bedrock. Since the classifier started to return a new `warranty` category, executions for those messages fail at the `Choice` state. The company wants messages of any unexpected category to be answered by a general-purpose model.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Add `"End": true` to the `Choice` state so that executions finish successfully when no rule matches.
    - id: b
      text:
        en: |-
          Add a `Default` field to the `Choice` state that transitions to a task that calls the general-purpose model.
    - id: c
      text:
        en: |-
          Add a `Catch` for `States.ALL` to the classification task that transitions to the general-purpose model task.
    - id: d
      text:
        en: |-
          Change each rule from `StringEquals` to `StringMatches`, and add a trailing `*` wildcard to each category value.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      When no rule of a `Choice` state matches and the state has no `Default`, the execution fails because it cannot transition out of the state. A `Default` branch sends every unmatched category to the general-purpose model.
  options:
    a:
      en: |-
        `Choice` states do not support the `End` field; they transition only through their rules or their `Default`.
    c:
      en: |-
        The classification task succeeds and the failure happens in the `Choice` state, so a catcher on the classifier never runs.
    d:
      en: |-
        Wildcards on the existing category values still do not match `warranty`, so no rule matches.
references:
  - title: "Choice workflow state - AWS Step Functions"
    url: https://docs.aws.amazon.com/step-functions/latest/dg/state-choice.html
