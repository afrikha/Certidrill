id: aipc01-2c-route-choice-numeric
objective: "2.4.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A workflow sends long contracts to a long-context model and other documents to a cheaper model. A Lambda task counts the input tokens with the Amazon Bedrock `CountTokens` API and returns `{"inputTokens": 142000}`, with the count as a number. The `Choice` rule `{"Variable": "$.inputTokens", "StringGreaterThan": "100000", "Next": "LongContextModel"}` never matches, so long contracts go to the default model and fail. The company must route every document above 100,000 tokens to the long-context model.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Change the Lambda task to return the count inside a nested object, and keep the `StringGreaterThan` rule unchanged.
    - id: b
      text:
        en: |-
          Replace the rule with a `StringMatches` rule and the pattern `1*` so that counts that start with 1 match.
    - id: c
      text:
        en: |-
          Replace the rule with a `NumericGreaterThan` rule on `$.inputTokens` with the numeric value 100000.
    - id: d
      text:
        en: |-
          Replace the `Choice` state with a `Parallel` state that sends each document to both of the models.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      The token count is a number, and Step Functions does not match a numeric field against a string comparison, so the string rule never matches. A `NumericGreaterThan` rule with a numeric value compares the count correctly.
  options:
    a:
      en: |-
        Nesting the value does not change its type, so the string comparison still never matches.
    b:
      en: |-
        A string pattern does not match a numeric field either, and a leading digit does not express a threshold.
    d:
      en: |-
        A `Parallel` state runs both branches for every document, which doubles the cost, and the cheaper model still fails on long contracts.
references:
  - title: "Choice workflow state - AWS Step Functions"
    url: https://docs.aws.amazon.com/step-functions/latest/dg/state-choice.html
  - title: "Monitor your token usage by counting tokens before running inference - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/count-tokens.html
