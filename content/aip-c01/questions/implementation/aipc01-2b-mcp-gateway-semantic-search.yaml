id: aipc01-2b-mcp-gateway-semantic-search
objective: "2.1.7"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A retail company created an Amazon Bedrock AgentCore gateway last year without semantic search. The gateway now aggregates about 1,200 tools from many targets. Agents list all tools when they start, their prompts have become very large, and they often choose the wrong tool. The company wants agents to call the built-in x_amz_bedrock_agentcore_search tool to find the tools that are relevant to a natural language query.

    What should the company do?
body:
  options:
    - id: a
      text:
        en: |-
          Call UpdateGateway on the existing gateway to enable semantic search, and then synchronize all targets.
    - id: b
      text:
        en: |-
          Create a new gateway with semantic search enabled, add the same targets to it, and point the agents to the new gateway endpoint.
    - id: c
      text:
        en: |-
          Change the listing mode of every MCP server target to DYNAMIC so that tools are discovered only when an agent invokes them.
    - id: d
      text:
        en: |-
          Add a Lambda target that stores the tool descriptions in Amazon DynamoDB and returns the tools whose descriptions contain the query keywords.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      Semantic search can be enabled only when a gateway is created; an existing gateway's configuration can't be changed to add it. A new gateway with semantic search and the same targets offers the x_amz_bedrock_agentcore_search tool, which returns only the tools relevant to a query, so agents keep their prompts small with thousands of tools.
  options:
    a:
      en: |-
        UpdateGateway can't turn on semantic search for a gateway that was created without it.
    c:
      en: |-
        DYNAMIC listing mode changes when MCP server capabilities are discovered, and it isn't interoperable with semantic search.
    d:
      en: |-
        A custom keyword search is extra code to build and maintain, and it isn't the built-in semantic search tool that the company wants the agents to use.
references:
  - title: "Create an Amazon Bedrock AgentCore gateway - Amazon Bedrock AgentCore"
    url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/gateway-create.html
  - title: "Search for tools in your AgentCore gateway with a natural language query - Amazon Bedrock AgentCore"
    url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/gateway-using-mcp-semantic-search.html
