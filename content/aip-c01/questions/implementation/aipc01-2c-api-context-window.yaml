id: aipc01-2c-api-context-window
objective: "2.5.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A customer service assistant sends the full conversation history with every `Converse` call. In long conversations, responses come back with a `stopReason` of `model_context_window_exceeded`. The company wants long conversations to keep working with the same model, and it wants to check the size of each request before sending it, without paying for that check.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Increase `maxTokens` in `inferenceConfig` so that the model has enough room to finish each answer.
    - id: b
      text:
        en: |-
          Retry each failed request with exponential backoff and jitter, because the error is transient.
    - id: c
      text:
        en: |-
          Switch to `ConverseStream` so that the history is sent to the model in smaller chunks.
    - id: d
      text:
        en: |-
          Call `CountTokens` before each request, and summarize the oldest turns when the history exceeds a budget.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      The input is too large for the model's context window. `CountTokens` returns the number of input tokens that a `Converse` request would use and is free of charge, so the application can compact the history before it calls the model.
  options:
    a:
      en: |-
        `maxTokens` limits the output; it does not shrink the input that overflows the context window.
    b:
      en: |-
        The same input fails again; the error is caused by the request size.
    c:
      en: |-
        Streaming changes how the response is returned, not the size of the input.
references:
  - title: "Monitor your token usage by counting tokens before running inference - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/count-tokens.html
  - title: "Converse - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/APIReference/API_runtime_Converse.html
