id: aipc01-2a-react-continue-new-execution
objective: "2.1.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A pharmaceutical company runs a literature-review agent as a ReAct loop in an AWS Step Functions Standard workflow. Each iteration depends on the observation of the previous one and adds about 10 events to the execution history. The conversation history is already stored in Amazon S3, and the state passes only its S3 URI. Some reviews need more than 3,000 iterations over several days, and those executions fail when the history reaches 25,000 events. The reviews must run to completion, and the company wants to keep the Standard workflow.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          At an iteration threshold, start a new execution of the same state machine with the S3 URI and the counter as input, and end the current execution.
    - id: b
      text:
        en: |-
          Replace the loop with a Map state in Distributed mode that runs each iteration of the review as a separate child workflow execution.
    - id: c
      text:
        en: |-
          Convert the state machine to an Express workflow, and keep the same loop, the same states, and the S3 reference to the conversation history.
    - id: d
      text:
        en: |-
          Set the TimeoutSeconds field of the state machine to one year so that the long reviews are not stopped before they complete.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      A Standard execution fails when its history reaches 25,000 events. Handing the state over to a new execution before that point, with the history kept in S3 and passed by reference, lets the loop continue for as many iterations as needed while keeping each execution under the quota.
  options:
    b:
      en: |-
        Map iterations run independently and in parallel, but each ReAct iteration needs the observation of the previous one, so the iterations cannot be split into independent items.
    c:
      en: |-
        Express workflows have no history event limit, but they stop after 5 minutes, so a review that runs for several days cannot complete.
    d:
      en: |-
        The failure is caused by the 25,000-event history quota, not by the duration; a longer timeout does not change the event limit.
references:
  - title: Step Functions service quotas - AWS Step Functions
    url: https://docs.aws.amazon.com/step-functions/latest/dg/service-quotas.html
