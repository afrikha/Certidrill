id: aipc01-2c-api-regional-timeout
objective: "2.5.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An internal Regional API Gateway REST API is called by back-office batch scripts that send a few requests per minute and can parse only one complete JSON response. A Lambda integration calls a model on Amazon Bedrock, and some responses take 35 to 45 seconds, so they fail at the integration timeout. The account's API Gateway throttle quota is far above the current traffic. The company wants the simplest change.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Raise the integration timeout of the Regional API above 29 seconds, accepting a possibly lower account throttle quota.
    - id: b
      text:
        en: |-
          Change the response transfer mode of the integration to `STREAM` so that the scripts receive the response in chunks.
    - id: c
      text:
        en: |-
          Change the API to an edge-optimized endpoint so that CloudFront keeps the connection open longer.
    - id: d
      text:
        en: |-
          Move the integration to an API Gateway WebSocket API, and raise its integration timeout to 60 seconds.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      For Regional and private REST APIs, the integration timeout can be raised above 29 seconds, which might require lowering the Region-level throttle quota of the account. With little traffic, that trade-off is acceptable, and the scripts keep receiving one complete JSON response.
  options:
    b:
      en: |-
        The scripts can parse only a complete response, so streaming would require changing them.
    c:
      en: |-
        The integration timeout of edge-optimized APIs cannot be raised above 29 seconds.
    d:
      en: |-
        The WebSocket integration timeout is not adjustable, and the scripts would have to be rewritten for WebSockets.
references:
  - title: "Quotas for configuring and running a REST API in API Gateway - Amazon API Gateway"
    url: https://docs.aws.amazon.com/apigateway/latest/developerguide/api-gateway-execution-service-limits-table.html
  - title: "Quotas for configuring and running a WebSocket in API Gateway - Amazon API Gateway"
    url: https://docs.aws.amazon.com/apigateway/latest/developerguide/apigateway-execution-service-websocket-limits-table.html
