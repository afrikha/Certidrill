id: aipc01-2b-sec-guardrail-numeric-versions
objective: "2.3.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company's IAM policy for its application roles must allow Amazon Bedrock InvokeModel requests only when they use a published, numbered version of one approved guardrail. Teams publish new guardrail versions regularly and must not need a policy change for each version. Requests that use the guardrail's working DRAFT version must be denied.

    Which condition on bedrock:GuardrailIdentifier should the policy use?
body:
  options:
    - id: a
      text:
        en: |-
          ArnLike with the guardrail ARN followed by :* (arn:aws:bedrock:us-east-1:111122223333:guardrail/gr-id:*).
    - id: b
      text:
        en: |-
          StringEquals with the guardrail ARN without any suffix (arn:aws:bedrock:us-east-1:111122223333:guardrail/gr-id).
    - id: c
      text:
        en: |-
          ArnLike with the guardrail ARN followed directly by * (arn:aws:bedrock:us-east-1:111122223333:guardrail/gr-id*).
    - id: d
      text:
        en: |-
          StringEquals with the guardrail ARN followed by :1 (arn:aws:bedrock:us-east-1:111122223333:guardrail/gr-id:1).
answer: { optionId: a }
explanation:
  correct:
    en: |-
      In bedrock:GuardrailIdentifier conditions, the guardrail ARN without a suffix refers to the DRAFT version and the ARN with :number refers to one version. ArnLike with :* matches any numeric version, while ArnLike with an asterisk directly after the ID also matches DRAFT. ArnLike with :* therefore allows every published version and excludes DRAFT without policy changes.
  options:
    b:
      en: |-
        The guardrail ARN without a version suffix identifies the DRAFT version, the only one that must be denied.
    c:
      en: |-
        An asterisk directly after the guardrail ID matches any version, including DRAFT.
    d:
      en: |-
        This allows only version 1, so the policy would need a change for every new version.
references:
  - title: "Enforce the use of specific guardrails in model inference requests - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/guardrails-permissions-id.html
