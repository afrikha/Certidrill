id: aipc01-2a-sampling-audit-review
objective: "2.1.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An e-commerce company's AI assistant has answered product questions automatically for six months with good results. A new compliance policy requires that humans review 5 % of the automated answers so that quality problems are detected over time. The review must not delay any answer to customers.

    Which human augmentation pattern will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Require a human reviewer to approve every answer before the answer is shown to the customer.
    - id: b
      text:
        en: |-
          Send answers with a low confidence score to a human for approval before they are shown to the customer.
    - id: c
      text:
        en: |-
          Have a human reviewer edit and correct every answer before the answer is shown to the customer.
    - id: d
      text:
        en: |-
          Select 5 % of the answers at random after delivery, and send them to a queue for human audit.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      A sampling audit reviews a percentage of automated outputs after the fact. It meets the 5 % review requirement and detects quality drift without adding any delay to customer answers.
  options:
    a:
      en: |-
        Approving every answer before delivery delays all customers and reviews far more than 5 % of the answers.
    b:
      en: |-
        Confidence-based approval holds some answers until a human decides, which delays those customers.
    c:
      en: |-
        Editing every answer delays all customers and reviews far more than the required 5 %.
references:
  - title: Discover service integration patterns in Step Functions - AWS Step Functions
    url: https://docs.aws.amazon.com/step-functions/latest/dg/connect-to-resource.html
