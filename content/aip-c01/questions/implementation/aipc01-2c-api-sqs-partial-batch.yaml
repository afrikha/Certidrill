id: aipc01-2c-api-sqs-partial-batch
objective: "2.4.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A Lambda function receives batches of 10 messages from an Amazon SQS queue and calls Amazon Bedrock once for each message. When one call in a batch is throttled, the function raises an error, and all 10 messages return to the queue, so the 9 successful generations run again and are billed twice. The company wants only the failed messages to be retried.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Increase the batch size to 100 so that a single failure affects a smaller share of the messages in each batch.
    - id: b
      text:
        en: |-
          Configure a dead-letter queue with a `maxReceiveCount` of 1 so that a failed batch is never processed a second time.
    - id: c
      text:
        en: |-
          Reduce the visibility timeout of the queue so that the messages of a failed batch return to the queue sooner.
    - id: d
      text:
        en: |-
          Implement partial batch responses, and return only the IDs of the failed messages as batch item failures.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      By default, when an invocation fails, every message in the batch becomes visible again after the visibility timeout. Partial batch response logic reports only the failed items, so the successfully processed messages are deleted and are not generated again.
  options:
    a:
      en: |-
        A larger batch still returns every message to the queue when the invocation fails.
    b:
      en: |-
        A count of 1 moves the whole batch, including the throttled message, to the dead-letter queue after one failure; AWS recommends at least 5.
    c:
      en: |-
        A shorter visibility timeout returns the whole batch sooner; it does not reduce duplicate processing.
references:
  - title: "Using Lambda with Amazon SQS - AWS Lambda"
    url: https://docs.aws.amazon.com/lambda/latest/dg/with-sqs.html
  - title: "Creating and configuring an Amazon SQS event source mapping - AWS Lambda"
    url: https://docs.aws.amazon.com/lambda/latest/dg/services-sqs-configure.html
