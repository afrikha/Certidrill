id: aipc01-2a-react-standard-audit
objective: "2.1.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    An insurance company is building a claims-investigation agent that follows a ReAct pattern: a foundation model on Amazon Bedrock reasons about the next step, requests one of several tools, reads the result, and repeats. Regulators require that every reasoning step and every tool call of each run be visible in an execution history, and that the maximum number of iterations be enforced by deterministic logic outside the model. Some tools wait for external systems, so a single run can take up to 2 hours.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Implement the loop in an AWS Step Functions Express workflow with a model invocation state, a Choice state that checks the stop reason and an iteration counter, and a Lambda state that runs the requested tool.
    - id: b
      text:
        en: |-
          Implement the loop in an AWS Step Functions Standard workflow with a model invocation state, a Choice state that checks the stop reason and an iteration counter, and a Lambda state that runs the requested tool.
    - id: c
      text:
        en: |-
          Implement the loop in one AWS Lambda function that keeps an iteration counter, calls the Converse API and the tools in turn, and writes each step to Amazon CloudWatch Logs.
    - id: d
      text:
        en: |-
          Send one Converse request with a chain-of-thought prompt that asks the model to list every tool it needs in order, and then run the listed tools in sequence.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      A Standard workflow records each state transition in its execution history and can run for up to one year, so a 2-hour investigation fits. The Choice state compares the iteration counter with a fixed limit, which enforces the stopping rule outside the model, and each Reason and Act step appears as its own state.
  options:
    a:
      en: |-
        Express workflows can run for at most 5 minutes, so a 2-hour investigation would fail with States.Timeout.
    c:
      en: |-
        A Lambda function can run for at most 1,800 seconds (30 minutes), which is shorter than a 2-hour run, and custom log lines are not an execution history of states.
    d:
      en: |-
        Planning all tool calls up front is not ReAct: the model never sees the observations before choosing the next step, so it cannot adapt to tool results.
references:
  - title: Step Functions service quotas - AWS Step Functions
    url: https://docs.aws.amazon.com/step-functions/latest/dg/service-quotas.html
  - title: Lambda quotas - AWS Lambda
    url: https://docs.aws.amazon.com/lambda/latest/dg/gettingstarted-limits.html
