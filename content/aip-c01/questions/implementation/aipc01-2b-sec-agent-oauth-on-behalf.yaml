id: aipc01-2b-sec-agent-oauth-on-behalf
objective: "2.3.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company is building an agent with Amazon Bedrock AgentCore that creates events in each employee's calendar in a third-party SaaS through the vendor's OAuth 2.0 API. Each employee must consent once, the agent must act on behalf of the employee who makes the request, and no client secrets or tokens may be stored in the agent's code or configuration.

    Which two steps should the company take? (Choose two.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Configure an OAuth credential provider for the SaaS vendor in AgentCore Identity.
    - id: b
      text:
        en: |-
          Use the client credentials (two-legged) grant with one service account that has write access to every employee's calendar.
    - id: c
      text:
        en: |-
          Store the OAuth client secret in an environment variable of the agent runtime, and rotate it every month.
    - id: d
      text:
        en: |-
          Use the authorization code (three-legged) grant so that each employee consents and the agent receives tokens for that employee.
    - id: e
      text:
        en: |-
          Configure IAM outbound authorization so that every request to the SaaS calendar API is signed with AWS Signature Version 4.
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: |-
      AgentCore Identity manages credential providers so that agents and tools can access third-party services on behalf of users. OAuth providers configured there support the authorization code (three-legged) grant, in which each user consents and the agent obtains that user's tokens, so no secret or token lives in the agent's code.
  options:
    b:
      en: |-
        A two-legged grant authenticates the application itself, not the employee, so the agent wouldn't act on behalf of each user.
    c:
      en: |-
        This places a secret in the agent's configuration, which is forbidden.
    e:
      en: |-
        IAM outbound authorization works only with targets that verify SigV4 natively, such as AWS services; a third-party SaaS API doesn't.
references:
  - title: "Provide identity and credential management for agent applications with Amazon Bedrock AgentCore Identity - Amazon Bedrock AgentCore"
    url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/identity.html
  - title: "MCP servers targets - Amazon Bedrock AgentCore"
    url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/gateway-target-MCPservers.html
