id: aipc01-2a-a2a-cross-framework
objective: "2.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A bank has two agent teams. The fraud team runs a fraud-analysis agent built with LangGraph. The customer service team is building a Strands orchestrator agent that must delegate suspected fraud cases to the fraud-analysis agent and receive its findings. Each team must keep deploying and scaling its own agent independently, and the fraud team does not want to rewrite its agent in another framework. Calls between the agents must be authenticated.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Rewrite the fraud-analysis logic as a Python tool function inside the Strands orchestrator, and deploy the orchestrator on AgentCore Runtime.
    - id: b
      text:
        en: |-
          Deploy the fraud-analysis agent as an A2A server on AgentCore Runtime, and have the orchestrator call it over the A2A protocol with SigV4 or OAuth.
    - id: c
      text:
        en: |-
          Add the fraud-analysis agent and the orchestrator to one Strands swarm so that the orchestrator can hand off fraud cases through shared context.
    - id: d
      text:
        en: |-
          Configure both agents to use the same AgentCore Memory resource, and have the fraud-analysis agent poll the orchestrator's events for new cases.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      The Agent-to-Agent (A2A) protocol connects agents that run as separate services, independently of the framework each one uses. AgentCore Runtime can host A2A servers, publishes their Agent Cards for discovery, and supports SigV4 and OAuth 2.0 authentication, so each team keeps its own deployment.
  options:
    a:
      en: |-
        Rewriting the fraud agent removes the fraud team's independent deployment and requires the rewrite the team wants to avoid.
    c:
      en: |-
        A swarm coordinates agents inside one Strands application; it does not let a separately deployed LangGraph agent keep its own deployment and scaling.
    d:
      en: |-
        Shared memory lets agents share context, but polling events is not a delegation and response mechanism, and it adds custom code and latency.
references:
  - title: Deploy A2A servers in AgentCore Runtime - Amazon Bedrock AgentCore
    url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/runtime-a2a.html
