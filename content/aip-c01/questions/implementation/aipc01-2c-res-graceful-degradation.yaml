id: aipc01-2c-res-graceful-degradation
objective: "2.4.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A retail company's product question assistant calls a model on Amazon Bedrock, with a second model as a fallback. During a provider incident, both models were unavailable for 30 minutes, and every question ended on an error page. The company wants the assistant to keep giving users something useful when no model is available, and to answer the pending questions later.

    Which combination of steps will meet these requirements? (Choose two.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Retry every failed request in a tight loop until one of the models becomes available again.
    - id: b
      text:
        en: |-
          Return a cached answer for frequent questions, or the retrieved product documents without a generated summary.
    - id: c
      text:
        en: |-
          Turn off the guardrail during incidents so that each request goes through fewer checks before the model.
    - id: d
      text:
        en: |-
          Accept the pending questions in a queue, and notify each user when the answer to the question is ready.
    - id: e
      text:
        en: |-
          Retry `ValidationException` errors with exponential backoff before the application shows the error page.
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |-
      Graceful degradation returns the best result that is still possible: a cached answer or the retrieved documents keep users informed while no model can generate. Accepting questions asynchronously lets the system answer them as soon as a model is available again, instead of failing them.
  options:
    a:
      en: |-
        Tight retries add load during an outage, return nothing useful in the meantime, and AWS recommends bounded retries with backoff.
    c:
      en: |-
        Removing safety controls does not make an unavailable model available, and it weakens the protection of the assistant.
    e:
      en: |-
        A validation error means that the request is invalid; retrying never fixes it, and this incident is an availability problem.
references:
  - title: "Circuit breaker pattern - AWS Prescriptive Guidance"
    url: https://docs.aws.amazon.com/prescriptive-guidance/latest/cloud-design-patterns/circuit-breaker.html
  - title: "Troubleshooting Amazon Bedrock API Error Codes - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/troubleshooting-api-error-codes.html
