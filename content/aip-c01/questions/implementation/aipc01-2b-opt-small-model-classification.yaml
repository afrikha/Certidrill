id: aipc01-2b-opt-small-model-classification
objective: "2.2.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company uses a large, high-cost foundation model on Amazon Bedrock for every step of its support workflow: classifying each incoming ticket into 1 of 12 categories and drafting replies to complex tickets. Ticket volume is high. An evaluation shows that a much smaller text model classifies tickets as accurately as the large model.

    Which change will reduce cost and latency while keeping quality?
body:
  options:
    - id: a
      text:
        en: |-
          Purchase Provisioned Throughput for the large model and keep using it for both tasks.
    - id: b
      text:
        en: |-
          Increase the maximum output tokens of the classification requests so that the large model explains its choice.
    - id: c
      text:
        en: |-
          Set the service_tier field to priority for the classification requests.
    - id: d
      text:
        en: |-
          Use the smaller model for ticket classification and keep the large model for drafting replies.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      Narrow, high-volume tasks such as classification often don't need a large model. Sending them to the smallest model that passes the evaluation lowers token cost and latency, while the large model stays on the drafting task that needs its reasoning.
  options:
    a:
      en: |-
        Provisioned Throughput buys capacity but keeps the large model on a task that a small model handles.
    b:
      en: |-
        More output tokens increase both cost and latency.
    c:
      en: |-
        The Priority tier costs a premium over standard on-demand pricing; it doesn't reduce cost.
references:
  - title: "Evaluate the performance of Amazon Bedrock resources - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/evaluation.html
