id: aipc01-2b-app-api-destination-slow-model
objective: "2.3.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company configured an Amazon EventBridge rule whose target is an API destination for an internal HTTPS service. The service generates a product description with a self-hosted LLM and returns it in the HTTP response, which takes about 20 seconds. The team sees the service generate several descriptions for the same event, and EventBridge reports failed invocations.

    What should the company do to fix the issue?
body:
  options:
    - id: a
      text:
        en: |-
          Increase the invocation rate limit of the API destination so that EventBridge accepts more concurrent requests.
    - id: b
      text:
        en: |-
          Change the connection's authorization type to API key so that EventBridge stops retrying the timed-out requests.
    - id: c
      text:
        en: |-
          Route the events to an Amazon SQS queue, and have a worker call the service and store each description.
    - id: d
      text:
        en: |-
          Increase the target's maximum number of retry attempts so that EventBridge waits longer for each response.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      EventBridge requires API destination endpoints to respond within 5 seconds; it times out slower requests and retries them, so a 20-second generation is started again and again. A queue and a worker decouple the event from the slow model call, and the worker isn't bound by that timeout.
  options:
    a:
      en: |-
        The invocation rate controls how many requests per second EventBridge sends; it doesn't change the 5-second timeout.
    b:
      en: |-
        The authorization type doesn't affect timeouts; timed-out requests are retried regardless.
    d:
      en: |-
        More retry attempts produce even more duplicate generations; each attempt still times out after 5 seconds.
references:
  - title: "API destinations as targets in Amazon EventBridge - Amazon EventBridge"
    url: https://docs.aws.amazon.com/eventbridge/latest/userguide/eb-api-destinations.html
