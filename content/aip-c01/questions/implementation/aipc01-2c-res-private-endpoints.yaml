id: aipc01-2c-res-private-endpoints
objective: "2.3.4"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    An insurance company runs a claims assistant on Lambda functions in private subnets that have no route to the internet. The functions call the Amazon Bedrock `Converse` API and the `Retrieve` API of a Bedrock knowledge base. Regulations require this traffic to stay on private connectivity, and the developers do not want to change the SDK endpoint configuration in the code.

    Which combination of steps will meet these requirements? (Choose two.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Create a gateway VPC endpoint for Amazon Bedrock, and add it to the route tables of the private subnets.
    - id: b
      text:
        en: |-
          Create an interface VPC endpoint for the `bedrock-runtime` service with private DNS enabled.
    - id: c
      text:
        en: |-
          Create an interface VPC endpoint for the `bedrock` service with private DNS enabled.
    - id: d
      text:
        en: |-
          Add a NAT gateway in a public subnet, and route the outbound traffic of the private subnets through it.
    - id: e
      text:
        en: |-
          Create an interface VPC endpoint for the `bedrock-agent-runtime` service with private DNS enabled.
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: |-
      `Converse` is served by the `bedrock-runtime` endpoint and knowledge base retrieval by `bedrock-agent-runtime`. Interface endpoints (AWS PrivateLink) keep the traffic private, and with private DNS enabled the SDK's default Regional DNS names resolve to the endpoints, so no code change is needed.
  options:
    a:
      en: |-
        Gateway endpoints exist only for Amazon S3 and DynamoDB; Amazon Bedrock is reached through interface endpoints.
    c:
      en: |-
        The `bedrock` endpoint serves the control plane API, not `Converse` calls or knowledge base retrieval.
    d:
      en: |-
        A NAT gateway sends the traffic to the public service endpoints, which does not meet the private connectivity requirement.
references:
  - title: "Use interface VPC endpoints (AWS PrivateLink) to create a private connection between your VPC and Amazon Bedrock - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/vpc-interface-endpoints.html
