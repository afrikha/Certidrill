id: aipc01-2a-specialized-models-claims
objective: "2.1.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An insurance company is designing a claims assistant on Amazon Bedrock. For each claim, the assistant must describe the damage shown in photos uploaded by the customer, find the relevant clauses in a large library of policy documents by meaning rather than by keyword, and draft a letter to the customer. The company wants each task to be handled by a model type that is suited to it.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Use one text embeddings model for all three tasks so that every output is stored in the same vector space.
    - id: b
      text:
        en: |-
          Use an image generation model to create descriptions of the photos and the same model to draft the letters.
    - id: c
      text:
        en: |-
          Use one text-only generation model for all three tasks, and include the file names of the uploaded photos in the prompt of each request.
    - id: d
      text:
        en: |-
          Use a multimodal model for the photos, a text embeddings model for the policy search, and a text generation model for the letter.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      Coordinating specialized models assigns each subtask to the model type built for it: a multimodal model understands images, an embeddings model turns documents and queries into vectors for semantic search, and a text generation model writes the letter.
  options:
    a:
      en: |-
        An embeddings model returns vectors; it cannot describe photos in words or draft a letter.
    b:
      en: |-
        An image generation model creates images from prompts; it is not designed to analyze photos or write letters.
    c:
      en: |-
        A text-only model cannot see the photos, so file names give it nothing to describe, and it does not provide semantic search over the policy library.
references:
  - title: Models at a glance - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/model-cards.html
