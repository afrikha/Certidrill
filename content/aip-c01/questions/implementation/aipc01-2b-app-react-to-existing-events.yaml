id: aipc01-2b-app-react-to-existing-events
objective: "2.3.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company's existing document application stores each uploaded contract in an Amazon S3 bucket and writes a record to an Amazon DynamoDB table. The company wants a summary of each new contract generated with Amazon Bedrock within one minute of upload. The application code must not be changed, and the solution must not poll the bucket or the table.

    Which two solutions will meet these requirements? (Choose two.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Turn on Amazon EventBridge for the bucket, and start a Step Functions workflow that calls Amazon Bedrock on Object Created events.
    - id: b
      text:
        en: |-
          Add a call to Amazon Bedrock in the application's upload handler, right after the contract object is written to the bucket.
    - id: c
      text:
        en: |-
          Schedule an AWS Lambda function every minute that lists the bucket and summarizes the objects created since its last run.
    - id: d
      text:
        en: |-
          Enable DynamoDB Streams on the table, and process each new record with an AWS Lambda function that summarizes the contract.
    - id: e
      text:
        en: |-
          Enable S3 Inventory reports on the bucket, and summarize the new objects that each inventory report lists.
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: |-
      Both designs react to events that the application already produces. Once EventBridge is enabled on the bucket, S3 sends Object Created events to EventBridge, where a rule can start a workflow. DynamoDB Streams captures each new item and invokes a Lambda function. Neither changes the application or polls for new contracts.
  options:
    b:
      en: |-
        This changes the application code.
    c:
      en: |-
        Listing the bucket every minute is polling.
    e:
      en: |-
        Inventory reports are produced on a daily or weekly schedule, far beyond one minute.
references:
  - title: "Using EventBridge - Amazon Simple Storage Service"
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/EventBridge.html
  - title: "DynamoDB Streams and AWS Lambda triggers - Amazon DynamoDB"
    url: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/Streams.Lambda.html
