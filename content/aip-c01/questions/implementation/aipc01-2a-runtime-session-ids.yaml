id: aipc01-2a-runtime-session-ids
objective: "2.1.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A retail company hosts a shopping assistant agent on Amazon Bedrock AgentCore Runtime. The web backend calls InvokeAgentRuntime with one hardcoded runtimeSessionId value for all requests. During testing, a user sees product suggestions that are based on files another user uploaded a few minutes earlier. Each user must keep the context of their own conversation across turns, and no user must be able to reach another user's in-memory data or files.

    Which combination of changes will meet these requirements? (Choose two.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Generate a unique runtimeSessionId of at least 33 characters for each user conversation when the conversation starts.
    - id: b
      text:
        en: |-
          Call StopRuntimeSession after every response so that each request from any user starts on a fresh microVM.
    - id: c
      text:
        en: |-
          Pass the same runtimeSessionId of the conversation on every later turn of that conversation.
    - id: d
      text:
        en: |-
          Keep the shared runtimeSessionId and configure a NullConversationManager on the agent so that no message history is kept between requests.
    - id: e
      text:
        en: |-
          Deploy a separate agent runtime for each product category, and route each request to the runtime of the category that the question is about.
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |-
      AgentCore Runtime gives each session its own microVM with isolated compute, memory, and file system, so a distinct session ID per user conversation isolates users. Reusing that ID for the later turns routes them to the same session, which keeps the conversation context. The documentation asks for a unique ID of at least 33 characters per user or conversation.
  options:
    b:
      en: |-
        Stopping the session after every response isolates users but destroys each user's own context between turns, which breaks the first requirement.
    d:
      en: |-
        All users would still share one microVM and its file system, so uploaded files would remain visible across users; it also removes the context users need.
    e:
      en: |-
        Users who ask about the same category would still share one runtime and the same hardcoded session, so their files and context would remain visible to each other.
references:
  - title: Use isolated sessions for agents - Amazon Bedrock AgentCore
    url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/runtime-sessions.html
