id: aipc01-2b-mcp-ecs-production-hardening
objective: "2.1.7"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company runs an MCP server that provides complex document-analysis tools as an Amazon ECS service on AWS Fargate. Agents of partner companies connect to it over the internet. The company wants the server to stay available if an Availability Zone fails, wants the tasks to be unreachable directly from the internet, and wants protection against request floods.

    Which two actions should the company take? (Choose two.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Assign public IP addresses to the tasks and publish their addresses in Amazon Route 53 with a multivalue answer record.
    - id: b
      text:
        en: |-
          Replace the tasks with one larger task that has more vCPUs and memory to absorb request floods.
    - id: c
      text:
        en: |-
          Run the service's tasks across multiple Availability Zones behind an Application Load Balancer.
    - id: d
      text:
        en: |-
          Place the tasks in private subnets behind the load balancer, fronted by Amazon CloudFront with AWS WAF rate limiting.
    - id: e
      text:
        en: |-
          Move the MCP server to an AWS Lambda function with reserved concurrency to absorb request floods.
answer: { optionIds: [ c, d ] }
explanation:
  correct:
    en: |-
      AWS guidance for MCP servers runs the ECS service across multiple Availability Zones behind an Application Load Balancer that routes only to healthy targets. The tasks sit in private subnets without direct internet access, and requests arrive through a CloudFront distribution protected by AWS WAF, whose rate limiting blocks request floods.
  options:
    a:
      en: |-
        Public task addresses make the tasks directly reachable from the internet and add no protection against request floods.
    b:
      en: |-
        A single task in one Availability Zone is a single point of failure.
    e:
      en: |-
        Complex, long-running analysis tools are the case for ECS; reserved concurrency caps concurrency but doesn't filter malicious traffic.
references:
  - title: "Guidance for Deploying Model Context Protocol Servers on AWS"
    url: https://docs.aws.amazon.com/solutions/deploying-model-context-protocol-servers-on-aws/
