id: aipc01-2c-res-outposts-link-loss
objective: "2.3.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A manufacturer runs a maintenance assistant on an AWS Outposts rack in a factory with unreliable WAN connectivity. An open-weight model runs on EC2 instances in an Outpost subnet, and technicians reach it from the plant network through the local gateway. The assistant must keep answering during service link outages that can last several hours, including at shift changes, when demand doubles.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Configure an EC2 Auto Scaling group on the Outpost that launches more instances when CPU utilization rises, so that capacity follows demand during an outage.
    - id: b
      text:
        en: |-
          Configure the application to fall back to a geographic cross-Region inference profile in the parent Region when the local instances are overloaded.
    - id: c
      text:
        en: |-
          Keep enough instances running on the Outpost for peak demand at all times, because running instances keep serving local traffic during an outage.
    - id: d
      text:
        en: |-
          Store the model weights in an S3 bucket in the parent Region, and load them when an instance starts, so that the Outpost needs less local storage.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      When the service link is down, EC2 instances already running on the Outpost continue to run and remain reachable on site through the local gateway. Control plane operations such as launching, starting, stopping and terminating instances are unavailable until the link returns, so peak capacity must already be running before an outage.
  options:
    a:
      en: |-
        Scaling out means launching instances, a control plane operation that is not available while the service link is down.
    b:
      en: |-
        The parent Region is reachable only through the service link, so the fallback fails exactly when the outage happens.
    d:
      en: |-
        Loading weights from a Regional bucket requires the service link; during an outage a new instance could neither be launched nor load the model.
references:
  - title: "AWS Outposts racks FAQs | Amazon Web Services"
    url: https://aws.amazon.com/outposts/rack/faqs/
  - title: "What is AWS Outposts? - AWS Outposts"
    url: https://docs.aws.amazon.com/outposts/latest/userguide/what-is-outposts.html
