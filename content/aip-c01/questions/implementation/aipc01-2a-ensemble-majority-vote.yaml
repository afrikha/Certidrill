id: aipc01-2a-ensemble-majority-vote
objective: "2.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A pharmaceutical company classifies adverse-event reports as serious or not serious with a foundation model on Amazon Bedrock. Misclassifications are costly, and an evaluation shows that three different foundation models each make different kinds of errors. The company wants to combine the three models to improve accuracy, send cases on which the models disagree to a human reviewer, and keep the classification time under 30 seconds.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Chain the three models so that each model reviews and corrects the classification of the previous model, and use the output of the last model.
    - id: b
      text:
        en: |-
          Invoke the three models in an AWS Step Functions Parallel state, and have a Lambda function take the majority vote and route split decisions to review.
    - id: c
      text:
        en: |-
          Invoke the most accurate of the three models three times with a temperature of 0 for each report, and use the answer that it returns most often.
    - id: d
      text:
        en: |-
          Put the three models behind an Amazon Bedrock prompt router so that each report is sent to the model that is predicted to classify it best.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      An ensemble runs several models on the same input and aggregates their answers with custom logic. The Parallel state invokes the three models concurrently, which keeps latency close to that of the slowest model, and the aggregation function applies the majority vote and sends any case where the models disagree to human review.
  options:
    a:
      en: |-
        A chain runs the models one after another, which adds latency, lets an early error influence later models, and produces no disagreement signal for human review.
    c:
      en: |-
        Repeated calls to one model with temperature 0 return nearly identical answers, so they do not combine the different strengths of the three models.
    d:
      en: |-
        A prompt router sends each request to one model of a single family, so it neither combines the three models nor detects disagreement.
references:
  - title: Parallel workflow state - AWS Step Functions
    url: https://docs.aws.amazon.com/step-functions/latest/dg/state-parallel.html
