id: aipc01-2b-app-ddb-stream-insert-filter
objective: "2.3.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A retailer's existing application writes products to an Amazon DynamoDB table. The company wants to generate a marketing description with Amazon Bedrock only when a new product in the apparel category is inserted, without changing the application. The Lambda function that generates descriptions must not be invoked for any other change to the table.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Enable DynamoDB Streams, and add filter criteria for apparel INSERT records to the function's event source mapping.
    - id: b
      text:
        en: |-
          Enable DynamoDB Streams, and have the Lambda function skip every record that isn't an insert of an apparel product.
    - id: c
      text:
        en: |-
          Schedule the Lambda function to scan the table every minute for apparel products that have no description yet.
    - id: d
      text:
        en: |-
          Change the application so that it calls Amazon Bedrock after it writes each apparel product to the table.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      DynamoDB Streams captures every change to the table without application changes, and filter criteria on the event source mapping send only matching records to the function. For DynamoDB, the stream iterator advances past records that don't match, so the function is never invoked for them.
  options:
    b:
      en: |-
        Filtering in code still invokes the function for every change, which the requirement forbids.
    c:
      en: |-
        Scanning the table every minute reads it repeatedly and invokes the function whether or not products were added.
    d:
      en: |-
        The application must not be changed.
references:
  - title: "Control which events Lambda sends to your Event Function - AWS Lambda"
    url: https://docs.aws.amazon.com/lambda/latest/dg/invocation-eventfiltering.html
  - title: "DynamoDB Streams and AWS Lambda triggers - Amazon DynamoDB"
    url: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/Streams.Lambda.html
