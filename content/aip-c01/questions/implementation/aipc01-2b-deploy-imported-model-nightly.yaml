id: aipc01-2b-deploy-imported-model-nightly
objective: "2.2.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company imported a fine-tuned Llama 3.1 model into Amazon Bedrock with Custom Model Import and serves real-time requests with InvokeModel. It must now also process about 300,000 support transcripts every night with the same imported model and store the results in Amazon S3 by morning. The company wants to keep the model in Amazon Bedrock and stay within its on-demand quotas.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Queue the transcripts in Amazon SQS, and have a Lambda function with a capped maximum concurrency call InvokeModel and write the results to S3.
    - id: b
      text:
        en: |-
          Write the transcripts as JSONL records to S3, and run an Amazon Bedrock batch inference job on the imported model with CreateModelInvocationJob.
    - id: c
      text:
        en: |-
          Create a custom model deployment for the imported model, and submit the deployment ARN to an Amazon Bedrock batch inference job.
    - id: d
      text:
        en: |-
          Import the model again with an AWS CloudFormation template that enables batch inference for the imported model.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      Imported models are invoked on demand with InvokeModel or InvokeModelWithResponseStream, and Custom Model Import can't be used with batch inference or AWS CloudFormation. Buffering the transcripts in SQS and capping the event source mapping's maximum concurrency processes them overnight while keeping model calls within the on-demand quota.
  options:
    b:
      en: |-
        Custom Model Import can't be used with Amazon Bedrock batch inference.
    c:
      en: |-
        Custom model deployments serve supported models customized in Amazon Bedrock, and imported models still can't be used with batch inference.
    d:
      en: |-
        Custom Model Import supports neither CloudFormation nor batch inference, so no template setting enables it.
references:
  - title: "Use Custom model import to import a customized open-source model into Amazon Bedrock - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/model-customization-import-model.html
  - title: "Configuring scaling behavior for SQS event source mappings - AWS Lambda"
    url: https://docs.aws.amazon.com/lambda/latest/dg/services-sqs-scaling.html
