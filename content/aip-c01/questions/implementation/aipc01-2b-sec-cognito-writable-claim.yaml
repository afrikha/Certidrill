id: aipc01-2b-sec-cognito-writable-claim
objective: "2.3.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company's Cognito identity pool uses a rule that maps the custom:plan claim, when it equals enterprise, to an IAM role that can invoke expensive Amazon Bedrock models. A security review finds that the user pool app client lets users update custom:plan from the app's profile page. The company wants to keep rule-based mapping on this claim and close this escalation path.

    What should the company do?
body:
  options:
    - id: a
      text:
        en: |-
          Change the rule's match type from Equals to Contains.
    - id: b
      text:
        en: |-
          Set the identity pool's role resolution for users who match no rule to deny.
    - id: c
      text:
        en: |-
          Move the enterprise rule to the end of the rule list so that the other rules are evaluated before it.
    - id: d
      text:
        en: |-
          Remove the app client's write permission for custom:plan so that users can't modify it.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      If the claim mapped to a role can be modified by the end user, any end user can assume that role, so only claims that users can't set should map to elevated roles. User pools set read and write permissions per attribute for each app client; removing write permission for custom:plan stops users from changing the value that the rule trusts.
  options:
    a:
      en: |-
        Contains matches even more values and doesn't stop users from editing the claim.
    b:
      en: |-
        Role resolution applies only when no rule matches; a user who sets custom:plan to enterprise still matches the rule.
    c:
      en: |-
        Rule order only decides which matching rule wins; a user who sets the claim still reaches the enterprise rule.
references:
  - title: "Using role-based access control - Amazon Cognito"
    url: https://docs.aws.amazon.com/cognito/latest/developerguide/role-based-access-control.html
