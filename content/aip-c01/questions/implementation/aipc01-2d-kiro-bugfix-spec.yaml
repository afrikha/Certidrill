id: aipc01-2d-kiro-bugfix-spec
objective: "2.5.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    After a change to the chunking code of a retrieval-augmented generation (RAG) ingestion pipeline, some documents produce duplicate chunks in the vector store. The team wants Kiro to find the root cause, record the current behavior, the expected behavior, and the behavior that must stay unchanged, design a fix, and check for regressions, all before any code is changed and with the team reviewing the analysis.

    Which Kiro feature should the team use?
body:
  options:
    - { id: a, text: { en: "A Quick Spec that generates requirements, design, and tasks in one pass" } }
    - { id: b, text: { en: "A bugfix spec that starts from a bug analysis instead of requirements" } }
    - { id: c, text: { en: "A feature spec with the Requirements-First workflow for the fix" } }
    - { id: d, text: { en: "A steering file that describes the chunking rules of the pipeline" } }
answer: { optionId: b }
explanation:
  correct:
    en: "Bugfix specs are designed for diagnosing a root cause, designing a fix, and checking for regressions. They use a bug analysis file instead of requirements, which records the current, expected, and unchanged behavior, and the team reviews it before the fix is implemented."
  options:
    a:
      en: "Quick Spec generates all artifacts in one pass without approval gates and suits well-understood features, not a bug whose cause is unknown."
    c:
      en: "Feature specs are for new capabilities; they don't capture current, expected, and unchanged behavior for a regression."
    d:
      en: "Steering files give the agent persistent context; they don't drive a root-cause analysis or a reviewed fix plan."
references:
  - title: "Specs - Features - Docs - Kiro"
    url: https://kiro.dev/docs/specs/
