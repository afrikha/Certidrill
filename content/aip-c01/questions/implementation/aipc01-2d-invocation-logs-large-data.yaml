id: aipc01-2d-invocation-logs-large-data
objective: "2.5.6"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A media company sends Amazon Bedrock model invocation logs to CloudWatch Logs only. The logging configuration already includes the Text and Image data types. The company's application generates images and also sends documents of more than 100 KB in its prompts. During incident reviews, the generated images and the full content of the large requests are missing from the log events. The team must keep using CloudWatch Logs Insights for its everyday text analysis.

    Which solution will meet these requirements?
body:
  options:
    - { id: a, text: { en: "Add an Amazon S3 location for large data delivery to the logging configuration so that binary data and large bodies go to S3 and the log records reference them." } }
    - { id: b, text: { en: "Change the destination from CloudWatch Logs to Amazon S3 only, and query all invocation logs with Amazon Athena from now on." } }
    - { id: c, text: { en: "Increase the retention period of the log group, and select the Image data type again in the model invocation logging settings." } }
    - { id: d, text: { en: "Turn on CloudWatch Logs data protection for the log group so that large payloads in the log events are preserved in full." } }
answer: { optionId: a }
explanation:
  correct:
    en: "Log events in CloudWatch Logs carry input and output bodies of up to 100 KB. Binary data such as images, and bodies larger than 100 KB, are stored as separate objects in an S3 bucket when an S3 location for large data delivery is set, and the log record references them. Everyday text analysis stays in Logs Insights."
  options:
    b:
      en: "Moving everything to S3 stops the team from using Logs Insights for everyday analysis, which it must keep doing."
    c:
      en: "Retention only controls how long events are kept, and the Image data type is already selected; the large payloads still aren't delivered to CloudWatch Logs."
    d:
      en: "Data protection detects and masks sensitive data in log events; it doesn't store large or binary payloads."
references:
  - title: "Monitor model invocation using CloudWatch Logs and Amazon S3 - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/model-invocation-logging.html
