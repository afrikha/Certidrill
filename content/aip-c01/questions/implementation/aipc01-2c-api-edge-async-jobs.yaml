id: aipc01-2c-api-edge-async-jobs
objective: "2.4.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A mobile app calls an edge-optimized API Gateway REST API whose Lambda proxy integration calls Amazon Bedrock to produce travel itineraries. Generation takes 60 to 180 seconds, and users often switch to another app while they wait. The company wants every itinerary to be delivered, even when the user closes the app before the itinerary is ready.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Request an increase of the integration timeout of the edge-optimized API to 180 seconds through Service Quotas.
    - id: b
      text:
        en: |-
          Raise the Lambda function timeout to 1,800 seconds so that the proxy integration has enough time to finish.
    - id: c
      text:
        en: |-
          Enable response streaming on the edge-optimized API so that the itinerary appears on the phone while it is generated.
    - id: d
      text:
        en: |-
          Queue each request and return a job ID, have a worker store the itinerary in DynamoDB, and let the app fetch it later.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      An asynchronous job pattern does not depend on an open connection: the API accepts the request immediately, a worker stores the result, and the app retrieves it whenever the user returns. This avoids the 29-second integration timeout and survives the user leaving the app.
  options:
    a:
      en: |-
        The integration timeout of an edge-optimized API cannot be raised above 29 seconds.
    b:
      en: |-
        API Gateway still ends the request at its integration timeout, whatever the function timeout is.
    c:
      en: |-
        A stream is lost when the user closes the app, and on an edge-optimized endpoint a stream also closes after 30 seconds without data.
references:
  - title: "Quotas for configuring and running a REST API in API Gateway - Amazon API Gateway"
    url: https://docs.aws.amazon.com/apigateway/latest/developerguide/api-gateway-execution-service-limits-table.html
  - title: "Stream the integration response for your proxy integrations in API Gateway - Amazon API Gateway"
    url: https://docs.aws.amazon.com/apigateway/latest/developerguide/response-transfer-mode.html
