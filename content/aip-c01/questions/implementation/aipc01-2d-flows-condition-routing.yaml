id: aipc01-2d-flows-condition-routing
objective: "2.5.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company builds a prompt chain in Amazon Bedrock Flows. A first prompt node classifies each customer message and returns refund, complaint, or other. Refund messages must continue to a refund prompt node, complaints to a complaint prompt node, and all other messages to a general prompt node. The company wants to stay within Bedrock Flows and write no code.

    Which node should the developer add after the classification prompt node?
body:
  options:
    - { id: a, text: { en: "An iterator node that sends the classification to each of the three prompt nodes in turn" } }
    - { id: b, text: { en: "A Lex node that sends the classification to an Amazon Lex bot, which routes the message" } }
    - { id: c, text: { en: "A condition node with refund and complaint conditions and a default path to the general node" } }
    - { id: d, text: { en: "A DoWhile loop node that repeats the classification until it returns refund or complaint" } }
answer: { optionId: c }
explanation:
  correct:
    en: "A condition node routes data to different downstream nodes based on conditions that compare its inputs with operators such as ==. Conditions are evaluated in order, the first one that matches wins, and the default condition connects the messages that match neither to the general prompt node."
  options:
    a:
      en: "An iterator node processes the items of an array one by one; it doesn't choose one path per message."
    b:
      en: "A Lex node returns the bot's predicted intent for one utterance; it doesn't route the flow, and the classification is already done."
    d:
      en: "A DoWhile loop repeats a node sequence while a condition is true; repeating the classification doesn't route messages, and other messages would never reach the general node."
references:
  - title: "Node types for your flow - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/flows-nodes.html
