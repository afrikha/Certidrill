id: aipc01-2b-mcp-lambda-stateless-tools
objective: "2.1.7"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A travel company is building several AI agents that need two simple tools: currency conversion and airport code lookup. Each tool call is a single stateless request to an internal API that finishes in less than one second. Calls are sporadic, with long idle periods at night. The company wants to expose the tools as one remote MCP server that all agents share, pay only when the tools are called, and manage no servers.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Run the MCP server as an Amazon ECS service on AWS Fargate with two tasks behind an Application Load Balancer.
    - id: b
      text:
        en: |-
          Run the MCP server on Amazon EC2 instances in an Auto Scaling group with a minimum size of one instance.
    - id: c
      text:
        en: |-
          Implement the MCP server as a stateless AWS Lambda function and expose it through a Lambda function URL.
    - id: d
      text:
        en: |-
          Package the MCP server with the stdio transport inside the container image of each agent.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      Lambda suits lightweight, stateless MCP servers: each tool call is a short, independent request, the function scales with traffic, and it is billed per request and duration with no server to manage. A function URL gives every agent the same HTTPS endpoint, and its AWS_IAM auth type limits invocation to authenticated principals.
  options:
    a:
      en: |-
        Fargate tasks run and are billed continuously, including the idle night hours, so the company would not pay only when tools are called. ECS fits complex or long-running tools, not one-second lookups.
    b:
      en: |-
        EC2 instances must be managed and are billed while idle, which violates both the no-servers and the pay-per-call requirements.
    d:
      en: |-
        The stdio transport runs the server as a local process of each agent: there is no shared remote server, and every agent image must be rebuilt when a tool changes.
references:
  - title: "Control access to Lambda function URLs - AWS Lambda"
    url: https://docs.aws.amazon.com/lambda/latest/dg/urls-auth.html
  - title: "MCP servers targets - Amazon Bedrock AgentCore"
    url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/gateway-target-MCPservers.html
