id: aipc01-2b-opt-priority-premium-requests
objective: "2.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A SaaS company's writing assistant calls a model on Amazon Bedrock that supports every service tier. Customers on the enterprise plan must get the fastest possible responses, while free-plan customers accept normal response times. The company wants to minimize cost, avoid capacity commitments, and keep one model configuration for all customers.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Set service_tier to priority on every request so that all customers get the fastest possible responses.
    - id: b
      text:
        en: |-
          Set service_tier to priority on enterprise customers' requests, and leave it unset on free-plan requests.
    - id: c
      text:
        en: |-
          Reserve tokens-per-minute capacity in the Reserved tier for enterprise customers, and use Standard for the others.
    - id: d
      text:
        en: |-
          Set service_tier to flex on enterprise customers' requests so that Amazon Bedrock processes them first.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      The service tier is chosen per request. Priority requests are served ahead of Standard and Flex requests for a premium over standard on-demand pricing, with no reservation, and requests without the service_tier parameter go to the Standard tier. Paying the premium only on enterprise requests balances performance and cost.
  options:
    a:
      en: |-
        Paying the Priority premium for free-plan requests raises cost without a requirement for it.
    c:
      en: |-
        The Reserved tier is a 1-month or 3-month commitment arranged through the account team, which the company wants to avoid.
    d:
      en: |-
        Flex is a discounted tier for workloads that tolerate longer processing times; it doesn't speed requests up.
references:
  - title: "Service tiers for optimizing performance and cost - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/service-tiers-inference.html
