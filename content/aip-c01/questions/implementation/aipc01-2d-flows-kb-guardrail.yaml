id: aipc01-2d-flows-kb-guardrail
objective: "2.5.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A legal information company has a flow in Amazon Bedrock Flows with four nodes: an input node, a knowledge base node configured without a model ID so that it returns the retrieved chunks, a prompt node that generates the answer from a custom template stored in Amazon Bedrock Prompt Management, and an output node. The company must block answers that give investment advice by using an Amazon Bedrock guardrail with a denied topic. The custom prompt template must stay in use.

    Which solution will meet these requirements with the LEAST operational overhead?
body:
  options:
    - { id: a, text: { en: "Add the guardrail configuration to the knowledge base node, and keep the node configured without a model ID." } }
    - { id: b, text: { en: "Add a Lambda function node after the prompt node that calls the ApplyGuardrail API and replaces any blocked answer." } }
    - { id: c, text: { en: "Set a model ID on the knowledge base node so that it uses RetrieveAndGenerate, attach the guardrail to it, and remove the prompt node." } }
    - { id: d, text: { en: "Add the guardrail configuration to the prompt node so that the guardrail is applied to the prompt and to the model response." } }
answer: { optionId: d }
explanation:
  correct:
    en: "Prompt nodes accept a guardrail configuration (guardrail identifier and version) that applies an Amazon Bedrock guardrail to the prompt and its response. The custom template stays in place, and no extra node or code is needed."
  options:
    a:
      en: "A guardrail on a knowledge base node is used only when the node generates a response with RetrieveAndGenerate, which requires a model ID. A node that only returns retrieved chunks generates nothing to check."
    b:
      en: "ApplyGuardrail in a Lambda node works, but it adds a function to write, secure, and maintain, while the prompt node supports guardrails natively."
    c:
      en: "Generating the answer in the knowledge base node replaces the custom Prompt Management template, which must stay in use."
references:
  - title: "Include guardrails in your flow in Amazon Bedrock - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/flows-guardrails.html
  - title: "Node types for your flow - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/flows-nodes.html
