id: aipc01-2b-sec-deny-model-inference-actions
objective: "2.3.3"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    A company's security team must prevent all IAM principals in a development account from running inference on one specific foundation model in Amazon Bedrock, including real-time calls through the Converse and ConverseStream APIs and batch inference jobs. Other models must remain available.

    Which three IAM actions should the security team deny on the model's ARN? (Choose three.)
body:
  choose: 3
  options:
    - id: a
      text:
        en: |-
          bedrock:GetFoundationModel
    - id: b
      text:
        en: |-
          bedrock:InvokeModel
    - id: c
      text:
        en: |-
          bedrock:InvokeModelWithResponseStream
    - id: d
      text:
        en: |-
          bedrock:ApplyGuardrail
    - id: e
      text:
        en: |-
          bedrock:ListFoundationModels
    - id: f
      text:
        en: |-
          bedrock:CreateModelInvocationJob
answer: { optionIds: [ b, c, f ] }
explanation:
  correct:
    en: |-
      Converse requires bedrock:InvokeModel and ConverseStream requires bedrock:InvokeModelWithResponseStream, so both must be denied; denying only one leaves the other path open. Batch inference jobs are created with bedrock:CreateModelInvocationJob. AWS's example policy that denies inference on a foundation model lists these three actions.
  options:
    a:
      en: |-
        GetFoundationModel only returns details about the model; it doesn't run inference.
    d:
      en: |-
        ApplyGuardrail evaluates content against a guardrail and doesn't invoke the model.
    e:
      en: |-
        ListFoundationModels lists the model catalog; it doesn't run inference on the model.
references:
  - title: "Identity-based policy examples for Amazon Bedrock - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/security_iam_id-based-policy-examples.html
  - title: "Inference using Converse API - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/conversation-inference.html
