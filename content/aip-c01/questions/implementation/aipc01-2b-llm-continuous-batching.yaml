id: aipc01-2b-llm-continuous-batching
objective: "2.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company self-hosts an LLM on an Amazon SageMaker AI GPU endpoint with a custom container that processes one generation request at a time. Under load, requests wait in a queue while GPU utilization stays around 25%. The company wants to serve more concurrent users on the same instances.

    Which change will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Move to an instance type with more GPU memory and keep the current container.
    - id: b
      text:
        en: |-
          Add instances to the endpoint with a target tracking scaling policy on the number of invocations per instance.
    - id: c
      text:
        en: |-
          Compile the model for the GPU hardware so that the weights don't need just-in-time compilation.
    - id: d
      text:
        en: |-
          Replace the custom container with a large model inference (LMI) container and enable continuous batching.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      Generating tokens for one request at a time leaves the GPU mostly idle. Continuous batching, a performance feature of LMI containers, adds new requests to the running batch as others finish, so the same GPUs serve many requests concurrently and utilization rises.
  options:
    a:
      en: |-
        A larger GPU stays just as idle while the container still processes one request at a time.
    b:
      en: |-
        More instances serve more users at a higher cost; the requirement is to serve more users on the same instances.
    c:
      en: |-
        Compilation shortens deployment and scale-out time; it doesn't let the container process requests concurrently.
references:
  - title: "The large model inference (LMI) container documentation - Amazon SageMaker AI"
    url: https://docs.aws.amazon.com/sagemaker/latest/dg/large-model-inference-container-docs.html
