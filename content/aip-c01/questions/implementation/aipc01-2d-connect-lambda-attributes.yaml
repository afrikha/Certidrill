id: aipc01-2d-connect-lambda-attributes
objective: "2.5.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An Amazon Connect contact flow invokes a first Lambda function that reads the caller's CRM history, calls Amazon Bedrock, and returns a short customer summary. Later in the flow, a second Lambda function checks the caller's eligibility for a retention offer. The agent's screen, which is populated after the second invocation, must show the summary, and the summary must also be saved in the contact record for later analysis.

    Which solution will meet these requirements?
body:
  options:
    - { id: a, text: { en: "Reference $.External.summary when the agent's screen is populated, because returned values stay available for the rest of the contact." } }
    - { id: b, text: { en: "Return the summary as a field of a nested JSON object, and keep the STRING_MAP response validation in the Invoke AWS Lambda function block." } }
    - { id: c, text: { en: "Return the summary and the next action as a JSON array so that the results of both Lambda functions are kept in order." } }
    - { id: d, text: { en: "After the first invocation, copy the summary from the External namespace into a user-defined contact attribute with a Set contact attributes block." } }
answer: { optionId: d }
explanation:
  correct:
    en: "Values returned by a Lambda function can be referenced as $.External.<key>, but they aren't saved in the contact record and are replaced by the next function's response. Copying the summary into a user-defined contact attribute with a Set contact attributes block keeps it for the rest of the flow and saves it in the contact record."
  options:
    a:
      en: "An external reference always returns the response of the most recently invoked function, so after the eligibility check the summary is gone, and external values aren't saved in contact records."
    b:
      en: "STRING_MAP validation accepts only a flat object of string key-value pairs; nested objects need the JSON response validation."
    c:
      en: "Arrays returned by a Lambda function can't be referenced in a contact flow; they can only be used inside another Lambda function."
references:
  - title: "Grant Connect Customer access to your AWS Lambda functions - Amazon Connect Customer"
    url: https://docs.aws.amazon.com/connect/latest/adminguide/connect-lambda-functions.html
