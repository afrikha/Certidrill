id: aipc01-2d-bda-sync-image
objective: "2.5.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A car rental company's counter app lets agents photograph a customer's driver's license as a JPEG image. The app must display the extracted name, license number, and expiry date in the response to the same API call so that the agent can confirm them immediately, without waiting for a job to finish. The company uses an Amazon Bedrock Data Automation project that contains an image blueprint with these three fields and that routes image file types to the image modality.

    Which solution will meet these requirements?
body:
  options:
    - { id: a, text: { en: "Call the synchronous InvokeDataAutomation API with the image bytes and the project, and read the custom output from the response." } }
    - { id: b, text: { en: "Call InvokeDataAutomationAsync for each photo, and poll GetDataAutomationStatus from the app until the job status is Success." } }
    - { id: c, text: { en: "Convert each photo into a single-page PDF file, and send the PDF file to the synchronous InvokeDataAutomation API with the project." } }
    - { id: d, text: { en: "Add one image blueprint per license layout to the project, and call InvokeDataAutomationAsync with EventBridge notifications." } }
answer: { optionId: a }
explanation:
  correct:
    en: "InvokeDataAutomation is the synchronous BDA operation. It accepts an S3 reference or base64 image bytes and returns the output inline by default, including the custom output of the matched blueprint. It supports images only, which fits a JPEG photo routed to the image modality."
  options:
    b:
      en: "The asynchronous operation returns an invocation ARN, not the results, so the app has to wait for the job and poll, which the requirement rules out."
    c:
      en: "The synchronous operation supports images only; a PDF file is a document and must go through InvokeDataAutomationAsync."
    d:
      en: "A project can contain only one image blueprint, and an asynchronous call with notifications still doesn't return the fields in the same response."
references:
  - title: "Using the Bedrock Data Automation API - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/bda-using-api.html
  - title: "Custom output and blueprints - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/bda-custom-output-idp.html
