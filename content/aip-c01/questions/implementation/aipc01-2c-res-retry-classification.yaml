id: aipc01-2c-res-retry-classification
objective: "2.4.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A developer is writing the error handling of an application that calls Amazon Bedrock. The team lead asks which errors the application should retry automatically with exponential backoff and jitter, and which errors it should return to the caller.

    Which approach should the developer use?
body:
  options:
    - id: a
      text:
        en: |-
          Retry `ValidationException` errors, because a second attempt often succeeds once the model is loaded.
    - id: b
      text:
        en: |-
          Retry `AccessDeniedException` errors, because IAM permissions are evaluated again on each new attempt.
    - id: c
      text:
        en: |-
          Retry every error in the same way, with a fixed delay of one second, until the call succeeds.
    - id: d
      text:
        en: |-
          Retry `ThrottlingException` and `ServiceUnavailableException`, and return `ValidationException` at once.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      Throttling and service unavailability are transient conditions, and AWS recommends retrying them with exponential backoff and jitter. A validation error means that the request itself is invalid, so retrying it can never succeed.
  options:
    a:
      en: |-
        A validation error means that parameters are missing, malformed or out of range; the request must be fixed.
    b:
      en: |-
        AWS SDKs treat `AccessDeniedException` as non-retryable; the role's permissions must be fixed.
    c:
      en: |-
        Fixed delays and unlimited retries worsen throttling and keep retrying errors that can never succeed.
references:
  - title: "Troubleshooting Amazon Bedrock API Error Codes - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/troubleshooting-api-error-codes.html
  - title: "Retry behavior - AWS SDKs and Tools"
    url: https://docs.aws.amazon.com/sdkref/latest/guide/feature-retry-behavior.html
