id: aipc01-2b-mcp-gateway-lambda-tool-name
objective: "2.1.7"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A developer adds an existing AWS Lambda function as a Lambda target named freight in an Amazon Bedrock AgentCore gateway. The function implements three tools, get_rate, get_route and book_slot, and the developer uploads a tool schema for each one. The function selects the tool to run by comparing the bedrockAgentCoreToolName value from the invocation context with the three tool names. Every call made through the gateway returns the function's "unknown tool" error.

    What should the developer change?
body:
  options:
    - id: a
      text:
        en: |-
          Strip the target name prefix and its delimiter from bedrockAgentCoreToolName before comparing it with the tool names.
    - id: b
      text:
        en: |-
          Read the tool name from a toolName field in the event instead of from the invocation context.
    - id: c
      text:
        en: |-
          Rename the tools in the schema so that each name already starts with freight.
    - id: d
      text:
        en: |-
          Create a separate gateway target for each tool so that the gateway passes each tool name to the function without a prefix.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      For Lambda targets, the gateway passes the called tool in the context metadata as bedrockAgentCoreToolName, in the format target name, delimiter, tool name. AgentCore documentation states that these prefixes must be stripped manually in the function, so the dispatcher must remove "freight" and the delimiter before matching get_rate, get_route or book_slot.
  options:
    b:
      en: |-
        The event contains only the map of input properties defined by the tool's inputSchema; the tool name is passed in the context metadata.
    c:
      en: |-
        The gateway still adds the target name prefix, so the names would be prefixed twice and still not match.
    d:
      en: |-
        Every Lambda target passes the tool name in the target-prefixed format, so separate targets don't remove the prefix.
references:
  - title: "AWS Lambda function targets - Amazon Bedrock AgentCore"
    url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/gateway-add-target-lambda.html
