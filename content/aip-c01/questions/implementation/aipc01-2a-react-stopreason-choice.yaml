id: aipc01-2a-react-stopreason-choice
objective: "2.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A developer implements a ReAct loop in AWS Step Functions. A Lambda function in the Reason state calls the Amazon Bedrock Converse API with the conversation history and the tool configuration, and returns the full Converse response. The next state must send the workflow to the Act state when the model asks for a tool and to the Validate state when the model has produced its final answer. The routing must work for any tool name and any wording of the answer.

    Which condition should the Choice state evaluate?
body:
  options:
    - id: a
      text:
        en: |-
          Whether the text of the response contains the string "Action:" followed by the name of a tool.
    - id: b
      text:
        en: |-
          Whether the outputTokens value in the usage field of the response is greater than zero.
    - id: c
      text:
        en: |-
          Whether the HTTP status code of the Converse response that the Lambda function received is 200.
    - id: d
      text:
        en: |-
          Whether the stopReason field of the response equals tool_use.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      When the model wants a tool, Converse returns the stop reason tool_use with a toolUse block that holds the tool name and input. A final answer ends with another stop reason, such as end_turn, so checking stopReason routes reliably whatever the tool or wording.
  options:
    a:
      en: |-
        Parsing free text for a keyword depends on the model's wording and fails when the model phrases its request differently; Converse already returns structured tool requests.
    b:
      en: |-
        Both tool requests and final answers produce output tokens, so the token count does not tell them apart.
    c:
      en: |-
        A successful response returns status 200 for both tool requests and final answers.
references:
  - title: Converse - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/APIReference/API_runtime_Converse.html
  - title: Use a tool to complete an Amazon Bedrock model response - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/tool-use.html
