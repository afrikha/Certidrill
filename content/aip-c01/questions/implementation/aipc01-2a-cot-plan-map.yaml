id: aipc01-2a-cot-plan-map
objective: "2.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A market research company wants a foundation model to answer complex questions such as "How did regulation change pricing in our three main markets over five years?". The company wants the model to first break each question into a plan of independent sub-questions; the number of sub-questions varies from 3 to 15. Each sub-question must be answered separately with a retrieval tool, the sub-questions must run concurrently, and each step must be testable on its own. A final step must combine the partial answers into one report.

    Which AWS Step Functions design will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          A Parallel state with 15 branches that each ask the model one fixed type of sub-question, followed by a Task state that combines the outputs of the branches into a report.
    - id: b
      text:
        en: |-
          A single Task state that sends a prompt asking the model to think step by step, answer every sub-question, and write the final report in one response to the request.
    - id: c
      text:
        en: |-
          A Task state that asks the model for the plan as a JSON array, a Map state that answers each sub-question with the retrieval tool, and a Task state that writes the report.
    - id: d
      text:
        en: |-
          A Choice state that routes the question to one of three prompts based on its length and topic, followed by a Task state that asks the model to write the final report.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      Separating planning, execution, and synthesis applies chain-of-thought as explicit workflow steps. The Map state runs one iteration per item of the plan, whatever the number of sub-questions, and its iterations run in parallel; each state can be tested with its own inputs.
  options:
    a:
      en: |-
        Parallel branches are fixed in the state machine definition, so they cannot follow a plan whose number and content of sub-questions are decided by the model at run time.
    b:
      en: |-
        A single response gives no separately testable steps and no concurrent retrieval for each sub-question.
    d:
      en: |-
        Routing on question length does not decompose the question into sub-questions or run them concurrently.
references:
  - title: Map workflow state - AWS Step Functions
    url: https://docs.aws.amazon.com/step-functions/latest/dg/state-map.html
  - title: Parallel workflow state - AWS Step Functions
    url: https://docs.aws.amazon.com/step-functions/latest/dg/state-parallel.html
