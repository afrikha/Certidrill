id: aipc01-2b-opt-two-workload-savings
objective: "2.2.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company's GenAI platform on Amazon Bedrock has two workloads that both use one large model with on-demand inference. An interactive assistant receives mostly short FAQ questions, which an evaluation shows a small model answers as well as the large model. A nightly job summarizes 50,000 documents through the runtime API, and the summaries are needed by the next afternoon. Both models support every Amazon Bedrock service tier.

    Which two changes will reduce cost while meeting these requirements? (Choose two.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Set the service_tier field to priority for the nightly summarization requests.
    - id: b
      text:
        en: |-
          Purchase Provisioned Throughput with a six-month commitment for the large model to serve both workloads.
    - id: c
      text:
        en: |-
          Route the FAQ questions to the smaller model and keep the large model for the questions that need it.
    - id: d
      text:
        en: |-
          Set the service_tier field to flex for the nightly summarization requests.
    - id: e
      text:
        en: |-
          Reserve tokens-per-minute capacity in the Reserved tier for the nightly job.
answer: { optionIds: [ c, d ] }
explanation:
  correct:
    en: |-
      Sending routine questions to the smallest model that passes evaluation lowers token cost for most of the assistant's traffic. The Flex tier gives a pricing discount for workloads that tolerate longer processing times, such as content summarization, and is selected per request with service_tier set to flex.
  options:
    a:
      en: |-
        The Priority tier adds a price premium for speed that the nightly job doesn't need.
    b:
      en: |-
        A six-month commitment bills every hour and keeps the FAQ traffic on the large model.
    e:
      en: |-
        The Reserved tier is for mission-critical applications that can't tolerate downtime, with a 1-month or 3-month commitment; a job with an afternoon deadline doesn't need it.
references:
  - title: "Service tiers for optimizing performance and cost - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/service-tiers-inference.html
