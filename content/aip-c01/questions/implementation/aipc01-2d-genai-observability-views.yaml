id: aipc01-2d-genai-observability-views
objective: "2.5.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company runs several applications that call models on Amazon Bedrock and several agents hosted on Amazon Bedrock AgentCore. The operations team wants prebuilt views of invocation counts, token usage, latency percentiles, and error and throttling rates for the models, plus performance views of the AgentCore agents, their memory, and their gateways. The team wants the LEAST effort to build and maintain these views.

    Which solution will meet these requirements?
body:
  options:
    - { id: a, text: { en: "Export the invocation logs to Amazon S3, catalog them with AWS Glue, and build Amazon Athena queries with AWS Quick dashboards." } }
    - { id: b, text: { en: "Create an Amazon Managed Grafana workspace, and build one panel for each Bedrock and AgentCore metric that the team needs." } }
    - { id: c, text: { en: "Use CloudWatch generative AI observability, with its Model Invocations dashboard and its Amazon Bedrock AgentCore agents views." } }
    - { id: d, text: { en: "Use AWS Cost Explorer with a filter on the Amazon Bedrock service, and group the results by usage type and by tag." } }
answer: { optionId: c }
explanation:
  correct:
    en: "CloudWatch generative AI observability provides prebuilt views: a Model Invocations dashboard of usage, token consumption, latency (average, P90, P99), errors, and throttling for Bedrock models, and AgentCore views of agents, memory, built-in tools, gateways, and identity. No dashboards need to be built."
  options:
    a:
      en: "A custom data lake and BI dashboards meet the need but require building and maintaining the pipeline, queries, and visuals."
    b:
      en: "Grafana panels must be built and maintained one by one, which is more effort than the prebuilt views."
    d:
      en: "Cost Explorer shows spending, not latency, errors, throttling, or agent performance."
references:
  - title: "Generative AI observability - Amazon CloudWatch"
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/GenAI-observability.html
