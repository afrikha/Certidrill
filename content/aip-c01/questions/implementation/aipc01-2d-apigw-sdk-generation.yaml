id: aipc01-2d-apigw-sdk-generation
objective: "2.5.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company exposes a generative AI product-description service through an Amazon API Gateway REST API that it imported from an OpenAPI definition. The API has been tested but not yet deployed. Partner developers are building an Android app in Java, an iOS app in Swift, and a JavaScript web app, and they want ready-made client libraries so that they don't hand-write the HTTP calls and request signing.

    Which solution will meet these requirements with the LEAST effort?
body:
  options:
    - { id: a, text: { en: "Generate the Java for Android, iOS Swift, and JavaScript SDKs from API Gateway now, before any deployment, so that partners can code against the draft API." } }
    - { id: b, text: { en: "Ask each partner to write its own HTTP client from the OpenAPI definition, and publish the three clients in a shared code repository." } }
    - { id: c, text: { en: "Deploy the API to a stage, and then generate the Java for Android, iOS Swift, and JavaScript SDKs for that stage from API Gateway." } }
    - { id: d, text: { en: "Expose the service as an Amazon Bedrock Flows alias, and give the partners the AWS SDK so that they call InvokeFlow directly." } }
answer: { optionId: c }
explanation:
  correct:
    en: "API Gateway generates platform-specific SDKs for a REST API, including Java, JavaScript, Java for Android, and Objective-C or Swift for iOS. The API must be deployed to a stage at least once before an SDK can be generated, so the team deploys the tested API and then generates the three SDKs for that stage."
  options:
    a:
      en: "SDKs are generated for a deployed stage; an API that has never been deployed has no stage to generate them from."
    b:
      en: "Hand-written clients are the effort the partners want to avoid, and three separate implementations can drift from the contract."
    d:
      en: "A flow alias isn't the partners' REST API, and calling InvokeFlow would require AWS credentials in the partners' apps instead of the agreed interface."
references:
  - title: "Generate SDKs for REST APIs in API Gateway - Amazon API Gateway"
    url: https://docs.aws.amazon.com/apigateway/latest/developerguide/how-to-generate-sdk.html
