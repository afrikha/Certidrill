id: aipc01-2a-converse-tool-turn-format
objective: "2.1.6"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    A developer integrates a get_exchange_rate tool with an application that uses the Amazon Bedrock Converse API. The model returns a response with the stop reason tool_use and a toolUse block that contains a toolUseId, the tool name, and the input. The developer runs the tool and must now send the result back so that the model can complete its answer in the same conversation.

    Which actions must the developer take in the next Converse request? (Choose two.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Append the assistant message that contains the toolUse block to the messages of the conversation.
    - id: b
      text:
        en: |-
          Put the tool output in the system prompt and send the conversation without the toolUse block.
    - id: c
      text:
        en: |-
          Set toolChoice to any so that the model is forced to use the tool output in its answer.
    - id: d
      text:
        en: |-
          Append a user message that contains a toolResult block with the same toolUseId and the tool output.
    - id: e
      text:
        en: |-
          Start a new conversation whose only user message contains the tool output as plain text.
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: |-
      In Amazon Bedrock the model never calls the tool itself: the application runs it and returns the result. The conversation must contain the assistant turn with the toolUse request, followed by a user turn with a toolResult block whose toolUseId identifies the request it answers, so that the model can continue.
  options:
    b:
      en: |-
        The system prompt is not the channel for tool results, and removing the toolUse block breaks the link between the request and its result.
    c:
      en: |-
        toolChoice any forces the model to request a tool again (no text is generated), so it cannot produce the final answer.
    e:
      en: |-
        A new conversation loses the user's question and the tool request, so the model lacks the context to answer.
references:
  - title: ToolResultBlock - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/APIReference/API_runtime_ToolResultBlock.html
  - title: Use a tool to complete an Amazon Bedrock model response - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/tool-use.html
