id: aipc01-2b-mcp-lambda-server-design
objective: "2.1.7"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company is implementing a set of lightweight lookup tools as an MCP server on AWS Lambda. Agents built with different frameworks will connect to the server remotely by using standard MCP client libraries. Nothing may run between calls, and the server must work correctly however Lambda scales and recycles its execution environments.

    Which two design choices should the company make? (Choose two.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Use the stdio transport so that MCP clients exchange messages with the server through standard input and output.
    - id: b
      text:
        en: |-
          Use the streamable HTTP transport so that remote MCP clients call the server over HTTPS.
    - id: c
      text:
        en: |-
          Keep each client's MCP session and its recent tool results in global variables of the function so that later calls can reuse them.
    - id: d
      text:
        en: |-
          Configure provisioned concurrency so that each MCP client is always served by the same execution environment.
    - id: e
      text:
        en: |-
          Run the server in stateless mode and keep any data that a tool needs between calls in an external store such as Amazon DynamoDB.
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: |-
      Remote MCP clients reach a server over the streamable HTTP transport, which a Lambda function can serve behind a function URL or API Gateway. Because any request can run in any execution environment, a Lambda MCP server must run in stateless mode, the mode AWS documents for basic streamable HTTP servers, with data that must survive between calls kept in an external store.
  options:
    a:
      en: |-
        stdio is for a server that runs as a local child process of the client; remote agents can't use it.
    c:
      en: |-
        Global variables exist in one execution environment only; later calls can land in other environments, and environments are recycled, so sessions would be lost.
    d:
      en: |-
        Provisioned concurrency keeps environments initialized but doesn't pin a client to one environment.
references:
  - title: "Deploy MCP servers in AgentCore Runtime - Amazon Bedrock AgentCore"
    url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/runtime-mcp.html
  - title: "MCP servers targets - Amazon Bedrock AgentCore"
    url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/gateway-target-MCPservers.html
