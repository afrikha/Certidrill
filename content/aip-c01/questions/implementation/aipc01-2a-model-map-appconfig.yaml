id: aipc01-2a-model-map-appconfig
objective: "2.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A SaaS company runs a multi-tenant document assistant on AWS Lambda. The foundation model used for each request depends on the tenant tier (free or premium) and the task type (summary, extraction, or chat). The operations team must be able to change this mapping without redeploying the Lambda functions. Each change must be rolled out gradually and rolled back automatically if an Amazon CloudWatch alarm on the error rate goes off.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Store the mapping in environment variables of the Lambda functions, and update the variables with the AWS CLI each time the operations team changes the mapping.
    - id: b
      text:
        en: |-
          Store the mapping in an Amazon DynamoDB table that the functions read on every request, and have the operations team update the items when the mapping changes.
    - id: c
      text:
        en: |-
          Store the mapping in AWS AppConfig, deploy changes with a gradual deployment strategy that monitors the alarm, and read the mapping through the AppConfig Agent.
    - id: d
      text:
        en: |-
          Hardcode the mapping in the function code, and deploy each change with a weighted Lambda alias that shifts traffic gradually to the new version.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      AWS AppConfig changes application behavior without redeploying code. Its deployment strategies roll a change out gradually, and when a monitored CloudWatch alarm goes off during deployment, AppConfig rolls the change back automatically. The functions read the cached configuration from the local endpoint of the AppConfig Agent.
  options:
    a:
      en: |-
        Updating environment variables applies the change to all invocations at once, with no gradual rollout and no automatic rollback on the alarm.
    b:
      en: |-
        A DynamoDB item update takes effect immediately for every request; the table offers no gradual rollout or alarm-based rollback.
    d:
      en: |-
        Hardcoding the mapping requires a code deployment for every change, which the operations team must avoid.
references:
  - title: What is AWS AppConfig? - AWS AppConfig
    url: https://docs.aws.amazon.com/appconfig/latest/userguide/what-is-appconfig.html
