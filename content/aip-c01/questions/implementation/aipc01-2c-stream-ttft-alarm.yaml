id: aipc01-2c-stream-ttft-alarm
objective: "2.4.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company streams answers from Amazon Bedrock with `ConverseStream`. The product team defines its latency objective as the time users wait before the first words of an answer appear. The operations team must create a CloudWatch alarm on this objective by using a metric that Amazon Bedrock publishes.

    Which metric should the alarm use?
body:
  options:
    - id: a
      text:
        en: |-
          `TimeToFirstToken`
    - id: b
      text:
        en: |-
          `InvocationLatency`
    - id: c
      text:
        en: |-
          `OutputTokenCount`
    - id: d
      text:
        en: |-
          `EstimatedTPMQuotaUsage`
answer: { optionId: a }
explanation:
  correct:
    en: |-
      `TimeToFirstToken` measures the time from when a request is sent to when the first token is received, for the streaming operations `ConverseStream` and `InvokeModelWithResponseStream`. That is the wait that users perceive before text appears.
  options:
    b:
      en: |-
        `InvocationLatency` runs until the last token is received, so it grows with the length of the answer.
    c:
      en: |-
        `OutputTokenCount` counts generated tokens; it does not measure latency.
    d:
      en: |-
        `EstimatedTPMQuotaUsage` estimates quota consumption; it does not measure latency.
references:
  - title: "Monitor bedrock-runtime inference using CloudWatch metrics - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/monitoring-cw.html
