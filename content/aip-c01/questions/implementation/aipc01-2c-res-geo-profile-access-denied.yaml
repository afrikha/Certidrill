id: aipc01-2c-res-geo-profile-access-denied
objective: "2.3.4"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    A company in eu-west-1 moves an application from an in-Region model ID to the EU geographic cross-Region inference profile of the same model. The application role allows `bedrock:InvokeModel` only on the inference profile ARN, and an SCP denies all actions outside eu-west-1. After the change, some requests fail with access denied errors. Processing must stay in the EU, and the SCP must keep blocking other AWS services outside eu-west-1.

    Which combination of changes will meet these requirements? (Choose two.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Allow `bedrock:InvokeModel` on the foundation model in the source Region and in each destination Region, with a `bedrock:InferenceProfileArn` condition.
    - id: b
      text:
        en: |-
          Replace the EU geographic profile with the global inference profile of the same model so that the SCP no longer evaluates the destination Regions.
    - id: c
      text:
        en: |-
          Manually enable each destination Region of the profile in the account so that Amazon Bedrock is allowed to route requests to those Regions.
    - id: d
      text:
        en: |-
          Add an SCP exception based on `bedrock:InferenceProfileArn` for the approved profile so that requests routed to destination Regions are allowed.
    - id: e
      text:
        en: |-
          Purchase Provisioned Throughput for the EU inference profile so that all requests are served from reserved capacity in eu-west-1.
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: |-
      A geographic profile needs permission on the profile and on the foundation model in every destination Region, scoped with `bedrock:InferenceProfileArn`. An SCP that blocks a destination Region breaks routing unless that Region is allowed or an inference profile exception based on `bedrock:InferenceProfileArn` is added; the exception keeps the Region restriction for every other service.
  options:
    b:
      en: |-
        The global profile can process requests in any commercial Region, which violates the requirement to keep processing in the EU.
    c:
      en: |-
        Cross-Region inference can route to Regions that are not manually enabled in the account, so enabling Regions does not fix the IAM and SCP denials.
    e:
      en: |-
        Inference profiles do not support Provisioned Throughput.
references:
  - title: "Geographic cross-Region inference - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/geographic-cross-region-inference.html
  - title: "Route model inference requests across AWS Regions with cross-Region inference - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/cross-region-inference.html
