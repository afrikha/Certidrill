id: aipc01-2a-agents-as-tools
objective: "2.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A telecom company has one Strands agent that answers customer questions about billing, shipping, and technical faults. The agent has 45 tools, and it often chooses a billing tool for a technical question. The company wants to split the agent into three specialist agents that each have only their own tools, keep one entry point for customers, and let the entry point decide which specialist must answer each question. Many questions need only one specialist. The company wants to write the LEAST amount of new code.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Create an orchestrator agent that calls the three specialist agents as tools based on their descriptions.
    - id: b
      text:
        en: |-
          Write application code that sends every question to the billing, shipping, and technical agents in turn and concatenates the three answers.
    - id: c
      text:
        en: |-
          Keep the single agent with all 45 tools, and add a longer system prompt that describes when to use each tool.
    - id: d
      text:
        en: |-
          Deploy each specialist as an A2A server on a separate AgentCore Runtime, and build a client application that calls the three servers.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      With the agents-as-tools pattern, an orchestrator agent delegates to specialist agents in the same way it calls any tool, choosing them from their descriptions. Each specialist sees only its own tools, which improves tool selection, and the pattern is the usual first step beyond a single agent with little extra code.
  options:
    b:
      en: |-
        Calling all three specialists for every question wastes model calls when only one is needed and leaves the merge of three answers to custom code.
    c:
      en: |-
        A longer system prompt does not reduce the number of tools the model must choose from, so the wrong-tool problem remains and the company's goal of specialist agents is not met.
    d:
      en: |-
        A2A suits agents that run as separate services, such as agents owned by different teams. Here it adds three deployments and a client application, which is more code than needed.
references:
  - title: Strands Agents - AWS Prescriptive Guidance
    url: https://docs.aws.amazon.com/prescriptive-guidance/latest/agentic-ai-frameworks/strands-agents.html
