id: aipc01-2a-structured-reasoning-techniques
objective: "2.1.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A logistics company uses a foundation model on Amazon Bedrock to answer multi-step questions such as "What is the total landed cost of this shipment after duties, insurance, and a volume discount?". Reviews show two kinds of errors: the model skips intermediate steps, and it makes arithmetic mistakes in long calculations. The company wants the model to follow explicit reasoning steps and to get exact numbers.

    Which combination of actions will meet these requirements? (Choose two.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Increase the temperature to 1.0 so that the model explores more possible solution paths before it settles on a final answer.
    - id: b
      text:
        en: |-
          Instruct the model to work through the problem step by step and to list each intermediate result before it gives the final answer.
    - id: c
      text:
        en: |-
          Use Amazon Bedrock intelligent prompt routing so that each question is sent to the model of the family that is predicted to answer it best.
    - id: d
      text:
        en: |-
          Give the model a calculator tool, run the tool whenever the model requests it, and return the result before the model continues.
    - id: e
      text:
        en: |-
          Reduce the maximum number of output tokens so that the model writes shorter answers that contain fewer intermediate steps.
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |-
      Asking the model to build toward the answer step by step is a chain-of-thought technique that reduces skipped steps. Offloading arithmetic to a tool in a reason-and-act loop gives exact numbers: the model decides when to calculate, the application runs the tool, and the model continues with the observation.
  options:
    a:
      en: |-
        A higher temperature makes outputs more random, which tends to increase errors in precise calculations.
    c:
      en: |-
        Intelligent prompt routing chooses between two models of one family for quality and cost; it does not make either model follow explicit steps or compute exactly.
    e:
      en: |-
        Fewer output tokens discourage the intermediate steps that the company wants and can cut answers off.
references:
  - title: Design a prompt - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/design-a-prompt.html
  - title: Use a tool to complete an Amazon Bedrock model response - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/tool-use.html
