id: aipc01-2c-api-sqs-visibility
objective: "2.4.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A Lambda function consumes an Amazon SQS queue and calls Amazon Bedrock to generate reports. The event source mapping was created when the function timeout was 60 seconds and the queue visibility timeout was 360 seconds. Later, longer reports required a function timeout of 900 seconds, and the team changed only the function. Since then, many reports are generated twice. The team must remove the duplicates caused by this configuration.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Set the queue visibility timeout to at least six times the function timeout, and make the function idempotent.
    - id: b
      text:
        en: |-
          Reduce the batch size of the event source mapping to 1 so that each invocation processes only one report.
    - id: c
      text:
        en: |-
          Configure a dead-letter queue with a `maxReceiveCount` of 1 so that a message can never be delivered twice.
    - id: d
      text:
        en: |-
          Lower the maximum concurrency of the event source to 2 so that fewer reports are processed at the same time.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      A message becomes visible again after 360 seconds while the first invocation is still running, so another invocation processes it. Lambda checks the timeouts only when the mapping is created or updated, not when the function timeout changes; AWS recommends a visibility timeout of at least six times the function timeout, and because delivery is at least once, the function should also be idempotent.
  options:
    b:
      en: |-
        A smaller batch does not stop a message from reappearing while it is still being processed.
    c:
      en: |-
        A `maxReceiveCount` of 1 moves a message to the dead-letter queue after one failed receive, which removes retries (AWS recommends at least 5) and does not fix the timeout mismatch.
    d:
      en: |-
        Concurrency does not change how long each message stays hidden from other consumers.
references:
  - title: "Creating and configuring an Amazon SQS event source mapping - AWS Lambda"
    url: https://docs.aws.amazon.com/lambda/latest/dg/services-sqs-configure.html
  - title: "Using Lambda with Amazon SQS - AWS Lambda"
    url: https://docs.aws.amazon.com/lambda/latest/dg/with-sqs.html
