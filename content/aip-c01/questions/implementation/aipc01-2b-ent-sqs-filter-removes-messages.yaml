id: aipc01-2b-ent-sqs-filter-removes-messages
objective: "2.3.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A legacy order system sends both contract messages and invoice messages to one Amazon SQS queue, and it can't send to any other destination. An archive service polls the queue for invoice messages. A new AWS Lambda function reads the same queue through an event source mapping to summarize contracts with Amazon Bedrock. After the team added filter criteria that match only contract messages to the mapping, the archive service stopped receiving many invoice messages. Each consumer must receive all of its own messages.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Change the filter criteria to match invoice messages too, and have the function ignore the invoice messages that it receives.
    - id: b
      text:
        en: |-
          Increase the queue's visibility timeout so that the archive service has more time to read the invoice messages first.
    - id: c
      text:
        en: |-
          Add a second filter with an anything-but contract rule so that invoice messages are left in the queue.
    - id: d
      text:
        en: |-
          Have one consumer forward each message to an Amazon EventBridge bus, with rules that send each message type to its own queue.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      For SQS event sources, Lambda automatically removes messages that don't satisfy the filter criteria, so the mapping discarded invoice messages before the archive service could read them. One consumer that republishes messages to an event bus, with a rule per message type that targets a dedicated queue, gives each service its own copy.
  options:
    a:
      en: |-
        The function would then receive and consume the invoice messages, which removes them from the queue before the archive service reads them.
    b:
      en: |-
        The visibility timeout doesn't stop Lambda from removing the messages that don't match the filter.
    c:
      en: |-
        Filters are ORed: invoice messages would match the second filter and be delivered to the function, which consumes them.
references:
  - title: "Control which events Lambda sends to your Event Function - AWS Lambda"
    url: https://docs.aws.amazon.com/lambda/latest/dg/invocation-eventfiltering.html
  - title: "Amazon EventBridge event patterns - Amazon EventBridge"
    url: https://docs.aws.amazon.com/eventbridge/latest/userguide/eb-event-patterns.html
