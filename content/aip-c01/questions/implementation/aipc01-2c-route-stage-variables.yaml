id: aipc01-2c-route-stage-variables
objective: "2.4.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A team deploys one API Gateway REST API definition to `dev`, `test`, and `prod` stages. Each stage must invoke a different Lambda function, and each function calls a different model version, so that new models are tested before they reach production. The team wants to keep a single API definition without duplicating resources for each environment.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Create three copies of the API definition, one for each environment, each with its own Lambda integration.
    - id: b
      text:
        en: |-
          Use a Lambda proxy integration, and add a mapping template that selects the function from the request path.
    - id: c
      text:
        en: |-
          Create one usage plan for each stage that points the stage to the Lambda function of its own environment.
    - id: d
      text:
        en: |-
          Set a stage variable with the function name in each stage, and reference it in the Lambda integration of the API.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      Stage variables are key-value pairs of each stage that can be referenced in the integration, so each stage supplies its own function name. API Gateway needs permission to invoke every function that a stage variable names.
  options:
    a:
      en: |-
        Copies duplicate the API definition, which the team wants to avoid.
    b:
      en: |-
        Proxy integrations do not use mapping templates, and the request path is the same in every stage.
    c:
      en: |-
        Usage plans throttle and meter clients; they do not select integrations.
references:
  - title: "Use stage variables for a REST API in API Gateway - Amazon API Gateway"
    url: https://docs.aws.amazon.com/apigateway/latest/developerguide/stage-variables.html
