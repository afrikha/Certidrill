id: aipc01-2d-express-sync-chain
objective: "2.5.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A mobile app calls an Amazon API Gateway REST API to run a three-step prompt chain with Amazon Bedrock: detect the language, translate, and summarize. Each run completes in under 20 seconds, and the app must receive the final summary in the same HTTP response. The API handles several million requests each month. The company wants the orchestration's steps to be logged for troubleshooting and wants the MOST cost-effective orchestration.

    Which solution will meet these requirements?
body:
  options:
    - { id: a, text: { en: "Have API Gateway start an AWS Step Functions Standard workflow with StartExecution, and return the workflow's output to the app." } }
    - { id: b, text: { en: "Have API Gateway start an asynchronous AWS Step Functions Express workflow with logging to CloudWatch Logs, and return its output." } }
    - { id: c, text: { en: "Have API Gateway start an Amazon Bedrock Flows flow execution with StartFlowExecution, and return the flow's output to the app." } }
    - { id: d, text: { en: "Have API Gateway start a synchronous AWS Step Functions Express workflow with logging to CloudWatch Logs, and return its output." } }
answer: { optionId: d }
explanation:
  correct:
    en: "Synchronous Express workflows wait for the execution to finish and return the result, and API Gateway can invoke them directly. Express workflows run for up to five minutes and are priced by executions, duration, and memory, which suits high-volume, short runs, and their history is available in CloudWatch Logs when logging is enabled."
  options:
    a:
      en: "StartExecution on a Standard workflow returns as soon as the execution starts, not with its output, and Standard pricing per state transition costs more at this volume."
    b:
      en: "An asynchronous Express workflow returns only a start confirmation and doesn't wait for completion, so the app wouldn't get the summary."
    c:
      en: "Flow executions run asynchronously and return an execution ARN that must be polled; the feature is also in preview."
references:
  - title: "Choosing workflow type in Step Functions - AWS Step Functions"
    url: https://docs.aws.amazon.com/step-functions/latest/dg/choosing-workflow-type.html
  - title: "Run Amazon Bedrock flows asynchronously with flow executions - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/flows-create-async.html
