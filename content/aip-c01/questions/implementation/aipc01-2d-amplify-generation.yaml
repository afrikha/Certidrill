id: aipc01-2d-amplify-generation
objective: "2.5.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A retail marketplace has a React web app built with AWS Amplify Gen 2. Signed-in merchants fill in a form with product attributes, and the app must return a generated product title and three bullet points as structured data from an Amazon Bedrock model. Merchants don't chat with the model, and no conversation history needs to be kept. The developers want to write the LEAST custom backend code.

    Which solution will meet these requirements?
body:
  options:
    - { id: a, text: { en: "Define an Amplify AI kit conversation route with a system prompt, and display the result in the AIConversation chat component." } }
    - { id: b, text: { en: "Create an Amazon API Gateway REST API backed by a Lambda function that calls the Converse API, and parse the model's text in the browser." } }
    - { id: c, text: { en: "Define an Amplify AI kit generation route with typed arguments and a return type, and call it from the form with the useAIGeneration hook." } }
    - { id: d, text: { en: "Call the Bedrock Converse API directly from the browser with the AWS SDK and an access key stored in the front-end configuration file." } }
answer: { optionId: c }
explanation:
  correct:
    en: "An Amplify AI kit generation route is a single request-response call (an AWS AppSync query) whose input arguments and return shape are declared in the data schema, which suits summaries and structured data. The React hook calls it with the form values, and Amplify provisions the backend that calls Bedrock."
  options:
    a:
      en: "A conversation route is a multi-turn chat API that stores every conversation and message in DynamoDB; the merchants don't chat, and no history is needed."
    b:
      en: "A custom REST API and Lambda function meet the need but add backend code, IAM, and parsing logic that the generation route provides declaratively."
    d:
      en: "Long-term credentials in front-end code can be read by anyone who loads the app; the AI kit makes secure server-side calls to Bedrock instead."
references:
  - title: "Build fullstack AI apps in minutes with the new Amplify AI Kit | Front-End Web & Mobile"
    url: https://aws.amazon.com/blogs/mobile/build-fullstack-ai-apps-in-minutes-with-the-new-amplify-ai-kit
  - title: "AWS Amplify launches the full-stack AI kit for Amazon Bedrock"
    url: https://aws.amazon.com/about-aws/whats-new/2024/11/aws-amplify-full-stack-ai-kit-amazon-bedrock
