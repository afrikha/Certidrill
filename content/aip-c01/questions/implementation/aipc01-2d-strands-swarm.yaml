id: aipc01-2d-strands-swarm
objective: "2.5.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company is building an incident-response assistant with Strands Agents. It has specialist agents for application logs, networking, and databases. For each incident, the specialists must decide among themselves at run time which specialist works next, handing the task off to one another with shared context and working memory. The developers don't want to define the execution path in code.

    Which Strands multi-agent pattern should the developers use?
body:
  options:
    - { id: a, text: { en: "Swarm" } }
    - { id: b, text: { en: "Graph" } }
    - { id: c, text: { en: "Workflow" } }
    - { id: d, text: { en: "Agents as Tools" } }
answer: { optionId: a }
explanation:
  correct:
    en: "In a swarm, agents hand off to each other at run time and share context and working memory, so the specialists themselves decide the path. Strands Agents recommends a swarm when the specialists should decide the path, with incident response as a typical fit."
  options:
    b:
      en: "In a graph, developers define the nodes, edges, and edge conditions in code, which is the path definition the developers want to avoid."
    c:
      en: "In a workflow, the application calls the agents in a fixed order chosen by the developers."
    d:
      en: "With agents as tools, one orchestrator model picks a specialist for each query and folds the answer back in; the specialists don't hand off to each other."
references:
  - title: "Choose a multi-agent pattern | Strands Agents"
    url: https://strandsagents.com/latest/documentation/docs/user-guide/concepts/multi-agent/multi-agent-patterns/
