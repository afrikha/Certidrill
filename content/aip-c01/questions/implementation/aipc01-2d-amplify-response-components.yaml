id: aipc01-2d-amplify-response-components
objective: "2.5.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A travel company's AWS Amplify Gen 2 React app has an AI kit conversation route that recommends hotels. Product managers want the assistant to show each recommended hotel as an interactive card, built with the app's existing HotelCard React component (photo, price, and a Book button), instead of plain text. The model must decide when a card is useful. The developers want the least custom parsing code, and the security team forbids rendering HTML generated by the model.

    Which solution will meet these requirements?
body:
  options:
    - { id: a, text: { en: "Instruct the model in the system prompt to answer in HTML, and render each message's content with dangerouslySetInnerHTML in a custom message view." } }
    - { id: b, text: { en: "Pass the HotelCard component to the AIConversation component's responseComponents, with a description and props, so that the model can render it." } }
    - { id: c, text: { en: "Replace the conversation route with a generation route that returns a list of hotels, and render each item of the list as a HotelCard." } }
    - { id: d, text: { en: "Instruct the model to return hotel JSON inside its message text, and parse that text in a custom renderer that maps each object to a HotelCard." } }
answer: { optionId: b }
explanation:
  correct:
    en: "The AIConversation component accepts responseComponents: React components, each with a description and props, that the model can choose to render in its replies instead of plain text. The model supplies only the props, the app renders its own component, and no model-generated HTML or custom parsing is involved."
  options:
    a:
      en: "Rendering model-generated HTML is exactly what the security team forbids, and it exposes the app to injected markup and scripts."
    c:
      en: "A generation route is a single request-response call, so the chat experience would be lost."
    d:
      en: "Parsing JSON out of free text is custom code that breaks whenever the model formats its answer differently."
references:
  - title: "Build fullstack AI apps in minutes with the new Amplify AI Kit | Front-End Web & Mobile"
    url: https://aws.amazon.com/blogs/mobile/build-fullstack-ai-apps-in-minutes-with-the-new-amplify-ai-kit
