id: aipc01-2a-tool-range-validation
objective: "2.1.6"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A wholesale company's ordering assistant uses an Anthropic Claude 4 model through the Amazon Bedrock Converse API. The place_order tool already uses a strict schema with additionalProperties set to false. Business rules require a quantity between 1 and 100 and a delivery date in the future. When the model requests an order that breaks a rule, the order must not be placed, and the model must be able to explain the problem to the user or correct the request in the same conversation.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Add minimum and maximum keywords for the quantity to the strict schema, and rely on Amazon Bedrock to enforce the range and the date in the model's tool calls.
    - id: b
      text:
        en: |-
          Describe the allowed quantity range and the date rule in the tool description, and place the order with whatever values the model sends.
    - id: c
      text:
        en: |-
          Validate the quantity and the date in the Lambda function that implements the tool, and return a toolResult with status error and a message that states the broken rule.
    - id: d
      text:
        en: |-
          Set toolChoice to tool with the name place_order so that the model fills in all parameters of the tool before it answers.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      Structured outputs do not support numerical constraints such as minimum and maximum, and a schema cannot express that a date is in the future, so business rules must be checked in the tool code, which must treat model input as untrusted. Returning a toolResult with status error, which Claude 3 and 4 and Amazon Nova models support, lets the model read the problem and correct the request or explain it to the user.
  options:
    a:
      en: |-
        Numerical constraints such as minimum and maximum are not supported in structured outputs schemas, and no schema keyword checks that a date is in the future.
    b:
      en: |-
        A description guides the model but does not enforce anything, so invalid orders could be placed.
    d:
      en: |-
        Forcing the tool decides which tool is requested; it does not validate the values.
references:
  - title: Get validated JSON results from models - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/structured-output.html
  - title: ToolResultBlock - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/APIReference/API_runtime_ToolResultBlock.html
