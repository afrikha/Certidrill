id: aipc01-2c-route-metric-driven
objective: "2.4.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company's chat application reads the active model ID from an AWS AppConfig configuration through the AppConfig Agent. When the latency of the primary model degrades, the company wants traffic to switch automatically to a secondary model, and to switch back when latency recovers, without a code deployment. Latency is measured with the primary model's `InvocationLatency` metric in CloudWatch.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Add the latency alarm as a monitor of the AppConfig deployment strategy so that AppConfig switches to the secondary model when the alarm fires.
    - id: b
      text:
        en: |-
          Have `InvocationLatency` alarm state changes invoke, through EventBridge, a Lambda function that deploys the right model ID to AppConfig.
    - id: c
      text:
        en: |-
          Replace the configuration with an Amazon Bedrock prompt router that routes each request according to the latency of each model.
    - id: d
      text:
        en: |-
          Create one API Gateway stage per model, and have the operations team move all clients to the other stage when the latency alarm fires.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      Alarm state changes can trigger automation that deploys a new value of the routing configuration. The application picks up the secondary model ID from AppConfig without a code deployment, and the alarm's return to OK switches traffic back the same way.
  options:
    a:
      en: |-
        An AppConfig monitor rolls back a configuration deployment that is in progress when its alarm fires; it does not choose another model when latency degrades later.
    c:
      en: |-
        Prompt routers route by predicted response quality within one model family and cannot use application-specific performance data such as latency.
    d:
      en: |-
        Moving clients by hand is neither automatic nor transparent to the clients.
references:
  - title: "What is AWS AppConfig? - AWS AppConfig"
    url: https://docs.aws.amazon.com/appconfig/latest/userguide/what-is-appconfig.html
  - title: "Monitor bedrock-runtime inference using CloudWatch metrics - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/monitoring-cw.html
