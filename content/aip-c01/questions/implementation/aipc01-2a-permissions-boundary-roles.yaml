id: aipc01-2a-permissions-boundary-roles
objective: "2.1.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company runs an internal agent platform in one AWS account. A CI/CD pipeline creates a new IAM role for every tool that product teams add to their agents, and each team writes the identity policy of its tool role. The security team must guarantee that no tool role can ever do more than invoke approved Amazon Bedrock models and read the DynamoDB tables of the platform, even if a team writes an overly broad policy or the pipeline is misconfigured. Other workloads in the same account must keep their current permissions.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Create a permissions boundary policy with the allowed actions, and let the pipeline call iam:CreateRole only when iam:PermissionsBoundary equals that policy.
    - id: b
      text:
        en: |-
          Run IAM Access Analyzer policy validation in the pipeline, and fail the deployment whenever a tool's identity policy returns security warnings.
    - id: c
      text:
        en: |-
          Attach a service control policy to the account that denies every action except invoking the approved models and reading the platform tables.
    - id: d
      text:
        en: |-
          Create a policy engine in AgentCore Policy that forbids the tools from calling any AWS action other than the approved model invocations and table reads.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      A permissions boundary sets the maximum permissions that an identity-based policy can grant; the effective permissions are the intersection of the two, so a broad team policy cannot exceed the boundary. Requiring the boundary through the iam:PermissionsBoundary condition key makes role creation fail when the pipeline omits it, and other workloads are not affected.
  options:
    b:
      en: |-
        Policy validation is an advisory check in the pipeline; it can miss overly broad but valid policies and does not cap permissions if the pipeline is misconfigured.
    c:
      en: |-
        An SCP applies to every principal in the account, so it would also remove permissions from the other workloads.
    d:
      en: |-
        AgentCore Policy evaluates the tool calls that agents make through AgentCore Gateway; it does not limit the AWS actions that a tool's IAM role can perform.
references:
  - title: Permissions boundaries for IAM entities - AWS Identity and Access Management
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/access_policies_boundaries.html
