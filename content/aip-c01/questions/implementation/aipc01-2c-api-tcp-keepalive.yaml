id: aipc01-2c-api-tcp-keepalive
objective: "2.5.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A document analysis service runs on Amazon EC2 instances in private subnets and calls Amazon Bedrock through a NAT gateway. Non-streaming requests on very large documents take more than 6 minutes. These calls fail with connection errors after about 350 seconds, while Amazon Bedrock returns no error and the SDK read timeout is already 900 seconds. The service must complete these calls.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Increase the SDK read timeout to 1,800 seconds, and increase the maximum number of attempts to 5.
    - id: b
      text:
        en: |-
          Enable TCP keep-alive in the SDK client, and set the operating system keep-alive time below 350 seconds.
    - id: c
      text:
        en: |-
          Catch `ModelTimeoutException` errors, and retry each failed call once with exponential backoff and jitter.
    - id: d
      text:
        en: |-
          Add a second NAT gateway in another Availability Zone, and route half of the instances through it.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      NAT gateways, interface VPC endpoints and Network Load Balancers drop TCP connections that are idle for 350 seconds, and a long non-streaming call sends no data while the model works. AWS recommends enabling TCP keep-alive in the SDK and lowering the operating system keep-alive interval below 350 seconds; both settings are required.
  options:
    a:
      en: |-
        Longer timeouts and more attempts do not stop the network path from dropping the idle connection, so every attempt fails the same way.
    c:
      en: |-
        Amazon Bedrock returns no `ModelTimeoutException`; the connection is dropped on the network path, and a retry fails the same way.
    d:
      en: |-
        Every NAT gateway applies the same idle timeout.
references:
  - title: "Troubleshooting Amazon Bedrock API Error Codes - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/troubleshooting-api-error-codes.html
