id: aipc01-2c-res-wavelength-5g
objective: "2.3.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A retail company builds a mobile app that lets shoppers point their phone camera at a product and get an instant description. Most users connect through a carrier 5G network. A small vision model must answer with the lowest possible network latency to the mobile devices, while longer conversational answers can come from a model on Amazon Bedrock in the AWS Region.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Run the small model on EC2 instances in a Wavelength Zone subnet with a carrier gateway, and call Amazon Bedrock in the parent Region for conversations.
    - id: b
      text:
        en: |-
          Run the small model on an AWS Outposts rack at the company headquarters, and call Amazon Bedrock in the parent Region for conversations.
    - id: c
      text:
        en: |-
          Place Amazon CloudFront in front of an API Gateway Regional endpoint that invokes the small model on a SageMaker AI endpoint in the Region.
    - id: d
      text:
        en: |-
          Invoke the vision model and the conversational model through a global cross-Region inference profile to spread requests across Regions.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      Wavelength Zones deploy EC2 and other compute at the edge of carrier networks, and the carrier gateway carries traffic from the mobile network directly to the instances, which minimizes latency for 5G users. A Wavelength Zone is a logical extension of its parent Region, so the app still calls Amazon Bedrock there for conversations.
  options:
    b:
      en: |-
        An Outpost at headquarters runs on the company's premises, not at the edge of the carrier network, so mobile traffic would still travel to the company site.
    c:
      en: |-
        CloudFront accelerates delivery, but each inference still runs on the SageMaker AI endpoint in the Region, far from the mobile network edge.
    d:
      en: |-
        Cross-Region inference increases throughput by routing across Regions; it does not place a model at the edge of the mobile network.
references:
  - title: "What is AWS Wavelength? - AWS Wavelength"
    url: https://docs.aws.amazon.com/wavelength/latest/developerguide/what-is-wavelength.html
