id: aipc01-2c-gateway-auth-quotas
objective: "2.3.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A platform team builds a central GenAI gateway for 15 internal teams with an API Gateway REST API and AWS Lambda. Only employees who sign in through the corporate identity provider, which is federated into an Amazon Cognito user pool, may call the gateway. Each team must get its own request rate, burst, and daily request quota, and requests above these limits must be rejected before any model is invoked.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Issue an API key to each team, require API keys on every method, and add the keys to usage plans that set each team's rate, burst, and daily quota.
    - id: b
      text:
        en: |-
          Add a Cognito user pool authorizer, and configure stage-level throttling on the API with the rate and burst limits that each team needs.
    - id: c
      text:
        en: |-
          Add a Lambda authorizer that validates the tokens, and request a separate Amazon Bedrock quota increase for each team's model calls.
    - id: d
      text:
        en: |-
          Add a Cognito user pool authorizer, and give each team an API key in a usage plan that sets the team's rate, burst, and daily quota.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      The Cognito user pool authorizer authenticates the employees. Usage plans throttle and meter each API key with its own rate, burst and quota, and API Gateway rejects excess requests with HTTP 429 before the integration invokes a model.
  options:
    a:
      en: |-
        API keys identify clients for usage plans, but AWS warns against using them for authentication or authorization; anyone holding a key could call the gateway.
    b:
      en: |-
        Stage-level throttling is shared by every caller of the stage and has no daily quota, so it cannot give each team its own limits.
    c:
      en: |-
        Amazon Bedrock quotas apply to the account, not to teams, and requests over a team's allowance would still invoke models.
references:
  - title: "Usage plans and API keys for REST APIs in API Gateway - Amazon API Gateway"
    url: https://docs.aws.amazon.com/apigateway/latest/developerguide/api-gateway-api-usage-plans.html
  - title: "Throttle requests to your REST APIs for better throughput in API Gateway - Amazon API Gateway"
    url: https://docs.aws.amazon.com/apigateway/latest/developerguide/api-gateway-request-throttling.html
