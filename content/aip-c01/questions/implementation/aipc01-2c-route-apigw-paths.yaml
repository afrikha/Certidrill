id: aipc01-2c-route-apigw-paths
objective: "2.4.4"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company exposes two chat tiers to its mobile app through an API Gateway REST API: `/chat/fast`, served by a small-model backend, and `/chat/expert`, served by a legacy expert service that expects a different JSON request format than the one the app sends. The company wants API Gateway to perform the routing and the request transformation, without changing the app or the backends.

    Which combination of steps will meet these requirements? (Choose two.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Create the `/chat/fast` and `/chat/expert` resources in the REST API, each integrated with its own backend.
    - id: b
      text:
        en: |-
          Create a stage variable that the app sets in each request to select the backend for that request.
    - id: c
      text:
        en: |-
          Use a non-proxy integration for `/chat/expert` with a mapping template that rewrites the request body.
    - id: d
      text:
        en: |-
          Use a Lambda proxy integration for `/chat/expert`, and add a mapping template to its integration request.
    - id: e
      text:
        en: |-
          Create a usage plan for each tier so that API Gateway sends each request to the backend of its tier.
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |-
      Separate resources route each path to its own integration, and a VTL mapping template on a non-proxy integration transforms the request body before it reaches the backend.
  options:
    b:
      en: |-
        Stage variables are defined per stage, not set by the client in each request.
    d:
      en: |-
        Proxy integrations pass the request through to the backend; mapping templates transform requests for non-proxy integrations.
    e:
      en: |-
        Usage plans throttle and meter API keys; they do not route requests.
references:
  - title: "Mapping template transformations for REST APIs in API Gateway - Amazon API Gateway"
    url: https://docs.aws.amazon.com/apigateway/latest/developerguide/models-mappings.html
  - title: "Use stage variables for a REST API in API Gateway - Amazon API Gateway"
    url: https://docs.aws.amazon.com/apigateway/latest/developerguide/stage-variables.html
