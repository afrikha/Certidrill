id: aipc01-2a-ensemble-free-text-aggregation
objective: "2.1.4"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    A news company generates a summary of each long investigative article with three different foundation models running in parallel. The three summaries are free text, so a majority vote on identical answers is not possible. Editors want the system to select automatically the single summary that is the most accurate and complete, using either a quality judgment or the agreement among the three candidates.

    Which aggregation methods will meet these requirements? (Choose two.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Select the longest of the three summaries, because the longest summary is likely to contain the most facts from the article.
    - id: b
      text:
        en: |-
          Have a judge model score each summary against an accuracy and completeness rubric, and select the summary with the highest score.
    - id: c
      text:
        en: |-
          Select the summary from the model that responded first, so that the article and its summary can be published as early as possible.
    - id: d
      text:
        en: |-
          Concatenate the three summaries into one combined text so that no information produced by any of the three models is lost.
    - id: e
      text:
        en: |-
          Embed the three summaries, compute their pairwise semantic similarity, and select the summary that is most similar to the other two.
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: |-
      For free-text outputs, custom aggregation logic replaces exact-match voting. An LLM-as-a-judge applies a rubric and picks the best candidate, and a consensus method based on embeddings selects the candidate that agrees most with the others, which reduces the effect of one model's hallucination.
  options:
    a:
      en: |-
        Length does not measure accuracy; a longer summary can contain more errors or padding.
    c:
      en: |-
        Response time says nothing about quality, so this selection ignores the editors' accuracy requirement.
    d:
      en: |-
        Concatenation does not select a single summary and repeats content, including any errors from each model.
references:
  - title: Evaluate model performance using another LLM as a judge - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/evaluation-judge.html
  - title: Parallel workflow state - AWS Step Functions
    url: https://docs.aws.amazon.com/step-functions/latest/dg/state-parallel.html
