id: aipc01-2c-cicd-pretraffic-hook
objective: "2.3.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A team deploys a GenAI API as a Lambda function with AWS SAM and gradual deployments through AWS CodeDeploy. Before any production traffic reaches a new version, the team wants to send 20 test prompts to that version and check that every answer is valid JSON that follows the expected schema. If a check fails, the deployment must stop without affecting users.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Add a `PreTraffic` hook to the `DeploymentPreference` that invokes the new version with the test prompts and reports the result to CodeDeploy.
    - id: b
      text:
        en: |-
          Add a `PostTraffic` hook to the `DeploymentPreference` that invokes the new version with the test prompts and reports the result to CodeDeploy.
    - id: c
      text:
        en: |-
          Add an alarm on the function's `Errors` metric to the `Alarms` list of the `DeploymentPreference` so that invalid answers roll back the release.
    - id: d
      text:
        en: |-
          Add a manual approval action to the pipeline after the deployment so that a reviewer checks 20 answers taken from the production logs.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      CodeDeploy invokes the `PreTraffic` hook before it starts shifting traffic to the new version. The hook must report success or failure, and a failure aborts the deployment, so no user reaches a version that fails the checks.
  options:
    b:
      en: |-
        The `PostTraffic` hook runs after traffic shifting is complete, so users have already received answers from the new version.
    c:
      en: |-
        An alarm reacts to errors observed while traffic is shifting, after some users reach the new version, and an invalid JSON answer in a successful invocation is not a function error.
    d:
      en: |-
        A review after the deployment is too late and is not automatic.
references:
  - title: "Deploying serverless applications gradually with AWS SAM - AWS Serverless Application Model"
    url: https://docs.aws.amazon.com/serverless-application-model/latest/developerguide/automating-updates-to-serverless-apps.html
