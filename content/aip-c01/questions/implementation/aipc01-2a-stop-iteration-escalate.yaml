id: aipc01-2a-stop-iteration-escalate
objective: "2.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A bank runs a dispute-resolution agent as a ReAct loop in an AWS Step Functions Standard workflow. Sometimes the model alternates between two tools without converging, and the execution keeps looping until it fails. The bank requires that a run stop after eight reason-and-act iterations and send the case, with its partial history, to a queue that human agents work from. The stopping rule must not depend on the model's behavior.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Add a Retry field with MaxAttempts set to 8 to the Reason state so that the loop is attempted at most eight times before the execution fails.
    - id: b
      text:
        en: |-
          Keep an iteration counter that the Act state increments, and add a Choice state that routes to an SQS escalation state when the counter reaches 8.
    - id: c
      text:
        en: |-
          Add an instruction to the system prompt that tells the model to stop calling tools and ask for human help after eight tool calls.
    - id: d
      text:
        en: |-
          Set the TimeoutSeconds field of the state machine to 10 minutes so that executions that keep looping are stopped automatically by Step Functions.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      A counter in the state and a Choice state that compares it with a fixed value implement a deterministic stopping condition in the workflow itself. The Choice state can route to an escalation path that sends the case and its history reference to the human queue instead of failing.
  options:
    a:
      en: |-
        Retriers handle errors raised by a state; a model response that requests another tool is not an error, so MaxAttempts does not count loop iterations.
    c:
      en: |-
        A prompt instruction only makes the model less likely to continue; it is not a deterministic control.
    d:
      en: |-
        A state machine timeout fails the execution with States.Timeout instead of escalating it, and it limits time rather than the number of iterations.
references:
  - title: Handling errors in Step Functions workflows - AWS Step Functions
    url: https://docs.aws.amazon.com/step-functions/latest/dg/concepts-error-handling.html
