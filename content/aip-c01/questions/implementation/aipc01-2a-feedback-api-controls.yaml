id: aipc01-2a-feedback-api-controls
objective: "2.1.5"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company is adding a feedback mechanism to its generative AI assistant. Signed-in users of the web application submit a rating from 1 to 5 and an optional correction through an Amazon API Gateway REST API, and a Lambda function stores the feedback for evaluation datasets. Users already sign in through an Amazon Cognito user pool. Only signed-in users must be able to submit feedback, and malformed submissions must be rejected before the Lambda function is invoked.

    Which combination of actions will meet these requirements? (Choose two.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Configure a COGNITO_USER_POOLS authorizer for the feedback method, and have the client send the user's token in the Authorization header.
    - id: b
      text:
        en: |-
          Require an API key on the feedback method, and embed the key in the JavaScript code of the web application that submits the feedback.
    - id: c
      text:
        en: |-
          Enable API caching on the stage so that repeated feedback submissions from the same user are answered from the cache instead of the function.
    - id: d
      text:
        en: |-
          Attach a request validator to the method with a JSON schema model that requires a rating between 1 and 5 and limits the correction field.
    - id: e
      text:
        en: |-
          Have the Lambda function check the rating and the identity of the user, and return an error response when the submission is invalid.
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: |-
      With a Cognito user pool authorizer, the call succeeds only when the client supplies a valid identity or access token from the user pool. A request validator checks the payload against the method's JSON schema model and fails invalid requests with a 400 error before the integration request, so the function is not invoked.
  options:
    b:
      en: |-
        An API key embedded in browser code is visible to anyone and identifies the application, not a signed-in user.
    c:
      en: |-
        Caching serves responses for repeated requests; it neither authenticates users nor validates submissions.
    e:
      en: |-
        Validation in the function happens after the function is invoked, which breaks the requirement to reject malformed submissions before invocation.
references:
  - title: Control access to REST APIs using Amazon Cognito user pools as an authorizer - Amazon API Gateway
    url: https://docs.aws.amazon.com/apigateway/latest/developerguide/apigateway-integrate-with-cognito.html
  - title: Request validation for REST APIs in API Gateway - Amazon API Gateway
    url: https://docs.aws.amazon.com/apigateway/latest/developerguide/api-gateway-method-request-validation.html
