id: aipc01-2c-stream-edge-idle
objective: "2.4.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company streams model answers through an edge-optimized API Gateway REST API with the response transfer mode set to `STREAM`. For complex questions, the model reasons for 40 to 60 seconds before it emits the first token, and these connections are closed before any text arrives. Short answers work. The company does not use its own CloudFront distribution and must deliver the long answers without changing the model.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Request an increase of the API's integration timeout to 120 seconds.
    - id: b
      text:
        en: |-
          Change the response transfer mode to `BUFFERED` so that API Gateway waits for the complete answer.
    - id: c
      text:
        en: |-
          Move the API to a Regional endpoint, where the idle timeout of a streamed response is 5 minutes.
    - id: d
      text:
        en: |-
          Enable stage caching so that API Gateway holds the connection while the model reasons.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      On an edge-optimized endpoint, a streamed response is closed after 30 seconds without data. Regional and private endpoints allow 5 minutes of idle time, which covers the reasoning delay before the first token.
  options:
    a:
      en: |-
        The integration timeout of an edge-optimized API cannot be raised, and these streams are closed by the idle timeout, not the integration timeout.
    b:
      en: |-
        Buffered mode is bound by the 29-second integration timeout and removes incremental delivery.
    d:
      en: |-
        Caching is not supported with response streaming and does not keep connections open.
references:
  - title: "Stream the integration response for your proxy integrations in API Gateway - Amazon API Gateway"
    url: https://docs.aws.amazon.com/apigateway/latest/developerguide/response-transfer-mode.html
