id: aipc01-2b-mcp-ecs-browser-sessions
objective: "2.1.7"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A research company is building an MCP server that gives agents a web-research tool. The tool keeps a headless browser session open across many tool calls from the same agent session, the server's container image with browser dependencies is 3 GB, and some research operations run for up to 45 minutes. Hundreds of agents use the tool during business hours, and the server must scale with demand.

    Which hosting solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Deploy the MCP server as an AWS Lambda function from a container image, with 10,240 MB of memory and the maximum function timeout.
    - id: b
      text:
        en: |-
          Deploy the MCP server as an AWS Lambda function behind an Amazon API Gateway REST API, and enable provisioned concurrency to keep the browser sessions warm.
    - id: c
      text:
        en: |-
          Deploy the MCP server as a Lambda function URL and save each browser session in Amazon ElastiCache between invocations.
    - id: d
      text:
        en: |-
          Deploy the MCP server as an Amazon ECS service on AWS Fargate behind an Application Load Balancer with sticky sessions, and scale it with Service Auto Scaling.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      MCP servers that hold long-lived sessions, large dependencies or long-running operations fit containers on Amazon ECS. Fargate tasks have no function timeout, load balancer stickiness keeps a session's requests on the task that holds its browser, and Service Auto Scaling adds tasks as traffic grows. AWS guidance for MCP servers runs them on Amazon ECS behind an Application Load Balancer.
  options:
    a:
      en: |-
        The Lambda function timeout maximum is 1,800 seconds (30 minutes), so 45-minute operations would be stopped, and an execution environment can't be relied on to keep a browser session open between calls.
    b:
      en: |-
        Provisioned concurrency keeps execution environments initialized but doesn't send a session's calls to the same environment, and the 30-minute maximum timeout still stops 45-minute operations.
    c:
      en: |-
        A running browser process can't be saved to a cache and restored between invocations, and the 30-minute Lambda maximum timeout still applies.
references:
  - title: "Lambda quotas - AWS Lambda"
    url: https://docs.aws.amazon.com/lambda/latest/dg/gettingstarted-limits.html
  - title: "Guidance for Deploying Model Context Protocol Servers on AWS"
    url: https://docs.aws.amazon.com/solutions/deploying-model-context-protocol-servers-on-aws/
