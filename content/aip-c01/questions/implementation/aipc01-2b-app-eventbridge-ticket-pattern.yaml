id: aipc01-2b-app-eventbridge-ticket-pattern
objective: "2.3.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A support platform publishes TicketCreated events to an Amazon EventBridge event bus with the source com.example.support. The detail of each event contains a priority field and a language field. Only tickets with a priority of high or urgent and a language of en must reach a GenAI triage queue, so that other tickets never reach the model.

    Which event pattern should the rule use?
body:
  options:
    - id: a
      text:
        en: |-
          {"source": ["com.example.support"], "detail-type": ["TicketCreated"], "priority": ["high", "urgent"], "language": ["en"]}
    - id: b
      text:
        en: |-
          {"source": ["com.example.support"], "detail-type": ["TicketCreated"], "detail": {"priority": [{"anything-but": ["low"]}], "language": ["en"]}}
    - id: c
      text:
        en: |-
          {"source": ["com.example.support"], "detail-type": ["TicketCreated"], "detail": {"priority": ["high", "urgent"], "language": ["en"]}}
    - id: d
      text:
        en: |-
          {"source": ["com.example.support"], "detail-type": ["TicketCreated"], "detail": {"priority": ["high"], "language": ["en"]}}
answer: { optionId: c }
explanation:
  correct:
    en: |-
      An event pattern has the same structure as the events it matches: event body fields are nested under detail, and every condition must match. A field matches when the event's value equals any value in its array, so this pattern sends only high or urgent tickets in English.
  options:
    a:
      en: |-
        priority and language are inside the event's detail, so top-level fields never match and no ticket is sent.
    b:
      en: |-
        anything-but low also matches other priorities, such as medium, which must not reach the model.
    d:
      en: |-
        Urgent tickets would never reach the triage queue.
references:
  - title: "Amazon EventBridge event patterns - Amazon EventBridge"
    url: https://docs.aws.amazon.com/eventbridge/latest/userguide/eb-event-patterns.html
