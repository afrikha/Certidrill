id: aipc01-2c-api-max-tokens-quota
objective: "2.5.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company's API sets `max_tokens` to 32,000 on every request to a model on Amazon Bedrock, although typical answers are about 800 tokens. CloudWatch shows that the actual input and output token counts are far below the tokens-per-minute quota, but the API receives frequent `ThrottlingException` errors at moderate traffic. The company wants more concurrent requests within the existing quota, at no additional cost.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Set `max_tokens` close to the expected output length of each use case so that each request reserves less quota when it starts.
    - id: b
      text:
        en: |-
          Purchase Provisioned Throughput for the model so that requests are no longer limited by the tokens-per-minute quota.
    - id: c
      text:
        en: |-
          Set the SDK retry mode to `adaptive` so that the client slows down its requests when it is throttled.
    - id: d
      text:
        en: |-
          Enable prompt caching so that the cached input tokens are no longer counted toward the quota.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      At the start of each request, Amazon Bedrock reserves the input tokens plus `max_tokens` against the tokens-per-minute quota and returns the unused tokens only when the request ends. An oversized `max_tokens` reserves far more than the request uses, which lowers concurrency; a value close to the typical output keeps the reservation near the final consumption.
  options:
    b:
      en: |-
        Provisioned Throughput is an additional cost, which the company wants to avoid.
    c:
      en: |-
        Adaptive mode lowers the request rate instead of fitting more requests within the quota.
    d:
      en: |-
        Cache reads are not counted, but the oversized output reservation, which causes the throttling, remains.
references:
  - title: "How tokens are counted in Amazon Bedrock - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/quotas-token-burndown.html
