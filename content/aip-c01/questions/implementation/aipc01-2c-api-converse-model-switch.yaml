id: aipc01-2c-api-converse-model-switch
objective: "2.4.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A software company builds a writing assistant on Amazon Bedrock that must be able to switch between models from Anthropic, Meta, and Amazon. The developers want a single request and response format in their code so that switching models only changes a configuration value.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Call `InvokeModel`, and build each provider's native JSON request body in a separate code path selected by the configuration value.
    - id: b
      text:
        en: |-
          Submit the prompts as batch inference jobs, and read each model's results from the job output in Amazon S3.
    - id: c
      text:
        en: |-
          Call the `Converse` API, and read the model ID that the request uses from the configuration value.
    - id: d
      text:
        en: |-
          Call `InvokeModelWithResponseStream`, and parse each provider's native response chunks in the application.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      The `Converse` API provides one consistent request and response format for every Amazon Bedrock model that supports messages, so the same code works with each model and only `modelId` changes. Model-specific parameters, when needed, go in `additionalModelRequestFields`.
  options:
    a:
      en: |-
        Native request bodies differ by provider, so every model switch needs provider-specific code.
    b:
      en: |-
        Batch inference processes large offline datasets; it does not suit an interactive assistant or remove format differences.
    d:
      en: |-
        The native streaming operation also uses provider-specific request bodies and response chunks.
references:
  - title: "Inference using Converse API - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/conversation-inference.html
