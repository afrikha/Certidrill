id: aipc01-2d-kiro-new-team
objective: "2.5.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    In November 2026, a startup opens its first AWS account and forms a team to build a generative AI application on Amazon Bedrock. The developers want an AI coding assistant in their IDE and terminal that generates and refactors code across the repository and can connect to MCP servers. The startup has no existing subscriptions to AWS developer tools.

    Which tool should the team adopt?
body:
  options:
    - { id: a, text: { en: "Amazon Q Developer Pro, with a new Q Developer subscription for the team" } }
    - { id: b, text: { en: "Amazon CodeGuru Reviewer, associated with the team's code repository" } }
    - { id: c, text: { en: "The Amazon Bedrock console playground, with the team's preferred model" } }
    - { id: d, text: { en: "Kiro, used as an agentic IDE and as a command line interface" } }
answer: { optionId: d }
explanation:
  correct:
    en: "Kiro is the agentic IDE and CLI that AWS names as the successor to Amazon Q Developer. It generates and refactors code with chat, specs, steering, and hooks, and it supports MCP servers."
  options:
    a:
      en: "New Q Developer subscriptions and Free Tier accounts can't be created since May 15, 2026, and the Q Developer IDE plugins reach end of support on April 30, 2027."
    b:
      en: "CodeGuru Reviewer reviews code and isn't a code-generation assistant; it is also outside the exam's in-scope services."
    c:
      en: "The console playground is for trying prompts against models; it doesn't work in the IDE or edit the repository."
references:
  - title: "Amazon Q Developer end-of-support announcement | AWS DevOps & Developer Productivity Blog"
    url: https://aws.amazon.com/blogs/devops/amazon-q-developer-end-of-support-announcement/
