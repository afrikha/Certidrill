id: aipc01-2b-ent-stream-fanout-events
objective: "2.3.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A product table in Amazon DynamoDB has a stream that already invokes two AWS Lambda functions: a search indexer and an audit writer. A team now wants every product change to also trigger a GenAI function that rewrites product descriptions with Amazon Bedrock, and more consumers are planned. The company wants to avoid stream read throttling and let future consumers subscribe without changing the stream's configuration.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Subscribe the GenAI function to the stream as a third Lambda trigger, and increase the batch size of all three mappings.
    - id: b
      text:
        en: |-
          Have the audit writer call the GenAI function synchronously for each stream record that it processes.
    - id: c
      text:
        en: |-
          Keep one function on the stream that publishes each change to an Amazon EventBridge event bus, and give each consumer its own rule.
    - id: d
      text:
        en: |-
          Have the GenAI function scan the table every five minutes for the items that changed since its last run.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      Up to two Lambda functions can subscribe to the same DynamoDB stream, and exceeding that can cause read throttling. One stream consumer that republishes each change as an event lets any number of consumers subscribe with their own EventBridge rules, each matching only the events it needs, with no change to the stream.
  options:
    a:
      en: |-
        Up to two Lambda functions can subscribe to the same stream; adding more can cause read throttling, and every later consumer would add another reader.
    b:
      en: |-
        This couples the audit writer to the GenAI function and slows it down, and each later consumer would require another change to the audit writer.
    d:
      en: |-
        Scanning repeatedly reads the whole table, misses intermediate changes, and is polling rather than event-driven integration.
references:
  - title: "DynamoDB Streams and AWS Lambda triggers - Amazon DynamoDB"
    url: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/Streams.Lambda.html
  - title: "Amazon EventBridge event patterns - Amazon EventBridge"
    url: https://docs.aws.amazon.com/eventbridge/latest/userguide/eb-event-patterns.html
