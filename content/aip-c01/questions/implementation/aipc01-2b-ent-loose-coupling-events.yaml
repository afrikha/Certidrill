id: aipc01-2b-ent-loose-coupling-events
objective: "2.3.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A bank wants to add AI-generated summaries to its loan application process. The loan system must not depend on the summarizer or wait for it, and other teams must be able to use the summaries later without any change to the summarizer.

    Which two design choices will meet these requirements? (Choose two.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          The loan system calls the summarizer's API synchronously and stores the returned summary in its database before it confirms each application.
    - id: b
      text:
        en: |-
          The loan system publishes a LoanSubmitted event to an EventBridge bus, and a rule sends it to the summarizer's SQS queue.
    - id: c
      text:
        en: |-
          The summarizer publishes a LoanSummarized event to the bus when a summary is ready, and other teams add their own rules.
    - id: d
      text:
        en: |-
          The summarizer writes each finished summary directly into the database of every team that needs to use it.
    - id: e
      text:
        en: |-
          The other teams poll the summarizer's Amazon CloudWatch Logs log group to find the summaries that are ready.
answer: { optionIds: [ b, c ] }
explanation:
  correct:
    en: |-
      In a loosely coupled design, the producer publishes a business event and knows nothing about its consumers: a rule matches the event and the queue buffers it until the summarizer processes it. Publishing a completion event lets any team subscribe with its own rule, without changing the summarizer.
  options:
    a:
      en: |-
        A synchronous call makes the loan system depend on and wait for the summarizer.
    d:
      en: |-
        Writing into each team's database couples the summarizer to every consumer; each new team requires a summarizer change.
    e:
      en: |-
        Logs aren't an integration interface; polling them is fragile and slow.
references:
  - title: "Amazon EventBridge event patterns - Amazon EventBridge"
    url: https://docs.aws.amazon.com/eventbridge/latest/userguide/eb-event-patterns.html
