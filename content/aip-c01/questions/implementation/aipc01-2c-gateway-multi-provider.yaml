id: aipc01-2c-gateway-multi-provider
objective: "2.3.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An enterprise has dozens of internal applications that call models on Amazon Bedrock, on Amazon SageMaker AI endpoints, and from external model providers, each with a different SDK and its own stored credentials. The platform team wants one OpenAI-compatible API in front of all providers, centrally stored provider credentials, and usage tracking, based on published AWS guidance.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Deploy the AWS multi-provider generative AI gateway guidance, which runs LiteLLM on Amazon ECS or Amazon EKS.
    - id: b
      text:
        en: |-
          Build an Amazon Bedrock flow for each application, and call the external providers from prompt nodes in the flow.
    - id: c
      text:
        en: |-
          Store each provider's API key in the environment variables of every application, and share the request code in a common library.
    - id: d
      text:
        en: |-
          Deploy Amazon Q Business as a single front end, and connect each application to it through custom plugins.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      The AWS guidance provides an OpenAI API-compatible gateway based on LiteLLM that runs on Amazon ECS with AWS Fargate or on Amazon EKS behind an ALB. It reaches Amazon Bedrock, SageMaker AI and external providers, keeps provider credentials in AWS Secrets Manager, and adds usage tracking and governance controls.
  options:
    b:
      en: |-
        Prompt nodes in Amazon Bedrock Flows run Bedrock models; a flow per application does not create one OpenAI-compatible API in front of external providers.
    c:
      en: |-
        Keys spread across applications defeat central credential management and give no central usage tracking.
    d:
      en: |-
        Amazon Q Business is closed to new customers since July 30, 2026, and it is an assistant for business users, not a model gateway for applications.
references:
  - title: "Guidance for Multi-Provider Generative AI Gateway on AWS"
    url: https://docs.aws.amazon.com/solutions/multi-provider-generative-ai-gateway-on-aws/
