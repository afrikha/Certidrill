id: aipc01-2c-gateway-invocation-logging-s3
objective: "2.3.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company's central GenAI gateway calls Amazon Bedrock with the `Converse` API for all internal applications. For audit, the company must keep the complete prompt and response of every call, including image inputs and document prompts that are often larger than 100 KB. Auditors query the records with Amazon Athena. The company wants the LEAST development effort.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Enable model invocation logging with a CloudWatch Logs destination only, and export the log group to Amazon S3 for Athena.
    - id: b
      text:
        en: |-
          Create an AWS CloudTrail trail with data events for Amazon Bedrock, and query the trail's log files in S3 with Athena.
    - id: c
      text:
        en: |-
          Enable model invocation logging with an S3 destination in the same account and Region, and query the delivered logs with Athena.
    - id: d
      text:
        en: |-
          Add code to the gateway that writes each prompt and response to CloudWatch Logs, and subscribe the log group to Amazon S3.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      Model invocation logging captures the input and output of every `Converse` call. With an S3 destination, JSON bodies up to 100 KB are inline and binary data or larger bodies are stored as separate objects, so nothing is truncated, and the S3 data can be queried with Athena.
  options:
    a:
      en: |-
        A CloudWatch Logs event holds bodies up to 100 KB; binary data and larger bodies need the S3 large-data delivery, so complete records would be missing.
    b:
      en: |-
        CloudTrail records API activity for audit, not the complete prompt and response bodies of each call.
    d:
      en: |-
        Custom logging code is more development effort than the built-in invocation logging, and it must handle large and binary payloads itself.
references:
  - title: "Monitor model invocation using CloudWatch Logs and Amazon S3 - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/model-invocation-logging.html
