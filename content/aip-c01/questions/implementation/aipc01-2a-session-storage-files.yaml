id: aipc01-2a-session-storage-files
objective: "2.1.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A software company runs a coding agent on Amazon Bedrock AgentCore Runtime. During a conversation, the agent clones a repository, writes intermediate files to a working directory, and edits them over many turns. Developers often pause for an hour or more, sometimes until the next day, and then continue the same conversation with the same session ID. When they return, the working directory is empty and the agent must clone and rebuild everything again. The company wants the files to survive these pauses without changing how the agent code reads and writes files.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Store the content of each intermediate file as an event in AgentCore Memory short-term memory, and list the events of the session when the conversation resumes.
    - id: b
      text:
        en: |-
          Configure session storage for the agent runtime with the working directory as the mount path so that the files persist across stop and resume cycles.
    - id: c
      text:
        en: |-
          Configure a SummarizingConversationManager that keeps the content of the files in the conversation history so that the agent can rewrite them after a pause.
    - id: d
      text:
        en: |-
          Send a keep-alive invocation every 10 minutes with the same session ID so that the session never becomes idle while the developer is away.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      A Runtime session is stopped after 15 minutes of inactivity by default, and the microVM's memory and disk are ephemeral. Session storage provides a persistent directory at a configured mount path whose files survive stop and resume cycles, so the agent keeps using ordinary file operations. The next invocation with the same session ID gets new compute with the stored files.
  options:
    a:
      en: |-
        AgentCore Memory stores conversation events and extracted insights, not a working file system. The agent code would have to be changed to serialize and restore files, which the company wants to avoid.
    c:
      en: |-
        Keeping whole files in the message history inflates every prompt and still requires the agent to recreate the files on disk after each pause.
    d:
      en: |-
        A session also ends when it reaches its maximum lifetime of 8 hours by default, so overnight pauses would still lose the files, and the keep-alive calls add cost without making the files durable.
references:
  - title: Use isolated sessions for agents - Amazon Bedrock AgentCore
    url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/runtime-sessions.html
