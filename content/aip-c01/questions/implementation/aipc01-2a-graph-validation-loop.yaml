id: aipc01-2a-graph-validation-loop
objective: "2.1.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A consulting company builds a report generator with Strands Agents. A research agent gathers data, a writer agent drafts the report, and a reviewer agent checks the draft against a compliance checklist. When the reviewer rejects a draft, the draft must go back to the writer with the reviewer's comments, and after three rejections the process must stop and flag the report for a human. The execution path must be defined in code so that the agents cannot skip the review step, and the whole run must stop if it exceeds 20 minutes.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Create a Strands swarm with the three agents so that they hand off the task to one another through shared context, and set an execution timeout on the swarm.
    - id: b
      text:
        en: |-
          Create an orchestrator agent that calls the research, writer, and reviewer agents as tools, and instruct it in the system prompt to repeat the writing step at most three times.
    - id: c
      text:
        en: |-
          Deploy each agent as a separate A2A server on AgentCore Runtime, and let the research agent discover the other agents through their Agent Cards and delegate tasks to them.
    - id: d
      text:
        en: |-
          Create a Strands graph with the three agents as nodes, a conditional edge from the reviewer back to the writer that checks the verdict and a rejection counter, and an execution timeout.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      In the graph pattern, the developer defines the nodes and edges, and conditional edges follow a predicate written in code that can inspect the reviewer's output or application state, so the review step cannot be skipped. Graphs support cycles for validation loops, and an execution timeout bounds the whole run.
  options:
    a:
      en: |-
        In a swarm, agents hand off tasks autonomously and the path emerges from the task, so the code does not guarantee that every draft goes through review.
    b:
      en: |-
        With agents as tools, the orchestrator model decides which specialist to call; a limit written in the system prompt is not enforced by code.
    c:
      en: |-
        A2A connects agents running as separate services, but the research agent would still decide the delegation path itself, and the separate deployments add overhead without enforcing the loop.
references:
  - title: Strands Agents - AWS Prescriptive Guidance
    url: https://docs.aws.amazon.com/prescriptive-guidance/latest/agentic-ai-frameworks/strands-agents.html
