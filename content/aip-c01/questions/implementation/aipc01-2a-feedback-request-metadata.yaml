id: aipc01-2a-feedback-request-metadata
objective: "2.1.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company runs an internal assistant that calls the Amazon Bedrock Converse API, and Amazon Bedrock model invocation logging delivers every request and response to Amazon S3. Employees rate answers and submit corrections through an Amazon API Gateway endpoint, and a Lambda function stores each rating in Amazon DynamoDB with the conversation ID and turn number. Analysts must join each rating with the exact prompt and response that produced it, including the retrieved context, even when many conversations run at the same time. The company wants the LEAST development effort.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Pass the conversation ID and turn number in the requestMetadata field of each Converse request, and join the ratings with the invocation logs on these keys.
    - id: b
      text:
        en: |-
          Add the conversation ID and turn number to the text of the system prompt, and search the invocation logs for that text when joining the ratings.
    - id: c
      text:
        en: |-
          Join each rating with the invocation log entry whose timestamp is closest to the time when the answer was displayed to the employee.
    - id: d
      text:
        en: |-
          Have the web client send the prompt that the user typed and the displayed answer with each rating, and store them in the DynamoDB item.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      The requestMetadata field of Converse holds up to 16 key-value pairs that you can use to filter invocation logs. Tagging each request with the conversation ID and turn number gives an exact key to join the ratings with the logged prompt, retrieved context, and response.
  options:
    b:
      en: |-
        Text in the system prompt is sent to the model, adds tokens, can influence the answer, and must be parsed out of free text instead of read from a dedicated field.
    c:
      en: |-
        With many concurrent conversations, timestamps cannot identify the right request reliably.
    d:
      en: |-
        The client does not see the system prompt or the retrieved context, so the stored data is not the exact prompt that produced the answer.
references:
  - title: Converse - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/APIReference/API_runtime_Converse.html
