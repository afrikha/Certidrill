id: aipc01-2b-app-api-destination-crm
objective: "2.3.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company generates account summaries with Amazon Bedrock and publishes a SummaryReady event to an Amazon EventBridge event bus for each one. Each summary must be posted to a SaaS CRM's HTTPS endpoint, which requires OAuth client credentials and answers within one second. Failed deliveries must be retried, and the company wants no custom code for delivery or credential handling.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Target an API destination for the CRM endpoint from an EventBridge rule, with a connection that holds the OAuth client credentials and a dead-letter queue.
    - id: b
      text:
        en: |-
          Create an EventBridge rule that invokes an AWS Lambda function, which reads the client secret from an environment variable and posts each summary to the CRM.
    - id: c
      text:
        en: |-
          Subscribe the CRM endpoint to an Amazon SNS topic through an HTTPS subscription whose URL includes the OAuth client secret.
    - id: d
      text:
        en: |-
          Send the events to an Amazon SQS queue, and ask the CRM vendor to poll the queue and import each summary.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      API destinations are HTTPS endpoints invoked as targets of event bus rules. Their connection defines the authorization method and credentials, which EventBridge stores in a secret in AWS Secrets Manager. EventBridge retries timeouts and 429 and 5xx responses, and a dead-letter queue keeps events whose retries are exhausted.
  options:
    b:
      en: |-
        The Lambda function is custom delivery code, and a secret in an environment variable is custom credential handling.
    c:
      en: |-
        A secret in a URL is exposed, and an SNS HTTPS subscription doesn't perform an OAuth client credentials flow.
    d:
      en: |-
        The vendor would have to build polling against the company's queue, and the CRM has no such feature.
references:
  - title: "API destinations as targets in Amazon EventBridge - Amazon EventBridge"
    url: https://docs.aws.amazon.com/eventbridge/latest/userguide/eb-api-destinations.html
