id: aipc01-2d-logs-insights-feature-tokens
objective: "2.5.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company's application calls the Amazon Bedrock Converse API for several features and passes requestMetadata with a feature key on every call. Model invocation logging delivers the logs to CloudWatch Logs. After a prompt template change, inference costs rose, and the team suspects that the prompts of one feature have become longer.

    Which CloudWatch Logs Insights query will show the average number of input tokens for each feature, hour by hour?
body:
  options:
    - id: a
      text:
        en: 'fields @timestamp | filter operation = "Converse" | stats count(*) by modelId, bin(1h)'
    - id: b
      text:
        en: 'fields identity.arn | stats max(output.outputTokenCount) as maxOut by identity.arn'
    - id: c
      text:
        en: 'stats avg(input.inputTokenCount) as avgIn by requestMetadata.feature, bin(1h)'
    - id: d
      text:
        en: 'filter @message like /feature/ | pattern @message | sort @sampleCount desc'
answer: { optionId: c }
explanation:
  correct:
    en: "Invocation log records contain input.inputTokenCount and the caller-supplied requestMetadata. Averaging the input token count grouped by the feature key and by hour shows which feature's prompts grew after the template change."
  options:
    a:
      en: "This counts calls per model and hour; it doesn't measure prompt length or separate the features."
    b:
      en: "This shows the largest output per IAM principal, not input tokens per feature over time."
    d:
      en: "The pattern command clusters log messages into recurring text structures; it doesn't compute token averages per feature."
references:
  - title: "Monitor model invocation using CloudWatch Logs and Amazon S3 - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/model-invocation-logging.html
  - title: "Converse - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/APIReference/API_runtime_Converse.html
