id: aipc01-2b-llm-tensor-parallelism
objective: "2.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company wants to self-host an open-weight LLM on Amazon SageMaker AI. In 16-bit precision, the weights need about 140 GB of accelerator memory, plus room for the KV cache. The selected instance type has 8 GPUs with 80 GB of memory each. The company must not reduce the model's precision.

    How should the company deploy the model?
body:
  options:
    - id: a
      text:
        en: |-
          Increase VolumeSizeInGB to 512 so that the full model can be loaded onto the instance.
    - id: b
      text:
        en: |-
          Quantize the weights to INT4-AWQ so that the whole model fits in the memory of one GPU.
    - id: c
      text:
        en: |-
          Use a large model inference (LMI) container with tensor parallelism across the instance's GPUs.
    - id: d
      text:
        en: |-
          Deploy the model as an inference component with MinMemoryRequiredInMb set to 160,000 on one GPU.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      No single 80 GB GPU can hold 140 GB of weights plus the KV cache, so the model must be split across GPUs. LMI containers are AWS-provided containers for LLM inference that support tensor parallelism, which shards the model's weights across the instance's GPUs without changing precision.
  options:
    a:
      en: |-
        VolumeSizeInGB sizes the storage for downloaded artifacts; it adds no GPU memory.
    b:
      en: |-
        Quantization lowers precision and can reduce accuracy, which the company forbids.
    d:
      en: |-
        MinMemoryRequiredInMb reserves memory for a component copy; it can't make one GPU hold more than its 80 GB.
references:
  - title: "The large model inference (LMI) container documentation - Amazon SageMaker AI"
    url: https://docs.aws.amazon.com/sagemaker/latest/dg/large-model-inference-container-docs.html
  - title: "Inference optimization for Amazon SageMaker AI models - Amazon SageMaker AI"
    url: https://docs.aws.amazon.com/sagemaker/latest/dg/model-optimize.html
