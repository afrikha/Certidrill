id: aipc01-2d-devprod-q-transition
objective: "2.5.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A financial services company has used Amazon Q Developer Pro in its developers' IDEs since 2025 to generate and refactor code for its Amazon Bedrock applications. In November 2026, the company plans its developer tooling for the next two years. It must keep a supported AI coding assistant in the IDE throughout that period and keep onboarding new developers.

    Which plan will meet these requirements?
body:
  options:
    - { id: a, text: { en: "Keep the Q Developer IDE plugins for now, and move all developers to Kiro before the plugins' end of support on April 30, 2027." } }
    - { id: b, text: { en: "Keep the Q Developer IDE plugins for the whole period, because the end-of-support announcement applies only to Free Tier users." } }
    - { id: c, text: { en: "Create a Q Developer Free Tier account for each new developer, and move everyone to Free Tier before the Pro subscription ends." } }
    - { id: d, text: { en: "Replace the IDE plugins with Amazon Q Developer in chat applications, which provides the same code generation in Slack." } }
answer: { optionId: a }
explanation:
  correct:
    en: "Existing Q Developer users keep their IDE plugins until April 30, 2027, when the IDE plugins and paid subscriptions reach end of support. Kiro is the successor AWS recommends: it covers agentic coding, inline chat, and MCP support and adds specs, hooks, and steering, so migrating before that date keeps a supported assistant."
  options:
    b:
      en: "The end of support covers the IDE plugins and paid subscriptions, so Pro users lose support on April 30, 2027."
    c:
      en: "New Free Tier accounts can't be created since May 15, 2026, and Free Tier doesn't avoid the IDE plugins' end of support."
    d:
      en: "Q Developer in chat applications remains supported, but it works in Slack and Microsoft Teams, not as a coding assistant in the IDE."
references:
  - title: "Amazon Q Developer end-of-support announcement | AWS DevOps & Developer Productivity Blog"
    url: https://aws.amazon.com/blogs/devops/amazon-q-developer-end-of-support-announcement/
