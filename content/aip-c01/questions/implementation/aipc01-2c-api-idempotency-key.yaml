id: aipc01-2c-api-idempotency-key
objective: "2.5.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A mobile app submits generation jobs with `POST /jobs` to an API Gateway REST API, which writes each request to an Amazon SQS queue that a Lambda function processes with a model on Amazon Bedrock. When the network is slow, the app retries the `POST`, and the company pays for duplicate generations of the same request. The company wants client retries to be safe.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Disable automatic retries in the mobile app so that each job request is sent to the API only once.
    - id: b
      text:
        en: |-
          Increase the API Gateway integration timeout so that the app receives the response before it retries.
    - id: c
      text:
        en: |-
          Reduce the visibility timeout of the queue so that duplicate messages are detected and processed faster.
    - id: d
      text:
        en: |-
          Send an idempotency key with each job, and have the worker skip keys already recorded in DynamoDB.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      An idempotency key identifies one logical request across all its retries, and a conditional write lets only the first message with that key start a generation. Lambda processes SQS messages at least once, so idempotent processing also protects against duplicate deliveries.
  options:
    a:
      en: |-
        Without retries, requests that really fail on a slow network are lost.
    b:
      en: |-
        A longer timeout does not stop the app from retrying after network errors.
    c:
      en: |-
        A shorter visibility timeout makes messages reappear sooner and causes more duplicate processing.
references:
  - title: "Using Lambda with Amazon SQS - AWS Lambda"
    url: https://docs.aws.amazon.com/lambda/latest/dg/with-sqs.html
