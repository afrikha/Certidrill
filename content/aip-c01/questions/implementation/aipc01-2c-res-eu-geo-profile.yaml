id: aipc01-2c-res-eu-geo-profile
objective: "2.3.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A bank runs an internal assistant on Amazon Bedrock in the eu-central-1 Region. Regulators require that prompts and responses are processed only in AWS Regions located in the EU. At month-end, the assistant receives traffic peaks that exceed the on-demand throughput available in a single Region. The bank does not want to commit to purchased capacity.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Invoke the model through the global cross-Region inference profile so that Amazon Bedrock can send peak requests to any commercial Region.
    - id: b
      text:
        en: |-
          Purchase Provisioned Throughput for the model in eu-central-1 with a one-month commitment, and send all requests to the provisioned model.
    - id: c
      text:
        en: |-
          Invoke the model through the EU geographic cross-Region inference profile so that Amazon Bedrock routes requests only to Regions in the EU.
    - id: d
      text:
        en: |-
          Create an application inference profile from the foundation model in eu-central-1, and use its ARN as the model ID for all requests.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      A geographic cross-Region inference profile routes requests among the Regions of one geography, such as the EU, so processing stays inside that boundary while the other Regions absorb the peaks. It has no additional routing cost and requires no capacity commitment.
  options:
    a:
      en: |-
        The global profile can route requests to any supported commercial Region worldwide, which breaks the requirement to process data only in EU Regions.
    b:
      en: |-
        Provisioned Throughput with a one-month term is a capacity commitment, which the bank does not want.
    d:
      en: |-
        An application inference profile created from a single-Region foundation model tracks usage and cost in that Region; it does not add capacity from other Regions.
references:
  - title: "Geographic cross-Region inference - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/geographic-cross-region-inference.html
  - title: "Create an application inference profile - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/inference-profiles-create.html
