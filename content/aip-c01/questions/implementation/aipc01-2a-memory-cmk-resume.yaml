id: aipc01-2a-memory-cmk-resume
objective: "2.1.1"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    A healthcare company runs a patient-intake agent on Amazon Bedrock AgentCore Runtime. Patients often stop a conversation and resume it the next day, and the agent must reload the earlier turns of that conversation when it resumes. A security policy requires that all stored conversation data, including any attribute that contains patient identifiers, be encrypted with a customer managed AWS KMS key.

    Which combination of actions will meet these requirements? (Choose two.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Create the AgentCore Memory resource with a customer managed KMS key as its encryption key.
    - id: b
      text:
        en: |-
          Attach the patient's medical record number to each event as event metadata so that ListEvents can filter the conversation by patient.
    - id: c
      text:
        en: |-
          Write each turn as an event with CreateEvent under the conversation's session ID, and call ListEvents for that session when the conversation resumes.
    - id: d
      text:
        en: |-
          Pass the same runtimeSessionId when the patient resumes the next day so that the agent finds the earlier turns in the memory of the Runtime session.
    - id: e
      text:
        en: |-
          Store the turns in the Strands agent's message history with the default conversation manager, and rely on the history to reload the turns the next day.
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |-
      AgentCore Memory short-term memory stores each turn as an event under a session ID, and ListEvents returns the conversation history so the agent can reload it after a pause. CreateMemory accepts the ARN of a KMS key that encrypts the memory data, which meets the customer managed key requirement.
  options:
    b:
      en: |-
        Event metadata is not encrypted with the customer managed key, and the documentation advises against storing sensitive content in it, so patient identifiers must not go there.
    d:
      en: |-
        A Runtime session stops after 15 minutes of inactivity by default, and its memory and disk are ephemeral, so the turns are gone the next day.
    e:
      en: |-
        The agent's message history lives in the running session only; it is not persisted for a conversation that resumes the next day on new compute.
references:
  - title: Memory types - Amazon Bedrock AgentCore
    url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/memory-types.html
  - title: CreateMemory - Amazon Bedrock AgentCore Control Plane
    url: https://docs.aws.amazon.com/bedrock-agentcore-control/latest/APIReference/API_CreateMemory.html
