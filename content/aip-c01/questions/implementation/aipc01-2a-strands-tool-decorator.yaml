id: aipc01-2a-strands-tool-decorator
objective: "2.1.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A developer is building a new agent with Strands Agents in Python. The company already has well-documented Python functions with type hints that check stock levels and calculate shipping costs. The developer wants to expose these functions to the agent as tools with standardized definitions and the LEAST effort.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Write an OpenAPI schema for each function, and attach the schemas as action groups to an Amazon Bedrock agent that the Strands agent calls.
    - id: b
      text:
        en: |-
          Decorate each function with @tool so that its docstring and type hints become the tool description and schema, and pass the functions to the agent.
    - id: c
      text:
        en: |-
          Write a JSON tool specification for each function by hand, and paste the specifications into the agent's system prompt.
    - id: d
      text:
        en: |-
          Store a description of each function as a prompt in Amazon Bedrock Prompt Management, and load the prompts when the agent starts.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      Strands Agents turns a Python function decorated with @tool into a tool: the docstring becomes the description and the type hints define the input schema. The developer passes the functions to the agent, and the model-driven loop calls them as needed.
  options:
    a:
      en: |-
        Amazon Bedrock Agents (now Agents Classic) has been closed to new customers since July 30, 2026, and the OpenAPI schemas would be extra work.
    c:
      en: |-
        Tool specifications in a system prompt are only text: the model cannot return structured tool requests for them, and writing them by hand is more effort.
    d:
      en: |-
        Prompt Management stores and versions prompts; it does not register callable tools with an agent.
references:
  - title: Strands Agents - AWS Prescriptive Guidance
    url: https://docs.aws.amazon.com/prescriptive-guidance/latest/agentic-ai-frameworks/strands-agents.html
