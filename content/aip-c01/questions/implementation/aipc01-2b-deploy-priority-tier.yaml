id: aipc01-2b-deploy-priority-tier
objective: "2.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An online retailer runs a checkout assistant on Amazon Bedrock on-demand inference. During a few flash sales each year, the assistant must respond as fast as possible because it is part of the payment flow. Outside those events, traffic is low. The model supports every Amazon Bedrock service tier. The company does not want a capacity reservation and wants the change limited to the inference request.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Set the service_tier field to priority in the assistant's inference requests.
    - id: b
      text:
        en: |-
          Contact the AWS account team to reserve tokens-per-minute capacity in the Reserved tier.
    - id: c
      text:
        en: |-
          Set the service_tier field to flex in the assistant's inference requests.
    - id: d
      text:
        en: |-
          Purchase Provisioned Throughput with a one-month commitment before each flash sale.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      The Priority tier delivers the fastest response times for a premium over standard on-demand pricing, requires no prior reservation, and is selected per request by setting service_tier to priority. Priority requests are served ahead of Standard and Flex requests.
  options:
    b:
      en: |-
        The Reserved tier is a 1-month or 3-month capacity reservation arranged through the account team, which the company doesn't want.
    c:
      en: |-
        The Flex tier is discounted for workloads that tolerate longer processing times, the opposite of the requirement.
    d:
      en: |-
        Provisioned Throughput is a capacity purchase billed hourly for the whole term, which is the reservation the company wants to avoid.
references:
  - title: "Service tiers for optimizing performance and cost - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/service-tiers-inference.html
