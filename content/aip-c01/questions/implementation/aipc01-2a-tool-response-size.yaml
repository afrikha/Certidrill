id: aipc01-2a-tool-response-size
objective: "2.1.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A telecom company's support assistant calls a get_customer_account tool through the Amazon Bedrock Converse API. The Lambda function behind the tool returns the full customer record as JSON, including several years of invoices and call records, about 150,000 tokens per call. Input token costs are high, and long conversations now fail when they exceed the model's context window. The assistant only needs the plan, the current balance, and the last three invoices to answer questions.

    Which solution will meet these requirements MOST cost-effectively?
body:
  options:
    - id: a
      text:
        en: |-
          Change the Lambda function to return only the plan, the current balance, and a summary of the last three invoices in the tool result.
    - id: b
      text:
        en: |-
          Switch to a model with a larger context window so that the full customer record fits in every conversation.
    - id: c
      text:
        en: |-
          Increase the maximum number of output tokens in the inference configuration so that the model can process the full record.
    - id: d
      text:
        en: |-
          Compress the customer record and return it as a Base64 string in the tool result so that it uses fewer characters.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      A tool result becomes part of the conversation that is sent to the model on every later turn, so large results drive input token costs and fill the context window. Returning only the fields the assistant needs keeps each request small and cheap while still answering the questions.
  options:
    b:
      en: |-
        A larger context window avoids the failure, but every turn still sends about 150,000 tokens, so costs stay high or rise.
    c:
      en: |-
        Output tokens limit the length of the model's answer; they do not reduce the size of the input that causes the cost and the context overflow.
    d:
      en: |-
        The model cannot use compressed Base64 data as meaningful content, and encoded text does not reliably reduce the token count.
references:
  - title: Use a tool to complete an Amazon Bedrock model response - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/tool-use.html
  - title: Converse - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/APIReference/API_runtime_Converse.html
