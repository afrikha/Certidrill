id: aipc01-2b-ent-private-integration-alb
objective: "2.3.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A distributor's order-status service runs on Amazon EC2 instances behind an internal Application Load Balancer in a VPC and already returns JSON. A GenAI assistant must call the service as a tool through a managed REST API that applies throttling and IAM authorization. The load balancer must stay internal, and the company does not want to add compute.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Make the load balancer internet-facing, and restrict its security group to the IP address ranges of Amazon API Gateway.
    - id: b
      text:
        en: |-
          Create a Lambda function in the VPC that proxies requests to the load balancer, and expose it through a function URL.
    - id: c
      text:
        en: |-
          Create an Amazon EventBridge API destination for the service, and invoke it from the assistant through an event bus rule that matches each tool request.
    - id: d
      text:
        en: |-
          Create an API Gateway REST API with IAM authorization and a private integration through a VPC link V2 to the internal load balancer.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      A private integration lets a REST API reach resources inside a VPC: an HTTP proxy integration that uses a VPC link V2 targets an internal Application Load Balancer or Network Load Balancer. The REST API adds IAM authorization and throttling, the load balancer stays internal, and no compute is added.
  options:
    a:
      en: |-
        An internet-facing load balancer exposes the service publicly, which the requirement forbids.
    b:
      en: |-
        A proxy function is additional compute, and a function URL doesn't provide the throttling of a managed REST API.
    c:
      en: |-
        An API destination is invoked as the target of an event bus rule or pipe; it doesn't give the assistant a synchronous request-response API with IAM authorization and throttling.
references:
  - title: "Set up a private integration - Amazon API Gateway"
    url: https://docs.aws.amazon.com/apigateway/latest/developerguide/set-up-private-integration.html
