id: aipc01-2d-kiro-spec-feature
objective: "2.5.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A team uses Kiro to build a new document-ingestion module for a retrieval-augmented generation (RAG) application. The tech lead wants the agent to first write user stories with acceptance criteria and a technical design for the team to review, and only then implement the module as a list of trackable tasks.

    Which Kiro feature should the team use?
body:
  options:
    - { id: a, text: { en: "A feature spec, which produces requirements, design, and tasks files" } }
    - { id: b, text: { en: "An agent hook that runs a prompt every time a file is saved" } }
    - { id: c, text: { en: "A steering file that is included in every interaction" } }
    - { id: d, text: { en: "An MCP server that exposes the team's issue tracker" } }
answer: { optionId: a }
explanation:
  correct:
    en: "A Kiro spec turns an idea into requirements (user stories and acceptance criteria), a design (architecture, data flow, error handling, testing strategy), and a list of discrete, trackable tasks. Feature specs let the team review requirements and design before any code is written."
  options:
    b:
      en: "Hooks run commands or prompts automatically on events; they don't produce reviewed requirements, a design, or a task plan."
    c:
      en: "Steering files give persistent project context and conventions; they don't plan a feature."
    d:
      en: "An MCP server gives the agent tools and data; it doesn't create a reviewed plan for the module."
references:
  - title: "Specs - Features - Docs - Kiro"
    url: https://kiro.dev/docs/specs/
