id: aipc01-2d-flows-analyst-workflow
objective: "2.5.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A retail company's support team wants a generative AI workflow that classifies each incoming customer email, retrieves the relevant policy passages from an Amazon Bedrock knowledge base, and drafts a reply with a foundation model. Business analysts on the team must be able to build and change the workflow themselves without writing code. The support application must call a stable, versioned deployment of the workflow.

    Which solution will meet these requirements?
body:
  options:
    - { id: a, text: { en: "Write a Python Lambda function that calls the Retrieve and Converse APIs in sequence, and publish a new function version for each change." } }
    - { id: b, text: { en: "Build a Strands Agents agent with classification and retrieval tools, and deploy the agent to Amazon Bedrock AgentCore Runtime." } }
    - { id: c, text: { en: "Build an Amazon Bedrock Flows flow with prompt, condition, and knowledge base nodes, publish versions, and invoke the flow through an alias." } }
    - { id: d, text: { en: "Create an AWS Amplify generation route for each step, and chain the three routes from the code of the React front end." } }
answer: { optionId: c }
explanation:
  correct:
    en: "Amazon Bedrock Flows (the exam guide's Prompt Flows) is a visual builder that links prompts, models, knowledge bases, and AWS services without orchestration code. Analysts edit the working draft in the console, publish an immutable version, and the application calls InvokeFlow on an alias that points to that version."
  options:
    a:
      en: "A Lambda function is code: every change to the workflow needs a developer, which fails the no-code requirement for the analysts."
    b:
      en: "A Strands agent is written in Python or TypeScript, and the model decides the steps at runtime; analysts can't change it without code, and the steps here are fixed."
    d:
      en: "Amplify AI kit routes are defined in TypeScript and chained in front-end code, so analysts can't build or change the workflow without writing code."
references:
  - title: "Build an end-to-end generative AI workflow with Amazon Bedrock Flows - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/flows.html
  - title: "Node types for your flow - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/flows-nodes.html
