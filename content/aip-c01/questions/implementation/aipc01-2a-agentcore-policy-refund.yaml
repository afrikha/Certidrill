id: aipc01-2a-agentcore-policy-refund
objective: "2.1.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A travel company has several agents, built by different teams with different frameworks, that call a refund tool through an Amazon Bedrock AgentCore gateway. A new rule says that a refund tool call with an amount greater than 500 USD must be blocked. The rule must be enforced deterministically outside the code of the agents, must evaluate the input parameters of each tool call, and every decision must be auditable.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Configure an Amazon Bedrock guardrail with a denied topic for large refunds, and ask every team to apply the guardrail to the model calls of its agent.
    - id: b
      text:
        en: |-
          Add a deny statement to the IAM role of the gateway that blocks lambda:InvokeFunction on the refund function when the refund amount is greater than 500.
    - id: c
      text:
        en: |-
          Add an instruction to the system prompt of every agent that refunds above 500 USD must not be requested, and review the agents' traces each week.
    - id: d
      text:
        en: |-
          Create an AgentCore Policy engine with a Cedar policy that forbids the refund tool when the amount input exceeds 500, and associate it with the gateway.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      Policy in AgentCore intercepts the traffic that goes through a gateway and evaluates each tool call against deterministic Cedar policies before the tool runs. Policies can permit or forbid a call based on the principal, the tool, and its input parameters, enforcement happens outside the agent code, and decisions are logged in CloudWatch.
  options:
    a:
      en: |-
        A denied topic is a probabilistic classifier of text that depends on each team applying it; it does not evaluate the amount in a tool call deterministically.
    b:
      en: |-
        IAM policies cannot inspect the parameters inside a tool call's payload, so they cannot compare the refund amount with 500.
    c:
      en: |-
        A prompt instruction is not enforced, and a weekly review only finds violations after the refunds are made.
references:
  - title: "Policy in Amazon Bedrock AgentCore: Control Agent Interactions - Amazon Bedrock AgentCore"
    url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/policy.html
