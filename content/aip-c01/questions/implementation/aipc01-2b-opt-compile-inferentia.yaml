id: aipc01-2b-opt-compile-inferentia
objective: "2.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company self-hosts a small open-weight text model on Amazon SageMaker AI GPU instances for a high-volume extraction task. It wants to lower the cost per request by moving the model to AWS Inferentia instances, keep the model's accuracy unchanged, and avoid just-in-time compilation delays when new instances start.

    Which SageMaker AI inference optimization technique should the company use?
body:
  options:
    - id: a
      text:
        en: |-
          Quantization of the weights to INT4-AWQ before deployment to the new instances.
    - id: b
      text:
        en: |-
          Speculative decoding with the pre-built draft model on the new instances.
    - id: c
      text:
        en: |-
          Fast model loading with weights pre-sharded for the instance's accelerators.
    - id: d
      text:
        en: |-
          Compilation of the model for Inferentia with the AWS Neuron SDK.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      Compilation optimizes a model for the chosen hardware without loss of accuracy, including AWS Trainium and Inferentia instances through the AWS Neuron SDK. Because the compiled weights don't need just-in-time compilation when the model deploys to a new instance, deployment time and auto scaling latency also drop.
  options:
    a:
      en: |-
        Quantization can make the model less accurate than the source model, which the company doesn't accept.
    b:
      en: |-
        Speculative decoding reduces generation latency with a draft model; it doesn't prepare the model for Inferentia hardware.
    c:
      en: |-
        Fast model loading streams pre-sharded weights onto GPUs to deploy faster; it doesn't optimize the model for Inferentia.
references:
  - title: "Inference optimization for Amazon SageMaker AI models - Amazon SageMaker AI"
    url: https://docs.aws.amazon.com/sagemaker/latest/dg/model-optimize.html
