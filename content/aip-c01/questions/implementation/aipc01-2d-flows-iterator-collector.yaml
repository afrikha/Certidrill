id: aipc01-2d-flows-iterator-collector
objective: "2.5.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A hotel chain sends a JSON array of up to 50 guest reviews to a flow in Amazon Bedrock Flows. Each review must be analyzed separately by the same prompt, which extracts the guest's complaints. A second prompt must then write one summary from all the extracted complaints.

    Which flow design will meet these requirements?
body:
  options:
    - { id: a, text: { en: "Connect the input node to a DoWhile loop node that contains the extraction prompt node, and connect the loop output to the summary prompt node." } }
    - { id: b, text: { en: "Connect the input node to an iterator node, then the extraction prompt node, then a collector node, and then the summary prompt node." } }
    - { id: c, text: { en: "Connect the input node to a condition node with one branch per review, each branch with its own extraction prompt node and output node." } }
    - { id: d, text: { en: "Pass the whole array to the extraction prompt node as one variable, then connect that node to a collector node and the summary prompt node." } }
answer: { optionId: b }
explanation:
  correct:
    en: "An iterator node takes an array and sends each item, one at a time, to the downstream nodes, so the extraction prompt runs once per review. A collector node gathers the iterated results back into an array, which the summary prompt node then receives as a single input."
  options:
    a:
      en: "A DoWhile loop repeats a node sequence while a condition is true; it doesn't hand out array items, and its maxIterations default is 10, below the 50 reviews."
    c:
      en: "A condition node routes data to different paths based on conditions; it can't create one branch per array item, and this design never produces a combined summary."
    d:
      en: "A single prompt over the whole array doesn't analyze each review separately, and a collector node needs the item and size outputs of an iterator node."
references:
  - title: "Node types for your flow - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/flows-nodes.html
