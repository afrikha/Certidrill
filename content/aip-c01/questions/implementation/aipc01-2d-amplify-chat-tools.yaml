id: aipc01-2d-amplify-chat-tools
objective: "2.5.2"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    An e-commerce company is adding an assistant to its AWS Amplify Gen 2 React app. Signed-in customers must be able to chat with streamed responses and resume earlier conversations, and no customer may see another customer's conversations. The assistant must answer questions about the customer's own orders, which are stored in an Order model of the app's Amplify data schema, and it must never return another customer's orders.

    Which combination of steps will meet these requirements? (Choose two.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "Define the chat as an AI kit generation route that authorizes all authenticated users, and keep the chat history in the browser's local storage." } }
    - { id: b, text: { en: "Define the chat as an AI kit conversation route with owner-based authorization, and render it with the AIConversation component." } }
    - { id: c, text: { en: "Load all orders into the conversation route's system prompt at deployment time so that the model can answer questions about orders." } }
    - { id: d, text: { en: "Give the conversation route a data tool (a.ai.dataTool) that references the Order model, which uses owner-based authorization." } }
    - { id: e, text: { en: "Grant the conversation handler's IAM role read access to the whole order table, and tell the model to return only the current customer's orders." } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: "A conversation route is a real-time, multi-turn API that streams Bedrock responses and stores conversations and messages in DynamoDB per user; with owner-based authorization, only the owner can read a conversation. A data tool lets the model query the Order model through AWS AppSync, and because the Order model uses owner-based authorization, the model can read only the records of the signed-in customer."
  options:
    a:
      en: "A generation route is a single request-response call without streaming chat or stored history, and local storage doesn't let customers resume conversations from another device."
    c:
      en: "Putting every customer's orders in the system prompt exposes other customers' data to the model and to anyone who extracts the prompt, and the data goes stale after deployment."
    e:
      en: "A broad IAM permission plus a prompt instruction relies on the model's behavior; a prompt injection could return another customer's orders. Authorization must be enforced by the data layer."
references:
  - title: "Build fullstack AI apps in minutes with the new Amplify AI Kit | Front-End Web & Mobile"
    url: https://aws.amazon.com/blogs/mobile/build-fullstack-ai-apps-in-minutes-with-the-new-amplify-ai-kit
