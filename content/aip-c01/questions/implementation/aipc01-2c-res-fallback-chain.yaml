id: aipc01-2c-res-fallback-chain
objective: "2.4.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A US healthcare company calls a model in us-east-1 with an in-Region model ID. During regional capacity peaks, it receives `ServiceUnavailableException` and `ThrottlingException` errors even after retries. The company wants to keep the same model's output whenever possible, to degrade to a cheaper answer only when that fails, and to keep all processing in the US.

    Which combination of steps will meet these requirements? (Choose two.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Invoke the model through the US geographic cross-Region inference profile so that requests can be served from other US Regions.
    - id: b
      text:
        en: |-
          Invoke the model through the global cross-Region inference profile so that requests can be served from any commercial Region.
    - id: c
      text:
        en: |-
          Retry `ValidationException` errors with exponential backoff before falling back to another model.
    - id: d
      text:
        en: |-
          When the profile still fails after retries, send the same `Converse` request to a smaller model that runs in US Regions.
    - id: e
      text:
        en: |-
          Purchase Provisioned Throughput on the US inference profile to reserve capacity for the peaks.
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: |-
      For capacity errors, AWS recommends retries with backoff and cross-Region inference; the US geographic profile adds the capacity of other US Regions and returns the same model's output. Because `Converse` uses one request format, the degraded fallback only changes the model ID.
  options:
    b:
      en: |-
        Global routing can process requests outside the US.
    c:
      en: |-
        A validation error means the request is invalid; retrying it never succeeds.
    e:
      en: |-
        Inference profiles do not support Provisioned Throughput.
references:
  - title: "Troubleshooting Amazon Bedrock API Error Codes - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/troubleshooting-api-error-codes.html
  - title: "Route model inference requests across AWS Regions with cross-Region inference - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/cross-region-inference.html
