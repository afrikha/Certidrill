id: aipc01-2d-kiro-cli-headless
objective: "2.5.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company wants an AI agent to review every pull request of its generative AI application for prompt injection risks and report its findings in the build log. The review must run unattended in AWS CodeBuild. The agent must be able to read files but must not run shell commands or edit code. The company already has Kiro Pro subscriptions, and its security team requires that secrets never appear in plaintext in build specifications.

    Which solution will meet these requirements?
body:
  options:
    - { id: a, text: { en: "Install the Amazon Q Developer IDE plugin in the build image, and run the review in the post_build phase of the buildspec." } }
    - { id: b, text: { en: "Configure a Kiro hook on each developer's computer that reviews files when they are saved, and require a save of every file before a push." } }
    - { id: c, text: { en: "Run kiro-cli chat --no-interactive --trust-all-tools in CodeBuild, with the Kiro API key set as a plaintext environment variable in the buildspec." } }
    - { id: d, text: { en: "Run kiro-cli chat --no-interactive --trust-tools with only file-reading tool IDs in CodeBuild, with KIRO_API_KEY from AWS Secrets Manager." } }
answer: { optionId: d }
explanation:
  correct:
    en: "Kiro CLI headless mode (--no-interactive) runs the agent in CI pipelines and authenticates with an API key in the KIRO_API_KEY environment variable, available to Pro and higher subscribers. With no user to approve tool calls, --trust-tools pre-approves only the listed tool IDs, so the agent can read files but not run commands or edit code."
  options:
    a:
      en: "IDE plugins need an interactive IDE, not a build container; Q Developer IDE plugins also reach end of support on April 30, 2027."
    b:
      en: "Hooks on developers' computers don't run in the pipeline and depend on each developer's setup, so the review isn't guaranteed for every pull request."
    c:
      en: "--trust-all-tools approves every tool call, including shell commands and file edits, and a plaintext key in the buildspec breaks the secrets requirement."
references:
  - title: "Headless mode - CLI - Docs - Kiro"
    url: https://kiro.dev/docs/cli/headless/
