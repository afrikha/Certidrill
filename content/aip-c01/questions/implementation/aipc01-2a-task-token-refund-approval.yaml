id: aipc01-2a-task-token-refund-approval
objective: "2.1.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An airline is building a support agent that proposes refunds. Any refund above 200 USD must be approved by a supervisor in the internal support console before the refund is executed. Supervisors can take up to two days to decide. While a refund waits for a decision, the solution must not consume compute, and the supervisor's decision must resume the process immediately. The airline wants the LEAST operational overhead.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Use an AWS Step Functions Standard workflow with a Task state that sends the proposal and the task token to an Amazon SQS queue with .waitForTaskToken, and have the console call SendTaskSuccess or SendTaskFailure.
    - id: b
      text:
        en: |-
          Use an AWS Step Functions Express workflow with a Task state that sends the proposal and the task token to an Amazon SQS queue with .waitForTaskToken, and have the console call SendTaskSuccess or SendTaskFailure.
    - id: c
      text:
        en: |-
          Store the proposal in an Amazon DynamoDB table, and have a Lambda function poll the item every minute until the supervisor sets its status to approved or rejected.
    - id: d
      text:
        en: |-
          Create an Amazon Augmented AI human review workflow with a private work team of supervisors, and start a human loop for each refund above 200 USD.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      The Wait for Callback pattern pauses the Task state until the task token comes back through SendTaskSuccess or SendTaskFailure, which can take up to the one-year execution limit of a Standard workflow. No compute runs while the workflow waits, and the console call resumes the workflow at once.
  options:
    b:
      en: |-
        Express workflows support only the Request Response integration pattern, so .waitForTaskToken is not available, and they stop after 5 minutes.
    c:
      en: |-
        Polling consumes compute for the whole wait, adds delay between the decision and the refund, and a Lambda function can run for at most 30 minutes, so the polling needs extra scheduling.
    d:
      en: |-
        Amazon Augmented AI has been closed to new customers since July 30, 2026, so it is not an option for a new design.
references:
  - title: Discover service integration patterns in Step Functions - AWS Step Functions
    url: https://docs.aws.amazon.com/step-functions/latest/dg/connect-to-resource.html
