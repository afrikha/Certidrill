id: aipc01-2b-opt-router-quality-threshold
objective: "2.2.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company uses an Amazon Bedrock configured prompt router with Amazon Nova Lite as the fallback model and Amazon Nova Pro as the other model. Costs are higher than planned because many requests are routed to Nova Pro, although reviews show that Nova Lite's answers would have been acceptable for most of them. The company wants fewer requests to go to Nova Pro while still using it for prompts where it is much better.

    What should the company do?
body:
  options:
    - id: a
      text:
        en: |-
          Lower the response quality difference in the router's routing criteria.
    - id: b
      text:
        en: |-
          Make Nova Pro the fallback model and Nova Lite the other model.
    - id: c
      text:
        en: |-
          Send the reviewers' ratings to the router so that it learns which requests Nova Lite handles well.
    - id: d
      text:
        en: |-
          Raise the response quality difference in the router's routing criteria.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      The router switches away from the fallback model only when the other model's predicted response quality is better by more than the response quality difference. Raising this threshold means Nova Pro is chosen only when it is predicted to be much better, so more requests stay on Nova Lite.
  options:
    a:
      en: |-
        A lower threshold lets smaller predicted gains switch requests to Nova Pro, which sends even more traffic to it.
    b:
      en: |-
        With Nova Pro as the anchor, requests stay on the more expensive model by default.
    c:
      en: |-
        Intelligent prompt routing can't adjust its routing decisions based on application-specific performance data.
references:
  - title: "Understanding intelligent prompt routing in Amazon Bedrock - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/prompt-routing.html
