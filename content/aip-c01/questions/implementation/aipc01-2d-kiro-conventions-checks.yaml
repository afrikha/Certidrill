id: aipc01-2d-kiro-conventions-checks
objective: "2.5.4"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A team uses Kiro to build Lambda functions that call Amazon Bedrock. Every change that the agent generates must follow the team's conventions: use the Converse API instead of InvokeModel, apply a standard retry configuration, and write structured logs. In addition, the linter and the prompt regression tests must run automatically every time the agent edits a file. Both configurations must be versioned with the code.

    Which combination of steps will meet these requirements? (Choose two.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "Commit a steering file that describes the conventions to the .kiro/steering/ folder of the repository." } }
    - { id: b, text: { en: "Ask every developer to paste the conventions at the start of each chat request to the agent." } }
    - { id: c, text: { en: "Connect an MCP server that returns the conventions when the agent decides to ask for them." } }
    - { id: d, text: { en: "Add the linter and test commands as tasks in the tasks file of each new feature spec." } }
    - { id: e, text: { en: "Commit a hook to the .kiro/hooks/ folder that runs the linter and tests as a command after the agent saves a file." } }
answer: { optionIds: [ a, e ] }
explanation:
  correct:
    en: "Workspace steering files in .kiro/steering/ give the agent persistent project context, loaded in every interaction by default, so generated code follows the conventions. Hooks are JSON files in .kiro/hooks/ that run a shell command or an agent prompt on an event, such as after the agent saves or edits a file, which runs the linter and the prompt regression tests automatically. Both live in the repository."
  options:
    b:
      en: "Pasting conventions by hand is error-prone, isn't versioned with the code, and depends on each developer."
    c:
      en: "The agent calls MCP tools only when it decides to, so the conventions aren't applied to every change."
    d:
      en: "Spec tasks run only when a spec is executed; edits made in chat or outside specs wouldn't trigger the checks."
references:
  - title: "Steering - Features - Docs - Kiro"
    url: https://kiro.dev/docs/steering/
  - title: "Hooks - Features - Docs - Kiro"
    url: https://kiro.dev/docs/hooks/
