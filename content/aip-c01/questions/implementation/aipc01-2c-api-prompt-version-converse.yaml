id: aipc01-2c-api-prompt-version-converse
objective: "2.4.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A team stores its approved prompts in Amazon Bedrock Prompt management. The application calls `Converse` with a prompt version ARN as the model ID and fills the template variables for each request. A developer added an `inferenceConfig` block with a lower temperature to the request, and the calls now fail with a validation error. The team wants the governed prompt version to remain the single source of the template and the inference settings.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Move the temperature from `inferenceConfig` to `additionalModelRequestFields`, and keep calling the prompt version ARN.
    - id: b
      text:
        en: |-
          Remove `inferenceConfig` from the request, set the temperature in a new prompt version, and keep sending the values in `promptVariables`.
    - id: c
      text:
        en: |-
          Replace the prompt version ARN with the foundation model ID, and copy the template text into the `system` field of the request.
    - id: d
      text:
        en: |-
          Keep `inferenceConfig`, and send the template text again in `messages` so that the request is complete.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      When `modelId` is a prompt version ARN, the request cannot include `inferenceConfig`, `system`, `toolConfig` or `additionalModelRequestFields`, because these come from the prompt defined in Prompt management. The application fills the template with `promptVariables` and can append messages.
  options:
    a:
      en: |-
        `additionalModelRequestFields` is also rejected when the model ID is a prompt ARN.
    c:
      en: |-
        This bypasses Prompt management, so the governed version is no longer the source of the template.
    d:
      en: |-
        The error is caused by `inferenceConfig`, which stays forbidden whatever messages are added.
references:
  - title: "Converse - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/APIReference/API_runtime_Converse.html
