id: aipc01-3a-did-api-response-filtering
objective: "3.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |-
    A healthcare portal calls an FM on Amazon Bedrock through an Amazon API Gateway REST API with a Lambda proxy integration. A security review found that on errors the API returns exception messages that include the system prompt, and that successful calls return the full Converse response, including token usage and the guardrail trace. Clients need only the answer text and a request ID.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Build the response in the Lambda function from an allow-list of fields, and return a generic error with a request ID on exceptions.
    - id: b
      text:
        en: |-
          Turn on API Gateway execution logging with full request and response data so that leaked fields can be detected and investigated.
    - id: c
      text:
        en: |-
          Add a denied topic to the guardrail that blocks any response about system prompts, internal errors, token usage, and guardrail traces.
    - id: d
      text:
        en: |-
          Disable trace in the guardrail configuration, and return the remaining Converse response object and exception messages unchanged.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      Response filtering at the API layer returns only the fields that clients need and generic error messages. With a Lambda proxy integration, the function controls the whole response, so it drops the usage and trace data and the exception details, which it can log internally with the request ID.
  options:
    b:
      en: |-
        Logging records the leak, and copies sensitive data into logs, but does not stop it.
    c:
      en: |-
        A guardrail evaluates content that goes to and from the model; it does not filter exception messages or response fields that the code adds.
    d:
      en: |-
        This removes the trace but still returns usage data and exception messages that contain the system prompt.
references:
  - title: Include a guardrail with the Converse API - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/guardrails-use-converse-api.html
