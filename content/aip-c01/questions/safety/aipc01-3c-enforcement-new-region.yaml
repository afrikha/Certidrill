id: aipc01-3c-enforcement-new-region
objective: "3.3.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company enforces a corporate guardrail on all Amazon Bedrock inference in us-east-1 for every account in its organization by using an Amazon Bedrock policy in AWS Organizations. Teams have started to deploy applications in eu-west-1, and an audit shows that model invocations in eu-west-1 are not filtered by the corporate guardrail. The company must apply the same corporate controls to eu-west-1 invocations without changes to application code.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Add eu-west-1 to the cross-Region inference configuration of the us-east-1 guardrail so that the same guardrail also evaluates requests made in eu-west-1.
    - id: b
      text:
        en: |-
          Create the corporate guardrail and a numeric version in eu-west-1, and add an eu-west-1 entry that references that version to the Amazon Bedrock policy.
    - id: c
      text:
        en: |-
          Call PutEnforcedGuardrailConfiguration in us-east-1 in every member account so that account-level enforcement applies to all Regions of each account.
    - id: d
      text:
        en: |-
          Attach an SCP that denies Amazon Bedrock inference in eu-west-1 until the teams add the us-east-1 guardrail ARN to the requests that they send there.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      Guardrail enforcement is configured per Region: the Amazon Bedrock policy maps each Region to a guardrail ARN and version, and AWS requires a guardrail in every Region where you want to enforce it. Creating the guardrail and a numeric version in eu-west-1 and adding that Region to the policy extends the controls without touching application code.
  options:
    a:
      en: |-
        The cross-Region configuration of a guardrail selects where the Standard tier processes evaluations; it does not enforce the guardrail on calls made in another Region.
    c:
      en: |-
        Account-level enforcement must also be configured in every Region where you want it, so a us-east-1 setting does not cover eu-west-1.
    d:
      en: |-
        This blocks the teams' applications and then relies on code changes, which the requirements rule out.
references:
  - title: "Apply cross-account safeguards with Amazon Bedrock Guardrails enforcements - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/guardrails-enforcements.html
