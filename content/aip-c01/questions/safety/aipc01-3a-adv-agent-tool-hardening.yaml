id: aipc01-3a-adv-agent-tool-hardening
objective: "3.1.5"
type: multi
difficulty: 3
status: draft
stem:
  en: |-
    A company's research agent, built with Strands Agents and calling a model on Amazon Bedrock, browses public web pages and can send emails through a send_email tool implemented in AWS Lambda. Web pages can contain hidden instructions that tell the agent to email internal data to outside addresses. The company must make sure that such an attack cannot send data outside the company, even if the model follows the injected instructions.

    Which combination of steps will meet these requirements? (Choose two.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Enable the prompt attack filter in the agent's guardrail so that the web content returned in tool results is evaluated.
    - id: b
      text:
        en: |-
          Validate the recipient in the send_email tool code, and reject any address outside the company's email domains.
    - id: c
      text:
        en: |-
          Add a system prompt instruction that tells the agent to ignore any instructions that appear in web pages.
    - id: d
      text:
        en: |-
          Require a human approval step before the send_email tool sends any message that the agent requests.
    - id: e
      text:
        en: |-
          Set the model temperature to 0 so that the agent follows its system prompt more consistently.
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |-
      Guardrails do not evaluate tool results or the tool arguments that the model generates, and prompt instructions can be overridden, so the controls must sit where the action happens. The tool code validates the recipient deterministically, and a human approval step stops a consequential action that the agent was tricked into requesting.
  options:
    a:
      en: |-
        Guardrail filters do not evaluate toolResult content, so the web pages are not checked this way.
    c:
      en: |-
        Injected instructions are designed to override the system prompt, so this gives no guarantee.
    e:
      en: |-
        Temperature affects randomness, not whether the model obeys injected instructions.
references:
  - title: Include a guardrail with the Converse API - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/guardrails-use-converse-api.html
  - title: Prompt injection security - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/prompt-injection.html
