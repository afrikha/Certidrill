id: aipc01-3c-scheduled-eval-drift
objective: "3.3.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company summarizes insurance claims with an Amazon Bedrock model and a prompt from Amazon Bedrock Prompt Management. Prompt engineers release a new prompt version about every two weeks, and the model is sometimes replaced with a newer one. Every week, the quality team must detect whether the correctness or faithfulness of the summaries has dropped compared with previous weeks, and must be alerted on a drop. The team wants to use managed evaluation features with the LEAST custom code.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Configure an Amazon SageMaker Model Monitor model quality monitoring schedule for the summarization workload with a baseline from the current prompt, and alarm on the violations that it reports.
    - id: b
      text:
        en: |-
          Create a CloudWatch anomaly detection alarm on the OutputTokenCount metric of the model so that changes in the length and structure of the summaries trigger an alert.
    - id: c
      text:
        en: |-
          Ask the model to rate each summary from 1 to 10 at the end of its response, and alarm when the weekly average rating decreases.
    - id: d
      text:
        en: |-
          Start a weekly Amazon Bedrock model-as-a-judge evaluation job with EventBridge Scheduler, using Builtin.Correctness and Builtin.Faithfulness on a fixed dataset, and alarm on the published scores.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      Running the same model-as-a-judge evaluation job on a fixed dataset every week makes scores comparable over time, so a drop reflects a change in the prompt or the model. Builtin.Correctness and Builtin.Faithfulness are built-in judge metrics; only the step that publishes the job's scores as CloudWatch metrics needs code.
  options:
    a:
      en: |-
        SageMaker Model Monitor is no longer open to new customers, and it monitors SageMaker endpoints rather than Bedrock model calls.
    b:
      en: |-
        Summary length is not a measure of correctness or faithfulness.
    c:
      en: |-
        A model grading its own output in the same response is not an independent or repeatable measurement, and real traffic changes from week to week.
references:
  - title: "Use metrics to understand model performance - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/model-evaluation-metrics.html
  - title: "Amazon SageMaker Model Monitor availability change - Amazon SageMaker AI"
    url: https://docs.aws.amazon.com/sagemaker/latest/dg/model-monitor-availability-change.html
