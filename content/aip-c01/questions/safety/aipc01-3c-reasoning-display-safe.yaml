id: aipc01-3c-reasoning-display-safe
objective: "3.4.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A tax-advice platform calls an Amazon Bedrock model with reasoning enabled through the Converse API, with a guardrail in each request. Product managers want users to see why the assistant reached each conclusion. All content shown to users must be evaluated by the platform's guardrail, and reviewers must still be able to inspect the model's full reasoning when a customer files a complaint.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Display the reasoningContent blocks to users next to the answer, and rely on the guardrail that is already configured in each Converse request to filter them.
    - id: b
      text:
        en: |-
          Have the model write a short rationale in its answer text, show that rationale to users, and store the reasoningContent blocks in a restricted log group for reviewers.
    - id: c
      text:
        en: |-
          Disable reasoning, and display the guardrail trace of each response to users as the explanation of how the assistant reached its answer.
    - id: d
      text:
        en: |-
          Display the redactedContent of the reasoning blocks to users, and keep the reasoningText blocks in a restricted log group for reviewers.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      Guardrails evaluate user inputs and model responses excluding reasoning content blocks, so raw reasoning would reach users unfiltered. A rationale written in the answer text is part of the response that the guardrail evaluates, and keeping the reasoningContent blocks in restricted logs preserves the full chain of thought for reviewers.
  options:
    a:
      en: |-
        The guardrail does not evaluate reasoning content blocks, so this would show unfiltered content to users.
    c:
      en: |-
        The guardrail trace describes the policies that were assessed, not why the model reached its conclusion, and it can contain sensitive original values.
    d:
      en: |-
        redactedContent is reasoning that the model provider encrypted for safety, so it is not readable by users.
references:
  - title: "Detect and filter harmful content by using Amazon Bedrock Guardrails - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/guardrails.html
  - title: "ReasoningContentBlock - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/APIReference/API_runtime_ReasoningContentBlock.html
