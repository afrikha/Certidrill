id: aipc01-3b-cloudtrail-config-and-kb
objective: "3.3.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    An insurance company has a CloudTrail trail that records management events only. Its auditors ask for two records. First, which IAM principals changed Amazon Bedrock guardrail configurations. Second, which IAM principals queried each Amazon Bedrock knowledge base with Retrieve or RetrieveAndGenerate, and when.

    Which combination of steps will meet these requirements? (Choose two.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Add an advanced event selector with eventCategory set to Data for the AWS::Bedrock::Guardrail resource type to capture guardrail configuration changes.
    - id: b
      text:
        en: |-
          Use the existing management events, such as CreateGuardrail and UpdateGuardrail, to identify who changed guardrail configurations.
    - id: c
      text:
        en: |-
          Enable Amazon Bedrock model invocation logging so that Retrieve and RetrieveAndGenerate requests are recorded with the caller's identity.
    - id: d
      text:
        en: |-
          Enable S3 server access logging on the knowledge base source buckets to identify the principals that query the knowledge bases.
    - id: e
      text:
        en: |-
          Add an advanced event selector with eventCategory set to Data for the AWS::Bedrock::KnowledgeBase resource type.
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: |-
      Control plane operations such as creating or updating a guardrail are management events, which CloudTrail logs by default. Retrieve and RetrieveAndGenerate are data events of the AWS::Bedrock::KnowledgeBase resource type, which CloudTrail logs only when an advanced event selector enables them (at additional charge).
  options:
    a:
      en: |-
        Data events for AWS::Bedrock::Guardrail record ApplyGuardrail calls, not changes to the guardrail configuration.
    c:
      en: |-
        Model invocation logging captures only calls made through the bedrock-runtime endpoint (Converse, InvokeModel), not knowledge base queries.
    d:
      en: |-
        The knowledge base reads its source bucket during ingestion; S3 access logs never show the users who query the knowledge base.
references:
  - title: Monitor Amazon Bedrock API calls using CloudTrail - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/logging-using-cloudtrail.html
