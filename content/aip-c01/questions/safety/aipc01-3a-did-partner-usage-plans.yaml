id: aipc01-3a-did-partner-usage-plans
objective: "3.1.4"
type: single
difficulty: 1
status: draft
stem:
  en: |-
    A company sells access to its FM-based document translation API, which runs on an Amazon API Gateway REST API, to 25 business partners. To limit misuse and inference costs, each partner must have its own request rate limit and its own monthly request quota.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Set stage-level throttling on the API to the sum of the limits that were agreed with all of the partners.
    - id: b
      text:
        en: |-
          Create an AWS WAF rate-based rule that limits the number of requests from each source IP address.
    - id: c
      text:
        en: |-
          Request a lower tokens-per-minute quota for the model in Amazon Bedrock so that the inference costs of the account stay low.
    - id: d
      text:
        en: |-
          Issue an API key to each partner, and associate the keys with usage plans that set throttling and a monthly quota.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      Usage plans set per-client throttling (rate and burst) and quotas, such as a number of requests per month, for clients that identify themselves with an API key. Each partner therefore gets its own limits, and requests over the limits receive HTTP 429 responses.
  options:
    a:
      en: |-
        Stage throttling is shared by all callers, so one partner can consume the whole capacity, and it sets no monthly quota.
    b:
      en: |-
        Rate-based rules count by IP address or other keys over a short window; they set no monthly quota per partner.
    c:
      en: |-
        A model quota applies to the whole account, not to each partner.
references:
  - title: Throttle requests to your REST APIs for better throughput in API Gateway - Amazon API Gateway
    url: https://docs.aws.amazon.com/apigateway/latest/developerguide/api-gateway-request-throttling.html
