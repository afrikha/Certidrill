id: aipc01-3a-acc-ar-eligibility
objective: "3.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |-
    A large employer is building an HR assistant on Amazon Bedrock that answers questions about parental leave eligibility. Eligibility depends on precise rules in a 20-page policy document, such as employment type, months of service, and work location. The legal team requires every answer to be checked against these rules, with an auditable explanation that cites the rules that support or contradict the answer.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Add a contextual grounding check to the guardrail with the policy document as the grounding source and a grounding threshold of 0.9.
    - id: b
      text:
        en: |-
          Run a weekly Amazon Bedrock evaluation job that uses an LLM as a judge with the Builtin.Correctness metric on sampled answers.
    - id: c
      text:
        en: |-
          Create an Automated Reasoning policy from the policy document, add it to the guardrail, and act on the findings returned for each answer.
    - id: d
      text:
        en: |-
          Fine-tune the model on the policy document, and instruct it to quote the relevant section of the policy in every answer.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      Automated Reasoning checks extract formal rules and variables from a source document and validate each response against them. Findings such as VALID or INVALID include the supporting or contradicting rules, which gives verifiable, auditable explanations for rule-based domains such as HR eligibility.
  options:
    a:
      en: |-
        A grounding check returns a score of how well the answer is supported by the source; it does not cite which rules support or contradict the answer.
    b:
      en: |-
        A periodic evaluation job scores a sample offline; it does not check every answer.
    d:
      en: |-
        Fine-tuning does not guarantee that answers follow the rules, and quoting a section is not a verification.
references:
  - title: What are Automated Reasoning checks in Amazon Bedrock Guardrails? - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/guardrails-automated-reasoning-checks.html
  - title: Automated Reasoning checks concepts - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/automated-reasoning-checks-concepts.html
