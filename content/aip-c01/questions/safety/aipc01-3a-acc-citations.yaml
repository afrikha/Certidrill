id: aipc01-3a-acc-citations
objective: "3.1.3"
type: single
difficulty: 1
status: draft
stem:
  en: |-
    A government agency's policy assistant calls the RetrieveAndGenerate API on a customer-managed Amazon Bedrock knowledge base whose documents are stored in Amazon S3. Auditors require each part of an answer to be displayed with a link to the source document that supports it.

    Which solution will meet these requirements with the LEAST development effort?
body:
  options:
    - id: a
      text:
        en: |-
          Instruct the model in the prompt template to list the names and locations of the documents that it used after each answer.
    - id: b
      text:
        en: |-
          Turn on model invocation logging, and display the logged prompt of each request next to the generated answer.
    - id: c
      text:
        en: |-
          Use the citations in the RetrieveAndGenerate response, which map each generated text span to the locations of its references.
    - id: d
      text:
        en: |-
          Call the Retrieve API again with the generated answer as the query, and display the top result as the source.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      The RetrieveAndGenerate response includes citations. Each citation links a generatedResponsePart (the text and its span in the answer) to retrievedReferences that contain the content, the location (such as the S3 URI), and the metadata of the supporting chunks.
  options:
    a:
      en: |-
        Document names written by the model can be invented or incomplete, so they do not prove which source supports each part.
    b:
      en: |-
        Invocation logs are an operational record; they do not map parts of the answer to source documents.
    d:
      en: |-
        A second retrieval adds a call and only finds similar text; it does not show which sources the answer was generated from.
references:
  - title: RetrieveAndGenerate - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/APIReference/API_agent-runtime_RetrieveAndGenerate.html
