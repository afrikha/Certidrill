id: aipc01-3a-did-iam-guardrail-condition
objective: "3.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |-
    A financial services company has one AWS account that hosts a customer-facing assistant team and a data science team. Security requires every InvokeModel and Converse call made by the assistant team's IAM roles to use version 4 of an approved Amazon Bedrock guardrail. The data science team must keep invoking models without a guardrail for experiments.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Configure account-level guardrail enforcement with the PutEnforcedGuardrailConfiguration API for version 4 of the approved guardrail in the Region.
    - id: b
      text:
        en: |-
          Publish a coding standard that requires the approved guardrail, and check every deployment for the guardrailConfig parameter during code reviews.
    - id: c
      text:
        en: |-
          Attach to the assistant roles a Deny on bedrock:InvokeModel and bedrock:InvokeModelWithResponseStream with StringNotEquals on bedrock:GuardrailIdentifier.
    - id: d
      text:
        en: |-
          Turn on model invocation logging, and run an hourly Lambda function that reports invocations made without the approved guardrail.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      The bedrock:GuardrailIdentifier condition key applies to InvokeModel, InvokeModelWithResponseStream, Converse, and ConverseStream. An explicit Deny with StringNotEquals on the ARN of guardrail version 4 rejects any call from these roles that does not use that guardrail, whatever other permissions they have (Converse is authorized by the bedrock:InvokeModel action), while the data science roles are not affected.
  options:
    a:
      en: |-
        Account-level enforcement applies to inference calls from every caller in the account, including the data science team.
    b:
      en: |-
        A coding standard is a convention, not a control; any role can still call the models without the guardrail.
    d:
      en: |-
        This detects violations after the calls have been made instead of preventing them.
references:
  - title: Enforce the use of specific guardrails in model inference requests - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/guardrails-permissions-id.html
