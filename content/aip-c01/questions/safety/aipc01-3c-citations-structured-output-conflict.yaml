id: aipc01-3c-citations-structured-output-conflict
objective: "3.4.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A legal technology company sends contract PDFs to an Anthropic Claude model on Amazon Bedrock as document content blocks in Converse requests, with citations enabled so that users can see the clause behind each statement. A downstream system now also needs each answer as JSON that conforms to a strict JSON Schema, so the team enabled structured outputs in the same requests. The requests now fail with a 400 error. The company must keep both the clause citations for users and schema-valid JSON for the downstream system.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Set strict to true in the JSON Schema definition, and set additionalProperties to false on every object in the schema so that the schema compiles.
    - id: b
      text:
        en: |-
          Keep citations in the user-facing request, and send a second request with structured outputs and no citations that converts the cited answer to the schema.
    - id: c
      text:
        en: |-
          Increase the client read timeout to at least 120 seconds, because the first request with a new schema can take up to about 90 seconds to compile.
    - id: d
      text:
        en: |-
          Remove the document blocks, and paste the contract text into the system prompt so that the model can return its citations inside the structured output.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      For Anthropic models, structured outputs are incompatible with citations, and enabling both returns a 400 error. Splitting the work into a cited answer for users and a separate structured-output request for the downstream JSON keeps both capabilities.
  options:
    a:
      en: |-
        Schema fixes do not remove the incompatibility; the request still fails while citations are enabled with structured outputs.
    c:
      en: |-
        The compile delay of a new schema causes timeouts, not a 400 error on every request.
    d:
      en: |-
        Without document blocks the model cannot return document citations, so users would lose the clause evidence.
references:
  - title: "Get validated JSON results from models - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/structured-output.html
