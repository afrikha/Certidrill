id: aipc01-3b-vpce-private-dns-no-code
objective: "3.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A media company has 40 AWS Lambda functions in a VPC that call Amazon Bedrock for inference. An engineer created an interface VPC endpoint for bedrock-runtime but left the private DNS option disabled. VPC Flow Logs show that the Bedrock traffic still leaves through the NAT gateway. The company wants all Bedrock calls to use the endpoint without modifying or redeploying the code of the functions.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Modify the interface endpoint to enable private DNS names so that the default bedrock-runtime host name resolves to the endpoint.
    - id: b
      text:
        en: |-
          Update each function's SDK client to set the endpoint URL to the DNS name of the interface endpoint, and redeploy the functions.
    - id: c
      text:
        en: |-
          Add a route to the private subnets' route tables that sends traffic for Amazon Bedrock to the interface endpoint instead of the NAT gateway.
    - id: d
      text:
        en: |-
          Replace the default endpoint policy with a policy that allows bedrock:InvokeModel for all principals in the company's account.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      With private DNS enabled, the SDK's default bedrock-runtime host name resolves to the interface endpoint, so no code change is needed. Without private DNS, every client has to specify the endpoint URL explicitly, which is why the traffic still follows the default route to the NAT gateway.
  options:
    b:
      en: |-
        Setting endpoint_url in each client would work, but it requires changing and redeploying the 40 functions, which the company wants to avoid.
    c:
      en: |-
        Interface endpoints are reached through DNS and elastic network interfaces, not through route table entries; route tables are used for gateway endpoints only.
    d:
      en: |-
        The endpoint policy controls what is allowed through the endpoint, not whether clients send their requests to it.
references:
  - title: Use interface VPC endpoints (AWS PrivateLink) to create a private connection between your VPC and Amazon Bedrock - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/vpc-interface-endpoints.html
