id: aipc01-3c-log-data-protection-alert
objective: "3.3.4"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A bank enabled Amazon Bedrock model invocation logging to a CloudWatch Logs log group. Its guardrail anonymizes account holders' names and email addresses in model responses. An audit found names and email addresses in clear text in the invocation logs. The bank must mask this data in new log events for everyone except the incident response team, and the security team must be alerted whenever such data is detected in the logs.

    Which combination of actions will meet these requirements? (Choose two.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Change the guardrail's sensitive information filter to also use the ANONYMIZE action on input so that the invocation logs contain masked prompts.
    - id: b
      text:
        en: |-
          Encrypt the log group with a customer managed AWS KMS key, and allow only the incident response role in the key policy.
    - id: c
      text:
        en: |-
          Create a CloudWatch Logs data protection policy for the log group with managed data identifiers for names and email addresses, and grant logs:Unmask only to the incident response role.
    - id: d
      text:
        en: |-
          Turn on Amazon Macie automated sensitive data discovery for the log group, and send the Macie findings to the security team.
    - id: e
      text:
        en: |-
          Create a CloudWatch alarm on the LogEventsWithFindings metric in the AWS/Logs namespace, with an Amazon SNS action that notifies the security team.
answer: { optionIds: [ c, e ] }
explanation:
  correct:
    en: |-
      A data protection policy detects and masks sensitive data as it is ingested into the log group, and only principals with the logs:Unmask permission can see the original values. When the policy finds sensitive data it emits the LogEventsWithFindings metric in the AWS/Logs namespace, on which an alarm can notify the security team. Events ingested before the policy remain unmasked.
  options:
    a:
      en: |-
        Masking applies to what is sent to and returned from the model. The input field of the invocation logs always contains the original request, whatever the guardrail does.
    b:
      en: |-
        Encryption at rest does not mask individual values in the events that authorized readers see, and it does not detect or alert on sensitive data.
    d:
      en: |-
        Macie discovers sensitive data in Amazon S3 objects, not in CloudWatch Logs log groups.
references:
  - title: "Help protect sensitive log data with masking - Amazon CloudWatch Logs"
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/logs/mask-sensitive-log-data.html
  - title: "Remove PII from conversations by using sensitive information filters - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/guardrails-sensitive-filters.html
