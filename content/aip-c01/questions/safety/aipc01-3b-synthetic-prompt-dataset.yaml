id: aipc01-3b-synthetic-prompt-dataset
objective: "3.2.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A bank's prompt engineers need several hundred realistic customer conversations to design and evaluate the prompts of a new assistant. The production transcripts contain personal and account data, and the engineers are not authorized to see customer data. The conversations must reflect the real intents and structure of customer requests.

    Which approach will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Give the engineers read-only access to the production transcripts, and record every access with AWS CloudTrail data events.
    - id: b
      text:
        en: |-
          Generate synthetic conversations that reproduce the intents, structure and tone of real requests, with fictitious names and account data.
    - id: c
      text:
        en: |-
          Give the engineers a copy of the production transcripts, and attach a guardrail that anonymizes all PII types whenever the prompts are tested against the model.
    - id: d
      text:
        en: |-
          Encrypt the production transcripts with a customer managed KMS key and give the engineers permission to decrypt them.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      Synthetic data keeps the utility needed for prompt development and evaluation (realistic intents, structure and phrasing) while containing no real customer data. It is the standard privacy technique for testing and building evaluation datasets.
  options:
    a:
      en: |-
        Auditing access does not change the fact that unauthorized engineers would read customer data.
    c:
      en: |-
        The guardrail masks data only in model calls; the engineers would still read the raw transcripts in the dataset.
    d:
      en: |-
        Engineers who can decrypt the transcripts can read the customer data, which they are not authorized to see.
references:
  - title: Remove PII from conversations by using sensitive information filters - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/guardrails-sensitive-filters.html
