id: aipc01-3b-metadata-file-size
objective: "3.3.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A research institute indexes documents in an Amazon Bedrock knowledge base with an Amazon S3 data source. To attribute generated answers, the team wrote each document's full provenance record (about 30 KB of source and transformation history) into the document's .metadata.json file, and ingestion fails for those documents. Answers must still let users trace each cited passage to its full provenance record.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Split each provenance record across several metadata files named after the same document, so that each file stays smaller than the metadata file size limit.
    - id: b
      text:
        en: |-
          Keep a short provenance_id in each .metadata.json file, store the full records in a catalog keyed by that ID, and look them up from citations.
    - id: c
      text:
        en: |-
          Move the provenance records into S3 user-defined metadata (x-amz-meta-) on each document object, and re-sync the data source.
    - id: d
      text:
        en: |-
          Set includeForEmbedding to false for the provenance attribute so that the metadata file size limit no longer applies to it.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      A knowledge base metadata file must not exceed 10 KB, so a 30 KB record cannot be ingested. A short identifier fits easily, comes back in the metadata of each retrieved reference, and lets the application fetch the full provenance record from the store that holds it.
  options:
    a:
      en: |-
        Each document has one metadata file, named after it with .metadata.json appended; several files per document are not supported.
    c:
      en: |-
        User-defined object metadata is limited to 2 KB and is not used by the knowledge base, so it can neither hold the records nor return them in citations.
    d:
      en: |-
        includeForEmbedding only controls whether an attribute is embedded with the chunk; the 10 KB limit applies to the whole metadata file.
references:
  - title: Connect to Amazon S3 for your knowledge base - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/s3-data-source-connector.html
  - title: Working with object metadata - Amazon Simple Storage Service
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/UsingMetadata.html
