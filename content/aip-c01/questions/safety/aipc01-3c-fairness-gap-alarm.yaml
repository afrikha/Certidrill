id: aipc01-3c-fairness-gap-alarm
objective: "3.4.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    An HR assistant serves employees in four regions. A nightly evaluation computes a helpfulness score for each region. The governance team set a policy that the gap between the best and the worst region must stay below 0.1, and an alert must fire automatically when it does not. The team wants the LEAST custom code.

    Which combination of actions will meet these requirements? (Choose two.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Create a CloudWatch anomaly detection alarm on the average helpfulness score of all four regions combined.
    - id: b
      text:
        en: |-
          Create an Amazon Quick dashboard that shows the four regions side by side, and ask a reviewer to check it every morning.
    - id: c
      text:
        en: |-
          Publish each region's nightly score as a CloudWatch custom metric with a Segment dimension that identifies the region.
    - id: d
      text:
        en: |-
          Create a CloudWatch alarm on a metric math expression that subtracts MIN(METRICS()) from MAX(METRICS()) for the four regional metrics, with a threshold of 0.1.
    - id: e
      text:
        en: |-
          Configure the bias drift monitor of Amazon SageMaker Model Monitor with the region as the facet, and alarm on its violations.
answer: { optionIds: [ c, d ] }
explanation:
  correct:
    en: |-
      One metric per region makes the segments comparable in CloudWatch. Given an array of time series, MAX and MIN return the highest and lowest value at each timestamp, so their difference is the gap between the best and worst region, and an alarm on that single series enforces the 0.1 threshold.
  options:
    a:
      en: |-
        An average across regions can stay stable while one region falls behind, so it hides the gap.
    b:
      en: |-
        A dashboard checked by a person is not an automatic alert.
    e:
      en: |-
        SageMaker Model Monitor is no longer open to new customers; AWS recommends computing per-segment metrics and alerting on gaps yourself.
references:
  - title: "Math expressions with metrics - Amazon CloudWatch"
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/using-metric-math.html
  - title: "Amazon SageMaker Model Monitor availability change - Amazon SageMaker AI"
    url: https://docs.aws.amazon.com/sagemaker/latest/dg/model-monitor-availability-change.html
