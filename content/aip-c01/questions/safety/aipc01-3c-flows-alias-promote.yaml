id: aipc01-3c-flows-alias-promote
objective: "3.4.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company runs its loan-explanation workflow as an Amazon Bedrock flow (formerly Prompt Flows). Production uses version 6 through an alias named prod. After an offline fairness comparison, version 7 of the flow performed better. The team must switch production to version 7 without changing or redeploying the application, and must be able to revert within minutes if complaints increase.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Change the application to call InvokeFlow with the TSTALIASID alias, which points to the newest version of the flow.
    - id: b
      text:
        en: |-
          Delete version 6, and create the prod alias again so that it points to the newest version of the flow.
    - id: c
      text:
        en: |-
          Copy the nodes of version 7 into the working draft, and let the application invoke the DRAFT version of the flow.
    - id: d
      text:
        en: |-
          Update the prod alias to point to version 7, and point it back to version 6 if a revert is needed.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      The application calls InvokeFlow on an alias, and an alias points to an immutable version. Repointing prod to version 7 changes production without touching the application, and pointing it back to version 6 reverts quickly.
  options:
    a:
      en: |-
        TSTALIASID points to the working draft, not to the newest version, and switching alias requires an application change.
    b:
      en: |-
        Deleting version 6 removes the revert target, and recreating the alias interrupts production.
    c:
      en: |-
        The draft is mutable and meant for testing, and invoking it requires changing the application.
references:
  - title: "Deploy a flow to your application using versions and aliases - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/flows-deploy.html
