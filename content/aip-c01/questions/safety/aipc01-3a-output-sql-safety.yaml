id: aipc01-3a-output-sql-safety
objective: "3.1.2"
type: multi
difficulty: 3
status: draft
stem:
  en: |-
    A company's analytics assistant uses an FM on Amazon Bedrock to translate user questions into SQL that a Lambda function runs against an Amazon Aurora MySQL database. A penetration test showed that a crafted question made the model generate a DELETE statement, which ran successfully. The company needs deterministic controls that guarantee that generated SQL can never change data.

    Which combination of steps will meet these requirements? (Choose two.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Add a denied topic named Data Modification to the guardrail to block prompts that ask to change data.
    - id: b
      text:
        en: |-
          Add an instruction to the system prompt that tells the model to generate only SELECT statements.
    - id: c
      text:
        en: |-
          Run the generated queries with a database user that has only SELECT privileges on the approved tables.
    - id: d
      text:
        en: |-
          Set the temperature to 0 so that the model always generates the same SQL for the same question.
    - id: e
      text:
        en: |-
          Parse each statement in the Lambda function and reject anything other than a single SELECT before it runs.
answer: { optionIds: [ c, e ] }
explanation:
  correct:
    en: |-
      Database privileges are enforced by the database itself: a user with only SELECT rights cannot change data, whatever SQL the model writes. Parsing the statement in the Lambda function that runs it adds a deterministic check that rejects other statement types before they reach the database.
  options:
    a:
      en: |-
        A denied topic is a probabilistic filter on the prompt, and a crafted question does not have to look like a request to change data.
    b:
      en: |-
        Prompt instructions can be overridden by prompt injection, which is what the penetration test showed.
    d:
      en: |-
        Temperature affects variability, not which kinds of statements the model can produce.
references:
  - title: Prompt injection security - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/prompt-injection.html
  - title: Generate a query for structured data - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/knowledge-base-generate-query.html
