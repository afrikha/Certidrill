id: aipc01-3a-output-streaming-pii-sync
objective: "3.1.2"
type: single
difficulty: 3
status: draft
stem:
  en: |-
    A bank streams assistant answers to its mobile app with the Amazon Bedrock ConverseStream API and a guardrail. A sensitive information filter with the ANONYMIZE action masks account numbers and names in responses. To reduce latency, a developer proposes changing how the guardrail processes the stream. Customers must never see an unmasked value.

    Which solution provides the lowest latency while meeting this requirement?
body:
  options:
    - id: a
      text:
        en: |-
          Keep the synchronous stream processing mode, in which the guardrail buffers chunks and applies its policies before it sends them.
    - id: b
      text:
        en: |-
          Use the asynchronous stream processing mode, in which chunks are sent immediately and sensitive values are masked in the background.
    - id: c
      text:
        en: |-
          Use the asynchronous stream processing mode, and add a Lambda function that rescans the full response after the stream ends.
    - id: d
      text:
        en: |-
          Stop streaming, call the Converse API with the same guardrail, and send the masked response when it is complete.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      In synchronous mode, the default, the guardrail buffers response chunks and applies its policies before sending them, so no unmasked value reaches the user. Asynchronous mode does not support masking sensitive information, and streaming in synchronous mode still delivers the first chunks sooner than waiting for a complete response.
  options:
    b:
      en: |-
        Guardrails does not support masking sensitive information in asynchronous mode, and chunks can reach the user before they are scanned.
    c:
      en: |-
        A rescan after the stream ends is too late: unmasked chunks have already been displayed.
    d:
      en: |-
        This protects the values, but the customer waits for the whole response to be generated, which adds latency compared with synchronous streaming.
references:
  - title: Configure streaming response behavior to filter content - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/guardrails-streaming.html
