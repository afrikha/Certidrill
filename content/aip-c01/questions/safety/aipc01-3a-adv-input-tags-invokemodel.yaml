id: aipc01-3a-adv-input-tags-invokemodel
objective: "3.1.5"
type: single
difficulty: 2
status: draft
stem:
  en: |-
    A developer configured an Amazon Bedrock guardrail with a HIGH-strength prompt attack filter and passes the guardrail ID and version in InvokeModel requests. The prompt is a single string that contains the system instructions followed by the user's message, without any tags. Prompt injection attempts from the red team are never detected, although the content filters of the same guardrail block harmful text.

    Which solution will fix this issue?
body:
  options:
    - id: a
      text:
        en: |-
          Raise the Misconduct content filter to HIGH strength on input so that injection attempts are blocked as misconduct.
    - id: b
      text:
        en: |-
          Move the prompt attack filter to the Standard tier so that injection attempts are also detected in prompts that have no input tags.
    - id: c
      text:
        en: |-
          Enable the prompt attack filter on output so that the model's reaction to an injection attempt is detected.
    - id: d
      text:
        en: |-
          Wrap the user's message in input tags with a tagSuffix set in the request, and leave the system instructions outside the tags.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      With InvokeModel and InvokeModelWithResponseStream, the prompt attack filter evaluates only content inside input tags; without tags, prompt attacks are not filtered, while other policies evaluate the whole prompt. Tagging only the user's message also keeps the developer's instructions from being flagged.
  options:
    a:
      en: |-
        The Misconduct category detects content about crime and harm, not attempts to override instructions.
    b:
      en: |-
        The input tag requirement for prompt attacks with InvokeModel applies whatever the tier.
    c:
      en: |-
        The prompt attack filter is an input policy (inputStrength and inputAction); it does not evaluate responses.
references:
  - title: Detect prompt attacks with Amazon Bedrock Guardrails - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/guardrails-prompt-attack.html
  - title: Apply tags to user input to filter content - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/guardrails-tagging.html
