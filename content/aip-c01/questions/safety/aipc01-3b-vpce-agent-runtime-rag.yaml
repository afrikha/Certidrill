id: aipc01-3b-vpce-agent-runtime-rag
objective: "3.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A legal firm runs a RAG assistant as Amazon ECS tasks on AWS Fargate in private subnets. The assistant calls RetrieveAndGenerate on an Amazon Bedrock knowledge base and then calls Converse to rewrite the answer in the firm's style. The VPC already has an interface VPC endpoint for bedrock-runtime with private DNS enabled. After the firm removed its NAT gateway, the Converse calls still succeed but every RetrieveAndGenerate call times out. Traffic must stay off the internet.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Create an interface VPC endpoint for com.amazonaws.region.bedrock-agent with private DNS enabled, and allow HTTPS from the tasks' security group.
    - id: b
      text:
        en: |-
          Create a gateway VPC endpoint for Amazon S3 so that the knowledge base can read its source documents from inside the VPC.
    - id: c
      text:
        en: |-
          Update the endpoint policy of the existing bedrock-runtime interface endpoint to allow the bedrock:RetrieveAndGenerate action on the knowledge base's ARN.
    - id: d
      text:
        en: |-
          Create an interface VPC endpoint for com.amazonaws.region.bedrock-agent-runtime with private DNS enabled, and allow HTTPS from the tasks' security group.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      Retrieve and RetrieveAndGenerate are Agents runtime API actions, served by the bedrock-agent-runtime host name, not by bedrock-runtime. Without the NAT gateway, that host name is reachable only through its own interface endpoint; with private DNS enabled, the existing SDK client uses it without code changes.
  options:
    a:
      en: |-
        The bedrock-agent endpoint serves the build-time API (creating knowledge bases, data sources and ingestion jobs), not the runtime query calls that are failing.
    b:
      en: |-
        The knowledge base service reads its S3 data source during ingestion, outside the firm's VPC; the failing calls are the tasks' own requests to the agent runtime host name.
    c:
      en: |-
        An endpoint policy only filters requests that reach that endpoint; RetrieveAndGenerate requests go to a different host name, which has no endpoint in the VPC.
references:
  - title: Use interface VPC endpoints (AWS PrivateLink) to create a private connection between your VPC and Amazon Bedrock - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/vpc-interface-endpoints.html
