id: aipc01-3b-minimize-profile-tool
objective: "3.2.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A utility company's billing assistant answers questions such as "When is my next payment due?". In the current design, the full profile of every customer (address, date of birth, payment history and contact details) is indexed in an Amazon Bedrock knowledge base, and a metadata filter on the customer ID limits retrieval. A privacy review rejects the design because the vector store holds personal data of all customers and the model receives far more data than each answer needs. The assistant must keep answering billing questions accurately.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Keep the profiles in the knowledge base, and attach a guardrail that anonymizes addresses, dates of birth and phone numbers in the responses.
    - id: b
      text:
        en: |-
          Keep the profiles in the knowledge base, and encrypt the vector store and the data source bucket with a customer managed KMS key.
    - id: c
      text:
        en: |-
          Keep the profiles in the knowledge base, and add a stricter metadata filter that also matches the customer's email address.
    - id: d
      text:
        en: |-
          Remove the profiles from the knowledge base, and give the assistant a tool that returns only the authenticated customer's billing fields.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      Data minimization keeps personal data out of the vector store and sends the model only the fields a given answer requires. A tool that looks up the authenticated customer's billing fields at answer time keeps the answers accurate and current while the index no longer contains customer profiles.
  options:
    a:
      en: |-
        Masking responses does not change what the vector store holds or what the model receives, which are the two issues the review raised.
    b:
      en: |-
        Encryption at rest protects against storage access, but the vector store still holds every profile and the model still receives the full records.
    c:
      en: |-
        A stricter filter limits retrieval but leaves all profiles, with their embeddings, in the vector store.
references:
  - title: Configure and customize queries and response generation - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/kb-test-config.html
