id: aipc01-3b-rag-provenance-record
objective: "3.3.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A news publisher generates article drafts with RetrieveAndGenerate on an Amazon Bedrock knowledge base. Editors must be able to trace each published draft, months later, to the exact source documents and the model that produced it. The team relied on model invocation logging for this, but the invocation log group contains no entries for these calls. The publisher does not want to change how the application calls the knowledge base.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Enable the Embedding data type in the model invocation logging configuration so that the knowledge base calls are also logged there.
    - id: b
      text:
        en: |-
          Enable CloudTrail data events for the knowledge base so that each RetrieveAndGenerate event records the documents that were cited.
    - id: c
      text:
        en: |-
          Have the application store each draft ID with the response's citations (location and metadata of each reference), session ID and model ARN.
    - id: d
      text:
        en: |-
          Configure the knowledge base to write its retrieval results to the data source bucket after each query, and match them to the drafts by timestamp.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      Model invocation logging captures only calls made through the bedrock-runtime endpoint, so RetrieveAndGenerate calls do not appear in it. The RetrieveAndGenerate response contains citations whose retrieved references carry the source location and metadata, so recording them with the draft ID and the model ARN gives a durable provenance record without changing the call.
  options:
    a:
      en: |-
        The data types only choose which modalities are logged for bedrock-runtime calls; knowledge base queries are still not captured.
    b:
      en: |-
        Data events show who queried which knowledge base and when, but CloudTrail does not record the cited documents of a response.
    d:
      en: |-
        Knowledge bases offer no option to write retrieval results to the data source bucket, and timestamp matching would not be reliable.
references:
  - title: Monitor model invocation using CloudWatch Logs and Amazon S3 - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/model-invocation-logging.html
  - title: Citation - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/APIReference/API_agent-runtime_Citation.html
