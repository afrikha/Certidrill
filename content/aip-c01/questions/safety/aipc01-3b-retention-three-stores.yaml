id: aipc01-3b-retention-three-stores
objective: "3.2.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A travel company's GenAI assistant stores personal data in three places: raw uploaded documents in an Amazon S3 bucket, model invocation logs in a CloudWatch Logs log group, and conversation history in an Amazon DynamoDB table. The company's data retention policy requires that each item is deleted automatically 30 days after it is written. The company wants the LEAST operational overhead.

    Which combination of steps will meet these requirements? (Choose three.)
body:
  choose: 3
  options:
    - id: a
      text:
        en: |-
          Add an S3 Lifecycle rule with an expiration action of 30 days to the bucket that stores the uploaded documents.
    - id: b
      text:
        en: |-
          Enable S3 Object Lock in compliance mode with a 30-day default retention period on the uploads bucket.
    - id: c
      text:
        en: |-
          Set the retention period of the invocation log group to 30 days.
    - id: d
      text:
        en: |-
          Create a CloudWatch Logs data protection policy that masks personal data in the invocation log group.
    - id: e
      text:
        en: |-
          Write an expiry timestamp in epoch seconds on each conversation item, and enable Time to Live on that attribute.
    - id: f
      text:
        en: |-
          Enable point-in-time recovery on the DynamoDB table with a recovery period of 30 days.
answer: { optionIds: [ a, c, e ] }
explanation:
  correct:
    en: |-
      Each store has a built-in expiry mechanism: an S3 Lifecycle expiration action deletes objects after the set number of days, a log group retention setting deletes older log events, and DynamoDB Time to Live deletes items whose epoch-seconds timestamp has passed, without consuming write throughput. None of them needs custom code.
  options:
    b:
      en: |-
        Object Lock prevents deletion during the retention period; it never deletes objects when the period ends.
    d:
      en: |-
        A data protection policy masks sensitive values but keeps the log events, so the data is not deleted after 30 days.
    f:
      en: |-
        Point-in-time recovery keeps backups of the table for restore; it does not delete items and would keep copies of the data.
references:
  - title: Managing the lifecycle of objects - Amazon Simple Storage Service
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/object-lifecycle-mgmt.html
  - title: Using time to live (TTL) in DynamoDB - Amazon DynamoDB
    url: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/TTL.html
