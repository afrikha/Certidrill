id: aipc01-3c-confidence-metrics-emf
objective: "3.4.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company's AWS Lambda function orchestrates a RAG assistant and already computes a confidence score from 0 to 1 for each answer from grounding and retrieval scores. The operations team wants dashboards of the average confidence per use case and per model, and an alarm when the average confidence falls. The function must not make additional API calls in the request path.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Write the score in CloudWatch embedded metric format to the function's logs with UseCase and ModelId dimensions, and alarm on the extracted metric.
    - id: b
      text:
        en: |-
          Store each score in an Amazon DynamoDB table, and run a nightly AWS Glue job that computes the averages per use case and model.
    - id: c
      text:
        en: |-
          Add the score to the requestMetadata of the next Converse request so that it appears in the model invocation logs.
    - id: d
      text:
        en: |-
          Call the CloudWatch PutMetricData API from the function for each answer with UseCase and ModelId dimensions, and create a CloudWatch alarm on the metric.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      With the embedded metric format, the function writes structured log lines and CloudWatch extracts the custom metrics asynchronously, without PutMetricData calls; this suits Lambda functions. Dimensions such as UseCase and ModelId give per-use-case and per-model metrics that dashboards and alarms use directly.
  options:
    b:
      en: |-
        A DynamoDB write adds a call in the request path, and a nightly job provides neither near-real-time dashboards nor alarms.
    c:
      en: |-
        The score would be attached to a different request, and invocation logs are not metrics that can be graphed and alarmed on directly.
    d:
      en: |-
        This produces the right metric, but each PutMetricData call is an additional API call in the request path, which the requirements rule out.
references:
  - title: "Embedding metrics within logs - Amazon CloudWatch"
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/CloudWatch_Embedded_Metric_Format.html
