id: aipc01-3b-pii-stage-services
objective: "3.2.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A health insurer is launching a member chat assistant on Amazon Bedrock. The privacy team has two requirements. First, it must know which of the existing Amazon S3 datasets prepared for fine-tuning contain PII. Second, member names and phone numbers that appear in live prompts and responses must be masked at run time. The team wants managed services and the LEAST custom code.

    Which combination of solutions will meet these requirements? (Choose two.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Run Amazon Macie sensitive data discovery on the buckets that contain the fine-tuning datasets.
    - id: b
      text:
        en: |-
          Create a CloudWatch Logs data protection policy on the assistant's application log group to mask names and phone numbers.
    - id: c
      text:
        en: |-
          Run an Amazon Comprehend asynchronous PII redaction job on each chat message as it arrives.
    - id: d
      text:
        en: |-
          Attach a guardrail with a sensitive information filter that anonymizes NAME and PHONE in prompts and responses.
    - id: e
      text:
        en: |-
          Configure the guardrail's sensitive information filter to scan the fine-tuning buckets before each customization job.
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: |-
      Macie is the managed service that finds sensitive data in S3 objects, so it identifies the datasets that contain PII. Guardrails sensitive information filters inspect prompts and responses at run time and can replace detected names and phone numbers with their types.
  options:
    b:
      en: |-
        A log data protection policy masks log events only; the prompts and responses that members and the model exchange are unchanged.
    c:
      en: |-
        Comprehend redaction runs only as an asynchronous job on documents in Amazon S3, which does not fit masking of live chat messages.
    e:
      en: |-
        Guardrails evaluate text sent to them at inference time; they do not scan S3 buckets.
references:
  - title: What is Amazon Macie? - Amazon Macie
    url: https://docs.aws.amazon.com/macie/latest/user/what-is-macie.html
  - title: Remove PII from conversations by using sensitive information filters - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/guardrails-sensitive-filters.html
