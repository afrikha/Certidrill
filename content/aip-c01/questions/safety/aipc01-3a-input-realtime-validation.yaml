id: aipc01-3a-input-realtime-validation
objective: "3.1.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |-
    A legal research company exposes an FM-based summarization service through an Amazon API Gateway REST API with a Lambda integration that calls Amazon Bedrock. Malformed requests and requests whose text field exceeds 20,000 characters must be rejected before the Lambda function runs. Prompts that the company's existing guardrail would block must be rejected before any model is invoked.

    Which combination of steps will meet these requirements? (Choose two.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Turn on Amazon Bedrock model invocation logging and reject requests whose logged input exceeds the size limit.
    - id: b
      text:
        en: |-
          Attach a request validator and a JSON schema model with a maxLength constraint to the API method.
    - id: c
      text:
        en: |-
          Configure the guardrail with only output actions set to BLOCK so that blocked content never reaches the client.
    - id: d
      text:
        en: |-
          Create a CloudWatch alarm on the guardrail InvocationsIntervened metric that disables the API stage when it fires.
    - id: e
      text:
        en: |-
          In the Lambda function, call ApplyGuardrail with the source set to INPUT and invoke the model only when no intervention occurs.
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: |-
      An API Gateway request validator checks the request body against a JSON schema model and returns an error before the integration runs, so malformed or oversized requests never reach Lambda. ApplyGuardrail evaluates the prompt against the guardrail without invoking a model, so the function can stop before inference when the guardrail intervenes.
  options:
    a:
      en: |-
        Invocation logging records requests that were already sent to the model; it cannot reject them.
    c:
      en: |-
        Output actions filter responses after the model has run; they do not reject prompts.
    d:
      en: |-
        An alarm notifies after the fact; it does not reject individual requests, and disabling the stage would stop legitimate traffic too.
references:
  - title: Use the ApplyGuardrail API in your application - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/guardrails-use-independent-api.html
