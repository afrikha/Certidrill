id: aipc01-3b-vpce-policy-source-vpce
objective: "3.2.1"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    A financial services company calls Amazon Bedrock from applications in a VPC through an interface VPC endpoint for bedrock-runtime. The endpoint uses the default endpoint policy. The security team has two requirements. First, requests that pass through the endpoint must be limited to invoking two approved foundation models. Second, if the access keys of the applications' IAM role are leaked, they must not be usable to call Amazon Bedrock from outside the endpoint.

    Which combination of steps will meet these requirements? (Choose two.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Replace the default endpoint policy with one that allows only bedrock:InvokeModel and bedrock:InvokeModelWithResponseStream on the two model ARNs.
    - id: b
      text:
        en: |-
          Enable private DNS on the interface endpoint so that the SDK sends every Amazon Bedrock request through the endpoint by default.
    - id: c
      text:
        en: |-
          Attach a security group to the interface endpoint that allows inbound HTTPS only from the CIDR ranges of the application subnets.
    - id: d
      text:
        en: |-
          Attach a statement to the applications' IAM role that denies bedrock:* when the aws:SourceVpce condition key does not equal the ID of the endpoint.
    - id: e
      text:
        en: |-
          Enable model invocation logging, and create a CloudWatch alarm that fires when an invocation comes from an unknown source IP address.
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: |-
      The endpoint policy controls what can be done through the endpoint (the default policy allows full access), so restricting it to the invoke actions on the two model ARNs meets the first requirement. A deny statement with an aws:SourceVpce condition makes the role's credentials useless for Amazon Bedrock unless the request arrives through the company's endpoint, which meets the second requirement.
  options:
    b:
      en: |-
        Private DNS changes name resolution inside the VPC only; credentials used from another network still reach the public endpoint.
    c:
      en: |-
        The security group controls which clients in the VPC can reach the endpoint, but it does nothing to requests sent with leaked keys to the public endpoint.
    e:
      en: |-
        Logging and alarms detect misuse after it happens; they do not prevent the leaked credentials from being used.
references:
  - title: Use interface VPC endpoints (AWS PrivateLink) to create a private connection between your VPC and Amazon Bedrock - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/vpc-interface-endpoints.html
