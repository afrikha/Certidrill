id: aipc01-3c-counterfactual-eval-combination
objective: "3.4.2"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    A lending company's assistant suggests next steps to loan applicants. The fairness policy requires evidence that applicants whose scenarios differ only in a protected attribute receive equivalent suggestions, and that suggestions contain no stereotypes. The team wants an automated, repeatable evaluation that uses managed Amazon Bedrock features with the LEAST custom code.

    Which combination of actions will meet these requirements? (Choose two.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Run an Amazon SageMaker Clarify bias processing job on the assistant's suggestions with the protected attribute as the facet.
    - id: b
      text:
        en: |-
          Build a JSONL dataset of counterfactual prompt pairs that differ only in the protected attribute, with the same referenceResponse for both prompts of a pair.
    - id: c
      text:
        en: |-
          Configure a guardrail content filter for the Hate category at HIGH strength on the assistant's outputs, and count the interventions.
    - id: d
      text:
        en: |-
          Use the built-in BOLD dataset in an automatic evaluation job instead of the company's own lending scenarios.
    - id: e
      text:
        en: |-
          Run a model-as-a-judge evaluation job with the Builtin.Stereotyping metric and a custom metric whose rubric rates whether the suggested next steps match the reference response.
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: |-
      Counterfactual pairs that share one reference response isolate the protected attribute: an equivalent answer for both prompts should score the same against the same reference. A judge job then scores every response with Builtin.Stereotyping and with a custom metric written for the company's own criterion, and can be rerun on each new model or prompt version.
  options:
    a:
      en: |-
        SageMaker Clarify is no longer open to new customers, and its bias metrics target tabular predictions rather than generated text.
    c:
      en: |-
        A run-time content filter blocks hateful content; it does not compare the suggestions of matched applicants.
    d:
      en: |-
        BOLD prompts are generic open-ended text and do not contain the lending scenarios that the policy is about.
references:
  - title: "Create a prompt dataset for a model evaluation job that uses a model as judge - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/model-evaluation-prompt-datasets-judge.html
  - title: "Use metrics to understand model performance - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/model-evaluation-metrics.html
