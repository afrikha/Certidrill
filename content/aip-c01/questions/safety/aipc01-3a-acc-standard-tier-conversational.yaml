id: aipc01-3a-acc-standard-tier-conversational
objective: "3.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |-
    A travel company in the US East (N. Virginia) Region runs an assistant that answers from retrieved hotel policies in a friendly, conversational style and often reasons across several policies, for example "Because you arrive after 10 PM, the late check-in fee applies." The company wants to keep this style. With a Classic-tier contextual grounding check, many of these correct answers are blocked as ungrounded. Invented answers must still be blocked.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Disable the grounding filter, and rely on the relevance filter to block answers that are not supported by the policies.
    - id: b
      text:
        en: |-
          Keep the Classic tier, and lower the grounding threshold to 0.1 so that conversational answers pass.
    - id: c
      text:
        en: |-
          Instruct the model to quote the hotel policies word for word without reasoning across several policies.
    - id: d
      text:
        en: |-
          Switch the contextual grounding check to the Standard tier with cross-Region inference, and tune the thresholds again.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      The Classic tier applies strict grounding, so reasonable inferences and conversational phrasing lower the score. The Standard tier supports responses with reasoning or conversational content and scores paraphrases more consistently; it requires cross-Region inference, and thresholds must be tested again because the tiers score differently.
  options:
    a:
      en: |-
        The relevance check verifies that the answer addresses the query; it does not detect invented information.
    b:
      en: |-
        A very low threshold would also let invented answers through.
    c:
      en: |-
        This changes the conversational style that the company wants to keep.
references:
  - title: Use contextual grounding check to filter hallucinations in responses - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/guardrails-contextual-grounding-check.html
  - title: Safeguard tiers for guardrails policies - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/guardrails-tiers.html
