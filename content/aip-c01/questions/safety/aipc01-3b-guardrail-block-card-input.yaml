id: aipc01-3b-guardrail-block-card-input
objective: "3.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An e-commerce company's support assistant runs on Amazon Bedrock with the Converse API. Customers sometimes paste full payment card numbers into their messages. The company's policy states that a prompt that contains a card number must never be sent to the model and that the customer must instead receive a fixed message about secure payment channels. Other personal data, such as names, is allowed.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Attach a guardrail with a sensitive information filter that anonymizes CREDIT_DEBIT_CARD_NUMBER in model responses, and leaves prompts unfiltered.
    - id: b
      text:
        en: |-
          Attach a guardrail with a denied topic for payments, and set the blocked input message of the guardrail to the secure payment channels text.
    - id: c
      text:
        en: |-
          Attach a guardrail whose sensitive information filter blocks CREDIT_DEBIT_CARD_NUMBER in prompts, with the payment text as the blocked input message.
    - id: d
      text:
        en: |-
          Send each prompt to an Amazon Comprehend asynchronous PII detection job, and call the model only when the job reports no card number in the prompt.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      With BLOCK as the input action, the guardrail evaluates the prompt before inference and, when a card number is detected, returns the configured blocked message instead of calling the model. The filter applies only to the selected entity type, so names and other content still pass.
  options:
    a:
      en: |-
        An output-only filter lets the prompt, card number included, reach the model; it only masks what the model returns.
    b:
      en: |-
        A denied topic blocks every conversation about payments, including legitimate questions that contain no card number.
    d:
      en: |-
        Asynchronous jobs work on documents in Amazon S3 and take far too long for each chat message.
references:
  - title: Remove PII from conversations by using sensitive information filters - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/guardrails-sensitive-filters.html
