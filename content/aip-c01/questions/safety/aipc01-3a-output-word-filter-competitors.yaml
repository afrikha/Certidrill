id: aipc01-3a-output-word-filter-competitors
objective: "3.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |-
    A consumer electronics company generates product descriptions with an FM on Amazon Bedrock. Legal requires that no description ever mentions any of 300 competitor brand and product names, each one to three words long, which the legal team maintains in a list. Descriptions that contain a listed name must be blocked.

    Which solution will meet these requirements with the LEAST operational overhead?
body:
  options:
    - id: a
      text:
        en: |-
          Create one denied topic per competitor in the guardrail, with that competitor's product names as sample phrases.
    - id: b
      text:
        en: |-
          Add a contextual grounding check to the guardrail with the company's own product catalog as the grounding source.
    - id: c
      text:
        en: |-
          Add the 300 names as custom words in the guardrail's word filter, and set the output action to BLOCK.
    - id: d
      text:
        en: |-
          Run Amazon Comprehend entity detection on each description in a Lambda function, and block descriptions with organization names.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      Word filters block exact words and phrases of up to three words, with up to 10,000 items and case-insensitive whole-word matching, which fits a fixed list of names. With the BLOCK output action, a matching description is replaced by the blocked message.
  options:
    a:
      en: |-
        A guardrail supports up to 30 denied topics, and AWS recommends word filters, not denied topics, for capturing specific names or words.
    b:
      en: |-
        Grounding checks score whether a response is supported by a source and relevant to a query; they do not detect specific names.
    d:
      en: |-
        Entity detection flags every organization name, including the company's own and its partners', and it requires custom code.
references:
  - title: Remove a specific list of words and phrases from conversations with word filters - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/guardrails-word-filters.html
  - title: Block denied topics to help remove harmful content - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/guardrails-denied-topics.html
