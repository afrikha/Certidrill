id: aipc01-3a-adv-random-tag-suffix
objective: "3.1.5"
type: single
difficulty: 3
status: draft
stem:
  en: |-
    A company's assistant calls the Amazon Bedrock InvokeModel API and wraps the user's message in guardrail input tags with the fixed tagSuffix prod01. A red team found that an attacker who types the closing tag for that suffix, followed by new instructions, can place text outside the tags, where the prompt attack filter does not evaluate it. The company must close this gap.

    Which solution will meet this requirement?
body:
  options:
    - id: a
      text:
        en: |-
          Generate a new random alphanumeric tagSuffix for each request, and use it in the tags and in amazon-bedrock-guardrailConfig.
    - id: b
      text:
        en: |-
          Replace the fixed tagSuffix with a 20-character alphanumeric value, and rotate the value at the start of every month.
    - id: c
      text:
        en: |-
          Nest a second pair of input tags inside the first pair so that a single closing tag typed by a user cannot escape from both pairs.
    - id: d
      text:
        en: |-
          Move the system instructions inside the same input tags so that the whole prompt is evaluated by the prompt attack filter.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      A static suffix lets a malicious user close the tag and append content after it. AWS recommends a new, random suffix for every request, which makes the tag structure unpredictable; the suffix is 1 to 20 alphanumeric characters and is passed in tagSuffix.
  options:
    b:
      en: |-
        The value is still static for a month, so an attacker who learns it can keep escaping the tags.
    c:
      en: |-
        Input tags cannot be nested.
    d:
      en: |-
        Developer instructions inside the tags can be flagged as attacks, and the attacker can still close the tag and append text after it.
references:
  - title: Apply tags to user input to filter content - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/guardrails-tagging.html
