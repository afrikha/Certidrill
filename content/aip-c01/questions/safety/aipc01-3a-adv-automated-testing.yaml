id: aipc01-3a-adv-automated-testing
objective: "3.1.5"
type: single
difficulty: 2
status: draft
stem:
  en: |-
    A company updates its assistant's prompt templates and guardrail versions several times a month. After one update, a known jailbreak worked again in production. The company wants every change to be tested automatically against known attacks and benign requests, and the release must stop if detection gets worse or if too many legitimate requests are blocked.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Hire an external firm to run a penetration test of the assistant every quarter, and fix all of its findings before the next release.
    - id: b
      text:
        en: |-
          Deploy each new guardrail version in detect-only mode for one week, and review the detections before switching it to the BLOCK action.
    - id: c
      text:
        en: |-
          Add a CodeBuild stage that runs versioned attack and benign prompt sets from S3 and fails on block-rate or false-positive thresholds.
    - id: d
      text:
        en: |-
          Run an Amazon Bedrock automatic model evaluation job with the Toxicity metric whenever the model of the assistant changes.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      Automated adversarial testing runs standardized sets of attack and benign prompts in the pipeline and compares the detection rate and false-positive rate with baselines, so a regression fails the build before release. New attacks seen in production are added to the versioned set.
  options:
    a:
      en: |-
        A quarterly test misses the changes made several times a month.
    b:
      en: |-
        Changes reach production before they are tested, and the known jailbreak works for the whole week.
    d:
      en: |-
        Toxicity on built-in datasets does not measure attack detection, and the job runs only when the model changes, not when prompts or guardrails change.
references:
  - title: 4. Input validation and guardrails for agentic AI systems on AWS - AWS Prescriptive Guidance
    url: https://docs.aws.amazon.com/prescriptive-guidance/latest/agentic-ai-security/best-practices-input-validation.html
