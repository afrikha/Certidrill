id: aipc01-3c-central-invocation-log-archive
objective: "3.3.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A financial company runs Amazon Bedrock workloads in 12 accounts in one AWS Region. A regulator requires the full text of every prompt and response to be retained for 7 years in a central log-archive account that application teams cannot access or modify. Some applications send requests larger than 100 KB.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          In each workload account, configure model invocation logging with the log-archive account's S3 bucket as the destination, and add a bucket policy that allows the Amazon Bedrock service principal of each workload account to write to it.
    - id: b
      text:
        en: |-
          Create an organization trail in AWS CloudTrail that delivers the Amazon Bedrock management and data events to an S3 bucket in the log-archive account with a 7-year lifecycle rule.
    - id: c
      text:
        en: |-
          In each workload account, log model invocations to an S3 bucket in that account, and copy the logs with S3 Replication to a log-archive bucket that keeps them for 7 years and denies access to application teams.
    - id: d
      text:
        en: |-
          In each workload account, configure model invocation logging to CloudWatch Logs only, and set the retention of the log group to 7 years with a policy that denies access to application teams.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      Model invocation logging captures the full request and response, but it supports only destinations in the same account and Region, and bodies larger than 100 KB are written only to Amazon S3. Logging to a local bucket and replicating it to the log-archive account meets both constraints while the archive stays out of the application teams' reach.
  options:
    a:
      en: |-
        Invocation logging accepts only destinations in the same account and Region, so a bucket in another account cannot be configured.
    b:
      en: |-
        CloudTrail records that a model was called, not the prompt and response text.
    d:
      en: |-
        Bodies larger than 100 KB can be delivered only to Amazon S3, and the logs would stay in accounts that the application teams administer.
references:
  - title: "Monitor model invocation using CloudWatch Logs and Amazon S3 - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/model-invocation-logging.html
  - title: "Monitor Amazon Bedrock API calls using CloudTrail - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/logging-using-cloudtrail.html
