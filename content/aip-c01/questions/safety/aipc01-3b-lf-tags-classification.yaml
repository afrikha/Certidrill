id: aipc01-3b-lf-tags-classification
objective: "3.2.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A healthcare company prepares fine-tuning datasets and RAG corpora from 1,200 tables in 40 databases of its AWS Glue Data Catalog. Each table is classified as public, internal or restricted, and new tables are added every week. Twenty-five data pipeline roles may each read only certain classifications. The security team wants access for new tables to follow their classification automatically, without creating grants table by table.

    Which solution will meet these requirements with the LEAST operational overhead?
body:
  options:
    - id: a
      text:
        en: |-
          Create named-resource Lake Formation grants for each role and table, and add an AWS Lambda function that creates the grants when a table is created.
    - id: b
      text:
        en: |-
          Define a Lake Formation LF-Tag for the classification, assign it to databases and override it on tables where needed, and grant each role SELECT on tag values.
    - id: c
      text:
        en: |-
          Add IAM tags with the classification to the tables, and attach IAM policies with aws:ResourceTag conditions on the AWS Glue and Athena actions to each role.
    - id: d
      text:
        en: |-
          Enable Amazon Macie automated sensitive data discovery on the data lake buckets, and use the findings to restrict each role's access to the classified tables.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      Lake Formation tag-based access control is the recommended method for large numbers of Data Catalog objects. Tables inherit LF-Tags from their database, inherited values can be overridden, and a grant on a tag value applies to every resource that carries it, including tables created later.
  options:
    a:
      en: |-
        Named-resource grants need one grant per role and table (thousands here) plus custom code to maintain them, which is the overhead LF-Tags remove.
    c:
      en: |-
        IAM tags are not LF-Tags and are not interchangeable with them: Lake Formation permissions are granted on LF-Tags, so IAM tag conditions do not control data access to these tables.
    d:
      en: |-
        Macie finds sensitive data in S3 objects and publishes findings; it does not grant or restrict access to Data Catalog tables.
references:
  - title: Lake Formation tag-based access control - AWS Lake Formation
    url: https://docs.aws.amazon.com/lake-formation/latest/dg/tag-based-access-control.html
