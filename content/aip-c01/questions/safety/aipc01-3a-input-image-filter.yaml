id: aipc01-3a-input-image-filter
objective: "3.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |-
    An insurance company built a claims assistant with the Amazon Bedrock Converse API and a multimodal model. Customers upload photos of damaged property together with a text question. Uploads that contain sexual or violent imagery must be blocked and answered with a fixed message. The company wants to keep a single API call per request.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Send each photo to Amazon Comprehend DetectToxicContent from a Lambda function, and call the Converse API only for photos that pass.
    - id: b
      text:
        en: |-
          Enable the Sexual and Violence content filters for the image modality on input in the guardrail that the Converse request references.
    - id: c
      text:
        en: |-
          Enable sensitive information filters for image input in the guardrail that the Converse request references so that unsafe photos are blocked.
    - id: d
      text:
        en: |-
          Enable the managed profanity word list on input in the guardrail that the Converse request references so that unsafe photos are blocked.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      Guardrail content filters can evaluate text and images, and each category is configured per direction. Enabling the Sexual and Violence categories for images on input blocks unsafe photos in the same Converse call and returns the configured blocked input message.
  options:
    a:
      en: |-
        DetectToxicContent analyzes English text segments, not images, and the extra call breaks the single-call requirement.
    c:
      en: |-
        Sensitive information filters evaluate text only and detect PII, not sexual or violent imagery.
    d:
      en: |-
        Word filters match words and phrases in text; they cannot classify the content of a photo.
references:
  - title: Block harmful words and conversations with content filters - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/guardrails-content-filters.html
  - title: Trust and safety - Amazon Comprehend
    url: https://docs.aws.amazon.com/comprehend/latest/dg/trust-safety.html
