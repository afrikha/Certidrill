id: aipc01-3c-flows-prompt-node-guardrail
objective: "3.4.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company runs a claims-triage workflow as an Amazon Bedrock flow. A knowledge base node retrieves policy passages, and a prompt node uses them to draft the reply that is sent to the customer. The company's responsible AI policy requires the corporate guardrail to filter every reply that the flow drafts. The company wants the LEAST custom code.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Configure the guardrail on the knowledge base node so that it also filters the reply that the prompt node drafts from the retrieved passages.
    - id: b
      text:
        en: |-
          Add a Lambda function node after the prompt node that calls the ApplyGuardrail API on the drafted reply and returns the filtered result.
    - id: c
      text:
        en: |-
          Add a Deny statement with the bedrock:GuardrailIdentifier condition key to the flow's service role so that unfiltered replies are rejected.
    - id: d
      text:
        en: |-
          Set the guardrail ID and version in the guardrailConfiguration of the prompt node so that the prompt and its generated reply are filtered.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      A prompt node accepts a guardrailConfiguration with the guardrail identifier and version, which applies the guardrail to the prompt and to the response generated from it. This is configuration only, with no extra node or code.
  options:
    a:
      en: |-
        A knowledge base node can apply a guardrail only when it uses RetrieveAndGenerate, and that guardrail would not filter the reply drafted later by the prompt node.
    b:
      en: |-
        This works, but it adds a Lambda function and code that the prompt node's built-in guardrail setting makes unnecessary.
    c:
      en: |-
        A condition key denies calls that do not carry the guardrail; it does not apply the guardrail, so the flow would fail instead of filtering replies.
references:
  - title: "Node types for your flow - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/flows-nodes.html
