id: aipc01-3b-lf-column-filter-corpus
objective: "3.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A bank builds a RAG corpus with an AWS Glue ETL job that reads a customer_interactions table from its data lake. The table is registered in the AWS Glue Data Catalog and governed by AWS Lake Formation. The table contains ssn and date_of_birth columns that must never reach the corpus, while analysts must keep their full access to the table. The bank wants the LEAST operational overhead.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Schedule a nightly job that writes a copy of the table without the two columns, and grant the ETL job's role access to the copy only.
    - id: b
      text:
        en: |-
          Add an S3 bucket policy statement that denies the ETL job's role access to the objects that contain the ssn and date_of_birth values.
    - id: c
      text:
        en: |-
          Grant the ETL job's IAM role the Lake Formation SELECT permission on the table with a column filter that excludes ssn and date_of_birth.
    - id: d
      text:
        en: |-
          Attach an Amazon Bedrock guardrail with sensitive information filters for SSNs and ages to the knowledge base that indexes the corpus.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      Lake Formation data filtering provides column-level security: a SELECT grant that excludes columns returns every other column to the principal, and integrated engines such as AWS Glue enforce it. The analysts' grants are unchanged, and no data is copied.
  options:
    a:
      en: |-
        A filtered copy works but duplicates data and adds a job to build, schedule and monitor, which is more overhead than a column filter.
    b:
      en: |-
        The sensitive values are columns inside the same objects as the other data, so an object-level bucket policy cannot hide them without blocking the whole table.
    d:
      en: |-
        A guardrail filters prompts and responses at inference time; the ETL job would still read the sensitive columns and write them into the corpus.
references:
  - title: Data filtering and cell-level security in Lake Formation - AWS Lake Formation
    url: https://docs.aws.amazon.com/lake-formation/latest/dg/data-filtering.html
  - title: What is AWS Lake Formation? - AWS Lake Formation
    url: https://docs.aws.amazon.com/lake-formation/latest/dg/what-is-lake-formation.html
