id: aipc01-3a-output-masked-vs-blocked
objective: "3.1.2"
type: single
difficulty: 3
status: draft
stem:
  en: |-
    An e-commerce company's assistant uses the Amazon Bedrock Converse API with a guardrail. A sensitive information filter masks email addresses in responses with the ANONYMIZE action, and denied topics block some responses. The product team wants two separate daily counts: responses that were masked and responses that were blocked. Security policy forbids storing detected PII values in any log.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Count responses with the stopReason guardrail_intervened as blocked, and count responses whose output contains a placeholder such as {EMAIL} as masked.
    - id: b
      text:
        en: |-
          Turn on model invocation logging to CloudWatch Logs, and count masked and blocked responses with a CloudWatch Logs Insights query.
    - id: c
      text:
        en: |-
          Enable trace, classify each intervention in the application from the trace actions (ANONYMIZED or BLOCKED), and publish only counts as custom metrics.
    - id: d
      text:
        en: |-
          Enable trace, write the full guardrail trace of every response to a CloudWatch Logs log group, and count the entries with Logs Insights.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      Masking also returns the stopReason guardrail_intervened, so the application must read the trace: each sensitiveInformationPolicy entry has the action ANONYMIZED or BLOCKED, and the topic policy reports BLOCKED. Publishing only the counts keeps PII out of logs, because the trace itself contains the unmasked values.
  options:
    a:
      en: |-
        Masked responses also report guardrail_intervened, so every masked response is counted as blocked as well, and the two numbers are wrong.
    b:
      en: |-
        Guardrail masking does not apply to model invocation logs, which contain the original, unmodified request, so this stores PII in logs.
    d:
      en: |-
        The trace returns unmasked values, such as the match field of each detected entity, so writing it to a log group stores PII.
references:
  - title: Include a guardrail with the Converse API - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/guardrails-use-converse-api.html
  - title: Remove PII from conversations by using sensitive information filters - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/guardrails-sensitive-filters.html
