id: aipc01-3c-enforcement-exclude-embeddings
objective: "3.3.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company enforces a corporate guardrail on all Amazon Bedrock inference in its organization through an Amazon Bedrock policy whose included_models list is set to ALL. Teams use Amazon Titan Text Embeddings V2 to embed internal documents for vector search. The governance board decided that the corporate guardrail must not evaluate the embedding requests. Every text generation model, including models that become available in Amazon Bedrock later, must stay covered.

    Which change will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Replace ALL in included_models with the list of the text generation models that the teams use today.
    - id: b
      text:
        en: |-
          Add amazon.titan-embed-text-v2:0 to the excluded_models list of the model_enforcement section, and keep ALL in included_models.
    - id: c
      text:
        en: |-
          Set the system and messages controls of selective_content_guarding to selective in the Amazon Bedrock policy.
    - id: d
      text:
        en: |-
          Move the embedding workloads to one account, and configure account-level enforcement there with a guardrail that has no filters.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      The model_enforcement section of the Amazon Bedrock policy accepts included and excluded model lists, and a model that appears in both lists is excluded. Keeping ALL in included_models covers new models automatically, while the embedding model ID in excluded_models removes it from enforcement, as in AWS's own example.
  options:
    a:
      en: |-
        An explicit list would leave models added later without the guardrail until someone updates the policy.
    c:
      en: |-
        Selective content guarding controls how system prompts and messages are evaluated; it does not select models.
    d:
      en: |-
        Organization-level, account-level and request-level guardrails all apply, so the organization guardrail would still evaluate the embedding requests.
references:
  - title: "Apply cross-account safeguards with Amazon Bedrock Guardrails enforcements - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/guardrails-enforcements.html
