id: aipc01-3a-acc-grounding-threshold-tune
objective: "3.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |-
    A pharmaceutical company's RAG assistant uses an Amazon Bedrock guardrail with a contextual grounding check whose grounding threshold is 0.95. On a labeled test set, correct answers score between 0.78 and 0.92, and answers with invented facts score between 0.20 and 0.45. Most correct answers are currently blocked. The company wants to keep blocking invented facts while allowing correct answers.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Lower the grounding threshold to 0.7, and run the labeled test set again to confirm the results.
    - id: b
      text:
        en: |-
          Raise the grounding threshold to 1 so that only answers that exactly match the source are allowed.
    - id: c
      text:
        en: |-
          Keep the grounding threshold at 0.95, and set the action of the grounding filter to NONE.
    - id: d
      text:
        en: |-
          Disable the grounding filter, and keep only the relevance filter with a threshold of 0.95.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      Responses that score below the threshold are flagged, and higher thresholds block more content, including valid answers. A threshold between the two score ranges, such as 0.7, blocks invented answers and allows correct ones; running the test set again confirms the choice.
  options:
    b:
      en: |-
        Thresholds range from 0 to 0.99; a threshold of 1 is invalid because it would block all content.
    c:
      en: |-
        The NONE action only reports detections, so answers with invented facts would reach users.
    d:
      en: |-
        The relevance check verifies that the answer addresses the query; it does not detect invented facts.
references:
  - title: Use contextual grounding check to filter hallucinations in responses - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/guardrails-contextual-grounding-check.html
