id: aipc01-3c-counterfactual-variables
objective: "3.4.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A healthcare company wants to test whether its triage assistant gives different advice when only the patient's gender or ethnicity changes. The prompt template is stored in Amazon Bedrock Prompt Management. The team wants to generate matched prompt pairs from the same clinical scenario systematically, without maintaining separate copies of the template text.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Create one prompt variant for each gender and ethnicity value, each with its own copy of the template text, and compare the outputs.
    - id: b
      text:
        en: |-
          Create a new prompt version for each gender and ethnicity value, and compare the outputs of the versions in the prompt builder.
    - id: c
      text:
        en: |-
          Add gender and ethnicity variables to the template, and render the same scenario with each value to build counterfactual pairs.
    - id: d
      text:
        en: |-
          Add a guardrail denied topic for gender and ethnicity so that the model ignores these attributes in its advice.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      Prompt Management variables are placeholders whose values are supplied at test time or at run time, so one template renders the same scenario with each attribute value. Comparing the outputs of these counterfactual pairs isolates the effect of the attribute.
  options:
    a:
      en: |-
        Variants are alternative configurations of a prompt, such as different messages or models; copying the text into each variant is the duplication the team wants to avoid.
    b:
      en: |-
        Versions are saved snapshots of the template over time, not a way to substitute attribute values into one scenario.
    d:
      en: |-
        A denied topic would block the clinical questions instead of measuring whether the advice differs.
references:
  - title: "Construct and store reusable prompts with Prompt management in Amazon Bedrock - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/prompt-management.html
