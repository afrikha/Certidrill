id: aipc01-3a-input-guardcontent-latest-turn
objective: "3.1.1"
type: single
difficulty: 3
status: draft
stem:
  en: |-
    A telecom company's support chatbot uses the Amazon Bedrock Converse API with a guardrail. Each request sends a long list of troubleshooting instructions, the full conversation history, and the newest user message as text content blocks. Guardrail costs grow with the length of each conversation, although earlier turns were already checked when the user sent them. The company wants to limit guardrail evaluation to the newest user message without changing the guardrail.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Wrap the newest user message in amazon-bedrock-guardrails-guardContent XML tags and set a matching tagSuffix in the request.
    - id: b
      text:
        en: |-
          Set trace to disabled in the guardrailConfig of the request so that the history and instructions are not assessed.
    - id: c
      text:
        en: |-
          Put the newest user message in a guardContent content block and keep the history and instructions in plain text blocks.
    - id: d
      text:
        en: |-
          Check the newest user message with ApplyGuardrail and the source set to OUTPUT, and call Converse without a guardrail.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      Once a guardContent block appears in the messages, the guardrail evaluates only the content inside guardContent blocks and skips the other content blocks. Wrapping only the newest message limits evaluation, and its cost, to that turn; a system prompt is evaluated only if it is wrapped too.
  options:
    a:
      en: |-
        XML input tags apply to InvokeModel and InvokeModelWithResponseStream; with the Converse API the equivalent is a guardContent block.
    b:
      en: |-
        The trace setting only controls whether assessment details are returned; it does not change which content is evaluated.
    d:
      en: |-
        OUTPUT is meant for model responses, and calling Converse without the guardrail removes the filtering of the model's answers.
references:
  - title: Include a guardrail with the Converse API - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/guardrails-use-converse-api.html
  - title: Apply tags to user input to filter content - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/guardrails-tagging.html
