id: aipc01-3c-agentcore-observability-new-agent
objective: "3.4.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company is building a new customer support agent with Strands Agents and will host it on Amazon Bedrock AgentCore Runtime. Engineers and auditors need step-by-step traces of each agent session, including model calls and tool calls with their timing, and CloudWatch dashboards that show latency, token usage, and error rates.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Build the agent with Amazon Bedrock Agents instead of Strands Agents, and set enableTrace to true in each InvokeAgent request.
    - id: b
      text:
        en: |-
          Enable model invocation logging in the account, and build CloudWatch dashboards from CloudWatch Logs Insights queries on the invocation logs.
    - id: c
      text:
        en: |-
          Turn on CloudWatch Transaction Search, add the AWS Distro for OpenTelemetry (ADOT) SDK to the agent, and use AgentCore Observability.
    - id: d
      text:
        en: |-
          Enable CloudTrail logging for Amazon Bedrock AgentCore, and visualize the recorded events in an Amazon Quick dashboard.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      AgentCore Observability emits OpenTelemetry-compatible traces that show each step of the agent workflow and provides CloudWatch dashboards with session count, latency, duration, token usage and error rates. It requires the one-time CloudWatch Transaction Search setup and the ADOT SDK in the agent code.
  options:
    a:
      en: |-
        Amazon Bedrock Agents is now Agents Classic and is closed to new customers since July 30, 2026; new agents should use AgentCore.
    b:
      en: |-
        Invocation logs record individual model calls, not the agent's tool calls and steps as a trace.
    d:
      en: |-
        CloudTrail records who called AgentCore APIs and when; it does not contain the steps of an agent session.
references:
  - title: "Observability, audit logging, and tracing for your agents - Amazon Bedrock AgentCore"
    url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/observability.html
  - title: "Add observability to your Amazon Bedrock AgentCore resources - Amazon Bedrock AgentCore"
    url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/observability-configure.html
