id: aipc01-3b-include-for-embedding
objective: "3.3.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A bank's knowledge base has an Amazon S3 data source in which every document has a .metadata.json file with source_system and document_owner attributes. Both attributes are set with includeForEmbedding set to true. The team notices that passages from the same owner rank higher for unrelated questions. The attributes must stay available for source attribution and for metadata filters, but they must no longer influence semantic search results.

    Which solution will meet these requirements with the LEAST effort?
body:
  options:
    - id: a
      text:
        en: |-
          Delete the metadata files, store the attributes in a DynamoDB table keyed by S3 URI, and look them up after each retrieval.
    - id: b
      text:
        en: |-
          Set includeForEmbedding to false for both attributes in the metadata files, and sync the data source again.
    - id: c
      text:
        en: |-
          Enable a reranker model in the retrieval configuration so that the final ranking ignores the attributes.
    - id: d
      text:
        en: |-
          Rename the attributes with a leading underscore so that the knowledge base treats them as reserved metadata fields.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      With includeForEmbedding set to true, the key-value pair is concatenated to the chunk text before embedding, so it affects similarity. With false, only the chunk text is embedded while the metadata is still stored for filtering and returned with results; a new sync re-embeds the chunks.
  options:
    a:
      en: |-
        Moving the attributes out of the knowledge base removes them from metadata filtering and adds custom lookup code.
    c:
      en: |-
        A reranker reorders the candidates but the vectors still contain the attributes, so retrieval of candidates remains biased.
    d:
      en: |-
        Reserved fields are defined by the service and cannot be overridden; renaming the attributes does not change how they are embedded.
references:
  - title: Connect to Amazon S3 for your knowledge base - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/s3-data-source-connector.html
