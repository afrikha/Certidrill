id: aipc01-3b-iam-inference-profile
objective: "3.2.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company's application role calls a foundation model through a geographic cross-Region inference profile that routes requests to three AWS Regions. The security team wants a least-privilege IAM policy. The role must be able to invoke the model only through that inference profile and must not be able to invoke the model directly in any single Region.

    Which policy will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Allow bedrock:InvokeModel* only on the ARN of the inference profile, and do not list any foundation-model ARN in the policy statements.
    - id: b
      text:
        en: |-
          Allow bedrock:InvokeModel* on the foundation-model ARNs of the model in all three Regions, without any condition on how the request reaches the model.
    - id: c
      text:
        en: |-
          Allow bedrock:InvokeModel* on the ARN of the inference profile and on the foundation-model ARN of the model in the source Region only.
    - id: d
      text:
        en: |-
          Allow bedrock:InvokeModel* on the profile ARN, and on the model ARNs in the three Regions with a bedrock:InferenceProfileArn condition on the profile.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      When an inference profile is in the Resource element, the policy must also allow the foundation model in each Region the profile routes to. Adding the bedrock:InferenceProfileArn condition to the foundation-model statement allows those models only when the request comes through the named profile, so direct invocation is denied.
  options:
    a:
      en: |-
        The profile ARN alone is not enough: requests that the profile routes to a Region also need permission on the foundation model in that Region, so they fail.
    b:
      en: |-
        Without the condition, the role can invoke the model directly in each Region, which the security team wants to prevent.
    c:
      en: |-
        Requests routed to the two other Regions are denied because their foundation-model ARNs are missing, and the unconditioned source-Region ARN allows direct invocation there.
references:
  - title: Prerequisites for inference profiles - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/inference-profiles-prereq.html
