id: aipc01-3c-predeploy-compliance-lambda
objective: "3.4.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company deploys generative AI applications through AWS CodePipeline. Its responsible AI policy requires that, before a release reaches production, the release configuration references a model on the approved list and a numeric guardrail version that includes a prompt attack filter, and that model invocation logging is enabled in the target account. A release that fails any check must not be deployed. The company wants the LEAST manual effort.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Add a manual approval action in which a reviewer checks the release configuration against a written compliance checklist before the deployment stage.
    - id: b
      text:
        en: |-
          Deploy an AWS Config rule that evaluates the production account every 24 hours and sends the violations that it finds to an Amazon SNS topic.
    - id: c
      text:
        en: |-
          Add a pipeline action that invokes a Lambda function, which checks the configuration with the Amazon Bedrock APIs and reports a job failure when a check fails.
    - id: d
      text:
        en: |-
          Add an instruction to the application's system prompt that tells the model to refuse all requests when no guardrail is attached to the call.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      A Lambda invoke action receives the pipeline job, runs any checks, and reports the result with PutJobSuccessResult or PutJobFailureResult, so a failed check fails the action before the deployment stage. The function can read the guardrail version and its policies and the invocation logging configuration through the Amazon Bedrock APIs.
  options:
    a:
      en: |-
        A manual checklist review is slower and error-prone, which is the manual effort the company wants to avoid.
    b:
      en: |-
        A daily Config evaluation runs after deployment; it does not stop a non-compliant release.
    d:
      en: |-
        A model cannot verify the request configuration, and an instruction is not a deployment control.
references:
  - title: "Invoke an AWS Lambda function in a pipeline in CodePipeline - AWS CodePipeline"
    url: https://docs.aws.amazon.com/codepipeline/latest/userguide/actions-invoke-lambda-function.html
  - title: "Monitor model invocation using CloudWatch Logs and Amazon S3 - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/model-invocation-logging.html
