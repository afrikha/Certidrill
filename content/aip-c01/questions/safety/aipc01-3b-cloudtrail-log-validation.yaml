id: aipc01-3b-cloudtrail-log-validation
objective: "3.3.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A financial regulator audits a bank's GenAI applications. The bank's CloudTrail trail delivers the audit logs of all Amazon Bedrock activity to an Amazon S3 bucket. The regulator requires the bank to prove that no log file was modified or deleted after CloudTrail delivered it.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Enable log file integrity validation on the trail, and validate the log files against the digest files with the AWS CLI.
    - id: b
      text:
        en: |-
          Enable S3 Versioning on the trail's bucket so that every earlier version of a modified or overwritten log file is kept for the auditors.
    - id: c
      text:
        en: |-
          Encrypt the log files with SSE-KMS by using a customer managed key that only the security team is allowed to use.
    - id: d
      text:
        en: |-
          Send the trail's events to a CloudWatch Logs log group in addition to the S3 bucket, and compare the two copies.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      With log file integrity validation, CloudTrail hashes every log file with SHA-256 and delivers hourly digest files signed with SHA-256 with RSA, each referencing the previous digest. Validating the files against the digests shows whether each log file was modified, deleted or unchanged after delivery.
  options:
    b:
      en: |-
        Versioning keeps earlier versions but does not prove anything: a version can still be deleted, and nothing shows that the current file is the one CloudTrail delivered.
    c:
      en: |-
        Encryption protects confidentiality; it does not detect whether a file was replaced or removed.
    d:
      en: |-
        A second copy in CloudWatch Logs does not prove that the files in the bucket are unaltered.
references:
  - title: Validating CloudTrail log file integrity - AWS CloudTrail
    url: https://docs.aws.amazon.com/awscloudtrail/latest/userguide/cloudtrail-log-file-validation-intro.html
