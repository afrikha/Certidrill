id: aipc01-3b-data-retention-none
objective: "3.2.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A healthcare company calls Amazon Bedrock through the bedrock-runtime endpoint in the eu-central-1 and eu-west-1 Regions. A regulator requires that AWS writes no request or response data to durable storage for these workloads, including for abuse review. The company has never changed the data retention configuration of its account. The company wants a configuration that applies to every request in both Regions.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Delete the model invocation logging configuration in both Regions so that Amazon Bedrock stops storing prompts and responses.
    - id: b
      text:
        en: |-
          Set the account's data retention mode to none in each of the two Regions, and use only models that allow the none mode.
    - id: c
      text:
        en: |-
          Set the account's data retention mode to none in eu-central-1 only, because the account setting propagates to the other Regions.
    - id: d
      text:
        en: |-
          Attach a guardrail that anonymizes all PII types in prompts and responses so that only masked content can be retained.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      Amazon Bedrock data retention is a per-Region mode, and the none mode means no request or response data is written to durable storage by AWS. A new account is at inherit, so the model default applies until the mode is set; a model that requires retention for review becomes unavailable when the effective mode is none, so the company must use models that allow it.
  options:
    a:
      en: |-
        Invocation logging is off by default and writes to the customer's own log group or bucket; deleting it does not change what AWS retains.
    c:
      en: |-
        The retention setting governs only the Region where it is set and does not propagate, so eu-west-1 would stay at inherit.
    d:
      en: |-
        Masking PII reduces sensitivity but does not stop retention of the masked requests and responses, which the regulator forbids.
references:
  - title: Data retention - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/data-retention.html
