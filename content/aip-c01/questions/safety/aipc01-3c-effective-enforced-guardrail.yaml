id: aipc01-3c-effective-enforced-guardrail
objective: "3.3.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An auditor asks a company to prove which Amazon Bedrock guardrail is enforced on model invocations in one specific member account. The company enforces guardrails through Amazon Bedrock policies that are attached at several levels of its AWS Organizations hierarchy.

    Which action provides this information?
body:
  options:
    - id: a
      text:
        en: |-
          Call the AWS Organizations DescribeEffectivePolicy API for the Amazon Bedrock policy type with the member account ID as the target.
    - id: b
      text:
        en: |-
          Call ListGuardrails in the member account, and report the guardrail that has the most recent numeric version as the enforced guardrail.
    - id: c
      text:
        en: |-
          Search the organization trail in AWS CloudTrail for the most recent AttachPolicy event for the account's OU, and report the Bedrock policy that it attached.
    - id: d
      text:
        en: |-
          Call GetModelInvocationLoggingConfiguration in the member account, and read the guardrail ARN from the logging configuration.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      AWS Organizations resolves the Amazon Bedrock policies attached at different levels into one effective policy through inheritance. DescribeEffectivePolicy with the account ID as the target returns that resolved policy, including the enforced guardrail version per Region; the member account's Guardrails console page also shows the organization-level enforced guardrails.
  options:
    b:
      en: |-
        Guardrails created in the member account are not necessarily enforced, and the enforced guardrail lives in the management account.
    c:
      en: |-
        Several policies can apply through inheritance, so the most recent attachment does not show the resolved result for the account.
    d:
      en: |-
        The invocation logging configuration describes log destinations and data types; it contains no guardrail.
references:
  - title: "Apply cross-account safeguards with Amazon Bedrock Guardrails enforcements - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/guardrails-enforcements.html
