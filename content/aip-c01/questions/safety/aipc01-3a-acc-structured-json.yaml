id: aipc01-3a-acc-structured-json
objective: "3.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |-
    A claims-processing company uses an FM on Amazon Bedrock to summarize claim documents into a JSON object that a downstream system ingests. About 2% of responses are not valid JSON or miss required fields, which stops the pipeline. The company wants every response to conform to its JSON schema without adding retry logic.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Pass the JSON schema in outputConfig.textFormat of the Converse request, with additionalProperties set to false on every object.
    - id: b
      text:
        en: |-
          Add the JSON schema and three example outputs to the system prompt of the Converse request, and set the temperature to 0.
    - id: c
      text:
        en: |-
          Validate each response in a Lambda function, and call the model again with the validation errors until the response is valid.
    - id: d
      text:
        en: |-
          Prefill the assistant turn of the Converse request with an opening brace so that the model always starts its answer in JSON.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      Structured outputs make the response conform to the supplied JSON schema; with the Converse API the schema goes in outputConfig.textFormat. Every object in the schema must set additionalProperties to false, otherwise the request is rejected with a ValidationException.
  options:
    b:
      en: |-
        Schema guidance in the prompt improves the format but does not guarantee it, so invalid responses still occur.
    c:
      en: |-
        This is the retry logic that the company wants to avoid, and it adds latency and cost.
    d:
      en: |-
        A prefill only fixes the first character; the rest of the response is not constrained to the schema.
references:
  - title: Get validated JSON results from models - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/structured-output.html
