id: aipc01-3b-guardrail-anonymize-output
objective: "3.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A telecom company has an Amazon Bedrock knowledge base of customer case notes. The claims team's assistant must keep showing customers' email addresses and phone numbers. A new training assistant for junior agents uses the same knowledge base and must answer questions about past cases, but its responses must never show email addresses or phone numbers. The company wants the LEAST operational overhead.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Attach a guardrail to the training assistant's calls with a sensitive information filter that blocks EMAIL and PHONE in model responses.
    - id: b
      text:
        en: |-
          Run an Amazon Comprehend PII redaction job on the case notes every night, and re-sync the knowledge base from the redacted output.
    - id: c
      text:
        en: |-
          Add an instruction to the training assistant's system prompt that forbids the model to include contact details in its answers.
    - id: d
      text:
        en: |-
          Attach a guardrail to the training assistant's calls with a sensitive information filter that anonymizes EMAIL and PHONE in model responses.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      The ANONYMIZE action replaces detected entities in the response with their type, such as {EMAIL} or {PHONE}, so the answer is still returned. Because the guardrail is applied per call, only the training assistant is affected and the shared knowledge base keeps the original notes for the claims team.
  options:
    a:
      en: |-
        BLOCK replaces the whole response with the blocked message whenever a contact detail appears, so many valid answers about past cases would be lost.
    b:
      en: |-
        Redacting the shared source would also remove the contact details that the claims team still needs, and it adds a recurring job.
    c:
      en: |-
        A prompt instruction is not a reliable control; the model can still reproduce contact details from the retrieved notes.
references:
  - title: Remove PII from conversations by using sensitive information filters - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/guardrails-sensitive-filters.html
