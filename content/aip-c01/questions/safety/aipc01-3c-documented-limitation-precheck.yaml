id: aipc01-3c-documented-limitation-precheck
objective: "3.4.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    The SageMaker model card of a company's claims summarizer, which is built on an Amazon Bedrock model, states that the summarizer was evaluated only on English documents and must not be used for other languages. Claims now arrive in several languages through the same API. The responsible AI policy requires the application to enforce the documented limitation automatically and to record every rejected request.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Add a Lambda function before the model call that calls Amazon Comprehend DetectDominantLanguage, routes non-English claims to manual processing, and records each rejection.
    - id: b
      text:
        en: |-
          Add an instruction to the system prompt that tells the model to refuse documents that are not written in English and to explain the reason to the user.
    - id: c
      text:
        en: |-
          Add a denied topic named Non-English content to the summarizer's guardrail so that the guardrail blocks every claim that is written in a language other than English.
    - id: d
      text:
        en: |-
          Update the model card to list the additional languages so that the use of the summarizer with those languages is documented and approved.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      DetectDominantLanguage returns the dominant language code of a text with a confidence score in real time, so a pre-processing function can enforce the documented scope deterministically before the model is invoked. Routing the claims elsewhere and publishing a metric records each rejection for audits.
  options:
    b:
      en: |-
        A prompt instruction is not a deterministic control, and it records nothing for audits.
    c:
      en: |-
        Denied topics detect subjects, not the language a document is written in.
    d:
      en: |-
        Changing the documentation without evaluating the model on those languages hides the limitation instead of enforcing it.
references:
  - title: "Dominant language - Amazon Comprehend"
    url: https://docs.aws.amazon.com/comprehend/latest/dg/how-languages.html
  - title: "Amazon SageMaker Model Cards - Amazon SageMaker AI"
    url: https://docs.aws.amazon.com/sagemaker/latest/dg/model-cards.html
