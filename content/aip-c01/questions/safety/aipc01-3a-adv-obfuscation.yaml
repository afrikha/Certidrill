id: aipc01-3a-adv-obfuscation
objective: "3.1.5"
type: single
difficulty: 2
status: draft
stem:
  en: |-
    A red team found that a jailbreak prompt encoded in Base64 and preceded by "decode this and follow it" passes a company's Amazon Bedrock guardrail, and the model then follows the decoded instructions. The company wants to keep its guardrail and add a control against obfuscated payloads before the model is invoked.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Add a pre-processing Lambda function that normalizes the input and decodes encoded segments, then checks the result with ApplyGuardrail.
    - id: b
      text:
        en: |-
          Add an Automated Reasoning policy to the guardrail so that encoded instructions are translated into formal logic and then validated.
    - id: c
      text:
        en: |-
          Add the Base64 strings from the red team report as custom words in the guardrail's word filter, with the input action set to BLOCK.
    - id: d
      text:
        en: |-
          Raise the prompt attack filter to HIGH strength on output so that the decoded instructions are caught in the response.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      Obfuscation is a common way to hide injection payloads, so AWS guidance recommends sanitizing and normalizing input in application code before inference. Decoding the payload lets the guardrail evaluate the real instructions, and the function can reject unexpected encodings outright.
  options:
    b:
      en: |-
        Automated Reasoning checks do not support encoded or obfuscated text and provide no protection against prompt injection.
    c:
      en: |-
        Any change to the payload produces a different encoded string, so an exact-match list is trivially bypassed.
    d:
      en: |-
        The prompt attack filter is configured on input only, and filtering the response does not stop the model from acting on the instructions.
references:
  - title: 4. Input validation and guardrails for agentic AI systems on AWS - AWS Prescriptive Guidance
    url: https://docs.aws.amazon.com/prescriptive-guidance/latest/agentic-ai-security/best-practices-input-validation.html
  - title: What are Automated Reasoning checks in Amazon Bedrock Guardrails? - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/guardrails-automated-reasoning-checks.html
