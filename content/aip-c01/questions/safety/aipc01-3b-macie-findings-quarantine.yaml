id: aipc01-3b-macie-findings-quarantine
objective: "3.2.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A bank's partners upload documents every day to a staging Amazon S3 bucket. Each night, the documents are copied to the bucket that an Amazon Bedrock knowledge base indexes, and the data source is synced. Documents that contain payment card numbers must never be indexed; they must be moved automatically to a quarantine bucket before the nightly copy. Every uploaded document must be analyzed, and the bank wants managed detection with the LEAST custom code.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Enable Amazon Macie automated sensitive data discovery on the staging bucket, and review the bucket's sensitivity score in the Macie console before each nightly copy.
    - id: b
      text:
        en: |-
          Schedule a daily Amazon Macie sensitive data discovery job on the staging bucket, and add an EventBridge rule that sends card-number findings to a Lambda function that moves the objects.
    - id: c
      text:
        en: |-
          Attach a guardrail that blocks CREDIT_DEBIT_CARD_NUMBER to the knowledge base queries so that passages with card numbers are never returned to users.
    - id: d
      text:
        en: |-
          Add an S3 Lifecycle rule to the staging bucket that transitions objects tagged by Macie to the quarantine bucket after one day.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      A sensitive data discovery job lets the bank define the buckets and the depth of analysis and can run on a recurring schedule, so every new object is analyzed. Macie publishes its findings to Amazon EventBridge as events, and a rule can route them to a Lambda function that moves each flagged object before the nightly copy.
  options:
    a:
      en: |-
        Automated discovery samples representative objects, so not every document is analyzed, and a manual review in the console is not automatic.
    c:
      en: |-
        A query-time guardrail does not stop the documents from being indexed; the card numbers would still be stored in the vector store.
    d:
      en: |-
        Lifecycle rules transition objects between storage classes or expire them; they cannot move objects to another bucket, and Macie does not tag objects.
references:
  - title: What is Amazon Macie? - Amazon Macie
    url: https://docs.aws.amazon.com/macie/latest/user/what-is-macie.html
