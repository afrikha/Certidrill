id: aipc01-3b-detect-pii-offsets
objective: "3.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A bank's chat backend receives each English prompt in an AWS Lambda function before it calls Amazon Bedrock. For every prompt, the function must write an audit record in which each bank account number is replaced with asterisks while the rest of the text is kept. The record must be written before the model call returns, and prompts are smaller than 10 KB.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Call Amazon Comprehend ContainsPiiEntities from the function, and replace the values of the labels that it returns with asterisks.
    - id: b
      text:
        en: |-
          Start an Amazon Comprehend PII entities detection job with a redaction configuration for each prompt, and write the job's output to the audit store.
    - id: c
      text:
        en: |-
          Configure an Amazon Macie custom data identifier for bank account numbers, and write each audit record from the Macie findings for the prompt's text.
    - id: d
      text:
        en: |-
          Call Amazon Comprehend DetectPiiEntities from the function, and use the begin and end offsets of BANK_ACCOUNT_NUMBER entities to mask those characters.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      DetectPiiEntities runs in real time on text of up to 100 KB and returns each entity with its type, score and begin and end offsets. The function can replace exactly those character spans and keep the rest of the prompt.
  options:
    a:
      en: |-
        ContainsPiiEntities returns only the labels of the PII types found, with scores, not their positions, so the function cannot locate the values to mask.
    b:
      en: |-
        Redaction runs only as an asynchronous batch job on documents in Amazon S3, which is too slow and heavy for each chat prompt.
    c:
      en: |-
        Macie analyzes objects stored in Amazon S3; it does not inspect a prompt in flight inside a Lambda function.
references:
  - title: DetectPiiEntities - Amazon Comprehend
    url: https://docs.aws.amazon.com/comprehend/latest/APIReference/API_DetectPiiEntities.html
  - title: Personally identifiable information (PII) - Amazon Comprehend
    url: https://docs.aws.amazon.com/comprehend/latest/dg/pii.html
