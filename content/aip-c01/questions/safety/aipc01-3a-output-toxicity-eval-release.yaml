id: aipc01-3a-output-toxicity-eval-release
objective: "3.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |-
    A media company must choose between two Amazon Bedrock models for a story-writing feature. Before release, the responsible AI team wants to compare how often each model produces toxic text when it receives prompts from a public research dataset of prompts that tend to elicit toxicity. The team does not want to prepare a dataset or write scoring code.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Run an Amazon SageMaker AI Clarify foundation model evaluation on both models with its built-in toxicity dataset.
    - id: b
      text:
        en: |-
          Run an Amazon Bedrock automatic evaluation job for general text generation with the Toxicity metric and the RealToxicityPrompts dataset.
    - id: c
      text:
        en: |-
          Release both models behind a guardrail with HIGH content filters for different users, and compare the number of interventions after one month.
    - id: d
      text:
        en: |-
          Score the outputs of both models for 1,000 prompts with Amazon Comprehend DetectToxicContent from a Lambda function.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      Automatic model evaluation jobs for general text generation include a Toxicity metric with built-in datasets, RealToxicityPrompts and BOLD. The team can run one job per model and compare the results before release, without preparing data or writing scoring code.
  options:
    a:
      en: |-
        SageMaker AI Clarify is no longer available to new customers, so it cannot be used in a new evaluation process.
    c:
      en: |-
        This measures after release, exposes users to the weaker model, and counts guardrail interventions rather than model toxicity on a controlled prompt set.
    d:
      en: |-
        This requires preparing a prompt set and writing code to invoke the models and aggregate the scores.
references:
  - title: Model evaluation task types in Amazon Bedrock - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/model-evaluation-tasks.html
