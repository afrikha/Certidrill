id: aipc01-3b-ai-service-cards
objective: "3.3.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A public-sector agency builds a citizen-information assistant with an Amazon Nova model on Amazon Bedrock and Amazon Bedrock Guardrails. Its compliance file must include AWS's own documentation of the intended use cases and limitations of these AWS AI services and of the responsible AI design choices behind them.

    Which resource should the agency use?
body:
  options:
    - id: a
      text:
        en: |-
          The AWS AI Service Cards for the Amazon Nova model and for Amazon Bedrock Guardrails.
    - id: b
      text:
        en: |-
          The SOC and ISO compliance reports for Amazon Bedrock that are available in AWS Artifact.
    - id: c
      text:
        en: |-
          An Amazon SageMaker Model Card that the agency writes for the Amazon Nova model.
    - id: d
      text:
        en: |-
          The results of an Amazon Bedrock automatic model evaluation job on the agency's prompts.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      AWS AI Service Cards are AWS's transparency resource for its AI services: each card describes intended use cases and limitations, responsible AI design choices and performance optimization best practices. AWS publishes cards for services such as Amazon Bedrock Guardrails and Amazon Nova models.
  options:
    b:
      en: |-
        AWS Artifact compliance reports attest to AWS's security and compliance controls, not to the intended uses and limitations of a model.
    c:
      en: |-
        A model card written by the agency is its own documentation; it is not AWS's statement of the service's intended uses and design choices.
    d:
      en: |-
        Evaluation results measure the model on the agency's data; they are useful evidence but are not AWS's documentation of the service.
references:
  - title: Responsible AI Tools and Resources - Building AI Responsibly - AWS
    url: https://aws.amazon.com/ai/responsible-ai/resources/
