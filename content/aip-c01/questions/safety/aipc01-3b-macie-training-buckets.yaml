id: aipc01-3b-macie-training-buckets
objective: "3.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A retail company stores candidate datasets for model fine-tuning in more than 300 Amazon S3 buckets. Before any dataset is used, the privacy team must know which buckets contain personally identifiable information (PII). The team wants the evaluation to run continuously across all buckets with the LEAST operational overhead.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Enable Amazon Macie automated sensitive data discovery for the account, and review the sensitivity of each bucket in the Macie console.
    - id: b
      text:
        en: |-
          Attach an Amazon Bedrock guardrail with sensitive information filters to every model customization job that reads the buckets.
    - id: c
      text:
        en: |-
          Write an AWS Lambda function that calls Amazon Comprehend DetectPiiEntities on every object and records the results in a DynamoDB table.
    - id: d
      text:
        en: |-
          Create a CloudWatch Logs data protection policy for the account with the managed data identifiers for PII.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      Macie analyzes S3 objects with managed data identifiers for PII, financial data and credentials. Automated sensitive data discovery continually evaluates the bucket inventory and samples representative objects, giving a per-bucket view of sensitive data without jobs or code to maintain.
  options:
    b:
      en: |-
        Guardrails evaluate prompts and model responses at inference time; they do not scan the contents of S3 buckets.
    c:
      en: |-
        Comprehend can detect PII in text, but reading, chunking and tracking every object in 300 buckets is custom code to build and operate.
    d:
      en: |-
        CloudWatch Logs data protection policies apply to log events ingested into log groups, not to objects in S3 buckets.
references:
  - title: What is Amazon Macie? - Amazon Macie
    url: https://docs.aws.amazon.com/macie/latest/user/what-is-macie.html
