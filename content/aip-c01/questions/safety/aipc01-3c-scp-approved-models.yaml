id: aipc01-3c-scp-approved-models
objective: "3.3.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A healthcare company uses AWS Organizations. Its model risk committee approves foundation models after a review; two models are approved today. Developers have administrator access in their member accounts. The company must ensure that no principal in any member account can run inference, including batch inference, on a foundation model that the committee has not approved. The committee must be able to add a model to the approved list in one place.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Configure the Amazon Bedrock policy that enforces the corporate guardrail with a model_enforcement section that lists only the two approved models in included_models.
    - id: b
      text:
        en: |-
          Create an IAM permissions boundary that allows inference only on the two approved model ARNs, and require developers to attach it to every role that they create.
    - id: c
      text:
        en: |-
          Attach an SCP that denies bedrock:InvokeModel, bedrock:InvokeModelWithResponseStream, and bedrock:CreateModelInvocationJob on all foundation-model ARNs except the approved ones.
    - id: d
      text:
        en: |-
          Enable model invocation logging in every account, and create a CloudWatch alarm on a metric filter that notifies the committee when a log entry contains a model ID that is not approved.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      Amazon Bedrock documents a deny policy on bedrock:InvokeModel, bedrock:InvokeModelWithResponseStream and bedrock:CreateModelInvocationJob for foundation-model ARNs and states that it can be used as an SCP to control model access across an organization. Denying InvokeModel also blocks Converse. As an SCP, it binds administrators in every member account, and the allow list is maintained in one policy.
  options:
    a:
      en: |-
        model_enforcement only selects which models the enforced guardrail applies to. Models outside the list can still be invoked, just without that guardrail.
    b:
      en: |-
        Administrators can create roles without the boundary or remove it, and the boundary must be managed in every account.
    d:
      en: |-
        Logging and alarms detect use after it happens; they do not prevent inference on an unapproved model.
references:
  - title: "Identity-based policy examples for Amazon Bedrock - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/security_iam_id-based-policy-examples.html
  - title: "Apply cross-account safeguards with Amazon Bedrock Guardrails enforcements - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/guardrails-enforcements.html
