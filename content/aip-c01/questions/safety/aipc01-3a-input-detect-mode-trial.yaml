id: aipc01-3a-input-detect-mode-trial
objective: "3.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |-
    A retail company's shopping assistant uses a numbered version of an Amazon Bedrock guardrail in production. The safety team wants to add a stricter Insults content filter on user prompts. Before enforcing it, the team needs two weeks of data on how many real production prompts the new setting would flag. Users must not be affected during these two weeks.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Set the Insults filter input strength to LOW in a new guardrail version so that only the most obvious insults are blocked for two weeks.
    - id: b
      text:
        en: |-
          Replay a sample of recent production prompts in the guardrail test window of the Amazon Bedrock console and count the blocked results.
    - id: c
      text:
        en: |-
          Set the Insults filter input action to NONE (Detect) in a new guardrail version, deploy it, and analyze the detections that it returns.
    - id: d
      text:
        en: |-
          Reference the DRAFT version of the guardrail in production with the new setting so that the change can be reverted at any time.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      With the action NONE, shown as Detect (no action) in the console, the guardrail evaluates the content and returns detection information without blocking or changing it. Deploying this version measures real production traffic for two weeks with no user impact, and the action can later be switched to BLOCK.
  options:
    a:
      en: |-
        A LOW strength with the BLOCK action still blocks the prompts that it flags, so users are affected during the trial.
    b:
      en: |-
        The test window evaluates prompts that someone enters by hand; it does not measure two weeks of live production traffic.
    d:
      en: |-
        The draft with a BLOCK action still blocks flagged prompts, and pointing production at a mutable draft means any edit reaches users immediately.
references:
  - title: Block harmful words and conversations with content filters - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/guardrails-content-filters.html
