id: aipc01-3b-organization-trail
objective: "3.3.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company has 60 AWS accounts in an organization in AWS Organizations, and teams in many of them build GenAI applications on Amazon Bedrock. The central security team needs one audit log of Amazon Bedrock API activity for every account, including accounts that will join the organization later. Users in member accounts must not be able to stop or change this logging.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Deploy a trail to every member account with AWS CloudFormation StackSets, each trail delivering its log files to a central S3 bucket.
    - id: b
      text:
        en: |-
          Enable Amazon Bedrock model invocation logging in every member account with a destination bucket in the security account.
    - id: c
      text:
        en: |-
          Set up CloudWatch cross-account observability so that the security account can view the logs of every member account.
    - id: d
      text:
        en: |-
          Create an organization trail from the management account or a delegated administrator account, delivering to a central S3 bucket.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      An organization trail logs events for all accounts in the organization, and it is added to accounts that join later, with logging starting automatically. Users in member accounts can see the trail but cannot delete it, turn logging off or change the events it records.
  options:
    a:
      en: |-
        Trails created in member accounts belong to those accounts, so local administrators could stop or modify them.
    b:
      en: |-
        Invocation logging supports destinations only in the same account and Region, and it records model invocations, not all Bedrock API activity.
    c:
      en: |-
        Cross-account observability shares telemetry that already exists; it does not create a protected audit trail of API activity.
references:
  - title: Creating a trail for an organization - AWS CloudTrail
    url: https://docs.aws.amazon.com/awscloudtrail/latest/userguide/creating-trail-organization.html
