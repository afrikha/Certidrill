id: aipc01-3c-refusal-judge-not-automatic
objective: "3.4.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A public-sector agency is choosing between two Amazon Bedrock models for a benefits assistant. Its fairness policy requires that the assistant not decline legitimate questions from one community more often than from others. The team has 400 representative prompts, each labeled with a community. The team must compare both models on this criterion by using managed evaluation features.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Run an automatic model evaluation job for each model with the Toxicity metric on the custom prompts, with the community in the category key, and compare the scores.
    - id: b
      text:
        en: |-
          Run an automatic model evaluation job for each model with the Robustness metric and the built-in BOLD dataset, and compare the word error rates.
    - id: c
      text:
        en: |-
          Add a denied topic for each community to a guardrail, and compare the InvocationsIntervened metric while each model answers the prompts.
    - id: d
      text:
        en: |-
          Run a model-as-a-judge evaluation job for each model with Builtin.Refusal on the custom prompts, with the community in the category key, and compare per community.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      Builtin.Refusal determines whether a response declines to answer or rejects the request. Running the same judge job on both models with the community in the category key reports refusal scores per community, so the gap can be compared between models. Automatic jobs offer accuracy, robustness and toxicity metrics, none of which measures refusals.
  options:
    a:
      en: |-
        Toxicity measures harmful language in responses, not whether the model declined the question.
    b:
      en: |-
        Robustness measures how much outputs change under small input perturbations, and BOLD does not contain the agency's prompts or communities.
    c:
      en: |-
        Denied topics for communities would block the questions themselves and measure the guardrail, not the models' refusal behavior.
references:
  - title: "Use metrics to understand model performance - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/model-evaluation-metrics.html
  - title: "Use prompt datasets for model evaluation in Amazon Bedrock - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/model-evaluation-prompt-datasets.html
