id: aipc01-3a-did-refund-validation
objective: "3.1.4"
type: single
difficulty: 3
status: draft
stem:
  en: |-
    A retailer's support agent runs on Amazon Bedrock AgentCore Runtime and proposes refunds that a Lambda tool then issues. A refund must not exceed the lower of the order total stored in the order database and 500 USD. The agent calls the tool with strict tool use, and a guardrail filters harmful content. The retailer needs a control that guarantees that no refund that breaks this rule is ever issued.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Add minimum 0 and maximum 500 constraints to the amount property in the tool's JSON input schema so that strict tool use enforces the limit.
    - id: b
      text:
        en: |-
          Add an Automated Reasoning policy that encodes the refund rule to the agent's guardrail so that rule-breaking refunds are blocked.
    - id: c
      text:
        en: |-
          In the refund Lambda function, read the order total from the database and reject any amount above the lower of that total and 500 USD.
    - id: d
      text:
        en: |-
          Add a denied topic named Excessive Refunds to the agent's guardrail, and set its output action to BLOCK.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      Validation in the tool code is deterministic and uses the system of record at the moment of the refund, so no rule-breaking refund can be issued, whatever the model generates. Probabilistic filters and schema checks cannot compare an amount with each order's total.
  options:
    a:
      en: |-
        Structured outputs do not support numerical constraints such as minimum and maximum, and a schema could not compare the amount with each order total.
    b:
      en: |-
        Automated Reasoning checks only detect and return findings, and guardrails do not evaluate the tool call arguments that the model generates.
    d:
      en: |-
        Guardrails do not evaluate tool call arguments, and a denied topic cannot compare amounts.
references:
  - title: Get validated JSON results from models - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/structured-output.html
  - title: Include a guardrail with the Converse API - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/guardrails-use-converse-api.html
