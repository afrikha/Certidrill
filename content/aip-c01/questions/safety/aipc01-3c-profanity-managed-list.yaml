id: aipc01-3c-profanity-managed-list
objective: "3.4.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A video game company's policy states that its in-game assistant must never show profanity to players. The assistant already uses Amazon Bedrock Guardrails with content filters for hate and violence. The company does not want to compile and maintain its own list of profane words.

    Which guardrail configuration will meet this requirement?
body:
  options:
    - id: a
      text:
        en: |-
          A denied topic named Profanity whose definition describes offensive and vulgar language.
    - id: b
      text:
        en: |-
          A sensitive information filter with a custom regex pattern that matches profane words.
    - id: c
      text:
        en: |-
          A contextual grounding check with a high relevance threshold on model responses.
    - id: d
      text:
        en: |-
          A word filter with the managed profanity list enabled for inputs and outputs.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      Word filters block words and phrases with case-insensitive whole-word matching and include a managed profanity filter, so the company gets profanity blocking without maintaining its own list.
  options:
    a:
      en: |-
        AWS advises against using denied topics to capture individual words; word filters exist for that purpose.
    b:
      en: |-
        A regex would require the company to write and maintain the list of words, which it wants to avoid.
    c:
      en: |-
        Relevance measures whether a response answers the query; a relevant response can still contain profanity.
references:
  - title: "Remove a specific list of words and phrases from conversations with word filters - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/guardrails-word-filters.html
  - title: "Block denied topics to help remove harmful content - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/guardrails-denied-topics.html
