id: aipc01-3a-input-applyguardrail-before-retrieval
objective: "3.1.1"
type: single
difficulty: 3
status: draft
stem:
  en: |-
    A software company's documentation assistant calls the Amazon Bedrock Knowledge Bases Retrieve API, builds a prompt from the results, and then calls the Converse API with a guardrail that has content filters and denied topics. Logs show that many questions are about denied topics and are blocked only after the vector store has been queried, which wastes retrieval capacity and adds latency. The company wants these questions rejected as early as possible and wants to reuse the existing guardrail.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Call the ApplyGuardrail API with the source set to INPUT on the user's question before the Retrieve call, and stop if it intervenes.
    - id: b
      text:
        en: |-
          Associate the guardrail with the knowledge base data source so that documents about denied topics are removed during ingestion.
    - id: c
      text:
        en: |-
          Call the ApplyGuardrail API with the source set to OUTPUT on the retrieved passages before the prompt is built from them.
    - id: d
      text:
        en: |-
          Replace the Retrieve call with queries to an Amazon Kendra index, and associate the existing guardrail with the Kendra index and its queries.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      ApplyGuardrail evaluates text against an existing guardrail without invoking a model, so the application can check the question first and skip both retrieval and generation when the action is GUARDRAIL_INTERVENED. AWS documents this pattern for validating input before retrieval in RAG applications.
  options:
    b:
      en: |-
        Guardrails are not attached to knowledge base data sources, and removing documents does not stop off-limits questions from triggering a vector search.
    c:
      en: |-
        Checking the retrieved passages still runs the vector search first, and it evaluates the documents instead of the user's question.
    d:
      en: |-
        Amazon Kendra is no longer available to new customers, so it cannot be part of a new design, and the vector search would still run before the guardrail.
references:
  - title: Use the ApplyGuardrail API in your application - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/guardrails-use-independent-api.html
