id: aipc01-3b-request-metadata-tenant
objective: "3.3.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A SaaS provider serves 200 customer tenants from one AWS account. Each request calls the Amazon Bedrock Converse API, and model invocation logging to CloudWatch Logs is enabled. For compliance, the provider must be able to retrieve every logged decision for a given tenant and a given prompt template version. The provider wants the LEAST custom code and does not want to alter the text sent to the model.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Create one application inference profile per tenant, and use the profile ARN as the model ID so that the logs show the tenant.
    - id: b
      text:
        en: |-
          Pass the tenant ID and the template version in the requestMetadata field of each Converse call, and filter the invocation logs on those keys.
    - id: c
      text:
        en: |-
          Prepend a line with the tenant ID and the template version to the system prompt of each request, and search the logs for that line.
    - id: d
      text:
        en: |-
          Enable CloudTrail data events for the models used by the application, and query the events in the trail by tenant ID and template version.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      requestMetadata accepts up to 16 caller-supplied key-value pairs that are recorded in the invocation log entry and can be used to filter the logs. The values are not part of the prompt, so the text sent to the model is unchanged.
  options:
    a:
      en: |-
        Per-tenant profiles could identify the tenant, but not the template version, and they mean creating and managing 200 profiles.
    c:
      en: |-
        Adding identifiers to the system prompt changes the text sent to the model and mixes control data with instructions.
    d:
      en: |-
        CloudTrail events do not carry the tenant or template version of a request, and Converse is a management event, not a data event.
references:
  - title: Converse - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/APIReference/API_runtime_Converse.html
  - title: Monitor model invocation using CloudWatch Logs and Amazon S3 - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/model-invocation-logging.html
