id: aipc01-3a-output-stopreason
objective: "3.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |-
    A developer adds an Amazon Bedrock guardrail to a chatbot that calls the Converse API. Each time the guardrail intervenes on a request, the application must publish a custom CloudWatch metric before it displays the returned text.

    Which check should the application perform on the Converse response to meet this requirement?
body:
  options:
    - id: a
      text:
        en: |-
          Check whether the action field of the response is set to GUARDRAIL_INTERVENED.
    - id: b
      text:
        en: |-
          Catch the ValidationException that the Converse API raises when the guardrail intervenes.
    - id: c
      text:
        en: |-
          Check whether the guardrailAction field of the response is set to INTERVENED.
    - id: d
      text:
        en: |-
          Check whether the stopReason field of the response is set to guardrail_intervened.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      When a guardrail intervenes in a Converse call, the response has the stopReason guardrail_intervened and the output contains the configured blocked message or the masked text. With trace enabled, the trace field gives the details of the intervention.
  options:
    a:
      en: |-
        The action field with the value GUARDRAIL_INTERVENED belongs to the ApplyGuardrail API response.
    b:
      en: |-
        An intervention is returned as a normal response, not as an exception.
    c:
      en: |-
        The guardrailAction field with the value INTERVENED belongs to the Knowledge Bases RetrieveAndGenerate response.
references:
  - title: Include a guardrail with the Converse API - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/guardrails-use-converse-api.html
