id: aipc01-3c-custom-judge-metric
objective: "3.4.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A bank's fairness policy defines equal treatment for its debt-collection assistant as offering the same level of respect, the same repayment options, and the same deadlines to every customer, regardless of the customer's name or neighborhood. None of the built-in metrics of Amazon Bedrock model-as-a-judge evaluations measures this definition. The team wants automated, repeatable scoring of responses against the definition, with the LEAST operational overhead.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Use the Builtin.ProfessionalStyleAndTone metric, and treat a high style and tone score as evidence that customers receive equal treatment.
    - id: b
      text:
        en: |-
          Define a custom metric in an Amazon Bedrock model-as-a-judge evaluation job with a rubric and a rating scale that encode the bank's definition.
    - id: c
      text:
        en: |-
          Fine-tune a classification model on Amazon SageMaker AI that scores each response against the definition, and host it on an endpoint for the evaluations.
    - id: d
      text:
        en: |-
          Add a denied topic that describes unequal treatment to the assistant's guardrail, and count the interventions during a test run.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      Besides built-in metrics, Amazon Bedrock model-as-a-judge evaluations accept custom metrics that you define, so the evaluator model scores each response against the bank's own rubric. The job is managed and repeatable on every prompt or model change, with no model to train or host.
  options:
    a:
      en: |-
        This metric measures whether style, formatting, and tone suit a professional setting; it does not compare options and deadlines across customers.
    c:
      en: |-
        Training and hosting a classifier is far more operational overhead than a custom judge metric.
    d:
      en: |-
        A denied topic blocks a subject at run time; it does not score whether responses treat customers equally.
references:
  - title: "Use metrics to understand model performance - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/model-evaluation-metrics.html
