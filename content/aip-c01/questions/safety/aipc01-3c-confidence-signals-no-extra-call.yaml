id: aipc01-3c-confidence-signals-no-extra-call
objective: "3.4.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company's RAG assistant calls the Retrieve API of an Amazon Bedrock knowledge base and then calls the Converse API with a guardrail that includes a contextual grounding check. The team wants to publish a per-response confidence signal to CloudWatch for every answer, without making any additional model invocation per request.

    Which signals meet these requirements? (Choose two.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          The grounding score that the contextual grounding check computes for the response, read from the guardrail trace of the Converse response.
    - id: b
      text:
        en: |-
          A Builtin.Faithfulness score computed for each answer by an Amazon Bedrock model-as-a-judge evaluation job.
    - id: c
      text:
        en: |-
          The level of agreement between five answers sampled for the same question at a high temperature.
    - id: d
      text:
        en: |-
          The relevance scores of the top passages that the Retrieve API returns in its retrieval results.
    - id: e
      text:
        en: |-
          The outputTokens value of the usage field in the Converse response.
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: |-
      The contextual grounding check computes a grounding score and a relevance score for each response during the call that already happens, and the trace exposes them. Each Retrieve result carries a score that expresses its relevance to the query. Both signals come from calls the assistant already makes, so they add no model invocation.
  options:
    b:
      en: |-
        A judge evaluation invokes an evaluator model for each answer, which is an additional model invocation.
    c:
      en: |-
        Self-consistency requires several extra model invocations per question.
    e:
      en: |-
        The number of output tokens measures length and cost, not how well the answer is supported.
references:
  - title: "Use contextual grounding check to filter hallucinations in responses - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/guardrails-contextual-grounding-check.html
  - title: "KnowledgeBaseRetrievalResult - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/APIReference/API_agent-runtime_KnowledgeBaseRetrievalResult.html
