id: aipc01-3a-output-text-to-sql
objective: "3.1.2"
type: single
difficulty: 3
status: draft
stem:
  en: |-
    A wholesale distributor's sales assistant answers questions such as "What were total returns for the Northeast region last quarter?". The figures are stored in an Amazon Aurora PostgreSQL database. The current design loads monthly report exports into a knowledge base, and the model sometimes gives different totals for the same question. Answers must be reproducible, exact to the cent, and limited to data that the assistant is allowed to read.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Set the temperature to 0 and place the complete monthly reports in the prompt so that the model computes each total from all of the source data.
    - id: b
      text:
        en: |-
          Have the model write SQL for the question, validate it in a Lambda function, run it as a read-only user on approved views, and answer from the result.
    - id: c
      text:
        en: |-
          Fine-tune the model on the monthly reports at the end of each month so that it learns the regional totals and returns the same figures consistently.
    - id: d
      text:
        en: |-
          Retrieve more chunks from the knowledge base and turn on reranking so that the model sees every relevant report before it answers.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      In a text-to-SQL design, the model only translates the question into a query, and the database computes the figures, so the same question returns the same exact result. Validating the generated statement and running it with a read-only user on approved views keeps the assistant within the data that it may read.
  options:
    a:
      en: |-
        The model still performs the arithmetic, which is neither exact nor guaranteed to be reproducible, and complete reports may not fit in the context window.
    c:
      en: |-
        Fine-tuning does not make a model recall exact figures reliably, and the data changes between training runs.
    d:
      en: |-
        More context does not stop the model from computing totals itself, so the figures remain inconsistent.
references:
  - title: Generate a query for structured data - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/knowledge-base-generate-query.html
