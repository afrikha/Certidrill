id: aipc01-3a-did-guardrail-role-rag-denied
objective: "3.1.4"
type: single
difficulty: 3
status: draft
stem:
  en: |-
    A company enforces its guardrail with an IAM policy: the application role may call bedrock:InvokeModel only when bedrock:GuardrailIdentifier matches the approved guardrail version, and is denied otherwise. The same role was later allowed to call RetrieveAndGenerate on a knowledge base. These calls now fail with access denied errors, although each request specifies the approved guardrail in its generation configuration. The guardrail must stay on the generated answers.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Change the condition to ArnLike with the guardrail ARN followed by a wildcard so that any guardrail version, including DRAFT, is accepted.
    - id: b
      text:
        en: |-
          Remove the guardrailConfiguration from the RetrieveAndGenerate requests so that the condition is evaluated only on the generation call.
    - id: c
      text:
        en: |-
          Call RetrieveAndGenerate with a separate IAM role that does not have the guardrail condition, and keep the guardrailConfiguration in the request.
    - id: d
      text:
        en: |-
          Grant the application role bedrock:ApplyGuardrail on the guardrail resource so that the internal model calls can apply the guardrail.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      RetrieveAndGenerate makes several internal InvokeModel calls, and some of them do not include a guardrail, so a role restricted by the bedrock:GuardrailIdentifier condition gets access denied errors. AWS advises against using such a role for RetrieveAndGenerate, InvokeAgent, or InvokeInlineAgent; a separate role still applies the guardrail through guardrailConfiguration.
  options:
    a:
      en: |-
        Internal calls that carry no guardrail at all still fail, whatever ARN pattern the condition accepts.
    b:
      en: |-
        This removes the guardrail from the answers, and the internal calls without a guardrail are still denied.
    d:
      en: |-
        ApplyGuardrail permission does not add a guardrail to the internal calls, so the condition still denies them.
references:
  - title: Enforce the use of specific guardrails in model inference requests - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/guardrails-permissions-id.html
  - title: RetrieveAndGenerate - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/APIReference/API_agent-runtime_RetrieveAndGenerate.html
