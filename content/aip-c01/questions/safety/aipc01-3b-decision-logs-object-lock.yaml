id: aipc01-3b-decision-logs-object-lock
objective: "3.3.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A brokerage firm writes the decision logs of its GenAI trade-surveillance assistant to Amazon S3. A regulation requires the firm to keep each log file for 7 years in a form that no user can overwrite or delete during that period, including administrators and the AWS account root user. The firm wants a managed control rather than custom code.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Enable S3 Object Lock on the bucket with a default retention period of 7 years in governance mode.
    - id: b
      text:
        en: |-
          Store the logs in a CloudWatch Logs log group with a 7-year retention setting and a customer managed KMS key.
    - id: c
      text:
        en: |-
          Enable S3 Object Lock on the bucket with a default retention period of 7 years in compliance mode.
    - id: d
      text:
        en: |-
          Enable S3 Versioning on the bucket, and add a bucket policy that denies s3:DeleteObject to every principal except the administrators.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      In compliance mode, a protected object version cannot be overwritten or deleted by any user, including the root user, and its retention period cannot be shortened. S3 Object Lock is a write-once-read-many control that has been assessed for regulations such as SEC 17a-4.
  options:
    a:
      en: |-
        In governance mode, users with s3:BypassGovernanceRetention can delete objects or change the lock settings, so administrators could still remove the logs.
    b:
      en: |-
        A retention setting controls when events are deleted automatically, but principals with the right permissions can still delete the log group or its streams.
    d:
      en: |-
        The administrators can still delete objects, and they can change the bucket policy itself, so the logs are not protected from them.
references:
  - title: Locking objects with Object Lock - Amazon Simple Storage Service
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/object-lock.html
