id: aipc01-3a-input-standard-tier-languages
objective: "3.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |-
    A gaming company is launching an in-game assistant on Amazon Bedrock for players who write in Japanese, Korean, Portuguese, and German. The assistant uses a guardrail whose content filters and denied topics are in the Classic tier, and tests show that harmful prompts in these languages are often missed. The company wants managed detection in all four languages with the LEAST operational overhead.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Keep the Classic tier and raise every content filter to HIGH strength on input and on output.
    - id: b
      text:
        en: |-
          Call Amazon Comprehend DetectToxicContent on each prompt from a Lambda function before the model is invoked.
    - id: c
      text:
        en: |-
          Create one Classic-tier guardrail per language with translated topic definitions, and select it by the player's locale.
    - id: d
      text:
        en: |-
          Switch the content filters and denied topics to the Standard tier, and configure a cross-Region guardrail profile.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      The Classic tier supports English, French, and Spanish, while the Standard tier offers extensive language support and more robust detection. The Standard tier uses cross-Region inference, which the guardrail gets through a guardrail profile.
  options:
    a:
      en: |-
        Strength changes how sensitive detection is, not which languages the Classic tier supports.
    b:
      en: |-
        DetectToxicContent supports English only, and it adds custom code in front of the model.
    c:
      en: |-
        Translating topic definitions does not add languages to the Classic tier, and several guardrails multiply maintenance.
references:
  - title: Safeguard tiers for guardrails policies - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/guardrails-tiers.html
  - title: Distribute guardrail inference across AWS Regions - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/guardrails-cross-region.html
