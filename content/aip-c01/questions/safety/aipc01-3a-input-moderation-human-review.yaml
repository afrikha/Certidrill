id: aipc01-3a-input-moderation-human-review
objective: "3.1.1"
type: single
difficulty: 3
status: draft
stem:
  en: |-
    A travel marketplace lets hosts submit listing descriptions that an FM on Amazon Bedrock rewrites before publication. Every submission is checked with the ApplyGuardrail API. Submissions with a borderline result, such as a low-confidence Insults detection, must wait for a human moderator, who can take up to two days to approve or reject them. Approved submissions must then continue automatically. The company wants a serverless solution with the LEAST custom code for state management.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          An AWS Step Functions Express workflow in which a Choice state sends borderline ApplyGuardrail results to a .waitForTaskToken task, and the moderation tool returns the decision with SendTaskSuccess.
    - id: b
      text:
        en: |-
          A Lambda function that calls ApplyGuardrail, stores borderline submissions in an Amazon DynamoDB table, and polls the table every minute until a moderator updates the item.
    - id: c
      text:
        en: |-
          A Lambda function that calls ApplyGuardrail and starts an Amazon Augmented AI human loop with a private work team for each borderline submission.
    - id: d
      text:
        en: |-
          An AWS Step Functions Standard workflow in which a Choice state sends borderline ApplyGuardrail results to a .waitForTaskToken task, and the moderation tool returns the decision with SendTaskSuccess.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      The callback pattern pauses a Standard workflow until an external system returns the task token with SendTaskSuccess or SendTaskFailure, and the task can wait up to the one-year execution limit, so a two-day review needs no custom state handling. The Choice state routes only borderline results to the moderator, and the other submissions continue automatically.
  options:
    a:
      en: |-
        Express workflows support only the Request Response integration pattern, so a .waitForTaskToken task cannot be used in them.
    b:
      en: |-
        Polling a table from Lambda is custom state management, and the function would have to be rescheduled repeatedly for up to two days.
    c:
      en: |-
        Amazon Augmented AI is no longer available to new customers, so it cannot be used in a new design.
references:
  - title: Discover service integration patterns in Step Functions - AWS Step Functions
    url: https://docs.aws.amazon.com/step-functions/latest/dg/connect-to-resource.html
  - title: Use the ApplyGuardrail API in your application - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/guardrails-use-independent-api.html
