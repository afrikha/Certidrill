id: aipc01-3c-enforced-guardrail-automated-reasoning
objective: "3.3.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    An insurance company enforces a corporate guardrail on all Amazon Bedrock inference in its organization through an Amazon Bedrock policy in AWS Organizations. The guardrail has content filters, denied topics, and sensitive information filters. The lending team must now validate every answer of its mortgage eligibility assistant against the written eligibility rules by using Automated Reasoning checks. The corporate controls must keep applying to the lending assistant, and the change must not affect any other team's applications.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Add the Automated Reasoning policy to the corporate guardrail, create a new numeric version, and update the Amazon Bedrock policy to reference the new version for the whole organization.
    - id: b
      text:
        en: |-
          Configure account-level guardrail enforcement in the lending account with PutEnforcedGuardrailConfiguration, using a guardrail that contains the Automated Reasoning policy and the corporate filters.
    - id: c
      text:
        en: |-
          Create a guardrail with the Automated Reasoning policy in the lending account, and pass it in the assistant's Converse requests while the organization-level guardrail stays enforced.
    - id: d
      text:
        en: |-
          Detach the Amazon Bedrock policy from the lending account, and pass one guardrail that combines the corporate policies and the Automated Reasoning policy in each Converse request.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      Automated Reasoning policies are not supported in enforced guardrails, at organization or account level, and including one causes runtime failures. Organization-level, account-level and request-level guardrails are all applied to a call, with the most restrictive control taking precedence, so the lending assistant can pass its own Automated Reasoning guardrail in the request while the corporate guardrail keeps applying centrally.
  options:
    a:
      en: |-
        An Automated Reasoning policy in an enforced guardrail is unsupported and causes runtime failures, and the change would reach every team in the organization.
    b:
      en: |-
        Account-level enforcement is also a guardrail enforcement, so the same restriction on Automated Reasoning policies applies.
    d:
      en: |-
        Removing the lending account from the Bedrock policy makes the corporate controls depend on the assistant's code, which defeats central enforcement.
references:
  - title: "Apply cross-account safeguards with Amazon Bedrock Guardrails enforcements - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/guardrails-enforcements.html
  - title: "What are Automated Reasoning checks in Amazon Bedrock Guardrails? - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/guardrails-automated-reasoning-checks.html
