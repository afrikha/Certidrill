id: aipc01-3c-enforcement-prerequisites
objective: "3.3.3"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    A company's security team works in the management account of its organization in AWS Organizations. The team created a guardrail in us-east-1 and wants to enforce it on all Amazon Bedrock model invocations in us-east-1 for every member account by using an Amazon Bedrock policy. Member accounts must not be able to change the enforced configuration, and member account invocations must not fail because of missing permissions on the guardrail.

    Which combination of actions should the security team take? (Choose two.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Create a numeric version of the guardrail, and reference that version's ARN in the Amazon Bedrock policy.
    - id: b
      text:
        en: |-
          Reference the guardrail's DRAFT version in the policy so that later fixes reach the member accounts without a policy update.
    - id: c
      text:
        en: |-
          Add a resource-based policy to the guardrail that allows the organization's member accounts to call bedrock:ApplyGuardrail on it.
    - id: d
      text:
        en: |-
          Add the bedrock:GuardrailIdentifier condition key to an SCP so that member accounts are allowed to read the guardrail configuration.
    - id: e
      text:
        en: |-
          Create a copy of the guardrail in each member account, and list each account's copy in the Amazon Bedrock policy.
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |-
      Enforcement requires a numeric guardrail version, which is immutable and therefore cannot be modified by member accounts. For organization-level enforcement, the guardrail also needs a resource-based policy that grants bedrock:ApplyGuardrail to the member accounts or the organization, because member account roles need that permission on the management account's guardrail.
  options:
    b:
      en: |-
        The draft can be modified at any time; AWS requires a numeric version so that the enforced configuration stays immutable.
    d:
      en: |-
        The condition key restricts which guardrail an inference request may name; it grants no permission on the guardrail.
    e:
      en: |-
        The policy names one guardrail per Region from the central account. Copies owned by member accounts could be changed by those accounts.
references:
  - title: "Apply cross-account safeguards with Amazon Bedrock Guardrails enforcements - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/guardrails-enforcements.html
