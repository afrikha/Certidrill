id: aipc01-3a-adv-agentcore-policy
objective: "3.1.5"
type: single
difficulty: 3
status: draft
stem:
  en: |-
    A company runs 12 agents built with different frameworks on Amazon Bedrock AgentCore Runtime, and all tool access goes through an AgentCore Gateway. The agents read customer emails, and a test showed that instructions hidden in an email can make an agent call the issueCredit tool for any amount. Security must enforce, outside the agents' code, that issueCredit is allowed only for the authenticated customer's own account and for amounts below 100 USD.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Add a prompt attack filter to the guardrail of each agent so that instructions hidden in the emails are detected and blocked.
    - id: b
      text:
        en: |-
          Rebuild the agents with Amazon Bedrock Agents, and associate a guardrail and an action group for issueCredit with each agent.
    - id: c
      text:
        en: |-
          Add a rule to each agent's system prompt that forbids credits of 100 USD or more and tells it to ignore instructions in emails.
    - id: d
      text:
        en: |-
          Create a policy engine in Policy in AgentCore with rules on issueCredit and its input parameters, and associate it with the gateway.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      Policy in AgentCore intercepts all agent traffic through AgentCore Gateway and evaluates each tool call, including the user identity, the tool, and its input parameters, against deterministic policies before allowing it. Enforcement happens outside the agents' code, so it is the same for every framework.
  options:
    a:
      en: |-
        Email content reaches the agents as tool results, which guardrails do not evaluate, and a probabilistic filter cannot enforce account and amount rules.
    b:
      en: |-
        Amazon Bedrock Agents (Agents Classic) is no longer available to new customers, and a guardrail does not enforce rules on tool parameters.
    c:
      en: |-
        Prompt instructions live in the agents and are exactly what injected text can override.
references:
  - title: "Policy in Amazon Bedrock AgentCore: Control Agent Interactions - Amazon Bedrock AgentCore"
    url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/policy.html
