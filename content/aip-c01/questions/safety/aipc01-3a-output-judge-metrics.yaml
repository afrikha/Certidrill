id: aipc01-3a-output-judge-metrics
objective: "3.1.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |-
    A human resources software company evaluates an FM that drafts job descriptions. The team will run an Amazon Bedrock model evaluation job that uses an LLM as a judge on its own prompt dataset. The report must show whether the responses contain harmful content and whether they contain stereotypes about any group of people.

    Which built-in metrics should the team select? (Choose two.)
body:
  choose: 2
  options:
    - id: a
      text: Builtin.Harmfulness
    - id: b
      text: Builtin.Refusal
    - id: c
      text: Builtin.Stereotyping
    - id: d
      text: Builtin.Faithfulness
    - id: e
      text: Builtin.ProfessionalStyleAndTone
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |-
      Builtin.Harmfulness evaluates whether a response contains harmful content, and Builtin.Stereotyping evaluates whether it contains stereotypes of any kind, positive or negative. Both are built-in metrics of judge-based evaluation jobs.
  options:
    b:
      en: |-
        Builtin.Refusal determines whether the response declines to answer the prompt; it does not detect harmful content or stereotypes.
    d:
      en: |-
        Builtin.Faithfulness checks whether the response contains information that is not found in the prompt.
    e:
      en: |-
        Builtin.ProfessionalStyleAndTone measures whether style, formatting, and tone suit a professional setting, not whether the content is harmful or stereotyped.
references:
  - title: Use metrics to understand model performance - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/model-evaluation-metrics.html
  - title: Evaluate model performance using another LLM as a judge - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/evaluation-judge.html
