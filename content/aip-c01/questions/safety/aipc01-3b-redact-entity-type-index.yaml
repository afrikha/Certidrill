id: aipc01-3b-redact-entity-type-index
objective: "3.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A logistics company will index two million English support transcripts, stored in Amazon S3, in an Amazon Bedrock knowledge base. The PII in the transcripts must be removed before indexing so that the vector store never contains it. The assistant must still be able to say what kind of information a customer gave, for example that the customer provided a phone number. The company wants the LEAST operational overhead.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Run a Comprehend asynchronous PII redaction job with the REPLACE_WITH_PII_ENTITY_TYPE mask mode, and index the job's output location.
    - id: b
      text:
        en: |-
          Run a Comprehend asynchronous PII redaction job with the MASK mask mode and an asterisk as the mask character, and index the job's output.
    - id: c
      text:
        en: |-
          Index the original transcripts as they are, and attach a guardrail that anonymizes all PII types in the responses of the assistant.
    - id: d
      text:
        en: |-
          Write an AWS Lambda function that calls DetectPiiEntities on each transcript, replaces each entity with its type, and writes the result to the data source bucket.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      Comprehend redaction runs as an asynchronous batch job on documents in Amazon S3, which fits a two-million-document corpus. The REPLACE_WITH_PII_ENTITY_TYPE mode replaces each value with its entity type, so the indexed text keeps the information that a phone number was given without the number itself.
  options:
    b:
      en: |-
        The MASK mode replaces each character with the mask character, so the transcripts lose the information about which kind of data was provided.
    c:
      en: |-
        The vector store would still contain the PII in chunks and embeddings; the guardrail only masks it in responses.
    d:
      en: |-
        The function works, but chunking 2 million transcripts into 100 KB requests and handling errors and retries is custom code that a managed batch job avoids.
references:
  - title: RedactionConfig - Amazon Comprehend
    url: https://docs.aws.amazon.com/comprehend/latest/APIReference/API_RedactionConfig.html
  - title: Personally identifiable information (PII) - Amazon Comprehend
    url: https://docs.aws.amazon.com/comprehend/latest/dg/pii.html
