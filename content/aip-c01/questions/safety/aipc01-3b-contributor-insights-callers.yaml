id: aipc01-3b-contributor-insights-callers
objective: "3.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An insurance company has enabled Amazon Bedrock model invocation logging to a CloudWatch Logs log group. Each log entry includes the identity.arn of the caller and the token counts. The security team wants a CloudWatch dashboard that shows, in near real time, the 10 IAM principals that send the most model invocations, so that unusual data access patterns stand out. The team does not want to write or operate custom code.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Query the CloudTrail management events for InvokeModel and Converse with Amazon Athena once a day, and publish the top callers to a text widget on the dashboard.
    - id: b
      text:
        en: |-
          Add the Invocations metric of the AWS/Bedrock namespace, with the ModelId dimension, to the dashboard and sort the graph by the highest values.
    - id: c
      text:
        en: |-
          Create a CloudWatch Contributor Insights rule on the invocation log group that uses identity.arn as the contributor key, and add the rule's graph to the dashboard.
    - id: d
      text:
        en: |-
          Enable VPC Flow Logs on the network interfaces of the bedrock-runtime interface endpoint, and graph the source IP addresses with the most connections.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      Contributor Insights analyzes log data in real time and creates time series of the top-N contributors for a log field that a rule defines. Using identity.arn from the invocation logs as the key shows which principals generate the most requests, with no code to write or run.
  options:
    a:
      en: |-
        A daily Athena query is not near real time, and building and publishing the results to the dashboard requires custom automation.
    b:
      en: |-
        The Amazon Bedrock runtime metrics are dimensioned by model, not by calling principal, so they cannot show which identities make the calls.
    d:
      en: |-
        Flow logs show IP addresses and ports, not IAM principals; many roles can share the same source addresses.
references:
  - title: Use Contributor Insights to analyze high-cardinality data - Amazon CloudWatch
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/ContributorInsights.html
  - title: Monitor model invocation using CloudWatch Logs and Amazon S3 - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/model-invocation-logging.html
