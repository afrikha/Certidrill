id: aipc01-3b-citation-spans
objective: "3.3.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A consulting firm's research assistant calls RetrieveAndGenerate on an Amazon Bedrock knowledge base. The firm's policy requires that each statement in an answer show a footnote that links to the exact source document that supports it, so that reviewers can check every statement. The firm wants a deterministic solution with the LEAST custom code.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Place a footnote at the span of each citation's generated response part, linked to the location of that citation's retrieved references.
    - id: b
      text:
        en: |-
          Add an instruction to the prompt template that asks the model to append the file name of the source document after each sentence it writes.
    - id: c
      text:
        en: |-
          Call the Retrieve API instead, and list every retrieved document under the answer as the sources of the whole response.
    - id: d
      text:
        en: |-
          Enable a contextual grounding check in the guardrail, and display the grounding score of the response next to each sentence of the answer.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      Each citation in a RetrieveAndGenerate response pairs a generated response part, whose span gives where the cited text begins and ends in the output, with the retrieved references that support it, including their source location. The application can place footnotes deterministically from these fields.
  options:
    b:
      en: |-
        Model-written source names are not deterministic and can be wrong or invented.
    c:
      en: |-
        A list of all retrieved documents does not tie each statement to the document that supports it, and Retrieve alone does not generate the answer.
    d:
      en: |-
        A grounding score measures how well a response is supported overall; it does not identify which document supports each statement.
references:
  - title: Citation - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/APIReference/API_agent-runtime_Citation.html
  - title: TextResponsePart - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/APIReference/API_agent-runtime_TextResponsePart.html
