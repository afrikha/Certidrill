id: aipc01-3b-custom-model-cmk
objective: "3.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An insurance company fine-tunes a foundation model in Amazon Bedrock with claims data. The compliance team requires that the company can make the resulting custom model unusable at any time by withdrawing Amazon Bedrock's access to the encryption key. The team also wants every use of the key to be recorded in AWS CloudTrail.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Keep the default encryption of custom models with AWS owned keys, and enable CloudTrail data events for the custom model.
    - id: b
      text:
        en: |-
          Encrypt the training and validation data in the S3 bucket with SSE-KMS by using a customer managed key, and keep the default encryption for the custom model.
    - id: c
      text:
        en: |-
          Specify a customer managed KMS key for the custom model when creating the customization job, with a key policy that allows Amazon Bedrock to use the key.
    - id: d
      text:
        en: |-
          Configure model invocation logging to an S3 bucket encrypted with a customer managed key, and revoke access to that key when the model must be disabled.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      Amazon Bedrock can encrypt custom models with a customer managed key that is specified when the customization job is created (customModelKmsKeyId). The key policy grants Amazon Bedrock actions such as kms:CreateGrant, kms:Decrypt and kms:GenerateDataKey; if the company revokes the grant or removes that access, Amazon Bedrock can no longer access the custom model, and AWS KMS records key usage in CloudTrail.
  options:
    a:
      en: |-
        AWS owned keys cannot be viewed, managed or audited by the customer, so the company could neither revoke access nor see key usage.
    b:
      en: |-
        SSE-KMS protects the training data in Amazon S3, but the custom model itself would stay encrypted with a key the company does not control.
    d:
      en: |-
        Revoking the key of the log bucket only stops log delivery; the custom model remains usable.
references:
  - title: Encryption of custom models - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/encryption-custom-job.html
  - title: Data encryption - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/data-encryption.html
