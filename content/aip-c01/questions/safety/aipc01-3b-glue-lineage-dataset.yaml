id: aipc01-3b-glue-lineage-dataset
objective: "3.3.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A pharmaceutical company builds the fine-tuning dataset for a medical-writing model with several AWS Glue jobs that join and transform tables registered in the AWS Glue Data Catalog. Auditors ask the company to show where the dataset's data came from and which transformations were applied to it. The company wants to use what its data platform already records rather than build its own tracking.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Generate an S3 Inventory report of the buckets that hold the source tables, and give the report to the auditors as the provenance record.
    - id: b
      text:
        en: |-
          Search AWS CloudTrail for the AWS Glue API calls made by the jobs, and reconstruct the transformations from the events.
    - id: c
      text:
        en: |-
          Describe the sources and transformations by hand in the evaluation section of the model's SageMaker Model Card.
    - id: d
      text:
        en: |-
          Use the lineage information that the AWS Glue Data Catalog keeps on the transformations and operations applied to cataloged data.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      The Data Catalog maintains a record of the transformations and operations performed on the data, which provides lineage information for auditing, compliance and provenance. Because the jobs already use cataloged tables, the lineage comes from the platform without custom tracking.
  options:
    a:
      en: |-
        S3 Inventory lists objects and their properties; it says nothing about how the tables were joined or transformed.
    b:
      en: |-
        CloudTrail records API calls, not the data-level transformations inside the jobs, so the lineage would have to be rebuilt by hand.
    c:
      en: |-
        A model card is the place to document the model, but writing the lineage there by hand is the custom tracking the company wants to avoid, and it is not derived from the jobs.
references:
  - title: Data discovery and cataloging in AWS Glue - AWS Glue
    url: https://docs.aws.amazon.com/glue/latest/dg/catalog-and-crawler.html
