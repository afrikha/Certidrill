id: aipc01-3c-lambda-agent-otel-layer
objective: "3.4.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A logistics company runs an AI agent built with LangChain inside an AWS Lambda function. The agent will not move to Amazon Bedrock AgentCore Runtime this year. The operations team wants the agent's traces and spans to appear in the AgentCore and CloudWatch generative AI observability views next to the company's AgentCore-hosted agents. The team wants to avoid adding libraries to the function's deployment package.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Rebuild the agent with Amazon Bedrock Agents (Agents Classic) so that InvokeAgent returns step traces that CloudWatch displays.
    - id: b
      text:
        en: |-
          Turn on CloudWatch Transaction Search, add the AWS Lambda Layer for OpenTelemetry, set AWS_LAMBDA_EXEC_WRAPPER to /opt/otel-instrument, and set the observability environment variables.
    - id: c
      text:
        en: |-
          Enable model invocation logging, and add the function's request ID to the requestMetadata of each Converse call so that CloudWatch links the agent's model calls into one trace.
    - id: d
      text:
        en: |-
          Add the aws-opentelemetry-distro package to the deployment package, start the agent with the opentelemetry-instrument command, and set the observability environment variables.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      Agents hosted outside AgentCore Runtime can send telemetry with the ADOT SDK or with the AWS Lambda Layer for OpenTelemetry. On Lambda, the layer with AWS_LAMBDA_EXEC_WRAPPER set to /opt/otel-instrument removes the need for the distro package and the instrument command. Transaction Search must be on, and LangChain has built-in OpenTelemetry support.
  options:
    a:
      en: |-
        Agents Classic is closed to new customers, and rebuilding the agent is far more work than instrumenting it.
    c:
      en: |-
        Invocation logs are individual model call records; request metadata does not turn them into traces of the agent's steps.
    d:
      en: |-
        This adds a library to the deployment package, which the team wants to avoid; on Lambda, AWS documents the layer instead.
references:
  - title: "Add observability to your Amazon Bedrock AgentCore resources - Amazon Bedrock AgentCore"
    url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/observability-configure.html
