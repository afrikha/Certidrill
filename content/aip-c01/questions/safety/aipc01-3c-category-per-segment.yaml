id: aipc01-3c-category-per-segment
objective: "3.4.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A bank evaluates its loan-support assistant with an Amazon Bedrock model-as-a-judge evaluation job on a custom dataset of 600 prompts. The prompts are written for six customer segments based on age band and region. The fairness review requires each metric to be reported per segment in the evaluation results so that the segments can be compared. The team wants the LEAST effort.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Create six datasets and six evaluation jobs, one for each segment, and merge the six reports manually.
    - id: b
      text:
        en: |-
          Add the segment name to the referenceResponse of each prompt record so that the judge compares the responses across segments.
    - id: c
      text:
        en: |-
          Add a category key with the segment name to each prompt record of the JSONL dataset, and run a single evaluation job.
    - id: d
      text:
        en: |-
          Replace the custom prompts with the built-in BOLD dataset, which reports results for each demographic domain.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      The optional category key of a judge prompt dataset groups the scores in the results, so one job reports every metric for each segment. A single dataset of up to 1,000 prompts holds all six segments.
  options:
    a:
      en: |-
        Separate jobs work but multiply the setup and require merging reports by hand, which is more effort.
    b:
      en: |-
        referenceResponse is the ground truth answer that the judge uses for correctness and completeness; a segment name there would distort those metrics.
    d:
      en: |-
        BOLD covers generic domains such as profession, gender and race, not the bank's age bands and regions, and it would replace the bank's own scenarios.
references:
  - title: "Create a prompt dataset for a model evaluation job that uses a model as judge - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/model-evaluation-prompt-datasets-judge.html
