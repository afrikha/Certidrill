id: aipc01-3c-runtime-disclaimer-check
objective: "3.4.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A bank's policy requires that every assistant answer that mentions an interest rate include an exact regulatory disclaimer, and that the share of answers that needed correction be reported every month. Tests show that the Amazon Bedrock model sometimes omits or paraphrases the disclaimer, even though the system prompt requires it.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Add a post-processing Lambda function that appends the exact disclaimer to interest-rate answers that lack it and publishes a custom metric for each correction.
    - id: b
      text:
        en: |-
          Repeat the disclaimer in the system prompt in capital letters, and add an instruction to copy it verbatim into every answer that mentions an interest rate.
    - id: c
      text:
        en: |-
          Add a denied topic for interest rates to the guardrail so that any answer about interest rates that does not contain the disclaimer is blocked.
    - id: d
      text:
        en: |-
          Configure a contextual grounding check that uses the disclaimer text as the grounding source for every answer that mentions an interest rate.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      Including an exact text is a deterministic rule that a model cannot guarantee. A post-processing check enforces it on every answer, and the custom metric records how often a correction was needed, which gives the monthly report. Guardrail policies evaluate meaning and do not insert required text.
  options:
    b:
      en: |-
        Prompt instructions are what already fails; a model can still omit or paraphrase the text.
    c:
      en: |-
        A denied topic blocks every answer on the subject, with or without the disclaimer, and cannot check for a specific sentence.
    d:
      en: |-
        The grounding check scores whether the answer is supported by a source; with the disclaimer as source, normal answers would score as ungrounded.
references:
  - title: "Block denied topics to help remove harmful content - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/guardrails-denied-topics.html
  - title: "Use contextual grounding check to filter hallucinations in responses - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/guardrails-contextual-grounding-check.html
