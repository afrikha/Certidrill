id: aipc01-3c-converse-document-citations
objective: "3.4.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A procurement team's assistant sends supplier contracts to an Amazon Bedrock model as document content blocks in Converse requests, without a knowledge base. Reviewers need each statement of an answer to show which part of which contract supports it. The team wants to use a built-in feature rather than asking the model to quote its sources in the answer text.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Add an instruction to the system prompt that asks the model to quote the supporting contract clause after each statement of the answer.
    - id: b
      text:
        en: |-
          Enable citations in the citations configuration of each document block, and display the citations that the response returns next to the statements.
    - id: c
      text:
        en: |-
          Enable the guardrail trace in each request, and display the contextual grounding scores that it returns next to each statement of the answer.
    - id: d
      text:
        en: |-
          Set the context field of each document block to a short summary of the contract so that the model can name the contract that it used.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      Each document block of a Converse request has a citations configuration that controls how citations are generated for that document. With citations enabled, the response returns citation content that links parts of the generated text to the locations in the source documents that support them, which the application displays.
  options:
    a:
      en: |-
        Quotes written by the model are free text that can be inaccurate, and the team wants a built-in feature instead.
    c:
      en: |-
        Grounding scores rate the whole response against a source; they do not identify which contract passage supports each statement.
    d:
      en: |-
        The context field gives the model guidance on how to process the document; without citations enabled, no citation is returned.
references:
  - title: "DocumentBlock - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/APIReference/API_runtime_DocumentBlock.html
