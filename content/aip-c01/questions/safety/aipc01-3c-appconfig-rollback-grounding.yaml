id: aipc01-3c-appconfig-rollback-grounding
objective: "3.3.4"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    A company stores the active prompt version ARN of its assistant in an AWS AppConfig configuration profile and deploys changes with a gradual deployment strategy. The assistant's guardrail includes a contextual grounding check that blocks ungrounded responses. The company wants each new prompt version to be rolled back automatically if, during the rollout, the share of responses blocked by the grounding check rises above 3 percent. The on-call engineer must be paged at the same time.

    Which combination of actions will meet these requirements? (Choose two.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Configure a Lambda function that lowers the grounding threshold of the guardrail when the share of blocked responses rises, so that fewer responses are blocked.
    - id: b
      text:
        en: |-
          Create a CloudWatch alarm on a metric math expression that divides InvocationsIntervened for the ContextualGroundingPolicy value of GuardrailPolicyType by the guardrail's Invocations metric, with an Amazon SNS action that pages the engineer.
    - id: c
      text:
        en: |-
          Move the prompt into an Amazon Bedrock flow, and use the flow alias to shift traffic between the old and new prompt versions with an alarm-based rollback.
    - id: d
      text:
        en: |-
          Add the alarm to the CloudWatch alarms of the AWS AppConfig environment so that AWS AppConfig rolls back the configuration if the alarm enters the ALARM state during a deployment.
    - id: e
      text:
        en: |-
          Enable Amazon SageMaker Model Monitor on the assistant to compare grounding scores with a baseline and to roll back the prompt version automatically.
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |-
      The InvocationsIntervened metric with the ContextualGroundingPolicy dimension value, divided by Invocations, gives the share of responses blocked by the grounding check, and the alarm's SNS action pages the engineer. When that alarm is listed in the AppConfig environment, AppConfig rolls the configuration back to the previous version if the alarm goes into ALARM during a deployment.
  options:
    a:
      en: |-
        Lowering the threshold lets more ungrounded answers through instead of rolling back the faulty prompt.
    c:
      en: |-
        A flow alias points to one version and is switched manually; it provides no traffic shifting with alarm-based rollback.
    e:
      en: |-
        SageMaker Model Monitor is no longer open to new customers, and it does not monitor Bedrock guardrail results or roll back AppConfig configurations.
references:
  - title: "Monitor Amazon Bedrock Guardrails using CloudWatch metrics - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/monitoring-guardrails-cw-metrics.html
  - title: "Monitoring deployments for automatic rollback - AWS AppConfig"
    url: https://docs.aws.amazon.com/appconfig/latest/userguide/monitoring-deployments.html
