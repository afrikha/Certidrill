id: aipc01-3a-acc-ar-translation-ambiguous
objective: "3.1.3"
type: single
difficulty: 3
status: draft
stem:
  en: |-
    A benefits administrator uses Automated Reasoning checks to validate an assistant's answers about employee benefits. Many results are TRANSLATION_AMBIGUOUS when users write phrases such as "two years of service" or "I'm a part-timer", although the policy has variables for months of service and for employment type. The team wants more answers to be validated without increasing the risk of incorrect validations.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Lower the confidence threshold of the policy to 0.5 so that fewer of these translations are reported as ambiguous findings.
    - id: b
      text:
        en: |-
          Add bare assertions such as eligibleForBenefits to the policy so that the rules are always satisfied.
    - id: c
      text:
        en: |-
          Switch the content filters of the guardrail to the Standard tier to improve how it understands the wording that users choose.
    - id: d
      text:
        en: |-
          Rewrite the variable descriptions with units, conversions, and synonyms that users say, such as years of service and part-timer.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      TRANSLATION_AMBIGUOUS means that the translation models disagreed and their agreement fell below the confidence threshold. Variable descriptions are the most important factor in translation accuracy, so adding units, conversions, and synonyms helps the models agree and validates more inputs at the same threshold.
  options:
    a:
      en: |-
        A lower threshold reduces ambiguous results but raises the risk of incorrect validations, which the team wants to avoid.
    b:
      en: |-
        Bare assertions become axioms that are always true, so inputs that contradict them return IMPOSSIBLE; they do not fix translation.
    c:
      en: |-
        Safeguard tiers apply to content filters, prompt attacks, denied topics, and contextual grounding, not to Automated Reasoning translation.
references:
  - title: Automated Reasoning checks concepts - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/automated-reasoning-checks-concepts.html
