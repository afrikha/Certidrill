id: aipc01-3b-inference-region-evidence
objective: "3.3.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A European bank's assistant calls ConverseStream in eu-central-1 through a geographic cross-Region inference profile. For a data residency review, auditors want evidence, for each request, of the AWS Region where inference actually ran. The bank's CloudTrail trail records management events.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Read the awsRegion field of each ConverseStream API call event in the trail, which records the Region that processed the request.
    - id: b
      text:
        en: |-
          Enable VPC Flow Logs on the bedrock-runtime interface endpoint, and map the destination addresses of each connection to Regions.
    - id: c
      text:
        en: |-
          Read the inferenceRegion entry of the stream-completion event that CloudTrail records after each stream, joined to the API call by request ID.
    - id: d
      text:
        en: |-
          Use AWS Config to record the configuration history of the inference profile, and give the auditors the list of destination Regions that the profile contains.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      After InvokeModelWithResponseStream or ConverseStream, Amazon Bedrock records a stream-completion event (eventType AwsServiceEvent) whose inferenceRegion entry reports the Region where inference ran. Its serviceEventDetails.parentRequestId links it to the requestID of the originating API call.
  options:
    a:
      en: |-
        awsRegion is the Region that recorded the event, which can differ from where inference ran when a cross-Region inference profile is used.
    b:
      en: |-
        Flow logs on the endpoint show traffic to the endpoint in the source Region only; the routing to another Region happens inside the service.
    d:
      en: |-
        The profile's Region list shows where requests may go, not where each request actually ran.
references:
  - title: Monitor Amazon Bedrock API calls using CloudTrail - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/logging-using-cloudtrail.html
