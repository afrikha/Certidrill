id: aipc01-3b-logs-insights-decisions
objective: "3.3.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A bank's GenAI assistant writes model invocation logs and structured decision logs, which include a customerId field, to CloudWatch Logs log groups with a 1-year retention period. During audits, a compliance analyst must list every decision made for a given customer over the last 90 days, within minutes of the request and without help from engineers. The bank wants the LEAST operational overhead.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Create a metric filter on customerId for each customer, and graph the resulting metrics in a CloudWatch dashboard.
    - id: b
      text:
        en: |-
          Run a CloudWatch Logs Insights query across both log groups that filters on customerId for the last 90 days, and save the query for reuse.
    - id: c
      text:
        en: |-
          Export the log groups to Amazon S3 every day, catalog the exports with AWS Glue, and query them with Amazon Athena.
    - id: d
      text:
        en: |-
          Stream the log groups to an Amazon OpenSearch Service domain with a subscription filter, and build an OpenSearch Dashboards view per customer.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      Logs Insights queries the log groups where the decisions already are, filters on structured fields such as customerId, and can query several log groups at once. A saved query lets the analyst rerun the search for any customer in minutes, with nothing to build or operate.
  options:
    a:
      en: |-
        Metric filters produce counts, not the decision records themselves, and one filter per customer does not scale.
    c:
      en: |-
        An export, cataloging and Athena pipeline works, but it adds daily jobs and storage that the existing log groups make unnecessary.
    d:
      en: |-
        An OpenSearch domain adds a cluster to run and pay for, which is more overhead than querying the logs in place.
references:
  - title: Analyzing log data with CloudWatch Logs Insights - Amazon CloudWatch Logs
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/logs/AnalyzingLogData.html
