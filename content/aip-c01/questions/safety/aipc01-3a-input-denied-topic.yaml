id: aipc01-3a-input-denied-topic
objective: "3.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |-
    A bank runs a customer assistant on Amazon Bedrock that answers questions about accounts and cards. Compliance requires the assistant to refuse every request for personalized investment recommendations, however the user phrases it, and to return a fixed refusal message. The assistant already uses an Amazon Bedrock guardrail with content filters.

    Which solution will meet these requirements with the LEAST operational overhead?
body:
  options:
    - id: a
      text:
        en: |-
          Add a word filter to the guardrail with the words "invest", "stocks", "portfolio", and "fund", and set its input action to BLOCK.
    - id: b
      text:
        en: |-
          Add a denied topic named Investment Advice to the guardrail with a precise definition and sample phrases, and set its input action to BLOCK.
    - id: c
      text:
        en: |-
          Raise the Misconduct content filter of the guardrail to HIGH strength on input so that requests for financial recommendations are blocked.
    - id: d
      text:
        en: |-
          Add a sensitive information filter with a custom regex that matches investment terms, and set its input action to BLOCK.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      A denied topic blocks prompts about a subject that you describe in natural language, so paraphrased requests for investment recommendations are caught without listing every wording. A guardrail supports up to 30 denied topics, each with a definition and up to five sample phrases, and the BLOCK action returns the configured blocked input message.
  options:
    a:
      en: |-
        Word filters use case-insensitive whole-word matching on exact words and phrases, so they miss paraphrases and would also block legitimate questions such as how to fund an account.
    c:
      en: |-
        The Misconduct category covers seeking or providing information about criminal activity or about harming or defrauding people; it does not detect requests for investment advice.
    d:
      en: |-
        Sensitive information filters target PII and pattern-based identifiers. A regex of keywords has the same paraphrase problem as a word list and is the wrong policy for a subject.
references:
  - title: Block denied topics to help remove harmful content - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/guardrails-denied-topics.html
  - title: Remove a specific list of words and phrases from conversations with word filters - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/guardrails-word-filters.html
