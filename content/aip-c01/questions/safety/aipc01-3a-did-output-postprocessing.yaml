id: aipc01-3a-did-output-postprocessing
objective: "3.1.4"
type: multi
difficulty: 2
status: draft
stem:
  en: |-
    A bank's assistant on Amazon Bedrock sometimes includes links in its answers, and a red team showed that injected content can make it output links to look-alike phishing domains. Answers also occasionally contain internal case IDs in the format CASE- followed by eight digits, which customers must never see. The bank wants deterministic controls in addition to its guardrail content filters.

    Which combination of steps will meet these requirements? (Choose two.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Add the custom word "CASE-" to the guardrail's word filter, and set its output action to BLOCK.
    - id: b
      text:
        en: |-
          Add a Lambda post-processing step that parses every URL in the answer and removes links whose domain is not on the bank's allow-list.
    - id: c
      text:
        en: |-
          Add a denied topic named Phishing Links to the guardrail, and set its output action to BLOCK.
    - id: d
      text:
        en: |-
          Add the regex CASE-[0-9]{8} to the guardrail's sensitive information filter, and set its output action to ANONYMIZE.
    - id: e
      text:
        en: |-
          Raise the Misconduct content filter of the guardrail to HIGH strength on output.
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |-
      An allow-list check in a post-processing Lambda function is deterministic and removes every link outside the approved domains, including look-alikes that a classifier could miss. A custom regex in the sensitive information filter matches the exact case ID pattern and masks it in responses.
  options:
    a:
      en: |-
        Word filters use whole-word matching on fixed words and phrases, so "CASE-" does not match IDs that include digits, and a word list cannot express a pattern.
    c:
      en: |-
        A denied topic is a probabilistic subject filter; it cannot tell a legitimate domain from a look-alike one.
    e:
      en: |-
        Content filter strength is probabilistic and does not validate link domains or remove identifiers.
references:
  - title: Remove PII from conversations by using sensitive information filters - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/guardrails-sensitive-filters.html
  - title: Remove a specific list of words and phrases from conversations with word filters - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/guardrails-word-filters.html
