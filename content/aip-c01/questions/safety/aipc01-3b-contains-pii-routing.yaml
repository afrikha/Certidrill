id: aipc01-3b-contains-pii-routing
objective: "3.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A publishing company ingests about 20,000 English articles a day into an Amazon S3 bucket. An AWS Lambda function processes each article as it arrives. Articles that contain any PII must be moved to a restricted bucket for later redaction, and articles without PII must be copied at once to the bucket that an Amazon Bedrock knowledge base indexes, so that they stay useful to readers. Each article is smaller than 50 KB, and the routing only needs to know whether PII is present and of which types.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Enable Amazon Macie automated sensitive data discovery on the ingestion bucket, and route each article according to the Macie findings.
    - id: b
      text:
        en: |-
          Call Amazon Comprehend ContainsPiiEntities from the function, and route each article according to the PII labels in the response.
    - id: c
      text:
        en: |-
          Start an Amazon Comprehend PII entities detection job for each article, and route the article when the job completes.
    - id: d
      text:
        en: |-
          Ask a foundation model on Amazon Bedrock whether each article contains PII, and route the article according to the model's answer.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      ContainsPiiEntities analyzes text of up to 100 KB in real time and returns the labels of the PII types found, with a score for each. That is exactly what the routing decision needs, so each article is handled as soon as it arrives.
  options:
    a:
      en: |-
        Automated discovery samples representative objects, so not every article is analyzed, and findings do not arrive at the moment each article lands.
    c:
      en: |-
        Asynchronous jobs are designed for batches of documents; starting a job per article adds latency and job management for 20,000 articles a day.
    d:
      en: |-
        An FM answer is not a deterministic detector and costs more per article than a purpose-built PII API.
references:
  - title: ContainsPiiEntities - Amazon Comprehend
    url: https://docs.aws.amazon.com/comprehend/latest/APIReference/API_ContainsPiiEntities.html
