id: aipc01-3b-applyguardrail-masked-history
objective: "3.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A travel company's booking assistant stores each user message in an Amazon DynamoDB table so that later turns of the conversation keep their context. The stored history must not contain users' email addresses or phone numbers, but it must keep a placeholder that shows which kind of value the user gave, so that the assistant stays coherent. The company already has an Amazon Bedrock guardrail whose sensitive information filter anonymizes EMAIL and PHONE. The company wants the LEAST custom code.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Store the messages as they are received, and encrypt the DynamoDB table with a customer managed KMS key that only the application role can use.
    - id: b
      text:
        en: |-
          Store the guardrail trace that the Converse response returns for each message, and rebuild the history from the trace when it is needed.
    - id: c
      text:
        en: |-
          Call ApplyGuardrail with the source set to INPUT on each message, and store the text from the response outputs, which contains the masked placeholders.
    - id: d
      text:
        en: |-
          Write regular expressions for email and phone formats in an AWS Lambda function, and store each message after the function replaces the matches.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      ApplyGuardrail evaluates any text without invoking a model, and when the guardrail only masks content, the response returns the same text with masking applied, for example {EMAIL} or {PHONE}. Storing that output keeps the context and the type of each value while reusing the existing guardrail.
  options:
    a:
      en: |-
        Encryption at rest leaves the raw values in the history, which the application and the model would still read in later turns.
    b:
      en: |-
        The match field of the guardrail trace contains the original PII values, so storing the trace would keep exactly what must be removed.
    d:
      en: |-
        Custom regular expressions duplicate the detection that the guardrail already performs and must be written, tested and maintained.
references:
  - title: Use the ApplyGuardrail API in your application - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/guardrails-use-independent-api.html
  - title: Remove PII from conversations by using sensitive information filters - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/guardrails-sensitive-filters.html
