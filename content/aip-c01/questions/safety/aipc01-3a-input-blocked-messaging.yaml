id: aipc01-3a-input-blocked-messaging
objective: "3.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |-
    A utility company's billing assistant uses an Amazon Bedrock guardrail. When the guardrail blocks a user's prompt, the user must see "I can only help with billing and payment questions." When the guardrail blocks a model response, the user must see a different, generic apology.

    Which guardrail configuration will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Put both messages in blockedOutputsMessaging, and let the guardrail choose one based on the source of the intervention.
    - id: b
      text:
        en: |-
          Add the billing message as a sample phrase of each denied topic so that it is returned when a topic is blocked.
    - id: c
      text:
        en: |-
          Set blockedInputMessaging to the billing message and set blockedOutputsMessaging to the generic apology.
    - id: d
      text:
        en: |-
          Return the billing message from the application whenever the Converse response has the stopReason end_turn.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      A guardrail has two configurable messages: blockedInputMessaging replaces a blocked prompt, and blockedOutputsMessaging replaces a blocked model response. Every policy whose action is BLOCK returns the message that matches the direction.
  options:
    a:
      en: |-
        blockedOutputsMessaging holds a single message that is used only for blocked responses.
    b:
      en: |-
        Sample phrases are examples that help the guardrail detect a topic; they are never returned to users.
    d:
      en: |-
        end_turn means that the model finished normally; a guardrail intervention is reported with the stopReason guardrail_intervened.
references:
  - title: Block harmful words and conversations with content filters - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/guardrails-content-filters.html
  - title: Include a guardrail with the Converse API - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/guardrails-use-converse-api.html
