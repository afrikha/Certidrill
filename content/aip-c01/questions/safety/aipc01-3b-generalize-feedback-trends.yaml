id: aipc01-3b-generalize-feedback-trends
objective: "3.2.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A hospital network sends patient feedback records to a foundation model on Amazon Bedrock to produce monthly reports on satisfaction trends by age group and region. Each record contains the patient's name, email address, exact date of birth, street address and free-text comment. The reports must keep the trends by age group and region, and no individual patient may be identifiable from what the model receives. Nobody needs to trace a comment back to a patient.

    Which combination of steps will meet these requirements? (Choose two.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Remove the names and email addresses from the records before the model call.
    - id: b
      text:
        en: |-
          Replace each patient's name with a reversible token, and give the report team access to the token mapping table.
    - id: c
      text:
        en: |-
          Replace the exact dates of birth with age bands and the street addresses with regions before the model call.
    - id: d
      text:
        en: |-
          Redact the dates of birth and street addresses completely with an Amazon Comprehend redaction job before the model call.
    - id: e
      text:
        en: |-
          Replace the real feedback records with synthetic records that an FM generates from a description of the hospital's patient population.
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |-
      The direct identifiers (name, email address) are not needed for trend reports, so data minimization removes them. Generalization turns the quasi-identifiers into age bands and regions, which keeps exactly the dimensions the report needs while preventing re-identification from an exact birth date and address.
  options:
    b:
      en: |-
        A reversible token with an accessible mapping lets the report team re-identify patients, which is not needed and not allowed here.
    d:
      en: |-
        Removing age and location entirely makes the trends by age group and region impossible to compute.
    e:
      en: |-
        Synthetic records do not reflect the real feedback, so the reports would not show the actual satisfaction trends.
references:
  - title: Personally identifiable information (PII) - Amazon Comprehend
    url: https://docs.aws.amazon.com/comprehend/latest/dg/pii.html
