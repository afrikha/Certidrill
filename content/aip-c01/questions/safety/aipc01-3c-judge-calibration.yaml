id: aipc01-3c-judge-calibration
objective: "3.4.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company plans to use the Builtin.Stereotyping score from an Amazon Bedrock model-as-a-judge evaluation job as an automatic release gate for new prompt versions. The responsible AI lead is concerned that the judge's scores might not match the company's own definition of a stereotype, which is written in its responsible AI policy.

    What should the team do before it enables the release gate?
body:
  options:
    - id: a
      text:
        en: |-
          Have company reviewers rate a sample of the judged responses, compare their ratings with the judge's scores, and tune the threshold or add a custom metric if they disagree.
    - id: b
      text:
        en: |-
          Use the same model as both the evaluated model and the judge so that the judge understands the style and vocabulary of the responses that it scores.
    - id: c
      text:
        en: |-
          Increase the temperature of the evaluated model so that the evaluation dataset produces more varied responses for the judge to score before the gate.
    - id: d
      text:
        en: |-
          Replace the judge metric with the Toxicity metric of an automatic evaluation job, because programmatic metrics are deterministic and need no validation by reviewers.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      A judge score is only a valid gate if it agrees with the organization's definition. Comparing the judge's scores with the company's own reviewers on a sample shows whether the built-in metric matches the policy; if it does not, Amazon Bedrock supports custom judge metrics with your own rubric, and the threshold can be tuned.
  options:
    b:
      en: |-
        Judging its own outputs does not align the score with the company's definition and can bias the judge toward its own style.
    c:
      en: |-
        More varied responses do not tell the team whether the judge's scores match the policy.
    d:
      en: |-
        Toxicity does not measure stereotypes, so the gate would no longer test the policy at all.
references:
  - title: "Use metrics to understand model performance - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/model-evaluation-metrics.html
  - title: "Create a prompt dataset for a model evaluation job that uses a model as judge - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/model-evaluation-prompt-datasets-judge.html
