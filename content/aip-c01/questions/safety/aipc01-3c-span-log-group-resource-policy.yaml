id: aipc01-3c-span-log-group-resource-policy
objective: "3.4.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company runs an agent built with Strands Agents on Amazon ECS, outside Amazon Bedrock AgentCore Runtime. The agent uses the AWS Distro for OpenTelemetry (ADOT) SDK with the AgentCore observability environment variables and sends its spans to a CloudWatch Logs log group that the team created for the agent. CloudWatch Transaction Search is turned on in the account. Auditors need the agent's step-by-step traces, but no spans arrive in the log group.

    Which change will fix the problem?
body:
  options:
    - id: a
      text:
        en: |-
          Turn off CloudWatch Transaction Search so that the spans are written to the shared aws/spans log group instead of the agent's log group.
    - id: b
      text:
        en: |-
          Send the X-Amzn-Bedrock-AgentCore-Runtime-Session-Id header with every request that the agent receives so that its spans are grouped by session.
    - id: c
      text:
        en: |-
          Add a CloudWatch Logs resource policy to the agent's log group that allows xray.amazonaws.com to call logs:PutLogEvents on that log group.
    - id: d
      text:
        en: |-
          Set DISABLE_ADOT_OBSERVABILITY to true in the task definition so that the agent falls back to the default AgentCore observability configuration.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      When an agent hosted outside AgentCore sends spans to its own log group, AWS requires a CloudWatch Logs resource policy that lets xray.amazonaws.com call logs:PutLogEvents on that group, in addition to Transaction Search. Without it, the spans cannot be delivered to the log group.
  options:
    a:
      en: |-
        Transaction Search is a prerequisite for viewing AgentCore spans and traces; turning it off makes the problem worse.
    b:
      en: |-
        The session ID header propagates session IDs to telemetry; it does not grant permission to deliver spans.
    d:
      en: |-
        This variable removes the default ADOT configuration of AgentCore Runtime so that you can use another observability platform; it does not deliver spans.
references:
  - title: "Add observability to your Amazon Bedrock AgentCore resources - Amazon Bedrock AgentCore"
    url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/observability-configure.html
