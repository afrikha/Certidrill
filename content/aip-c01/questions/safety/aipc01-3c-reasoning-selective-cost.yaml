id: aipc01-3c-reasoning-selective-cost
objective: "3.4.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A financial planning app uses an Amazon Bedrock model that supports reasoning. To make answers more transparent, the team enabled reasoning on every request and displays a summary of the steps. Since then, latency and output token costs have grown sharply, although most questions are simple, such as branch opening hours. The team wants to keep step-by-step explanations for multi-step calculations and reduce cost and latency with the LEAST effect on answer quality.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Keep reasoning enabled on every request, and lower the maximum number of output tokens for all requests to shorten the responses.
    - id: b
      text:
        en: |-
          Disable reasoning on every request, and ask the model to answer every question in a single sentence.
    - id: c
      text:
        en: |-
          Keep reasoning enabled on every request, and switch the guardrail to the asynchronous streaming mode to reduce the perceived latency.
    - id: d
      text:
        en: |-
          Classify each request, and enable reasoning only for multi-step calculation questions, while simple questions run without reasoning.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      Reasoning improves accuracy on multi-step analysis, math and complex reasoning, but it adds latency and output tokens, and simple tasks are not good candidates for it. Enabling it only where step-by-step work adds value keeps transparent explanations for calculations while simple answers become faster and cheaper.
  options:
    a:
      en: |-
        A lower output limit on all requests can truncate the reasoning or the answer of the complex questions, which hurts quality.
    b:
      en: |-
        Without reasoning, the multi-step calculations lose their accuracy benefit and their step-by-step explanation.
    c:
      en: |-
        The guardrail streaming mode does not reduce reasoning tokens, and asynchronous mode can let unsafe chunks reach users.
references:
  - title: "Enhance model responses with model reasoning - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/inference-reasoning.html
