id: aipc01-3c-guardrail-sharing-outside-org
objective: "3.3.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company recently acquired a subsidiary whose AWS account is not yet a member of the company's organization in AWS Organizations. The subsidiary's chatbot calls Amazon Bedrock. The governance board requires the chatbot to use the corporate guardrail, which is owned by the company's central security account, and the subsidiary must not maintain its own copy of the guardrail configuration.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Add a resource-based policy to the corporate guardrail that grants the subsidiary's account bedrock:ApplyGuardrail, and have the chatbot reference the guardrail ARN in its requests.
    - id: b
      text:
        en: |-
          Export the configuration of the corporate guardrail, and have the subsidiary create an identical guardrail in its own account and reference it in the chatbot's requests.
    - id: c
      text:
        en: |-
          Attach an Amazon Bedrock policy to the subsidiary's account from the company's management account while the account remains outside the organization.
    - id: d
      text:
        en: |-
          Invite the subsidiary's account to join the organization, then share the corporate guardrail with the organization and enforce it through an Amazon Bedrock policy.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      Amazon Bedrock Guardrails supports cross-account sharing only within an organization: the guardrail and the requesting role must belong to accounts in the same AWS organization. Once the subsidiary's account joins, the central guardrail can be shared and enforced through an Amazon Bedrock policy, with no copy in the subsidiary.
  options:
    a:
      en: |-
        Cross-account use of a guardrail is supported only within the same organization, so an account outside it cannot use the shared guardrail.
    b:
      en: |-
        A copy is exactly what the board forbids, and it would drift from the corporate configuration.
    c:
      en: |-
        Organizations policies can be attached only to the root, OUs, or accounts that belong to the organization.
references:
  - title: "Enforce the use of specific guardrails in model inference requests - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/guardrails-permissions-id.html
  - title: "Apply cross-account safeguards with Amazon Bedrock Guardrails enforcements - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/guardrails-enforcements.html
