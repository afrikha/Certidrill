id: aipc01-3a-output-kb-guardrail
objective: "3.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |-
    A university built a course-catalog assistant on a customer-managed Amazon Bedrock knowledge base and calls the RetrieveAndGenerate API. The university already has a guardrail version that filters insults and sexual content. Generated answers must be filtered by this guardrail with the LEAST development effort.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Call the guardrail from a custom transformation Lambda function that runs when the knowledge base ingests documents.
    - id: b
      text:
        en: |-
          Specify the guardrail ID and version in the guardrailConfiguration of the generation configuration of each request.
    - id: c
      text:
        en: |-
          Replace RetrieveAndGenerate with the Retrieve API, and send every retrieved chunk to the ApplyGuardrail API before generation.
    - id: d
      text:
        en: |-
          Attach the guardrail to the service role of the knowledge base so that every answer generated from the knowledge base is filtered.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      RetrieveAndGenerate accepts a guardrailConfiguration with the guardrail ID and version inside generationConfiguration. The response reports guardrailAction INTERVENED when the guardrail changes the answer.
  options:
    a:
      en: |-
        A transformation during ingestion processes source documents, not the answers that are generated at query time.
    c:
      en: |-
        This checks retrieved chunks instead of generated answers and requires rewriting the generation step.
    d:
      en: |-
        An IAM role grants permissions; a guardrail cannot be attached to a role to filter generation.
references:
  - title: RetrieveAndGenerate - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/APIReference/API_agent-runtime_RetrieveAndGenerate.html
