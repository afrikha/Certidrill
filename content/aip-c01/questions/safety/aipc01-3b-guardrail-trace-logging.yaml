id: aipc01-3b-guardrail-trace-logging
objective: "3.2.3"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    A bank's chat application calls the Converse API with a guardrail that anonymizes NAME and US_BANK_ACCOUNT_NUMBER in responses, and guardrail trace is enabled. For debugging, the application writes the complete Converse response object to its own CloudWatch Logs log group. Customers see masked responses, but an audit finds real names and account numbers in the application log group. The bank must keep masking for customers and must stop the exposure in the application logs.

    Which combination of steps will meet these requirements? (Choose two.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Change the guardrail action for NAME and US_BANK_ACCOUNT_NUMBER from ANONYMIZE to BLOCK in the output.
    - id: b
      text:
        en: |-
          Disable guardrail trace in production, or strip the trace from the response before it is logged.
    - id: c
      text:
        en: |-
          Also set the input action of the sensitive information filter to ANONYMIZE for both entity types.
    - id: d
      text:
        en: |-
          Encrypt the application log group with a customer managed KMS key that only the audit team can use.
    - id: e
      text:
        en: |-
          Create a log group data protection policy with managed data identifiers for names and bank account numbers.
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: |-
      The match field of the PII entity filter in the guardrail trace contains the original value by design, so logging the full response with its trace exposes the data that the customer sees masked. Dropping the trace from what is logged removes that source, and a CloudWatch Logs data protection policy masks any remaining sensitive values at ingestion.
  options:
    a:
      en: |-
        BLOCK would deny customers their answers, and the trace would still report the detected values.
    c:
      en: |-
        Masking the input does not change the trace of the output assessment, which still contains the original values.
    d:
      en: |-
        Encryption at rest does not mask anything for the people who are allowed to read the log group.
references:
  - title: Remove PII from conversations by using sensitive information filters - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/guardrails-sensitive-filters.html
  - title: Help protect sensitive log data with masking - Amazon CloudWatch Logs
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/logs/mask-sensitive-log-data.html
