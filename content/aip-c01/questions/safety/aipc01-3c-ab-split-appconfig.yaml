id: aipc01-3c-ab-split-appconfig
objective: "3.4.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company has two versions of the prompt for its credit card support assistant in Amazon Bedrock Prompt Management. Version 4 is in production, and version 5 had better fairness scores offline. The company wants to send 10 percent of customers to version 5 in production, keep each customer on the same version across sessions, and compare per-segment quality and refusal metrics between the two versions in CloudWatch.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Create two prompt variants in Prompt Management, and configure the prompt to route 10 percent of the production invocations to the second variant, keyed on the customer.
    - id: b
      text:
        en: |-
          Create an Amazon CloudWatch Evidently launch with two variations and a 10 percent traffic allocation for version 5, using the customer ID as the entity ID.
    - id: c
      text:
        en: |-
          In the application code, randomly choose version 5 for 10 percent of the requests, and record the chosen prompt version in each response and in the metrics.
    - id: d
      text:
        en: |-
          Create an AWS AppConfig multi-variant flag that splits on the customer ID at 10 percent to return the version 5 ARN, use the returned ARN in Converse, and tag metrics with the version.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      The AppConfig split operator assigns a percentage of traffic by hashing a context value consistently, so splitting on the customer ID keeps each customer on the same variant. Tagging calls and metrics with the prompt version lets CloudWatch compare the per-segment metrics of both versions.
  options:
    a:
      en: |-
        Prompt variants are compared while iterating in the prompt builder; Prompt Management does not split production traffic between them.
    b:
      en: |-
        CloudWatch Evidently has been discontinued, so it cannot be used for a new experiment.
    c:
      en: |-
        A random choice per request moves the same customer between versions across sessions.
references:
  - title: "Understanding multi-variant feature flag rules - AWS AppConfig"
    url: https://docs.aws.amazon.com/appconfig/latest/userguide/appconfig-creating-multi-variant-feature-flags-rules.html
  - title: "Construct and store reusable prompts with Prompt management in Amazon Bedrock - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/prompt-management.html
