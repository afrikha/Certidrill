id: aipc01-3b-kb-metadata-attribution
objective: "3.3.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A manufacturer's assistant answers questions with RetrieveAndGenerate on an Amazon Bedrock knowledge base whose data source is an Amazon S3 bucket of policy documents. For each cited passage, the user interface must show the source system and the owning team of the document. These values differ for each document and are not in the documents' text. The company wants the LEAST custom code.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Add the source system and the owning team as S3 user-defined metadata (x-amz-meta-) on each document object, and re-sync the data source.
    - id: b
      text:
        en: |-
          Append a paragraph with the source system and the owning team to the end of each document, and re-sync the knowledge base.
    - id: c
      text:
        en: |-
          Instruct the model in the prompt template to state the source system and the owning team of its sources after each answer.
    - id: d
      text:
        en: |-
          Add a .metadata.json file with the two attributes next to each document, re-sync, and read them from the citations' retrieved references.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      A knowledge base reads document attributes from a metadata file named after the document with .metadata.json appended, stored next to it. After a sync, the attributes are returned in the metadata field of each retrieved reference in the citations, so the interface can display them for every cited passage.
  options:
    a:
      en: |-
        Knowledge base metadata comes from the .metadata.json sidecar files; S3 user-defined object metadata is not returned in the citations.
    b:
      en: |-
        Text appended to a document ends up in only one chunk, so most cited passages would not carry the attribution.
    c:
      en: |-
        The model does not know these values, because they are not in the text it receives, so it would invent them.
references:
  - title: Connect to Amazon S3 for your knowledge base - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/s3-data-source-connector.html
  - title: RetrievedReference - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/APIReference/API_agent-runtime_RetrievedReference.html
