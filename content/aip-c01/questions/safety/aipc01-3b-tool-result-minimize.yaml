id: aipc01-3b-tool-result-minimize
objective: "3.2.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    An airline's agent, built with Strands Agents and Amazon Bedrock, calls a get_booking tool that returns the full passenger record, including phone numbers and passport numbers. The agent's guardrail anonymizes PHONE and US_PASSPORT_NUMBER, but a review shows that these values still reach the model through the tool results. The agent only needs flight, seat and status information to answer. The airline wants the model to stop receiving these values while keeping the agent's answers complete.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Raise the strength of the guardrail's content filters for prompts to HIGH so that tool results are inspected.
    - id: b
      text:
        en: |-
          Change the get_booking tool so that it returns only the flight, seat and status fields of the booking.
    - id: c
      text:
        en: |-
          Change the sensitive information filter action for both entity types from ANONYMIZE to BLOCK.
    - id: d
      text:
        en: |-
          Add an instruction to the system prompt that tells the model to ignore phone and passport numbers in tool results.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      Sensitive information filters do not evaluate toolUse input, toolResult or toolSpec content, so the guardrail cannot mask values returned by a tool. Minimizing the tool's output to the fields the agent needs keeps the answers complete and keeps the personal data away from the model.
  options:
    a:
      en: |-
        Content filter strength changes how harmful-content categories are detected; it does not make the guardrail evaluate tool results for PII.
    c:
      en: |-
        BLOCK has the same scope as ANONYMIZE: tool results are still not evaluated, and blocking would only deny answers when the model repeats a value.
    d:
      en: |-
        A prompt instruction does not stop the values from being sent to the model; they are still in its context.
references:
  - title: Remove PII from conversations by using sensitive information filters - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/guardrails-sensitive-filters.html
