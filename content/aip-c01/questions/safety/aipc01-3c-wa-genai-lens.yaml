id: aipc01-3c-wa-genai-lens
objective: "3.3.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A retail company runs five generative AI applications on Amazon Bedrock and Amazon SageMaker AI. The governance team wants each application team to review its workload twice a year against AWS best practices that are specific to generative AI, including responsible AI and the risk of excessive agency, and to track the resulting improvement plans in one place.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Run each review in the AWS Well-Architected Tool with the Machine Learning Lens, and track the improvement plans in the tool.
    - id: b
      text:
        en: |-
          Import the Generative AI Lens into the AWS Well-Architected Tool as a custom lens, and run each workload review against it.
    - id: c
      text:
        en: |-
          Run each review in the AWS Well-Architected Tool with only the AWS Well-Architected Framework lens, and record generative AI risks as notes.
    - id: d
      text:
        en: |-
          Run an Amazon Bedrock model evaluation job for each application twice a year, and store the evaluation reports in one Amazon S3 bucket.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      The Generative AI Lens extends the Well-Architected Framework to foundation model workloads on Amazon Bedrock and SageMaker AI, covers the six pillars including mitigation of harmful outputs and excessive agency, and highlights responsible AI practices. It is published as a JSON file that you import into the AWS Well-Architected Tool as a custom lens, where reviews and improvement plans are tracked.
  options:
    a:
      en: |-
        The Machine Learning Lens targets traditional machine learning workloads; AWS points generative AI workloads to the Generative AI Lens.
    c:
      en: |-
        The general framework lens does not contain the generative AI specific questions, so the risks would be tracked informally.
    d:
      en: |-
        Evaluation jobs measure model output quality; they do not review the workload against architecture and governance best practices.
references:
  - title: "Generative AI Lens - AWS Well-Architected Framework"
    url: https://docs.aws.amazon.com/wellarchitected/latest/generative-ai-lens/generative-ai-lens.html
