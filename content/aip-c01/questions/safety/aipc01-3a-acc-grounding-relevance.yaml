id: aipc01-3a-acc-grounding-relevance
objective: "3.1.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |-
    An insurance company's RAG assistant calls the Amazon Bedrock Converse API with policy passages that the application retrieves. Reviewers found two problems. Some answers state coverage limits that do not appear in the passages, and some answers quote correct passages that do not address the customer's question. The company wants Amazon Bedrock Guardrails to block both kinds of answers.

    Which combination of steps will meet these requirements? (Choose two.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Build an Automated Reasoning policy from the passages retrieved for each request, and attach it to the guardrail.
    - id: b
      text:
        en: |-
          Enable the grounding filter of a contextual grounding check, and send the passages in a guardContent block with the grounding_source qualifier.
    - id: c
      text:
        en: |-
          Add a denied topic named Unsupported Coverage Limits to the guardrail, and set its output action to BLOCK.
    - id: d
      text:
        en: |-
          Enable the relevance filter of a contextual grounding check, and send the customer's question in a guardContent block with the query qualifier.
    - id: e
      text:
        en: |-
          Raise the Misconduct content filter of the guardrail to HIGH strength on output, and set its action to BLOCK.
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |-
      The grounding check flags responses that contain information not supported by the grounding source, and the relevance check flags responses that do not answer the query. With the Converse API, the source and the query are passed in guardContent blocks with the grounding_source and query qualifiers, and responses that score below the thresholds are blocked.
  options:
    a:
      en: |-
        Automated Reasoning policies are created and tested in advance from a source document of rules; they are not built from the passages of each request.
    c:
      en: |-
        A denied topic blocks a subject; it cannot judge whether an answer is supported by the retrieved passages.
    e:
      en: |-
        The Misconduct category detects content about criminal activity or harming people, not unsupported or irrelevant answers.
references:
  - title: Use contextual grounding check to filter hallucinations in responses - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/guardrails-contextual-grounding-check.html
