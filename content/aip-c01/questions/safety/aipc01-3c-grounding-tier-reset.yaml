id: aipc01-3c-grounding-tier-reset
objective: "3.4.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A bank's policy requires its multi-turn advisory assistant to block answers that are not grounded in the retrieved documents. The guardrail uses a contextual grounding check in the Standard tier, which supports conversational use cases. A developer later called UpdateGuardrail to change the grounding threshold and sent only the updated filtersConfig. Since then, many valid conversational answers are blocked as ungrounded.

    What should the developer do to restore compliant behavior?
body:
  options:
    - id: a
      text:
        en: |-
          Lower the grounding threshold to 0.3 so that the conversational answers pass the contextual grounding check again, and create a new guardrail version.
    - id: b
      text:
        en: |-
          Call UpdateGuardrail again with tierConfig set to STANDARD in the contextual grounding policy, retest the thresholds, and create a new guardrail version.
    - id: c
      text:
        en: |-
          Raise the relevance threshold to 0.99 so that the check focuses on relevance instead of grounding for the conversational answers of every turn.
    - id: d
      text:
        en: |-
          Change the grounding filter action to NONE so that the conversational answers are no longer blocked by the contextual grounding check.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      UpdateGuardrail replaces the entire policy configuration, and omitting tierConfig resets a Standard tier contextual grounding policy to the Classic tier. Classic evaluates strict grounding, penalizes conversational phrasing, and does not support conversational use cases, so the tier must be restored and the thresholds retested because the tiers score differently.
  options:
    a:
      en: |-
        A very low threshold lets hallucinated answers through, which breaks the policy instead of fixing the tier.
    c:
      en: |-
        A threshold of 0.99 blocks more answers, and relevance does not replace the grounding requirement.
    d:
      en: |-
        Detect mode stops blocking ungrounded answers, which the policy requires.
references:
  - title: "Use contextual grounding check to filter hallucinations in responses - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/guardrails-contextual-grounding-check.html
