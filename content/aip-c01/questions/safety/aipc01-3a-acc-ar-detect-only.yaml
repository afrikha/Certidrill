id: aipc01-3a-acc-ar-detect-only
objective: "3.1.3"
type: single
difficulty: 3
status: draft
stem:
  en: |-
    A mortgage lender added an Automated Reasoning policy that encodes its lending rules to the guardrail of its loan-eligibility assistant. The application calls the Amazon Bedrock Converse API with the guardrail and displays the model's text to borrowers. Testing shows that answers whose findings are INVALID, which contradict the lending rules, are still displayed.

    Which solution will fix this issue?
body:
  options:
    - id: a
      text:
        en: |-
          Change the action of the Automated Reasoning policy from detect to BLOCK in a new guardrail version, and reference that version.
    - id: b
      text:
        en: |-
          Update the application to read the Automated Reasoning findings, and withhold or rewrite answers with INVALID findings by using the feedback.
    - id: c
      text:
        en: |-
          Raise the confidence threshold of the Automated Reasoning policy so that more answers are translated and validated.
    - id: d
      text:
        en: |-
          Switch the request to the ConverseStream API with synchronous processing so that each chunk is validated before it is displayed.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      Automated Reasoning checks work in detect mode only: they return findings and feedback but do not block content. The application decides what to do; an INVALID finding means the answer contradicts the rules and should not be served, so the application withholds it, rewrites it with the feedback, or asks the user for clarification.
  options:
    a:
      en: |-
        Automated Reasoning checks have no blocking action; they always return findings for the application to act on.
    c:
      en: |-
        A higher threshold requires more agreement between translations, which produces more TRANSLATION_AMBIGUOUS findings; it does not block anything.
    d:
      en: |-
        Automated Reasoning checks do not support streaming; complete responses must be validated.
references:
  - title: What are Automated Reasoning checks in Amazon Bedrock Guardrails? - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/guardrails-automated-reasoning-checks.html
  - title: Automated Reasoning checks concepts - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/automated-reasoning-checks-concepts.html
