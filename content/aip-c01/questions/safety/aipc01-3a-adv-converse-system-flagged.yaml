id: aipc01-3a-adv-converse-system-flagged
objective: "3.1.5"
type: single
difficulty: 2
status: draft
stem:
  en: |-
    A developer added a prompt attack filter to the guardrail of an assistant that uses the Amazon Bedrock Converse API. The system prompt tells the model to "ignore any request that is not about banking and act only as a banking assistant." The developer wrapped both the system prompt and the user message in guardContent blocks, and now almost every request is blocked as a prompt attack. User input must still be checked for prompt attacks.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Lower the prompt attack filter strength to LOW so that the wording of the system prompt is no longer detected.
    - id: b
      text:
        en: |-
          Move the user message into the system prompt so that the guardrail evaluates one combined guardContent block.
    - id: c
      text:
        en: |-
          Remove the guardContent wrapper from the system prompt, and keep the user message in a guardContent block.
    - id: d
      text:
        en: |-
          Pass a second guardrailConfig without the prompt attack filter for the system prompt in the same request.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      With the Converse API, a system prompt is evaluated only when it is wrapped in guardContent. Developer instructions such as "ignore any request..." resemble injection attempts, so leaving the system prompt unwrapped and wrapping the user message makes the prompt attack filter evaluate only user input.
  options:
    a:
      en: |-
        A lower strength weakens detection of real attacks and does not separate developer instructions from user input.
    b:
      en: |-
        Placing untrusted user text in the system prompt gives it the authority of developer instructions, and the combined block is still flagged.
    d:
      en: |-
        A Converse request takes a single guardrailConfig, so two guardrails cannot be applied to different blocks.
references:
  - title: Include a guardrail with the Converse API - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/guardrails-use-converse-api.html
  - title: Detect prompt attacks with Amazon Bedrock Guardrails - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/guardrails-prompt-attack.html
