id: aipc01-3b-partial-mask-card
objective: "3.2.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A payment company's assistant sometimes returns responses that contain a customer's full card number taken from the customer's own records. Customers must still recognize which card a response refers to, so the response must show only the last four digits, with the other digits replaced by asterisks. The responses are in English and are returned synchronously through an AWS Lambda function.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          In the function, call Comprehend DetectPiiEntities on each response, and use the CREDIT_DEBIT_NUMBER offsets to mask all but the last four digits.
    - id: b
      text:
        en: |-
          Run an Amazon Comprehend PII redaction job with the MASK mask mode on the responses, and return the redacted text to each customer.
    - id: c
      text:
        en: |-
          Attach a guardrail with a sensitive information filter that anonymizes the CREDIT_DEBIT_CARD_NUMBER entity type in all the model responses it returns.
    - id: d
      text:
        en: |-
          Attach a guardrail with a sensitive information filter that blocks CREDIT_DEBIT_CARD_NUMBER in all model responses.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      Partial masking needs the exact position of the value. DetectPiiEntities returns each entity's type and begin and end offsets in real time, so the function can keep the last four digits and mask the rest.
  options:
    b:
      en: |-
        Redaction jobs are asynchronous batch jobs on documents in Amazon S3, which does not fit a synchronous response, and the MASK mode masks the entire value.
    c:
      en: |-
        ANONYMIZE replaces the whole number with {CREDIT_DEBIT_CARD_NUMBER}, so the customer cannot see the last four digits.
    d:
      en: |-
        BLOCK replaces the whole response with the blocked message, so the customer receives no answer.
references:
  - title: DetectPiiEntities - Amazon Comprehend
    url: https://docs.aws.amazon.com/comprehend/latest/APIReference/API_DetectPiiEntities.html
  - title: Remove PII from conversations by using sensitive information filters - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/guardrails-sensitive-filters.html
