id: aipc01-3b-tokenize-reidentify
objective: "3.2.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A bank's assistant helps customers compare activity across their accounts. The model must be able to tell the customer's accounts apart across all turns of a conversation, and the final answer shown to the signed-in customer must contain the real account numbers. The bank requires that the model, the model invocation logs and the vector store never contain a real account number.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Tokenize account numbers in a Lambda function before each call, keep the mapping in a KMS-encrypted DynamoDB table, and restore them for the customer.
    - id: b
      text:
        en: |-
          Attach a guardrail with a sensitive information filter that anonymizes US_BANK_ACCOUNT_NUMBER in both the prompts and the responses.
    - id: c
      text:
        en: |-
          Run an Amazon Comprehend redaction job with the MASK mode on the conversation text before it is sent to the model or indexed.
    - id: d
      text:
        en: |-
          Encrypt the account numbers in each prompt with an AWS KMS key before the model call, and decrypt them in the model's response with the same KMS key afterward.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      Pseudonymization with consistent tokens keeps the utility the use case needs: the model can still distinguish the accounts, while the real values live only in a protected mapping store. Because the substitution happens before the call, invocation logs and any indexed content contain tokens, and re-identification happens after the call for the authorized user only.
  options:
    b:
      en: |-
        ANONYMIZE replaces every account number with the same type label, so the model cannot tell the accounts apart and the customer never sees the real numbers; the invocation logs also keep the original prompt.
    c:
      en: |-
        Masking with characters is irreversible, so the real numbers cannot be shown to the customer, and every account looks the same to the model.
    d:
      en: |-
        Ciphertext is not consistent or meaningful text for the model, and it would be unreadable in the answer the model writes around it.
references:
  - title: Remove PII from conversations by using sensitive information filters - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/guardrails-sensitive-filters.html
  - title: Monitor model invocation using CloudWatch Logs and Amazon S3 - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/model-invocation-logging.html
