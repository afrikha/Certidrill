id: aipc01-3a-output-filter-output-only
objective: "3.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |-
    A cybersecurity firm runs an internal assistant for incident responders on Amazon Bedrock. Responders must be able to paste attacker messages that contain threats and hateful slurs so that the assistant can analyze them. The assistant's own answers must never contain violent or hateful language. The current guardrail blocks many of these legitimate prompts.

    Which change will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Remove the Violence and Hate content filters from the guardrail, and keep the other content filters unchanged.
    - id: b
      text:
        en: |-
          Add a denied topic named Threat Analysis to the guardrail, and set the output action of this topic to BLOCK.
    - id: c
      text:
        en: |-
          Set the action of the Violence and Hate content filters to NONE for both the prompts and the model responses.
    - id: d
      text:
        en: |-
          Set the input strength of the Violence and Hate filters to NONE, and keep a HIGH output strength with the BLOCK action.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      Content filter strength and action are configured separately for prompts and for responses. Turning off input filtering for Violence and Hate lets responders paste hostile messages, while a HIGH output strength with the BLOCK action keeps such language out of the assistant's answers.
  options:
    a:
      en: |-
        Removing the filters also removes the protection on responses.
    b:
      en: |-
        Blocking a Threat Analysis topic on output would block the analyses that responders need, and it does not detect violent or hateful wording.
    c:
      en: |-
        The NONE action only reports detections, so answers that contain violent or hateful language would reach responders.
references:
  - title: Block harmful words and conversations with content filters - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/guardrails-content-filters.html
