id: aipc01-3a-acc-confidence-routing
objective: "3.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |-
    A telecom provider's billing assistant on Amazon Bedrock uses a guardrail with a contextual grounding check. When an answer is weakly grounded, the company does not want customers to see a generic blocked message. Instead, the conversation and the draft answer must be handed to a human agent, while well-grounded answers go directly to the customer.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Keep the BLOCK action, and transfer to an agent every conversation whose response equals the blocked output message of the guardrail.
    - id: b
      text:
        en: |-
          Set the grounding filter action to NONE, read the grounding score from the trace, and route answers below the threshold to an agent.
    - id: c
      text:
        en: |-
          Lower the grounding threshold to 0 so that weakly grounded answers are delivered and reviewed by agents later.
    - id: d
      text:
        en: |-
          Replace the grounding check with a denied topic that blocks uncertain answers, and transfer blocked conversations.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      With the NONE action, the guardrail returns detection information, including the grounding score and threshold, without replacing the response. The application keeps the draft and routes low-scoring answers with the conversation to an agent, which is a simple confidence-based escalation.
  options:
    a:
      en: |-
        The BLOCK action replaces the answer with the blocked message, so the draft cannot be handed to the agent.
    c:
      en: |-
        With a threshold of 0 nothing is flagged, so customers receive weakly grounded answers.
    d:
      en: |-
        A denied topic detects subjects, not how well an answer is supported by its sources.
references:
  - title: Use contextual grounding check to filter hallucinations in responses - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/guardrails-contextual-grounding-check.html
