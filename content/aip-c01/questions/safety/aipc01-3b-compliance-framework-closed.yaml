id: aipc01-3b-compliance-framework-closed
objective: "3.3.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    In November 2026, a health insurer starts a new compliance framework for its Amazon Bedrock and Amazon SageMaker AI deployments. The framework must provide documentation of each model, the lineage of the datasets used to build and ground the models, and logs of the decisions that the applications make. The insurer has not used any of the candidate services before and wants services that are available to new customers.

    Which combination of AWS mechanisms should the insurer use? (Choose three.)
body:
  choose: 3
  options:
    - id: a
      text:
        en: |-
          Amazon SageMaker Model Cards created programmatically for each model version.
    - id: b
      text:
        en: |-
          Amazon SageMaker Clarify reports attached to each model as its documentation.
    - id: c
      text:
        en: |-
          The AWS Glue Data Catalog lineage of the tables used to build the datasets.
    - id: d
      text:
        en: |-
          Amazon SageMaker Model Monitor schedules to record each application decision.
    - id: e
      text:
        en: |-
          CloudWatch Logs log groups that receive model invocation logs and application decision logs.
    - id: f
      text:
        en: |-
          Amazon Q Business applications that answer auditors' questions about each model.
answer: { optionIds: [ a, c, e ] }
explanation:
  correct:
    en: |-
      Model cards document intended uses, risk rating, training and evaluation for each model; the Glue Data Catalog keeps lineage information on the transformations of cataloged data; and CloudWatch Logs collects invocation logs and structured decision logs that can be queried for audits. All three are available to new customers.
  options:
    b:
      en: |-
        SageMaker Clarify is no longer open to new customers since July 30, 2026, so a new framework cannot be built on it.
    d:
      en: |-
        SageMaker Model Monitor is no longer open to new customers since July 30, 2026, and it monitors data and model quality rather than recording application decisions.
    f:
      en: |-
        Amazon Q Business is no longer open to new customers since July 30, 2026, and an assistant is not a source of compliance evidence.
references:
  - title: Amazon SageMaker Model Cards - Amazon SageMaker AI
    url: https://docs.aws.amazon.com/sagemaker/latest/dg/model-cards.html
  - title: Data discovery and cataloging in AWS Glue - AWS Glue
    url: https://docs.aws.amazon.com/glue/latest/dg/catalog-and-crawler.html
