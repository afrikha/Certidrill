id: aipc01-3c-denied-topic-definition
objective: "3.4.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A health insurer's policy states that its member assistant must not give medical advice, meaning diagnoses or treatment recommendations, but may explain plan coverage, including coverage for treatments. A developer configured a denied topic with the definition "Block all medical content except coverage questions." Testing shows inconsistent detection: some coverage questions are blocked and some advice requests pass.

    Which change follows Amazon Bedrock Guardrails best practices for denied topics?
body:
  options:
    - id: a
      text:
        en: |-
          Keep the current definition, and also add the words diagnosis and treatment to a word filter with the BLOCK action so that more advice requests are caught.
    - id: b
      text:
        en: |-
          Rewrite the definition to describe only the denied subject, such as diagnoses or treatment recommendations for an individual, with no exceptions, and add sample phrases.
    - id: c
      text:
        en: |-
          Extend the definition with a list of every allowed coverage question as an exception so that the topic stops blocking coverage questions about treatments.
    - id: d
      text:
        en: |-
          Move the definition text into the blocked input message so that the model understands which content it must not discuss, and keep the current topic name.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      AWS recommends crisp, unambiguous topic definitions that describe the subject itself, with no instructions such as "Block all..." and no negative definitions or exceptions such as "except coverage questions". Optional sample phrases illustrate the topic and improve detection.
  options:
    a:
      en: |-
        Denied topics should not be replaced or reinforced with word lists; a word filter would block every coverage question that contains these words.
    c:
      en: |-
        Exceptions in a definition are exactly what AWS advises against, and they make detection less reliable.
    d:
      en: |-
        The blocked message is the text returned to users after an intervention; it has no effect on detection.
references:
  - title: "Block denied topics to help remove harmful content - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/guardrails-denied-topics.html
