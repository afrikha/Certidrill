id: aipc01-3a-did-intervention-alarm
objective: "3.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |-
    A company screens every user prompt with the Amazon Bedrock ApplyGuardrail API before it calls its model. The security team wants to be alerted within minutes when the number of prompts that the guardrail intervenes on rises sharply, which can indicate a coordinated attack. The team does not want to build a custom log-processing pipeline.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Write a debug line for each blocked prompt to the application's log group, and alarm on a metric filter that counts these lines.
    - id: b
      text:
        en: |-
          Create a CloudWatch alarm on the AWS/Bedrock/Guardrails InvocationsIntervened metric with GuardrailContentSource set to Input.
    - id: c
      text:
        en: |-
          Configure AWS Cost Anomaly Detection for Amazon Bedrock to send an alert when the charges for the guardrail increase unexpectedly.
    - id: d
      text:
        en: |-
          Turn on model invocation logging, and schedule a daily CloudWatch Logs Insights query that counts the blocked prompts.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      Guardrails publishes runtime metrics for ApplyGuardrail in the AWS/Bedrock/Guardrails namespace, including InvocationsIntervened, with dimensions such as GuardrailContentSource (Input or Output) and GuardrailArn. An alarm on this metric alerts within minutes without any custom pipeline.
  options:
    a:
      en: |-
        This requires custom logging code and depends on the application writing the right lines, which is the custom pipeline that the team wants to avoid.
    c:
      en: |-
        Cost anomalies are detected on spend data with a delay, and spend does not isolate interventions from normal usage.
    d:
      en: |-
        A daily query cannot alert within minutes, and ApplyGuardrail calls that never reach the model are not model invocations.
references:
  - title: Monitor Amazon Bedrock Guardrails using CloudWatch metrics - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/monitoring-guardrails-cw-metrics.html
  - title: 4. Input validation and guardrails for agentic AI systems on AWS - AWS Prescriptive Guidance
    url: https://docs.aws.amazon.com/prescriptive-guidance/latest/agentic-ai-security/best-practices-input-validation.html
