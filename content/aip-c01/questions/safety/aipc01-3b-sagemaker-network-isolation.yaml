id: aipc01-3b-sagemaker-network-isolation
objective: "3.2.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A defense contractor hosts an open-weight model on an Amazon SageMaker AI real-time endpoint. The inference container comes from a third party. The security team requires that the container cannot make any outbound network call, including calls to Amazon S3. The model artifacts must still be loaded from the company's S3 bucket, and that download must go through the company's VPC rather than over the internet.

    Which combination of steps will meet these requirements? (Choose two.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Remove the s3:GetObject permission from the SageMaker AI execution role so that the container cannot read objects from Amazon S3.
    - id: b
      text:
        en: |-
          Create an interface VPC endpoint for the SageMaker AI Runtime API so that client applications invoke the endpoint privately.
    - id: c
      text:
        en: |-
          Create the SageMaker AI model with the EnableNetworkIsolation parameter set to true.
    - id: d
      text:
        en: |-
          Attach a guardrail from Amazon Bedrock to the endpoint so that the container's responses are filtered before they leave the endpoint.
    - id: e
      text:
        en: |-
          Configure the model with a VpcConfig that uses private subnets, and create an Amazon S3 gateway endpoint in that VPC.
answer: { optionIds: [ c, e ] }
explanation:
  correct:
    en: |-
      With network isolation, the inference container cannot make outbound calls to any service, including Amazon S3, while SageMaker AI itself downloads the model artifacts by using the execution role. When the model also has a VPC configuration, that download is routed through the VPC subnets, and the S3 gateway endpoint keeps it on the AWS network.
  options:
    a:
      en: |-
        SageMaker AI uses the execution role to download the model artifacts, so removing S3 read access would prevent the model from loading.
    b:
      en: |-
        A SageMaker AI Runtime endpoint protects the inbound invocation path from clients; it does not stop the container from making outbound calls.
    d:
      en: |-
        Guardrails evaluate text in prompts and responses; they do not control the network access of a container.
references:
  - title: Run Training and Inference Containers in Internet-Free Mode - Amazon SageMaker AI
    url: https://docs.aws.amazon.com/sagemaker/latest/dg/mkt-algo-model-internet-free.html
