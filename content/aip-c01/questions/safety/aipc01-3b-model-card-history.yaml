id: aipc01-3b-model-card-history
objective: "3.3.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A lender documents its document-classification model in an Amazon SageMaker Model Card, which the team updates after each retraining. A regulator asks the lender to show what the documentation said at the time of each past release and to send a copy of the current documentation as a file. The lender wants the LEAST operational overhead.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Enable S3 Versioning on a bucket, and have the pipeline write a JSON copy of the card's content to the bucket after each update of the model card.
    - id: b
      text:
        en: |-
          Search AWS CloudTrail for the UpdateModelCard calls, and rebuild each past version of the documentation from the events.
    - id: c
      text:
        en: |-
          Change the card's status to Archived after each release, and create a new card with a new name for the next release.
    - id: d
      text:
        en: |-
          Use the model card versions, which are created on every content edit, to show each past state, and export the current card to a PDF file.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      Any edit to a model card other than an approval status change creates a new card version, which keeps an immutable record of model changes. Cards can also be exported to PDF to share with stakeholders such as regulators.
  options:
    a:
      en: |-
        Copying the content to versioned objects rebuilds a history that the model card already keeps, with extra pipeline code.
    b:
      en: |-
        Reconstructing documents from API events is manual and error-prone when the service already keeps every version.
    c:
      en: |-
        Splitting one model's documentation across differently named cards breaks the history that the regulator wants to follow.
references:
  - title: Amazon SageMaker Model Cards - Amazon SageMaker AI
    url: https://docs.aws.amazon.com/sagemaker/latest/dg/model-cards.html
