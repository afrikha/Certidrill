id: aipc01-3c-offer-schema-lambda-limit
objective: "3.4.3"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    A lender's assistant sends loan offers to a downstream system as JSON generated by an Amazon Bedrock model. The lender's policy requires every offer to contain the fields offerId, amount, and rate, and the amount must never exceed the applicant's approved credit limit, which is stored in the lending database. A non-compliant offer must never reach the downstream system.

    Which combination of actions will meet these requirements? (Choose two.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Add a maximum keyword with the credit limit to the amount property of the JSON Schema so that constrained decoding enforces the limit.
    - id: b
      text:
        en: |-
          Use structured outputs with a JSON Schema that requires offerId, amount, and rate and sets additionalProperties to false on every object.
    - id: c
      text:
        en: |-
          Add an Automated Reasoning policy built from the lending rules to the guardrail so that it blocks offers whose amount exceeds the limit.
    - id: d
      text:
        en: |-
          Add a Lambda function after the model call that reads the applicant's approved limit from the database and rejects or routes for review any offer above it.
    - id: e
      text:
        en: |-
          Add a contextual grounding check that uses the applicant's credit limit as the grounding source for the offer.
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |-
      Structured outputs guarantee the shape of the JSON: the required fields and no extra properties. Numerical constraints such as maximum are not supported in the schema, and the limit is a per-applicant value in a database, so a deterministic Lambda check against the system of record must enforce the amount before the offer is released.
  options:
    a:
      en: |-
        Structured outputs do not support numerical constraints such as minimum and maximum, so the schema cannot enforce the limit.
    c:
      en: |-
        Automated Reasoning checks run in detect mode and do not block content, and the applicant's limit is a database value rather than a general rule.
    e:
      en: |-
        A grounding score measures support by a source text; it is not a deterministic numeric comparison and can still pass a wrong amount.
references:
  - title: "Get validated JSON results from models - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/structured-output.html
  - title: "What are Automated Reasoning checks in Amazon Bedrock Guardrails? - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/guardrails-automated-reasoning-checks.html
