id: aipc01-3c-agent-session-trace-lookup
objective: "3.4.1"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    A bank hosts a new loan-servicing agent on Amazon Bedrock AgentCore Runtime. The agent code already includes the AWS Distro for OpenTelemetry (ADOT) SDK and runs with opentelemetry-instrument, but no spans appear in the CloudWatch console. When a customer disputes an agent decision, support engineers must be able to find all spans of that customer's conversation from the conversation ID that the bank's mobile app generates.

    Which combination of actions will meet these requirements? (Choose two.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Set enableTrace to true in each request so that the agent returns its reasoning trace to the mobile app.
    - id: b
      text:
        en: |-
          Complete the one-time setup that turns on CloudWatch Transaction Search in the account.
    - id: c
      text:
        en: |-
          Enable model invocation logging, and add the conversation ID to the requestMetadata of each model call.
    - id: d
      text:
        en: |-
          Enable CloudTrail data events for the agent runtime, and search them by the conversation ID.
    - id: e
      text:
        en: |-
          Pass the app's conversation ID as the runtime session ID in the X-Amzn-Bedrock-AgentCore-Runtime-Session-Id header when invoking the agent.
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: |-
      Viewing the metrics, spans and traces that AgentCore generates requires the one-time CloudWatch Transaction Search setup. Sending the session ID in the X-Amzn-Bedrock-AgentCore-Runtime-Session-Id header propagates it to the telemetry, so engineers can find every span of one conversation by that ID.
  options:
    a:
      en: |-
        enableTrace is an InvokeAgent option of Amazon Bedrock Agents (Agents Classic), which is closed to new customers; it does not apply to AgentCore Runtime.
    c:
      en: |-
        Invocation logs show single model calls, not the agent's spans for tool calls and steps.
    d:
      en: |-
        CloudTrail records API activity for auditing; it does not hold the agent's spans.
references:
  - title: "Add observability to your Amazon Bedrock AgentCore resources - Amazon Bedrock AgentCore"
    url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/observability-configure.html
  - title: "Observability, audit logging, and tracing for your agents - Amazon Bedrock AgentCore"
    url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/observability.html
