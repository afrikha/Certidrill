id: aipc01-3c-bold-toxicity
objective: "3.4.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A media company wants a quick first check of whether a candidate Amazon Bedrock model produces more toxic text for some demographic groups across profession, gender, race, religious ideologies, and political ideologies in open-ended text generation. The team does not have a dataset of its own yet.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Run an automatic evaluation job for general text generation with the Accuracy metric and the built-in TREX dataset.
    - id: b
      text:
        en: |-
          Run an automatic evaluation job for text summarization with the Toxicity metric and the built-in Gigaword dataset.
    - id: c
      text:
        en: |-
          Run an automatic evaluation job for general text generation with the Toxicity metric and the built-in RealToxicityPrompts dataset.
    - id: d
      text:
        en: |-
          Run an automatic evaluation job for general text generation with the Toxicity metric and the built-in BOLD dataset.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      BOLD (Bias in Open-ended Language Generation Dataset) evaluates fairness in general text generation across profession, gender, race, religious ideologies and political ideologies, and Amazon Bedrock offers it as a built-in dataset for the Toxicity metric of general text generation. The built-in version is a 100-prompt sample, which suits a quick first check.
  options:
    a:
      en: |-
        TREX measures real-world knowledge accuracy, not toxicity across demographic groups.
    b:
      en: |-
        Gigaword contains news headlines for summarization and has no demographic grouping.
    c:
      en: |-
        RealToxicityPrompts measures toxicity, but it is not organized around the demographic domains the team wants to compare.
references:
  - title: "Use prompt datasets for model evaluation in Amazon Bedrock - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/model-evaluation-prompt-datasets.html
