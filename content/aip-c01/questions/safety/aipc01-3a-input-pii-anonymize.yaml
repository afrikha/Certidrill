id: aipc01-3a-input-pii-anonymize
objective: "3.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |-
    A clinic network's appointment assistant on Amazon Bedrock receives free-text messages in which patients often include their email address and phone number. The assistant must still answer every request, but the model must never receive these two values. The company wants a managed solution without custom detection code.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Add EMAIL and PHONE to a sensitive information filter in the guardrail, and set their input action to ANONYMIZE.
    - id: b
      text:
        en: |-
          Add EMAIL and PHONE to a sensitive information filter in the guardrail, and set their input action to BLOCK.
    - id: c
      text:
        en: |-
          Add EMAIL and PHONE to a sensitive information filter in the guardrail, and set only their output action to ANONYMIZE.
    - id: d
      text:
        en: |-
          Run an Amazon Comprehend PII redaction job on each message, and send the redacted text to the model.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      With ANONYMIZE on input, the guardrail replaces each detected value with its type, such as {EMAIL} or {PHONE}, before the prompt reaches the model. The request is still answered, and the model never sees the original values.
  options:
    b:
      en: |-
        BLOCK rejects the whole prompt and returns the blocked input message, so the assistant would not answer these requests.
    c:
      en: |-
        Output masking acts on the response only; the model would still receive the original values in the prompt.
    d:
      en: |-
        Amazon Comprehend redacts PII only in asynchronous batch jobs, which does not fit an interactive assistant and requires custom orchestration.
references:
  - title: Remove PII from conversations by using sensitive information filters - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/guardrails-sensitive-filters.html
  - title: Detecting PII entities - Amazon Comprehend
    url: https://docs.aws.amazon.com/comprehend/latest/dg/how-pii.html
