id: aipc01-3b-model-card-approval-gate
objective: "3.3.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An insurance company documents each fine-tuned model in an Amazon SageMaker Model Card that its pipeline creates. A compliance officer must review the documentation before the model can be deployed, and the deployment stage must not run until the officer has signed off. The company wants to use the model card itself to record the review, with the LEAST custom code.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Create the card with the PendingReview status, have the officer change it to Approved, and make the deployment stage check that the card's status is Approved.
    - id: b
      text:
        en: |-
          Create the card with the Draft status, have the officer change it to Archived after the review, and make the deployment stage check for the Archived status.
    - id: c
      text:
        en: |-
          Store the officer's decision in an Amazon DynamoDB table with the model card name, and make the deployment stage read the table.
    - id: d
      text:
        en: |-
          Create a new model card after the review with the same content, and make the deployment stage check that two cards exist for the model.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      ModelCardStatus records the approval state of a card within the organization: Draft, PendingReview, Approved or Archived. Using PendingReview and Approved puts the review on the card itself, and the pipeline only has to read the status before deploying.
  options:
    b:
      en: |-
        Archived means no more updates should be made to the card; it does not express an approval and would be misleading for auditors.
    c:
      en: |-
        A separate table duplicates what the card status already records and adds code to maintain.
    d:
      en: |-
        Duplicate cards do not record who approved what and make the documentation harder to audit.
references:
  - title: CreateModelCard - Amazon SageMaker
    url: https://docs.aws.amazon.com/sagemaker/latest/APIReference/API_CreateModelCard.html
