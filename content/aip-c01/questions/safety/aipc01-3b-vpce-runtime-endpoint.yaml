id: aipc01-3b-vpce-runtime-endpoint
objective: "3.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company runs an AWS Lambda function in private subnets of a VPC. The function calls the Amazon Bedrock Converse API to summarize internal documents. The private subnets have no route to an internet gateway or a NAT gateway, and a security policy states that traffic to Amazon Bedrock must not traverse the internet. The developers do not want to change the function code.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Create a NAT gateway in a public subnet, and add a default route from the private subnets to the NAT gateway for the Bedrock traffic.
    - id: b
      text:
        en: |-
          Create an interface VPC endpoint for com.amazonaws.region.bedrock-runtime with private DNS enabled, and allow HTTPS from the function.
    - id: c
      text:
        en: |-
          Create an interface VPC endpoint for com.amazonaws.region.bedrock with private DNS enabled, and allow HTTPS from the function.
    - id: d
      text:
        en: |-
          Create a gateway VPC endpoint for Amazon Bedrock, and add the endpoint to the route tables of the private subnets of the function.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      Converse is a runtime API action, so it is served by the bedrock-runtime endpoint service. An AWS PrivateLink interface endpoint keeps the traffic on the AWS network, and with private DNS enabled the default Regional host name resolves to the endpoint, so the SDK needs no code change.
  options:
    a:
      en: |-
        A NAT gateway sends the calls to the public Amazon Bedrock endpoint through an internet gateway, which the security policy forbids.
    c:
      en: |-
        The bedrock endpoint service covers the control plane API (guardrail, customization and logging configuration), not inference calls such as Converse.
    d:
      en: |-
        Gateway endpoints exist only for Amazon S3 and Amazon DynamoDB; Amazon Bedrock is reached privately through interface endpoints.
references:
  - title: Use interface VPC endpoints (AWS PrivateLink) to create a private connection between your VPC and Amazon Bedrock - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/vpc-interface-endpoints.html
