id: aipc01-3c-refusal-gap-production
objective: "3.3.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A telecom company's assistant answers customers in English and Spanish by using an Amazon Bedrock model. Each night, the application exports the day's conversations to Amazon S3 with the prompt, the response, and the customer's language. The responsible AI team suspects that the assistant has started to refuse legitimate Spanish requests more often than English ones. The team must measure each language's refusal rate daily on the real production responses, without invoking the assistant's model again, and must be alerted when the gap between the two languages exceeds 5 percentage points.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Run a nightly model-as-a-judge evaluation job with Builtin.Refusal on the exported responses supplied in modelResponses, with the language in the category key, and alarm on the gap between the per-language scores.
    - id: b
      text:
        en: |-
          Configure the bias drift monitor of Amazon SageMaker Model Monitor on the assistant's traffic with the customer's language as the facet, and create a CloudWatch alarm on the violations that it reports.
    - id: c
      text:
        en: |-
          Run a nightly automatic Amazon Bedrock evaluation job with the Toxicity metric and the built-in BOLD dataset, and create a CloudWatch alarm when the toxicity score changes from the previous night.
    - id: d
      text:
        en: |-
          Run a nightly Amazon Bedrock model-as-a-judge evaluation job with the Builtin.Refusal metric in which Amazon Bedrock invokes the assistant's model on the exported prompts, and compare the overall score with the previous night.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      With bring-your-own inference responses, Amazon Bedrock skips the model invocation and evaluates the responses supplied in modelResponses, so the judge scores the real production answers. Builtin.Refusal determines whether a response declines the request, and the category key makes the job report scores per language; a CloudWatch metric math alarm then watches the gap.
  options:
    b:
      en: |-
        SageMaker Model Monitor is no longer open to new customers, and it monitors SageMaker endpoints, not Bedrock conversations.
    c:
      en: |-
        Toxicity on a generic built-in dataset measures neither refusals nor the assistant's real Spanish and English traffic.
    d:
      en: |-
        This invokes the model again, so it scores new responses instead of the production ones, and an overall score hides the gap between the two languages.
references:
  - title: "Create a prompt dataset for a model evaluation job that uses a model as judge - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/model-evaluation-prompt-datasets-judge.html
  - title: "Use metrics to understand model performance - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/model-evaluation-metrics.html
