id: aipc01-3c-guardrail-config-drift
objective: "3.3.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company's security team wants to be notified within minutes whenever anyone updates or deletes an Amazon Bedrock guardrail or deletes the model invocation logging configuration in the production account. The team also wants a Lambda function to restore the logging configuration automatically.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Create an Amazon EventBridge rule for the CloudTrail events of UpdateGuardrail, DeleteGuardrail, and DeleteModelInvocationLoggingConfiguration, targeting an SNS topic and the Lambda function.
    - id: b
      text:
        en: |-
          Enable CloudTrail data events for the AWS::Bedrock::Guardrail resource type, store them in Amazon S3, and query them with Amazon Athena every week to find configuration changes.
    - id: c
      text:
        en: |-
          Create a CloudWatch alarm that fires when the Invocations metric in the AWS/Bedrock/Guardrails namespace drops to zero, with an SNS topic and the Lambda function as actions.
    - id: d
      text:
        en: |-
          Enable model invocation logging, and run a CloudWatch Logs Insights query on the logs every hour to find guardrail changes and logging configuration changes.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      Guardrail and invocation logging configuration calls are Amazon Bedrock management events, which CloudTrail records by default. EventBridge receives these API events as they are recorded, so a rule matching the three operations can notify the team and start the restoring Lambda function within minutes.
  options:
    b:
      en: |-
        Guardrail data events record ApplyGuardrail calls, not configuration changes, and a weekly query does not notify within minutes.
    c:
      en: |-
        Guardrail traffic can drop for many reasons, and an updated guardrail keeps receiving invocations, so the alarm would miss most changes.
    d:
      en: |-
        Invocation logs record model calls, not control plane changes, and once logging is deleted no new records arrive.
references:
  - title: "Monitor Amazon Bedrock API calls using CloudTrail - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/logging-using-cloudtrail.html
