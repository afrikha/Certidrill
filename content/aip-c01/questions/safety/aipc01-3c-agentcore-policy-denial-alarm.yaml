id: aipc01-3c-agentcore-policy-denial-alarm
objective: "3.3.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company's agents run on Amazon Bedrock AgentCore Runtime and reach all of their tools through AgentCore Gateway, which is associated with a policy engine from Policy in AgentCore. The security team wants to be alerted when the number of tool calls that the policies deny rises suddenly, because such a spike can indicate prompt injection or a compromised agent. The team wants the LEAST custom code.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Create a CloudWatch anomaly detection alarm on the metrics that Policy in AgentCore records for its enforcement decisions, with an SNS action for the security team.
    - id: b
      text:
        en: |-
          Create a CloudWatch alarm on the InvocationsIntervened metric of the agents' guardrail for the ContentPolicy value of GuardrailPolicyType, with an Amazon SNS action.
    - id: c
      text:
        en: |-
          Enable model invocation logging, and run a CloudWatch Logs Insights query every hour that searches the agents' model outputs for the names of restricted tools.
    - id: d
      text:
        en: |-
          Add logging code to every tool's Lambda function that records each rejected request, and create a metric filter and an alarm on the resulting log entries.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      Policy in AgentCore evaluates every tool call at the gateway before the tool is reached, and its enforcement decisions are logged and can be monitored with CloudWatch metrics and logs. An anomaly detection alarm on those metrics flags a sudden rise in denials without a fixed threshold and without custom code.
  options:
    b:
      en: |-
        Guardrails evaluate prompts and model text, not tool calls, so they do not see the policy engine's denials.
    c:
      en: |-
        Searching model outputs is custom, delayed, and finds tool names rather than the calls that the policies denied.
    d:
      en: |-
        Denied calls never reach the tools, because the gateway evaluates them before tool access, so the tools cannot log them.
references:
  - title: "Policy in Amazon Bedrock AgentCore: Control Agent Interactions - Amazon Bedrock AgentCore"
    url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/policy.html
  - title: "Using CloudWatch anomaly detection - Amazon CloudWatch"
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/CloudWatch_Anomaly_Detection.html
