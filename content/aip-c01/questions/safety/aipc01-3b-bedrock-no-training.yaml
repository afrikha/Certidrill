id: aipc01-3b-bedrock-no-training
objective: "3.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A law firm wants to summarize confidential contracts with a third-party foundation model that is available on demand in Amazon Bedrock. The firm's privacy officer requires that the contracts are not used to train any model and that the model provider cannot access the prompts or the completions. The firm wants the LEAST operational overhead.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Purchase Provisioned Throughput for the model so that the firm's requests are served by a dedicated copy of the model that the provider cannot reach.
    - id: b
      text:
        en: |-
          Deploy an open-weight model on an Amazon SageMaker AI endpoint in the firm's VPC so that no third-party model provider is involved in any inference request.
    - id: c
      text:
        en: |-
          Use the model on demand with no extra control, because Amazon Bedrock does not use prompts or completions for training and does not share them with model providers.
    - id: d
      text:
        en: |-
          Attach a guardrail that anonymizes every PII type in the prompts so that the model provider receives only masked contract text from the firm's users.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      AWS and third-party model providers do not use Amazon Bedrock inputs or outputs to train models, and inputs and outputs are not shared with model providers. Models run in model deployment accounts owned by the Amazon Bedrock service team, which providers cannot access, so the requirement is met by the service itself.
  options:
    a:
      en: |-
        Provisioned Throughput buys dedicated capacity; it is not needed for privacy, because on-demand requests are already not shared with the provider, and it adds cost.
    b:
      en: |-
        Self-hosting meets the requirement but adds endpoint management and model operations that the built-in Amazon Bedrock guarantees make unnecessary.
    d:
      en: |-
        Masking PII would degrade the summaries and does not address training use; the provider has no access to the prompts in any case.
references:
  - title: Build Generative AI Applications with Foundation Models - Amazon Bedrock FAQs - AWS
    url: https://aws.amazon.com/bedrock/faqs/
  - title: Data protection - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/data-protection.html
