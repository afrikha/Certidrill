id: aipc01-3a-input-unevaluated-content
objective: "3.1.1"
type: multi
difficulty: 3
status: draft
stem:
  en: |-
    A logistics company's assistant uses the Amazon Bedrock Converse API with tool use and a guardrail that has content filters and a sensitive information filter. One tool returns shipment notes typed by external carriers. The messages do not use guardContent blocks, except for the system prompt, which is wrapped in a guardContent block. A security review must list the content that the guardrail does not evaluate so that the team can add separate checks for it.

    Which content needs checks outside the guardrail? (Choose two.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          The carrier notes that the application returns to the model in toolResult content blocks
    - id: b
      text:
        en: |-
          The user's question that the application sends as a text content block in the messages
    - id: c
      text:
        en: |-
          The system prompt that the application sends in a guardContent block
    - id: d
      text:
        en: |-
          The arguments that the model generates in toolUse content blocks when it requests a tool
    - id: e
      text:
        en: |-
          The final text answer that the model returns to the user
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: |-
      Guardrail filters do not evaluate tool results (toolResult), tool definitions (toolSpec), or the tool call arguments that the model generates (toolUse.input). The carrier notes and the model's tool arguments therefore need their own validation, for example in the code that runs the tools.
  options:
    b:
      en: |-
        Text blocks in the messages are evaluated; when the messages contain no guardContent block, the guardrail evaluates all of their content.
    c:
      en: |-
        A system prompt wrapped in a guardContent block is evaluated by the guardrail.
    e:
      en: |-
        The model's text responses are evaluated by the output settings of the guardrail policies.
references:
  - title: Include a guardrail with the Converse API - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/guardrails-use-converse-api.html
