id: aipc01-3a-did-guardrail-version-pin
objective: "3.1.4"
type: single
difficulty: 1
status: draft
stem:
  en: |-
    A company's production chatbot references its Amazon Bedrock guardrail with the version DRAFT. Last week, a policy author's experimental change to the guardrail immediately blocked many legitimate customer requests in production. The company wants guardrail changes to reach production only after they have been tested.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Create a numbered version of the tested configuration, reference it in production, and create new versions only after testing.
    - id: b
      text:
        en: |-
          Keep DRAFT in production, and ask policy authors to try their changes in the console's test window before saving them.
    - id: c
      text:
        en: |-
          Create a second guardrail for tests, and copy its tested configuration into the DRAFT of the production guardrail after each test.
    - id: d
      text:
        en: |-
          Turn on trace in production so that unintended blocks are detected quickly, and revert the draft as soon as a problem appears.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      A guardrail's working draft can be changed at any time, while each version is an immutable snapshot. When production references a numbered version, edits to the draft do not reach users until a new tested version is created and the application is updated to use it.
  options:
    b:
      en: |-
        Any saved edit to the draft still applies to production immediately, so a procedure cannot prevent the problem.
    c:
      en: |-
        Production still uses the draft, so a copy error or an untested edit reaches users at once.
    d:
      en: |-
        Trace only helps to detect the impact after users have been affected.
references:
  - title: Detect and filter harmful content by using Amazon Bedrock Guardrails - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/guardrails.html
