id: aipc01-3c-scp-protect-governance-controls
objective: "3.3.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A media company relies on two Amazon Bedrock governance controls in each member account of its organization: model invocation logging and guardrails that a central governance role manages. Account administrators in member accounts have the AdministratorAccess policy. An audit found that an administrator turned off model invocation logging and deleted a guardrail while troubleshooting. The company must prevent everyone except the governance role from changing these controls in every account, including administrators of accounts created later.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Attach an IAM policy that denies the guardrail and logging configuration actions to the administrator roles in each member account, and review the policies monthly.
    - id: b
      text:
        en: |-
          Create an AWS Config custom rule that detects deleted guardrails and disabled invocation logging, and send the findings to an Amazon SNS topic.
    - id: c
      text:
        en: |-
          Attach an SCP that denies the guardrail update and delete actions and the invocation logging configuration actions to every principal except the governance role.
    - id: d
      text:
        en: |-
          Enable CloudTrail data events for the AWS::Bedrock::Guardrail resource type, and create an EventBridge rule that recreates a guardrail when it is deleted.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      An SCP sets the maximum permissions of every principal in the member accounts, including administrators with AdministratorAccess, and it applies to accounts added to the organization later. Denying bedrock:UpdateGuardrail, bedrock:DeleteGuardrail, bedrock:PutModelInvocationLoggingConfiguration and bedrock:DeleteModelInvocationLoggingConfiguration except for the governance role prevents the change instead of detecting it.
  options:
    a:
      en: |-
        Administrators with IAM permissions can detach or edit a policy in their own account, and the policy must be created in every new account.
    b:
      en: |-
        A Config rule only reports the change after it happened; logging is already off and the guardrail already deleted.
    d:
      en: |-
        Guardrail data events cover ApplyGuardrail calls; DeleteGuardrail is a management event. Recreating a guardrail after deletion is also reactive and loses its version history.
references:
  - title: "Identity-based policy examples for Amazon Bedrock - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/security_iam_id-based-policy-examples.html
  - title: "Monitor Amazon Bedrock API calls using CloudTrail - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/logging-using-cloudtrail.html
