id: aipc01-3b-model-card-programmatic
objective: "3.3.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A bank fine-tunes a model for credit-memo summaries and must give auditors structured documentation of each model: its intended uses, risk rating, training details and evaluation results. The documentation must be generated automatically by the deployment pipeline every time a new model version is produced.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Add tags such as intended-use and risk-rating to the SageMaker AI endpoint that serves each model version.
    - id: b
      text:
        en: |-
          Download the AWS AI Service Card of the base model, and attach it to the release ticket of each version.
    - id: c
      text:
        en: |-
          Call the SageMaker AI CreateModelCard API from the pipeline with content in the model card JSON schema.
    - id: d
      text:
        en: |-
          Store the intended uses and evaluation results as table properties in the AWS Glue Data Catalog.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      Amazon SageMaker Model Cards document a model's intended uses and risk rating, training details and evaluation results in one place for governance and audit. CreateModelCard takes the content as a string in the model card JSON schema, so a pipeline step can create the card for each version.
  options:
    a:
      en: |-
        Tags hold short key-value pairs; they cannot carry structured training and evaluation documentation for auditors.
    b:
      en: |-
        AI Service Cards are written by AWS about AWS services and models; they do not document the bank's fine-tuned model or its evaluation.
    d:
      en: |-
        The Data Catalog describes datasets (schema, location, lineage), not models and their intended uses.
references:
  - title: Amazon SageMaker Model Cards - Amazon SageMaker AI
    url: https://docs.aws.amazon.com/sagemaker/latest/dg/model-cards.html
  - title: CreateModelCard - Amazon SageMaker
    url: https://docs.aws.amazon.com/sagemaker/latest/APIReference/API_CreateModelCard.html
