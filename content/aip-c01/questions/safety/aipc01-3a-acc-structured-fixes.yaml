id: aipc01-3a-acc-structured-fixes
objective: "3.1.3"
type: multi
difficulty: 3
status: draft
stem:
  en: |-
    A developer enables structured outputs on Amazon Bedrock Converse requests for an invoice-extraction service. The first test fails with a 400 ValidationException; the schema defines a nested lineItems object that has no additionalProperties keyword. After that error is fixed, long invoices sometimes return incomplete JSON with the stopReason max_tokens.

    Which combination of changes will resolve both issues? (Choose two.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Remove the required list from the schema so that the model can omit fields that it cannot fill.
    - id: b
      text:
        en: |-
          Set additionalProperties to false on the nested lineItems object and on every other object in the schema.
    - id: c
      text:
        en: |-
          Set the temperature to 0 so that the model produces shorter and more predictable responses.
    - id: d
      text:
        en: |-
          Replace the Converse API with the InvokeModel API so that the schema is not validated before inference.
    - id: e
      text:
        en: |-
          Increase maxTokens in the inference configuration so that the complete JSON object fits in the response.
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: |-
      Amazon Bedrock rejects a schema in which any object does not explicitly set additionalProperties to false. Structured outputs do not prevent truncation: when the response reaches the token limit, the model stops with max_tokens and returns incomplete JSON, so maxTokens must be large enough for the whole object.
  options:
    a:
      en: |-
        The required list did not cause either error, and optional properties are limited to 12 per schema.
    c:
      en: |-
        Temperature does not limit the length of the response, so long invoices can still reach the token limit.
    d:
      en: |-
        InvokeModel also supports structured outputs and validates the schema in the same way.
references:
  - title: Get validated JSON results from models - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/structured-output.html
