id: aipc01-3b-guardrail-custom-regex
objective: "3.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A clinic's assistant on Amazon Bedrock helps staff draft referral letters. Patient record numbers have the format PRN- followed by eight digits, and they must be masked in the assistant's responses. The names of the clinic's doctors must remain visible in the letters, because the letters are useless without them. Millions of record numbers exist.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Attach a guardrail with a sensitive information filter that anonymizes the NAME entity type in responses.
    - id: b
      text:
        en: |-
          Attach a guardrail with a word filter that lists every patient record number that is in use.
    - id: c
      text:
        en: |-
          Attach a guardrail with a denied topic whose definition describes patient record numbers.
    - id: d
      text:
        en: |-
          Attach a guardrail with a custom regex filter for PRN-[0-9]{8} whose output action is ANONYMIZE.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      Sensitive information filters accept custom regular expressions (up to 500 characters, without lookaround) with their own input and output actions. A pattern for the record number format with ANONYMIZE on output masks only those values and leaves the rest of the letter, including doctors' names, unchanged.
  options:
    a:
      en: |-
        Anonymizing NAME would also mask the doctors' names that the letters need, and it would not detect record numbers.
    b:
      en: |-
        A word filter needs every value listed and blocks content instead of masking it, which does not scale to millions of numbers.
    c:
      en: |-
        A denied topic blocks the whole response when the topic is detected, so the letter would not be returned.
references:
  - title: Remove PII from conversations by using sensitive information filters - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/guardrails-sensitive-filters.html
