id: aipc01-3b-decision-log-sources
objective: "3.3.1"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    A bank's loan assistant uses the Converse API with a guardrail and passages that the application retrieves from a knowledge base. A regulator requires the bank to show, for any answer, what the customer asked, what the assistant replied, which IAM principal made the call, which prompt template version and guardrail version were used, and which documents were retrieved. The bank's trail logs only management events today.

    Which combination of steps will meet these requirements? (Choose two.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Enable Amazon Bedrock model invocation logging to a CloudWatch Logs log group.
    - id: b
      text:
        en: |-
          Rely on the existing CloudTrail management events for Converse, which contain the prompt and the response.
    - id: c
      text:
        en: |-
          Have the application write a structured log event for each answer with the request ID, prompt template version, guardrail version and action, and retrieved document IDs.
    - id: d
      text:
        en: |-
          Enable AWS X-Ray tracing on the application so that each Converse call appears in a trace map.
    - id: e
      text:
        en: |-
          Enable VPC Flow Logs on the subnets of the interface endpoint that the application uses to reach Amazon Bedrock.
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |-
      Model invocation logging records the input and output bodies, the model ID and the identity.arn of the caller for each Converse call. The prompt template version, the guardrail version and the retrieved document IDs are application context, so a structured decision log event keyed by the request ID completes the record.
  options:
    b:
      en: |-
        CloudTrail shows who called Converse and when, but it does not contain the prompt or the response text.
    d:
      en: |-
        X-Ray traces show timing and the path of requests, not the content of the prompts, responses or retrieved documents.
    e:
      en: |-
        Flow logs record network connections (addresses, ports, bytes), not the content or the principal of the calls.
references:
  - title: Monitor model invocation using CloudWatch Logs and Amazon S3 - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/model-invocation-logging.html
  - title: Monitor Amazon Bedrock API calls using CloudTrail - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/logging-using-cloudtrail.html
