id: aipc01-3a-output-sampled-toxicity
objective: "3.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |-
    A social media company uses an FM on Amazon Bedrock to suggest replies to user comments in English. The trust and safety team wants a dashboard of toxicity scores by category, including harassment, profanity, and threats, for a 5% sample of generated replies. The monitoring must not block or delay any reply.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Send sampled replies asynchronously to a Lambda function that calls Amazon Comprehend DetectToxicContent and publishes the label scores as metrics.
    - id: b
      text:
        en: |-
          Send the sampled replies to the Amazon Comprehend prompt safety classifier and publish its UNSAFE_PROMPT scores as CloudWatch custom metrics.
    - id: c
      text:
        en: |-
          Configure Amazon SageMaker Model Monitor to capture the sampled replies and compute toxicity statistics for a CloudWatch dashboard.
    - id: d
      text:
        en: |-
          Add a contextual grounding check to the guardrail of the reply generation, and chart the grounding and relevance scores of the sampled replies.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      DetectToxicContent returns a score for each category, such as HARASSMENT_OR_ABUSE, PROFANITY, and VIOLENCE_OR_THREAT, plus an overall toxicity score, for English text. Calling it asynchronously on a sample keeps it out of the reply path, and custom metrics feed a CloudWatch dashboard.
  options:
    b:
      en: |-
        Prompt safety classification is no longer available to new customers, and it labels prompts as safe or unsafe instead of scoring toxicity by category.
    c:
      en: |-
        SageMaker AI Model Monitor is no longer available to new customers, so it cannot be used in a new design.
    d:
      en: |-
        Grounding and relevance scores measure support by a source and relevance to the query, not toxicity, and the check runs inline.
references:
  - title: Trust and safety - Amazon Comprehend
    url: https://docs.aws.amazon.com/comprehend/latest/dg/trust-safety.html
