id: aipc01-3b-macie-allow-list
objective: "3.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A utility company uses Amazon Macie to find personal data in the Amazon S3 buckets that feed its Amazon Bedrock knowledge bases. Most findings come from the company's public customer service phone numbers and the names of its official spokespeople, which appear in thousands of brochures. The privacy team wants Macie to stop reporting these known public values while it continues to detect customers' phone numbers and names in every bucket.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Create a custom data identifier with a regular expression that matches the public phone numbers and the spokespeople's names.
    - id: b
      text:
        en: |-
          Exclude the buckets that contain brochures from automated sensitive data discovery and from all discovery jobs.
    - id: c
      text:
        en: |-
          Create an allow list that contains the public phone numbers and the spokespeople's names, and use it in sensitive data discovery.
    - id: d
      text:
        en: |-
          Reduce the sampling depth of the sensitive data discovery jobs so that fewer brochure objects are analyzed in the buckets that feed the knowledge bases.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      Macie allow lists define text and text patterns that Macie ignores in S3 objects, and AWS cites public phone numbers and the names of an organization's public representatives as typical entries. The managed data identifiers keep detecting other phone numbers and names in every bucket.
  options:
    a:
      en: |-
        A custom data identifier adds detection criteria; it would report the public values again instead of ignoring them.
    b:
      en: |-
        Excluding the buckets would also stop detection of customer data in them, which the team must keep.
    d:
      en: |-
        Lower sampling only reduces coverage at random; the public values would still be reported and some customer data would be missed.
references:
  - title: What is Amazon Macie? - Amazon Macie
    url: https://docs.aws.amazon.com/macie/latest/user/what-is-macie.html
