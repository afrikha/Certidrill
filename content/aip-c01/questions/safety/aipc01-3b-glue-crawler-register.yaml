id: aipc01-3b-glue-crawler-register
objective: "3.3.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A retail company uses about 30 datasets in Amazon S3 to ground and fine-tune its GenAI applications, and new datasets are added every month. The governance team wants a central inventory that records each dataset's location and schema so that it can answer which data sources feed which application. The team wants the inventory to be populated automatically.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Run AWS Glue crawlers on the dataset locations on a schedule to create and update tables in the AWS Glue Data Catalog.
    - id: b
      text:
        en: |-
          Enable S3 Inventory on the buckets, and store the daily inventory reports of all buckets in a central reporting bucket.
    - id: c
      text:
        en: |-
          Enable Amazon Macie for the account, and use the Macie bucket inventory as the list of the applications' data sources.
    - id: d
      text:
        en: |-
          Create a CloudTrail trail with S3 data events, and treat every bucket that appears in the events as a data source.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      The AWS Glue Data Catalog is a central repository of metadata that indexes the location and schema of data sources. Crawlers scan the data stores and create or update the catalog tables automatically, so new datasets are registered without manual work.
  options:
    b:
      en: |-
        S3 Inventory lists objects and their properties per bucket; it does not record dataset schemas or register datasets as data sources.
    c:
      en: |-
        Macie's inventory evaluates bucket security and sensitive data; it does not describe datasets or their schemas.
    d:
      en: |-
        Data events show which objects were accessed, not a curated inventory of datasets with their schemas.
references:
  - title: Data discovery and cataloging in AWS Glue - AWS Glue
    url: https://docs.aws.amazon.com/glue/latest/dg/catalog-and-crawler.html
