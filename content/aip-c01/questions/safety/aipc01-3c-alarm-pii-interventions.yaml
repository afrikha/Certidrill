id: aipc01-3c-alarm-pii-interventions
objective: "3.3.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company's support assistant calls Amazon Bedrock with a guardrail that has content filters on user prompts and a sensitive information filter that masks personal data in model responses. The compliance team wants an alarm when the sensitive information filter intervenes more than 20 times in 5 minutes, because that suggests that the retrieval layer is exposing customer records. Content filter interventions on abusive prompts are frequent and must not trigger this alarm. The team wants the LEAST custom code.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Create a CloudWatch alarm on the InvocationsIntervened metric in the AWS/Bedrock/Guardrails namespace for the SensitiveInformationPolicy value of GuardrailPolicyType, with an Amazon SNS action.
    - id: b
      text:
        en: |-
          Create a CloudWatch alarm on the InvocationsIntervened metric in the AWS/Bedrock/Guardrails namespace for the guardrail's GuardrailArn and GuardrailVersion dimensions, with an Amazon SNS action.
    - id: c
      text:
        en: |-
          Enable CloudTrail data events for the AWS::Bedrock::Guardrail resource type, and run an Amazon Athena query every 5 minutes that counts the events with masked entities.
    - id: d
      text:
        en: |-
          Create a CloudWatch alarm on the TextUnitCount metric in the AWS/Bedrock/Guardrails namespace for the guardrail's GuardrailArn and GuardrailVersion dimensions, with an Amazon SNS action.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      Guardrails publish InvocationsIntervened in the AWS/Bedrock/Guardrails namespace with a GuardrailPolicyType dimension whose values include SensitiveInformationPolicy and ContentPolicy. An alarm on the SensitiveInformationPolicy series counts only the interventions of the sensitive information filter and needs no code.
  options:
    b:
      en: |-
        The metric for the guardrail as a whole also counts the frequent content filter interventions, so the alarm would fire on abusive prompts.
    c:
      en: |-
        This needs scheduled queries and parsing code, and CloudTrail data events are delivered with a delay that does not suit a 5-minute alarm.
    d:
      en: |-
        TextUnitCount measures the volume of text that the guardrail evaluated, not the number of interventions.
references:
  - title: "Monitor Amazon Bedrock Guardrails using CloudWatch metrics - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/monitoring-guardrails-cw-metrics.html
