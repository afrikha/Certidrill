id: aipc01-3c-prompt-version-approval
objective: "3.3.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company manages the prompts of its customer service assistant in Amazon Bedrock Prompt Management. A new governance policy states that a prompt change can reach production only after the responsible AI team approves it, that production must run exactly the approved prompt, and that auditors must be able to see every approved prompt over time. Prompt engineers keep editing prompts in the console during development.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Use an AWS CodePipeline manual approval action that, once approved, creates a prompt version and stores its ARN in AWS AppConfig, from which the application reads the prompt it passes to Converse.
    - id: b
      text:
        en: |-
          Have the application call the Converse API with the prompt's ARN without a version suffix, and require the responsible AI team to review the prompt in the console before each release is announced.
    - id: c
      text:
        en: |-
          Create a prompt variant for each proposed change, and have the responsible AI team select the approved variant in the prompt builder so that the application uses that variant.
    - id: d
      text:
        en: |-
          Export the prompt text to an Amazon S3 bucket with versioning enabled after each console edit, and have the application load the latest object version of the prompt at every startup.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      A prompt version is a saved snapshot of the prompt, so production runs exactly the text that was approved while engineers continue to edit the working draft. The manual approval action gates the creation and promotion of each version, and the list of versions plus the pipeline history give auditors every approved prompt.
  options:
    b:
      en: |-
        Without a version suffix the application uses the working draft, so console edits made after the review would reach production without approval.
    c:
      en: |-
        Variants are alternative configurations to compare outputs while iterating; selecting one in the prompt builder is not an approval gate and does not pin what production runs.
    d:
      en: |-
        The latest object version is whatever an engineer exported last, so unapproved edits would reach production at the next start.
references:
  - title: "Construct and store reusable prompts with Prompt management in Amazon Bedrock - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/prompt-management.html
