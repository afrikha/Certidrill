id: aipc01-3c-service-catalog-approved-pattern
objective: "3.3.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A bank's platform team has defined an approved architecture for retrieval-augmented generation (RAG) applications: VPC interface endpoints for Amazon Bedrock, model invocation logging, a customer managed AWS KMS key, and an application role that can call only approved models with the corporate guardrail. Business units must be able to deploy new RAG applications on their own, but only by using this approved architecture. The platform team must be able to publish new versions centrally, and business-unit developers must not receive permissions to create IAM roles.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Store the approved AWS CloudFormation templates in a shared Amazon S3 bucket, and give business-unit developers permissions to create CloudFormation stacks and the IAM roles that the templates need.
    - id: b
      text:
        en: |-
          Deploy an AWS Config conformance pack that reports RAG resources that do not match the approved architecture, and ask business units to fix the findings.
    - id: c
      text:
        en: |-
          Publish the architecture as an AWS CDK construct library in AWS CodeArtifact, and require business units to use it in their own deployment pipelines.
    - id: d
      text:
        en: |-
          Create AWS Service Catalog products from the approved CloudFormation templates, add them to a portfolio with a launch constraint, and share the portfolio with the business-unit accounts.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      AWS Service Catalog provides a catalog of approved IT services that end users deploy on their own, following the constraints set by the organization. A launch constraint provisions the product with a role that the administrator chooses, so developers do not need permissions on the underlying services, and a new product version propagates to every portfolio that references it.
  options:
    a:
      en: |-
        Developers could deploy any template, or none, and would receive the IAM permissions that the bank wants to withhold.
    b:
      en: |-
        A conformance pack detects drift after deployment; it does not give business units a self-service way to deploy only the approved architecture.
    c:
      en: |-
        Business units would still need broad permissions, including creating IAM roles, to deploy the stacks from their own pipelines.
references:
  - title: "What Is Service Catalog? - AWS Service Catalog"
    url: https://docs.aws.amazon.com/servicecatalog/latest/adminguide/introduction.html
