id: aipc01-3c-variants-quick-compare
objective: "3.4.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A product team wants a quick, informal check of how two candidate foundation models respond to a few matched prompts that differ only in an applicant's age, before it runs any formal evaluation. The prompt is stored in Amazon Bedrock Prompt Management. The team wants to see the outputs of the two models next to each other without writing code.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Create one prompt version for each model, and invoke each version with the matched prompts from a Lambda function that stores the outputs in Amazon S3.
    - id: b
      text:
        en: |-
          Run an automatic model evaluation job with the built-in BOLD dataset and the Toxicity metric for each of the two models.
    - id: c
      text:
        en: |-
          Enable model invocation logging, and compare the responses of the two models in CloudWatch Logs Insights after the next production release.
    - id: d
      text:
        en: |-
          Create a second variant of the prompt that uses the other model, and compare the outputs of the two variants in the prompt builder.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      In Prompt Management, a variant is an alternative configuration of the prompt, including its model, and the prompt builder lets you compare the outputs of variants to choose the best one. Supplying each matched prompt through the template's variables gives a quick side-by-side check without code.
  options:
    a:
      en: |-
        This needs code and does not show the outputs side by side.
    b:
      en: |-
        A formal job on a generic dataset does not use the team's matched age prompts, and it is not the quick informal check that the team wants.
    c:
      en: |-
        Production logs come after release and do not contain matched prompts answered by both models.
references:
  - title: "Construct and store reusable prompts with Prompt management in Amazon Bedrock - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/prompt-management.html
