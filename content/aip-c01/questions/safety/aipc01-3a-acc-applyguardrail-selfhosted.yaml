id: aipc01-3a-acc-applyguardrail-selfhosted
objective: "3.1.3"
type: single
difficulty: 3
status: draft
stem:
  en: |-
    A research company serves a fine-tuned open-weight model from an Amazon SageMaker AI endpoint. The application retrieves passages from its document store and asks the model to answer from them. The company wants to block answers that are not supported by the retrieved passages by using a managed hallucination check, with the LEAST operational overhead.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Call the ApplyGuardrail API with a contextual grounding check, and send the passages, the question, and the endpoint's answer as qualified content blocks.
    - id: b
      text:
        en: |-
          Move the model to Amazon Bedrock with Custom Model Import, and call it with the Converse API and a guardrail that has a contextual grounding check.
    - id: c
      text:
        en: |-
          Embed the answer and the passages with a Titan embeddings model, compute cosine similarity in Lambda, and block answers below a tuned threshold.
    - id: d
      text:
        en: |-
          Create an Automated Reasoning policy from the retrieved passages of each request, and validate the endpoint's answer against it.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      ApplyGuardrail evaluates text against a guardrail without invoking a model, so it can check answers from a model that is hosted outside Amazon Bedrock. For contextual grounding, the request sends the passages with the grounding_source qualifier, the question with the query qualifier, and the answer in an unqualified block.
  options:
    b:
      en: |-
        This works only after migrating the model's hosting and operations to Amazon Bedrock, which is far more effort than one extra API call.
    c:
      en: |-
        A custom similarity pipeline is not a managed check, and the team must build, calibrate, and maintain it.
    d:
      en: |-
        Automated Reasoning policies are built and tested in advance from a document of rules; they cannot be created for the passages of each request.
references:
  - title: Use the ApplyGuardrail API in your application - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/guardrails-use-independent-api.html
  - title: Use contextual grounding check to filter hallucinations in responses - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/guardrails-contextual-grounding-check.html
