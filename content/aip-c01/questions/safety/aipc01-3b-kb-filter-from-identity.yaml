id: aipc01-3b-kb-filter-from-identity
objective: "3.2.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company's HR assistant uses an Amazon Bedrock knowledge base with an Amazon S3 data source. Each document has a .metadata.json file with a department attribute. Employees sign in through Amazon Cognito, and the backend validates the ID token, which contains a department claim. Employees must receive only passages from their own department's documents, even if they write prompts that try to reach other departments' content.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          In the backend, build an equals filter on department from the validated token's claim, and pass it in every Retrieve or RetrieveAndGenerate call.
    - id: b
      text:
        en: |-
          Add an instruction to the system prompt that tells the model to use only passages that belong to the department named in the conversation.
    - id: c
      text:
        en: |-
          Have the web client send the employee's department as a request parameter, and have the backend copy that value into the retrieval filter of each call.
    - id: d
      text:
        en: |-
          Configure implicit filtering with a metadata schema that describes the department attribute, so that the model generates a filter from each employee's query.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      Metadata filters in the vectorSearchConfiguration restrict which chunks the knowledge base can return. Building the filter on the server from a claim of a validated token means the employee cannot change it, so no prompt can widen retrieval to other departments.
  options:
    b:
      en: |-
        Instructions in a prompt do not restrict retrieval: the passages are still returned to the model, and a prompt injection can override the instruction.
    c:
      en: |-
        A value sent by the client is under the employee's control; anyone can edit the request and ask for another department.
    d:
      en: |-
        Implicit filtering derives the filter from the user's query text, so a crafted query can produce a filter for another department.
references:
  - title: Configure and customize queries and response generation - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/kb-test-config.html
  - title: Connect to Amazon S3 for your knowledge base - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/s3-data-source-connector.html
