id: aipc01-3a-did-comprehend-toxicity-prefilter
objective: "3.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |-
    An online gaming company adds an FM-powered companion character on Amazon Bedrock to its English in-game chat. Each game community sets its own numeric limits for profanity and harassment, for example a profanity score above 0.6 in a children's community and above 0.9 in an adult community. Messages that exceed their community's limits must be rejected before they reach the model, in addition to the existing guardrail.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Enable the managed profanity word list in the guardrail, and create one guardrail version for each game community.
    - id: b
      text:
        en: |-
          Classify each message with the Amazon Comprehend prompt safety classifier, and compare its UNSAFE_PROMPT score with the community's limits.
    - id: c
      text:
        en: |-
          Set the Insults content filter to a different strength in a separate guardrail for each game community, and select it per community.
    - id: d
      text:
        en: |-
          Call Amazon Comprehend DetectToxicContent in a pre-processing Lambda function, and compare the scores with the community's limits.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      DetectToxicContent returns a confidence score per category, including PROFANITY and HARASSMENT_OR_ABUSE, for English text. A pre-processing function can compare these scores with any numeric limit per community and reject messages before the model call, as an independent layer in front of the guardrail.
  options:
    a:
      en: |-
        The managed profanity list matches words; it returns no score that can be compared with numeric limits.
    b:
      en: |-
        Prompt safety classification is no longer available to new customers, and it labels prompts as safe or unsafe instead of scoring profanity and harassment.
    c:
      en: |-
        Content filter strengths are fixed levels (NONE, LOW, MEDIUM, HIGH), not numeric limits, and content filters have no profanity category.
references:
  - title: Trust and safety - Amazon Comprehend
    url: https://docs.aws.amazon.com/comprehend/latest/dg/trust-safety.html
  - title: Block harmful words and conversations with content filters - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/guardrails-content-filters.html
