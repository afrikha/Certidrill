id: aipc01-3a-did-org-enforcement
objective: "3.1.4"
type: single
difficulty: 3
status: draft
stem:
  en: |-
    An enterprise runs generative AI workloads in 40 member accounts of an organization in AWS Organizations. The central security team must ensure that every Amazon Bedrock inference call in every member account is filtered by the same guardrail, without changes to application code. Callers must not be able to exclude parts of their prompts from evaluation by using input tags, and member account administrators must not be able to change the guardrail.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Attach a service control policy that denies bedrock:InvokeModel when the bedrock:GuardrailIdentifier condition key does not match the central guardrail ARN.
    - id: b
      text:
        en: |-
          Create a numbered guardrail version in the management account, share it, and enforce it with a BEDROCK_POLICY that uses comprehensive content guarding.
    - id: c
      text:
        en: |-
          Deploy the guardrail to each member account with AWS CloudFormation StackSets, and call PutEnforcedGuardrailConfiguration in each account and Region.
    - id: d
      text:
        en: |-
          Deploy an IAM policy with a Deny on the bedrock:GuardrailIdentifier condition key to every role in the member accounts with AWS CloudFormation StackSets.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      Organization-level enforcement applies a guardrail from the management account to inference calls in member accounts with no application change, and a numbered version cannot be modified by the member accounts. With comprehensive content guarding, which is also the default, all content is evaluated regardless of input tags.
  options:
    a:
      en: |-
        The condition key only denies calls that do not pass the guardrail, so every application must change its requests, and input tags still let callers skip evaluation of their prompts.
    c:
      en: |-
        Account-level enforcement uses guardrails that live in each member account, so the administrators of those accounts can change them or the enforcement configuration.
    d:
      en: |-
        Applications must still pass the guardrail in every request, and callers can still exclude prompt content with input tags.
references:
  - title: Apply cross-account safeguards with Amazon Bedrock Guardrails enforcements - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/guardrails-enforcements.html
  - title: Enforce the use of specific guardrails in model inference requests - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/guardrails-permissions-id.html
