id: aipc01-3c-appconfig-lambda-validator
objective: "3.4.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company stores the runtime configuration of its assistant, including the model ID and the guardrail ID and version, in an AWS AppConfig free-form configuration profile. Its responsible AI policy states that a configuration can be deployed only if it references a model on the approved list, which the model risk committee maintains in an Amazon DynamoDB table, and a numeric guardrail version, never DRAFT. Engineers change the configuration often. A non-compliant configuration must be rejected before it is deployed, with the LEAST operational overhead.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Add a JSON Schema validator to the configuration profile that lists the approved model IDs in an enum and requires the guardrail version to be a number.
    - id: b
      text:
        en: |-
          Run an hourly EventBridge Scheduler job with a Lambda function that checks the deployed configuration and notifies the engineers about violations.
    - id: c
      text:
        en: |-
          Add a Lambda validator to the configuration profile that reads the approved list from DynamoDB and fails when the model or the guardrail version is not compliant.
    - id: d
      text:
        en: |-
          Add a CloudWatch alarm on the guardrail's InvocationsIntervened metric to the AppConfig environment so that a non-compliant deployment is rolled back.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      AWS AppConfig calls a Lambda validator during StartDeployment and ValidateConfigurationActivity, and a function that throws an exception fails the validation, so the configuration is rejected before deployment. Because the function reads the approved list from DynamoDB at validation time, committee changes take effect without editing the profile.
  options:
    a:
      en: |-
        A JSON Schema can check the format, but its enum would have to be edited every time the committee changes the list in DynamoDB.
    b:
      en: |-
        An hourly check finds violations after deployment instead of preventing them.
    d:
      en: |-
        Intervention counts do not show whether the model is approved or the guardrail version is numeric, and an alarm-based rollback acts only after the deployment has started.
references:
  - title: "Understanding validators - AWS AppConfig"
    url: https://docs.aws.amazon.com/appconfig/latest/userguide/appconfig-creating-configuration-and-profile-validators.html
