id: aipc01-3b-kb-erasure-sync
objective: "3.2.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A bank's assistant answers questions from an Amazon Bedrock knowledge base with an Amazon S3 data source whose data deletion policy is DELETE. To honor a customer's erasure request, an operator deleted the customer's documents and their metadata files from the source bucket. A week later, the assistant still cites passages from those documents. The bank must remove the data from the assistant with the LEAST effort and keep the rest of the knowledge base available.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Delete the knowledge base and its vector index, create a new knowledge base with the same configuration, and ingest the remaining documents.
    - id: b
      text:
        en: |-
          Add a denied topic to the assistant's guardrail that describes the customer, so that responses that mention the customer are blocked.
    - id: c
      text:
        en: |-
          Start an ingestion job for the data source so that the sync detects the deleted documents and removes their vectors from the vector store.
    - id: d
      text:
        en: |-
          Change the data deletion policy of the data source to RETAIN, and then delete and re-create the data source with the same bucket.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      The vector store keeps the chunks and embeddings that were ingested until the data source is synced again. Each sync crawls new, modified and deleted content, so an ingestion job (StartIngestionJob or Sync in the console) removes the vectors of the deleted documents and leaves the rest untouched.
  options:
    a:
      en: |-
        Rebuilding the knowledge base removes the data but makes the assistant unavailable during the full re-ingestion, which is far more effort than a sync.
    b:
      en: |-
        A denied topic hides some answers but leaves the customer's data in the vector store, so the erasure request is not honored.
    d:
      en: |-
        RETAIN keeps the vector data when a data source is deleted, which is the opposite of what is needed.
references:
  - title: Connect to Amazon S3 for your knowledge base - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/s3-data-source-connector.html
