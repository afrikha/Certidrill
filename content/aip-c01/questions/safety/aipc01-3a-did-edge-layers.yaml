id: aipc01-3a-did-edge-layers
objective: "3.1.4"
type: multi
difficulty: 2
status: draft
stem:
  en: |-
    A retailer exposes a public shopping assistant through an Amazon API Gateway REST API, a Lambda function, and Amazon Bedrock. Only signed-in customers may call the API. Floods of requests from single IP addresses must be stopped before they reach the API's backend. Harmful prompts and harmful model responses must be filtered by their meaning, not only by keywords.

    Which combination of controls will meet these requirements? (Choose three.)
body:
  choose: 3
  options:
    - id: a
      text:
        en: |-
          An Amazon Cognito user pool authorizer on the API methods
    - id: b
      text:
        en: |-
          An API key embedded in the mobile app and associated with a usage plan
    - id: c
      text:
        en: |-
          An AWS WAF web ACL with a rate-based rule, associated with the API stage
    - id: d
      text:
        en: |-
          A CloudWatch alarm on the Throttles metric of the Lambda function
    - id: e
      text:
        en: |-
          An Amazon Bedrock guardrail with content filters on input and on output
    - id: f
      text:
        en: |-
          A guardrail word filter with a list of offensive terms on input and on output
answer: { optionIds: [ a, c, e ] }
explanation:
  correct:
    en: |-
      A Cognito user pool authorizer lets only authenticated customers call the API. A rate-based rule in AWS WAF counts requests per aggregation key, such as the source IP address, and rate limits them before they reach the backend. Guardrail content filters detect harmful content semantically in both prompts and responses.
  options:
    b:
      en: |-
        A key shared by every copy of the app does not authenticate customers, and usage plan throttles are best-effort targets for the whole key, not per IP address.
    d:
      en: |-
        An alarm only notifies; it does not stop requests.
    f:
      en: |-
        Word filters match exact words and phrases, so they filter by keyword rather than by meaning.
references:
  - title: Using rate-based rule statements in AWS WAF - AWS WAF, AWS Firewall Manager, AWS Shield Advanced, and AWS Shield network security director
    url: https://docs.aws.amazon.com/waf/latest/developerguide/waf-rule-statement-type-rate-based.html
  - title: Block harmful words and conversations with content filters - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/guardrails-content-filters.html
