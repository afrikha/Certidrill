id: aipc01-1c-integ-kms-bucket-access
objective: "1.4.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A healthcare company connects an S3 bucket to a customer-managed Amazon Bedrock knowledge base. Company policy requires every object in the bucket to be encrypted with a customer managed AWS KMS key. The knowledge base service role allows s3:ListBucket on the bucket and s3:GetObject on its objects, but the first ingestion job cannot read any document. The company must keep the customer managed key and grant only the permissions that are needed.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Allow kms:Decrypt on the bucket's key in the service role policy, with a kms:ViaService condition for the Amazon S3 endpoint of the Region, and allow the role to use the key in the key policy.
    - id: b
      text:
        en: |-
          Change the default encryption of the bucket to SSE-S3, and re-encrypt the existing objects so that the knowledge base can read them without any KMS permissions.
    - id: c
      text:
        en: |-
          Add a bucket policy statement that allows the bedrock.amazonaws.com service principal to call s3:GetObject on every object in the bucket, including encrypted ones.
    - id: d
      text:
        en: |-
          Allow kms:* on every KMS key in the account in the service role policy so that ingestion can decrypt each object whatever key encrypted it.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      Objects encrypted with a customer managed key can be read only by a principal that may also decrypt with that key. AWS documents a service role statement that allows kms:Decrypt on the key with a kms:ViaService condition limited to Amazon S3 in the Region, which grants exactly what ingestion needs; the key policy must also let the role use the key.
  options:
    b:
      en: |-
        Removing the customer managed key breaks the company policy that requires it.
    c:
      en: |-
        The knowledge base reads the bucket with its service role, and S3 permissions alone do not allow decrypting objects protected by a KMS key.
    d:
      en: |-
        kms:* on every key grants far more than decryption of one key, which violates least privilege.
references:
  - title: "Create a service role for Amazon Bedrock Knowledge Bases - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/kb-permissions.html
  - title: "Connect to Amazon S3 for your knowledge base - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/s3-data-source-connector.html
