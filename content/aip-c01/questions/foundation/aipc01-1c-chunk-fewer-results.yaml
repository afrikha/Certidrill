id: aipc01-1c-chunk-fewer-results
objective: "1.5.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company's Amazon Bedrock knowledge base indexes plain text policy documents with hierarchical chunking. The application calls Retrieve with numberOfResults set to 10 and no metadata filter. It often receives only 4 to 6 results, even for broad questions that match many passages.

    What is the cause of the reduced number of results?
body:
  options:
    - id: a
      text:
        en: |-
          Retrieve returns at most 5 results unless a reranker model is configured in the request.
    - id: b
      text:
        en: |-
          Several matched child chunks share a parent, and the children of the same parent are returned as one parent chunk.
    - id: c
      text:
        en: |-
          Hierarchical chunking embeds only the parent chunks, so fewer vectors exist than with fixed-size chunking.
    - id: d
      text:
        en: |-
          Chunks from the same page or table are merged into one result because the documents were converted to Markdown during parsing.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      With hierarchical chunking, numberOfResults applies to child chunks. Children that share a parent are replaced by that one parent chunk, so the response can contain fewer results than requested, especially for broad questions that match many neighboring passages.
  options:
    a:
      en: |-
        Five is only the default when numberOfResults is not set; this request asks for 10, and a reranker is not required to get more.
    c:
      en: |-
        Child chunks are the ones embedded and matched; the parents supply context in the results.
    d:
      en: |-
        Page and table context applies to Markdown or parsed content; these are plain text files, so the cause is the parent replacement.
references:
  - title: "Configure and customize queries and response generation - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/kb-test-config.html
  - title: "How content chunking works for knowledge bases - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/kb-chunking.html
