id: aipc01-1e-prefill-json
objective: "1.6.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company asks a foundation model (FM) on Amazon Bedrock to return a JSON object. The FM does not support Amazon Bedrock structured outputs, but it supports prefilling the beginning of the assistant's response. The model often adds an introductory sentence before the JSON or comments after it, which breaks the application's parser.

    Which solution will MOST reliably return only the JSON object?
body:
  options:
    - id: a
      text:
        en: |-
          Ask the model to explain its choices before it writes the JSON so that the explanation and the object are clearly separated.
    - id: b
      text:
        en: |-
          End the request with an assistant message that opens a JSON code fence, set the closing fence as a stop sequence, and parse the output.
    - id: c
      text:
        en: |-
          Raise the temperature to 1 so that the model follows the formatting instructions in the prompt more flexibly for each request.
    - id: d
      text:
        en: |-
          Increase maxTokens so that the model has enough room to finish its comments after the JSON object before the response ends.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      Prefilling the assistant response makes the model continue from the text you supply, so an opening JSON code fence skips any preamble. The closing fence as a stop sequence ends generation right after the object, so trailing comments are never produced. The application should still validate the parsed result.
  options:
    a:
      en: |-
        An explanation adds more free text around the object, which the parser would still have to strip.
    c:
      en: |-
        A higher temperature makes the output less consistent, including its format.
    d:
      en: |-
        More output tokens leave the extra text in place; the parser still fails on it.
references:
  - title: "Require structured output - Amazon Nova"
    url: https://docs.aws.amazon.com/nova/latest/userguide/prompting-structured-output.html
