id: aipc01-1b-custom-model-import
objective: "1.2.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company fine-tuned a Llama 3.1 8B model with Hugging Face Transformers on Amazon SageMaker AI training jobs. The weights are stored in Amazon S3 in the us-east-1 Region as .safetensors files with the model's config.json and tokenizer files. The model receives a few hundred requests each day in short bursts. The company wants to call the model through the Amazon Bedrock runtime API like its other models, pay only for actual usage, and manage no inference infrastructure.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Deploy the model to a SageMaker AI real-time endpoint on a GPU instance with an auto scaling policy that keeps at least one instance running.
    - id: b
      text:
        en: |-
          Run an Amazon Bedrock fine-tuning job on the base model with the same dataset, and purchase Provisioned Throughput for the resulting custom model.
    - id: c
      text:
        en: |-
          Create an Amazon Bedrock Custom Model Import job from the S3 location, and call the imported model's ARN with InvokeModel on demand.
    - id: d
      text:
        en: |-
          Deploy the model with SageMaker JumpStart to an asynchronous inference endpoint that scales to zero instances when no requests are queued.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      Custom Model Import brings weights that were customized elsewhere into Amazon Bedrock when they are in Hugging Face format with .safetensors weights and a supported architecture such as Llama. Imported models are invoked on demand with InvokeModel or InvokeModelWithResponseStream, so there is no infrastructure to manage and no capacity to pay for between bursts.
  options:
    a:
      en: |-
        A real-time endpoint is SageMaker infrastructure that the company manages, with at least one GPU instance billed around the clock, and it is called through the SageMaker runtime rather than the Bedrock API.
    b:
      en: |-
        Retraining repeats work that is already done, and Provisioned Throughput is billed for the purchased capacity whether or not requests arrive, which is not pay-per-use.
    d:
      en: |-
        An asynchronous endpoint can scale to zero, but it is still SageMaker infrastructure called through the SageMaker runtime, and requests are queued rather than answered like Bedrock runtime calls.
references:
  - title: Use Custom model import to import a customized open-source model into Amazon Bedrock - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/model-customization-import-model.html
