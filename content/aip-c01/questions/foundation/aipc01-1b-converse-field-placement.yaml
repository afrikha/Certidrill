id: aipc01-1b-converse-field-placement
objective: "1.3.3"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    A developer is moving a request from InvokeModel to the Amazon Bedrock Converse API. The native request body set a system instruction that defines the assistant's role and a top_k value of 50, a sampling parameter that the model supports but that is not part of the Converse base inference parameters. The developer must keep both settings in the Converse request.

    Where should the developer put these settings? (Choose two.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Put the system instruction in the first entry of messages, as a message with the role set to system.
    - id: b
      text:
        en: |-
          Put the system instruction in the system field as a list that contains a text block.
    - id: c
      text:
        en: |-
          Put top_k in inferenceConfig next to maxTokens, temperature and topP.
    - id: d
      text:
        en: |-
          Put top_k in additionalModelRequestFields with the field name that the model expects.
    - id: e
      text:
        en: |-
          Put top_k in requestMetadata so that Amazon Bedrock forwards it to the model.
answer: { optionIds: [b, d] }
explanation:
  correct:
    en: |-
      Converse takes system prompts in the system field as a list of content blocks, separate from the messages. inferenceConfig holds the base parameters common to all models, and parameters that only some models support, such as top_k, go in additionalModelRequestFields in the model's own structure.
  options:
    a:
      en: |-
        Messages use the user and assistant roles. System instructions have their own system field.
    c:
      en: |-
        inferenceConfig accepts only the base set of parameters that Converse supports. Additional parameters must go in additionalModelRequestFields.
    e:
      en: |-
        requestMetadata holds key-value pairs for filtering invocation logs. It is not sent to the model as a parameter.
references:
  - title: Converse - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/APIReference/API_runtime_Converse.html
  - title: Inference using Converse API - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/conversation-inference.html
