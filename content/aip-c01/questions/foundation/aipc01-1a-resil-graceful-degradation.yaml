id: aipc01-1a-resil-graceful-degradation
objective: "1.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A retailer's product-help assistant calls the Retrieve API of an Amazon Bedrock knowledge base and then sends the retrieved passages to a model to write an answer. During a recent model disruption, users received only error pages. The company wants users to still get useful help when the model call keeps failing after bounded retries, without adding infrastructure.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Retry the model call indefinitely with a fixed one-second delay until it succeeds, and keep the user's request open.
    - id: b
      text:
        en: |-
          When the model call fails after the retries, return the retrieved passages with links to their sources and a notice that the summary is unavailable.
    - id: c
      text:
        en: |-
          Return an HTTP 503 error with a message that asks users to try again later, and log the failed request for analysis.
    - id: d
      text:
        en: |-
          Write the failed requests to an Amazon SQS queue, and answer them in an Amazon Bedrock batch inference job the next night.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      Graceful failure handling keeps a reduced service instead of an error. The passages are already retrieved, so returning them with their sources gives users relevant help immediately, and the application falls back to this path after bounded retries.
  options:
    a:
      en: |-
        Unbounded retries hold requests open, add load during the disruption, and give users nothing until the model recovers.
    c:
      en: |-
        An error page is exactly the experience the company wants to avoid.
    d:
      en: |-
        An answer the next night is not useful help for a user who is on the page now, and it adds a queue and a batch process.
references:
  - title: Generative AI Lens - AWS Well-Architected Framework - Generative AI Lens
    url: https://docs.aws.amazon.com/wellarchitected/latest/generative-ai-lens/generative-ai-lens.html
  - title: Route model inference requests across AWS Regions with cross-Region inference - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/cross-region-inference.html
