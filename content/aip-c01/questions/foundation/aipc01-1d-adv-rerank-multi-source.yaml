id: aipc01-1d-adv-rerank-multi-source
objective: "1.5.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A support assistant retrieves context from two places: an Amazon Bedrock knowledge base that holds product manuals, and an Aurora PostgreSQL table of past support tickets that the application queries directly with pgvector SQL. The similarity scores from the two sources are on different scales. The assistant must send a single list of the 6 most relevant passages to the model, with the least custom code.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Concatenate the two result lists and sort them by their similarity scores before keeping the first 6 passages.
    - id: b
      text:
        en: |-
          Configure a reranker model in the knowledge base Retrieve request and append the ticket results after the reranked manual results.
    - id: c
      text:
        en: |-
          Create an OpenSearch search pipeline with a normalization processor to combine the scores of the two result lists.
    - id: d
      text:
        en: |-
          Send the question and all passages from both sources as inline text documents to the Amazon Bedrock Rerank operation, and keep the top 6 results.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      The Rerank operation takes a query and up to 1,000 inline documents from any origin and reorders them by relevance with a reranker model. Scoring every passage with the same model produces one comparable ranking, so the application simply keeps the top 6.
  options:
    a:
      en: |-
        Scores from a knowledge base and from pgvector SQL are computed differently and are not comparable, so a single sort mixes incompatible scales.
    b:
      en: |-
        Reranking inside Retrieve reorders only the knowledge base results; the tickets would still be appended without a common ranking.
    c:
      en: |-
        A normalization processor combines the subqueries of a hybrid query inside OpenSearch; it cannot process results that come from an Aurora database.
references:
  - title: "Rerank - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/APIReference/API_agent-runtime_Rerank.html
  - title: "Improve the relevance of query responses with a reranker model in Amazon Bedrock - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/rerank.html
