id: aipc01-1d-if-prompt-caching-chat
objective: "1.6.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A team stores a prompt in Amazon Bedrock Prompt Management. The prompt uses the TEXT template type and starts with 6,000 tokens of company policies that are identical in every call, followed by a {{question}} variable. The selected model supports prompt caching, and the team wants to cache the policies to reduce cost and latency.

    Which change should the team make?
body:
  options:
    - id: a
      text:
        en: |-
          Keep the TEXT template type and add a prompt caching setting to the additional model request fields of the prompt.
    - id: b
      text:
        en: |-
          Change the prompt to the CHAT template type, move the policies to the system prompt with caching enabled, and create a new version.
    - id: c
      text:
        en: |-
          Create three variants of the prompt so that Amazon Bedrock can reuse the cached policies across all the variants.
    - id: d
      text:
        en: |-
          Purchase Provisioned Throughput for the model so that the repeated policy prefix is processed faster on each call.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      In Prompt Management, prompt caching requires the CHAT template type, which is compatible with models that support the Converse API. Placing the static policies in the system prompt and caching the system instructions lets repeated calls reuse the cached prefix; a new version makes the change available to callers.
  options:
    a:
      en: |-
        Prompt caching is not available with the TEXT template type in Prompt Management.
    c:
      en: |-
        Variants are alternative configurations to compare; they do not cache content.
    d:
      en: |-
        Provisioned Throughput reserves capacity but does not avoid reprocessing the same 6,000 tokens on every call.
references:
  - title: "Create a prompt using Prompt management - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/prompt-management-create.html
