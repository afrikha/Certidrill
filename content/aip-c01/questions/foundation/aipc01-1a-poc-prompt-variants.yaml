id: aipc01-1a-poc-prompt-variants
objective: "1.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    During a two-day proof-of-concept workshop, a product team wants to try one prompt for drafting insurance claim letters with three different models and inference settings. Team members want to run the configurations side by side in the Amazon Bedrock console without writing code and without preparing an evaluation dataset. They must then keep the best configuration and save it so that developers can use it in the application later.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Create the prompt in Amazon Bedrock Prompt Management with one variant per model and settings, test the variants side by side, and save a version.
    - id: b
      text:
        en: |-
          Create an Amazon Bedrock flow with a condition node that routes each test input to one of the three models, and compare the outputs in the logs.
    - id: c
      text:
        en: |-
          Create an LLM-as-a-judge evaluation job for each model with a dataset of sample claims, and compare the judge scores after the jobs finish.
    - id: d
      text:
        en: |-
          Create three Amazon Bedrock application inference profiles, one per model, and compare their invocation metrics in Amazon CloudWatch.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      In Prompt Management, a variant is an alternative configuration of a prompt with a different message, model or inference configuration, and the prompt builder lets you test variants side by side in the console. The team keeps the best variant and saves a version that applications can use at inference time.
  options:
    c:
      en: |-
        Evaluation jobs need a prepared dataset and run as jobs; they do not give the interactive side-by-side comparison the workshop wants.
    b:
      en: |-
        A flow that routes each input to one model never shows the three outputs for the same input side by side, and building it is more work than the workshop needs.
    d:
      en: |-
        Inference profiles track usage and cost; invocation metrics say nothing about the quality of the letters.
references:
  - title: Construct and store reusable prompts with Prompt management in Amazon Bedrock - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/prompt-management.html
