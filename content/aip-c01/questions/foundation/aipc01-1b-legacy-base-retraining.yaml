id: aipc01-1b-legacy-base-retraining
objective: "1.2.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company fine-tuned a foundation model in Amazon Bedrock and serves the custom model through an on-demand custom model deployment that it created last year. Every month, a pipeline runs a new fine-tuning job on the same base model with the latest data. This month, the fine-tuning job could not be created because the base model has entered the Legacy state. The company must keep its monthly retraining and keep serving a custom model after the base model's end-of-life (EOL) date.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Request a service quota increase for model customization jobs so that fine-tuning jobs can again be created on the Legacy base model.
    - id: b
      text:
        en: |-
          Fine-tune an Active base model with the same dataset, evaluate the new custom model against the current one, deploy it on demand, and switch traffic before the EOL date.
    - id: c
      text:
        en: |-
          Purchase new Provisioned Throughput for the existing custom model so that the model keeps serving requests after the base model's EOL date.
    - id: d
      text:
        en: |-
          Keep using the existing on-demand deployment, because deployments that were created before the base model entered the Legacy state are exempt from its EOL date.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      Once a model is in the Legacy state, new fine-tuning jobs and new Provisioned Throughput cannot be created on it, and after EOL requests to it fail. AWS recommends moving workloads and customized deployments to an Active model before EOL; migration never happens automatically. Retraining on an Active base model restores the monthly pipeline, and evaluating before switching avoids a quality regression.
  options:
    a:
      en: |-
        The block is a lifecycle rule, not a quota: fine-tuning jobs cannot be created on a Legacy model at any quota value.
    c:
      en: |-
        New Provisioned Throughput cannot be created for models in the Legacy state, and capacity does not keep a model available after its EOL date.
    d:
      en: |-
        Existing deployments keep working during the Legacy period only. After the EOL date the model is removed from all Regions, so the company must migrate before that date.
references:
  - title: Model lifecycle - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/model-lifecycle.html
  - title: Deploy a custom model for on-demand inference - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/deploy-custom-model-on-demand.html
