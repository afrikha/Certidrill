id: aipc01-1e-prompt-version-pinning
objective: "1.6.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A retail company stores the prompt of its customer support assistant in Amazon Bedrock Prompt Management. Prompt engineers save changes to the prompt several times a day while they experiment. The production application must keep the same prompt text and inference settings until a release is approved, and a release must be reversible within minutes.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Have the application call the prompt ARN without a version so that it runs the latest saved draft, and ask the engineers to save only approved changes.
    - id: b
      text:
        en: |-
          Create a prompt version when a release is approved, have the application call that version's ARN, and switch back to the previous version's ARN to roll back.
    - id: c
      text:
        en: |-
          Add a second variant to the prompt for production use, and keep the experimental changes in the first variant until a release is approved.
    - id: d
      text:
        en: |-
          Turn on prompt caching for the prompt so that the application reuses the cached prompt until the cache is cleared at the next release.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      Saving a prompt updates its draft, while a version is a snapshot of the draft taken at a point in time, numbered from 1. The application calls the ARN of a specific version, so later edits to the draft never reach production. Rolling back means pointing the application to the previous version's ARN.
  options:
    a:
      en: |-
        The draft changes every time an engineer saves, so production would run unreviewed edits; a request to save only approved changes is not a control.
    c:
      en: |-
        Variants are alternative configurations stored in the same draft that the engineers keep editing; they do not freeze what production runs.
    d:
      en: |-
        Prompt caching reduces latency and cost for repeated prompt prefixes for a few minutes; it is not a release mechanism and does not freeze the prompt.
references:
  - title: "Deploy a prompt to your application using versions in Prompt management - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/prompt-management-deploy.html
  - title: "Create a version of a prompt in Prompt management - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/prompt-management-version-create.html
