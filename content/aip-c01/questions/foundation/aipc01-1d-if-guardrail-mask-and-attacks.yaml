id: aipc01-1d-if-guardrail-mask-and-attacks
objective: "1.6.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A telecommunications company's support assistant uses the Converse API on Amazon Bedrock. Responses must still be delivered when they contain customer phone numbers or email addresses, but those values must be masked. The assistant must also detect user messages that try to make it ignore or override the developer's instructions.

    Which guardrail configurations will meet these requirements? (Choose two.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          A sensitive information filter for PHONE and EMAIL with the BLOCK action on outputs.
    - id: b
      text:
        en: |-
          A contextual grounding check with a high grounding threshold on outputs.
    - id: c
      text:
        en: |-
          A sensitive information filter for PHONE and EMAIL with the ANONYMIZE action on outputs.
    - id: d
      text:
        en: |-
          A content filter with the prompt attack category enabled on inputs.
    - id: e
      text:
        en: |-
          A word filter that blocks the phrases ignore previous instructions and ignore your rules.
answer: { optionIds: [ c, d ] }
explanation:
  correct:
    en: |-
      The ANONYMIZE action masks detected PII, replacing values with their type such as {EMAIL}, while the rest of the response is delivered. The prompt attack filter detects jailbreaks and prompt injection, that is, user prompts designed to ignore and override the developer's instructions.
  options:
    a:
      en: |-
        BLOCK replaces the whole response with the blocked message, so the answer would not be delivered.
    b:
      en: |-
        Contextual grounding checks detect responses that are not grounded in the source or not relevant; they do not detect injection attempts or mask PII.
    e:
      en: |-
        A word filter catches only the exact phrases listed, so reworded injection attempts pass.
references:
  - title: "Remove PII from conversations by using sensitive information filters - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/guardrails-sensitive-filters.html
  - title: "Detect prompt attacks with Amazon Bedrock Guardrails - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/guardrails-prompt-attack.html
