id: aipc01-1d-ctx-sentiment-escalation
objective: "1.6.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An online retailer's chatbot answers customer questions with a model on Amazon Bedrock. The retailer wants each customer message checked before it reaches the model, so that conversations with clearly upset customers are handed to a human agent. The retailer has no labeled training data and wants a built-in Amazon Comprehend capability.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Call DetectSentiment on each message and escalate when the result is NEGATIVE with a high score.
    - id: b
      text:
        en: |-
          Call DetectKeyPhrases on each message and escalate when a phrase from a list of complaint words appears.
    - id: c
      text:
        en: |-
          Train an Amazon Comprehend custom classification model that labels messages as upset or calm.
    - id: d
      text:
        en: |-
          Call DetectDominantLanguage on each message and escalate when the confidence score is low.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      DetectSentiment is a built-in Comprehend operation that returns POSITIVE, NEGATIVE, NEUTRAL, or MIXED with a score for each value, so the chatbot can escalate when a message is clearly negative. It needs no training data.
  options:
    b:
      en: |-
        Key phrases describe what the text is about; a word list misses upset customers who use other words and flags calm ones who mention those words.
    c:
      en: |-
        Custom classification requires labeled training data, which the retailer does not have.
    d:
      en: |-
        The dominant language score measures confidence in the detected language, not the customer's mood.
references:
  - title: "Sentiment - Amazon Comprehend"
    url: https://docs.aws.amazon.com/comprehend/latest/dg/how-sentiment.html
