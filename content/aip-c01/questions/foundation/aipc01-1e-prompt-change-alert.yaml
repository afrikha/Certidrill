id: aipc01-1e-prompt-change-alert
objective: "1.6.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company's production prompts in Amazon Bedrock Prompt Management must change only through a deployment pipeline that uses a dedicated IAM role. The security team wants an email within minutes whenever any other principal updates a prompt or creates a prompt version. The account has an AWS CloudTrail trail that logs management events.

    Which solution will meet these requirements with the LEAST operational overhead?
body:
  options:
    - id: a
      text:
        en: |-
          Turn on model invocation logging, add a metric filter that counts invocations of new prompt versions, and send the metric's alarm to an Amazon SNS topic.
    - id: b
      text:
        en: |-
          Add CloudTrail data event selectors for the AWS::Bedrock::Prompt resource type, and email the results of a daily Amazon Athena query on the trail.
    - id: c
      text:
        en: |-
          Create an Amazon EventBridge rule for the CloudTrail events of UpdatePrompt and CreatePromptVersion from other principals, with an SNS topic as the target.
    - id: d
      text:
        en: |-
          Run an AWS Lambda function every hour that compares each prompt with the copy in the pipeline repository and emails the security team about any difference.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      With a trail that logs management events, CloudTrail sends AWS API Call via CloudTrail events to the default event bus, and rules in the ENABLED state match write management events such as UpdatePrompt and CreatePromptVersion. A pattern that excludes the pipeline role's ARN and an SNS email subscription alert the team within minutes, with no code.
  options:
    a:
      en: |-
        Invocation logs record model calls; a change to a prompt is visible only when production invokes it, and the logs do not say who made the change.
    b:
      en: |-
        RenderPrompt data events record the use of a prompt at invocation time, not edits, and a daily query is not within minutes.
    d:
      en: |-
        An hourly comparison misses the within-minutes requirement, does not identify who made the change, and is custom code to maintain.
references:
  - title: "AWS service events delivered via AWS CloudTrail - Amazon EventBridge"
    url: https://docs.aws.amazon.com/eventbridge/latest/userguide/eb-service-event-cloudtrail.html
  - title: "Monitor Amazon Bedrock API calls using CloudTrail - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/logging-using-cloudtrail.html
