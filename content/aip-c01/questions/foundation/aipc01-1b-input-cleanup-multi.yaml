id: aipc01-1b-input-cleanup-multi
objective: "1.3.4"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    An insurer's assistant classifies customer emails into claim types with a foundation model. Customers describe the same incident in very different ways, and the classification of similar emails is inconsistent. Many emails also contain long signatures, legal disclaimers and quoted reply chains that waste input tokens.

    Which combination of actions will improve the consistency of the classifications? (Choose two.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Remove signatures, disclaimers and quoted replies, and normalize whitespace and dates in a Lambda function before the model call.
    - id: b
      text:
        en: |-
          Raise the temperature of the classification call to 1.0 so that the model can interpret the different descriptions more freely.
    - id: c
      text:
        en: |-
          Raise maxTokens of the classification call so that the model has more room to reason about each email.
    - id: d
      text:
        en: |-
          Use a small Bedrock model to rewrite each email into a fixed template (incident, date, damage, amount) before the classification call.
    - id: e
      text:
        en: |-
          Enable Amazon Bedrock model invocation logging so that every classification request and response is recorded.
answer: { optionIds: [a, d] }
explanation:
  correct:
    en: |-
      Removing boilerplate leaves only the content that matters and saves tokens, and deterministic normalization makes equivalent inputs look the same. Rewriting each email into a fixed template with a small model gives the classifier the same structure every time, so similar incidents receive similar classifications.
  options:
    b:
      en: |-
        A higher temperature adds randomness to the output, which makes the classifications less consistent, not more.
    c:
      en: |-
        maxTokens limits the length of the output. It does not change how the model interprets differently worded inputs.
    e:
      en: |-
        Invocation logging records requests and responses for monitoring; it does not change the inputs or the outputs.
references:
  - title: Inference using Converse API - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/conversation-inference.html
  - title: Get validated JSON results from models - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/structured-output.html
