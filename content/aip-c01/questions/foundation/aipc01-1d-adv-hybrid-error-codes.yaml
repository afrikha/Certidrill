id: aipc01-1d-adv-hybrid-error-codes
objective: "1.5.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A manufacturer's support assistant uses a customer-managed Amazon Bedrock knowledge base whose vector store is an Amazon OpenSearch Serverless collection with a filterable text field. Technicians search for exact error codes such as E-4471 and part numbers. Retrieval returns passages about similar problems but often misses the passage that contains the exact code.

    Which change will MOST improve retrieval for these queries?
body:
  options:
    - id: a
      text:
        en: |-
          Increase numberOfResults in the retrieval configuration from 5 to 50.
    - id: b
      text:
        en: |-
          Re-ingest the documents with hierarchical chunking so that parent chunks are returned.
    - id: c
      text:
        en: |-
          Switch the embedding model to 256 dimensions so that short codes weigh more in each vector.
    - id: d
      text:
        en: |-
          Set overrideSearchType to HYBRID in the vector search configuration of the retrieval request.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      Hybrid search combines semantic search on the embeddings with a search through the raw text, so exact tokens such as error codes and part numbers are matched. Knowledge Bases supports it for OpenSearch Serverless stores that contain a filterable text field, through overrideSearchType HYBRID.
  options:
    a:
      en: |-
        More semantic results add noise and tokens to the prompt; the exact-code passage may still not be retrieved because embeddings capture meaning, not exact strings.
    b:
      en: |-
        Hierarchical chunking returns more context around a match, but it does not make the search match exact codes.
    c:
      en: |-
        Fewer dimensions reduce storage at some cost in accuracy; they do not add keyword matching.
references:
  - title: "Configure and customize queries and response generation - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/kb-test-config.html
