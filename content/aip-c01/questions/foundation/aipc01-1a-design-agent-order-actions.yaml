id: aipc01-1a-design-agent-order-actions
objective: "1.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An online retailer wants a customer-service assistant that can check order status and start returns during a multi-turn conversation. Order status is available through an existing REST API described by an OpenAPI specification, and returns are created by existing AWS Lambda functions. The model must decide which operation to call based on the conversation. This is a new design, and the retailer wants to reuse the API and the functions with the LEAST custom integration code.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Build the agent with Strands Agents, host it on Amazon Bedrock AgentCore Runtime, and expose the OpenAPI specification and the Lambda functions as tools through AgentCore Gateway.
    - id: b
      text:
        en: |-
          Create an Amazon Bedrock agent with action groups that reference the OpenAPI specification and the Lambda functions, and invoke the agent from the website.
    - id: c
      text:
        en: |-
          Export orders to Amazon S3 every hour, create an Amazon Bedrock knowledge base on the exports, and answer order and return requests with RetrieveAndGenerate.
    - id: d
      text:
        en: |-
          Create an Amazon Bedrock flow with a prompt node that classifies the request and a fixed sequence of nodes that calls both the order API and the returns function.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      AgentCore Gateway converts existing APIs described by OpenAPI specifications and Lambda functions into MCP-compatible tools without rewriting them, and AgentCore Runtime hosts agents built with frameworks such as Strands Agents in a serverless environment. The model then chooses which tool to call at each turn of the conversation.
  options:
    b:
      en: |-
        Amazon Bedrock Agents (now Agents Classic) has been closed to new customers since July 30, 2026; AgentCore is its successor for new designs.
    c:
      en: |-
        A knowledge base retrieves text for answers: it cannot create a return, and hourly exports give stale order status.
    d:
      en: |-
        A fixed sequence calls both operations on every request instead of letting the model choose, so it would start returns that nobody asked for.
references:
  - title: Overview - Amazon Bedrock AgentCore
    url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/what-is-bedrock-agentcore.html
