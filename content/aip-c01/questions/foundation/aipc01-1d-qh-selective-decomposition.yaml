id: aipc01-1d-qh-selective-decomposition
objective: "1.5.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A retailer enabled QUERY_DECOMPOSITION for every RetrieveAndGenerate request on its Amazon Bedrock knowledge base. Comparative questions improved, but latency and cost rose for simple lookups such as "What is the return window?", which are 80% of the traffic. The retailer wants to keep the improvement for comparative questions and restore the previous latency for simple lookups.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Classify each question with a small, fast model, and enable QUERY_DECOMPOSITION only for comparative or multi-part questions.
    - id: b
      text:
        en: |-
          Turn off query decomposition and raise numberOfResults so that comparative questions retrieve more chunks.
    - id: c
      text:
        en: |-
          Purchase Provisioned Throughput for the generation model to reduce the latency of every request.
    - id: d
      text:
        en: |-
          Add a reranker model to the retrieval configuration so that fewer chunks reach the model for each question.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      Decomposition can run several queries against the knowledge base, which adds retrieval round trips and model work to every request. Routing only compound questions to decomposition keeps its accuracy benefit where it matters and lets simple lookups use a single retrieval.
  options:
    b:
      en: |-
        Without decomposition, comparative questions lose the improvement; more chunks from one query do not replace per-plan sub-queries.
    c:
      en: |-
        Provisioned Throughput reserves model capacity, but simple lookups would still pay for the extra sub-queries and retrievals.
    d:
      en: |-
        Reranking reduces the chunks sent to the model, but the extra retrievals caused by decomposition still run for every simple lookup.
references:
  - title: "Configure and customize queries and response generation - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/kb-test-config.html
