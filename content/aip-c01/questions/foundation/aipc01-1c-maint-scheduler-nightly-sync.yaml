id: aipc01-1c-maint-scheduler-nightly-sync
objective: "1.4.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company has a customer-managed Amazon Bedrock knowledge base with an S3 data source that holds 2 million documents. A nightly ETL job finishes by 01:00 UTC after it writes the changed documents, usually a few hundred, to the bucket. The knowledge base must reflect the changes by 03:00 UTC. The company wants the MOST cost-effective solution.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Create an Amazon EventBridge Scheduler schedule for 01:30 UTC that invokes a Lambda function, which calls StartIngestionJob for the data source.
    - id: b
      text:
        en: |-
          Add a syncSchedule with a daily frequency to the data source configuration so that Amazon Bedrock syncs the bucket every night.
    - id: c
      text:
        en: |-
          Delete and re-create the data source every night so that all 2 million documents are ingested from a clean state.
    - id: d
      text:
        en: |-
          Have a Lambda function call IngestKnowledgeBaseDocuments every night for all 2 million documents, in batches of 25.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      A sync is incremental: it processes only documents added, modified, or deleted since the last sync, so a nightly ingestion job re-embeds only the few hundred changed documents. EventBridge Scheduler starts it at a fixed time after the ETL job, which a customer-managed knowledge base needs because it has no built-in schedule.
  options:
    b:
      en: |-
        syncSchedule is part of the managed knowledge base connector configuration, and its daily run time is chosen by the service, so it cannot guarantee completion by 03:00 UTC.
    c:
      en: |-
        Re-creating the data source re-embeds all 2 million documents every night, which is the most expensive option.
    d:
      en: |-
        Direct ingestion of every document re-processes all of them each night instead of only the changed ones.
references:
  - title: "Sync your data with your Amazon Bedrock knowledge base - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/kb-data-source-sync-ingest.html
  - title: "Sync a data source - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/kb-managed-sync.html
