id: aipc01-1a-resil-scp-geo-profile
objective: "1.2.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company's service control policy (SCP) denies all actions outside us-east-1 and us-west-2, except for global services. To survive capacity shortages, an application in us-east-1 now calls a model through the US geographic cross-Region inference profile, whose destination Regions are us-east-1, us-east-2, and us-west-2. Since the change, inference requests through the profile are denied, although the application's IAM role allows the profile and the model. Inference must stay within the US.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Switch to the global cross-Region inference profile, and add an exception to the SCP for aws:RequestedRegion set to unspecified.
    - id: b
      text:
        en: |-
          Update the SCP to also allow Amazon Bedrock inference in us-east-2, so that every destination Region of the profile is allowed.
    - id: c
      text:
        en: |-
          Purchase Provisioned Throughput in us-east-1, and invoke the provisioned model through the US geographic inference profile.
    - id: d
      text:
        en: |-
          Retry the denied requests with exponential backoff so that they are eventually routed to us-east-1 or us-west-2.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      With a geographic inference profile, the SCP must allow every destination Region of the profile; an SCP that denies one of them makes the requests fail. Allowing us-east-2 for Bedrock inference keeps the US profile working and keeps processing in the US.
  options:
    a:
      en: |-
        A global profile can process requests in any supported commercial Region, which breaks the US-only requirement.
    c:
      en: |-
        Inference profiles do not support Provisioned Throughput, and the SCP would still deny us-east-2.
    d:
      en: |-
        An access denial is not a transient error; retries do not change the SCP evaluation.
references:
  - title: Route model inference requests across AWS Regions with cross-Region inference - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/cross-region-inference.html
