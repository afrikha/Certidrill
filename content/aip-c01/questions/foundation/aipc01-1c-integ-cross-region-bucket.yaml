id: aipc01-1c-integ-cross-region-bucket
objective: "1.4.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company's document pipeline writes processed manuals to a general purpose S3 bucket in eu-west-1. The company's RAG application and its Amazon Bedrock knowledge base must run in eu-central-1, where the required models are approved. New manuals must reach the knowledge base automatically.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Configure S3 Replication from the eu-west-1 bucket to a general purpose bucket in eu-central-1, and use the replica bucket as the S3 data source.
    - id: b
      text:
        en: |-
          Configure the S3 data source in eu-central-1 with the ARN of the eu-west-1 bucket, and grant the knowledge base role read access to it.
    - id: c
      text:
        en: |-
          Copy new manuals with S3 Batch Operations to an S3 directory bucket in eu-central-1, and use the directory bucket as the S3 data source.
    - id: d
      text:
        en: |-
          Create the knowledge base in eu-west-1 next to the bucket, and call it from the application in eu-central-1.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      An S3 data source must be a general purpose bucket in the same Region as the knowledge base. Replicating new objects to a general purpose bucket in eu-central-1 keeps the source pipeline unchanged and gives the knowledge base a supported data source; a sync or event-driven ingestion then picks up each new manual.
  options:
    b:
      en: |-
        Permissions do not lift the same-Region requirement; the bucket must be in the knowledge base's Region.
    c:
      en: |-
        Only general purpose buckets are supported as S3 data sources, so a directory bucket cannot be used.
    d:
      en: |-
        The knowledge base must run in eu-central-1, so creating it in eu-west-1 breaks a stated requirement.
references:
  - title: "Connect to Amazon S3 for your knowledge base - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/s3-data-source-connector.html
