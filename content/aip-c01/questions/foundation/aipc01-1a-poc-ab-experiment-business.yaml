id: aipc01-1a-poc-ab-experiment-business
objective: "1.1.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    An e-commerce company has finished an offline evaluation of two models for its product question-and-answer widget, and both pass the quality bar. To decide which model to fund, it wants to measure the effect of each model on the add-to-cart rate with real shoppers. Each shopper must keep the same model during the test, the traffic split must be controlled centrally, and the winner must then be rolled out safely without redeploying the application. The widget backend runs on Amazon ECS.

    Which solution will meet these requirements with the LEAST operational overhead?
body:
  options:
    - id: a
      text:
        en: |-
          Run an Amazon Bedrock LLM-as-a-judge evaluation job on a sample of production prompts, and select the model with the higher score.
    - id: b
      text:
        en: |-
          Create an Amazon CloudWatch Evidently launch with one variation per model, and record add-to-cart events as Evidently metrics.
    - id: c
      text:
        en: |-
          Create an AWS AppConfig experiment with one treatment per model ID allocated by shopper, analyze the add-to-cart results, and promote the winner through an AppConfig rollout.
    - id: d
      text:
        en: |-
          Deploy two ECS services with different model IDs behind an Application Load Balancer with weighted target groups, and compare the rates in custom dashboards.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      AppConfig experimentation runs managed A/B tests, including AI model selections, with target audiences, traffic allocation percentages and locked treatment allocations. Results are analyzed in Amazon CloudWatch or existing analytics tools, and the winning treatment is promoted through a standard AppConfig safe rollout; ECS workloads are supported through the AppConfig Agent.
  options:
    a:
      en: |-
        A judge score measures answer quality offline; it cannot measure the effect on the add-to-cart rate of real shoppers.
    b:
      en: |-
        Amazon CloudWatch Evidently is discontinued and cannot be used for a new experiment; AppConfig provides experimentation instead.
    d:
      en: |-
        Two services and custom analysis add operations, and making the winner permanent requires a redeployment, which the company wants to avoid.
references:
  - title: AWS AppConfig launches managed experimentation tools for A/B testing
    url: https://aws.amazon.com/about-aws/whats-new/2026/6/aws-appconfig-experimentation/
