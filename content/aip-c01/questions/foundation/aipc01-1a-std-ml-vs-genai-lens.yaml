id: aipc01-1a-std-ml-vs-genai-lens
objective: "1.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A bank wants to review two workloads with the AWS Well-Architected Tool. The first is a fraud-detection model that the bank trains on tabular transaction data and hosts on Amazon SageMaker AI. The second is a customer assistant that calls foundation models in Amazon Bedrock with a knowledge base. Each workload must be reviewed against the AWS guidance that is designed for its type of application.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Apply the Generative AI Lens to both workloads, because both workloads use machine learning models that are hosted on AWS.
    - id: b
      text:
        en: |-
          Apply the Machine Learning Lens to the fraud-detection workload, and apply the Generative AI Lens to the customer assistant.
    - id: c
      text:
        en: |-
          Apply the Machine Learning Lens to both workloads, because the Generative AI Lens covers only applications built on Amazon Q.
    - id: d
      text:
        en: |-
          Review both workloads with the Well-Architected Framework pillars only, because lenses apply only to workloads on SageMaker AI.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      The Generative AI Lens covers applications that use foundation models on Amazon Bedrock or customer-managed models on SageMaker AI. Traditional machine learning applications, such as a fraud model trained on tabular data, are covered by the Machine Learning Lens instead.
  options:
    a:
      en: |-
        The fraud model is a traditional ML workload, which AWS directs to the Machine Learning Lens rather than the Generative AI Lens.
    c:
      en: |-
        The Generative AI Lens covers foundation model applications on Bedrock and SageMaker AI, not only Amazon Q applications.
    d:
      en: |-
        Lenses apply to any workload in the Well-Architected Tool, and skipping them loses the guidance designed for each type of application.
references:
  - title: Generative AI Lens - AWS Well-Architected Framework - Generative AI Lens
    url: https://docs.aws.amazon.com/wellarchitected/latest/generative-ai-lens/generative-ai-lens.html
