id: aipc01-1c-meta-aurora-custom-metadata
objective: "1.4.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A healthcare software company is creating an Amazon Bedrock knowledge base on an Aurora PostgreSQL cluster with the pgvector extension so that its SQL reporting can read the same table. The product team will add new document attributes every few months (for example, clinical_area, device_class, and approval_status), and every attribute must be usable in retrieval filters. The database team does not want to alter the table or the knowledge base field mapping each time an attribute is added.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Create one table column per metadata attribute with its data type, and add a column with ALTER TABLE before each new attribute is used.
    - id: b
      text:
        en: |-
          Store the attributes in the Bedrock-managed metadata JSON column, and create a B-tree index on that column for filtering.
    - id: c
      text:
        en: |-
          Map a custom_metadata JSONB column that holds all metadata file attributes when the knowledge base is created, and create a GIN index on it.
    - id: d
      text:
        en: |-
          Store the attributes as S3 object tags on the source documents, and join the tags to the vector table in SQL at query time.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      For an Aurora vector store, you can name a custom metadata field that stores all attributes from the metadata files in one JSONB column, and index it with a GIN index. New attributes then land in that column without schema changes. The field mapping is fixed when the knowledge base is created, so the column must be mapped from the start.
  options:
    a:
      en: |-
        One column per attribute is the alternative when no custom metadata field is mapped, but every new attribute then needs a table change, which the database team wants to avoid.
    b:
      en: |-
        The metadata column is reserved for metadata that Amazon Bedrock manages; custom attributes from metadata files go to the custom metadata field.
    d:
      en: |-
        Knowledge base filters use the attributes stored in the vector store. S3 tags are not ingested, and a SQL join is not part of the Retrieve API.
references:
  - title: "Prerequisites for using a vector store you created for a knowledge base - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/knowledge-base-setup.html
  - title: "Configure and customize queries and response generation - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/kb-test-config.html
