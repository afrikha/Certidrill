id: aipc01-1b-lora-adapter-components
objective: "1.2.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An insurance company hosts an open-weights LLM as a base inference component on an Amazon SageMaker AI real-time endpoint. Data scientists have trained 12 LoRA adapters, one for each line of business, and stored each adapter as a tar.gz file in Amazon S3. Each adapter receives low and irregular traffic. The company wants to serve all 12 adapters at the lowest infrastructure cost and does not want to host a separate copy of the base model for each adapter.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Merge each adapter into the base model weights, and deploy each merged model to the endpoint as its own inference component with its own compute resource requirements.
    - id: b
      text:
        en: |-
          Create 12 SageMaker AI endpoints, one for each line of business, each running a container that loads the base model and one adapter at startup.
    - id: c
      text:
        en: |-
          Create an adapter inference component for each adapter that references the base inference component and the adapter's S3 artifact, and invoke it by name.
    - id: d
      text:
        en: |-
          Register the 12 adapters as versions in one SageMaker Model Registry model package group, and deploy the latest approved version to the existing endpoint.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      An adapter inference component is created with BaseInferenceComponentName pointing to the base model component and Container.ArtifactUrl pointing to the adapter's tar.gz file, without compute resource requirements of its own. When a caller sets InferenceComponentName to the adapter, SageMaker AI loads the adapter into the base component and combines it with the base model, so all adapters share one copy of the base model and its compute.
  options:
    a:
      en: |-
        Merged models are full copies of the base model. Twelve inference components with their own compute reservations multiply the accelerator memory and cost, which is what the company wants to avoid.
    b:
      en: |-
        Twelve endpoints each load the full base model and keep their instances running for low, irregular traffic, which is the most expensive way to serve the adapters.
    d:
      en: |-
        A model package group versions models, but deploying the latest approved version serves only one adapter at a time. The other 11 lines of business would lose their adapters.
references:
  - title: Fine-tune models with adapter inference components - Amazon SageMaker AI
    url: https://docs.aws.amazon.com/sagemaker/latest/dg/realtime-endpoints-adapt.html
