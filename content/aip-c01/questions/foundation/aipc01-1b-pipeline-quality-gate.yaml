id: aipc01-1b-pipeline-quality-gate
objective: "1.2.4"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A team retrains a domain-specific fine-tuned model every month with Amazon SageMaker Pipelines. An evaluation step writes the model's score on a golden dataset to a property file. A new version must be registered in SageMaker Model Registry only if its score meets a threshold. When a reviewer approves a registered version, an existing AWS CodePipeline pipeline that deploys the model must start automatically.

    Which combination of steps will meet these requirements? (Choose two.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Add a ClarifyCheck step after the evaluation step so that versions that fail the threshold are blocked from registration.
    - id: b
      text:
        en: |-
          Add a Condition step that compares the score from the property file with the threshold and runs the model registration step only in its if branch.
    - id: c
      text:
        en: |-
          Configure an S3 event notification on the model artifact bucket that starts the CodePipeline pipeline when a new model.tar.gz file is written.
    - id: d
      text:
        en: |-
          Enable SageMaker Model Monitor on the production endpoint so that it stops the deployment of versions that have not been approved.
    - id: e
      text:
        en: |-
          Create an Amazon EventBridge rule that matches SageMaker Model Package State Change events with an Approved status and targets the CodePipeline pipeline.
answer: { optionIds: [b, e] }
explanation:
  correct:
    en: |-
      A Condition step evaluates a list of conditions, such as a metric read with JsonGet from the evaluation report, and runs the steps of its if branch only when they are true, so registration happens only above the threshold. SageMaker AI sends a SageMaker Model Package State Change event to EventBridge when a model package changes, including its ModelApprovalStatus, so a rule can start the deployment pipeline on approval.
  options:
    a:
      en: |-
        ClarifyCheck relies on SageMaker Clarify, which closed to new customers on July 30, 2026, and it checks bias and explainability baselines rather than comparing a quality score with a threshold.
    c:
      en: |-
        The artifact is written when training ends, before evaluation and approval, so the pipeline would deploy versions that nobody has approved.
    d:
      en: |-
        SageMaker Model Monitor closed to new customers on July 30, 2026, and it monitors data and model quality on an endpoint; it never gated deployments.
references:
  - title: Add a step - Amazon SageMaker AI
    url: https://docs.aws.amazon.com/sagemaker/latest/dg/build-and-manage-steps-types.html
  - title: Events that Amazon SageMaker AI sends to Amazon EventBridge - Amazon SageMaker AI
    url: https://docs.aws.amazon.com/sagemaker/latest/dg/automating-sagemaker-with-eventbridge.html
