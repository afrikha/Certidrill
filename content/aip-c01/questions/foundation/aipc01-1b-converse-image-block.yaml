id: aipc01-1b-converse-image-block
objective: "1.3.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An e-commerce application lets sellers upload product photos in JPEG or PNG format. The application must generate a product description from each photo with a multimodal model in Amazon Bedrock through the Converse API.

    How should the application pass each photo to the model?
body:
  options:
    - id: a
      text:
        en: |-
          Encode the photo in Base64 and append the encoded string to the text block that contains the instruction to describe the product.
    - id: b
      text:
        en: |-
          Add a document block with the format set to jpeg or png that contains the photo, followed by a text block with the instruction.
    - id: c
      text:
        en: |-
          Add an image block with the format set to jpeg or png that contains the photo, together with a text block with the instruction.
    - id: d
      text:
        en: |-
          Upload the photo to Amazon S3, and add the object URL to the system prompt so that the model downloads the photo before answering.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      Converse messages carry a list of content blocks. An image block takes a required format (png, jpeg, gif or webp) and a source that holds the image, and a text block in the same message gives the instruction.
  options:
    a:
      en: |-
        Encoded image data placed in a text block is treated as text tokens, not as an image, so the model cannot see the photo.
    b:
      en: |-
        Document blocks accept document formats such as pdf, csv, doc, docx, xls, xlsx, html, txt and md. Image formats go in image blocks.
    d:
      en: |-
        The model does not fetch URLs from the prompt. Images must be passed in an image block.
references:
  - title: ImageBlock - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/APIReference/API_runtime_ImageBlock.html
  - title: Inference using Converse API - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/conversation-inference.html
