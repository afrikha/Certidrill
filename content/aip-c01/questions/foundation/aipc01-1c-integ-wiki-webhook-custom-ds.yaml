id: aipc01-1c-integ-wiki-webhook-custom-ds
objective: "1.4.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A manufacturing company runs an internal wiki that no Amazon Bedrock connector supports. The wiki can send an HTTPS webhook with the page ID and content each time a page is created, edited, or deleted. The company's customer-managed Amazon Bedrock knowledge base must reflect each change within 2 minutes. The team does not want to maintain an intermediate copy of the wiki.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Add a custom data source, and have an Amazon API Gateway endpoint invoke a Lambda function that calls IngestKnowledgeBaseDocuments or DeleteKnowledgeBaseDocuments for each webhook.
    - id: b
      text:
        en: |-
          Add a custom data source to the knowledge base, and have Amazon EventBridge Scheduler start an ingestion job on that data source every minute to pick up changes.
    - id: c
      text:
        en: |-
          Have a webhook Lambda function write each page to an S3 bucket, configure the bucket as an S3 data source, and run an ingestion job every night.
    - id: d
      text:
        en: |-
          Add a Web Crawler data source to the knowledge base that crawls the wiki's internal URL every 2 minutes by using the credentials of the wiki's service account.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      A custom data source connects a knowledge base to a source that has no connector. Documents are added, updated, and deleted directly with the KnowledgeBaseDocuments operations, inline or from S3, and become part of the data source without any sync, so each webhook is reflected within seconds and no copy of the wiki is kept.
  options:
    b:
      en: |-
        A custom data source does not use ingestion jobs; its documents arrive only through the KnowledgeBaseDocuments operations, so scheduled syncs ingest nothing.
    c:
      en: |-
        This keeps an intermediate copy in S3, and a nightly sync cannot meet the 2-minute requirement.
    d:
      en: |-
        New Web Crawler connectors cannot be created on customer-managed knowledge bases since September 30, 2026.
references:
  - title: "Connect your knowledge base to a custom data source - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/custom-data-source-connector.html
  - title: "Ingest changes directly into a knowledge base - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/kb-direct-ingestion.html
