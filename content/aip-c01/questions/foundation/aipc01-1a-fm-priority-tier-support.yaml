id: aipc01-1a-fm-priority-tier-support
objective: "1.2.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company's customer-facing assistant uses Claude Haiku 4.5 in Amazon Bedrock through a global cross-Region inference profile. A new requirement says that requests during peak hours must be served by the Priority service tier, with no capacity commitment. The architect checks the model's capabilities before changing the application.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Keep Claude Haiku 4.5, and set the service_tier parameter to priority in the requests that are sent during peak hours.
    - id: b
      text:
        en: |-
          Ask the AWS account team to enable the Reserved tier for Claude Haiku 4.5, and keep sending requests with the Standard tier.
    - id: c
      text:
        en: |-
          Keep Claude Haiku 4.5, and set the service_tier parameter to flex in the requests that are sent during peak hours.
    - id: d
      text:
        en: |-
          Shortlist models whose model cards list support for the Priority tier, evaluate them on the assistant's dataset, and switch to one that passes.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      Not all models support every service tier, and the model card says which ones they do. The Claude Haiku 4.5 card lists the Standard and Reserved tiers as supported and the Priority and Flex tiers as not supported, so meeting the requirement means choosing a model that supports Priority and checking its quality first.
  options:
    a:
      en: |-
        The Claude Haiku 4.5 model card lists the Priority tier as not supported, so the requirement cannot be met with this model.
    b:
      en: |-
        The Reserved tier is a 1- or 3-month capacity commitment, which the requirement excludes, and it is not the Priority tier.
    c:
      en: |-
        Flex is a discounted tier for workloads that tolerate longer processing, the opposite of peak-hour priority, and the model card lists it as not supported.
references:
  - title: Claude Haiku 4.5 - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/model-card-anthropic-claude-haiku-4-5.html
  - title: Service tiers for optimizing performance and cost - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/service-tiers-inference.html
