id: aipc01-1c-embed-batch-inference-backfill
objective: "1.5.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company in the us-east-1 Region must generate embeddings for 40 million archived support tickets with Amazon Titan Text Embeddings V2 before loading them into its own vector store. The job is not time-sensitive. The company wants to avoid writing concurrency control, throttling, and retry logic for millions of individual model calls.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Write the tickets as JSONL records with recordId and modelInput fields to Amazon S3, run Amazon Bedrock batch inference jobs with Titan Text Embeddings V2, and load the output vectors.
    - id: b
      text:
        en: |-
          Trigger a Lambda function for each ticket file with S3 event notifications, and call InvokeModel for every ticket with the default SDK retry settings.
    - id: c
      text:
        en: |-
          Purchase one month of Provisioned Throughput for Titan Text Embeddings V2, and call InvokeModel for every ticket from an AWS Glue job.
    - id: d
      text:
        en: |-
          Generate the vectors with an open-source embedding model in a SageMaker AI batch transform job, and embed user questions with Titan Text Embeddings V2.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      Amazon Bedrock batch inference supports Titan Text Embeddings V2 in us-east-1, and AWS positions batch jobs for throughput-oriented indexing. The service reads the JSONL records from S3, processes them asynchronously, and writes the results to S3, so the company does not manage request rates or retries.
  options:
    b:
      en: |-
        Per-ticket InvokeModel calls are exactly the millions of individual calls whose concurrency and throttling the company would have to control.
    c:
      en: |-
        Provisioned Throughput adds a commitment, and the Glue job still has to make and retry millions of individual calls.
    d:
      en: |-
        Vectors from different models are not comparable, so questions embedded with Titan would not match documents embedded with another model.
references:
  - title: "Supported Regions and models for batch inference - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/batch-inference-supported.html
  - title: "Amazon Titan Text Embeddings models - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/titan-embedding-models.html
