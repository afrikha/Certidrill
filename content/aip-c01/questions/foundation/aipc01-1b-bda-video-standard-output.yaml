id: aipc01-1b-bda-video-standard-output
objective: "1.3.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A media company has thousands of training videos in Amazon S3. To build a retrieval index for a GenAI assistant, it needs a summary of each scene, the text that appears on screen, and a classification of the content of each video. The company does not want to orchestrate several AI services or define its own extraction fields, and it wants the LEAST operational overhead.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Run Amazon Rekognition label and text detection and Amazon Transcribe on each video, and combine their outputs into scene summaries with a Step Functions workflow.
    - id: b
      text:
        en: |-
          Process the videos with Amazon Bedrock Data Automation standard output for video, and ingest the results that BDA writes for each video into the index.
    - id: c
      text:
        en: |-
          Create an Amazon Bedrock Data Automation blueprint for video that lists scene summary, on-screen text and category fields, and process each video with it.
    - id: d
      text:
        en: |-
          Extract one frame per second with a Lambda function, and send every frame in an image block to a multimodal model with a prompt that describes the scene.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      Bedrock Data Automation returns standard output, the commonly required information for each data type, when no custom configuration is given. For video, that includes summaries of each scene, text that appears in the video and content classification, through one API with no models or services to orchestrate.
  options:
    a:
      en: |-
        Combining Rekognition, Transcribe and a workflow is the multi-service orchestration that the company wants to avoid, and the scene summaries would still need another model.
    c:
      en: |-
        Blueprints (custom output) are available for documents, audio and images only, not for video, and the company does not want to define its own fields.
    d:
      en: |-
        Sampling frames and calling a model for each one is custom orchestration with high inference cost, and individual frames do not give scene boundaries.
references:
  - title: How Bedrock Data Automation works - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/bda-how-it-works.html
  - title: Transform unstructured data into meaningful insights using Amazon Bedrock Data Automation - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/bda.html
