id: aipc01-1d-adv-hybrid-capable-stores
objective: "1.5.4"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company is designing a customer-managed Amazon Bedrock knowledge base for engineering documents that contain internal component codes. Users must be able to find passages by exact code as well as by meaning, by setting overrideSearchType to HYBRID in the retrieval configuration. Company policy allows only AWS vector stores.

    Which vector stores will support this requirement? (Choose two.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Amazon OpenSearch Serverless, with a filterable text field in the vector index
    - id: b
      text:
        en: |-
          Amazon S3 Vectors, with the chunk text stored as non-filterable metadata
    - id: c
      text:
        en: |-
          Aurora PostgreSQL with pgvector, with an index on the chunks text column
    - id: d
      text:
        en: |-
          Amazon Neptune Analytics, with a vector search index created with the graph
    - id: e
      text:
        en: |-
          Amazon OpenSearch Service managed cluster with a VPC-only domain
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |-
      Knowledge Bases supports hybrid search for Amazon RDS (Aurora PostgreSQL), OpenSearch Serverless, and MongoDB vector stores that contain a filterable text field. On Aurora, the full-text index on the chunks column makes the keyword part possible.
  options:
    b:
      en: |-
        With an S3 vector index, Knowledge Bases runs the query as semantic search even when HYBRID is requested.
    d:
      en: |-
        Neptune Analytics is the GraphRAG store; it is not in the list of stores that support hybrid search in Knowledge Bases.
    e:
      en: |-
        OpenSearch domains behind a VPC are not supported as Knowledge Bases vector stores at all.
references:
  - title: "Configure and customize queries and response generation - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/kb-test-config.html
  - title: "Using Aurora PostgreSQL as a Knowledge Base for Amazon Bedrock - Amazon Aurora"
    url: https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/AuroraPostgreSQL.VectorDB.html
