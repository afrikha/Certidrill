id: aipc01-1a-switch-poll-interval-propagation
objective: "1.2.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    An AWS Lambda function reads the model ID for its Amazon Bedrock calls through the AWS AppConfig Agent Lambda extension. After an operator's AppConfig deployment completes, some invocations keep using the previous model for several minutes while others already use the new one. The team wants new model settings to take effect sooner, without having the function call AppConfig on every invocation.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Lower the poll interval configured for the extension, because each execution environment keeps its own cache and checks for new data only after that interval.
    - id: b
      text:
        en: |-
          Set reserved concurrency on the function so that all invocations share a single extension cache and switch to the new model together.
    - id: c
      text:
        en: |-
          Delete and recreate the AppConfig environment after every deployment so that the extension caches of all execution environments are cleared.
    - id: d
      text:
        en: |-
          Change the deployment strategy to deploy to all targets at once, so that the completed deployment reaches every execution environment immediately.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      Lambda creates a separate execution environment for each level of concurrency, and each one has its own isolated extension cache. The extension checks AppConfig for new data only when the configured poll interval has elapsed since its last retrieval, so a shorter interval shortens the delay without a call on every invocation.
  options:
    b:
      en: |-
        Reserved concurrency limits the number of environments but does not make them share a cache; each environment still refreshes on its own schedule.
    c:
      en: |-
        Recreating the environment is disruptive and does not clear the caches of running execution environments; they still refresh by poll interval.
    d:
      en: |-
        The deployment has already completed, so the strategy is no longer the cause; the remaining delay comes from the cached data and the poll interval.
references:
  - title: Understanding how the AWS AppConfig Agent Lambda extension works - AWS AppConfig
    url: https://docs.aws.amazon.com/appconfig/latest/userguide/appconfig-integration-lambda-extensions-how-it-works.html
