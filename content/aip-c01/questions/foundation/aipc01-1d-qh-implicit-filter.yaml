id: aipc01-1d-qh-implicit-filter
objective: "1.5.5"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    A financial research firm uses an Amazon Bedrock knowledge base of company filings. Each document has the metadata attributes fiscal_year (NUMBER) and sector (STRING). Analysts write questions such as "What supply chain risks did semiconductor companies report for 2025?" The firm wants retrieval restricted to the matching year and sector automatically, without writing code that parses the questions. The firm can use Anthropic Claude models.

    Which steps will meet these requirements? (Choose two.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Set includeForEmbedding to true for fiscal_year and sector in the metadata files and sync the data source.
    - id: b
      text:
        en: |-
          Enable QUERY_DECOMPOSITION so that the year and the sector become separate sub-queries.
    - id: c
      text:
        en: |-
          In the implicit filter configuration, describe fiscal_year and sector in a metadata attribute schema with their keys, types, and descriptions.
    - id: d
      text:
        en: |-
          Write a Lambda function that extracts years and sector names with regular expressions and builds the retrieval filter.
    - id: e
      text:
        en: |-
          In the implicit filter configuration, specify the ARN of an Anthropic Claude model to generate the filter.
answer: { optionIds: [ c, e ] }
explanation:
  correct:
    en: |-
      With implicit filtering, Knowledge Bases uses a model to generate a retrieval filter from the user query and a metadata schema that you describe (key, type, description). The configuration takes the metadata attribute schemas and the ARN of the model; implicit filtering is supported by Anthropic Claude models.
  options:
    a:
      en: |-
        includeForEmbedding only adds the attributes to the embedded text, which influences similarity but does not restrict results to the requested year and sector.
    b:
      en: |-
        Sub-queries still search the whole corpus; decomposition does not apply metadata filters.
    d:
      en: |-
        A parsing Lambda function is exactly the custom code the firm wants to avoid, and regular expressions break on varied phrasing.
references:
  - title: "Configure and customize queries and response generation - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/kb-test-config.html
