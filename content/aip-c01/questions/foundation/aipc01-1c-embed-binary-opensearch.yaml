id: aipc01-1c-embed-binary-opensearch
objective: "1.5.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company runs semantic search over 500 million chunks on an Amazon OpenSearch Service managed cluster, version 2.17, that is the vector store of an Amazon Bedrock knowledge base. The chunks are embedded with Amazon Titan Text Embeddings V2 at 1,024 float dimensions. The company must cut vector storage and memory by more than 90 percent and accepts some loss of accuracy.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Re-embed the chunks with Titan Text Embeddings V2 at 256 float dimensions into a new index and knowledge base on the same cluster.
    - id: b
      text:
        en: |-
          Move the vectors to an Amazon S3 Vectors index, and store binary embeddings from Titan Text Embeddings V2 there.
    - id: c
      text:
        en: |-
          Create a new knowledge base and index that use binary embeddings from Titan Text Embeddings V2, with a faiss HNSW field that uses the hamming space type.
    - id: d
      text:
        en: |-
          Re-embed the chunks with Amazon Titan Embeddings G1 - Text into a new index, because it produces smaller vectors than Titan Text Embeddings V2.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      Titan Text Embeddings V2 can return binary embeddings, which store one bit per dimension instead of a 32-bit float, a reduction of about 97 percent. OpenSearch managed clusters at version 2.16 or later support binary vectors for knowledge bases, with the faiss engine and the hamming space type.
  options:
    a:
      en: |-
        Going from 1,024 to 256 float dimensions cuts storage by 75 percent, which does not reach the required 90 percent.
    b:
      en: |-
        Amazon S3 Vectors supports only floating-point embeddings; binary embeddings are not supported.
    d:
      en: |-
        Titan Embeddings G1 - Text produces 1,536-dimension float vectors, which are larger, not smaller.
references:
  - title: "Prerequisites for using a vector store you created for a knowledge base - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/knowledge-base-setup.html
  - title: "Supported models and Regions for Amazon Bedrock knowledge bases - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/knowledge-base-supported.html
