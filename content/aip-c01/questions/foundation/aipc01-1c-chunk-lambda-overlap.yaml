id: aipc01-1c-chunk-lambda-overlap
objective: "1.5.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company built its own RAG pipeline on Aurora PostgreSQL with pgvector. A Lambda function triggered by S3 uploads splits each document into 400-token chunks with no overlap, embeds each chunk with Amazon Titan Text Embeddings V2 at 1,024 dimensions, and inserts the vectors. Evaluation shows that answers fail when a key fact spans the boundary between two chunks.

    Which change will address this issue with the LEAST impact on cost?
body:
  options:
    - id: a
      text:
        en: |-
          Reduce the chunk size to 100 tokens so that each fact is more likely to fit within a single chunk.
    - id: b
      text:
        en: |-
          Embed each document as a single chunk, because Titan Text Embeddings V2 accepts input of any length.
    - id: c
      text:
        en: |-
          Re-create the table with 2,048-dimension vectors so that each embedding captures more of the text around the boundary.
    - id: d
      text:
        en: |-
          Add an overlap of about 60 tokens between consecutive chunks in the Lambda function.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      Overlap repeats the end of each chunk at the start of the next, so a fact that crosses a boundary appears whole in at least one chunk. It adds only a small amount of extra text to embed and store, which keeps the cost impact low.
  options:
    a:
      en: |-
        Smaller chunks create more boundaries, so more facts are split, and the number of chunks to embed grows.
    b:
      en: |-
        Titan Text Embeddings V2 accepts at most 8,192 tokens or 50,000 characters, and AWS recommends splitting long documents into logical units for retrieval.
    c:
      en: |-
        Titan Text Embeddings V2 outputs 1,024, 512, or 256 dimensions; dimensions do not add text that is missing from a chunk.
references:
  - title: "Amazon Titan Text Embeddings models - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/titan-embedding-models.html
  - title: "How content chunking works for knowledge bases - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/kb-chunking.html
