id: aipc01-1a-switch-appconfig-ai-prompt
objective: "1.2.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Three GenAI applications of a company share the same brand-voice system prompt, and each application already keeps its model settings in its own AWS AppConfig AI model invocation configuration. Prompt engineers revise the brand prompt every week. Each revision must be rolled out gradually with automatic rollback on a CloudWatch alarm, must be reused by all three applications, and must not require editing the applications' model configurations or redeploying code.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Copy the revised prompt into the messages of each application's AI model invocation configuration every week, and deploy the three configurations separately.
    - id: b
      text:
        en: |-
          Store the brand prompt in a shared AWS Lambda layer, and publish a new layer version that the three applications' functions use after each revision.
    - id: c
      text:
        en: |-
          Store the brand prompt in an Amazon S3 object that the three applications read at startup, and overwrite the object after each revision.
    - id: d
      text:
        en: |-
          Manage the brand prompt as an AWS AppConfig AI prompt configuration used by the three applications, and deploy each version with a gradual strategy and an alarm.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      AppConfig AI prompt configurations store prompts as separately versioned artifacts, so a prompt can be updated without changing the model configuration and reused across several applications. Deployments keep AppConfig's gradual rollout and roll back automatically when a CloudWatch alarm fires.
  options:
    a:
      en: |-
        Copying the prompt edits three model configurations every week, which the requirement excludes, and the copies can drift apart.
    b:
      en: |-
        A new layer version must be attached to each function and deployed, and it has no gradual rollout or alarm-based rollback.
    c:
      en: |-
        Overwriting an object reaches all readers at once, offers no automatic rollback, and running instances keep the old prompt until they restart.
references:
  - title: AWS AppConfig launches support for managing native AI model and AI prompt configuration
    url: https://aws.amazon.com/about-aws/whats-new/2026/11/aws-appconfig-native-ai-model-invocation-prompt-configurations/
