id: aipc01-1e-request-metadata-chargeback
objective: "1.6.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A software company offers a generative AI writing feature to 300 tenants. A shared AWS Lambda function calls the Amazon Bedrock Converse API with prompt versions from Prompt Management, and new prompt versions are released every week. Finance needs a monthly report of input and output tokens for each tenant and each prompt version. Onboarding a tenant or releasing a prompt version must not require new AWS resources, and the solution must have the LEAST operational overhead.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Send the tenant ID and the prompt version in requestMetadata on each Converse call, log invocations to CloudWatch Logs, and sum the tokens with Logs Insights.
    - id: b
      text:
        en: |-
          Create one application inference profile with a cost allocation tag for each tenant, and use the tenant's profile as the model of a prompt variant for that tenant.
    - id: c
      text:
        en: |-
          Build a CloudWatch dashboard from the AWS/Bedrock InputTokenCount and OutputTokenCount metrics, and split the totals by tenant and prompt version with metric math.
    - id: d
      text:
        en: |-
          Call the CountTokens API before each invocation, and write the returned token count with the tenant ID and the prompt version to an Amazon DynamoDB table.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      requestMetadata accepts up to 16 key-value pairs per Converse call and is the only caller-supplied field of a model invocation log entry; it is allowed when modelId is a prompt version ARN. Each log entry also holds the input and output token counts, so one Logs Insights query grouped by tenant and prompt version produces the report. New tenants and versions only change the metadata values.
  options:
    b:
      en: |-
        Inference profiles track usage per profile, so every new tenant needs a new profile and prompt variant, and the profile cannot separate usage by prompt version.
    c:
      en: |-
        The AWS/Bedrock runtime metrics are aggregated by model and have no tenant or prompt version dimension, and metric math cannot recreate one.
    d:
      en: |-
        CountTokens returns only the input token count of a request, so output tokens would be missing, and it adds an extra call to every invocation.
references:
  - title: "Converse - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/APIReference/API_runtime_Converse.html
  - title: "Monitor model invocation using CloudWatch Logs and Amazon S3 - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/model-invocation-logging.html
