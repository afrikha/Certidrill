id: aipc01-1d-vs-quick-create-semantic
objective: "1.5.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A consulting company wants a RAG assistant over 20,000 long research reports stored in Amazon S3. Tests showed that the reports need semantic chunking. The company has no existing vector database and does not want to create indexes, field mappings, or access policies for one itself.

    Which solution will meet these requirements with the LEAST operational overhead?
body:
  options:
    - id: a
      text:
        en: |-
          Create an Amazon Bedrock Managed Knowledge Base with an S3 data source and its built-in chunking.
    - id: b
      text:
        en: |-
          Create an OpenSearch Serverless collection, vector index, and data access policy manually, and then create a customer-managed knowledge base with semantic chunking that uses it.
    - id: c
      text:
        en: |-
          Create a customer-managed knowledge base, choose the option to quick create a new vector store with OpenSearch Serverless, and select semantic chunking for the data source.
    - id: d
      text:
        en: |-
          Create an OpenSearch Service domain with an ingest pipeline that calls Amazon Bedrock, and a Lambda function that splits the reports by topic before indexing.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      Semantic chunking is available on customer-managed knowledge bases. With the quick create option, Knowledge Bases creates the OpenSearch Serverless vector search collection and index and configures the required fields, so the team configures only the knowledge base and its chunking strategy.
  options:
    a:
      en: |-
        A Managed Knowledge Base offers only built-in (default) or fixed-size chunking, so it cannot apply semantic chunking.
    b:
      en: |-
        This meets the chunking requirement, but creating the collection, index, mappings, and policies by hand is the work the company wants to avoid.
    d:
      en: |-
        A self-built OpenSearch pipeline with custom splitting code is the highest operational overhead of the options.
references:
  - title: "Create a knowledge base by connecting to a data source in Amazon Bedrock Knowledge Bases - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/knowledge-base-create.html
  - title: "Build a managed knowledge base - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/kb-build-managed.html
