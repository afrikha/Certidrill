id: aipc01-1a-fm-cheapest-above-bar
objective: "1.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company must choose a foundation model in Amazon Bedrock to classify support tickets into 14 categories. The business requires at least 92 % accuracy on the company's own labeled tickets, and the volume will be 3 million tickets per month. Four candidate models are available in the company's Region.

    Which approach will select the MOST cost-effective model that meets the requirement?
body:
  options:
    - id: a
      text:
        en: |-
          Choose the model with the highest score on public leaderboards, because it will exceed the accuracy requirement on any dataset.
    - id: b
      text:
        en: |-
          Choose the model with the lowest price per input token, and add instructions to the prompt until the accuracy seems sufficient.
    - id: c
      text:
        en: |-
          Evaluate the four models on the same set of labeled tickets, and choose the model with the highest accuracy regardless of its token price.
    - id: d
      text:
        en: |-
          Evaluate the four models on the same set of labeled tickets, keep those at or above 92 % accuracy, and choose the one with the lowest projected monthly cost.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      An evaluation on the company's own labeled tickets, such as an automatic evaluation job with the text classification task type and a custom dataset, measures each model against the real requirement. Filtering on the 92 % bar first and then comparing projected token costs at 3 million tickets per month selects the cheapest model that qualifies.
  options:
    a:
      en: |-
        Public leaderboards rank general ability, not accuracy on these 14 categories, and the top model is rarely the cheapest that qualifies.
    b:
      en: |-
        Starting from price alone skips measurement; "seems sufficient" is not evidence of 92 % accuracy, and longer prompts raise the cost per ticket.
    c:
      en: |-
        Picking the most accurate model ignores cost; a cheaper model that also meets 92 % is the more cost-effective choice.
references:
  - title: Model evaluation task types in Amazon Bedrock - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/model-evaluation-tasks.html
  - title: Evaluate the performance of Amazon Bedrock resources - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/evaluation.html
