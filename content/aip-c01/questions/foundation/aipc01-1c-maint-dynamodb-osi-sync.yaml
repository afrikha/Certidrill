id: aipc01-1c-maint-dynamodb-osi-sync
objective: "1.4.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An e-commerce company keeps its product catalog in an Amazon DynamoDB table. An Amazon OpenSearch Service index has a default ingest pipeline that embeds the description field with an Amazon Bedrock embedding model whenever a document is indexed. The product search assistant must reflect catalog inserts, updates, and deletes within minutes, starting from a full copy of the current table. The company wants the LEAST operational overhead.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Create an Amazon OpenSearch Ingestion pipeline with the table as its source, using an export for the initial copy and DynamoDB Streams for changes, and the index as its sink.
    - id: b
      text:
        en: |-
          Run an AWS Glue job every hour that scans the whole table and bulk indexes every item into the OpenSearch Service index through its ingest pipeline.
    - id: c
      text:
        en: |-
          Create a DynamoDB vector index on the table, and register the table as the vector store of an Amazon Bedrock knowledge base.
    - id: d
      text:
        en: |-
          Write a Lambda function triggered by DynamoDB Streams that converts each change into an OpenSearch request, and run a separate script for the initial load.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      An OpenSearch Ingestion pipeline with a DynamoDB source loads a point-in-time export of the table and then applies every change from DynamoDB Streams, mapping inserts, updates, and deletes to the matching OpenSearch operations. It is managed, needs no custom code, and the index's ingest pipeline still embeds each description.
  options:
    b:
      en: |-
        Hourly full scans are not within minutes, they re-index unchanged items, and they do not remove deleted items.
    c:
      en: |-
        DynamoDB vector search is not a supported vector store for Amazon Bedrock knowledge bases, and it would bypass the existing OpenSearch index.
    d:
      en: |-
        This works but needs custom code for changes, deletes, retries, and the initial load, which is more overhead than a managed pipeline.
references:
  - title: "Using an OpenSearch Ingestion pipeline with Amazon DynamoDB"
    url: https://docs.aws.amazon.com/opensearch-service/latest/developerguide/configure-client-ddb.html
  - title: "Prerequisites for using a vector store you created for a knowledge base - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/knowledge-base-setup.html
