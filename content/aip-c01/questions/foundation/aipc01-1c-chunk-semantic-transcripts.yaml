id: aipc01-1c-chunk-semantic-transcripts
objective: "1.5.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A media monitoring company indexes transcripts of 2-hour radio programs in an Amazon Bedrock knowledge base. Topics change every few minutes without headings, and fixed-size chunks often mix the end of one story with the start of the next, which confuses the model. The company accepts higher ingestion costs to get chunks that each cover one topic.

    Which chunking strategy should the company use?
body:
  options:
    - id: a
      text:
        en: |-
          Semantic chunking
    - id: b
      text:
        en: |-
          Hierarchical chunking with 1,500-token parent chunks and 300-token child chunks
    - id: c
      text:
        en: |-
          Fixed-size chunking with 50 percent overlap
    - id: d
      text:
        en: |-
          No chunking
answer: { optionId: a }
explanation:
  correct:
    en: |-
      Semantic chunking compares the meaning of consecutive sentences and splits where it changes, so chunk boundaries follow topic changes even without headings. It uses a foundation model during ingestion, which adds cost that the company accepts.
  options:
    b:
      en: |-
        Hierarchical chunking splits by token counts at two levels; its parent and child boundaries can still fall in the middle of a story.
    c:
      en: |-
        Overlap repeats text across boundaries, but fixed-size boundaries still ignore topic changes, so chunks keep mixing stories.
    d:
      en: |-
        A whole 2-hour transcript as one chunk mixes every topic of the program.
references:
  - title: "How content chunking works for knowledge bases - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/kb-chunking.html
