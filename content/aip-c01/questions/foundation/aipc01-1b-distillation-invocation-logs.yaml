id: aipc01-1b-distillation-invocation-logs
objective: "1.2.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company uses a large foundation model in Amazon Bedrock for an in-app product question-answering feature. The answer quality is good, but the latency and the cost per request are too high for the expected growth. Model invocation logging has stored six months of the large model's prompts and responses in Amazon S3. The company wants a smaller and faster model that keeps the large model's quality on this use case, with the least effort to create training data.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Ask subject matter experts to write 5,000 labeled prompt and response pairs, and run a supervised fine-tuning job on a smaller model.
    - id: b
      text:
        en: |-
          Add prompt caching checkpoints to the large model's requests so that repeated prompt prefixes are read from the cache.
    - id: c
      text:
        en: |-
          Run a reinforcement fine-tuning job on the large model with Lambda reward functions that score the quality of its answers.
    - id: d
      text:
        en: |-
          Run an Amazon Bedrock Model Distillation job with the large model as the teacher, a smaller model as the student, and the invocation logs as input.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      Distillation transfers the knowledge of a larger teacher model to a smaller, faster and cheaper student model for a specific use case. Bedrock can reuse the teacher's responses that are stored in invocation logs, provided the teacher in the job is the model that produced those logs, so no labeled data has to be written.
  options:
    a:
      en: |-
        Supervised fine-tuning could produce a smaller model, but writing thousands of labeled pairs is the most labor-intensive way to create training data when the teacher's responses already exist.
    b:
      en: |-
        Prompt caching lowers the cost and latency of repeated prompt prefixes, but the requests still run on the large model, so the company does not get a smaller model.
    c:
      en: |-
        Reinforcement fine-tuning improves the response quality of the model it trains. Training the large model leaves its size, latency and cost unchanged.
references:
  - title: Customize a model with distillation in Amazon Bedrock - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/model-distillation.html
  - title: Customize your model to improve its performance for your use case - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/custom-models.html
