id: aipc01-1b-multimodal-claims-pipeline
objective: "1.3.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    An insurance company receives thousands of claim files each day in an S3 bucket: PDF claim forms, photos of the damage and MP3 voice memos from customers. An AWS Step Functions workflow must convert every file into text or structured fields before a foundation model assesses the claim. The files must be processed in parallel, and the company wants the least custom code.

    Which combination of steps will meet these requirements? (Choose two.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Write one Lambda function that bundles OCR, image analysis and speech recognition libraries and converts every type of file.
    - id: b
      text:
        en: |-
          Use a Distributed Map state that iterates over the S3 objects, with a Choice state inside it that routes each file by its type.
    - id: c
      text:
        en: |-
          Call Amazon Comprehend entity detection directly on the photos and voice memos to extract the claim fields.
    - id: d
      text:
        en: |-
          Process the files with an Amazon Bedrock Data Automation project that has a blueprint for claim forms and standard output for images and audio.
    - id: e
      text:
        en: |-
          Pack each claim's form, photos and voice memo into one Converse document block per claim and send it to the model.
answer: { optionIds: [b, d] }
explanation:
  correct:
    en: |-
      A Distributed Map state runs child workflows in parallel over the objects in an S3 location, and a Choice state sends each file to the right processing path. Bedrock Data Automation handles documents, images and audio through one API: a project can combine a blueprint for the claim form with standard output, such as audio transcripts, for the other files.
  options:
    a:
      en: |-
        A function that bundles and maintains OCR, vision and speech libraries is the most custom code of all the options, and the company would have to maintain every library itself.
    c:
      en: |-
        Comprehend analyzes text. It cannot read images or audio files.
    e:
      en: |-
        Document blocks accept document formats only. Photos and MP3 files cannot be sent as documents.
references:
  - title: How Bedrock Data Automation works - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/bda-how-it-works.html
  - title: DocumentBlock - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/APIReference/API_runtime_DocumentBlock.html
