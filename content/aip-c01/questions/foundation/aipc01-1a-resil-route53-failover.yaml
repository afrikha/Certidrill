id: aipc01-1a-resil-route53-failover
objective: "1.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company's claims assistant runs in eu-west-1 behind an Application Load Balancer, with Amazon ECS services that call Amazon Bedrock in the same Region. Regulations also allow processing in eu-central-1. The company needs the assistant to keep working if eu-west-1 becomes impaired, and traffic must return to eu-west-1 automatically when it is healthy again.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Configure the ECS services in eu-west-1 to call Bedrock in eu-central-1 whenever their error rate exceeds a threshold.
    - id: b
      text:
        en: |-
          Increase the desired count of the ECS services in eu-west-1, and spread the tasks across three Availability Zones.
    - id: c
      text:
        en: |-
          Create Route 53 latency-based records for the eu-west-1 load balancer only, and associate a health check with the Bedrock endpoint.
    - id: d
      text:
        en: |-
          Deploy the stack in eu-central-1 too, and create Route 53 failover alias records with eu-west-1 as primary and Evaluate Target Health enabled.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      With the failover routing policy, Route 53 answers with the primary record while it is healthy and with the secondary record only when the primary is unhealthy. Alias records to the load balancers use Evaluate Target Health, so traffic moves to eu-central-1 during an impairment and returns to eu-west-1 automatically when it is healthy.
  options:
    a:
      en: |-
        The load balancer and ECS services still run only in eu-west-1, so a Regional impairment takes down the entry point itself.
    b:
      en: |-
        More tasks across Availability Zones protect against a zone failure, not against an impairment of the whole Region.
    c:
      en: |-
        Records for one Region give Route 53 nothing to fail over to.
references:
  - title: Active-active and active-passive failover - Amazon Route 53
    url: https://docs.aws.amazon.com/Route53/latest/DeveloperGuide/dns-failover-types.html
