id: aipc01-1e-feedback-loop
objective: "1.6.5"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    A telecom company's support assistant lets users rate each answer with a thumbs-up or a thumbs-down. An AWS Lambda validator also flags answers that break formatting rules. The prompt engineers want a repeatable process that turns these signals into better prompts without risking regressions in production.

    Which combination of steps will meet these requirements? (Choose two.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Fine-tune the model every week on all the answers that received a thumbs-down so that the model learns to avoid producing them again.
    - id: b
      text:
        en: |-
          Store each rating and validator result with the request ID and prompt version, and review grouped failures to write a revised prompt draft.
    - id: c
      text:
        en: |-
          Run prompt optimization every night, and replace the production prompt automatically with the optimized variant that the optimizer returns.
    - id: d
      text:
        en: |-
          Add representative failed cases with corrected answers to the golden dataset, and version the revised draft only if it passes regression tests.
    - id: e
      text:
        en: |-
          Raise the temperature of the production prompt whenever the thumbs-down rate rises so that the model tries more varied answers for users.
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |-
      A feedback loop links each signal to the prompt version and request that produced it, groups the failures, and turns them into a revised draft. Adding the failed cases with corrected reference answers to the golden dataset makes the regression evaluation cover them, and releasing a version only when it passes prevents regressions.
  options:
    a:
      en: |-
        Training on answers that users rejected teaches the model to produce them, and model customization is not a prompt refinement loop.
    c:
      en: |-
        Prompt optimization is a heuristic rewrite that uses no evaluation data, so replacing production automatically skips any regression check.
    e:
      en: |-
        More randomness does not fix the causes of the failures and makes answers less predictable.
references:
  - title: "Evaluate model performance using another LLM as a judge - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/evaluation-judge.html
  - title: "Monitor model invocation using CloudWatch Logs and Amazon S3 - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/model-invocation-logging.html
