id: aipc01-1d-ctx-comprehend-intent
objective: "1.6.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A telecommunications company routes each customer message to one of 12 specialized prompt flows, such as billing, roaming, or device support. The company has 50,000 historical messages labeled with the correct flow. It wants to train a classifier on this data without managing training or hosting infrastructure, and to classify each message synchronously when it arrives.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Call Amazon Comprehend DetectSentiment on each message and map each returned sentiment value to one of the flows.
    - id: b
      text:
        en: |-
          Label additional messages with Amazon SageMaker Ground Truth and train a classifier on a SageMaker AI endpoint.
    - id: c
      text:
        en: |-
          Train an Amazon Comprehend custom classifier on the labeled messages and classify each new message in real time.
    - id: d
      text:
        en: |-
          Run an Amazon Comprehend topic modeling job on the messages each hour and route each message by its detected topic.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      Amazon Comprehend custom classification trains a classifier on the company's own labeled examples, and it can classify a single document synchronously in real time, so each message is routed to its flow without ML infrastructure to manage.
  options:
    a:
      en: |-
        Sentiment detection returns positive, negative, neutral, or mixed; it cannot distinguish 12 business intents.
    b:
      en: |-
        Ground Truth has been closed to new customers since July 30, 2026, and training and hosting on SageMaker AI is the infrastructure the company wants to avoid.
    d:
      en: |-
        Topic modeling is an asynchronous, unsupervised job that ignores the labels, and it is no longer available to new customers.
references:
  - title: "Custom classification - Amazon Comprehend"
    url: https://docs.aws.amazon.com/comprehend/latest/dg/how-document-classification.html
