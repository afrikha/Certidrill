id: aipc01-1c-perf-two-level-index
objective: "1.4.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A research firm stores 2 million long analyst reports as about 400 million chunk embeddings in one Amazon OpenSearch Service vector index. Most questions concern one or two reports, but a flat k-NN search over all chunks returns passages scattered across loosely related reports, and latency is high. The firm wants more precise passages and lower latency.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Keep the flat index, and raise k to 10,000 so that the relevant passages are always among the candidates sent to the model.
    - id: b
      text:
        en: |-
          Keep the flat index, and add a post_filter on report ID after the k-NN query so that only chunks from the expected reports are returned.
    - id: c
      text:
        en: |-
          Replace the HNSW query with an exact script_score search so that every chunk is compared with the question.
    - id: d
      text:
        en: |-
          Add an index with one summary embedding per report, search it first to select the top reports, then run the chunk k-NN query filtered to those report IDs.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      Hierarchical indexing searches a small, coarse level first (one summary vector per report) to find the relevant reports, then searches the fine level (chunks) only within them by using a filter in the k-NN query. Both searches are smaller than a flat search over 400 million chunks, and the passages come from the right reports.
  options:
    a:
      en: |-
        k is capped at 10,000, and sending thousands of loosely related chunks raises latency and adds noise rather than precision.
    b:
      en: |-
        A post_filter is applied after the k nearest neighbors are found, so it can return fewer than k results, and the application has no way to know the expected reports in advance.
    c:
      en: |-
        An exact search compares the question with all 400 million vectors, which is far slower than an approximate HNSW search.
references:
  - title: "k-Nearest Neighbor (k-NN) search in Amazon OpenSearch Service - Amazon OpenSearch Service"
    url: https://docs.aws.amazon.com/opensearch-service/latest/developerguide/knn.html
  - title: "Working with vector search collections - Amazon OpenSearch Service"
    url: https://docs.aws.amazon.com/opensearch-service/latest/developerguide/serverless-vector-search.html
