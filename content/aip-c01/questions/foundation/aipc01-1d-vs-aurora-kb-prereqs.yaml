id: aipc01-1d-vs-aurora-kb-prereqs
objective: "1.5.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A retail company runs an Aurora PostgreSQL 16 DB cluster that holds its product catalog and has the pgvector 0.8.0 extension enabled. The company wants to use this cluster as the vector store of a customer-managed Amazon Bedrock knowledge base, so that analysts can join retrieved chunks with catalog tables in SQL. The team has created the bedrock_integration schema, the table, and the required indexes. The knowledge base and the cluster are in the same AWS account.

    Which actions must the team complete before it creates the knowledge base? (Choose two.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Enable IAM database authentication and grant the knowledge base service role the rds-db:connect permission instead of a password.
    - id: b
      text:
        en: |-
          Enable the RDS Data API on the Aurora DB cluster.
    - id: c
      text:
        en: |-
          Create an Amazon RDS Proxy for the cluster and register the proxy endpoint as the knowledge base vector store.
    - id: d
      text:
        en: |-
          Store the credentials of the database user that Amazon Bedrock uses in an AWS Secrets Manager secret.
    - id: e
      text:
        en: |-
          Make the cluster publicly accessible so that Amazon Bedrock can reach the database endpoint.
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |-
      Amazon Bedrock reaches an Aurora vector store through the RDS Data API, so the Data API must be enabled on the cluster. The knowledge base authenticates with a database user whose credentials are kept in AWS Secrets Manager; the secret ARN is part of the storage configuration, together with the cluster ARN, database name, table name, and field mapping.
  options:
    a:
      en: |-
        The knowledge base storage configuration takes a Secrets Manager secret ARN for the database credentials; IAM database authentication is not the documented mechanism.
    c:
      en: |-
        The knowledge base is configured with the DB cluster ARN and uses the Data API, not a proxy endpoint.
    e:
      en: |-
        Public accessibility is not required: Bedrock connects through the RDS Data API, and exposing the database publicly only widens the attack surface.
references:
  - title: "Using Aurora PostgreSQL as a Knowledge Base for Amazon Bedrock - Amazon Aurora"
    url: https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/AuroraPostgreSQL.VectorDB.html
  - title: "Prerequisites for using a vector store you created for a knowledge base - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/knowledge-base-setup.html
