id: aipc01-1b-glue-dq-catalog-monitoring
objective: "1.3.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A team of data stewards who do not write code is responsible for 40 tables in the AWS Glue Data Catalog that feed a retrieval-augmented generation (RAG) pipeline. The stewards want to start from data quality rules that are generated automatically from the data, evaluate the tables on a schedule, and cover tables that are added to the database later. The company wants the LEAST effort.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Write an AWS Glue ETL script for each table that runs the EvaluateDataQuality transform, and schedule the scripts with AWS Step Functions.
    - id: b
      text:
        en: |-
          Create a Data Wrangler data flow in Amazon SageMaker Canvas for each table, and generate a Data Quality and Insights Report every week.
    - id: c
      text:
        en: |-
          Use AWS Glue Data Quality on the Data Catalog to recommend rules, and configure database-level data quality monitoring that evaluates the tables on a schedule.
    - id: d
      text:
        en: |-
          Create Amazon CloudWatch Synthetics canaries that run Amazon Athena queries against each table and alarm when a query returns unexpected results.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      AWS Glue Data Quality on the Data Catalog is aimed at non-coders: Recommend rules analyzes the data and creates DQDL rules, and evaluation configurations at the catalog or database level schedule the runs and monitor every table in scope, including tables added later, from one configuration.
  options:
    a:
      en: |-
        ETL scripts and Step Functions schedules are code that the stewards would have to write and maintain for 40 tables, and rule recommendations are not available in ETL jobs.
    b:
      en: |-
        A Data Quality and Insights Report is generated for each data flow that someone builds. It does not monitor a database on a schedule or pick up new tables automatically.
    d:
      en: |-
        Canaries that run hand-written queries are custom checks to build and maintain for each table, with no generated rules.
references:
  - title: AWS Glue Data Quality - AWS Glue
    url: https://docs.aws.amazon.com/glue/latest/dg/glue-data-quality.html
