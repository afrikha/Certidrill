id: aipc01-1a-switch-api-facade
objective: "1.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A bank's mobile app currently calls a third-party model provider's API directly, with credentials embedded in the app. The bank wants to move to Amazon Bedrock now and keep the option to change models later without publishing a new version of the app.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Embed AWS credentials in the app, and call the Amazon Bedrock Converse API directly with the model ID compiled into the app.
    - id: b
      text:
        en: |-
          Store the model ID in a settings file inside the app package, and publish an app update whenever the model changes.
    - id: c
      text:
        en: |-
          Have the app call the Amazon Bedrock InvokeModel API directly with temporary credentials and the request format of the current model.
    - id: d
      text:
        en: |-
          Put an Amazon API Gateway API in front of an AWS Lambda function that calls Bedrock, and keep the model ID in backend configuration.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      A backend façade gives the app a stable API that never exposes the model. The Lambda function calls Bedrock, for example with the Converse API whose request shape is the same across models, and reads the model ID from configuration such as AWS AppConfig, so a model change happens in the backend only.
  options:
    a:
      en: |-
        A compiled model ID requires an app release to change, and embedding long-term credentials in an app is insecure.
    b:
      en: |-
        A setting inside the app package still requires publishing a new app version for every change.
    c:
      en: |-
        Calling Bedrock directly binds the app to the current model's request format, so a model change still needs an app release.
references:
  - title: Inference using Converse API - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/conversation-inference.html
