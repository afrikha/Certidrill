id: aipc01-1b-opensearch-neural-bedrock
objective: "1.4.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company runs keyword search over product manuals on a public Amazon OpenSearch Service domain (version 2.17, fine-grained access control enabled), with one index per product line. Existing applications and ingestion jobs use these indexes. The company wants to add semantic search in which the domain itself calls an Amazon Titan Text Embeddings model in Amazon Bedrock to embed documents at ingestion and queries at search time. The company wants the least custom code.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Create a customer-managed Bedrock knowledge base that uses the domain as its vector store, and sync the manuals into a new knowledge base index.
    - id: b
      text:
        en: |-
          Deploy the OpenSearch integration template for Titan Text Embeddings, map its role to ml_full_access, and use the Bedrock connector for ingest and queries.
    - id: c
      text:
        en: |-
          Write a Lambda function that calls the Bedrock embedding model for each document and query, and writes the vectors to knn_vector fields in the indexes.
    - id: d
      text:
        en: |-
          Export the manuals to an Amazon S3 Vectors index, and use its hybrid search to combine keyword and similarity queries in the applications.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      For domains on version 2.9 or later with fine-grained access control, the CloudFormation integration template for Titan Text Embeddings creates a role and a Lambda function that has the domain create an ML Commons connector to Bedrock; the role is mapped to ml_full_access. The domain can then call the model itself for ingest-time and query-time embeddings on the existing per-product indexes.
  options:
    a:
      en: |-
        A knowledge base computes the embeddings in Bedrock during its own sync and writes them to its own index, so it neither adds semantic search to the existing indexes nor has the domain call the model.
    c:
      en: |-
        A Lambda function in front of every write and query is custom code, and the domain would not call the model itself.
    d:
      en: |-
        Moving to S3 Vectors abandons the domain that the existing applications and ingestion jobs depend on.
references:
  - title: Using CloudFormation to set up remote inference for semantic search - Amazon OpenSearch Service
    url: https://docs.aws.amazon.com/opensearch-service/latest/developerguide/cfn-template.html
  - title: Amazon Bedrock templates - Amazon OpenSearch Service
    url: https://docs.aws.amazon.com/opensearch-service/latest/developerguide/cfn-template-bedrock.html
