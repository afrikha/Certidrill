id: aipc01-1c-embed-managed-kb-custom-model
objective: "1.5.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company is creating an Amazon Bedrock Managed Knowledge Base for its SharePoint content. The data science team validated Amazon Titan Text Embeddings V2 on the company's queries and requires the knowledge base to use it instead of the built-in embedding model. Retrieval results must also be reranked before they reach the generation model.

    Which configuration will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Configure Titan Text Embeddings V2 with 1,024 float32 dimensions, and rely on the built-in managed reranker of the knowledge base.
    - id: b
      text:
        en: |-
          Configure Titan Text Embeddings V2 with 512 float32 dimensions, and rely on the built-in managed reranker of the knowledge base.
    - id: c
      text:
        en: |-
          Configure Titan Text Embeddings V2 with 1,024-dimension binary vectors, and specify an Amazon Bedrock reranker model in retrieval requests.
    - id: d
      text:
        en: |-
          Configure Titan Text Embeddings V2 with 1,024 float32 dimensions, and specify an Amazon Bedrock reranker model in retrieval requests.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      A managed knowledge base accepts a custom Bedrock embedding model only with 1,024 dimensions and the float32 data type. Choosing a custom embedding model disables the built-in managed reranker, so reranking must come from a Bedrock reranker model chosen at query time.
  options:
    a:
      en: |-
        The dimensions are valid, but the managed reranker is not used when a custom embedding model is configured.
    b:
      en: |-
        A custom embedding model for a managed knowledge base must produce 1,024 dimensions, and the managed reranker would be disabled anyway.
    c:
      en: |-
        A managed knowledge base requires the float32 data type for a custom embedding model, so binary vectors are not accepted.
references:
  - title: "Create a managed knowledge base - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/kb-managed-create.html
  - title: "Build a managed knowledge base - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/kb-build-managed.html
