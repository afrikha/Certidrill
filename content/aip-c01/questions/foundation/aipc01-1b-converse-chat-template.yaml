id: aipc01-1b-converse-chat-template
objective: "1.3.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A team calls a Meta Llama model in Amazon Bedrock with InvokeModel. To build multi-turn chats, the application concatenates the earlier turns as "User: ..." and "Assistant: ..." lines in a single prompt string. The model sometimes keeps writing after its answer and invents the user's next turn. The team wants the model to receive each conversation in the format that the model expects for dialogs, without writing model-specific template code.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Call the Converse API with the turns in messages, using the user and assistant roles, so that Amazon Bedrock applies the model-specific prompt template.
    - id: b
      text:
        en: |-
          Keep InvokeModel with the concatenated prompt string, and add "User:" as a stop sequence so that generation stops before an invented turn.
    - id: c
      text:
        en: |-
          Keep InvokeModel with the concatenated prompt string, and set the temperature to 0 so that the model stops inventing turns.
    - id: d
      text:
        en: |-
          Call the Converse API with the whole concatenated conversation in the system field and an empty user message in messages.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      With Mistral AI and Meta models, the Converse API embeds the input in a model-specific prompt template that enables conversations. Sending the turns as user and assistant messages lets Bedrock produce the dialog format that the model expects, with no template code in the application.
  options:
    b:
      en: |-
        A stop sequence hides the symptom, but the model still receives an ad hoc transcript instead of its dialog format, which the requirement asks for.
    c:
      en: |-
        Temperature controls randomness, not the structure of the prompt, so the model still receives the conversation in the wrong format.
    d:
      en: |-
        Putting the conversation in the system field removes the turn structure, and a message needs real content; the template can only be applied to proper user and assistant messages.
references:
  - title: Inference using Converse API - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/conversation-inference.html
