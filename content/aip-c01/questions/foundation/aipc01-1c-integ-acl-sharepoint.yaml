id: aipc01-1c-integ-acl-sharepoint
objective: "1.4.4"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A financial services company is building an employee assistant on an Amazon Bedrock Managed Knowledge Base with a SharePoint Online data source. Permissions are set on individual SharePoint folders and documents and change often. An employee must never receive passages from documents that the employee cannot open in SharePoint. Employees sign in to the assistant's web application through the company's identity provider.

    Which combination of actions will meet these requirements? (Choose two.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Create one knowledge base per SharePoint library, and use IAM policies so that each team's role can query only its own knowledge base.
    - id: b
      text:
        en: |-
          Add a department attribute to each document's metadata, and have the application pass an equals filter on the employee's department.
    - id: c
      text:
        en: |-
          Enable ACL awareness on the SharePoint data source so that ingestion captures document permissions and retrieval filters results for each user.
    - id: d
      text:
        en: |-
          Let employees type their email address in the assistant, and pass it as the user context because Amazon Bedrock verifies it against SharePoint.
    - id: e
      text:
        en: |-
          Pass the email address from the employee's authenticated session as the user context in each retrieval request.
answer: { optionIds: [ c, e ] }
explanation:
  correct:
    en: |-
      ACL awareness on a managed knowledge base captures allow and deny lists during ingestion and filters results for the user context supplied at query time; for SharePoint it also checks access in real time, which covers permission changes since the last sync. The feature filters but does not authenticate, so the application must pass the email of the signed-in employee, which must match the email in SharePoint.
  options:
    a:
      en: |-
        Permissions are set per folder and document, not per library, so library-level knowledge bases would still expose restricted documents.
    b:
      en: |-
        A department attribute does not reflect SharePoint permissions, which differ document by document.
    d:
      en: |-
        Amazon Bedrock does not authenticate users or verify the user context, so a typed email would let anyone impersonate a colleague.
references:
  - title: "Access Control Lists awareness enablement - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/kb-managed-acl.html
  - title: "Build a managed knowledge base - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/kb-build-managed.html
