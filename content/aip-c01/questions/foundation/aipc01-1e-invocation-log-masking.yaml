id: aipc01-1e-invocation-log-masking
objective: "1.6.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A bank turned on Amazon Bedrock model invocation logging to an Amazon CloudWatch Logs log group. Customer prompts sometimes contain email addresses and phone numbers. Data analysts must query the log group with CloudWatch Logs Insights to study prompt usage, but only the security team may see the personal data. The assistant already uses an Amazon Bedrock guardrail that masks email addresses and phone numbers in model responses.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Attach a CloudWatch Logs data protection policy with managed data identifiers for these data types to the log group, and grant logs:Unmask only to the security team.
    - id: b
      text:
        en: |-
          Set the guardrail's sensitive information filter to ANONYMIZE email addresses and phone numbers in inputs too, so that the invocation logs store the masked prompts.
    - id: c
      text:
        en: |-
          Encrypt the log group with a customer managed AWS KMS key, and allow only the security team to use the key for decryption operations.
    - id: d
      text:
        en: |-
          Create a subscription filter that copies the log events to an S3 bucket, and give the data analysts access only to the copy in that bucket.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      A data protection policy masks matching data at ingestion, and the values stay masked in Logs Insights, metric filters and subscription filters. Only principals with the logs:Unmask permission can see the original values, so analysts can query usage while the security team keeps access to the personal data.
  options:
    b:
      en: |-
        Guardrail masking applies to the content sent to and returned by the model; the input field of the invocation log always contains the original request, regardless of guardrail intervention.
    c:
      en: |-
        Encryption protects the whole log group at rest; it cannot reveal the events to analysts while hiding only the personal values in them.
    d:
      en: |-
        The copied events contain the same personal data, so the analysts would still see it.
references:
  - title: "Help protect sensitive log data with masking - Amazon CloudWatch Logs"
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/logs/mask-sensitive-log-data.html
  - title: "Remove PII from conversations by using sensitive information filters - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/guardrails-sensitive-filters.html
