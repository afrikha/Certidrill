id: aipc01-1b-s3-vectors-hot-export
objective: "1.4.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A news publisher stores 200 million article chunk embeddings in Amazon S3 Vectors for an internal research assistant, which queries them a few hundred times a day at low cost. The embeddings of the last two years of articles are kept in a separate vector index in the same vector bucket and are refreshed weekly. The publisher is launching a public recommendation feature that queries only those recent embeddings at thousands of queries per second with consistently low latency. The full archive must stay in S3 Vectors to keep storage costs low.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Serve the recommendation feature from the recent vector index in S3 Vectors, and split that index into several smaller indexes in the same bucket to spread the load.
    - id: b
      text:
        en: |-
          Move all 200 million embeddings to an Amazon OpenSearch Serverless vector collection, and serve both the research assistant and the recommendation feature from it.
    - id: c
      text:
        en: |-
          Put an Amazon CloudFront distribution in front of the vector bucket, and cache the query responses of the recent vector index at edge locations.
    - id: d
      text:
        en: |-
          Export a snapshot of the recent vector index to Amazon OpenSearch Serverless each week, and serve the recommendation feature from the OpenSearch Serverless collection.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      S3 Vectors is cost-optimized storage with sub-second latency for infrequent queries. For high query rates and low latency, a snapshot of an S3 vector index can be exported to OpenSearch Serverless, so the hot subset is served from OpenSearch while the full archive stays in S3 Vectors at low storage cost.
  options:
    a:
      en: |-
        Splitting indexes keeps every query on storage that is designed for cost rather than for thousands of queries per second with consistently low latency, which the export to OpenSearch Serverless is meant for.
    b:
      en: |-
        Moving the whole archive gives up the low storage cost of S3 Vectors for the 200 million embeddings that the research assistant rarely queries, which violates the requirement.
    c:
      en: |-
        Vector buckets are accessed through the S3 Vectors API with Block Public Access always enabled, and similarity queries are not cacheable static content for a CDN.
references:
  - title: Working with S3 Vectors and vector buckets - Amazon Simple Storage Service
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/s3-vectors.html
