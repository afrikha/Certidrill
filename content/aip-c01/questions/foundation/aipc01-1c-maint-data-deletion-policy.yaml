id: aipc01-1c-maint-data-deletion-policy
objective: "1.4.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company's compliance team requires that when a data source is removed from an Amazon Bedrock knowledge base, the embeddings of its documents are removed from the vector store at the same time. An audit found that vectors of a data source deleted last month are still returned by retrieval. Several other data sources will be retired this year.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Add an S3 Lifecycle rule that expires the source documents after each data source is deleted.
    - id: b
      text:
        en: |-
          Make sure that the dataDeletionPolicy of each data source is set to DELETE before the data source is deleted.
    - id: c
      text:
        en: |-
          Run an ingestion job on each data source after deleting it so that its vectors are removed from the vector store.
    - id: d
      text:
        en: |-
          Delete the knowledge base service role after each data source is deleted so that its vectors can no longer be read.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      Each data source has a dataDeletionPolicy, DELETE by default or RETAIN, that decides whether its vector embeddings are deleted or kept when the data source is deleted. The audited data source was evidently set to RETAIN; keeping DELETE on the others makes their removal also remove their vectors.
  options:
    a:
      en: |-
        Deleting the source files does not touch vectors that are already stored in the vector store.
    c:
      en: |-
        An ingestion job runs on an existing data source; once the data source is deleted, there is nothing to sync.
    d:
      en: |-
        The service role is needed by the knowledge base for every operation, and removing it does not delete any vectors.
references:
  - title: "Connect your knowledge base to a custom data source - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/custom-data-source-connector.html
