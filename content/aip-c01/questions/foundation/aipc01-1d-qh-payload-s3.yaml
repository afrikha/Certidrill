id: aipc01-1d-qh-payload-s3
objective: "1.5.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company runs its query transformation pipeline in AWS Step Functions. A Map state retrieves chunks from an Amazon Bedrock knowledge base for up to eight sub-queries, and a Lambda function merges the results. For long documents, executions fail because the output passed between states exceeds the maximum payload size.

    Which solution will resolve the failures?
body:
  options:
    - id: a
      text:
        en: |-
          Convert the workflow to an Express workflow, which accepts larger payloads between states.
    - id: b
      text:
        en: |-
          Request a quota increase for the maximum input and output size of a state in Service Quotas.
    - id: c
      text:
        en: |-
          Increase the memory and timeout of the merge Lambda function so that it can process larger results.
    - id: d
      text:
        en: |-
          Have each retrieval task write its results to Amazon S3 and pass only the object keys to the merge function.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      Step Functions limits the data passed into and out of tasks and states to 256 KiB, and this is a hard quota. Writing large retrieval results to Amazon S3 and passing only references between states keeps every payload small.
  options:
    a:
      en: |-
        The 256 KiB limit applies to both Standard and Express workflows.
    b:
      en: |-
        The maximum input and output size is a hard quota that cannot be raised.
    c:
      en: |-
        The failure happens when Step Functions passes the state output, not inside the function, so more memory or time does not help.
references:
  - title: "Step Functions service quotas - AWS Step Functions"
    url: https://docs.aws.amazon.com/step-functions/latest/dg/service-quotas.html
