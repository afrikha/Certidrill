id: aipc01-1b-transcribe-pii-both-outputs
objective: "1.3.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A bank transcribes recorded customer calls with Amazon Transcribe batch jobs and sends the transcripts to a foundation model in Amazon Bedrock for summarization. Customers sometimes say card numbers and addresses during calls. The personal data must be removed before any text reaches the model. The compliance team must still be able to read the complete conversations, and the audio files are deleted after 30 days.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Enable PII redaction with redacted and unredacted output, send the redacted transcript to the model, and limit access to the unredacted one.
    - id: b
      text:
        en: |-
          Enable PII redaction with only a redacted transcript, send it to the model, and give the compliance team access to the redacted transcripts in Amazon S3.
    - id: c
      text:
        en: |-
          Send the unredacted transcript to the model with a system prompt that tells the model never to repeat card numbers or addresses in the summary.
    - id: d
      text:
        en: |-
          Switch to streaming transcription with PII identification so that personal data is flagged in the transcript, and send the flagged transcript to the model.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      When redaction is enabled, Amazon Transcribe can generate a redacted transcript only, or both a redacted and an unredacted transcript. Sending the redacted text keeps personal data away from the model, and the unredacted transcript under restricted access is the only complete record once the audio is deleted.
  options:
    b:
      en: |-
        With only a redacted transcript, the media file is the only place where the complete conversation exists. After the audio is deleted, the compliance team could no longer read it.
    c:
      en: |-
        The personal data would still be sent to the model, which violates the requirement; a prompt instruction only influences what the model writes.
    d:
      en: |-
        Identification flags PII without removing it, so the personal data would still reach the model.
references:
  - title: Redacting or identifying personally identifiable information - Amazon Transcribe
    url: https://docs.aws.amazon.com/transcribe/latest/dg/pii-redaction.html
