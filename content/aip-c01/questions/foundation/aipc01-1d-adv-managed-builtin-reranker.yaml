id: aipc01-1d-adv-managed-builtin-reranker
objective: "1.5.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A startup has built its RAG assistant on an Amazon Bedrock Managed Knowledge Base. The startup wants the retrieved results to be reranked by relevance before generation. It has no requirement for a specific reranker model and wants the lowest cost and the least effort.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Configure Cohere Rerank 3.5 as the reranker model in every retrieval request.
    - id: b
      text:
        en: |-
          Rely on the built-in managed reranker that the Managed Knowledge Base applies by default.
    - id: c
      text:
        en: |-
          Deploy an open-source cross-encoder on an Amazon SageMaker AI endpoint and call it from the application.
    - id: d
      text:
        en: |-
          Add a Lambda function that sends each result list to the Rerank operation before generation.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      A Managed Knowledge Base comes with a built-in managed semantic reranker at no extra cost. Choosing a Bedrock reranker model at query time is optional, for teams that need a specific model.
  options:
    a:
      en: |-
        A Bedrock reranker model at query time works but adds reranking charges that the built-in reranker avoids.
    c:
      en: |-
        A self-hosted endpoint adds infrastructure, cost, and code for something the managed knowledge base already does.
    d:
      en: |-
        A custom Lambda step and Rerank calls add code and charges without any benefit over the built-in reranker.
references:
  - title: "Build a managed knowledge base - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/kb-build-managed.html
  - title: "Retrieve data and generate AI responses with Amazon Bedrock Knowledge Bases - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/knowledge-base.html
