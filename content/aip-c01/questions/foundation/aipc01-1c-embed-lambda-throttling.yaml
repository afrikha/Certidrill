id: aipc01-1c-embed-lambda-throttling
objective: "1.5.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company backfills embeddings for 20 million chunks with a Lambda function that reads chunk files from Amazon S3 and calls InvokeModel on Amazon Titan Text Embeddings V2, one chunk per request. Many invocations fail with ThrottlingException, although the number of tokens processed per minute is low. The backfill must complete reliably without manual restarts.

    Which combination of actions will meet these requirements? (Choose two.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Set reserved concurrency on the function so that the request rate stays within the model's requests-per-minute quota.
    - id: b
      text:
        en: |-
          Request a tokens-per-minute quota increase for Titan Text Embeddings V2.
    - id: c
      text:
        en: |-
          Put several chunks into the inputText field of each request, separated by new lines, to receive one embedding per chunk.
    - id: d
      text:
        en: |-
          Retry throttled requests with exponential backoff and jitter, and send chunks that still fail to an Amazon SQS dead-letter queue.
    - id: e
      text:
        en: |-
          Increase the function memory to 10,240 MB so that each invocation sends its requests faster.
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: |-
      Embedding models are throttled on requests per minute, not tokens per minute, so the request rate must be capped; reserved concurrency limits how many function instances call the model at once. Retrying with exponential backoff and jitter absorbs the throttling that remains, and a dead-letter queue keeps any failed chunk for reprocessing instead of losing it.
  options:
    b:
      en: |-
        AWS states that embedding models are throttled by requests per minute, so the RPM quota, not a TPM quota, is the one that matters.
    c:
      en: |-
        Titan Text Embeddings V2 takes one inputText per request and returns one embedding for the whole text, so the chunks would be merged into a single vector.
    e:
      en: |-
        More memory makes each invocation faster, which raises the request rate and causes more throttling.
references:
  - title: "Amazon Titan Text Embeddings models - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/titan-embedding-models.html
  - title: "Amazon Titan Embeddings G1 - Text - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/model-parameters-titan-embed-text.html
