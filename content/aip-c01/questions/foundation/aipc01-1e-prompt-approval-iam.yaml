id: aipc01-1e-prompt-approval-iam
objective: "1.6.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A healthcare company manages its clinical summarization prompts in Amazon Bedrock Prompt Management. Prompt authors must be able to edit and test prompts freely. A prompt change must reach production only after an automated test suite passes and a clinical reviewer approves it, and no author must be able to bypass this process. The production application reads the prompt version ARN from AWS AppConfig.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Let authors create prompt versions and update AppConfig themselves, and run a nightly AWS Lambda function that deletes every version that the reviewer has not tagged as approved.
    - id: b
      text:
        en: |-
          Have the reviewer add a status metadata pair with the value approved to the prompt variant, and configure production to call the draft whenever the variant carries that pair.
    - id: c
      text:
        en: |-
          Allow authors only draft actions such as bedrock:UpdatePrompt, and let a pipeline role create the prompt version and update AppConfig after the tests and a CodePipeline manual approval.
    - id: d
      text:
        en: |-
          Keep the prompts in an S3 bucket with S3 Versioning turned on, and have production load the latest object and send it in the system field of each Converse request.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      Creating a version requires the bedrock:CreatePromptVersion permission, so authors who hold only draft permissions can edit and test but cannot publish. The pipeline role alone creates the version after the test stage and the manual approval action, which stops the pipeline until an authorized reviewer approves or rejects it. The pipeline then writes the new version ARN to AppConfig.
  options:
    a:
      en: |-
        Authors could publish a version and point AppConfig to it before the nightly cleanup runs, so unapproved prompts would reach production.
    b:
      en: |-
        Variant metadata is a descriptive tag, not an access control, and the draft keeps changing after the review, so production would run edits that nobody approved.
    d:
      en: |-
        Authors write directly to the bucket and production loads the latest object, so changes skip both the test suite and the approval.
references:
  - title: "Prerequisites for prompt management - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/prompt-management-prereq.html
  - title: "Add a manual approval action to a stage - AWS CodePipeline"
    url: https://docs.aws.amazon.com/codepipeline/latest/userguide/approvals.html
