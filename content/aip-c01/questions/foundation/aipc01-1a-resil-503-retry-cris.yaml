id: aipc01-1a-resil-503-retry-cris
objective: "1.2.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company's assistant in us-west-2 calls a foundation model in Amazon Bedrock on demand in that Region. During regional demand peaks, some calls fail with HTTP 503 ServiceUnavailable, although the account's quotas for the model are far from exhausted. Data may be processed in any US Region.

    Which combination of actions will reduce the failed requests? (Choose two.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Retry failed calls a bounded number of times with exponential backoff and jitter.
    - id: b
      text:
        en: |-
          Request a quota increase for the model's on-demand requests per minute in Service Quotas.
    - id: c
      text:
        en: |-
          Retry failed calls immediately in a tight loop until each call succeeds.
    - id: d
      text:
        en: |-
          Call the model through the US geographic cross-Region inference profile.
    - id: e
      text:
        en: |-
          Purchase Provisioned Throughput, and invoke it through the US geographic inference profile.
answer: { optionIds: [a, d] }
explanation:
  correct:
    en: |-
      ServiceUnavailable (HTTP 503) signals temporary high demand or capacity limits, not account quotas. AWS recommends retrying with exponential backoff and jitter and using cross-Region inference, which routes requests to other Regions of the geography; a US profile keeps processing in the US.
  options:
    b:
      en: |-
        The quotas are far from exhausted; a 503 is a capacity condition, while quota problems return ThrottlingException (HTTP 429).
    c:
      en: |-
        Immediate synchronized retries add load during the peak and keep failing; backoff with jitter spreads them out.
    e:
      en: |-
        Inference profiles do not support Provisioned Throughput.
references:
  - title: Troubleshooting Amazon Bedrock API Error Codes - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/troubleshooting-api-error-codes.html
  - title: Route model inference requests across AWS Regions with cross-Region inference - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/cross-region-inference.html
