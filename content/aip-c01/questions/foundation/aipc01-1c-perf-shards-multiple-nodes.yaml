id: aipc01-1c-perf-shards-multiple-nodes
objective: "1.4.3"
type: single
difficulty: 2
status: draft
shuffle: false
stem:
  en: |
    A company's vector index on an Amazon OpenSearch Service managed cluster with four data nodes has 5 primary shards and 1 replica, for about 120 GiB of primary data. During search peaks, two data nodes run at much higher CPU than the other two. The index will be rebuilt next month for a new embedding model, and the company wants search load to spread evenly across the four nodes while keeping shards in the recommended size range.

    Which shard configuration should the company use for the new index?
body:
  options:
    - id: a
      text:
        en: |-
          5 primary shards and 2 replicas
    - id: b
      text:
        en: |-
          7 primary shards and 1 replica
    - id: c
      text:
        en: |-
          9 primary shards and 1 replica
    - id: d
      text:
        en: |-
          8 primary shards and 1 replica
answer: { optionId: d }
explanation:
  correct:
    en: |-
      AWS recommends a primary shard count that is a multiple of the number of data nodes so that shards spread evenly. With 8 primaries and 1 replica, each of the four nodes holds four shards, and each primary is about 15 GiB, inside the 10-30 GiB range recommended for search.
  options:
    a:
      en: |-
        5 primaries with 2 replicas give 15 shards, which cannot be spread evenly over four nodes.
    b:
      en: |-
        7 primaries with 1 replica give 14 shards, so two nodes hold one more shard than the others.
    c:
      en: |-
        9 primaries with 1 replica give 18 shards, which again leaves two nodes with an extra shard.
references:
  - title: "Operational best practices for Amazon OpenSearch Service - Amazon OpenSearch Service"
    url: https://docs.aws.amazon.com/opensearch-service/latest/developerguide/bp.html
  - title: "Choosing the number of shards - Amazon OpenSearch Service"
    url: https://docs.aws.amazon.com/opensearch-service/latest/developerguide/bp-sharding.html
