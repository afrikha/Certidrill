id: aipc01-1c-chunk-hierarchical-context
objective: "1.5.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company's RAG assistant answers questions from long technical manuals in an Amazon Bedrock knowledge base that uses default chunking. Retrieval finds the right sentence, but answers often miss the conditions and warnings in the surrounding paragraphs. The company wants precise matching on small passages while the model receives the broader section around each match.

    Which chunking strategy should the company configure?
body:
  options:
    - id: a
      text:
        en: |-
          Fixed-size chunking with 100-token chunks and no overlap
    - id: b
      text:
        en: |-
          No chunking, so that each manual is stored as one chunk
    - id: c
      text:
        en: |-
          Default chunking, with numberOfResults raised from 5 to 20 in each request
    - id: d
      text:
        en: |-
          Hierarchical chunking with small child chunks and larger parent chunks
answer: { optionId: d }
explanation:
  correct:
    en: |-
      Hierarchical chunking embeds small child chunks for precise matching, then replaces each matched child with its larger parent chunk in the results, so the model receives the surrounding context. This is the strategy designed for documents that need both precise retrieval and broad context.
  options:
    a:
      en: |-
        Smaller chunks make matching more precise but give the model even less surrounding context.
    b:
      en: |-
        A whole manual is far longer than an embedding model input, and a single vector per manual makes precise matching impossible.
    c:
      en: |-
        More results add more small, possibly unrelated chunks; they do not attach the paragraphs around each match.
references:
  - title: "How content chunking works for knowledge bases - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/kb-chunking.html
