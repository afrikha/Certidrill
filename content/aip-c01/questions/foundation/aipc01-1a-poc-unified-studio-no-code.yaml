id: aipc01-1a-poc-unified-studio-no-code
objective: "1.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A marketing department wants to validate whether generative AI can draft campaign briefs before IT invests in a full application. Business analysts who do not write code must try several Amazon Bedrock models with text and image prompts, build a chat app that uses the department's brand guidelines and a guardrail, and share the app with colleagues for feedback.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Have IT develop a prototype web application with AWS Amplify and AWS Lambda that calls the Converse API, and give the analysts access to it.
    - id: b
      text:
        en: |-
          Give the analysts a project in Amazon SageMaker Unified Studio, where they use the Bedrock chat playground and build a chat agent app with the guidelines and a guardrail.
    - id: c
      text:
        en: |-
          Give the analysts IAM users with access to the Amazon Bedrock console, and ask them to export each playground conversation for review.
    - id: d
      text:
        en: |-
          Provide Amazon Q Developer subscriptions so that the analysts can generate the prototype code from natural-language descriptions.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      Amazon Bedrock in SageMaker Unified Studio lets project members experiment in the chat playground with text and image prompts and build chat agent apps without code. Apps can use data sources such as documents or knowledge bases and guardrails, and they can be shared with team members.
  options:
    a:
      en: |-
        A custom application needs developers and delays the validation that the department wants to run before IT invests.
    c:
      en: |-
        The console playgrounds let analysts try models, but exported conversations are not a shareable app with the guidelines and a guardrail.
    d:
      en: |-
        Amazon Q Developer closed to new sign-ups on May 15, 2026 (successor Kiro), and generating code does not help analysts who do not write code.
references:
  - title: Amazon Bedrock in SageMaker Unified Studio - Amazon SageMaker Unified Studio
    url: https://docs.aws.amazon.com/sagemaker-unified-studio/latest/userguide/bedrock.html
