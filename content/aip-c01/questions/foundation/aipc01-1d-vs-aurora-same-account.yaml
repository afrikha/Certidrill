id: aipc01-1d-vs-aurora-same-account
objective: "1.5.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company keeps an Aurora PostgreSQL cluster with pgvector in a central data account. The cluster meets the Knowledge Bases prerequisites (supported version, pgvector 0.5.0 or later, RDS Data API enabled, credentials in AWS Secrets Manager). A team in a separate application account tried to create a customer-managed Amazon Bedrock knowledge base in the application account that points to this cluster, and the creation failed. An application that runs in the application account must retrieve from a knowledge base that uses this cluster.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Share the Aurora cluster with the application account through AWS Resource Access Manager, and create the knowledge base in the application account.
    - id: b
      text:
        en: |-
          Replicate the secret to the application account and grant the knowledge base service role cross-account access to the secret.
    - id: c
      text:
        en: |-
          Create the knowledge base in the data account that owns the cluster, and let the application call Retrieve by assuming an IAM role in that account.
    - id: d
      text:
        en: |-
          Create an Aurora Replica of the cluster in the application account's VPC and point the knowledge base to the replica endpoint.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      The Aurora cluster must reside in the same AWS account as the knowledge base. Creating the knowledge base in the data account satisfies this rule, and the application account uses a cross-account IAM role to call the knowledge base's retrieval operations.
  options:
    a:
      en: |-
        Sharing the cluster does not change the account that owns it, and the knowledge base must be in the account where the cluster resides.
    b:
      en: |-
        Access to the secret is not the problem; the cluster itself must be in the knowledge base's account.
    d:
      en: |-
        Aurora Replicas belong to the same cluster in the same account, and Knowledge Bases is configured with a cluster ARN rather than a replica endpoint.
references:
  - title: "Prerequisites for using a vector store you created for a knowledge base - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/knowledge-base-setup.html
  - title: "Using Aurora PostgreSQL as a Knowledge Base for Amazon Bedrock - Amazon Aurora"
    url: https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/AuroraPostgreSQL.VectorDB.html
