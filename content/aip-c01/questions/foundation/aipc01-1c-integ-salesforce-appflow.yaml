id: aipc01-1c-integ-salesforce-appflow
objective: "1.4.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A telecom company has a customer-managed Amazon Bedrock knowledge base on Aurora PostgreSQL with pgvector, because its analysts join the vector table with billing tables in SQL. The company must now add Salesforce knowledge articles to this knowledge base and refresh them every day. The company must keep the existing Aurora-based knowledge base and wants the LEAST custom code.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Add a Salesforce data source connector to the existing knowledge base, and start an ingestion job every day.
    - id: b
      text:
        en: |-
          Create an Amazon Bedrock Managed Knowledge Base with its Salesforce connector, and point the analysts' SQL queries at it.
    - id: c
      text:
        en: |-
          Write a Lambda function that calls the Salesforce APIs every day and inserts article embeddings directly into the Aurora table.
    - id: d
      text:
        en: |-
          Create a scheduled Amazon AppFlow flow from Salesforce to an S3 bucket, add the bucket as an S3 data source, and sync it after each flow run.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      New Salesforce connectors cannot be created on customer-managed knowledge bases since September 30, 2026, but S3 data sources remain available. Amazon AppFlow moves Salesforce data to Amazon S3 on a schedule without code, and the knowledge base then ingests the bucket with its normal parsing, chunking, and embedding into the existing Aurora store.
  options:
    a:
      en: |-
        Creating a new Salesforce connector is no longer supported on customer-managed knowledge bases.
    b:
      en: |-
        A Managed Knowledge Base uses a vector store that Amazon Bedrock manages, so the analysts could not join it with billing tables in SQL, and the existing knowledge base would not hold the articles.
    c:
      en: |-
        This is custom code, and rows written outside the knowledge base ingestion lack the chunking and metadata that Amazon Bedrock manages.
references:
  - title: "Connect a data source to your knowledge base - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/data-source-connectors.html
  - title: "What is Amazon AppFlow? - Amazon AppFlow"
    url: https://docs.aws.amazon.com/appflow/latest/userguide/what-is-appflow.html
