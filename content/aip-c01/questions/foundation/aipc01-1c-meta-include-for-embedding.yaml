id: aipc01-1c-meta-include-for-embedding
objective: "1.4.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An industrial equipment manufacturer runs a support assistant on an Amazon Bedrock knowledge base with an S3 data source. Each maintenance document has a .metadata.json file with a product_model attribute, but the document text rarely repeats the model name. Technicians ask questions such as "How do I reset the hydraulic valve on the X200?", and retrieval often returns passages for other models. The company wants the model name to influence similarity ranking, but chunks of other models must remain eligible because some procedures are shared across models.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Use the simplified "product_model": "X200" format in each metadata file so that Amazon Bedrock stores the attribute with every chunk.
    - id: b
      text:
        en: |-
          Have the application extract the model name from each question and pass an equals filter on product_model in the Retrieve request.
    - id: c
      text:
        en: |-
          Set includeForEmbedding to true for the product_model attribute in each metadata file, and sync the data source again.
    - id: d
      text:
        en: |-
          Set x-amz-meta-product-model user-defined metadata on each S3 object, and sync the data source again.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      With includeForEmbedding set to true, the knowledge base prepends the key and value to the chunk text before computing the embedding, so a question that names the model scores higher against chunks of that model. The attribute is not added to the chunk text returned in results, and no chunk is excluded, so shared procedures can still be retrieved.
  options:
    a:
      en: |-
        The simplified format stores the attribute for filtering only, which is equivalent to includeForEmbedding set to false; it does not change the vectors.
    b:
      en: |-
        An equals filter removes every chunk of other models, including the shared procedures that must remain eligible.
    d:
      en: |-
        The S3 connector does not read x-amz-meta- headers; attributes come only from the .metadata.json file.
references:
  - title: "Connect to Amazon S3 for your knowledge base - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/s3-data-source-connector.html
  - title: "Configure and customize queries and response generation - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/kb-test-config.html
