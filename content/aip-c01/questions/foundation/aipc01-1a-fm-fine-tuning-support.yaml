id: aipc01-1a-fm-fine-tuning-support
objective: "1.2.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company in us-east-1 is choosing a text model in Amazon Bedrock for a claims-triage assistant. Prompt engineering meets today's quality bar, but the team expects to fine-tune the model on labeled claims within six months. The fine-tuning must run as an Amazon Bedrock fine-tuning job in us-east-1, without moving data to another Region.

    Which approach to model selection will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Choose any model that is available through a cross-Region inference profile, because every such model can be fine-tuned in its source Region.
    - id: b
      text:
        en: |-
          Choose any model now, and use Amazon Bedrock Custom Model Import later to fine-tune it inside Amazon Bedrock in us-east-1.
    - id: c
      text:
        en: |-
          Choose Meta Llama 3.3 70B Instruct, and run its Bedrock fine-tuning job in us-east-1 when the labeled claims are ready.
    - id: d
      text:
        en: |-
          Shortlist models that Bedrock lists for fine-tuning in us-east-1, such as Amazon Nova Lite or Nova Pro, and evaluate them before choosing.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      Bedrock fine-tuning is supported only for specific models in specific Regions. In us-east-1 the list includes Amazon Nova models such as Nova Micro, Nova Lite, Nova Pro and Nova 2 Lite, so checking customization support during model selection avoids a later migration.
  options:
    a:
      en: |-
        Cross-Region inference availability says nothing about customization; fine-tuning support is listed separately per model and Region.
    b:
      en: |-
        Custom Model Import brings in weights that were already customized elsewhere; it does not run fine-tuning jobs.
    c:
      en: |-
        Bedrock lists fine-tuning for the Llama 3.3 70B Instruct model in us-west-2 only, which would move the work to another Region.
references:
  - title: Customize a model with fine-tuning in Amazon Bedrock - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/custom-model-supported.html
  - title: Use Custom model import to import a customized open-source model into Amazon Bedrock - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/model-customization-import-model.html
