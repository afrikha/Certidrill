id: aipc01-1c-integ-sftp-nfs-sources
objective: "1.4.4"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A pharmaceutical company feeds a customer-managed Amazon Bedrock knowledge base from an S3 bucket. Two new sources must be added. Research partners will deliver documents by SFTP from their own systems, and an on-premises NFS file server holds 4 TB of lab procedures that change every week. The company does not want to operate file transfer servers or write transfer code.

    Which combination of actions will meet these requirements? (Choose two.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Create an AWS Transfer Family SFTP server that stores the partners' uploads in the knowledge base's S3 bucket.
    - id: b
      text:
        en: |-
          Run an SFTP server on an Amazon EC2 instance that writes the partners' uploads to the knowledge base's S3 bucket.
    - id: c
      text:
        en: |-
          Run a weekly Lambda function that reads the NFS share over the network and copies changed files to the S3 bucket.
    - id: d
      text:
        en: |-
          Deploy an AWS DataSync agent on premises, and schedule a weekly DataSync task from the NFS share to the knowledge base's S3 bucket.
    - id: e
      text:
        en: |-
          Add a Web Crawler data source to the knowledge base that crawls the NFS file server's shared folders through an internal URL.
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: |-
      Transfer Family is a fully managed SFTP service that stores partner uploads directly in Amazon S3, so partners keep their existing clients and the company runs no servers. DataSync is a managed service that copies NFS data from on premises to Amazon S3, so the weekly changes land in the bucket without custom code. The knowledge base then ingests both sources through its S3 data source.
  options:
    b:
      en: |-
        An SFTP server on EC2 is a file transfer server that the company would have to operate and patch.
    c:
      en: |-
        A Lambda function that reads the share is transfer code that the company would have to write and maintain.
    e:
      en: |-
        A Web Crawler crawls web pages, not NFS shares, and new Web Crawler connectors cannot be created on customer-managed knowledge bases since September 30, 2026.
references:
  - title: "What is AWS Transfer Family? - AWS Transfer Family"
    url: https://docs.aws.amazon.com/transfer/latest/userguide/what-is-aws-transfer-family.html
  - title: "What is AWS DataSync? - AWS DataSync"
    url: https://docs.aws.amazon.com/datasync/latest/userguide/what-is-datasync.html
