id: aipc01-1d-qh-hypothetical-answer
objective: "1.5.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company has a knowledge base of 2 million long technical passages, embedded with the same model that embeds the queries. Users type very short questions, and retrieval often misses relevant passages because a short question and a long explanatory passage produce dissimilar embeddings. The questions use the same vocabulary as the documents and each asks about a single topic. Re-embedding or re-chunking the corpus is not allowed.

    Which solution will improve retrieval?
body:
  options:
    - id: a
      text:
        en: |-
          Enable query decomposition so that each short question is split into several sub-queries.
    - id: b
      text:
        en: |-
          Have a Bedrock model write a hypothetical answer, and search with the embedding of that answer.
    - id: c
      text:
        en: |-
          Embed the queries with a different embedding model that is optimized for short input text.
    - id: d
      text:
        en: |-
          Switch the data source to semantic chunking so that chunks match the length of the questions.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      A hypothetical answer is written in the style and length of the documents, so its embedding lies closer to the relevant passages than the short question does. Only the query side changes, so the corpus is neither re-chunked nor re-embedded.
  options:
    a:
      en: |-
        The questions are single-topic, so there is nothing to decompose, and short sub-queries keep the same mismatch.
    c:
      en: |-
        Queries and documents must be embedded with the same model and dimensions; vectors from two models cannot be compared.
    d:
      en: |-
        Changing the chunking strategy requires re-ingesting the corpus, which is not allowed.
references:
  - title: "Retrieve - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/APIReference/API_agent-runtime_Retrieve.html
