id: aipc01-1c-meta-epoch-date-filter
objective: "1.4.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A pharmaceutical company indexes regulatory guidance documents in an Amazon Bedrock knowledge base that uses an S3 data source and an Amazon OpenSearch Serverless vector store. Each document has a publication date. Analysts must be able to retrieve only documents published on or after a date that they choose, and the date restriction must be exact rather than approximate.

    Which combination of actions will meet these requirements? (Choose two.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Store the publication date as a NUMBER attribute that holds the Unix epoch time in each document's .metadata.json file.
    - id: b
      text:
        en: |-
          Store the publication date as a STRING attribute in the format YYYY-MM-DD in each document's .metadata.json file.
    - id: c
      text:
        en: |-
          Set includeForEmbedding to true for the publication date attribute so that dates in questions match the dates of the chunks.
    - id: d
      text:
        en: |-
          Pass a greaterThanOrEquals filter on the publication date attribute in the retrieval configuration of each Retrieve request.
    - id: e
      text:
        en: |-
          Pass a startsWith filter on the publication date attribute with the year and month that the analyst chose.
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: |-
      The range operators (greaterThan, greaterThanOrEquals, lessThan, lessThanOrEquals) work only on number attributes, so the date must be stored as a number such as an epoch timestamp. A greaterThanOrEquals filter with the analyst's date, converted to the same format, then keeps only the chunks of documents published on or after that date, before ranking.
  options:
    b:
      en: |-
        A STRING attribute supports equals, notEquals, and the list or contains operators, not range comparisons, so a YYYY-MM-DD string cannot express "on or after".
    c:
      en: |-
        includeForEmbedding adds the attribute to the text that is embedded. It changes similarity scores but does not exclude older documents.
    e:
      en: |-
        startsWith matches one year-and-month prefix, not every date after the chosen one, so documents from later months would be excluded.
references:
  - title: "Configure and customize queries and response generation - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/kb-test-config.html
  - title: "Connect to Amazon S3 for your knowledge base - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/s3-data-source-connector.html
