id: aipc01-1b-entities-async-job
objective: "1.3.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company is preparing 5 million archived support emails, stored as text files in Amazon S3, for ingestion into a knowledge base. Before ingestion, the people, organizations and dates mentioned in each email must be extracted and written into the email's metadata file. The work has no real-time requirement, and the company wants to minimize custom orchestration.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Start an Amazon Comprehend entities detection job on the S3 prefix, and use a Lambda function to write the entities from the job's output file into the metadata files.
    - id: b
      text:
        en: |-
          Send one SQS message per email, and have a Lambda function call DetectEntities for each message and write the result into the email's metadata file.
    - id: c
      text:
        en: |-
          Run one Lambda function that loops over all the emails, calls BatchDetectEntities for groups of emails, and writes the results into the metadata files.
    - id: d
      text:
        en: |-
          Call a large foundation model in Amazon Bedrock with on-demand InvokeModel for each email, and ask it to return the entities as JSON.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      StartEntitiesDetectionJob runs an asynchronous job on documents in S3 and produces a file with the entities of each document. Comprehend handles scaling and scheduling, so the only custom step is merging the results into the metadata files.
  options:
    b:
      en: |-
        Five million synchronous calls with a queue, retries and throttling handling is the custom orchestration that the company wants to avoid.
    c:
      en: |-
        A single function cannot process 5 million emails within the Lambda maximum timeout of 1,800 seconds, so the loop would need its own checkpointing and orchestration.
    d:
      en: |-
        Five million on-demand calls to a large model are costly and need the same orchestration, while a pre-trained entity service already extracts these types.
references:
  - title: Entities - Amazon Comprehend
    url: https://docs.aws.amazon.com/comprehend/latest/dg/how-entities.html
