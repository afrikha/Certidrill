id: aipc01-1d-adv-hybrid-s3-vectors
objective: "1.5.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A retailer's product assistant uses a customer-managed Amazon Bedrock knowledge base whose vector store is an Amazon S3 vector index. A developer set overrideSearchType to HYBRID in the Retrieve requests, but queries that contain exact SKU numbers still miss the right product pages, and no error is returned. The retailer requires keyword matching on SKUs and wants to keep using Knowledge Bases for ingestion and retrieval.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Create a knowledge base with an OpenSearch Serverless store that has a filterable text field, ingest the documents, and use HYBRID.
    - id: b
      text:
        en: |-
          Send the same HYBRID setting through RetrieveAndGenerate instead of Retrieve so that Amazon Bedrock runs the keyword search.
    - id: c
      text:
        en: |-
          Keep the S3 vector index, set overrideSearchType to SEMANTIC, and add a reranker model to the retrieval configuration.
    - id: d
      text:
        en: |-
          Recreate the S3 vector index with the cosine distance metric instead of Euclidean, and ingest the documents again.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      Knowledge Bases runs hybrid search only for Amazon RDS (Aurora), OpenSearch Serverless, and MongoDB vector stores that contain a filterable text field; with any other store the query silently runs as semantic search. Moving to an OpenSearch Serverless store with a filterable text field lets HYBRID add keyword matching on SKUs.
  options:
    b:
      en: |-
        The limitation comes from the vector store, not the API: RetrieveAndGenerate also falls back to semantic search on an S3 vector index.
    c:
      en: |-
        A reranker only reorders the chunks that semantic search retrieved; if the SKU page is not retrieved, reranking cannot surface it.
    d:
      en: |-
        The distance metric changes how vectors are compared, not whether keyword search is available.
references:
  - title: "Configure and customize queries and response generation - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/kb-test-config.html
