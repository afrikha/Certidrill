id: aipc01-1a-resil-feature-flag-off-switch
objective: "1.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A travel company's booking site includes a GenAI trip-summary feature, served by Amazon ECS services that call Amazon Bedrock. During a recent model incident, slow failures of the feature degraded the whole booking page, and deploying a version without the feature took 40 minutes. The company wants operators to switch the feature off quickly, showing a static itinerary instead, and back on later, without deploying code. The services already run the AWS AppConfig Agent.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Keep a second container image without the feature, and update the ECS services to that image whenever the model provider has an incident.
    - id: b
      text:
        en: |-
          Increase the SDK's maximum retry attempts for Bedrock calls so that the feature waits longer for the model to recover before it fails.
    - id: c
      text:
        en: |-
          Create an AWS AppConfig feature flag that the services check through the AppConfig Agent before calling Bedrock, and show the static itinerary when it is disabled.
    - id: d
      text:
        en: |-
          Configure Amazon Route 53 failover for the booking site to a static website in Amazon S3 that operators activate during model incidents.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      An AppConfig feature flag is a configuration that controls a feature's behavior with an enabled or disabled status. The services read it through the AppConfig Agent, so operators turn the GenAI feature off and on by deploying a flag change, and the page degrades gracefully to the static itinerary without a code deployment.
  options:
    a:
      en: |-
        Switching images is a deployment, which is the 40-minute path the company wants to avoid.
    b:
      en: |-
        More retries make each failing request slower, which worsens the page degradation during an incident.
    d:
      en: |-
        Failing over the whole site removes bookings as well; only the GenAI feature should be turned off.
references:
  - title: Understanding multi-variant feature flag concepts and common use cases - AWS AppConfig
    url: https://docs.aws.amazon.com/appconfig/latest/userguide/appconfig-creating-multi-variant-feature-flags-concepts.html
