id: aipc01-1d-if-prompt-arn-role
objective: "1.6.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A central AI team defines a customer service persona, behavior rules, inference parameters, and tool definitions for an Anthropic Claude model on Amazon Bedrock. Fifteen application teams call the Converse API. The application teams must not be able to change the system prompt, the inference parameters, or the tools; they may only supply the customer's question and loyalty tier.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Store the system prompt text in an Amazon S3 bucket, and have each application read it and pass it in the system field of its Converse requests.
    - id: b
      text:
        en: |-
          Store the prompt, inference parameters, and tools in Prompt Management, and have applications call Converse with the prompt version ARN and promptVariables.
    - id: c
      text:
        en: |-
          Create a guardrail with denied topics that describe off-persona answers, and require the application teams to attach it to their requests.
    - id: d
      text:
        en: |-
          Publish a shared Lambda layer that builds the Converse request with the approved system prompt, and ask the teams to use it.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      When the modelId of a Converse request is a Prompt Management prompt version ARN, the request cannot include system, inferenceConfig, toolConfig, or additionalModelRequestFields; these come from the managed prompt. The applications only fill the variables with promptVariables (and may append messages), so the central team's role definition is enforced.
  options:
    a:
      en: |-
        Each application still builds its own system field, so a team can modify or replace the prompt.
    c:
      en: |-
        Denied topics block subjects in inputs and outputs; they do not define the persona, inference parameters, or tools.
    d:
      en: |-
        A layer is a convention that teams can bypass or modify; nothing prevents a request with a different system prompt.
references:
  - title: "Converse - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/APIReference/API_runtime_Converse.html
  - title: "Create a prompt using Prompt management - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/prompt-management-create.html
