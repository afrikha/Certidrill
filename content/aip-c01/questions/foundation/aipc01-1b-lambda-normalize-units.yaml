id: aipc01-1b-lambda-normalize-units
objective: "1.3.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A maintenance assistant compares sensor readings that plants around the world submit as text. Dates arrive as 03/04/2026 or 4 March 2026, temperatures in Fahrenheit or Celsius, pressures in psi or bar, and the same characters sometimes use different Unicode forms. The model's comparisons are often wrong. The company wants a deterministic fix with low cost and low latency.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Normalize the input in a Lambda function before building the prompt: ISO 8601 dates, one unit per measure, one Unicode form, and cleaned whitespace.
    - id: b
      text:
        en: |-
          Add instructions to the system prompt that ask the model to convert every date and unit to a standard format before comparing the readings.
    - id: c
      text:
        en: |-
          Call Amazon Comprehend DetectEntities on each reading, and add the detected DATE and QUANTITY entities to the prompt next to the original text.
    - id: d
      text:
        en: |-
          Configure an Amazon Bedrock Guardrails word filter that blocks inputs that contain non-standard units or date formats.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      Rule-based normalization in Lambda converts the same meaning into the same representation every time, before any tokens are spent. It is deterministic, cheap and fast, and the model then compares values that are already expressed consistently.
  options:
    b:
      en: |-
        Asking the model to convert values is not deterministic, adds tokens and latency, and leaves the arithmetic to the model.
    c:
      en: |-
        Entity detection finds dates and quantities but does not convert them to a single format or unit, so the inconsistency remains.
    d:
      en: |-
        Blocking the inputs rejects valid readings instead of making them consistent.
references:
  - title: Entities - Amazon Comprehend
    url: https://docs.aws.amazon.com/comprehend/latest/dg/how-entities.html
