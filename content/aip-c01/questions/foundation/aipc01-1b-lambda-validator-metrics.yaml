id: aipc01-1b-lambda-validator-metrics
objective: "1.3.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Partners upload PDF and text files to an S3 bucket, and the files are later ingested into an Amazon Bedrock knowledge base. Some files are password-protected, empty, or longer than the 300-page limit that the company has set, and they cause ingestion failures. The company must check every file when it is uploaded, move rejected files to a quarantine prefix, and alert the operations team when more than 5% of the files uploaded in an hour are rejected.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Create an AWS Glue Data Quality ruleset with FileSize and FileFreshness rules on the bucket, and alarm on the glue.data.quality.rules.failed metric.
    - id: b
      text:
        en: |-
          Start the ingestion job after each upload, and create a CloudWatch alarm on the number of failed documents that GetIngestionJob reports for each run.
    - id: c
      text:
        en: |-
          Enable Amazon Macie automated sensitive data discovery on the bucket, and send Macie findings to the operations team through Amazon EventBridge.
    - id: d
      text:
        en: |-
          Invoke a Lambda function from S3 events that checks each file, moves rejects to quarantine, publishes accepted and rejected counts to CloudWatch, and alarms on the rate.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      Checks such as encryption, empty content and page count need code that opens the file, which a Lambda function invoked by S3 events can run on every upload. Publishing accepted and rejected counts with PutMetricData lets a CloudWatch alarm, using metric math for the percentage, notify the team when the hourly rejection rate exceeds 5%.
  options:
    a:
      en: |-
        File rules can check properties such as size or freshness, but they cannot detect password protection or count pages, and the ruleset does not move rejected files to a quarantine prefix.
    b:
      en: |-
        Ingestion statistics report failures after the files reach the knowledge base. Nothing checks the files at upload or moves them to quarantine.
    c:
      en: |-
        Macie discovers sensitive data such as PII in S3 objects. It does not validate whether a file is readable, empty or too long.
references:
  - title: Publish custom metrics (PutMetricData / EMF) - Amazon CloudWatch
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/publishingMetrics.html
