id: aipc01-1e-judge-regression-gate
objective: "1.6.4"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    A legal technology company maintains a golden dataset of 800 prompts with reference answers for its contract question-answering feature. Before a new prompt version is released, the CI/CD pipeline must prove that the new version's answers are at least as correct and complete as the current version's, and the release must stop automatically otherwise. The pipeline already generates the responses of both versions for the whole dataset.

    Which combination of steps will meet these requirements? (Choose two.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Submit one LLM-as-a-judge evaluation job whose dataset contains the responses of both versions, each labeled with its own modelIdentifier value in modelResponses.
    - id: b
      text:
        en: |-
          Compare the average output token counts of the two versions in the model invocation logs, and stop the release when the new version's answers are shorter.
    - id: c
      text:
        en: |-
          Submit one LLM-as-a-judge job per version, with the responses in modelResponses, the reference answers in referenceResponse, and correctness and completeness metrics.
    - id: d
      text:
        en: |-
          Run prompt optimization on the new version in Prompt Management, and release the optimized variant automatically when the optimization finishes without errors.
    - id: e
      text:
        en: |-
          Add a pipeline step that reads both jobs' results from Amazon S3 and fails the stage when the new version scores below the current version minus a tolerance.
answer: { optionIds: [ c, e ] }
explanation:
  correct:
    en: |-
      An LLM-as-a-judge job can evaluate responses that you supply, with up to 1,000 prompts, and Builtin.Correctness and Builtin.Completeness use the reference response when it is present. A job accepts only one modelIdentifier, so each version needs its own job. The full results are written to S3, where a pipeline step can compare the scores and fail the stage.
  options:
    a:
      en: |-
        A bring-your-own-response job supports a single modelIdentifier and one response per prompt, so both versions cannot share one job.
    b:
      en: |-
        Response length says nothing about correctness or completeness; a shorter answer can be better or worse.
    d:
      en: |-
        Prompt optimization rewrites a prompt heuristically; it does not measure the new version against the reference answers.
references:
  - title: "Evaluate model performance using another LLM as a judge - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/evaluation-judge.html
  - title: "Create a prompt dataset for a model evaluation job that uses a model as judge - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/model-evaluation-prompt-datasets-judge.html
