id: aipc01-1c-chunk-semantic-threshold
objective: "1.5.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company uses semantic chunking for meeting transcripts in an Amazon Bedrock knowledge base. To get fewer, longer chunks, an engineer raises the breakpoint percentile threshold from 90 to 97 and ingests the transcripts again with all other settings unchanged.

    Which outcomes should the team expect? (Choose two.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Ingestion incurs foundation model charges that depend on the volume of transcript data processed.
    - id: b
      text:
        en: |-
          Retrieval returns parent chunks in place of the matched child chunks.
    - id: c
      text:
        en: |-
          Citations lose page numbers because semantic chunking stores each transcript as one chunk.
    - id: d
      text:
        en: |-
          Each chunk contains exactly the maximum number of tokens configured for the data source.
    - id: e
      text:
        en: |-
          The transcripts are split into fewer, larger chunks than with a threshold of 90.
answer: { optionIds: [ a, e ] }
explanation:
  correct:
    en: |-
      Semantic chunking uses a foundation model to find breakpoints, so ingestion has an additional cost based on the volume of data. A higher breakpoint percentile threshold requires a larger difference in meaning before splitting, which produces fewer, larger chunks.
  options:
    b:
      en: |-
        Replacing matched child chunks with parent chunks is how hierarchical chunking behaves, not semantic chunking.
    c:
      en: |-
        Losing page numbers is a consequence of no chunking, where each document is one chunk.
    d:
      en: |-
        The maximum token setting is an upper bound; semantic chunks end where meaning changes, so their sizes vary.
references:
  - title: "How content chunking works for knowledge bases - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/kb-chunking.html
