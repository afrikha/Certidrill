id: aipc01-1b-guardrails-canary-rollback
objective: "1.2.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company serves a fine-tuned summarization model on an Amazon SageMaker AI real-time endpoint. A new model version has passed offline evaluation. The company must first send 10% of production traffic to the new version and observe it for 30 minutes. The rest of the traffic must move to the new version only if its error rate and latency stay within limits. If errors increase at any point during the update, all traffic must return to the current version automatically. The company wants the LEAST operational overhead.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Add the new version as a second production variant with a weight of 0.1, and create a CloudWatch alarm that invokes a Lambda function to reset the variant weights when errors increase.
    - id: b
      text:
        en: |-
          Update the endpoint with a rolling deployment that uses a batch size of 10% of the instance capacity and a 30-minute wait between batches, without CloudWatch alarms.
    - id: c
      text:
        en: |-
          Update the endpoint with a blue/green all-at-once traffic shift, and configure CloudWatch alarms on errors and latency with a 30-minute baking period.
    - id: d
      text:
        en: |-
          Update the endpoint with a blue/green canary traffic shift of 10% and a 30-minute wait, and configure CloudWatch alarms on errors and latency for automatic rollback.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      Deployment guardrails with canary traffic shifting send a small portion of traffic to the new (green) fleet, watch it during a baking period, and then shift the remaining traffic. If any CloudWatch alarm specified for the deployment trips, SageMaker AI rolls back completely to the old fleet, so no custom orchestration is needed.
  options:
    a:
      en: |-
        Production variant weights can split traffic, but the rollback logic, the timing of the second step and the cleanup of the old variant would all be custom code, which is more operational overhead than the managed deployment options.
    b:
      en: |-
        Automatic rollback in deployment guardrails works only when CloudWatch alarms monitor the endpoint. Without alarms, nothing returns traffic to the current version when errors increase.
    c:
      en: |-
        An all-at-once shift moves 100% of the traffic to the new fleet before the baking period starts, which violates the requirement to expose only 10% of the traffic first.
references:
  - title: Deployment guardrails for updating models in production - Amazon SageMaker AI
    url: https://docs.aws.amazon.com/sagemaker/latest/dg/deployment-guardrails.html
  - title: Auto-Rollback Configuration and Monitoring - Amazon SageMaker AI
    url: https://docs.aws.amazon.com/sagemaker/latest/dg/deployment-guardrails-configuration.html
