id: aipc01-1a-design-service-tiers-mixed
objective: "1.1.1"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    A logistics company runs two workloads on the same foundation model in Amazon Bedrock, and the model supports every service tier. A customer-facing shipment assistant must keep low latency during daily peaks and is used only during business hours. A nightly multi-step agent workflow re-plans delivery routes; each step depends on the previous model response, and the workflow may run several hours longer when needed. The company does not want any capacity commitment.

    Which combination of configurations will meet these requirements MOST cost-effectively? (Choose two.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Send the shipment assistant's requests with the service_tier parameter set to priority.
    - id: b
      text:
        en: |-
          Reserve capacity for the shipment assistant in the Reserved tier through the AWS account team.
    - id: c
      text:
        en: |-
          Purchase Provisioned Throughput with no commitment for the nightly workflow, and delete it every morning.
    - id: d
      text:
        en: |-
          Send the nightly workflow's requests with the service_tier parameter set to flex.
    - id: e
      text:
        en: |-
          Submit the nightly workflow as one Amazon Bedrock batch inference job that contains all of its steps.
answer: { optionIds: [a, d] }
explanation:
  correct:
    en: |-
      The Priority tier serves customer-facing workflows ahead of Standard and Flex requests without any reservation. The Flex tier is discounted 50 % from Standard for workloads that tolerate longer processing times, and AWS names agentic workflows among its use cases.
  options:
    b:
      en: |-
        The Reserved tier is a 1- or 3-month capacity commitment, which the company does not want, and it is paid even outside business hours.
    c:
      en: |-
        Provisioned Throughput is billed hourly per model unit whether or not the capacity is used, and buying and deleting it every day adds operations; Flex only discounts the tokens that are processed.
    e:
      en: |-
        A batch job processes records that are prepared in advance; a step that needs the previous step's response cannot be one of the records of the same job.
references:
  - title: Service tiers for optimizing performance and cost - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/service-tiers-inference.html
  - title: Amazon Bedrock Pricing
    url: https://aws.amazon.com/bedrock/pricing/
