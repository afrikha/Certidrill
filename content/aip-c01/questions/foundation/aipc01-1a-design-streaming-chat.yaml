id: aipc01-1a-design-streaming-chat
objective: "1.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A travel company is building a trip-planning chat assistant for its website. Complete answers often take 20–30 seconds to generate, and usability tests show that users leave the page when nothing appears for more than a few seconds. The backend is an AWS Lambda function on a Node.js managed runtime that calls a model in Amazon Bedrock. The company wants users to see each answer while it is being generated.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Call the Converse API from the function, cache complete answers in Amazon ElastiCache, and return a cached answer when a user asks a similar question.
    - id: b
      text:
        en: |-
          Write each question to an Amazon SQS queue, process it with a second function that calls InvokeModel, and have the page poll an API for the answer.
    - id: c
      text:
        en: |-
          Add each question to an Amazon Bedrock batch inference job, and notify the page through Amazon EventBridge when the job completes.
    - id: d
      text:
        en: |-
          Call the ConverseStream API from the function, and return the text chunks to the browser through Lambda response streaming on a function URL.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      ConverseStream returns the answer as a stream of contentBlockDelta events instead of one final message. Lambda response streaming, supported natively on Node.js managed runtimes through function URLs or InvokeWithResponseStream, sends partial responses as soon as they are available, which improves time to first byte for users.
  options:
    a:
      en: |-
        A cache helps only for repeated questions; every new question still waits for the complete Converse response before anything is shown.
    b:
      en: |-
        Queueing and polling make the exchange asynchronous, but the page still receives only the complete answer, after an even longer delay.
    c:
      en: |-
        Batch inference is for large offline jobs whose results land in S3 later; it is not an interactive path for a chat.
references:
  - title: Inference using Converse API - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/conversation-inference.html
  - title: Response streaming for Lambda Event Functions - AWS Lambda
    url: https://docs.aws.amazon.com/lambda/latest/dg/configuration-response-streaming.html
