id: aipc01-1d-ctx-clarification-callback
objective: "1.6.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A mortgage company's pre-qualification assistant extracts income, property value, and loan amount from a customer's request. When a value is missing, the assistant must ask a clarifying question by email and resume when the customer replies, which can take several days. The company needs a durable record of every step of each case.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          An AWS Step Functions Express workflow in which a task with the .waitForTaskToken pattern waits for the customer's reply.
    - id: b
      text:
        en: |-
          A Lambda function that sends the question and then polls an Amazon DynamoDB table every minute until the customer's reply arrives.
    - id: c
      text:
        en: |-
          An Amazon SQS queue with a 15-minute delivery delay that repeatedly triggers a Lambda function to check whether the customer has replied.
    - id: d
      text:
        en: |-
          A Step Functions Standard workflow with a Choice state and a .waitForTaskToken task that pauses until SendTaskSuccess returns the reply.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      A Choice state detects the missing value, and a callback task pauses the Standard workflow until the backend calls SendTaskSuccess with the task token when the customer replies. Standard workflows can run for up to one year and keep the history of each execution.
  options:
    a:
      en: |-
        Express workflows support only the Request Response pattern and run for at most 5 minutes, so they cannot wait days for a callback.
    b:
      en: |-
        A Lambda function runs for at most 1,800 seconds, far less than several days, and polling wastes invocations.
    c:
      en: |-
        Repeated delayed messages are a polling loop with no workflow state or step-by-step execution history.
references:
  - title: "Discover service integration patterns in Step Functions - AWS Step Functions"
    url: https://docs.aws.amazon.com/step-functions/latest/dg/connect-to-resource.html
  - title: "Step Functions service quotas - AWS Step Functions"
    url: https://docs.aws.amazon.com/step-functions/latest/dg/service-quotas.html
