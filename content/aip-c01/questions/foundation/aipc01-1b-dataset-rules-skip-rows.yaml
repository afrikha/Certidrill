id: aipc01-1b-dataset-rules-skip-rows
objective: "1.3.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    An AWS Glue ETL job loads curated FAQ records into the S3 data source of an Amazon Bedrock knowledge base. The Evaluate Data Quality transform outputs the original data with row-level columns, and the job writes only rows whose DataQualityEvaluationResult is Passed. The ruleset contains IsComplete "answer", RowCount between 1000 and 50000, and Mean "answer_length" > 200. A partial run loaded 300 rows: the overall ruleset result was Failed, but every row was marked Passed and loaded. The company requires that no row of a run reaches the target when a dataset-level check fails.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Change the filter to load only rows whose DataQualityRulesFail column is empty, instead of filtering on DataQualityEvaluationResult.
    - id: b
      text:
        en: |-
          Replace the RowCount and Mean rules with dynamic rules that compare each value with the average of the last 10 runs.
    - id: c
      text:
        en: |-
          Set the Evaluate Data Quality transform's ruleset failure action to Fail job without loading to target data instead of None.
    - id: d
      text:
        en: |-
          Add analyzers for RowCount and answer_length, and enable anomaly detection so that anomalous runs are blocked from loading.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      Dataset-level rules such as RowCount and Mean cannot identify individual error records, so they appear in DataQualityRulesSkip and every complete row is marked Passed even though the ruleset fails. The Fail job without loading to target data action fails the job as soon as a data quality error occurs and loads no data targets, which blocks the whole run.
  options:
    a:
      en: |-
        Dataset-level rules are listed as skipped for each row, not failed, so DataQualityRulesFail stays empty and the 300 rows would still be loaded.
    b:
      en: |-
        Dynamic rules change the thresholds but remain dataset-level rules. They still cannot mark individual rows as failed, so the filter would still load every row.
    d:
      en: |-
        Anomalies are observations: they do not affect the data quality score or fail the job, so nothing would stop the load.
references:
  - title: Evaluating data quality for ETL jobs in AWS Glue Studio - AWS Glue
    url: https://docs.aws.amazon.com/glue/latest/dg/tutorial-data-quality.html
  - title: Anomaly detection in AWS Glue Data Quality - AWS Glue
    url: https://docs.aws.amazon.com/glue/latest/dg/data-quality-anomaly-detection.html
