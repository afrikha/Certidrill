id: aipc01-1e-flow-iterator-scale
objective: "1.6.6"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A media company built an Amazon Bedrock flow that receives an array of 4,000 article IDs each night, summarizes each article with a prompt node inside an Iterator node, and gathers the summaries with a Collector node. The flow is called with InvokeFlow and fails because it runs for more than one hour. All summaries must be ready within one hour of the start of the nightly job, and the number of articles is expected to triple next year.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Start the same flow with StartFlowExecution so that it runs asynchronously for up to 24 hours, and poll the execution status.
    - id: b
      text:
        en: |-
          Purchase Provisioned Throughput for the summarization model, and keep the flow with the Iterator and Collector nodes unchanged.
    - id: c
      text:
        en: |-
          Replace the Iterator node with a knowledge base node that returns the summaries of all the articles in a single response to the flow.
    - id: d
      text:
        en: |-
          Change the flow to summarize one article, and run it from a Step Functions Distributed Map whose Lambda function calls InvokeFlow per article.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      An Iterator node sends array items to the downstream nodes one by one, not in parallel, so the run time grows with the number of articles and exceeds the one-hour limit of InvokeFlow. A Distributed Map runs many child workflows in parallel, each invoking the flow for one article, with MaxConcurrency set within the model's quotas.
  options:
    a:
      en: |-
        Flow executions (in preview) allow up to 24 hours, but the items are still processed one at a time, so the summaries would not be ready within one hour.
    b:
      en: |-
        Dedicated capacity does not change the one-by-one processing of the Iterator, so the run time keeps growing with the article count.
    c:
      en: |-
        A knowledge base node runs one retrieval query and returns relevant chunks or one generated answer; it does not summarize each article.
references:
  - title: "Node types for your flow - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/flows-nodes.html
  - title: "Run Amazon Bedrock flows asynchronously with flow executions - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/flows-create-async.html
