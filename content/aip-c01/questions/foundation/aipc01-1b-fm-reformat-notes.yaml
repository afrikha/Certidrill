id: aipc01-1b-fm-reformat-notes
objective: "1.3.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Field technicians submit repair notes full of abbreviations, OCR errors and details in random order. A large foundation model in Amazon Bedrock analyzes each note, but its responses vary because the structure of the input varies. The company wants every note in a consistent structure (equipment, symptom, action taken, parts used) before the main analysis call. The solution must be cost-effective and must not require training a model.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Fine-tune the large model on 50,000 historical notes so that it learns to interpret the technicians' abbreviations and ordering.
    - id: b
      text:
        en: |-
          Set the temperature of the large model's analysis call to 0 so that it returns the same kind of response for every note.
    - id: c
      text:
        en: |-
          Call a small, low-cost Bedrock model with a JSON schema of the four fields to rewrite each note, and pass the JSON to the large model.
    - id: d
      text:
        en: |-
          Run Amazon Comprehend key phrase detection on each note, and pass the list of key phrases to the large model instead of the note.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      A pre-processing call to a small, inexpensive model can normalize messy text into a fixed structure; with structured outputs (outputConfig.textFormat with a JSON schema), the response conforms to the schema, so the main prompt always receives the same fields. No training is needed, and the extra cost is low compared with the large model's call.
  options:
    a:
      en: |-
        Fine-tuning is model training, which the company wants to avoid, and it does not give the input a consistent structure.
    b:
      en: |-
        A lower temperature reduces randomness for a given input, but different input structures still lead to different responses.
    d:
      en: |-
        Key phrases are an unordered list. They do not map the content to equipment, symptom, action and parts, and they lose details the analysis needs.
references:
  - title: Get validated JSON results from models - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/structured-output.html
