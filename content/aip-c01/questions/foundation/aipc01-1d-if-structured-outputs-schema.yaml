id: aipc01-1d-if-structured-outputs-schema
objective: "1.6.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A team enables structured outputs in its Converse requests to Amazon Bedrock. The JSON schema has a root object whose additionalProperties is false, and two nested objects, customer and claim, that do not set additionalProperties. Every request now fails with a 400 ValidationException before any output is generated. The client read timeout is already 180 seconds.

    Which change will fix the requests?
body:
  options:
    - id: a
      text:
        en: |-
          Set additionalProperties to false on the customer and claim objects as well as on the root object.
    - id: b
      text:
        en: |-
          Increase the client read timeout further so that the grammar for the new schema can finish compiling.
    - id: c
      text:
        en: |-
          Remove additionalProperties from the root object so that all objects use the default value.
    - id: d
      text:
        en: |-
          Add minLength and maxLength constraints to the string properties so that the schema is fully specified.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      With structured outputs, every object in the schema, including nested objects, must explicitly set additionalProperties to false; otherwise Amazon Bedrock returns a 400 ValidationException.
  options:
    b:
      en: |-
        Grammar compilation of a new schema can take about 90 seconds and calls for a timeout of at least 120 seconds, but a ValidationException is a schema error, not a timeout.
    c:
      en: |-
        Omitting additionalProperties is exactly what causes the error; it must be false on every object.
    d:
      en: |-
        String constraints such as minLength and maxLength are not supported by structured outputs and would not fix the error.
references:
  - title: "Get validated JSON results from models - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/structured-output.html
