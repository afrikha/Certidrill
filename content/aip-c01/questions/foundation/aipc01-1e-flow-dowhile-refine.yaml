id: aipc01-1e-flow-dowhile-refine
objective: "1.6.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A publishing company uses an Amazon Bedrock flow to write product descriptions. The flow must draft a description, score it with a judge prompt, and redraft it with the judge's feedback until the score is at least 8, with no more than 3 attempts. The company wants to build this without writing custom code.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Place the drafting and judge prompt nodes inside a DoWhile loop node with the condition score < 8 and maxIterations set to 3.
    - id: b
      text:
        en: |-
          Send an array of three copies of the request to an Iterator node that runs both prompts, and gather the drafts with a Collector node.
    - id: c
      text:
        en: |-
          Add an agent node that calls an agent in Amazon Bedrock Agents Classic and instructs it to redraft until the score reaches 8.
    - id: d
      text:
        en: |-
          Add a Lambda function node that calls the Converse API with both prompts in a loop until the score reaches 8 or 3 attempts run.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      A DoWhile loop node runs its body at least once and then repeats it while the condition stays true. The loop stops when the condition becomes false or when maxIterations is reached, so score < 8 with maxIterations 3 drafts until the judge is satisfied, with at most three attempts.
  options:
    b:
      en: |-
        An Iterator processes every array item, so all three drafts would always run, with no stop when the score reaches 8.
    c:
      en: |-
        Bedrock Agents Classic is closed to new customers, and an agent instruction is not a guaranteed limit of three attempts.
    d:
      en: |-
        The loop would be custom code in the Lambda function, which the company wants to avoid.
references:
  - title: "Node types for your flow - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/flows-nodes.html
