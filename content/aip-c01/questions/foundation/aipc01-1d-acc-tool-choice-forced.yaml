id: aipc01-1d-acc-tool-choice-forced
objective: "1.5.6"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A warranty assistant uses the Converse API with an Anthropic Claude model and two tools: search_warranty_docs, which calls the Retrieve operation, and create_ticket. On the claims screen, compliance requires that the model always searches the warranty documents before it answers the first message. On the other screens, the model must decide on its own whether to use a tool.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          On the claims screen, set toolChoice to tool with the name search_warranty_docs for the first request, and use auto on the other screens.
    - id: b
      text:
        en: |-
          Add a system prompt instruction on the claims screen that tells the model to always call search_warranty_docs before answering.
    - id: c
      text:
        en: |-
          Set toolChoice to any on the claims screen so that the model must request a tool before it answers.
    - id: d
      text:
        en: |-
          Set toolChoice to auto on every screen and give search_warranty_docs a description that says it is mandatory for claims.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      toolChoice tool forces the model to request the one tool that you name, so the first claims answer always starts with a document search; auto, the default, lets the model decide. Not every model supports any or tool, and an unsupported setting fails with a ValidationException, so the model must support forced tool use, as Anthropic Claude models do.
  options:
    b:
      en: |-
        A prompt instruction is guidance the model can skip; it does not guarantee that the tool is requested.
    c:
      en: |-
        any forces the model to request at least one tool, but it may choose create_ticket instead of the search tool.
    d:
      en: |-
        With auto the model still decides, so a description does not guarantee that the search happens.
references:
  - title: "Client-side tool use - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/tool-use-client-side.html
