id: aipc01-1b-document-block-name
objective: "1.3.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    An application sends uploaded PDF contracts to a model through the Amazon Bedrock Converse API in a document block with the format set to pdf, followed by a text block with the instruction. The application sets the name field to the uploaded file name, such as contract_2026.v2.pdf. Some requests fail with a ValidationException. The security team is also concerned that users could choose file names that the model interprets as instructions.

    What should the developer do to fix the requests and address the security concern?
body:
  options:
    - id: a
      text:
        en: |-
          Set the name field to a neutral generated value such as Contract 1, using only alphanumerics, single spaces, hyphens, parentheses and square brackets.
    - id: b
      text:
        en: |-
          Remove the format field and keep the file name in the name field, so that Amazon Bedrock detects the format from the extension.
    - id: c
      text:
        en: |-
          Send each contract in an image block with the format set to pdf, and keep the file name in the text block of the same message.
    - id: d
      text:
        en: |-
          Move the file name and the instruction into the system field, and send the document block alone in the user message.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      The name field accepts only alphanumeric characters, whitespace (no more than one in a row), hyphens, parentheses and square brackets, so underscores and periods cause validation errors. AWS also warns that the name is vulnerable to prompt injection and recommends a neutral name, which addresses the security concern.
  options:
    b:
      en: |-
        The format field must be specified: Amazon Bedrock does not infer the format from the name, and a request without it fails. The invalid characters in the name would still cause errors.
    c:
      en: |-
        Image blocks accept png, jpeg, gif and webp only. A PDF must be sent in a document block.
    d:
      en: |-
        A message that contains a document must also contain a text block with a prompt about the document, and moving the file name does not make it a safe value.
references:
  - title: DocumentBlock - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/APIReference/API_runtime_DocumentBlock.html
  - title: Inference using Converse API - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/conversation-inference.html
