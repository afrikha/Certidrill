id: aipc01-1b-agentic-retrieval-multihop
objective: "1.4.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    In November 2026, an engineering firm starts building an assistant over 40,000 project reports stored in a single S3 prefix. Many questions need several retrieval steps, for example "Which suppliers on project A also delivered late on project B?". The firm wants managed retrieval that decomposes such questions and reasons across several hops, and it wants the LEAST operational overhead.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Create an Amazon Bedrock Managed Knowledge Base with an S3 data source, and use agentic retrieval for the assistant's questions.
    - id: b
      text:
        en: |-
          Create a customer-managed knowledge base with an Amazon Neptune Analytics graph (GraphRAG) and one S3 data source for the 40,000 reports.
    - id: c
      text:
        en: |-
          Create a customer-managed knowledge base with an OpenSearch Serverless vector store, and raise the number of retrieved results to 100.
    - id: d
      text:
        en: |-
          Create an Amazon Kendra GenAI index for the reports, and connect it to a knowledge base that the assistant queries.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      Agentic retrieval, with multi-hop reasoning and query decomposition, is one of the capabilities available only in Managed Knowledge Bases, where Amazon Bedrock also manages ingestion, storage and retrieval infrastructure. It answers multi-step questions without a graph or orchestration for the firm to build.
  options:
    b:
      en: |-
        GraphRAG handles multi-step connections, but each data source holds up to 1,000 files (10,000 on request), so 40,000 reports in one data source do not fit, and the firm would operate the Neptune Analytics graph, which does not autoscale.
    c:
      en: |-
        More results add more passages to the context; they do not decompose a question or reason across hops.
    d:
      en: |-
        Amazon Kendra, including the GenAI index, closed to new customers on July 30, 2026, so it cannot be used for a new design.
references:
  - title: Retrieve data and generate AI responses with Amazon Bedrock Knowledge Bases - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/knowledge-base.html
  - title: Build a knowledge base with Amazon Neptune Analytics graphs - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/knowledge-base-build-graphs.html
