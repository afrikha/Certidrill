id: aipc01-1a-resil-sfn-max-delay
objective: "1.2.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    An AWS Step Functions workflow calls a model in Amazon Bedrock from a Task state with this retrier: ErrorEquals set to the throttling and capacity errors, IntervalSeconds 2, MaxAttempts 6, and BackoffRate 2.0. During capacity shortages, the last waits reach 32 and 64 seconds, and the workflow misses its completion target. The company wants to keep six attempts and exponential growth for the first retries, but no single wait may exceed 10 seconds. Hundreds of executions fail at the same moment, so their retries must also be spread out.

    Which change will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Set BackoffRate to 1.0 and IntervalSeconds to 10 so that every retry waits exactly 10 seconds.
    - id: b
      text:
        en: |-
          Reduce MaxAttempts to 3 so that the longest wait becomes 8 seconds, and keep the other fields unchanged.
    - id: c
      text:
        en: |-
          Set TimeoutSeconds to 10 on the Task state so that the workflow never waits more than 10 seconds for a model call.
    - id: d
      text:
        en: |-
          Add MaxDelaySeconds set to 10 and JitterStrategy set to FULL to the retrier, and keep the other fields unchanged.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      MaxDelaySeconds caps the wait that exponential backoff can grow to, so the computed waits become 2, 4 and 8 seconds and then 10 seconds for the remaining attempts. JitterStrategy FULL randomizes each wait between 0 and the computed interval, which spreads the retries of executions that failed at the same moment.
  options:
    a:
      en: |-
        A BackoffRate of 1.0 removes the exponential growth that the company wants to keep, and without jitter the executions still retry in lockstep.
    b:
      en: |-
        Three attempts break the requirement to keep six, and the retries of concurrent executions remain synchronized.
    c:
      en: |-
        TimeoutSeconds limits how long a call may run and raises States.Timeout; it does not change the waits between retries.
references:
  - title: Handling errors in Step Functions workflows - AWS Step Functions
    url: https://docs.aws.amazon.com/step-functions/latest/dg/concepts-error-handling.html
