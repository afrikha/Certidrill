id: aipc01-1a-poc-converse-usage-latency
objective: "1.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A team is comparing three candidate models in Amazon Bedrock during a proof of concept. Its test script already calls the Converse API for 200 sample questions with each model. For every call, the team must record the input tokens, the output tokens, and the latency that Amazon Bedrock reports. The team wants the LEAST additional effort.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Instrument the script with the AWS X-Ray SDK, and read the token counts and the latency from the trace segment of each call.
    - id: b
      text:
        en: |-
          Read the usage and metrics fields of each Converse response, and write inputTokens, outputTokens, and latencyMs to the results file.
    - id: c
      text:
        en: |-
          Enable model invocation logging to Amazon S3, and query the logs with Amazon Athena after each test run to extract the values.
    - id: d
      text:
        en: |-
          Call the CountTokens API before each request, and measure the latency with a timer around each Converse call in the script.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      Each Converse response contains a usage field with the input, output and total token counts, and a metrics field with the latency in milliseconds. The script already receives these values, so recording them is the smallest change.
  options:
    a:
      en: |-
        X-Ray adds instrumentation and a tracing setup to collect data that each response already contains.
    c:
      en: |-
        Invocation logging plus Athena tables and queries is extra setup for values that the script can read directly from the responses.
    d:
      en: |-
        CountTokens covers input tokens only, and a client-side timer includes network time instead of the latency that Bedrock reports.
references:
  - title: Inference using Converse API - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/conversation-inference.html
