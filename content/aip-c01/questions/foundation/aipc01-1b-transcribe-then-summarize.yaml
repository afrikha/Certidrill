id: aipc01-1b-transcribe-then-summarize
objective: "1.3.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A contact center stores MP3 recordings of its calls in an S3 bucket. Every night, the company wants a foundation model in Amazon Bedrock to write a summary and a list of action items for each call, and to store them in Amazon DynamoDB.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Transcribe each recording with an Amazon Transcribe batch job, and send each transcript to the Bedrock model with a summarization prompt.
    - id: b
      text:
        en: |-
          Send each MP3 file to the Bedrock model in a Converse document block with a summarization prompt, and write the model's response to DynamoDB.
    - id: c
      text:
        en: |-
          Run Amazon Comprehend entity detection jobs on the MP3 files, and send the detected entities to the Bedrock model to write the summaries.
    - id: d
      text:
        en: |-
          Convert each recording with Amazon Polly, and send the output of Polly to the Bedrock model with a summarization prompt before writing the result to DynamoDB.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      Amazon Transcribe converts speech in audio files stored in S3 into text with batch transcription jobs. The text transcript is then a normal input for a text model, which writes the summary and action items.
  options:
    b:
      en: |-
        Document blocks accept document formats such as pdf, csv, docx, html, txt and md. Audio is not a document format.
    c:
      en: |-
        Comprehend analyzes text, not audio, so it cannot read MP3 files, and a list of entities is not enough to summarize a call.
    d:
      en: |-
        Amazon Polly turns text into speech. It does the opposite of what the pipeline needs.
references:
  - title: DocumentBlock - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/APIReference/API_runtime_DocumentBlock.html
  - title: Partitioning speakers (diarization) - Amazon Transcribe
    url: https://docs.aws.amazon.com/transcribe/latest/dg/diarization.html
