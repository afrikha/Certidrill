id: aipc01-1b-entity-canonical-ids
objective: "1.3.4"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    A procurement assistant answers questions about supplier emails with a foundation model in Amazon Bedrock. The same supplier appears as "ACME Corp", "Acme Corporation" or "ACME", and the model treats these as different suppliers, so totals per supplier are inconsistent. The company has a supplier master table in Amazon DynamoDB with a canonical ID, a canonical name and the known aliases of each supplier.

    Which combination of steps will make the model's answers consistent? (Choose two.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Set the temperature of the model to 0 so that it groups the supplier names in the same way for every request.
    - id: b
      text:
        en: |-
          Detect the ORGANIZATION entities in each email with Amazon Comprehend DetectEntities before the prompt is built.
    - id: c
      text:
        en: |-
          Train an Amazon Comprehend custom entity recognizer with one entity type for each supplier in the master table.
    - id: d
      text:
        en: |-
          Use a Lambda function to look up each detected name in the master table and replace it with the canonical supplier ID and name.
    - id: e
      text:
        en: |-
          Add the known aliases to an Amazon Bedrock Guardrails word filter so that alias names are blocked in the model's input.
answer: { optionIds: [b, d] }
explanation:
  correct:
    en: |-
      DetectEntities already recognizes organizations, with offsets and confidence scores, so the supplier mentions can be found without training. A deterministic lookup against the master table then maps every alias to one canonical ID and name, so the model receives the same identifier for the same supplier every time.
  options:
    a:
      en: |-
        A temperature of 0 reduces randomness, but the model still sees three different names and has no reliable way to know they are one supplier.
    c:
      en: |-
        ORGANIZATION is a built-in entity type, so training is unnecessary, and a recognizer detects mentions without mapping them to a canonical ID.
    e:
      en: |-
        Blocking alias names rejects or hides the mentions instead of normalizing them, so the supplier information would be lost.
references:
  - title: Entities - Amazon Comprehend
    url: https://docs.aws.amazon.com/comprehend/latest/dg/how-entities.html
