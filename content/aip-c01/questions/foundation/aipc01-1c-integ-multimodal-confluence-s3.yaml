id: aipc01-1c-integ-multimodal-confluence-s3
objective: "1.4.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A training provider has a customer-managed Amazon Bedrock knowledge base that uses Amazon Nova Multimodal Embeddings. An existing Confluence data source ingests course pages, but the training videos attached to those pages never appear in retrieval results. The provider wants learners to retrieve relevant video segments together with the page text.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Switch the parser of the Confluence data source to the Amazon Bedrock Data Automation parser so that the videos are transcribed during each sync.
    - id: b
      text:
        en: |-
          Create a second Confluence data source dedicated to page attachments, and enable multimodal processing on it.
    - id: c
      text:
        en: |-
          Copy the videos to an S3 bucket on a schedule, and add the bucket as an S3 data source of the same knowledge base.
    - id: d
      text:
        en: |-
          Change the chunking strategy of the Confluence data source to no chunking so that each video is stored as a single chunk.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      Multimodal content such as images, audio, and video is supported only with Amazon S3 and custom data sources; other data source types skip these files during ingestion. Placing the videos in an S3 data source lets the multimodal embedding model index them in the same knowledge base as the pages.
  options:
    a:
      en: |-
        The Confluence connector skips video files whatever the parser, so the parser never receives them.
    b:
      en: |-
        New Confluence connectors cannot be created on customer-managed knowledge bases since September 30, 2026, and a Confluence connector would still skip multimodal files.
    d:
      en: |-
        Chunking applies to content the connector ingests; the skipped videos never reach the chunking step.
references:
  - title: "Connect a data source to your knowledge base - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/data-source-connectors.html
  - title: "How content chunking works for knowledge bases - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/kb-chunking.html
