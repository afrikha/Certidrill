id: aipc01-1b-reasoning-signature-history
objective: "1.3.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A research assistant uses a reasoning-capable model through the Amazon Bedrock Converse API. Each assistant message in the history contains a reasoningContent block with a signature, followed by the answer text. To reduce input tokens, a developer changed the application to shorten the reasoning text of earlier assistant messages before sending the next request. Since the change, multi-turn requests fail with an error.

    What should the developer do to fix the multi-turn requests?
body:
  options:
    - id: a
      text:
        en: |-
          Remove the reasoningContent blocks from every earlier assistant message and keep only their answer text in the conversation history.
    - id: b
      text:
        en: |-
          Send every earlier message unchanged, including each reasoningContent block with its signature, in the subsequent Converse requests.
    - id: c
      text:
        en: |-
          Keep the shortened reasoning text, and copy the signature from the original reasoningContent block into each shortened block.
    - id: d
      text:
        en: |-
          Keep the shortened reasoning text, and compute a new signature for each shortened block by hashing its text in the application.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      The signature is a hash of all the messages in the conversation that protects the model's reasoning against tampering. The application must include the signature and all previous messages in subsequent Converse requests, and if any of the messages is changed, the request returns an error.
  options:
    a:
      en: |-
        Removing the blocks changes the earlier messages, which the signature check rejects, so the requests would still fail.
    c:
      en: |-
        The original signature no longer matches the shortened messages, so the tampering check fails.
    d:
      en: |-
        The signature is produced by the service as a safeguard; a hash computed by the application is not a valid signature.
references:
  - title: Inference using Converse API - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/conversation-inference.html
