id: aipc01-1b-registry-approval-deploy
objective: "1.2.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company fine-tunes a domain-specific LLM with a SageMaker AI project that was created from a SageMaker-provided project template. The model building pipeline registers each new model version in a SageMaker Model Registry model package group with the PendingManualApproval status. The template's deployment pipeline deploys model versions to the staging and production endpoints. After a reviewer checks the evaluation metrics of version 7, the version must be deployed without any manual deployment steps.

    What should the reviewer do?
body:
  options:
    - id: a
      text:
        en: |-
          Update the model approval status of version 7 from PendingManualApproval to Approved in the model package group.
    - id: b
      text:
        en: |-
          Attach a resource policy to the model package group that grants the deployment pipeline's role access to version 7.
    - id: c
      text:
        en: |-
          Create a new endpoint configuration that references version 7, and call UpdateEndpoint on the staging and production endpoints.
    - id: d
      text:
        en: |-
          Change the status of the currently deployed version to Rejected so that the deployment pipeline deploys the newest registered version.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      With the SageMaker-provided project templates, changing a model version from PendingManualApproval to Approved starts the CI/CD deployment of that version. The approval status is the gate between registration and deployment, so the reviewer only has to approve version 7.
  options:
    b:
      en: |-
        A resource policy controls who can access the model package group, for example from another account. It does not start a deployment.
    c:
      en: |-
        Creating an endpoint configuration and updating the endpoints is a manual deployment, which the requirement excludes, and it bypasses the project's deployment pipeline.
    d:
      en: |-
        Rejecting the approved version makes the pipeline deploy the latest version whose status is Approved. Version 7 is still PendingManualApproval, so an older approved version would be deployed instead.
references:
  - title: Update the Approval Status of a Model - Amazon SageMaker AI
    url: https://docs.aws.amazon.com/sagemaker/latest/dg/model-registry-approve.html
  - title: Model Registration Deployment with Model Registry - Amazon SageMaker AI
    url: https://docs.aws.amazon.com/sagemaker/latest/dg/model-registry.html
