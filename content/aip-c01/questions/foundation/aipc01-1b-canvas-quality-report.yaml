id: aipc01-1b-canvas-quality-report
objective: "1.3.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Business analysts who do not write code are preparing a tabular dataset of customer interactions from Amazon S3 and Amazon Athena. The dataset will become the prompt examples of a fine-tuning job. The analysts must join the two sources, see automatically detected quality issues such as missing values, duplicates and outliers, fix them with visual transforms, and export the result to Amazon S3.

    Which solution will meet these requirements with the LEAST coding?
body:
  options:
    - id: a
      text:
        en: |-
          Write an AWS Glue ETL job in script mode that joins the sources, evaluates a DQDL ruleset, and writes the cleaned dataset to Amazon S3.
    - id: b
      text:
        en: |-
          Run an Amazon SageMaker Processing job with a scikit-learn script that joins the sources, removes bad rows, and writes the result to Amazon S3.
    - id: c
      text:
        en: |-
          Build a Data Wrangler data flow in Amazon SageMaker Canvas, generate a Data Quality and Insights Report, apply built-in transforms, and export to Amazon S3.
    - id: d
      text:
        en: |-
          Create Amazon Athena views that filter incomplete rows, and visualize missing values and duplicates in an AWS Quick dashboard before exporting the views.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      Data Wrangler is now accessed through SageMaker Canvas. A data flow combines datasets from several sources, the Data Quality and Insights Report automatically verifies data quality and detects abnormalities, built-in transforms clean the data with little or no code, and the flow exports to destinations such as Amazon S3.
  options:
    a:
      en: |-
        A script-mode ETL job is code that the analysts would have to write, and DQDL rules check conditions that someone defines instead of detecting issues automatically.
    b:
      en: |-
        A Processing job runs a script on managed infrastructure. Writing and maintaining that script is coding work.
    d:
      en: |-
        Athena views require SQL, and a dashboard only shows issues; neither detects outliers automatically nor provides visual transforms to fix the data.
references:
  - title: Data preparation - Amazon SageMaker AI
    url: https://docs.aws.amazon.com/sagemaker/latest/dg/canvas-data-prep.html
