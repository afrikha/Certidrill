id: aipc01-1a-std-cost-attribution-logs
objective: "1.1.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A platform team provides shared access to a foundation model in Amazon Bedrock for six product teams in one AWS account. Finance needs the monthly model cost of each team in AWS Cost Explorer. Operations needs to filter model invocation logs by team when it investigates incidents. All teams call the Converse API.

    Which combination of steps will meet these requirements? (Choose two.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Create one Amazon Bedrock guardrail per team, and tag each guardrail with the team name as a cost allocation tag.
    - id: b
      text:
        en: |-
          Create an application inference profile per team from the model, tag it with the team name for cost allocation, and have each team call its profile.
    - id: c
      text:
        en: |-
          Create one Amazon CloudWatch dashboard per team from the InvocationCount metric of the model in the AWS/Bedrock namespace.
    - id: d
      text:
        en: |-
          Have all teams call the model through the global cross-Region inference profile so that Cost Explorer reports usage per team.
    - id: e
      text:
        en: |-
          Set requestMetadata in each Converse request with the team identifier so that invocation logs can be filtered by team.
answer: { optionIds: [b, e] }
explanation:
  correct:
    en: |-
      An application inference profile created from a model tracks the usage and cost of the requests sent through it, and its tags are used for cost allocation. The Converse API accepts requestMetadata key-value pairs that are recorded for filtering model invocation logs.
  options:
    a:
      en: |-
        A guardrail's tags do not split the model invocation charges, so Cost Explorer still shows one model cost.
    c:
      en: |-
        A model-level metric aggregates every team's calls and shows request counts, not costs in Cost Explorer.
    d:
      en: |-
        A system-defined cross-Region profile is shared by everyone in the account and does not identify teams.
references:
  - title: Create an application inference profile - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/inference-profiles-create.html
  - title: Inference using Converse API - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/conversation-inference.html
