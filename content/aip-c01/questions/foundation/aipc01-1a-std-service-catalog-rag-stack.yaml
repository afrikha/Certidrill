id: aipc01-1a-std-service-catalog-rag-stack
objective: "1.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A platform team has built an approved AWS CloudFormation template for a RAG application stack: an Amazon Bedrock knowledge base, an encrypted S3 bucket, VPC endpoints, IAM roles, and model invocation logging. Product teams in 25 accounts of the same organization in AWS Organizations must be able to launch the stack themselves without having permissions to create the underlying resources directly. When the platform team updates the template, the update must become available in all accounts without redeploying copies.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Add the template as a product to an AWS Service Catalog portfolio with a launch constraint, and share the portfolio through AWS Organizations.
    - id: b
      text:
        en: |-
          Deploy the template to all 25 accounts with CloudFormation StackSets, and give the product teams permissions to update the stack instances.
    - id: c
      text:
        en: |-
          Store the template in a shared S3 bucket, and grant the product teams IAM permissions to create every resource in the template.
    - id: d
      text:
        en: |-
          Publish the template on an internal wiki page, and ask the product teams to copy it into their own deployment pipelines.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      Sharing a Service Catalog portfolio through AWS Organizations shares a reference that stays in sync with the original, so product updates propagate to the importing accounts. A launch constraint makes Service Catalog provision resources with a launch role, so end users launch the product without permissions on the underlying resources.
  options:
    b:
      en: |-
        StackSets deploy copies that must be redeployed for each update, and the teams would need permissions to change the resources themselves.
    c:
      en: |-
        Granting teams permissions to create every resource directly is exactly what the requirement forbids, and copies drift from the approved template.
    d:
      en: |-
        Copied templates drift and are not updated centrally, and the teams would still need direct permissions to deploy them.
references:
  - title: Sharing and Importing Portfolios - AWS Service Catalog
    url: https://docs.aws.amazon.com/servicecatalog/latest/adminguide/catalogs_portfolios_sharing.html
