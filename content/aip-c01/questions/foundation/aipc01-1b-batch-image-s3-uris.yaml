id: aipc01-1b-batch-image-s3-uris
objective: "1.3.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A retailer runs an Amazon Bedrock batch inference job with the Converse invocation type to write captions for 50,000 product images. Each JSONL record has a recordId and a modelInput whose user message contains a text block and an image block that references the image by its S3 location. The JSONL file is in s3://batch-input/jobs/june/, the images are in s3://product-media/images/, and the job's InputDataConfig points to s3://batch-input/jobs/june/records.jsonl. The job fails to read the images.

    What should the company do to fix the job?
body:
  options:
    - id: a
      text:
        en: |-
          Replace each image reference with the Base64-encoded image text inside the text block of the record, and keep the current InputDataConfig.
    - id: b
      text:
        en: |-
          Grant the batch inference service role read access to the product-media bucket, and keep the images and the InputDataConfig unchanged.
    - id: c
      text:
        en: |-
          Copy the images into s3://batch-input/jobs/june/, update the references, and point InputDataConfig to the s3://batch-input/jobs/june/ folder.
    - id: d
      text:
        en: |-
          Split the records into one JSONL file per image in the product-media bucket, and point InputDataConfig to each file in turn.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      When prompts of a batch inference job use S3 URIs, all the resources must be in the same S3 bucket and folder, and InputDataConfig must point to that folder rather than to an individual .jsonl file. Moving the images next to the JSONL file and pointing to the folder meets both rules.
  options:
    a:
      en: |-
        Image data placed in a text block is read as text, not as an image, so the model could not see the products.
    b:
      en: |-
        Permissions alone do not satisfy the rule that the referenced resources must be in the same bucket and folder as the input, and InputDataConfig still points to a single file.
    d:
      en: |-
        Thousands of one-record jobs would be impractical, and each would still reference images that are not in the input folder.
references:
  - title: Format and upload your batch inference data - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/batch-inference-data.html
