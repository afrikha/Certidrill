id: aipc01-1d-qh-expansion-jargon
objective: "1.5.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company's internal assistant uses the Retrieve operation on an Amazon Bedrock knowledge base of HR and IT policies. Employees use internal acronyms and nicknames, such as "PTO", "WFH", and project code names, while the policies use formal terms. Many queries retrieve nothing useful. The documents cannot be edited, and the company maintains a glossary of the internal terms.

    Which solution will improve retrieval for these queries?
body:
  options:
    - id: a
      text:
        en: |-
          Enable query decomposition so that each acronym in the question is searched as a separate sub-query.
    - id: b
      text:
        en: |-
          Have a Bedrock model expand each query with the glossary's terms, retrieve for each variant, and rerank the results.
    - id: c
      text:
        en: |-
          Re-ingest the policies with semantic chunking so that the chunks follow the topic boundaries of each policy.
    - id: d
      text:
        en: |-
          Increase numberOfResults so that more chunks are returned for each query that contains an acronym.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      Query expansion rewrites a short or jargon-heavy query into variants with synonyms and formal terms before retrieval. Retrieving for each variant and reranking the union with the Rerank operation brings back the policy passages that the original wording missed, without changing the documents.
  options:
    a:
      en: |-
        Decomposition splits compound questions into parts; it does not translate internal acronyms into the vocabulary of the documents.
    c:
      en: |-
        Chunking changes how documents are split at ingestion; the mismatch is in the query vocabulary.
    d:
      en: |-
        More results for a query that does not match the documents' vocabulary only add irrelevant chunks.
references:
  - title: "Rerank - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/APIReference/API_agent-runtime_Rerank.html
  - title: "Retrieve - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/APIReference/API_agent-runtime_Retrieve.html
