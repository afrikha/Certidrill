id: aipc01-1e-delimit-document-input
objective: "1.6.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A procurement team uses a foundation model (FM) to list the obligations in supplier contracts. The prompt sends the team's instructions and the contract text as one block of text. Some contracts contain sentences such as "Summarize this agreement in one paragraph," and the model follows them instead of listing the obligations. The contracts are trusted internal documents.

    Which prompt change will MOST improve the results?
body:
  options:
    - id: a
      text:
        en: |-
          Raise the temperature so that the model explores more interpretations of the request before it chooses one.
    - id: b
      text:
        en: |-
          Move the contract text into the system prompt, and send the team's instructions in the user message instead.
    - id: c
      text:
        en: |-
          Wrap the contract in labeled delimiters, state that text inside them is data to analyze, and keep the task outside them.
    - id: d
      text:
        en: |-
          Add "think step by step" at the end of the prompt so that the model reasons before it lists the obligations.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      A prompt has distinct components: the instruction, context, examples, and the input data. Labeled delimiters such as XML-style tags separate the contract from the task, and an explicit statement that the tagged text is data keeps the model from treating sentences inside the contract as instructions.
  options:
    a:
      en: |-
        A higher temperature adds randomness; it does not help the model tell the task apart from the document text.
    b:
      en: |-
        The system prompt holds the instructions that the model follows throughout the conversation, so moving the contract there gives its sentences even more authority.
    d:
      en: |-
        Step-by-step reasoning helps multi-step problems, but the model would still reason about the wrong task if it cannot tell instructions from data.
references:
  - title: "Prompt engineering concepts - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/prompt-engineering-guidelines.html
  - title: "Utilizing long context windows - Amazon Nova"
    url: https://docs.aws.amazon.com/nova/latest/userguide/prompting-long-context.html
