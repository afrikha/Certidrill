id: aipc01-1e-validation-metric-anomaly
objective: "1.6.4"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A travel company validates every response of its itinerary assistant with an AWS Lambda function that checks the JSON structure and business rules. After a recent model change, the share of responses that failed validation rose for two days before anyone noticed. Traffic and the normal failure rate vary strongly by hour of day and day of week. The company wants an alert when the failure rate becomes abnormal for a given prompt version.

    Which combination of steps will meet these requirements? (Choose two.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Have the validation function write CloudWatch embedded metric format logs that publish failure and response counts with a PromptVersion dimension.
    - id: b
      text:
        en: |-
          Create a CloudWatch alarm with a static threshold on the AWS/Bedrock InvocationClientErrors metric of the model that the assistant invokes.
    - id: c
      text:
        en: |-
          Turn on AWS X-Ray active tracing for the validation function, and have an engineer review the trace map of the application every day.
    - id: d
      text:
        en: |-
          Create a CloudWatch alarm that applies anomaly detection to a metric math expression of the failure rate and fires above the band.
    - id: e
      text:
        en: |-
          Turn on CloudTrail Insights for the account trail to detect unusual volumes of Converse API calls from the application's IAM role.
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: |-
      The embedded metric format lets the Lambda function emit custom metrics in its structured logs with no extra API calls, and a PromptVersion dimension separates the versions. CloudWatch anomaly detection models hourly, daily and weekly patterns and can be applied to a metric math expression such as failures divided by responses, so the alarm fires only when the rate leaves its expected band.
  options:
    b:
      en: |-
        Responses that fail validation are successful API calls, so client error metrics stay flat, and a static threshold ignores the hourly and weekly pattern.
    c:
      en: |-
        Traces show latency and call paths; they do not measure validation failures, and a daily review is not an alert.
    e:
      en: |-
        CloudTrail Insights detects unusual API call volumes, not a change in the quality of successful responses.
references:
  - title: "Embedding metrics within logs - Amazon CloudWatch"
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/CloudWatch_Embedded_Metric_Format.html
  - title: "Using CloudWatch anomaly detection - Amazon CloudWatch"
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/CloudWatch_Anomaly_Detection.html
