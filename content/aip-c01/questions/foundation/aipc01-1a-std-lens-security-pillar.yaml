id: aipc01-1a-std-lens-security-pillar
objective: "1.1.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company applies the AWS Well-Architected Generative AI Lens to an agent that can call internal APIs. The review must cover how the agent is prevented from taking actions beyond its intended scope (excessive agency), how prompts are secured, and how harmful outputs are mitigated.

    Under which pillar of the Generative AI Lens are these focus areas reviewed?
body:
  options:
    - id: a
      text:
        en: |-
          Security
    - id: b
      text:
        en: |-
          Operational excellence
    - id: c
      text:
        en: |-
          Reliability
    - id: d
      text:
        en: |-
          Performance efficiency
answer: { optionId: a }
explanation:
  correct:
    en: |-
      In the Generative AI Lens, the Security pillar covers protecting endpoints, mitigating harmful outputs and excessive agency, monitoring and auditing, securing prompts, and remediating model poisoning.
  options:
    c:
      en: |-
        Reliability covers throughput, component communication, graceful failure handling, artifact versioning and distributed inference.
    b:
      en: |-
        Operational excellence covers consistent output quality, operational health, traceability, lifecycle automation and when to customize models.
    d:
      en: |-
        Performance efficiency covers model performance, compute optimization and data retrieval.
references:
  - title: Generative AI Lens - AWS Well-Architected Framework - Generative AI Lens
    url: https://docs.aws.amazon.com/wellarchitected/latest/generative-ai-lens/generative-ai-lens.html
