id: aipc01-1a-design-serverless-open-weights
objective: "1.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A software company wants to add a meeting-summary feature to its SaaS product. Its legal team approved only Meta Llama 3.3 70B Instruct, used as published without any customization, and the model is offered as a serverless model in Amazon Bedrock in the company's Region. The company has no machine learning operations staff, and usage will grow unpredictably after launch.

    Which solution will meet these requirements with the LEAST operational overhead?
body:
  options:
    - id: a
      text:
        en: |-
          Download the published Llama 3.3 70B Instruct weights to Amazon S3, import them with Amazon Bedrock Custom Model Import, and invoke the imported model.
    - id: b
      text:
        en: |-
          Deploy Llama 3.3 70B Instruct from SageMaker JumpStart to a SageMaker AI real-time endpoint with an auto scaling policy on GPU instances.
    - id: c
      text:
        en: |-
          Run Llama 3.3 70B Instruct on an Amazon EKS cluster with GPU nodes and an open-source inference server, scaled by the Kubernetes autoscaler.
    - id: d
      text:
        en: |-
          Call Llama 3.3 70B Instruct in Amazon Bedrock on demand with the Converse API, and pay per token without provisioning any capacity.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      A serverless Bedrock model is called through one API with no infrastructure to provision, scale or patch, and on-demand inference bills only for the tokens processed, which suits unpredictable growth. The Converse API also keeps the code ready for a later model change.
  options:
    a:
      en: |-
        Custom Model Import is for weights customized elsewhere; for a current open-weights model used without customization, AWS recommends checking the Bedrock model catalog first.
    b:
      en: |-
        A real-time endpoint means choosing, scaling and paying for GPU instances, which is more operational work than a serverless model.
    c:
      en: |-
        A self-managed EKS cluster with GPU nodes is the highest operational overhead of the options.
references:
  - title: Use Custom model import to import a customized open-source model into Amazon Bedrock - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/model-customization-import-model.html
  - title: Models at a glance - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/model-cards.html
