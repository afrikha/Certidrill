id: aipc01-1d-adv-rerank-region
objective: "1.5.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A healthcare company runs its RAG application in the us-east-1 Region only, and its data residency policy forbids processing in any other Region. The application calls the Retrieve operation on an Amazon Bedrock knowledge base. The team configured reranking with the model ID amazon.rerank-v1:0, and the requests fail.

    Which solution will add reranking while meeting the residency policy?
body:
  options:
    - id: a
      text:
        en: |-
          Call Amazon Rerank 1.0 in us-west-2 through a Lambda function and return the reranked results to us-east-1.
    - id: b
      text:
        en: |-
          Purchase Provisioned Throughput for Amazon Rerank 1.0 in us-east-1 and reference the provisioned model ARN.
    - id: c
      text:
        en: |-
          Use Cohere Rerank 3.5 (cohere.rerank-v3-5:0) as the reranker model in the retrieval configuration.
    - id: d
      text:
        en: |-
          Rerank the results with a cross-encoder model that the team deploys on an Amazon SageMaker AI endpoint in us-west-2.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      Amazon Rerank 1.0 is not supported in US East (N. Virginia); Cohere Rerank 3.5 is the reranker model available in that Region. Using it in the Retrieve configuration keeps all processing in us-east-1.
  options:
    a:
      en: |-
        Sending queries and chunks to us-west-2 breaks the policy that forbids processing outside us-east-1.
    b:
      en: |-
        Amazon Rerank 1.0 is not offered in us-east-1, so there is no model to provision there.
    d:
      en: |-
        A SageMaker AI endpoint in us-west-2 also processes the data outside the allowed Region, and adds an endpoint to operate.
references:
  - title: "Supported Regions and models for reranking in Amazon Bedrock - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/rerank-supported.html
  - title: "Improve the relevance of query responses with a reranker model in Amazon Bedrock - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/rerank.html
