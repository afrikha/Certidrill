id: aipc01-1c-maint-metadata-only-reembed
objective: "1.4.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company's Amazon Bedrock knowledge base ingests 500,000 PDF reports from an S3 data source with fixed-size chunking. Each report has a .metadata.json file with a business_unit attribute. A custom transformation Lambda function also runs at the POST_CHUNKING step, only to copy business_unit into the metadata of every chunk. When business units are reorganized, only the metadata files change, yet the nightly syncs re-embed every affected report and drive up embedding costs.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Keep the Lambda function, and set includeForEmbedding to false for business_unit so that the attribute no longer affects the vectors.
    - id: b
      text:
        en: |-
          Switch the data source to semantic chunking so that chunk boundaries stay stable when only the business unit changes.
    - id: c
      text:
        en: |-
          Remove the custom transformation function, and rely on the business_unit attribute of each .metadata.json file, which applies to every chunk of the report.
    - id: d
      text:
        en: |-
          Replace the nightly sync with IngestKnowledgeBaseDocuments calls for every report whose business unit changed.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      A sync can update metadata without re-embedding when only the metadata files changed, the content files are not CSV files, and the data source does not use a custom transformation Lambda function. File-level attributes already apply to all chunks of a document, so the function adds nothing here, and removing it lets reorganizations skip re-embedding.
  options:
    a:
      en: |-
        While a custom transformation function is configured, metadata changes still re-ingest the documents, whatever the includeForEmbedding value.
    b:
      en: |-
        Semantic chunking calls a foundation model during ingestion, which adds cost, and the function would still force re-ingestion.
    d:
      en: |-
        Direct ingestion re-processes each submitted document in full, so the changed reports are still re-embedded.
references:
  - title: "Sync your data with your Amazon Bedrock knowledge base - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/kb-data-source-sync-ingest.html
  - title: "Use a custom transformation Lambda function to define how your data is ingested - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/kb-custom-transformation.html
