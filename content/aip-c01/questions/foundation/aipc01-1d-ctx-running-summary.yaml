id: aipc01-1d-ctx-running-summary
objective: "1.6.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A software company's support chatbot holds long troubleshooting conversations of more than 200 turns. Sending the full history in each Converse request now exceeds the model's context window and keeps increasing cost. Facts given early in a conversation, such as the product version and error message, must remain available to the model.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Send the last few turns verbatim with a running summary of older turns that a smaller, cheaper model maintains.
    - id: b
      text:
        en: |-
          Send only the last 10 turns in each request and discard the older turns to keep the prompt small.
    - id: c
      text:
        en: |-
          Switch to the model with the largest available context window and keep sending the full history in each request.
    - id: d
      text:
        en: |-
          Ingest each turn into an Amazon Bedrock knowledge base and start a sync after every message.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      A sliding window of recent turns plus a compact summary of everything older keeps the prompt within the context window and cost bounded, while early facts survive in the summary. Updating the summary with a small, inexpensive model keeps the added cost low.
  options:
    b:
      en: |-
        Truncating the history drops the early facts that must remain available.
    c:
      en: |-
        A larger window postpones the limit but cost keeps growing with every turn, and long conversations can still exceed it.
    d:
      en: |-
        Running an ingestion job after each message is slow and costly, and retrieval does not guarantee that the key facts are returned.
references:
  - title: "Converse - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/APIReference/API_runtime_Converse.html
