id: aipc01-1a-fm-automatic-robustness
objective: "1.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A news company must choose between three foundation models in Amazon Bedrock for summarizing articles. Editors care that the summaries stay consistent when articles contain small typos or formatting changes. The team wants a computed robustness score for each model, with no judge model and no human reviewers, at the lowest evaluation cost.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Create an LLM-as-a-judge evaluation job with a custom metric that asks the judge model to rate the consistency of each summary.
    - id: b
      text:
        en: |-
          Create automatic model evaluation jobs with the text summarization task type and the robustness metric for each model.
    - id: c
      text:
        en: |-
          Create a RAG evaluation job of the retrieve-and-generate type with the articles stored in an Amazon Bedrock knowledge base.
    - id: d
      text:
        en: |-
          Create automatic model evaluation jobs with the general text generation task type and the toxicity metric for each model.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      Automatic (programmatic) evaluation jobs compute metrics without a judge model or human workers. For the text summarization task type, the robustness metric is computed with BERTScore and deltaBERTScore, which measures how much the output changes when the input is slightly perturbed.
  options:
    a:
      en: |-
        A judge model adds inference cost for every response and returns a judged rating, not the computed robustness score the team asked for.
    c:
      en: |-
        RAG evaluation measures retrieval and generation from a knowledge base; it does not test the models' sensitivity to input perturbations.
    d:
      en: |-
        Toxicity measures harmful content, not consistency under small input changes, and summarization has its own task type.
references:
  - title: Model evaluation task types in Amazon Bedrock - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/model-evaluation-tasks.html
