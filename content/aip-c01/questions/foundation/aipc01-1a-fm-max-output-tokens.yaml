id: aipc01-1a-fm-max-output-tokens
objective: "1.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A consulting firm wants a foundation model in Amazon Bedrock to generate complete due-diligence reports of about 40,000 tokens in a single response. The input of each request is a few thousand tokens of structured notes, and every shortlisted model has a context window of at least 128,000 tokens. The team uses the model cards to eliminate candidates before it runs evaluations.

    Which model card value determines whether a candidate can produce each report in one response?
body:
  options:
    - id: a
      text:
        en: |-
          The context window, which must be at least 40,000 tokens larger than the longest input of the notes.
    - id: b
      text:
        en: |-
          The knowledge cutoff date, which must be later than the date of the most recent notes that the firm sends.
    - id: c
      text:
        en: |-
          The maximum output tokens value, which must be at least 40,000 tokens for the model to return a full report.
    - id: d
      text:
        en: |-
          The earliest end-of-life date, which must be later than the date when the firm plans to deliver the reports.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      Model cards list both the context window and the maximum output tokens. The maximum output tokens value caps the length of one response regardless of the context window; for example, the Claude Haiku 4.5 card lists a 200K-token context window and 64K maximum output tokens.
  options:
    a:
      en: |-
        With inputs of a few thousand tokens and context windows of at least 128,000 tokens, the context window is not the binding limit; the output cap is.
    b:
      en: |-
        The notes are supplied in the prompt, so the model's knowledge cutoff does not limit the length of the report.
    d:
      en: |-
        Lifecycle dates matter for adoption and migration planning, not for how long a single response can be.
references:
  - title: Claude Haiku 4.5 - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/model-card-anthropic-claude-haiku-4-5.html
