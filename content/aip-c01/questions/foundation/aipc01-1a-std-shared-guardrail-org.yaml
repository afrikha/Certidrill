id: aipc01-1a-std-shared-guardrail-org
objective: "1.1.3"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    A company's security account owns an Amazon Bedrock guardrail with the approved content, denied-topic and PII policies. Application roles in 30 member accounts of the same organization in AWS Organizations call InvokeModel and InvokeModelWithResponseStream directly. Every call must use version 3 of that guardrail, and teams must not be able to call models without it or with another version. The company does not want to maintain copies of the guardrail.

    Which combination of steps will meet these requirements? (Choose two.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Attach a resource-based policy to the guardrail that allows the organization's member accounts to use it.
    - id: b
      text:
        en: |-
          Recreate the guardrail in each member account from a CloudFormation template, and reference the local guardrail in each application.
    - id: c
      text:
        en: |-
          Add IAM policies to the application roles that deny both invoke actions unless bedrock:GuardrailIdentifier equals the guardrail ARN with the :3 suffix.
    - id: d
      text:
        en: |-
          Use the guardrail ARN without a version suffix in the IAM condition so that applications always pick up the latest guardrail changes.
    - id: e
      text:
        en: |-
          Use Amazon Comprehend prompt safety classification in each account to screen prompts before the applications call the model.
answer: { optionIds: [a, c] }
explanation:
  correct:
    en: |-
      Cross-account use of a guardrail works within the same organization, with access granted through a resource-based policy on the guardrail. The bedrock:GuardrailIdentifier condition key, with an explicit Deny when it does not equal the ARN with the version suffix, makes every inference call without that exact guardrail version fail.
  options:
    b:
      en: |-
        Copies in 30 accounts are what the company wants to avoid, and they can drift from the approved policies.
    d:
      en: |-
        An ARN without a version suffix matches the DRAFT version, not version 3, so editing the draft would change production behavior.
    e:
      en: |-
        Comprehend prompt safety classification is not an option for new designs (the Guardrails prompt attack filter replaces it), and screening prompts does not enforce the guardrail version.
references:
  - title: Enforce the use of specific guardrails in model inference requests - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/guardrails-permissions-id.html
