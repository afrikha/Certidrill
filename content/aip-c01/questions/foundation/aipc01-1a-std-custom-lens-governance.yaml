id: aipc01-1a-std-custom-lens-governance
objective: "1.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An enterprise wants every GenAI workload review in the AWS Well-Architected Tool to include its own governance questions, such as whether the model is on the internal approved list and whether the legal team approved the use case, each with its own best practices and improvement plan. The reviews take place in 20 workload accounts, and the questions will change over time.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Add the governance questions as notes on each workload in the AWS Well-Architected Tool before every review.
    - id: b
      text:
        en: |-
          Create a custom lens with the governance questions, best practices, and improvement plan, publish it, and share it with the 20 workload accounts.
    - id: c
      text:
        en: |-
          Add the governance questions to the Generative AI Lens JSON file, and import a separate copy into each account before every review.
    - id: d
      text:
        en: |-
          Create an AWS Config conformance pack that contains the governance questions, and deploy it to the 20 workload accounts.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      A custom lens defines its own pillars, questions, best practices and improvement plan, for example to meet internal governance needs. It is published, shared with other AWS accounts, applied to workloads like an AWS lens, and updated by publishing new versions.
  options:
    a:
      en: |-
        Notes are free text: they have no best practices, no risk tracking and no improvement plan, and they must be retyped for each workload.
    c:
      en: |-
        Importing separate copies in each account multiplies versions to maintain; one published custom lens shared with the accounts is simpler to update.
    d:
      en: |-
        Conformance packs evaluate resource configurations with AWS Config rules; they cannot hold review questions such as legal approval of a use case.
references:
  - title: Custom lenses for workloads in AWS WA Tool - AWS Well-Architected
    url: https://docs.aws.amazon.com/wellarchitected/latest/userguide/lenses-custom.html
