id: aipc01-1b-neptune-graphrag
objective: "1.4.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A pharmaceutical company stores research reports in Amazon S3. Analysts ask questions that require connecting facts across documents in several steps, for example from a compound to the trials that tested it and to the adverse events reported in those trials. Vector similarity search alone returns relevant passages but misses these connections. The company wants a managed retrieval solution.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Use a knowledge base with an OpenSearch Serverless vector store and hybrid search so that keyword matches on compound names add the missing passages.
    - id: b
      text:
        en: |-
          Use a knowledge base with an Amazon Neptune Analytics graph (GraphRAG) and an S3 data source, with a graph construction model selected.
    - id: c
      text:
        en: |-
          Store entities and relationships in Aurora PostgreSQL tables, and write a Lambda function that runs recursive SQL queries before each model call.
    - id: d
      text:
        en: |-
          Use a knowledge base with semantic chunking and a high maximum token count so that each chunk holds more of each report.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      GraphRAG in Knowledge Bases combines graph modeling with RAG: it identifies relationships between entities in the documents, retrieves the chunks linked to the matched ones by traversing the graph in Neptune Analytics, and gives the model that enriched context. It is useful when information must be connected through several logical steps, and it uses Amazon S3 as its data source.
  options:
    a:
      en: |-
        Hybrid search improves the ranking of individual passages with keyword matches, but it does not follow relationships between entities across documents.
    c:
      en: |-
        Building the entity graph and the traversal logic yourself is a custom solution, not a managed one.
    d:
      en: |-
        Larger chunks keep more context from one report, but the connections the analysts need span several documents.
references:
  - title: Build a knowledge base with Amazon Neptune Analytics graphs - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/knowledge-base-build-graphs.html
