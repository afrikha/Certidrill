id: aipc01-1c-embed-domain-evaluation
objective: "1.5.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A legal publisher must choose between two Amazon Bedrock embedding models for a knowledge base of case law. Public benchmark scores favor the first model, but lawyers use specialized terms and citation formats. The publisher has 300 real lawyer questions, each paired with the passages that answer it.

    Which approach will select the model that gives the best retrieval for this corpus?
body:
  options:
    - id: a
      text:
        en: |-
          Choose the model with the higher public benchmark score, because those benchmarks already include legal and regulatory text.
    - id: b
      text:
        en: |-
          Choose the model that produces more dimensions, because larger vectors capture specialized legal terms and citations better.
    - id: c
      text:
        en: |-
          Index the same chunks with each model in separate knowledge bases, run the 300 questions, and compare how often the expected passages rank in the top results.
    - id: d
      text:
        en: |-
          Have lawyers rate the generated answers of two knowledge bases, each built with a different model and a different chunking strategy.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      Domain fit is best measured on the company's own data: the same chunks indexed with each candidate model and a labeled set of real questions give retrieval metrics, such as hit rate or precision in the top results, that reflect the specialized vocabulary. Keeping everything else identical attributes any difference to the embedding model.
  options:
    a:
      en: |-
        General benchmarks do not reflect this corpus's terminology and citation formats, which is why the publisher doubts them.
    b:
      en: |-
        More dimensions do not guarantee better retrieval for a domain, and they increase storage and memory.
    d:
      en: |-
        Changing the chunking strategy at the same time hides the effect of the embedding model, and rating generated answers mixes in the generation model.
references:
  - title: "Supported models and Regions for Amazon Bedrock knowledge bases - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/knowledge-base-supported.html
  - title: "Amazon Titan Text Embeddings models - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/titan-embedding-models.html
