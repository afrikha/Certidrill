id: aipc01-1b-rds-pgvector-s3-repository
objective: "1.4.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company's document management application runs on Amazon RDS for PostgreSQL 16. The database holds the document catalog (title, owner, department, permissions and S3 object key), and the original files are stored in an S3 bucket. The company wants semantic search in which one SQL query combines similarity on document chunks with catalog filters and permission joins, without adding another database engine. The application team will create the embeddings itself with an Amazon Bedrock embedding model and does not need managed ingestion.

    Which combination of steps will meet these requirements? (Choose two.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Enable the pgvector extension on the DB instance, and create a chunk table with a vector column and an HNSW index that references the catalog rows.
    - id: b
      text:
        en: |-
          Register the RDS for PostgreSQL DB instance as the vector store of a customer-managed Amazon Bedrock knowledge base with an S3 data source.
    - id: c
      text:
        en: |-
          Use S3 event notifications to invoke a Lambda function that extracts and chunks each new file, embeds the chunks, and inserts them with the file's S3 key.
    - id: d
      text:
        en: |-
          Store each original file in a bytea column of the catalog table so that the files, the catalog and the vectors are in the same database.
    - id: e
      text:
        en: |-
          Store the embeddings in an Amazon S3 Vectors index with the catalog attributes as metadata, and query the index with SQL from the application.
answer: { optionIds: [a, c] }
explanation:
  correct:
    en: |-
      RDS for PostgreSQL offers the pgvector extension, so vectors can live next to the catalog and a single SQL query can join similarity results with catalog and permission tables. The originals stay in S3 as the document repository, and an event-driven Lambda function keeps the chunk table current with the S3 key as the link back to the file.
  options:
    b:
      en: |-
        Knowledge bases support Aurora PostgreSQL as a relational vector store, not RDS for PostgreSQL, and the team does not need managed ingestion anyway.
    d:
      en: |-
        Moving the files into the database duplicates the S3 repository and bloats the catalog. The S3 key is enough to link each chunk to its file.
    e:
      en: |-
        S3 Vectors is queried through its own API, not SQL, and it is a second store, so similarity could not be joined with the catalog in one query.
references:
  - title: Extension versions for Amazon RDS for PostgreSQL - Amazon Relational Database Service
    url: https://docs.aws.amazon.com/AmazonRDS/latest/PostgreSQLReleaseNotes/postgresql-extensions.html
  - title: Prerequisites for using a vector store you created for a knowledge base - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/knowledge-base-setup.html
