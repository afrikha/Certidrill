id: aipc01-1b-sagemaker-csv-payload
objective: "1.3.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A claims assistant inserts a fraud risk score into its foundation model prompt. The score comes from a model trained with the SageMaker AI built-in XGBoost algorithm and hosted on a real-time endpoint. The training data was a CSV file with the label in the first column followed by 12 feature columns. The application must send one claim per request and receive a valid score.

    How should the application format each InvokeEndpoint request?
body:
  options:
    - id: a
      text:
        en: |-
          Set ContentType to application/json and send a body with an inputs field that lists the 12 feature values and a parameters field.
    - id: b
      text:
        en: |-
          Set ContentType to text/csv and send the 12 feature values as one comma-separated line, in the training column order, without a label.
    - id: c
      text:
        en: |-
          Set ContentType to text/csv and send 13 comma-separated values, with 0 in the first position as a placeholder for the label column.
    - id: d
      text:
        en: |-
          Set ContentType to text/csv and send a header line with the feature names followed by the values, so that the column order does not matter.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      Among the common inference content types, XGBoost supports text/csv (and also text/libsvm). The body is a string of comma-separated feature values with no label column, and the order of the features must stay the same as in training.
  options:
    a:
      en: |-
        XGBoost does not support application/json among the common inference formats, and inputs with parameters is the shape of LLM serving containers, not of this algorithm.
    c:
      en: |-
        Inference requests carry no label column (text/csv with label_size=0). A placeholder would shift every feature by one position.
    d:
      en: |-
        The features are matched by position, and their order must remain unchanged. A header line does not let the algorithm reorder them.
references:
  - title: Common data formats for inference - Amazon SageMaker AI
    url: https://docs.aws.amazon.com/sagemaker/latest/dg/cdf-inference.html
  - title: InvokeEndpoint - Amazon SageMaker
    url: https://docs.aws.amazon.com/sagemaker/latest/APIReference/API_runtime_InvokeEndpoint.html
