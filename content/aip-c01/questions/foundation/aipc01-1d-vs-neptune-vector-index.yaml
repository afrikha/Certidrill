id: aipc01-1d-vs-neptune-vector-index
objective: "1.5.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A biotech company wants to build a GraphRAG application with a customer-managed Amazon Bedrock knowledge base that uses Amazon Neptune Analytics. The team already has a Neptune Analytics graph that it loaded with research data last year, but the graph was created without a vector search index. The knowledge base will use Amazon Titan Text Embeddings V2 with 1,024 dimensions.

    What should the team do to provide the vector store for the knowledge base?
body:
  options:
    - id: a
      text:
        en: |-
          Create a new, empty Neptune Analytics graph with a vector search index of 1,024 dimensions, and register its graph ARN in the knowledge base.
    - id: b
      text:
        en: |-
          Add a vector search index with 1,024 dimensions to the existing graph, and register the graph ARN in the knowledge base.
    - id: c
      text:
        en: |-
          Export the existing graph to an Amazon OpenSearch Serverless collection, and register the collection as a GraphRAG vector store.
    - id: d
      text:
        en: |-
          Create a new Neptune Analytics graph with a vector search index of 1,536 dimensions so that any Titan embedding model fits.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      For Knowledge Bases with Neptune Analytics, you create an empty graph with a vector search index, and the vector search index can only be created when the graph is created. The number of dimensions must match the embedding model, here 1,024, and the knowledge base is configured with the graph ARN.
  options:
    b:
      en: |-
        A vector search index cannot be added to an existing graph; it must be defined when the graph is created, and Knowledge Bases expects an empty graph.
    c:
      en: |-
        GraphRAG in Knowledge Bases uses Neptune Analytics; an OpenSearch Serverless collection provides vector search without the graph.
    d:
      en: |-
        The index dimension must equal the embedding model's dimension; a 1,536 index does not accept 1,024-dimension vectors.
references:
  - title: "Prerequisites for using a vector store you created for a knowledge base - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/knowledge-base-setup.html
