id: aipc01-1b-dynamodb-vector-index-app
objective: "1.4.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A travel company's booking platform stores its hotel catalog and user profiles in Amazon DynamoDB. A new agent feature must find hotels similar to one that a user liked, by approximate nearest neighbor search on hotel description embeddings, filtered by attributes such as city and price band, with single-digit-millisecond latency. The application already generates the embeddings with an Amazon Bedrock embedding model. No document ingestion, chunking or citations are needed, and the company does not want another database to operate.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Export the hotel descriptions to Amazon S3, and create an Amazon Bedrock knowledge base with an S3 data source to retrieve similar hotels.
    - id: b
      text:
        en: |-
          Store the embeddings in the hotel items, create a vector index on the DynamoDB table, and run nearest neighbor queries with filters on city and price band.
    - id: c
      text:
        en: |-
          Create an Amazon OpenSearch Service domain, sync the table to it with an OpenSearch Ingestion pipeline, and run k-NN queries with filters.
    - id: d
      text:
        en: |-
          Copy the catalog to an Aurora PostgreSQL cluster with the pgvector extension, and run similarity queries with SQL filters on city and price band.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      Since August 2026, DynamoDB supports native vector search: you create a vector index, store embeddings that you generate with a model of your choice, and run approximate nearest neighbor queries with attribute filters at single-digit-millisecond latency, serverless and paid by use. The data stays in the table the platform already uses.
  options:
    a:
      en: |-
        A knowledge base adds document ingestion and chunking that are not needed, and it is not a filtered, millisecond similarity lookup on the platform's own items.
    c:
      en: |-
        An OpenSearch domain and an ingestion pipeline are additional infrastructure to operate, which the company wants to avoid.
    d:
      en: |-
        An Aurora cluster is another database to operate and keep in sync with DynamoDB.
references:
  - title: Amazon DynamoDB now supports real-time vector search - AWS
    url: https://aws.amazon.com/about-aws/whats-new/2026/08/amazon-dynamodb-vector-search/
