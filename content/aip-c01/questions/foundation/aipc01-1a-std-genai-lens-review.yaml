id: aipc01-1a-std-genai-lens-review
objective: "1.1.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company runs a production RAG assistant built on Amazon Bedrock. Before a major expansion, the architecture board wants to review the workload against AWS best practices for generative AI across the six Well-Architected pillars, record the risks that the review identifies, and track an improvement plan across later reviews.

    Which solution will meet these requirements with the LEAST effort?
body:
  options:
    - id: a
      text:
        en: |-
          Run AWS Trusted Advisor checks on the account, and export the recommendations to a spreadsheet that the board reviews each quarter.
    - id: b
      text:
        en: |-
          Ask each team to answer the questions of the Well-Architected Framework whitepaper in a shared document before every review.
    - id: c
      text:
        en: |-
          Apply the Machine Learning Lens to the workload in the AWS Well-Architected Tool, and save the answers as a milestone.
    - id: d
      text:
        en: |-
          Import the Generative AI Lens JSON file into the AWS Well-Architected Tool as a custom lens, and apply it to the workload.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      The Generative AI Lens gives Well-Architected best practices for applications that use foundation models on Amazon Bedrock or SageMaker AI. Its JSON file is imported into the AWS Well-Architected Tool as a custom lens, which is applied to a workload like any AWS lens, with identified risks, milestones and reports to track improvements.
  options:
    a:
      en: |-
        Trusted Advisor checks general account configuration; it does not review a workload against generative AI best practices or keep an improvement plan.
    b:
      en: |-
        A shared document has no GenAI-specific questions and no built-in risk tracking or milestones, so it is more effort for less coverage.
    c:
      en: |-
        The Machine Learning Lens covers traditional ML applications; foundation model applications are covered by the Generative AI Lens.
references:
  - title: Generative AI Lens - AWS Well-Architected Framework - Generative AI Lens
    url: https://docs.aws.amazon.com/wellarchitected/latest/generative-ai-lens/generative-ai-lens.html
  - title: Custom lenses for workloads in AWS WA Tool - AWS Well-Architected
    url: https://docs.aws.amazon.com/wellarchitected/latest/userguide/lenses-custom.html
