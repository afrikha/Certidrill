id: aipc01-1d-qh-rewrite-follow-ups
objective: "1.5.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A travel company's assistant calls the Retrieve operation on an Amazon Bedrock knowledge base with the user's latest message, and then calls the Converse API with its own prompt and tool definitions. Conversation turns are stored in Amazon DynamoDB. Follow-up questions such as "And what about the second option?" retrieve irrelevant chunks. The company must keep its Converse call with tools.

    Which solution will improve retrieval for follow-up questions?
body:
  options:
    - id: a
      text:
        en: |-
          Before Retrieve, have a Bedrock model rewrite the follow-up into a standalone query by using the recent turns from DynamoDB.
    - id: b
      text:
        en: |-
          Replace both calls with RetrieveAndGenerate and pass the sessionId that Amazon Bedrock returns on later requests.
    - id: c
      text:
        en: |-
          Send the full text of every previous turn, concatenated with the latest message, as the Retrieve query text.
    - id: d
      text:
        en: |-
          Enable QUERY_DECOMPOSITION so that the follow-up question is split into sub-queries before retrieval.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      A follow-up message depends on earlier turns, so it must be rewritten into a self-contained question before retrieval. A short model call with the last turns resolves references such as "the second option" and produces a focused query, and the existing Converse call with tools stays unchanged.
  options:
    b:
      en: |-
        RetrieveAndGenerate keeps session context, but it generates the answer itself, so the company would lose its own Converse call with tool definitions.
    c:
      en: |-
        A query made of the whole conversation dilutes the embedding with unrelated text and retrieves chunks about earlier topics.
    d:
      en: |-
        Decomposition splits compound questions; it does not resolve references to earlier turns, and it is a RetrieveAndGenerate setting rather than a Retrieve one.
references:
  - title: "Retrieve - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/APIReference/API_agent-runtime_Retrieve.html
  - title: "RetrieveAndGenerate - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/APIReference/API_agent-runtime_RetrieveAndGenerate.html
