id: aipc01-1e-synthetics-golden-prompts
objective: "1.6.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A bank exposes its internal policy assistant through Amazon API Gateway. The bank wants to detect within 15 minutes, even at night when there is no user traffic, when a change to the prompt, the model, or the knowledge base makes the assistant stop giving the expected answers to 20 known questions.

    Which solution will meet these requirements with the LEAST operational overhead?
body:
  options:
    - id: a
      text:
        en: |-
          Create Amazon Route 53 health checks on the API Gateway endpoint that raise a CloudWatch alarm when the endpoint returns an HTTP error code.
    - id: b
      text:
        en: |-
          Create a CloudWatch Synthetics canary that sends the 20 questions to the API every 15 minutes, asserts the expected facts, and alarms on failure.
    - id: c
      text:
        en: |-
          Turn on model invocation logging, and run a daily CloudWatch Logs Insights query that compares the logged responses with the expected answers.
    - id: d
      text:
        en: |-
          Schedule a weekly Amazon Bedrock evaluation job for the knowledge base, and email the evaluation results to the assistant team for review.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      Canaries are scripts that run on a schedule, as often as once a minute, and call endpoints and APIs the way a client does, so they test the assistant without live traffic. The script can assert expected content in each answer, and the canary metrics drive a CloudWatch alarm.
  options:
    a:
      en: |-
        A health check sees only availability; a regression in answer content still returns HTTP 200.
    c:
      en: |-
        At night there are no logged responses to compare, and a daily query misses the 15-minute target.
    d:
      en: |-
        A weekly job is far slower than 15 minutes and evaluates retrieval rather than the deployed assistant end to end.
references:
  - title: "Synthetic monitoring (canaries) - Amazon CloudWatch"
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/CloudWatch_Synthetics_Canaries.html
