id: aipc01-1b-stepfunctions-bedrock-large-input
objective: "1.3.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    An AWS Step Functions workflow summarizes meeting transcripts with the Amazon Bedrock optimized integration for InvokeModel. The workflow places the request in the Body field. Most transcripts work, but executions fail for long transcripts whose request body is about 600 KiB. The company wants to keep the optimized integration and make the fewest changes.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Write the request body of each transcript to Amazon S3, pass its S3 URI in the Input field instead of Body, and set the Output field to write the response to S3.
    - id: b
      text:
        en: |-
          Request a higher maximum payload size for the state machine through Service Quotas, and keep passing the request in the Body field.
    - id: c
      text:
        en: |-
          Put the first 256 KiB of the request in the Body field and pass the rest of the request from Amazon S3 in the Input field of the same task.
    - id: d
      text:
        en: |-
          Convert the state machine to an Express workflow so that larger payloads can be passed between states and to the integration.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      With the Bedrock optimized integration, Body accepts a payload of up to 256 KiB; for larger payloads AWS recommends the Input field, which reads the request from an S3 URI. The Output field writes the response to S3 and replaces the response body with a reference, which also keeps a long summary out of the state payload.
  options:
    b:
      en: |-
        The integration documents 256 KiB as the Body size and directs larger requests to Input. Keeping the request in Body does not solve the failures.
    c:
      en: |-
        The integration accepts either Body or Input in a task, not both, so a request cannot be split between them.
    d:
      en: |-
        Express workflows do not raise the payload limits of states or of the Body field, so the long transcripts would still fail.
references:
  - title: Invoke and customize Amazon Bedrock models with Step Functions - AWS Step Functions
    url: https://docs.aws.amazon.com/step-functions/latest/dg/connect-bedrock.html
