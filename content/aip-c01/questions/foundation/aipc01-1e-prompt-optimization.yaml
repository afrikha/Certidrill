id: aipc01-1e-prompt-optimization
objective: "1.6.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company moves a 400-token classification prompt from one foundation model (FM) to another FM that Amazon Bedrock prompt optimization supports. The prompt engineers want a quick rewrite of the prompt tailored to the new model, and they want to compare it with the original before they decide which one to keep.

    Which solution will meet these requirements with the LEAST effort?
body:
  options:
    - id: a
      text:
        en: |-
          Create an intelligent prompt router that sends each request to the model that best fits the prompt.
    - id: b
      text:
        en: |-
          Run a model distillation job that uses the old model as the teacher and the new model as the student.
    - id: c
      text:
        en: |-
          Optimize the prompt for the new model in Prompt Management, and compare the optimized variant with the original.
    - id: d
      text:
        en: |-
          Create an LLM-as-a-judge evaluation job that scores the responses of the original prompt on the new model.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      Prompt optimization analyzes a short prompt and rewrites it for one chosen model, and it works best for prompts of about 1,000 tokens or less. In Prompt Management, the optimized prompt appears as a variant next to the original, so the engineers can compare outputs and keep either one.
  options:
    a:
      en: |-
        A prompt router chooses between models of the same family per request; it does not rewrite the prompt.
    b:
      en: |-
        Distillation trains a customized student model, which takes far more effort and does not produce a rewritten prompt.
    d:
      en: |-
        An evaluation job measures the existing prompt; it does not produce a rewritten version to compare.
references:
  - title: "Optimize a prompt - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/prompt-management-optimize.html
