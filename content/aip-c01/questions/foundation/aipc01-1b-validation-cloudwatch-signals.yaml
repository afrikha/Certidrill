id: aipc01-1b-validation-cloudwatch-signals
objective: "1.3.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company's RAG ingestion pipeline has two validation stages. A Lambda function checks each uploaded document and rejects invalid files. AWS Glue Data Quality evaluation runs check the document metadata table in the AWS Glue Data Catalog. The operations team wants Amazon CloudWatch alarms when the number of rejected documents spikes and when any data quality rule fails on the metadata table.

    Which combination of steps will meet these requirements? (Choose two.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Make the Lambda function publish a DocumentsRejected custom metric to CloudWatch, and create an alarm on that metric.
    - id: b
      text:
        en: |-
          Keep the Publish metrics to Amazon CloudWatch option selected for the evaluation runs, and create an alarm on the glue.data.quality.rules.failed metric.
    - id: c
      text:
        en: |-
          Enable AWS CloudTrail data events for the upload bucket, and create an alarm on the number of PutObject calls.
    - id: d
      text:
        en: |-
          Enable Amazon Bedrock model invocation logging to CloudWatch Logs, and create an alarm on the number of logged requests.
    - id: e
      text:
        en: |-
          Enable S3 server access logging on the quarantine prefix, and create an alarm directly on the access log objects.
answer: { optionIds: [a, b] }
explanation:
  correct:
    en: |-
      CloudWatch only receives what applications push, so the Lambda function must publish its rejection count with PutMetricData (or OpenTelemetry) before an alarm can watch it. Each Glue Data Quality run with metrics publishing enabled emits glue.data.quality.rules.passed and glue.data.quality.rules.failed in the Glue Data Quality namespace, and an alarm at 1 or more failed rules meets the second need.
  options:
    c:
      en: |-
        PutObject calls count uploads, not rejected documents, so the alarm would react to normal upload volume.
    d:
      en: |-
        Invocation logging records model requests. It has nothing to do with document validation or data quality rules.
    e:
      en: |-
        Server access logs are delivered as objects to an S3 bucket, not as CloudWatch metrics, so no alarm can be created on them directly.
references:
  - title: Setting up alerts, deployments, and scheduling - AWS Glue
    url: https://docs.aws.amazon.com/glue/latest/dg/data-quality-alerts.html
  - title: Publish custom metrics (PutMetricData / EMF) - Amazon CloudWatch
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/publishingMetrics.html
