id: aipc01-1d-vs-oss-index-fields
objective: "1.5.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company's platform team creates an Amazon OpenSearch Serverless vector search collection and a vector index itself, instead of using the console quick create option, because it applies its own naming and encryption standards. The index will be the vector store of a customer-managed Amazon Bedrock knowledge base that uses float embeddings.

    Which elements must the team define in the vector index so that the knowledge base can use it? (Choose three.)
body:
  choose: 3
  options:
    - id: a
      text:
        en: |-
          A keyword field for each S3 object tag of the source documents.
    - id: b
      text:
        en: |-
          A vector field whose dimension matches the embedding model, using the faiss engine.
    - id: c
      text:
        en: |-
          A vector field that uses the nmslib engine with the Hamming distance.
    - id: d
      text:
        en: |-
          A text field that stores the raw chunk text, defined as filterable.
    - id: e
      text:
        en: |-
          A nested field that stores the full text of each source document.
    - id: f
      text:
        en: |-
          A non-filterable field that stores the metadata that Amazon Bedrock manages.
answer: { optionIds: [ b, d, f ] }
explanation:
  correct:
    en: |-
      An OpenSearch Serverless index for Knowledge Bases needs a vector field that uses the faiss engine (Euclidean distance is recommended for float embeddings), a filterable text field for the raw chunk text, and a non-filterable field for the Bedrock-managed metadata. Their names are then mapped in the knowledge base configuration.
  options:
    a:
      en: |-
        S3 object tags are not read into the index; filter attributes come from the metadata files, and no field per tag is required.
    c:
      en: |-
        Knowledge Bases uses the faiss engine; Hamming distance applies only to binary vectors, and these embeddings are float.
    e:
      en: |-
        Knowledge Bases stores chunks, not whole documents, in the index; no full-text document field is required.
references:
  - title: "Prerequisites for using a vector store you created for a knowledge base - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/knowledge-base-setup.html
