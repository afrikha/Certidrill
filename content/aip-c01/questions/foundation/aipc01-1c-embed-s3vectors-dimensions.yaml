id: aipc01-1c-embed-s3vectors-dimensions
objective: "1.5.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company's Amazon Bedrock knowledge base stores 300 million chunk vectors in Amazon S3 Vectors, embedded with Amazon Titan Text Embeddings V2 at 1,024 float dimensions. The company wants to roughly halve vector storage while keeping S3 Vectors as the store. Tests show that retrieval quality is acceptable with 512-dimension Titan vectors. The company will build a new knowledge base and vector index, ingest all documents, and switch the application once the new knowledge base is ready.

    Which embedding configuration should the company use for the new knowledge base?
body:
  options:
    - id: a
      text:
        en: |-
          Use binary embeddings from Titan Text Embeddings V2 at 1,024 dimensions for the new knowledge base.
    - id: b
      text:
        en: |-
          Use Titan Text Embeddings V2 at 512 float dimensions, with a 512-dimension S3 vector index.
    - id: c
      text:
        en: |-
          Use Amazon Titan Embeddings G1 - Text float embeddings, with an index of the matching dimension.
    - id: d
      text:
        en: |-
          Use binary embeddings from Cohere Embed English v3, with a 1,024-dimension S3 vector index.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      Titan Text Embeddings V2 can output 512 dimensions, which halves the size of each float vector, and the tests already validated that quality. The new S3 vector index must be created with the same 512 dimensions as the embeddings that the knowledge base writes and queries.
  options:
    a:
      en: |-
        Amazon S3 Vectors supports floating-point embeddings only; binary embeddings are not supported.
    c:
      en: |-
        Titan Embeddings G1 - Text produces 1,536 dimensions, which increases storage instead of halving it.
    d:
      en: |-
        S3 Vectors does not support binary embeddings, and Cohere vectors were not the model that the tests validated.
references:
  - title: "Prerequisites for using a vector store you created for a knowledge base - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/knowledge-base-setup.html
  - title: "Supported models and Regions for Amazon Bedrock knowledge bases - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/knowledge-base-supported.html
