id: aipc01-1c-perf-reshard-large-shards
objective: "1.4.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A software company runs semantic search for its RAG assistant on an Amazon OpenSearch Service managed cluster with six data nodes. The vector index was created two years ago with the service defaults and now holds about 600 GiB of primary data, so each primary shard is about 120 GiB. Search latency has grown steadily. The application queries the index through an index alias, and the company wants to restore low search latency without application downtime.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Increase the number of replicas of the existing index from one to three so that more copies of each shard serve searches.
    - id: b
      text:
        en: |-
          Update the number_of_shards setting of the existing index to 24, and wait for OpenSearch Service to rebalance the data.
    - id: c
      text:
        en: |-
          Create a new index with 24 primary shards, reindex the data into it, and then move the alias that the application uses to the new index.
    - id: d
      text:
        en: |-
          Move the existing index to UltraWarm storage so that its shards are served from Amazon S3 instead of from the data nodes.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      OpenSearch Service creates indexes with 5 primary shards by default, and the primary shard count of an existing index cannot easily be changed. For search workloads, shards should stay between 10 and 30 GiB, so a new index with 24 primaries (about 25 GiB each, a multiple of the six data nodes) is reindexed, and the alias is switched without changing the application.
  options:
    a:
      en: |-
        More replicas add read capacity, but each copy is still a 120 GiB shard, far above the recommended size for search latency.
    b:
      en: |-
        The number of primary shards is fixed when the index is created and cannot be changed through an index settings update.
    d:
      en: |-
        UltraWarm keeps data in Amazon S3 and loads it on demand, which lowers cost but does not reduce search latency.
references:
  - title: "Choosing the number of shards - Amazon OpenSearch Service"
    url: https://docs.aws.amazon.com/opensearch-service/latest/developerguide/bp-sharding.html
  - title: "Operational best practices for Amazon OpenSearch Service - Amazon OpenSearch Service"
    url: https://docs.aws.amazon.com/opensearch-service/latest/developerguide/bp.html
