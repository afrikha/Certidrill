id: aipc01-1a-resil-non-retryable-errors
objective: "1.2.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A developer is writing a shared retry wrapper for all Amazon Bedrock Runtime calls in a company's GenAI applications. The wrapper must retry only the errors that a later attempt can resolve. It must return the other errors to the caller immediately so that the caller fixes the request, the permissions, or the identifier.

    Which errors should the wrapper return immediately without retrying? (Choose three.)
body:
  choose: 3
  options:
    - id: a
      text:
        en: |-
          ThrottlingException (HTTP 429)
    - id: b
      text:
        en: |-
          AccessDeniedException (HTTP 403)
    - id: c
      text:
        en: |-
          ServiceUnavailable (HTTP 503)
    - id: d
      text:
        en: |-
          ValidationError (HTTP 400)
    - id: e
      text:
        en: |-
          InternalFailure (HTTP 500)
    - id: f
      text:
        en: |-
          ResourceNotFound (HTTP 404)
answer: { optionIds: [b, d, f] }
explanation:
  correct:
    en: |-
      AccessDeniedException, ValidationError and ResourceNotFound come from missing permissions, invalid input and wrong identifiers, so a retry fails the same way; AWS advises fixing the request, permissions or identifier first. For ResourceNotFound, the application can fall back to another model or endpoint instead.
  options:
    a:
      en: |-
        ThrottlingException means the quota was exceeded at that moment; retrying with exponential backoff and jitter is the recommended handling.
    c:
      en: |-
        ServiceUnavailable is temporary high demand; retrying with backoff and jitter, or another Region, is recommended.
    e:
      en: |-
        InternalFailure is a server-side error that AWS recommends retrying with exponential backoff and jitter.
references:
  - title: Troubleshooting Amazon Bedrock API Error Codes - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/troubleshooting-api-error-codes.html
