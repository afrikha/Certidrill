id: aipc01-1e-flow-pre-post-lambda
objective: "1.6.6"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A bank is building an Amazon Bedrock flow that drafts replies to customer messages. Before the prompt node runs, account numbers must be replaced with reversible tokens from the bank's tokenization service, an HTTPS API that runs outside AWS. After the prompt node, each reply must be checked against business rules, and replies that fail must reach a different output node than replies that pass.

    Which combination of steps will meet these requirements? (Choose two.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Add a Lambda function node before the prompt node that calls the tokenization service and returns the tokenized message.
    - id: b
      text:
        en: |-
          Add an inline code node before the prompt node that calls the tokenization service with a Python HTTP client library.
    - id: c
      text:
        en: |-
          Attach a guardrail to the prompt node with a sensitive information filter that masks the account numbers in the input.
    - id: d
      text:
        en: |-
          Add a Lex node after the prompt node that returns the predicted intent of the reply to decide whether it passes.
    - id: e
      text:
        en: |-
          Add a Lambda function node after the prompt node that returns a validation result, followed by a condition node with two outputs.
answer: { optionIds: [ a, e ] }
explanation:
  correct:
    en: |-
      Lambda function nodes run your code inside the flow for pre-processing and post-processing, and the function's response becomes the node output. A Lambda node before the prompt calls the tokenization service, and a Lambda node after it validates the reply. A condition node then routes passing and failing replies to separate output nodes.
  options:
    b:
      en: |-
        Inline code nodes are in preview and run in an AWS-managed environment with no internet access, so they cannot call the external service.
    c:
      en: |-
        Guardrail masking replaces the value with its entity type, such as {EMAIL}; it does not produce reversible tokens from the bank's service.
    d:
      en: |-
        A Lex node returns the intent of one utterance; it cannot apply the bank's business rules to a reply.
references:
  - title: "Node types for your flow - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/flows-nodes.html
  - title: "Remove PII from conversations by using sensitive information filters - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/guardrails-sensitive-filters.html
