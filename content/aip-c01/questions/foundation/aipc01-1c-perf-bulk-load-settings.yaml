id: aipc01-1c-perf-bulk-load-settings
objective: "1.4.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company is loading 50 million chunk embeddings into a new Amazon OpenSearch Service vector index before it launches a RAG application. AWS Glue jobs send the documents to the domain, and the load is taking far longer than planned. Nobody will search the index until the load completes.

    Which combination of actions will speed up the initial load? (Choose two.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Send each embedding in its own index request with refresh set to true so that every document becomes searchable immediately.
    - id: b
      text:
        en: |-
          Set the refresh_interval of the index to 30 seconds or more during the load instead of the 1-second default.
    - id: c
      text:
        en: |-
          Increase the number of replicas to two during the load so that more shard copies accept writes in parallel.
    - id: d
      text:
        en: |-
          Create the index with 300 primary shards of about 1 GiB each so that more threads index data in parallel.
    - id: e
      text:
        en: |-
          Send documents with the _bulk API in requests of about 3-5 MiB, and increase the size until throughput stops improving.
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: |-
      A longer refresh interval reduces the work of creating new searchable segments and improves indexing throughput, which costs nothing here because nobody searches during the load. Bulk requests starting at about 3-5 MiB amortize per-request overhead; AWS recommends increasing the size until indexing performance stops improving.
  options:
    a:
      en: |-
        Single-document requests with a forced refresh maximize overhead and are the slowest way to load data.
    c:
      en: |-
        Every indexing request is applied to the primary and to each replica, so more replicas add work during the load.
    d:
      en: |-
        Many tiny shards waste memory and CPU and cause performance problems; shards for search should be about 10-30 GiB.
references:
  - title: "Operational best practices for Amazon OpenSearch Service - Amazon OpenSearch Service"
    url: https://docs.aws.amazon.com/opensearch-service/latest/developerguide/bp.html
  - title: "Choosing the number of shards - Amazon OpenSearch Service"
    url: https://docs.aws.amazon.com/opensearch-service/latest/developerguide/bp-sharding.html
