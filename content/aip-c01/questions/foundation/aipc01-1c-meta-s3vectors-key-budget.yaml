id: aipc01-1c-meta-s3vectors-key-budget
objective: "1.4.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A media company uses an Amazon Bedrock knowledge base with an Amazon S3 Vectors vector store to keep storage costs low for 12 million archived articles. A new pipeline generates a .metadata.json file with 42 attributes for each article (editorial tags, rights information, and descriptive fields). Since the change, ingestion jobs fail with metadata errors. Users filter on only 8 of the attributes, which hold short codes; the others are informational. The company must keep S3 Vectors and wants the fix with the LEAST effort.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Switch the data source to hierarchical chunking so that each parent chunk carries the metadata once for all of its child chunks.
    - id: b
      text:
        en: |-
          Shorten the attribute names and values so that each .metadata.json file stays below the 10 KB size limit of metadata files.
    - id: c
      text:
        en: |-
          Recreate the vector index and declare all 42 attributes as non-filterable metadata keys so that they are not indexed for filtering.
    - id: d
      text:
        en: |-
          Limit the metadata files to the attributes used for filtering, and keep the informational fields in the document text or a separate catalog.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      With S3 Vectors, each vector can carry at most 1 KB of custom metadata and 35 metadata keys, and an ingestion job fails when a document's metadata exceeds these limits. Keeping only the 8 short filter attributes brings every vector within both limits without changing the store.
  options:
    a:
      en: |-
        Hierarchical chunking is not recommended with S3 Vectors because large chunks also count against the per-vector metadata size; it does not reduce the number of keys.
    b:
      en: |-
        The 10 KB limit applies to the .metadata.json file itself. The failure comes from the S3 Vectors per-vector limits (1 KB and 35 keys), which 42 keys exceed whatever their length.
    c:
      en: |-
        An S3 vector index accepts at most 10 non-filterable metadata keys, and the 35-key and 1 KB limits per vector still apply.
references:
  - title: "Prerequisites for using a vector store you created for a knowledge base - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/knowledge-base-setup.html
  - title: "How content chunking works for knowledge bases - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/kb-chunking.html
