id: aipc01-1a-fm-image-input-modality
objective: "1.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An accounting firm wants to extract supplier names, totals, and due dates from scanned invoices that arrive as PNG images. The team will send each invoice to a foundation model in Amazon Bedrock with the Converse API and ask for JSON output. The shortlisted models have different capabilities, and the team must eliminate the models that cannot perform the task.

    Which selection criterion should the team apply first?
body:
  options:
    - id: a
      text:
        en: |-
          Keep only the models whose model card lists Image as an input modality, so that each invoice can be sent as an image content block.
    - id: b
      text:
        en: |-
          Keep only the models whose model card lists Image as an output modality, so that the model can redraw each invoice as structured text.
    - id: c
      text:
        en: |-
          Keep only text embedding models, so that each invoice can be compared with the embeddings of sample invoices from each supplier.
    - id: d
      text:
        en: |-
          Keep only the models with the largest context window, so that the image file name and its metadata fit in the text prompt.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      Each model card lists the input and output modalities that the model supports. Reading an invoice image requires Image as an input modality; for example, the Claude Haiku 4.5 card lists text and image inputs and text output. The supported content blocks per model are listed in the models at a glance pages.
  options:
    b:
      en: |-
        Output modality describes what the model generates; the firm needs JSON text out and an image in, so image output is irrelevant.
    c:
      en: |-
        Embedding models return vectors, not extracted fields such as totals and due dates.
    d:
      en: |-
        A file name gives the model nothing to read; a text-only model cannot extract values from an image it never receives.
references:
  - title: Claude Haiku 4.5 - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/model-card-anthropic-claude-haiku-4-5.html
  - title: Inference using Converse API - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/conversation-inference.html
