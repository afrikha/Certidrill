id: aipc01-1a-fm-bare-model-id-profile
objective: "1.2.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A developer is testing Claude Haiku 4.5 from us-east-1 through the bedrock-runtime endpoint. The application calls the Converse API with modelId set to anthropic.claude-haiku-4-5-20251001-v1:0, and every request fails with a validation error. The role allows bedrock:InvokeModel on the model, the account has no other Bedrock workloads, and the application has no data residency requirement beyond the US.

    Which solution will resolve the error?
body:
  options:
    - id: a
      text:
        en: |-
          Request a quota increase for the model's on-demand requests per minute in Service Quotas, and retry the request.
    - id: b
      text:
        en: |-
          Set modelId to the model's US geographic inference profile ID, us.anthropic.claude-haiku-4-5-20251001-v1:0.
    - id: c
      text:
        en: |-
          Purchase Provisioned Throughput for the model, and set modelId to the ARN of the provisioned model.
    - id: d
      text:
        en: |-
          Replace the Converse call with an InvokeModel call that uses the model's native request body.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      The Claude Haiku 4.5 model card states that the bare model ID is not supported for on-demand inference on bedrock-runtime and that a geographic or global inference profile ID is required. The us. profile keeps processing within US Regions, which matches the requirement.
  options:
    a:
      en: |-
        A quota problem returns a ThrottlingException, not a validation error, and the account has no other traffic.
    c:
      en: |-
        Provisioned Throughput is purchased capacity for a different need, and the model card's fix for on-demand calls is an inference profile ID.
    d:
      en: |-
        The restriction applies to the model ID on the endpoint, not to the API; InvokeModel with the bare ID fails the same way.
references:
  - title: Claude Haiku 4.5 - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/model-card-anthropic-claude-haiku-4-5.html
  - title: Route model inference requests across AWS Regions with cross-Region inference - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/cross-region-inference.html
