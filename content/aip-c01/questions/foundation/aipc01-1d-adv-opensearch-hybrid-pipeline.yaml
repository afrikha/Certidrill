id: aipc01-1d-adv-opensearch-hybrid-pipeline
objective: "1.5.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A media company runs its own search service on an Amazon OpenSearch Serverless vector search collection, without Amazon Bedrock Knowledge Bases. Each document has a text field and a vector field that an ML connector to an Amazon Bedrock embedding model fills. The company wants one query that combines keyword relevance and semantic similarity. Keyword scores are unbounded, while vector scores fall in a small range, so the raw scores cannot be added.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Run a hybrid query with match and neural subqueries through a search pipeline whose normalization processor combines the scores.
    - id: b
      text:
        en: |-
          Run a bool query with a match clause and a k-NN clause in its should section, and sort by the summed score.
    - id: c
      text:
        en: |-
          Run separate keyword and neural queries, and return whichever result list has the highest top score to the user.
    - id: d
      text:
        en: |-
          Add a text_embedding processor to the ingest pipeline so that each document stores both its text and its embedding.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      A hybrid query takes an array of lexical and neural queries, and a search pipeline with the normalization processor normalizes each subquery's scores (for example min_max or l2) and combines them (for example arithmetic_mean). This produces a single ranking from scores on different scales.
  options:
    b:
      en: |-
        A bool query adds the raw scores, so the unbounded keyword scores dominate the small vector scores.
    c:
      en: |-
        Choosing one list by its top score discards the other signal instead of combining keyword and semantic relevance.
    d:
      en: |-
        An ingest processor creates embeddings at indexing time; it does not combine scores at query time.
references:
  - title: "Configure Neural Search and Hybrid Search on OpenSearch Serverless - Amazon OpenSearch Service"
    url: https://docs.aws.amazon.com/opensearch-service/latest/developerguide/serverless-configure-neural-search.html
