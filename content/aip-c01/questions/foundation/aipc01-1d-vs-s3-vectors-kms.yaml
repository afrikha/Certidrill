id: aipc01-1d-vs-s3-vectors-kms
objective: "1.5.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company created an Amazon S3 vector bucket with the default encryption settings and a vector index for a customer-managed Amazon Bedrock knowledge base, but it has not ingested any data yet. A new security requirement says that the vectors must be encrypted with a customer managed AWS KMS key. The knowledge base will use Amazon Titan Text Embeddings V2 with 1,024 dimensions.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Change the encryption type of the existing vector bucket to SSE-KMS with the customer managed key, and then start the ingestion job.
    - id: b
      text:
        en: |-
          Create a new vector bucket with SSE-KMS and the customer managed key, create a 1,024-dimension index with the required non-filterable keys, and use it.
    - id: c
      text:
        en: |-
          Configure default SSE-KMS encryption with the customer managed key on the general purpose S3 bucket that holds the source documents.
    - id: d
      text:
        en: |-
          Keep the vector bucket, and add the customer managed key to the knowledge base's session configuration so that retrieved vectors are encrypted.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      The encryption type of an S3 vector bucket cannot be changed after the bucket is created, so a new bucket with SSE-KMS and the customer managed key is required. Its index must match the embedding dimension and declare AMAZON_BEDROCK_TEXT and AMAZON_BEDROCK_METADATA as non-filterable metadata keys for Knowledge Bases.
  options:
    a:
      en: |-
        A vector bucket's encryption type is fixed at creation and cannot be changed afterward.
    c:
      en: |-
        Encrypting the source bucket protects the documents, not the vectors stored in the vector bucket.
    d:
      en: |-
        The session configuration key applies to RetrieveAndGenerate sessions; it does not change how the vector bucket encrypts stored vectors.
references:
  - title: "Prerequisites for using a vector store you created for a knowledge base - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/knowledge-base-setup.html
  - title: "Working with S3 Vectors and vector buckets - Amazon Simple Storage Service"
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/s3-vectors.html
