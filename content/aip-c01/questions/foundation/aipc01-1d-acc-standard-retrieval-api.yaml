id: aipc01-1d-acc-standard-retrieval-api
objective: "1.5.6"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Twelve internal applications in a company query three different vector stores (an Amazon Bedrock knowledge base, an Aurora PostgreSQL pgvector table, and an Amazon OpenSearch Service index), each with its own request format. The company wants one retrieval request and response contract (query, filters, top-k, results with source and score) so that it can replace a store without changing the applications. Every retrieval request must be authorized with the signed-in user's token from the company's Amazon Cognito user pool.

    Which steps will meet these requirements? (Choose two.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Create an Amazon API Gateway REST API whose Lambda integration translates the common contract into each store's query and normalizes the results.
    - id: b
      text:
        en: |-
          Issue an API key to each application in an API Gateway usage plan, and accept only requests that carry a valid key.
    - id: c
      text:
        en: |-
          Grant each application IAM permissions to call each vector store directly with the AWS SDK.
    - id: d
      text:
        en: |-
          Configure an Amazon Cognito user pool authorizer on the retrieval API methods.
    - id: e
      text:
        en: |-
          Publish a shared client library that implements the common contract inside each application.
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: |-
      An API Gateway REST API backed by a Lambda function gives every application the same contract and hides which store answers, so a store can be swapped behind the API without client changes. A Cognito user pool authorizer validates the user's token on each request before the integration runs.
  options:
    b:
      en: |-
        API keys identify clients for usage plans; AWS advises against using them for authentication or authorization, and they do not carry the user's identity.
    c:
      en: |-
        Direct access keeps three request formats in the applications and ties them to each store, so replacing a store means changing them.
    e:
      en: |-
        A library still runs in each application, so a store change requires redeploying all twelve applications.
references:
  - title: "Usage plans and API keys for REST APIs in API Gateway - Amazon API Gateway"
    url: https://docs.aws.amazon.com/apigateway/latest/developerguide/api-gateway-api-usage-plans.html
