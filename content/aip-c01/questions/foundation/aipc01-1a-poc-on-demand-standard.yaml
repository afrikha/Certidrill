id: aipc01-1a-poc-on-demand-standard
objective: "1.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A startup wants to run a four-week proof of concept that compares five text models in Amazon Bedrock for a legal-drafting assistant. During the proof of concept, internal testers send a few hundred requests per day, and there is no latency target. The startup wants the lowest cost and no commitment.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Invoke each model on demand with the Standard service tier, and pay only for the tokens that are processed.
    - id: b
      text:
        en: |-
          Purchase Provisioned Throughput with no commitment for each of the five models for the four weeks of the proof of concept.
    - id: c
      text:
        en: |-
          Ask the AWS account team to enable the Reserved tier for each of the five models for one month.
    - id: d
      text:
        en: |-
          Deploy open-weights versions of the models to Amazon SageMaker AI real-time endpoints that run for the four weeks.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      On-demand inference with the Standard tier, the default when no service tier is specified, charges only for the tokens processed and requires nothing to be provisioned. A few hundred requests per day across five models costs far less than any reserved or hosted capacity.
  options:
    b:
      en: |-
        Provisioned Throughput is billed hourly per model unit until it is deleted, so five models would be paid around the clock for a light test load.
    c:
      en: |-
        The Reserved tier is a 1- or 3-month capacity commitment with minimum token rates, the opposite of a no-commitment proof of concept.
    d:
      en: |-
        Real-time endpoints bill for their instances for as long as they run, and not every candidate may exist as open weights.
references:
  - title: Service tiers for optimizing performance and cost - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/service-tiers-inference.html
  - title: Increase model invocation capacity with Provisioned Throughput in Amazon Bedrock - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/prov-throughput.html
