id: aipc01-1b-glue-dq-row-quarantine
objective: "1.3.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A retail company loads a daily product catalog extract of 2 million rows with an AWS Glue ETL job into an S3 prefix that an Amazon Bedrock knowledge base ingests. Rows with an empty description or a category value outside the approved list produce wrong answers from the assistant. The company wants rows that fail these checks to go to a quarantine prefix for review while all other rows are loaded. The company does not want to write custom validation code.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Generate rule recommendations for the catalog table in the AWS Glue Data Catalog, and schedule data quality evaluation runs on the table after each load.
    - id: b
      text:
        en: |-
          Add the Evaluate Data Quality transform with IsComplete and ColumnValues rules to the ETL job, output the original data with row-level columns, and route rows by DataQualityEvaluationResult.
    - id: c
      text:
        en: |-
          Configure an S3 event notification that invokes a Lambda function to parse each extract, check every row, and move the failing rows to the quarantine prefix.
    - id: d
      text:
        en: |-
          Add the Evaluate Data Quality transform with IsComplete and ColumnValues rules to the ETL job, and set the ruleset failure action to fail the job without loading the target.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      In an ETL job, the Evaluate Data Quality transform can output the original data as rowLevelOutcomes with columns that list the passed, failed and skipped rules and a Passed or Failed DataQualityEvaluationResult for each row. A downstream filter on that column writes passing rows to the target and failing rows to the quarantine prefix, with rules written in DQDL instead of code.
  options:
    a:
      en: |-
        Data Catalog evaluations check tables that are already loaded, and identifying the individual records that failed is supported only in ETL jobs, so bad rows would reach the knowledge base first.
    c:
      en: |-
        A Lambda function that parses and checks every row is custom validation code, which the company wants to avoid.
    d:
      en: |-
        Failing the job without loading stops the whole daily load when any row fails. The requirement is to load the good rows and quarantine only the bad ones.
references:
  - title: Evaluating data quality for ETL jobs in AWS Glue Studio - AWS Glue
    url: https://docs.aws.amazon.com/glue/latest/dg/tutorial-data-quality.html
  - title: AWS Glue Data Quality - AWS Glue
    url: https://docs.aws.amazon.com/glue/latest/dg/glue-data-quality.html
