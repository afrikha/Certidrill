id: aipc01-1a-switch-multivariant-tenant
objective: "1.2.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A SaaS company offers a document assistant to business customers on Basic and Premium plans. Premium tenants must be served by a larger model and Basic tenants by a smaller one, and the product team must be able to move a specific tenant to another model or add a plan without a code release. The model choice depends on the tenant's plan and ID, not on the content of the prompt. The backend runs on Amazon ECS with the AWS AppConfig Agent as a sidecar.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Create an AWS AppConfig multi-variant feature flag whose variants hold the model IDs, with rules on the plan and tenant ID that the service passes as context at retrieval time.
    - id: b
      text:
        en: |-
          Create an Amazon Bedrock prompt router that contains both models, and let the router choose the model for each request.
    - id: c
      text:
        en: |-
          Deploy one ECS service per plan with the model ID in a container environment variable, and route tenants to the services with load balancer rules.
    - id: d
      text:
        en: |-
          Store the mapping of plans to models in a constant in the service code, and release a new container image when the mapping changes.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      A multi-variant feature flag returns different values for different requests: the application passes context keys and values when it retrieves the flag, and the AppConfig Agent evaluates each variant's rule against that context, falling back to the default variant. Plans and tenant exceptions become rules that the product team edits and deploys through AppConfig without a code release.
  options:
    b:
      en: |-
        A prompt router chooses per request from predicted quality and cost, within one model family; it cannot enforce a choice by plan or tenant.
    c:
      en: |-
        Moving a tenant or adding a plan means new services, environment variables and routing rules, which are deployments rather than configuration changes.
    d:
      en: |-
        A constant in the code requires a release for every change, which the requirement excludes.
references:
  - title: Understanding multi-variant feature flag concepts and common use cases - AWS AppConfig
    url: https://docs.aws.amazon.com/appconfig/latest/userguide/appconfig-creating-multi-variant-feature-flags-concepts.html
