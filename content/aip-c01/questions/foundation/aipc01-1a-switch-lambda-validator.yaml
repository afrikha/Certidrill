id: aipc01-1a-switch-lambda-validator
objective: "1.2.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Operators change the model used by a GenAI service through an AWS AppConfig free-form configuration that contains a Bedrock model ID. Last week, one operator deployed a mistyped model ID, and another deployed a model that is in the Legacy state; both changes caused failed requests. The company wants AppConfig to reject such a configuration when a deployment starts, before any target receives it. The model must exist in Amazon Bedrock and be in the Active state.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Add an AWS Lambda validator to the configuration profile that calls GetFoundationModel and fails when the model does not exist or is not Active.
    - id: b
      text:
        en: |-
          Add a JSON Schema validator to the configuration profile that requires the modelId property to be a non-empty string.
    - id: c
      text:
        en: |-
          Add an Amazon CloudWatch alarm on the service's error rate to the AppConfig environment so that a failing deployment rolls back.
    - id: d
      text:
        en: |-
          Increase the bake time of the deployment strategy so that AppConfig detects errors before it marks the deployment as complete.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      A Lambda validator runs when StartDeployment is called and fails the validation when the function throws an exception, before the configuration is deployed. The function can call GetFoundationModel and check the modelLifecycle field, which no static schema can do.
  options:
    b:
      en: |-
        A JSON Schema checks structure and types only; a mistyped or Legacy model ID is still a valid string.
    c:
      en: |-
        An alarm-based rollback reacts after the configuration has reached targets and caused errors, which is what the company wants to prevent.
    d:
      en: |-
        Bake time only extends monitoring after the configuration is deployed; it validates nothing beforehand.
references:
  - title: Understanding validators - AWS AppConfig
    url: https://docs.aws.amazon.com/appconfig/latest/userguide/appconfig-creating-configuration-and-profile-validators.html
  - title: Model lifecycle - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/model-lifecycle.html
