id: aipc01-1d-adv-filter-not-rerank
objective: "1.5.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A pharmaceutical company's compliance assistant uses an Amazon Bedrock knowledge base over standard operating procedures (SOPs). Each SOP is revised several times, and all versions stay in the S3 data source for audit reasons. Superseded versions are almost identical to the current ones, and the assistant often cites a superseded version. Each document has a sidecar metadata file, and the company can add attributes to it.

    Which solution will ensure that only current versions are used in answers?
body:
  options:
    - id: a
      text:
        en: |-
          Add a reranker model to the retrieval configuration so that the most relevant version is ranked first.
    - id: b
      text:
        en: |-
          Switch the search type to HYBRID so that the version number that appears in each document's text is matched exactly.
    - id: c
      text:
        en: |-
          Add a status attribute to each metadata file, sync the data source, and filter retrieval on status equals current.
    - id: d
      text:
        en: |-
          Add the revision date to each sidecar metadata file with includeForEmbedding set to true so that newer chunks score higher.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      A metadata filter narrows the search before ranking, so superseded versions are excluded whatever their similarity. Knowledge Bases reads attributes from the sidecar metadata file at sync time, and an equals filter on the attribute guarantees that only current SOPs are retrieved while all versions stay in S3 for audit.
  options:
    a:
      en: |-
        A reranker scores relevance to the question; near-identical versions get near-identical scores, so it cannot guarantee that the current one wins.
    b:
      en: |-
        Users do not type version numbers, so keyword matching does not distinguish current from superseded text.
    d:
      en: |-
        includeForEmbedding adds the attribute to the embedded text, which only nudges similarity; it does not exclude superseded versions.
references:
  - title: "Configure and customize queries and response generation - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/kb-test-config.html
