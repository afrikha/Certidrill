id: aipc01-1e-few-shot-label-format
objective: "1.6.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An IT services company classifies support tickets into 12 categories with a foundation model (FM). The zero-shot prompt lists the categories, but responses vary between a single label and a sentence that explains the label, and rare categories are often confused with each other. A downstream rule engine needs exactly one label for each ticket. The company wants the fix with the LEAST effort and cost.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Add several labeled ticket examples to the prompt that cover common and rare categories and show the exact one-label output.
    - id: b
      text:
        en: |-
          Fine-tune the model on 10,000 historical tickets that are labeled with their categories, and call the custom model.
    - id: c
      text:
        en: |-
          Ask the model to reason step by step about each of the 12 categories before it decides on the final label.
    - id: d
      text:
        en: |-
          Increase maxTokens so that the model can finish its explanation before it states the label of the ticket.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      Few-shot examples show the model the expected output format and calibrate its decisions, and the model tends to mirror the terse format of the examples. Examples that are diverse and include the rare categories reduce confusion between them. This is a prompt change only, with no training cost.
  options:
    b:
      en: |-
        Fine-tuning needs a training job and a custom model deployment, which is far more effort and cost than adding examples to the prompt.
    c:
      en: |-
        Step-by-step reasoning makes responses longer and adds text around the label, which is the opposite of what the rule engine needs.
    d:
      en: |-
        More output tokens allow longer explanations; they do not make the label consistent or more accurate.
references:
  - title: "Provide examples (few-shot prompting) - Amazon Nova"
    url: https://docs.aws.amazon.com/nova/latest/userguide/prompting-examples.html
