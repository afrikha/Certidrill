id: aipc01-1d-ctx-ttl-expiry
objective: "1.6.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company stores chatbot conversation history in an Amazon DynamoDB table. Each conversation must be deleted 30 days after its last activity. The company wants the lowest cost and no code to run on a schedule.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Run an Amazon EventBridge Scheduler rule each day that invokes a Lambda function to scan the table and delete expired conversations.
    - id: b
      text:
        en: |-
          Enable DynamoDB Streams and have a Lambda function delete each conversation 30 days after its stream record is created.
    - id: c
      text:
        en: |-
          Enable TTL on the table and store, in each item, an expiration attribute in ISO 8601 date format that is refreshed on each new turn.
    - id: d
      text:
        en: |-
          Enable TTL on the table and store, in each item, an expiration attribute as a Number in epoch seconds set to last activity plus 30 days.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      DynamoDB TTL deletes expired items automatically, typically within a few days of the expiration time, without consuming write throughput. The TTL attribute must be a Number in Unix epoch seconds; updating it on each turn keeps the deadline 30 days after the last activity.
  options:
    a:
      en: |-
        A scheduled scan-and-delete job is code to maintain, and the scans and deletes consume capacity.
    b:
      en: |-
        Stream records do not wait 30 days, and a Lambda function would need its own scheduling logic; this is code instead of a built-in feature.
    c:
      en: |-
        Items whose TTL attribute is not a Number are ignored by the TTL process, so nothing is deleted.
references:
  - title: "Using time to live (TTL) in DynamoDB - Amazon DynamoDB"
    url: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/TTL.html
