id: aipc01-1e-flow-renderprompt-role
objective: "1.6.6"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A developer created an Amazon Bedrock flow this year with a custom service role. The role allows bedrock:InvokeModel on the foundation model and lambda:InvokeFunction on the flow's Lambda function. The developer changes the prompt node from an inline prompt to a prompt from Prompt Management that uses the same model, and test invocations now fail with an access denied error at the prompt node. The prompt uses the default AWS managed encryption key.

    Which change will fix the error while following the principle of least privilege?
body:
  options:
    - id: a
      text:
        en: |-
          Add bedrock:GetPrompt on the prompt's ARN to the identity-based policy of the flow service role.
    - id: b
      text:
        en: |-
          Add bedrock:RenderPrompt on the prompt's ARN to the identity-based policy of the flow service role.
    - id: c
      text:
        en: |-
          Add bedrock:InvokeFlow on the flow alias ARN to the identity-based policy of the flow service role.
    - id: d
      text:
        en: |-
          Add bedrock:CreatePromptVersion on the prompt's ARN to the identity-based policy of the flow service role.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      A flow runs its nodes with its service role. Flows created after November 22, 2024 render Prompt Management prompts with bedrock:RenderPrompt, so the role needs that action on the prompt's ARN. No KMS permission is needed because the prompt uses an AWS managed key.
  options:
    a:
      en: |-
        bedrock:GetPrompt was used by flows created before November 22, 2024; a flow created this year renders the prompt with bedrock:RenderPrompt.
    c:
      en: |-
        InvokeFlow is called by the application that starts the flow, not by the flow's own service role.
    d:
      en: |-
        Creating prompt versions is an authoring action; the flow only needs to render the prompt at run time.
references:
  - title: "Create a service role for Amazon Bedrock Flows in Amazon Bedrock - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/flows-permissions.html
