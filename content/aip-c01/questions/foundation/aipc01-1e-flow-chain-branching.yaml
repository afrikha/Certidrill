id: aipc01-1e-flow-chain-branching
objective: "1.6.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An insurance company processes customer emails in three steps: extract the policy number and the request, classify the email as a complaint or a question, and draft a reply with a prompt that differs by class. Each step uses a prompt that another team owns in Amazon Bedrock Prompt Management and reuses in other applications. The company wants a visual workflow that the application starts with one API call, without writing orchestration code.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Create an agent in Amazon Bedrock Agents Classic with one action group per step, and let the agent decide the order in which the steps run.
    - id: b
      text:
        en: |-
          Build an Amazon Bedrock flow with prompt nodes that use the managed prompts and a condition node that routes on the class, and call it with InvokeFlow.
    - id: c
      text:
        en: |-
          Write an AWS Lambda function that calls the Converse API with each prompt version ARN in turn and selects the reply prompt with if statements.
    - id: d
      text:
        en: |-
          Merge the three prompts into one long prompt that extracts the fields, classifies the email, and drafts the reply in a single Converse call.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      Amazon Bedrock Flows (the exam guide's Prompt Flows) links prompts, models, and other resources in a visual builder. Prompt nodes can reference Prompt Management prompts, so the teams' prompts are reused as they are, and a condition node routes the output of the classification prompt to the right reply prompt. The application calls the flow with InvokeFlow.
  options:
    a:
      en: |-
        Bedrock Agents Classic is closed to new customers, and an agent chooses its own steps instead of running a fixed, auditable sequence.
    c:
      en: |-
        The Lambda function is orchestration code that the company would write and maintain, which the requirements exclude.
    d:
      en: |-
        A merged prompt no longer reuses the three team-owned prompts and mixes three tasks in one call.
references:
  - title: "Build an end-to-end generative AI workflow with Amazon Bedrock Flows - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/flows.html
  - title: "Node types for your flow - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/flows-nodes.html
