id: aipc01-1e-lambda-business-rule-check
objective: "1.6.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A retailer's assistant drafts replies to price-match requests. A reply must never offer a discount above 15 % and must include the order number from the request. The company wants every reply checked against these rules before it reaches the customer, with a deterministic result.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Pass each reply to an AWS Lambda function that extracts the discount and the order number and rejects any reply that breaks a rule.
    - id: b
      text:
        en: |-
          Add a denied topic named large discounts to the Amazon Bedrock guardrail that the assistant uses for its responses.
    - id: c
      text:
        en: |-
          Run a weekly Amazon Bedrock LLM-as-a-judge evaluation job with a custom metric that scores compliance with the rules.
    - id: d
      text:
        en: |-
          Turn on the guardrail contextual grounding check with a high relevance threshold for every reply of the assistant.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      Numeric limits and required values are business rules that code can check exactly. A Lambda function that parses each reply and applies the rules gives the same result every time and runs before the reply is sent. Model output is not deterministic, so the application must validate it.
  options:
    b:
      en: |-
        A denied topic blocks a subject that a classifier detects; it does not compare a discount value with 15 % or check for the order number.
    c:
      en: |-
        A judge model gives non-deterministic scores, and a weekly offline job does not check replies before customers receive them.
    d:
      en: |-
        Contextual grounding measures whether a response is grounded in a source and relevant to the query, not whether it follows numeric business rules.
references:
  - title: "Require structured output - Amazon Nova"
    url: https://docs.aws.amazon.com/nova/latest/userguide/prompting-structured-output.html
  - title: "Evaluate model performance using another LLM as a judge - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/evaluation-judge.html
