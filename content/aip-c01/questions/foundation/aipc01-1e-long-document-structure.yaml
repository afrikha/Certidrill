id: aipc01-1e-long-document-structure
objective: "1.6.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An investment research firm asks a foundation model (FM) with a long context window questions about annual reports of about 150 pages. The prompt starts with the question and the instructions, followed by the full report text. Answers are often vague and sometimes mix up figures from different sections, and analysts cannot see where an answer comes from.

    Which prompt change will MOST improve the answers?
body:
  options:
    - id: a
      text:
        en: |-
          Put the report first between start and end markers with numbered passages, put the question last, and ask the model to cite passages.
    - id: b
      text:
        en: |-
          Put the question both before and after the report, and raise the temperature so that the model weighs more parts of the document.
    - id: c
      text:
        en: |-
          Strip the section headings and page numbers from the report so that the prompt is shorter and the model reads less noise.
    - id: d
      text:
        en: |-
          Send each page with the question in a separate request, and return the longest of the resulting answers to the analyst who asked.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      For long inputs, models perform best when the document comes first and the query and instructions come last, with the document delimited by markers. Numbering passages and asking the model to cite the ones it relies on keeps it focused on relevant text and shows analysts where each figure comes from.
  options:
    b:
      en: |-
        A higher temperature adds randomness, which makes mixed-up figures more likely, not less.
    c:
      en: |-
        Headings and page numbers help the model and the analysts locate figures; removing them makes attribution harder.
    d:
      en: |-
        Pages answered in isolation lose the context of the rest of the report, and the longest answer is not the most accurate one.
references:
  - title: "Utilizing long context windows - Amazon Nova"
    url: https://docs.aws.amazon.com/nova/latest/userguide/prompting-long-context.html
