id: aipc01-1a-switch-appconfig-agent-cache
objective: "1.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An AWS Lambda function reads its model settings from AWS AppConfig by calling StartConfigurationSession and GetLatestConfiguration in its handler. At peak, the function runs thousands of times per second, and AppConfig retrieval costs and function duration have increased. The function must still pick up new model settings within a configurable interval, and developers do not want to write code that manages configuration tokens and caching.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Cache the configuration in a global variable for the lifetime of each execution environment, and stop calling AppConfig after the first read.
    - id: b
      text:
        en: |-
          Add the AWS AppConfig Agent Lambda extension as a layer, and read the configuration from its local HTTP endpoint with a configured poll interval.
    - id: c
      text:
        en: |-
          Move the model settings into the function's environment variables, and update them with a script whenever the model changes.
    - id: d
      text:
        en: |-
          Call GetLatestConfiguration from a scheduled Amazon EventBridge rule every minute, and write the result to an S3 object that the function reads.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      The AppConfig Agent Lambda extension calls AppConfig for the function, keeps a local cache, tracks the configuration tokens, and checks for new data in the background when the configured poll interval has elapsed. The function reads from localhost:2772, which reduces AppConfig API calls and function processing time.
  options:
    a:
      en: |-
        A cache that is never refreshed does not pick up new model settings while an execution environment stays warm.
    c:
      en: |-
        Environment variables need a function configuration update for every change, and they lose AppConfig's managed rollout.
    d:
      en: |-
        A scheduled copy to S3 adds components to operate, and the function still reads S3 on every invocation.
references:
  - title: Understanding how the AWS AppConfig Agent Lambda extension works - AWS AppConfig
    url: https://docs.aws.amazon.com/appconfig/latest/userguide/appconfig-integration-lambda-extensions-how-it-works.html
  - title: Using AWS AppConfig Agent with AWS Lambda - AWS AppConfig
    url: https://docs.aws.amazon.com/appconfig/latest/userguide/appconfig-integration-lambda-extensions.html
