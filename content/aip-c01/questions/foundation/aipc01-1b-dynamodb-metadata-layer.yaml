id: aipc01-1b-dynamodb-metadata-layer
objective: "1.4.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company's document portal keeps each document's owner, version and approval status in an Amazon DynamoDB table, which the portal reads with single-digit-millisecond latency. The company now wants a RAG assistant over the same documents, which are stored in Amazon S3, with managed ingestion, chunking and citations from Amazon Bedrock Knowledge Bases. Retrieval must be filterable by approval status, and each retrieved chunk must be traceable to its DynamoDB item. A developer proposes to store the embeddings in a DynamoDB vector index and register it as the knowledge base's vector store.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Follow the proposal: create a vector index on the DynamoDB table and register the table as the vector store of a customer-managed knowledge base.
    - id: b
      text:
        en: |-
          Store the embeddings as attributes of the DynamoDB items, and compute cosine similarity over a scan of the table in a Lambda function for each query.
    - id: c
      text:
        en: |-
          Keep DynamoDB as the metadata layer, use a knowledge base with a supported vector store, and put each document's ID and approval status in its metadata file.
    - id: d
      text:
        en: |-
          Replace the DynamoDB table with an Amazon S3 Vectors index that stores the embeddings and all the portal's document attributes as vector metadata.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      DynamoDB is not one of the vector stores that knowledge bases support (OpenSearch Serverless and managed clusters, S3 Vectors, Aurora PostgreSQL, Neptune Analytics, Pinecone, Redis Enterprise Cloud, MongoDB Atlas). DynamoDB stays the fast metadata layer keyed by document ID, while the knowledge base stores the embeddings; the document ID and approval status in each document's metadata file enable filtering and the link back to DynamoDB.
  options:
    a:
      en: |-
        DynamoDB vector search can serve applications that generate their own embeddings, but a DynamoDB table cannot be registered as a knowledge base vector store, so there would be no managed ingestion, chunking or citations.
    b:
      en: |-
        Scanning the table and computing similarity in code is a custom, slow and costly search, and it gives up the managed ingestion and citations.
    d:
      en: |-
        S3 Vectors limits custom metadata to 1 KB and 35 keys per vector and is not built for the portal's millisecond item reads and updates, so it cannot replace the DynamoDB table.
references:
  - title: Prerequisites for using a vector store you created for a knowledge base - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/knowledge-base-setup.html
