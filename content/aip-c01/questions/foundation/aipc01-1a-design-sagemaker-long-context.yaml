id: aipc01-1a-design-sagemaker-long-context
objective: "1.1.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A legal-tech company fine-tuned an open-weights Llama 3.1 model on its own contracts and extended the model's maximum context length to 256K tokens so that whole contract bundles fit in one prompt. The weights are stored in Hugging Face format in Amazon S3 in us-east-1. The company must serve the model for real-time requests from its application and must keep the 256K-token context length. It wants the LEAST operational overhead.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Import the weights into Amazon Bedrock with Custom Model Import, and invoke the imported model on demand with the InvokeModel API.
    - id: b
      text:
        en: |-
          Deploy the fine-tuned weights from S3 to an Amazon SageMaker AI real-time endpoint on GPU instances, and call the endpoint from the application.
    - id: c
      text:
        en: |-
          Subscribe to a Llama model in Amazon Bedrock Marketplace, and deploy the listing to a SageMaker AI-managed endpoint for the application.
    - id: d
      text:
        en: |-
          Run the fine-tuned weights on Amazon EC2 GPU instances with a self-managed inference server in an Auto Scaling group behind a load balancer.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      A SageMaker AI real-time endpoint hosts any model that the company packages, on instance types it chooses, with managed infrastructure and scaling. It is the managed option that can serve a model whose context length exceeds what Bedrock Custom Model Import accepts.
  options:
    a:
      en: |-
        Custom Model Import requires the maximum positional embeddings (context length) to be under 128K, so the 256K-token model cannot be imported.
    c:
      en: |-
        A Marketplace listing deploys the provider's model, not the company's fine-tuned weights with the extended context.
    d:
      en: |-
        Self-managed EC2 instances work but leave patching, the inference server, scaling and health checks to the company, which is more overhead than a SageMaker AI endpoint.
references:
  - title: Use Custom model import to import a customized open-source model into Amazon Bedrock - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/model-customization-import-model.html
