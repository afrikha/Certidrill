id: aipc01-1d-qh-express-parallel
objective: "1.5.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company's query pipeline classifies each question, rewrites it, decomposes it into up to five sub-queries, retrieves context for each sub-query in parallel from an Amazon Bedrock knowledge base, merges and reranks the results, and generates the answer. An API calls the pipeline and waits for the answer, which is always produced in less than 30 seconds. The pipeline handles millions of requests each month, and the team wants managed orchestration with retries and a visual execution view.

    Which solution will meet these requirements MOST cost-effectively?
body:
  options:
    - id: a
      text:
        en: |-
          An AWS Step Functions Standard workflow with a Map state, where the API polls the execution status until the workflow finishes.
    - id: b
      text:
        en: |-
          An Amazon Bedrock flow that uses an iterator node to send each sub-query to a knowledge base node and a collector node to merge the results.
    - id: c
      text:
        en: |-
          An AWS Step Functions Express workflow started synchronously, with a Map state for the sub-queries, Amazon Bedrock tasks, and a Lambda merge step.
    - id: d
      text:
        en: |-
          A single Lambda function that runs every step in sequence and writes logs to Amazon CloudWatch Logs.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      Express workflows suit short, high-volume, request-response workloads: they run for up to 5 minutes, can be started synchronously so the API gets the result directly, and still provide retries and execution views. A Map state runs the sub-query retrievals concurrently.
  options:
    a:
      en: |-
        Standard workflows are designed for long-running executions (up to 1 year) and are priced per state transition, which costs more at millions of short executions; polling also adds latency.
    b:
      en: |-
        An iterator node sends array items one by one rather than in parallel, so the sub-queries would not be retrieved concurrently.
    d:
      en: |-
        A single function loses the managed retries per step and the visual execution view, and runs the sub-queries sequentially.
references:
  - title: "Step Functions service quotas - AWS Step Functions"
    url: https://docs.aws.amazon.com/step-functions/latest/dg/service-quotas.html
  - title: "Discover service integration patterns in Step Functions - AWS Step Functions"
    url: https://docs.aws.amazon.com/step-functions/latest/dg/connect-to-resource.html
