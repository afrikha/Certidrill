id: aipc01-1c-maint-managed-weekly-sync
objective: "1.4.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company uses an Amazon Bedrock Managed Knowledge Base with a SharePoint Online data source for its HR assistant. HR publishes policy updates during the week, and the knowledge base must pick them up every Monday. The company does not want to write or operate any code for the refresh.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Create an Amazon EventBridge Scheduler schedule that invokes a Lambda function every Monday to call StartIngestionJob.
    - id: b
      text:
        en: |-
          Have a Lambda function call IngestKnowledgeBaseDocuments for each policy that HR updates during the week.
    - id: c
      text:
        en: |-
          Set a weekly sync schedule with dayOfWeek set to MONDAY on the data source.
    - id: d
      text:
        en: |-
          Ask an HR administrator to choose Sync on the data source in the console every Monday morning.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      Data sources of a managed knowledge base accept a syncSchedule: daily, weekly on a chosen day, or monthly on a chosen day. A weekly schedule on Monday runs an incremental sync at an automatically chosen time, with no code to write or run.
  options:
    a:
      en: |-
        This works, but it adds a schedule, a function, and its permissions to maintain, which the built-in sync schedule avoids.
    b:
      en: |-
        Direct ingestion needs custom code that detects each change and calls the API.
    d:
      en: |-
        A manual sync depends on a person every week; the requirement is an automatic refresh.
references:
  - title: "Sync a data source - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/kb-managed-sync.html
