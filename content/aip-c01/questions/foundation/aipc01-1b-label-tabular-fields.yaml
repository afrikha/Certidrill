id: aipc01-1b-label-tabular-fields
objective: "1.3.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A fleet-maintenance assistant adds recent sensor readings to its prompts as raw CSV rows copied from a telemetry export, without a header, for example: TRK-112,2026-11-02,87,3.1,1. The model often confuses the coolant temperature with the speed and misreads the units. The company wants the model to interpret every reading correctly with a deterministic fix and few extra tokens.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Switch to a larger model with a longer context window so that it can infer the meaning of each column from more rows.
    - id: b
      text:
        en: |-
          Render the readings as a table image and send it to a multimodal model in an image block together with the question.
    - id: c
      text:
        en: |-
          Add three example rows with their interpretations to the prompt so that the model learns the column order from the examples.
    - id: d
      text:
        en: |-
          Convert each row in a Lambda function into labeled fields with units, such as coolant_temp_c and speed_kmh, before adding it to the prompt.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      Normalizing the data in Lambda turns ambiguous positional values into explicitly named fields with their units, the same way every time. The model no longer has to guess the column meanings, and a compact labeled format adds only a few tokens.
  options:
    a:
      en: |-
        A larger model still has to guess what unlabeled numbers mean, and it costs more per request.
    b:
      en: |-
        An image of an unlabeled table is no clearer than the text, and image inputs add tokens and an extra interpretation step.
    c:
      en: |-
        Examples help, but the model's interpretation remains probabilistic and the examples add tokens to every request, so the fix is not deterministic.
references:
  - title: Monitor your token usage by counting tokens before running inference - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/count-tokens.html
