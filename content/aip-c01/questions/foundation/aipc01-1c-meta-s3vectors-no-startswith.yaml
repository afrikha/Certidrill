id: aipc01-1c-meta-s3vectors-no-startswith
objective: "1.4.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A logistics company stores 30 million shipping documents in an Amazon Bedrock knowledge base backed by Amazon S3 Vectors, chosen for its low storage cost. Each document's metadata file has a doc_ref attribute such as EU-DE-2026-00412, where the first two letters identify the business region. Analysts must restrict retrieval to one business region, but a test with a startsWith filter on doc_ref is rejected. The company wants the MOST cost-effective solution.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Add a business_region STRING attribute, such as EU, to each metadata file, sync the data source, and filter with equals on business_region.
    - id: b
      text:
        en: |-
          Replace the startsWith filter with a stringContains filter on doc_ref that matches the two-letter region code.
    - id: c
      text:
        en: |-
          Migrate the knowledge base to an OpenSearch Serverless vector store, which supports startsWith, and keep the existing filter.
    - id: d
      text:
        en: |-
          Set includeForEmbedding to true for doc_ref, and add the region code to every question so that similarity favors that region.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      S3 vector buckets do not support the startsWith and stringContains operators, but they support equals on string attributes. Writing the region as its own attribute and filtering with equals gives an exact restriction while keeping the low-cost store; a metadata-only change does not require re-embedding.
  options:
    b:
      en: |-
        stringContains is not supported with S3 vector buckets either, and a substring match on doc_ref could also match the code elsewhere in the reference.
    c:
      en: |-
        OpenSearch Serverless supports startsWith, but migrating 30 million documents to a more expensive store does not meet the cost requirement.
    d:
      en: |-
        Embedding the attribute only changes similarity scores; documents from other regions are still returned.
references:
  - title: "Configure and customize queries and response generation - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/kb-test-config.html
  - title: "Prerequisites for using a vector store you created for a knowledge base - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/knowledge-base-setup.html
