id: aipc01-1e-structured-output-truncation
objective: "1.6.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A logistics company extracts shipment data from carrier documents. An AWS Lambda function calls the Amazon Bedrock Converse API with a JSON schema in outputConfig.textFormat and maxTokens set to 1,000, and then parses the response. For about 3 % of long documents, parsing fails. Every failed response has the stopReason value max_tokens. The company must eliminate these failures with the LEAST effort.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Add an instruction to the system prompt that tells the model to always return valid, complete JSON with no text before or after it.
    - id: b
      text:
        en: |-
          Raise maxTokens to fit the largest expected object, and have the function check stopReason and reject or retry any response that stopped at max_tokens.
    - id: c
      text:
        en: |-
          Replace the JSON schema output format with a tool definition that sets strict to true, and force the model to call that tool for every document.
    - id: d
      text:
        en: |-
          Set the temperature to 0 so that the model returns the same, shorter JSON object every time it processes the same document.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      Structured outputs constrain the response to the schema, but when the response reaches the token limit first, the model stops with max_tokens and returns incomplete JSON. Setting maxTokens high enough for the full object removes the cause, and checking stopReason before parsing catches any remaining truncation.
  options:
    a:
      en: |-
        An instruction cannot make the model finish an object once the token budget is exhausted; the output is cut at maxTokens anyway.
    c:
      en: |-
        Strict tool use also constrains the output to a schema, but the response is still limited by maxTokens and can be truncated the same way.
    d:
      en: |-
        Greedy decoding makes responses more repeatable, but it does not shorten the object that a long document requires.
references:
  - title: "Get validated JSON results from models - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/structured-output.html
  - title: "Converse - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/APIReference/API_runtime_Converse.html
