id: aipc01-1d-if-org-guardrail-enforcement
objective: "1.6.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    An enterprise has 40 AWS accounts in AWS Organizations, and developers in many of them call Amazon Bedrock models directly. Compliance requires that the company's guardrail (content filters and sensitive information filters) is applied to the inputs and outputs of every Bedrock model invocation in all accounts, including calls in which developers omit a guardrail configuration. Embedding models must be excluded.

    Which solution will meet these requirements with the LEAST operational overhead?
body:
  options:
    - id: a
      text:
        en: |-
          Attach a service control policy that denies Bedrock inference calls unless the bedrock:GuardrailIdentifier condition key matches the company's guardrail.
    - id: b
      text:
        en: |-
          Call PutEnforcedGuardrailConfiguration in each of the 40 accounts and in every Region that the accounts use.
    - id: c
      text:
        en: |-
          Create the guardrail and a numeric version, and attach an AWS Organizations Amazon Bedrock policy that enforces it for all models except the embedding models.
    - id: d
      text:
        en: |-
          Require every team to send prompts and responses through a central Lambda function that calls the ApplyGuardrail operation.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      Amazon Bedrock policies in AWS Organizations (policy type BEDROCK_POLICY) apply a guardrail to all model invocations across the organization, OUs, or accounts, on inputs and outputs, even when the request has no guardrail. The policy references an immutable numeric guardrail version, created in each Region where enforcement applies, and can list excluded models such as embedding models.
  options:
    a:
      en: |-
        An SCP can only deny: calls that omit the guardrail would fail instead of being guarded, which breaks applications rather than applying the guardrail.
    b:
      en: |-
        Account-level enforcement works, but configuring 40 accounts in each Region and keeping them aligned is more overhead than one organization policy.
    d:
      en: |-
        A central ApplyGuardrail function depends on every team changing its code and cannot catch direct calls that bypass it.
references:
  - title: "Apply cross-account safeguards with Amazon Bedrock Guardrails enforcements - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/guardrails-enforcements.html
