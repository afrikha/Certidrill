id: aipc01-1a-switch-appconfig-rollout
objective: "1.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company's summarization service runs on 40 AWS Lambda functions that read the Amazon Bedrock model ID from an environment variable. Changing the model requires updating every function's configuration, and the last change caused errors for all users at once. The company wants to change the model at runtime without updating function code or function configuration, expose the new model to a growing share of requests, and revert automatically if the error rate rises.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Store the model configuration in AWS AppConfig, deploy changes with a gradual deployment strategy, and add a CloudWatch alarm that triggers an automatic rollback.
    - id: b
      text:
        en: |-
          Publish a new version of each function with the new environment variable, and shift traffic to it gradually with weighted Lambda aliases.
    - id: c
      text:
        en: |-
          Store the model ID in an AWS Systems Manager Parameter Store parameter, and have the functions read the parameter on every invocation.
    - id: d
      text:
        en: |-
          Store the model ID in an Amazon DynamoDB table, and have an operator restore the previous value manually if the error rate rises.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      AWS AppConfig changes model settings while the application runs, without redeploying code. Its deployments roll out gradually (for example to 10 %, then 20 %, then 30 % of traffic), and if a CloudWatch alarm fires during the rollout, AppConfig rolls the change back automatically.
  options:
    b:
      en: |-
        New function versions are a configuration change of all 40 functions, which the company wants to avoid, and alias weights alone do not roll back automatically.
    c:
      en: |-
        A parameter switches every function at once, with no gradual exposure and no alarm-based rollback.
    d:
      en: |-
        A table update reaches all requests at once, and a manual restore is not an automatic rollback.
references:
  - title: AWS AppConfig launches support for managing native AI model and AI prompt configuration
    url: https://aws.amazon.com/about-aws/whats-new/2026/11/aws-appconfig-native-ai-model-invocation-prompt-configurations/
