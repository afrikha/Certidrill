id: aipc01-1b-custom-deployment-on-demand
objective: "1.2.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    In March 2026, a company ran an Amazon Bedrock supervised fine-tuning job on Amazon Nova Lite in the us-east-1 Region to create a custom model that classifies support tickets. Each ticket must be classified within a few seconds of its creation. The application sends about 2,000 requests on weekdays during business hours and almost none at night or on weekends. The company wants the MOST cost-effective way to serve the custom model.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Create a custom model deployment for on-demand inference, and use the deployment ARN as the model ID in the application's inference requests.
    - id: b
      text:
        en: |-
          Purchase Provisioned Throughput with a one-month commitment for the custom model, and use the provisioned model ARN as the model ID.
    - id: c
      text:
        en: |-
          Call the custom model's ARN directly with on-demand InvokeModel requests, without creating a deployment or Provisioned Throughput.
    - id: d
      text:
        en: |-
          Collect the tickets in Amazon S3 and run a batch inference job with the custom model every hour on the tickets received since the last job.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      Custom models created with a customization job on or after July 16, 2025, from supported base models such as Amazon Nova Lite in US East (N. Virginia), can be deployed for on-demand inference. The company pays only for what it uses, with no provisioned compute, which fits a workload that is idle at night and on weekends. The application passes the deployment ARN as the model ID.
  options:
    b:
      en: |-
        Provisioned Throughput bills the committed capacity every hour of the month, including nights and weekends when almost no requests arrive, so it costs more than on-demand inference for this traffic.
    c:
      en: |-
        A custom model is not invoked through its own ARN on demand. Inference requests must target a custom model deployment (on-demand) or a provisioned model (Provisioned Throughput).
    d:
      en: |-
        Hourly batch jobs would classify tickets up to an hour after they are created, which violates the requirement to classify each ticket within seconds.
references:
  - title: Deploy a custom model for on-demand inference - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/deploy-custom-model-on-demand.html
  - title: Converse - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/APIReference/API_runtime_Converse.html
