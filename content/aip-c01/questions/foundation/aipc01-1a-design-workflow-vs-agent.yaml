id: aipc01-1a-design-workflow-vs-agent
objective: "1.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An insurance company wants to automate claim processing: extract fields from each claim with a foundation model in Amazon Bedrock, validate them against the policy system, compute the payout with existing business rules, and draft a decision letter with a model. The steps and their order never change. Auditors require a record of every step's input and output for each claim, and a failed step must be retried without repeating the steps that already completed.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Build an autonomous agent with Strands Agents on Amazon Bedrock AgentCore Runtime, give it the four operations as tools, and let the model decide the order of the calls.
    - id: b
      text:
        en: |-
          Chain the four steps inside one AWS Lambda function that calls the model and the policy system in sequence, and log each step to Amazon CloudWatch Logs.
    - id: c
      text:
        en: |-
          Orchestrate the four steps in an AWS Step Functions Standard workflow with one Task state per step, a Retry field on each Task, and the execution history as the audit record.
    - id: d
      text:
        en: |-
          Send the claim and the business rules to a model in a single prompt, and ask it to validate the fields, compute the payout, and draft the letter in one response.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      When the steps are known and fixed, a deterministic workflow fits better than an agent. Step Functions Standard workflows run each state exactly once unless a Retry is specified, retry only the failing Task, and keep an execution history retrievable through the API for 90 days, which makes them suited to durable, auditable processes.
  options:
    a:
      en: |-
        An autonomous agent chooses its own sequence of tool calls, which adds variability to a process whose order must never change.
    b:
      en: |-
        A failure inside one function restarts the whole chain, so completed steps run again, and custom log lines are a weaker audit record than a managed execution history.
    d:
      en: |-
        A model must not replace existing business rules for payout calculation, and a single response provides no per-step record or per-step retry.
references:
  - title: Choosing workflow type in Step Functions - AWS Step Functions
    url: https://docs.aws.amazon.com/step-functions/latest/dg/choosing-workflow-type.html
  - title: Handling errors in Step Functions workflows - AWS Step Functions
    url: https://docs.aws.amazon.com/step-functions/latest/dg/concepts-error-handling.html
