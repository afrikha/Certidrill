id: aipc01-1c-maint-delete-events
objective: "1.4.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A legal firm keeps contracts in an S3 bucket that is the data source of a customer-managed Amazon Bedrock knowledge base. A Lambda function triggered by Object Created events calls IngestKnowledgeBaseDocuments so that new contracts are searchable within minutes, and a full sync runs every Sunday. When a contract is withdrawn and deleted from the bucket, it must stop appearing in answers within 15 minutes.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Change the dataDeletionPolicy of the data source to DELETE so that vectors are removed as soon as objects are deleted from the bucket.
    - id: b
      text:
        en: |-
          Add an S3 Lifecycle rule that expires delete markers in the bucket so that the knowledge base no longer finds the contracts.
    - id: c
      text:
        en: |-
          Start an ingestion job from the Lambda function for every Object Created and Object Deleted event so that each change triggers a sync.
    - id: d
      text:
        en: |-
          Route Object Deleted events to a Lambda function that calls DeleteKnowledgeBaseDocuments with the S3 location of the deleted contract.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      Direct ingestion also covers deletions: DeleteKnowledgeBaseDocuments removes a document from the knowledge base immediately, without a sync. Triggering it from the bucket's Object Deleted events keeps the index in step with the bucket within minutes, and the Sunday sync finds nothing left to remove.
  options:
    a:
      en: |-
        dataDeletionPolicy applies when the data source itself is deleted; deleted objects are otherwise removed from the vector store only at the next sync.
    b:
      en: |-
        Lifecycle rules act on the bucket's objects, not on the vectors already stored in the knowledge base.
    c:
      en: |-
        A sync scans the whole data source, and AWS advises against running direct ingestion and an ingestion job at the same time, which this design would do constantly.
references:
  - title: "Ingest changes directly into a knowledge base - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/kb-direct-ingestion.html
  - title: "Using EventBridge - Amazon Simple Storage Service"
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/EventBridge.html
