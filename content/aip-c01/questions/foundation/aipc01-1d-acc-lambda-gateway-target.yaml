id: aipc01-1d-acc-lambda-gateway-target
objective: "1.5.6"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company runs vector search on its own Amazon OpenSearch Service index with custom query logic; the index is not part of an Amazon Bedrock knowledge base. Agents hosted on Amazon Bedrock AgentCore Runtime and other MCP clients must call this search as a standard MCP tool, with OAuth-based authorization of inbound callers. The company does not want to run or scale an MCP server itself.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Write a Lambda function that runs the vector query, and add it as a Lambda target of an AgentCore Gateway that the agents use as their MCP endpoint.
    - id: b
      text:
        en: |-
          Build an MCP server that runs the vector query, deploy it on Amazon ECS on AWS Fargate behind an Application Load Balancer, and implement OAuth in the server.
    - id: c
      text:
        en: |-
          Migrate the documents to a Managed Knowledge Base and use its native AgentCore Gateway integration.
    - id: d
      text:
        en: |-
          Add a tool definition that calls the OpenSearch index to the Converse requests of each agent.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      AgentCore Gateway converts Lambda functions, APIs, and existing services into MCP-compatible tools, and it manages inbound authorization of agents and outbound credentials to tools. Wrapping the custom query in a Lambda function and registering it as a Gateway target gives every MCP client the same tool with no MCP server to operate.
  options:
    b:
      en: |-
        A self-hosted MCP server on ECS works, but the company would run, scale, and secure the server itself, which it wants to avoid.
    c:
      en: |-
        The native Gateway integration is for Managed Knowledge Bases; migrating would replace the custom query logic and the index the company wants to keep.
    d:
      en: |-
        Per-agent tool definitions are not a standard MCP tool, and each agent would implement and secure the call itself.
references:
  - title: "Amazon Bedrock AgentCore Gateway: A secure AI gateway for agents, tools, and models - Amazon Bedrock AgentCore"
    url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/gateway.html
