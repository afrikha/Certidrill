id: aipc01-1c-embed-query-dimension-mismatch
objective: "1.5.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A developer builds a RAG feature on an Amazon OpenSearch Serverless index whose documents were embedded with Amazon Titan Text Embeddings V2 at 512 dimensions. The application embeds each question with the same model but sends only inputText in the request body. Searches fail with a vector dimension mismatch error.

    Which change will fix the issue with the LEAST effort?
body:
  options:
    - id: a
      text:
        en: |-
          Re-create the index with 1,024-dimension vectors, and re-embed all documents with the default settings.
    - id: b
      text:
        en: |-
          Add "dimensions": 512 to the InvokeModel request body that embeds each question.
    - id: c
      text:
        en: |-
          Add "normalize": false to the InvokeModel request body that embeds each question.
    - id: d
      text:
        en: |-
          Add "embeddingTypes": ["binary"] to the InvokeModel request body that embeds each question.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      Titan Text Embeddings V2 returns 1,024 dimensions by default. Questions must be embedded with the same model and dimensions as the documents, so the request must set dimensions to 512, which fixes the error without touching the index.
  options:
    a:
      en: |-
        Re-embedding every document would also align the dimensions, but it is far more work than changing one request parameter.
    c:
      en: |-
        normalize only scales the vector; the query would still have 1,024 dimensions.
    d:
      en: |-
        Binary embeddings are a different vector type, and the query would still have the default 1,024 dimensions.
references:
  - title: "Amazon Titan Embeddings G1 - Text - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/model-parameters-titan-embed-text.html
