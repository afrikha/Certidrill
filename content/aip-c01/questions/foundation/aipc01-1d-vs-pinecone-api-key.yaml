id: aipc01-1d-vs-pinecone-api-key
objective: "1.5.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A marketing company already stores its document embeddings in a Pinecone index, and it wants a customer-managed Amazon Bedrock knowledge base to use that index as its vector store. The security team requires that the Pinecone API key is never stored in plain text in configuration or code, and that it can be encrypted with a customer managed AWS KMS key.

    How should the company provide the API key to the knowledge base?
body:
  options:
    - id: a
      text:
        en: |-
          Store the key as a SecureString parameter in AWS Systems Manager Parameter Store, and give the parameter name in the knowledge base storage configuration.
    - id: b
      text:
        en: |-
          Add the key to the .metadata.json file of each document in the S3 data source so that the ingestion job can authenticate to Pinecone.
    - id: c
      text:
        en: |-
          Create an IAM role that Pinecone trusts, and give the role ARN to the knowledge base instead of an API key.
    - id: d
      text:
        en: |-
          Store the key under the name apiKey in an AWS Secrets Manager secret encrypted with the KMS key, and reference the secret ARN.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      For a Pinecone vector store, Knowledge Bases reads the credentials from an AWS Secrets Manager secret whose key is apiKey and whose value is the API key; the secret ARN is part of the vector store configuration. If the secret is encrypted with a customer managed KMS key, you provide that key as well.
  options:
    a:
      en: |-
        The knowledge base storage configuration takes a Secrets Manager secret ARN for third-party vector stores, not a Parameter Store parameter.
    b:
      en: |-
        Metadata files hold document attributes for filtering; putting a credential there exposes it in the data source and is not how the store authenticates.
    c:
      en: |-
        Pinecone authenticates the knowledge base with its API key; an IAM role is not a credential that Pinecone accepts.
references:
  - title: "Prerequisites for using a vector store you created for a knowledge base - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/knowledge-base-setup.html
