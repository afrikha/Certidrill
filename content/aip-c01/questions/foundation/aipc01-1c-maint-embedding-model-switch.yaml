id: aipc01-1c-maint-embedding-model-switch
objective: "1.4.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company's customer-managed Amazon Bedrock knowledge base uses Amazon Titan Text Embeddings V2 and an Amazon OpenSearch Serverless vector store. To support new markets, the company decides to move to Cohere Embed Multilingual v3. The assistant must keep answering during the change, and retrieval quality must be verified before users see results from the new model.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Update the knowledge base to use Cohere Embed Multilingual v3, then start an ingestion job so that the incremental sync re-embeds the documents.
    - id: b
      text:
        en: |-
          Keep Titan embeddings for the documents, and embed only the user questions with Cohere Embed Multilingual v3 so that multilingual questions are understood.
    - id: c
      text:
        en: |-
          Add a second data source to the same knowledge base that uses Cohere Embed Multilingual v3 for new documents only.
    - id: d
      text:
        en: |-
          Create a new knowledge base and vector index with Cohere Embed Multilingual v3, ingest all documents, evaluate retrieval, and then switch the application to it.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      Vectors from two models live in different vector spaces and cannot be compared, so every document must be embedded again with the new model. Building a separate knowledge base lets the current one keep serving users while the new index is filled and evaluated, and the application switches only after the checks pass.
  options:
    a:
      en: |-
        The embedding model is part of the knowledge base configuration, and even a re-run sync processes only changed documents, leaving the index full of Titan vectors that Cohere query vectors cannot match.
    b:
      en: |-
        Questions and documents must be embedded with the same model; Cohere query vectors compared with Titan document vectors give meaningless similarity scores.
    c:
      en: |-
        The embedding model is set for the whole knowledge base, not per data source, and old documents would stay on the previous model anyway.
references:
  - title: "Amazon Titan Text Embeddings models - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/titan-embedding-models.html
  - title: "Sync your data with your Amazon Bedrock knowledge base - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/kb-data-source-sync-ingest.html
