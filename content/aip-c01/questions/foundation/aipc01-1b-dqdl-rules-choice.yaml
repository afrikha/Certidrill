id: aipc01-1b-dqdl-rules-choice
objective: "1.3.1"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    A company stores support tickets in a table that feeds a GenAI triage assistant. Before each load, an AWS Glue Data Quality ruleset must reject tickets that reuse an existing ticket_id. It must also reject tickets whose language column holds a value other than en or de, because the assistant has prompts only for English and German.

    Which DQDL rules should the company add to the ruleset? (Choose two.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          IsUnique "ticket_id"
    - id: b
      text:
        en: |-
          IsComplete "ticket_id"
    - id: c
      text:
        en: |-
          RowCount > avg(last(10))
    - id: d
      text:
        en: |-
          ColumnValues "language" in ["en", "de"]
    - id: e
      text:
        en: |-
          Completeness "language" > 0.95
answer: { optionIds: [a, d] }
explanation:
  correct:
    en: |-
      IsUnique checks that every value of ticket_id is unique, which catches reused IDs. ColumnValues with an in list checks that every language value belongs to the allowed set, so any other language fails the rule.
  options:
    b:
      en: |-
        IsComplete checks that no ticket_id is missing. A duplicated ID is still complete, so the rule would pass.
    c:
      en: |-
        This dynamic rule compares the row count with the average of the last 10 runs. It checks volume, not the content of ticket_id or language.
    e:
      en: |-
        Completeness checks the share of non-null values. A ticket in French has a non-null language value and would pass.
references:
  - title: Data Quality Definition Language (DQDL) reference - AWS Glue
    url: https://docs.aws.amazon.com/glue/latest/dg/dqdl.html
