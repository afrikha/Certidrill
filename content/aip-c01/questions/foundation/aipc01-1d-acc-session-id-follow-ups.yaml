id: aipc01-1d-acc-session-id-follow-ups
objective: "1.5.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A bank's FAQ assistant calls RetrieveAndGenerate on an Amazon Bedrock knowledge base. Follow-up questions must use the context of earlier turns. A developer tried to pass each user's ID as the sessionId on the first request, and the requests failed. The assistant runs on several stateless Lambda function instances.

    Which solution will maintain the conversation context?
body:
  options:
    - id: a
      text:
        en: |-
          Generate a UUID for each conversation in the application, store it in Amazon DynamoDB, and pass it as the sessionId of every request.
    - id: b
      text:
        en: |-
          Prepend the previous questions and answers to the input text of every RetrieveAndGenerate request instead of using sessions.
    - id: c
      text:
        en: |-
          Keep the sessionId that Amazon Bedrock returns in the first response in Amazon DynamoDB, and pass it in each later request of the conversation.
    - id: d
      text:
        en: |-
          Call the Retrieve operation with the user's ID as the session identifier, and generate the answer with the Converse API.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      Amazon Bedrock generates the sessionId on the first RetrieveAndGenerate request and the caller cannot set it explicitly. Reusing that value on later requests lets Bedrock maintain context; persisting it in DynamoDB makes it available to any Lambda instance that handles the next turn.
  options:
    a:
      en: |-
        A sessionId generated by the application is still an explicitly set value, which RetrieveAndGenerate does not accept.
    b:
      en: |-
        Packing the history into the input text inflates the retrieval query and the prompt; the session mechanism is designed to keep this context.
    d:
      en: |-
        Retrieve has no session concept, and this loses the managed context handling of RetrieveAndGenerate.
references:
  - title: "RetrieveAndGenerate - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/APIReference/API_agent-runtime_RetrieveAndGenerate.html
