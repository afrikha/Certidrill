id: aipc01-1b-managed-kb-embedding-options
objective: "1.4.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company is creating an Amazon Bedrock Managed Knowledge Base for its product documentation so that Amazon Bedrock manages ingestion, storage, indexing and retrieval. Before the build, the ML team lists the embedding configurations it is considering and asks which of them the managed knowledge base can use.

    Which embedding configurations can the company choose for the managed knowledge base? (Choose two.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Amazon Titan Text Embeddings V2 configured to produce 512-dimension float vectors
    - id: b
      text:
        en: |-
          The built-in managed embedding model that the managed knowledge base provides
    - id: c
      text:
        en: |-
          An embedding model fine-tuned on SageMaker AI and brought into Amazon Bedrock with Custom Model Import
    - id: d
      text:
        en: |-
          Amazon Titan Text Embeddings V2 configured to produce binary vectors
    - id: e
      text:
        en: |-
          An Amazon Bedrock embedding model that produces float32 vectors with 1,024 dimensions
answer: { optionIds: [b, e] }
explanation:
  correct:
    en: |-
      A Managed Knowledge Base comes with a built-in managed embedding model at no extra cost. Optionally, the company can choose its own Amazon Bedrock embedding model, but only one that produces float32 vectors with 1,024 dimensions.
  options:
    a:
      en: |-
        Custom embedding models in a managed knowledge base must produce 1,024-dimension vectors, so a 512-dimension configuration is not accepted. A customer-managed knowledge base would allow it.
    c:
      en: |-
        Custom Model Import does not support embedding models, so a fine-tuned embedding model cannot be imported into Amazon Bedrock this way.
    d:
      en: |-
        Managed knowledge bases require float32 vectors. Binary vectors are supported only by OpenSearch vector stores in customer-managed knowledge bases.
references:
  - title: Build a managed knowledge base - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/kb-build-managed.html
  - title: Use Custom model import to import a customized open-source model into Amazon Bedrock - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/model-customization-import-model.html
