id: aipc01-1e-flow-condition-order
objective: "1.6.6"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company's Amazon Bedrock flow scores support tickets for urgency from 0 to 100 with a prompt node followed by a Lambda function node that returns the score as a number. A condition node then has two conditions in this order: standard, with the expression score > 50, and critical, with the expression score > 80, plus the default condition. Tickets with a score of 95 reach the standard branch instead of the critical branch.

    Which change will fix the routing?
body:
  options:
    - id: a
      text:
        en: |-
          Put the critical condition before the standard condition, or change the standard expression to (score > 50) and (score <= 80).
    - id: b
      text:
        en: |-
          Change the critical expression to score >= 80 so that the critical condition is true for more of the tickets.
    - id: c
      text:
        en: |-
          Connect the default condition to the critical branch so that tickets that match no condition reach that branch.
    - id: d
      text:
        en: |-
          Change the data type of the condition node's score input from Number to String so that the comparison is exact.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      A condition node evaluates its conditions in order, and when several are true, the earlier one wins. A score of 95 satisfies score > 50 first, so the ticket follows the standard branch. Evaluating critical first, or making the standard range exclusive of critical scores, routes high scores correctly.
  options:
    b:
      en: |-
        A score of 95 already satisfies the critical expression; the standard condition still wins because it is evaluated first.
    c:
      en: |-
        The default condition applies only when no condition is true, and a score of 95 matches standard.
    d:
      en: |-
        The greater-than operators work only on numbers, so a String input would break the comparison.
references:
  - title: "Node types for your flow - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/flows-nodes.html
