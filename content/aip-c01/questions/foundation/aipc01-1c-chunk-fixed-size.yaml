id: aipc01-1c-chunk-fixed-size
objective: "1.5.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company indexes thousands of short, uniformly formatted product data sheets in an Amazon Bedrock knowledge base. The team wants to set the maximum chunk size in tokens and the overlap between consecutive chunks itself, so that embedding costs and context sizes are predictable.

    Which chunking strategy should the team choose?
body:
  options:
    - id: a
      text:
        en: |-
          Default chunking
    - id: b
      text:
        en: |-
          Semantic chunking
    - id: c
      text:
        en: |-
          Fixed-size chunking
    - id: d
      text:
        en: |-
          No chunking
answer: { optionId: c }
explanation:
  correct:
    en: |-
      Fixed-size chunking lets the team set the maximum number of tokens per chunk and the overlap percentage between consecutive chunks, which gives predictable chunk sizes for uniform documents.
  options:
    a:
      en: |-
        Default chunking uses about 300 tokens per chunk with sentence boundaries and has no settings to adjust.
    b:
      en: |-
        Semantic chunking ends chunks where meaning changes and calls a foundation model during ingestion, so sizes and costs are less predictable.
    d:
      en: |-
        No chunking stores each document as one chunk, so there is no chunk size or overlap to control.
references:
  - title: "How content chunking works for knowledge bases - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/kb-chunking.html
