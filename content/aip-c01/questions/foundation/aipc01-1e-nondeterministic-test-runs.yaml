id: aipc01-1e-nondeterministic-test-runs
objective: "1.6.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A marketing company generates product descriptions with a temperature of 0.8 in production because it wants varied wording. Its prompt test suite runs each of 200 test cases once against a prompt version and computes a pass rate. Two runs of the same version produced pass rates of 91 % and 83 %, so the team cannot tell whether a new version is better. The tests must reflect production behavior.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Set the temperature to 0 for the test runs only, so that every run of the same prompt version produces exactly the same responses.
    - id: b
      text:
        en: |-
          Turn on prompt caching for the prompt, so that repeated test runs of the same test case return the cached response of the first run.
    - id: c
      text:
        en: |-
          Purchase Provisioned Throughput for the model, so that the test runs receive consistent responses from dedicated capacity.
    - id: d
      text:
        en: |-
          Run each case several times with the production settings, and compare versions on the mean pass rate with a margin for run-to-run noise.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      With a temperature of 0.8, each run samples different outputs, so a single run per case gives a noisy pass rate. Repeating each case with the production inference settings and comparing mean pass rates with a tolerance separates a real improvement from sampling noise while still testing what production runs.
  options:
    a:
      en: |-
        Greedy decoding makes the runs repeatable, but the tests would no longer reflect the production temperature of 0.8.
    b:
      en: |-
        Prompt caching reuses the processed prompt prefix to cut latency and cost; it does not return stored responses.
    c:
      en: |-
        Provisioned Throughput provides dedicated capacity; the sampling, and therefore the variation, stays the same.
references:
  - title: "Create a prompt using Prompt management - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/prompt-management-create.html
  - title: "Require structured output - Amazon Nova"
    url: https://docs.aws.amazon.com/nova/latest/userguide/prompting-structured-output.html
