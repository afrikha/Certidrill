id: aipc01-1d-acc-managed-kb-mcp
objective: "1.5.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Three teams in a company build agents with different open-source frameworks, including Strands Agents and LangGraph. All the frameworks support the Model Context Protocol (MCP). The teams must all use the same retrieval over an Amazon Bedrock Managed Knowledge Base, and the company wants the least custom code.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Have each team write a tool in its own framework that calls the Retrieve operation on the knowledge base.
    - id: b
      text:
        en: |-
          Create an Amazon Bedrock agent with the knowledge base attached, and have each framework invoke that agent.
    - id: c
      text:
        en: |-
          Expose the knowledge base through an Amazon API Gateway REST API with a Lambda function, and have each team write an HTTP client tool.
    - id: d
      text:
        en: |-
          Use the Managed Knowledge Base's native AgentCore Gateway integration so that every agent invokes the knowledge base as an MCP tool.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      A Managed Knowledge Base integrates natively with AgentCore Gateway, so any MCP-compatible agent framework can discover and invoke it as a tool without custom code. All teams share one tool definition and one access path.
  options:
    a:
      en: |-
        Three separate tool implementations are duplicated custom code that can drift apart.
    b:
      en: |-
        Amazon Bedrock Agents (now Agents Classic) has been closed to new customers since July 30, 2026; new designs use AgentCore or Strands Agents.
    c:
      en: |-
        An API Gateway and Lambda layer plus a client tool in each framework is more code than the native MCP integration.
references:
  - title: "Retrieve data and generate AI responses with Amazon Bedrock Knowledge Bases - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/knowledge-base.html
  - title: "Amazon Bedrock AgentCore Gateway: A secure AI gateway for agents, tools, and models - Amazon Bedrock AgentCore"
    url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/gateway.html
