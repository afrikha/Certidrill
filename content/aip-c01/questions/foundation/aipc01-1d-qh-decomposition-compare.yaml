id: aipc01-1d-qh-decomposition-compare
objective: "1.5.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An insurance company's assistant calls RetrieveAndGenerate on an Amazon Bedrock knowledge base of plan documents. Customers ask comparative questions such as "Which plan has the lower deductible and better dental coverage, Gold or Platinum?" The answers often describe only one of the plans. The company wants to fix this with the least development effort.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Increase numberOfResults to 30 so that chunks about both plans are more likely to be retrieved.
    - id: b
      text:
        en: |-
          Build an AWS Step Functions workflow in which a Lambda function splits each question before calling Retrieve.
    - id: c
      text:
        en: |-
          Configure implicit filtering with a metadata schema that describes the plan name attribute.
    - id: d
      text:
        en: |-
          Set the query transformation type to QUERY_DECOMPOSITION in the orchestration configuration of RetrieveAndGenerate.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      Query decomposition breaks a complex question into smaller sub-queries and may run several queries against the knowledge base, so each plan gets its own retrieval before the answer is generated. It is a single configuration setting of RetrieveAndGenerate, with no code to write.
  options:
    a:
      en: |-
        More results from one query that is dominated by one plan add noise rather than guaranteeing coverage of both plans.
    b:
      en: |-
        A custom Step Functions decomposition works, but it is much more development than the built-in setting.
    c:
      en: |-
        Implicit filtering derives a metadata filter from the question; it does not split a question about two plans into two retrievals.
references:
  - title: "Configure and customize queries and response generation - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/kb-test-config.html
