id: aipc01-1e-edge-case-distributed-map
objective: "1.6.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company tests every new prompt version against 5,000 edge cases, such as empty and oversized inputs, mixed languages, prompt injection attempts, and missing fields. The test cases are stored as a 6 MB JSON file in Amazon S3. Each case must run through an AWS Lambda function that invokes the prompt and then a Lambda function that validates the output, with up to 200 cases in parallel. The result of every case must be written to Amazon S3 for review.

    Which AWS Step Functions design will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          An inline Map state that receives the file content from a previous Lambda task, runs both Lambda tasks for each case, and sets MaxConcurrency to 200.
    - id: b
      text:
        en: |-
          A Parallel state with one branch for each test category, in which each branch loops through its cases with a Choice state, a counter, and both Lambda tasks.
    - id: c
      text:
        en: |-
          A Distributed Map state that reads the file with an ItemReader, runs both Lambda tasks in child workflows with MaxConcurrency 200, and has a ResultWriter.
    - id: d
      text:
        en: |-
          A single Lambda task that loops through every case, calls both functions for each case in turn, and writes one summary file with all results to Amazon S3.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      A Distributed Map state reads its dataset directly from S3, runs each item in a child workflow execution with its own history, and supports up to 10,000 parallel children. MaxConcurrency 200 meets the parallelism requirement, and ResultWriter writes the result of every iteration to S3.
  options:
    a:
      en: |-
        An inline Map state is limited to a 256 KiB payload and 40 concurrent iterations, and its iterations add to the parent's 25,000-entry execution history.
    b:
      en: |-
        Each branch runs its cases one after another, so the design cannot reach 200 cases in parallel, and thousands of loop iterations would exhaust the execution history limit.
    d:
      en: |-
        One invocation processes the cases sequentially, so it cannot run 200 cases in parallel and is bounded by the Lambda maximum timeout.
references:
  - title: "Map workflow state - AWS Step Functions"
    url: https://docs.aws.amazon.com/step-functions/latest/dg/state-map.html
