id: aipc01-1a-design-eu-residency-audit
objective: "1.1.1"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    A bank in Germany is designing a document-summarization assistant that runs in eu-central-1. Regulators require that prompts and responses are processed only in AWS Regions inside the EU, and auditors must be able to see which Region processed each request. The selected model can be invoked on demand only through geographic or global cross-Region inference profiles.

    Which combination of steps will meet these requirements? (Choose two.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Invoke the model with its global inference profile ID, and add a service control policy that denies all Regions outside the EU.
    - id: b
      text:
        en: |-
          Invoke the model with its EU geographic inference profile ID (eu. prefix) from eu-central-1.
    - id: c
      text:
        en: |-
          Invoke the model with its base model ID from eu-central-1 so that inference stays in the source Region.
    - id: d
      text:
        en: |-
          Read the additionalEventData.inferenceRegion field of the AWS CloudTrail events that are logged in eu-central-1.
    - id: e
      text:
        en: |-
          Enable AWS CloudTrail in every destination Region of the profile, and correlate the events that each Region logs for the request.
answer: { optionIds: [b, d] }
explanation:
  correct:
    en: |-
      A geographic inference profile routes requests only to the Regions of its geography, which is the option AWS recommends for data residency requirements. CloudTrail logs cross-Region inference requests in the source Region, and the additionalEventData.inferenceRegion field records the Region that processed each request.
  options:
    a:
      en: |-
        A global profile can route to any supported commercial Region, and it needs an SCP that allows aws:RequestedRegion set to unspecified; an SCP that denies non-EU Regions either breaks the calls or does not keep processing in the EU.
    c:
      en: |-
        The stem states that the model cannot be invoked on demand with its base model ID; such a call fails instead of staying in the source Region.
    e:
      en: |-
        Cross-Region inference requests are logged in the source Region, so there is nothing to correlate in the destination Regions.
references:
  - title: Route model inference requests across AWS Regions with cross-Region inference - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/cross-region-inference.html
