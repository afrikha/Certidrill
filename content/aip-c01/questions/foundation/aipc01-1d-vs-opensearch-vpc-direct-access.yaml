id: aipc01-1d-vs-opensearch-vpc-direct-access
objective: "1.5.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A financial services company runs an Amazon OpenSearch Service domain that is deployed in a VPC. Other applications run their own k-NN queries against this domain. The company is building a RAG assistant on a customer-managed Amazon Bedrock knowledge base and requires that the new vector data is never reachable through a public endpoint. The data engineering team also requires direct access to the vector index so that other applications can run their own vector queries against it.

    Which vector store configuration will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Create an OpenSearch Serverless vector search collection with the VPC access type and a VPC endpoint, and use a faiss vector index in it as the knowledge base vector store.
    - id: b
      text:
        en: |-
          Create a new index that uses the faiss engine on the existing VPC domain, and register the domain endpoint and index as the knowledge base vector store.
    - id: c
      text:
        en: |-
          Create a new OpenSearch Service domain with public access and fine-grained access control, and restrict the domain access policy to the knowledge base service role.
    - id: d
      text:
        en: |-
          Create an Amazon Bedrock Managed Knowledge Base so that Amazon Bedrock stores the vectors in a data store that it manages for the company.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      OpenSearch Serverless collections can be made private by choosing VPC as the access type with a VPC endpoint, and they are a supported knowledge base vector store (faiss engine, vector field, text field, and Bedrock metadata field). The team keeps direct access to the index for its own queries.
  options:
    b:
      en: |-
        Knowledge Bases does not support OpenSearch Service managed domains that are behind a VPC; a managed cluster must use public access.
    c:
      en: |-
        A public access domain exposes a public endpoint, even with fine-grained access control and a restrictive policy, which violates the security requirement.
    d:
      en: |-
        A Managed Knowledge Base keeps its data store fully managed by Amazon Bedrock, so other applications cannot query the vector index directly.
references:
  - title: "Prerequisites for using a vector store you created for a knowledge base - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/knowledge-base-setup.html
  - title: "Build a managed knowledge base - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/kb-build-managed.html
