id: aipc01-1e-cot-tagged-reasoning
objective: "1.6.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A benefits administrator uses a foundation model (FM) to decide whether employees are eligible for a reimbursement. Each decision requires several dependent calculations, and the model often skips a step and reaches the wrong result. Accuracy matters more than latency. The employee portal must show only the final decision, and the application must extract it reliably.

    Which prompt change will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Instruct the model to answer with only the word ELIGIBLE or NOT_ELIGIBLE and to write no other text anywhere in its response.
    - id: b
      text:
        en: |-
          Instruct the model to reason inside thinking tags and then give the decision inside output tags, and show only the output tag content.
    - id: c
      text:
        en: |-
          Add five examples to the prompt that show only each employee's input data and the final decision, without the calculations.
    - id: d
      text:
        en: |-
          Lower maxTokens to 20 so that the model cannot add any reasoning or other text that the employee portal would need to hide.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      Chain-of-thought prompting makes the model reason step by step before it answers, which improves accuracy on multi-step problems. Separating the reasoning in thinking tags from the answer in output tags lets the application parse the final decision cleanly and hide the reasoning from the portal.
  options:
    a:
      en: |-
        Forcing a one-word answer removes the space the model needs to work through the dependent calculations, so the skipped-step errors remain.
    c:
      en: |-
        Examples without the calculations teach the model to jump straight to a decision, which is the behavior that causes the errors.
    d:
      en: |-
        A 20-token limit cuts off any reasoning, so accuracy would not improve.
references:
  - title: "Give Amazon Nova time to think (chain-of-thought) - Amazon Nova"
    url: https://docs.aws.amazon.com/nova/latest/userguide/prompting-chain-of-thought.html
