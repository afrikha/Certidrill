id: aipc01-1c-perf-knn-node-sizing
objective: "1.4.3"
type: single
difficulty: 2
status: draft
shuffle: false
stem:
  en: |
    A company is sizing an Amazon OpenSearch Service managed cluster for a vector search workload. Load tests show that each data node must hold about 14 GiB of HNSW graphs in memory. The cluster will keep the default k-NN memory settings.

    Which memory size per data node is the SMALLEST that holds the graphs within the default k-NN memory budget?
body:
  options:
    - id: a
      text:
        en: |-
          16 GiB
    - id: b
      text:
        en: |-
          32 GiB
    - id: c
      text:
        en: |-
          64 GiB
    - id: d
      text:
        en: |-
          128 GiB
answer: { optionId: c }
explanation:
  correct:
    en: |-
      OpenSearch Service gives half of instance memory to the Java heap (up to 32 GiB), and by default k-NN graphs can use up to 50 percent of the remaining half. A 64 GiB node therefore has about 16 GiB for graphs, which is the smallest size here that holds 14 GiB.
  options:
    a:
      en: |-
        A 16 GiB node leaves about 4 GiB for graphs (16 x 0.5 x 0.5).
    b:
      en: |-
        A 32 GiB node leaves about 8 GiB for graphs, which AWS gives as its sizing example; 14 GiB does not fit.
    d:
      en: |-
        A 128 GiB node would hold the graphs, but it is not the smallest size that does.
references:
  - title: "k-Nearest Neighbor (k-NN) search in Amazon OpenSearch Service - Amazon OpenSearch Service"
    url: https://docs.aws.amazon.com/opensearch-service/latest/developerguide/knn.html
