id: aipc01-1c-chunk-clause-lambda
objective: "1.5.1"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    A law firm indexes contracts in an Amazon Bedrock knowledge base with an S3 data source. Each chunk must contain exactly one numbered clause, whatever its length, and must carry the clause number as metadata so that lawyers can filter on it. Clauses range from one sentence to several pages.

    Which combination of configuration settings will meet these requirements? (Choose two.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Set the chunking strategy to HIERARCHICAL with parent chunks sized to the longest clause in the contracts.
    - id: b
      text:
        en: |-
          Set the chunking strategy to NONE for the data source.
    - id: c
      text:
        en: |-
          Add a custom transformation Lambda function at the POST_CHUNKING step that splits each contract by clause, writes the chunks with a clause_number value to the intermediate S3 bucket, and returns their references.
    - id: d
      text:
        en: |-
          Set the chunking strategy to SEMANTIC with a breakpoint percentile threshold of 99 so that each clause becomes one chunk.
    - id: e
      text:
        en: |-
          Add a STRING_LIST clause_number attribute to each contract's .metadata.json file that lists all clause numbers of the contract.
answer: { optionIds: [ b, c ] }
explanation:
  correct:
    en: |-
      Custom chunking in a knowledge base combines the no chunking strategy with a custom transformation function: the knowledge base writes each file to the intermediate bucket, the function splits it by clause and writes the chunks back, and it can attach chunk-level metadata such as clause_number. The built-in strategies split by tokens or meaning, not by clause numbering.
  options:
    a:
      en: |-
        Hierarchical chunking splits by token counts, so parent and child boundaries do not follow clause boundaries.
    d:
      en: |-
        Semantic breakpoints follow changes in meaning, not clause numbers, and a high threshold produces fewer, larger chunks that can span several clauses.
    e:
      en: |-
        A file-level list applies the same values to every chunk, so it cannot tell which clause a chunk contains.
references:
  - title: "Use a custom transformation Lambda function to define how your data is ingested - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/kb-custom-transformation.html
  - title: "How content chunking works for knowledge bases - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/kb-chunking.html
