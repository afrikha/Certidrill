id: aipc01-1a-std-genai-gateway-usage-plans
objective: "1.1.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company has 15 internal teams that call foundation models in Amazon Bedrock directly from their own applications in one AWS account. The security team wants a single entry point where every request is authenticated with IAM, logged, and checked against the list of approved models. The platform team wants to cap each team's request rate and daily request volume. Application roles must no longer need Bedrock permissions.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Create an IAM policy per team that allows bedrock:InvokeModel on the approved models only, and raise the Bedrock quotas for the account in Service Quotas.
    - id: b
      text:
        en: |-
          Create an Amazon Bedrock application inference profile per team, and track each team's usage with cost allocation tags in AWS Cost Explorer.
    - id: c
      text:
        en: |-
          Build a gateway with an Amazon API Gateway REST API that uses IAM authorization and a Lambda function that calls Bedrock, with one API key per team in a usage plan with throttling and quota limits.
    - id: d
      text:
        en: |-
          Build a gateway with an Amazon API Gateway REST API and a Lambda function that calls Bedrock, and authenticate each team with its own API key instead of IAM.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      A central API Gateway and Lambda gateway is the single point for authentication, logging and model allow-listing, and only the Lambda role needs Bedrock permissions. Usage plans apply throttling and quota limits per API key, so each team gets its own rate and volume caps, while IAM authorization authenticates the callers.
  options:
    a:
      en: |-
        Per-team IAM policies keep direct Bedrock access, give no single logging and checking point, and account-level quotas cannot cap individual teams.
    b:
      en: |-
        Application inference profiles track usage and cost per team, but they neither cap request rates nor provide a single authenticated entry point.
    d:
      en: |-
        AWS recommends against using API keys for authentication or authorization; they identify clients for usage plans, and IAM authentication is required here.
references:
  - title: Usage plans and API keys for REST APIs in API Gateway - Amazon API Gateway
    url: https://docs.aws.amazon.com/apigateway/latest/developerguide/api-gateway-api-usage-plans.html
