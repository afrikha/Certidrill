id: aipc01-1a-switch-converse-config
objective: "1.2.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company's AWS Lambda function calls a model from one provider in Amazon Bedrock with the InvokeModel API and a provider-specific JSON request body. After a one-time refactoring, the company wants to be able to switch to a model from another provider without changing or redeploying the function code. Provider-specific settings, such as top_k, must remain configurable.

    Which combination of changes will meet these requirements? (Choose two.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Keep InvokeModel, and add one request-body template per provider to the function code, selected by the prefix of the model ID.
    - id: b
      text:
        en: |-
          Call the Converse API from the function, and pass the provider-specific settings in additionalModelRequestFields.
    - id: c
      text:
        en: |-
          Create one Amazon Bedrock guardrail per provider, and select the guardrail that matches the model at runtime.
    - id: d
      text:
        en: |-
          Read the model ID and the additional model request fields from an AWS AppConfig configuration at runtime.
    - id: e
      text:
        en: |-
          Hard-code the list of approved model IDs in the function, and pick one of them at random for each request.
answer: { optionIds: [b, d] }
explanation:
  correct:
    en: |-
      The Converse API uses the same request shape for every model that supports messages, so switching models mainly means changing modelId; parameters unique to a model go in additionalModelRequestFields. Reading both values from AppConfig at runtime moves the model choice out of the code.
  options:
    a:
      en: |-
        Per-provider templates in the code mean that a new provider requires a code change and a redeployment.
    c:
      en: |-
        Guardrails apply safety policies; they have nothing to do with the request format of a provider.
    e:
      en: |-
        A hard-coded list still needs a code change for every new model, and random selection is not a controlled switch.
references:
  - title: Inference using Converse API - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/conversation-inference.html
