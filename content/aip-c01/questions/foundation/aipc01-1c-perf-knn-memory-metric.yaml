id: aipc01-1c-perf-knn-memory-metric
objective: "1.4.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company runs k-NN search on an Amazon OpenSearch Service managed cluster for a RAG chatbot. Search latency increases each time a large batch of new embeddings is indexed. An engineer suspects that the HNSW graphs no longer fit in the memory available to the k-NN plugin.

    Which Amazon CloudWatch metric should the engineer compare with the k-NN memory limit on each data node?
body:
  options:
    - id: a
      text:
        en: |-
          KNNGraphMemoryUsage
    - id: b
      text:
        en: |-
          JVMMemoryPressure
    - id: c
      text:
        en: |-
          FreeStorageSpace
    - id: d
      text:
        en: |-
          SearchLatency
answer: { optionId: a }
explanation:
  correct:
    en: |-
      KNNGraphMemoryUsage reports the memory that k-NN graphs use on each data node. AWS recommends comparing it with the knn.memory.circuit_breaker.limit setting and the instance's available RAM to find out whether the graphs exceed their budget.
  options:
    b:
      en: |-
        JVMMemoryPressure measures the Java heap, but k-NN graphs are stored outside the heap.
    c:
      en: |-
        FreeStorageSpace measures disk space, not the memory that loaded graphs use.
    d:
      en: |-
        SearchLatency shows the symptom but not whether graph memory is the cause.
references:
  - title: "k-Nearest Neighbor (k-NN) search in Amazon OpenSearch Service - Amazon OpenSearch Service"
    url: https://docs.aws.amazon.com/opensearch-service/latest/developerguide/knn.html
