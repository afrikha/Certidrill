id: aipc01-1a-poc-rag-evaluation
objective: "1.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A manufacturing company built a proof-of-concept knowledge base in Amazon Bedrock over 3,000 maintenance manuals. Before funding production, managers want evidence that the knowledge base retrieves the right passages and that the generated answers are correct. Engineers have prepared 300 questions with the expected passages and the expected answers.

    Which solution will meet these requirements with the LEAST effort?
body:
  options:
    - id: a
      text:
        en: |-
          Create an automatic model evaluation job with the question and answer task type, and use the 300 questions as a custom prompt dataset for the generator model.
    - id: b
      text:
        en: |-
          Ask the engineers to query the knowledge base in the console for a week and report the share of answers that they consider correct.
    - id: c
      text:
        en: |-
          Log every RetrieveAndGenerate call to Amazon CloudWatch Logs, and create a metric filter that counts the responses that contain citations.
    - id: d
      text:
        en: |-
          Create an Amazon Bedrock RAG evaluation job of the retrieve-and-generate type for the knowledge base, with the 300 questions as ground truth and an evaluator model.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      A RAG evaluation job computes metrics for a knowledge base: a retrieve-and-generate job assesses both the retrieved data and the responses generated from it. Its dataset contains the prompts with ground truth (expected retrieved texts and responses), and an evaluator model scores the results.
  options:
    a:
      en: |-
        A model evaluation job tests the model alone; it never queries the knowledge base, so it says nothing about retrieval quality.
    b:
      en: |-
        Manual review is slow and subjective, and it does not measure retrieval against the expected passages.
    c:
      en: |-
        Counting responses with citations shows that something was retrieved, not that the passages or the answers were correct.
references:
  - title: Evaluate the performance of RAG sources using Amazon Bedrock evaluations - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/evaluation-kb.html
  - title: Evaluate the performance of Amazon Bedrock resources - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/evaluation.html
