id: aipc01-1c-integ-inclusion-prefix
objective: "1.4.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company's shared S3 bucket contains HR policies under the policies/ prefix and millions of unrelated log files under other prefixes. The company is creating an Amazon Bedrock knowledge base in the same AWS Region as the bucket, and the knowledge base must index only the HR policies. The company wants the simplest configuration.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Add a bucket policy that denies the knowledge base service role access to every prefix other than policies/.
    - id: b
      text:
        en: |-
          Configure the S3 data source with an inclusion prefix of policies/.
    - id: c
      text:
        en: |-
          Index the whole bucket, and pass a metadata filter that excludes the log files in every Retrieve request.
    - id: d
      text:
        en: |-
          Use S3 Batch Operations to copy the policies to a new bucket, and point the data source at the new bucket.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      An inclusion prefix limits the S3 data source to a folder or file of the bucket, so only objects under policies/ are crawled, embedded, and stored. No extra bucket, copy job, or query-time logic is needed.
  options:
    a:
      en: |-
        Denying access does not tell the connector what to crawl; it would still try to read the other objects and report access errors.
    c:
      en: |-
        Indexing millions of log files adds ingestion and storage cost and every query must exclude them, which is the opposite of simple.
    d:
      en: |-
        Copying the policies adds a second bucket and a copy process to keep in step, which an inclusion prefix avoids.
references:
  - title: "Connect to Amazon S3 for your knowledge base - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/s3-data-source-connector.html
