id: aipc01-1b-transcribe-custom-vocabulary
objective: "1.3.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A pharmacy chain transcribes recorded customer calls with Amazon Transcribe batch jobs, and a foundation model in Amazon Bedrock summarizes each transcript. Drug brand names and internal acronyms are often transcribed incorrectly, so the summaries cite the wrong drugs. The company wants these specific terms transcribed correctly with the least effort and without training a model.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Instruct the summarization model in its system prompt to correct any drug names in the transcript that look misspelled before it writes the summary.
    - id: b
      text:
        en: |-
          Run Amazon Comprehend entity detection on each transcript, and replace the detected COMMERCIAL_ITEM entities before the transcript is summarized.
    - id: c
      text:
        en: |-
          Create a custom vocabulary in table format with the drug names and acronyms in the same Region, and use it in the transcription jobs.
    - id: d
      text:
        en: |-
          Train a custom language model on two years of the chain's call transcripts, and use it in the transcription jobs.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      Custom vocabularies improve the transcription of specific words such as brand names, acronyms and proper nouns that Amazon Transcribe does not render correctly. The table format (Phrase, DisplayAs) is the recommended format for new vocabularies, and the vocabulary must be in the same Region as the transcription jobs; no model training is involved.
  options:
    a:
      en: |-
        The model can only guess which drug was meant from a wrong transcription, which risks confident but incorrect summaries; the input itself stays wrong.
    b:
      en: |-
        Entity detection can find product mentions, but it does not know which drug was actually said, so it cannot correct a misrecognized name.
    d:
      en: |-
        A custom language model requires training, which the company wants to avoid, and it is more effort than listing the specific terms.
references:
  - title: Custom vocabularies - Amazon Transcribe
    url: https://docs.aws.amazon.com/transcribe/latest/dg/custom-vocabulary.html
