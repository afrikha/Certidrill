id: aipc01-1e-s3-template-repository
objective: "1.6.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A media company keeps its prompt templates as JSON files in an Amazon S3 bucket that serves as the template repository. An AWS Step Functions state machine tests a template and then creates or updates the matching prompt in Amazon Bedrock Prompt Management with a new prompt version. The company must be able to restore the earlier content of a template file after an accidental overwrite or deletion. The state machine must start automatically each time a template file is created or overwritten.

    Which combination of actions will meet these requirements? (Choose two.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Add an S3 Lifecycle rule that transitions the template files to S3 Glacier Flexible Retrieval 30 days after creation.
    - id: b
      text:
        en: |-
          Turn on S3 Versioning for the bucket that stores the template files.
    - id: c
      text:
        en: |-
          Turn on S3 Intelligent-Tiering for the template files to keep the frequently used templates in a faster tier.
    - id: d
      text:
        en: |-
          Enable CloudTrail Insights on the account trail so that unusual S3 write activity starts the state machine.
    - id: e
      text:
        en: |-
          Turn on Amazon EventBridge notifications for the bucket, and create a rule for Object Created events that starts the state machine.
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: |-
      With S3 Versioning, an overwrite creates a new object version and a delete inserts a delete marker, so the earlier content can always be restored. When EventBridge is turned on for a bucket, S3 sends all supported events, including Object Created for PutObject, CopyObject and multipart uploads, and an EventBridge rule can start the state machine.
  options:
    a:
      en: |-
        A Lifecycle transition changes the storage class of the current object; it keeps no earlier content and starts nothing.
    c:
      en: |-
        Intelligent-Tiering optimizes storage cost by access pattern; it neither keeps earlier versions nor triggers the pipeline.
    d:
      en: |-
        CloudTrail Insights flags unusual API call volumes; it does not start a workflow for each template change.
references:
  - title: "Retaining multiple versions of objects with S3 Versioning - Amazon Simple Storage Service"
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/Versioning.html
  - title: "Using EventBridge - Amazon Simple Storage Service"
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/EventBridge.html
