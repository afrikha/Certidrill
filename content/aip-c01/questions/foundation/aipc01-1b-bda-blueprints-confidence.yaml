id: aipc01-1b-bda-blueprints-confidence
objective: "1.3.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A logistics company receives invoices and bills of lading as PDF files and scanned images from 300 suppliers, each with its own layout. A GenAI reconciliation agent needs specific fields from each file, such as invoice number, total amount and shipper, as structured JSON. Every extracted value must come with a confidence score so that low-confidence values are sent to a review queue. The company wants the least custom code and does not want to train models.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Extract the text of each file with an OCR library in a Lambda function, and write mapping code for each supplier layout that converts the text to JSON.
    - id: b
      text:
        en: |-
          Train an Amazon Comprehend custom entity recognizer on annotated invoices and bills of lading, and run entity detection jobs on the incoming files.
    - id: c
      text:
        en: |-
          Send each file to a multimodal model with the Converse API in a document or image block, and prompt the model to return the fields as JSON.
    - id: d
      text:
        en: |-
          Create an Amazon Bedrock Data Automation project with blueprints for invoices and bills of lading, and process each file with InvokeDataAutomationAsync.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      Bedrock Data Automation custom output uses blueprints, lists of the fields to extract, for documents and images, and a project that groups the blueprints is referenced in the InvokeDataAutomationAsync call. BDA processes classification and extraction without a pipeline to orchestrate, and it returns confidence scores and visual grounding that can route uncertain values to review.
  options:
    a:
      en: |-
        Per-supplier mapping code for 300 layouts is the opposite of the least custom code, and plain OCR output does not include a confidence score for each business field.
    b:
      en: |-
        A custom entity recognizer must be trained on annotated documents, which the company wants to avoid, and it returns entities rather than a structured record per document.
    c:
      en: |-
        A prompt can return JSON, but the model does not return a confidence score for each extracted field, so the review routing would need extra custom logic.
references:
  - title: How Bedrock Data Automation works - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/bda-how-it-works.html
  - title: Transform unstructured data into meaningful insights using Amazon Bedrock Data Automation - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/bda.html
