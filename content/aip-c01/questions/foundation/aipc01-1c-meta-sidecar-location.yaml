id: aipc01-1c-meta-sidecar-location
objective: "1.4.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company adds metadata to the 20,000 PDF reports that an Amazon Bedrock knowledge base ingests from an S3 bucket. To keep the bucket tidy, a script stored the metadata files under a separate metadata/ prefix with names such as metadata/report-17.json, in the format that knowledge bases expect. After a sync, Retrieve requests that filter on these attributes return no results.

    What should the company do to fix the filters?
body:
  options:
    - id: a
      text:
        en: |-
          Add metadata/ as a second inclusion prefix of the S3 data source so that the connector also crawls the metadata files during the next sync.
    - id: b
      text:
        en: |-
          Set includeForEmbedding to true for every attribute so that the attributes are stored with the chunks during the next sync.
    - id: c
      text:
        en: |-
          Store each metadata file next to its report, named after the report with .metadata.json appended (for example, report-17.pdf.metadata.json), and sync again.
    - id: d
      text:
        en: |-
          Copy the attributes into S3 object tags on each report so that the connector reads them from the reports during the next sync.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      The S3 connector associates a metadata file with a document only when the file has the document's full name with .metadata.json appended and sits in the same folder as the document (up to 10 KB). Files stored elsewhere or named differently are not linked to any report, so no attribute reaches the index until they are moved and renamed.
  options:
    a:
      en: |-
        Crawling the metadata/ prefix does not link the files to the reports; it would only treat them as additional documents to ingest.
    b:
      en: |-
        includeForEmbedding controls whether an attribute is embedded with the chunk text; it does not help the connector find metadata files that are in the wrong place.
    d:
      en: |-
        The S3 connector does not read object tags; attributes come only from .metadata.json files.
references:
  - title: "Connect to Amazon S3 for your knowledge base - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/s3-data-source-connector.html
