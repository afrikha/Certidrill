id: aipc01-1b-managed-kb-smart-parsing
objective: "1.4.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A manufacturer wants a new assistant to answer questions from its training library in Amazon S3. The library mixes PDF manuals, PowerPoint decks, Word documents with embedded diagrams, scanned inspection forms, and recorded audio and video sessions. The company does not want to configure document parsers or administer a vector store, and it wants the LEAST operational overhead.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Create a customer-managed knowledge base with an OpenSearch Serverless vector store and the default parser, and point its S3 data source at the library.
    - id: b
      text:
        en: |-
          Create an Amazon Bedrock Managed Knowledge Base with an S3 data source for the library, and let its built-in parsing handle each file type.
    - id: c
      text:
        en: |-
          Convert every file to plain text with OCR and speech-to-text libraries in Lambda functions, and ingest the text into a customer-managed knowledge base.
    - id: d
      text:
        en: |-
          Create an Amazon Q Business application with an S3 data source for the library, and embed its web experience in the assistant.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      In a Managed Knowledge Base, Amazon Bedrock manages ingestion, indexing, storage and retrieval, and Smart Parsing automatically selects a parsing strategy for each document type, including PDF, PPTX and DOCX files, documents with embedded visuals, audio, video and scanned documents.
  options:
    a:
      en: |-
        In a customer-managed knowledge base, the company configures parsing itself, including for multimodal data, and administers the vector store, which is more overhead than the requirement allows.
    c:
      en: |-
        Building and maintaining OCR and transcription code for every format is custom work that the managed parsing already provides.
    d:
      en: |-
        Amazon Q Business closed to new customers on July 30, 2026, so it cannot be used for a new assistant.
references:
  - title: Retrieve data and generate AI responses with Amazon Bedrock Knowledge Bases - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/knowledge-base.html
  - title: Build a managed knowledge base - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/kb-build-managed.html
