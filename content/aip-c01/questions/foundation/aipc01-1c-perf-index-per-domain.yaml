id: aipc01-1c-perf-index-per-domain
objective: "1.4.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A global law firm builds a retrieval layer on Amazon OpenSearch Service for two corpora. Contracts are written in 14 languages and are embedded with Cohere Embed Multilingual v3 (1,024 dimensions). Internal engineering runbooks are in English and are embedded with Amazon Titan Text Embeddings V2 at 512 dimensions to save memory. The firm has validated both model choices and must keep them. Each question targets one corpus, and the application already classifies questions by corpus.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Create one index per corpus with its own knn_vector mapping, embed each question with the model of the target corpus, and search only that index.
    - id: b
      text:
        en: |-
          Create one index with a single 1,024-dimension knn_vector field, and re-embed the runbooks with Cohere Embed Multilingual v3 so that both corpora share it.
    - id: c
      text:
        en: |-
          Create one index with a single 1,024-dimension knn_vector field, and pad the 512-dimension runbook vectors with zeros so that both corpora fit in it.
    - id: d
      text:
        en: |-
          Create one index per corpus, group both under one alias, and send every question to the alias after embedding it with Titan Text Embeddings V2.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      A multi-index design lets each specialized domain keep its own embedding model, dimensions, and mapping, and keeps each HNSW graph smaller. Because vectors from different models live in different vector spaces, each question must be embedded with the model of the index it searches, which the existing classifier makes possible.
  options:
    b:
      en: |-
        Re-embedding the runbooks with Cohere abandons the validated Titan choice and its memory savings, which the firm must keep.
    c:
      en: |-
        Zero-padding does not make Titan vectors comparable with Cohere vectors; they come from different models and vector spaces.
    d:
      en: |-
        A Titan query vector cannot be compared with the 1,024-dimension Cohere vectors of the contracts index, so contract searches would fail or be meaningless.
references:
  - title: "k-Nearest Neighbor (k-NN) search in Amazon OpenSearch Service - Amazon OpenSearch Service"
    url: https://docs.aws.amazon.com/opensearch-service/latest/developerguide/knn.html
  - title: "Amazon Titan Text Embeddings models - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/titan-embedding-models.html
