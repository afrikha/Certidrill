id: aipc01-1d-ctx-agentcore-memory-preferences
objective: "1.6.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A travel company is building a booking agent with Strands Agents on Amazon Bedrock AgentCore Runtime. The agent must remember each traveler's preferences, such as aisle seats and vegetarian meals, in later sessions, without the traveler repeating them. The company does not want to build its own pipeline to extract preferences from conversations.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Create an AgentCore Memory resource with no strategies, write each turn as an event, and read the session's events at the start of every new session.
    - id: b
      text:
        en: |-
          Create an AgentCore Memory resource with the built-in user preference strategy, and retrieve the traveler's long-term memory records at session start.
    - id: c
      text:
        en: |-
          Store complete transcripts of every past session in Amazon DynamoDB and send all of them to the model at the start of each new session.
    - id: d
      text:
        en: |-
          Rebuild the agent with Amazon Bedrock Agents and enable session summary memory on the agent alias for each traveler.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      AgentCore long-term memory automatically extracts insights such as user preferences from conversation events and keeps them across sessions. The built-in user preference strategy runs the extraction with no pipeline to build, and the agent retrieves the stored records when a new session starts.
  options:
    a:
      en: |-
        Without strategies, AgentCore Memory keeps only short-term events and extracts no long-term records, so preferences do not carry over in a usable form.
    c:
      en: |-
        Replaying every past transcript grows the prompt without limit and leaves the model to find the preferences each time.
    d:
      en: |-
        Amazon Bedrock Agents (now Agents Classic) has been closed to new customers since July 30, 2026; new agents use AgentCore.
references:
  - title: "Add memory to your Amazon Bedrock AgentCore agent - Amazon Bedrock AgentCore"
    url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/memory.html
  - title: "Memory strategies - Amazon Bedrock AgentCore"
    url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/memory-strategies.html
