id: aipc01-1b-legacy-model-migration
objective: "1.2.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A support assistant calls a foundation model in Amazon Bedrock with on-demand inference. The model card now shows that the model is in the Legacy state and gives its end-of-life (EOL) date. The company wants the assistant to keep working after the EOL date with the least disruption to users.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Purchase Provisioned Throughput for the Legacy model so that the assistant keeps dedicated access to the model after the EOL date.
    - id: b
      text:
        en: |-
          Evaluate Active models on the team's own prompt dataset, and switch the assistant to the selected Active model before the EOL date.
    - id: c
      text:
        en: |-
          Keep the current configuration, because Amazon Bedrock routes requests to the provider's successor model automatically at the EOL date.
    - id: d
      text:
        en: |-
          Create a fine-tuning job on the Legacy model so that the resulting custom model remains available after the EOL date.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      After the EOL date, the model is removed from all Regions and requests to it fail. AWS recommends starting the migration when the Legacy period is announced: compare Active replacement models on the application's own data, then move the workload before EOL.
  options:
    a:
      en: |-
        New Provisioned Throughput cannot be created for a model in the Legacy state, and no purchase keeps a model available after its EOL date.
    c:
      en: |-
        Migration does not happen automatically. Requests to the model fail after the EOL date unless the application has been moved to another model.
    d:
      en: |-
        New fine-tuning jobs cannot be created on a model once it is in the Legacy state, and a custom model built on it would not outlive the base model anyway.
references:
  - title: Model lifecycle - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/model-lifecycle.html
