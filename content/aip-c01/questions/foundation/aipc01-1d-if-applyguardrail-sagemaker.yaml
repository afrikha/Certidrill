id: aipc01-1d-if-applyguardrail-sagemaker
objective: "1.6.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company uses Amazon Bedrock models with a guardrail that applies content filters and masks PII. It also serves a fine-tuned open-weight model from an Amazon SageMaker AI endpoint. The company wants the same guardrail policies applied to the user prompts and to the responses of the SageMaker AI model, without maintaining a second set of rules.

    Which combination of steps will meet these requirements? (Choose two.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Pass the guardrail identifier and version as parameters of the InvokeEndpoint requests to the SageMaker AI endpoint.
    - id: b
      text:
        en: |-
          Call the ApplyGuardrail operation with the source set to INPUT on each user prompt before invoking the endpoint.
    - id: c
      text:
        en: |-
          Attach an AWS Organizations Amazon Bedrock policy that enforces the guardrail for all model invocations in the account.
    - id: d
      text:
        en: |-
          Send each prompt to Amazon Comprehend prompt safety classification and each response to Amazon Comprehend PII detection.
    - id: e
      text:
        en: |-
          Call the ApplyGuardrail operation with the source set to OUTPUT on each endpoint response before returning it to the user.
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: |-
      ApplyGuardrail evaluates any text against a configured guardrail without invoking a foundation model. The source INPUT is used for user content before the model call, and OUTPUT for the model response, so the same content filters and PII masking apply to a model that runs outside Amazon Bedrock.
  options:
    a:
      en: |-
        InvokeEndpoint has no guardrail parameter; guardrails are applied by Bedrock operations.
    c:
      en: |-
        Guardrail enforcement covers Amazon Bedrock model invocations, not requests to a SageMaker AI endpoint.
    d:
      en: |-
        Comprehend prompt safety classification is no longer available to new customers, and this would be a second set of rules rather than the existing guardrail.
references:
  - title: "Use the ApplyGuardrail API in your application - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/guardrails-use-independent-api.html
