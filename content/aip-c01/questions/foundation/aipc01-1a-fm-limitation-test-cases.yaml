id: aipc01-1a-fm-limitation-test-cases
objective: "1.2.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A law firm is assessing two foundation models in Amazon Bedrock for an assistant that answers questions about long regulatory filings. The team wants its custom evaluation dataset to reveal each model's limitations, not only its average quality. The longest filings come close to the models' context windows, and some questions concern regulations that were issued after the models' knowledge cutoff dates.

    Which test cases should the team add to the dataset? (Choose two.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Prompts that include the longest real filings, to check answer quality when the context window is nearly full.
    - id: b
      text:
        en: |-
          Prompts copied from a public benchmark, so that the results can be compared directly with leaderboard scores.
    - id: c
      text:
        en: |-
          Short one-sentence questions only, so that the evaluation jobs finish faster and cost less.
    - id: d
      text:
        en: |-
          Questions about regulations issued after the knowledge cutoff, with and without the regulation text, to check whether the model invents answers.
    - id: e
      text:
        en: |-
          Prompts that the team expects both models to answer correctly, to confirm the results of an earlier proof of concept.
answer: { optionIds: [a, d] }
explanation:
  correct:
    en: |-
      Model cards state limits such as the context window and the knowledge cutoff, and a limitation evaluation tests them on the real task. Near-full contexts show whether quality degrades on the longest filings, and post-cutoff questions show whether the model admits missing knowledge or uses the supplied text instead of inventing an answer.
  options:
    b:
      en: |-
        Benchmark prompts measure general ability, not the firm's filings, and they do not probe the two stated limitations.
    c:
      en: |-
        Short questions hide exactly the long-context limitation that the team must reveal.
    e:
      en: |-
        Easy cases confirm averages and reveal no limitation.
references:
  - title: Claude Haiku 4.5 - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/model-card-anthropic-claude-haiku-4-5.html
  - title: Evaluate the performance of Amazon Bedrock resources - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/evaluation.html
