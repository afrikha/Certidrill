id: aipc01-1b-batch-jsonl-record-format
objective: "1.3.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company wants to classify 400,000 product reviews overnight with an Amazon Bedrock batch inference job that uses the Converse invocation type. Each classification must be written back to the review's row in a database by its review ID.

    How should the company prepare the input data?
body:
  options:
    - id: a
      text:
        en: |-
          Write .jsonl files in which each line has a recordId set to the review ID and a modelInput with the Converse request body, and join the results on recordId.
    - id: b
      text:
        en: |-
          Write one JSON file that contains an array of Converse request bodies in review ID order, and match the results to the reviews by their position.
    - id: c
      text:
        en: |-
          Write CSV files with review_id and review_text columns, and let Amazon Bedrock build each prompt from the text column of the job's model.
    - id: d
      text:
        en: |-
          Write .jsonl files in which each line has only a modelInput with the Converse request body, and match each output line to the input line number.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      Batch inference reads JSONL files in which each line is a record with a recordId and a modelInput; with the Converse invocation type, modelInput must match the Converse request body. The order of the output records is not guaranteed to match the input, so the review ID carried in recordId is the reliable join key.
  options:
    b:
      en: |-
        Input files must be JSONL with one record per line, not a JSON array, and output order is not guaranteed, so positions cannot be used to match results.
    c:
      en: |-
        Batch inference does not build prompts from CSV columns. Each record must contain the full model input.
    d:
      en: |-
        Without recordId, Bedrock adds its own IDs, and because the output order is not guaranteed, line numbers do not identify the reviews.
references:
  - title: Format and upload your batch inference data - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/batch-inference-data.html
