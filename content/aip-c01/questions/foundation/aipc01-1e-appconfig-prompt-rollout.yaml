id: aipc01-1e-appconfig-prompt-rollout
objective: "1.6.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    An insurance company runs a claims assistant on Amazon ECS. At runtime, the application reads from AWS AppConfig the ARN of the Amazon Bedrock Prompt Management prompt version to use. New prompt versions must reach production without restarting or redeploying the ECS tasks, must roll out gradually, and must be reverted automatically if an Amazon CloudWatch alarm on the rate of failed response validations goes into the ALARM state. The solution must have the LEAST operational overhead.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Store the version ARN in an AWS Systems Manager Parameter Store parameter, and run an AWS Lambda function that updates it in steps and restores the old value when the alarm fires.
    - id: b
      text:
        en: |-
          Pass the version ARN to the containers as an environment variable in the ECS task definition, and update the ECS service with a rolling deployment for each new version.
    - id: c
      text:
        en: |-
          Point the application to the prompt draft, and let the prompt engineers save a new prompt only when the CloudWatch alarm has stayed in the OK state for 30 minutes.
    - id: d
      text:
        en: |-
          Deploy the new version ARN as a new AppConfig configuration version with a gradual deployment strategy, and add the CloudWatch alarm to the monitors of the AppConfig environment.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      AppConfig delivers configuration changes to running applications without a redeployment, and a deployment strategy controls how gradually the change reaches the targets. When a CloudWatch alarm linked to the environment enters the ALARM state during a deployment, AppConfig rolls back to the previous configuration version automatically, with no custom code.
  options:
    a:
      en: |-
        The stepped rollout and the rollback would be custom Lambda code that the company must build and maintain, which is more overhead than a managed deployment strategy.
    b:
      en: |-
        Changing an environment variable requires new tasks through a service deployment, which the requirements forbid.
    c:
      en: |-
        The draft changes on every save, so there is no gradual rollout and no automatic rollback to a known version.
references:
  - title: "Monitoring deployments for automatic rollback - AWS AppConfig"
    url: https://docs.aws.amazon.com/appconfig/latest/userguide/monitoring-deployments.html
  - title: "Deploy a prompt to your application using versions in Prompt management - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/prompt-management-deploy.html
