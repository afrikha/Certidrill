id: aipc01-1c-perf-knn-memory-dimensions
objective: "1.4.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A retail company stores 80 million product embeddings created with Amazon Titan Text Embeddings V2 (1,024 float dimensions) in an Amazon OpenSearch Service managed cluster that uses HNSW graphs. The KNNGraphMemoryUsage metric on every data node has reached the k-NN memory limit, and p99 search latency has tripled. The company cannot change the instance type or the number of data nodes this quarter. A small loss of retrieval accuracy is acceptable.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Add a second replica to the vector index so that searches are spread over more copies of each HNSW graph.
    - id: b
      text:
        en: |-
          Re-embed the products with Titan Text Embeddings V2 at 256 dimensions into a new index, and embed queries the same way before searching it.
    - id: c
      text:
        en: |-
          Raise the refresh_interval of the vector index from 1 second to 60 seconds to reduce the memory that new segments use.
    - id: d
      text:
        en: |-
          Increase the JVM heap of the data nodes to 75 percent of instance memory so that the HNSW graphs fit inside the heap.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      HNSW graphs live outside the Java heap, in a k-NN budget of about half of the memory left after the heap, and performance degrades when the graphs exceed it. Titan Text Embeddings V2 can output 256-dimension vectors, which cuts graph memory to about a quarter on the same nodes, at a small cost in accuracy; queries must use the same model and dimensions.
  options:
    a:
      en: |-
        Each replica adds a full copy of the graphs, which increases graph memory per node instead of reducing it.
    c:
      en: |-
        A longer refresh interval helps indexing throughput; it does not shrink the graphs that searches load.
    d:
      en: |-
        OpenSearch Service sets the heap to half of instance memory (capped at 32 GiB), and the graphs are off-heap, so a larger heap would leave even less memory for them.
references:
  - title: "k-Nearest Neighbor (k-NN) search in Amazon OpenSearch Service - Amazon OpenSearch Service"
    url: https://docs.aws.amazon.com/opensearch-service/latest/developerguide/knn.html
  - title: "Amazon Titan Text Embeddings models - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/titan-embedding-models.html
