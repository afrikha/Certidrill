id: aipc01-1e-flow-trace-debug
objective: "1.6.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A team's Amazon Bedrock flow classifies customer messages with a prompt node and routes them with a condition node. During testing, some billing messages reach the general branch. For each test invocation, the team needs to see what the classification prompt returned and which condition the condition node satisfied.

    Which solution will meet these requirements with the LEAST effort?
body:
  options:
    - id: a
      text:
        en: |-
          Turn on model invocation logging, and search the CloudWatch Logs log group for the responses of the classification prompt.
    - id: b
      text:
        en: |-
          Turn on CloudTrail data events for the flow alias, and inspect the InvokeFlow events that the test invocations produce.
    - id: c
      text:
        en: |-
          Add an S3 storage node after every node of the flow to write each node's output to Amazon S3 for later review.
    - id: d
      text:
        en: |-
          Call InvokeFlow with enableTrace set to true, and read the node output traces and the condition node result traces.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      With enableTrace set to true, each flow output event comes with trace events. Node output traces show what each node produced, including the classification prompt, and condition node result traces list the conditions that were satisfied, which shows why a message took the general branch.
  options:
    a:
      en: |-
        Invocation logs show the model input and output, but not which condition the condition node satisfied.
    b:
      en: |-
        CloudTrail records the InvokeFlow API call and its caller, not the outputs of individual nodes.
    c:
      en: |-
        Extra storage nodes change the flow, add work, and still do not record which condition was satisfied.
references:
  - title: "Track each step in your flow by viewing its trace in Amazon Bedrock - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/flows-trace.html
  - title: "Test a flow in Amazon Bedrock - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/flows-test.html
