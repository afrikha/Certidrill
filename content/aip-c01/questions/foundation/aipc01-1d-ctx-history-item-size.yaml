id: aipc01-1d-ctx-history-item-size
objective: "1.6.2"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    A company stores each chatbot conversation as a single Amazon DynamoDB item, and appends every new turn, including tool outputs such as retrieved documents, to a list attribute. As conversations grow, writes start to fail because the item exceeds the DynamoDB item size limit. The application must keep the complete history of each conversation.

    Which changes will resolve the failures? (Choose two.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Store each turn as its own item, with the conversation ID as the partition key and the turn timestamp as the sort key.
    - id: b
      text:
        en: |-
          Switch the table to on-demand capacity mode so that larger items can be written.
    - id: c
      text:
        en: |-
          Increase the provisioned write capacity units of the table.
    - id: d
      text:
        en: |-
          Enable DynamoDB Streams on the table so that large writes are processed asynchronously.
    - id: e
      text:
        en: |-
          Store large tool outputs as objects in Amazon S3 and keep only the object key in the DynamoDB item.
answer: { optionIds: [ a, e ] }
explanation:
  correct:
    en: |-
      DynamoDB limits each item to 400 KB, so an ever-growing single item eventually fails. One item per turn keeps items small while a query on the partition key still returns the whole conversation, and large values belong in Amazon S3 with the object identifier stored in the item.
  options:
    b:
      en: |-
        The 400 KB item size limit applies in every capacity mode.
    c:
      en: |-
        Write capacity changes throughput, not the maximum item size.
    d:
      en: |-
        Streams capture changes after a successful write; they do not let an oversized item be written.
references:
  - title: "Best practices for storing large items and attributes in DynamoDB - Amazon DynamoDB"
    url: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/bp-use-s3-too.html
