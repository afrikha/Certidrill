id: aipc01-1d-acc-citations-placeholder
objective: "1.5.6"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A team uses RetrieveAndGenerate with custom prompt templates. It rewrote the generation prompt template to apply the company's tone, keeping the $search_results$ placeholder, and replaced the orchestration prompt template with its own formatting rules. The answers are accurate and use the retrieved content, but the responses no longer contain any citations.

    Which change will restore the citations?
body:
  options:
    - id: a
      text:
        en: |-
          Add the $search_results$ placeholder to the orchestration prompt template as well.
    - id: b
      text:
        en: |-
          Increase numberOfResults so that more source chunks are associated with the answer.
    - id: c
      text:
        en: |-
          Enable model invocation logging so that the sources of each answer are recorded.
    - id: d
      text:
        en: |-
          Add the $output_format_instructions$ placeholder back to the orchestration prompt template.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      The $output_format_instructions$ placeholder in the orchestration template carries the underlying instructions for formatting the response and its citations. Without it, the response does not contain citations, even though retrieval and generation work.
  options:
    a:
      en: |-
        $search_results$ belongs to the generation template, where it is already present; the answers already use the retrieved content.
    b:
      en: |-
        The number of retrieved chunks does not control whether citations are produced.
    c:
      en: |-
        Invocation logging records requests and responses for auditing; it does not add citations to the response.
references:
  - title: "Configure and customize queries and response generation - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/kb-test-config.html
