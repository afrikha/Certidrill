id: aipc01-1c-maint-event-direct-ingest
objective: "1.4.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A news agency stores articles in an S3 bucket that is the data source of a customer-managed Amazon Bedrock knowledge base. Editors upload about 300 articles per hour, and each article must be retrievable within 5 minutes of its upload. The bucket must remain the source of truth, and a full sync still runs every night.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Configure an S3 event notification that invokes a Lambda function to start an ingestion job for the data source each time an article is uploaded.
    - id: b
      text:
        en: |-
          Route S3 Object Created events through Amazon EventBridge to a Lambda function that calls IngestKnowledgeBaseDocuments with each article's S3 location, pausing during the nightly sync.
    - id: c
      text:
        en: |-
          Invoke a Lambda function on each upload that calls IngestKnowledgeBaseDocuments with the article text inline so that the knowledge base does not read the object from S3.
    - id: d
      text:
        en: |-
          Have the editors' tool call IngestKnowledgeBaseDocuments instead of uploading to S3, and let the nightly sync add the articles to the bucket.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      Direct ingestion indexes the submitted documents without scanning the data source, so each new article is searchable within minutes. Because the article is also in S3, the next sync finds it unchanged and keeps it. AWS warns against submitting IngestKnowledgeBaseDocuments and StartIngestionJob at the same time, so direct ingestion should pause during the nightly sync.
  options:
    a:
      en: |-
        Each sync scans every document of the data source; starting one for each of 300 uploads per hour wastes work and would overlap with other syncs.
    c:
      en: |-
        For an S3 data source, direct ingestion accepts only S3 locations; inline content is available only for custom data sources.
    d:
      en: |-
        Direct ingestion does not write to the bucket. Articles missing from S3 are removed or overwritten at the next sync, and the bucket would no longer be the source of truth.
references:
  - title: "Ingest changes directly into a knowledge base - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/kb-direct-ingestion.html
  - title: "Ingest documents directly into a knowledge base - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/kb-direct-ingestion-add.html
