id: aipc01-1b-prompt-arn-request-fields
objective: "1.3.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A team stores a product-description prompt in Amazon Bedrock Prompt Management. Version 3 of the prompt has the variables {{product}} and {{tone}} and defines the model and its inference configuration. The application calls the Converse API with the prompt version ARN as the model ID and values for both variables in promptVariables. It also sends a system field with brand rules and an inferenceConfig with a temperature of 0.2. Every call fails with a validation error.

    What should the team do to make the calls succeed and keep using the managed prompt?
body:
  options:
    - id: a
      text:
        en: |-
          Replace the prompt version ARN with the base model ID, and keep the system field, inferenceConfig and promptVariables in the request.
    - id: b
      text:
        en: |-
          Move the brand rules and the temperature into additionalModelRequestFields, and keep the prompt version ARN and promptVariables.
    - id: c
      text:
        en: |-
          Remove system and inferenceConfig from the request, define the brand rules and temperature in a new prompt version, and call that version.
    - id: d
      text:
        en: |-
          Call the prompt's draft instead of version 3 so that the request can override the system prompt and the inference configuration.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      When the model ID is a prompt from Prompt Management, the request cannot include additionalModelRequestFields, inferenceConfig, system or toolConfig; these must be defined in the prompt itself. Moving the brand rules and the temperature into a new prompt version and passing only the variable values fixes the call.
  options:
    a:
      en: |-
        promptVariables is ignored when the model ID is not a prompt resource, so the template variables would never be filled, and the application would lose the managed prompt.
    b:
      en: |-
        additionalModelRequestFields is also one of the fields that cannot be sent with a Prompt Management prompt, so the call would still fail.
    d:
      en: |-
        The restriction applies to prompts from Prompt Management in general, so calling the draft does not allow the request to override these fields.
references:
  - title: Converse - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/APIReference/API_runtime_Converse.html
