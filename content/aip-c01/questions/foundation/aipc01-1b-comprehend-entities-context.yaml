id: aipc01-1b-comprehend-entities-context
objective: "1.3.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A claims assistant receives free-text emails from customers. Before the main prompt is built, the company wants to extract the dates, amounts, organizations and people mentioned in each email as structured fields with confidence scores. The fields will be added to the prompt as labeled context and stored as metadata. The team has no machine learning expertise and wants a pre-trained service.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Call Amazon Comprehend DetectSentiment on each email, and add the sentiment label and its scores to the prompt as labeled context.
    - id: b
      text:
        en: |-
          Call Amazon Comprehend DetectEntities on each email, and keep the DATE, QUANTITY, ORGANIZATION and PERSON entities above a score threshold.
    - id: c
      text:
        en: |-
          Call Amazon Comprehend DetectDominantLanguage on each email, and add the detected language code and its score to the prompt.
    - id: d
      text:
        en: |-
          Train an Amazon Comprehend custom entity recognizer with annotated emails, and deploy it to an endpoint for real-time entity detection.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      DetectEntities returns pre-trained entity types such as DATE, QUANTITY (including currency amounts), ORGANIZATION and PERSON, each with offsets and a confidence score. Filtering out low scores reduces the risk of incorrect detections, and the entities become labeled fields and metadata.
  options:
    a:
      en: |-
        Sentiment analysis returns the overall sentiment of the text. It does not extract dates, amounts, organizations or people.
    c:
      en: |-
        Dominant language detection identifies the language of the text, not the entities it mentions.
    d:
      en: |-
        A custom recognizer requires training data and model training, while the needed entity types are already available pre-trained.
references:
  - title: Entities - Amazon Comprehend
    url: https://docs.aws.amazon.com/comprehend/latest/dg/how-entities.html
