id: aipc01-1c-chunk-none-faq
objective: "1.5.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A bank stores each question-and-answer pair of its customer FAQ as a separate text file in Amazon S3, and an Amazon Bedrock knowledge base indexes the bucket. Some answers are up to 1,200 tokens long. The bank requires that an answer is never split, so that the model always sees the complete answer. Citations need to show only the file name, not page numbers.

    Which chunking configuration should the bank use?
body:
  options:
    - id: a
      text:
        en: |-
          Default chunking
    - id: b
      text:
        en: |-
          Fixed-size chunking with a maximum of 300 tokens and 20 percent overlap
    - id: c
      text:
        en: |-
          No chunking
    - id: d
      text:
        en: |-
          Semantic chunking with a maximum of 1,000 tokens
answer: { optionId: c }
explanation:
  correct:
    en: |-
      With no chunking, each file becomes one chunk, which suits content that is already split into self-contained units such as FAQ entries. The trade-off is that page numbers are not available in citations or filters, which the bank does not need.
  options:
    a:
      en: |-
        Default chunking produces chunks of about 300 tokens, so a 1,200-token answer would be split into several chunks.
    b:
      en: |-
        A 300-token maximum splits every long answer, and overlap does not make the parts complete.
    d:
      en: |-
        A 1,000-token maximum still splits the longest answers.
references:
  - title: "How content chunking works for knowledge bases - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/kb-chunking.html
