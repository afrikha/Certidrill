id: aipc01-1a-fm-lifecycle-pipeline-check
objective: "1.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A platform team maintains an internal catalog of Amazon Bedrock models that application teams may choose from. A new rule says that no new application may launch on a model that is already scheduled for retirement. The check must run automatically in the deployment pipeline before each release.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Query AWS CloudTrail for InvokeModel errors on each model, and block the models that returned errors during the last 30 days.
    - id: b
      text:
        en: |-
          Compare each model's launch date with the current date, and block every model that was released more than 12 months ago.
    - id: c
      text:
        en: |-
          Call GetFoundationModel for the selected model in the pipeline, and fail the release when the modelLifecycle field shows the Legacy state.
    - id: d
      text:
        en: |-
          Check the model's on-demand quotas in Service Quotas, and block the models whose quotas are lower than in the previous month.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      A model in the Legacy state is scheduled for retirement: its end-of-life date is announced at the start of the Legacy period, and new customers cannot adopt it. The lifecycle state is returned in the modelLifecycle field of GetFoundationModel and ListFoundationModels, so a pipeline step can check it automatically.
  options:
    a:
      en: |-
        Invocation errors have many causes, such as permissions or validation, and a model can be Legacy without any error.
    b:
      en: |-
        Age does not determine retirement; lifecycle dates are set per model and shown on the model card and in the API.
    d:
      en: |-
        Quotas describe capacity limits, not whether a model is scheduled for retirement.
references:
  - title: Model lifecycle - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/model-lifecycle.html
