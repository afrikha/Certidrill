id: aipc01-1d-if-denied-topic-advice
objective: "1.6.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A bank's assistant runs on Amazon Bedrock. The system prompt tells the model never to give investment advice, but testers obtained advice by rephrasing their questions or by telling the model to ignore its instructions. The bank must ensure that both requests for investment advice and responses that contain it are blocked.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Rewrite the system prompt in capital letters and repeat the rule at the end of each user message.
    - id: b
      text:
        en: |-
          Create a guardrail word filter that blocks the words invest, stocks, and portfolio in prompts and responses.
    - id: c
      text:
        en: |-
          Create a guardrail with an investment advice denied topic for inputs and outputs, and attach it to the model calls.
    - id: d
      text:
        en: |-
          Set the temperature to 0 so that the model follows the rules in the system prompt more strictly.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      A denied topic in Amazon Bedrock Guardrails evaluates prompts and responses against a natural-language topic definition, independently of the system prompt, and blocks matching content on input and output. Instructions in a prompt are guidance that the model may not follow; the guardrail is an enforcement layer.
  options:
    a:
      en: |-
        Stronger wording is still a prompt instruction that a user can override with rephrasing or injection.
    b:
      en: |-
        A word filter matches exact words and phrases, so paraphrased advice passes while legitimate questions that mention these words are blocked.
    d:
      en: |-
        Temperature controls randomness, not whether the model obeys its rules.
references:
  - title: "Block denied topics to help remove harmful content - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/guardrails-denied-topics.html
