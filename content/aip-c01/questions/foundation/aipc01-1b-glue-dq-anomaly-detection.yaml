id: aipc01-1b-glue-dq-anomaly-detection
objective: "1.3.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    An AWS Glue ETL job has loaded daily call-transcript metadata for a GenAI summarization pipeline for the last six months. The job's static data quality rules all pass. Last month, a partial upstream export loaded about 40% fewer rows and a skewed distribution of call durations, and nobody noticed for a week. Daily volumes follow a weekly pattern, and the team does not know which thresholds to set. The team wants the checks to learn from past runs and flag unusual values without hand-tuned thresholds.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Add RowCount and AllStatistics analyzers to the job's data quality evaluation, enable anomaly detection, and review the anomaly observations and their recommended rules.
    - id: b
      text:
        en: |-
          Add a static RowCount rule with a minimum value equal to the lowest daily row count of the last six months, and fail the job when the rule fails.
    - id: c
      text:
        en: |-
          Publish the data quality metrics to Amazon CloudWatch, and create an alarm when glue.data.quality.rules.failed is greater than or equal to 1.
    - id: d
      text:
        en: |-
          Generate rule recommendations for the table in the AWS Glue Data Catalog once, and add the recommended rules to the ETL job's ruleset.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      Analyzers gather statistics such as row counts and column statistics without rules. Anomaly detection learns from past data points (at least three), predicts the expected range, including trends and seasonality in the default mode, and creates an anomaly observation when a value falls outside it, with rules recommended to catch the issue in the future.
  options:
    b:
      en: |-
        A threshold set to the lowest day of a weekly pattern is a hand-tuned value: a 40% drop on a busy weekday would still pass it, and it does not check the distribution of durations.
    c:
      en: |-
        The alarm fires only when a rule fails. The existing static rules all pass on the partial loads, so the alarm would not fire.
    d:
      en: |-
        Recommended rules are static rules derived from the data at the time of analysis. They do not learn from later runs or adapt to the weekly pattern.
references:
  - title: Anomaly detection in AWS Glue Data Quality - AWS Glue
    url: https://docs.aws.amazon.com/glue/latest/dg/data-quality-anomaly-detection.html
