id: aipc01-1a-switch-appconfig-ai-model-profile
objective: "1.2.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A platform team manages the model settings of 12 GenAI applications as free-form JSON configurations in AWS AppConfig, with a different structure for each team. It now wants one standard configuration that holds the model identifier, inference parameters such as temperature and maximum tokens, the system prompt, and provider-specific options. Gradual rollouts and alarm-based rollback must be kept. The team wants the LEAST custom schema maintenance and no additional service cost.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Keep the free-form profiles, and write a shared JSON Schema validator that every team must attach to its configuration profile.
    - id: b
      text:
        en: |-
          Move the settings to Amazon Bedrock Prompt Management, and build a Lambda function that copies new prompt versions to each application.
    - id: c
      text:
        en: |-
          Create AWS AppConfig AI model invocation configuration profiles for the applications, and deploy changes with AppConfig deployment strategies.
    - id: d
      text:
        en: |-
          Store the settings in an Amazon DynamoDB table with one item per application, and roll out changes with an AWS Step Functions workflow.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      Since November 19, 2026, AppConfig has a native AI model invocation configuration type that stores the model identifier, inference parameters, messages such as system prompts, and provider-specific options in custom parameters, with one schema across providers. It keeps AppConfig's gradual rollouts and alarm-based automatic rollback, at no additional cost.
  options:
    a:
      en: |-
        A shared validator is a custom schema that the team must write and maintain, which the native configuration type avoids.
    b:
      en: |-
        Copying prompt versions with custom code loses AppConfig's gradual rollout and alarm-based rollback, and the team must maintain the function.
    d:
      en: |-
        A table and a custom rollout workflow rebuild deployment and rollback features that AppConfig already provides.
references:
  - title: AWS AppConfig launches support for managing native AI model and AI prompt configuration
    url: https://aws.amazon.com/about-aws/whats-new/2026/11/aws-appconfig-native-ai-model-invocation-prompt-configurations/
