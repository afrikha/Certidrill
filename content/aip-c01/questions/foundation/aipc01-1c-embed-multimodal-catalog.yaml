id: aipc01-1c-embed-multimodal-catalog
objective: "1.5.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An online furniture retailer wants shoppers to upload a photo of a room and retrieve catalog items whose product images and descriptions look similar. The catalog images and descriptions will be indexed in an Amazon Bedrock knowledge base with an S3 data source.

    Which embedding model should the retailer choose?
body:
  options:
    - id: a
      text:
        en: |-
          Amazon Titan Text Embeddings V2
    - id: b
      text:
        en: |-
          Cohere Embed English v3
    - id: c
      text:
        en: |-
          Cohere Embed Multilingual v3
    - id: d
      text:
        en: |-
          Amazon Titan Multimodal Embeddings G1
answer: { optionId: d }
explanation:
  correct:
    en: |-
      Searching with a photo requires a multimodal embedding model that places images and text in the same vector space. Amazon Titan Multimodal Embeddings G1 is a multimodal model supported by knowledge bases, and S3 data sources support multimodal content.
  options:
    a:
      en: |-
        Titan Text Embeddings V2 embeds text only, so it cannot embed the shopper's photo or the product images.
    b:
      en: |-
        Cohere Embed English v3 is a text model and cannot embed images.
    c:
      en: |-
        Cohere Embed Multilingual v3 handles text in many languages, but not images.
references:
  - title: "Supported models and Regions for Amazon Bedrock knowledge bases - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/knowledge-base-supported.html
  - title: "Connect a data source to your knowledge base - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/data-source-connectors.html
