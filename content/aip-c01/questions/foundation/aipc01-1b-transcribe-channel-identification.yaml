id: aipc01-1b-transcribe-channel-identification
objective: "1.3.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A bank records customer service calls as two-channel audio files: the agent is always on the first channel and the customer on the second. A foundation model analyzes the transcripts and must receive every utterance labeled reliably as agent or customer, so that it can assess the customer's sentiment separately. Agents and customers often talk at the same time.

    Which Amazon Transcribe configuration will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Enable speaker partitioning with a maximum of two speakers, and map the first speaker label that appears in each transcript to the agent.
    - id: b
      text:
        en: |-
          Enable channel identification, and map the first channel label to the agent and the second channel label to the customer.
    - id: c
      text:
        en: |-
          Convert the recordings to single-channel audio before transcription, and enable speaker partitioning with a maximum of two speakers.
    - id: d
      text:
        en: |-
          Enable PII redaction with both redacted and unredacted output, and use the unredacted transcript to label the agent's utterances.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      Channel identification transcribes each channel of a two-channel recording separately and labels the speech ch_0 and ch_1. Because the channel assignment is fixed, the label maps to the agent or the customer every time, and speech in which both people talk at once is kept with overlapping timestamps on each channel.
  options:
    a:
      en: |-
        Speaker partitioning labels unknown voices spk_0, spk_1 and so on in the order it distinguishes them. Nothing guarantees that the first label is the agent, so the mapping is not reliable.
    c:
      en: |-
        Mixing down to one channel throws away the separation that already identifies each speaker, and leaves the guesswork of speaker partitioning on overlapping speech.
    d:
      en: |-
        PII redaction removes or flags personal data. It does not identify which person is speaking.
references:
  - title: Transcribing multi-channel audio - Amazon Transcribe
    url: https://docs.aws.amazon.com/transcribe/latest/dg/channel-id.html
  - title: Partitioning speakers (diarization) - Amazon Transcribe
    url: https://docs.aws.amazon.com/transcribe/latest/dg/diarization.html
