id: aipc01-1b-comprehend-custom-entities
objective: "1.3.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A manufacturer's support tickets mention internal part names such as "Hydra valve kit". New names appear every quarter, and customers often misspell them. The company wants to extract the part names from every ticket to add them as metadata filters and as labeled context in the prompt. A regular expression built from the catalog misses misspelled and new names. The company has a list of 3,000 known part names and a large set of unannotated tickets.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Call Amazon Comprehend DetectEntities on each ticket, and keep the entities of the COMMERCIAL_ITEM type as the part names.
    - id: b
      text:
        en: |-
          Extend the regular expression in the Lambda function with the 3,000 known names and common misspellings, and update it every quarter.
    - id: c
      text:
        en: |-
          Configure an Amazon Bedrock Guardrails sensitive information filter with a custom regular expression for part names, and read the detected matches.
    - id: d
      text:
        en: |-
          Train an Amazon Comprehend custom entity recognizer with the part name list and the unannotated tickets, and use it to detect part names in the tickets.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      Custom entity recognition identifies entity types that are not among the preset types. It can be trained from an entity list plus unannotated documents that contain those entities, and the model learns the context in which names appear, so it can detect misspellings and new names that string matching misses.
  options:
    a:
      en: |-
        COMMERCIAL_ITEM covers branded products in general. It is not trained on the manufacturer's internal part names, so detection would be unreliable.
    b:
      en: |-
        String matching does not detect entities with typos or new naming conventions, so the expression would keep missing names between updates.
    c:
      en: |-
        A sensitive information filter is still a regular expression, with the same limits, and it is designed to block or mask data rather than extract entities.
references:
  - title: Custom entity recognition - Amazon Comprehend
    url: https://docs.aws.amazon.com/comprehend/latest/dg/custom-entity-recognition.html
  - title: Entities - Amazon Comprehend
    url: https://docs.aws.amazon.com/comprehend/latest/dg/how-entities.html
