id: aipc01-1d-acc-retrieve-own-prompt
objective: "1.5.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A logistics company is building a RAG feature that combines passages from an Amazon Bedrock knowledge base with live shipment data from an internal API. The application builds its own prompt from both sources and calls a model of its choice. It needs the raw chunks with their source locations, metadata, and relevance scores.

    Which Amazon Bedrock operation should the application call on the knowledge base?
body:
  options:
    - id: a
      text:
        en: |-
          RetrieveAndGenerate
    - id: b
      text:
        en: |-
          Retrieve
    - id: c
      text:
        en: |-
          RetrieveAndGenerateStream
    - id: d
      text:
        en: |-
          Rerank
answer: { optionId: b }
explanation:
  correct:
    en: |-
      Retrieve queries the knowledge base and returns the retrieval results, each with its content, location, metadata, and score, without generating an answer. The application can then combine them with the shipment data in its own prompt.
  options:
    a:
      en: |-
        RetrieveAndGenerate generates the answer itself, so the application cannot add the live shipment data to the prompt in its own way.
    c:
      en: |-
        RetrieveAndGenerateStream is the streamed form of RetrieveAndGenerate and also generates the answer.
    d:
      en: |-
        Rerank reorders documents that you already have; it does not query the knowledge base.
references:
  - title: "Retrieve - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/APIReference/API_agent-runtime_Retrieve.html
