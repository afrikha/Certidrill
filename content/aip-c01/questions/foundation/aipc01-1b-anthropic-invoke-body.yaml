id: aipc01-1b-anthropic-invoke-body
objective: "1.3.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A developer calls an Anthropic Claude model in Amazon Bedrock with the InvokeModel API from an existing service that cannot be migrated to the Converse API yet. Each request must include a system instruction that sets the assistant's role, the user's question, and a limit of 1,024 output tokens.

    Which request body is correctly formatted for this model?
body:
  options:
    - id: a
      text:
        en: |-
          {"system": [{"text": "<role>"}], "messages": [{"role": "user", "content": [{"text": "<question>"}]}], "inferenceConfig": {"maxTokens": 1024}}
    - id: b
      text:
        en: |-
          {"anthropic_version": "bedrock-2023-05-31", "max_tokens": 1024, "system": "<role>", "messages": [{"role": "user", "content": [{"type": "text", "text": "<question>"}]}]}
    - id: c
      text:
        en: |-
          {"anthropic_version": "bedrock-2023-05-31", "max_tokens": 1024, "messages": [{"role": "system", "content": "<role>"}, {"role": "user", "content": "<question>"}]}
    - id: d
      text:
        en: |-
          {"inputs": "<role> <question>", "parameters": {"max_new_tokens": 1024}}
answer: { optionId: b }
explanation:
  correct:
    en: |-
      InvokeModel takes the body in the model provider's native format. For Claude, that is the Messages format with anthropic_version set to bedrock-2023-05-31, max_tokens, the system prompt in the separate system field, and messages whose content blocks have a type such as text.
  options:
    a:
      en: |-
        This is the Converse request shape (system blocks, content blocks without type, inferenceConfig). InvokeModel expects the provider's native body, so these fields are not understood.
    c:
      en: |-
        Claude works on alternating user and assistant turns, and the system prompt goes in the system field, not in a message with a system role.
    d:
      en: |-
        The inputs and parameters shape is the format of many SageMaker AI text-generation containers, not the Anthropic Messages format.
references:
  - title: Anthropic Claude Messages API - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/model-parameters-anthropic-claude-messages.html
