id: aipc01-1b-processing-tabular-context
objective: "1.3.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A retailer stores 3 TB of transaction data as Parquet files in Amazon S3. Every night, the data must be aggregated per customer and each customer's last 90 days must be converted into a short JSON Lines summary that a Bedrock prompt uses as personalization context. The data science team already has the transformation as a Python script that uses pandas and scikit-learn, and a run takes about 2 hours. The company wants managed infrastructure that is released after each run.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Run the script in an AWS Lambda function that an Amazon EventBridge Scheduler schedule invokes every night with the maximum memory setting.
    - id: b
      text:
        en: |-
          Send the Parquet files to a Bedrock batch inference job with a prompt that asks the model to aggregate the transactions and write the summaries.
    - id: c
      text:
        en: |-
          Run the script as an Amazon SageMaker Processing job that reads the Parquet files from S3 and writes the JSON Lines summaries to S3.
    - id: d
      text:
        en: |-
          Run the script on an Amazon EC2 instance with a cron job, and write the JSON Lines summaries to an S3 bucket after each run.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      SageMaker Processing runs pre-processing and feature engineering scripts on fully managed infrastructure, with built-in data processing containers or your own container. It reads input from S3, writes output to S3, and releases the instances when the job completes.
  options:
    a:
      en: |-
        A Lambda function can run for at most 1,800 seconds (30 minutes), so a 2-hour transformation of 3 TB does not fit in one invocation.
    b:
      en: |-
        Aggregating terabytes of transactions is a data processing task, not an inference task. Sending it to an FM would be costly, slow and less exact than running the existing script.
    d:
      en: |-
        A self-managed EC2 instance with cron is infrastructure the team must patch and operate, and it is not released after each run unless the team builds that automation.
references:
  - title: Data transformation workloads with SageMaker Processing - Amazon SageMaker AI
    url: https://docs.aws.amazon.com/sagemaker/latest/dg/processing-job.html
