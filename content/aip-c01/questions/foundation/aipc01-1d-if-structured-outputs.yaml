id: aipc01-1d-if-structured-outputs
objective: "1.6.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An insurance company's claims intake service parses JSON produced by a model on Amazon Bedrock and loads it into a downstream system. About 2% of responses fail to parse because of missing keys or extra prose, even though the prompt says to respond only in JSON and includes examples. The company requires every response to conform to its JSON schema without retry loops.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Add more examples to the prompt and set the temperature to 0 to make the output more consistent.
    - id: b
      text:
        en: |-
          Validate each response with a Lambda function and call the model again until the response is valid.
    - id: c
      text:
        en: |-
          Create a guardrail word filter that blocks responses containing prose outside the JSON object.
    - id: d
      text:
        en: |-
          Pass the JSON schema in outputConfig.textFormat of the Converse request so that Bedrock enforces it.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      Structured outputs makes Amazon Bedrock constrain the response to the JSON schema given in outputConfig.textFormat, which removes the error rate and retry loops of prompt-based approaches.
  options:
    a:
      en: |-
        Examples and a low temperature reduce failures but cannot guarantee schema compliance.
    b:
      en: |-
        Validate-and-retry is the retry loop the company wants to avoid, and it adds latency and cost.
    c:
      en: |-
        A word filter matches words and phrases; it cannot check that a response conforms to a schema.
references:
  - title: "Get validated JSON results from models - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/structured-output.html
