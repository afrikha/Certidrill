id: aipc01-1a-resil-global-profile-throughput
objective: "1.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A gaming company in ap-southeast-2 uses a foundation model in Amazon Bedrock to generate in-game dialogue. During game launches, the request volume exceeds what on-demand inference in a single Region delivers, and players see failed requests. The prompts contain no regulated data, and there is no requirement on where inference runs. The company wants the highest available throughput at the lowest price per token.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Call the model through the global cross-Region inference profile from ap-southeast-2.
    - id: b
      text:
        en: |-
          Deploy the application in three Regions, and send each request to one of the Regions chosen at random by the client.
    - id: c
      text:
        en: |-
          Call the model through a geographic cross-Region inference profile for the Asia Pacific Regions from ap-southeast-2.
    - id: d
      text:
        en: |-
          Purchase Provisioned Throughput, and invoke it through the global cross-Region inference profile during launches.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      A global inference profile routes requests to any supported commercial Region, which gives the largest pool of capacity, and it costs about 10 % less than geographic profile pricing. There is no additional routing charge, and traffic stays on the AWS network.
  options:
    c:
      en: |-
        A geographic profile limits routing to the Regions of one geography and is priced at the standard rate, so it is the choice for residency requirements, not for maximum throughput at the lowest price.
    b:
      en: |-
        Running three stacks with client-side Region selection adds infrastructure and still pays in-Region on-demand prices.
    d:
      en: |-
        Inference profiles do not support Provisioned Throughput.
references:
  - title: Route model inference requests across AWS Regions with cross-Region inference - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/cross-region-inference.html
