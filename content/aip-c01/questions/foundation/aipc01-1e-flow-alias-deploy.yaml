id: aipc01-1e-flow-alias-deploy
objective: "1.6.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A team has finished testing the working draft of an Amazon Bedrock flow. The production application must run a fixed configuration of the flow while the team keeps editing the draft. The team must be able to roll back to the previous configuration without changing the application code.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Have the application call InvokeFlow with the test alias TSTALIASID, and edit the draft only outside business hours.
    - id: b
      text:
        en: |-
          Export the flow definition to Amazon S3 after each release, and have the application re-create the flow from the file at startup.
    - id: c
      text:
        en: |-
          Create a flow version and an alias that points to it, have the application call the alias, and repoint the alias to roll back.
    - id: d
      text:
        en: |-
          Create a new flow for each release, and change the flow identifier in the application code for each release or rollback.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      A flow version is an immutable snapshot of the draft, and an alias points to a version. The application calls InvokeFlow on the alias, so pointing the alias to another version releases or rolls back the flow without any change to the application code.
  options:
    a:
      en: |-
        The test alias points to the working draft, so every saved edit would reach production.
    b:
      en: |-
        Re-creating flows at startup adds fragile custom code and gives no versioned rollback.
    d:
      en: |-
        Changing the flow identifier in the code for each release or rollback breaks the requirement to roll back without code changes.
references:
  - title: "Deploy a flow to your application using versions and aliases - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/flows-deploy.html
