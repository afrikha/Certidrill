id: aipc01-1a-std-prompt-catalog
objective: "1.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company has eight applications that each embed their own copy of a prompt that summarizes customer calls, and the copies have drifted apart. The company wants one reviewed prompt template with variables for the customer name and the call transcript, stored together with the model and inference parameters, saved as versions, and reused by every application and by Amazon Bedrock flows.

    Which solution will meet these requirements with the LEAST custom development?
body:
  options:
    - id: a
      text:
        en: |-
          Store the template in an Amazon DynamoDB table with a version attribute, and build a Lambda function that fills in the variables and calls the model.
    - id: b
      text:
        en: |-
          Store the template as a text file in a versioned S3 bucket, and have each application download it and replace the placeholders at startup.
    - id: c
      text:
        en: |-
          Create an Amazon Bedrock guardrail that rewrites every summarization prompt into the approved wording before the model receives it.
    - id: d
      text:
        en: |-
          Create the prompt in Amazon Bedrock Prompt Management with both variables, the model, and the inference parameters, and save versions for the applications and flows.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      Prompt Management stores reusable prompts with variables that are filled in at runtime, together with the model or inference profile and the inference parameters, and saves versions of them. Applications specify the prompt when they run inference, and flows use it in a prompt node, so every consumer shares one reviewed template.
  options:
    a:
      en: |-
        A DynamoDB table plus a custom Lambda function rebuilds features that Prompt Management already provides.
    b:
      en: |-
        Each application still has to implement substitution and model settings itself, and flows cannot reference the file as a managed prompt.
    c:
      en: |-
        Guardrails filter or block content according to policies; they do not rewrite prompts into a template.
references:
  - title: Construct and store reusable prompts with Prompt management in Amazon Bedrock - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/prompt-management.html
