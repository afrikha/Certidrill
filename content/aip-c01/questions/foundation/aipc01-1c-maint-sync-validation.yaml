id: aipc01-1c-maint-sync-validation
objective: "1.4.5"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A bank refreshes a customer-managed Amazon Bedrock knowledge base every night with an ingestion job that a Step Functions workflow starts. Last month, a credentials change broke the data source. Several syncs failed or skipped documents, and the assistant answered with outdated rates for a week before anyone noticed. The bank wants to detect such problems on the morning after a failed refresh.

    Which combination of actions will meet these requirements? (Choose two.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Set the dataDeletionPolicy of the data source to RETAIN so that existing vectors are kept whenever a nightly sync fails or skips documents.
    - id: b
      text:
        en: |-
          Have the workflow poll GetIngestionJob until the job ends, and send an Amazon SNS alert when the status is not COMPLETE or the statistics report failed documents.
    - id: c
      text:
        en: |-
          Raise numberOfResults in the assistant's Retrieve requests so that more recent chunks are included in the context of each answer.
    - id: d
      text:
        en: |-
          Add a workflow step that runs Retrieve with test questions whose expected source documents are known, and alert when those documents are missing or outdated.
    - id: e
      text:
        en: |-
          Enable AWS CloudTrail management events for Amazon Bedrock, and have the operations team review them every week to find failed ingestion jobs.
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |-
      GetIngestionJob returns the job status, which is COMPLETE when the job finishes successfully, and statistics on the documents processed, so the workflow can alert on any failure. Running known test questions after each sync also catches problems that a successful job status does not show, such as stale or missing content.
  options:
    a:
      en: |-
        dataDeletionPolicy decides whether vectors are deleted when the data source itself is deleted; it neither prevents nor reports failed syncs.
    c:
      en: |-
        Retrieving more chunks does not add content that failed to ingest, and it does not alert anyone.
    e:
      en: |-
        A weekly review would not detect the problem the morning after a failure, which is the requirement.
references:
  - title: "Sync your data with your Amazon Bedrock knowledge base - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/kb-data-source-sync-ingest.html
  - title: "Sync a data source - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/kb-managed-sync.html
