id: aipc01-1a-design-rag-changing-policies
objective: "1.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An insurance company wants an internal assistant that answers employee questions about its claims-handling policies. The policies are PDF files in an Amazon S3 bucket, and dozens of them are revised every week. Every answer must reflect the current version of a policy and must cite the document that it comes from. The company wants the LEAST operational overhead.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Fine-tune a foundation model in Amazon Bedrock every month on question-and-answer pairs generated from the policies, and serve the custom model to the assistant.
    - id: b
      text:
        en: |-
          Create an Amazon Bedrock knowledge base with the S3 bucket as its data source, sync it after policy changes, and answer through the RetrieveAndGenerate API.
    - id: c
      text:
        en: |-
          Index the policies in an Amazon Kendra index with an S3 connector, and pass the top search results to a Bedrock model in the prompt.
    - id: d
      text:
        en: |-
          Run a continued pre-training job on all policy documents every week, and invoke the resulting custom model through Provisioned Throughput.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      Amazon Bedrock Knowledge Bases implement Retrieval Augmented Generation: at query time the knowledge base retrieves the relevant passages from the synced documents, and responses can include citations to the source data. Syncing after the weekly revisions keeps answers current without any retraining, and Bedrock manages ingestion, indexing and retrieval.
  options:
    a:
      en: |-
        Fine-tuning teaches a style, format or task, not facts that change every week: a monthly job always lags behind the revisions, and the model cannot cite the document an answer comes from.
    c:
      en: |-
        Amazon Kendra has been closed to new customers since July 30, 2026, so it is not an option for a new design; a Bedrock knowledge base covers the need.
    d:
      en: |-
        A weekly continued pre-training job plus Provisioned Throughput for the custom model is the highest-overhead option, still lags behind revisions, and provides no citations.
references:
  - title: Retrieve data and generate AI responses with Amazon Bedrock Knowledge Bases - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/knowledge-base.html
