id: aipc01-1a-poc-success-criteria
objective: "1.1.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A telecom company wants to validate a GenAI assistant that drafts replies to customer complaints before it approves a full-scale build on Amazon Bedrock. Leadership asks for evidence of answer quality, response time, and cost per reply that will still hold in production.

    Which combination of actions should the team take? (Choose two.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Fine-tune a model on all historical complaint replies first, so that the proof of concept starts with the best possible model.
    - id: b
      text:
        en: |-
          Define measurable success criteria before testing: a quality threshold, a latency target, and a maximum cost per reply.
    - id: c
      text:
        en: |-
          Purchase Provisioned Throughput with a 6-month commitment so that the measured latency matches the production capacity.
    - id: d
      text:
        en: |-
          Have two employees try 20 hand-written complaints in the console playground and summarize their impressions.
    - id: e
      text:
        en: |-
          Evaluate the candidate models on a dataset of anonymized real complaints, and record the token usage and latency of each response.
answer: { optionIds: [b, e] }
explanation:
  correct:
    en: |-
      A proof of concept needs explicit pass or fail criteria for quality, latency and cost, and it needs measurements on a representative dataset. Bedrock evaluation jobs score responses on a custom prompt dataset, and each Converse response returns its token usage and latency, from which the cost per reply is projected.
  options:
    a:
      en: |-
        Fine-tuning before measuring the base models is premature and costly; customization is decided after prompting and evaluation show a gap.
    c:
      en: |-
        A 6-month commitment for a proof of concept spends production money before feasibility is known.
    d:
      en: |-
        A few hand-written prompts and impressions are neither representative nor measurable, so they cannot show that results will hold in production.
references:
  - title: Evaluate the performance of Amazon Bedrock resources - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/evaluation.html
  - title: Inference using Converse API - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/conversation-inference.html
