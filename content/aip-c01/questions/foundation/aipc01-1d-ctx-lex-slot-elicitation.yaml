id: aipc01-1d-ctx-lex-slot-elicitation
objective: "1.6.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A hotel chain is building a booking assistant. Before a booking can be made, the assistant must collect the city, check-in date, number of nights, and room type, and it must ask the guest for whichever of these values is still missing. When all values are collected, a Lambda function creates the booking. The company wants the least custom code for the questioning logic.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Write a Lambda function that parses each guest message with regular expressions and decides which question to ask next.
    - id: b
      text:
        en: |-
          Create an Amazon Lex V2 bot with a booking intent whose four values are required slots with prompts, and fulfill the intent with the Lambda function.
    - id: c
      text:
        en: |-
          Store the conversation in Amazon DynamoDB and ask the model in the system prompt to keep asking until all values are present.
    - id: d
      text:
        en: |-
          Use Amazon Comprehend custom entity recognition to extract the values from each message and send the missing ones to the guest by email.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      In Amazon Lex V2, an intent defines required slots with one or more prompts each; at runtime Lex prompts the user for the slot values that are missing and fulfills the intent, for example with a Lambda function, only when all required slots are filled. The questioning logic is configuration, not code.
  options:
    a:
      en: |-
        Hand-written parsing and dialog logic is the custom code the company wants to avoid, and regular expressions break on free-form replies.
    c:
      en: |-
        A prompt instruction does not guarantee that every required value is collected before the booking function runs.
    d:
      en: |-
        Entity recognition extracts values but does not manage the dialog, and email is not the interactive conversation the assistant needs.
references:
  - title: "Amazon Lex V2 core concepts - Amazon Lex"
    url: https://docs.aws.amazon.com/lexv2/latest/dg/how-it-works.html
