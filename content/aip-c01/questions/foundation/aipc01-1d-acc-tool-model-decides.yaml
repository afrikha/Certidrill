id: aipc01-1d-acc-tool-model-decides
objective: "1.5.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company's assistant uses the Converse API with an Anthropic Claude model. The assistant handles small talk and general questions, and it should search the product documentation knowledge base only when a question needs it. Today the application calls Retrieve before every model call, which adds latency to every message.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Call RetrieveAndGenerate for every message so that retrieval and generation happen in a single request with citations.
    - id: b
      text:
        en: |-
          Define a search_knowledge_base tool in toolConfig and set toolChoice to any so that the model requests the tool before it answers.
    - id: c
      text:
        en: |-
          Define a search_knowledge_base tool in toolConfig, and when the model stops with tool_use, call Retrieve and return the chunks in a toolResult block.
    - id: d
      text:
        en: |-
          Add a guardrail denied topic for small talk so that only product questions reach the retrieval step and the model.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      With tool use, the model decides when a tool is needed and returns a tool request; the application runs Retrieve and sends the result back in a toolResult block with the same toolUseId. Messages that do not need documentation are answered directly, without a retrieval call.
  options:
    a:
      en: |-
        RetrieveAndGenerate retrieves on every request, so small talk still pays the retrieval latency.
    b:
      en: |-
        toolChoice any forces the model to request a tool on every turn, which reproduces the current behavior.
    d:
      en: |-
        A denied topic blocks small talk instead of answering it, and it does not let the model decide when to search.
references:
  - title: "Use a tool to complete an Amazon Bedrock model response - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/tool-use.html
  - title: "Client-side tool use - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/tool-use-client-side.html
