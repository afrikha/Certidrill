id: aipc01-1a-poc-llm-judge-comparison
objective: "1.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A financial services company is running a proof of concept for an assistant that answers questions about its investment products. It has 600 representative questions with reference answers written by product experts. The team must compare three models in Amazon Bedrock on the correctness and completeness of their answers, with a score and an explanation for each response, and must repeat the comparison whenever the prompts change. The team wants the LEAST manual effort.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Ask product experts to chat with each model in the Amazon Bedrock console playground and record their ratings in a shared spreadsheet.
    - id: b
      text:
        en: |-
          Run Amazon SageMaker AI Clarify foundation model evaluation jobs against each model with the 600 questions as the dataset.
    - id: c
      text:
        en: |-
          Create Amazon Bedrock evaluation jobs that use an LLM as a judge with the built-in correctness and completeness metrics on a custom prompt dataset.
    - id: d
      text:
        en: |-
          Create Amazon Bedrock automatic evaluation jobs with the question and answer task type on the built-in TriviaQA dataset.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      In an LLM-as-a-judge evaluation job, a judge model scores each response of the generator model and explains the score. Built-in metrics such as correctness and completeness can be applied to a custom prompt dataset with reference answers, and the job can be rerun whenever the prompts change.
  options:
    a:
      en: |-
        Manual playground chats are slow, inconsistent between reviewers, and not repeatable for each prompt change.
    b:
      en: |-
        SageMaker AI Clarify has been closed to new customers since July 30, 2026, so it is not an option for this new evaluation.
    d:
      en: |-
        A built-in general-knowledge dataset says nothing about the company's products, and automatic jobs return computed scores such as NLP-F1, not judged explanations.
references:
  - title: Evaluate model performance using another LLM as a judge - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/evaluation-judge.html
