id: aipc01-1d-adv-rerank-low-ranked
objective: "1.5.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An HR assistant uses an Amazon Bedrock knowledge base and passes the top 5 retrieved chunks to the model. An evaluation shows that the chunk that contains the right answer is usually retrieved within the top 20 results but is ranked between 8 and 15. Passing 20 chunks to the model raised cost and produced confused answers. The company wants more accurate answers while keeping the prompt small.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Enable query decomposition so that each question is split into sub-queries before retrieval.
    - id: b
      text:
        en: |-
          Retrieve 20 candidates, rerank them with a reranker model, and pass only the top 5 reranked chunks to the model.
    - id: c
      text:
        en: |-
          Re-embed the corpus with 256-dimension embeddings and keep passing the top 5 chunks to the model.
    - id: d
      text:
        en: |-
          Pass the top 20 chunks to the model and set the temperature to 0 to reduce confusion.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      A reranker model scores each retrieved chunk against the query and reorders the results, and its order overrides the knowledge base ranking. Retrieving a wider candidate set and keeping only the best reranked chunks brings the right chunk into the prompt while keeping input tokens, cost, and latency low.
  options:
    a:
      en: |-
        Decomposition helps compound questions; here the right chunk is already retrieved and only its rank is wrong.
    c:
      en: |-
        Fewer dimensions reduce storage and can lower accuracy; they do not fix the ranking.
    d:
      en: |-
        Temperature does not remove the noise of 15 irrelevant chunks, and the larger prompt keeps the higher cost.
references:
  - title: "Improve the relevance of query responses with a reranker model in Amazon Bedrock - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/rerank.html
