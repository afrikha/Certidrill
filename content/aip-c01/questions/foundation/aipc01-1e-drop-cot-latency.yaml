id: aipc01-1e-drop-cot-latency
objective: "1.6.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A logistics company extracts the tracking number, carrier, and delivery date from short customer emails. The prompt asks the model to think step by step and explain its reasoning before it gives the JSON result, and the application discards the reasoning. Accuracy meets the target, but the p90 response time is twice the 1-second requirement, and most output tokens are reasoning. The company wants to meet the latency target without reducing accuracy, at the LOWEST cost.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Keep the step-by-step instruction, and stream the response so that the application can start parsing the output earlier.
    - id: b
      text:
        en: |-
          Purchase Provisioned Throughput for the model so that the same prompt runs on dedicated capacity with faster responses.
    - id: c
      text:
        en: |-
          Move the step-by-step instruction from the user message to the system prompt so that the model applies it more briefly.
    - id: d
      text:
        en: |-
          Remove the step-by-step instruction, specify the exact JSON fields and formats, and add a few example emails with their JSON.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      Chain-of-thought improves complex reasoning but adds output tokens, latency, and cost, so it should be skipped for simple tasks such as extracting three fields from a short email. An explicit output specification with a few examples keeps the extraction accurate while the response shrinks to the JSON object alone.
  options:
    a:
      en: |-
        The reasoning comes before the JSON, so the application still waits for every reasoning token before it has a result to parse.
    b:
      en: |-
        Dedicated capacity costs more and the model still generates the same reasoning tokens before the JSON.
    c:
      en: |-
        The reasoning is still generated wherever the instruction sits, so the output length and latency do not change.
references:
  - title: "Give Amazon Nova time to think (chain-of-thought) - Amazon Nova"
    url: https://docs.aws.amazon.com/nova/latest/userguide/prompting-chain-of-thought.html
  - title: "Provide examples (few-shot prompting) - Amazon Nova"
    url: https://docs.aws.amazon.com/nova/latest/userguide/prompting-examples.html
