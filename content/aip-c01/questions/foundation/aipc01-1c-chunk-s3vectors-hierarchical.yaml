id: aipc01-1c-chunk-s3vectors-hierarchical
objective: "1.5.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company indexes long engineering specifications in an Amazon Bedrock knowledge base backed by Amazon S3 Vectors. The data source uses hierarchical chunking with 8,000-token parent chunks and 1,000-token child chunks, and ingestion jobs fail with metadata size errors. The company must keep S3 Vectors for cost reasons and can accept less context per retrieved chunk.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Create a data source that uses fixed-size chunking with overlap, and ingest the specifications through it instead of the hierarchical data source.
    - id: b
      text:
        en: |-
          Shorten the .metadata.json files of the specifications so that each one stays under the 10 KB limit for metadata files.
    - id: c
      text:
        en: |-
          Keep hierarchical chunking, and increase the parent chunk size so that fewer parent chunks are stored for each document.
    - id: d
      text:
        en: |-
          Move the vector store to Amazon OpenSearch Serverless, and keep the hierarchical chunking configuration.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      AWS does not recommend hierarchical chunking with S3 Vectors: combined parent and child sizes above about 8,000 tokens can exceed the per-vector metadata size limit, which makes ingestion fail. Fixed-size chunks with overlap stay well within the limit and keep S3 Vectors, at the cost of less context per chunk, which the company accepts.
  options:
    b:
      en: |-
        The 10 KB limit applies to metadata files; the failure comes from the per-vector metadata limit of S3 Vectors, which the large parent chunks exceed.
    c:
      en: |-
        Larger parent chunks put even more text into each vector's metadata and make the errors worse.
    d:
      en: |-
        OpenSearch Serverless would support hierarchical chunking, but the company must keep S3 Vectors.
references:
  - title: "How content chunking works for knowledge bases - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/kb-chunking.html
  - title: "Prerequisites for using a vector store you created for a knowledge base - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/knowledge-base-setup.html
