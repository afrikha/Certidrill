id: aipc01-1a-poc-byo-responses
objective: "1.1.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company runs a self-hosted open-source model on Amazon EKS for an internal question-answering tool. During a proof of concept, it wants to know whether two models in Amazon Bedrock would answer better. All three models must be scored by the same judge model, with the same metrics, on the same 400 prompts. The EKS model must not be exposed outside its VPC.

    Which solution will meet these requirements with the LEAST effort?
body:
  options:
    - id: a
      text:
        en: |-
          Generate the EKS model's responses to the 400 prompts, add them to the prompt dataset of an LLM-as-a-judge evaluation job, and run jobs with the same judge and metrics for the two Bedrock models.
    - id: b
      text:
        en: |-
          Import the EKS model's weights with Amazon Bedrock Custom Model Import so that one evaluation job can invoke all three models as generators.
    - id: c
      text:
        en: |-
          Publish the EKS model through a public Amazon API Gateway endpoint, and register the endpoint as the generator model of an evaluation job.
    - id: d
      text:
        en: |-
          Run automatic evaluation jobs on a built-in dataset for the two Bedrock models, and compare them with accuracy figures from the EKS team's own scripts.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      LLM-as-a-judge jobs can evaluate models outside Amazon Bedrock when you supply their responses in the prompt dataset: Bedrock skips the invocation step and judges the supplied responses. Running the two Bedrock candidates with the same judge model, metrics and prompts gives comparable scores, and the EKS model never leaves its VPC.
  options:
    b:
      en: |-
        Importing weights is a separate project that depends on supported architectures and adds a model to operate; supplying the responses is enough for an evaluation.
    c:
      en: |-
        Exposing the model publicly violates the VPC requirement, and an evaluation job does not invoke arbitrary HTTP endpoints as generators.
    d:
      en: |-
        Different datasets, metrics and scoring methods produce numbers that cannot be compared, which defeats the purpose of the proof of concept.
references:
  - title: Evaluate model performance using another LLM as a judge - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/evaluation-judge.html
