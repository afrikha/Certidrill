id: aipc01-1c-embed-multilingual-cohere
objective: "1.5.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A travel company's Amazon Bedrock knowledge base contains hotel descriptions written in Japanese, Spanish, German, and English. Customers ask questions in any of these languages, often in a language different from that of the relevant description. The company wants the best cross-language retrieval among the embedding models that knowledge bases support.

    Which embedding model should the company use?
body:
  options:
    - id: a
      text:
        en: |-
          Amazon Titan Text Embeddings V2 at 1,024 dimensions
    - id: b
      text:
        en: |-
          Cohere Embed Multilingual v3
    - id: c
      text:
        en: |-
          Amazon Titan Embeddings G1 - Text
    - id: d
      text:
        en: |-
          Cohere Embed English v3
answer: { optionId: b }
explanation:
  correct:
    en: |-
      Cohere Embed Multilingual v3 is the multilingual text embedding model in the list of models that knowledge bases support, which suits corpora and questions in many languages. AWS states that Titan Text Embeddings V2 is optimized for English and that cross-language queries, such as a German question against Korean documents, give sub-optimal results.
  options:
    a:
      en: |-
        Titan Text Embeddings V2 supports many languages but is optimized for English, and AWS documents sub-optimal results for cross-language queries.
    c:
      en: |-
        Titan Embeddings G1 - Text is the previous-generation Titan text model; it brings no cross-language advantage and produces larger 1,536-dimension vectors.
    d:
      en: |-
        Cohere Embed English v3 targets English text, so questions and documents in other languages would be poorly matched.
references:
  - title: "Supported models and Regions for Amazon Bedrock knowledge bases - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/knowledge-base-supported.html
  - title: "Amazon Titan Text Embeddings models - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/titan-embedding-models.html
