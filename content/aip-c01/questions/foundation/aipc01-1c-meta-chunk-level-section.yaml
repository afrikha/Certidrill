id: aipc01-1c-meta-chunk-level-section
objective: "1.4.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    An insurance company indexes 900-page policy manuals in an Amazon Bedrock knowledge base with fixed-size chunking. Each manual is one PDF in Amazon S3 with a .metadata.json file that holds the manual's product and edition. Claims handlers must filter retrieval results by the manual section number (for example, 4.2) in which a chunk appears. The source PDFs in S3 must not be changed or split.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Add a STRING_LIST attribute with every section number of the manual to its .metadata.json file, and filter with listContains.
    - id: b
      text:
        en: |-
          Switch to hierarchical chunking so that each parent chunk inherits the section number of the heading that it starts with.
    - id: c
      text:
        en: |-
          Set includeForEmbedding to true for the edition attribute, and ask handlers to include the section number in their questions.
    - id: d
      text:
        en: |-
          Add a custom transformation Lambda function at the POST_CHUNKING step that writes a section attribute into the metadata of each chunk.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      File-level metadata applies the same values to every chunk of a document, so it cannot say which section a chunk belongs to. A custom transformation function at the POST_CHUNKING step receives the chunks of each file and can add chunk-level metadata such as the section number; chunk-level values take precedence over file-level values with the same key. The source PDFs stay unchanged.
  options:
    a:
      en: |-
        Every chunk of the manual would carry the full list, so a filter on 4.2 would match all chunks of every manual that has a section 4.2.
    b:
      en: |-
        Hierarchical chunking changes chunk sizes and returns parent chunks; it does not create a section-number attribute.
    c:
      en: |-
        Section numbers in questions only influence similarity, and embedding the edition does not identify sections, so no exact filter is possible.
references:
  - title: "Use a custom transformation Lambda function to define how your data is ingested - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/kb-custom-transformation.html
  - title: "Connect to Amazon S3 for your knowledge base - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/s3-data-source-connector.html
