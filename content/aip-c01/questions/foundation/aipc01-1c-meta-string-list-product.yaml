id: aipc01-1c-meta-string-list-product
objective: "1.4.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A networking vendor's documentation assistant uses an Amazon Bedrock knowledge base with an Amazon OpenSearch Serverless vector store and an S3 data source. Many configuration guides apply to several product lines at once (for example, router, switch, and firewall). The application calls the Retrieve API and must return only guides that apply to the product line that the user selects. The vendor does not want to duplicate documents.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Store the product lines as a comma-separated STRING attribute, such as "router,switch", and pass an equals filter with the selected product line.
    - id: b
      text:
        en: |-
          Store the product lines as a STRING_LIST attribute in each metadata file, and pass a listContains filter with the selected product line in the Retrieve request.
    - id: c
      text:
        en: |-
          Store a NUMBER attribute that encodes the product lines as a bitmask, and pass a greaterThanOrEquals filter with the value of the selected product line.
    - id: d
      text:
        en: |-
          Store the product lines as a STRING attribute, and pass a startsWith filter with the first letters of the selected product line.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      A STRING_LIST attribute holds every product line that a guide applies to, and the listContains operator matches chunks whose list contains the selected value. listContains is available through the API (not the console) and is best supported with OpenSearch Serverless, which this knowledge base uses.
  options:
    a:
      en: |-
        equals compares the whole string, so "router,switch" never equals "router".
    c:
      en: |-
        A range comparison on a bitmask does not test whether one bit is set, so it returns wrong guides.
    d:
      en: |-
        startsWith matches only the first product line written in the string; a guide listed as "switch,router" would be missed for router.
references:
  - title: "Configure and customize queries and response generation - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/kb-test-config.html
  - title: "Ingest documents directly into a knowledge base - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/kb-direct-ingestion-add.html
