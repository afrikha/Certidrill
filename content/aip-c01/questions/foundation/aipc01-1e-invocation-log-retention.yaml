id: aipc01-1e-invocation-log-retention
objective: "1.6.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A financial services company runs an assistant that calls the Amazon Bedrock Converse API with a prompt from Prompt Management. Regulators require the company to keep the full input sent to the model and the full response for every invocation for 7 years. Auditors want to query these records with Amazon Athena. The company already has an AWS CloudTrail trail that delivers management events to Amazon S3.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Add CloudTrail data event selectors for the AWS::Bedrock::Prompt resource type, and query the trail's log files in Amazon S3 with Athena.
    - id: b
      text:
        en: |-
          Turn on AWS X-Ray active tracing in the application, and export the traces to an S3 bucket every day for Athena queries.
    - id: c
      text:
        en: |-
          Save each prompt and response as a new prompt version in Prompt Management, and query the versions through the Amazon Bedrock API.
    - id: d
      text:
        en: |-
          Turn on Amazon Bedrock model invocation logging to an S3 bucket in the same Region, and add an S3 Lifecycle rule that expires the logs after 7 years.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      Model invocation logging is off by default; when turned on, it records the full request, the full response and metadata of Converse and InvokeModel calls. The S3 destination stores gzipped JSON files that Athena can query, and bodies larger than 100 KB are written as separate objects that the log entry references. A Lifecycle rule keeps the logs for the required period and then removes them.
  options:
    a:
      en: |-
        CloudTrail records who called which API with which parameters, such as the model ID; it is not a record of the full prompts and responses, and RenderPrompt data events only show that a managed prompt was rendered.
    b:
      en: |-
        X-Ray traces record request timings and service segments, not the complete model input and output.
    c:
      en: |-
        Prompt versions are snapshots of a prompt template; storing every customer exchange as a version misuses the feature and gives no Athena-queryable audit log.
references:
  - title: "Monitor model invocation using CloudWatch Logs and Amazon S3 - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/model-invocation-logging.html
  - title: "Monitor Amazon Bedrock API calls using CloudTrail - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/logging-using-cloudtrail.html
