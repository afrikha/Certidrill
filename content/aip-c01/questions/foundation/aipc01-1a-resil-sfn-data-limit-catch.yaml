id: aipc01-1a-resil-sfn-data-limit-catch
objective: "1.2.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    An AWS Step Functions workflow calls a model in Amazon Bedrock from a Task state. For graceful degradation, the Task state has one catcher with ErrorEquals set to States.ALL and Next set to a fallback state that sends the request to a human review queue. Most failures reach the fallback. However, when a model response is very large, the execution fails with States.DataLimitExceeded instead of going to the fallback state.

    Which change will send these failures to the fallback state?
body:
  options:
    - id: a
      text:
        en: |-
          Add States.DataLimitExceeded to the ErrorEquals array of the existing catcher, next to States.ALL.
    - id: b
      text:
        en: |-
          Add a catcher with ErrorEquals set to States.DataLimitExceeded and Next set to the fallback state, before the States.ALL catcher.
    - id: c
      text:
        en: |-
          Add a Retry field with ErrorEquals set to States.ALL and MaxAttempts set to 3 so that the model call is attempted again.
    - id: d
      text:
        en: |-
          Set TimeoutSeconds on the Task state so that long model calls fail with States.Timeout, which the existing catcher handles.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      The States.ALL wildcard does not catch States.DataLimitExceeded or States.Runtime; those errors must be named explicitly. States.ALL must also be alone in its ErrorEquals array and in the last catcher, so a separate catcher placed before it routes the error to the fallback state.
  options:
    a:
      en: |-
        States.ALL must appear alone in ErrorEquals, so this definition is invalid.
    c:
      en: |-
        States.ALL does not match States.DataLimitExceeded, and a retry of the same request would return the same oversized response.
    d:
      en: |-
        The failure is caused by the size of the response, not by its duration, so a timeout does not change the error that is raised.
references:
  - title: Handling errors in Step Functions workflows - AWS Step Functions
    url: https://docs.aws.amazon.com/step-functions/latest/dg/concepts-error-handling.html
