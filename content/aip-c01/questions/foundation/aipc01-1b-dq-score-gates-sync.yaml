id: aipc01-1b-dq-score-gates-sync
objective: "1.3.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Every night, an AWS Glue ETL job evaluates a data quality ruleset and loads FAQ records into the S3 data source of an Amazon Bedrock knowledge base. A scheduled Amazon EventBridge rule starts the knowledge base ingestion job at 02:00. The company wants the ingestion job to start only after an evaluation run with a data quality score of 0.9 or higher. When the score is lower, the data team must receive an Amazon SNS notification and the ingestion job must not run. The company wants the LEAST custom code.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Create a CloudWatch alarm on the glue.data.quality.rules.failed metric that notifies the SNS topic, and keep the scheduled rule that starts the ingestion job.
    - id: b
      text:
        en: |-
          Replace the schedule with EventBridge rules on Data Quality Evaluation Results Available events: one for scores of 0.9 or more that starts the ingestion job, one for lower scores that targets SNS.
    - id: c
      text:
        en: |-
          Set the ETL job's ruleset failure action to fail the job after loading data to the target, and keep the scheduled rule that starts the ingestion job.
    - id: d
      text:
        en: |-
          Clear the Publish metrics to Amazon CloudWatch option, write the results to Amazon S3, and run a Lambda function every 5 minutes that reads the score and starts the ingestion job.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      AWS Glue Data Quality emits a Data Quality Evaluation Results Available event (source aws.glue-dataquality) with the run's score when an evaluation completes, and an event pattern can filter on the score with a numeric comparison. One rule can start the ingestion job, for example through a Lambda function or a Step Functions state machine, and the other can notify SNS, so the sync depends on the score instead of the clock.
  options:
    a:
      en: |-
        The alarm notifies the team, but the scheduled rule still starts the ingestion job at 02:00 whatever the score is.
    c:
      en: |-
        Failing the job does not stop the separate schedule, which still starts the ingestion job, and the requirement is based on a score threshold, not on any rule failure.
    d:
      en: |-
        The Publish metrics to Amazon CloudWatch option must stay selected for EventBridge events to be published, and polling S3 from a scheduled Lambda function is custom code that the event already replaces.
references:
  - title: Setting up alerts, deployments, and scheduling - AWS Glue
    url: https://docs.aws.amazon.com/glue/latest/dg/data-quality-alerts.html
