id: aipc01-4b-post-sync-visibility
objective: "4.3.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A release pipeline adds documents to the Amazon S3 data source of an Amazon Bedrock knowledge base that stores its vectors in Amazon OpenSearch Serverless. The pipeline starts an ingestion job, waits until GetIngestionJob returns the COMPLETE status with no failed documents, and immediately runs validation queries for the new documents. The validation step fails intermittently because some new documents are not returned, although the same queries succeed a few minutes later.

    What should the team do?
body:
  options:
    - id: a
      text:
        en: |-
          Run a second ingestion job right after the first one completes, because the first sync of new documents only creates their embeddings.
    - id: b
      text:
        en: |-
          Add a delay with retries before the validation queries, because newly synced embeddings can take a few minutes to appear in this vector store.
    - id: c
      text:
        en: |-
          Switch the data source to direct ingestion with IngestKnowledgeBaseDocuments, because documents ingested directly are searchable as soon as the call returns.
    - id: d
      text:
        en: |-
          Increase the numberOfResults value of the validation queries, because new documents are ranked below older documents until the index is rebuilt.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      For vector stores other than Amazon Aurora, Amazon Bedrock notes that the embeddings of newly synced data can take a few minutes to be reflected in the knowledge base. A completed ingestion job therefore does not guarantee immediate searchability, so the validation step should wait and retry before it fails the release.
  options:
    a:
      en: |-
        A completed sync already parses, chunks, embeds, and indexes the documents; a second job reprocesses nothing new and does not remove the delay.
    c:
      en: |-
        Direct ingestion also indexes into the same vector store, and for an S3 data source its changes must be mirrored in the bucket; it does not remove the visibility delay.
    d:
      en: |-
        The documents are missing from the results, not ranked lower, and they appear without any rebuild once the store reflects them.
references:
  - title: "Sync your data with your Amazon Bedrock knowledge base - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/kb-data-source-sync-ingest.html
