id: aipc01-4b-invocation-logging-facts
objective: "4.3.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company plans detailed request and response analysis for its Amazon Bedrock applications by using model invocation logging.

    Which statements about model invocation logging are correct? (Choose two.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Each log record includes the identity.arn of the caller, which Amazon Bedrock captures automatically.
    - id: b
      text:
        en: |-
          Model invocation logging is enabled by default for the Converse and InvokeModel APIs and only needs a destination.
    - id: c
      text:
        en: |-
          Amazon Bedrock fills the requestMetadata field of each record with the application name and the session ID.
    - id: d
      text:
        en: |-
          Each log record includes the input and output token counts in addition to the request and response bodies.
    - id: e
      text:
        en: |-
          The configuration can deliver the logs to a CloudWatch Logs log group in another AWS Region for central analysis.
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: |-
      Every invocation log record contains fields such as modelId, operation, the caller's identity.arn, and input and output objects with their bodies and token counts. Amazon Bedrock populates all fields automatically except requestMetadata, which the caller supplies.
  options:
    b:
      en: |-
        Model invocation logging is disabled by default and must be configured per account and Region.
    c:
      en: |-
        requestMetadata is the only field supplied by the caller; it appears only when the application passes it in the request.
    e:
      en: |-
        Only destinations in the same account and Region as the logging configuration are supported.
references:
  - title: "Monitor model invocation using CloudWatch Logs and Amazon S3 - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/model-invocation-logging.html
