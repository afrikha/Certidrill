id: aipc01-4a-distill-claims-classifier
objective: "4.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An insurance company classifies millions of claim notes each month and extracts five fields from each note in near real time. A large model on Amazon Bedrock reaches the required accuracy but is expensive and slow at this volume. A smaller model that Amazon Bedrock supports as a distillation student is 15 points less accurate. The company has months of the large model's invocation logs for this task and wants accuracy close to the large model at a much lower cost per request.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Run continued pre-training of the smaller model on the raw, unlabeled claim notes so that it learns the vocabulary of the insurance domain.
    - id: b
      text:
        en: |-
          Keep the large model, and add a prompt caching checkpoint after the long classification instructions to lower the input cost of each request.
    - id: c
      text:
        en: |-
          Keep the large model, and send the requests with the Flex service tier so that each request is billed at the discounted Flex price.
    - id: d
      text:
        en: |-
          Run an Amazon Bedrock distillation job with the large model as teacher and the smaller model as student, using the invocation logs as data.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      Model distillation transfers knowledge from a larger teacher model to a smaller, faster, more cost-efficient student for a specific use case. Bedrock can use the teacher's existing responses from invocation logs, so the student is fine-tuned on the exact task, and requests then run at the student model's cost and speed.
  options:
    a:
      en: |-
        Continued pre-training on unlabeled text adapts a model to domain vocabulary; it does not teach the classification and extraction task.
    b:
      en: |-
        Prompt caching lowers the cost of the repeated input prefix, but every request still pays the large model's output price and latency.
    c:
      en: |-
        The Flex tier is discounted but expects longer processing times, which conflicts with near-real-time classification, and the large model stays slow.
references:
  - title: "Customize a model with distillation in Amazon Bedrock - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/model-distillation.html
  - title: "Service tiers for optimizing performance and cost - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/service-tiers-inference.html
