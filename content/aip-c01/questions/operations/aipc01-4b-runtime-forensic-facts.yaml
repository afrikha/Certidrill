id: aipc01-4b-runtime-forensic-facts
objective: "4.3.3"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    A security team prepares forensic procedures for agents hosted on Amazon Bedrock AgentCore Runtime. It must know what the observability data that the runtime produces does and does not contain.

    Which statements are correct? (Choose two.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          The runtime application log records include the request payload, but they do not include the agent's response.
    - id: b
      text:
        en: |-
          Runtime spans are kept only in AWS X-Ray and cannot be queried from a CloudWatch Logs log group.
    - id: c
      text:
        en: |-
          The runtime resource usage metrics are published in real time, without any delay, so they can serve as billing records.
    - id: d
      text:
        en: |-
          The spans of InvokeAgentRuntime requests carry the session ID and, for failed requests, an error type of throttle, system, or user.
    - id: e
      text:
        en: |-
          The Session Count metric is a real-time gauge of the sessions that are active on the runtime at each moment.
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: |-
      AgentCore Runtime application logs contain fields such as trace_id, span_id, session_id, and request_payload, but the runtime does not capture the agent response, so there is no response_payload field. Runtime spans include attributes such as session.id, latency_ms, and an error_type of throttle, system, or user when a request fails, which supports reconstructing what happened in a session.
  options:
    b:
      en: |-
        Runtime spans are written to the agent's log group or to the aws/spans log group, so they can be queried in CloudWatch Logs.
    c:
      en: |-
        Resource usage data can be delayed by up to 60 minutes, and AWS states that billing is calculated from metered usage that may differ from this telemetry.
    e:
      en: |-
        Session Count is a cumulative count of new sessions; ActiveSessionCount is the gauge of active sessions.
references:
  - title: "AgentCore generated runtime observability data - Amazon Bedrock AgentCore"
    url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/observability-runtime-metrics.html
