id: aipc01-4a-query-decomposition
objective: "4.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An electronics company's support assistant uses an Amazon Bedrock knowledge base. Questions such as "Compare the warranty terms of the X200 and the X300 for customers in Canada" return chunks about only one of the two products, and the answers are incomplete. Questions about a single product work well. The company wants better retrieval for these multi-part questions without changing how documents are ingested.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Set the query transformation type to QUERY_DECOMPOSITION so that the question is split into smaller sub-queries.
    - id: b
      text:
        en: |-
          Set overrideSearchType to HYBRID so that both product names are matched as keywords within the same query.
    - id: c
      text:
        en: |-
          Apply a reranker model to the retrieved chunks so that the most relevant chunks appear first in the prompt.
    - id: d
      text:
        en: |-
          Add an equals metadata filter on the product attribute with the value X200 to every query sent to the knowledge base.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      Query decomposition breaks a complex question into smaller sub-queries that each run against the knowledge base, so chunks for both products are retrieved. It changes only the query configuration, not ingestion.
  options:
    b:
      en: |-
        Hybrid search adds keyword matching, but one query still returns its top-ranked chunks, which can all concern the same product.
    c:
      en: |-
        A reranker reorders the chunks already retrieved; it cannot add the missing product's chunks.
    d:
      en: |-
        A fixed filter on one product excludes the other product's chunks entirely.
references:
  - title: "Configure and customize queries and response generation - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/kb-test-config.html
