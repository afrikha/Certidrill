id: aipc01-4b-trace-stage-latency
objective: "4.3.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A RAG application runs in containers on Amazon ECS. For each question, it retrieves passages from an Amazon Bedrock knowledge base, checks the answer with the ApplyGuardrail API, calls a model, and saves the conversation in Amazon DynamoDB. The p90 response time has risen from 4 seconds to 9 seconds, but the InvocationLatency metric of the model has not changed. The team needs to see how long each step took for individual slow requests.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Enable model invocation logging, and compare the timestamps of the slow requests with the InvocationLatency values of the same period.
    - id: b
      text:
        en: |-
          Build a CloudWatch dashboard with the latency metrics of each service involved, and compare their average values over the same period.
    - id: c
      text:
        en: |-
          Instrument the application with AWS Distro for OpenTelemetry, enable CloudWatch Transaction Search, and inspect the spans of the slow requests.
    - id: d
      text:
        en: |-
          Enable CloudTrail data events for the knowledge base and the guardrail, and compare the event times of the calls that each request made.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      Distributed tracing records a span for each step of a request, so the trace of a slow request shows the time spent in retrieval, the guardrail, the model, and DynamoDB. With Transaction Search, spans are ingested into CloudWatch and can be searched by attribute to find and inspect the slow requests.
  options:
    a:
      en: |-
        Invocation logs cover only the model calls, which are not the slow step here; they do not time retrieval, the guardrail, or the database write.
    b:
      en: |-
        Averages per service hide what happened in individual requests and cannot show where one slow request spent its time.
    d:
      en: |-
        CloudTrail events record that calls happened, not how long each step took, and they miss the model and DynamoDB steps of the same request.
references:
  - title: "Transaction Search - Amazon CloudWatch"
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/CloudWatch-Transaction-Search.html
