id: aipc01-4b-nextgen-radial-compression
objective: "4.3.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company migrated its product-matching index from a Classic to a NextGen vector search collection in Amazon OpenSearch Serverless and kept the default index settings. Its duplicate-detection job uses radial search to return every product whose vector lies within a distance threshold of a new listing. Since the migration, these radial searches fail, while ordinary k-NN queries work.

    What should the team do?
body:
  options:
    - id: a
      text:
        en: |-
          Re-create the index in the NextGen collection with a compression level lower than 32x, and reindex the product vectors into it.
    - id: b
      text:
        en: |-
          Disable GPU acceleration on the index by setting index.knn.remote_index_build.enabled to false, and rerun the duplicate-detection job.
    - id: c
      text:
        en: |-
          Add the _source parameter set to true to the radial queries so that the response includes the original product vectors.
    - id: d
      text:
        en: |-
          Contact AWS Support to raise the account's maximum OCUs so that the collection has the capacity that radial search requires.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      NextGen vector collections create every index with 32x compression by default, and radial search isn't supported on NextGen indexes that use 32x compression. Creating the index with another supported compression level (1x, 2x, 8x, or 16x) and reindexing restores radial search.
  options:
    b:
      en: |-
        GPU acceleration only speeds up index builds; it does not affect which query types are supported.
    c:
      en: |-
        Returning the vectors changes the response content, not whether radial search is supported on the index.
    d:
      en: |-
        The failure comes from an unsupported query type for the index configuration, not from a lack of capacity.
references:
  - title: "Working with vector search collections - Amazon OpenSearch Service"
    url: https://docs.aws.amazon.com/opensearch-service/latest/developerguide/serverless-vector-search.html
