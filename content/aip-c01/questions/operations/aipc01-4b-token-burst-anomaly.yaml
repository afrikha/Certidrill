id: aipc01-4b-token-burst-anomaly
objective: "4.3.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company's AI agents have run on Amazon Bedrock in production for three months, and their token usage follows a strong daily and weekly pattern. Last week, a looping agent produced a burst of output tokens that went unnoticed for 18 hours. A fixed threshold low enough to catch that burst would also fire at the normal weekday peak. The company wants to be notified within minutes of abnormal output token bursts.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Create a CloudWatch alarm based on an anomaly detection model of the OutputTokenCount metric that fires when the value goes above the expected band.
    - id: b
      text:
        en: |-
          Create an AWS Cost Anomaly Detection monitor for Amazon Bedrock with an alert subscription that publishes each anomaly to an Amazon SNS topic.
    - id: c
      text:
        en: |-
          Create a CloudWatch alarm with a static threshold on the OutputTokenCount metric that is set to twice the usual weekday peak value.
    - id: d
      text:
        en: |-
          Schedule a daily CloudWatch Logs Insights query on the invocation logs that compares the output tokens of each agent with the previous day.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      CloudWatch anomaly detection learns the normal behavior of a metric, including hourly, daily, and weekly patterns, from up to two weeks of data, and an alarm can fire when the value goes above the expected band. It catches abnormal bursts within the alarm evaluation period without a fixed threshold that the weekday peak would cross.
  options:
    b:
      en: |-
        Cost Anomaly Detection runs about three times a day on cost data that can be up to 24 hours late, so it cannot notify within minutes.
    c:
      en: |-
        A threshold at twice the peak would miss bursts that are abnormal for the time of day but lower than the weekday peak, such as the one at night.
    d:
      en: |-
        A daily query detects the burst up to a day later, which does not meet the requirement of minutes.
references:
  - title: "Using CloudWatch anomaly detection - Amazon CloudWatch"
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/CloudWatch_Anomaly_Detection.html
  - title: "Detecting unusual spend with AWS Cost Anomaly Detection - AWS Cost Management"
    url: https://docs.aws.amazon.com/cost-management/latest/userguide/manage-ad.html
