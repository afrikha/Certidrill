id: aipc01-4b-aoss-ocu-ceiling
objective: "4.3.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company's RAG platform queries a Classic vector search collection in Amazon OpenSearch Serverless that holds hundreds of millions of high-dimension vectors. During the daily peak, the SearchOCU metric stays flat at 200 while SearchRequestLatency rises steeply. The account's maximum search capacity is 200 OCUs, and the vectors already use a compressed representation.

    What should the company do to restore search latency at peak?
body:
  options:
    - id: a
      text:
        en: |-
          Reindex the collection into a new index with more primary shards so that the search load is spread across more compute units.
    - id: b
      text:
        en: |-
          Re-create the index with the Lucene engine and the IVF algorithm so that each query needs fewer compute units.
    - id: c
      text:
        en: |-
          Contact AWS Support to raise the maximum number of OCUs for the account so that the collection can scale beyond 200 OCUs.
    - id: d
      text:
        en: |-
          Enable GPU acceleration on the collection so that the vector index uses GPUs to answer queries during the peak.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      Classic vector search collections scale automatically without reindexing, but when millions of high-dimension vectors need more than 200 OCUs, AWS Support must raise the account's maximum OCUs. The flat SearchOCU metric at the maximum shows that the collection cannot scale further on its own.
  options:
    a:
      en: |-
        Auto scaling in vector search collections does not require reindexing, and more shards do not lift the account's OCU ceiling.
    b:
      en: |-
        Vector search collections do not support the Lucene engine and support only HNSW with Faiss, so IVF is not available.
    d:
      en: |-
        GPU acceleration speeds up vector index builds in NextGen collections; it does not raise the search capacity of a Classic collection.
references:
  - title: "Working with vector search collections - Amazon OpenSearch Service"
    url: https://docs.aws.amazon.com/opensearch-service/latest/developerguide/serverless-vector-search.html
  - title: "Monitoring OpenSearch Serverless with Amazon CloudWatch - Amazon OpenSearch Service"
    url: https://docs.aws.amazon.com/opensearch-service/latest/developerguide/monitoring-cloudwatch.html
