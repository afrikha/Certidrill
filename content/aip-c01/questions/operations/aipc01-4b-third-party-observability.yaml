id: aipc01-4b-third-party-observability
objective: "4.3.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company has standardized on a third-party observability platform that receives OpenTelemetry data through its own exporter. The company now deploys agents that call many tools on Amazon Bedrock AgentCore Runtime and wants their model and tool call spans to go to that platform instead of the default AgentCore observability configuration.

    What should the company do when it deploys the agents?
body:
  options:
    - id: a
      text:
        en: |-
          Set the DISABLE_ADOT_OBSERVABILITY environment variable to true on the runtime, and configure the platform's OpenTelemetry exporter in the agent.
    - id: b
      text:
        en: |-
          Keep the default configuration, and create a CloudWatch Logs subscription filter that forwards the aws/spans log group to the platform.
    - id: c
      text:
        en: |-
          Disable CloudWatch Transaction Search in the account so that AgentCore Runtime sends the spans to the platform's endpoint.
    - id: d
      text:
        en: |-
          Set the AGENT_OBSERVABILITY_ENABLED environment variable to false, and grant the platform read access to the runtime log group.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      To integrate agents hosted in AgentCore Runtime with other observability platforms, AWS documents setting DISABLE_ADOT_OBSERVABILITY to true, which unsets the default ADOT environment variables. The agent's own OpenTelemetry instrumentation can then export spans to the chosen platform.
  options:
    b:
      en: |-
        Forwarding logs after the fact keeps the default pipeline and adds a copy path instead of sending the spans directly to the platform.
    c:
      en: |-
        Transaction Search is an account-level CloudWatch setting; turning it off does not redirect agent telemetry anywhere.
    d:
      en: |-
        AGENT_OBSERVABILITY_ENABLED is part of the configuration for agents hosted outside the runtime, and read access to a log group does not send spans to the platform.
references:
  - title: "Add observability to your Amazon Bedrock AgentCore resources - Amazon Bedrock AgentCore"
    url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/observability-configure.html
