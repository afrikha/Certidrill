id: aipc01-4a-ab-prompt-appconfig
objective: "4.2.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company wants to test a new version of its assistant's prompt, stored as a version in Amazon Bedrock Prompt Management, against the current version. Ten percent of users must receive the new version, each user must always receive the same version, and the team must be able to change the percentage or stop the test without redeploying the application.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Create an Amazon CloudWatch Evidently experiment with two variations, and read the assigned variation in the application.
    - id: b
      text:
        en: |-
          Publish two AWS Lambda versions with different prompt ARNs, and route 10% of invocations to the new one with a weighted alias.
    - id: c
      text:
        en: |-
          Pick the prompt version in the application with a random number for each request, and adjust the percentage in the code.
    - id: d
      text:
        en: |-
          Create an AWS AppConfig multi-variant feature flag whose variant for the new prompt uses a split rule on the user ID at 10%.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      A split rule evaluates to true for a percentage of traffic based on a consistent hash of a context value, so passing the user ID keeps each user in the same variant. The variant can return the ARN of the prompt version, and the percentage or the flag itself can be changed in AppConfig without a deployment.
  options:
    a:
      en: |-
        CloudWatch Evidently is no longer available; AWS recommends AppConfig feature flags instead.
    b:
      en: |-
        A weighted alias splits invocations, not users, so the same user can receive both versions, and changing the prompt requires a deployment.
    c:
      en: |-
        A random choice per request does not keep each user in one group, and changing the percentage requires a deployment.
references:
  - title: "Understanding multi-variant feature flag rules - AWS AppConfig"
    url: https://docs.aws.amazon.com/appconfig/latest/userguide/appconfig-creating-multi-variant-feature-flags-rules.html
  - title: "Creating multi-variant feature flags - AWS AppConfig"
    url: https://docs.aws.amazon.com/appconfig/latest/userguide/appconfig-creating-multi-variant-feature-flags.html
