id: aipc01-4a-batch-weekly-descriptions
objective: "4.1.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A retailer regenerates marketing descriptions for 400,000 products every weekend with an Amazon Bedrock model. No user waits for the results, which must be ready by Monday. The current script calls the model on demand in a loop and is frequently throttled. The company wants the lowest inference cost.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Write the prompts to JSONL files in Amazon S3, and run an Amazon Bedrock batch inference job that writes the descriptions to S3.
    - id: b
      text:
        en: |-
          Purchase Provisioned Throughput with a 1-month commitment for the model, and run the weekend script against the provisioned model.
    - id: c
      text:
        en: |-
          Send the requests with the Priority service tier so that they are processed before other on-demand requests.
    - id: d
      text:
        en: |-
          Run the script on more Amazon EC2 instances in parallel so that the 400,000 requests finish sooner.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      Batch inference processes large sets of prompts asynchronously from files in Amazon S3 and writes the responses to S3, and AWS prices batch inference lower than on-demand inference for supported models. Bedrock manages the job, so the script no longer handles throttling or retries.
  options:
    b:
      en: |-
        Provisioned Throughput is billed every hour of the month, while the model is used only on weekends, so most of the paid capacity sits idle.
    c:
      en: |-
        Priority is priced at a premium over Standard and targets latency-critical interactive traffic, not offline jobs.
    d:
      en: |-
        More parallel clients increase throttling against the same on-demand quota and do not lower the price per token.
references:
  - title: "Process multiple prompts with batch inference - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/batch-inference.html
