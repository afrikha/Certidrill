id: aipc01-4b-draft-guardrail-usage
objective: "4.3.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A bank's applications check every prompt and answer with the Amazon Bedrock ApplyGuardrail API. Its compliance policy states that production traffic may use only numbered guardrail versions approved by the risk team, never the working draft. The compliance team wants to be alerted within minutes whenever any application calls a guardrail in its DRAFT version.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Enable model invocation logging, and run a daily Logs Insights query that searches the records for the word DRAFT.
    - id: b
      text:
        en: |-
          Create an AWS Config rule that checks every day that each guardrail in the account has at least one numbered version.
    - id: c
      text:
        en: |-
          Create a CloudWatch alarm on the InvocationsIntervened metric for the ContentPolicy value of the GuardrailPolicyType dimension.
    - id: d
      text:
        en: |-
          Create a CloudWatch alarm on the Invocations metric in AWS/Bedrock/Guardrails with the GuardrailVersion dimension set to DRAFT.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      Guardrail runtime metrics in the AWS/Bedrock/Guardrails namespace carry the GuardrailArn and GuardrailVersion dimensions, whose values are a version number or DRAFT. An alarm on Invocations for the DRAFT version fires within minutes of any ApplyGuardrail call that uses the working draft.
  options:
    a:
      en: |-
        ApplyGuardrail calls are not model invocations, and a daily query does not alert within minutes.
    b:
      en: |-
        Having numbered versions does not prove that applications use them; the rule cannot see which version is called.
    c:
      en: |-
        Interventions by content filters say nothing about which guardrail version was called, and calls without interventions would be missed.
references:
  - title: "Monitor Amazon Bedrock Guardrails using CloudWatch metrics - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/monitoring-guardrails-cw-metrics.html
