id: aipc01-4b-gateway-metrics-dashboard
objective: "4.3.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An operations team uses the CloudWatch generative AI observability page to watch its Amazon Bedrock models and AgentCore agents. The team also wants to see the invocation counts, errors, and latency of its Amazon Bedrock AgentCore Gateway next to these views, but it cannot find gateway data on that page.

    What should the team do?
body:
  options:
    - id: a
      text:
        en: |-
          Enable CloudWatch Transaction Search in the account so that the gateway metrics are added to the generative AI observability page.
    - id: b
      text:
        en: |-
          Enable model invocation logging so that each tool call that passes through the gateway is added to the Model Invocations view.
    - id: c
      text:
        en: |-
          Add the AWS Distro for OpenTelemetry to the gateway configuration so that the gateway emits its spans to the agents view.
    - id: d
      text:
        en: |-
          Build a CloudWatch dashboard with the gateway metrics from the AWS/Bedrock-AgentCore namespace, next to the other widgets.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      AgentCore Gateway publishes its metrics, such as Invocations, errors, Latency, and Duration, in the AWS/Bedrock-AgentCore namespace in one-minute batches, but these metrics are not available on the CloudWatch generative AI observability page. A CloudWatch dashboard that includes them, with alarms if needed, gives the team the combined view.
  options:
    a:
      en: |-
        Transaction Search enables spans and traces; it does not add gateway metrics to the generative AI observability page.
    b:
      en: |-
        Invocation logging records model invocations on the Bedrock runtime, not the requests that pass through the gateway.
    c:
      en: |-
        The gateway is a managed service; ADOT is added to agent code, and doing so would not place gateway metrics on that page.
references:
  - title: "AgentCore generated gateway observability data - Amazon Bedrock AgentCore"
    url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/observability-gateway-metrics.html
