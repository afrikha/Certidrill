id: aipc01-4b-pt-mu-sizing
objective: "4.2.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company runs an interactive assistant on an Amazon Bedrock base model with on-demand inference. Traffic is steady during business hours, and the company now plans to purchase Provisioned Throughput with a one-month commitment so that the assistant is not throttled at its daily peak. The team must decide how many model units (MUs) to purchase.

    Which data should the team use to size the purchase?
body:
  options:
    - id: a
      text:
        en: |-
          The peak number of requests per minute from the Invocations metric, because each model unit serves a fixed number of requests per minute.
    - id: b
      text:
        en: |-
          The peak input and output tokens per minute from the token count metrics, because each model unit processes a set number of tokens per minute.
    - id: c
      text:
        en: |-
          The average daily InputTokenCount divided by 1,440 minutes, because Provisioned Throughput is billed for each full day of the commitment.
    - id: d
      text:
        en: |-
          The p99 InvocationLatency of the model at peak, because each model unit guarantees a maximum latency for every request that it serves.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      A model unit delivers a specific throughput for a model, defined as the number of input tokens it can process and the number of output tokens it can generate across all requests in one minute. Sizing therefore starts from the measured input and output tokens per minute at peak, for example the per-minute Sum of InputTokenCount and OutputTokenCount.
  options:
    a:
      en: |-
        Model units are defined in tokens per minute, and requests vary widely in size, so a request count does not size the capacity.
    c:
      en: |-
        Provisioned Throughput is billed hourly, and a daily average hides the peak that the assistant must absorb without throttling.
    d:
      en: |-
        A model unit is defined by token throughput, not by a latency guarantee.
references:
  - title: "Increase model invocation capacity with Provisioned Throughput in Amazon Bedrock - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/prov-throughput.html
  - title: "Monitor bedrock-runtime inference using CloudWatch metrics - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/monitoring-runtime-metrics.html
