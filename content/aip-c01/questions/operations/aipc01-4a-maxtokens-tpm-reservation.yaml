id: aipc01-4a-maxtokens-tpm-reservation
objective: "4.2.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company's summarization service on Amazon Bedrock is throttled at its tokens-per-minute quota during peaks, although the InputTokenCount and OutputTokenCount metrics show that the actual tokens per minute stay well below the quota. Requests use about 3,000 input tokens and produce about 600 output tokens, with maxTokens set to 32,000. The model's output burndown rate is 1:1. The company wants more concurrent requests without a quota increase.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Set maxTokens close to the typical completion length, for example 1,000, so that each request reserves fewer tokens when it starts.
    - id: b
      text:
        en: |-
          Switch from the Converse API to the InvokeModel API so that the model's native request format consumes fewer quota tokens.
    - id: c
      text:
        en: |-
          Configure the SDK adaptive retry mode so that throttled requests are retried automatically after a client-side delay.
    - id: d
      text:
        en: |-
          Enable model invocation logging so that unused output tokens are returned to the quota sooner.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      When a request starts, Bedrock deducts the input tokens plus max_tokens from the TPM quota and returns the unused part only when the request ends. With 32,000 tokens reserved per request, a few concurrent requests exhaust the quota even though each uses about 3,600 tokens; a maxTokens close to real outputs lets many more requests run at once.
  options:
    b:
      en: |-
        The quota is consumed the same way through both APIs; the request format does not change the reservation.
    c:
      en: |-
        Retries add delay and load but keep the oversized reservation, so throttling continues.
    d:
      en: |-
        Invocation logging records requests; it does not change how the quota is consumed.
references:
  - title: "How tokens are counted in Amazon Bedrock - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/quotas-token-burndown.html
