id: aipc01-4a-appconfig-split-order
objective: "4.2.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A team runs an A/B/C test of three model configurations with an AWS AppConfig multi-variant feature flag. Variant A has the rule (split by::$userId pct::20), variant B has the rule (split by::$userId pct::20), and the default variant C has no rule. No seed is set. The team expected 20% of users on A, 20% on B and 60% on C, but no user receives variant B.

    Which change will produce the expected distribution?
body:
  options:
    - id: a
      text:
        en: |-
          Move variant B above variant A in the flag so that variant B is evaluated first.
    - id: b
      text:
        en: |-
          Change the rule of variant B to (split by::$userId pct::40).
    - id: c
      text:
        en: |-
          Add the same seed property value to the split rules of variants A and B in the flag.
    - id: d
      text:
        en: |-
          Add the rule (split by::$userId pct::60) to the default variant C.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      Variants are evaluated in order, and without a seed both rules hash the same user ID in the same way within the flag, so every user who matches B's 20% has already matched A. A 40% split for B matches A's 20% plus another 20% of users, and those additional users fall to B.
  options:
    a:
      en: |-
        Reordering lets B take the 20% and leaves A with none.
    c:
      en: |-
        The same seed keeps the two splits correlated, so B still matches only users whom A has already taken.
    d:
      en: |-
        The default variant receives every user who matches no rule; a rule on C does not make B match more users.
references:
  - title: "Understanding multi-variant feature flag rules - AWS AppConfig"
    url: https://docs.aws.amazon.com/appconfig/latest/userguide/appconfig-creating-multi-variant-feature-flags-rules.html
