id: aipc01-4a-temperature-extraction
objective: "4.2.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A logistics company extracts shipment fields from emails with an Amazon Bedrock model, using a temperature of 0.9. When the same email is processed twice, the extracted values and their wording sometimes differ. The company wants the most consistent output for this extraction task.

    Which change will meet this requirement?
body:
  options:
    - id: a
      text:
        en: |-
          Lower the temperature to a value close to 0 so that the model favors the most probable tokens.
    - id: b
      text:
        en: |-
          Raise topP to 1 so that the model considers the whole probability distribution for each token.
    - id: c
      text:
        en: |-
          Raise maxTokens so that the model has enough room to write every field the same way each time.
    - id: d
      text:
        en: |-
          Raise top_k so that the model considers more candidate tokens at each generation step.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      A lower temperature makes higher-probability tokens more likely, which produces more deterministic responses, the setting that suits extraction and classification tasks.
  options:
    b:
      en: |-
        A higher topP lets lower-probability tokens be selected, which adds variation instead of removing it.
    c:
      en: |-
        maxTokens limits the length of the output; it does not affect which tokens are selected.
    d:
      en: |-
        A higher top_k allows less likely tokens, which increases variation.
references:
  - title: "Influence response generation with inference parameters - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/inference-parameters.html
