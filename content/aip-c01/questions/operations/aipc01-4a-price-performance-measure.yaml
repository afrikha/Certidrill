id: aipc01-4a-price-performance-measure
objective: "4.1.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A media company must choose one of three Amazon Bedrock models for a new article-summarization feature. It has 500 representative articles with reference summaries. Before launch, it wants a repeatable comparison of summary quality and of the inference cost per summary for each model, with the LEAST effort.

    Which combination of steps will meet these requirements? (Choose two.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Compare the three models in the console playground on ten articles, and record the reviewers' preferences in a spreadsheet.
    - id: b
      text:
        en: |-
          Run an Amazon Bedrock evaluation job that uses an LLM as a judge for each model on a custom prompt dataset built from the 500 articles.
    - id: c
      text:
        en: |-
          Read the EstimatedTPMQuotaUsage metric of each model during the tests, and multiply it by the token price to get the cost of each summary.
    - id: d
      text:
        en: |-
          Create an intelligent prompt router with the three models so that Amazon Bedrock selects the most cost-effective model automatically.
    - id: e
      text:
        en: |-
          Record the input and output token counts of each model on the same articles, and multiply them by the model's input and output prices.
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: |-
      LLM-as-a-judge evaluation jobs score each model's responses on a custom prompt dataset and explain each score, which gives a repeatable quality measure on the company's own data. The cost per summary comes from the billed input and output tokens multiplied by each model's prices, so quality and cost can be compared as a price-to-performance ratio.
  options:
    a:
      en: |-
        Ten articles judged by hand are neither representative of the 500-article dataset nor repeatable.
    c:
      en: |-
        EstimatedTPMQuotaUsage approximates quota consumption, which can include an output burndown multiplier; billing is based on actual tokens, so it is not a cost measure.
    d:
      en: |-
        A prompt router works with two models of one family and routes live traffic; it does not produce a comparison of three candidates.
references:
  - title: "Evaluate the performance of Amazon Bedrock resources - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/evaluation.html
  - title: "How tokens are counted in Amazon Bedrock - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/quotas-token-burndown.html
