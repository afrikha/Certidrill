id: aipc01-4b-bedrock-cost-anomaly
objective: "4.3.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company's finance team wants to be alerted when spending on Amazon Bedrock deviates from its usual pattern in any of the company's member accounts, including charges for third-party foundation models. Each alert must show the most likely root causes, such as the account, Region, and usage type. Detection within a day is acceptable, and the team does not want to maintain thresholds.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Create CloudWatch alarms with static thresholds on the InputTokenCount and OutputTokenCount metrics in each member account.
    - id: b
      text:
        en: |-
          Enable model invocation logging in each member account, and run a daily Amazon Athena query that compares token totals with the previous week.
    - id: c
      text:
        en: |-
          Create an AWS Cost Anomaly Detection monitor for AWS services, and add an alert subscription that publishes to an Amazon SNS topic.
    - id: d
      text:
        en: |-
          Create a CloudWatch alarm based on an anomaly detection model of the Invocations metric of each model in each member account.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      Cost Anomaly Detection uses machine learning on cost data, so no thresholds are needed, and it ranks root causes by service, account, Region, and usage type. It also covers third-party foundation models on Amazon Bedrock, unlike other AWS Marketplace charges, and it alerts through email or Amazon SNS.
  options:
    a:
      en: |-
        Static thresholds must be maintained per account and do not identify root causes of spending changes.
    b:
      en: |-
        A custom daily query needs code and maintenance, and token totals do not give the cost and root-cause ranking that the team wants.
    d:
      en: |-
        Invocation counts do not reflect spending, which also depends on token volume and model prices, and they give no root-cause ranking.
references:
  - title: "Detecting unusual spend with AWS Cost Anomaly Detection - AWS Cost Management"
    url: https://docs.aws.amazon.com/cost-management/latest/userguide/manage-ad.html
