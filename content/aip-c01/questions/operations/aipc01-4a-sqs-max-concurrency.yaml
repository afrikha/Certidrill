id: aipc01-4a-sqs-max-concurrency
objective: "4.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A legal firm uploads scanned contracts to Amazon S3 throughout the day in unpredictable bursts of up to 20,000 files. An S3 event invokes an AWS Lambda function for each file, and the function calls an Amazon Bedrock model to summarize the contract. During bursts, thousands of function instances run at once and most model calls are throttled. At a steady rate, the model quota can process a full burst in about 15 minutes. Each summary must be available within 30 minutes of upload.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Collect the files of each burst, submit them as an Amazon Bedrock batch inference job, and read the generated summaries from Amazon S3.
    - id: b
      text:
        en: |-
          Send the S3 events to an Amazon SQS queue that invokes the function, and set the mapping's maximum concurrency to what the quota sustains.
    - id: c
      text:
        en: |-
          Increase the memory and the timeout of the Lambda function so that each invocation can wait longer for the model to respond to its request.
    - id: d
      text:
        en: |-
          Process the files with an AWS Step Functions Distributed Map state that starts one model call per file without a concurrency limit.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      The queue absorbs each burst, and maximum concurrency on the SQS event source mapping limits how many function instances, and therefore model calls, run at once. Calls stay within the quota, and the backlog drains in about 15 minutes, within the 30-minute requirement.
  options:
    a:
      en: |-
        Batch inference is asynchronous, with job timeouts measured in hours (24 to 168), so it cannot guarantee a 30-minute bound for each document.
    c:
      en: |-
        More memory and a longer timeout do not reduce the number of concurrent calls, so throttling continues.
    d:
      en: |-
        Unlimited concurrency reproduces the burst of model calls and the throttling.
references:
  - title: "Configuring scaling behavior for SQS event source mappings - AWS Lambda"
    url: https://docs.aws.amazon.com/lambda/latest/dg/services-sqs-scaling.html
  - title: "CreateModelInvocationJob - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/APIReference/API_CreateModelInvocationJob.html
