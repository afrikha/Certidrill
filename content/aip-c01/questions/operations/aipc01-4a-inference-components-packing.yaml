id: aipc01-4a-inference-components-packing
objective: "4.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company hosts five fine-tuned open-weight models for internal teams on Amazon SageMaker AI. Each model runs on its own real-time endpoint with one GPU instance, and CloudWatch shows that every instance's accelerator is lightly used. Each model needs only a fraction of an instance's accelerator memory. The company wants to reduce hosting costs while keeping the ability to scale each model independently.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Move each model to its own SageMaker AI asynchronous inference endpoint so that requests are queued and processed later.
    - id: b
      text:
        en: |-
          Keep the five endpoints, and add target tracking on SageMakerVariantInvocationsPerInstance with a minimum capacity of one instance for each endpoint.
    - id: c
      text:
        en: |-
          Host the five models on one endpoint as five production variants with equal weights, each variant on its own GPU instance.
    - id: d
      text:
        en: |-
          Deploy the five models as inference components on one shared endpoint, each with its own accelerator and memory allocation and copy count.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      Inference components let several models share the instances of one endpoint, each with its own allocation of CPU cores, accelerators and memory, and the number of copies of each model can be scaled independently. Packing lightly used models onto shared instances improves utilization and reduces the number of instances the company pays for.
  options:
    a:
      en: |-
        Asynchronous endpoints change the invocation pattern to queued requests with results delivered later, and each model still needs its own endpoint and instances.
    b:
      en: |-
        Auto scaling on the existing endpoints keeps at least five instances running, each mostly idle.
    c:
      en: |-
        Weights split traffic between variants of the same endpoint, so requests would reach a random model, and five instances would still run.
references:
  - title: "Deploy models for real-time inference - Amazon SageMaker AI"
    url: https://docs.aws.amazon.com/sagemaker/latest/dg/realtime-endpoints-deploy-models.html
