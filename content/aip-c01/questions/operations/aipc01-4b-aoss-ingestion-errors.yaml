id: aipc01-4b-aoss-ingestion-errors
objective: "4.3.5"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    An AWS Lambda function bulk-indexes document chunks and their embeddings into an Amazon OpenSearch Serverless vector search collection. The team wants one alarm when bulk indexing requests fail entirely, for example because of authentication or availability issues, and another when individual documents are rejected inside otherwise successful requests.

    Which metrics in the AWS/AOSS namespace should the team use? (Choose two.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          SearchRequestErrors
    - id: b
      text:
        en: |-
          IngestionRequestErrors
    - id: c
      text:
        en: |-
          IngestionDocumentErrors
    - id: d
      text:
        en: |-
          DeletedDocuments
    - id: e
      text:
        en: |-
          IndexingOCU
answer: { optionIds: [ b, c ] }
explanation:
  correct:
    en: |-
      IngestionRequestErrors counts bulk indexing request errors, emitted when a bulk request fails for any reason such as authentication or availability. IngestionDocumentErrors counts document errors during ingestion for a collection or index, which catches individual documents rejected within a bulk request.
  options:
    a:
      en: |-
        SearchRequestErrors counts failed queries, not indexing failures.
    d:
      en: |-
        DeletedDocuments counts deleted documents; it does not report ingestion errors.
    e:
      en: |-
        IndexingOCU measures the compute units used for ingestion, not failed requests or documents.
references:
  - title: "Monitoring OpenSearch Serverless with Amazon CloudWatch - Amazon OpenSearch Service"
    url: https://docs.aws.amazon.com/opensearch-service/latest/developerguide/monitoring-cloudwatch.html
