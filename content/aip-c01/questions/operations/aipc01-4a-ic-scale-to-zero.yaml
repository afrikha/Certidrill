id: aipc01-4a-ic-scale-to-zero
objective: "4.1.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company hosts three fine-tuned models for internal tools on an Amazon SageMaker AI real-time endpoint with GPU instances. The tools are used only during business hours on weekdays, and the endpoint is idle at night and on weekends. Users accept that the first request after an idle period fails and that the endpoint needs several minutes to respond again. The tools must keep using synchronous InvokeEndpoint calls. The company wants to stop paying for idle instances.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Deploy the models as inference components with MinInstanceCount 0, let them scale in to zero copies, and scale out with a step policy on a NoCapacityInvocationFailures alarm.
    - id: b
      text:
        en: |-
          Keep the models in the endpoint's production variant, register the variant as a scalable target with a minimum capacity of 0, and use target tracking on SageMakerVariantInvocationsPerInstance.
    - id: c
      text:
        en: |-
          Convert the endpoint to an asynchronous inference endpoint that reads requests from Amazon S3 and sends a notification through Amazon SNS when each result is ready.
    - id: d
      text:
        en: |-
          Add scheduled scaling actions that reduce the endpoint to one smaller GPU instance at night and on weekends, and restore it every weekday morning.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      An endpoint can scale to and from zero instances only when it hosts inference components and its production variant sets MinInstanceCount to 0. Scaling out from zero uses a step scaling policy on an alarm on NoCapacityInvocationFailures, which SageMaker AI emits when a request arrives and no instance is active; requests fail while the instance is provisioned, which the users accept.
  options:
    b:
      en: |-
        Scaling to zero is supported only for endpoints that host inference components, not for a production variant that serves a model directly.
    c:
      en: |-
        Asynchronous inference returns results later through Amazon S3, which breaks the synchronous calls that the tools rely on.
    d:
      en: |-
        Scheduled scaling keeps an instance running every night and weekend, so the company still pays for idle capacity.
references:
  - title: "Scale an endpoint to zero instances - Amazon SageMaker AI"
    url: https://docs.aws.amazon.com/sagemaker/latest/dg/endpoint-auto-scaling-zero-instances.html
  - title: "Deploy models for real-time inference - Amazon SageMaker AI"
    url: https://docs.aws.amazon.com/sagemaker/latest/dg/realtime-endpoints-deploy-models.html
