id: aipc01-4b-runtime-metrics-facts
objective: "4.3.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    An SRE team builds dashboards and alarms from the AWS/Bedrock runtime metrics for an application that calls both the Converse and ConverseStream APIs and uses prompt caching for its long system prompt.

    Which statements about these metrics are correct? (Choose two.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          TimeToFirstToken is published for both the Converse and ConverseStream requests of the application.
    - id: b
      text:
        en: |-
          InvocationLatency measures the time from the request until the model returns its first token.
    - id: c
      text:
        en: |-
          Throttled requests are counted in InvocationThrottles and are not included in the Invocations metric.
    - id: d
      text:
        en: |-
          Invocations includes the requests that Amazon Bedrock rejected during the validation of their input.
    - id: e
      text:
        en: |-
          Tokens read from the prompt cache are reported in CacheReadInputTokenCount and do not count toward the TPM quota.
answer: { optionIds: [ c, e ] }
explanation:
  correct:
    en: |-
      InvocationThrottles counts throttled requests, which are excluded from Invocations and from the error metrics. CacheReadInputTokenCount reports the input tokens read from the prompt cache; they are charged at a reduced rate and do not count toward the TPM quota, unlike cache writes.
  options:
    a:
      en: |-
        TimeToFirstToken is published only for the streaming operations, so the Converse requests do not produce it.
    b:
      en: |-
        InvocationLatency runs until the last token is received; the time to the first token is the separate TimeToFirstToken metric.
    d:
      en: |-
        Invocations excludes throttled requests and requests rejected during input validation.
references:
  - title: "Monitor bedrock-runtime inference using CloudWatch metrics - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/monitoring-runtime-metrics.html
