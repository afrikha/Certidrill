id: aipc01-4a-stream-first-words
objective: "4.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company's internal knowledge assistant calls the Amazon Bedrock Converse API from an AWS Lambda function and returns the full answer to the browser when generation finishes. Answers take 8 to 12 seconds to generate, and users say the assistant seems frozen because nothing appears until the end. The total generation time is acceptable. The company wants users to see text as soon as possible.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Increase the memory of the Lambda function so that the function receives and processes the model's response faster.
    - id: b
      text:
        en: |-
          Set the temperature to 0 so that the model selects each token faster and finishes the answer sooner.
    - id: c
      text:
        en: |-
          Submit the questions through Amazon Bedrock batch inference, and notify the users when their answers are ready.
    - id: d
      text:
        en: |-
          Call the ConverseStream API, and forward the text deltas to the browser as they arrive, for example over a WebSocket.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      ConverseStream returns the response as a stream of events, so the first words reach the user after the time to first token instead of after the whole generation. The total generation time does not change, which the company accepts, but the perceived latency drops.
  options:
    a:
      en: |-
        Lambda memory does not change the model's generation time, and the full answer still arrives only at the end.
    b:
      en: |-
        Temperature changes which tokens are selected, not how fast they are generated, and the answer still arrives all at once.
    c:
      en: |-
        Batch inference is asynchronous, which makes users wait longer instead of showing text sooner.
references:
  - title: "Inference using Converse API - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/conversation-inference.html
