id: aipc01-4a-precomputed-edge-summaries
objective: "4.1.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    An e-commerce site shows an AI-generated summary of customer reviews on each of its 50,000 product pages. The summary is the same for every visitor, and the reviews of each product change about once a day. Today, every page view calls an Amazon API Gateway REST API whose AWS Lambda function invokes an Amazon Bedrock model. Visitors are worldwide. The company wants the lowest latency for visitors and the fewest model invocations.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Enable caching on the API Gateway stage with the product ID as the cache key and the maximum TTL, so that repeated views of a product are served from the cache.
    - id: b
      text:
        en: |-
          Generate each product's summary once when its reviews change, store it as an object in Amazon S3, and serve it to visitors through an Amazon CloudFront distribution.
    - id: c
      text:
        en: |-
          Add a semantic cache in Amazon ElastiCache for Valkey that the Lambda function checks before it invokes the model for each page view.
    - id: d
      text:
        en: |-
          Enable prompt caching for the reviews of each product so that later invocations for the same product cost less and respond faster.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      The summary is identical for all visitors and changes at most daily, so it can be computed once per change and delivered as static content from CloudFront edge locations close to visitors. The model is invoked once per review change, and page views never wait for API Gateway, Lambda or the model.
  options:
    a:
      en: |-
        The maximum API Gateway cache TTL is 3,600 seconds, so each summary would still be regenerated up to 24 times a day instead of once per change.
    c:
      en: |-
        The Lambda function and an embedding call still run on every page view, and each miss invokes the model; an exact product ID is a better key than similarity here.
    d:
      en: |-
        Prompt caching still invokes the model on every page view; it only lowers the cost and latency of the repeated input.
references:
  - title: "Cache settings for REST APIs in API Gateway - Amazon API Gateway"
    url: https://docs.aws.amazon.com/apigateway/latest/developerguide/api-gateway-caching.html
