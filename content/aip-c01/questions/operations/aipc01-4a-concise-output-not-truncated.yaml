id: aipc01-4a-concise-output-not-truncated
objective: "4.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A software company generates release-note summaries with an Amazon Bedrock model. The summaries average 900 output tokens, but the product team wants about 120 words. To cut costs, a developer set maxTokens to 200. Many summaries now end in the middle of a sentence, and the Converse responses show the max_tokens stop reason. The company needs short summaries that are always complete, at the lowest output token cost.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Keep maxTokens at 200 and set the temperature to 0 so that the model chooses the most probable and shortest wording for each summary.
    - id: b
      text:
        en: |-
          Instruct the model in the prompt to write at most 120 words in five bullets, and set maxTokens slightly above that length as a safety cap.
    - id: c
      text:
        en: |-
          Restore maxTokens to the model default, and truncate each summary to 120 words in the application before it is shown to users.
    - id: d
      text:
        en: |-
          Add a period as a stop sequence so that generation ends after the first complete sentence, and keep maxTokens at 200.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      maxTokens only caps generation: the model does not plan a shorter answer, so it is cut off and the response ends with the max_tokens stop reason. A length instruction in the prompt makes the model write a short, complete summary at the source, and a cap set just above that length still protects against runaway outputs without truncating normal responses.
  options:
    a:
      en: |-
        Temperature changes how tokens are sampled, not how long the model intends to write, so summaries would still be cut at 200 tokens.
    c:
      en: |-
        The model still generates, and the company still pays for, about 900 output tokens per summary; truncating in the application only hides them.
    d:
      en: |-
        A period as a stop sequence ends generation after the first sentence, which returns a one-sentence summary instead of the expected content.
references:
  - title: "Inference using Converse API - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/conversation-inference.html
  - title: "Influence response generation with inference parameters - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/inference-parameters.html
