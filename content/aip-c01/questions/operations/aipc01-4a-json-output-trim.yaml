id: aipc01-4a-json-output-trim
objective: "4.1.1"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    An insurance company extracts 12 fields from claim letters with an Amazon Bedrock model through the Converse API. The model returns the JSON object followed by a long paragraph that explains its reasoning, and output tokens now account for 70% of the inference cost. The downstream system reads only the JSON object, every field must still be present, and the company does not want to change the model.

    Which combination of steps will reduce output tokens while meeting these requirements? (Choose two.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Instruct the model to return only a JSON object that follows the provided schema, with no explanation before or after it.
    - id: b
      text:
        en: |-
          Set the temperature to 0 so that the model stops generating as soon as the most probable answer is complete.
    - id: c
      text:
        en: |-
          Reduce maxTokens to half of the current average output length so that every response is shorter.
    - id: d
      text:
        en: |-
          Ask the model to end the object with a marker, and add that marker to stopSequences so that generation stops after the JSON.
    - id: e
      text:
        en: |-
          Add a prompt caching checkpoint after the instructions so that repeated output is billed at the cache-read rate.
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: |-
      Removing the explanation at the source and stopping generation at a delimiter both cut the tokens generated after the JSON object while the object itself stays complete. When the model generates a stop sequence, generation stops, so the explanatory paragraph is never produced or billed.
  options:
    b:
      en: |-
        Temperature changes which tokens are selected, not where generation ends, so the explanation would still be generated.
    c:
      en: |-
        Halving maxTokens truncates responses, including JSON objects, which loses fields and breaks parsing.
    e:
      en: |-
        Prompt caching applies to a repeated input prefix; it does not reduce or discount output tokens.
references:
  - title: "Influence response generation with inference parameters - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/inference-parameters.html
  - title: "Prompt caching for faster model inference - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/prompt-caching.html
