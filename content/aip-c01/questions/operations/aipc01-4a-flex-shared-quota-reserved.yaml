id: aipc01-4a-flex-shared-quota-reserved
objective: "4.2.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company runs a mission-critical customer assistant and several background evaluation jobs on the same Amazon Bedrock model in one account and Region. To protect the assistant, the team moved the evaluation jobs to the Flex service tier, but the assistant is still throttled whenever the jobs run. The assistant must not be throttled because of the jobs, and the company can commit to capacity for three months.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Move the evaluation jobs from the Flex tier back to the Standard tier so that they are no longer processed with a lower priority.
    - id: b
      text:
        en: |-
          Create an application inference profile for the assistant so that its requests are tracked and limited separately from the jobs.
    - id: c
      text:
        en: |-
          Reserve input and output tokens per minute for the assistant in the Reserved tier, which is separate from the on-demand quota.
    - id: d
      text:
        en: |-
          Increase the SDK maximum attempts for the assistant so that its throttled requests are retried more times.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      The on-demand quota of a model is shared across the Priority, Standard and Flex tiers, so the Flex jobs still consume the quota that the assistant needs. Reserved tier capacity is separate from the on-demand quota, is committed for 1 or 3 months, and overflows to the Standard tier when demand exceeds it.
  options:
    a:
      en: |-
        The Standard tier uses the same shared on-demand quota, so the jobs would still consume it.
    b:
      en: |-
        Application inference profiles track usage and costs; they do not reserve or isolate capacity.
    d:
      en: |-
        More retries add load against the same exhausted quota and delay the assistant's responses.
references:
  - title: "Service tiers for optimizing performance and cost - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/service-tiers-inference.html
  - title: "Create an application inference profile - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/inference-profiles-create.html
