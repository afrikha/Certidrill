id: aipc01-4a-implicit-metadata-filter
objective: "4.2.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A car manufacturer's owner-manual assistant uses an Amazon Bedrock knowledge base whose chunks carry model_name and model_year metadata. Owners ask free-text questions such as "How do I reset the tire pressure warning on my 2023 Rover?", and unfiltered retrieval returns instructions for other models and years. The company wants the knowledge base to build the metadata filter from each question automatically, without writing parsing code.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Enable query decomposition so that the model name and the model year in each question become separate sub-queries.
    - id: b
      text:
        en: |-
          Configure implicit filtering with a description of each metadata attribute and a supported Anthropic Claude model.
    - id: c
      text:
        en: |-
          Set overrideSearchType to HYBRID so that the model name and the year are matched as keywords in the chunks.
    - id: d
      text:
        en: |-
          Apply a reranker model, and add the model name and the year to the query text that the reranker receives.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      Implicit filtering uses a supported Anthropic Claude model to generate a retrieval filter from the user's query and a metadata schema that describes each attribute. The generated filter restricts retrieval to the right model and year without any parsing code in the application.
  options:
    a:
      en: |-
        Decomposition splits a question into sub-queries, but none of them applies a metadata filter.
    c:
      en: |-
        Keyword matching favors chunks that mention the same words, but chunks for other models that mention a year can still rank high, because no filter is applied.
    d:
      en: |-
        A reranker only reorders the retrieved chunks; if the right chunks were not retrieved, it cannot add them.
references:
  - title: "Configure and customize queries and response generation - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/kb-test-config.html
