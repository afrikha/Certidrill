id: aipc01-4a-ttft-reduction
objective: "4.2.1"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    A RAG chat application sends 5,000 tokens of static instructions, then 20 retrieved chunks, then the user's question to an Amazon Bedrock model with ConverseStream. CloudWatch shows a TimeToFirstToken of about 4 seconds, while the rest of the answer streams quickly. The company wants to reduce the time to first token without lowering answer quality.

    Which combination of changes will meet these requirements? (Choose two.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Add a cache checkpoint after the static instructions so that later requests reuse the processed prefix.
    - id: b
      text:
        en: |-
          Lower maxTokens so that the model generates a shorter answer after the first token.
    - id: c
      text:
        en: |-
          Switch from ConverseStream to Converse so that the model returns the whole answer in one response.
    - id: d
      text:
        en: |-
          Rerank the retrieved chunks, and pass only the five most relevant chunks to the model.
    - id: e
      text:
        en: |-
          Raise the temperature so that the model selects its first token from a wider set of candidates.
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: |-
      The time to first token is dominated by processing the input. Prompt caching lets later requests read the static instructions from the cache instead of processing them again, and reranking passes fewer, more relevant chunks, which shortens the input and tends to improve the answer.
  options:
    b:
      en: |-
        maxTokens limits generation after the first token; it does not shorten input processing.
    c:
      en: |-
        A non-streaming call returns nothing until the whole answer is generated, which makes users wait longer.
    e:
      en: |-
        Temperature affects which token is selected, not how long the input takes to process.
references:
  - title: "Prompt caching for faster model inference - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/prompt-caching.html
  - title: "Improve the relevance of query responses with a reranker model in Amazon Bedrock - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/rerank.html
