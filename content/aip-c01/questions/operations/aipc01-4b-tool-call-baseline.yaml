id: aipc01-4b-tool-call-baseline
objective: "4.3.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company's customer-facing agents call a refund lookup tool through an Amazon Bedrock AgentCore Gateway. The normal call volume of this tool varies strongly by hour and by weekday and grows each month. Twice last month, a prompt injection made agents call the tool in a loop, and the spikes were found days later. The company wants an alert within minutes when calls to this tool deviate from their usual pattern, without maintaining thresholds as traffic grows.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Create a CloudWatch alarm based on an anomaly detection model of the AgentCore Runtime ActiveSessionCount metric of the agents.
    - id: b
      text:
        en: |-
          Create a CloudWatch alarm with a static threshold on the gateway Duration metric, set above the slowest response observed last month.
    - id: c
      text:
        en: |-
          Create a CloudWatch alarm based on an anomaly detection model of the gateway Invocations metric for the tool, above the expected band.
    - id: d
      text:
        en: |-
          Create a CloudWatch alarm with a static threshold on the gateway Invocations metric for the tool, set to last month's highest value.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      The gateway Invocations metric, with the tool name as a dimension, is the call pattern of that tool. An anomaly detection model learns its hourly, daily, and weekly patterns and its trend, so an alarm above the band catches loops within minutes without hand-tuned thresholds.
  options:
    a:
      en: |-
        A loop happens inside existing sessions, so the number of active sessions can stay normal while tool calls explode.
    b:
      en: |-
        Duration measures how long requests take, not how many calls are made; a loop of fast calls would not breach it.
    d:
      en: |-
        A fixed threshold ignores the hourly and weekday pattern and must be raised by hand as traffic grows.
references:
  - title: "AgentCore generated gateway observability data - Amazon Bedrock AgentCore"
    url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/observability-gateway-metrics.html
  - title: "Using CloudWatch anomaly detection - Amazon CloudWatch"
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/CloudWatch_Anomaly_Detection.html
