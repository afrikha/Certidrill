id: aipc01-4b-reasoning-path-tracing
objective: "4.3.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An expense approval agent runs on Amazon Bedrock AgentCore Runtime and calls three tools in sequence. For some requests, it approves expenses that exceed the policy limits. Every tool call returns HTTP 200, and no errors or throttles appear in the metrics. The team must find the step at which the agent's reasoning goes wrong.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Create an alarm on the AgentCore Gateway SystemErrors metric to identify the tool that fails during the faulty expense approval requests.
    - id: b
      text:
        en: |-
          Enable CloudTrail data events for the runtime, and review the API calls that were recorded during the faulty approval requests.
    - id: c
      text:
        en: |-
          Compare the Latency metric of the runtime for approved and rejected requests to find the agent step that takes longer than the others.
    - id: d
      text:
        en: |-
          Instrument the agent with AWS Distro for OpenTelemetry, and review the spans of the faulty requests for each step's inputs, tool calls, and results.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      Reasoning path tracing follows each step of the agent through its spans: the model calls, the tool requests and responses, and the intermediate results. With ADOT, model payloads and tool request and response data can be kept on the spans, so engineers can see where a correct tool result led to a wrong decision.
  options:
    a:
      en: |-
        All tool calls succeed, so an error metric gives no signal about a logical error.
    b:
      en: |-
        CloudTrail shows which API calls were made, not the content and reasoning of each agent step.
    c:
      en: |-
        A logical error does not need to be slow; latency does not reveal where the reasoning went wrong.
references:
  - title: "Add observability to your Amazon Bedrock AgentCore resources - Amazon Bedrock AgentCore"
    url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/observability-configure.html
  - title: "AgentCore generated runtime observability data - Amazon Bedrock AgentCore"
    url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/observability-runtime-metrics.html
