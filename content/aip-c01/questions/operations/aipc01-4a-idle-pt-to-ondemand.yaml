id: aipc01-4a-idle-pt-to-ondemand
objective: "4.1.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company runs a document assistant on Amazon Bedrock with no-commitment Provisioned Throughput of 2 model units for a base model. CloudWatch shows that interactive traffic arrives only from 08:00 to 18:00 on weekdays and uses about 20% of the provisioned capacity. The same Provisioned Throughput also runs a nightly job that summarizes the day's documents; results are needed the next morning. The account's on-demand quotas cover the interactive peak.

    Which combination of changes will reduce costs the MOST? (Choose two.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Convert the Provisioned Throughput to a 6-month commitment to receive a lower hourly price for the same model units.
    - id: b
      text:
        en: |-
          Delete the Provisioned Throughput, and send the interactive requests to the base model with on-demand inference.
    - id: c
      text:
        en: |-
          Add a third model unit so that the nightly job and the interactive requests never compete for capacity.
    - id: d
      text:
        en: |-
          Run the nightly summarization as an Amazon Bedrock batch inference job against the base model.
    - id: e
      text:
        en: |-
          Move the interactive requests to on-demand inference with the Priority service tier, and keep the Provisioned Throughput for the nightly job.
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |-
      Provisioned Throughput is billed every hour until it is deleted, so capacity that is 20% used during 50 hours a week is mostly paid for nothing; on-demand inference charges only for the tokens used, and the quotas cover the peak. Batch inference runs the nightly job asynchronously at a price lower than on-demand and works with base models, not with provisioned ones.
  options:
    a:
      en: |-
        A commitment lowers the hourly price but locks in the same mostly idle capacity for 6 months.
    c:
      en: |-
        Another model unit raises the hourly cost of capacity that is already underused.
    e:
      en: |-
        Priority adds a premium over Standard, and keeping Provisioned Throughput for one nightly job still pays for capacity around the clock.
references:
  - title: "Increase model invocation capacity with Provisioned Throughput in Amazon Bedrock - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/prov-throughput.html
  - title: "Process multiple prompts with batch inference - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/batch-inference.html
