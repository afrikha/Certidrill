id: aipc01-4b-nextgen-refresh
objective: "4.2.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A support platform writes each new ticket and its embedding directly into a Classic vector search collection in Amazon OpenSearch Serverless, and its agents search similar tickets right after they are created. New tickets often do not appear in search results for up to a minute. The company requires new tickets to be searchable within 10 seconds of being written, with the LEAST operational overhead.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Raise the maximum indexing capacity of the account in OCUs so that the collection indexes new tickets with more compute units.
    - id: b
      text:
        en: |-
          Re-create the index with Faiss 16-bit scalar quantization so that each new vector needs less memory and is indexed faster.
    - id: c
      text:
        en: |-
          Increase the number of results that each query requests so that recently written tickets are more likely to be included.
    - id: d
      text:
        en: |-
          Move the index to a NextGen vector search collection, whose read-after-write latency is 5 seconds, and reindex the tickets.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      Indexes in Classic vector search collections have a refresh interval of 60 seconds, so documents can take up to a minute to become searchable. NextGen vector collections have a read-after-write latency of 5 seconds and scale on demand, which meets the 10-second requirement without managing capacity.
  options:
    a:
      en: |-
        More indexing compute does not change the 60-second refresh interval that delays visibility in a Classic collection.
    b:
      en: |-
        Quantization reduces memory use; it does not make new documents searchable sooner.
    c:
      en: |-
        Documents that are not yet refreshed are not searchable at all, so asking for more results does not return them.
references:
  - title: "Working with vector search collections - Amazon OpenSearch Service"
    url: https://docs.aws.amazon.com/opensearch-service/latest/developerguide/serverless-vector-search.html
