id: aipc01-4a-priority-tier-agent-assist
objective: "4.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A contact center uses an Amazon Bedrock model to suggest replies to agents during live calls. Suggestions must arrive as fast as possible during business hours, when traffic varies widely. The company does not want to reserve capacity around the clock or sign a term commitment, and it accepts a higher price per request for faster responses.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Ask the AWS account team for Reserved tier capacity sized for the busiest hour of the day.
    - id: b
      text:
        en: |-
          Purchase Provisioned Throughput with a 1-month commitment for the model.
    - id: c
      text:
        en: |-
          Send the requests with the Flex service tier to receive a lower price per request.
    - id: d
      text:
        en: |-
          Send the requests with the Priority service tier on on-demand inference.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      The Priority tier is designed for customer-facing, mission-critical workloads that need the fastest responses without a 24x7 reservation: it needs no commitment, its requests are served before Standard and Flex requests, and it is priced at a premium over Standard.
  options:
    a:
      en: |-
        The Reserved tier requires a 1-month or 3-month commitment through the account team and is billed for the reserved capacity whether or not it is used.
    b:
      en: |-
        A 1-month Provisioned Throughput commitment is a term commitment, billed every hour.
    c:
      en: |-
        Flex expects longer processing times, which conflicts with live suggestions.
references:
  - title: "Service tiers for optimizing performance and cost - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/service-tiers-inference.html
