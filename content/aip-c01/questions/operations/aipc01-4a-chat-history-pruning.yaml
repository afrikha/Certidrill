id: aipc01-4a-chat-history-pruning
objective: "4.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An airline runs a customer-service chat assistant on Amazon Bedrock. Each turn sends the full conversation history in the messages array, and long conversations reach 40 turns, so input tokens and cost grow with every turn. Customers often give their booking reference and travel dates early in the conversation, and the assistant must still use them later. Replies must arrive within a few seconds.

    Which solution will reduce input token costs while meeting these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Keep only the five most recent turns in the messages array, and discard older turns when the conversation grows longer than that.
    - id: b
      text:
        en: |-
          Switch to a model with a larger context window so that the full conversation history always fits in the request without truncation.
    - id: c
      text:
        en: |-
          Send each conversation turn as a record in an Amazon Bedrock batch inference job to receive the batch price for the input tokens.
    - id: d
      text:
        en: |-
          Keep the most recent turns verbatim, and replace older turns with a short running summary that a small, low-cost model updates.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      A sliding window of recent turns plus a summary of older turns (context pruning) bounds the input size of every request while keeping key facts, such as the booking reference, in the summary. The summary is produced by an inexpensive model, so the tokens saved on every later turn outweigh its cost, and the chat stays interactive.
  options:
    a:
      en: |-
        Discarding older turns loses facts that customers gave early, such as the booking reference, so the assistant can no longer use them.
    b:
      en: |-
        A larger context window lets the history grow further; it does not reduce the number of tokens sent and billed on each turn.
    c:
      en: |-
        Batch inference processes prompts asynchronously from files in Amazon S3, which cannot return replies within a few seconds.
references:
  - title: "Inference using Converse API - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/conversation-inference.html
  - title: "Process multiple prompts with batch inference - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/batch-inference.html
