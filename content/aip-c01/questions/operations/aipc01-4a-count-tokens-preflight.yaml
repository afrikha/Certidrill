id: aipc01-4a-count-tokens-preflight
objective: "4.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A legal services company runs a contract-review assistant on Amazon Bedrock with the Converse API. Users can paste very long contracts, and the company wants to reject any request whose input would exceed 50,000 tokens before the request reaches the model. The check must use the same token count that the model would bill, and it must not add inference charges.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Send each request to the Converse API with maxTokens set to 1, read inputTokens from the usage field, and resend the full request only when the count is below the limit.
    - id: b
      text:
        en: |-
          Read the InputTokenCount metric of the model in Amazon CloudWatch, and reject new requests when the average input size of recent requests exceeds the limit.
    - id: c
      text:
        en: |-
          Call the CountTokens API with the same messages, system prompt and model, and send the Converse request only when the returned count is below the limit.
    - id: d
      text:
        en: |-
          Enable model invocation logging, query input.inputTokenCount with CloudWatch Logs Insights, and reject requests from users whose earlier requests exceeded the limit.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      CountTokens returns the number of input tokens that a request would use with the specified model, and the count matches what inference would charge for the same input. Calling it is not charged, and it accepts the Converse input (messages and system), so the application can check the exact request before it calls Converse.
  options:
    a:
      en: |-
        The probe is a real inference call: its input tokens are billed, and accepted requests pay for the input twice, which adds the charges the company wants to avoid.
    b:
      en: |-
        The metric aggregates past requests for the model; it cannot tell the size of the request that is being submitted.
    d:
      en: |-
        Invocation logs record requests after the model has processed and billed them, and earlier requests say nothing about the size of the current one.
references:
  - title: "Monitor your token usage by counting tokens before running inference - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/count-tokens.html
