id: aipc01-4b-coherence-metric
objective: "4.3.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A bank's assistant explains loan eligibility in several reasoning steps. Reviewers found answers whose final conclusion contradicts an earlier step, for example an applicant judged eligible after the answer stated that the income was below the threshold. The team wants a nightly judge-based evaluation on a fixed set of eligibility questions that scores this specific failure mode.

    Which built-in metric should the evaluation job use?
body:
  options:
    - id: a
      text:
        en: |-
          Builtin.Faithfulness, which identifies information in the response that is not found in the prompt.
    - id: b
      text:
        en: |-
          Builtin.Coherence, which identifies logical gaps, inconsistencies, and contradictions in the response.
    - id: c
      text:
        en: |-
          Builtin.Refusal, which determines whether the response declines to answer or rejects the request.
    - id: d
      text:
        en: |-
          Builtin.ProfessionalStyleAndTone, which assesses whether the style and tone suit a professional setting.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      Logical coherence (Builtin.Coherence) identifies logical gaps, inconsistencies, and contradictions in a model's response, which is the failure mode of a conclusion that contradicts an earlier reasoning step. Scoring it nightly on a fixed question set reveals when the reasoning degrades.
  options:
    a:
      en: |-
        Faithfulness detects content that is not supported by the prompt; a contradiction between two steps can use only facts from the prompt.
    c:
      en: |-
        Refusal measures whether the assistant declines to answer, not whether its reasoning is consistent.
    d:
      en: |-
        Style and tone do not reveal contradictions in the reasoning.
references:
  - title: "Use metrics to understand model performance - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/model-evaluation-metrics.html
