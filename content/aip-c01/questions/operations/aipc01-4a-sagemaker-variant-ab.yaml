id: aipc01-4a-sagemaker-variant-ab
objective: "4.2.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company hosts a fine-tuned LLM on an Amazon SageMaker AI real-time endpoint. It has trained a new version and wants 10% of live requests to receive answers from it, so that it can compare latency, errors and user feedback for each version. Traffic must then shift gradually to the better version, without changing the application and without creating another endpoint.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Add the new model as a second production variant weighted 10 against 90, compare per-variant metrics, and adjust the weights over time.
    - id: b
      text:
        en: |-
          Run a shadow test with the new model as the shadow variant, compare its CloudWatch metrics with those of the production variant, then promote it.
    - id: c
      text:
        en: |-
          Deploy the new model to a second endpoint, and change the application so that it sends 10% of its requests to the new endpoint.
    - id: d
      text:
        en: |-
          Pass TargetVariant in every InvokeEndpoint call, and let the application choose the new variant for 10% of the users.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      Production variants split traffic on one endpoint by weight, SageMaker AI publishes metrics such as Latency and Invocations for each variant, and UpdateEndpointWeightsAndCapacities changes the weights without updating the endpoint. The application keeps calling the same endpoint.
  options:
    b:
      en: |-
        A shadow variant receives a copy of the traffic, but its responses are not returned to users, so no user feedback can be collected for the new version.
    c:
      en: |-
        A second endpoint and application changes are exactly what the company wants to avoid.
    d:
      en: |-
        Choosing variants with TargetVariant requires changing the application.
references:
  - title: "Testing models with production variants - Amazon SageMaker AI"
    url: https://docs.aws.amazon.com/sagemaker/latest/dg/model-ab-testing.html
