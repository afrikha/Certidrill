id: aipc01-4b-aoss-search-latency
objective: "4.3.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A RAG application retrieves passages from an Amazon OpenSearch Serverless vector search collection. The operations team wants a CloudWatch alarm that fires when vector queries against the collection become slow.

    Which metric in the AWS/AOSS namespace should the alarm use?
body:
  options:
    - id: a
      text:
        en: |-
          IndexingOCU
    - id: b
      text:
        en: |-
          IngestionRequestLatency
    - id: c
      text:
        en: |-
          SearchableDocuments
    - id: d
      text:
        en: |-
          SearchRequestLatency
answer: { optionId: d }
explanation:
  correct:
    en: |-
      SearchRequestLatency is the average time, in milliseconds, to complete a search operation against a collection, so it directly reflects slow vector queries. It is published per collection every 60 seconds.
  options:
    a:
      en: |-
        IndexingOCU counts the compute units used to ingest data, not query latency.
    b:
      en: |-
        IngestionRequestLatency measures bulk write operations, not searches.
    c:
      en: |-
        SearchableDocuments counts the documents in a collection or index, which helps detect document count drift, not slow queries.
references:
  - title: "Monitoring OpenSearch Serverless with Amazon CloudWatch - Amazon OpenSearch Service"
    url: https://docs.aws.amazon.com/opensearch-service/latest/developerguide/monitoring-cloudwatch.html
