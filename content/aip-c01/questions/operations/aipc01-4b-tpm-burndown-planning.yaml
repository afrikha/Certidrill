id: aipc01-4b-tpm-burndown-planning
objective: "4.2.5"
type: single
difficulty: 3
status: draft
shuffle: false
stem:
  en: |
    A company is preparing a quota increase request for a text generation model that it uses with Amazon Bedrock on-demand inference. At peak, the application sends 120 requests per minute. Each request contains 3,000 input tokens, sets max_tokens to 1,000, and produces 400 output tokens on average. Prompt caching is not used. The model card lists an output token burndown rate of 5x.

    How many tokens per minute (TPM) of quota does the peak workload consume after the requests complete?
body:
  options:
    - id: a
      text:
        en: |-
          408,000 TPM
    - id: b
      text:
        en: |-
          480,000 TPM
    - id: c
      text:
        en: |-
          600,000 TPM
    - id: d
      text:
        en: |-
          960,000 TPM
answer: { optionId: c }
explanation:
  correct:
    en: |-
      When a request completes, Amazon Bedrock deducts the input tokens plus the output tokens multiplied by the burndown rate: 3,000 + 400 x 5 = 5,000 tokens per request, so 120 requests consume 600,000 TPM. The reservation made at the start of each request (input tokens plus max_tokens) is adjusted to this value, and unused tokens return to the quota.
  options:
    a:
      en: |-
        408,000 counts input and output tokens at 1:1, which is what the company is billed for, but the quota counts output tokens at the 5x burndown rate.
    b:
      en: |-
        480,000 is the amount reserved at the start of the requests (input tokens plus max_tokens); it is adjusted to the actual output tokens with burndown when the requests complete.
    d:
      en: |-
        960,000 applies the burndown rate to max_tokens instead of to the output tokens actually generated.
references:
  - title: "How tokens are counted in Amazon Bedrock - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/quotas-token-burndown.html
