id: aipc01-4a-cache-reads-raise-throughput
objective: "4.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company's coding agent on Amazon Bedrock sends a 20,000-token prefix of tool definitions and instructions with every request, followed by a short task description. The agent is throttled at the model's tokens-per-minute quota, and the company cannot get a quota increase soon. The model supports prompt caching, and the agent sends several requests every minute.

    Which solution will increase the number of requests that the agent can run within the current quota?
body:
  options:
    - id: a
      text:
        en: |-
          Move the tool definitions into the user message so that the model processes them only when it needs to call a tool.
    - id: b
      text:
        en: |-
          Lower maxTokens to 100 so that each request reserves fewer output tokens against the quota when it starts.
    - id: c
      text:
        en: |-
          Switch the agent's requests to the Flex service tier so that they are counted against a separate quota.
    - id: d
      text:
        en: |-
          Add a cache checkpoint after the tool definitions and instructions so that later requests read the prefix from the cache.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      Input tokens read from the prompt cache do not count toward the TPM quota, so once the 20,000-token prefix is cached, each request consumes quota mainly for its short task and its output. Several requests a minute keep refreshing the default 5-minute cache entry.
  options:
    a:
      en: |-
        Moving the tool definitions into the message does not remove them from the input, and a changing message prevents the prefix from being cached.
    b:
      en: |-
        An agent's code and tool calls need far more than 100 tokens, so outputs would be truncated, and the 20,000 input tokens still count on every request.
    c:
      en: |-
        The on-demand quota of a model is shared across the Priority, Standard and Flex tiers.
references:
  - title: "Prompt caching for faster model inference - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/prompt-caching.html
  - title: "Service tiers for optimizing performance and cost - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/service-tiers-inference.html
