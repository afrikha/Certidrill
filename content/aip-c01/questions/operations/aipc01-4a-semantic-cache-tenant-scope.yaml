id: aipc01-4a-semantic-cache-tenant-scope
objective: "4.1.4"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company added a semantic cache in Amazon ElastiCache for Valkey to its multi-tenant HR assistant. Answers depend on each tenant's own leave policies. After launch, two issues appeared: a user of one tenant received an answer generated for another tenant, and the question "How many sick days do I get?" returned the cached answer to "How many vacation days do I get?". The similarity threshold is 0.75.

    Which combination of changes will resolve both issues? (Choose two.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Lower the TTL of cached entries from 24 hours to 15 minutes so that wrong answers expire sooner.
    - id: b
      text:
        en: |-
          Switch the vector index from HNSW to FLAT so that the nearest-neighbor search returns exact results.
    - id: c
      text:
        en: |-
          Store the tenant ID with each entry, and apply a tenant filter to every cache lookup.
    - id: d
      text:
        en: |-
          Configure the allkeys-lru eviction policy so that the least recently used entries are removed first.
    - id: e
      text:
        en: |-
          Raise the similarity threshold to between 0.90 and 0.95, and lower it only while monitoring answer accuracy.
answer: { optionIds: [ c, e ] }
explanation:
  correct:
    en: |-
      Filters derived from application context, such as the tenant, restrict which cached entries a lookup can match, so one tenant's answers are never returned to another. A relaxed threshold such as 0.75 trades answer quality for hit rate, so different but similar questions match; AWS recommends starting at 0.90 to 0.95 and lowering the threshold gradually while monitoring accuracy.
  options:
    a:
      en: |-
        A shorter TTL limits how long a wrong answer stays cached, but the wrong answer is still served until it expires.
    b:
      en: |-
        FLAT returns the exact nearest neighbors, but the nearest neighbor can still be another tenant's entry or a different question above the threshold.
    d:
      en: |-
        Eviction manages memory; it does not change which entries a lookup matches.
references:
  - title: "Best practices - Amazon ElastiCache"
    url: https://docs.aws.amazon.com/AmazonElastiCache/latest/dg/semantic-caching-best-practices.html
  - title: "Why ElastiCache for Valkey for semantic caching - Amazon ElastiCache"
    url: https://docs.aws.amazon.com/AmazonElastiCache/latest/dg/semantic-caching-why-elasticache.html
