id: aipc01-4a-creative-sampling-params
objective: "4.2.4"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A marketing team generates product slogans with an Amazon Bedrock model through the Converse API, with a temperature of 0.2, a topP of 0.5, and a top_k of 5 in additionalModelRequestFields. Running the same prompt many times returns almost identical slogans. The team wants more varied suggestions on the same topic.

    Which combination of parameter changes will meet this requirement? (Choose two.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Lower topP to 0.1 so that the model samples from a more focused set of tokens.
    - id: b
      text:
        en: |-
          Raise the temperature, for example to 0.8, so that lower-probability tokens become more likely.
    - id: c
      text:
        en: |-
          Add a stop sequence so that the model stops generating after the first slogan.
    - id: d
      text:
        en: |-
          Lower maxTokens so that each slogan is generated faster and costs less.
    - id: e
      text:
        en: |-
          Raise top_k, for example to 200, so that the model considers more candidate tokens.
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: |-
      A higher temperature flattens the probability distribution, and a higher top_k widens the pool of candidate tokens; both let less likely tokens be selected and increase variety. top_k stays in additionalModelRequestFields because it is not a base Converse inference parameter.
  options:
    a:
      en: |-
        A lower topP narrows the candidate pool, which makes the slogans even more alike.
    c:
      en: |-
        A stop sequence controls where generation ends, not how varied the text is.
    d:
      en: |-
        maxTokens limits length; it does not change how tokens are selected.
references:
  - title: "Influence response generation with inference parameters - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/inference-parameters.html
  - title: "Inference using Converse API - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/conversation-inference.html
