id: aipc01-4a-cascade-validated-escalation
objective: "4.1.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A logistics company generates customs declarations as JSON from shipping documents with Amazon Bedrock. About 85% of documents are simple: a small model from one provider produces valid declarations for most of them, and a large model from another provider handles the rest. Every declaration must pass a JSON schema check and business-rule validation before it is filed. The company wants the lowest cost per filed declaration.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Use an Amazon Bedrock prompt router with the small model as the fallback model so that complex documents are routed to the large model.
    - id: b
      text:
        en: |-
          Classify each document with a small model before generation, and send each document to the model that matches the predicted complexity label.
    - id: c
      text:
        en: |-
          Send each document to the small model first, validate its output, and resend only the documents that fail validation to the large model.
    - id: d
      text:
        en: |-
          Send every document to the large model, and enable prompt caching for the long instructions to lower the cost of each request.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      A cascade lets the cheap model handle every document it can, and the company's own validation decides escalation, so no unvalidated declaration is filed and the large model is paid only for the documents that need it. Because the two models come from different providers and escalation depends on validation results, the logic lives in the application.
  options:
    a:
      en: |-
        A prompt router works only within one model family and decides before generation from predicted quality; it cannot use the company's validation results.
    b:
      en: |-
        A complexity classifier can send a difficult document to the small model and has no path for outputs that fail validation, so some declarations could not be filed.
    d:
      en: |-
        Every document pays the large model's price; prompt caching only reduces the cost of the repeated input prefix.
references:
  - title: "Understanding intelligent prompt routing in Amazon Bedrock - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/prompt-routing.html
