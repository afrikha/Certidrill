id: aipc01-4b-throttles-retry-count
objective: "4.3.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A team changed the SDK configuration of its application to retry throttled Amazon Bedrock requests more times with backoff. Since the change, the share of user requests that fail has dropped sharply, but the InvocationThrottles metric of the model has increased. The team's dashboard uses InvocationThrottles as its main user-impact indicator.

    What explains this, and how should the team measure the user impact?
body:
  options:
    - id: a
      text:
        en: |-
          InvocationThrottles counts every throttled attempt, including SDK retries; measure user impact with an application metric of requests that fail after all retries.
    - id: b
      text:
        en: |-
          Retried requests are counted as server errors after the first attempt; measure user impact with the InvocationServerErrors metric of the model.
    - id: c
      text:
        en: |-
          Throttled requests are included in the Invocations metric, so the retries inflate it; measure user impact with Invocations minus InvocationThrottles.
    - id: d
      text:
        en: |-
          InvocationThrottles also counts requests rejected for exceeding a service quota; measure user impact with the InvocationClientErrors metric instead.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      InvocationThrottles counts the invocations that the service throttled, and the number depends on the SDK retry settings because each retried attempt that is throttled again is counted. More retries can raise the metric while fewer users see errors, so user impact is best measured by the application as requests that still fail after the final retry.
  options:
    b:
      en: |-
        A throttled attempt is counted in InvocationThrottles, not as a server error, so server errors do not measure the throttling impact.
    c:
      en: |-
        Throttled requests are not counted in Invocations, so subtracting the throttles from Invocations has no meaning.
    d:
      en: |-
        Requests rejected for exceeding a service quota are counted in InvocationClientErrors, not as throttles, and client errors do not measure how many users finally failed.
references:
  - title: "Monitor bedrock-runtime inference using CloudWatch metrics - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/monitoring-runtime-metrics.html
