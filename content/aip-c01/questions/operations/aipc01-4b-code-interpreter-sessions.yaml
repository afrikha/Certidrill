id: aipc01-4b-code-interpreter-sessions
objective: "4.3.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company's agents use the Amazon Bedrock AgentCore Code Interpreter built-in tool to run data analysis code. The platform team wants a CloudWatch graph and an alarm that show how many Code Interpreter sessions are active at the same time, to watch the tool's utilization during peak hours.

    Which metric should the team use?
body:
  options:
    - id: a
      text:
        en: |-
          The Session Count metric of the agents, which counts the new sessions that are created in each period.
    - id: b
      text:
        en: |-
          The ActiveSessionCount metric with the Service dimension set to AgentCore.CodeInterpreter.
    - id: c
      text:
        en: |-
          The TargetType metric of the AgentCore Gateway, which counts the requests served by each type of target.
    - id: d
      text:
        en: |-
          The CPUUsed-vCPUHours metric of AgentCore Runtime with the Service dimension set to AgentCore.Runtime.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      ActiveSessionCount is a real-time gauge of currently active sessions, published once per minute per service type, with the Service dimension taking the values AgentCore.Runtime, AgentCore.CodeInterpreter, or AgentCore.Browser. Filtering it on AgentCore.CodeInterpreter shows concurrent Code Interpreter sessions.
  options:
    a:
      en: |-
        Session Count is a cumulative counter of new sessions, not a gauge of sessions that are active at the same time.
    c:
      en: |-
        TargetType counts gateway requests by target type; Code Interpreter sessions are not gateway targets.
    d:
      en: |-
        CPUUsed-vCPUHours measures runtime compute consumption, not the number of active Code Interpreter sessions.
references:
  - title: "AgentCore generated runtime observability data - Amazon Bedrock AgentCore"
    url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/observability-runtime-metrics.html
