id: aipc01-4a-cache-prefix-timestamp
objective: "4.1.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company's agent sends each Converse request with 9,000 tokens of tool definitions, a 6,000-token system prompt and the conversation messages. The system prompt begins with the line "Current time: <timestamp>", which the application refreshes on every request, followed by static instructions. A cache checkpoint is placed at the end of the system prompt, but cacheReadInputTokens is always 0. The company wants to cache as many input tokens as possible while still giving the model the current time.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Add a second cache checkpoint at the end of the tool definitions, and keep the timestamp at the start of the system prompt.
    - id: b
      text:
        en: |-
          Set the TTL of the cache checkpoint to 1 hour so that the cached system prompt survives longer between requests.
    - id: c
      text:
        en: |-
          Remove the explicit checkpoint, and rely on implicit prompt caching to find the reusable part of the prompt.
    - id: d
      text:
        en: |-
          Move the timestamp out of the system prompt and into the latest user message, after the cache checkpoint.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      Bedrock processes tools, then system, then messages, and a cache hit requires the content before the checkpoint to be identical between requests. The timestamp at the start of the system prompt changes the prefix on every request; moving it after the checkpoint makes the tools and the whole system prompt, about 15,000 tokens, a static cacheable prefix.
  options:
    a:
      en: |-
        A checkpoint after the tools would cache those 9,000 tokens, but the system prompt would still change on every request, so its 6,000 tokens would never be read from the cache.
    b:
      en: |-
        The TTL controls how long a matching entry is kept; the prefix never matches, so a longer TTL does not help.
    c:
      en: |-
        Implicit caching is best effort and also needs an identical prefix, which the timestamp still breaks at the start of the system prompt.
references:
  - title: "Prompt caching for faster model inference - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/prompt-caching.html
