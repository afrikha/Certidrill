id: aipc01-4a-semantic-cache-paraphrases
objective: "4.1.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A university's admissions assistant on Amazon Bedrock receives thousands of questions a day. Most are paraphrases of about 200 common questions, such as "When is the application deadline?" and "What's the last day to apply?". The answers change only a few times a year. The university wants to avoid invoking the model for these repeated questions and to reduce response times.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Enable prompt caching with a checkpoint after the system prompt so that repeated questions are answered from the cached prompt prefix.
    - id: b
      text:
        en: |-
          Store question embeddings and answers in Amazon ElastiCache for Valkey, and return the stored answer when a similar question is found.
    - id: c
      text:
        en: |-
          Enable caching on the Amazon API Gateway REST API stage, with the text of each question as the cache key and the maximum TTL.
    - id: d
      text:
        en: |-
          Request a higher tokens-per-minute quota for the model so that the repeated questions are answered quickly and without any throttling.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      A semantic cache matches questions by meaning: the new question is embedded, the closest stored question is found by vector search, and the stored answer is returned without calling the model when the similarity passes a threshold. ElastiCache for Valkey provides low-latency vector search and TTLs for this pattern.
  options:
    a:
      en: |-
        Prompt caching lowers the cost and latency of a repeated input prefix, but the model is still invoked for every question.
    c:
      en: |-
        The API Gateway cache returns a response only for the same cache key value, so paraphrased questions miss and still invoke the model.
    d:
      en: |-
        A higher quota allows more model calls; it does not avoid them.
references:
  - title: "Why ElastiCache for Valkey for semantic caching - Amazon ElastiCache"
    url: https://docs.aws.amazon.com/AmazonElastiCache/latest/dg/semantic-caching-why-elasticache.html
  - title: "Cache settings for REST APIs in API Gateway - Amazon API Gateway"
    url: https://docs.aws.amazon.com/apigateway/latest/developerguide/api-gateway-caching.html
