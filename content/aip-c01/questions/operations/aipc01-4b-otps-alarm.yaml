id: aipc01-4b-otps-alarm
objective: "4.2.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A customer support assistant streams answers from an Amazon Bedrock model by using the ConverseStream API. An Amazon CloudWatch alarm on the p50 InvocationLatency metric fires several times a week, but each investigation shows that the model was healthy and that the answers were simply longer than usual. The team wants an alarm that detects a slowdown of token generation on the service side without firing when answers become longer.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Graph OutputTokenCount / (InvocationLatency - TimeToFirstToken) * 1000 with p50 statistics in metric math, and alarm when it drops below a threshold.
    - id: b
      text:
        en: |-
          Replace the InvocationLatency alarm with an alarm on the p99 TimeToFirstToken metric that uses a static threshold based on last month's values.
    - id: c
      text:
        en: |-
          Raise the static threshold of the existing InvocationLatency alarm to the highest p50 latency that was observed during the last month of normal use.
    - id: d
      text:
        en: |-
          Replace the InvocationLatency alarm with an alarm on the InvocationServerErrors metric so that it fires only when the model returns server errors.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      The expression computes output tokens per second (OTPS), which isolates the generation throughput from the length of the answers. A stable OTPS with higher InvocationLatency means longer prompts or answers, while a drop in OTPS signals a model-side throughput change, which is the condition to alarm on.
  options:
    b:
      en: |-
        TimeToFirstToken measures the time before the first token, which depends mostly on the input, so it does not reveal a slower generation rate.
    c:
      en: |-
        A higher latency threshold still mixes answer length with generation speed, and it hides real slowdowns that stay below the new threshold.
    d:
      en: |-
        A slowdown in generation does not produce errors, so an error alarm would not detect it.
references:
  - title: "Diagnose InvocationLatency increases using output tokens per second (OTPS) - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/monitoring-runtime-otps.html
