id: aipc01-4b-runtime-overhead-latency
objective: "4.3.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Users of an agent hosted on Amazon Bedrock AgentCore Runtime report that the first bytes of each answer take longer to arrive than last month. The agent runs on the current runtime platform version and is invoked with InvokeAgentRuntime. Before changing the agent code, the team must determine whether the added time is spent in the runtime platform itself or in the agent's own processing.

    Which metric should the team analyze?
body:
  options:
    - id: a
      text:
        en: |-
          The runtime Latency metric, which measures the time between receiving the request and sending the final response token.
    - id: b
      text:
        en: |-
          The runtime OverheadLatency metric, which measures the time attributable to AgentCore Runtime before the agent's first response byte.
    - id: c
      text:
        en: |-
          The TargetExecutionTime metric of the AgentCore Gateway, which measures the time spent executing each tool target.
    - id: d
      text:
        en: |-
          The TimeToFirstToken metric in the AWS/Bedrock namespace, which measures the time until the model returns the first token.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      OverheadLatency is the time attributable to AgentCore Runtime, from the receipt of the request to the agent's first response byte, excluding the agent's own processing; it applies to platform version V2 and InvokeAgentRuntime. If it is stable while the response time grows, the delay is in the agent code, its model calls, or its tools.
  options:
    a:
      en: |-
        Latency measures the whole request until the final token, so it mixes platform time with the agent's processing.
    c:
      en: |-
        TargetExecutionTime isolates time spent in tools behind a gateway, not the runtime platform's own contribution.
    d:
      en: |-
        TimeToFirstToken covers only a model call; it does not separate runtime platform time from agent processing.
references:
  - title: "AgentCore generated runtime observability data - Amazon Bedrock AgentCore"
    url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/observability-runtime-metrics.html
