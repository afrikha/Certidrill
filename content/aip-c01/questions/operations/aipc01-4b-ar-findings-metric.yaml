id: aipc01-4b-ar-findings-metric
objective: "4.3.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An insurer validates the answers of its benefits assistant against a formal model of its policy rules by using Automated Reasoning checks in Amazon Bedrock Guardrails. Engineers want a CloudWatch graph and an alarm that show how often answers break the policy rules over time, as an indicator of logical errors after model or prompt changes.

    Which solution will meet these requirements with the LEAST effort?
body:
  options:
    - id: a
      text:
        en: |-
          Graph the FindingCounts metric in the AWS/Bedrock/Guardrails namespace by the FindingType dimension, and alarm on the INVALID findings.
    - id: b
      text:
        en: |-
          Enable model invocation logging, and use a scheduled Logs Insights query that counts answers containing the word invalid.
    - id: c
      text:
        en: |-
          Graph the InvocationLatency metric of the Automated Reasoning checks, and alarm when the latency rises above its usual level.
    - id: d
      text:
        en: |-
          Graph the InvocationClientErrors metric of the guardrail, because answers that break the rules are rejected as client errors.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      Guardrails publish FindingCounts, the count of each type of finding from the Automated Reasoning checks, with a FindingType dimension, together with TotalFindings. Graphing and alarming on the INVALID finding type tracks how often answers contradict the formal policy rules, without custom processing.
  options:
    b:
      en: |-
        The model's answer text does not contain the validation result, and a scheduled query adds work and delay.
    c:
      en: |-
        Latency shows how long verification takes, not whether answers break the rules.
    d:
      en: |-
        An answer that breaks the rules produces a finding, not a client error of the guardrail API.
references:
  - title: "Monitor Amazon Bedrock Guardrails using CloudWatch metrics - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/monitoring-guardrails-cw-metrics.html
