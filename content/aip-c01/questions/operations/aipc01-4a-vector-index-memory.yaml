id: aipc01-4a-vector-index-memory
objective: "4.2.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company's RAG application queries an Amazon OpenSearch Serverless classic vector collection directly. The index holds 1,024-dimension float vectors from Amazon Titan Text Embeddings V2, and the compute costs of the collection are high. Tests show that a small drop in recall is acceptable. The company wants to reduce the memory that the vectors need.

    Which combination of actions will meet these requirements? (Choose two.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Re-embed the documents with Titan Text Embeddings V2 at 512 dimensions, and load them into a new index.
    - id: b
      text:
        en: |-
          Increase k in the k-NN queries so that fewer queries are needed to find the relevant results.
    - id: c
      text:
        en: |-
          Create the index with Faiss 16-bit scalar quantization so that vector values are stored in 16 bits instead of 32.
    - id: d
      text:
        en: |-
          Switch the index to the nmslib engine so that the collection stores the vectors in a smaller format.
    - id: e
      text:
        en: |-
          Store the full text of the source document in each vector document so that fewer fields are read at query time.
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |-
      Titan Text Embeddings V2 can produce 512-dimension or 256-dimension vectors instead of 1,024, which halves or quarters the size of each vector, and the company accepts a small change in recall. Classic collections support Faiss 16-bit scalar quantization, which converts 32-bit values to 16-bit values to reduce memory.
  options:
    b:
      en: |-
        A larger k returns more neighbors per query and adds work; it does not change how much memory the vectors use.
    d:
      en: |-
        nmslib is already the default engine of classic collections and is not a compression method; the documented scalar quantization uses Faiss.
    e:
      en: |-
        Storing more text in each document makes the index larger, not smaller.
references:
  - title: "Working with vector search collections - Amazon OpenSearch Service"
    url: https://docs.aws.amazon.com/opensearch-service/latest/developerguide/serverless-vector-search.html
  - title: "Amazon Titan Text Embeddings models - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/titan-embedding-models.html
