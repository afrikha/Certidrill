id: aipc01-4b-gateway-method-calls
objective: "4.3.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A team suspects that its agent requests the full tool list from an Amazon Bedrock AgentCore Gateway on every conversation turn instead of once per session, which adds latency. The gateway exposes MCP tools. The team wants to measure how often the agent lists tools compared with how often it calls them, without changing the agent code.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Graph the gateway Invocations metric by the Method dimension, and compare the values for the tools/list and tools/call methods.
    - id: b
      text:
        en: |-
          Graph the gateway TargetType metric, and compare the requests served by MCP targets with those served by Lambda targets.
    - id: c
      text:
        en: |-
          Enable model invocation logging, and count the tool definitions in the toolConfig field of each logged model request.
    - id: d
      text:
        en: |-
          Graph the gateway UserErrors metric by the Operation dimension, and compare the errors of each gateway operation.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      The gateway Invocations metric counts every data plane request, and its Method dimension carries the MCP operation being invoked, such as tools/list. Graphing it by method shows the ratio between tool listing and tool calls with no code change.
  options:
    b:
      en: |-
        TargetType counts requests by type of target, not by MCP operation, so it cannot separate listing from calling.
    c:
      en: |-
        Tool definitions in model requests show what the model receives, not how often the agent asks the gateway for the list.
    d:
      en: |-
        UserErrors counts failed requests only; the listing calls succeed and would not appear.
references:
  - title: "AgentCore generated gateway observability data - Amazon Bedrock AgentCore"
    url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/observability-gateway-metrics.html
