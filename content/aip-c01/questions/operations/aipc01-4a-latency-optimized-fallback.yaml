id: aipc01-4a-latency-optimized-fallback
objective: "4.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A trading-support company sends time-sensitive requests to a model that supports Amazon Bedrock latency-optimized inference, with the latency parameter of performanceConfig set to optimized. Most responses are fast, but during the busiest hour some responses take as long as standard requests. The API responses for those requests show the standard latency configuration, and no errors are returned.

    What is the cause of this behavior?
body:
  options:
    - id: a
      text:
        en: |-
          The model's latency optimization usage quota was reached, so Amazon Bedrock served those requests at standard latency and standard rates.
    - id: b
      text:
        en: |-
          The requests were throttled, and the SDK retried them automatically with the standard latency configuration after a backoff delay.
    - id: c
      text:
        en: |-
          Latency-optimized inference applies only to the first request of each conversation, and later requests use the standard configuration.
    - id: d
      text:
        en: |-
          The responses reached the maximum response length, so the model stopped early and returned the response with the standard configuration.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      When the latency optimization usage quota for a model is reached, Bedrock attempts to serve requests at standard latency, and those requests are charged at standard latency rates. The latency configuration used for each request appears in the API response and in CloudTrail, which matches what the company observed.
  options:
    b:
      en: |-
        A throttled request returns a ThrottlingException and is counted as a throttle, and SDK retries do not change the latency configuration of the request.
    c:
      en: |-
        There is no per-conversation limit: the latency configuration is set on each request.
    d:
      en: |-
        Reaching the maximum length ends a response with the max_tokens stop reason; it does not change the latency configuration.
references:
  - title: "Optimize model inference for latency - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/latency-optimized-inference.html
