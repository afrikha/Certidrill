id: aipc01-4b-vector-query-trim
objective: "4.2.6"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company's RAG application sends k-NN queries directly to a Classic vector search collection in Amazon OpenSearch Serverless. Each query returns the 20 nearest documents across all 40 product lines, and each hit includes the document's 1,024-dimension embedding, although the application only uses the text and product line fields. Every user question concerns one known product line, which is stored as a filterable field in the index. Both the SearchRequestLatency metric and the response size are above the team's targets.

    Which combination of changes will reduce the retrieval latency? (Choose two.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Add a filter on the product line field to the k-NN query so that the search only considers documents of the product line in the question.
    - id: b
      text:
        en: |-
          Increase k to 100, and remove the documents of the other product lines in the application after the search response arrives.
    - id: c
      text:
        en: |-
          Re-create the index with 3,072-dimension embeddings so that the nearest documents are found more accurately for each question.
    - id: d
      text:
        en: |-
          Use source filtering in the search request so that each hit returns only the text and product line fields, without the embedding.
    - id: e
      text:
        en: |-
          Re-create the index with the Lucene engine and the IVF algorithm to shorten the time that each vector search takes.
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: |-
      A filter in the k-NN query restricts the search to one product line, so less work is done and every returned hit is usable. Classic vector collections include the original vector in search results, so excluding the embedding from the returned source shrinks each response and the time to transfer and parse it.
  options:
    b:
      en: |-
        Retrieving more neighbors and filtering afterward increases the work and the payload instead of reducing them.
    c:
      en: |-
        Larger embeddings increase memory, computation, and payload size, which makes searches slower.
    e:
      en: |-
        Vector search collections do not support the Lucene engine and support only HNSW with Faiss, so IVF is not an option.
references:
  - title: "Working with vector search collections - Amazon OpenSearch Service"
    url: https://docs.aws.amazon.com/opensearch-service/latest/developerguide/serverless-vector-search.html
  - title: "Monitoring OpenSearch Serverless with Amazon CloudWatch - Amazon OpenSearch Service"
    url: https://docs.aws.amazon.com/opensearch-service/latest/developerguide/monitoring-cloudwatch.html
