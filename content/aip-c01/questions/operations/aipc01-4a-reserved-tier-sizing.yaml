id: aipc01-4a-reserved-tier-sizing
objective: "4.1.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A financial services company plans to move a mission-critical assistant to the Amazon Bedrock Reserved tier. The assistant uses prompt caching for a long system prompt. The company has a month of CloudWatch data for the InputTokenCount, OutputTokenCount, CacheReadInputTokenCount, CacheWriteInputTokenCount and EstimatedTPMQuotaUsage metrics. It must size the input tokens-per-minute reservation without paying for capacity it does not use.

    Which metric or metrics should the company use to size the input reservation?
body:
  options:
    - id: a
      text:
        en: |-
          The sum of InputTokenCount, CacheReadInputTokenCount and CacheWriteInputTokenCount at peak, because every input token is sent to the model.
    - id: b
      text:
        en: |-
          The sum of InputTokenCount and CacheWriteInputTokenCount at peak, because cache-read tokens do not consume tokens per minute.
    - id: c
      text:
        en: |-
          EstimatedTPMQuotaUsage at peak, because it reports the tokens-per-minute consumption that the service uses for its throttling decisions.
    - id: d
      text:
        en: |-
          InputTokenCount at peak alone, because tokens written to the prompt cache are billed separately and do not consume tokens per minute.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      The Reserved tier documentation states that TPM consumption includes InputTokenCount and CacheWriteInputTokens, so with prompt caching both must be added when sizing the reservation. Tokens read from the cache do not count toward TPM, so they are left out.
  options:
    a:
      en: |-
        Cache-read tokens do not consume TPM, so including them buys reserved capacity that is never used.
    c:
      en: |-
        EstimatedTPMQuotaUsage is an approximation that does not reflect the reservation-based consumption that drives throttling, and AWS advises against using it alone for capacity planning.
    d:
      en: |-
        Cache writes count toward TPM, so leaving them out undersizes the reservation and sends more requests to the Standard tier overflow.
references:
  - title: "Service tiers for optimizing performance and cost - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/service-tiers-inference.html
  - title: "Monitor bedrock-runtime inference using CloudWatch metrics - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/monitoring-runtime-metrics.html
