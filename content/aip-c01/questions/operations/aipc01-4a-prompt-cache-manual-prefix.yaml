id: aipc01-4a-prompt-cache-manual-prefix
objective: "4.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A machinery manufacturer's support assistant answers technicians' questions about a 60,000-token service manual. Because answers often cross-reference distant sections, the full manual is included in every Converse request, after the system instructions and before the technician's question. Every question is different, and technicians usually ask several within a few minutes. The model supports prompt caching. The company wants to lower input costs and the time to first token.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Store each question and answer in a semantic cache, and return a cached answer when a new question is similar to a previous one.
    - id: b
      text:
        en: |-
          Move the technician's question in front of the manual, and add a cache checkpoint at the end of the request so that the whole request is cached.
    - id: c
      text:
        en: |-
          Add a cache checkpoint right after the manual so that the instructions and the manual form a cached prefix that later requests read from the cache.
    - id: d
      text:
        en: |-
          Send the questions through an Amazon Bedrock batch inference job so that the manual's tokens are billed at the batch price.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      The instructions and the manual are identical in every request, so a checkpoint after them marks a static prefix that later requests read from the cache at a discounted rate instead of processing it again, which also lowers the time to first token. The default 5-minute TTL is reset by each cache hit, which fits several questions within minutes.
  options:
    a:
      en: |-
        Every question is different, so a semantic cache would rarely hit, and each miss still pays for the full manual.
    b:
      en: |-
        The content before a checkpoint must stay identical between requests; placing the changing question first means the prefix never matches.
    d:
      en: |-
        Batch inference does not support prompt caching and is asynchronous, which does not fit technicians waiting for answers.
references:
  - title: "Prompt caching for faster model inference - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/prompt-caching.html
