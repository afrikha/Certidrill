id: aipc01-4a-routing-cross-provider
objective: "4.1.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A bank's assistant serves customers in English and Japanese. Requests from premium customers and requests that the bank tags as regulatory questions must go to a large Anthropic Claude model, and all other requests must go to a small Meta Llama model to reduce cost. The customer tier and the request tags are available in the application, and the routing decision must use them.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Add routing logic to the application that reads the customer tier and the request tags, and calls the Claude model or the Llama model with the Converse API.
    - id: b
      text:
        en: |-
          Create a configured Amazon Bedrock prompt router with the Claude model as the fallback model, the Llama model as the second model and a 10% response quality difference.
    - id: c
      text:
        en: |-
          Create an application inference profile that contains both models so that Amazon Bedrock distributes the requests between them according to their cost.
    - id: d
      text:
        en: |-
          Call the Claude model through its global cross-Region inference profile so that every request is processed at the lowest available on-demand price.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      The routing criteria are business attributes that only the application knows, and the two models come from different providers, so the decision belongs in application or gateway logic. The Converse API keeps the request format consistent across models, so switching the model ID per request is simple.
  options:
    b:
      en: |-
        A prompt router routes only between models of the same family, is optimized for English prompts, and cannot use application-specific data such as the customer tier.
    c:
      en: |-
        An application inference profile tracks usage and costs for one model, in one Region or through a cross-Region profile; it does not route between two models.
    d:
      en: |-
        A global profile lowers the price of the Claude model, but every request would still use it, and the business attributes would be ignored.
references:
  - title: "Understanding intelligent prompt routing in Amazon Bedrock - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/prompt-routing.html
  - title: "Create an application inference profile - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/inference-profiles-create.html
