id: aipc01-4b-gateway-throttle-system-errors
objective: "4.3.4"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    An operations team monitors an Amazon Bedrock AgentCore Gateway that exposes Lambda and MCP tool targets to several agents. It needs one alarm for requests that the service rejects with HTTP 429 and one alarm for requests that fail with HTTP 5xx errors. Neither alarm may fire when agents send malformed tool requests.

    Which gateway metrics should the team use for these alarms? (Choose two.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Throttles
    - id: b
      text:
        en: |-
          UserErrors
    - id: c
      text:
        en: |-
          SystemErrors
    - id: d
      text:
        en: |-
          TargetType
    - id: e
      text:
        en: |-
          Latency
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |-
      In the AWS/Bedrock-AgentCore namespace, the gateway Throttles metric counts requests throttled with status code 429, and SystemErrors counts requests that failed with a 5xx status code. Malformed requests produce 4xx errors other than 429, which are counted in UserErrors and therefore do not affect these two alarms.
  options:
    b:
      en: |-
        UserErrors counts 4xx failures except 429, which is exactly the malformed tool requests that must not trigger the alarms.
    d:
      en: |-
        TargetType counts requests served by each type of target; it does not report failures.
    e:
      en: |-
        Latency measures the time to the first response token; it does not count throttled or failed requests.
references:
  - title: "AgentCore generated gateway observability data - Amazon Bedrock AgentCore"
    url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/observability-gateway-metrics.html
