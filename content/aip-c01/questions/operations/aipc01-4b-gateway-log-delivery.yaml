id: aipc01-4b-gateway-log-delivery
objective: "4.3.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company exposes internal APIs to its agents through an Amazon Bedrock AgentCore Gateway. For forensic investigations, auditors need the gateway's application logs of each tool request. The company's agents on AgentCore Runtime already write logs to their own log groups, but no log group exists for the gateway.

    What should the company do?
body:
  options:
    - id: a
      text:
        en: |-
          Increase the retention of the agent runtime log groups, because the gateway writes its logs to the log group of the calling agent.
    - id: b
      text:
        en: |-
          Enable model invocation logging so that each tool request that passes through the gateway is recorded with its input and output.
    - id: c
      text:
        en: |-
          Configure APPLICATION_LOGS log delivery for the gateway, because AgentCore does not set up gateway log destinations automatically.
    - id: d
      text:
        en: |-
          Enable CloudWatch Transaction Search in the account so that the gateway creates a vended log group for its application logs.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      AgentCore Runtime creates a log group for its service-provided logs by default, but for memory, gateway, and built-in tools AgentCore does not configure log destinations automatically. Setting up log delivery for the gateway, for example to a log group under /aws/vendedlogs/bedrock-agentcore/, gives auditors its application logs.
  options:
    a:
      en: |-
        The gateway does not write into the runtime log groups of the agents, so a longer retention there does not capture its logs.
    b:
      en: |-
        Invocation logging covers model calls on the Bedrock runtime, not requests that pass through the gateway.
    d:
      en: |-
        Transaction Search ingests spans for tracing; it does not configure the gateway's application log delivery.
references:
  - title: "Add observability to your Amazon Bedrock AgentCore resources - Amazon Bedrock AgentCore"
    url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/observability-configure.html
