id: aipc01-4a-sagemaker-concurrency-metric
objective: "4.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company self-hosts an LLM on an Amazon SageMaker AI real-time endpoint and streams responses that take 10 to 40 seconds. The endpoint scales with target tracking on SageMakerVariantInvocationsPerInstance. During sudden bursts, requests wait inside the model containers for a long time before new instances are added. The company wants the endpoint to react to bursts faster.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Lower the ScaleInCooldown of the existing policy so that instances are released sooner after each burst ends.
    - id: b
      text:
        en: |-
          Replace the policy with target tracking on the CPUUtilization metric of the instances, because generation saturates the processors.
    - id: c
      text:
        en: |-
          Replace the policy with target tracking on the SageMakerVariantConcurrentRequestsPerModelHighResolution predefined metric.
    - id: d
      text:
        en: |-
          Keep the policy, and lower its target value for SageMakerVariantInvocationsPerInstance so that scaling starts at fewer invocations.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      ConcurrentRequestsPerModel counts the requests a model container has received, including those queued inside it, and the high-resolution metric is emitted every 10 seconds instead of every minute. For streaming models, a request is tracked until the last token is sent, which fits long LLM requests, so the policy scales out much faster during bursts.
  options:
    a:
      en: |-
        The scale-in cooldown controls how quickly capacity is removed, not how fast the endpoint scales out.
    b:
      en: |-
        LLM generation on these instances is bound by the GPU, so CPU utilization does not reflect the load of the model container.
    d:
      en: |-
        InvocationsPerInstance is still a standard metric emitted once per minute, and a per-minute invocation count does not reflect requests that last tens of seconds.
references:
  - title: "Define a scaling policy - Amazon SageMaker AI"
    url: https://docs.aws.amazon.com/sagemaker/latest/dg/endpoint-auto-scaling-add-code-define.html
