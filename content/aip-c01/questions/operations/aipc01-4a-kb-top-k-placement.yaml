id: aipc01-4a-kb-top-k-placement
objective: "4.2.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A developer configures RetrieveAndGenerate for an Amazon Bedrock knowledge base that uses an Anthropic Claude model. The developer sets temperature and topP in inferenceConfig.textInferenceConfig and adds top_k to the same object. Tests show that changing top_k has no effect on the responses. The developer needs top_k to be applied.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Rename the key to topK in textInferenceConfig so that it uses the same casing as the other parameters.
    - id: b
      text:
        en: |-
          Describe the temperature, topP and top_k values in the prompt template as instructions to the model.
    - id: c
      text:
        en: |-
          Move top_k to additionalModelRequestFields, and keep temperature and topP in textInferenceConfig.
    - id: d
      text:
        en: |-
          Set top_k in the vectorSearchConfiguration of the retrieval configuration so that it applies to the whole query.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      textInferenceConfig accepts the common inference parameters and ignores keys it does not recognize, so top_k had no effect. Model-specific parameters such as top_k belong in additionalModelRequestFields; a parameter must not be set in both places, which would cause a validation exception.
  options:
    a:
      en: |-
        topK is not a textInferenceConfig field either, so it would still be ignored.
    b:
      en: |-
        Text in the prompt does not set sampling parameters; the model applies them only as inference parameters.
    d:
      en: |-
        vectorSearchConfiguration controls retrieval, such as the number of results, the search type and filters, not how the model samples tokens.
references:
  - title: "Configure and customize queries and response generation - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/kb-test-config.html
