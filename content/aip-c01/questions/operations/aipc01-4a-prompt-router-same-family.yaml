id: aipc01-4a-prompt-router-same-family
objective: "4.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A travel company's English-language assistant on Amazon Bedrock uses Amazon Nova Pro for every request. Analysis shows that most prompts are simple questions that Amazon Nova Lite answers equally well, while some complex itinerary requests need Nova Pro. The company wants to lower inference costs without degrading answers, with the LEAST operational overhead.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Deploy an AWS Lambda function that classifies each prompt with keyword rules and then calls Nova Lite or Nova Pro according to the result.
    - id: b
      text:
        en: |-
          Purchase Provisioned Throughput for Nova Pro with a 6-month commitment to lower the price that the company pays for every request.
    - id: c
      text:
        en: |-
          Create an Amazon Bedrock prompt router with Nova Lite and Nova Pro, and send the requests to the router instead of to the model ID.
    - id: d
      text:
        en: |-
          Send all requests to Nova Lite, and add few-shot examples to the prompt so that it can also handle the complex itinerary requests.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      Intelligent prompt routing exposes a single serverless endpoint that predicts the response quality of each model for each request and routes it to the model with the best combination of quality and cost. Nova Lite and Nova Pro belong to the same family, which the router requires, and English prompts are the case it is optimized for, so no routing code is needed.
  options:
    a:
      en: |-
        A custom classifier works but adds code to build, tune and operate, and keyword rules predict complexity less reliably than the managed router.
    b:
      en: |-
        Provisioned Throughput is billed hourly for reserved capacity; it does not move simple prompts to the cheaper model.
    d:
      en: |-
        Sending complex requests to the smaller model degrades the answers that need Nova Pro, which the company must avoid.
references:
  - title: "Understanding intelligent prompt routing in Amazon Bedrock - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/prompt-routing.html
