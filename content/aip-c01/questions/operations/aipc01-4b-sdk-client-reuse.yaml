id: aipc01-4b-sdk-client-reuse
objective: "4.2.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A Python AWS Lambda function handles chat requests by calling the Amazon Bedrock Converse API. Tracing shows that every warm invocation spends noticeable time creating a boto3 Bedrock runtime client and opening a new TLS connection before the model call starts. The team wants to remove this overhead with the smallest code change.

    What should the team do?
body:
  options:
    - id: a
      text:
        en: |-
          Configure provisioned concurrency on the function so that execution environments are initialized before the requests arrive.
    - id: b
      text:
        en: |-
          Increase the memory of the function so that it receives more CPU to create the client and complete the TLS handshake faster.
    - id: c
      text:
        en: |-
          Create the boto3 client outside the function handler so that warm invocations reuse the client and its open connections.
    - id: d
      text:
        en: |-
          Replace the Converse API call with the InvokeModel API so that each request uses a smaller, model-specific request body.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      Lambda reuses execution environments, and AWS recommends initializing SDK clients and connections outside the handler so that later invocations in the same environment reuse them. Moving the client creation to the initialization code removes the per-request client setup and connection handshake from warm invocations.
  options:
    a:
      en: |-
        Provisioned concurrency pre-runs the initialization code, but a client created inside the handler is still rebuilt on every invocation.
    b:
      en: |-
        More CPU shortens the work slightly but still repeats it on every request instead of removing it.
    d:
      en: |-
        The choice of API does not change how often the client and its connections are created.
references:
  - title: "Best practices for working with AWS Lambda Event Functions - AWS Lambda"
    url: https://docs.aws.amazon.com/lambda/latest/dg/best-practices.html
