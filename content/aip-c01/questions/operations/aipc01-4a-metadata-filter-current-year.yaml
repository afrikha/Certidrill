id: aipc01-4a-metadata-filter-current-year
objective: "4.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A government agency's HR assistant uses an Amazon Bedrock knowledge base with an Amazon S3 data source that holds the leave policies of the last ten years. An audit team still queries the older policies. Employees' questions always concern the current policies, but answers often quote older versions. The agency wants faster and more relevant retrieval for employees without removing the older documents.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Delete the policy documents of previous years from the bucket, and synchronize the data source again.
    - id: b
      text:
        en: |-
          Increase numberOfResults so that the chunks of the current policies are included among the retrieved results.
    - id: c
      text:
        en: |-
          Enable query decomposition so that each employee question is split into one sub-query for each policy year.
    - id: d
      text:
        en: |-
          Add a policy_year attribute in a .metadata.json file per document, and filter employee queries on the current year.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      Metadata filters restrict retrieval to chunks whose attributes match, so employee queries search only the current policies, which improves relevance and narrows the search. For S3 data sources, the attributes are supplied in a fileName.extension.metadata.json file, and the audit queries can use a different filter or none.
  options:
    a:
      en: |-
        Deleting the older policies breaks the audit team's queries.
    b:
      en: |-
        More results also bring more outdated chunks and tokens, so the model can still quote older policies.
    c:
      en: |-
        Decomposition generates more queries across all years, which adds latency without excluding outdated documents.
references:
  - title: "Configure and customize queries and response generation - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/kb-test-config.html
