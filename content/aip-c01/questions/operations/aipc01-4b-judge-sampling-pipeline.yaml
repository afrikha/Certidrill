id: aipc01-4b-judge-sampling-pipeline
objective: "4.3.6"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    A company's RAG assistant on Amazon Bedrock occasionally produces fluent answers that the retrieved passages do not support. The company wants a daily hallucination metric in CloudWatch, computed from a sample of real production conversations, and an alarm when it degrades. The check must not add latency to user requests or change the answers that users receive. Model invocation logging to Amazon S3 is enabled, and the logged prompts include the retrieved passages.

    Which combination of steps will meet these requirements? (Choose two.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Add a contextual grounding check with the BLOCK action to the guardrail that the application applies to every generated answer.
    - id: b
      text:
        en: |-
          Create an Amazon SageMaker AI Model Monitor data quality schedule on the invocation logs to detect drift in the generated answers.
    - id: c
      text:
        en: |-
          Each day, sample logged prompts and responses, and score them in a judge-based Bedrock evaluation job with the Builtin.Faithfulness metric.
    - id: d
      text:
        en: |-
          Enable CloudTrail data events for Amazon Bedrock, and count each day the number of responses that contain citations to retrieved passages.
    - id: e
      text:
        en: |-
          Publish the share of low faithfulness scores from each daily run as a custom CloudWatch metric, and create an alarm on that metric.
answer: { optionIds: [ c, e ] }
explanation:
  correct:
    en: |-
      A judge-based evaluation job can score responses that the company brings itself, so sampled production records are evaluated offline, without touching the request path. Builtin.Faithfulness flags information that is not found in the prompt, which contains the retrieved passages; publishing the share of low scores as a custom metric gives the daily hallucination metric and its alarm.
  options:
    a:
      en: |-
        A blocking grounding check runs in the request path and changes the answers users receive, which the company forbids.
    b:
      en: |-
        SageMaker AI Model Monitor has been closed to new customers since July 30, 2026, and data quality drift does not measure faithfulness.
    d:
      en: |-
        CloudTrail does not record response content, and the presence of citations does not show whether an answer is supported.
references:
  - title: "Create a prompt dataset for a model evaluation job that uses a model as judge - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/model-evaluation-prompt-datasets-judge.html
  - title: "Use metrics to understand model performance - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/model-evaluation-metrics.html
