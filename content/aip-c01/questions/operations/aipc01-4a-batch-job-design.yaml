id: aipc01-4a-batch-job-design
objective: "4.2.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A research company must run 2 million prompts through an Amazon Bedrock base model to label scientific abstracts. No user waits for the results, and some prompts must call a classification tool that is defined in the request. The company wants the lowest inference cost, no polling code, and its interactive applications must keep their on-demand capacity.

    Which combination of steps will meet these requirements? (Choose three.)
body:
  choose: 3
  options:
    - id: a
      text:
        en: |-
          Write the prompts as JSONL records in Amazon S3, and create batch inference jobs with CreateModelInvocationJob.
    - id: b
      text:
        en: |-
          Run the jobs against a Provisioned Throughput model so that the labeling has guaranteed capacity.
    - id: c
      text:
        en: |-
          Create the jobs with the InvokeModel invocation type, and write the records that use the tool in the model's native request format.
    - id: d
      text:
        en: |-
          Add cache checkpoints to the shared instructions of each record to receive the cache-read price in the batch jobs.
    - id: e
      text:
        en: |-
          Create an Amazon EventBridge rule for batch job state changes that starts the downstream processing.
    - id: f
      text:
        en: |-
          Create the jobs with the Converse invocation type, and include a toolConfig object in the records that use the tool.
answer: { optionIds: [ a, c, e ] }
explanation:
  correct:
    en: |-
      Batch inference reads prompts from Amazon S3, writes results to S3 and is priced lower than on-demand inference, so the labeling no longer sends on-demand requests. Records that use tools need the InvokeModel invocation type with native request bodies, and EventBridge delivers job state changes so that downstream processing starts without polling.
  options:
    b:
      en: |-
        Batch inference is not supported for provisioned models.
    d:
      en: |-
        Prompt caching is not supported with batch inference.
    f:
      en: |-
        Batch jobs with the Converse invocation type do not support tool calling; records that include toolConfig fail with a 400 error.
references:
  - title: "Process multiple prompts with batch inference - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/batch-inference.html
  - title: "CreateModelInvocationJob - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/APIReference/API_CreateModelInvocationJob.html
