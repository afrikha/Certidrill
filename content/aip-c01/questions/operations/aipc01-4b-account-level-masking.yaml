id: aipc01-4b-account-level-masking
objective: "4.3.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company has dozens of teams that build Amazon Bedrock applications, and each team creates its own CloudWatch Logs log groups for invocation logs and application logs, with new log groups created every week. The compliance team requires that credentials and personal data in every current and future log group of the account be masked for everyone who lacks a specific permission, without relying on each team to configure it.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Create a log group-level data protection policy for each existing log group, and ask every team to add the same policy to each new log group.
    - id: b
      text:
        en: |-
          Create an account-level CloudWatch Logs data protection policy with the needed managed data identifiers, and grant logs:Unmask only to authorized roles.
    - id: c
      text:
        en: |-
          Encrypt every log group with one AWS KMS customer managed key, and allow only the compliance team and its roles to use the key to decrypt.
    - id: d
      text:
        en: |-
          Add a sensitive information filter with the ANONYMIZE action to every guardrail in the account so that the content that is logged is masked.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      An account-level data protection policy applies to the existing log groups and to log groups created in the future, so masking does not depend on each team. Sensitive data that matches the selected identifiers is masked at egress points such as Logs Insights, and only principals with the logs:Unmask permission can see it in clear text.
  options:
    a:
      en: |-
        Per-log-group policies rely on every team configuring each new log group, which the compliance team wants to avoid.
    c:
      en: |-
        Encryption protects data at rest; anyone allowed to read a log group would still see the values in clear text.
    d:
      en: |-
        Guardrails act on model inputs and outputs, change what users receive, and do not cover application logs.
references:
  - title: "Help protect sensitive log data with masking - Amazon CloudWatch Logs"
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/logs/mask-sensitive-log-data.html
