id: aipc01-4a-tenant-token-attribution
objective: "4.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A SaaS company embeds an Amazon Bedrock assistant in its product. All requests come from one backend that uses a single IAM role, and thousands of new tenants sign up every week. The finance team needs monthly token consumption per tenant and per product feature for internal chargeback, and engineers must be able to inspect the individual requests of a tenant whose usage spikes. The company does not want to create AWS resources for each tenant.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Create an application inference profile with cost allocation tags for each tenant, and make the backend call the profile ARN of the tenant that sent each request.
    - id: b
      text:
        en: |-
          Enable model invocation logging, pass the tenant ID and feature in requestMetadata on each Converse call, and aggregate tokens with Logs Insights.
    - id: c
      text:
        en: |-
          Build a CloudWatch dashboard on the InputTokenCount and OutputTokenCount metrics of the model, and split the totals between tenants by their number of active users.
    - id: d
      text:
        en: |-
          Make the backend assume its role with an IAM session tag for the tenant on each request, and read the cost of each tenant in AWS Cost Explorer.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      requestMetadata attaches key-value tags such as the tenant and the feature to each call without creating any resource, and model invocation logging records them together with the token counts of each request. CloudWatch Logs Insights then aggregates usage per tenant and feature, and engineers can inspect the individual requests.
  options:
    a:
      en: |-
        Application inference profiles give invoice-level attribution, but one profile per tenant means creating and managing thousands of AWS resources, and the feature dimension is still missing.
    c:
      en: |-
        The Bedrock runtime metrics have no tenant dimension, and splitting totals by active users is an estimate, not per-request data.
    d:
      en: |-
        Session tags surface only as aggregated billing data, not per request, so engineers could not inspect individual calls, and the feature dimension is missing.
references:
  - title: "Per-request metadata tagging - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/cost-mgmt-request-metadata.html
  - title: "Monitor model invocation using CloudWatch Logs and Amazon S3 - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/model-invocation-logging.html
