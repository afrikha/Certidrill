id: aipc01-4b-output-length-drift
objective: "4.3.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company's summarization service on Amazon Bedrock should produce short summaries, and its traffic volume varies strongly by hour and weekday. After a silent prompt template change last quarter, summaries became twice as long and nobody noticed for weeks. The company wants an alarm when the average length of each response drifts from its usual pattern, whatever the traffic volume, without maintaining thresholds.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Create a CloudWatch alarm based on an anomaly detection model of the OutputTokenCount metric of the model, with the Sum statistic.
    - id: b
      text:
        en: |-
          Create a CloudWatch alarm based on an anomaly detection model of a metric math expression that divides OutputTokenCount by Invocations.
    - id: c
      text:
        en: |-
          Create a CloudWatch alarm with a static threshold on the OutputTokenCount metric, set to twice its average value over the last month.
    - id: d
      text:
        en: |-
          Create an AWS Cost Anomaly Detection monitor for Amazon Bedrock that alerts through Amazon SNS when the daily spend becomes unusual.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      Dividing OutputTokenCount by Invocations gives the average output tokens per response, which is independent of traffic volume. CloudWatch anomaly detection can be applied to metric math expressions and learns hourly, daily, and weekly patterns, so an alarm on the band catches a drift in response length without hand-set thresholds.
  options:
    a:
      en: |-
        The total output token count rises and falls with traffic volume, so a doubling of response length could stay inside the band when traffic is low.
    c:
      en: |-
        A static threshold on total tokens mixes volume and length and must be maintained by hand.
    d:
      en: |-
        Spending also depends on traffic volume, and Cost Anomaly Detection can take up to a day to detect a change.
references:
  - title: "Using CloudWatch anomaly detection - Amazon CloudWatch"
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/CloudWatch_Anomaly_Detection.html
  - title: "Monitor bedrock-runtime inference using CloudWatch metrics - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/monitoring-runtime-metrics.html
