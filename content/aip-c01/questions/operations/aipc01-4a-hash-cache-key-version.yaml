id: aipc01-4a-hash-cache-key-version
objective: "4.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A tax software company caches complete model responses in Amazon DynamoDB, keyed by a SHA-256 hash of the user's question. During a canary rollout, versions 7 and 8 of the prompt template served users at the same time, and some version 8 users received answers generated with version 7. The company also changes models a few times a year. The cache must never return an answer produced with a different template version, model or inference parameters, and entries must expire without manual purges.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Hash the normalized question with the model ID, inference parameters and template version to form the key, and give each item a TTL attribute.
    - id: b
      text:
        en: |-
          Keep the question hash as the key, and delete all items from the table each time that a new version of the prompt template is deployed to production.
    - id: c
      text:
        en: |-
          Replace the hash lookup with a semantic cache so that similar questions reuse the same stored answer across template versions.
    - id: d
      text:
        en: |-
          Keep the question hash as the key, and enable prompt caching in Amazon Bedrock so that the template is cached together with the model.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      Including every input that changes the answer (model ID, inference parameters and template version) in the hash gives each combination its own entries, so versions that run side by side never share answers. A DynamoDB TTL attribute lets DynamoDB delete expired items automatically; because deletion can take a few days, the application also ignores items whose expiration time has passed.
  options:
    b:
      en: |-
        During a canary rollout both versions are live, so a purge at deployment cannot separate their answers, and purges are manual.
    c:
      en: |-
        A semantic cache keyed on the question alone still mixes answers across versions, and it loosens matching instead of tightening it.
    d:
      en: |-
        Prompt caching stores an input prefix for the model; it does not control which stored response the DynamoDB cache returns.
references:
  - title: "Using time to live (TTL) in DynamoDB - Amazon DynamoDB"
    url: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/TTL.html
  - title: "Best practices - Amazon ElastiCache"
    url: https://docs.aws.amazon.com/AmazonElastiCache/latest/dg/semantic-caching-best-practices.html
