id: aipc01-4b-cost-anomaly-new-service
objective: "4.3.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company started to use Amazon Bedrock in a new account four days ago and immediately created an AWS Cost Anomaly Detection monitor for AWS services. Yesterday, a misconfigured batch script doubled the Bedrock spend for several hours, and no anomaly was reported. The company wants to be alerted about such spikes during the coming weeks as well.

    What explains the missing alert, and what should the company do?
body:
  options:
    - id: a
      text:
        en: |-
          Cost Anomaly Detection does not monitor Amazon Bedrock charges; create a cost allocation tag for Bedrock and a monitor for that tag.
    - id: b
      text:
        en: |-
          The monitor alerts only on weekly aggregated reports; change the alert subscription to individual alerts that are sent through Amazon SNS.
    - id: c
      text:
        en: |-
          Cost Anomaly Detection detects anomalies only for member accounts; move the account into an organization and monitor it as a member account.
    - id: d
      text:
        en: |-
          A new service needs 10 days of usage history before anomalies are detected; add CloudWatch alarms on the Bedrock token metrics in the meantime.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      Cost Anomaly Detection needs 10 days of historical usage for a new service before it can detect anomalies for that service, and it can take up to 24 hours after usage to detect one. Static-threshold CloudWatch alarms on InputTokenCount and OutputTokenCount give near-real-time protection until the anomaly model has enough history.
  options:
    a:
      en: |-
        Cost Anomaly Detection covers AWS services, including third-party foundation models on Amazon Bedrock; a tag is not required.
    b:
      en: |-
        Even with individual alerts, no anomaly can be detected for a service that has less than 10 days of history.
    c:
      en: |-
        Cost Anomaly Detection can analyze all AWS services of an account; membership in an organization is not the cause.
references:
  - title: "Detecting unusual spend with AWS Cost Anomaly Detection - AWS Cost Management"
    url: https://docs.aws.amazon.com/cost-management/latest/userguide/manage-ad.html
  - title: "Monitor bedrock-runtime inference using CloudWatch metrics - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/monitoring-runtime-metrics.html
