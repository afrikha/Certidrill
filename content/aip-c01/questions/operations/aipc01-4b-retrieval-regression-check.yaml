id: aipc01-4b-retrieval-regression-check
objective: "4.3.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company changes the parsing and chunking settings of its Amazon Bedrock knowledge base several times per quarter. After one change, retrieval silently stopped returning a key policy document for many questions, and nobody noticed for weeks, although every document was still indexed. The company has 300 representative questions together with the passages that should be retrieved for each one. It wants an automated check after every change that measures whether the expected information is still retrieved, with as little custom code as possible.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Create a CloudWatch alarm on the SearchableDocuments metric of the vector collection so that a drop in indexed documents sends a notification.
    - id: b
      text:
        en: |-
          Enable knowledge base log delivery, and alarm when an ingestion job reports documents with the FAILED status after a configuration change.
    - id: c
      text:
        en: |-
          Run an Amazon Bedrock retrieve-only RAG evaluation job with the context coverage metric on the 300 questions and their ground truth after each change, and compare the scores.
    - id: d
      text:
        en: |-
          Run an Amazon Bedrock model evaluation job with the Builtin.Helpfulness metric on the 300 questions sent directly to the generation model after each change.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      A retrieve-only RAG evaluation job evaluates the passages that the knowledge base returns, and the context coverage metric measures how much of the ground truth information the retrieved texts cover; it requires a ground truth in the prompt dataset. Running it after each change and comparing scores detects relevance regressions that indexing metrics cannot see.
  options:
    a:
      en: |-
        The documents were still indexed, so the document count does not change when retrieval quality drops.
    b:
      en: |-
        No ingestion failure occurred; the regression came from how content was parsed and chunked, not from failed documents.
    d:
      en: |-
        Questions sent directly to the model bypass retrieval, so the job cannot measure what the knowledge base returns.
references:
  - title: "Use metrics to understand RAG system performance - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/knowledge-base-evaluation-metrics.html
