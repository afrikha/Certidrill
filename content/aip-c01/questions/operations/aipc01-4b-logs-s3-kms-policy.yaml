id: aipc01-4b-logs-s3-kms-policy
objective: "4.3.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company delivers Amazon Bedrock model invocation logs to an Amazon S3 bucket in the same account and Region. To meet a compliance rule, the bucket's default encryption was changed to SSE-KMS with a customer managed key. Since that change, the ModelInvocationLogsS3DeliveryFailure metric reports failures and no new log objects appear. The bucket policy that allows Amazon Bedrock to write logs is unchanged.

    What should the company do to restore log delivery while keeping the customer managed key?
body:
  options:
    - id: a
      text:
        en: |-
          Grant kms:Decrypt and kms:Encrypt on the key to the IAM role that the applications use to call the Amazon Bedrock runtime APIs.
    - id: b
      text:
        en: |-
          Change the bucket's default encryption back to SSE-S3, and encrypt the log objects with the key later by using S3 Batch Operations.
    - id: c
      text:
        en: |-
          Add a key policy statement that allows bedrock.amazonaws.com to call kms:GenerateDataKey, with aws:SourceAccount and aws:SourceArn conditions.
    - id: d
      text:
        en: |-
          Enable ACLs on the bucket, and grant the Amazon Bedrock service the WRITE permission on the bucket objects through the bucket ACL.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      When the log bucket uses SSE-KMS, the key policy must allow the Amazon Bedrock service principal to perform kms:GenerateDataKey, restricted with the aws:SourceAccount and aws:SourceArn conditions. Without that permission, Bedrock cannot write encrypted objects, which explains the delivery failures.
  options:
    a:
      en: |-
        Amazon Bedrock writes the logs as the bedrock.amazonaws.com service principal; the application role is not involved in delivery.
    b:
      en: |-
        Reverting to SSE-S3 breaks the compliance rule that requires the customer managed key.
    d:
      en: |-
        The bucket ACL must be disabled for the logging bucket policy to take effect; ACLs do not grant KMS permissions either.
references:
  - title: "Monitor model invocation using CloudWatch Logs and Amazon S3 - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/model-invocation-logging.html
