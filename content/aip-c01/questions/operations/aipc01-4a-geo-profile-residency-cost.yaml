id: aipc01-4a-geo-profile-residency-cost
objective: "4.1.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A European insurer runs a claims assistant on Amazon Bedrock in the eu-central-1 Region with an in-Region model ID. Company policy requires that prompts and responses are processed only in EU Regions. During peaks, some requests are throttled, and finance wants the lowest on-demand price that respects the policy. Traffic is unpredictable, so the company does not want a capacity commitment.

    Which solution will meet these requirements MOST cost-effectively?
body:
  options:
    - id: a
      text:
        en: |-
          Call the model through its global cross-Region inference profile to receive the global price and spread requests across all supported commercial Regions.
    - id: b
      text:
        en: |-
          Call the model through its EU geographic cross-Region inference profile so that requests are routed only to the EU Regions of the profile.
    - id: c
      text:
        en: |-
          Purchase Provisioned Throughput with no commitment in eu-central-1, sized for the peaks, and delete it outside business hours.
    - id: d
      text:
        en: |-
          Send all requests with the Priority service tier so that they are served before other on-demand requests in eu-central-1.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      A geographic profile routes requests only to Regions inside its geography, which keeps processing in the EU while distributing requests across several EU Regions, with no commitment. Cross-Region inference adds no routing cost; the price is that of the Region from which the profile is called.
  options:
    a:
      en: |-
        The global profile is about 10% cheaper, but it can process requests in any supported commercial Region, which breaks the EU-only policy.
    c:
      en: |-
        Provisioned Throughput is billed hourly for the model units, so capacity sized for unpredictable peaks costs more than on-demand pricing and needs constant management.
    d:
      en: |-
        Priority costs a premium over Standard, so it is not the lowest price, and it adds no Regions to absorb the peaks.
references:
  - title: "Route model inference requests across AWS Regions with cross-Region inference - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/cross-region-inference.html
  - title: "Service tiers for optimizing performance and cost - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/service-tiers-inference.html
