id: aipc01-4a-hybrid-exact-identifiers
objective: "4.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An industrial supplier's assistant uses an Amazon Bedrock knowledge base with an Amazon OpenSearch Serverless vector store that has a filterable text field. Technicians often search with exact part numbers such as VX-4471-B, and semantic search returns chunks about similar parts with different numbers. The company wants retrieval to match exact identifiers while still understanding natural-language questions.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Raise numberOfResults from 5 to 50 so that the chunk with the exact part number is more likely to be retrieved.
    - id: b
      text:
        en: |-
          Set overrideSearchType to HYBRID in the retrieval configuration so that keyword and vector search results are combined.
    - id: c
      text:
        en: |-
          Re-embed the documents with a higher-dimension embedding model so that similar part numbers get more distinct vectors.
    - id: d
      text:
        en: |-
          Switch the data source to semantic chunking so that each chunk contains the description of a single part.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      Hybrid search combines vector search with raw text search, so exact strings such as part numbers match while natural-language questions still work. It is supported for OpenSearch Serverless vector stores that contain a filterable text field.
  options:
    a:
      en: |-
        More results add tokens and latency, and semantic ranking can still place similar parts above the exact one.
    c:
      en: |-
        Embeddings capture meaning, so part numbers that differ by a character stay close, and re-embedding the corpus is costly.
    d:
      en: |-
        Chunk boundaries do not change how embeddings compare part numbers.
references:
  - title: "Configure and customize queries and response generation - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/kb-test-config.html
