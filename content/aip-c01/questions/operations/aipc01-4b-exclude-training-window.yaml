id: aipc01-4b-exclude-training-window
objective: "4.3.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company uses a CloudWatch alarm based on an anomaly detection model to watch the InputTokenCount metric of its Amazon Bedrock application. Ten days ago, a planned load test sent ten times the usual token volume for one day. Since then, the expected band has been much wider, and a real burst caused by a client bug yesterday did not trigger the alarm. The company wants the alarm to reflect normal traffic again with the LEAST effort.

    What should the company do?
body:
  options:
    - id: a
      text:
        en: |-
          Use an AWS Lambda function on a schedule that deletes and re-creates the anomaly detection model every two weeks.
    - id: b
      text:
        en: |-
          Exclude the time period of the load test from the data that is used to train the anomaly detection model.
    - id: c
      text:
        en: |-
          Replace the anomaly detection alarm with a static threshold that equals the average value of the last two weeks.
    - id: d
      text:
        en: |-
          Change the alarm to the Average statistic so that the load test has less influence on the expected band.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      After anomaly detection is enabled on a metric, specific time periods can be excluded from model training, which is intended for deployments and other unusual events. Excluding the load test lets the model rebuild a band from normal traffic only, so real bursts leave the band again.
  options:
    a:
      en: |-
        A scheduled re-creation needs custom code and, until the load test leaves the two-week training window, the new model would learn from it again.
    c:
      en: |-
        The two-week average includes the load test, and a static threshold loses the daily and weekly patterns that the band follows.
    d:
      en: |-
        An anomaly detection model is specific to one statistic; a model for the Average statistic would still learn from the load test period.
references:
  - title: "Using CloudWatch anomaly detection - Amazon CloudWatch"
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/CloudWatch_Anomaly_Detection.html
