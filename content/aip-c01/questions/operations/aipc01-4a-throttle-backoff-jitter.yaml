id: aipc01-4a-throttle-backoff-jitter
objective: "4.2.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company's assistant on Amazon Bedrock receives short traffic bursts a few times an hour, and some requests fail with ThrottlingException during those bursts. Average usage is well below the model's quotas, and a delay of a few seconds for some requests is acceptable. The company wants to reduce failed requests with the LEAST effort and cost.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Purchase Provisioned Throughput for the model so that the bursts are always served from dedicated capacity.
    - id: b
      text:
        en: |-
          Set the SDK maximum attempts to 1 so that throttled requests fail immediately and users can try again.
    - id: c
      text:
        en: |-
          Configure the SDK standard retry mode, which retries throttled requests with exponential backoff and jitter.
    - id: d
      text:
        en: |-
          Request a quota increase for every Amazon Bedrock quota in the Region through Service Quotas.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      The standard retry mode retries throttling errors such as ThrottlingException with exponential backoff and full jitter, so short bursts are absorbed with a delay of seconds at no extra cost. Jitter randomizes the delays so that clients that failed together do not retry together.
  options:
    a:
      en: |-
        Provisioned Throughput is billed hourly for capacity that is needed only during short bursts, which is neither the least effort nor the least cost.
    b:
      en: |-
        A maximum of 1 attempt disables retries, which increases the number of failed requests.
    d:
      en: |-
        Average usage is far below the quotas; broad quota requests take effort and do not address short bursts that retries absorb.
references:
  - title: "Retry behavior - AWS SDKs and Tools"
    url: https://docs.aws.amazon.com/sdkref/latest/guide/feature-retry-behavior.html
