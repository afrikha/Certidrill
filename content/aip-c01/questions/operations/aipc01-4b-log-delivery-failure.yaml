id: aipc01-4b-log-delivery-failure
objective: "4.3.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company relies on Amazon Bedrock model invocation logs in CloudWatch Logs for its operational dashboards. Last month, a change to the IAM role that Bedrock uses for log delivery went unnoticed for three days: no invocation logs were written although the applications kept working. The company wants to be alerted within minutes the next time logs cannot be delivered.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Create an AWS Cost Anomaly Detection monitor for Amazon CloudWatch that sends an alert when log ingestion charges drop unexpectedly.
    - id: b
      text:
        en: |-
          Enable CloudTrail data events for Amazon Bedrock, and alarm when no InvokeModel or Converse events are recorded for 15 minutes.
    - id: c
      text:
        en: |-
          Create a CloudWatch alarm on the InvocationClientErrors metric, because failed log deliveries are reported as client errors of the request.
    - id: d
      text:
        en: |-
          Create a CloudWatch alarm on the ModelInvocationLogsCloudWatchDeliveryFailure metric that Amazon Bedrock publishes in the AWS/Bedrock namespace.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      Amazon Bedrock emits delivery success and failure metrics for model invocation logging, such as ModelInvocationLogsCloudWatchDeliveryFailure, for each delivery attempt. An alarm on this metric detects a broken delivery role within minutes, even while the model calls themselves keep succeeding.
  options:
    a:
      en: |-
        Cost Anomaly Detection works on cost data that can be up to 24 hours late, so it cannot alert within minutes.
    b:
      en: |-
        Model invocations are management events and keep being recorded while the applications run, so their absence would not reveal a log delivery failure.
    c:
      en: |-
        The model invocations succeed; a failed log delivery does not turn the invocation into a client error.
references:
  - title: "Monitor bedrock-runtime inference using CloudWatch metrics - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/monitoring-runtime-metrics.html
  - title: "Monitor model invocation using CloudWatch Logs and Amazon S3 - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/model-invocation-logging.html
