id: aipc01-4a-precompute-morning-briefs
objective: "4.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A wealth-management firm generates a personalized market briefing for each of its 50,000 clients when the client logs in. Most clients log in between 08:00 and 09:00, when briefings take 20 seconds to appear and many on-demand requests are throttled. Each briefing depends only on the client's portfolio and on market data that is final at 02:00. The firm wants briefings to load instantly at the lowest cost.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Send the login-time requests with the Priority service tier so that the briefings are generated before other on-demand requests.
    - id: b
      text:
        en: |-
          Purchase Provisioned Throughput sized for the 08:00 peak so that the login-time requests are never throttled.
    - id: c
      text:
        en: |-
          Generate all briefings after 02:00 with an Amazon Bedrock batch inference job, store them in Amazon DynamoDB, and read them at login.
    - id: d
      text:
        en: |-
          Stream the briefings with ConverseStream so that clients see the first paragraph while the rest of the briefing is generated.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      All inputs are known hours before clients log in, so the briefings can be pre-computed. A nightly batch inference job produces them at a lower price than on-demand inference, and serving stored briefings removes generation latency and the morning throttling.
  options:
    a:
      en: |-
        Priority speeds up processing at a premium price, but clients still wait for generation at login.
    b:
      en: |-
        Provisioned Throughput sized for one peak hour is billed every hour, and clients still wait for generation.
    d:
      en: |-
        Streaming improves perceived latency only; generation and throttling still happen at login.
references:
  - title: "Process multiple prompts with batch inference - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/batch-inference.html
  - title: "Service tiers for optimizing performance and cost - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/service-tiers-inference.html
