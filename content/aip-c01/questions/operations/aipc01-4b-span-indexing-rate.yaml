id: aipc01-4b-span-indexing-rate
objective: "4.2.6"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company profiles its GenAI API, which calls Amazon Bedrock, a knowledge base, and several tools for each request. Engineers must be able to search the spans of any request by attributes such as tenant ID or prompt version, for example to profile the slowest requests of one tenant. Only a small sample of the traces is needed for end-to-end trace analytics, and the team wants to control the cost of trace indexing. The application is instrumented with AWS Distro for OpenTelemetry.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Configure an X-Ray sampling rule that records 1% of the requests, and search the sampled traces by the tenant ID annotation.
    - id: b
      text:
        en: |-
          Enable CloudWatch Transaction Search, and set the indexing rule so that only a small percentage of spans is indexed as trace summaries.
    - id: c
      text:
        en: |-
          Enable model invocation logging, and add the tenant ID and the prompt version to the requestMetadata of each model call.
    - id: d
      text:
        en: |-
          Publish the duration of each request as a custom CloudWatch metric with tenant ID and prompt version dimensions.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      With Transaction Search, all spans are ingested as structured logs in the aws/spans log group, so every span stays searchable by its attributes. A configurable percentage of spans is indexed as X-Ray trace summaries for end-to-end trace analytics, which keeps the indexing cost under control.
  options:
    a:
      en: |-
        Sampling at 1% discards the other 99% of requests, so the spans of most requests could not be searched at all.
    c:
      en: |-
        Invocation logs cover model calls only; they do not contain the spans of the knowledge base and tool steps.
    d:
      en: |-
        A duration metric aggregates requests and does not let engineers inspect the spans of individual slow requests.
references:
  - title: "Transaction Search - Amazon CloudWatch"
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/CloudWatch-Transaction-Search.html
  - title: "Add observability to your Amazon Bedrock AgentCore resources - Amazon Bedrock AgentCore"
    url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/observability-configure.html
