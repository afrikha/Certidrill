id: aipc01-4a-hybrid-store-support
objective: "4.2.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company built an Amazon Bedrock knowledge base on an Amazon S3 vector bucket to minimize storage costs. Users often search by exact contract numbers, so a developer set overrideSearchType to HYBRID, but results did not change and still miss the exact contract. The company must retrieve chunks that contain exact contract numbers and keep natural-language search.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Keep the S3 vector bucket, and add a stringContains metadata filter on a contract_number attribute to every query that mentions a contract.
    - id: b
      text:
        en: |-
          Keep the S3 vector bucket, and enable query decomposition so that each contract number in a question becomes a separate sub-query.
    - id: c
      text:
        en: |-
          Create a knowledge base on an OpenSearch Serverless vector store with a filterable text field, ingest the documents, and use hybrid search.
    - id: d
      text:
        en: |-
          Keep the S3 vector bucket, and switch to an embedding model with a larger output dimension, then re-ingest all the documents.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      Hybrid search is supported only for Amazon RDS, OpenSearch Serverless and MongoDB vector stores that contain a filterable text field; with other stores, the query uses semantic search, which explains the unchanged results. Moving to a supported store enables combined keyword and vector retrieval.
  options:
    a:
      en: |-
        S3 vector buckets do not support the stringContains and startsWith filter operators.
    b:
      en: |-
        Query decomposition splits complex questions into sub-queries, but each sub-query is still a semantic search that misses exact identifiers.
    d:
      en: |-
        A larger embedding still represents meaning rather than exact strings, and hybrid search remains unavailable on this store.
references:
  - title: "Configure and customize queries and response generation - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/kb-test-config.html
