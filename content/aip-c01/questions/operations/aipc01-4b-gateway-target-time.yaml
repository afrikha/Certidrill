id: aipc01-4b-gateway-target-time
objective: "4.3.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An agent built with Strands Agents calls tools through an Amazon Bedrock AgentCore Gateway. Some tools are AWS Lambda function targets, and others are OpenAPI targets that call a partner's REST API. The p90 Duration metric of the gateway has doubled over a week. The team must determine how much of that time is spent executing the tool targets rather than in the gateway itself.

    Which metric should the team compare with Duration?
body:
  options:
    - id: a
      text:
        en: |-
          The gateway Latency metric, which measures the time until the gateway starts sending the first response token.
    - id: b
      text:
        en: |-
          The gateway TargetExecutionTime metric, which measures the time taken to execute the Lambda or OpenAPI target.
    - id: c
      text:
        en: |-
          The AgentCore Runtime ActiveSessionCount metric, which shows the number of agent sessions active each minute.
    - id: d
      text:
        en: |-
          The InvocationLatency metric in the AWS/Bedrock namespace for the model that the agent uses to choose tools.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      TargetExecutionTime is the total time taken to execute the target, whether Lambda, OpenAPI, or another type, and it shows the target's contribution to the request time. Comparing it with Duration, the end-to-end processing time, separates time spent in the tools from time spent in the gateway.
  options:
    a:
      en: |-
        Latency is the initial response time of the gateway; it does not isolate the time spent in the targets.
    c:
      en: |-
        The number of active sessions describes load on the runtime, not where the time of a tool call is spent.
    d:
      en: |-
        Model latency covers the model calls of the agent, not the execution of tools behind the gateway.
references:
  - title: "AgentCore generated gateway observability data - Amazon Bedrock AgentCore"
    url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/observability-gateway-metrics.html
