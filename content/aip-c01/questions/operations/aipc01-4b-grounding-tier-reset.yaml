id: aipc01-4b-grounding-tier-reset
objective: "4.3.6"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company's chat assistant uses an Amazon Bedrock guardrail with a contextual grounding check in the Standard tier, which handles its conversational answers well. Last week, a developer added a denied topic by calling UpdateGuardrail with the new topic and the existing policies, but without the tierConfig field of the grounding policy. Since then, many correct answers that contain conversational phrasing or reasonable inferences are blocked as ungrounded.

    What is the MOST likely cause, and what should the team do?
body:
  options:
    - id: a
      text:
        en: |-
          The new denied topic overlaps with the grounding check; remove the denied topic and create a second guardrail for topic filtering.
    - id: b
      text:
        en: |-
          A guardrail update always restores the default grounding thresholds; set the grounding thresholds back to their previous values.
    - id: c
      text:
        en: |-
          The model changed its answer style after the update; add instructions to the system prompt that forbid conversational phrasing.
    - id: d
      text:
        en: |-
          UpdateGuardrail replaced the whole policy configuration and reset the grounding tier to Classic; update it again with tierConfig set to STANDARD.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      UpdateGuardrail replaces the entire policy configuration, and omitting tierConfig on a guardrail that used the STANDARD tier resets the tier to CLASSIC. The Classic tier evaluates strict grounding, so conversational phrasing and reasonable inferences lower the score, which matches the new false positives.
  options:
    a:
      en: |-
        Denied topics block subjects that are defined as off-limits; they do not lower grounding scores of answers that stay on allowed topics.
    b:
      en: |-
        The update included the existing policies with their thresholds, which were kept; the setting that changed is the tier, which was omitted.
    c:
      en: |-
        The answers are correct and grounded; the false positives come from the stricter Classic scoring, not from a change in the model.
references:
  - title: "Use contextual grounding check to filter hallucinations in responses - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/guardrails-contextual-grounding-check.html
