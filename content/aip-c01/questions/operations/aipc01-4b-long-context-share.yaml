id: aipc01-4b-long-context-share
objective: "4.2.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company uses an Amazon Bedrock model that bills some requests at a long-context rate. For budget and capacity planning, the finance team wants a monthly view of how many invocations and input tokens of this model were billed at the long-context rate and how many at the normal rate. The team wants to use existing data with the LEAST effort.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Query the model invocation logs with CloudWatch Logs Insights, and count as long-context every request whose input token count is above 200,000.
    - id: b
      text:
        en: |-
          Call the CountTokens API before each request, and publish a custom metric that marks the requests that exceed the model's standard context size.
    - id: c
      text:
        en: |-
          Create an AWS Cost Anomaly Detection monitor for Amazon Bedrock, and read the usage types of the anomalies that it reports each month.
    - id: d
      text:
        en: |-
          Graph Invocations and InputTokenCount with the ModelId and ContextWindow dimensions, and subtract these series from the ModelId series.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      Amazon Bedrock publishes Invocations, InputTokenCount, and other metrics with a ModelId plus ContextWindow dimension whose value is 1M for requests billed at a long-context rate, regardless of their token count. These series are a subset of the ModelId series, so subtracting them gives the usage billed at the normal rate.
  options:
    a:
      en: |-
        The ContextWindow value follows the billing rate regardless of token count, so a token threshold chosen by the team can misclassify requests, and it needs a custom query.
    b:
      en: |-
        Calling CountTokens and publishing metrics requires code changes, and the existing metrics already separate long-context usage.
    c:
      en: |-
        Cost Anomaly Detection reports unusual spend, not a complete monthly split of invocations and tokens by billing rate.
references:
  - title: "Monitor bedrock-runtime inference using CloudWatch metrics - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/monitoring-runtime-metrics.html
