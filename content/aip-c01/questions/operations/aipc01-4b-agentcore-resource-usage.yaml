id: aipc01-4b-agentcore-resource-usage
objective: "4.2.5"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A platform team hosts 25 agents on Amazon Bedrock AgentCore Runtime. To plan capacity and charge costs back to product teams, it must find which agent endpoints consume the most vCPU and memory, and which individual sessions of those agents are the most expensive. A delay of up to an hour in the data is acceptable.

    Which data sources should the team use? (Choose two.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          The CPUUsed-vCPUHours and MemoryUsed-GBHours metrics, with the Service, Resource, and Name dimensions.
    - id: b
      text:
        en: |-
          The Session Count metric of each agent, which gives the number of sessions that are active at each moment.
    - id: c
      text:
        en: |-
          The Duration metric of the AgentCore Gateway, with the Name dimension of each tool that the agents call.
    - id: d
      text:
        en: |-
          The EstimatedTPMQuotaUsage metric in the AWS/Bedrock namespace, for each model that the agents invoke.
    - id: e
      text:
        en: |-
          The vended USAGE_LOGS records of AgentCore Runtime, which report the vCPU-hours and GB-hours used by each session.
answer: { optionIds: [ a, e ] }
explanation:
  correct:
    en: |-
      AgentCore Runtime publishes CPUUsed-vCPUHours and MemoryUsed-GBHours with dimensions down to the agent ARN and endpoint name, which ranks agents by resource consumption; this data can be delayed by up to 60 minutes. The vended usage logs add per-session records with the session ID and the vCPU-hours and memory GB-hours used, which identifies the most expensive sessions.
  options:
    b:
      en: |-
        Session Count is a cumulative count of new sessions in the period, not a gauge of active sessions, and it does not measure resource consumption.
    c:
      en: |-
        Gateway Duration measures tool request times, not the vCPU and memory that the agents consume on the runtime.
    d:
      en: |-
        EstimatedTPMQuotaUsage approximates model token quota use; it says nothing about runtime compute and memory per agent or session.
references:
  - title: "AgentCore generated runtime observability data - Amazon Bedrock AgentCore"
    url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/observability-runtime-metrics.html
