id: aipc01-4b-reserved-overflow-sizing
objective: "4.2.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company has a Reserved tier reservation for an Amazon Bedrock model that serves its claims assistant. When traffic exceeds the reserved tokens per minute, requests overflow automatically to the Standard tier. Before renewing the reservation, the company wants to see how much of its peak traffic was served by the Standard tier, to decide whether to reserve more capacity.

    Which solution will meet these requirements with the LEAST effort?
body:
  options:
    - id: a
      text:
        en: |-
          Graph the Invocations and token count metrics of the model by the ResolvedServiceTier dimension over the reservation period.
    - id: b
      text:
        en: |-
          Graph the Invocations and token count metrics of the model by the ServiceTier dimension over the reservation period.
    - id: c
      text:
        en: |-
          Graph the InvocationThrottles metric of the model over the reservation period, because overflow requests are counted as throttles.
    - id: d
      text:
        en: |-
          Export the CloudTrail events of the period to Amazon S3, and write an Amazon Athena query that counts the requests per tier.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      Runtime metrics can be filtered by ModelId, ServiceTier, and ResolvedServiceTier, and ResolvedServiceTier shows the tier that actually served the requests. Graphing usage by ResolvedServiceTier shows how much traffic the Reserved tier absorbed and how much overflowed to the Standard tier.
  options:
    b:
      en: |-
        ServiceTier reflects the tier that the requests asked for, which is the Reserved tier for all of them, so it does not reveal the overflow.
    c:
      en: |-
        Overflow keeps operations uninterrupted by serving requests on the Standard tier; those requests are not throttled.
    d:
      en: |-
        CloudTrail events do include the service tier, but exporting and querying them takes far more effort than an existing metric dimension.
references:
  - title: "Service tiers for optimizing performance and cost - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/service-tiers-inference.html
