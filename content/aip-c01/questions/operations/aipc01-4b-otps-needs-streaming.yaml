id: aipc01-4b-otps-needs-streaming
objective: "4.2.6"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A document summarization service on AWS Lambda calls an Amazon Bedrock model with the Converse API and returns the complete summary when generation finishes. The operations team created a CloudWatch metric math expression that divides OutputTokenCount by (InvocationLatency - TimeToFirstToken) to track output tokens per second, but the expression returns no data points. Model invocation logging is enabled, and the InvocationLatency and OutputTokenCount metrics have data.

    What should the team do to obtain the output tokens per second values?
body:
  options:
    - id: a
      text:
        en: |-
          Enable text data delivery in the model invocation logging configuration so that Amazon Bedrock starts to publish the TimeToFirstToken metric.
    - id: b
      text:
        en: |-
          Change the expression to use both the ModelId and ServiceTier dimensions, because TimeToFirstToken is published only with both dimensions.
    - id: c
      text:
        en: |-
          Set the performanceConfig latency parameter to optimized in each request so that Amazon Bedrock publishes per-token latency metrics.
    - id: d
      text:
        en: |-
          Change the service to call the ConverseStream API, because Amazon Bedrock publishes TimeToFirstToken only for streaming operations.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      TimeToFirstToken is published only for the streaming operations ConverseStream and InvokeModelWithResponseStream, and the OTPS calculation depends on it. The Lambda function can consume the stream and still return the complete summary, so the client contract does not change.
  options:
    a:
      en: |-
        Invocation logging writes request and response records; it does not control which CloudWatch metrics Amazon Bedrock publishes.
    b:
      en: |-
        The runtime metrics are available with the ModelId dimension; the missing values come from the non-streaming API, not from the dimension choice.
    c:
      en: |-
        Latency-optimized inference is a preview option for a few listed models and does not make Converse publish TimeToFirstToken.
references:
  - title: "Diagnose InvocationLatency increases using output tokens per second (OTPS) - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/monitoring-runtime-otps.html
  - title: "Monitor bedrock-runtime inference using CloudWatch metrics - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/monitoring-runtime-metrics.html
