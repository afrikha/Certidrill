id: aipc01-4b-scheduled-prewarm
objective: "4.2.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A trading firm serves a large LLM from an Amazon SageMaker AI real-time endpoint. A target tracking policy on the high-resolution concurrency metric scales the endpoint between 2 and 12 instances. Every weekday at 08:00, traders start work and traffic rises from almost nothing to its daily peak within minutes. Because each new GPU instance needs several minutes to load the model, latency and errors are high for the first 15 minutes of each day. The firm wants to remove this daily degradation without paying for peak capacity all day.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Add scheduled actions that raise the minimum capacity shortly before 08:00 on weekdays and lower it after the morning peak, and keep the target tracking policy.
    - id: b
      text:
        en: |-
          Lower the target value of the target tracking policy so that the endpoint starts to scale out at a lower number of concurrent requests per model.
    - id: c
      text:
        en: |-
          Replace the target tracking policy with a step scaling policy that adds four instances at once when the concurrency alarm enters the ALARM state.
    - id: d
      text:
        en: |-
          Set the minimum capacity of the scalable target to 12 instances so that peak capacity is always available, and remove the target tracking policy.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      The peak is predictable, so a scheduled action can raise the minimum capacity before traders arrive and give the instances time to load the model. Scheduled actions and scaling policies work together: after the action runs, target tracking keeps adjusting capacity within the new minimum and maximum, and a later action lowers the minimum again.
  options:
    b:
      en: |-
        A lower target still reacts only after traffic arrives, so new instances are still loading the model during the first minutes of the peak.
    c:
      en: |-
        Larger steps are still reactive; the instances are added only when the alarm fires, and the model load time remains.
    d:
      en: |-
        Keeping 12 instances all day pays for peak capacity at all times, which the firm wants to avoid.
references:
  - title: "Scheduled scaling for Application Auto Scaling - Application Auto Scaling"
    url: https://docs.aws.amazon.com/autoscaling/application/userguide/application-auto-scaling-scheduled-scaling.html
  - title: "Define a scaling policy - Amazon SageMaker AI"
    url: https://docs.aws.amazon.com/sagemaker/latest/dg/endpoint-auto-scaling-add-code-define.html
