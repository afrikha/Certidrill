id: aipc01-4a-rag-chunk-budget
objective: "4.1.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A manufacturer's RAG assistant uses an Amazon Bedrock knowledge base with an Amazon OpenSearch Serverless vector store. To improve answers, the team raised numberOfResults from 5 to 40. Input tokens per request quadrupled, but answer quality improved only slightly, and many retrieved chunks describe discontinued product versions. Each source document already has a product_version metadata attribute. The company must reduce input tokens while keeping or improving the relevance of answers.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Filter retrieval on the product_version attribute, and apply a reranker model so that only the five most relevant retrieved chunks reach the model.
    - id: b
      text:
        en: |-
          Re-embed the documents with Amazon Titan Text Embeddings V2 at 256 dimensions instead of 1,024 so that each retrieved chunk adds fewer tokens to the prompt.
    - id: c
      text:
        en: |-
          Place a prompt caching checkpoint after the retrieved chunks so that later requests read the chunks from the cache at the reduced cache-read price.
    - id: d
      text:
        en: |-
          Switch the data source to hierarchical chunking so that each matched child chunk is replaced by its larger parent chunk in the prompt.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      A metadata filter removes chunks about discontinued versions before ranking, and a reranker scores each candidate against the question so that only the few most relevant chunks reach the model. Feeding fewer, more relevant results to the model lowers cost and latency and tends to produce more accurate answers, which is the documented purpose of reranking.
  options:
    b:
      en: |-
        The embedding dimension changes the size of the vectors in the index, not the text of the chunks inserted into the prompt, so input tokens would not change.
    c:
      en: |-
        Retrieved chunks differ from one question to the next, so the prefix would rarely match and the cache writes would add cost; prompt caching suits stable content such as instructions.
    d:
      en: |-
        Hierarchical chunking returns the larger parent chunks, which adds context tokens instead of removing them.
references:
  - title: "Improve the relevance of query responses with a reranker model in Amazon Bedrock - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/rerank.html
  - title: "Configure and customize queries and response generation - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/kb-test-config.html
