id: aipc01-4b-kb-logs-central-account
objective: "4.3.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company has 12 workload accounts, each with Amazon Bedrock knowledge bases. Its compliance team wants the ingestion logs of every knowledge base, with the status of each document, delivered to a CloudWatch Logs log group in a central observability account. The company does not want to deploy extra streaming or copy resources in the workload accounts.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Configure knowledge base log delivery in each workload account with a delivery destination in the central account that a delivery destination policy authorizes.
    - id: b
      text:
        en: |-
          Configure model invocation logging in each workload account with the central account's log group as the CloudWatch Logs destination.
    - id: c
      text:
        en: |-
          Create an organization trail with data events for the AWS::Bedrock::KnowledgeBase resource type that delivers to the central account.
    - id: d
      text:
        en: |-
          Run an AWS Lambda function on a schedule in each workload account that reads GetIngestionJob statistics and writes them to the central log group.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      Knowledge base logs are delivered through the CloudWatch vended logs APIs: a delivery source with the APPLICATION_LOGS log type, a delivery destination, and a delivery that links them. Cross-account delivery is supported by authorizing the source accounts with PutDeliveryDestinationPolicy on the destination, so no extra resources are needed in the workload accounts.
  options:
    b:
      en: |-
        Model invocation logging records model calls, not ingestion jobs, and it supports only destinations in the same account and Region.
    c:
      en: |-
        CloudTrail data events record Retrieve and RetrieveAndGenerate calls, not the per-document status of ingestion jobs.
    d:
      en: |-
        Scheduled functions in every account are extra resources to build and operate, and job statistics do not give the status of each document.
references:
  - title: "Monitor knowledge bases using CloudWatch Logs - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/knowledge-bases-logging.html
