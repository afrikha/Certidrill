id: aipc01-5a-rag-faithfulness-retrieved
objective: "5.1.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company runs a RAG assistant on an Amazon Bedrock knowledge base. Before each release, the team must measure, across 800 test questions, how often the generated answers contain claims that are not supported by the passages retrieved for that question. The evaluation must be automated.

    Which solution will meet these requirements?
body:
  options:
    - { id: a, text: { en: "Run a retrieve-and-generate RAG evaluation job on the knowledge base with the faithfulness metric." } }
    - { id: b, text: { en: "Run a retrieve-only RAG evaluation job on the knowledge base with the context relevance metric." } }
    - { id: c, text: { en: "Run a model evaluation job that uses a judge model on the generator model alone, with the Builtin.Correctness metric and reference answers." } }
    - { id: d, text: { en: "Run a programmatic evaluation job with the question and answer task type and the accuracy metric on the 800 questions." } }
answer: { optionId: a }
explanation:
  correct:
    en: "In a retrieve-and-generate RAG evaluation job, the faithfulness metric measures how well responses avoid hallucination with respect to the retrieved texts. The job retrieves passages from the knowledge base, generates the answers, and an evaluator model scores each answer against its own passages."
  options:
    b:
      en: "A retrieve-only job scores the retrieved passages; it never generates or judges an answer."
    c:
      en: "Without retrieval, the judge never sees the knowledge base passages, so it cannot judge support by those passages; correctness compares with the reference instead."
    d:
      en: "NLP-F1 accuracy measures word overlap with a reference answer, not support by the retrieved passages."
references:
  - title: "Use metrics to understand RAG system performance - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/knowledge-base-evaluation-metrics.html
  - title: "Evaluate the performance of RAG sources using Amazon Bedrock evaluations - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/evaluation-kb.html
