id: aipc01-5b-deploy-consistency-checks
objective: "5.1.9"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A bank is validating a prompt update for its loan-policy assistant in Amazon Bedrock before deployment. Previous updates made the assistant give different answers to the same policy question depending on the run or on how the question was worded. The bank wants automated checks in its deployment pipeline that detect this kind of inconsistency before release.

    Which checks should the bank add? (Choose two.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Send each validation question several times with the production inference parameters, and check that the responses agree with each other in meaning.
    - id: b
      text:
        en: |-
          Send each validation question once with the temperature set to 1.0, and check that the model can produce a varied answer.
    - id: c
      text:
        en: |-
          Check that every validation request returns HTTP status 200 and a stopReason of end_turn within the latency target.
    - id: d
      text:
        en: |-
          Send several paraphrases of each validation question, and check that the facts stated in the responses match each other.
    - id: e
      text:
        en: |-
          Compare the p99 InvocationLatency of the updated prompt with the p99 InvocationLatency of the current prompt.
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: |-
      Repeating the same question with the production settings detects run-to-run variation, and asking paraphrases detects answers that depend on wording. Comparing the responses for semantic agreement (for example with embedding similarity or a judge) turns both into automated pass/fail checks.
  options:
    b:
      en: |-
        A single high-temperature call tests nothing about consistency and does not reflect the production configuration.
    c:
      en: |-
        A successful status and a normal stop reason only show that the call worked; inconsistent answers also return 200 with end_turn.
    e:
      en: |-
        Latency is an operational measure; it does not reveal whether answers to the same question differ.
references:
  - title: Amazon Titan Text Embeddings models - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/titan-embedding-models.html
  - title: Converse - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/APIReference/API_runtime_Converse.html
