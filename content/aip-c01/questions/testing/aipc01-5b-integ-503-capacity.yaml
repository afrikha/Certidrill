id: aipc01-5b-integ-503-capacity
objective: "5.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A media company's summarization service calls a model in Amazon Bedrock with on-demand inference in a single Region. During evening peaks, some requests fail with ServiceUnavailableException (HTTP 503). The company has confirmed that its token and request usage stays well below the account quotas for the model. The company wants to reduce the failures without any long-term commitment.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Request an increase of the tokens-per-minute quota for the model through Service Quotas, and keep the current retry logic.
    - id: b
      text:
        en: |-
          Retry the failed requests with exponential backoff and jitter, and invoke the model through a cross-Region inference profile.
    - id: c
      text:
        en: |-
          Purchase Provisioned Throughput with a six-month commitment for the model in the current Region, and invoke the provisioned model.
    - id: d
      text:
        en: |-
          Increase the timeout of the Lambda function that calls the model to 1,800 seconds so that slow requests can complete.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      A 503 ServiceUnavailableException means that the service is temporarily unable to handle the request, usually because of high demand or capacity constraints; it is not related to account quotas, which return 429 ThrottlingException. AWS recommends retries with exponential backoff and jitter and cross-Region inference, which spreads requests across Regions with no commitment.
  options:
    a:
      en: |-
        The usage is already below the quotas, and a 503 is not a quota error, so a higher quota does not prevent it.
    c:
      en: |-
        Provisioned Throughput with a six-month term is a long-term commitment, which the company wants to avoid.
    d:
      en: |-
        The requests are rejected by Bedrock with an error, not cut off by the function timeout, so a longer timeout changes nothing.
references:
  - title: Troubleshooting Amazon Bedrock API Error Codes - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/troubleshooting-api-error-codes.html
