id: aipc01-5b-prompt-systematic-refinement
objective: "5.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company's HR assistant in Amazon Bedrock gives inconsistent answers about leave policies. Developers have edited the production prompt several times in response to individual complaints, and each edit fixed one case but broke others. The company wants a process that shows whether a prompt change improves quality overall before it reaches production, and that keeps every tested configuration available.

    Which approach will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Edit the prompt in the application code after each complaint, and monitor user feedback for one week before the next edit.
    - id: b
      text:
        en: |-
          Save each candidate as a Prompt Management version, run the full golden dataset through it, and score it with the same judge as the baseline.
    - id: c
      text:
        en: |-
          Test each candidate prompt in the playground with the questions from the latest complaints, and deploy it if those answers are correct.
    - id: d
      text:
        en: |-
          Raise the temperature of the current prompt so that the model explores more answer styles, and keep the styles that users rate higher.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      Versions are snapshots of each tested configuration that the application can switch between. Running every candidate on the same golden dataset and scoring it with the same evaluation as the baseline shows whether a change helps overall or only fixes one case while breaking others.
  options:
    a:
      en: |-
        This repeats the trial-and-error process that caused the regressions, tests in production, and keeps no record of tested configurations.
    c:
      en: |-
        A handful of complaint questions is the same narrow test that missed the regressions; the rest of the dataset is not checked.
    d:
      en: |-
        A higher temperature increases variation, which makes the inconsistency worse, and user ratings come only after the change reaches production.
references:
  - title: Deploy a prompt to your application using versions in Prompt management - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/prompt-management-deploy.html
  - title: Construct and store reusable prompts with Prompt management in Amazon Bedrock - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/prompt-management.html
