id: aipc01-5a-stereotyping-refusal-metrics
objective: "5.1.1"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    A retail company is preparing to launch a shopping assistant on Amazon Bedrock. Before launch, the responsible AI team wants an automated report on two risks: responses that contain generalizations about groups of people, whether positive or negative, and responses that decline ordinary shopping requests. The team will use an evaluation job with a judge model.

    Which built-in metrics should the team select? (Choose two.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "Builtin.Harmfulness" } }
    - { id: b, text: { en: "Builtin.Stereotyping" } }
    - { id: c, text: { en: "Builtin.FollowingInstructions" } }
    - { id: d, text: { en: "Builtin.Refusal" } }
    - { id: e, text: { en: "Builtin.Faithfulness" } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: "Builtin.Stereotyping detects stereotypes of any kind, positive or negative, in a response. Builtin.Refusal detects responses that directly decline the prompt or reject the request, which reveals an assistant that refuses ordinary requests."
  options:
    a:
      en: "Harmfulness looks for harmful content such as hate, insults or violence; a positive generalization about a group is not harmful content but is still a stereotype."
    c:
      en: "Following instructions measures how well the response respects the exact directions in the prompt; it does not target stereotypes or refusals."
    e:
      en: "Faithfulness checks for information that is not in the prompt context; it is a hallucination measure."
references:
  - title: "Use metrics to understand model performance - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/model-evaluation-metrics.html
