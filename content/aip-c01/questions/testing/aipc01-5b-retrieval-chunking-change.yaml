id: aipc01-5b-retrieval-chunking-change
objective: "5.2.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A team's Amazon Bedrock knowledge base uses an S3 data source with fixed-size chunking of 200 tokens. Retrieval evaluation shows that procedures that span several paragraphs are split across chunks, so answers miss steps. The team wants hierarchical chunking and called UpdateDataSource with a new chunkingConfiguration, but the update was rejected. The current knowledge base must keep serving users until the new configuration is validated.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Delete the vector index, call UpdateDataSource again with hierarchical chunking, and start a new ingestion job.
    - id: b
      text:
        en: |-
          Start a new ingestion job on the existing data source so that the knowledge base applies the latest chunking settings.
    - id: c
      text:
        en: |-
          Change the embedding model of the knowledge base to one with a larger input limit so that each chunk can hold more text.
    - id: d
      text:
        en: |-
          Create a new knowledge base whose data source uses hierarchical chunking, ingest the documents, validate it, and switch the application to it.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      The chunkingConfiguration of a data source can't be changed after the data source is created. Building a new knowledge base with a hierarchical chunking data source, validating it against the same retrieval test set, and then pointing the application to it changes the chunking without interrupting the current knowledge base.
  options:
    a:
      en: |-
        The chunking configuration still can't be updated, and deleting the index breaks the current knowledge base while users depend on it.
    b:
      en: |-
        A sync uses the data source's existing chunking configuration; the rejected update was never applied.
    c:
      en: |-
        The embedding model of an existing knowledge base can't be changed, and chunk size is set by the chunking configuration, not by the model's input limit.
references:
  - title: UpdateDataSource - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/APIReference/API_agent_UpdateDataSource.html
  - title: How content chunking works for knowledge bases - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/kb-chunking.html
