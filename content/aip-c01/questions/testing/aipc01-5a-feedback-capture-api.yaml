id: aipc01-5a-feedback-capture-api
objective: "5.1.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A media company is building a new GenAI assistant on Amazon Bedrock for its subscribers. Each answer in the web client must have thumbs-up and thumbs-down buttons and an optional comment. Each rating must be stored durably with the conversation and turn identifiers, be available for analysis, and feed a CloudWatch metric for alarms.

    Which solution will meet these requirements?
body:
  options:
    - { id: a, text: { en: "Build the assistant as an Amazon Q Business application and use its built-in thumbs-up and thumbs-down feedback for each answer." } }
    - { id: b, text: { en: "Send each rating from the client to an Amazon API Gateway API that invokes an AWS Lambda function, which writes the rating to DynamoDB and publishes a custom CloudWatch metric." } }
    - { id: c, text: { en: "Create an Amazon Augmented AI human review workflow that starts a human loop for each answer so that subscribers rate the answers." } }
    - { id: d, text: { en: "Detect the sentiment of each subscriber's next message with Amazon Comprehend, and store negative sentiment as a thumbs-down rating for the previous answer." } }
answer: { optionId: b }
explanation:
  correct:
    en: "A small capture API built with API Gateway and Lambda receives each rating with its identifiers, stores it durably in DynamoDB, and publishes a custom metric that dashboards and alarms can use. The rating stays tied to the exact turn, and all of these services are available for a new design."
  options:
    a:
      en: "Amazon Q Business is closed to new customers since July 30, 2026, so it cannot host a new assistant."
    c:
      en: "Amazon Augmented AI is closed to new customers since July 30, 2026, and its human loops send tasks to reviewers, not to the end users of an application."
    d:
      en: "Sentiment of a later message is an indirect guess, not the explicit rating and comment the company wants to collect."
references:
  - title: "Publish custom metrics (PutMetricData / EMF) - Amazon CloudWatch"
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/publishingMetrics.html
