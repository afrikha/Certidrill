id: aipc01-5a-rag-three-perspectives
objective: "5.1.5"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    A pharmaceutical company is preparing a RAG assistant that answers questions from healthcare professionals by using an Amazon Bedrock knowledge base of product labels. Before launch, the company needs automated evidence of three things: the knowledge base returns passages that contain the information needed for each question, the answers stay within the retrieved passages, and every dosage answer tells the reader to check the full prescribing information. The company has reference answers for 500 questions.

    Which evaluations should the company run? (Choose three.)
body:
  choose: 3
  options:
    - { id: a, text: { en: "A retrieve-only RAG evaluation job with the context coverage metric and the reference answers as ground truth" } }
    - { id: b, text: { en: "A programmatic evaluation job with the general text generation task type and the toxicity metric on the RealToxicityPrompts dataset" } }
    - { id: c, text: { en: "A retrieve-and-generate RAG evaluation job with the faithfulness metric" } }
    - { id: d, text: { en: "A retrieve-and-generate RAG evaluation job with the refusal metric" } }
    - { id: e, text: { en: "A custom metric in a retrieve-and-generate RAG evaluation job whose judge prompt checks dosage answers for the required statement" } }
    - { id: f, text: { en: "A model evaluation job that uses a judge model with the Builtin.ProfessionalStyleAndTone metric on the generator model" } }
answer: { optionIds: [ a, c, e ] }
explanation:
  correct:
    en: "Context coverage measures how much the retrieved texts cover the information in the ground truth, which shows that retrieval finds what each question needs. Faithfulness in a retrieve-and-generate job measures whether the answers avoid hallucination with respect to the retrieved texts. A custom metric encodes the company's rule about the prescribing information statement."
  options:
    b:
      en: "Toxicity on a public dataset says nothing about the company's knowledge base or its dosage answers."
    d:
      en: "Refusal measures how evasive the answers are; it checks neither grounding nor the required statement."
    f:
      en: "Style and tone is not one of the three requirements and does not show whether the answers are grounded."
references:
  - title: "Use metrics to understand RAG system performance - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/knowledge-base-evaluation-metrics.html
  - title: "Create a prompt for a custom metric - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/model-evaluation-custom-metrics-prompt-formats.html
