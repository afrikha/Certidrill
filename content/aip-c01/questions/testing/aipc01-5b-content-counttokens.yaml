id: aipc01-5b-content-counttokens
objective: "5.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A document-analysis application sends contracts of varying length to a model in Amazon Bedrock through the Converse API. Some requests are rejected because the input is longer than the model accepts. Before each call, the application must determine whether the request will fit by using the exact token count of the target model's tokenizer, and the check must not incur inference charges.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Estimate the token count by dividing the number of characters by four, and split the contract when the estimate exceeds the limit.
    - id: b
      text:
        en: |-
          Send the request, catch the ValidationException, and send the request again with a shorter excerpt of the contract.
    - id: c
      text:
        en: |-
          Read the InputTokenCount metric of previous requests in CloudWatch, and use its average to predict the size of new requests.
    - id: d
      text:
        en: |-
          Call the CountTokens API with the same model ID and the Converse-formatted input, and compare the result with the limit.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      CountTokens returns the number of input tokens that the same request would use for the specified model, matching the count that would be charged, and it doesn't incur charges. It accepts Converse-formatted input, so the application can check each request before invoking the model.
  options:
    a:
      en: |-
        A characters-per-token ratio is only an average, and tokenization differs between models, so the estimate is not the exact count.
    b:
      en: |-
        This reacts after the failure instead of checking before the call, and it still doesn't give the token count.
    c:
      en: |-
        An average of past requests says nothing reliable about the size of the next contract.
references:
  - title: Monitor your token usage by counting tokens before running inference - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/count-tokens.html
