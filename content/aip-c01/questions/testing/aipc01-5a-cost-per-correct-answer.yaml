id: aipc01-5a-cost-per-correct-answer
objective: "5.1.2"
type: single
difficulty: 3
status: draft
shuffle: false
stem:
  en: |
    A company evaluated four candidate models for a customer support assistant on the same 1,000 golden questions. The requirements are a judge correctness score of at least 0.85, a p90 latency of at most 2.5 seconds, and the lowest cost per correct answer. The measured results are:

    - Model A: correctness 0.94, p90 latency 3.2 s, cost $12.00 per 1,000 requests
    - Model B: correctness 0.90, p90 latency 2.1 s, cost $9.00 per 1,000 requests
    - Model C: correctness 0.86, p90 latency 1.4 s, cost $8.80 per 1,000 requests
    - Model D: correctness 0.82, p90 latency 0.9 s, cost $3.00 per 1,000 requests

    Which model should the company choose?
body:
  options:
    - { id: a, text: { en: "Model A" } }
    - { id: b, text: { en: "Model B" } }
    - { id: c, text: { en: "Model C" } }
    - { id: d, text: { en: "Model D" } }
answer: { optionId: b }
explanation:
  correct:
    en: "Models A and D each fail a hard requirement (latency and correctness). Among the remaining models, the cost per correct answer is $9.00 / 900 = $0.0100 for Model B and $8.80 / 860 ≈ $0.0102 for Model C, so Model B is cheaper per correct answer even though Model C is cheaper per request."
  options:
    a:
      en: "Model A has the best correctness, but its p90 latency of 3.2 s exceeds the 2.5 s limit."
    c:
      en: "Model C costs less per request, but its lower correctness makes each correct answer cost about $0.0102 ($8.80 / 860), more than Model B."
    d:
      en: "Model D is the cheapest and fastest, but its correctness of 0.82 is below the 0.85 requirement."
references:
  - title: "Use metrics to understand model performance - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/model-evaluation-metrics.html
  - title: "Monitor bedrock-runtime inference using CloudWatch metrics - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/monitoring-runtime-metrics.html
