id: aipc01-5a-judge-meaning-not-overlap
objective: "5.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A financial services company is testing an internal assistant that answers employee questions about expense policies. The team scores each release against 400 reference answers by using exact match and token F1. Reviewers report that many answers scored as failures are correct but worded differently from the references. The team needs an automated score of whether each answer states the same facts as its reference, without assigning reviewers to every release.

    Which solution will meet these requirements?
body:
  options:
    - { id: a, text: { en: "Run an Amazon Bedrock programmatic evaluation job with the question and answer task type and the accuracy metric on the 400 reference answers." } }
    - { id: b, text: { en: "Run an Amazon Bedrock evaluation job that uses a judge model with the Builtin.Correctness and Builtin.Completeness metrics and includes the reference answers in the dataset." } }
    - { id: c, text: { en: "Run an Amazon Bedrock programmatic evaluation job with the general text generation task type and the robustness metric on the 400 reference answers." } }
    - { id: d, text: { en: "Run an Amazon SageMaker AI Clarify foundation model evaluation job that compares each answer with the reference answers by using its accuracy evaluation." } }
answer: { optionId: b }
explanation:
  correct:
    en: "A judge model scores meaning rather than word overlap, so a correct answer phrased differently is not penalized. Builtin.Correctness and Builtin.Completeness take the reference response into account when the dataset supplies one (referenceResponse), and the job returns a score and an explanation for each response without human reviewers."
  options:
    a:
      en: "The accuracy metric of the question and answer task type is computed with NLP-F1, a word-overlap measure: it has the same weakness as the current token F1 score."
    c:
      en: "The robustness metric measures how much the output changes when the prompt is slightly perturbed (word error rate); it does not judge whether an answer states the same facts as its reference."
    d:
      en: "SageMaker AI Clarify is closed to new customers since July 30, 2026, so it is not an option for this new evaluation; Amazon Bedrock evaluations cover this need."
references:
  - title: "Use metrics to understand model performance - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/model-evaluation-metrics.html
  - title: "Model evaluation task types in Amazon Bedrock - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/model-evaluation-tasks.html
