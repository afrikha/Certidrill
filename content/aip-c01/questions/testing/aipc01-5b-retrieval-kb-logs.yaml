id: aipc01-5b-retrieval-kb-logs
objective: "5.2.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company's Amazon Bedrock knowledge base uses an Amazon S3 data source. Users report that answers never use some recently added documents, although the latest ingestion job completed. The team must find out which documents were skipped or failed during ingestion, and why.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Enable model invocation logging, and search the logs for the file names of the documents that are missing from the answers.
    - id: b
      text:
        en: |-
          Enable knowledge base logging to CloudWatch Logs, and query the RESOURCE_IGNORED, EMBEDDING_FAILED, and INDEXING_FAILED events and their status reasons.
    - id: c
      text:
        en: |-
          Create an AWS CloudTrail trail, and look for failed PutObject calls on the S3 bucket of the data source.
    - id: d
      text:
        en: |-
          Enable AWS X-Ray tracing in the application, and inspect the traces of the Retrieve calls for the missing documents.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      Knowledge base application logs record the status of each file during an ingestion job. RESOURCE_IGNORED, EMBEDDING_FAILED and INDEXING_FAILED identify the skipped or failed documents, and the status_reasons field explains why; CloudWatch Logs Insights can filter on these statuses.
  options:
    a:
      en: |-
        Invocation logs record model calls at query time, not what happened to each document during ingestion.
    c:
      en: |-
        The documents were uploaded successfully; CloudTrail shows API calls, not why ingestion skipped or failed them.
    d:
      en: |-
        Traces of Retrieve calls show that the documents are not returned, not why they were never indexed.
references:
  - title: Monitor knowledge bases using CloudWatch Logs - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/knowledge-bases-logging.html
