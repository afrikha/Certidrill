id: aipc01-5b-maint-kb-template-citations
objective: "5.2.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A team customized the generation prompt template that its Amazon Bedrock knowledge base uses with RetrieveAndGenerate, to change the tone of the answers. Since the new template was deployed, answers are still based on the retrieved results, but the responses no longer include citations, and the source links in the application are empty.

    Which change will fix the issue?
body:
  options:
    - id: a
      text:
        en: |-
          Add the $current_time$ placeholder to the template so that the model can date each source.
    - id: b
      text:
        en: |-
          Increase numberOfResults so that more retrieved results are available for the model to cite.
    - id: c
      text:
        en: |-
          Add a reranker model so that the most relevant results are passed to the model first.
    - id: d
      text:
        en: |-
          Restore the $output_format_instructions$ placeholder in the custom prompt template.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      The $output_format_instructions$ placeholder inserts the formatting and citation instructions into the prompt, and it is required for citations to appear. A custom template that drops it still receives $search_results$, so answers stay grounded, but the response has no citations.
  options:
    a:
      en: |-
        $current_time$ is an optional placeholder for the current time and has no effect on citations.
    b:
      en: |-
        The results are already retrieved and used; without the citation instructions, more results are still not cited.
    c:
      en: |-
        Reranking changes the order of the results, not whether the response format includes citations.
references:
  - title: Configure and customize queries and response generation - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/kb-test-config.html
