id: aipc01-5b-report-dashboard-sso-share
objective: "5.1.8"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A retail company monitors its generative AI shopping assistant with several Amazon CloudWatch dashboards that combine Amazon Bedrock metrics and custom quality metrics. About 40 product managers must be able to view these dashboards. They do not have IAM users or console access, and company policy requires every human access to go through the corporate identity provider, which supports SAML 2.0. The company wants the LEAST operational overhead.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Share each dashboard publicly, and post the dashboard links on the company intranet, which already requires corporate sign-in.
    - id: b
      text:
        en: |-
          Share each dashboard with the email addresses of the product managers so that each person creates a password to view it.
    - id: c
      text:
        en: |-
          Create an IAM user with read-only CloudWatch permissions for each product manager, and send each person a console sign-in link.
    - id: d
      text:
        en: |-
          Share the account's dashboards through the SAML identity provider, which is integrated with Amazon Cognito for dashboard access.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      CloudWatch can share all the dashboards of an account with the members of a third-party single sign-on provider that supports SAML, integrated with Amazon Cognito. The product managers sign in with their corporate credentials, which satisfies the policy without creating IAM users.
  options:
    a:
      en: |-
        A public dashboard link works for anyone who has it, so access would no longer go through the corporate identity provider once a link is copied outside the intranet.
    b:
      en: |-
        Email sharing allows at most five addresses per dashboard and uses passwords that each person creates, not the corporate identity provider.
    c:
      en: |-
        Forty IAM users with their own credentials violate the policy and add credential management overhead.
references:
  - title: Sharing CloudWatch dashboards - Amazon CloudWatch
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/cloudwatch-dashboard-sharing.html
