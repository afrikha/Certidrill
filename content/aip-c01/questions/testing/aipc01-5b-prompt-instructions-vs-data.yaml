id: aipc01-5b-prompt-instructions-vs-data
objective: "5.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A RAG assistant built on an Anthropic Claude model in Amazon Bedrock inserts the retrieved policy documents into a single user message, followed by the instruction "Answer in three bullet points and cite the document title." When the retrieved documents contain long numbered lists, the model ignores the formatting instruction and copies the documents' structure. The retrieved content is relevant to the questions.

    Which change will MOST likely fix the formatting problem?
body:
  options:
    - id: a
      text:
        en: |-
          Increase maxTokens so that the model has enough room in its output to apply the formatting instruction.
    - id: b
      text:
        en: |-
          Retrieve more documents for each question so that the model sees more examples of the expected format.
    - id: c
      text:
        en: |-
          Move the instructions to the system prompt, and wrap the retrieved documents in clearly labeled XML tags.
    - id: d
      text:
        en: |-
          Set the temperature to 0 so that the model applies the same formatting to every response it generates.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      The model confuses instructions with data when both are mixed in one message. Putting the instructions in the system prompt and delimiting the documents with XML tags, a structure that Anthropic models handle well, makes clear which text is reference material and which text gives the rules.
  options:
    a:
      en: |-
        The answers are not cut off; the problem is which formatting the model follows, not the output budget.
    b:
      en: |-
        More documents bring more numbered lists for the model to imitate and bury the instruction further.
    d:
      en: |-
        A temperature of 0 makes the output more deterministic, but the model would consistently follow the documents' structure instead of the instruction.
references:
  - title: Configure and customize queries and response generation - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/kb-test-config.html
