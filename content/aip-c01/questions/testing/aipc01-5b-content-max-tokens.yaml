id: aipc01-5b-content-max-tokens
objective: "5.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company's report-writing assistant calls the Amazon Bedrock Converse API. Users report that some long answers stop in the middle of a sentence. The application receives no error, and every response that ends abruptly has a stopReason of max_tokens.

    Which change will resolve the issue?
body:
  options:
    - id: a
      text:
        en: |-
          Switch to a model that has a larger context window, and keep the current inference configuration of the request.
    - id: b
      text:
        en: |-
          Reduce the number of retrieved passages that the application adds to the prompt before each request.
    - id: c
      text:
        en: |-
          Increase the maxTokens value in the inferenceConfig of the request so that the full answer fits.
    - id: d
      text:
        en: |-
          Lower the temperature in the inferenceConfig of the request so that the output is more deterministic.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      A stopReason of max_tokens means that generation stopped because the output reached the maxTokens limit set in the request. Raising maxTokens (or asking for a shorter answer) lets the model finish; the input was accepted, so the context window is not the problem.
  options:
    a:
      en: |-
        A larger context window does not change the output limit that the request sets with maxTokens, so the answers would still be cut at the same length.
    b:
      en: |-
        Shorter input does not raise the output limit; the answer would still stop when it reaches maxTokens.
    d:
      en: |-
        Temperature affects randomness, not the number of tokens the model is allowed to generate.
references:
  - title: Converse - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/APIReference/API_runtime_Converse.html
