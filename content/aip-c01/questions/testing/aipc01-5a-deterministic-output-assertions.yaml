id: aipc01-5a-deterministic-output-assertions
objective: "5.1.4"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company's document pipeline uses an FM to extract invoice data as JSON, together with a short summary of each invoice. The release gate already runs a judge-model evaluation of summary quality. The team wants to add checks that always give the same result for the same output and that need no judge model.

    Which checks should the team implement as deterministic assertions? (Choose two.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "Score whether each summary would be helpful to an accounts payable clerk." } }
    - { id: b, text: { en: "Validate each output against the JSON schema, including the required fields and data types." } }
    - { id: c, text: { en: "Score whether each summary uses a professional tone." } }
    - { id: d, text: { en: "Score whether each summary contains information that is not in the invoice." } }
    - { id: e, text: { en: "Verify that the invoice total in the output equals the total in the labeled test record." } }
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: "Schema validation and comparison of extracted values with labeled values are rule-based: a parser or an equality check returns the same pass or fail for the same output, at negligible cost. They complement judge metrics, which suit open-ended qualities such as helpfulness, tone or faithfulness."
  options:
    a:
      en: "Helpfulness is a subjective quality that needs a judge model or a human."
    c:
      en: "Tone is a judgment about style, scored by a judge metric such as professional style and tone."
    d:
      en: "Detecting unsupported content in free text is a faithfulness judgment that needs a judge model."
references:
  - title: "Use metrics to understand model performance - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/model-evaluation-metrics.html
