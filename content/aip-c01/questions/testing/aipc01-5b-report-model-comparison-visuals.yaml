id: aipc01-5b-report-model-comparison-visuals
objective: "5.1.8"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    An insurance company evaluated three candidate foundation models for its claims assistant. Each model answered the same 900 prompts, which cover four claim types, and an LLM-as-a-judge evaluation scored every response for correctness. The team also recorded the token cost of each response. Product leadership must choose a model and asks two questions: which model gives the best quality for its cost, and whether any model performs poorly on one claim type even though its overall score is good.

    Which visualizations should the team present to answer both questions? (Choose two.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          A bar chart that shows the overall average correctness score of each model across the 900 prompts.
    - id: b
      text:
        en: |-
          A scatter plot that shows each model's average correctness score against its average cost per response.
    - id: c
      text:
        en: |-
          A line chart that shows the cumulative number of input tokens that each model consumed during the evaluation.
    - id: d
      text:
        en: |-
          A pie chart that shows the share of the 900 prompts that each of the four claim types represents.
    - id: e
      text:
        en: |-
          A grouped bar chart that shows the correctness score of each model for each of the four claim types.
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: |-
      Plotting quality against cost per response shows the trade-off directly and reveals models that are both more expensive and less accurate than another. A per-category breakdown shows whether a good overall average hides a collapse on one claim type, which a single average cannot reveal.
  options:
    a:
      en: |-
        One average per model hides weak claim types and ignores cost, so it answers neither question.
    c:
      en: |-
        Token volume is a usage figure without the quality dimension, so it cannot show quality for cost or per-category weaknesses.
    d:
      en: |-
        The composition of the dataset is the same for every model and says nothing about how the models perform.
references:
  - title: Review model evaluation job reports and metrics in Amazon Bedrock - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/model-evaluation-report.html
