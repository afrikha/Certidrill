id: aipc01-5a-judge-calibration-sample
objective: "5.1.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A travel company uses an LLM-as-a-judge evaluation with a custom metric to score whether its booking assistant follows the brand voice. Product managers do not trust the scores because nobody has compared them with the brand team's judgment. The brand team can spend only a few hours per quarter on reviews. The company needs confidence in the judge scores with the LEAST ongoing effort from the brand team.

    Which solution will meet these requirements?
body:
  options:
    - { id: a, text: { en: "Have the brand team rate a stratified sample of responses, compare their ratings with the judge scores, refine the custom metric prompt and rating scale until they agree, and keep the judge configuration fixed between compared runs." } }
    - { id: b, text: { en: "Replace the custom metric with a programmatic evaluation that computes BERTScore between each response and a set of approved brand-voice examples written by the brand team." } }
    - { id: c, text: { en: "Use the assistant's own generator model as the judge model so that the judge interprets the brand guidelines in the same way as the assistant that writes the responses." } }
    - { id: d, text: { en: "Have the brand team rate every response of every release in an internal review tool, and report their ratings instead of the judge scores to product managers." } }
answer: { optionId: a }
explanation:
  correct:
    en: "A judge is trusted once it is shown to agree with the experts it stands in for: a sample rated by the brand team measures that agreement and shows where the judge prompt or rating scale must be clarified. After calibration, the judge scores every release automatically and the brand team only rechecks a sample now and then, which fits a few hours per quarter. Keeping the judge model and prompt fixed keeps scores comparable between runs."
  options:
    b:
      en: "BERTScore measures semantic similarity to reference texts; closeness to a few examples is not a measure of brand voice, and the scores would still not be checked against the brand team's judgment."
    c:
      en: "A model judging its own outputs may favor them, and this does not establish agreement with the brand team; the judge must be calibrated against human ratings."
    d:
      en: "Rating every response gives trusted scores but needs far more than a few hours per quarter, and it removes the benefit of the automated judge."
references:
  - title: "Create a prompt for a custom metric - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/model-evaluation-custom-metrics-prompt-formats.html
  - title: "Evaluate model performance using another LLM as a judge - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/evaluation-judge.html
