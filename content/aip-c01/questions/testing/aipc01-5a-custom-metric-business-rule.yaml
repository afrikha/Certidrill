id: aipc01-5a-custom-metric-business-rule
objective: "5.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An insurance company's claims assistant must cite the policy clause that supports each answer and must end with a regulatory disclaimer whenever it discusses coverage limits. The company also wants a general helpfulness score. An evaluation must run automatically on 900 prompts for each release and return a score and an explanation for every response.

    Which solution will meet these requirements?
body:
  options:
    - { id: a, text: { en: "Run a programmatic evaluation job with the text classification task type and labels that mark whether each response cites a clause and includes the disclaimer." } }
    - { id: b, text: { en: "Run an evaluation job that uses a judge model with the Builtin.Helpfulness metric and the Builtin.ProfessionalStyleAndTone metric." } }
    - { id: c, text: { en: "Configure an Amazon Bedrock guardrail with a word filter that contains the disclaimer text, and count the responses that the guardrail does not block." } }
    - { id: d, text: { en: "Run an evaluation job that uses a judge model with the Builtin.Helpfulness metric and a custom metric whose judge prompt and rating scale define the clause and disclaimer rules." } }
answer: { optionId: d }
explanation:
  correct:
    en: "Custom metrics let you write the judging instructions and the rating scale for a business rule that no built-in metric covers, and the same job can also use built-in metrics such as Builtin.Helpfulness. The judge returns a score and an explanation for every response, and one job supports up to 10 custom metrics."
  options:
    a:
      en: "Text classification evaluates a model that assigns labels to input text against expected labels; it does not check the free-text answers of the assistant for clauses and disclaimers."
    b:
      en: "Professional style and tone checks formatting and tone for a professional setting; neither built-in metric verifies the clause citation or the disclaimer rule."
    c:
      en: "A word filter blocks content that contains the listed words; it cannot detect that a required sentence is missing, and it is a runtime control, not an evaluation with explanations."
references:
  - title: "Create a prompt for a custom metric - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/model-evaluation-custom-metrics-prompt-formats.html
  - title: "Use metrics to understand model performance - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/model-evaluation-metrics.html
