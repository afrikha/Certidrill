id: aipc01-5a-tool-parameter-accuracy
objective: "5.1.7"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An agent built with Strands Agents can call a create_return tool. Trace reviews show that the agent calls the tool at the right moments but sometimes passes order numbers that do not appear anywhere in the conversation. The team evaluates the agent with Amazon Bedrock AgentCore Evaluations.

    Which built-in evaluator measures this problem?
body:
  options:
    - { id: a, text: { en: "Tool selection accuracy" } }
    - { id: b, text: { en: "Goal success rate" } }
    - { id: c, text: { en: "Tool parameter accuracy" } }
    - { id: d, text: { en: "Faithfulness" } }
answer: { optionId: c }
explanation:
  correct:
    en: "Tool parameter accuracy is a tool-level evaluator that verifies that the parameters of a tool call are accurately derived from the conversation context. Order numbers that appear nowhere in the conversation are parameters that the context does not support."
  options:
    a:
      en: "Tool selection accuracy checks whether calling the tool was justified at that point; the calls already happen at the right moments."
    b:
      en: "Goal success rate judges the outcome of the whole session and does not pinpoint the parameter errors."
    d:
      en: "Faithfulness is a trace-level evaluator of the response, not of the arguments passed to a tool."
references:
  - title: "Prompt templates - Amazon Bedrock AgentCore"
    url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/prompt-templates-builtin.html
