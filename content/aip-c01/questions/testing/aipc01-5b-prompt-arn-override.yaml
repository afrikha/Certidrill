id: aipc01-5b-prompt-arn-override
objective: "5.2.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A team stores its summarization prompt in Amazon Bedrock Prompt Management, with the model and a temperature of 0.7, and invokes version 3 of the prompt by passing its ARN as the modelId of the Converse API. To reduce variation between answers, a developer added an inferenceConfig with a temperature of 0.2 to the Converse request, and every request now fails with ValidationException. The team wants the lower temperature in production and must be able to roll back to the previous configuration.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Move the temperature from inferenceConfig to additionalModelRequestFields in the Converse request, and keep invoking the version 3 ARN.
    - id: b
      text:
        en: |-
          Pass the temperature as a value in promptVariables, and reference the variable in the prompt template of version 3.
    - id: c
      text:
        en: |-
          Set the temperature to 0.2 in the prompt draft, create version 4 from the draft, and invoke the ARN of version 4.
    - id: d
      text:
        en: |-
          Change the temperature of version 3 to 0.2 in the prompt builder, and keep invoking the ARN of version 3.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      When the modelId is a Prompt Management prompt ARN, the Converse request can't include inferenceConfig, system, toolConfig or additionalModelRequestFields: these come from the prompt. Changing the draft and saving it as a new version applies the lower temperature, and version 3 remains as a snapshot to roll back to.
  options:
    a:
      en: |-
        additionalModelRequestFields is also forbidden when the modelId is a prompt ARN, so the request would still fail.
    b:
      en: |-
        Prompt variables fill placeholders in the prompt text; they don't set the model's inference parameters.
    d:
      en: |-
        A version is a snapshot of the prompt; changes are made in the draft and saved as a new version, and overwriting the current configuration would also remove the rollback point.
references:
  - title: Converse - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/APIReference/API_runtime_Converse.html
  - title: Deploy a prompt to your application using versions in Prompt management - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/prompt-management-deploy.html
