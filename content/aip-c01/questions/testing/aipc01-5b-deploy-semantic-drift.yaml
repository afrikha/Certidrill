id: aipc01-5b-deploy-semantic-drift
objective: "5.1.9"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company pins the model version that its policy assistant uses in Amazon Bedrock. Before it moves to a newer model version, it wants an automated check that compares the new model's answers with the current production answers for 500 golden prompts and flags every answer whose meaning has changed. Answers that say the same thing in different words must not be flagged. No human reviewers are available.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Compare the two answers to each prompt character by character, and flag every prompt whose answers are not identical.
    - id: b
      text:
        en: |-
          Embed both answers with Amazon Titan Text Embeddings V2, compute their cosine similarity, and flag the prompts whose similarity is below a threshold.
    - id: c
      text:
        en: |-
          Compare the output token counts of the two answers to each prompt, and flag the prompts whose counts differ by more than 20 percent.
    - id: d
      text:
        en: |-
          Compute a word-overlap score such as BLEU between the two answers, and flag the prompts whose score is below a threshold.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      Embeddings represent meaning, so two answers that say the same thing in different words have a high cosine similarity, and a drop below a calibrated threshold signals semantic drift. Titan Text Embeddings V2 supports semantic similarity tasks in addition to retrieval, and the check runs without human reviewers.
  options:
    a:
      en: |-
        Generated text is rarely identical between model versions, so an exact comparison flags almost every rephrased but equivalent answer.
    c:
      en: |-
        Length says nothing about meaning: an answer can change its conclusion with the same number of tokens, or be reworded with a different length.
    d:
      en: |-
        Word-overlap metrics penalize paraphrases, so equivalent answers worded differently would be flagged.
references:
  - title: Amazon Titan Text Embeddings models - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/titan-embedding-models.html
