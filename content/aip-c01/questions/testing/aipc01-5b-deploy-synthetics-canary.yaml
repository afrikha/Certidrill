id: aipc01-5b-deploy-synthetics-canary
objective: "5.1.9"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A travel company deploys updates to its generative AI booking assistant every night between 01:00 and 03:00, when almost no customers use it. The assistant has a web chat page and an Amazon API Gateway API that calls Amazon Bedrock. After one update, the chat page loaded but every answer failed, and nobody noticed until customers complained in the morning. The company wants to detect a broken end-to-end conversation within minutes, even when no customers are active, with the LEAST operational overhead.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Create a CloudWatch Synthetics canary that runs every 5 minutes, opens the chat page, asks a known question, checks the answer, and alarms when a run fails.
    - id: b
      text:
        en: |-
          Create an Amazon Route 53 health check on the URL of the chat page, and create a CloudWatch alarm on the status of the health check.
    - id: c
      text:
        en: |-
          Create a CloudWatch alarm on the InvocationServerErrors metric of the model so that the team is alerted when model calls fail.
    - id: d
      text:
        en: |-
          Enable AWS X-Ray active tracing on the API stage, and have the on-call engineer review the trace map for failed segments every morning.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      Synthetics canaries are scripts that run on a schedule, as often as once per minute, and follow the same steps as a user, so they test the conversation even when no customer is active. An alarm on the canary's metrics in the CloudWatchSynthetics namespace reports the failure within minutes.
  options:
    b:
      en: |-
        The chat page itself still loaded after the faulty update, so a health check on the page URL would have passed.
    c:
      en: |-
        With almost no traffic the metric has little or no data, and failures such as invalid requests or broken answers are not server errors.
    d:
      en: |-
        Tracing records only real requests and the review is manual and happens hours later, so it does not detect the failure within minutes.
references:
  - title: Synthetic monitoring (canaries) - Amazon CloudWatch
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/CloudWatch_Synthetics_Canaries.html
