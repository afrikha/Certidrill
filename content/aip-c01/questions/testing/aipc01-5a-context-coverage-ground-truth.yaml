id: aipc01-5a-context-coverage-ground-truth
objective: "5.1.6"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A team prepared a dataset for a retrieve-only RAG evaluation of an external retrieval system by using bring your own inference responses. Each record contains the prompt, the retrieved results and a referenceContexts entry with the passages that experts consider relevant. The team selected the context coverage metric, but the job cannot compute it.

    Which change will allow the job to measure context coverage?
body:
  options:
    - { id: a, text: { en: "Rename the referenceContexts entry to retrievedResults so that the job compares the experts' passages with the retrieved ones." } }
    - { id: b, text: { en: "Replace the context coverage metric with the context relevance metric, which uses the referenceContexts entries." } }
    - { id: c, text: { en: "Add a referenceResponses entry with the ground-truth answer text to each record." } }
    - { id: d, text: { en: "Remove the knowledgeBaseIdentifier field so that the job retrieves the passages from the external system again." } }
answer: { optionId: c }
explanation:
  correct:
    en: "Context coverage measures how much the retrieved texts cover the information in the ground truth, and the dataset supplies that ground truth in referenceResponses, which is required when this metric is selected. The built-in metrics do not use referenceContexts, which serves only custom metrics."
  options:
    a:
      en: "retrievedResults holds the passages returned by the system under evaluation; putting the experts' passages there would evaluate the experts' choice, not the system."
    b:
      en: "Built-in metrics do not use referenceContexts, and context relevance does not measure coverage of the needed information."
    d:
      en: "With bring your own inference responses, Amazon Bedrock never calls the external system; knowledgeBaseIdentifier only names the RAG source."
references:
  - title: "Create a prompt dataset for retrieve-only RAG evaluation jobs - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/knowledge-base-evaluation-prompt-retrieve.html
  - title: "Use metrics to understand RAG system performance - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/knowledge-base-evaluation-metrics.html
