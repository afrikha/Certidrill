id: aipc01-5a-rag-citation-metrics
objective: "5.1.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company's RAG assistant on an Amazon Bedrock knowledge base shows source citations under each answer. Reviewers report two problems: some citations point to passages that do not support the cited statement, and some statements have no citation at all. The team wants an automated evaluation that measures both problems before each release.

    Which metrics should the team use in a retrieve-and-generate RAG evaluation job?
body:
  options:
    - { id: a, text: { en: "Context relevance and context coverage" } }
    - { id: b, text: { en: "Faithfulness and completeness" } }
    - { id: c, text: { en: "Citation precision and citation coverage" } }
    - { id: d, text: { en: "Correctness and logical coherence" } }
answer: { optionId: c }
explanation:
  correct:
    en: "Citation precision measures how many of the cited passages were correctly cited, which catches citations that do not support their statement. Citation coverage measures how well the response is supported by the cited passages and whether citations are missing, which catches uncited statements."
  options:
    a:
      en: "These retrieve-only metrics score the retrieved passages against the question and the ground truth; they do not look at the citations in the answer."
    b:
      en: "Faithfulness checks support by the retrieved texts overall, and completeness checks that every part of the question is answered; neither checks individual citations."
    d:
      en: "Correctness and logical coherence judge the accuracy and consistency of the answer, not its citations."
references:
  - title: "Use metrics to understand RAG system performance - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/knowledge-base-evaluation-metrics.html
