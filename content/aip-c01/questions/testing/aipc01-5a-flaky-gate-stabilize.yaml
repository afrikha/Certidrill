id: aipc01-5a-flaky-gate-stabilize
objective: "5.1.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company's CodePipeline quality gate runs an evaluation job that uses a judge model, and it fails when correctness is more than 2 points below the last stored production score. The gate fails intermittently even when nothing has changed. The team found that the pipeline script selects the newest judge model available in the Region for each run, and that repeated runs of the same configuration vary by up to 3 points. The gate must become reliable and still detect real regressions.

    Which solution will meet these requirements?
body:
  options:
    - { id: a, text: { en: "Raise the allowed regression to 5 points so that normal variation never fails the gate." } }
    - { id: b, text: { en: "Pin the judge model version and judge prompt, score the production and candidate configurations in the same pipeline run, and set the tolerance from the variation measured over repeated baseline runs." } }
    - { id: c, text: { en: "Remove the gate, and rely on a canary deployment with a CloudWatch alarm on user ratings to catch regressions." } }
    - { id: d, text: { en: "Evaluate the candidate three times with a different judge model each time, and pass the gate when any of the runs meets the threshold." } }
answer: { optionId: b }
explanation:
  correct:
    en: "A floating judge version and a stale stored baseline make scores move without any change to the application. Pinning the judge and its prompt, scoring the baseline and the candidate side by side on the same dataset, and setting the tolerance from measured run-to-run variation keeps the gate stable while it still fails on regressions larger than the noise."
  options:
    a:
      en: "A 5-point tolerance hides real regressions of 3 or 4 points; it treats the symptom instead of reducing the noise."
    c:
      en: "Without a gate, regressions reach users before anything reacts; a canary complements a gate but does not replace it."
    d:
      en: "Changing judges adds variation, and passing when any run succeeds lets regressions through by chance."
references:
  - title: "Evaluate model performance using another LLM as a judge - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/evaluation-judge.html
  - title: "CreateEvaluationJob - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/APIReference/API_CreateEvaluationJob.html
