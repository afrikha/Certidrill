id: aipc01-5a-agent-goal-success-online
objective: "5.1.7"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company runs a customer service agent built with Strands Agents on Amazon Bedrock AgentCore Runtime, with observability enabled. The product team wants a continuously updated measure of the percentage of production sessions in which the customer's goals were achieved. Evaluating every session is not required.

    Which solution will meet these requirements?
body:
  options:
    - { id: a, text: { en: "Create an AgentCore online evaluation configuration on the agent's log group with the goal success rate evaluator and a sampling percentage." } }
    - { id: b, text: { en: "Run a weekly Amazon Bedrock evaluation job that uses a judge model on the agent's final answers with the Builtin.Helpfulness metric." } }
    - { id: c, text: { en: "Enable trace on the agent with Amazon Bedrock Agents Classic, and count the sessions whose trace ends without a failure trace." } }
    - { id: d, text: { en: "Create a CloudWatch alarm on the agent's error rate, and report one minus the error rate as the share of completed sessions." } }
answer: { optionId: a }
explanation:
  correct:
    en: "Online evaluation continuously scores live traffic from the CloudWatch log groups that hold the agent's traces, and its sampling percentage controls how many sessions are evaluated. The goal success rate evaluator works at the session level and judges whether all user goals in the conversation were completed, which is the task completion rate the team wants."
  options:
    b:
      en: "Helpfulness judges individual responses from the user's perspective, not whether the session's goals were achieved, and a weekly job is not continuous."
    c:
      en: "Amazon Bedrock Agents Classic is closed to new customers since July 30, 2026, and this agent does not run on it; a session without errors can still miss the customer's goal."
    d:
      en: "Sessions without errors can still fail the customer's goal, so the error rate is not a completion measure."
references:
  - title: "Create online evaluation - Amazon Bedrock AgentCore"
    url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/create-online-evaluations.html
  - title: "Prompt templates - Amazon Bedrock AgentCore"
    url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/prompt-templates-builtin.html
