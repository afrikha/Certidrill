id: aipc01-5a-token-latency-data-sources
objective: "5.1.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A team runs the same 500-prompt golden dataset against three Amazon Bedrock models from a dedicated evaluation account that has no other traffic. The team already has a judge correctness score for each response. For each model, the team must now compute quality per 1,000 output tokens and plot quality against p90 end-to-end latency. Requests are not streamed.

    Which data sources should the team use? (Choose two.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "The EstimatedTPMQuotaUsage CloudWatch metric for each model ID" } }
    - { id: b, text: { en: "The TimeToFirstToken CloudWatch metric with the ModelId dimension and the p90 statistic" } }
    - { id: c, text: { en: "The usage.outputTokens value returned in each Converse response, stored with the prompt ID and the judge score" } }
    - { id: d, text: { en: "The CacheWriteInputTokenCount CloudWatch metric for each model ID" } }
    - { id: e, text: { en: "The InvocationLatency CloudWatch metric with the ModelId dimension and the p90 statistic" } }
answer: { optionIds: [ c, e ] }
explanation:
  correct:
    en: "The Converse response returns the input, output and total token counts of each call, which can be joined with the judge score of the same prompt to compute quality per 1,000 output tokens. InvocationLatency measures the time from the request to the last token for each model ID, and its p90 statistic gives the end-to-end latency to compare with quality; the dedicated account keeps other traffic out of the metric."
  options:
    a:
      en: "EstimatedTPMQuotaUsage approximates quota consumption; it does not report the tokens that each response actually generated."
    b:
      en: "TimeToFirstToken is published only for streaming operations and measures the first token, not end-to-end latency."
    d:
      en: "Cache write tokens are input tokens written to the prompt cache, not output tokens."
references:
  - title: "Monitor bedrock-runtime inference using CloudWatch metrics - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/monitoring-runtime-metrics.html
  - title: "Converse - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/APIReference/API_runtime_Converse.html
