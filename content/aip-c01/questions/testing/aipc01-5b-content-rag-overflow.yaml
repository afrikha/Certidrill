id: aipc01-5b-content-rag-overflow
objective: "5.2.1"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    A support chatbot calls the Retrieve API of an Amazon Bedrock knowledge base and sends the conversation history, the 25 retrieved chunks, and the question to a model through the Converse API. For broad questions late in long conversations, requests fail with ValidationException because the input is too long. The answers must stay grounded in the most relevant passages and must still take the recent conversation into account.

    Which actions will resolve the issue? (Choose two.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Increase the maxTokens value in the inferenceConfig of the Converse request.
    - id: b
      text:
        en: |-
          Set a token budget for retrieved context, and drop the lowest-scoring chunks until the request fits.
    - id: c
      text:
        en: |-
          Switch the knowledge base to hierarchical chunking with large parent chunks.
    - id: d
      text:
        en: |-
          Enable query decomposition so that each question runs as several retrieval queries.
    - id: e
      text:
        en: |-
          Keep the most recent turns verbatim, and replace the older turns with a summary.
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: |-
      Each retrieval result has a relevance score, so keeping the highest-scoring chunks within a fixed token budget (measured with CountTokens, for example) cuts input tokens while keeping the most relevant passages. Summarizing older turns while keeping recent ones verbatim shrinks the history and keeps the recent context.
  options:
    a:
      en: |-
        maxTokens sets the output budget; it doesn't make more input fit.
    c:
      en: |-
        Hierarchical chunking replaces matching child chunks with their larger parent chunks, which adds tokens to each result.
    d:
      en: |-
        Query decomposition can run several queries against the knowledge base, which tends to bring back more content, not less.
references:
  - title: Monitor your token usage by counting tokens before running inference - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/count-tokens.html
  - title: How content chunking works for knowledge bases - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/kb-chunking.html
