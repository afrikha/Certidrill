id: aipc01-5b-maint-schema-keywords
objective: "5.2.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A team uses structured outputs with the Amazon Bedrock Converse API to extract invoice data. To enforce business rules, it added "minimum": 0 to the amount property and "maxLength": 3 to the currency property of the JSON schema. Since then, every request fails with ValidationException (HTTP 400). The team must keep schema-conformant output and still enforce the business rules.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Remove minimum and maxLength from the schema, and check those rules in the application after the model returns each response.
    - id: b
      text:
        en: |-
          Set additionalProperties to true on the root object of the schema so that the additional keywords are accepted.
    - id: c
      text:
        en: |-
          Increase the client read timeout to 120 seconds so that the grammar for the changed schema has time to compile.
    - id: d
      text:
        en: |-
          Move the schema to a tool definition with strict set to true so that the keywords are enforced on the tool input.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      Structured outputs support a subset of JSON Schema: numeric constraints such as minimum and string length constraints such as maxLength are not supported and return a 400 error. Keeping the supported schema guarantees the shape, and a validation step after the call enforces the business rules.
  options:
    b:
      en: |-
        additionalProperties must be false on every object; any other value is itself rejected with ValidationException.
    c:
      en: |-
        The error is an immediate validation failure of the schema, not a timeout during grammar compilation.
    d:
      en: |-
        Strict tool use relies on the same supported JSON Schema subset, so the unsupported keywords are still a problem.
references:
  - title: Get validated JSON results from models - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/structured-output.html
