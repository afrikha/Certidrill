id: aipc01-5b-integ-idle-keepalive
objective: "5.2.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company runs a document question-answering service on Amazon ECS tasks in private subnets. The tasks reach Amazon Bedrock through an interface VPC endpoint by using a long-lived boto3 client. Traffic is bursty. After quiet periods of several minutes, the first request often hangs for more than a minute or fails with a connection reset, and the following requests are fast.

    Which solution will resolve the issue?
body:
  options:
    - id: a
      text:
        en: |-
          Enable tcp_keepalive in the botocore client configuration, and set the TCP keep-alive time of the tasks' operating system below 350 seconds.
    - id: b
      text:
        en: |-
          Replace the interface VPC endpoint with a NAT gateway so that the tasks reach the public Amazon Bedrock endpoint instead.
    - id: c
      text:
        en: |-
          Increase the maximum number of retry attempts of the boto3 client to 10, and change the retry mode of the client to adaptive.
    - id: d
      text:
        en: |-
          Switch the application from the Converse API to the ConverseStream API so that each response starts arriving sooner.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      Interface VPC endpoints, NAT gateways and Network Load Balancers drop connections that are idle for 350 seconds without notifying the client, so the next request on a pooled connection hangs or resets. AWS recommends enabling TCP keep-alive in the SDK (off by default in boto3) and lowering the OS keep-alive interval below 350 seconds; both settings are required.
  options:
    b:
      en: |-
        NAT gateways have the same 350-second idle timeout, so the stale pooled connections would still be dropped.
    c:
      en: |-
        More retries may eventually succeed but don't stop idle connections from being dropped, so the long first-request delay remains.
    d:
      en: |-
        Streaming changes how the response is returned, not what happens to a pooled connection that sat idle between bursts.
references:
  - title: Troubleshooting Amazon Bedrock API Error Codes - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/troubleshooting-api-error-codes.html
