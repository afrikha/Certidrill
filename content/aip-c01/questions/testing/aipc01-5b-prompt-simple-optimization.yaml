id: aipc01-5b-prompt-simple-optimization
objective: "5.2.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A developer has one prompt of about 300 tokens that asks a model in Amazon Bedrock to extract action items from meeting notes. The output is often incomplete. The developer has no evaluation dataset and wants a quick, automatic rewrite of the prompt for the target model that they can review before they use it.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Call the OptimizePrompt API with the prompt and the target model ID, and review the optimized prompt that it returns.
    - id: b
      text:
        en: |-
          Create an Advanced Prompt Optimization job with the prompt, a set of evaluation samples, and ground truth answers.
    - id: c
      text:
        en: |-
          Create a model evaluation job that uses LLM-as-a-judge to score the outputs of the current prompt.
    - id: d
      text:
        en: |-
          Create a guardrail with a contextual grounding check, and apply it to the responses of the current prompt.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      Simple prompt optimization (OptimizePrompt) performs a fast rewrite of a single short prompt for one target model, and works best for prompts of about 1K tokens or less. It needs no evaluation data and returns the analysis and the optimized prompt for review.
  options:
    b:
      en: |-
        Advanced Prompt Optimization needs evaluation samples, ground truth and a metric, which the developer doesn't have.
    c:
      en: |-
        An evaluation job measures the current prompt's quality but doesn't rewrite the prompt.
    d:
      en: |-
        A grounding check filters ungrounded responses at run time; it doesn't improve the prompt or make the extraction complete.
references:
  - title: Optimize a prompt - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/prompt-management-optimize.html
