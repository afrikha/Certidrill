id: aipc01-5b-prompt-advanced-optimization
objective: "5.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company is moving its customer-email classification workload to a different foundation model in Amazon Bedrock. Its six prompt templates were tuned for the current model, and accuracy dropped on the new model. The team has 80 labeled example emails per template and an LLM-as-a-judge rubric. It wants an automated rewrite of the templates for the new model, scored on its examples, compared with the current model as a baseline, and reported with the latency of each model, with the LEAST effort.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Call the OptimizePrompt API for each template with the new model as the target, and deploy the rewritten templates.
    - id: b
      text:
        en: |-
          Create three variants of each template in Prompt Management, and compare their outputs manually in the prompt builder.
    - id: c
      text:
        en: |-
          Fine-tune the new model on the 480 labeled examples so that it follows the existing templates more closely.
    - id: d
      text:
        en: |-
          Run an Advanced Prompt Optimization job with the six templates, the labeled examples, the judge rubric, and both models.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      Advanced Prompt Optimization rewrites up to 10 templates per job in an evaluation-driven loop, using up to 100 samples per template with ground truth and a metric such as an LLM-as-a-judge rubric. For a migration, the current model is the baseline among up to 5 models, and the results include scores, latency and time to first token for each model.
  options:
    a:
      en: |-
        Simple optimization rewrites one short prompt for one model without evaluation data, so it neither uses the labeled examples nor compares the models.
    b:
      en: |-
        Manual comparison of variants is not automated rewriting or scoring and takes the most effort.
    c:
      en: |-
        Fine-tuning is a model customization project with training cost; it doesn't rewrite the templates or compare them with the current model.
references:
  - title: How Advanced Prompt Optimization works - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/advanced-prompt-optimization-how.html
  - title: Optimize a prompt - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/prompt-management-optimize.html
