id: aipc01-5a-feedback-traceability-fix
objective: "5.1.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A team investigated a spike in thumbs-down ratings for an assistant that calls the Amazon Bedrock Converse API. The team found no record of the prompts and responses that were rated, and it could not match the ratings to specific model calls. The team wants every future rating to be traceable to the exact request and response.

    Which actions should the team take? (Choose two.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "Enable Amazon Bedrock model invocation logging to Amazon S3 in the Region where the application runs." } }
    - { id: b, text: { en: "Add the conversation ID to the system prompt and instruct the model to repeat it at the end of each response." } }
    - { id: c, text: { en: "Pass the conversation ID and turn ID in requestMetadata on each Converse call, and store the same IDs with each rating." } }
    - { id: d, text: { en: "Add a ConversationId dimension to the InvocationLatency metric of the model in the CloudWatch console." } }
    - { id: e, text: { en: "Increase the retention period of the application's Lambda log group so that older invocations remain available." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: "Model invocation logging is disabled by default and is configured per Region; once enabled, it records the request and response bodies of Converse calls. requestMetadata adds caller-supplied key-value pairs (up to 16) to each logged invocation, so storing the same conversation and turn IDs with each rating makes the join exact."
  options:
    b:
      en: "This makes the model responsible for an identifier that it may alter or omit, and it adds tokens; requestMetadata carries identifiers outside the prompt."
    d:
      en: "Amazon Bedrock publishes its runtime metrics with predefined dimensions such as ModelId; a conversation dimension cannot be added to them."
    e:
      en: "Longer retention keeps what is already logged, but the function's log group does not contain the prompts and responses."
references:
  - title: "Monitor model invocation using CloudWatch Logs and Amazon S3 - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/model-invocation-logging.html
  - title: "Converse - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/APIReference/API_runtime_Converse.html
