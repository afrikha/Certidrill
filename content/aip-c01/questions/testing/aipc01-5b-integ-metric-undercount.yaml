id: aipc01-5b-integ-metric-undercount
objective: "5.2.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    An operations team built a CloudWatch dashboard that shows the Amazon Bedrock InvocationClientErrors metric for each model, by using the ModelId dimension. The application logs show many more client errors than the dashboard does. Some of the logged errors come from requests that used an incorrect model identifier, and others are validation errors. The team wants the dashboard to show every client error.

    Which change will meet this requirement?
body:
  options:
    - id: a
      text:
        en: |-
          Add the InvocationThrottles metric to each widget, and sum it with InvocationClientErrors for each model.
    - id: b
      text:
        en: |-
          Add a widget that shows the InvocationClientErrors metric without specifying any dimension.
    - id: c
      text:
        en: |-
          Change each widget to the series that use both the ModelId and the ContextWindow dimensions.
    - id: d
      text:
        en: |-
          Change the statistic of each InvocationClientErrors widget from Sum to SampleCount.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      When a request fails before Amazon Bedrock determines which model it targets, its metrics are published without the ModelId dimension, so filtering by ModelId undercounts errors. Querying the metric without a dimension counts all requests, including those with an incorrect model identifier.
  options:
    a:
      en: |-
        Throttled requests are counted separately and are not client errors in this metric; adding them would mix two different problems and still miss the errors published without ModelId.
    c:
      en: |-
        The ModelId plus ContextWindow series are a subset of the ModelId series (long-context requests), so they show fewer errors, not more.
    d:
      en: |-
        Changing the statistic doesn't add the data points that were published without the ModelId dimension.
references:
  - title: Monitor bedrock-runtime inference using CloudWatch metrics - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/monitoring-runtime-metrics.html
