id: aipc01-5a-rating-store-lookup-analytics
objective: "5.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company is adding answer ratings to its assistant. When a user reopens a conversation, the client must show the user's previous rating of each answer with single-digit millisecond latency. Each week, analysts must join all ratings with the model invocation logs that are stored in Amazon S3 by using SQL. The company wants the LEAST operational overhead.

    Which solution will meet these requirements?
body:
  options:
    - { id: a, text: { en: "Store the ratings in a DynamoDB table keyed by conversation ID and turn ID, and use DynamoDB Streams to invoke a Lambda function that writes each rating to Amazon S3 for Athena queries." } }
    - { id: b, text: { en: "Write the ratings to a CloudWatch Logs log group, and have both the client and the analysts query the log group with CloudWatch Logs Insights." } }
    - { id: c, text: { en: "Write each rating as a JSON object to Amazon S3, and have the client list and read the objects of the conversation when the user reopens it." } }
    - { id: d, text: { en: "Store the ratings in an Amazon OpenSearch Service domain, and have the analysts export the index to Amazon S3 each week before they query it." } }
answer: { optionId: a }
explanation:
  correct:
    en: "DynamoDB returns an item by its key with single-digit millisecond latency, which fits the client lookup. DynamoDB Streams captures every write and invokes a Lambda function that copies each rating to S3, where Athena can join the ratings with the invocation logs, with no servers to manage."
  options:
    b:
      en: "Logs Insights runs analytical queries over log events in a time range; it is not a store for millisecond key lookups by a client application."
    c:
      en: "Listing and reading S3 objects for each conversation does not give single-digit millisecond lookups to the client."
    d:
      en: "A domain to size and operate plus a manual weekly export adds more overhead than a managed key-value table with a stream."
references:
  - title: "DynamoDB Streams and AWS Lambda triggers - Amazon DynamoDB"
    url: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/Streams.Lambda.html
