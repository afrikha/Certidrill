id: aipc01-5b-report-managed-grafana
objective: "5.1.8"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company's generative AI platform team monitors Amazon Bedrock metrics in Amazon CloudWatch, request traces in AWS X-Ray, and conversation analytics in an Amazon OpenSearch Service domain. About 200 engineers and product owners want shared dashboards that correlate data from all three sources in the same view. Users must sign in through AWS IAM Identity Center, and the team does not want to manage any servers for the dashboards.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Install open-source Grafana on Amazon EC2 instances behind an Application Load Balancer, add the three data sources, and configure single sign-on.
    - id: b
      text:
        en: |-
          Share the existing CloudWatch dashboards publicly, and post the links next to the OpenSearch Dashboards and X-Ray console links on the team portal.
    - id: c
      text:
        en: |-
          Create an Amazon Managed Grafana workspace with IAM Identity Center authentication, and add CloudWatch, X-Ray, and OpenSearch Service as data sources.
    - id: d
      text:
        en: |-
          Create an IAM user for each person with read-only access to CloudWatch, X-Ray, and OpenSearch Dashboards, and let each person open the three consoles.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      Amazon Managed Grafana provides fully managed, logically isolated Grafana workspaces that query and correlate metrics, logs and traces from sources such as CloudWatch, OpenSearch Service and X-Ray. It integrates with IAM Identity Center for sign-in, so the team builds shared dashboards without running servers.
  options:
    a:
      en: |-
        Self-managed Grafana on EC2 meets the visualization need but requires the team to run, patch and scale servers.
    b:
      en: |-
        Public links bypass IAM Identity Center, and separate links to three tools don't correlate the data in the same view.
    d:
      en: |-
        IAM users don't use IAM Identity Center sign-in, and three separate consoles don't provide one correlated view.
references:
  - title: What is Amazon Managed Grafana? - Amazon Managed Grafana
    url: https://docs.aws.amazon.com/grafana/latest/userguide/what-is-Amazon-Managed-Service-Grafana.html
