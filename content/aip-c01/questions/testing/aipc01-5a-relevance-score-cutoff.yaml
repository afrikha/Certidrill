id: aipc01-5a-relevance-score-cutoff
objective: "5.1.6"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A team wants to drop low-relevance chunks returned by the Retrieve API of an Amazon Bedrock knowledge base before they are added to the prompt. The team must choose a cutoff that removes noise without losing the chunks that answers need, and it must be able to justify the chosen value.

    Which actions should the team take? (Choose two.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "Use a fixed cutoff of 0.5, because relevance scores are normalized the same way for all embedding models and vector stores." } }
    - { id: b, text: { en: "Set the relevance threshold of a guardrail's contextual grounding check to filter the retrieved chunks before generation." } }
    - { id: c, text: { en: "Apply the cutoff to the score value that the Retrieve API returns with each retrieval result." } }
    - { id: d, text: { en: "Test candidate cutoffs on a labeled question set, and measure how often the relevant chunk is kept and how many irrelevant chunks are removed." } }
    - { id: e, text: { en: "Use the InvocationLatency metric to find the chunks that slowed down generation, and remove those chunks." } }
answer: { optionIds: [ c, d ] }
explanation:
  correct:
    en: "Each retrieval result carries a score that expresses its relevance to the query, so the application can drop results below a cutoff. Because scores depend on the embedding model and the vector store, the cutoff must be calibrated on labeled questions by measuring the relevant chunks kept against the noise removed, which also justifies the value."
  options:
    a:
      en: "No fixed cutoff applies to every configuration; score distributions depend on the embedding model and the store, so the cutoff must be calibrated on your own data."
    b:
      en: "The relevance check of contextual grounding scores the model response against the query; it does not filter retrieved chunks."
    e:
      en: "InvocationLatency is a per-invocation model metric; it says nothing about the relevance of individual chunks."
references:
  - title: "KnowledgeBaseRetrievalResult - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/APIReference/API_agent-runtime_KnowledgeBaseRetrievalResult.html
  - title: "Configure and customize queries and response generation - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/kb-test-config.html
