id: aipc01-5b-report-quick-exec-email
objective: "5.1.8"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A financial services company runs nightly Amazon Bedrock evaluation jobs for its customer-support assistant. A Lambda function writes a summary of each run (judge scores per metric, cost per conversation, and business unit) to an Amazon S3 bucket as CSV files. Executives from four business units want an interactive dashboard of quality and cost trends delivered to their inboxes every Monday, and each executive must see only the data of their own business unit. The executives are already users of the company's Amazon Quick Sight Enterprise edition subscription. The company wants the LEAST operational overhead.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Publish the summary values as CloudWatch custom metrics with a BusinessUnit dimension, build one CloudWatch dashboard per business unit, and share each dashboard with its executive's email address.
    - id: b
      text:
        en: |-
          Load the summaries into an Amazon OpenSearch Service domain, build an OpenSearch Dashboards view for each business unit, and email the executives the links every Monday.
    - id: c
      text:
        en: |-
          Catalog the CSV files as an Amazon Athena table, build a Quick Sight dashboard on it with row-level security by business unit, and schedule a weekly email report to the executives.
    - id: d
      text:
        en: |-
          Schedule a Lambda function that reads the CSV files every Monday, renders one set of chart images per business unit, and emails the images to each executive.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      Quick Sight can use an Athena dataset over the CSV files in place, and its Enterprise edition sends a dashboard as an email report on a weekly schedule to users who share the subscription. Row-level security applies to scheduled email reports, so each executive receives a snapshot that contains only their business unit's data, with no code to maintain.
  options:
    a:
      en: |-
        Anyone a CloudWatch dashboard is shared with receives cloudwatch:GetMetricData for the whole account, which cannot be scoped to specific metrics, so an executive could query the other units' data; CloudWatch also has no scheduled email delivery of dashboards.
    b:
      en: |-
        Running and securing an OpenSearch domain and maintaining per-unit views adds operational overhead, and sending links does not deliver the dashboard itself on a schedule.
    d:
      en: |-
        A custom rendering and email function must be built and maintained, and static images are not an interactive dashboard, so this has more overhead than a managed scheduled report.
references:
  - title: Scheduling and sending Quick Sight reports by email - AWS Quick
    url: https://docs.aws.amazon.com/quick/latest/userguide/sending-reports.html
  - title: Creating a dataset using Amazon Athena data - AWS Quick
    url: https://docs.aws.amazon.com/quick/latest/userguide/create-a-data-set-athena.html
