id: aipc01-5a-hybrid-search-store-fallback
objective: "5.1.6"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A software company's Amazon Bedrock knowledge base stores troubleshooting articles in Amazon S3 Vectors. Questions that contain error codes such as ERR-7731 often miss the article that documents that code. The team set overrideSearchType to HYBRID in its Retrieve calls and reran its labeled test set, but recall for error-code questions did not change. The team wants error-code questions to retrieve the right article.

    Which solution will meet these requirements?
body:
  options:
    - { id: a, text: { en: "Increase numberOfResults until the articles for the error codes appear in the results, and pass all the results to the generator." } }
    - { id: b, text: { en: "Enable a reranker model so that the results that contain the error code are moved to the top of the list." } }
    - { id: c, text: { en: "Switch to an embedding model that produces vectors with more dimensions, and resync the data source." } }
    - { id: d, text: { en: "Move the knowledge base to a vector store that supports hybrid search, such as Amazon OpenSearch Serverless with a filterable text field, and rerun the labeled tests." } }
answer: { optionId: d }
explanation:
  correct:
    en: "Hybrid search is supported only for Amazon RDS, OpenSearch Serverless and MongoDB vector stores that contain a filterable text field; with other stores the query uses semantic search, which is why the test results did not change. A supported store adds text matching on exact error codes, and rerunning the labeled tests confirms the gain."
  options:
    a:
      en: "More results add tokens and noise and still rely on semantic similarity, which handles exact identifiers poorly."
    b:
      en: "A reranker only reorders the candidates that retrieval returned; it cannot bring back an article that semantic search missed."
    c:
      en: "More dimensions change the vector representation but still do not give exact keyword matching on error codes."
references:
  - title: "Configure and customize queries and response generation - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/kb-test-config.html
