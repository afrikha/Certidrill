id: aipc01-5b-deploy-legacy-model-alarm
objective: "5.1.9"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company has dozens of applications in one AWS account that call Amazon Bedrock with pinned model IDs. When a model enters the Legacy state, the company must validate a replacement model before the end-of-life date, but some teams have missed lifecycle notices in the past. The platform team wants an automatic alert whenever any application in the account still invokes a model that is in the Legacy state, without maintaining a list of model IDs, and with the LEAST operational overhead.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Create a CloudWatch alarm on the InvocationClientErrors metric so that the team is alerted when requests to a retired model start to fail.
    - id: b
      text:
        en: |-
          Schedule a Lambda function that calls GetFoundationModel for each model ID in a list kept by the teams and alerts when the lifecycle is Legacy.
    - id: c
      text:
        en: |-
          Create a CloudWatch alarm on the Amazon Bedrock LegacyModelInvocations metric that fires when the number of invocations is greater than zero.
    - id: d
      text:
        en: |-
          Run a weekly CloudWatch Logs Insights query on the model invocation logs that lists the distinct model IDs that the applications invoked.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      Amazon Bedrock publishes the LegacyModelInvocations metric, which counts invocations of models in the Legacy state, whatever application sends them. An alarm on it alerts the platform team while there is still time to validate a replacement before the end-of-life date, when requests to the model will fail.
  options:
    a:
      en: |-
        Client errors appear only after the end-of-life date, when requests fail, which is too late to validate a replacement.
    b:
      en: |-
        The function depends on a list that the teams must maintain, which the platform team wants to avoid, and misses any model ID that is not on the list.
    d:
      en: |-
        The query lists model IDs but not their lifecycle state, so someone must still check each ID manually every week.
references:
  - title: Monitor bedrock-runtime inference using CloudWatch metrics - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/monitoring-runtime-metrics.html
  - title: Model lifecycle - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/model-lifecycle.html
