id: aipc01-5a-summary-faithfulness-metric
objective: "5.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A legal publisher uses an FM to summarize court decisions. Each prompt contains the full text of one decision. Editors found summaries that mention facts that do not appear in the decision. The team wants an automated metric that flags responses that contain information that is not in the text provided in the prompt.

    Which metric should the team select in an Amazon Bedrock evaluation job that uses a judge model?
body:
  options:
    - { id: a, text: { en: "Builtin.Relevance" } }
    - { id: b, text: { en: "Builtin.Coherence" } }
    - { id: c, text: { en: "Builtin.Completeness" } }
    - { id: d, text: { en: "Builtin.Faithfulness" } }
answer: { optionId: d }
explanation:
  correct:
    en: "Faithfulness measures whether the response contains information that is not found in the prompt, that is, how faithful it is to the context the model received. A summary that adds facts absent from the decision gets a low faithfulness score, which is exactly the defect the editors found."
  options:
    a:
      en: "Relevance measures how relevant the answer is to the prompt; a summary can be on topic and still add invented facts."
    b:
      en: "Logical coherence looks for gaps, inconsistencies and contradictions within the response, not for content that is missing from the source."
    c:
      en: "Completeness measures whether the response addresses every part of the request; it rewards covering more, not staying within the source."
references:
  - title: "Use metrics to understand model performance - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/model-evaluation-metrics.html
