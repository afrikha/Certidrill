id: aipc01-5a-rating-selection-bias
objective: "5.1.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company's assistant handles 200,000 conversations each week. About 2 percent of users rate an answer, and most of the ratings are negative. Leadership wants a weekly estimate of answer quality that represents all traffic, without adding any step for users. Model invocation logging is enabled.

    Which solution will meet these requirements?
body:
  options:
    - { id: a, text: { en: "Report the weekly share of thumbs-up ratings among all submitted ratings as the quality KPI, broken down by model and by prompt version." } }
    - { id: b, text: { en: "Require users to rate each answer before they can ask their next question, and report the weekly average rating as the quality KPI." } }
    - { id: c, text: { en: "Run a weekly programmatic evaluation job with the TriviaQA built-in dataset on the current model and prompt, and report its accuracy score as the quality KPI." } }
    - { id: d, text: { en: "Each week, sample logged interactions at random, score them with a judge-model evaluation job that uses the logged responses, and use the ratings only to select cases for review." } }
answer: { optionId: d }
explanation:
  correct:
    en: "Voluntary ratings come from a small, self-selected group, so they are biased. A random sample of logged interactions represents all traffic, and a judge-model job with bring your own inference responses scores those exact responses without invoking the model again. The ratings remain useful to pick cases for expert review."
  options:
    a:
      en: "The 2 percent of users who rate are self-selected and mostly unhappy, so the share of positive ratings reflects who chooses to rate, not overall quality."
    b:
      en: "A mandatory rating adds a step for users, which the requirement forbids."
    c:
      en: "A public trivia dataset does not represent the company's traffic or domain."
references:
  - title: "Create a prompt dataset for a model evaluation job that uses a model as judge - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/model-evaluation-prompt-datasets-judge.html
  - title: "Monitor model invocation using CloudWatch Logs and Amazon S3 - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/model-invocation-logging.html
