id: aipc01-5a-ab-test-business-outcome
objective: "5.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A telecom company serves its support assistant from an Amazon SageMaker AI endpoint. An offline judge evaluation shows that a new model scores slightly higher than the current model. Before switching all traffic, the product owner wants to know which model leads to more support cases resolved without a human agent.

    Which solution will meet these requirements?
body:
  options:
    - { id: a, text: { en: "Run a shadow test of the new model and compare the resolution rate of the shadow variant's responses with that of the production variant's responses." } }
    - { id: b, text: { en: "Run a larger offline evaluation that uses a judge model with the Builtin.Helpfulness metric, and switch models if the score difference grows." } }
    - { id: c, text: { en: "Deploy both models as production variants with weighted traffic, record the variant that served each conversation, and compare the resolution rates." } }
    - { id: d, text: { en: "Update the endpoint with a deployment guardrails canary configuration, and promote the new model if no CloudWatch alarm fires during the baking period." } }
answer: { optionId: c }
explanation:
  correct:
    en: "Resolution without an agent is a business outcome that appears only when real users interact with each model, so it needs a live A/B test. Production variants split live traffic by weight, and recording which variant served each conversation lets the company compare resolution rates before shifting all traffic."
  options:
    a:
      en: "Shadow responses are never returned to users, so no customer case can be resolved by them; a shadow test compares operational metrics only."
    b:
      en: "Offline helpfulness scores estimate quality but do not measure the business outcome with real users."
    d:
      en: "A canary deployment protects a rollout with operational alarms; it does not compare the business outcome of the two models."
references:
  - title: "Testing models with production variants - Amazon SageMaker AI"
    url: https://docs.aws.amazon.com/sagemaker/latest/dg/model-ab-testing.html
  - title: "Shadow tests - Amazon SageMaker AI"
    url: https://docs.aws.amazon.com/sagemaker/latest/dg/shadow-tests.html
