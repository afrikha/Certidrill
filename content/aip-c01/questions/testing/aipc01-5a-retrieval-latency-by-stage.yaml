id: aipc01-5a-retrieval-latency-by-stage
objective: "5.1.6"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    A company's assistant calls the RetrieveAndGenerate API of an Amazon Bedrock knowledge base, and users report slow answers. The team must measure how much of the latency comes from retrieval and how much from generation. The team must also track retrieval latency over time with an alarm.

    Which actions should the team take? (Choose two.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "Replace the RetrieveAndGenerate call with a Retrieve call followed by a Converse call that includes the retrieved passages, so that each stage can be timed separately." } }
    - { id: b, text: { en: "Use the InvocationLatency metric in the AWS/Bedrock namespace as the retrieval latency of the knowledge base." } }
    - { id: c, text: { en: "Read the retrieval time of each request from the model invocation logs, which record every RetrieveAndGenerate call." } }
    - { id: d, text: { en: "Time each stage in the application, and publish the retrieval duration as a CloudWatch custom metric with an alarm on its p90 statistic." } }
    - { id: e, text: { en: "Use the TimeToFirstToken metric as the retrieval latency, because the first token is produced after retrieval completes." } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: "RetrieveAndGenerate returns one response for both stages, so the application cannot time them separately; calling Retrieve and then Converse exposes each stage. Publishing the measured retrieval duration as a custom metric creates a time series that dashboards and an alarm can use."
  options:
    b:
      en: "InvocationLatency measures model invocations on the bedrock-runtime endpoint, not knowledge base retrieval."
    c:
      en: "Model invocation logging covers Converse, ConverseStream, InvokeModel and InvokeModelWithResponseStream calls, not RetrieveAndGenerate calls."
    e:
      en: "TimeToFirstToken is measured for streaming model invocations from the request to the first token of the model; it does not measure knowledge base retrieval."
references:
  - title: "Monitor model invocation using CloudWatch Logs and Amazon S3 - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/model-invocation-logging.html
  - title: "Monitor bedrock-runtime inference using CloudWatch metrics - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/monitoring-runtime-metrics.html
