id: aipc01-5b-retrieval-aurora-indexes
objective: "5.2.4"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    A company's Amazon Bedrock knowledge base uses an Amazon Aurora PostgreSQL vector store that the team created manually. Retrieval latency has grown as the table reached millions of chunks, and queries with selective metadata filters often return fewer results than numberOfResults. The cluster runs pgvector 0.8.0.

    Which actions should the team take to resolve both issues? (Choose two.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Change the search type of the retrieval requests from HYBRID to SEMANTIC.
    - id: b
      text:
        en: |-
          Create a B-tree index on the column that stores the text chunks.
    - id: c
      text:
        en: |-
          Create an HNSW index on the embedding column with vector_cosine_ops and a GIN index on custom_metadata.
    - id: d
      text:
        en: |-
          Increase the maximum number of database connections of the Aurora cluster.
    - id: e
      text:
        en: |-
          Enable HNSW iterative index scans for the database, for example with hnsw.iterative_scan set to relaxed_order.
answer: { optionIds: [ c, e ] }
explanation:
  correct:
    en: |-
      Bedrock's Aurora setup requires an HNSW index on the embedding column and GIN indexes for text and custom metadata; without them, queries scan the table. With pgvector 0.8.0 or later, HNSW iterative index scans keep scanning when selective metadata filters remove candidates, so filtered queries return the expected number of results.
  options:
    a:
      en: |-
        Dropping the text part of the search doesn't add the missing vector index or fix filtered queries that return too few results.
    b:
      en: |-
        Text search on the chunks uses a GIN index on its tsvector; a B-tree index helps neither vector search nor metadata filtering.
    d:
      en: |-
        More connections don't make each query faster when it scans the whole table, and don't change how filters reduce the results.
references:
  - title: Prerequisites for using a vector store you created for a knowledge base - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/knowledge-base-setup.html
