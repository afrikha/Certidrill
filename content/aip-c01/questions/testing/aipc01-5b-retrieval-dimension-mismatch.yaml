id: aipc01-5b-retrieval-dimension-mismatch
objective: "5.2.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A team created an Amazon OpenSearch Serverless vector index with a knn_vector field of 1,536 dimensions and the faiss engine. It then created an Amazon Bedrock knowledge base on that index that uses Amazon Titan Text Embeddings V2 with the default output dimension. Every ingestion job fails with indexing errors. The team must keep Titan Text Embeddings V2.

    Which solution will resolve the issue?
body:
  options:
    - id: a
      text:
        en: |-
          Create a new vector index with a 1,024-dimension vector field and the faiss engine, create a knowledge base on it with the same embedding model, and ingest the data.
    - id: b
      text:
        en: |-
          Set the output dimension of Titan Text Embeddings V2 to 1,536 in the knowledge base configuration, and start a new ingestion job.
    - id: c
      text:
        en: |-
          Change the engine of the vector field from faiss to nmslib so that vectors of different sizes are accepted, and start a new ingestion job.
    - id: d
      text:
        en: |-
          Change the embedding model of the existing knowledge base to Titan Text Embeddings G1, and start a new ingestion job with the same index.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      Titan Text Embeddings V2 outputs 1,024 dimensions by default (512 or 256 optionally), so 1,024-dimension vectors can't be written to a 1,536-dimension field. The vector field must match the model's dimension and use the faiss engine; recreating the index with 1,024 dimensions and ingesting again fixes the failures.
  options:
    b:
      en: |-
        Titan Text Embeddings V2 supports only 1,024, 512 or 256 dimensions, so 1,536 is not an option.
    c:
      en: |-
        Knowledge bases require the faiss engine, and changing the engine doesn't change the dimension of the field.
    d:
      en: |-
        The team must keep Titan Text Embeddings V2, and the embedding model of an existing knowledge base can't be changed.
references:
  - title: Prerequisites for using a vector store you created for a knowledge base - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/knowledge-base-setup.html
  - title: Amazon Titan Text Embeddings models - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/titan-embedding-models.html
