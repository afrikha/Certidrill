id: aipc01-5b-integ-apigw-timeout
objective: "5.2.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company exposes a report generator through an edge-optimized REST API in Amazon API Gateway with a Lambda proxy integration. The Lambda function calls Amazon Bedrock and needs up to 50 seconds for large reports. Clients receive a 504 error after 29 seconds, although the function completes successfully. The company must keep a synchronous request-response API, and the clients can be pointed to a new endpoint URL.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Request a quota increase to raise the integration timeout of the existing edge-optimized API to 60 seconds.
    - id: b
      text:
        en: |-
          Increase the timeout of the Lambda function to 900 seconds, and redeploy the stage of the existing API.
    - id: c
      text:
        en: |-
          Enable API caching on the stage so that repeated report requests are answered within 29 seconds.
    - id: d
      text:
        en: |-
          Create a Regional REST API with the same integration, and request a quota increase to raise its integration timeout to 60 seconds.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      The REST API integration timeout is 50 milliseconds to 29 seconds by default. It can be increased for Regional and private APIs, possibly with a reduction of the account's Region-level throttle quota, but not for edge-optimized APIs. A Regional API with a raised timeout keeps the synchronous API.
  options:
    a:
      en: |-
        The integration timeout of edge-optimized APIs can't be increased above 29 seconds.
    b:
      en: |-
        The function already completes; API Gateway stops waiting at 29 seconds whatever the function timeout is.
    c:
      en: |-
        Caching helps only repeated identical requests; the first request for each report still exceeds 29 seconds.
references:
  - title: Quotas for configuring and running a REST API in API Gateway - Amazon API Gateway
    url: https://docs.aws.amazon.com/apigateway/latest/developerguide/api-gateway-execution-service-limits-table.html
