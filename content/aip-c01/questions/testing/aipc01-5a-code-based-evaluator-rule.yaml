id: aipc01-5a-code-based-evaluator-rule
objective: "5.1.7"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A bank's payments agent must never call the issue_refund tool for more than $500 unless the approve_exception tool was called earlier in the same session. The risk team wants every evaluated session checked against this rule with deterministic logic rather than an LLM judge, within Amazon Bedrock AgentCore Evaluations.

    Which solution will meet these requirements?
body:
  options:
    - { id: a, text: { en: "Use the built-in tool selection accuracy evaluator with its default configuration." } }
    - { id: b, text: { en: "Create a custom LLM-as-a-judge evaluator whose instructions describe the refund rule." } }
    - { id: c, text: { en: "Select a third-party evaluator from the DeepEval library that checks tool usage." } }
    - { id: d, text: { en: "Create a code-based custom evaluator that runs an AWS Lambda function to check the tool calls of each session." } }
answer: { optionId: d }
explanation:
  correct:
    en: "Code-based custom evaluators run your own Lambda function to evaluate agent performance programmatically, so the rule can be checked with exact logic on the tool calls and their arguments. The result is deterministic, which an LLM judge cannot guarantee."
  options:
    a:
      en: "Tool selection accuracy is an LLM-as-a-judge evaluator of whether a call was justified; it does not apply the bank's numeric rule deterministically."
    b:
      en: "An LLM judge interprets the instructions, so its verdicts are not deterministic, which the risk team does not accept."
    c:
      en: "Third-party evaluators run the predefined metrics of open-source libraries; they do not encode the bank's specific rule."
references:
  - title: "Evaluators - Amazon Bedrock AgentCore"
    url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/evaluators.html
  - title: "Evaluate agent performance with Amazon Bedrock AgentCore Evaluations - Amazon Bedrock AgentCore"
    url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/evaluations.html
