id: aipc01-5b-deploy-sagemaker-canary
objective: "5.1.9"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company hosts a fine-tuned open-weight model on an Amazon SageMaker AI real-time endpoint for document summarization. A new model version must first serve a small portion of live traffic for 30 minutes while a CloudWatch alarm watches a hallucination-rate metric that the application publishes. If the alarm fires, all traffic must return to the current version automatically. The current version must keep its full capacity until the new version passes validation.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Update the endpoint with a blue/green deployment that uses all-at-once traffic shifting, a 30-minute baking period, and the alarm for automatic rollback.
    - id: b
      text:
        en: |-
          Update the endpoint with a blue/green deployment that uses canary traffic shifting, a 30-minute baking period, and the alarm for automatic rollback.
    - id: c
      text:
        en: |-
          Update the endpoint with a rolling deployment that replaces instances in small batches, a 30-minute baking period, and the alarm for automatic rollback.
    - id: d
      text:
        en: |-
          Add the new version as a second production variant with 10 percent of the traffic, and change the variant weights manually after 30 minutes.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      Canary traffic shifting in a blue/green deployment sends a small portion of traffic to the new (green) fleet and monitors the CloudWatch alarms for the baking period. The blue fleet keeps serving the rest of the traffic; if an alarm trips, SageMaker AI rolls traffic back to it, and it is terminated only after the rest of the traffic has shifted successfully.
  options:
    a:
      en: |-
        All-at-once shifting moves all traffic to the new version before the baking period starts, so the new version is not limited to a small portion of traffic.
    c:
      en: |-
        A rolling deployment cleans up old instances batch by batch as traffic shifts, so the current version does not keep its full capacity during validation.
    d:
      en: |-
        Production variants split traffic, but nothing rolls back automatically when the alarm fires; the weights change only when someone acts.
references:
  - title: Deployment guardrails for updating models in production - Amazon SageMaker AI
    url: https://docs.aws.amazon.com/sagemaker/latest/dg/deployment-guardrails.html
