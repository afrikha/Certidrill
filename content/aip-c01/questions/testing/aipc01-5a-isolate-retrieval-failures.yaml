id: aipc01-5a-isolate-retrieval-failures
objective: "5.1.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company's RAG assistant on an Amazon Bedrock knowledge base gives wrong answers to about 20 percent of the questions in its test set. The team has a ground-truth answer for each question. Before it changes the prompt or the generator model, the team wants to know whether the knowledge base returns the information that the answers need.

    Which solution will meet these requirements?
body:
  options:
    - { id: a, text: { en: "Switch the generator to a larger model, rerun the test set, and check whether the share of wrong answers drops." } }
    - { id: b, text: { en: "Run a retrieve-and-generate RAG evaluation job with the helpfulness and logical coherence metrics on the test set." } }
    - { id: c, text: { en: "Increase the number of retrieved results to 20, rerun the test set, and check whether the share of wrong answers drops." } }
    - { id: d, text: { en: "Run a retrieve-only RAG evaluation job with the context relevance and context coverage metrics, using the ground-truth answers." } }
answer: { optionId: d }
explanation:
  correct:
    en: "A retrieve-only job evaluates the retrieved texts alone: context relevance shows whether they relate to the question, and context coverage, which needs ground truth, shows whether they contain the information the answer requires. Low scores point at retrieval; good scores point at the prompt or the generator."
  options:
    a:
      en: "Changing the generator mixes both stages and does not show whether the needed information was retrieved."
    b:
      en: "Helpfulness and logical coherence judge the final answer, so a low score cannot be attributed to retrieval."
    c:
      en: "Changing a retrieval setting before measuring adds tokens and cost and still does not isolate the cause."
references:
  - title: "Use metrics to understand RAG system performance - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/knowledge-base-evaluation-metrics.html
  - title: "Create a prompt dataset for retrieve-only RAG evaluation jobs - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/knowledge-base-evaluation-prompt-retrieve.html
