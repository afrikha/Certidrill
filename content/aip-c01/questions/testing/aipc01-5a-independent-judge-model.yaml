id: aipc01-5a-independent-judge-model
objective: "5.1.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company compares two candidate generator models, one from Provider A and one from Provider B, by running Amazon Bedrock evaluation jobs that use a judge model on the same dataset. A data scientist proposes the Provider A model as the judge because it is the most capable model that the team can use. The team wants the comparison to be as fair as possible.

    Which judge configuration should the team use?
body:
  options:
    - { id: a, text: { en: "Use the Provider A model as the judge for both evaluations, because the most capable judge produces the most accurate scores." } }
    - { id: b, text: { en: "Use each candidate model as the judge of its own responses, so that each judge applies its own interpretation of the metrics." } }
    - { id: c, text: { en: "Use a supported judge model from a third provider for both evaluations with the same metrics, and keep it unchanged for later comparisons." } }
    - { id: d, text: { en: "Use a different judge model for each evaluation, chosen at random from the supported list, and average the scores over several runs." } }
answer: { optionId: c }
explanation:
  correct:
    en: "A judge from the family of one candidate may favor responses that resemble its own outputs, so an independent judge removes that bias. Using the same judge model and metrics for both candidates, and keeping it unchanged, makes the scores comparable now and in later runs."
  options:
    a:
      en: "A judge from the same provider as one candidate may prefer that candidate's style, which skews the comparison."
    b:
      en: "Each model judging itself applies a different standard to each candidate, so the scores are not comparable."
    d:
      en: "Changing judges between evaluations adds variation that has nothing to do with the candidates."
references:
  - title: "Evaluate model performance using another LLM as a judge - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/evaluation-judge.html
