id: aipc01-5b-report-ops-model-invocations
objective: "5.1.8"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A software company runs several applications that call foundation models in Amazon Bedrock. The operations team wants one view that shows invocation counts, token usage, latency percentiles, errors, and throttling events for the models that the applications use. Model invocation logging is already enabled. The team does not want to write code or build its own dashboard.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Create an AWS Glue crawler on the invocation log bucket, query the logs with Amazon Athena, and build an Amazon Quick Sight analysis on the query results.
    - id: b
      text:
        en: |-
          Open the Model Invocations dashboard of Amazon CloudWatch generative AI observability, which is built on the Amazon Bedrock metrics and invocation logs.
    - id: c
      text:
        en: |-
          Create an AWS CloudTrail trail with Amazon Bedrock data events, and review the event history grouped by the model ID of each request.
    - id: d
      text:
        en: |-
          Use AWS Cost Explorer with a filter on the Amazon Bedrock service, and group the results by usage type and by model.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      CloudWatch generative AI observability provides a prebuilt Model Invocations dashboard for any model used for inference in Amazon Bedrock. It shows invocations, token usage, latency (average, p90, p99), error rates and throttling events, and a curated table of invocation logs, so the team gets the view without code.
  options:
    a:
      en: |-
        A Glue, Athena and Quick Sight pipeline works but means building and maintaining the data model and the dashboard, which the team wants to avoid.
    c:
      en: |-
        CloudTrail records who called which API and when; it does not provide token counts, latency percentiles or throttling metrics for a dashboard.
    d:
      en: |-
        Cost Explorer reports cost and usage, not latency, errors or throttling events.
references:
  - title: Generative AI observability - Amazon CloudWatch
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/GenAI-observability.html
  - title: Monitor bedrock-runtime inference using CloudWatch metrics - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/monitoring-runtime-metrics.html
