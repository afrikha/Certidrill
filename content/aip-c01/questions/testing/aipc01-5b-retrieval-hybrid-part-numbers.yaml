id: aipc01-5b-retrieval-hybrid-part-numbers
objective: "5.2.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An electronics retailer's Amazon Bedrock knowledge base uses an Amazon OpenSearch Serverless vector store that has a filterable text field. Questions in natural language return good passages, but questions that contain an exact part number, such as "Is XR-4410-B compatible with the dock?", often return passages about other parts. Passages that mention the exact part number exist in the index.

    Which change will MOST improve these results?
body:
  options:
    - id: a
      text:
        en: |-
          Set overrideSearchType to HYBRID in the vector search configuration of the retrieval requests.
    - id: b
      text:
        en: |-
          Reduce the output dimension of the embedding model from 1,024 to 256 and ingest the documents again.
    - id: c
      text:
        en: |-
          Lower numberOfResults so that only the closest semantic matches are returned for each question.
    - id: d
      text:
        en: |-
          Move the documents to a data source that uses semantic chunking with a higher breakpoint threshold.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      Semantic search compares meaning, so identifiers such as part numbers are poorly matched by embeddings. Hybrid search combines vector search with a search of the raw text, which matches the exact part number; it is supported for OpenSearch Serverless vector stores that have a filterable text field.
  options:
    b:
      en: |-
        A smaller embedding dimension saves storage at some cost in accuracy; it doesn't add exact matching of identifiers.
    c:
      en: |-
        Fewer semantic results narrow the list but keep the same ranking, which already misses the exact part number.
    d:
      en: |-
        Semantic chunking changes chunk boundaries, not how the query is matched, so identifiers are still compared only by meaning.
references:
  - title: Configure and customize queries and response generation - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/kb-test-config.html
