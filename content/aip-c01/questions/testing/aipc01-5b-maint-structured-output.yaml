id: aipc01-5b-maint-structured-output
objective: "5.2.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An order-processing service parses the JSON returned by a model in Amazon Bedrock through the Converse API. After a recent prompt edit, some responses include an introductory sentence before the JSON or extra fields that the parser rejects. The company wants every response to conform to a JSON schema when it is generated.

    Which solution will meet this requirement?
body:
  options:
    - id: a
      text:
        en: |-
          Add two examples of the expected JSON to the prompt, and instruct the model to return only JSON.
    - id: b
      text:
        en: |-
          Retry each request up to three times when the parser rejects the response that the model returned.
    - id: c
      text:
        en: |-
          Add a guardrail word filter that blocks the responses that contain common introductory phrases.
    - id: d
      text:
        en: |-
          Set outputConfig.textFormat to a json_schema structure in which every object sets additionalProperties to false.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      Structured outputs constrain the response to the JSON schema passed in outputConfig.textFormat, so no prose or undeclared fields are generated. Every object in the schema must set additionalProperties to false, otherwise the request is rejected.
  options:
    a:
      en: |-
        Examples and instructions improve compliance but don't guarantee it, which is how the current problem appeared.
    b:
      en: |-
        Retries treat the symptom, add latency and cost, and can still fail; they don't make generation conform.
    c:
      en: |-
        A word filter blocks whole responses instead of producing valid JSON, and doesn't prevent extra fields.
references:
  - title: Get validated JSON results from models - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/structured-output.html
