id: aipc01-5b-content-map-reduce
objective: "5.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A compliance team uses a model in Amazon Bedrock to summarize regulatory filings. Some filings are much longer than the model's context window, and those requests fail. The summary must reflect every section of each filing, and the team must keep the current model.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Split each filing on its section boundaries, summarize each section in a separate request, and combine the section summaries in a final request.
    - id: b
      text:
        en: |-
          Increase the maxTokens value of the request so that the model can read and summarize the full filing in a single request.
    - id: c
      text:
        en: |-
          Ingest the filings into a knowledge base, and call RetrieveAndGenerate with a request to summarize the whole filing.
    - id: d
      text:
        en: |-
          Truncate each filing to the number of tokens that the model accepts, and summarize the truncated text in one request.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      Processing the filing in parts that each fit the context window, then summarizing the partial summaries (a map-reduce pattern, for example with a Step Functions Map state), covers every section with the current model. Splitting on section boundaries keeps each part coherent.
  options:
    b:
      en: |-
        maxTokens limits the output; it does not let the model accept more input than its context window.
    c:
      en: |-
        RetrieveAndGenerate passes only the top retrieved chunks (5 by default) to the model, so the summary would not cover every section.
    d:
      en: |-
        Truncation drops the sections that don't fit, which breaks the requirement to reflect every section.
references:
  - title: Configure and customize queries and response generation - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/kb-test-config.html
  - title: Converse - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/APIReference/API_runtime_Converse.html
