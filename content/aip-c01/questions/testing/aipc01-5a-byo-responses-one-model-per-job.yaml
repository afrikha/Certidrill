id: aipc01-5a-byo-responses-one-model-per-job
objective: "5.1.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company is choosing a model for a contract review assistant. The candidates are a model on Amazon Bedrock, an open-weight model that the company hosts on Amazon EKS, and a third-party model that is available only through its provider's API. The team wants all three candidates scored by the same judge model and metrics on the same 600 prompts, with the least custom scoring code.

    Which solution will meet these requirements?
body:
  options:
    - { id: a, text: { en: "Create one evaluation job that uses a judge model, with a dataset that contains three modelResponses entries for each prompt, one per candidate, each with its own modelIdentifier." } }
    - { id: b, text: { en: "Create one evaluation job that uses a judge model and invokes the Bedrock model, and add the EKS endpoint and the provider's API as additional generator models of the job." } }
    - { id: c, text: { en: "Create three evaluation jobs with the same prompts, judge model and metrics: one that invokes the Bedrock model, and one per external model whose dataset contains that model's precomputed responses." } }
    - { id: d, text: { en: "Import the open-weight model and the third-party model with Custom Model Import, and create one evaluation job that uses a judge model to invoke all three candidates." } }
answer: { optionId: c }
explanation:
  correct:
    en: "With bring your own inference responses, Amazon Bedrock skips the invocation step and judges the responses in the dataset, which is how models hosted outside Bedrock are evaluated. A job accepts one response per prompt and one unique modelIdentifier, and automated jobs evaluate a single model or inference profile, so each candidate needs its own job with identical prompts, judge model and metrics to keep the scores comparable."
  options:
    a:
      en: "A judge-model job supports only one model response per prompt and one unique modelIdentifier per job, so a dataset with three responses per prompt is not valid."
    b:
      en: "The inference configuration of an automated job takes a single Bedrock model or inference profile; models outside Bedrock are evaluated only through precomputed responses."
    d:
      en: "The third-party model is only available through an API, so there are no weights to import, and one automated job still evaluates a single model."
references:
  - title: "Create a prompt dataset for a model evaluation job that uses a model as judge - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/model-evaluation-prompt-datasets-judge.html
  - title: "CreateEvaluationJob - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/APIReference/API_CreateEvaluationJob.html
