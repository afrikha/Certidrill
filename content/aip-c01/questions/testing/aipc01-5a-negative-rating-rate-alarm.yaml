id: aipc01-5a-negative-rating-rate-alarm
objective: "5.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An assistant's feedback API stores each rating through an AWS Lambda function. The operations team must be notified within 15 minutes when the share of thumbs-down ratings over the last hour exceeds 8 percent. Analysts already query the stored ratings weekly with Amazon Athena.

    Which solution will meet these requirements?
body:
  options:
    - { id: a, text: { en: "Schedule a daily Athena query that computes the share of thumbs-down ratings, and display the result in an AWS Quick dashboard." } }
    - { id: b, text: { en: "Configure AWS Cost Anomaly Detection with a monitor for Amazon Bedrock and an alert subscription for the operations team." } }
    - { id: c, text: { en: "Create a CloudWatch alarm on the InvocationClientErrors metric of the model, and send its notifications through Amazon SNS." } }
    - { id: d, text: { en: "Have the Lambda function publish custom metrics for all ratings and for thumbs-down ratings, and create a CloudWatch alarm on a metric math expression of their ratio that notifies an SNS topic." } }
answer: { optionId: d }
explanation:
  correct:
    en: "Custom metrics published by the function arrive in near real time, and a metric math expression such as thumbs-down ratings divided by all ratings over a one-hour period produces the share as a single time series that an alarm can evaluate. The alarm notifies the operations team through Amazon SNS within minutes."
  options:
    a:
      en: "A daily query cannot notify within 15 minutes, and a dashboard does not alert anyone."
    b:
      en: "Cost Anomaly Detection watches spending patterns, not user ratings."
    c:
      en: "InvocationClientErrors counts failed requests; poorly rated answers are successful invocations and never appear in this metric."
references:
  - title: "Create a CloudWatch alarm based on a metric math expression - Amazon CloudWatch"
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/Create-alarm-on-metric-math-expression.html
  - title: "Publish custom metrics (PutMetricData / EMF) - Amazon CloudWatch"
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/publishingMetrics.html
