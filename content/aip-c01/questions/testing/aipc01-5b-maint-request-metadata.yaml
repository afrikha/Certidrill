id: aipc01-5b-maint-request-metadata
objective: "5.2.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company uses three versions of a prompt template in production for different customer segments, and all its applications call the Amazon Bedrock Converse API. Model invocation logging to CloudWatch Logs is enabled. A downstream service reports that some responses are malformed. The team must find out which prompt version produces the malformed responses, with the LEAST effort.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Enable AWS CloudTrail data events for Amazon Bedrock, and search the recorded events for the malformed responses.
    - id: b
      text:
        en: |-
          Export the invocation logs to Amazon S3 every day, load them into an Amazon DynamoDB table, and scan the table for malformed responses.
    - id: c
      text:
        en: |-
          Add the prompt version to the requestMetadata of each Converse call, and count malformed responses by that value with CloudWatch Logs Insights.
    - id: d
      text:
        en: |-
          Move each prompt version to a separate AWS account, and compare the InvocationClientErrors metric of the three accounts.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      requestMetadata adds up to 16 caller-defined key-value pairs to each Converse call, and they appear in the invocation log records to filter them. A Logs Insights query over the existing log group can then group the malformed responses by prompt version, with no new data store.
  options:
    a:
      en: |-
        CloudTrail records API activity, not the response bodies that the team needs to inspect.
    b:
      en: |-
        Building an export and a DynamoDB table adds a pipeline when the logs can already be queried in place.
    d:
      en: |-
        Malformed output is returned successfully, so it doesn't appear as client errors, and splitting accounts is heavy work.
references:
  - title: Converse - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/APIReference/API_runtime_Converse.html
  - title: Monitor model invocation using CloudWatch Logs and Amazon S3 - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/model-invocation-logging.html
