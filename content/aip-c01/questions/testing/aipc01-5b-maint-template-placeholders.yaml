id: aipc01-5b-maint-template-placeholders
objective: "5.2.5"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    An application renders its own prompt templates before it calls Amazon Bedrock, and fills placeholders such as {{customer_tier}} from a profile service. After a change in the profile service, some prompts were sent with placeholders that were left unfilled. The model returned confused answers but no error, so no alarm fired. Model invocation logging to CloudWatch Logs is enabled. The team wants to detect this problem before release and in production.

    Which actions should the team take? (Choose two.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Create a CloudWatch alarm on the InvocationServerErrors metric of the model that the application uses.
    - id: b
      text:
        en: |-
          Add a pipeline test that renders each template version with test data and fails if a placeholder is unresolved or empty.
    - id: c
      text:
        en: |-
          Raise the temperature of the requests so that the model can fill in the missing customer details on its own.
    - id: d
      text:
        en: |-
          Add a guardrail denied topic that blocks prompts that mention customer tiers or other profile attributes.
    - id: e
      text:
        en: |-
          Create a metric filter on the invocation log group that matches the {{ placeholder marker in requests, with an alarm on it.
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: |-
      A template test in the pipeline renders every version and fails the build when a variable is missing, which stops the problem before release. In production, the invocation logs contain the request body that the model received, so a metric filter on the unrendered placeholder marker turns silent prompt confusion into a metric and an alarm.
  options:
    a:
      en: |-
        The requests succeed, so neither server errors nor any other error metric reflects the confused answers.
    c:
      en: |-
        A higher temperature makes the model guess more freely, which hides the missing data instead of detecting it.
    d:
      en: |-
        A denied topic would block legitimate prompts about customer tiers and doesn't detect unfilled placeholders.
references:
  - title: Monitor model invocation using CloudWatch Logs and Amazon S3 - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/model-invocation-logging.html
