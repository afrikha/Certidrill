id: aipc01-5a-rag-compare-external-stack
objective: "5.1.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company has a self-managed RAG system that uses a vector database on Amazon EC2 and a model hosted on Amazon SageMaker AI. It is evaluating a replacement built on an Amazon Bedrock knowledge base. The team must compare both systems on the same questions for retrieval quality, answer correctness and citation precision, with one evaluator model and no custom scoring code.

    Which solution will meet these requirements?
body:
  options:
    - { id: a, text: { en: "Run retrieve-only RAG evaluation jobs for both systems, and supply the self-managed system's retrieved passages as its inference responses." } }
    - { id: b, text: { en: "Run a model evaluation job that uses a judge model with the self-managed system's answers as its own responses, and a retrieve-and-generate RAG job for the knowledge base." } }
    - { id: c, text: { en: "Run a programmatic evaluation job with the question and answer task type on the answers of both systems, and compare their accuracy scores." } }
    - { id: d, text: { en: "Run retrieve-and-generate RAG evaluation jobs with the same evaluator model and metrics: one on the knowledge base, and one whose dataset contains the self-managed system's passages and answers." } }
answer: { optionId: d }
explanation:
  correct:
    en: "Retrieve-and-generate jobs can evaluate an Amazon Bedrock knowledge base or the inference responses of an external RAG source that you bring in the dataset, so both systems get the same retrieval and generation metrics, including correctness and citation precision. Using the same evaluator model and metrics in both jobs keeps the scores comparable."
  options:
    a:
      en: "Retrieve-only jobs measure the retrieved passages only; they produce no correctness or citation scores for the answers."
    b:
      en: "A model evaluation job does not produce RAG metrics such as citation precision, so the two systems would be scored on different metrics."
    c:
      en: "Programmatic accuracy measures word overlap with reference answers and gives no retrieval or citation metric."
references:
  - title: "Evaluate the performance of RAG sources using Amazon Bedrock evaluations - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/evaluation-kb.html
  - title: "Use metrics to understand RAG system performance - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/knowledge-base-evaluation-metrics.html
