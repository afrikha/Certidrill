id: aipc01-5a-annotation-rubric-agreement
objective: "5.1.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A healthcare software company asks clinicians to rate assistant answers from 1 to 5 for clinical accuracy in its internal annotation tool. The ratings are used to calibrate an LLM-as-a-judge custom metric. Different clinicians give very different scores to the same answers, so the calibration is unreliable. The company wants annotations that are consistent enough to calibrate the judge.

    Which solution will meet these requirements?
body:
  options:
    - { id: a, text: { en: "Average the scores that all clinicians give to each answer, and use the averages to calibrate the judge without changing the rating process." } }
    - { id: b, text: { en: "Keep only the ratings of the most senior clinician, and discard the ratings of the other annotators from the calibration set." } }
    - { id: c, text: { en: "Give annotators a written rubric with an example answer for each score, have two clinicians rate each answer, measure their agreement, and adjudicate disagreements." } }
    - { id: d, text: { en: "Replace the clinicians with the judge model for the calibration set so that every answer is rated by the same evaluator." } }
answer: { optionId: c }
explanation:
  correct:
    en: "Disagreement usually comes from undefined criteria, so a rubric with an anchored example for each score aligns the annotators, and the same criteria can later feed the judge's custom metric prompt and rating scale. Double rating measures agreement, and adjudication resolves the remaining conflicts, which produces reliable reference ratings for calibrating the judge."
  options:
    a:
      en: "Averaging inconsistent ratings hides the disagreement instead of removing its cause, so the reference stays noisy."
    b:
      en: "One person's ratings are never checked for consistency and reflect a single interpretation of the scale, so the reference is still unvalidated."
    d:
      en: "Calibration checks the judge against human ratings; rating the calibration set with the judge itself makes the check circular."
references:
  - title: "Create a prompt for a custom metric - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/model-evaluation-custom-metrics-prompt-formats.html
