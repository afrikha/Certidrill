id: aipc01-5a-on-demand-trace-evaluation
objective: "5.1.7"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company's support agent on Amazon Bedrock AgentCore had 40 sessions last week that customers escalated as failures. The team wants to score exactly the traces of those 40 sessions with the same evaluators that it uses in production, to understand what went wrong. The team does not want to wait for new traffic.

    Which solution will meet these requirements?
body:
  options:
    - { id: a, text: { en: "Run an on-demand evaluation that specifies the trace IDs of the 40 sessions." } }
    - { id: b, text: { en: "Create an online evaluation configuration with a sampling percentage of 100 percent." } }
    - { id: c, text: { en: "Run an Amazon Bedrock retrieve-only RAG evaluation job on the questions from the 40 sessions." } }
    - { id: d, text: { en: "Enable trace in the InvokeAgent calls, and replay the 40 sessions against the agent." } }
answer: { optionId: a }
explanation:
  correct:
    en: "On-demand evaluation scores the exact spans or traces that you identify by their IDs, with built-in or custom evaluators, and it is meant for investigating specific customer interactions and historical data. It processes only the specified traces, so no new traffic is needed."
  options:
    b:
      en: "Online evaluation monitors live traffic from now on; it does not target past sessions."
    c:
      en: "A retrieve-only RAG job evaluates knowledge base retrieval, not the agent's traces and tool calls."
    d:
      en: "enableTrace belongs to Amazon Bedrock Agents Classic (InvokeAgent), which is closed to new customers and is not how this AgentCore agent runs."
references:
  - title: "On-demand evaluation - Amazon Bedrock AgentCore"
    url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/on-demand-evaluations.html
