id: aipc01-5a-agent-efficiency-diagnosis
objective: "5.1.7"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company's research agent on Amazon Bedrock AgentCore Runtime completes most tasks correctly, but its cost and latency per task are much higher than planned. The team suspects that the agent repeats tool calls and takes unnecessary steps. AgentCore Observability is enabled.

    Which actions will identify the cause? (Choose two.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "Inspect the AgentCore spans and the token usage metrics in CloudWatch to count the model and tool calls per completed task." } }
    - { id: b, text: { en: "Add the goal success rate evaluator to an online evaluation configuration for the agent." } }
    - { id: c, text: { en: "Add the tool selection accuracy evaluator to an online evaluation configuration for the agent." } }
    - { id: d, text: { en: "Create a CloudWatch alarm on the InvocationThrottles metric of the model that the agent uses." } }
    - { id: e, text: { en: "Run an evaluation job that uses a judge model on the agent's final answers with the Builtin.Correctness metric." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: "AgentCore Observability stores spans for each step and metrics such as latency, duration and token usage in CloudWatch, so the team can count steps and tool calls per task and spot loops. The tool selection accuracy evaluator determines whether each selected action is justified and optimal at that point, which flags redundant calls."
  options:
    b:
      en: "The agent already completes most tasks; goal success says nothing about how many steps it took."
    d:
      en: "Throttles show quota pressure, not why the agent takes extra steps."
    e:
      en: "Final-answer correctness is already good and does not reveal the path the agent took."
references:
  - title: "Observability, audit logging, and tracing for your agents - Amazon Bedrock AgentCore"
    url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/observability.html
  - title: "Prompt templates - Amazon Bedrock AgentCore"
    url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/prompt-templates-builtin.html
