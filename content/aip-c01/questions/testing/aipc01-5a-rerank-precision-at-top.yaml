id: aipc01-5a-rerank-precision-at-top
objective: "5.1.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company's RAG assistant passes 5 chunks from an Amazon Bedrock knowledge base to the generator for each question. Tests on a labeled question set show that the relevant chunk is within the top 25 results for 95 percent of the questions but within the top 5 for only 60 percent. The questions are about a single topic each. The team wants more relevant chunks in the prompt without sending more chunks to the generator.

    Which solution will meet these requirements?
body:
  options:
    - { id: a, text: { en: "Increase the number of results to 25 so that the relevant chunk is almost always included in the prompt." } }
    - { id: b, text: { en: "Enable query decomposition so that each question is split into several sub-queries before retrieval." } }
    - { id: c, text: { en: "Retrieve 25 results, reorder them with a reranker model, and pass the top 5 reranked chunks to the generator." } }
    - { id: d, text: { en: "Add a metadata filter on the document modification date to exclude older documents from the results." } }
answer: { optionId: c }
explanation:
  correct:
    en: "A reranker model calculates how relevant each chunk is to the query and reorders the results, overriding the default ranking of the knowledge base. Retrieving a larger candidate set and keeping the top 5 reranked chunks raises precision at the top without increasing what the generator receives."
  options:
    a:
      en: "Sending 25 chunks raises token cost and adds noise to the prompt, which the team wants to avoid."
    b:
      en: "Query decomposition helps multi-part questions; these questions are single-topic, and it runs additional queries."
    d:
      en: "Nothing indicates that the relevant chunks are recent; a date filter could exclude them."
references:
  - title: "Improve the relevance of query responses with a reranker model in Amazon Bedrock - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/rerank.html
  - title: "Configure and customize queries and response generation - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/kb-test-config.html
