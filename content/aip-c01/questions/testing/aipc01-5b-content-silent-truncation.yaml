id: aipc01-5b-content-silent-truncation
objective: "5.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A RAG application built with an open-source orchestration framework retrieves passages from a vector store and calls a model in Amazon Bedrock. For questions about long product manuals, answers ignore information that the retrieval step returned, although no error is raised and the stopReason is end_turn. The team suspects that the framework shortens the prompt before it sends the request, and it must confirm what the model actually received.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Enable model invocation logging, and compare the request bodies in the logs with the passages that the retrieval step returned.
    - id: b
      text:
        en: |-
          Create an AWS CloudTrail trail, and inspect the recorded Converse events for the text of the prompt that was sent.
    - id: c
      text:
        en: |-
          Increase the number of passages that the retrieval step returns, and check whether the answers include the missing information.
    - id: d
      text:
        en: |-
          Create a CloudWatch alarm on the InputTokenCount metric that fires when the count exceeds the model's context window.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      Model invocation logging records the request body (input.inputBodyJson) and its input token count for each call. Comparing what the model received with what retrieval returned shows whether passages were dropped or shortened before the call.
  options:
    b:
      en: |-
        CloudTrail records API activity such as the caller, the operation and the time; it is not where Bedrock records the request and response bodies.
    c:
      en: |-
        Adding passages changes the input instead of diagnosing it, and if the framework truncates, more passages make the truncation worse.
    d:
      en: |-
        A truncated prompt is below the limit by definition, so the alarm would never fire, and the metric shows a count, not the content.
references:
  - title: Monitor model invocation using CloudWatch Logs and Amazon S3 - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/model-invocation-logging.html
