id: aipc01-5b-content-agent-history
objective: "5.2.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company built a customer-service agent with the Strands Agents SDK and a model in Amazon Bedrock. In long conversations, the agent failed with context window overflow errors. The team then reduced the window of the default conversation manager, and the agent began asking customers again for the order number that they gave at the start of the conversation. The agent must keep working in long conversations and must retain the key facts from early turns.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Keep the SlidingWindowConversationManager and reduce its window size further so that fewer messages are sent with each request.
    - id: b
      text:
        en: |-
          Configure the agent with a SummarizingConversationManager so that older messages are replaced with a summary instead of being dropped.
    - id: c
      text:
        en: |-
          Configure the agent with the NullConversationManager so that the full conversation history is always sent to the model.
    - id: d
      text:
        en: |-
          Increase the maxTokens value of the model configuration so that more of the conversation history fits in each request.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      The SummarizingConversationManager summarizes the oldest part of the history when the context must be reduced, while keeping the most recent messages. The summary preserves facts such as the order number and keeps each request within the context window.
  options:
    a:
      en: |-
        The sliding window, which is the default, discards the oldest messages; a smaller window loses early facts even sooner.
    c:
      en: |-
        The NullConversationManager never trims the history, so long conversations would overflow the context window again.
    d:
      en: |-
        maxTokens limits the generated output; it does not enlarge the context window available for the history.
references:
  - title: Conversation Management
    url: https://strandsagents.com/docs/user-guide/concepts/agents/conversation-management/
  - title: Converse - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/APIReference/API_runtime_Converse.html
