id: aipc01-5a-per-category-regression-gate
objective: "5.1.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A retail company's release gate runs an evaluation job that uses a judge model on a 900-prompt golden dataset and blocks a release when the average correctness score is below 0.88. A new prompt passed with an average of 0.90. Customers then reported wrong answers about refunds, which make up 8 percent of the dataset. The company wants the gate to catch this kind of regression.

    Which solution will meet these requirements?
body:
  options:
    - { id: a, text: { en: "Add a category field, such as refunds, shipping or billing, to each dataset record, and gate on the score of each category compared with the production configuration." } }
    - { id: b, text: { en: "Double the size of the golden dataset by generating paraphrases of the existing prompts, and keep the threshold on the average score." } }
    - { id: c, text: { en: "Replace the judge model with a larger model, and raise the threshold on the average correctness score to 0.92." } }
    - { id: d, text: { en: "Add the Builtin.Coherence metric to the job, and block a release when the average coherence score is below 0.88." } }
answer: { optionId: a }
explanation:
  correct:
    en: "A global average can hide a collapse in a small category: 8 percent of the prompts can fail without moving the average much. When records carry a category field, the evaluation reports scores per category, so the gate can compare each category with production and block a release when one of them regresses."
  options:
    b:
      en: "Paraphrases keep the same proportion of refund prompts, so the average still hides the drop."
    c:
      en: "A larger judge and a higher threshold still measure one global average, in which the refund regression stays diluted."
    d:
      en: "Logical coherence does not detect wrong refund facts, and it is still an average across all prompts."
references:
  - title: "Create a prompt dataset for a model evaluation job that uses a model as judge - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/model-evaluation-prompt-datasets-judge.html
