id: aipc01-5a-shadow-test-no-user-impact
objective: "5.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company serves a fine-tuned LLM from an Amazon SageMaker AI real-time endpoint. A new model version passed offline evaluation. Before promoting it, the team wants to measure its latency and error rate on real production requests as they arrive. No user may receive a response from the new version during the test.

    Which solution will meet these requirements?
body:
  options:
    - { id: a, text: { en: "Create a shadow test that deploys the new version as a shadow variant that receives a copy of the production requests." } }
    - { id: b, text: { en: "Add the new version as a second production variant with a weight of 10 percent and compare the per-variant CloudWatch metrics." } }
    - { id: c, text: { en: "Update the endpoint with a deployment guardrails canary configuration that shifts 10 percent of traffic to the new version." } }
    - { id: d, text: { en: "Add the new version as a production variant and invoke it with the TargetVariant parameter from a script that replays last week's requests." } }
answer: { optionId: a }
explanation:
  correct:
    en: "A shadow test routes a copy of the inference requests to the shadow variant in real time on the same endpoint, and only the production variant's responses are returned to callers. The team can compare operational metrics such as latency and errors on real traffic with no user impact."
  options:
    b:
      en: "A weighted production variant answers real users for its share of the traffic, which the requirement forbids."
    c:
      en: "A canary shift sends live traffic to the new fleet, so some users receive its responses."
    d:
      en: "Replaying old requests from a script does not test real production requests as they arrive, and it requires custom tooling that a shadow test already provides."
references:
  - title: "Shadow tests - Amazon SageMaker AI"
    url: https://docs.aws.amazon.com/sagemaker/latest/dg/shadow-tests.html
  - title: "Testing models with production variants - Amazon SageMaker AI"
    url: https://docs.aws.amazon.com/sagemaker/latest/dg/model-ab-testing.html
