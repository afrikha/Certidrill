id: aipc01-5a-summarization-bertscore
objective: "5.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A news company generates short summaries of its articles with an FM. It wants a low-cost score of how close in meaning each generated summary is to a summary written by an editor. The score must be computed by an algorithm, not by a judge model. The company has a custom dataset with an editor's reference summary for each article.

    Which Amazon Bedrock evaluation configuration will meet these requirements?
body:
  options:
    - { id: a, text: { en: "A programmatic evaluation job with the general text generation task type and the accuracy metric, which is computed as a real world knowledge score" } }
    - { id: b, text: { en: "A programmatic evaluation job with the question and answer task type and the accuracy metric, which is computed with NLP-F1" } }
    - { id: c, text: { en: "A programmatic evaluation job with the text summarization task type and the accuracy metric, which is computed with BERTScore" } }
    - { id: d, text: { en: "A programmatic evaluation job with the text summarization task type and the robustness metric, which is computed with deltaBERTScore" } }
answer: { optionId: c }
explanation:
  correct:
    en: "For the text summarization task type, Amazon Bedrock computes accuracy with BERTScore, which compares the meaning of the generated summary with the reference summary rather than its exact words. It is an algorithmic metric of a programmatic job, so no judge model is involved."
  options:
    a:
      en: "The real world knowledge score of general text generation measures whether the model encodes factual knowledge (TREX dataset); it does not compare summaries with references."
    b:
      en: "NLP-F1 is the accuracy measure of the question and answer task and is based on word overlap with the reference answer."
    d:
      en: "Robustness measures how much the summary changes when the input is perturbed; it does not measure closeness to the editors' summaries."
references:
  - title: "Model evaluation task types in Amazon Bedrock - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/model-evaluation-tasks.html
