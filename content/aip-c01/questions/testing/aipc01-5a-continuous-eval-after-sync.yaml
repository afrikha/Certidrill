id: aipc01-5a-continuous-eval-after-sync
objective: "5.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company syncs an Amazon Bedrock knowledge base every night after its documents are updated. After each sync finishes, a retrieve-and-generate RAG evaluation must run on the golden dataset, the faithfulness score must be stored as a CloudWatch metric, and an alarm must fire when the score falls below the baseline. Nobody must have to start the jobs.

    Which solution will meet these requirements?
body:
  options:
    - { id: a, text: { en: "Use Amazon EventBridge Scheduler to start a nightly AWS Step Functions workflow that runs the ingestion job, then the evaluation job, and publishes the score from S3 as a custom metric with an alarm." } }
    - { id: b, text: { en: "Create a CloudWatch Synthetics canary that asks one golden question through the assistant every five minutes, and alarm when the answer does not contain the expected text." } }
    - { id: c, text: { en: "Attach a guardrail with a contextual grounding check to the knowledge base queries, publish the number of blocked responses as a metric, and alarm when it rises." } }
    - { id: d, text: { en: "Have a developer start the RAG evaluation job from the console every morning after the sync, and publish the faithfulness score to CloudWatch with the AWS CLI." } }
answer: { optionId: a }
explanation:
  correct:
    en: "Step Functions orchestrates the sequence: start the ingestion job, wait until it completes, start the RAG evaluation job (CreateEvaluationJob with the RagEvaluation application type) and wait until it finishes, then read the faithfulness score from S3 and publish it as a custom metric. EventBridge Scheduler starts the workflow every night, and a CloudWatch alarm compares the metric with the baseline."
  options:
    b:
      en: "A single question checks that the flow works; it is not a RAG evaluation of the golden dataset and produces no faithfulness score."
    c:
      en: "A contextual grounding check blocks individual ungrounded responses at run time; it does not evaluate the golden dataset after each sync."
    d:
      en: "A manual start does not meet the requirement that nobody has to start the jobs."
references:
  - title: "Evaluate the performance of RAG sources using Amazon Bedrock evaluations - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/evaluation-kb.html
  - title: "CreateEvaluationJob - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/APIReference/API_CreateEvaluationJob.html
