id: aipc01-5b-prompt-stepwise-reasoning
objective: "5.2.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A logistics company uses an Amazon Nova model in Amazon Bedrock to compute delivery surcharges from a rate table that is included in the prompt. Questions that need several steps (weight tier, zone, then fuel adjustment) often get a wrong amount, and the team cannot tell at which step the model goes wrong. The downstream code needs only the final amount, and a moderate increase in latency is acceptable.

    Which changes should the team make? (Choose two.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Instruct the model to work through each step inside thinking tags before it gives the final amount inside output tags, and parse only the output tags.
    - id: b
      text:
        en: |-
          Reduce maxTokens to 50 so that the model returns only the final amount without any intermediate text.
    - id: c
      text:
        en: |-
          Add a few examples to the prompt that show a worked step-by-step calculation and the expected final amount.
    - id: d
      text:
        en: |-
          Raise the temperature so that the model explores different calculation paths before it settles on an amount.
    - id: e
      text:
        en: |-
          Remove the rate table from the prompt, and ask the model to use its general knowledge of carrier surcharges.
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |-
      Chain-of-thought prompting is recommended for multi-step analysis and math: letting the model reason before answering improves accuracy, and the reasoning trace shows where an error occurs, while output tags let the code extract only the amount. Few-shot examples with worked calculations calibrate the model to the expected steps and format. The cost is more output tokens and latency, which the team accepts.
  options:
    b:
      en: |-
        A small output budget removes room for reasoning and can cut off the answer, which makes multi-step errors more likely, not less.
    d:
      en: |-
        A higher temperature adds randomness to the calculation, which reduces accuracy and consistency.
    e:
      en: |-
        Without the rate table, the model has no source for the company's rates and will invent them.
references:
  - title: Give Amazon Nova time to think (chain-of-thought) - Amazon Nova
    url: https://docs.aws.amazon.com/nova/latest/userguide/prompting-chain-of-thought.html
  - title: Prompt engineering concepts - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/prompt-engineering-guidelines.html
