id: aipc01-5a-following-instructions-metric
objective: "5.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A government agency's assistant receives prompts that contain explicit directions, such as answering in Spanish, listing at most three steps, and naming the regulation article for each step. The quality team already tracks Builtin.Helpfulness. It now needs a separate score that shows how well each response respects the exact directions given in its prompt. The team uses an Amazon Bedrock evaluation job with a judge model.

    Which metric should the team add?
body:
  options:
    - { id: a, text: { en: "Builtin.Relevance" } }
    - { id: b, text: { en: "Builtin.FollowingInstructions" } }
    - { id: c, text: { en: "Builtin.ProfessionalStyleAndTone" } }
    - { id: d, text: { en: "Builtin.Completeness" } }
answer: { optionId: b }
explanation:
  correct:
    en: "Following instructions measures how well the response respects the exact directions in the prompt, such as the language, the number of items or the required citations. Helpfulness treats instruction-following as only one factor of a holistic score, so a dedicated metric is needed to track it separately."
  options:
    a:
      en: "Relevance measures how relevant the answer is to the prompt; a relevant answer can still be in the wrong language or list too many steps."
    c:
      en: "Professional style and tone checks whether style, formatting and tone suit a professional setting, not whether the specific directions were followed."
    d:
      en: "Completeness measures whether every question in the prompt is answered, not whether the response respects constraints such as language or length."
references:
  - title: "Use metrics to understand model performance - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/model-evaluation-metrics.html
