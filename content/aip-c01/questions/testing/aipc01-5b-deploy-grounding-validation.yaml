id: aipc01-5b-deploy-grounding-validation
objective: "5.1.9"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A legal-tech company is replacing the foundation model behind its RAG assistant, which answers multi-turn conversational questions about contract excerpts. Before production traffic is switched, the company runs 600 golden conversations through the new model. For each response, the validation must measure whether the response is supported by the retrieved excerpts and whether it answers the question, by using a managed scoring feature with configurable thresholds. Responses below the thresholds must count as hallucinations in the validation report. The company's Region supports cross-Region guardrail profiles.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Create a guardrail with content filters set to HIGH for every category, call ApplyGuardrail on each response, and count the blocked responses.
    - id: b
      text:
        en: |-
          Create a guardrail with a contextual grounding check in the Classic tier, call ApplyGuardrail with the excerpts and question as qualified content, and count the blocked responses.
    - id: c
      text:
        en: |-
          Run Amazon Comprehend DetectToxicContent on each response, and count the responses whose toxicity score is higher than a chosen threshold.
    - id: d
      text:
        en: |-
          Create a guardrail with a contextual grounding check in the Standard tier, call ApplyGuardrail with the excerpts and question as qualified content, and count the blocked responses.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      A contextual grounding check scores each response for grounding (supported by the reference source) and relevance (answers the query), with thresholds from 0 to 0.99, and blocks responses below them. ApplyGuardrail takes the excerpts as grounding_source and the question as query, so no model call is needed. The Standard tier supports conversational responses and requires a cross-Region guardrail profile, which the Region provides.
  options:
    a:
      en: |-
        Content filters detect harmful categories such as hate or violence; they do not measure whether a response is supported by the source.
    b:
      en: |-
        The Classic tier does not support conversational use cases, and conversational phrasing lowers its scores, so it would misreport hallucinations for this assistant.
    c:
      en: |-
        DetectToxicContent classifies toxicity; it has no notion of a reference source or of answering the question.
references:
  - title: Use contextual grounding check to filter hallucinations in responses - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/guardrails-contextual-grounding-check.html
