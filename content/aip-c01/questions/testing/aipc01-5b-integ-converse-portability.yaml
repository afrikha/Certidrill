id: aipc01-5b-integ-converse-portability
objective: "5.2.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company's Lambda function calls Amazon Bedrock with the InvokeModel API and a request body written for an Anthropic Claude model. When the team changed the model ID to a Meta Llama model to compare costs, every request failed with ValidationException. The team wants to switch between models by changing only a configuration value, and it must still be able to send model-specific parameters such as top_k to the models that support them.

    Which actions should the team take? (Choose two.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Rewrite the call to use the Converse API with the messages, system, and inferenceConfig fields.
    - id: b
      text:
        en: |-
          Keep InvokeModel, and add the anthropic_version field to the request body for every model.
    - id: c
      text:
        en: |-
          Pass model-specific parameters such as top_k in the additionalModelRequestFields field.
    - id: d
      text:
        en: |-
          Pass top_k in the inferenceConfig field together with temperature and maxTokens.
    - id: e
      text:
        en: |-
          Store the request in Prompt Management, and override its inferenceConfig in each Converse call.
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |-
      The Converse API provides one request format for all Amazon Bedrock models that support messages, so the same code works with Claude and Llama after a model ID change. Parameters that are not base inference parameters, such as top_k, go in additionalModelRequestFields.
  options:
    b:
      en: |-
        InvokeModel bodies are model-specific; an Anthropic field doesn't make the body valid for a Llama model.
    d:
      en: |-
        inferenceConfig holds only the base parameters (maxTokens, stopSequences, temperature, topP); top_k is not one of them.
    e:
      en: |-
        When the modelId is a Prompt Management prompt ARN, the Converse request can't include inferenceConfig, so the override fails.
references:
  - title: Inference using Converse API - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/conversation-inference.html
  - title: Converse - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/APIReference/API_runtime_Converse.html
