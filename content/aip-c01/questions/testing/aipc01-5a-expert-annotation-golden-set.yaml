id: aipc01-5a-expert-annotation-golden-set
objective: "5.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A bank's internal knowledge assistant on Amazon Bedrock stores thumbs-down ratings with the conversation ID. Subject-matter experts must review each negatively rated answer, write the correct answer, and have the reviewed question and answer added to the golden dataset that the release evaluation uses. The bank is building this workflow for a new application.

    Which solution will meet these requirements?
body:
  options:
    - { id: a, text: { en: "Create an Amazon SageMaker Ground Truth labeling job each week for the thumbs-down answers, and export the labels to the golden dataset." } }
    - { id: b, text: { en: "Send thumbs-down records to an Amazon SQS queue that an internal review application consumes, and append the experts' corrected answers as JSON Lines to a versioned golden dataset in Amazon S3." } }
    - { id: c, text: { en: "Create an Amazon Augmented AI human review workflow that starts a human loop for each thumbs-down answer and writes the results to Amazon S3." } }
    - { id: d, text: { en: "Run an evaluation job that uses a judge model on the thumbs-down answers, and append the judge's explanations to the golden dataset as reference responses." } }
answer: { optionId: b }
explanation:
  correct:
    en: "A queue decouples the capture of negative ratings from expert review, the review application records each expert's corrected answer, and appending the pair as a JSON Lines record (prompt and referenceResponse) to a versioned S3 dataset turns it into a test case for the next evaluation job. These components are available for a new design."
  options:
    a:
      en: "Amazon SageMaker Ground Truth is closed to new customers since July 30, 2026."
    c:
      en: "Amazon Augmented AI is closed to new customers since July 30, 2026."
    d:
      en: "A judge's explanation of a bad answer is not an expert-verified correct answer, so it cannot serve as a reference response."
references:
  - title: "Create a prompt dataset for a model evaluation job that uses a model as judge - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/model-evaluation-prompt-datasets-judge.html
