id: aipc01-5a-golden-dataset-from-incidents
objective: "5.1.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company runs regression tests on its assistant's outputs before each release by using a golden dataset of 300 prompts with reference answers. Several production incidents involved types of questions that the dataset does not contain. The company wants the regression tests to catch these failures in future releases.

    Which solution will meet these requirements?
body:
  options:
    - { id: a, text: { en: "Regenerate the golden dataset before each release by asking the current model to write new prompts and reference answers." } }
    - { id: b, text: { en: "Replace the golden dataset with the built-in datasets that Amazon Bedrock offers for programmatic evaluation jobs." } }
    - { id: c, text: { en: "Remove the prompts that have passed in every release so that the tests focus on new behavior." } }
    - { id: d, text: { en: "Add each incident's prompt with an expert-verified reference answer to a versioned golden dataset, and run every release against it." } }
answer: { optionId: d }
explanation:
  correct:
    en: "A golden dataset that grows with every production incident turns each past failure into a permanent regression test. Versioning the dataset keeps results comparable and shows which version each release was tested against."
  options:
    a:
      en: "Prompts and references generated by the model under test change with every release and can repeat its errors, so they are not a stable baseline."
    b:
      en: "Built-in datasets such as TriviaQA or BoolQ do not contain the company's question types or its incidents."
    c:
      en: "Removing passing prompts lets old failures come back unnoticed; regression tests exist to keep checking them."
references:
  - title: "Create a prompt dataset for a model evaluation job that uses a model as judge - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/model-evaluation-prompt-datasets-judge.html
  - title: "Model evaluation task types in Amazon Bedrock - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/model-evaluation-tasks.html
