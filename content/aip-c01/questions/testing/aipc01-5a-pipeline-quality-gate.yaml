id: aipc01-5a-pipeline-quality-gate
objective: "5.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company stores the prompt templates and inference parameters of its assistant in a Git repository, and AWS CodePipeline deploys every change. A change must never reach production if its judge correctness score on the golden dataset is below 0.85 or more than 2 points lower than the production configuration's score. The check must be automatic.

    Which solution will meet these requirements?
body:
  options:
    - { id: a, text: { en: "After the deployment stage, create a CloudWatch alarm on a sampled correctness metric that triggers a rollback of the prompt configuration." } }
    - { id: b, text: { en: "Add a manual approval action before the deployment stage, and have a reviewer compare the evaluation reports of the candidate and production configurations." } }
    - { id: c, text: { en: "Add an AWS CodeBuild stage before deployment that evaluates the candidate and production configurations, compares the scores with the thresholds, and fails the build when a threshold is missed." } }
    - { id: d, text: { en: "Schedule a weekly Amazon Bedrock evaluation job on the production configuration with Amazon EventBridge Scheduler, and notify the team when the score is below 0.85." } }
answer: { optionId: c }
explanation:
  correct:
    en: "A failed build action stops the pipeline, so a CodeBuild stage that evaluates the candidate (for example, by starting an Amazon Bedrock evaluation job with CreateEvaluationJob and reading the results from S3) and exits with an error when a threshold is missed acts as an automated quality gate before deployment. Scoring the production configuration on the same dataset makes the 2-point regression check possible."
  options:
    a:
      en: "An alarm after deployment acts once the change is already in production, which the requirement forbids."
    b:
      en: "A manual approval is not automatic and depends on a reviewer reading the reports correctly."
    d:
      en: "A weekly job on production finds problems after release and is not tied to each change."
references:
  - title: "CreateEvaluationJob - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/APIReference/API_CreateEvaluationJob.html
  - title: "Evaluate the performance of Amazon Bedrock resources - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/evaluation.html
