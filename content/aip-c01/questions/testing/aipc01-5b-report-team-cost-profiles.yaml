id: aipc01-5b-report-team-cost-profiles
objective: "5.1.8"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Three product teams in one AWS account call the same Anthropic Claude model in Amazon Bedrock through a US geographic cross-Region inference profile. Finance wants a monthly report in AWS Cost Explorer that shows the Amazon Bedrock inference cost of each team, so that it can charge the cost back. Requests must keep being routed across the Regions of the US profile.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Create an application inference profile for each team from the US inference profile, tag it with the team name, activate the tag as a cost allocation tag, and have each team invoke its own profile.
    - id: b
      text:
        en: |-
          Have each team add its team name to the requestMetadata field of every Converse request, and group the Cost Explorer report by that metadata key.
    - id: c
      text:
        en: |-
          Build a CloudWatch dashboard that sums the InputTokenCount and OutputTokenCount metrics by ModelId, and share the dashboard with the finance team.
    - id: d
      text:
        en: |-
          Create an AWS Cost Anomaly Detection monitor for Amazon Bedrock, and subscribe the finance team to the alerts of the monitor.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      An application inference profile created from a cross-Region (system-defined) inference profile routes requests to the same Regions and tracks the usage and cost of the requests made through it. Tags on each profile, activated as cost allocation tags, let Cost Explorer group the Bedrock cost by team.
  options:
    b:
      en: |-
        requestMetadata entries are written to model invocation logs to filter them; they are not billing data, so Cost Explorer cannot group costs by them.
    c:
      en: |-
        All teams use the same model, so ModelId does not separate them, and a CloudWatch dashboard of token counts is not a Cost Explorer cost report.
    d:
      en: |-
        Cost Anomaly Detection alerts on unusual spend; it does not attribute normal Bedrock cost to each team.
references:
  - title: Create an application inference profile - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/inference-profiles-create.html
  - title: Converse - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/APIReference/API_runtime_Converse.html
