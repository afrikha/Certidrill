id: aipc01-5b-integ-profile-iam-regions
objective: "5.2.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    An application in eu-west-1 now calls a model through the EU geographic cross-Region inference profile. The application's IAM role allows bedrock:InvokeModel on the ARN of the inference profile and on the ARN of the foundation model in eu-west-1 only. Since the change, some requests succeed and others fail with AccessDeniedException. The security team requires the role to stay limited to this model and this inference profile.

    Which solution will resolve the issue?
body:
  options:
    - id: a
      text:
        en: |-
          Replace the EU inference profile with the global cross-Region inference profile of the model, and keep the current IAM policy.
    - id: b
      text:
        en: |-
          Add the bedrock:CreateInferenceProfile action to the role so that the application can manage the inference profile that it uses.
    - id: c
      text:
        en: |-
          Allow the foundation model ARNs in every destination Region of the EU profile, with a condition on the ARN of the inference profile.
    - id: d
      text:
        en: |-
          Create an interface VPC endpoint for the Amazon Bedrock Runtime service in each destination Region of the EU profile.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      When a policy names an inference profile as a resource, it must also allow the foundation model in each Region associated with the profile. Requests routed to eu-west-1 succeed and those routed to other EU Regions are denied; adding those foundation model ARNs, conditioned on the inference profile ARN, fixes the failures while keeping the role scoped.
  options:
    a:
      en: |-
        A global profile routes to even more Regions whose foundation model ARNs the policy doesn't allow, so the denials would continue.
    b:
      en: |-
        Creating inference profiles is unrelated to invoking a system-defined profile, and it broadens the role without fixing the missing model permissions.
    d:
      en: |-
        Endpoints affect network paths, not IAM authorization; Bedrock routes the request to the other Regions itself, so AccessDeniedException remains.
references:
  - title: Prerequisites for inference profiles - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/inference-profiles-prereq.html
