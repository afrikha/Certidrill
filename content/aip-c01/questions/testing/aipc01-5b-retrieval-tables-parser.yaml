id: aipc01-5b-retrieval-tables-parser
objective: "5.2.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A manufacturer's Amazon Bedrock knowledge base ingests PDF maintenance manuals with the default parser. Questions about torque values, which appear only in tables and annotated diagrams, return irrelevant passages or no answer. The company wants table and diagram content to be extracted during ingestion by a fully managed feature, without writing or maintaining extraction prompts or code.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Increase the fixed-size chunk length so that each table is kept in a single chunk when the default parser processes it.
    - id: b
      text:
        en: |-
          Ingest the manuals again through a data source that is configured with the Amazon Bedrock Data Automation parser.
    - id: c
      text:
        en: |-
          Set the search type of the retrieval requests to HYBRID so that the numeric torque values are matched as text.
    - id: d
      text:
        en: |-
          Add a reranker model to the retrieval requests so that passages from tables are ranked higher in the results.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      The default parser extracts only text and doesn't extract figures, charts or tables. Bedrock Data Automation is a fully managed multimodal parser that extracts them with no prompting; it then processes every PDF of the data source and is charged per page.
  options:
    a:
      en: |-
        The default parser never extracts the table and diagram content, so larger chunks still don't contain it.
    c:
      en: |-
        Hybrid search can only match text that was indexed; the torque values were never extracted from the tables.
    d:
      en: |-
        Reranking reorders passages that exist in the index; it can't surface content that the parser didn't extract.
references:
  - title: Parsing options for your data source - Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/kb-advanced-parsing.html
