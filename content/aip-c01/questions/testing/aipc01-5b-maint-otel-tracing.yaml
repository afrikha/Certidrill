id: aipc01-5b-maint-otel-tracing
objective: "5.2.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company is building a new prompt observability pipeline for a generative AI application that runs on Amazon API Gateway, AWS Lambda, and Amazon Bedrock. Each request must be traced across all stages, with the prompt version and token counts recorded as span attributes, and the traces must be viewable in AWS X-Ray. The company wants the instrumentation that AWS recommends for new work.

    Which solution will meet these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          Instrument the functions with the AWS X-Ray SDK, and run the X-Ray daemon to send the trace segments.
    - id: b
      text:
        en: |-
          Enable AWS CloudTrail data events for Lambda and Amazon Bedrock, and correlate the events by request ID.
    - id: c
      text:
        en: |-
          Enable VPC Flow Logs on the subnets of the functions, and correlate the flow records by timestamp.
    - id: d
      text:
        en: |-
          Instrument the functions with OpenTelemetry through AWS Distro for OpenTelemetry, and export the traces to X-Ray.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      The X-Ray SDKs and daemon entered maintenance mode on February 25, 2026, with releases limited to security fixes, and AWS recommends migrating to OpenTelemetry. ADOT instruments the functions, records custom span attributes such as the prompt version, and exports traces that X-Ray displays.
  options:
    a:
      en: |-
        The X-Ray SDK and daemon are in maintenance mode, so they are not the recommended choice for new instrumentation.
    b:
      en: |-
        CloudTrail records API activity, not spans with timing and custom attributes across the request path.
    c:
      en: |-
        Flow logs record network traffic metadata, not application traces or prompt versions.
references:
  - title: Instrumenting your application for AWS X-Ray - AWS X-Ray
    url: https://docs.aws.amazon.com/xray/latest/devguide/xray-instrumenting-your-app.html
