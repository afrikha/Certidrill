id: aipc01-5a-appconfig-bake-time-rollback
objective: "5.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company's assistant runs on AWS Lambda and reads the Amazon Bedrock model ID and inference parameters from an AWS AppConfig configuration profile. The team is switching to a new model. The change must reach callers gradually over 30 minutes, be watched for 20 more minutes after it reaches all callers, and be reverted automatically if a CloudWatch alarm on the thumbs-down rate fires. No new Lambda function version may be deployed.

    Which solution will meet these requirements?
body:
  options:
    - { id: a, text: { en: "Deploy the configuration change with an AppConfig deployment strategy that deploys to all callers at once with no bake time, and watch the CloudWatch alarm manually for 20 minutes." } }
    - { id: b, text: { en: "Publish a new Lambda function version that calls the new model, and shift traffic to it gradually through an alias with AWS CodeDeploy and the alarm configured for rollback." } }
    - { id: c, text: { en: "Switch the model with Amazon SageMaker AI deployment guardrails that use canary traffic shifting, a 20-minute baking period and the alarm configured for automatic rollback." } }
    - { id: d, text: { en: "Deploy the configuration change with an AppConfig deployment strategy that uses linear growth over 30 minutes and a 20-minute bake time, in an environment that monitors the CloudWatch alarm." } }
answer: { optionId: d }
explanation:
  correct:
    en: "An AppConfig deployment strategy controls how fast a configuration change reaches callers: linear growth spreads the rollout evenly over the deployment time, and the bake time keeps the CloudWatch alarms monitored after the change reaches 100 percent of the targets. If an alarm fires, AppConfig rolls the deployment back (it needs permission to do so), and no code is deployed."
  options:
    a:
      en: "Deploying to all callers at once skips the gradual rollout, and watching the alarm manually does not revert the change automatically."
    b:
      en: "A new function version is a code deployment, which the requirement forbids; the model ID already lives in AppConfig."
    c:
      en: "Deployment guardrails apply to SageMaker AI endpoints; the assistant calls a Bedrock model, which is not hosted on a SageMaker AI endpoint."
references:
  - title: "Working with deployment strategies - AWS AppConfig"
    url: https://docs.aws.amazon.com/appconfig/latest/userguide/appconfig-creating-deployment-strategy.html
