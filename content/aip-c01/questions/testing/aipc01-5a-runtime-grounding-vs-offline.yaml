id: aipc01-5a-runtime-grounding-vs-offline
objective: "5.1.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company runs a nightly retrieve-and-generate RAG evaluation that reports the faithfulness of its assistant's answers. A new compliance rule states that an answer that is not grounded in the retrieved passages must never be shown to a user. The assistant calls the RetrieveAndGenerate API of an Amazon Bedrock knowledge base.

    Which solution will meet these requirements?
body:
  options:
    - { id: a, text: { en: "Run the RAG evaluation job every hour instead of every night, and disable the assistant when the faithfulness score drops below a threshold." } }
    - { id: b, text: { en: "Configure a guardrail with a contextual grounding check and a grounding threshold, and apply it in the generation configuration of the RetrieveAndGenerate calls." } }
    - { id: c, text: { en: "Add a custom faithfulness metric with a stricter rating scale to the nightly RAG evaluation job, and alert the team on low scores." } }
    - { id: d, text: { en: "Create an AgentCore online evaluation configuration that samples 100 percent of the sessions with the faithfulness evaluator." } }
answer: { optionId: b }
explanation:
  correct:
    en: "Evaluation jobs measure quality after the fact on a dataset; they cannot stop an individual answer. A contextual grounding check scores each response against the grounding source at run time and blocks it when the grounding score is below the configured threshold (between 0 and 0.99), so ungrounded answers do not reach users."
  options:
    a:
      en: "Hourly offline evaluation still lets ungrounded answers reach users between runs; it measures a dataset, not each live answer."
    c:
      en: "A stricter metric changes the report, not what users see."
    d:
      en: "Online evaluation scores agent traces after the responses were returned, so it cannot stop an answer from reaching the user."
references:
  - title: "Use contextual grounding check to filter hallucinations in responses - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/guardrails-contextual-grounding-check.html
  - title: "Configure and customize queries and response generation - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/kb-test-config.html
