id: aipc01-5a-agent-ground-truth-evaluators
objective: "5.1.7"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A travel company tests its booking agent in a pipeline with 120 scripted scenarios. For each scenario, the team knows what must happen, for example "the flight is booked in economy class and a confirmation is sent", and it knows the expected final reply. The team wants Amazon Bedrock AgentCore Evaluations to judge each scenario against these expectations instead of inferring the user's goals.

    Which evaluators should the team use?
body:
  options:
    - { id: a, text: { en: "Goal success rate and correctness" } }
    - { id: b, text: { en: "Goal success rate with ground truth, with the scenario assertions, and correctness with ground truth, with the expected replies" } }
    - { id: c, text: { en: "Tool selection accuracy and tool parameter accuracy" } }
    - { id: d, text: { en: "Helpfulness and instruction following" } }
answer: { optionId: b }
explanation:
  correct:
    en: "Goal success rate with ground truth judges success by whether the agent's behavior satisfies each assertion, rather than inferring the user's goals from the conversation. Correctness with ground truth checks that the response conveys the same core facts as the expected response, regardless of wording."
  options:
    a:
      en: "These evaluators infer the goals from the conversation and judge factual accuracy without an expected response, so they ignore the scenario's known expectations."
    c:
      en: "Tool-level evaluators check individual calls, not whether the scenario's required outcomes were reached."
    d:
      en: "Helpfulness and instruction following judge response quality without reference to the scenario's expected outcomes."
references:
  - title: "Prompt templates - Amazon Bedrock AgentCore"
    url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/prompt-templates-builtin.html
