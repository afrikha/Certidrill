id: aipc01-5a-appconfig-sticky-ab-split
objective: "5.1.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company's assistant runs on AWS Lambda and calls the Amazon Bedrock Converse API. The team wants to compare a new prompt version with the current one on live traffic. Each user must see the same variant in every session, 20 percent of users must get the new variant, and the percentage must be adjustable without deploying code. The test must measure the effect on ticket deflection.

    Which solution will meet these requirements?
body:
  options:
    - { id: a, text: { en: "Publish two Lambda function versions, one for each prompt version, and route 20 percent of the invocations to the new version with a weighted alias." } }
    - { id: b, text: { en: "Create an AWS AppConfig multi-variant feature flag with a split rule on the user ID set to 20 percent, read the variant in the function, and record it with each conversation's outcome." } }
    - { id: c, text: { en: "Create an Amazon CloudWatch Evidently experiment with two variations, assign 20 percent of users to the new prompt, and track deflection as an experiment metric." } }
    - { id: d, text: { en: "Configure an Amazon Bedrock intelligent prompt router with both prompt versions, and compare deflection for the requests that are routed to each version." } }
answer: { optionId: b }
explanation:
  correct:
    en: "The split operator selects a percentage of traffic from a consistent hash of the context value, so a given user ID always receives the same variant. The percentage lives in the flag configuration, which can be changed and deployed without code changes. Recording the variant with each conversation lets the team compare deflection between the two groups."
  options:
    a:
      en: "A weighted alias routes each invocation independently, so the same user would switch between prompt versions from one request to the next."
    c:
      en: "CloudWatch Evidently was discontinued on October 17, 2025, so it cannot be used for a new experiment; AWS points to AppConfig instead."
    d:
      en: "Intelligent prompt routing chooses between models of the same family based on predicted response quality; it does not run a controlled experiment between prompt versions with a fixed user share."
references:
  - title: "Understanding multi-variant feature flag rules - AWS AppConfig"
    url: https://docs.aws.amazon.com/appconfig/latest/userguide/appconfig-creating-multi-variant-feature-flags-rules.html
