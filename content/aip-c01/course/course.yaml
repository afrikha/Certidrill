# Course manifest: modules, chapter order (the order of this list), titles, reading time
# and AWS documentation references. Sections, their titles and their objectives are read from
# chapters/<id>.en.md (the section markers), never duplicated here. English only (no .fr.md files).
# One chapter per task statement of the AIP-C01 exam guide (20 task statements, 98 objectives).
# Split (more than 8 objectives, professional level): task 5.1 (9) → 51-evaluation-quality-gates
# (5.1.1, 5.1.2, 5.1.4, 5.1.8, 5.1.9: quality metrics, model evaluations, A/B and canary,
# regression and quality gates, reporting, deployment validation) and 52-rag-agent-evaluation
# (5.1.3, 5.1.5–5.1.7: user feedback, RAG and LLM-as-a-judge, retrieval quality, agents).
# Task 5.2 keeps the next number (53-troubleshooting). Objective assignment: factory/plans/aip-c01.json.
# Course code fences: bash, json, yaml, text only — Python / JavaScript samples go in `text` fences.
