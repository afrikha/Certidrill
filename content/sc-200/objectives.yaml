# SC-200 objectives — official study guide, skills measured as of 2026-10-21 (en-us and fr-fr pages, checked on 2026-11-16).
# `code` is the stable key referenced by question files and course sections.
# English verbatim. French from the fr-fr page (straight apostrophes); only casing slips and imperative
# forms of the machine translation were normalized (Sélectionnez -> Sélectionner, MICROSOFT -> Microsoft...).
environment:
- group:
    en: Configure automation for Microsoft Defender XDR and Microsoft Sentinel
    fr: Configurer l'automatisation pour Microsoft Defender XDR et Microsoft Sentinel
  objectives:
  - code: 1.1.1
    en: Configure email notifications in Microsoft Defender XDR, including incidents, actions, and threat analytics
    fr: Configurer des notifications par e-mail dans Microsoft Defender XDR, notamment les incidents, les actions et l'analytique des menaces
  - code: 1.1.2
    en: Configure alert notifications in Microsoft Defender XDR, including tuning, suppression, and correlation
    fr: Configurer des notifications d'alerte dans Microsoft Defender XDR, notamment le réglage, la suppression et la corrélation
  - code: 1.1.3
    en: Configure Microsoft Defender for Endpoint advanced features
    fr: Configurer des fonctionnalités avancées de Microsoft Defender for Endpoint
  - code: 1.1.4
    en: Configure rules settings in Microsoft Defender for Endpoint
    fr: Configurer les paramètres des règles dans Microsoft Defender pour point de terminaison
  - code: 1.1.5
    en: Configure custom data collection in Microsoft Defender for Endpoint
    fr: Configurer la collecte de données personnalisée dans Microsoft Defender pour point de terminaison
  - code: 1.1.6
    en: Configure security policies for Microsoft Defender for Endpoint, including attack surface reduction (ASR) rules
    fr: Configurer des stratégies de sécurité pour Microsoft Defender pour point de terminaison, y compris les règles de réduction de la surface d'attaque (ASR)
  - code: 1.1.7
    en: Manage automated investigation and response capabilities in Microsoft Defender XDR
    fr: Gérer les fonctionnalités d'enquête et de réponse automatisées dans Microsoft Defender XDR
  - code: 1.1.8
    en: Configure automatic attack disruption in Microsoft Defender XDR
    fr: Configurer l'interruption automatique des attaques dans Microsoft Defender XDR
  - code: 1.1.9
    en: Configure and manage device groups, permissions, and automation levels in Microsoft Defender for Endpoint
    fr: Configurer et gérer des groupes d'appareils, des autorisations et des niveaux d'automatisation dans Microsoft Defender for Endpoint
  - code: 1.1.10
    en: Create and configure automation rules in Microsoft Sentinel
    fr: Créer et configurer des règles d'automatisation dans Microsoft Sentinel
  - code: 1.1.11
    en: Create and configure Microsoft Sentinel playbooks
    fr: Créer et configurer des playbooks Microsoft Sentinel
- group:
    en: Configure the Microsoft Sentinel SIEM and platform
    fr: Configurer le SIEM et la plateforme Microsoft Sentinel
  objectives:
  - code: 1.2.1
    en: Specify Microsoft Sentinel roles
    fr: Spécifier des rôles Microsoft Sentinel
  - code: 1.2.2
    en: Manage data retention for XDR and Microsoft Sentinel tables, including Analytics, Data lake, and XDR tiers
    fr: Gérer la rétention des données pour les tables XDR et Microsoft Sentinel, notamment les niveaux Analytics, Data Lake et XDR
  - code: 1.2.3
    en: Create and configure Microsoft Sentinel workbooks
    fr: Créer et configurer des classeurs Microsoft Sentinel
  - code: 1.2.4
    en: Optimize the Microsoft Sentinel platform, including SOC optimization recommendations
    fr: Optimiser la plateforme Microsoft Sentinel, y compris les recommandations d'optimisation SOC
- group:
    en: Ingest data into the Microsoft Sentinel SIEM and platform
    fr: Ingérer des données dans Microsoft Sentinel SIEM et la plateforme
  objectives:
  - code: 1.3.1
    en: Select data connectors based on data source requirements, including Windows logs and security events
    fr: Sélectionner les connecteurs de données en fonction des exigences de la source de données, y compris les journaux Windows et les événements de sécurité
  - code: 1.3.2
    en: Configure collection of Windows Security events by using Windows Security Events via AMA, including data collection rules
    fr: Configurer la collecte d'événements de sécurité Windows à l'aide d'événements de sécurité Windows via AMA, y compris les règles de collecte de données
  - code: 1.3.3
    en: Plan and configure collection of Windows Security events by using Windows Event Forwarding (WEF)
    fr: Planifier et configurer la collecte des événements de sécurité Windows à l'aide du transfert d'événements Windows (WEF)
  - code: 1.3.4
    en: Plan and configure Syslog via AMA and Common Event Format (CEF) via AMA connectors
    fr: Planifier et configurer Syslog via AMA et Common Event Format (CEF) via des connecteurs AMA
  - code: 1.3.5
    en: Configure collection of Azure activity logs by using Azure Policy and resource diagnostic settings
    fr: Configurer la collecte des journaux d'activité Azure à l'aide des paramètres de diagnostic des ressources et des Azure Policy
  - code: 1.3.6
    en: Ingest threat indicators into Microsoft Sentinel
    fr: Ingérer des indicateurs de menace dans Microsoft Sentinel
  - code: 1.3.7
    en: Create custom log tables in the workspace to store ingested data
    fr: Créer des tables de journaux personnalisées dans l'espace de travail pour stocker les données ingérées
- group:
    en: Configure detections
    fr: Configurer les détections
  objectives:
  - code: 1.4.1
    en: Create custom detection rules by using Advanced Hunting in Microsoft Defender XDR
    fr: Créer des règles de détection personnalisées à l'aide d'Advanced Hunting dans Microsoft Defender XDR
  - code: 1.4.2
    en: Manage custom detection rules in Microsoft Defender XDR
    fr: Gérer les règles de détection personnalisées dans Microsoft Defender XDR
  - code: 1.4.3
    en: Configure and manage analytics rules in Microsoft Sentinel SIEM, including scheduled, near-real time (NRT), threat intelligence, and machine learning
    fr: Configurer et gérer des règles d'analytique dans Microsoft Sentinel SIEM, notamment planifiées, quasi-en temps réel (NRT), informations sur les menaces et Machine Learning
  - code: 1.4.4
    en: Analyze attack vector coverage by using the MITRE ATT&CK matrix
    fr: Analyser la couverture de vecteurs d'attaque en utilisant la matrice MITRE ATT&CK
  - code: 1.4.5
    en: Configure anomalies in Microsoft Sentinel
    fr: Configurer des anomalies dans Microsoft Sentinel
incidents:
- group:
    en: Respond to alerts and incidents in Microsoft Defender XDR
    fr: Répondre aux alertes et aux incidents dans Microsoft Defender XDR
  objectives:
  - code: 2.1.1
    en: Investigate and remediate threats by using Microsoft Defender for Office 365, including automatic attack disruption
    fr: Examiner et corriger les menaces à l'aide de Microsoft Defender pour Office 365, y compris l'interruption automatique des attaques
  - code: 2.1.2
    en: Investigate and remediate threats or compromised entities identified by Microsoft Purview
    fr: Examiner et corriger les menaces ou les entités compromises identifiées par Microsoft Purview
  - code: 2.1.3
    en: Investigate and remediate alerts and incidents identified by Microsoft Defender for Cloud workload protections
    fr: Enquêter et corriger des alertes et des incidents identifiés par les protections de charge de travail Microsoft Defender pour le cloud
  - code: 2.1.4
    en: Investigate and remediate security risks identified by Microsoft Defender for Cloud Apps
    fr: Enquêter et corriger des risques de sécurité identifiés par Microsoft Defender pour les applications cloud
  - code: 2.1.5
    en: Investigate and remediate compromised identities that are identified by Microsoft Entra ID
    fr: Enquêter sur les identités compromises identifiées par Microsoft Entra ID et y remédier
  - code: 2.1.6
    en: Investigate and remediate security alerts from Microsoft Defender for Identity
    fr: Enquêter et corriger des alertes de sécurité de Microsoft Defender pour Identity
  - code: 2.1.7
    en: Investigate and remediate alerts and incidents identified by Microsoft Sentinel
    fr: Examiner et corriger les alertes et les incidents identifiés par Microsoft Sentinel
  - code: 2.1.8
    en: Investigate incidents by using agentic AI, including embedded Microsoft Security Copilot
    fr: Examiner les incidents à l'aide d'une IA agentique, y compris avec Microsoft Security Copilot intégré
  - code: 2.1.9
    en: Investigate complex attacks, such as multi-stage, multi-domain, and lateral movement
    fr: Enquêter sur les attaques complexes, telles que les mouvements multi-étapes, multi-domaines et latéraux
  - code: 2.1.10
    en: Manage security incidents by using case management
    fr: Gérer les incidents de sécurité à l'aide de la gestion des cas
- group:
    en: Respond to alerts and incidents in Microsoft Defender for Endpoint
    fr: Répondre aux alertes et aux incidents dans Microsoft Defender pour point de terminaison
  objectives:
  - code: 2.2.1
    en: Investigate device timelines
    fr: Analyser les historiques des appareils
  - code: 2.2.2
    en: Perform actions on the device, including live response and collecting investigation packages
    fr: Effectuer des actions sur l'appareil, y compris la réponse dynamique et la collecte de packages d'investigation
  - code: 2.2.3
    en: Perform evidence and entity investigation
    fr: Effectuer des enquêtes d'entités et de preuves
  - code: 2.2.4
    en: Investigate and remediate incidents identified by automatic attack disruption
    fr: Examiner et corriger les incidents identifiés par une interruption automatique d'attaque
- group:
    en: Investigate Microsoft 365 activities to identify threats
    fr: Examiner les activités de Microsoft 365 pour identifier les menaces
  objectives:
  - code: 2.3.1
    en: Investigate threats by using Microsoft Purview Audit
    fr: Examiner les menaces à l'aide de Microsoft Purview Audit
  - code: 2.3.2
    en: Investigate threats by using Content search in Microsoft Purview eDiscovery
    fr: Examiner les menaces à l'aide de la recherche de contenu dans Microsoft Purview eDiscovery
  - code: 2.3.3
    en: Investigate threats by using Microsoft Graph activity logs
    fr: Enquêter sur les menaces en utilisant les journaux d'activité de Microsoft Graph
hunting:
- group:
    en: Detect threats by using Microsoft Defender XDR
    fr: Détecter les menaces à l'aide de Microsoft Defender XDR
  objectives:
  - code: 3.1.1
    en: Identify the appropriate table to use in a KQL query
    fr: Identifier la table appropriée à utiliser dans une requête KQL
  - code: 3.1.2
    en: Identify threats by using Kusto Query Language (KQL)
    fr: Identifier les menaces à l'aide de Langage de requête Kusto (KQL)
  - code: 3.1.3
    en: Create Advanced Hunting queries
    fr: Créer des requêtes de repérage avancées
  - code: 3.1.4
    en: Interpret threat analytics in Microsoft Defender XDR
    fr: Interpréter l'analytique des menaces dans Microsoft Defender XDR
  - code: 3.1.5
    en: Create hunting graphs, including blast radius
    fr: Créer des graphes de chasse, y compris le rayon d'impact
  - code: 3.1.6
    en: Analyze relationships between entities by using Sentinel Graph
    fr: Analyser les relations entre les entités à l'aide de Sentinel Graph
- group:
    en: Detect threats by using the Microsoft Sentinel platform
    fr: Détecter les menaces à l'aide de la plateforme Microsoft Sentinel
  objectives:
  - code: 3.2.1
    en: Create and monitor hunting queries
    fr: Créer et surveiller des requêtes de chasse
  - code: 3.2.2
    en: Create and manage KQL jobs in Data lake
    fr: Créer et gérer des tâches KQL dans Data Lake
  - code: 3.2.3
    en: Create and manage Summary rule tables for querying
    fr: Créer et gérer des tables de règles de synthèse pour l'interrogation
  - code: 3.2.4
    en: Hunt for threats by using Notebooks, including connection to the Sentinel MCP Server
    fr: Chasser les menaces en utilisant des Notebooks, y compris la connexion au serveur Sentinel MCP
