id: sc200-1d-an-status-behavior
objective: "1.4.5"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Proseware has a Microsoft Sentinel workspace. You plan to tune the built-in anomaly rule **Anomalous code execution** by duplicating it.

    How should you complete the following sentences? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware dispose d'un espace de travail Microsoft Sentinel. Vous prévoyez de régler la règle d'anomalie intégrée **Anomalous code execution** en la dupliquant.

    Comment devez-vous compléter les phrases suivantes ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Immediately after you duplicate the rule, the copy is [[copy]].

      When you later switch the copy to Production, the original rule [[orig]].
    fr: |
      Juste après la duplication de la règle, la copie est [[copy]].

      Quand vous faites ensuite passer la copie en Production, la règle d'origine [[orig]].
  slots:
    - id: copy
      options:
        - { id: disflight, text: { en: "disabled, in Flighting mode", fr: "désactivée, en mode Flighting" } }
        - { id: enprod, text: { en: "enabled, in Production mode", fr: "activée, en mode Production" } }
        - { id: enflight, text: { en: "enabled, in Flighting mode", fr: "activée, en mode Flighting" } }
    - id: orig
      options:
        - { id: toflight, text: { en: "switches to Flighting mode automatically", fr: "passe automatiquement en mode Flighting" } }
        - { id: staysprod, text: { en: "keeps running in Production mode", fr: "continue à s'exécuter en mode Production" } }
        - { id: deleted, text: { en: "is deleted automatically", fr: "est supprimée automatiquement" } }
answer:
  values: { copy: disflight, orig: toflight }
explanation:
  correct:
    en: The copy is created with " - Customized" appended to its name, in the Disabled state, with the FLGT badge of Flighting mode; you enable it to generate results. Two versions of the same rule cannot both run in Production, so promoting the copy switches the original to Flighting automatically.
    fr: |
      La copie est créée avec « - Customized » ajouté à son nom, à l'état Disabled, avec le badge FLGT du mode Flighting ; vous l'activez pour qu'elle génère des résultats. Deux versions d'une même règle ne peuvent pas s'exécuter toutes deux en Production : promouvoir la copie fait donc passer automatiquement l'original en Flighting.
  options:
    enprod: { en: "A new copy starts disabled and in Flighting mode, not in Production.", fr: "Une nouvelle copie démarre désactivée et en mode Flighting, pas en Production." }
    enflight: { en: "The copy is in Flighting mode but disabled until you enable it.", fr: "La copie est en mode Flighting mais désactivée tant que vous ne l'activez pas." }
    staysprod: { en: "Only one version of a rule can run in Production at a time.", fr: "Une seule version d'une règle peut s'exécuter en Production à la fois." }
    deleted: { en: "Built-in anomaly rules cannot be deleted; the original moves to Flighting.", fr: "Les règles d'anomalie intégrées ne peuvent pas être supprimées ; l'original passe en Flighting." }
references:
  - title: Work with anomaly detection analytics rules in Microsoft Sentinel
    url: https://learn.microsoft.com/en-us/azure/sentinel/work-with-anomaly-rules
