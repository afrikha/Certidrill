id: sc200-1b-pb-managed-identity-auth
objective: "1.1.11"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso, Ltd. uses Microsoft Sentinel. You are creating a Consumption playbook named **pb-Enrich** that reads incidents and adds comments to them by using the Microsoft Sentinel connector.

    The security team doesn't want to store, rotate or monitor any secret or password for the connection.

    Which authentication method should you use for the Microsoft Sentinel connection?
  fr: |
    Contoso, Ltd. utilise Microsoft Sentinel. Vous créez un playbook Consumption nommé **pb-Enrich** qui lit des incidents et leur ajoute des commentaires avec le connecteur Microsoft Sentinel.

    L'équipe de sécurité ne veut stocker, renouveler ni surveiller aucun secret ni mot de passe pour la connexion.

    Quelle méthode d'authentification devez-vous utiliser pour la connexion Microsoft Sentinel ?
body:
  options:
    - { id: a, text: { en: "A service principal with a client secret", fr: "Un principal de service avec une clé secrète client" } }
    - { id: b, text: { en: "A Microsoft Entra user account that signs in with OAuth", fr: "Un compte d'utilisateur Microsoft Entra qui se connecte avec OAuth" } }
    - { id: c, text: { en: "The system-assigned managed identity of the logic app", fr: "L'identité managée affectée par le système de l'application logique" } }
    - { id: d, text: { en: "The primary key of the Log Analytics workspace", fr: "La clé primaire de l'espace de travail Log Analytics" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      With a managed identity, the playbook authenticates with its own Microsoft Entra identity and there are no credentials to manage; Microsoft recommends it for Sentinel connections. You then grant the identity a Microsoft Sentinel role on the workspace (Responder, because pb-Enrich adds comments).
    fr: |
      Avec une identité managée, le playbook s'authentifie avec sa propre identité Microsoft Entra et il n'y a aucune information d'identification à gérer ; Microsoft la recommande pour les connexions Sentinel. Vous accordez ensuite à l'identité un rôle Microsoft Sentinel sur l'espace de travail (Responder, puisque pb-Enrich ajoute des commentaires).
  options:
    a: { en: "A service principal needs a client secret that must be stored and rotated.", fr: "Un principal de service exige une clé secrète client à stocker et à renouveler." }
    b: { en: "A user connection depends on a person's credentials and sessions.", fr: "Une connexion utilisateur dépend des informations d'identification et des sessions d'une personne." }
    d: { en: "The Microsoft Sentinel connector doesn't authenticate with workspace keys, and a key is a secret to protect.", fr: "Le connecteur Microsoft Sentinel ne s'authentifie pas avec les clés de l'espace de travail, et une clé est un secret à protéger." }
references:
  - title: Authenticate playbooks to Microsoft Sentinel
    url: https://learn.microsoft.com/en-us/azure/sentinel/automation/authenticate-playbooks-to-sentinel
  - title: Create and manage Microsoft Sentinel playbooks
    url: https://learn.microsoft.com/en-us/azure/sentinel/automation/create-playbooks
