id: sc200-1d-cd-lookback
objective: "1.4.1"
type: dropdown
difficulty: 1
status: draft
shuffle: false
stem:
  en: |
    Adatum uses Microsoft Defender XDR. You create two custom detection rules from advanced hunting queries on the **DeviceNetworkEvents** table. Rule1 uses the **Every 3 hours** frequency, and Rule2 uses the **Every 24 hours** frequency.

    Which period of data does each rule check at each run? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum utilise Microsoft Defender XDR. Vous créez deux règles de détection personnalisées à partir de requêtes de repérage avancé sur la table **DeviceNetworkEvents**. Rule1 utilise la fréquence **Every 3 hours** et Rule2 la fréquence **Every 24 hours**.

    Quelle période de données chaque règle vérifie-t-elle à chaque exécution ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Rule1 checks the data of the last [[r1]].

      Rule2 checks the data of the last [[r2]].
    fr: |
      Période vérifiée par Rule1 : les [[r1]] qui précèdent l'exécution.

      Période vérifiée par Rule2 : les [[r2]] qui précèdent l'exécution.
  slots:
    - id: r1
      options:
        - { id: h4, text: { en: "4 hours", fr: "4 heures" } }
        - { id: h12, text: { en: "12 hours", fr: "12 heures" } }
        - { id: h48, text: { en: "48 hours", fr: "48 heures" } }
        - { id: d30, text: { en: "30 days", fr: "30 jours" } }
    - id: r2
      options:
        - { id: h4, text: { en: "4 hours", fr: "4 heures" } }
        - { id: h12, text: { en: "12 hours", fr: "12 heures" } }
        - { id: h48, text: { en: "48 hours", fr: "48 heures" } }
        - { id: d30, text: { en: "30 days", fr: "30 jours" } }
answer:
  values: { r1: h12, r2: d30 }
explanation:
  correct:
    en: For Defender XDR data, the lookback is fixed by the frequency. A rule that runs every 3 hours checks the past 12 hours, and a rule that runs every 24 hours checks the past 30 days. The other pairs are every hour (4 hours) and every 12 hours (48 hours).
    fr: Pour les données Defender XDR, la période de recherche est fixée par la fréquence. Une règle qui s'exécute toutes les 3 heures vérifie les 12 dernières heures, et une règle qui s'exécute toutes les 24 heures vérifie les 30 derniers jours. Les autres couples sont toutes les heures (4 heures) et toutes les 12 heures (48 heures).
references:
  - title: Create custom detection rules in Microsoft Defender XDR
    url: https://learn.microsoft.com/en-us/defender-xdr/custom-detection-rules
