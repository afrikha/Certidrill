id: sc200-1d-mi-threat-scenario
objective: "1.4.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Litware has onboarded a Microsoft Sentinel workspace to the Microsoft Defender portal. The SOC is preparing a review of its defenses against one specific threat scenario.

    You need the MITRE ATT&CK matrix to show only the tactics and techniques of that scenario.

    What should you do on the MITRE ATT&CK page?
  fr: |
    Litware a intégré un espace de travail Microsoft Sentinel au portail Microsoft Defender. Le SOC prépare une revue de ses défenses contre un scénario de menace précis.

    La matrice MITRE ATT&CK doit afficher uniquement les tactiques et techniques de ce scénario.

    Que devez-vous faire sur la page MITRE ATT&CK ?
body:
  options:
    - { id: a, text: { en: "Select Simulated rules, and then select the rules of the scenario.", fr: "Sélectionner Simulated rules, puis sélectionner les règles du scénario." } }
    - { id: b, text: { en: "Open each technique of the scenario, and then pin its details pane.", fr: "Ouvrir chaque technique du scénario, puis épingler son volet de détails." } }
    - { id: c, text: { en: "Search for the name of the scenario in the search bar of the matrix.", fr: "Rechercher le nom du scénario dans la barre de recherche de la matrice." } }
    - { id: d, text: { en: "Turn on View MITRE by threat scenario, and then select the scenario.", fr: "Activer View MITRE by threat scenario, puis sélectionner le scénario." } }
answer: { optionId: d }
explanation:
  correct:
    en: In the Defender portal, turning on View MITRE by threat scenario and choosing a scenario in the drop-down list filters the matrix to the tactics and techniques of that scenario.
    fr: Dans le portail Defender, activer View MITRE by threat scenario et choisir un scénario dans la liste déroulante filtre la matrice sur les tactiques et techniques de ce scénario.
  options:
    a: { en: "Simulated rules shows potential coverage from detections that are not configured; it does not filter by scenario.", fr: "Simulated rules affiche la couverture potentielle des détections non configurées ; il ne filtre pas par scénario." }
    c: { en: "The search bar searches by technique name or ID, not by threat scenario.", fr: "La barre de recherche cherche par nom ou ID de technique, pas par scénario de menace." }
    b: { en: "The details pane describes one technique; it does not filter the matrix.", fr: "Le volet de détails décrit une technique ; il ne filtre pas la matrice." }
references:
  - title: View MITRE ATT&CK framework coverage in Microsoft Sentinel
    url: https://learn.microsoft.com/en-us/azure/sentinel/mitre-coverage
