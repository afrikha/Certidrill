id: sc200-1c-soc-similar-orgs
objective: "1.2.4"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Adatum Corporation recently started ingesting data into a Microsoft Sentinel workspace named **law-adatum**. SOC optimization shows several similar organizations recommendations.

    None of the following tables currently exists in law-adatum.

    Which two tables can never be suggested to Adatum by a similar organizations recommendation?

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum Corporation a récemment commencé à ingérer des données dans un espace de travail Microsoft Sentinel nommé **law-adatum**. L'optimisation SOC affiche plusieurs recommandations d'organisations similaires.

    Aucune des tables suivantes n'existe actuellement dans law-adatum.

    Quelles sont les deux tables qui ne peuvent jamais être suggérées à Adatum par une recommandation d'organisations similaires ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: "`AWSCloudTrail`" }
    - { id: b, text: "`CommonSecurityLog`" }
    - { id: c, text: "`OfficeActivity`" }
    - { id: d, text: "`ZscalerWeb_CL`" }
    - { id: e, text: "`AzureActivity`" }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: Similar organizations recommendations use machine learning to suggest tables that organizations with similar ingestion trends and industry profiles use. They exclude custom tables and custom connectors, tables ingested by fewer than 10 workspaces, and tables that contain multiple log sources, such as `Syslog` and `CommonSecurityLog`.
    fr: Les recommandations d'organisations similaires utilisent l'apprentissage automatique pour suggérer les tables qu'utilisent des organisations aux tendances d'ingestion et au profil sectoriel similaires. Elles excluent les tables et connecteurs personnalisés, les tables ingérées par moins de 10 espaces de travail et les tables qui contiennent plusieurs sources de journaux, comme `Syslog` et `CommonSecurityLog`.
  options:
    a:
      en: AWSCloudTrail is a standard single-source table that many workspaces ingest, so it can be suggested.
      fr: "AWSCloudTrail est une table standard à source unique ingérée par de nombreux espaces de travail : elle peut être suggérée."
    c:
      en: OfficeActivity is a standard table of a Microsoft connector and can be suggested.
      fr: OfficeActivity est une table standard d'un connecteur Microsoft et peut être suggérée.
    e:
      en: AzureActivity is a standard single-source table and can be suggested.
      fr: AzureActivity est une table standard à source unique et peut être suggérée.
references:
  - title: SOC optimization reference
    url: https://learn.microsoft.com/en-us/azure/sentinel/soc-optimization/soc-optimization-reference
