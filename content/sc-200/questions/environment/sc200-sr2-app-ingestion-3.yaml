id: sc200-sr2-app-ingestion-3
objective: "1.3.7"
type: series_yesno
series: sc200-sr2-app-ingestion
seriesOrder: 3
difficulty: 2
status: draft
stem:
  en: You use a DCR-based custom table and assign Monitoring Metrics Publisher on the DCR.
  fr: Vous utilisez une table personnalisée basée sur une DCR et attribuez Monitoring Metrics Publisher sur la DCR.
body:
  solution:
    en: |
      You register a Microsoft Entra application for TollGate and create a data collection endpoint. In SentinelWS, you create a DCR-based custom table named **TollGate_CL** with a new data collection rule named **DCR-TollGate**, a JSON sample of the records and the transformation `source | extend TimeGenerated = todatetime(EventTime)`. You assign the **Monitoring Metrics Publisher** role to the application on DCR-TollGate, and TollGate sends the records to the Logs Ingestion API.
    fr: |
      Vous inscrivez une application Microsoft Entra pour TollGate et créez un point de terminaison de collecte de données. Dans SentinelWS, vous créez une table personnalisée basée sur une DCR nommée **TollGate_CL** avec une nouvelle règle de collecte de données nommée **DCR-TollGate**, un exemple JSON des enregistrements et la transformation `source | extend TimeGenerated = todatetime(EventTime)`. Vous attribuez le rôle **Monitoring Metrics Publisher** à l'application sur DCR-TollGate, et TollGate envoie les enregistrements à la Logs Ingestion API.
answer: { value: true }
explanation:
  correct:
    en: The application authenticates with Microsoft Entra ID and sends the records to the Logs Ingestion API, which writes them to the dedicated TollGate_CL table through the data collection rule. The transformation builds TimeGenerated from EventTime, and Monitoring Metrics Publisher scoped to the DCR grants only the Microsoft.Insights/Telemetry/Write data action required to send data.
    fr: L'application s'authentifie auprès de Microsoft Entra ID et envoie les enregistrements à la Logs Ingestion API, qui les écrit dans la table dédiée TollGate_CL par l'intermédiaire de la règle de collecte de données. La transformation construit TimeGenerated à partir de EventTime, et Monitoring Metrics Publisher limité à la DCR n'accorde que l'action de données Microsoft.Insights/Telemetry/Write nécessaire pour envoyer des données.
references:
  - title: "Tutorial: Send data to Azure Monitor Logs by using the Logs ingestion API (Azure portal)"
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/logs/tutorial-logs-ingestion-portal
