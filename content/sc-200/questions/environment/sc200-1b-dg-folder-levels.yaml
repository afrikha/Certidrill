id: sc200-1b-dg-folder-levels
objective: "1.1.9"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    Wingtip Toys uses Microsoft Defender for Endpoint Plan 2 and has the following device groups.

    | Device group | Automation level |
    | --- | --- |
    | DG-Kiosks | Semi - require approval for non-temp folders |
    | DG-Servers | Semi - require approval for core folders |

    Automated investigation and response (AIR) identifies the following malicious files.

    | File | Device group |
    | --- | --- |
    | File1: C:\Users\guest\Downloads\setup.exe | DG-Kiosks |
    | File2: C:\Program Files\KioskApp\update.dll | DG-Kiosks |
    | File3: D:\Data\tools\dump.exe | DG-Servers |

    What happens to the remediation of each file? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Wingtip Toys utilise Microsoft Defender for Endpoint Plan 2 et dispose des groupes d'appareils suivants.

    | Groupe d'appareils | Niveau d'automatisation |
    | --- | --- |
    | DG-Kiosks | Semi - require approval for non-temp folders |
    | DG-Servers | Semi - require approval for core folders |

    L'investigation et la réponse automatisées (AIR) identifient les fichiers malveillants suivants.

    | Fichier | Groupe d'appareils |
    | --- | --- |
    | File1 : C:\Users\guest\Downloads\setup.exe | DG-Kiosks |
    | File2 : C:\Program Files\KioskApp\update.dll | DG-Kiosks |
    | File3 : D:\Data\tools\dump.exe | DG-Servers |

    Qu'advient-il de la correction de chaque fichier ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      File1: [[f1]]

      File2: [[f2]]

      File3: [[f3]]
    fr: |
      File1 : [[f1]]

      File2 : [[f2]]

      File3 : [[f3]]
  slots:
    - id: f1
      options:
        - { id: auto, text: { en: "Remediated automatically", fr: "Corrigé automatiquement" } }
        - { id: pend, text: { en: "Pending approval in the Action center", fr: "En attente d'approbation dans le centre de notifications" } }
        - { id: noinv, text: { en: "Not investigated", fr: "Non examiné" } }
    - id: f2
      options:
        - { id: auto, text: { en: "Remediated automatically", fr: "Corrigé automatiquement" } }
        - { id: pend, text: { en: "Pending approval in the Action center", fr: "En attente d'approbation dans le centre de notifications" } }
        - { id: noinv, text: { en: "Not investigated", fr: "Non examiné" } }
    - id: f3
      options:
        - { id: auto, text: { en: "Remediated automatically", fr: "Corrigé automatiquement" } }
        - { id: pend, text: { en: "Pending approval in the Action center", fr: "En attente d'approbation dans le centre de notifications" } }
        - { id: noinv, text: { en: "Not investigated", fr: "Non examiné" } }
answer:
  values: { f1: auto, f2: pend, f3: auto }
explanation:
  correct:
    en: |
      With Semi - require approval for non-temp folders, remediation is automatic only in temporary folders such as \users\*\downloads\*, so File1 is remediated and File2, under Program Files, waits for approval. With Semi - require approval for core folders, only files in core folders such as \windows\* need approval, so File3 on D:\Data is remediated automatically. Pending actions time out after seven days.
    fr: |
      Avec Semi - require approval for non-temp folders, la correction n'est automatique que dans les dossiers temporaires comme \users\*\downloads\* : File1 est corrigé, et File2, sous Program Files, attend une approbation. Avec Semi - require approval for core folders, seuls les fichiers des dossiers principaux comme \windows\* exigent une approbation : File3, dans D:\Data, est corrigé automatiquement. Les actions en attente expirent au bout de sept jours.
  options:
    noinv: { en: "Only No automated response stops automated investigation; both groups use a semi-automation level.", fr: "Seul No automated response arrête l'investigation automatisée ; les deux groupes utilisent un niveau semi-automatique." }
references:
  - title: Automation levels in automated investigation and remediation
    url: https://learn.microsoft.com/en-us/defender-endpoint/automation-levels
