id: sc200-1b-ar-order-facts
objective: "1.1.10"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Adatum Corporation uses Microsoft Sentinel and has 12 automation rules. Some use the When incident is created trigger, others the When incident is updated trigger, and two use the When alert is created trigger.

    Which two statements about how these automation rules run are true?

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum Corporation utilise Microsoft Sentinel et dispose de 12 règles d'automatisation. Certaines utilisent le déclencheur When incident is created, d'autres le déclencheur When incident is updated, et deux utilisent le déclencheur When alert is created.

    Quelles sont les deux affirmations vraies sur l'exécution de ces règles d'automatisation ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Rules that share a trigger run in parallel to reduce the processing time of an incident.", fr: "Les règles qui partagent un déclencheur s'exécutent en parallèle pour réduire le temps de traitement d'un incident." } }
    - { id: b, text: { en: "When two rules of the same trigger have the same order number, the older rule runs first.", fr: "Lorsque deux règles du même déclencheur ont le même numéro d'ordre, la plus ancienne s'exécute en premier." } }
    - { id: c, text: { en: "For a new incident, the applicable incident-creation rules run before the incident-update rules.", fr: "Pour un nouvel incident, les règles de création d'incident applicables s'exécutent avant les règles de mise à jour d'incident." } }
    - { id: d, text: { en: "A rule evaluates its conditions against the incident as it is after the earlier rules have run.", fr: "Une règle évalue ses conditions par rapport à l'incident tel qu'il est après l'exécution des règles précédentes." } }
    - { id: e, text: { en: "A rule with the When alert is created trigger can change the severity of the incident.", fr: "Une règle avec le déclencheur When alert is created peut modifier la gravité de l'incident." } }
answer: { optionIds: [ c, d ] }
explanation:
  correct:
    en: |
      Automation rules run sequentially in their order, never in parallel, and all the applicable creation rules finish before the update rules that the new incident triggers. Conditions are evaluated against the current state when the rule runs, so changes made by earlier rules count.
    fr: |
      Les règles d'automatisation s'exécutent séquentiellement dans leur ordre, jamais en parallèle, et toutes les règles de création applicables se terminent avant les règles de mise à jour déclenchées par le nouvel incident. Les conditions sont évaluées sur l'état actuel au moment où la règle s'exécute : les modifications des règles précédentes comptent.
  options:
    a: { en: "Rules never run in parallel; each rule finishes before the next one starts.", fr: "Les règles ne s'exécutent jamais en parallèle ; chaque règle se termine avant que la suivante démarre." }
    b: { en: "Rules of the same trigger with the same order number run in a random order.", fr: "Les règles du même déclencheur ayant le même numéro d'ordre s'exécutent dans un ordre aléatoire." }
    e: { en: "Alert-trigger rules support only the Run playbook action.", fr: "Les règles à déclencheur d'alerte ne prennent en charge que l'action Run playbook." }
references:
  - title: Automate threat response in Microsoft Sentinel with automation rules
    url: https://learn.microsoft.com/en-us/azure/sentinel/automate-incident-handling-with-automation-rules
