id: sc200-1c-soc-api-list
objective: "1.2.4"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    Litware has a Microsoft Sentinel workspace named **law-litware** in a resource group named **rg-soc**. The SOC manager wants a monthly export of all the current SOC optimization recommendations of the workspace to track trends.

    You write a script that uses the Azure CLI.

    How should you complete the command? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware dispose d'un espace de travail Microsoft Sentinel nommé **law-litware** dans un groupe de ressources nommé **rg-soc**. Le responsable du SOC souhaite un export mensuel de toutes les recommandations d'optimisation SOC en cours de l'espace de travail pour suivre les tendances.

    Vous écrivez un script qui utilise Azure CLI.

    Comment devez-vous compléter la commande ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: bash
  template: |
    az rest --method [[method]] \
      --url "https://management.azure.com/subscriptions/$SUB_ID/resourceGroups/rg-soc/providers/Microsoft.OperationalInsights/workspaces/law-litware/providers/[[provider]]/[[resource]]?api-version=2024-01-01-preview"
  slots:
    - id: method
      options:
        - { id: get, text: get }
        - { id: patch, text: patch }
        - { id: post, text: post }
        - { id: put, text: put }
    - id: provider
      options:
        - { id: si, text: Microsoft.SecurityInsights }
        - { id: ins, text: Microsoft.Insights }
        - { id: sec, text: Microsoft.Security }
        - { id: oi, text: Microsoft.OperationalInsights }
    - id: resource
      options:
        - { id: reco, text: recommendations }
        - { id: assess, text: assessments }
        - { id: alertrules, text: alertRules }
        - { id: saved, text: savedSearches }
answer:
  values: { method: get, provider: si, resource: reco }
explanation:
  correct:
    en: SOC optimizations are exposed by the Microsoft Sentinel `recommendations` API (preview), under the `Microsoft.SecurityInsights` provider of the workspace, with API version 2024-01-01-preview or later. A GET on the collection lists all the current recommendations; PATCH on one recommendation updates its status, and POST on `triggerEvaluation` starts a new evaluation.
    fr: "Les optimisations SOC sont exposées par l'API `recommendations` de Microsoft Sentinel (préversion), sous le fournisseur `Microsoft.SecurityInsights` de l'espace de travail, avec la version d'API 2024-01-01-preview ou ultérieure. Un GET sur la collection liste toutes les recommandations en cours ; un PATCH sur une recommandation met à jour son état, et un POST sur `triggerEvaluation` lance une nouvelle évaluation."
  options:
    patch: { en: "PATCH changes the status of one recommendation; it doesn't list them.", fr: "PATCH modifie l'état d'une recommandation ; il ne les liste pas." }
    sec: { en: "Microsoft.Security/assessments holds Microsoft Defender for Cloud recommendations, not SOC optimizations.", fr: "Microsoft.Security/assessments contient les recommandations de Microsoft Defender pour le cloud, pas les optimisations SOC." }
    alertrules: { en: "alertRules returns the analytics rules of the workspace.", fr: "alertRules renvoie les règles d'analytique de l'espace de travail." }
    saved: { en: "savedSearches is a Log Analytics resource for saved queries.", fr: "savedSearches est une ressource Log Analytics pour les requêtes enregistrées." }
references:
  - title: Use SOC optimizations programmatically (Preview)
    url: https://learn.microsoft.com/en-us/azure/sentinel/soc-optimization/soc-optimization-api
