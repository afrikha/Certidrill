id: sc200-1b-dg-role-permissions
objective: "1.1.9"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Northwind Traders has used Microsoft Defender for Endpoint since 2022 and manages access with Defender for Endpoint roles (Unified RBAC isn't activated). You create one role per SOC team. Each role must contain only the permissions the team needs.

    Which permission should you add to each team's role? To answer, drag the appropriate permissions to the correct teams. Each permission may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind Traders utilise Microsoft Defender for Endpoint depuis 2022 et gère les accès avec les rôles de Defender for Endpoint (le RBAC unifié n'est pas activé). Vous créez un rôle par équipe SOC. Chaque rôle ne doit contenir que les autorisations dont l'équipe a besoin.

    Quelle autorisation devez-vous ajouter au rôle de chaque équipe ? Pour répondre, faites glisser les autorisations appropriées vers les équipes correspondantes. Chaque autorisation peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: lrbasic, text: "Live response capabilities: Basic" }
    - { id: lradv, text: "Live response capabilities: Advanced" }
    - { id: active, text: "Active remediation actions" }
    - { id: secset, text: "Manage security settings in Security Center" }
    - { id: portal, text: "Manage portal system settings" }
    - { id: alerts, text: "Alerts investigation" }
  targets:
    - id: t1
      text: { en: "Forensics: run a PowerShell script from the library on a device during a live response session", fr: "Investigation numérique : exécuter un script PowerShell de la bibliothèque sur un appareil pendant une session de réponse dynamique" }
    - id: t2
      text: { en: "Tier 1: start live response sessions, run read-only commands and download files", fr: "Niveau 1 : démarrer des sessions de réponse dynamique, exécuter des commandes en lecture seule et télécharger des fichiers" }
    - id: t3
      text: { en: "Tier 2: approve or reject pending remediation actions in the Action center", fr: "Niveau 2 : approuver ou rejeter les actions de correction en attente dans le centre de notifications" }
    - id: t4
      text: { en: "Platform: configure alert suppression rules and email notifications", fr: "Plateforme : configurer des règles de suppression d'alertes et les notifications par e-mail" }
answer:
  mapping: { t1: lradv, t2: lrbasic, t3: active, t4: secset }
explanation:
  correct:
    en: |
      Live response Advanced adds uploading files and running library scripts, while Basic allows sessions, read-only commands and file downloads. Active remediation actions covers response actions and the approval or dismissal of pending actions. Manage security settings in Security Center covers alert suppression, automation folder exclusions, onboarding and email notifications.
    fr: |
      La réponse dynamique Advanced ajoute le chargement de fichiers et l'exécution de scripts de la bibliothèque, tandis que Basic permet les sessions, les commandes en lecture seule et le téléchargement de fichiers. Active remediation actions couvre les actions de réponse et l'approbation ou le rejet des actions en attente. Manage security settings in Security Center couvre la suppression d'alertes, les exclusions de dossiers d'automatisation, l'intégration et les notifications par e-mail.
  options:
    portal: { en: "Manage portal system settings covers settings such as roles, device groups and automated file uploads, and exists only in the default administrator role.", fr: "Manage portal system settings couvre des paramètres comme les rôles, les groupes d'appareils et le chargement automatique de fichiers, et n'existe que dans le rôle d'administrateur par défaut." }
    alerts: { en: "Alerts investigation manages alerts, scans and investigation packages; it doesn't approve actions or allow live response.", fr: "Alerts investigation gère les alertes, les analyses et les packages d'investigation ; il ne permet ni d'approuver des actions ni la réponse dynamique." }
references:
  - title: Create and manage roles for role-based access control
    url: https://learn.microsoft.com/en-us/defender-endpoint/user-roles
