id: sc200-1c-wse-common-set
objective: "1.3.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Fabrikam collects the Security log of its Windows servers into Microsoft Sentinel by using the Windows Security Events via AMA connector.

    The audit team requires a full user audit trail from the servers, including both user sign-in and sign-out events. Ingestion volume must be as low as possible among the predefined event sets that meet this requirement.

    Which event set should you select in the data collection rule?
  fr: |
    Fabrikam collecte le journal Sécurité de ses serveurs Windows dans Microsoft Sentinel avec le connecteur Windows Security Events via AMA.

    L'équipe d'audit exige une piste d'audit utilisateur complète depuis les serveurs, avec les événements de connexion et de déconnexion des utilisateurs. Le volume d'ingestion doit être le plus faible possible parmi les jeux d'événements prédéfinis qui répondent à cette exigence.

    Quel jeu d'événements devez-vous sélectionner dans la règle de collecte de données ?
body:
  options:
    - { id: a, text: All Security Events }
    - { id: b, text: Common }
    - { id: c, text: Minimal }
    - { id: d, text: { en: "Custom, with an XPath query for event IDs 4624 and 4625", fr: "Custom, avec une requête XPath pour les ID d'événement 4624 et 4625" } }
answer: { optionId: b }
explanation:
  correct:
    en: The Common set reduces the volume to a manageable level while keeping a full user audit trail; it contains, for example, both sign-in (4624) and sign-out (4634) events, security group changes and key domain controller Kerberos operations.
    fr: Le jeu Common réduit le volume à un niveau gérable tout en conservant une piste d'audit utilisateur complète ; il contient par exemple les événements de connexion (4624) et de déconnexion (4634), les modifications de groupes de sécurité et les opérations Kerberos clés des contrôleurs de domaine.
  options:
    a:
      en: All Security Events also meets the requirement, but it collects the full, unfiltered Security and AppLocker logs, which is the highest volume.
      fr: All Security Events répond aussi à l'exigence, mais collecte les journaux Sécurité et AppLocker complets et non filtrés, soit le volume le plus élevé.
    c:
      en: Minimal contains successful and failed sign-ins but not the sign-out event 4634, so it isn't a full audit trail.
      fr: "Minimal contient les connexions réussies et échouées, mais pas l'événement de déconnexion 4634 : ce n'est pas une piste d'audit complète."
    d:
      en: This custom query collects sign-ins only and is not one of the predefined sets.
      fr: Cette requête personnalisée ne collecte que les connexions et ne fait pas partie des jeux prédéfinis.
references:
  - title: Windows security event sets that can be sent to Microsoft Sentinel
    url: https://learn.microsoft.com/en-us/azure/sentinel/windows-security-event-id-reference
