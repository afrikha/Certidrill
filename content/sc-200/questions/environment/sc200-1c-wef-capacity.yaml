id: sc200-1c-wef-capacity
objective: "1.3.3"
type: single
difficulty: 3
status: draft
shuffle: false
stem:
  en: |
    Tailspin Toys plans Windows Event Forwarding for 24,000 devices. During a pilot, the planned subscriptions generated an average total of 7,500 events per second across all the devices.

    The Windows Event Collector (WEC) servers will run on commodity hardware with the default subscription settings, and the load will be spread evenly across them. You follow Microsoft's capacity guidance for WEC servers.

    What is the minimum number of WEC servers that you should plan?
  fr: |
    Tailspin Toys planifie le transfert d'événements Windows pour 24 000 appareils. Pendant un pilote, les abonnements prévus ont généré en moyenne un total de 7 500 événements par seconde sur l'ensemble des appareils.

    Les serveurs collecteurs d'événements Windows (WEC) fonctionneront sur du matériel standard avec les paramètres d'abonnement par défaut, et la charge sera répartie uniformément entre eux. Vous suivez les recommandations de capacité de Microsoft pour les serveurs WEC.

    Quel est le nombre minimal de serveurs WEC à prévoir ?
body:
  options:
    - { id: a, text: "1" }
    - { id: b, text: "2" }
    - { id: c, text: "3" }
    - { id: d, text: "8" }
answer: { optionId: c }
explanation:
  correct:
    en: Microsoft's guidance is to plan an average total of 3,000 events per second for all the subscriptions of a WEC server on commodity hardware. 7,500 / 3,000 = 2.5, so you need at least three servers. Disk I/O, the open TCP ports and the number of registry keys (one per source) are the other limits to watch.
    fr: "Les recommandations de Microsoft prévoient en moyenne un total de 3 000 événements par seconde pour l'ensemble des abonnements d'un serveur WEC sur du matériel standard. 7 500 / 3 000 = 2,5 : il faut donc au moins trois serveurs. Les E/S disque, les ports TCP ouverts et le nombre de clés de Registre (une par source) sont les autres limites à surveiller."
  options:
    a:
      en: One server would have to absorb 7,500 events per second, two and a half times the guidance.
      fr: Un seul serveur devrait absorber 7 500 événements par seconde, soit deux fois et demie la recommandation.
    b:
      en: Two servers would each receive 3,750 events per second, above the 3,000 events per second guidance.
      fr: Deux serveurs recevraient chacun 3 750 événements par seconde, au-delà des 3 000 recommandés.
    d:
      en: Eight servers would work but isn't the minimum; the guidance isn't based on one server per 3,000 devices.
      fr: Huit serveurs fonctionneraient, mais ce n'est pas le minimum ; la recommandation ne repose pas sur un serveur pour 3 000 appareils.
references:
  - title: Use Windows Event Forwarding to help with intrusion detection
    url: https://learn.microsoft.com/en-us/windows/security/operating-system-security/device-management/use-windows-event-forwarding-to-assist-in-intrusion-detection
