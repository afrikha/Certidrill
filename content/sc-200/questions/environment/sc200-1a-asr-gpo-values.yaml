id: sc200-1a-asr-gpo-values
objective: "1.1.6"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Contoso, Ltd. deploys attack surface reduction (ASR) rules by using the Group Policy setting **Configure Attack Surface Reduction rules**. In this setting, the value name is the rule GUID and the value is the rule mode.

    Which value should you enter for each required behavior? To answer, drag the appropriate values to the correct behaviors. Each value may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso, Ltd. déploie des règles de réduction de la surface d'attaque (ASR) avec le paramètre de stratégie de groupe **Configure Attack Surface Reduction rules**. Dans ce paramètre, le nom de la valeur est le GUID de la règle et la valeur est le mode de la règle.

    Quelle valeur devez-vous saisir pour chaque comportement requis ? Pour répondre, faites glisser les valeurs appropriées vers les comportements correspondants. Chaque valeur peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: v0, text: "0" }
    - { id: v1, text: "1" }
    - { id: v2, text: "2" }
    - { id: v5, text: "5" }
    - { id: v6, text: "6" }
  targets:
    - id: t1
      text: { en: "The rule only logs the behavior", fr: "La règle se contente de journaliser le comportement" }
    - id: t2
      text: { en: "The rule blocks the behavior", fr: "La règle bloque le comportement" }
    - id: t3
      text: { en: "The rule blocks the behavior but lets the user bypass the block", fr: "La règle bloque le comportement mais permet à l'utilisateur de contourner le blocage" }
    - id: t4
      text: { en: "The rule is turned off", fr: "La règle est désactivée" }
answer:
  mapping: { t1: v2, t2: v1, t3: v6, t4: v0 }
explanation:
  correct:
    en: The ASR modes are 0 for Off (Disabled), 1 for Block (Enabled), 2 for Audit (AuditMode), 5 for Not configured and 6 for Warn. Warn blocks the behavior but shows a notification that lets the user unblock it.
    fr: Les modes ASR sont 0 pour Off (Disabled), 1 pour Block (Enabled), 2 pour Audit (AuditMode), 5 pour Not configured et 6 pour Warn. Warn bloque le comportement mais affiche une notification qui permet à l'utilisateur de le débloquer.
  options:
    v5: { en: "5 means Not configured: no setting is applied by the policy.", fr: "5 signifie Not configured : la stratégie n'applique aucun paramètre." }
references:
  - title: Configure ASR rules and exclusions
    url: https://learn.microsoft.com/en-us/defender-endpoint/enable-attack-surface-reduction
