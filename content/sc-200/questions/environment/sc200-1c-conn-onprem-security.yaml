id: sc200-1c-conn-onprem-security
objective: "1.3.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Contoso has 40 Windows Server 2022 member servers that run as Hyper-V virtual machines in an on-premises datacenter. Contoso has a Microsoft Sentinel workspace named **law-contoso** and has installed the Windows Security Events solution from the Content hub.

    You need to collect the Security log of the servers so that the built-in Windows Security analytics rules work without modification.

    Which two actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso dispose de 40 serveurs membres Windows Server 2022 exécutés comme machines virtuelles Hyper-V dans un centre de données local. Contoso dispose d'un espace de travail Microsoft Sentinel nommé **law-contoso** et a installé la solution Windows Security Events depuis le hub de contenu.

    Vous devez collecter le journal Sécurité des serveurs pour que les règles d'analytique Windows Security intégrées fonctionnent sans modification.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Install the Log Analytics agent on the servers and connect it to law-contoso.", fr: "Installer l'agent Log Analytics sur les serveurs et le connecter à law-contoso." } }
    - { id: b, text: { en: "Create a data collection rule from the Windows Security Events via AMA connector page and add the servers.", fr: "Créer une règle de collecte de données depuis la page du connecteur Windows Security Events via AMA et y ajouter les serveurs." } }
    - { id: c, text: { en: "Create a data collection rule in Azure Monitor with the Windows Event Logs data source and select the Security log.", fr: "Créer une règle de collecte de données dans Azure Monitor avec la source de données Windows Event Logs et sélectionner le journal Sécurité." } }
    - { id: d, text: { en: "Onboard the servers to Azure Arc.", fr: "Intégrer les serveurs à Azure Arc." } }
    - { id: e, text: { en: "Configure the Windows Forwarded Events connector and add the servers.", fr: "Configurer le connecteur Windows Forwarded Events et y ajouter les serveurs." } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: Any machine that isn't an Azure VM must have Azure Arc installed and enabled before you enable an AMA-based connector. The Windows Security Events via AMA connector then creates a data collection rule, installs the Azure Monitor Agent on the selected servers and writes the events to `SecurityEvent`, the table that the built-in rules query.
    fr: Toute machine qui n'est pas une machine virtuelle Azure doit avoir Azure Arc installé et activé avant que vous activiez un connecteur basé sur AMA. Le connecteur Windows Security Events via AMA crée ensuite une règle de collecte de données, installe l'agent Azure Monitor sur les serveurs sélectionnés et écrit les événements dans `SecurityEvent`, la table qu'interrogent les règles intégrées.
  options:
    c:
      en: A generic Azure Monitor DCR sends Security events to the `Event` table, which the Sentinel rules don't query.
      fr: Une DCR Azure Monitor générique envoie les événements de sécurité dans la table `Event`, que les règles Sentinel n'interrogent pas.
    a:
      en: The Log Analytics agent (MMA) is retired; collection uses the Azure Monitor Agent with data collection rules.
      fr: L'agent Log Analytics (MMA) est retiré ; la collecte utilise l'agent Azure Monitor avec des règles de collecte de données.
    e:
      en: Windows Forwarded Events collects from a Windows Event Collector and writes to `WindowsEvent`, which the built-in rules don't match.
      fr: Windows Forwarded Events collecte depuis un collecteur d'événements Windows et écrit dans `WindowsEvent`, que les règles intégrées ne prennent pas en compte.
references:
  - title: Connect Microsoft Sentinel to other Microsoft services with a Windows agent-based data connector
    url: https://learn.microsoft.com/en-us/azure/sentinel/connect-services-windows-based
