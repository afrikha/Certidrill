id: sc200-1a-cdc-location
objective: "1.1.5"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    Litware, Inc. uses Microsoft Defender for Endpoint Plan 2 and a Microsoft Sentinel workspace connected to the Microsoft Defender portal. The compliance team needs every file modification in a folder that contains cardholder data on the payment servers.

    How should you complete the sentence? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware, Inc. utilise Microsoft Defender pour point de terminaison Plan 2 et un espace de travail Microsoft Sentinel connecté au portail Microsoft Defender. L'équipe conformité a besoin de toutes les modifications de fichiers d'un dossier qui contient des données de titulaires de cartes sur les serveurs de paiement.

    Comment devez-vous compléter la phrase ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Create the rule in [[where]], and query the collected events in [[store]].
    fr: |
      Créez la règle dans [[where]], et interrogez les événements collectés dans [[store]].
  slots:
    - id: where
      options:
        - { id: cdc, text: "Settings > Endpoints > Rules > Custom Data Collection" }
        - { id: tuning, text: "Settings > Microsoft Defender XDR > Alert tuning" }
        - { id: connectors, text: { en: "Microsoft Sentinel > Data connectors", fr: "Microsoft Sentinel > Connecteurs de données" } }
    - id: store
      options:
        - { id: ws, text: { en: "the connected Microsoft Sentinel workspace", fr: "l'espace de travail Microsoft Sentinel connecté" } }
        - { id: default, text: { en: "the default DeviceFileEvents table only", fr: "la table par défaut DeviceFileEvents uniquement" } }
        - { id: storage, text: { en: "an Azure Storage account selected in the rule", fr: "un compte Stockage Azure sélectionné dans la règle" } }
answer:
  values: { where: cdc, store: ws }
explanation:
  correct:
    en: Custom data collection rules are created in **Settings > Endpoints > Rules > Custom Data Collection** after you select the workspace on the Workspace scope page. The events go to the connected Microsoft Sentinel workspace, in tables such as `DeviceCustomFileEvents`, alongside the default telemetry.
    fr: Les règles de collecte de données personnalisée se créent dans **Paramètres > Points de terminaison > Règles > Custom Data Collection**, après avoir sélectionné l'espace de travail sur la page Workspace scope. Les événements vont dans l'espace de travail Microsoft Sentinel connecté, dans des tables comme `DeviceCustomFileEvents`, en plus de la télémétrie par défaut.
  options:
    tuning: { en: "Alert tuning hides or resolves alerts; it doesn't collect events.", fr: "Le réglage des alertes masque ou résout des alertes ; il ne collecte pas d'événements." }
    default: { en: "Custom rules don't modify the default tables; they write to the DeviceCustom* tables.", fr: "Les règles personnalisées ne modifient pas les tables par défaut ; elles écrivent dans les tables DeviceCustom*." }
    storage: { en: "Custom data collection sends events to the Sentinel workspace, not to a storage account.", fr: "La collecte de données personnalisée envoie les événements à l'espace de travail Sentinel, pas à un compte de stockage." }
references:
  - title: Create and manage custom data collection rules in Microsoft Defender for Endpoint
    url: https://learn.microsoft.com/en-us/defender-endpoint/create-custom-data-collection-rules
