id: sc200-cs3a-firewall-tier
objective: "1.2.2"
type: single
caseStudy: sc200-cs3a-trey-research
difficulty: 1
status: draft
stem:
  en: |
    You need to configure the CommonSecurityLog table in the Defender portal to meet the firewall retention requirement. What should you do?
  fr: |
    Vous devez configurer la table CommonSecurityLog dans le portail Defender pour respecter l'exigence de rétention des pare-feu. Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Keep the Analytics tier and set the analytics retention to two years.", fr: "Conserver le niveau Analytics et définir la rétention Analytics sur deux ans." } }
    - { id: b, text: { en: "Switch the table to the Data lake tier and set the total retention to two years.", fr: "Basculer la table vers le niveau Data lake et définir la rétention totale sur deux ans." } }
    - { id: c, text: { en: "Keep the Analytics tier with 90 days of analytics retention and set the total retention to two years.", fr: "Conserver le niveau Analytics avec 90 jours de rétention Analytics et définir la rétention totale sur deux ans." } }
    - { id: d, text: { en: "Keep the Analytics tier and set the analytics retention to 90 days.", fr: "Conserver le niveau Analytics et définir la rétention Analytics sur 90 jours." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      The raw firewall logs are not used by analytics rules or hunting queries, so they do not need the Analytics tier. The Data lake tier has minimal ingestion cost and keeps data for up to 12 years of total retention at low cost, which makes it the cheapest way to keep 900 GB per day for two years.
    fr: |
      Les journaux bruts des pare-feu ne sont utilisés ni par des règles d'analytique ni par des requêtes de chasse : ils n'ont pas besoin du niveau Analytics. Le niveau Data lake a un coût d'ingestion minimal et conserve les données jusqu'à 12 ans de rétention totale à faible coût, ce qui en fait la solution la moins chère pour garder 900 Go par jour pendant deux ans.
  options:
    a: { en: "Two years of analytics retention meets the duration but adds a long-term retention charge on top of the standard Analytics ingestion cost.", fr: "Deux ans de rétention Analytics respectent la durée, mais ajoutent des frais de rétention à long terme au coût d'ingestion standard du niveau Analytics." }
    c: { en: "This keeps the data for two years, but the 900 GB per day are still ingested at the Analytics tier price, which costs more than the Data lake tier.", fr: "Cette option conserve les données deux ans, mais les 900 Go par jour sont toujours ingérés au prix du niveau Analytics, plus cher que le niveau Data lake." }
    d: { en: "90 days of retention does not meet the two-year requirement.", fr: "90 jours de rétention ne respectent pas l'exigence de deux ans." }
references:
  - title: Manage data tiers and retention in Microsoft Sentinel
    url: https://learn.microsoft.com/en-us/azure/sentinel/manage-data-overview
