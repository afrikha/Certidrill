id: sc200-1c-conn-entra-permissions
objective: "1.3.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Northwind Traders has a Microsoft Entra tenant named **northwind.com** and a Microsoft Sentinel workspace named **law-nw-soc**. The Microsoft Entra ID solution is installed from the Content hub.

    A security engineer named Engineer1 must enable the Microsoft Entra ID data connector to stream the sign-in logs and audit logs of the tenant to law-nw-soc. The solution must follow the principle of least privilege.

    Which two roles should Engineer1 have? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind Traders dispose d'un locataire Microsoft Entra nommé **northwind.com** et d'un espace de travail Microsoft Sentinel nommé **law-nw-soc**. La solution Microsoft Entra ID est installée depuis le hub de contenu.

    Un ingénieur sécurité nommé Engineer1 doit activer le connecteur de données Microsoft Entra ID pour envoyer les journaux de connexion et les journaux d'audit du locataire vers law-nw-soc. La solution doit respecter le principe du moindre privilège.

    Quels sont les deux rôles dont Engineer1 doit disposer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Microsoft Sentinel Contributor on the workspace", fr: "Microsoft Sentinel Contributor sur l'espace de travail" } }
    - { id: b, text: { en: "Microsoft Sentinel Responder on the workspace", fr: "Microsoft Sentinel Responder sur l'espace de travail" } }
    - { id: c, text: { en: "Security Administrator in the tenant", fr: "Security Administrator dans le locataire" } }
    - { id: d, text: { en: "Security Reader in the tenant", fr: "Security Reader dans le locataire" } }
    - { id: e, text: { en: "Log Analytics Reader on the workspace", fr: "Log Analytics Reader sur l'espace de travail" } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: To connect the Microsoft Entra ID connector, the user needs the Microsoft Sentinel Contributor role on the workspace and the Security Administrator role, or equivalent permissions, on the tenant whose logs are streamed. Reading the connection status also requires read and write permissions on the Microsoft Entra diagnostic settings.
    fr: Pour connecter le connecteur Microsoft Entra ID, l'utilisateur a besoin du rôle Microsoft Sentinel Contributor sur l'espace de travail et du rôle Security Administrator, ou d'autorisations équivalentes, sur le locataire dont les journaux sont envoyés. L'affichage de l'état de la connexion exige aussi des autorisations de lecture et d'écriture sur les paramètres de diagnostic Microsoft Entra.
  options:
    b:
      en: Microsoft Sentinel Responder manages incidents; it can't configure data connectors.
      fr: Microsoft Sentinel Responder gère les incidents ; il ne peut pas configurer les connecteurs de données.
    d:
      en: Security Reader has read-only access and can't configure the diagnostic settings of the tenant.
      fr: Security Reader dispose d'un accès en lecture seule et ne peut pas configurer les paramètres de diagnostic du locataire.
    e:
      en: Log Analytics Reader can only read the workspace data.
      fr: Log Analytics Reader peut seulement lire les données de l'espace de travail.
references:
  - title: Send data to Microsoft Sentinel using the Microsoft Entra ID data connector
    url: https://learn.microsoft.com/en-us/azure/sentinel/connect-azure-active-directory
