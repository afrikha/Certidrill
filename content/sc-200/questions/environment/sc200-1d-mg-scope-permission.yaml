id: sc200-1d-mg-scope-permission
objective: "1.4.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Northwind uses Microsoft Defender XDR with the device groups **DG-Branch**, **DG-HQ** and **DG-Servers**. A security analyst named **Analyst1** has a role that grants the Security settings (manage) permission and access only to the DG-Branch device group.

    A custom detection rule named **Rule1** is scoped to all devices. Analyst1 can edit the rules scoped to DG-Branch, but cannot edit Rule1. Rule1 must keep its current scope.

    You need to ensure that Analyst1 can edit Rule1. The solution must follow the principle of least privilege.

    What should you do?
  fr: |
    Northwind utilise Microsoft Defender XDR avec les groupes d'appareils **DG-Branch**, **DG-HQ** et **DG-Servers**. Un analyste de sécurité nommé **Analyst1** dispose d'un rôle qui accorde l'autorisation Security settings (manage) et l'accès au seul groupe d'appareils DG-Branch.

    Une règle de détection personnalisée nommée **Rule1** a pour étendue tous les appareils. Analyst1 peut modifier les règles dont l'étendue est DG-Branch, mais ne peut pas modifier Rule1. Rule1 doit conserver son étendue actuelle.

    Vous devez faire en sorte qu'Analyst1 puisse modifier Rule1. La solution doit respecter le principe du moindre privilège.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Assign Analyst1 the Microsoft Sentinel Contributor role on the workspace.", fr: "Attribuer à Analyst1 le rôle Microsoft Sentinel Contributor sur l'espace de travail." } }
    - { id: b, text: { en: "Extend the role assignment of Analyst1 to all the device groups.", fr: "Étendre l'attribution de rôle d'Analyst1 à tous les groupes d'appareils." } }
    - { id: c, text: { en: "Assign Analyst1 the Global Administrator role in Microsoft Entra ID.", fr: "Attribuer à Analyst1 le rôle Global Administrator dans Microsoft Entra ID." } }
    - { id: d, text: { en: "Assign Analyst1 the Security Reader role in Microsoft Entra ID.", fr: "Attribuer à Analyst1 le rôle Security Reader dans Microsoft Entra ID." } }
answer: { optionId: b }
explanation:
  correct:
    en: A user can create or edit a custom detection rule only if they have permissions on all the devices in the rule's scope. Rule1 covers all devices, so Analyst1 needs access to every device group; the manage permission is already granted.
    fr: |
      Un utilisateur ne peut créer ou modifier une règle de détection personnalisée que s'il a des autorisations sur tous les appareils de l'étendue de la règle. Rule1 couvre tous les appareils : Analyst1 a donc besoin d'accéder à tous les groupes d'appareils ; l'autorisation de gestion est déjà accordée.
  options:
    a: { en: "Microsoft Sentinel Contributor applies to rules on Sentinel data; it gives no access to Defender for Endpoint device groups.", fr: "Microsoft Sentinel Contributor s'applique aux règles sur des données Sentinel ; il ne donne aucun accès aux groupes d'appareils Defender pour point de terminaison." }
    c: { en: "Global Administrator would work but grants far more than needed.", fr: "Global Administrator conviendrait, mais accorde bien plus que nécessaire." }
    d: { en: "Security Reader grants read-only access, which adds nothing to edit a rule; the missing piece is access to the devices outside DG-Branch.", fr: "Security Reader accorde un accès en lecture seule, qui n'apporte rien pour modifier une règle ; ce qui manque, c'est l'accès aux appareils hors de DG-Branch." }
references:
  - title: Create custom detection rules in Microsoft Defender XDR
    url: https://learn.microsoft.com/en-us/defender-xdr/custom-detection-rules
