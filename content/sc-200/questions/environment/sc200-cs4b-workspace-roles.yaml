id: sc200-cs4b-workspace-roles
objective: "1.2.1"
type: dragdrop
caseStudy: sc200-cs4b-best-for-you-organics
difficulty: 1
status: draft
stem:
  en: |
    You need to assign Azure roles on RG-SOC to meet the workspace access requirement.

    Which role should you assign to each group? To answer, drag the appropriate roles to the correct groups. Each role may be used once, more than once, or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez attribuer des rôles Azure sur RG-SOC pour respecter l'exigence relative à l'accès à l'espace de travail.

    Quel rôle devez-vous attribuer à chaque groupe ? Pour répondre, faites glisser les rôles appropriés vers les groupes correspondants. Chaque rôle peut être utilisé une fois, plusieurs fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: true
  items:
    - { id: reader, text: "Microsoft Sentinel Reader" }
    - { id: responder, text: "Microsoft Sentinel Responder" }
    - { id: contributor, text: "Microsoft Sentinel Contributor" }
    - { id: operator, text: "Microsoft Sentinel Playbook Operator" }
    - { id: automation, text: "Microsoft Sentinel Automation Contributor" }
  targets:
    - { id: tier1, text: "GRP-Tier1" }
    - { id: deteng, text: "GRP-DetEng" }
    - { id: fraud, text: "GRP-Fraud" }
answer:
  mapping: { tier1: responder, deteng: contributor, fraud: reader }
explanation:
  correct:
    en: |
      Microsoft Sentinel Responder adds incident management (assigning, commenting, closing) to the Reader permissions. Microsoft Sentinel Contributor adds the creation and editing of content such as analytics rules and the management of Content hub solutions. Microsoft Sentinel Reader lets GRP-Fraud view incidents, data, and workbooks without managing incidents or creating content.
    fr: |
      Microsoft Sentinel Responder ajoute la gestion des incidents (attribution, commentaires, fermeture) aux autorisations de Reader. Microsoft Sentinel Contributor ajoute la création et la modification de contenu comme les règles d'analytique, et la gestion des solutions du hub de contenu. Microsoft Sentinel Reader permet à GRP-Fraud de consulter les incidents, les données et les classeurs sans gérer d'incidents ni créer de contenu.
  options:
    operator:
      en: Playbook Operator only lists, views, and manually runs playbooks; it does not grant access to incidents or analytics rules.
      fr: Playbook Operator permet seulement de lister, d'afficher et d'exécuter manuellement des playbooks ; il ne donne accès ni aux incidents ni aux règles d'analytique.
    automation:
      en: Automation Contributor is assigned to the Microsoft Sentinel service account so that automation rules can run playbooks; it is not used for user accounts.
      fr: Automation Contributor est attribué au compte de service Microsoft Sentinel pour que les règles d'automatisation puissent exécuter des playbooks ; il n'est pas utilisé pour les comptes d'utilisateur.
references:
  - title: Roles and permissions in the Microsoft Sentinel platform
    url: https://learn.microsoft.com/en-us/azure/sentinel/roles
