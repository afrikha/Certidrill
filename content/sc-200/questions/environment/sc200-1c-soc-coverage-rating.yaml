id: sc200-1c-soc-coverage-rating
objective: "1.2.4"
type: dropdown
difficulty: 2
status: draft
shuffle: false
stem:
  en: |
    Northwind Traders reviews the threat-based coverage optimizations of its Microsoft Sentinel workspace in the Microsoft Defender portal. For each threat scenario, Microsoft recommends 40 analytics rules. The following numbers of recommended rules are active in the workspace:

    | Threat scenario | Active recommended rules |
    | --- | --- |
    | Human-operated ransomware | 12 of 40 |
    | Business email compromise | 34 of 40 |
    | Credential exploitation | 9 of 40 |

    Which coverage level does SOC optimization show for each scenario? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind Traders examine les optimisations de couverture basée sur les menaces de son espace de travail Microsoft Sentinel dans le portail Microsoft Defender. Pour chaque scénario de menace, Microsoft recommande 40 règles d'analytique. Voici le nombre de règles recommandées actives dans l'espace de travail :

    | Scénario de menace | Règles recommandées actives |
    | --- | --- |
    | Rançongiciel opéré par des humains | 12 sur 40 |
    | Compromission de messagerie professionnelle | 34 sur 40 |
    | Exploitation d'informations d'identification | 9 sur 40 |

    Quel niveau de couverture l'optimisation SOC affiche-t-elle pour chaque scénario ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Human-operated ransomware: [[ransom]]

      Business email compromise: [[bec]]

      Credential exploitation: [[cred]]
    fr: |
      Rançongiciel opéré par des humains : [[ransom]]

      Compromission de messagerie professionnelle : [[bec]]

      Exploitation d'informations d'identification : [[cred]]
  slots:
    - id: ransom
      options:
        - { id: low, text: Low }
        - { id: medium, text: Medium }
        - { id: high, text: High }
    - id: bec
      options:
        - { id: low, text: Low }
        - { id: medium, text: Medium }
        - { id: high, text: High }
    - id: cred
      options:
        - { id: low, text: Low }
        - { id: medium, text: Medium }
        - { id: high, text: High }
answer:
  values: { ransom: medium, bec: high, cred: low }
explanation:
  correct:
    en: The coverage indicator compares the active rules with the rules recommended by Microsoft research. High means over 75 % of the recommended rules are active, Medium 30 % to 74 %, and Low 0 % to 29 %. 12 of 40 is 30 % (Medium), 34 of 40 is 85 % (High) and 9 of 40 is 22.5 % (Low).
    fr: L'indicateur de couverture compare les règles actives aux règles recommandées par la recherche Microsoft. High signifie que plus de 75 % des règles recommandées sont actives, Medium de 30 % à 74 %, et Low de 0 % à 29 %. 12 sur 40 font 30 % (Medium), 34 sur 40 font 85 % (High) et 9 sur 40 font 22,5 % (Low).
references:
  - title: Optimize security operations
    url: https://learn.microsoft.com/en-us/azure/sentinel/soc-optimization/soc-optimization-access
