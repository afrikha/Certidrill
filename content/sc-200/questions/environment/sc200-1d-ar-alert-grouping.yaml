id: sc200-1d-ar-alert-grouping
objective: "1.4.3"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    Adatum has a Microsoft Sentinel workspace. You are creating a scheduled analytics rule that detects failed administrative operations. The rule maps the **Account** and **Host** entities.

    The rule must meet the following requirements:

    - Each event returned by the query must produce its own alert.
    - The alerts for the same account generated within the grouping time frame must be grouped into one incident, even when the host differs.

    How should you configure the rule? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum dispose d'un espace de travail Microsoft Sentinel. Vous créez une règle d'analytique planifiée qui détecte les opérations d'administration en échec. La règle mappe les entités **Account** et **Host**.

    La règle doit répondre aux exigences suivantes :

    - Chaque événement renvoyé par la requête doit produire sa propre alerte.
    - Les alertes d'un même compte générées pendant la période de regroupement doivent être regroupées dans un incident, même quand l'hôte diffère.

    Comment devez-vous configurer la règle ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Event grouping: [[eg]]

      Alert grouping: [[ag]]
    fr: |
      Regroupement d'événements : [[eg]]

      Regroupement d'alertes : [[ag]]
  slots:
    - id: eg
      options:
        - { id: single, text: { en: "Group all events into a single alert", fr: "Regrouper tous les événements dans une seule alerte" } }
        - { id: each, text: { en: "Trigger an alert for each event", fr: "Déclencher une alerte pour chaque événement" } }
    - id: ag
      options:
        - { id: rule, text: { en: "Group all alerts triggered by this rule into a single incident", fr: "Regrouper toutes les alertes déclenchées par cette règle dans un seul incident" } }
        - { id: allent, text: { en: "Group alerts into a single incident if all the entities match", fr: "Regrouper les alertes dans un seul incident si toutes les entités correspondent" } }
        - { id: selected, text: { en: "Group alerts into a single incident if the selected entities and details match, with Account selected", fr: "Regrouper les alertes dans un seul incident si les entités et détails sélectionnés correspondent, avec Account sélectionné" } }
answer:
  values: { eg: each, ag: selected }
explanation:
  correct:
    en: Trigger an alert for each event creates one alert per query result (up to 150 per run). Grouping on selected entities with only Account selected puts the alerts of the same account into one incident whatever the host. Requiring all entities to match would split alerts with different hosts.
    fr: Déclencher une alerte pour chaque événement crée une alerte par résultat de requête (jusqu'à 150 par exécution). Le regroupement sur les entités sélectionnées, avec seulement Account sélectionné, place les alertes d'un même compte dans un incident quel que soit l'hôte. Exiger la correspondance de toutes les entités séparerait les alertes dont l'hôte diffère.
  options:
    single: { en: "This default setting summarizes all the results of a run in one alert.", fr: "Ce paramètre par défaut résume tous les résultats d'une exécution dans une seule alerte." }
    rule: { en: "This would also merge the alerts of different accounts into the same incident.", fr: "Cela fusionnerait aussi les alertes de comptes différents dans le même incident." }
    allent: { en: "Both Account and Host would have to match, so alerts from different hosts would go to separate incidents.", fr: "Account et Host devraient tous deux correspondre : les alertes d'hôtes différents iraient dans des incidents distincts." }
references:
  - title: Scheduled analytics rules in Microsoft Sentinel
    url: https://learn.microsoft.com/en-us/azure/sentinel/scheduled-rules-overview
