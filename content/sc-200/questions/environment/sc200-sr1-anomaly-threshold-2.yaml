id: sc200-sr1-anomaly-threshold-2
objective: "1.4.5"
type: series_yesno
series: sc200-sr1-anomaly-threshold
seriesOrder: 2
difficulty: 1
status: draft
stem:
  en: You edit Anomaly1 and raise its threshold.
  fr: Vous modifiez Anomaly1 et augmentez son seuil.
body:
  solution:
    en: |
      On the **Anomalies** tab, you open Anomaly1, select **Edit**, raise the threshold in the rule parameters and save the rule.
    fr: |
      Dans l'onglet **Anomalies**, vous ouvrez Anomaly1, sélectionnez **Edit**, augmentez le seuil dans les paramètres de la règle et enregistrez la règle.
answer: { value: false }
explanation:
  correct:
    en: |
      Built-in anomaly rules cannot be edited; you can only switch them between Production and Flighting. Even if the threshold could be changed in place, the current configuration would disappear, so there would be nothing to compare and the SOC would no longer use it.
    fr: |
      Les règles d'anomalie intégrées ne peuvent pas être modifiées : vous pouvez seulement les faire passer de Production à Flighting et inversement. Même si le seuil pouvait être changé sur place, la configuration actuelle disparaîtrait : il n'y aurait rien à comparer et le SOC ne l'utiliserait plus.
references:
  - title: Work with anomaly detection analytics rules in Microsoft Sentinel
    url: https://learn.microsoft.com/en-us/azure/sentinel/work-with-anomaly-rules
