id: sc200-1c-cef-ordering
objective: "1.3.4"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    Proseware deploys a new Azure virtual machine named **LNX-FWD5** that runs Ubuntu, rsyslog and Python 3. LNX-FWD5 will receive CEF messages from Check Point firewalls for the Microsoft Sentinel workspace **law-proseware**. The network team will reconfigure the firewalls to send to LNX-FWD5 after you finish.

    You need to prepare the collection by using the Common Event Format (CEF) via AMA connector.

    Which three actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Proseware déploie une nouvelle machine virtuelle Azure nommée **LNX-FWD5** qui exécute Ubuntu, rsyslog et Python 3. LNX-FWD5 recevra les messages CEF de pare-feu Check Point pour l'espace de travail Microsoft Sentinel **law-proseware**. L'équipe réseau reconfigurera les pare-feu pour qu'ils envoient vers LNX-FWD5 une fois votre travail terminé.

    Vous devez préparer la collecte avec le connecteur Common Event Format (CEF) via AMA.

    Quelles sont les trois actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - { id: solution, text: { en: "Install the Common Event Format solution from the Content hub.", fr: "Installer la solution Common Event Format depuis le hub de contenu." } }
    - { id: dcr, text: { en: "On the connector page, create a data collection rule that targets LNX-FWD5 and sets the minimum log level of each facility.", fr: "Dans la page du connecteur, créer une règle de collecte de données qui cible LNX-FWD5 et définit le niveau de journal minimal de chaque facility." } }
    - { id: script, text: { en: "Run the Forwarder_AMA_installer.py script on LNX-FWD5.", fr: "Exécuter le script Forwarder_AMA_installer.py sur LNX-FWD5." } }
    - { id: arc, text: { en: "Onboard LNX-FWD5 to Azure Arc.", fr: "Intégrer LNX-FWD5 à Azure Arc." } }
    - { id: mma, text: { en: "Install the Log Analytics agent for Linux on LNX-FWD5.", fr: "Installer l'agent Log Analytics pour Linux sur LNX-FWD5." } }
    - { id: wec, text: { en: "Create a source-initiated subscription on LNX-FWD5.", fr: "Créer un abonnement initié par la source sur LNX-FWD5." } }
answer:
  sequence: [ solution, dcr, script ]
explanation:
  correct:
    en: The connector page appears after you install the Common Event Format solution from the Content hub. Creating the data collection rule installs the Azure Monitor Agent on the selected forwarder. Then you run the installation script, which configures rsyslog to listen on port 514 and restarts the daemon.
    fr: La page du connecteur apparaît une fois la solution Common Event Format installée depuis le hub de contenu. La création de la règle de collecte de données installe l'agent Azure Monitor sur le redirecteur sélectionné. Vous exécutez ensuite le script d'installation, qui configure rsyslog pour écouter sur le port 514 et redémarre le démon.
  options:
    arc:
      en: LNX-FWD5 is an Azure VM; only machines outside Azure need Azure Arc.
      fr: LNX-FWD5 est une machine virtuelle Azure ; seules les machines hors d'Azure ont besoin d'Azure Arc.
    mma:
      en: The Log Analytics agent is retired; the rule installs the Azure Monitor Agent.
      fr: L'agent Log Analytics est retiré ; la règle installe l'agent Azure Monitor.
    wec:
      en: Subscriptions belong to Windows Event Forwarding, not to a Linux log forwarder.
      fr: Les abonnements relèvent du transfert d'événements Windows, pas d'un redirecteur de journaux Linux.
references:
  - title: Ingest syslog and CEF messages to Microsoft Sentinel - AMA
    url: https://learn.microsoft.com/en-us/azure/sentinel/connect-cef-syslog-ama
