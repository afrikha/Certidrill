id: sc200-cs1b-keyvault-policy
objective: "1.3.5"
type: single
caseStudy: sc200-cs1b-city-power-light
difficulty: 2
status: draft
stem:
  en: |
    You need to meet the Key Vault requirement.

    What should you do?
  fr: |
    Vous devez respecter l'exigence relative à Key Vault.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Assign the connector's policy to each subscription and create a remediation task.", fr: "Attribuer la stratégie du connecteur à chaque abonnement et créer une tâche de correction." }
    - id: b
      text: { en: "Assign the connector's policy to each subscription without a remediation task.", fr: "Attribuer la stratégie du connecteur à chaque abonnement sans tâche de correction." }
    - id: c
      text: { en: "Add a diagnostic setting to each existing vault that sends its logs to LAW-CPL.", fr: "Ajouter à chaque coffre existant un paramètre de diagnostic qui envoie ses journaux à LAW-CPL." }
    - id: d
      text: { en: "Create a data collection rule that collects the vault logs with the Azure Monitor Agent.", fr: "Créer une règle de collecte de données qui collecte les journaux des coffres avec l'agent Azure Monitor." }
answer: { optionId: a }
explanation:
  correct:
    en: "A policy-managed connector applies one diagnostic settings configuration to all the resources of a type within the assignment scope. The assignment covers the vaults created later, and the Create a remediation task option applies the configuration to the vaults that already exist. You need the Owner role on each assignment scope."
    fr: "Un connecteur géré par Azure Policy applique une même configuration de paramètres de diagnostic à toutes les ressources d'un type dans l'étendue de l'attribution. L'attribution couvre les coffres créés ensuite, et l'option Créer une tâche de correction applique la configuration aux coffres qui existent déjà. Vous avez besoin du rôle Owner sur chaque étendue d'attribution."
  options:
    b: { en: "Without a remediation task, the policy applies only to vaults created after the assignment; the existing vaults would not send logs.", fr: "Sans tâche de correction, la stratégie ne s'applique qu'aux coffres créés après l'attribution : les coffres existants n'enverraient pas de journaux." }
    c: { en: "Manual diagnostic settings cover only the existing vaults, so every new vault would have to be configured by hand.", fr: "Des paramètres de diagnostic manuels ne couvrent que les coffres existants : chaque nouveau coffre devrait être configuré à la main." }
    d: { en: "The Azure Monitor Agent collects data from machines; Azure Key Vault resource logs are sent through diagnostic settings.", fr: "L'agent Azure Monitor collecte des données sur des machines ; les journaux de ressources d'Azure Key Vault sont envoyés par des paramètres de diagnostic." }
references:
  - title: Connect Microsoft Sentinel to other Microsoft services by using diagnostic settings-based connections
    url: https://learn.microsoft.com/en-us/azure/sentinel/connect-services-diagnostic-setting-based
