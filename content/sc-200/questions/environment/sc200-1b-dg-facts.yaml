id: sc200-1b-dg-facts
objective: "1.1.9"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    You are planning device groups in Microsoft Defender for Endpoint Plan 2 for Adatum Corporation.

    Which two statements are true?

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous planifiez des groupes d'appareils dans Microsoft Defender for Endpoint Plan 2 pour Adatum Corporation.

    Quelles sont les deux affirmations vraies ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "A device that matches the rules of several device groups is added to each of these groups.", fr: "Un appareil qui correspond aux règles de plusieurs groupes d'appareils est ajouté à chacun de ces groupes." } }
    - { id: b, text: { en: "Conditions on different properties of a matching rule, such as a tag and an OS platform, are combined with OR.", fr: "Les conditions portant sur des propriétés différentes d'une règle de correspondance, comme une étiquette et une plateforme de système d'exploitation, sont combinées avec OU." } }
    - { id: c, text: { en: "You can change the automation level of the Ungrouped devices group, but you can't delete the group.", fr: "Vous pouvez modifier le niveau d'automatisation du groupe Ungrouped devices, mais vous ne pouvez pas le supprimer." } }
    - { id: d, text: { en: "A tenant can contain up to 2,000 device groups.", fr: "Un locataire peut contenir jusqu'à 2 000 groupes d'appareils." } }
    - { id: e, text: { en: "The Preview devices page of the wizard lists every device that matches the rule.", fr: "La page Preview devices de l'assistant liste tous les appareils qui correspondent à la règle." } }
answer: { optionIds: [ c, d ] }
explanation:
  correct:
    en: |
      Ungrouped devices is the default group for devices that match no rule; you can't delete it or change its rank, but you can change its remediation level and user access. A tenant supports up to 2,000 device groups.
    fr: |
      Ungrouped devices est le groupe par défaut des appareils qui ne correspondent à aucune règle ; vous ne pouvez ni le supprimer ni changer son rang, mais vous pouvez modifier son niveau de correction et son accès utilisateur. Un locataire prend en charge jusqu'à 2 000 groupes d'appareils.
  options:
    a: { en: "A device that matches several groups joins only the highest-ranked group.", fr: "Un appareil qui correspond à plusieurs groupes ne rejoint que le groupe de rang le plus élevé." }
    b: { en: "A device must match all the conditions; only several values of the same property are combined with OR.", fr: "Un appareil doit remplir toutes les conditions ; seules plusieurs valeurs d'une même propriété sont combinées avec OU." }
    e: { en: "The preview shows up to 10 matching devices.", fr: "L'aperçu affiche jusqu'à 10 appareils correspondants." }
references:
  - title: Create and manage device groups in Microsoft Defender for Endpoint
    url: https://learn.microsoft.com/en-us/defender-endpoint/machine-groups
