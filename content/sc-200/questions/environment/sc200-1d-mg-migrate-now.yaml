id: sc200-1d-mg-migrate-now
objective: "1.4.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Contoso uses Microsoft Defender XDR. The SOC has 40 custom detection rules that use the **Every hour** frequency. Many of them query a single table with simple filters.

    You need every rule whose query is compatible with the Continuous (NRT) frequency to use that frequency. The solution must minimize administrative effort.

    What should you do?
  fr: |
    Contoso utilise Microsoft Defender XDR. Le SOC dispose de 40 règles de détection personnalisées qui utilisent la fréquence **Every hour**. Beaucoup d'entre elles interrogent une seule table avec des filtres simples.

    Chaque règle dont la requête est compatible avec la fréquence Continuous (NRT) doit utiliser cette fréquence. La solution doit réduire au minimum l'effort d'administration.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Open each rule with Edit, test whether Continuous (NRT) is accepted, and save the rule.", fr: "Ouvrir chaque règle avec Edit, vérifier si Continuous (NRT) est accepté, puis enregistrer la règle." } }
    - { id: b, text: { en: "Select Migrate now on the custom detection rules page, select the compatible rules, and save.", fr: "Sélectionner Migrate now sur la page des règles de détection personnalisées, sélectionner les règles compatibles, puis enregistrer." } }
    - { id: c, text: { en: "Recreate the rules as near-real-time (NRT) analytics rules in Microsoft Sentinel, then delete them.", fr: "Recréer les règles sous forme de règles d'analytique quasi en temps réel (NRT) dans Microsoft Sentinel, puis les supprimer." } }
    - { id: d, text: { en: "Select Run on each rule to reset its interval, then turn on Continuous (NRT) in the rule list.", fr: "Sélectionner Run sur chaque règle pour réinitialiser son intervalle, puis activer Continuous (NRT) dans la liste des règles." } }
answer: { optionId: b }
explanation:
  correct:
    en: Migrate now, on the custom detection rules page, lists the existing rules whose KQL is compatible with the Continuous (NRT) frequency. You can select all or some of them, and Save changes their frequency to Continuous (NRT) in one operation.
    fr: Migrate now, sur la page des règles de détection personnalisées, liste les règles existantes dont le KQL est compatible avec la fréquence Continuous (NRT). Vous pouvez toutes les sélectionner ou en sélectionner certaines, et Save change leur fréquence en Continuous (NRT) en une seule opération.
  options:
    a: { en: "Editing the rules one by one works but requires much more effort than the bulk migration.", fr: "Modifier les règles une par une fonctionne, mais demande bien plus d'effort que la migration groupée." }
    c: { en: "Recreating the rules in Sentinel is much more work, and Sentinel NRT rules are limited to 50 per customer.", fr: "Recréer les règles dans Sentinel demande beaucoup plus de travail, et les règles NRT de Sentinel sont limitées à 50 par client." }
    d: { en: "Run only executes a rule now; the rule list has no per-rule Continuous (NRT) switch.", fr: "Run ne fait qu'exécuter une règle immédiatement ; la liste des règles n'a pas de commutateur Continuous (NRT) par règle." }
references:
  - title: Create custom detection rules in Microsoft Defender XDR
    url: https://learn.microsoft.com/en-us/defender-xdr/custom-detection-rules
