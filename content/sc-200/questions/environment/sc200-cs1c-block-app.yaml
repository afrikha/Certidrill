id: sc200-cs1c-block-app
objective: "1.1.3"
type: multi
caseStudy: sc200-cs1c-tailwind-traders
difficulty: 3
status: draft
stem:
  en: |
    You need to meet the app blocking requirement.

    Which three actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez respecter l'exigence de blocage d'application.

    Quelles sont les trois actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 3
  options:
    - { id: enforce, text: { en: "In the Cloud Discovery settings of Defender for Cloud Apps, select Enforce app access for Microsoft Defender for Endpoint.", fr: "Dans les paramètres Cloud Discovery de Defender for Cloud Apps, sélectionner Enforce app access pour Microsoft Defender pour point de terminaison." } }
    - { id: indicators, text: { en: "In the Endpoints advanced features of the Defender portal, turn on Custom network indicators.", fr: "Dans les fonctionnalités avancées Endpoints du portail Defender, activer Custom network indicators." } }
    - { id: mdca, text: { en: "In the Endpoints advanced features of the Defender portal, turn on Microsoft Defender for Cloud Apps.", fr: "Dans les fonctionnalités avancées Endpoints du portail Defender, activer Microsoft Defender for Cloud Apps." } }
    - { id: unsanctioned, text: { en: "In Cloud Discovery, tag App1 as Unsanctioned.", fr: "Dans Cloud Discovery, attribuer la balise Unsanctioned à App1." } }
    - { id: monitored, text: { en: "In Cloud Discovery, tag App1 as Monitored.", fr: "Dans Cloud Discovery, attribuer la balise Monitored à App1." } }
    - { id: session, text: { en: "Create a Conditional Access App Control session policy that blocks access to App1.", fr: "Créer une stratégie de session Conditional Access App Control qui bloque l'accès à App1." } }
answer: { optionIds: [enforce, indicators, unsanctioned] }
explanation:
  correct:
    en: "Blocking discovered apps on endpoints needs two settings: Enforce app access in Defender for Cloud Apps, and Custom network indicators in the Defender for Endpoint advanced features so that network protection can block the URLs that Defender for Cloud Apps manages. Tagging App1 as Unsanctioned then syncs its domains to Defender for Endpoint as URL indicators, which Microsoft Defender Antivirus blocks on the devices. The other prerequisites (real-time protection, cloud-delivered protection and network protection in block mode) are already in place."
    fr: "Le blocage des applications découvertes sur les points de terminaison nécessite deux paramètres : Enforce app access dans Defender for Cloud Apps, et Custom network indicators dans les fonctionnalités avancées de Defender pour point de terminaison, pour que la protection du réseau puisse bloquer les URL gérées par Defender for Cloud Apps. L'attribution de la balise Unsanctioned à App1 synchronise ensuite ses domaines vers Defender pour point de terminaison sous forme d'indicateurs d'URL, que l'Antivirus Microsoft Defender bloque sur les appareils. Les autres prérequis (protection en temps réel, protection fournie par le cloud et protection du réseau en mode blocage) sont déjà en place."
  options:
    mdca: { en: "Cloud Discovery already receives data from Defender for Endpoint, so this integration is already on; it sends discovery data but does not block apps by itself.", fr: "Cloud Discovery reçoit déjà les données de Defender pour point de terminaison : cette intégration est déjà activée. Elle envoie des données de découverte, mais ne bloque pas d'applications à elle seule." }
    monitored: { en: "The Monitored tag only warns users, who can bypass the warning; it does not block App1.", fr: "La balise Monitored ne fait qu'avertir les utilisateurs, qui peuvent contourner l'avertissement ; elle ne bloque pas App1." }
    session: { en: "Session policies apply only to sessions routed through Conditional Access App Control; App1 is a discovered app that does not sign in through Microsoft Entra ID, so device traffic to it would not be blocked.", fr: "Les stratégies de session ne s'appliquent qu'aux sessions acheminées par Conditional Access App Control ; App1 est une application découverte qui ne s'authentifie pas par Microsoft Entra ID : le trafic des appareils vers elle ne serait pas bloqué." }
references:
  - title: Govern discovered apps using Microsoft Defender for Endpoint
    url: https://learn.microsoft.com/en-us/defender-cloud-apps/mde-govern
