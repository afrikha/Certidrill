id: sc200-1b-rt-statements
objective: "1.2.2"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    Wingtip Toys has a Microsoft Sentinel workspace onboarded to the Microsoft Defender portal and to the Microsoft Sentinel data lake. You are adjusting the retention of several analytics-tier tables.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Wingtip Toys dispose d'un espace de travail Microsoft Sentinel intégré au portail Microsoft Defender et au data lake Microsoft Sentinel. Vous ajustez la rétention de plusieurs tables du niveau Analytics.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          When you shorten the total retention of a table, the data beyond the new value is deleted immediately.
        fr: |
          Lorsque vous réduisez la rétention totale d'une table, les données au-delà de la nouvelle valeur sont supprimées immédiatement.
    - id: s2
      text:
        en: |
          When you increase the total retention of a table, the new value also applies to data that was already ingested and not yet removed.
        fr: |
          Lorsque vous augmentez la rétention totale d'une table, la nouvelle valeur s'applique aussi aux données déjà ingérées et pas encore supprimées.
    - id: s3
      text:
        en: |
          Analytics storage is free for the first 90 days in a workspace where Microsoft Sentinel is enabled.
        fr: |
          Le stockage Analytics est gratuit pendant les 90 premiers jours dans un espace de travail où Microsoft Sentinel est activé.
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: |
      After you shorten total retention, Microsoft waits 30 days before deleting the data, so you can revert a mistake. An increase applies to the data already ingested that hasn't been removed. Sentinel-enabled workspaces get 90 days of analytics storage at no charge.
    fr: |
      Après une réduction de la rétention totale, Microsoft attend 30 jours avant de supprimer les données, ce qui permet de revenir sur une erreur. Une augmentation s'applique aux données déjà ingérées qui n'ont pas été supprimées. Les espaces de travail où Sentinel est activé bénéficient de 90 jours de stockage Analytics gratuits.
references:
  - title: Manage data tiers and retention in Microsoft Sentinel
    url: https://learn.microsoft.com/en-us/azure/sentinel/manage-data-overview
