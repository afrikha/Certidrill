id: sc200-cs2a-security-events-xpath
objective: "1.3.2"
type: single
caseStudy: sc200-cs2a-fourth-coffee
difficulty: 2
status: draft
stem:
  en: |
    You need to configure the collection of Windows Security events from the 140 on-premises servers. The solution must meet the data collection requirements.

    What should you configure?
  fr: |
    Vous devez configurer la collecte des événements de sécurité Windows sur les 140 serveurs locaux. La solution doit respecter les exigences de collecte des données.

    Que devez-vous configurer ?
body:
  options:
    - { id: a, text: { en: "The Windows Security Events via AMA connector, with a DCR that uses the Minimal event set", fr: "Le connecteur Windows Security Events via AMA, avec une DCR qui utilise le jeu d'événements Minimal" } }
    - { id: b, text: { en: "The Windows Security Events via AMA connector, with a DCR that uses a Custom XPath query", fr: "Le connecteur Windows Security Events via AMA, avec une DCR qui utilise une requête XPath Custom" } }
    - { id: c, text: { en: "An Azure Monitor DCR with a Windows event logs data source and a Custom XPath query", fr: "Une DCR Azure Monitor avec une source de données Windows event logs et une requête XPath Custom" } }
    - { id: d, text: { en: "The Windows Forwarded Events connector, with a DCR that uses a Custom XPath query", fr: "Le connecteur Windows Forwarded Events, avec une DCR qui utilise une requête XPath Custom" } }
answer: { optionId: b }
explanation:
  correct:
    en: The Windows Security Events via AMA connector sends the events to the SecurityEvent table that the existing analytics rules query, and it works on Azure Arc-enabled servers. A Custom event set uses an XPath query, such as Security!*[System[(EventID=4624 or EventID=4625 or EventID=4688)]], so only the three required event IDs are ingested.
    fr: Le connecteur Windows Security Events via AMA envoie les événements dans la table SecurityEvent qu'interrogent les règles d'analytique existantes, et il fonctionne sur les serveurs Azure Arc. Un jeu d'événements Custom utilise une requête XPath, par exemple Security!*[System[(EventID=4624 or EventID=4625 or EventID=4688)]], pour n'ingérer que les trois ID d'événements requis.
  options:
    a: { en: "Minimal contains other events in addition to 4624, 4625 and 4688, which increases ingestion cost.", fr: "Minimal contient d'autres événements en plus de 4624, 4625 et 4688, ce qui augmente le coût d'ingestion." }
    c: { en: "A Windows event logs data source sends Security events to the Event table, not to SecurityEvent.", fr: "Une source de données Windows event logs envoie les événements de sécurité dans la table Event, pas dans SecurityEvent." }
    d: { en: "Windows Forwarded Events collects events from a Windows Event Forwarding collector into the WindowsEvent table; no WEF infrastructure exists.", fr: "Windows Forwarded Events collecte les événements d'un collecteur Windows Event Forwarding dans la table WindowsEvent ; aucune infrastructure WEF n'existe." }
references:
  - title: Windows security event sets that can be sent to Microsoft Sentinel
    url: https://learn.microsoft.com/en-us/azure/sentinel/windows-security-event-id-reference
  - title: Collect Windows events from virtual machines with Azure Monitor Agent
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/vm/data-collection-windows-events
