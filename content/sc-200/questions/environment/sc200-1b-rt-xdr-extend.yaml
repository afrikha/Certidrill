id: sc200-1b-rt-xdr-extend
objective: "1.2.2"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    Proseware, Inc. uses Microsoft Defender XDR and has onboarded Microsoft Sentinel to the Defender portal and to the Microsoft Sentinel data lake. The **EmailEvents** table uses its default retention.

    Proseware has the following requirements for EmailEvents:

    - Custom detection rules and threat hunting must be able to use the last 90 days of data with fast queries.
    - The data must be kept for one year in total.
    - Cost must be minimized.

    How should you configure EmailEvents, and what is the cost effect? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware, Inc. utilise Microsoft Defender XDR et a intégré Microsoft Sentinel au portail Defender et au data lake Microsoft Sentinel. La table **EmailEvents** utilise sa rétention par défaut.

    Proseware a les exigences suivantes pour EmailEvents :

    - Les règles de détection personnalisées et le repérage des menaces doivent pouvoir utiliser les 90 derniers jours de données avec des requêtes rapides.
    - Les données doivent être conservées un an au total.
    - Le coût doit être réduit au minimum.

    Comment devez-vous configurer EmailEvents, et quel est l'effet sur les coûts ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Analytics retention: [[ar]]

      Total retention: [[tr]]

      Cost effect: [[cost]]
    fr: |
      Rétention Analytics : [[ar]]

      Rétention totale : [[tr]]

      Effet sur les coûts : [[cost]]
  slots:
    - id: ar
      options:
        - { id: d30, text: { en: "30 days", fr: "30 jours" } }
        - { id: d90, text: { en: "90 days", fr: "90 jours" } }
        - { id: d180, text: { en: "180 days", fr: "180 jours" } }
        - { id: y1, text: { en: "1 year", fr: "1 an" } }
    - id: tr
      options:
        - { id: d90, text: { en: "90 days", fr: "90 jours" } }
        - { id: d180, text: { en: "180 days", fr: "180 jours" } }
        - { id: y1, text: { en: "1 year", fr: "1 an" } }
        - { id: y2, text: { en: "2 years", fr: "2 ans" } }
    - id: cost
      options:
        - { id: none, text: { en: "No additional cost, because XDR data is included in the Defender license", fr: "Aucun coût supplémentaire, car les données XDR sont incluses dans la licence Defender" } }
        - { id: ingest, text: { en: "Sentinel ingestion is billed; analytics storage is free up to 90 days", fr: "L'ingestion Sentinel est facturée ; le stockage Analytics est gratuit jusqu'à 90 jours" } }
        - { id: storage, text: { en: "Only analytics storage beyond 30 days is billed; ingestion is free", fr: "Seul le stockage Analytics au-delà de 30 jours est facturé ; l'ingestion est gratuite" } }
answer:
  values: { ar: d90, tr: y1, cost: ingest }
explanation:
  correct:
    en: |
      Setting analytics retention above the 30-day default ingests the XDR table into the Sentinel workspace, which is billed as Sentinel ingestion, while storage up to 90 days is free. Analytics retention of 90 days meets the fast-query need, and total retention of one year keeps the rest in the low-cost data lake.
    fr: |
      Définir une rétention Analytics supérieure aux 30 jours par défaut ingère la table XDR dans l'espace de travail Sentinel, ce qui est facturé comme une ingestion Sentinel, tandis que le stockage jusqu'à 90 jours est gratuit. Une rétention Analytics de 90 jours répond au besoin de requêtes rapides, et une rétention totale d'un an conserve le reste dans le data lake à bas coût.
  options:
    d30: { en: "30 days is the XDR default and doesn't cover the 90-day requirement.", fr: "30 jours est la valeur XDR par défaut et ne couvre pas l'exigence de 90 jours." }
    d180: { en: "More analytics retention than required adds analytics storage cost beyond 90 days.", fr: "Plus de rétention Analytics que nécessaire ajoute un coût de stockage Analytics au-delà de 90 jours." }
    none: { en: "Only the 30-day XDR default tier is included in the Defender license.", fr: "Seul le niveau XDR par défaut de 30 jours est inclus dans la licence Defender." }
    storage: { en: "Extending an XDR table beyond 30 days in the analytics tier ingests it into Sentinel, and that ingestion is billed.", fr: "Prolonger une table XDR au-delà de 30 jours au niveau Analytics l'ingère dans Sentinel, et cette ingestion est facturée." }
references:
  - title: Manage data tiers and retention in Microsoft Sentinel
    url: https://learn.microsoft.com/en-us/azure/sentinel/manage-data-overview
