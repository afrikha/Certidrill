id: sc200-cs3c-activity-policy
objective: "1.3.5"
type: ordering
caseStudy: sc200-cs3c-relecloud
difficulty: 2
status: draft
stem:
  en: |
    The Azure Activity solution is installed in law-rc-sec from the Content hub.

    You need to meet the activity logs requirement.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    La solution Azure Activity est installée dans law-rc-sec depuis le hub de contenu.

    Vous devez respecter l'exigence relative aux journaux d'activité.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: wizard, text: { en: "On the Azure Activity connector page, select Launch Azure Policy Assignment wizard.", fr: "Dans la page du connecteur Azure Activity, sélectionner Launch Azure Policy Assignment wizard." } }
    - { id: scope, text: { en: "On the Basics tab, set the scope to MG-Prod.", fr: "Dans l'onglet Basics, définir l'étendue sur MG-Prod." } }
    - { id: workspace, text: { en: "On the Parameters tab, select law-rc-sec as the Log Analytics workspace.", fr: "Dans l'onglet Parameters, sélectionner law-rc-sec comme espace de travail Log Analytics." } }
    - { id: remediation, text: { en: "On the Remediation tab, select Create a remediation task.", fr: "Dans l'onglet Remediation, sélectionner Create a remediation task." } }
    - { id: diag, text: { en: "In each subscription, add a diagnostic setting that sends the activity log to law-rc-sec.", fr: "Dans chaque abonnement, ajouter un paramètre de diagnostic qui envoie le journal d'activité à law-rc-sec." } }
    - { id: ama, text: { en: "Install the Azure Monitor Agent on one virtual machine in each subscription.", fr: "Installer l'agent Azure Monitor sur une machine virtuelle de chaque abonnement." } }
    - { id: role, text: { en: "Assign the Microsoft Sentinel Automation Contributor role on MG-Prod.", fr: "Attribuer le rôle Microsoft Sentinel Automation Contributor sur MG-Prod." } }
answer:
  sequence: [wizard, scope, workspace, remediation]
explanation:
  correct:
    en: |
      The Azure Activity connector uses Azure Policy to apply one diagnostic settings configuration to every subscription in a scope. You launch the assignment wizard from the connector page, set the scope on the Basics tab, select the workspace on the Parameters tab and create a remediation task so that the 14 existing subscriptions are configured too; new subscriptions in MG-Prod are covered by the policy automatically. Your Owner role on MG-Prod meets the permission needed for the assignment.
    fr: |
      Le connecteur Azure Activity utilise Azure Policy pour appliquer une même configuration de paramètres de diagnostic à tous les abonnements d'une étendue. Vous lancez l'Assistant d'attribution depuis la page du connecteur, définissez l'étendue dans l'onglet Basics, sélectionnez l'espace de travail dans l'onglet Parameters et créez une tâche de correction pour que les 14 abonnements existants soient aussi configurés ; les nouveaux abonnements de MG-Prod sont couverts automatiquement par la stratégie. Votre rôle Owner sur MG-Prod fournit l'autorisation nécessaire à l'attribution.
  options:
    diag: { en: "Manual diagnostic settings do not cover future subscriptions and increase administrative effort.", fr: "Des paramètres de diagnostic manuels ne couvrent pas les futurs abonnements et augmentent l'effort d'administration." }
    ama: { en: "The activity log is a platform log sent by diagnostic settings; no agent is involved.", fr: "Le journal d'activité est un journal de plateforme envoyé par des paramètres de diagnostic ; aucun agent n'intervient." }
    role: { en: "Microsoft Sentinel Automation Contributor lets Microsoft Sentinel attach playbooks to automation rules; it has nothing to do with log collection.", fr: "Microsoft Sentinel Automation Contributor permet à Microsoft Sentinel d'ajouter des playbooks aux règles d'automatisation ; il n'a aucun rapport avec la collecte des journaux." }
references:
  - title: Connect Microsoft Sentinel to other Microsoft services by using diagnostic settings-based connections
    url: https://learn.microsoft.com/en-us/azure/sentinel/connect-services-diagnostic-setting-based
