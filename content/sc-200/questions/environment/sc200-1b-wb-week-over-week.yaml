id: sc200-1b-wb-week-over-week
objective: "1.2.3"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    Proseware, Inc. uses Microsoft Sentinel. You are adding a step to a workbook that compares the daily number of Windows security events of this week with last week. Both weeks must appear as two lines on the same seven-day axis.

    How should you complete the query? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware, Inc. utilise Microsoft Sentinel. Vous ajoutez à un classeur une étape qui compare le nombre quotidien d'événements de sécurité Windows de cette semaine avec celui de la semaine dernière. Les deux semaines doivent apparaître sous forme de deux lignes sur le même axe de sept jours.

    Comment devez-vous compléter la requête ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: kusto
  template: |
    SecurityEvent
    | where TimeGenerated > ago(14d)
    | summarize count() by bin(TimeGenerated, [[bin]])
    | extend Week = [[fn]](TimeGenerated > ago(7d), "This Week", "Last Week"),
        TimeGenerated = iff(TimeGenerated > ago(7d), TimeGenerated, TimeGenerated [[op]] 7d)
  slots:
    - id: bin
      options:
        - { id: h1, text: 1h }
        - { id: d1, text: 1d }
        - { id: d7, text: 7d }
    - id: fn
      options:
        - { id: iff, text: iff }
        - { id: coalesce, text: coalesce }
        - { id: isnotempty, text: isnotempty }
    - id: op
      options:
        - { id: minus, text: "-" }
        - { id: plus, text: "+" }
        - { id: mult, text: "*" }
answer:
  values: { bin: d1, fn: iff, op: plus }
explanation:
  correct:
    en: |
      bin(TimeGenerated, 1d) gives one point per day. iff() labels each day as This Week or Last Week. Adding 7d to last week's timestamps shifts them onto this week's axis, so the two series overlap day by day, as in the week-over-week example of Microsoft's workbook documentation.
    fr: |
      bin(TimeGenerated, 1d) donne un point par jour. iff() étiquette chaque jour comme This Week ou Last Week. Ajouter 7d aux horodatages de la semaine dernière les décale sur l'axe de cette semaine : les deux séries se superposent jour par jour, comme dans l'exemple semaine par semaine de la documentation des classeurs de Microsoft.
  options:
    h1: { en: "1h produces hourly points, not daily counts.", fr: "1h produit des points horaires, pas des comptes quotidiens." }
    d7: { en: "7d produces a single point per week.", fr: "7d produit un seul point par semaine." }
    coalesce: { en: "coalesce returns the first non-empty value; it doesn't evaluate a condition.", fr: "coalesce renvoie la première valeur non vide ; il n'évalue pas de condition." }
    isnotempty: { en: "isnotempty takes one argument and returns a Boolean, not a label.", fr: "isnotempty prend un argument et renvoie un booléen, pas une étiquette." }
    minus: { en: "Subtracting 7d moves last week further into the past, so the lines don't overlap.", fr: "Soustraire 7d éloigne encore la semaine dernière dans le passé : les lignes ne se superposent pas." }
references:
  - title: Visualize your data by using workbooks in Microsoft Sentinel
    url: https://learn.microsoft.com/en-us/azure/sentinel/monitor-your-data
