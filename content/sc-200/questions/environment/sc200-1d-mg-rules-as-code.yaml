id: sc200-1d-mg-rules-as-code
objective: "1.4.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Tailspin uses Microsoft Defender XDR. The SOC maintains about 60 custom detection rules that run on Defender XDR tables at different frequencies.

    Every Monday, the SOC lead must review only the custom detection rules whose most recent execution didn't complete successfully. The solution must minimize administrative effort.

    What should you do?
  fr: |
    Tailspin utilise Microsoft Defender XDR. Le SOC gère environ 60 règles de détection personnalisées qui s'exécutent sur des tables Defender XDR à des fréquences différentes.

    Chaque lundi, le responsable du SOC doit examiner uniquement les règles de détection personnalisées dont la dernière exécution ne s'est pas terminée correctement. La solution doit réduire au minimum l'effort d'administration.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "In Custom detection rules, select Run on each rule and check which ones return an error.", fr: "Dans les règles de détection personnalisées, sélectionner Run sur chaque règle et vérifier lesquelles renvoient une erreur." } }
    - { id: b, text: { en: "In Advanced hunting, query AlertInfo for the alerts raised by custom detections during the last week.", fr: "Dans le repérage avancé, interroger AlertInfo pour obtenir les alertes générées par les détections personnalisées pendant la dernière semaine." } }
    - { id: c, text: { en: "In Custom detection rules, use Add filter on the Last run status column and keep the failed value.", fr: "Dans les règles de détection personnalisées, utiliser Add filter sur la colonne Last run status et conserver la valeur d'échec." } }
    - { id: d, text: { en: "In the Action center, open the History tab and filter the actions by the custom detection source.", fr: "Dans le centre de notifications, ouvrir l'onglet Historique et filtrer les actions sur la source des détections personnalisées." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      The Custom detection rules list shows Last run, Last run status, Next run and Status for each rule. Last run status tells whether a custom detection rule ran successfully, and Add filter lets you keep only the values you select, so one filtered view lists the failed rules.
    fr: |
      La liste des règles de détection personnalisées affiche Last run, Last run status, Next run et Status pour chaque règle. Last run status indique si une règle de détection personnalisée s'est exécutée correctement, et Add filter permet de ne conserver que les valeurs choisies : une seule vue filtrée liste donc les règles en échec.
  options:
    a: { en: "Run executes a rule immediately and resets the interval for its next run; doing it for 60 rules every week changes their schedule and takes far more effort.", fr: "Run exécute une règle immédiatement et réinitialise l'intervalle de sa prochaine exécution ; le faire pour 60 règles chaque semaine modifie leur planification et demande bien plus d'effort." }
    b: { en: "AlertInfo lists the alerts that rules raised; a rule that failed or found no match raises no alert, so the query can't tell them apart.", fr: "AlertInfo liste les alertes générées par les règles ; une règle en échec ou sans correspondance ne génère aucune alerte, la requête ne peut donc pas les distinguer." }
    d: { en: "The Action center tracks remediation actions, such as those taken by rules, not the execution status of the rules.", fr: "Le centre de notifications suit les actions de correction, comme celles prises par les règles, pas l'état d'exécution des règles." }
references:
  - title: Manage existing custom detection rules
    url: https://learn.microsoft.com/en-us/defender-xdr/custom-detection-manage
