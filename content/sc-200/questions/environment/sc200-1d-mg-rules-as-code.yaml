id: sc200-1d-mg-rules-as-code
objective: "1.4.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Tailspin uses Microsoft Defender XDR and has onboarded a Microsoft Sentinel workspace to the Microsoft Defender portal. The SOC maintains about 60 custom detection rules.

    The SOC wants to store the definitions of the custom detection rules in a GitHub repository, review changes through pull requests, and have approved changes synchronized to the tenant automatically.

    What should you use?
  fr: |
    Tailspin utilise Microsoft Defender XDR et a intégré un espace de travail Microsoft Sentinel au portail Microsoft Defender. Le SOC gère environ 60 règles de détection personnalisées.

    Le SOC veut stocker les définitions des règles de détection personnalisées dans un référentiel GitHub, examiner les modifications par des demandes de tirage (pull requests) et faire synchroniser automatiquement les modifications approuvées avec le locataire.

    Que devez-vous utiliser ?
body:
  options:
    - { id: a, text: { en: "Shared queries in Advanced hunting, linked to the GitHub repository", fr: "Des requêtes partagées dans le repérage avancé, liées au référentiel GitHub" } }
    - { id: b, text: { en: "A Content hub solution that packages the rules, installed in the workspace", fr: "Une solution du hub de contenu qui regroupe les règles, installée dans l'espace de travail" } }
    - { id: c, text: { en: "An Azure Policy initiative that deploys the rules, assigned to the subscription", fr: "Une initiative Azure Policy qui déploie les règles, attribuée à l'abonnement" } }
    - { id: d, text: { en: "The Microsoft Security Bicep extension, deployed through Microsoft Sentinel Repositories", fr: "L'extension Bicep Microsoft Security, déployée par Microsoft Sentinel Repositories" } }
answer: { optionId: d }
explanation:
  correct:
    en: Custom detection rules can be managed as code (preview) in a GitHub or Azure DevOps repository by using the Microsoft Security Bicep extension. Deploying them through Microsoft Sentinel Repositories keeps the tenant synchronized automatically with the repository; the Bicep CLI can be used instead in custom pipelines.
    fr: Les règles de détection personnalisées peuvent être gérées sous forme de code (préversion) dans un référentiel GitHub ou Azure DevOps avec l'extension Bicep Microsoft Security. Leur déploiement par Microsoft Sentinel Repositories synchronise automatiquement le locataire avec le référentiel ; Bicep CLI peut être utilisé à la place dans des pipelines personnalisés.
  options:
    a: { en: "Shared queries are saved hunting queries; they are not detection rules and cannot be synchronized from a repository.", fr: "Les requêtes partagées sont des requêtes de repérage enregistrées ; ce ne sont pas des règles de détection et elles ne peuvent pas être synchronisées depuis un référentiel." }
    c: { en: "Azure Policy governs Azure resources; it does not deploy Defender XDR custom detection rules from a repository.", fr: "Azure Policy régit les ressources Azure ; il ne déploie pas de règles de détection personnalisées Defender XDR depuis un référentiel." }
    b: { en: "Content hub solutions install vendor content; they do not provide a pull request workflow with automatic synchronization of your own rules.", fr: "Les solutions du hub de contenu installent du contenu d'éditeurs ; elles n'offrent pas de flux de demandes de tirage avec synchronisation automatique de vos propres règles." }
references:
  - title: Custom detections overview
    url: https://learn.microsoft.com/en-us/defender-xdr/custom-detections-overview
