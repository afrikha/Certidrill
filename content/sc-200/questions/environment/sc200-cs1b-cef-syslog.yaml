id: sc200-cs1b-cef-syslog
objective: "1.3.4"
type: yesno_statements
caseStudy: sc200-cs1b-city-power-light
difficulty: 2
status: draft
stem:
  en: |
    You plan to meet the ingestion requirement by configuring the Common Event Format (CEF) via AMA and Syslog via AMA connectors on LNX-FWD1. You do not change the configuration of the firewalls or the OT gateways.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous prévoyez de respecter l'exigence d'ingestion en configurant les connecteurs Common Event Format (CEF) via AMA et Syslog via AMA sur LNX-FWD1. Vous ne modifiez pas la configuration des pare-feu ni des passerelles OT.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: The firewall events collected by the CEF via AMA connector are stored in the CommonSecurityLog table.
        fr: Les événements de pare-feu collectés par le connecteur CEF via AMA sont stockés dans la table CommonSecurityLog.
    - id: s2
      text:
        en: You must install the Azure Monitor Agent on each OT gateway to collect its messages.
        fr: Vous devez installer l'agent Azure Monitor sur chaque passerelle OT pour collecter ses messages.
    - id: s3
      text:
        en: The same firewall events might be ingested into both the CommonSecurityLog and Syslog tables.
        fr: Les mêmes événements de pare-feu risquent d'être ingérés à la fois dans la table CommonSecurityLog et dans la table Syslog.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: "CEF messages collected by the CEF via AMA connector go to the CommonSecurityLog table, and Syslog messages go to the Syslog table. The Azure Monitor Agent runs on the Linux log forwarder, LNX-FWD1, which receives the messages of the other devices, so nothing is installed on the OT gateways. Because the firewalls and the OT gateways use the same facility (local4), the CEF messages also match the Syslog collection and can be ingested twice; to avoid this, use different facilities or add a transformation that filters CEF out of the Syslog stream."
    fr: "Les messages CEF collectés par le connecteur CEF via AMA vont dans la table CommonSecurityLog, et les messages Syslog dans la table Syslog. L'agent Azure Monitor s'exécute sur le redirecteur de journaux Linux, LNX-FWD1, qui reçoit les messages des autres appareils : rien n'est installé sur les passerelles OT. Comme les pare-feu et les passerelles OT utilisent la même facility (local4), les messages CEF correspondent aussi à la collecte Syslog et peuvent être ingérés deux fois ; pour l'éviter, utilisez des facilities différentes ou ajoutez une transformation qui exclut le CEF du flux Syslog."
references:
  - title: Syslog and CEF AMA connectors - Microsoft Sentinel
    url: https://learn.microsoft.com/en-us/azure/sentinel/cef-syslog-ama-overview
