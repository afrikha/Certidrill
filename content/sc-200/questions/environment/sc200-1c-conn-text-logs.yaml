id: sc200-1c-conn-text-logs
objective: "1.3.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Litware runs a legacy billing application on Windows Server virtual machines in Azure. The application writes its security events to text files in **C:\Billing\Logs** instead of the Windows event logs. The application can't be modified.

    You need to ingest the content of these files into a custom table of the Microsoft Sentinel workspace **law-litware**.

    Which data connector should you use?
  fr: |
    Litware exécute une application de facturation ancienne sur des machines virtuelles Windows Server dans Azure. L'application écrit ses événements de sécurité dans des fichiers texte de **C:\Billing\Logs** au lieu des journaux d'événements Windows. L'application ne peut pas être modifiée.

    Vous devez ingérer le contenu de ces fichiers dans une table personnalisée de l'espace de travail Microsoft Sentinel **law-litware**.

    Quel connecteur de données devez-vous utiliser ?
body:
  options:
    - { id: a, text: Windows Security Events via AMA }
    - { id: b, text: Windows Forwarded Events }
    - { id: c, text: Custom Logs via AMA }
    - { id: d, text: Syslog via AMA }
answer: { optionId: c }
explanation:
  correct:
    en: Custom Logs via AMA collects text log files written by applications on Windows or Linux machines. You first create the destination table, whose name ends with `_CL`, and then a data collection rule with the file pattern; the Azure Monitor Agent is installed on the selected machines when the rule is deployed.
    fr: Custom Logs via AMA collecte les fichiers journaux texte écrits par des applications sur des machines Windows ou Linux. Vous créez d'abord la table de destination, dont le nom se termine par `_CL`, puis une règle de collecte de données avec le modèle de fichier ; l'agent Azure Monitor est installé sur les machines sélectionnées lors du déploiement de la règle.
  options:
    a:
      en: This connector reads the Security and AppLocker event logs, not text files.
      fr: Ce connecteur lit les journaux d'événements Sécurité et AppLocker, pas des fichiers texte.
    b:
      en: Windows Forwarded Events reads the events that a Windows Event Collector receives, not text files.
      fr: Windows Forwarded Events lit les événements reçus par un collecteur d'événements Windows, pas des fichiers texte.
    d:
      en: Syslog via AMA collects Syslog messages through a Linux machine; the application doesn't write Syslog and doesn't run on Linux.
      fr: Syslog via AMA collecte des messages Syslog par une machine Linux ; l'application n'écrit pas de Syslog et ne s'exécute pas sous Linux.
references:
  - title: Collect logs from text files with the Azure Monitor Agent and ingest to Microsoft Sentinel - AMA
    url: https://learn.microsoft.com/en-us/azure/sentinel/connect-custom-logs-ama
