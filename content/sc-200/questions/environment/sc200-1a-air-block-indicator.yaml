id: sc200-1a-air-block-indicator
objective: "1.1.7"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Northwind Traders uses Microsoft Defender XDR and Microsoft Defender for Endpoint Plan 2, with full automation on all device groups. Automated investigations keep returning the verdict **No threats found** for a file named **helper.dll**, which your threat intelligence team has confirmed as malicious.

    You need automated investigation and response to treat helper.dll as malicious and remediate it.

    What should you do?
  fr: |
    Northwind Traders utilise Microsoft Defender XDR et Microsoft Defender pour point de terminaison Plan 2, avec l'automatisation complète sur tous les groupes d'appareils. Les enquêtes automatisées renvoient sans cesse le verdict **No threats found** pour un fichier nommé **helper.dll**, que votre équipe de renseignement sur les menaces a confirmé comme malveillant.

    Vous devez faire en sorte que l'enquête et la réponse automatisées traitent helper.dll comme malveillant et le corrigent.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Add the folder of helper.dll to the automation folder exclusions.", fr: "Ajouter le dossier de helper.dll aux exclusions de dossiers d'automatisation." }
    - id: b
      text: { en: "Create an alert tuning rule that resolves the alerts about helper.dll.", fr: "Créer une règle de réglage des alertes qui résout les alertes concernant helper.dll." }
    - id: c
      text: { en: "Set the device groups to Semi - require approval for all folders.", fr: "Définir les groupes d'appareils à Semi - require approval for all folders." }
    - id: d
      text: { en: "Create a file indicator for helper.dll with the Block and remediate action.", fr: "Créer un indicateur de fichier pour helper.dll avec l'action Block and remediate." }
answer: { optionId: d }
explanation:
  correct:
    en: Automated investigation and remediation honors the indicator list. A **Block** indicator makes AIR treat the item as bad, whereas an **Allow** indicator makes it ignore a bad verdict. With full automation, the remediation then runs automatically.
    fr: L'enquête et la correction automatisées respectent la liste des indicateurs. Un indicateur **Block** fait traiter l'élément comme malveillant par AIR, alors qu'un indicateur **Allow** lui fait ignorer un verdict défavorable. Avec l'automatisation complète, la correction s'exécute ensuite automatiquement.
  options:
    a:
      en: An automation folder exclusion makes automated investigations ignore the folder, the opposite of the requirement.
      fr: Une exclusion de dossier d'automatisation fait ignorer le dossier par les enquêtes automatisées, ce qui est l'inverse de l'exigence.
    b:
      en: Resolving alerts hides the problem; it doesn't change the verdict on the file.
      fr: Résoudre les alertes masque le problème ; cela ne change pas le verdict sur le fichier.
    c:
      en: The automation level decides whether remediation needs approval, not the verdict; a file judged clean is not remediated at any level.
      fr: Le niveau d'automatisation décide si la correction exige une approbation, pas le verdict ; un fichier jugé sain n'est corrigé à aucun niveau.
references:
  - title: Overview of indicators in Microsoft Defender for Endpoint
    url: https://learn.microsoft.com/en-us/defender-endpoint/indicators-overview
