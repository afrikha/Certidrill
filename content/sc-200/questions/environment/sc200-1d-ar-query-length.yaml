id: sc200-1d-ar-query-length
objective: "1.4.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Proseware has a Microsoft Sentinel workspace. An analyst wrote a detection query of about 14,000 characters that parses several firewall formats and then applies the detection logic. The query returns the expected results in **Logs**.

    When you paste the query into a new scheduled analytics rule, the rule fails validation. The detection logic must stay the same.

    What should you do?
  fr: |
    Proseware dispose d'un espace de travail Microsoft Sentinel. Un analyste a écrit une requête de détection d'environ 14 000 caractères qui analyse plusieurs formats de pare-feu, puis applique la logique de détection. La requête renvoie les résultats attendus dans **Journaux**.

    Quand vous collez la requête dans une nouvelle règle d'analytique planifiée, la validation de la règle échoue. La logique de détection doit rester la même.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Save the parsing part as a user-defined function, and call the function from the rule query.", fr: "Enregistrer la partie d'analyse comme fonction définie par l'utilisateur, puis appeler la fonction depuis la requête de la règle." } }
    - { id: b, text: { en: "Set Event grouping to Trigger an alert for each event so that each result is processed separately.", fr: "Définir le regroupement d'événements sur Déclencher une alerte pour chaque événement afin que chaque résultat soit traité séparément." } }
    - { id: c, text: { en: "Replace the list of firewall tables with search * to shorten the rule query.", fr: "Remplacer la liste des tables de pare-feu par search * pour raccourcir la requête de la règle." } }
    - { id: d, text: { en: "Set the lookback period of the rule to 14 days so that the query can run to completion.", fr: "Définir la période de recherche de la règle à 14 jours pour que la requête puisse s'exécuter entièrement." } }
answer: { optionId: a }
explanation:
  correct:
    en: An analytics rule query must be between 1 and 10,000 characters. Moving part of the logic into a user-defined function, such as a parser, works around the limit while keeping the same results.
    fr: La requête d'une règle d'analytique doit comporter entre 1 et 10 000 caractères. Déplacer une partie de la logique dans une fonction définie par l'utilisateur, par exemple un analyseur, contourne la limite tout en conservant les mêmes résultats.
  options:
    b: { en: "Event grouping changes how results become alerts; it does not change the maximum length of the query.", fr: "Le regroupement d'événements change la façon dont les résultats deviennent des alertes ; il ne change pas la longueur maximale de la requête." }
    c: { en: "Analytics rule queries cannot contain search * or union *.", fr: "Les requêtes des règles d'analytique ne peuvent pas contenir search * ni union *." }
    d: { en: "The lookback period does not change the maximum length of the query.", fr: "La période de recherche ne change pas la longueur maximale de la requête." }
references:
  - title: Scheduled analytics rules in Microsoft Sentinel
    url: https://learn.microsoft.com/en-us/azure/sentinel/scheduled-rules-overview
