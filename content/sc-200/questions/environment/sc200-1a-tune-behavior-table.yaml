id: sc200-1a-tune-behavior-table
objective: "1.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam, Inc. uses Microsoft Defender XDR. To reduce noise, you created an alert tuning rule that uses the **Set as behavior** action for a Defender for Endpoint alert raised by an internal deployment tool.

    The threat hunting team must still review these signals each week by using advanced hunting.

    Which table should the team query?
  fr: |
    Fabrikam, Inc. utilise Microsoft Defender XDR. Pour réduire le bruit, vous avez créé une règle de réglage des alertes qui utilise l'action **Set as behavior** pour une alerte Defender pour point de terminaison générée par un outil de déploiement interne.

    L'équipe de chasse aux menaces doit toujours examiner ces signaux chaque semaine avec le repérage avancé.

    Quelle table l'équipe doit-elle interroger ?
body:
  options:
    - { id: a, text: AlertInfo }
    - { id: b, text: DeviceEvents }
    - { id: c, text: BehaviorInfo }
    - { id: d, text: AlertEvidence }
answer: { optionId: c }
explanation:
  correct:
    en: The **Set as behavior** action converts matching signals into behaviors. They don't appear in the alert queue and don't create incidents, but their data remains in the `BehaviorInfo` and `BehaviorEntities` tables for hunting.
    fr: L'action **Set as behavior** transforme les signaux correspondants en comportements. Ils n'apparaissent pas dans la file d'alertes et ne créent pas d'incidents, mais leurs données restent dans les tables `BehaviorInfo` et `BehaviorEntities` pour la chasse.
  options:
    a:
      en: "`AlertInfo` keeps the alerts suppressed with Hide alert; signals set as behaviors are no longer alerts."
      fr: "`AlertInfo` conserve les alertes supprimées avec Hide alert ; les signaux transformés en comportements ne sont plus des alertes."
    b:
      en: "`DeviceEvents` contains raw device events such as antivirus or exploit protection events, not the behaviors produced by a tuning rule."
      fr: "`DeviceEvents` contient des événements bruts des appareils, comme les événements de l'antivirus ou de la protection contre les codes malveillants exploitant une faille, pas les comportements produits par une règle de réglage."
    d:
      en: "`AlertEvidence` holds the entities of alerts, including hidden ones, not behaviors."
      fr: "`AlertEvidence` contient les entités des alertes, y compris des alertes masquées, pas les comportements."
references:
  - title: Investigate alerts in Microsoft Defender XDR
    url: https://learn.microsoft.com/en-us/defender-xdr/investigate-alerts
