id: sc200-1a-tune-behavior-table
objective: "1.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam, Inc. uses Microsoft Defender XDR and Microsoft Defender for Endpoint Plan 2. A built-in alert tuning rule suppressed a Defender for Endpoint alert raised on a device named DEV-12, and no incident was created.

    The next morning, the same alert appears as active in the alert queue and is part of an incident. Nobody changed the alert tuning rules or the device groups.

    What is the most likely cause?
  fr: |
    Fabrikam, Inc. utilise Microsoft Defender XDR et Microsoft Defender pour point de terminaison Plan 2. Une règle de réglage des alertes intégrée a supprimé une alerte Defender pour point de terminaison générée sur un appareil nommé DEV-12, et aucun incident n'a été créé.

    Le lendemain matin, la même alerte apparaît comme active dans la file d'alertes et fait partie d'un incident. Personne n'a modifié les règles de réglage des alertes ni les groupes d'appareils.

    Quelle est la cause la plus probable ?
body:
  options:
    - { id: a, text: { en: "An email notification rule for incidents covers DEV-12, so the alert was restored to be notified.", fr: "Une règle de notification par e-mail des incidents couvre DEV-12 : l'alerte a donc été restaurée pour être notifiée." } }
    - { id: b, text: { en: "A correlated alert from another workload joined the alert, which removes the built-in tuning from it.", fr: "Une alerte corrélée d'une autre charge de travail a rejoint l'alerte, ce qui lui retire le réglage intégré." } }
    - { id: c, text: { en: "An automated investigation found malicious or suspicious activity, so Defender XDR reactivated the alert.", fr: "Une enquête automatisée a trouvé une activité malveillante ou suspecte : Defender XDR a donc réactivé l'alerte." } }
    - { id: d, text: { en: "Built-in tuning rules suppress an alert only for 24 hours, after which the alert becomes active again.", fr: "Les règles de réglage intégrées ne suppriment une alerte que pendant 24 heures, après quoi l'alerte redevient active." } }
answer: { optionId: c }
explanation:
  correct:
    en: Built-in alert tuning rules suppress alerts without affecting automated investigation and response (AIR) or email notifications. If an AIR investigation then finds malicious or suspicious activity, Defender XDR reactivates the suppressed alert, which can then create or join an incident.
    fr: Les règles de réglage des alertes intégrées suppriment des alertes sans affecter l'investigation et la réponse automatisées (AIR) ni les notifications par e-mail. Si une enquête AIR trouve ensuite une activité malveillante ou suspecte, Defender XDR réactive l'alerte supprimée, qui peut alors créer un incident ou en rejoindre un.
  options:
    a: { en: "Built-in tuning rules don't affect email notifications, and a notification rule never changes the state of an alert.", fr: "Les règles de réglage intégrées n'affectent pas les notifications par e-mail, et une règle de notification ne modifie jamais l'état d'une alerte." }
    b: { en: "Correlation groups alerts into incidents; it doesn't remove the tuning applied to an alert.", fr: "La corrélation regroupe des alertes en incidents ; elle ne retire pas le réglage appliqué à une alerte." }
    d: { en: "Built-in tuning rules stay in effect until you disable them; they have no 24-hour limit.", fr: "Les règles de réglage intégrées restent en vigueur jusqu'à ce que vous les désactiviez ; elles n'ont pas de limite de 24 heures." }
references:
  - title: Investigate alerts in Microsoft Defender XDR
    url: https://learn.microsoft.com/en-us/defender-xdr/investigate-alerts
