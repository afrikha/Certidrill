id: sc200-1a-air-approve-steps
objective: "1.1.7"
type: ordering
difficulty: 1
status: draft
stem:
  en: |
    Tailspin Toys uses Microsoft Defender XDR and Microsoft Defender for Endpoint Plan 2. An automated investigation recommends quarantining a file on a device whose device group requires approval for remediation. You have the permissions required to approve remediation actions.

    You need to approve the remediation action.

    Which three actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Tailspin Toys utilise Microsoft Defender XDR et Microsoft Defender pour point de terminaison Plan 2. Une enquête automatisée recommande de mettre en quarantaine un fichier sur un appareil dont le groupe d'appareils exige une approbation pour la correction. Vous disposez des autorisations nécessaires pour approuver les actions de correction.

    Vous devez approuver l'action de correction.

    Quelles sont les trois actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - { id: open, text: { en: "In the Microsoft Defender portal, go to **Actions and submissions > Action center**.", fr: "Dans le portail Microsoft Defender, accéder à **Actions and submissions > Action center**." } }
    - { id: pending, text: { en: "On the **Pending** tab, select the action to open its flyout pane.", fr: "Dans l'onglet **Pending**, sélectionner l'action pour ouvrir son volet." } }
    - { id: approve, text: { en: "Select **Approve**.", fr: "Sélectionner **Approve**." } }
    - { id: history, text: { en: "On the **History** tab, select the action and select **Undo**.", fr: "Dans l'onglet **History**, sélectionner l'action et sélectionner **Undo**." } }
    - { id: excl, text: { en: "Open **Settings > Endpoints > Automation folder exclusions**.", fr: "Ouvrir **Paramètres > Points de terminaison > Automation folder exclusions**." } }
answer:
  sequence: [ open, pending, approve ]
explanation:
  correct:
    en: Pending remediation actions are approved in the Action center, under Actions and submissions. On the Pending tab, you select the item to open its flyout pane, where you can approve or reject it, open the investigation page or go hunt.
    fr: Les actions de correction en attente s'approuvent dans le centre de notifications, sous Actions and submissions. Dans l'onglet Pending, vous sélectionnez l'élément pour ouvrir son volet, où vous pouvez l'approuver ou le rejeter, ouvrir la page de l'enquête ou lancer une chasse.
  options:
    history: { en: "The History tab lists completed actions; Undo reverses an action instead of approving it.", fr: "L'onglet History liste les actions terminées ; Undo annule une action au lieu de l'approuver." }
    excl: { en: "Automation folder exclusions make investigations skip folders; they don't approve actions.", fr: "Les exclusions de dossiers d'automatisation font ignorer des dossiers aux enquêtes ; elles n'approuvent pas d'actions." }
references:
  - title: View and manage actions in the Action center
    url: https://learn.microsoft.com/en-us/defender-xdr/m365d-autoir-actions
