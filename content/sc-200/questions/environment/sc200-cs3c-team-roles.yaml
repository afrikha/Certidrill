id: sc200-cs3c-team-roles
objective: "1.2.1"
type: dragdrop
caseStudy: sc200-cs3c-relecloud
difficulty: 2
status: draft
stem:
  en: |
    You need to meet the permissions requirement.

    Which role should you assign for each need? To answer, drag the appropriate roles to the correct needs. Each role may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez respecter l'exigence relative aux autorisations.

    Quel rôle devez-vous attribuer pour chaque besoin ? Pour répondre, faites glisser les rôles appropriés vers les besoins correspondants. Chaque rôle peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: reader, text: Microsoft Sentinel Reader }
    - { id: responder, text: Microsoft Sentinel Responder }
    - { id: contributor, text: Microsoft Sentinel Contributor }
    - { id: logic, text: Logic App Contributor }
    - { id: owner, text: Owner }
    - { id: autocontrib, text: Microsoft Sentinel Automation Contributor }
  targets:
    - id: detect
      text: { en: "Detection engineers, on RG-Sentinel", fr: "Ingénieurs de détection, sur RG-Sentinel" }
    - id: automate
      text: { en: "Automation engineers, on RG-Playbooks", fr: "Ingénieurs d'automatisation, sur RG-Playbooks" }
    - id: audit
      text: { en: "Auditors, on RG-Sentinel", fr: "Auditeurs, sur RG-Sentinel" }
    - id: grant
      text: { en: "Platform team member who grants Microsoft Sentinel the playbook permissions, on RG-Playbooks", fr: "Membre de l'équipe plateforme qui accorde à Microsoft Sentinel les autorisations sur les playbooks, sur RG-Playbooks" }
answer:
  mapping: { detect: contributor, automate: logic, audit: reader, grant: owner }
explanation:
  correct:
    en: |
      Microsoft Sentinel Contributor lets the detection engineers create and edit analytics rules. Playbooks are Logic Apps, so creating and editing them requires Logic App Contributor. Microsoft Sentinel Reader lets auditors view incidents and workbooks without changes. Granting the Microsoft Sentinel service account permissions on the playbook resource group, through Manage playbook permissions, requires the Owner or User Access Administrator role on that resource group; Owner is the only one of the two in the list.
    fr: |
      Microsoft Sentinel Contributor permet aux ingénieurs de détection de créer et de modifier des règles d'analytique. Les playbooks sont des applications Logic Apps : les créer et les modifier demande Logic App Contributor. Microsoft Sentinel Reader permet aux auditeurs de consulter les incidents et les classeurs sans rien modifier. Accorder au compte de service Microsoft Sentinel des autorisations sur le groupe de ressources des playbooks, avec Manage playbook permissions, demande le rôle Owner ou User Access Administrator sur ce groupe de ressources ; Owner est le seul des deux dans la liste.
  options:
    responder: { en: "Microsoft Sentinel Responder adds incident management to Reader; the auditors must not change anything, and it cannot create analytics rules.", fr: "Microsoft Sentinel Responder ajoute la gestion des incidents à Reader ; les auditeurs ne doivent rien modifier, et ce rôle ne permet pas de créer des règles d'analytique." }
    autocontrib: { en: "Microsoft Sentinel Automation Contributor is assigned to Microsoft Sentinel itself, not to user accounts.", fr: "Microsoft Sentinel Automation Contributor est attribué à Microsoft Sentinel lui-même, pas à des comptes d'utilisateur." }
references:
  - title: Roles and permissions in the Microsoft Sentinel platform
    url: https://learn.microsoft.com/en-us/azure/sentinel/roles
  - title: Automate threat response in Microsoft Sentinel with automation rules
    url: https://learn.microsoft.com/en-us/azure/sentinel/automate-incident-handling-with-automation-rules
