id: sc200-1c-conn-source-dropdown
objective: "1.3.1"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    Proseware plans the data connectors of its Microsoft Sentinel workspace for the following sources:

    - Ubuntu web servers that write their logs to the local syslog daemon in standard Syslog format.
    - Palo Alto Networks firewalls configured to send CEF messages.
    - Domain controllers that run as Azure virtual machines. The SOC uses the built-in analytics rules that query `SecurityEvent`.

    Which connector should Proseware use for each source? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware planifie les connecteurs de données de son espace de travail Microsoft Sentinel pour les sources suivantes :

    - Des serveurs web Ubuntu qui écrivent leurs journaux dans le démon syslog local au format Syslog standard.
    - Des pare-feu Palo Alto Networks configurés pour envoyer des messages CEF.
    - Des contrôleurs de domaine exécutés comme machines virtuelles Azure. Le SOC utilise les règles d'analytique intégrées qui interrogent `SecurityEvent`.

    Quel connecteur Proseware doit-elle utiliser pour chaque source ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Ubuntu web servers: [[web]]

      Palo Alto Networks firewalls: [[fw]]

      Domain controllers: [[dc]]
    fr: |
      Serveurs web Ubuntu : [[web]]

      Pare-feu Palo Alto Networks : [[fw]]

      Contrôleurs de domaine : [[dc]]
  slots:
    - id: web
      options:
        - { id: syslog, text: Syslog via AMA }
        - { id: cef, text: Common Event Format (CEF) via AMA }
        - { id: wse, text: Windows Security Events via AMA }
        - { id: wfe, text: Windows Forwarded Events }
    - id: fw
      options:
        - { id: syslog, text: Syslog via AMA }
        - { id: cef, text: Common Event Format (CEF) via AMA }
        - { id: wse, text: Windows Security Events via AMA }
        - { id: wfe, text: Windows Forwarded Events }
    - id: dc
      options:
        - { id: syslog, text: Syslog via AMA }
        - { id: cef, text: Common Event Format (CEF) via AMA }
        - { id: wse, text: Windows Security Events via AMA }
        - { id: wfe, text: Windows Forwarded Events }
answer:
  values: { web: syslog, fw: cef, dc: wse }
explanation:
  correct:
    en: Plain Syslog messages go through Syslog via AMA into the `Syslog` table. CEF messages from security appliances go through CEF via AMA into `CommonSecurityLog`, with parsed vendor, product and action fields. Windows Security Events via AMA writes to `SecurityEvent`, the table the built-in rules query; Windows Forwarded Events would write to `WindowsEvent`.
    fr: Les messages Syslog simples passent par Syslog via AMA vers la table `Syslog`. Les messages CEF des appliances de sécurité passent par CEF via AMA vers `CommonSecurityLog`, avec des champs fournisseur, produit et action analysés. Windows Security Events via AMA écrit dans `SecurityEvent`, la table qu'interrogent les règles intégrées ; Windows Forwarded Events écrirait dans `WindowsEvent`.
references:
  - title: Syslog and Common Event Format (CEF) via AMA connectors for Microsoft Sentinel
    url: https://learn.microsoft.com/en-us/azure/sentinel/cef-syslog-ama-overview
  - title: Connect Microsoft Sentinel to other Microsoft services with a Windows agent-based data connector
    url: https://learn.microsoft.com/en-us/azure/sentinel/connect-services-windows-based
