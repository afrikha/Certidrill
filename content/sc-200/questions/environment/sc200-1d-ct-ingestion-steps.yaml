id: sc200-1d-ct-ingestion-steps
objective: "1.3.7"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam has a Microsoft Sentinel workspace named **LAW1** in the West Europe region. Developers registered a Microsoft Entra application named **App1** and created a client secret for it.

    You need App1 to send records to a new custom table in LAW1 by using the Logs ingestion API. You will configure the solution in the Azure portal.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Fabrikam dispose d'un espace de travail Microsoft Sentinel nommé **LAW1** dans la région West Europe. Les développeurs ont inscrit une application Microsoft Entra nommée **App1** et lui ont créé une clé secrète client.

    App1 doit envoyer des enregistrements dans une nouvelle table personnalisée de LAW1 avec l'API d'ingestion de journaux. Vous configurerez la solution dans le portail Azure.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: dce, text: { en: "Create a data collection endpoint in the West Europe region.", fr: "Créer un point de terminaison de collecte de données dans la région West Europe." } }
    - { id: table, text: { en: "In LAW1, select **Tables** > **Create** > **New custom log (DCR based)**, and create the table with a new data collection rule.", fr: "Dans LAW1, sélectionner **Tables** > **Créer** > **New custom log (DCR based)**, puis créer la table avec une nouvelle règle de collecte de données." } }
    - { id: role, text: { en: "Assign App1 the Monitoring Metrics Publisher role on the data collection rule.", fr: "Attribuer à App1 le rôle Monitoring Metrics Publisher sur la règle de collecte de données." } }
    - { id: send, text: { en: "Configure App1 with the logs ingestion URI and the immutable ID of the data collection rule, then send the records.", fr: "Configurer App1 avec l'URI d'ingestion de journaux et l'ID immuable de la règle de collecte de données, puis envoyer les enregistrements." } }
    - { id: key, text: { en: "Copy the primary key of LAW1 into the configuration of App1.", fr: "Copier la clé primaire de LAW1 dans la configuration d'App1." } }
    - { id: wsrole, text: { en: "Assign App1 the Log Analytics Contributor role on LAW1.", fr: "Attribuer à App1 le rôle Log Analytics Contributor sur LAW1." } }
answer:
  sequence: [ dce, table, role, send ]
explanation:
  correct:
    en: The custom log wizard of the portal asks for a data collection endpoint, so you create it first, in the same region as the workspace. The wizard then creates the table and its DCR. App1 needs the Monitoring Metrics Publisher role on that DCR before it can post data, and it sends the records to the logs ingestion URI with the DCR immutable ID.
    fr: L'assistant de journal personnalisé du portail demande un point de terminaison de collecte de données ; vous le créez donc d'abord, dans la même région que l'espace de travail. L'assistant crée ensuite la table et sa DCR. App1 a besoin du rôle Monitoring Metrics Publisher sur cette DCR avant de pouvoir publier des données, et elle envoie les enregistrements à l'URI d'ingestion de journaux avec l'ID immuable de la DCR.
  options:
    key: { en: "The workspace key belongs to the HTTP Data Collector API; the Logs ingestion API authenticates with Microsoft Entra ID.", fr: "La clé de l'espace de travail appartient à l'API HTTP Data Collector ; l'API d'ingestion de journaux s'authentifie avec Microsoft Entra ID." }
    wsrole: { en: "Log Analytics Contributor manages the workspace and its tables; sending data requires Monitoring Metrics Publisher on the DCR.", fr: "Log Analytics Contributor gère l'espace de travail et ses tables ; l'envoi de données exige Monitoring Metrics Publisher sur la DCR." }
references:
  - title: "Tutorial: Send data to Azure Monitor Logs by using the Logs ingestion API (Azure portal)"
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/logs/tutorial-logs-ingestion-portal
