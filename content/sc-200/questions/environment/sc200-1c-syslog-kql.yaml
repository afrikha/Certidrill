id: sc200-1c-syslog-kql
objective: "1.3.4"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    Tailspin Toys collects the Syslog messages of its Linux servers by using the Syslog via AMA connector.

    You need a query that returns, for the last day, the number of error and critical messages of the **auth** facility for each host and process, with the noisiest first.

    How should you complete the query? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin Toys collecte les messages Syslog de ses serveurs Linux avec le connecteur Syslog via AMA.

    Vous avez besoin d'une requête qui renvoie, pour le dernier jour, le nombre de messages d'erreur et critiques de la facility **auth** pour chaque hôte et chaque processus, les plus bruyants en premier.

    Comment devez-vous compléter la requête ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: kusto
  template: |
    [[table]]
    | where TimeGenerated > ago(1d)
    | where [[col]] == "auth" and SeverityLevel in ("err", "crit")
    | summarize Messages = count() by HostName, ProcessName
    | [[sort]] Messages desc
  slots:
    - id: table
      options:
        - { id: syslog, text: Syslog }
        - { id: csl, text: CommonSecurityLog }
        - { id: event, text: Event }
        - { id: winevent, text: WindowsEvent }
    - id: col
      options:
        - { id: facility, text: Facility }
        - { id: channel, text: Channel }
        - { id: eventlog, text: EventLog }
        - { id: activity, text: Activity }
    - id: sort
      options:
        - { id: sortby, text: sort by }
        - { id: project, text: project }
        - { id: extend, text: extend }
        - { id: where, text: where }
answer:
  values: { table: syslog, col: facility, sort: sortby }
explanation:
  correct:
    en: Syslog via AMA writes to the `Syslog` table, whose `Facility` and `SeverityLevel` columns hold the facility and severity of each message. `sort by Messages desc` returns the noisiest host and process pairs first.
    fr: Syslog via AMA écrit dans la table `Syslog`, dont les colonnes `Facility` et `SeverityLevel` contiennent la facility et la gravité de chaque message. `sort by Messages desc` renvoie d'abord les couples hôte-processus les plus bruyants.
  options:
    csl: { en: "CommonSecurityLog receives CEF messages.", fr: "CommonSecurityLog reçoit les messages CEF." }
    event: { en: "Event stores Windows events collected by a generic Azure Monitor DCR.", fr: "Event stocke les événements Windows collectés par une DCR Azure Monitor générique." }
    channel: { en: "Channel is a column of the Windows event tables.", fr: "Channel est une colonne des tables d'événements Windows." }
    eventlog: { en: "EventLog is a column of the Event table.", fr: "EventLog est une colonne de la table Event." }
    project: { en: "project selects columns; it doesn't order rows.", fr: "project sélectionne des colonnes ; il ne trie pas les lignes." }
references:
  - title: Syslog and Common Event Format (CEF) via AMA connectors for Microsoft Sentinel
    url: https://learn.microsoft.com/en-us/azure/sentinel/cef-syslog-ama-overview
