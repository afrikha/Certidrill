id: sc200-1a-rules-page-mapping
objective: "1.1.4"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Wingtip Toys uses Microsoft Defender for Endpoint Plan 2 and a Microsoft Sentinel workspace connected to the Microsoft Defender portal.

    Which settings page should you use for each requirement? To answer, drag the appropriate pages to the correct requirements. Each page may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Wingtip Toys utilise Microsoft Defender pour point de terminaison Plan 2 et un espace de travail Microsoft Sentinel connecté au portail Microsoft Defender.

    Quelle page de paramètres devez-vous utiliser pour chaque exigence ? Pour répondre, faites glisser les pages appropriées vers les exigences correspondantes. Chaque page peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: arm, text: Asset rule management }
    - { id: ind, text: Indicators }
    - { id: afe, text: Automation folder exclusions }
    - { id: cdc, text: Custom data collection }
    - { id: tune, text: Alert tuning }
    - { id: notif, text: Email notifications }
  targets:
    - id: t1
      text: { en: "Apply a dynamic tag to the devices that match conditions you define", fr: "Appliquer une étiquette dynamique aux appareils qui répondent à des conditions que vous définissez" }
    - id: t2
      text: { en: "Block a SHA-256 file hash on one device group", fr: "Bloquer un hachage de fichier SHA-256 sur un groupe d'appareils" }
    - id: t3
      text: { en: "Prevent automated investigations from examining a folder of known-good tools", fr: "Empêcher les enquêtes automatisées d'examiner un dossier d'outils fiables" }
    - id: t4
      text: { en: "Send extra network connection events from selected devices to Microsoft Sentinel", fr: "Envoyer des événements de connexion réseau supplémentaires d'appareils sélectionnés à Microsoft Sentinel" }
answer:
  mapping: { t1: arm, t2: ind, t3: afe, t4: cdc }
explanation:
  correct:
    en: Asset rule management creates the rules that apply dynamic tags to devices. File hash indicators are created on the Indicators page and can be scoped to device groups. Automation folder exclusions define folders that automated investigations skip. Custom data collection rules collect extra endpoint events and send them to the connected Sentinel workspace.
    fr: Asset rule management crée les règles qui appliquent des étiquettes dynamiques aux appareils. Les indicateurs de hachage de fichier se créent sur la page Indicators et peuvent être limités à des groupes d'appareils. Les exclusions de dossiers d'automatisation définissent les dossiers que les enquêtes automatisées ignorent. Les règles de collecte de données personnalisée collectent des événements supplémentaires des points de terminaison et les envoient à l'espace de travail Sentinel connecté.
  options:
    tune: { en: "Alert tuning hides, resolves or converts alerts; it doesn't block files or collect events.", fr: "Le réglage des alertes masque, résout ou convertit des alertes ; il ne bloque pas de fichiers et ne collecte pas d'événements." }
    notif: { en: "Email notifications send emails about incidents, actions and threat analytics reports.", fr: "Les notifications par e-mail envoient des e-mails sur les incidents, les actions et les rapports de l'analytique des menaces." }
references:
  - title: Create and manage custom data collection rules in Microsoft Defender for Endpoint
    url: https://learn.microsoft.com/en-us/defender-endpoint/create-custom-data-collection-rules
  - title: Configure automation folder exclusions
    url: https://learn.microsoft.com/en-us/defender-endpoint/manage-automation-folder-exclusions
