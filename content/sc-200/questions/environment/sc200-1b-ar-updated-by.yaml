id: sc200-1b-ar-updated-by
objective: "1.1.10"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam, Inc. uses Microsoft Sentinel. An automation rule named **AR-Escalate** has the following configuration:

    - Trigger: When incident is updated
    - Condition: Tag Added VIP
    - Action: Run playbook **pb-Escalate**, which adds a comment and the tags Escalated and VIP-Reviewed to the incident

    Analysts report that pb-Escalate sometimes runs several times for the same incident. AR-Escalate must run only when an analyst adds the VIP tag.

    What should you add to AR-Escalate?
  fr: |
    Fabrikam, Inc. utilise Microsoft Sentinel. Une règle d'automatisation nommée **AR-Escalate** a la configuration suivante :

    - Déclencheur : When incident is updated
    - Condition : Tag Added VIP
    - Action : Run playbook **pb-Escalate**, qui ajoute un commentaire et les étiquettes Escalated et VIP-Reviewed à l'incident

    Les analystes signalent que pb-Escalate s'exécute parfois plusieurs fois pour le même incident. AR-Escalate ne doit s'exécuter que lorsqu'un analyste ajoute l'étiquette VIP.

    Que devez-vous ajouter à AR-Escalate ?
body:
  options:
    - { id: a, text: { en: "An expiration date for the rule", fr: "Une date d'expiration pour la règle" } }
    - { id: b, text: { en: "A lower order number than the other update rules", fr: "Un numéro d'ordre inférieur à celui des autres règles de mise à jour" } }
    - { id: c, text: { en: "A condition on Updated by, set to a user", fr: "Une condition sur Updated by, définie sur un utilisateur" } }
    - { id: d, text: { en: "A condition on Status, set to Changed to Active", fr: "Une condition sur Status, définie sur Changed to Active" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      On the update trigger, the Updated by condition tells who made the change (a user, an application, a playbook, an automation rule, AIR, an alert grouping or other). Limiting AR-Escalate to updates made by a user ignores the updates that pb-Escalate itself makes and prevents the loop.
    fr: |
      Avec le déclencheur de mise à jour, la condition Updated by indique qui a effectué la modification (un utilisateur, une application, un playbook, une règle d'automatisation, AIR, un regroupement d'alertes ou autre). Limiter AR-Escalate aux mises à jour faites par un utilisateur ignore les mises à jour de pb-Escalate lui-même et évite la boucle.
  options:
    a: { en: "An expiration date only disables the rule after a date; it doesn't filter the updates that trigger it.", fr: "Une date d'expiration désactive seulement la règle après une date ; elle ne filtre pas les mises à jour qui la déclenchent." }
    b: { en: "The order decides when the rule runs relative to other rules, not which updates trigger it.", fr: "L'ordre détermine quand la règle s'exécute par rapport aux autres règles, pas quelles mises à jour la déclenchent." }
    d: { en: "The analyst adds a tag without changing the status, so this condition would stop the rule from running at all for these updates.", fr: "L'analyste ajoute une étiquette sans changer le statut : cette condition empêcherait la règle de s'exécuter pour ces mises à jour." }
references:
  - title: Automate threat response in Microsoft Sentinel with automation rules
    url: https://learn.microsoft.com/en-us/azure/sentinel/automate-incident-handling-with-automation-rules
