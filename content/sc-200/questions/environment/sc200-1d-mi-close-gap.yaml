id: sc200-1d-mi-close-gap
objective: "1.4.4"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    Tailspin has onboarded a Microsoft Sentinel workspace to the Microsoft Defender portal. Firewall logs are already ingested into the workspace. On the MITRE ATT&CK page, the technique **T1110 Brute Force** shows no active detection.

    The firewall vendor's Content hub solution contains a scheduled rule template mapped to T1110. The solution is not installed.

    You need T1110 to show an active detection in the Current coverage view.

    Which three actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Tailspin a intégré un espace de travail Microsoft Sentinel au portail Microsoft Defender. Les journaux de pare-feu sont déjà ingérés dans l'espace de travail. Sur la page MITRE ATT&CK, la technique **T1110 Brute Force** n'affiche aucune détection active.

    La solution du hub de contenu de l'éditeur du pare-feu contient un modèle de règle planifiée mappé à T1110. La solution n'est pas installée.

    T1110 doit afficher une détection active dans la vue Current coverage.

    Quelles sont les trois actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - { id: install, text: { en: "Install the firewall vendor's solution from the Content hub.", fr: "Installer la solution de l'éditeur du pare-feu depuis le hub de contenu." } }
    - { id: create, text: { en: "On the Rule templates tab, create an enabled rule from the T1110 template.", fr: "Dans l'onglet Modèles de règles, créer une règle activée à partir du modèle T1110." } }
    - { id: verify, text: { en: "Open the MITRE ATT&CK page and check T1110 in the Current coverage view.", fr: "Ouvrir la page MITRE ATT&CK et vérifier T1110 dans la vue Current coverage." } }
    - { id: hunt, text: { en: "Create a hunting query mapped to T1110.", fr: "Créer une requête de chasse mappée à T1110." } }
    - { id: bookmark, text: { en: "Bookmark the results of a hunting query and map the bookmark to T1110.", fr: "Créer un signet sur les résultats d'une requête de chasse et le mapper à T1110." } }
answer:
  sequence: [ install, create, verify ]
explanation:
  correct:
    en: Analytics rule templates come with Content hub solutions, so you install the solution first. A template counts as coverage only once an active rule is created from it, and the Current coverage view counts active scheduled and NRT rules, which you then check.
    fr: |
      Les modèles de règles d'analytique sont fournis avec les solutions du hub de contenu : vous installez donc d'abord la solution. Un modèle ne compte dans la couverture qu'une fois une règle active créée à partir de lui, et la vue Current coverage compte les règles planifiées et NRT actives, ce que vous vérifiez ensuite.
  options:
    hunt: { en: "Hunting queries are linked from the technique details, but the coverage matrix counts active scheduled and NRT rules.", fr: "Les requêtes de chasse sont liées depuis les détails de la technique, mais la matrice de couverture compte les règles planifiées et NRT actives." }
    bookmark: { en: "Bookmarks support investigations; they do not create a detection.", fr: "Les signets servent aux enquêtes ; ils ne créent pas de détection." }
references:
  - title: View MITRE ATT&CK framework coverage in Microsoft Sentinel
    url: https://learn.microsoft.com/en-us/azure/sentinel/mitre-coverage
  - title: Threat detection in Microsoft Sentinel
    url: https://learn.microsoft.com/en-us/azure/sentinel/detect-threats-built-in
