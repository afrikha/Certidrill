id: sc200-1d-ct-auxiliary-plan
objective: "1.3.7"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Contoso has a Microsoft Sentinel workspace named **LAW-Sec**. A web proxy sends about 2 TB of verbose logs per day to a DCR-based custom table named **ProxyVerbose_CL**.

    The data must be kept for compliance and is queried only a few times a year during audits. No analytics rule, alert or workbook uses the table. Query speed does not matter.

    You need to select the table plan for ProxyVerbose_CL. The solution must minimize ingestion cost.

    Which table plan should you select?
  fr: |
    Contoso dispose d'un espace de travail Microsoft Sentinel nommé **LAW-Sec**. Un proxy web envoie environ 2 To de journaux détaillés par jour dans une table personnalisée basée sur une DCR nommée **ProxyVerbose_CL**.

    Les données doivent être conservées pour la conformité et ne sont interrogées que quelques fois par an lors des audits. Aucune règle d'analytique, aucune alerte et aucun classeur n'utilisent la table. La vitesse des requêtes n'a pas d'importance.

    Vous devez sélectionner le plan de table de ProxyVerbose_CL. La solution doit réduire au minimum le coût d'ingestion.

    Quel plan de table devez-vous sélectionner ?
body:
  options:
    - { id: a, text: Analytics }
    - { id: b, text: Basic }
    - { id: c, text: Auxiliary / Lake }
    - { id: d, text: { en: "Analytics, with an analytics retention of 30 days", fr: "Analytics, avec une rétention analytique de 30 jours" } }
answer: { optionId: c }
explanation:
  correct:
    en: The Auxiliary / Lake plan has the lowest (minimal) ingestion cost and is meant for verbose data used for auditing rather than real-time analysis; its queries are slower and it supports no alerts, which the scenario accepts. DCR-based custom tables can use this plan. Its data must provide TimeGenerated in ISO 8601 format with microseconds.
    fr: Le plan Auxiliary / Lake a le coût d'ingestion le plus faible (minimal) et convient aux données détaillées utilisées pour l'audit plutôt que pour l'analyse en temps réel ; ses requêtes sont plus lentes et il ne prend en charge aucune alerte, ce que le scénario accepte. Les tables personnalisées basées sur une DCR peuvent utiliser ce plan. Leurs données doivent fournir TimeGenerated au format ISO 8601 avec microsecondes.
  options:
    a: { en: "The Analytics plan has the standard (highest) ingestion cost; it is needed only for data used by analytics rules, alerts and insights.", fr: "Le plan Analytics a le coût d'ingestion standard (le plus élevé) ; il n'est nécessaire que pour les données utilisées par les règles d'analytique, les alertes et les insights." }
    b: { en: "Basic reduces the ingestion cost compared with Analytics, but Auxiliary / Lake is cheaper still for data that is rarely queried.", fr: "Basic réduit le coût d'ingestion par rapport à Analytics, mais Auxiliary / Lake est encore moins cher pour des données rarement interrogées." }
    d: { en: "Retention settings do not change the ingestion price of the Analytics plan, which stays the standard one.", fr: "Les paramètres de rétention ne changent pas le prix d'ingestion du plan Analytics, qui reste le prix standard." }
references:
  - title: Azure Monitor Logs overview
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/logs/data-platform-logs
  - title: Add or delete tables and columns in Azure Monitor Logs
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/logs/create-custom-table
