id: sc200-1b-dg-alerts-investigation
objective: "1.1.9"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam, Inc. has used Microsoft Defender for Endpoint since 2023 and still uses Defender for Endpoint roles (Unified RBAC isn't activated). A device group named **DG-Retail** contains the store devices.

    You create a role for the Microsoft Entra group **SG-StoreAnalysts** and link the role to DG-Retail. The analysts must be able to collect investigation packages and run antivirus scans on the store devices. They must not be able to isolate devices, approve pending remediation actions or run scripts.

    Which permission should you include in the role in addition to View data?
  fr: |
    Fabrikam, Inc. utilise Microsoft Defender for Endpoint depuis 2023 et utilise toujours les rôles de Defender for Endpoint (le RBAC unifié n'est pas activé). Un groupe d'appareils nommé **DG-Retail** contient les appareils des magasins.

    Vous créez un rôle pour le groupe Microsoft Entra **SG-StoreAnalysts** et liez ce rôle à DG-Retail. Les analystes doivent pouvoir collecter des packages d'investigation et lancer des analyses antivirus sur les appareils des magasins. Ils ne doivent pas pouvoir isoler des appareils, approuver des actions de correction en attente ni exécuter de scripts.

    Quelle autorisation devez-vous inclure dans le rôle en plus de View data ?
body:
  options:
    - { id: a, text: "Active remediation actions" }
    - { id: b, text: "Alerts investigation" }
    - { id: c, text: "Live response capabilities: Advanced" }
    - { id: d, text: "Manage security settings in Security Center" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      The Alerts investigation permission lets users manage alerts, start investigations, run scans, collect investigation packages and manage device tags. Linked to DG-Retail only, it gives the analysts exactly what they need on the store devices.
    fr: |
      L'autorisation Alerts investigation permet de gérer les alertes, de démarrer des investigations, de lancer des analyses, de collecter des packages d'investigation et de gérer les étiquettes d'appareils. Liée à DG-Retail uniquement, elle donne aux analystes exactement ce dont ils ont besoin sur les appareils des magasins.
  options:
    a: { en: "Active remediation actions allows response actions such as isolation and the approval of pending actions, which is forbidden.", fr: "Active remediation actions permet des actions de réponse comme l'isolement et l'approbation des actions en attente, ce qui est interdit." }
    c: { en: "Advanced live response lets users upload files and run scripts from the library on devices.", fr: "La réponse dynamique avancée permet de charger des fichiers et d'exécuter des scripts de la bibliothèque sur les appareils." }
    d: { en: "This permission manages settings such as alert suppression, onboarding and email notifications; it doesn't allow scans or package collection.", fr: "Cette autorisation gère des paramètres comme la suppression d'alertes, l'intégration et les notifications par e-mail ; elle ne permet ni analyses ni collecte de packages." }
references:
  - title: Create and manage roles for role-based access control
    url: https://learn.microsoft.com/en-us/defender-endpoint/user-roles
