id: sc200-1b-rt-usage-kql
objective: "1.2.2"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Northwind Traders has a Microsoft Sentinel workspace. Before moving some tables to the Data lake tier, you need to find the tables that ingested the most billable data during the last 30 days, in gigabytes.

    How should you complete the query? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind Traders dispose d'un espace de travail Microsoft Sentinel. Avant de déplacer certaines tables vers le niveau Data Lake, vous devez trouver les tables qui ont ingéré le plus de données facturables au cours des 30 derniers jours, en gigaoctets.

    Comment devez-vous compléter la requête ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: kusto
  template: |
    Usage
    | where TimeGenerated > [[t]]
    | where [[f]] == true
    | summarize IngestedGB = [[agg]] / 1000 by DataType
    | order by IngestedGB desc
  slots:
    - id: t
      options:
        - { id: ago, text: ago(30d) }
        - { id: now, text: now(30d) }
        - { id: span, text: 30d }
    - id: f
      options:
        - { id: billable, text: IsBillable }
        - { id: quantity, text: Quantity }
        - { id: solution, text: Solution }
    - id: agg
      options:
        - { id: sum, text: sum(Quantity) }
        - { id: count, text: count() }
        - { id: max, text: max(Quantity) }
        - { id: dcount, text: dcount(Quantity) }
answer:
  values: { t: ago, f: billable, agg: sum }
explanation:
  correct:
    en: |
      The Usage table has one record per data type and period, with the ingested volume in megabytes in Quantity and the IsBillable flag. Filtering on ago(30d) and IsBillable == true, then summing Quantity by DataType and dividing by 1000, gives the billable gigabytes of each table.
    fr: |
      La table Usage contient un enregistrement par type de données et par période, avec le volume ingéré en mégaoctets dans Quantity et l'indicateur IsBillable. Filtrer sur ago(30d) et IsBillable == true, puis additionner Quantity par DataType et diviser par 1000, donne les gigaoctets facturables de chaque table.
  options:
    now: { en: "now(30d) returns a time 30 days in the future, so no record matches.", fr: "now(30d) renvoie une heure située 30 jours dans le futur : aucun enregistrement ne correspond." }
    span: { en: "A timespan can't be compared with the TimeGenerated datetime.", fr: "Une durée ne peut pas être comparée à la date TimeGenerated." }
    quantity: { en: "Quantity is a number, not a Boolean flag.", fr: "Quantity est un nombre, pas un indicateur booléen." }
    count: { en: "count() returns a number of records, not a volume.", fr: "count() renvoie un nombre d'enregistrements, pas un volume." }
    max: { en: "max returns the largest single record, not the total volume.", fr: "max renvoie le plus grand enregistrement, pas le volume total." }
references:
  - title: Manage data retention in a Log Analytics workspace
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/logs/data-retention-configure
  - title: Azure Monitor Logs reference - Usage
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/reference/tables/usage
