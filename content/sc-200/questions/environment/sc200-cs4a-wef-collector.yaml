id: sc200-cs4a-wef-collector
objective: "1.3.3"
type: yesno_statements
caseStudy: sc200-cs4a-munsons
difficulty: 2
status: draft
stem:
  en: |
    You plan to meet the plant server events requirement.

    For each of the following statements, select Yes if the statement is true. Otherwise, select No.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous prévoyez de respecter l'exigence relative aux événements des serveurs des usines.

    Pour chacune des affirmations suivantes, sélectionnez Oui si l'affirmation est vraie. Sinon, sélectionnez Non.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: The events that the plant servers forward from their Security log will be written to the SecurityEvent table.
        fr: Les événements que les serveurs des usines transfèrent depuis leur journal Security seront écrits dans la table SecurityEvent.
    - id: s2
      text:
        en: You must Azure Arc-enable SRV-WEC1 before you enable an Azure Monitor Agent-based connector for it.
        fr: Vous devez activer SRV-WEC1 pour Azure Arc avant d'activer un connecteur basé sur l'agent Azure Monitor pour ce serveur.
    - id: s3
      text:
        en: You configure the Windows Forwarded Events connector with a data collection rule that targets SRV-WEC1.
        fr: Vous configurez le connecteur Windows Forwarded Events avec une règle de collecte de données qui cible SRV-WEC1.
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: |
      The plant servers already forward their events to SRV-WEC1, so the Azure Monitor Agent installed on the collector can send the forwarded events to Microsoft Sentinel through the Windows Forwarded Events connector, without any software on the plant servers. SRV-WEC1 is not an Azure VM, so it must be Azure Arc-enabled before you enable the agent-based connector. Events collected through WEF, including those from the Security log, land in the WindowsEvent table, not in SecurityEvent, which is why ASIM parsers are used for the new detections.
    fr: |
      Les serveurs des usines transfèrent déjà leurs événements vers SRV-WEC1 : l'agent Azure Monitor installé sur le collecteur peut donc envoyer les événements transférés à Microsoft Sentinel avec le connecteur Windows Forwarded Events, sans aucun logiciel sur les serveurs des usines. SRV-WEC1 n'est pas une machine virtuelle Azure : il doit être activé pour Azure Arc avant l'activation du connecteur basé sur l'agent. Les événements collectés par WEF, y compris ceux du journal Security, arrivent dans la table WindowsEvent et non dans SecurityEvent, d'où l'utilisation d'analyseurs ASIM pour les nouvelles détections.
  options:
    s1:
      en: Events collected through Windows Event Forwarding are written to the WindowsEvent table, even when they come from the Security log.
      fr: Les événements collectés par le transfert d'événements Windows sont écrits dans la table WindowsEvent, même lorsqu'ils proviennent du journal Security.
references:
  - title: Connect Microsoft Sentinel to other Microsoft services with a Windows agent-based data connector
    url: https://learn.microsoft.com/en-us/azure/sentinel/connect-services-windows-based
