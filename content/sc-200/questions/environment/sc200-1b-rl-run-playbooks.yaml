id: sc200-1b-rl-run-playbooks
objective: "1.2.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Adatum Corporation uses Microsoft Sentinel. The workspace and its playbooks are in a resource group named **RG-SOC**. An analyst named Analyst1 has the Microsoft Sentinel Responder role on RG-SOC and can manage incidents, but can't run playbooks on them.

    Which two additional role assignments on RG-SOC would each allow Analyst1 to run playbooks manually? Each correct answer presents a complete solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum Corporation utilise Microsoft Sentinel. L'espace de travail et ses playbooks se trouvent dans un groupe de ressources nommé **RG-SOC**. Une analyste nommée Analyst1 a le rôle Microsoft Sentinel Responder sur RG-SOC et peut gérer les incidents, mais ne peut pas y exécuter de playbooks.

    Quelles sont les deux attributions de rôle supplémentaires sur RG-SOC qui permettraient chacune à Analyst1 d'exécuter des playbooks manuellement ? Chaque bonne réponse constitue une solution complète.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: Microsoft Sentinel Contributor }
    - { id: b, text: Microsoft Sentinel Playbook Operator }
    - { id: c, text: Microsoft Sentinel Automation Contributor }
    - { id: d, text: Logic App Contributor }
    - { id: e, text: Workbook Contributor }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |
      In Microsoft's permissions table, two roles can run playbooks - Microsoft Sentinel Playbook Operator, which lists, views and manually runs them, and Logic App Contributor, which also creates and edits them. Playbook Operator is the least privileged choice; Logic App Contributor is the engineers' role.
    fr: |
      Dans le tableau des autorisations de Microsoft, deux rôles peuvent exécuter des playbooks - Microsoft Sentinel Playbook Operator, qui les liste, les consulte et les exécute manuellement, et Logic App Contributor, qui permet aussi de les créer et de les modifier. Playbook Operator est le choix du moindre privilège ; Logic App Contributor est le rôle des ingénieurs.
  options:
    a: { en: "Sentinel Contributor can attach playbooks to rules but has no permission to run playbooks.", fr: "Sentinel Contributor peut attacher des playbooks à des règles mais n'a pas l'autorisation d'exécuter des playbooks." }
    c: { en: "Automation Contributor is for the Microsoft Sentinel service account used by automation rules, not for users.", fr: "Automation Contributor est destiné au compte de service Microsoft Sentinel utilisé par les règles d'automatisation, pas aux utilisateurs." }
    e: { en: "Workbook Contributor applies to workbooks only.", fr: "Workbook Contributor ne s'applique qu'aux classeurs." }
references:
  - title: Roles and permissions in the Microsoft Sentinel platform
    url: https://learn.microsoft.com/en-us/azure/sentinel/roles
