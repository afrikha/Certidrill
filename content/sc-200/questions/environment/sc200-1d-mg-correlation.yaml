id: sc200-1d-mg-correlation
objective: "1.4.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Litware has onboarded a Microsoft Sentinel workspace to the Microsoft Defender portal. A scheduled analytics rule named **Rule-VIP** raises alerts about the sign-ins of executive accounts.

    The Defender XDR correlation engine often adds the alerts of Rule-VIP to large incidents that contain unrelated alerts. The SOC wants the alerts of Rule-VIP to stay out of the correlation with other alerts. Rule-VIP must keep running with its current query and schedule.

    What should you do?
  fr: |
    Litware a intégré un espace de travail Microsoft Sentinel au portail Microsoft Defender. Une règle d'analytique planifiée nommée **Rule-VIP** génère des alertes sur les connexions des comptes de dirigeants.

    Le moteur de corrélation de Defender XDR ajoute souvent les alertes de Rule-VIP à de grands incidents qui contiennent des alertes sans rapport. Le SOC veut que les alertes de Rule-VIP restent en dehors de la corrélation avec les autres alertes. Rule-VIP doit continuer à s'exécuter avec sa requête et sa planification actuelles.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "In Custom detection rules, select Rule-VIP, and then select the option to exclude it from correlation.", fr: "Dans les règles de détection personnalisées, sélectionner Rule-VIP, puis l'option qui l'exclut de la corrélation." } }
    - { id: b, text: { en: "In the event grouping settings of Rule-VIP, trigger an alert for each event.", fr: "Dans les paramètres de regroupement d'événements de Rule-VIP, déclencher une alerte pour chaque événement." } }
    - { id: c, text: { en: "In the alert grouping settings of Rule-VIP, group all the alerts of the rule into a single incident.", fr: "Dans les paramètres de regroupement d'alertes de Rule-VIP, regrouper toutes les alertes de la règle dans un seul incident." } }
    - { id: d, text: { en: "In Custom detection rules, turn off Rule-VIP, and then turn it on again.", fr: "Dans les règles de détection personnalisées, désactiver Rule-VIP, puis la réactiver." } }
answer: { optionId: a }
explanation:
  correct:
    en: With a workspace onboarded to the Defender portal, Sentinel analytics rules appear in the Custom detection rules list, and the rule details offer Include or exclude from correlation. Excluding Rule-VIP keeps its alerts out of the correlation performed by the Defender XDR engine, without changing the rule's query or schedule.
    fr: Avec un espace de travail intégré au portail Defender, les règles d'analytique Sentinel apparaissent dans la liste des règles de détection personnalisées, et les détails de la règle proposent Include or exclude from correlation. Exclure Rule-VIP tient ses alertes à l'écart de la corrélation effectuée par le moteur de Defender XDR, sans changer la requête ni la planification de la règle.
  options:
    c: { en: "In the Defender portal, alert grouping settings apply only when the incident is created; the correlation engine can still merge the alerts with others.", fr: "Dans le portail Defender, les paramètres de regroupement d'alertes ne s'appliquent qu'à la création de l'incident ; le moteur de corrélation peut toujours fusionner les alertes avec d'autres." }
    b: { en: "Event grouping changes how many alerts each run creates, not whether the alerts are correlated with other alerts.", fr: "Le regroupement d'événements change le nombre d'alertes créées à chaque exécution, pas la corrélation des alertes avec d'autres alertes." }
    d: { en: "Turning the rule off and on again does not change how its alerts are correlated.", fr: "Désactiver puis réactiver la règle ne change pas la façon dont ses alertes sont corrélées." }
references:
  - title: Manage existing custom detection rules
    url: https://learn.microsoft.com/en-us/defender-xdr/custom-detection-manage
  - title: Scheduled analytics rules in Microsoft Sentinel
    url: https://learn.microsoft.com/en-us/azure/sentinel/scheduled-rules-overview
