id: sc200-1d-ct-roles
objective: "1.3.7"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove has a Microsoft Sentinel workspace named **LAW1** in a resource group named **RG-Sec**. You plan to collect the logs of an in-house application into a DCR-based custom table by using the Logs ingestion API.

    You need to grant permissions for each task. The solution must follow the principle of least privilege.

    Which role should you assign for each task? To answer, drag the appropriate roles to the correct tasks. Each role may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove dispose d'un espace de travail Microsoft Sentinel nommé **LAW1** dans un groupe de ressources nommé **RG-Sec**. Vous prévoyez de collecter les journaux d'une application interne dans une table personnalisée basée sur une DCR avec l'API d'ingestion de journaux.

    Vous devez accorder les autorisations de chaque tâche. La solution doit respecter le principe du moindre privilège.

    Quel rôle devez-vous attribuer pour chaque tâche ? Pour répondre, faites glisser les rôles appropriés vers les tâches correspondantes. Chaque rôle peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: lac, text: Log Analytics Contributor }
    - { id: mc, text: Monitoring Contributor }
    - { id: mmp, text: Monitoring Metrics Publisher }
    - { id: lar, text: Log Analytics Reader }
    - { id: ssr, text: Microsoft Sentinel Responder }
  targets:
    - id: table
      text: { en: "Admin1 creates and edits the custom table in LAW1", fr: "Admin1 crée et modifie la table personnalisée dans LAW1" }
    - id: dcr
      text: { en: "Admin2 creates the data collection rule in RG-Sec", fr: "Admin2 crée la règle de collecte de données dans RG-Sec" }
    - id: app
      text: { en: "The application's service principal sends records through the data collection rule", fr: "Le principal de service de l'application envoie des enregistrements par la règle de collecte de données" }
answer:
  mapping: { table: lac, dcr: mc, app: mmp }
explanation:
  correct:
    en: Managing tables requires Microsoft.OperationalInsights/workspaces/* on the workspace, which Log Analytics Contributor grants. Creating a DCR requires Microsoft.Insights/dataCollectionRules/write, granted by Monitoring Contributor at the resource group. The application needs Monitoring Metrics Publisher on the DCR, which grants the Microsoft.Insights/Telemetry/Write data action used by the Logs ingestion API.
    fr: La gestion des tables exige Microsoft.OperationalInsights/workspaces/* sur l'espace de travail, qu'accorde Log Analytics Contributor. La création d'une DCR exige Microsoft.Insights/dataCollectionRules/write, accordée par Monitoring Contributor sur le groupe de ressources. L'application a besoin de Monitoring Metrics Publisher sur la DCR, qui accorde l'action de données Microsoft.Insights/Telemetry/Write utilisée par l'API d'ingestion de journaux.
  options:
    lar: { en: "Log Analytics Reader can read data but cannot create tables, DCRs or send data.", fr: "Log Analytics Reader peut lire les données mais ne peut ni créer de tables ou de DCR, ni envoyer de données." }
    ssr: { en: "Microsoft Sentinel Responder manages incidents; it has no permission on tables or DCRs.", fr: "Microsoft Sentinel Responder gère les incidents ; il n'a aucune autorisation sur les tables ni sur les DCR." }
references:
  - title: Add or delete tables and columns in Azure Monitor Logs
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/logs/create-custom-table
  - title: "Tutorial: Send data to Azure Monitor Logs by using the Logs ingestion API (Azure portal)"
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/logs/tutorial-logs-ingestion-portal
