id: sc200-1d-an-details-fields
objective: "1.4.5"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Northwind has a Microsoft Sentinel workspace. You review anomaly rules on the **Anomalies** tab of the Analytics page by using its filters and the details pane of each rule.

    Which item provides each piece of information? To answer, drag the appropriate items to the correct descriptions. Each item may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind dispose d'un espace de travail Microsoft Sentinel. Vous examinez les règles d'anomalie dans l'onglet **Anomalies** de la page Analytique à l'aide de ses filtres et du volet de détails de chaque règle.

    Quel élément fournit chaque information ? Pour répondre, faites glisser les éléments appropriés vers les descriptions correspondantes. Chaque élément peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: threshold, text: Threshold }
    - { id: params, text: Parameters }
    - { id: freq, text: Rule frequency }
    - { id: status, text: Rule status }
    - { id: sources, text: Data sources }
    - { id: version, text: Anomaly version }
  targets:
    - id: t1
      text: { en: "How unusual an event must be before an anomaly is created", fr: "À quel point un événement doit être inhabituel pour qu'une anomalie soit créée" }
    - id: t2
      text: { en: "The time between two log processing jobs of the rule", fr: "Le temps entre deux traitements de journaux de la règle" }
    - id: t3
      text: { en: "Whether an enabled rule runs in Production or Flighting mode", fr: "Si une règle activée s'exécute en mode Production ou Flighting" }
    - id: t4
      text: { en: "The log types that must be ingested for the rule to work", fr: "Les types de journaux qui doivent être ingérés pour que la règle fonctionne" }
answer:
  mapping: { t1: threshold, t2: freq, t3: status, t4: sources }
explanation:
  correct:
    en: Threshold indicates how unusual an event must be to create an anomaly. Rule frequency is the time between log processing jobs. Rule status shows whether an enabled rule runs in Production or Flighting mode. The Data sources filter lists the log types that must be ingested.
    fr: Threshold indique à quel point un événement doit être inhabituel pour créer une anomalie. Rule frequency est le temps entre les traitements de journaux. Rule status indique si une règle activée s'exécute en mode Production ou Flighting. Le filtre Data sources liste les types de journaux qui doivent être ingérés.
  options:
    params: { en: "Parameters are the configurable attributes of the rule, which you change on a customized copy.", fr: "Parameters sont les attributs configurables de la règle, que vous modifiez sur une copie personnalisée." }
    version: { en: "Anomaly version identifies the version of the rule; to change it, you must recreate the rule.", fr: "Anomaly version identifie la version de la règle ; pour la changer, vous devez recréer la règle." }
references:
  - title: Work with anomaly detection analytics rules in Microsoft Sentinel
    url: https://learn.microsoft.com/en-us/azure/sentinel/work-with-anomaly-rules
