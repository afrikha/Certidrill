id: sc200-1b-ad-policy-application
objective: "1.1.8"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    Proseware, Inc. uses Microsoft Defender XDR. Automatic attack disruption uses its default settings.

    Proseware has 300 point-of-sale terminals onboarded to Microsoft Defender for Endpoint. You need to keep attack disruption active on the terminals but disable some of its controls for them. New terminals must be covered automatically, based on their device properties.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Proseware, Inc. utilise Microsoft Defender XDR. L'interruption automatique des attaques utilise ses paramètres par défaut.

    Proseware dispose de 300 terminaux de point de vente intégrés à Microsoft Defender for Endpoint. Vous devez garder l'interruption des attaques active sur ces terminaux, mais désactiver certains de ses contrôles pour eux. Les nouveaux terminaux doivent être couverts automatiquement, en fonction de leurs propriétés d'appareil.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: tag, text: { en: "In Asset rule management, create a tag with a dynamic rule that matches the terminals.", fr: "Dans Asset rule management, créer une étiquette avec une règle dynamique qui correspond aux terminaux." } }
    - { id: rule, text: { en: "In Automated response, on the Policy application tab of Devices, select Create rule and enter a name.", fr: "Dans Automated response, sous l'onglet Policy application de Devices, sélectionner Create rule et saisir un nom." } }
    - { id: pick, text: { en: "Select the tag that identifies the terminals.", fr: "Sélectionner l'étiquette qui identifie les terminaux." } }
    - { id: ctrl, text: { en: "Select the disruption controls to disable, and then submit the rule.", fr: "Sélectionner les contrôles d'interruption à désactiver, puis envoyer la règle." } }
    - { id: none, text: { en: "Set the automation level of the terminals' device group to No automated response.", fr: "Définir le niveau d'automatisation du groupe d'appareils des terminaux sur No automated response." } }
    - { id: case, text: { en: "Open a support case with the subject Attack disruption opt-out.", fr: "Ouvrir un dossier de support avec l'objet Attack disruption opt-out." } }
answer:
  sequence: [ tag, rule, pick, ctrl ]
explanation:
  correct:
    en: |
      Policy application rules (preview) keep attack disruption on while disabling chosen controls for a set of devices. You first create a dynamic tag in Asset rule management so that new terminals get it automatically, then create the rule on the Policy application tab, select the tag and select the controls to disable.
    fr: |
      Les règles Policy application (préversion) gardent l'interruption des attaques active tout en désactivant des contrôles choisis pour un ensemble d'appareils. Vous créez d'abord une étiquette dynamique dans Asset rule management pour que les nouveaux terminaux la reçoivent automatiquement, puis vous créez la règle dans l'onglet Policy application, sélectionnez l'étiquette et choisissez les contrôles à désactiver.
  options:
    none: { en: "No automated response removes all automated response and AIR from the group instead of disabling only some controls.", fr: "No automated response supprime toute réponse automatisée et AIR pour le groupe au lieu de ne désactiver que certains contrôles." }
    case: { en: "An opt-out stops automated actions for the whole tenant.", fr: "Un retrait arrête les actions automatisées pour tout le locataire." }
references:
  - title: Exclude assets from automated responses in automatic attack disruption
    url: https://learn.microsoft.com/en-us/defender-xdr/automatic-attack-disruption-exclusions
