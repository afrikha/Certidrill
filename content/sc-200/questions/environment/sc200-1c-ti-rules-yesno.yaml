id: sc200-1c-ti-rules-yesno
objective: "1.3.6"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Litware ingests threat intelligence into its Microsoft Sentinel workspace from two TAXII data connectors and from a script that calls the Threat Intelligence upload API. You plan to create ingestion rules to reduce noise.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware ingère du renseignement sur les menaces dans son espace de travail Microsoft Sentinel depuis deux connecteurs de données TAXII et depuis un script qui appelle l'API de chargement du renseignement sur les menaces. Vous prévoyez de créer des règles d'ingestion pour réduire le bruit.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: An ingestion rule with a Delete action can skip low-confidence indicators that the script sends through the upload API.
        fr: Une règle d'ingestion avec une action Delete peut écarter les indicateurs de faible confiance que le script envoie par l'API de chargement.
    - id: s2
      text:
        en: A new ingestion rule can take up to 15 minutes to take effect.
        fr: Une nouvelle règle d'ingestion peut mettre jusqu'à 15 minutes à prendre effet.
    - id: s3
      text:
        en: The script can send up to 100 STIX objects in a single upload API request.
        fr: Le script peut envoyer jusqu'à 100 objets STIX dans une seule requête de l'API de chargement.
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: Ingestion rules apply to data connectors only; they don't affect threat intelligence added through the upload API or created manually. New and edited rules take up to 15 minutes to take effect. The upload API accepts 100 objects per request and 100 requests per minute.
    fr: Les règles d'ingestion ne s'appliquent qu'aux connecteurs de données ; elles n'affectent pas le renseignement sur les menaces ajouté par l'API de chargement ni celui créé manuellement. Les règles nouvelles ou modifiées mettent jusqu'à 15 minutes à prendre effet. L'API de chargement accepte 100 objets par requête et 100 requêtes par minute.
references:
  - title: Threat intelligence in Microsoft Sentinel
    url: https://learn.microsoft.com/en-us/azure/sentinel/understand-threat-intelligence
  - title: Import threat intelligence to Microsoft Sentinel with the upload API (Preview)
    url: https://learn.microsoft.com/en-us/azure/sentinel/stix-objects-api
