id: sc200-1c-act-policy-hotarea
objective: "1.3.5"
type: hotarea
difficulty: 2
status: draft
stem:
  en: |
    On March 1, you used **Launch Azure Policy Assignment wizard** on the Azure Key Vault connector page of the Microsoft Sentinel workspace **law-woodgrove**. You set the scope to the subscription **Sub1** and left **Create a remediation task** cleared. The key vaults of Woodgrove Bank are shown in the following table.

    Answer each prompt by selecting the key vault that matches it.

    NOTE: Each correct selection is worth one point.
  fr: |
    Le 1er mars, vous avez utilisé **Launch Azure Policy Assignment wizard** dans la page du connecteur Azure Key Vault de l'espace de travail Microsoft Sentinel **law-woodgrove**. Vous avez défini l'étendue sur l'abonnement **Sub1** et laissé **Create a remediation task** décoché. Les coffres de clés de Woodgrove Bank figurent dans le tableau suivant.

    Répondez à chaque consigne en sélectionnant le coffre de clés qui lui correspond.

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
    - id: p1
      text: { en: "This key vault sends its logs to law-woodgrove because of the assignment, with no further action.", fr: "Ce coffre de clés envoie ses journaux vers law-woodgrove grâce à l'attribution, sans autre action." }
    - id: p2
      text: { en: "This key vault starts sending its logs to law-woodgrove only after a remediation task runs for the assignment.", fr: "Ce coffre de clés ne commence à envoyer ses journaux vers law-woodgrove qu'après l'exécution d'une tâche de correction pour l'attribution." }
  grid:
    header: [{ en: "Key vault", fr: "Coffre de clés" }, { en: "Subscription", fr: "Abonnement" }, { en: "Created on", fr: "Créé le" }, { en: "Diagnostic setting before March 1", fr: "Paramètre de diagnostic avant le 1er mars" }]
    rows:
      - [{ text: kv-app1, area: app1 }, { text: Sub1 }, { text: { en: "January 10", fr: "10 janvier" } }, { text: { en: "None", fr: "Aucun" } }]
      - [{ text: kv-app2, area: app2 }, { text: Sub1 }, { text: { en: "March 15", fr: "15 mars" } }, { text: { en: "Not applicable", fr: "Sans objet" } }]
      - [{ text: kv-hr, area: hr }, { text: Sub2 }, { text: { en: "March 20", fr: "20 mars" } }, { text: { en: "Not applicable", fr: "Sans objet" } }]
      - [{ text: kv-fin, area: fin }, { text: Sub2 }, { text: { en: "February 2", fr: "2 février" } }, { text: { en: "None", fr: "Aucun" } }]
answer:
  values: { p1: app2, p2: app1 }
explanation:
  correct:
    en: A policy assigned from the connector applies to the resources of its scope that are added in the future, so kv-app2, created in Sub1 after the assignment, is configured automatically. Existing resources of the scope, such as kv-app1, are configured only by a remediation task. kv-hr and kv-fin are in Sub2, outside the scope, so neither the assignment nor a remediation task configures them.
    fr: "Une stratégie attribuée depuis le connecteur s'applique aux ressources de son étendue ajoutées par la suite ; kv-app2, créé dans Sub1 après l'attribution, est donc configuré automatiquement. Les ressources existantes de l'étendue, comme kv-app1, ne sont configurées que par une tâche de correction. kv-hr et kv-fin se trouvent dans Sub2, hors de l'étendue : ni l'attribution ni une tâche de correction ne les configurent."
references:
  - title: Connect Microsoft Sentinel to other Microsoft services by using diagnostic settings-based connections
    url: https://learn.microsoft.com/en-us/azure/sentinel/connect-services-diagnostic-setting-based
