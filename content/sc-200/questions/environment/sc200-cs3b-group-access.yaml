id: sc200-cs3b-group-access
objective: "1.1.9"
type: yesno_statements
caseStudy: sc200-cs3b-humongous-insurance
difficulty: 1
status: draft
stem:
  en: |
    You review the device group configuration of Defender for Endpoint.

    For each of the following statements, select Yes if the statement is true. Otherwise, select No.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous examinez la configuration des groupes d'appareils de Defender pour point de terminaison.

    Pour chacune des affirmations suivantes, sélectionnez Oui si l'affirmation est vraie. Sinon, sélectionnez Non.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text: { en: "All users who have access to the Defender portal can view the devices in DG-Brokers.", fr: "Tous les utilisateurs qui ont accès au portail Defender peuvent voir les appareils de DG-Brokers." }
    - id: s2
      text: { en: "You can grant a Microsoft Entra group access to DG-Brokers before the group is assigned an RBAC role.", fr: "Vous pouvez accorder à un groupe Microsoft Entra l'accès à DG-Brokers avant que le groupe reçoive un rôle RBAC." }
    - id: s3
      text: { en: "You can promote Ungrouped devices (default) to rank 1.", fr: "Vous pouvez promouvoir Ungrouped devices (default) au rang 1." }
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: |
      A device group with no Microsoft Entra user group assigned is accessible to all users who have portal access, which is the case of DG-Brokers. Only Entra groups that already have an RBAC role can be assigned to a device group. The rank of Ungrouped devices (default) cannot be changed, and the group cannot be deleted; only its remediation level and its user access can be changed.
    fr: |
      Un groupe d'appareils auquel aucun groupe d'utilisateurs Microsoft Entra n'est attribué est accessible à tous les utilisateurs ayant accès au portail, ce qui est le cas de DG-Brokers. Seuls les groupes Entra qui ont déjà un rôle RBAC peuvent être attribués à un groupe d'appareils. Le rang de Ungrouped devices (default) ne peut pas être modifié et le groupe ne peut pas être supprimé : seuls son niveau de correction et l'accès des utilisateurs peuvent être modifiés.
  options:
    s2: { en: "The Microsoft Entra user groups must be configured with RBAC roles before you assign them to a device group.", fr: "Les groupes d'utilisateurs Microsoft Entra doivent être configurés avec des rôles RBAC avant d'être attribués à un groupe d'appareils." }
    s3: { en: "The default group always matches last: its rank is fixed.", fr: "Le groupe par défaut est toujours évalué en dernier : son rang est fixe." }
references:
  - title: Create and manage device groups in Microsoft Defender for Endpoint
    url: https://learn.microsoft.com/en-us/defender-endpoint/machine-groups
