id: sc200-1a-af-allowblock-prereq
objective: "1.1.3"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Adatum Corporation uses Microsoft Defender for Endpoint Plan 2 on Windows 11 devices. Analysts must be able to block a malicious file directly from the file's page in the Microsoft Defender portal.

    How should you complete the requirements? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum Corporation utilise Microsoft Defender pour point de terminaison Plan 2 sur des appareils Windows 11. Les analystes doivent pouvoir bloquer un fichier malveillant directement depuis la page du fichier dans le portail Microsoft Defender.

    Comment devez-vous compléter les exigences ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Microsoft Defender Antivirus must run in [[mode]].
      [[prot]] must be turned on.
      The [[feature]] advanced feature must be turned on.
    fr: |
      L'Antivirus Microsoft Defender doit s'exécuter en [[mode]].
      [[prot]] doit être activée.
      La fonctionnalité avancée [[feature]] doit être activée.
  slots:
    - id: mode
      options:
        - { id: active, text: { en: "active mode", fr: "mode actif" } }
        - { id: passive, text: { en: "passive mode", fr: "mode passif" } }
        - { id: edrblock, text: { en: "EDR in block mode only", fr: "mode blocage EDR uniquement" } }
    - id: prot
      options:
        - { id: cloud, text: { en: "Cloud-based protection", fr: "La protection fournie par le cloud" } }
        - { id: netprot, text: { en: "Network protection", fr: "La protection réseau" } }
        - { id: tamper, text: { en: "Tamper protection", fr: "La protection contre les falsifications" } }
    - id: feature
      options:
        - { id: aob, text: Allow or block file }
        - { id: cni, text: Custom network indicators }
        - { id: edr, text: EDR in block mode }
answer:
  values: { mode: active, prot: cloud, feature: aob }
explanation:
  correct:
    en: Blocking a file from its page relies on file indicators. The **Allow or block file** advanced feature requires Microsoft Defender Antivirus as the active antimalware solution and cloud-based protection turned on. File indicators aren't supported when Defender Antivirus is in passive mode.
    fr: Bloquer un fichier depuis sa page repose sur les indicateurs de fichier. La fonctionnalité avancée **Allow or block file** exige que l'Antivirus Microsoft Defender soit la solution anti-programme malveillant active et que la protection fournie par le cloud soit activée. Les indicateurs de fichier ne sont pas pris en charge lorsque l'Antivirus Defender est en mode passif.
  options:
    passive: { en: "Indicators aren't supported when Defender Antivirus runs in passive mode.", fr: "Les indicateurs ne sont pas pris en charge lorsque l'Antivirus Defender est en mode passif." }
    netprot: { en: "Network protection enforces IP, URL and domain indicators, not file indicators.", fr: "La protection réseau applique les indicateurs d'IP, d'URL et de domaine, pas les indicateurs de fichier." }
    cni: { en: "Custom network indicators enables IP, URL and domain indicators.", fr: "Custom network indicators active les indicateurs d'IP, d'URL et de domaine." }
    edr: { en: "EDR in block mode blocks EDR detections; it does not let analysts block a file hash.", fr: "EDR in block mode bloque les détections EDR ; il ne permet pas aux analystes de bloquer un hachage de fichier." }
references:
  - title: Configure Advanced Features in Microsoft Defender for Endpoint
    url: https://learn.microsoft.com/en-us/defender-endpoint/advanced-features
  - title: Create indicators for files
    url: https://learn.microsoft.com/en-us/defender-endpoint/indicator-file
