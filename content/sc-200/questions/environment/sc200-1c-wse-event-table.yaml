id: sc200-1c-wse-event-table
objective: "1.3.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An administrator at Adatum created a data collection rule named **DCR-Win** from **Azure Monitor > Data collection rules**. DCR-Win uses the Windows Event Logs data source, collects the Security log of 20 servers, and sends the data to **law-adatum**, a workspace enabled for Microsoft Sentinel.

    The analytics rules of the Windows Security Events solution never trigger. You find the Security events in the `Event` table.

    You need the built-in rules to work without modification. The solution must avoid duplicate ingestion.

    What should you do?
  fr: |
    Un administrateur d'Adatum a créé une règle de collecte de données nommée **DCR-Win** depuis **Azure Monitor > Règles de collecte de données**. DCR-Win utilise la source de données Windows Event Logs, collecte le journal Sécurité de 20 serveurs et envoie les données vers **law-adatum**, un espace de travail activé pour Microsoft Sentinel.

    Les règles d'analytique de la solution Windows Security Events ne se déclenchent jamais. Vous trouvez les événements de sécurité dans la table `Event`.

    Les règles intégrées doivent fonctionner sans modification. La solution doit éviter une ingestion en double.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Use the Windows Security Events via AMA connector for the servers, and remove the Security log from DCR-Win.", fr: "Utiliser le connecteur Windows Security Events via AMA pour les serveurs, et retirer le journal Sécurité de DCR-Win." }
    - id: b
      text: { en: "Change the event filter of DCR-Win from Basic to Custom and enter XPath queries for the Security log.", fr: "Faire passer le filtre d'événements de DCR-Win de Basic à Custom et saisir des requêtes XPath pour le journal Sécurité." }
    - id: c
      text: { en: "Change the destination of DCR-Win to a new workspace enabled for Microsoft Sentinel.", fr: "Remplacer la destination de DCR-Win par un nouvel espace de travail activé pour Microsoft Sentinel." }
    - id: d
      text: { en: "Edit the analytics rules of the solution so that they query the Event table.", fr: "Modifier les règles d'analytique de la solution pour qu'elles interrogent la table Event." }
answer: { optionId: a }
explanation:
  correct:
    en: When you select the Security log in a generic Windows Event Logs data source, the events go to the `Event` table with the other Windows logs. The Windows Security Events via AMA connector uses the same agent and collects the same events but sends them to `SecurityEvent`, which Microsoft Sentinel content uses. Removing the Security log from DCR-Win avoids paying twice for the same events.
    fr: Lorsque vous sélectionnez le journal Sécurité dans une source de données générique Windows Event Logs, les événements vont dans la table `Event` avec les autres journaux Windows. Le connecteur Windows Security Events via AMA utilise le même agent et collecte les mêmes événements, mais les envoie dans `SecurityEvent`, que le contenu Microsoft Sentinel utilise. Retirer le journal Sécurité de DCR-Win évite de payer deux fois les mêmes événements.
  options:
    b:
      en: XPath queries only change which events are collected; the Windows Event Logs data source still stores them in the Event table.
      fr: Les requêtes XPath changent seulement les événements collectés ; la source de données Windows Event Logs les stocke toujours dans la table Event.
    c:
      en: Whatever the workspace, this data source still writes to the Event table.
      fr: Quel que soit l'espace de travail, cette source de données écrit toujours dans la table Event.
    d:
      en: The requirement is to use the built-in rules without modification.
      fr: L'exigence est d'utiliser les règles intégrées sans les modifier.
references:
  - title: Collect Windows events from virtual machines with Azure Monitor Agent
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/vm/data-collection-windows-events
