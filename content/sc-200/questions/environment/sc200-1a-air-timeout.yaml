id: sc200-1a-air-timeout
objective: "1.1.7"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    Adatum Corporation uses Microsoft Defender for Endpoint Plan 2. The device group **Servers** uses the automation level **Semi - require approval for all folders**. The SOC manager wants to know what happens to the remediation actions that analysts don't review.

    How should you complete the explanation? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum Corporation utilise Microsoft Defender pour point de terminaison Plan 2. Le groupe d'appareils **Servers** utilise le niveau d'automatisation **Semi - require approval for all folders**. Le responsable du SOC veut savoir ce qu'il advient des actions de correction que les analystes n'examinent pas.

    Comment devez-vous compléter l'explication ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      The remediation actions appear on the [[tab]] tab of the Action center. An action that nobody approves within [[days]] times out, and the timeout counts as [[result]].
    fr: |
      Les actions de correction apparaissent dans l'onglet [[tab]] du centre de notifications. Une action que personne n'approuve dans un délai de [[days]] expire, et cette expiration compte comme [[result]].
  slots:
    - id: tab
      options:
        - { id: pending, text: Pending }
        - { id: history, text: History }
        - { id: invest, text: Investigations }
    - id: days
      options:
        - { id: h24, text: { en: "24 hours", fr: "24 heures" } }
        - { id: d7, text: { en: "7 days", fr: "7 jours" } }
        - { id: d30, text: { en: "30 days", fr: "30 jours" } }
    - id: result
      options:
        - { id: reject, text: { en: "a rejection", fr: "un rejet" } }
        - { id: approve, text: { en: "an approval", fr: "une approbation" } }
        - { id: retry, text: { en: "a new pending action", fr: "une nouvelle action en attente" } }
answer:
  values: { tab: pending, days: d7, result: reject }
explanation:
  correct:
    en: With semi-automation, actions that need approval appear on the **Pending** tab of the Action center, where analysts approve or reject them. A pending action times out after 7 days, and a timeout counts the same as a rejection. The History tab lists completed actions.
    fr: Avec la semi-automatisation, les actions qui demandent une approbation apparaissent dans l'onglet **Pending** du centre de notifications, où les analystes les approuvent ou les rejettent. Une action en attente expire au bout de 7 jours, et une expiration compte comme un rejet. L'onglet History liste les actions terminées.
  options:
    history: { en: "History is the audit log of actions already taken, where some actions can be undone.", fr: "History est le journal d'audit des actions déjà effectuées, où certaines actions peuvent être annulées." }
    approve: { en: "A timeout never runs the action; it is treated as a rejection.", fr: "Une expiration n'exécute jamais l'action ; elle est traitée comme un rejet." }
references:
  - title: Automation levels in automated investigation and remediation
    url: https://learn.microsoft.com/en-us/defender-endpoint/automation-levels
  - title: Go to the Action center to view and approve your automated investigation and remediation tasks
    url: https://learn.microsoft.com/en-us/defender-xdr/m365d-action-center
