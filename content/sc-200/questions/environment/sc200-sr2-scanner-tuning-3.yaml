id: sc200-sr2-scanner-tuning-3
objective: "1.1.2"
type: series_yesno
series: sc200-sr2-scanner-tuning
seriesOrder: 3
difficulty: 3
status: draft
stem:
  en: You create an alert tuning rule with the Set as behavior action.
  fr: Vous créez une règle de réglage des alertes avec l'action Set as behavior.
body:
  solution:
    en: In **Settings > Microsoft Defender XDR > Alert tuning**, you add a rule for the **Microsoft Defender for Endpoint** service source with a file condition that matches **C:\Tools\NetScan\netscan.exe**, and you select the **Set as behavior** action.
    fr: Dans **Paramètres > Microsoft Defender XDR > Alert tuning**, vous ajoutez une règle pour la source de service **Microsoft Defender for Endpoint** avec une condition de fichier qui correspond à **C:\Tools\NetScan\netscan.exe**, et vous sélectionnez l'action **Set as behavior**.
answer: { value: false }
explanation:
  correct:
    en: Set as behavior converts the matching signals into behaviors that never reach the alert queue or create incidents. The behaviors are stored in the BehaviorInfo and BehaviorEntities tables, not as alerts in AlertInfo and AlertEvidence, so the second requirement is not met.
    fr: "Set as behavior convertit les signaux correspondants en comportements qui n'atteignent jamais la file d'alertes et ne créent pas d'incidents. Les comportements sont stockés dans les tables BehaviorInfo et BehaviorEntities, et non comme alertes dans AlertInfo et AlertEvidence : la deuxième exigence n'est pas satisfaite."
references:
  - title: Investigate alerts in Microsoft Defender XDR
    url: https://learn.microsoft.com/en-us/defender-xdr/investigate-alerts
