id: sc200-sr1-anomaly-threshold-1
objective: "1.4.5"
type: series_yesno
series: sc200-sr1-anomaly-threshold
seriesOrder: 1
difficulty: 2
status: draft
stem:
  en: You duplicate Anomaly1, raise the threshold of the copy and enable the copy in Flighting mode.
  fr: Vous dupliquez Anomaly1, augmentez le seuil de la copie et activez la copie en mode Flighting.
body:
  solution:
    en: |
      On the **Anomalies** tab of **Microsoft Sentinel > Configuration > Analytics**, you select **Duplicate** for Anomaly1. You edit the copy, raise its threshold, keep its status set to **Flighting**, and enable it. You then query the Anomalies table and filter on the **AnomalyTemplateId** of Anomaly1.
    fr: |
      Dans l'onglet **Anomalies** de **Microsoft Sentinel > Configuration > Analytics**, vous sélectionnez **Duplicate** pour Anomaly1. Vous modifiez la copie, augmentez son seuil, laissez son statut sur **Flighting** et l'activez. Vous interrogez ensuite la table Anomalies en filtrant sur l'**AnomalyTemplateId** d'Anomaly1.
answer: { value: true }
explanation:
  correct:
    en: |
      A duplicated anomaly rule runs in Flighting mode by default, while the original keeps running in Production until you disable it. Both write to the Anomalies table, and filtering on the template ID returns the results of the original and of the customized copy side by side.
    fr: |
      Une règle d'anomalie dupliquée s'exécute par défaut en mode Flighting, tandis que l'originale continue de s'exécuter en Production jusqu'à ce que vous la désactiviez. Les deux écrivent dans la table Anomalies, et un filtre sur l'ID de modèle renvoie côte à côte les résultats de l'originale et de la copie personnalisée.
references:
  - title: Work with anomaly detection analytics rules in Microsoft Sentinel
    url: https://learn.microsoft.com/en-us/azure/sentinel/work-with-anomaly-rules
