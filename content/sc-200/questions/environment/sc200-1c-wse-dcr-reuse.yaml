id: sc200-1c-wse-dcr-reuse
objective: "1.3.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Tailspin Toys has 120 Windows servers: Azure virtual machines and Azure Arc-enabled servers in three Azure subscriptions of the same tenant. All the servers must send the same set of Security events, defined by one XPath query, to the Microsoft Sentinel workspace **law-tailspin**.

    You need to configure the collection. The solution must minimize administrative effort.

    What should you create?
  fr: |
    Tailspin Toys dispose de 120 serveurs Windows : des machines virtuelles Azure et des serveurs Azure Arc répartis dans trois abonnements Azure du même locataire. Tous les serveurs doivent envoyer le même ensemble d'événements de sécurité, défini par une requête XPath, à l'espace de travail Microsoft Sentinel **law-tailspin**.

    Vous devez configurer la collecte. La solution doit réduire au minimum l'effort d'administration.

    Que devez-vous créer ?
body:
  options:
    - id: a
      text: { en: "One data collection rule per server, each with the XPath query", fr: "Une règle de collecte de données par serveur, chacune avec la requête XPath" }
    - id: b
      text: { en: "One data collection rule per subscription and one workspace per subscription", fr: "Une règle de collecte de données par abonnement et un espace de travail par abonnement" }
    - id: c
      text: { en: "One data collection rule with the XPath query, associated with all the servers", fr: "Une règle de collecte de données avec la requête XPath, associée à tous les serveurs" }
    - id: d
      text: { en: "One Group Policy object that configures the advanced audit policy of the servers", fr: "Un objet de stratégie de groupe qui configure la stratégie d'audit avancée des serveurs" }
answer: { optionId: c }
explanation:
  correct:
    en: A data collection rule is independent of the workspace and of the machine, so one rule can be associated with many machines and reused across environments. A single rule with the XPath query, created from the Windows Security Events via AMA connector and targeting all the servers, is the least effort.
    fr: "Une règle de collecte de données est indépendante de l'espace de travail et de la machine : une même règle peut être associée à de nombreuses machines et réutilisée entre environnements. Une seule règle avec la requête XPath, créée depuis le connecteur Windows Security Events via AMA et ciblant tous les serveurs, représente le moindre effort."
  options:
    a:
      en: One rule per server works but multiplies the objects to create and maintain.
      fr: Une règle par serveur fonctionne, mais multiplie les objets à créer et à maintenir.
    b:
      en: The servers must send to law-tailspin; extra workspaces would split the data.
      fr: Les serveurs doivent envoyer vers law-tailspin ; des espaces de travail supplémentaires disperseraient les données.
    d:
      en: An audit policy controls which events Windows writes locally; it doesn't send anything to Microsoft Sentinel.
      fr: Une stratégie d'audit contrôle les événements que Windows écrit localement ; elle n'envoie rien à Microsoft Sentinel.
references:
  - title: Connect Microsoft Sentinel to other Microsoft services with a Windows agent-based data connector
    url: https://learn.microsoft.com/en-us/azure/sentinel/connect-services-windows-based
