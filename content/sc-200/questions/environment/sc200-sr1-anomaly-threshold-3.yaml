id: sc200-sr1-anomaly-threshold-3
objective: "1.4.5"
type: series_yesno
series: sc200-sr1-anomaly-threshold
seriesOrder: 3
difficulty: 3
status: draft
stem:
  en: You duplicate Anomaly1, raise the threshold of the copy and switch the copy to Production.
  fr: Vous dupliquez Anomaly1, augmentez le seuil de la copie et faites passer la copie en Production.
body:
  solution:
    en: |
      On the **Anomalies** tab, you select **Duplicate** for Anomaly1. You edit the copy, raise its threshold, and on the **General** tab you change its status from **Flighting** to **Production**. You then enable the copy.
    fr: |
      Dans l'onglet **Anomalies**, vous sélectionnez **Duplicate** pour Anomaly1. Vous modifiez la copie, augmentez son seuil et, dans l'onglet **General**, faites passer son statut de **Flighting** à **Production**. Vous activez ensuite la copie.
answer: { value: false }
explanation:
  correct:
    en: |
      Two versions of the same anomaly rule cannot run in Production at the same time. When the customized copy is switched to Production, the original Anomaly1 automatically switches to Flighting, so the anomalies used by the SOC would come from the higher threshold instead of the current configuration.
    fr: |
      Deux versions d'une même règle d'anomalie ne peuvent pas s'exécuter en Production en même temps. Quand la copie personnalisée passe en Production, l'Anomaly1 d'origine passe automatiquement en Flighting : les anomalies utilisées par le SOC proviendraient du seuil plus élevé au lieu de la configuration actuelle.
references:
  - title: Work with anomaly detection analytics rules in Microsoft Sentinel
    url: https://learn.microsoft.com/en-us/azure/sentinel/work-with-anomaly-rules
