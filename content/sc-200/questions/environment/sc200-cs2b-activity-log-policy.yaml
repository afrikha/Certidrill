id: sc200-cs2b-activity-log-policy
objective: "1.3.5"
type: single
caseStudy: sc200-cs2b-consolidated-messenger
difficulty: 2
status: draft
stem:
  en: |
    You enable the Azure Activity connector in law-cm-sec.

    You need to meet the activity log collection requirement.

    What should you do?
  fr: |
    Vous activez le connecteur Azure Activity dans law-cm-sec.

    Vous devez répondre à l'exigence de collecte des journaux d'activité.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Assign the built-in policy that streams Activity logs to law-cm-sec at the MG-CM-Prod scope, without a remediation task", fr: "Attribuer la stratégie intégrée qui transmet les journaux d'activité à law-cm-sec à l'étendue MG-CM-Prod, sans tâche de correction" } }
    - { id: b, text: { en: "Assign the built-in policy that streams Activity logs to law-cm-sec at the MG-CM-Prod scope, with a remediation task", fr: "Attribuer la stratégie intégrée qui transmet les journaux d'activité à law-cm-sec à l'étendue MG-CM-Prod, avec une tâche de correction" } }
    - { id: c, text: { en: "Create an Activity log diagnostic setting that sends the logs to law-cm-sec in each of the 18 subscriptions", fr: "Créer dans chacun des 18 abonnements un paramètre de diagnostic du journal d'activité qui envoie les journaux à law-cm-sec" } }
    - { id: d, text: { en: "Create a data collection rule that collects Activity logs and associate it with every resource group in MG-CM-Prod", fr: "Créer une règle de collecte de données qui collecte les journaux d'activité et l'associer à chaque groupe de ressources de MG-CM-Prod" } }
answer: { optionId: b }
explanation:
  correct:
    en: A DeployIfNotExists policy assigned at the management group scope applies the Activity log diagnostic setting to every subscription under MG-CM-Prod, including subscriptions added later. A policy only evaluates new or updated resources, so a remediation task is needed to deploy the diagnostic setting to the 18 existing subscriptions.
    fr: |
      Une stratégie DeployIfNotExists attribuée à l'étendue du groupe d'administration applique le paramètre de diagnostic du journal d'activité à chaque abonnement sous MG-CM-Prod, y compris aux abonnements ajoutés plus tard. Une stratégie n'évalue que les ressources nouvelles ou mises à jour : une tâche de correction est nécessaire pour déployer le paramètre de diagnostic sur les 18 abonnements existants.
  options:
    a: { en: "Without a remediation task, the existing subscriptions are not configured; only new ones are.", fr: "Sans tâche de correction, les abonnements existants ne sont pas configurés ; seuls les nouveaux le sont." }
    c: { en: "Manual settings do not cover the subscriptions added every month and increase administrative effort.", fr: "Des paramètres manuels ne couvrent pas les abonnements ajoutés chaque mois et augmentent l'effort d'administration." }
    d: { en: "The Activity log is a subscription-level platform log collected by a diagnostic setting, not by a data collection rule associated with resource groups.", fr: "Le journal d'activité est un journal de plateforme de niveau abonnement collecté par un paramètre de diagnostic, pas par une règle de collecte de données associée à des groupes de ressources." }
references:
  - title: Connect Microsoft Sentinel to other Microsoft services by using diagnostic settings-based connections
    url: https://learn.microsoft.com/en-us/azure/sentinel/connect-services-diagnostic-setting-based
