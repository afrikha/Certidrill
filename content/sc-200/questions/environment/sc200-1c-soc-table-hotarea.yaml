id: sc200-1c-soc-table-hotarea
objective: "1.2.4"
type: hotarea
difficulty: 3
status: draft
stem:
  en: |
    Proseware has a Microsoft Sentinel workspace named **law-proseware**. UEBA is enabled. The following table shows how five billable tables were used during the last 30 days. Each table ingested data every day.

    Answer each prompt by selecting the table that matches it.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware dispose d'un espace de travail Microsoft Sentinel nommé **law-proseware**. L'UEBA est activée. Le tableau suivant montre comment cinq tables facturables ont été utilisées au cours des 30 derniers jours. Chaque table a ingéré des données tous les jours.

    Répondez à chaque consigne en sélectionnant la table qui lui correspond.

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
    - id: p1
      text: { en: "SOC optimization can suggest moving this table to a nonsecurity Log Analytics workspace.", fr: "L'optimisation SOC peut suggérer de déplacer cette table vers un espace de travail Log Analytics hors sécurité." }
    - id: p2
      text: { en: "SOC optimization can suggest turning on analytics rule templates or moving this table to the Basic logs plan.", fr: "L'optimisation SOC peut suggérer d'activer des modèles de règles d'analytique ou de passer cette table au plan Basic logs." }
  grid:
    header: [{ en: "Table", fr: "Table" }, { en: "Used by analytics rules", fr: "Utilisée par des règles d'analytique" }, { en: "Other use", fr: "Autre utilisation" }]
    rows:
      - [{ text: AppTraceLogs_CL, area: apptrace }, { text: { en: "No", fr: "Non" } }, { text: { en: "Azure Monitor log search alert rules only", fr: "Règles d'alerte de recherche dans les journaux Azure Monitor uniquement" } }]
      - [{ text: AWSVPCFlow, area: vpcflow }, { text: { en: "No", fr: "Non" } }, { text: { en: "Hunting queries and a workbook", fr: "Requêtes de chasse et un classeur" } }]
      - [{ text: AuditLogs, area: audit }, { text: { en: "No", fr: "Non" } }, { text: { en: "Data source of UEBA", fr: "Source de données de l'UEBA" } }]
      - [{ text: Syslog, area: syslog }, { text: { en: "Yes, three scheduled rules", fr: "Oui, trois règles planifiées" } }, { text: { en: "Hunting queries", fr: "Requêtes de chasse" } }]
      - [{ text: StorageBlobLogs, area: blob }, { text: { en: "No", fr: "Non" } }, { text: { en: "None", fr: "Aucune" } }]
answer:
  values: { p1: apptrace, p2: vpcflow }
explanation:
  correct:
    en: A table used only by Azure Monitor gets a data value recommendation to turn on relevant rule templates or move it to a nonsecurity workspace. A table that detections don't use but workbooks or hunting queries do gets a suggestion to turn on templates or move it to the Basic logs plan if it's eligible. A table not used at all (StorageBlobLogs) gets a suggestion to turn on templates or stop its ingestion. Tables used by UEBA (AuditLogs) never get ingestion change recommendations, and Syslog is used by rules.
    fr: Une table utilisée uniquement par Azure Monitor reçoit une recommandation de valeur des données pour activer des modèles de règles pertinents ou la déplacer vers un espace de travail hors sécurité. Une table que les détections n'utilisent pas mais que des classeurs ou des requêtes de chasse utilisent reçoit une suggestion d'activer des modèles ou de passer au plan Basic logs si elle est éligible. Une table qui n'est pas utilisée du tout (StorageBlobLogs) reçoit une suggestion d'activer des modèles ou d'arrêter son ingestion. Les tables utilisées par l'UEBA (AuditLogs) ne reçoivent jamais de recommandation de modification de l'ingestion, et Syslog est utilisée par des règles.
references:
  - title: SOC optimization reference
    url: https://learn.microsoft.com/en-us/azure/sentinel/soc-optimization/soc-optimization-reference
