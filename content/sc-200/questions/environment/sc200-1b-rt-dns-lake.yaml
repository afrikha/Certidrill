id: sc200-1b-rt-dns-lake
objective: "1.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam, Inc. has a Microsoft Sentinel workspace onboarded to the Microsoft Defender portal and to the Microsoft Sentinel data lake. A custom table named **DnsDebug_CL** receives 400 GB of verbose DNS logs per day.

    No analytics rule or workbook uses DnsDebug_CL. Investigators query it occasionally, and a daily KQL job summarizes it into a small analytics table. The data must be kept for one year.

    You need to configure DnsDebug_CL. The solution must minimize cost.

    What should you configure?
  fr: |
    Fabrikam, Inc. dispose d'un espace de travail Microsoft Sentinel intégré au portail Microsoft Defender et au data lake Microsoft Sentinel. Une table personnalisée nommée **DnsDebug_CL** reçoit 400 Go de journaux DNS détaillés par jour.

    Aucune règle d'analyse ni aucun classeur n'utilise DnsDebug_CL. Les enquêteurs l'interrogent occasionnellement, et une tâche KQL quotidienne la résume dans une petite table Analytics. Les données doivent être conservées un an.

    Vous devez configurer DnsDebug_CL. La solution doit réduire les coûts au minimum.

    Que devez-vous configurer ?
body:
  options:
    - { id: a, text: { en: "Analytics tier, analytics retention 1 year", fr: "Niveau Analytics, rétention Analytics d'un an" } }
    - { id: b, text: { en: "Analytics tier, analytics retention 30 days, total retention 1 year", fr: "Niveau Analytics, rétention Analytics de 30 jours, rétention totale d'un an" } }
    - { id: c, text: { en: "Analytics tier, analytics retention 90 days, total retention 1 year", fr: "Niveau Analytics, rétention Analytics de 90 jours, rétention totale d'un an" } }
    - { id: d, text: { en: "Data lake tier, retention 1 year", fr: "Niveau Data Lake, rétention d'un an" } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      The Data lake tier is designed for high-volume, secondary data that doesn't feed real-time analytics. It keeps DnsDebug_CL for one year at low cost, investigators can still query it, and KQL jobs can promote summarized results to an analytics table.
    fr: |
      Le niveau Data Lake est conçu pour les données volumineuses et secondaires qui n'alimentent pas l'analytique en temps réel. Il conserve DnsDebug_CL pendant un an à bas coût, les enquêteurs peuvent toujours l'interroger, et des tâches KQL peuvent promouvoir des résultats résumés vers une table Analytics.
  options:
    a: { en: "A year of analytics retention for 400 GB per day is the most expensive option and the analytics features aren't used.", fr: "Un an de rétention Analytics pour 400 Go par jour est l'option la plus coûteuse, et les fonctionnalités analytiques ne sont pas utilisées." }
    b: { en: "Keeping the table in the Analytics tier still bills analytics ingestion for data that no rule uses.", fr: "Garder la table au niveau Analytics facture toujours l'ingestion Analytics pour des données qu'aucune règle n'utilise." }
    c: { en: "The table is still billed as analytics data, and the first 90 days of fast queries aren't needed.", fr: "La table est toujours facturée comme des données Analytics, et les 90 premiers jours de requêtes rapides ne sont pas nécessaires." }
references:
  - title: Manage data tiers and retention in Microsoft Sentinel
    url: https://learn.microsoft.com/en-us/azure/sentinel/manage-data-overview
  - title: Configure Table Settings in Microsoft Sentinel
    url: https://learn.microsoft.com/en-us/azure/sentinel/manage-table-tiers-retention
