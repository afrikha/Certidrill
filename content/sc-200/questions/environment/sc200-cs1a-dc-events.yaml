id: sc200-cs1a-dc-events
objective: "1.3.2"
type: single
caseStudy: sc200-cs1a-lamna-healthcare
difficulty: 2
status: draft
stem:
  en: |
    You need to configure the collection of domain controller events to meet the domain controller events requirement.

    What should you configure?
  fr: |
    Vous devez configurer la collecte des événements des contrôleurs de domaine pour respecter l'exigence relative aux événements des contrôleurs de domaine.

    Que devez-vous configurer ?
body:
  options:
    - id: a
      text: { en: "The Windows Security Events via AMA connector with a data collection rule that uses the Common event set", fr: "Le connecteur Windows Security Events via AMA avec une règle de collecte de données qui utilise le jeu d'événements Common" }
    - id: b
      text: { en: "The Windows Security Events via AMA connector with a data collection rule that uses a Custom XPath query", fr: "Le connecteur Windows Security Events via AMA avec une règle de collecte de données qui utilise une requête XPath Custom" }
    - id: c
      text: { en: "Windows Event Forwarding to a collector server and the Windows Forwarded Events connector with an XPath query", fr: "Le transfert d'événements Windows vers un serveur collecteur et le connecteur Windows Forwarded Events avec une requête XPath" }
    - id: d
      text: { en: "The Windows Security Events via AMA connector with a data collection rule that uses the Minimal event set", fr: "Le connecteur Windows Security Events via AMA avec une règle de collecte de données qui utilise le jeu d'événements Minimal" }
answer: { optionId: b }
explanation:
  correct:
    en: "The domain controllers are Azure Arc-enabled, so the Azure Monitor Agent can collect their events with the Windows Security Events via AMA connector, which writes to the SecurityEvent table queried by the existing rules. A Custom event set lets you enter an XPath query such as `Security!*[System[(EventID=4625) or (EventID=4740)]]`, which filters at the source and collects only the two required events."
    fr: "Les contrôleurs de domaine sont activés pour Azure Arc : l'agent Azure Monitor peut donc collecter leurs événements avec le connecteur Windows Security Events via AMA, qui écrit dans la table SecurityEvent interrogée par les règles existantes. Le jeu d'événements Custom permet de saisir une requête XPath comme `Security!*[System[(EventID=4625) or (EventID=4740)]]`, qui filtre à la source et ne collecte que les deux événements demandés."
  options:
    a: { en: "The Common event set collects a broad audit trail of many event IDs, which increases ingestion costs beyond the two required events.", fr: "Le jeu Common collecte une piste d'audit large de nombreux ID d'événements, ce qui augmente les coûts d'ingestion au-delà des deux événements demandés." }
    c: { en: "Events forwarded by WEF and collected by the Windows Forwarded Events connector land in the WindowsEvent table, so the existing rules that query SecurityEvent would stop matching.", fr: "Les événements transférés par WEF et collectés par le connecteur Windows Forwarded Events arrivent dans la table WindowsEvent : les règles existantes qui interrogent SecurityEvent ne trouveraient plus rien." }
    d: { en: "The Minimal event set is a predefined list that also contains other event IDs, so it ingests more than the two required events; only a Custom XPath query collects exactly those two.", fr: "Le jeu Minimal est une liste prédéfinie qui contient aussi d'autres ID d'événements : il ingère plus que les deux événements demandés. Seule une requête XPath Custom collecte exactement ces deux événements." }
references:
  - title: Connect Microsoft Sentinel to other Microsoft services with a Windows agent-based data connector
    url: https://learn.microsoft.com/en-us/azure/sentinel/connect-services-windows-based
