id: sc200-1a-notif-least-priv
objective: "1.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Adatum Corporation uses Microsoft Defender XDR. Microsoft Defender for Endpoint uses basic permissions management.

    A security engineer named User1 must create, edit and delete the incident email notification rules in the Microsoft Defender portal.

    You need to assign a Microsoft Entra role to User1. The solution must follow the principle of least privilege.

    Which role should you assign?
  fr: |
    Adatum Corporation utilise Microsoft Defender XDR. Microsoft Defender pour point de terminaison utilise la gestion des autorisations de base.

    Un ingénieur sécurité nommé User1 doit créer, modifier et supprimer les règles de notification par e-mail des incidents dans le portail Microsoft Defender.

    Vous devez attribuer un rôle Microsoft Entra à User1. La solution doit respecter le principe du moindre privilège.

    Quel rôle devez-vous attribuer ?
body:
  options:
    - { id: a, text: Security Reader }
    - { id: b, text: Security Operator }
    - { id: c, text: Global Administrator }
    - { id: d, text: Security Administrator }
answer: { optionId: d }
explanation:
  correct:
    en: Configuring email notification settings requires the **Manage security settings** permission. With basic permissions management, users who have the Security Administrator role or higher can configure the notification rules, so Security Administrator is the least privileged role that works.
    fr: "La configuration des paramètres de notification par e-mail demande l'autorisation **Manage security settings**. Avec la gestion des autorisations de base, les utilisateurs disposant du rôle Security Administrator ou d'un rôle supérieur peuvent configurer les règles de notification : Security Administrator est donc le rôle le moins privilégié qui convient."
  options:
    a:
      en: Security Reader gives read-only access and cannot manage security settings.
      fr: Security Reader donne un accès en lecture seule et ne permet pas de gérer les paramètres de sécurité.
    b:
      en: Security Operator can manage alerts and incidents, but it is not Security Administrator or higher, which the notification settings require.
      fr: Security Operator peut gérer les alertes et les incidents, mais ce n'est pas Security Administrator ni un rôle supérieur, ce qu'exigent les paramètres de notification.
    c:
      en: Global Administrator works, but it grants far more permissions than needed.
      fr: Global Administrator convient, mais il accorde bien plus d'autorisations que nécessaire.
references:
  - title: Get incident notifications by email
    url: https://learn.microsoft.com/en-us/defender-xdr/m365d-notifications-incidents
