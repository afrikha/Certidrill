id: sc200-1a-af-hotarea
objective: "1.1.3"
type: hotarea
difficulty: 3
status: draft
stem:
  en: |
    Litware, Inc. uses Microsoft Defender for Endpoint Plan 2 and Microsoft Intune. Microsoft Defender Antivirus runs in active mode with cloud-based protection on all devices. The advanced features are configured as shown in the following table.

    Two problems are reported. Answer each prompt by selecting the advanced feature that causes the problem.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware, Inc. utilise Microsoft Defender pour point de terminaison Plan 2 et Microsoft Intune. L'Antivirus Microsoft Defender s'exécute en mode actif avec la protection fournie par le cloud sur tous les appareils. Les fonctionnalités avancées sont configurées comme indiqué dans le tableau suivant.

    Deux problèmes sont signalés. Répondez à chaque consigne en sélectionnant la fonctionnalité avancée qui cause le problème.

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
    - id: p1
      text: { en: "An analyst cannot block a file from the file's page in the Defender portal.", fr: "Un analyste ne peut pas bloquer un fichier depuis la page du fichier dans le portail Defender." }
    - id: p2
      text: { en: "Conditional Access policies that require a low device risk don't receive risk data from Defender for Endpoint.", fr: "Les stratégies d'accès conditionnel qui exigent un faible risque d'appareil ne reçoivent pas de données de risque de Defender pour point de terminaison." }
  grid:
    header: [{ en: "Advanced feature", fr: "Fonctionnalité avancée" }, { en: "State", fr: "État" }]
    rows:
      - [{ text: EDR in block mode, area: edr }, { text: "On" }]
      - [{ text: Allow or block file, area: aob }, { text: "Off" }]
      - [{ text: Custom network indicators, area: cni }, { text: "Off" }]
      - [{ text: Live response for servers, area: lrs }, { text: "Off" }]
      - [{ text: Microsoft Defender for Cloud Apps, area: mdca }, { text: "Off" }]
      - [{ text: Microsoft Intune connection, area: intune }, { text: "Off" }]
      - [{ text: Device discovery, area: disc }, { text: "On" }]
answer:
  values: { p1: aob, p2: intune }
explanation:
  correct:
    en: Blocking a file from its page creates a file indicator, which requires the **Allow or block file** feature (with Defender Antivirus active and cloud-based protection, both in place). Device risk-based Conditional Access requires the **Microsoft Intune connection**, which shares device data with Intune and must be on in both Intune and Defender for Endpoint. Custom network indicators concern IP addresses, URLs and domains, not files.
    fr: Bloquer un fichier depuis sa page crée un indicateur de fichier, ce qui exige la fonctionnalité **Allow or block file** (avec l'Antivirus Defender actif et la protection fournie par le cloud, déjà en place). L'accès conditionnel basé sur le risque des appareils exige la **Microsoft Intune connection**, qui partage les données des appareils avec Intune et doit être activée à la fois dans Intune et dans Defender pour point de terminaison. Les indicateurs réseau personnalisés concernent les adresses IP, les URL et les domaines, pas les fichiers.
references:
  - title: Configure Advanced Features in Microsoft Defender for Endpoint
    url: https://learn.microsoft.com/en-us/defender-endpoint/advanced-features
