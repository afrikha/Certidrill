id: sc200-1c-cef-roles
objective: "1.3.4"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove Bank uses an Azure virtual machine named **LNX-FWD4** as the log forwarder for the Common Event Format (CEF) via AMA connector. An engineer named Engineer2 already has the Microsoft Sentinel Contributor role on the resource group of the Microsoft Sentinel workspace.

    Engineer2 must create the data collection rule from the connector page, which also deploys the Azure Monitor Agent on LNX-FWD4. The solution must follow the principle of least privilege.

    Which two additional roles should Engineer2 have? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove Bank utilise une machine virtuelle Azure nommée **LNX-FWD4** comme redirecteur de journaux pour le connecteur Common Event Format (CEF) via AMA. Un ingénieur nommé Engineer2 dispose déjà du rôle Microsoft Sentinel Contributor sur le groupe de ressources de l'espace de travail Microsoft Sentinel.

    Engineer2 doit créer la règle de collecte de données depuis la page du connecteur, ce qui déploie aussi l'agent Azure Monitor sur LNX-FWD4. La solution doit respecter le principe du moindre privilège.

    Quels sont les deux rôles supplémentaires dont Engineer2 doit disposer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: Azure Connected Machine Resource Administrator }
    - { id: b, text: Microsoft Sentinel Responder }
    - { id: c, text: Virtual Machine Contributor }
    - { id: d, text: Monitoring Metrics Publisher }
    - { id: e, text: Monitoring Contributor }
answer: { optionIds: [ c, e ] }
explanation:
  correct:
    en: Deploying the agent requires Virtual Machine Contributor (for an Azure VM) or Azure Connected Machine Resource Administrator (for an Azure Arc-enabled machine), and creating or editing data collection rules requires Monitoring Contributor. LNX-FWD4 is an Azure VM, so Virtual Machine Contributor is the role to use.
    fr: "Le déploiement de l'agent exige Virtual Machine Contributor (pour une machine virtuelle Azure) ou Azure Connected Machine Resource Administrator (pour une machine Azure Arc), et la création ou la modification de règles de collecte de données exige Monitoring Contributor. LNX-FWD4 est une machine virtuelle Azure : Virtual Machine Contributor est le rôle à utiliser."
  options:
    a:
      en: This role manages Azure Arc-enabled machines; LNX-FWD4 is an Azure VM.
      fr: Ce rôle gère les machines Azure Arc ; LNX-FWD4 est une machine virtuelle Azure.
    d:
      en: Monitoring Metrics Publisher lets an application send data to a DCR through the Logs Ingestion API; it doesn't create rules.
      fr: Monitoring Metrics Publisher permet à une application d'envoyer des données à une DCR par l'API d'ingestion de journaux ; il ne crée pas de règles.
    b:
      en: Microsoft Sentinel Responder manages incidents and grants nothing on DCRs or virtual machines.
      fr: Microsoft Sentinel Responder gère les incidents et n'accorde rien sur les DCR ni sur les machines virtuelles.
references:
  - title: Ingest syslog and CEF messages to Microsoft Sentinel - AMA
    url: https://learn.microsoft.com/en-us/azure/sentinel/connect-cef-syslog-ama
