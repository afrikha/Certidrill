id: sc200-1b-rt-lower-analytics
objective: "1.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Adatum Corporation has a Microsoft Sentinel workspace onboarded to the Microsoft Defender portal and to the Microsoft Sentinel data lake. The **SigninLogs** table is in the Analytics tier with an analytics retention of 180 days and a total retention of 180 days. The table contains 180 days of data.

    You change the analytics retention of SigninLogs to 90 days and keep the total retention at 180 days.

    What happens to the SigninLogs data that is 120 days old?
  fr: |
    Adatum Corporation dispose d'un espace de travail Microsoft Sentinel intégré au portail Microsoft Defender et au data lake Microsoft Sentinel. La table **SigninLogs** est au niveau Analytics avec une rétention Analytics de 180 jours et une rétention totale de 180 jours. La table contient 180 jours de données.

    Vous ramenez la rétention Analytics de SigninLogs à 90 jours et conservez la rétention totale à 180 jours.

    Qu'advient-il des données de SigninLogs vieilles de 120 jours ?
body:
  options:
    - { id: a, text: { en: "It is deleted after a 30-day waiting period.", fr: "Elles sont supprimées après un délai d'attente de 30 jours." } }
    - { id: b, text: { en: "It stays in the analytics tier until it is 180 days old.", fr: "Elles restent au niveau Analytics jusqu'à ce qu'elles aient 180 jours." } }
    - { id: c, text: { en: "It is removed from the analytics tier immediately and remains in the data lake tier.", fr: "Elles sont retirées immédiatement du niveau Analytics et restent au niveau Data Lake." } }
    - { id: d, text: { en: "It is deleted immediately because it exceeds the new analytics retention.", fr: "Elles sont supprimées immédiatement, car elles dépassent la nouvelle rétention Analytics." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      A change of analytics retention on a table with existing data takes effect immediately. Analytics-tier data is mirrored to the data lake, so data between 90 and 180 days old leaves the analytics tier but remains in the data lake until the total retention of 180 days ends. No data is lost.
    fr: |
      Une modification de la rétention Analytics d'une table qui contient des données prend effet immédiatement. Les données du niveau Analytics sont mises en miroir dans le data lake : les données âgées de 90 à 180 jours quittent le niveau Analytics mais restent dans le data lake jusqu'à la fin de la rétention totale de 180 jours. Aucune donnée n'est perdue.
  options:
    a: { en: "The 30-day waiting period applies when you shorten the total retention, which didn't change.", fr: "Le délai de 30 jours s'applique quand vous réduisez la rétention totale, qui n'a pas changé." }
    b: { en: "The new analytics retention applies immediately to existing data.", fr: "La nouvelle rétention Analytics s'applique immédiatement aux données existantes." }
    d: { en: "Data is deleted only when it exceeds the total retention.", fr: "Les données ne sont supprimées que lorsqu'elles dépassent la rétention totale." }
references:
  - title: Manage data tiers and retention in Microsoft Sentinel
    url: https://learn.microsoft.com/en-us/azure/sentinel/manage-data-overview
