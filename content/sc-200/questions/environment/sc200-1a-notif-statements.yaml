id: sc200-1a-notif-statements
objective: "1.1.1"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Northwind Traders uses Microsoft Defender XDR and Microsoft Defender for Endpoint. Defender for Endpoint uses role-based access control (RBAC) with device groups. The SOC configures email notification rules for incidents and for response actions.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind Traders utilise Microsoft Defender XDR et Microsoft Defender pour point de terminaison. Defender pour point de terminaison utilise le contrôle d'accès en fonction du rôle (RBAC) avec des groupes d'appareils. Le SOC configure des règles de notification par e-mail pour les incidents et pour les actions de réponse.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: A recipient who is added to an existing incident notification rule receives emails about the incidents that were created before the recipient was added.
        fr: Un destinataire ajouté à une règle de notification d'incident existante reçoit des e-mails sur les incidents créés avant son ajout.
    - id: s2
      text:
        en: An analyst can create incident notification rules only for the device groups that the analyst is allowed to manage.
        fr: Un analyste ne peut créer des règles de notification d'incident que pour les groupes d'appareils qu'il est autorisé à gérer.
    - id: s3
      text:
        en: A response action notification rule sends emails for the response actions that run from custom detection rules.
        fr: Une règle de notification d'action de réponse envoie des e-mails pour les actions de réponse exécutées par des règles de détection personnalisées.
answer:
  values: { s1: false, s2: true, s3: false }
explanation:
  correct:
    en: New recipients are notified only about incidents that arrive after they are added. With RBAC, users can create, edit, delete and receive notifications only for the device groups they are allowed to manage. Response action email notifications currently don't support custom detections that contain response actions.
    fr: Les nouveaux destinataires ne sont notifiés que des incidents qui arrivent après leur ajout. Avec RBAC, les utilisateurs ne peuvent créer, modifier, supprimer et recevoir des notifications que pour les groupes d'appareils qu'ils sont autorisés à gérer. Les notifications par e-mail des actions de réponse ne prennent actuellement pas en charge les détections personnalisées qui contiennent des actions de réponse.
references:
  - title: Get incident notifications by email
    url: https://learn.microsoft.com/en-us/defender-xdr/m365d-notifications-incidents
  - title: Get email notifications for response actions
    url: https://learn.microsoft.com/en-us/defender-xdr/m365d-response-actions-notifications
