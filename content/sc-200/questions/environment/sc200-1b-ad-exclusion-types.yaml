id: sc200-1b-ad-exclusion-types
objective: "1.1.8"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Northwind Traders uses Microsoft Defender XDR. Automatic attack disruption uses its default settings. Northwind has the following requirements:

    - The service account **svc-backup** must never be disabled automatically.
    - The industrial control subnet **10.40.8.0/24**, which contains devices that can't be onboarded, must never be contained automatically.
    - Devices in the device group **DG-OT** must receive no automated investigation and no automated containment or remediation.

    How should you configure the Automated response settings? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind Traders utilise Microsoft Defender XDR. L'interruption automatique des attaques utilise ses paramètres par défaut. Northwind a les exigences suivantes :

    - Le compte de service **svc-backup** ne doit jamais être désactivé automatiquement.
    - Le sous-réseau de contrôle industriel **10.40.8.0/24**, qui contient des appareils impossibles à intégrer, ne doit jamais être contenu automatiquement.
    - Les appareils du groupe d'appareils **DG-OT** ne doivent recevoir aucune investigation automatisée ni aucune contention ou correction automatisée.

    Comment devez-vous configurer les paramètres Automated response ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      svc-backup: [[user]]

      10.40.8.0/24: [[ip]]

      DG-OT: set the automation level to [[dg]]
    fr: |
      svc-backup : [[user]]

      10.40.8.0/24 : [[ip]]

      DG-OT : définir le niveau d'automatisation sur [[dg]]
  slots:
    - id: user
      options:
        - { id: ident, text: { en: "Identities tab > Add user exclusion", fr: "Onglet Identities > Add user exclusion" } }
        - { id: excip, text: { en: "Devices > Exclude IP", fr: "Devices > Exclude IP" } }
        - { id: tune, text: { en: "An alert tuning rule on the account", fr: "Une règle de paramétrage des alertes sur le compte" } }
    - id: ip
      options:
        - { id: excip, text: { en: "Devices > Exclude IP", fr: "Devices > Exclude IP" } }
        - { id: ident, text: { en: "Identities tab > Add user exclusion", fr: "Onglet Identities > Add user exclusion" } }
        - { id: dg, text: { en: "A device group with a rule on the subnet", fr: "Un groupe d'appareils avec une règle sur le sous-réseau" } }
    - id: dg
      options:
        - { id: semiall, text: "Semi - require approval for all folders" }
        - { id: semicore, text: "Semi - require approval for core folders" }
        - { id: none, text: "No automated response" }
        - { id: full, text: "Full - remediate threats automatically" }
answer:
  values: { user: ident, ip: excip, dg: none }
explanation:
  correct:
    en: |
      Accounts are excluded on the Identities tab with Add user exclusion. IP addresses, ranges and subnets, typically for devices that aren't onboarded, are excluded with Exclude IP on the Devices tab. A device group set to No automated response gets no automated investigation and no automated response; semi-automation levels still let attack disruption act without manual approval.
    fr: |
      Les comptes s'excluent dans l'onglet Identities avec Add user exclusion. Les adresses IP, plages et sous-réseaux, généralement pour des appareils non intégrés, s'excluent avec Exclude IP dans l'onglet Devices. Un groupe d'appareils défini sur No automated response ne reçoit ni investigation automatisée ni réponse automatisée ; les niveaux semi-automatiques laissent l'interruption des attaques agir sans approbation manuelle.
  options:
    tune: { en: "Alert tuning doesn't create an attack disruption exclusion.", fr: "Le paramétrage des alertes ne crée pas d'exclusion d'interruption des attaques." }
    dg: { en: "Device groups contain onboarded devices only, matched on name, domain, tag or OS, not on a subnet.", fr: "Les groupes d'appareils ne contiennent que des appareils intégrés, sélectionnés par nom, domaine, étiquette ou système d'exploitation, pas par sous-réseau." }
    semiall: { en: "Semi-automation requires approval for AIR remediation, but attack disruption still contains devices automatically.", fr: "La semi-automatisation exige une approbation pour les corrections AIR, mais l'interruption des attaques contient toujours les appareils automatiquement." }
references:
  - title: Exclude assets from automated responses in automatic attack disruption
    url: https://learn.microsoft.com/en-us/defender-xdr/automatic-attack-disruption-exclusions
  - title: Configure automatic attack disruption in Microsoft Defender XDR
    url: https://learn.microsoft.com/en-us/defender-xdr/configure-attack-disruption
