id: sc200-1c-wse-dcr-json
objective: "1.3.2"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    Contoso deploys its data collection rules (DCRs) by using the REST API. You create a DCR for the Windows Security Events via AMA connector of the Microsoft Sentinel workspace **law-contoso**.

    The DCR must collect only events 4624, 4625 and 4688 of the Security log, and the events must be stored in the `SecurityEvent` table.

    How should you complete the data source section of the DCR? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso déploie ses règles de collecte de données (DCR) avec l'API REST. Vous créez une DCR pour le connecteur Windows Security Events via AMA de l'espace de travail Microsoft Sentinel **law-contoso**.

    La DCR doit collecter uniquement les événements 4624, 4625 et 4688 du journal Sécurité, et les événements doivent être stockés dans la table `SecurityEvent`.

    Comment devez-vous compléter la section de source de données de la DCR ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: json
  template: |
    "dataSources": {
      "windowsEventLogs": [
        {
          "name": "eventLogsDataSource",
          "streams": [ "[[stream]]" ],
          "xPathQueries": [ "[[log]]!*[System[(EventID=4624 or EventID=4625 or EventID=4688)]]" ]
        }
      ]
    }
  slots:
    - id: stream
      options:
        - { id: secevent, text: Microsoft-SecurityEvent }
        - { id: event, text: Microsoft-Event }
        - { id: winevent, text: Microsoft-WindowsEvent }
        - { id: syslog, text: Microsoft-Syslog }
    - id: log
      options:
        - { id: security, text: Security }
        - { id: system, text: System }
        - { id: forwarded, text: ForwardedEvents }
        - { id: app, text: Application }
answer:
  values: { stream: secevent, log: security }
explanation:
  correct:
    en: The Windows Security Events via AMA template uses the `Microsoft-SecurityEvent` stream, which lands in `SecurityEvent`. Each XPath query has the form `LogName!XPath`, so the part before `!` must be the Security log.
    fr: "Le modèle de Windows Security Events via AMA utilise le flux `Microsoft-SecurityEvent`, qui aboutit dans `SecurityEvent`. Chaque requête XPath a la forme `LogName!XPath` : la partie avant `!` doit être le journal Security."
  options:
    event: { en: "Microsoft-Event is the stream of the generic Windows Event Logs data source; it writes to the Event table.", fr: "Microsoft-Event est le flux de la source de données générique Windows Event Logs ; il écrit dans la table Event." }
    winevent: { en: "Microsoft-WindowsEvent writes to WindowsEvent, the table of forwarded events.", fr: "Microsoft-WindowsEvent écrit dans WindowsEvent, la table des événements transférés." }
    syslog: { en: "Microsoft-Syslog is the stream of Syslog data from Linux machines.", fr: "Microsoft-Syslog est le flux des données Syslog des machines Linux." }
    forwarded: { en: "ForwardedEvents is the log of a Windows Event Collector, not the local Security log.", fr: "ForwardedEvents est le journal d'un collecteur d'événements Windows, pas le journal Sécurité local." }
references:
  - title: Connect Microsoft Sentinel to other Microsoft services with a Windows agent-based data connector
    url: https://learn.microsoft.com/en-us/azure/sentinel/connect-services-windows-based
