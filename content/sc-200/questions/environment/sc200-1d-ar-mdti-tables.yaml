id: sc200-1d-ar-mdti-tables
objective: "1.4.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam has a Microsoft Sentinel workspace named **LAW1**. You plan to create a rule from the **Microsoft Defender Threat Intelligence Analytics** template.

    You need to identify which data in LAW1 the rule will check against Microsoft threat indicators.

    Which two tables does the rule match?

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam dispose d'un espace de travail Microsoft Sentinel nommé **LAW1**. Vous prévoyez de créer une règle à partir du modèle **Microsoft Defender Threat Intelligence Analytics**.

    Vous devez identifier les données de LAW1 que la règle comparera aux indicateurs de menace de Microsoft.

    Quelles sont les deux tables que la règle compare ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: Heartbeat }
    - { id: b, text: SecurityEvent }
    - { id: c, text: SigninLogs }
    - { id: d, text: AzureActivity }
    - { id: e, text: AuditLogs }
    - { id: f, text: CommonSecurityLog }
answer: { optionIds: [ d, f ] }
explanation:
  correct:
    en: The rule matches URL, domain and IPv4 indicators in CommonSecurityLog (RequestURL and DestinationIP), and IPv4 indicators in the CallerIpAddress field of AzureActivity. It also covers DnsEvents, Syslog, OfficeActivity and the ASIM DNS and network session tables.
    fr: La règle compare les indicateurs d'URL, de domaine et IPv4 dans CommonSecurityLog (RequestURL et DestinationIP), et les indicateurs IPv4 dans le champ CallerIpAddress d'AzureActivity. Elle couvre aussi DnsEvents, Syslog, OfficeActivity et les tables ASIM de DNS et de sessions réseau.
  options:
    b: { en: "Windows security events are not among the sources that the rule matches.", fr: "Les événements de sécurité Windows ne font pas partie des sources que la règle compare." }
    c: { en: "Microsoft Entra sign-in logs are not among the sources that the rule matches.", fr: "Les journaux de connexion Microsoft Entra ne font pas partie des sources que la règle compare." }
    e: { en: "Microsoft Entra audit logs are not among the sources that the rule matches.", fr: "Les journaux d'audit Microsoft Entra ne font pas partie des sources que la règle compare." }
    a: { en: "Heartbeat records agent health; it contains no traffic to match against indicators.", fr: "Heartbeat enregistre l'intégrité des agents ; il ne contient aucun trafic à comparer aux indicateurs." }
references:
  - title: Use matching analytics in Microsoft Sentinel to detect threats
    url: https://learn.microsoft.com/en-us/azure/sentinel/use-matching-analytics-to-detect-threats
