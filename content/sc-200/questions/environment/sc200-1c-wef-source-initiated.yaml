id: sc200-1c-wef-source-initiated
objective: "1.3.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Fabrikam plans Windows Event Forwarding for 9,000 domain-joined devices. New devices are added every week, and they must start forwarding events without any change on the collector. The design must be the simplest to deploy and the most scalable.

    Which type of subscription should you create on the Windows Event Collector?
  fr: |
    Fabrikam planifie le transfert d'événements Windows pour 9 000 appareils joints au domaine. De nouveaux appareils sont ajoutés chaque semaine, et ils doivent commencer à transférer des événements sans aucune modification sur le collecteur. La conception doit être la plus simple à déployer et la plus évolutive.

    Quel type d'abonnement devez-vous créer sur le collecteur d'événements Windows ?
body:
  options:
    - id: a
      text: { en: "A source-initiated subscription, with the devices configured by Group Policy", fr: "Un abonnement initié par la source, avec des appareils configurés par stratégie de groupe" }
    - id: b
      text: { en: "A collector-initiated subscription that lists the devices by name", fr: "Un abonnement initié par le collecteur qui liste les appareils par nom" }
    - id: c
      text: { en: "A collector-initiated subscription with the Minimize latency delivery option", fr: "Un abonnement initié par le collecteur avec l'option de remise Minimize latency" }
    - id: d
      text: { en: "A collector-initiated subscription that reads existing events on each device", fr: "Un abonnement initié par le collecteur qui lit les événements existants de chaque appareil" }
answer: { optionId: a }
explanation:
  correct:
    en: In a source-initiated (push) subscription, the devices are configured by Group Policy with the address of the collector, so new devices join automatically. Microsoft describes it as the simplest, most flexible deployment with the greatest scalability.
    fr: Dans un abonnement initié par la source (push), les appareils sont configurés par stratégie de groupe avec l'adresse du collecteur, et les nouveaux appareils rejoignent donc l'abonnement automatiquement. Microsoft le présente comme le déploiement le plus simple et le plus souple, avec la meilleure évolutivité.
  options:
    b:
      en: In a collector-initiated (pull) subscription, the collector holds the list of devices, which must be updated every time a device is added.
      fr: Dans un abonnement initié par le collecteur (pull), le collecteur détient la liste des appareils, qu'il faut mettre à jour à chaque ajout d'appareil.
    c:
      en: The delivery option changes how fast events arrive; the collector must still list every device.
      fr: L'option de remise change la vitesse d'arrivée des événements ; le collecteur doit toujours lister chaque appareil.
    d:
      en: Reading existing events changes which events are sent; the collector must still list every device.
      fr: La lecture des événements existants change les événements envoyés ; le collecteur doit toujours lister chaque appareil.
references:
  - title: Use Windows Event Forwarding to help with intrusion detection
    url: https://learn.microsoft.com/en-us/windows/security/operating-system-security/device-management/use-windows-event-forwarding-to-assist-in-intrusion-detection
