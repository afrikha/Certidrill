id: sc200-1a-cdc-limit
objective: "1.1.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Tailspin Toys uses Microsoft Defender for Endpoint Plan 2. To test custom data collection, you created a rule on the `DeviceCustomProcessEvents` table that selects all actions with the condition `ProcessCommandLine not equals ""`, and you targeted it at a dynamic tag that matches 300 devices.

    Every day, after a few hours, the rule stops sending events from most devices, while the other custom rules on those devices keep working. Collection resumes the next day. The threat hunters need only the process events of PowerShell and of the built-in scripting hosts.

    What should you do?
  fr: |
    Tailspin Toys utilise Microsoft Defender pour point de terminaison Plan 2. Pour tester la collecte de données personnalisée, vous avez créé une règle sur la table `DeviceCustomProcessEvents` qui sélectionne toutes les actions avec la condition `ProcessCommandLine not equals ""`, et vous l'avez ciblée sur une étiquette dynamique qui correspond à 300 appareils.

    Chaque jour, au bout de quelques heures, la règle cesse d'envoyer des événements de la plupart des appareils, alors que les autres règles personnalisées de ces appareils continuent de fonctionner. La collecte reprend le lendemain. Les chasseurs de menaces n'ont besoin que des événements de processus de PowerShell et des hôtes de scripts intégrés.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Split the target into two dynamic tags of 150 devices each.", fr: "Répartir la cible sur deux étiquettes dynamiques de 150 appareils chacune." }
    - id: b
      text: { en: "Increase the daily cap of the Microsoft Sentinel workspace.", fr: "Augmenter la limite quotidienne de l'espace de travail Microsoft Sentinel." }
    - id: c
      text: { en: "Disable and re-enable the rule every morning.", fr: "Désactiver puis réactiver la règle chaque matin." }
    - id: d
      text: { en: "Replace the condition with conditions on the needed process names.", fr: "Remplacer la condition par des conditions sur les noms de processus nécessaires." }
answer: { optionId: d }
explanation:
  correct:
    en: Each rule can capture up to 75,000 events per device in a 24-hour rolling window; at the limit, that rule stops on the device until the window resets, while other rules continue. An always-true condition collects every process event, so the recommended fix is to make the conditions more specific, here on the processes the hunters need.
    fr: "Chaque règle peut capturer jusqu'à 75 000 événements par appareil sur une fenêtre glissante de 24 heures ; à la limite, cette règle s'arrête sur l'appareil jusqu'à la réinitialisation de la fenêtre, tandis que les autres règles continuent. Une condition toujours vraie collecte tous les événements de processus : la correction recommandée est de rendre les conditions plus précises, ici sur les processus dont les chasseurs ont besoin."
  options:
    a:
      en: The limit applies per rule and per device, so fewer devices per tag doesn't change the volume that each device produces.
      fr: "La limite s'applique par règle et par appareil : moins d'appareils par étiquette ne change pas le volume produit par chaque appareil."
    b:
      en: The collection stops on the devices because of the per-device rule limit, not because of the workspace, and the other rules keep ingesting data.
      fr: La collecte s'arrête sur les appareils à cause de la limite par règle et par appareil, pas à cause de l'espace de travail, et les autres règles continuent d'ingérer des données.
    c:
      en: Disabling a rule doesn't reset the rolling window, and changes take up to an hour to deploy; the volume problem remains.
      fr: La désactivation d'une règle ne réinitialise pas la fenêtre glissante, et les modifications mettent jusqu'à une heure à se déployer ; le problème de volume demeure.
references:
  - title: Create and manage custom data collection rules in Microsoft Defender for Endpoint
    url: https://learn.microsoft.com/en-us/defender-endpoint/create-custom-data-collection-rules
