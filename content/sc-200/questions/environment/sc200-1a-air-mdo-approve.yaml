id: sc200-1a-air-mdo-approve
objective: "1.1.7"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Fabrikam, Inc. uses Microsoft Defender XDR, Microsoft Defender for Endpoint and Microsoft Defender for Office 365 Plan 2. Defender XDR Unified RBAC is not activated for Email & collaboration.

    An analyst named User1 has the Microsoft Entra Security Administrator role. User1 can approve pending device remediation actions in the Action center but cannot approve the pending email remediation actions from automated investigations.

    You need User1 to approve the email remediation actions. The solution must follow the principle of least privilege.

    What should you do?
  fr: |
    Fabrikam, Inc. utilise Microsoft Defender XDR, Microsoft Defender pour point de terminaison et Microsoft Defender pour Office 365 Plan 2. Le RBAC unifié de Defender XDR n'est pas activé pour Email & collaboration.

    Un analyste nommé User1 dispose du rôle Microsoft Entra Security Administrator. User1 peut approuver les actions de correction d'appareils en attente dans le centre de notifications, mais il ne peut pas approuver les actions de correction d'e-mails en attente issues des enquêtes automatisées.

    Vous devez permettre à User1 d'approuver les actions de correction d'e-mails. La solution doit respecter le principe du moindre privilège.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Assign the Global Administrator role to User1.", fr: "Attribuer le rôle Global Administrator à User1." }
    - id: b
      text: { en: "Add User1 to an Email & collaboration role group that has the Search and Purge role.", fr: "Ajouter User1 à un groupe de rôles Email & collaboration qui dispose du rôle Search and Purge." }
    - id: c
      text: { en: "Add User1 to a Defender for Endpoint role that has the Active remediation actions permission.", fr: "Ajouter User1 à un rôle Defender pour point de terminaison qui dispose de l'autorisation Active remediation actions." }
    - id: d
      text: { en: "Add User1 to the Security Administrator role group in Email & collaboration permissions.", fr: "Ajouter User1 au groupe de rôles Security Administrator dans les autorisations Email & collaboration." }
answer: { optionId: b }
explanation:
  correct:
    en: Approving Defender for Office 365 remediation requires the Security Administrator role plus membership in an Email & collaboration role group that has the **Search and Purge** role. By default, Search and Purge is assigned only to the Data Investigator and Organization Management role groups, and you can also create a custom role group with it.
    fr: Approuver les corrections de Defender pour Office 365 exige le rôle Security Administrator ainsi que l'appartenance à un groupe de rôles Email & collaboration qui dispose du rôle **Search and Purge**. Par défaut, Search and Purge n'est attribué qu'aux groupes de rôles Data Investigator et Organization Management, et vous pouvez aussi créer un groupe de rôles personnalisé qui le contient.
  options:
    a:
      en: Global Administrator grants far more than needed, and the Email & collaboration requirement is about the Search and Purge role.
      fr: Global Administrator accorde bien plus que nécessaire, et l'exigence Email & collaboration porte sur le rôle Search and Purge.
    c:
      en: Active remediation actions covers device remediation, which User1 can already approve.
      fr: Active remediation actions couvre la correction des appareils, que User1 peut déjà approuver.
    d:
      en: The Security Administrator role group in Email & collaboration doesn't include Search and Purge.
      fr: Le groupe de rôles Security Administrator d'Email & collaboration n'inclut pas Search and Purge.
references:
  - title: Go to the Action center to view and approve your automated investigation and remediation tasks
    url: https://learn.microsoft.com/en-us/defender-xdr/m365d-action-center
