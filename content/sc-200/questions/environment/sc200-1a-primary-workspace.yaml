id: sc200-1a-primary-workspace
objective: "1.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Northwind Traders has two Microsoft Sentinel workspaces onboarded to the Microsoft Defender portal: **WS-Archive**, which is the primary workspace, and **WS-SOC**, which is a secondary workspace. WS-Archive now stores only compliance data, and all analytics rules run in WS-SOC.

    Alerts from the WS-SOC analytics rules never appear in the same incidents as related Microsoft Defender for Endpoint alerts. You need these alerts to be correlated automatically with the Defender XDR alerts.

    What should you do?
  fr: |
    Northwind Traders dispose de deux espaces de travail Microsoft Sentinel intégrés au portail Microsoft Defender : **WS-Archive**, qui est l'espace de travail principal, et **WS-SOC**, qui est un espace de travail secondaire. WS-Archive ne stocke plus que des données de conformité, et toutes les règles d'analytique s'exécutent dans WS-SOC.

    Les alertes des règles d'analytique de WS-SOC n'apparaissent jamais dans les mêmes incidents que les alertes Microsoft Defender pour point de terminaison associées. Vous devez faire en sorte que ces alertes soient corrélées automatiquement avec les alertes de Defender XDR.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Merge the related incidents manually from the incident queue.", fr: "Fusionner manuellement les incidents associés depuis la file d'incidents." }
    - id: b
      text: { en: "Turn on the Restrict correlation to within scoped device groups advanced feature.", fr: "Activer la fonctionnalité avancée Restrict correlation to within scoped device groups." }
    - id: c
      text: { en: "Create an alert tuning rule for the Microsoft Sentinel service source.", fr: "Créer une règle de réglage des alertes pour la source de service Microsoft Sentinel." }
    - id: d
      text: { en: "Set WS-SOC as the primary workspace in the Microsoft Defender portal.", fr: "Définir WS-SOC comme espace de travail principal dans le portail Microsoft Defender." }
answer: { optionId: d }
explanation:
  correct:
    en: Only the **primary** workspace has its alerts correlated with Defender XDR alerts and included in the same incidents. Alerts of secondary workspaces aren't correlated with Defender alerts or with any other source, so WS-SOC must become the primary workspace.
    fr: "Seul l'espace de travail **principal** voit ses alertes corrélées avec celles de Defender XDR et incluses dans les mêmes incidents. Les alertes des espaces secondaires ne sont corrélées ni avec les alertes Defender ni avec aucune autre source : WS-SOC doit donc devenir l'espace de travail principal."
  options:
    a:
      en: A manual merge is not automatic correlation, and it would have to be repeated for every incident.
      fr: Une fusion manuelle n'est pas une corrélation automatique, et il faudrait la répéter pour chaque incident.
    b:
      en: This feature restricts correlation further; it does not add a secondary workspace to the correlation.
      fr: Cette fonctionnalité restreint davantage la corrélation ; elle n'ajoute pas un espace secondaire à la corrélation.
    c:
      en: Alert tuning hides, resolves or converts alerts; it does not correlate them with other alerts.
      fr: Le réglage des alertes masque, résout ou convertit des alertes ; il ne les corrèle pas avec d'autres alertes.
references:
  - title: Alert correlation and incident merging in the Microsoft Defender portal
    url: https://learn.microsoft.com/en-us/defender-xdr/alerts-incidents-correlation
