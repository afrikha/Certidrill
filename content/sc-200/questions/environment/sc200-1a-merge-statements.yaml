id: sc200-1a-merge-statements
objective: "1.1.2"
type: yesno_statements
difficulty: 3
status: draft
stem:
  en: |
    Woodgrove Bank uses Microsoft Defender XDR. Two active incidents, Incident1 and Incident2, contain alerts that involve the same user account and the same malicious file.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove Bank utilise Microsoft Defender XDR. Deux incidents actifs, Incident1 et Incident2, contiennent des alertes qui concernent le même compte d'utilisateur et le même fichier malveillant.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: If Incident1 is assigned to Analyst1 and Incident2 is assigned to Analyst2, Defender XDR merges the incidents automatically.
        fr: Si Incident1 est attribué à Analyst1 et Incident2 à Analyst2, Defender XDR fusionne automatiquement les incidents.
    - id: s2
      text:
        en: When the incidents are merged, the source incident is closed and receives the Redirected tag, and its alerts move to the target incident.
        fr: Lorsque les incidents sont fusionnés, l'incident source est fermé et reçoit l'étiquette Redirected, et ses alertes passent dans l'incident cible.
    - id: s3
      text:
        en: When you merge the incidents manually, you choose which incident becomes the target incident.
        fr: Lorsque vous fusionnez manuellement les incidents, vous choisissez quel incident devient l'incident cible.
answer:
  values: { s1: false, s2: true, s3: false }
explanation:
  correct:
    en: Defender XDR doesn't merge incidents that are assigned to two different people. During a merge, no new incident is created; the source incident is closed with the Redirected tag, and its alerts, tags and entities move to the target. The merge direction is decided by Defender's internal logic, even for manual merges.
    fr: Defender XDR ne fusionne pas des incidents attribués à deux personnes différentes. Lors d'une fusion, aucun nouvel incident n'est créé ; l'incident source est fermé avec l'étiquette Redirected, et ses alertes, étiquettes et entités passent dans l'incident cible. Le sens de la fusion est décidé par la logique interne de Defender, même pour les fusions manuelles.
references:
  - title: Alert correlation and incident merging in the Microsoft Defender portal
    url: https://learn.microsoft.com/en-us/defender-xdr/alerts-incidents-correlation
