id: sc200-cs2a-sentinel-roles
objective: "1.2.1"
type: dragdrop
caseStudy: sc200-cs2a-fourth-coffee
difficulty: 1
status: draft
stem:
  en: |
    You need to assign Azure roles on the resource group that contains law-fc-soc and the playbooks. The solution must meet the access requirement.

    Which role should you assign to each group? To answer, drag the appropriate roles to the correct groups. Each role may be used once, more than once, or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez attribuer des rôles Azure sur le groupe de ressources qui contient law-fc-soc et les playbooks. La solution doit respecter l'exigence d'accès.

    Quel rôle devez-vous attribuer à chaque groupe ? Pour répondre, faites glisser les rôles appropriés vers les groupes correspondants. Chaque rôle peut être utilisé une fois, plusieurs fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: true
  items:
    - { id: reader, text: Microsoft Sentinel Reader }
    - { id: responder, text: Microsoft Sentinel Responder }
    - { id: contributor, text: Microsoft Sentinel Contributor }
    - { id: operator, text: Microsoft Sentinel Playbook Operator }
    - { id: autocontrib, text: Microsoft Sentinel Automation Contributor }
    - { id: logicapp, text: Logic App Contributor }
  targets:
    - { id: t1, text: SOC-T1 }
    - { id: eng, text: SOC-ENG }
    - { id: auto, text: SOC-AUTO }
    - { id: audit, text: AUDIT }
answer:
  mapping: { t1: responder, eng: contributor, auto: operator, audit: reader }
explanation:
  correct:
    en: Microsoft Sentinel Responder adds incident management (assign, change status, close) to read access. Microsoft Sentinel Contributor is needed to create and edit analytics rules and workbooks. Microsoft Sentinel Playbook Operator lets users list, view and manually run playbooks without editing them. Microsoft Sentinel Reader gives the auditors read-only access.
    fr: Microsoft Sentinel Responder ajoute la gestion des incidents (attribuer, changer le statut, fermer) à l'accès en lecture. Microsoft Sentinel Contributor est nécessaire pour créer et modifier les règles d'analytique et les classeurs. Microsoft Sentinel Playbook Operator permet de lister, consulter et exécuter manuellement les playbooks sans les modifier. Microsoft Sentinel Reader donne aux auditeurs un accès en lecture seule.
  options:
    autocontrib: { en: "Microsoft Sentinel Automation Contributor is assigned to the Microsoft Sentinel service so that automation rules can run playbooks; it is not meant for user accounts.", fr: "Microsoft Sentinel Automation Contributor est attribué au service Microsoft Sentinel pour que les règles d'automatisation puissent exécuter des playbooks ; il n'est pas destiné aux comptes d'utilisateurs." }
    logicapp: { en: "Logic App Contributor lets users create and edit playbooks, which SOC-AUTO must not do.", fr: "Logic App Contributor permet de créer et modifier des playbooks, ce que SOC-AUTO ne doit pas faire." }
references:
  - title: Roles and permissions in the Microsoft Sentinel platform
    url: https://learn.microsoft.com/en-us/azure/sentinel/roles
