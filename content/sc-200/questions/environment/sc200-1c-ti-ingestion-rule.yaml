id: sc200-1c-ti-ingestion-rule
objective: "1.3.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Contoso ingests indicators from an industry sharing community into its Microsoft Sentinel workspace by using the Threat Intelligence - TAXII data connector. The community's indicators are high fidelity, but their **Valid until** date is often too short.

    You need to automatically extend the **Valid until** date by 30 days for every indicator received from this feed, before it's ingested. The solution must minimize administrative effort.

    What should you create?
  fr: |
    Contoso ingère dans son espace de travail Microsoft Sentinel les indicateurs d'une communauté de partage sectorielle avec le connecteur de données Threat Intelligence - TAXII. Les indicateurs de la communauté sont très fiables, mais leur date **Valid until** est souvent trop courte.

    Vous devez prolonger automatiquement de 30 jours la date **Valid until** de chaque indicateur reçu de ce flux, avant son ingestion. La solution doit réduire au minimum l'effort d'administration.

    Que devez-vous créer ?
body:
  options:
    - { id: a, text: { en: "An automation rule", fr: "Une règle d'automatisation" } }
    - { id: b, text: { en: "A playbook triggered by incidents", fr: "Un playbook déclenché par les incidents" } }
    - { id: c, text: { en: "A threat intelligence ingestion rule", fr: "Une règle d'ingestion du renseignement sur les menaces" } }
    - { id: d, text: { en: "A scheduled analytics rule", fr: "Une règle d'analytique planifiée" } }
answer: { optionId: c }
explanation:
  correct:
    en: Ingestion rules update attributes of threat intelligence objects, or filter them out with a Delete action, before they're ingested. Extending Valid until by 30 days for high-fidelity indicators of a trusted source is one of the documented examples. Ingestion rules apply to data connectors only, which is the case here.
    fr: Les règles d'ingestion modifient les attributs des objets de renseignement sur les menaces, ou les écartent avec une action Delete, avant leur ingestion. Prolonger de 30 jours la date Valid until des indicateurs très fiables d'une source de confiance fait partie des exemples documentés. Les règles d'ingestion ne s'appliquent qu'aux connecteurs de données, ce qui est le cas ici.
  options:
    a:
      en: Automation rules act on incidents and alerts, not on threat intelligence objects before ingestion.
      fr: Les règles d'automatisation agissent sur les incidents et les alertes, pas sur les objets de renseignement sur les menaces avant leur ingestion.
    b:
      en: A playbook runs on incidents; it would also require custom logic to maintain.
      fr: Un playbook s'exécute sur des incidents ; il exigerait en outre une logique personnalisée à maintenir.
    d:
      en: Analytics rules detect threats in ingested data; they don't modify indicators.
      fr: Les règles d'analytique détectent les menaces dans les données ingérées ; elles ne modifient pas les indicateurs.
references:
  - title: Threat intelligence in Microsoft Sentinel
    url: https://learn.microsoft.com/en-us/azure/sentinel/understand-threat-intelligence
