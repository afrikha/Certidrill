id: sc200-1b-ad-breakglass-exclusion
objective: "1.1.8"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso, Ltd. uses Microsoft Defender XDR with Microsoft Defender for Endpoint, Microsoft Defender for Identity and Microsoft Defender for Office 365. Automatic attack disruption uses its default settings.

    Contoso has two emergency access accounts named **BG-Admin1** and **BG-Admin2**.

    You need to ensure that automatic attack disruption never disables or contains BG-Admin1 and BG-Admin2. Attack disruption must keep protecting all the other accounts and devices.

    What should you do?
  fr: |
    Contoso, Ltd. utilise Microsoft Defender XDR avec Microsoft Defender for Endpoint, Microsoft Defender for Identity et Microsoft Defender for Office 365. L'interruption automatique des attaques utilise ses paramètres par défaut.

    Contoso dispose de deux comptes d'accès d'urgence nommés **BG-Admin1** et **BG-Admin2**.

    Vous devez vous assurer que l'interruption automatique des attaques ne désactive et ne contient jamais BG-Admin1 et BG-Admin2. L'interruption des attaques doit continuer à protéger tous les autres comptes et appareils.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Set the automation level of the Ungrouped devices group to No automated response.", fr: "Définir le niveau d'automatisation du groupe Ungrouped devices sur No automated response." } }
    - { id: b, text: { en: "Exclude BG-Admin1 and BG-Admin2 from every Conditional Access policy in Microsoft Entra ID.", fr: "Exclure BG-Admin1 et BG-Admin2 de toutes les stratégies d'accès conditionnel de Microsoft Entra ID." } }
    - { id: c, text: { en: "Add BG-Admin1 and BG-Admin2 as user exclusions on the Identities tab of the Automated response settings.", fr: "Ajouter BG-Admin1 et BG-Admin2 comme exclusions d'utilisateur dans l'onglet Identities des paramètres Automated response." } }
    - { id: d, text: { en: "Create an alert tuning rule that resolves the alerts in which BG-Admin1 or BG-Admin2 appear.", fr: "Créer une règle de paramétrage des alertes qui résout les alertes dans lesquelles BG-Admin1 ou BG-Admin2 apparaissent." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      In the Defender portal, Settings > Microsoft Defender XDR > Automated response > Identities > Add user exclusion prevents attack disruption from automatically disabling or containing the selected accounts. The exclusion applies only to those accounts, so disruption keeps acting on every other asset. Identity exclusions apply to the automated responses of both Defender for Identity and Defender for Endpoint.
    fr: |
      Dans le portail Defender, Paramètres > Microsoft Defender XDR > Automated response > Identities > Add user exclusion empêche l'interruption des attaques de désactiver ou de contenir automatiquement les comptes sélectionnés. L'exclusion ne s'applique qu'à ces comptes : l'interruption continue d'agir sur toutes les autres ressources. Les exclusions d'identités s'appliquent aux réponses automatisées de Defender for Identity comme de Defender for Endpoint.
  options:
    a: { en: "A device group automation level affects devices, not user accounts, and it would stop automated response on every ungrouped device.", fr: "Le niveau d'automatisation d'un groupe d'appareils porte sur des appareils, pas sur des comptes d'utilisateur, et il arrêterait la réponse automatisée sur tous les appareils non groupés." }
    b: { en: "Conditional Access exclusions don't change the actions that attack disruption takes on an account.", fr: "Les exclusions d'accès conditionnel ne modifient pas les actions que l'interruption des attaques applique à un compte." }
    d: { en: "Alert tuning hides or resolves alerts; it isn't the supported way to keep attack disruption from acting on an account, and it would also hide real attacks against these accounts.", fr: "Le paramétrage des alertes masque ou résout des alertes ; ce n'est pas la méthode prévue pour empêcher l'interruption des attaques d'agir sur un compte, et il masquerait aussi les vraies attaques contre ces comptes." }
references:
  - title: Exclude assets from automated responses in automatic attack disruption
    url: https://learn.microsoft.com/en-us/defender-xdr/automatic-attack-disruption-exclusions
