id: sc200-1d-mi-simulated
objective: "1.4.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Fabrikam has a Microsoft Sentinel workspace. Several techniques show no active detection on the MITRE ATT&CK page.

    Before enabling any new rule, the SOC wants to see what the coverage of the workspace would look like if the detections that are available but not configured were configured.

    What should you use on the MITRE ATT&CK page?
  fr: |
    Fabrikam dispose d'un espace de travail Microsoft Sentinel. Plusieurs techniques n'affichent aucune détection active sur la page MITRE ATT&CK.

    Avant d'activer toute nouvelle règle, le SOC veut voir à quoi ressemblerait la couverture de l'espace de travail si les détections disponibles mais non configurées étaient configurées.

    Que devez-vous utiliser sur la page MITRE ATT&CK ?
body:
  options:
    - { id: a, text: { en: "The Simulated rules menu", fr: "Le menu Simulated rules" } }
    - { id: b, text: { en: "The View MITRE by threat scenario toggle", fr: "Le bouton bascule View MITRE by threat scenario" } }
    - { id: c, text: { en: "The search bar, with a technique ID", fr: "La barre de recherche, avec un ID de technique" } }
    - { id: d, text: { en: "The legend of active detections", fr: "La légende des détections actives" } }
answer: { optionId: a }
explanation:
  correct:
    en: The Simulated rules menu shows the simulated coverage, that is, the techniques that the detections available but not configured in the workspace would cover. It lets you plan which templates to enable before changing the workspace.
    fr: Le menu Simulated rules affiche la couverture simulée, c'est-à-dire les techniques que couvriraient les détections disponibles mais non configurées dans l'espace de travail. Il permet de planifier les modèles à activer avant de modifier l'espace de travail.
  options:
    b: { en: "This toggle filters the matrix for one threat scenario; it does not add detections that are not configured.", fr: "Ce bouton bascule filtre la matrice pour un scénario de menace ; il n'ajoute pas les détections non configurées." }
    c: { en: "The search bar finds a technique by name or ID in the current view; it does not simulate coverage.", fr: "La barre de recherche trouve une technique par nom ou par ID dans la vue actuelle ; elle ne simule pas la couverture." }
    d: { en: "The legend shows how many active detections cover a technique, not the potential coverage.", fr: "La légende indique combien de détections actives couvrent une technique, pas la couverture potentielle." }
references:
  - title: View MITRE ATT&CK framework coverage in Microsoft Sentinel
    url: https://learn.microsoft.com/en-us/azure/sentinel/mitre-coverage
