id: sc200-1d-mi-technique-pane
objective: "1.4.4"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Proseware has onboarded a Microsoft Sentinel workspace to the Microsoft Defender portal. On the MITRE ATT&CK page, you select the technique **T1059 Command and Scripting Interpreter** in the matrix, and the technique details pane opens.

    Which two items does the details pane provide?

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware a intégré un espace de travail Microsoft Sentinel au portail Microsoft Defender. Sur la page MITRE ATT&CK, vous sélectionnez la technique **T1059 Command and Scripting Interpreter** dans la matrice, et le volet de détails de la technique s'ouvre.

    Quels sont les deux éléments fournis par le volet de détails ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "A link to the full description of the technique in the MITRE ATT&CK knowledge base", fr: "Un lien vers la description complète de la technique dans la base de connaissances MITRE ATT&CK" } }
    - { id: b, text: { en: "The list of devices on which the technique was observed during the last 30 days", fr: "La liste des appareils sur lesquels la technique a été observée au cours des 30 derniers jours" } }
    - { id: c, text: { en: "The recommended coverage, as a ratio of active detections and services to the recommended ones", fr: "La couverture recommandée, sous forme de ratio des détections et services actifs par rapport à ceux recommandés" } }
    - { id: d, text: { en: "A button that enables every rule template mapped to the technique at once", fr: "Un bouton qui active en une fois tous les modèles de règles mappés à la technique" } }
    - { id: e, text: { en: "The daily ingestion volume of the data sources used by the mapped rules", fr: "Le volume d'ingestion quotidien des sources de données utilisées par les règles mappées" } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: The technique details pane shows the description with View full technique details, which opens the MITRE ATT&CK knowledge base, and links to the active items such as hunting queries. In the Defender portal it also shows the recommended coverage, the ratio of active detections and security services to all those recommended for the technique.
    fr: Le volet de détails de la technique affiche la description avec View full technique details, qui ouvre la base de connaissances MITRE ATT&CK, et des liens vers les éléments actifs comme les requêtes de chasse. Dans le portail Defender, il affiche aussi la couverture recommandée, le ratio des détections et services de sécurité actifs par rapport à l'ensemble de ceux recommandés pour la technique.
  options:
    b: { en: "The pane describes coverage, not where the technique was observed; use incidents or hunting for that.", fr: "Le volet décrit la couverture, pas les endroits où la technique a été observée ; utilisez les incidents ou la chasse pour cela." }
    d: { en: "The pane links to related items; rules are created from templates one by one on the Analytics page.", fr: "Le volet renvoie vers les éléments associés ; les règles sont créées à partir des modèles une par une sur la page Analytique." }
    e: { en: "The pane does not report ingestion volumes; usage data is in the workspace, not on the MITRE ATT&CK page.", fr: "Le volet n'indique pas de volumes d'ingestion ; les données d'utilisation se trouvent dans l'espace de travail, pas sur la page MITRE ATT&CK." }
references:
  - title: View MITRE ATT&CK framework coverage in Microsoft Sentinel
    url: https://learn.microsoft.com/en-us/azure/sentinel/mitre-coverage
