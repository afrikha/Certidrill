id: sc200-1d-an-tune-sequence
objective: "1.4.5"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    Contoso has a Microsoft Sentinel workspace. A built-in anomaly rule named **Anomalous sign-in volume** runs in Production mode. Its threshold produces too many results for the SOC.

    You need to test a higher threshold and then use it in production. The original rule must keep running until the new threshold is validated.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Contoso dispose d'un espace de travail Microsoft Sentinel. Une règle d'anomalie intégrée nommée **Anomalous sign-in volume** s'exécute en mode Production. Son seuil produit trop de résultats pour le SOC.

    Vous devez tester un seuil plus élevé, puis l'utiliser en production. La règle d'origine doit continuer à s'exécuter tant que le nouveau seuil n'est pas validé.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: dup, text: { en: "On the Anomalies tab, duplicate the built-in rule.", fr: "Dans l'onglet Anomalies, dupliquer la règle intégrée." } }
    - { id: edit, text: { en: "Edit the customized copy, raise its threshold, and enable it.", fr: "Modifier la copie personnalisée, augmenter son seuil et l'activer." } }
    - { id: compare, text: { en: "Compare the anomalies of both rules in the Anomalies table.", fr: "Comparer les anomalies des deux règles dans la table Anomalies." } }
    - { id: prod, text: { en: "Switch the customized copy from Flighting to Production.", fr: "Faire passer la copie personnalisée de Flighting à Production." } }
    - { id: editbuiltin, text: { en: "Edit the built-in rule and raise its threshold.", fr: "Modifier la règle intégrée et augmenter son seuil." } }
    - { id: deleteorig, text: { en: "Delete the built-in rule before enabling the customized copy.", fr: "Supprimer la règle intégrée avant d'activer la copie personnalisée." } }
answer:
  sequence: [ dup, edit, compare, prod ]
explanation:
  correct:
    en: Built-in anomaly rules cannot be edited, so you duplicate the rule; the copy is created disabled, in Flighting mode. You edit its threshold and enable it while the original keeps running in Production, then compare both rules in the Anomalies table. Switching the copy to Production moves the original to Flighting automatically.
    fr: |
      Les règles d'anomalie intégrées ne peuvent pas être modifiées : vous dupliquez donc la règle ; la copie est créée désactivée, en mode Flighting. Vous modifiez son seuil et l'activez pendant que l'original continue à s'exécuter en Production, puis vous comparez les deux règles dans la table Anomalies. Le passage de la copie en Production fait passer automatiquement l'original en Flighting.
  options:
    editbuiltin: { en: "On a built-in rule you can only switch the status between Production and Flighting; thresholds are changed on a copy.", fr: "Sur une règle intégrée, vous pouvez seulement faire basculer l'état entre Production et Flighting ; les seuils se modifient sur une copie." }
    deleteorig: { en: "Built-in rules cannot be deleted, and the original must keep running for the comparison.", fr: "Les règles intégrées ne peuvent pas être supprimées, et l'original doit continuer à s'exécuter pour la comparaison." }
references:
  - title: Work with anomaly detection analytics rules in Microsoft Sentinel
    url: https://learn.microsoft.com/en-us/azure/sentinel/work-with-anomaly-rules
