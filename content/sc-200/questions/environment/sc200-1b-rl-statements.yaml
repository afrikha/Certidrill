id: sc200-1b-rl-statements
objective: "1.2.1"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    Wingtip Toys uses Microsoft Sentinel. You are reviewing the role assignments on the resource group that contains the workspace.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Wingtip Toys utilise Microsoft Sentinel. Vous examinez les attributions de rôle sur le groupe de ressources qui contient l'espace de travail.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          A user who has Microsoft Sentinel Contributor can install and update solutions from the Content hub.
        fr: |
          Un utilisateur qui a Microsoft Sentinel Contributor peut installer et mettre à jour des solutions depuis le hub de contenu.
    - id: s2
      text:
        en: |
          Microsoft Sentinel Automation Contributor is the recommended role for engineers who attach playbooks to automation rules.
        fr: |
          Microsoft Sentinel Automation Contributor est le rôle recommandé pour les ingénieurs qui attachent des playbooks aux règles d'automatisation.
    - id: s3
      text:
        en: |
          A user who has both Microsoft Sentinel Reader and Microsoft Sentinel Contributor on the resource group gets only the Reader permissions.
        fr: |
          Un utilisateur qui a à la fois Microsoft Sentinel Reader et Microsoft Sentinel Contributor sur le groupe de ressources n'obtient que les autorisations de Reader.
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: |
      Microsoft Sentinel Contributor can install and update Content hub solutions. Automation Contributor lets the Microsoft Sentinel service account add playbooks to automation rules and isn't used for user accounts; engineers attach playbooks with Microsoft Sentinel Contributor. Role assignments are cumulative, so the user gets the Contributor permissions.
    fr: |
      Microsoft Sentinel Contributor peut installer et mettre à jour les solutions du hub de contenu. Automation Contributor permet au compte de service Microsoft Sentinel d'ajouter des playbooks aux règles d'automatisation et ne sert pas aux comptes d'utilisateur ; les ingénieurs attachent les playbooks avec Microsoft Sentinel Contributor. Les attributions de rôle sont cumulatives : l'utilisateur obtient les autorisations de Contributor.
references:
  - title: Roles and permissions in the Microsoft Sentinel platform
    url: https://learn.microsoft.com/en-us/azure/sentinel/roles
