id: sc200-1b-rl-lake-kql-job
objective: "1.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam, Inc. has onboarded Microsoft Sentinel to the Microsoft Defender portal and to the Microsoft Sentinel data lake.

    A threat hunter named Hunter1 must create KQL jobs that query data lake tables and write the results to tables in the analytics tier. Hunter1 currently has the Security Reader role in Microsoft Entra ID.

    You need to grant Hunter1 the required permissions. The solution must follow the principle of least privilege.

    Which Microsoft Entra role should you assign to Hunter1?
  fr: |
    Fabrikam, Inc. a intégré Microsoft Sentinel au portail Microsoft Defender et au data lake Microsoft Sentinel.

    Un chasseur de menaces nommé Hunter1 doit créer des tâches KQL qui interrogent des tables du data lake et écrivent les résultats dans des tables du niveau Analytics. Hunter1 a actuellement le rôle Security Reader dans Microsoft Entra ID.

    Vous devez accorder à Hunter1 les autorisations nécessaires. La solution doit respecter le principe du moindre privilège.

    Quel rôle Microsoft Entra devez-vous attribuer à Hunter1 ?
body:
  options:
    - { id: a, text: Global Reader }
    - { id: b, text: Security Operator }
    - { id: c, text: Security Administrator }
    - { id: d, text: Global Administrator }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Writing to analytics-tier tables with KQL jobs or notebooks, and managing data lake jobs, requires the Security Operator, Security Administrator or Global Administrator role. Security Operator is the least privileged of the three.
    fr: |
      Écrire dans des tables du niveau Analytics avec des tâches KQL ou des notebooks, et gérer les tâches du data lake, exige le rôle Security Operator, Security Administrator ou Global Administrator. Security Operator est le moins privilégié des trois.
  options:
    a: { en: "Global Reader grants read access to the data lake only, like Security Reader.", fr: "Global Reader n'accorde que la lecture du data lake, comme Security Reader." }
    c: { en: "Security Administrator works but grants more than needed.", fr: "Security Administrator fonctionne mais accorde plus que nécessaire." }
    d: { en: "Global Administrator is highly privileged and should be kept for emergencies.", fr: "Global Administrator est très privilégié et doit être réservé aux urgences." }
references:
  - title: Roles and permissions in the Microsoft Sentinel platform
    url: https://learn.microsoft.com/en-us/azure/sentinel/roles
