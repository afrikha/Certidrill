id: sc200-cs2b-table-retention
objective: "1.2.2"
type: dropdown
caseStudy: sc200-cs2b-consolidated-messenger
difficulty: 2
status: draft
stem:
  en: |
    You plan to configure the tables in the Defender portal.

    You need to meet the retention requirements.

    How should you configure the tables? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous prévoyez de configurer les tables dans le portail Defender.

    Vous devez répondre aux exigences de rétention.

    Comment devez-vous configurer les tables ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      AZFWNetworkRule and AZFWApplicationRule: [[fw]]
      DeviceProcessEvents: [[dpe]]
    fr: |
      AZFWNetworkRule et AZFWApplicationRule : [[fw]]
      DeviceProcessEvents : [[dpe]]
  slots:
    - id: fw
      options:
        - { id: lake365, text: { en: "Data lake tier, total retention 365 days", fr: "Niveau Data lake, rétention totale de 365 jours" } }
        - { id: an365, text: { en: "Analytics tier, analytics retention 365 days", fr: "Niveau Analytics, rétention Analytics de 365 jours" } }
        - { id: an90t365, text: { en: "Analytics tier, analytics retention 90 days, total retention 365 days", fr: "Niveau Analytics, rétention Analytics de 90 jours, rétention totale de 365 jours" } }
        - { id: an30, text: { en: "Analytics tier, analytics retention 30 days", fr: "Niveau Analytics, rétention Analytics de 30 jours" } }
    - id: dpe
      options:
        - { id: default, text: { en: "Keep the default advanced hunting retention", fr: "Conserver la rétention par défaut du repérage avancé" } }
        - { id: an180, text: { en: "Analytics tier, analytics retention 180 days", fr: "Niveau Analytics, rétention Analytics de 180 jours" } }
        - { id: lake180, text: { en: "Data lake tier, total retention 180 days", fr: "Niveau Data lake, rétention totale de 180 jours" } }
        - { id: an90, text: { en: "Analytics tier, analytics retention 90 days", fr: "Niveau Analytics, rétention Analytics de 90 jours" } }
answer:
  values: { fw: lake365, dpe: an180 }
explanation:
  correct:
    en: The firewall logs feed no analytics rule and are read only by KQL jobs, which run on the data lake, so the low-cost Data lake tier with one year of total retention meets the requirement at the lowest cost. Analytics rules need data in the Analytics tier, and Defender XDR tables are kept only 30 days in advanced hunting by default, so DeviceProcessEvents needs the Analytics tier with 180 days of analytics retention.
    fr: |
      Les journaux du pare-feu n'alimentent aucune règle d'analytique et ne sont lus que par des tâches KQL, qui s'exécutent sur le data lake : le niveau Data lake, peu coûteux, avec une rétention totale d'un an répond à l'exigence au coût le plus bas. Les règles d'analytique ont besoin de données au niveau Analytics, et les tables Defender XDR ne sont conservées que 30 jours dans le repérage avancé par défaut : DeviceProcessEvents nécessite le niveau Analytics avec 180 jours de rétention Analytics.
  options:
    an365: { en: "Keeping 600 GB per day in the Analytics tier for a year is far more expensive than the Data lake tier.", fr: "Conserver 600 Go par jour au niveau Analytics pendant un an coûte beaucoup plus cher que le niveau Data lake." }
    an90t365: { en: "The data would still be ingested and kept 90 days in the Analytics tier, which costs more than ingesting it only into the Data lake tier.", fr: "Les données seraient toujours ingérées et conservées 90 jours au niveau Analytics, ce qui coûte plus cher qu'une ingestion uniquement au niveau Data lake." }
    an30: { en: "30 days does not meet the one-year compliance requirement.", fr: "30 jours ne répondent pas à l'exigence de conformité d'un an." }
    default: { en: "The default advanced hunting retention is 30 days, and the data is not in the Analytics tier of the workspace.", fr: "La rétention par défaut du repérage avancé est de 30 jours, et les données ne sont pas au niveau Analytics de l'espace de travail." }
    lake180: { en: "Analytics rules do not run on Data lake tier tables.", fr: "Les règles d'analytique ne s'exécutent pas sur les tables du niveau Data lake." }
    an90: { en: "90 days is shorter than the 180 days required.", fr: "90 jours sont plus courts que les 180 jours requis." }
references:
  - title: Manage data tiers and retention in Microsoft Sentinel
    url: https://learn.microsoft.com/en-us/azure/sentinel/manage-data-overview
