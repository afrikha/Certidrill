id: sc200-1b-dg-hot-groups
objective: "1.1.9"
type: hotarea
difficulty: 2
status: draft
stem:
  en: |
    Adatum Corporation uses Microsoft Defender for Endpoint Plan 2. The device groups are shown in the following table.

    Answer each prompt by selecting the device group that the device joins.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum Corporation utilise Microsoft Defender for Endpoint Plan 2. Les groupes d'appareils figurent dans le tableau suivant.

    Répondez à chaque consigne en sélectionnant le groupe d'appareils que l'appareil rejoint.

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
    - id: p1
      text: { en: "SQL7: Windows Server 2022, tag SQL, domain adatum.com", fr: "SQL7 : Windows Server 2022, étiquette SQL, domaine adatum.com" }
    - id: p2
      text: { en: "LT-22: Windows 10, no tag, domain adatum.com", fr: "LT-22 : Windows 10, aucune étiquette, domaine adatum.com" }
  grid:
    header: [{ en: "Rank", fr: "Rang" }, { en: "Device group", fr: "Groupe d'appareils" }, { en: "Matching rule", fr: "Règle de correspondance" }, { en: "Automation level", fr: "Niveau d'automatisation" }]
    rows:
      - [{ text: "1" }, { text: DG-Servers, area: servers }, { text: "OS platform equals Windows Server 2022" }, { text: "Semi - require approval for core folders" }]
      - [{ text: "2" }, { text: DG-SQL, area: sql }, { text: "Tag equals SQL" }, { text: "Semi - require approval for all folders" }]
      - [{ text: "3" }, { text: DG-Workstations, area: ws }, { text: "OS platform equals Windows 11" }, { text: "Full - remediate threats automatically" }]
      - [{ text: { en: "Last", fr: "Dernier" } }, { text: Ungrouped devices (default), area: ung }, { text: "-" }, { text: "Full - remediate threats automatically" }]
answer:
  values: { p1: servers, p2: ung }
explanation:
  correct:
    en: |
      SQL7 matches both DG-Servers and DG-SQL; a device joins only the highest-ranked matching group, which is DG-Servers (rank 1). LT-22 runs Windows 10, so it matches no rule and is placed in Ungrouped devices.
    fr: |
      SQL7 correspond à DG-Servers et à DG-SQL ; un appareil ne rejoint que le groupe correspondant de rang le plus élevé, ici DG-Servers (rang 1). LT-22 exécute Windows 10 : il ne correspond à aucune règle et est placé dans Ungrouped devices.
  options:
    sql: { en: "DG-SQL also matches SQL7, but it is ranked below DG-Servers.", fr: "DG-SQL correspond aussi à SQL7, mais il est classé sous DG-Servers." }
    ws: { en: "DG-Workstations matches only Windows 11 devices.", fr: "DG-Workstations ne correspond qu'aux appareils Windows 11." }
references:
  - title: Create and manage device groups in Microsoft Defender for Endpoint
    url: https://learn.microsoft.com/en-us/defender-endpoint/machine-groups
