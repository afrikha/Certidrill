id: sc200-1b-wb-required-data
objective: "1.2.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso, Ltd. has a Microsoft Sentinel workspace onboarded to the Microsoft Defender portal. An analyst who has the Microsoft Sentinel Contributor role installs a solution from the Content hub, saves one of its workbook templates and opens the saved workbook.

    Every visualization in the workbook shows no results, while other workbooks display data normally.

    What should the analyst check first?
  fr: |
    Contoso, Ltd. dispose d'un espace de travail Microsoft Sentinel intégré au portail Microsoft Defender. Un analyste qui a le rôle Microsoft Sentinel Contributor installe une solution depuis le hub de contenu, enregistre l'un de ses modèles de classeur et ouvre le classeur enregistré.

    Aucune visualisation du classeur n'affiche de résultat, alors que les autres classeurs affichent normalement leurs données.

    Que doit vérifier l'analyste en premier ?
body:
  options:
    - { id: a, text: { en: "Whether the Auto refresh option of the workbook is turned on", fr: "Si l'option Auto refresh du classeur est activée" } }
    - { id: b, text: { en: "Whether the analyst also has the Workbook Contributor role", fr: "Si l'analyste a aussi le rôle Workbook Contributor" } }
    - { id: c, text: { en: "Whether the data types listed in Required data types of the template are ingested", fr: "Si les types de données listés dans Required data types du modèle sont ingérés" } }
    - { id: d, text: { en: "Whether the workbook was saved in the same region as the workspace", fr: "Si le classeur a été enregistré dans la même région que l'espace de travail" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Some workbook templates need specific data before they show anything. The template details list the Required data types; if the matching connector isn't configured, the queries return no data. The analyst can already save and open workbooks, so permissions aren't the issue.
    fr: |
      Certains modèles de classeur ont besoin de données précises avant d'afficher quoi que ce soit. Les détails du modèle listent les Required data types ; si le connecteur correspondant n'est pas configuré, les requêtes ne renvoient aucune donnée. L'analyste peut déjà enregistrer et ouvrir des classeurs : les autorisations ne sont pas en cause.
  options:
    a: { en: "Auto refresh only reruns the queries at an interval; empty queries stay empty.", fr: "Auto refresh ne fait que réexécuter les requêtes à intervalle régulier ; des requêtes vides restent vides." }
    b: { en: "The analyst could save the workbook, and Microsoft Sentinel Contributor already allows creating workbooks.", fr: "L'analyste a pu enregistrer le classeur, et Microsoft Sentinel Contributor permet déjà de créer des classeurs." }
    d: { en: "A saved workbook stores only its JSON definition and queries the workspace wherever it is saved in the resource group.", fr: "Un classeur enregistré ne stocke que sa définition JSON et interroge l'espace de travail quel que soit son emplacement dans le groupe de ressources." }
references:
  - title: Visualize your data by using workbooks in Microsoft Sentinel
    url: https://learn.microsoft.com/en-us/azure/sentinel/monitor-your-data
