id: sc200-1b-rl-securityinsights-scope
objective: "1.2.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Contoso, Ltd. has a resource group named **RG-Security** that contains two Log Analytics workspaces with Microsoft Sentinel: **law-emea** and **law-amer**.

    The EMEA analysts must manage incidents in law-emea only. You assign the Microsoft Sentinel Responder role to the EMEA analysts' group on the law-emea workspace resource.

    What else should you do to complete the assignment?
  fr: |
    Contoso, Ltd. dispose d'un groupe de ressources nommé **RG-Security** qui contient deux espaces de travail Log Analytics avec Microsoft Sentinel : **law-emea** et **law-amer**.

    Les analystes EMEA doivent gérer les incidents de law-emea uniquement. Vous attribuez le rôle Microsoft Sentinel Responder au groupe des analystes EMEA sur la ressource de l'espace de travail law-emea.

    Que devez-vous faire d'autre pour compléter l'attribution ?
body:
  options:
    - { id: a, text: { en: "Assign Microsoft Sentinel Reader to the group on RG-Security.", fr: "Attribuer Microsoft Sentinel Reader au groupe sur RG-Security." } }
    - { id: b, text: { en: "Assign Log Analytics Reader to the group on the law-emea workspace.", fr: "Attribuer Log Analytics Reader au groupe sur l'espace de travail law-emea." } }
    - { id: c, text: { en: "Assign Microsoft Sentinel Responder to the group on the SecurityInsights solution resource of law-emea.", fr: "Attribuer Microsoft Sentinel Responder au groupe sur la ressource de solution SecurityInsights de law-emea." } }
    - { id: d, text: { en: "Assign the Directory Readers role in Microsoft Entra ID to the group.", fr: "Attribuer au groupe le rôle Directory Readers dans Microsoft Entra ID." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Microsoft recommends assigning Sentinel roles on the resource group, but that would also cover law-amer here. When you assign them on the workspace instead, you must assign the same roles on the workspace's SecurityInsights solution resource.
    fr: |
      Microsoft recommande d'attribuer les rôles Sentinel sur le groupe de ressources, mais cela couvrirait aussi law-amer ici. Lorsque vous les attribuez plutôt sur l'espace de travail, vous devez attribuer les mêmes rôles sur la ressource de solution SecurityInsights de l'espace de travail.
  options:
    a: { en: "A role on RG-Security would give the analysts access to law-amer too.", fr: "Un rôle sur RG-Security donnerait aussi aux analystes l'accès à law-amer." }
    b: { en: "Log Analytics Reader lets users read workspace data; it doesn't complete a Sentinel role assigned at workspace scope.", fr: "Log Analytics Reader permet de lire les données de l'espace de travail ; il ne complète pas un rôle Sentinel attribué au niveau de l'espace de travail." }
    d: { en: "Directory Readers is needed only by guest users who assign incidents.", fr: "Directory Readers n'est nécessaire qu'aux utilisateurs invités qui attribuent des incidents." }
references:
  - title: Roles and permissions in the Microsoft Sentinel platform
    url: https://learn.microsoft.com/en-us/azure/sentinel/roles
