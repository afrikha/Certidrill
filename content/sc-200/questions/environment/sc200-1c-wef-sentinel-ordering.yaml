id: sc200-1c-wef-sentinel-ordering
objective: "1.3.3"
type: ordering
difficulty: 1
status: draft
stem:
  en: |
    Fabrikam has an on-premises Windows Event Collector named **WEC01** that runs Windows Server 2022. A source-initiated subscription already collects the Security events of the workstations into the Forwarded Events log of WEC01. The Windows Forwarded Events solution is installed in the Microsoft Sentinel workspace **law-fabrikam**.

    You need to ingest the forwarded events into law-fabrikam.

    Which three actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Fabrikam dispose d'un collecteur d'événements Windows local nommé **WEC01** qui exécute Windows Server 2022. Un abonnement initié par la source collecte déjà les événements de sécurité des stations de travail dans le journal Événements transférés de WEC01. La solution Windows Forwarded Events est installée dans l'espace de travail Microsoft Sentinel **law-fabrikam**.

    Vous devez ingérer les événements transférés dans law-fabrikam.

    Quelles sont les trois actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - { id: arc, text: { en: "Onboard WEC01 to Azure Arc.", fr: "Intégrer WEC01 à Azure Arc." } }
    - { id: dcr, text: { en: "On the Windows Forwarded Events connector page, create a data collection rule and add WEC01 as a resource.", fr: "Dans la page du connecteur Windows Forwarded Events, créer une règle de collecte de données et ajouter WEC01 comme ressource." } }
    - { id: query, text: { en: "Query the WindowsEvent table to confirm that the events arrive.", fr: "Interroger la table WindowsEvent pour confirmer l'arrivée des événements." } }
    - { id: wse, text: { en: "On the Windows Security Events via AMA connector page, create a data collection rule that targets the workstations.", fr: "Dans la page du connecteur Windows Security Events via AMA, créer une règle de collecte de données qui cible les stations de travail." } }
    - { id: mma, text: { en: "Install the Log Analytics agent on WEC01.", fr: "Installer l'agent Log Analytics sur WEC01." } }
    - { id: sec, text: { en: "Query the SecurityEvent table to confirm that the events arrive.", fr: "Interroger la table SecurityEvent pour confirmer l'arrivée des événements." } }
answer:
  sequence: [ arc, dcr, query ]
explanation:
  correct:
    en: WEC01 isn't an Azure VM, so it must be onboarded to Azure Arc before it can be selected in the data collection rule of the Windows Forwarded Events connector, which deploys the Azure Monitor Agent. The forwarded events, including Security events, are written to `WindowsEvent`.
    fr: WEC01 n'est pas une machine virtuelle Azure ; il doit donc être intégré à Azure Arc avant de pouvoir être sélectionné dans la règle de collecte de données du connecteur Windows Forwarded Events, qui déploie l'agent Azure Monitor. Les événements transférés, y compris les événements de sécurité, sont écrits dans `WindowsEvent`.
  options:
    wse:
      en: The workstations have no agent; only the collector is targeted.
      fr: Les stations de travail n'ont pas d'agent ; seul le collecteur est ciblé.
    mma:
      en: The Log Analytics agent is retired; the connector uses the Azure Monitor Agent.
      fr: L'agent Log Analytics est retiré ; le connecteur utilise l'agent Azure Monitor.
    sec:
      en: Forwarded events aren't written to SecurityEvent.
      fr: Les événements transférés ne sont pas écrits dans SecurityEvent.
references:
  - title: Connect Microsoft Sentinel to other Microsoft services with a Windows agent-based data connector
    url: https://learn.microsoft.com/en-us/azure/sentinel/connect-services-windows-based
