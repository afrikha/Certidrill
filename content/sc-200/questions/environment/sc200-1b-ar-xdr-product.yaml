id: sc200-1b-ar-xdr-product
objective: "1.1.10"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Litware, Inc. has a Microsoft Sentinel workspace onboarded to the Microsoft Defender portal. Microsoft Defender for Endpoint and Microsoft Defender for Identity are deployed.

    You need to ensure that every new incident that contains at least one alert from Defender for Endpoint is assigned to an analyst named Analyst1 and gets the tag Endpoint. The solution must not require a playbook.

    What should you configure?
  fr: |
    Litware, Inc. dispose d'un espace de travail Microsoft Sentinel intégré au portail Microsoft Defender. Microsoft Defender for Endpoint et Microsoft Defender for Identity sont déployés.

    Vous devez vous assurer que chaque nouvel incident contenant au moins une alerte de Defender for Endpoint est attribué à un analyste nommé Analyst1 et reçoit l'étiquette Endpoint. La solution ne doit pas nécessiter de playbook.

    Que devez-vous configurer ?
body:
  options:
    - { id: a, text: { en: "An automation rule with the When alert is created trigger and a condition on the analytics rule name", fr: "Une règle d'automatisation avec le déclencheur When alert is created et une condition sur le nom de la règle d'analyse" } }
    - { id: b, text: { en: "A Microsoft incident creation rule in Microsoft Sentinel filtered on Defender for Endpoint", fr: "Une règle de création d'incidents Microsoft dans Microsoft Sentinel filtrée sur Defender for Endpoint" } }
    - { id: c, text: { en: "A near-real-time (NRT) analytics rule on the SecurityAlert table that creates incidents", fr: "Une règle d'analyse quasi en temps réel (NRT) sur la table SecurityAlert qui crée des incidents" } }
    - { id: d, text: { en: "An automation rule with the When incident is created trigger and a condition on Alert product names", fr: "Une règle d'automatisation avec le déclencheur When incident is created et une condition sur Alert product names" } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      In the Defender portal, incidents are created by Defender XDR correlation, and an incident-trigger automation rule runs when they are created. The Alert product names condition selects incidents that contain Defender for Endpoint alerts, and the Assign owner and Add tags actions need no playbook.
    fr: |
      Dans le portail Defender, les incidents sont créés par la corrélation de Defender XDR, et une règle d'automatisation à déclencheur d'incident s'exécute à leur création. La condition Alert product names sélectionne les incidents qui contiennent des alertes de Defender for Endpoint, et les actions Assign owner et Add tags ne demandent aucun playbook.
  options:
    a: { en: "Alert-trigger rules support only the Run playbook action, and in the Defender portal they don't cover Defender XDR alerts.", fr: "Les règles à déclencheur d'alerte ne prennent en charge que l'action Run playbook et, dans le portail Defender, elles ne couvrent pas les alertes de Defender XDR." }
    b: { en: "Once the workspace is onboarded to the Defender portal, Microsoft incident creation rules must be disabled; Defender XDR creates the incidents.", fr: "Une fois l'espace de travail intégré au portail Defender, les règles de création d'incidents Microsoft doivent être désactivées : Defender XDR crée les incidents." }
    c: { en: "A new analytics rule would create duplicate incidents and still wouldn't assign them or tag them.", fr: "Une nouvelle règle d'analyse créerait des incidents en double et ne les attribuerait ni ne les étiquetterait toujours pas." }
references:
  - title: Automate threat response in Microsoft Sentinel with automation rules
    url: https://learn.microsoft.com/en-us/azure/sentinel/automate-incident-handling-with-automation-rules
  - title: Create and use Microsoft Sentinel automation rules to manage response
    url: https://learn.microsoft.com/en-us/azure/sentinel/create-manage-use-automation-rules
