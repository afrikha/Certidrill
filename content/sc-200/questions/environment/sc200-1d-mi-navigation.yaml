id: sc200-1d-mi-navigation
objective: "1.4.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso has onboarded a Microsoft Sentinel workspace to the Microsoft Defender portal. The SOC manager asks you to show which MITRE ATT&CK techniques are covered by the active analytics rules of the workspace, displayed as a matrix of tactics and techniques.

    Where should you go in the Defender portal?
  fr: |
    Contoso a intégré un espace de travail Microsoft Sentinel au portail Microsoft Defender. Le responsable du SOC vous demande de montrer les techniques MITRE ATT&CK couvertes par les règles d'analytique actives de l'espace de travail, sous la forme d'une matrice de tactiques et de techniques.

    Où devez-vous aller dans le portail Defender ?
body:
  options:
    - { id: a, text: { en: "Microsoft Sentinel > Configuration > Analytics > Rule templates", fr: "Microsoft Sentinel > Configuration > Analytics > Rule templates" } }
    - { id: b, text: { en: "Microsoft Sentinel > Threat management > MITRE ATT&CK", fr: "Microsoft Sentinel > Threat management > MITRE ATT&CK" } }
    - { id: c, text: { en: "Threat intelligence > Threat analytics", fr: "Threat intelligence > Threat analytics" } }
    - { id: d, text: { en: "Microsoft Sentinel > Content management > Content hub", fr: "Microsoft Sentinel > Content management > Content hub" } }
answer: { optionId: b }
explanation:
  correct:
    en: The MITRE ATT&CK page (preview), under Microsoft Sentinel > Threat management, shows a matrix aligned with MITRE ATT&CK version 18. By default, it indicates the techniques covered by the currently active scheduled and NRT rules of the workspace.
    fr: La page MITRE ATT&CK (préversion), sous Microsoft Sentinel > Threat management, affiche une matrice alignée sur MITRE ATT&CK version 18. Par défaut, elle indique les techniques couvertes par les règles planifiées et NRT actuellement actives de l'espace de travail.
  options:
    a: { en: "Rule templates lists the templates available to create rules; it is not a coverage matrix of active rules.", fr: "Rule templates liste les modèles disponibles pour créer des règles ; ce n'est pas une matrice de couverture des règles actives." }
    c: { en: "Threat analytics provides reports on threats and campaigns, not the coverage of your analytics rules.", fr: "L'analytique des menaces (Threat analytics) fournit des rapports sur les menaces et les campagnes, pas la couverture de vos règles d'analytique." }
    d: { en: "Content hub installs solutions and their content; it does not display a coverage matrix.", fr: "Le hub de contenu installe les solutions et leur contenu ; il n'affiche pas de matrice de couverture." }
references:
  - title: View MITRE ATT&CK framework coverage in Microsoft Sentinel
    url: https://learn.microsoft.com/en-us/azure/sentinel/mitre-coverage
