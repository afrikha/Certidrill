id: sc200-1a-af-network-indicators
objective: "1.1.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove Bank uses Microsoft Defender for Endpoint Plan 2 on Windows 11 devices. Microsoft Defender Antivirus runs in active mode with cloud-based protection and behavior monitoring turned on. Users browse the web with Google Chrome, in which QUIC and Encrypted Client Hello are disabled.

    You need to block a malicious domain on the devices by creating a domain indicator in the Microsoft Defender portal.

    Which two actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove Bank utilise Microsoft Defender pour point de terminaison Plan 2 sur des appareils Windows 11. L'Antivirus Microsoft Defender s'exécute en mode actif avec la protection fournie par le cloud et la surveillance du comportement activées. Les utilisateurs naviguent avec Google Chrome, dans lequel QUIC et Encrypted Client Hello sont désactivés.

    Vous devez bloquer un domaine malveillant sur les appareils en créant un indicateur de domaine dans le portail Microsoft Defender.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Turn on the Custom network indicators advanced feature.", fr: "Activer la fonctionnalité avancée Custom network indicators." } }
    - { id: b, text: { en: "Turn on the Web content filtering advanced feature.", fr: "Activer la fonctionnalité avancée Web content filtering." } }
    - { id: c, text: { en: "Enable network protection in block mode on the devices.", fr: "Activer la protection réseau en mode blocage sur les appareils." } }
    - { id: d, text: { en: "Turn on the Allow or block file advanced feature.", fr: "Activer la fonctionnalité avancée Allow or block file." } }
    - { id: e, text: { en: "Turn on the EDR in block mode advanced feature.", fr: "Activer la fonctionnalité avancée EDR in block mode." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: Blocking IP addresses, URLs or domains with your own indicators requires the **Custom network indicators** advanced feature. In non-Microsoft browsers such as Chrome, the block is enforced by network protection, which must run in **block mode**; Microsoft Edge relies on SmartScreen instead.
    fr: Bloquer des adresses IP, des URL ou des domaines avec vos propres indicateurs exige la fonctionnalité avancée **Custom network indicators**. Dans les navigateurs non Microsoft comme Chrome, le blocage est appliqué par la protection réseau, qui doit être en **mode blocage** ; Microsoft Edge s'appuie plutôt sur SmartScreen.
  options:
    b: { en: "Web content filtering blocks website categories through a policy; it is not needed for a domain indicator.", fr: "Le filtrage du contenu web bloque des catégories de sites au moyen d'une stratégie ; il n'est pas nécessaire pour un indicateur de domaine." }
    d: { en: "Allow or block file enables file hash indicators, not network indicators.", fr: "Allow or block file active les indicateurs de hachage de fichier, pas les indicateurs réseau." }
    e: { en: "EDR in block mode blocks artifacts that EDR detects; it does not enforce domain indicators.", fr: "EDR in block mode bloque les artefacts détectés par l'EDR ; il n'applique pas les indicateurs de domaine." }
references:
  - title: Create indicators for IPs and URLs/domains
    url: https://learn.microsoft.com/en-us/defender-endpoint/indicator-ip-domain
  - title: Configure Advanced Features in Microsoft Defender for Endpoint
    url: https://learn.microsoft.com/en-us/defender-endpoint/advanced-features
