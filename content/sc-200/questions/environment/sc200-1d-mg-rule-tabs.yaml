id: sc200-1d-mg-rule-tabs
objective: "1.4.2"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    Woodgrove uses Microsoft Defender XDR. A custom detection rule named **Rule-Ransom** isolates devices automatically when its query returns results. You open the details page of Rule-Ransom.

    Where should you perform each task? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove utilise Microsoft Defender XDR. Une règle de détection personnalisée nommée **Rule-Ransom** isole automatiquement les appareils quand sa requête renvoie des résultats. Vous ouvrez la page de détails de Rule-Ransom.

    Où devez-vous effectuer chaque tâche ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      To classify an alert of Rule-Ransom as a false positive and link it to the incident INC-204, use [[alerts]].

      To check which devices Rule-Ransom isolated, use [[actions]].
    fr: |
      Pour classer une alerte de Rule-Ransom comme faux positif et la lier à l'incident INC-204, utilisez [[alerts]].

      Pour vérifier quels appareils Rule-Ransom a isolés, utilisez [[actions]].
  slots:
    - id: alerts
      options:
        - { id: talerts, text: { en: "the Triggered alerts tab", fr: "l'onglet Triggered alerts" } }
        - { id: tactions, text: { en: "the Triggered actions tab", fr: "l'onglet Triggered actions" } }
        - { id: modify, text: { en: "Modify query", fr: "Modify query" } }
    - id: actions
      options:
        - { id: talerts, text: { en: "the Triggered alerts tab", fr: "l'onglet Triggered alerts" } }
        - { id: tactions, text: { en: "the Triggered actions tab", fr: "l'onglet Triggered actions" } }
        - { id: modify, text: { en: "Modify query", fr: "Modify query" } }
answer:
  values: { alerts: talerts, actions: tactions }
explanation:
  correct:
    en: Triggered alerts lists the alerts generated by the rule; from an alert you can set its status and classification, link it to an incident, or run its query in Advanced hunting. Triggered actions lists the response actions that the rule took on its matches, such as device isolations.
    fr: Triggered alerts liste les alertes générées par la règle ; depuis une alerte, vous pouvez définir son état et sa classification, la lier à un incident ou exécuter sa requête dans le repérage avancé. Triggered actions liste les actions de réponse effectuées par la règle sur ses correspondances, comme les isolations d'appareils.
  options:
    modify: { en: "Modify query opens the rule query in Advanced hunting; it shows neither the alerts nor the actions of the rule.", fr: "Modify query ouvre la requête de la règle dans le repérage avancé ; il n'affiche ni les alertes ni les actions de la règle." }
references:
  - title: Manage existing custom detection rules
    url: https://learn.microsoft.com/en-us/defender-xdr/custom-detection-manage
