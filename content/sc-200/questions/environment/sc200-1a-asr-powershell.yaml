id: sc200-1a-asr-powershell
objective: "1.1.6"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam, Inc. has a standalone test server named **TEST1** that is onboarded to Microsoft Defender for Endpoint and isn't managed by Intune, Configuration Manager or Group Policy. Several ASR rules are already configured on TEST1 by using PowerShell.

    You need to add the rule **Block all Office applications from creating child processes** (GUID d4f940ab-401b-4efc-aadc-ad5f3c50688a) in audit mode. The existing rules and their modes must not change.

    How should you complete the command? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam, Inc. dispose d'un serveur de test autonome nommé **TEST1** intégré à Microsoft Defender pour point de terminaison, qui n'est géré ni par Intune, ni par Configuration Manager, ni par une stratégie de groupe. Plusieurs règles ASR sont déjà configurées sur TEST1 avec PowerShell.

    Vous devez ajouter la règle **Block all Office applications from creating child processes** (GUID d4f940ab-401b-4efc-aadc-ad5f3c50688a) en mode audit. Les règles existantes et leurs modes ne doivent pas changer.

    Comment devez-vous compléter la commande ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: powershell
  template: |
    [[cmdlet]] -AttackSurfaceReductionRules_Ids d4f940ab-401b-4efc-aadc-ad5f3c50688a -AttackSurfaceReductionRules_Actions [[mode]]
  slots:
    - id: cmdlet
      options:
        - { id: add, text: Add-MpPreference }
        - { id: set, text: Set-MpPreference }
        - { id: remove, text: Remove-MpPreference }
        - { id: get, text: Get-MpPreference }
    - id: mode
      options:
        - { id: audit, text: AuditMode }
        - { id: enabled, text: Enabled }
        - { id: warn, text: Warn }
        - { id: notconf, text: NotConfigured }
answer:
  values: { cmdlet: add, mode: audit }
explanation:
  correct:
    en: "`Add-MpPreference` adds rules without affecting the existing values, whereas `Set-MpPreference` overwrites all the existing rules and modes with the values you pass. The PowerShell value `AuditMode` (mode 2) puts the rule in audit mode; `Enabled` is Block (1) and `Warn` is Warn (6)."
    fr: "`Add-MpPreference` ajoute des règles sans modifier les valeurs existantes, alors que `Set-MpPreference` écrase toutes les règles et tous les modes existants avec les valeurs passées. La valeur PowerShell `AuditMode` (mode 2) met la règle en mode audit ; `Enabled` correspond à Block (1) et `Warn` à Warn (6)."
  options:
    set: { en: "Set-MpPreference would replace the existing rules with this single rule.", fr: "Set-MpPreference remplacerait les règles existantes par cette seule règle." }
    remove: { en: "Remove-MpPreference removes the specified rules.", fr: "Remove-MpPreference supprime les règles spécifiées." }
    get: { en: "Get-MpPreference only reads the current settings.", fr: "Get-MpPreference ne fait que lire les paramètres actuels." }
    enabled: { en: "Enabled puts the rule in Block mode.", fr: "Enabled met la règle en mode Block." }
    notconf: { en: "NotConfigured applies no setting and records no audit events.", fr: "NotConfigured n'applique aucun paramètre et n'enregistre aucun événement d'audit." }
references:
  - title: Configure ASR rules and exclusions
    url: https://learn.microsoft.com/en-us/defender-endpoint/enable-attack-surface-reduction
