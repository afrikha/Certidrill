id: sc200-sr2-scanner-tuning-2
objective: "1.1.2"
type: series_yesno
series: sc200-sr2-scanner-tuning
seriesOrder: 2
difficulty: 2
status: draft
stem:
  en: You create an alert tuning rule with the Hide alert action.
  fr: Vous créez une règle de réglage des alertes avec l'action Hide alert.
body:
  solution:
    en: In **Settings > Microsoft Defender XDR > Alert tuning**, you add a rule for the **Microsoft Defender for Endpoint** service source with a file condition that matches **C:\Tools\NetScan\netscan.exe**, and you select the **Hide alert** action.
    fr: Dans **Paramètres > Microsoft Defender XDR > Alert tuning**, vous ajoutez une règle pour la source de service **Microsoft Defender for Endpoint** avec une condition de fichier qui correspond à **C:\Tools\NetScan\netscan.exe**, et vous sélectionnez l'action **Hide alert**.
answer: { value: true }
explanation:
  correct:
    en: Hide alert suppresses matching alerts and prevents them from creating incidents, while the alerts remain in the AlertInfo and AlertEvidence tables. The action is supported for Defender for Endpoint alerts, and the file condition limits the rule to netscan.exe, so other alerts are not affected.
    fr: "Hide alert supprime les alertes correspondantes et les empêche de créer des incidents, tandis que les alertes restent dans les tables AlertInfo et AlertEvidence. L'action est prise en charge pour les alertes Defender for Endpoint, et la condition de fichier limite la règle à netscan.exe : les autres alertes ne sont pas affectées."
references:
  - title: Investigate alerts in Microsoft Defender XDR
    url: https://learn.microsoft.com/en-us/defender-xdr/investigate-alerts
