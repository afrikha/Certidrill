id: sc200-1a-ind-block-fail
objective: "1.1.4"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Adatum Corporation uses Microsoft Defender for Endpoint Plan 2. You created a file indicator with the **Block execution** action for the SHA-256 hash of **tool.exe** and scoped it to the device group that contains a Windows 11 device named **DEV-07**. Two days later, tool.exe still runs on DEV-07.

    Which two issues could cause this behavior?

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum Corporation utilise Microsoft Defender pour point de terminaison Plan 2. Vous avez créé un indicateur de fichier avec l'action **Block execution** pour le hachage SHA-256 de **tool.exe** et l'avez limité au groupe d'appareils qui contient un appareil Windows 11 nommé **DEV-07**. Deux jours plus tard, tool.exe s'exécute toujours sur DEV-07.

    Quels sont les deux problèmes qui pourraient expliquer ce comportement ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Microsoft Defender Antivirus runs in passive mode on DEV-07.", fr: "L'Antivirus Microsoft Defender s'exécute en mode passif sur DEV-07." } }
    - { id: b, text: { en: "Cloud-based protection is turned on for DEV-07.", fr: "La protection fournie par le cloud est activée pour DEV-07." } }
    - { id: c, text: { en: "A Microsoft Defender Antivirus exclusion covers the folder that contains tool.exe.", fr: "Une exclusion de l'Antivirus Microsoft Defender couvre le dossier qui contient tool.exe." } }
    - { id: d, text: { en: "The indicator uses a SHA-256 hash instead of an MD5 hash.", fr: "L'indicateur utilise un hachage SHA-256 au lieu d'un hachage MD5." } }
    - { id: e, text: { en: "tool.exe is a portable executable (PE) file.", fr: "tool.exe est un fichier exécutable portable (PE)." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: File indicators require Microsoft Defender Antivirus in active mode; they aren't supported in passive mode. File indicators also don't block files covered by Defender Antivirus exclusions, which come earlier in the precedence order and allow the file.
    fr: Les indicateurs de fichier exigent l'Antivirus Microsoft Defender en mode actif ; ils ne sont pas pris en charge en mode passif. Les indicateurs de fichier ne bloquent pas non plus les fichiers couverts par des exclusions de l'Antivirus Defender, qui interviennent plus tôt dans l'ordre de priorité et autorisent le fichier.
  options:
    b: { en: "Cloud-based protection is a prerequisite of file indicators, not a cause of failure.", fr: "La protection fournie par le cloud est un prérequis des indicateurs de fichier, pas une cause d'échec." }
    d: { en: "SHA-256 is supported, and it wins over SHA-1 and MD5 in conflicts.", fr: "SHA-256 est pris en charge, et il l'emporte sur SHA-1 et MD5 en cas de conflit." }
    e: { en: "On Windows, file indicators apply to PE files such as .exe and .dll.", fr: "Sous Windows, les indicateurs de fichier s'appliquent aux fichiers PE comme .exe et .dll." }
references:
  - title: Create indicators for files
    url: https://learn.microsoft.com/en-us/defender-endpoint/indicator-file
  - title: Overview of indicators in Microsoft Defender for Endpoint
    url: https://learn.microsoft.com/en-us/defender-endpoint/indicators-overview
