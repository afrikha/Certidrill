id: sc200-1a-cdc-statements
objective: "1.1.5"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Northwind Traders uses Microsoft Defender for Endpoint Plan 2 and a Microsoft Sentinel workspace connected to the Microsoft Defender portal. You created two custom data collection rules, **Rule-Proc** and **Rule-Net**, that target the same domain controllers.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind Traders utilise Microsoft Defender pour point de terminaison Plan 2 et un espace de travail Microsoft Sentinel connecté au portail Microsoft Defender. Vous avez créé deux règles de collecte de données personnalisée, **Rule-Proc** et **Rule-Net**, qui ciblent les mêmes contrôleurs de domaine.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: If Rule-Proc reaches 75,000 events on a domain controller within a rolling 24-hour window, Rule-Net keeps collecting events on that domain controller.
        fr: Si Rule-Proc atteint 75 000 événements sur un contrôleur de domaine dans une fenêtre glissante de 24 heures, Rule-Net continue de collecter des événements sur ce contrôleur de domaine.
    - id: s2
      text:
        en: For the tables they collect, the custom rules replace the default Defender for Endpoint telemetry of the domain controllers.
        fr: Pour les tables qu'elles collectent, les règles personnalisées remplacent la télémétrie par défaut de Defender pour point de terminaison des contrôleurs de domaine.
    - id: s3
      text:
        en: If you delete Rule-Net, the events that it already sent to Microsoft Sentinel are deleted too.
        fr: Si vous supprimez Rule-Net, les événements qu'elle a déjà envoyés à Microsoft Sentinel sont également supprimés.
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: The limit is 75,000 events per rule, per device, in a 24-hour rolling window; when a rule reaches it, only that rule stops collecting on the device until the window resets. Custom rules run alongside the default telemetry without replacing or modifying it. Deleting a rule is permanent and stops new collection, but historical data in Sentinel remains available.
    fr: La limite est de 75 000 événements par règle, par appareil, sur une fenêtre glissante de 24 heures ; quand une règle l'atteint, seule cette règle cesse de collecter sur l'appareil jusqu'à la réinitialisation de la fenêtre. Les règles personnalisées s'exécutent en plus de la télémétrie par défaut, sans la remplacer ni la modifier. La suppression d'une règle est définitive et arrête toute nouvelle collecte, mais les données historiques dans Sentinel restent disponibles.
references:
  - title: Custom data collection in Microsoft Defender for Endpoint
    url: https://learn.microsoft.com/en-us/defender-endpoint/custom-data-collection
  - title: Create and manage custom data collection rules in Microsoft Defender for Endpoint
    url: https://learn.microsoft.com/en-us/defender-endpoint/create-custom-data-collection-rules
