id: sc200-1d-an-compare-query
objective: "1.4.5"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    Tailspin has a Microsoft Sentinel workspace. You duplicated a built-in anomaly rule. The customized copy runs in Flighting mode, and the original rule runs in Production. You copied the **ID** of the original rule from the details pane.

    You need a query that returns, for the last seven days, one row per rule with the number of anomalies generated by the original rule and by the customized copy.

    How should you complete the query? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin dispose d'un espace de travail Microsoft Sentinel. Vous avez dupliqué une règle d'anomalie intégrée. La copie personnalisée s'exécute en mode Flighting, et la règle d'origine en Production. Vous avez copié l'**ID** de la règle d'origine depuis le volet de détails.

    Vous avez besoin d'une requête qui renvoie, pour les sept derniers jours, une ligne par règle avec le nombre d'anomalies générées par la règle d'origine et par la copie personnalisée.

    Comment devez-vous compléter la requête ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: kusto
  template: |
    Anomalies
    | where TimeGenerated > ago(7d)
    | where [[filter]] contains "<OriginalRuleId>"
    | summarize Total = count() by [[group]]
  slots:
    - id: filter
      options:
        - { id: template, text: AnomalyTemplateId }
        - { id: ruleid, text: RuleId }
        - { id: reasons, text: AnomalyReasons }
    - id: group
      options:
        - { id: ruleid, text: RuleId }
        - { id: template, text: AnomalyTemplateId }
        - { id: time, text: TimeGenerated }
answer:
  values: { filter: template, group: ruleid }
explanation:
  correct:
    en: In both the original rule and its customized copy, AnomalyTemplateId equals the RuleId of the original rule, so filtering on AnomalyTemplateId returns the anomalies of both rules. Each rule keeps its own RuleId, so grouping by RuleId returns one row per rule.
    fr: |
      Dans la règle d'origine comme dans sa copie personnalisée, AnomalyTemplateId est égal au RuleId de la règle d'origine : filtrer sur AnomalyTemplateId renvoie donc les anomalies des deux règles. Chaque règle garde son propre RuleId : regrouper par RuleId renvoie donc une ligne par règle.
  options:
    ruleid: { en: "As a filter, RuleId matches only the original rule; as a grouping key it is the right choice.", fr: "Comme filtre, RuleId ne correspond qu'à la règle d'origine ; comme clé de regroupement, c'est le bon choix." }
    reasons: { en: "AnomalyReasons explains why an anomaly fired; it does not contain the rule ID.", fr: "AnomalyReasons explique pourquoi une anomalie s'est déclenchée ; il ne contient pas l'ID de la règle." }
    template: { en: "As a grouping key, AnomalyTemplateId has the same value for both rules and returns a single row.", fr: "Comme clé de regroupement, AnomalyTemplateId a la même valeur pour les deux règles et renvoie une seule ligne." }
    time: { en: "Grouping by TimeGenerated returns one row per timestamp, not one row per rule.", fr: "Regrouper par TimeGenerated renvoie une ligne par horodatage, pas une ligne par règle." }
references:
  - title: Work with anomaly detection analytics rules in Microsoft Sentinel
    url: https://learn.microsoft.com/en-us/azure/sentinel/work-with-anomaly-rules
