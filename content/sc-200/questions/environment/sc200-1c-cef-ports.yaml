id: sc200-1c-cef-ports
objective: "1.3.4"
type: single
difficulty: 2
status: draft
shuffle: false
stem:
  en: |
    You troubleshoot a Linux log forwarder named **LNX-FWD1** that runs rsyslog and a current version of the Azure Monitor Agent (later than 1.28.11). The devices send their Syslog and CEF messages to LNX-FWD1 on port 514.

    You run `tcpdump` on LNX-FWD1 to check that rsyslog hands the messages to the Azure Monitor Agent.

    On which TCP port does the agent receive the messages from rsyslog?
  fr: |
    Vous dépannez un redirecteur de journaux Linux nommé **LNX-FWD1** qui exécute rsyslog et une version actuelle de l'agent Azure Monitor (postérieure à 1.28.11). Les équipements envoient leurs messages Syslog et CEF à LNX-FWD1 sur le port 514.

    Vous exécutez `tcpdump` sur LNX-FWD1 pour vérifier que rsyslog transmet les messages à l'agent Azure Monitor.

    Sur quel port TCP l'agent reçoit-il les messages de rsyslog ?
body:
  options:
    - { id: a, text: "443" }
    - { id: b, text: "514" }
    - { id: c, text: "5986" }
    - { id: d, text: "28330" }
answer: { optionId: d }
explanation:
  correct:
    en: The syslog daemon listens on port 514 (TCP and UDP) for the devices, then forwards the messages locally to the Azure Monitor Agent, which receives them on TCP port 28330 in version 1.28.11 and later. Earlier versions used a Unix domain socket.
    fr: Le démon syslog écoute les équipements sur le port 514 (TCP et UDP), puis transmet les messages en local à l'agent Azure Monitor, qui les reçoit sur le port TCP 28330 à partir de la version 1.28.11. Les versions antérieures utilisaient un socket de domaine Unix.
  options:
    a:
      en: Port 443 is the outbound port the agent uses to send data to Microsoft Sentinel.
      fr: Le port 443 est le port sortant utilisé par l'agent pour envoyer les données à Microsoft Sentinel.
    b:
      en: Port 514 is where the syslog daemon receives messages from the devices.
      fr: Le port 514 est celui sur lequel le démon syslog reçoit les messages des équipements.
    c:
      en: Port 5986 is WinRM over HTTPS, used by Windows Event Forwarding.
      fr: Le port 5986 est WinRM sur HTTPS, utilisé par le transfert d'événements Windows.
references:
  - title: Syslog and Common Event Format (CEF) via AMA connectors for Microsoft Sentinel
    url: https://learn.microsoft.com/en-us/azure/sentinel/cef-syslog-ama-overview
