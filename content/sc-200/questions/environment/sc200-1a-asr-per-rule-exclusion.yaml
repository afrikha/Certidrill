id: sc200-1a-asr-per-rule-exclusion
objective: "1.1.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove Bank deploys attack surface reduction (ASR) rules by using an endpoint security policy in the Microsoft Defender portal. The rule **Block use of copied or impersonated system tools** blocks a legitimate internal tool, **C:\Tools\Woodgrove\wgcopy.exe**.

    You need to allow wgcopy.exe to run. The file must still be evaluated by all the other ASR rules.

    What should you configure?
  fr: |
    Woodgrove Bank déploie des règles de réduction de la surface d'attaque (ASR) avec une stratégie de sécurité des points de terminaison dans le portail Microsoft Defender. La règle **Block use of copied or impersonated system tools** bloque un outil interne légitime, **C:\Tools\Woodgrove\wgcopy.exe**.

    Vous devez autoriser l'exécution de wgcopy.exe. Le fichier doit toujours être évalué par toutes les autres règles ASR.

    Que devez-vous configurer ?
body:
  options:
    - id: a
      text: { en: "A global ASR exclusion in the AttackSurfaceReductionOnlyExclusions setting", fr: "Une exclusion ASR globale dans le paramètre AttackSurfaceReductionOnlyExclusions" }
    - id: b
      text: { en: "A Microsoft Defender Antivirus exclusion for the file path", fr: "Une exclusion de l'Antivirus Microsoft Defender pour le chemin du fichier" }
    - id: c
      text: { en: "The Warn mode for the Block use of copied or impersonated system tools rule", fr: "Le mode Warn pour la règle Block use of copied or impersonated system tools" }
    - id: d
      text: { en: "A per-rule exclusion for the Block use of copied or impersonated system tools rule", fr: "Une exclusion par règle pour la règle Block use of copied or impersonated system tools" }
answer: { optionId: d }
explanation:
  correct:
    en: A **per-rule exclusion**, configured in the ASR only per rule exclusions section of the policy, applies only to the rule you select, so the file stays under every other ASR rule. The ASR reference recommends a global or per-rule exclusion for confirmed-legitimate files blocked by this rule.
    fr: "Une **exclusion par règle**, configurée dans la section ASR only per rule exclusions de la stratégie, ne s'applique qu'à la règle sélectionnée : le fichier reste soumis à toutes les autres règles ASR. La référence des règles ASR recommande une exclusion globale ou par règle pour les fichiers légitimes confirmés que bloque cette règle."
  options:
    a:
      en: A global exclusion applies to all ASR rules, so the file would escape the other rules too.
      fr: "Une exclusion globale s'applique à toutes les règles ASR : le fichier échapperait aussi aux autres règles."
    b:
      en: An antivirus exclusion removes the file from antivirus scanning, which is far broader than one ASR rule.
      fr: Une exclusion antivirus retire le fichier de l'analyse antivirus, ce qui est bien plus large qu'une règle ASR.
    c:
      en: Warn mode lets users bypass the block for every file the rule matches, not only for wgcopy.exe, and users still get interrupted.
      fr: Le mode Warn permet aux utilisateurs de contourner le blocage pour tous les fichiers que la règle détecte, pas seulement pour wgcopy.exe, et les utilisateurs restent interrompus.
references:
  - title: Configure ASR rules and exclusions
    url: https://learn.microsoft.com/en-us/defender-endpoint/enable-attack-surface-reduction
  - title: ASR rules reference
    url: https://learn.microsoft.com/en-us/defender-endpoint/attack-surface-reduction-rules-reference
