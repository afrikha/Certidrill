id: sc200-1a-ind-edge-path
objective: "1.1.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Woodgrove Bank uses Microsoft Defender for Endpoint Plan 2 on Windows 11 devices. Network protection runs in block mode, the Custom network indicators advanced feature is on, and QUIC and Encrypted Client Hello are disabled in Google Chrome. Domain indicators are already enforced in both Microsoft Edge and Chrome.

    Three days ago, you created a URL indicator with the Block execution action for `https://files.tailspintoys.com/tools/agent.zip`. On the same devices, the URL is blocked in Microsoft Edge but can still be downloaded in Chrome.

    What is the cause?
  fr: |
    Woodgrove Bank utilise Microsoft Defender pour point de terminaison Plan 2 sur des appareils Windows 11. La protection réseau s'exécute en mode blocage, la fonctionnalité avancée Custom network indicators est activée, et QUIC et Encrypted Client Hello sont désactivés dans Google Chrome. Les indicateurs de domaine sont déjà appliqués dans Microsoft Edge et dans Chrome.

    Il y a trois jours, vous avez créé un indicateur d'URL avec l'action Block execution pour `https://files.tailspintoys.com/tools/agent.zip`. Sur les mêmes appareils, l'URL est bloquée dans Microsoft Edge mais peut toujours être téléchargée dans Chrome.

    Quelle est la cause ?
body:
  options:
    - id: a
      text: { en: "Indicators that contain a full HTTPS URL path are enforced only in Microsoft Edge.", fr: "Les indicateurs qui contiennent un chemin d'URL HTTPS complet ne sont appliqués que dans Microsoft Edge." }
    - id: b
      text: { en: "Chrome traffic is evaluated by SmartScreen, which ignores custom URL indicators.", fr: "Le trafic de Chrome est évalué par SmartScreen, qui ignore les indicateurs d'URL personnalisés." }
    - id: c
      text: { en: "URL indicators need up to 48 hours to apply to non-Microsoft browsers.", fr: "Les indicateurs d'URL ont besoin de jusqu'à 48 heures pour s'appliquer aux navigateurs non Microsoft." }
    - id: d
      text: { en: "Web content filtering allows the category of the site, which overrides the indicator in Chrome.", fr: "Le filtrage du contenu web autorise la catégorie du site, ce qui remplace l'indicateur dans Chrome." }
answer: { optionId: a }
explanation:
  correct:
    en: In non-Microsoft browsers, network protection can block HTTPS FQDNs but not a full HTTPS URL path; indicators with a full URL path can only be blocked in Microsoft Edge, which uses SmartScreen. HTTP URLs, including full paths, can be blocked in any browser. To block the download in Chrome, block the domain or FQDN instead.
    fr: Dans les navigateurs non Microsoft, la protection réseau peut bloquer des FQDN HTTPS, mais pas un chemin d'URL HTTPS complet ; les indicateurs avec un chemin d'URL complet ne peuvent être bloqués que dans Microsoft Edge, qui utilise SmartScreen. Les URL HTTP, y compris les chemins complets, peuvent être bloquées dans n'importe quel navigateur. Pour bloquer le téléchargement dans Chrome, bloquez plutôt le domaine ou le FQDN.
  options:
    b:
      en: SmartScreen enforces indicators in Microsoft browsers; Chrome is covered by network protection.
      fr: SmartScreen applique les indicateurs dans les navigateurs Microsoft ; Chrome est couvert par la protection réseau.
    c:
      en: The delay applies to the device, not to a browser, and the indicator already works in Edge on the same devices after three days.
      fr: Le délai concerne l'appareil, pas un navigateur, et l'indicateur fonctionne déjà dans Edge sur les mêmes appareils après trois jours.
    d:
      en: Web content filtering only adds blocks by category; it doesn't override a block indicator.
      fr: Le filtrage du contenu web ne fait qu'ajouter des blocages par catégorie ; il ne remplace pas un indicateur de blocage.
references:
  - title: Create indicators for IPs and URLs/domains
    url: https://learn.microsoft.com/en-us/defender-endpoint/indicator-ip-domain
