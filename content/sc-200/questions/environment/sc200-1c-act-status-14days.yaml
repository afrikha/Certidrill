id: sc200-1c-act-status-14days
objective: "1.3.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Three months ago, you used the Azure Policy assignment wizard of the Azure Key Vault connector to assign the log streaming policy to a subscription named **Sub-Lab**, with a remediation task. The policy compliance view shows that every key vault of Sub-Lab is compliant and has a diagnostic setting that targets the Microsoft Sentinel workspace.

    The lab has been shut down for three weeks, and nobody has used its key vaults since then. The Azure Key Vault connector page now shows the connector as disconnected.

    What is the most likely cause?
  fr: |
    Il y a trois mois, vous avez utilisé l'assistant d'attribution Azure Policy du connecteur Azure Key Vault pour attribuer la stratégie d'envoi de journaux à un abonnement nommé **Sub-Lab**, avec une tâche de correction. La vue de conformité de la stratégie indique que tous les coffres de clés de Sub-Lab sont conformes et disposent d'un paramètre de diagnostic qui cible l'espace de travail Microsoft Sentinel.

    Le laboratoire est arrêté depuis trois semaines et personne n'a utilisé ses coffres de clés depuis. La page du connecteur Azure Key Vault indique désormais que le connecteur est déconnecté.

    Quelle est la cause la plus probable ?
body:
  options:
    - id: a
      text: { en: "The remediation task expired and removed the diagnostic settings of the key vaults.", fr: "La tâche de correction a expiré et a supprimé les paramètres de diagnostic des coffres de clés." }
    - id: b
      text: { en: "No data was ingested from the key vaults during the past 14 days.", fr: "Aucune donnée n'a été ingérée depuis les coffres de clés au cours des 14 derniers jours." }
    - id: c
      text: { en: "The policy assignment applies only to key vaults created after the assignment.", fr: "L'attribution de stratégie ne s'applique qu'aux coffres de clés créés après l'attribution." }
    - id: d
      text: { en: "The Owner role of the engineer who created the assignment was removed.", fr: "Le rôle Owner de l'ingénieur qui a créé l'attribution a été retiré." }
answer: { optionId: b }
explanation:
  correct:
    en: For Azure Policy-managed connectors, the status shows connected only if data was ingested at some point in the past 14 days. After 14 days without ingestion, the connector shows as disconnected, and the connected status returns as soon as data arrives again. Unused key vaults produce no logs.
    fr: Pour les connecteurs gérés par Azure Policy, l'état n'indique connecté que si des données ont été ingérées au cours des 14 derniers jours. Après 14 jours sans ingestion, le connecteur apparaît déconnecté, et l'état connecté revient dès que des données arrivent de nouveau. Des coffres de clés inutilisés ne produisent aucun journal.
  options:
    a:
      en: A remediation task deploys the missing settings once; it doesn't remove them, and the compliance view shows the settings in place.
      fr: Une tâche de correction déploie une fois les paramètres manquants ; elle ne les supprime pas, et la vue de conformité montre que les paramètres sont en place.
    c:
      en: The remediation task configured the existing key vaults, and the compliance view confirms it.
      fr: La tâche de correction a configuré les coffres de clés existants, et la vue de conformité le confirme.
    d:
      en: The diagnostic settings already deployed keep working; the role of the creator doesn't drive the connector status.
      fr: Les paramètres de diagnostic déjà déployés continuent de fonctionner ; le rôle du créateur ne détermine pas l'état du connecteur.
references:
  - title: Connect Microsoft Sentinel to other Microsoft services by using diagnostic settings-based connections
    url: https://learn.microsoft.com/en-us/azure/sentinel/connect-services-diagnostic-setting-based
