id: sc200-1b-rl-other-roles
objective: "1.2.1"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Northwind Traders uses Microsoft Sentinel. The workspace is in **RG-SOC** and the playbooks are in **RG-Playbooks**. Several tasks need a role other than the Microsoft Sentinel roles.

    Which role is required for each task? To answer, drag the appropriate roles to the correct tasks. Each role may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind Traders utilise Microsoft Sentinel. L'espace de travail se trouve dans **RG-SOC** et les playbooks dans **RG-Playbooks**. Plusieurs tâches exigent un rôle autre que les rôles Microsoft Sentinel.

    Quel rôle est nécessaire pour chaque tâche ? Pour répondre, faites glisser les rôles appropriés vers les tâches correspondantes. Chaque rôle peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: owner, text: Owner }
    - { id: dirread, text: Directory Readers }
    - { id: lacon, text: Log Analytics Contributor }
    - { id: wbcon, text: Workbook Contributor }
    - { id: logic, text: Logic App Contributor }
    - { id: monread, text: Monitoring Reader }
  targets:
    - id: t1
      text: { en: "An engineer grants the Microsoft Sentinel service account permissions on RG-Playbooks with Manage playbook permissions", fr: "Un ingénieur accorde au compte de service Microsoft Sentinel des autorisations sur RG-Playbooks avec Manage playbook permissions" }
    - id: t2
      text: { en: "A guest user from a partner, who already has Microsoft Sentinel Responder, must assign incidents", fr: "Un utilisateur invité d'un partenaire, qui a déjà Microsoft Sentinel Responder, doit attribuer des incidents" }
    - id: t3
      text: { en: "An administrator changes the retention of tables by using Azure permissions on the workspace", fr: "Un administrateur modifie la rétention des tables à l'aide d'autorisations Azure sur l'espace de travail" }
    - id: t4
      text: { en: "An analyst who has Microsoft Sentinel Responder must create and delete workbooks", fr: "Un analyste qui a Microsoft Sentinel Responder doit créer et supprimer des classeurs" }
answer:
  mapping: { t1: owner, t2: dirread, t3: lacon, t4: wbcon }
explanation:
  correct:
    en: |
      Granting Microsoft Sentinel permissions on a playbook resource group requires Owner or User Access Administrator on that resource group; Owner is the only one of the two in the list. Guest users also need the Microsoft Entra role Directory Readers to assign incidents. Table settings need write permissions on the workspace and its tables, which Log Analytics Contributor provides. Creating and deleting workbooks with a lesser Sentinel role needs Workbook Contributor.
    fr: |
      Accorder des autorisations Microsoft Sentinel sur le groupe de ressources d'un playbook exige Owner ou User Access Administrator sur ce groupe de ressources ; Owner est le seul des deux dans la liste. Les utilisateurs invités ont aussi besoin du rôle Microsoft Entra Directory Readers pour attribuer des incidents. Les paramètres de table exigent des autorisations d'écriture sur l'espace de travail et ses tables, que fournit Log Analytics Contributor. Créer et supprimer des classeurs avec un rôle Sentinel inférieur exige Workbook Contributor.
  options:
    logic: { en: "Logic App Contributor creates and edits playbooks; it can't grant permissions to the service account.", fr: "Logic App Contributor crée et modifie des playbooks ; il ne peut pas accorder d'autorisations au compte de service." }
    monread: { en: "Monitoring Reader only reads monitoring data and settings.", fr: "Monitoring Reader ne fait que lire les données et paramètres de supervision." }
references:
  - title: Roles and permissions in the Microsoft Sentinel platform
    url: https://learn.microsoft.com/en-us/azure/sentinel/roles
  - title: Configure Table Settings in Microsoft Sentinel
    url: https://learn.microsoft.com/en-us/azure/sentinel/manage-table-tiers-retention
