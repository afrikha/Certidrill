id: sc200-cs4a-firewall-retention
objective: "1.2.2"
type: dropdown
caseStudy: sc200-cs4a-munsons
difficulty: 2
status: draft
stem:
  en: |
    You need to configure the CommonSecurityLog table to meet the firewall log retention requirement.

    How should you complete the configuration? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez configurer la table CommonSecurityLog pour respecter l'exigence relative à la rétention des journaux des pare-feu.

    Comment devez-vous compléter la configuration ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Analytics retention: [[ar]]

      Total retention: [[tr]]

      To query firewall events that are older than the analytics retention period, use [[q]].
    fr: |
      Rétention Analytics : [[ar]]

      Rétention totale : [[tr]]

      Pour interroger les événements des pare-feu plus anciens que la période de rétention Analytics, utilisez [[q]].
  slots:
    - id: ar
      options:
        - { id: d30, text: { en: "30 days", fr: "30 jours" } }
        - { id: d90, text: { en: "90 days", fr: "90 jours" } }
        - { id: y1, text: { en: "1 year", fr: "1 an" } }
        - { id: y2, text: { en: "2 years", fr: "2 ans" } }
    - id: tr
      options:
        - { id: d90, text: { en: "90 days", fr: "90 jours" } }
        - { id: y1, text: { en: "1 year", fr: "1 an" } }
        - { id: y3, text: { en: "3 years", fr: "3 ans" } }
        - { id: y12, text: { en: "12 years", fr: "12 ans" } }
    - id: q
      options:
        - { id: job, text: { en: "a KQL job", fr: "une tâche KQL" } }
        - { id: rule, text: { en: "a scheduled analytics rule", fr: "une règle d'analytique planifiée" } }
        - { id: wb, text: { en: "a workbook", fr: "un classeur" } }
        - { id: hunt, text: { en: "a hunting query", fr: "une requête de chasse" } }
answer:
  values: { ar: d90, tr: y3, q: job }
explanation:
  correct:
    en: |
      Analytics retention keeps data in the analytics tier, where analytics rules and hunting queries run, so it must be 90 days; a longer value adds analytics-tier storage costs. Total retention, which can reach 12 years, must be three years: after 90 days the data stays only in the lower-cost data lake tier. Data that is only in the data lake is queried with KQL jobs, notebooks, or search jobs.
    fr: |
      La rétention Analytics conserve les données dans le niveau Analytics, où s'exécutent les règles d'analytique et les requêtes de chasse : elle doit être de 90 jours, une valeur plus longue ajoutant des coûts de stockage du niveau Analytics. La rétention totale, qui peut atteindre 12 ans, doit être de trois ans : après 90 jours, les données ne restent que dans le niveau data lake, moins coûteux. Les données présentes uniquement dans le data lake s'interrogent avec des tâches KQL, des notebooks ou des travaux de recherche.
  options:
    d30: { en: "30 days is the default and does not keep the events in the analytics tier for the required 90 days.", fr: "30 jours est la valeur par défaut et ne conserve pas les événements dans le niveau Analytics pendant les 90 jours exigés." }
    y12: { en: "Twelve years keeps the events longer than required and increases data lake storage costs.", fr: "Douze ans conservent les événements plus longtemps que nécessaire et augmentent les coûts de stockage du data lake." }
    rule: { en: "Analytics rules do not run on data that is stored only in the data lake tier.", fr: "Les règles d'analytique ne s'exécutent pas sur des données stockées uniquement dans le niveau data lake." }
    wb: { en: "Workbooks are not supported on data that is stored only in the data lake tier.", fr: "Les classeurs ne sont pas pris en charge sur des données stockées uniquement dans le niveau data lake." }
    hunt: { en: "Hunting queries are not supported on data that is stored only in the data lake tier.", fr: "Les requêtes de chasse ne sont pas prises en charge sur des données stockées uniquement dans le niveau data lake." }
references:
  - title: Manage data tiers and retention in Microsoft Sentinel
    url: https://learn.microsoft.com/en-us/azure/sentinel/manage-data-overview
