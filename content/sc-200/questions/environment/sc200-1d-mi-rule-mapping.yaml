id: sc200-1d-mi-rule-mapping
objective: "1.4.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Adatum has a Microsoft Sentinel workspace. You created and enabled a custom scheduled analytics rule named **Rule-Forward** that detects new inbox rules forwarding mail to external addresses.

    On the MITRE ATT&CK page, the technique **T1114 Email Collection** still shows no active detection.

    You need Rule-Forward to count as coverage of T1114.

    What should you do?
  fr: |
    Adatum dispose d'un espace de travail Microsoft Sentinel. Vous avez créé et activé une règle d'analytique planifiée personnalisée nommée **Rule-Forward** qui détecte les nouvelles règles de boîte de réception transférant le courrier vers des adresses externes.

    Sur la page MITRE ATT&CK, la technique **T1114 Email Collection** n'affiche toujours aucune détection active.

    Rule-Forward doit compter dans la couverture de T1114.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Edit Rule-Forward and, on the General tab, select the Collection tactic and the T1114 technique.", fr: "Modifier Rule-Forward et, dans l'onglet Général, sélectionner la tactique Collection et la technique T1114." } }
    - { id: b, text: { en: "Edit Rule-Forward and, on the Set rule logic tab, add a custom detail named Technique with the value T1114.", fr: "Modifier Rule-Forward et, dans l'onglet Définir la logique de la règle, ajouter un détail personnalisé nommé Technique avec la valeur T1114." } }
    - { id: c, text: { en: "Edit Rule-Forward and, on the Set rule logic tab, map the Mailbox entity to the recipient column.", fr: "Modifier Rule-Forward et, dans l'onglet Définir la logique de la règle, mapper l'entité Mailbox à la colonne du destinataire." } }
    - { id: d, text: { en: "Create a hunting query with the same logic as Rule-Forward, and map the query to T1114.", fr: "Créer une requête de chasse avec la même logique que Rule-Forward, puis mapper la requête à T1114." } }
answer: { optionId: a }
explanation:
  correct:
    en: The coverage matrix is built from the MITRE ATT&CK tactics and techniques that you select when you configure each analytics rule, on its General tab. Once Rule-Forward is mapped to T1114 and active, the technique shows an active detection.
    fr: La matrice de couverture est construite à partir des tactiques et techniques MITRE ATT&CK que vous sélectionnez en configurant chaque règle d'analytique, dans son onglet Général. Une fois Rule-Forward mappée à T1114 et active, la technique affiche une détection active.
  options:
    b: { en: "Custom details surface query fields in the alert; they do not set the MITRE ATT&CK mapping of the rule.", fr: "Les détails personnalisés exposent des champs de la requête dans l'alerte ; ils ne définissent pas le mappage MITRE ATT&CK de la règle." }
    c: { en: "Entity mapping identifies the entities of the alert; it does not map the rule to a technique.", fr: "Le mappage d'entités identifie les entités de l'alerte ; il ne mappe pas la règle à une technique." }
    d: { en: "Hunting queries do not count as active detections in the coverage matrix.", fr: "Les requêtes de chasse ne comptent pas comme détections actives dans la matrice de couverture." }
references:
  - title: View MITRE ATT&CK framework coverage in Microsoft Sentinel
    url: https://learn.microsoft.com/en-us/azure/sentinel/mitre-coverage
