id: sc200-1a-notif-failed-quarantine
objective: "1.1.1"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    Litware, Inc. uses Microsoft Defender XDR and Microsoft Defender for Endpoint. The servers are in a device group named **Servers**.

    The server team must receive an email when an automated quarantine of a file fails on a device in the Servers device group. The team must not receive emails for actions that analysts run manually, for actions that complete successfully, or for devices in other device groups.

    How should you configure the notification rule? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware, Inc. utilise Microsoft Defender XDR et Microsoft Defender pour point de terminaison. Les serveurs se trouvent dans un groupe d'appareils nommé **Servers**.

    L'équipe serveurs doit recevoir un e-mail lorsqu'une mise en quarantaine automatisée d'un fichier échoue sur un appareil du groupe d'appareils Servers. L'équipe ne doit pas recevoir d'e-mails pour les actions que les analystes exécutent manuellement, pour les actions qui se terminent correctement, ni pour les appareils des autres groupes d'appareils.

    Comment devez-vous configurer la règle de notification ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Email notifications tab: [[tab]]
      Action source: [[source]]
      Action status: [[status]]
      Device groups scope: [[scope]]
    fr: |
      Onglet des notifications par e-mail : [[tab]]
      Source de l'action : [[source]]
      Statut de l'action : [[status]]
      Étendue des groupes d'appareils : [[scope]]
  slots:
    - id: tab
      options:
        - { id: inc, text: Incidents }
        - { id: act, text: Actions }
        - { id: ta, text: Threat analytics }
    - id: source
      options:
        - { id: man, text: { en: "Manual", fr: "Manuelle" } }
        - { id: auto, text: { en: "Automated", fr: "Automatisée" } }
        - { id: both, text: { en: "Manual and automated", fr: "Manuelle et automatisée" } }
    - id: status
      options:
        - { id: done, text: { en: "Completed", fr: "Terminée" } }
        - { id: fail, text: { en: "Failed", fr: "Échouée" } }
        - { id: all, text: { en: "Completed and failed", fr: "Terminée et échouée" } }
    - id: scope
      options:
        - { id: allg, text: All device groups }
        - { id: sel, text: Selected device groups }
answer:
  values: { tab: act, source: auto, status: fail, scope: sel }
explanation:
  correct:
    en: Notifications about response actions are rules on the **Actions** tab. Selecting the **automated** action source excludes the manual actions, the **failed** status excludes the completed actions, and **Selected device groups** with the Servers group limits the emails to the servers. All device groups would include current and future groups.
    fr: Les notifications sur les actions de réponse sont des règles de l'onglet **Actions**. La source d'action **automatisée** exclut les actions manuelles, le statut **échouée** exclut les actions terminées, et **Selected device groups** avec le groupe Servers limite les e-mails aux serveurs. All device groups inclurait les groupes actuels et futurs.
  options:
    inc: { en: "Incident rules notify about new incidents, not about the result of a response action.", fr: "Les règles d'incident notifient les nouveaux incidents, pas le résultat d'une action de réponse." }
    both: { en: "Including manual actions would notify the team about actions that analysts run.", fr: "Inclure les actions manuelles notifierait l'équipe des actions exécutées par les analystes." }
    all: { en: "Including the completed status would notify the team about successful quarantines too.", fr: "Inclure le statut terminée notifierait aussi l'équipe des mises en quarantaine réussies." }
references:
  - title: Get email notifications for response actions
    url: https://learn.microsoft.com/en-us/defender-xdr/m365d-response-actions-notifications
