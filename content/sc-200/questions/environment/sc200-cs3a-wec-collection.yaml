id: sc200-cs3a-wec-collection
objective: "1.3.3"
type: yesno_statements
caseStudy: sc200-cs3a-trey-research
difficulty: 2
status: draft
stem:
  en: |
    You plan to meet the requirement for the lab servers by using the Windows Forwarded Events connector in law-trey-soc.

    For each of the following statements, select Yes if the statement is true. Otherwise, select No.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous prévoyez de respecter l'exigence relative aux serveurs de laboratoire avec le connecteur Windows Forwarded Events dans law-trey-soc.

    Pour chacune des affirmations suivantes, sélectionnez Oui si l'affirmation est vraie. Sinon, sélectionnez Non.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text: { en: "The Security events of the lab servers will be stored in the WindowsEvent table.", fr: "Les événements Security des serveurs de laboratoire seront stockés dans la table WindowsEvent." }
    - id: s2
      text: { en: "The built-in analytics rules that query the SecurityEvent table will detect threats in these events without modification.", fr: "Les règles d'analytique intégrées qui interrogent la table SecurityEvent détecteront les menaces dans ces événements sans modification." }
    - id: s3
      text: { en: "In the data collection rule of the connector, you add WEC1 as a resource.", fr: "Dans la règle de collecte de données du connecteur, vous ajoutez WEC1 comme ressource." }
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |
      The Windows Forwarded Events connector stores the events that the collector receives, including Security log events, in the WindowsEvent table, not in SecurityEvent. Built-in rules written for SecurityEvent therefore do not match this data unless you adapt them to WindowsEvent or to ASIM parsers. The Azure Monitor Agent runs on the Windows Event Collector, so the DCR targets WEC1, which is possible because WEC1 is Azure Arc-enabled.
    fr: |
      Le connecteur Windows Forwarded Events stocke les événements reçus par le collecteur, y compris ceux du journal Security, dans la table WindowsEvent et non dans SecurityEvent. Les règles intégrées écrites pour SecurityEvent ne correspondent donc pas à ces données, sauf si vous les adaptez à WindowsEvent ou aux analyseurs ASIM. L'agent Azure Monitor s'exécute sur le collecteur d'événements Windows : la DCR cible donc WEC1, ce qui est possible car WEC1 est compatible Azure Arc.
  options:
    s2: { en: "Those rules query SecurityEvent, while forwarded events land in WindowsEvent; to keep them unchanged you would need the Windows Security Events via AMA connector on each server.", fr: "Ces règles interrogent SecurityEvent, alors que les événements transférés arrivent dans WindowsEvent ; pour les garder inchangées, il faudrait le connecteur Windows Security Events via AMA sur chaque serveur." }
references:
  - title: Connect Microsoft Sentinel to other Microsoft services with a Windows agent-based data connector
    url: https://learn.microsoft.com/en-us/azure/sentinel/connect-services-windows-based
