id: sc200-1a-af-edr-block
objective: "1.1.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Northwind Traders onboarded its Windows 11 devices to Microsoft Defender for Endpoint. A non-Microsoft antivirus product is the primary antivirus, and Microsoft Defender Antivirus runs in passive mode.

    You need Defender for Endpoint to block and remediate the malicious artifacts that its EDR capabilities detect on these devices, without replacing the non-Microsoft antivirus.

    Which advanced feature should you turn on?
  fr: |
    Northwind Traders a intégré ses appareils Windows 11 à Microsoft Defender pour point de terminaison. Un antivirus non Microsoft est l'antivirus principal, et l'Antivirus Microsoft Defender s'exécute en mode passif.

    Vous devez faire en sorte que Defender pour point de terminaison bloque et corrige les artefacts malveillants détectés par ses capacités EDR sur ces appareils, sans remplacer l'antivirus non Microsoft.

    Quelle fonctionnalité avancée devez-vous activer ?
body:
  options:
    - { id: a, text: Tamper protection }
    - { id: b, text: EDR in block mode }
    - { id: c, text: Allow or block file }
    - { id: d, text: Automatically resolve alerts }
answer: { optionId: b }
explanation:
  correct:
    en: "**EDR in block mode** blocks the malicious artifacts or behaviors that Defender for Endpoint detects on a device, even when Microsoft Defender Antivirus runs in passive mode, and remediates them after a breach. The non-Microsoft antivirus stays the primary antivirus."
    fr: "**EDR in block mode** bloque les artefacts ou comportements malveillants que Defender pour point de terminaison détecte sur un appareil, même lorsque l'Antivirus Microsoft Defender s'exécute en mode passif, et les corrige après une compromission. L'antivirus non Microsoft reste l'antivirus principal."
  options:
    a:
      en: Tamper protection prevents apps and users from changing Defender Antivirus security settings; it does not block EDR detections.
      fr: La protection contre les falsifications empêche les applications et les utilisateurs de modifier les paramètres de sécurité de l'Antivirus Defender ; elle ne bloque pas les détections EDR.
    c:
      en: Allow or block file needs Defender Antivirus as the active antimalware solution, and it only enables file indicators.
      fr: Allow or block file exige que l'Antivirus Defender soit la solution anti-programme malveillant active, et il ne fait qu'activer les indicateurs de fichier.
    d:
      en: Automatically resolve alerts closes alerts when no threat is found or the threat was remediated; it does not block anything.
      fr: Automatically resolve alerts ferme les alertes lorsqu'aucune menace n'est trouvée ou que la menace a été corrigée ; elle ne bloque rien.
references:
  - title: Configure Advanced Features in Microsoft Defender for Endpoint
    url: https://learn.microsoft.com/en-us/defender-endpoint/advanced-features
