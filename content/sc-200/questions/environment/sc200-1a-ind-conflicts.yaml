id: sc200-1a-ind-conflicts
objective: "1.1.4"
type: yesno_statements
difficulty: 3
status: draft
stem:
  en: |
    Northwind Traders uses Microsoft Defender for Endpoint Plan 2. Microsoft Defender Antivirus runs in active mode, network protection runs in block mode, and the Allow or block file and Custom network indicators advanced features are on. The marketing devices are in a device group named **Marketing**.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind Traders utilise Microsoft Defender pour point de terminaison Plan 2. L'Antivirus Microsoft Defender s'exécute en mode actif, la protection réseau en mode blocage, et les fonctionnalités avancées Allow or block file et Custom network indicators sont activées. Les appareils marketing se trouvent dans un groupe d'appareils nommé **Marketing**.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: If a file has a Block execution indicator on its SHA-256 hash and an Allow indicator on its MD5 hash, both scoped to all devices, the file is blocked.
        fr: Si un fichier a un indicateur Block execution sur son hachage SHA-256 et un indicateur Allow sur son hachage MD5, tous deux appliqués à tous les appareils, le fichier est bloqué.
    - id: s2
      text:
        en: If the domain partner.fabrikam.com has a Block execution indicator for all devices and an Allow indicator for the Marketing device group, a Marketing device can open the site.
        fr: Si le domaine partner.fabrikam.com a un indicateur Block execution pour tous les appareils et un indicateur Allow pour le groupe d'appareils Marketing, un appareil Marketing peut ouvrir le site.
    - id: s3
      text:
        en: You can block the public range 203.0.113.0/24 by creating a single IP address indicator for that range.
        fr: Vous pouvez bloquer la plage publique 203.0.113.0/24 en créant un seul indicateur d'adresse IP pour cette plage.
answer:
  values: { s1: true, s2: true, s3: false }
explanation:
  correct:
    en: For conflicting file indicators, the more secure (longer) hash wins, so SHA-256 beats MD5; in the file precedence order, a block indicator is also evaluated before an allow indicator. For IP, URL and domain indicators, the precedence is Allow, then Warn, then Block, so the Allow indicator wins on Marketing devices. IP indicators support single addresses only; CIDR blocks and ranges aren't supported.
    fr: "En cas de conflit entre indicateurs de fichier, le hachage le plus sûr (le plus long) l'emporte : SHA-256 prévaut sur MD5 ; dans l'ordre de priorité des fichiers, un indicateur de blocage est aussi évalué avant un indicateur d'autorisation. Pour les indicateurs d'IP, d'URL et de domaine, la priorité est Allow, puis Warn, puis Block : l'indicateur Allow l'emporte sur les appareils Marketing. Les indicateurs d'IP ne prennent en charge que des adresses uniques ; les blocs CIDR et les plages ne sont pas pris en charge."
references:
  - title: Create indicators for files
    url: https://learn.microsoft.com/en-us/defender-endpoint/indicator-file
  - title: Create indicators for IPs and URLs/domains
    url: https://learn.microsoft.com/en-us/defender-endpoint/indicator-ip-domain
