id: sc200-1b-rl-lake-read
objective: "1.2.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Tailspin Toys has onboarded Microsoft Sentinel to the Microsoft Defender portal and to the Microsoft Sentinel data lake. The tenant has four Sentinel workspaces.

    Auditors must run interactive queries on the data lake of all the workspaces. They must not be able to write to tables or manage data lake jobs.

    Which two Microsoft Entra roles meet the requirements? Each correct answer presents a complete solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin Toys a intégré Microsoft Sentinel au portail Microsoft Defender et au data lake Microsoft Sentinel. Le locataire compte quatre espaces de travail Sentinel.

    Les auditeurs doivent exécuter des requêtes interactives sur le data lake de tous les espaces de travail. Ils ne doivent pas pouvoir écrire dans des tables ni gérer les tâches du data lake.

    Quels sont les deux rôles Microsoft Entra qui répondent aux exigences ? Chaque bonne réponse constitue une solution complète.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: Security Operator }
    - { id: b, text: Global Reader }
    - { id: c, text: Security Administrator }
    - { id: d, text: Security Reader }
    - { id: e, text: Reports Reader }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |
      Read access to the data lake across all workspaces comes from the Microsoft Entra roles Global Reader, Security Reader, Security Operator, Security Administrator or Global Administrator. Only Global Reader and Security Reader don't also grant write access with KQL jobs or the management of data lake jobs.
    fr: |
      La lecture du data lake de tous les espaces de travail provient des rôles Microsoft Entra Global Reader, Security Reader, Security Operator, Security Administrator ou Global Administrator. Seuls Global Reader et Security Reader n'accordent pas aussi l'écriture avec des tâches KQL ou la gestion des tâches du data lake.
  options:
    a: { en: "Security Operator can also write with KQL jobs and notebooks and manage data lake jobs.", fr: "Security Operator peut aussi écrire avec des tâches KQL et des notebooks et gérer les tâches du data lake." }
    c: { en: "Security Administrator has the same write permissions as Security Operator, and more.", fr: "Security Administrator a les mêmes autorisations d'écriture que Security Operator, et davantage." }
    e: { en: "Reports Reader reads usage reports; it isn't one of the roles that grant data lake access.", fr: "Reports Reader lit les rapports d'utilisation ; il ne fait pas partie des rôles qui donnent accès au data lake." }
references:
  - title: Roles and permissions in the Microsoft Sentinel platform
    url: https://learn.microsoft.com/en-us/azure/sentinel/roles
