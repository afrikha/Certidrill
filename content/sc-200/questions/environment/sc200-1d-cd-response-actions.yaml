id: sc200-1d-cd-response-actions
objective: "1.4.1"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Wingtip uses Microsoft Defender XDR. You are creating custom detection rules from advanced hunting queries on Defender for Endpoint tables. The query results include DeviceId, SHA1 and AccountObjectId.

    Each rule must take an automatic response action when its query returns results.

    Which response action should you select for each requirement? To answer, drag the appropriate actions to the correct requirements. Each action may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Wingtip utilise Microsoft Defender XDR. Vous créez des règles de détection personnalisées à partir de requêtes de repérage avancé sur des tables de Defender pour point de terminaison. Les résultats des requêtes incluent DeviceId, SHA1 et AccountObjectId.

    Chaque règle doit effectuer une action de réponse automatique quand sa requête renvoie des résultats.

    Quelle action de réponse devez-vous sélectionner pour chaque exigence ? Pour répondre, faites glisser les actions appropriées vers les exigences correspondantes. Chaque action peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: isolate, text: Isolate device }
    - { id: restrict, text: Restrict app execution }
    - { id: compromised, text: Mark user as compromised }
    - { id: quarantine, text: Quarantine file }
    - { id: package, text: Collect investigation package }
    - { id: scan, text: Run antivirus scan }
  targets:
    - id: t1
      text: { en: "Cut the device off from the network", fr: "Couper l'appareil du réseau" }
    - id: t2
      text: { en: "Allow only files signed by Microsoft to run on the device", fr: "N'autoriser que l'exécution des fichiers signés par Microsoft sur l'appareil" }
    - id: t3
      text: { en: "Set the risk level of the user in Microsoft Entra ID to high", fr: "Définir à élevé le niveau de risque de l'utilisateur dans Microsoft Entra ID" }
    - id: t4
      text: { en: "Delete the file and keep a copy of it in quarantine", fr: "Supprimer le fichier et en conserver une copie en quarantaine" }
answer:
  mapping: { t1: isolate, t2: restrict, t3: compromised, t4: quarantine }
explanation:
  correct:
    en: Isolate device disconnects the device from the network. Restrict app execution lets only Microsoft-signed files run. Mark user as compromised uses AccountObjectId to set the user's risk level to high in Microsoft Entra ID. Quarantine file uses a SHA1 or SHA256 column to delete the file and keep a copy in quarantine.
    fr: Isolate device déconnecte l'appareil du réseau. Restrict app execution ne laisse s'exécuter que les fichiers signés par Microsoft. Mark user as compromised utilise AccountObjectId pour définir à élevé le niveau de risque de l'utilisateur dans Microsoft Entra ID. Quarantine file utilise une colonne SHA1 ou SHA256 pour supprimer le fichier et en conserver une copie en quarantaine.
  options:
    package: { en: "Collect investigation package gathers forensic data from the device; it does not contain or remediate anything.", fr: "Collect investigation package recueille des données forensiques sur l'appareil ; il ne confine ni ne corrige rien." }
    scan: { en: "Run antivirus scan starts a scan; it does not restrict execution or isolate the device.", fr: "Run antivirus scan lance une analyse ; il ne restreint pas l'exécution et n'isole pas l'appareil." }
references:
  - title: Create custom detection rules in Microsoft Defender XDR
    url: https://learn.microsoft.com/en-us/defender-xdr/custom-detection-rules
