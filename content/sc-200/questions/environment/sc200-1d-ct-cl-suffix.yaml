id: sc200-1d-ct-cl-suffix
objective: "1.3.7"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Fabrikam has a Microsoft Sentinel workspace named **LAW1**. An HR application must send access records to a new DCR-based custom table.

    You plan to create the table by using the Azure CLI instead of the Azure portal. The table must be identified as **HrAccess** in the HR team's documentation.

    Which table name should you specify in the command?
  fr: |
    Fabrikam dispose d'un espace de travail Microsoft Sentinel nommé **LAW1**. Une application RH doit envoyer des enregistrements d'accès dans une nouvelle table personnalisée basée sur une DCR.

    Vous prévoyez de créer la table avec Azure CLI plutôt qu'avec le portail Azure. La table doit être identifiée comme **HrAccess** dans la documentation de l'équipe RH.

    Quel nom de table devez-vous indiquer dans la commande ?
body:
  options:
    - { id: a, text: HrAccess }
    - { id: b, text: HrAccess_CF }
    - { id: c, text: Custom-HrAccess_CL }
    - { id: d, text: HrAccess_CL }
answer: { optionId: d }
explanation:
  correct:
    en: The name of a custom table must end with the _CL suffix. The Azure portal adds the suffix for you, but with the CLI, PowerShell or the REST API you must include it yourself. The stream declared in the DCR data flow must then match HrAccess_CL exactly.
    fr: Le nom d'une table personnalisée doit se terminer par le suffixe _CL. Le portail Azure ajoute le suffixe pour vous, mais avec Azure CLI, PowerShell ou l'API REST, vous devez l'inclure vous-même. Le flux déclaré dans le flux de données de la DCR doit ensuite correspondre exactement à HrAccess_CL.
  options:
    a: { en: "Only the portal adds the _CL suffix automatically; with other methods the name must include it.", fr: "Seul le portail ajoute automatiquement le suffixe _CL ; avec les autres méthodes, le nom doit l'inclure." }
    b: { en: "_CF is the suffix of custom columns added to Azure tables, not of custom tables.", fr: "_CF est le suffixe des colonnes personnalisées ajoutées aux tables Azure, pas celui des tables personnalisées." }
    c: { en: "Custom-HrAccess_CL is the form of the stream name used in the DCR and in the ingestion URI, not the table name.", fr: "Custom-HrAccess_CL est la forme du nom de flux utilisée dans la DCR et dans l'URI d'ingestion, pas le nom de la table." }
references:
  - title: Add or delete tables and columns in Azure Monitor Logs
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/logs/create-custom-table
