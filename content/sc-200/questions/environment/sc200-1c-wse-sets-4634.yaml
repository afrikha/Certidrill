id: sc200-1c-wse-sets-4634
objective: "1.3.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove Bank collects the Security log of its servers by using the Windows Security Events via AMA connector. A new detection must correlate failed sign-ins (event ID 4625) with sign-outs (event ID 4634).

    You need to configure the data collection rule so that both event IDs are collected.

    Which two event set configurations meet the requirement? Each correct answer presents a complete solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove Bank collecte le journal Sécurité de ses serveurs avec le connecteur Windows Security Events via AMA. Une nouvelle détection doit corréler les échecs de connexion (ID d'événement 4625) avec les déconnexions (ID d'événement 4634).

    Vous devez configurer la règle de collecte de données pour que les deux ID d'événement soient collectés.

    Quelles sont les deux configurations de jeu d'événements qui répondent à l'exigence ? Chaque bonne réponse constitue une solution complète.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: "Custom: Security!*[System[(EventID=4624 or EventID=4625)]]" }
    - { id: b, text: Common }
    - { id: c, text: Minimal }
    - { id: d, text: All Security Events }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: All Security Events collects the full Security log, and Common keeps a full user audit trail that includes both 4625 and the sign-out event 4634.
    fr: All Security Events collecte l'intégralité du journal Sécurité, et Common conserve une piste d'audit utilisateur complète qui inclut à la fois 4625 et l'événement de déconnexion 4634.
  options:
    c:
      en: Minimal contains 4624 and 4625 but deliberately leaves out 4634, which is high volume and not meaningful for breach detection.
      fr: Minimal contient 4624 et 4625, mais exclut volontairement 4634, volumineux et peu utile à la détection d'intrusion.
    a:
      en: This XPath query selects 4624 and 4625 only, not 4634.
      fr: Cette requête XPath ne sélectionne que 4624 et 4625, pas 4634.
references:
  - title: Windows security event sets that can be sent to Microsoft Sentinel
    url: https://learn.microsoft.com/en-us/azure/sentinel/windows-security-event-id-reference
