id: sc200-1a-cdc-targeting
objective: "1.1.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam, Inc. uses Microsoft Defender for Endpoint Plan 2 and a Microsoft Sentinel workspace connected to the Microsoft Defender portal. Eight Windows 11 pilot devices have a manual device tag named **Pilot** and are also members of a device group named **PilotGroup**.

    You are creating a custom data collection rule. It must collect events only from the pilot devices, and the targeting must update automatically when devices join the pilot.

    What should you do?
  fr: |
    Fabrikam, Inc. utilise Microsoft Defender pour point de terminaison Plan 2 et un espace de travail Microsoft Sentinel connecté au portail Microsoft Defender. Huit appareils pilotes Windows 11 portent une étiquette d'appareil manuelle nommée **Pilot** et sont aussi membres d'un groupe d'appareils nommé **PilotGroup**.

    Vous créez une règle de collecte de données personnalisée. Elle ne doit collecter des événements que sur les appareils pilotes, et le ciblage doit se mettre à jour automatiquement quand des appareils rejoignent le pilote.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Select the Pilot manual tag on the Define rule scope page of the rule.", fr: "Sélectionner l'étiquette manuelle Pilot sur la page Define rule scope de la règle." }
    - id: b
      text: { en: "Select the PilotGroup device group on the Define rule scope page of the rule.", fr: "Sélectionner le groupe d'appareils PilotGroup sur la page Define rule scope de la règle." }
    - id: c
      text: { en: "Create a dynamic tag in Asset rule management and select it in the rule scope.", fr: "Créer une étiquette dynamique dans Asset rule management et la sélectionner dans l'étendue de la règle." }
    - id: d
      text: { en: "Create a data collection rule in Azure Monitor that targets the pilot devices.", fr: "Créer une règle de collecte de données dans Azure Monitor qui cible les appareils pilotes." }
answer: { optionId: c }
explanation:
  correct:
    en: A custom data collection rule targets either all applicable client devices or the devices that have **dynamic tags**. Dynamic tags are created in Asset rule management, must have run at least once, and update automatically as device properties change. Manual tags aren't supported.
    fr: Une règle de collecte de données personnalisée cible soit tous les appareils clients applicables, soit les appareils qui portent des **étiquettes dynamiques**. Les étiquettes dynamiques se créent dans Asset rule management, doivent s'être exécutées au moins une fois et se mettent à jour automatiquement quand les propriétés des appareils changent. Les étiquettes manuelles ne sont pas prises en charge.
  options:
    a:
      en: Manual (static) tags aren't supported for custom data collection targeting.
      fr: Les étiquettes manuelles (statiques) ne sont pas prises en charge pour le ciblage de la collecte de données personnalisée.
    b:
      en: The rule scope offers all applicable devices or dynamic tags, not device groups.
      fr: L'étendue de la règle propose tous les appareils applicables ou des étiquettes dynamiques, pas des groupes d'appareils.
    d:
      en: Azure Monitor data collection rules apply to the Azure Monitor Agent; custom data collection is configured in the Defender portal and uses the Defender for Endpoint sensor.
      fr: Les règles de collecte de données d'Azure Monitor s'appliquent à l'agent Azure Monitor ; la collecte de données personnalisée se configure dans le portail Defender et utilise le capteur de Defender pour point de terminaison.
references:
  - title: Create and manage custom data collection rules in Microsoft Defender for Endpoint
    url: https://learn.microsoft.com/en-us/defender-endpoint/create-custom-data-collection-rules
