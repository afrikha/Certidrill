id: sc200-1b-ad-contain-user-sensor
objective: "1.1.8"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam, Inc. uses Microsoft Defender XDR. The following Windows 11 devices are onboarded to Microsoft Defender for Endpoint and belong to a device group whose automation level is **Full - remediate threats automatically**.

    | Device | Microsoft Defender Antivirus mode | Sense client version |
    | --- | --- | --- |
    | WS1 | Active | 10.8760 |
    | WS2 | Passive | 10.8760 |
    | WS3 | Active | 10.8295 |

    During a human-operated ransomware incident, automatic attack disruption applied the **Contain user** action to a compromised account. The account's activity was blocked on WS1 and WS2, but not on WS3.

    You need to ensure that Contain user also applies to WS3 in future incidents.

    What should you do?
  fr: |
    Fabrikam, Inc. utilise Microsoft Defender XDR. Les appareils Windows 11 suivants sont intégrés à Microsoft Defender for Endpoint et appartiennent à un groupe d'appareils dont le niveau d'automatisation est **Full - remediate threats automatically**.

    | Appareil | Mode de l'Antivirus Microsoft Defender | Version du client Sense |
    | --- | --- | --- |
    | WS1 | Actif | 10.8760 |
    | WS2 | Passif | 10.8760 |
    | WS3 | Actif | 10.8295 |

    Pendant un incident de rançongiciel piloté par un humain, l'interruption automatique des attaques a appliqué l'action **Contain user** à un compte compromis. L'activité du compte a été bloquée sur WS1 et WS2, mais pas sur WS3.

    Vous devez vous assurer que Contain user s'applique aussi à WS3 lors des prochains incidents.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Update the Defender for Endpoint Sense client on WS3 to version 10.8470 or later.", fr: "Mettre à jour le client Sense de Defender for Endpoint sur WS3 vers la version 10.8470 ou ultérieure." } }
    - { id: b, text: { en: "Turn on EDR in block mode for WS3 in the advanced features of Defender for Endpoint.", fr: "Activer EDR en mode bloc pour WS3 dans les fonctionnalités avancées de Defender for Endpoint." } }
    - { id: c, text: { en: "Move WS3 to a new device group whose automation level is Semi - require approval for all folders.", fr: "Déplacer WS3 vers un nouveau groupe d'appareils dont le niveau d'automatisation est Semi - require approval for all folders." } }
    - { id: d, text: { en: "Change the device discovery mode of the tenant from Standard discovery to Basic discovery.", fr: "Faire passer le mode de découverte d'appareils du locataire de Standard discovery à Basic discovery." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      The Contain user action requires the Sense client version 10.8470 or later on the device. WS3 runs an older version, so it can't enforce the containment, while WS1 and WS2 meet the requirement. Attack disruption works whatever the Defender Antivirus state (active, passive or EDR in block mode), which is why WS2 was protected.
    fr: |
      L'action Contain user exige la version 10.8470 ou ultérieure du client Sense sur l'appareil. WS3 exécute une version plus ancienne et ne peut donc pas appliquer la contention, alors que WS1 et WS2 remplissent la condition. L'interruption des attaques fonctionne quel que soit l'état de l'Antivirus Defender (actif, passif ou EDR en mode bloc), ce qui explique que WS2 ait été protégé.
  options:
    b: { en: "Attack disruption doesn't depend on the antivirus state; WS3 already runs Defender Antivirus in active mode.", fr: "L'interruption des attaques ne dépend pas de l'état de l'antivirus ; WS3 exécute déjà l'Antivirus Defender en mode actif." }
    c: { en: "WS3 is already in a group with full automation; a semi-automation level would not fix the sensor version and adds approvals for AIR remediation.", fr: "WS3 est déjà dans un groupe en automatisation complète ; un niveau semi-automatique ne corrigerait pas la version du capteur et ajouterait des approbations aux corrections AIR." }
    d: { en: "Standard discovery is the mode required by the Contain device action; switching to Basic discovery would reduce disruption capabilities.", fr: "Standard discovery est le mode exigé par l'action Contain device ; passer à Basic discovery réduirait les capacités d'interruption." }
references:
  - title: Configure automatic attack disruption in Microsoft Defender XDR
    url: https://learn.microsoft.com/en-us/defender-xdr/configure-attack-disruption
