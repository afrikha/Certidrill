id: sc200-1d-cd-continuous-queries
objective: "1.4.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Litware uses Microsoft Defender XDR and has onboarded a Microsoft Sentinel workspace to the Microsoft Defender portal. You plan to create custom detection rules that use the **Continuous (NRT)** frequency.

    Each of the following queries returns the columns required by custom detections.

    Which two queries can you use with the Continuous (NRT) frequency?

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware utilise Microsoft Defender XDR et a intégré un espace de travail Microsoft Sentinel au portail Microsoft Defender. Vous prévoyez de créer des règles de détection personnalisées qui utilisent la fréquence **Continuous (NRT)**.

    Chacune des requêtes suivantes renvoie les colonnes requises par les détections personnalisées.

    Quelles sont les deux requêtes que vous pouvez utiliser avec la fréquence Continuous (NRT) ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: '`DeviceTvmSoftwareVulnerabilities | where VulnerabilitySeverityLevel == "Critical" | project DeviceId, CveId`' }
    - { id: b, text: '`IdentityLogonEvents | join kind=inner IdentityInfo on AccountObjectId | project Timestamp, ReportId, AccountUpn`' }
    - { id: c, text: '`DeviceProcessEvents | union DeviceFileEvents | where FileName == "rclone.exe" | project Timestamp, DeviceId, ReportId`' }
    - { id: d, text: '`SigninLogs | where ResultType == "50053" | project TimeGenerated, UserPrincipalName, IPAddress`' }
    - { id: e, text: '`DeviceRegistryEvents | where RegistryValueName == "Updater" | project Timestamp, DeviceId, ReportId, RegistryKey`' }
    - { id: f, text: '`EmailEvents | where ThreatTypes has "Phish" // phishing only | project Timestamp, ReportId`' }
answer: { optionIds: [ d, e ] }
explanation:
  correct:
    en: A Continuous (NRT) rule must query a single supported table with supported operators, without joins, unions, externaldata or comments. DeviceRegistryEvents (Defender XDR) and SigninLogs (Microsoft Sentinel) are both in the list of tables that support the Continuous frequency, and the two queries use only where and project.
    fr: Une règle Continuous (NRT) doit interroger une seule table prise en charge avec des opérateurs pris en charge, sans jointure, union, externaldata ni commentaire. DeviceRegistryEvents (Defender XDR) et SigninLogs (Microsoft Sentinel) figurent tous deux dans la liste des tables qui prennent en charge la fréquence Continuous, et les deux requêtes n'utilisent que where et project.
  options:
    b: { en: "Joins are not supported by the Continuous (NRT) frequency.", fr: "Les jointures ne sont pas prises en charge par la fréquence Continuous (NRT)." }
    c: { en: "Unions are not supported, and the query references two tables.", fr: "Les unions ne sont pas prises en charge, et la requête référence deux tables." }
    a: { en: "DeviceTvmSoftwareVulnerabilities is not in the list of tables that support the Continuous (NRT) frequency.", fr: "DeviceTvmSoftwareVulnerabilities ne figure pas dans la liste des tables qui prennent en charge la fréquence Continuous (NRT)." }
    f: { en: "Queries with comment text cannot use the Continuous (NRT) frequency.", fr: "Les requêtes qui contiennent un commentaire ne peuvent pas utiliser la fréquence Continuous (NRT)." }
references:
  - title: Create custom detection rules in Microsoft Defender XDR
    url: https://learn.microsoft.com/en-us/defender-xdr/custom-detection-rules
