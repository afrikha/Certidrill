id: sc200-1d-mi-detection-count
objective: "1.4.4"
type: dropdown
difficulty: 3
status: draft
shuffle: false
stem:
  en: |
    Northwind has a Microsoft Sentinel workspace. The following items are mapped to the technique **T1110 Brute Force**.

    | Item | Type | Status |
    | --- | --- | --- |
    | Rule-A | Scheduled analytics rule | Enabled |
    | Rule-B | NRT analytics rule | Enabled |
    | Rule-C | Scheduled analytics rule | Disabled |
    | Template-D | Scheduled rule template, no rule created from it | Not applicable |
    | Hunt-E | Hunting query | Not applicable |

    How should you complete the following sentences? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind dispose d'un espace de travail Microsoft Sentinel. Les éléments suivants sont mappés à la technique **T1110 Brute Force**.

    | Élément | Type | État |
    | --- | --- | --- |
    | Rule-A | Règle d'analytique planifiée | Activée |
    | Rule-B | Règle d'analytique NRT | Activée |
    | Rule-C | Règle d'analytique planifiée | Désactivée |
    | Template-D | Modèle de règle planifiée, aucune règle créée à partir de lui | Sans objet |
    | Hunt-E | Requête de chasse | Sans objet |

    Comment devez-vous compléter les phrases suivantes ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      In the Current coverage view, T1110 shows [[count]] active detections.

      For Template-D to be counted in the Current coverage view, you must [[action]].
    fr: |
      Dans la vue Current coverage, T1110 affiche [[count]] détections actives.

      Pour que Template-D soit compté dans la vue Current coverage, vous devez [[action]].
  slots:
    - id: count
      options:
        - { id: c1, text: "1" }
        - { id: c2, text: "2" }
        - { id: c3, text: "3" }
        - { id: c5, text: "5" }
    - id: action
      options:
        - { id: create, text: { en: "create an enabled rule from Template-D", fr: "créer une règle activée à partir de Template-D" } }
        - { id: simulate, text: { en: "select Template-D in the Simulated rules menu", fr: "sélectionner Template-D dans le menu Simulated rules" } }
        - { id: hunt, text: { en: "run Hunt-E and bookmark its results", fr: "exécuter Hunt-E et créer un signet sur ses résultats" } }
answer:
  values: { count: c2, action: create }
explanation:
  correct:
    en: The Current coverage view counts only active scheduled and NRT rules, so Rule-A and Rule-B count, but not the disabled Rule-C, the template or the hunting query. A template counts only once an active rule is created from it; the Simulated rules menu shows potential coverage without changing the current count.
    fr: |
      La vue Current coverage ne compte que les règles planifiées et NRT actives : Rule-A et Rule-B comptent, mais pas Rule-C, désactivée, ni le modèle, ni la requête de chasse. Un modèle ne compte qu'une fois une règle active créée à partir de lui ; le menu Simulated rules affiche la couverture potentielle sans changer le compte actuel.
  options:
    c3: { en: "Rule-C is disabled, so it is not an active detection.", fr: "Rule-C est désactivée : ce n'est pas une détection active." }
    c5: { en: "Templates and hunting queries are not active detections.", fr: "Les modèles et les requêtes de chasse ne sont pas des détections actives." }
    simulate: { en: "Simulated rules shows what the coverage would be; it does not add the template to the current coverage.", fr: "Simulated rules montre ce que serait la couverture ; il n'ajoute pas le modèle à la couverture actuelle." }
    hunt: { en: "Bookmarks and hunting results are not detections and do not change the count.", fr: "Les signets et les résultats de chasse ne sont pas des détections et ne changent pas le compte." }
references:
  - title: View MITRE ATT&CK framework coverage in Microsoft Sentinel
    url: https://learn.microsoft.com/en-us/azure/sentinel/mitre-coverage
