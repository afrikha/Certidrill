id: sc200-1a-asr-intune-assign
objective: "1.1.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Tailspin Toys manages its Windows 11 devices with Microsoft Intune and Microsoft Defender for Endpoint. No Group Policy object configures ASR rules.

    You created an endpoint security **Attack surface reduction** policy in Intune and assigned it to a Microsoft Entra user group named **Finance-Users**. Two days later, the rules are not applied on the finance devices.

    What should you do?
  fr: |
    Tailspin Toys gère ses appareils Windows 11 avec Microsoft Intune et Microsoft Defender pour point de terminaison. Aucun objet de stratégie de groupe ne configure de règles ASR.

    Vous avez créé une stratégie de sécurité des points de terminaison **Attack surface reduction** dans Intune et l'avez attribuée à un groupe d'utilisateurs Microsoft Entra nommé **Finance-Users**. Deux jours plus tard, les règles ne sont pas appliquées sur les appareils finance.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Assign the policy to a Microsoft Entra device group that contains the finance devices.", fr: "Attribuer la stratégie à un groupe d'appareils Microsoft Entra qui contient les appareils finance." }
    - id: b
      text: { en: "Set the MDMWinsOverGP policy setting to 1 on the finance devices.", fr: "Définir le paramètre de stratégie MDMWinsOverGP à 1 sur les appareils finance." }
    - id: c
      text: { en: "Switch the rules in the policy from Audit mode to Block mode.", fr: "Passer les règles de la stratégie du mode Audit au mode Block." }
    - id: d
      text: { en: "Assign the Endpoint Security Manager Intune role to the Finance-Users group.", fr: "Attribuer le rôle Intune Endpoint Security Manager au groupe Finance-Users." }
answer: { optionId: a }
explanation:
  correct:
    en: Defender for Endpoint security management supports device objects only, so Intune ASR policies must be assigned to Microsoft Entra **device groups**, not user groups. Assigning the policy to a device group that contains the finance devices applies the rules.
    fr: "La gestion de la sécurité de Defender pour point de terminaison ne prend en charge que les objets appareil : les stratégies ASR d'Intune doivent être attribuées à des **groupes d'appareils** Microsoft Entra, pas à des groupes d'utilisateurs. Attribuer la stratégie à un groupe d'appareils qui contient les appareils finance applique les règles."
  options:
    b:
      en: MDMWinsOverGP resolves conflicts between Group Policy and MDM, and no Group Policy configures ASR rules here.
      fr: MDMWinsOverGP résout les conflits entre stratégie de groupe et MDM, et aucune stratégie de groupe ne configure de règles ASR ici.
    c:
      en: The mode doesn't matter if the policy never reaches the devices.
      fr: Le mode n'a pas d'importance si la stratégie n'atteint jamais les appareils.
    d:
      en: Endpoint Security Manager is an Intune administrative role that lets its members manage security policies; it doesn't change which devices receive the policy.
      fr: Endpoint Security Manager est un rôle d'administration Intune qui permet à ses membres de gérer les stratégies de sécurité ; il ne change pas les appareils qui reçoivent la stratégie.
references:
  - title: Configure ASR rules and exclusions
    url: https://learn.microsoft.com/en-us/defender-endpoint/enable-attack-surface-reduction
