id: sc200-cs2a-cef-syslog-dcr
objective: "1.3.4"
type: dropdown
caseStudy: sc200-cs2a-fourth-coffee
difficulty: 2
status: draft
stem:
  en: |
    You install the Azure Monitor Agent on LNX-FWD1 and enable the Common Event Format (CEF) via AMA and Syslog via AMA connectors in law-fc-soc. You create one data collection rule (DCR) for each connector.

    You need to configure the DCRs to meet the data collection requirements.

    How should you complete the configuration? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous installez l'agent Azure Monitor sur LNX-FWD1 et vous activez les connecteurs Common Event Format (CEF) via AMA et Syslog via AMA dans law-fc-soc. Vous créez une règle de collecte de données (DCR) pour chaque connecteur.

    Vous devez configurer les DCR pour répondre aux exigences de collecte des données.

    Comment devez-vous compléter la configuration ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      In the CEF via AMA DCR, collect [[cef]].
      In the Syslog via AMA DCR, collect [[sys]].
      The firewall events will be stored in the [[tbl]] table.
    fr: |
      Dans la DCR CEF via AMA, collecter [[cef]].
      Dans la DCR Syslog via AMA, collecter [[sys]].
      Les événements des pare-feu seront stockés dans la table [[tbl]].
  slots:
    - id: cef
      options:
        - { id: l4, text: { en: "the local4 facility only", fr: "uniquement la facility local4" } }
        - { id: l7, text: { en: "the local7 facility only", fr: "uniquement la facility local7" } }
        - { id: both, text: { en: "the local4 and local7 facilities", fr: "les facilities local4 et local7" } }
        - { id: all, text: { en: "all facilities", fr: "toutes les facilities" } }
    - id: sys
      options:
        - { id: s4, text: { en: "the local4 facility only", fr: "uniquement la facility local4" } }
        - { id: s7, text: { en: "the local7 facility only", fr: "uniquement la facility local7" } }
        - { id: sboth, text: { en: "the local4 and local7 facilities", fr: "les facilities local4 et local7" } }
        - { id: sall, text: { en: "all facilities", fr: "toutes les facilities" } }
    - id: tbl
      options:
        - { id: csl, text: CommonSecurityLog }
        - { id: syslog, text: Syslog }
        - { id: secev, text: SecurityEvent }
        - { id: winev, text: WindowsEvent }
answer:
  values: { cef: l4, sys: s7, tbl: csl }
explanation:
  correct:
    en: The firewalls send CEF on local4 and the badge system sends plain syslog on local7, so each DCR must collect only the facility of its own source. If the same facility is collected by both DCRs, the same message can be ingested twice, in CommonSecurityLog and in Syslog. CEF messages collected by the CEF via AMA connector are stored in the CommonSecurityLog table.
    fr: |
      Les pare-feu envoient du CEF sur local4 et le système de badges envoie du syslog standard sur local7 : chaque DCR doit donc collecter uniquement la facility de sa propre source. Si la même facility est collectée par les deux DCR, un même message peut être ingéré deux fois, dans CommonSecurityLog et dans Syslog. Les messages CEF collectés par le connecteur CEF via AMA sont stockés dans la table CommonSecurityLog.
  options:
    both: { en: "Collecting local7 in the CEF DCR adds a facility that carries no CEF messages and overlaps with the Syslog DCR.", fr: "Collecter local7 dans la DCR CEF ajoute une facility qui ne transporte aucun message CEF et chevauche la DCR Syslog." }
    sboth: { en: "Collecting local4 in the Syslog DCR duplicates the firewall events in the Syslog table.", fr: "Collecter local4 dans la DCR Syslog duplique les événements des pare-feu dans la table Syslog." }
    sall: { en: "All facilities include local4, so the firewall events would also be ingested in the Syslog table.", fr: "Toutes les facilities incluent local4 : les événements des pare-feu seraient aussi ingérés dans la table Syslog." }
    syslog: { en: "Syslog stores standard syslog messages such as those of BADGE1, not CEF messages parsed by the CEF via AMA connector.", fr: "Syslog stocke les messages syslog standard comme ceux de BADGE1, pas les messages CEF analysés par le connecteur CEF via AMA." }
    winev: { en: "WindowsEvent is used by the Windows Forwarded Events connector.", fr: "WindowsEvent est utilisée par le connecteur Windows Forwarded Events." }
references:
  - title: Syslog and Common Event Format (CEF) via AMA connectors for Microsoft Sentinel
    url: https://learn.microsoft.com/en-us/azure/sentinel/cef-syslog-ama-overview
  - title: Ingest syslog and CEF messages to Microsoft Sentinel with the Azure Monitor Agent
    url: https://learn.microsoft.com/en-us/azure/sentinel/connect-cef-syslog-ama
