id: sc200-1b-pb-trigger-types
objective: "1.1.11"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Wingtip Toys uses Microsoft Sentinel. You are creating four Consumption playbooks.

    Which Microsoft Sentinel trigger should each playbook use? To answer, drag the appropriate triggers to the correct playbooks. Each trigger may be used once, more than once, or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Wingtip Toys utilise Microsoft Sentinel. Vous créez quatre playbooks Consumption.

    Quel déclencheur Microsoft Sentinel chaque playbook doit-il utiliser ? Pour répondre, faites glisser les déclencheurs appropriés vers les playbooks correspondants. Chaque déclencheur peut être utilisé une fois, plusieurs fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: true
  items:
    - { id: incident, text: { en: "Incident trigger", fr: "Déclencheur d'incident" } }
    - { id: alert, text: { en: "Alert trigger", fr: "Déclencheur d'alerte" } }
    - { id: entity, text: { en: "Entity trigger", fr: "Déclencheur d'entité" } }
    - { id: recur, text: { en: "Recurrence trigger", fr: "Déclencheur de périodicité" } }
  targets:
    - id: t1
      text: { en: "pb-Notify: started by an automation rule that uses When incident is created, and reads all the alerts and entities of the incident", fr: "pb-Notify : lancé par une règle d'automatisation qui utilise When incident is created, et lit toutes les alertes et entités de l'incident" }
    - id: t2
      text: { en: "pb-AlertTicket: started by an automation rule that uses When alert is created for a scheduled analytics rule", fr: "pb-AlertTicket : lancé par une règle d'automatisation qui utilise When alert is created pour une règle d'analyse planifiée" }
    - id: t3
      text: { en: "pb-DisableUser: run by threat hunters on an account entity found during hunting, outside any incident", fr: "pb-DisableUser : exécuté par les chasseurs de menaces sur une entité de compte trouvée pendant le repérage, hors de tout incident" }
    - id: t4
      text: { en: "pb-Close: started by an automation rule that uses When incident is updated", fr: "pb-Close : lancé par une règle d'automatisation qui utilise When incident is updated" }
answer:
  mapping: { t1: incident, t2: alert, t3: entity, t4: incident }
explanation:
  correct:
    en: |
      Incident-trigger playbooks receive the incident with its alerts and entities and run only from incident-trigger automation rules (created or updated). Alert-trigger playbooks run only from alert-trigger automation rules. Entity-trigger playbooks run manually on an entity, for example during threat hunting.
    fr: |
      Les playbooks à déclencheur d'incident reçoivent l'incident avec ses alertes et ses entités et ne s'exécutent qu'à partir de règles d'automatisation à déclencheur d'incident (création ou mise à jour). Les playbooks à déclencheur d'alerte ne s'exécutent qu'à partir de règles d'automatisation à déclencheur d'alerte. Les playbooks à déclencheur d'entité s'exécutent manuellement sur une entité, par exemple pendant le repérage des menaces.
  options:
    recur: { en: "A Recurrence trigger runs on a schedule; automation rules list only playbooks that start with the matching Microsoft Sentinel trigger.", fr: "Un déclencheur de périodicité s'exécute selon une planification ; les règles d'automatisation ne listent que les playbooks qui commencent par le déclencheur Microsoft Sentinel correspondant." }
references:
  - title: Create and manage Microsoft Sentinel playbooks
    url: https://learn.microsoft.com/en-us/azure/sentinel/automation/create-playbooks
  - title: Automate threat response in Microsoft Sentinel with automation rules
    url: https://learn.microsoft.com/en-us/azure/sentinel/automate-incident-handling-with-automation-rules
