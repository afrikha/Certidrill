id: sc200-1c-act-owner-role
objective: "1.3.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso has an Azure subscription named **Sub-Prod** and a Microsoft Sentinel workspace named **law-contoso**. An engineer named Engineer1 has read and write permissions on law-contoso.

    Engineer1 must use **Launch Azure Policy Assignment wizard** on the Azure Key Vault connector page to apply a log streaming policy to all the key vaults of Sub-Prod.

    Which role should Engineer1 have on Sub-Prod?
  fr: |
    Contoso dispose d'un abonnement Azure nommé **Sub-Prod** et d'un espace de travail Microsoft Sentinel nommé **law-contoso**. Un ingénieur nommé Engineer1 dispose d'autorisations de lecture et d'écriture sur law-contoso.

    Engineer1 doit utiliser **Launch Azure Policy Assignment wizard** dans la page du connecteur Azure Key Vault pour appliquer une stratégie d'envoi de journaux à tous les coffres de clés de Sub-Prod.

    Quel rôle Engineer1 doit-il avoir sur Sub-Prod ?
body:
  options:
    - { id: a, text: Microsoft Sentinel Contributor }
    - { id: b, text: Monitoring Contributor }
    - { id: c, text: Log Analytics Contributor }
    - { id: d, text: Owner }
answer: { optionId: d }
explanation:
  correct:
    en: Policy-managed diagnostic settings connectors require read and write permissions on the workspace and, to apply the log streaming policy, the Owner role at the policy assignment scope, here the subscription.
    fr: Les connecteurs basés sur les paramètres de diagnostic gérés par Azure Policy exigent des autorisations de lecture et d'écriture sur l'espace de travail et, pour appliquer la stratégie d'envoi de journaux, le rôle Owner sur l'étendue de l'attribution de stratégie, ici l'abonnement.
  options:
    a:
      en: Microsoft Sentinel Contributor manages Sentinel content in the workspace; it can't assign policies on the subscription.
      fr: Microsoft Sentinel Contributor gère le contenu Sentinel de l'espace de travail ; il ne peut pas attribuer de stratégies sur l'abonnement.
    b:
      en: Monitoring Contributor can create diagnostic settings, but it can't create the policy assignment.
      fr: Monitoring Contributor peut créer des paramètres de diagnostic, mais pas l'attribution de stratégie.
    c:
      en: Log Analytics Contributor manages workspaces; it can't create policy assignments.
      fr: Log Analytics Contributor gère les espaces de travail ; il ne peut pas créer d'attributions de stratégie.
references:
  - title: Connect Microsoft Sentinel to other Microsoft services by using diagnostic settings-based connections
    url: https://learn.microsoft.com/en-us/azure/sentinel/connect-services-diagnostic-setting-based
