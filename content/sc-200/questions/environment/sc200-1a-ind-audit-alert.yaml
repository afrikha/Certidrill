id: sc200-1a-ind-audit-alert
objective: "1.1.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Tailspin Toys uses Microsoft Defender for Endpoint Plan 2. A remote administration tool is suspected of misuse, but some teams still need it.

    You need to receive an alert with a **High** severity each time the tool runs on a device. The tool must keep running so that you can monitor its use.

    You create a file indicator for the tool's hash. Which action should you select?
  fr: |
    Tailspin Toys utilise Microsoft Defender pour point de terminaison Plan 2. Un outil d'administration à distance est soupçonné d'être détourné, mais certaines équipes en ont encore besoin.

    Vous devez recevoir une alerte de gravité **High** (élevée) chaque fois que l'outil s'exécute sur un appareil. L'outil doit continuer à s'exécuter pour que vous puissiez surveiller son utilisation.

    Vous créez un indicateur de fichier pour le hachage de l'outil. Quelle action devez-vous sélectionner ?
body:
  options:
    - { id: a, text: Allow }
    - { id: b, text: Audit }
    - { id: c, text: Warn }
    - { id: d, text: Block execution }
answer: { optionId: b }
explanation:
  correct:
    en: The **Audit** action lets the file run and triggers an alert each time it runs, with the severity you define in the indicator. It is the only action that meets both requirements.
    fr: L'action **Audit** laisse le fichier s'exécuter et déclenche une alerte à chaque exécution, avec la gravité que vous définissez dans l'indicateur. C'est la seule action qui répond aux deux exigences.
  options:
    a:
      en: Allow lets the file run but, by design, generates no alert.
      fr: Allow laisse le fichier s'exécuter mais, par conception, ne génère aucune alerte.
    c:
      en: Warn interrupts users with a bypassable warning and creates only informational alerts, so the custom severity is not used.
      fr: "Warn interrompt les utilisateurs avec un avertissement contournable et ne crée que des alertes informationnelles : la gravité personnalisée n'est pas utilisée."
    d:
      en: Block execution prevents the tool from running and creates only informational alerts.
      fr: Block execution empêche l'outil de s'exécuter et ne crée que des alertes informationnelles.
references:
  - title: Overview of indicators in Microsoft Defender for Endpoint
    url: https://learn.microsoft.com/en-us/defender-endpoint/indicators-overview
