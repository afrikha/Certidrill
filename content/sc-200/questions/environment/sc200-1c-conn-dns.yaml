id: sc200-1c-conn-dns
objective: "1.3.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Fabrikam has Windows Server 2022 DNS servers that run as Azure virtual machines. DNS analytical event logs are enabled on the servers.

    You need to ingest the DNS query activity of the servers into Microsoft Sentinel in a normalized table that the ASIM DNS content can use. Queries for Fabrikam's internal domain must be filtered out before they're ingested.

    Which data connector should you use?
  fr: |
    Fabrikam dispose de serveurs DNS Windows Server 2022 exécutés comme machines virtuelles Azure. Les journaux d'événements analytiques DNS sont activés sur les serveurs.

    Vous devez ingérer l'activité des requêtes DNS de ces serveurs dans Microsoft Sentinel, dans une table normalisée utilisable par le contenu DNS ASIM. Les requêtes portant sur le domaine interne de Fabrikam doivent être filtrées avant leur ingestion.

    Quel connecteur de données devez-vous utiliser ?
body:
  options:
    - { id: a, text: Windows Security Events via AMA }
    - { id: b, text: Windows DNS Events via AMA }
    - { id: c, text: Syslog via AMA }
    - { id: d, text: Windows Forwarded Events }
answer: { optionId: b }
explanation:
  correct:
    en: The Windows DNS Events via AMA connector, from the Windows Server DNS solution, streams the DNS analytical logs into the normalized `ASimDnsActivityLogs` table and supports filters on fields such as the queried domain. It needs the Azure Monitor Agent with its DNS extension on the servers.
    fr: Le connecteur Windows DNS Events via AMA, issu de la solution Windows Server DNS, envoie les journaux analytiques DNS dans la table normalisée `ASimDnsActivityLogs` et prend en charge des filtres sur des champs comme le domaine interrogé. Il nécessite l'agent Azure Monitor et son extension DNS sur les serveurs.
  options:
    a:
      en: This connector collects the Security and AppLocker logs, not DNS analytical logs.
      fr: Ce connecteur collecte les journaux Sécurité et AppLocker, pas les journaux analytiques DNS.
    c:
      en: Syslog via AMA collects Syslog messages from Linux machines and devices.
      fr: Syslog via AMA collecte les messages Syslog de machines et d'équipements Linux.
    d:
      en: Windows Forwarded Events collects the events of a Windows Event Collector into `WindowsEvent`, not normalized DNS activity.
      fr: Windows Forwarded Events collecte les événements d'un collecteur d'événements Windows dans `WindowsEvent`, pas une activité DNS normalisée.
references:
  - title: Stream and filter Windows DNS logs with the AMA connector
    url: https://learn.microsoft.com/en-us/azure/sentinel/connect-dns-ama
