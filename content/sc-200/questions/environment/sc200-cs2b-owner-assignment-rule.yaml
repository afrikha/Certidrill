id: sc200-cs2b-owner-assignment-rule
objective: "1.4.3"
type: single
caseStudy: sc200-cs2b-consolidated-messenger
difficulty: 1
status: draft
stem:
  en: |
    You write a KQL query on the AzureActivity table that returns the Owner role assignments created at a subscription scope.

    You need to create the analytics rule that meets the detection requirement.

    Which type of analytics rule should you create?
  fr: |
    Vous écrivez une requête KQL sur la table AzureActivity qui renvoie les attributions du rôle Owner créées à l'étendue d'un abonnement.

    Vous devez créer la règle d'analytique qui répond à l'exigence de détection.

    Quel type de règle d'analytique devez-vous créer ?
body:
  options:
    - { id: a, text: { en: "A scheduled rule that runs every 5 minutes with a 5-minute lookback", fr: "Une règle planifiée qui s'exécute toutes les 5 minutes avec une période de recherche de 5 minutes" } }
    - { id: b, text: { en: "A near-real-time (NRT) rule", fr: "Une règle quasi en temps réel (NRT)" } }
    - { id: c, text: { en: "An anomaly rule", fr: "Une règle d'anomalie" } }
    - { id: d, text: { en: "A threat intelligence rule", fr: "Une règle de renseignement sur les menaces" } }
answer: { optionId: b }
explanation:
  correct:
    en: NRT rules run once every minute on the events ingested during the previous minute, and they query on ingestion time, so an alert is raised about one minute after ingestion. Consolidated Messenger uses 12 NRT rules, below the limit of 50.
    fr: |
      Les règles NRT s'exécutent une fois par minute sur les événements ingérés pendant la minute précédente, et elles interrogent l'heure d'ingestion : une alerte est donc déclenchée environ une minute après l'ingestion. Consolidated Messenger utilise 12 règles NRT, sous la limite de 50.
  options:
    a: { en: "Five minutes is the shortest interval of a scheduled rule, and scheduled rules also apply a built-in five-minute delay, so they cannot alert within about one minute.", fr: "Cinq minutes est l'intervalle le plus court d'une règle planifiée, et les règles planifiées appliquent aussi un délai intégré de cinq minutes : elles ne peuvent pas alerter en une minute environ." }
    c: { en: "Anomaly rules use built-in machine learning templates; they do not run a custom KQL query.", fr: "Les règles d'anomalie utilisent des modèles intégrés d'apprentissage automatique ; elles n'exécutent pas de requête KQL personnalisée." }
    d: { en: "Threat intelligence rules match logs against threat indicators; they do not run a custom query on role assignments.", fr: "Les règles de renseignement sur les menaces comparent les journaux aux indicateurs de menace ; elles n'exécutent pas de requête personnalisée sur les attributions de rôles." }
references:
  - title: Quick threat detection with near-real-time (NRT) analytics rules in Microsoft Sentinel
    url: https://learn.microsoft.com/en-us/azure/sentinel/near-real-time-rules
