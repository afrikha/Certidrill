id: sc200-1a-cdc-steps
objective: "1.1.5"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    Proseware, Inc. uses Microsoft Defender for Endpoint Plan 2 and a Microsoft Sentinel workspace connected to the Microsoft Defender portal. A dynamic tag named **AdminWS** is already applied to the administrative workstations by Asset rule management.

    You open **Settings > Endpoints > Rules > Custom Data Collection** to collect all PowerShell script executions from these workstations.

    Which five actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Proseware, Inc. utilise Microsoft Defender pour point de terminaison Plan 2 et un espace de travail Microsoft Sentinel connecté au portail Microsoft Defender. Une étiquette dynamique nommée **AdminWS** est déjà appliquée aux postes d'administration par Asset rule management.

    Vous ouvrez **Paramètres > Points de terminaison > Règles > Custom Data Collection** pour collecter toutes les exécutions de scripts PowerShell de ces postes.

    Quelles sont les cinq actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 5
  actions:
    - { id: ws, text: { en: "Select the Sentinel workspace on the **Workspace scope** page.", fr: "Sélectionner l'espace de travail Sentinel sur la page **Workspace scope**." } }
    - { id: create, text: { en: "Select **Create rule** and enter a name and a description.", fr: "Sélectionner **Create rule** et saisir un nom et une description." } }
    - { id: table, text: { en: "Select the `DeviceCustomScriptEvents` table, the actions and the conditions.", fr: "Sélectionner la table `DeviceCustomScriptEvents`, les actions et les conditions." } }
    - { id: scope, text: { en: "On **Define rule scope**, select the AdminWS dynamic tag.", fr: "Sur **Define rule scope**, sélectionner l'étiquette dynamique AdminWS." } }
    - { id: submit, text: { en: "Review the rule and select **Submit**.", fr: "Vérifier la règle et sélectionner **Submit**." } }
    - { id: dcr, text: { en: "Create a data collection rule in Azure Monitor for the workstations.", fr: "Créer une règle de collecte de données dans Azure Monitor pour les postes." } }
    - { id: group, text: { en: "Select the device group of the workstations as the rule scope.", fr: "Sélectionner le groupe d'appareils des postes comme étendue de la règle." } }
answer:
  sequence: [ ws, create, table, scope, submit ]
explanation:
  correct:
    en: You first select the workspace on the Workspace scope page, then create the rule with its general information, choose the table, the actions and the conditions, define the scope with a dynamic tag, and submit. The rule then deploys to the targeted devices, typically within 20 minutes to 1 hour.
    fr: Vous sélectionnez d'abord l'espace de travail sur la page Workspace scope, puis créez la règle avec ses informations générales, choisissez la table, les actions et les conditions, définissez l'étendue avec une étiquette dynamique et soumettez la règle. La règle se déploie ensuite sur les appareils ciblés, généralement en 20 minutes à 1 heure.
  options:
    dcr: { en: "Custom data collection is configured in the Defender portal; Azure Monitor data collection rules are for the Azure Monitor Agent.", fr: "La collecte de données personnalisée se configure dans le portail Defender ; les règles de collecte de données d'Azure Monitor concernent l'agent Azure Monitor." }
    group: { en: "The rule scope supports all applicable devices or dynamic tags, not device groups.", fr: "L'étendue de la règle prend en charge tous les appareils applicables ou des étiquettes dynamiques, pas des groupes d'appareils." }
references:
  - title: Create and manage custom data collection rules in Microsoft Defender for Endpoint
    url: https://learn.microsoft.com/en-us/defender-endpoint/create-custom-data-collection-rules
