id: sc200-1c-ti-matching-rule
objective: "1.3.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Tailspin Toys ingests the logs of its firewalls into `CommonSecurityLog` by using the Common Event Format (CEF) via AMA connector. Tailspin doesn't have a premium Microsoft Defender Threat Intelligence license.

    You need Microsoft Sentinel to generate alerts and incidents when the firewall logs contain domains or IPv4 addresses that Microsoft threat intelligence identifies as malicious. The solution must minimize administrative effort and must not require writing queries.

    What should you do?
  fr: |
    Tailspin Toys ingère les journaux de ses pare-feu dans `CommonSecurityLog` avec le connecteur Common Event Format (CEF) via AMA. Tailspin ne dispose pas de licence Microsoft Defender Threat Intelligence premium.

    Microsoft Sentinel doit générer des alertes et des incidents lorsque les journaux des pare-feu contiennent des domaines ou des adresses IPv4 que le renseignement sur les menaces de Microsoft identifie comme malveillants. La solution doit réduire au minimum l'effort d'administration et ne doit pas exiger l'écriture de requêtes.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Create a rule from the Microsoft Defender Threat Intelligence Analytics template.", fr: "Créer une règle à partir du modèle Microsoft Defender Threat Intelligence Analytics." }
    - id: b
      text: { en: "Enable the standard Defender Threat Intelligence data connector only.", fr: "Activer uniquement le connecteur de données Defender Threat Intelligence standard." }
    - id: c
      text: { en: "Create a threat intelligence ingestion rule for the firewall indicators.", fr: "Créer une règle d'ingestion du renseignement sur les menaces pour les indicateurs des pare-feu." }
    - id: d
      text: { en: "Create a near-real-time rule that joins CommonSecurityLog with ThreatIntelIndicators.", fr: "Créer une règle quasi en temps réel qui joint CommonSecurityLog à ThreatIntelIndicators." }
answer: { optionId: a }
explanation:
  correct:
    en: Microsoft Defender Threat Intelligence Analytics is a built-in matching rule that compares Microsoft threat intelligence with supported logs, including the `RequestURL` and `DestinationIP` fields of `CommonSecurityLog`, and generates high-fidelity alerts and incidents. It doesn't require a premium license; you create it from the rule template and its details are read-only.
    fr: Microsoft Defender Threat Intelligence Analytics est une règle de correspondance intégrée qui compare le renseignement sur les menaces de Microsoft aux journaux pris en charge, y compris les champs `RequestURL` et `DestinationIP` de `CommonSecurityLog`, et génère des alertes et des incidents très fiables. Elle n'exige pas de licence premium ; vous la créez à partir du modèle de règle et ses détails sont en lecture seule.
  options:
    b:
      en: Ingesting indicators doesn't detect anything by itself; a rule must compare them with the logs.
      fr: Ingérer des indicateurs ne détecte rien en soi ; une règle doit les comparer aux journaux.
    c:
      en: Ingestion rules modify or filter indicators from connectors; they don't generate alerts.
      fr: Les règles d'ingestion modifient ou filtrent les indicateurs des connecteurs ; elles ne génèrent pas d'alertes.
    d:
      en: A custom rule requires writing and maintaining a query, which the requirement excludes.
      fr: Une règle personnalisée exige d'écrire et de maintenir une requête, ce que l'exigence exclut.
references:
  - title: Use matching analytics to detect threats
    url: https://learn.microsoft.com/en-us/azure/sentinel/use-matching-analytics-to-detect-threats
