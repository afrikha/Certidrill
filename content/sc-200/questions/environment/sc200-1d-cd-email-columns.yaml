id: sc200-1d-cd-email-columns
objective: "1.4.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso uses Microsoft Defender XDR, including Microsoft Defender for Office 365. You write an advanced hunting query on the **EmailEvents** table that finds delivered messages from a known malicious campaign.

    You plan to create a custom detection rule from the query. The rule must soft delete every matching message automatically by using the **Delete email** action.

    In addition to Timestamp and ReportId, which columns must the query results include?
  fr: |
    Contoso utilise Microsoft Defender XDR, y compris Microsoft Defender pour Office 365. Vous écrivez une requête de repérage avancé sur la table **EmailEvents** qui trouve les messages remis d'une campagne malveillante connue.

    Vous prévoyez de créer une règle de détection personnalisée à partir de la requête. La règle doit supprimer automatiquement (suppression réversible) chaque message correspondant avec l'action **Delete email**.

    En plus de Timestamp et ReportId, quelles colonnes les résultats de la requête doivent-ils inclure ?
body:
  options:
    - { id: a, text: "InternetMessageId and RecipientObjectId" }
    - { id: b, text: "SenderFromAddress and Subject" }
    - { id: c, text: "NetworkMessageId and RecipientEmailAddress" }
    - { id: d, text: "SenderMailFromAddress and EmailDirection" }
answer: { optionId: c }
explanation:
  correct:
    en: The email actions of a custom detection rule (move to a mailbox folder, soft or hard delete) need NetworkMessageId and RecipientEmailAddress in the query output, to identify the message and the mailbox that holds it.
    fr: Les actions sur les e-mails d'une règle de détection personnalisée (déplacement vers un dossier de boîte aux lettres, suppression réversible ou définitive) nécessitent NetworkMessageId et RecipientEmailAddress dans le résultat de la requête, pour identifier le message et la boîte aux lettres qui le contient.
  options:
    a: { en: "The email actions use NetworkMessageId, not InternetMessageId, and the recipient address, not its object ID.", fr: "Les actions sur les e-mails utilisent NetworkMessageId, pas InternetMessageId, et l'adresse du destinataire, pas son ID d'objet." }
    b: { en: "The sender and the subject describe the message but do not identify the copy to delete in each mailbox.", fr: "L'expéditeur et l'objet décrivent le message mais n'identifient pas la copie à supprimer dans chaque boîte aux lettres." }
    d: { en: "These columns identify the sender and the direction, not the message and recipient mailbox that the action targets.", fr: "Ces colonnes identifient l'expéditeur et le sens du message, pas le message et la boîte aux lettres du destinataire visés par l'action." }
references:
  - title: Create custom detection rules in Microsoft Defender XDR
    url: https://learn.microsoft.com/en-us/defender-xdr/custom-detection-rules
