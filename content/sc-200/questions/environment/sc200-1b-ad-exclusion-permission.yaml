id: sc200-1b-ad-exclusion-permission
objective: "1.1.8"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Adatum Corporation uses Microsoft Defender XDR. Microsoft Defender XDR Unified role-based access control (RBAC) is enabled for the Microsoft Defender for Endpoint data source.

    A SOC engineer named Engineer1 must manage the device exclusions of automatic attack disruption. Engineer1 currently has no role.

    You need to grant Engineer1 the required access. The solution must follow the principle of least privilege.

    What should you assign to Engineer1?
  fr: |
    Adatum Corporation utilise Microsoft Defender XDR. Le contrôle d'accès en fonction du rôle (RBAC) unifié de Microsoft Defender XDR est activé pour la source de données Microsoft Defender for Endpoint.

    Un ingénieur SOC nommé Engineer1 doit gérer les exclusions d'appareils de l'interruption automatique des attaques. Engineer1 n'a actuellement aucun rôle.

    Vous devez accorder à Engineer1 l'accès nécessaire. La solution doit respecter le principe du moindre privilège.

    Que devez-vous attribuer à Engineer1 ?
body:
  options:
    - { id: a, text: { en: "The Security Administrator role in Microsoft Entra ID", fr: "Le rôle Security Administrator dans Microsoft Entra ID" } }
    - { id: b, text: { en: "A custom Unified RBAC role with the Core security settings (manage) permission", fr: "Un rôle RBAC unifié personnalisé avec l'autorisation Core security settings (manage)" } }
    - { id: c, text: { en: "The Security Reader role in Microsoft Entra ID", fr: "Le rôle Security Reader dans Microsoft Entra ID" } }
    - { id: d, text: { en: "A custom Unified RBAC role with the Detection tuning (manage) permission", fr: "Un rôle RBAC unifié personnalisé avec l'autorisation Detection tuning (manage)" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      When Unified RBAC is enabled for endpoints, device exclusions of attack disruption require the Security Operator role (or higher) or the Core security settings (manage) permission in a Unified RBAC role. A custom role that holds only this permission is the least privileged option.
    fr: |
      Lorsque le RBAC unifié est activé pour les points de terminaison, les exclusions d'appareils de l'interruption des attaques exigent le rôle Security Operator (ou supérieur) ou l'autorisation Core security settings (manage) dans un rôle RBAC unifié. Un rôle personnalisé qui ne contient que cette autorisation est l'option du moindre privilège.
  options:
    a: { en: "Security Administrator works, but it grants far more than the exclusion settings.", fr: "Security Administrator fonctionne, mais accorde bien plus que les paramètres d'exclusion." }
    c: { en: "Security Reader can only view exclusions; it can't add or remove them.", fr: "Security Reader peut seulement consulter les exclusions ; il ne peut ni en ajouter ni en supprimer." }
    d: { en: "Detection tuning (manage) covers custom detections, alert tuning and indicators, not attack disruption exclusions.", fr: "Detection tuning (manage) couvre les détections personnalisées, le paramétrage des alertes et les indicateurs, pas les exclusions de l'interruption des attaques." }
references:
  - title: Exclude assets from automated responses in automatic attack disruption
    url: https://learn.microsoft.com/en-us/defender-xdr/automatic-attack-disruption-exclusions
  - title: Microsoft Defender Unified RBAC Permissions
    url: https://learn.microsoft.com/en-us/defender-xdr/custom-permissions-details
