id: sc200-1b-rt-xdr-lake-year
objective: "1.2.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Litware, Inc. uses Microsoft Defender XDR and has onboarded Microsoft Sentinel to the Defender portal and to the Microsoft Sentinel data lake. The XDR tables use their default retention.

    A regulation requires Litware to keep **DeviceNetworkEvents** for one year. Threat hunters query it in advanced hunting only over the last 30 days. No analytics rule uses it, and investigators may query older data a few times a year.

    You need to configure DeviceNetworkEvents in the Defender portal. The solution must minimize cost.

    What should you configure?
  fr: |
    Litware, Inc. utilise Microsoft Defender XDR et a intégré Microsoft Sentinel au portail Defender et au data lake Microsoft Sentinel. Les tables XDR utilisent leur rétention par défaut.

    Une réglementation impose à Litware de conserver **DeviceNetworkEvents** pendant un an. Les chasseurs de menaces ne l'interrogent dans le repérage avancé que sur les 30 derniers jours. Aucune règle d'analyse ne l'utilise, et les enquêteurs peuvent interroger les données plus anciennes quelques fois par an.

    Vous devez configurer DeviceNetworkEvents dans le portail Defender. La solution doit réduire les coûts au minimum.

    Que devez-vous configurer ?
body:
  options:
    - { id: a, text: { en: "Analytics tier, analytics retention 1 year", fr: "Niveau Analytics, rétention Analytics d'un an" } }
    - { id: b, text: { en: "Data lake tier, retention 1 year", fr: "Niveau Data Lake, rétention d'un an" } }
    - { id: c, text: { en: "Analytics tier, analytics retention 90 days, total retention 1 year", fr: "Niveau Analytics, rétention Analytics de 90 jours, rétention totale d'un an" } }
    - { id: d, text: { en: "Keep the default settings, because XDR tables are retained for one year in advanced hunting", fr: "Conserver les paramètres par défaut, car les tables XDR sont conservées un an dans le repérage avancé" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Choosing the Data lake tier ingests the supported XDR table directly into the lake for the whole retention period, while the data stays available in advanced hunting for 30 days at no extra cost. Nothing needs analytics-tier data beyond 30 days, so ingesting the table into the analytics tier would only add cost.
    fr: |
      Choisir le niveau Data Lake ingère directement la table XDR prise en charge dans le lac pour toute la période de rétention, tandis que les données restent disponibles dans le repérage avancé pendant 30 jours sans coût supplémentaire. Rien n'a besoin de données au niveau Analytics au-delà de 30 jours : ingérer la table au niveau Analytics ne ferait qu'ajouter des coûts.
  options:
    a: { en: "Analytics retention above 30 days ingests the table into the workspace, with analytics ingestion charges and paid storage beyond 90 days.", fr: "Une rétention Analytics supérieure à 30 jours ingère la table dans l'espace de travail, avec des frais d'ingestion Analytics et un stockage payant au-delà de 90 jours." }
    c: { en: "This also ingests the table into the analytics tier and bills analytics ingestion that no one needs.", fr: "Cela ingère aussi la table au niveau Analytics et facture une ingestion Analytics dont personne n'a besoin." }
    d: { en: "XDR tables keep 30 days by default in advanced hunting.", fr: "Les tables XDR conservent 30 jours par défaut dans le repérage avancé." }
references:
  - title: Manage data tiers and retention in Microsoft Sentinel
    url: https://learn.microsoft.com/en-us/azure/sentinel/manage-data-overview
