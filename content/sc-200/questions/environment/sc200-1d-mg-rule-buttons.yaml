id: sc200-1d-mg-rule-buttons
objective: "1.4.2"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Proseware uses Microsoft Defender XDR. You manage custom detection rules from **Hunting** > **Custom detection rules**.

    Which option should you select on the rule details page for each task? To answer, drag the appropriate options to the correct tasks. Each option may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware utilise Microsoft Defender XDR. Vous gérez les règles de détection personnalisées depuis **Repérage** > **Règles de détection personnalisées**.

    Quelle option devez-vous sélectionner sur la page de détails de la règle pour chaque tâche ? Pour répondre, faites glisser les options appropriées vers les tâches correspondantes. Chaque option peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: run, text: Run }
    - { id: edit, text: Edit }
    - { id: modify, text: Modify query }
    - { id: off, text: Turn off }
    - { id: delete, text: Delete }
  targets:
    - id: t1
      text: { en: "Open the rule query in Advanced hunting to test a change", fr: "Ouvrir la requête de la règle dans le repérage avancé pour tester une modification" }
    - id: t2
      text: { en: "Stop a rule during a maintenance period and resume it later unchanged", fr: "Arrêter une règle pendant une période de maintenance et la reprendre ensuite sans changement" }
    - id: t3
      text: { en: "Remove an obsolete rule permanently", fr: "Supprimer définitivement une règle obsolète" }
    - id: t4
      text: { en: "Change the alert severity and the response actions of a rule", fr: "Changer la gravité des alertes et les actions de réponse d'une règle" }
answer:
  mapping: { t1: modify, t2: off, t3: delete, t4: edit }
explanation:
  correct:
    en: Modify query opens the query directly in Advanced hunting. Turn off stops the rule from running, and Turn on resumes it with the same settings. Delete turns off the rule and removes it permanently. Edit opens the rule wizard, where you change the alert details (such as severity) and the actions.
    fr: Modify query ouvre directement la requête dans le repérage avancé. Turn off empêche la règle de s'exécuter, et Turn on la reprend avec les mêmes paramètres. Delete désactive la règle et la supprime définitivement. Edit ouvre l'assistant de la règle, où vous modifiez les détails de l'alerte (comme la gravité) et les actions.
  options:
    run: { en: "Run executes the rule immediately and resets its interval; it does not change or stop the rule.", fr: "Run exécute immédiatement la règle et réinitialise son intervalle ; il ne modifie ni n'arrête la règle." }
references:
  - title: Manage existing custom detection rules
    url: https://learn.microsoft.com/en-us/defender-xdr/custom-detection-manage
