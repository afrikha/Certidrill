id: sc200-1b-dg-user-access
objective: "1.1.9"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Litware, Inc. uses Microsoft Defender for Endpoint with Defender for Endpoint roles. The Microsoft Entra group **SG-Tier1** has a role that is linked to the device group **DG-Workstations**.

    Yesterday, an administrator created a device group named **DG-Executives** for the executives' laptops and left the **User access** page of the wizard empty. The Microsoft Entra group **SG-ExecSupport** already has a role.

    Tier-1 analysts now report that they can see the executives' laptops. Only members of SG-ExecSupport must see these laptops.

    What should you do?
  fr: |
    Litware, Inc. utilise Microsoft Defender for Endpoint avec les rôles de Defender for Endpoint. Le groupe Microsoft Entra **SG-Tier1** possède un rôle lié au groupe d'appareils **DG-Workstations**.

    Hier, un administrateur a créé un groupe d'appareils nommé **DG-Executives** pour les ordinateurs portables des dirigeants et a laissé vide la page **User access** de l'assistant. Le groupe Microsoft Entra **SG-ExecSupport** possède déjà un rôle.

    Les analystes de niveau 1 signalent maintenant qu'ils voient les ordinateurs portables des dirigeants. Seuls les membres de SG-ExecSupport doivent voir ces ordinateurs portables.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Assign SG-ExecSupport on the User access page of DG-Executives.", fr: "Attribuer SG-ExecSupport dans la page User access de DG-Executives." } }
    - { id: b, text: { en: "Demote DG-Executives so that it is ranked below DG-Workstations.", fr: "Rétrograder DG-Executives pour qu'il soit classé sous DG-Workstations." } }
    - { id: c, text: { en: "Set the automation level of DG-Executives to No automated response.", fr: "Définir le niveau d'automatisation de DG-Executives sur No automated response." } }
    - { id: d, text: { en: "Remove the View data permission from the role of SG-Tier1.", fr: "Retirer l'autorisation View data du rôle de SG-Tier1." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      A device group with no Microsoft Entra group assigned is accessible to every user who has access to the portal. Assigning SG-ExecSupport, which already has a role, on the User access page restricts DG-Executives to that group. Changes can take several minutes to several hours to propagate.
    fr: |
      Un groupe d'appareils auquel aucun groupe Microsoft Entra n'est attribué est accessible à tous les utilisateurs qui ont accès au portail. Attribuer SG-ExecSupport, qui possède déjà un rôle, dans la page User access limite DG-Executives à ce groupe. Les modifications peuvent mettre de quelques minutes à plusieurs heures à se propager.
  options:
    b: { en: "Rank decides which group a device joins when it matches several groups; it doesn't control who can see the group.", fr: "Le rang décide du groupe que rejoint un appareil qui correspond à plusieurs groupes ; il ne contrôle pas qui peut voir le groupe." }
    c: { en: "The automation level controls remediation, not visibility, and lowers the protection of the executives' laptops.", fr: "Le niveau d'automatisation contrôle la correction, pas la visibilité, et réduit la protection des ordinateurs portables des dirigeants." }
    d: { en: "Without View data the tier-1 analysts would lose access to their own workstations' data too.", fr: "Sans View data, les analystes de niveau 1 perdraient aussi l'accès aux données de leurs propres postes de travail." }
references:
  - title: Create and manage device groups in Microsoft Defender for Endpoint
    url: https://learn.microsoft.com/en-us/defender-endpoint/machine-groups
