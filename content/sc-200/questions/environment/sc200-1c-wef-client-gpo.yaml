id: sc200-1c-wef-client-gpo
objective: "1.3.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Adatum has a Windows Event Collector named **WEC01** with a source-initiated subscription that collects events from the Security log. The devices are in the same Active Directory domain as WEC01.

    You create a Group Policy object (GPO) for the devices. The GPO must contain the minimum configuration required for the devices to forward their Security events to WEC01.

    Which three settings should the GPO configure? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum dispose d'un collecteur d'événements Windows nommé **WEC01** avec un abonnement initié par la source qui collecte les événements du journal Sécurité. Les appareils se trouvent dans le même domaine Active Directory que WEC01.

    Vous créez un objet de stratégie de groupe (GPO) pour les appareils. Le GPO doit contenir la configuration minimale nécessaire pour que les appareils transfèrent leurs événements de sécurité vers WEC01.

    Quels sont les trois paramètres que le GPO doit configurer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 3
  options:
    - { id: a, text: { en: "A Syslog target that points to UDP port 514 of WEC01", fr: "Une cible Syslog qui pointe vers le port UDP 514 de WEC01" } }
    - { id: b, text: { en: "Automatic startup of the Windows Remote Management (WinRM) service", fr: "Le démarrage automatique du service Gestion à distance de Windows (WinRM)" } }
    - { id: c, text: { en: "Membership of the Network Service account in the built-in Event Log Readers group", fr: "L'appartenance du compte Network Service au groupe intégré Event Log Readers" } }
    - { id: d, text: { en: "Deployment of the Azure Monitor Agent on each device", fr: "Le déploiement de l'agent Azure Monitor sur chaque appareil" } }
    - { id: e, text: { en: "Membership of the computer accounts in the Remote Management Users group of WEC01", fr: "L'appartenance des comptes d'ordinateur au groupe Remote Management Users de WEC01" } }
    - { id: f, text: { en: "The SubscriptionManager setting of Event Forwarding, with the address of WEC01", fr: "Le paramètre SubscriptionManager d'Event Forwarding, avec l'adresse de WEC01" } }
answer: { optionIds: [ b, c, f ] }
explanation:
  correct:
    en: The minimum client configuration is the collector URI (the SubscriptionManager setting of Event Forwarding), a running WinRM service, and the Network Service account in the Event Log Readers group. The last setting is needed because the forwarding client runs as Network Service and the Security channel is secured.
    fr: La configuration cliente minimale comprend l'URI du collecteur (le paramètre SubscriptionManager du transfert d'événements), un service WinRM démarré et le compte Network Service dans le groupe Event Log Readers. Ce dernier paramètre est nécessaire, car le client de transfert s'exécute sous Network Service et le canal Sécurité est protégé.
  options:
    d:
      en: Windows Event Forwarding uses the forwarding client built into Windows; only the collector needs the Azure Monitor Agent.
      fr: Le transfert d'événements Windows utilise le client de transfert intégré à Windows ; seul le collecteur a besoin de l'agent Azure Monitor.
    e:
      en: Domain sources authenticate to the collector with Kerberos; this group membership isn't part of the documented configuration.
      fr: Les sources du domaine s'authentifient auprès du collecteur avec Kerberos ; cette appartenance de groupe ne fait pas partie de la configuration documentée.
    a:
      en: Windows Event Forwarding uses WinRM, not Syslog on port 514.
      fr: Le transfert d'événements Windows utilise WinRM, pas Syslog sur le port 514.
references:
  - title: Use Windows Event Forwarding to help with intrusion detection
    url: https://learn.microsoft.com/en-us/windows/security/operating-system-security/device-management/use-windows-event-forwarding-to-assist-in-intrusion-detection
  - title: Setting Up a Source-Initiated Subscription
    url: https://learn.microsoft.com/en-us/windows/win32/wec/setting-up-a-source-initiated-subscription
