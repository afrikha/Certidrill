id: sc200-1a-ind-cert-action
objective: "1.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Contoso, Ltd. uses Microsoft Defender for Endpoint Plan 2. A code-signing certificate of a software vendor was stolen and is used to sign malware. You exported the certificate as a .cer file.

    You need to prevent every application signed with this certificate from running on the devices and remove the applications that are found.

    You create a certificate indicator. Which action should you select?
  fr: |
    Contoso, Ltd. utilise Microsoft Defender pour point de terminaison Plan 2. Un certificat de signature de code d'un éditeur de logiciels a été volé et sert à signer des programmes malveillants. Vous avez exporté le certificat dans un fichier .cer.

    Vous devez empêcher toute application signée avec ce certificat de s'exécuter sur les appareils et supprimer les applications trouvées.

    Vous créez un indicateur de certificat. Quelle action devez-vous sélectionner ?
body:
  options:
    - { id: a, text: Block execution }
    - { id: b, text: Warn }
    - { id: c, text: Audit }
    - { id: d, text: Block and remediate }
answer: { optionId: d }
explanation:
  correct:
    en: Certificate indicators (.cer or .pem) support only two actions, **Allow** and **Block and remediate**. Block and remediate prevents the signed applications from running and applies a remediation action to them.
    fr: Les indicateurs de certificat (.cer ou .pem) ne prennent en charge que deux actions, **Allow** et **Block and remediate**. Block and remediate empêche les applications signées de s'exécuter et leur applique une action de correction.
  options:
    a:
      en: Block execution exists for files, IP addresses, URLs and domains, but not for certificates, and it would not remediate the files.
      fr: Block execution existe pour les fichiers, les adresses IP, les URL et les domaines, mais pas pour les certificats, et il ne corrigerait pas les fichiers.
    b:
      en: Warn lets users bypass the block, and it isn't available for certificate indicators.
      fr: Warn permet aux utilisateurs de contourner le blocage, et il n'est pas disponible pour les indicateurs de certificat.
    c:
      en: Audit only raises an alert when the item runs, and it isn't available for certificate indicators.
      fr: Audit ne fait que générer une alerte quand l'élément s'exécute, et il n'est pas disponible pour les indicateurs de certificat.
references:
  - title: Overview of indicators in Microsoft Defender for Endpoint
    url: https://learn.microsoft.com/en-us/defender-endpoint/indicators-overview
