id: sc200-1b-wb-asim-timerange
objective: "1.2.3"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    Tailspin Toys uses Microsoft Sentinel and ingests authentication events from Microsoft Entra ID, Windows Security events and Linux Syslog. The ASIM parsers are available in the workspace.

    You are building a workbook that has a time range parameter named **TimeRange**. A query step must chart the failed authentications per hour and per target user, for all the authentication sources, and must follow the time range that the viewer selects. Microsoft's recommendations for workbook queries must be followed.

    How should you complete the query? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin Toys utilise Microsoft Sentinel et ingère des événements d'authentification de Microsoft Entra ID, des événements de sécurité Windows et du Syslog Linux. Les analyseurs ASIM sont disponibles dans l'espace de travail.

    Vous créez un classeur qui comporte un paramètre de plage de temps nommé **TimeRange**. Une étape de requête doit représenter les échecs d'authentification par heure et par utilisateur cible, pour toutes les sources d'authentification, et doit suivre la plage de temps choisie par l'utilisateur du classeur. Les recommandations de Microsoft pour les requêtes de classeur doivent être respectées.

    Comment devez-vous compléter la requête ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: kusto
  template: |
    [[src]]
    | where TimeGenerated [[tr]]
    | where EventResult == "Failure"
    | summarize Failures = count() by bin(TimeGenerated, 1h), TargetUsername
    | render [[viz]]
  slots:
    - id: src
      options:
        - { id: asim, text: ASimAuthentication }
        - { id: signin, text: SigninLogs }
        - { id: secevt, text: SecurityEvent }
        - { id: idlogon, text: IdentityLogonEvents }
    - id: tr
      options:
        - { id: param, text: "{TimeRange}" }
        - { id: gt, text: "> {TimeRange}" }
        - { id: ago, text: "> ago(TimeRange)" }
        - { id: eq, text: "== {TimeRange}" }
    - id: viz
      options:
        - { id: timechart, text: timechart }
        - { id: piechart, text: piechart }
        - { id: card, text: card }
answer:
  values: { src: asim, tr: param, viz: timechart }
explanation:
  correct:
    en: |
      Microsoft recommends querying ASIM parsers rather than built-in tables, so one workbook covers every current and future source of the same type; ASimAuthentication unifies all the authentication parsers and exposes normalized fields such as EventResult and TargetUsername. A time range parameter is used as TimeGenerated {TimeRange}, which expands to a filter such as > ago(1d). A time chart shows the hourly series.
    fr: |
      Microsoft recommande d'interroger les analyseurs ASIM plutôt que les tables intégrées, afin qu'un seul classeur couvre toutes les sources actuelles et futures du même type ; ASimAuthentication unifie tous les analyseurs d'authentification et expose des champs normalisés comme EventResult et TargetUsername. Un paramètre de plage de temps s'utilise sous la forme TimeGenerated {TimeRange}, qui se développe en un filtre comme > ago(1d). Un graphique temporel affiche la série horaire.
  options:
    signin: { en: "SigninLogs contains only Microsoft Entra sign-ins and doesn't use the ASIM field names.", fr: "SigninLogs ne contient que les connexions Microsoft Entra et n'utilise pas les noms de champs ASIM." }
    secevt: { en: "SecurityEvent covers Windows events only.", fr: "SecurityEvent ne couvre que les événements Windows." }
    idlogon: { en: "IdentityLogonEvents is a Defender XDR table that doesn't cover Linux Syslog.", fr: "IdentityLogonEvents est une table Defender XDR qui ne couvre pas le Syslog Linux." }
    gt: { en: "The parameter already expands to a comparison operator and value; adding > produces an invalid filter.", fr: "Le paramètre se développe déjà en un opérateur de comparaison et une valeur ; ajouter > produit un filtre invalide." }
    ago: { en: "Inside a query, the parameter is referenced with braces; TimeRange alone isn't a timespan.", fr: "Dans une requête, le paramètre se référence entre accolades ; TimeRange seul n'est pas une durée." }
    piechart: { en: "A pie chart can't show a series over time.", fr: "Un graphique en secteurs ne peut pas montrer une série dans le temps." }
references:
  - title: Visualize your data by using workbooks in Microsoft Sentinel
    url: https://learn.microsoft.com/en-us/azure/sentinel/monitor-your-data
  - title: Azure Monitor workbook time parameters
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/visualize/workbooks-time
