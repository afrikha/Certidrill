id: sc200-1b-rt-securityevent-audit
objective: "1.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso, Ltd. has a Microsoft Sentinel workspace onboarded to the Microsoft Defender portal. Scheduled analytics rules query the **SecurityEvent** table over the last 90 days.

    An audit requirement states that SecurityEvent data must be kept for seven years. Auditors query the older data a few times a year.

    You need to configure the SecurityEvent table. The solution must minimize cost.

    What should you configure?
  fr: |
    Contoso, Ltd. dispose d'un espace de travail Microsoft Sentinel intégré au portail Microsoft Defender. Des règles d'analyse planifiées interrogent la table **SecurityEvent** sur les 90 derniers jours.

    Une exigence d'audit impose de conserver les données de SecurityEvent pendant sept ans. Les auditeurs interrogent les données plus anciennes quelques fois par an.

    Vous devez configurer la table SecurityEvent. La solution doit réduire les coûts au minimum.

    Que devez-vous configurer ?
body:
  options:
    - { id: a, text: { en: "Analytics tier, analytics retention 2 years, total retention 7 years", fr: "Niveau Analytics, rétention Analytics de 2 ans, rétention totale de 7 ans" } }
    - { id: b, text: { en: "Data lake tier, retention 7 years", fr: "Niveau Data Lake, rétention de 7 ans" } }
    - { id: c, text: { en: "Analytics tier, analytics retention 90 days, total retention 7 years", fr: "Niveau Analytics, rétention Analytics de 90 jours, rétention totale de 7 ans" } }
    - { id: d, text: { en: "Analytics tier, analytics retention 90 days, total retention 90 days", fr: "Niveau Analytics, rétention Analytics de 90 jours, rétention totale de 90 jours" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      The analytics rules need 90 days of analytics-tier data, and analytics storage is free for 90 days in a Sentinel-enabled workspace. Total retention of seven years keeps the older data in the low-cost data lake, where the auditors can still query it.
    fr: |
      Les règles d'analyse ont besoin de 90 jours de données au niveau Analytics, et le stockage Analytics est gratuit pendant 90 jours dans un espace de travail où Sentinel est activé. Une rétention totale de sept ans conserve les données plus anciennes dans le data lake à bas coût, où les auditeurs peuvent toujours les interroger.
  options:
    a: { en: "Two years of analytics retention adds a paid analytics storage period that the rules don't need.", fr: "Deux ans de rétention Analytics ajoutent une période de stockage Analytics payante dont les règles n'ont pas besoin." }
    b: { en: "Data lake tables don't support analytics rules, so the scheduled rules would stop working.", fr: "Les tables Data Lake ne prennent pas en charge les règles d'analyse : les règles planifiées cesseraient de fonctionner." }
    d: { en: "The data would be deleted after 90 days, which fails the audit requirement.", fr: "Les données seraient supprimées après 90 jours, ce qui ne respecte pas l'exigence d'audit." }
references:
  - title: Manage data tiers and retention in Microsoft Sentinel
    url: https://learn.microsoft.com/en-us/azure/sentinel/manage-data-overview
