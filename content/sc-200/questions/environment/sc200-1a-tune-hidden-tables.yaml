id: sc200-1a-tune-hidden-tables
objective: "1.1.2"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    Adatum Corporation uses Microsoft Defender XDR and Microsoft Defender for Endpoint. An alert tuning rule uses the **Hide alert** action to suppress a benign alert triggered by a backup agent.

    Auditors ask you to list the hidden alerts and the entities involved during the last 30 days by using advanced hunting.

    Which two tables contain this data?

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum Corporation utilise Microsoft Defender XDR et Microsoft Defender pour point de terminaison. Une règle de réglage des alertes utilise l'action **Hide alert** pour supprimer une alerte bénigne déclenchée par un agent de sauvegarde.

    Les auditeurs vous demandent de lister les alertes masquées et les entités concernées au cours des 30 derniers jours avec le repérage avancé.

    Quelles sont les deux tables qui contiennent ces données ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: BehaviorInfo }
    - { id: b, text: AlertInfo }
    - { id: c, text: BehaviorEntities }
    - { id: d, text: AlertEvidence }
    - { id: e, text: SecurityIncident }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: Hide alert suppresses the alert and prevents incident creation, but hidden alerts remain in the `AlertInfo` table, and their entities remain in `AlertEvidence`. You can therefore query them in advanced hunting.
    fr: Hide alert supprime l'alerte et empêche la création d'incident, mais les alertes masquées restent dans la table `AlertInfo`, et leurs entités dans `AlertEvidence`. Vous pouvez donc les interroger avec le repérage avancé.
  options:
    a: { en: "BehaviorInfo receives the signals of rules that use Set as behavior, not hidden alerts.", fr: "BehaviorInfo reçoit les signaux des règles qui utilisent Set as behavior, pas les alertes masquées." }
    c: { en: "BehaviorEntities holds the entities of behaviors, not of hidden alerts.", fr: "BehaviorEntities contient les entités des comportements, pas celles des alertes masquées." }
    e: { en: "SecurityIncident stores incidents, and a hidden alert creates no incident.", fr: "SecurityIncident stocke des incidents, et une alerte masquée ne crée aucun incident." }
references:
  - title: Investigate alerts in Microsoft Defender XDR
    url: https://learn.microsoft.com/en-us/defender-xdr/investigate-alerts
