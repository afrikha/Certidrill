id: sc200-1b-ad-mdo-prereqs
objective: "1.1.8"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove Bank uses Microsoft Defender XDR with Microsoft Defender for Office 365 Plan 2. Woodgrove has a hybrid Exchange deployment: 400 mailboxes are hosted in Exchange Online and 150 mailboxes are hosted on on-premises Exchange servers. Mailbox auditing uses a custom configuration that records only the MailboxLogin action.

    You need to ensure that automatic attack disruption can detect and contain business email compromise (BEC) attacks against all the mailboxes.

    Which two actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove Bank utilise Microsoft Defender XDR avec Microsoft Defender for Office 365 Plan 2. Woodgrove a un déploiement Exchange hybride : 400 boîtes aux lettres sont hébergées dans Exchange Online et 150 boîtes aux lettres sur des serveurs Exchange locaux. L'audit des boîtes aux lettres utilise une configuration personnalisée qui n'enregistre que l'action MailboxLogin.

    Vous devez vous assurer que l'interruption automatique des attaques peut détecter et contenir les attaques par compromission de messagerie professionnelle (BEC) contre toutes les boîtes aux lettres.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Migrate the on-premises mailboxes to Exchange Online.", fr: "Migrer les boîtes aux lettres locales vers Exchange Online." } }
    - { id: b, text: { en: "Apply the Strict preset security policy to all the recipients.", fr: "Appliquer la stratégie de sécurité prédéfinie Strict à tous les destinataires." } }
    - { id: c, text: { en: "Configure a journal rule that sends a copy of every message to a dedicated mailbox.", fr: "Configurer une règle de journal qui envoie une copie de chaque message à une boîte aux lettres dédiée." } }
    - { id: d, text: { en: "Audit the MailItemsAccessed, UpdateInboxRules, MoveToDeletedItems, SoftDelete and HardDelete mailbox actions.", fr: "Auditer les actions de boîte aux lettres MailItemsAccessed, UpdateInboxRules, MoveToDeletedItems, SoftDelete et HardDelete." } }
    - { id: e, text: { en: "Turn on Safe Attachments with the Dynamic Delivery action.", fr: "Activer les pièces jointes fiables avec l'action Dynamic Delivery." } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: |
      For Defender for Office 365 signals, attack disruption requires the mailboxes to be hosted in Exchange Online and mailbox auditing to record at least MailItemsAccessed, UpdateInboxRules, MoveToDeletedItems, SoftDelete and HardDelete. Woodgrove must therefore move the 150 on-premises mailboxes and extend its custom audit configuration.
    fr: |
      Pour les signaux de Defender for Office 365, l'interruption des attaques exige que les boîtes aux lettres soient hébergées dans Exchange Online et que l'audit des boîtes aux lettres enregistre au minimum MailItemsAccessed, UpdateInboxRules, MoveToDeletedItems, SoftDelete et HardDelete. Woodgrove doit donc déplacer les 150 boîtes aux lettres locales et étendre sa configuration d'audit personnalisée.
  options:
    b: { en: "Preset security policies strengthen protection settings, but they aren't a prerequisite of attack disruption.", fr: "Les stratégies de sécurité prédéfinies renforcent les paramètres de protection, mais ne sont pas un prérequis de l'interruption des attaques." }
    c: { en: "Journaling copies messages for compliance; attack disruption relies on mailbox audit records, not on journals.", fr: "La journalisation copie les messages pour la conformité ; l'interruption des attaques s'appuie sur les enregistrements d'audit des boîtes aux lettres, pas sur des journaux." }
    e: { en: "Safe Attachments protects against malicious attachments; it isn't one of the attack disruption prerequisites.", fr: "Les pièces jointes fiables protègent contre les pièces jointes malveillantes ; elles ne font pas partie des prérequis de l'interruption des attaques." }
references:
  - title: Configure automatic attack disruption in Microsoft Defender XDR
    url: https://learn.microsoft.com/en-us/defender-xdr/configure-attack-disruption
