id: sc200-1c-soc-status
objective: "1.2.4"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    Fabrikam uses SOC optimization in the Microsoft Defender portal for its Microsoft Sentinel workspace named **law-fabrikam**. The SOC lead wants the team to manage the recommendations consistently.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam utilise l'optimisation SOC dans le portail Microsoft Defender pour son espace de travail Microsoft Sentinel nommé **law-fabrikam**. Le responsable du SOC souhaite que l'équipe gère les recommandations de façon cohérente.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: SOC optimization recalculates its recommendations every 24 hours.
        fr: L'optimisation SOC recalcule ses recommandations toutes les 24 heures.
    - id: s2
      text:
        en: If a table flagged by a data value recommendation starts being used by an analytics rule, the recommendation can move to Completed without any action from the team.
        fr: Si une table signalée par une recommandation de valeur des données commence à être utilisée par une règle d'analytique, la recommandation peut passer à l'état Completed sans aucune action de l'équipe.
    - id: s3
      text:
        en: When you dismiss a recommendation, it stays on the Overview tab with the Dismissed status.
        fr: Lorsque vous ignorez une recommandation, elle reste dans l'onglet Overview avec l'état Dismissed.
answer:
  values: { s1: true, s2: true, s3: false }
explanation:
  correct:
    en: Recommendations are calculated every 24 hours. When a change in the environment makes a recommendation irrelevant, for example a previously unused table is now used by an analytics rule, it's completed automatically and a banner on the Overview tab reports it. A dismissed recommendation is removed from the list and moved to the Dismissed tab, from which you can reactivate it.
    fr: Les recommandations sont calculées toutes les 24 heures. Lorsqu'une modification de l'environnement rend une recommandation sans objet, par exemple quand une table jusque-là inutilisée est désormais utilisée par une règle d'analytique, elle est terminée automatiquement et une bannière de l'onglet Overview le signale. Une recommandation ignorée est retirée de la liste et déplacée dans l'onglet Dismissed, d'où vous pouvez la réactiver.
references:
  - title: Optimize security operations
    url: https://learn.microsoft.com/en-us/azure/sentinel/soc-optimization/soc-optimization-access
