id: sc200-1b-pb-logicapp-roles
objective: "1.1.11"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    Northwind Traders uses Microsoft Sentinel. The resource group **RG-Playbooks** contains Consumption playbooks and a Standard logic app with several playbook workflows. Northwind has these requirements:

    - **Dev1** must create and edit the workflows of the Standard logic app.
    - **Ops1** must enable and disable the Consumption playbooks, without editing them.
    - **Analyst1**, who has Microsoft Sentinel Responder, must run playbooks manually on incidents.

    You need to assign a role on RG-Playbooks to each user. The solution must follow the principle of least privilege.

    Which role should you assign to each user? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind Traders utilise Microsoft Sentinel. Le groupe de ressources **RG-Playbooks** contient des playbooks Consumption et une application logique Standard avec plusieurs workflows de playbook. Northwind a les exigences suivantes :

    - **Dev1** doit créer et modifier les workflows de l'application logique Standard.
    - **Ops1** doit activer et désactiver les playbooks Consumption, sans les modifier.
    - **Analyst1**, qui a Microsoft Sentinel Responder, doit exécuter manuellement des playbooks sur des incidents.

    Vous devez attribuer un rôle sur RG-Playbooks à chaque utilisateur. La solution doit respecter le principe du moindre privilège.

    Quel rôle devez-vous attribuer à chaque utilisateur ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Dev1: [[dev]]

      Ops1: [[ops]]

      Analyst1: [[an]]
    fr: |
      Dev1 : [[dev]]

      Ops1 : [[ops]]

      Analyst1 : [[an]]
  slots:
    - id: dev
      options:
        - { id: stdop, text: Logic Apps Standard Operator }
        - { id: stddev, text: Logic Apps Standard Developer }
        - { id: stdcon, text: Logic Apps Standard Contributor }
        - { id: lacon, text: Logic App Contributor }
    - id: ops
      options:
        - { id: laop, text: Logic App Operator }
        - { id: lacon, text: Logic App Contributor }
        - { id: stdop, text: Logic Apps Standard Operator }
        - { id: pbop, text: Microsoft Sentinel Playbook Operator }
    - id: an
      options:
        - { id: pbop, text: Microsoft Sentinel Playbook Operator }
        - { id: autocon, text: Microsoft Sentinel Automation Contributor }
        - { id: sencon, text: Microsoft Sentinel Contributor }
        - { id: laop, text: Logic App Operator }
answer:
  values: { dev: stddev, ops: laop, an: pbop }
explanation:
  correct:
    en: |
      For Standard logic apps, Logic Apps Standard Developer creates and edits workflows, while Standard Contributor manages every aspect of the app. For Consumption logic apps, Logic App Operator reads, enables and disables them, and Logic App Contributor edits them. Microsoft Sentinel Playbook Operator lets a user list, view and manually run playbooks.
    fr: |
      Pour les applications logiques Standard, Logic Apps Standard Developer crée et modifie les workflows, tandis que Standard Contributor gère tous les aspects de l'application. Pour les applications logiques Consumption, Logic App Operator les lit, les active et les désactive, et Logic App Contributor les modifie. Microsoft Sentinel Playbook Operator permet de lister, de consulter et d'exécuter manuellement des playbooks.
  options:
    stdcon: { en: "Standard Contributor manages all aspects of the app, more than needed.", fr: "Standard Contributor gère tous les aspects de l'application, plus que nécessaire." }
    stdop: { en: "Logic Apps Standard Operator applies to Standard workflows and can't create or edit them.", fr: "Logic Apps Standard Operator s'applique aux workflows Standard et ne permet ni de les créer ni de les modifier." }
    lacon: { en: "Logic App Contributor is a Consumption role that also allows editing.", fr: "Logic App Contributor est un rôle Consumption qui permet aussi la modification." }
    autocon: { en: "Automation Contributor is meant for the Microsoft Sentinel service account, not for user accounts.", fr: "Automation Contributor est destiné au compte de service Microsoft Sentinel, pas aux comptes d'utilisateur." }
    sencon: { en: "Sentinel Contributor can attach playbooks to rules but doesn't run playbooks, and it grants far more.", fr: "Sentinel Contributor peut attacher des playbooks à des règles mais n'exécute pas de playbooks, et accorde bien plus." }
references:
  - title: Create and manage Microsoft Sentinel playbooks
    url: https://learn.microsoft.com/en-us/azure/sentinel/automation/create-playbooks
  - title: Roles and permissions in the Microsoft Sentinel platform
    url: https://learn.microsoft.com/en-us/azure/sentinel/roles
