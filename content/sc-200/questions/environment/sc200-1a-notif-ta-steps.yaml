id: sc200-1a-notif-ta-steps
objective: "1.1.1"
type: ordering
difficulty: 1
status: draft
stem:
  en: |
    Proseware, Inc. uses Microsoft Defender XDR. The CISO must receive an email each time a threat analytics report about an activity group is published or updated.

    In the Microsoft Defender portal, you open **Settings > Microsoft Defender XDR > Email notifications** and select the **Threat analytics** tab.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Proseware, Inc. utilise Microsoft Defender XDR. Le RSSI doit recevoir un e-mail chaque fois qu'un rapport de l'analytique des menaces sur un groupe d'activités est publié ou mis à jour.

    Dans le portail Microsoft Defender, vous ouvrez **Paramètres > Microsoft Defender XDR > Notifications par e-mail** et sélectionnez l'onglet **Threat analytics**.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: name, text: { en: "Select **Create a notification rule** and enter a name for the rule.", fr: "Sélectionner **Create a notification rule** et saisir un nom pour la règle." } }
    - { id: reports, text: { en: "Choose to receive only reports that have the Activity group tag.", fr: "Choisir de ne recevoir que les rapports portant l'étiquette Activity group." } }
    - { id: recip, text: { en: "Add the CISO as a recipient and send a test email.", fr: "Ajouter le RSSI comme destinataire et envoyer un e-mail de test." } }
    - { id: create, text: { en: "Review the settings and select **Create rule**.", fr: "Vérifier les paramètres et sélectionner **Create rule**." } }
    - { id: groups, text: { en: "Select the device groups that the rule applies to.", fr: "Sélectionner les groupes d'appareils auxquels la règle s'applique." } }
    - { id: sev, text: { en: "Select the alert severities that trigger a notification.", fr: "Sélectionner les gravités d'alerte qui déclenchent une notification." } }
answer:
  sequence: [ name, reports, recip, create ]
explanation:
  correct:
    en: The threat analytics notification wizard asks for a rule name (the description is optional), then which reports to include (all newly published or updated reports, or only reports of a given type or tag), then at least one recipient, with an optional test email. You finish by reviewing the rule and selecting Create rule.
    fr: L'assistant de notification de l'analytique des menaces demande un nom de règle (la description est facultative), puis les rapports à inclure (tous les rapports nouvellement publiés ou mis à jour, ou seulement ceux d'un type ou d'une étiquette donnés), puis au moins un destinataire, avec un e-mail de test facultatif. Vous terminez en vérifiant la règle et en sélectionnant Create rule.
  options:
    groups: { en: "Device group scope belongs to incident and action notification rules, not to threat analytics rules.", fr: "L'étendue des groupes d'appareils appartient aux règles de notification d'incident et d'action, pas aux règles de l'analytique des menaces." }
    sev: { en: "Alert severity is a setting of incident notification rules; threat analytics reports are not alerts.", fr: "La gravité des alertes est un paramètre des règles de notification d'incident ; les rapports de l'analytique des menaces ne sont pas des alertes." }
references:
  - title: Get email notifications for Threat analytics updates
    url: https://learn.microsoft.com/en-us/defender-xdr/m365d-threat-analytics-notifications
