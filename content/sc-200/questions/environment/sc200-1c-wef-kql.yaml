id: sc200-1c-wef-kql
objective: "1.3.3"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    Contoso forwards the Security events of its workstations to a Windows Event Collector named **WEC01**. The Windows Forwarded Events connector collects the forwarded events of WEC01 into the Microsoft Sentinel workspace **law-contoso**.

    You need a query that counts the failed sign-ins of the last day for each target user and computer.

    How should you complete the query? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso transfère les événements de sécurité de ses stations de travail vers un collecteur d'événements Windows nommé **WEC01**. Le connecteur Windows Forwarded Events collecte les événements transférés de WEC01 dans l'espace de travail Microsoft Sentinel **law-contoso**.

    Vous avez besoin d'une requête qui compte les échecs de connexion du dernier jour pour chaque utilisateur cible et chaque ordinateur.

    Comment devez-vous compléter la requête ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: kusto
  template: |
    [[table]]
    | where TimeGenerated > ago(1d)
    | where [[col]] == "Security" and EventID == 4625
    | extend TargetUserName = [[fn]](EventData.TargetUserName)
    | summarize Failures = count() by TargetUserName, Computer
  slots:
    - id: table
      options:
        - { id: winevent, text: WindowsEvent }
        - { id: secevent, text: SecurityEvent }
        - { id: event, text: Event }
        - { id: devevents, text: DeviceEvents }
    - id: col
      options:
        - { id: channel, text: Channel }
        - { id: category, text: Category }
        - { id: source, text: Source }
        - { id: provider, text: Provider }
    - id: fn
      options:
        - { id: tostring, text: tostring }
        - { id: todatetime, text: todatetime }
        - { id: toint, text: toint }
        - { id: bin, text: bin }
answer:
  values: { table: winevent, col: channel, fn: tostring }
explanation:
  correct:
    en: Events collected through Windows Event Forwarding, including events forwarded from the Security log, are written to `WindowsEvent`, not `SecurityEvent`. The `Channel` column holds the source log, and the event fields are in the dynamic `EventData` column, so `tostring()` converts the value to a string that `summarize` can group by.
    fr: "Les événements collectés par le transfert d'événements Windows, y compris ceux transférés depuis le journal Sécurité, sont écrits dans `WindowsEvent`, pas dans `SecurityEvent`. La colonne `Channel` contient le journal d'origine, et les champs de l'événement se trouvent dans la colonne dynamique `EventData` : `tostring()` convertit la valeur en chaîne que `summarize` peut utiliser pour regrouper."
  options:
    secevent: { en: "SecurityEvent receives the events of Windows Security Events via AMA, not forwarded events.", fr: "SecurityEvent reçoit les événements de Windows Security Events via AMA, pas les événements transférés." }
    event: { en: "Event receives the generic Windows Event Logs data source of Azure Monitor.", fr: "Event reçoit la source de données générique Windows Event Logs d'Azure Monitor." }
    devevents: { en: "DeviceEvents is a Defender for Endpoint advanced hunting table.", fr: "DeviceEvents est une table du repérage avancé de Defender pour point de terminaison." }
    provider: { en: "Provider holds the event provider name, such as Microsoft-Windows-Security-Auditing, not the log name.", fr: "Provider contient le nom du fournisseur d'événements, comme Microsoft-Windows-Security-Auditing, pas le nom du journal." }
    todatetime: { en: "A user name isn't a date.", fr: "Un nom d'utilisateur n'est pas une date." }
    toint: { en: "A user name isn't a number.", fr: "Un nom d'utilisateur n'est pas un nombre." }
references:
  - title: Connect Microsoft Sentinel to other Microsoft services with a Windows agent-based data connector
    url: https://learn.microsoft.com/en-us/azure/sentinel/connect-services-windows-based
