id: sc200-1a-notif-ransomware-reports
objective: "1.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Fabrikam, Inc. uses Microsoft Defender XDR. The threat intelligence team reads the threat analytics reports in the Microsoft Defender portal.

    The team must receive an email when a threat analytics report that has the **Ransomware** tag is published or updated. The team must receive as few other emails as possible.

    What should you configure?
  fr: |
    Fabrikam, Inc. utilise Microsoft Defender XDR. L'équipe de renseignement sur les menaces lit les rapports de l'analytique des menaces dans le portail Microsoft Defender.

    L'équipe doit recevoir un e-mail lorsqu'un rapport de l'analytique des menaces portant l'étiquette **Ransomware** est publié ou mis à jour. L'équipe doit recevoir le moins possible d'autres e-mails.

    Que devez-vous configurer ?
body:
  options:
    - id: a
      text: { en: "A Threat analytics notification rule that includes all newly published or updated reports", fr: "Une règle de notification Threat analytics qui inclut tous les rapports nouvellement publiés ou mis à jour" }
    - id: b
      text: { en: "An Incidents notification rule that includes all alert severities", fr: "Une règle de notification Incidents qui inclut toutes les gravités d'alerte" }
    - id: c
      text: { en: "A Threat analytics notification rule that includes only reports with the Ransomware tag", fr: "Une règle de notification Threat analytics qui inclut uniquement les rapports portant l'étiquette Ransomware" }
    - id: d
      text: { en: "An Actions notification rule that includes all automated response actions", fr: "Une règle de notification Actions qui inclut toutes les actions de réponse automatisées" }
answer: { optionId: c }
explanation:
  correct:
    en: A rule on the **Threat analytics** tab of the email notification settings can target all newly published or updated reports, or only reports of a given type or with a given tag. Selecting the Ransomware tag sends emails only for those reports, which keeps the number of emails to a minimum.
    fr: Une règle de l'onglet **Threat analytics** des paramètres de notification par e-mail peut cibler tous les rapports nouvellement publiés ou mis à jour, ou seulement les rapports d'un type donné ou portant une étiquette donnée. Sélectionner l'étiquette Ransomware n'envoie des e-mails que pour ces rapports, ce qui réduit au minimum le nombre d'e-mails.
  options:
    a:
      en: This rule also notifies the team about every other report, which does not minimize the number of emails.
      fr: Cette règle notifie aussi l'équipe de tous les autres rapports, ce qui ne réduit pas le nombre d'e-mails.
    b:
      en: Incident notifications are about new incidents in the tenant, not about threat analytics reports.
      fr: Les notifications d'incident portent sur les nouveaux incidents du locataire, pas sur les rapports de l'analytique des menaces.
    d:
      en: Action notifications are about manual or automated response actions, not about threat analytics reports.
      fr: Les notifications d'action portent sur les actions de réponse manuelles ou automatisées, pas sur les rapports de l'analytique des menaces.
references:
  - title: Get email notifications for Threat analytics updates
    url: https://learn.microsoft.com/en-us/defender-xdr/m365d-threat-analytics-notifications
  - title: Threat analytics in Microsoft Defender
    url: https://learn.microsoft.com/en-us/defender-xdr/threat-analytics
