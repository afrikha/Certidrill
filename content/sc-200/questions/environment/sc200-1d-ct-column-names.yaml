id: sc200-1d-ct-column-names
objective: "1.3.7"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Adatum has a Microsoft Sentinel workspace that contains a DCR-based custom table named **ToolAudit_CL**. You plan to add columns to the table by using the schema editor in the Azure portal.

    Which two column names can you use?

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum dispose d'un espace de travail Microsoft Sentinel qui contient une table personnalisée basée sur une DCR nommée **ToolAudit_CL**. Vous prévoyez d'ajouter des colonnes à la table avec l'éditeur de schéma du portail Azure.

    Quels sont les deux noms de colonnes que vous pouvez utiliser ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: RequestRegion }
    - { id: b, text: Ticket-Number }
    - { id: c, text: 2ndApprover }
    - { id: d, text: Approver_Id2 }
    - { id: e, text: TenantId }
    - { id: f, text: Société }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: A custom column name must be 2 to 45 characters long, start with a letter and then contain only letters, digits or underscores. RequestRegion and Approver_Id2 follow these rules and are not reserved names.
    fr: Le nom d'une colonne personnalisée doit comporter de 2 à 45 caractères, commencer par une lettre puis ne contenir que des lettres, des chiffres ou des traits de soulignement. RequestRegion et Approver_Id2 respectent ces règles et ne sont pas des noms réservés.
  options:
    b: { en: "Dashes and other punctuation are not allowed in column names.", fr: "Les tirets et les autres signes de ponctuation ne sont pas autorisés dans les noms de colonnes." }
    c: { en: "A column name must start with a letter, not a digit.", fr: "Un nom de colonne doit commencer par une lettre, pas par un chiffre." }
    e: { en: "TenantId is a reserved system column name.", fr: "TenantId est un nom de colonne système réservé." }
    f: { en: "Non-ASCII letters such as é are not allowed.", fr: "Les lettres non ASCII comme é ne sont pas autorisées." }
references:
  - title: Add or delete tables and columns in Azure Monitor Logs
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/logs/create-custom-table
