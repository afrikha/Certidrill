id: sc200-1b-ad-statements
objective: "1.1.8"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    Tailspin Toys uses Microsoft Defender XDR. Automatic attack disruption uses its default settings and no assets are excluded. Some devices run Microsoft Defender Antivirus in passive mode because a third-party antivirus is installed.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin Toys utilise Microsoft Defender XDR. L'interruption automatique des attaques utilise ses paramètres par défaut et aucune ressource n'est exclue. Certains appareils exécutent l'Antivirus Microsoft Defender en mode passif, car un antivirus tiers est installé.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          An incident in which attack disruption contained a device shows the Attack Disruption tag in the incident queue.
        fr: |
          Un incident dans lequel l'interruption des attaques a contenu un appareil affiche l'étiquette Attack Disruption dans la file d'attente des incidents.
    - id: s2
      text:
        en: |
          Attack disruption can contain a device only if Microsoft Defender Antivirus runs in active mode on that device.
        fr: |
          L'interruption des attaques ne peut contenir un appareil que si l'Antivirus Microsoft Defender s'exécute en mode actif sur cet appareil.
    - id: s3
      text:
        en: |
          An analyst can release a device contained by attack disruption from the incident page.
        fr: |
          Un analyste peut libérer depuis la page de l'incident un appareil contenu par l'interruption des attaques.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |
      Disrupted incidents carry the Attack Disruption tag in the incident queue, and the incident page shows a banner and the status of the contained assets. Attack disruption acts whatever the Defender Antivirus state (active, passive or EDR in block mode). Every action can be undone: on the incident page, select the contained device and release it from containment (or use the Action center).
    fr: |
      Les incidents interrompus portent l'étiquette Attack Disruption dans la file d'attente des incidents, et la page de l'incident affiche une bannière et l'état des ressources contenues. L'interruption des attaques agit quel que soit l'état de l'Antivirus Defender (actif, passif ou EDR en mode bloc). Chaque action peut être annulée : dans la page de l'incident, sélectionnez l'appareil contenu et libérez-le de la contention (ou utilisez le centre de notifications).
references:
  - title: Automatic attack disruption in Microsoft Defender
    url: https://learn.microsoft.com/en-us/defender-xdr/automatic-attack-disruption
  - title: Details and results of an automatic attack disruption action
    url: https://learn.microsoft.com/en-us/defender-xdr/autoad-results
