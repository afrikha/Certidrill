id: sc200-1b-pb-standard-private
objective: "1.1.11"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam, Inc. uses Microsoft Sentinel. You need to create a playbook that, for each new incident, queries an internal asset inventory API. The API is reachable only through a private endpoint in an Azure virtual network.

    Which type of playbook should you create?
  fr: |
    Fabrikam, Inc. utilise Microsoft Sentinel. Vous devez créer un playbook qui, pour chaque nouvel incident, interroge une API interne d'inventaire des ressources. L'API n'est accessible que par un point de terminaison privé dans un réseau virtuel Azure.

    Quel type de playbook devez-vous créer ?
body:
  options:
    - { id: a, text: { en: "A Standard logic app playbook, created from Blank playbook", fr: "Un playbook d'application logique Standard, créé à partir de Blank playbook" } }
    - { id: b, text: { en: "A Consumption playbook with an incident trigger and a managed identity", fr: "Un playbook Consumption avec un déclencheur d'incident et une identité managée" } }
    - { id: c, text: { en: "A Consumption playbook with an entity trigger and a service principal", fr: "Un playbook Consumption avec un déclencheur d'entité et un principal de service" } }
    - { id: d, text: { en: "A playbook template deployed from the content hub, without changes", fr: "Un modèle de playbook déployé depuis le hub de contenu, sans modification" } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Standard workflows run in single-tenant Azure Logic Apps and support private endpoints and virtual network integration, so Microsoft recommends a Standard logic app when a playbook must reach protected resources in or connected to a virtual network. In the Automation page, Standard playbooks start from Blank playbook.
    fr: |
      Les workflows Standard s'exécutent dans Azure Logic Apps monolocataire et prennent en charge les points de terminaison privés et l'intégration de réseau virtuel : Microsoft recommande une application logique Standard lorsqu'un playbook doit atteindre des ressources protégées dans un réseau virtuel ou connectées à celui-ci. Dans la page Automation, les playbooks Standard partent de Blank playbook.
  options:
    b: { en: "The identity type doesn't give a Consumption logic app access to resources behind a private endpoint.", fr: "Le type d'identité ne donne pas à une application logique Consumption l'accès aux ressources derrière un point de terminaison privé." }
    c: { en: "An entity trigger runs manually on an entity, not for each new incident, and Consumption has no virtual network integration.", fr: "Un déclencheur d'entité s'exécute manuellement sur une entité, pas pour chaque nouvel incident, et Consumption n'a pas d'intégration de réseau virtuel." }
    d: { en: "Templates must be customized before use, and a template doesn't change the network capabilities of its logic app type.", fr: "Les modèles doivent être personnalisés avant usage, et un modèle ne modifie pas les capacités réseau de son type d'application logique." }
references:
  - title: Create and manage Microsoft Sentinel playbooks
    url: https://learn.microsoft.com/en-us/azure/sentinel/automation/create-playbooks
