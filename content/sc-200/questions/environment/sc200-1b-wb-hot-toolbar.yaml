id: sc200-1b-wb-hot-toolbar
objective: "1.2.3"
type: hotarea
difficulty: 2
status: draft
stem:
  en: |
    Northwind Traders uses Microsoft Sentinel. A saved workbook named **WB-SOC-Wall** is open in view mode. The workbook toolbar is shown in the following table.

    Answer each prompt by selecting the toolbar command to use.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind Traders utilise Microsoft Sentinel. Un classeur enregistré nommé **WB-SOC-Wall** est ouvert en mode affichage. La barre d'outils du classeur figure dans le tableau suivant.

    Répondez à chaque consigne en sélectionnant la commande de la barre d'outils à utiliser.

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
    - id: p1
      text: { en: "Create a separate copy of WB-SOC-Wall that the network team can customize", fr: "Créer une copie distincte de WB-SOC-Wall que l'équipe réseau peut personnaliser" }
    - id: p2
      text: { en: "Make WB-SOC-Wall update its data every 15 minutes while it stays open on the wall screen", fr: "Faire en sorte que WB-SOC-Wall mette à jour ses données toutes les 15 minutes tant qu'il reste ouvert sur l'écran mural" }
  grid:
    caption: { en: "WB-SOC-Wall toolbar", fr: "Barre d'outils de WB-SOC-Wall" }
    header: [{ en: "Command", fr: "Commande" }, { en: "Command", fr: "Commande" }, { en: "Command", fr: "Commande" }]
    rows:
      - [{ text: Edit, area: edit }, { text: Save, area: save }, { text: Save as, area: saveas }]
      - [{ text: Refresh, area: refresh }, { text: Auto refresh, area: auto }, { text: Open in Azure, area: openaz }]
answer:
  values: { p1: saveas, p2: auto }
explanation:
  correct:
    en: |
      Save as clones the workbook under a new name in the same subscription and resource group, and the clone appears on My workbooks for further editing. Auto refresh reruns the queries at an interval from 5 minutes to 1 day; it is off by default and turns off when the workbook is closed. Refresh updates the data only once.
    fr: |
      Save as clone le classeur sous un nouveau nom dans le même abonnement et le même groupe de ressources, et le clone apparaît dans My workbooks pour être modifié. Auto refresh réexécute les requêtes à un intervalle de 5 minutes à 1 jour ; il est désactivé par défaut et se désactive à la fermeture du classeur. Refresh ne met à jour les données qu'une seule fois.
  options:
    save: { en: "Save keeps your changes in the same workbook; it doesn't create a copy.", fr: "Save conserve vos modifications dans le même classeur ; il ne crée pas de copie." }
    refresh: { en: "Refresh updates the data once, not at a regular interval.", fr: "Refresh met à jour les données une seule fois, pas à intervalle régulier." }
references:
  - title: Visualize your data by using workbooks in Microsoft Sentinel
    url: https://learn.microsoft.com/en-us/azure/sentinel/monitor-your-data
