id: sc200-1a-ind-folder-exclusion
objective: "1.1.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Fabrikam, Inc. uses Microsoft Defender for Endpoint Plan 2. The build servers write unsigned internal tools to **D:\Builds**, and automated investigations regularly flag these files, which slows down the investigations.

    You need automated investigation and remediation to skip the files in D:\Builds. Microsoft Defender Antivirus must still scan the files.

    What should you configure?
  fr: |
    Fabrikam, Inc. utilise Microsoft Defender pour point de terminaison Plan 2. Les serveurs de build écrivent des outils internes non signés dans **D:\Builds**, et les enquêtes automatisées signalent régulièrement ces fichiers, ce qui ralentit les enquêtes.

    Vous devez faire en sorte que l'enquête et la correction automatisées ignorent les fichiers de D:\Builds. L'Antivirus Microsoft Defender doit toujours analyser les fichiers.

    Que devez-vous configurer ?
body:
  options:
    - { id: a, text: { en: "A Microsoft Defender Antivirus exclusion for D:\\Builds", fr: "Une exclusion de l'Antivirus Microsoft Defender pour D:\\Builds" } }
    - { id: b, text: { en: "An automation folder exclusion for D:\\Builds", fr: "Une exclusion de dossier d'automatisation pour D:\\Builds" } }
    - { id: c, text: { en: "The No automated response automation level for the build servers' device group", fr: "Le niveau d'automatisation No automated response pour le groupe d'appareils des serveurs de build" } }
    - { id: d, text: { en: "An Allow file indicator for each tool in D:\\Builds", fr: "Un indicateur de fichier Allow pour chaque outil de D:\\Builds" } }
answer: { optionId: b }
explanation:
  correct:
    en: An **automation folder exclusion** tells automated investigations to ignore the files in a folder and its subfolders. It affects only automated investigation and remediation, so the excluded files are still scanned by the antivirus.
    fr: "Une **exclusion de dossier d'automatisation** indique aux enquêtes automatisées d'ignorer les fichiers d'un dossier et de ses sous-dossiers. Elle ne concerne que l'enquête et la correction automatisées : les fichiers exclus sont toujours analysés par l'antivirus."
  options:
    a:
      en: An antivirus exclusion stops the antivirus from scanning the folder, which the requirement forbids.
      fr: Une exclusion antivirus empêche l'antivirus d'analyser le dossier, ce que l'exigence interdit.
    c:
      en: No automated response stops automated investigation for the whole device group, not only for one folder, and it isn't recommended.
      fr: No automated response arrête l'enquête automatisée pour tout le groupe d'appareils, pas seulement pour un dossier, et ce niveau n'est pas recommandé.
    d:
      en: Hash indicators must be recreated for each new build because each version has a different hash, and an Allow indicator also stops antivirus detection of the file.
      fr: Les indicateurs de hachage doivent être recréés à chaque build, car chaque version a un hachage différent, et un indicateur Allow arrête aussi la détection du fichier par l'antivirus.
references:
  - title: Configure automation folder exclusions
    url: https://learn.microsoft.com/en-us/defender-endpoint/manage-automation-folder-exclusions
