id: sc200-1d-ct-schema-statements
objective: "1.3.7"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    Northwind has a Microsoft Sentinel workspace named **LAW1**. You create DCR-based custom tables in LAW1 by using the **Tables** page of the Azure portal, and you maintain their schemas with the schema editor.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind dispose d'un espace de travail Microsoft Sentinel nommé **LAW1**. Vous créez des tables personnalisées basées sur une DCR dans LAW1 depuis la page **Tables** du portail Azure, et vous gérez leurs schémas avec l'éditeur de schéma.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: If the sample JSON file that you upload has no TimeGenerated column, the portal adds a transformation that creates it.
        fr: Si l'exemple de fichier JSON que vous chargez n'a pas de colonne TimeGenerated, le portail ajoute une transformation qui la crée.
    - id: s2
      text:
        en: After you add a column to a custom table, Azure Monitor updates the data collection rules that send data to the table.
        fr: Après l'ajout d'une colonne à une table personnalisée, Azure Monitor met à jour les règles de collecte de données qui envoient des données vers la table.
    - id: s3
      text:
        en: You can delete a custom table that you created from the Tables page.
        fr: Vous pouvez supprimer depuis la page Tables une table personnalisée que vous avez créée.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: Every table needs TimeGenerated, and when the sample lacks it the portal adds a transformation that creates the column. Schema changes are not propagated to DCRs; you must update each DCR that sends data to the table yourself. Azure tables cannot be deleted, but a custom table can be deleted from the Tables page (ellipsis, Delete, then type yes).
    fr: Toute table a besoin de TimeGenerated, et quand l'exemple ne la contient pas, le portail ajoute une transformation qui crée la colonne. Les modifications de schéma ne sont pas répercutées dans les DCR ; vous devez mettre à jour vous-même chaque DCR qui envoie des données vers la table. Les tables Azure ne peuvent pas être supprimées, mais une table personnalisée peut l'être depuis la page Tables (points de suspension, Delete, puis saisir yes).
  options:
    s2: { en: "Azure Monitor does not update DCRs after a schema change; update them yourself.", fr: "Azure Monitor ne met pas à jour les DCR après une modification de schéma ; mettez-les à jour vous-même." }
references:
  - title: Add or delete tables and columns in Azure Monitor Logs
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/logs/create-custom-table
