id: sc200-1d-an-second-threshold
objective: "1.4.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Litware has a Microsoft Sentinel workspace. Last week, you duplicated the built-in anomaly rule **Unusual mass file download**. The copy, named **Unusual mass file download - Customized**, runs in Flighting mode with a threshold that you changed. The original rule runs in Production.

    The results of the copy are not satisfactory, and you need to test another threshold value.

    What should you do?
  fr: |
    Litware dispose d'un espace de travail Microsoft Sentinel. La semaine dernière, vous avez dupliqué la règle d'anomalie intégrée **Unusual mass file download**. La copie, nommée **Unusual mass file download - Customized**, s'exécute en mode Flighting avec un seuil que vous avez modifié. La règle d'origine s'exécute en Production.

    Les résultats de la copie ne sont pas satisfaisants, et vous devez tester une autre valeur de seuil.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Duplicate the built-in rule again, and set the new threshold on the second copy.", fr: "Dupliquer à nouveau la règle intégrée, puis définir le nouveau seuil sur la deuxième copie." } }
    - { id: b, text: { en: "Switch the customized copy to Production, and then duplicate the built-in rule.", fr: "Faire passer la copie personnalisée en Production, puis dupliquer la règle intégrée." } }
    - { id: c, text: { en: "Edit the built-in rule, and change its threshold to the new value.", fr: "Modifier la règle intégrée, puis changer son seuil pour la nouvelle valeur." } }
    - { id: d, text: { en: "Edit the customized copy, and change its threshold to the new value.", fr: "Modifier la copie personnalisée, puis changer son seuil pour la nouvelle valeur." } }
answer: { optionId: d }
explanation:
  correct:
    en: You can make only one customized copy of a given anomaly rule; a second duplication fails. The existing copy remains editable, so you edit it, change the threshold, and keep comparing its results with the original rule while it runs in Flighting.
    fr: |
      Vous ne pouvez créer qu'une seule copie personnalisée d'une règle d'anomalie donnée ; une deuxième duplication échoue. La copie existante reste modifiable : vous la modifiez, changez le seuil et continuez à comparer ses résultats avec ceux de la règle d'origine pendant qu'elle s'exécute en Flighting.
  options:
    a: { en: "Only one customized copy of a rule is allowed, so a second duplication fails.", fr: "Une seule copie personnalisée d'une règle est autorisée : une deuxième duplication échoue." }
    c: { en: "Built-in anomaly rules cannot be edited; only their status can be switched.", fr: "Les règles d'anomalie intégrées ne peuvent pas être modifiées ; seul leur état peut être basculé." }
    b: { en: "This would put an unvalidated threshold in production, and the duplication would still fail because a copy exists.", fr: "Cela mettrait en production un seuil non validé, et la duplication échouerait toujours, car une copie existe." }
references:
  - title: Work with anomaly detection analytics rules in Microsoft Sentinel
    url: https://learn.microsoft.com/en-us/azure/sentinel/work-with-anomaly-rules
