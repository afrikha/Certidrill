id: sc200-1a-asr-audit-kql
objective: "1.1.6"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    Northwind Traders deployed several attack surface reduction (ASR) rules in audit mode one week ago.

    Before you switch the rules to Block, you need an advanced hunting query that counts, for each rule and each device, the events that the rules would have blocked during the last seven days.

    How should you complete the query? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind Traders a déployé plusieurs règles de réduction de la surface d'attaque (ASR) en mode audit il y a une semaine.

    Avant de passer les règles en Block, vous avez besoin d'une requête de repérage avancé qui compte, pour chaque règle et chaque appareil, les événements que les règles auraient bloqués au cours des sept derniers jours.

    Comment devez-vous compléter la requête ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: kusto
  template: |
    [[tbl]]
    | where Timestamp > ago(7d)
    | where ActionType [[op]] "Asr"
    | where ActionType endswith [[suffix]]
    | summarize Events = count() by ActionType, DeviceName
  slots:
    - id: tbl
      options:
        - { id: de, text: DeviceEvents }
        - { id: ai, text: AlertInfo }
        - { id: dpe, text: DeviceProcessEvents }
        - { id: bi, text: BehaviorInfo }
    - id: op
      options:
        - { id: sw, text: startswith }
        - { id: ew, text: endswith }
        - { id: eq, text: "==" }
    - id: suffix
      options:
        - { id: audited, text: "\"Audited\"" }
        - { id: blocked, text: "\"Blocked\"" }
        - { id: allowed, text: "\"Allowed\"" }
answer:
  values: { tbl: de, op: sw, suffix: audited }
explanation:
  correct:
    en: ASR events are recorded in the `DeviceEvents` table with an `ActionType` that starts with `Asr`, such as `AsrOfficeChildProcessAudited` or `AsrPsexecWmiChildProcessBlocked`. In audit mode, the events that would have been blocked end with `Audited`; events that end with `Blocked` are produced only in Block mode.
    fr: Les événements ASR sont enregistrés dans la table `DeviceEvents` avec un `ActionType` qui commence par `Asr`, comme `AsrOfficeChildProcessAudited` ou `AsrPsexecWmiChildProcessBlocked`. En mode audit, les événements qui auraient été bloqués se terminent par `Audited` ; ceux qui se terminent par `Blocked` ne sont produits qu'en mode Block.
  options:
    ai: { en: "AlertInfo contains alerts, not the individual ASR audit events.", fr: "AlertInfo contient des alertes, pas les événements d'audit ASR individuels." }
    dpe: { en: "DeviceProcessEvents records process creation, not ASR rule decisions.", fr: "DeviceProcessEvents enregistre la création de processus, pas les décisions des règles ASR." }
    ew: { en: "Asr is the prefix of the ActionType values, not their suffix.", fr: "Asr est le préfixe des valeurs d'ActionType, pas leur suffixe." }
    eq: { en: "No ActionType is exactly Asr; each value names a rule and a result.", fr: "Aucun ActionType ne vaut exactement Asr ; chaque valeur désigne une règle et un résultat." }
    blocked: { en: "Rules in audit mode don't block anything, so they produce no Blocked events.", fr: "Les règles en mode audit ne bloquent rien : elles ne produisent aucun événement Blocked." }
references:
  - title: ASR rules reference
    url: https://learn.microsoft.com/en-us/defender-endpoint/attack-surface-reduction-rules-reference
