id: sc200-1b-ad-reenable-script
objective: "1.1.8"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Litware, Inc. has an on-premises Active Directory domain. Microsoft Defender for Identity sensors run on all the domain controllers and use the default action account.

    An identity-sync job runs every 30 minutes. It reads the HR system and enables every Active Directory account that belongs to a current employee.

    During a business email compromise attack, automatic attack disruption disabled the account of an employee named User1. Twenty minutes later, User1 was enabled again although no analyst released it.

    You need to ensure that accounts disabled by attack disruption stay disabled until the SOC releases them.

    What should you do?
  fr: |
    Litware, Inc. dispose d'un domaine Active Directory local. Les capteurs Microsoft Defender for Identity s'exécutent sur tous les contrôleurs de domaine et utilisent le compte d'action par défaut.

    Un travail de synchronisation des identités s'exécute toutes les 30 minutes. Il lit le système RH et active tous les comptes Active Directory qui appartiennent à un employé en poste.

    Pendant une attaque par compromission de messagerie professionnelle (BEC), l'interruption automatique des attaques a désactivé le compte d'un employé nommé User1. Vingt minutes plus tard, User1 était de nouveau activé alors qu'aucun analyste ne l'avait libéré.

    Vous devez vous assurer que les comptes désactivés par l'interruption des attaques restent désactivés jusqu'à ce que le SOC les libère.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Configure a group Managed Service Account as the Defender for Identity action account.", fr: "Configurer un compte de service administré de groupe comme compte d'action de Defender for Identity." } }
    - { id: b, text: { en: "Add User1 as a user exclusion in the Automated response settings.", fr: "Ajouter User1 comme exclusion d'utilisateur dans les paramètres Automated response." } }
    - { id: c, text: { en: "Set the automation level of the domain controllers' device group to Full - remediate threats automatically.", fr: "Définir le niveau d'automatisation du groupe d'appareils des contrôleurs de domaine sur Full - remediate threats automatically." } }
    - { id: d, text: { en: "Modify the identity-sync job so that it skips the accounts that the SOC has not released.", fr: "Modifier le travail de synchronisation des identités pour qu'il ignore les comptes que le SOC n'a pas libérés." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Microsoft warns that an automation that re-enables accounts can undo the Disable user action of attack disruption. Here the identity-sync job enables every current employee's account every 30 minutes, which reverses the containment of User1. The job must leave accounts disabled by attack disruption alone so that only the SOC releases them.
    fr: |
      Microsoft avertit qu'une automatisation qui réactive les comptes peut annuler l'action Disable user de l'interruption des attaques. Ici, le travail de synchronisation active toutes les 30 minutes le compte de chaque employé en poste, ce qui annule la contention de User1. Le travail doit laisser de côté les comptes désactivés par l'interruption des attaques pour que seul le SOC les libère.
  options:
    a: { en: "The action account only changes which identity performs the action; the disable worked, and the sync job would still re-enable the account.", fr: "Le compte d'action change seulement l'identité qui exécute l'action ; la désactivation a fonctionné et le travail de synchronisation réactiverait toujours le compte." }
    b: { en: "An exclusion would stop attack disruption from disabling User1 at all, the opposite of the requirement.", fr: "Une exclusion empêcherait totalement l'interruption des attaques de désactiver User1, soit l'inverse de l'exigence." }
    c: { en: "Device group automation levels control actions on devices; they don't stop a script from re-enabling an Active Directory account.", fr: "Les niveaux d'automatisation des groupes d'appareils contrôlent les actions sur les appareils ; ils n'empêchent pas un script de réactiver un compte Active Directory." }
references:
  - title: Configure automatic attack disruption in Microsoft Defender XDR
    url: https://learn.microsoft.com/en-us/defender-xdr/configure-attack-disruption
