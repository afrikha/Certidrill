id: sc200-1d-ar-mdti-rule
objective: "1.4.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso has onboarded a Microsoft Sentinel workspace to the Microsoft Defender portal. Firewalls send CEF logs to the **CommonSecurityLog** table, and DNS servers send events through the Windows DNS via AMA connector.

    You need to generate high-fidelity alerts and incidents when the logs contain domains or IP addresses that Microsoft threat intelligence identifies as malicious. The solution must minimize administrative effort and must not require an additional license.

    What should you create?
  fr: |
    Contoso a intégré un espace de travail Microsoft Sentinel au portail Microsoft Defender. Les pare-feu envoient des journaux CEF dans la table **CommonSecurityLog**, et les serveurs DNS envoient leurs événements par le connecteur Windows DNS via AMA.

    Vous devez générer des alertes et des incidents haute fidélité quand les journaux contiennent des domaines ou des adresses IP que le renseignement sur les menaces de Microsoft identifie comme malveillants. La solution doit réduire au minimum l'effort d'administration et ne doit nécessiter aucune licence supplémentaire.

    Que devez-vous créer ?
body:
  options:
    - { id: a, text: { en: "A rule from the ML Behavior Analytics template", fr: "Une règle à partir du modèle ML Behavior Analytics" } }
    - { id: b, text: { en: "A rule from the Microsoft Defender Threat Intelligence Analytics template", fr: "Une règle à partir du modèle Microsoft Defender Threat Intelligence Analytics" } }
    - { id: c, text: { en: "A customized copy of an anomaly rule", fr: "Une copie personnalisée d'une règle d'anomalie" } }
    - { id: d, text: { en: "A rule from a Microsoft security incident creation template", fr: "Une règle à partir d'un modèle de création d'incidents de sécurité Microsoft" } }
answer: { optionId: b }
explanation:
  correct:
    en: Microsoft Defender Threat Intelligence Analytics matches Microsoft threat intelligence indicators (domains and IPv4 addresses, plus URLs in CEF logs) against CEF, DNS, Syslog and other logs, and generates high-fidelity alerts and incidents. You create it from the Rule templates tab; it needs a supported connector but no premium Defender Threat Intelligence license, and its logic is managed by Microsoft.
    fr: Microsoft Defender Threat Intelligence Analytics compare les indicateurs du renseignement sur les menaces de Microsoft (domaines et adresses IPv4, plus les URL dans les journaux CEF) aux journaux CEF, DNS, Syslog et autres, et génère des alertes et des incidents haute fidélité. Vous la créez depuis l'onglet Modèles de règles ; elle nécessite un connecteur pris en charge mais aucune licence premium Defender Threat Intelligence, et sa logique est gérée par Microsoft.
  options:
    a: { en: "ML Behavior Analytics detects anomalous SSH and RDP sign-ins; it does not match threat indicators.", fr: "ML Behavior Analytics détecte les connexions SSH et RDP anormales ; elle ne compare pas les indicateurs de menace." }
    c: { en: "Anomaly rules write to the Anomalies table and do not generate alerts or match threat indicators.", fr: "Les règles d'anomalie écrivent dans la table Anomalies, ne génèrent pas d'alertes et ne comparent pas les indicateurs de menace." }
    d: { en: "Microsoft security rules create incidents from alerts of Microsoft products, and they are not available once Sentinel is onboarded to the Defender portal.", fr: "Les règles de sécurité Microsoft créent des incidents à partir des alertes des produits Microsoft, et elles ne sont pas disponibles une fois Sentinel intégré au portail Defender." }
references:
  - title: Use matching analytics in Microsoft Sentinel to detect threats
    url: https://learn.microsoft.com/en-us/azure/sentinel/use-matching-analytics-to-detect-threats
  - title: Threat detection in Microsoft Sentinel
    url: https://learn.microsoft.com/en-us/azure/sentinel/detect-threats-built-in
