id: sc200-cs4b-playbook-access
objective: "1.1.11"
type: multi
caseStudy: sc200-cs4b-best-for-you-organics
difficulty: 2
status: draft
stem:
  en: |
    You need to assign roles to meet the playbook automation requirement.

    Which two role assignments should you create? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez attribuer des rôles pour respecter l'exigence relative à l'automatisation par playbook.

    Quelles sont les deux attributions de rôle que vous devez créer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text:
        en: Logic App Contributor for Ines Moreau on RG-Playbooks
        fr: Logic App Contributor pour Ines Moreau sur RG-Playbooks
    - id: b
      text:
        en: Microsoft Sentinel Playbook Operator for Ines Moreau on RG-Playbooks
        fr: Microsoft Sentinel Playbook Operator pour Ines Moreau sur RG-Playbooks
    - id: c
      text:
        en: Microsoft Sentinel Automation Contributor for Ines Moreau on RG-Playbooks
        fr: Microsoft Sentinel Automation Contributor pour Ines Moreau sur RG-Playbooks
    - id: d
      text:
        en: Microsoft Sentinel Automation Contributor for the Microsoft Sentinel service account on RG-Playbooks
        fr: Microsoft Sentinel Automation Contributor pour le compte de service Microsoft Sentinel sur RG-Playbooks
    - id: e
      text:
        en: Logic App Contributor for the Microsoft Sentinel service account on RG-SOC
        fr: Logic App Contributor pour le compte de service Microsoft Sentinel sur RG-SOC
answer: { optionIds: [a, d] }
explanation:
  correct:
    en: |
      Creating and editing playbooks requires Logic App Contributor on the resource group that contains them, and Ines Moreau already has Microsoft Sentinel Contributor to create the automation rule. Microsoft Sentinel runs playbooks with its own service account, which needs Microsoft Sentinel Automation Contributor on the playbooks' resource group. Because RG-Playbooks is in another subscription, the automation rule cannot use PB-BlockShopper until this permission is granted.
    fr: |
      La création et la modification de playbooks exigent Logic App Contributor sur le groupe de ressources qui les contient, et Ines Moreau dispose déjà de Microsoft Sentinel Contributor pour créer la règle d'automatisation. Microsoft Sentinel exécute les playbooks avec son propre compte de service, qui a besoin de Microsoft Sentinel Automation Contributor sur le groupe de ressources des playbooks. Comme RG-Playbooks se trouve dans un autre abonnement, la règle d'automatisation ne peut pas utiliser PB-BlockShopper tant que cette autorisation n'est pas accordée.
  options:
    b:
      en: Playbook Operator lets a user list, view, and manually run playbooks, but not create or edit them.
      fr: Playbook Operator permet à un utilisateur de lister, d'afficher et d'exécuter manuellement des playbooks, mais pas de les créer ni de les modifier.
    c:
      en: Microsoft Sentinel Automation Contributor is meant for the Microsoft Sentinel service account, not for user accounts.
      fr: Microsoft Sentinel Automation Contributor est destiné au compte de service Microsoft Sentinel, pas aux comptes d'utilisateur.
    e:
      en: The service account needs Microsoft Sentinel Automation Contributor on the resource group of the playbooks, not Logic App Contributor on the workspace resource group.
      fr: Le compte de service a besoin de Microsoft Sentinel Automation Contributor sur le groupe de ressources des playbooks, et non de Logic App Contributor sur le groupe de ressources de l'espace de travail.
references:
  - title: Automate Threat Response with Playbooks in Microsoft Sentinel
    url: https://learn.microsoft.com/en-us/azure/sentinel/automation/automate-responses-with-playbooks
  - title: Roles and permissions in the Microsoft Sentinel platform
    url: https://learn.microsoft.com/en-us/azure/sentinel/roles
