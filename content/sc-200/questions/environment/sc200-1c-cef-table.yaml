id: sc200-1c-cef-table
objective: "1.3.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Northwind Traders configures its Palo Alto Networks firewalls to send CEF messages to a Linux log forwarder. The Common Event Format (CEF) via AMA connector collects the messages into the Microsoft Sentinel workspace **law-nw**.

    You need to write a hunting query that lists the denied connections reported by the firewalls.

    Which table should you query?
  fr: |
    Northwind Traders configure ses pare-feu Palo Alto Networks pour envoyer des messages CEF à un redirecteur de journaux Linux. Le connecteur Common Event Format (CEF) via AMA collecte les messages dans l'espace de travail Microsoft Sentinel **law-nw**.

    Vous devez écrire une requête de chasse qui liste les connexions refusées signalées par les pare-feu.

    Quelle table devez-vous interroger ?
body:
  options:
    - { id: a, text: Syslog }
    - { id: b, text: CommonSecurityLog }
    - { id: c, text: SecurityEvent }
    - { id: d, text: DeviceNetworkEvents }
answer: { optionId: b }
explanation:
  correct:
    en: The CEF via AMA connector writes the messages to `CommonSecurityLog`, where the CEF header and extensions are parsed into columns such as `DeviceVendor`, `DeviceProduct` and `DeviceAction`.
    fr: Le connecteur CEF via AMA écrit les messages dans `CommonSecurityLog`, où l'en-tête et les extensions CEF sont analysés en colonnes comme `DeviceVendor`, `DeviceProduct` et `DeviceAction`.
  options:
    a:
      en: Syslog receives plain Syslog messages from the Syslog via AMA connector, not CEF messages.
      fr: Syslog reçoit les messages Syslog simples du connecteur Syslog via AMA, pas les messages CEF.
    c:
      en: SecurityEvent stores the Windows Security events.
      fr: SecurityEvent stocke les événements de sécurité Windows.
    d:
      en: DeviceNetworkEvents stores the network events of devices onboarded to Defender for Endpoint.
      fr: DeviceNetworkEvents stocke les événements réseau des appareils intégrés à Defender pour point de terminaison.
references:
  - title: Syslog and Common Event Format (CEF) via AMA connectors for Microsoft Sentinel
    url: https://learn.microsoft.com/en-us/azure/sentinel/cef-syslog-ama-overview
