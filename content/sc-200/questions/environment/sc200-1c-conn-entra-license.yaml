id: sc200-1c-conn-entra-license
objective: "1.3.1"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove Bank has a Microsoft Entra tenant with Microsoft Entra ID Free licenses only. Woodgrove plans to connect the tenant to a Microsoft Sentinel workspace by using the Microsoft Entra ID data connector. The engineer who configures the connector has the required roles.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove Bank dispose d'un locataire Microsoft Entra doté uniquement de licences Microsoft Entra ID Free. Woodgrove prévoit de connecter le locataire à un espace de travail Microsoft Sentinel avec le connecteur de données Microsoft Entra ID. L'ingénieur qui configure le connecteur dispose des rôles requis.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: With the current licenses, Woodgrove can stream the audit logs to the `AuditLogs` table.
        fr: Avec les licences actuelles, Woodgrove peut envoyer les journaux d'audit vers la table `AuditLogs`.
    - id: s2
      text:
        en: With the current licenses, Woodgrove can stream the sign-in logs to the `SigninLogs` table.
        fr: Avec les licences actuelles, Woodgrove peut envoyer les journaux de connexion vers la table `SigninLogs`.
    - id: s3
      text:
        en: After Woodgrove buys Microsoft Entra ID P2 licenses, it can stream the `AADRiskyServicePrincipals` logs.
        fr: Après l'achat de licences Microsoft Entra ID P2, Woodgrove peut envoyer les journaux `AADRiskyServicePrincipals`.
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: Any Microsoft Entra ID license, including Free, is enough for the log types other than sign-ins, such as audit logs. Ingesting sign-in logs requires Microsoft Entra ID P1 or P2. The `AADRiskyServicePrincipals` and `AADServicePrincipalRiskEvents` logs require a Microsoft Entra Workload ID Premium license, which P2 doesn't include.
    fr: Toute licence Microsoft Entra ID, y compris Free, suffit pour les types de journaux autres que les connexions, comme les journaux d'audit. L'ingestion des journaux de connexion exige Microsoft Entra ID P1 ou P2. Les journaux `AADRiskyServicePrincipals` et `AADServicePrincipalRiskEvents` exigent une licence Microsoft Entra Workload ID Premium, que P2 n'inclut pas.
references:
  - title: Send data to Microsoft Sentinel using the Microsoft Entra ID data connector
    url: https://learn.microsoft.com/en-us/azure/sentinel/connect-azure-active-directory
