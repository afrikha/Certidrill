id: sc200-1a-cdc-prereqs
objective: "1.1.5"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Wingtip Toys plans to use custom data collection in Microsoft Defender for Endpoint to collect script execution events from all applicable Windows 11 devices.

    Which two requirements must be met before you can create the rule? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Wingtip Toys prévoit d'utiliser la collecte de données personnalisée de Microsoft Defender pour point de terminaison pour collecter les événements d'exécution de scripts sur tous les appareils Windows 11 applicables.

    Quelles sont les deux conditions à remplir avant de pouvoir créer la règle ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "The devices are licensed for Microsoft Defender for Endpoint Plan 2.", fr: "Les appareils disposent d'une licence Microsoft Defender pour point de terminaison Plan 2." } }
    - { id: b, text: { en: "The Azure Monitor Agent is installed on each device.", fr: "L'agent Azure Monitor est installé sur chaque appareil." } }
    - { id: c, text: { en: "A Microsoft Sentinel workspace is connected and selected on the Workspace scope page.", fr: "Un espace de travail Microsoft Sentinel est connecté et sélectionné sur la page Workspace scope." } }
    - { id: d, text: { en: "Microsoft Defender for Servers Plan 2 is enabled on the subscription.", fr: "Microsoft Defender pour serveurs Plan 2 est activé sur l'abonnement." } }
    - { id: e, text: { en: "The devices are added to a device group with the Full automation level.", fr: "Les appareils sont ajoutés à un groupe d'appareils avec le niveau d'automatisation Full." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: Custom data collection is included with Defender for Endpoint Plan 2, and it requires a connected Microsoft Sentinel workspace (one per tenant) that you select on the Workspace scope page, even if it is already connected. Sentinel ingestion is billed according to your Sentinel billing.
    fr: La collecte de données personnalisée est incluse dans Defender pour point de terminaison Plan 2, et elle exige un espace de travail Microsoft Sentinel connecté (un par locataire), que vous sélectionnez sur la page Workspace scope, même s'il est déjà connecté. L'ingestion dans Sentinel est facturée selon la facturation de Sentinel.
  options:
    b: { en: "The events are collected by the Defender for Endpoint sensor; no Azure Monitor Agent is required.", fr: "Les événements sont collectés par le capteur de Defender pour point de terminaison ; aucun agent Azure Monitor n'est requis." }
    d: { en: "Defender for Servers is a Defender for Cloud plan; it isn't a prerequisite of custom data collection on Windows 11 devices.", fr: "Defender pour serveurs est un plan de Defender pour le cloud ; ce n'est pas un prérequis de la collecte de données personnalisée sur des appareils Windows 11." }
    e: { en: "Automation levels control automated remediation, not data collection.", fr: "Les niveaux d'automatisation contrôlent la correction automatisée, pas la collecte de données." }
references:
  - title: Create and manage custom data collection rules in Microsoft Defender for Endpoint
    url: https://learn.microsoft.com/en-us/defender-endpoint/create-custom-data-collection-rules
