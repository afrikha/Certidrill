id: sc200-cs2c-custom-detection
objective: "1.4.1"
type: yesno_statements
caseStudy: sc200-cs2c-graphic-design-institute
difficulty: 2
status: draft
stem:
  en: |
    You are creating CD-PortfolioApps from the advanced hunting page of the Defender portal.

    For each of the following statements, select Yes if the statement is true. Otherwise, select No.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous créez CD-PortfolioApps depuis la page de repérage avancé du portail Defender.

    Pour chacune des affirmations suivantes, sélectionnez Oui si l'affirmation est vraie. Sinon, sélectionnez Non.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text: { en: "CD-PortfolioApps can use the Continuous (NRT) frequency.", fr: "CD-PortfolioApps peut utiliser la fréquence Continuous (NRT)." }
    - id: s2
      text: { en: "The query results must include the Timestamp and ReportId columns of the CloudAppEvents event.", fr: "Les résultats de la requête doivent inclure les colonnes Timestamp et ReportId de l'événement CloudAppEvents." }
    - id: s3
      text: { en: "If CD-PortfolioApps runs every hour, each run evaluates the data of the previous four hours.", fr: "Si CD-PortfolioApps s'exécute toutes les heures, chaque exécution évalue les données des quatre heures précédentes." }
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: A Continuous (NRT) rule must query a single table without joins or unions, and CD-PortfolioApps joins CloudAppEvents with IdentityInfo. For Defender tables other than the Defender for Endpoint ones, the query must return Timestamp and ReportId from the same event. A rule that runs every hour has a fixed lookback of four hours.
    fr: Une règle Continuous (NRT) doit interroger une seule table, sans jointure ni union, or CD-PortfolioApps joint CloudAppEvents à IdentityInfo. Pour les tables Defender autres que celles de Defender pour point de terminaison, la requête doit renvoyer Timestamp et ReportId du même événement. Une règle qui s'exécute toutes les heures a une période de recherche fixe de quatre heures.
  options:
    s1: { en: "The join with IdentityInfo prevents the Continuous (NRT) frequency; Every hour or a longer frequency must be used.", fr: "La jointure avec IdentityInfo empêche la fréquence Continuous (NRT) ; il faut utiliser Every hour ou une fréquence plus longue." }
references:
  - title: Create custom detection rules in Microsoft Defender XDR
    url: https://learn.microsoft.com/en-us/defender-xdr/custom-detection-rules
