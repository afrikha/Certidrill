id: sc200-cs4a-live-response-script
objective: "1.1.3"
type: multi
caseStudy: sc200-cs4a-munsons
difficulty: 1
status: draft
stem:
  en: |
    You need to meet the MES forensics requirement.

    Which two advanced features should you turn on? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez respecter l'exigence relative à l'investigation du MES.

    Quelles sont les deux fonctionnalités avancées que vous devez activer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: "Restrict correlation to within scoped device groups" }
    - { id: b, text: "Live response for servers" }
    - { id: c, text: "Enable EDR in block mode" }
    - { id: d, text: "Custom network indicators" }
    - { id: e, text: "Live response unsigned script execution" }
answer: { optionIds: [b, e] }
explanation:
  correct:
    en: |
      SRV-MES1 runs Windows Server 2022, and live response sessions on servers require the Live response for servers feature in addition to Live response, which is already on. Get-MesArtifacts.ps1 is an unsigned PowerShell script, so Live response unsigned script execution must also be turned on before the run command can execute it. The analysts already have a role with the advanced commands.
    fr: |
      SRV-MES1 exécute Windows Server 2022, et les sessions de réponse dynamique sur des serveurs exigent la fonctionnalité Live response for servers en plus de Live response, déjà activée. Get-MesArtifacts.ps1 est un script PowerShell non signé : Live response unsigned script execution doit aussi être activée pour que la commande run puisse l'exécuter. Les analystes disposent déjà d'un rôle qui inclut les commandes avancées.
  options:
    a:
      en: This setting limits alert correlation to the device groups a local SOC can access; it has no effect on live response sessions.
      fr: Ce paramètre limite la corrélation des alertes aux groupes d'appareils accessibles à un SOC local ; il n'a aucun effet sur les sessions de réponse dynamique.
    c:
      en: EDR in block mode blocks malicious artifacts detected post-breach; it does not allow scripts to run in live response.
      fr: Le mode bloc EDR bloque les artefacts malveillants détectés après une violation ; il ne permet pas d'exécuter des scripts en réponse dynamique.
    d:
      en: Custom network indicators allow or block IP addresses, domains, or URLs; they are unrelated to live response.
      fr: Les indicateurs réseau personnalisés autorisent ou bloquent des adresses IP, des domaines ou des URL ; ils n'ont aucun lien avec la réponse dynamique.
references:
  - title: Investigate entities on devices using live response in Microsoft Defender for Endpoint
    url: https://learn.microsoft.com/en-us/defender-endpoint/live-response
  - title: Configure Advanced Features in Microsoft Defender for Endpoint
    url: https://learn.microsoft.com/en-us/defender-endpoint/advanced-features
