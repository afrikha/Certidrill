id: sc200-1c-ti-upload-role
objective: "1.3.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove Bank runs an in-house threat intelligence platform that must push STIX 2.1 indicators and threat actors to the Microsoft Sentinel workspace **law-woodgrove** every hour. The platform authenticates with a Microsoft Entra app registration named **TIP-Upload** and calls the Threat Intelligence upload API.

    You need to grant TIP-Upload the permissions it needs. The solution must follow the principle of least privilege.

    Which role should you assign to TIP-Upload on the workspace?
  fr: |
    Woodgrove Bank exploite une plateforme interne de renseignement sur les menaces qui doit pousser chaque heure des indicateurs et des acteurs de menace STIX 2.1 vers l'espace de travail Microsoft Sentinel **law-woodgrove**. La plateforme s'authentifie avec une inscription d'application Microsoft Entra nommée **TIP-Upload** et appelle l'API de chargement du renseignement sur les menaces (upload API).

    Vous devez accorder à TIP-Upload les autorisations dont elle a besoin. La solution doit respecter le principe du moindre privilège.

    Quel rôle devez-vous attribuer à TIP-Upload sur l'espace de travail ?
body:
  options:
    - { id: a, text: Microsoft Sentinel Responder }
    - { id: b, text: Monitoring Metrics Publisher }
    - { id: c, text: Microsoft Sentinel Reader }
    - { id: d, text: Microsoft Sentinel Contributor }
answer: { optionId: d }
explanation:
  correct:
    en: The upload API requires the calling Microsoft Entra application to have the Microsoft Sentinel Contributor role at the workspace level. The app requests a token for `https://management.azure.com/.default` and posts up to 100 STIX 2.0 or 2.1 objects per request to the workspace endpoint.
    fr: L'API de chargement exige que l'application Microsoft Entra appelante dispose du rôle Microsoft Sentinel Contributor au niveau de l'espace de travail. L'application demande un jeton pour `https://management.azure.com/.default` et publie jusqu'à 100 objets STIX 2.0 ou 2.1 par requête vers le point de terminaison de l'espace de travail.
  options:
    a:
      en: Microsoft Sentinel Responder manages incidents; it isn't enough to upload threat intelligence.
      fr: Microsoft Sentinel Responder gère les incidents ; il ne suffit pas pour charger du renseignement sur les menaces.
    b:
      en: Monitoring Metrics Publisher is the role for the Logs Ingestion API on a data collection rule, not for the threat intelligence upload API.
      fr: Monitoring Metrics Publisher est le rôle de l'API d'ingestion de journaux sur une règle de collecte de données, pas celui de l'API de chargement du renseignement sur les menaces.
    c:
      en: Microsoft Sentinel Reader can only read data.
      fr: Microsoft Sentinel Reader peut seulement lire les données.
references:
  - title: Import threat intelligence to Microsoft Sentinel with the upload API (Preview)
    url: https://learn.microsoft.com/en-us/azure/sentinel/stix-objects-api
