id: sc200-1b-wb-query-settings
objective: "1.2.3"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    Wingtip Toys has a Microsoft Sentinel workspace onboarded to the Microsoft Defender portal. You create a new workbook with **Add workbook**, select **Edit** and add a query step that runs KQL against the workspace data.

    How should you configure the query step and save the workbook? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Wingtip Toys dispose d'un espace de travail Microsoft Sentinel intégré au portail Microsoft Defender. Vous créez un nouveau classeur avec **Add workbook**, sélectionnez **Edit** et ajoutez une étape de requête qui exécute du KQL sur les données de l'espace de travail.

    Comment devez-vous configurer l'étape de requête et enregistrer le classeur ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Data source: [[ds]]

      Resource type: [[rt]]

      Save the workbook in: [[loc]]
    fr: |
      Source de données : [[ds]]

      Type de ressource : [[rt]]

      Enregistrer le classeur dans : [[loc]]
  slots:
    - id: ds
      options:
        - { id: metrics, text: Metrics }
        - { id: logs, text: Logs }
        - { id: arg, text: Azure Resource Graph }
        - { id: json, text: JSON }
    - id: rt
      options:
        - { id: appi, text: Application Insights }
        - { id: law, text: Log Analytics }
        - { id: vm, text: { en: "Virtual machines", fr: "Machines virtuelles" } }
    - id: loc
      options:
        - { id: hub, text: { en: "The Content hub", fr: "Le hub de contenu" } }
        - { id: storage, text: { en: "A storage account linked to the workspace", fr: "Un compte de stockage lié à l'espace de travail" } }
        - { id: rg, text: { en: "The subscription and resource group of the workspace", fr: "L'abonnement et le groupe de ressources de l'espace de travail" } }
answer:
  values: { ds: logs, rt: law, loc: rg }
explanation:
  correct:
    en: |
      To query workspace data, a workbook query step uses the Logs data source with the Log Analytics resource type, and you select one or more workspaces. When you select Done editing and Save, you enter a name and select the subscription and resource group of the workspace, because a workbook is an Azure resource.
    fr: |
      Pour interroger les données de l'espace de travail, une étape de requête utilise la source de données Logs avec le type de ressource Log Analytics, puis vous sélectionnez un ou plusieurs espaces de travail. Lorsque vous sélectionnez Done editing puis Save, vous saisissez un nom et sélectionnez l'abonnement et le groupe de ressources de l'espace de travail, car un classeur est une ressource Azure.
  options:
    metrics: { en: "Metrics queries platform metrics, not KQL over workspace tables.", fr: "Metrics interroge des métriques de plateforme, pas des tables de l'espace de travail en KQL." }
    arg: { en: "Azure Resource Graph queries resource inventory, not log data.", fr: "Azure Resource Graph interroge l'inventaire des ressources, pas les données de journaux." }
    hub: { en: "The Content hub distributes solutions; your own workbooks are saved as resources in a resource group.", fr: "Le hub de contenu distribue des solutions ; vos propres classeurs sont enregistrés comme ressources dans un groupe de ressources." }
references:
  - title: Visualize your data by using workbooks in Microsoft Sentinel
    url: https://learn.microsoft.com/en-us/azure/sentinel/monitor-your-data
