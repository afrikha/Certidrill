id: sc200-1a-af-statements
objective: "1.1.3"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Proseware, Inc. uses Microsoft Defender for Endpoint Plan 2. You review the advanced features **Automatically resolve alerts**, **Hide potential duplicate device records** and **Download quarantined files**.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware, Inc. utilise Microsoft Defender pour point de terminaison Plan 2. Vous examinez les fonctionnalités avancées **Automatically resolve alerts**, **Hide potential duplicate device records** et **Download quarantined files**.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: When Automatically resolve alerts is on, it resolves an alert that an analyst manually set to In progress if the investigation finds no threat.
        fr: Lorsque Automatically resolve alerts est activé, il résout une alerte qu'un analyste a passée manuellement à In progress si l'enquête ne trouve aucune menace.
    - id: s2
      text:
        en: When Hide potential duplicate device records is on, the duplicate devices still appear in advanced hunting.
        fr: Lorsque Hide potential duplicate device records est activé, les appareils en double apparaissent toujours dans le repérage avancé.
    - id: s3
      text:
        en: Download quarantined files is turned on by default.
        fr: Download quarantined files est activé par défaut.
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: Automatically resolve alerts doesn't overwrite the status of alerts that an analyst already set to In progress or Resolved. Hiding duplicate device records affects the device inventory, the vulnerability management pages and the machine APIs, but duplicates still appear in global search, advanced hunting, alerts and incidents. Download quarantined files is on by default.
    fr: Automatically resolve alerts n'écrase pas le statut des alertes qu'un analyste a déjà passées à In progress ou Resolved. Le masquage des appareils en double concerne l'inventaire des appareils, les pages de gestion des vulnérabilités et les API des machines, mais les doublons apparaissent toujours dans la recherche globale, le repérage avancé, les alertes et les incidents. Download quarantined files est activé par défaut.
references:
  - title: Configure Advanced Features in Microsoft Defender for Endpoint
    url: https://learn.microsoft.com/en-us/defender-endpoint/advanced-features
