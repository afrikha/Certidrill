id: sc200-1b-pb-custom-details
objective: "1.1.11"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Litware, Inc. uses Microsoft Sentinel. A scheduled analytics rule surfaces the custom details **TargetHost** and **ExfilBytes** in its alerts. You are building a playbook with the alert trigger.

    Later steps of the playbook must use TargetHost and ExfilBytes as separate fields from the Dynamic content list.

    What should you add after the trigger?
  fr: |
    Litware, Inc. utilise Microsoft Sentinel. Une règle d'analyse planifiée expose les détails personnalisés **TargetHost** et **ExfilBytes** dans ses alertes. Vous créez un playbook avec le déclencheur d'alerte.

    Les étapes suivantes du playbook doivent utiliser TargetHost et ExfilBytes comme des champs distincts de la liste Dynamic content.

    Que devez-vous ajouter après le déclencheur ?
body:
  options:
    - { id: a, text: { en: "An Initialize variable action whose value is Alert Custom Details", fr: "Une action Initialize variable dont la valeur est Alert Custom Details" } }
    - { id: b, text: { en: "A Parse JSON action whose content is Alert Custom Details, with a schema generated from a sample payload", fr: "Une action Parse JSON dont le contenu est Alert Custom Details, avec un schéma généré à partir d'un exemple de charge utile" } }
    - { id: c, text: { en: "An Entities - Get Hosts action that uses the alert entities", fr: "Une action Entities - Get Hosts qui utilise les entités de l'alerte" } }
    - { id: d, text: { en: "A Condition that checks that Incident ARM ID is not null", fr: "Une Condition qui vérifie que Incident ARM ID n'est pas null" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Alert custom details arrive as one JSON object. A Parse JSON action with Alert Custom Details as content and a schema generated by Use sample payload to generate schema exposes each custom field as its own dynamic content item for the next steps.
    fr: |
      Les détails personnalisés d'une alerte arrivent sous forme d'un seul objet JSON. Une action Parse JSON avec Alert Custom Details comme contenu et un schéma généré par Use sample payload to generate schema expose chaque champ personnalisé comme un élément de contenu dynamique distinct pour les étapes suivantes.
  options:
    a: { en: "A variable would hold the whole JSON object; it doesn't create separate fields.", fr: "Une variable contiendrait l'objet JSON entier ; elle ne crée pas de champs distincts." }
    c: { en: "Entity actions return the mapped entities, not the custom details of the alert.", fr: "Les actions d'entités renvoient les entités mappées, pas les détails personnalisés de l'alerte." }
    d: { en: "This check is used in entity playbooks run outside an incident; it doesn't expose custom details.", fr: "Cette vérification sert aux playbooks d'entité exécutés hors d'un incident ; elle n'expose pas les détails personnalisés." }
references:
  - title: Create and manage Microsoft Sentinel playbooks
    url: https://learn.microsoft.com/en-us/azure/sentinel/automation/create-playbooks
