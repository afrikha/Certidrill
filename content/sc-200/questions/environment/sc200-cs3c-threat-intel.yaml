id: sc200-cs3c-threat-intel
objective: "1.3.6"
type: dropdown
caseStudy: sc200-cs3c-relecloud
difficulty: 3
status: draft
stem:
  en: |
    You need to meet the threat intelligence requirement.

    How should you complete the configuration? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez respecter l'exigence relative au renseignement sur les menaces.

    Comment devez-vous compléter la configuration ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Import the indicators of the information sharing center by using [[feed]].
      RC-Intel sends its indicators by using [[push]].
      The Microsoft Entra application of RC-Intel needs the [[role]] role on the workspace.
      Queries and analytics rules read the indicators from the [[tbl]] table.
    fr: |
      Importer les indicateurs du centre de partage d'informations avec [[feed]].
      RC-Intel envoie ses indicateurs avec [[push]].
      L'application Microsoft Entra de RC-Intel a besoin du rôle [[role]] sur l'espace de travail.
      Les requêtes et les règles d'analytique lisent les indicateurs dans la table [[tbl]].
  slots:
    - id: feed
      options:
        - { id: tip, text: { en: "the Threat Intelligence Platform (TIP) data connector", fr: "le connecteur de données Threat Intelligence Platform (TIP)" } }
        - { id: taxii, text: { en: "the Threat Intelligence - TAXII data connector", fr: "le connecteur de données Threat Intelligence - TAXII" } }
        - { id: mdti, text: { en: "the Microsoft Defender Threat Intelligence data connector", fr: "le connecteur de données Microsoft Defender Threat Intelligence" } }
        - { id: api, text: { en: "the Threat Intelligence upload API", fr: "l'API de chargement Threat Intelligence (upload API)" } }
    - id: push
      options:
        - { id: papi, text: { en: "the Threat Intelligence upload API", fr: "l'API de chargement Threat Intelligence (upload API)" } }
        - { id: ptip, text: { en: "the Threat Intelligence Platform (TIP) data connector", fr: "le connecteur de données Threat Intelligence Platform (TIP)" } }
        - { id: ptaxii, text: { en: "the Threat Intelligence - TAXII data connector", fr: "le connecteur de données Threat Intelligence - TAXII" } }
    - id: role
      options:
        - { id: responder, text: Microsoft Sentinel Responder }
        - { id: reader, text: Microsoft Sentinel Reader }
        - { id: contributor, text: Microsoft Sentinel Contributor }
        - { id: auto, text: Microsoft Sentinel Automation Contributor }
    - id: tbl
      options:
        - { id: legacy, text: ThreatIntelligenceIndicator }
        - { id: new, text: ThreatIntelIndicators }
        - { id: alert, text: SecurityAlert }
answer:
  values: { feed: taxii, push: papi, role: contributor, tbl: new }
explanation:
  correct:
    en: |
      The Threat Intelligence - TAXII connector imports STIX objects from a TAXII 2.0 or 2.1 server by using its API root and collection ID. The upload API lets an application send STIX objects through REST without a data connector, and its Microsoft Entra application needs the Microsoft Sentinel Contributor role. All threat intelligence is now stored in ThreatIntelIndicators and ThreatIntelObjects; the legacy ThreatIntelligenceIndicator table no longer receives data.
    fr: |
      Le connecteur Threat Intelligence - TAXII importe des objets STIX depuis un serveur TAXII 2.0 ou 2.1 à l'aide de sa racine d'API et de l'ID de collection. L'API de chargement permet à une application d'envoyer des objets STIX par REST sans connecteur de données, et son application Microsoft Entra a besoin du rôle Microsoft Sentinel Contributor. Tout le renseignement sur les menaces est désormais stocké dans ThreatIntelIndicators et ThreatIntelObjects ; la table héritée ThreatIntelligenceIndicator ne reçoit plus de données.
  options:
    tip: { en: "The TIP connector is being deprecated, which the requirement forbids, and it does not read a TAXII server.", fr: "Le connecteur TIP est en cours de dépréciation, ce que l'exigence interdit, et il ne lit pas un serveur TAXII." }
    mdti: { en: "The Defender Threat Intelligence connector imports Microsoft's own intelligence, not the feed of a third-party TAXII server.", fr: "Le connecteur Defender Threat Intelligence importe le renseignement de Microsoft, pas le flux d'un serveur TAXII tiers." }
    api: { en: "The upload API pushes data from a client; it does not pull indicators from a TAXII server automatically.", fr: "L'API de chargement envoie des données depuis un client ; elle ne récupère pas automatiquement les indicateurs d'un serveur TAXII." }
    ptip: { en: "The TIP connector is being deprecated, and Microsoft recommends the upload API instead.", fr: "Le connecteur TIP est en cours de dépréciation, et Microsoft recommande l'API de chargement à sa place." }
    ptaxii: { en: "The TAXII connector pulls from a TAXII server; RC-Intel must push its indicators through a REST API.", fr: "Le connecteur TAXII lit un serveur TAXII ; RC-Intel doit envoyer ses indicateurs par une API REST." }
    responder: { en: "Responder manages incidents but cannot write threat intelligence.", fr: "Responder gère les incidents, mais ne peut pas écrire de renseignement sur les menaces." }
    legacy: { en: "ThreatIntelligenceIndicator is the legacy table, which the requirement forbids.", fr: "ThreatIntelligenceIndicator est la table héritée, que l'exigence interdit." }
references:
  - title: Threat intelligence in Microsoft Sentinel
    url: https://learn.microsoft.com/en-us/azure/sentinel/understand-threat-intelligence
