id: sc200-1b-ar-statements
objective: "1.1.10"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    Tailspin Toys uses Microsoft Sentinel with scheduled and near-real-time (NRT) analytics rules. You are designing automation rules.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin Toys utilise Microsoft Sentinel avec des règles d'analyse planifiées et quasi en temps réel (NRT). Vous concevez des règles d'automatisation.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          An automation rule that uses the When alert is created trigger can run for the alerts of an NRT analytics rule.
        fr: |
          Une règle d'automatisation qui utilise le déclencheur When alert is created peut s'exécuter pour les alertes d'une règle d'analyse NRT.
    - id: s2
      text:
        en: |
          When an automation rule reaches its expiration date, Microsoft Sentinel deletes the rule.
        fr: |
          Lorsqu'une règle d'automatisation atteint sa date d'expiration, Microsoft Sentinel supprime la règle.
    - id: s3
      text:
        en: |
          An automation rule can add a task list to new incidents without running a playbook.
        fr: |
          Une règle d'automatisation peut ajouter une liste de tâches aux nouveaux incidents sans exécuter de playbook.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |
      The alert trigger runs for alerts created by Scheduled and NRT analytics rules (and Microsoft security rules). An expired rule is disabled, not deleted. Adding incident tasks is a built-in automation rule action, so no playbook is needed.
    fr: |
      Le déclencheur d'alerte s'exécute pour les alertes créées par les règles d'analyse Scheduled et NRT (et les règles de sécurité Microsoft). Une règle expirée est désactivée, pas supprimée. L'ajout de tâches d'incident est une action intégrée des règles d'automatisation : aucun playbook n'est nécessaire.
references:
  - title: Automate threat response in Microsoft Sentinel with automation rules
    url: https://learn.microsoft.com/en-us/azure/sentinel/automate-incident-handling-with-automation-rules
