id: sc200-1b-wb-facts
objective: "1.2.3"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    Litware, Inc. uses Microsoft Sentinel. You save a workbook from the **Microsoft Entra sign-in logs** template and display it on a screen in the SOC.

    Which two statements are true?

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware, Inc. utilise Microsoft Sentinel. Vous enregistrez un classeur à partir du modèle **Microsoft Entra sign-in logs** et l'affichez sur un écran du SOC.

    Quelles sont les deux affirmations vraies ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Saving the template creates an Azure resource in the workspace's resource group.", fr: "L'enregistrement du modèle crée une ressource Azure dans le groupe de ressources de l'espace de travail." } }
    - { id: b, text: { en: "The saved workbook stores a copy of the query results at the time it is saved.", fr: "Le classeur enregistré stocke une copie des résultats des requêtes au moment de l'enregistrement." } }
    - { id: c, text: { en: "Auto refresh is off by default and must be turned on to update the data at an interval.", fr: "Auto refresh est désactivé par défaut et doit être activé pour mettre à jour les données à intervalle régulier." } }
    - { id: d, text: { en: "Auto refresh can update the workbook every minute.", fr: "Auto refresh peut mettre à jour le classeur toutes les minutes." } }
    - { id: e, text: { en: "You can delete the template from the Templates tab after saving your copy.", fr: "Vous pouvez supprimer le modèle de l'onglet Templates après avoir enregistré votre copie." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |
      Saving a template creates a workbook resource in the workspace's resource group; only the JSON definition is saved, not data. Auto refresh is off by default, offers intervals from 5 minutes to 1 day, and turns off when you close the workbook.
    fr: |
      Enregistrer un modèle crée une ressource de classeur dans le groupe de ressources de l'espace de travail ; seule la définition JSON est enregistrée, pas les données. Auto refresh est désactivé par défaut, propose des intervalles de 5 minutes à 1 jour, et se désactive lorsque vous fermez le classeur.
  options:
    b: { en: "Only the workbook's JSON definition is saved; the queries run again each time.", fr: "Seule la définition JSON du classeur est enregistrée ; les requêtes s'exécutent de nouveau à chaque fois." }
    d: { en: "The shortest Auto refresh interval is 5 minutes.", fr: "L'intervalle Auto refresh le plus court est de 5 minutes." }
    e: { en: "Templates can't be deleted; you delete saved workbooks from the My workbooks tab.", fr: "Les modèles ne peuvent pas être supprimés ; vous supprimez les classeurs enregistrés depuis l'onglet My workbooks." }
references:
  - title: Visualize your data by using workbooks in Microsoft Sentinel
    url: https://learn.microsoft.com/en-us/azure/sentinel/monitor-your-data
