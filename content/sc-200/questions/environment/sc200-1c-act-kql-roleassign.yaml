id: sc200-1c-act-kql-roleassign
objective: "1.3.5"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    Fabrikam collects the activity logs of its Azure subscriptions into a Microsoft Sentinel workspace by using the Azure Activity connector.

    You need a query that lists the Azure role assignments created successfully during the last seven days, with the identity that created each one.

    How should you complete the query? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam collecte les journaux d'activité de ses abonnements Azure dans un espace de travail Microsoft Sentinel avec le connecteur Azure Activity.

    Vous avez besoin d'une requête qui liste les attributions de rôles Azure créées avec succès au cours des sept derniers jours, avec l'identité qui a créé chacune d'elles.

    Comment devez-vous compléter la requête ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: kusto
  template: |
    [[table]]
    | where TimeGenerated > ago(7d)
    | where OperationNameValue =~ "MICROSOFT.AUTHORIZATION/ROLEASSIGNMENTS/WRITE"
    | where [[status]] =~ "Success"
    | project TimeGenerated, [[who]], CallerIpAddress, ResourceGroup, _ResourceId
  slots:
    - id: table
      options:
        - { id: activity, text: AzureActivity }
        - { id: audit, text: AuditLogs }
        - { id: diag, text: AzureDiagnostics }
        - { id: signin, text: SigninLogs }
    - id: status
      options:
        - { id: asv, text: ActivityStatusValue }
        - { id: level, text: Level }
        - { id: category, text: CategoryValue }
        - { id: rp, text: ResourceProviderValue }
    - id: who
      options:
        - { id: caller, text: Caller }
        - { id: initiated, text: InitiatedBy }
        - { id: upn, text: UserPrincipalName }
        - { id: claims, text: Claims }
answer:
  values: { table: activity, status: asv, who: caller }
explanation:
  correct:
    en: The Azure Activity connector writes subscription-level operations to `AzureActivity`. `OperationNameValue` holds the Resource Manager operation, `ActivityStatusValue` its status (such as Success), and `Caller` the identity that performed it.
    fr: Le connecteur Azure Activity écrit les opérations au niveau de l'abonnement dans `AzureActivity`. `OperationNameValue` contient l'opération Resource Manager, `ActivityStatusValue` son état (par exemple Success) et `Caller` l'identité qui l'a effectuée.
  options:
    audit: { en: "AuditLogs records Microsoft Entra directory changes, not Azure Resource Manager role assignments.", fr: "AuditLogs enregistre les modifications de l'annuaire Microsoft Entra, pas les attributions de rôles Azure Resource Manager." }
    diag: { en: "AzureDiagnostics stores resource logs of some Azure services.", fr: "AzureDiagnostics stocke les journaux de ressources de certains services Azure." }
    signin: { en: "SigninLogs stores Microsoft Entra sign-ins.", fr: "SigninLogs stocke les connexions Microsoft Entra." }
    level: { en: "Level holds the severity of the event, not its status.", fr: "Level contient la gravité de l'événement, pas son état." }
    initiated: { en: "InitiatedBy is a column of AuditLogs.", fr: "InitiatedBy est une colonne d'AuditLogs." }
    upn: { en: "UserPrincipalName is a column of the sign-in tables.", fr: "UserPrincipalName est une colonne des tables de connexion." }
references:
  - title: Azure Monitor Logs reference - AzureActivity
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/reference/tables/azureactivity
