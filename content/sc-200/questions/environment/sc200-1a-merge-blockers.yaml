id: sc200-1a-merge-blockers
objective: "1.1.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Contoso, Ltd. uses Microsoft Defender XDR, Microsoft Defender for Endpoint and Microsoft Defender for Identity. Incident1 and Incident2 contain alerts about the same device and the same user, raised within a few minutes. Defender XDR did not merge the incidents.

    Which two conditions could explain why the incidents were not merged?

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso, Ltd. utilise Microsoft Defender XDR, Microsoft Defender pour point de terminaison et Microsoft Defender pour Identity. Incident1 et Incident2 contiennent des alertes sur le même appareil et le même utilisateur, générées à quelques minutes d'intervalle. Defender XDR n'a pas fusionné les incidents.

    Quelles sont les deux conditions qui pourraient expliquer que les incidents n'aient pas été fusionnés ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Incident1 has a High severity and Incident2 has a Low severity.", fr: "Incident1 a une gravité élevée et Incident2 une gravité faible." } }
    - { id: b, text: { en: "Incident1 was classified as a true positive and Incident2 as a false positive.", fr: "Incident1 a été classé comme vrai positif et Incident2 comme faux positif." } }
    - { id: c, text: { en: "Incident1 contains Defender for Endpoint alerts and Incident2 contains Defender for Identity alerts.", fr: "Incident1 contient des alertes Defender pour point de terminaison et Incident2 des alertes Defender pour Identity." } }
    - { id: d, text: { en: "Incident1 has the Closed status.", fr: "Incident1 a le statut Closed (fermé)." } }
    - { id: e, text: { en: "Neither incident is assigned to an analyst.", fr: "Aucun des deux incidents n'est attribué à un analyste." } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: Defender XDR doesn't merge incidents when one of them is closed (resolved incidents aren't reopened), or when they have different classifications or determinations. The other blocking conditions are an assignment to two different people, exceeding the maximum number of entities, and, if enabled, devices in different device groups.
    fr: Defender XDR ne fusionne pas les incidents lorsque l'un d'eux est fermé (les incidents résolus ne sont pas rouverts) ou lorsqu'ils ont des classifications ou des déterminations différentes. Les autres conditions bloquantes sont l'attribution à deux personnes différentes, le dépassement du nombre maximal d'entités et, si elle est activée, la présence d'appareils de groupes d'appareils différents.
  options:
    a: { en: "Different severities don't prevent a merge.", fr: "Des gravités différentes n'empêchent pas une fusion." }
    c: { en: "Correlation works across sources: alerts from different Defender products are routinely merged into one incident.", fr: "La corrélation fonctionne entre sources : des alertes de produits Defender différents sont couramment fusionnées dans un même incident." }
    e: { en: "Only an assignment to two different people blocks the merge; unassigned incidents can merge.", fr: "Seule l'attribution à deux personnes différentes bloque la fusion ; des incidents non attribués peuvent fusionner." }
references:
  - title: Alert correlation and incident merging in the Microsoft Defender portal
    url: https://learn.microsoft.com/en-us/defender-xdr/alerts-incidents-correlation
