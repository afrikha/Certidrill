id: sc200-1c-ti-mdti-premium
objective: "1.3.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Northwind Traders already ingests public indicators and open-source intelligence (OSINT) into its Microsoft Sentinel workspace. The SOC now also needs indicators produced by Microsoft and Microsoft-enriched OSINT.

    What should you use?
  fr: |
    Northwind Traders ingère déjà des indicateurs publics et du renseignement en sources ouvertes (OSINT) dans son espace de travail Microsoft Sentinel. Le SOC a désormais aussi besoin d'indicateurs produits par Microsoft et d'OSINT enrichi par Microsoft.

    Que devez-vous utiliser ?
body:
  options:
    - id: a
      text: { en: "The standard Defender Threat Intelligence data connector", fr: "Le connecteur de données Defender Threat Intelligence standard" }
    - id: b
      text: { en: "The premium Defender Threat Intelligence data connector (MDTI API Access SKU)", fr: "Le connecteur de données Defender Threat Intelligence premium (référence SKU MDTI API Access)" }
    - id: c
      text: { en: "The Threat Intelligence - TAXII data connector, pointed at a public feed", fr: "Le connecteur de données Threat Intelligence - TAXII, pointé vers un flux public" }
    - id: d
      text: { en: "The Microsoft Defender Threat Intelligence Analytics rule", fr: "La règle Microsoft Defender Threat Intelligence Analytics" }
answer: { optionId: b }
explanation:
  correct:
    en: The free version of Defender Threat Intelligence provides public indicators and OSINT. The premium version adds Microsoft indicators and Microsoft-enriched OSINT; it requires the MDTI API Access SKU, purchased through sales.
    fr: La version gratuite de Defender Threat Intelligence fournit des indicateurs publics et de l'OSINT. La version premium ajoute les indicateurs Microsoft et l'OSINT enrichi par Microsoft ; elle exige la référence SKU MDTI API Access, achetée auprès du service commercial.
  options:
    a:
      en: The standard connector provides public indicators and OSINT, which Northwind already has.
      fr: Le connecteur standard fournit des indicateurs publics et de l'OSINT, ce dont Northwind dispose déjà.
    c:
      en: A public TAXII feed doesn't provide Microsoft's own indicators.
      fr: Un flux TAXII public ne fournit pas les indicateurs propres à Microsoft.
    d:
      en: The analytics rule matches Microsoft threat intelligence with your logs and keeps only matched indicators; it doesn't import the premium indicator set.
      fr: La règle d'analytique compare le renseignement Microsoft à vos journaux et ne conserve que les indicateurs correspondants ; elle n'importe pas le jeu d'indicateurs premium.
references:
  - title: Threat intelligence in Microsoft Sentinel
    url: https://learn.microsoft.com/en-us/azure/sentinel/understand-threat-intelligence
  - title: Enable the Microsoft Defender Threat Intelligence data connector
    url: https://learn.microsoft.com/en-us/azure/sentinel/connect-mdti-data-connector
