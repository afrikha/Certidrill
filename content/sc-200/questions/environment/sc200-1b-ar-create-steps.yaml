id: sc200-1b-ar-create-steps
objective: "1.1.10"
type: ordering
difficulty: 1
status: draft
stem:
  en: |
    Proseware, Inc. has a Microsoft Sentinel workspace onboarded to the Microsoft Defender portal. You need to create an automation rule that assigns every new incident generated by the analytics rule **Rare-Admin-Logon** to the identity team.

    Which five actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Proseware, Inc. dispose d'un espace de travail Microsoft Sentinel intégré au portail Microsoft Defender. Vous devez créer une règle d'automatisation qui attribue à l'équipe identité chaque nouvel incident généré par la règle d'analyse **Rare-Admin-Logon**.

    Quelles sont les cinq actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 5
  actions:
    - { id: open, text: { en: "Open Microsoft Sentinel > Configuration > Automation.", fr: "Ouvrir Microsoft Sentinel > Configuration > Automation." } }
    - { id: create, text: { en: "Select Create > Automation rule and enter a name.", fr: "Sélectionner Create > Automation rule et saisir un nom." } }
    - { id: trigger, text: { en: "Select the trigger When incident is created.", fr: "Sélectionner le déclencheur When incident is created." } }
    - { id: cond, text: { en: "Add the condition Analytic rule name contains Rare-Admin-Logon.", fr: "Ajouter la condition Analytic rule name contains Rare-Admin-Logon." } }
    - { id: action, text: { en: "Add the action Assign owner, set the order, and then select Apply.", fr: "Ajouter l'action Assign owner, définir l'ordre, puis sélectionner Apply." } }
    - { id: pb, text: { en: "Select Create > Logic App playbook.", fr: "Sélectionner Create > Logic App playbook." } }
    - { id: perm, text: { en: "Select Manage playbook permissions.", fr: "Sélectionner Manage playbook permissions." } }
answer:
  sequence: [ open, create, trigger, cond, action ]
explanation:
  correct:
    en: |
      Automation rules are created on the Automation page with Create > Automation rule. In the panel you name the rule, select the trigger, define the conditions (in the Defender portal, use the analytics rule name rather than the incident title), add the actions, set the order and optional expiration, and select Apply.
    fr: |
      Les règles d'automatisation se créent dans la page Automation avec Create > Automation rule. Dans le volet, vous nommez la règle, sélectionnez le déclencheur, définissez les conditions (dans le portail Defender, utilisez le nom de la règle d'analyse plutôt que le titre de l'incident), ajoutez les actions, définissez l'ordre et l'expiration facultative, puis sélectionnez Apply.
  options:
    pb: { en: "Assigning an owner is a built-in action; no playbook is needed.", fr: "L'attribution d'un propriétaire est une action intégrée : aucun playbook n'est nécessaire." }
    perm: { en: "Playbook permissions are needed only when the rule runs a playbook.", fr: "Les autorisations de playbook ne sont nécessaires que si la règle exécute un playbook." }
references:
  - title: Create and use Microsoft Sentinel automation rules to manage response
    url: https://learn.microsoft.com/en-us/azure/sentinel/create-manage-use-automation-rules
