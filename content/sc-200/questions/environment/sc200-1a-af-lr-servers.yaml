id: sc200-1a-af-lr-servers
objective: "1.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Contoso, Ltd. uses Microsoft Defender for Endpoint Plan 2. The **Live response** advanced feature is on, and the incident responders have a role that grants live response permissions.

    The responders can start live response sessions on Windows 11 devices, but they cannot start sessions on onboarded Windows Server 2022 devices.

    What should you do?
  fr: |
    Contoso, Ltd. utilise Microsoft Defender pour point de terminaison Plan 2. La fonctionnalité avancée **Live response** est activée, et les intervenants en cas d'incident disposent d'un rôle qui accorde les autorisations de réponse dynamique.

    Les intervenants peuvent démarrer des sessions de réponse dynamique sur les appareils Windows 11, mais pas sur les appareils Windows Server 2022 intégrés.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Turn on the Allow unsigned script execution in live response advanced feature.", fr: "Activer la fonctionnalité avancée Allow unsigned script execution in live response." } }
    - { id: b, text: { en: "Turn on the Default to streamlined connectivity advanced feature.", fr: "Activer la fonctionnalité avancée Default to streamlined connectivity." } }
    - { id: c, text: { en: "Turn on the Live response for servers advanced feature.", fr: "Activer la fonctionnalité avancée Live response for servers." } }
    - { id: d, text: { en: "Turn on the Device discovery advanced feature.", fr: "Activer la fonctionnalité avancée Device discovery." } }
answer: { optionId: c }
explanation:
  correct:
    en: Live response is controlled by two advanced features. **Live response** allows sessions on devices, and **Live response for servers** separately allows sessions on servers. The responders already have the role, so turning on Live response for servers is the missing step.
    fr: "La réponse dynamique dépend de deux fonctionnalités avancées. **Live response** autorise les sessions sur les appareils, et **Live response for servers** autorise séparément les sessions sur les serveurs. Les intervenants ont déjà le rôle : activer Live response for servers est l'étape manquante."
  options:
    a:
      en: This feature allows unsigned scripts inside live response sessions; it doesn't allow sessions on servers.
      fr: Cette fonctionnalité autorise les scripts non signés dans les sessions de réponse dynamique ; elle n'autorise pas les sessions sur les serveurs.
    b:
      en: Streamlined connectivity changes the default onboarding package; the servers are already onboarded.
      fr: La connectivité simplifiée change le package d'intégration par défaut ; les serveurs sont déjà intégrés.
    d:
      en: Device discovery finds unmanaged devices on the network; it has no effect on live response.
      fr: La découverte d'appareils trouve les appareils non gérés du réseau ; elle n'a aucun effet sur la réponse dynamique.
references:
  - title: Configure Advanced Features in Microsoft Defender for Endpoint
    url: https://learn.microsoft.com/en-us/defender-endpoint/advanced-features
