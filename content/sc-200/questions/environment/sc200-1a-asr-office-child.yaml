id: sc200-1a-asr-office-child
objective: "1.1.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Litware, Inc. uses Microsoft Defender for Endpoint Plan 2. In a recent phishing campaign, users opened Word and Excel documents whose macros started **powershell.exe** and **cmd.exe**.

    You need to prevent Office applications from starting other processes. The solution must use an attack surface reduction (ASR) rule.

    Which ASR rule should you enable?
  fr: |
    Litware, Inc. utilise Microsoft Defender pour point de terminaison Plan 2. Lors d'une récente campagne d'hameçonnage, des utilisateurs ont ouvert des documents Word et Excel dont les macros ont démarré **powershell.exe** et **cmd.exe**.

    Vous devez empêcher les applications Office de démarrer d'autres processus. La solution doit utiliser une règle de réduction de la surface d'attaque (ASR).

    Quelle règle ASR devez-vous activer ?
body:
  options:
    - { id: a, text: Block Office applications from creating executable content }
    - { id: b, text: Block all Office applications from creating child processes }
    - { id: c, text: Block Win32 API calls from Office macros }
    - { id: d, text: Block execution of potentially obfuscated scripts }
answer: { optionId: b }
explanation:
  correct:
    en: "**Block all Office applications from creating child processes** stops Word, Excel and the other Office apps from launching child processes such as PowerShell or the command prompt, a common technique of malicious macros."
    fr: "**Block all Office applications from creating child processes** empêche Word, Excel et les autres applications Office de lancer des processus enfants comme PowerShell ou l'invite de commandes, une technique courante des macros malveillantes."
  options:
    a:
      en: This rule stops Office apps from writing executable files to disk; it doesn't stop them from starting existing executables.
      fr: Cette règle empêche les applications Office d'écrire des fichiers exécutables sur le disque ; elle ne les empêche pas de démarrer des exécutables existants.
    c:
      en: This rule blocks macros from calling Win32 APIs; it doesn't target the creation of child processes.
      fr: Cette règle empêche les macros d'appeler des API Win32 ; elle ne cible pas la création de processus enfants.
    d:
      en: This rule blocks scripts with obfuscation; the processes started by the macros would still run.
      fr: Cette règle bloque les scripts obfusqués ; les processus démarrés par les macros s'exécuteraient toujours.
references:
  - title: ASR rules reference
    url: https://learn.microsoft.com/en-us/defender-endpoint/attack-surface-reduction-rules-reference
