id: sc200-1a-tune-hide-scanner
objective: "1.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Litware, Inc. uses Microsoft Defender XDR and Microsoft Defender for Endpoint. An approved internal vulnerability scanner runs every night and triggers the same Defender for Endpoint alert on several devices.

    You need to make sure that the alert no longer creates incidents. The alert records must remain available in the `AlertInfo` table for audits. The solution must minimize administrative effort.

    What should you do?
  fr: |
    Litware, Inc. utilise Microsoft Defender XDR et Microsoft Defender pour point de terminaison. Un analyseur de vulnérabilités interne approuvé s'exécute chaque nuit et déclenche la même alerte Defender pour point de terminaison sur plusieurs appareils.

    Vous devez faire en sorte que l'alerte ne crée plus d'incidents. Les enregistrements de l'alerte doivent rester disponibles dans la table `AlertInfo` pour les audits. La solution doit réduire au minimum l'effort d'administration.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Create an alert tuning rule that uses the Set as behavior action.", fr: "Créer une règle de réglage des alertes qui utilise l'action Set as behavior." }
    - id: b
      text: { en: "Create a Microsoft Sentinel automation rule that closes the matching incidents.", fr: "Créer une règle d'automatisation Microsoft Sentinel qui ferme les incidents correspondants." }
    - id: c
      text: { en: "Create an alert tuning rule that uses the Hide alert action.", fr: "Créer une règle de réglage des alertes qui utilise l'action Hide alert." }
    - id: d
      text: { en: "Create a Microsoft Defender Antivirus exclusion for the scanner folder.", fr: "Créer une exclusion de l'Antivirus Microsoft Defender pour le dossier de l'analyseur." }
answer: { optionId: c }
explanation:
  correct:
    en: An alert tuning rule with the **Hide alert** action suppresses matching alerts and prevents incident creation. Hidden alerts remain in the `AlertInfo` and `AlertEvidence` tables, and the action applies to Defender for Endpoint alerts, which is the case here.
    fr: Une règle de réglage des alertes avec l'action **Hide alert** supprime les alertes correspondantes et empêche la création d'incidents. Les alertes masquées restent dans les tables `AlertInfo` et `AlertEvidence`, et l'action s'applique aux alertes Defender pour point de terminaison, ce qui est le cas ici.
  options:
    a:
      en: Set as behavior turns the signals into behaviors stored in `BehaviorInfo` and `BehaviorEntities`, not alerts in `AlertInfo`.
      fr: Set as behavior transforme les signaux en comportements stockés dans `BehaviorInfo` et `BehaviorEntities`, pas en alertes dans `AlertInfo`.
    b:
      en: The automation rule runs after the incident exists, so incidents are still created.
      fr: "La règle d'automatisation s'exécute après la création de l'incident : des incidents sont donc toujours créés."
    d:
      en: An antivirus exclusion stops scanning the folder, which weakens protection, and EDR alerts can still be raised for the behavior of the scanner.
      fr: Une exclusion antivirus arrête l'analyse du dossier, ce qui affaiblit la protection, et des alertes EDR peuvent toujours être générées pour le comportement de l'analyseur.
references:
  - title: Investigate alerts in Microsoft Defender XDR
    url: https://learn.microsoft.com/en-us/defender-xdr/investigate-alerts
