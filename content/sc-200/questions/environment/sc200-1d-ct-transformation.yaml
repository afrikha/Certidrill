id: sc200-1d-ct-transformation
objective: "1.3.7"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    Litware has a Microsoft Sentinel workspace named **LAW1**. A gateway sends JSON records that contain the columns EventTime (an ISO 8601 date stored as a string), User, SrcIp, Verdict and RawPayload. The records have no TimeGenerated column.

    You are creating a DCR-based custom table named **GatewayAudit_CL** and its transformation. The transformation must meet the following requirements:

    - Build the TimeGenerated column from EventTime.
    - Do not store the EventTime and RawPayload columns.
    - Ingest only the records whose Verdict value is Blocked.

    How should you complete the transformation? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware dispose d'un espace de travail Microsoft Sentinel nommé **LAW1**. Une passerelle envoie des enregistrements JSON qui contiennent les colonnes EventTime (une date ISO 8601 stockée sous forme de chaîne), User, SrcIp, Verdict et RawPayload. Les enregistrements n'ont pas de colonne TimeGenerated.

    Vous créez une table personnalisée basée sur une DCR nommée **GatewayAudit_CL** et sa transformation. La transformation doit répondre aux exigences suivantes :

    - Construire la colonne TimeGenerated à partir d'EventTime.
    - Ne pas stocker les colonnes EventTime et RawPayload.
    - N'ingérer que les enregistrements dont la valeur Verdict est Blocked.

    Comment devez-vous compléter la transformation ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: kusto
  template: |
    source
    | extend TimeGenerated = [[conv]](EventTime)
    | [[op]] EventTime, RawPayload
    | where Verdict [[cmp]] "Blocked"
  slots:
    - id: conv
      options:
        - { id: todatetime, text: todatetime }
        - { id: totimespan, text: totimespan }
        - { id: tostring, text: tostring }
        - { id: ago, text: ago }
    - id: op
      options:
        - { id: away, text: project-away }
        - { id: project, text: project }
        - { id: keep, text: project-keep }
        - { id: summarize, text: summarize }
    - id: cmp
      options:
        - { id: eq, text: "==" }
        - { id: neq, text: "!=" }
        - { id: notcontains, text: "!contains" }
answer:
  values: { conv: todatetime, op: away, cmp: eq }
explanation:
  correct:
    en: "Every table needs a TimeGenerated column of type datetime, so the transformation converts the EventTime string with todatetime(). project-away removes the listed columns and keeps all the others, and where Verdict == \"Blocked\" drops every other record before ingestion, which also reduces cost."
    fr: "Toute table a besoin d'une colonne TimeGenerated de type datetime : la transformation convertit donc la chaîne EventTime avec todatetime(). project-away supprime les colonnes listées et conserve toutes les autres, et where Verdict == \"Blocked\" écarte tous les autres enregistrements avant l'ingestion, ce qui réduit aussi le coût."
  options:
    totimespan: { en: "totimespan returns a duration, not a date and time.", fr: "totimespan renvoie une durée, pas une date et une heure." }
    tostring: { en: "TimeGenerated must be a datetime, not a string.", fr: "TimeGenerated doit être de type datetime, pas une chaîne." }
    ago: { en: "ago() takes a timespan and returns a time relative to now; it does not parse a date.", fr: "ago() prend une durée et renvoie une heure relative à maintenant ; elle n'analyse pas une date." }
    project: { en: "project would keep only EventTime and RawPayload, the two columns to drop.", fr: "project ne conserverait qu'EventTime et RawPayload, les deux colonnes à supprimer." }
    keep: { en: "project-keep keeps the listed columns, the opposite of the requirement.", fr: "project-keep conserve les colonnes listées, l'inverse de l'exigence." }
    summarize: { en: "summarize aggregates records; it does not remove columns from each record.", fr: "summarize agrège les enregistrements ; il ne supprime pas de colonnes de chaque enregistrement." }
    neq: { en: "!= would ingest every record except the blocked ones.", fr: "!= ingérerait tous les enregistrements sauf les enregistrements bloqués." }
    notcontains: { en: "!contains would also exclude the blocked records.", fr: "!contains exclurait lui aussi les enregistrements bloqués." }
references:
  - title: "Tutorial: Send data to Azure Monitor Logs by using the Logs ingestion API (Azure portal)"
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/logs/tutorial-logs-ingestion-portal
  - title: Add or delete tables and columns in Azure Monitor Logs
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/logs/create-custom-table
