id: sc200-cs1a-tier1-roles
objective: "1.2.1"
type: multi
caseStudy: sc200-cs1a-lamna-healthcare
difficulty: 2
status: draft
stem:
  en: |
    You need to assign Azure roles to the tier-1 analysts to meet the tier-1 permissions requirement.

    Which two roles should you assign? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez attribuer des rôles Azure aux analystes de niveau 1 pour respecter l'exigence relative aux autorisations du niveau 1.

    Quels sont les deux rôles à attribuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: reader, text: "Microsoft Sentinel Reader on LAW-SOC" }
    - { id: responder, text: "Microsoft Sentinel Responder on LAW-SOC" }
    - { id: contributor, text: "Microsoft Sentinel Contributor on LAW-SOC" }
    - { id: operator, text: "Microsoft Sentinel Playbook Operator on RG-Playbooks" }
    - { id: logicapp, text: "Logic App Contributor on RG-Playbooks" }
    - { id: automation, text: "Microsoft Sentinel Automation Contributor on RG-Playbooks" }
answer: { optionIds: [responder, operator] }
explanation:
  correct:
    en: "Microsoft Sentinel Responder includes the Reader permissions and adds the management of incidents (assign, comment, change status, close) without allowing the creation or editing of analytics rules. Microsoft Sentinel Playbook Operator lets users list, view and manually run playbooks, so assigning it on RG-Playbooks lets the analysts run Notify-ClinicalLead on an incident."
    fr: "Microsoft Sentinel Responder inclut les autorisations de Reader et y ajoute la gestion des incidents (attribuer, commenter, changer le statut, fermer) sans permettre de créer ni de modifier des règles d'analytique. Microsoft Sentinel Playbook Operator permet de lister, d'afficher et d'exécuter manuellement des playbooks : l'attribuer sur RG-Playbooks permet aux analystes d'exécuter Notify-ClinicalLead sur un incident."
  options:
    reader: { en: "Microsoft Sentinel Reader only views data and incidents; it cannot assign or close incidents.", fr: "Microsoft Sentinel Reader ne fait qu'afficher les données et les incidents ; il ne permet pas d'attribuer ni de fermer des incidents." }
    contributor: { en: "Microsoft Sentinel Contributor also lets users create and edit analytics rules, which the requirement forbids.", fr: "Microsoft Sentinel Contributor permet aussi de créer et de modifier des règles d'analytique, ce que l'exigence interdit." }
    logicapp: { en: "Logic App Contributor lets users create and edit playbooks, which is more than running them.", fr: "Logic App Contributor permet de créer et de modifier des playbooks, ce qui va au-delà de leur exécution." }
    automation: { en: "Microsoft Sentinel Automation Contributor is granted to Microsoft Sentinel so that automation rules can run playbooks; it is not meant for user accounts.", fr: "Microsoft Sentinel Automation Contributor est accordé à Microsoft Sentinel pour que les règles d'automatisation puissent exécuter des playbooks ; il n'est pas destiné aux comptes d'utilisateurs." }
references:
  - title: Roles and permissions in the Microsoft Sentinel platform
    url: https://learn.microsoft.com/en-us/azure/sentinel/roles
