id: sc200-cs2a-device-groups
objective: "1.1.9"
type: yesno_statements
caseStudy: sc200-cs2a-fourth-coffee
difficulty: 2
status: draft
stem:
  en: |
    You review the current Microsoft Defender for Endpoint device group configuration.

    For each of the following statements, select Yes if the statement is true. Otherwise, select No.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous examinez la configuration actuelle des groupes d'appareils Microsoft Defender pour point de terminaison.

    Pour chacune des affirmations suivantes, sélectionnez Oui si l'affirmation est vraie. Sinon, sélectionnez Non.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text: { en: "ROAST-SRV1 is a member of DG-Servers.", fr: "ROAST-SRV1 est membre de DG-Servers." }
    - id: s2
      text: { en: "Remediation actions that an automated investigation identifies on a roasting-line control workstation wait for approval in the Action center.", fr: "Les actions de correction qu'une investigation automatisée identifie sur un poste de pilotage d'une ligne de torréfaction attendent une approbation dans l'Action center." }
    - id: s3
      text: { en: "Automatic attack disruption can automatically contain a Windows server that matches only the DG-Servers rule.", fr: "L'interruption automatique des attaques peut contenir automatiquement un serveur Windows qui correspond uniquement à la règle de DG-Servers." }
answer:
  values: { s1: false, s2: true, s3: false }
explanation:
  correct:
    en: A device that matches several device groups is added only to the highest-ranked group, so ROAST-SRV1 (tag Roasting, Windows Server) belongs to DG-Roasting, rank 1. DG-Roasting uses a Semi automation level that requires approval for all folders, so remediation actions are pending in the Action center. A device group set to No automated response is excluded from automated containment by attack disruption.
    fr: |
      Un appareil qui correspond à plusieurs groupes d'appareils n'est ajouté qu'au groupe de rang le plus élevé : ROAST-SRV1 (balise Roasting, Windows Server) appartient donc à DG-Roasting, de rang 1. DG-Roasting utilise un niveau Semi qui exige une approbation pour tous les dossiers : les actions de correction restent en attente dans l'Action center. Un groupe d'appareils configuré sur No automated response est exclu du confinement automatisé par l'interruption des attaques.
  options:
    s1: { en: "ROAST-SRV1 also matches DG-Roasting, which has a higher rank, so it is added only to DG-Roasting.", fr: "ROAST-SRV1 correspond aussi à DG-Roasting, de rang plus élevé : il n'est ajouté qu'à DG-Roasting." }
    s3: { en: "No automated response excludes the group from the automated containment of attack disruption; requirement 6 prevents changing it this quarter.", fr: "No automated response exclut le groupe du confinement automatisé de l'interruption des attaques ; l'exigence 6 empêche de le modifier ce trimestre." }
references:
  - title: Create and manage device groups in Microsoft Defender for Endpoint
    url: https://learn.microsoft.com/en-us/defender-endpoint/machine-groups
  - title: Configure automatic attack disruption in Microsoft Defender XDR
    url: https://learn.microsoft.com/en-us/defender-xdr/configure-attack-disruption
