id: sc200-1a-notif-org-tenant-link
objective: "1.1.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Tailspin Toys runs a managed SOC. Its analysts monitor several customer organizations, each with its own Microsoft 365 tenant and Microsoft Defender XDR, and they receive incident notification emails from all of them in a shared mailbox.

    You are creating an incident notification rule in the tenant of a customer named Wingtip Toys. Each email must show which organization it comes from, and its link must open the Microsoft Defender portal in the Wingtip Toys tenant.

    Which two settings should you select in the notification rule? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin Toys gère un SOC managé. Ses analystes surveillent plusieurs organisations clientes, chacune avec son propre locataire Microsoft 365 et Microsoft Defender XDR, et ils reçoivent les e-mails de notification d'incident de toutes ces organisations dans une boîte aux lettres partagée.

    Vous créez une règle de notification d'incident dans le locataire d'un client nommé Wingtip Toys. Chaque e-mail doit indiquer de quelle organisation il provient, et son lien doit ouvrir le portail Microsoft Defender dans le locataire Wingtip Toys.

    Quels sont les deux paramètres à sélectionner dans la règle de notification ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: Send only one notification per incident }
    - { id: b, text: Include organization name in the email }
    - { id: c, text: "Device group scope: All device groups" }
    - { id: d, text: Include tenant-specific portal link }
    - { id: e, text: "Alert severity: High" }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: "**Include organization name in the email** shows the organization name in each notification. **Include tenant-specific portal link** adds a link that contains the tenant ID, so it opens the Defender portal in that specific Microsoft 365 tenant."
    fr: "**Include organization name in the email** affiche le nom de l'organisation dans chaque notification. **Include tenant-specific portal link** ajoute un lien qui contient l'ID du locataire : il ouvre le portail Defender dans ce locataire Microsoft 365 précis."
  options:
    a:
      en: This setting limits the number of emails per incident; it does not identify the organization or the tenant.
      fr: Ce paramètre limite le nombre d'e-mails par incident ; il n'identifie ni l'organisation ni le locataire.
    c:
      en: The device group scope decides which incidents trigger an email, not what the email contains.
      fr: L'étendue des groupes d'appareils décide quels incidents déclenchent un e-mail, pas ce que contient l'e-mail.
    e:
      en: The alert severity filters which incidents are notified; it adds no organization name or tenant link.
      fr: La gravité des alertes filtre les incidents notifiés ; elle n'ajoute ni nom d'organisation ni lien vers le locataire.
references:
  - title: Get incident notifications by email
    url: https://learn.microsoft.com/en-us/defender-xdr/m365d-notifications-incidents
