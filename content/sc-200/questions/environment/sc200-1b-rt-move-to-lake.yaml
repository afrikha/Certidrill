id: sc200-1b-rt-move-to-lake
objective: "1.2.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Tailspin Toys has a Microsoft Sentinel workspace onboarded to the Microsoft Defender portal and to the Microsoft Sentinel data lake. A custom table named **AppFirewall_CL** is in the Analytics tier. Two scheduled analytics rules and a workbook query the table.

    You plan to move AppFirewall_CL to the Data lake tier.

    Which two statements are true after the move?

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin Toys dispose d'un espace de travail Microsoft Sentinel intégré au portail Microsoft Defender et au data lake Microsoft Sentinel. Une table personnalisée nommée **AppFirewall_CL** est au niveau Analytics. Deux règles d'analyse planifiées et un classeur interrogent la table.

    Vous prévoyez de déplacer AppFirewall_CL vers le niveau Data Lake.

    Quelles sont les deux affirmations vraies après le déplacement ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "The two analytics rules stop working on AppFirewall_CL.", fr: "Les deux règles d'analyse cessent de fonctionner sur AppFirewall_CL." } }
    - { id: b, text: { en: "The workbook keeps showing the new data in real time.", fr: "Le classeur continue d'afficher les nouvelles données en temps réel." } }
    - { id: c, text: { en: "The table has separate analytics retention and total retention settings.", fr: "La table a des paramètres distincts de rétention Analytics et de rétention totale." } }
    - { id: d, text: { en: "KQL jobs can query AppFirewall_CL and write their results to an analytics table.", fr: "Des tâches KQL peuvent interroger AppFirewall_CL et écrire leurs résultats dans une table Analytics." } }
    - { id: e, text: { en: "The maximum retention of the table becomes two years.", fr: "La rétention maximale de la table devient deux ans." } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: |
      Moving a table from Analytics to Data lake stops the features that rely on analytics data, such as alerting, analytics rules, custom detections and advanced hunting. The data stays queryable, and KQL jobs can promote results to the analytics tier.
    fr: |
      Déplacer une table d'Analytics vers Data Lake arrête les fonctionnalités qui reposent sur les données Analytics, comme les alertes, les règles d'analyse, les détections personnalisées et le repérage avancé. Les données restent interrogeables, et des tâches KQL peuvent promouvoir des résultats vers le niveau Analytics.
  options:
    b: { en: "The Data lake tier doesn't support real-time analytics, including workbooks.", fr: "Le niveau Data Lake ne prend pas en charge l'analytique en temps réel, classeurs compris." }
    c: { en: "A Data lake table has a single retention setting.", fr: "Une table Data Lake n'a qu'un seul paramètre de rétention." }
    e: { en: "Data lake retention can be set from 30 days to 12 years.", fr: "La rétention Data Lake peut être définie de 30 jours à 12 ans." }
references:
  - title: Manage data tiers and retention in Microsoft Sentinel
    url: https://learn.microsoft.com/en-us/azure/sentinel/manage-data-overview
  - title: Configure Table Settings in Microsoft Sentinel
    url: https://learn.microsoft.com/en-us/azure/sentinel/manage-table-tiers-retention
