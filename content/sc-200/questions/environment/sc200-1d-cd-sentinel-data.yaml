id: sc200-1d-cd-sentinel-data
objective: "1.4.1"
type: yesno_statements
difficulty: 3
status: draft
stem:
  en: |
    Fabrikam has onboarded a Microsoft Sentinel workspace named **LAW1** to the Microsoft Defender portal. Windows servers send security events to the **SecurityEvent** table of LAW1 through the Azure Monitor Agent. The servers are not onboarded to Microsoft Defender for Endpoint.

    In **Advanced hunting**, you write a query that uses only the SecurityEvent table, and you create a custom detection rule from it.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam a intégré un espace de travail Microsoft Sentinel nommé **LAW1** au portail Microsoft Defender. Des serveurs Windows envoient des événements de sécurité dans la table **SecurityEvent** de LAW1 par l'agent Azure Monitor. Les serveurs ne sont pas intégrés à Microsoft Defender pour point de terminaison.

    Dans **Repérage avancé**, vous écrivez une requête qui n'utilise que la table SecurityEvent, et vous en créez une règle de détection personnalisée.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: You can configure the rule to run every 30 minutes by using a custom frequency.
        fr: Vous pouvez configurer la règle pour qu'elle s'exécute toutes les 30 minutes avec une fréquence personnalisée.
    - id: s2
      text:
        en: You can limit the rule to a specific Defender for Endpoint device group.
        fr: Vous pouvez limiter la règle à un groupe d'appareils Defender pour point de terminaison spécifique.
    - id: s3
      text:
        en: You must configure the entity mapping of the rule manually.
        fr: Vous devez configurer manuellement le mappage d'entités de la règle.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: A rule based only on data ingested by Microsoft Sentinel can use a custom frequency from 5 minutes to 14 days. Scoping to device groups is not supported for such rules, because Sentinel data has no device group scoping. Entities are mapped automatically for Defender XDR data, but for Sentinel data you must configure the mapping yourself.
    fr: Une règle fondée uniquement sur des données ingérées par Microsoft Sentinel peut utiliser une fréquence personnalisée de 5 minutes à 14 jours. La limitation à des groupes d'appareils n'est pas prise en charge pour ces règles, car les données Sentinel n'ont pas d'étendue par groupe d'appareils. Les entités sont mappées automatiquement pour les données Defender XDR, mais pour les données Sentinel vous devez configurer le mappage vous-même.
  options:
    s2: { en: "Device group scoping applies to rules on Defender device data; it is not supported for rules on Sentinel data.", fr: "La limitation aux groupes d'appareils s'applique aux règles sur les données d'appareils Defender ; elle n'est pas prise en charge pour les règles sur des données Sentinel." }
references:
  - title: Create custom detection rules in Microsoft Defender XDR
    url: https://learn.microsoft.com/en-us/defender-xdr/custom-detection-rules
