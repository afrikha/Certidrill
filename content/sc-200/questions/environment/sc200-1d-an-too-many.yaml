id: sc200-1d-an-too-many
objective: "1.4.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Adatum has a Microsoft Sentinel workspace. The customized copy of an anomaly rule runs in Flighting mode with a threshold that you set. It records hundreds of anomalies per day, and investigation shows that almost all of them are normal activity.

    You need the customized copy to record fewer anomalies while still detecting strong deviations.

    What should you do?
  fr: |
    Adatum dispose d'un espace de travail Microsoft Sentinel. La copie personnalisée d'une règle d'anomalie s'exécute en mode Flighting avec un seuil que vous avez défini. Elle enregistre des centaines d'anomalies par jour, et l'analyse montre que presque toutes correspondent à une activité normale.

    La copie personnalisée doit enregistrer moins d'anomalies tout en détectant les écarts importants.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Raise the threshold of the customized copy.", fr: "Augmenter le seuil de la copie personnalisée." } }
    - { id: b, text: { en: "Lower the threshold of the customized copy.", fr: "Diminuer le seuil de la copie personnalisée." } }
    - { id: c, text: { en: "Switch the customized copy to Production mode.", fr: "Faire passer la copie personnalisée en mode Production." } }
    - { id: d, text: { en: "Switch the original rule to Flighting mode.", fr: "Faire passer la règle d'origine en mode Flighting." } }
answer: { optionId: a }
explanation:
  correct:
    en: The threshold sets how unusual an event must be before an anomaly is created. Too many anomalies usually mean the threshold is too low, so raising it on the customized copy keeps only the stronger deviations.
    fr: |
      Le seuil définit à quel point un événement doit être inhabituel pour qu'une anomalie soit créée. Trop d'anomalies signifient généralement un seuil trop bas : l'augmenter sur la copie personnalisée ne conserve que les écarts les plus importants.
  options:
    b: { en: "A lower threshold makes the rule record even more anomalies.", fr: "Un seuil plus bas fait enregistrer encore plus d'anomalies." }
    c: { en: "Switching to Production promotes the noisy settings instead of fixing them.", fr: "Le passage en Production promeut les paramètres trop bruyants au lieu de les corriger." }
    d: { en: "The mode of the original rule does not change the results of the customized copy.", fr: "Le mode de la règle d'origine ne change pas les résultats de la copie personnalisée." }
references:
  - title: Work with anomaly detection analytics rules in Microsoft Sentinel
    url: https://learn.microsoft.com/en-us/azure/sentinel/work-with-anomaly-rules
