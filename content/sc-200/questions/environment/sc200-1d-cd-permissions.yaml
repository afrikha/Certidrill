id: sc200-1d-cd-permissions
objective: "1.4.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Contoso uses Microsoft Defender XDR. Microsoft Defender XDR Unified role-based access control (RBAC) is activated for all workloads.

    A security analyst named **Analyst1** must create custom detection rules from advanced hunting queries on Microsoft Defender for Endpoint tables. Analyst1 already has access to all device groups.

    You need to grant Analyst1 the required permission. The solution must follow the principle of least privilege.

    What should you assign to Analyst1?
  fr: |
    Contoso utilise Microsoft Defender XDR. Le contrôle d'accès en fonction du rôle (RBAC) unifié de Microsoft Defender XDR est activé pour toutes les charges de travail.

    Un analyste de sécurité nommé **Analyst1** doit créer des règles de détection personnalisées à partir de requêtes de repérage avancé sur des tables de Microsoft Defender pour point de terminaison. Analyst1 a déjà accès à tous les groupes d'appareils.

    Vous devez accorder à Analyst1 l'autorisation requise. La solution doit respecter le principe du moindre privilège.

    Que devez-vous attribuer à Analyst1 ?
body:
  options:
    - { id: a, text: { en: "The Security Reader role in Microsoft Entra ID", fr: "Le rôle Security Reader dans Microsoft Entra ID" } }
    - { id: b, text: { en: "The Global Administrator role in Microsoft Entra ID", fr: "Le rôle Global Administrator dans Microsoft Entra ID" } }
    - { id: c, text: { en: "The Microsoft Sentinel Contributor role on the workspace", fr: "Le rôle Microsoft Sentinel Contributor sur l'espace de travail" } }
    - { id: d, text: { en: "A Unified RBAC custom role that has the Security settings (manage) permission", fr: "Un rôle personnalisé RBAC unifié qui dispose de l'autorisation Security settings (manage)" } }
answer: { optionId: d }
explanation:
  correct:
    en: To manage custom detections on Defender XDR data, a user needs the Security settings (manage) permission in the Defender portal, which you can grant with a Unified RBAC custom role. The user also needs permissions on every device in the rule's scope, which Analyst1 already has.
    fr: Pour gérer des détections personnalisées sur les données Defender XDR, un utilisateur a besoin de l'autorisation Security settings (manage) dans le portail Defender, que vous pouvez accorder par un rôle personnalisé RBAC unifié. L'utilisateur a aussi besoin d'autorisations sur tous les appareils de l'étendue de la règle, ce dont Analyst1 dispose déjà.
  options:
    a: { en: "Security Reader grants read-only access; it cannot create or manage detection rules.", fr: "Security Reader accorde un accès en lecture seule ; il ne permet pas de créer ni de gérer des règles de détection." }
    c: { en: "Microsoft Sentinel Contributor is the permission for rules on Microsoft Sentinel data, not on Defender for Endpoint tables.", fr: "Microsoft Sentinel Contributor est l'autorisation des règles sur des données Microsoft Sentinel, pas sur les tables de Defender pour point de terminaison." }
    b: { en: "Global Administrator would work, but it grants far more than needed and should be kept for emergencies.", fr: "Global Administrator conviendrait, mais il accorde bien plus que nécessaire et doit être réservé aux urgences." }
references:
  - title: Create custom detection rules in Microsoft Defender XDR
    url: https://learn.microsoft.com/en-us/defender-xdr/custom-detection-rules
