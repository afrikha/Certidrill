id: sc200-1c-soc-commitment-tier
objective: "1.2.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Twelve days ago, you moved the Microsoft Sentinel workspace **law-tailspin** from pay-as-you-go to the 300 GB per day commitment tier. Since then, you filtered a noisy data source in its data collection rule, and ingestion is now steady at about 110 GB per day.

    You need to move the workspace to the 100 GB per day commitment tier. You have the Owner role on the workspace.

    What should you do?
  fr: |
    Il y a douze jours, vous avez fait passer l'espace de travail Microsoft Sentinel **law-tailspin** du paiement à l'utilisation au niveau d'engagement de 300 Go par jour. Depuis, vous avez filtré une source de données bruyante dans sa règle de collecte de données, et l'ingestion est désormais stable à environ 110 Go par jour.

    Vous devez faire passer l'espace de travail au niveau d'engagement de 100 Go par jour. Vous disposez du rôle Owner sur l'espace de travail.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Select the 100 GB per day tier on the Pricing tab now, and the change applies the next day.", fr: "Sélectionner maintenant le niveau de 100 Go par jour dans l'onglet Pricing ; le changement s'applique le lendemain." }
    - id: b
      text: { en: "Switch the workspace to pay-as-you-go now, and then select the 100 GB per day tier.", fr: "Repasser maintenant l'espace de travail au paiement à l'utilisation, puis sélectionner le niveau de 100 Go par jour." }
    - id: c
      text: { en: "Wait until the 31-day commitment period ends, and then select the 100 GB per day tier.", fr: "Attendre la fin de la période d'engagement de 31 jours, puis sélectionner le niveau de 100 Go par jour." }
    - id: d
      text: { en: "Set a daily cap of 100 GB on the workspace so that it's billed at the 100 GB per day tier.", fr: "Définir un plafond quotidien de 100 Go sur l'espace de travail pour qu'il soit facturé au niveau de 100 Go par jour." }
answer: { optionId: c }
explanation:
  correct:
    en: You can raise a commitment tier at any time, which restarts the 31-day commitment period. To move to a lower tier or back to pay-as-you-go, you must wait until the 31-day commitment period finishes. Changing the tier on the Pricing tab requires Contributor or Owner on the workspace.
    fr: Vous pouvez augmenter un niveau d'engagement à tout moment, ce qui redémarre la période d'engagement de 31 jours. Pour passer à un niveau inférieur ou revenir au paiement à l'utilisation, vous devez attendre la fin de cette période de 31 jours. Modifier le niveau dans l'onglet Pricing exige le rôle Contributor ou Owner sur l'espace de travail.
  options:
    a:
      en: A lower tier can't be selected during the 31-day commitment period.
      fr: Un niveau inférieur ne peut pas être sélectionné pendant la période d'engagement de 31 jours.
    b:
      en: Returning to pay-as-you-go is also blocked until the commitment period ends.
      fr: Le retour au paiement à l'utilisation est lui aussi bloqué jusqu'à la fin de la période d'engagement.
    d:
      en: A daily cap stops data collection when it's reached; it doesn't change the commitment tier you're billed for, and it would drop security data.
      fr: Un plafond quotidien arrête la collecte une fois atteint ; il ne change pas le niveau d'engagement facturé et ferait perdre des données de sécurité.
references:
  - title: Reduce costs for Microsoft Sentinel
    url: https://learn.microsoft.com/en-us/azure/sentinel/billing-reduce-costs
