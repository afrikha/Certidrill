id: sc200-1c-act-legacy-disconnect
objective: "1.3.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Several years ago, Adatum connected its Azure subscriptions to the Microsoft Sentinel workspace **law-adatum** by using the legacy method of the Azure Activity connector.

    You plan to reconfigure the collection by using the current Azure Activity connector, which relies on the diagnostic settings pipeline.

    What should you do first?
  fr: |
    Il y a plusieurs années, Adatum a connecté ses abonnements Azure à l'espace de travail Microsoft Sentinel **law-adatum** avec la méthode héritée du connecteur Azure Activity.

    Vous prévoyez de reconfigurer la collecte avec le connecteur Azure Activity actuel, qui s'appuie sur le pipeline des paramètres de diagnostic.

    Que devez-vous faire en premier ?
body:
  options:
    - id: a
      text: { en: "On the connector page, in the Configuration section of the Instructions tab, select Disconnect All.", fr: "Dans la page du connecteur, dans la section Configuration de l'onglet Instructions, sélectionner Disconnect All." }
    - id: b
      text: { en: "In the Log Analytics workspace, delete the AzureActivity table and its data.", fr: "Dans l'espace de travail Log Analytics, supprimer la table AzureActivity et ses données." }
    - id: c
      text: { en: "In the Azure Policy wizard of the connector, create a remediation task for existing subscriptions.", fr: "Dans l'assistant Azure Policy du connecteur, créer une tâche de correction pour les abonnements existants." }
    - id: d
      text: { en: "In each subscription, delete the activity log alert rules that target the workspace.", fr: "Dans chaque abonnement, supprimer les règles d'alerte du journal d'activité qui ciblent l'espace de travail." }
answer: { optionId: a }
explanation:
  correct:
    en: The Azure Activity connector now uses the diagnostic settings pipeline. If the legacy method is in use, you must first disconnect the existing subscriptions from it by selecting Disconnect All in the Configuration section of the connector's Instructions tab, and then set up the new connection.
    fr: Le connecteur Azure Activity utilise désormais le pipeline des paramètres de diagnostic. Si la méthode héritée est utilisée, vous devez d'abord en déconnecter les abonnements existants en sélectionnant Disconnect All dans la section Configuration de l'onglet Instructions du connecteur, puis configurer la nouvelle connexion.
  options:
    b:
      en: Deleting the table destroys the history and doesn't disconnect the legacy method.
      fr: Supprimer la table détruit l'historique et ne déconnecte pas la méthode héritée.
    c:
      en: The remediation task comes later, during the policy assignment of the new connection.
      fr: La tâche de correction intervient plus tard, lors de l'attribution de stratégie de la nouvelle connexion.
    d:
      en: Activity log alert rules aren't how the legacy connection sends data to the workspace.
      fr: Les règles d'alerte du journal d'activité ne sont pas le moyen par lequel la connexion héritée envoie des données à l'espace de travail.
references:
  - title: Connect Microsoft Sentinel to other Microsoft services by using diagnostic settings-based connections
    url: https://learn.microsoft.com/en-us/azure/sentinel/connect-services-diagnostic-setting-based
