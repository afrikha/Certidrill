id: sc200-1a-ind-exclusion-fields
objective: "1.1.4"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Proseware, Inc. uses Microsoft Defender for Endpoint Plan 2. Automated investigations repeatedly examine two known-good agents, **app1.exe** and **app2.exe**, in **C:\Agents\Proseware**. The folder also receives other files that must still be investigated, because an attacker could hide an exploit there.

    How should you configure the exclusion? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware, Inc. utilise Microsoft Defender pour point de terminaison Plan 2. Les enquêtes automatisées examinent sans cesse deux agents fiables, **app1.exe** et **app2.exe**, dans **C:\Agents\Proseware**. Le dossier reçoit aussi d'autres fichiers qui doivent toujours être examinés, car un attaquant pourrait y cacher un code malveillant exploitant une faille.

    Comment devez-vous configurer l'exclusion ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Page in the Microsoft Defender portal: [[page]]
      Field that limits the exclusion to app1.exe and app2.exe: [[field]]
      Result for the excluded files: [[result]]
    fr: |
      Page du portail Microsoft Defender : [[page]]
      Champ qui limite l'exclusion à app1.exe et app2.exe : [[field]]
      Résultat pour les fichiers exclus : [[result]]
  slots:
    - id: page
      options:
        - { id: afe, text: Automation folder exclusions }
        - { id: ind, text: Indicators }
        - { id: cdc, text: Custom data collection }
    - id: field
      options:
        - { id: names, text: { en: "File names", fr: "File names (noms de fichiers)" } }
        - { id: ext, text: { en: "Extensions", fr: "Extensions" } }
        - { id: desc, text: { en: "Description", fr: "Description" } }
    - id: result
      options:
        - { id: scanned, text: { en: "Automated investigations ignore them, and the antivirus still scans them", fr: "Les enquêtes automatisées les ignorent, et l'antivirus les analyse toujours" } }
        - { id: notscanned, text: { en: "Automated investigations and the antivirus both ignore them", fr: "Les enquêtes automatisées et l'antivirus les ignorent tous les deux" } }
        - { id: allowed, text: { en: "The files are allowed to run even if a block indicator matches them", fr: "Les fichiers peuvent s'exécuter même si un indicateur de blocage leur correspond" } }
answer:
  values: { page: afe, field: names, result: scanned }
explanation:
  correct:
    en: An automation folder exclusion requires a folder and a description, and it can be narrowed with extensions or file names. Explicitly listing the file names keeps other files in the folder under investigation, which prevents an attacker from abusing the excluded folder. The exclusion affects only automated investigation and remediation; the files are still scanned by the antivirus.
    fr: Une exclusion de dossier d'automatisation exige un dossier et une description, et elle peut être restreinte par des extensions ou des noms de fichiers. Indiquer explicitement les noms de fichiers laisse les autres fichiers du dossier soumis aux enquêtes, ce qui empêche un attaquant d'abuser du dossier exclu. L'exclusion ne concerne que l'enquête et la correction automatisées ; les fichiers sont toujours analysés par l'antivirus.
  options:
    ind: { en: "Indicators allow or block items on devices; they don't define what automated investigations skip.", fr: "Les indicateurs autorisent ou bloquent des éléments sur les appareils ; ils ne définissent pas ce que les enquêtes automatisées ignorent." }
    ext: { en: "Filtering on the .exe extension would also exclude any other executable dropped in the folder.", fr: "Filtrer sur l'extension .exe exclurait aussi tout autre exécutable déposé dans le dossier." }
    desc: { en: "The description is required but doesn't restrict which files are excluded.", fr: "La description est obligatoire mais ne restreint pas les fichiers exclus." }
    notscanned: { en: "Automation folder exclusions don't affect antivirus scanning.", fr: "Les exclusions de dossiers d'automatisation n'affectent pas l'analyse antivirus." }
references:
  - title: Configure automation folder exclusions
    url: https://learn.microsoft.com/en-us/defender-endpoint/manage-automation-folder-exclusions
