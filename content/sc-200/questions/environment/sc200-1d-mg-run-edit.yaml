id: sc200-1d-mg-run-edit
objective: "1.4.2"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    Adatum uses Microsoft Defender XDR. A custom detection rule named **Rule1** runs every 12 hours. You open the details page of Rule1 in **Hunting** > **Custom detection rules**.

    How does Rule1 behave after each action? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum utilise Microsoft Defender XDR. Une règle de détection personnalisée nommée **Rule1** s'exécute toutes les 12 heures. Vous ouvrez la page de détails de Rule1 dans **Repérage** > **Règles de détection personnalisées**.

    Comment Rule1 se comporte-t-elle après chaque action ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      When you select **Run**, Rule1 [[run]].

      When you change the frequency of Rule1 by using **Edit**, the new frequency applies [[edit]].
    fr: |
      Quand vous sélectionnez **Run**, Rule1 [[run]].

      Quand vous modifiez la fréquence de Rule1 avec **Edit**, la nouvelle fréquence s'applique [[edit]].
  slots:
    - id: run
      options:
        - { id: reset, text: { en: "runs now and resets the interval for the next scheduled run", fr: "s'exécute immédiatement et réinitialise l'intervalle jusqu'à la prochaine exécution planifiée" } }
        - { id: keep, text: { en: "runs now without changing the time of the next scheduled run", fr: "s'exécute immédiatement sans changer l'heure de la prochaine exécution planifiée" } }
        - { id: queue, text: { en: "is queued and runs at its next scheduled time", fr: "est mise en file d'attente et s'exécute à sa prochaine heure planifiée" } }
    - id: edit
      options:
        - { id: next, text: { en: "at the next scheduled run", fr: "à la prochaine exécution planifiée" } }
        - { id: toggle, text: { en: "after you turn the rule off and on again", fr: "après que vous avez désactivé puis réactivé la règle" } }
        - { id: rerun, text: { en: "after the rule reruns on the past 30 days", fr: "après une nouvelle exécution de la règle sur les 30 derniers jours" } }
answer:
  values: { run: reset, edit: next }
explanation:
  correct:
    en: Run executes the rule immediately and resets the interval, so the next scheduled run is counted from that run. Changes made with Edit, including a new frequency, are applied at the next scheduled run; the 30-day first run applies only to a newly created rule.
    fr: |
      Run exécute la règle immédiatement et réinitialise l'intervalle : la prochaine exécution planifiée est comptée à partir de cette exécution. Les modifications faites avec Edit, y compris une nouvelle fréquence, s'appliquent à la prochaine exécution planifiée ; la première exécution sur 30 jours ne concerne qu'une règle nouvellement créée.
references:
  - title: Manage existing custom detection rules
    url: https://learn.microsoft.com/en-us/defender-xdr/custom-detection-manage
  - title: Create custom detection rules in Microsoft Defender XDR
    url: https://learn.microsoft.com/en-us/defender-xdr/custom-detection-rules
