id: sc200-1c-ti-kql
objective: "1.3.6"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Adatum ingests threat intelligence into its Microsoft Sentinel workspace from the Microsoft Defender Threat Intelligence connector, a TAXII connector and the upload API.

    You need a query that returns the number of unique indicators received during the last 30 days from each source. The query must return current data.

    How should you complete the query? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum ingère du renseignement sur les menaces dans son espace de travail Microsoft Sentinel depuis le connecteur Microsoft Defender Threat Intelligence, un connecteur TAXII et l'API de chargement.

    Vous avez besoin d'une requête qui renvoie le nombre d'indicateurs uniques reçus au cours des 30 derniers jours depuis chaque source. La requête doit renvoyer des données actuelles.

    Comment devez-vous compléter la requête ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: kusto
  template: |
    [[table]]
    | where TimeGenerated > ago(30d)
    | summarize Indicators = [[agg]](Id) by [[by]]
  slots:
    - id: table
      options:
        - { id: new, text: ThreatIntelIndicators }
        - { id: legacy, text: ThreatIntelligenceIndicator }
        - { id: objects, text: ThreatIntelObjects }
        - { id: alert, text: SecurityAlert }
    - id: agg
      options:
        - { id: dcount, text: dcount }
        - { id: sum, text: sum }
        - { id: max, text: max }
        - { id: avg, text: avg }
    - id: by
      options:
        - { id: source, text: SourceSystem }
        - { id: tenant, text: TenantId }
        - { id: type, text: Type }
        - { id: rid, text: _ResourceId }
answer:
  values: { table: new, agg: dcount, by: source }
explanation:
  correct:
    en: Indicators are stored in `ThreatIntelIndicators`; Microsoft Sentinel stopped ingesting into the legacy `ThreatIntelligenceIndicator` table after July 31, 2025. Microsoft Sentinel reingests all threat intelligence every 7 to 10 days, so the same `Id` appears several times and `dcount(Id)` is needed to count unique indicators. `SourceSystem` identifies the source of each indicator.
    fr: "Les indicateurs sont stockés dans `ThreatIntelIndicators` ; Microsoft Sentinel a cessé d'alimenter la table héritée `ThreatIntelligenceIndicator` après le 31 juillet 2025. Microsoft Sentinel réingère tout le renseignement sur les menaces tous les 7 à 10 jours : le même `Id` apparaît donc plusieurs fois, et `dcount(Id)` est nécessaire pour compter les indicateurs uniques. `SourceSystem` identifie la source de chaque indicateur."
  options:
    legacy: { en: "The legacy table no longer receives data, so the query wouldn't return current data.", fr: "La table héritée ne reçoit plus de données : la requête ne renverrait pas de données actuelles." }
    objects: { en: "ThreatIntelObjects stores the other STIX objects, such as threat actors and relationships, not indicators.", fr: "ThreatIntelObjects stocke les autres objets STIX, comme les acteurs de menace et les relations, pas les indicateurs." }
    alert: { en: "SecurityAlert stores alerts, not indicators.", fr: "SecurityAlert stocke les alertes, pas les indicateurs." }
    sum: { en: "Id is a string; it can't be summed.", fr: "Id est une chaîne ; il ne peut pas être additionné." }
    tenant: { en: "TenantId identifies the workspace, which is the same for every source.", fr: "TenantId identifie l'espace de travail, identique pour toutes les sources." }
references:
  - title: Threat intelligence in Microsoft Sentinel
    url: https://learn.microsoft.com/en-us/azure/sentinel/understand-threat-intelligence
