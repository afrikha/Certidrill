id: sc200-1d-ar-ml-behavior
objective: "1.4.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Tailspin has a Microsoft Sentinel workspace that collects Windows security events and Linux Syslog data from its servers.

    You need alerts and incidents when users sign in to servers over SSH or RDP in an unusual way, based on the IP address, the geolocation and the sign-in history of each user. The SOC does not want to write or maintain detection logic.

    What should you enable?
  fr: |
    Tailspin dispose d'un espace de travail Microsoft Sentinel qui collecte les événements de sécurité Windows et les données Syslog Linux de ses serveurs.

    Vous avez besoin d'alertes et d'incidents quand des utilisateurs se connectent aux serveurs en SSH ou en RDP de manière inhabituelle, d'après l'adresse IP, la géolocalisation et l'historique de connexion de chaque utilisateur. Le SOC ne veut ni écrire ni maintenir de logique de détection.

    Que devez-vous activer ?
body:
  options:
    - { id: a, text: { en: "An ML Behavior Analytics rule", fr: "Une règle ML Behavior Analytics" } }
    - { id: b, text: { en: "A near-real-time (NRT) rule from a SigninLogs template", fr: "Une règle quasi en temps réel (NRT) à partir d'un modèle SigninLogs" } }
    - { id: c, text: { en: "An anomaly rule in Production mode", fr: "Une règle d'anomalie en mode Production" } }
    - { id: d, text: { en: "The Microsoft Defender Threat Intelligence Analytics rule", fr: "La règle Microsoft Defender Threat Intelligence Analytics" } }
answer: { optionId: a }
explanation:
  correct:
    en: ML Behavior Analytics rules (preview) use Microsoft's machine learning to detect anomalous SSH and RDP sign-in behavior from the IP address, geolocation and user history. You enable them from the templates; their logic is not customizable, so there is nothing to maintain, and they generate alerts.
    fr: Les règles ML Behavior Analytics (préversion) utilisent le Machine Learning de Microsoft pour détecter un comportement de connexion SSH et RDP anormal à partir de l'adresse IP, de la géolocalisation et de l'historique de l'utilisateur. Vous les activez depuis les modèles ; leur logique n'est pas personnalisable, il n'y a donc rien à maintenir, et elles génèrent des alertes.
  options:
    c: { en: "Anomaly rules write to the Anomalies table and do not generate alerts or incidents.", fr: "Les règles d'anomalie écrivent dans la table Anomalies et ne génèrent ni alertes ni incidents." }
    b: { en: "SigninLogs contains Microsoft Entra sign-ins, not SSH or RDP sign-ins to servers, and an NRT query is logic to maintain.", fr: "SigninLogs contient les connexions Microsoft Entra, pas les connexions SSH ou RDP aux serveurs, et une requête NRT est une logique à maintenir." }
    d: { en: "This rule matches threat indicators; it does not model the sign-in behavior of users.", fr: "Cette règle compare des indicateurs de menace ; elle ne modélise pas le comportement de connexion des utilisateurs." }
references:
  - title: Threat detection in Microsoft Sentinel
    url: https://learn.microsoft.com/en-us/azure/sentinel/detect-threats-built-in
