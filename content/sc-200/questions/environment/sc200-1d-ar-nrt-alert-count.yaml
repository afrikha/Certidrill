id: sc200-1d-ar-nrt-alert-count
objective: "1.4.3"
type: single
difficulty: 2
shuffle: false
status: draft
stem:
  en: |
    Litware has a Microsoft Sentinel workspace. You create a near-real-time (NRT) analytics rule that detects changes to privileged groups. The rule is configured to trigger an alert for each event.

    During one run, the rule query returns 45 events.

    How many alerts does the run create?
  fr: |
    Litware dispose d'un espace de travail Microsoft Sentinel. Vous créez une règle d'analytique quasi en temps réel (NRT) qui détecte les modifications des groupes privilégiés. La règle est configurée pour déclencher une alerte pour chaque événement.

    Lors d'une exécution, la requête de la règle renvoie 45 événements.

    Combien d'alertes l'exécution crée-t-elle ?
body:
  options:
    - { id: a, text: "1" }
    - { id: b, text: "29" }
    - { id: c, text: "30" }
    - { id: d, text: "45" }
answer: { optionId: c }
explanation:
  correct:
    en: An NRT rule can produce up to 30 single-event alerts per run. When the query returns more than 30 events, the rule creates alerts for the first 29 events and a 30th alert that summarizes all the remaining events.
    fr: Une règle NRT peut produire jusqu'à 30 alertes à événement unique par exécution. Quand la requête renvoie plus de 30 événements, la règle crée des alertes pour les 29 premiers événements, puis une 30e alerte qui résume tous les événements restants.
  options:
    a: { en: "A single alert is created only when the rule groups all events into one alert.", fr: "Une seule alerte n'est créée que lorsque la règle regroupe tous les événements dans une alerte." }
    b: { en: "The 29 single-event alerts are followed by a 30th summary alert.", fr: "Les 29 alertes à événement unique sont suivies d'une 30e alerte de synthèse." }
    d: { en: "NRT rules are limited to 30 alerts per run, so 45 individual alerts cannot be created.", fr: "Les règles NRT sont limitées à 30 alertes par exécution : 45 alertes individuelles ne peuvent pas être créées." }
references:
  - title: Quick threat detection with near-real-time (NRT) analytics rules in Microsoft Sentinel
    url: https://learn.microsoft.com/en-us/azure/sentinel/near-real-time-rules
