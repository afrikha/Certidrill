id: sc200-1d-ct-api-forbidden
objective: "1.3.7"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Tailspin has a Microsoft Sentinel workspace named **LAW1** that contains a DCR-based custom table named **BadgeEvents_CL**. A data collection rule named **DCR-Badge** sends data to the table through a data collection endpoint in the same region.

    Five minutes ago, you assigned the Monitoring Metrics Publisher role on DCR-Badge to a Microsoft Entra application named **BadgeApp**. BadgeApp uses the correct ingestion URI, DCR immutable ID and stream name, but its first calls to the Logs ingestion API return HTTP 403 Forbidden.

    What should you do?
  fr: |
    Tailspin dispose d'un espace de travail Microsoft Sentinel nommé **LAW1** qui contient une table personnalisée basée sur une DCR nommée **BadgeEvents_CL**. Une règle de collecte de données nommée **DCR-Badge** envoie les données vers la table par un point de terminaison de collecte de données situé dans la même région.

    Il y a cinq minutes, vous avez attribué le rôle Monitoring Metrics Publisher sur DCR-Badge à une application Microsoft Entra nommée **BadgeApp**. BadgeApp utilise l'URI d'ingestion, l'ID immuable de la DCR et le nom de flux corrects, mais ses premiers appels à l'API d'ingestion de journaux renvoient HTTP 403 Forbidden.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Assign BadgeApp the Log Analytics Contributor role on LAW1.", fr: "Attribuer à BadgeApp le rôle Log Analytics Contributor sur LAW1." } }
    - { id: b, text: { en: "Wait up to 30 minutes for the role assignment to propagate, then retry.", fr: "Attendre jusqu'à 30 minutes que l'attribution de rôle se propage, puis réessayer." } }
    - { id: c, text: { en: "Change the table plan of BadgeEvents_CL from Analytics to Basic.", fr: "Changer le plan de table de BadgeEvents_CL d'Analytics en Basic." } }
    - { id: d, text: { en: "Recreate DCR-Badge and link it to a new data collection endpoint.", fr: "Recréer DCR-Badge et l'associer à un nouveau point de terminaison de collecte de données." } }
answer: { optionId: b }
explanation:
  correct:
    en: Monitoring Metrics Publisher on the DCR is the right permission, and all the other parameters are correct. A role assignment can take up to 30 minutes to propagate; until then, the API returns 403 Forbidden, so you only need to wait and retry.
    fr: |
      Monitoring Metrics Publisher sur la DCR est la bonne autorisation, et tous les autres paramètres sont corrects. Une attribution de rôle peut mettre jusqu'à 30 minutes à se propager ; en attendant, l'API renvoie 403 Forbidden : il suffit donc d'attendre et de réessayer.
  options:
    a: { en: "Workspace roles do not grant the right to post data to a DCR; the existing assignment on the DCR is the required one.", fr: "Les rôles sur l'espace de travail n'accordent pas le droit de publier des données vers une DCR ; l'attribution existante sur la DCR est celle qui est requise." }
    c: { en: "The table plan affects cost and query features, not authorization of the ingestion call.", fr: "Le plan de table influe sur le coût et les fonctionnalités de requête, pas sur l'autorisation de l'appel d'ingestion." }
    d: { en: "A wrong DCR or endpoint gives other errors (such as 404); recreating the DCR would also remove the role assignment.", fr: "Une DCR ou un point de terminaison incorrect provoque d'autres erreurs (comme 404) ; recréer la DCR supprimerait aussi l'attribution de rôle." }
references:
  - title: "Tutorial: Send data to Azure Monitor Logs by using the Logs ingestion API (Azure portal)"
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/logs/tutorial-logs-ingestion-portal
