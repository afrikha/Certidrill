id: sc200-1b-dg-membership
objective: "1.1.9"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Tailspin Toys uses Microsoft Defender for Endpoint Plan 2 and has the following device groups.

    | Rank | Device group | Matching rule |
    | --- | --- | --- |
    | 1 | DG-Treasury | Tag equals Finance or Treasury, and OS platform equals Windows 11 |
    | 2 | DG-Windows | OS platform equals Windows 10 or Windows 11 |
    | Last | Ungrouped devices (default) | - |

    The following devices are onboarded.

    | Device | Tags | OS platform |
    | --- | --- | --- |
    | PC1 | Treasury | Windows 11 |
    | PC2 | Finance | Windows 10 |
    | MAC1 | Finance | macOS |

    To which device group does each device belong? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin Toys utilise Microsoft Defender for Endpoint Plan 2 et dispose des groupes d'appareils suivants.

    | Rang | Groupe d'appareils | Règle de correspondance |
    | --- | --- | --- |
    | 1 | DG-Treasury | Tag equals Finance or Treasury, et OS platform equals Windows 11 |
    | 2 | DG-Windows | OS platform equals Windows 10 or Windows 11 |
    | Dernier | Ungrouped devices (default) | - |

    Les appareils suivants sont intégrés.

    | Appareil | Étiquettes | Plateforme de système d'exploitation |
    | --- | --- | --- |
    | PC1 | Treasury | Windows 11 |
    | PC2 | Finance | Windows 10 |
    | MAC1 | Finance | macOS |

    À quel groupe d'appareils appartient chaque appareil ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      PC1: [[pc1]]

      PC2: [[pc2]]

      MAC1: [[mac1]]
    fr: |
      PC1 : [[pc1]]

      PC2 : [[pc2]]

      MAC1 : [[mac1]]
  slots:
    - id: pc1
      options:
        - { id: tre, text: DG-Treasury }
        - { id: win, text: DG-Windows }
        - { id: both, text: { en: "DG-Treasury and DG-Windows", fr: "DG-Treasury et DG-Windows" } }
        - { id: ung, text: Ungrouped devices }
    - id: pc2
      options:
        - { id: tre, text: DG-Treasury }
        - { id: win, text: DG-Windows }
        - { id: both, text: { en: "DG-Treasury and DG-Windows", fr: "DG-Treasury et DG-Windows" } }
        - { id: ung, text: Ungrouped devices }
    - id: mac1
      options:
        - { id: tre, text: DG-Treasury }
        - { id: win, text: DG-Windows }
        - { id: both, text: { en: "DG-Treasury and DG-Windows", fr: "DG-Treasury et DG-Windows" } }
        - { id: ung, text: Ungrouped devices }
answer:
  values: { pc1: tre, pc2: win, mac1: ung }
explanation:
  correct:
    en: |
      A device must match every condition of a rule, and several values of one property are combined with OR. PC1 matches both groups and joins only the highest-ranked one, DG-Treasury. PC2 has the Finance tag but runs Windows 10, so it fails the DG-Treasury OS condition and joins DG-Windows. MAC1 matches no rule and lands in Ungrouped devices.
    fr: |
      Un appareil doit remplir toutes les conditions d'une règle, et plusieurs valeurs d'une même propriété sont combinées avec OU. PC1 correspond aux deux groupes et ne rejoint que celui de rang le plus élevé, DG-Treasury. PC2 a l'étiquette Finance mais exécute Windows 10 : il ne remplit pas la condition de système d'exploitation de DG-Treasury et rejoint DG-Windows. MAC1 ne correspond à aucune règle et se retrouve dans Ungrouped devices.
  options:
    both: { en: "A device belongs to only one device group, the highest-ranked one it matches.", fr: "Un appareil n'appartient qu'à un seul groupe d'appareils, celui du rang le plus élevé auquel il correspond." }
references:
  - title: Create and manage device groups in Microsoft Defender for Endpoint
    url: https://learn.microsoft.com/en-us/defender-endpoint/machine-groups
