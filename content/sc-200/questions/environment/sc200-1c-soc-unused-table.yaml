id: sc200-1c-soc-unused-table
objective: "1.2.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Contoso has a Microsoft Sentinel workspace named **law-contoso-soc** that is onboarded to the Microsoft Defender portal. The workspace contains a billable DCR-based custom table named **ProxyTraffic_CL** that is eligible for the Basic logs plan.

    SOC optimization shows a data value recommendation for ProxyTraffic_CL with the following observation: the table wasn't used by analytics rules or detections in the last 30 days, but it was used by workbooks and hunting queries.

    The analysts must keep running their monthly hunting query and their workbook on the table, and no detection will be built on it. You need to reduce the cost of the table.

    What should you do?
  fr: |
    Contoso dispose d'un espace de travail Microsoft Sentinel nommé **law-contoso-soc** intégré au portail Microsoft Defender. L'espace de travail contient une table personnalisée basée sur une DCR, facturable, nommée **ProxyTraffic_CL**, éligible au plan Basic logs.

    L'optimisation SOC affiche une recommandation de valeur des données pour ProxyTraffic_CL avec l'observation suivante : la table n'a été utilisée par aucune règle d'analytique ni aucune détection au cours des 30 derniers jours, mais elle a été utilisée par des classeurs et des requêtes de chasse.

    Les analystes doivent continuer à exécuter leur requête de chasse mensuelle et leur classeur sur la table, et aucune détection ne sera créée sur cette table. Vous devez réduire le coût de la table.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Select Go to Content hub and turn on the analytics rule templates that query the table.", fr: "Sélectionner Go to Content hub et activer les modèles de règles d'analytique qui interrogent la table." }
    - id: b
      text: { en: "Select Change plan and move the table to the lower-cost plan.", fr: "Sélectionner Change plan et passer la table au plan moins coûteux." }
    - id: c
      text: { en: "Stop the ingestion of the table and remove the table from the workspace.", fr: "Arrêter l'ingestion de la table et supprimer la table de l'espace de travail." }
    - id: d
      text: { en: "Select Dismiss so that the recommendation moves to the Dismissed tab.", fr: "Sélectionner Dismiss pour que la recommandation passe dans l'onglet Dismissed." }
answer: { optionId: b }
explanation:
  correct:
    en: For a table that isn't used by detections but is used by workbooks or hunting queries, SOC optimization suggests either turning on analytics rule templates or moving the table to the Basic logs plan if it's eligible. The Change plan action lowers the ingestion cost while the data stays queryable, which matches the requirement.
    fr: "Pour une table qui n'est utilisée par aucune détection mais l'est par des classeurs ou des requêtes de chasse, l'optimisation SOC propose soit d'activer des modèles de règles d'analytique, soit de passer la table au plan Basic logs si elle est éligible. L'action Change plan réduit le coût d'ingestion tout en laissant les données interrogeables : elle répond à l'exigence."
  options:
    a:
      en: Turning on rule templates adds security value to the data, but no detection will use the table and the ingestion cost stays the same.
      fr: Activer des modèles de règles apporte de la valeur de sécurité aux données, mais aucune détection n'utilisera la table et le coût d'ingestion reste le même.
    c:
      en: This option is suggested for tables that weren't used at all; here the analysts still need to query the data.
      fr: Cette option est proposée pour les tables qui n'ont pas du tout été utilisées ; ici, les analystes ont encore besoin d'interroger les données.
    d:
      en: Dismissing a recommendation only removes it from the list; it doesn't change the table or its cost.
      fr: Ignorer une recommandation la retire seulement de la liste ; cela ne modifie ni la table ni son coût.
references:
  - title: SOC optimization reference
    url: https://learn.microsoft.com/en-us/azure/sentinel/soc-optimization/soc-optimization-reference
  - title: Optimize security operations
    url: https://learn.microsoft.com/en-us/azure/sentinel/soc-optimization/soc-optimization-access
