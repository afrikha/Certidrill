id: sc200-1d-an-builtin-change
objective: "1.4.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Fabrikam has a Microsoft Sentinel workspace. On the **Anomalies** tab of the Analytics page, you open a built-in anomaly rule and select **Edit**.

    Which change can you make to the built-in rule?
  fr: |
    Fabrikam dispose d'un espace de travail Microsoft Sentinel. Dans l'onglet **Anomalies** de la page Analytique, vous ouvrez une règle d'anomalie intégrée et sélectionnez **Edit**.

    Quelle modification pouvez-vous apporter à la règle intégrée ?
body:
  options:
    - { id: a, text: { en: "Change its threshold", fr: "Changer son seuil" } }
    - { id: b, text: { en: "Change its parameters", fr: "Changer ses paramètres" } }
    - { id: c, text: { en: "Switch its rule status between Production and Flighting", fr: "Faire basculer l'état de la règle entre Production et Flighting" } }
    - { id: d, text: { en: "Change its rule frequency", fr: "Changer la fréquence de la règle" } }
answer: { optionId: c }
explanation:
  correct:
    en: Built-in anomaly rules cannot be edited or deleted. The Edit button only lets you toggle the rule status between Production and Flighting, or send feedback to Microsoft. To change thresholds or parameters, duplicate the rule and edit the copy.
    fr: Les règles d'anomalie intégrées ne peuvent être ni modifiées ni supprimées. Le bouton Edit permet seulement de faire basculer l'état de la règle entre Production et Flighting, ou d'envoyer des commentaires à Microsoft. Pour changer les seuils ou les paramètres, dupliquez la règle et modifiez la copie.
  options:
    a: { en: "The threshold of a built-in rule is read only; change it on a customized copy.", fr: "Le seuil d'une règle intégrée est en lecture seule ; modifiez-le sur une copie personnalisée." }
    b: { en: "The parameters of a built-in rule are read only; change them on a customized copy.", fr: "Les paramètres d'une règle intégrée sont en lecture seule ; modifiez-les sur une copie personnalisée." }
    d: { en: "The rule frequency is displayed in the details pane but cannot be changed on a built-in rule.", fr: "La fréquence de la règle est affichée dans le volet de détails mais ne peut pas être modifiée sur une règle intégrée." }
references:
  - title: Work with anomaly detection analytics rules in Microsoft Sentinel
    url: https://learn.microsoft.com/en-us/azure/sentinel/work-with-anomaly-rules
