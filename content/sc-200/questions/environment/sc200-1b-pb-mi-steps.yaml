id: sc200-1b-pb-mi-steps
objective: "1.1.11"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    Proseware, Inc. uses Microsoft Sentinel. A Consumption playbook named **pb-Triage** updates the severity of incidents. Its Microsoft Sentinel connection currently uses the account of an engineer who is leaving the company.

    You need pb-Triage to authenticate with its system-assigned managed identity. The solution must follow the principle of least privilege.

    Which three actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Proseware, Inc. utilise Microsoft Sentinel. Un playbook Consumption nommé **pb-Triage** met à jour la gravité des incidents. Sa connexion Microsoft Sentinel utilise actuellement le compte d'un ingénieur qui quitte l'entreprise.

    Vous devez faire en sorte que pb-Triage s'authentifie avec son identité managée affectée par le système. La solution doit respecter le principe du moindre privilège.

    Quelles sont les trois actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - { id: enable, text: { en: "Turn on the system-assigned identity of the pb-Triage logic app.", fr: "Activer l'identité affectée par le système de l'application logique pb-Triage." } }
    - { id: role, text: { en: "On the workspace, assign Microsoft Sentinel Responder to the pb-Triage logic app.", fr: "Sur l'espace de travail, attribuer Microsoft Sentinel Responder à l'application logique pb-Triage." } }
    - { id: conn, text: { en: "In the designer, select Change connection > Add new > Connect with managed identity.", fr: "Dans le concepteur, sélectionner Change connection > Add new > Connect with managed identity." } }
    - { id: auto, text: { en: "On RG-Playbooks, assign Microsoft Sentinel Automation Contributor to the pb-Triage logic app.", fr: "Sur RG-Playbooks, attribuer Microsoft Sentinel Automation Contributor à l'application logique pb-Triage." } }
    - { id: reader, text: { en: "On the workspace, assign Microsoft Sentinel Reader to the pb-Triage logic app.", fr: "Sur l'espace de travail, attribuer Microsoft Sentinel Reader à l'application logique pb-Triage." } }
    - { id: spn, text: { en: "Register an application in Microsoft Entra ID and create a client secret.", fr: "Inscrire une application dans Microsoft Entra ID et créer une clé secrète client." } }
answer:
  sequence: [ enable, role, conn ]
explanation:
  correct:
    en: |
      The identity must exist before it can receive a role, so you first enable the logic app's system-assigned identity, then grant it a Microsoft Sentinel role on the workspace, and finally create a connection that uses the managed identity. Updating incidents is a write action, so the least privileged role is Microsoft Sentinel Responder.
    fr: |
      L'identité doit exister avant de recevoir un rôle : vous activez d'abord l'identité affectée par le système de l'application logique, puis vous lui accordez un rôle Microsoft Sentinel sur l'espace de travail, et enfin vous créez une connexion qui utilise l'identité managée. La mise à jour d'incidents est une action d'écriture : le rôle du moindre privilège est Microsoft Sentinel Responder.
  options:
    reader: { en: "Reader allows triggers and read actions only; updating severity is a write action.", fr: "Reader ne permet que les déclencheurs et les actions de lecture ; la mise à jour de la gravité est une action d'écriture." }
    auto: { en: "Automation Contributor is for the Microsoft Sentinel service account so that automation rules can run playbooks.", fr: "Automation Contributor est destiné au compte de service Microsoft Sentinel pour que les règles d'automatisation puissent exécuter des playbooks." }
    spn: { en: "A registered application is the service principal method, which needs a secret.", fr: "Une application inscrite correspond à la méthode du principal de service, qui exige un secret." }
references:
  - title: Authenticate playbooks to Microsoft Sentinel
    url: https://learn.microsoft.com/en-us/azure/sentinel/automation/authenticate-playbooks-to-sentinel
