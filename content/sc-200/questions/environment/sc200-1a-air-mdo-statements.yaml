id: sc200-1a-air-mdo-statements
objective: "1.1.7"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    Litware, Inc. uses Microsoft Defender XDR and Microsoft Defender for Endpoint. The company plans to use automated investigation and response (AIR) for email threats, such as messages that users report as phishing.

    Which two statements about AIR in Microsoft Defender for Office 365 are true?

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware, Inc. utilise Microsoft Defender XDR et Microsoft Defender pour point de terminaison. L'entreprise prévoit d'utiliser l'enquête et la réponse automatisées (AIR) pour les menaces de messagerie, comme les messages que les utilisateurs signalent comme hameçonnage.

    Quelles sont les deux affirmations vraies sur AIR dans Microsoft Defender pour Office 365 ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "AIR requires Microsoft Defender for Office 365 Plan 2.", fr: "AIR exige Microsoft Defender pour Office 365 Plan 2." } }
    - { id: b, text: { en: "Email remediation actions run according to the automation level of the device group.", fr: "Les actions de correction d'e-mails s'exécutent selon le niveau d'automatisation du groupe d'appareils." } }
    - { id: c, text: { en: "AIR for email stopped running on September 1, 2026.", fr: "AIR pour la messagerie a cessé de fonctionner le 1er septembre 2026." } }
    - { id: d, text: { en: "Most remediation actions wait for approval by the security operations team.", fr: "La plupart des actions de correction attendent l'approbation de l'équipe des opérations de sécurité." } }
    - { id: e, text: { en: "AIR still starts when the default alert policies that trigger it are disabled.", fr: "AIR démarre toujours lorsque les stratégies d'alerte par défaut qui le déclenchent sont désactivées." } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: AIR for email requires Defender for Office 365 Plan 2, included in subscriptions such as Microsoft 365 E5 or available as an add-on. AIR queues its remediation actions for approval by SecOps, in the investigation, the incident or the Action center; the exception is malicious similarity clusters, whose actions are approved automatically.
    fr: AIR pour la messagerie exige Defender pour Office 365 Plan 2, inclus dans des abonnements comme Microsoft 365 E5 ou disponible en module complémentaire. AIR met ses actions de correction en attente d'approbation par l'équipe SecOps, dans l'enquête, l'incident ou le centre de notifications ; l'exception concerne les clusters de similarité malveillants, dont les actions sont approuvées automatiquement.
  options:
    b: { en: "Automation levels belong to Defender for Endpoint device groups; they don't apply to email remediation.", fr: "Les niveaux d'automatisation appartiennent aux groupes d'appareils de Defender pour point de terminaison ; ils ne s'appliquent pas à la correction des e-mails." }
    c: { en: "The September 2026 change applies only to Defender for Endpoint; AIR for Defender for Office 365 remains available.", fr: "Le changement de septembre 2026 ne concerne que Defender pour point de terminaison ; AIR pour Defender pour Office 365 reste disponible." }
    e: { en: "AIR isn't triggered when these alert policies are disabled or replaced by custom alerts.", fr: "AIR n'est pas déclenché lorsque ces stratégies d'alerte sont désactivées ou remplacées par des alertes personnalisées." }
references:
  - title: Automated investigation and response in Microsoft Defender for Office 365
    url: https://learn.microsoft.com/en-us/defender-office-365/air-about
  - title: View and manage actions in the Action center
    url: https://learn.microsoft.com/en-us/defender-xdr/m365d-autoir-actions
