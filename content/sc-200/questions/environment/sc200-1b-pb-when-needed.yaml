id: sc200-1b-pb-when-needed
objective: "1.1.11"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    Tailspin Toys uses Microsoft Sentinel. The SOC manager lists five tasks that must run automatically when an incident is created. You want to create playbooks only where an automation rule action can't do the job.

    For which two tasks must you create a playbook?

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin Toys utilise Microsoft Sentinel. Le responsable du SOC liste cinq tâches qui doivent s'exécuter automatiquement à la création d'un incident. Vous ne voulez créer des playbooks que lorsqu'une action de règle d'automatisation ne peut pas faire le travail.

    Pour quelles deux tâches devez-vous créer un playbook ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Raise the severity of incidents that involve a domain admin account", fr: "Augmenter la gravité des incidents qui impliquent un compte d'administrateur de domaine" } }
    - { id: b, text: { en: "Post the incident title and severity in a Microsoft Teams channel", fr: "Publier le titre et la gravité de l'incident dans un canal Microsoft Teams" } }
    - { id: c, text: { en: "Add the tag Ransomware to incidents from a specific analytics rule", fr: "Ajouter l'étiquette Ransomware aux incidents d'une règle d'analyse précise" } }
    - { id: d, text: { en: "Create a ticket in ServiceNow and keep its status synchronized with the incident", fr: "Créer un ticket dans ServiceNow et garder son statut synchronisé avec l'incident" } }
    - { id: e, text: { en: "Add a checklist of triage steps to every incident", fr: "Ajouter une liste de vérification des étapes de tri à chaque incident" } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |
      Notifying Teams and creating or synchronizing ServiceNow tickets need connectors to external systems, so they require a playbook (a Logic Apps workflow) started by an automation rule. Changing severity, adding tags and adding incident tasks are built-in automation rule actions.
    fr: |
      Notifier Teams et créer ou synchroniser des tickets ServiceNow exigent des connecteurs vers des systèmes externes : il faut un playbook (un workflow Logic Apps) lancé par une règle d'automatisation. Changer la gravité, ajouter des étiquettes et ajouter des tâches d'incident sont des actions intégrées des règles d'automatisation.
  options:
    a: { en: "Change severity is a built-in action, with an entity condition on the account.", fr: "Change severity est une action intégrée, avec une condition d'entité sur le compte." }
    c: { en: "Add tags is a built-in action, with a condition on the analytics rule name.", fr: "Add tags est une action intégrée, avec une condition sur le nom de la règle d'analyse." }
    e: { en: "Add task is a built-in action that adds incident tasks.", fr: "Add task est une action intégrée qui ajoute des tâches d'incident." }
references:
  - title: Automate Threat Response with Playbooks in Microsoft Sentinel
    url: https://learn.microsoft.com/en-us/azure/sentinel/automation/automate-responses-with-playbooks
  - title: Automate threat response in Microsoft Sentinel with automation rules
    url: https://learn.microsoft.com/en-us/azure/sentinel/automate-incident-handling-with-automation-rules
