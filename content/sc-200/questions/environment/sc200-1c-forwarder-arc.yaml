id: sc200-1c-forwarder-arc
objective: "1.3.4"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam plans to use an on-premises Ubuntu virtual machine named **LNX-FWD3** as the log forwarder for the Syslog via AMA connector. LNX-FWD3 runs rsyslog and has Python 3 installed. The Syslog solution is installed in the Microsoft Sentinel workspace **law-fabrikam**.

    You will create the data collection rule from the Syslog via AMA connector page.

    Which two other actions should you perform on LNX-FWD3? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam prévoit d'utiliser une machine virtuelle Ubuntu locale nommée **LNX-FWD3** comme redirecteur de journaux pour le connecteur Syslog via AMA. LNX-FWD3 exécute rsyslog et Python 3 y est installé. La solution Syslog est installée dans l'espace de travail Microsoft Sentinel **law-fabrikam**.

    Vous allez créer la règle de collecte de données depuis la page du connecteur Syslog via AMA.

    Quelles sont les deux autres actions à effectuer sur LNX-FWD3 ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Install the Azure Arc Connected Machine agent before you create the rule.", fr: "Installer l'agent Azure Arc Connected Machine avant de créer la règle." } }
    - { id: b, text: { en: "Install the Windows Event Collector service after the rule is created.", fr: "Installer le service Collecteur d'événements Windows une fois la règle créée." } }
    - { id: c, text: { en: "Install the Log Analytics agent for Linux before you create the rule.", fr: "Installer l'agent Log Analytics pour Linux avant de créer la règle." } }
    - { id: d, text: { en: "Open inbound TCP port 28330 on the perimeter firewall for the devices.", fr: "Ouvrir le port TCP 28330 entrant sur le pare-feu périmétrique pour les équipements." } }
    - { id: e, text: { en: "Run the Forwarder_AMA_installer.py script after the rule is created.", fr: "Exécuter le script Forwarder_AMA_installer.py une fois la règle créée." } }
answer: { optionIds: [ a, e ] }
explanation:
  correct:
    en: A log forwarder that isn't an Azure VM must have the Azure Arc Connected Machine agent; otherwise it doesn't appear on the Resources tab of the rule. After the rule is created and the Azure Monitor Agent is installed, the installation script configures rsyslog to listen on port 514 (TCP and UDP) and restarts the daemon.
    fr: Un redirecteur de journaux qui n'est pas une machine virtuelle Azure doit disposer de l'agent Azure Arc Connected Machine ; sinon, il n'apparaît pas dans l'onglet Resources de la règle. Une fois la règle créée et l'agent Azure Monitor installé, le script d'installation configure rsyslog pour écouter sur le port 514 (TCP et UDP) et redémarre le démon.
  options:
    c:
      en: The Log Analytics agent is retired; the connector installs the Azure Monitor Agent.
      fr: L'agent Log Analytics est retiré ; le connecteur installe l'agent Azure Monitor.
    d:
      en: Port 28330 is used locally between rsyslog and the agent; devices send to port 514.
      fr: Le port 28330 sert en local entre rsyslog et l'agent ; les équipements envoient vers le port 514.
    b:
      en: The Windows Event Collector is a Windows component for Windows Event Forwarding.
      fr: Le collecteur d'événements Windows est un composant Windows du transfert d'événements Windows.
references:
  - title: Ingest syslog and CEF messages to Microsoft Sentinel - AMA
    url: https://learn.microsoft.com/en-us/azure/sentinel/connect-cef-syslog-ama
