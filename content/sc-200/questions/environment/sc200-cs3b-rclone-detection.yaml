id: sc200-cs3b-rclone-detection
objective: "1.4.1"
type: dropdown
caseStudy: sc200-cs3b-humongous-insurance
difficulty: 2
status: draft
stem:
  en: |
    You write an advanced hunting query that searches the DeviceProcessEvents table for rclone.exe. The query uses only where and project operators. You plan to create a custom detection rule from the query, scoped to DG-Claims.

    You need to configure the rule to meet the exfiltration tool requirement.

    How should you complete the configuration? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous écrivez une requête de repérage avancé qui recherche rclone.exe dans la table DeviceProcessEvents. La requête n'utilise que les opérateurs where et project. Vous prévoyez de créer à partir de cette requête une règle de détection personnalisée limitée à DG-Claims.

    Vous devez configurer la règle pour respecter l'exigence relative à l'outil d'exfiltration.

    Comment devez-vous compléter la configuration ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Frequency: [[freq]]
      Columns that the query must return in addition to Timestamp: [[cols]]
      Automated action on devices: [[act]]
    fr: |
      Fréquence : [[freq]]
      Colonnes que la requête doit renvoyer en plus de Timestamp : [[cols]]
      Action automatisée sur les appareils : [[act]]
  slots:
    - id: freq
      options:
        - { id: hour, text: { en: "Every hour", fr: "Toutes les heures (Every hour)" } }
        - { id: nrt, text: "Continuous (NRT)" }
        - { id: three, text: { en: "Every 3 hours", fr: "Toutes les 3 heures (Every 3 hours)" } }
        - { id: day, text: { en: "Every 24 hours", fr: "Toutes les 24 heures (Every 24 hours)" } }
    - id: cols
      options:
        - { id: name, text: { en: "DeviceName and AccountName", fr: "DeviceName et AccountName" } }
        - { id: report, text: { en: "ReportId only", fr: "ReportId uniquement" } }
        - { id: id, text: { en: "DeviceId and ReportId", fr: "DeviceId et ReportId" } }
        - { id: hash, text: { en: "SHA256 and FileName", fr: "SHA256 et FileName" } }
    - id: act
      options:
        - { id: restrict, text: Restrict app execution }
        - { id: package, text: Collect investigation package }
        - { id: scan, text: Run antivirus scan }
        - { id: isolate, text: Isolate device }
answer:
  values: { freq: nrt, cols: id, act: isolate }
explanation:
  correct:
    en: |
      DeviceProcessEvents supports the Continuous (NRT) frequency, and a query that uses only where and project is compatible with it, so alerts are raised within minutes. Rules based on Defender for Endpoint tables must return DeviceId and ReportId so that device group scoping and the process tree work. Isolate device cuts the device off the network while keeping its connection to the Defender for Endpoint service.
    fr: |
      DeviceProcessEvents prend en charge la fréquence Continuous (NRT), et une requête qui n'utilise que where et project est compatible avec elle : les alertes sont générées en quelques minutes. Les règles fondées sur les tables de Defender pour point de terminaison doivent renvoyer DeviceId et ReportId pour que la limitation aux groupes d'appareils et l'arborescence des processus fonctionnent. Isolate device coupe l'appareil du réseau tout en conservant sa connexion au service Defender pour point de terminaison.
  options:
    hour: { en: "An hourly rule can raise the alert up to an hour after the event, not within minutes.", fr: "Une règle horaire peut générer l'alerte jusqu'à une heure après l'événement, pas en quelques minutes." }
    name: { en: "DeviceName and AccountName help map entities, but DeviceId and ReportId are required for device group scoping.", fr: "DeviceName et AccountName aident à mapper les entités, mais DeviceId et ReportId sont requis pour la limitation aux groupes d'appareils." }
    report: { en: "ReportId alone is enough for non-device tables only; Defender for Endpoint tables also need DeviceId.", fr: "ReportId seul ne suffit que pour les tables qui ne concernent pas les appareils ; les tables de Defender pour point de terminaison demandent aussi DeviceId." }
    restrict: { en: "Restrict app execution allows only Microsoft-signed files to run; it does not cut the device off the network.", fr: "Restrict app execution n'autorise que les fichiers signés par Microsoft ; elle ne coupe pas l'appareil du réseau." }
    package: { en: "An investigation package collects forensic data and leaves the device connected.", fr: "Un package d'investigation collecte des données d'analyse et laisse l'appareil connecté." }
references:
  - title: Create custom detection rules in Microsoft Defender XDR
    url: https://learn.microsoft.com/en-us/defender-xdr/custom-detection-rules
  - title: Take response actions on a device in Microsoft Defender for Endpoint
    url: https://learn.microsoft.com/en-us/defender-endpoint/respond-machine-alerts
