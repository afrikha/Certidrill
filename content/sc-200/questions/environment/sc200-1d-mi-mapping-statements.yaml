id: sc200-1d-mi-mapping-statements
objective: "1.4.4"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove has a Microsoft Sentinel workspace. The SOC maps its analytics rules and hunting queries to MITRE ATT&CK techniques and reviews the MITRE ATT&CK page every month.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove dispose d'un espace de travail Microsoft Sentinel. Le SOC mappe ses règles d'analytique et ses requêtes de chasse à des techniques MITRE ATT&CK et consulte la page MITRE ATT&CK chaque mois.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: A technique that is mapped only to hunting queries is counted as an active detection in the Current coverage view.
        fr: Une technique mappée uniquement à des requêtes de chasse est comptée comme détection active dans la vue Current coverage.
    - id: s2
      text:
        en: An incident created from the alerts of a rule mapped to T1566 includes the T1566 technique.
        fr: Un incident créé à partir des alertes d'une règle mappée à T1566 inclut la technique T1566.
    - id: s3
      text:
        en: A bookmark created from hunting query results can use a technique mapping that differs from the mapping of the query.
        fr: Un signet créé à partir des résultats d'une requête de chasse peut utiliser un mappage de technique différent de celui de la requête.
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: The Current coverage view counts the active scheduled and NRT rules; hunting queries appear only as linked items in the technique details. Techniques set on a rule are added to the incidents created from its alerts. A bookmark either inherits the technique mapping of its hunting query or uses a custom mapping.
    fr: La vue Current coverage compte les règles planifiées et NRT actives ; les requêtes de chasse n'apparaissent que comme éléments liés dans les détails de la technique. Les techniques définies sur une règle sont ajoutées aux incidents créés à partir de ses alertes. Un signet hérite du mappage de technique de sa requête de chasse ou utilise un mappage personnalisé.
  options:
    s1: { en: "Hunting queries are not detections; the coverage counts active scheduled and NRT rules.", fr: "Les requêtes de chasse ne sont pas des détections ; la couverture compte les règles planifiées et NRT actives." }
references:
  - title: View MITRE ATT&CK framework coverage in Microsoft Sentinel
    url: https://learn.microsoft.com/en-us/azure/sentinel/mitre-coverage
