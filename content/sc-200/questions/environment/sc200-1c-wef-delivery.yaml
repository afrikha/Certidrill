id: sc200-1c-wef-delivery
objective: "1.3.3"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Contoso creates three Windows Event Forwarding subscriptions on its Windows Event Collector. The events are then collected into Microsoft Sentinel by the Windows Forwarded Events connector.

    Which delivery optimization option should you configure for each subscription? To answer, drag the appropriate options to the correct subscriptions. Each option may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso crée trois abonnements de transfert d'événements Windows sur son collecteur d'événements Windows. Les événements sont ensuite collectés dans Microsoft Sentinel par le connecteur Windows Forwarded Events.

    Quelle option d'optimisation de la remise devez-vous configurer pour chaque abonnement ? Pour répondre, faites glisser les options appropriées vers les abonnements correspondants. Chaque option peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: normal, text: Normal }
    - { id: bandwidth, text: Minimize bandwidth }
    - { id: latency, text: Minimize latency }
    - { id: custom, text: { en: "Custom (configured with Wecutil)", fr: "Custom (configuré avec Wecutil)" } }
  targets:
    - id: t1
      text: { en: "Critical events of domain controllers that must reach the collector within about 30 seconds", fr: "Événements critiques des contrôleurs de domaine qui doivent atteindre le collecteur en 30 secondes environ" } 
    - id: t2
      text: { en: "Baseline events of branch office devices on a slow WAN link, where a delay of several hours is acceptable", fr: "Événements de base des appareils d'agences sur une liaison WAN lente, où un délai de plusieurs heures est acceptable" }
    - id: t3
      text: { en: "Events of a few servers under investigation that must be delivered one at a time within 10 seconds", fr: "Événements de quelques serveurs sous enquête qui doivent être remis un par un en moins de 10 secondes" }
answer:
  mapping: { t1: latency, t2: bandwidth, t3: custom }
explanation:
  correct:
    en: Minimize latency pushes events with a 30-second batch timeout, for alerts and critical events. Minimize bandwidth pushes with a 6-hour batch timeout and heartbeat. Values that no predefined option offers, such as one item per batch and a 10-second latency, require the Custom mode, which you can set only with Wecutil (`/cm:Custom`, `/dmi:1`, `/dmlt:10`). Normal pulls batches of 5 items with a 15-minute timeout.
    fr: Minimize latency pousse les événements avec un délai de lot de 30 secondes, pour les alertes et les événements critiques. Minimize bandwidth pousse avec un délai de lot et une pulsation de 6 heures. Les valeurs qu'aucune option prédéfinie ne propose, comme un élément par lot et une latence de 10 secondes, exigent le mode Custom, configurable uniquement avec Wecutil (`/cm:Custom`, `/dmi:1`, `/dmlt:10`). Normal tire des lots de 5 éléments avec un délai de 15 minutes.
references:
  - title: Use Windows Event Forwarding to help with intrusion detection
    url: https://learn.microsoft.com/en-us/windows/security/operating-system-security/device-management/use-windows-event-forwarding-to-assist-in-intrusion-detection
