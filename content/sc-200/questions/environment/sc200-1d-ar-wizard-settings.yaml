id: sc200-1d-ar-wizard-settings
objective: "1.4.3"
type: hotarea
difficulty: 2
status: draft
stem:
  en: |
    Northwind has a Microsoft Sentinel workspace. You are creating a scheduled analytics rule that runs every hour and detects outbound connections to rare destinations. The following table lists settings of the analytics rule wizard.

    Which setting should you configure for each requirement? Answer each prompt by selecting the appropriate setting.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind dispose d'un espace de travail Microsoft Sentinel. Vous créez une règle d'analytique planifiée qui s'exécute toutes les heures et détecte les connexions sortantes vers des destinations rares. Le tableau suivant liste des paramètres de l'assistant de règle d'analytique.

    Quel paramètre devez-vous configurer pour chaque exigence ? Répondez à chaque consigne en sélectionnant le paramètre approprié.

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
    - id: p1
      text: { en: "Generate an alert only when a run returns more than 10 results", fr: "Ne générer une alerte que lorsqu'une exécution renvoie plus de 10 résultats" }
    - id: p2
      text: { en: "Stop running the query for 6 hours after an alert is generated", fr: "Arrêter l'exécution de la requête pendant 6 heures après la génération d'une alerte" }
  grid:
    header: [{ en: "Wizard tab", fr: "Onglet de l'assistant" }, { en: "Setting", fr: "Paramètre" }]
    rows:
      - [{ text: { en: "General", fr: "Général" } }, { text: { en: "Severity", fr: "Gravité" }, area: sev }]
      - [{ text: { en: "Set rule logic", fr: "Définir la logique de la règle" } }, { text: { en: "Entity mapping", fr: "Mappage d'entités" }, area: ent }]
      - [{ text: { en: "Set rule logic", fr: "Définir la logique de la règle" } }, { text: { en: "Alert threshold", fr: "Seuil d'alerte" }, area: thr }]
      - [{ text: { en: "Set rule logic", fr: "Définir la logique de la règle" } }, { text: { en: "Event grouping", fr: "Regroupement d'événements" }, area: evg }]
      - [{ text: { en: "Set rule logic", fr: "Définir la logique de la règle" } }, { text: { en: "Suppression", fr: "Suppression" }, area: sup }]
      - [{ text: { en: "Incident settings", fr: "Paramètres d'incident" } }, { text: { en: "Alert grouping", fr: "Regroupement d'alertes" }, area: alg }]
answer:
  values: { p1: thr, p2: sup }
explanation:
  correct:
    en: The alert threshold sets the number of query results needed to trigger an alert (here, is greater than 10), evaluated separately at each run. Suppression (Stop running query after alert is generated) stops the rule for a period of up to 24 hours, here 6 hours.
    fr: Le seuil d'alerte définit le nombre de résultats de requête nécessaires pour déclencher une alerte (ici, est supérieur à 10), évalué séparément à chaque exécution. La suppression (arrêter l'exécution de la requête après la génération d'une alerte) arrête la règle pendant une période de 24 heures au maximum, ici 6 heures.
references:
  - title: Scheduled analytics rules in Microsoft Sentinel
    url: https://learn.microsoft.com/en-us/azure/sentinel/scheduled-rules-overview
