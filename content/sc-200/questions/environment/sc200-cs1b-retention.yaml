id: sc200-cs1b-retention
objective: "1.2.2"
type: dropdown
caseStudy: sc200-cs1b-city-power-light
difficulty: 2
status: draft
shuffle: false
stem:
  en: |
    You need to configure the tables in LAW-CPL to meet the retention requirement.

    How should you complete the configuration? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez configurer les tables de LAW-CPL pour respecter l'exigence de rétention.

    Comment devez-vous compléter la configuration ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Syslog table: set the analytics retention to [[syslogA]] and the total retention to [[syslogT]].

      CommonSecurityLog table: store the data in [[fwTier]].
    fr: |
      Table Syslog : définir la rétention Analytics sur [[syslogA]] et la rétention totale sur [[syslogT]].

      Table CommonSecurityLog : stocker les données dans [[fwTier]].
  slots:
    - id: syslogA
      options:
        - { id: d90, text: { en: "90 days", fr: "90 jours" } }
        - { id: y1, text: { en: "1 year", fr: "1 an" } }
        - { id: y2, text: { en: "2 years", fr: "2 ans" } }
        - { id: y7, text: { en: "7 years", fr: "7 ans" } }
    - id: syslogT
      options:
        - { id: y1, text: { en: "1 year", fr: "1 an" } }
        - { id: y2, text: { en: "2 years", fr: "2 ans" } }
        - { id: y7, text: { en: "7 years", fr: "7 ans" } }
        - { id: y12, text: { en: "12 years", fr: "12 ans" } }
    - id: fwTier
      options:
        - { id: analytics, text: { en: "the analytics tier, with 2 years of analytics retention", fr: "le niveau Analytics, avec 2 ans de rétention Analytics" } }
        - { id: lake, text: { en: "the data lake tier only, with 2 years of total retention", fr: "le niveau Data Lake uniquement, avec 2 ans de rétention totale" } }
        - { id: xdr, text: { en: "the XDR default tier, with 2 years of retention", fr: "le niveau XDR par défaut, avec 2 ans de rétention" } }
answer:
  values: { syslogA: y1, syslogT: y7, fwTier: lake }
explanation:
  correct:
    en: "Analytics rules and hunting queries work only on analytics tier data, so the Syslog table needs one year of analytics retention (the maximum is two years). The total retention, which keeps the data in the data lake after the analytics period, can be extended up to 12 years, so you set it to seven years. The firewall logs are high-volume and only used for occasional investigations, so the data lake tier gives the lowest ingestion and storage cost; analysts can still query it with KQL jobs."
    fr: "Les règles d'analytique et les requêtes de chasse ne fonctionnent que sur les données du niveau Analytics : la table Syslog a besoin d'un an de rétention Analytics (le maximum est de deux ans). La rétention totale, qui conserve les données dans le data lake après la période Analytics, peut être portée à 12 ans : vous la définissez sur sept ans. Les journaux des pare-feu sont volumineux et ne servent qu'à des enquêtes ponctuelles : le niveau Data Lake offre le coût d'ingestion et de stockage le plus bas, et les analystes peuvent toujours l'interroger avec des tâches KQL."
  options:
    d90: { en: "90 days of analytics retention would make the OT logs unavailable to analytics rules and hunting after three months.", fr: "90 jours de rétention Analytics rendraient les journaux OT inaccessibles aux règles d'analytique et à la chasse au bout de trois mois." }
    y7: { en: "Analytics retention can be extended to two years at most; long-term retention beyond that is the total retention.", fr: "La rétention Analytics peut être étendue à deux ans au maximum ; au-delà, la conservation à long terme relève de la rétention totale." }
    analytics: { en: "Keeping 600 GB per day in the analytics tier for two years costs far more than the data lake tier, and the firewall logs do not need real-time analytics.", fr: "Conserver 600 Go par jour au niveau Analytics pendant deux ans coûte bien plus cher que le niveau Data Lake, et les journaux des pare-feu n'ont pas besoin d'analytique en temps réel." }
    xdr: { en: "The XDR default tier holds the Defender XDR threat hunting tables for 30 days; it does not store CommonSecurityLog data.", fr: "Le niveau XDR par défaut conserve les tables de chasse de Defender XDR pendant 30 jours ; il ne stocke pas les données de CommonSecurityLog." }
references:
  - title: Manage data tiers and retention in Microsoft Sentinel
    url: https://learn.microsoft.com/en-us/azure/sentinel/manage-data-overview
