id: sc200-1a-restrict-correlation
objective: "1.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Adatum Corporation has two local SOC teams, one in Europe and one in Asia. Microsoft Defender for Endpoint uses RBAC, and each team manages only its device group, **EU-Devices** or **APAC-Devices**.

    The local teams report that some incidents combine alerts from both device groups. You need to make sure that future incidents contain only alerts from devices in the same device group.

    What should you do?
  fr: |
    Adatum Corporation dispose de deux équipes SOC locales, l'une en Europe et l'autre en Asie. Microsoft Defender pour point de terminaison utilise RBAC, et chaque équipe ne gère que son groupe d'appareils, **EU-Devices** ou **APAC-Devices**.

    Les équipes locales signalent que certains incidents combinent des alertes des deux groupes d'appareils. Vous devez faire en sorte que les futurs incidents ne contiennent que des alertes d'appareils du même groupe d'appareils.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Turn on the Restrict correlation to within scoped device groups advanced feature.", fr: "Activer la fonctionnalité avancée Restrict correlation to within scoped device groups." }
    - id: b
      text: { en: "Create an alert tuning rule for each device group that resolves the other group's alerts.", fr: "Créer pour chaque groupe d'appareils une règle de réglage des alertes qui résout les alertes de l'autre groupe." }
    - id: c
      text: { en: "Create an incident notification rule for each device group with the matching scope.", fr: "Créer pour chaque groupe d'appareils une règle de notification d'incident avec l'étendue correspondante." }
    - id: d
      text: { en: "Turn on the Hide potential duplicate device records advanced feature.", fr: "Activer la fonctionnalité avancée Hide potential duplicate device records." }
answer: { optionId: a }
explanation:
  correct:
    en: "**Restrict correlation to within scoped device groups** limits alert correlation to the device groups that a local SOC can access, so incidents no longer mix devices from different groups. It affects only future correlations, and Microsoft recommends it only when this need outweighs the benefit of cross-organization correlation."
    fr: "**Restrict correlation to within scoped device groups** limite la corrélation des alertes aux groupes d'appareils auxquels un SOC local peut accéder : les incidents ne mélangent plus d'appareils de groupes différents. Ce paramètre ne s'applique qu'aux corrélations futures, et Microsoft ne le recommande que si ce besoin l'emporte sur l'intérêt de la corrélation à l'échelle de l'organisation."
  options:
    b:
      en: Resolving the other group's alerts would hide real detections from the team that owns those devices, and it does not change how alerts are correlated.
      fr: Résoudre les alertes de l'autre groupe masquerait de vraies détections à l'équipe propriétaire de ces appareils, et cela ne change pas la façon dont les alertes sont corrélées.
    c:
      en: Notification rules only decide who receives emails; they do not change which alerts are grouped into an incident.
      fr: Les règles de notification décident seulement qui reçoit des e-mails ; elles ne changent pas les alertes regroupées dans un incident.
    d:
      en: This feature hides duplicate device records from the device inventory; it has no effect on alert correlation.
      fr: Cette fonctionnalité masque les enregistrements d'appareils en double de l'inventaire des appareils ; elle n'a aucun effet sur la corrélation des alertes.
references:
  - title: Configure Advanced Features in Microsoft Defender for Endpoint
    url: https://learn.microsoft.com/en-us/defender-endpoint/advanced-features
  - title: Alert correlation and incident merging in the Microsoft Defender portal
    url: https://learn.microsoft.com/en-us/defender-xdr/alerts-incidents-correlation
