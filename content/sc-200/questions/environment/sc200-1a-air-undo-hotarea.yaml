id: sc200-1a-air-undo-hotarea
objective: "1.1.7"
type: hotarea
difficulty: 2
status: draft
stem:
  en: |
    Contoso, Ltd. uses Microsoft Defender XDR and Microsoft Defender for Endpoint Plan 2. An automated investigation on a device named **WS-112** turned out to be a false positive. The **History** tab of the Action center shows the following completed actions.

    Answer each prompt by selecting the action that you should undo.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso, Ltd. utilise Microsoft Defender XDR et Microsoft Defender pour point de terminaison Plan 2. Une enquête automatisée sur un appareil nommé **WS-112** s'est révélée être un faux positif. L'onglet **History** du centre de notifications affiche les actions terminées suivantes.

    Répondez à chaque consigne en sélectionnant l'action que vous devez annuler.

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
    - id: p1
      text: { en: "WS-112 must be able to communicate on the network again.", fr: "WS-112 doit pouvoir à nouveau communiquer sur le réseau." }
    - id: p2
      text: { en: "The file invoice-tool.exe must be restored on WS-112.", fr: "Le fichier invoice-tool.exe doit être restauré sur WS-112." }
  grid:
    header: [{ en: "Action", fr: "Action" }, { en: "Entity", fr: "Entité" }, { en: "Status", fr: "Statut" }]
    rows:
      - [{ text: Run antivirus scan, area: scan }, { text: WS-112 }, { text: Completed }]
      - [{ text: Quarantine file, area: quar }, { text: invoice-tool.exe }, { text: Completed }]
      - [{ text: Remove scheduled task, area: task }, { text: InvoiceSync }, { text: Completed }]
      - [{ text: Collect investigation package, area: pkg }, { text: WS-112 }, { text: Completed }]
      - [{ text: Isolate device, area: iso }, { text: WS-112 }, { text: Completed }]
answer:
  values: { p1: iso, p2: quar }
explanation:
  correct:
    en: On the History tab, you can undo remediation actions such as isolate device, contain device, restrict code execution, quarantine a file, remove a registry key, stop a service, disable a driver and remove a scheduled task. Undoing **Isolate device** reconnects WS-112 to the network, and undoing **Quarantine file** restores invoice-tool.exe.
    fr: Dans l'onglet History, vous pouvez annuler des actions de correction comme l'isolement ou le confinement d'un appareil, la restriction de l'exécution du code, la mise en quarantaine d'un fichier, la suppression d'une clé de Registre, l'arrêt d'un service, la désactivation d'un pilote et la suppression d'une tâche planifiée. Annuler **Isolate device** reconnecte WS-112 au réseau, et annuler **Quarantine file** restaure invoice-tool.exe.
references:
  - title: View and manage actions in the Action center
    url: https://learn.microsoft.com/en-us/defender-xdr/m365d-autoir-actions
