id: sc200-1b-wb-statements
objective: "1.2.3"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Adatum Corporation uses Microsoft Sentinel with three workspaces in the same resource group. You customize a workbook that you saved from a template.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum Corporation utilise Microsoft Sentinel avec trois espaces de travail dans le même groupe de ressources. Vous personnalisez un classeur que vous avez enregistré à partir d'un modèle.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          A query step of the workbook can query more than one Log Analytics workspace.
        fr: |
          Une étape de requête du classeur peut interroger plusieurs espaces de travail Log Analytics.
    - id: s2
      text:
        en: |
          Deleting the customized workbook from the My workbooks tab also removes the template from the Templates tab.
        fr: |
          Supprimer le classeur personnalisé depuis l'onglet My workbooks retire aussi le modèle de l'onglet Templates.
    - id: s3
      text:
        en: |
          Save as creates a copy of the workbook that appears on the My workbooks tab.
        fr: |
          Save as crée une copie du classeur qui apparaît dans l'onglet My workbooks.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |
      A query that uses the Logs data source and the Log Analytics resource type can target one or more workspaces. Deleting a saved workbook removes it and its customizations permanently, but the original template remains available. Save as clones the workbook under a new name in the same subscription and resource group, and the clone appears on My workbooks.
    fr: |
      Une requête qui utilise la source de données Logs et le type de ressource Log Analytics peut cibler un ou plusieurs espaces de travail. Supprimer un classeur enregistré le supprime définitivement avec ses personnalisations, mais le modèle d'origine reste disponible. Save as clone le classeur sous un nouveau nom dans le même abonnement et le même groupe de ressources, et le clone apparaît dans My workbooks.
references:
  - title: Visualize your data by using workbooks in Microsoft Sentinel
    url: https://learn.microsoft.com/en-us/azure/sentinel/monitor-your-data
