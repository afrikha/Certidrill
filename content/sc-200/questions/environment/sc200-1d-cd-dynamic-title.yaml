id: sc200-1d-cd-dynamic-title
objective: "1.4.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Northwind uses Microsoft Defender XDR. You are creating a custom detection rule from an advanced hunting query on the **DeviceProcessEvents** table. The query returns the DeviceName, AccountUpn, FileName and FolderPath columns, in addition to the required columns.

    The alert title must include values returned by the query.

    Which two alert titles can you use?

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind utilise Microsoft Defender XDR. Vous créez une règle de détection personnalisée à partir d'une requête de repérage avancé sur la table **DeviceProcessEvents**. La requête renvoie les colonnes DeviceName, AccountUpn, FileName et FolderPath, en plus des colonnes requises.

    Le titre de l'alerte doit inclure des valeurs renvoyées par la requête.

    Quels sont les deux titres d'alerte que vous pouvez utiliser ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: "`{{FileName}} run by {{AccountUpn}} on {{DeviceName}} from {{FolderPath}}`" }
    - { id: b, text: "`{{FileName}} started on {{DeviceName}} from {{FolderPath}}`" }
    - { id: c, text: "`Encoded PowerShell on {{DeviceName}} by {{AccountUpn}}`" }
    - { id: d, text: "`Encoded PowerShell on $(DeviceName) by $(AccountUpn)`" }
    - { id: e, text: "`Encoded PowerShell on %DeviceName% by %AccountUpn%`" }
answer: { optionIds: [ b, c ] }
explanation:
  correct:
    en: The alert title and description accept dynamic values in the {{ColumnName}} format, with up to three columns per field. The Encoded PowerShell title with braces uses two columns and the started on title uses three, so both are valid.
    fr: |
      Le titre et la description de l'alerte acceptent des valeurs dynamiques au format {{ColumnName}}, avec trois colonnes au maximum par champ. Le titre Encoded PowerShell avec accolades utilise deux colonnes et le titre started on en utilise trois : les deux sont valides.
  options:
    a: { en: "This title references four columns; a field supports up to three dynamic columns.", fr: "Ce titre référence quatre colonnes ; un champ prend en charge trois colonnes dynamiques au maximum." }
    d: { en: "$(...) is not the syntax of dynamic alert values; use {{ColumnName}}.", fr: "$(...) n'est pas la syntaxe des valeurs dynamiques d'alerte ; utilisez {{ColumnName}}." }
    e: { en: "%...% is not the syntax of dynamic alert values; use {{ColumnName}}.", fr: "%...% n'est pas la syntaxe des valeurs dynamiques d'alerte ; utilisez {{ColumnName}}." }
references:
  - title: Create custom detection rules in Microsoft Defender XDR
    url: https://learn.microsoft.com/en-us/defender-xdr/custom-detection-rules
