id: sc200-1d-ar-defender-portal
objective: "1.4.3"
type: yesno_statements
difficulty: 3
status: draft
stem:
  en: |
    Woodgrove used Microsoft Sentinel in the Azure portal with several **Microsoft security** incident creation rules and scheduled analytics rules. The scheduled rules use alert grouping and customized alert names. Woodgrove then onboarded the workspace to the Microsoft Defender portal.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove utilisait Microsoft Sentinel dans le portail Azure avec plusieurs règles de création d'incidents **Sécurité Microsoft** et des règles d'analytique planifiées. Les règles planifiées utilisent le regroupement d'alertes et des noms d'alerte personnalisés. Woodgrove a ensuite intégré l'espace de travail au portail Microsoft Defender.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: The Microsoft security incident creation rules were disabled automatically during the onboarding.
        fr: Les règles de création d'incidents Sécurité Microsoft ont été désactivées automatiquement lors de l'intégration.
    - id: s2
      text:
        en: A scheduled rule can be configured to reopen a closed incident when a new matching alert is generated.
        fr: Une règle planifiée peut être configurée pour rouvrir un incident fermé quand une nouvelle alerte correspondante est générée.
    - id: s3
      text:
        en: An incident created from the alerts of a scheduled rule can have a name that differs from the customized alert name.
        fr: Un incident créé à partir des alertes d'une règle planifiée peut avoir un nom différent du nom d'alerte personnalisé.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: In the Defender portal, Defender XDR creates the incidents, so Microsoft security rules are disabled automatically at onboarding to avoid duplicates. Reopening closed matching incidents is not available in the Defender portal; a new alert creates a new incident. The Defender XDR correlation engine names the incidents, so it can override customized alert names.
    fr: |
      Dans le portail Defender, Defender XDR crée les incidents : les règles Sécurité Microsoft sont donc désactivées automatiquement à l'intégration pour éviter les doublons. La réouverture des incidents correspondants fermés n'est pas disponible dans le portail Defender ; une nouvelle alerte crée un nouvel incident. Le moteur de corrélation de Defender XDR nomme les incidents et peut donc remplacer les noms d'alerte personnalisés.
  options:
    s2: { en: "Reopen closed matching incidents is not available in the Defender portal.", fr: "La réouverture des incidents correspondants fermés n'est pas disponible dans le portail Defender." }
references:
  - title: Scheduled analytics rules in Microsoft Sentinel
    url: https://learn.microsoft.com/en-us/azure/sentinel/scheduled-rules-overview
  - title: Threat detection in Microsoft Sentinel
    url: https://learn.microsoft.com/en-us/azure/sentinel/detect-threats-built-in
