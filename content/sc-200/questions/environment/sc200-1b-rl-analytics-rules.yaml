id: sc200-1b-rl-analytics-rules
objective: "1.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Litware, Inc. uses Microsoft Sentinel. The workspace and the playbooks are in a resource group named **RG-SOC**.

    A detection engineer named Eng1 must create and edit analytics rules and install solutions from the Content hub. Eng1 must not edit playbooks.

    Which role should you assign to Eng1 on RG-SOC? The solution must follow the principle of least privilege.
  fr: |
    Litware, Inc. utilise Microsoft Sentinel. L'espace de travail et les playbooks se trouvent dans un groupe de ressources nommé **RG-SOC**.

    Un ingénieur de détection nommé Eng1 doit créer et modifier des règles d'analyse et installer des solutions depuis le hub de contenu. Eng1 ne doit pas modifier les playbooks.

    Quel rôle devez-vous attribuer à Eng1 sur RG-SOC ? La solution doit respecter le principe du moindre privilège.
body:
  options:
    - { id: a, text: Microsoft Sentinel Responder }
    - { id: b, text: Microsoft Sentinel Automation Contributor }
    - { id: c, text: Workbook Contributor }
    - { id: d, text: Microsoft Sentinel Contributor }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Microsoft Sentinel Contributor adds to the Responder permissions the creation and editing of resources such as analytics rules and workbooks, and the installation and update of Content hub solutions. It doesn't allow editing playbooks, which requires Logic App Contributor.
    fr: |
      Microsoft Sentinel Contributor ajoute aux autorisations de Responder la création et la modification de ressources comme les règles d'analyse et les classeurs, ainsi que l'installation et la mise à jour des solutions du hub de contenu. Il ne permet pas de modifier les playbooks, ce qui exige Logic App Contributor.
  options:
    a: { en: "Responder manages incidents but can't create analytics rules or manage the Content hub.", fr: "Responder gère les incidents mais ne peut ni créer de règles d'analyse ni gérer le hub de contenu." }
    b: { en: "Automation Contributor lets Microsoft Sentinel add playbooks to automation rules; it isn't meant for user accounts.", fr: "Automation Contributor permet à Microsoft Sentinel d'ajouter des playbooks aux règles d'automatisation ; il n'est pas destiné aux comptes d'utilisateur." }
    c: { en: "Workbook Contributor only creates and edits workbooks.", fr: "Workbook Contributor ne fait que créer et modifier des classeurs." }
references:
  - title: Roles and permissions in the Microsoft Sentinel platform
    url: https://learn.microsoft.com/en-us/azure/sentinel/roles
