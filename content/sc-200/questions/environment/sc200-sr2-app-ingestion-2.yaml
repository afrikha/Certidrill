id: sc200-sr2-app-ingestion-2
objective: "1.3.7"
type: series_yesno
series: sc200-sr2-app-ingestion
seriesOrder: 2
difficulty: 1
status: draft
stem:
  en: You use the HTTP Data Collector API with the workspace primary key.
  fr: Vous utilisez l'API HTTP Data Collector avec la clé primaire de l'espace de travail.
body:
  solution:
    en: You configure TollGate to send the records to the **HTTP Data Collector API** of SentinelWS with the log type **TollGate** and a **TimeGenerated** field set to EventTime. Each request is signed with the workspace ID and the **primary key** of SentinelWS.
    fr: Vous configurez TollGate pour envoyer les enregistrements à l'**API HTTP Data Collector** de SentinelWS avec le type de journal **TollGate** et un champ **TimeGenerated** défini sur EventTime. Chaque requête est signée avec l'ID de l'espace de travail et la **clé primaire** de SentinelWS.
answer: { value: false }
explanation:
  correct:
    en: The HTTP Data Collector API authenticates each request with a workspace shared key, which the requirements forbid. The API is also deprecated and its support ended on September 14, 2026; new integrations must use the Logs Ingestion API with a data collection rule.
    fr: L'API HTTP Data Collector authentifie chaque requête avec une clé partagée de l'espace de travail, ce que les exigences interdisent. L'API est en outre dépréciée et son support a pris fin le 14 septembre 2026 ; les nouvelles intégrations doivent utiliser la Logs Ingestion API avec une règle de collecte de données.
references:
  - title: Azure Monitor HTTP Data Collector API
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/logs/data-collector-api
