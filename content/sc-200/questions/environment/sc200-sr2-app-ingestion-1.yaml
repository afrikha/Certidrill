id: sc200-sr2-app-ingestion-1
objective: "1.3.7"
type: series_yesno
series: sc200-sr2-app-ingestion
seriesOrder: 1
difficulty: 2
status: draft
stem:
  en: You use a DCR-based custom table and assign Log Analytics Contributor on the workspace.
  fr: Vous utilisez une table personnalisée basée sur une DCR et attribuez Log Analytics Contributor sur l'espace de travail.
body:
  solution:
    en: |
      You register a Microsoft Entra application for TollGate and create a data collection endpoint. In SentinelWS, you create a DCR-based custom table named **TollGate_CL** with a new data collection rule, a JSON sample of the records and the transformation `source | extend TimeGenerated = todatetime(EventTime)`. You assign the **Log Analytics Contributor** role to the application on SentinelWS, and TollGate sends the records to the Logs Ingestion API.
    fr: |
      Vous inscrivez une application Microsoft Entra pour TollGate et créez un point de terminaison de collecte de données. Dans SentinelWS, vous créez une table personnalisée basée sur une DCR nommée **TollGate_CL** avec une nouvelle règle de collecte de données, un exemple JSON des enregistrements et la transformation `source | extend TimeGenerated = todatetime(EventTime)`. Vous attribuez le rôle **Log Analytics Contributor** à l'application sur SentinelWS, et TollGate envoie les enregistrements à l'API d'ingestion de journaux (Logs Ingestion API).
answer: { value: false }
explanation:
  correct:
    en: Sending data to the Logs Ingestion API requires the Microsoft.Insights/Telemetry/Write data action on the data collection rule. Log Analytics Contributor has no such data action, so the requests are rejected, and the role also grants far more than needed on the workspace.
    fr: L'envoi de données à la Logs Ingestion API exige l'action de données Microsoft.Insights/Telemetry/Write sur la règle de collecte de données. Log Analytics Contributor ne comporte pas cette action de données, donc les requêtes sont refusées, et le rôle accorde en outre bien plus que nécessaire sur l'espace de travail.
references:
