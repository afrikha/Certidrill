id: sc200-1a-asr-cloud-rules
objective: "1.1.6"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Adatum Corporation plans to deploy several attack surface reduction (ASR) rules. On some devices, a network policy blocks cloud-delivered protection, and the security team must know which rules would not work on those devices.

    Which two ASR rules require cloud-delivered protection?

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum Corporation prévoit de déployer plusieurs règles de réduction de la surface d'attaque (ASR). Sur certains appareils, une stratégie réseau bloque la protection fournie par le cloud, et l'équipe sécurité doit savoir quelles règles ne fonctionneraient pas sur ces appareils.

    Quelles sont les deux règles ASR qui exigent la protection fournie par le cloud ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: "Block executable files from running unless they meet a prevalence, age, or trusted list criterion" }
    - { id: b, text: Block all Office applications from creating child processes }
    - { id: c, text: Use advanced protection against ransomware }
    - { id: d, text: Block process creations originating from PSExec and WMI commands }
    - { id: e, text: Block untrusted and unsigned processes that run from USB }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: The prevalence, age, or trusted list rule and the advanced ransomware protection rule rely on cloud-delivered protection to evaluate files, so they require it to be enabled. The ASR reference lists the same requirement for the obfuscated scripts rule.
    fr: "La règle de prévalence, d'âge ou de liste approuvée et la règle de protection avancée contre les ransomware s'appuient sur la protection fournie par le cloud pour évaluer les fichiers : elles exigent donc qu'elle soit activée. La référence des règles ASR indique la même exigence pour la règle des scripts obfusqués."
  options:
    b: { en: "This rule blocks child processes of Office apps locally; it doesn't require cloud-delivered protection.", fr: "Cette règle bloque localement les processus enfants des applications Office ; elle n'exige pas la protection fournie par le cloud." }
    d: { en: "This rule blocks process creation by PsExec and WMI locally, without a cloud dependency.", fr: "Cette règle bloque localement la création de processus par PsExec et WMI, sans dépendance au cloud." }
    e: { en: "This rule blocks untrusted or unsigned executables from USB drives without requiring cloud-delivered protection.", fr: "Cette règle bloque les exécutables non approuvés ou non signés des lecteurs USB sans exiger la protection fournie par le cloud." }
references:
  - title: ASR rules reference
    url: https://learn.microsoft.com/en-us/defender-endpoint/attack-surface-reduction-rules-reference
