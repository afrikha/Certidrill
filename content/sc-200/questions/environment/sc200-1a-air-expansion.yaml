id: sc200-1a-air-expansion
objective: "1.1.7"
type: dropdown
difficulty: 2
status: draft
shuffle: false
stem:
  en: |
    Woodgrove Bank uses Microsoft Defender XDR and Microsoft Defender for Endpoint Plan 2. During an incident, an automated investigation finds a malicious file on one device and looks for the same file on other devices. An analyst also asks how to investigate another device on demand.

    How should you complete the explanation? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove Bank utilise Microsoft Defender XDR et Microsoft Defender pour point de terminaison Plan 2. Lors d'un incident, une enquête automatisée trouve un fichier malveillant sur un appareil et recherche le même fichier sur d'autres appareils. Un analyste demande aussi comment examiner un autre appareil à la demande.

    Comment devez-vous compléter l'explication ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      When the investigation finds the same entity on [[n]] or more devices, the expansion to these devices requires approval.
      Since September 1, 2026, to investigate a Defender for Endpoint device on demand, you run [[ondemand]].
    fr: |
      Lorsque l'enquête trouve la même entité sur [[n]] appareils ou plus, l'extension à ces appareils exige une approbation.
      Depuis le 1er septembre 2026, pour examiner un appareil Defender pour point de terminaison à la demande, vous exécutez [[ondemand]].
  slots:
    - id: n
      options:
        - { id: n5, text: "5" }
        - { id: n10, text: "10" }
        - { id: n50, text: "50" }
        - { id: n100, text: "100" }
    - id: ondemand
      options:
        - { id: full, text: { en: "a full antivirus scan", fr: "une analyse antivirus complète" } }
        - { id: quick, text: { en: "a quick antivirus scan", fr: "une analyse antivirus rapide" } }
        - { id: initiate, text: { en: "Initiate Automated Investigation from the device page", fr: "Initiate Automated Investigation depuis la page de l'appareil" } }
        - { id: package, text: { en: "Collect investigation package", fr: "Collect investigation package" } }
answer:
  values: { n: n10, ondemand: full }
explanation:
  correct:
    en: An automated investigation expands to other devices on which the same threat or an incriminated entity is seen; if 10 or more devices are found from the same entity, the expansion requires approval and appears with the pending actions. Since September 1, 2026, Defender for Endpoint AIR no longer runs as a separate investigation experience and can't be triggered manually; Microsoft says to run a full antivirus scan for on-demand investigations.
    fr: Une enquête automatisée s'étend aux autres appareils sur lesquels la même menace ou une entité incriminée est observée ; si 10 appareils ou plus sont trouvés pour une même entité, l'extension exige une approbation et apparaît avec les actions en attente. Depuis le 1er septembre 2026, l'AIR de Defender pour point de terminaison ne s'exécute plus comme une expérience d'enquête distincte et ne peut plus être déclenchée manuellement ; Microsoft indique d'exécuter une analyse antivirus complète pour les enquêtes à la demande.
  options:
    initiate: { en: "Manual triggering of Defender for Endpoint AIR is no longer available since September 1, 2026.", fr: "Le déclenchement manuel de l'AIR de Defender pour point de terminaison n'est plus disponible depuis le 1er septembre 2026." }
    package: { en: "An investigation package collects forensic data for analysts; it doesn't investigate or remediate threats.", fr: "Un package d'investigation collecte des données de forensique pour les analystes ; il n'examine ni ne corrige les menaces." }
    quick: { en: "Microsoft names a full antivirus scan, not a quick scan, as the replacement for on-demand investigations.", fr: "Microsoft désigne une analyse antivirus complète, et non une analyse rapide, comme remplacement des enquêtes à la demande." }
references:
  - title: Use automated investigations to investigate and remediate threats
    url: https://learn.microsoft.com/en-us/defender-endpoint/automated-investigations
