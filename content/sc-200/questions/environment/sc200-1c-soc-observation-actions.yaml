id: sc200-1c-soc-observation-actions
objective: "1.2.4"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove Bank reviews four SOC optimization recommendations for its Microsoft Sentinel workspace. Each recommendation shows the observation listed in the answer area.

    Which action should you take for each observation? To answer, drag the appropriate actions to the correct observations. Each action may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove Bank examine quatre recommandations d'optimisation SOC pour son espace de travail Microsoft Sentinel. Chaque recommandation affiche l'observation indiquée dans la zone de réponse.

    Quelle action devez-vous effectuer pour chaque observation ? Pour répondre, faites glisser les actions appropriées vers les observations correspondantes. Chaque action peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: rules, text: { en: "Turn on analytics rule templates for the threat", fr: "Activer des modèles de règles d'analytique pour la menace" } }
    - { id: connect, text: { en: "Connect new data sources", fr: "Connecter de nouvelles sources de données" } }
    - { id: move, text: { en: "Move the table to a nonsecurity Log Analytics workspace", fr: "Déplacer la table vers un espace de travail Log Analytics hors sécurité" } }
    - { id: column, text: { en: "Stop data ingestion for the column", fr: "Arrêter l'ingestion de données pour la colonne" } }
    - { id: tuning, text: { en: "Create an alert tuning rule", fr: "Créer une règle de réglage des alertes" } }
    - { id: tier, text: { en: "Increase the commitment tier", fr: "Augmenter le niveau d'engagement" } }
  targets:
    - id: t1
      text: { en: "Threat-based coverage: there are data sources, but detections are missing.", fr: "Couverture basée sur les menaces : des sources de données existent, mais des détections manquent." }
    - id: t2
      text: { en: "Threat-based coverage: templates are turned on, but data sources are missing.", fr: "Couverture basée sur les menaces : des modèles sont activés, mais des sources de données manquent." }
    - id: t3
      text: { en: "Data value: the table was only used by Azure Monitor, and it has no security value.", fr: "Valeur des données : la table n'a été utilisée que par Azure Monitor et n'a aucune valeur de sécurité." }
    - id: t4
      text: { en: "Data value: the ConditionalAccessPolicies column of the SigninLogs table isn't in use.", fr: "Valeur des données : la colonne ConditionalAccessPolicies de la table SigninLogs n'est pas utilisée." }
answer:
  mapping: { t1: rules, t2: connect, t3: move, t4: column }
explanation:
  correct:
    en: When data exists but detections are missing, turn on rule templates for the threat and adapt them. When templates are on but their data is missing, connect the data sources. A table used only by Azure Monitor and without security value can move to a nonsecurity workspace so that it no longer incurs Microsoft Sentinel costs. The unused-columns recommendation (preview) suggests stopping ingestion of the ConditionalAccessPolicies column.
    fr: Lorsque les données existent mais que des détections manquent, activez des modèles de règles pour la menace et adaptez-les. Lorsque des modèles sont activés mais que leurs données manquent, connectez les sources de données. Une table utilisée uniquement par Azure Monitor et sans valeur de sécurité peut être déplacée vers un espace de travail hors sécurité pour ne plus générer de coûts Microsoft Sentinel. La recommandation sur les colonnes inutilisées (préversion) propose d'arrêter l'ingestion de la colonne ConditionalAccessPolicies.
  options:
    tuning:
      en: Alert tuning hides or resolves alerts; it is not an action suggested by SOC optimization.
      fr: Le réglage des alertes masque ou résout des alertes ; ce n'est pas une action proposée par l'optimisation SOC.
    tier:
      en: A higher commitment tier changes pricing, not detection coverage or data value.
      fr: Un niveau d'engagement supérieur modifie la tarification, pas la couverture de détection ni la valeur des données.
references:
  - title: SOC optimization reference
    url: https://learn.microsoft.com/en-us/azure/sentinel/soc-optimization/soc-optimization-reference
