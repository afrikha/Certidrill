id: sc200-1a-af-purview-share
objective: "1.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam, Inc. uses Microsoft Defender for Endpoint Plan 2 and Microsoft Purview Insider Risk Management. The policy indicators are configured in the insider risk management settings.

    Insider risk analysts need the endpoint security alerts and their triage status to be available in Microsoft Purview for applicable users.

    Which advanced feature should you turn on in the Microsoft Defender portal?
  fr: |
    Fabrikam, Inc. utilise Microsoft Defender pour point de terminaison Plan 2 et Microsoft Purview Insider Risk Management. Les indicateurs de stratégie sont configurés dans les paramètres de la gestion des risques internes.

    Les analystes des risques internes ont besoin que les alertes de sécurité des points de terminaison et leur statut de tri soient disponibles dans Microsoft Purview pour les utilisateurs concernés.

    Quelle fonctionnalité avancée devez-vous activer dans le portail Microsoft Defender ?
body:
  options:
    - { id: a, text: Unified audit log }
    - { id: b, text: Microsoft Defender for Cloud Apps }
    - { id: c, text: Microsoft Intune connection }
    - { id: d, text: Share endpoint alerts with Microsoft Compliance Center }
answer: { optionId: d }
explanation:
  correct:
    en: "**Share endpoint alerts with Microsoft Compliance Center** forwards endpoint security alerts and their triage status to Microsoft Purview, where insider risk management uses them for applicable users. It requires the policy indicators to be configured in the insider risk management settings, which is done."
    fr: "**Share endpoint alerts with Microsoft Compliance Center** transmet les alertes de sécurité des points de terminaison et leur statut de tri à Microsoft Purview, où la gestion des risques internes les utilise pour les utilisateurs concernés. Elle exige que les indicateurs de stratégie soient configurés dans les paramètres de la gestion des risques internes, ce qui est fait."
  options:
    a:
      en: The unified audit log records audited Defender for Endpoint activities for Purview audit search; it doesn't send alerts to insider risk management.
      fr: Le journal d'audit unifié enregistre les activités auditées de Defender pour point de terminaison pour la recherche d'audit Purview ; il n'envoie pas les alertes à la gestion des risques internes.
    b:
      en: This integration forwards endpoint signals to Defender for Cloud Apps for cloud app discovery, not to Microsoft Purview.
      fr: Cette intégration transmet les signaux des points de terminaison à Defender for Cloud Apps pour la découverte des applications cloud, pas à Microsoft Purview.
    c:
      en: The Intune connection shares device risk with Intune for Conditional Access; it has nothing to do with insider risk management.
      fr: La connexion Intune partage le risque des appareils avec Intune pour l'accès conditionnel ; elle n'a aucun rapport avec la gestion des risques internes.
references:
  - title: Configure Advanced Features in Microsoft Defender for Endpoint
    url: https://learn.microsoft.com/en-us/defender-endpoint/advanced-features
