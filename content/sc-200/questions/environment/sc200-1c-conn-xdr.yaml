id: sc200-1c-conn-xdr
objective: "1.3.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Adatum Corporation uses Microsoft Defender for Endpoint, Microsoft Defender for Office 365 and Microsoft Defender for Identity. Adatum has a Microsoft Sentinel workspace named **law-adatum** that is managed in the Azure portal and isn't onboarded to the Defender portal yet.

    You need the incidents and alerts of the three products to appear in law-adatum and stay synchronized with Microsoft Defender XDR. The solution must minimize administrative effort.

    Which data connector should you enable?
  fr: |
    Adatum Corporation utilise Microsoft Defender pour point de terminaison, Microsoft Defender pour Office 365 et Microsoft Defender pour Identity. Adatum dispose d'un espace de travail Microsoft Sentinel nommé **law-adatum**, géré dans le portail Azure et pas encore intégré au portail Defender.

    Vous devez faire apparaître les incidents et les alertes des trois produits dans law-adatum et les maintenir synchronisés avec Microsoft Defender XDR. La solution doit réduire au minimum l'effort d'administration.

    Quel connecteur de données devez-vous activer ?
body:
  options:
    - { id: a, text: Microsoft 365 }
    - { id: b, text: Windows Security Events via AMA }
    - { id: c, text: Azure Activity }
    - { id: d, text: Microsoft Defender XDR }
answer: { optionId: d }
explanation:
  correct:
    en: The Microsoft Defender XDR connector brings the incidents and alerts of all the Defender XDR workloads into Microsoft Sentinel and keeps the incidents synchronized between both portals; it can also stream advanced hunting tables such as `DeviceProcessEvents`. A single connector covers the three products. When the workspace is onboarded to the Defender portal, this connector is enabled automatically.
    fr: Le connecteur Microsoft Defender XDR importe dans Microsoft Sentinel les incidents et les alertes de toutes les charges de travail Defender XDR, et maintient les incidents synchronisés entre les deux portails ; il peut aussi envoyer des tables du repérage avancé comme `DeviceProcessEvents`. Un seul connecteur couvre les trois produits. Lorsque l'espace de travail est intégré au portail Defender, ce connecteur est activé automatiquement.
  options:
    a:
      en: The Microsoft 365 connector ingests Exchange, SharePoint and Teams activity into `OfficeActivity`, not Defender incidents.
      fr: Le connecteur Microsoft 365 ingère l'activité d'Exchange, de SharePoint et de Teams dans `OfficeActivity`, pas les incidents Defender.
    b:
      en: This connector collects the Windows Security log of servers, not Defender alerts or incidents.
      fr: Ce connecteur collecte le journal Sécurité Windows des serveurs, pas les alertes ni les incidents Defender.
    c:
      en: Azure Activity collects subscription-level operations in Azure.
      fr: Azure Activity collecte les opérations Azure au niveau de l'abonnement.
references:
  - title: Stream data from Microsoft Defender XDR to Microsoft Sentinel in the Azure portal
    url: https://learn.microsoft.com/en-us/azure/sentinel/connect-microsoft-365-defender
