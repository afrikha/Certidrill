id: sc200-cs3a-cef-dedup
objective: "1.3.4"
type: dropdown
caseStudy: sc200-cs3a-trey-research
difficulty: 2
status: draft
stem:
  en: |
    You need to configure the collection on LNX-FWD1 to meet the requirement for the firewall and instrument logs.

    How should you complete the configuration? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez configurer la collecte sur LNX-FWD1 pour respecter l'exigence relative aux journaux des pare-feu et des instruments.

    Comment devez-vous compléter la configuration ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Collect the FW1 and FW2 messages by using [[conn]].
      To prevent duplicate ingestion, [[dedup]].
      The messages of the instrument controllers will be stored in the [[tbl]] table.
    fr: |
      Collecter les messages de FW1 et FW2 avec [[conn]].
      Pour éviter une ingestion en double, [[dedup]].
      Les messages des contrôleurs d'instruments seront stockés dans la table [[tbl]].
  slots:
    - id: conn
      options:
        - { id: cef, text: { en: "the Common Event Format (CEF) via AMA connector", fr: "le connecteur Common Event Format (CEF) via AMA" } }
        - { id: syslog, text: { en: "the Syslog via AMA connector", fr: "le connecteur Syslog via AMA" } }
        - { id: custom, text: { en: "the Custom Logs via AMA connector", fr: "le connecteur Custom Logs via AMA" } }
        - { id: wef, text: { en: "the Windows Forwarded Events connector", fr: "le connecteur Windows Forwarded Events" } }
    - id: dedup
      options:
        - { id: transform, text: { en: "add a transformation to the Syslog DCR that drops CEF messages", fr: "ajouter à la DCR Syslog une transformation qui écarte les messages CEF" } }
        - { id: nolocal4, text: { en: "remove the local4 facility from the Syslog DCR", fr: "retirer la facility local4 de la DCR Syslog" } }
        - { id: emerg, text: { en: "set the minimum log level of local4 to LOG_EMERG in the Syslog DCR", fr: "définir le niveau de journal minimal de local4 sur LOG_EMERG dans la DCR Syslog" } }
        - { id: onedcr, text: { en: "delete the CEF DCR and collect local4 in the Syslog DCR only", fr: "supprimer la DCR CEF et collecter local4 uniquement dans la DCR Syslog" } }
    - id: tbl
      options:
        - { id: sys, text: Syslog }
        - { id: csl, text: CommonSecurityLog }
        - { id: winev, text: WindowsEvent }
        - { id: secev, text: SecurityEvent }
answer:
  values: { conn: cef, dedup: transform, tbl: sys }
explanation:
  correct:
    en: |
      FW1 and FW2 send CEF, so you collect them with the CEF via AMA connector, which stores them in CommonSecurityLog. Because the firewalls and the instrument controllers share the local4 facility and the firewall facility cannot be changed, Microsoft recommends an ingestion-time transformation on the Syslog stream that drops the CEF messages. The plain Syslog messages of the controllers then land only in the Syslog table.
    fr: |
      FW1 et FW2 envoient du CEF : vous les collectez donc avec le connecteur CEF via AMA, qui les stocke dans CommonSecurityLog. Comme les pare-feu et les contrôleurs d'instruments partagent la facility local4 et que la facility des pare-feu ne peut pas être modifiée, Microsoft recommande une transformation au moment de l'ingestion sur le flux Syslog qui écarte les messages CEF. Les messages Syslog standard des contrôleurs arrivent alors uniquement dans la table Syslog.
  options:
    syslog: { en: "The Syslog via AMA connector would store the firewall messages in the Syslog table without parsing the CEF fields.", fr: "Le connecteur Syslog via AMA stockerait les messages des pare-feu dans la table Syslog sans analyser les champs CEF." }
    custom: { en: "Custom Logs via AMA collects text files written on a machine, not CEF messages received by the syslog daemon.", fr: "Custom Logs via AMA collecte des fichiers texte écrits sur une machine, pas des messages CEF reçus par le démon syslog." }
    wef: { en: "Windows Forwarded Events collects events forwarded to a Windows Event Collector, not syslog traffic.", fr: "Windows Forwarded Events collecte des événements transférés vers un collecteur d'événements Windows, pas du trafic syslog." }
    nolocal4: { en: "The instrument controllers also use local4: removing it from the Syslog DCR would stop the collection of their messages.", fr: "Les contrôleurs d'instruments utilisent aussi local4 : la retirer de la DCR Syslog arrêterait la collecte de leurs messages." }
    emerg: { en: "A minimum log level filters by severity, not by format, so most instrument messages would be lost and the CEF duplicates at that level would remain.", fr: "Un niveau de journal minimal filtre par gravité, pas par format : la plupart des messages des instruments seraient perdus et les doublons CEF de ce niveau resteraient." }
    onedcr: { en: "Without the CEF DCR, the firewall messages would only reach the Syslog table, without the CEF parsing that CommonSecurityLog provides.", fr: "Sans la DCR CEF, les messages des pare-feu n'arriveraient que dans la table Syslog, sans l'analyse CEF que fournit CommonSecurityLog." }
    csl: { en: "CommonSecurityLog stores the CEF messages; the standard Syslog messages of the controllers go to the Syslog table.", fr: "CommonSecurityLog stocke les messages CEF ; les messages Syslog standard des contrôleurs vont dans la table Syslog." }
references:
  - title: Syslog and Common Event Format (CEF) via AMA connectors for Microsoft Sentinel
    url: https://learn.microsoft.com/en-us/azure/sentinel/cef-syslog-ama-overview
  - title: Ingest syslog and CEF messages to Microsoft Sentinel with the Azure Monitor Agent
    url: https://learn.microsoft.com/en-us/azure/sentinel/connect-cef-syslog-ama
