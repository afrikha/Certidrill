id: sc200-1c-ti-taxii-info
objective: "1.3.6"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    Fabrikam subscribes to a commercial threat intelligence feed exposed by a TAXII 2.1 server. You plan to connect the feed to the Microsoft Sentinel workspace **law-fabrikam** by using the Threat Intelligence - TAXII data connector. The server doesn't require authentication.

    Which two pieces of information must you obtain from the provider? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam s'abonne à un flux commercial de renseignement sur les menaces exposé par un serveur TAXII 2.1. Vous prévoyez de connecter le flux à l'espace de travail Microsoft Sentinel **law-fabrikam** avec le connecteur de données Threat Intelligence - TAXII. Le serveur n'exige pas d'authentification.

    Quelles sont les deux informations que vous devez obtenir du fournisseur ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "The workspace ID and primary key", fr: "L'ID et la clé primaire de l'espace de travail" } }
    - { id: b, text: { en: "The collection ID", fr: "L'ID de collection" } }
    - { id: c, text: { en: "The API root URL of the TAXII server", fr: "L'URL racine de l'API (API root) du serveur TAXII" } }
    - { id: d, text: { en: "The application ID and client secret of a Microsoft Entra app", fr: "L'ID d'application et le secret client d'une application Microsoft Entra" } }
    - { id: e, text: { en: "The immutable ID of a data collection rule", fr: "L'ID immuable d'une règle de collecte de données" } }
answer: { optionIds: [ b, c ] }
explanation:
  correct:
    en: To connect a TAXII 2.0 or 2.1 server, you need its API root URL and the collection ID, plus a friendly name, and a username and password only if the server requires them. You then choose the indicator group and the polling frequency, and select Add.
    fr: Pour connecter un serveur TAXII 2.0 ou 2.1, vous avez besoin de l'URL racine de son API et de l'ID de collection, ainsi que d'un nom convivial, et d'un nom d'utilisateur et d'un mot de passe seulement si le serveur les exige. Vous choisissez ensuite le groupe d'indicateurs et la fréquence d'interrogation, puis sélectionnez Add.
  options:
    a:
      en: Workspace keys aren't part of the TAXII connector configuration, and they come from your workspace, not from the provider.
      fr: Les clés d'espace de travail ne font pas partie de la configuration du connecteur TAXII et proviennent de votre espace de travail, pas du fournisseur.
    d:
      en: A Microsoft Entra app is used by the upload API, when a platform pushes indicators.
      fr: Une application Microsoft Entra sert à l'API de chargement, lorsqu'une plateforme pousse des indicateurs.
    e:
      en: Data collection rules are used by the Logs Ingestion API and the agent-based connectors, not by the TAXII connector.
      fr: Les règles de collecte de données servent à l'API d'ingestion de journaux et aux connecteurs basés sur un agent, pas au connecteur TAXII.
references:
  - title: Threat intelligence in Microsoft Sentinel
    url: https://learn.microsoft.com/en-us/azure/sentinel/understand-threat-intelligence
  - title: Use STIX/TAXII to import and export threat intelligence in Microsoft Sentinel
    url: https://learn.microsoft.com/en-us/azure/sentinel/connect-threat-intelligence-taxii
