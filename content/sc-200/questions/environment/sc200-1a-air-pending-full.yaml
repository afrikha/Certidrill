id: sc200-1a-air-pending-full
objective: "1.1.7"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Contoso, Ltd. uses Microsoft Defender XDR and Microsoft Defender for Endpoint Plan 2. The device group **Workstations** uses the automation level **Semi - require approval for all folders**.

    Remediation actions for malicious files on workstations wait in the Action center until an analyst approves them, which delays containment. You need these remediation actions to run without approval. The solution must minimize administrative effort.

    What should you do?
  fr: |
    Contoso, Ltd. utilise Microsoft Defender XDR et Microsoft Defender pour point de terminaison Plan 2. Le groupe d'appareils **Workstations** utilise le niveau d'automatisation **Semi - require approval for all folders**.

    Les actions de correction des fichiers malveillants des postes de travail attendent dans le centre de notifications qu'un analyste les approuve, ce qui retarde le confinement. Vous devez faire en sorte que ces actions de correction s'exécutent sans approbation. La solution doit réduire au minimum l'effort d'administration.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Assign the Active remediation actions permission to all the analysts.", fr: "Attribuer l'autorisation Active remediation actions à tous les analystes." }
    - id: b
      text: { en: "Set the automation level of Workstations to Semi - require approval for core folders remediation.", fr: "Définir le niveau d'automatisation de Workstations à Semi - require approval for core folders remediation." }
    - id: c
      text: { en: "Set the automation level of Workstations to Full - remediate threats automatically.", fr: "Définir le niveau d'automatisation de Workstations à Full - remediate threats automatically." }
    - id: d
      text: { en: "Create a Microsoft Sentinel automation rule that closes the related incidents.", fr: "Créer une règle d'automatisation Microsoft Sentinel qui ferme les incidents associés." }
answer: { optionId: c }
explanation:
  correct:
    en: With **Full - remediate threats automatically**, remediation actions on malicious entities run automatically, appear in the History tab of the Action center and can be undone if needed. Microsoft recommends full automation. With Semi - require approval for all folders, every action waits on the Pending tab and times out after 7 days.
    fr: Avec **Full - remediate threats automatically**, les actions de correction sur les entités malveillantes s'exécutent automatiquement, apparaissent dans l'onglet History du centre de notifications et peuvent être annulées si nécessaire. Microsoft recommande l'automatisation complète. Avec Semi - require approval for all folders, chaque action attend dans l'onglet Pending et expire au bout de 7 jours.
  options:
    a:
      en: The permission lets analysts approve actions, but the actions still wait for an approval.
      fr: L'autorisation permet aux analystes d'approuver les actions, mais celles-ci attendent toujours une approbation.
    b:
      en: This level still requires approval for files in core folders such as the Windows directory.
      fr: Ce niveau exige toujours une approbation pour les fichiers des dossiers principaux, comme le répertoire Windows.
    d:
      en: Closing incidents doesn't run the pending remediation actions; the threats would stay on the devices.
      fr: Fermer les incidents n'exécute pas les actions de correction en attente ; les menaces resteraient sur les appareils.
references:
  - title: Automation levels in automated investigation and remediation
    url: https://learn.microsoft.com/en-us/defender-endpoint/automation-levels
