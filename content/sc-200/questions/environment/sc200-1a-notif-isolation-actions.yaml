id: sc200-1a-notif-isolation-actions
objective: "1.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Contoso, Ltd. uses Microsoft Defender XDR and Microsoft Defender for Endpoint. Devices are organized into the device groups **Finance**, **HR** and **Servers**.

    The SOC lead must receive an email each time a device in the Finance device group is isolated, whether an analyst isolates it manually or an automated action isolates it. The SOC lead must not receive emails about the other device groups or about new incidents.

    What should you create in the Microsoft Defender portal?
  fr: |
    Contoso, Ltd. utilise Microsoft Defender XDR et Microsoft Defender pour point de terminaison. Les appareils sont organisés dans les groupes d'appareils **Finance**, **HR** et **Servers**.

    Le responsable du SOC doit recevoir un e-mail chaque fois qu'un appareil du groupe d'appareils Finance est isolé, qu'un analyste l'isole manuellement ou qu'une action automatisée l'isole. Le responsable du SOC ne doit pas recevoir d'e-mails concernant les autres groupes d'appareils ni les nouveaux incidents.

    Que devez-vous créer dans le portail Microsoft Defender ?
body:
  options:
    - id: a
      text: { en: "A notification rule on the Incidents tab, scoped to the Finance device group", fr: "Une règle de notification sous l'onglet Incidents, limitée au groupe d'appareils Finance" }
    - id: b
      text: { en: "A notification rule on the Actions tab, scoped to the Finance device group", fr: "Une règle de notification sous l'onglet Actions, limitée au groupe d'appareils Finance" }
    - id: c
      text: { en: "A notification rule on the Threat analytics tab, filtered on the Finance device group", fr: "Une règle de notification sous l'onglet Threat analytics, filtrée sur le groupe d'appareils Finance" }
    - id: d
      text: { en: "A Microsoft Sentinel automation rule that runs a playbook when an incident is created", fr: "Une règle d'automatisation Microsoft Sentinel qui exécute un playbook à la création d'un incident" }
answer: { optionId: b }
explanation:
  correct:
    en: Response action notifications are configured on the **Actions** tab of Settings > Microsoft Defender XDR > Email notifications. The rule lets you select the action source (manual, automated or both), the actions to watch, such as isolating a device, the device group scope and the action status, so the SOC lead receives only Finance isolation emails.
    fr: "Les notifications sur les actions de réponse se configurent sous l'onglet **Actions** de Paramètres > Microsoft Defender XDR > Notifications par e-mail. La règle permet de choisir la source de l'action (manuelle, automatisée ou les deux), les actions à surveiller, comme l'isolement d'un appareil, l'étendue des groupes d'appareils et le statut de l'action : le responsable du SOC ne reçoit que les e-mails d'isolement des appareils Finance."
  options:
    a:
      en: An incident notification rule sends an email when an incident is created, not when a response action such as isolation runs.
      fr: Une règle de notification d'incident envoie un e-mail à la création d'un incident, pas lorsqu'une action de réponse comme l'isolement s'exécute.
    c:
      en: Threat analytics notifications are about published or updated threat analytics reports; they have no device group or response action filter.
      fr: Les notifications de l'analytique des menaces portent sur les rapports publiés ou mis à jour ; elles n'ont aucun filtre de groupe d'appareils ni d'action de réponse.
    d:
      en: An automation rule triggered by incident creation reacts to incidents, not to isolation actions, and it requires building and maintaining a playbook.
      fr: Une règle d'automatisation déclenchée par la création d'un incident réagit aux incidents, pas aux actions d'isolement, et elle demande de créer et maintenir un playbook.
references:
  - title: Get email notifications for response actions
    url: https://learn.microsoft.com/en-us/defender-xdr/m365d-response-actions-notifications
