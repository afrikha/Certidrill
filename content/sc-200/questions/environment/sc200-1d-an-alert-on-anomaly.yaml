id: sc200-1d-an-alert-on-anomaly
objective: "1.4.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Wingtip has a Microsoft Sentinel workspace. The anomaly rule **Anomalous Azure operations** runs in Production mode and records anomalies as expected.

    The SOC wants an incident to be created whenever this rule records an anomaly for one of the accounts in a watchlist of privileged administrators.

    What should you do?
  fr: |
    Wingtip dispose d'un espace de travail Microsoft Sentinel. La règle d'anomalie **Anomalous Azure operations** s'exécute en mode Production et enregistre des anomalies comme prévu.

    Le SOC veut qu'un incident soit créé chaque fois que cette règle enregistre une anomalie pour l'un des comptes d'une watchlist d'administrateurs privilégiés.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Create an automation rule that runs when the anomaly rule records an anomaly.", fr: "Créer une règle d'automatisation qui s'exécute quand la règle d'anomalie enregistre une anomalie." } }
    - { id: b, text: { en: "Duplicate the anomaly rule, and switch the copy to Production mode.", fr: "Dupliquer la règle d'anomalie, puis faire passer la copie en mode Production." } }
    - { id: c, text: { en: "Create a scheduled analytics rule that queries the Anomalies table and the watchlist.", fr: "Créer une règle d'analytique planifiée qui interroge la table Anomalies et la watchlist." } }
    - { id: d, text: { en: "Switch the anomaly rule to Flighting mode, and then back to Production mode.", fr: "Faire passer la règle d'anomalie en mode Flighting, puis de nouveau en mode Production." } }
answer: { optionId: c }
explanation:
  correct:
    en: Anomaly rules do not generate alerts or incidents; they write their results to the Anomalies table. A scheduled analytics rule that queries Anomalies, filtered on the accounts of the watchlist, raises alerts, and its alerts create incidents.
    fr: Les règles d'anomalie ne génèrent ni alertes ni incidents ; elles écrivent leurs résultats dans la table Anomalies. Une règle d'analytique planifiée qui interroge Anomalies, filtrée sur les comptes de la watchlist, génère des alertes, et ses alertes créent des incidents.
  options:
    a: { en: "Automation rules run on alerts and incidents; an anomaly is neither, so nothing would trigger the automation rule.", fr: "Les règles d'automatisation s'exécutent sur les alertes et les incidents ; une anomalie n'est ni l'un ni l'autre : rien ne déclencherait la règle d'automatisation." }
    b: { en: "A customized copy changes thresholds and parameters, but it still writes to the Anomalies table without creating incidents.", fr: "Une copie personnalisée change les seuils et paramètres, mais elle écrit toujours dans la table Anomalies sans créer d'incidents." }
    d: { en: "Production and Flighting change which version is in production, not whether anomalies create incidents.", fr: "Production et Flighting changent la version en production, pas le fait que les anomalies créent des incidents." }
references:
  - title: Threat detection in Microsoft Sentinel
    url: https://learn.microsoft.com/en-us/azure/sentinel/detect-threats-built-in
  - title: Use customizable anomalies to detect threats in Microsoft Sentinel
    url: https://learn.microsoft.com/en-us/azure/sentinel/soc-ml-anomalies
