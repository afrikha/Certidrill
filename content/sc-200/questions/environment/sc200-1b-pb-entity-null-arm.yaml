id: sc200-1b-pb-entity-null-arm
objective: "1.1.11"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Adatum Corporation uses Microsoft Sentinel. A playbook named **pb-BlockIP** uses the entity trigger for IP entities. It runs these actions:

    1. Add the IP address to the block list of the firewall.
    2. Add a comment to the incident, by using the Incident ARM ID from the trigger.

    pb-BlockIP works when analysts run it on an IP entity inside an incident. When threat hunters run it on an IP address found during hunting, the run fails at the comment step.

    You need pb-BlockIP to work in both cases.

    What should you do?
  fr: |
    Adatum Corporation utilise Microsoft Sentinel. Un playbook nommé **pb-BlockIP** utilise le déclencheur d'entité pour les entités IP. Il exécute ces actions :

    1. Ajouter l'adresse IP à la liste de blocage du pare-feu.
    2. Ajouter un commentaire à l'incident, à l'aide de l'Incident ARM ID fourni par le déclencheur.

    pb-BlockIP fonctionne lorsque les analystes l'exécutent sur une entité IP à l'intérieur d'un incident. Lorsque les chasseurs de menaces l'exécutent sur une adresse IP trouvée pendant le repérage, l'exécution échoue à l'étape du commentaire.

    Vous devez faire fonctionner pb-BlockIP dans les deux cas.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Replace the entity trigger with the incident trigger.", fr: "Remplacer le déclencheur d'entité par le déclencheur d'incident." } }
    - { id: b, text: { en: "Assign the Microsoft Sentinel Playbook Operator role to the threat hunters.", fr: "Attribuer le rôle Microsoft Sentinel Playbook Operator aux chasseurs de menaces." } }
    - { id: c, text: { en: "Assign the Microsoft Sentinel Responder role to the playbook's managed identity.", fr: "Attribuer le rôle Microsoft Sentinel Responder à l'identité managée du playbook." } }
    - { id: d, text: { en: "Add a condition that runs the comment step only when Incident ARM ID isn't null.", fr: "Ajouter une condition qui n'exécute l'étape du commentaire que si Incident ARM ID n'est pas null." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      An entity playbook run from threat hunting isn't attached to an incident, so the Incident ARM ID output is null and the comment action fails. Microsoft recommends testing Incident ARM ID is not equal to null in a condition before any step that uses it, so the block still runs and the comment is added only inside an incident.
    fr: |
      Un playbook d'entité exécuté depuis le repérage des menaces n'est attaché à aucun incident : la sortie Incident ARM ID est null et l'action de commentaire échoue. Microsoft recommande de tester Incident ARM ID is not equal to null dans une condition avant toute étape qui l'utilise : le blocage s'exécute toujours et le commentaire n'est ajouté qu'à l'intérieur d'un incident.
  options:
    a: { en: "An incident playbook can't run on an IP address found during hunting, outside any incident.", fr: "Un playbook d'incident ne peut pas s'exécuter sur une adresse IP trouvée pendant le repérage, hors de tout incident." }
    b: { en: "The hunters can already start the playbook; the failure comes from the null incident ID, not from their permissions.", fr: "Les chasseurs peuvent déjà lancer le playbook ; l'échec vient de l'ID d'incident null, pas de leurs autorisations." }
    c: { en: "The comment step works inside incidents, so the identity's permissions are sufficient; no role fixes a missing incident ID.", fr: "L'étape du commentaire fonctionne dans les incidents : les autorisations de l'identité suffisent, et aucun rôle ne corrige un ID d'incident absent." }
references:
  - title: Create and manage Microsoft Sentinel playbooks
    url: https://learn.microsoft.com/en-us/azure/sentinel/automation/create-playbooks
