id: sc200-cs2b-playbook-automation
objective: "1.1.11"
type: multi
caseStudy: sc200-cs2b-consolidated-messenger
difficulty: 2
status: draft
stem:
  en: |
    You need to meet the requirement for pb-teams-notify and resolve the automation rule failure.

    Which two actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez répondre à l'exigence relative à pb-teams-notify et résoudre l'échec de la règle d'automatisation.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Grant Microsoft Sentinel permissions on rg-soc-playbooks by using Manage playbook permissions", fr: "Accorder à Microsoft Sentinel des autorisations sur rg-soc-playbooks avec Manage playbook permissions" } }
    - { id: b, text: { en: "Assign the Microsoft Sentinel Playbook Operator role to the security engineer on rg-soc-playbooks", fr: "Attribuer le rôle Microsoft Sentinel Playbook Operator à l'ingénieur sécurité sur rg-soc-playbooks" } }
    - { id: c, text: { en: "Configure the automation rule with the When incident is created trigger and a Severity equals High condition", fr: "Configurer la règle d'automatisation avec le déclencheur When incident is created et une condition Severity equals High" } }
    - { id: d, text: { en: "Configure the automation rule with the When alert is created trigger and a Severity equals High condition", fr: "Configurer la règle d'automatisation avec le déclencheur When alert is created et une condition Severity equals High" } }
    - { id: e, text: { en: "Change the trigger of pb-teams-notify to the Microsoft Sentinel alert trigger", fr: "Remplacer le déclencheur de pb-teams-notify par le déclencheur d'alerte Microsoft Sentinel" } }
answer: { optionIds: [a, c] }
explanation:
  correct:
    en: Automation rules run playbooks with a dedicated Microsoft Sentinel service account, which needs explicit permissions on the playbook's resource group; Manage playbook permissions grants them (it requires Owner on the resource group). pb-teams-notify uses the incident trigger, so it must be called from an automation rule that uses an incident trigger, here When incident is created with a severity condition.
    fr: |
      Les règles d'automatisation exécutent les playbooks avec un compte de service Microsoft Sentinel dédié, qui a besoin d'autorisations explicites sur le groupe de ressources du playbook ; Manage playbook permissions les accorde (il faut être Owner du groupe de ressources). pb-teams-notify utilise le déclencheur d'incident : il doit être appelé par une règle d'automatisation qui utilise un déclencheur d'incident, ici When incident is created avec une condition de gravité.
  options:
    b: { en: "Playbook Operator lets a user run playbooks manually; automation rules do not run playbooks with the creator's account.", fr: "Playbook Operator permet à un utilisateur d'exécuter des playbooks manuellement ; les règles d'automatisation n'exécutent pas les playbooks avec le compte de leur créateur." }
    d: { en: "The alert trigger fires only for alerts of scheduled and NRT rules, its only condition is the list of analytics rules, and an alert-trigger automation rule can run only alert-trigger playbooks.", fr: "Le déclencheur d'alerte ne se déclenche que pour les alertes des règles planifiées et NRT, sa seule condition est la liste des règles d'analytique, et une règle d'automatisation à déclencheur d'alerte ne peut exécuter que des playbooks à déclencheur d'alerte." }
    e: { en: "An alert-trigger playbook cannot be run by an incident-trigger automation rule, and the requirement is about incidents.", fr: "Un playbook à déclencheur d'alerte ne peut pas être exécuté par une règle d'automatisation à déclencheur d'incident, et l'exigence porte sur des incidents." }
references:
  - title: Automate threat response in Microsoft Sentinel with automation rules
    url: https://learn.microsoft.com/en-us/azure/sentinel/automate-incident-handling-with-automation-rules
  - title: Roles and permissions in the Microsoft Sentinel platform
    url: https://learn.microsoft.com/en-us/azure/sentinel/roles
