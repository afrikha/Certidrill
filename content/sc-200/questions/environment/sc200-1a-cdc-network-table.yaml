id: sc200-1a-cdc-network-table
objective: "1.1.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso, Ltd. uses Microsoft Defender for Endpoint Plan 2 and a Microsoft Sentinel workspace connected to the Microsoft Defender portal. You created a custom data collection rule that collects all the network connections made by the administrative workstations.

    A threat hunter needs to query the events collected by this rule.

    Which table should the threat hunter query?
  fr: |
    Contoso, Ltd. utilise Microsoft Defender pour point de terminaison Plan 2 et un espace de travail Microsoft Sentinel connecté au portail Microsoft Defender. Vous avez créé une règle de collecte de données personnalisée qui collecte toutes les connexions réseau établies par les postes d'administration.

    Un chasseur de menaces doit interroger les événements collectés par cette règle.

    Quelle table le chasseur de menaces doit-il interroger ?
body:
  options:
    - { id: a, text: DeviceNetworkEvents }
    - { id: b, text: DeviceCustomNetworkEvents }
    - { id: c, text: CommonSecurityLog }
    - { id: d, text: DeviceCustomProcessEvents }
answer: { optionId: b }
explanation:
  correct:
    en: Custom data collection writes its events to dedicated tables in the Sentinel workspace. Network connections, with their IP addresses, ports and protocols, go to `DeviceCustomNetworkEvents`; the other tables are `DeviceCustomProcessEvents`, `DeviceCustomFileEvents`, `DeviceCustomImageLoadEvents` and `DeviceCustomScriptEvents`.
    fr: La collecte de données personnalisée écrit ses événements dans des tables dédiées de l'espace de travail Sentinel. Les connexions réseau, avec leurs adresses IP, ports et protocoles, vont dans `DeviceCustomNetworkEvents` ; les autres tables sont `DeviceCustomProcessEvents`, `DeviceCustomFileEvents`, `DeviceCustomImageLoadEvents` et `DeviceCustomScriptEvents`.
  options:
    a:
      en: "`DeviceNetworkEvents` holds the default, filtered Defender for Endpoint telemetry, not the events of custom collection rules."
      fr: "`DeviceNetworkEvents` contient la télémétrie par défaut, filtrée, de Defender pour point de terminaison, pas les événements des règles de collecte personnalisée."
    c:
      en: "`CommonSecurityLog` stores CEF messages from network appliances, not endpoint events."
      fr: "`CommonSecurityLog` stocke les messages CEF des appliances réseau, pas les événements des points de terminaison."
    d:
      en: "`DeviceCustomProcessEvents` receives process events from custom rules, not network connections."
      fr: "`DeviceCustomProcessEvents` reçoit les événements de processus des règles personnalisées, pas les connexions réseau."
references:
  - title: Custom data collection in Microsoft Defender for Endpoint
    url: https://learn.microsoft.com/en-us/defender-endpoint/custom-data-collection
