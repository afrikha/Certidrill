id: sc200-1c-wef-subscriptions
objective: "1.3.3"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Litware designs its Windows Event Forwarding subscriptions. A baseline subscription will collect a low volume of events, and a suspect subscription will collect detailed events from devices under investigation. The events will then be collected into Microsoft Sentinel through the Windows Forwarded Events connector.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware conçoit ses abonnements de transfert d'événements Windows. Un abonnement de base (baseline) collectera un faible volume d'événements, et un abonnement suspect collectera des événements détaillés sur les appareils faisant l'objet d'une enquête. Les événements seront ensuite collectés dans Microsoft Sentinel par le connecteur Windows Forwarded Events.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: The baseline subscription enrolls all the devices of the organization, while only the devices that you add are in the suspect subscription.
        fr: L'abonnement de base inscrit tous les appareils de l'organisation, tandis que seuls les appareils que vous ajoutez font partie de l'abonnement suspect.
    - id: s2
      text:
        en: By default, a new subscription also forwards the events that a device logged before it received the subscription.
        fr: Par défaut, un nouvel abonnement transfère aussi les événements qu'un appareil a journalisés avant de recevoir l'abonnement.
    - id: s3
      text:
        en: The suspect subscription can be configured as both source-initiated and collector-initiated.
        fr: L'abonnement suspect peut être configuré à la fois comme initié par la source et comme initié par le collecteur.
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: The baseline subscription enrolls every device, and the suspect (targeted) subscription only includes the devices you add. By default, Windows Event Forwarding sends only the events generated after the client received the subscription, which is why Microsoft recommends enabling the read existing events option on the targeted subscription. A subscription is either push or pull, never both.
    fr: L'abonnement de base inscrit tous les appareils, et l'abonnement suspect (ciblé) n'inclut que les appareils ajoutés. Par défaut, le transfert d'événements Windows n'envoie que les événements générés après la réception de l'abonnement par le client ; c'est pourquoi Microsoft recommande d'activer l'option de lecture des événements existants sur l'abonnement ciblé. Un abonnement est soit push, soit pull, jamais les deux.
references:
  - title: Use Windows Event Forwarding to help with intrusion detection
    url: https://learn.microsoft.com/en-us/windows/security/operating-system-security/device-management/use-windows-event-forwarding-to-assist-in-intrusion-detection
