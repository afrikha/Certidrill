id: sc200-1b-wb-contributor-role
objective: "1.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam, Inc. uses Microsoft Sentinel. A SOC analyst named Analyst1 has the Microsoft Sentinel Responder role on the resource group that contains the workspace.

    Analyst1 must create, save and delete custom workbooks. Analyst1 must not be able to create or edit analytics rules.

    Which additional role should you assign to Analyst1 on the resource group?
  fr: |
    Fabrikam, Inc. utilise Microsoft Sentinel. Un analyste SOC nommé Analyst1 a le rôle Microsoft Sentinel Responder sur le groupe de ressources qui contient l'espace de travail.

    Analyst1 doit créer, enregistrer et supprimer des classeurs personnalisés. Analyst1 ne doit pas pouvoir créer ni modifier de règles d'analyse.

    Quel rôle supplémentaire devez-vous attribuer à Analyst1 sur le groupe de ressources ?
body:
  options:
    - { id: a, text: Workbook Contributor }
    - { id: b, text: Microsoft Sentinel Contributor }
    - { id: c, text: Workbook Reader }
    - { id: d, text: Microsoft Sentinel Playbook Operator }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Workbooks are Azure resources saved in the workspace's resource group. A user with a lesser Microsoft Sentinel role, such as Reader or Responder, needs Workbook Contributor to create and delete workbooks. This role doesn't grant analytics rule permissions.
    fr: |
      Les classeurs sont des ressources Azure enregistrées dans le groupe de ressources de l'espace de travail. Un utilisateur qui a un rôle Microsoft Sentinel inférieur, comme Reader ou Responder, a besoin de Workbook Contributor pour créer et supprimer des classeurs. Ce rôle n'accorde aucune autorisation sur les règles d'analyse.
  options:
    b: { en: "Sentinel Contributor can manage workbooks but also creates and edits analytics rules, which is forbidden.", fr: "Sentinel Contributor peut gérer les classeurs, mais crée et modifie aussi des règles d'analyse, ce qui est interdit." }
    c: { en: "Workbook Reader lets users view workbooks, not save or delete them.", fr: "Workbook Reader permet de consulter les classeurs, pas de les enregistrer ni de les supprimer." }
    d: { en: "Playbook Operator runs playbooks; it has no workbook permissions.", fr: "Playbook Operator exécute des playbooks ; il n'a aucune autorisation sur les classeurs." }
references:
  - title: Roles and permissions in the Microsoft Sentinel platform
    url: https://learn.microsoft.com/en-us/azure/sentinel/roles
  - title: Visualize your data by using workbooks in Microsoft Sentinel
    url: https://learn.microsoft.com/en-us/azure/sentinel/monitor-your-data
