id: sc200-1d-mg-sentinel-list
objective: "1.4.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam uses Microsoft Defender XDR and has onboarded a single Microsoft Sentinel workspace to the Microsoft Defender portal. The workspace contains 25 scheduled analytics rules. The SOC has also created 15 custom detection rules.

    You open **Hunting** > **Custom detection rules**.

    Which two statements are true?

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam utilise Microsoft Defender XDR et a intégré un seul espace de travail Microsoft Sentinel au portail Microsoft Defender. L'espace de travail contient 25 règles d'analytique planifiées. Le SOC a aussi créé 15 règles de détection personnalisées.

    Vous ouvrez **Repérage** > **Règles de détection personnalisées**.

    Quelles sont les deux affirmations vraies ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "You can select Run on a Sentinel analytics rule to run it immediately.", fr: "Vous pouvez sélectionner Run sur une règle d'analytique Sentinel pour l'exécuter immédiatement." } }
    - { id: b, text: { en: "The list shows the Sentinel analytics rules together with the custom detection rules.", fr: "La liste affiche les règles d'analytique Sentinel avec les règles de détection personnalisées." } }
    - { id: c, text: { en: "You can find a rule by entering its name or its rule ID in the search box.", fr: "Vous pouvez trouver une règle en saisissant son nom ou son ID de règle dans la zone de recherche." } }
    - { id: d, text: { en: "The Last run status column shows whether each Sentinel analytics rule ran successfully.", fr: "La colonne Last run status indique si chaque règle d'analytique Sentinel s'est exécutée correctement." } }
    - { id: e, text: { en: "You can filter the list by Workspace name to separate the rules of each workspace.", fr: "Vous pouvez filtrer la liste par Workspace name pour séparer les règles de chaque espace de travail." } }
answer: { optionIds: [ b, c ] }
explanation:
  correct:
    en: Once a Sentinel workspace is onboarded to the Defender portal, its analytics rules appear in the same Custom detection rules list. The search box finds a rule by its name or ID.
    fr: Une fois un espace de travail Sentinel intégré au portail Defender, ses règles d'analytique apparaissent dans la même liste des règles de détection personnalisées. La zone de recherche trouve une règle par son nom ou son ID.
  options:
    a: { en: "Run is available only for custom detection rules.", fr: "Run n'est disponible que pour les règles de détection personnalisées." }
    d: { en: "Last run status is shown only for custom detection rules.", fr: "Last run status n'est affiché que pour les règles de détection personnalisées." }
    e: { en: "The Workspace ID and Workspace name filters are available only in organizations that onboarded several workspaces.", fr: "Les filtres Workspace ID et Workspace name ne sont disponibles que dans les organisations qui ont intégré plusieurs espaces de travail." }
references:
  - title: Manage existing custom detection rules
    url: https://learn.microsoft.com/en-us/defender-xdr/custom-detection-manage
