id: sc200-1a-cdc-verify-kql
objective: "1.1.5"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    Adatum Corporation uses custom data collection rules in Microsoft Defender for Endpoint Plan 2. The device ID of a pilot device is **a1b2c3d4e5**.

    You need a query that confirms which rules collect data from this device, how many events each rule collected, and in which custom table the events are stored.

    How should you complete the query? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum Corporation utilise des règles de collecte de données personnalisée dans Microsoft Defender pour point de terminaison Plan 2. L'ID d'appareil d'un appareil pilote est **a1b2c3d4e5**.

    Vous avez besoin d'une requête qui confirme quelles règles collectent des données sur cet appareil, combien d'événements chaque règle a collectés et dans quelle table personnalisée les événements sont stockés.

    Comment devez-vous compléter la requête ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: kusto
  template: |
    [[op]] (DeviceCustomFileEvents, DeviceCustomNetworkEvents, DeviceCustomProcessEvents) "a1b2c3d4e5"
    | where DeviceId == "a1b2c3d4e5"
    | summarize EventCount = [[agg]] by RuleName, [[tbl]]
  slots:
    - id: op
      options:
        - { id: search, text: search in }
        - { id: union, text: union }
        - { id: lookup, text: lookup }
        - { id: join, text: join kind=inner }
    - id: agg
      options:
        - { id: count, text: count() }
        - { id: dcount, text: dcount(DeviceId) }
        - { id: makeset, text: make_set(RuleName) }
    - id: tbl
      options:
        - { id: table, text: $table }
        - { id: left, text: $left }
        - { id: tablename, text: TableName }
answer:
  values: { op: search, agg: count, tbl: table }
explanation:
  correct:
    en: "`search in (table1, table2, ...) \"term\"` searches the listed tables for the term and adds a `$table` column that holds the name of the table of each record. `count()` then gives the number of events per rule and per table. This is the verification query that Microsoft documents for custom data collection."
    fr: "`search in (table1, table2, ...) \"terme\"` recherche le terme dans les tables listées et ajoute une colonne `$table` qui contient le nom de la table de chaque enregistrement. `count()` donne ensuite le nombre d'événements par règle et par table. C'est la requête de vérification que Microsoft documente pour la collecte de données personnalisée."
  options:
    union: { en: "union combines tables but doesn't accept a search term after the table list.", fr: "union combine des tables mais n'accepte pas de terme de recherche après la liste des tables." }
    lookup: { en: "lookup extends a fact table with columns from a dimension table; it doesn't search a list of tables.", fr: "lookup enrichit une table de faits avec les colonnes d'une table de dimension ; il ne recherche pas dans une liste de tables." }
    join: { en: "join combines two tables on keys; it doesn't take a list of tables.", fr: "join combine deux tables sur des clés ; il n'accepte pas une liste de tables." }
    dcount: { en: "dcount(DeviceId) would return 1 for this single device, not the number of events.", fr: "dcount(DeviceId) renverrait 1 pour cet appareil unique, pas le nombre d'événements." }
    makeset: { en: "make_set returns an array of rule names, not a count.", fr: "make_set renvoie un tableau de noms de règles, pas un nombre." }
    left: { en: "$left is used to reference the left table in join conditions.", fr: "$left sert à référencer la table de gauche dans les conditions de join." }
    tablename: { en: "No TableName column is added by search; the column is $table.", fr: "search n'ajoute pas de colonne TableName ; la colonne s'appelle $table." }
references:
  - title: Create and manage custom data collection rules in Microsoft Defender for Endpoint
    url: https://learn.microsoft.com/en-us/defender-endpoint/create-custom-data-collection-rules
  - title: Custom data collection in Microsoft Defender for Endpoint
    url: https://learn.microsoft.com/en-us/defender-endpoint/custom-data-collection
