id: sc200-1c-ti-method-map
objective: "1.3.6"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Proseware must bring threat intelligence from three sources into its Microsoft Sentinel workspace.

    Which ingestion method should you use for each source? To answer, drag the appropriate methods to the correct sources. Each method may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware doit intégrer dans son espace de travail Microsoft Sentinel du renseignement sur les menaces provenant de trois sources.

    Quelle méthode d'ingestion devez-vous utiliser pour chaque source ? Pour répondre, faites glisser les méthodes appropriées vers les sources correspondantes. Chaque méthode peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: taxii, text: Threat Intelligence - TAXII data connector }
    - { id: upload, text: { en: "Threat Intelligence upload API", fr: "API de chargement du renseignement sur les menaces" } }
    - { id: manual, text: { en: "Manual creation in Intel management", fr: "Création manuelle dans Intel management" } }
    - { id: tip, text: Threat Intelligence Platforms data connector }
    - { id: lia, text: { en: "Logs Ingestion API", fr: "API d'ingestion de journaux" } }
  targets:
    - id: t1
      text: { en: "A partner ISAC exposes its indicators on a TAXII 2.1 server.", fr: "Un ISAC partenaire expose ses indicateurs sur un serveur TAXII 2.1." }
    - id: t2
      text: { en: "An in-house platform must push STIX 2.1 objects on a schedule. The integration must not rely on a deprecated connector.", fr: "Une plateforme interne doit pousser des objets STIX 2.1 selon une planification. L'intégration ne doit pas reposer sur un connecteur en cours de dépréciation." }
    - id: t3
      text: { en: "An analyst must add three IP addresses taken from an incident report.", fr: "Un analyste doit ajouter trois adresses IP issues d'un rapport d'incident." }
answer:
  mapping: { t1: taxii, t2: upload, t3: manual }
explanation:
  correct:
    en: The TAXII connector pulls indicators from TAXII 2.0 or 2.1 servers. The upload API lets a platform push STIX objects without a data connector. A few indicators are created manually in the management interface (Intel management in the Defender portal).
    fr: Le connecteur TAXII récupère les indicateurs de serveurs TAXII 2.0 ou 2.1. L'API de chargement permet à une plateforme de pousser des objets STIX sans connecteur de données. Quelques indicateurs se créent manuellement dans l'interface de gestion (Intel management dans le portail Defender).
  options:
    tip:
      en: The Threat Intelligence Platforms connector is legacy and being deprecated.
      fr: Le connecteur Threat Intelligence Platforms est hérité et en cours de dépréciation.
    lia:
      en: The Logs Ingestion API sends custom log data to a table through a data collection rule; it isn't the threat intelligence API.
      fr: L'API d'ingestion de journaux envoie des données de journaux personnalisées vers une table par une règle de collecte de données ; ce n'est pas l'API du renseignement sur les menaces.
references:
  - title: Threat intelligence in Microsoft Sentinel
    url: https://learn.microsoft.com/en-us/azure/sentinel/understand-threat-intelligence
