id: sc200-1c-act-method-map
objective: "1.3.5"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Northwind Traders sends Azure logs to its Microsoft Sentinel workspace **law-nw**. The solution must minimize administrative effort for each requirement.

    Which method should you use for each requirement? To answer, drag the appropriate methods to the correct requirements. Each method may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind Traders envoie des journaux Azure vers son espace de travail Microsoft Sentinel **law-nw**. La solution doit réduire au minimum l'effort d'administration pour chaque exigence.

    Quelle méthode devez-vous utiliser pour chaque exigence ? Pour répondre, faites glisser les méthodes appropriées vers les exigences correspondantes. Chaque méthode peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: diag, text: { en: "A diagnostic setting added on the resource", fr: "Un paramètre de diagnostic ajouté sur la ressource" } }
    - { id: policy, text: { en: "An Azure Policy assignment from the connector page, with a remediation task", fr: "Une attribution Azure Policy depuis la page du connecteur, avec une tâche de correction" } }
    - { id: activity, text: { en: "The Azure Activity connector", fr: "Le connecteur Azure Activity" } }
    - { id: ama, text: { en: "A data collection rule for the Azure Monitor Agent", fr: "Une règle de collecte de données pour l'agent Azure Monitor" } }
    - { id: lia, text: { en: "The Logs Ingestion API", fr: "L'API d'ingestion de journaux" } }
  targets:
    - id: t1
      text: { en: "Send the logs of one existing key vault used for a two-week test", fr: "Envoyer les journaux d'un coffre de clés existant utilisé pour un test de deux semaines" }
    - id: t2
      text: { en: "Make sure that every existing and future key vault of the subscription Sub-Prod sends its logs", fr: "S'assurer que tous les coffres de clés existants et futurs de l'abonnement Sub-Prod envoient leurs journaux" }
    - id: t3
      text: { en: "Record who creates resource groups and role assignments in the subscriptions", fr: "Enregistrer qui crée des groupes de ressources et des attributions de rôles dans les abonnements" }
answer:
  mapping: { t1: diag, t2: policy, t3: activity }
explanation:
  correct:
    en: For one resource, the standalone procedure is a diagnostic setting added on the resource with Send to Log Analytics workspace. Policy-managed connectors apply one diagnostic settings configuration to every resource of a type in a scope; the assignment covers future resources, and the remediation task covers existing ones. Subscription-level operations such as resource group and role assignment creation are in the activity log, collected by the Azure Activity connector.
    fr: Pour une seule ressource, la procédure autonome consiste à ajouter sur la ressource un paramètre de diagnostic avec Send to Log Analytics workspace. Les connecteurs gérés par Azure Policy appliquent une même configuration de paramètres de diagnostic à toutes les ressources d'un type dans une étendue ; l'attribution couvre les ressources futures, et la tâche de correction les ressources existantes. Les opérations au niveau de l'abonnement, comme la création de groupes de ressources et d'attributions de rôles, figurent dans le journal d'activité, collecté par le connecteur Azure Activity.
  options:
    ama:
      en: The Azure Monitor Agent collects data from machines, not the resource logs of PaaS services.
      fr: L'agent Azure Monitor collecte des données sur des machines, pas les journaux de ressources des services PaaS.
    lia:
      en: The Logs Ingestion API is for custom applications that push data; Azure resource logs use diagnostic settings.
      fr: L'API d'ingestion de journaux sert aux applications personnalisées qui poussent des données ; les journaux de ressources Azure utilisent les paramètres de diagnostic.
references:
  - title: Connect Microsoft Sentinel to other Microsoft services by using diagnostic settings-based connections
    url: https://learn.microsoft.com/en-us/azure/sentinel/connect-services-diagnostic-setting-based
