id: sc200-1b-ar-closed-notify
objective: "1.1.10"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Northwind Traders uses Microsoft Sentinel. A playbook named **pb-TeamsClosed** uses the incident trigger and posts a message in a Microsoft Teams channel. The Microsoft Sentinel service account already has permissions on the playbook's resource group.

    You need to run pb-TeamsClosed once each time an incident is closed. Comments added later to a closed incident must not run the playbook again.

    How should you configure the automation rule? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind Traders utilise Microsoft Sentinel. Un playbook nommé **pb-TeamsClosed** utilise le déclencheur d'incident et publie un message dans un canal Microsoft Teams. Le compte de service Microsoft Sentinel dispose déjà d'autorisations sur le groupe de ressources du playbook.

    Vous devez exécuter pb-TeamsClosed une fois chaque fois qu'un incident est fermé. Les commentaires ajoutés ensuite à un incident fermé ne doivent pas relancer le playbook.

    Comment devez-vous configurer la règle d'automatisation ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Trigger: [[trg]]

      Condition: Status [[cond]]

      Action: [[act]]
    fr: |
      Déclencheur : [[trg]]

      Condition : Status [[cond]]

      Action : [[act]]
  slots:
    - id: trg
      options:
        - { id: created, text: When incident is created }
        - { id: updated, text: When incident is updated }
        - { id: alert, text: When alert is created }
    - id: cond
      options:
        - { id: equals, text: Equals Closed }
        - { id: changedto, text: Changed to Closed }
        - { id: changedfrom, text: Changed from Closed }
    - id: act
      options:
        - { id: run, text: Run playbook pb-TeamsClosed }
        - { id: task, text: Add task }
        - { id: status, text: Change status }
answer:
  values: { trg: updated, cond: changedto, act: run }
explanation:
  correct:
    en: |
      Closing an incident is an update, so the rule uses When incident is updated. The Changed to Closed operator is true only for the update that sets the status to Closed; Equals Closed would also match a later comment on an incident that is already closed. Posting to Teams needs a connector, so the action runs the playbook.
    fr: |
      Fermer un incident est une mise à jour : la règle utilise When incident is updated. L'opérateur Changed to Closed n'est vrai que pour la mise à jour qui passe le statut à Closed ; Equals Closed correspondrait aussi à un commentaire ajouté plus tard à un incident déjà fermé. Publier dans Teams demande un connecteur : l'action exécute le playbook.
  options:
    created: { en: "A new incident is never closed at creation time in this scenario.", fr: "Dans ce scénario, un nouvel incident n'est jamais fermé au moment de sa création." }
    alert: { en: "The alert trigger runs alert playbooks when alerts are created; pb-TeamsClosed uses the incident trigger.", fr: "Le déclencheur d'alerte exécute des playbooks d'alerte à la création des alertes ; pb-TeamsClosed utilise le déclencheur d'incident." }
    changedfrom: { en: "Changed from Closed matches a reopened incident.", fr: "Changed from Closed correspond à un incident rouvert." }
references:
  - title: Create and use Microsoft Sentinel automation rules to manage response
    url: https://learn.microsoft.com/en-us/azure/sentinel/create-manage-use-automation-rules
