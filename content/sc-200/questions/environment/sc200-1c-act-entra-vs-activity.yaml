id: sc200-1c-act-entra-vs-activity
objective: "1.3.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Tailspin Toys has 12 Azure subscriptions and a Microsoft Sentinel workspace named **law-tailspin**. The SOC must hunt for the identities that delete virtual machines or change Azure role assignments in the subscriptions.

    Which data connector should you configure?
  fr: |
    Tailspin Toys dispose de 12 abonnements Azure et d'un espace de travail Microsoft Sentinel nommé **law-tailspin**. Le SOC doit rechercher les identités qui suppriment des machines virtuelles ou modifient des attributions de rôles Azure dans les abonnements.

    Quel connecteur de données devez-vous configurer ?
body:
  options:
    - { id: a, text: Microsoft Entra ID }
    - { id: b, text: Azure Activity }
    - { id: c, text: Windows Security Events via AMA }
    - { id: d, text: Microsoft Defender XDR }
answer: { optionId: b }
explanation:
  correct:
    en: Deleting a virtual machine and writing a role assignment are Azure Resource Manager operations recorded in the subscription activity log. The Azure Activity connector streams the activity log through diagnostic settings into `AzureActivity`, where the `Caller` column identifies who performed each operation.
    fr: La suppression d'une machine virtuelle et l'écriture d'une attribution de rôle sont des opérations Azure Resource Manager enregistrées dans le journal d'activité de l'abonnement. Le connecteur Azure Activity envoie le journal d'activité par les paramètres de diagnostic dans `AzureActivity`, où la colonne `Caller` identifie l'auteur de chaque opération.
  options:
    a:
      en: The Microsoft Entra ID connector brings directory audit and sign-in logs, not Azure Resource Manager operations.
      fr: Le connecteur Microsoft Entra ID apporte les journaux d'audit et de connexion de l'annuaire, pas les opérations Azure Resource Manager.
    c:
      en: This connector collects the Windows Security log inside servers, not Azure control-plane operations.
      fr: Ce connecteur collecte le journal Sécurité Windows à l'intérieur des serveurs, pas les opérations du plan de contrôle Azure.
    d:
      en: Defender XDR brings incidents, alerts and advanced hunting data of the Defender products, not the activity log.
      fr: Defender XDR apporte les incidents, les alertes et les données de repérage avancé des produits Defender, pas le journal d'activité.
references:
  - title: Connect Microsoft Sentinel to other Microsoft services by using diagnostic settings-based connections
    url: https://learn.microsoft.com/en-us/azure/sentinel/connect-services-diagnostic-setting-based
  - title: Azure Monitor Logs reference - AzureActivity
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/reference/tables/azureactivity
