id: sc200-1a-af-feature-mapping
objective: "1.1.3"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Tailspin Toys uses Microsoft Defender for Endpoint Plan 2. You are reviewing **Settings > Endpoints > Advanced features** in the Microsoft Defender portal.

    Which advanced feature should you turn on for each requirement? To answer, drag the appropriate features to the correct requirements. Each feature may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin Toys utilise Microsoft Defender pour point de terminaison Plan 2. Vous examinez **Paramètres > Points de terminaison > Fonctionnalités avancées** dans le portail Microsoft Defender.

    Quelle fonctionnalité avancée devez-vous activer pour chaque exigence ? Pour répondre, faites glisser les fonctionnalités appropriées vers les exigences correspondantes. Chaque fonctionnalité peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: intune, text: Microsoft Intune connection }
    - { id: disc, text: Device discovery }
    - { id: tamper, text: Tamper protection }
    - { id: auth, text: Authenticated telemetry }
    - { id: wcf, text: Web content filtering }
    - { id: mdca, text: Microsoft Defender for Cloud Apps }
  targets:
    - id: t1
      text: { en: "Use the device risk level in Conditional Access policies", fr: "Utiliser le niveau de risque des appareils dans les stratégies d'accès conditionnel" }
    - id: t2
      text: { en: "Find unmanaged devices on the corporate network by using onboarded devices", fr: "Trouver les appareils non gérés du réseau d'entreprise à l'aide des appareils intégrés" }
    - id: t3
      text: { en: "Prevent apps and users from changing Microsoft Defender Antivirus security settings", fr: "Empêcher les applications et les utilisateurs de modifier les paramètres de sécurité de l'Antivirus Microsoft Defender" }
    - id: t4
      text: { en: "Prevent spoofed telemetry from appearing in the dashboard", fr: "Empêcher qu'une télémétrie usurpée apparaisse dans le tableau de bord" }
answer:
  mapping: { t1: intune, t2: disc, t3: tamper, t4: auth }
explanation:
  correct:
    en: The **Microsoft Intune connection** shares device risk with Intune for risk-based Conditional Access (it must also be enabled in Intune). **Device discovery** uses onboarded devices to find unmanaged devices. **Tamper protection** locks Defender Antivirus settings. **Authenticated telemetry** prevents spoofed telemetry.
    fr: La **Microsoft Intune connection** partage le risque des appareils avec Intune pour l'accès conditionnel basé sur le risque (elle doit aussi être activée dans Intune). **Device discovery** utilise les appareils intégrés pour trouver les appareils non gérés. **Tamper protection** verrouille les paramètres de l'Antivirus Defender. **Authenticated telemetry** empêche la télémétrie usurpée.
  options:
    wcf: { en: "Web content filtering blocks website categories; it meets none of the requirements.", fr: "Le filtrage du contenu web bloque des catégories de sites ; il ne répond à aucune des exigences." }
    mdca: { en: "This integration forwards endpoint signals to Defender for Cloud Apps for cloud app visibility.", fr: "Cette intégration transmet les signaux des points de terminaison à Defender for Cloud Apps pour la visibilité sur les applications cloud." }
references:
  - title: Configure Advanced Features in Microsoft Defender for Endpoint
    url: https://learn.microsoft.com/en-us/defender-endpoint/advanced-features
