id: sc200-1b-rl-personas
objective: "1.2.1"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Proseware, Inc. uses Microsoft Sentinel. You need to assign Azure roles on the resource group that contains the workspace. Each principal must receive only the permissions it needs.

    Which role should you assign to each principal? To answer, drag the appropriate roles to the correct principals. Each role may be used once, more than once, or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware, Inc. utilise Microsoft Sentinel. Vous devez attribuer des rôles Azure sur le groupe de ressources qui contient l'espace de travail. Chaque principal ne doit recevoir que les autorisations dont il a besoin.

    Quel rôle devez-vous attribuer à chaque principal ? Pour répondre, faites glisser les rôles appropriés vers les principaux correspondants. Chaque rôle peut être utilisé une fois, plusieurs fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: true
  items:
    - { id: reader, text: Microsoft Sentinel Reader }
    - { id: responder, text: Microsoft Sentinel Responder }
    - { id: contributor, text: Microsoft Sentinel Contributor }
    - { id: owner, text: Owner }
    - { id: auto, text: Microsoft Sentinel Automation Contributor }
  targets:
    - id: t1
      text: { en: "Compliance officers: view incidents, data and workbooks", fr: "Responsables de la conformité : consulter les incidents, les données et les classeurs" }
    - id: t2
      text: { en: "Tier-2 analysts: assign incidents, change their status and severity, and add comments", fr: "Analystes de niveau 2 : attribuer des incidents, modifier leur statut et leur gravité, et ajouter des commentaires" }
    - id: t3
      text: { en: "A service principal used by a pipeline that deploys analytics rules", fr: "Un principal de service utilisé par un pipeline qui déploie des règles d'analyse" }
answer:
  mapping: { t1: reader, t2: responder, t3: contributor }
explanation:
  correct:
    en: |
      Microsoft Sentinel Reader views data, incidents, workbooks and recommendations. Responder adds incident management. Contributor adds the creation and editing of resources such as analytics rules, and Microsoft recommends it for a service principal that performs automated management tasks.
    fr: |
      Microsoft Sentinel Reader consulte les données, les incidents, les classeurs et les recommandations. Responder y ajoute la gestion des incidents. Contributor ajoute la création et la modification de ressources comme les règles d'analyse, et Microsoft le recommande pour un principal de service qui effectue des tâches de gestion automatisées.
  options:
    owner: { en: "Owner grants full access to every resource in the group, far beyond the needs.", fr: "Owner accorde un accès complet à toutes les ressources du groupe, bien au-delà des besoins." }
    auto: { en: "Automation Contributor is for the Microsoft Sentinel service account that runs playbooks from automation rules.", fr: "Automation Contributor est destiné au compte de service Microsoft Sentinel qui exécute les playbooks des règles d'automatisation." }
references:
  - title: Roles and permissions in the Microsoft Sentinel platform
    url: https://learn.microsoft.com/en-us/azure/sentinel/roles
