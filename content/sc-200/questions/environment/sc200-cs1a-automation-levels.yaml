id: sc200-cs1a-automation-levels
objective: "1.1.9"
type: dragdrop
caseStudy: sc200-cs1a-lamna-healthcare
difficulty: 2
status: draft
stem:
  en: |
    You need to configure the automation level of each device group to meet the automated remediation requirement.

    Which automation level should you configure for each device group? To answer, drag the appropriate automation levels to the correct device groups. Each automation level may be used once, more than once, or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez configurer le niveau d'automatisation de chaque groupe d'appareils pour respecter l'exigence de correction automatisée.

    Quel niveau d'automatisation devez-vous configurer pour chaque groupe d'appareils ? Pour répondre, faites glisser les niveaux d'automatisation appropriés vers les groupes d'appareils correspondants. Chaque niveau d'automatisation peut être utilisé une fois, plusieurs fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: true
  items:
    - { id: full, text: "Full - remediate threats automatically" }
    - { id: all, text: "Semi - require approval for all folders" }
    - { id: core, text: "Semi - require approval for core folders remediation" }
    - { id: nontemp, text: "Semi - require approval for non-temp folders remediation" }
    - { id: none, text: "No automated response" }
  targets:
    - { id: icu, text: ICU-Workstations }
    - { id: clinical, text: Clinical-Workstations }
    - { id: servers, text: Servers }
answer:
  mapping: { icu: all, clinical: full, servers: nontemp }
explanation:
  correct:
    en: "Semi - require approval for all folders runs automated investigations but puts every remediation action in the Pending tab of the Action center until an analyst approves it. Full - remediate threats automatically remediates malicious entities without waiting for approval. Semi - require approval for non-temp folders remediation remediates files in temporary folders (such as \\users\\*\\appdata\\local\\temp or \\windows\\temp) automatically and asks for approval everywhere else."
    fr: "Semi - require approval for all folders exécute les enquêtes automatisées, mais place chaque action de correction dans l'onglet En attente du centre de notifications jusqu'à l'approbation d'un analyste. Full - remediate threats automatically corrige les entités malveillantes sans attendre d'approbation. Semi - require approval for non-temp folders remediation corrige automatiquement les fichiers des dossiers temporaires (comme \\users\\*\\appdata\\local\\temp ou \\windows\\temp) et demande une approbation partout ailleurs."
  options:
    core: { en: "Core folders remediation requires approval only for files in core folders such as \\windows\\*; files in other non-temporary folders would be remediated automatically on the servers.", fr: "La correction des dossiers principaux ne demande une approbation que pour les fichiers des dossiers principaux comme \\windows\\* ; les fichiers des autres dossiers non temporaires seraient corrigés automatiquement sur les serveurs." }
    none: { en: "No automated response stops automated investigations from running, which violates the requirement that investigations run on every device group.", fr: "No automated response empêche les enquêtes automatisées de s'exécuter, ce qui enfreint l'exigence selon laquelle les enquêtes doivent s'exécuter sur tous les groupes d'appareils." }
references:
  - title: Automation levels in automated investigation and remediation
    url: https://learn.microsoft.com/en-us/defender-endpoint/automation-levels
