id: sc200-cs1b-ot-rule
objective: "1.4.3"
type: single
caseStudy: sc200-cs1b-city-power-light
difficulty: 1
status: draft
stem:
  en: |
    You need to create a Microsoft Sentinel analytics rule that queries the Syslog table to meet the OT detection requirement.

    Which type of analytics rule should you create?
  fr: |
    Vous devez créer une règle d'analytique Microsoft Sentinel qui interroge la table Syslog pour respecter l'exigence de détection OT.

    Quel type de règle d'analytique devez-vous créer ?
body:
  options:
    - { id: a, text: { en: "A scheduled rule that runs every five minutes", fr: "Une règle planifiée qui s'exécute toutes les cinq minutes" } }
    - { id: b, text: { en: "A near-real-time (NRT) rule", fr: "Une règle quasi en temps réel (NRT)" } }
    - { id: c, text: { en: "A threat intelligence rule", fr: "Une règle d'informations sur les menaces" } }
    - { id: d, text: { en: "An anomaly rule", fr: "Une règle d'anomalie" } }
answer: { optionId: b }
explanation:
  correct:
    en: "NRT rules are hard-coded to run every minute on the events ingested in the previous minute, with a two-minute delay. They query on ingestion time, so an alert is raised within the two minutes that the requirement allows."
    fr: "Les règles NRT sont programmées pour s'exécuter toutes les minutes sur les événements ingérés pendant la minute précédente, avec un délai de deux minutes. Elles s'appuient sur l'heure d'ingestion : une alerte est déclenchée dans les deux minutes autorisées par l'exigence."
  options:
    a: { en: "A scheduled rule has a built-in five-minute delay to account for ingestion lag, and running every five minutes adds up to five more minutes before detection.", fr: "Une règle planifiée comporte un délai intégré de cinq minutes pour tenir compte de la latence d'ingestion, et une exécution toutes les cinq minutes ajoute jusqu'à cinq minutes avant la détection." }
    c: { en: "A threat intelligence rule matches logs against threat indicators; it does not detect a configuration change message.", fr: "Une règle d'informations sur les menaces met en correspondance les journaux avec des indicateurs de menace ; elle ne détecte pas un message de modification de configuration." }
    d: { en: "Anomaly rules use machine learning to find deviations from a baseline; you cannot write a custom query for a specific message.", fr: "Les règles d'anomalie utilisent le Machine Learning pour trouver des écarts par rapport à une base de référence ; vous ne pouvez pas y écrire une requête personnalisée pour un message précis." }
references:
  - title: Quick threat detection with near-real-time (NRT) analytics rules in Microsoft Sentinel
    url: https://learn.microsoft.com/en-us/azure/sentinel/near-real-time-rules
