id: sc200-sr2-scanner-tuning-1
objective: "1.1.2"
type: series_yesno
series: sc200-sr2-scanner-tuning
seriesOrder: 1
difficulty: 2
status: draft
stem:
  en: You create an alert tuning rule with the Resolve alert action.
  fr: Vous créez une règle de réglage des alertes avec l'action Resolve alert.
body:
  solution:
    en: In **Settings > Microsoft Defender XDR > Alert tuning**, you add a rule for the **Microsoft Defender for Endpoint** service source with a file condition that matches **C:\Tools\NetScan\netscan.exe**, and you select the **Resolve alert** action.
    fr: Dans **Paramètres > Microsoft Defender XDR > Alert tuning**, vous ajoutez une règle pour la source de service **Microsoft Defender for Endpoint** avec une condition de fichier qui correspond à **C:\Tools\NetScan\netscan.exe**, et vous sélectionnez l'action **Resolve alert**.
answer: { value: false }
explanation:
  correct:
    en: The Resolve alert action does not stop incident creation. Matching alerts and their incidents are still created, only with the Resolved status, so the incidents keep appearing each week and the first requirement is not met.
    fr: "L'action Resolve alert n'empêche pas la création d'incidents. Les alertes correspondantes et leurs incidents sont toujours créés, simplement avec l'état Resolved : des incidents apparaissent encore chaque semaine et la première exigence n'est pas satisfaite."
references:
  - title: Investigate alerts in Microsoft Defender XDR
    url: https://learn.microsoft.com/en-us/defender-xdr/investigate-alerts
