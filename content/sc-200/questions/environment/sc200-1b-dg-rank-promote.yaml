id: sc200-1b-dg-rank-promote
objective: "1.1.9"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso, Ltd. uses Microsoft Defender for Endpoint Plan 2. The tenant has the following device groups.

    | Rank | Device group | Matching rule | Automation level |
    | --- | --- | --- | --- |
    | 1 | DG-Laptops | Tag equals Laptop | Full - remediate threats automatically |
    | 2 | DG-Finance | Tag equals Finance | Semi - require approval for all folders |

    Laptops used by the finance team have both the Laptop and Finance tags. You need to ensure that remediation actions on the finance laptops require approval. The solution must not change the settings of the other laptops and must minimize administrative effort.

    What should you do?
  fr: |
    Contoso, Ltd. utilise Microsoft Defender for Endpoint Plan 2. Le locataire contient les groupes d'appareils suivants.

    | Rang | Groupe d'appareils | Règle de correspondance | Niveau d'automatisation |
    | --- | --- | --- | --- |
    | 1 | DG-Laptops | Tag equals Laptop | Full - remediate threats automatically |
    | 2 | DG-Finance | Tag equals Finance | Semi - require approval for all folders |

    Les ordinateurs portables de l'équipe financière ont à la fois les étiquettes Laptop et Finance. Vous devez vous assurer que les actions de correction sur ces ordinateurs portables nécessitent une approbation. La solution ne doit pas modifier les paramètres des autres ordinateurs portables et doit réduire au minimum l'effort d'administration.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Set the automation level of DG-Laptops to Semi - require approval for all folders.", fr: "Définir le niveau d'automatisation de DG-Laptops sur Semi - require approval for all folders." } }
    - { id: b, text: { en: "Remove the Laptop tag from the finance laptops.", fr: "Supprimer l'étiquette Laptop des ordinateurs portables de l'équipe financière." } }
    - { id: c, text: { en: "Add a second condition to the DG-Finance matching rule for the Laptop tag.", fr: "Ajouter à la règle de correspondance de DG-Finance une seconde condition sur l'étiquette Laptop." } }
    - { id: d, text: { en: "Promote DG-Finance so that it is ranked above DG-Laptops.", fr: "Promouvoir DG-Finance pour qu'il soit classé au-dessus de DG-Laptops." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      A device that matches several device groups is added only to the highest-ranked group. The finance laptops currently join DG-Laptops (rank 1). Promoting DG-Finance to rank 1 makes them join DG-Finance and its semi-automation level, while the other laptops still match only DG-Laptops.
    fr: |
      Un appareil qui correspond à plusieurs groupes d'appareils n'est ajouté qu'au groupe de rang le plus élevé. Les ordinateurs portables de la finance rejoignent actuellement DG-Laptops (rang 1). Promouvoir DG-Finance au rang 1 les fait rejoindre DG-Finance et son niveau semi-automatique, tandis que les autres ordinateurs portables ne correspondent toujours qu'à DG-Laptops.
  options:
    a: { en: "This would also require approval on every other laptop.", fr: "Cela imposerait aussi l'approbation sur tous les autres ordinateurs portables." }
    b: { en: "Removing a tag from each device is more effort, and it breaks any other use of the tag; new finance laptops would need the same manual work.", fr: "Retirer une étiquette de chaque appareil demande plus d'effort et casse les autres usages de l'étiquette ; les nouveaux portables de la finance demanderaient le même travail manuel." }
    c: { en: "A stricter rule on DG-Finance doesn't change the ranking: the laptops still match DG-Laptops first.", fr: "Une règle plus stricte sur DG-Finance ne change pas le classement : les portables correspondent toujours d'abord à DG-Laptops." }
references:
  - title: Create and manage device groups in Microsoft Defender for Endpoint
    url: https://learn.microsoft.com/en-us/defender-endpoint/machine-groups
