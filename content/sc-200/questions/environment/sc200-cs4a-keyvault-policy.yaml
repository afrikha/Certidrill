id: sc200-cs4a-keyvault-policy
objective: "1.3.5"
type: single
caseStudy: sc200-cs4a-munsons
difficulty: 1
status: draft
stem:
  en: |
    You need to meet the key vault logs requirement.

    What should you do?
  fr: |
    Vous devez respecter l'exigence relative aux journaux des coffres de clés.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text:
        en: From the Azure Key Vault data connector, launch the Azure Policy Assignment wizard, scope it to Sub-Plant, and select Create a remediation task.
        fr: Depuis le connecteur de données Azure Key Vault, lancer l'Azure Policy Assignment wizard, l'étendre à Sub-Plant et sélectionner Create a remediation task.
    - id: b
      text:
        en: From the Azure Key Vault data connector, launch the Azure Policy Assignment wizard, scope it to Sub-Plant, and keep the default remediation settings.
        fr: Depuis le connecteur de données Azure Key Vault, lancer l'Azure Policy Assignment wizard, l'étendre à Sub-Plant et conserver les paramètres de correction par défaut.
    - id: c
      text:
        en: On each of the 14 key vaults, create a diagnostic setting that sends the logs to law-munsons-soc.
        fr: Sur chacun des 14 coffres de clés, créer un paramètre de diagnostic qui envoie les journaux à law-munsons-soc.
    - id: d
      text:
        en: Create a data collection rule in Sub-Plant that selects the 14 key vaults as resources and sends their logs to law-munsons-soc.
        fr: Créer dans Sub-Plant une règle de collecte de données qui sélectionne les 14 coffres de clés comme ressources et envoie leurs journaux à law-munsons-soc.
answer: { optionId: a }
explanation:
  correct:
    en: |
      Azure Policy-managed connectors apply one diagnostic settings configuration to every resource of a type in the chosen scope. The policy applies automatically to resources created later; to apply it to the 14 existing key vaults as well, you select Create a remediation task on the Remediation tab. Assigning the policy requires the Owner role on the scope, which you have on Sub-Plant.
    fr: |
      Les connecteurs gérés par Azure Policy appliquent une même configuration de paramètres de diagnostic à toutes les ressources d'un type dans l'étendue choisie. La stratégie s'applique automatiquement aux ressources créées ensuite ; pour l'appliquer aussi aux 14 coffres de clés existants, vous sélectionnez Create a remediation task dans l'onglet Remediation. L'attribution de la stratégie exige le rôle Owner sur l'étendue, que vous détenez sur Sub-Plant.
  options:
    b:
      en: Without a remediation task, the policy only configures key vaults created after the assignment; the 14 existing key vaults keep sending nothing.
      fr: Sans tâche de correction, la stratégie ne configure que les coffres de clés créés après l'attribution ; les 14 coffres existants continuent de ne rien envoyer.
    c:
      en: Manual diagnostic settings cover the existing key vaults only, so every future key vault would need another manual setting, which increases administrative effort.
      fr: |
        Des paramètres de diagnostic manuels ne couvrent que les coffres de clés existants : chaque futur coffre exigerait un nouveau paramètre manuel, ce qui augmente l'effort d'administration.
    d:
      en: Key vault resource logs are collected through diagnostic settings, not through Azure Monitor Agent data collection rules, which target machines.
      fr: Les journaux de ressources des coffres de clés sont collectés par des paramètres de diagnostic, pas par des règles de collecte de données de l'agent Azure Monitor, qui ciblent des machines.
references:
  - title: Connect Microsoft Sentinel to other Microsoft services by using diagnostic settings-based connections
    url: https://learn.microsoft.com/en-us/azure/sentinel/connect-services-diagnostic-setting-based
