id: sc200-1c-wse-xpath-rules
objective: "1.3.2"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    You configure the Custom event set of a Windows Security Events via AMA data collection rule for the Microsoft Sentinel workspace **law-woodgrove**. You plan to filter events with XPath queries such as `Security!*[System[(EventID=4625)]]`.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous configurez le jeu d'événements Custom d'une règle de collecte de données Windows Security Events via AMA pour l'espace de travail Microsoft Sentinel **law-woodgrove**. Vous prévoyez de filtrer les événements avec des requêtes XPath comme `Security!*[System[(EventID=4625)]]`.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: You can select events whose process name includes a given string by using the `contains()` function in the XPath query.
        fr: Vous pouvez sélectionner les événements dont le nom de processus inclut une chaîne donnée avec la fonction `contains()` dans la requête XPath.
    - id: s2
      text:
        en: Events that the XPath queries exclude are filtered on the server and aren't sent to the workspace.
        fr: Les événements exclus par les requêtes XPath sont filtrés sur le serveur et ne sont pas envoyés à l'espace de travail.
    - id: s3
      text:
        en: To test the query with `Get-WinEvent`, you pass the part before the `!` character as the `-LogName` value and the rest as the `-FilterXPath` value.
        fr: Pour tester la requête avec `Get-WinEvent`, vous passez la partie située avant le caractère `!` comme valeur de `-LogName` et le reste comme valeur de `-FilterXPath`.
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: The Azure Monitor Agent supports XPath 1.0 only, and functions such as `contains` and `starts-with` aren't supported. The agent filters at the source, so excluded events are never ingested, which reduces cost. You validate a query locally with `Get-WinEvent -LogName 'Security' -FilterXPath '*[System[(EventID=4625)]]'`.
    fr: "L'agent Azure Monitor ne prend en charge que XPath 1.0, et des fonctions comme `contains` et `starts-with` ne sont pas prises en charge. L'agent filtre à la source : les événements exclus ne sont jamais ingérés, ce qui réduit le coût. Vous validez une requête en local avec `Get-WinEvent -LogName 'Security' -FilterXPath '*[System[(EventID=4625)]]'`."
references:
  - title: Collect Windows events from virtual machines with Azure Monitor Agent
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/vm/data-collection-windows-events
  - title: Connect Microsoft Sentinel to other Microsoft services with a Windows agent-based data connector
    url: https://learn.microsoft.com/en-us/azure/sentinel/connect-services-windows-based
