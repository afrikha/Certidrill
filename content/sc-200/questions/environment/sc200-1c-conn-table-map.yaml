id: sc200-1c-conn-table-map
objective: "1.3.1"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Tailspin Toys connects several data sources to its Microsoft Sentinel workspace. An analyst must write hunting queries on each source.

    Which table stores the data of each source? To answer, drag the appropriate tables to the correct sources. Each table may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin Toys connecte plusieurs sources de données à son espace de travail Microsoft Sentinel. Un analyste doit écrire des requêtes de chasse sur chaque source.

    Quelle table stocke les données de chaque source ? Pour répondre, faites glisser les tables appropriées vers les sources correspondantes. Chaque table peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: noninter, text: AADNonInteractiveUserSignInLogs }
    - { id: signin, text: SigninLogs }
    - { id: csl, text: CommonSecurityLog }
    - { id: winevent, text: WindowsEvent }
    - { id: secevent, text: SecurityEvent }
    - { id: dns, text: ASimDnsActivityLogs }
  targets:
    - id: t1
      text: { en: "Non-interactive user sign-ins collected by the Microsoft Entra ID connector", fr: "Connexions utilisateur non interactives collectées par le connecteur Microsoft Entra ID" }
    - id: t2
      text: { en: "CEF messages from a Check Point firewall collected by the Common Event Format (CEF) via AMA connector", fr: "Messages CEF d'un pare-feu Check Point collectés par le connecteur Common Event Format (CEF) via AMA" }
    - id: t3
      text: { en: "Security events of a Windows Event Collector collected by the Windows Forwarded Events connector", fr: "Événements de sécurité d'un collecteur d'événements Windows collectés par le connecteur Windows Forwarded Events" }
    - id: t4
      text: { en: "DNS analytical logs collected by the Windows DNS Events via AMA connector", fr: "Journaux analytiques DNS collectés par le connecteur Windows DNS Events via AMA" }
answer:
  mapping: { t1: noninter, t2: csl, t3: winevent, t4: dns }
explanation:
  correct:
    en: The Microsoft Entra ID connector writes non-interactive sign-ins to `AADNonInteractiveUserSignInLogs` (interactive sign-ins go to `SigninLogs`). CEF via AMA writes to `CommonSecurityLog`. Events collected through Windows Event Forwarding, including Security log events, go to `WindowsEvent`, not `SecurityEvent`. Windows DNS Events via AMA writes to `ASimDnsActivityLogs`.
    fr: Le connecteur Microsoft Entra ID écrit les connexions non interactives dans `AADNonInteractiveUserSignInLogs` (les connexions interactives vont dans `SigninLogs`). CEF via AMA écrit dans `CommonSecurityLog`. Les événements collectés par le transfert d'événements Windows, y compris ceux du journal Sécurité, vont dans `WindowsEvent`, pas dans `SecurityEvent`. Windows DNS Events via AMA écrit dans `ASimDnsActivityLogs`.
references:
  - title: Send data to Microsoft Sentinel using the Microsoft Entra ID data connector
    url: https://learn.microsoft.com/en-us/azure/sentinel/connect-azure-active-directory
  - title: Connect Microsoft Sentinel to other Microsoft services with a Windows agent-based data connector
    url: https://learn.microsoft.com/en-us/azure/sentinel/connect-services-windows-based
