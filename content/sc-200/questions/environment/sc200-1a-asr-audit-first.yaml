id: sc200-1a-asr-audit-first
objective: "1.1.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso, Ltd. uses Microsoft Defender for Endpoint Plan 2. The IT team uses PsExec to administer servers. You plan to deploy the ASR rule **Block process creations originating from PSExec and WMI commands**.

    You need to measure which legitimate processes the rule would affect before you enforce it. The rule must not interrupt any user or administrator during the evaluation.

    Which mode should you configure for the rule?
  fr: |
    Contoso, Ltd. utilise Microsoft Defender pour point de terminaison Plan 2. L'équipe informatique utilise PsExec pour administrer les serveurs. Vous prévoyez de déployer la règle ASR **Block process creations originating from PSExec and WMI commands**.

    Vous devez mesurer quels processus légitimes la règle affecterait avant de l'appliquer. La règle ne doit interrompre aucun utilisateur ni administrateur pendant l'évaluation.

    Quel mode devez-vous configurer pour la règle ?
body:
  options:
    - { id: a, text: Warn }
    - { id: b, text: Block }
    - { id: c, text: Audit }
    - { id: d, text: Not configured }
answer: { optionId: c }
explanation:
  correct:
    en: "**Audit** mode only logs the events that the rule would have blocked, so you can review them in the Defender portal or in advanced hunting without affecting anyone. Microsoft recommends testing rules other than the standard protection rules in Audit mode before you switch them to Block."
    fr: "Le mode **Audit** se contente de journaliser les événements que la règle aurait bloqués : vous pouvez les examiner dans le portail Defender ou dans le repérage avancé sans gêner personne. Microsoft recommande de tester en mode Audit les règles autres que les règles de protection standard avant de les passer en Block."
  options:
    a:
      en: Warn blocks the process and shows a notification that the user can bypass, so it still interrupts users.
      fr: "Warn bloque le processus et affiche une notification que l'utilisateur peut contourner : il interrompt donc toujours les utilisateurs."
    b:
      en: Block enforces the rule immediately and would stop legitimate PsExec use.
      fr: Block applique la règle immédiatement et arrêterait l'utilisation légitime de PsExec.
    d:
      en: Not configured applies no setting, so no events are recorded for the evaluation.
      fr: "Not configured n'applique aucun paramètre : aucun événement n'est enregistré pour l'évaluation."
references:
  - title: Configure ASR rules and exclusions
    url: https://learn.microsoft.com/en-us/defender-endpoint/enable-attack-surface-reduction
