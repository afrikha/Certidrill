id: sc200-1c-wse-ordering
objective: "1.3.2"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    Adatum has an on-premises physical server named **SRV-FS01** that runs Windows Server 2022. Adatum has a Microsoft Sentinel workspace named **law-adatum**, and the Windows Security Events solution is installed from the Content hub.

    You need to collect the Common event set of the Security log of SRV-FS01. The solution must minimize administrative effort.

    Which five actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Adatum dispose d'un serveur physique local nommé **SRV-FS01** qui exécute Windows Server 2022. Adatum dispose d'un espace de travail Microsoft Sentinel nommé **law-adatum**, et la solution Windows Security Events est installée depuis le hub de contenu.

    Vous devez collecter le jeu d'événements Common du journal Sécurité de SRV-FS01. La solution doit réduire au minimum l'effort d'administration.

    Quelles sont les cinq actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 5
  actions:
    - { id: arc, text: { en: "Onboard SRV-FS01 to Azure Arc.", fr: "Intégrer SRV-FS01 à Azure Arc." } }
    - { id: basics, text: { en: "On the Windows Security Events via AMA connector page, select +Add data collection rule and complete the Basics tab.", fr: "Dans la page du connecteur Windows Security Events via AMA, sélectionner +Add data collection rule et remplir l'onglet Basics." } }
    - { id: res, text: { en: "On the Resources tab, add SRV-FS01.", fr: "Dans l'onglet Resources, ajouter SRV-FS01." } }
    - { id: collect, text: { en: "On the Collect tab, select Common.", fr: "Dans l'onglet Collect, sélectionner Common." } }
    - { id: create, text: { en: "Select Next: Review + create, and then select Create.", fr: "Sélectionner Next: Review + create, puis Create." } }
    - { id: mma, text: { en: "Install the Log Analytics agent on SRV-FS01.", fr: "Installer l'agent Log Analytics sur SRV-FS01." } }
    - { id: diag, text: { en: "Add a diagnostic setting to law-adatum that collects Security events.", fr: "Ajouter à law-adatum un paramètre de diagnostic qui collecte les événements de sécurité." } }
answer:
  sequence: [ arc, basics, res, collect, create ]
explanation:
  correct:
    en: A machine that isn't an Azure VM must be onboarded to Azure Arc before you enable an AMA-based connector, otherwise it can't be selected on the Resources tab. The data collection rule wizard then runs Basics, Resources and Collect before Review + create, and it installs the Azure Monitor Agent on the selected machines that don't have it, so no separate agent installation is needed.
    fr: "Une machine qui n'est pas une machine virtuelle Azure doit être intégrée à Azure Arc avant l'activation d'un connecteur basé sur AMA, sinon elle ne peut pas être sélectionnée dans l'onglet Resources. L'assistant de règle de collecte de données enchaîne ensuite Basics, Resources et Collect avant Review + create, et il installe l'agent Azure Monitor sur les machines sélectionnées qui ne l'ont pas : aucune installation d'agent séparée n'est nécessaire."
  options:
    mma:
      en: The Log Analytics agent is retired; the connector uses the Azure Monitor Agent.
      fr: L'agent Log Analytics est retiré ; le connecteur utilise l'agent Azure Monitor.
    diag:
      en: Diagnostic settings export Azure resource logs; they don't collect Windows events from a server.
      fr: Les paramètres de diagnostic exportent les journaux de ressources Azure ; ils ne collectent pas les événements Windows d'un serveur.
references:
  - title: Connect Microsoft Sentinel to other Microsoft services with a Windows agent-based data connector
    url: https://learn.microsoft.com/en-us/azure/sentinel/connect-services-windows-based
