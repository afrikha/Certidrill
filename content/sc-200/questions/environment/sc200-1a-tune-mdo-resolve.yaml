id: sc200-1a-tune-mdo-resolve
objective: "1.1.2"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    Contoso, Ltd. uses Microsoft Defender XDR, Microsoft Defender for Endpoint and Microsoft Defender for Office 365. A monthly mail flow test sends test messages that trigger a known Defender for Office 365 alert.

    The alerts and their incidents must still be recorded, but analysts must not have to triage or close them. The solution must not require code.

    How should you configure the solution? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso, Ltd. utilise Microsoft Defender XDR, Microsoft Defender pour point de terminaison et Microsoft Defender pour Office 365. Un test mensuel du flux de messagerie envoie des messages de test qui déclenchent une alerte Defender pour Office 365 connue.

    Les alertes et leurs incidents doivent toujours être enregistrés, mais les analystes ne doivent pas avoir à les trier ni à les fermer. La solution ne doit pas nécessiter de code.

    Comment devez-vous configurer la solution ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Create the rule in: [[page]]
      Service source: [[source]]
      Action: [[action]]
    fr: |
      Créer la règle dans : [[page]]
      Source de service : [[source]]
      Action : [[action]]
  slots:
    - id: page
      options:
        - { id: tuning, text: "Settings > Microsoft Defender XDR > Alert tuning" }
        - { id: ind, text: "Settings > Endpoints > Indicators" }
        - { id: excl, text: "Settings > Endpoints > Automation folder exclusions" }
    - id: source
      options:
        - { id: mdo, text: Microsoft Defender for Office 365 }
        - { id: mde, text: Microsoft Defender for Endpoint }
        - { id: mdi, text: Microsoft Defender for Identity }
    - id: action
      options:
        - { id: hide, text: Hide alert }
        - { id: resolve, text: Resolve alert }
        - { id: behavior, text: Set as behavior }
answer:
  values: { page: tuning, source: mdo, action: resolve }
explanation:
  correct:
    en: Alert tuning rules are created in Settings > Microsoft Defender XDR > Alert tuning, for the service source that raises the alert, here Defender for Office 365. **Resolve alert** creates the matching alerts and their incidents with a resolved status, so they are recorded without any triage.
    fr: "Les règles de réglage des alertes se créent dans Paramètres > Microsoft Defender XDR > Alert tuning, pour la source de service qui génère l'alerte, ici Defender pour Office 365. **Resolve alert** crée les alertes correspondantes et leurs incidents avec le statut résolu : ils sont enregistrés sans aucun tri."
  options:
    hide: { en: "Hide alert applies only to Defender for Endpoint alerts and prevents the incident from being created.", fr: "Hide alert ne s'applique qu'aux alertes Defender pour point de terminaison et empêche la création de l'incident." }
    behavior: { en: "Set as behavior isn't supported for Defender for Office 365 alerts, and it creates no incident.", fr: "Set as behavior n'est pas pris en charge pour les alertes Defender pour Office 365, et il ne crée aucun incident." }
    ind: { en: "Indicators allow or block files, IP addresses, URLs and certificates on devices; they don't tune email alerts.", fr: "Les indicateurs autorisent ou bloquent des fichiers, des adresses IP, des URL et des certificats sur les appareils ; ils ne règlent pas les alertes de messagerie." }
    mde: { en: "The alert comes from Defender for Office 365, so a rule on the Defender for Endpoint source would not match it.", fr: "L'alerte provient de Defender pour Office 365 : une règle sur la source Defender pour point de terminaison ne la ferait pas correspondre." }
references:
  - title: Investigate alerts in Microsoft Defender XDR
    url: https://learn.microsoft.com/en-us/defender-xdr/investigate-alerts
