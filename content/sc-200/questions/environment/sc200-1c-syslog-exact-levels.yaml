id: sc200-1c-syslog-exact-levels
objective: "1.3.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Contoso collects Syslog messages from Linux servers through a log forwarder by using the Syslog via AMA connector.

    For the **auth** facility, the SOC wants to ingest only the messages of the LOG_WARNING and LOG_NOTICE levels. Messages of higher severity are already sent to another system, and they must not be ingested into Microsoft Sentinel.

    What should you do?
  fr: |
    Contoso collecte les messages Syslog de serveurs Linux par un redirecteur de journaux avec le connecteur Syslog via AMA.

    Pour la facility **auth**, le SOC souhaite ingérer uniquement les messages de niveau LOG_WARNING et LOG_NOTICE. Les messages de gravité supérieure sont déjà envoyés à un autre système et ne doivent pas être ingérés dans Microsoft Sentinel.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "In the connector page, set the minimum log level of auth to LOG_NOTICE in the data collection rule.", fr: "Dans la page du connecteur, définir le niveau de journal minimal d'auth sur LOG_NOTICE dans la règle de collecte de données." }
    - id: b
      text: { en: "In the connector page, set the minimum log level of auth to LOG_WARNING in the data collection rule.", fr: "Dans la page du connecteur, définir le niveau de journal minimal d'auth sur LOG_WARNING dans la règle de collecte de données." }
    - id: c
      text: { en: "Create the data collection rule by using the API, and list only the two required log levels for auth.", fr: "Créer la règle de collecte de données avec l'API et ne lister que les deux niveaux de journal requis pour auth." }
    - id: d
      text: { en: "Configure the Common Event Format (CEF) via AMA connector to collect the auth facility.", fr: "Configurer le connecteur Common Event Format (CEF) via AMA pour collecter la facility auth." }
answer: { optionId: c }
explanation:
  correct:
    en: In the Azure or Defender portal, you can only select a minimum log level for each facility, and the rule then also collects every level of higher severity. With the API, you can filter by specific log levels, so a rule created by using the API can collect only LOG_WARNING and LOG_NOTICE.
    fr: "Dans le portail Azure ou Defender, vous ne pouvez sélectionner qu'un niveau de journal minimal pour chaque facility, et la règle collecte alors aussi tous les niveaux de gravité supérieure. Avec l'API, vous pouvez filtrer sur des niveaux précis : une règle créée avec l'API peut donc ne collecter que LOG_WARNING et LOG_NOTICE."
  options:
    a:
      en: A minimum level of LOG_NOTICE also collects LOG_WARNING and every level up to LOG_EMERG.
      fr: Un niveau minimal LOG_NOTICE collecte aussi LOG_WARNING et tous les niveaux jusqu'à LOG_EMERG.
    b:
      en: A minimum level of LOG_WARNING misses LOG_NOTICE and still collects LOG_ERR, LOG_CRIT, LOG_ALERT and LOG_EMERG.
      fr: Un niveau minimal LOG_WARNING manque LOG_NOTICE et collecte encore LOG_ERR, LOG_CRIT, LOG_ALERT et LOG_EMERG.
    d:
      en: The servers send plain Syslog, not CEF, and the CEF connector uses the same minimum-level selection.
      fr: Les serveurs envoient du Syslog simple, pas du CEF, et le connecteur CEF utilise la même sélection par niveau minimal.
references:
  - title: Syslog and Common Event Format (CEF) via AMA connectors for Microsoft Sentinel
    url: https://learn.microsoft.com/en-us/azure/sentinel/cef-syslog-ama-overview
  - title: Ingest syslog and CEF messages to Microsoft Sentinel - AMA
    url: https://learn.microsoft.com/en-us/azure/sentinel/connect-cef-syslog-ama
