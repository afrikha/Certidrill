id: sc200-cs3b-unmanaged-contain
objective: "1.1.8"
type: single
caseStudy: sc200-cs3b-humongous-insurance
difficulty: 2
status: draft
stem:
  en: |
    You need to meet the attack disruption requirement. What should you do?
  fr: |
    Vous devez respecter l'exigence relative à l'interruption des attaques. Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Set the remediation level of Ungrouped devices (default) to Full - remediate threats automatically.", fr: "Définir le niveau de correction de Ungrouped devices (default) sur Full - remediate threats automatically." } }
    - { id: b, text: { en: "Turn on live response for servers in the Defender for Endpoint advanced features.", fr: "Activer la réponse dynamique pour les serveurs dans les fonctionnalités avancées de Defender pour point de terminaison." } }
    - { id: c, text: { en: "Create a device group whose matching rule targets the brokers' laptops.", fr: "Créer un groupe d'appareils dont la règle de correspondance cible les ordinateurs portables des courtiers." } }
    - { id: d, text: { en: "Change the device discovery mode to Standard discovery.", fr: "Modifier le mode de découverte d'appareils en Standard discovery." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      To contain unmanaged devices, attack disruption relies on Defender for Endpoint device discovery, which must be set to Standard discovery for the automatic Contain device action. Humongous Insurance currently uses Basic discovery, so the setting must change.
    fr: |
      Pour contenir des appareils non gérés, l'interruption des attaques s'appuie sur la découverte d'appareils de Defender pour point de terminaison, qui doit être définie sur Standard discovery pour l'action automatique Contain device. Humongous Insurance utilise actuellement Basic discovery : le paramètre doit changer.
  options:
    a: { en: "Remediation levels apply to onboarded devices that belong to a device group; they do not let attack disruption discover or contain unmanaged devices.", fr: "Les niveaux de correction s'appliquent aux appareils intégrés membres d'un groupe d'appareils ; ils ne permettent pas à l'interruption des attaques de découvrir ou de contenir des appareils non gérés." }
    b: { en: "Live response is an interactive investigation feature for onboarded devices; it plays no role in containing unmanaged devices.", fr: "La réponse dynamique est une fonctionnalité d'investigation interactive pour les appareils intégrés ; elle ne joue aucun rôle dans la contention des appareils non gérés." }
    c: { en: "Device groups contain onboarded devices only; unmanaged laptops cannot match a device group rule.", fr: "Les groupes d'appareils ne contiennent que des appareils intégrés : des ordinateurs portables non gérés ne peuvent pas correspondre à une règle de groupe d'appareils." }
references:
  - title: Configure automatic attack disruption in Microsoft Defender XDR
    url: https://learn.microsoft.com/en-us/defender-xdr/configure-attack-disruption
