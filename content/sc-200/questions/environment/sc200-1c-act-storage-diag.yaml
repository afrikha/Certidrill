id: sc200-1c-act-storage-diag
objective: "1.3.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Litware has a storage account named **stlitwarefin** that contains blob containers, file shares, queues and tables. You need to send its logs to the Microsoft Sentinel workspace **law-litware** by using standalone diagnostic settings, as required by the Azure Storage Account connector.

    What should you configure?
  fr: |
    Litware dispose d'un compte de stockage nommé **stlitwarefin** qui contient des conteneurs d'objets blob, des partages de fichiers, des files d'attente et des tables. Vous devez envoyer ses journaux vers l'espace de travail Microsoft Sentinel **law-litware** avec des paramètres de diagnostic autonomes, comme l'exige le connecteur Azure Storage Account.

    Que devez-vous configurer ?
body:
  options:
    - id: a
      text: { en: "On the storage account resource, export all logs and metrics; the child resources need no setting.", fr: "Sur la ressource du compte de stockage, exporter tous les journaux et métriques ; les ressources enfants n'ont besoin d'aucun paramètre." }
    - id: b
      text: { en: "On the blob resource only, export all logs; the other child resources and the account need no setting.", fr: "Sur la ressource blob uniquement, exporter tous les journaux ; les autres ressources enfants et le compte n'ont besoin d'aucun paramètre." }
    - id: c
      text: { en: "On the storage account resource, export the Transaction metric; the child resources inherit the setting.", fr: "Sur la ressource du compte de stockage, exporter la métrique Transaction ; les ressources enfants héritent du paramètre." }
    - id: d
      text: { en: "On the storage account resource, export the Transaction metric; on each child resource, export all logs and metrics.", fr: "Sur la ressource du compte de stockage, exporter la métrique Transaction ; sur chaque ressource enfant, exporter tous les journaux et métriques." }
answer: { optionId: d }
explanation:
  correct:
    en: For a storage account, the connector requires a diagnostic setting on the parent account resource that exports the Transaction metric, and a diagnostic setting on each child storage-type resource (blob, file, queue and table) that exports all the logs and metrics.
    fr: Pour un compte de stockage, le connecteur exige un paramètre de diagnostic sur la ressource parente du compte qui exporte la métrique Transaction, et un paramètre de diagnostic sur chaque ressource enfant de type stockage (blob, fichier, file d'attente et table) qui exporte tous les journaux et métriques.
  options:
    a:
      en: The account resource doesn't emit the service logs; the logs are configured on each child resource.
      fr: La ressource du compte n'émet pas les journaux des services ; les journaux se configurent sur chaque ressource enfant.
    b:
      en: The files, queues and tables wouldn't be logged, and the account's Transaction metric would be missing.
      fr: Les fichiers, files d'attente et tables ne seraient pas journalisés, et la métrique Transaction du compte manquerait.
    c:
      en: Diagnostic settings aren't inherited by the child resources.
      fr: Les paramètres de diagnostic ne sont pas hérités par les ressources enfants.
references:
  - title: Connect Microsoft Sentinel to other Microsoft services by using diagnostic settings-based connections
    url: https://learn.microsoft.com/en-us/azure/sentinel/connect-services-diagnostic-setting-based
