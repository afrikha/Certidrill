id: sc200-1a-notif-tab-mapping
objective: "1.1.1"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Woodgrove Bank uses Microsoft Defender XDR and Microsoft Defender for Endpoint. You are configuring email notifications in **Settings > Microsoft Defender XDR > Email notifications**.

    On which tab should you create the rule for each requirement? To answer, drag the appropriate tabs to the correct requirements. Each tab may be used once, more than once, or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove Bank utilise Microsoft Defender XDR et Microsoft Defender pour point de terminaison. Vous configurez les notifications par e-mail dans **Paramètres > Microsoft Defender XDR > Notifications par e-mail**.

    Sous quel onglet devez-vous créer la règle de chaque exigence ? Pour répondre, faites glisser les onglets appropriés vers les exigences correspondantes. Chaque onglet peut être utilisé une fois, plusieurs fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: true
  items:
    - { id: inc, text: Incidents }
    - { id: act, text: Actions }
    - { id: ta, text: Threat analytics }
    - { id: tune, text: Alert tuning }
  targets:
    - id: t1
      text: { en: "Email the server team about each new high-severity incident in the Servers device group", fr: "Envoyer un e-mail à l'équipe serveurs pour chaque nouvel incident de gravité élevée du groupe d'appareils Servers" }
    - id: t2
      text: { en: "Email the CISO when a report about a vulnerability is published or updated", fr: "Envoyer un e-mail au RSSI lorsqu'un rapport sur une vulnérabilité est publié ou mis à jour" }
    - id: t3
      text: { en: "Email the endpoint team when an analyst's device isolation fails", fr: "Envoyer un e-mail à l'équipe postes de travail lorsque l'isolement d'un appareil lancé par un analyste échoue" }
    - id: t4
      text: { en: "Email the SOC lead only once per incident, whatever the number of alerts it contains", fr: "Envoyer un e-mail au responsable du SOC une seule fois par incident, quel que soit le nombre d'alertes qu'il contient" }
answer:
  mapping: { t1: inc, t2: ta, t3: act, t4: inc }
explanation:
  correct:
    en: Incident rules filter on alert severity and device group scope, and they offer **Send only one notification per incident**. Threat analytics rules notify about published or updated reports, filtered by type or tag such as Vulnerability. Actions rules notify about manual or automated response actions, filtered by action and status (completed or failed).
    fr: Les règles d'incident filtrent sur la gravité des alertes et l'étendue des groupes d'appareils, et proposent **Send only one notification per incident**. Les règles Threat analytics notifient les rapports publiés ou mis à jour, filtrés par type ou par étiquette comme Vulnerability. Les règles Actions notifient les actions de réponse manuelles ou automatisées, filtrées par action et par statut (terminée ou échouée).
  options:
    tune: { en: "Alert tuning is not an email notification tab: it hides, resolves or turns alerts into behaviors.", fr: "Alert tuning n'est pas un onglet de notification par e-mail : il masque, résout ou transforme les alertes en comportements." }
references:
  - title: Get incident notifications by email
    url: https://learn.microsoft.com/en-us/defender-xdr/m365d-notifications-incidents
  - title: Get email notifications for Threat analytics updates
    url: https://learn.microsoft.com/en-us/defender-xdr/m365d-threat-analytics-notifications
