id: sc200-2b-idp-view-reports-role
objective: "2.1.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Wingtip Toys has Microsoft Entra ID P2. A junior SOC analyst named Analyst3 must review the **Risky users**, **Risky sign-ins** and **Risk detections** reports of Microsoft Entra ID Protection during investigations. Analyst3 must not be able to change risk states or reset passwords.

    You need to assign a role to Analyst3. The solution must follow the principle of least privilege.

    Which role should you assign?
  fr: |
    Wingtip Toys dispose de Microsoft Entra ID P2. Un analyste junior du SOC nommé Analyst3 doit consulter les rapports **Utilisateurs à risque**, **Connexions à risque** et **Détections de risques** de Microsoft Entra ID Protection pendant les enquêtes. Analyst3 ne doit pas pouvoir modifier les états de risque ni réinitialiser des mots de passe.

    Vous devez attribuer un rôle à Analyst3. La solution doit respecter le principe du moindre privilège.

    Quel rôle devez-vous attribuer ?
body:
  options:
    - id: a
      text: Security Operator
    - id: b
      text: Helpdesk Administrator
    - id: c
      text: Security Administrator
    - id: d
      text: Global Reader
answer: { optionId: d }
explanation:
  correct:
    en: |
      Global Reader is the least privileged role documented for viewing the ID Protection risk reports. It is read-only, so Analyst3 can review risky users, risky sign-ins and risk detections without dismissing or confirming risk.
    fr: |
      Global Reader est le rôle le moins privilégié documenté pour consulter les rapports de risque d'ID Protection. Il est en lecture seule : Analyst3 peut examiner les utilisateurs à risque, les connexions à risque et les détections de risques sans ignorer ni confirmer de risque.
  options:
    a: { en: "Security Operator can dismiss user risk, which Analyst3 must not be able to do.", fr: "Security Operator peut ignorer le risque utilisateur, ce qu'Analyst3 ne doit pas pouvoir faire." }
    c: { en: "Security Administrator can also create and edit risk-based policies; it grants far more than read access.", fr: "Security Administrator peut aussi créer et modifier des stratégies basées sur le risque ; il accorde bien plus qu'un accès en lecture." }
    b: { en: "Helpdesk Administrator resets passwords for some users, which is not allowed here.", fr: "Helpdesk Administrator réinitialise les mots de passe de certains utilisateurs, ce qui n'est pas autorisé ici." }
references:
  - title: Investigate risk with Microsoft Entra ID Protection
    url: https://learn.microsoft.com/en-us/entra/id-protection/howto-identity-protection-investigate-risk
