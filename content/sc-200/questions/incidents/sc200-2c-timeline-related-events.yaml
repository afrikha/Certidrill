id: sc200-2c-timeline-related-events
objective: "2.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    In the timeline of a device named **WS-SALES-14**, you find an event in which **mshta.exe** started from a downloaded HTML application file.

    You need to open an editable advanced hunting query that returns this event and the other events of WS-SALES-14 that occurred around the same time.

    What should you do from the event details panel?
  fr: |
    Dans la chronologie d'un appareil nommé **WS-SALES-14**, vous trouvez un événement où **mshta.exe** a démarré depuis un fichier d'application HTML téléchargé.

    Vous devez ouvrir une requête de repérage avancé modifiable qui renvoie cet événement et les autres événements de WS-SALES-14 survenus à peu près au même moment.

    Que devez-vous faire depuis le panneau de détails de l'événement ?
body:
  options:
    - id: a
      text: { en: "Select Hunt for related events", fr: "Sélectionner Hunt for related events" }
    - id: b
      text: { en: "Flag the event, and then turn on the Flagged events filter", fr: "Marquer l'événement d'un indicateur, puis activer le filtre Flagged events" }
    - id: c
      text: { en: "Select Export for the current date", fr: "Sélectionner Export pour la date du jour" }
    - id: d
      text: { en: "Select Initiate automated investigation", fr: "Sélectionner Initiate automated investigation" }
answer: { optionId: a }
explanation:
  correct:
    en: Hunt for related events runs an advanced hunting query that returns the selected event and the other events on the same endpoint around the same time. The query opens in advanced hunting, where you can edit and rerun it.
    fr: Hunt for related events exécute une requête de repérage avancé qui renvoie l'événement sélectionné et les autres événements du même point de terminaison à peu près au même moment. La requête s'ouvre dans le repérage avancé, où vous pouvez la modifier et la réexécuter.
  options:
    b:
      en: The flag filter only shows the events that you flagged in the timeline; it doesn't open a query.
      fr: Le filtre des indicateurs n'affiche que les événements marqués dans la chronologie ; il n'ouvre pas de requête.
    c:
      en: Export writes timeline events to a file; it doesn't open advanced hunting.
      fr: Export enregistre des événements de la chronologie dans un fichier ; il n'ouvre pas le repérage avancé.
    d:
      en: An automated investigation analyzes threats and proposes remediation; it doesn't return a query of nearby events.
      fr: Une investigation automatisée analyse les menaces et propose des corrections ; elle ne renvoie pas de requête des événements proches.
references:
  - title: Investigate devices in Microsoft Defender for Endpoint
    url: https://learn.microsoft.com/en-us/defender-endpoint/device-timeline-event-flag
