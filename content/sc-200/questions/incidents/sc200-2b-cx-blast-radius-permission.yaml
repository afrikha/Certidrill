id: sc200-2b-cx-blast-radius-permission
objective: "2.1.9"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam's tenant is onboarded to the Microsoft Sentinel data lake. An analyst named Analyst8 has a custom unified RBAC role with the **Security data basics (read)** and **Alerts (manage)** permissions.

    Analyst8 investigates a lateral movement incident but can't use blast radius analysis in the incident graph. Other analysts can use it on the same incident.

    You need Analyst8 to be able to use blast radius analysis. The solution must follow the principle of least privilege.

    Which permission should you add to the role of Analyst8?
  fr: |
    Le locataire de Fabrikam est intégré au data lake de Microsoft Sentinel. Un analyste nommé Analyst8 dispose d'un rôle personnalisé de RBAC unifié avec les autorisations **Security data basics (read)** et **Alerts (manage)**.

    Analyst8 examine un incident de mouvement latéral mais ne peut pas utiliser l'analyse du rayon d'impact dans le graphe de l'incident. D'autres analystes peuvent l'utiliser sur le même incident.

    Vous devez permettre à Analyst8 d'utiliser l'analyse du rayon d'impact. La solution doit respecter le principe du moindre privilège.

    Quelle autorisation devez-vous ajouter au rôle d'Analyst8 ?
body:
  options:
    - id: a
      text: Response (manage)
    - id: b
      text: Exposure management (manage)
    - id: c
      text: Security Copilot (read)
    - id: d
      text: Exposure management (read)
answer: { optionId: d }
explanation:
  correct:
    en: |
      Blast radius analysis requires onboarding to the Microsoft Sentinel data lake and the Exposure management (read) permission or higher. The tenant is already onboarded, so adding Exposure management (read) is the least privileged fix.
    fr: |
      L'analyse du rayon d'impact exige l'intégration au data lake de Microsoft Sentinel et l'autorisation Exposure management (read) ou supérieure. Le locataire est déjà intégré : ajouter Exposure management (read) est la correction la moins privilégiée.
  options:
    a: { en: "Response (manage) allows response actions; it doesn't grant access to exposure data used by blast radius.", fr: "Response (manage) permet des actions de réponse ; il ne donne pas accès aux données d'exposition utilisées par le rayon d'impact." }
    c: { en: "Security Copilot (read) relates to Security Copilot features, not blast radius analysis.", fr: "Security Copilot (read) concerne les fonctionnalités de Security Copilot, pas l'analyse du rayon d'impact." }
    b: { en: "Exposure management (manage) would work but grants more than the read level required.", fr: "Exposure management (manage) fonctionnerait mais accorde plus que le niveau lecture requis." }
references:
  - title: Investigate incidents in the Microsoft Defender portal (legacy)
    url: https://learn.microsoft.com/en-us/defender-xdr/investigate-incidents
