id: sc200-2c-disruption-kql-actions
objective: "2.2.4"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    During a human-operated attack at Fabrikam, automatic attack disruption disabled several Active Directory accounts through Microsoft Defender for Identity. Your manager asks for the list of the accounts disabled by attack disruption during the last 90 days, with the domain controller that performed each action.

    You need to build the list by using advanced hunting.

    How should you complete the query? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pendant une attaque menée par des opérateurs humains chez Fabrikam, l'interruption automatique d'attaque a désactivé plusieurs comptes Active Directory par l'intermédiaire de Microsoft Defender pour Identity. Votre responsable demande la liste des comptes désactivés par l'interruption d'attaque au cours des 90 derniers jours, avec le contrôleur de domaine qui a effectué chaque action.

    Vous devez établir la liste à l'aide du repérage avancé.

    Comment devez-vous compléter la requête ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: kusto
  template: |
    let AllDomainControllers =
    DeviceNetworkEvents
    | where TimeGenerated > ago(7d)
    | where LocalPort == [[port]]
    | where LocalIPType == "FourToSixMapping"
    | extend DCDevicename = tostring(split(DeviceName, ".")[0])
    | distinct DCDevicename;
    [[tbl]]
    | where TimeGenerated > ago(90d)
    | where ActionType == [[act]]
    | where Application == "Active Directory"
    | extend ACTOR_DEVICE = tolower(tostring(AdditionalFields.["ACTOR.DEVICE"]))
    | where isnotempty(ACTOR_DEVICE)
    | where ACTOR_DEVICE [[op]] (AllDomainControllers)
    | project TimeGenerated, TargetAccountUpn, ACTOR_DEVICE
  slots:
    - id: port
      options:
        - { id: p88, text: "88" }
        - { id: p389, text: "389" }
        - { id: p443, text: "443" }
        - { id: p3389, text: "3389" }
    - id: tbl
      options:
        - { id: idir, text: IdentityDirectoryEvents }
        - { id: ilogon, text: IdentityLogonEvents }
        - { id: iquery, text: IdentityQueryEvents }
        - { id: devevents, text: DeviceEvents }
    - id: act
      options:
        - { id: disabled, text: "\"Account disabled\"" }
        - { id: containeduser, text: "\"ContainedUser\"" }
        - { id: pwdchange, text: "\"Account Password changed\"" }
    - id: op
      options:
        - { id: in, text: in }
        - { id: notin, text: "!in" }
        - { id: has, text: has }
answer:
  values: { port: p88, tbl: idir, act: disabled, op: in }
explanation:
  correct:
    en: "This is the query that Microsoft provides for the disable user action of attack disruption. The `let` statement finds the domain controllers as the devices that listen on port 88 (Kerberos). Defender for Identity disables the account in Active Directory, which `IdentityDirectoryEvents` records with the action type `Account disabled`, and `in` keeps only the rows whose actor device is one of those domain controllers."
    fr: "C'est la requête fournie par Microsoft pour l'action de désactivation d'utilisateur de l'interruption d'attaque. L'instruction `let` identifie les contrôleurs de domaine comme les appareils qui écoutent sur le port 88 (Kerberos). Defender pour Identity désactive le compte dans Active Directory, ce que `IdentityDirectoryEvents` enregistre avec le type d'action `Account disabled`, et `in` ne garde que les lignes dont l'appareil acteur est l'un de ces contrôleurs de domaine."
  options:
    p389: { en: "Port 389 is LDAP, which other servers can also expose; the provided query identifies domain controllers by the Kerberos port 88.", fr: "Le port 389 est LDAP, que d'autres serveurs peuvent aussi exposer ; la requête fournie identifie les contrôleurs de domaine par le port Kerberos 88." }
    ilogon: { en: "IdentityLogonEvents records authentications, not changes to account properties such as a disabled account.", fr: "IdentityLogonEvents enregistre les authentifications, pas les modifications des propriétés d'un compte comme sa désactivation." }
    devevents: { en: "DeviceEvents holds the blocks caused by Contain user (ContainedUser); a contained user isn't disabled.", fr: "DeviceEvents contient les blocages causés par Contain user (ContainedUser) ; un utilisateur contenu n'est pas désactivé." }
    containeduser: { en: "ContainedUser matches DeviceEvents blocks of a contained user, not accounts disabled in Active Directory.", fr: "ContainedUser correspond aux blocages DeviceEvents d'un utilisateur contenu, pas aux comptes désactivés dans Active Directory." }
    notin: { en: "!in would keep the disable actions performed from devices other than the domain controllers.", fr: "!in garderait les désactivations effectuées depuis des appareils autres que les contrôleurs de domaine." }
    has: { en: "has looks for a term in a string; it doesn't compare a value with the list returned by a let statement.", fr: "has recherche un terme dans une chaîne ; il ne compare pas une valeur à la liste renvoyée par une instruction let." }
references:
  - title: Details and results of an automatic attack disruption action
    url: https://learn.microsoft.com/en-us/defender-xdr/autoad-results
