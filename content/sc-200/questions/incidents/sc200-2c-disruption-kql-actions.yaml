id: sc200-2c-disruption-kql-actions
objective: "2.2.4"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    Automatic attack disruption acted during incident 18342 in Microsoft Defender XDR. Your manager asks for the list of the automatic actions taken in that incident during the last 30 days, with the affected device and account.

    You need to build the list by using advanced hunting.

    How should you complete the query? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    L'interruption automatique d'attaque a agi au cours de l'incident 18342 dans Microsoft Defender XDR. Votre responsable demande la liste des actions automatiques effectuées dans cet incident au cours des 30 derniers jours, avec l'appareil et le compte concernés.

    Vous devez établir la liste à l'aide du repérage avancé.

    Comment devez-vous compléter la requête ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: kusto
  template: |
    [[tbl]]
    | where Timestamp > [[t]]
    | where [[col]] == 18342
    | project Timestamp, ActionType, AttackDisruptionCategory, DeviceName, AccountUpn
    | order by Timestamp desc
  slots:
    - id: tbl
      options:
        - { id: dre, text: DisruptionAndResponseEvents }
        - { id: devevents, text: DeviceEvents }
        - { id: evidence, text: AlertEvidence }
        - { id: idir, text: IdentityDirectoryEvents }
    - id: t
      options:
        - { id: ago, text: ago(30d) }
        - { id: agoneg, text: ago(-30d) }
        - { id: raw, text: 30d }
        - { id: dt, text: datetime(30d) }
    - id: col
      options:
        - { id: incident, text: IncidentId }
        - { id: alert, text: AlertId }
        - { id: report, text: ReportId }
        - { id: device, text: DeviceId }
answer:
  values: { tbl: dre, t: ago, col: incident }
explanation:
  correct:
    en: "`DisruptionAndResponseEvents` (preview) holds the automatic attack disruption actions shown in the incident's Activities tab, for the whole organization. `ago(30d)` returns the time 30 days before now, and filtering on `IncidentId` scopes the result to incident 18342."
    fr: "`DisruptionAndResponseEvents` (préversion) contient les actions d'interruption automatique d'attaque affichées dans l'onglet Activities de l'incident, pour toute l'organisation. `ago(30d)` renvoie l'heure qu'il était il y a 30 jours, et le filtre sur `IncidentId` limite le résultat à l'incident 18342."
  options:
    devevents: { en: "DeviceEvents records the blocks that result from containment (ContainedDevice, ContainedUser), not the disruption actions themselves.", fr: "DeviceEvents enregistre les blocages qui résultent du confinement (ContainedDevice, ContainedUser), pas les actions d'interruption elles-mêmes." }
    idir: { en: "IdentityDirectoryEvents shows directory changes such as disabled accounts, not every disruption action.", fr: "IdentityDirectoryEvents montre des modifications d'annuaire comme les comptes désactivés, pas toutes les actions d'interruption." }
    agoneg: { en: "ago(-30d) returns a time 30 days in the future.", fr: "ago(-30d) renvoie une heure située 30 jours dans le futur." }
    raw: { en: "A timespan can't be compared with a datetime.", fr: "Une durée ne peut pas être comparée à une date." }
    alert: { en: "18342 is an incident number, and AlertId identifies an alert.", fr: "18342 est un numéro d'incident, et AlertId identifie une alerte." }
references:
  - title: Details and results of an automatic attack disruption action
    url: https://learn.microsoft.com/en-us/defender-xdr/autoad-results
