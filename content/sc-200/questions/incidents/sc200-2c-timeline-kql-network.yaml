id: sc200-2c-timeline-kql-network
objective: "2.2.1"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    The timeline of a device named **ws-hr-12.contoso.com** shows outbound connections to the external IP address 203.0.113.45.

    You need an advanced hunting query that counts, for each hour of the last seven days and for each initiating process, the connections from ws-hr-12.contoso.com to 203.0.113.45.

    How should you complete the query? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    La chronologie d'un appareil nommé **ws-hr-12.contoso.com** montre des connexions sortantes vers l'adresse IP externe 203.0.113.45.

    Vous avez besoin d'une requête de repérage avancé qui compte, pour chaque heure des sept derniers jours et pour chaque processus initiateur, les connexions de ws-hr-12.contoso.com vers 203.0.113.45.

    Comment devez-vous compléter la requête ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: kusto
  template: |
    [[tbl]]
    | where Timestamp > ago(7d)
    | where DeviceName == "ws-hr-12.contoso.com"
    | where [[col]] == "203.0.113.45"
    | summarize Connections = count() by [[grp]], InitiatingProcessFileName
  slots:
    - id: tbl
      options:
        - { id: netevents, text: DeviceNetworkEvents }
        - { id: netinfo, text: DeviceNetworkInfo }
        - { id: info, text: DeviceInfo }
        - { id: events, text: DeviceEvents }
    - id: col
      options:
        - { id: remote, text: RemoteIP }
        - { id: local, text: LocalIP }
        - { id: url, text: RemoteUrl }
        - { id: ips, text: IPAddresses }
    - id: grp
      options:
        - { id: bin, text: "bin(Timestamp, 1h)" }
        - { id: binrev, text: "bin(1h, Timestamp)" }
        - { id: ago, text: "ago(1h)" }
        - { id: ts, text: Timestamp }
answer:
  values: { tbl: netevents, col: remote, grp: bin }
explanation:
  correct:
    en: "Network connections are in `DeviceNetworkEvents`. The external address of an outbound connection is in `RemoteIP` (`LocalIP` is the device's own address). `bin(Timestamp, 1h)` rounds each timestamp down to the hour, so `summarize` returns one count per hour and process."
    fr: "Les connexions réseau se trouvent dans `DeviceNetworkEvents`. L'adresse externe d'une connexion sortante est dans `RemoteIP` (`LocalIP` est l'adresse de l'appareil lui-même). `bin(Timestamp, 1h)` arrondit chaque horodatage à l'heure inférieure : `summarize` renvoie un nombre par heure et par processus."
  options:
    netinfo: { en: "DeviceNetworkInfo describes the device's adapters and addresses, not its connections.", fr: "DeviceNetworkInfo décrit les cartes et adresses de l'appareil, pas ses connexions." }
    url: { en: "RemoteUrl holds the URL or domain name, not the IP address.", fr: "RemoteUrl contient l'URL ou le nom de domaine, pas l'adresse IP." }
    ips: { en: "IPAddresses is a column of DeviceNetworkInfo, not of DeviceNetworkEvents.", fr: "IPAddresses est une colonne de DeviceNetworkInfo, pas de DeviceNetworkEvents." }
    ts: { en: "Grouping by the raw Timestamp gives one row per distinct time, not per hour.", fr: "Regrouper sur Timestamp brut donne une ligne par instant distinct, pas par heure." }
    binrev: { en: "bin() takes the value first and the bin size second.", fr: "bin() prend d'abord la valeur, puis la taille de l'intervalle." }
references:
  - title: DeviceNetworkEvents table in the advanced hunting schema
    url: https://learn.microsoft.com/en-us/defender-xdr/advanced-hunting-devicenetworkevents-table
