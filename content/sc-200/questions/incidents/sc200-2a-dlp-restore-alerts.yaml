id: sc200-2a-dlp-restore-alerts
objective: "2.1.2"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    Litware, Inc. uses Microsoft Purview Data Loss Prevention (DLP) and Microsoft Defender XDR. Since early October 2026, the DLP policy matches no longer appear in the incident queue. The SOC manager wants DLP matches to be handled as alerts again in the Microsoft Defender portal.

    You need to restore the DLP alerts and then review the sensitive information detected in a new DLP alert.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Litware, Inc. utilise la protection contre la perte de données (DLP) de Microsoft Purview et Microsoft Defender XDR. Depuis début octobre 2026, les correspondances de stratégies DLP n'apparaissent plus dans la file d'attente des incidents. Le responsable du SOC veut que les correspondances DLP soient de nouveau traitées comme des alertes dans le portail Microsoft Defender.

    Vous devez rétablir les alertes DLP, puis examiner les informations sensibles détectées dans une nouvelle alerte DLP.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: open, text: { en: "In the Defender portal, go to Settings > Microsoft Defender XDR > Alert tuning.", fr: "Dans le portail Defender, accéder à Paramètres > Microsoft Defender XDR > Réglage des alertes." } }
    - { id: disable, text: { en: "Disable the built-in tuning rule for DLP signals.", fr: "Désactiver la règle de réglage intégrée pour les signaux DLP." } }
    - { id: filter, text: { en: "In the incident queue, filter Service/detection sources on Microsoft Data Loss Prevention.", fr: "Dans la file d'attente des incidents, filtrer Sources de service/détection sur Microsoft Data Loss Prevention." } }
    - { id: review, text: { en: "Open the DLP alert and review the Sensitive info types tab.", fr: "Ouvrir l'alerte DLP et examiner l'onglet Sensitive info types." } }
    - { id: share, text: { en: "In Insider Risk Management, turn on Share user risk details with other security solutions.", fr: "Dans la gestion des risques internes, activer Share user risk details with other security solutions." } }
    - { id: hunt, text: { en: "Run a custom detection rule on the BehaviorInfo table to convert the behaviors into the original DLP alerts.", fr: "Exécuter une règle de détection personnalisée sur la table BehaviorInfo pour reconvertir les comportements en alertes DLP d'origine." } }
answer:
  sequence: [ open, disable, filter, review ]
explanation:
  correct:
    en: |
      The built-in alert tuning rule turns DLP signals into behaviors. Disabling it in Settings > Microsoft Defender XDR > Alert tuning makes DLP signals create alerts again. The Service/detection sources filter set to Microsoft Data Loss Prevention lists the DLP incidents, and the alert page shows the matched content on the Sensitive info types tab.
    fr: |
      La règle de réglage d'alerte intégrée transforme les signaux DLP en comportements. La désactiver dans Paramètres > Microsoft Defender XDR > Réglage des alertes fait de nouveau créer des alertes aux signaux DLP. Le filtre Sources de service/détection réglé sur Microsoft Data Loss Prevention liste les incidents DLP, et la page de l'alerte affiche le contenu détecté dans l'onglet Sensitive info types.
  options:
    share: { en: "This setting shares insider risk data with the Defender portal; it has no effect on DLP alerts.", fr: "Ce paramètre partage les données de risque interne avec le portail Defender ; il n'a aucun effet sur les alertes DLP." }
    hunt: { en: "A custom detection creates new alerts of its own; it doesn't restore the DLP alerts with their policy details, and the requirement is met by disabling the tuning rule.", fr: "Une détection personnalisée crée ses propres alertes ; elle ne rétablit pas les alertes DLP avec les détails de leur stratégie, et l'exigence est satisfaite en désactivant la règle de réglage." }
references:
  - title: Investigate data loss alerts with Microsoft Defender XDR
    url: https://learn.microsoft.com/en-us/defender-xdr/dlp-investigate-alerts-defender
