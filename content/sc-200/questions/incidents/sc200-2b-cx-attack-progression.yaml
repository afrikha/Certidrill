id: sc200-2b-cx-attack-progression
objective: "2.1.9"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    Northwind Traders investigates a multi-stage incident in the Microsoft Defender portal. The alerts were raised by Defender for Office 365, Defender for Identity, Defender for Endpoint and Defender for Cloud Apps. Your notes, in no particular order, are:

    - Files from the file server **FS-01** were uploaded to a personal cloud storage app.
    - A user on the workstation **WS-20** opened an email attachment that gave the attacker remote control of WS-20.
    - The cracked password of a service account was used to sign in to FS-01.
    - From WS-20, the attacker requested Kerberos service tickets for accounts that have SPNs and cracked them offline.

    You need to document how far the attack progressed along the kill chain, by using the MITRE ATT&CK tactics shown in the incident summary.

    Which four tactics should you list in the order in which the attack progressed? To answer, move the appropriate tactics from the list to the answer area and arrange them in the correct order.
  fr: |
    Northwind Traders examine un incident multi-étapes dans le portail Microsoft Defender. Les alertes ont été générées par Defender pour Office 365, Defender pour Identity, Defender for Endpoint et Defender pour les applications cloud. Vos notes, sans ordre particulier, sont les suivantes :

    - Des fichiers du serveur de fichiers **FS-01** ont été chargés vers une application de stockage cloud personnelle.
    - Un utilisateur du poste de travail **WS-20** a ouvert une pièce jointe qui a donné à l'attaquant le contrôle à distance de WS-20.
    - Le mot de passe cassé d'un compte de service a été utilisé pour se connecter à FS-01.
    - Depuis WS-20, l'attaquant a demandé des tickets de service Kerberos pour des comptes disposant de SPN et les a cassés hors ligne.

    Vous devez documenter jusqu'où l'attaque a progressé dans la chaîne d'attaque, à l'aide des tactiques MITRE ATT&CK affichées dans le résumé de l'incident.

    Quelles sont les quatre tactiques à lister dans l'ordre dans lequel l'attaque a progressé ? Pour répondre, déplacez les tactiques appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: initial, text: Initial Access }
    - { id: credential, text: Credential Access }
    - { id: lateral, text: Lateral Movement }
    - { id: exfil, text: Exfiltration }
    - { id: impact, text: Impact }
    - { id: resource, text: Resource Development }
answer:
  sequence: [ initial, credential, lateral, exfil ]
explanation:
  correct:
    en: |
      The malicious attachment gave the attacker a foothold on WS-20 (Initial Access). Requesting and cracking service tickets is Kerberoasting (Credential Access). Using the cracked account to sign in to FS-01 is Lateral Movement, and uploading the files to a personal cloud app is Exfiltration. The incident summary aligns the alerts to these tactics to show how far the attack progressed.
    fr: |
      La pièce jointe malveillante a donné à l'attaquant une position sur WS-20 (Initial Access). Demander et casser des tickets de service relève du Kerberoasting (Credential Access). Utiliser le compte cassé pour se connecter à FS-01 est un Lateral Movement, et charger les fichiers vers une application cloud personnelle est une Exfiltration. Le résumé de l'incident aligne les alertes sur ces tactiques pour montrer jusqu'où l'attaque a progressé.
  options:
    impact: { en: "Impact covers actions such as destroying or encrypting data; no such activity is described.", fr: "Impact couvre des actions comme la destruction ou le chiffrement de données ; aucune activité de ce type n'est décrite." }
    resource: { en: "Resource Development happens before the attack reaches the organization and isn't visible in these alerts.", fr: "Resource Development a lieu avant que l'attaque n'atteigne l'organisation et n'est pas visible dans ces alertes." }
references:
  - title: Investigate incidents in the Microsoft Defender portal (legacy)
    url: https://learn.microsoft.com/en-us/defender-xdr/investigate-incidents
  - title: Microsoft Defender for Identity classic alerts
    url: https://learn.microsoft.com/en-us/defender-for-identity/alerts-mdi-classic
