id: sc200-2b-cop-defender-chat
objective: "2.1.8"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Wingtip Toys has provisioned access to Microsoft Security Copilot. While viewing an incident in the Microsoft Defender portal, an analyst selects the **Copilot** button in the top navigation bar to open Defender Chat (preview). The analyst types: "Isolate every device in this incident and then disable the users involved."

    What happens next?
  fr: |
    Wingtip Toys dispose d'un accès provisionné à Microsoft Security Copilot. En consultant un incident dans le portail Microsoft Defender, un analyste sélectionne le bouton **Copilot** de la barre de navigation supérieure pour ouvrir Defender Chat (préversion). L'analyste tape : « Isolate every device in this incident and then disable the users involved. »

    Que se passe-t-il ensuite ?
body:
  options:
    - id: a
      text: { en: "The chat runs both actions immediately, because the request was made from the incident page.", fr: "Le chat exécute immédiatement les deux actions, car la demande a été faite depuis la page de l'incident." }
    - id: b
      text: { en: "The chat proposes a step-by-step plan that the analyst approves or rejects before anything runs.", fr: "Le chat propose un plan détaillé que l'analyste approuve ou rejette avant toute exécution." }
    - id: c
      text: { en: "The chat creates an automation rule that applies the actions to future incidents.", fr: "Le chat crée une règle d'automatisation qui applique les actions aux futurs incidents." }
    - id: d
      text: { en: "The chat refuses the request until the analyst provides the device IDs and user names.", fr: "Le chat refuse la demande tant que l'analyste n'a pas fourni les ID des appareils et les noms des utilisateurs." }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Defender Chat answers with the context of the current page, so the analyst doesn't need to supply IDs or names. For multi-step requests, it proposes a plan that the analyst approves or rejects before execution.
    fr: |
      Defender Chat répond en tenant compte du contexte de la page actuelle : l'analyste n'a pas besoin de fournir d'ID ni de noms. Pour les demandes en plusieurs étapes, il propose un plan que l'analyste approuve ou rejette avant l'exécution.
  options:
    a: { en: "Plans are shown for approval before execution; nothing runs without the analyst's decision.", fr: "Les plans sont présentés pour approbation avant l'exécution ; rien ne s'exécute sans la décision de l'analyste." }
    c: { en: "The chat acts on the current request; it doesn't create automation rules for future incidents.", fr: "Le chat agit sur la demande en cours ; il ne crée pas de règles d'automatisation pour les futurs incidents." }
    d: { en: "The chat uses the page context, so IDs and names aren't needed.", fr: "Le chat utilise le contexte de la page : les ID et les noms ne sont pas nécessaires." }
references:
  - title: Microsoft Security Copilot and Chat in Microsoft Defender
    url: https://learn.microsoft.com/en-us/defender-xdr/security-copilot-in-microsoft-365-defender
