id: sc200-2b-cop-defender-chat
objective: "2.1.8"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Wingtip Toys has provisioned access to Microsoft Security Copilot. In the incident graph of a multi-stage incident in the Microsoft Defender portal, an analyst selects a user account named **kpatel** and opens **User details**.

    The analyst needs Copilot to describe kpatel in one place: the account's criticality, its unusual sign-in patterns, its recent device sign-ins, its authentication methods and its Microsoft Entra ID risk.

    Which Copilot in Defender capability should the analyst use?
  fr: |
    Wingtip Toys dispose d'un accès provisionné à Microsoft Security Copilot. Dans le graphe d'un incident multi-étapes du portail Microsoft Defender, un analyste sélectionne un compte d'utilisateur nommé **kpatel** et ouvre **User details**.

    L'analyste a besoin que Copilot décrive kpatel en un seul endroit : la criticité du compte, ses schémas de connexion inhabituels, ses connexions récentes à des appareils, ses méthodes d'authentification et son risque Microsoft Entra ID.

    Quelle fonctionnalité de Copilot dans Defender l'analyste doit-il utiliser ?
body:
  options:
    - id: a
      text: { en: "Incident summary", fr: "Résumé d'incident" }
    - id: b
      text: { en: "Identity summary", fr: "Résumé d'identité" }
    - id: c
      text: { en: "Guided responses", fr: "Réponses guidées" }
    - id: d
      text: { en: "Device summary", fr: "Résumé d'appareil" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Selecting Summarize in the user details pane generates an identity summary. It covers the account's creation date and criticality, unusual sign-in behavior, the user's role, the last device sign-ins in the past 30 days, authentication methods and applications, and the risks reported by Microsoft Entra ID.
    fr: |
      Sélectionner Summarize dans le volet de détails de l'utilisateur génère un résumé d'identité. Il couvre la date de création et la criticité du compte, les comportements de connexion inhabituels, le rôle de l'utilisateur, les dernières connexions à des appareils au cours des 30 derniers jours, les méthodes d'authentification et les applications, et les risques signalés par Microsoft Entra ID.
  options:
    a: { en: "An incident summary describes the attack as a whole, not the profile of one account.", fr: "Un résumé d'incident décrit l'attaque dans son ensemble, pas le profil d'un compte." }
    c: { en: "Guided responses recommend triage, containment and remediation actions; they don't describe a user.", fr: "Les réponses guidées recommandent des actions de triage, de confinement et de correction ; elles ne décrivent pas un utilisateur." }
    d: { en: "A device summary gives the key information about a device, not about a user account.", fr: "Un résumé d'appareil donne les informations clés sur un appareil, pas sur un compte d'utilisateur." }
references:
  - title: Summarize identity information with Microsoft Copilot in Microsoft Defender
    url: https://learn.microsoft.com/en-us/defender-xdr/security-copilot-defender-identity-summary
  - title: Microsoft Security Copilot and Chat in Microsoft Defender
    url: https://learn.microsoft.com/en-us/defender-xdr/security-copilot-in-microsoft-365-defender
