id: sc200-2a-dlp-alert-retention
objective: "2.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Wingtip Toys uses Microsoft Purview Data Loss Prevention (DLP). DLP alerts are integrated with Microsoft Defender XDR.

    The legal team asks you to review a DLP alert that was generated four months ago for a user who left the company.

    Where can you still find the alert?
  fr: |
    Wingtip Toys utilise la protection contre la perte de données (DLP) de Microsoft Purview. Les alertes DLP sont intégrées à Microsoft Defender XDR.

    L'équipe juridique vous demande d'examiner une alerte DLP générée il y a quatre mois pour un utilisateur qui a quitté l'entreprise.

    Où pouvez-vous encore trouver l'alerte ?
body:
  options:
    - { id: a, text: { en: "In the DLP Alerts dashboard of the Microsoft Purview portal", fr: "Dans le tableau de bord des alertes DLP du portail Microsoft Purview" } }
    - { id: b, text: { en: "In Activity explorer in the Microsoft Purview portal", fr: "Dans l'explorateur d'activités du portail Microsoft Purview" } }
    - { id: c, text: { en: "In the incident and alert queues of the Microsoft Defender portal", fr: "Dans les files d'attente des incidents et des alertes du portail Microsoft Defender" } }
    - { id: d, text: { en: "In the CloudAppEvents table in advanced hunting", fr: "Dans la table CloudAppEvents du repérage avancé" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      DLP alerts remain in the Microsoft Defender portal for six months, but only 30 days in the DLP Alerts dashboard of Microsoft Purview. An alert from four months ago is therefore available only in the Defender portal.
    fr: |
      Les alertes DLP restent six mois dans le portail Microsoft Defender, mais seulement 30 jours dans le tableau de bord des alertes DLP de Microsoft Purview. Une alerte vieille de quatre mois n'est donc disponible que dans le portail Defender.
  options:
    a: { en: "The DLP Alerts dashboard keeps alerts for 30 days.", fr: "Le tableau de bord des alertes DLP conserve les alertes 30 jours." }
    b: { en: "Activity explorer keeps the last 30 days of DLP activity, and it shows activities, not alerts.", fr: "L'explorateur d'activités conserve les 30 derniers jours d'activité DLP, et il affiche des activités, pas des alertes." }
    d: { en: "Advanced hunting lets you explore up to 30 days of audit logs in CloudAppEvents.", fr: "Le repérage avancé permet d'explorer jusqu'à 30 jours de journaux d'audit dans CloudAppEvents." }
references:
  - title: Investigate data loss alerts with Microsoft Defender XDR
    url: https://learn.microsoft.com/en-us/defender-xdr/dlp-investigate-alerts-defender
  - title: Learn about data loss prevention
    url: https://learn.microsoft.com/en-us/purview/dlp-learn-about-dlp
