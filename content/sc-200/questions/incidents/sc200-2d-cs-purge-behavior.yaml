id: sc200-2d-cs-purge-behavior
objective: "2.3.2"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Tailspin Toys has Microsoft 365 E3 licenses and no Microsoft Defender for Office 365 subscription. Single item recovery uses the default settings, and no mailbox is on hold.

    A message that contains a payroll file was sent to all employees by email and posted in a Teams chat. The SOC plans to use a content search in eDiscovery and a purge action in Security & Compliance PowerShell to remove the message.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin Toys dispose de licences Microsoft 365 E3 et d'aucun abonnement Microsoft Defender pour Office 365. La récupération d'élément unique utilise les paramètres par défaut, et aucune boîte aux lettres n'est en conservation.

    Un message contenant un fichier de paie a été envoyé par e-mail à tous les employés et publié dans une conversation Teams. Le SOC prévoit d'utiliser une recherche de contenu dans eDiscovery et une action de purge dans Security & Compliance PowerShell pour supprimer le message.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          After a purge action of the SoftDelete type, users can recover the email message from the Recoverable Items folder during the deleted item retention period.
        fr: |
          Après une action de purge de type SoftDelete, les utilisateurs peuvent récupérer l'e-mail depuis le dossier Éléments récupérables pendant la période de rétention des éléments supprimés.
    - id: s2
      text:
        en: |
          The purge action also deletes the Teams chat message if the search returns it.
        fr: |
          L'action de purge supprime aussi le message de conversation Teams si la recherche le renvoie.
    - id: s3
      text:
        en: |
          If the search includes 60,000 mailboxes, the purge action fails even if only 500 mailboxes contain the message.
        fr: |
          Si la recherche inclut 60 000 boîtes aux lettres, l'action de purge échoue même si seulement 500 boîtes aux lettres contiennent le message.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |
      A soft-deleted message moves to the Deletions folder of Recoverable Items, where the user can recover it until the deleted item retention period expires. New-ComplianceSearchAction -Purge does not delete Teams items returned by the search; Teams chat messages have their own search and delete procedure. A search used for a purge can include at most 50,000 mailboxes, and the action fails above that limit even when fewer mailboxes contain matches; you split the scope with search permissions filters.
    fr: "Un message supprimé de manière réversible (SoftDelete) est déplacé vers le dossier Deletions des Éléments récupérables, où l'utilisateur peut le récupérer jusqu'à l'expiration de la période de rétention des éléments supprimés. New-ComplianceSearchAction -Purge ne supprime pas les éléments Teams renvoyés par la recherche : les messages de conversation Teams ont leur propre procédure de recherche et suppression. Une recherche utilisée pour une purge peut inclure au plus 50 000 boîtes aux lettres, et l'action échoue au-delà, même si moins de boîtes aux lettres contiennent des correspondances ; vous découpez l'étendue avec des filtres d'autorisations de recherche."
references:
  - title: Find and delete email messages in eDiscovery
    url: https://learn.microsoft.com/en-us/purview/edisc-search-mailbox-data
