id: sc200-2b-idp-detection-sources
objective: "2.1.5"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Adatum uses Microsoft Entra ID Protection with Microsoft Entra ID P2. Several other Microsoft security products are deployed. While investigating a compromised identity, you review its risk detections.

    Which product supplies the signal for each risk detection? To answer, drag the appropriate products to the correct detections. Each product may be used once, more than once, or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum utilise Microsoft Entra ID Protection avec Microsoft Entra ID P2. Plusieurs autres produits de sécurité Microsoft sont déployés. En enquêtant sur une identité compromise, vous examinez ses détections de risques.

    Quel produit fournit le signal de chaque détection de risque ? Pour répondre, faites glisser les produits appropriés vers les détections correspondantes. Chaque produit peut être utilisé une fois, plusieurs fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: true
  items:
    - { id: mdca, text: Microsoft Defender for Cloud Apps }
    - { id: mde, text: Microsoft Defender for Endpoint }
    - { id: mdo, text: Microsoft Defender for Office 365 }
    - { id: mdi, text: Microsoft Defender for Identity }
    - { id: mdc, text: Microsoft Defender for Cloud }
  targets:
    - id: travel
      text: Impossible travel
    - id: prt
      text: Possible attempt to access Primary Refresh Token (PRT)
    - id: sending
      text: Suspicious sending patterns
    - id: forwarding
      text: Suspicious inbox forwarding
answer:
  mapping: { travel: mdca, prt: mde, sending: mdo, forwarding: mdca }
explanation:
  correct:
    en: |
      Impossible travel and Suspicious inbox forwarding are offline detections discovered by Defender for Cloud Apps. Possible attempt to access PRT is a high-risk user detection supplied by Defender for Endpoint, and Suspicious sending patterns is supplied by Defender for Office 365. Defender for Identity and Defender for Cloud don't feed these ID Protection detections.
    fr: |
      Impossible travel et Suspicious inbox forwarding sont des détections hors ligne découvertes par Defender pour les applications cloud. Possible attempt to access PRT est une détection de risque utilisateur élevé fournie par Defender for Endpoint, et Suspicious sending patterns est fournie par Defender pour Office 365. Defender pour Identity et Defender pour le cloud n'alimentent pas ces détections d'ID Protection.
  options:
    mdi: { en: "Defender for Identity raises its own alerts on on-premises Active Directory attacks; it isn't the source of these ID Protection detections.", fr: "Defender pour Identity génère ses propres alertes sur les attaques contre Active Directory local ; ce n'est pas la source de ces détections d'ID Protection." }
    mdc: { en: "Defender for Cloud protects Azure workloads and doesn't supply ID Protection risk detections.", fr: "Defender pour le cloud protège les charges de travail Azure et ne fournit pas de détections de risque à ID Protection." }
references:
  - title: What are risk detections?
    url: https://learn.microsoft.com/en-us/entra/id-protection/concept-identity-protection-risks
