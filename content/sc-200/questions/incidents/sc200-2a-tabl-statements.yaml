id: sc200-2a-tabl-statements
objective: "2.1.1"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove Bank uses Microsoft Defender for Office 365. Analysts submit suspicious messages on the **Submissions** page and manage entries in the Tenant Allow/Block List.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove Bank utilise Microsoft Defender pour Office 365. Les analystes envoient les messages suspects depuis la page **Submissions** et gèrent les entrées de la liste d'autorisation/de blocage du locataire.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: When you select **Block all emails from this sender or domain** during a submission, the block entry expires after 30 days unless you choose another value.
        fr: Quand vous sélectionnez **Block all emails from this sender or domain** lors d'un envoi, l'entrée de blocage expire au bout de 30 jours, sauf si vous choisissez une autre valeur.
    - id: s2
      text:
        en: A message from a sender that matches a block entry for domains and email addresses is marked as high confidence phishing and quarantined.
        fr: Un message d'un expéditeur correspondant à une entrée de blocage de domaines et d'adresses e-mail est marqué comme hameçonnage à haut niveau de confiance et mis en quarantaine.
    - id: s3
      text:
        en: To allow a file that was wrongly detected as malware, you can create the allow entry directly on the **Files** tab of the Tenant Allow/Block List.
        fr: Pour autoriser un fichier détecté à tort comme programme malveillant, vous pouvez créer l'entrée d'autorisation directement dans l'onglet **Files** de la liste d'autorisation/de blocage du locataire.
answer:
  values: { s1: true, s2: true, s3: false }
explanation:
  correct:
    en: |
      Block entries created from a submission expire after 30 days by default (1 day, 7 days, a specific date or never expire are the other choices). Email from a blocked domain or address is marked as high confidence phishing and moved to quarantine. Allow entries for files can't be created directly in the Tenant Allow/Block List; you submit the file as clean on the Submissions page, which creates the allow entry.
    fr: |
      Les entrées de blocage créées depuis un envoi expirent par défaut au bout de 30 jours (1 jour, 7 jours, une date précise ou aucune expiration sont les autres choix). Un e-mail provenant d'un domaine ou d'une adresse bloqués est marqué comme hameçonnage à haut niveau de confiance et placé en quarantaine. Une entrée d'autorisation de fichier ne peut pas être créée directement dans la liste d'autorisation/de blocage du locataire : vous envoyez le fichier comme sain depuis la page Envois, ce qui crée l'entrée d'autorisation.
references:
  - title: Manage allows and blocks in the Tenant Allow/Block List
    url: https://learn.microsoft.com/en-us/defender-office-365/tenant-allow-block-list-about
  - title: Submit messages, URLs, and attachments for analysis in the Microsoft Defender portal
    url: https://learn.microsoft.com/en-us/defender-office-365/submissions-admin
