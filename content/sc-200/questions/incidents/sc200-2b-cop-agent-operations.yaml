id: sc200-2b-cop-agent-operations
objective: "2.1.8"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Contoso plans to run the Microsoft Security Copilot Phishing Triage Agent in Microsoft Defender. You are writing an operations guide for the SOC.

    How should you complete the guide? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso prévoit d'exécuter le Phishing Triage Agent de Microsoft Security Copilot dans Microsoft Defender. Vous rédigez un guide d'exploitation pour le SOC.

    Comment devez-vous compléter le guide ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      To set up, pause or remove the agent, a user needs the [[role]] role in Microsoft Entra ID.

      To list the incidents the agent worked on, filter the incident queue on the [[tag]] tag.

      The Performance tab of the agent page reports the consumption of [[unit]].
    fr: |
      Pour configurer, suspendre ou supprimer l'agent, un utilisateur a besoin du rôle [[role]] dans Microsoft Entra ID.

      Pour lister les incidents traités par l'agent, filtrez la file d'attente des incidents sur la balise [[tag]].

      L'onglet Performance de la page de l'agent indique la consommation de [[unit]].
  slots:
    - id: role
      options:
        - { id: secadmin, text: Security Administrator }
        - { id: secop, text: Security Operator }
        - { id: secreader, text: Security Reader }
        - { id: globalreader, text: Global Reader }
    - id: tag
      options:
        - { id: agent, text: Agent }
        - { id: copilot, text: Copilot }
        - { id: air, text: AIR }
        - { id: phish, text: Phish }
    - id: unit
      options:
        - { id: scu, text: { en: "Security Compute Units (SCUs)", fr: "unités de calcul de sécurité (SCU)" } }
        - { id: gb, text: { en: "Log Analytics data ingestion (GB)", fr: "ingestion de données Log Analytics (Go)" } }
        - { id: logic, text: { en: "Logic Apps action executions", fr: "exécutions d'actions Logic Apps" } }
answer:
  values: { role: secadmin, tag: agent, unit: scu }
explanation:
  correct:
    en: |
      Setting up, pausing or removing the agent, managing its identity and rejecting feedback require Security Administrator in Microsoft Entra ID. The agent assigns triaged alerts to itself and adds an Agent tag to the incident, so analysts can filter the queue on that tag. The agent runs on Security Copilot capacity, and its Performance tab shows SCU consumption.
    fr: |
      La configuration, la suspension ou la suppression de l'agent, la gestion de son identité et le rejet des retours exigent Security Administrator dans Microsoft Entra ID. L'agent s'attribue les alertes qu'il trie et ajoute une balise Agent à l'incident : les analystes peuvent filtrer la file d'attente sur cette balise. L'agent s'appuie sur la capacité Security Copilot, et son onglet Performance indique la consommation de SCU.
  options:
    secop: { en: "Security Operator isn't the role listed for setting up or removing the agent.", fr: "Security Operator n'est pas le rôle indiqué pour configurer ou supprimer l'agent." }
    secreader: { en: "Security Reader is read-only and can't set up the agent.", fr: "Security Reader est en lecture seule et ne peut pas configurer l'agent." }
    globalreader: { en: "Global Reader is read-only and can't set up the agent.", fr: "Global Reader est en lecture seule et ne peut pas configurer l'agent." }
    gb: { en: "The agent doesn't bill per Log Analytics ingestion; it consumes Security Copilot capacity.", fr: "L'agent n'est pas facturé selon l'ingestion Log Analytics ; il consomme de la capacité Security Copilot." }
    logic: { en: "The agent isn't a Logic Apps playbook.", fr: "L'agent n'est pas un playbook Logic Apps." }
references:
  - title: Microsoft Security Copilot Phishing Triage Agent in Microsoft Defender
    url: https://learn.microsoft.com/en-us/defender-xdr/phishing-triage-agent
