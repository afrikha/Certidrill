id: sc200-2b-idp-builtin-block
objective: "2.1.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Adatum has Microsoft Entra ID P2. A line-of-business application named **App7** signs in to Exchange Online with a service account by using a legacy authentication protocol.

    App7 stops working. The Microsoft Entra sign-in logs show error code **50053** and the block reason "Sign-in was blocked by built-in protections due to high confidence of risk." No risk-based Conditional Access policy applies to the service account. You confirm that the sign-ins are legitimate.

    You need to permanently restore access for App7. The solution must not weaken the protection of other accounts.

    What should you do?
  fr: |
    Adatum dispose de Microsoft Entra ID P2. Une application métier nommée **App7** se connecte à Exchange Online avec un compte de service en utilisant un protocole d'authentification hérité.

    App7 cesse de fonctionner. Les journaux de connexion Microsoft Entra affichent le code d'erreur **50053** et le motif de blocage « Sign-in was blocked by built-in protections due to high confidence of risk. » Aucune stratégie d'accès conditionnel basée sur le risque ne s'applique au compte de service. Vous confirmez que les connexions sont légitimes.

    Vous devez rétablir durablement l'accès d'App7. La solution ne doit pas affaiblir la protection des autres comptes.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Exclude the service account from all user risk-based Conditional Access policies.", fr: "Exclure le compte de service de toutes les stratégies d'accès conditionnel basées sur le risque utilisateur." }
    - id: b
      text: { en: "Update App7 to authenticate by using a modern authentication protocol.", fr: "Mettre à jour App7 pour qu'elle s'authentifie avec un protocole d'authentification moderne." }
    - id: c
      text: { en: "Select Confirm user compromised for the service account, and then reset its password.", fr: "Sélectionner Confirm user compromised pour le compte de service, puis réinitialiser son mot de passe." }
    - id: d
      text: { en: "Disable the sign-in risk policy for the tenant until the sign-ins succeed.", fr: "Désactiver la stratégie de risque de connexion du locataire jusqu'à ce que les connexions réussissent." }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Error 50053 with this block reason comes from built-in protections, not from a policy you configured, and it typically occurs on legacy authentication protocols. The documented fixes are to move the client to a modern authentication protocol or to add the sign-in IP addresses to trusted locations; moving App7 to modern authentication removes the cause without affecting other accounts.
    fr: |
      L'erreur 50053 avec ce motif de blocage provient des protections intégrées, et non d'une stratégie que vous avez configurée ; elle survient généralement avec des protocoles d'authentification hérités. Les corrections documentées consistent à passer le client à un protocole d'authentification moderne ou à ajouter les adresses IP de connexion aux emplacements approuvés ; passer App7 à l'authentification moderne supprime la cause sans affecter les autres comptes.
  options:
    a: { en: "No risk-based policy applies to the account; the block comes from built-in protections, so an exclusion changes nothing.", fr: "Aucune stratégie basée sur le risque ne s'applique au compte ; le blocage provient des protections intégrées, donc une exclusion ne change rien." }
    c: { en: "The sign-ins are legitimate; confirming compromise raises the user risk to High and doesn't remove the cause of the block.", fr: "Les connexions sont légitimes ; confirmer la compromission fait passer le risque utilisateur à High et ne supprime pas la cause du blocage." }
    d: { en: "No sign-in risk policy is involved, and disabling policies would weaken the protection of every account.", fr: "Aucune stratégie de risque de connexion n'est en cause, et désactiver des stratégies affaiblirait la protection de tous les comptes." }
references:
  - title: Remediate risks and unblock users
    url: https://learn.microsoft.com/en-us/entra/id-protection/howto-identity-protection-remediate-unblock
