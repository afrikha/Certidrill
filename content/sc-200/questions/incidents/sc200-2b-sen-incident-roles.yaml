id: sc200-2b-sen-incident-roles
objective: "2.1.7"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    Contoso has a Microsoft Sentinel workspace named **SecWS1**. You need to grant permissions on SecWS1 to three groups of SOC members. Each group must receive only the permissions it needs (principle of least privilege).

    Which role should you assign to each group? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso dispose d'un espace de travail Microsoft Sentinel nommé **SecWS1**. Vous devez accorder des autorisations sur SecWS1 à trois groupes de membres du SOC. Chaque groupe ne doit recevoir que les autorisations dont il a besoin (principe du moindre privilège).

    Quel rôle devez-vous attribuer à chaque groupe ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Tier 1 analysts who investigate incidents, assign them and change their status: [[t1]]

      SOC leads who must be able to delete incident comments: [[lead]]

      Auditors who only view incidents: [[audit]]
    fr: |
      Analystes de niveau 1 qui examinent les incidents, les attribuent et changent leur état : [[t1]]

      Responsables du SOC qui doivent pouvoir supprimer des commentaires d'incident : [[lead]]

      Auditeurs qui consultent uniquement les incidents : [[audit]]
  slots:
    - id: t1
      options:
        - { id: reader, text: Microsoft Sentinel Reader }
        - { id: responder, text: Microsoft Sentinel Responder }
        - { id: contributor, text: Microsoft Sentinel Contributor }
        - { id: automation, text: Microsoft Sentinel Automation Contributor }
    - id: lead
      options:
        - { id: reader, text: Microsoft Sentinel Reader }
        - { id: responder, text: Microsoft Sentinel Responder }
        - { id: contributor, text: Microsoft Sentinel Contributor }
        - { id: automation, text: Microsoft Sentinel Automation Contributor }
    - id: audit
      options:
        - { id: reader, text: Microsoft Sentinel Reader }
        - { id: responder, text: Microsoft Sentinel Responder }
        - { id: contributor, text: Microsoft Sentinel Contributor }
        - { id: automation, text: Microsoft Sentinel Automation Contributor }
answer:
  values: { t1: responder, lead: contributor, audit: reader }
explanation:
  correct:
    en: |
      Microsoft Sentinel Responder is required to investigate incidents and to update them, for example to assign them or change their status. Only users with Microsoft Sentinel Contributor can delete incident comments. Microsoft Sentinel Reader views data and incidents without changing them.
    fr: |
      Microsoft Sentinel Responder est nécessaire pour examiner les incidents et les mettre à jour, par exemple pour les attribuer ou changer leur état. Seuls les utilisateurs disposant de Microsoft Sentinel Contributor peuvent supprimer des commentaires d'incident. Microsoft Sentinel Reader consulte les données et les incidents sans les modifier.
  options:
    automation: { en: "Microsoft Sentinel Automation Contributor lets Microsoft Sentinel add playbooks to automation rules; it isn't meant for users.", fr: "Microsoft Sentinel Automation Contributor permet à Microsoft Sentinel d'ajouter des playbooks aux règles d'automatisation ; il n'est pas destiné aux utilisateurs." }
references:
  - title: Investigate Microsoft Sentinel incidents in depth in the Azure portal
    url: https://learn.microsoft.com/en-us/azure/sentinel/investigate-incidents
  - title: Roles and permissions in the Microsoft Sentinel platform
    url: https://learn.microsoft.com/en-us/azure/sentinel/roles
