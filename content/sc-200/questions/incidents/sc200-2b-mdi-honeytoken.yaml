id: sc200-2b-mdi-honeytoken
objective: "2.1.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Adatum uses Microsoft Defender for Identity. The SOC created a dormant Active Directory user account named **svc-legacysql** as a decoy. No legitimate process uses the account.

    You need Defender for Identity to raise an alert whenever any authentication uses svc-legacysql. The solution must minimize administrative effort.

    What should you do in the Microsoft Defender portal?
  fr: |
    Adatum utilise Microsoft Defender pour Identity. Le SOC a créé un compte d'utilisateur Active Directory inactif nommé **svc-legacysql** comme leurre. Aucun processus légitime n'utilise ce compte.

    Vous devez faire en sorte que Defender pour Identity génère une alerte chaque fois qu'une authentification utilise svc-legacysql. La solution doit réduire au minimum l'effort d'administration.

    Que devez-vous faire dans le portail Microsoft Defender ?
body:
  options:
    - id: a
      text: { en: "In Settings > Identities, tag the account on the Sensitive tab.", fr: "Dans Paramètres > Identités, étiqueter le compte sous l'onglet Sensitive." }
    - id: b
      text: { en: "Create a custom detection rule that queries IdentityLogonEvents for the account.", fr: "Créer une règle de détection personnalisée qui interroge IdentityLogonEvents pour ce compte." }
    - id: c
      text: { en: "In Settings > Identities, add the account to Excluded entities.", fr: "Dans Paramètres > Identités, ajouter le compte aux entités exclues." }
    - id: d
      text: { en: "In Settings > Identities, tag the account on the Honeytoken tab.", fr: "Dans Paramètres > Identités, étiqueter le compte sous l'onglet Honeytoken." }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Honeytoken entities are dormant user or device accounts that act as traps: any authentication that uses them triggers the Honeytoken authentication activity alert. You tag them under Settings > Identities, on the Honeytoken tab, with Tag users.
    fr: |
      Les entités Honeytoken sont des comptes d'utilisateur ou d'appareil inactifs qui servent de pièges : toute authentification qui les utilise déclenche l'alerte Honeytoken authentication activity. Vous les étiquetez sous Paramètres > Identités, dans l'onglet Honeytoken, avec Tag users.
  options:
    a: { en: "The Sensitive tag makes detections such as sensitive group changes work correctly; it doesn't alert on every authentication.", fr: "L'étiquette Sensitive permet aux détections comme les modifications de groupes sensibles de fonctionner correctement ; elle ne génère pas d'alerte à chaque authentification." }
    c: { en: "Excluded entities suppress classic alerts for the entity, the opposite of the requirement.", fr: "Les entités exclues suppriment les alertes classiques pour l'entité, ce qui est l'inverse de l'exigence." }
    b: { en: "A custom detection rule could work, but it is a query to write and maintain, while the built-in honeytoken detection only needs a tag.", fr: "Une règle de détection personnalisée pourrait fonctionner, mais c'est une requête à écrire et à maintenir, alors que la détection Honeytoken intégrée n'exige qu'une étiquette." }
references:
  - title: Defender for Identity entity tags in Microsoft Defender
    url: https://learn.microsoft.com/en-us/defender-for-identity/entity-tags
