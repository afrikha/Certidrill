seriesOrder: 1
difficulty: 2
status: draft
stem:
  en: You run Stop and quarantine file and add a block indicator for the file.
  fr: Vous exécutez Stop and quarantine file et ajoutez un indicateur de blocage pour le fichier.
body:
  solution:
    en: |
      On the file page of PayView.exe, you select **Stop and quarantine file** for all the devices on which the file was observed. You then select **Add indicator** and create an indicator that blocks the file for all devices.
    fr: |
      Dans la page de fichier de PayView.exe, vous sélectionnez **Stop and quarantine file** pour tous les appareils sur lesquels le fichier a été observé. Vous sélectionnez ensuite **Add indicator** et créez un indicateur qui bloque le fichier pour tous les appareils.
answer: { value: true }
explanation:
  correct:
    en: |
      Stop and quarantine file stops the running processes, quarantines the file and deletes its persistent data on the devices where it was seen in the last 30 days. A file indicator with a block action then prevents the portable executable from being read, written or executed on the devices of the organization, including devices where it has not appeared yet. Microsoft recommends combining both actions.
    fr: |
      Stop and quarantine file arrête les processus en cours, met le fichier en quarantaine et supprime ses données persistantes sur les appareils où il a été vu au cours des 30 derniers jours. Un indicateur de fichier avec une action de blocage empêche ensuite l'exécutable portable d'être lu, écrit ou exécuté sur les appareils de l'organisation, y compris ceux où il n'est pas encore apparu. Microsoft recommande de combiner les deux actions.
references:
  - title: Take response actions on a file in Microsoft Defender for Endpoint
    url: https://learn.microsoft.com/en-us/defender-endpoint/respond-file-alerts
