id: sc200-2a-mdc-sample-alerts
objective: "2.1.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Adatum Corporation enabled the Microsoft Defender for Key Vault plan on a subscription named Sub-Apps. The Defender for Cloud alerts are sent to Microsoft Sentinel and by email to the SOC.

    Before go-live, you need to verify that Defender for Key Vault alerts reach Sentinel and the SOC mailbox. The solution must not require performing any attack against the key vaults.

    What should you do?
  fr: |
    Adatum Corporation a activé le plan Microsoft Defender pour Key Vault sur un abonnement nommé Sub-Apps. Les alertes de Defender pour le cloud sont envoyées à Microsoft Sentinel et par e-mail au SOC.

    Avant la mise en production, vous devez vérifier que les alertes de Defender pour Key Vault parviennent à Sentinel et à la boîte aux lettres du SOC. La solution ne doit nécessiter aucune attaque contre les coffres de clés.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Run the Defender for Endpoint detection test command on a VM in Sub-Apps.", fr: "Exécuter la commande de test de détection de Defender for Endpoint sur une machine virtuelle de Sub-Apps." } }
    - { id: b, text: { en: "Launch a simulation from Attack simulation training in Defender for Office 365.", fr: "Lancer une simulation depuis la formation à la simulation d'attaque de Defender pour Office 365." } }
    - { id: c, text: { en: "Select Trigger automated response on an existing Defender for Cloud alert.", fr: "Sélectionner Trigger automated response sur une alerte Defender pour le cloud existante." } }
    - { id: d, text: { en: "Create sample alerts for the Key Vault plan from the Security alerts page.", fr: "Créer des exemples d'alertes pour le plan Key Vault depuis la page Alertes de sécurité." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      On the Security alerts page of Defender for Cloud, a user with the Contributor role on the subscription selects Sample alerts, the subscription and the Defender plans, and then Create sample alerts. The sample alerts concern simulated resources and also appear wherever the alerts are sent, such as connected SIEMs and email notifications.
    fr: |
      Dans la page Alertes de sécurité de Defender pour le cloud, un utilisateur disposant du rôle Contributor sur l'abonnement sélectionne Sample alerts, l'abonnement et les plans Defender, puis Create sample alerts. Les exemples d'alertes concernent des ressources simulées et apparaissent aussi partout où les alertes sont envoyées, comme les SIEM connectés et les notifications par e-mail.
  options:
    a: { en: "The detection test raises a Defender for Endpoint alert for the VM, not a Defender for Key Vault alert.", fr: "Le test de détection déclenche une alerte Defender for Endpoint pour la machine virtuelle, pas une alerte Defender pour Key Vault." }
    b: { en: "Attack simulation training sends simulated phishing to users; it doesn't produce Defender for Cloud alerts.", fr: "La formation à la simulation d'attaque envoie de l'hameçonnage simulé aux utilisateurs ; elle ne produit pas d'alertes Defender pour le cloud." }
    c: { en: "Trigger automated response runs a logic app for an alert that already exists; it doesn't generate a new alert.", fr: "Trigger automated response exécute une application logique pour une alerte existante ; il ne génère pas de nouvelle alerte." }
references:
  - title: Validate alerts in Microsoft Defender for Cloud
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/alert-validation
