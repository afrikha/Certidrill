id: sc200-2d-audit-inbox-rules
objective: "2.3.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam, Inc. uses Microsoft 365. An attacker signed in to the mailbox of a user named Lea. You suspect that the attacker created new inbox rules that move incoming invoices to the RSS Feeds folder. The attacker might have used Outlook on the web or the desktop Outlook client.

    You need to create a search in Microsoft Purview Audit that returns the creation of inbox rules from both clients. The search must not return other mailbox activities.

    Which two operations should you enter in **Activities - operation names**?

    Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam, Inc. utilise Microsoft 365. Un attaquant s'est connecté à la boîte aux lettres d'une utilisatrice nommée Lea. Vous soupçonnez l'attaquant d'avoir créé de nouvelles règles de boîte de réception qui déplacent les factures entrantes vers le dossier Flux RSS. L'attaquant a pu utiliser Outlook sur le web ou le client de bureau Outlook.

    Vous devez créer dans Microsoft Purview Audit une recherche qui renvoie la création de règles de boîte de réception depuis les deux clients. La recherche ne doit pas renvoyer d'autres activités de boîte aux lettres.

    Quelles sont les deux opérations à saisir dans **Activities - operation names** ?

    Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: New-InboxRule }
    - { id: b, text: Add-MailboxPermission }
    - { id: c, text: MailItemsAccessed }
    - { id: d, text: MoveToDeletedItems }
    - { id: e, text: UpdateInboxRules }
answer: { optionIds: [ a, e ] }
explanation:
  correct:
    en: |
      The audit log records a rule created in Outlook on the web as New-InboxRule ("Created new inbox rule in Outlook web app"). Rules created or changed from the desktop Outlook client are recorded as UpdateInboxRules ("Updated inbox rules from Outlook client"). Entering both exact operation names, separated by a comma, covers the two clients.
    fr: |
      Le journal d'audit enregistre une règle créée dans Outlook sur le web sous l'opération New-InboxRule (« Created new inbox rule in Outlook web app »). Les règles créées ou modifiées depuis le client de bureau Outlook sont enregistrées sous UpdateInboxRules (« Updated inbox rules from Outlook client »). Saisir les deux noms d'opération exacts, séparés par une virgule, couvre les deux clients.
  options:
    b: { en: "Add-MailboxPermission records a delegate permission granted on the mailbox, not an inbox rule.", fr: "Add-MailboxPermission enregistre une autorisation de délégué accordée sur la boîte aux lettres, pas une règle de boîte de réception." }
    c: { en: "MailItemsAccessed records access to messages; it would add many records that are not rule creations.", fr: "MailItemsAccessed enregistre l'accès aux messages ; il ajouterait de nombreux enregistrements qui ne sont pas des créations de règles." }
    d: { en: "MoveToDeletedItems records messages moved to the Deleted Items folder by a user, not the rule itself.", fr: "MoveToDeletedItems enregistre les messages déplacés vers le dossier Éléments supprimés par un utilisateur, pas la règle elle-même." }
references:
  - title: Audit log activities
    url: https://learn.microsoft.com/en-us/purview/audit-log-activities
  - title: Search the audit log
    url: https://learn.microsoft.com/en-us/purview/audit-search
