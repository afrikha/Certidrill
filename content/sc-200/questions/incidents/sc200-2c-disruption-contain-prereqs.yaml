id: sc200-2c-disruption-contain-prereqs
objective: "2.2.4"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Northwind Traders onboarded its Windows devices to Microsoft Defender for Endpoint Plan 2. Some devices run Microsoft Defender Antivirus in passive mode next to another antivirus. During a red team exercise, automatic attack disruption didn't contain an unmanaged device that the attackers used.

    You need to ensure that automatic attack disruption can use the **Contain device** action.

    Which two configurations should you verify? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind Traders a intégré ses appareils Windows à Microsoft Defender pour point de terminaison Plan 2. Certains appareils exécutent l'Antivirus Microsoft Defender en mode passif à côté d'un autre antivirus. Lors d'un exercice red team, l'interruption automatique d'attaque n'a pas confiné un appareil non géré utilisé par les attaquants.

    Vous devez faire en sorte que l'interruption automatique d'attaque puisse utiliser l'action **Contain device**.

    Quelles sont les deux configurations que vous devez vérifier ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Microsoft Defender Antivirus runs in active mode on every device.", fr: "L'Antivirus Microsoft Defender s'exécute en mode actif sur chaque appareil." } }
    - { id: b, text: { en: "Device discovery is set to Standard discovery.", fr: "La découverte d'appareils est définie sur Standard discovery." } }
    - { id: c, text: { en: "Live response is turned on in Advanced features.", fr: "Live response est activé dans Advanced features." } }
    - { id: d, text: { en: "The Defender for Identity sensor is installed on every domain controller.", fr: "Le capteur Defender pour Identity est installé sur chaque contrôleur de domaine." } }
    - { id: e, text: { en: "The device groups aren't set to the No automated response automation level.", fr: "Les groupes d'appareils ne sont pas définis sur le niveau d'automatisation No automated response." } }
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: The automatic Contain device action requires Defender for Endpoint device discovery set to Standard discovery. A device group set to No automated response is excluded from automated containment; Full - remediate threats automatically is the recommended level.
    fr: L'action automatique Contain device exige que la découverte d'appareils de Defender pour point de terminaison soit définie sur Standard discovery. Un groupe d'appareils défini sur No automated response est exclu du confinement automatique ; Full - remediate threats automatically est le niveau recommandé.
  options:
    a: { en: "Attack disruption acts on devices regardless of the Defender Antivirus state (active, passive or EDR block mode).", fr: "L'interruption d'attaque agit sur les appareils quel que soit l'état de l'Antivirus Defender (actif, passif ou mode blocage EDR)." }
    c: { en: "Live response is a manual investigation feature; containment doesn't depend on it.", fr: "La réponse dynamique est une fonctionnalité d'investigation manuelle ; le confinement n'en dépend pas." }
    d: { en: "The Defender for Identity sensor is needed to disable Active Directory accounts, not to contain devices.", fr: "Le capteur Defender pour Identity est nécessaire pour désactiver des comptes Active Directory, pas pour confiner des appareils." }
references:
  - title: Configure automatic attack disruption in Microsoft Defender XDR
    url: https://learn.microsoft.com/en-us/defender-xdr/configure-attack-disruption
