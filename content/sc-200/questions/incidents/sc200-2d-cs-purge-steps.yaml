id: sc200-2d-cs-purge-steps
objective: "2.3.2"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    Proseware, Inc. has Microsoft 365 E3 licenses and no Microsoft Defender for Office 365 subscription. eDiscovery premium features are not enabled. The Exchange Online PowerShell module version 3.9.0 is installed on your computer, and you have the Compliance Search and Search And Purge roles.

    A phishing message with the subject "Action required" was delivered to many mailboxes on November 13, 2026. You need to remove the message from all mailboxes and confirm that the removal completed.

    Which five actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Proseware, Inc. dispose de licences Microsoft 365 E3 et d'aucun abonnement Microsoft Defender pour Office 365. Les fonctionnalités premium d'eDiscovery ne sont pas activées. Le module Exchange Online PowerShell version 3.9.0 est installé sur votre ordinateur, et vous disposez des rôles Compliance Search et Search And Purge.

    Un message d'hameçonnage ayant pour objet « Action required » a été remis à de nombreuses boîtes aux lettres le 13 novembre 2026. Vous devez supprimer le message de toutes les boîtes aux lettres et vérifier que la suppression est terminée.

    Quelles sont les cinq actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 5
  actions:
    - { id: connect, text: { en: "Run Connect-IPPSSession -EnableSearchOnlySession.", fr: "Exécuter Connect-IPPSSession -EnableSearchOnlySession." } }
    - { id: create, text: { en: "Run New-ComplianceSearch with -ExchangeLocation All and a query on the subject and received date.", fr: "Exécuter New-ComplianceSearch avec -ExchangeLocation All et une requête sur l'objet et la date de réception." } }
    - { id: start, text: { en: "Run Start-ComplianceSearch and check the estimate with Get-ComplianceSearch.", fr: "Exécuter Start-ComplianceSearch et vérifier l'estimation avec Get-ComplianceSearch." } }
    - { id: purge, text: { en: "Run New-ComplianceSearchAction -Purge -PurgeType SoftDelete.", fr: "Exécuter New-ComplianceSearchAction -Purge -PurgeType SoftDelete." } }
    - { id: status, text: { en: "Run Get-ComplianceSearchAction.", fr: "Exécuter Get-ComplianceSearchAction." } }
    - { id: exo, text: { en: "Run Connect-ExchangeOnline.", fr: "Exécuter Connect-ExchangeOnline." } }
    - { id: hold, text: { en: "Place all mailboxes on Litigation Hold.", fr: "Placer toutes les boîtes aux lettres en conservation pour litige (Litigation Hold)." } }
answer:
  sequence: [ connect, create, start, purge, status ]
explanation:
  correct:
    en: |
      You connect to Security & Compliance PowerShell with Connect-IPPSSession and the EnableSearchOnlySession switch, create the search, start it and check the estimate statistics, and then run the purge action on the search. Get-ComplianceSearchAction shows the status of the purge action, named after the search with the _Purge suffix.
    fr: |
      Vous vous connectez à Security & Compliance PowerShell avec Connect-IPPSSession et le commutateur EnableSearchOnlySession, créez la recherche, la démarrez et vérifiez les statistiques d'estimation, puis exécutez l'action de purge sur la recherche. Get-ComplianceSearchAction affiche l'état de l'action de purge, nommée d'après la recherche avec le suffixe _Purge.
  options:
    exo: { en: "Connect-ExchangeOnline opens Exchange Online PowerShell, where the compliance search cmdlets are not used for search and purge.", fr: "Connect-ExchangeOnline ouvre Exchange Online PowerShell, où les applets de commande de recherche de conformité ne sont pas utilisées pour la recherche et purge." }
    hold: { en: "Search and purge is not supported on mailboxes on litigation hold: the items would be kept.", fr: "La recherche et purge n'est pas prise en charge sur les boîtes aux lettres en conservation pour litige : les éléments seraient conservés." }
references:
  - title: Find and delete email messages in eDiscovery
    url: https://learn.microsoft.com/en-us/purview/edisc-search-mailbox-data
