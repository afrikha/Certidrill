id: sc200-2d-cs-purge-role
objective: "2.3.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Adatum Corporation has Microsoft 365 E3 licenses. Adatum does not have Microsoft Defender for Office 365.

    A SOC analyst named Analyst3 is a member of the eDiscovery Manager role group. Analyst3 created a search that finds a phishing message in 120 mailboxes. When Analyst3 runs `New-ComplianceSearchAction -SearchName "Phish-1117" -Purge -PurgeType SoftDelete`, the command fails with an error stating that no parameter matches the name Purge.

    You need to ensure that Analyst3 can delete the messages. The solution must follow the principle of least privilege.

    What should you do?
  fr: |
    Adatum Corporation dispose de licences Microsoft 365 E3. Adatum ne dispose pas de Microsoft Defender pour Office 365.

    Un analyste SOC nommé Analyst3 est membre du groupe de rôles eDiscovery Manager. Analyst3 a créé une recherche qui trouve un message d'hameçonnage dans 120 boîtes aux lettres. Quand Analyst3 exécute `New-ComplianceSearchAction -SearchName "Phish-1117" -Purge -PurgeType SoftDelete`, la commande échoue avec une erreur indiquant qu'aucun paramètre ne correspond au nom Purge.

    Vous devez faire en sorte qu'Analyst3 puisse supprimer les messages. La solution doit respecter le principe du moindre privilège.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Add Analyst3 to the Organization Management role group in Exchange Online.", fr: "Ajouter Analyst3 au groupe de rôles Organization Management d'Exchange Online." } }
    - { id: b, text: { en: "Add Analyst3 to the eDiscovery Administrator subgroup of eDiscovery Manager.", fr: "Ajouter Analyst3 au sous-groupe eDiscovery Administrator d'eDiscovery Manager." } }
    - { id: c, text: { en: "Assign the Search And Purge role to Analyst3 in the Microsoft Purview portal.", fr: "Attribuer le rôle Search And Purge à Analyst3 dans le portail Microsoft Purview." } }
    - { id: d, text: { en: "Assign the Compliance Search role to Analyst3 in the Microsoft Purview portal.", fr: "Attribuer le rôle Compliance Search à Analyst3 dans le portail Microsoft Purview." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Searching and deleting are separate permissions. Analyst3 can already search through eDiscovery Manager, but deleting messages requires the Search And Purge role; without it, the Purge parameter is not available. Assigning only this role, for example through a custom role group, grants deletion without other administrative rights.
    fr: |
      Rechercher et supprimer sont deux autorisations distinctes. Analyst3 peut déjà rechercher grâce à eDiscovery Manager, mais la suppression des messages exige le rôle Search And Purge ; sans lui, le paramètre Purge n'est pas disponible. Attribuer ce seul rôle, par exemple par un groupe de rôles personnalisé, accorde la suppression sans autres droits d'administration.
  options:
    a: { en: "The Exchange Online Organization Management role group is separate from the Purview role group of the same name and does not grant the purge permission.", fr: "Le groupe de rôles Organization Management d'Exchange Online est distinct du groupe de rôles Purview du même nom et n'accorde pas l'autorisation de purge." }
    b: { en: "eDiscovery Administrators get access to all cases, but the eDiscovery Manager role group does not include the Search And Purge role.", fr: "Les eDiscovery Administrators accèdent à tous les cas, mais le groupe de rôles eDiscovery Manager n'inclut pas le rôle Search And Purge." }
    d: { en: "Compliance Search allows searches only, which Analyst3 can already run.", fr: "Compliance Search permet uniquement les recherches, qu'Analyst3 peut déjà exécuter." }
references:
  - title: Find and delete email messages in eDiscovery
    url: https://learn.microsoft.com/en-us/purview/edisc-search-mailbox-data
  - title: Assign permissions in eDiscovery
    url: https://learn.microsoft.com/en-us/purview/edisc-permissions
