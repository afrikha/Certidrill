id: sc200-2b-cx-blast-radius
objective: "2.1.9"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso uses Microsoft Defender XDR and Microsoft Sentinel in the Defender portal. The tenant meets the prerequisites of every incident graph feature.

    A multi-stage incident shows that an attacker compromised a server named **APP-07**. Before you contain it, you need to identify the critical assets that the attacker could reach next from APP-07, including the possible propagation paths.

    What should you use from the incident graph?
  fr: |
    Contoso utilise Microsoft Defender XDR et Microsoft Sentinel dans le portail Defender. Le locataire respecte les prérequis de toutes les fonctionnalités du graphe d'incident.

    Un incident multi-étapes montre qu'un attaquant a compromis un serveur nommé **APP-07**. Avant de le contenir, vous devez identifier les ressources critiques que l'attaquant pourrait atteindre ensuite depuis APP-07, avec les chemins de propagation possibles.

    Que devez-vous utiliser depuis le graphe de l'incident ?
body:
  options:
    - id: a
      text: { en: "Select the APP-07 node, and then select Play.", fr: "Sélectionner le nœud APP-07, puis sélectionner Play." }
    - id: b
      text: { en: "Select the APP-07 node, and then select View blast radius.", fr: "Sélectionner le nœud APP-07, puis sélectionner View blast radius." }
    - id: c
      text: { en: "Select the APP-07 node, and then select Go hunt > Related Alerts.", fr: "Sélectionner le nœud APP-07, puis sélectionner Go hunt > Related Alerts." }
    - id: d
      text: { en: "Select the APP-07 node, and then filter the graph by Entity types.", fr: "Sélectionner le nœud APP-07, puis filtrer le graphe par types d'entités." }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Blast radius analysis shows the possible propagation paths from a selected node to predefined critical targets, combining pre-breach and post-breach views in the incident graph. It extends and replaces attack path analysis. The paths are possible routes, not proof that the attacker used them.
    fr: |
      L'analyse du rayon d'impact montre les chemins de propagation possibles depuis un nœud sélectionné vers des cibles critiques prédéfinies, en combinant les vues avant et après compromission dans le graphe de l'incident. Elle étend et remplace l'analyse des chemins d'attaque. Les chemins sont des itinéraires possibles, pas la preuve que l'attaquant les a empruntés.
  options:
    a: { en: "Play replays what already happened in chronological order; it doesn't predict where the attacker can go next.", fr: "Play rejoue ce qui s'est déjà produit dans l'ordre chronologique ; il ne prédit pas où l'attaquant peut aller ensuite." }
    c: { en: "Related Alerts returns alerts that already involve the entity, not possible future paths.", fr: "Related Alerts renvoie les alertes qui impliquent déjà l'entité, pas les chemins futurs possibles." }
    d: { en: "Entity type filters hide entity types to simplify the graph; they don't calculate paths.", fr: "Les filtres par type d'entité masquent des types d'entités pour simplifier le graphe ; ils ne calculent pas de chemins." }
references:
  - title: Investigate incidents in the Microsoft Defender portal (Legacy)
    url: https://learn.microsoft.com/en-us/defender-xdr/investigate-incidents
