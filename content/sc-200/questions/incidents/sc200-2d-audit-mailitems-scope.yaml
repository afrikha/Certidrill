id: sc200-2d-audit-mailitems-scope
objective: "2.3.1"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    Tailspin Toys uses Microsoft 365 E5. The attacker who compromised the mailbox of a user named Omar was evicted yesterday. The MailItemsAccessed action is audited for Omar's mailbox.

    You search the audit log for the MailItemsAccessed records of Omar's mailbox during the compromise. You need to determine the scope of the data the attacker could read.

    How should you complete the investigation plan? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin Toys utilise Microsoft 365 E5. L'attaquant qui avait compromis la boîte aux lettres d'un utilisateur nommé Omar a été évincé hier. L'action MailItemsAccessed est auditée pour la boîte aux lettres d'Omar.

    Vous recherchez dans le journal d'audit les enregistrements MailItemsAccessed de la boîte aux lettres d'Omar pendant la compromission. Vous devez déterminer l'étendue des données que l'attaquant a pu lire.

    Comment devez-vous compléter le plan d'enquête ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      1. To find out whether the attacker downloaded entire folders with a desktop Outlook client, keep the records whose MailAccessType is [[access]].
      2. To separate the attacker's activity from Omar's own activity, compare the [[session]] values of the records with those of the attacker's sign-ins.
      3. To list the individual messages that the attacker opened, use the [[msg]] values of the Bind records.
    fr: |
      1. Pour savoir si l'attaquant a téléchargé des dossiers entiers avec un client Outlook de bureau, conservez les enregistrements dont le MailAccessType est [[access]].
      2. Pour distinguer l'activité de l'attaquant de celle d'Omar, comparez les valeurs [[session]] des enregistrements à celles des connexions de l'attaquant.
      3. Pour lister les messages individuels que l'attaquant a ouverts, utilisez les valeurs [[msg]] des enregistrements Bind.
  slots:
    - id: access
      options:
        - { id: sync, text: Sync }
        - { id: bind, text: Bind }
        - { id: read, text: Read }
    - id: session
      options:
        - { id: sid, text: SessionId }
        - { id: count, text: OperationCount }
        - { id: upn, text: MailboxUPN }
        - { id: parent, text: ParentFolder }
    - id: msg
      options:
        - { id: imid, text: InternetMessageId }
        - { id: opcount, text: OperationCount }
        - { id: logon, text: Logon_type }
        - { id: info, text: ClientInfoString }
answer:
  values: { access: sync, session: sid, msg: imid }
explanation:
  correct:
    en: |
      A desktop Outlook client downloads whole folders, which generates Sync records, one per folder, and every item of a synced folder must be treated as compromised. SessionId, together with the client IP address and client information, separates the attacker's sessions from the user's normal sessions. Bind records store the InternetMessageId of each message accessed, which identifies the messages read.
    fr: |
      Un client Outlook de bureau télécharge des dossiers entiers, ce qui génère des enregistrements Sync, un par dossier, et tous les éléments d'un dossier synchronisé doivent être considérés comme compromis. SessionId, avec l'adresse IP et les informations du client, distingue les sessions de l'attaquant des sessions normales de l'utilisateur. Les enregistrements Bind stockent l'InternetMessageId de chaque message consulté, ce qui identifie les messages lus.
  options:
    bind: { en: "Bind records cover access to individual messages, not the download of a whole folder.", fr: "Les enregistrements Bind couvrent l'accès à des messages individuels, pas le téléchargement d'un dossier entier." }
    upn: { en: "MailboxUPN is the same for the attacker and for Omar, because both access Omar's mailbox.", fr: "MailboxUPN est identique pour l'attaquant et pour Omar, car tous deux accèdent à la boîte aux lettres d'Omar." }
    opcount: { en: "OperationCount gives the number of aggregated operations in a record, not which messages they concern.", fr: "OperationCount donne le nombre d'opérations agrégées dans un enregistrement, pas les messages concernés." }
references:
  - title: Use MailItemsAccessed to investigate compromised accounts
    url: https://learn.microsoft.com/en-us/purview/audit-log-investigate-accounts
