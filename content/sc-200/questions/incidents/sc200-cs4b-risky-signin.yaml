id: sc200-cs4b-risky-signin
objective: "2.1.5"
type: single
caseStudy: sc200-cs4b-best-for-you-organics
difficulty: 1
status: draft
stem:
  en: |
    An analyst investigates a risky sign-in of a user named User7 and determines that an attacker performed it.

    You need to meet the compromised sign-ins requirement. Which action should the analyst perform in Microsoft Entra ID Protection?
  fr: |
    Un analyste examine une connexion à risque d'un utilisateur nommé User7 et détermine qu'elle a été effectuée par un attaquant.

    Vous devez respecter l'exigence relative aux connexions compromises. Quelle action l'analyste doit-il effectuer dans Microsoft Entra ID Protection ?
body:
  options:
    - { id: a, text: "Confirm user safe" }
    - { id: b, text: "Dismiss user risk" }
    - { id: c, text: "Confirm sign-in compromised" }
    - { id: d, text: "Confirm sign-in safe" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Confirm sign-in compromised marks the sign-in as a true positive and immediately raises the user risk and the aggregate sign-in risk to High. Because User7 is included in CA-UserRisk and is registered for multifactor authentication and self-service password reset, User7 must perform a secure password change at the next sign-in, which remediates the risk without a temporary password.
    fr: |
      Confirm sign-in compromised marque la connexion comme vrai positif et élève immédiatement le risque utilisateur et le risque de connexion agrégé à High. Comme User7 est inclus dans CA-UserRisk et inscrit à l'authentification multifacteur et à la réinitialisation de mot de passe en libre-service, User7 doit effectuer un changement de mot de passe sécurisé à sa prochaine connexion, ce qui corrige le risque sans mot de passe temporaire.
  options:
    a:
      en: |
        Confirm user safe removes the risk of User7, so CA-UserRisk no longer requires a password change.
      fr: |
        Confirm user safe supprime le risque de User7 : CA-UserRisk n'exige donc plus de changement de mot de passe.
    b:
      en: Dismiss user risk treats the detection as a benign positive, so the user is not forced to change the password.
      fr: |
        Dismiss user risk traite la détection comme un positif bénin : l'utilisateur n'est pas obligé de changer de mot de passe.
    d:
      en: Confirm sign-in safe marks the sign-in as a false positive, which is the opposite of the analyst's conclusion.
      fr: Confirm sign-in safe marque la connexion comme faux positif, soit l'inverse de la conclusion de l'analyste.
references:
  - title: Provide risk feedback in Microsoft Entra ID Protection
    url: https://learn.microsoft.com/en-us/entra/id-protection/howto-identity-protection-risk-feedback
