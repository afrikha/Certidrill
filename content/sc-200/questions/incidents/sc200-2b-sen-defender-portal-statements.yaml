id: sc200-2b-sen-defender-portal-statements
objective: "2.1.7"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Northwind Traders onboarded its Microsoft Sentinel workspace to the Microsoft Defender portal. Analysts investigate Sentinel incidents only in the Defender portal.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind Traders a intégré son espace de travail Microsoft Sentinel au portail Microsoft Defender. Les analystes examinent les incidents Sentinel uniquement dans le portail Defender.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          If an analyst changes the severity of an incident and then its owner two minutes later, Microsoft Sentinel might receive only the owner change.
        fr: |
          Si un analyste change la gravité d'un incident puis son propriétaire deux minutes plus tard, Microsoft Sentinel peut ne recevoir que le changement de propriétaire.
    - id: s2
      text:
        en: |
          An analyst can edit an existing incident comment in the Defender portal.
        fr: |
          Un analyste peut modifier un commentaire d'incident existant dans le portail Defender.
    - id: s3
      text:
        en: |
          For an incident created by an analytics rule, Run query shows the results related to the incident in advanced hunting.
        fr: |
          Pour un incident créé par une règle d'analytique, Run query affiche les résultats liés à l'incident dans le repérage avancé.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |
      When several changes are made to the same incident within 5 to 10 minutes, only the most recent change is sent to Microsoft Sentinel, so the severity change can be lost. Comments can be added in the Defender portal, but editing existing comments isn't supported there. For incidents created by an analytics rule, Run query shows the related results.
    fr: |
      Lorsque plusieurs modifications sont apportées au même incident en 5 à 10 minutes, seule la plus récente est envoyée à Microsoft Sentinel : le changement de gravité peut donc être perdu. Des commentaires peuvent être ajoutés dans le portail Defender, mais la modification des commentaires existants n'y est pas prise en charge. Pour les incidents créés par une règle d'analytique, Run query affiche les résultats associés.
references:
  - title: Transition your Microsoft Sentinel environment to the Defender portal
    url: https://learn.microsoft.com/en-us/azure/sentinel/move-to-defender
  - title: Investigate incidents in the Microsoft Defender portal (Legacy)
    url: https://learn.microsoft.com/en-us/defender-xdr/investigate-incidents
