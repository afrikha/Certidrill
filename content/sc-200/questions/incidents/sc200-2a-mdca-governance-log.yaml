id: sc200-2a-mdca-governance-log
objective: "2.1.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Adatum Corporation uses Microsoft Defender for Cloud Apps. A policy automatically applied a governance action to a user account last night.

    You need to check whether the action succeeded and, if needed, revert it.

    Where should you go in the Microsoft Defender portal?
  fr: |
    Adatum Corporation utilise Microsoft Defender pour les applications cloud. Une stratégie a automatiquement appliqué une action de gouvernance à un compte d'utilisateur la nuit dernière.

    Vous devez vérifier si l'action a réussi et, si nécessaire, l'annuler.

    Où devez-vous aller dans le portail Microsoft Defender ?
body:
  options:
    - { id: a, text: { en: "Cloud Apps > Governance log", fr: "Cloud Apps > Journal de gouvernance" } }
    - { id: b, text: { en: "Cloud Apps > Activity log", fr: "Cloud Apps > Journal d'activité" } }
    - { id: c, text: { en: "Cloud Apps > Policies > Policy management", fr: "Cloud Apps > Stratégies > Gestion des stratégies" } }
    - { id: d, text: { en: "Settings > Cloud Apps > App connectors", fr: "Paramètres > Cloud Apps > Connecteurs d'applications" } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      The Governance log records each task that Defender for Cloud Apps runs, manual or automatic, with its success or failure. From the log, you can retry or revert some of the governance actions.
    fr: |
      Le journal de gouvernance enregistre chaque tâche exécutée par Defender pour les applications cloud, manuelle ou automatique, avec sa réussite ou son échec. Depuis le journal, vous pouvez relancer ou annuler certaines actions de gouvernance.
  options:
    b: { en: "The Activity log shows the user and admin activities in connected apps, not the status of governance tasks.", fr: "Le journal d'activité affiche les activités des utilisateurs et des administrateurs dans les applications connectées, pas l'état des tâches de gouvernance." }
    c: { en: "Policy management lets you edit policies and their actions, not review or revert the actions already applied.", fr: "La gestion des stratégies permet de modifier les stratégies et leurs actions, pas d'examiner ou d'annuler les actions déjà appliquées." }
    d: { en: "App connectors configure the connection to apps such as Microsoft 365.", fr: "Les connecteurs d'applications configurent la connexion à des applications comme Microsoft 365." }
references:
  - title: Governing connected apps
    url: https://learn.microsoft.com/en-us/defender-cloud-apps/governance-actions
