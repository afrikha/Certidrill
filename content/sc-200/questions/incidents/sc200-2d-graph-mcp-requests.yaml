id: sc200-2d-graph-mcp-requests
objective: "2.3.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Wingtip Toys streams the Microsoft Graph activity logs to a Microsoft Sentinel workspace. Several employees use AI clients that query tenant data through the Microsoft MCP Server for Enterprise.

    You need to write a hunting query that returns only the Microsoft Graph requests sent through the Microsoft MCP Server for Enterprise.

    Which filter should you add to a query on the MicrosoftGraphActivityLogs table?
  fr: |
    Wingtip Toys diffuse les journaux d'activité Microsoft Graph vers un espace de travail Microsoft Sentinel. Plusieurs employés utilisent des clients d'IA qui interrogent les données du locataire par le Microsoft MCP Server for Enterprise.

    Vous devez écrire une requête de repérage qui ne renvoie que les requêtes Microsoft Graph envoyées par le Microsoft MCP Server for Enterprise.

    Quel filtre devez-vous ajouter à une requête sur la table MicrosoftGraphActivityLogs ?
body:
  options:
    - { id: a, text: "| where ClientAuthMethod == 0" }
    - { id: b, text: "| where ApiVersion == \"beta\"" }
    - { id: c, text: "| where isnotempty(SignInActivityId)" }
    - { id: d, text: "| where RequestUri contains \"/enterprise\"" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      The Microsoft Graph activity logs include the requests of AI clients that query the Microsoft MCP Server for Enterprise. These requests are identified by a RequestUri that includes /enterprise, so filtering on that value isolates them.
    fr: |
      Les journaux d'activité Microsoft Graph incluent les requêtes des clients d'IA qui interrogent le Microsoft MCP Server for Enterprise. Ces requêtes se reconnaissent à un RequestUri qui contient /enterprise : filtrer sur cette valeur les isole.
  options:
    a: { en: "ClientAuthMethod 0 means a public client, which covers many apps that do not use the MCP Server.", fr: "ClientAuthMethod 0 signifie un client public, ce qui couvre de nombreuses applications qui n'utilisent pas le serveur MCP." }
    b: { en: "ApiVersion shows the API version of the event; many ordinary apps call the beta endpoint.", fr: "ApiVersion indique la version d'API de l'événement ; de nombreuses applications ordinaires appellent le point de terminaison beta." }
    c: { en: "SignInActivityId links a request to the sign-in that issued its token; almost every request has one.", fr: "SignInActivityId relie une requête à la connexion qui a émis son jeton ; presque toutes les requêtes en ont un." }
references:
  - title: Access Microsoft Graph activity logs for tenant monitoring
    url: https://learn.microsoft.com/en-us/graph/microsoft-graph-activity-logs-overview
