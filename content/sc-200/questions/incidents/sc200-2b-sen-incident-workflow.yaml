id: sc200-2b-sen-incident-workflow
objective: "2.1.7"
type: ordering
difficulty: 1
status: draft
stem:
  en: |
    Wingtip Toys onboarded its Microsoft Sentinel workspace to the Microsoft Defender portal. A new incident from a Sentinel analytics rule reports a brute-force attack on a VPN gateway. A playbook named **Block-SourceIP** uses the Microsoft Sentinel incident trigger.

    You need to take ownership of the incident, investigate it, remediate it and close it.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Wingtip Toys a intégré son espace de travail Microsoft Sentinel au portail Microsoft Defender. Un nouvel incident issu d'une règle d'analytique Sentinel signale une attaque par force brute sur une passerelle VPN. Un playbook nommé **Block-SourceIP** utilise le déclencheur d'incident Microsoft Sentinel.

    Vous devez prendre en charge l'incident, l'examiner, le corriger et le fermer.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: assign, text: { en: "Assign the incident to yourself and set its status to In progress.", fr: "Vous attribuer l'incident et définir son état sur En cours." } }
    - { id: review, text: { en: "Review the alerts, the entities and the attack story of the incident.", fr: "Examiner les alertes, les entités et l'histoire de l'attaque de l'incident." } }
    - { id: run, text: { en: "Run the Block-SourceIP playbook on the incident.", fr: "Exécuter le playbook Block-SourceIP sur l'incident." } }
    - { id: resolve, text: { en: "Set the status to Resolved with the True positive classification and a comment.", fr: "Définir l'état sur Résolu avec la classification Vrai positif et un commentaire." } }
    - { id: entity, text: { en: "Run the Block-SourceIP playbook on the IP address entity.", fr: "Exécuter le playbook Block-SourceIP sur l'entité d'adresse IP." } }
    - { id: rule, text: { en: "Create an automation rule directly from the incident page.", fr: "Créer une règle d'automatisation directement depuis la page de l'incident." } }
answer:
  sequence: [ assign, review, run, resolve ]
explanation:
  correct:
    en: |
      You first take ownership so that other analysts don't duplicate the work, then investigate the alerts, entities and attack story. You remediate by running the incident-trigger playbook on the incident, and finally resolve the incident with a classification and a comment.
    fr: |
      Vous prenez d'abord l'incident en charge pour éviter que d'autres analystes ne dupliquent le travail, puis vous examinez les alertes, les entités et l'histoire de l'attaque. Vous corrigez en exécutant le playbook à déclencheur d'incident sur l'incident, et vous résolvez enfin l'incident avec une classification et un commentaire.
  options:
    entity: { en: "Running a playbook manually on an alert or an entity isn't supported in the Defender portal.", fr: "L'exécution manuelle d'un playbook sur une alerte ou une entité n'est pas prise en charge dans le portail Defender." }
    rule: { en: "Creating an automation rule directly from an incident is supported only in the Azure portal, and it isn't needed to handle this incident.", fr: "La création d'une règle d'automatisation directement depuis un incident n'est prise en charge que dans le portail Azure, et elle n'est pas nécessaire pour traiter cet incident." }
references:
  - title: Transition your Microsoft Sentinel environment to the Defender portal
    url: https://learn.microsoft.com/en-us/azure/sentinel/move-to-defender
