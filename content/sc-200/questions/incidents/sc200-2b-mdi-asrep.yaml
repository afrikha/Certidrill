id: sc200-2b-mdi-asrep
objective: "2.1.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso uses Microsoft Defender for Identity. Defender for Identity raises a **Suspected AS-REP Roasting attack** alert that lists two user accounts, **svc-print** and **svc-scan**, as targets.

    You need to change the configuration of the targeted accounts so that the attack technique no longer works against them.

    What should you do?
  fr: |
    Contoso utilise Microsoft Defender pour Identity. Defender pour Identity génère une alerte **Suspected AS-REP Roasting attack** qui indique deux comptes d'utilisateur, **svc-print** et **svc-scan**, comme cibles.

    Vous devez modifier la configuration des comptes ciblés afin que la technique d'attaque ne fonctionne plus contre eux.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Clear the Do not require Kerberos preauthentication option on both accounts.", fr: "Désactiver l'option Do not require Kerberos preauthentication sur les deux comptes." }
    - id: b
      text: { en: "Remove the service principal names (SPNs) from both accounts.", fr: "Supprimer les noms de principal du service (SPN) des deux comptes." }
    - id: c
      text: { en: "Tag both accounts as Honeytoken in Defender for Identity.", fr: "Étiqueter les deux comptes comme Honeytoken dans Defender pour Identity." }
    - id: d
      text: { en: "Add both accounts to the Excluded entities of the detection.", fr: "Ajouter les deux comptes aux entités exclues de la détection." }
answer: { optionId: a }
explanation:
  correct:
    en: |
      AS-REP Roasting sends authentication requests (AS-REQ) for accounts that don't require Kerberos preauthentication, and then cracks the response offline. Requiring preauthentication on svc-print and svc-scan removes the condition that the attack relies on.
    fr: |
      L'AS-REP Roasting envoie des demandes d'authentification (AS-REQ) pour des comptes qui n'exigent pas la préauthentification Kerberos, puis casse la réponse hors ligne. Exiger la préauthentification sur svc-print et svc-scan supprime la condition dont dépend l'attaque.
  options:
    b: { en: "Removing SPNs addresses Kerberoasting (Suspected Kerberos SPN exposure), a different technique.", fr: "La suppression des SPN répond au Kerberoasting (Suspected Kerberos SPN exposure), une technique différente." }
    c: { en: "A honeytoken tag raises alerts when the account is used; it doesn't protect the accounts.", fr: "Une étiquette Honeytoken génère des alertes quand le compte est utilisé ; elle ne protège pas les comptes." }
    d: { en: "Excluding the accounts only hides future alerts and leaves them vulnerable.", fr: "Exclure les comptes masque seulement les alertes futures et les laisse vulnérables." }
references:
  - title: Microsoft Defender for Identity classic alerts
    url: https://learn.microsoft.com/en-us/defender-for-identity/alerts-mdi-classic
