id: sc200-2a-disruption-statements
objective: "2.1.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Wingtip Toys uses Microsoft Defender XDR with Defender for Office 365, Defender for Endpoint and Defender for Identity. The Defender for Identity sensor isn't installed on every domain controller yet.

    An incident named **BEC financial fraud attack launched from a compromised account** appears in the incident queue with the **Attack Disruption** tag. The attacker used a cloud-only account and an onboarded device named LT-042.

    Which two statements are true?

    NOTE: Each correct selection is worth one point.
  fr: |
    Wingtip Toys utilise Microsoft Defender XDR avec Defender pour Office 365, Defender for Endpoint et Defender pour Identity. Le capteur Defender pour Identity n'est pas encore installé sur tous les contrôleurs de domaine.

    Un incident nommé **BEC financial fraud attack launched from a compromised account** apparaît dans la file d'attente des incidents avec la balise **Attack Disruption**. L'attaquant a utilisé un compte cloud uniquement et un appareil intégré nommé LT-042.

    Quelles sont les deux affirmations vraies ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Attack disruption can disable the cloud-only account in Microsoft Entra ID, even where no Defender for Identity sensor is deployed.", fr: "L'interruption des attaques peut désactiver le compte cloud dans Microsoft Entra ID, même là où aucun capteur Defender pour Identity n'est déployé." } }
    - { id: b, text: { en: "Each containment action waits on the Pending tab of the Action center until an analyst approves it.", fr: "Chaque action de confinement attend dans l'onglet En attente du centre de notifications qu'un analyste l'approuve." } }
    - { id: c, text: { en: "After the investigation, an analyst can select LT-042 on the incident page and release it from containment.", fr: "Après l'enquête, un analyste peut sélectionner LT-042 dans la page de l'incident et le libérer du confinement." } }
    - { id: d, text: { en: "Attack disruption also soft deletes the phishing messages from the mailboxes of all the recipients.", fr: "L'interruption des attaques supprime aussi de façon réversible les messages d'hameçonnage des boîtes aux lettres de tous les destinataires." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: Disabling a user in Microsoft Entra ID doesn't depend on the Defender for Identity deployment; for cloud-only accounts, the action goes through a Microsoft-managed enterprise application. Attack disruption actions are automatic, and the SOC can undo them, for example with release from containment for a device or enable user for an account, after completing the investigation.
    fr: La désactivation d'un utilisateur dans Microsoft Entra ID ne dépend pas du déploiement de Defender pour Identity ; pour les comptes cloud, l'action passe par une application d'entreprise gérée par Microsoft. Les actions d'interruption des attaques sont automatiques, et le SOC peut les annuler, par exemple avec release from containment pour un appareil ou enable user pour un compte, une fois l'enquête terminée.
  options:
    b: { en: "Attack disruption contains assets automatically while the attack is in progress; no approval is required before the action runs.", fr: "L'interruption des attaques confine les ressources automatiquement pendant l'attaque ; aucune approbation n'est requise avant l'exécution de l'action." }
    d: { en: "Attack disruption contains users, devices, IP addresses and apps; removing the messages remains an email remediation task (Threat Explorer, AIR).", fr: "L'interruption des attaques confine des utilisateurs, des appareils, des adresses IP et des applications ; retirer les messages reste une tâche de correction des e-mails (Explorateur de menaces, AIR)." }
references:
  - title: Automatic attack disruption in Microsoft Defender
    url: https://learn.microsoft.com/en-us/defender-xdr/automatic-attack-disruption
  - title: Details and results of an automatic attack disruption action
    url: https://learn.microsoft.com/en-us/defender-xdr/autoad-results
