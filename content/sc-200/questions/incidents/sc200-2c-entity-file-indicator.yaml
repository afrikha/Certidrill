id: sc200-2c-entity-file-indicator
objective: "2.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Northwind Traders has 6,000 Windows 11 devices onboarded to Microsoft Defender for Endpoint, with Microsoft Defender Antivirus and cloud-delivered protection enabled. The **Allow or block file** advanced feature is turned on.

    A malicious executable named **pdfconv.exe** was observed on 40 devices. Attackers keep sending it to new users.

    You need to prevent pdfconv.exe from running on any device in the future, including devices where it has never been observed. The solution must minimize administrative effort.

    What should you do from the file page?
  fr: |
    Northwind Traders dispose de 6 000 appareils Windows 11 intégrés à Microsoft Defender pour point de terminaison, avec l'Antivirus Microsoft Defender et la protection fournie par le cloud activés. La fonctionnalité avancée **Allow or block file** est activée.

    Un exécutable malveillant nommé **pdfconv.exe** a été observé sur 40 appareils. Les attaquants continuent de l'envoyer à de nouveaux utilisateurs.

    Vous devez empêcher pdfconv.exe de s'exécuter à l'avenir sur tous les appareils, y compris ceux où il n'a jamais été observé. La solution doit réduire au minimum l'effort d'administration.

    Que devez-vous faire depuis la page du fichier ?
body:
  options:
    - id: a
      text: { en: "Select Stop and quarantine file", fr: "Sélectionner Stop and quarantine file" }
    - id: b
      text: { en: "Add an indicator that blocks the file", fr: "Ajouter un indicateur qui bloque le fichier" }
    - id: c
      text: { en: "Submit the file for deep analysis", fr: "Soumettre le fichier à l'analyse approfondie (Deep analysis)" }
    - id: d
      text: { en: "Select Go hunt and create a custom detection rule from the query", fr: "Sélectionner Go hunt et créer une règle de détection personnalisée à partir de la requête" }
answer: { optionId: b }
explanation:
  correct:
    en: A block indicator on the file hash prevents the PE file from running on every device from then on, and can raise an alert when a device tries to run it. It requires Microsoft Defender Antivirus with cloud-delivered protection and the Allow or block file feature, which are in place.
    fr: Un indicateur de blocage sur le hachage du fichier empêche le fichier PE de s'exécuter sur tous les appareils à partir de ce moment, et peut déclencher une alerte quand un appareil tente de l'exécuter. Il exige l'Antivirus Microsoft Defender avec la protection fournie par le cloud et la fonctionnalité Allow or block file, qui sont en place.
  options:
    a:
      en: Stop and quarantine acts only on the devices where the file was observed during the last 30 days; it doesn't protect devices that receive the file later.
      fr: Stop and quarantine n'agit que sur les appareils où le fichier a été observé au cours des 30 derniers jours ; il ne protège pas les appareils qui recevront le fichier plus tard.
    c:
      en: Deep analysis runs the file in a sandbox and reports its behavior; it doesn't block it.
      fr: L'analyse approfondie exécute le fichier dans un bac à sable et rend compte de son comportement ; elle ne le bloque pas.
    d:
      en: A custom detection rule raises alerts after the file runs; it doesn't prevent execution, and it adds a rule to maintain.
      fr: Une règle de détection personnalisée déclenche des alertes après l'exécution du fichier ; elle n'empêche pas l'exécution et ajoute une règle à maintenir.
references:
  - title: Take response actions on a file in Microsoft Defender for Endpoint
    url: https://learn.microsoft.com/en-us/defender-endpoint/respond-file-alerts
