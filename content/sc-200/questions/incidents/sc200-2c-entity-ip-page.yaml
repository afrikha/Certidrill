id: sc200-2c-entity-ip-page
objective: "2.2.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Threat intelligence reports that the IP address 198.51.100.77 hosts a command-and-control server. Wingtip Toys has 300 devices onboarded to Microsoft Defender for Endpoint.

    You need to identify the devices that communicated with 198.51.100.77 and when the address was first and last seen in the organization. The solution must minimize administrative effort.

    What should you do?
  fr: |
    Le renseignement sur les menaces indique que l'adresse IP 198.51.100.77 héberge un serveur de commande et de contrôle. Wingtip Toys dispose de 300 appareils intégrés à Microsoft Defender pour point de terminaison.

    Vous devez identifier les appareils qui ont communiqué avec 198.51.100.77 et savoir quand l'adresse a été vue pour la première et la dernière fois dans l'organisation. La solution doit réduire au minimum l'effort d'administration.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Search the timeline of each device for the IP address", fr: "Rechercher l'adresse IP dans la chronologie de chaque appareil" }
    - id: b
      text: { en: "Create an IP address indicator for 198.51.100.77 in Settings > Endpoints > Indicators", fr: "Créer un indicateur d'adresse IP pour 198.51.100.77 dans Settings > Endpoints > Indicators" }
    - id: c
      text: { en: "Search for the IP address in the portal and open its IP address page", fr: "Rechercher l'adresse IP dans le portail et ouvrir sa page d'adresse IP" }
    - id: d
      text: { en: "Open the Threat analytics report of the threat actor", fr: "Ouvrir le rapport Threat analytics de l'acteur de menace" }
answer: { optionId: c }
explanation:
  correct:
    en: The IP address page shows its geolocation and ASN, related alerts, the devices in the organization that communicated with it, and its prevalence with first and last seen dates (30 days by default). Search returns results only for addresses observed communicating with your devices.
    fr: La page d'adresse IP affiche sa géolocalisation et son ASN, les alertes associées, les appareils de l'organisation qui ont communiqué avec elle et sa prévalence avec les dates de première et dernière observation (30 jours par défaut). La recherche ne renvoie de résultats que pour les adresses observées en communication avec vos appareils.
  options:
    a:
      en: Searching 300 timelines one by one doesn't minimize administrative effort.
      fr: Rechercher dans 300 chronologies une par une ne réduit pas l'effort d'administration.
    b:
      en: An indicator blocks or audits future connections; it doesn't list the devices that already communicated with the address.
      fr: Un indicateur bloque ou audite les connexions futures ; il ne liste pas les appareils qui ont déjà communiqué avec l'adresse.
    d:
      en: A Threat analytics report describes a threat and your exposure, not the devices that contacted a specific address.
      fr: Un rapport Threat analytics décrit une menace et votre exposition, pas les appareils qui ont contacté une adresse précise.
references:
  - title: Investigate an IP address associated with a Microsoft Defender for Endpoint alert
    url: https://learn.microsoft.com/en-us/defender-endpoint/investigate-ip
