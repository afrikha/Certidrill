id: sc200-2a-mdo-compromised-order
objective: "2.1.1"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    Tailspin Toys uses Microsoft 365 and Microsoft Defender for Office 365. A cloud-only user named User2 reports missing email, and the Sent Items folder of User2's mailbox contains payment requests that User2 didn't write.

    You need to secure User2's account by following Microsoft's recommended response sequence for a compromised email account. The investigation isn't complete yet.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Tailspin Toys utilise Microsoft 365 et Microsoft Defender pour Office 365. Un utilisateur cloud nommé User2 signale des e-mails manquants, et le dossier Éléments envoyés de sa boîte aux lettres contient des demandes de paiement que User2 n'a pas écrites.

    Vous devez sécuriser le compte de User2 en suivant la séquence de réponse recommandée par Microsoft pour un compte de messagerie compromis. L'enquête n'est pas encore terminée.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: disable, text: { en: "Disable User2's account.", fr: "Désactiver le compte de User2." } }
    - { id: revoke, text: { en: "Revoke User2's sign-in sessions.", fr: "Révoquer les sessions de connexion de User2." } }
    - { id: mfa, text: { en: "Review the MFA devices registered for User2 and remove the suspicious ones.", fr: "Examiner les appareils MFA inscrits pour User2 et supprimer ceux qui sont suspects." } }
    - { id: rules, text: { en: "Review the mailbox forwarding and the inbox rules, including hidden rules, and remove the suspicious ones.", fr: "Examiner le transfert de la boîte aux lettres et les règles de boîte de réception, y compris les règles masquées, et supprimer celles qui sont suspectes." } }
    - { id: unblock, text: { en: "Remove User2 from the Restricted entities page.", fr: "Retirer User2 de la page Entités restreintes." } }
    - { id: mailpwd, text: { en: "Send User2 a new temporary password by email.", fr: "Envoyer un nouveau mot de passe temporaire à User2 par e-mail." } }
    - { id: purge, text: { en: "Hard delete every message in User2's Sent Items folder.", fr: "Supprimer définitivement (Hard delete) tous les messages du dossier Éléments envoyés de User2." } }
answer:
  sequence: [ disable, revoke, mfa, rules ]
explanation:
  correct:
    en: Microsoft recommends disabling the account first (resetting the password is the fallback), then revoking the sessions so that stolen tokens stop working. You then remove the persistence that the attacker could have added, starting with registered MFA devices, then consented apps and admin roles, and finally mailbox forwarding and inbox rules (checked with Get-InboxRule -IncludeHidden).
    fr: Microsoft recommande de désactiver d'abord le compte (la réinitialisation du mot de passe est la solution de repli), puis de révoquer les sessions pour que les jetons volés cessent de fonctionner. Vous supprimez ensuite la persistance que l'attaquant a pu ajouter, en commençant par les appareils MFA inscrits, puis les applications consenties et les rôles d'administrateur, et enfin le transfert et les règles de boîte de réception (vérifiés avec Get-InboxRule -IncludeHidden).
  options:
    unblock: { en: "Removing the user from the Restricted entities page comes after the investigation is complete, and only if the account was restricted.", fr: "Le retrait de la page Entités restreintes intervient après la fin de l'enquête, et seulement si le compte a été restreint." }
    mailpwd: { en: "Microsoft advises against sending the new password by email, because the attacker might still have access to the mailbox.", fr: "Microsoft déconseille d'envoyer le nouveau mot de passe par e-mail, car l'attaquant peut encore avoir accès à la boîte aux lettres." }
    purge: { en: "Deleting the Sent Items destroys evidence and doesn't secure the account.", fr: "Supprimer les éléments envoyés détruit des preuves et ne sécurise pas le compte." }
references:
  - title: Respond to a compromised email account in Microsoft 365
    url: https://learn.microsoft.com/en-us/defender-office-365/responding-to-a-compromised-email-account
