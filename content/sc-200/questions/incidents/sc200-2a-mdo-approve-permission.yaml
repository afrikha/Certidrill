id: sc200-2a-mdo-approve-permission
objective: "2.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam, Inc. uses Microsoft Defender for Office 365 Plan 2. Microsoft Defender XDR Unified RBAC is active for the **Email & collaboration > Defender for Office 365** workload.

    You create a custom role for the Tier 2 analysts. The analysts must be able to approve the pending soft delete actions that Tier 1 analysts add to remediation in Threat Explorer. The solution must follow the principle of least privilege.

    Which permission should you include in the custom role?
  fr: |
    Fabrikam, Inc. utilise Microsoft Defender pour Office 365 Plan 2. Le RBAC unifié de Microsoft Defender XDR est actif pour la charge de travail **Email & collaboration > Defender for Office 365**.

    Vous créez un rôle personnalisé pour les analystes de niveau 2. Ils doivent pouvoir approuver les actions Soft delete en attente que les analystes de niveau 1 ajoutent à la correction dans l'Explorateur de menaces. La solution doit respecter le principe du moindre privilège.

    Quelle autorisation devez-vous inclure dans le rôle personnalisé ?
body:
  options:
    - { id: a, text: "Security operations/Security data/Response (manage)" }
    - { id: b, text: "Authorization and settings/Security settings/Core security settings (manage)" }
    - { id: c, text: "Security operations/Security data/Email & collaboration advanced actions (manage)" }
    - { id: d, text: "Security operations/Raw data (email & collaboration)/Email & collaboration content (read)" }
answer: { optionId: c }
explanation:
  correct:
    en: Approving email remediation requires the Search and Purge capability. With Unified RBAC, it corresponds to the Email & collaboration advanced actions (manage) permission. The Email & collaboration content (read) permission is needed in addition only for hard delete actions.
    fr: L'approbation des corrections d'e-mails exige la capacité Search and Purge. Avec le RBAC unifié, elle correspond à l'autorisation Email & collaboration advanced actions (manage). L'autorisation Email & collaboration content (read) n'est nécessaire en plus que pour les actions de suppression définitive (Hard delete).
  options:
    a: { en: "Response (manage) covers response tasks such as admin submissions, not the approval of email remediation.", fr: "Response (manage) couvre des tâches de réponse comme les envois d'administrateur, pas l'approbation des corrections d'e-mails." }
    b: { en: "Core security settings (manage) is used to manage settings such as the Restricted entities page, not email remediation.", fr: "Core security settings (manage) sert à gérer des paramètres comme la page Entités restreintes, pas les corrections d'e-mails." }
    d: { en: "Email & collaboration content (read) lets users preview content; alone, it doesn't allow the approval of remediation actions.", fr: "Email & collaboration content (read) permet de consulter le contenu ; seule, elle ne permet pas d'approuver des actions de correction." }
references:
  - title: Remediate malicious email that was delivered in Office 365
    url: https://learn.microsoft.com/en-us/defender-office-365/remediate-malicious-email-delivered-office-365
