id: sc200-2a-mdca-synced-suspend
objective: "2.1.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Fabrikam, Inc. synchronizes its on-premises Active Directory Domain Services (AD DS) users to Microsoft Entra ID. The company uses Microsoft Defender for Cloud Apps.

    After a **Ransomware activity** alert, an analyst confirms that the account of a synchronized user named User7 is compromised and applies the **Suspend user** governance action. The next morning, User7's account can sign in again.

    You need to keep the account blocked until the investigation ends.

    What should you do?
  fr: |
    Fabrikam, Inc. synchronise les utilisateurs de son Active Directory Domain Services (AD DS) local avec Microsoft Entra ID. L'entreprise utilise Microsoft Defender pour les applications cloud.

    Après une alerte **Ransomware activity**, un analyste confirme que le compte d'un utilisateur synchronisé nommé User7 est compromis et applique l'action de gouvernance **Suspend user**. Le lendemain matin, le compte de User7 peut de nouveau se connecter.

    Vous devez maintenir le compte bloqué jusqu'à la fin de l'enquête.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Apply the Require user to sign in again governance action to User7.", fr: "Appliquer l'action de gouvernance Require user to sign in again à User7." } }
    - { id: b, text: { en: "Disable User7's account in the on-premises AD DS.", fr: "Désactiver le compte de User7 dans l'AD DS local." } }
    - { id: c, text: { en: "Apply the Confirm user compromised governance action to User7.", fr: "Appliquer l'action de gouvernance Confirm user compromised à User7." } }
    - { id: d, text: { en: "Add Suspend user as an automatic action in the anomaly detection policy.", fr: "Ajouter Suspend user comme action automatique dans la stratégie de détection d'anomalies." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      When Microsoft Entra ID is synchronized with an on-premises Active Directory, the on-premises settings override the Microsoft Entra settings, so the next sync reverts the Suspend user action. Disabling the account at the source, in AD DS, keeps it blocked in both directories.
    fr: |
      Quand Microsoft Entra ID est synchronisé avec un Active Directory local, les paramètres locaux remplacent les paramètres Microsoft Entra : la synchronisation suivante annule l'action Suspend user. Désactiver le compte à la source, dans l'AD DS, le maintient bloqué dans les deux annuaires.
  options:
    a: { en: "Require user to sign in again revokes refresh tokens and session cookies, but the user can sign in again right away.", fr: "Require user to sign in again révoque les jetons d'actualisation et les cookies de session, mais l'utilisateur peut se reconnecter aussitôt." }
    c: { en: "Confirm user compromised raises the user risk to high so that Microsoft Entra risk policies apply; it doesn't disable the account.", fr: "Confirm user compromised fait passer le risque de l'utilisateur à élevé pour appliquer les stratégies de risque Microsoft Entra ; il ne désactive pas le compte." }
    d: { en: "An automatic Suspend user is still the same action and is reverted by the next synchronization.", fr: "Un Suspend user automatique reste la même action et est annulé par la synchronisation suivante." }
references:
  - title: Governing connected apps
    url: https://learn.microsoft.com/en-us/defender-cloud-apps/governance-actions
