id: sc200-2d-audit-search-role
objective: "2.3.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso, Ltd. has a Microsoft 365 E5 subscription. Auditing is turned on for the organization.

    A security analyst named Analyst1 must search the audit log in the Microsoft Purview portal and export the results while investigating compromised accounts. Analyst1 must not be able to change the audit configuration of the organization.

    You need to grant Analyst1 the required permissions. The solution must follow the principle of least privilege.

    Which role should you assign to Analyst1?
  fr: |
    Contoso, Ltd. dispose d'un abonnement Microsoft 365 E5. L'audit est activé pour l'organisation.

    Un analyste de sécurité nommé Analyst1 doit rechercher dans le journal d'audit du portail Microsoft Purview et exporter les résultats lors de ses enquêtes sur des comptes compromis. Analyst1 ne doit pas pouvoir modifier la configuration d'audit de l'organisation.

    Vous devez accorder à Analyst1 les autorisations requises. La solution doit respecter le principe du moindre privilège.

    Quel rôle devez-vous attribuer à Analyst1 ?
body:
  options:
    - { id: a, text: Audit Logs }
    - { id: b, text: Compliance Search }
    - { id: c, text: View-Only Audit Logs }
    - { id: d, text: Search And Purge }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Searching the audit log in the Microsoft Purview portal requires the Audit Logs or the View-Only Audit Logs role. View-Only Audit Logs lets the analyst run searches and export the results without being able to manage the audit settings, so it is the least-privileged choice.
    fr: |
      La recherche dans le journal d'audit du portail Microsoft Purview exige le rôle Audit Logs ou le rôle View-Only Audit Logs. View-Only Audit Logs permet à l'analyste de lancer des recherches et d'exporter les résultats sans pouvoir gérer les paramètres d'audit : c'est le choix le moins privilégié.
  options:
    a: { en: "Audit Logs also allows searches, but it includes the management of the audit configuration, which Analyst1 must not have.", fr: "Audit Logs permet aussi les recherches, mais il inclut la gestion de la configuration d'audit, qu'Analyst1 ne doit pas avoir." }
    b: { en: "Compliance Search lets a user run eDiscovery content searches, not audit log searches.", fr: "Compliance Search permet d'exécuter des recherches de contenu eDiscovery, pas des recherches dans le journal d'audit." }
    d: { en: "Search And Purge deletes email messages found by an eDiscovery search; it gives no access to the audit log.", fr: "Search And Purge supprime les e-mails trouvés par une recherche eDiscovery ; il ne donne aucun accès au journal d'audit." }
references:
  - title: Search the audit log
    url: https://learn.microsoft.com/en-us/purview/audit-search
  - title: Get started with auditing solutions
    url: https://learn.microsoft.com/en-us/purview/audit-get-started
