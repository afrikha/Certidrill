id: sc200-2d-graph-record-fields
objective: "2.3.3"
type: hotarea
difficulty: 2
status: draft
stem:
  en: |
    Proseware, Inc. streams the Microsoft Graph activity logs to a Microsoft Sentinel workspace. An analytics rule flags an unusual request to read all the users' mailboxes. The following table shows selected columns of the record in the MicrosoftGraphActivityLogs table.

    Answer each prompt by selecting the column that provides the information.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware, Inc. diffuse les journaux d'activité Microsoft Graph vers un espace de travail Microsoft Sentinel. Une règle d'analyse signale une requête inhabituelle de lecture des boîtes aux lettres de tous les utilisateurs. Le tableau suivant présente certaines colonnes de l'enregistrement dans la table MicrosoftGraphActivityLogs.

    Répondez à chaque consigne en sélectionnant la colonne qui fournit l'information.

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
    - id: p1
      text: { en: "How the application authenticated to get the token (secret, certificate or public client)", fr: "La façon dont l'application s'est authentifiée pour obtenir le jeton (secret, certificat ou client public)" }
    - id: p2
      text: { en: "The application permissions contained in the token", fr: "Les autorisations d'application contenues dans le jeton" }
  grid:
    header: [{ en: Column, fr: Colonne }, { en: Value, fr: Valeur }]
    rows:
      - [{ text: AppId, area: appid }, { text: 3c9b5f2e-1a7d-4e60-b2f4-8d0a6c5e7b91 }]
      - [{ text: ServicePrincipalId, area: spid }, { text: 91d2e4a7-6b3c-4f85-a0e9-2c7b1d5f8e34 }]
      - [{ text: ClientAuthMethod, area: authm }, { text: "1" }]
      - [{ text: Roles, area: roles }, { text: Mail.Read User.Read.All }]
      - [{ text: Scopes, area: scopes }, { text: { en: "(empty)", fr: "(vide)" } }]
      - [{ text: ResponseStatusCode, area: status }, { text: "200" }]
answer:
  values: { p1: authm, p2: roles }
explanation:
  correct:
    en: |
      ClientAuthMethod indicates how the client authenticated - 0 for a public client, 1 for a client ID and secret, 2 for a client certificate - so this app used a secret. Roles lists the application permissions (app roles) in the token claims, whereas Scopes contains delegated permissions and is empty for an app-only call.
    fr: |
      ClientAuthMethod indique comment le client s'est authentifié (0 pour un client public, 1 pour un ID client et un secret, 2 pour un certificat client) ; cette application a donc utilisé un secret. Roles liste les autorisations d'application (rôles d'application) des revendications du jeton, alors que Scopes contient les autorisations déléguées et est vide pour un appel d'application seule.
references:
  - title: Access Microsoft Graph activity logs for tenant monitoring
    url: https://learn.microsoft.com/en-us/graph/microsoft-graph-activity-logs-overview
