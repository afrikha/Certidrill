id: sc200-2b-mdi-mark-compromised-roles
objective: "2.1.6"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    Litware uses Microsoft Defender for Identity and Microsoft Defender XDR unified RBAC. Its users are synchronized from Active Directory to Microsoft Entra ID.

    An analyst named Analyst5 has a custom unified RBAC role with the **Response (manage)** permission. Analyst5 must be able to select **Mark as compromised** on Microsoft Entra ID identities from the identity page in the Defender portal. Analyst5 has no Microsoft Entra role.

    Which two Microsoft Entra roles can you assign to Analyst5 to meet the requirement? Each correct answer presents a complete solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware utilise Microsoft Defender pour Identity et le RBAC unifié de Microsoft Defender XDR. Ses utilisateurs sont synchronisés d'Active Directory vers Microsoft Entra ID.

    Un analyste nommé Analyst5 dispose d'un rôle personnalisé de RBAC unifié avec l'autorisation **Response (manage)**. Analyst5 doit pouvoir sélectionner **Mark as compromised** sur des identités Microsoft Entra ID depuis la page d'identité du portail Defender. Analyst5 n'a aucun rôle Microsoft Entra.

    Quels sont les deux rôles Microsoft Entra que vous pouvez attribuer à Analyst5 pour satisfaire l'exigence ? Chaque bonne réponse constitue une solution complète.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: Security Operator }
    - { id: b, text: User Administrator }
    - { id: c, text: Security Administrator }
    - { id: d, text: Helpdesk Administrator }
    - { id: e, text: Password Administrator }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |
      Mark as compromised is supported for Microsoft Entra ID only, and it requires Global Administrator, Security Administrator, Security Operator or SOC Identity Responder in addition to the Response (manage) permission. Security Operator and Security Administrator each meet the requirement.
    fr: |
      Mark as compromised n'est pris en charge que pour Microsoft Entra ID et exige Global Administrator, Security Administrator, Security Operator ou SOC Identity Responder en plus de l'autorisation Response (manage). Security Operator et Security Administrator satisfont chacun l'exigence.
  options:
    b: { en: "User Administrator allows Disable, Enable, Revoke session and Force password change on Entra ID identities, but not Mark as compromised.", fr: "User Administrator permet Disable, Enable, Revoke session et Force password change sur les identités Entra ID, mais pas Mark as compromised." }
    d: { en: "Helpdesk Administrator allows Revoke session and Force password change, but not Mark as compromised.", fr: "Helpdesk Administrator permet Revoke session et Force password change, mais pas Mark as compromised." }
    e: { en: "Password Administrator allows Force password change only.", fr: "Password Administrator permet uniquement Force password change." }
references:
  - title: Remediation actions in Microsoft Defender for Identity
    url: https://learn.microsoft.com/en-us/defender-for-identity/remediation-actions
