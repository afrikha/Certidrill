id: sc200-2a-mdca-forwarding-tp
objective: "2.1.4"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Wingtip Toys uses Microsoft Defender for Cloud Apps with the Microsoft 365 app connector. An alert reports that an inbox rule forwarding all the email of a cloud-only user named User9 to an external address was created from an unusual location.

    You confirm that the rule is malicious and that the account is compromised. The helpdesk will reset User9's password.

    Which two actions should you perform?

    Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Wingtip Toys utilise Microsoft Defender pour les applications cloud avec le connecteur d'application Microsoft 365. Une alerte signale qu'une règle de boîte de réception transférant tous les e-mails d'un utilisateur cloud nommé User9 vers une adresse externe a été créée depuis un emplacement inhabituel.

    Vous confirmez que la règle est malveillante et que le compte est compromis. Le support technique réinitialisera le mot de passe de User9.

    Quelles sont les deux actions à effectuer ?

    Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Apply the Suspend user governance action to User9.", fr: "Appliquer l'action de gouvernance Suspend user à User9." } }
    - { id: b, text: { en: "Add the source IP address as a range with the Corporate category.", fr: "Ajouter l'adresse IP source comme plage avec la catégorie Corporate." } }
    - { id: c, text: { en: "Remove the forwarding rule from User9's mailbox.", fr: "Supprimer la règle de transfert de la boîte aux lettres de User9." } }
    - { id: d, text: { en: "Ban the Microsoft Exchange Online app.", fr: "Interdire (Ban) l'application Microsoft Exchange Online." } }
    - { id: e, text: { en: "Dismiss the alert as a benign true positive.", fr: "Ignorer l'alerte comme vrai positif bénin." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |
      For a malicious forwarding rule on a compromised account, the recommended response is to suspend the user, reset the password and remove the forwarding rule. The password reset is already handled by the helpdesk, so the two remaining actions are Suspend user and removing the rule.
    fr: |
      Pour une règle de transfert malveillante sur un compte compromis, la réponse recommandée est de suspendre l'utilisateur, de réinitialiser le mot de passe et de supprimer la règle de transfert. La réinitialisation est déjà prise en charge par le support technique : les deux actions restantes sont Suspend user et la suppression de la règle.
  options:
    b: { en: "Tagging the attacker's IP address as Corporate would make its future activity look trusted.", fr: "Étiqueter l'adresse IP de l'attaquant comme Corporate rendrait son activité future digne de confiance." }
    d: { en: "Ban app applies to third-party OAuth apps, not to Exchange Online itself.", fr: "Ban app s'applique aux applications OAuth tierces, pas à Exchange Online lui-même." }
    e: { en: "The activity is confirmed malicious, so the alert is a true positive.", fr: "L'activité est confirmée comme malveillante : l'alerte est un vrai positif." }
references:
  - title: How to investigate anomaly detection alerts
    url: https://learn.microsoft.com/en-us/defender-cloud-apps/investigate-anomaly-alerts
