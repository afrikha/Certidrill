id: sc200-cs1a-forensics
objective: "2.2.2"
type: single
caseStudy: sc200-cs1a-lamna-healthcare
difficulty: 1
status: draft
stem:
  en: |
    A device in the Servers device group is suspected to be compromised.

    You need to meet the forensics requirement for the device. The solution must minimize administrative effort.

    Which response action should you use?
  fr: |
    Un appareil du groupe d'appareils Servers est suspecté d'être compromis.

    Vous devez respecter l'exigence d'investigation numérique pour cet appareil. La solution doit réduire au minimum l'effort d'administration.

    Quelle action de réponse devez-vous utiliser ?
body:
  options:
    - { id: a, text: { en: "Initiate automated investigation", fr: "Lancer une enquête automatisée" } }
    - { id: b, text: { en: "Initiate live response session", fr: "Démarrer une session de réponse dynamique" } }
    - { id: c, text: { en: "Collect investigation package", fr: "Collecter le package d'investigation" } }
    - { id: d, text: { en: "Isolate device", fr: "Isoler l'appareil" } }
answer: { optionId: c }
explanation:
  correct:
    en: "Collect investigation package gathers a predefined set of artifacts into a single zip file, including the Autoruns, Prefetch files, Scheduled tasks and Security event log folders. Analysts download the package and analyze it offline, which meets the requirement in one action."
    fr: "Collecter le package d'investigation rassemble un ensemble prédéfini d'artefacts dans un seul fichier zip, notamment les dossiers Autoruns, Prefetch files, Scheduled tasks et Security event log. Les analystes téléchargent le package et l'analysent hors connexion, ce qui répond à l'exigence en une seule action."
  options:
    a: { en: "An automated investigation examines the alert and its evidence to determine verdicts and remediation actions; it does not give analysts a package of raw artifacts to analyze offline.", fr: "Une enquête automatisée examine l'alerte et ses preuves pour déterminer des verdicts et des actions de correction ; elle ne fournit pas aux analystes un package d'artefacts bruts à analyser hors connexion." }
    b: { en: "Live response opens an interactive remote shell; collecting each artifact with separate commands or scripts takes more effort than one predefined collection.", fr: "La réponse dynamique ouvre un shell distant interactif ; collecter chaque artefact avec des commandes ou des scripts distincts demande plus d'effort qu'une collecte prédéfinie unique." }
    d: { en: "Isolation disconnects the device from the network but collects no forensic data.", fr: "L'isolement déconnecte l'appareil du réseau, mais ne collecte aucune donnée d'investigation." }
references:
  - title: Take response actions on a device in Microsoft Defender for Endpoint
    url: https://learn.microsoft.com/en-us/defender-endpoint/respond-machine-alerts
