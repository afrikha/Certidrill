id: sc200-2a-mdc-respond-order
objective: "2.1.3"
type: ordering
difficulty: 1
status: draft
stem:
  en: |
    Adatum Corporation uses Microsoft Defender for Cloud. An alert reports a suspicious role assignment followed by the creation of a VM in a subscription named Sub-Dev. You open the alert, select **View full details**, and go to the **Take action** tab.

    You confirm that the alert is a true positive. You need to investigate the activity, remediate this attack, harden the subscription, and close the alert.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Adatum Corporation utilise Microsoft Defender pour le cloud. Une alerte signale une attribution de rôle suspecte suivie de la création d'une machine virtuelle dans un abonnement nommé Sub-Dev. Vous ouvrez l'alerte, sélectionnez **View full details** et accédez à l'onglet **Take action**.

    Vous confirmez que l'alerte est un vrai positif. Vous devez examiner l'activité, corriger cette attaque, renforcer l'abonnement et clôturer l'alerte.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: inspect, text: { en: "Use Inspect resource context to review the activity logs around the alert.", fr: "Utiliser Inspect resource context pour examiner les journaux d'activité autour de l'alerte." } }
    - { id: mitigate, text: { en: "Apply the manual remediation steps of Mitigate the threat.", fr: "Appliquer les étapes de correction manuelles de Mitigate the threat." } }
    - { id: prevent, text: { en: "Apply the security recommendations listed in Prevent future attacks.", fr: "Appliquer les recommandations de sécurité listées dans Prevent future attacks." } }
    - { id: dismiss, text: { en: "Change the status of the alert to Dismissed.", fr: "Passer le statut de l'alerte à Dismissed." } }
    - { id: suppress, text: { en: "Use Suppress similar alerts to create a suppression rule.", fr: "Utiliser Suppress similar alerts pour créer une règle de suppression." } }
    - { id: sample, text: { en: "Create sample alerts for the subscription.", fr: "Créer des exemples d'alertes pour l'abonnement." } }
answer:
  sequence: [ inspect, mitigate, prevent, dismiss ]
explanation:
  correct:
    en: |
      The Take action tab guides the response: Inspect resource context opens the activity logs that support the alert, Mitigate the threat gives the manual remediation steps, and Prevent future attacks lists the recommendations that reduce the attack surface. When the investigation and response are complete, you set the alert to Dismissed.
    fr: |
      L'onglet Take action guide la réponse : Inspect resource context ouvre les journaux d'activité qui étayent l'alerte, Mitigate the threat donne les étapes de correction manuelles et Prevent future attacks liste les recommandations qui réduisent la surface d'attaque. Une fois l'enquête et la réponse terminées, vous passez l'alerte à l'état Dismissed.
  options:
    suppress: { en: "Suppression is for alerts that aren't relevant to the organization; suppressing a true positive would hide future attacks.", fr: "La suppression concerne les alertes non pertinentes pour l'organisation ; supprimer un vrai positif masquerait de futures attaques." }
    sample: { en: "Sample alerts test the alert pipeline; they play no part in responding to a real alert.", fr: "Les exemples d'alertes testent la chaîne de traitement des alertes ; ils ne jouent aucun rôle dans la réponse à une vraie alerte." }
references:
  - title: Manage and respond to security alerts
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/manage-respond-alerts
