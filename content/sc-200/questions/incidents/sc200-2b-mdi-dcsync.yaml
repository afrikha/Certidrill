id: sc200-2b-mdi-dcsync
objective: "2.1.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam has Microsoft Defender for Identity sensors on all its domain controllers. Defender for Identity raises a **Suspected DCSync attack (replication of directory services)** alert. The alert shows that a workstation named **WS-112** sent a directory replication request by using an account named **svc-backup**.

    You confirm that WS-112 isn't a domain controller and that no approved tool on it needs to replicate the directory.

    You need to correct the configuration that made the attack possible.

    What should you review and correct?
  fr: |
    Fabrikam dispose de capteurs Microsoft Defender pour Identity sur tous ses contrôleurs de domaine. Defender pour Identity génère une alerte **Suspected DCSync attack (replication of directory services)**. L'alerte montre qu'un poste de travail nommé **WS-112** a envoyé une demande de réplication d'annuaire en utilisant un compte nommé **svc-backup**.

    Vous confirmez que WS-112 n'est pas un contrôleur de domaine et qu'aucun outil approuvé installé sur ce poste n'a besoin de répliquer l'annuaire.

    Vous devez corriger la configuration qui a rendu l'attaque possible.

    Que devez-vous examiner et corriger ?
body:
  options:
    - id: a
      text: { en: "The accounts that have the Replicating Directory Changes permissions on the domain", fr: "Les comptes disposant des autorisations Replicating Directory Changes sur le domaine" }
    - id: b
      text: { en: "The accounts that have the Do not require Kerberos preauthentication option", fr: "Les comptes pour lesquels l'option Do not require Kerberos preauthentication est activée" }
    - id: c
      text: { en: "The service principal names (SPNs) registered on the svc-backup account", fr: "Les noms de principal du service (SPN) inscrits sur le compte svc-backup" }
    - id: d
      text: { en: "The members of the local Administrators group on WS-112", fr: "Les membres du groupe Administrateurs local sur WS-112" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      A DCSync attack uses the directory replication protocol from a computer that isn't a domain controller to obtain password hashes. Only accounts that hold the Replicating Directory Changes permissions can do this, so the remediation is to validate who has these permissions and remove them from svc-backup.
    fr: |
      Une attaque DCSync utilise le protocole de réplication d'annuaire depuis un ordinateur qui n'est pas un contrôleur de domaine afin d'obtenir des hachages de mots de passe. Seuls les comptes disposant des autorisations Replicating Directory Changes peuvent le faire : la correction consiste à vérifier qui possède ces autorisations et à les retirer à svc-backup.
  options:
    b: { en: "Disabled Kerberos preauthentication enables AS-REP Roasting, not directory replication.", fr: "La préauthentification Kerberos désactivée permet l'AS-REP Roasting, pas la réplication de l'annuaire." }
    c: { en: "SPNs on user accounts enable Kerberoasting (Suspected Kerberos SPN exposure), not DCSync.", fr: "Les SPN sur des comptes d'utilisateur permettent le Kerberoasting (Suspected Kerberos SPN exposure), pas DCSync." }
    d: { en: "Local administrator rights on a workstation don't grant any right to replicate the domain directory.", fr: "Les droits d'administrateur local sur un poste de travail n'accordent aucun droit de réplication de l'annuaire du domaine." }
references:
  - title: Microsoft Defender for Identity classic alerts
    url: https://learn.microsoft.com/en-us/defender-for-identity/alerts-mdi-classic
