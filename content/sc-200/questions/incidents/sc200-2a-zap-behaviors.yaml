id: sc200-2a-zap-behaviors
objective: "2.1.1"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Northwind Traders uses Microsoft Defender for Office 365 with cloud mailboxes. The anti-malware policies and the anti-spam policies use their default settings: zero-hour auto purge (ZAP) is on, and the **Spam** verdict action is **Move message to Junk Email**. The quarantine policies are unchanged.

    How does ZAP handle the following messages? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind Traders utilise Microsoft Defender pour Office 365 avec des boîtes aux lettres cloud. Les stratégies anti-programme malveillant et anti-courrier indésirable utilisent leurs paramètres par défaut : la purge automatique zéro heure (ZAP) est activée et l'action du verdict **Spam** est **Move message to Junk Email**. Les stratégies de quarantaine n'ont pas été modifiées.

    Comment ZAP traite-t-elle les messages suivants ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      A message that the user already read is later identified as malware. ZAP [[s1]].

      A message that the user already read is later identified as spam. ZAP [[s2]].

      For a message that ZAP quarantined as malware, the recipient can [[s3]].
    fr: |
      Un message que l'utilisateur a déjà lu est ensuite identifié comme programme malveillant. ZAP [[s1]].

      Un message que l'utilisateur a déjà lu est ensuite identifié comme courrier indésirable. ZAP [[s2]].

      Pour un message que ZAP a mis en quarantaine comme programme malveillant, le destinataire peut [[s3]].
  slots:
    - id: s1
      options:
        - { id: quar, text: { en: "quarantines the message", fr: "met le message en quarantaine" } }
        - { id: junk, text: { en: "moves the message to Junk Email", fr: "déplace le message vers le dossier Courrier indésirable" } }
        - { id: none, text: { en: "takes no action on the message", fr: "n'effectue aucune action sur le message" } }
    - id: s2
      options:
        - { id: quar, text: { en: "quarantines the message", fr: "met le message en quarantaine" } }
        - { id: junk, text: { en: "moves the message to Junk Email", fr: "déplace le message vers le dossier Courrier indésirable" } }
        - { id: none, text: { en: "takes no action on the message", fr: "n'effectue aucune action sur le message" } }
    - id: s3
      options:
        - { id: release, text: { en: "release the message", fr: "libérer le message" } }
        - { id: request, text: { en: "only request its release", fr: "seulement demander sa libération" } }
        - { id: inbox, text: { en: "move the message back to the Inbox", fr: "replacer le message dans la boîte de réception" } }
answer:
  values: { s1: quar, s2: none, s3: request }
explanation:
  correct:
    en: "ZAP acts on read and unread messages for malware, phishing and high confidence phishing, and malware is always quarantined. For spam, ZAP acts only on unread messages, so a spam message that was already read stays where it is. Recipients can't release messages quarantined as malware, whatever the quarantine policy; at most, the policy lets them request the release."
    fr: "ZAP agit sur les messages lus et non lus pour les programmes malveillants, l'hameçonnage et l'hameçonnage à haut niveau de confiance, et un programme malveillant est toujours mis en quarantaine. Pour le courrier indésirable, ZAP n'agit que sur les messages non lus : un message déjà lu reste où il est. Les destinataires ne peuvent pas libérer un message mis en quarantaine comme programme malveillant, quelle que soit la stratégie de quarantaine ; au mieux, la stratégie leur permet de demander sa libération."
  options:
    junk: { en: "Junk Email is the default destination for unread spam and for phishing in the default anti-spam policy, not for malware or read spam.", fr: "Le dossier Courrier indésirable est la destination par défaut du courrier indésirable non lu et de l'hameçonnage dans la stratégie anti-courrier indésirable par défaut, pas des programmes malveillants ni du courrier indésirable lu." }
    release: { en: "Only admins can release messages quarantined as malware.", fr: "Seuls les administrateurs peuvent libérer un message mis en quarantaine comme programme malveillant." }
references:
  - title: Zero-hour auto purge in Microsoft Defender for Office 365
    url: https://learn.microsoft.com/en-us/defender-office-365/zero-hour-auto-purge
