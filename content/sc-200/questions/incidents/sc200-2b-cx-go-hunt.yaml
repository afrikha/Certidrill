id: sc200-2b-cx-go-hunt
objective: "2.1.9"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Proseware investigates a Microsoft Defender XDR incident that spans email, endpoints and identities. A user entity named **kim@proseware.com** appears in the incident graph.

    You need to review every activity associated with the user, and then attach the relevant results to the incident so that other analysts can see them.

    Which two actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware examine un incident Microsoft Defender XDR qui couvre la messagerie, les points de terminaison et les identités. Une entité utilisateur nommée **kim@proseware.com** apparaît dans le graphe de l'incident.

    Vous devez examiner toutes les activités associées à l'utilisateur, puis joindre les résultats pertinents à l'incident pour que les autres analystes puissent les voir.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "On the user node, select Go hunt > Related Alerts.", fr: "Sur le nœud de l'utilisateur, sélectionner Go hunt > Related Alerts." } }
    - { id: b, text: { en: "Select the relevant result rows, and then select Link to incident.", fr: "Sélectionner les lignes de résultats pertinentes, puis sélectionner Link to incident." } }
    - { id: c, text: { en: "On the user node, select Go hunt > All Activity.", fr: "Sur le nœud de l'utilisateur, sélectionner Go hunt > All Activity." } }
    - { id: d, text: { en: "On the user node, select View blast radius.", fr: "Sur le nœud de l'utilisateur, sélectionner View blast radius." } }
    - { id: e, text: { en: "Open the Activities tab of the incident.", fr: "Ouvrir l'onglet Activités de l'incident." } }
answer: { optionIds: [ b, c ] }
explanation:
  correct:
    en: |
      Go hunt runs advanced hunting queries on an entity, and All Activity returns all the activities associated with it. You then select the relevant results and choose Link to incident to attach them to the incident.
    fr: |
      Go hunt exécute des requêtes de repérage avancé sur une entité, et All Activity renvoie toutes les activités qui lui sont associées. Vous sélectionnez ensuite les résultats pertinents et choisissez Link to incident pour les joindre à l'incident.
  options:
    a: { en: "Related Alerts returns only the security alerts that involve the entity, not all its activities.", fr: "Related Alerts ne renvoie que les alertes de sécurité qui impliquent l'entité, pas toutes ses activités." }
    d: { en: "Blast radius shows possible propagation paths, not the user's past activities.", fr: "Le rayon d'impact montre des chemins de propagation possibles, pas les activités passées de l'utilisateur." }
    e: { en: "The Activities tab is a timeline of manual and automated actions taken on the incident, not of the user's activities.", fr: "L'onglet Activités est une chronologie des actions manuelles et automatisées effectuées sur l'incident, pas des activités de l'utilisateur." }
references:
  - title: Investigate incidents in the Microsoft Defender portal (Legacy)
    url: https://learn.microsoft.com/en-us/defender-xdr/investigate-incidents
