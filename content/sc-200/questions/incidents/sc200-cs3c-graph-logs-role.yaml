id: sc200-cs3c-graph-logs-role
objective: "2.3.3"
type: single
caseStudy: sc200-cs3c-relecloud
difficulty: 1
status: draft
stem:
  en: |
    You need to meet the Graph activity logs requirement. Which Microsoft Entra role should you assign to the identity engineer?
  fr: |
    Vous devez respecter l'exigence relative aux journaux d'activité Graph. Quel rôle Microsoft Entra devez-vous attribuer à l'ingénieur d'identité ?
body:
  options:
    - { id: a, text: Security Administrator }
    - { id: b, text: Security Reader }
    - { id: c, text: Global Administrator }
    - { id: d, text: Reports Reader }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Microsoft Graph activity logs are streamed through Microsoft Entra diagnostic settings, which requires a Microsoft Entra ID P1 or P2 license and a supported Microsoft Entra role. Security Administrator is the least privileged role that can set up these diagnostic settings, and the engineer already has write access to law-rc-sec through Log Analytics Contributor.
    fr: |
      Les journaux d'activité Microsoft Graph sont transmis par les paramètres de diagnostic de Microsoft Entra, ce qui demande une licence Microsoft Entra ID P1 ou P2 et un rôle Microsoft Entra pris en charge. Security Administrator est le rôle le moins privilégié qui peut configurer ces paramètres de diagnostic, et l'ingénieur a déjà un accès en écriture à law-rc-sec par Log Analytics Contributor.
  options:
    b: { en: "Security Reader is read-only and cannot create diagnostic settings.", fr: "Security Reader est en lecture seule et ne peut pas créer de paramètres de diagnostic." }
    c: { en: "Global Administrator works but grants far more than needed.", fr: "Global Administrator fonctionne, mais accorde bien plus que nécessaire." }
    d: { en: "Reports Reader can view sign-in and audit logs but cannot configure diagnostic settings.", fr: "Reports Reader peut consulter les journaux de connexion et d'audit, mais ne peut pas configurer de paramètres de diagnostic." }
references:
  - title: Access Microsoft Graph activity logs
    url: https://learn.microsoft.com/en-us/graph/microsoft-graph-activity-logs-overview
