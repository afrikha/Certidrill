id: sc200-2d-graph-app-tables
objective: "2.3.3"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    Northwind Traders has Microsoft Entra ID P2 licenses. Microsoft Entra diagnostic settings send all the sign-in log categories and the Microsoft Graph activity logs to a Microsoft Sentinel workspace named LAW-NT.

    A daemon application named InvoiceBot uses a client secret and the Mail.Read application permission. The secret leaked. You need to find the Microsoft Graph requests made with tokens that InvoiceBot obtained from an unknown IP address, and the resources that those requests accessed.

    Which two tables should you join in LAW-NT?

    Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind Traders dispose de licences Microsoft Entra ID P2. Les paramètres de diagnostic de Microsoft Entra envoient toutes les catégories de journaux de connexion et les journaux d'activité Microsoft Graph vers un espace de travail Microsoft Sentinel nommé LAW-NT.

    Une application démon nommée InvoiceBot utilise un secret client et l'autorisation d'application Mail.Read. Le secret a fuité. Vous devez trouver les requêtes Microsoft Graph effectuées avec des jetons qu'InvoiceBot a obtenus depuis une adresse IP inconnue, ainsi que les ressources consultées par ces requêtes.

    Quelles sont les deux tables à joindre dans LAW-NT ?

    Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: SigninLogs }
    - { id: b, text: AADServicePrincipalSignInLogs }
    - { id: c, text: AuditLogs }
    - { id: d, text: MicrosoftGraphActivityLogs }
    - { id: e, text: AADNonInteractiveUserSignInLogs }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |
      A daemon application that uses an application permission signs in as a service principal, so its token requests are in AADServicePrincipalSignInLogs, with the IP address of the sign-in. MicrosoftGraphActivityLogs contains the requests and their RequestUri. You join SignInActivityId in the Graph logs with UniqueTokenIdentifier in the sign-in logs to link each request to the sign-in that issued its token.
    fr: |
      Une application démon qui utilise une autorisation d'application se connecte en tant que principal de service ; ses demandes de jetons se trouvent donc dans AADServicePrincipalSignInLogs, avec l'adresse IP de la connexion. MicrosoftGraphActivityLogs contient les requêtes et leur RequestUri. Vous joignez SignInActivityId des journaux Graph à UniqueTokenIdentifier des journaux de connexion pour relier chaque requête à la connexion qui a émis son jeton.
  options:
    a: { en: "SigninLogs contains interactive user sign-ins; a daemon app does not sign in as a user.", fr: "SigninLogs contient les connexions interactives des utilisateurs ; une application démon ne se connecte pas en tant qu'utilisateur." }
    c: { en: "AuditLogs records directory changes such as new credentials or consents, not token issuance or Graph read requests.", fr: "AuditLogs enregistre les modifications de l'annuaire comme de nouvelles informations d'identification ou des consentements, pas l'émission de jetons ni les requêtes de lecture Graph." }
    e: { en: "AADNonInteractiveUserSignInLogs contains sign-ins performed by clients on behalf of users, not app-only sign-ins.", fr: "AADNonInteractiveUserSignInLogs contient les connexions effectuées par des clients pour le compte d'utilisateurs, pas les connexions d'application seule." }
references:
  - title: Access Microsoft Graph activity logs for tenant monitoring
    url: https://learn.microsoft.com/en-us/graph/microsoft-graph-activity-logs-overview
