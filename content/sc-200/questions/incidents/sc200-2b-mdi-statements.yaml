id: sc200-2b-mdi-statements
objective: "2.1.6"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Adatum deployed Microsoft Defender for Identity yesterday. Sensors are installed on all domain controllers, on the AD FS servers and on the Microsoft Entra Connect server. Alerts appear in the classic format.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum a déployé Microsoft Defender pour Identity hier. Des capteurs sont installés sur tous les contrôleurs de domaine, sur les serveurs AD FS et sur le serveur Microsoft Entra Connect. Les alertes apparaissent au format classique.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          To stop a classic alert from triggering for an approved administration server, you can add the server under Settings > Identities > Excluded entities.
        fr: |
          Pour empêcher une alerte classique de se déclencher pour un serveur d'administration approuvé, vous pouvez ajouter le serveur sous Paramètres > Identités > Entités exclues.
    - id: s2
      text:
        en: |
          The Suspected Brute Force attack (Kerberos, NTLM) alert can be raised today, on the first day after the sensors were deployed.
        fr: |
          L'alerte Suspected Brute Force attack (Kerberos, NTLM) peut être générée aujourd'hui, le premier jour après le déploiement des capteurs.
    - id: s3
      text:
        en: |
          The sensors on the AD FS servers can disable Active Directory accounts when an analyst selects Disable on an identity page.
        fr: |
          Les capteurs des serveurs AD FS peuvent désactiver des comptes Active Directory lorsqu'un analyste sélectionne Disable sur une page d'identité.
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: |
      Classic alerts are tuned with Settings > Identities > Excluded entities (Defender-format alerts use alert tuning rules). Suspected Brute Force attack (Kerberos, NTLM) needs a learning period of at least one week, so it can't be raised the day after deployment. Only sensors on domain controllers run Active Directory remediation actions; sensors on AD FS, AD CS or Microsoft Entra Connect servers don't perform remediation.
    fr: |
      Les alertes classiques se règlent avec Paramètres > Identités > Entités exclues (les alertes au format Defender utilisent les règles de réglage des alertes). Suspected Brute Force attack (Kerberos, NTLM) exige une période d'apprentissage d'au moins une semaine : elle ne peut donc pas être générée le lendemain du déploiement. Seuls les capteurs des contrôleurs de domaine exécutent les actions de correction Active Directory ; les capteurs des serveurs AD FS, AD CS ou Microsoft Entra Connect n'effectuent pas de correction.
references:
  - title: Microsoft Defender for Identity classic alerts
    url: https://learn.microsoft.com/en-us/defender-for-identity/alerts-mdi-classic
  - title: Remediation actions in Microsoft Defender for Identity
    url: https://learn.microsoft.com/en-us/defender-for-identity/remediation-actions
