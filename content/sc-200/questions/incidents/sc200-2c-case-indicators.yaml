id: sc200-2c-case-indicators
objective: "2.1.10"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Your SOC tracks a threat actor in case 1077 in the Microsoft Defender portal. A Microsoft Sentinel workspace named **SOC-WS** is connected to the portal. Access to cases is granted only through Microsoft Sentinel roles on SOC-WS.

    An internal auditor named Lea must review case 1077: its details, tasks and comments, and the audit events that show who changed the case and when. Lea must not be able to change the case or its tasks.

    You need to grant Lea access. The solution must follow the principle of least privilege.

    Which role should you assign to Lea on SOC-WS?
  fr: |
    Votre SOC suit un acteur de menace dans le cas 1077 du portail Microsoft Defender. Un espace de travail Microsoft Sentinel nommé **SOC-WS** est connecté au portail. L'accès aux cas est accordé uniquement par des rôles Microsoft Sentinel sur SOC-WS.

    Une auditrice interne nommée Lea doit examiner le cas 1077 : son détail, ses tâches et ses commentaires, ainsi que les événements d'audit qui montrent qui a modifié le cas et quand. Lea ne doit pas pouvoir modifier le cas ni ses tâches.

    Vous devez accorder l'accès à Lea. La solution doit respecter le principe du moindre privilège.

    Quel rôle devez-vous attribuer à Lea sur SOC-WS ?
body:
  options:
    - id: a
      text: Microsoft Sentinel Responder
    - id: b
      text: Log Analytics Reader
    - id: c
      text: Microsoft Sentinel Reader
    - id: d
      text: Microsoft Sentinel Contributor
answer: { optionId: c }
explanation:
  correct:
    en: |
      In case management, Microsoft Sentinel Reader gives view-only access to the case queue, case details, tasks, comments and case audits. It doesn't allow creating or changing cases, so it meets the requirement with the least privilege.
    fr: |
      Dans la gestion des cas, Microsoft Sentinel Reader donne un accès en lecture seule à la file des cas, au détail des cas, aux tâches, aux commentaires et aux audits des cas. Il ne permet pas de créer ni de modifier des cas : il répond au besoin avec le moindre privilège.
  options:
    a:
      en: Microsoft Sentinel Responder lets the user create and manage cases and tasks, assign them and update their status, which Lea must not be able to do.
      fr: Microsoft Sentinel Responder permet de créer et de gérer des cas et des tâches, de les attribuer et de mettre à jour leur état, ce que Lea ne doit pas pouvoir faire.
    b:
      en: Log Analytics Reader isn't one of the roles that case management maps to its permissions; the Sentinel role for view-only access is Microsoft Sentinel Reader.
      fr: Log Analytics Reader ne fait pas partie des rôles que la gestion des cas associe à ses autorisations ; le rôle Sentinel de lecture seule est Microsoft Sentinel Reader.
    d:
      en: Microsoft Sentinel Contributor is needed only to customize the case status options, and it also allows changes to cases.
      fr: Microsoft Sentinel Contributor n'est nécessaire que pour personnaliser les options d'état des cas, et il permet aussi de modifier les cas.
references:
  - title: Manage security operations cases natively in the Microsoft Defender portal
    url: https://learn.microsoft.com/en-us/unified-secops/cases-overview
