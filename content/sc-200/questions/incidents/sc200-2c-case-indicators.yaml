id: sc200-2c-case-indicators
objective: "2.1.10"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Your SOC tracks a threat actor in a case in the Microsoft Defender portal. A Microsoft Sentinel workspace is connected to the portal.

    In the past, the team grouped the actor's indicators of compromise (IoCs) in projects in Microsoft Defender Threat Intelligence. The threat intelligence indicators now exist in the Sentinel workspace.

    You need the actor's IoCs to be associated with the case. The solution must use the currently recommended approach.

    What should you do?
  fr: |
    Votre SOC suit un acteur de menace dans un cas du portail Microsoft Defender. Un espace de travail Microsoft Sentinel est connecté au portail.

    Auparavant, l'équipe regroupait les indicateurs de compromission (IoC) de l'acteur dans des projets de Microsoft Defender Threat Intelligence. Les indicateurs de renseignement sur les menaces existent désormais dans l'espace de travail Sentinel.

    Vous devez associer les IoC de l'acteur au cas. La solution doit utiliser l'approche actuellement recommandée.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Create a project in Defender Threat Intelligence and paste its link into the case description", fr: "Créer un projet dans Defender Threat Intelligence et coller son lien dans la description du cas" }
    - id: b
      text: { en: "Add the indicators as a table in a comment of the case", fr: "Ajouter les indicateurs sous forme de tableau dans un commentaire du cas" }
    - id: c
      text: { en: "Link the indicators from the Indicators section of the case's Linked Objects tab", fr: "Lier les indicateurs depuis la section Indicators de l'onglet Linked Objects du cas" }
    - id: d
      text: { en: "Create a file indicator for each IoC in Settings > Endpoints > Indicators", fr: "Créer un indicateur de fichier pour chaque IoC dans Settings > Endpoints > Indicators" }
answer: { optionId: c }
explanation:
  correct:
    en: Cases can link threat intelligence indicators (preview). In the case's Linked Objects tab you select Indicators, Add, the workspace that holds the indicator, and then Link. Projects in Defender Threat Intelligence are deprecated in favor of indicators linked to a case.
    fr: Les cas peuvent lier des indicateurs de renseignement sur les menaces (préversion). Dans l'onglet Linked Objects du cas, vous sélectionnez Indicators, Add, l'espace de travail qui contient l'indicateur, puis Link. Les projets de Defender Threat Intelligence sont dépréciés au profit des indicateurs liés à un cas.
  options:
    a:
      en: Defender Threat Intelligence projects are deprecated; the guidance is to link indicators to cases instead.
      fr: Les projets de Defender Threat Intelligence sont dépréciés ; la recommandation est de lier les indicateurs aux cas.
    b:
      en: A comment only records text; the indicators aren't linked objects of the case and can't be followed from it.
      fr: Un commentaire n'enregistre que du texte ; les indicateurs ne deviennent pas des objets liés du cas et ne peuvent pas être suivis depuis celui-ci.
    d:
      en: Defender for Endpoint indicators block or allow entities on devices; creating them doesn't associate anything with the case.
      fr: Les indicateurs de Defender pour point de terminaison bloquent ou autorisent des entités sur les appareils ; les créer n'associe rien au cas.
references:
  - title: Manage security operations cases natively in the Microsoft Defender portal
    url: https://learn.microsoft.com/en-us/unified-secops/cases-overview
