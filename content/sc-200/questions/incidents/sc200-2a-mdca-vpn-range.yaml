id: sc200-2a-mdca-vpn-range
objective: "2.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Contoso, Ltd. uses Microsoft Defender for Cloud Apps. Remote employees connect through the corporate VPN, whose public egress addresses are 198.51.100.0/27. These addresses aren't defined in Defender for Cloud Apps.

    Analysts investigate several **Impossible travel** alerts and confirm that each one was caused by a user signing in from home and then through the VPN.

    You need to prevent these false positives without reducing detection for other locations.

    What should you do?
  fr: |
    Contoso, Ltd. utilise Microsoft Defender pour les applications cloud. Les employés à distance se connectent via le VPN de l'entreprise, dont les adresses publiques de sortie sont 198.51.100.0/27. Ces adresses ne sont pas définies dans Defender pour les applications cloud.

    Les analystes examinent plusieurs alertes **Impossible travel** et confirment que chacune est due à un utilisateur qui s'est connecté depuis son domicile, puis via le VPN.

    Vous devez empêcher ces faux positifs sans réduire la détection pour les autres emplacements.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Suspend the users who raised the alerts and reset their passwords.", fr: "Suspendre les utilisateurs à l'origine des alertes et réinitialiser leur mot de passe." } }
    - { id: b, text: { en: "Add 198.51.100.0/27 as an IP address range with the Risky category.", fr: "Ajouter 198.51.100.0/27 comme plage d'adresses IP avec la catégorie Risky." } }
    - { id: c, text: { en: "Create a session policy that blocks sign-ins from 198.51.100.0/27.", fr: "Créer une stratégie de session qui bloque les connexions depuis 198.51.100.0/27." } }
    - { id: d, text: { en: "Add 198.51.100.0/27 as an IP address range with the VPN category.", fr: "Ajouter 198.51.100.0/27 comme plage d'adresses IP avec la catégorie VPN." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      An untagged VPN is a typical false positive of Impossible travel: you dismiss the alert and add the VPN range in Settings > Cloud Apps > System > IP address ranges. The VPN category is meant for the addresses used by remote workers and avoids impossible travel alerts when employees connect from home through the corporate VPN.
    fr: |
      Un VPN non étiqueté est un faux positif classique de Impossible travel : vous ignorez l'alerte et ajoutez la plage du VPN dans Paramètres > Cloud Apps > Système > Plages d'adresses IP. La catégorie VPN est prévue pour les adresses utilisées par les télétravailleurs et évite les alertes de voyage impossible quand les employés se connectent depuis chez eux via le VPN de l'entreprise.
  options:
    a: { en: "The alerts are false positives; suspending the users disrupts them without addressing the cause.", fr: "Les alertes sont des faux positifs ; suspendre les utilisateurs les pénalise sans traiter la cause." }
    b: { en: "The Risky category marks addresses as suspicious, which is the opposite of what the VPN range needs.", fr: "La catégorie Risky marque des adresses comme suspectes, soit l'inverse de ce dont la plage du VPN a besoin." }
    c: { en: "Blocking the VPN addresses would prevent the remote employees from working.", fr: "Bloquer les adresses du VPN empêcherait les employés à distance de travailler." }
references:
  - title: Work with IP ranges and tags
    url: https://learn.microsoft.com/en-us/defender-cloud-apps/ip-tags
  - title: How to investigate anomaly detection alerts
    url: https://learn.microsoft.com/en-us/defender-cloud-apps/investigate-anomaly-alerts
