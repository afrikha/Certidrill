id: sc200-2c-timeline-export-range
objective: "2.2.1"
type: single
difficulty: 2
shuffle: false
status: draft
stem:
  en: |
    You investigate a device named **SRV-APP-09** in the Microsoft Defender portal. An auditor asks for all the timeline events of SRV-APP-09 from November 3 to November 12, 2026 (10 days).

    You plan to use the Export option of the device timeline.

    What is the minimum number of exports that you must perform?
  fr: |
    Vous analysez un appareil nommé **SRV-APP-09** dans le portail Microsoft Defender. Un auditeur demande tous les événements de la chronologie de SRV-APP-09 du 3 au 12 novembre 2026 (10 jours).

    Vous prévoyez d'utiliser l'option Export de la chronologie de l'appareil.

    Quel est le nombre minimal d'exportations que vous devez effectuer ?
body:
  options:
    - { id: a, text: "1" }
    - { id: b, text: "2" }
    - { id: c, text: "3" }
    - { id: d, text: "10" }
answer: { optionId: b }
explanation:
  correct:
    en: The timeline exports the current date or a specified date range of up to seven days. Ten days therefore need two exports, for example November 3–9 and November 10–12.
    fr: La chronologie exporte la date du jour ou une plage de dates de sept jours au maximum. Dix jours exigent donc deux exportations, par exemple du 3 au 9 novembre et du 10 au 12 novembre.
  options:
    a: { en: "A single export can't cover more than seven days.", fr: "Une seule exportation ne peut pas couvrir plus de sept jours." }
    c: { en: "Two ranges of up to seven days already cover ten days.", fr: "Deux plages de sept jours au maximum couvrent déjà dix jours." }
    d: { en: "Export isn't limited to one day; a range of up to seven days is allowed.", fr: "L'exportation n'est pas limitée à un jour ; une plage de sept jours au maximum est autorisée." }
references:
  - title: Investigate devices in Microsoft Defender for Endpoint
    url: https://learn.microsoft.com/en-us/defender-endpoint/device-timeline-event-flag
