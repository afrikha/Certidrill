id: sc200-2b-cx-detection-products
objective: "2.1.9"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Fabrikam uses Microsoft Defender XDR with all its workloads deployed. A multi-domain incident correlates four stages of an attack.

    Which product raised the alert for each stage? To answer, drag the appropriate products to the correct stages. Each product may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam utilise Microsoft Defender XDR avec toutes ses charges de travail déployées. Un incident multidomaine corrèle quatre étapes d'une attaque.

    Quel produit a généré l'alerte de chaque étape ? Pour répondre, faites glisser les produits appropriés vers les étapes correspondantes. Chaque produit peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: mdo, text: Microsoft Defender for Office 365 }
    - { id: idp, text: Microsoft Entra ID Protection }
    - { id: mdi, text: Microsoft Defender for Identity }
    - { id: mde, text: Microsoft Defender for Endpoint }
    - { id: mdca, text: Microsoft Defender for Cloud Apps }
    - { id: mdc, text: Microsoft Defender for Cloud }
  targets:
    - id: t1
      text: { en: "A user clicked a link in a phishing email delivered to their mailbox.", fr: "Un utilisateur a cliqué sur un lien dans un e-mail d'hameçonnage remis dans sa boîte aux lettres." }
    - id: t2
      text: { en: "The user's account signed in to Microsoft Entra ID from an anonymous IP address.", fr: "Le compte de l'utilisateur s'est connecté à Microsoft Entra ID depuis une adresse IP anonyme." }
    - id: t3
      text: { en: "A workstation sent a directory replication request to a domain controller.", fr: "Un poste de travail a envoyé une demande de réplication d'annuaire à un contrôleur de domaine." }
    - id: t4
      text: { en: "A process on a file server started encrypting files and deleting shadow copies.", fr: "Un processus d'un serveur de fichiers a commencé à chiffrer des fichiers et à supprimer les clichés instantanés." }
answer:
  mapping: { t1: mdo, t2: idp, t3: mdi, t4: mde }
explanation:
  correct:
    en: |
      Defender for Office 365 detects malicious email and URL clicks. Microsoft Entra ID Protection raises the Anonymous IP address sign-in risk detection. Defender for Identity sensors on domain controllers detect replication requests from computers that aren't domain controllers (DCSync). Defender for Endpoint detects malicious process behavior such as ransomware on a device.
    fr: |
      Defender pour Office 365 détecte les e-mails malveillants et les clics sur des URL. Microsoft Entra ID Protection génère la détection de risque de connexion Anonymous IP address. Les capteurs Defender pour Identity des contrôleurs de domaine détectent les demandes de réplication provenant d'ordinateurs qui ne sont pas contrôleurs de domaine (DCSync). Defender for Endpoint détecte les comportements de processus malveillants comme un rançongiciel sur un appareil.
  options:
    mdca: { en: "Defender for Cloud Apps detects risky activity in cloud apps, such as mass downloads; none of the stages is a cloud app activity.", fr: "Defender pour les applications cloud détecte les activités à risque dans les applications cloud, comme les téléchargements massifs ; aucune étape n'est une activité d'application cloud." }
    mdc: { en: "Defender for Cloud protects cloud workloads such as Azure resources; the stages concern email, identity, Active Directory and a device.", fr: "Defender pour le cloud protège des charges de travail cloud comme les ressources Azure ; les étapes concernent la messagerie, l'identité, Active Directory et un appareil." }
references:
  - title: What are risk detections?
    url: https://learn.microsoft.com/en-us/entra/id-protection/concept-identity-protection-risks
  - title: Microsoft Defender for Identity classic alerts
    url: https://learn.microsoft.com/en-us/defender-for-identity/alerts-mdi-classic
