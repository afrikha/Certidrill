id: sc200-2b-cx-graph-play
objective: "2.1.9"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Woodgrove Bank investigates an incident that correlates 18 alerts from Defender for Endpoint, Defender for Identity and Microsoft Sentinel across 12 devices.

    You need to visualize, step by step and in chronological order, how the alerts and entities appeared as the attack spread through the environment.

    What should you use on the incident page?
  fr: |
    Woodgrove Bank examine un incident qui corrèle 18 alertes de Defender for Endpoint, Defender pour Identity et Microsoft Sentinel sur 12 appareils.

    Vous devez visualiser, étape par étape et dans l'ordre chronologique, comment les alertes et les entités sont apparues à mesure que l'attaque se propageait dans l'environnement.

    Que devez-vous utiliser sur la page de l'incident ?
body:
  options:
    - id: a
      text: { en: "The Play control of the incident graph", fr: "La commande Play du graphe de l'incident" }
    - id: b
      text: { en: "The Activities tab", fr: "L'onglet Activités" }
    - id: c
      text: { en: "The Evidence and Response tab", fr: "L'onglet Preuves et réponse" }
    - id: d
      text: { en: "The Investigations tab", fr: "L'onglet Investigations" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      The incident graph shows where the attack started, how it spread over time and how far it went. Its playback control plays the alerts and nodes in chronological order, so you see the attack unfold step by step.
    fr: |
      Le graphe de l'incident montre où l'attaque a commencé, comment elle s'est propagée dans le temps et jusqu'où elle est allée. Sa commande de lecture rejoue les alertes et les nœuds dans l'ordre chronologique : vous voyez l'attaque se dérouler étape par étape.
  options:
    b: { en: "The Activities tab is a timeline of the manual and automated actions taken on the incident, not of the attack.", fr: "L'onglet Activités est une chronologie des actions manuelles et automatisées effectuées sur l'incident, pas de l'attaque." }
    c: { en: "Evidence and Response lists the analyzed entities with their verdict and remediation status.", fr: "Preuves et réponse liste les entités analysées avec leur verdict et leur état de correction." }
    d: { en: "The Investigations tab lists the automated investigations triggered by the alerts.", fr: "L'onglet Investigations liste les investigations automatisées déclenchées par les alertes." }
references:
  - title: Investigate incidents in the Microsoft Defender portal (legacy)
    url: https://learn.microsoft.com/en-us/defender-xdr/investigate-incidents
