id: sc200-2b-sen-automation-condition
objective: "2.1.7"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Fabrikam onboarded its Microsoft Sentinel workspace to the Microsoft Defender portal. Before onboarding, an automation rule assigned to the network team every incident whose **Incident provider** was Microsoft Sentinel and whose title contained "VPN".

    After onboarding, the rule also assigns Defender XDR incidents to the network team. The VPN incidents come from a Sentinel analytics rule named **AR-VPN-BruteForce**.

    You need the automation rule to run only on incidents that contain alerts from AR-VPN-BruteForce. The solution must keep working when the correlation engine renames incidents.

    Which condition should the automation rule use?
  fr: |
    Fabrikam a intégré son espace de travail Microsoft Sentinel au portail Microsoft Defender. Avant l'intégration, une règle d'automatisation attribuait à l'équipe réseau chaque incident dont le **fournisseur d'incidents** était Microsoft Sentinel et dont le titre contenait « VPN ».

    Après l'intégration, la règle attribue aussi des incidents Defender XDR à l'équipe réseau. Les incidents VPN proviennent d'une règle d'analytique Sentinel nommée **AR-VPN-BruteForce**.

    Vous devez faire en sorte que la règle d'automatisation ne s'exécute que sur les incidents qui contiennent des alertes d'AR-VPN-BruteForce. La solution doit continuer à fonctionner lorsque le moteur de corrélation renomme les incidents.

    Quelle condition la règle d'automatisation doit-elle utiliser ?
body:
  options:
    - id: a
      text: { en: "Incident provider equals Microsoft Sentinel", fr: "Le fournisseur d'incidents est égal à Microsoft Sentinel" }
    - id: b
      text: { en: "Title contains AR-VPN-BruteForce", fr: "Le titre contient AR-VPN-BruteForce" }
    - id: c
      text: { en: "Analytics rule name contains AR-VPN-BruteForce", fr: "Le nom de la règle d'analytique contient AR-VPN-BruteForce" }
    - id: d
      text: { en: "Description contains AR-VPN-BruteForce", fr: "La description contient AR-VPN-BruteForce" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      After onboarding, the Incident provider condition is removed, so existing rules run on both Microsoft Sentinel and Microsoft XDR incidents. A rule that specifies an analytics rule name runs only on incidents that contain alerts from that rule, and Microsoft recommends the analytics rule name and tags instead of incident titles, which can change when alerts are correlated.
    fr: |
      Après l'intégration, la condition sur le fournisseur d'incidents est supprimée : les règles existantes s'exécutent sur les incidents Microsoft Sentinel et Microsoft XDR. Une règle qui spécifie un nom de règle d'analytique ne s'exécute que sur les incidents contenant des alertes de cette règle, et Microsoft recommande le nom de la règle d'analytique et les balises plutôt que les titres d'incidents, qui peuvent changer lors de la corrélation des alertes.
  options:
    a: { en: "The Incident provider condition is removed after onboarding; the provider name is always Microsoft XDR.", fr: "La condition sur le fournisseur d'incidents est supprimée après l'intégration ; le nom du fournisseur est toujours Microsoft XDR." }
    b: { en: "Incident names can change when correlation is applied, so title conditions aren't reliable.", fr: "Les noms des incidents peuvent changer lors de la corrélation : les conditions sur le titre ne sont pas fiables." }
    d: { en: "After onboarding, the incident Description field is no longer available, so automation rules that use it as a condition don't work.", fr: "Après l'intégration, le champ Description des incidents n'est plus disponible : les règles d'automatisation qui l'utilisent comme condition ne fonctionnent pas." }
references:
  - title: Transition your Microsoft Sentinel environment to the Defender portal
    url: https://learn.microsoft.com/en-us/azure/sentinel/move-to-defender
