id: sc200-2d-audit-latency
objective: "2.3.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso, Ltd. uses Microsoft 365, and audit log search is turned on. A Microsoft Defender XDR incident shows that a user downloaded 300 files from a SharePoint site 20 minutes ago.

    You search the audit log in the Microsoft Purview portal for the FileDownloaded activity of the user during the last hour. The search completes with no results. The search criteria are correct.

    What should you do?
  fr: |
    Contoso, Ltd. utilise Microsoft 365, et la recherche dans le journal d'audit est activée. Un incident Microsoft Defender XDR indique qu'un utilisateur a téléchargé 300 fichiers depuis un site SharePoint il y a 20 minutes.

    Vous recherchez dans le journal d'audit du portail Microsoft Purview l'activité FileDownloaded de l'utilisateur au cours de la dernière heure. La recherche se termine sans résultat. Les critères de recherche sont corrects.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Turn on auditing by running Set-AdminAuditLogConfig.", fr: "Activer l'audit en exécutant Set-AdminAuditLogConfig." } }
    - { id: b, text: { en: "Wait about an hour, and then run the same search again.", fr: "Attendre environ une heure, puis relancer la même recherche." } }
    - { id: c, text: { en: "Create an audit log retention policy for the SharePoint record type.", fr: "Créer une stratégie de rétention des journaux d'audit pour le type d'enregistrement SharePoint." } }
    - { id: d, text: { en: "Search for the files with a content search in eDiscovery instead.", fr: "Rechercher plutôt les fichiers avec une recherche de contenu dans eDiscovery." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Audit records of core services such as Exchange, SharePoint, OneDrive and Teams are typically available 60 to 90 minutes after an event, and Microsoft does not guarantee a specific time. A download that happened 20 minutes ago is probably not in the audit log yet, so you rerun the search later.
    fr: |
      Les enregistrements d'audit des services principaux comme Exchange, SharePoint, OneDrive et Teams sont en général disponibles 60 à 90 minutes après un événement, et Microsoft ne garantit pas de délai précis. Un téléchargement survenu il y a 20 minutes n'est probablement pas encore dans le journal d'audit : vous relancez la recherche plus tard.
  options:
    a: { en: "Audit log search is already turned on; the records are simply not available yet.", fr: "La recherche dans le journal d'audit est déjà activée ; les enregistrements ne sont simplement pas encore disponibles." }
    c: { en: "A retention policy controls how long records are kept; it does not make new records appear sooner.", fr: "Une stratégie de rétention contrôle la durée de conservation des enregistrements ; elle ne fait pas apparaître les nouveaux enregistrements plus tôt." }
    d: { en: "A content search finds the files themselves; it cannot show who downloaded them.", fr: "Une recherche de contenu trouve les fichiers eux-mêmes ; elle ne peut pas montrer qui les a téléchargés." }
references:
  - title: Search the audit log
    url: https://learn.microsoft.com/en-us/purview/audit-search
