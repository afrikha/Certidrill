id: sc200-2a-dlp-behaviors-table
objective: "2.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Adatum Corporation uses Microsoft Purview Data Loss Prevention (DLP) and Microsoft Defender XDR. Since early October 2026, the matches of a DLP policy named DLP-Finance no longer create alerts or appear in the incident queue. The SOC wants to keep it that way.

    You need to review the DLP-Finance signals of the last week without changing any setting.

    Which table should you query in advanced hunting?
  fr: |
    Adatum Corporation utilise la protection contre la perte de données (DLP) de Microsoft Purview et Microsoft Defender XDR. Depuis début octobre 2026, les correspondances d'une stratégie DLP nommée DLP-Finance ne créent plus d'alertes et n'apparaissent plus dans la file d'attente des incidents. Le SOC souhaite conserver ce fonctionnement.

    Vous devez examiner les signaux de DLP-Finance de la dernière semaine sans modifier aucun paramètre.

    Quelle table devez-vous interroger dans le repérage avancé ?
body:
  options:
    - { id: a, text: AlertInfo }
    - { id: b, text: BehaviorInfo }
    - { id: c, text: DeviceEvents }
    - { id: d, text: EmailEvents }
answer: { optionId: b }
explanation:
  correct:
    en: |
      A built-in alert tuning rule that took effect in early October 2026 turns DLP signals into behaviors instead of alerts. They no longer appear in the incident queue, but they remain available for advanced hunting in the BehaviorInfo and BehaviorEntities tables. Disabling the rule in Settings > Microsoft Defender XDR > Alert tuning would bring the alerts back, which the SOC doesn't want.
    fr: |
      Une règle de réglage d'alerte intégrée, entrée en vigueur début octobre 2026, transforme les signaux DLP en comportements au lieu d'alertes. Ils n'apparaissent plus dans la file d'attente des incidents, mais restent disponibles pour le repérage avancé dans les tables BehaviorInfo et BehaviorEntities. Désactiver la règle dans Paramètres > Microsoft Defender XDR > Réglage des alertes ferait revenir les alertes, ce que le SOC ne veut pas.
  options:
    a: { en: "AlertInfo contains alerts; the DLP signals are now behaviors and no longer generate alerts.", fr: "AlertInfo contient des alertes ; les signaux DLP sont désormais des comportements et ne génèrent plus d'alertes." }
    c: { en: "DeviceEvents contains endpoint events from Defender for Endpoint, not the DLP behaviors.", fr: "DeviceEvents contient des événements de points de terminaison de Defender for Endpoint, pas les comportements DLP." }
    d: { en: "EmailEvents describes messages processed by Defender for Office 365, not DLP policy matches.", fr: "EmailEvents décrit les messages traités par Defender pour Office 365, pas les correspondances de stratégies DLP." }
references:
  - title: Investigate data loss alerts with Microsoft Defender XDR
    url: https://learn.microsoft.com/en-us/defender-xdr/dlp-investigate-alerts-defender
