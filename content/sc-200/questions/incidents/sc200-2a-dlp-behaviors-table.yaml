id: sc200-2a-dlp-behaviors-table
objective: "2.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Adatum Corporation uses Microsoft Purview Data Loss Prevention (DLP) for Exchange Online and Microsoft Defender XDR. DLP signals create alerts in the Microsoft Defender portal.

    A DLP alert reports that a user sent an email message that contains bank account numbers to an external recipient. Before you contact the user, you need to review the message exactly as it was sent.

    What should you do from the alert page?
  fr: |
    Adatum Corporation utilise la protection contre la perte de données (DLP) de Microsoft Purview pour Exchange Online et Microsoft Defender XDR. Les signaux DLP créent des alertes dans le portail Microsoft Defender.

    Une alerte DLP signale qu'un utilisateur a envoyé à un destinataire externe un message électronique qui contient des numéros de compte bancaire. Avant de contacter l'utilisateur, vous devez examiner le message tel qu'il a été envoyé.

    Que devez-vous faire depuis la page de l'alerte ?
body:
  options:
    - { id: a, text: { en: "Select Actions > Unshare to recall the message.", fr: "Sélectionner Actions > Unshare pour rappeler le message." } }
    - { id: b, text: { en: "Select Actions > Download email.", fr: "Sélectionner Actions > Download email." } }
    - { id: c, text: { en: "Select Actions > Apply retention label to keep a copy of the message.", fr: "Sélectionner Actions > Apply retention label pour conserver une copie du message." } }
    - { id: d, text: { en: "Open the Sensitive info types tab to read the message.", fr: "Ouvrir l'onglet Sensitive info types pour lire le message." } }
answer: { optionId: b }
explanation:
  correct:
    en: When a DLP alert is about an email message, the alert page lets you download the message with Actions > Download email. The other remediation actions of a DLP alert, such as Unshare or Apply retention label, are for SharePoint Online and OneDrive files.
    fr: Quand une alerte DLP concerne un message électronique, la page de l'alerte permet de télécharger le message avec Actions > Download email. Les autres actions de correction d'une alerte DLP, comme Unshare ou Apply retention label, concernent les fichiers SharePoint Online et OneDrive.
  options:
    a: { en: "Unshare removes the sharing of a SharePoint Online or OneDrive file; it doesn't apply to an email message.", fr: "Unshare supprime le partage d'un fichier SharePoint Online ou OneDrive ; il ne s'applique pas à un message électronique." }
    c: { en: "Apply retention label is offered for SharePoint Online and OneDrive files, not for email messages, and it doesn't show you the message.", fr: "Apply retention label est proposé pour les fichiers SharePoint Online et OneDrive, pas pour les messages électroniques, et il ne vous montre pas le message." }
    d: { en: "The Sensitive info types tab shows the sensitive content that matched the policy, not the message as it was sent.", fr: "L'onglet Sensitive info types affiche le contenu sensible qui correspond à la stratégie, pas le message tel qu'il a été envoyé." }
references:
  - title: Investigate data loss alerts with Microsoft Defender XDR
    url: https://learn.microsoft.com/en-us/defender-xdr/dlp-investigate-alerts-defender
