id: sc200-2a-irm-sharing-setting
objective: "2.1.2"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    Fabrikam, Inc. has just deployed Microsoft Purview Insider Risk Management. The SOC analysts work in the Microsoft Defender portal and have the required roles.

    You need the insider risk alerts to appear in the Defender portal, and the analysts must be able to list only the incidents that contain these alerts.

    How should you complete the configuration? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam, Inc. vient de déployer la gestion des risques internes de Microsoft Purview. Les analystes SOC travaillent dans le portail Microsoft Defender et disposent des rôles requis.

    Les alertes de risque interne doivent apparaître dans le portail Defender, et les analystes doivent pouvoir lister uniquement les incidents qui contiennent ces alertes.

    Comment devez-vous compléter la configuration ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Turn on [[s1]] in [[s2]].

      In the incident queue, filter on [[s3]].
    fr: |
      Activer [[s1]] dans [[s2]].

      Dans la file d'attente des incidents, filtrer sur [[s3]].
  slots:
    - id: s1
      options:
        - { id: share, text: "Share user risk details with other security solutions" }
        - { id: m365, text: "Microsoft 365 activities" }
        - { id: tuning, text: "Alert tuning" }
    - id: s2
      options:
        - { id: purview, text: { en: "the Insider Risk Management data sharing settings of the Microsoft Purview portal", fr: "les paramètres de partage de données de la gestion des risques internes du portail Microsoft Purview" } }
        - { id: xdr, text: { en: "Settings > Microsoft Defender XDR in the Defender portal", fr: "Paramètres > Microsoft Defender XDR dans le portail Defender" } }
        - { id: connectors, text: { en: "Settings > Cloud Apps > App connectors in the Defender portal", fr: "Paramètres > Cloud Apps > Connecteurs d'applications dans le portail Defender" } }
    - id: s3
      options:
        - { id: irm, text: { en: "Service source: Microsoft Purview Insider Risk Management", fr: "Source de service : Microsoft Purview Insider Risk Management" } }
        - { id: dlp, text: { en: "Service source: Microsoft Data Loss Prevention", fr: "Source de service : Microsoft Data Loss Prevention" } }
        - { id: custom, text: { en: "Detection source: Custom detection", fr: "Source de détection : Custom detection" } }
answer:
  values: { s1: share, s2: purview, s3: irm }
explanation:
  correct:
    en: |
      Insider risk data reaches the Defender portal when Share user risk details with other security solutions is turned on in the data sharing settings of Insider Risk Management in the Purview portal. In the incident or alert queue, the Service source filter set to Microsoft Purview Insider Risk Management lists the related incidents.
    fr: |
      Les données de risque interne arrivent dans le portail Defender quand Share user risk details with other security solutions est activé dans les paramètres de partage de données de la gestion des risques internes du portail Purview. Dans la file d'attente des incidents ou des alertes, le filtre Source de service réglé sur Microsoft Purview Insider Risk Management liste les incidents concernés.
  options:
    m365: { en: "Microsoft 365 activities is the app connector option that populates CloudAppEvents, not the insider risk integration.", fr: "Microsoft 365 activities est l'option du connecteur d'applications qui alimente CloudAppEvents, pas l'intégration du risque interne." }
    tuning: { en: "Alert tuning controls how alerts are suppressed or turned into behaviors; it doesn't share insider risk data.", fr: "Le réglage des alertes contrôle la suppression des alertes ou leur transformation en comportements ; il ne partage pas les données de risque interne." }
    dlp: { en: "Microsoft Data Loss Prevention is the service source of DLP alerts.", fr: "Microsoft Data Loss Prevention est la source de service des alertes DLP." }
references:
  - title: Investigate insider risk threats in the Microsoft Defender portal with insights from Microsoft Purview Insider Risk Management
    url: https://learn.microsoft.com/en-us/defender-xdr/irm-investigate-alerts-defender
