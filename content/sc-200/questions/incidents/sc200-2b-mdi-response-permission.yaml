id: sc200-2b-mdi-response-permission
objective: "2.1.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Wingtip Toys uses Microsoft Defender for Identity and Microsoft Defender XDR unified role-based access control (RBAC). Defender for Identity sensors on the domain controllers are configured to perform remediation actions.

    SOC analysts must be able to disable compromised Active Directory accounts from the identity page in the Defender portal. The solution must follow the principle of least privilege.

    What should you assign to the analysts?
  fr: |
    Wingtip Toys utilise Microsoft Defender pour Identity et le contrôle d'accès en fonction du rôle (RBAC) unifié de Microsoft Defender XDR. Les capteurs Defender pour Identity des contrôleurs de domaine sont configurés pour effectuer des actions de correction.

    Les analystes du SOC doivent pouvoir désactiver les comptes Active Directory compromis depuis la page d'identité du portail Defender. La solution doit respecter le principe du moindre privilège.

    Que devez-vous attribuer aux analystes ?
body:
  options:
    - id: a
      text: { en: "A custom unified RBAC role that has the Security data basics (read) permission", fr: "Un rôle personnalisé de RBAC unifié qui dispose de l'autorisation Security data basics (read)" }
    - id: b
      text: { en: "A custom unified RBAC role that has the Alerts (manage) permission", fr: "Un rôle personnalisé de RBAC unifié qui dispose de l'autorisation Alerts (manage)" }
    - id: c
      text: { en: "A custom unified RBAC role that has the Response (manage) permission", fr: "Un rôle personnalisé de RBAC unifié qui dispose de l'autorisation Response (manage)" }
    - id: d
      text: { en: "The Security Administrator role in Microsoft Entra ID", fr: "Le rôle Security Administrator dans Microsoft Entra ID" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Defender for Identity remediation actions require a custom role with the Response (manage) permission under unified RBAC; unauthorized actions are blocked before they run. For Active Directory accounts, the domain controller sensor then performs the action.
    fr: |
      Les actions de correction de Defender pour Identity exigent un rôle personnalisé disposant de l'autorisation Response (manage) dans le RBAC unifié ; les actions non autorisées sont bloquées avant leur exécution. Pour les comptes Active Directory, le capteur du contrôleur de domaine effectue ensuite l'action.
  options:
    a: { en: "Security data basics (read) lets analysts view data, not take response actions.", fr: "Security data basics (read) permet de consulter les données, pas d'effectuer des actions de réponse." }
    b: { en: "Alerts (manage) lets analysts manage alerts and incidents, not run remediation actions on identities.", fr: "Alerts (manage) permet de gérer les alertes et les incidents, pas d'exécuter des actions de correction sur les identités." }
    d: { en: "Security Administrator is a broad directory role that grants far more than the response permission required.", fr: "Security Administrator est un rôle d'annuaire étendu qui accorde bien plus que l'autorisation de réponse nécessaire." }
references:
  - title: Remediation actions in Microsoft Defender for Identity
    url: https://learn.microsoft.com/en-us/defender-for-identity/remediation-actions
