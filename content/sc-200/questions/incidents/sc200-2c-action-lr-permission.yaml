id: sc200-2c-action-lr-permission
objective: "2.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Contoso uses Microsoft Defender XDR Unified RBAC. An analyst named Ben has a custom role that includes the Basic live response permission for all device groups.

    Ben can open live response sessions and run `getfile` and `processes`. He must now run a signed PowerShell script named **Collect-Logs.ps1** that a SOC administrator already uploaded to the live response library.

    You need to ensure that Ben can run the script. The solution must follow the principle of least privilege.

    What should you do?
  fr: |
    Contoso utilise le RBAC unifié de Microsoft Defender XDR. Un analyste nommé Ben dispose d'un rôle personnalisé qui inclut l'autorisation Basic live response pour tous les groupes d'appareils.

    Ben peut ouvrir des sessions de réponse dynamique et exécuter `getfile` et `processes`. Il doit maintenant exécuter un script PowerShell signé nommé **Collect-Logs.ps1** qu'un administrateur SOC a déjà chargé dans la bibliothèque de réponse dynamique.

    Vous devez faire en sorte que Ben puisse exécuter le script. La solution doit respecter le principe du moindre privilège.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Replace Basic live response with Advanced live response in Ben's custom role", fr: "Remplacer Basic live response par Advanced live response dans le rôle personnalisé de Ben" }
    - id: b
      text: { en: "Add the Manage security settings permission to Ben's custom role", fr: "Ajouter l'autorisation Manage security settings au rôle personnalisé de Ben" }
    - id: c
      text: { en: "Turn on Live response unsigned script execution in Advanced features", fr: "Activer Live response unsigned script execution dans Advanced features" }
    - id: d
      text: { en: "Assign the Security Administrator role in Microsoft Entra ID to Ben", fr: "Attribuer à Ben le rôle Security Administrator dans Microsoft Entra ID" }
answer: { optionId: a }
explanation:
  correct:
    en: "`run` is an advanced command: it is available only to roles that grant advanced live response commands. `getfile` and `processes` are basic commands, which is why Ben can already use them."
    fr: "`run` est une commande avancée : elle n'est disponible que pour les rôles qui accordent les commandes de réponse dynamique avancées. `getfile` et `processes` sont des commandes de base, c'est pourquoi Ben peut déjà les utiliser."
  options:
    b:
      en: Manage security settings is needed to upload files to the library from the session console; the script is already in the library.
      fr: Manage security settings est nécessaire pour charger des fichiers dans la bibliothèque depuis la console de session ; le script est déjà dans la bibliothèque.
    c:
      en: The script is signed, and the setting doesn't grant the advanced commands; it also increases exposure to threats.
      fr: Le script est signé, et ce paramètre n'accorde pas les commandes avancées ; il augmente en outre l'exposition aux menaces.
    d:
      en: Security Administrator would work, but it grants far more than Ben needs.
      fr: Security Administrator fonctionnerait, mais il accorde bien plus que ce dont Ben a besoin.
references:
  - title: Investigate entities on devices using live response in Microsoft Defender for Endpoint
    url: https://learn.microsoft.com/en-us/defender-endpoint/live-response
