id: sc200-2c-entity-file-page-actions
objective: "2.2.3"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    You open the file page of a suspicious DLL named **winhlp64.dll** in the Microsoft Defender portal. The actions are displayed above the information cards at the top of the page.

    Which two actions can you start from there?

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous ouvrez la page de fichier d'une DLL suspecte nommée **winhlp64.dll** dans le portail Microsoft Defender. Les actions s'affichent au-dessus des cartes d'informations, en haut de la page.

    Quelles sont les deux actions que vous pouvez lancer depuis cet endroit ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: Isolate device }
    - { id: b, text: Collect investigation package }
    - { id: c, text: Stop and quarantine }
    - { id: d, text: Restrict app execution }
    - { id: e, text: Manage indicator }
answer: { optionIds: [ c, e ] }
explanation:
  correct:
    en: The file page offers file actions such as Stop and quarantine, Manage indicator, Download file, Go hunt and Deep analysis. They act on the file wherever it is, not on one device.
    fr: La page de fichier propose des actions sur le fichier comme Stop and quarantine, Manage indicator, Download file, Go hunt et Deep analysis. Elles agissent sur le fichier où qu'il se trouve, pas sur un seul appareil.
  options:
    a: { en: "Isolate device is a response action of the device page.", fr: "Isolate device est une action de réponse de la page de l'appareil." }
    b: { en: "Collect investigation package is a response action of the device page.", fr: "Collect investigation package est une action de réponse de la page de l'appareil." }
    d: { en: "Restrict app execution is a response action of the device page.", fr: "Restrict app execution est une action de réponse de la page de l'appareil." }
references:
  - title: Investigate Microsoft Defender for Endpoint files
    url: https://learn.microsoft.com/en-us/defender-endpoint/investigate-files
