id: sc200-2a-mdc-view-role
objective: "2.1.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Litware, Inc. uses Microsoft Defender for Cloud on all its Azure subscriptions and Microsoft Defender XDR. Microsoft Defender XDR Unified RBAC isn't activated for Defender for Cloud.

    A new analyst named Analyst6 must view the Defender for Cloud alerts and their correlations in the Microsoft Defender portal. The solution must follow the principle of least privilege.

    Which role should you assign to Analyst6?
  fr: |
    Litware, Inc. utilise Microsoft Defender pour le cloud sur tous ses abonnements Azure, ainsi que Microsoft Defender XDR. Le RBAC unifié de Microsoft Defender XDR n'est pas activé pour Defender pour le cloud.

    Une nouvelle analyste nommée Analyst6 doit consulter les alertes de Defender pour le cloud et leurs corrélations dans le portail Microsoft Defender. La solution doit respecter le principe du moindre privilège.

    Quel rôle devez-vous attribuer à Analyst6 ?
body:
  options:
    - { id: a, text: { en: "Security Reader in Microsoft Entra ID", fr: "Security Reader dans Microsoft Entra ID" } }
    - { id: b, text: { en: "Security Admin (Azure RBAC) on every subscription", fr: "Security Admin (Azure RBAC) sur chaque abonnement" } }
    - { id: c, text: { en: "Global Administrator in Microsoft Entra ID", fr: "Global Administrator dans Microsoft Entra ID" } }
    - { id: d, text: { en: "Security Administrator in Microsoft Entra ID", fr: "Security Administrator dans Microsoft Entra ID" } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Without Defender XDR Unified RBAC, viewing Defender for Cloud alerts and correlations in the Defender portal requires the Global Administrator or Security Administrator role in Microsoft Entra ID. Security Administrator is the less privileged of the two.
    fr: |
      Sans le RBAC unifié de Defender XDR, la consultation des alertes de Defender pour le cloud et de leurs corrélations dans le portail Defender exige le rôle Global Administrator ou Security Administrator dans Microsoft Entra ID. Security Administrator est le moins privilégié des deux.
  options:
    a: { en: "Security Reader isn't one of the roles that give access to the Defender for Cloud alerts in the Defender portal without Unified RBAC.", fr: "Security Reader ne fait pas partie des rôles qui donnent accès aux alertes Defender pour le cloud dans le portail Defender sans RBAC unifié." }
    b: { en: "Azure RBAC roles on subscriptions grant access in Defender for Cloud, not in the Defender portal, where visibility is tenant-wide.", fr: "Les rôles Azure RBAC sur les abonnements donnent accès dans Defender pour le cloud, pas dans le portail Defender, où la visibilité s'étend à tout le locataire." }
    c: { en: "Global Administrator works but is far more privileged than required.", fr: "Global Administrator fonctionne, mais est bien plus privilégié que nécessaire." }
references:
  - title: Alerts and incidents in Microsoft Defender XDR for Microsoft Defender for Cloud
    url: https://learn.microsoft.com/en-us/defender-xdr/microsoft-365-security-center-defender-cloud
