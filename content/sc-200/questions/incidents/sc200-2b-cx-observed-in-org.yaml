id: sc200-2b-cx-observed-in-org
objective: "2.1.9"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Tailspin Toys uses Microsoft Defender XDR with Defender for Identity and Defender for Endpoint. An identity named **Adele Vance** is involved in a lateral movement incident.

    You need a consolidated view of the devices that the identity signed in to, its sign-in locations, its groups and its correlated accounts, without reviewing individual events one by one.

    Which tab of the identity page should you open?
  fr: |
    Tailspin Toys utilise Microsoft Defender XDR avec Defender pour Identity et Defender for Endpoint. Une identité nommée **Adele Vance** est impliquée dans un incident de mouvement latéral.

    Vous avez besoin d'une vue consolidée des appareils auxquels l'identité s'est connectée, de ses emplacements de connexion, de ses groupes et de ses comptes corrélés, sans examiner les événements un par un.

    Quel onglet de la page d'identité devez-vous ouvrir ?
body:
  options:
    - id: a
      text: Timeline
    - id: b
      text: Observed in organization
    - id: c
      text: Risk score
    - id: d
      text: Attack paths
answer: { optionId: b }
explanation:
  correct:
    en: |
      Observed in organization lists the correlated accounts, the devices the identity signed in to, its sign-in locations and its groups. It helps assess the blast radius and possible lateral movement of the identity without going through individual events.
    fr: |
      Observed in organization liste les comptes corrélés, les appareils auxquels l'identité s'est connectée, ses emplacements de connexion et ses groupes. Il aide à évaluer le rayon d'impact et le mouvement latéral possible de l'identité sans parcourir les événements un par un.
  options:
    a: { en: "Timeline lists individual events in chronological order, which the requirement wants to avoid.", fr: "Timeline liste les événements individuels dans l'ordre chronologique, ce que l'exigence veut éviter." }
    c: { en: "Risk score shows the identity risk score, the likelihood and impact of compromise and a risk trend.", fr: "Risk score montre le score de risque de l'identité, la probabilité et l'impact d'une compromission et une tendance du risque." }
    d: { en: "Attack paths shows potential paths that involve or lead to the identity, not where it actually signed in.", fr: "Attack paths montre les chemins potentiels qui impliquent l'identité ou mènent à elle, pas les endroits où elle s'est réellement connectée." }
references:
  - title: Investigate an identity
    url: https://learn.microsoft.com/en-us/defender-xdr/investigate-users
