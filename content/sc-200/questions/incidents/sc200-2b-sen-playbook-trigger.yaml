id: sc200-2b-sen-playbook-trigger
objective: "2.1.7"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Contoso onboarded its Microsoft Sentinel workspace to the Microsoft Defender portal, and analysts work only in that portal.

    You are creating a Logic Apps playbook that blocks on the perimeter firewall every IP address entity found in an incident. Analysts must be able to run the playbook on demand while they investigate an incident in the Defender portal.

    Which trigger should the playbook use?
  fr: |
    Contoso a intégré son espace de travail Microsoft Sentinel au portail Microsoft Defender, et les analystes travaillent uniquement dans ce portail.

    Vous créez un playbook Logic Apps qui bloque sur le pare-feu périmétrique chaque entité d'adresse IP trouvée dans un incident. Les analystes doivent pouvoir exécuter le playbook à la demande pendant qu'ils examinent un incident dans le portail Defender.

    Quel déclencheur le playbook doit-il utiliser ?
body:
  options:
    - id: a
      text: { en: "Microsoft Sentinel alert", fr: "Alerte Microsoft Sentinel (Microsoft Sentinel alert)" }
    - id: b
      text: { en: "Microsoft Sentinel entity", fr: "Entité Microsoft Sentinel (Microsoft Sentinel entity)" }
    - id: c
      text: { en: "Microsoft Sentinel incident", fr: "Incident Microsoft Sentinel (Microsoft Sentinel incident)" }
    - id: d
      text: { en: "Recurrence", fr: "Périodicité (Recurrence)" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      In the Defender portal, running a playbook manually on an alert or on an entity isn't supported, but you can run a playbook on an incident. A playbook with the Microsoft Sentinel incident trigger receives the incident with its entities, so it can loop over every IP address and block it.
    fr: |
      Dans le portail Defender, l'exécution manuelle d'un playbook sur une alerte ou sur une entité n'est pas prise en charge, mais vous pouvez exécuter un playbook sur un incident. Un playbook avec le déclencheur d'incident Microsoft Sentinel reçoit l'incident avec ses entités : il peut parcourir chaque adresse IP et la bloquer.
  options:
    a: { en: "Manual runs on alerts aren't supported in the Defender portal.", fr: "Les exécutions manuelles sur des alertes ne sont pas prises en charge dans le portail Defender." }
    b: { en: "Manual runs on entities aren't supported in the Defender portal.", fr: "Les exécutions manuelles sur des entités ne sont pas prises en charge dans le portail Defender." }
    d: { en: "A Recurrence trigger runs on a schedule and receives no incident or entity data.", fr: "Un déclencheur Recurrence s'exécute selon une planification et ne reçoit aucune donnée d'incident ni d'entité." }
references:
  - title: Transition your Microsoft Sentinel environment to the Defender portal
    url: https://learn.microsoft.com/en-us/azure/sentinel/move-to-defender
  - title: Automate Threat Response with Playbooks in Microsoft Sentinel
    url: https://learn.microsoft.com/en-us/azure/sentinel/automation/automate-responses-with-playbooks
