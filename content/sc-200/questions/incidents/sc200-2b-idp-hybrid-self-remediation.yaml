id: sc200-2b-idp-hybrid-self-remediation
objective: "2.1.5"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    Proseware has an on-premises Active Directory domain synchronized to Microsoft Entra ID by using Microsoft Entra Connect. Only pass-through authentication is configured; password hash synchronization is disabled. The tenant has Microsoft Entra ID P2.

    Users on domain-joined Windows devices often change their password by pressing Ctrl+Alt+Del. You need these on-premises password changes to remediate the user risk detected by Microsoft Entra ID Protection.

    Which three actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Proseware dispose d'un domaine Active Directory local synchronisé avec Microsoft Entra ID à l'aide de Microsoft Entra Connect. Seule l'authentification directe est configurée ; la synchronisation du hachage de mot de passe est désactivée. Le locataire dispose de Microsoft Entra ID P2.

    Les utilisateurs d'appareils Windows joints au domaine changent souvent leur mot de passe en appuyant sur Ctrl+Alt+Suppr. Vous devez faire en sorte que ces changements de mot de passe locaux corrigent le risque utilisateur détecté par Microsoft Entra ID Protection.

    Quelles sont les trois actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - { id: phs, text: { en: "Enable password hash synchronization in Microsoft Entra Connect.", fr: "Activer la synchronisation du hachage de mot de passe dans Microsoft Entra Connect." } }
    - { id: setting, text: { en: "In ID Protection settings, select **Allow on-premises password change to reset user risk** and save.", fr: "Dans les paramètres d'ID Protection, sélectionner **Allow on-premises password change to reset user risk** et enregistrer." } }
    - { id: change, text: { en: "Have the risky user change the password on a domain-joined device.", fr: "Faire changer son mot de passe à l'utilisateur à risque sur un appareil joint au domaine." } }
    - { id: dismiss, text: { en: "Select **Dismiss user risk** for the risky user.", fr: "Sélectionner **Dismiss user risk** pour l'utilisateur à risque." } }
    - { id: signin, text: { en: "Create a sign-in risk policy that requires multifactor authentication.", fr: "Créer une stratégie de risque de connexion qui exige l'authentification multifacteur." } }
    - { id: temp, text: { en: "Generate a temporary password for the risky user from the Risky users report.", fr: "Générer un mot de passe temporaire pour l'utilisateur à risque depuis le rapport Utilisateurs à risque." } }
answer:
  sequence: [ phs, setting, change ]
explanation:
  correct:
    en: |
      Password hash synchronization must be enabled before users can self-remediate with an on-premises password change. You then opt in to the Allow on-premises password change to reset user risk setting in ID Protection. After that, a password change made with Ctrl+Alt+Del on a domain-joined device resets the user risk.
    fr: |
      La synchronisation du hachage de mot de passe doit être activée pour que les utilisateurs puissent se corriger eux-mêmes par un changement de mot de passe local. Vous activez ensuite le paramètre Allow on-premises password change to reset user risk dans ID Protection. Après cela, un changement de mot de passe effectué avec Ctrl+Alt+Suppr sur un appareil joint au domaine réinitialise le risque utilisateur.
  options:
    dismiss: { en: "Dismissing risk is a manual admin action that leaves the password unchanged; it doesn't make on-premises changes remediate risk.", fr: "Ignorer le risque est une action manuelle d'administrateur qui laisse le mot de passe inchangé ; elle ne permet pas aux changements locaux de corriger le risque." }
    signin: { en: "A sign-in risk policy with MFA remediates sign-in risk, not user risk.", fr: "Une stratégie de risque de connexion avec MFA corrige le risque de connexion, pas le risque utilisateur." }
    temp: { en: "A temporary password is an admin remediation; the requirement is for the users' own on-premises changes to remediate risk.", fr: "Un mot de passe temporaire est une correction par l'administrateur ; l'exigence porte sur les changements locaux effectués par les utilisateurs eux-mêmes." }
references:
  - title: Remediate risks and unblock users
    url: https://learn.microsoft.com/en-us/entra/id-protection/howto-identity-protection-remediate-unblock
