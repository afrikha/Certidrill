id: sc200-cs3c-leaked-secret
objective: "2.3.3"
type: dropdown
caseStudy: sc200-cs3c-relecloud
difficulty: 3
status: draft
stem:
  en: |
    The Microsoft Graph activity logs are now collected in law-rc-sec.

    You need to write a query to meet the leaked secret requirement.

    How should you complete the query? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Les journaux d'activité Microsoft Graph sont désormais collectés dans law-rc-sec.

    Vous devez écrire une requête pour respecter l'exigence relative au secret divulgué.

    Comment devez-vous compléter la requête ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: kusto
  template: |
    [[tbl]]
    | where TimeGenerated > ago(3d)
    | where isnotempty(ServicePrincipalId)
    | where RequestUri contains "/users" and [[col]] == 200
    | summarize Requests = count(), IPs = [[agg]](IPAddress) by ServicePrincipalId, AppId
    | sort by Requests desc
  slots:
    - id: tbl
      options:
        - { id: spsignin, text: AADServicePrincipalSignInLogs }
        - { id: audit, text: AuditLogs }
        - { id: graph, text: MicrosoftGraphActivityLogs }
        - { id: signin, text: SigninLogs }
    - id: col
      options:
        - { id: status, text: ResponseStatusCode }
        - { id: result, text: ResultType }
        - { id: res, text: Result }
    - id: agg
      options:
        - { id: dcount, text: dcount }
        - { id: makeset, text: make_set }
        - { id: argmax, text: arg_max }
        - { id: sum, text: sum }
answer:
  values: { tbl: graph, col: status, agg: makeset }
explanation:
  correct:
    en: |
      MicrosoftGraphActivityLogs records every HTTP request that Microsoft Graph receives for the tenant, with the RequestUri, the ServicePrincipalId, the AppId, the IPAddress and the HTTP ResponseStatusCode, where 200 means success. make_set builds the list of distinct IP addresses used by each service principal, as the requirement asks.
    fr: |
      MicrosoftGraphActivityLogs enregistre chaque requête HTTP reçue par Microsoft Graph pour le locataire, avec RequestUri, ServicePrincipalId, AppId, IPAddress et le code HTTP ResponseStatusCode, où 200 signifie un succès. make_set construit la liste des adresses IP distinctes utilisées par chaque principal de service, comme le demande l'exigence.
  options:
    spsignin: { en: "AADServicePrincipalSignInLogs records how the service principal obtained tokens, not the Graph requests it made.", fr: "AADServicePrincipalSignInLogs enregistre l'obtention des jetons par le principal de service, pas les requêtes Graph qu'il a effectuées." }
    audit: { en: "AuditLogs records directory changes, not read requests to /users.", fr: "AuditLogs enregistre les modifications de l'annuaire, pas les requêtes de lecture vers /users." }
    signin: { en: "SigninLogs records sign-ins, not the API requests sent to Microsoft Graph.", fr: "SigninLogs enregistre les connexions, pas les requêtes d'API envoyées à Microsoft Graph." }
    result: { en: "ResultType is a sign-in log column; the HTTP status of a Graph request is in ResponseStatusCode.", fr: "ResultType est une colonne des journaux de connexion ; le statut HTTP d'une requête Graph se trouve dans ResponseStatusCode." }
    res: { en: "Result is an AuditLogs column; it does not exist in the Graph activity logs.", fr: "Result est une colonne de AuditLogs ; elle n'existe pas dans les journaux d'activité Graph." }
    dcount: { en: "dcount returns the number of distinct IP addresses, not the addresses themselves.", fr: "dcount renvoie le nombre d'adresses IP distinctes, pas les adresses elles-mêmes." }
    argmax: { en: "arg_max returns the row with the highest value of an expression, not a list of addresses.", fr: "arg_max renvoie la ligne qui a la valeur la plus élevée d'une expression, pas une liste d'adresses." }
    sum: { en: "sum adds numeric values and cannot aggregate IP address strings.", fr: "sum additionne des valeurs numériques et ne peut pas agréger des chaînes d'adresses IP." }
references:
  - title: Access Microsoft Graph activity logs
    url: https://learn.microsoft.com/en-us/graph/microsoft-graph-activity-logs-overview
