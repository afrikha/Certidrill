id: sc200-2b-cop-summary-limit
objective: "2.1.8"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Contoso uses Microsoft Defender XDR and has provisioned access to Microsoft Security Copilot. When analysts open an incident in the Defender portal, Copilot generates an incident summary automatically.

    An analyst opens a large multi-stage incident that contains 140 alerts. Copilot doesn't produce a summary for it, while other incidents opened at the same time are summarized.

    What is the most likely cause?
  fr: |
    Contoso utilise Microsoft Defender XDR et dispose d'un accès provisionné à Microsoft Security Copilot. Lorsque les analystes ouvrent un incident dans le portail Defender, Copilot génère automatiquement un résumé de l'incident.

    Un analyste ouvre un grand incident multi-étapes qui contient 140 alertes. Copilot ne produit pas de résumé pour cet incident, alors que d'autres incidents ouverts au même moment sont résumés.

    Quelle est la cause la plus probable ?
body:
  options:
    - id: a
      text: { en: "Incident summaries support incidents that contain up to 100 alerts.", fr: "Les résumés d'incidents prennent en charge les incidents contenant jusqu'à 100 alertes." }
    - id: b
      text: { en: "The provisioned Security Compute Units of the tenant are exhausted.", fr: "Les unités de calcul de sécurité provisionnées du locataire sont épuisées." }
    - id: c
      text: { en: "Summary generation is set to On demand in the Copilot in Defender settings.", fr: "La génération des résumés est définie sur À la demande dans les paramètres Copilot dans Defender." }
    - id: d
      text: { en: "A summary was cached for the incident during the last week.", fr: "Un résumé a été mis en cache pour l'incident au cours de la dernière semaine." }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Copilot in Defender summarizes an incident with up to 100 alerts into one incident summary. An incident with 140 alerts exceeds this limit, which explains why only this incident has no summary.
    fr: |
      Copilot dans Defender résume en un seul résumé un incident comportant jusqu'à 100 alertes. Un incident de 140 alertes dépasse cette limite, ce qui explique que seul cet incident n'ait pas de résumé.
  options:
    b: { en: "Exhausted capacity would also stop the summaries of the other incidents opened at the same time.", fr: "Une capacité épuisée arrêterait aussi les résumés des autres incidents ouverts au même moment." }
    c: { en: "An On demand setting would affect every incident, but the other incidents are summarized automatically.", fr: "Un paramètre À la demande affecterait tous les incidents, or les autres incidents sont résumés automatiquement." }
    d: { en: "A cached summary is redisplayed at no cost when the incident hasn't changed much; it doesn't prevent a summary.", fr: "Un résumé mis en cache est réaffiché sans coût lorsque l'incident a peu changé ; il n'empêche pas d'avoir un résumé." }
references:
  - title: Summarize an incident with Microsoft Copilot in Microsoft Defender
    url: https://learn.microsoft.com/en-us/defender-xdr/security-copilot-m365d-incident-summary
