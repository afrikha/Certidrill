id: sc200-2d-audit-search-steps
objective: "2.3.1"
type: ordering
difficulty: 1
status: draft
stem:
  en: |
    Fabrikam, Inc. uses Microsoft 365. You have the View-Only Audit Logs role. A departing employee named Hugo is suspected of downloading confidential files from OneDrive and SharePoint during his last two weeks.

    You need to provide the legal team with a CSV file that lists the files Hugo downloaded during this period.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Fabrikam, Inc. utilise Microsoft 365. Vous disposez du rôle View-Only Audit Logs. Un employé sur le départ nommé Hugo est soupçonné d'avoir téléchargé des fichiers confidentiels depuis OneDrive et SharePoint pendant ses deux dernières semaines.

    Vous devez fournir à l'équipe juridique un fichier CSV qui liste les fichiers téléchargés par Hugo pendant cette période.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: open, text: { en: "Open the Audit solution in the Microsoft Purview portal.", fr: "Ouvrir la solution Audit dans le portail Microsoft Purview." } }
    - { id: criteria, text: { en: "Set the date and time range, Hugo as the user, and FileDownloaded as the activity.", fr: "Définir la plage de dates et d'heures, Hugo comme utilisateur et FileDownloaded comme activité." } }
    - { id: wait, text: { en: "Run the search and wait until the job status is Completed.", fr: "Lancer la recherche et attendre que l'état du travail soit Completed." } }
    - { id: export, text: { en: "Open the search job and export the results.", fr: "Ouvrir le travail de recherche et exporter les résultats." } }
    - { id: case, text: { en: "Create a search in the Content Search case of eDiscovery.", fr: "Créer une recherche dans le cas Content Search d'eDiscovery." } }
    - { id: policy, text: { en: "Create an audit log retention policy for Hugo.", fr: "Créer une stratégie de rétention des journaux d'audit pour Hugo." } }
answer:
  sequence: [ open, criteria, wait, export ]
explanation:
  correct:
    en: |
      Download activity is recorded in the audit log, so you search it in the Audit solution. You define the criteria (date range in UTC, user, FileDownloaded activity), run the search job, which keeps running even if you close the browser, and then open the completed job to export the results to a CSV file.
    fr: |
      L'activité de téléchargement est enregistrée dans le journal d'audit : vous la recherchez dans la solution Audit. Vous définissez les critères (plage de dates en UTC, utilisateur, activité FileDownloaded), lancez le travail de recherche, qui se poursuit même si vous fermez le navigateur, puis ouvrez le travail terminé pour exporter les résultats dans un fichier CSV.
  options:
    case: { en: "A content search finds the files themselves, not who downloaded them.", fr: "Une recherche de contenu trouve les fichiers eux-mêmes, pas qui les a téléchargés." }
    policy: { en: "The records of the last two weeks are already retained; a retention policy is not needed and requires another role.", fr: "Les enregistrements des deux dernières semaines sont déjà conservés ; une stratégie de rétention n'est pas nécessaire et exige un autre rôle." }
references:
  - title: Search the audit log
    url: https://learn.microsoft.com/en-us/purview/audit-search
