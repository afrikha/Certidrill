id: sc200-cs2b-keyvault-scanner-alerts
objective: "2.1.3"
type: single
caseStudy: sc200-cs2b-consolidated-messenger
difficulty: 1
status: draft
stem:
  en: |
    You open one of the Defender for Key Vault alerts raised by the last scan of SCAN-VM1 and confirm that the activity is authorized.

    You need to meet the requirement for the SCAN-VM1 alerts.

    What should you do from the alert?
  fr: |
    Vous ouvrez l'une des alertes Defender pour Key Vault déclenchées par la dernière analyse de SCAN-VM1 et vous confirmez que l'activité est autorisée.

    Vous devez répondre à l'exigence relative aux alertes de SCAN-VM1.

    Que devez-vous faire depuis l'alerte ?
body:
  options:
    - { id: a, text: { en: "Set the status of the alert to Dismissed", fr: "Définir le statut de l'alerte sur Dismissed" } }
    - { id: b, text: { en: "Use Trigger automated response to run a logic app on the alert", fr: "Utiliser Trigger automated response pour exécuter une application logique sur l'alerte" } }
    - { id: c, text: { en: "Use Suppress similar alerts to create a suppression rule for the scanner", fr: "Utiliser Suppress similar alerts pour créer une règle de suppression pour le scanner" } }
    - { id: d, text: { en: "Apply the recommendations listed under Prevent future attacks", fr: "Appliquer les recommandations listées sous Prevent future attacks" } }
answer: { optionId: c }
explanation:
  correct:
    en: When an alert is not relevant to the organization, such as activity from an authorized scanner, Suppress similar alerts creates a suppression rule. The rule automatically dismisses the future alerts that match its conditions (the alert type and entity conditions that identify the scanner) while every other Defender for Key Vault alert remains active.
    fr: Quand une alerte n'est pas pertinente pour l'organisation, comme l'activité d'un scanner autorisé, Suppress similar alerts crée une règle de suppression. La règle fait passer automatiquement au statut Dismissed les futures alertes qui correspondent à ses conditions (le type d'alerte et des conditions d'entité qui identifient le scanner), tandis que toutes les autres alertes Defender pour Key Vault restent actives.
  options:
    a: { en: "Dismissing closes only this alert; the next scan raises a new one.", fr: "Ignorer l'alerte ne ferme que cette alerte ; la prochaine analyse en déclenche une nouvelle." }
    b: { en: "Trigger automated response runs a logic app once on the selected alert; it does nothing for the alerts of the next scans.", fr: "Trigger automated response exécute une seule fois une application logique sur l'alerte sélectionnée ; il ne fait rien pour les alertes des analyses suivantes." }
    d: { en: "Recommendations reduce the attack surface; they do not stop alerts for an authorized activity.", fr: "Les recommandations réduisent la surface d'attaque ; elles n'empêchent pas les alertes pour une activité autorisée." }
references:
  - title: Manage and respond to security alerts
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/manage-respond-alerts
  - title: Suppress alerts from Microsoft Defender for Cloud
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/alerts-suppression-rules
