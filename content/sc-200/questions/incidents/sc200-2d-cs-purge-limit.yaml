id: sc200-2d-cs-purge-limit
objective: "2.3.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Northwind Traders has Microsoft 365 E3 licenses and no Microsoft Defender for Office 365 subscription. eDiscovery premium features are not enabled.

    A spam bot sent 14 copies of a message that contains customer bank details to each of 25 mailboxes. None of the mailboxes is on hold. An analyst who has the required roles uses Security & Compliance PowerShell to search for the message and runs a purge action with the SoftDelete type. After the action completes, a new estimate shows that four copies remain in each mailbox.

    You need to remove the remaining copies. The solution must minimize administrative effort.

    What should you do?
  fr: |
    Northwind Traders dispose de licences Microsoft 365 E3 et d'aucun abonnement Microsoft Defender pour Office 365. Les fonctionnalités premium d'eDiscovery ne sont pas activées.

    Un robot de spam a envoyé 14 copies d'un message contenant les coordonnées bancaires de clients à chacune de 25 boîtes aux lettres. Aucune boîte aux lettres n'est en conservation. Un analyste qui dispose des rôles requis utilise Security & Compliance PowerShell pour rechercher le message et exécute une action de purge de type SoftDelete. Une fois l'action terminée, une nouvelle estimation montre qu'il reste quatre copies dans chaque boîte aux lettres.

    Vous devez supprimer les copies restantes. La solution doit réduire au minimum l'effort d'administration.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Run the same purge action again on the same search.", fr: "Exécuter de nouveau la même action de purge sur la même recherche." } }
    - { id: b, text: { en: "Run a new purge action on the search with the HardDelete type.", fr: "Exécuter sur la recherche une nouvelle action de purge de type HardDelete." } }
    - { id: c, text: { en: "Use the Microsoft Graph API to purge the messages from the case.", fr: "Utiliser l'API Microsoft Graph pour purger les messages du cas." } }
    - { id: d, text: { en: "Split the search into 25 searches, one for each mailbox.", fr: "Diviser la recherche en 25 recherches, une par boîte aux lettres." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      In a case without premium features, a purge action removes at most 10 items per mailbox at one time. The first run removed 10 of the 14 copies in each mailbox, so running the purge action again removes the last four.
    fr: |
      Dans un cas sans fonctionnalités premium, une action de purge supprime au plus 10 éléments par boîte aux lettres à la fois. La première exécution a supprimé 10 des 14 copies de chaque boîte aux lettres : exécuter de nouveau l'action de purge supprime les quatre dernières.
  options:
    b: { en: "The 10-item limit applies to both purge types; HardDelete only changes whether users can recover the items.", fr: "La limite de 10 éléments s'applique aux deux types de purge ; HardDelete change seulement la possibilité pour les utilisateurs de récupérer les éléments." }
    c: { en: "Purging with Microsoft Graph applies to premium cases; non-premium cases purge email only with PowerShell, and the two methods must not be combined.", fr: "La purge avec Microsoft Graph concerne les cas premium ; les cas non premium ne purgent les e-mails qu'avec PowerShell, et les deux méthodes ne doivent pas être combinées." }
    d: { en: "The limit is per mailbox, not per search, so one search per mailbox still removes 10 items each and adds work.", fr: "La limite s'applique par boîte aux lettres, pas par recherche : une recherche par boîte aux lettres supprime toujours 10 éléments chacune et ajoute du travail." }
references:
  - title: Find and delete email messages in eDiscovery
    url: https://learn.microsoft.com/en-us/purview/edisc-search-mailbox-data
