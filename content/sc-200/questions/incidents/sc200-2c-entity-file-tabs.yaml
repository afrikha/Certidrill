id: sc200-2c-entity-file-tabs
objective: "2.2.3"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    You investigate an executable named **updsvc.exe** from its file page in the Microsoft Defender portal. Microsoft has analyzed the file.

    Which part of the file page should you use for each requirement? To answer, drag the appropriate parts to the correct requirements. Each part may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous analysez un exécutable nommé **updsvc.exe** depuis sa page de fichier dans le portail Microsoft Defender. Microsoft a analysé le fichier.

    Quelle partie de la page de fichier devez-vous utiliser pour chaque exigence ? Pour répondre, faites glisser les parties appropriées vers les exigences correspondantes. Chaque partie peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: observed, text: Observed in organization }
    - { id: names, text: File names }
    - { id: content, text: File content and capabilities }
    - { id: incidents, text: Incidents and alerts }
    - { id: deep, text: Deep analysis }
    - { id: hunt, text: Go hunt }
  targets:
    - id: history
      text: { en: "Review the file's history on a specific device over the last six months", fr: "Consulter l'historique du fichier sur un appareil précis au cours des six derniers mois" }
    - id: renamed
      text: { en: "List every name that the file used in the organization", fr: "Lister tous les noms utilisés par le fichier dans l'organisation" }
    - id: mitre
      text: { en: "Review the file's activities mapped to MITRE ATT&CK techniques", fr: "Consulter les activités du fichier associées aux techniques MITRE ATT&CK" }
    - id: related
      text: { en: "List the incidents in which the file appears", fr: "Lister les incidents dans lesquels le fichier apparaît" }
answer:
  mapping: { history: observed, renamed: names, mitre: content, related: incidents }
explanation:
  correct:
    en: Observed in organization lists the devices where the file was detected, with up to six months of history per device. File names lists the names observed in the organization. File content and capabilities, shown when Microsoft analyzed the file, maps its activities to MITRE ATT&CK techniques. Incidents and alerts lists the incidents and alerts linked to the file.
    fr: Observed in organization liste les appareils où le fichier a été détecté, avec jusqu'à six mois d'historique par appareil. File names liste les noms observés dans l'organisation. File content and capabilities, affiché quand Microsoft a analysé le fichier, associe ses activités aux techniques MITRE ATT&CK. Incidents and alerts liste les incidents et alertes liés au fichier.
  options:
    deep: { en: "Deep analysis runs the file in a sandbox and reports behaviors and observables, not the organization's history.", fr: "Deep analysis exécute le fichier dans un bac à sable et rend compte de comportements et d'observables, pas de l'historique dans l'organisation." }
    hunt: { en: "Go hunt opens advanced hunting queries on the file.", fr: "Go hunt ouvre des requêtes de repérage avancé sur le fichier." }
references:
  - title: Investigate Microsoft Defender for Endpoint files
    url: https://learn.microsoft.com/en-us/defender-endpoint/investigate-files
