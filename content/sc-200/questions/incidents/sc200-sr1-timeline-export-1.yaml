id: sc200-sr1-timeline-export-1
objective: "2.2.1"
type: series_yesno
series: sc200-sr1-timeline-export
seriesOrder: 1
difficulty: 2
status: draft
stem:
  en: You export the default 30-day timeline view and flag the key events.
  fr: Vous exportez la vue par défaut de 30 jours de la chronologie et marquez les événements clés d'un indicateur.
body:
  solution:
    en: |
      On the **Timeline** tab of DEV-FIN-07, you keep the default time range of the past 30 days and select **Export**. You then select the flag icon of each key event.
    fr: |
      Dans l'onglet **Timeline** de DEV-FIN-07, vous conservez la plage de temps par défaut des 30 derniers jours et sélectionnez **Export**. Vous sélectionnez ensuite l'icône de drapeau de chaque événement clé.
answer: { value: false }
explanation:
  correct:
    en: |
      Flagging the key events meets the second requirement, because analysts can apply the **Flagged events** filter. However, a timeline export covers the current date or a date range of up to seven days, so the default 30-day view cannot be exported. You must set a custom range that covers November 9 to November 12.
    fr: |
      Marquer les événements clés d'un indicateur répond à la deuxième exigence, car les analystes peuvent appliquer le filtre **Flagged events**. Cependant, une exportation de la chronologie couvre la date du jour ou une plage de dates de sept jours au maximum : la vue par défaut de 30 jours ne peut pas être exportée. Vous devez définir une plage personnalisée qui couvre la période du 9 au 12 novembre.
references:
  - title: Investigate devices in Microsoft Defender for Endpoint
    url: https://learn.microsoft.com/en-us/defender-endpoint/investigate-machines
