id: sc200-2d-graph-cost-filter
objective: "2.3.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove Bank has 80,000 users and Microsoft Entra ID P2 licenses. A diagnostic setting sends the Microsoft Graph activity logs to a Microsoft Sentinel workspace named LAW-WB. The ingestion costs of the MicrosoftGraphActivityLogs table are higher than planned.

    The SOC only investigates the requests made by applications that authenticate as service principals. The rows of the requests made by users must not be stored in LAW-WB. The other rows must remain available for analytics rules.

    What should you do?
  fr: |
    Woodgrove Bank compte 80 000 utilisateurs et dispose de licences Microsoft Entra ID P2. Un paramètre de diagnostic envoie les journaux d'activité Microsoft Graph vers un espace de travail Microsoft Sentinel nommé LAW-WB. Les coûts d'ingestion de la table MicrosoftGraphActivityLogs sont plus élevés que prévu.

    Le SOC n'examine que les requêtes effectuées par des applications qui s'authentifient en tant que principaux de service. Les lignes des requêtes effectuées par des utilisateurs ne doivent pas être stockées dans LAW-WB. Les autres lignes doivent rester disponibles pour les règles d'analyse.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Edit the diagnostic setting to collect only the service principal requests.", fr: "Modifier le paramètre de diagnostic pour ne collecter que les requêtes des principaux de service." } }
    - { id: b, text: { en: "Change the MicrosoftGraphActivityLogs table plan to Basic.", fr: "Passer le plan de la table MicrosoftGraphActivityLogs à Basic." } }
    - { id: c, text: { en: "Create a workspace transformation that drops the rows of user requests.", fr: "Créer une transformation d'espace de travail qui supprime les lignes des requêtes d'utilisateurs." } }
    - { id: d, text: { en: "Create a summary rule that copies the service principal requests to a new table.", fr: "Créer une règle de synthèse qui copie les requêtes des principaux de service dans une nouvelle table." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Diagnostic settings cannot filter Microsoft Graph activity log events. A workspace transformation on the MicrosoftGraphActivityLogs table can omit the rows of user requests before they are stored, which reduces ingestion costs while keeping the other rows in the Analytics plan for analytics rules.
    fr: |
      Les paramètres de diagnostic ne peuvent pas filtrer les événements des journaux d'activité Microsoft Graph. Une transformation d'espace de travail sur la table MicrosoftGraphActivityLogs peut omettre les lignes des requêtes d'utilisateurs avant leur stockage, ce qui réduit les coûts d'ingestion tout en gardant les autres lignes dans le plan Analytics pour les règles d'analyse.
  options:
    a: { en: "Diagnostic settings cannot filter the events of the Microsoft Graph activity logs category.", fr: "Les paramètres de diagnostic ne peuvent pas filtrer les événements de la catégorie des journaux d'activité Microsoft Graph." }
    b: { en: "The Basic plan lowers costs but still stores the user rows and reduces the capabilities available to analytics rules.", fr: "Le plan Basic réduit les coûts mais stocke toujours les lignes d'utilisateurs et réduit les capacités disponibles pour les règles d'analyse." }
    d: { en: "A summary rule aggregates data that has already been ingested; the user rows would still be stored and billed.", fr: "Une règle de synthèse agrège des données déjà ingérées : les lignes d'utilisateurs seraient toujours stockées et facturées." }
references:
  - title: Access Microsoft Graph activity logs for tenant monitoring
    url: https://learn.microsoft.com/en-us/graph/microsoft-graph-activity-logs-overview
