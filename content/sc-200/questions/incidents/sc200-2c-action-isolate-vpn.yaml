id: sc200-2c-action-isolate-vpn
objective: "2.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Adatum's remote employees use Windows 11 laptops onboarded to Microsoft Defender for Endpoint. The laptops connect through a VPN client configured in full-tunnel mode.

    During a test, an isolated laptop stopped reporting to Defender for Endpoint, and you couldn't release it from the portal until the user came to the office.

    You need to ensure that laptops isolated while on the VPN keep communicating with the Defender for Endpoint service.

    What should you do?
  fr: |
    Les employés à distance d'Adatum utilisent des ordinateurs portables Windows 11 intégrés à Microsoft Defender pour point de terminaison. Les portables se connectent par un client VPN configuré en mode tunnel complet.

    Lors d'un test, un portable isolé a cessé de remonter des données à Defender pour point de terminaison, et vous n'avez pas pu le libérer depuis le portail avant que l'utilisateur vienne au bureau.

    Les portables isolés pendant qu'ils sont sur le VPN doivent continuer à communiquer avec le service Defender pour point de terminaison.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Use selective isolation that allows Outlook and Microsoft Teams", fr: "Utiliser l'isolation sélective qui autorise Outlook et Microsoft Teams" }
    - id: b
      text: { en: "Contain the laptops instead of isolating them", fr: "Confiner les portables au lieu de les isoler" }
    - id: c
      text: { en: "Configure split tunneling for the Defender for Endpoint and Defender Antivirus cloud protection traffic", fr: "Configurer le split tunneling pour le trafic de Defender pour point de terminaison et de la protection cloud de l'Antivirus Defender" }
    - id: d
      text: { en: "Restrict app execution on the laptops before you isolate them", fr: "Restreindre l'exécution des applications sur les portables avant de les isoler" }
answer: { optionId: c }
explanation:
  correct:
    en: A device behind a full-tunnel VPN can't reach the Defender for Endpoint cloud service after it is isolated. Microsoft recommends split tunneling for the Defender for Endpoint and Defender Antivirus cloud-based protection traffic so that isolated devices keep reporting and can be released.
    fr: Un appareil derrière un VPN en tunnel complet ne peut plus joindre le service cloud de Defender pour point de terminaison une fois isolé. Microsoft recommande le split tunneling pour le trafic de Defender pour point de terminaison et de la protection cloud de l'Antivirus Defender, afin que les appareils isolés continuent à remonter des données et puissent être libérés.
  options:
    a:
      en: Allowing Outlook and Teams doesn't change how the full tunnel routes the traffic to the Defender service.
      fr: Autoriser Outlook et Teams ne change pas la façon dont le tunnel complet achemine le trafic vers le service Defender.
    b:
      en: Containment is meant for unmanaged devices; it is enforced by the other onboarded devices and doesn't stop the laptops from reaching the internet.
      fr: Le confinement est prévu pour les appareils non gérés ; il est appliqué par les autres appareils intégrés et n'empêche pas les portables d'atteindre Internet.
    d:
      en: Restricting app execution limits which files run; it has no effect on the VPN routing of an isolated device.
      fr: Restreindre l'exécution des applications limite les fichiers qui s'exécutent ; cela n'a aucun effet sur le routage VPN d'un appareil isolé.
references:
  - title: Take response actions on a device in Microsoft Defender for Endpoint
    url: https://learn.microsoft.com/en-us/defender-endpoint/respond-machine-alerts
