id: sc200-2d-graph-kql-writes
objective: "2.3.3"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    Contoso, Ltd. streams the Microsoft Graph activity logs to a Microsoft Sentinel workspace. The account of a user whose object ID is 7f3c2a10-5d8e-4b8e-9c55-1d2e3f4a5b6c was compromised last week.

    You need a query that counts the requests that this user sent to create, update or delete objects through Microsoft Graph during the last seven days, by application and IP address.

    How should you complete the query? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso, Ltd. diffuse les journaux d'activité Microsoft Graph vers un espace de travail Microsoft Sentinel. Le compte d'un utilisateur dont l'ID d'objet est 7f3c2a10-5d8e-4b8e-9c55-1d2e3f4a5b6c a été compromis la semaine dernière.

    Vous avez besoin d'une requête qui compte les requêtes envoyées par cet utilisateur pour créer, modifier ou supprimer des objets par Microsoft Graph au cours des sept derniers jours, par application et par adresse IP.

    Comment devez-vous compléter la requête ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: kusto
  template: |
    MicrosoftGraphActivityLogs
    | where TimeGenerated > ago(7d)
    | where [[col]] == "7f3c2a10-5d8e-4b8e-9c55-1d2e3f4a5b6c"
    | where RequestMethod in ([[methods]])
    | [[op]] Calls = count() by AppId, IPAddress
  slots:
    - id: col
      options:
        - { id: userid, text: UserId }
        - { id: spid, text: ServicePrincipalId }
        - { id: appid, text: AppId }
        - { id: signin, text: SignInActivityId }
    - id: methods
      options:
        - { id: writes, text: "\"POST\", \"PATCH\", \"DELETE\"" }
        - { id: reads, text: "\"GET\", \"HEAD\"" }
        - { id: getpost, text: "\"GET\", \"POST\"" }
    - id: op
      options:
        - { id: summarize, text: summarize }
        - { id: extend, text: extend }
        - { id: project, text: project }
        - { id: top, text: top }
answer:
  values: { col: userid, methods: writes, op: summarize }
explanation:
  correct:
    en: |
      UserId identifies the user who made the request. In the Microsoft Graph REST API, POST creates, PATCH updates and DELETE deletes objects, while GET only reads. The summarize operator with count() and a by clause returns one row per application and IP address with the number of calls.
    fr: |
      UserId identifie l'utilisateur qui a effectué la requête. Dans l'API REST Microsoft Graph, POST crée, PATCH modifie et DELETE supprime des objets, alors que GET ne fait que lire. L'opérateur summarize avec count() et une clause by renvoie une ligne par application et par adresse IP avec le nombre d'appels.
  options:
    spid: { en: "ServicePrincipalId identifies the service principal of an app that calls with its own identity, not the user.", fr: "ServicePrincipalId identifie le principal de service d'une application qui appelle avec sa propre identité, pas l'utilisateur." }
    signin: { en: "SignInActivityId identifies the sign-in that issued the token; it is used to join with the sign-in logs.", fr: "SignInActivityId identifie la connexion qui a émis le jeton ; il sert à la jointure avec les journaux de connexion." }
    extend: { en: "extend adds a column to each row; it does not aggregate with count() by groups.", fr: "extend ajoute une colonne à chaque ligne ; il n'agrège pas avec count() par groupes." }
references:
  - title: Access Microsoft Graph activity logs for tenant monitoring
    url: https://learn.microsoft.com/en-us/graph/microsoft-graph-activity-logs-overview
