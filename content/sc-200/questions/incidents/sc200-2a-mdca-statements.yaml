id: sc200-2a-mdca-statements
objective: "2.1.4"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Proseware, Inc. uses Microsoft Defender for Cloud Apps with the Microsoft 365 app connector. The SOC investigates anomaly detection alerts and applies governance actions.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware, Inc. utilise Microsoft Defender pour les applications cloud avec le connecteur d'application Microsoft 365. Le SOC examine les alertes de détection d'anomalies et applique des actions de gouvernance.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: The Require user to sign in again action revokes the refresh tokens and session cookies issued to applications for the user.
        fr: L'action Require user to sign in again révoque les jetons d'actualisation et les cookies de session émis aux applications pour l'utilisateur.
    - id: s2
      text:
        en: For a new user, Impossible travel alerts aren't triggered for new locations during an initial learning period of seven days.
        fr: Pour un nouvel utilisateur, les alertes Impossible travel ne sont pas déclenchées pour de nouveaux emplacements pendant une période d'apprentissage initiale de sept jours.
    - id: s3
      text:
        en: The Governance log records only the governance actions that analysts apply manually.
        fr: Le journal de gouvernance n'enregistre que les actions de gouvernance appliquées manuellement par les analystes.
answer:
  values: { s1: true, s2: true, s3: false }
explanation:
  correct:
    en: |
      Require user to sign in again revokes all refresh tokens and session cookies issued to applications, which forces the user to sign in to all applications again. Establishing a new user's activity pattern requires an initial learning period of seven days, during which Impossible travel alerts aren't triggered for new locations. The Governance log records both manual and automatic governance tasks.
    fr: |
      Require user to sign in again révoque tous les jetons d'actualisation et les cookies de session émis aux applications, ce qui oblige l'utilisateur à se reconnecter à toutes les applications. L'établissement du modèle d'activité d'un nouvel utilisateur exige une période d'apprentissage initiale de sept jours, pendant laquelle les alertes Impossible travel ne sont pas déclenchées pour de nouveaux emplacements. Le journal de gouvernance enregistre les tâches de gouvernance manuelles comme automatiques.
references:
  - title: Governing connected apps
    url: https://learn.microsoft.com/en-us/defender-cloud-apps/governance-actions
  - title: How to investigate anomaly detection alerts
    url: https://learn.microsoft.com/en-us/defender-cloud-apps/investigate-anomaly-alerts
