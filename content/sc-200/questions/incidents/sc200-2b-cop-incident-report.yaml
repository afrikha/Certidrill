id: sc200-2b-cop-incident-report
objective: "2.1.8"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Adatum has provisioned access to Microsoft Security Copilot. An analyst is still working on an incident in the Microsoft Defender portal. Analysts isolated two devices, disabled a user and soft-deleted phishing emails, and a Microsoft Sentinel playbook ran.

    The analyst selects **Generate incident report**, but the report lists only some of these actions. Management needs a report that includes all the actions taken.

    What should the analyst do?
  fr: |
    Adatum dispose d'un accès provisionné à Microsoft Security Copilot. Un analyste travaille encore sur un incident dans le portail Microsoft Defender. Les analystes ont isolé deux appareils, désactivé un utilisateur et supprimé de manière réversible des e-mails d'hameçonnage, et un playbook Microsoft Sentinel s'est exécuté.

    L'analyste sélectionne **Generate incident report**, mais le rapport ne liste que certaines de ces actions. La direction a besoin d'un rapport qui inclut toutes les actions effectuées.

    Que doit faire l'analyste ?
body:
  options:
    - id: a
      text: { en: "Select Export incident as PDF on the report card.", fr: "Sélectionner Export incident as PDF sur la carte du rapport." }
    - id: b
      text: { en: "Select Post to activity log on the report card, and then regenerate the report.", fr: "Sélectionner Post to activity log sur la carte du rapport, puis régénérer le rapport." }
    - id: c
      text: { en: "Resolve the incident, and then regenerate the report.", fr: "Résoudre l'incident, puis régénérer le rapport." }
    - id: d
      text: { en: "Generate the report again from the Security Copilot standalone portal.", fr: "Générer à nouveau le rapport depuis le portail autonome de Security Copilot." }
answer: { optionId: c }
explanation:
  correct:
    en: |
      If the incident isn't resolved, the incident report may show only some of the actions, so Microsoft recommends resolving the incident before generating the report. The report then lists the main timestamps, the analysts involved, the classification, the investigation and remediation actions and the Sentinel playbooks that ran.
    fr: |
      Si l'incident n'est pas résolu, le rapport d'incident peut n'afficher qu'une partie des actions : Microsoft recommande donc de résoudre l'incident avant de générer le rapport. Le rapport liste alors les principaux horodatages, les analystes impliqués, la classification, les actions d'investigation et de correction et les playbooks Sentinel exécutés.
  options:
    a: { en: "The PDF export packages the same Copilot content; it doesn't add the missing actions.", fr: "L'export PDF reprend le même contenu Copilot ; il n'ajoute pas les actions manquantes." }
    b: { en: "Post to activity log saves the report on the incident page; it doesn't make the report complete.", fr: "Post to activity log enregistre le rapport sur la page de l'incident ; il ne rend pas le rapport complet." }
    d: { en: "The standalone portal uses the same Defender data; the incident still isn't resolved.", fr: "Le portail autonome utilise les mêmes données Defender ; l'incident n'est toujours pas résolu." }
references:
  - title: Create an incident report with Microsoft Copilot in Microsoft Defender
    url: https://learn.microsoft.com/en-us/defender-xdr/security-copilot-m365d-create-incident-report
