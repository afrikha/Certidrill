id: sc200-2c-case-hunt-tracking
objective: "2.1.10"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Proseware connected its Microsoft Sentinel workspace to the Microsoft Defender portal. The threat hunting team runs a weekly hunt that isn't tied to any single incident.

    For each hunt, the team needs one work item with an owner, a due date, tasks, rich text comments that contain KQL queries, attachments, and status values that match its own workflow. The team must not use third-party tools.

    What should the team use?
  fr: |
    Proseware a connecté son espace de travail Microsoft Sentinel au portail Microsoft Defender. L'équipe de chasse aux menaces mène chaque semaine une chasse qui n'est liée à aucun incident en particulier.

    Pour chaque chasse, l'équipe a besoin d'un élément de travail avec un propriétaire, une échéance, des tâches, des commentaires en texte enrichi contenant des requêtes KQL, des pièces jointes et des valeurs d'état adaptées à son propre flux de travail. L'équipe ne doit pas utiliser d'outils tiers.

    Que doit utiliser l'équipe ?
body:
  options:
    - id: a
      text: { en: "A Microsoft Sentinel workbook for each hunt", fr: "Un classeur Microsoft Sentinel pour chaque chasse" }
    - id: b
      text: { en: "A tag on each incident that the hunt finds", fr: "Une balise sur chaque incident trouvé par la chasse" }
    - id: c
      text: { en: "A Microsoft Sentinel watchlist for each hunt", fr: "Une watchlist Microsoft Sentinel pour chaque chasse" }
    - id: d
      text: { en: "A case in the Microsoft Defender portal for each hunt", fr: "Un cas dans le portail Microsoft Defender pour chaque chasse" }
answer: { optionId: d }
explanation:
  correct:
    en: Cases track SOC work that isn't limited to one incident, such as threat hunts. A case has an owner, a due date, tasks, rich text comments, attachments and statuses that admins can customize, natively in the Defender portal.
    fr: Les cas suivent le travail du SOC qui ne se limite pas à un incident, comme les chasses aux menaces. Un cas a un propriétaire, une échéance, des tâches, des commentaires en texte enrichi, des pièces jointes et des états que les administrateurs peuvent personnaliser, nativement dans le portail Defender.
  options:
    a:
      en: A workbook visualizes data; it has no owner, tasks or status workflow.
      fr: Un classeur visualise des données ; il n'a ni propriétaire, ni tâches, ni flux d'états.
    b:
      en: Tags label incidents, but the hunt isn't an incident and needs tasks, comments and statuses of its own.
      fr: Les balises étiquettent des incidents, mais la chasse n'est pas un incident et a besoin de ses propres tâches, commentaires et états.
    c:
      en: A watchlist is a reference list used in queries; it doesn't track work.
      fr: Une watchlist est une liste de référence utilisée dans les requêtes ; elle ne suit pas le travail.
references:
  - title: Manage security operations cases natively in the Microsoft Defender portal
    url: https://learn.microsoft.com/en-us/unified-secops/cases-overview
