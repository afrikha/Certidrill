id: sc200-2c-action-lr-library
objective: "2.2.2"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Your user account has the Advanced live response permission. The live response library of your tenant contains a tool named **collector.exe** and a signed PowerShell script named **Get-Artifacts.ps1**. You have a live response session on a Windows Server 2022 server named **SRV-WEB-03**.

    You need to perform the following tasks in the session:

    - Copy collector.exe to SRV-WEB-03.
    - Run Get-Artifacts.ps1 on SRV-WEB-03.
    - Save the list of running processes in a file named processes.txt.

    How should you complete the commands? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Votre compte d'utilisateur dispose de l'autorisation Advanced live response. La bibliothèque de réponse dynamique de votre locataire contient un outil nommé **collector.exe** et un script PowerShell signé nommé **Get-Artifacts.ps1**. Vous avez une session de réponse dynamique sur un serveur Windows Server 2022 nommé **SRV-WEB-03**.

    Vous devez effectuer les tâches suivantes dans la session :

    - Copier collector.exe sur SRV-WEB-03.
    - Exécuter Get-Artifacts.ps1 sur SRV-WEB-03.
    - Enregistrer la liste des processus en cours d'exécution dans un fichier nommé processes.txt.

    Comment devez-vous compléter les commandes ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: text
  template: |
    library
    [[c1]] collector.exe
    [[c2]] Get-Artifacts.ps1
    processes [[c3]] processes.txt
  slots:
    - id: c1
      options:
        - { id: putfile, text: putfile }
        - { id: getfile, text: getfile }
        - { id: fileinfo, text: fileinfo }
        - { id: analyze, text: analyze }
    - id: c2
      options:
        - { id: run, text: run }
        - { id: putfile, text: putfile }
        - { id: connect, text: connect }
        - { id: remediate, text: remediate }
    - id: c3
      options:
        - { id: gt, text: ">" }
        - { id: amp, text: "&" }
        - { id: pipe, text: "|" }
        - { id: output, text: "-output" }
answer:
  values: { c1: putfile, c2: run, c3: gt }
explanation:
  correct:
    en: "`putfile` puts a file from the library onto the device (in a working folder, deleted at restart by default). `run` runs a PowerShell script from the library. `processes > processes.txt` pipes the command output to a file instead of the console."
    fr: "`putfile` place un fichier de la bibliothèque sur l'appareil (dans un dossier de travail, supprimé au redémarrage par défaut). `run` exécute un script PowerShell de la bibliothèque. `processes > processes.txt` redirige la sortie de la commande vers un fichier au lieu de la console."
  options:
    getfile: { en: "getfile downloads a file from the device to your computer, the opposite direction.", fr: "getfile télécharge un fichier de l'appareil vers votre ordinateur, dans le sens inverse." }
    analyze: { en: "analyze submits an entity to incrimination engines for a verdict; it doesn't copy files.", fr: "analyze soumet une entité aux moteurs d'incrimination pour obtenir un verdict ; il ne copie pas de fichiers." }
    remediate: { en: "remediate removes or stops an entity such as a file, process or service; it doesn't run scripts.", fr: "remediate supprime ou arrête une entité comme un fichier, un processus ou un service ; il n'exécute pas de scripts." }
    amp: { en: "& runs a command in the background; it doesn't write its output to a file.", fr: "& exécute une commande en arrière-plan ; il n'écrit pas sa sortie dans un fichier." }
    output: { en: "-output selects the format (json or table), not a destination file.", fr: "-output choisit le format (json ou table), pas un fichier de destination." }
references:
  - title: Investigate entities on devices using live response in Microsoft Defender for Endpoint
    url: https://learn.microsoft.com/en-us/defender-endpoint/live-response
