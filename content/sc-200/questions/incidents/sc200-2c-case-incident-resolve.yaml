id: sc200-2c-case-incident-resolve
objective: "2.1.10"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Tailspin Toys uses case management in the Microsoft Defender portal and works incidents from the incident page (incident cases aren't used). Case 1205, assigned to the SOC lead Mia, tracks a ransomware response and links incident 7731.

    Incident 7731 has no owner. Its eight alerts are assigned to different analysts. The SOC decides that a Microsoft Entra group named **SOC-Tier2** must own the incident.

    You open incident 7731, select **Assign to**, select SOC-Tier2, and save.

    What is the result?
  fr: |
    Tailspin Toys utilise la gestion des cas du portail Microsoft Defender et traite les incidents depuis la page de l'incident (les cas d'incident ne sont pas utilisés). Le cas 1205, attribué à la responsable du SOC Mia, suit une réponse à un rançongiciel et lie l'incident 7731.

    L'incident 7731 n'a pas de propriétaire. Ses huit alertes sont attribuées à différents analystes. Le SOC décide qu'un groupe Microsoft Entra nommé **SOC-Tier2** doit être propriétaire de l'incident.

    Vous ouvrez l'incident 7731, sélectionnez **Assign to**, sélectionnez SOC-Tier2 et enregistrez.

    Quel est le résultat ?
body:
  options:
    - id: a
      text: { en: "SOC-Tier2 owns the incident, and the eight alerts keep their current owners.", fr: "SOC-Tier2 est propriétaire de l'incident, et les huit alertes conservent leurs propriétaires actuels." }
    - id: b
      text: { en: "SOC-Tier2 owns the incident and its eight alerts, and Mia stays assigned to case 1205.", fr: "SOC-Tier2 est propriétaire de l'incident et de ses huit alertes, et Mia reste attribuée au cas 1205." }
    - id: c
      text: { en: "SOC-Tier2 owns the incident and its eight alerts, and case 1205 is reassigned to SOC-Tier2.", fr: "SOC-Tier2 est propriétaire de l'incident et de ses huit alertes, et le cas 1205 est réattribué à SOC-Tier2." }
    - id: d
      text: { en: "The assignment fails, because an incident linked to a case can be assigned only to a user.", fr: "L'attribution échoue, car un incident lié à un cas ne peut être attribué qu'à un utilisateur." }
answer: { optionId: b }
explanation:
  correct:
    en: |
      On the incident page, an incident can be assigned to one user or group account, and assigning ownership of an incident gives the same owner to all its alerts. A case is a separate work item: its Assigned to field takes a single user of the tenant, so the case keeps Mia as its owner.
    fr: |
      Sur la page de l'incident, un incident peut être attribué à un compte d'utilisateur ou de groupe, et attribuer la propriété d'un incident donne le même propriétaire à toutes ses alertes. Un cas est un élément de travail distinct : son champ Assigned to accepte un seul utilisateur du locataire, si bien que le cas garde Mia comme propriétaire.
  options:
    a:
      en: Assigning an incident assigns the same ownership to all the alerts associated with it; the alerts don't keep their previous owners.
      fr: Attribuer un incident attribue la même propriété à toutes les alertes qui lui sont associées ; les alertes ne gardent pas leurs propriétaires précédents.
    c:
      en: A case is assigned to a single user of the tenant, not to a group, and assigning a linked incident doesn't change the case owner.
      fr: Un cas est attribué à un seul utilisateur du locataire, pas à un groupe, et attribuer un incident lié ne change pas le propriétaire du cas.
    d:
      en: An incident accepts one user or one group account as its owner; linking it to a case doesn't change this.
      fr: Un incident accepte un compte d'utilisateur ou un compte de groupe comme propriétaire ; le lier à un cas ne change rien à cela.
references:
