id: sc200-2c-case-incident-resolve
objective: "2.1.10"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Tailspin Toys manages incidents by using incident cases (preview) in the Microsoft Defender portal. Incident 7731 has eight related alerts. Three of them still have the status New.

    After remediation, you open **Manage case** for the incident case of incident 7731, change its status to the resolved status your organization uses, set the classification, and select **Save**.

    What is the result?
  fr: |
    Tailspin Toys gère les incidents à l'aide des cas d'incident (préversion) dans le portail Microsoft Defender. L'incident 7731 a huit alertes associées. Trois d'entre elles ont encore l'état New.

    Après la correction, vous ouvrez **Manage case** pour le cas d'incident de l'incident 7731, vous passez son état à l'état résolu utilisé par votre organisation, vous définissez la classification et vous sélectionnez **Save**.

    Quel est le résultat ?
body:
  options:
    - id: a
      text: { en: "The incident is resolved, and all eight related alerts are resolved automatically.", fr: "L'incident est résolu, et les huit alertes associées sont résolues automatiquement." }
    - id: b
      text: { en: "The incident is resolved, and the related alerts keep their own status.", fr: "L'incident est résolu, et les alertes associées conservent leur propre état." }
    - id: c
      text: { en: "The incident stays active until you resolve the three alerts that have the status New.", fr: "L'incident reste actif jusqu'à ce que vous résolviez les trois alertes à l'état New." }
    - id: d
      text: { en: "The incident case is resolved, and the status of the incident doesn't change.", fr: "Le cas d'incident est résolu, et l'état de l'incident ne change pas." }
answer: { optionId: b }
explanation:
  correct:
    en: The status change of an incident case syncs to the related incident, and the classification is stored on both. The related alerts keep their own status and aren't resolved automatically when the case is resolved or closed.
    fr: Le changement d'état d'un cas d'incident se synchronise vers l'incident associé, et la classification est stockée sur les deux. Les alertes associées conservent leur propre état et ne sont pas résolues automatiquement quand le cas est résolu ou fermé.
  options:
    a:
      en: Resolving the related alerts automatically is the behavior of the legacy incident page, not of incident cases.
      fr: La résolution automatique des alertes associées est le comportement de l'ancienne page d'incident, pas celui des cas d'incident.
    c:
      en: Open alerts don't block the resolution; the status of the case syncs to the incident.
      fr: Les alertes ouvertes ne bloquent pas la résolution ; l'état du cas se synchronise vers l'incident.
    d:
      en: Assignment, status, severity and resolution changes of the incident case sync to the related incident.
      fr: Les changements d'attribution, d'état, de gravité et de résolution du cas d'incident se synchronisent vers l'incident associé.
references:
  - title: Manage incident cases in the Microsoft Defender portal (preview)
    url: https://learn.microsoft.com/en-us/defender-xdr/manage-incident-cases
