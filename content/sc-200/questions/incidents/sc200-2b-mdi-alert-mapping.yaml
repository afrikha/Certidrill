id: sc200-2b-mdi-alert-mapping
objective: "2.1.6"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Litware uses Microsoft Defender for Identity with classic alerts. During a review of recent activity, the SOC describes four suspicious behaviors observed in the on-premises Active Directory environment.

    Which classic alert should Defender for Identity raise for each behavior? To answer, drag the appropriate alerts to the correct behaviors. Each alert may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware utilise Microsoft Defender pour Identity avec les alertes classiques. Lors d'un examen de l'activité récente, le SOC décrit quatre comportements suspects observés dans l'environnement Active Directory local.

    Quelle alerte classique Defender pour Identity doit-il générer pour chaque comportement ? Pour répondre, faites glisser les alertes appropriées vers les comportements correspondants. Chaque alerte peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: ptt, text: Suspected identity theft (pass-the-ticket) }
    - { id: pth, text: Suspected identity theft (pass-the-hash) }
    - { id: rce, text: Remote code execution attempt }
    - { id: dcshadow, text: Suspected DCShadow attack (domain controller promotion) }
    - { id: dcsync, text: Suspected DCSync attack (replication of directory services) }
    - { id: golden, text: Suspected Golden Ticket usage (time anomaly) }
  targets:
    - id: t1
      text: { en: "The same Kerberos ticket of a user is used from two different computers.", fr: "Le même ticket Kerberos d'un utilisateur est utilisé depuis deux ordinateurs différents." }
    - id: t2
      text: { en: "An NTLM hash obtained on one workstation is used to access another computer.", fr: "Un hachage NTLM obtenu sur un poste de travail est utilisé pour accéder à un autre ordinateur." }
    - id: t3
      text: { en: "A workstation uses PsExec and remote WMI to run commands on a domain controller.", fr: "Un poste de travail utilise PsExec et WMI à distance pour exécuter des commandes sur un contrôleur de domaine." }
    - id: t4
      text: { en: "A member server tries to register itself as a new domain controller.", fr: "Un serveur membre tente de s'inscrire comme nouveau contrôleur de domaine." }
answer:
  mapping: { t1: ptt, t2: pth, t3: rce, t4: dcshadow }
explanation:
  correct:
    en: |
      Pass-the-ticket is detected when a Kerberos ticket is used on two or more computers, and pass-the-hash when an NTLM hash stolen on one computer is used to access another. PsExec, remote WMI or PowerShell connections to a domain controller trigger Remote code execution attempt. A machine that tries to register as a rogue domain controller triggers Suspected DCShadow attack (domain controller promotion).
    fr: |
      Le pass-the-ticket est détecté lorsqu'un ticket Kerberos est utilisé sur deux ordinateurs ou plus, et le pass-the-hash lorsqu'un hachage NTLM volé sur un ordinateur sert à accéder à un autre. Les connexions PsExec, WMI à distance ou PowerShell vers un contrôleur de domaine déclenchent Remote code execution attempt. Une machine qui tente de s'inscrire comme contrôleur de domaine illégitime déclenche Suspected DCShadow attack (domain controller promotion).
  options:
    dcsync: { en: "DCSync is a replication request sent by a computer that isn't a domain controller; it doesn't register a new domain controller.", fr: "DCSync est une demande de réplication envoyée par un ordinateur qui n'est pas contrôleur de domaine ; il n'inscrit pas de nouveau contrôleur de domaine." }
    golden: { en: "This Golden Ticket alert detects a TGT used beyond its maximum allowed lifetime, not a ticket reused across computers.", fr: "Cette alerte Golden Ticket détecte un TGT utilisé au-delà de sa durée de vie maximale autorisée, pas un ticket réutilisé sur plusieurs ordinateurs." }
references:
  - title: Microsoft Defender for Identity classic alerts
    url: https://learn.microsoft.com/en-us/defender-for-identity/alerts-mdi-classic
