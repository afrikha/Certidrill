id: sc200-2d-graph-xdr-table
objective: "2.3.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam, Inc. uses Microsoft Defender XDR. Fabrikam does not have a Microsoft Sentinel workspace, and no Microsoft Entra diagnostic setting exists.

    An app registration named HRSync might have been abused to read user profiles through Microsoft Graph. You need to use advanced hunting in the Microsoft Defender portal to list the Microsoft Graph requests made by HRSync, with their request URI and response status code.

    Which table should you query?
  fr: |
    Fabrikam, Inc. utilise Microsoft Defender XDR. Fabrikam ne dispose d'aucun espace de travail Microsoft Sentinel, et aucun paramètre de diagnostic Microsoft Entra n'existe.

    Une inscription d'application nommée HRSync a pu être détournée pour lire des profils d'utilisateurs par Microsoft Graph. Vous devez utiliser le repérage avancé du portail Microsoft Defender pour lister les requêtes Microsoft Graph effectuées par HRSync, avec leur URI de requête et leur code d'état de réponse.

    Quelle table devez-vous interroger ?
body:
  options:
    - { id: a, text: MicrosoftGraphActivityLogs }
    - { id: b, text: GraphAPIAuditEvents }
    - { id: c, text: IdentityLogonEvents }
    - { id: d, text: CloudAppEvents }
answer: { optionId: b }
explanation:
  correct:
    en: |
      In Defender XDR advanced hunting, the GraphAPIAuditEvents table contains the Microsoft Entra ID API requests made to Microsoft Graph for resources in the tenant, with columns such as ApplicationId, RequestUri, RequestMethod and ResponseStatusCode.
    fr: |
      Dans le repérage avancé de Defender XDR, la table GraphAPIAuditEvents contient les requêtes d'API Microsoft Entra ID adressées à Microsoft Graph pour les ressources du locataire, avec des colonnes comme ApplicationId, RequestUri, RequestMethod et ResponseStatusCode.
  options:
    a: { en: "MicrosoftGraphActivityLogs exists only in a Log Analytics workspace that receives the logs from a diagnostic setting, which Fabrikam does not have.", fr: "MicrosoftGraphActivityLogs n'existe que dans un espace de travail Log Analytics qui reçoit les journaux d'un paramètre de diagnostic, ce dont Fabrikam ne dispose pas." }
    c: { en: "IdentityLogonEvents contains authentication events, not the API requests sent to Microsoft Graph.", fr: "IdentityLogonEvents contient des événements d'authentification, pas les requêtes d'API envoyées à Microsoft Graph." }
    d: { en: "CloudAppEvents contains activities in cloud apps such as Microsoft 365 services, not the individual HTTP requests sent to Microsoft Graph with their status codes.", fr: "CloudAppEvents contient les activités dans des applications cloud comme les services Microsoft 365, pas les requêtes HTTP individuelles envoyées à Microsoft Graph avec leurs codes d'état." }
references:
  - title: GraphAPIAuditEvents table in the advanced hunting schema
    url: https://learn.microsoft.com/en-us/defender-xdr/advanced-hunting-graphapiauditevents-table
  - title: Access Microsoft Graph activity logs for tenant monitoring
    url: https://learn.microsoft.com/en-us/graph/microsoft-graph-activity-logs-overview
