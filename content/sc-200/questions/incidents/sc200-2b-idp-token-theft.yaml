id: sc200-2b-idp-token-theft
objective: "2.1.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Litware has Microsoft Entra ID P2. A user risk-based Conditional Access policy requires multifactor authentication (MFA) and a secure password change when user risk is **High**. All users are registered for MFA.

    ID Protection raises an **Anomalous token** detection for a user named **User6**. The session that triggered the detection already contains an MFA claim, and User6 has a **High** user risk.

    You need to identify what must happen for the user risk of User6 to become **Remediated**.

    What should you identify?
  fr: |
    Litware dispose de Microsoft Entra ID P2. Une stratégie d'accès conditionnel basée sur le risque utilisateur exige l'authentification multifacteur (MFA) et un changement de mot de passe sécurisé lorsque le risque utilisateur est **High**. Tous les utilisateurs sont inscrits à la MFA.

    ID Protection génère une détection **Anomalous token** pour un utilisateur nommé **User6**. La session qui a déclenché la détection contient déjà une revendication MFA, et User6 a un risque utilisateur **High**.

    Vous devez identifier ce qui doit se produire pour que le risque utilisateur de User6 devienne **Remediated**.

    Que devez-vous identifier ?
body:
  options:
    - id: a
      text: { en: "Nothing: the risk is remediated automatically because the session already has an MFA claim.", fr: "Rien : le risque est corrigé automatiquement, car la session contient déjà une revendication MFA." }
    - id: b
      text: { en: "User6 must perform a secure password change and reauthenticate with MFA.", fr: "User6 doit effectuer un changement de mot de passe sécurisé et se réauthentifier avec la MFA." }
    - id: c
      text: { en: "User6 must sign in again from a familiar device, after which the risk is set to Dismissed.", fr: "User6 doit se reconnecter depuis un appareil connu, après quoi le risque passe à Dismissed." }
    - id: d
      text: { en: "An administrator must select Dismiss user risk, which also revokes the stolen token.", fr: "Un administrateur doit sélectionner Dismiss user risk, ce qui révoque aussi le jeton volé." }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Sessions that carry an MFA claim are no longer auto-remediated when token theft detections such as Anomalous token, Attacker in the Middle or Token issuer anomaly fire. With a user risk-based policy, the user must perform a secure password change and reauthenticate with MFA, which sets the risk state to Remediated.
    fr: |
      Les sessions qui portent une revendication MFA ne sont plus corrigées automatiquement lorsque des détections de vol de jeton comme Anomalous token, Attacker in the Middle ou Token issuer anomaly se déclenchent. Avec une stratégie basée sur le risque utilisateur, l'utilisateur doit effectuer un changement de mot de passe sécurisé et se réauthentifier avec la MFA, ce qui fait passer l'état du risque à Remediated.
  options:
    a: { en: "Token theft detections are explicitly excluded from automatic remediation by an existing MFA claim, because the attacker may hold that token.", fr: "Les détections de vol de jeton sont explicitement exclues de la correction automatique par une revendication MFA existante, car l'attaquant peut détenir ce jeton." }
    c: { en: "A successful sign-in from a familiar location or device dismisses sign-in risk; it doesn't remediate a High user risk raised by token theft.", fr: "Une connexion réussie depuis un emplacement ou un appareil connu ignore le risque de connexion ; elle ne corrige pas un risque utilisateur High dû à un vol de jeton." }
    d: { en: "Dismissing risk sets the state to Dismissed, not Remediated, and it doesn't revoke tokens or change the password.", fr: "Ignorer le risque fait passer l'état à Dismissed, pas Remediated, et ne révoque pas de jetons ni ne change le mot de passe." }
references:
  - title: Remediate risks and unblock users
    url: https://learn.microsoft.com/en-us/entra/id-protection/howto-identity-protection-remediate-unblock
  - title: What are risk detections?
    url: https://learn.microsoft.com/en-us/entra/id-protection/concept-identity-protection-risks
