id: sc200-2c-case-link-incident
objective: "2.1.10"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Northwind Traders uses case management in the Microsoft Defender portal. The incident response team opened incident 5120. A threat hunter owns case 1031, which tracks the same threat actor.

    You need to link incident 5120 to case 1031.

    Which two actions can you perform? Each correct answer presents a complete solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind Traders utilise la gestion des cas du portail Microsoft Defender. L'équipe de réponse aux incidents a ouvert l'incident 5120. Un chasseur de menaces est propriétaire du cas 1031, qui suit le même acteur de menace.

    Vous devez lier l'incident 5120 au cas 1031.

    Quelles sont les deux actions que vous pouvez effectuer ? Chaque bonne réponse constitue une solution complète.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Open incident 5120 in Microsoft Sentinel in the Azure portal and add it to case 1031.", fr: "Ouvrir l'incident 5120 dans Microsoft Sentinel dans le portail Azure et l'ajouter au cas 1031." } }
    - { id: b, text: { en: "Open case 1031 and link incident 5120 from the case.", fr: "Ouvrir le cas 1031 et lier l'incident 5120 depuis le cas." } }
    - { id: c, text: { en: "Add the tag Case-1031 to incident 5120.", fr: "Ajouter la balise Case-1031 à l'incident 5120." } }
    - { id: d, text: { en: "Open the details page of incident 5120 and use the link option of its ellipsis (...) menu.", fr: "Ouvrir la page de détails de l'incident 5120 et utiliser l'option de liaison de son menu de points de suspension (...)." } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: Incidents are linked to a case either from the case itself or from the incident details page in the Defender portal, through the link option of the ellipsis menu. Both create the same link, visible in the case's linked incidents.
    fr: Les incidents se lient à un cas soit depuis le cas lui-même, soit depuis la page de détails de l'incident dans le portail Defender, par l'option de liaison du menu de points de suspension. Les deux créent la même liaison, visible dans les incidents liés du cas.
  options:
    a:
      en: Cases exist only in the Defender portal; the Azure portal has no case management.
      fr: Les cas n'existent que dans le portail Defender ; le portail Azure n'offre pas de gestion des cas.
    c:
      en: A tag only labels the incident; it doesn't create a link between the incident and the case.
      fr: Une balise ne fait qu'étiqueter l'incident ; elle ne crée pas de liaison entre l'incident et le cas.
references:
  - title: Manage security operations cases natively in the Microsoft Defender portal
    url: https://learn.microsoft.com/en-us/unified-secops/cases-overview
