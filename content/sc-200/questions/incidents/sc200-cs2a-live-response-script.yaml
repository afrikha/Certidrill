id: sc200-cs2a-live-response-script
objective: "2.2.2"
type: ordering
caseStudy: sc200-cs2a-fourth-coffee
difficulty: 3
status: draft
stem:
  en: |
    Defender for Identity raises an alert that involves a server named SRV-ERP4. Get-RoastAudit.ps1 is not in the live response library yet. You plan to upload it from the live response console after the session starts.

    You need to meet the investigation requirement for SRV-ERP4. The solution must not reduce the security of the tenant.

    Which five actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Defender pour Identity déclenche une alerte qui concerne un serveur nommé SRV-ERP4. Get-RoastAudit.ps1 ne se trouve pas encore dans la bibliothèque de réponse dynamique. Vous prévoyez de le charger depuis la console de réponse dynamique une fois la session ouverte.

    Vous devez répondre à l'exigence d'investigation pour SRV-ERP4. La solution ne doit pas réduire la sécurité du locataire.

    Quelles cinq actions devez-vous effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste d'actions vers la zone de réponse et classez-les dans l'ordre correct.
body:
  count: 5
  actions:
    - { id: servers, text: { en: "Turn on Live response for servers in the advanced features", fr: "Activer Live response for servers dans les fonctionnalités avancées" } }
    - { id: session, text: { en: "Initiate a live response session on SRV-ERP4", fr: "Lancer une session de réponse dynamique sur SRV-ERP4" } }
    - { id: upload, text: { en: "Upload Get-RoastAudit.ps1 to the library from the console", fr: "Charger Get-RoastAudit.ps1 dans la bibliothèque depuis la console" } }
    - { id: run, text: { en: "Run the run Get-RoastAudit.ps1 command", fr: "Exécuter la commande run Get-RoastAudit.ps1" } }
    - { id: getfile, text: { en: "Run the getfile command on the output file", fr: "Exécuter la commande getfile sur le fichier de sortie" } }
    - { id: unsigned, text: { en: "Turn on Live response unsigned script execution", fr: "Activer Live response unsigned script execution" } }
    - { id: package, text: { en: "Collect an investigation package from SRV-ERP4", fr: "Collecter un package d'investigation sur SRV-ERP4" } }
    - { id: isolate, text: { en: "Isolate SRV-ERP4", fr: "Isoler SRV-ERP4" } }
answer:
  sequence: [servers, session, upload, run, getfile]
explanation:
  correct:
    en: Live response sessions on servers require the Live response for servers advanced feature, which is Off. In the session, a script must be in the library before the run command can execute it, and getfile then downloads the file that the script produced. The script is signed, so unsigned script execution must stay Off.
    fr: |
      Les sessions de réponse dynamique sur des serveurs exigent la fonctionnalité avancée Live response for servers, qui est sur Off. Dans la session, un script doit se trouver dans la bibliothèque pour que la commande run puisse l'exécuter, puis getfile télécharge le fichier produit par le script. Le script est signé : l'exécution de scripts non signés doit rester désactivée.
  options:
    unsigned: { en: "Not needed for a signed script, and enabling it increases exposure to threats.", fr: "Inutile pour un script signé, et l'activer augmente l'exposition aux menaces." }
    package: { en: "An investigation package collects a fixed set of forensic data; it does not run a custom script.", fr: "Un package d'investigation collecte un ensemble fixe de données forensiques ; il n'exécute pas de script personnalisé." }
    isolate: { en: "Isolation is a containment action, not part of running the script; the requirement does not ask for it.", fr: "L'isolement est une action de confinement, il ne fait pas partie de l'exécution du script ; l'exigence ne le demande pas." }
references:
  - title: Investigate entities on devices using live response
    url: https://learn.microsoft.com/en-us/defender-endpoint/live-response
  - title: Take response actions on a device in Microsoft Defender for Endpoint
    url: https://learn.microsoft.com/en-us/defender-endpoint/respond-machine-alerts
