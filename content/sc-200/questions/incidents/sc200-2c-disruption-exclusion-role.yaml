id: sc200-2c-disruption-exclusion-role
objective: "2.2.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Tailspin Toys uses Microsoft Defender for Endpoint and Microsoft Defender for Identity. Microsoft Defender XDR Unified RBAC isn't activated for any workload.

    An engineer named Dana must manage the device and user exclusions of automatic attack disruption.

    You need to assign a Microsoft Entra role to Dana. The solution must follow the principle of least privilege.

    Which role should you assign?
  fr: |
    Tailspin Toys utilise Microsoft Defender pour point de terminaison et Microsoft Defender pour Identity. Le RBAC unifié de Microsoft Defender XDR n'est activé pour aucune charge de travail.

    Une ingénieure nommée Dana doit gérer les exclusions d'appareils et d'utilisateurs de l'interruption automatique d'attaque.

    Vous devez attribuer un rôle Microsoft Entra à Dana. La solution doit respecter le principe du moindre privilège.

    Quel rôle devez-vous attribuer ?
body:
  options:
    - { id: a, text: Security Reader }
    - { id: b, text: Security Operator }
    - { id: c, text: Security Administrator }
    - { id: d, text: Global Administrator }
answer: { optionId: c }
explanation:
  correct:
    en: When Unified RBAC isn't enabled, managing device and identity exclusions requires Security Administrator or Global Administrator. Security Administrator is the least privileged of the two.
    fr: Quand le RBAC unifié n'est pas activé, la gestion des exclusions d'appareils et d'identités exige Security Administrator ou Global Administrator. Security Administrator est le moins privilégié des deux.
  options:
    a:
      en: Security Reader can view exclusions and tags but can't edit them.
      fr: Security Reader peut consulter les exclusions et les balises mais pas les modifier.
    b:
      en: Security Operator is enough only when Unified RBAC is enabled for the workloads, which isn't the case here.
      fr: Security Operator ne suffit que lorsque le RBAC unifié est activé pour les charges de travail, ce qui n'est pas le cas ici.
    d:
      en: Global Administrator works but grants far more privileges than Security Administrator.
      fr: Global Administrator fonctionne mais accorde bien plus de privilèges que Security Administrator.
references:
  - title: Exclude assets from automated response in attack disruption
    url: https://learn.microsoft.com/en-us/defender-xdr/automatic-attack-disruption-exclusions
