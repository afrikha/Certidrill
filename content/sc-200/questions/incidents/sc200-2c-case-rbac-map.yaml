id: sc200-2c-case-rbac-map
objective: "2.1.10"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Litware uses case management in the Microsoft Defender portal. Access is granted through Microsoft Defender Unified RBAC custom roles.

    You need to create three custom roles for the following users. Each role must follow the principle of least privilege.

    Which permission should you include in each role? To answer, drag the appropriate permissions to the correct users. Each permission may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware utilise la gestion des cas du portail Microsoft Defender. L'accès est accordé par des rôles personnalisés du RBAC unifié de Microsoft Defender.

    Vous devez créer trois rôles personnalisés pour les utilisateurs suivants. Chaque rôle doit respecter le principe du moindre privilège.

    Quelle autorisation devez-vous inclure dans chaque rôle ? Pour répondre, faites glisser les autorisations appropriées vers les utilisateurs correspondants. Chaque autorisation peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: basics, text: "Security operations > Security data basics (read)" }
    - { id: alerts, text: "Security operations > Alerts (manage)" }
    - { id: response, text: "Security operations > Response (manage)" }
    - { id: core, text: "Authorization and settings > Core security settings (manage)" }
    - { id: tuning, text: "Authorization and settings > Detection tuning (manage)" }
  targets:
    - id: auditor
      text: { en: "An auditor who reviews the case queue, case tasks, comments and case audit history", fr: "Un auditeur qui consulte la file des cas, les tâches, les commentaires et l'historique d'audit des cas" }
    - id: analyst
      text: { en: "An analyst who creates cases, assigns them and links incidents to them", fr: "Un analyste qui crée des cas, les attribue et y lie des incidents" }
    - id: admin
      text: { en: "A SOC administrator who adds the custom case statuses Research phase and Generating hypothesis", fr: "Un administrateur SOC qui ajoute les états de cas personnalisés Research phase et Generating hypothesis" }
answer:
  mapping: { auditor: basics, analyst: alerts, admin: core }
explanation:
  correct:
    en: Viewing cases, tasks, comments and case audits requires Security data basics (read). Creating and managing cases, assigning them and linking incidents requires Alerts (manage). Customizing the case status options is a setting, which requires Core security settings (manage).
    fr: Consulter les cas, les tâches, les commentaires et les audits de cas exige Security data basics (read). Créer et gérer des cas, les attribuer et lier des incidents exige Alerts (manage). Personnaliser les options d'état des cas est un paramètre, qui exige Core security settings (manage).
  options:
    response:
      en: Response (manage) covers response actions on assets, such as device actions; it isn't listed for case management.
      fr: Response (manage) couvre les actions de réponse sur les ressources, comme les actions sur les appareils ; elle n'est pas citée pour la gestion des cas.
    tuning:
      en: Detection tuning (manage) covers alert tuning and detection settings, not case statuses.
      fr: Detection tuning (manage) couvre le réglage des alertes et les paramètres de détection, pas les états des cas.
references:
  - title: Manage security operations cases natively in the Microsoft Defender portal
    url: https://learn.microsoft.com/en-us/unified-secops/cases-overview
