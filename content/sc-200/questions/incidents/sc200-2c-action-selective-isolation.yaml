id: sc200-2c-action-selective-isolation
objective: "2.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A Windows 11 laptop named **LT-EXEC-01** is onboarded to Microsoft Defender for Endpoint. An alert shows that LT-EXEC-01 is beaconing to a command-and-control server.

    You need to cut LT-EXEC-01 off the network while you investigate. Its user, an executive, must still be able to use Outlook and Microsoft Teams.

    What should you do?
  fr: |
    Un ordinateur portable Windows 11 nommé **LT-EXEC-01** est intégré à Microsoft Defender pour point de terminaison. Une alerte montre que LT-EXEC-01 communique avec un serveur de commande et de contrôle.

    Vous devez couper LT-EXEC-01 du réseau pendant l'investigation. Son utilisateur, un dirigeant, doit pouvoir continuer à utiliser Outlook et Microsoft Teams.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Isolate the device and select full isolation", fr: "Isoler l'appareil en choisissant l'isolation complète" }
    - id: b
      text: { en: "Contain the device from the network", fr: "Confiner l'appareil sur le réseau (Contain device)" }
    - id: c
      text: { en: "Restrict app execution on the device", fr: "Restreindre l'exécution des applications sur l'appareil" }
    - id: d
      text: { en: "Isolate the device and select selective isolation", fr: "Isoler l'appareil en choisissant l'isolation sélective" }
answer: { optionId: d }
explanation:
  correct:
    en: Isolation disconnects the device from the network while it keeps its connection to the Defender for Endpoint service. Selective isolation, available from Windows 10 version 1709, can keep Outlook and Microsoft Teams connectivity.
    fr: L'isolation déconnecte l'appareil du réseau tout en conservant sa connexion au service Defender pour point de terminaison. L'isolation sélective, disponible à partir de Windows 10 version 1709, peut conserver la connectivité d'Outlook et de Microsoft Teams.
  options:
    a:
      en: Full isolation also blocks Outlook and Teams.
      fr: L'isolation complète bloque aussi Outlook et Teams.
    b:
      en: Containment makes the other onboarded devices block the device; it is meant for unmanaged devices and doesn't stop the laptop from reaching the internet.
      fr: Le confinement fait bloquer l'appareil par les autres appareils intégrés ; il est prévu pour les appareils non gérés et n'empêche pas le portable d'atteindre Internet.
    c:
      en: Restricting app execution lets only Microsoft-signed files run; it doesn't cut network communication.
      fr: Restreindre l'exécution des applications n'autorise que les fichiers signés par Microsoft ; cela ne coupe pas les communications réseau.
references:
  - title: Take response actions on a device in Microsoft Defender for Endpoint
    url: https://learn.microsoft.com/en-us/defender-endpoint/respond-machine-alerts
