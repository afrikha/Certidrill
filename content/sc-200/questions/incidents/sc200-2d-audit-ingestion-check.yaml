id: sc200-2d-audit-ingestion-check
objective: "2.3.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Adatum Corporation uses Microsoft 365. Audit log searches in the Microsoft Purview portal return recent Exchange and SharePoint events.

    A colleague connects to Security & Compliance PowerShell, runs `Get-AdminAuditLogConfig | Format-List UnifiedAuditLogIngestionEnabled`, and sees the value `False`. The colleague concludes that auditing is turned off.

    You need to confirm whether audit log search is turned on for the organization without changing the configuration.

    What should you do?
  fr: |
    Adatum Corporation utilise Microsoft 365. Les recherches dans le journal d'audit du portail Microsoft Purview renvoient des événements Exchange et SharePoint récents.

    Un collègue se connecte à Security & Compliance PowerShell, exécute `Get-AdminAuditLogConfig | Format-List UnifiedAuditLogIngestionEnabled` et obtient la valeur `False`. Il en conclut que l'audit est désactivé.

    Vous devez vérifier si la recherche dans le journal d'audit est activée pour l'organisation, sans modifier la configuration.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Run the same command in Exchange Online PowerShell.", fr: "Exécuter la même commande dans Exchange Online PowerShell." } }
    - { id: b, text: { en: "Run Set-AdminAuditLogConfig -UnifiedAuditLogIngestionEnabled $true.", fr: "Exécuter Set-AdminAuditLogConfig -UnifiedAuditLogIngestionEnabled $true." } }
    - { id: c, text: { en: "Run Search-UnifiedAuditLog in Security & Compliance PowerShell.", fr: "Exécuter Search-UnifiedAuditLog dans Security & Compliance PowerShell." } }
    - { id: d, text: { en: "Run Get-UnifiedAuditLogRetentionPolicy in Exchange Online PowerShell.", fr: "Exécuter Get-UnifiedAuditLogRetentionPolicy dans Exchange Online PowerShell." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      The UnifiedAuditLogIngestionEnabled property must be read in Exchange Online PowerShell. In Security & Compliance PowerShell it always shows False, whatever the real setting. In Exchange Online PowerShell, True means that audit log search is turned on.
    fr: |
      La propriété UnifiedAuditLogIngestionEnabled doit être lue dans Exchange Online PowerShell. Dans Security & Compliance PowerShell, elle affiche toujours False, quel que soit le paramètre réel. Dans Exchange Online PowerShell, True signifie que la recherche dans le journal d'audit est activée.
  options:
    b: { en: "Set-AdminAuditLogConfig changes the configuration, which the requirement forbids; auditing is probably already on.", fr: "Set-AdminAuditLogConfig modifie la configuration, ce que l'exigence interdit ; l'audit est probablement déjà activé." }
    c: { en: "Search-UnifiedAuditLog is an Exchange Online cmdlet that searches records; it does not report the ingestion setting.", fr: "Search-UnifiedAuditLog est une applet de commande Exchange Online qui recherche des enregistrements ; elle n'indique pas le paramètre d'ingestion." }
    d: { en: "Get-UnifiedAuditLogRetentionPolicy lists the custom audit log retention policies, not whether auditing is on.", fr: "Get-UnifiedAuditLogRetentionPolicy liste les stratégies personnalisées de rétention des journaux d'audit, pas l'état de l'audit." }
references:
  - title: Search the audit log
    url: https://learn.microsoft.com/en-us/purview/audit-search
