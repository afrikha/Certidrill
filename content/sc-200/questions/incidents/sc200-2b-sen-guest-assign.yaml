id: sc200-2b-sen-guest-assign
objective: "2.1.7"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam uses a managed security service provider (MSSP). An MSSP analyst named **Ext1** is invited to the Fabrikam Microsoft Entra tenant as a guest user.

    Ext1 must investigate Microsoft Sentinel incidents in the workspace **FabWS** and assign incidents to Fabrikam analysts. The solution must follow the principle of least privilege.

    What should you assign to Ext1?
  fr: |
    Fabrikam fait appel à un fournisseur de services de sécurité managés (MSSP). Un analyste du MSSP nommé **Ext1** est invité dans le locataire Microsoft Entra de Fabrikam en tant qu'utilisateur invité.

    Ext1 doit examiner les incidents Microsoft Sentinel de l'espace de travail **FabWS** et attribuer des incidents aux analystes de Fabrikam. La solution doit respecter le principe du moindre privilège.

    Que devez-vous attribuer à Ext1 ?
body:
  options:
    - id: a
      text: { en: "Microsoft Sentinel Responder on FabWS only", fr: "Microsoft Sentinel Responder sur FabWS uniquement" }
    - id: b
      text: { en: "Microsoft Sentinel Reader on FabWS and Directory Readers in Microsoft Entra ID", fr: "Microsoft Sentinel Reader sur FabWS et Directory Readers dans Microsoft Entra ID" }
    - id: c
      text: { en: "Microsoft Sentinel Contributor on FabWS only", fr: "Microsoft Sentinel Contributor sur FabWS uniquement" }
    - id: d
      text: { en: "Microsoft Sentinel Responder on FabWS and Directory Readers in Microsoft Entra ID", fr: "Microsoft Sentinel Responder sur FabWS et Directory Readers dans Microsoft Entra ID" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Investigating and assigning incidents requires Microsoft Sentinel Responder. To assign incidents, a guest user also needs the Directory Readers role in Microsoft Entra ID, which member users have by default, so that the guest can look up the users in the directory.
    fr: |
      L'examen et l'attribution d'incidents exigent Microsoft Sentinel Responder. Pour attribuer des incidents, un utilisateur invité a aussi besoin du rôle Directory Readers dans Microsoft Entra ID, dont les utilisateurs membres disposent par défaut, afin de pouvoir rechercher les utilisateurs de l'annuaire.
  options:
    a: { en: "Without Directory Readers, the guest user can't assign incidents to directory users.", fr: "Sans Directory Readers, l'utilisateur invité ne peut pas attribuer d'incidents aux utilisateurs de l'annuaire." }
    c: { en: "Contributor grants more than needed and still doesn't solve the directory lookup problem of a guest.", fr: "Contributor accorde plus que nécessaire et ne résout toujours pas le problème de recherche dans l'annuaire d'un invité." }
    b: { en: "Microsoft Sentinel Reader can't update incidents, so Ext1 couldn't assign them.", fr: "Microsoft Sentinel Reader ne peut pas mettre à jour les incidents : Ext1 ne pourrait pas les attribuer." }
references:
  - title: Investigate Microsoft Sentinel incidents in depth in the Azure portal
    url: https://learn.microsoft.com/en-us/azure/sentinel/investigate-incidents
