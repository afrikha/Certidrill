id: sc200-2c-action-restrict-app
objective: "2.2.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Litware has the following devices onboarded to Microsoft Defender for Endpoint Plan 2. Microsoft Defender Antivirus is the antivirus on every device.

    | Name | Operating system |
    | --- | --- |
    | DEV1 | Windows 11 |
    | DEV2 | Windows 10 version 1607 |
    | SRV1 | Windows Server 2016 |
    | SRV2 | Windows Server 2022 |

    An attacker drops unsigned tools on several devices. You plan to use the **Restrict app execution** response action so that only Microsoft-signed files can run.

    On which two devices can you use the action?

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware dispose des appareils suivants intégrés à Microsoft Defender pour point de terminaison Plan 2. L'Antivirus Microsoft Defender est l'antivirus de chaque appareil.

    | Nom | Système d'exploitation |
    | --- | --- |
    | DEV1 | Windows 11 |
    | DEV2 | Windows 10 version 1607 |
    | SRV1 | Windows Server 2016 |
    | SRV2 | Windows Server 2022 |

    Un attaquant dépose des outils non signés sur plusieurs appareils. Vous prévoyez d'utiliser l'action de réponse **Restrict app execution** afin que seuls les fichiers signés par Microsoft puissent s'exécuter.

    Sur quels deux appareils pouvez-vous utiliser l'action ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: DEV1 }
    - { id: b, text: DEV2 }
    - { id: c, text: SRV1 }
    - { id: d, text: SRV2 }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: Restrict app execution applies a code integrity policy and requires Microsoft Defender Antivirus on Windows 10 version 1709 or later, Windows 11, or Windows Server 2019 or later. DEV1 (Windows 11) and SRV2 (Windows Server 2022) meet the requirements.
    fr: Restrict app execution applique une stratégie d'intégrité du code et exige l'Antivirus Microsoft Defender sur Windows 10 version 1709 ou ultérieure, Windows 11, ou Windows Server 2019 ou ultérieur. DEV1 (Windows 11) et SRV2 (Windows Server 2022) remplissent les conditions.
  options:
    b: { en: "Windows 10 version 1607 is older than the minimum version 1709.", fr: "Windows 10 version 1607 est antérieur à la version minimale 1709." }
    c: { en: "The action isn't available on Windows Server 2016; servers need Windows Server 2019 or later.", fr: "L'action n'est pas disponible sous Windows Server 2016 ; les serveurs doivent exécuter Windows Server 2019 ou ultérieur." }
references:
  - title: Take response actions on a device in Microsoft Defender for Endpoint
    url: https://learn.microsoft.com/en-us/defender-endpoint/respond-machine-alerts
