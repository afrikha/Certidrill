id: sc200-sr1-timeline-export-2
objective: "2.2.1"
type: series_yesno
series: sc200-sr1-timeline-export
seriesOrder: 2
difficulty: 1
status: draft
stem:
  en: You export a custom date range and flag the key events.
  fr: Vous exportez une plage de dates personnalisée et marquez les événements clés d'un indicateur.
body:
  solution:
    en: |
      On the **Timeline** tab of DEV-FIN-07, you set a custom range from November 9 to November 12 and select **Export**. You then select the flag icon of each key event.
    fr: |
      Dans l'onglet **Timeline** de DEV-FIN-07, vous définissez une plage personnalisée du 9 au 12 novembre et sélectionnez **Export**. Vous sélectionnez ensuite l'icône de drapeau de chaque événement clé.
answer: { value: true }
explanation:
  correct:
    en: |
      The compromise period is four days, within the seven-day limit of a timeline export, so the export gives the forensics team the events they need. Flagged events are kept on the device timeline, and any analyst can turn on the **Flagged events** filter to display only them.
    fr: |
      La période de compromission dure quatre jours, ce qui respecte la limite de sept jours d'une exportation de la chronologie : l'exportation fournit à l'équipe d'investigation numérique les événements dont elle a besoin. Les événements marqués d'un indicateur sont conservés dans la chronologie de l'appareil, et tout analyste peut activer le filtre **Flagged events** pour n'afficher qu'eux.
references:
  - title: Investigate devices in Microsoft Defender for Endpoint
    url: https://learn.microsoft.com/en-us/defender-endpoint/investigate-machines
