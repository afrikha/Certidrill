id: sc200-2b-cop-standalone-prompt
objective: "2.1.8"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Litware has provisioned access to Microsoft Security Copilot. The Microsoft Defender XDR plugin is enabled in the Security Copilot standalone portal.

    An analyst enters the prompt "Generate guided responses and recommendations for incident 5521." in the standalone portal. The response is generic and doesn't use the guided response capability of Defender.

    You need the guided response capability to be used reliably. What should the analyst do?
  fr: |
    Litware dispose d'un accès provisionné à Microsoft Security Copilot. Le plug-in Microsoft Defender XDR est activé dans le portail autonome de Security Copilot.

    Un analyste saisit l'invite « Generate guided responses and recommendations for incident 5521. » dans le portail autonome. La réponse est générique et n'utilise pas la fonctionnalité de réponses guidées de Defender.

    Vous devez faire en sorte que la fonctionnalité de réponses guidées soit utilisée de manière fiable. Que doit faire l'analyste ?
body:
  options:
    - id: a
      text: { en: "Turn on the Natural Language to KQL for Microsoft Sentinel plugin.", fr: "Activer le plug-in Natural Language to KQL for Microsoft Sentinel." }
    - id: b
      text: { en: "Include the word Defender in the prompt, for example Defender incident 5521.", fr: "Inclure le mot Defender dans l'invite, par exemple Defender incident 5521." }
    - id: c
      text: { en: "Post the incident summary to the activity log before prompting again.", fr: "Publier le résumé de l'incident dans le journal d'activité avant de relancer l'invite." }
    - id: d
      text: { en: "Assign the incident to the analyst and set its status to In progress.", fr: "Attribuer l'incident à l'analyste et définir son état sur En cours." }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Guided responses are available in the standalone experience through the Microsoft Defender XDR plugin. Microsoft recommends including the word Defender in the prompt, such as "Generate guided responses and recommendations for Defender incident {incident ID}", so that the capability is invoked reliably.
    fr: |
      Les réponses guidées sont disponibles dans l'expérience autonome par le plug-in Microsoft Defender XDR. Microsoft recommande d'inclure le mot Defender dans l'invite, par exemple « Generate guided responses and recommendations for Defender incident {incident ID} », afin que la fonctionnalité soit appelée de manière fiable.
  options:
    a: { en: "The Natural Language to KQL plugin generates queries; it isn't the source of guided responses.", fr: "Le plug-in Natural Language to KQL génère des requêtes ; il n'est pas la source des réponses guidées." }
    c: { en: "Posting to the activity log saves Copilot content on the incident; it doesn't change how a prompt is routed.", fr: "La publication dans le journal d'activité enregistre du contenu Copilot sur l'incident ; elle ne change pas la façon dont une invite est traitée." }
    d: { en: "Incident assignment and status don't affect which Copilot capability a prompt uses.", fr: "L'attribution et l'état de l'incident n'influencent pas la fonctionnalité Copilot qu'utilise une invite." }
references:
  - title: Triage and investigate incidents with guided responses from Microsoft Copilot in Microsoft Defender
    url: https://learn.microsoft.com/en-us/defender-xdr/security-copilot-m365d-guided-response
