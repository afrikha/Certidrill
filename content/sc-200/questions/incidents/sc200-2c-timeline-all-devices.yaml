id: sc200-2c-timeline-all-devices
objective: "2.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Fabrikam has 4,000 devices onboarded to Microsoft Defender for Endpoint. In the timeline of a device named **WS-MKT-22**, you find a process that ran `certutil.exe -urlcache -split -f` to download a file.

    You need to identify every device on which the same command line ran during the last 30 days. The solution must minimize administrative effort.

    What should you do?
  fr: |
    Fabrikam dispose de 4 000 appareils intégrés à Microsoft Defender pour point de terminaison. Dans la chronologie d'un appareil nommé **WS-MKT-22**, vous trouvez un processus qui a exécuté `certutil.exe -urlcache -split -f` pour télécharger un fichier.

    Vous devez identifier chaque appareil sur lequel la même ligne de commande s'est exécutée au cours des 30 derniers jours. La solution doit réduire au minimum l'effort d'administration.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Search the timeline of each device for certutil.exe", fr: "Rechercher certutil.exe dans la chronologie de chaque appareil" }
    - id: b
      text: { en: "Export the timeline of each device and search the exported files", fr: "Exporter la chronologie de chaque appareil et rechercher dans les fichiers exportés" }
    - id: c
      text: { en: "Run an advanced hunting query on DeviceProcessEvents", fr: "Exécuter une requête de repérage avancé sur DeviceProcessEvents" }
    - id: d
      text: { en: "Run a full antivirus scan on all the devices", fr: "Exécuter une analyse antivirus complète sur tous les appareils" }
answer: { optionId: c }
explanation:
  correct:
    en: The timeline shows one device. An advanced hunting query on DeviceProcessEvents, filtered on the command line, returns every device where the process ran, in a single query that you can save and rerun.
    fr: La chronologie montre un seul appareil. Une requête de repérage avancé sur DeviceProcessEvents, filtrée sur la ligne de commande, renvoie chaque appareil où le processus s'est exécuté, en une seule requête que vous pouvez enregistrer et réexécuter.
  options:
    a:
      en: Searching 4,000 device timelines one by one doesn't minimize administrative effort.
      fr: Rechercher dans 4 000 chronologies une par une ne réduit pas l'effort d'administration.
    b:
      en: Exports are per device and limited to seven days, so you would need thousands of exports to cover 30 days.
      fr: "Les exportations se font par appareil et sont limitées à sept jours : il faudrait des milliers d'exportations pour couvrir 30 jours."
    d:
      en: An antivirus scan looks for malware on disk; it doesn't report which devices ran a command line in the past.
      fr: Une analyse antivirus recherche des programmes malveillants sur le disque ; elle n'indique pas quels appareils ont exécuté une ligne de commande dans le passé.
references:
  - title: Investigate devices in Microsoft Defender for Endpoint
    url: https://learn.microsoft.com/en-us/defender-endpoint/device-timeline-event-flag
  - title: Data tables in the Microsoft Defender advanced hunting schema
    url: https://learn.microsoft.com/en-us/defender-xdr/advanced-hunting-schema-tables
