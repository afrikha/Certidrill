id: sc200-2b-idp-temp-password-roles
objective: "2.1.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso has a Microsoft Entra tenant licensed for Microsoft Entra ID P2. Microsoft Entra ID Protection reports a cloud-only user named **User4** as high risk.

    A SOC analyst named Analyst1 must generate a temporary password for User4 directly from the **Risky users** report in ID Protection. The solution must follow the principle of least privilege.

    Which Microsoft Entra roles should you assign to Analyst1?
  fr: |
    Contoso dispose d'un locataire Microsoft Entra disposant de licences Microsoft Entra ID P2. Microsoft Entra ID Protection signale un utilisateur cloud uniquement nommé **User4** comme présentant un risque élevé.

    Un analyste du SOC nommé Analyst1 doit générer un mot de passe temporaire pour User4 directement depuis le rapport **Utilisateurs à risque** d'ID Protection. La solution doit respecter le principe du moindre privilège.

    Quels rôles Microsoft Entra devez-vous attribuer à Analyst1 ?
body:
  options:
    - id: a
      text: { en: "Security Operator only", fr: "Security Operator uniquement" }
    - id: b
      text: { en: "User Administrator only", fr: "User Administrator uniquement" }
    - id: c
      text: { en: "Security Operator and User Administrator", fr: "Security Operator et User Administrator" }
    - id: d
      text: { en: "Global Reader and Helpdesk Administrator", fr: "Global Reader et Helpdesk Administrator" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Resetting a password from the user details page needs User Administrator, but generating a temporary password from ID Protection needs both Security Operator and User Administrator. The temporary password sets the risk state to Remediated, and the user must change it at the next sign-in.
    fr: |
      La réinitialisation d'un mot de passe depuis la page de détails de l'utilisateur nécessite User Administrator, mais la génération d'un mot de passe temporaire depuis ID Protection nécessite à la fois Security Operator et User Administrator. Le mot de passe temporaire fait passer l'état du risque à Remediated, et l'utilisateur doit le changer à la connexion suivante.
  options:
    a: { en: "Security Operator can dismiss user risk, but it can't reset a user's password.", fr: "Security Operator peut ignorer le risque utilisateur, mais ne peut pas réinitialiser le mot de passe d'un utilisateur." }
    b: { en: "User Administrator is enough from the user details page, not from the ID Protection risky users report.", fr: "User Administrator suffit depuis la page de détails de l'utilisateur, pas depuis le rapport des utilisateurs à risque d'ID Protection." }
    d: { en: "Global Reader only views the risk reports and doesn't grant the ID Protection actions that the temporary password requires.", fr: "Global Reader permet seulement de consulter les rapports de risque et n'accorde pas les actions d'ID Protection qu'exige le mot de passe temporaire." }
references:
  - title: Remediate risks and unblock users
    url: https://learn.microsoft.com/en-us/entra/id-protection/howto-identity-protection-remediate-unblock
