id: sc200-2d-cs-case-member
objective: "2.3.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam, Inc. uses Microsoft Purview eDiscovery. An analyst named Analyst4 created an eDiscovery case named INC-4471 to collect the messages of a data exfiltration incident.

    Another analyst named Analyst5 is a member of the eDiscovery Manager subgroup of the eDiscovery Manager role group. Analyst5 must run searches in INC-4471, but the case does not appear in Analyst5's list of cases.

    You need to give Analyst5 access to INC-4471. The solution must follow the principle of least privilege.

    What should you do?
  fr: |
    Fabrikam, Inc. utilise Microsoft Purview eDiscovery. Un analyste nommé Analyst4 a créé un cas eDiscovery nommé INC-4471 pour collecter les messages d'un incident d'exfiltration de données.

    Un autre analyste nommé Analyst5 est membre du sous-groupe eDiscovery Manager du groupe de rôles eDiscovery Manager. Analyst5 doit exécuter des recherches dans INC-4471, mais le cas n'apparaît pas dans sa liste de cas.

    Vous devez donner à Analyst5 l'accès à INC-4471. La solution doit respecter le principe du moindre privilège.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Add Analyst5 to the eDiscovery Administrator subgroup.", fr: "Ajouter Analyst5 au sous-groupe eDiscovery Administrator." } }
    - { id: b, text: { en: "Add Analyst5 as a member of the INC-4471 case.", fr: "Ajouter Analyst5 comme membre du cas INC-4471." } }
    - { id: c, text: { en: "Assign the Custodian role to Analyst5.", fr: "Attribuer le rôle Custodian à Analyst5." } }
    - { id: d, text: { en: "Add Analyst5 to the Organization Management role group.", fr: "Ajouter Analyst5 au groupe de rôles Organization Management." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Users who are not eDiscovery Administrators see only the cases they are members of. Analyst5 already has the roles needed to search; adding Analyst5 as a member of INC-4471 gives access to that case only.
    fr: |
      Les utilisateurs qui ne sont pas eDiscovery Administrators ne voient que les cas dont ils sont membres. Analyst5 dispose déjà des rôles nécessaires pour rechercher ; l'ajouter comme membre d'INC-4471 lui donne accès à ce seul cas.
  options:
    a: { en: "eDiscovery Administrators can access every case and its data, which is more than required.", fr: "Les eDiscovery Administrators peuvent accéder à tous les cas et à leurs données, ce qui dépasse le besoin." }
    c: { en: "The Custodian role gives access to the Data Sources tab; it does not make a case visible to a non-member.", fr: "Le rôle Custodian donne accès à l'onglet Data Sources ; il ne rend pas un cas visible pour un non-membre." }
    d: { en: "Organization Management grants broad rights, including Search And Purge, and does not replace case membership.", fr: "Organization Management accorde des droits étendus, dont Search And Purge, et ne remplace pas l'appartenance au cas." }
references:
  - title: Assign permissions in eDiscovery
    url: https://learn.microsoft.com/en-us/purview/edisc-permissions
