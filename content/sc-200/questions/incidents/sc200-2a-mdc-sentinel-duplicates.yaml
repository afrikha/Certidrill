id: sc200-2a-mdc-sentinel-duplicates
objective: "2.1.3"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    Contoso, Ltd. has a Microsoft Sentinel workspace onboarded to the Microsoft Defender portal. The Microsoft Defender XDR connector streams the Defender XDR incidents to Sentinel. Defender for Cloud alerts are also collected by the **Subscription-based Microsoft Defender for Cloud (Legacy)** connector, and a scheduled analytics rule creates incidents from these alerts.

    The SOC reports duplicate alerts and incidents for every Defender for Cloud detection. You need to prevent the duplicates while still collecting the alerts of all the subscriptions.

    Which three actions should you perform?

    Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso, Ltd. dispose d'un espace de travail Microsoft Sentinel intégré au portail Microsoft Defender. Le connecteur Microsoft Defender XDR transmet les incidents Defender XDR à Sentinel. Les alertes de Defender pour le cloud sont aussi collectées par le connecteur **Subscription-based Microsoft Defender for Cloud (Legacy)**, et une règle d'analytique planifiée crée des incidents à partir de ces alertes.

    Le SOC signale des alertes et des incidents en double pour chaque détection de Defender pour le cloud. Vous devez empêcher les doublons tout en continuant à collecter les alertes de tous les abonnements.

    Quelles sont les trois actions à effectuer ?

    Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 3
  options:
    - { id: a, text: { en: "Configure the Tenant-based Microsoft Defender for Cloud connector.", fr: "Configurer le connecteur Tenant-based Microsoft Defender for Cloud." } }
    - { id: b, text: { en: "Disconnect the Microsoft Defender XDR connector.", fr: "Déconnecter le connecteur Microsoft Defender XDR." } }
    - { id: c, text: { en: "Disconnect the Subscription-based Microsoft Defender for Cloud (Legacy) connector.", fr: "Déconnecter le connecteur Subscription-based Microsoft Defender for Cloud (Legacy)." } }
    - { id: d, text: { en: "Create an automation rule that closes every incident whose title contains Defender for Cloud.", fr: "Créer une règle d'automatisation qui ferme chaque incident dont le titre contient Defender for Cloud." } }
    - { id: e, text: { en: "Turn off the analytics rule that creates incidents from Defender for Cloud alerts.", fr: "Désactiver la règle d'analytique qui crée des incidents à partir des alertes de Defender pour le cloud." } }
answer: { optionIds: [ a, c, e ] }
explanation:
  correct:
    en: |
      Customers who integrate Defender XDR incidents and ingest Defender for Cloud alerts use the Tenant-based Microsoft Defender for Cloud connector, which collects the alerts of all subscriptions in sync with the Defender for Cloud incidents streamed by the Defender XDR connector. They disconnect the subscription-based (legacy) connector to prevent duplicate alerts, and turn off the Scheduled or Microsoft security rules that create incidents from Defender for Cloud alerts.
    fr: |
      Les clients qui intègrent les incidents Defender XDR et ingèrent les alertes de Defender pour le cloud utilisent le connecteur Tenant-based Microsoft Defender for Cloud, qui collecte les alertes de tous les abonnements en synchronisation avec les incidents Defender pour le cloud transmis par le connecteur Defender XDR. Ils déconnectent le connecteur basé sur l'abonnement (hérité) pour éviter les alertes en double, et désactivent les règles Scheduled ou Microsoft security qui créent des incidents à partir des alertes de Defender pour le cloud.
  options:
    b: { en: "The Defender XDR connector streams the correlated incidents; removing it loses the XDR incidents instead of removing the duplicates.", fr: "Le connecteur Defender XDR transmet les incidents corrélés ; le retirer fait perdre les incidents XDR au lieu de supprimer les doublons." }
    d: { en: "Closing incidents by title would also close the legitimate incidents and doesn't stop duplicate alerts from being ingested.", fr: "Fermer les incidents d'après leur titre fermerait aussi les incidents légitimes et n'empêche pas l'ingestion d'alertes en double." }
references:
  - title: Alerts and incidents in Microsoft Defender XDR for Microsoft Defender for Cloud
    url: https://learn.microsoft.com/en-us/defender-xdr/microsoft-365-security-center-defender-cloud
  - title: Ingest Microsoft Defender for Cloud alerts to Microsoft Sentinel
    url: https://learn.microsoft.com/en-us/azure/sentinel/connect-defender-for-cloud
