id: sc200-2a-mdc-sentinel-duplicates
objective: "2.1.3"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    Contoso, Ltd. has a Microsoft Sentinel workspace onboarded to the Microsoft Defender portal, and the Microsoft Defender for Cloud alerts and incidents of all its subscriptions are integrated into Microsoft Defender XDR. Before the onboarding, Defender for Cloud alerts were collected by the **Subscription-based Microsoft Defender for Cloud (Legacy)** connector, which is still connected, and a scheduled analytics rule creates incidents from these alerts.

    The SOC reports duplicate alerts and incidents for every Defender for Cloud detection. You need to prevent the duplicates while still receiving the alerts of all the subscriptions.

    Which two actions should you perform?

    Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso, Ltd. dispose d'un espace de travail Microsoft Sentinel intégré au portail Microsoft Defender, et les alertes et incidents de Microsoft Defender pour le cloud de tous ses abonnements sont intégrés à Microsoft Defender XDR. Avant cette intégration, les alertes de Defender pour le cloud étaient collectées par le connecteur **Subscription-based Microsoft Defender for Cloud (Legacy)**, qui est toujours connecté, et une règle d'analytique planifiée crée des incidents à partir de ces alertes.

    Le SOC signale des alertes et des incidents en double pour chaque détection de Defender pour le cloud. Vous devez empêcher les doublons tout en continuant à recevoir les alertes de tous les abonnements.

    Quelles sont les deux actions à effectuer ?

    Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Connect the Tenant-based Microsoft Defender for Cloud connector from the Data connectors page.", fr: "Connecter le connecteur Tenant-based Microsoft Defender for Cloud depuis la page Connecteurs de données." } }
    - { id: b, text: { en: "Disconnect the Microsoft Defender XDR connector.", fr: "Déconnecter le connecteur Microsoft Defender XDR." } }
    - { id: c, text: { en: "Disconnect the Subscription-based Microsoft Defender for Cloud (Legacy) connector.", fr: "Déconnecter le connecteur Subscription-based Microsoft Defender for Cloud (Legacy)." } }
    - { id: d, text: { en: "Create an automation rule that closes every incident whose title contains Defender for Cloud.", fr: "Créer une règle d'automatisation qui ferme chaque incident dont le titre contient Defender for Cloud." } }
    - { id: e, text: { en: "Turn off the analytics rule that creates incidents from Defender for Cloud alerts.", fr: "Désactiver la règle d'analytique qui crée des incidents à partir des alertes de Defender pour le cloud." } }
answer: { optionIds: [ c, e ] }
explanation:
  correct:
    en: |
      With the Defender for Cloud integration in Defender XDR, the alerts of every subscription already arrive at the tenant level, with ready-made incidents synchronized with Defender XDR. Microsoft advises disabling the subscription-based (legacy) connector to prevent duplicate alerts in the logs, and disabling the Scheduled or Microsoft security rules that create incidents from Defender for Cloud alerts.
    fr: |
      Avec l'intégration de Defender pour le cloud dans Defender XDR, les alertes de tous les abonnements arrivent déjà au niveau du locataire, avec des incidents prêts à l'emploi synchronisés avec Defender XDR. Microsoft conseille de désactiver le connecteur basé sur l'abonnement (hérité) pour éviter les alertes en double dans les journaux, et de désactiver les règles Scheduled ou Microsoft security qui créent des incidents à partir des alertes de Defender pour le cloud.
  options:
    a: { en: "When the workspace is onboarded to the Defender portal, the Defender for Cloud alerts are already ingested into Defender XDR, and the tenant-based connector isn't listed on the Data connectors page.", fr: "Quand l'espace de travail est intégré au portail Defender, les alertes de Defender pour le cloud sont déjà ingérées dans Defender XDR, et le connecteur basé sur le locataire n'est pas listé dans la page Connecteurs de données." }
    b: { en: "The Defender XDR connector brings the correlated incidents and alerts; removing it loses them instead of removing the duplicates.", fr: "Le connecteur Defender XDR apporte les incidents et alertes corrélés ; le retirer les fait perdre au lieu de supprimer les doublons." }
    d: { en: "Closing incidents by title would also close the legitimate incidents and doesn't stop duplicate alerts from being ingested.", fr: "Fermer les incidents d'après leur titre fermerait aussi les incidents légitimes et n'empêche pas l'ingestion d'alertes en double." }
references:
  - title: Ingest Microsoft Defender for Cloud incidents with Microsoft Defender XDR integration
    url: https://learn.microsoft.com/en-us/azure/sentinel/ingest-defender-for-cloud-incidents
  - title: Ingest Microsoft Defender for Cloud alerts to Microsoft Sentinel
    url: https://learn.microsoft.com/en-us/azure/sentinel/connect-defender-for-cloud
