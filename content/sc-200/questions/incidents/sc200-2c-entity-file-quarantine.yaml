id: sc200-2c-entity-file-quarantine
objective: "2.2.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A malicious file named **svch0st.exe** is running on 25 Windows 11 devices onboarded to Microsoft Defender for Endpoint. It was first seen 10 days ago and created Run registry keys for persistence. The file isn't signed.

    You need to stop the running processes of the file, quarantine it, and delete its persistent data on the 25 devices by using a single action.

    Which action should you use?
  fr: |
    Un fichier malveillant nommé **svch0st.exe** s'exécute sur 25 appareils Windows 11 intégrés à Microsoft Defender pour point de terminaison. Il a été vu pour la première fois il y a 10 jours et a créé des clés de Registre Run pour persister. Le fichier n'est pas signé.

    Vous devez arrêter les processus en cours du fichier, le mettre en quarantaine et supprimer ses données persistantes sur les 25 appareils en une seule action.

    Quelle action devez-vous utiliser ?
body:
  options:
    - id: a
      text: { en: "Stop and quarantine file on the file page", fr: "Stop and quarantine file sur la page du fichier" }
    - id: b
      text: { en: "Add indicator to block the file on the file page", fr: "Add indicator pour bloquer le fichier sur la page du fichier" }
    - id: c
      text: { en: "Collect file on the file page", fr: "Collect file sur la page du fichier" }
    - id: d
      text: { en: "Restrict app execution on each device page", fr: "Restrict app execution sur la page de chaque appareil" }
answer: { optionId: a }
explanation:
  correct:
    en: Stop and quarantine file stops the running processes, quarantines the file and deletes its persistent data, such as registry keys, on the devices where the file was observed in the last 30 days, up to 1,000 devices.
    fr: Stop and quarantine file arrête les processus en cours, met le fichier en quarantaine et supprime ses données persistantes, comme les clés de Registre, sur les appareils où le fichier a été observé au cours des 30 derniers jours, jusqu'à 1 000 appareils.
  options:
    b:
      en: An indicator blocks future executions of the file but doesn't remove the persistence that it already created.
      fr: Un indicateur bloque les exécutions futures du fichier mais ne supprime pas la persistance déjà créée.
    c:
      en: Collect file retrieves a copy of the file for analysis; it doesn't stop or remove it.
      fr: Collect file récupère une copie du fichier pour l'analyser ; il ne l'arrête pas et ne le supprime pas.
    d:
      en: Restricting app execution is a per-device action that blocks non-Microsoft-signed files; it doesn't delete the file or its registry keys.
      fr: Restreindre l'exécution des applications est une action par appareil qui bloque les fichiers non signés par Microsoft ; elle ne supprime ni le fichier ni ses clés de Registre.
references:
  - title: Take response actions on a file in Microsoft Defender for Endpoint
    url: https://learn.microsoft.com/en-us/defender-endpoint/respond-file-alerts
