id: sc200-2a-mdca-governance-dragdrop
objective: "2.1.4"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove Bank uses Microsoft Defender for Cloud Apps with the Microsoft 365 app connector. Analysts respond to several confirmed alerts.

    Which governance action should the analysts apply for each requirement? To answer, drag the appropriate actions to the correct requirements. Each action may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove Bank utilise Microsoft Defender pour les applications cloud avec le connecteur d'application Microsoft 365. Les analystes répondent à plusieurs alertes confirmées.

    Quelle action de gouvernance les analystes doivent-ils appliquer pour chaque exigence ? Pour répondre, faites glisser les actions appropriées vers les exigences correspondantes. Chaque action peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: ban, text: Ban app }
    - { id: adminq, text: Put in admin quarantine }
    - { id: extusers, text: Remove external users }
    - { id: signin, text: Require user to sign in again }
    - { id: suspend, text: Suspend user }
    - { id: trash, text: Trash }
  targets:
    - { id: t1, text: { en: "A third-party OAuth app with a misleading name must no longer be allowed to access Office 365 data", fr: "Une application OAuth tierce au nom trompeur ne doit plus être autorisée à accéder aux données Office 365" } }
    - { id: t2, text: { en: "A suspicious OneDrive file must be hidden from its owner and kept for an administrator's review", fr: "Un fichier OneDrive suspect doit être masqué à son propriétaire et conservé pour l'examen d'un administrateur" } }
    - { id: t3, text: { en: "A SharePoint file must stay shared with colleagues, but the external collaborators must lose access", fr: "Un fichier SharePoint doit rester partagé avec les collègues, mais les collaborateurs externes doivent perdre l'accès" } }
    - { id: t4, text: { en: "A user's sessions must be ended in every app, without blocking the user's next sign-in", fr: "Les sessions d'un utilisateur doivent être fermées dans toutes les applications, sans bloquer sa prochaine connexion" } }
answer:
  mapping: { t1: ban, t2: adminq, t3: extusers, t4: signin }
explanation:
  correct:
    en: |
      Ban app prevents a third-party app's permissions from accessing Office in Microsoft 365. Put in admin quarantine removes the file from the user's view and keeps it for an admin. Remove external users removes the access of the external collaborators while internal sharing stays. Require user to sign in again revokes refresh tokens and session cookies, forcing a new sign-in, whereas Suspend user would block sign-in entirely.
    fr: |
      Ban app empêche les autorisations d'une application tierce d'accéder à Office dans Microsoft 365. Put in admin quarantine retire le fichier de la vue de l'utilisateur et le conserve pour un administrateur. Remove external users retire l'accès des collaborateurs externes tout en conservant le partage interne. Require user to sign in again révoque les jetons d'actualisation et les cookies de session et force une nouvelle connexion, alors que Suspend user bloquerait complètement la connexion.
  options:
    suspend: { en: "Suspend user blocks every sign-in, which the fourth requirement excludes.", fr: "Suspend user bloque toute connexion, ce que la quatrième exigence exclut." }
    trash: { en: "Trash deletes the file instead of keeping it for review.", fr: "Trash supprime le fichier au lieu de le conserver pour examen." }
references:
  - title: Governing connected apps
    url: https://learn.microsoft.com/en-us/defender-cloud-apps/governance-actions
