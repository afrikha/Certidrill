id: sc200-2c-entity-download-permission
objective: "2.2.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Contoso uses Microsoft Defender XDR Unified RBAC. An analyst named Chris has a custom role that includes the Alerts (manage) and File collection permissions. Chris can download executable files from file pages.

    Chris must now download a Word document named **Payroll_Q4.docx** from its file page to examine its macros.

    You need to grant Chris the required access. The solution must follow the principle of least privilege.

    What should you do?
  fr: |
    Contoso utilise le RBAC unifié de Microsoft Defender XDR. Un analyste nommé Chris dispose d'un rôle personnalisé qui inclut les autorisations Alerts (manage) et File collection. Chris peut télécharger des fichiers exécutables depuis les pages de fichiers.

    Chris doit maintenant télécharger un document Word nommé **Payroll_Q4.docx** depuis sa page de fichier pour examiner ses macros.

    Vous devez accorder à Chris l'accès nécessaire. La solution doit respecter le principe du moindre privilège.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Add the Basic live response permission to Chris's custom role", fr: "Ajouter l'autorisation Basic live response au rôle personnalisé de Chris" }
    - id: b
      text: { en: "Assign the Security Administrator role in Microsoft Entra ID to Chris", fr: "Attribuer à Chris le rôle Security Administrator dans Microsoft Entra ID" }
    - id: c
      text: { en: "Add the Advanced live response permission to Chris's custom role", fr: "Ajouter l'autorisation Advanced live response au rôle personnalisé de Chris" }
    - id: d
      text: { en: "Add the Response (manage) permission to Chris's custom role", fr: "Ajouter l'autorisation Response (manage) au rôle personnalisé de Chris" }
answer: { optionId: c }
explanation:
  correct:
    en: Downloading a portable executable requires Security Administrator, Advanced live response, or the Alerts permission with file collection, which Chris has. A non-PE file such as a .docx requires Security Administrator or Advanced live response; adding Advanced live response to the custom role is the least privileged choice.
    fr: Télécharger un exécutable portable exige Security Administrator, Advanced live response, ou l'autorisation Alerts avec la collecte de fichiers, que Chris possède. Un fichier non PE comme un .docx exige Security Administrator ou Advanced live response ; ajouter Advanced live response au rôle personnalisé est le choix le moins privilégié.
  options:
    a:
      en: Basic live response isn't one of the permissions that allow downloading non-PE files.
      fr: Basic live response ne fait pas partie des autorisations qui permettent de télécharger des fichiers non PE.
    b:
      en: Security Administrator allows the download, but it is a broad directory role that grants far more than needed.
      fr: Security Administrator permet le téléchargement, mais c'est un rôle d'annuaire étendu qui accorde bien plus que nécessaire.
    d:
      en: Response (manage) covers response actions; it isn't listed as a permission for downloading files.
      fr: Response (manage) couvre les actions de réponse ; elle ne figure pas parmi les autorisations de téléchargement de fichiers.
references:
  - title: Take response actions on a file in Microsoft Defender for Endpoint
    url: https://learn.microsoft.com/en-us/defender-endpoint/respond-file-alerts
