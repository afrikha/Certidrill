id: sc200-2b-sen-remove-alert
objective: "2.1.7"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Adatum onboarded its Microsoft Sentinel workspace to the Microsoft Defender portal. An incident named **Incident 4410** contains three Microsoft Sentinel alerts. During triage, you determine that one alert, raised by a scheduled analytics rule, belongs to a different attack that is tracked in **Incident 4398**.

    You need to remove the alert from Incident 4410.

    What should you do?
  fr: |
    Adatum a intégré son espace de travail Microsoft Sentinel au portail Microsoft Defender. Un incident nommé **Incident 4410** contient trois alertes Microsoft Sentinel. Lors du triage, vous déterminez qu'une alerte, générée par une règle d'analytique planifiée, appartient à une autre attaque suivie dans **Incident 4398**.

    Vous devez retirer l'alerte d'Incident 4410.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "In the Defender portal, set the status of the alert to Resolved.", fr: "Dans le portail Defender, définir l'état de l'alerte sur Résolu." }
    - id: b
      text: { en: "In the Azure portal, remove the alert from the incident timeline of Incident 4410.", fr: "Dans le portail Azure, retirer l'alerte de la chronologie d'Incident 4410." }
    - id: c
      text: { en: "In the Defender portal, add the alert to Incident 4398.", fr: "Dans le portail Defender, ajouter l'alerte à Incident 4398." }
    - id: d
      text: { en: "Run a playbook that removes the alert from Incident 4410.", fr: "Exécuter un playbook qui retire l'alerte d'Incident 4410." }
answer: { optionId: c }
explanation:
  correct:
    en: |
      After onboarding, adding or removing Microsoft Sentinel alerts to or from incidents is supported only in the Defender portal, and you remove an alert by adding it to another incident. Linking the alert to Incident 4398 moves it out of Incident 4410.
    fr: |
      Après l'intégration, l'ajout ou le retrait d'alertes Microsoft Sentinel dans les incidents n'est pris en charge que dans le portail Defender, et vous retirez une alerte en l'ajoutant à un autre incident. Lier l'alerte à Incident 4398 la retire d'Incident 4410.
  options:
    a: { en: "Resolving the alert changes its status but leaves it in Incident 4410.", fr: "Résoudre l'alerte change son état mais la laisse dans Incident 4410." }
    b: { en: "Once the workspace is onboarded, alert membership changes are supported only in the Defender portal.", fr: "Une fois l'espace de travail intégré, les modifications d'appartenance des alertes ne sont prises en charge que dans le portail Defender." }
    d: { en: "Adding or removing alerts from within playbooks isn't supported after onboarding.", fr: "L'ajout ou le retrait d'alertes depuis des playbooks n'est pas pris en charge après l'intégration." }
references:
  - title: Transition your Microsoft Sentinel environment to the Defender portal
    url: https://learn.microsoft.com/en-us/azure/sentinel/move-to-defender
