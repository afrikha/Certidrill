id: sc200-2a-irm-classification-sync
objective: "2.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam, Inc. integrates Microsoft Purview Insider Risk Management with Microsoft Defender XDR. An insider risk alert for a user named User4 is correlated into an incident in the Microsoft Defender portal.

    You investigate and find that User4 copied the files as part of an approved data migration project. You resolve the alert in the Defender portal with the classification **Informational, expected activity**.

    Which status will the alert have in the Microsoft Purview portal after synchronization?
  fr: |
    Fabrikam, Inc. intègre la gestion des risques internes de Microsoft Purview à Microsoft Defender XDR. Une alerte de risque interne concernant un utilisateur nommé User4 est corrélée dans un incident du portail Microsoft Defender.

    Votre enquête montre que User4 a copié les fichiers dans le cadre d'un projet de migration de données approuvé. Vous résolvez l'alerte dans le portail Defender avec la classification **Informational, expected activity**.

    Quel statut l'alerte aura-t-elle dans le portail Microsoft Purview après la synchronisation ?
body:
  options:
    - { id: a, text: Confirmed }
    - { id: b, text: Needs review }
    - { id: c, text: Resolved }
    - { id: d, text: Dismissed }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Status and classification sync between the two portals within 30 minutes. A resolved alert takes its Purview status from the classification: True positive becomes Confirmed, while Informational, expected activity (benign positive) and False positive both become Dismissed.
    fr: |
      Le statut et la classification se synchronisent entre les deux portails en 30 minutes. Une alerte résolue prend son statut Purview selon sa classification : True positive devient Confirmed, tandis que Informational, expected activity (vrai positif bénin) et False positive deviennent tous deux Dismissed.
  options:
    a: { en: "Confirmed corresponds to a True positive classification.", fr: "Confirmed correspond à une classification True positive." }
    b: { en: "Needs review corresponds to the New and In progress statuses, not to a resolved alert.", fr: "Needs review correspond aux statuts New et In progress, pas à une alerte résolue." }
    c: { en: "A resolved Defender alert isn't mapped to Resolved; its Purview status depends on the classification.", fr: "Une alerte Defender résolue n'est pas associée à Resolved ; son statut Purview dépend de la classification." }
references:
  - title: Investigate insider risk threats in the Microsoft Defender portal with insights from Microsoft Purview Insider Risk Management
    url: https://learn.microsoft.com/en-us/defender-xdr/irm-investigate-alerts-defender
