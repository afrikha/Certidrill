id: sc200-2b-cop-kql-generation
objective: "2.1.8"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Fabrikam uses Microsoft Defender XDR and Microsoft Sentinel in the Defender portal, and has provisioned access to Microsoft Security Copilot. A new analyst who doesn't know Kusto Query Language (KQL) must search for devices that connected to a suspicious domain found in an incident.

    You need the analyst to obtain an advanced hunting query by describing the requirement in plain language. The solution must minimize administrative effort.

    Which Copilot in Defender capability should the analyst use?
  fr: |
    Fabrikam utilise Microsoft Defender XDR et Microsoft Sentinel dans le portail Defender, et dispose d'un accès provisionné à Microsoft Security Copilot. Un nouvel analyste qui ne connaît pas le langage de requête Kusto (KQL) doit rechercher les appareils qui se sont connectés à un domaine suspect trouvé dans un incident.

    Vous devez permettre à l'analyste d'obtenir une requête de repérage avancé en décrivant le besoin en langage courant. La solution doit réduire au minimum l'effort d'administration.

    Quelle fonctionnalité de Copilot dans Defender l'analyste doit-il utiliser ?
body:
  options:
    - id: a
      text: { en: "Guided responses on the incident page", fr: "Les réponses guidées sur la page de l'incident" }
    - id: b
      text: { en: "Script analysis on the attack story", fr: "L'analyse de script dans l'histoire de l'attaque" }
    - id: c
      text: { en: "KQL query generation in advanced hunting", fr: "La génération de requêtes KQL dans le repérage avancé" }
    - id: d
      text: { en: "Device summary on the device page", fr: "Le résumé d'appareil sur la page de l'appareil" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Copilot in Defender includes KQL query generation in advanced hunting: the analyst describes the search in natural language and Copilot returns a KQL query to run. Copilot in Defender requires provisioned access to Security Copilot and its preinstalled plugins, including Natural Language to KQL for Microsoft Sentinel.
    fr: |
      Copilot dans Defender comprend la génération de requêtes KQL dans le repérage avancé : l'analyste décrit la recherche en langage naturel et Copilot renvoie une requête KQL à exécuter. Copilot dans Defender exige un accès provisionné à Security Copilot et ses plug-ins préinstallés, dont Natural Language to KQL for Microsoft Sentinel.
  options:
    a: { en: "Guided responses recommend triage, containment, investigation and remediation actions; they don't write hunting queries.", fr: "Les réponses guidées recommandent des actions de triage, de confinement, d'investigation et de correction ; elles n'écrivent pas de requêtes de chasse." }
    b: { en: "Script analysis explains a script or command line; it doesn't build queries.", fr: "L'analyse de script explique un script ou une ligne de commande ; elle ne construit pas de requêtes." }
    d: { en: "A device summary describes one device; it doesn't search for every device that contacted the domain.", fr: "Un résumé d'appareil décrit un appareil ; il ne recherche pas tous les appareils qui ont contacté le domaine." }
references:
  - title: Microsoft Security Copilot and Chat in Microsoft Defender
    url: https://learn.microsoft.com/en-us/defender-xdr/security-copilot-in-microsoft-365-defender
