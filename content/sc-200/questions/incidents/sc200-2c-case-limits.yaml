id: sc200-2c-case-limits
objective: "2.1.10"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    Woodgrove Bank plans to use case management in the Microsoft Defender portal for all its SOC work, including long investigations that involve many incidents and many evidence files.

    You review the service limits that apply to cases.

    Which two statements are true?

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove Bank prévoit d'utiliser la gestion des cas du portail Microsoft Defender pour tout le travail de son SOC, y compris de longues investigations qui impliquent de nombreux incidents et de nombreux fichiers de preuves.

    Vous examinez les limites de service qui s'appliquent aux cas.

    Quelles sont les deux affirmations vraies ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "A case can have up to 100 linked incidents.", fr: "Un cas peut avoir jusqu'à 100 incidents liés." } }
    - { id: b, text: { en: "A tenant can contain up to 100,000 cases.", fr: "Un locataire peut contenir jusqu'à 100 000 cas." } }
    - { id: c, text: { en: "Attachments are limited to 500 GB per case.", fr: "Les pièces jointes sont limitées à 500 Go par cas." } }
    - { id: d, text: { en: "Closed cases are deleted automatically after 90 days.", fr: "Les cas fermés sont supprimés automatiquement au bout de 90 jours." } }
    - { id: e, text: { en: "A case can be assigned to up to five users.", fr: "Un cas peut être attribué à cinq utilisateurs au maximum." } }
answer: { optionIds: [ a, b ] }
explanation:
  correct:
    en: The Microsoft Sentinel service limits for case management are 100 linked incidents per case, 100,000 cases per tenant and 500 GB of attachments per tenant. A case is assigned to a single user.
    fr: Les limites de service de Microsoft Sentinel pour la gestion des cas sont de 100 incidents liés par cas, 100 000 cas par locataire et 500 Go de pièces jointes par locataire. Un cas est attribué à un seul utilisateur.
  options:
    c:
      en: The 500 GB attachment limit applies to the whole tenant, not to each case.
      fr: La limite de 500 Go de pièces jointes s'applique à tout le locataire, pas à chaque cas.
    d:
      en: Cases aren't purged; to archive finished cases, you use custom statuses and filters.
      fr: Les cas ne sont pas purgés ; pour archiver les cas terminés, vous utilisez des états personnalisés et des filtres.
    e:
      en: The Assigned to field of a case takes a single user of the tenant.
      fr: Le champ Assigned to d'un cas accepte un seul utilisateur du locataire.
references:
  - title: Microsoft Sentinel service limits
    url: https://learn.microsoft.com/en-us/azure/sentinel/sentinel-service-limits
  - title: Manage security operations cases natively in the Microsoft Defender portal
    url: https://learn.microsoft.com/en-us/unified-secops/cases-overview
