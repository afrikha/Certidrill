id: sc200-sr2-mdi-disable-1
objective: "2.1.6"
type: series_yesno
series: sc200-sr2-mdi-disable
seriesOrder: 1
difficulty: 2
status: draft
stem:
  en: You mark Ben's account as compromised.
  fr: Vous marquez le compte de Ben comme compromis.
body:
  solution:
    en: From Ben's identity page in the Microsoft Defender portal, you run the **Mark as compromised** remediation action.
    fr: Depuis la page d'identité de Ben dans le portail Microsoft Defender, vous exécutez l'action de correction **Mark as compromised**.
answer: { value: false }
explanation:
  correct:
    en: Mark as compromised is supported only for Microsoft Entra ID accounts. At best it leads the Conditional Access policy to block Ben's Microsoft Entra sign-ins; it changes nothing in AD DS, where the account stays enabled and can still authenticate.
    fr: "Mark as compromised n'est pris en charge que pour les comptes Microsoft Entra ID. Au mieux, l'action amène la stratégie d'accès conditionnel à bloquer les connexions Microsoft Entra de Ben ; elle ne modifie rien dans AD DS, où le compte reste activé et peut toujours s'authentifier."
references:
  - title: Remediation actions in Microsoft Defender for Identity
    url: https://learn.microsoft.com/en-us/defender-for-identity/remediation-actions
