id: sc200-2c-action-bar-hotarea
objective: "2.2.2"
type: hotarea
difficulty: 1
status: draft
stem:
  en: |
    You open the device page of a Windows 11 device named **WS-ACC-17** in the Microsoft Defender portal. The response actions of the device page are shown in the following table.

    Answer each prompt by selecting the response action that you should use.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous ouvrez la page d'un appareil Windows 11 nommé **WS-ACC-17** dans le portail Microsoft Defender. Les actions de réponse de la page de l'appareil figurent dans le tableau suivant.

    Répondez à chaque consigne en sélectionnant l'action de réponse que vous devez utiliser.

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
    - id: p1
      text: { en: "Allow only Microsoft-signed files to run on WS-ACC-17 while it stays connected to the network", fr: "N'autoriser que les fichiers signés par Microsoft à s'exécuter sur WS-ACC-17 tout en le laissant connecté au réseau" }
    - id: p2
      text: { en: "Start an investigation that the other alerts of WS-ACC-17 join until it completes", fr: "Lancer une investigation que les autres alertes de WS-ACC-17 rejoignent jusqu'à ce qu'elle se termine" }
  grid:
    header: [{ en: "Device page response actions", fr: "Actions de réponse de la page de l'appareil" }]
    rows:
      - [{ text: Manage tags, area: tags }]
      - [{ text: Initiate automated investigation, area: air }]
      - [{ text: Initiate live response session, area: lr }]
      - [{ text: Collect investigation package, area: package }]
      - [{ text: Run antivirus scan, area: scan }]
      - [{ text: Restrict app execution, area: restrict }]
      - [{ text: Isolate device, area: isolate }]
      - [{ text: Contain device, area: contain }]
answer:
  values: { p1: restrict, p2: air }
explanation:
  correct:
    en: Restrict app execution applies a code integrity policy that lets only Microsoft-signed files run, without disconnecting the device. Initiate automated investigation starts a new automated investigation; other alerts from the device join it until it completes, and devices where the same threat appears are added.
    fr: Restrict app execution applique une stratégie d'intégrité du code qui ne laisse s'exécuter que les fichiers signés par Microsoft, sans déconnecter l'appareil. Initiate automated investigation lance une nouvelle investigation automatisée ; les autres alertes de l'appareil la rejoignent jusqu'à sa fin, et les appareils où la même menace apparaît y sont ajoutés.
  options:
    isolate: { en: "Isolation disconnects the device from the network, which the first prompt excludes.", fr: "L'isolation déconnecte l'appareil du réseau, ce que la première consigne exclut." }
    scan: { en: "An antivirus scan detects and removes malware but doesn't prevent other files from running.", fr: "Une analyse antivirus détecte et supprime les programmes malveillants mais n'empêche pas d'autres fichiers de s'exécuter." }
references:
  - title: Take response actions on a device in Microsoft Defender for Endpoint
    url: https://learn.microsoft.com/en-us/defender-endpoint/respond-machine-alerts
