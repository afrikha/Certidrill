id: sc200-2d-audit-retention-3y
objective: "2.3.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Woodgrove Bank has Microsoft 365 E5 licenses for all users and uses Audit (Premium) with the default audit retention. No custom audit log retention policy exists.

    Regulators require that the SOC can investigate the Exchange Online activities of the 40 members of the trading team for 3 years after each event. The records must stay searchable in the Audit solution. The solution must minimize administrative effort.

    What should you do?
  fr: |
    Woodgrove Bank dispose de licences Microsoft 365 E5 pour tous les utilisateurs et utilise Audit (Premium) avec la rétention d'audit par défaut. Aucune stratégie personnalisée de rétention des journaux d'audit n'existe.

    Les autorités de régulation exigent que le SOC puisse examiner les activités Exchange Online des 40 membres de l'équipe de trading pendant 3 ans après chaque événement. Les enregistrements doivent rester consultables dans la solution Audit. La solution doit réduire au minimum l'effort d'administration.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Create an audit log retention policy for the trading team and the Exchange record type with a duration of 3 years.", fr: "Créer une stratégie de rétention des journaux d'audit pour l'équipe de trading et le type d'enregistrement Exchange, d'une durée de 3 ans." } }
    - { id: b, text: { en: "Create a Microsoft 365 retention policy that retains the trading team's mailbox content for 3 years.", fr: "Créer une stratégie de rétention Microsoft 365 qui conserve le contenu des boîtes aux lettres de l'équipe de trading pendant 3 ans." } }
    - { id: c, text: { en: "Assign the 10-Year Audit Log Retention add-on to the trading team, then create a 3-year audit log retention policy for them.", fr: "Attribuer la licence complémentaire 10-Year Audit Log Retention à l'équipe de trading, puis créer pour elle une stratégie de rétention des journaux d'audit de 3 ans." } }
    - { id: d, text: { en: "Schedule a monthly export of the trading team's audit records to a CSV file stored in a SharePoint library.", fr: "Planifier une exportation mensuelle des enregistrements d'audit de l'équipe de trading dans un fichier CSV stocké dans une bibliothèque SharePoint." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      The default policy keeps Exchange records for 1 year with E5. Audit log retention policies of 3, 5, 7 or 10 years require E5 plus the 10-Year Audit Log Retention add-on license for the users who generate the records. With the add-on assigned, a policy scoped to the trading team and the Exchange record type keeps their records searchable for 3 years.
    fr: |
      Avec E5, la stratégie par défaut conserve les enregistrements Exchange 1 an. Les stratégies de rétention des journaux d'audit de 3, 5, 7 ou 10 ans exigent E5 plus la licence complémentaire 10-Year Audit Log Retention pour les utilisateurs qui génèrent les enregistrements. Une fois la licence attribuée, une stratégie limitée à l'équipe de trading et au type d'enregistrement Exchange garde leurs enregistrements consultables pendant 3 ans.
  options:
    a: { en: "Without the 10-Year Audit Log Retention add-on, the 3-year duration does not apply to the users' records, which fall back to another applicable policy such as the 1-year default.", fr: "Sans la licence complémentaire 10-Year Audit Log Retention, la durée de 3 ans ne s'applique pas aux enregistrements des utilisateurs, qui reviennent à une autre stratégie applicable, comme la stratégie par défaut d'un an." }
    b: { en: "A Microsoft 365 retention policy keeps mailbox content, not the audit records of the activities.", fr: "Une stratégie de rétention Microsoft 365 conserve le contenu des boîtes aux lettres, pas les enregistrements d'audit des activités." }
    d: { en: "Exported CSV files are not searchable in the Audit solution and require recurring manual work.", fr: "Les fichiers CSV exportés ne sont pas consultables dans la solution Audit et demandent un travail manuel récurrent." }
references:
  - title: Manage audit log retention policies
    url: https://learn.microsoft.com/en-us/purview/audit-log-retention-policies
  - title: Learn about auditing solutions in Microsoft Purview
    url: https://learn.microsoft.com/en-us/purview/audit-solutions-overview
