id: sc200-2a-mdo-restricted-unblock
objective: "2.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Litware, Inc. uses Microsoft Defender for Office 365. The default alert policy **User restricted from sending email** fires for a user named User1 after User1's account sends thousands of spam messages.

    You confirm that the account was compromised. You reset the password, enforce multifactor authentication (MFA), and remove a malicious inbox rule. User1 can still receive email but can't send any.

    You need to restore User1's ability to send email.

    What should you do?
  fr: |
    Litware, Inc. utilise Microsoft Defender pour Office 365. La stratégie d'alerte par défaut **User restricted from sending email** se déclenche pour un utilisateur nommé User1 après que son compte a envoyé des milliers de messages de courrier indésirable.

    Vous confirmez que le compte a été compromis. Vous réinitialisez le mot de passe, imposez l'authentification multifacteur (MFA) et supprimez une règle de boîte de réception malveillante. User1 peut toujours recevoir des e-mails, mais ne peut plus en envoyer.

    Vous devez rétablir la capacité de User1 à envoyer des e-mails.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Unblock User1 on the Restricted entities page.", fr: "Débloquer User1 dans la page Entités restreintes." } }
    - { id: b, text: { en: "Release User1's outgoing messages from quarantine.", fr: "Libérer de la quarantaine les messages sortants de User1." } }
    - { id: c, text: { en: "Delete the block entry for User1 in the Tenant Allow/Block List.", fr: "Supprimer l'entrée de blocage de User1 dans la liste d'autorisation/de blocage du locataire." } }
    - { id: d, text: { en: "Raise the recipient limits in the outbound spam policy.", fr: "Augmenter les limites de destinataires dans la stratégie de courrier indésirable sortant." } }
answer: { optionId: a }
explanation:
  correct:
    en: A user who exceeds the outbound sending limits becomes a restricted entity and can't send email until an admin removes the restriction. On Email & collaboration > Review > Restricted entities, select the user and Unblock (or run Remove-BlockedSenderAddress). Restrictions are usually removed within one hour, and at most within 24 hours.
    fr: Un utilisateur qui dépasse les limites d'envoi sortant devient une entité restreinte et ne peut plus envoyer d'e-mails tant qu'un administrateur n'a pas levé la restriction. Dans Email & collaboration > Review > Restricted entities, sélectionnez l'utilisateur puis Unblock (ou exécutez Remove-BlockedSenderAddress). La restriction est généralement levée en une heure, et au plus en 24 heures.
  options:
    b: { en: "The restriction blocks the account itself; releasing messages from quarantine doesn't remove it.", fr: "La restriction bloque le compte lui-même ; libérer des messages de la quarantaine ne la lève pas." }
    c: { en: "The restriction isn't a Tenant Allow/Block List entry; it's listed on the Restricted entities page.", fr: "La restriction n'est pas une entrée de la liste d'autorisation/de blocage du locataire ; elle figure dans la page Entités restreintes." }
    d: { en: "Changing the limits doesn't unblock an account that is already restricted, and it weakens protection against compromised accounts.", fr: "Modifier les limites ne débloque pas un compte déjà restreint et affaiblit la protection contre les comptes compromis." }
references:
  - title: Remove blocked users from the Restricted entities page
    url: https://learn.microsoft.com/en-us/defender-office-365/outbound-spam-restore-restricted-users
