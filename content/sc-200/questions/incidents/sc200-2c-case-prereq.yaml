id: sc200-2c-case-prereq
objective: "2.1.10"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso uses Microsoft Defender XDR and onboarded all its devices to Microsoft Defender for Endpoint. Contoso doesn't use Microsoft Sentinel yet.

    The SOC manager wants to use case management in the Microsoft Defender portal to track a ransomware response that spans six incidents.

    You need to make case management available. What should you do first?
  fr: |
    Contoso utilise Microsoft Defender XDR et a intégré tous ses appareils à Microsoft Defender pour point de terminaison. Contoso n'utilise pas encore Microsoft Sentinel.

    Le responsable du SOC souhaite utiliser la gestion des cas du portail Microsoft Defender pour suivre une réponse à un rançongiciel qui couvre six incidents.

    Vous devez rendre la gestion des cas disponible. Que devez-vous faire en premier ?
body:
  options:
    - id: a
      text: { en: "Turn on Microsoft Defender XDR Unified RBAC for the endpoint workload", fr: "Activer le RBAC unifié de Microsoft Defender XDR pour la charge de travail des points de terminaison" }
    - id: b
      text: { en: "Connect a Microsoft Sentinel workspace to the Microsoft Defender portal", fr: "Connecter un espace de travail Microsoft Sentinel au portail Microsoft Defender" }
    - id: c
      text: { en: "Create a case in Microsoft Purview eDiscovery and add the six incidents", fr: "Créer un cas dans Microsoft Purview eDiscovery et y ajouter les six incidents" }
    - id: d
      text: { en: "Merge the six incidents into one incident in the incident queue", fr: "Fusionner les six incidents en un seul dans la file d'attente des incidents" }
answer: { optionId: b }
explanation:
  correct:
    en: Case management requires a Microsoft Sentinel workspace connected to the Defender portal. Cases then appear under Cases in the Defender portal only, and they can link several incidents, which fits work that spans incidents.
    fr: La gestion des cas exige un espace de travail Microsoft Sentinel connecté au portail Defender. Les cas apparaissent alors sous Cases, uniquement dans le portail Defender, et peuvent lier plusieurs incidents, ce qui convient à un travail qui couvre plusieurs incidents.
  options:
    a:
      en: Unified RBAC controls who can do what, but it doesn't make case management available without a connected Sentinel workspace.
      fr: Le RBAC unifié contrôle qui peut faire quoi, mais il ne rend pas la gestion des cas disponible sans espace de travail Sentinel connecté.
    c:
      en: An eDiscovery case is a Microsoft Purview feature for legal searches and holds; it isn't the SOC case management of the Defender portal.
      fr: Un cas eDiscovery est une fonctionnalité Microsoft Purview pour les recherches et conservations juridiques ; ce n'est pas la gestion des cas SOC du portail Defender.
    d:
      en: Merging changes how alerts are grouped; it doesn't provide case tracking with tasks, comments and attachments, and the incidents may be unrelated technically.
      fr: La fusion modifie le regroupement des alertes ; elle ne fournit pas de suivi par cas avec tâches, commentaires et pièces jointes, et les incidents peuvent ne pas être liés techniquement.
references:
  - title: Manage security operations cases natively in the Microsoft Defender portal
    url: https://learn.microsoft.com/en-us/unified-secops/cases-overview
