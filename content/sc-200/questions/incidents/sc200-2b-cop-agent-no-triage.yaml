id: sc200-2b-cop-agent-no-triage
objective: "2.1.8"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Woodgrove Bank meets all the license and configuration prerequisites of the Microsoft Security Copilot Phishing Triage Agent, and the agent was set up with a new agent identity and the required role.

    A week later, the agent page shows no triaged incidents. In the incident queue, every **Email reported by user as malware or phish** alert is resolved a few seconds after it is created, and the activity shows that it was resolved by alert tuning.

    You need the agent to triage the user-reported phishing alerts.

    What should you do?
  fr: |
    Woodgrove Bank respecte tous les prérequis de licence et de configuration du Phishing Triage Agent de Microsoft Security Copilot, et l'agent a été configuré avec une nouvelle identité d'agent et le rôle requis.

    Une semaine plus tard, la page de l'agent n'affiche aucun incident trié. Dans la file d'attente des incidents, chaque alerte **Email reported by user as malware or phish** est résolue quelques secondes après sa création, et l'activité indique qu'elle a été résolue par le réglage des alertes.

    Vous devez faire en sorte que l'agent trie les alertes d'hameçonnage signalées par les utilisateurs.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Turn off the Email reported by user as malware or phish alert policy.", fr: "Désactiver la stratégie d'alerte Email reported by user as malware or phish." }
    - id: b
      text: { en: "Add the Alerts (manage) permission to the role assigned to the monitoring user group.", fr: "Ajouter l'autorisation Alerts (manage) au rôle attribué au groupe d'utilisateurs chargé de la supervision." }
    - id: c
      text: { en: "Replace the agent identity with an existing user account that has the same permissions.", fr: "Remplacer l'identité de l'agent par un compte d'utilisateur existant disposant des mêmes autorisations." }
    - id: d
      text: { en: "Disable the Auto-Resolve - Email reported by user as malware or phish tuning rule.", fr: "Désactiver la règle de réglage Auto-Resolve - Email reported by user as malware or phish." }
answer: { optionId: d }
explanation:
  correct:
    en: |
      The agent doesn't triage alerts that alert tuning has already resolved. You must disable the built-in Auto-Resolve - Email reported by user as malware or phish tuning rule, and any custom tuning rule that resolves these alerts, so that the alerts stay open for the agent.
    fr: |
      L'agent ne trie pas les alertes que le réglage des alertes a déjà résolues. Vous devez désactiver la règle de réglage intégrée Auto-Resolve - Email reported by user as malware or phish, ainsi que toute règle personnalisée qui résout ces alertes, pour que les alertes restent ouvertes pour l'agent.
  options:
    a: { en: "The alert policy creates the alerts that the agent triages; turning it off removes them entirely.", fr: "La stratégie d'alerte crée les alertes que trie l'agent ; la désactiver les supprime complètement." }
    c: { en: "The identity type doesn't explain alerts resolved by tuning, and a new agent identity is the recommended option.", fr: "Le type d'identité n'explique pas les alertes résolues par le réglage, et une nouvelle identité d'agent est l'option recommandée." }
    b: { en: "The monitoring group's permissions affect who can review the agent's results, not which alerts the agent receives.", fr: "Les autorisations du groupe de supervision déterminent qui peut examiner les résultats de l'agent, pas les alertes que l'agent reçoit." }
references:
  - title: Microsoft Security Copilot Phishing Triage Agent in Microsoft Defender
    url: https://learn.microsoft.com/en-us/defender-xdr/phishing-triage-agent
