id: sc200-cs3a-live-response
objective: "2.2.2"
type: multi
caseStudy: sc200-cs3a-trey-research
difficulty: 2
status: draft
stem:
  en: |
    You need to meet the live response requirement.

    Which two actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez respecter l'exigence relative à la réponse dynamique.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Upload Check-LabDrivers.ps1 to the live response library.", fr: "Charger Check-LabDrivers.ps1 dans la bibliothèque de la réponse dynamique." } }
    - { id: b, text: { en: "Turn on unsigned script execution in the advanced features.", fr: "Activer l'exécution de scripts non signés dans les fonctionnalités avancées." } }
    - { id: c, text: { en: "Turn on live response for servers in the advanced features.", fr: "Activer la réponse dynamique pour les serveurs dans les fonctionnalités avancées." } }
    - { id: d, text: { en: "Grant advanced live response capabilities in the SOC Analyst role.", fr: "Accorder les fonctionnalités de réponse dynamique avancées dans le rôle SOC Analyst." } }
    - { id: e, text: { en: "Collect an investigation package from each lab workstation.", fr: "Collecter un package d'investigation sur chaque poste de travail de laboratoire." } }
answer: { optionIds: [a, d] }
explanation:
  correct:
    en: |
      Downloading a file with getfile is a basic command, which the SOC Analyst role already allows. Running a script uses the run command, which is an advanced command and only runs scripts that are stored in the live response library. You therefore upload the script to the library and add advanced live response to the role.
    fr: |
      Le téléchargement d'un fichier avec getfile est une commande de base, que le rôle SOC Analyst autorise déjà. L'exécution d'un script utilise la commande run, qui est une commande avancée et n'exécute que des scripts stockés dans la bibliothèque de la réponse dynamique. Vous chargez donc le script dans la bibliothèque et ajoutez la réponse dynamique avancée au rôle.
  options:
    b: { en: "The script is signed by the vendor, so unsigned script execution is not needed and would only increase the exposure.", fr: "Le script est signé par l'éditeur : l'exécution de scripts non signés n'est pas nécessaire et augmenterait seulement l'exposition." }
    c: { en: "The targets are Windows 11 workstations, not servers.", fr: "Les cibles sont des postes de travail Windows 11, pas des serveurs." }
    e: { en: "An investigation package collects forensic data; it neither downloads a chosen file nor runs a script.", fr: "Un package d'investigation collecte des données d'analyse ; il ne télécharge pas un fichier choisi et n'exécute pas de script." }
references:
  - title: Investigate entities on devices using live response
    url: https://learn.microsoft.com/en-us/defender-endpoint/live-response
