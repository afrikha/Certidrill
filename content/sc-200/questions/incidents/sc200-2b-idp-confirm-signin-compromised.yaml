id: sc200-2b-idp-confirm-signin-compromised
objective: "2.1.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam uses Microsoft Entra ID Protection. A user risk-based Conditional Access policy requires a secure password change when user risk is **High**. A sign-in-risk policy isn't configured.

    An analyst reviews the **Risky sign-ins** report and confirms that a sign-in of a user named **User2** from an unfamiliar IP address was performed by an attacker. User2 currently has a **Low** user risk.

    What is the effect on User2 when the analyst selects **Confirm sign-in compromised**?
  fr: |
    Fabrikam utilise Microsoft Entra ID Protection. Une stratégie d'accès conditionnel basée sur le risque utilisateur exige un changement de mot de passe sécurisé lorsque le risque utilisateur est **High**. Aucune stratégie de risque de connexion n'est configurée.

    Un analyste examine le rapport **Connexions à risque** et confirme qu'une connexion d'un utilisateur nommé **User2** depuis une adresse IP inconnue a été effectuée par un attaquant. User2 a actuellement un risque utilisateur **Low**.

    Quel est l'effet sur User2 lorsque l'analyste sélectionne **Confirm sign-in compromised** ?
body:
  options:
    - id: a
      text: { en: "The user risk of User2 is raised to High, so the policy requires a secure password change at the next sign-in.", fr: "Le risque utilisateur de User2 passe à High : la stratégie exige donc un changement de mot de passe sécurisé à la prochaine connexion." }
    - id: b
      text: { en: "The password of User2 is reset immediately, and a temporary password is sent to the manager of User2.", fr: "Le mot de passe de User2 est réinitialisé immédiatement, et un mot de passe temporaire est envoyé au responsable de User2." }
    - id: c
      text: { en: "The account of User2 is disabled in Microsoft Entra ID until an administrator selects Confirm user safe.", fr: "Le compte de User2 est désactivé dans Microsoft Entra ID jusqu'à ce qu'un administrateur sélectionne Confirm user safe." }
    - id: d
      text: { en: "Only the selected sign-in is marked as compromised, and the user risk of User2 stays Low.", fr: "Seule la connexion sélectionnée est marquée comme compromise, et le risque utilisateur de User2 reste Low." }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Confirming a sign-in as compromised is true positive feedback. ID Protection raises the aggregate risk of the sign-in to High and also raises the risk of the user to High, so the existing user risk policy applies and User2 must perform a secure password change after MFA.
    fr: |
      Confirmer qu'une connexion est compromise constitue un retour de type vrai positif. ID Protection fait passer le risque agrégé de la connexion à High et fait aussi passer le risque de l'utilisateur à High : la stratégie de risque utilisateur existante s'applique et User2 doit effectuer un changement de mot de passe sécurisé après la MFA.
  options:
    b: { en: "Confirming a sign-in compromised doesn't reset any password; generating a temporary password is a separate admin action.", fr: "Confirmer qu'une connexion est compromise ne réinitialise aucun mot de passe ; la génération d'un mot de passe temporaire est une action d'administrateur distincte." }
    c: { en: "The feedback doesn't disable the account. Blocking the user is a separate containment action that the analyst takes when needed.", fr: "Le retour ne désactive pas le compte. Le blocage de l'utilisateur est une action de confinement distincte que l'analyste effectue si nécessaire." }
    d: { en: "The feedback also raises the risk of the underlying user to High, not only the risk of the sign-in.", fr: "Le retour fait aussi passer le risque de l'utilisateur concerné à High, pas seulement celui de la connexion." }
references:
  - title: Provide risk feedback in Microsoft Entra ID Protection
    url: https://learn.microsoft.com/en-us/entra/id-protection/howto-identity-protection-risk-feedback
