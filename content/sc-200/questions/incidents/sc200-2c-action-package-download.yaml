id: sc200-2c-action-package-download
objective: "2.2.2"
type: ordering
difficulty: 1
status: draft
stem:
  en: |
    A Windows Server 2022 server named **SRV-DB-02** is onboarded to Microsoft Defender for Endpoint and might be compromised.

    You need to collect forensic data about the processes, services, scheduled tasks, autoruns and Security event log of SRV-DB-02, without interacting with a shell. You plan to download the result later from the portal.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Un serveur Windows Server 2022 nommé **SRV-DB-02** est intégré à Microsoft Defender pour point de terminaison et pourrait être compromis.

    Vous devez collecter des données forensiques sur les processus, les services, les tâches planifiées, les exécutions automatiques et le journal des événements de sécurité de SRV-DB-02, sans interagir avec un shell. Vous prévoyez de télécharger le résultat plus tard depuis le portail.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: open, text: { en: "Open the device page of SRV-DB-02.", fr: "Ouvrir la page de l'appareil SRV-DB-02." } }
    - { id: collect, text: { en: "Select Collect investigation package, enter a reason, and select Confirm.", fr: "Sélectionner Collect investigation package, saisir une raison et sélectionner Confirm." } }
    - { id: center, text: { en: "Open the Action center.", fr: "Ouvrir l'Action center." } }
    - { id: download, text: { en: "Select Package collection package available to download the zip file.", fr: "Sélectionner Package collection package available pour télécharger le fichier zip." } }
    - { id: lr, text: { en: "Initiate a live response session and run getfile on the Prefetch folder.", fr: "Ouvrir une session de réponse dynamique et exécuter getfile sur le dossier Prefetch." } }
    - { id: isolate, text: { en: "Isolate SRV-DB-02 from the network.", fr: "Isoler SRV-DB-02 du réseau." } }
    - { id: library, text: { en: "Open the Library management page and download the package.", fr: "Ouvrir la page Library management et télécharger le package." } }
answer:
  sequence: [ open, collect, center, download ]
explanation:
  correct:
    en: The investigation package is a response action of the device page. After you confirm the collection, the Action center shows the result, and selecting Package collection package available downloads the zip file, which contains folders such as Autoruns, Processes, Services, Scheduled tasks and Security event log.
    fr: Le package d'investigation est une action de réponse de la page de l'appareil. Après la confirmation de la collecte, l'Action center affiche le résultat, et sélectionner Package collection package available télécharge le fichier zip, qui contient des dossiers comme Autoruns, Processes, Services, Scheduled tasks et Security event log.
  options:
    lr: { en: "Live response is an interactive shell, which the requirement excludes.", fr: "La réponse dynamique est un shell interactif, que l'exigence exclut." }
    isolate: { en: "Isolation contains the server but doesn't collect forensic data, and the collection doesn't require it.", fr: "L'isolation confine le serveur mais ne collecte pas de données forensiques, et la collecte ne l'exige pas." }
    library: { en: "The live response library stores files to push to devices; packages are downloaded from the Action center.", fr: "La bibliothèque de réponse dynamique stocke des fichiers à envoyer aux appareils ; les packages se téléchargent depuis l'Action center." }
references:
  - title: Take response actions on a device in Microsoft Defender for Endpoint
    url: https://learn.microsoft.com/en-us/defender-endpoint/respond-machine-alerts
