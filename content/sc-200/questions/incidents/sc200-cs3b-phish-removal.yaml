id: sc200-cs3b-phish-removal
objective: "2.1.1"
type: dragdrop
caseStudy: sc200-cs3b-humongous-insurance
difficulty: 2
status: draft
stem:
  en: |
    The SOC identifies a phishing campaign that delivered 80 messages to the claims department.

    You need to meet the phishing requirement.

    What should you use for each step? To answer, drag the appropriate items to the correct steps. Each item may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Le SOC identifie une campagne d'hameçonnage qui a remis 80 messages au service des sinistres.

    Vous devez respecter l'exigence relative à l'hameçonnage.

    Que devez-vous utiliser pour chaque étape ? Pour répondre, faites glisser les éléments appropriés vers les étapes correspondantes. Chaque élément peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: explorer, text: Threat Explorer }
    - { id: action, text: Action center }
    - { id: purge, text: { en: "The Search and Purge role", fr: "Le rôle Search and Purge" } }
    - { id: reader, text: { en: "The Security Reader role", fr: "Le rôle Security Reader" } }
    - { id: content, text: { en: "Content search in Microsoft Purview eDiscovery", fr: "La recherche de contenu dans Microsoft Purview eDiscovery" } }
    - { id: submissions, text: { en: "The Submissions page", fr: "La page Submissions" } }
  targets:
    - id: start
      text: { en: "Tier-1 analysts select the delivered messages and add them to a remediation from:", fr: "Les analystes de niveau 1 sélectionnent les messages remis et les ajoutent à une correction depuis :" }
    - id: approve
      text: { en: "Tier-2 analysts approve the pending remediation in:", fr: "Les analystes de niveau 2 approuvent la correction en attente dans :" }
    - id: perm
      text: { en: "Permission that allows tier-2 analysts, but not tier-1 analysts, to approve the removal:", fr: "Autorisation qui permet aux analystes de niveau 2, mais pas à ceux de niveau 1, d'approuver la suppression :" }
answer:
  mapping: { start: explorer, approve: action, perm: purge }
explanation:
  correct:
    en: |
      In Threat Explorer, analysts select delivered messages and choose a remediation action. A user without the Search and Purge role can only add the messages to a remediation, which then waits on the Pending tab of the Action center until a user who has Search and Purge approves it. The tier-2 analysts get this role through the SOC-Purge role group, which enforces the two-step approval.
    fr: |
      Dans Threat Explorer, les analystes sélectionnent les messages remis et choisissent une action de correction. Un utilisateur sans le rôle Search and Purge peut seulement ajouter les messages à une correction, qui attend ensuite dans l'onglet Pending de l'Action center qu'un utilisateur disposant de Search and Purge l'approuve. Les analystes de niveau 2 obtiennent ce rôle par le groupe de rôles SOC-Purge, ce qui impose l'approbation en deux étapes.
  options:
    reader: { en: "Security Reader grants read-only access; it does not allow approving the removal of messages.", fr: "Security Reader accorde un accès en lecture seule ; il ne permet pas d'approuver la suppression de messages." }
    content: { en: "Content search finds items for investigation, but the two-step remediation flow is started from Threat Explorer or advanced hunting.", fr: "La recherche de contenu trouve des éléments pour l'investigation, mais le flux de correction en deux étapes se lance depuis Threat Explorer ou le repérage avancé." }
    submissions: { en: "Submissions reports messages to Microsoft for analysis; it does not remove delivered messages from mailboxes.", fr: "Submissions signale des messages à Microsoft pour analyse ; il ne supprime pas les messages remis des boîtes aux lettres." }
references:
  - title: Remediate malicious email delivered in Office 365
    url: https://learn.microsoft.com/en-us/defender-office-365/remediate-malicious-email-delivered-office-365
