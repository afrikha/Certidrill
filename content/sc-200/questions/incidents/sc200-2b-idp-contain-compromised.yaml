id: sc200-2b-idp-contain-compromised
objective: "2.1.5"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Contoso has Microsoft Entra ID P2. An investigation shows that an attacker knows the password of a user named **User9** and registered a new authenticator app on the account. You select **Confirm user compromised** for User9.

    You need to stop the attacker from using the account and its existing sessions until the investigation ends.

    Which two actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso dispose de Microsoft Entra ID P2. Une enquête montre qu'un attaquant connaît le mot de passe d'un utilisateur nommé **User9** et a inscrit une nouvelle application d'authentification sur le compte. Vous sélectionnez **Confirm user compromised** pour User9.

    Vous devez empêcher l'attaquant d'utiliser le compte et ses sessions existantes jusqu'à la fin de l'enquête.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Block sign-in for User9.", fr: "Bloquer la connexion de User9." } }
    - { id: b, text: { en: "Select Dismiss user risk for User9.", fr: "Sélectionner Dismiss user risk pour User9." } }
    - { id: c, text: { en: "Require User9 to perform a secure password change at the next sign-in.", fr: "Exiger que User9 effectue un changement de mot de passe sécurisé à la prochaine connexion." } }
    - { id: d, text: { en: "Revoke the refresh tokens of User9.", fr: "Révoquer les jetons d'actualisation de User9." } }
    - { id: e, text: { en: "Select Confirm sign-in safe for the sign-ins of User9.", fr: "Sélectionner Confirm sign-in safe pour les connexions de User9." } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: |
      When the attacker can reset the password or perform MFA, the guidance is to block the user, because any self-remediation could be completed by the attacker. Revoking the refresh tokens ends the existing sessions, so the attacker must authenticate again and is stopped by the block.
    fr: |
      Lorsque l'attaquant peut réinitialiser le mot de passe ou effectuer la MFA, il est recommandé de bloquer l'utilisateur, car toute correction autonome pourrait être effectuée par l'attaquant. La révocation des jetons d'actualisation met fin aux sessions existantes : l'attaquant doit se réauthentifier et est arrêté par le blocage.
  options:
    c: { en: "A secure password change requires MFA first, and the attacker controls an MFA method, so the attacker could complete it.", fr: "Un changement de mot de passe sécurisé exige d'abord la MFA, et l'attaquant contrôle une méthode MFA : il pourrait donc l'effectuer." }
    b: { en: "Dismissing the risk closes it without changing the password or ending sessions.", fr: "Ignorer le risque le ferme sans changer le mot de passe ni mettre fin aux sessions." }
    e: { en: "The sign-ins were performed by the attacker; marking them safe is wrong feedback and doesn't contain anything.", fr: "Les connexions ont été effectuées par l'attaquant ; les marquer comme sûres est un retour erroné qui ne contient rien." }
references:
  - title: Remediate risks and unblock users
    url: https://learn.microsoft.com/en-us/entra/id-protection/howto-identity-protection-remediate-unblock
  - title: Investigate risk with Microsoft Entra ID Protection
    url: https://learn.microsoft.com/en-us/entra/id-protection/howto-identity-protection-investigate-risk
