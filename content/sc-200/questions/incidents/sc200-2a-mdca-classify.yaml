id: sc200-2a-mdca-classify
objective: "2.1.4"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    Adatum Corporation uses Microsoft Defender for Cloud Apps. Analysts must classify each alert after the investigation.

    How should the analysts classify the following alerts? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum Corporation utilise Microsoft Defender pour les applications cloud. Les analystes doivent classer chaque alerte après l'enquête.

    Comment les analystes doivent-ils classer les alertes suivantes ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      An Activity from infrequent country alert for an approved penetration tester who works from that country during the test: [[s1]]

      An Impossible travel alert caused by the corporate VPN, whose address range isn't tagged yet: [[s2]]

      A Ransomware activity alert for which the user confirms that they didn't perform the activity: [[s3]]
    fr: |
      Une alerte Activity from infrequent country pour un testeur d'intrusion autorisé qui travaille depuis ce pays pendant le test : [[s1]]

      Une alerte Impossible travel causée par le VPN de l'entreprise, dont la plage d'adresses n'est pas encore étiquetée : [[s2]]

      Une alerte Ransomware activity pour laquelle l'utilisateur confirme qu'il n'a pas effectué l'activité : [[s3]]
  slots:
    - id: s1
      options:
        - { id: tp, text: { en: "True positive", fr: "Vrai positif" } }
        - { id: btp, text: { en: "Benign true positive", fr: "Vrai positif bénin" } }
        - { id: fp, text: { en: "False positive", fr: "Faux positif" } }
    - id: s2
      options:
        - { id: tp, text: { en: "True positive", fr: "Vrai positif" } }
        - { id: btp, text: { en: "Benign true positive", fr: "Vrai positif bénin" } }
        - { id: fp, text: { en: "False positive", fr: "Faux positif" } }
    - id: s3
      options:
        - { id: tp, text: { en: "True positive", fr: "Vrai positif" } }
        - { id: btp, text: { en: "Benign true positive", fr: "Vrai positif bénin" } }
        - { id: fp, text: { en: "False positive", fr: "Faux positif" } }
answer:
  values: { s1: btp, s2: fp, s3: tp }
explanation:
  correct:
    en: |
      A benign true positive is an alert on suspicious but not malicious activity, such as a penetration test or another authorized action. An untagged VPN range is listed as a false positive cause for Impossible travel: you dismiss the alert and tag the range. Ransomware activity that the user didn't perform is a true positive: suspend the user, mark the user as compromised and reset the password.
    fr: |
      Un vrai positif bénin est une alerte sur une activité suspecte mais non malveillante, comme un test d'intrusion ou une autre action autorisée. Une plage VPN non étiquetée figure parmi les causes de faux positifs de Impossible travel : vous ignorez l'alerte et étiquetez la plage. Une activité de rançongiciel que l'utilisateur n'a pas effectuée est un vrai positif : suspendez l'utilisateur, marquez-le comme compromis et réinitialisez son mot de passe.
references:
  - title: How to investigate anomaly detection alerts
    url: https://learn.microsoft.com/en-us/defender-cloud-apps/investigate-anomaly-alerts
