id: sc200-sr1-timeline-export-3
objective: "2.2.1"
type: series_yesno
series: sc200-sr1-timeline-export
seriesOrder: 3
difficulty: 2
status: draft
stem:
  en: You export a custom date range and apply the Techniques data type filter.
  fr: Vous exportez une plage de dates personnalisée et appliquez le filtre de type de données Techniques.
body:
  solution:
    en: |
      On the **Timeline** tab of DEV-FIN-07, you set a custom range from November 9 to November 12 and select **Export**. You then open **Filters**, select the **Techniques** data type and select **Apply**.
    fr: |
      Dans l'onglet **Timeline** de DEV-FIN-07, vous définissez une plage personnalisée du 9 au 12 novembre et sélectionnez **Export**. Vous ouvrez ensuite **Filters**, sélectionnez le type de données **Techniques** et sélectionnez **Apply**.
answer: { value: false }
explanation:
  correct:
    en: |
      The export meets the first requirement. The Techniques filter, however, only changes your own view: it shows the MITRE ATT&CK techniques that Defender for Endpoint inferred, not the events you selected, and it marks nothing for other analysts. Key events are marked with the flag icon and displayed with the **Flagged events** filter.
    fr: |
      L'exportation répond à la première exigence. Le filtre Techniques, en revanche, ne modifie que votre propre affichage : il montre les techniques MITRE ATT&CK que Defender for Endpoint a déduites, pas les événements que vous avez choisis, et il ne marque rien pour les autres analystes. Les événements clés se marquent avec l'icône de drapeau et s'affichent avec le filtre **Flagged events**.
references:
  - title: Investigate devices in Microsoft Defender for Endpoint
    url: https://learn.microsoft.com/en-us/defender-endpoint/investigate-machines
