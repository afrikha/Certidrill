id: sc200-2b-sen-unsynced-incidents
objective: "2.1.7"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    Tailspin Toys onboarded its Microsoft Sentinel workspace to the Microsoft Defender portal. Analysts now work from the unified incident queue. Some analysts report that certain incidents visible in the Azure portal never appear in the Defender portal.

    Which two types of incidents aren't synchronized to the Defender portal?

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin Toys a intégré son espace de travail Microsoft Sentinel au portail Microsoft Defender. Les analystes travaillent désormais depuis la file d'attente d'incidents unifiée. Certains analystes signalent que des incidents visibles dans le portail Azure n'apparaissent jamais dans le portail Defender.

    Quels sont les deux types d'incidents qui ne sont pas synchronisés vers le portail Defender ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Incidents created from a scheduled analytics rule", fr: "Les incidents créés à partir d'une règle d'analytique planifiée" } }
    - { id: b, text: { en: "Incidents created manually in the Azure portal", fr: "Les incidents créés manuellement dans le portail Azure" } }
    - { id: c, text: { en: "Incidents created by a Logic Apps playbook", fr: "Les incidents créés par un playbook Logic Apps" } }
    - { id: d, text: { en: "Incidents created from a near-real-time (NRT) analytics rule", fr: "Les incidents créés à partir d'une règle d'analytique quasi en temps réel (NRT)" } }
    - { id: e, text: { en: "Incidents that combine Microsoft Sentinel and Defender for Endpoint alerts", fr: "Les incidents qui combinent des alertes Microsoft Sentinel et Defender for Endpoint" } }
answer: { optionIds: [ b, c ] }
explanation:
  correct:
    en: |
      Incidents created through the API, by a Logic Apps playbook or manually in the Azure portal aren't synchronized to the Defender portal; they stay supported in the Azure portal and the API. Incidents from analytics rules, and incidents that the correlation engine builds from Sentinel and Defender XDR alerts, appear in the unified queue.
    fr: |
      Les incidents créés par l'API, par un playbook Logic Apps ou manuellement dans le portail Azure ne sont pas synchronisés vers le portail Defender ; ils restent pris en charge dans le portail Azure et l'API. Les incidents issus des règles d'analytique, et ceux que le moteur de corrélation construit à partir d'alertes Sentinel et Defender XDR, apparaissent dans la file d'attente unifiée.
  options:
    a: { en: "Alerts from scheduled rules are correlated into incidents by the Defender XDR engine and appear in the Defender portal.", fr: "Les alertes des règles planifiées sont corrélées en incidents par le moteur de Defender XDR et apparaissent dans le portail Defender." }
    d: { en: "NRT rule alerts are processed like other analytics rule alerts and appear in the Defender portal.", fr: "Les alertes des règles NRT sont traitées comme celles des autres règles d'analytique et apparaissent dans le portail Defender." }
    e: { en: "Cross-domain correlation of Sentinel and Defender XDR alerts is a core feature of the unified queue.", fr: "La corrélation interdomaine des alertes Sentinel et Defender XDR est une fonctionnalité centrale de la file d'attente unifiée." }
references:
  - title: Transition your Microsoft Sentinel environment to the Defender portal
    url: https://learn.microsoft.com/en-us/azure/sentinel/move-to-defender
