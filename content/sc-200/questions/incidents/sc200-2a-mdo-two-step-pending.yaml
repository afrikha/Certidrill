id: sc200-2a-mdo-two-step-pending
objective: "2.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso, Ltd. uses Microsoft Defender for Office 365 Plan 2. A SOC analyst named Analyst1 can use Threat Explorer, but Analyst1 isn't assigned the Search and Purge role or an equivalent permission.

    Analyst1 selects 40 phishing messages in the **All email** view, opens the **Take action** wizard, and submits a **Soft delete** action.

    What happens to the action?
  fr: |
    Contoso, Ltd. utilise Microsoft Defender pour Office 365 Plan 2. Un analyste SOC nommé Analyst1 peut utiliser l'Explorateur de menaces (Threat Explorer), mais Analyst1 ne dispose ni du rôle Search and Purge ni d'une autorisation équivalente.

    Analyst1 sélectionne 40 messages d'hameçonnage dans la vue **All email**, ouvre l'Assistant **Take action** et soumet une action **Soft delete**.

    Qu'advient-il de l'action ?
body:
  options:
    - { id: a, text: { en: "It runs immediately and is logged on the History tab.", fr: "Elle s'exécute immédiatement et est journalisée dans l'onglet Historique." } }
    - { id: b, text: { en: "It waits on the Pending tab of the Action center for approval.", fr: "Elle attend une approbation dans l'onglet En attente du centre de notifications." } }
    - { id: c, text: { en: "The messages move to quarantine until an admin releases them.", fr: "Les messages passent en quarantaine jusqu'à ce qu'un administrateur les libère." } }
    - { id: d, text: { en: "The messages are submitted to Microsoft for grader analysis.", fr: "Les messages sont envoyés à Microsoft pour une analyse par des évaluateurs." } }
answer: { optionId: b }
explanation:
  correct:
    en: Without the Search and Purge role (or the equivalent unified RBAC permission), the analyst can only add the messages to remediation. This is the two-step approval model, in which the action waits on the Pending tab of Actions & submissions > Action center until an authorized user approves it.
    fr: Sans le rôle Search and Purge (ou l'autorisation RBAC unifiée équivalente), l'analyste peut seulement ajouter les messages à la correction. C'est le modèle d'approbation en deux étapes, dans lequel l'action attend dans l'onglet En attente de Actions et envois > Centre de notifications jusqu'à ce qu'un utilisateur autorisé l'approuve.
  options:
    a: { en: "Direct approval, with immediate execution, applies only to users who have the Search and Purge permission.", fr: "L'approbation directe, avec exécution immédiate, ne concerne que les utilisateurs disposant de l'autorisation Search and Purge." }
    c: { en: "Soft delete moves messages to Recoverable Items, not to quarantine, and nothing happens before the approval.", fr: "Soft delete déplace les messages vers les éléments récupérables, pas en quarantaine, et rien ne se passe avant l'approbation." }
    d: { en: "Submissions to Microsoft are made from the Submissions page; a Take action remediation isn't a submission.", fr: "Les envois à Microsoft se font depuis la page Envois ; une correction Take action n'est pas un envoi." }
references:
  - title: Remediate malicious email that was delivered in Office 365
    url: https://learn.microsoft.com/en-us/defender-office-365/remediate-malicious-email-delivered-office-365
