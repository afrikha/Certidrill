stem:
  en: You restrict app execution on the 14 devices.
  fr: Vous restreignez l'exécution des applications sur les 14 appareils.
body:
  solution:
    en: |
      From the file page of PayView.exe, you open the device page of each of the 14 devices on which the file was observed, and you select **Restrict app execution**.
    fr: |
      Depuis la page de fichier de PayView.exe, vous ouvrez la page de chacun des 14 appareils sur lesquels le fichier a été observé, et vous sélectionnez **Restrict app execution**.
answer: { value: false }
explanation:
  correct:
    en: |
      Restrict app execution allows only files signed by Microsoft to run, so it would also block the other non-Microsoft applications of the 14 devices. It does not remove PayView.exe from the devices and does not protect the devices on which the file has not been observed yet.
    fr: |
      Restrict app execution n'autorise que les fichiers signés par Microsoft : cette action bloquerait aussi les autres applications non Microsoft des 14 appareils. Elle ne supprime pas PayView.exe des appareils et ne protège pas les appareils sur lesquels le fichier n'a pas encore été observé.
references:
  - title: Take response actions on a device in Microsoft Defender for Endpoint
    url: https://learn.microsoft.com/en-us/defender-endpoint/respond-machine-alerts
