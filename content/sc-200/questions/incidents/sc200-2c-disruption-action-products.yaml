id: sc200-2c-disruption-action-products
objective: "2.2.4"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Woodgrove Bank deployed the Microsoft Defender XDR workloads. You review an incident in which automatic attack disruption took four actions.

    Which product performed each action? To answer, drag the appropriate products to the correct actions. Each product may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove Bank a déployé les charges de travail de Microsoft Defender XDR. Vous examinez un incident dans lequel l'interruption automatique d'attaque a effectué quatre actions.

    Quel produit a effectué chaque action ? Pour répondre, faites glisser les produits appropriés vers les actions correspondantes. Chaque produit peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: mde, text: Microsoft Defender for Endpoint }
    - { id: mdi, text: Microsoft Defender for Identity }
    - { id: entra, text: Microsoft Entra ID }
    - { id: mdca, text: Microsoft Defender for Cloud Apps }
    - { id: mdo, text: Microsoft Defender for Office 365 }
  targets:
    - id: contain
      text: { en: "Contain device", fr: "Contain device (confiner l'appareil)" }
    - id: disable
      text: { en: "Disable user (Active Directory account)", fr: "Disable user (compte Active Directory)" }
    - id: revoke
      text: { en: "Revoke user session", fr: "Revoke user session (révoquer la session de l'utilisateur)" }
    - id: oauth
      text: { en: "Protective measures on a compromised OAuth app", fr: "Mesures de protection sur une application OAuth compromise" }
answer:
  mapping: { contain: mde, disable: mdi, revoke: entra, oauth: mdca }
explanation:
  correct:
    en: Defender for Endpoint contains devices (and IP addresses and users on onboarded devices). Defender for Identity disables Active Directory accounts through domain controllers that run its sensor. Microsoft Entra ID revokes sessions and suspends users, and Defender for Cloud Apps acts on compromised OAuth apps.
    fr: Defender pour point de terminaison confine les appareils (ainsi que les adresses IP et les utilisateurs sur les appareils intégrés). Defender pour Identity désactive les comptes Active Directory par les contrôleurs de domaine qui exécutent son capteur. Microsoft Entra ID révoque les sessions et suspend les utilisateurs, et Defender for Cloud Apps agit sur les applications OAuth compromises.
  options:
    mdo: { en: "Defender for Office 365 provides signals and mailbox auditing requirements, but none of these four actions.", fr: "Defender pour Office 365 fournit des signaux et des exigences d'audit des boîtes aux lettres, mais aucune de ces quatre actions." }
references:
  - title: Automatic attack disruption in Microsoft Defender
    url: https://learn.microsoft.com/en-us/defender-xdr/automatic-attack-disruption
