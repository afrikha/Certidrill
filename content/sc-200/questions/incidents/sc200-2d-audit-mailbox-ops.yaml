id: sc200-2d-audit-mailbox-ops
objective: "2.3.1"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Northwind Traders uses Microsoft 365 and Microsoft Purview Audit. You investigate the mailbox of a finance manager after a business email compromise.

    You need to identify the audit log operation to search for each investigation question.

    Which operation should you use for each question? To answer, drag the appropriate operations to the correct questions. Each operation may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind Traders utilise Microsoft 365 et Microsoft Purview Audit. Vous examinez la boîte aux lettres d'un responsable financier après une compromission de messagerie professionnelle.

    Vous devez identifier l'opération du journal d'audit à rechercher pour chaque question d'enquête.

    Quelle opération devez-vous utiliser pour chaque question ? Pour répondre, faites glisser les opérations appropriées vers les questions correspondantes. Chaque opération peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: hard, text: HardDelete }
    - { id: soft, text: SoftDelete }
    - { id: sendas, text: SendAs }
    - { id: behalf, text: SendOnBehalf }
    - { id: perm, text: Add-MailboxPermission }
    - { id: move, text: MoveToDeletedItems }
  targets:
    - id: q1
      text: { en: "Were messages purged from the mailbox so that they no longer appear in Recoverable Items?", fr: "Des messages ont-ils été purgés de la boîte aux lettres, au point de ne plus apparaître dans Éléments récupérables ?" }
    - id: q2
      text: { en: "Did someone send a message that appears to come directly from the finance manager's mailbox, without any delegate mention?", fr: "Quelqu'un a-t-il envoyé un message qui semble provenir directement de la boîte aux lettres du responsable financier, sans mention de délégué ?" }
    - id: q3
      text: { en: "Did the attacker give another account access to the mailbox?", fr: "L'attaquant a-t-il donné à un autre compte l'accès à la boîte aux lettres ?" }
    - id: q4
      text: { en: "Were messages deleted from the Deleted Items folder?", fr: "Des messages ont-ils été supprimés du dossier Éléments supprimés ?" }
answer:
  mapping: { q1: hard, q2: sendas, q3: perm, q4: soft }
explanation:
  correct:
    en: |
      HardDelete records messages purged from the mailbox. SendAs records a message sent with Send As permissions, which appears to come from the mailbox itself, whereas SendOnBehalf shows the delegate. Add-MailboxPermission records delegate permissions added to the mailbox. SoftDelete records messages deleted from the Deleted Items folder, while MoveToDeletedItems records messages moved into that folder.
    fr: |
      HardDelete enregistre les messages purgés de la boîte aux lettres. SendAs enregistre un message envoyé avec l'autorisation Send As, qui semble provenir de la boîte aux lettres elle-même, alors que SendOnBehalf fait apparaître le délégué. Add-MailboxPermission enregistre les autorisations de délégué ajoutées à la boîte aux lettres. SoftDelete enregistre les messages supprimés du dossier Éléments supprimés, tandis que MoveToDeletedItems enregistre les messages déplacés vers ce dossier.
  options:
    behalf: { en: "SendOnBehalf messages show that a delegate sent them on behalf of the mailbox owner.", fr: "Les messages SendOnBehalf indiquent qu'un délégué les a envoyés pour le compte du propriétaire de la boîte aux lettres." }
    move: { en: "MoveToDeletedItems is the first deletion step: the messages are only moved to Deleted Items.", fr: "MoveToDeletedItems est la première étape de suppression : les messages sont seulement déplacés vers Éléments supprimés." }
references:
  - title: Audit log activities
    url: https://learn.microsoft.com/en-us/purview/audit-log-activities
