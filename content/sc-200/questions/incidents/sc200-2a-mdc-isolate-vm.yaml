id: sc200-2a-mdc-isolate-vm
objective: "2.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Tailspin Toys uses Microsoft Defender for Cloud with the Defender for Servers plan, which onboards the Azure VMs to Microsoft Defender for Endpoint. A high-severity alert reports ransomware behavior on a Windows VM named VM-FIN01.

    You need to stop VM-FIN01 from communicating with any other device immediately, while keeping its connection to the Defender for Endpoint service for the investigation. The solution must minimize administrative effort.

    What should you do?
  fr: |
    Tailspin Toys utilise Microsoft Defender pour le cloud avec le plan Defender pour serveurs, qui intègre les machines virtuelles Azure à Microsoft Defender for Endpoint. Une alerte de gravité élevée signale un comportement de rançongiciel sur une machine virtuelle Windows nommée VM-FIN01.

    Vous devez empêcher immédiatement VM-FIN01 de communiquer avec tout autre appareil, tout en conservant sa connexion au service Defender for Endpoint pour l'enquête. La solution doit réduire au minimum l'effort d'administration.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Open the device page of VM-FIN01 in the Defender portal and select Isolate device.", fr: "Ouvrir la page d'appareil de VM-FIN01 dans le portail Defender et sélectionner Isolate device." } }
    - { id: b, text: { en: "Follow the manual steps in the Mitigate the threat section of the alert.", fr: "Suivre les étapes manuelles de la section Mitigate the threat de l'alerte." } }
    - { id: c, text: { en: "Enable just-in-time VM access on VM-FIN01.", fr: "Activer l'accès juste-à-temps à la machine virtuelle VM-FIN01." } }
    - { id: d, text: { en: "Select Suppress similar alerts and create a suppression rule.", fr: "Sélectionner Suppress similar alerts et créer une règle de suppression." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Defender for Servers integrates Defender for Endpoint, so the VM is an onboarded device in the Defender portal. Isolate device disconnects it from the network in one action while keeping the connection to the Defender for Endpoint service, which lets you keep investigating.
    fr: |
      Defender pour serveurs intègre Defender for Endpoint : la machine virtuelle est un appareil intégré du portail Defender. Isolate device la déconnecte du réseau en une seule action tout en conservant la connexion au service Defender for Endpoint, ce qui permet de poursuivre l'enquête.
  options:
    b: { en: "Mitigate the threat lists manual remediation steps; following them takes more effort and doesn't isolate the VM immediately.", fr: "Mitigate the threat liste des étapes de correction manuelles ; les suivre demande plus d'effort et n'isole pas immédiatement la machine virtuelle." }
    c: { en: "Just-in-time access locks the inbound management ports; it doesn't stop the VM from communicating with other devices.", fr: "L'accès juste-à-temps verrouille les ports de gestion entrants ; il n'empêche pas la machine virtuelle de communiquer avec d'autres appareils." }
    d: { en: "A suppression rule hides future similar alerts; it does nothing against the ongoing attack.", fr: "Une règle de suppression masque les futures alertes similaires ; elle ne fait rien contre l'attaque en cours." }
references:
  - title: Take response actions on a device in Microsoft Defender for Endpoint
    url: https://learn.microsoft.com/en-us/defender-endpoint/respond-machine-alerts
  - title: Manage and respond to security alerts
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/manage-respond-alerts
