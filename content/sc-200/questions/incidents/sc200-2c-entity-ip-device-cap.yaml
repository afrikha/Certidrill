id: sc200-2c-entity-ip-device-cap
objective: "2.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove Bank has 9,000 devices onboarded to Microsoft Defender for Endpoint. You investigate the IP address 203.0.113.200, which is linked to a phishing campaign.

    The IP prevalence card of its IP address page shows that 230 devices connected to the address, but the list of devices that communicated with it stops at 100 devices.

    You need the complete list of devices that connected to 203.0.113.200 during the last 30 days.

    What should you do?
  fr: |
    Woodgrove Bank dispose de 9 000 appareils intégrés à Microsoft Defender pour point de terminaison. Vous analysez l'adresse IP 203.0.113.200, liée à une campagne d'hameçonnage.

    La carte de prévalence de sa page d'adresse IP indique que 230 appareils se sont connectés à l'adresse, mais la liste des appareils qui ont communiqué avec elle s'arrête à 100 appareils.

    Vous avez besoin de la liste complète des appareils qui se sont connectés à 203.0.113.200 au cours des 30 derniers jours.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Change the time period of the IP prevalence card", fr: "Modifier la période de la carte de prévalence de l'adresse IP" }
    - id: b
      text: { en: "Create an IP address indicator in audit mode and review the generated alerts", fr: "Créer un indicateur d'adresse IP en mode audit et examiner les alertes générées" }
    - id: c
      text: { en: "Initiate an automated investigation on one of the listed devices", fr: "Lancer une investigation automatisée sur l'un des appareils listés" }
    - id: d
      text: { en: "Run an advanced hunting query on DeviceNetworkEvents filtered on RemoteIP", fr: "Exécuter une requête de repérage avancé sur DeviceNetworkEvents filtrée sur RemoteIP" }
answer: { optionId: d }
explanation:
  correct:
    en: The list of devices on the IP address page is capped at 100 devices. An advanced hunting query on DeviceNetworkEvents with `RemoteIP == "203.0.113.200"`, summarized by device, returns every device that connected to the address.
    fr: La liste des appareils de la page d'adresse IP est limitée à 100 appareils. Une requête de repérage avancé sur DeviceNetworkEvents avec `RemoteIP == "203.0.113.200"`, agrégée par appareil, renvoie chaque appareil qui s'est connecté à l'adresse.
  options:
    a:
      en: The time period changes the prevalence figures, not the 100-device cap of the list.
      fr: La période modifie les chiffres de prévalence, pas la limite de 100 appareils de la liste.
    b:
      en: An indicator only acts on connections made after you create it.
      fr: Un indicateur n'agit que sur les connexions établies après sa création.
    c:
      en: An automated investigation analyzes threats on devices; it doesn't list the devices that contacted an address.
      fr: Une investigation automatisée analyse les menaces sur les appareils ; elle ne liste pas les appareils qui ont contacté une adresse.
references:
  - title: Investigate an IP address associated with a Microsoft Defender for Endpoint alert
    url: https://learn.microsoft.com/en-us/defender-endpoint/investigate-ip
  - title: DeviceNetworkEvents table in the advanced hunting schema
    url: https://learn.microsoft.com/en-us/defender-xdr/advanced-hunting-devicenetworkevents-table
