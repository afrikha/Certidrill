id: sc200-2c-entity-deep-analysis
objective: "2.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An alert in Microsoft Defender for Endpoint involves an unknown executable named **invoice_viewer.exe** that was observed on a Windows 11 device.

    You need a report of what the file does when it runs, including the IP addresses that it contacts, the files that it creates on disk and the registry changes that it makes. The file must not run on any of your devices.

    What should you do?
  fr: |
    Une alerte de Microsoft Defender pour point de terminaison concerne un exécutable inconnu nommé **invoice_viewer.exe** observé sur un appareil Windows 11.

    Vous avez besoin d'un rapport sur ce que fait le fichier quand il s'exécute, y compris les adresses IP qu'il contacte, les fichiers qu'il crée sur le disque et les modifications qu'il apporte au Registre. Le fichier ne doit s'exécuter sur aucun de vos appareils.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Open a live response session on the device and run analyze on the file", fr: "Ouvrir une session de réponse dynamique sur l'appareil et exécuter analyze sur le fichier" }
    - id: b
      text: { en: "Select Go hunt on the file page and review the query results", fr: "Sélectionner Go hunt sur la page du fichier et examiner les résultats de la requête" }
    - id: c
      text: { en: "Download the file and run it on an analyst workstation", fr: "Télécharger le fichier et l'exécuter sur un poste d'analyste" }
    - id: d
      text: { en: "Submit the file on the Deep analysis tab of the file page", fr: "Soumettre le fichier dans l'onglet Deep analysis de la page du fichier" }
answer: { optionId: d }
explanation:
  correct:
    en: Deep analysis runs a PE file in a secure, fully instrumented cloud sandbox. Its report lists behaviors and observables such as contacted IP addresses, files created on disk and registry modifications, after several minutes.
    fr: L'analyse approfondie exécute un fichier PE dans un bac à sable cloud sécurisé et entièrement instrumenté. Son rapport liste, après quelques minutes, des comportements et des observables comme les adresses IP contactées, les fichiers créés sur le disque et les modifications du Registre.
  options:
    a:
      en: The analyze command submits the entity to incrimination engines to get a verdict; it doesn't produce a behavior report of a sandbox run.
      fr: La commande analyze soumet l'entité à des moteurs d'incrimination pour obtenir un verdict ; elle ne produit pas de rapport de comportement d'une exécution en bac à sable.
    b:
      en: Go hunt returns events recorded on your devices; it can't show what the file would do in a sandbox.
      fr: Go hunt renvoie les événements enregistrés sur vos appareils ; il ne peut pas montrer ce que ferait le fichier dans un bac à sable.
    c:
      en: Running the file on a workstation violates the requirement that it must not run on your devices.
      fr: Exécuter le fichier sur un poste viole l'exigence selon laquelle il ne doit s'exécuter sur aucun de vos appareils.
references:
  - title: Take response actions on a file in Microsoft Defender for Endpoint
    url: https://learn.microsoft.com/en-us/defender-endpoint/respond-file-alerts
