id: sc200-2c-timeline-event-tables
objective: "2.2.1"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    While you investigate the timeline of a device named **WS-OPS-05**, you find four events that you want to look for on other devices by using advanced hunting.

    Which table should you query for each event? To answer, drag the appropriate tables to the correct events. Each table may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    En analysant la chronologie d'un appareil nommé **WS-OPS-05**, vous trouvez quatre événements que vous voulez rechercher sur d'autres appareils avec le repérage avancé.

    Quelle table devez-vous interroger pour chaque événement ? Pour répondre, faites glisser les tables appropriées vers les événements correspondants. Chaque table peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: image, text: DeviceImageLoadEvents }
    - { id: logon, text: DeviceLogonEvents }
    - { id: file, text: DeviceFileEvents }
    - { id: events, text: DeviceEvents }
    - { id: proc, text: DeviceProcessEvents }
    - { id: net, text: DeviceNetworkEvents }
  targets:
    - id: dll
      text: { en: "rundll32.exe loaded a DLL named winupd.dll", fr: "rundll32.exe a chargé une DLL nommée winupd.dll" }
    - id: signin
      text: { en: "A local administrator account signed in interactively", fr: "Un compte administrateur local s'est connecté de manière interactive" }
    - id: created
      text: { en: "A file named loader.vbs was created in the Startup folder", fr: "Un fichier nommé loader.vbs a été créé dans le dossier Startup" }
    - id: exploit
      text: { en: "Exploit protection blocked an operation of winword.exe", fr: "La protection contre les attaques (exploit protection) a bloqué une opération de winword.exe" }
answer:
  mapping: { dll: image, signin: logon, created: file, exploit: events }
explanation:
  correct:
    en: DeviceImageLoadEvents holds DLL loading events, DeviceLogonEvents sign-ins and other authentication events on devices, and DeviceFileEvents file creation and modification. Events triggered by security controls such as Microsoft Defender Antivirus and exploit protection are in DeviceEvents.
    fr: DeviceImageLoadEvents contient les événements de chargement de DLL, DeviceLogonEvents les connexions et autres événements d'authentification sur les appareils, et DeviceFileEvents la création et la modification de fichiers. Les événements déclenchés par des contrôles de sécurité comme l'Antivirus Microsoft Defender et la protection contre les attaques se trouvent dans DeviceEvents.
  options:
    proc: { en: "DeviceProcessEvents records process creation, not DLL loads or file creation.", fr: "DeviceProcessEvents enregistre la création de processus, pas les chargements de DLL ni la création de fichiers." }
    net: { en: "DeviceNetworkEvents records network connections, none of which is listed.", fr: "DeviceNetworkEvents enregistre les connexions réseau, dont aucune n'est listée." }
references:
  - title: Data tables in the Microsoft Defender advanced hunting schema
    url: https://learn.microsoft.com/en-us/defender-xdr/advanced-hunting-schema-tables
