id: sc200-2b-cop-capabilities
objective: "2.1.8"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Proseware has provisioned access to Microsoft Security Copilot and uses Copilot in Microsoft Defender. During a ransomware incident, analysts have four needs.

    Which embedded Copilot capability should the analysts use for each need? To answer, drag the appropriate capabilities to the correct needs. Each capability may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware dispose d'un accès provisionné à Microsoft Security Copilot et utilise Copilot dans Microsoft Defender. Pendant un incident de rançongiciel, les analystes ont quatre besoins.

    Quelle fonctionnalité Copilot intégrée les analystes doivent-ils utiliser pour chaque besoin ? Pour répondre, faites glisser les fonctionnalités appropriées vers les besoins correspondants. Chaque fonctionnalité peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: summary, text: { en: "Incident summary", fr: "Résumé d'incident" } }
    - { id: guided, text: { en: "Guided responses", fr: "Réponses guidées" } }
    - { id: script, text: { en: "Script analysis", fr: "Analyse de script" } }
    - { id: report, text: { en: "Incident report", fr: "Rapport d'incident" } }
    - { id: device, text: { en: "Device summary", fr: "Résumé d'appareil" } }
    - { id: identity, text: { en: "Identity summary", fr: "Résumé d'identité" } }
  targets:
    - id: t1
      text: { en: "Get recommended containment and remediation actions for the entities of the incident", fr: "Obtenir des actions de confinement et de correction recommandées pour les entités de l'incident" }
    - id: t2
      text: { en: "Determine whether an obfuscated PowerShell command line in the attack story is malicious", fr: "Déterminer si une ligne de commande PowerShell obfusquée de l'histoire de l'attaque est malveillante" }
    - id: t3
      text: { en: "See when and where the attack started, how it unfolded, and the IoCs involved", fr: "Voir quand et où l'attaque a commencé, comment elle s'est déroulée et les IoC impliqués" }
    - id: t4
      text: { en: "Give management a record of the actions taken, the playbooks that ran and the analysts involved", fr: "Fournir à la direction un relevé des actions effectuées, des playbooks exécutés et des analystes impliqués" }
answer:
  mapping: { t1: guided, t2: script, t3: summary, t4: report }
explanation:
  correct:
    en: |
      Guided responses recommend triage, containment, investigation and remediation actions for the incident's entities. Script analysis explains scripts and command lines and helps judge whether they are malicious. The incident summary gives the start time and entry point, a timeline of the attack and the IoCs. The incident report lists the incident management actions, the analysts involved and the Sentinel playbooks that ran.
    fr: |
      Les réponses guidées recommandent des actions de triage, de confinement, d'investigation et de correction pour les entités de l'incident. L'analyse de script explique les scripts et les lignes de commande et aide à juger s'ils sont malveillants. Le résumé d'incident donne l'heure de début et le point d'entrée, une chronologie de l'attaque et les IoC. Le rapport d'incident liste les actions de gestion de l'incident, les analystes impliqués et les playbooks Sentinel exécutés.
  options:
    device: { en: "A device summary describes a single device, not the incident.", fr: "Un résumé d'appareil décrit un seul appareil, pas l'incident." }
    identity: { en: "An identity summary describes a single user, not the incident.", fr: "Un résumé d'identité décrit un seul utilisateur, pas l'incident." }
references:
  - title: Microsoft Security Copilot and Chat in Microsoft Defender
    url: https://learn.microsoft.com/en-us/defender-xdr/security-copilot-in-microsoft-365-defender
  - title: Create an incident report with Microsoft Copilot in Microsoft Defender
    url: https://learn.microsoft.com/en-us/defender-xdr/security-copilot-m365d-create-incident-report
