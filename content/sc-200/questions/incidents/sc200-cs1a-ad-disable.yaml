id: sc200-cs1a-ad-disable
objective: "2.1.6"
type: single
caseStudy: sc200-cs1a-lamna-healthcare
difficulty: 3
status: draft
stem:
  en: |
    You need to meet the identity response requirement.

    What should you do?
  fr: |
    Vous devez respecter l'exigence de réponse sur les identités.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Create a group managed service account (gMSA), grant it write access to userAccountControl, and register it in Manage action accounts.", fr: "Créer un compte de service administré de groupe (gMSA), lui accorder l'accès en écriture à userAccountControl et l'inscrire dans Manage action accounts." }
    - id: b
      text: { en: "Grant the Directory Service account write access to userAccountControl on the descendant user objects of the domain.", fr: "Accorder au compte de service d'annuaire l'accès en écriture à userAccountControl sur les objets utilisateur descendants du domaine." }
    - id: c
      text: { en: "Select Automatically use the sensor's local system account in the Manage action accounts settings of Defender for Identity.", fr: "Sélectionner Automatically use the sensor's local system account dans les paramètres Manage action accounts de Defender pour Identity." }
    - id: d
      text: { en: "Install a Defender for Identity sensor on the Microsoft Entra Connect server and enable it to perform remediation actions.", fr: "Installer un capteur Defender pour Identity sur le serveur Microsoft Entra Connect et l'autoriser à effectuer des actions de correction." }
answer: { optionId: c }
explanation:
  correct:
    en: "Defender for Identity disables Active Directory accounts through the sensors installed on domain controllers. Sensors v3.x always use the domain controller's local system account and ignore gMSA action accounts, so you select Automatically use the sensor's local system account under Settings > Identities > Manage action accounts. Analysts also need a role with Response (manage) permissions to run the action."
    fr: "Defender pour Identity désactive les comptes Active Directory par l'intermédiaire des capteurs installés sur les contrôleurs de domaine. Les capteurs v3.x utilisent toujours le compte système local du contrôleur de domaine et ignorent les comptes d'action gMSA : vous sélectionnez donc Automatically use the sensor's local system account sous Paramètres > Identités > Manage action accounts. Les analystes ont aussi besoin d'un rôle doté de l'autorisation Response (manage) pour exécuter l'action."
  options:
    a: { en: "A gMSA action account applies only to v2.x sensors; the v3.x sensors at Lamna ignore it, and creating it adds administrative effort.", fr: "Un compte d'action gMSA ne s'applique qu'aux capteurs v2.x ; les capteurs v3.x de Lamna l'ignorent, et sa création ajoute de l'effort d'administration." }
    b: { en: "The Directory Service account only reads Active Directory data; Microsoft recommends never using it as the action account, which needs write access.", fr: "Le compte de service d'annuaire ne fait que lire les données Active Directory ; Microsoft recommande de ne jamais l'utiliser comme compte d'action, qui a besoin d'un accès en écriture." }
    d: { en: "Sensors on Microsoft Entra Connect, AD FS or AD CS servers that are not domain controllers do not perform remediation actions.", fr: "Les capteurs installés sur des serveurs Microsoft Entra Connect, AD FS ou AD CS qui ne sont pas contrôleurs de domaine n'effectuent pas d'actions de correction." }
references:
  - title: Manage action accounts in Microsoft Defender for Identity
    url: https://learn.microsoft.com/en-us/defender-for-identity/deploy/manage-action-accounts
  - title: Remediation actions in Microsoft Defender for Identity
    url: https://learn.microsoft.com/en-us/defender-for-identity/remediation-actions
