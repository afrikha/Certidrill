id: sc200-cs4a-contain-panel
objective: "2.2.2"
type: single
caseStudy: sc200-cs4a-munsons
difficulty: 2
status: draft
stem:
  en: |
    An alert indicates that HMI-L4 might be compromised.

    You need to meet the line control panels requirement. What should you do?
  fr: |
    Une alerte indique que HMI-L4 est peut-être compromis.

    Vous devez respecter l'exigence relative aux panneaux de commande de ligne. Que devez-vous faire ?
body:
  options:
    - id: a
      text:
        en: From the device page of HMI-L4, select Isolate device and choose full isolation.
        fr: Dans la page de l'appareil HMI-L4, sélectionner Isolate device et choisir l'isolement complet.
    - id: b
      text:
        en: From the device page of HMI-L4, select Contain device.
        fr: Dans la page de l'appareil HMI-L4, sélectionner Contain device.
    - id: c
      text:
        en: Create a custom network indicator that blocks the IP address of HMI-L4.
        fr: Créer un indicateur réseau personnalisé qui bloque l'adresse IP de HMI-L4.
    - id: d
      text:
        en: From the device page of HMI-L4, select Restrict app execution.
        fr: Dans la page de l'appareil HMI-L4, sélectionner Restrict app execution.
answer: { optionId: b }
explanation:
  correct:
    en: |
      Contain device is the response action for unmanaged devices that are or might be compromised. Once a device is contained, every onboarded Windows 10, Windows 11, and Windows Server 2019 or later device blocks incoming and outgoing communication with it, so nothing is installed or changed on HMI-L4. The DG-PlantOps devices run Windows 11 and Windows Server 2022, so they enforce the block.
    fr: |
      Contain device est l'action de réponse destinée aux appareils non gérés compromis ou potentiellement compromis. Une fois l'appareil contenu, chaque appareil intégré Windows 10, Windows 11 ou Windows Server 2019 et versions ultérieures bloque les communications entrantes et sortantes avec lui : rien n'est installé ni modifié sur HMI-L4. Les appareils de DG-PlantOps exécutent Windows 11 et Windows Server 2022 : ils appliquent donc le blocage.
  options:
    a:
      en: Isolation is performed by the Defender for Endpoint sensor on the isolated device itself, and HMI-L4 is not onboarded.
      fr: L'isolement est appliqué par le capteur Defender pour point de terminaison sur l'appareil isolé lui-même, et HMI-L4 n'est pas intégré.
    c:
      en: Custom network indicators are turned off in the tenant, and an indicator controls the connections that onboarded devices make to an address rather than containing an unmanaged device in both directions.
      fr: Les indicateurs réseau personnalisés sont désactivés dans le locataire, et un indicateur contrôle les connexions que les appareils intégrés établissent vers une adresse au lieu de contenir un appareil non géré dans les deux sens.
    d:
      en: Restrict app execution applies a code integrity policy on an onboarded device that runs Microsoft Defender Antivirus; it cannot run on HMI-L4.
      fr: Restrict app execution applique une stratégie d'intégrité du code sur un appareil intégré qui utilise l'antivirus Microsoft Defender ; elle ne peut pas s'exécuter sur HMI-L4.
references:
  - title: Take response actions on a device in Microsoft Defender for Endpoint
    url: https://learn.microsoft.com/en-us/defender-endpoint/respond-machine-alerts
