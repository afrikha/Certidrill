id: sc200-2c-case-task-status
objective: "2.1.10"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    You own case 1188 in the Microsoft Defender portal. The case contains two tasks. The team decided not to retry the servers that were offline.

    You need to update the case and its tasks to reflect the work.

    How should you complete the updates? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous êtes propriétaire du cas 1188 dans le portail Microsoft Defender. Le cas contient deux tâches. L'équipe a décidé de ne pas relancer les serveurs qui étaient hors connexion.

    Vous devez mettre à jour le cas et ses tâches pour refléter le travail effectué.

    Comment devez-vous compléter les mises à jour ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Task "Collect investigation packages from 12 servers": 9 packages were collected and 3 servers were offline. Task status: [[t1]]

      Task "Reset the password of svc-backup": not needed anymore because the account was deleted. Task status: [[t2]]

      All the work of the case is done. Case status: [[t3]]
    fr: |
      Tâche « Collecter les packages d'investigation de 12 serveurs » : 9 packages ont été collectés et 3 serveurs étaient hors connexion. État de la tâche : [[t1]]

      Tâche « Réinitialiser le mot de passe de svc-backup » : plus nécessaire, car le compte a été supprimé. État de la tâche : [[t2]]

      Tout le travail du cas est terminé. État du cas : [[t3]]
  slots:
    - id: t1
      options:
        - { id: completed, text: Completed }
        - { id: failed, text: Failed }
        - { id: partial, text: Partially completed }
        - { id: skipped, text: Skipped }
    - id: t2
      options:
        - { id: skipped, text: Skipped }
        - { id: failed, text: Failed }
        - { id: closed, text: Closed }
        - { id: completed, text: Completed }
    - id: t3
      options:
        - { id: closed, text: Closed }
        - { id: completed, text: Completed }
        - { id: resolved, text: Resolved }
        - { id: skipped, text: Skipped }
answer:
  values: { t1: partial, t2: skipped, t3: closed }
explanation:
  correct:
    en: Case tasks use the statuses New, In progress, Failed, Partially completed, Skipped and Completed. A task done for only part of its scope is Partially completed, and a task that became unnecessary is Skipped. A case uses its own statuses, New, Open and Closed by default, so finished work is Closed.
    fr: "Les tâches de cas utilisent les états New, In progress, Failed, Partially completed, Skipped et Completed. Une tâche réalisée pour une partie seulement de son périmètre est Partially completed, et une tâche devenue inutile est Skipped. Un cas utilise ses propres états, New, Open et Closed par défaut : le travail terminé est Closed."
  options:
    completed: { en: "Completed is a task status; it doesn't describe a task that covered only 9 of 12 servers, and it isn't a default case status.", fr: "Completed est un état de tâche ; il ne décrit pas une tâche qui n'a couvert que 9 serveurs sur 12, et ce n'est pas un état de cas par défaut." }
    failed: { en: "Failed describes a task whose work didn't succeed, not partial work or work that is no longer needed.", fr: "Failed décrit une tâche dont le travail a échoué, pas un travail partiel ni un travail devenu inutile." }
    resolved: { en: "Resolved is an incident status, not a case status.", fr: "Resolved est un état d'incident, pas un état de cas." }
references:
  - title: Manage security operations cases natively in the Microsoft Defender portal
    url: https://learn.microsoft.com/en-us/unified-secops/cases-overview
