id: sc200-2c-timeline-statements
objective: "2.2.1"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    You use the timeline of devices onboarded to Microsoft Defender for Endpoint to investigate alerts. The timeline shows both events and MITRE ATT&CK techniques.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous utilisez la chronologie des appareils intégrés à Microsoft Defender pour point de terminaison pour analyser des alertes. La chronologie affiche à la fois des événements et des techniques MITRE ATT&CK.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: When you select Hunt for related events on a technique, the query results include the technique itself.
        fr: Quand vous sélectionnez Hunt for related events sur une technique, les résultats de la requête incluent la technique elle-même.
    - id: s2
      text:
        en: When you open the timeline, it displays the past 30 days unless you select another date range.
        fr: À l'ouverture, la chronologie affiche les 30 derniers jours, sauf si vous sélectionnez une autre plage de dates.
    - id: s3
      text:
        en: Arrows on the time bar of the timeline indicate automated investigations.
        fr: Des flèches sur la barre de temps de la chronologie signalent des investigations automatisées.
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: From a technique, Hunt for related events opens advanced hunting on the events related to the technique, and the results don't include the technique itself. The date filter defaults to the past 30 days, with past day, past week and custom range as other choices. Arrows on the time bar mark automated investigations.
    fr: Depuis une technique, Hunt for related events ouvre le repérage avancé sur les événements liés à la technique, et les résultats n'incluent pas la technique elle-même. Le filtre de dates est par défaut sur les 30 derniers jours, avec le dernier jour, la dernière semaine et une plage personnalisée comme autres choix. Les flèches de la barre de temps signalent les investigations automatisées.
references:
  - title: Investigate devices in Microsoft Defender for Endpoint
    url: https://learn.microsoft.com/en-us/defender-endpoint/device-timeline-event-flag
