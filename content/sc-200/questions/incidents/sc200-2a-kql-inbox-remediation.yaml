id: sc200-2a-kql-inbox-remediation
objective: "2.1.1"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    Adatum Corporation uses Microsoft Defender XDR and Microsoft Defender for Office 365 Plan 2. A phishing campaign from the domain **tailspin-billing.example** reached users during the last week. ZAP and some users already moved part of the messages out of the Inbox.

    You need an advanced hunting query that returns only the campaign messages that are in an Inbox now. From each result, you must be able to open the Email entity page of the message.

    How should you complete the query? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum Corporation utilise Microsoft Defender XDR et Microsoft Defender pour Office 365 Plan 2. Une campagne d'hameçonnage provenant du domaine **tailspin-billing.example** a atteint des utilisateurs au cours de la dernière semaine. ZAP et certains utilisateurs ont déjà sorti une partie des messages de la boîte de réception.

    Vous avez besoin d'une requête de repérage avancé qui renvoie uniquement les messages de la campagne qui se trouvent actuellement dans une boîte de réception. Depuis chaque résultat, vous devez pouvoir ouvrir la page d'entité Email du message.

    Comment devez-vous compléter la requête ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: kusto
  template: |
    [[tbl]]
    | where Timestamp > ago(7d)
    | where SenderFromDomain == "tailspin-billing.example"
    | where [[loc]] startswith "Inbox"
    | project Timestamp, [[msgid]], RecipientEmailAddress, Subject
  slots:
    - id: tbl
      options:
        - { id: events, text: EmailEvents }
        - { id: post, text: EmailPostDeliveryEvents }
        - { id: url, text: EmailUrlInfo }
        - { id: click, text: UrlClickEvents }
    - id: loc
      options:
        - { id: latest, text: LatestDeliveryLocation }
        - { id: orig, text: DeliveryLocation }
        - { id: lastact, text: LatestDeliveryAction }
        - { id: act, text: DeliveryAction }
    - id: msgid
      options:
        - { id: net, text: NetworkMessageId }
        - { id: inet, text: InternetMessageId }
        - { id: report, text: ReportId }
answer:
  values: { tbl: events, loc: latest, msgid: net }
explanation:
  correct:
    en: "`EmailEvents` holds one record per message and recipient, with the sender domain and the subject. `LatestDeliveryLocation` is the last known location of the message, after ZAP or manual moves, whereas `DeliveryLocation` is where it was first delivered. In advanced hunting results, selecting the `NetworkMessageId` value (the identifier generated by Microsoft 365) opens the Email entity page."
    fr: "`EmailEvents` contient un enregistrement par message et par destinataire, avec le domaine de l'expéditeur et l'objet. `LatestDeliveryLocation` est le dernier emplacement connu du message, après ZAP ou un déplacement manuel, alors que `DeliveryLocation` est l'emplacement de la remise initiale. Dans les résultats du repérage avancé, sélectionner la valeur `NetworkMessageId` (l'identifiant généré par Microsoft 365) ouvre la page d'entité Email."
  options:
    post: { en: "EmailPostDeliveryEvents records post-delivery actions such as ZAP, but it has no sender domain or subject column.", fr: "EmailPostDeliveryEvents enregistre les actions postérieures à la remise comme ZAP, mais n'a pas de colonne de domaine d'expéditeur ni d'objet." }
    orig: { en: "DeliveryLocation keeps the original delivery location, so it still says Inbox for messages that ZAP moved later.", fr: "DeliveryLocation conserve l'emplacement de la remise initiale : il indique encore la boîte de réception pour les messages déplacés ensuite par ZAP." }
    lastact: { en: "LatestDeliveryAction is the last action attempted on the message, not its location.", fr: "LatestDeliveryAction est la dernière action tentée sur le message, pas son emplacement." }
    inet: { en: "InternetMessageId is set by the sending system; the Email entity page is opened from NetworkMessageId.", fr: "InternetMessageId est défini par le système d'envoi ; la page d'entité Email s'ouvre depuis NetworkMessageId." }
references:
  - title: EmailEvents table in the advanced hunting schema
    url: https://learn.microsoft.com/en-us/defender-xdr/advanced-hunting-emailevents-table
  - title: The Email entity page in Defender for Office 365
    url: https://learn.microsoft.com/en-us/defender-office-365/mdo-email-entity-page
