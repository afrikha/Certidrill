id: sc200-cs2c-mailitemsaccessed
objective: "2.3.1"
type: single
caseStudy: sc200-cs2c-graphic-design-institute
difficulty: 1
status: draft
stem:
  en: |
    You create a search in Microsoft Purview Audit for the mailbox of a.ruiz over the last three days.

    You need to meet the requirement for the messages that the attacker read.

    Which activity should you search for?
  fr: |
    Vous créez une recherche dans Microsoft Purview Audit pour la boîte aux lettres de a.ruiz sur les trois derniers jours.

    Vous devez répondre à l'exigence relative aux messages lus par l'attaquant.

    Quelle activité devez-vous rechercher ?
body:
  options:
    - { id: a, text: SearchQueryInitiatedExchange }
    - { id: b, text: MoveToDeletedItems }
    - { id: c, text: Send }
    - { id: d, text: MailItemsAccessed }
answer: { optionId: d }
explanation:
  correct:
    en: MailItemsAccessed records when mail data is accessed by mail protocols and clients. Bind records capture the InternetMessageId of each opened message, and sync records show the folders that a desktop Outlook client downloaded, so you can determine which messages the attacker could read.
    fr: |
      MailItemsAccessed enregistre l'accès aux données de messagerie par les protocoles et les clients de messagerie. Les enregistrements de type Bind capturent l'InternetMessageId de chaque message ouvert, et les enregistrements de type Sync indiquent les dossiers téléchargés par un client Outlook de bureau : vous pouvez ainsi déterminer quels messages l'attaquant a pu lire.
  options:
    a: { en: "SearchQueryInitiatedExchange records the searches run in the mailbox, not the messages that were opened.", fr: "SearchQueryInitiatedExchange enregistre les recherches effectuées dans la boîte aux lettres, pas les messages ouverts." }
    b: { en: "MoveToDeletedItems records messages moved to the Deleted Items folder.", fr: "MoveToDeletedItems enregistre les messages déplacés vers le dossier Éléments supprimés." }
    c: { en: "Send records messages sent from the mailbox, not messages read.", fr: "Send enregistre les messages envoyés depuis la boîte aux lettres, pas les messages lus." }
references:
  - title: Use MailItemsAccessed to investigate compromised accounts
    url: https://learn.microsoft.com/en-us/purview/audit-log-investigate-accounts
