id: sc200-2c-disruption-contain-user
objective: "2.2.4"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    During a ransomware attack at Fabrikam, automatic attack disruption applies the **Contain user** action to an account named **jdoe**, which is synchronized from Active Directory to Microsoft Entra ID. Fabrikam's devices are onboarded to Microsoft Defender for Endpoint.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Au cours d'une attaque par rançongiciel chez Fabrikam, l'interruption automatique d'attaque applique l'action **Contain user** à un compte nommé **jdoe**, synchronisé depuis Active Directory vers Microsoft Entra ID. Les appareils de Fabrikam sont intégrés à Microsoft Defender pour point de terminaison.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: The jdoe account is disabled in Microsoft Entra ID.
        fr: Le compte jdoe est désactivé dans Microsoft Entra ID.
    - id: s2
      text:
        en: While the action is in force, onboarded devices block RDP and SMB access by jdoe.
        fr: Tant que l'action est en vigueur, les appareils intégrés bloquent les accès RDP et SMB de jdoe.
    - id: s3
      text:
        en: If nobody undoes the action, it is removed automatically after five days.
        fr: Si personne n'annule l'action, elle est supprimée automatiquement au bout de cinq jours.
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: Contain user is enforced at the endpoint layer by Defender for Endpoint; the account isn't disabled in the identity provider. It blocks attack-related protocols (network logons, RPC, SMB and RDP) for the account on onboarded devices and ends its remote sessions, and it is removed automatically after five days.
    fr: Contain user est appliqué au niveau des points de terminaison par Defender pour point de terminaison ; le compte n'est pas désactivé dans le fournisseur d'identité. L'action bloque les protocoles liés aux attaques (ouvertures de session réseau, RPC, SMB et RDP) pour le compte sur les appareils intégrés et met fin à ses sessions distantes, et elle est supprimée automatiquement au bout de cinq jours.
references:
  - title: Take response actions on a device in Microsoft Defender for Endpoint
    url: https://learn.microsoft.com/en-us/defender-endpoint/respond-machine-alerts
  - title: Automatic attack disruption in Microsoft Defender
    url: https://learn.microsoft.com/en-us/defender-xdr/automatic-attack-disruption
