id: sc200-2a-purview-hunting-tables
objective: "2.1.2"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Northwind Traders uses Microsoft Purview Data Loss Prevention (DLP), Microsoft Purview Insider Risk Management and Microsoft Defender XDR. The insider risk integration is enabled, the built-in alert tuning rule for DLP signals is enabled, and the analysts have the required roles.

    Which advanced hunting table should an analyst query for each investigation? To answer, drag the appropriate tables to the correct investigations. Each table may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind Traders utilise la protection contre la perte de données (DLP) et la gestion des risques internes de Microsoft Purview, ainsi que Microsoft Defender XDR. L'intégration du risque interne est activée, la règle de réglage d'alerte intégrée pour les signaux DLP est activée et les analystes disposent des rôles requis.

    Quelle table de repérage avancé un analyste doit-il interroger pour chaque enquête ? Pour répondre, faites glisser les tables appropriées vers les enquêtes correspondantes. Chaque table peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: dse, text: DataSecurityEvents }
    - { id: dsb, text: DataSecurityBehaviors }
    - { id: bi, text: BehaviorInfo }
    - { id: cae, text: CloudAppEvents }
    - { id: ee, text: EmailEvents }
  targets:
    - { id: t1, text: { en: "The individual user activities, enriched with context, that violated an insider risk policy", fr: "Les activités individuelles de l'utilisateur, enrichies de contexte, qui ont enfreint une stratégie de risque interne" } }
    - { id: t2, text: { en: "The potentially suspicious user behaviors that Purview identified from those activities", fr: "Les comportements utilisateur potentiellement suspects que Purview a identifiés à partir de ces activités" } }
    - { id: t3, text: { en: "The DLP policy matches that no longer create alerts", fr: "Les correspondances de stratégie DLP qui ne créent plus d'alertes" } }
    - { id: t4, text: { en: "The SharePoint and OneDrive audit records showing with whom a matched file was shared", fr: "Les enregistrements d'audit SharePoint et OneDrive montrant avec qui un fichier détecté a été partagé" } }
answer:
  mapping: { t1: dse, t2: dsb, t3: bi, t4: cae }
explanation:
  correct:
    en: |
      DataSecurityEvents contains enriched events about user activities that violate Purview policies, and DataSecurityBehaviors gives insights into potentially suspicious user behavior. Since the built-in alert tuning rule, DLP signals are behaviors stored in BehaviorInfo (with BehaviorEntities). CloudAppEvents holds the audit logs of SharePoint, OneDrive, Exchange and devices, such as file sharing activities.
    fr: |
      DataSecurityEvents contient des événements enrichis sur les activités des utilisateurs qui enfreignent les stratégies Purview, et DataSecurityBehaviors donne des informations sur les comportements utilisateur potentiellement suspects. Depuis la règle de réglage d'alerte intégrée, les signaux DLP sont des comportements stockés dans BehaviorInfo (avec BehaviorEntities). CloudAppEvents contient les journaux d'audit de SharePoint, OneDrive, Exchange et des appareils, comme les activités de partage de fichiers.
  options:
    ee: { en: "EmailEvents describes messages processed by Defender for Office 365; it contains neither Purview policy violations nor file sharing audit records.", fr: "EmailEvents décrit les messages traités par Defender pour Office 365 ; il ne contient ni violations de stratégies Purview ni audits de partage de fichiers." }
references:
  - title: Investigate insider risk threats in the Microsoft Defender portal with insights from Microsoft Purview Insider Risk Management
    url: https://learn.microsoft.com/en-us/defender-xdr/irm-investigate-alerts-defender
  - title: Investigate data loss alerts with Microsoft Defender XDR
    url: https://learn.microsoft.com/en-us/defender-xdr/dlp-investigate-alerts-defender
