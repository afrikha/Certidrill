id: sc200-2a-purview-hunting-tables
objective: "2.1.2"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Northwind Traders uses Microsoft Purview Data Loss Prevention (DLP), Microsoft Purview Insider Risk Management and Microsoft Defender XDR. The insider risk integration is enabled, the built-in alert tuning rule for DLP signals is disabled, Microsoft 365 is connected to Microsoft Defender for Cloud Apps, and the analysts have the required roles.

    Which advanced hunting table should an analyst query for each investigation? To answer, drag the appropriate tables to the correct investigations. Each table may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind Traders utilise la protection contre la perte de données (DLP) et la gestion des risques internes de Microsoft Purview, ainsi que Microsoft Defender XDR. L'intégration du risque interne est activée, la règle de réglage d'alerte intégrée pour les signaux DLP est désactivée, Microsoft 365 est connecté à Microsoft Defender for Cloud Apps et les analystes disposent des rôles requis.

    Quelle table de repérage avancé un analyste doit-il interroger pour chaque enquête ? Pour répondre, faites glisser les tables appropriées vers les enquêtes correspondantes. Chaque table peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: ai, text: AlertInfo }
    - { id: ae, text: AlertEvidence }
    - { id: bi, text: BehaviorInfo }
    - { id: cae, text: CloudAppEvents }
    - { id: ee, text: EmailEvents }
  targets:
    - { id: t1, text: { en: "The title and severity of the insider risk alerts raised for a user during the last week", fr: "Le titre et la gravité des alertes de risque interne générées pour un utilisateur au cours de la dernière semaine" } }
    - { id: t2, text: { en: "The files, accounts and devices recorded as evidence of each DLP alert", fr: "Les fichiers, comptes et appareils enregistrés comme preuves de chaque alerte DLP" } }
    - { id: t3, text: { en: "The SharePoint and OneDrive audit records showing with whom a matched file was shared", fr: "Les enregistrements d'audit SharePoint et OneDrive montrant avec qui un fichier détecté a été partagé" } }
answer:
  mapping: { t1: ai, t2: ae, t3: cae }
explanation:
  correct:
    en: |
      Insider risk and DLP alerts are alerts in the Defender portal: AlertInfo holds one row per alert with its title and severity, and AlertEvidence holds the entities of each alert, such as files, accounts and devices. CloudAppEvents contains the audit logs of SharePoint, OneDrive, Exchange and devices, including the Purview DLP audit data, so it shows file sharing activities.
    fr: |
      Les alertes de risque interne et DLP sont des alertes dans le portail Defender : AlertInfo contient une ligne par alerte avec son titre et sa gravité, et AlertEvidence contient les entités de chaque alerte, comme les fichiers, les comptes et les appareils. CloudAppEvents contient les journaux d'audit de SharePoint, OneDrive, Exchange et des appareils, dont les données d'audit DLP de Purview : il montre donc les activités de partage de fichiers.
  options:
    bi: { en: "BehaviorInfo receives DLP signals only while the built-in tuning rule is enabled; here the rule is disabled, so the signals are alerts.", fr: "BehaviorInfo ne reçoit les signaux DLP que lorsque la règle de réglage intégrée est activée ; ici la règle est désactivée, les signaux sont donc des alertes." }
    ee: { en: "EmailEvents describes messages processed by Defender for Office 365; it contains neither alert evidence nor file sharing audit records.", fr: "EmailEvents décrit les messages traités par Defender pour Office 365 ; il ne contient ni preuves d'alertes ni audits de partage de fichiers." }
references:
  - title: Investigate data loss alerts with Microsoft Defender XDR
    url: https://learn.microsoft.com/en-us/defender-xdr/dlp-investigate-alerts-defender
  - title: Investigate insider risk threats in the Microsoft Defender portal with insights from Microsoft Purview Insider Risk Management
    url: https://learn.microsoft.com/en-us/defender-xdr/irm-investigate-alerts-defender
