id: sc200-cs2c-graph-activity-join
objective: "2.3.3"
type: dropdown
caseStudy: sc200-cs2c-graphic-design-institute
difficulty: 3
status: draft
stem:
  en: |
    The application ID of PortfolioSync is 5f1c9e2a-7b44-4d0e-9c1a-2e6d8b3f4a10.

    You need to write a query in law-gdi that meets the Microsoft Graph investigation requirement.

    How should you complete the query? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    L'ID d'application de PortfolioSync est 5f1c9e2a-7b44-4d0e-9c1a-2e6d8b3f4a10.

    Vous devez écrire dans law-gdi une requête qui répond à l'exigence d'investigation Microsoft Graph.

    Comment devez-vous compléter la requête ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: kusto
  template: |
    [[table]]
    | where TimeGenerated > ago(3d)
    | where AppId == "5f1c9e2a-7b44-4d0e-9c1a-2e6d8b3f4a10"
    | join kind=leftouter (
        union SigninLogs, AADNonInteractiveUserSignInLogs
        | where TimeGenerated > ago(3d)
      ) on $left.[[left]] == $right.[[right]]
    | project TimeGenerated, RequestMethod, RequestUri, ResponseStatusCode, IPAddress, UserPrincipalName
  slots:
    - id: table
      options:
        - { id: graph, text: MicrosoftGraphActivityLogs }
        - { id: audit, text: AuditLogs }
        - { id: cloudapp, text: CloudAppEvents }
        - { id: office, text: OfficeActivity }
    - id: left
      options:
        - { id: signin, text: SignInActivityId }
        - { id: appid, text: AppId }
        - { id: userid, text: UserId }
        - { id: ip, text: IPAddress }
    - id: right
      options:
        - { id: uti, text: UniqueTokenIdentifier }
        - { id: corr, text: CorrelationId }
        - { id: rappid, text: AppId }
        - { id: id, text: Id }
answer:
  values: { table: graph, left: signin, right: uti }
explanation:
  correct:
    en: MicrosoftGraphActivityLogs records every HTTP request that Microsoft Graph receives for the tenant, with the calling AppId. Its SignInActivityId column identifies the sign-in that issued the token, and it matches the UniqueTokenIdentifier column of the sign-in log tables.
    fr: MicrosoftGraphActivityLogs enregistre chaque requête HTTP reçue par Microsoft Graph pour le locataire, avec l'AppId appelant. Sa colonne SignInActivityId identifie la connexion qui a émis le jeton, et elle correspond à la colonne UniqueTokenIdentifier des tables de journaux de connexion.
  options:
    audit: { en: "AuditLogs records directory changes in Microsoft Entra ID, such as the consent, not each Graph request.", fr: "AuditLogs enregistre les modifications de l'annuaire Microsoft Entra ID, comme le consentement, pas chaque requête Graph." }
    cloudapp: { en: "CloudAppEvents records activities in cloud apps, not the HTTP requests sent to Microsoft Graph.", fr: "CloudAppEvents enregistre les activités dans les applications cloud, pas les requêtes HTTP envoyées à Microsoft Graph." }
    appid: { en: "AppId identifies the application, so it would match every sign-in of the application, not the sign-in that issued the token.", fr: "AppId identifie l'application : il correspondrait à toutes les connexions de l'application, pas à celle qui a émis le jeton." }
    corr: { en: "CorrelationId groups the sign-in events of one flow; the Graph log references the token through UniqueTokenIdentifier.", fr: "CorrelationId regroupe les événements de connexion d'un même flux ; le journal Graph référence le jeton par UniqueTokenIdentifier." }
references:
  - title: Access Microsoft Graph activity logs
    url: https://learn.microsoft.com/en-us/graph/microsoft-graph-activity-logs-overview
