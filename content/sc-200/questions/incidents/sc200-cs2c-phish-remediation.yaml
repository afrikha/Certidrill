id: sc200-cs2c-phish-remediation
objective: "2.1.1"
type: single
caseStudy: sc200-cs2c-graphic-design-institute
difficulty: 2
status: draft
stem:
  en: |
    In Threat Explorer, you select all the messages of the phishing campaign and choose **Take action**.

    You need to meet the requirement for the phishing messages.

    Which action should you select?
  fr: |
    Dans l'Explorateur de menaces (Threat Explorer), vous sélectionnez tous les messages de la campagne d'hameçonnage et vous choisissez **Take action**.

    Vous devez répondre à l'exigence relative aux messages d'hameçonnage.

    Quelle action devez-vous sélectionner ?
body:
  options:
    - { id: a, text: { en: "Move to deleted items", fr: "Move to deleted items" } }
    - { id: b, text: { en: "Soft delete", fr: "Soft delete" } }
    - { id: c, text: { en: "Hard delete", fr: "Hard delete" } }
    - { id: d, text: { en: "Move to junk folder", fr: "Move to junk folder" } }
answer: { optionId: c }
explanation:
  correct:
    en: Hard delete permanently purges the messages from the mailboxes, so recipients cannot recover them. Administrators can still recover hard-deleted messages by using single item recovery.
    fr: |
      Hard delete supprime définitivement les messages des boîtes aux lettres : les destinataires ne peuvent pas les récupérer. Les administrateurs peuvent toujours récupérer les messages supprimés définitivement grâce à la récupération d'éléments uniques.
  options:
    a: { en: "Messages in Deleted Items are still visible to recipients, who can move them back.", fr: "Les messages du dossier Éléments supprimés restent visibles par les destinataires, qui peuvent les déplacer à nouveau." }
    b: { en: "Soft delete moves the messages to Recoverable Items\\Deletions, from where users can recover them.", fr: "Soft delete déplace les messages vers Recoverable Items\\Deletions, d'où les utilisateurs peuvent les récupérer." }
    d: { en: "Messages in the Junk Email folder remain available to recipients, including the malicious link.", fr: "Les messages du dossier Courrier indésirable restent accessibles aux destinataires, avec le lien malveillant." }
references:
  - title: Remediate malicious email delivered in Office 365
    url: https://learn.microsoft.com/en-us/defender-office-365/remediate-malicious-email-delivered-office-365
