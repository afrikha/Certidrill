id: sc200-2a-mdca-activity-hotarea
objective: "2.1.4"
type: hotarea
difficulty: 1
status: draft
stem:
  en: |
    Contoso, Ltd. uses Microsoft Defender for Cloud Apps. A user named User10 works from the Paris office, whose public IP address is 203.0.113.10. An alert reports that an external forwarding rule was created on User10's mailbox.

    The following table shows User10's activities on the morning of the alert, from the activity log.

    Answer each prompt by selecting the appropriate activity.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso, Ltd. utilise Microsoft Defender pour les applications cloud. Un utilisateur nommé User10 travaille au bureau de Paris, dont l'adresse IP publique est 203.0.113.10. Une alerte signale qu'une règle de transfert externe a été créée sur la boîte aux lettres de User10.

    Le tableau suivant présente les activités de User10 le matin de l'alerte, issues du journal d'activité.

    Répondez à chaque consigne en sélectionnant l'activité appropriée.

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
    - id: p1
      text: { en: "The activity that set up the persistence used to exfiltrate email", fr: "L'activité qui a mis en place la persistance utilisée pour exfiltrer les e-mails" }
    - id: p2
      text: { en: "The first activity performed from the attacker's IP address", fr: "La première activité effectuée depuis l'adresse IP de l'attaquant" }
  grid:
    header: [{ en: "Time", fr: "Heure" }, { en: "App", fr: "Application" }, { en: "Activity", fr: "Activité" }, { en: "IP address", fr: "Adresse IP" }, { en: "Country", fr: "Pays" }]
    rows:
      - [{ text: "08:02" }, { text: Microsoft Exchange Online }, { text: { en: "Log on", fr: "Connexion" }, area: r1 }, { text: 203.0.113.10 }, { text: France }]
      - [{ text: "08:41" }, { text: Microsoft Exchange Online }, { text: { en: "Log on", fr: "Connexion" }, area: r2 }, { text: 198.51.100.7 }, { text: { en: "Brazil", fr: "Brésil" } }]
      - [{ text: "08:44" }, { text: Microsoft Exchange Online }, { text: "New-InboxRule (ForwardTo: payments@fabrikam-mail.example)", area: r3 }, { text: 198.51.100.7 }, { text: { en: "Brazil", fr: "Brésil" } }]
      - [{ text: "09:10" }, { text: Microsoft SharePoint Online }, { text: "FileDownloaded (Q3-forecast.xlsx)", area: r4 }, { text: 203.0.113.10 }, { text: France }]
      - [{ text: "09:30" }, { text: Microsoft Teams }, { text: "MessageSent", area: r5 }, { text: 203.0.113.10 }, { text: France }]
answer:
  values: { p1: r3, p2: r2 }
explanation:
  correct:
    en: |
      The New-InboxRule activity created the forwarding rule to an external address, which is the persistence the attacker uses to receive the user's email. It was performed from 198.51.100.7 in Brazil, not from the Paris office address, and the first activity from that address is the sign-in at 08:41, 39 minutes after a sign-in from France, a pattern that also matches impossible travel.
    fr: |
      L'activité New-InboxRule a créé la règle de transfert vers une adresse externe, c'est-à-dire la persistance que l'attaquant utilise pour recevoir les e-mails de l'utilisateur. Elle a été effectuée depuis 198.51.100.7 au Brésil, et non depuis l'adresse du bureau de Paris, et la première activité depuis cette adresse est la connexion de 08:41, 39 minutes après une connexion depuis la France, un schéma qui correspond aussi à un voyage impossible.
references:
  - title: How to investigate anomaly detection alerts
    url: https://learn.microsoft.com/en-us/defender-cloud-apps/investigate-anomaly-alerts
