id: sc200-2a-mdo-remediation-actions
objective: "2.1.1"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Adatum Corporation uses Microsoft Defender for Office 365 Plan 2. Analysts remediate delivered messages from Threat Explorer.

    Which remediation action should the analysts select for each requirement? To answer, drag the appropriate actions to the correct requirements. Each action may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum Corporation utilise Microsoft Defender pour Office 365 Plan 2. Les analystes corrigent les messages remis depuis l'Explorateur de menaces.

    Quelle action de correction les analystes doivent-ils sélectionner pour chaque exigence ? Pour répondre, faites glisser les actions appropriées vers les exigences correspondantes. Chaque action peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: inbox, text: Move to inbox }
    - { id: junk, text: Move to junk folder }
    - { id: deleted, text: Move to deleted items }
    - { id: soft, text: Soft delete }
    - { id: hard, text: Hard delete }
    - { id: sender, text: "Soft delete with Delete sender's copy" }
  targets:
    - { id: t1, text: { en: "Return a legitimate newsletter that was moved to Junk Email by mistake", fr: "Rendre une lettre d'information légitime déplacée par erreur dans le courrier indésirable" } }
    - { id: t2, text: { en: "Remove a phishing message but let users and admins recover it from Recoverable Items", fr: "Retirer un message d'hameçonnage tout en permettant aux utilisateurs et aux administrateurs de le récupérer depuis les éléments récupérables" } }
    - { id: t3, text: { en: "Purge a malicious meeting invite and its calendar entry; only admins can recover it", fr: "Purger une invitation à une réunion malveillante et son entrée de calendrier ; seuls les administrateurs peuvent la récupérer" } }
    - { id: t4, text: { en: "Remove a message sent by a compromised internal account, including the copy in its Sent Items", fr: "Retirer un message envoyé par un compte interne compromis, y compris la copie dans ses éléments envoyés" } }
answer:
  mapping: { t1: inbox, t2: soft, t3: hard, t4: sender }
explanation:
  correct:
    en: Move to inbox restores a false positive. Soft delete moves the message to Recoverable Items\Deletions, where users and admins can recover it. Hard delete purges the message and the calendar entry of a meeting invite; admins can still recover it with single item recovery. Delete sender's copy also soft deletes the message from the Sent Items folder when the sender belongs to the organization.
    fr: Move to inbox rétablit un faux positif. Soft delete déplace le message vers Recoverable Items\Deletions, où les utilisateurs et les administrateurs peuvent le récupérer. Hard delete purge le message et l'entrée de calendrier d'une invitation à une réunion ; les administrateurs peuvent encore le récupérer avec la récupération d'élément unique. Delete sender's copy supprime aussi de façon réversible le message du dossier Éléments envoyés quand l'expéditeur appartient à l'organisation.
references:
  - title: Remediate malicious email that was delivered in Office 365
    url: https://learn.microsoft.com/en-us/defender-office-365/remediate-malicious-email-delivered-office-365
