id: sc200-2a-mdca-shadow-it
objective: "2.1.4"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Litware, Inc. uses Microsoft Defender for Cloud Apps and Microsoft Defender for Endpoint. In Defender for Cloud Apps, **Enforce app access** is turned on for the Defender for Endpoint integration, and the **Custom network indicators** advanced feature is enabled.

    Cloud discovery shows that users upload company files to a file sharing service named App1 and use a note-taking service named App2. You need to block App1 on the managed devices. For App2, users must see a warning but be able to continue.

    How should you complete the configuration? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware, Inc. utilise Microsoft Defender pour les applications cloud et Microsoft Defender for Endpoint. Dans Defender pour les applications cloud, **Enforce app access** est activé pour l'intégration Defender for Endpoint, et la fonctionnalité avancée **Custom network indicators** est activée.

    La découverte du cloud montre que des utilisateurs chargent des fichiers de l'entreprise vers un service de partage de fichiers nommé App1 et utilisent un service de prise de notes nommé App2. Vous devez bloquer App1 sur les appareils gérés. Pour App2, les utilisateurs doivent voir un avertissement, mais pouvoir continuer.

    Comment devez-vous compléter la configuration ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Tag App1 as [[s1]].

      Tag App2 as [[s2]].

      On the devices, Microsoft Defender Antivirus must have [[s3]] configured in block mode.
    fr: |
      Étiqueter App1 comme [[s1]].

      Étiqueter App2 comme [[s2]].

      Sur les appareils, l'Antivirus Microsoft Defender doit avoir [[s3]] configuré en mode blocage.
  slots:
    - id: s1
      options:
        - { id: unsanctioned, text: Unsanctioned }
        - { id: monitored, text: Monitored }
        - { id: sanctioned, text: Sanctioned }
    - id: s2
      options:
        - { id: unsanctioned, text: Unsanctioned }
        - { id: monitored, text: Monitored }
        - { id: sanctioned, text: Sanctioned }
    - id: s3
      options:
        - { id: netprot, text: { en: "network protection", fr: "la protection réseau" } }
        - { id: asr, text: { en: "attack surface reduction rules", fr: "les règles de réduction de la surface d'attaque" } }
        - { id: cfa, text: { en: "controlled folder access", fr: "l'accès contrôlé aux dossiers" } }
answer:
  values: { s1: unsanctioned, s2: monitored, s3: netprot }
explanation:
  correct:
    en: |
      Apps tagged Unsanctioned are synced to Defender for Endpoint custom URL indicators and blocked on the devices. Apps tagged Monitored are also synced, but users get a warning that they can bypass for a configurable duration. Enforcement relies on Microsoft Defender Antivirus with real-time protection, cloud-delivered protection, and network protection in block mode.
    fr: |
      Les applications étiquetées Unsanctioned sont synchronisées vers les indicateurs d'URL personnalisés de Defender for Endpoint et bloquées sur les appareils. Les applications étiquetées Monitored sont aussi synchronisées, mais les utilisateurs reçoivent un avertissement qu'ils peuvent contourner pendant une durée configurable. L'application repose sur l'Antivirus Microsoft Defender avec la protection en temps réel, la protection cloud et la protection réseau en mode blocage.
  options:
    sanctioned: { en: "Sanctioned marks an app as approved; it neither blocks nor warns.", fr: "Sanctioned marque une application comme approuvée ; elle ne bloque pas et n'avertit pas." }
    asr: { en: "ASR rules block risky behaviors of processes and files, not access to cloud app domains.", fr: "Les règles ASR bloquent des comportements à risque de processus et de fichiers, pas l'accès aux domaines d'applications cloud." }
    cfa: { en: "Controlled folder access protects folders against unauthorized changes, for example by ransomware.", fr: "L'accès contrôlé aux dossiers protège les dossiers contre les modifications non autorisées, par exemple par un rançongiciel." }
references:
  - title: Govern discovered apps using Microsoft Defender for Endpoint
    url: https://learn.microsoft.com/en-us/defender-cloud-apps/mde-govern
