id: sc200-2b-cx-correlation-reason
objective: "2.1.9"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso investigates a Microsoft Defender XDR incident that started with a Defender for Office 365 phishing alert. The incident now also contains a Defender for Cloud Apps alert about a mass download from SharePoint Online by another user.

    Before you merge the response plans, you need to understand why the Defender for Cloud Apps alert was linked to this incident.

    Where should you look?
  fr: |
    Contoso examine un incident Microsoft Defender XDR qui a commencé par une alerte d'hameçonnage de Defender pour Office 365. L'incident contient désormais aussi une alerte de Defender pour les applications cloud concernant un téléchargement massif depuis SharePoint Online par un autre utilisateur.

    Avant de fusionner les plans de réponse, vous devez comprendre pourquoi l'alerte de Defender pour les applications cloud a été liée à cet incident.

    Où devez-vous regarder ?
body:
  options:
    - id: a
      text: { en: "The Alerts tab of the incident", fr: "L'onglet Alertes de l'incident" }
    - id: b
      text: { en: "The Assets tab of the incident", fr: "L'onglet Ressources de l'incident" }
    - id: c
      text: { en: "The Evidence and Response tab of the incident", fr: "L'onglet Preuves et réponse de l'incident" }
    - id: d
      text: { en: "The Investigations tab of the incident", fr: "L'onglet Investigations de l'incident" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      The Alerts tab lists each alert with its severity, the entities involved, its source and the reason the alerts are linked together. This correlation reason explains why the Defender for Cloud Apps alert joined an incident that started with email.
    fr: |
      L'onglet Alertes liste chaque alerte avec sa gravité, les entités impliquées, sa source et la raison pour laquelle les alertes sont liées. Cette raison de corrélation explique pourquoi l'alerte de Defender pour les applications cloud a rejoint un incident qui a commencé par un e-mail.
  options:
    b: { en: "The Assets tab counts the impacted devices, users, mailboxes, apps and cloud resources; it doesn't explain alert links.", fr: "L'onglet Ressources dénombre les appareils, utilisateurs, boîtes aux lettres, applications et ressources cloud touchés ; il n'explique pas les liens entre alertes." }
    c: { en: "Evidence and Response shows the verdict and remediation status of each entity.", fr: "Preuves et réponse montre le verdict et l'état de correction de chaque entité." }
    d: { en: "The Investigations tab lists automated investigations; Defender for Office 365 alerts even show zero investigations there by design.", fr: "L'onglet Investigations liste les investigations automatisées ; les alertes Defender pour Office 365 y affichent même zéro investigation par conception." }
references:
  - title: Investigate incidents in the Microsoft Defender portal (legacy)
    url: https://learn.microsoft.com/en-us/defender-xdr/investigate-incidents
