id: sc200-2d-cs-tool-choice
objective: "2.3.2"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    Litware, Inc. uses Microsoft 365. During an insider threat investigation, the SOC lists the following tasks.

    Which two tasks can you perform by using a content search in Microsoft Purview eDiscovery?

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware, Inc. utilise Microsoft 365. Au cours d'une enquête sur une menace interne, le SOC liste les tâches suivantes.

    Quelles sont les deux tâches que vous pouvez effectuer avec une recherche de contenu dans Microsoft Purview eDiscovery ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Determine which user downloaded a file named roadmap.pptx from a SharePoint site.", fr: "Déterminer quel utilisateur a téléchargé un fichier nommé roadmap.pptx depuis un site SharePoint." } }
    - { id: b, text: { en: "Determine who created an inbox rule that forwards messages to an external address.", fr: "Déterminer qui a créé une règle de boîte de réception qui transfère les messages vers une adresse externe." } }
    - { id: c, text: { en: "Find the documents whose file name contains roadmap in the users' OneDrive accounts.", fr: "Trouver les documents dont le nom de fichier contient roadmap dans les comptes OneDrive des utilisateurs." } }
    - { id: d, text: { en: "List the Microsoft Graph requests that an application sent to read the users' mailboxes.", fr: "Lister les requêtes Microsoft Graph qu'une application a envoyées pour lire les boîtes aux lettres des utilisateurs." } }
    - { id: e, text: { en: "Find the Teams chat messages in which a user shared a link to a personal storage site.", fr: "Trouver les messages de conversation Teams dans lesquels un utilisateur a partagé un lien vers un site de stockage personnel." } }
answer: { optionIds: [ c, e ] }
explanation:
  correct:
    en: |
      A content search finds the content itself in Exchange Online mailboxes, SharePoint and OneDrive sites, Microsoft Teams, Microsoft 365 Groups and Viva Engage. It can find documents by file name in OneDrive and chat messages in Teams.
    fr: |
      Une recherche de contenu trouve le contenu lui-même dans les boîtes aux lettres Exchange Online, les sites SharePoint et OneDrive, Microsoft Teams, les groupes Microsoft 365 et Viva Engage. Elle peut trouver des documents par nom de fichier dans OneDrive et des messages de conversation dans Teams.
  options:
    a: { en: "Who downloaded a file is an activity recorded in the audit log (FileDownloaded); use Microsoft Purview Audit.", fr: "Qui a téléchargé un fichier est une activité enregistrée dans le journal d'audit (FileDownloaded) : utilisez Microsoft Purview Audit." }
    b: { en: "The creation of an inbox rule is an audited activity (New-InboxRule, UpdateInboxRules), not content.", fr: "La création d'une règle de boîte de réception est une activité auditée (New-InboxRule, UpdateInboxRules), pas du contenu." }
    d: { en: "Microsoft Graph requests are recorded in the Microsoft Graph activity logs, not found by a content search.", fr: "Les requêtes Microsoft Graph sont enregistrées dans les journaux d'activité Microsoft Graph ; une recherche de contenu ne les trouve pas." }
references:
  - title: Create a search for a case in eDiscovery
    url: https://learn.microsoft.com/en-us/purview/edisc-search-query
  - title: Search the audit log
    url: https://learn.microsoft.com/en-us/purview/audit-search
