id: sc200-cs1b-scanner-suppression
objective: "2.1.3"
type: single
caseStudy: sc200-cs1b-city-power-light
difficulty: 2
status: draft
stem:
  en: |
    You need to meet the alert noise requirement.

    What should you create in Microsoft Defender for Cloud?
  fr: |
    Vous devez respecter l'exigence relative au bruit des alertes.

    Que devez-vous créer dans Microsoft Defender pour le cloud ?
body:
  options:
    - { id: a, text: { en: "An exemption for HIST1 to HIST6 on the security recommendations of Sub-OT", fr: "Une exemption pour HIST1 à HIST6 sur les recommandations de sécurité de Sub-OT" } }
    - { id: b, text: { en: "A suppression rule with an entity condition on VM-SCAN1 and no expiration", fr: "Une règle de suppression avec une condition d'entité sur VM-SCAN1 et sans expiration" } }
    - { id: c, text: { en: "A suppression rule for all alert types on Sub-OT with a custom expiration date", fr: "Une règle de suppression pour tous les types d'alertes sur Sub-OT avec une date d'expiration personnalisée" } }
    - { id: d, text: { en: "A workflow automation that sends an email for each alert triggered by VM-SCAN1", fr: "Une automatisation de workflow qui envoie un e-mail pour chaque alerte déclenchée par VM-SCAN1" } }
answer: { optionId: b }
explanation:
  correct:
    en: "A Defender for Cloud suppression rule automatically dismisses the alerts that match its conditions. The entity condition limits the rule to alerts that involve VM-SCAN1, so alerts from other machines keep their normal workflow, and an expiration set to None keeps the rule running indefinitely. Dismissed alerts remain in the alert list but no longer trigger notifications."
    fr: "Une règle de suppression Defender pour le cloud ignore automatiquement les alertes qui correspondent à ses conditions. La condition d'entité limite la règle aux alertes impliquant VM-SCAN1 : les alertes des autres machines suivent leur flux normal, et une expiration définie sur None maintient la règle indéfiniment. Les alertes ignorées restent dans la liste des alertes, mais ne déclenchent plus de notifications."
  options:
    a: { en: "Exemptions apply to recommendations, not to security alerts; the scanner would keep triggering alerts.", fr: "Les exemptions s'appliquent aux recommandations, pas aux alertes de sécurité : l'analyseur continuerait de déclencher des alertes." }
    c: { en: "Without an entity condition, the rule would dismiss alerts triggered by every machine in Sub-OT, and an expiration date makes it temporary.", fr: "Sans condition d'entité, la règle ignorerait les alertes déclenchées par toutes les machines de Sub-OT, et une date d'expiration la rend temporaire." }
    d: { en: "A workflow automation that sends an email adds notifications instead of dismissing the alerts.", fr: "Une automatisation de workflow qui envoie un e-mail ajoute des notifications au lieu d'ignorer les alertes." }
references:
  - title: Suppress alerts from Microsoft Defender for Cloud
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/alerts-suppression-rules
