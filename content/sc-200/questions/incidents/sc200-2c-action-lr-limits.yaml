id: sc200-2c-action-lr-limits
objective: "2.2.2"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    Several analysts at Fabrikam use live response in Microsoft Defender for Endpoint on Windows and Linux devices. You prepare a cheat sheet about how sessions and commands behave.

    Which two statements are true?

    NOTE: Each correct selection is worth one point.
  fr: |
    Plusieurs analystes de Fabrikam utilisent la réponse dynamique de Microsoft Defender pour point de terminaison sur des appareils Windows et Linux. Vous préparez un aide-mémoire sur le comportement des sessions et des commandes.

    Quelles sont les deux affirmations vraies ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Only one live response session can be open on a given device at a time.", fr: "Une seule session de réponse dynamique peut être ouverte à la fois sur un appareil donné." } }
    - { id: b, text: { en: "Pressing Ctrl+C in the console stops a running remediate command on the device.", fr: "Appuyer sur Ctrl+C dans la console arrête une commande remediate en cours sur l'appareil." } }
    - { id: c, text: { en: "A session that stays inactive for 30 minutes is disconnected.", fr: "Une session inactive pendant 30 minutes est déconnectée." } }
    - { id: d, text: { en: "getfile can download a 10-GB file from the device.", fr: "getfile peut télécharger un fichier de 10 Go depuis l'appareil." } }
    - { id: e, text: { en: "On a Linux device, undo restores a file that remediate deleted.", fr: "Sur un appareil Linux, undo restaure un fichier supprimé par remediate." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: Live response allows one session per device at a time (and up to five concurrent sessions per user and 50 per tenant). A session is disconnected after 30 minutes of inactivity.
    fr: La réponse dynamique autorise une session par appareil à la fois (et jusqu'à cinq sessions simultanées par utilisateur et 50 par locataire). Une session est déconnectée après 30 minutes d'inactivité.
  options:
    b: { en: "Ctrl+C cancels the command only in the portal; operations such as remediate can continue on the agent.", fr: "Ctrl+C annule la commande uniquement dans le portail ; des opérations comme remediate peuvent se poursuivre sur l'agent." }
    d: { en: "getfile is limited to 3 GB.", fr: "getfile est limité à 3 Go." }
    e: { en: "undo is supported on Windows only.", fr: "undo n'est pris en charge que sous Windows." }
references:
  - title: Investigate entities on devices using live response in Microsoft Defender for Endpoint
    url: https://learn.microsoft.com/en-us/defender-endpoint/live-response
