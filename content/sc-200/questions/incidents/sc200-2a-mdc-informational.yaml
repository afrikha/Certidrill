id: sc200-2a-mdc-informational
objective: "2.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Contoso, Ltd. has Microsoft Defender for Cloud enabled on its Azure subscriptions with the Defender for Storage plan. The SOC triages alerts in the Microsoft Defender portal.

    An engineer reports that Defender for Cloud shows several alerts with the **Informational** severity for a storage account named stcontosodata, but the SOC can't find them in the Defender portal alert queue. The other Defender for Cloud alerts appear normally.

    You need to review the informational alerts.

    What should you do?
  fr: |
    Contoso, Ltd. a activé Microsoft Defender pour le cloud sur ses abonnements Azure avec le plan Defender pour le stockage. Le SOC trie les alertes dans le portail Microsoft Defender.

    Un ingénieur signale que Defender pour le cloud affiche plusieurs alertes de gravité **Informational** pour un compte de stockage nommé stcontosodata, mais le SOC ne les trouve pas dans la file d'attente des alertes du portail Defender. Les autres alertes de Defender pour le cloud apparaissent normalement.

    Vous devez examiner les alertes informationnelles.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Filter the Defender portal alert queue on the alert subscription ID.", fr: "Filtrer la file d'attente des alertes du portail Defender sur l'ID d'abonnement de l'alerte." } }
    - { id: b, text: { en: "Assign the SOC analysts the Security Administrator role in Microsoft Entra ID.", fr: "Attribuer aux analystes SOC le rôle Security Administrator dans Microsoft Entra ID." } }
    - { id: c, text: { en: "Review the alerts on the Security alerts page of Defender for Cloud.", fr: "Examiner les alertes dans la page Alertes de sécurité de Defender pour le cloud." } }
    - { id: d, text: { en: "Delete the suppression rules that apply to the storage account.", fr: "Supprimer les règles de suppression qui s'appliquent au compte de stockage." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Informational alerts from Defender for Cloud aren't integrated into the Microsoft Defender portal, by design, to keep the focus on relevant alerts and reduce alert fatigue. They remain available on the Security alerts page of Defender for Cloud.
    fr: |
      Les alertes informationnelles de Defender pour le cloud ne sont pas intégrées au portail Microsoft Defender, par conception, pour se concentrer sur les alertes pertinentes et réduire la fatigue liée aux alertes. Elles restent disponibles dans la page Alertes de sécurité de Defender pour le cloud.
  options:
    a: { en: "The alert subscription ID filter narrows the alerts that are integrated; informational alerts aren't integrated at all.", fr: "Le filtre d'ID d'abonnement de l'alerte restreint les alertes intégrées ; les alertes informationnelles ne sont pas intégrées du tout." }
    b: { en: "The analysts already see the other Defender for Cloud alerts, so permissions aren't the cause.", fr: "Les analystes voient déjà les autres alertes de Defender pour le cloud : les autorisations ne sont pas en cause." }
    d: { en: "Nothing indicates that the alerts were dismissed; the severity alone explains why they are missing from the Defender portal.", fr: "Rien n'indique que les alertes ont été ignorées ; leur gravité suffit à expliquer leur absence du portail Defender." }
references:
  - title: Alerts and incidents in Microsoft Defender XDR for Microsoft Defender for Cloud
    url: https://learn.microsoft.com/en-us/defender-xdr/microsoft-365-security-center-defender-cloud
