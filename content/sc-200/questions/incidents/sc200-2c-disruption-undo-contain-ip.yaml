id: sc200-2c-disruption-undo-contain-ip
objective: "2.2.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    During an incident at Contoso, automatic attack disruption applied the **Contain IP** policy to 10.20.5.14, the address of a device that isn't onboarded to Microsoft Defender for Endpoint. You finished the investigation and cleaned the device.

    You need to stop the onboarded devices from blocking 10.20.5.14.

    What should you do?
  fr: |
    Au cours d'un incident chez Contoso, l'interruption automatique d'attaque a appliqué la stratégie **Contain IP** à 10.20.5.14, l'adresse d'un appareil qui n'est pas intégré à Microsoft Defender pour point de terminaison. Vous avez terminé l'investigation et nettoyé l'appareil.

    Les appareils intégrés doivent cesser de bloquer 10.20.5.14.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "In the Action center History view, select the Contain IP action and select Undo", fr: "Dans la vue History de l'Action center, sélectionner l'action Contain IP et sélectionner Undo" }
    - id: b
      text: { en: "In Settings > Microsoft Defender XDR > Automated response, add 10.20.5.14 as an IP exclusion", fr: "Dans Settings > Microsoft Defender XDR > Automated response, ajouter 10.20.5.14 comme exclusion d'adresse IP" }
    - id: c
      text: { en: "Set the automation level of the device groups to No automated response", fr: "Définir le niveau d'automatisation des groupes d'appareils sur No automated response" }
    - id: d
      text: { en: "Isolate the device, and then select Release from isolation", fr: "Isoler l'appareil, puis sélectionner Release from isolation" }
answer: { optionId: a }
explanation:
  correct:
    en: Contain IP actions are listed in the History view of the Action center. You undo one by selecting the Contain IP action and then Undo in the flyout, which stops the onboarded devices from blocking the address.
    fr: Les actions Contain IP figurent dans la vue History de l'Action center. Vous en annulez une en sélectionnant l'action Contain IP, puis Undo dans le volet, ce qui fait cesser le blocage de l'adresse par les appareils intégrés.
  options:
    b:
      en: An IP exclusion prevents future automatic containment of the address; it doesn't undo the action already applied.
      fr: Une exclusion d'adresse IP empêche le confinement automatique futur de l'adresse ; elle n'annule pas l'action déjà appliquée.
    c:
      en: The automation level controls future automated responses for onboarded devices in the group; it doesn't undo a containment already applied to an IP address.
      fr: "Le niveau d'automatisation contrôle les réponses automatiques futures pour les appareils intégrés du groupe ; il n'annule pas un confinement déjà appliqué à une adresse IP."
    d:
      en: The device isn't onboarded, so it can't be isolated, and isolation is a different action from IP containment.
      fr: "L'appareil n'est pas intégré : il ne peut pas être isolé, et l'isolation est une action différente du confinement d'adresse IP."
references:
  - title: Take response actions on a device in Microsoft Defender for Endpoint
    url: https://learn.microsoft.com/en-us/defender-endpoint/respond-machine-alerts
