id: sc200-2c-timeline-flag-export
objective: "2.2.1"
type: ordering
difficulty: 1
status: draft
stem:
  en: |
    A device named **WS-LAB-02** is onboarded to Microsoft Defender for Endpoint. An intrusion on WS-LAB-02 lasted three days.

    You need to give the incident response team a file that contains only the key events of the intrusion, selected by you in the device timeline.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Un appareil nommé **WS-LAB-02** est intégré à Microsoft Defender pour point de terminaison. Une intrusion sur WS-LAB-02 a duré trois jours.

    Vous devez remettre à l'équipe de réponse aux incidents un fichier qui contient uniquement les événements clés de l'intrusion, choisis par vous dans la chronologie de l'appareil.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: open, text: { en: "Open the device page of WS-LAB-02 and select the Timeline tab.", fr: "Ouvrir la page de l'appareil WS-LAB-02 et sélectionner l'onglet Timeline." } }
    - { id: flag, text: { en: "Select the flag icon of each key event.", fr: "Sélectionner l'icône de drapeau de chaque événement clé." } }
    - { id: filter, text: { en: "In Filters, turn on Flagged events and select Apply.", fr: "Dans Filters, activer Flagged events et sélectionner Apply." } }
    - { id: export, text: { en: "Select Export and choose the three days of the intrusion as the date range.", fr: "Sélectionner Export et choisir les trois jours de l'intrusion comme plage de dates." } }
    - { id: hunt, text: { en: "Select Hunt for related events on each key event.", fr: "Sélectionner Hunt for related events sur chaque événement clé." } }
    - { id: package, text: { en: "Collect an investigation package from WS-LAB-02.", fr: "Collecter un package d'investigation sur WS-LAB-02." } }
    - { id: air, text: { en: "Initiate an automated investigation on WS-LAB-02.", fr: "Lancer une investigation automatisée sur WS-LAB-02." } }
answer:
  sequence: [ open, flag, filter, export ]
explanation:
  correct:
    en: The timeline is on the device page. Flagging marks the key events, the Flagged events filter then shows only them, and Export writes the displayed events for the current date or a range of up to seven days, which covers the three-day intrusion.
    fr: La chronologie se trouve sur la page de l'appareil. L'indicateur (flag) marque les événements clés, le filtre Flagged events n'affiche ensuite qu'eux, et Export enregistre les événements affichés pour la date du jour ou une plage de sept jours au maximum, ce qui couvre l'intrusion de trois jours.
  options:
    hunt: { en: "Hunt for related events opens advanced hunting around one event; it doesn't select the events to export.", fr: "Hunt for related events ouvre le repérage avancé autour d'un événement ; il ne sélectionne pas les événements à exporter." }
    package: { en: "An investigation package is a fixed set of forensic artifacts, not a selection of timeline events.", fr: "Un package d'investigation est un ensemble fixe d'artefacts forensiques, pas une sélection d'événements de la chronologie." }
    air: { en: "An automated investigation analyzes and remediates threats; it doesn't produce a file of selected events.", fr: "Une investigation automatisée analyse et corrige les menaces ; elle ne produit pas de fichier d'événements choisis." }
references:
  - title: Investigate devices in Microsoft Defender for Endpoint
    url: https://learn.microsoft.com/en-us/defender-endpoint/device-timeline-event-flag
