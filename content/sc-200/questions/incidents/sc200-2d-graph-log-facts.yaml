id: sc200-2d-graph-log-facts
objective: "2.3.3"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Litware, Inc. has Microsoft Entra ID P1 licenses. A diagnostic setting streams the Microsoft Graph activity logs of the Litware tenant to a Microsoft Sentinel workspace named LAW-LW.

    Litware publishes a multitenant application named LitSync. Customers consent to LitSync in their own tenants, and LitSync calls Microsoft Graph to read the customers' calendars.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware, Inc. dispose de licences Microsoft Entra ID P1. Un paramètre de diagnostic diffuse les journaux d'activité Microsoft Graph du locataire Litware vers un espace de travail Microsoft Sentinel nommé LAW-LW.

    Litware publie une application multilocataire nommée LitSync. Les clients donnent leur consentement à LitSync dans leurs propres locataires, et LitSync appelle Microsoft Graph pour lire les calendriers des clients.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          The requests that LitSync sends to Microsoft Graph for the customers' calendars appear in the MicrosoftGraphActivityLogs table of LAW-LW.
        fr: |
          Les requêtes que LitSync envoie à Microsoft Graph pour les calendriers des clients apparaissent dans la table MicrosoftGraphActivityLogs de LAW-LW.
    - id: s2
      text:
        en: |
          Most requests reach LAW-LW within 30 minutes, but some can take up to 2 hours.
        fr: |
          La plupart des requêtes arrivent dans LAW-LW en moins de 30 minutes, mais certaines peuvent prendre jusqu'à 2 heures.
    - id: s3
      text:
        en: |
          You can use a workspace transformation to drop the UserAgent column of the Microsoft Graph activity logs before the data is stored in LAW-LW.
        fr: |
          Vous pouvez utiliser une transformation d'espace de travail pour supprimer la colonne UserAgent des journaux d'activité Microsoft Graph avant leur stockage dans LAW-LW.
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: |
      Microsoft Graph activity logs cover only the resource tenant, so the requests that LitSync makes for resources in the customers' tenants are recorded in those tenants, not in Litware's. Most events are delivered within 30 minutes and some take up to 2 hours. Diagnostic settings cannot filter events, but a workspace transformation can omit columns or rows before storage to reduce costs.
    fr: |
      Les journaux d'activité Microsoft Graph ne couvrent que le locataire de ressources : les requêtes que LitSync effectue pour des ressources des locataires clients sont enregistrées dans ces locataires, pas dans celui de Litware. La plupart des événements sont livrés en moins de 30 minutes, certains en jusqu'à 2 heures. Les paramètres de diagnostic ne peuvent pas filtrer les événements, mais une transformation d'espace de travail peut omettre des colonnes ou des lignes avant le stockage pour réduire les coûts.
references:
  - title: Access Microsoft Graph activity logs for tenant monitoring
    url: https://learn.microsoft.com/en-us/graph/microsoft-graph-activity-logs-overview
