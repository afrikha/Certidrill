id: sc200-2a-disruption-hunting-table
objective: "2.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso, Ltd. uses Microsoft Defender XDR. Automatic attack disruption contained several attacks during the last month.

    For a monthly report, you need an advanced hunting query that lists every action taken by attack disruption during the last 30 days, including the category of disruption and the affected device, user account or remote IP address.

    Which table should you query?
  fr: |
    Contoso, Ltd. utilise Microsoft Defender XDR. L'interruption automatique des attaques a confiné plusieurs attaques au cours du mois dernier.

    Pour un rapport mensuel, vous avez besoin d'une requête de repérage avancé qui liste toutes les actions effectuées par l'interruption des attaques au cours des 30 derniers jours, avec la catégorie d'interruption et l'appareil, le compte d'utilisateur ou l'adresse IP distante concernés.

    Quelle table devez-vous interroger ?
body:
  options:
    - { id: a, text: AlertEvidence }
    - { id: b, text: IdentityDirectoryEvents }
    - { id: c, text: DeviceEvents }
    - { id: d, text: DisruptionAndResponseEvents }
answer: { optionId: d }
explanation:
  correct:
    en: The DisruptionAndResponseEvents table records the attack disruption actions, with columns such as ActionType, AttackDisruptionCategory, DeviceName, AccountUpn and RemoteIP. One query covers devices, users and IP addresses.
    fr: La table DisruptionAndResponseEvents enregistre les actions d'interruption des attaques, avec des colonnes comme ActionType, AttackDisruptionCategory, DeviceName, AccountUpn et RemoteIP. Une seule requête couvre les appareils, les utilisateurs et les adresses IP.
  options:
    a: { en: "AlertEvidence lists the entities of alerts, not the containment actions taken against them.", fr: "AlertEvidence liste les entités des alertes, pas les actions de confinement prises contre elles." }
    b: { en: "IdentityDirectoryEvents can show an account being disabled in Active Directory, but not device or IP containment.", fr: "IdentityDirectoryEvents peut montrer la désactivation d'un compte dans Active Directory, mais pas le confinement d'un appareil ou d'une IP." }
    c: { en: "DeviceEvents shows the connections blocked on a device by containment, not every disruption action and its category.", fr: "DeviceEvents montre les connexions bloquées sur un appareil par le confinement, pas toutes les actions d'interruption avec leur catégorie." }
references:
  - title: Details and results of an automatic attack disruption action
    url: https://learn.microsoft.com/en-us/defender-xdr/autoad-results
