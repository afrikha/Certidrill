id: sc200-2c-disruption-exclude-account
objective: "2.2.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Adatum uses Microsoft Defender XDR with automatic attack disruption. A service account named **svc-sql** runs the payroll database. Last month, disruption disabled svc-sql during an incident, and payroll stopped for several hours.

    You need to ensure that automatic attack disruption never disables svc-sql. All the other accounts and devices must remain protected by automatic attack disruption.

    What should you do?
  fr: |
    Adatum utilise Microsoft Defender XDR avec l'interruption automatique d'attaque. Un compte de service nommé **svc-sql** exécute la base de données de la paie. Le mois dernier, l'interruption a désactivé svc-sql au cours d'un incident, et la paie s'est arrêtée pendant plusieurs heures.

    Vous devez faire en sorte que l'interruption automatique d'attaque ne désactive jamais svc-sql. Tous les autres comptes et appareils doivent rester protégés par l'interruption automatique d'attaque.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "In Settings > Microsoft Defender XDR > Automated response, add svc-sql as a user exclusion under Identities", fr: "Dans Settings > Microsoft Defender XDR > Automated response, ajouter svc-sql comme exclusion d'utilisateur sous Identities" }
    - id: b
      text: { en: "Set the device group that contains the database servers to No automated response", fr: "Définir le groupe d'appareils qui contient les serveurs de base de données sur No automated response" }
    - id: c
      text: { en: "Open a support case with the subject Attack disruption opt-out", fr: "Ouvrir une demande de support avec l'objet Attack disruption opt-out" }
    - id: d
      text: { en: "Create a Microsoft Sentinel automation rule that runs a playbook to re-enable svc-sql", fr: "Créer une règle d'automatisation Microsoft Sentinel qui exécute un playbook pour réactiver svc-sql" }
answer: { optionId: a }
explanation:
  correct:
    en: A user exclusion under Automated response > Identities prevents the identity from being automatically disabled, which suits service accounts. The rest of the tenant keeps the full protection of automatic attack disruption.
    fr: Une exclusion d'utilisateur sous Automated response > Identities empêche la désactivation automatique de l'identité, ce qui convient aux comptes de service. Le reste du locataire conserve toute la protection de l'interruption automatique d'attaque.
  options:
    b:
      en: A device group automation level affects device actions, not the disabling of a user account, and it would also weaken protection of those servers.
      fr: Le niveau d'automatisation d'un groupe d'appareils concerne les actions sur les appareils, pas la désactivation d'un compte d'utilisateur, et il affaiblirait aussi la protection de ces serveurs.
    c:
      en: Opting out stops all automated disruption actions for the tenant, which breaks the requirement to keep the other assets protected.
      fr: La désactivation arrête toutes les actions d'interruption automatique du locataire, ce qui contredit l'exigence de garder les autres ressources protégées.
    d:
      en: Re-enabling the account after the fact still interrupts payroll and can undo a containment that was justified.
      fr: Réactiver le compte après coup interrompt quand même la paie et peut annuler une mesure de confinement justifiée.
references:
  - title: Exclude assets from automated response in attack disruption
    url: https://learn.microsoft.com/en-us/defender-xdr/automatic-attack-disruption-exclusions
