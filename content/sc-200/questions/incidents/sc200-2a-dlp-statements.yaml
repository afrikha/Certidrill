id: sc200-2a-dlp-statements
objective: "2.1.2"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Proseware, Inc. uses Microsoft Purview Data Loss Prevention (DLP) for Exchange Online, SharePoint Online and OneDrive. The DLP alerts are investigated in the Microsoft Defender portal. Some administrators are restricted to administrative units.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware, Inc. utilise la protection contre la perte de données (DLP) de Microsoft Purview pour Exchange Online, SharePoint Online et OneDrive. Les alertes DLP sont examinées dans le portail Microsoft Defender. Certains administrateurs sont limités à des unités administratives.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: When you create a DLP policy for Exchange, DLP also evaluates the messages that are already stored in the mailboxes.
        fr: Quand vous créez une stratégie DLP pour Exchange, la DLP évalue aussi les messages déjà stockés dans les boîtes aux lettres.
    - id: s2
      text:
        en: An administrator restricted to an administrative unit sees only the DLP alerts of that administrative unit in the Defender portal.
        fr: Un administrateur limité à une unité administrative ne voit dans le portail Defender que les alertes DLP de cette unité administrative.
    - id: s3
      text:
        en: In advanced hunting, the CloudAppEvents table lets you explore the DLP audit data of the last 30 days.
        fr: Dans le repérage avancé, la table CloudAppEvents permet d'explorer les données d'audit DLP des 30 derniers jours.
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: |
      For Exchange, DLP scans only new email messages and doesn't match existing items in mailboxes or archives (for SharePoint and OneDrive, it also scans existing items). Administrative unit restrictions flow from DLP into the Defender portal. CloudAppEvents contains the Purview DLP audit data, and advanced hunting covers up to 30 days of it.
    fr: |
      Pour Exchange, la DLP n'analyse que les nouveaux messages et ne fait pas correspondre les éléments existants des boîtes aux lettres ou des archives (pour SharePoint et OneDrive, elle analyse aussi les éléments existants). Les restrictions d'unités administratives s'appliquent de la DLP au portail Defender. CloudAppEvents contient les données d'audit DLP de Purview, et le repérage avancé en couvre jusqu'à 30 jours.
references:
  - title: Investigate data loss alerts with Microsoft Defender XDR
    url: https://learn.microsoft.com/en-us/defender-xdr/dlp-investigate-alerts-defender
  - title: Learn about data loss prevention
    url: https://learn.microsoft.com/en-us/purview/dlp-learn-about-dlp
