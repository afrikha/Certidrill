id: sc200-2a-mdca-confirm-compromised
objective: "2.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Litware, Inc. uses Microsoft Defender for Cloud Apps and Microsoft Entra ID Protection. A user risk policy requires a secure password change when the user risk is **High**.

    An **Unusual file download (by user)** alert for a cloud-only user named User8 is a true positive. You need the user risk policy to apply to User8 the next time User8 signs in. The solution must minimize administrative effort.

    Which governance action should you apply?
  fr: |
    Litware, Inc. utilise Microsoft Defender pour les applications cloud et Microsoft Entra ID Protection. Une stratégie de risque utilisateur exige un changement de mot de passe sécurisé quand le risque utilisateur est **High**.

    Une alerte **Unusual file download (by user)** concernant un utilisateur cloud nommé User8 est un vrai positif. Vous devez faire en sorte que la stratégie de risque utilisateur s'applique à User8 lors de sa prochaine connexion. La solution doit réduire au minimum l'effort d'administration.

    Quelle action de gouvernance devez-vous appliquer ?
body:
  options:
    - { id: a, text: Require user to sign in again }
    - { id: b, text: Suspend user }
    - { id: c, text: Notify user }
    - { id: d, text: Confirm user compromised }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Confirm user compromised sets the user's risk level to high, which causes the relevant policy actions defined in Microsoft Entra ID to be enforced. Here, the user risk policy requires a secure password change at the next sign-in.
    fr: |
      Confirm user compromised fait passer le niveau de risque de l'utilisateur à élevé, ce qui entraîne l'application des actions de stratégie définies dans Microsoft Entra ID. Ici, la stratégie de risque utilisateur exige un changement de mot de passe sécurisé à la prochaine connexion.
  options:
    a: { en: "Require user to sign in again revokes the sessions, but it doesn't change the user risk, so the risk policy isn't triggered.", fr: "Require user to sign in again révoque les sessions, mais ne change pas le risque utilisateur : la stratégie de risque n'est pas déclenchée." }
    b: { en: "Suspend user blocks every sign-in, so the user can't complete the password change required by the risk policy.", fr: "Suspend user bloque toute connexion : l'utilisateur ne peut pas effectuer le changement de mot de passe exigé par la stratégie de risque." }
    c: { en: "Notify user sends an email; it doesn't change the user risk.", fr: "Notify user envoie un e-mail ; il ne change pas le risque utilisateur." }
references:
  - title: Governing connected apps
    url: https://learn.microsoft.com/en-us/defender-cloud-apps/governance-actions
