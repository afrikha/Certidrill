id: sc200-2b-mdi-defender-format-tuning
objective: "2.1.6"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Tailspin Toys uses Microsoft Defender for Identity. An approved vulnerability scanner named **VS1** runs every night and triggers reconnaissance alerts. You classify the alerts as benign true positives.

    The **Detection source** of the alerts shows that they are Defender-format alerts, not classic alerts.

    You need to stop VS1 from generating these alerts while keeping the detections active for every other device. The solution must minimize administrative effort.

    What should you do?
  fr: |
    Tailspin Toys utilise Microsoft Defender pour Identity. Un analyseur de vulnérabilités approuvé nommé **VS1** s'exécute chaque nuit et déclenche des alertes de reconnaissance. Vous classez les alertes comme des vrais positifs bénins.

    Le champ **Detection source** des alertes indique qu'il s'agit d'alertes au format Defender, et non d'alertes classiques.

    Vous devez empêcher VS1 de générer ces alertes tout en conservant les détections actives pour tous les autres appareils. La solution doit réduire au minimum l'effort d'administration.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Add VS1 to Settings > Identities > Excluded entities for the detection.", fr: "Ajouter VS1 à Paramètres > Identités > Entités exclues pour la détection." }
    - id: b
      text: { en: "Create an alert tuning rule in the Defender portal that matches the alert and VS1.", fr: "Créer une règle de réglage des alertes dans le portail Defender qui correspond à l'alerte et à VS1." }
    - id: c
      text: { en: "Open a Microsoft support request to disable the detection for the tenant.", fr: "Ouvrir une demande auprès du support Microsoft pour désactiver la détection pour le locataire." }
    - id: d
      text: { en: "Tag VS1 as Sensitive in Settings > Identities.", fr: "Étiqueter VS1 comme Sensitive dans Paramètres > Identités." }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Tuning depends on the alert format. Classic alerts are excluded under Settings > Identities > Excluded entities, but Defender-format alerts are tuned with Microsoft Defender alert tuning rules. A tuning rule scoped to the alert and to VS1 suppresses only the scanner's alerts.
    fr: |
      Le réglage dépend du format de l'alerte. Les alertes classiques s'excluent sous Paramètres > Identités > Entités exclues, mais les alertes au format Defender se règlent avec les règles de réglage des alertes de Microsoft Defender. Une règle de réglage limitée à l'alerte et à VS1 supprime uniquement les alertes de l'analyseur.
  options:
    a: { en: "Excluded entities apply to classic alerts only; these alerts are in the Defender format.", fr: "Les entités exclues ne s'appliquent qu'aux alertes classiques ; ces alertes sont au format Defender." }
    c: { en: "Disabling a detection through support turns it off for every device, which breaks the requirement.", fr: "Désactiver une détection par le support la désactive pour tous les appareils, ce qui ne respecte pas l'exigence." }
    d: { en: "The Sensitive tag marks high-value entities for detections; it doesn't suppress alerts.", fr: "L'étiquette Sensitive marque des entités de grande valeur pour les détections ; elle ne supprime pas d'alertes." }
references:
  - title: Microsoft Defender for Identity classic alerts
    url: https://learn.microsoft.com/en-us/defender-for-identity/alerts-mdi-classic
  - title: Security alerts in Microsoft Defender for Identity
    url: https://learn.microsoft.com/en-us/defender-for-identity/credential-access-alerts
