id: sc200-2b-sen-investigation-graph
objective: "2.1.7"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Proseware hasn't onboarded its Microsoft Sentinel workspace to the Defender portal yet; analysts investigate incidents in the Azure portal. An analyst who has the Microsoft Sentinel Responder role opens an incident, but the investigation graph can't be used for it.

    Which two issues could cause this?

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware n'a pas encore intégré son espace de travail Microsoft Sentinel au portail Defender ; les analystes examinent les incidents dans le portail Azure. Un analyste disposant du rôle Microsoft Sentinel Responder ouvre un incident, mais le graphe d'investigation ne peut pas être utilisé pour cet incident.

    Quels sont les deux problèmes qui peuvent en être la cause ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "The analytics rule that created the incident has no entity mapping.", fr: "La règle d'analytique qui a créé l'incident n'a pas de mappage d'entités." } }
    - { id: b, text: { en: "The incident contains more than four entities.", fr: "L'incident contient plus de quatre entités." } }
    - { id: c, text: { en: "The analyst has Microsoft Sentinel Responder instead of Microsoft Sentinel Contributor.", fr: "L'analyste dispose de Microsoft Sentinel Responder au lieu de Microsoft Sentinel Contributor." } }
    - { id: d, text: { en: "The incident was created 45 days ago.", fr: "L'incident a été créé il y a 45 jours." } }
    - { id: e, text: { en: "The incident has the Informational severity.", fr: "L'incident a la gravité Informational." } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: |
      The investigation graph requires the incident to contain entities mapped by its analytics rule or bookmark, and it supports incidents up to 30 days old. An incident without entity mapping or older than 30 days can't use it.
    fr: |
      Le graphe d'investigation exige que l'incident contienne des entités mappées par sa règle d'analytique ou son signet, et il prend en charge les incidents de 30 jours au plus. Un incident sans mappage d'entités ou plus ancien que 30 jours ne peut pas l'utiliser.
  options:
    c: { en: "Microsoft Sentinel Responder is the role required to investigate incidents.", fr: "Microsoft Sentinel Responder est le rôle requis pour examiner les incidents." }
    b: { en: "The four-entity limit applies only to the left-hand panel of the incident page, not to the investigation graph.", fr: "La limite de quatre entités ne s'applique qu'au volet de gauche de la page de l'incident, pas au graphe d'investigation." }
    e: { en: "Severity has no effect on the availability of the investigation graph.", fr: "La gravité n'a aucun effet sur la disponibilité du graphe d'investigation." }
references:
  - title: Investigate Microsoft Sentinel incidents in depth in the Azure portal
    url: https://learn.microsoft.com/en-us/azure/sentinel/investigate-incidents
