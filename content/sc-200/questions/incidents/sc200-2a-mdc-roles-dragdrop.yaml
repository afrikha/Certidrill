id: sc200-2a-mdc-roles-dragdrop
objective: "2.1.3"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove Bank uses Microsoft Defender for Cloud on a subscription named Sub-Bank. Workflow automations in Sub-Bank run Consumption logic apps stored in a resource group named RG-SOC.

    You need to assign Azure roles to the SOC members for the following tasks. The solution must follow the principle of least privilege.

    Which role should you assign for each task? To answer, drag the appropriate roles to the correct tasks. Each role may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove Bank utilise Microsoft Defender pour le cloud sur un abonnement nommé Sub-Bank. Les automatisations de workflow de Sub-Bank exécutent des applications logiques Consumption stockées dans un groupe de ressources nommé RG-SOC.

    Vous devez attribuer des rôles Azure aux membres du SOC pour les tâches suivantes. La solution doit respecter le principe du moindre privilège.

    Quel rôle devez-vous attribuer pour chaque tâche ? Pour répondre, faites glisser les rôles appropriés vers les tâches correspondantes. Chaque rôle peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: secadmin, text: Security Admin }
    - { id: secreader, text: Security Reader }
    - { id: contrib, text: Contributor }
    - { id: owner, text: Owner }
    - { id: laop, text: Logic App Operator }
    - { id: lacontrib, text: Logic App Contributor }
  targets:
    - { id: t1, text: { en: "Create and delete alert suppression rules in Sub-Bank", fr: "Créer et supprimer des règles de suppression d'alertes dans Sub-Bank" } }
    - { id: t2, text: { en: "Create sample alerts in Sub-Bank", fr: "Créer des exemples d'alertes dans Sub-Bank" } }
    - { id: t3, text: { en: "Run the existing logic apps in RG-SOC without editing them", fr: "Exécuter les applications logiques existantes de RG-SOC sans les modifier" } }
    - { id: t4, text: { en: "Create and modify the logic apps in RG-SOC", fr: "Créer et modifier les applications logiques de RG-SOC" } }
answer:
  mapping: { t1: secadmin, t2: contrib, t3: laop, t4: lacontrib }
explanation:
  correct:
    en: |
      Security Admin or Owner can create and delete suppression rules; Security Reader and Reader can only view them. Sample alerts are created by a user with the Contributor role on the subscription. Logic App Operator can only run existing logic apps, while Logic App Contributor is required to create and modify them. Owner would work for the first two tasks but grants far more than required.
    fr: |
      Security Admin ou Owner peuvent créer et supprimer des règles de suppression ; Security Reader et Reader peuvent seulement les consulter. Les exemples d'alertes sont créés par un utilisateur disposant du rôle Contributor sur l'abonnement. Logic App Operator peut seulement exécuter des applications logiques existantes, tandis que Logic App Contributor est requis pour les créer et les modifier. Owner conviendrait aux deux premières tâches, mais accorde bien plus que nécessaire.
references:
  - title: Suppress alerts from Microsoft Defender for Cloud
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/alerts-suppression-rules
  - title: Workflow Automation in Microsoft Defender for Cloud
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/workflow-automation
