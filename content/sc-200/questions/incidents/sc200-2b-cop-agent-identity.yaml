id: sc200-2b-cop-agent-identity
objective: "2.1.8"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam is setting up the Microsoft Security Copilot Phishing Triage Agent in Microsoft Defender. All privileged roles in the tenant are activated through Microsoft Entra Privileged Identity Management (PIM).

    You need to choose the identity of the agent. The solution must use the option that Microsoft recommends and must not stop working when a user account's authentication expires.

    What should you choose in the setup wizard?
  fr: |
    Fabrikam configure le Phishing Triage Agent de Microsoft Security Copilot dans Microsoft Defender. Tous les rôles privilégiés du locataire sont activés par Microsoft Entra Privileged Identity Management (PIM).

    Vous devez choisir l'identité de l'agent. La solution doit utiliser l'option recommandée par Microsoft et ne doit pas cesser de fonctionner lorsque l'authentification d'un compte d'utilisateur expire.

    Que devez-vous choisir dans l'assistant de configuration ?
body:
  options:
    - id: a
      text: { en: "Connect an existing user account that activates the Security Operator role through PIM.", fr: "Connecter un compte d'utilisateur existant qui active le rôle Security Operator par PIM." }
    - id: b
      text: { en: "Connect an existing user account that signs in with a Temporary Access Pass.", fr: "Connecter un compte d'utilisateur existant qui se connecte avec un passe d'accès temporaire." }
    - id: c
      text: { en: "Create a new agent identity, which creates a Microsoft Entra Agent ID.", fr: "Créer une nouvelle identité d'agent, ce qui crée un ID d'agent Microsoft Entra (Microsoft Entra Agent ID)." }
    - id: d
      text: { en: "Connect a dedicated user account that has a permanent Security Administrator assignment.", fr: "Connecter un compte d'utilisateur dédié disposant d'une attribution permanente de Security Administrator." }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Creating a new agent identity is the recommended option: the wizard creates a Microsoft Entra Agent ID automatically, and you assign it a role with the required permissions. With an existing user account, the agent inherits that account's access and stops working if its authentication expires.
    fr: |
      Créer une nouvelle identité d'agent est l'option recommandée : l'assistant crée automatiquement un ID d'agent Microsoft Entra, auquel vous attribuez un rôle doté des autorisations requises. Avec un compte d'utilisateur existant, l'agent hérite des accès de ce compte et cesse de fonctionner si son authentification expire.
  options:
    a: { en: "Accounts that rely on PIM aren't compatible with the agent.", fr: "Les comptes qui reposent sur PIM ne sont pas compatibles avec l'agent." }
    b: { en: "Accounts that use a Temporary Access Pass aren't compatible with the agent.", fr: "Les comptes qui utilisent un passe d'accès temporaire ne sont pas compatibles avec l'agent." }
    d: { en: "A user account can expire its authentication and stop the agent, and Security Administrator grants far more than the agent's required permissions.", fr: "L'authentification d'un compte d'utilisateur peut expirer et arrêter l'agent, et Security Administrator accorde bien plus que les autorisations requises par l'agent." }
references:
  - title: Microsoft Security Copilot Phishing Triage Agent in Microsoft Defender
    url: https://learn.microsoft.com/en-us/defender-xdr/phishing-triage-agent
