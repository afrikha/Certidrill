id: sc200-2d-cs-purge-conditions
objective: "2.3.2"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    Wingtip Toys has Microsoft 365 E3 licenses and no Microsoft Defender for Office 365 subscription. eDiscovery premium features are not enabled.

    A message that contains employee salary data was sent by mistake to the All Staff distribution list on November 12, 2026. You know the sender, the subject, the received date and the message ID of the message. You create a search in eDiscovery that you will use with a purge action in Security & Compliance PowerShell.

    You need to build the search query. The solution must prevent unexpected data loss.

    Which two conditions should you use?

    Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Wingtip Toys dispose de licences Microsoft 365 E3 et d'aucun abonnement Microsoft Defender pour Office 365. Les fonctionnalités premium d'eDiscovery ne sont pas activées.

    Un message contenant des données salariales des employés a été envoyé par erreur à la liste de distribution All Staff le 12 novembre 2026. Vous connaissez l'expéditeur, l'objet, la date de réception et l'ID du message. Vous créez dans eDiscovery une recherche que vous utiliserez avec une action de purge dans Security & Compliance PowerShell.

    Vous devez construire la requête de recherche. La solution doit éviter toute perte de données inattendue.

    Quelles sont les deux conditions à utiliser ?

    Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Subject, with the subject of the message", fr: "Subject, avec l'objet du message" } }
    - { id: b, text: { en: "Identifier, with the message ID", fr: "Identifier, avec l'ID du message" } }
    - { id: c, text: { en: "Sensitive information type, for salary data", fr: "Type d'informations sensibles, pour les données salariales" } }
    - { id: d, text: { en: "Received, with November 12, 2026", fr: "Received, avec le 12 novembre 2026" } }
    - { id: e, text: { en: "Sensitivity label, with the Confidential label", fr: "Étiquette de confidentialité, avec l'étiquette Confidential" } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: |
      For search and purge, Microsoft recommends narrowing the query with the Subject, Received and From properties and previewing the estimate before purging. In cases without premium features, the Identifier (including message ID), sensitivity label and sensitive information type conditions are not supported for search and delete, and using them can cause unexpected data loss.
    fr: |
      Pour la recherche et purge, Microsoft recommande d'affiner la requête avec les propriétés Subject, Received et From et de vérifier l'estimation avant la purge. Dans les cas sans fonctionnalités premium, les conditions Identifier (y compris l'ID de message), étiquette de confidentialité et type d'informations sensibles ne sont pas prises en charge pour la recherche et suppression, et leur utilisation peut entraîner une perte de données inattendue.
  options:
    b: { en: "The Identifier condition, including message ID, is not supported for search and delete in non-premium cases.", fr: "La condition Identifier, y compris l'ID de message, n'est pas prise en charge pour la recherche et suppression dans les cas non premium." }
    c: { en: "Sensitive information type conditions are not supported for search and delete in non-premium cases and would also match other messages.", fr: "Les conditions de type d'informations sensibles ne sont pas prises en charge pour la recherche et suppression dans les cas non premium et correspondraient aussi à d'autres messages." }
    e: { en: "Sensitivity label conditions are not supported for search and delete in non-premium cases.", fr: "Les conditions d'étiquette de confidentialité ne sont pas prises en charge pour la recherche et suppression dans les cas non premium." }
references:
  - title: Find and delete email messages in eDiscovery
    url: https://learn.microsoft.com/en-us/purview/edisc-search-mailbox-data
