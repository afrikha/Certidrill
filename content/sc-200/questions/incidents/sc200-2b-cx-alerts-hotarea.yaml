id: sc200-2b-cx-alerts-hotarea
objective: "2.1.9"
type: hotarea
difficulty: 2
status: draft
stem:
  en: |
    You investigate a multi-stage incident in the Microsoft Defender portal. The **Alerts** tab of the incident lists the following alerts in chronological order.

    Answer each prompt by selecting the appropriate alert.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous examinez un incident multi-étapes dans le portail Microsoft Defender. L'onglet **Alertes** de l'incident liste les alertes suivantes dans l'ordre chronologique.

    Répondez à chaque consigne en sélectionnant l'alerte appropriée.

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
    - id: p1
      text: { en: "The alert that shows the attacker obtaining service ticket hashes to crack offline", fr: "L'alerte qui montre l'attaquant obtenant des hachages de tickets de service à casser hors ligne" }
    - id: p2
      text: { en: "The first alert that shows the attacker moving from one computer to another", fr: "La première alerte qui montre l'attaquant passant d'un ordinateur à un autre" }
  grid:
    header: [{ en: "Time", fr: "Heure" }, { en: "Alert", fr: "Alerte" }, { en: "Service source", fr: "Source du service" }]
    rows:
      - [{ text: "09:05" }, { text: A potentially malicious URL click was detected, area: a1 }, { text: Microsoft Defender for Office 365 }]
      - [{ text: "09:20" }, { text: Anonymous IP address, area: a2 }, { text: Microsoft Entra ID Protection }]
      - [{ text: "10:10" }, { text: Security principal reconnaissance (LDAP), area: a3 }, { text: Microsoft Defender for Identity }]
      - [{ text: "10:25" }, { text: Suspected Kerberos SPN exposure, area: a4 }, { text: Microsoft Defender for Identity }]
      - [{ text: "11:00" }, { text: Suspected identity theft (pass-the-ticket), area: a5 }, { text: Microsoft Defender for Identity }]
      - [{ text: "11:30" }, { text: Suspicious service creation, area: a6 }, { text: Microsoft Defender for Identity }]
answer:
  values: { p1: a4, p2: a5 }
explanation:
  correct:
    en: |
      Suspected Kerberos SPN exposure detects Kerberoasting: service ticket requests whose hashes are extracted for offline cracking (Credential Access). Security principal reconnaissance (LDAP) is often the first step of Kerberoasting but is only discovery. Suspected identity theft (pass-the-ticket) is a lateral movement alert raised when a Kerberos ticket is used on two or more computers; Suspicious service creation comes later and points to execution on a domain controller.
    fr: |
      Suspected Kerberos SPN exposure détecte le Kerberoasting : des demandes de tickets de service dont les hachages sont extraits pour être cassés hors ligne (Credential Access). Security principal reconnaissance (LDAP) est souvent la première étape du Kerberoasting mais relève seulement de la découverte. Suspected identity theft (pass-the-ticket) est une alerte de mouvement latéral générée lorsqu'un ticket Kerberos est utilisé sur deux ordinateurs ou plus ; Suspicious service creation intervient plus tard et indique une exécution sur un contrôleur de domaine.
references:
  - title: Microsoft Defender for Identity classic alerts
    url: https://learn.microsoft.com/en-us/defender-for-identity/alerts-mdi-classic
