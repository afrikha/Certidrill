id: sc200-2d-cs-keyql-query
objective: "2.3.2"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove Bank uses Microsoft 365. You investigate a phishing campaign that used the external domain fabrikam-billing.com. You create a search in the Content Search case of eDiscovery and add all the mailboxes as data sources.

    You need a KeyQL query that returns the messages sent by or to any address in fabrikam-billing.com that have an attachment whose name starts with "invoice" and that were received on or after November 10, 2026.

    How should you complete the query? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove Bank utilise Microsoft 365. Vous examinez une campagne d'hameçonnage qui a utilisé le domaine externe fabrikam-billing.com. Vous créez une recherche dans le cas Content Search d'eDiscovery et ajoutez toutes les boîtes aux lettres comme sources de données.

    Vous avez besoin d'une requête KeyQL qui renvoie les messages envoyés par une adresse de fabrikam-billing.com ou à une telle adresse, qui ont une pièce jointe dont le nom commence par « invoice » et qui ont été reçus le 10 novembre 2026 ou après.

    Comment devez-vous compléter la requête ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  template: |
    [[prop]]:fabrikam-billing.com AND attachmentnames:[[name]] AND received[[op]]2026-11-10
  slots:
    - id: prop
      options:
        - { id: participants, text: participants }
        - { id: recipients, text: recipients }
        - { id: to, text: to }
        - { id: cc, text: cc }
    - id: name
      options:
        - { id: prefix, text: "invoice*" }
        - { id: suffix, text: "*invoice" }
        - { id: substring, text: "*invoice*" }
        - { id: quoted, text: "\"invoice*\"" }
    - id: op
      options:
        - { id: ge, text: ">=" }
        - { id: colon, text: ":" }
        - { id: lt, text: "<" }
        - { id: range, text: ".." }
answer:
  values: { prop: participants, name: prefix, op: ge }
explanation:
  correct:
    en: |
      The participants property matches messages sent by or to the specified addresses, and a domain value covers every address in that domain. KeyQL supports only prefix wildcards, so invoice* matches attachment names that start with "invoice". The >= operator returns messages received on or after the date.
    fr: |
      La propriété participants correspond aux messages envoyés par les adresses indiquées ou à ces adresses, et une valeur de domaine couvre toutes les adresses de ce domaine. KeyQL ne prend en charge que les caractères génériques de préfixe : invoice* correspond aux noms de pièces jointes qui commencent par « invoice ». L'opérateur >= renvoie les messages reçus à la date indiquée ou après.
  options:
    recipients: { en: "recipients matches the To, Cc and Bcc fields only, so messages sent by the domain would be missed.", fr: "recipients ne correspond qu'aux champs To, Cc et Bcc : les messages envoyés par le domaine seraient manqués." }
    suffix: { en: "Suffix and substring wildcards are not supported in KeyQL.", fr: "Les caractères génériques de suffixe et de sous-chaîne ne sont pas pris en charge par KeyQL." }
    quoted: { en: "Quotation marks disable the wildcard, so the query would look for the literal text.", fr: "Les guillemets désactivent le caractère générique : la requête chercherait le texte littéral." }
    colon: { en: "received:2026-11-10 returns only the messages received on that day.", fr: "received:2026-11-10 ne renvoie que les messages reçus ce jour-là." }
references:
  - title: Create a search for a case in eDiscovery
    url: https://learn.microsoft.com/en-us/purview/edisc-search-query
  - title: Use Keyword Query Language to create search queries in eDiscovery
    url: https://learn.microsoft.com/en-us/purview/edisc-keyword-query-language
