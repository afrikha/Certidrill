id: sc200-2b-cop-agent-verdicts
objective: "2.1.8"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Northwind Traders runs the Microsoft Security Copilot Phishing Triage Agent in Microsoft Defender. Analysts review the agent's work in the incident queue and correct its verdicts when needed.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind Traders exécute le Phishing Triage Agent de Microsoft Security Copilot dans Microsoft Defender. Les analystes examinent le travail de l'agent dans la file d'attente des incidents et corrigent ses verdicts si nécessaire.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          When the agent classifies a user-reported email as a false positive, it resolves the alert.
        fr: |
          Lorsque l'agent classe un e-mail signalé par un utilisateur comme faux positif, il résout l'alerte.
    - id: s2
      text:
        en: |
          When the agent classifies a user-reported email as a true positive, it resolves the incident after it removes the email from all mailboxes.
        fr: |
          Lorsque l'agent classe un e-mail signalé par un utilisateur comme vrai positif, il résout l'incident après avoir supprimé l'e-mail de toutes les boîtes aux lettres.
    - id: s3
      text:
        en: |
          When an analyst selects Change classification, enters a reason and selects Save, the agent learns from the feedback.
        fr: |
          Lorsqu'un analyste sélectionne Change classification, saisit une justification et sélectionne Save, l'agent apprend de ce retour.
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: |
      The agent resolves alerts it classifies as false positives. For true positives, the incident stays open and in progress so that an analyst can act on it. Save only records the change for audit; the agent learns only when the analyst selects Use this feedback to teach the agent, which adds the lesson to its memory (one feedback per alert).
    fr: |
      L'agent résout les alertes qu'il classe comme faux positifs. Pour les vrais positifs, l'incident reste ouvert et en cours afin qu'un analyste puisse agir. Save enregistre seulement la modification pour l'audit ; l'agent n'apprend que si l'analyste sélectionne Use this feedback to teach the agent, qui ajoute la leçon à sa mémoire (un retour par alerte).
references:
  - title: Microsoft Security Copilot Phishing Triage Agent in Microsoft Defender
    url: https://learn.microsoft.com/en-us/defender-xdr/phishing-triage-agent
