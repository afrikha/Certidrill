id: sc200-2d-audit-admin-unit
objective: "2.3.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Proseware, Inc. uses Microsoft 365 E5. A SOC analyst named Analyst2 has the View-Only Audit Logs role. The role assignment is scoped to an administrative unit named AU-Europe.

    During an investigation, Analyst2 searches the audit log for the Exchange operation `Set-Mailbox` and for activities performed by application service principals. The search returns no records, but an analyst without an administrative unit scope finds matching records with the same criteria.

    You need to ensure that Analyst2 can find these records.

    What should you do?
  fr: |
    Proseware, Inc. utilise Microsoft 365 E5. Un analyste SOC nommé Analyst2 dispose du rôle View-Only Audit Logs. L'attribution de rôle est limitée à une unité administrative nommée AU-Europe.

    Au cours d'une enquête, Analyst2 recherche dans le journal d'audit l'opération Exchange `Set-Mailbox` et les activités effectuées par des principaux de service d'application. La recherche ne renvoie aucun enregistrement, alors qu'un analyste sans étendue d'unité administrative trouve des enregistrements correspondants avec les mêmes critères.

    Vous devez faire en sorte qu'Analyst2 puisse trouver ces enregistrements.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Assign an Audit (Premium) license to Analyst2.", fr: "Attribuer une licence Audit (Premium) à Analyst2." } }
    - { id: b, text: { en: "Select AU-Europe in the Admin Units criterion of the search.", fr: "Sélectionner AU-Europe dans le critère Admin Units de la recherche." } }
    - { id: c, text: { en: "Assign the Audit Logs role to Analyst2, scoped to AU-Europe.", fr: "Attribuer à Analyst2 le rôle Audit Logs, limité à AU-Europe." } }
    - { id: d, text: { en: "Assign the View-Only Audit Logs role to Analyst2 without an administrative unit scope.", fr: "Attribuer à Analyst2 le rôle View-Only Audit Logs sans étendue d'unité administrative." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      An administrator restricted to administrative units can search and export only the user-generated records of the users in those units. Records of non-user and system accounts, and some operations such as the Exchange Set-Mailbox cmdlet, are visible only to unrestricted administrators. Assigning the role without an administrative unit scope makes these records visible.
    fr: |
      Un administrateur limité à des unités administratives ne peut rechercher et exporter que les enregistrements générés par les utilisateurs de ces unités. Les enregistrements des comptes non utilisateurs et système, ainsi que certaines opérations comme l'applet de commande Exchange Set-Mailbox, ne sont visibles que des administrateurs sans restriction. Attribuer le rôle sans étendue d'unité administrative rend ces enregistrements visibles.
  options:
    a: { en: "Audit (Premium) changes retention and adds events; it does not lift the administrative unit restriction.", fr: "Audit (Premium) modifie la rétention et ajoute des événements ; il ne lève pas la restriction d'unité administrative." }
    b: { en: "The Admin Units criterion narrows a search further; it cannot widen the scope of a restricted administrator.", fr: "Le critère Admin Units restreint davantage une recherche ; il ne peut pas élargir l'étendue d'un administrateur restreint." }
    c: { en: "Any audit role scoped to an administrative unit keeps the same restriction on visible records.", fr: "Tout rôle d'audit limité à une unité administrative conserve la même restriction sur les enregistrements visibles." }
references:
  - title: Search the audit log
    url: https://learn.microsoft.com/en-us/purview/audit-search
