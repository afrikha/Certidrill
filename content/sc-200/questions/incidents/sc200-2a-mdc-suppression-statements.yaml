id: sc200-2a-mdc-suppression-statements
objective: "2.1.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Wingtip Toys uses Microsoft Defender for Cloud. The SOC plans to use suppression rules to reduce the alerts caused by an authorized penetration testing tool.

    Which two statements about suppression rules are true?

    NOTE: Each correct selection is worth one point.
  fr: |
    Wingtip Toys utilise Microsoft Defender pour le cloud. Le SOC prévoit d'utiliser des règles de suppression pour réduire les alertes causées par un outil de test d'intrusion autorisé.

    Quelles sont les deux affirmations vraies concernant les règles de suppression ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "An alert that matches an active rule is set to Dismissed but still appears in the security alerts list.", fr: "Une alerte qui correspond à une règle active passe à l'état Dismissed, mais apparaît toujours dans la liste des alertes de sécurité." } }
    - { id: b, text: { en: "You can create a rule that applies to a management group from the Suppression rules page.", fr: "Vous pouvez créer une règle qui s'applique à un groupe d'administration depuis la page Suppression rules." } }
    - { id: c, text: { en: "Deleting a rule doesn't change the status of the alerts that the rule already dismissed.", fr: "Supprimer une règle ne modifie pas le statut des alertes que la règle a déjà ignorées." } }
    - { id: d, text: { en: "A user with the Security Reader role can create rules for the subscriptions that the user can view.", fr: "Un utilisateur disposant du rôle Security Reader peut créer des règles pour les abonnements qu'il peut consulter." } }
    - { id: e, text: { en: "You can create a rule for an alert type before that alert type is ever triggered.", fr: "Vous pouvez créer une règle pour un type d'alerte avant que ce type d'alerte ne soit jamais déclenché." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |
      A matching alert is set to Dismissed; it stays in the security alerts list but no longer triggers notifications or appears in active alert views. Deleting a rule leaves the alerts it already dismissed unchanged.
    fr: |
      Une alerte correspondante passe à l'état Dismissed ; elle reste dans la liste des alertes de sécurité, mais ne déclenche plus de notification et n'apparaît plus dans les vues des alertes actives. Supprimer une règle laisse inchangées les alertes qu'elle a déjà ignorées.
  options:
    b: { en: "Suppression for a management group uses Azure Policy; the Azure portal and the REST API create rules for subscriptions.", fr: "La suppression pour un groupe d'administration passe par Azure Policy ; le portail Azure et l'API REST créent des règles pour des abonnements." }
    d: { en: "Security Reader and Reader can only view suppression rules; Security Admin or Owner can create and delete them.", fr: "Security Reader et Reader peuvent seulement consulter les règles de suppression ; Security Admin ou Owner peuvent les créer et les supprimer." }
    e: { en: "A suppression rule applies only to alert types that have already been triggered at least once.", fr: "Une règle de suppression ne s'applique qu'aux types d'alertes déjà déclenchés au moins une fois." }
references:
  - title: Suppress alerts from Microsoft Defender for Cloud
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/alerts-suppression-rules
