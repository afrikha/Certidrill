id: sc200-2c-case-facts
objective: "2.1.10"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Adatum connected its Microsoft Sentinel workspace to the Microsoft Defender portal and started to use case management. You create case 1000 to track a business email compromise that spans several incidents.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum a connecté son espace de travail Microsoft Sentinel au portail Microsoft Defender et a commencé à utiliser la gestion des cas. Vous créez le cas 1000 pour suivre une compromission de messagerie professionnelle qui couvre plusieurs incidents.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: Case 1000 is also displayed in Microsoft Sentinel in the Azure portal.
        fr: Le cas 1000 est également affiché dans Microsoft Sentinel dans le portail Azure.
    - id: s2
      text:
        en: An analyst can link an existing incident to case 1000 from the incident details page.
        fr: Un analyste peut lier un incident existant au cas 1000 depuis la page de détails de l'incident.
    - id: s3
      text:
        en: Case 1000 has the status Open when it is created, unless you select another status.
        fr: Le cas 1000 a l'état Open lors de sa création, sauf si vous sélectionnez un autre état.
answer:
  values: { s1: false, s2: true, s3: false }
explanation:
  correct:
    en: Cases are available only in the Defender portal, not in the Azure portal. Incidents can be linked from the case or from the incident details page, through the option of its ellipsis menu. The default status of a case is New; the other default values are Open and Closed, and admins can add custom statuses.
    fr: Les cas ne sont disponibles que dans le portail Defender, pas dans le portail Azure. Les incidents peuvent être liés depuis le cas ou depuis la page de détails de l'incident, par l'option de son menu de points de suspension. L'état par défaut d'un cas est New ; les autres valeurs par défaut sont Open et Closed, et les administrateurs peuvent ajouter des états personnalisés.
references:
  - title: Manage security operations cases natively in the Microsoft Defender portal
    url: https://learn.microsoft.com/en-us/unified-secops/cases-overview
