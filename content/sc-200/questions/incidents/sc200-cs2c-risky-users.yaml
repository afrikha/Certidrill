id: sc200-cs2c-risky-users
objective: "2.1.5"
type: dragdrop
caseStudy: sc200-cs2c-graphic-design-institute
difficulty: 2
status: draft
stem:
  en: |
    You open the Risky users report in the Microsoft Entra admin center.

    You need to meet the remediation requirement for the risky users.

    Which action should you perform for each user? To answer, drag the appropriate actions to the correct users. Each action may be used once, more than once, or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous ouvrez le rapport Utilisateurs à risque dans le centre d'administration Microsoft Entra.

    Vous devez répondre à l'exigence de correction pour les utilisateurs à risque.

    Quelle action devez-vous effectuer pour chaque utilisateur ? Pour répondre, faites glisser les actions appropriées vers les utilisateurs correspondants. Chaque action peut être utilisée une fois, plusieurs fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: true
  items:
    - { id: confirm, text: Confirm user compromised }
    - { id: dismiss, text: Dismiss user risk }
    - { id: temp, text: Generate temporary password }
    - { id: require, text: Require password change }
  targets:
    - { id: ruiz, text: a.ruiz }
    - { id: okafor, text: b.okafor }
    - { id: lindqvist, text: c.lindqvist }
answer:
  mapping: { ruiz: confirm, okafor: dismiss, lindqvist: temp }
explanation:
  correct:
    en: Confirm user compromised is used when an attacker really used the account; the analyst then follows up with containment such as a password change and session revocation. Dismiss user risk is used when the investigation shows a false positive, as for b.okafor. A temporary password remediates the risk and forces a password change at the next sign-in without requiring MFA registration.
    fr: Confirm user compromised s'utilise quand un attaquant a réellement utilisé le compte ; l'analyste enchaîne ensuite avec un confinement, comme un changement de mot de passe et la révocation des sessions. Dismiss user risk s'utilise quand l'investigation montre un faux positif, comme pour b.okafor. Un mot de passe temporaire corrige le risque et impose un changement de mot de passe à la prochaine connexion sans exiger d'inscription à la MFA.
  options:
    require: { en: "Require password change needs a cloud user who is registered for MFA, which c.lindqvist is not.", fr: "Require password change nécessite un utilisateur cloud inscrit à la MFA, ce qui n'est pas le cas de c.lindqvist." }
    dismiss: { en: "Dismissing the risk of a.ruiz would mark a real compromise as safe.", fr: "Ignorer le risque de a.ruiz marquerait une vraie compromission comme sûre." }
references:
  - title: Remediate risks and unblock users
    url: https://learn.microsoft.com/en-us/entra/id-protection/howto-identity-protection-remediate-unblock
