id: sc200-2c-action-lr-background
objective: "2.2.2"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    You have a live response session on a Windows device named **WS-RND-08**. A suspicious file is stored at `C:\ProgramData\Updater\svc.dll`.

    You need to download the file to your computer without blocking the console, so that you can run other commands during the transfer. Later, the `jobs` command shows that the download has the command ID 2207, and you want to bring it back to the console.

    How should you complete the commands? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous avez une session de réponse dynamique sur un appareil Windows nommé **WS-RND-08**. Un fichier suspect est stocké dans `C:\ProgramData\Updater\svc.dll`.

    Vous devez télécharger le fichier sur votre ordinateur sans bloquer la console, afin de pouvoir exécuter d'autres commandes pendant le transfert. Plus tard, la commande `jobs` montre que le téléchargement a l'ID de commande 2207, et vous voulez le ramener dans la console.

    Comment devez-vous compléter les commandes ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: text
  template: |
    [[c1]] "C:\ProgramData\Updater\svc.dll" [[c2]]
    jobs
    [[c3]] 2207
  slots:
    - id: c1
      options:
        - { id: getfile, text: getfile }
        - { id: putfile, text: putfile }
        - { id: fileinfo, text: fileinfo }
        - { id: findfile, text: findfile }
    - id: c2
      options:
        - { id: amp, text: "&" }
        - { id: gt, text: ">" }
        - { id: auto, text: "-auto" }
        - { id: json, text: "-output json" }
    - id: c3
      options:
        - { id: fg, text: fg }
        - { id: status, text: status }
        - { id: run, text: run }
        - { id: connect, text: connect }
answer:
  values: { c1: getfile, c2: amp, c3: fg }
explanation:
  correct:
    en: "`getfile` downloads a file from the device. Ending the command with `&` runs the download in the background, and `fg <command ID>` places the job back in the foreground; it takes the command ID shown by `jobs`, not a process ID."
    fr: "`getfile` télécharge un fichier de l'appareil. Terminer la commande par `&` exécute le téléchargement en arrière-plan, et `fg <ID de commande>` ramène la tâche au premier plan ; il prend l'ID de commande affiché par `jobs`, pas un ID de processus."
  options:
    putfile: { en: "putfile copies a file from the library to the device, the opposite direction.", fr: "putfile copie un fichier de la bibliothèque vers l'appareil, dans le sens inverse." }
    fileinfo: { en: "fileinfo returns information about the file without downloading it.", fr: "fileinfo renvoie des informations sur le fichier sans le télécharger." }
    gt: { en: "> pipes the output of a command to a file; it doesn't run the command in the background.", fr: "> redirige la sortie d'une commande vers un fichier ; il n'exécute pas la commande en arrière-plan." }
    status: { en: "status shows the status and output of a command but doesn't bring the job to the foreground.", fr: "status affiche l'état et la sortie d'une commande mais ne ramène pas la tâche au premier plan." }
references:
  - title: Investigate entities on devices using live response in Microsoft Defender for Endpoint
    url: https://learn.microsoft.com/en-us/defender-endpoint/live-response
