id: sc200-2d-graph-destinations
objective: "2.3.3"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Contoso, Ltd. has Microsoft Entra ID P2 licenses. You configure the Microsoft Entra diagnostic settings to send the Microsoft Graph activity logs to several destinations.

    You need to select a destination for each requirement.

    Which destination should you use for each requirement? To answer, drag the appropriate destinations to the correct requirements. Each destination may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso, Ltd. dispose de licences Microsoft Entra ID P2. Vous configurez les paramètres de diagnostic de Microsoft Entra pour envoyer les journaux d'activité Microsoft Graph vers plusieurs destinations.

    Vous devez sélectionner une destination pour chaque exigence.

    Quelle destination devez-vous utiliser pour chaque exigence ? Pour répondre, faites glisser les destinations appropriées vers les exigences correspondantes. Chaque destination peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: law, text: { en: "Log Analytics workspace", fr: "Espace de travail Log Analytics" } }
    - { id: storage, text: { en: "Azure Storage account", fr: "Compte Stockage Azure" } }
    - { id: eh, text: { en: "Azure Event Hubs namespace", fr: "Espace de noms Azure Event Hubs" } }
    - { id: audit, text: Microsoft Purview Audit }
  targets:
    - id: t1
      text: { en: "Query the requests with KQL in Microsoft Sentinel and use them in analytics rules", fr: "Interroger les requêtes avec KQL dans Microsoft Sentinel et les utiliser dans des règles d'analyse" }
    - id: t2
      text: { en: "Archive the raw logs for several years for compliance", fr: "Archiver les journaux bruts pendant plusieurs années pour la conformité" }
    - id: t3
      text: { en: "Stream the logs to a third-party SIEM used by the managed security provider", fr: "Diffuser les journaux vers un SIEM tiers utilisé par le fournisseur de sécurité managée" }
answer:
  mapping: { t1: law, t2: storage, t3: eh }
explanation:
  correct:
    en: |
      Microsoft Graph activity logs are routed by diagnostic settings. A Log Analytics workspace makes them queryable with KQL in the MicrosoftGraphActivityLogs table, which Microsoft Sentinel uses. An Azure Storage account suits long-term retention, and Azure Event Hubs streams the logs to an external SIEM.
    fr: |
      Les journaux d'activité Microsoft Graph sont acheminés par les paramètres de diagnostic. Un espace de travail Log Analytics les rend interrogeables avec KQL dans la table MicrosoftGraphActivityLogs, qu'utilise Microsoft Sentinel. Un compte Stockage Azure convient à la rétention à long terme, et Azure Event Hubs diffuse les journaux vers un SIEM externe.
  options:
    audit: { en: "Microsoft Purview Audit is not a destination of diagnostic settings; it records Microsoft 365 activities in the unified audit log.", fr: "Microsoft Purview Audit n'est pas une destination des paramètres de diagnostic ; il enregistre les activités Microsoft 365 dans le journal d'audit unifié." }
references:
  - title: Access Microsoft Graph activity logs for tenant monitoring
    url: https://learn.microsoft.com/en-us/graph/microsoft-graph-activity-logs-overview
