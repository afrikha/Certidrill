id: sc200-2a-mdc-status-sync
objective: "2.1.3"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Northwind Traders protects its Azure resources with Microsoft Defender for Cloud, including the Defender for Servers plan, which deploys Microsoft Defender for Endpoint to the VMs. The Defender for Cloud alerts and incidents are integrated into the Microsoft Defender portal.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind Traders protège ses ressources Azure avec Microsoft Defender pour le cloud, y compris le plan Defender pour serveurs, qui déploie Microsoft Defender for Endpoint sur les machines virtuelles. Les alertes et incidents de Defender pour le cloud sont intégrés au portail Microsoft Defender.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: When you resolve a Defender for Storage alert in the Defender portal, its status is also updated in Defender for Cloud.
        fr: Quand vous résolvez une alerte Defender pour le stockage dans le portail Defender, son statut est aussi mis à jour dans Defender pour le cloud.
    - id: s2
      text:
        en: When you change, in Defender for Cloud, the status of a Defender for Endpoint alert raised on an Azure VM, the Defender portal shows the new status.
        fr: Quand vous modifiez, dans Defender pour le cloud, le statut d'une alerte Defender for Endpoint déclenchée sur une machine virtuelle Azure, le portail Defender affiche le nouveau statut.
    - id: s3
      text:
        en: You can limit an analyst's view of the Defender for Cloud alerts in the Defender portal to the subscriptions that the analyst manages.
        fr: Vous pouvez limiter la vue d'un analyste sur les alertes de Defender pour le cloud dans le portail Defender aux abonnements qu'il gère.
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: |
      The status of a Defender for Cloud alert is synchronized both ways between Defender for Cloud and the Defender portal. Defender for Endpoint alerts on cloud resources appear in both services, but their statuses aren't synchronized. Permissions to view Defender for Cloud alerts apply to the entire tenant, and viewing specific subscriptions isn't supported; analysts can only filter on the alert subscription ID.
    fr: |
      Le statut d'une alerte Defender pour le cloud est synchronisé dans les deux sens entre Defender pour le cloud et le portail Defender. Les alertes Defender for Endpoint sur des ressources cloud apparaissent dans les deux services, mais leurs statuts ne sont pas synchronisés. Les autorisations de consultation des alertes de Defender pour le cloud s'appliquent à tout le locataire, et la consultation d'abonnements précis n'est pas prise en charge ; les analystes peuvent seulement filtrer sur l'ID d'abonnement de l'alerte.
references:
  - title: Alerts and incidents in Microsoft Defender XDR for Microsoft Defender for Cloud
    url: https://learn.microsoft.com/en-us/defender-xdr/microsoft-365-security-center-defender-cloud
