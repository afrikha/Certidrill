id: sc200-sr2-mdi-disable-3
objective: "2.1.6"
type: series_yesno
series: sc200-sr2-mdi-disable
seriesOrder: 3
difficulty: 2
status: draft
stem:
  en: You revoke Ben's sessions.
  fr: Vous révoquez les sessions de Ben.
body:
  solution:
    en: From Ben's identity page in the Microsoft Defender portal, you run the **Revoke session** remediation action.
    fr: Depuis la page d'identité de Ben dans le portail Microsoft Defender, vous exécutez l'action de correction **Revoke session**.
answer: { value: false }
explanation:
  correct:
    en: Revoke session is not available for Active Directory accounts; it applies to Microsoft Entra ID (and Okta) sessions. Ben's AD DS account stays enabled and can still authenticate to the domain controllers.
    fr: "Revoke session n'est pas disponible pour les comptes Active Directory : l'action s'applique aux sessions Microsoft Entra ID (et Okta). Le compte AD DS de Ben reste activé et peut toujours s'authentifier auprès des contrôleurs de domaine."
references:
  - title: Remediation actions in Microsoft Defender for Identity
    url: https://learn.microsoft.com/en-us/defender-for-identity/remediation-actions
