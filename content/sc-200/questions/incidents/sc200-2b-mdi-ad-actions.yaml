id: sc200-2b-mdi-ad-actions
objective: "2.1.6"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Northwind Traders has an on-premises Active Directory domain. Microsoft Defender for Identity sensors run on all domain controllers, and **Automatically use the sensor's local system account** is enabled. The users aren't synchronized to Microsoft Entra ID.

    A Defender for Identity alert shows that the Active Directory account **jsmith** was used in a pass-the-hash attack. You open the identity page of jsmith in the Defender portal.

    Which two remediation actions can Defender for Identity perform on the Active Directory account?

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind Traders dispose d'un domaine Active Directory local. Des capteurs Microsoft Defender pour Identity s'exécutent sur tous les contrôleurs de domaine, et **Automatically use the sensor's local system account** est activé. Les utilisateurs ne sont pas synchronisés avec Microsoft Entra ID.

    Une alerte Defender pour Identity montre que le compte Active Directory **jsmith** a été utilisé dans une attaque pass-the-hash. Vous ouvrez la page d'identité de jsmith dans le portail Defender.

    Quelles sont les deux actions de correction que Defender pour Identity peut effectuer sur le compte Active Directory ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: Disable }
    - { id: b, text: Force password change }
    - { id: c, text: Revoke session }
    - { id: d, text: Mark as compromised }
answer: { optionIds: [ a, b ] }
explanation:
  correct:
    en: |
      For Active Directory, Defender for Identity supports Disable, Enable and Force password change; the domain controller sensors run them with the local system account. Disabling jsmith and forcing a password change contain the account and invalidate the stolen NTLM hash.
    fr: |
      Pour Active Directory, Defender pour Identity prend en charge Disable, Enable et Force password change ; les capteurs des contrôleurs de domaine les exécutent avec le compte système local. Désactiver jsmith et forcer un changement de mot de passe contiennent le compte et invalident le hachage NTLM volé.
  options:
    c: { en: "Revoke session is supported for Microsoft Entra ID and Okta identities only.", fr: "Revoke session n'est pris en charge que pour les identités Microsoft Entra ID et Okta." }
    d: { en: "Mark as compromised applies to Microsoft Entra ID only, and these users aren't synchronized.", fr: "Mark as compromised ne s'applique qu'à Microsoft Entra ID, et ces utilisateurs ne sont pas synchronisés." }
references:
  - title: Remediation actions in Microsoft Defender for Identity
    url: https://learn.microsoft.com/en-us/defender-for-identity/remediation-actions
