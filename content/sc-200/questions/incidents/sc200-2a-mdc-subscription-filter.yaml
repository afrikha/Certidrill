id: sc200-2a-mdc-subscription-filter
objective: "2.1.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Fabrikam, Inc. has 12 Azure subscriptions protected by Microsoft Defender for Cloud. The Defender for Cloud alerts and incidents are integrated into the Microsoft Defender portal.

    An analyst responsible for a subscription named Sub-Prod wants the alert queue of the Defender portal to show only the Defender for Cloud alerts of Sub-Prod.

    What should the analyst use?
  fr: |
    Fabrikam, Inc. dispose de 12 abonnements Azure protégés par Microsoft Defender pour le cloud. Les alertes et incidents de Defender pour le cloud sont intégrés au portail Microsoft Defender.

    Un analyste responsable d'un abonnement nommé Sub-Prod veut que la file d'attente des alertes du portail Defender n'affiche que les alertes Defender pour le cloud de Sub-Prod.

    Qu'est-ce que l'analyste doit utiliser ?
body:
  options:
    - { id: a, text: { en: "A Unified RBAC role scoped to Sub-Prod", fr: "Un rôle RBAC unifié limité à Sub-Prod" } }
    - { id: b, text: { en: "The alert subscription ID filter", fr: "Le filtre ID d'abonnement de l'alerte" } }
    - { id: c, text: { en: "A device group that contains the Sub-Prod VMs", fr: "Un groupe d'appareils qui contient les machines virtuelles de Sub-Prod" } }
    - { id: d, text: { en: "The Service sources filter set to Defender for Cloud", fr: "Le filtre Sources de service réglé sur Defender pour le cloud" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Defender for Cloud alerts are associated with the tenant. The alert subscription ID filter of the alert and incident queues shows the Defender for Cloud alerts of a specific subscription.
    fr: |
      Les alertes de Defender pour le cloud sont associées au locataire. Le filtre ID d'abonnement de l'alerte des files d'attente des alertes et des incidents affiche les alertes Defender pour le cloud d'un abonnement précis.
  options:
    a: { en: "Permissions to view Defender for Cloud alerts apply to the whole tenant; viewing specific subscriptions isn't supported.", fr: "Les autorisations de consultation des alertes de Defender pour le cloud s'appliquent à tout le locataire ; la consultation d'abonnements précis n'est pas prise en charge." }
    c: { en: "Device groups scope Defender for Endpoint devices, not Defender for Cloud alerts on storage, SQL or other cloud resources.", fr: "Les groupes d'appareils délimitent les appareils Defender for Endpoint, pas les alertes Defender pour le cloud sur le stockage, SQL ou d'autres ressources cloud." }
    d: { en: "The Service sources filter keeps the Defender for Cloud alerts of all 12 subscriptions.", fr: "Le filtre Sources de service conserve les alertes Defender pour le cloud des 12 abonnements." }
references:
  - title: Alerts and incidents in Microsoft Defender XDR for Microsoft Defender for Cloud
    url: https://learn.microsoft.com/en-us/defender-xdr/microsoft-365-security-center-defender-cloud
