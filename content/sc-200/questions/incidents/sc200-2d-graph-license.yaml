id: sc200-2d-graph-license
objective: "2.3.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Northwind Traders has a Microsoft Entra tenant that uses the Microsoft Entra ID Free edition and a Microsoft Sentinel workspace named LAW-NW.

    The SOC wants to investigate the requests that third-party applications send to Microsoft Graph. You plan to stream the Microsoft Graph activity logs to LAW-NW.

    You need to meet the licensing prerequisite for the Microsoft Graph activity logs. The solution must minimize costs.

    Which license should the tenant have?
  fr: |
    Northwind Traders dispose d'un locataire Microsoft Entra qui utilise l'édition Microsoft Entra ID Free et d'un espace de travail Microsoft Sentinel nommé LAW-NW.

    Le SOC veut examiner les requêtes que des applications tierces envoient à Microsoft Graph. Vous prévoyez de diffuser les journaux d'activité Microsoft Graph vers LAW-NW.

    Vous devez respecter le prérequis de licence des journaux d'activité Microsoft Graph. La solution doit réduire les coûts au minimum.

    De quelle licence le locataire doit-il disposer ?
body:
  options:
    - { id: a, text: Microsoft Entra ID P2 }
    - { id: b, text: Microsoft Purview Audit (Premium) }
    - { id: c, text: Microsoft Entra ID P1 }
    - { id: d, text: Microsoft Defender for Cloud Apps }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Microsoft Graph activity logs require a Microsoft Entra ID P1 or P2 tenant license. P1 meets the prerequisite at a lower cost than P2. You then configure a diagnostic setting that sends the logs to the Log Analytics workspace.
    fr: |
      Les journaux d'activité Microsoft Graph exigent une licence de locataire Microsoft Entra ID P1 ou P2. P1 respecte ce prérequis pour un coût inférieur à P2. Vous configurez ensuite un paramètre de diagnostic qui envoie les journaux vers l'espace de travail Log Analytics.
  options:
    a: { en: "P2 also meets the prerequisite, but it costs more than P1.", fr: "P2 respecte aussi le prérequis, mais il coûte plus cher que P1." }
    b: { en: "Audit (Premium) extends Microsoft Purview Audit; it is not a prerequisite of the Microsoft Graph activity logs.", fr: "Audit (Premium) étend Microsoft Purview Audit ; ce n'est pas un prérequis des journaux d'activité Microsoft Graph." }
    d: { en: "Defender for Cloud Apps is not the license that enables the Microsoft Graph activity logs diagnostic category.", fr: "Defender for Cloud Apps n'est pas la licence qui active la catégorie de diagnostic des journaux d'activité Microsoft Graph." }
references:
  - title: Access Microsoft Graph activity logs for tenant monitoring
    url: https://learn.microsoft.com/en-us/graph/microsoft-graph-activity-logs-overview
