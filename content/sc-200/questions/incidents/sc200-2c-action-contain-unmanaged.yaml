id: sc200-2c-action-contain-unmanaged
objective: "2.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Device discovery in Microsoft Defender for Endpoint found a Windows device named **LEGACY-PC4** that isn't onboarded. LEGACY-PC4 attempts SMB connections to many onboarded Windows 10 and Windows Server 2022 devices.

    You need the onboarded devices to block all incoming and outgoing communication with LEGACY-PC4. The block must still apply if LEGACY-PC4 gets a new IP address.

    What should you do?
  fr: |
    La découverte d'appareils de Microsoft Defender pour point de terminaison a trouvé un appareil Windows nommé **LEGACY-PC4** qui n'est pas intégré. LEGACY-PC4 tente des connexions SMB vers de nombreux appareils Windows 10 et Windows Server 2022 intégrés.

    Les appareils intégrés doivent bloquer toute communication entrante et sortante avec LEGACY-PC4. Le blocage doit continuer à s'appliquer si LEGACY-PC4 obtient une nouvelle adresse IP.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Isolate LEGACY-PC4 from its device page", fr: "Isoler LEGACY-PC4 depuis sa page d'appareil" }
    - id: b
      text: { en: "Create an IP address indicator that blocks the current IP address of LEGACY-PC4", fr: "Créer un indicateur d'adresse IP qui bloque l'adresse IP actuelle de LEGACY-PC4" }
    - id: c
      text: { en: "Contain LEGACY-PC4 from its device page", fr: "Confiner LEGACY-PC4 (Contain device) depuis sa page d'appareil" }
    - id: d
      text: { en: "Restrict app execution on LEGACY-PC4", fr: "Restreindre l'exécution des applications sur LEGACY-PC4" }
answer: { optionId: c }
explanation:
  correct:
    en: Contain device is meant for unmanaged devices. All onboarded devices then block incoming and outgoing communication with the contained device, and if its IP address changes, they block the new address and stop blocking the old one within about five minutes.
    fr: Contain device est prévu pour les appareils non gérés. Tous les appareils intégrés bloquent alors les communications entrantes et sortantes avec l'appareil confiné, et si son adresse IP change, ils bloquent la nouvelle adresse et cessent de bloquer l'ancienne en cinq minutes environ.
  options:
    a:
      en: Isolation is enforced by the Defender for Endpoint sensor of the device itself, which LEGACY-PC4 doesn't have.
      fr: L'isolation est appliquée par le capteur Defender pour point de terminaison de l'appareil lui-même, que LEGACY-PC4 n'a pas.
    b:
      en: An indicator targets a fixed IP address, so the block wouldn't follow LEGACY-PC4 to a new address.
      fr: "Un indicateur cible une adresse IP fixe : le blocage ne suivrait pas LEGACY-PC4 vers une nouvelle adresse."
    d:
      en: Restricting app execution needs the Defender for Endpoint sensor and Microsoft Defender Antivirus on the device, and it doesn't block network traffic.
      fr: Restreindre l'exécution des applications exige le capteur Defender pour point de terminaison et l'Antivirus Microsoft Defender sur l'appareil, et cela ne bloque pas le trafic réseau.
references:
  - title: Take response actions on a device in Microsoft Defender for Endpoint
    url: https://learn.microsoft.com/en-us/defender-endpoint/respond-machine-alerts
