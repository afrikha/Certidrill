id: sc200-cs1c-email-remediation
objective: "2.1.1"
type: ordering
caseStudy: sc200-cs1c-tailwind-traders
difficulty: 2
status: draft
stem:
  en: |
    You need to remove the phishing messages to meet the email remediation requirement.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Vous devez retirer les messages d'hameçonnage pour respecter l'exigence de correction des e-mails.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: filter, text: { en: "In Threat Explorer, open the All email view and filter on the sender domain giftcards-tailwind.example.", fr: "Dans l'Explorateur de menaces (Threat Explorer), ouvrir la vue All email et filtrer sur le domaine d'expéditeur giftcards-tailwind.example." } }
    - { id: search, text: { en: "In Microsoft Purview eDiscovery, create a Content search for the sender domain giftcards-tailwind.example.", fr: "Dans Microsoft Purview eDiscovery, créer une recherche de contenu sur le domaine d'expéditeur giftcards-tailwind.example." } }
    - { id: manual, text: { en: "Select the messages one by one in the results list.", fr: "Sélectionner les messages un par un dans la liste des résultats." } }
    - { id: selectall, text: { en: "Select all the messages returned by the query by using the select all option.", fr: "Sélectionner tous les messages renvoyés par la requête avec l'option de sélection de tout." } }
    - { id: soft, text: { en: "In the Take action wizard, choose Soft delete with two-step approval.", fr: "Dans l'Assistant Take action, choisir Soft delete avec une approbation en deux étapes." } }
    - { id: junk, text: { en: "In the Take action wizard, choose Move to junk folder with direct approval.", fr: "Dans l'Assistant Take action, choisir Move to junk folder avec une approbation directe." } }
    - { id: approve, text: { en: "Have a second analyst approve the action on the Pending tab of the Action center.", fr: "Faire approuver l'action par un second analyste dans l'onglet En attente du centre de notifications." } }
answer:
  sequence: [ filter, selectall, soft, approve ]
explanation:
  correct:
    en: "Threat Explorer finds the delivered messages, and because 3,400 messages exceed the 100 messages you can select by hand, you select them by query with select all (up to 200,000 messages). Soft delete moves the messages to Recoverable Items\\Deletions, where users and administrators can recover them. With two-step approval, the action waits on the Pending tab of the Action center until a second reviewer approves it."
    fr: "L'Explorateur de menaces trouve les messages remis, et comme 3 400 messages dépassent les 100 messages sélectionnables à la main, vous les sélectionnez par requête avec la sélection de tout (jusqu'à 200 000 messages). Soft delete déplace les messages vers Recoverable Items\\Deletions, où les utilisateurs et les administrateurs peuvent les récupérer. Avec l'approbation en deux étapes, l'action attend dans l'onglet En attente du centre de notifications jusqu'à ce qu'un second réviseur l'approuve."
  options:
    search: { en: "A Content search finds messages but does not offer the Threat Explorer remediation actions with two-step approval in the Action center.", fr: "Une recherche de contenu trouve des messages, mais n'offre pas les actions de correction de l'Explorateur de menaces avec approbation en deux étapes dans le centre de notifications." }
    manual: { en: "You can select at most 100 messages by hand, fewer than the 3,400 messages of the campaign.", fr: "Vous ne pouvez sélectionner que 100 messages au maximum à la main, moins que les 3 400 messages de la campagne." }
    junk: { en: "Move to junk folder leaves the messages in a folder that users see, and direct approval runs the action immediately without a second analyst.", fr: "Move to junk folder laisse les messages dans un dossier visible par les utilisateurs, et l'approbation directe exécute l'action immédiatement, sans second analyste." }
references:
  - title: Remediate malicious email that was delivered in Office 365
    url: https://learn.microsoft.com/en-us/defender-office-365/remediate-malicious-email-delivered-office-365
