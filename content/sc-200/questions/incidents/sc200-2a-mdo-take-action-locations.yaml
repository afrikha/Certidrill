id: sc200-2a-mdo-take-action-locations
objective: "2.1.1"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    Proseware, Inc. uses Microsoft Defender for Office 365 Plan 2. An analyst must soft delete malicious messages that were delivered to user mailboxes by using the **Take action** wizard in the Microsoft Defender portal.

    From which two locations can the analyst start the remediation?

    Each correct answer presents a complete solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware, Inc. utilise Microsoft Defender pour Office 365 Plan 2. Un analyste doit supprimer de façon réversible (Soft delete) des messages malveillants remis dans des boîtes aux lettres à l'aide de l'Assistant **Take action** du portail Microsoft Defender.

    Depuis quels deux emplacements l'analyste peut-il lancer la correction ?

    Chaque bonne réponse constitue une solution complète.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Threat Explorer", fr: "L'Explorateur de menaces (Threat Explorer)" } }
    - { id: b, text: { en: "The Restricted entities page", fr: "La page Entités restreintes" } }
    - { id: c, text: { en: "Advanced hunting", fr: "Le repérage avancé" } }
    - { id: d, text: { en: "The Tenant Allow/Block Lists page", fr: "La page Listes d'autorisation/de blocage du locataire" } }
    - { id: e, text: { en: "Message trace in the Exchange admin center", fr: "Le suivi des messages dans le Centre d'administration Exchange" } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: Analysts remediate delivered email from Threat Explorer (Malware, Phish or All email views) and from advanced hunting, where the Take actions panel acts on email query results. Both create entries in the Action center. The Email entity page and automated investigations also offer remediation actions.
    fr: Les analystes corrigent les e-mails remis depuis l'Explorateur de menaces (vues Malware, Phish ou All email) et depuis le repérage avancé, où le volet Take actions agit sur les résultats d'une requête sur les e-mails. Les deux créent des entrées dans le centre de notifications. La page d'entité Email et les enquêtes automatisées proposent aussi des actions de correction.
  options:
    b: { en: "The Restricted entities page unblocks users who can't send email; it doesn't remediate messages.", fr: "La page Entités restreintes débloque les utilisateurs qui ne peuvent plus envoyer d'e-mails ; elle ne corrige pas de messages." }
    d: { en: "Tenant Allow/Block List entries affect future mail flow; they don't remove messages that were already delivered.", fr: "Les entrées de la liste d'autorisation/de blocage du locataire agissent sur le flux de messagerie futur ; elles ne retirent pas les messages déjà remis." }
    e: { en: "Message trace shows the delivery path of messages but offers no remediation action.", fr: "Le suivi des messages montre le parcours de remise des messages mais n'offre aucune action de correction." }
references:
  - title: Remediate malicious email that was delivered in Office 365
    url: https://learn.microsoft.com/en-us/defender-office-365/remediate-malicious-email-delivered-office-365
