id: sc200-2c-disruption-policy-status
objective: "2.2.4"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Incident 9120 in the Microsoft Defender portal has the Attack Disruption tag. Automatic attack disruption contained a device named **WS-22** and applied the **Contain user** action to an account named **jdoe**. You completed the investigation and the remediation.

    You need to release WS-22 and jdoe now, without waiting for any automatic removal.

    How should you complete the sentence? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    L'incident 9120 du portail Microsoft Defender porte la balise Attack Disruption. L'interruption automatique d'attaque a contenu un appareil nommé **WS-22** et appliqué l'action **Contain user** à un compte nommé **jdoe**. Vous avez terminé l'enquête et la correction.

    Vous devez libérer WS-22 et jdoe dès maintenant, sans attendre une éventuelle suppression automatique.

    Comment devez-vous compléter la phrase ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Select WS-22 in the incident graph and select [[s1]]. For jdoe, select the Contain User action in the [[s2]] and select Undo, by using an account that has the [[s3]] role.
    fr: |
      Sélectionnez WS-22 dans le graphe de l'incident, puis [[s1]]. Pour jdoe, sélectionnez l'action Contain User dans [[s2]] et sélectionnez Undo, avec un compte qui a le rôle [[s3]].
  slots:
    - id: s1
      options:
        - { id: containment, text: Release from containment }
        - { id: isolation, text: Release from isolation }
        - { id: enable, text: Enable user }
        - { id: restrict, text: Remove app restrictions }
    - id: s2
      options:
        - { id: actioncenter, text: { en: "Action center", fr: "l'Action center" } }
        - { id: queue, text: { en: "incident queue", fr: "la file d'attente des incidents" } }
        - { id: inventory, text: { en: "device inventory", fr: "l'inventaire des appareils" } }
    - id: s3
      options:
        - { id: ga, text: Global Administrator }
        - { id: secop, text: Security Operator }
        - { id: useradmin, text: User Administrator }
        - { id: secreader, text: Security Reader }
answer:
  values: { s1: containment, s2: actioncenter, s3: ga }
explanation:
  correct:
    en: A contained device is released from the incident graph with Release from containment. Contain user doesn't disable the account, so Enable user doesn't apply; you undo it from the Contain User action in the Action center (or from the user in the user inventory, the incident or the alert side pane), and undoing contain user requires the Global Administrator role. Without action, the user is removed from containment within five days.
    fr: Un appareil contenu se libère depuis le graphe de l'incident avec Release from containment. Contain user ne désactive pas le compte, donc Enable user ne s'applique pas ; vous l'annulez depuis l'action Contain User de l'Action center (ou depuis l'utilisateur dans l'inventaire des utilisateurs, le volet latéral de l'incident ou de l'alerte), et l'annulation de Contain user exige le rôle Global Administrator. Sans intervention, l'utilisateur sort du confinement dans les cinq jours.
  options:
    isolation: { en: "WS-22 was contained, not isolated; isolation is released with Release from isolation.", fr: "WS-22 a été contenu, pas isolé ; l'isolation se lève avec Release from isolation." }
    enable: { en: "Enable user releases an account that disruption disabled; it doesn't apply to a contained device.", fr: "Enable user libère un compte que l'interruption a désactivé ; il ne s'applique pas à un appareil contenu." }
    secop: { en: "Undoing contain user actions requires Global Administrator, not Security Operator.", fr: "L'annulation des actions Contain user exige Global Administrator, pas Security Operator." }
    useradmin: { en: "User Administrator manages accounts in Microsoft Entra ID; contain user is enforced by Defender for Endpoint, and undoing it requires Global Administrator.", fr: "User Administrator gère les comptes dans Microsoft Entra ID ; Contain user est appliqué par Defender pour point de terminaison, et son annulation exige Global Administrator." }
references:
  - title: Take response actions on a device in Microsoft Defender for Endpoint
    url: https://learn.microsoft.com/en-us/defender-endpoint/respond-machine-alerts
  - title: Details and results of an automatic attack disruption action
    url: https://learn.microsoft.com/en-us/defender-xdr/autoad-results
