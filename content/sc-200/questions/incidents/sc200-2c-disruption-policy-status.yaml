id: sc200-2c-disruption-policy-status
objective: "2.2.4"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Incident 9120 in the Microsoft Defender portal has the Attack Disruption tag. Automatic attack disruption contained a user and two devices. Later, an analyst released one of the devices.

    You need to identify which disruption actions are still enforced.

    How should you complete the sentence? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    L'incident 9120 du portail Microsoft Defender porte la balise Attack Disruption. L'interruption automatique d'attaque a confiné un utilisateur et deux appareils. Plus tard, un analyste a libéré l'un des appareils.

    Vous devez identifier les actions d'interruption encore appliquées.

    Comment devez-vous compléter la phrase ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Open the [[s1]] tab of incident 9120, filter Performed by on AttackDisruption, and read the [[s2]] column. Actions that are still enforced show the value [[s3]].
    fr: |
      Ouvrez l'onglet [[s1]] de l'incident 9120, filtrez Performed by sur AttackDisruption et lisez la colonne [[s2]]. Les actions encore appliquées affichent la valeur [[s3]].
  slots:
    - id: s1
      options:
        - { id: activities, text: Activities }
        - { id: evidence, text: Evidence and Response }
        - { id: investigations, text: Investigations }
        - { id: assets, text: Assets }
    - id: s2
      options:
        - { id: policy, text: Policy status }
        - { id: activity, text: Activity status }
        - { id: remediation, text: Remediation status }
        - { id: classification, text: Classification }
    - id: s3
      options:
        - { id: active, text: Active }
        - { id: inactive, text: Inactive }
        - { id: na, text: Not applicable }
        - { id: nostatus, text: No status }
answer:
  values: { s1: activities, s2: policy, s3: active }
explanation:
  correct:
    en: The Activities tab lists the manual and automated actions of the incident; Performed by AttackDisruption keeps the disruption and predictive shielding actions. The Policy status column (preview) gives a stateful view, where Active means the policy is still enforced and Inactive means it was applied and later lifted, as for the released device.
    fr: L'onglet Activities liste les actions manuelles et automatiques de l'incident ; Performed by AttackDisruption conserve les actions d'interruption et de protection prédictive. La colonne Policy status (préversion) donne une vue avec état, où Active signifie que la stratégie est toujours appliquée et Inactive qu'elle a été appliquée puis levée, comme pour l'appareil libéré.
  options:
    activity: { en: "Activity status tells whether the action completed, not whether its policy is still in force.", fr: "Activity status indique si l'action s'est terminée, pas si sa stratégie est toujours en vigueur." }
    inactive: { en: "Inactive is the value of a policy that was applied and is no longer active.", fr: "Inactive est la valeur d'une stratégie appliquée qui n'est plus active." }
    na: { en: "Not applicable is used for actions such as uncontain, which reverse a previous action rather than create a policy.", fr: "Not applicable sert aux actions comme la levée du confinement, qui annulent une action précédente au lieu de créer une stratégie." }
    nostatus: { en: "No status means the status couldn't be retrieved, for example while the action is in progress.", fr: "No status signifie que l'état n'a pas pu être récupéré, par exemple pendant que l'action est en cours." }
references:
  - title: Details and results of an automatic attack disruption action
    url: https://learn.microsoft.com/en-us/defender-xdr/autoad-results
