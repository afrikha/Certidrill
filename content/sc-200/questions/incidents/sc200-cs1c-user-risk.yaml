id: sc200-cs1c-user-risk
objective: "2.1.5"
type: yesno_statements
caseStudy: sc200-cs1c-tailwind-traders
difficulty: 2
status: draft
stem:
  en: |
    You are reviewing how the user risk of Ana Diaz can be remediated to meet the identity risk requirement. Ana Diaz is registered for multifactor authentication (MFA).

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous examinez comment le risque utilisateur d'Ana Diaz peut être corrigé pour respecter l'exigence relative au risque d'identité. Ana Diaz est inscrite à l'authentification multifacteur (MFA).

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: If Ana Diaz changes her password on-premises by pressing Ctrl+Alt+Del on her domain-joined device, her user risk is remediated automatically.
        fr: Si Ana Diaz change son mot de passe en local en appuyant sur Ctrl+Alt+Suppr sur son appareil joint au domaine, son risque utilisateur est corrigé automatiquement.
    - id: s2
      text:
        en: If an analyst selects Dismiss risk for Ana Diaz, her password is reset.
        fr: Si un analyste sélectionne Dismiss risk pour Ana Diaz, son mot de passe est réinitialisé.
    - id: s3
      text:
        en: If a risk-based Conditional Access policy requires a password change and Ana Diaz completes MFA and changes her password, her risk state becomes Remediated.
        fr: Si une stratégie d'accès conditionnel basée sur le risque exige un changement de mot de passe et qu'Ana Diaz effectue la MFA puis change son mot de passe, son état de risque devient Remediated.
answer:
  values: { s1: false, s2: false, s3: true }
explanation:
  correct:
    en: "An on-premises password change resets user risk only when password hash synchronization is used and Allow on-premises password change to reset user risk is enabled; Tailwind Traders has disabled this setting. Dismiss risk sets the risk state to Dismissed without changing the password, so the account is not made safe. A risk-based Conditional Access policy that requires a password change lets a user registered for MFA self-remediate: after MFA and a password change, the risk state changes from At risk to Remediated."
    fr: "Un changement de mot de passe local ne réinitialise le risque utilisateur que si la synchronisation de hachage de mot de passe est utilisée et que le paramètre Allow on-premises password change to reset user risk est activé ; Tailwind Traders a désactivé ce paramètre. Dismiss risk définit l'état de risque sur Dismissed sans changer le mot de passe : le compte n'est pas sécurisé pour autant. Une stratégie d'accès conditionnel basée sur le risque qui exige un changement de mot de passe permet à un utilisateur inscrit à la MFA de se corriger lui-même : après la MFA et le changement de mot de passe, l'état de risque passe de At risk à Remediated."
references:
  - title: Remediate risks and unblock users
    url: https://learn.microsoft.com/en-us/entra/id-protection/howto-identity-protection-remediate-unblock
