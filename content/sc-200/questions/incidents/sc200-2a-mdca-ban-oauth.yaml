id: sc200-2a-mdca-ban-oauth
objective: "2.1.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Northwind Traders uses Microsoft Defender for Cloud Apps with the Microsoft 365 app connector. A **Misleading OAuth app name** alert reports a third-party app whose name imitates a Microsoft service. Twelve users granted the app access to their mailboxes.

    You confirm that the alert is a true positive. You need to stop the app from accessing Microsoft 365 data and prevent it from receiving permissions in the future.

    What should you do?
  fr: |
    Northwind Traders utilise Microsoft Defender pour les applications cloud avec le connecteur d'application Microsoft 365. Une alerte **Misleading OAuth app name** signale une application tierce dont le nom imite un service Microsoft. Douze utilisateurs ont accordé à l'application l'accès à leur boîte aux lettres.

    Vous confirmez que l'alerte est un vrai positif. Vous devez empêcher l'application d'accéder aux données Microsoft 365 et d'obtenir des autorisations à l'avenir.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Tag the app as Unsanctioned in the Cloud app catalog.", fr: "Étiqueter l'application comme Unsanctioned dans le catalogue d'applications cloud." } }
    - { id: b, text: { en: "Apply Require user to sign in again to the twelve users.", fr: "Appliquer Require user to sign in again aux douze utilisateurs." } }
    - { id: c, text: { en: "Ban the app from the OAuth app governance page.", fr: "Interdire (Ban) l'application depuis la page de gouvernance des applications OAuth." } }
    - { id: d, text: { en: "Put the files created by the app in admin quarantine.", fr: "Placer les fichiers créés par l'application en quarantaine administrateur." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      For a confirmed misleading OAuth app, you review the requested permissions and the users who granted access, then ban the app. In Microsoft 365, banning doesn't allow the third-party app's permissions to access Office; you can also choose to notify the users who granted access.
    fr: |
      Pour une application OAuth trompeuse confirmée, vous examinez les autorisations demandées et les utilisateurs qui ont accordé l'accès, puis vous interdisez l'application. Dans Microsoft 365, l'interdiction ne permet plus aux autorisations de l'application tierce d'accéder à Office ; vous pouvez aussi choisir de prévenir les utilisateurs qui ont accordé l'accès.
  options:
    a: { en: "The Unsanctioned tag governs discovered cloud apps used through the network (Shadow IT); it doesn't act on OAuth permissions.", fr: "L'étiquette Unsanctioned gouverne les applications cloud découvertes utilisées via le réseau (Shadow IT) ; elle n'agit pas sur les autorisations OAuth." }
    b: { en: "Revoking the users' sessions doesn't remove the consent granted to the app.", fr: "Révoquer les sessions des utilisateurs ne retire pas le consentement accordé à l'application." }
    d: { en: "Quarantining files doesn't stop the app from using its permissions.", fr: "Mettre des fichiers en quarantaine n'empêche pas l'application d'utiliser ses autorisations." }
references:
  - title: How to investigate anomaly detection alerts
    url: https://learn.microsoft.com/en-us/defender-cloud-apps/investigate-anomaly-alerts
  - title: Governing connected apps
    url: https://learn.microsoft.com/en-us/defender-cloud-apps/governance-actions
