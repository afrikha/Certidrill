id: sc200-sr2-mdi-disable-2
objective: "2.1.6"
type: series_yesno
series: sc200-sr2-mdi-disable
seriesOrder: 2
difficulty: 1
status: draft
stem:
  en: You disable Ben's Active Directory account.
  fr: Vous désactivez le compte Active Directory de Ben.
body:
  solution:
    en: From Ben's identity page in the Microsoft Defender portal, you run the **Disable** remediation action on his **Active Directory** account.
    fr: Depuis la page d'identité de Ben dans le portail Microsoft Defender, vous exécutez l'action de correction **Disable** sur son compte **Active Directory**.
answer: { value: true }
explanation:
  correct:
    en: The Disable action is supported for Active Directory accounts. The Defender for Identity sensor on a domain controller runs it with the domain controller's local system account, which the action account setting allows, and your custom role includes the required Response (manage) permission.
    fr: L'action Disable est prise en charge pour les comptes Active Directory. Le capteur Defender pour Identity d'un contrôleur de domaine l'exécute avec le compte système local du contrôleur de domaine, ce que le paramètre des comptes d'action autorise, et votre rôle personnalisé inclut l'autorisation Response (manage) requise.
references:
  - title: Remediation actions in Microsoft Defender for Identity
    url: https://learn.microsoft.com/en-us/defender-for-identity/remediation-actions
