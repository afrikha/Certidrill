id: sc200-2c-timeline-firewall-events
objective: "2.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Contoso has Windows 11 devices onboarded to Microsoft Defender for Endpoint. Windows Defender Firewall blocks some outbound connections on a device named **WS-ENG-31**.

    In the timeline of WS-ENG-31, you can't find any event for the connections that the firewall blocked (event 5157).

    You need the blocked connections to appear in the timeline of the Contoso devices.

    What should you configure on the devices?
  fr: |
    Contoso dispose d'appareils Windows 11 intégrés à Microsoft Defender pour point de terminaison. Le Pare-feu Windows Defender bloque certaines connexions sortantes sur un appareil nommé **WS-ENG-31**.

    Dans la chronologie de WS-ENG-31, vous ne trouvez aucun événement pour les connexions bloquées par le pare-feu (événement 5157).

    Vous devez faire apparaître les connexions bloquées dans la chronologie des appareils de Contoso.

    Que devez-vous configurer sur les appareils ?
body:
  options:
    - id: a
      text: { en: "Windows Defender Firewall logging of dropped packets to pfirewall.log", fr: "La journalisation des paquets rejetés du Pare-feu Windows Defender dans pfirewall.log" }
    - id: b
      text: { en: "Network protection in block mode", fr: "La protection du réseau en mode blocage" }
    - id: c
      text: { en: "The Audit Filtering Platform Connection audit policy", fr: "La stratégie d'audit Audit Filtering Platform Connection" }
    - id: d
      text: { en: "Cloud-delivered protection in Microsoft Defender Antivirus", fr: "La protection fournie par le cloud de l'Antivirus Microsoft Defender" }
answer: { optionId: c }
explanation:
  correct:
    en: Firewall events 5025 (firewall service stopped), 5031 (application blocked from accepting incoming connections) and 5157 (blocked connection) appear in the device timeline only when the Audit Filtering Platform Connection audit policy is enabled.
    fr: Les événements de pare-feu 5025 (service de pare-feu arrêté), 5031 (application empêchée d'accepter des connexions entrantes) et 5157 (connexion bloquée) n'apparaissent dans la chronologie de l'appareil que si la stratégie d'audit Audit Filtering Platform Connection est activée.
  options:
    a:
      en: The firewall log file is collected in the investigation package, but it doesn't add events to the timeline.
      fr: Le fichier journal du pare-feu est collecté dans le package d'investigation, mais il n'ajoute pas d'événements à la chronologie.
    b:
      en: Network protection blocks connections to dangerous domains; it doesn't make Windows Defender Firewall events visible.
      fr: La protection du réseau bloque les connexions vers des domaines dangereux ; elle ne rend pas visibles les événements du Pare-feu Windows Defender.
    d:
      en: Cloud-delivered protection improves antivirus detections; it has no effect on firewall audit events.
      fr: La protection fournie par le cloud améliore les détections antivirus ; elle n'a aucun effet sur les événements d'audit du pare-feu.
references:
  - title: Investigate devices in Microsoft Defender for Endpoint
    url: https://learn.microsoft.com/en-us/defender-endpoint/device-timeline-event-flag
