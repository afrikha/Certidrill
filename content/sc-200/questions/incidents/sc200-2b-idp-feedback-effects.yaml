id: sc200-2b-idp-feedback-effects
objective: "2.1.5"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove Bank uses Microsoft Entra ID Protection. Analysts give feedback on risky users from the **Risky users** report after each investigation.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove Bank utilise Microsoft Entra ID Protection. Les analystes donnent leur retour sur les utilisateurs à risque depuis le rapport **Utilisateurs à risque** après chaque enquête.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          When an analyst selects Confirm user safe, the risk and the detections of the user are removed, and the user is placed in learning mode.
        fr: |
          Lorsqu'un analyste sélectionne Confirm user safe, le risque et les détections de l'utilisateur sont supprimés, et l'utilisateur est placé en mode d'apprentissage.
    - id: s2
      text:
        en: |
          When an analyst selects Confirm user compromised, a detection named Admin confirmed user compromised is added to the user.
        fr: |
          Lorsqu'un analyste sélectionne Confirm user compromised, une détection nommée Admin confirmed user compromised est ajoutée à l'utilisateur.
    - id: s3
      text:
        en: |
          When an analyst dismisses the user risk of an account used for an approved penetration test, similar activity from that account is excluded from future risk evaluation.
        fr: |
          Lorsqu'un analyste ignore le risque utilisateur d'un compte utilisé pour un test d'intrusion approuvé, les activités similaires de ce compte sont exclues de l'évaluation future du risque.
answer:
  values: { s1: true, s2: true, s3: false }
explanation:
  correct:
    en: |
      Confirm user safe is false positive feedback; it removes the risk and the detections, and the user relearns usage properties in learning mode. Confirm user compromised sets the user risk to High and adds the Admin confirmed user compromised detection. Dismiss user risk marks a benign true positive, such as a known penetration test, but similar users continue to be evaluated for risk.
    fr: |
      Confirm user safe est un retour de type faux positif ; il supprime le risque et les détections, et l'utilisateur réapprend ses propriétés d'utilisation en mode d'apprentissage. Confirm user compromised fait passer le risque utilisateur à High et ajoute la détection Admin confirmed user compromised. Dismiss user risk signale un vrai positif bénin, comme un test d'intrusion connu, mais les utilisateurs similaires continuent d'être évalués.
references:
  - title: Provide risk feedback in Microsoft Entra ID Protection
    url: https://learn.microsoft.com/en-us/entra/id-protection/howto-identity-protection-risk-feedback
