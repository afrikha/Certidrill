id: sc200-2a-irm-statements
objective: "2.1.2"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    Tailspin Toys integrates Microsoft Purview Insider Risk Management with Microsoft Defender XDR. SOC analysts have the Security Operator role and are members of the Insider Risk Management Analysts role group. Several insider risk alerts were raised for a user named User5 during the same week.

    Which two statements are true?

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin Toys intègre la gestion des risques internes de Microsoft Purview à Microsoft Defender XDR. Les analystes SOC disposent du rôle Security Operator et sont membres du groupe de rôles Insider Risk Management Analysts. Plusieurs alertes de risque interne ont été déclenchées pour un utilisateur nommé User5 au cours de la même semaine.

    Quelles sont les deux affirmations vraies ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "The insider risk alerts for User5 are correlated into a single incident.", fr: "Les alertes de risque interne de User5 sont corrélées dans un seul incident." } }
    - { id: b, text: { en: "Alerts raised by custom detection rules on insider risk data also appear in the Microsoft Purview portal.", fr: "Les alertes déclenchées par des règles de détection personnalisées sur les données de risque interne apparaissent aussi dans le portail Microsoft Purview." } }
    - { id: c, text: { en: "A status change made in the Defender portal is reflected in the Purview portal within 30 minutes.", fr: "Un changement de statut effectué dans le portail Defender est répercuté dans le portail Purview en 30 minutes." } }
    - { id: d, text: { en: "The integration includes the exfiltration events that happen through email.", fr: "L'intégration inclut les événements d'exfiltration par e-mail." } }
    - { id: e, text: { en: "The Security Reader role alone is enough to query the DataSecurityEvents table.", fr: "Le rôle Security Reader suffit à lui seul pour interroger la table DataSecurityEvents." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |
      Insider risk alerts related to one user are correlated into a single incident. Status, severity and classification updates are reflected in both portals within 30 minutes of the alert generation or update.
    fr: |
      Les alertes de risque interne liées à un même utilisateur sont corrélées dans un seul incident. Les mises à jour du statut, de la gravité et de la classification sont répercutées dans les deux portails en 30 minutes après la génération ou la mise à jour de l'alerte.
  options:
    b: { en: "Alerts created from custom detections, or query results linked to incidents, aren't available in the Purview portal.", fr: "Les alertes créées par des détections personnalisées, ou les résultats de requête liés à des incidents, ne sont pas disponibles dans le portail Purview." }
    d: { en: "Exfiltration through email is listed among the data types that the integration doesn't include yet.", fr: "L'exfiltration par e-mail figure parmi les types de données que l'intégration n'inclut pas encore." }
    e: { en: "Querying the insider risk data in advanced hunting requires the Insider Risk Management Analyst or Investigator role.", fr: "Interroger les données de risque interne dans le repérage avancé exige le rôle Insider Risk Management Analyst ou Investigator." }
references:
  - title: Investigate insider risk threats in the Microsoft Defender portal with insights from Microsoft Purview Insider Risk Management
    url: https://learn.microsoft.com/en-us/defender-xdr/irm-investigate-alerts-defender
