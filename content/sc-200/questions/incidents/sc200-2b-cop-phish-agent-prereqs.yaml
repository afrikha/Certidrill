id: sc200-2b-cop-phish-agent-prereqs
objective: "2.1.8"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Tailspin Toys wants to deploy the Microsoft Security Copilot Phishing Triage Agent in Microsoft Defender. The current configuration is:

    - Security Copilot with provisioned Security Compute Units (SCUs)
    - Microsoft Defender for Office 365 Plan 1
    - Unified role-based access control (RBAC) enabled for Defender for Office 365
    - The **Email reported by user as malware or phish** alert policy turned on
    - Users report suspicious messages, but **Monitor reported messages in Outlook** is turned off

    You need to meet the prerequisites of the agent.

    Which two actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin Toys souhaite déployer l'agent de triage du hameçonnage de Microsoft Security Copilot (Phishing Triage Agent) dans Microsoft Defender. La configuration actuelle est la suivante :

    - Security Copilot avec des unités de calcul de sécurité (SCU) provisionnées
    - Microsoft Defender pour Office 365 Plan 1
    - Contrôle d'accès en fonction du rôle (RBAC) unifié activé pour Defender pour Office 365
    - La stratégie d'alerte **Email reported by user as malware or phish** activée
    - Les utilisateurs signalent des messages suspects, mais **Monitor reported messages in Outlook** est désactivé

    Vous devez respecter les prérequis de l'agent.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Turn on the Auto-Resolve - Email reported by user as malware or phish tuning rule.", fr: "Activer la règle de réglage Auto-Resolve - Email reported by user as malware or phish." } }
    - { id: b, text: { en: "Turn on Monitor reported messages in Outlook.", fr: "Activer Monitor reported messages in Outlook." } }
    - { id: c, text: { en: "Onboard a Microsoft Sentinel workspace to the Defender portal.", fr: "Intégrer un espace de travail Microsoft Sentinel au portail Defender." } }
    - { id: d, text: { en: "Deploy Microsoft Defender for Endpoint Plan 2 to all devices.", fr: "Déployer Microsoft Defender for Endpoint Plan 2 sur tous les appareils." } }
    - { id: e, text: { en: "Upgrade to Microsoft Defender for Office 365 Plan 2.", fr: "Passer à Microsoft Defender pour Office 365 Plan 2." } }
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: |
      The agent requires Security Copilot capacity, Defender for Office 365 Plan 2, unified RBAC for Defender for Office 365, Monitor reported messages in Outlook turned on, and the Email reported by user as malware or phish alert policy. Tailspin Toys is missing Plan 2 and the reported messages setting.
    fr: |
      L'agent exige une capacité Security Copilot, Defender pour Office 365 Plan 2, le RBAC unifié pour Defender pour Office 365, Monitor reported messages in Outlook activé et la stratégie d'alerte Email reported by user as malware or phish. Il manque à Tailspin Toys le Plan 2 et le paramètre des messages signalés.
  options:
    c: { en: "A Sentinel workspace isn't a prerequisite of the Phishing Triage Agent.", fr: "Un espace de travail Sentinel n'est pas un prérequis du Phishing Triage Agent." }
    d: { en: "The agent triages user-reported email alerts; Defender for Endpoint isn't required.", fr: "L'agent trie les alertes d'e-mails signalés par les utilisateurs ; Defender for Endpoint n'est pas nécessaire." }
    a: { en: "This tuning rule must be disabled: the agent doesn't triage alerts already resolved by alert tuning.", fr: "Cette règle de réglage doit être désactivée : l'agent ne trie pas les alertes déjà résolues par le réglage des alertes." }
references:
  - title: Microsoft Security Copilot Phishing Triage Agent in Microsoft Defender
    url: https://learn.microsoft.com/en-us/defender-xdr/phishing-triage-agent
