id: sc200-2a-dlp-view-only-role
objective: "2.1.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Northwind Traders uses Microsoft Purview Data Loss Prevention (DLP) and Microsoft Defender XDR. The data protection auditors must review the DLP alerts in the Microsoft Defender portal.

    The auditors must not see the other security alerts, and they must not be able to change DLP policies or alerts. The solution must follow the principle of least privilege.

    Which permission should you grant to the auditors?
  fr: |
    Northwind Traders utilise la protection contre la perte de données (DLP) de Microsoft Purview et Microsoft Defender XDR. Les auditeurs de la protection des données doivent examiner les alertes DLP dans le portail Microsoft Defender.

    Les auditeurs ne doivent pas voir les autres alertes de sécurité et ne doivent pas pouvoir modifier les stratégies DLP ni les alertes. La solution doit respecter le principe du moindre privilège.

    Quelle autorisation devez-vous accorder aux auditeurs ?
body:
  options:
    - { id: a, text: View-Only DLP Compliance Management }
    - { id: b, text: View-Only Manage Alerts }
    - { id: c, text: DLP Compliance Management }
    - { id: d, text: Data Classification Content Viewer }
answer: { optionId: a }
explanation:
  correct:
    en: |
      In the Defender portal, View-Only DLP Compliance Management gives access to DLP alerts only, without the right to manage DLP. Manage Alerts and View-Only Manage Alerts expose both DLP and security alerts, while DLP Compliance Management also limits the view to DLP alerts but includes the right to manage DLP.
    fr: |
      Dans le portail Defender, View-Only DLP Compliance Management donne accès aux seules alertes DLP, sans droit de gestion de la DLP. Manage Alerts et View-Only Manage Alerts exposent à la fois les alertes DLP et les alertes de sécurité, tandis que DLP Compliance Management limite aussi la vue aux alertes DLP mais inclut le droit de gérer la DLP.
  options:
    b: { en: "View-Only Manage Alerts shows the security alerts in addition to the DLP alerts.", fr: "View-Only Manage Alerts affiche les alertes de sécurité en plus des alertes DLP." }
    c: { en: "DLP Compliance Management limits the view to DLP alerts but lets users manage DLP, which is more than required.", fr: "DLP Compliance Management limite la vue aux alertes DLP mais permet de gérer la DLP, soit plus que nécessaire." }
    d: { en: "Data Classification Content Viewer is needed to download the matched files; it doesn't grant access to the alerts.", fr: "Data Classification Content Viewer est nécessaire pour télécharger les fichiers détectés ; il ne donne pas accès aux alertes." }
references:
  - title: Investigate data loss alerts with Microsoft Defender XDR
    url: https://learn.microsoft.com/en-us/defender-xdr/dlp-investigate-alerts-defender
