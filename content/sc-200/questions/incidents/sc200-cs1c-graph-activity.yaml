id: sc200-cs1c-graph-activity
objective: "2.3.3"
type: single
caseStudy: sc200-cs1c-tailwind-traders
difficulty: 1
status: draft
stem:
  en: |
    You need to meet the SyncBot requirement.

    Which table in LAW-TT should you query?
  fr: |
    Vous devez respecter l'exigence relative à SyncBot.

    Quelle table de LAW-TT devez-vous interroger ?
body:
  options:
    - { id: a, text: AADServicePrincipalSignInLogs }
    - { id: b, text: AuditLogs }
    - { id: c, text: MicrosoftGraphActivityLogs }
    - { id: d, text: AADNonInteractiveUserSignInLogs }
answer: { optionId: c }
explanation:
  correct:
    en: "Microsoft Graph activity logs are an audit trail of all the HTTP requests that Microsoft Graph receives for the tenant. In Log Analytics, the MicrosoftGraphActivityLogs table contains the ServicePrincipalId, RequestUri and RequestMethod of each request, so you can filter on the SyncBot service principal and list its requests."
    fr: "Les journaux d'activité Microsoft Graph constituent une piste d'audit de toutes les requêtes HTTP que Microsoft Graph reçoit pour le locataire. Dans Log Analytics, la table MicrosoftGraphActivityLogs contient le ServicePrincipalId, le RequestUri et le RequestMethod de chaque requête : vous pouvez filtrer sur le principal de service de SyncBot et lister ses requêtes."
  options:
    a: { en: "AADServicePrincipalSignInLogs shows when SyncBot obtained tokens, not the Microsoft Graph requests it sent with them.", fr: "AADServicePrincipalSignInLogs montre quand SyncBot a obtenu des jetons, pas les requêtes Microsoft Graph envoyées avec ces jetons." }
    b: { en: "AuditLogs records changes made in Microsoft Entra ID, such as consent or role changes, not the read requests sent to Microsoft Graph.", fr: "AuditLogs enregistre les modifications apportées dans Microsoft Entra ID, comme les consentements ou les changements de rôles, pas les requêtes de lecture envoyées à Microsoft Graph." }
    d: { en: "AADNonInteractiveUserSignInLogs contains sign-ins performed by clients on behalf of users; SyncBot uses an application permission and signs in as a service principal.", fr: "AADNonInteractiveUserSignInLogs contient les connexions effectuées par des clients pour le compte d'utilisateurs ; SyncBot utilise une autorisation d'application et se connecte en tant que principal de service." }
references:
  - title: Access Microsoft Graph activity logs for tenant monitoring
    url: https://learn.microsoft.com/en-us/graph/microsoft-graph-activity-logs-overview
