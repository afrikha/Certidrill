id: sc200-2c-disruption-identify
objective: "2.2.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso uses Microsoft Defender XDR. Overnight, automatic attack disruption contained several devices and disabled user accounts during a ransomware attack.

    In the morning, you need to find, in the incident queue of the Microsoft Defender portal, the incidents in which automatic attack disruption took action.

    What should you look for?
  fr: |
    Contoso utilise Microsoft Defender XDR. Pendant la nuit, l'interruption automatique d'attaque a confiné plusieurs appareils et désactivé des comptes d'utilisateurs au cours d'une attaque par rançongiciel.

    Le matin, vous devez trouver, dans la file d'attente des incidents du portail Microsoft Defender, les incidents dans lesquels l'interruption automatique d'attaque a agi.

    Que devez-vous rechercher ?
body:
  options:
    - id: a
      text: { en: "Incidents whose service source is Microsoft Defender for Endpoint", fr: "Les incidents dont la source de service est Microsoft Defender pour point de terminaison" }
    - id: b
      text: { en: "Incidents whose severity is High", fr: "Les incidents dont la gravité est High" }
    - id: c
      text: { en: "Incidents that have a linked automated investigation", fr: "Les incidents qui ont une investigation automatisée liée" }
    - id: d
      text: { en: "Incidents that have the Attack Disruption tag", fr: "Les incidents qui portent la balise Attack Disruption" }
answer: { optionId: d }
explanation:
  correct:
    en: Disrupted incidents carry the Attack Disruption tag in the incident queue, plus a tag for the threat type such as ransomware. On the incident page, a highlighted banner and an attack disruption summary card confirm the automatic actions.
    fr: Les incidents interrompus portent la balise Attack Disruption dans la file d'attente des incidents, ainsi qu'une balise du type de menace, par exemple ransomware. Sur la page de l'incident, une bannière mise en évidence et une carte de synthèse de l'interruption d'attaque confirment les actions automatiques.
  options:
    a:
      en: Many incidents come from Defender for Endpoint without any disruption, and disruption also uses other products.
      fr: De nombreux incidents proviennent de Defender pour point de terminaison sans aucune interruption, et l'interruption utilise aussi d'autres produits.
    b:
      en: Severity doesn't indicate whether an automatic disruption action was taken.
      fr: La gravité n'indique pas si une action d'interruption automatique a été effectuée.
    c:
      en: Automated investigations run for many alerts; they aren't the marker of attack disruption.
      fr: Les investigations automatisées s'exécutent pour de nombreuses alertes ; elles ne signalent pas une interruption d'attaque.
references:
  - title: Details and results of an automatic attack disruption action
    url: https://learn.microsoft.com/en-us/defender-xdr/autoad-results
