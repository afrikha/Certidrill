id: sc200-2c-timeline-features
objective: "2.2.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    You train junior analysts to investigate device timelines in the Microsoft Defender portal. The devices are onboarded to Microsoft Defender for Endpoint Plan 2.

    Which two statements about the device timeline are true?

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous formez des analystes débutants à l'analyse des chronologies d'appareils dans le portail Microsoft Defender. Les appareils sont intégrés à Microsoft Defender pour point de terminaison Plan 2.

    Quelles sont les deux affirmations vraies sur la chronologie de l'appareil ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Selecting a user name in the timeline opens the investigation page of that user.", fr: "Sélectionner un nom d'utilisateur dans la chronologie ouvre la page d'investigation de cet utilisateur." } }
    - { id: b, text: { en: "A single export can contain the events of the past 30 days.", fr: "Une seule exportation peut contenir les événements des 30 derniers jours." } }
    - { id: c, text: { en: "MITRE ATT&CK techniques are a data type that you can filter on, search and export.", fr: "Les techniques MITRE ATT&CK sont un type de données sur lequel vous pouvez filtrer, rechercher et exporter." } }
    - { id: d, text: { en: "The timeline can display the events of all the devices of a device group in one view.", fr: "La chronologie peut afficher les événements de tous les appareils d'un groupe d'appareils dans une seule vue." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: User names in the timeline link to the user investigation page. Techniques appear as an additional data type that you select in the Filters pane, and Search and Export work for techniques as for events.
    fr: Les noms d'utilisateur de la chronologie mènent à la page d'investigation de l'utilisateur. Les techniques apparaissent comme un type de données supplémentaire que vous sélectionnez dans le volet Filters, et Search et Export fonctionnent pour les techniques comme pour les événements.
  options:
    b:
      en: An export covers the current date or a range of up to seven days.
      fr: Une exportation couvre la date du jour ou une plage de sept jours au maximum.
    d:
      en: The timeline belongs to the device page and shows one device; use advanced hunting to query several devices.
      fr: La chronologie appartient à la page de l'appareil et montre un seul appareil ; utilisez le repérage avancé pour interroger plusieurs appareils.
references:
  - title: Investigate devices in Microsoft Defender for Endpoint
    url: https://learn.microsoft.com/en-us/defender-endpoint/device-timeline-event-flag
