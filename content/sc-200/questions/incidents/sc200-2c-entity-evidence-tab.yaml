id: sc200-2c-entity-evidence-tab
objective: "2.2.3"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    An automated investigation linked to incident 3310 in the Microsoft Defender portal analyzed several files, processes and IP addresses. The deletion of one file is waiting for approval.

    You need to review the analyzed entities and approve the pending action from the incident page.

    How should you complete the sentence? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Une investigation automatisée liée à l'incident 3310 dans le portail Microsoft Defender a analysé plusieurs fichiers, processus et adresses IP. La suppression d'un fichier attend une approbation.

    Vous devez examiner les entités analysées et approuver l'action en attente depuis la page de l'incident.

    Comment devez-vous compléter la phrase ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Open the [[t1]] tab of incident 3310. Each analyzed entity has a verdict, such as Malicious, Suspicious or [[t2]], and a [[t3]]; approve the entity whose value is Pending approval.
    fr: |
      Ouvrez l'onglet [[t1]] de l'incident 3310. Chaque entité analysée a un verdict, comme Malicious, Suspicious ou [[t2]], et un [[t3]] ; approuvez l'entité dont la valeur est Pending approval.
  slots:
    - id: t1
      options:
        - { id: evidence, text: Evidence and Response }
        - { id: assets, text: Assets }
        - { id: summary, text: Summary }
        - { id: similar, text: Similar incidents }
    - id: t2
      options:
        - { id: clean, text: Clean }
        - { id: benign, text: Benign }
        - { id: info, text: Informational }
        - { id: notset, text: Not set }
    - id: t3
      options:
        - id: remediation
          text: { en: "remediation status", fr: "état de correction" }
        - id: classification
          text: { en: "classification", fr: "classification" }
        - id: severity
          text: { en: "severity", fr: "gravité" }
        - id: determination
          text: { en: "determination", fr: "détermination" }
answer:
  values: { t1: evidence, t2: clean, t3: remediation }
explanation:
  correct:
    en: The Evidence and Response tab shows the events and suspicious entities found in the incident's alerts. Each entity analyzed by automated investigation has a verdict (Malicious, Suspicious or Clean) and a remediation status; for Pending approval, you can approve or reject the action from this tab.
    fr: L'onglet Evidence and Response affiche les événements et les entités suspectes trouvés dans les alertes de l'incident. Chaque entité analysée par l'investigation automatisée a un verdict (Malicious, Suspicious ou Clean) et un état de correction ; pour Pending approval, vous pouvez approuver ou rejeter l'action depuis cet onglet.
  options:
    assets: { en: "The Assets tab lists devices, users, mailboxes, apps and cloud resources, not verdicts and pending remediations.", fr: "L'onglet Assets liste les appareils, utilisateurs, boîtes aux lettres, applications et ressources cloud, pas les verdicts ni les corrections en attente." }
    summary: { en: "The Summary tab gives counts and categories, without per-entity approval.", fr: "L'onglet Summary donne des nombres et des catégories, sans approbation par entité." }
    classification: { en: "Classification is a property of alerts and incidents, not the remediation state of an entity.", fr: "La classification est une propriété des alertes et des incidents, pas l'état de correction d'une entité." }
references:
  - title: Investigate incidents in the Microsoft Defender portal (Legacy)
    url: https://learn.microsoft.com/en-us/defender-xdr/investigate-incidents
