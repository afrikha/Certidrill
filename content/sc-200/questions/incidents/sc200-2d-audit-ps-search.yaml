id: sc200-2d-audit-ps-search
objective: "2.3.1"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    Wingtip Toys uses Microsoft 365. You are connected to Exchange Online PowerShell.

    You need to list the inbox rules that were created or modified in the mailbox of ben@wingtiptoys.com between November 1 and November 8, 2026.

    How should you complete the command? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Wingtip Toys utilise Microsoft 365. Vous êtes connecté à Exchange Online PowerShell.

    Vous devez lister les règles de boîte de réception créées ou modifiées dans la boîte aux lettres de ben@wingtiptoys.com entre le 1er et le 8 novembre 2026.

    Comment devez-vous compléter la commande ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: powershell
  template: |
    [[cmd]] -StartDate 2026-11-01 -EndDate 2026-11-08 `
      -[[user]] ben@wingtiptoys.com `
      -[[ops]] New-InboxRule,Set-InboxRule,UpdateInboxRules `
      -ResultSize 1000
  slots:
    - id: cmd
      options:
        - { id: sual, text: Search-UnifiedAuditLog }
        - { id: ncs, text: New-ComplianceSearch }
        - { id: gaalc, text: Get-AdminAuditLogConfig }
        - { id: gualrp, text: Get-UnifiedAuditLogRetentionPolicy }
    - id: user
      options:
        - { id: userids, text: UserIds }
        - { id: objectids, text: ObjectIds }
        - { id: freetext, text: FreeText }
    - id: ops
      options:
        - { id: operations, text: Operations }
        - { id: recordtype, text: RecordType }
        - { id: freetext2, text: FreeText }
answer:
  values: { cmd: sual, user: userids, ops: operations }
explanation:
  correct:
    en: |
      Search-UnifiedAuditLog is the Exchange Online cmdlet that the Purview portal uses to search the audit log. UserIds limits the search to the accounts that performed the activities, and Operations takes a comma-separated list of exact operation names such as New-InboxRule, Set-InboxRule and UpdateInboxRules.
    fr: |
      Search-UnifiedAuditLog est l'applet de commande Exchange Online que le portail Purview utilise pour rechercher dans le journal d'audit. UserIds limite la recherche aux comptes qui ont effectué les activités, et Operations accepte une liste de noms d'opérations exacts séparés par des virgules, comme New-InboxRule, Set-InboxRule et UpdateInboxRules.
  options:
    ncs: { en: "New-ComplianceSearch creates an eDiscovery content search that finds items, not audit records.", fr: "New-ComplianceSearch crée une recherche de contenu eDiscovery qui trouve des éléments, pas des enregistrements d'audit." }
    gaalc: { en: "Get-AdminAuditLogConfig shows the audit configuration; it does not search records.", fr: "Get-AdminAuditLogConfig affiche la configuration d'audit ; il ne recherche pas d'enregistrements." }
    recordtype: { en: "RecordType filters on a record type such as ExchangeAdmin, not on operation names.", fr: "RecordType filtre sur un type d'enregistrement comme ExchangeAdmin, pas sur des noms d'opérations." }
    objectids: { en: "ObjectIds filters on the objects acted upon, such as a file URL, not on the account that acted.", fr: "ObjectIds filtre sur les objets concernés, comme l'URL d'un fichier, pas sur le compte qui a agi." }
references:
  - title: Search the audit log
    url: https://learn.microsoft.com/en-us/purview/audit-search
  - title: Use MailItemsAccessed to investigate compromised accounts
    url: https://learn.microsoft.com/en-us/purview/audit-log-investigate-accounts
