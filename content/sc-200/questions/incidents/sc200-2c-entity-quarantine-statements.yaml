id: sc200-2c-entity-quarantine-statements
objective: "2.2.3"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    You select **Stop and quarantine file** for an unsigned file named **tool.exe** that Microsoft Defender for Endpoint observed on 600 Windows 11 devices. A laptop named **LT-TRAVEL-3** stays offline for five days after you start the action.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous sélectionnez **Stop and quarantine file** pour un fichier non signé nommé **tool.exe** que Microsoft Defender pour point de terminaison a observé sur 600 appareils Windows 11. Un portable nommé **LT-TRAVEL-3** reste hors connexion pendant cinq jours après le lancement de l'action.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: The action targets the devices on which tool.exe was observed during the last 30 days.
        fr: L'action cible les appareils sur lesquels tool.exe a été observé au cours des 30 derniers jours.
    - id: s2
      text:
        en: LT-TRAVEL-3 receives the action when it reconnects after five days.
        fr: LT-TRAVEL-3 reçoit l'action quand il se reconnecte au bout de cinq jours.
    - id: s3
      text:
        en: To restore tool.exe on a device, you can run MpCmdRun.exe -Restore -Name EUS:Win32/CustomEnterpriseBlock -All in an elevated command prompt on that device.
        fr: Pour restaurer tool.exe sur un appareil, vous pouvez exécuter MpCmdRun.exe -Restore -Name EUS:Win32/CustomEnterpriseBlock -All dans une invite de commandes avec élévation de privilèges sur cet appareil.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: The action applies to devices where the file was observed in the last 30 days, up to 1,000 devices. It has a maximum timeout of three days, so a device that stays offline longer doesn't receive it; a block indicator keeps the file blocked afterward. Files quarantined by the action are restored with MpCmdRun.exe -Restore -Name EUS:Win32/CustomEnterpriseBlock -All, run from the antimalware platform folder.
    fr: "L'action s'applique aux appareils où le fichier a été observé au cours des 30 derniers jours, jusqu'à 1 000 appareils. Elle a un délai maximal de trois jours : un appareil qui reste hors connexion plus longtemps ne la reçoit pas ; un indicateur de blocage maintient ensuite le blocage du fichier. Les fichiers mis en quarantaine par l'action se restaurent avec MpCmdRun.exe -Restore -Name EUS:Win32/CustomEnterpriseBlock -All, exécuté depuis le dossier de la plateforme anti-programme malveillant."
references:
  - title: Take response actions on a file in Microsoft Defender for Endpoint
    url: https://learn.microsoft.com/en-us/defender-endpoint/respond-file-alerts
