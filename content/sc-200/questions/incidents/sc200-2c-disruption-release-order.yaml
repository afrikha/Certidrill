id: sc200-2c-disruption-release-order
objective: "2.2.4"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    Automatic attack disruption contained a device named **SRV-FILE-01** during a human-operated attack at Litware. The incident has the Attack Disruption tag.

    You need to bring SRV-FILE-01 back into service. The solution must prevent the attacker from resuming the attack.

    Which three actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    L'interruption automatique d'attaque a confiné un appareil nommé **SRV-FILE-01** au cours d'une attaque à opérateur humain chez Litware. L'incident porte la balise Attack Disruption.

    Vous devez remettre SRV-FILE-01 en service. La solution doit empêcher l'attaquant de reprendre l'attaque.

    Quelles sont les trois actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - { id: card, text: { en: "Open the incident and review the attack disruption summary card.", fr: "Ouvrir l'incident et examiner la carte de synthèse de l'interruption d'attaque." } }
    - { id: remediate, text: { en: "Reset the compromised credentials and remove the attacker's persistence from SRV-FILE-01.", fr: "Réinitialiser les informations d'identification compromises et supprimer la persistance de l'attaquant sur SRV-FILE-01." } }
    - { id: release, text: { en: "Select SRV-FILE-01 in the incident graph and select Release from containment.", fr: "Sélectionner SRV-FILE-01 dans le graphe de l'incident et sélectionner Release from containment." } }
    - { id: optout, text: { en: "Open a support case to opt out of automatic attack disruption.", fr: "Ouvrir une demande de support pour désactiver l'interruption automatique d'attaque." } }
    - { id: noauto, text: { en: "Set the device group of SRV-FILE-01 to No automated response.", fr: "Définir le groupe d'appareils de SRV-FILE-01 sur No automated response." } }
    - { id: isolate, text: { en: "Release from isolation from the device page of SRV-FILE-01.", fr: "Sélectionner Release from isolation depuis la page de l'appareil SRV-FILE-01." } }
    - { id: exclude, text: { en: "Add SRV-FILE-01 to the device exclusions of automatic attack disruption.", fr: "Ajouter SRV-FILE-01 aux exclusions d'appareils de l'interruption automatique d'attaque." } }
answer:
  sequence: [ card, remediate, release ]
explanation:
  correct:
    en: You first review what disruption did from the attack disruption summary card of the incident, then investigate and remediate the root cause. Releasing the contained asset comes last, from the incident graph or the Action center, because releasing it early could let the attacker resume.
    fr: Vous examinez d'abord ce que l'interruption a fait depuis la carte de synthèse de l'interruption d'attaque de l'incident, puis vous analysez et corrigez la cause. La libération de la ressource confinée vient en dernier, depuis le graphe de l'incident ou l'Action center, car la libérer trop tôt pourrait permettre à l'attaquant de reprendre.
  options:
    optout: { en: "Opting out removes all automatic actions for the tenant and greatly increases risk; it doesn't release the device.", fr: "La désactivation supprime toutes les actions automatiques du locataire et augmente fortement le risque ; elle ne libère pas l'appareil." }
    noauto: { en: "Changing the automation level excludes the group from future automated responses; it doesn't lift the current containment.", fr: "Changer le niveau d'automatisation exclut le groupe des réponses automatiques futures ; cela ne lève pas le confinement actuel." }
    isolate: { en: "The device was contained, not isolated; the release action is Release from containment.", fr: "L'appareil a été confiné, pas isolé ; l'action de libération est Release from containment." }
    exclude: { en: "An exclusion only prevents future automatic actions on the device; it doesn't lift the current containment.", fr: "Une exclusion empêche seulement les futures actions automatiques sur l'appareil ; elle ne lève pas le confinement actuel." }
references:
  - title: Details and results of an automatic attack disruption action
    url: https://learn.microsoft.com/en-us/defender-xdr/autoad-results
