id: sc200-2d-cs-roles-tasks
objective: "2.3.2"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Contoso, Ltd. uses Microsoft Purview eDiscovery for security investigations. Premium eDiscovery features are enabled. You create custom role groups in the Microsoft Purview portal for four SOC members.

    Each member must receive only the eDiscovery role needed for the task listed below.

    Which role should you assign for each task? To answer, drag the appropriate roles to the correct tasks. Each role may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso, Ltd. utilise Microsoft Purview eDiscovery pour les enquêtes de sécurité. Les fonctionnalités premium d'eDiscovery sont activées. Vous créez des groupes de rôles personnalisés dans le portail Microsoft Purview pour quatre membres du SOC.

    Chaque membre ne doit recevoir que le rôle eDiscovery nécessaire à la tâche indiquée ci-dessous.

    Quel rôle devez-vous attribuer pour chaque tâche ? Pour répondre, faites glisser les rôles appropriés vers les tâches correspondantes. Chaque rôle peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: search, text: Compliance Search }
    - { id: export, text: Export }
    - { id: preview, text: Preview }
    - { id: purge, text: Search And Purge }
    - { id: review, text: Review }
    - { id: hold, text: Hold }
  targets:
    - id: t1
      text: { en: "Run searches across mailboxes and sites and get estimates of the results", fr: "Exécuter des recherches dans les boîtes aux lettres et les sites et obtenir des estimations des résultats" }
    - id: t2
      text: { en: "Download the results of a search", fr: "Télécharger les résultats d'une recherche" }
    - id: t3
      text: { en: "View the content of the items returned by a search", fr: "Afficher le contenu des éléments renvoyés par une recherche" }
    - id: t4
      text: { en: "Delete phishing messages found by a search", fr: "Supprimer les messages d'hameçonnage trouvés par une recherche" }
answer:
  mapping: { t1: search, t2: export, t3: preview, t4: purge }
explanation:
  correct:
    en: |
      Compliance Search lets a user search locations and get result estimates. Export is needed to download search results, and Preview to view the items; when premium features are enabled, no grace period lets other users preview or download without these roles. Search And Purge is required to delete messages found by a search.
    fr: |
      Compliance Search permet de rechercher dans des emplacements et d'obtenir des estimations des résultats. Export est nécessaire pour télécharger les résultats d'une recherche, et Preview pour afficher les éléments ; quand les fonctionnalités premium sont activées, aucune période de grâce ne permet à d'autres utilisateurs de prévisualiser ou de télécharger sans ces rôles. Search And Purge est requis pour supprimer les messages trouvés par une recherche.
  options:
    review: { en: "Review gives access to review sets, not to the search results themselves.", fr: "Review donne accès aux jeux à réviser, pas aux résultats de recherche eux-mêmes." }
    hold: { en: "Hold lets a user create holds that preserve content; it neither finds nor deletes items.", fr: "Hold permet de créer des conservations qui préservent le contenu ; il ne trouve ni ne supprime d'éléments." }
references:
  - title: Assign permissions in eDiscovery
    url: https://learn.microsoft.com/en-us/purview/edisc-permissions
