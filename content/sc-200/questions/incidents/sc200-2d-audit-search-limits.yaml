id: sc200-2d-audit-search-limits
objective: "2.3.1"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Litware, Inc. has Microsoft 365 E5 licenses for all users and uses Audit (Premium). An analyst uses the **Audit** solution in the Microsoft Purview portal to investigate a data theft that started several months ago.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware, Inc. dispose de licences Microsoft 365 E5 pour tous les utilisateurs et utilise Audit (Premium). Un analyste utilise la solution **Audit** du portail Microsoft Purview pour examiner un vol de données qui a commencé il y a plusieurs mois.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          The analyst can run one search job whose date and time range covers the last 270 days.
        fr: |
          L'analyste peut exécuter un seul travail de recherche dont la plage de dates et d'heures couvre les 270 derniers jours.
    - id: s2
      text:
        en: |
          The analyst can export up to 1,000,000 rows of a search job to a CSV file.
        fr: |
          L'analyste peut exporter jusqu'à 1 000 000 de lignes d'un travail de recherche dans un fichier CSV.
    - id: s3
      text:
        en: |
          A completed search job and its results stay available to the analyst for 30 days.
        fr: |
          Un travail de recherche terminé et ses résultats restent disponibles pour l'analyste pendant 30 jours.
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: |
      The date and time range of one audit search is limited to 180 days; a longer range returns an error, so the analyst must split the period into several searches. With Audit (Premium), an export can contain up to 1,000,000 rows (50,000 with Audit (Standard)). Completed search jobs are kept for 30 days.
    fr: "La plage de dates et d'heures d'une recherche d'audit est limitée à 180 jours ; une plage plus longue renvoie une erreur : l'analyste doit donc découper la période en plusieurs recherches. Avec Audit (Premium), une exportation peut contenir jusqu'à 1 000 000 de lignes (50 000 avec Audit (Standard)). Les travaux de recherche terminés sont conservés 30 jours."
  options:
    s1: { en: "The maximum range of a search is 180 days, even when the records are retained for one year.", fr: "La plage maximale d'une recherche est de 180 jours, même quand les enregistrements sont conservés un an." }
references:
  - title: Search the audit log
    url: https://learn.microsoft.com/en-us/purview/audit-search
