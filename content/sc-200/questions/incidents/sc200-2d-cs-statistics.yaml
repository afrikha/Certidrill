id: sc200-2d-cs-statistics
objective: "2.3.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Adatum Corporation uses Microsoft Purview eDiscovery. You create a search in the Content Search case to find the messages of a suspected data leak in 2,000 mailboxes.

    Before you export anything, you need to see the estimated number of hits, the locations that have hits, and the top senders and recipients of the matching messages.

    What should you use?
  fr: |
    Adatum Corporation utilise Microsoft Purview eDiscovery. Vous créez une recherche dans le cas Content Search pour trouver les messages d'une fuite de données présumée dans 2 000 boîtes aux lettres.

    Avant toute exportation, vous devez voir le nombre estimé de résultats, les emplacements qui contiennent des résultats, ainsi que les principaux expéditeurs et destinataires des messages correspondants.

    Que devez-vous utiliser ?
body:
  options:
    - { id: a, text: { en: "The Sample view of the search", fr: "La vue Sample de la recherche" } }
    - { id: b, text: { en: "A report-only export of the search", fr: "Une exportation en mode rapport uniquement de la recherche" } }
    - { id: c, text: { en: "A review set that contains the results", fr: "Un jeu à réviser contenant les résultats" } }
    - { id: d, text: { en: "The Statistics view of the search", fr: "La vue Statistics de la recherche" } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      The Statistics view shows the search hits and their volume, the locations with hits out of those searched, and search hit trends such as the top data sources and the top communication participants (senders and recipients). It gives estimates without exporting the data.
    fr: |
      La vue Statistics affiche les résultats de recherche et leur volume, les emplacements contenant des résultats parmi ceux recherchés, et des tendances comme les principales sources de données et les principaux participants aux communications (expéditeurs et destinataires). Elle fournit des estimations sans exporter les données.
  options:
    a: { en: "Sample shows a representative selection of items, not hit counts per location or top participants.", fr: "Sample affiche une sélection représentative d'éléments, pas le nombre de résultats par emplacement ni les principaux participants." }
    b: { en: "A report-only export is an export, which the requirement asks you to avoid at this stage.", fr: "Une exportation en mode rapport uniquement reste une exportation, ce que l'exigence demande d'éviter à ce stade." }
    c: { en: "A review set collects copies of the items, which goes beyond viewing estimates.", fr: "Un jeu à réviser collecte des copies des éléments, ce qui va au-delà de la consultation d'estimations." }
references:
  - title: Evaluate and refine search results in eDiscovery
    url: https://learn.microsoft.com/en-us/purview/edisc-search-results
  - title: Create a search for a case in eDiscovery
    url: https://learn.microsoft.com/en-us/purview/edisc-search-query
