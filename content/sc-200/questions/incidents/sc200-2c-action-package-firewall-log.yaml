id: sc200-2c-action-package-firewall-log
objective: "2.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You collect investigation packages from Windows Server 2022 servers onboarded to Microsoft Defender for Endpoint. In each package, the **Network connections** folder contains the ARP cache, the DNS cache and the IP configuration, but no pfirewall.log file.

    You need future investigation packages to include pfirewall.log.

    What should you configure on the servers?
  fr: |
    Vous collectez des packages d'investigation sur des serveurs Windows Server 2022 intégrés à Microsoft Defender pour point de terminaison. Dans chaque package, le dossier **Network connections** contient le cache ARP, le cache DNS et la configuration IP, mais aucun fichier pfirewall.log.

    Les prochains packages d'investigation doivent inclure pfirewall.log.

    Que devez-vous configurer sur les serveurs ?
body:
  options:
    - id: a
      text: { en: "The Audit Filtering Platform Connection audit policy", fr: "La stratégie d'audit Audit Filtering Platform Connection" }
    - id: b
      text: { en: "Windows Defender Firewall logging to %windir%\\system32\\logfiles\\firewall\\pfirewall.log", fr: "La journalisation du Pare-feu Windows Defender dans %windir%\\system32\\logfiles\\firewall\\pfirewall.log" }
    - id: c
      text: { en: "The Live response for servers advanced feature", fr: "La fonctionnalité avancée Live response for servers" }
    - id: d
      text: { en: "Network protection in audit mode", fr: "La protection du réseau en mode audit" }
answer: { optionId: b }
explanation:
  correct:
    en: The package copies the Windows Firewall log only if it exists at %windir%\system32\logfiles\firewall\pfirewall.log, so Windows Defender Firewall logging must be turned on with that log file. The other network files (ARP cache, DNS cache, IP configuration, active connections) are always collected.
    fr: "Le package ne copie le journal du Pare-feu Windows que s'il existe dans %windir%\\system32\\logfiles\\firewall\\pfirewall.log : la journalisation du Pare-feu Windows Defender doit donc être activée avec ce fichier journal. Les autres fichiers réseau (cache ARP, cache DNS, configuration IP, connexions actives) sont toujours collectés."
  options:
    a:
      en: This audit policy makes firewall events appear in the device timeline; it doesn't create pfirewall.log.
      fr: Cette stratégie d'audit fait apparaître les événements du pare-feu dans la chronologie de l'appareil ; elle ne crée pas pfirewall.log.
    c:
      en: Live response for servers allows live response sessions on servers; collecting an investigation package doesn't depend on it.
      fr: Live response for servers autorise les sessions de réponse dynamique sur les serveurs ; la collecte d'un package d'investigation n'en dépend pas.
    d:
      en: Network protection audits or blocks connections to dangerous domains; it doesn't produce the firewall log.
      fr: La protection du réseau audite ou bloque les connexions vers des domaines dangereux ; elle ne produit pas le journal du pare-feu.
references:
  - title: Take response actions on a device in Microsoft Defender for Endpoint
    url: https://learn.microsoft.com/en-us/defender-endpoint/respond-machine-alerts
