id: sc200-cs3b-false-positive-risk
objective: "2.1.5"
type: single
caseStudy: sc200-cs3b-humongous-insurance
difficulty: 1
status: draft
stem:
  en: |
    Microsoft Entra ID Protection reports a user named User7 as high risk. An analyst confirms that the risk detections come from a legitimate new home internet connection. You need to meet the risky users requirement. What should the analyst do for User7?
  fr: |
    Microsoft Entra ID Protection signale un utilisateur nommé User7 comme présentant un risque élevé. Un analyste confirme que les détections de risque proviennent d'une nouvelle connexion Internet domestique légitime. Vous devez respecter l'exigence relative aux utilisateurs à risque. Que doit faire l'analyste pour User7 ?
body:
  options:
    - { id: a, text: { en: "Confirm that the user is compromised.", fr: "Confirmer que l'utilisateur est compromis." } }
    - { id: b, text: { en: "Dismiss the user risk.", fr: "Ignorer le risque de l'utilisateur." } }
    - { id: c, text: { en: "Generate a temporary password for the user.", fr: "Générer un mot de passe temporaire pour l'utilisateur." } }
    - { id: d, text: { en: "Require the user to change the password.", fr: "Exiger que l'utilisateur change son mot de passe." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Dismissing the user risk moves the risk state from At risk to Dismissed and does not change the user's existing password. It is the action for detections that an investigation shows to be false positives.
    fr: |
      Ignorer le risque de l'utilisateur fait passer l'état de risque de « À risque » à « Ignoré » et ne modifie pas le mot de passe existant de l'utilisateur. C'est l'action adaptée aux détections qu'une investigation a montrées comme des faux positifs.
  options:
    a: { en: "Confirming the user as compromised records a real compromise, the opposite of the analyst's conclusion.", fr: "Confirmer l'utilisateur comme compromis enregistre une compromission réelle, à l'opposé de la conclusion de l'analyste." }
    c: { en: "A temporary password remediates the risk but replaces the user's password.", fr: "Un mot de passe temporaire corrige le risque, mais remplace le mot de passe de l'utilisateur." }
    d: { en: "A required password change remediates the risk only after the user changes the password.", fr: "Un changement de mot de passe exigé ne corrige le risque qu'après la modification du mot de passe par l'utilisateur." }
references:
  - title: Remediate risks and unblock users
    url: https://learn.microsoft.com/en-us/entra/id-protection/howto-identity-protection-remediate-unblock
