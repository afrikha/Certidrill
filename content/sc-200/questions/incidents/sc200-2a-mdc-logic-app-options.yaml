id: sc200-2a-mdc-logic-app-options
objective: "2.1.3"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Proseware, Inc. uses Microsoft Defender for Cloud. The SOC has two Consumption logic apps:

    - **LA-Ticket** must open a ticket in the IT service management tool automatically for every new high-severity security alert.
    - **LA-Snapshot** must be run by an analyst, on demand, for an alert that the analyst is investigating.

    How should you configure the solution? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware, Inc. utilise Microsoft Defender pour le cloud. Le SOC dispose de deux applications logiques Consumption :

    - **LA-Ticket** doit ouvrir automatiquement un ticket dans l'outil de gestion des services informatiques pour chaque nouvelle alerte de sécurité de gravité élevée.
    - **LA-Snapshot** doit être exécutée par un analyste, à la demande, pour une alerte qu'il examine.

    Comment devez-vous configurer la solution ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      For LA-Ticket, create [[s1]] in Defender for Cloud.

      Build LA-Ticket with the Logic Apps trigger [[s2]].

      For LA-Snapshot, the analyst opens the alert and selects [[s3]].
    fr: |
      Pour LA-Ticket, créer [[s1]] dans Defender pour le cloud.

      Créer LA-Ticket avec le déclencheur Logic Apps [[s2]].

      Pour LA-Snapshot, l'analyste ouvre l'alerte et sélectionne [[s3]].
  slots:
    - id: s1
      options:
        - { id: wfa, text: { en: "a workflow automation for security alerts", fr: "une automatisation de workflow pour les alertes de sécurité" } }
        - { id: supp, text: { en: "a suppression rule for security alerts", fr: "une règle de suppression pour les alertes de sécurité" } }
        - { id: export, text: { en: "a continuous export of security alerts", fr: "une exportation continue des alertes de sécurité" } }
    - id: s2
      options:
        - { id: alert, text: "When a Defender for Cloud Alert is created or triggered" }
        - { id: reco, text: "When a Microsoft Defender for Cloud recommendation is created or triggered" }
        - { id: legacy, text: "When a response to a Microsoft Defender for Cloud alert is triggered" }
    - id: s3
      options:
        - { id: trigger, text: Trigger logic app }
        - { id: mitigate, text: Mitigate the threat }
        - { id: inspect, text: Inspect resource context }
answer:
  values: { s1: wfa, s2: alert, s3: trigger }
explanation:
  correct:
    en: |
      Workflow automation runs a logic app when its trigger conditions are met, and the alert trigger can be limited to the severity levels that interest you. The logic app must use the trigger When a Defender for Cloud Alert is created or triggered. To run a logic app manually, open the alert and select Trigger logic app.
    fr: |
      L'automatisation de workflow exécute une application logique quand les conditions de son déclencheur sont réunies, et le déclencheur d'alerte peut être limité aux niveaux de gravité qui vous intéressent. L'application logique doit utiliser le déclencheur When a Defender for Cloud Alert is created or triggered. Pour exécuter une application logique manuellement, ouvrez l'alerte et sélectionnez Trigger logic app.
  options:
    supp: { en: "A suppression rule dismisses matching alerts; it doesn't run logic apps.", fr: "Une règle de suppression ignore les alertes correspondantes ; elle n'exécute pas d'application logique." }
    export: { en: "Continuous export sends alerts to another destination; it doesn't run a logic app.", fr: "L'exportation continue envoie les alertes vers une autre destination ; elle n'exécute pas d'application logique." }
    reco: { en: "This trigger fires for recommendations, not for security alerts.", fr: "Ce déclencheur se déclenche pour les recommandations, pas pour les alertes de sécurité." }
    legacy: { en: "This legacy trigger isn't supported by the Logic Apps designer, and workflow automation can't open logic apps that use it.", fr: "Ce déclencheur hérité n'est pas pris en charge par le concepteur Logic Apps, et l'automatisation de workflow ne peut pas ouvrir les applications logiques qui l'utilisent." }
    mitigate: { en: "Mitigate the threat lists manual remediation steps.", fr: "Mitigate the threat liste des étapes de correction manuelles." }
references:
  - title: Workflow Automation in Microsoft Defender for Cloud
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/workflow-automation
