id: sc200-2d-cs-purge-sites
objective: "2.3.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Litware, Inc. has Microsoft 365 E3 licenses and no Microsoft Defender for Office 365 subscription. An email that contains a malicious link was delivered to 300 users. Some users also saved the attachment to their OneDrive.

    In Security & Compliance PowerShell, an analyst who has the required roles creates and starts a search named Spill-07 by using `New-ComplianceSearch` with `-ExchangeLocation All -SharePointLocation All`. The search finds the messages. When the analyst runs `New-ComplianceSearchAction -SearchName "Spill-07" -Purge -PurgeType HardDelete`, the action fails.

    You need to delete the email messages.

    What should you do first?
  fr: |
    Litware, Inc. dispose de licences Microsoft 365 E3 et d'aucun abonnement Microsoft Defender pour Office 365. Un e-mail contenant un lien malveillant a été remis à 300 utilisateurs. Certains utilisateurs ont aussi enregistré la pièce jointe dans leur OneDrive.

    Dans Security & Compliance PowerShell, un analyste qui dispose des rôles requis crée et démarre une recherche nommée Spill-07 avec `New-ComplianceSearch` et `-ExchangeLocation All -SharePointLocation All`. La recherche trouve les messages. Quand l'analyste exécute `New-ComplianceSearchAction -SearchName "Spill-07" -Purge -PurgeType HardDelete`, l'action échoue.

    Vous devez supprimer les e-mails.

    Que devez-vous faire en premier ?
body:
  options:
    - { id: a, text: { en: "Change the purge type of the action to SoftDelete.", fr: "Remplacer le type de purge de l'action par SoftDelete." } }
    - { id: b, text: { en: "Add the search results to a review set before you purge them.", fr: "Ajouter les résultats de la recherche à un jeu à réviser avant de les purger." } }
    - { id: c, text: { en: "Place the 300 mailboxes on hold before you run the action.", fr: "Placer les 300 boîtes aux lettres en conservation avant d'exécuter l'action." } }
    - { id: d, text: { en: "Remove the SharePoint locations from the search, and then rerun it.", fr: "Retirer les emplacements SharePoint de la recherche, puis la relancer." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Search and purge supports Exchange Online mailboxes and public folders only. A search that includes SharePoint or OneDrive sites causes an error at the purge step, so you scope the search to the mailboxes, rerun it, and then run the purge action. The files in OneDrive must be handled separately.
    fr: |
      La recherche et purge ne prend en charge que les boîtes aux lettres Exchange Online et les dossiers publics. Une recherche qui inclut des sites SharePoint ou OneDrive provoque une erreur à l'étape de purge : vous limitez la recherche aux boîtes aux lettres, la relancez, puis exécutez l'action de purge. Les fichiers dans OneDrive doivent être traités séparément.
  options:
    a: { en: "Both purge types fail when the search includes sites; the purge type only changes where the messages go.", fr: "Les deux types de purge échouent quand la recherche inclut des sites ; le type de purge change seulement l'emplacement où vont les messages." }
    b: { en: "Items added to a review set cannot be deleted by search and purge; only deleting the case removes them.", fr: "Les éléments ajoutés à un jeu à réviser ne peuvent pas être supprimés par recherche et purge ; seule la suppression du cas les retire." }
    c: { en: "A hold keeps the messages: purged items in a mailbox on hold are retained until the hold ends.", fr: "Une conservation garde les messages : les éléments purgés d'une boîte aux lettres en conservation sont conservés jusqu'à la fin de la conservation." }
references:
  - title: Find and delete email messages in eDiscovery
    url: https://learn.microsoft.com/en-us/purview/edisc-search-mailbox-data
