id: sc200-2c-disruption-cloud-accounts
objective: "2.2.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Proseware has no on-premises Active Directory. All its user accounts are cloud-only accounts in Microsoft Entra ID, and the Microsoft Defender for Identity sensor isn't deployed anywhere. Proseware has Microsoft 365 E5 licenses.

    A security architect asks whether automatic attack disruption can disable a compromised Proseware account during an attack.

    Which statement is correct?
  fr: |
    Proseware n'a pas d'Active Directory local. Tous ses comptes d'utilisateurs sont des comptes cloud uniquement dans Microsoft Entra ID, et le capteur Microsoft Defender pour Identity n'est déployé nulle part. Proseware dispose de licences Microsoft 365 E5.

    Un architecte sécurité demande si l'interruption automatique d'attaque peut désactiver un compte Proseware compromis pendant une attaque.

    Quelle affirmation est correcte ?
body:
  options:
    - id: a
      text: { en: "No; the account can be disabled only after the Defender for Identity sensor is installed on a domain controller.", fr: "Non ; le compte ne peut être désactivé qu'après l'installation du capteur Defender pour Identity sur un contrôleur de domaine." }
    - id: b
      text: { en: "No; for cloud-only accounts, disruption can only contain the user on devices onboarded to Defender for Endpoint.", fr: "Non ; pour les comptes cloud uniquement, l'interruption peut seulement confiner l'utilisateur sur les appareils intégrés à Defender pour point de terminaison." }
    - id: c
      text: { en: "Yes, but only if a Microsoft Sentinel playbook that disables Entra ID accounts is attached to the incident.", fr: "Oui, mais seulement si un playbook Microsoft Sentinel qui désactive les comptes Entra ID est associé à l'incident." }
    - id: d
      text: { en: "Yes; Defender for Identity disables the account in Microsoft Entra ID through a Microsoft-managed enterprise application, without a sensor deployment.", fr: "Oui ; Defender pour Identity désactive le compte dans Microsoft Entra ID par une application d'entreprise gérée par Microsoft, sans déploiement de capteur." }
answer: { optionId: d }
explanation:
  correct:
    en: For cloud-native accounts, Defender for Identity disables the account in Microsoft Entra ID by using a Microsoft-managed enterprise application named Microsoft Defender for Identity, which checks the roles and permissions through RBAC. Disabling the account in Entra ID doesn't depend on deploying Defender for Identity.
    fr: Pour les comptes natifs cloud, Defender pour Identity désactive le compte dans Microsoft Entra ID à l'aide d'une application d'entreprise gérée par Microsoft nommée Microsoft Defender for Identity, qui vérifie les rôles et les autorisations par RBAC. La désactivation du compte dans Entra ID ne dépend pas du déploiement de Defender pour Identity.
  options:
    a:
      en: The sensor on domain controllers is needed only for Active Directory accounts; Proseware has none.
      fr: Le capteur sur les contrôleurs de domaine n'est nécessaire que pour les comptes Active Directory ; Proseware n'en a pas.
    b:
      en: Contain user is one possible action, but disruption can also disable cloud-only accounts in Microsoft Entra ID.
      fr: Contain user est une action possible, mais l'interruption peut aussi désactiver des comptes cloud uniquement dans Microsoft Entra ID.
    c:
      en: Attack disruption is built in and doesn't rely on custom playbooks.
      fr: L'interruption d'attaque est intégrée et ne dépend pas de playbooks personnalisés.
references:
  - title: Automatic attack disruption in Microsoft Defender
    url: https://learn.microsoft.com/en-us/defender-xdr/automatic-attack-disruption
