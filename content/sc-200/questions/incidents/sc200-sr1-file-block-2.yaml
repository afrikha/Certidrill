id: sc200-sr1-file-block-2
objective: "2.2.3"
type: series_yesno
series: sc200-sr1-file-block
seriesOrder: 2
difficulty: 2
status: draft
stem:
  en: You run Stop and quarantine file for all the devices on which the file was observed.
  fr: Vous exécutez Stop and quarantine file pour tous les appareils sur lesquels le fichier a été observé.
body:
  solution:
    en: |
      On the file page of PayView.exe, you select **Stop and quarantine file** for all the devices on which the file was observed, and you monitor the result in the **Action center**.
    fr: |
      Dans la page de fichier de PayView.exe, vous sélectionnez **Stop and quarantine file** pour tous les appareils sur lesquels le fichier a été observé, et vous suivez le résultat dans l'**Action center**.
answer: { value: false }
explanation:
  correct:
    en: |
      Stop and quarantine file meets the first requirement for the 14 devices, but it acts only on the devices where the file was observed in the last 30 days. It does not prevent a new copy of PayView.exe from running on another device later; that requires a block indicator for the file.
    fr: |
      Stop and quarantine file répond à la première exigence pour les 14 appareils, mais n'agit que sur les appareils où le fichier a été observé au cours des 30 derniers jours. Cette action n'empêche pas une nouvelle copie de PayView.exe de s'exécuter plus tard sur un autre appareil : il faut pour cela un indicateur de blocage pour le fichier.
references:
  - title: Take response actions on a file in Microsoft Defender for Endpoint
    url: https://learn.microsoft.com/en-us/defender-endpoint/respond-file-alerts
