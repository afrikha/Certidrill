id: sc200-2b-mdi-alert-remediation
objective: "2.1.6"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Contoso uses Microsoft Defender for Identity. Three classic alerts were raised this week and were classified as true positives. You need to apply the remediation that Defender for Identity suggests for each alert.

    Which remediation should you apply for each alert? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso utilise Microsoft Defender pour Identity. Trois alertes classiques ont été générées cette semaine et ont été classées comme des vrais positifs. Vous devez appliquer la correction que Defender pour Identity suggère pour chaque alerte.

    Quelle correction devez-vous appliquer pour chaque alerte ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Suspected NTLM relay attack (Exchange account): [[ntlm]]

      Suspected use of Metasploit hacking framework: [[msf]]

      Remote code execution attempt: [[rce]]
    fr: |
      Suspected NTLM relay attack (Exchange account) : [[ntlm]]

      Suspected use of Metasploit hacking framework : [[msf]]

      Remote code execution attempt : [[rce]]
  slots:
    - id: ntlm
      options:
        - { id: sealed, text: { en: "Enforce sealed NTLMv2 with the LAN Manager authentication level policy", fr: "Imposer NTLMv2 scellé avec la stratégie de niveau d'authentification LAN Manager" } }
        - { id: smb1, text: { en: "Disable SMBv1", fr: "Désactiver SMBv1" } }
        - { id: tier0, text: { en: "Restrict remote access to domain controllers from non-Tier 0 machines", fr: "Restreindre l'accès à distance aux contrôleurs de domaine depuis les machines hors niveau 0 (Tier 0)" } }
        - { id: repl, text: { en: "Validate the Replicating Directory Changes permissions", fr: "Vérifier les autorisations Replicating Directory Changes" } }
    - id: msf
      options:
        - { id: sealed, text: { en: "Enforce sealed NTLMv2 with the LAN Manager authentication level policy", fr: "Imposer NTLMv2 scellé avec la stratégie de niveau d'authentification LAN Manager" } }
        - { id: smb1, text: { en: "Disable SMBv1", fr: "Désactiver SMBv1" } }
        - { id: tier0, text: { en: "Restrict remote access to domain controllers from non-Tier 0 machines", fr: "Restreindre l'accès à distance aux contrôleurs de domaine depuis les machines hors niveau 0 (Tier 0)" } }
        - { id: repl, text: { en: "Validate the Replicating Directory Changes permissions", fr: "Vérifier les autorisations Replicating Directory Changes" } }
    - id: rce
      options:
        - { id: sealed, text: { en: "Enforce sealed NTLMv2 with the LAN Manager authentication level policy", fr: "Imposer NTLMv2 scellé avec la stratégie de niveau d'authentification LAN Manager" } }
        - { id: smb1, text: { en: "Disable SMBv1", fr: "Désactiver SMBv1" } }
        - { id: tier0, text: { en: "Restrict remote access to domain controllers from non-Tier 0 machines", fr: "Restreindre l'accès à distance aux contrôleurs de domaine depuis les machines hors niveau 0 (Tier 0)" } }
        - { id: repl, text: { en: "Validate the Replicating Directory Changes permissions", fr: "Vérifier les autorisations Replicating Directory Changes" } }
answer:
  values: { ntlm: sealed, msf: smb1, rce: tier0 }
explanation:
  correct:
    en: |
      For the NTLM relay alert, Defender for Identity suggests enforcing sealed NTLMv2 through the Network security LAN Manager authentication level Group Policy setting. For the Metasploit alert, it suggests disabling SMBv1. For Remote code execution attempt (PsExec, remote WMI or PowerShell to a domain controller), it suggests restricting remote access to domain controllers from non-Tier 0 machines and using privileged access workstations.
    fr: |
      Pour l'alerte de relais NTLM, Defender pour Identity suggère d'imposer NTLMv2 scellé par le paramètre de stratégie de groupe de niveau d'authentification LAN Manager (Network security). Pour l'alerte Metasploit, il suggère de désactiver SMBv1. Pour Remote code execution attempt (PsExec, WMI à distance ou PowerShell vers un contrôleur de domaine), il suggère de restreindre l'accès à distance aux contrôleurs de domaine depuis les machines hors niveau 0 et d'utiliser des stations de travail à accès privilégié.
  options:
    repl: { en: "Validating replication permissions is the remediation for DCSync and DCShadow alerts.", fr: "La vérification des autorisations de réplication est la correction des alertes DCSync et DCShadow." }
references:
  - title: Microsoft Defender for Identity classic alerts
    url: https://learn.microsoft.com/en-us/defender-for-identity/alerts-mdi-classic
