id: sc200-2a-irm-role-group
objective: "2.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Contoso, Ltd. uses Microsoft Defender XDR and Microsoft Purview Insider Risk Management. In the Insider Risk Management data sharing settings, **Share user risk details with other security solutions** is turned on.

    A SOC analyst named Analyst3 has the Security Operator role but can't see the insider risk alerts in the Microsoft Defender portal.

    You need to grant Analyst3 access to these alerts. The solution must follow the principle of least privilege.

    Which role group should you add Analyst3 to?
  fr: |
    Contoso, Ltd. utilise Microsoft Defender XDR et la gestion des risques internes de Microsoft Purview. Dans les paramètres de partage de données de la gestion des risques internes, **Share user risk details with other security solutions** est activé.

    Un analyste SOC nommé Analyst3 dispose du rôle Security Operator, mais ne voit pas les alertes de risque interne dans le portail Microsoft Defender.

    Vous devez accorder à Analyst3 l'accès à ces alertes. La solution doit respecter le principe du moindre privilège.

    À quel groupe de rôles devez-vous ajouter Analyst3 ?
body:
  options:
    - { id: a, text: Insider Risk Management }
    - { id: b, text: Insider Risk Management Analysts }
    - { id: c, text: Insider Risk Management Admins }
    - { id: d, text: Communication Compliance Analysts }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Besides a Defender XDR role such as Security Operator or Security Reader, viewing insider risk alerts in the Defender portal requires membership in the Insider Risk Management, Insider Risk Management Analysts or Insider Risk Management Investigators role group. Insider Risk Management Analysts is the least privileged of the options that work.
    fr: |
      En plus d'un rôle Defender XDR comme Security Operator ou Security Reader, la consultation des alertes de risque interne dans le portail Defender exige l'appartenance au groupe de rôles Insider Risk Management, Insider Risk Management Analysts ou Insider Risk Management Investigators. Insider Risk Management Analysts est l'option valable la moins privilégiée.
  options:
    a: { en: "Insider Risk Management grants every insider risk permission, including configuration, which is more than required.", fr: "Insider Risk Management accorde toutes les autorisations de risque interne, configuration comprise, soit plus que nécessaire." }
    c: { en: "Insider Risk Management Admins is for configuring the solution and isn't one of the role groups that give access to the alerts.", fr: "Insider Risk Management Admins sert à configurer la solution et ne fait pas partie des groupes de rôles qui donnent accès aux alertes." }
    d: { en: "Communication Compliance Analysts belongs to another Purview solution and gives no access to insider risk alerts.", fr: "Communication Compliance Analysts appartient à une autre solution Purview et ne donne pas accès aux alertes de risque interne." }
references:
  - title: Investigate insider risk threats in the Microsoft Defender portal with insights from Microsoft Purview Insider Risk Management
    url: https://learn.microsoft.com/en-us/defender-xdr/irm-investigate-alerts-defender
