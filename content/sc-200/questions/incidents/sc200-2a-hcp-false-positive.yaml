id: sc200-2a-hcp-false-positive
objective: "2.1.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Fabrikam, Inc. uses Microsoft Defender for Office 365. Every week, a partner named Litware sends invoices to the finance team from **billing@litware.example**. This week, all the invoices were quarantined with the verdict **High confidence phishing**.

    You investigate and confirm that the messages are legitimate. You need to make sure that future messages from the sender are delivered. The solution must use a supported method and minimize administrative effort.

    What should you do?
  fr: |
    Fabrikam, Inc. utilise Microsoft Defender pour Office 365. Chaque semaine, un partenaire nommé Litware envoie des factures à l'équipe financière depuis **billing@litware.example**. Cette semaine, toutes les factures ont été mises en quarantaine avec le verdict **High confidence phishing**.

    Votre enquête confirme que les messages sont légitimes. Vous devez faire en sorte que les prochains messages de l'expéditeur soient remis. La solution doit utiliser une méthode prise en charge et réduire au minimum l'effort d'administration.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Create an allow entry for the sender on the Domains & addresses tab of the Tenant Allow/Block List.", fr: "Créer une entrée d'autorisation pour l'expéditeur dans l'onglet Domains & addresses de la liste d'autorisation/de blocage du locataire." } }
    - { id: b, text: { en: "Submit a message on the Submissions page as clean and select Allow this message.", fr: "Envoyer un message depuis la page Envois comme sain et sélectionner Allow this message." } }
    - { id: c, text: { en: "Release the quarantined invoices to all the recipients.", fr: "Libérer les factures mises en quarantaine vers tous les destinataires." } }
    - { id: d, text: { en: "Create an Exchange mail flow rule that sets the SCL of the sender's messages to -1.", fr: "Créer une règle de flux de messagerie Exchange qui définit le SCL des messages de l'expéditeur sur -1." } }
answer: { optionId: b }
explanation:
  correct:
    en: You can't create allow entries directly in the Tenant Allow/Block List for messages blocked as malware or high confidence phishing. Submitting the message on the Submissions page with I've confirmed it's clean and Allow this message creates the allow entry for the sender, which by default stays active until 45 days after it was last used.
    fr: Vous ne pouvez pas créer directement d'entrée d'autorisation dans la liste d'autorisation/de blocage du locataire pour des messages bloqués comme programme malveillant ou hameçonnage à haut niveau de confiance. Envoyer le message depuis la page Envois avec I've confirmed it's clean et Allow this message crée l'entrée d'autorisation de l'expéditeur, qui reste active par défaut jusqu'à 45 jours après sa dernière utilisation.
  options:
    a: { en: "Direct allow entries for domains and addresses override only bulk, spam, high confidence spam and phishing verdicts, not high confidence phishing.", fr: "Les entrées d'autorisation directes de domaines et d'adresses ne remplacent que les verdicts bulk, spam, spam à haut niveau de confiance et hameçonnage, pas l'hameçonnage à haut niveau de confiance." }
    c: { en: "Releasing delivers this week's invoices but does nothing for future messages.", fr: "La libération remet les factures de cette semaine, mais ne change rien pour les prochains messages." }
    d: { en: "Messages identified as high confidence phishing are quarantined even when a mail flow rule sets the SCL to -1, so the rule doesn't help.", fr: "Les messages identifiés comme hameçonnage à haut niveau de confiance sont mis en quarantaine même quand une règle de flux de messagerie définit le SCL sur -1 : la règle n'aide pas." }
references:
  - title: Manage allows and blocks in the Tenant Allow/Block List
    url: https://learn.microsoft.com/en-us/defender-office-365/tenant-allow-block-list-about
  - title: Submit messages, URLs, and attachments for analysis in the Microsoft Defender portal
    url: https://learn.microsoft.com/en-us/defender-office-365/submissions-admin
