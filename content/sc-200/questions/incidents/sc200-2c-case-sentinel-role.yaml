id: sc200-2c-case-sentinel-role
objective: "2.1.10"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam has a Microsoft Sentinel workspace named **SecOps-WS** connected to the Microsoft Defender portal. Access to case management is granted only through Microsoft Sentinel roles on SecOps-WS; no Defender Unified RBAC custom role is used.

    An analyst named Ana must create cases, add tasks, assign cases, update their status, and link incidents to them.

    You need to grant Ana access. The solution must follow the principle of least privilege.

    Which role should you assign to Ana?
  fr: |
    Fabrikam dispose d'un espace de travail Microsoft Sentinel nommé **SecOps-WS** connecté au portail Microsoft Defender. L'accès à la gestion des cas est accordé uniquement par des rôles Microsoft Sentinel sur SecOps-WS ; aucun rôle personnalisé du RBAC unifié de Defender n'est utilisé.

    Une analyste nommée Ana doit créer des cas, y ajouter des tâches, attribuer les cas, mettre à jour leur état et y lier des incidents.

    Vous devez accorder l'accès à Ana. La solution doit respecter le principe du moindre privilège.

    Quel rôle devez-vous attribuer à Ana ?
body:
  options:
    - { id: a, text: Microsoft Sentinel Reader }
    - { id: b, text: Microsoft Sentinel Contributor }
    - { id: c, text: Microsoft Sentinel Responder }
    - { id: d, text: Microsoft Sentinel Automation Contributor }
answer: { optionId: c }
explanation:
  correct:
    en: Creating and managing cases and tasks, assigning them, updating their status and linking or unlinking incidents map to Microsoft Sentinel Responder. It is the least privileged Sentinel role that allows these actions.
    fr: Créer et gérer des cas et des tâches, les attribuer, mettre à jour leur état et lier ou délier des incidents correspondent au rôle Microsoft Sentinel Responder. C'est le rôle Sentinel le moins privilégié qui autorise ces actions.
  options:
    a:
      en: Microsoft Sentinel Reader only allows viewing the case queue, case details, tasks, comments and audits.
      fr: Microsoft Sentinel Reader permet seulement de consulter la file des cas, le détail des cas, les tâches, les commentaires et les audits.
    b:
      en: Microsoft Sentinel Contributor works, but it is needed only to customize the case status options; it grants more than Ana needs.
      fr: Microsoft Sentinel Contributor fonctionne, mais il n'est nécessaire que pour personnaliser les options d'état des cas ; il accorde plus que ce dont Ana a besoin.
    d:
      en: Microsoft Sentinel Automation Contributor lets Microsoft Sentinel add playbooks to automation rules; it isn't meant for users and gives no case management rights.
      fr: Microsoft Sentinel Automation Contributor permet à Microsoft Sentinel d'ajouter des playbooks aux règles d'automatisation ; il n'est pas destiné aux utilisateurs et ne donne aucun droit sur les cas.
references:
  - title: Manage security operations cases natively in the Microsoft Defender portal
    url: https://learn.microsoft.com/en-us/unified-secops/cases-overview
