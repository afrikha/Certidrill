id: sc200-2a-dlp-download-role
objective: "2.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Litware, Inc. investigates Microsoft Purview Data Loss Prevention (DLP) alerts in the Microsoft Defender portal. A DLP alert reports that a user shared a OneDrive file containing credit card numbers.

    An analyst who already has access to the DLP alerts must download the file from the alert page to attach it to the case file.

    Which additional role does the analyst need?
  fr: |
    Litware, Inc. examine les alertes de protection contre la perte de données (DLP) de Microsoft Purview dans le portail Microsoft Defender. Une alerte DLP signale qu'un utilisateur a partagé un fichier OneDrive contenant des numéros de carte de crédit.

    Un analyste qui a déjà accès aux alertes DLP doit télécharger le fichier depuis la page de l'alerte pour le joindre au dossier.

    De quel rôle supplémentaire l'analyste a-t-il besoin ?
body:
  options:
    - { id: a, text: Search and Purge }
    - { id: b, text: View-Only Manage Alerts }
    - { id: c, text: Data Classification Content Viewer }
    - { id: d, text: Preview }
answer: { optionId: c }
explanation:
  correct:
    en: |
      For SharePoint Online and OneDrive files, a DLP alert offers actions such as Apply retention label, Apply sensitivity label, Unshare, Delete and Download. The Download action requires the Data Classification Content Viewer role.
    fr: |
      Pour les fichiers SharePoint Online et OneDrive, une alerte DLP propose des actions comme Apply retention label, Apply sensitivity label, Unshare, Delete et Download. L'action Download exige le rôle Data Classification Content Viewer.
  options:
    a: { en: "Search and Purge is required to remediate email messages in Defender for Office 365, not to download files from DLP alerts.", fr: "Search and Purge est requis pour corriger des e-mails dans Defender pour Office 365, pas pour télécharger des fichiers depuis des alertes DLP." }
    b: { en: "View-Only Manage Alerts gives access to the alerts, which the analyst already has; it doesn't allow downloading the content.", fr: "View-Only Manage Alerts donne accès aux alertes, ce que l'analyste a déjà ; il ne permet pas de télécharger le contenu." }
    d: { en: "Preview lets users preview and download email messages in Defender for Office 365, not files matched by DLP.", fr: "Preview permet d'afficher et de télécharger des e-mails dans Defender pour Office 365, pas des fichiers détectés par la DLP." }
references:
  - title: Investigate data loss alerts with Microsoft Defender XDR
    url: https://learn.microsoft.com/en-us/defender-xdr/dlp-investigate-alerts-defender
