id: sc200-3b-sg-explore-hop
objective: "3.1.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You run a GQL query on a custom graph from the **Microsoft Sentinel > Graphs** page of the Microsoft Defender portal. The graph view shows a node for the user **a.khan** but none of the nodes connected to it.

    You need to display the next hop of a.khan without changing the query.

    What should you do?
  fr: |
    Vous exécutez une requête GQL sur un graphe personnalisé depuis la page **Microsoft Sentinel > Graphs** du portail Microsoft Defender. La vue graphe affiche un nœud pour l'utilisateur **a.khan**, mais aucun des nœuds qui y sont reliés.

    Vous devez afficher le saut suivant de a.khan sans modifier la requête.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Right-click the a.khan node and select ungroup.", fr: "Cliquer avec le bouton droit sur le nœud a.khan et sélectionner ungroup." } }
    - { id: b, text: { en: "Select Realign graph in the visualization options.", fr: "Sélectionner Realign graph dans les options de visualisation." } }
    - { id: c, text: { en: "Right-click the a.khan node and select Explore connected assets.", fr: "Cliquer avec le bouton droit sur le nœud a.khan et sélectionner Explore connected assets." } }
    - { id: d, text: { en: "Select Zoom to fit in the visualization options.", fr: "Sélectionner Zoom to fit dans les options de visualisation." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      In the graph view, right-clicking a node and selecting Explore connected assets expands the graph by one hop from that node. With the descriptive renderer, the + icon next to a node does the same.
    fr: |
      Dans la vue graphe, cliquer avec le bouton droit sur un nœud et sélectionner Explore connected assets développe le graphe d'un saut à partir de ce nœud. Avec le rendu descriptif, l'icône + à côté d'un nœud fait de même.
  options:
    a: { en: "Ungroup splits a group of similar nodes into individual nodes; it doesn't add the next hop.", fr: "Ungroup sépare un groupe de nœuds similaires en nœuds individuels ; il n'ajoute pas le saut suivant." }
    b: { en: "Realign graph returns the graph to its original state.", fr: "Realign graph ramène le graphe à son état d'origine." }
    d: { en: "Zoom to fit only fits the current graph to the screen.", fr: "Zoom to fit ajuste seulement le graphe actuel à l'écran." }
references:
  - title: Visualize graphs in Microsoft Sentinel (preview)
    url: https://learn.microsoft.com/en-us/azure/sentinel/datalake/graph-visualization
