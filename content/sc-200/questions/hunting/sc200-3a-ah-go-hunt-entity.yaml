id: sc200-3a-ah-go-hunt-entity
objective: "3.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Tailspin Toys uses Microsoft Defender XDR. You are investigating an incident whose **Evidence** tab contains a suspicious IP address.

    You need to find all the events that involve the IP address across the relevant advanced hunting tables, scoped to the time of the incident's activity. You must not write the query yourself.

    What should you use?
  fr: |
    Tailspin Toys utilise Microsoft Defender XDR. Vous examinez un incident dont l'onglet **Evidence** contient une adresse IP suspecte.

    Vous devez trouver tous les événements qui impliquent cette adresse IP dans les tables de repérage avancé concernées, limités à la période d'activité de l'incident. Vous ne devez pas écrire la requête vous-même.

    Que devez-vous utiliser ?
body:
  options:
    - { id: a, text: { en: "The Link to incident action of advanced hunting", fr: "L'action Link to incident du repérage avancé" } }
    - { id: b, text: { en: "The Go hunt action on the IP address entity", fr: "L'action Go hunt sur l'entité adresse IP" } }
    - { id: c, text: { en: "The Hunt for related events action in a device timeline", fr: "L'action Hunt for related events dans la chronologie d'un appareil" } }
    - { id: d, text: { en: "A query from the Community queries folder", fr: "Une requête du dossier Community queries" } }
answer: { optionId: b }
explanation:
  correct:
    en: Go hunt, available when you select an entity in an incident, automatically runs an advanced hunting query that checks all the relevant schema tables for events involving that entity, time-scoped around its activity. You can then refine the generated query. IP addresses are among the supported entity types.
    fr: Go hunt, disponible quand vous sélectionnez une entité dans un incident, exécute automatiquement une requête de repérage avancé qui recherche dans toutes les tables du schéma concernées les événements impliquant cette entité, limités dans le temps autour de son activité. Vous pouvez ensuite affiner la requête générée. Les adresses IP font partie des types d'entités pris en charge.
  options:
    a: { en: "Link to incident attaches selected query results to an incident; it doesn't search for events.", fr: "Link to incident rattache des résultats de requête sélectionnés à un incident ; il ne recherche pas d'événements." }
    c: { en: "Hunt for related events starts from an event in a device timeline and returns the events of the same device 30 minutes around it, not the events of an IP address entity.", fr: "Hunt for related events part d'un événement de la chronologie d'un appareil et renvoie les événements du même appareil 30 minutes autour de lui, pas les événements d'une entité adresse IP." }
    d: { en: "A community query is generic; you would have to adapt it to the IP address and the time range yourself.", fr: "Une requête de la communauté est générique ; vous devriez l'adapter vous-même à l'adresse IP et à la plage de temps." }
references:
  - title: Quickly hunt for entity or event information with go hunt
    url: https://learn.microsoft.com/en-us/defender-xdr/advanced-hunting-go-hunt
