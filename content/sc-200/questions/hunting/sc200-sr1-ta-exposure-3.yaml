id: sc200-sr1-ta-exposure-3
objective: "3.1.4"
type: series_yesno
series: sc200-sr1-ta-exposure
seriesOrder: 3
difficulty: 2
status: draft
stem:
  en: You read the Analyst report tab of the report with your current role.
  fr: Vous lisez l'onglet Analyst report du rapport avec votre rôle actuel.
body:
  solution:
    en: |
      Without changing your role, you open the threat analytics report and read the **Analyst report** tab, including its recommendations and threat hunting guidance.
    fr: |
      Sans modifier votre rôle, vous ouvrez le rapport d'analytique des menaces et lisez l'onglet **Analyst report**, y compris ses recommandations et ses conseils de repérage des menaces.
answer: { value: false }
explanation:
  correct:
    en: |
      The analyst report describes the threat in general: attack chains, MITRE ATT&CK techniques, recommendations and hunting guidance. It does not show the state of your own devices. The exposure level and the status of the mitigations in your tenant appear in Endpoints exposure and Recommended actions, which your current role cannot display.
    fr: |
      Le rapport d'analyste décrit la menace de façon générale : chaînes d'attaque, techniques MITRE ATT&CK, recommandations et conseils de repérage. Il ne montre pas l'état de vos propres appareils. Le niveau d'exposition et l'état des atténuations de votre locataire apparaissent dans Endpoints exposure et Recommended actions, que votre rôle actuel ne peut pas afficher.
references:
  - title: Threat analytics in Microsoft Defender
    url: https://learn.microsoft.com/en-us/defender-xdr/threat-analytics
