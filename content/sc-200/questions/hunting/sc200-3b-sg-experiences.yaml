id: sc200-3b-sg-experiences
objective: "3.1.6"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Contoso is onboarded to the Microsoft Sentinel data lake and uses Microsoft Defender XDR and Microsoft Purview. Several teams want to analyze relationships between entities by using experiences powered by Microsoft Sentinel graph.

    Which experience should each team use? To answer, drag the appropriate experiences to the correct requirements. Each experience may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso est intégré au data lake Microsoft Sentinel et utilise Microsoft Defender XDR et Microsoft Purview. Plusieurs équipes veulent analyser les relations entre entités avec des expériences alimentées par Microsoft Sentinel graph.

    Quelle expérience chaque équipe doit-elle utiliser ? Pour répondre, faites glisser les expériences appropriées vers les besoins correspondants. Chaque expérience peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: dsi, text: { en: "Data Security Investigations data risk graph", fr: "Graphe des risques liés aux données de Data Security Investigations" } }
    - { id: irm, text: { en: "Insider Risk Management data risk graph", fr: "Graphe des risques liés aux données d'Insider Risk Management" } }
    - { id: br, text: { en: "Incident graph with blast radius", fr: "Graphe de l'incident avec rayon d'impact" } }
    - { id: hg, text: { en: "Hunting graph", fr: "Graphe de chasse" } }
    - { id: cg, text: { en: "Custom graph", fr: "Graphe personnalisé" } }
  targets:
    - id: t1
      text: { en: "Trace how sensitive data was accessed and moved while investigating a data security incident", fr: "Retracer l'accès aux données sensibles et leur déplacement pendant l'enquête sur un incident de sécurité des données" }
    - id: t2
      text: { en: "See, in one view, the current impact of a breach and where it could spread next", fr: "Voir, dans une seule vue, l'impact actuel d'une violation et l'endroit où elle pourrait se propager ensuite" }
    - id: t3
      text: { en: "Traverse relationships between assets to find hidden paths, with no incident as a starting point", fr: "Parcourir les relations entre les ressources pour trouver des chemins cachés, sans incident comme point de départ" }
    - id: t4
      text: { en: "Model an OAuth privilege escalation chain with node and edge types defined from your own data lake tables", fr: "Modéliser une chaîne d'élévation de privilèges OAuth avec des types de nœuds et d'arêtes définis à partir de vos propres tables du data lake" }
answer:
  mapping: { t1: dsi, t2: br, t3: hg, t4: cg }
explanation:
  correct:
    en: |
      The Data Security Investigations data risk graph traces sensitive data access and movement. The incident graph with blast radius combines current breach impact and possible future impact. The hunting graph lets analysts traverse relationships between assets proactively. Custom graphs are authored in notebooks from your own data to model scenarios such as OAuth privilege escalation.
    fr: |
      Le graphe des risques liés aux données de Data Security Investigations retrace l'accès aux données sensibles et leur déplacement. Le graphe de l'incident avec rayon d'impact combine l'impact actuel de la violation et son impact futur possible. Le graphe de chasse permet de parcourir de façon proactive les relations entre les ressources. Les graphes personnalisés se créent dans des notebooks à partir de vos propres données pour modéliser des scénarios comme l'élévation de privilèges OAuth.
  options:
    irm: { en: "The Insider Risk Management data risk graph maps user activities to detect exfiltration patterns; it isn't the investigation tool of Data Security Investigations.", fr: "Le graphe des risques liés aux données d'Insider Risk Management relie les activités des utilisateurs pour détecter des schémas d'exfiltration ; ce n'est pas l'outil d'enquête de Data Security Investigations." }
references:
  - title: What is Microsoft Sentinel graph?
    url: https://learn.microsoft.com/en-us/azure/sentinel/datalake/sentinel-graph-overview
