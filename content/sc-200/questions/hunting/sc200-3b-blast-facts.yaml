id: sc200-3b-blast-facts
objective: "3.1.5"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove uses Microsoft Defender XDR and is onboarded to the Microsoft Sentinel data lake. Analysts use blast radius in the incident graph. Some analysts have Defender unified RBAC permissions scoped to a subset of the devices.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove utilise Microsoft Defender XDR et est intégré au data lake Microsoft Sentinel. Les analystes utilisent le rayon d'impact dans le graphe de l'incident. Certains analystes disposent d'autorisations RBAC unifié Defender limitées à une partie des appareils.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          The paths added by blast radius are paths that the attacker has already used during the incident.
        fr: |
          Les chemins ajoutés par le rayon d'impact sont des chemins que l'attaquant a déjà empruntés pendant l'incident.
    - id: s2
      text:
        en: |
          An analyst whose scope excludes a device doesn't see the blast radius paths that go through that device.
        fr: |
          Un analyste dont l'étendue exclut un appareil ne voit pas les chemins du rayon d'impact qui passent par cet appareil.
    - id: s3
      text:
        en: |
          When blast radius first loads, the graph displays every path from the selected node to every critical target.
        fr: |
          Au premier chargement du rayon d'impact, le graphe affiche tous les chemins du nœud sélectionné vers toutes les cibles critiques.
answer:
  values: { s1: false, s2: true, s3: false }
explanation:
  correct:
    en: |
      Blast radius shows possible propagation paths, an approximation of where an attacker could go, not paths confirmed as used. Only the nodes and edges inside the viewer's RBAC scopes are shown, so paths through out-of-scope nodes are hidden. The graph first loads the eight top-rated attack paths; View full blast radius list shows all of them.
    fr: |
      Le rayon d'impact montre des chemins de propagation possibles, une approximation de l'endroit où un attaquant pourrait aller, pas des chemins dont l'utilisation est confirmée. Seuls les nœuds et les arêtes compris dans les étendues RBAC de l'utilisateur sont affichés : les chemins qui passent par des nœuds hors étendue sont masqués. Le graphe charge d'abord les huit chemins d'attaque les mieux classés ; View full blast radius list les affiche tous.
references:
  - title: Investigate incidents in the Microsoft Defender portal
    url: https://learn.microsoft.com/en-us/defender-xdr/investigate-incidents
