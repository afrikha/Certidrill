id: sc200-3b-hq-favorites
objective: "3.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Adatum analysts use five hunting queries of their Microsoft Sentinel workspace every day.

    You need the five queries to run automatically each time an analyst opens the Hunting page. The queries must not create alerts or incidents. The solution must minimize administrative effort.

    What should you do?
  fr: |
    Les analystes d'Adatum utilisent chaque jour cinq requêtes de chasse de leur espace de travail Microsoft Sentinel.

    Les cinq requêtes doivent s'exécuter automatiquement chaque fois qu'un analyste ouvre la page Hunting. Les requêtes ne doivent créer ni alertes ni incidents. La solution doit réduire au minimum l'effort d'administration.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Create a scheduled analytics rule from each query.", fr: "Créer une règle d'analytique planifiée à partir de chaque requête." } }
    - { id: b, text: { en: "Add the five queries to a new hunt.", fr: "Ajouter les cinq requêtes à une nouvelle chasse (hunt)." } }
    - { id: c, text: { en: "Add the five queries to the favorites.", fr: "Ajouter les cinq requêtes aux favoris." } }
    - { id: d, text: { en: "Create a scheduled KQL job for each query.", fr: "Créer une tâche KQL planifiée pour chaque requête." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Hunting queries saved to favorites run automatically each time the Hunting page opens. They still only return results and don't create alerts or incidents.
    fr: |
      Les requêtes de chasse ajoutées aux favoris s'exécutent automatiquement à chaque ouverture de la page Hunting. Elles ne font que renvoyer des résultats et ne créent ni alertes ni incidents.
  options:
    a: { en: "Analytics rules run on their own schedule and create alerts and incidents.", fr: "Les règles d'analytique s'exécutent selon leur propre planification et créent des alertes et des incidents." }
    b: { en: "A hunt groups queries around a hypothesis; its queries run when you run them, not when the Hunting page opens.", fr: "Une chasse regroupe des requêtes autour d'une hypothèse ; ses requêtes s'exécutent quand vous les lancez, pas à l'ouverture de la page Hunting." }
    d: { en: "KQL jobs run over the data lake on their schedule and write to tables, which is more effort and not tied to the Hunting page.", fr: "Les tâches KQL s'exécutent sur le data lake selon leur planification et écrivent dans des tables, ce qui demande plus d'effort et n'est pas lié à la page Hunting." }
references:
  - title: Threat hunting in Microsoft Sentinel
    url: https://learn.microsoft.com/en-us/azure/sentinel/hunting
