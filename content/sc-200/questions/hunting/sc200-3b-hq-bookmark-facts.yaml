id: sc200-3b-hq-bookmark-facts
objective: "3.2.1"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Northwind Traders analysts have created about 1,400 hunting bookmarks in a Microsoft Sentinel workspace, in the Azure portal. Some bookmarks have no entity mapping.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Les analystes de Northwind Traders ont créé environ 1 400 signets de chasse dans un espace de travail Microsoft Sentinel, dans le portail Azure. Certains signets n'ont aucun mappage d'entités.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          The Bookmarks tab of the Hunting page lists all 1,400 bookmarks.
        fr: |
          L'onglet Bookmarks de la page Hunting liste les 1 400 signets.
    - id: s2
      text:
        en: |
          To open a bookmark in the investigation graph, the bookmark must have at least one mapped entity.
        fr: |
          Pour ouvrir un signet dans le graphe d'investigation, le signet doit avoir au moins une entité mappée.
    - id: s3
      text:
        en: |
          When an analyst deletes a bookmark, all its earlier records are removed from the HuntingBookmark table.
        fr: |
          Lorsqu'un analyste supprime un signet, tous ses enregistrements antérieurs sont retirés de la table HuntingBookmark.
answer:
  values: { s1: false, s2: true, s3: false }
explanation:
  correct:
    en: |
      The Bookmarks tab displays up to 1,000 bookmarks; the others are available in the logs. Investigate opens the investigation graph only for bookmarks with at least one mapped entity. The HuntingBookmark table keeps one record per change, and deleting a bookmark adds a record with SoftDeleted set to true instead of removing the history.
    fr: |
      L'onglet Bookmarks affiche jusqu'à 1 000 signets ; les autres sont disponibles dans les journaux. Investigate n'ouvre le graphe d'investigation que pour les signets ayant au moins une entité mappée. La table HuntingBookmark conserve un enregistrement par modification, et la suppression d'un signet ajoute un enregistrement dont SoftDeleted vaut true au lieu d'effacer l'historique.
references:
  - title: Hunt with bookmarks in Microsoft Sentinel
    url: https://learn.microsoft.com/en-us/azure/sentinel/bookmarks
