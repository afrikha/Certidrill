id: sc200-3b-sg-table-export
objective: "3.1.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You run a GQL query on a custom graph from the **Microsoft Sentinel > Graphs** page of the Microsoft Defender portal. The query uses **COLLECTLIST**, and the graph tab displays a message instead of a graph.

    You need to review the query results and save them as a CSV file for a report.

    What should you do?
  fr: |
    Vous exécutez une requête GQL sur un graphe personnalisé depuis la page **Microsoft Sentinel > Graphs** du portail Microsoft Defender. La requête utilise **COLLECTLIST**, et l'onglet du graphe affiche un message au lieu d'un graphe.

    Vous devez examiner les résultats de la requête et les enregistrer dans un fichier CSV pour un rapport.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Select the Table tab, and then export the results to CSV.", fr: "Sélectionner l'onglet Table, puis exporter les résultats au format CSV." } }
    - { id: b, text: { en: "Select Share query, and then select Copy graph results.", fr: "Sélectionner Share query, puis sélectionner Copy graph results." } }
    - { id: c, text: { en: "Change the renderer to Simplified, and then run the query again.", fr: "Passer le rendu sur Simplified, puis exécuter de nouveau la requête." } }
    - { id: d, text: { en: "Change the layout to Directed, and then run the query again.", fr: "Passer la disposition sur Directed, puis exécuter de nouveau la requête." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Results of operators such as COLLECTLIST can't be rendered as a graph and appear in the table view. The Table tab lets you search, sort and inspect the JSON of results, and export them to CSV.
    fr: |
      Les résultats d'opérateurs comme COLLECTLIST ne peuvent pas être représentés sous forme de graphe et s'affichent dans la vue tableau. L'onglet Table permet de rechercher, de trier et d'examiner le JSON des résultats, et de les exporter au format CSV.
  options:
    b: { en: "Copy graph results creates a shareable link with the query and a screenshot, not a CSV file.", fr: "Copy graph results crée un lien partageable avec la requête et une capture d'écran, pas un fichier CSV." }
    c: { en: "The renderer changes how graph results are drawn; results that can't be rendered as a graph still won't be.", fr: "Le rendu change la façon de dessiner les résultats de graphe ; des résultats non représentables sous forme de graphe ne le seront toujours pas." }
    d: { en: "The layout arranges nodes in the graph view; it doesn't export anything.", fr: "La disposition organise les nœuds dans la vue graphe ; elle n'exporte rien." }
references:
  - title: Visualize graphs in Microsoft Sentinel (preview)
    url: https://learn.microsoft.com/en-us/azure/sentinel/datalake/graph-visualization
