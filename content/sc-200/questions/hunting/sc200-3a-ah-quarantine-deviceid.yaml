id: sc200-3a-ah-quarantine-deviceid
objective: "3.1.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Adatum Corporation uses Microsoft Defender for Endpoint. You have the permissions required to submit remediation actions on devices.

    You run the following advanced hunting query:

    ```kusto
    DeviceFileEvents
    | where Timestamp > ago(1d)
    | where FileName == "invoice_viewer.dll"
    | project Timestamp, DeviceName, FolderPath, SHA1
    ```

    When you select the results and **Take actions**, the action to quarantine the file isn't available. You need to quarantine the file from the query results.

    Which column should you add to the query results?
  fr: |
    Adatum Corporation utilise Microsoft Defender for Endpoint. Vous disposez des autorisations nécessaires pour envoyer des actions de correction sur les appareils.

    Vous exécutez la requête de repérage avancé suivante :

    ```kusto
    DeviceFileEvents
    | where Timestamp > ago(1d)
    | where FileName == "invoice_viewer.dll"
    | project Timestamp, DeviceName, FolderPath, SHA1
    ```

    Quand vous sélectionnez les résultats puis **Take actions**, l'action de mise en quarantaine du fichier n'est pas disponible. Vous devez mettre le fichier en quarantaine à partir des résultats de la requête.

    Quelle colonne devez-vous ajouter aux résultats de la requête ?
body:
  options:
    - { id: a, text: DeviceId }
    - { id: b, text: ReportId }
    - { id: c, text: SHA256 }
    - { id: d, text: InitiatingProcessAccountSid }
answer: { optionId: a }
explanation:
  correct:
    en: The quarantine action needs a file hash column (SHA1, SHA256 or their InitiatingProcess versions) and the DeviceId column. The query already returns SHA1 but only the device name, so adding DeviceId makes the action available.
    fr: |
      L'action de mise en quarantaine nécessite une colonne de hachage de fichier (SHA1, SHA256 ou leurs versions InitiatingProcess) et la colonne DeviceId. La requête renvoie déjà SHA1 mais seulement le nom de l'appareil : l'ajout de DeviceId rend l'action disponible.
  options:
    b: { en: "ReportId identifies the event; it isn't the device identifier that the file actions require.", fr: "ReportId identifie l'événement ; ce n'est pas l'identificateur d'appareil exigé par les actions sur les fichiers." }
    c: { en: "SHA256 is an alternative to SHA1, which the results already contain; the missing column is the device identifier.", fr: "SHA256 est une alternative à SHA1, que les résultats contiennent déjà ; la colonne manquante est l'identificateur d'appareil." }
    d: { en: "An account SID is used by the user actions (Disable user, Reset user authentication), not by the quarantine action.", fr: "Un SID de compte est utilisé par les actions sur les utilisateurs (Disable user, Reset user authentication), pas par l'action de mise en quarantaine." }
references:
  - title: Take action on advanced hunting query results
    url: https://learn.microsoft.com/en-us/defender-xdr/advanced-hunting-take-action
