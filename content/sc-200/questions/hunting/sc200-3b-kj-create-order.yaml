id: sc200-3b-kj-create-order
objective: "3.2.2"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    Northwind Traders is onboarded to the Microsoft Sentinel data lake. An earlier KQL job created the table **IocHits_KQL_CL** in the analytics tier of the workspace SOC-WS.

    You write a query in the KQL queries editor of data lake exploration, and then select **Create job**. The new job must append its results to IocHits_KQL_CL every hour.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Northwind Traders est intégré au data lake Microsoft Sentinel. Une tâche KQL antérieure a créé la table **IocHits_KQL_CL** au niveau Analytics de l'espace de travail SOC-WS.

    Vous écrivez une requête dans l'éditeur KQL queries de l'exploration du data lake, puis vous sélectionnez **Create job**. La nouvelle tâche doit ajouter ses résultats à IocHits_KQL_CL toutes les heures.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: details, text: { en: "Enter the job name, select SOC-WS, and then select Add to an existing table and IocHits_KQL_CL.", fr: "Saisir le nom de la tâche, sélectionner SOC-WS, puis sélectionner Add to an existing table et IocHits_KQL_CL." } }
    - { id: query, text: { en: "Review the query and the Selected workspaces.", fr: "Vérifier la requête et les Selected workspaces." } }
    - { id: sched, text: { en: "Select Scheduled job, set the repeat frequency to Hourly, and set the From time.", fr: "Sélectionner Scheduled job, définir la fréquence de répétition sur Hourly et définir l'heure From." } }
    - { id: submit, text: { en: "Review the job details, and then select Submit.", fr: "Vérifier les détails de la tâche, puis sélectionner Submit." } }
    - { id: mi, text: { en: "Assign Log Analytics Contributor on SOC-WS to the msg-resources-<guid> managed identity.", fr: "Attribuer Log Analytics Contributor sur SOC-WS à l'identité managée msg-resources-<guid>." } }
    - { id: enable, text: { en: "On the Jobs page, select the job, and then select Enable.", fr: "Dans la page Jobs, sélectionner la tâche, puis sélectionner Enable." } }
answer:
  sequence: [ details, query, sched, submit ]
explanation:
  correct:
    en: |
      The job wizard goes through Job details (name, destination workspace and table), Prepare the query (query and selected workspaces), Schedule the query job, and Review and submit. A scheduled job then appears on the Jobs page and runs from its start time.
    fr: |
      L'assistant de tâche passe par Job details (nom, espace de travail et table de destination), Prepare the query (requête et espaces de travail sélectionnés), Schedule the query job, puis Review and submit. Une tâche planifiée apparaît ensuite dans la page Jobs et s'exécute à partir de son heure de début.
  options:
    mi: { en: "The managed identity role is needed only to create new analytics-tier tables; IocHits_KQL_CL already exists.", fr: "Le rôle de l'identité managée n'est nécessaire que pour créer de nouvelles tables au niveau Analytics ; IocHits_KQL_CL existe déjà." }
    enable: { en: "A submitted scheduled job runs from its start time without being enabled separately.", fr: "Une tâche planifiée soumise s'exécute à partir de son heure de début sans activation séparée." }
references:
  - title: Create KQL jobs in the Microsoft Sentinel data lake
    url: https://learn.microsoft.com/en-us/azure/sentinel/datalake/kql-jobs
