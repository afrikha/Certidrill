id: sc200-3b-hq-bookmark-kql
objective: "3.2.1"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    Contoso analysts create, update and delete hunting bookmarks in a Microsoft Sentinel workspace. Several bookmarks have the same name.

    You need a query that returns the latest version of each bookmark that has not been deleted.

    How should you complete the query? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Les analystes de Contoso créent, modifient et suppriment des signets de chasse dans un espace de travail Microsoft Sentinel. Plusieurs signets portent le même nom.

    Vous avez besoin d'une requête qui renvoie la dernière version de chaque signet qui n'a pas été supprimé.

    Comment devez-vous compléter la requête ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: kusto
  template: |
    HuntingBookmark
    | summarize [[agg]](LastUpdatedTime, *) by [[key]]
    | where [[flt]]
    | project BookmarkName, Tags, Notes, LastUpdatedTime
  slots:
    - id: agg
      options:
        - { id: argmax, text: arg_max }
        - { id: argmin, text: arg_min }
        - { id: max, text: max }
        - { id: set, text: make_set }
    - id: key
      options:
        - { id: id, text: BookmarkId }
        - { id: name, text: BookmarkName }
        - { id: tg, text: TimeGenerated }
    - id: flt
      options:
        - { id: notdel, text: SoftDeleted == false }
        - { id: del, text: SoftDeleted == true }
        - { id: notes, text: isnotempty(Notes) }
answer:
  values: { agg: argmax, key: id, flt: notdel }
explanation:
  correct:
    en: |
      HuntingBookmark keeps one record per change of a bookmark. arg_max(LastUpdatedTime, *) by BookmarkId keeps the most recent record of each bookmark with all its columns; BookmarkId is the unique identifier, while names can repeat. A deleted bookmark's latest record has SoftDeleted set to true, so the filter keeps SoftDeleted == false.
    fr: |
      HuntingBookmark conserve un enregistrement par modification d'un signet. arg_max(LastUpdatedTime, *) by BookmarkId garde l'enregistrement le plus récent de chaque signet avec toutes ses colonnes ; BookmarkId est l'identificateur unique, alors que les noms peuvent se répéter. Le dernier enregistrement d'un signet supprimé a SoftDeleted à true : le filtre conserve donc SoftDeleted == false.
  options:
    argmin: { en: "arg_min returns the oldest record of each bookmark, not its latest version.", fr: "arg_min renvoie l'enregistrement le plus ancien de chaque signet, pas sa dernière version." }
    max: { en: "max(LastUpdatedTime, *) isn't valid: max returns one value and doesn't keep the other columns.", fr: "max(LastUpdatedTime, *) n'est pas valide : max renvoie une seule valeur et ne conserve pas les autres colonnes." }
    name: { en: "Several bookmarks share a name, so grouping by BookmarkName would merge different bookmarks.", fr: "Plusieurs signets partagent un nom : regrouper par BookmarkName fusionnerait des signets différents." }
    del: { en: "SoftDeleted == true keeps only the deleted bookmarks.", fr: "SoftDeleted == true ne conserve que les signets supprimés." }
references:
  - title: Hunt with bookmarks in Microsoft Sentinel
    url: https://learn.microsoft.com/en-us/azure/sentinel/bookmarks
  - title: Azure Monitor Logs reference - HuntingBookmark
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/reference/tables/huntingbookmark
