id: sc200-3b-kj-history
objective: "3.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Fabrikam is onboarded to the Microsoft Sentinel data lake. A scheduled KQL job named **DnsIocDaily** promotes data to the analytics tier.

    You need to review, for each run of DnsIocDaily during the last week, its status and the number of rows sent to the destination table.

    What should you use?
  fr: |
    Fabrikam est intégré au data lake Microsoft Sentinel. Une tâche KQL planifiée nommée **DnsIocDaily** promeut des données au niveau Analytics.

    Vous devez examiner, pour chaque exécution de DnsIocDaily au cours de la semaine dernière, son état et le nombre de lignes envoyées à la table de destination.

    Que devez-vous utiliser ?
body:
  options:
    - { id: a, text: { en: "The Recent health issues column of the Jobs page", fr: "La colonne Recent health issues de la page Jobs" } }
    - { id: b, text: { en: "The Async Queries tab of the KQL queries editor", fr: "L'onglet Async Queries de l'éditeur KQL queries" } }
    - { id: c, text: { en: "The LASummaryLogs table of the workspace", fr: "La table LASummaryLogs de l'espace de travail" } }
    - { id: d, text: { en: "View history in the job details pane", fr: "View history dans le volet de détails de la tâche" } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      View history in the details pane of a KQL job lists its runs with their times, statuses and the number of rows sent to the destination table in the analytics tier.
    fr: |
      View history, dans le volet de détails d'une tâche KQL, liste ses exécutions avec leurs heures, leurs états et le nombre de lignes envoyées à la table de destination du niveau Analytics.
  options:
    a: { en: "Recent health issues only flags whether recent runs had problems; it doesn't list row counts per run.", fr: "Recent health issues indique seulement si des exécutions récentes ont rencontré des problèmes ; il ne liste pas le nombre de lignes par exécution." }
    b: { en: "The Async Queries tab tracks async interactive queries, not job runs.", fr: "L'onglet Async Queries suit les requêtes interactives asynchrones, pas les exécutions de tâches." }
    c: { en: "LASummaryLogs records the runs of summary rules, not of KQL jobs.", fr: "LASummaryLogs enregistre les exécutions des règles de synthèse, pas celles des tâches KQL." }
references:
  - title: Manage jobs in the Microsoft Sentinel data lake
    url: https://learn.microsoft.com/en-us/azure/sentinel/datalake/kql-manage-jobs
