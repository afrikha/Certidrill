id: sc200-sr1-hash-hunt-3
objective: "3.1.2"
type: series_yesno
series: sc200-sr1-hash-hunt
seriesOrder: 3
difficulty: 3
status: draft
stem:
  en: You use union on three filtered subqueries.
  fr: Vous utilisez union sur trois sous-requêtes filtrées.
body:
  solution:
    en: |
      You run the following query.

      ```kusto
      let FileHash = "e38b80b61ad0c4d528c6401c93983332cb9c4360c6f5d489c61459e246641127";
      let StartTime = ago(30d);
      union
          (DeviceFileEvents | where Timestamp > StartTime and SHA256 == FileHash),
          (DeviceProcessEvents | where Timestamp > StartTime and SHA256 == FileHash),
          (EmailAttachmentInfo | where Timestamp > StartTime and SHA256 == FileHash)
      ```
    fr: |
      Vous exécutez la requête suivante.

      ```kusto
      let FileHash = "e38b80b61ad0c4d528c6401c93983332cb9c4360c6f5d489c61459e246641127";
      let StartTime = ago(30d);
      union
          (DeviceFileEvents | where Timestamp > StartTime and SHA256 == FileHash),
          (DeviceProcessEvents | where Timestamp > StartTime and SHA256 == FileHash),
          (EmailAttachmentInfo | where Timestamp > StartTime and SHA256 == FileHash)
      ```
answer: { value: true }
explanation:
  correct:
    en: |
      The operands of union can be query expressions enclosed in parentheses, so each table is filtered before the results are combined. The query returns the matching records of each table independently, which gives the same result as filtering after the union.
    fr: |
      Les opérandes d'union peuvent être des expressions de requête entre parenthèses : chaque table est filtrée avant la combinaison des résultats. La requête renvoie indépendamment les enregistrements correspondants de chaque table, ce qui donne le même résultat qu'un filtrage après l'union.
references:
  - title: union operator
    url: https://learn.microsoft.com/en-us/kusto/query/union-operator
