stem:
  en: You add ShadowCopyDeletion to the favorites.
  fr: Vous ajoutez ShadowCopyDeletion aux favoris.
body:
  solution:
    en: On the **Hunting** page, you add **ShadowCopyDeletion** to your **favorites**.
    fr: Dans la page **Hunting**, vous ajoutez **ShadowCopyDeletion** à vos **favoris** (Favorites).
answer: { value: false }
explanation:
  correct:
    en: Favorite queries run automatically only when someone opens the Hunting page, not on a schedule. A hunting query never creates alerts or incidents by itself, so no incident is created.
    fr: Les requêtes favorites s'exécutent automatiquement uniquement lorsqu'une personne ouvre la page Hunting, et non selon une planification. Une requête de chasse ne crée jamais d'alertes ni d'incidents par elle-même ; aucun incident n'est donc créé.
references:
  - title: Hunting Capabilities in Microsoft Sentinel
    url: https://learn.microsoft.com/en-us/azure/sentinel/hunting
