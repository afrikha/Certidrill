id: sc200-3a-ah-multi-user-sid
objective: "3.1.3"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    Fabrikam, Inc. uses Microsoft Defender XDR with Microsoft Defender for Identity. Some of its on-premises Active Directory accounts aren't synchronized to Microsoft Entra ID.

    You write an advanced hunting query that identifies on-premises accounts showing signs of compromise. From the results, you need to run the **Disable user** and **Reset user authentication** actions on these accounts.

    Which two columns can provide the identifier that these actions require? Each correct answer presents a complete solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam, Inc. utilise Microsoft Defender XDR avec Microsoft Defender for Identity. Certains de ses comptes Active Directory locaux ne sont pas synchronisés avec Microsoft Entra ID.

    Vous écrivez une requête de repérage avancé qui identifie des comptes locaux présentant des signes de compromission. À partir des résultats, vous devez exécuter les actions **Disable user** et **Reset user authentication** sur ces comptes.

    Quelles sont les deux colonnes qui peuvent fournir l'identificateur exigé par ces actions ? Chaque bonne réponse constitue une solution complète.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: AccountUpn }
    - { id: b, text: AccountName }
    - { id: c, text: AccountSid }
    - { id: d, text: AccountDisplayName }
    - { id: e, text: OnPremSid }
answer: { optionIds: [ c, e ] }
explanation:
  correct:
    en: Both user actions require the security identifier (SID) of the account, read from AccountSid, InitiatingProcessAccountSid, RequestAccountSid or OnPremSid. For Microsoft Entra identities, AccountObjectId is also required, which doesn't apply to these unsynchronized accounts.
    fr: Les deux actions sur les utilisateurs exigent l'identificateur de sécurité (SID) du compte, lu dans AccountSid, InitiatingProcessAccountSid, RequestAccountSid ou OnPremSid. Pour les identités Microsoft Entra, AccountObjectId est également exigé, ce qui ne concerne pas ces comptes non synchronisés.
  options:
    a: { en: "A user principal name isn't accepted as the identifier of the user actions.", fr: "Un nom d'utilisateur principal (UPN) n'est pas accepté comme identificateur des actions sur les utilisateurs." }
    b: { en: "An account name isn't unique across domains and isn't accepted as the identifier.", fr: "Un nom de compte n'est pas unique entre domaines et n'est pas accepté comme identificateur." }
    d: { en: "A display name isn't an identifier; the actions need the SID.", fr: "Un nom d'affichage n'est pas un identificateur ; les actions ont besoin du SID." }
references:
  - title: Take action on advanced hunting query results
    url: https://learn.microsoft.com/en-us/defender-xdr/advanced-hunting-take-action
