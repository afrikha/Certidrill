id: sc200-3a-ah-dd-detection-ready
objective: "3.1.3"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    Contoso, Ltd. uses Microsoft Defender for Endpoint. Ransomware operators often delete volume shadow copies with vssadmin.

    You are writing an advanced hunting query from which you will create a custom detection rule. The query must:

    - Return the vssadmin.exe processes whose command line contains both the term delete and the term shadows, in any order.
    - Return the columns that let the rule identify the triggering event, scope it to the right device group and display the process tree.

    How should you complete the query? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso, Ltd. utilise Microsoft Defender for Endpoint. Les opérateurs de rançongiciels suppriment souvent les clichés instantanés de volume avec vssadmin.

    Vous écrivez une requête de repérage avancé à partir de laquelle vous créerez une règle de détection personnalisée. La requête doit :

    - Renvoyer les processus vssadmin.exe dont la ligne de commande contient à la fois le terme delete et le terme shadows, dans n'importe quel ordre.
    - Renvoyer les colonnes qui permettent à la règle d'identifier l'événement déclencheur, de l'associer au bon groupe d'appareils et d'afficher l'arborescence des processus.

    Comment devez-vous compléter la requête ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: kusto
  template: |
    DeviceProcessEvents
    | where FileName =~ "vssadmin.exe"
    | where ProcessCommandLine [[op]] ("delete", "shadows")
    | project Timestamp, DeviceId, [[evt]], AccountName, ProcessCommandLine
  slots:
    - id: op
      options:
        - { id: hasall, text: has_all }
        - { id: hasany, text: has_any }
        - { id: inci, text: in~ }
    - id: evt
      options:
        - { id: reportid, text: ReportId }
        - { id: processid, text: ProcessId }
        - { id: initpid, text: InitiatingProcessId }
        - { id: devicename, text: DeviceName }
answer:
  values: { op: hasall, evt: reportid }
explanation:
  correct:
    en: has_all is true only when every listed term is present in the value, in any order. For Defender for Endpoint tables, a custom detection query must return DeviceId and ReportId together with Timestamp; they identify the triggering event, ensure correct device group scoping and make the process tree view work.
    fr: has_all n'est vrai que si tous les termes de la liste sont présents dans la valeur, dans n'importe quel ordre. Pour les tables de Defender for Endpoint, une requête de détection personnalisée doit renvoyer DeviceId et ReportId avec Timestamp ; ils identifient l'événement déclencheur, garantissent l'étendue correcte par groupe d'appareils et font fonctionner la vue de l'arborescence des processus.
  options:
    hasany: { en: "has_any is true when at least one term is present, so a command line with only delete would match.", fr: "has_any est vrai dès qu'un des termes est présent : une ligne de commande ne contenant que delete correspondrait." }
    inci: { en: "in~ compares the whole command line with each value of the list, so it only matches a command line equal to delete or shadows.", fr: "in~ compare la ligne de commande entière à chaque valeur de la liste : il ne correspond qu'à une ligne de commande égale à delete ou à shadows." }
    processid: { en: "ProcessId is recycled by Windows and isn't the event identifier that custom detections require.", fr: "ProcessId est recyclé par Windows et n'est pas l'identificateur d'événement exigé par les détections personnalisées." }
    initpid: { en: "InitiatingProcessId identifies the parent process, not the event.", fr: "InitiatingProcessId identifie le processus parent, pas l'événement." }
    devicename: { en: "DeviceName maps a device but doesn't identify the event; DeviceId is already returned.", fr: "DeviceName permet de mapper un appareil mais n'identifie pas l'événement ; DeviceId est déjà renvoyé." }
references:
  - title: Create custom detection rules in Microsoft Defender XDR
    url: https://learn.microsoft.com/en-us/defender-xdr/custom-detection-rules
  - title: String operators
    url: https://learn.microsoft.com/en-us/kusto/query/datatypes-string-operators
