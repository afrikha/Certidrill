id: sc200-3b-hq-new-query
objective: "3.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso uses Microsoft Sentinel in the Microsoft Defender portal. You wrote a KQL query that finds shadow copy deletions in the SecurityEvent table.

    You need the query to appear in the Microsoft Sentinel hunting queries list, with Host entity mappings and the MITRE ATT&CK technique T1490. The query must not generate alerts.

    What should you do?
  fr: |
    Contoso utilise Microsoft Sentinel dans le portail Microsoft Defender. Vous avez écrit une requête KQL qui détecte les suppressions de clichés instantanés dans la table SecurityEvent.

    La requête doit apparaître dans la liste des requêtes de chasse de Microsoft Sentinel, avec des mappages d'entités Host et la technique MITRE ATT&CK T1490. La requête ne doit pas générer d'alertes.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "On the Hunting page, on the Queries tab, select New query.", fr: "Dans la page Hunting, sous l'onglet Queries, sélectionner New query." } }
    - { id: b, text: { en: "On the Hunting page, run the query, select the result rows, and select Add bookmark.", fr: "Dans la page Hunting, exécuter la requête, sélectionner les lignes de résultats et sélectionner Add bookmark." } }
    - { id: c, text: { en: "On the Analytics page, create a scheduled query rule.", fr: "Dans la page Analytics, créer une règle de requête planifiée." } }
    - { id: d, text: { en: "In Advanced hunting, save the query under Shared queries.", fr: "Dans Advanced hunting, enregistrer la requête sous Shared queries." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      A custom hunting query is created from Microsoft Sentinel > Threat management > Hunting, on the Queries tab, by selecting New query. The form includes the query, the entity mappings and the MITRE ATT&CK tactic, technique and sub-technique. A hunting query runs only when analysts run it and never raises alerts by itself.
    fr: |
      Une requête de chasse personnalisée se crée depuis Microsoft Sentinel > Threat management > Hunting, sous l'onglet Queries, en sélectionnant New query. Le formulaire comprend la requête, les mappages d'entités et la tactique, la technique et la sous-technique MITRE ATT&CK. Une requête de chasse s'exécute uniquement lorsque les analystes la lancent et ne génère jamais d'alerte à elle seule.
  options:
    b: { en: "A bookmark keeps selected result rows and their source query as evidence; it doesn't add a query to the hunting queries list.", fr: "Un signet conserve des lignes de résultats sélectionnées et leur requête source comme preuves ; il n'ajoute pas de requête à la liste des requêtes de chasse." }
    c: { en: "A scheduled analytics rule runs on a schedule and generates alerts, which is not allowed.", fr: "Une règle d'analytique planifiée s'exécute selon une planification et génère des alertes, ce qui n'est pas autorisé." }
    d: { en: "Shared queries of advanced hunting aren't Sentinel hunting queries and don't appear on the Hunting page with MITRE ATT&CK mappings.", fr: "Les requêtes partagées du repérage avancé ne sont pas des requêtes de chasse Sentinel et n'apparaissent pas dans la page Hunting avec des mappages MITRE ATT&CK." }
references:
  - title: Create custom hunting queries in Microsoft Sentinel
    url: https://learn.microsoft.com/en-us/azure/sentinel/hunts-custom-queries
