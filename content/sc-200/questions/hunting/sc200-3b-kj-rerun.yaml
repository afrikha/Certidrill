id: sc200-3b-kj-rerun
objective: "3.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Proseware is onboarded to the Microsoft Sentinel data lake. A one-time KQL job named **IrScan01** completed yesterday. You discover that its query filtered on the wrong account name. The corrected query returns the same columns.

    You need the corrected results written to the same destination table as soon as possible. The solution must minimize administrative effort.

    What should you do?
  fr: |
    Proseware est intégré au data lake Microsoft Sentinel. Une tâche KQL ponctuelle nommée **IrScan01** s'est terminée hier. Vous découvrez que sa requête filtrait sur un mauvais nom de compte. La requête corrigée renvoie les mêmes colonnes.

    Les résultats corrigés doivent être écrits dans la même table de destination le plus tôt possible. La solution doit réduire au minimum l'effort d'administration.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Edit IrScan01, correct the query, and then submit the job.", fr: "Modifier IrScan01, corriger la requête, puis soumettre la tâche." } }
    - { id: b, text: { en: "Delete IrScan01, and then create a new job with the corrected query.", fr: "Supprimer IrScan01, puis créer une nouvelle tâche avec la requête corrigée." } }
    - { id: c, text: { en: "Disable IrScan01, and then enable it again.", fr: "Désactiver IrScan01, puis la réactiver." } }
    - { id: d, text: { en: "Run the corrected query as an async query in the KQL queries editor.", fr: "Exécuter la requête corrigée comme requête asynchrone dans l'éditeur KQL queries." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      You can edit the query of a KQL job as long as it returns the same output schema, and editing a one-time job immediately triggers its execution. The corrected results go to the same destination table with no new job to create.
    fr: |
      Vous pouvez modifier la requête d'une tâche KQL tant qu'elle renvoie le même schéma de sortie, et la modification d'une tâche ponctuelle déclenche immédiatement son exécution. Les résultats corrigés vont dans la même table de destination, sans nouvelle tâche à créer.
  options:
    b: { en: "Deleting and recreating the job works but takes more effort than editing it.", fr: "Supprimer et recréer la tâche fonctionne, mais demande plus d'effort que de la modifier." }
    c: { en: "Disabling and enabling the job doesn't change its query, so the wrong filter would remain.", fr: "Désactiver puis réactiver la tâche ne change pas sa requête : le mauvais filtre resterait." }
    d: { en: "An async query returns cached results to the editor; it doesn't write them to the destination table.", fr: "Une requête asynchrone renvoie des résultats mis en cache dans l'éditeur ; elle ne les écrit pas dans la table de destination." }
references:
  - title: Manage jobs in the Microsoft Sentinel data lake
    url: https://learn.microsoft.com/en-us/azure/sentinel/datalake/kql-manage-jobs
