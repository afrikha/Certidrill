id: sc200-3a-tbl-multi-click-then-connect
objective: "3.1.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam, Inc. uses Microsoft Defender XDR with Microsoft Defender for Office 365 (Safe Links enabled) and Microsoft Defender for Endpoint on all devices.

    A phishing message containing a link to `invoice-portal.example` reached several mailboxes. You need to build an advanced hunting query that identifies the users who clicked the link and the devices that then connected to the `invoice-portal.example` domain.

    Which two tables should you use? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam, Inc. utilise Microsoft Defender XDR avec Microsoft Defender for Office 365 (Liens fiables activés) et Microsoft Defender for Endpoint sur tous les appareils.

    Un message d'hameçonnage contenant un lien vers `invoice-portal.example` a atteint plusieurs boîtes aux lettres. Vous devez créer une requête de repérage avancé qui identifie les utilisateurs ayant cliqué sur le lien et les appareils qui se sont ensuite connectés au domaine `invoice-portal.example`.

    Quelles sont les deux tables à utiliser ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: EmailUrlInfo }
    - { id: b, text: UrlClickEvents }
    - { id: c, text: EmailPostDeliveryEvents }
    - { id: d, text: DeviceNetworkEvents }
    - { id: e, text: DeviceRegistryEvents }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: UrlClickEvents records the Safe Links clicks with the AccountUpn of the user and the Url clicked. DeviceNetworkEvents records the network connections of the devices, and its RemoteUrl column shows the domain each device connected to.
    fr: UrlClickEvents enregistre les clics Liens fiables (Safe Links) avec l'AccountUpn de l'utilisateur et l'Url cliquée. DeviceNetworkEvents enregistre les connexions réseau des appareils, et sa colonne RemoteUrl indique le domaine auquel chaque appareil s'est connecté.
  options:
    a: { en: "EmailUrlInfo lists the URLs contained in the messages, but not who clicked them.", fr: "EmailUrlInfo liste les URL contenues dans les messages, mais pas qui a cliqué dessus." }
    c: { en: "EmailPostDeliveryEvents records actions taken on messages after delivery, such as ZAP, not clicks or connections.", fr: "EmailPostDeliveryEvents enregistre les actions effectuées sur les messages après la remise, comme ZAP, pas les clics ni les connexions." }
    e: { en: "DeviceRegistryEvents records registry changes, not network connections.", fr: "DeviceRegistryEvents enregistre les modifications du registre, pas les connexions réseau." }
references:
  - title: UrlClickEvents table in the advanced hunting schema
    url: https://learn.microsoft.com/en-us/defender-xdr/advanced-hunting-urlclickevents-table
  - title: DeviceNetworkEvents table in the advanced hunting schema
    url: https://learn.microsoft.com/en-us/defender-xdr/advanced-hunting-devicenetworkevents-table
