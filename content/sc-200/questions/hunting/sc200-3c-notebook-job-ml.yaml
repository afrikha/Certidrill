id: sc200-3c-notebook-job-ml
objective: "3.2.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Litware has onboarded Microsoft Sentinel to the data lake. The lake contains six months of **DeviceNetworkEvents** data.

    A threat hunter wrote PySpark code that builds a baseline of outbound connections per device from the six months of data and writes the result to a lake-tier table. The code must run every Sunday without user interaction. The solution must minimize administrative effort.

    What should you use?
  fr: |
    Litware a intégré Microsoft Sentinel au data lake. Le lake contient six mois de données **DeviceNetworkEvents**.

    Un chasseur de menaces a écrit du code PySpark qui construit une base de référence des connexions sortantes par appareil à partir des six mois de données et écrit le résultat dans une table du niveau lake. Le code doit s'exécuter chaque dimanche sans intervention d'un utilisateur. La solution doit réduire au minimum l'effort d'administration.

    Que devez-vous utiliser ?
body:
  options:
    - { id: a, text: { en: "A GitHub Copilot agent in Visual Studio Code that calls the query_lake tool of the Sentinel MCP server", fr: "Un agent GitHub Copilot dans Visual Studio Code qui appelle l'outil query_lake du serveur MCP Sentinel" } }
    - { id: b, text: { en: "A summary rule with a 1,440-minute bin that aggregates DeviceNetworkEvents", fr: "Une règle de synthèse avec un intervalle de 1 440 minutes qui agrège DeviceNetworkEvents" } }
    - { id: c, text: { en: "A hunting query marked as a favorite on the Hunting page of Microsoft Sentinel", fr: "Une requête de chasse marquée comme favorite dans la page Hunting de Microsoft Sentinel" } }
    - { id: d, text: { en: "A notebook job scheduled from the Microsoft Sentinel extension in Visual Studio Code", fr: "Une tâche de notebook planifiée depuis l'extension Microsoft Sentinel dans Visual Studio Code" } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      A notebook job runs a data lake notebook on a schedule on the managed Spark pools, without anyone opening Visual Studio Code, and writes its results to lake-tier or analytics-tier custom tables. A notebook job can run for up to eight hours, which suits a weekly baseline over six months of data.
    fr: |
      Une tâche de notebook exécute un notebook du data lake selon une planification sur les pools Spark managés, sans que personne n'ouvre Visual Studio Code, et écrit ses résultats dans des tables personnalisées du niveau lake ou du niveau Analytics. Une tâche de notebook peut s'exécuter jusqu'à huit heures, ce qui convient à une base de référence hebdomadaire sur six mois de données.
  options:
    a: { en: "query_lake runs a single KQL query for focused retrieval, not scheduled PySpark processing or bulk export.", fr: "query_lake exécute une seule requête KQL pour une récupération ciblée, pas un traitement PySpark planifié ni une exportation massive." }
    b: { en: "A summary rule runs KQL, not PySpark, and it processes only recent bins, never six months of history.", fr: "Une règle de synthèse exécute du KQL, pas du PySpark, et ne traite que des intervalles récents, jamais six mois d'historique." }
    c: { en: "A favorite hunting query runs only when someone opens the Hunting page, and it runs KQL on the analytics tier.", fr: "Une requête de chasse favorite ne s'exécute que lorsque quelqu'un ouvre la page Hunting, et elle exécute du KQL sur le niveau Analytics." }
references:
  - title: Run notebooks on the Microsoft Sentinel data lake
    url: https://learn.microsoft.com/en-us/azure/sentinel/datalake/notebooks
