id: sc200-3b-kj-roles
objective: "3.2.2"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    Fabrikam is onboarded to the Microsoft Sentinel data lake. A Log Analytics workspace named **SOC-WS** is the tenant's Microsoft Sentinel workspace.

    An analyst named **Analyst4** has the Security Reader role in Microsoft Entra ID. Analyst4 must create a scheduled KQL job that writes its results to a new table in the analytics tier of SOC-WS. No other job has created a table in SOC-WS. The solution must follow the principle of least privilege.

    Which two role assignments should you make? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam est intégré au data lake Microsoft Sentinel. Un espace de travail Log Analytics nommé **SOC-WS** est l'espace de travail Microsoft Sentinel du locataire.

    Un analyste nommé **Analyst4** dispose du rôle Security Reader dans Microsoft Entra ID. Analyst4 doit créer une tâche KQL planifiée qui écrit ses résultats dans une nouvelle table du niveau Analytics de SOC-WS. Aucune autre tâche n'a créé de table dans SOC-WS. La solution doit respecter le principe du moindre privilège.

    Quelles sont les deux attributions de rôles à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "The Security Operator role in Microsoft Entra ID to Analyst4", fr: "Le rôle Security Operator dans Microsoft Entra ID à Analyst4" } }
    - { id: b, text: { en: "The Global Administrator role in Microsoft Entra ID to Analyst4", fr: "Le rôle Global Administrator dans Microsoft Entra ID à Analyst4" } }
    - { id: c, text: { en: "The Log Analytics Contributor role on SOC-WS to the msg-resources-<guid> managed identity", fr: "Le rôle Log Analytics Contributor sur SOC-WS à l'identité managée msg-resources-<guid>" } }
    - { id: d, text: { en: "The Microsoft Sentinel Reader role on SOC-WS to the msg-resources-<guid> managed identity", fr: "Le rôle Microsoft Sentinel Reader sur SOC-WS à l'identité managée msg-resources-<guid>" } }
    - { id: e, text: { en: "The Log Analytics Reader role on SOC-WS to Analyst4", fr: "Le rôle Log Analytics Reader sur SOC-WS à Analyst4" } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |
      Writing to the analytics tier and scheduling KQL jobs requires one of the Microsoft Entra roles Security Operator, Security Administrator or Global Administrator; Security Reader only reads. To create new custom tables in the analytics tier, the data lake managed identity msg-resources-<guid> also needs Log Analytics Contributor on the workspace.
    fr: |
      Écrire au niveau Analytics et planifier des tâches KQL exige l'un des rôles Microsoft Entra Security Operator, Security Administrator ou Global Administrator ; Security Reader permet seulement la lecture. Pour créer de nouvelles tables personnalisées au niveau Analytics, l'identité managée du data lake msg-resources-<guid> a aussi besoin du rôle Log Analytics Contributor sur l'espace de travail.
  options:
    b: { en: "Global Administrator also allows it but grants far more than Security Operator.", fr: "Global Administrator le permet aussi, mais accorde beaucoup plus que Security Operator." }
    d: { en: "A reader role doesn't let the managed identity create tables in the workspace.", fr: "Un rôle de lecteur ne permet pas à l'identité managée de créer des tables dans l'espace de travail." }
    e: { en: "Log Analytics Reader gives read access to the workspace; it doesn't allow writing to the analytics tier or scheduling jobs.", fr: "Log Analytics Reader donne un accès en lecture à l'espace de travail ; il ne permet ni d'écrire au niveau Analytics ni de planifier des tâches." }
references:
  - title: Create KQL jobs in the Microsoft Sentinel data lake
    url: https://learn.microsoft.com/en-us/azure/sentinel/datalake/kql-jobs
  - title: Roles and permissions in the Microsoft Sentinel platform
    url: https://learn.microsoft.com/en-us/azure/sentinel/roles
