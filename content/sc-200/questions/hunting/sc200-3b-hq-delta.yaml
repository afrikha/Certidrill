id: sc200-3b-hq-delta
objective: "3.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Litware analysts run all the hunting queries of their Microsoft Sentinel workspace every morning.

    You need to identify the queries whose number of results increased the most, in proportion to their previous volume, during the last 24 hours compared with the previous 24 to 48 hours.

    Which column should you sort on?
  fr: |
    Chaque matin, les analystes de Litware exécutent toutes les requêtes de chasse de leur espace de travail Microsoft Sentinel.

    Vous devez identifier les requêtes dont le nombre de résultats a le plus augmenté, proportionnellement à leur volume précédent, au cours des dernières 24 heures par rapport aux 24 à 48 heures précédentes.

    Sur quelle colonne devez-vous trier ?
body:
  options:
    - { id: a, text: Results }
    - { id: b, text: Results delta }
    - { id: c, text: Results delta percentage }
    - { id: d, text: Techniques }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Results delta and Results delta percentage compare the last 24 hours with the previous 24 to 48 hours. Results delta percentage is the relative change, which shows the biggest increases in proportion to each query's previous volume.
    fr: |
      Results delta et Results delta percentage comparent les dernières 24 heures aux 24 à 48 heures précédentes. Results delta percentage est la variation relative, qui fait ressortir les plus fortes hausses proportionnellement au volume précédent de chaque requête.
  options:
    a: { en: "Results shows the number of matches of the last run, without any comparison.", fr: "Results affiche le nombre de correspondances de la dernière exécution, sans comparaison." }
    b: { en: "Results delta is the absolute difference, which favors queries that already return many rows.", fr: "Results delta est la différence absolue, qui favorise les requêtes qui renvoient déjà beaucoup de lignes." }
    d: { en: "Techniques shows the MITRE ATT&CK techniques mapped to each query.", fr: "Techniques affiche les techniques MITRE ATT&CK mappées à chaque requête." }
references:
  - title: Threat hunting in Microsoft Sentinel
    url: https://learn.microsoft.com/en-us/azure/sentinel/hunting
