id: sc200-3c-mcp-entity-role
objective: "3.2.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Woodgrove Bank has onboarded Microsoft Sentinel to the data lake and uses Microsoft Security Copilot. An analyst named **Analyst1** has the Security Reader role in Microsoft Entra ID.

    Analyst1 connected Visual Studio Code to the data exploration collection of the Microsoft Sentinel MCP server. The `search_tables` and `query_lake` tools work, but the `analyze_user_entity` tool fails with an authorization error.

    You need Analyst1 to be able to use `analyze_user_entity`. The solution must follow the principle of least privilege.

    Which role should you assign to Analyst1?
  fr: |
    Woodgrove Bank a intégré Microsoft Sentinel au data lake et utilise Microsoft Security Copilot. Un analyste nommé **Analyst1** dispose du rôle Security Reader dans Microsoft Entra ID.

    Analyst1 a connecté Visual Studio Code à la collection d'exploration des données du serveur MCP Microsoft Sentinel. Les outils `search_tables` et `query_lake` fonctionnent, mais l'outil `analyze_user_entity` échoue avec une erreur d'autorisation.

    Vous devez permettre à Analyst1 d'utiliser `analyze_user_entity`. La solution doit respecter le principe du moindre privilège.

    Quel rôle devez-vous attribuer à Analyst1 ?
body:
  options:
    - { id: a, text: Security Copilot Owner }
    - { id: b, text: Security Operator }
    - { id: c, text: Security Copilot Contributor }
    - { id: d, text: Security Administrator }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Security Reader is enough to list and call the MCP tools, but the entity analyzer tools use Security Copilot and require the Security Copilot Contributor role; each analysis consumes Security Compute Units (SCUs). This is the smallest role that unlocks analyze_user_entity.
    fr: |
      Security Reader suffit pour lister et appeler les outils MCP, mais les outils d'analyse d'entités utilisent Security Copilot et exigent le rôle Security Copilot Contributor ; chaque analyse consomme des unités de calcul de sécurité (SCU). C'est le plus petit rôle qui débloque analyze_user_entity.
  options:
    a: { en: "Security Copilot Owner is needed only to view and monitor SCU usage; it grants more than required.", fr: "Security Copilot Owner n'est nécessaire que pour consulter et surveiller la consommation de SCU ; il accorde plus que nécessaire." }
    b: { en: "Security Operator gives access to the MCP tools, like Security Reader, but it isn't the role that the entity analyzer requires.", fr: "Security Operator donne accès aux outils MCP, comme Security Reader, mais ce n'est pas le rôle exigé par l'analyseur d'entités." }
    d: { en: "Security Administrator is a broad Microsoft Entra role that grants far more than the entity analyzer needs.", fr: "Security Administrator est un rôle Microsoft Entra étendu qui accorde bien plus que ce dont l'analyseur d'entités a besoin." }
references:
  - title: Data exploration tool collection in Microsoft Sentinel MCP server
    url: https://learn.microsoft.com/en-us/azure/sentinel/datalake/sentinel-mcp-data-exploration-tool
