id: sc200-3c-mcp-required-tables
objective: "3.2.4"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    Adatum has onboarded Microsoft Sentinel to the data lake. The lake contains the following tables: **SigninLogs**, **AlertEvidence**, **AADNonInteractiveUserSignInLogs**, **AuditLogs** and **DeviceLogonEvents**.

    An analyst who has the required roles calls the `analyze_user_entity` tool of the Microsoft Sentinel MCP server for a Microsoft Entra user. The tool returns an error that lists the tables it needs and that are missing.

    You need `analyze_user_entity` to run. Which two tables should you make available in the data lake?

    Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum a intégré Microsoft Sentinel au data lake. Le lake contient les tables suivantes : **SigninLogs**, **AlertEvidence**, **AADNonInteractiveUserSignInLogs**, **AuditLogs** et **DeviceLogonEvents**.

    Un analyste qui dispose des rôles requis appelle l'outil `analyze_user_entity` du serveur MCP Microsoft Sentinel pour un utilisateur Microsoft Entra. L'outil renvoie une erreur qui liste les tables dont il a besoin et qui manquent.

    Vous devez permettre l'exécution d'`analyze_user_entity`. Quelles sont les deux tables que vous devez rendre disponibles dans le data lake ?

    Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: BehaviorAnalytics }
    - { id: b, text: CloudAppEvents }
    - { id: c, text: AADUserRiskEvents }
    - { id: d, text: EmailUrlInfo }
    - { id: e, text: IdentityInfo }
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: |
      analyze_user_entity requires the AlertEvidence, SigninLogs, CloudAppEvents and IdentityInfo tables; if any of them is missing, it returns an error that lists them. The lake already has SigninLogs and AlertEvidence, so CloudAppEvents and IdentityInfo are missing. IdentityInfo requires Defender for Identity, Defender for Cloud Apps or Defender for Endpoint P2 licensing.
    fr: |
      analyze_user_entity exige les tables AlertEvidence, SigninLogs, CloudAppEvents et IdentityInfo ; s'il en manque une, il renvoie une erreur qui les liste. Le lake contient déjà SigninLogs et AlertEvidence : ce sont donc CloudAppEvents et IdentityInfo qui manquent. IdentityInfo exige une licence Defender for Identity, Defender for Cloud Apps ou Defender for Endpoint P2.
  options:
    a: { en: "BehaviorAnalytics is optional for the tool, which still runs without it.", fr: "BehaviorAnalytics est facultative pour l'outil, qui s'exécute quand même sans elle." }
    c: { en: "AADUserRiskEvents isn't one of the tables that analyze_user_entity requires.", fr: "AADUserRiskEvents ne fait pas partie des tables exigées par analyze_user_entity." }
    d: { en: "EmailUrlInfo is used by analyze_url_entity, not by the user analysis.", fr: "EmailUrlInfo est utilisée par analyze_url_entity, pas par l'analyse des utilisateurs." }
references:
  - title: Data exploration tool collection in Microsoft Sentinel MCP server
    url: https://learn.microsoft.com/en-us/azure/sentinel/datalake/sentinel-mcp-data-exploration-tool
