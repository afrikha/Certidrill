id: sc200-3a-tbl-zap-removed
objective: "3.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Northwind Traders uses Microsoft Defender for Office 365 in Microsoft Defender XDR.

    Users report that messages disappeared from their inboxes a few hours after delivery. You suspect that zero-hour auto purge (ZAP) removed them. You need to write an advanced hunting query that lists the messages on which ZAP acted after delivery, with the result of the action.

    Which table should you query?
  fr: |
    Northwind Traders utilise Microsoft Defender for Office 365 dans Microsoft Defender XDR.

    Des utilisateurs signalent que des messages ont disparu de leur boîte de réception quelques heures après leur remise. Vous soupçonnez que la purge automatique de zéro heure (ZAP) les a supprimés. Vous devez écrire une requête de repérage avancé qui liste les messages sur lesquels ZAP a agi après la remise, avec le résultat de l'action.

    Quelle table devez-vous interroger ?
body:
  options:
    - { id: a, text: EmailEvents }
    - { id: b, text: UrlClickEvents }
    - { id: c, text: CloudAppEvents }
    - { id: d, text: EmailPostDeliveryEvents }
answer: { optionId: d }
explanation:
  correct:
    en: EmailPostDeliveryEvents contains the actions taken on messages after delivery to the mailbox. Its ActionType column shows Phish ZAP, Malware ZAP or Manual remediation, ActionTrigger shows what triggered the action, and ActionResult its result.
    fr: EmailPostDeliveryEvents contient les actions effectuées sur les messages après leur remise dans la boîte aux lettres. Sa colonne ActionType indique Phish ZAP, Malware ZAP ou Manual remediation, ActionTrigger ce qui a déclenché l'action et ActionResult son résultat.
  options:
    a: { en: "EmailEvents records the delivery and blocking events at the time the message is processed, not the actions taken after delivery.", fr: "EmailEvents enregistre les événements de remise et de blocage au moment du traitement du message, pas les actions effectuées après la remise." }
    b: { en: "UrlClickEvents records Safe Links clicks, not the removal of messages.", fr: "UrlClickEvents enregistre les clics Liens fiables (Safe Links), pas la suppression de messages." }
    c: { en: "CloudAppEvents records user and admin activities in cloud apps, not the ZAP actions with their trigger and result.", fr: "CloudAppEvents enregistre les activités des utilisateurs et des administrateurs dans les applications cloud, pas les actions ZAP avec leur déclencheur et leur résultat." }
references:
  - title: EmailPostDeliveryEvents table in the advanced hunting schema
    url: https://learn.microsoft.com/en-us/defender-xdr/advanced-hunting-emailpostdeliveryevents-table
