id: sc200-3c-summary-bin-size
objective: "3.2.3"
type: single
difficulty: 1
status: draft
shuffle: false
stem:
  en: |
    Woodgrove Bank has a Microsoft Sentinel workspace named **WG-SOC**. The workspace contains a custom table named **DnsQueries_CL** that uses the Auxiliary plan and receives several hundred gigabytes per day.

    You plan to create a summary rule that aggregates DnsQueries_CL into a custom table queried by an analytics rule. The summary table must be refreshed as often as possible.

    What is the smallest value that you can set for **Run summary every** (bin size)?
  fr: |
    Woodgrove Bank dispose d'un espace de travail Microsoft Sentinel nommé **WG-SOC**. L'espace de travail contient une table personnalisée nommée **DnsQueries_CL** qui utilise le plan Auxiliary et reçoit plusieurs centaines de gigaoctets par jour.

    Vous prévoyez de créer une règle de synthèse qui agrège DnsQueries_CL dans une table personnalisée interrogée par une règle d'analytique. La table de synthèse doit être actualisée le plus souvent possible.

    Quelle est la plus petite valeur que vous pouvez définir pour **Run summary every** (taille d'intervalle) ?
body:
  options:
    - { id: a, text: { en: "5 minutes", fr: "5 minutes" } }
    - { id: b, text: { en: "15 minutes", fr: "15 minutes" } }
    - { id: c, text: { en: "20 minutes", fr: "20 minutes" } }
    - { id: d, text: { en: "30 minutes", fr: "30 minutes" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      The bin size of a summary rule accepts only 20, 30, 60, 120, 180, 360, 720 or 1,440 minutes, so 20 minutes is the most frequent schedule. The rule then aggregates each 20-minute window of DnsQueries_CL and writes the result to an Analytics-plan custom table.
    fr: |
      La taille d'intervalle d'une règle de synthèse n'accepte que 20, 30, 60, 120, 180, 360, 720 ou 1 440 minutes ; 20 minutes est donc la planification la plus fréquente. La règle agrège alors chaque fenêtre de 20 minutes de DnsQueries_CL et écrit le résultat dans une table personnalisée du plan Analytics.
  options:
    a: { en: "5 minutes isn't an allowed bin size; the smallest bin is 20 minutes.", fr: "5 minutes n'est pas une taille d'intervalle autorisée ; le plus petit intervalle est de 20 minutes." }
    b: { en: "15 minutes isn't in the list of allowed bin sizes, which starts at 20 minutes.", fr: "15 minutes ne fait pas partie des tailles d'intervalle autorisées, qui commencent à 20 minutes." }
    d: { en: "30 minutes is allowed, but 20 minutes is also allowed and runs more often.", fr: "30 minutes est autorisé, mais 20 minutes l'est aussi et s'exécute plus souvent." }
references:
  - title: Aggregate data in a Log Analytics workspace by using summary rules
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/logs/summary-rules
