id: sc200-3b-sg-gql-query
objective: "3.1.6"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    Adatum published a custom graph of Microsoft Entra group memberships to Microsoft Sentinel graph. The graph contains **EntraGroup** nodes connected by membership edges.

    You need a query for the Microsoft Sentinel graph query editor that returns the groups nested up to eight levels below the group **Tier0-Admins**. The query must return at most 100 matches.

    How should you complete the query? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum a publié dans Microsoft Sentinel graph un graphe personnalisé des appartenances aux groupes Microsoft Entra. Le graphe contient des nœuds **EntraGroup** reliés par des arêtes d'appartenance.

    Vous avez besoin d'une requête pour l'éditeur de requêtes de Microsoft Sentinel graph qui renvoie les groupes imbriqués jusqu'à huit niveaux sous le groupe **Tier0-Admins**. La requête doit renvoyer au plus 100 correspondances.

    Comment devez-vous compléter la requête ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  template: |
    [[m]] p=(g1:EntraGroup)-[cg]->{1,8}(g2)
    WHERE g1.displayName = 'Tier0-Admins'
    [[r]] *
    [[l]] 100
  slots:
    - id: m
      options:
        - { id: match, text: MATCH }
        - { id: gm, text: graph-match }
        - { id: mg, text: make-graph }
    - id: r
      options:
        - { id: ret, text: RETURN }
        - { id: proj, text: project }
        - { id: ext, text: extend }
    - id: l
      options:
        - { id: lim, text: LIMIT }
        - { id: take, text: take }
        - { id: top, text: top }
answer:
  values: { m: match, r: ret, l: lim }
explanation:
  correct:
    en: |
      Microsoft Sentinel graph is queried with Graph Query Language (GQL), not KQL. A GQL query starts with a MATCH pattern, here a variable-length edge {1,8} from the Tier0-Admins group, filters with WHERE, returns the matches with RETURN and caps them with LIMIT.
    fr: |
      Microsoft Sentinel graph s'interroge en langage GQL (Graph Query Language), pas en KQL. Une requête GQL commence par un modèle MATCH, ici une arête de longueur variable {1,8} depuis le groupe Tier0-Admins, filtre avec WHERE, renvoie les correspondances avec RETURN et les limite avec LIMIT.
  options:
    gm: { en: "graph-match is a KQL operator that runs on a graph built with make-graph in a KQL query.", fr: "graph-match est un opérateur KQL qui s'exécute sur un graphe créé avec make-graph dans une requête KQL." }
    mg: { en: "make-graph is a KQL operator that builds a transient graph from tables; it isn't GQL.", fr: "make-graph est un opérateur KQL qui crée un graphe transitoire à partir de tables ; ce n'est pas du GQL." }
    proj: { en: "project is the KQL operator that selects columns; GQL uses RETURN.", fr: "project est l'opérateur KQL de sélection de colonnes ; GQL utilise RETURN." }
    take: { en: "take limits rows in KQL; GQL uses LIMIT.", fr: "take limite les lignes en KQL ; GQL utilise LIMIT." }
references:
  - title: Get started with custom graphs in Microsoft Sentinel (preview)
    url: https://learn.microsoft.com/en-us/azure/sentinel/datalake/create-custom-graphs
  - title: Visualize graphs in Microsoft Sentinel (preview)
    url: https://learn.microsoft.com/en-us/azure/sentinel/datalake/graph-visualization
