id: sc200-3c-notebook-pool
objective: "3.2.4"
type: single
difficulty: 1
status: draft
shuffle: false
stem:
  en: |
    Fabrikam has onboarded Microsoft Sentinel to the data lake. A threat hunter uses Visual Studio Code with the Microsoft Sentinel extension to develop a new notebook that reads a few thousand rows of the **EntraGroups** table and applies simple filters.

    When the hunter runs the first cell, they must select the Microsoft Sentinel kernel and a pool size. The solution must minimize cost during development.

    Which pool size should the hunter select?
  fr: |
    Fabrikam a intégré Microsoft Sentinel au data lake. Un chasseur de menaces utilise Visual Studio Code avec l'extension Microsoft Sentinel pour développer un nouveau notebook qui lit quelques milliers de lignes de la table **EntraGroups** et applique des filtres simples.

    Quand le chasseur exécute la première cellule, il doit sélectionner le noyau Microsoft Sentinel et une taille de pool. La solution doit réduire au minimum le coût pendant le développement.

    Quelle taille de pool le chasseur doit-il sélectionner ?
body:
  options:
    - { id: a, text: Small }
    - { id: b, text: Medium }
    - { id: c, text: Large }
answer: { optionId: a }
explanation:
  correct:
    en: |
      The Small pool is recommended for development, testing and lightweight exploration with simple transformations, and it has the lowest cost, at the price of longer execution times. A few thousand rows with simple filters don't need more compute.
    fr: |
      Le pool Small est recommandé pour le développement, les tests et l'exploration légère avec des transformations simples, et c'est le moins coûteux, au prix de temps d'exécution plus longs. Quelques milliers de lignes avec des filtres simples ne demandent pas plus de calcul.
  options:
    b: { en: "Medium is meant for ETL with joins and aggregations or ML training; it costs more than needed here.", fr: "Medium est destiné à l'ETL avec jointures et agrégations ou à l'entraînement de ML ; il coûte plus que nécessaire ici." }
    c: { en: "Large is meant for deep learning, large joins and time-sensitive work; it is the most expensive pool.", fr: "Large est destiné au deep learning, aux grosses jointures et aux travaux urgents ; c'est le pool le plus coûteux." }
references:
  - title: Run notebooks on the Microsoft Sentinel data lake
    url: https://learn.microsoft.com/en-us/azure/sentinel/datalake/notebooks
