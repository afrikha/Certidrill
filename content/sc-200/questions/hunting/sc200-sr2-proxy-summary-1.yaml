id: sc200-sr2-proxy-summary-1
objective: "3.2.3"
type: series_yesno
series: sc200-sr2-proxy-summary
seriesOrder: 1
difficulty: 3
status: draft
stem:
  en: You create a summary rule that uses the lookup operator, with a bin size of 60 minutes.
  fr: Vous créez une règle de synthèse qui utilise l'opérateur lookup, avec une taille d'intervalle de 60 minutes.
body:
  solution:
    en: |
      In **Microsoft Sentinel > Configuration > Summary rules**, the engineer creates a summary rule with a bin size of **60 minutes**, a new destination table named **ProxyHourly_CL** and the following query:

      `ProxyLogs_CL | summarize Requests = count(), Bytes = sum(BytesSent) by UserName, DestinationDomain | lookup kind=leftouter HighRiskDomains_CL on $left.DestinationDomain == $right.Domain`
    fr: |
      Dans **Microsoft Sentinel > Configuration > Summary rules**, l'ingénieur crée une règle de synthèse avec une taille d'intervalle de **60 minutes**, une nouvelle table de destination nommée **ProxyHourly_CL** et la requête suivante :

      `ProxyLogs_CL | summarize Requests = count(), Bytes = sum(BytesSent) by UserName, DestinationDomain | lookup kind=leftouter HighRiskDomains_CL on $left.DestinationDomain == $right.Domain`
answer: { value: true }
explanation:
  correct:
    en: A summary rule on a Basic table can use all KQL operators on that single table and can look up as many as five Analytics tables, so the lookup to HighRiskDomains_CL is allowed. The 60-minute bin updates the ProxyHourly_CL table, which uses the Analytics plan, every hour, and the analytics rule queries this small table instead of ProxyLogs_CL.
    fr: Une règle de synthèse sur une table Basic peut utiliser tous les opérateurs KQL sur cette seule table et effectuer un lookup vers cinq tables Analytics au plus ; le lookup vers HighRiskDomains_CL est donc autorisé. L'intervalle de 60 minutes met à jour toutes les heures la table ProxyHourly_CL, qui utilise le plan Analytics, et la règle d'analytique interroge cette petite table au lieu de ProxyLogs_CL.
references:
  - title: Aggregate Data in a Log Analytics Workspace with Summary Rules
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/logs/summary-rules
  - title: Aggregate Microsoft Sentinel data with summary rules
    url: https://learn.microsoft.com/en-us/azure/sentinel/summary-rules
