id: sc200-3a-ta-hot-dashboard
objective: "3.1.4"
type: hotarea
difficulty: 3
status: draft
stem:
  en: |
    Adatum Corporation uses Microsoft Defender XDR with Microsoft Defender for Endpoint and Microsoft Defender Vulnerability Management. The threat analytics dashboard shows the following reports.

    Answer each prompt by selecting the appropriate report.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum Corporation utilise Microsoft Defender XDR avec Microsoft Defender for Endpoint et Microsoft Defender Vulnerability Management. Le tableau de bord de l'analytique des menaces affiche les rapports suivants.

    Répondez à chaque consigne en sélectionnant le rapport approprié.

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
    - id: p1
      text: { en: "The threat that is active in the environment now and must be investigated first", fr: "La menace active dans l'environnement en ce moment, à examiner en premier" }
    - id: p2
      text: { en: "The threat that hasn't attacked the organization yet but against which the most security updates must be deployed", fr: "La menace qui n'a pas encore attaqué l'organisation mais contre laquelle le plus de mises à jour de sécurité doivent être déployées" }
  grid:
    header: [{ en: Threat, fr: Menace }, { en: Active alerts, fr: Alertes actives }, { en: Resolved alerts, fr: Alertes résolues }, { en: Vulnerable devices, fr: Appareils vulnérables }, { en: Misconfigured devices, fr: Appareils mal configurés }]
    rows:
      - [{ text: "LockFall ransomware", area: lockfall }, { text: "0" }, { text: "14" }, { text: "3" }, { text: "40" }]
      - [{ text: "InkTrap phishing kit", area: inktrap }, { text: "6" }, { text: "2" }, { text: Not available }, { text: "12" }]
      - [{ text: "WidgetServer remote code execution", area: widget }, { text: "0" }, { text: "0" }, { text: "85" }, { text: Not available }]
      - [{ text: "GhostLoader tool", area: ghost }, { text: "0" }, { text: "0" }, { text: "10" }, { text: "25" }]
answer:
  values: { p1: inktrap, p2: widget }
explanation:
  correct:
    en: Active alerts show that a threat is in the tenant now, so InkTrap, the only report with active alerts, comes first; its related incidents are the starting point. WidgetServer has no alerts but 85 devices running software affected by its linked vulnerabilities, the highest exposure; the response is to deploy the security updates listed in Endpoints exposure. LockFall's alerts are all resolved, and GhostLoader has fewer vulnerable devices.
    fr: |
      Les alertes actives indiquent qu'une menace est présente dans le locataire en ce moment : InkTrap, le seul rapport avec des alertes actives, passe donc en premier ; ses incidents associés sont le point de départ. WidgetServer n'a aucune alerte mais 85 appareils exécutent des logiciels touchés par ses vulnérabilités liées, soit l'exposition la plus forte ; la réponse consiste à déployer les mises à jour de sécurité listées dans Endpoints exposure. Les alertes de LockFall sont toutes résolues, et GhostLoader a moins d'appareils vulnérables.
references:
  - title: Threat analytics in Microsoft Defender
    url: https://learn.microsoft.com/en-us/defender-xdr/threat-analytics
