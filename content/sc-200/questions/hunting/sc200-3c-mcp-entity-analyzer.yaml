id: sc200-3c-mcp-entity-analyzer
objective: "3.2.4"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Contoso has onboarded Microsoft Sentinel to the data lake and uses Microsoft Security Copilot. A threat hunter uses GitHub Copilot in Visual Studio Code, connected to the data exploration collection of the Microsoft Sentinel MCP server, to investigate whether users flagged by a password spray alert are compromised.

    The hunter plans to use the `analyze_user_entity` tool.

    Which two statements about `analyze_user_entity` are true?

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso a intégré Microsoft Sentinel au data lake et utilise Microsoft Security Copilot. Un chasseur de menaces utilise GitHub Copilot dans Visual Studio Code, connecté à la collection d'exploration des données du serveur MCP Microsoft Sentinel, pour déterminer si des utilisateurs signalés par une alerte de pulvérisation de mots de passe sont compromis.

    Le chasseur prévoit d'utiliser l'outil `analyze_user_entity`.

    Quelles sont les deux affirmations vraies concernant `analyze_user_entity` ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "It analyzes on-premises Active Directory users that aren't synchronized to Microsoft Entra ID.", fr: "Il analyse les utilisateurs Active Directory locaux qui ne sont pas synchronisés avec Microsoft Entra ID." } }
    - { id: b, text: { en: "It returns the verdict for the user in the response to the same call.", fr: "Il renvoie le verdict sur l'utilisateur dans la réponse au même appel." } }
    - { id: c, text: { en: "Its analysis window, from start time to end time, can't exceed seven days.", fr: "Sa fenêtre d'analyse, de l'heure de début à l'heure de fin, ne peut pas dépasser sept jours." } }
    - { id: d, text: { en: "Each analysis consumes Security Compute Units (SCUs).", fr: "Chaque analyse consomme des unités de calcul de sécurité (SCU)." } }
    - { id: e, text: { en: "It runs for an account that has only the Security Reader role.", fr: "Il s'exécute pour un compte qui ne dispose que du rôle Security Reader." } }
answer: { optionIds: [ c, d ] }
explanation:
  correct:
    en: |
      analyze_user_entity accepts a maximum analysis window of seven days. It relies on Security Copilot, so it requires the Security Copilot Contributor role and consumes SCUs. The tool starts an analysis and returns an identifier; you retrieve the verdict with get_entity_analysis.
    fr: |
      analyze_user_entity accepte une fenêtre d'analyse de sept jours au maximum. Il s'appuie sur Security Copilot : il exige le rôle Security Copilot Contributor et consomme des SCU. L'outil démarre une analyse et renvoie un identifiant ; vous récupérez le verdict avec get_entity_analysis.
  options:
    a: { en: "The tool supports only Microsoft Entra users; on-premises AD-only users aren't supported.", fr: "L'outil ne prend en charge que les utilisateurs Microsoft Entra ; les utilisateurs uniquement AD locaux ne sont pas pris en charge." }
    b: { en: "It returns an analysis identifier; get_entity_analysis then retrieves the results, possibly after several calls.", fr: "Il renvoie un identifiant d'analyse ; get_entity_analysis récupère ensuite les résultats, parfois après plusieurs appels." }
    e: { en: "Security Reader lets you call the MCP tools, but the entity analyzer also requires Security Copilot Contributor.", fr: "Security Reader permet d'appeler les outils MCP, mais l'analyseur d'entités exige aussi Security Copilot Contributor." }
references:
  - title: Data exploration tool collection in Microsoft Sentinel MCP server
    url: https://learn.microsoft.com/en-us/azure/sentinel/datalake/sentinel-mcp-data-exploration-tool
