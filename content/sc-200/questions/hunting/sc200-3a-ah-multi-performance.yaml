id: sc200-3a-ah-multi-performance
objective: "3.1.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Wingtip Toys uses Microsoft Defender for Endpoint. The following advanced hunting query often shows a **High** resource usage:

    ```kusto
    DeviceProcessEvents
    | extend Cmd = tolower(ProcessCommandLine)
    | where Cmd contains "certutil"
    | where Timestamp > ago(7d)
    | project Timestamp, DeviceName, AccountName, ProcessCommandLine
    ```

    The query must return the command lines of the last seven days in which certutil appears as a whole word. You need to reduce the resources that the query consumes.

    Which two changes should you make? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Wingtip Toys utilise Microsoft Defender for Endpoint. La requête de repérage avancé suivante affiche souvent une utilisation des ressources **High** :

    ```kusto
    DeviceProcessEvents
    | extend Cmd = tolower(ProcessCommandLine)
    | where Cmd contains "certutil"
    | where Timestamp > ago(7d)
    | project Timestamp, DeviceName, AccountName, ProcessCommandLine
    ```

    La requête doit renvoyer les lignes de commande des sept derniers jours dans lesquelles certutil apparaît comme mot entier. Vous devez réduire les ressources consommées par la requête.

    Quelles sont les deux modifications à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Move the Timestamp filter so that it runs immediately after the table name.", fr: "Déplacer le filtre sur Timestamp pour qu'il s'exécute juste après le nom de la table." } }
    - { id: b, text: { en: "Replace the extend and the contains filter with: where ProcessCommandLine has \"certutil\"", fr: "Remplacer l'extend et le filtre contains par : where ProcessCommandLine has \"certutil\"" } }
    - { id: c, text: { en: "Replace the table name and the filters with: search \"certutil\"", fr: "Remplacer le nom de la table et les filtres par : search \"certutil\"" } }
    - { id: d, text: { en: "Replace the contains filter with: where Cmd matches regex \"certutil\"", fr: "Remplacer le filtre contains par : where Cmd matches regex \"certutil\"" } }
    - { id: e, text: { en: "Replace the project statement with: project *", fr: "Remplacer l'instruction project par : project *" } }
answer: { optionIds: [ a, b ] }
explanation:
  correct:
    en: Filtering on time first reduces the rows before any other processing. Filtering directly on the ProcessCommandLine table column with has uses the term index and avoids computing tolower on every row; has is already case-insensitive and matches whole terms, as required.
    fr: Filtrer d'abord sur le temps réduit les lignes avant tout autre traitement. Filtrer directement sur la colonne de table ProcessCommandLine avec has utilise l'index des termes et évite de calculer tolower sur chaque ligne ; has ignore déjà la casse et correspond à des termes entiers, comme exigé.
  options:
    c: { en: "An unscoped search looks in every table and column, which consumes far more resources.", fr: "Un search sans étendue parcourt toutes les tables et colonnes, ce qui consomme beaucoup plus de ressources." }
    d: { en: "Regular expressions are more expensive than term or substring operators and should be kept for complex patterns.", fr: "Les expressions régulières coûtent plus cher que les opérateurs de termes ou de sous-chaînes et sont à réserver aux modèles complexes." }
    e: { en: "Returning every column increases the result size; best practice is to project only the columns you need.", fr: "Renvoyer toutes les colonnes augmente la taille des résultats ; la bonne pratique est de ne projeter que les colonnes nécessaires." }
references:
  - title: Advanced hunting query best practices
    url: https://learn.microsoft.com/en-us/defender-xdr/advanced-hunting-best-practices
