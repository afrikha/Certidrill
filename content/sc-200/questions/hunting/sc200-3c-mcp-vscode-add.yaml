id: sc200-3c-mcp-vscode-add
objective: "3.2.4"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    Wingtip Toys has onboarded Microsoft Sentinel to the data lake. A threat hunter who has the Security Reader and Security Copilot Contributor roles uses GitHub Copilot chat in agent mode in Visual Studio Code.

    The hunter wants the agent to find the data lake tables that contain sign-in data, run KQL queries on them, and analyze suspicious URLs.

    How should the hunter add the Microsoft Sentinel MCP server in Visual Studio Code? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Wingtip Toys a intégré Microsoft Sentinel au data lake. Un chasseur de menaces qui dispose des rôles Security Reader et Security Copilot Contributor utilise la conversation GitHub Copilot en mode agent dans Visual Studio Code.

    Le chasseur veut que l'agent trouve les tables du data lake qui contiennent des données de connexion, exécute des requêtes KQL sur ces tables et analyse des URL suspectes.

    Comment le chasseur doit-il ajouter le serveur MCP Microsoft Sentinel dans Visual Studio Code ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      In the Command Palette, run [[cmd]].
      Select the server type [[transport]].
      Enter the server URL [[url]], and then enter a Server ID.
    fr: |
      Dans la palette de commandes, exécuter [[cmd]].
      Sélectionner le type de serveur [[transport]].
      Saisir l'URL du serveur [[url]], puis saisir un Server ID.
  slots:
    - id: cmd
      options:
        - { id: list, text: "MCP: List Servers" }
        - { id: add, text: "MCP: Add Server" }
        - { id: interp, text: "Python: Select Interpreter" }
        - { id: reload, text: "Developer: Reload Window" }
    - id: transport
      options:
        - { id: stdio, text: "Command (stdio)" }
        - { id: docker, text: "Docker Image" }
        - { id: http, text: "HTTP (HTTP or Server-Sent Events)" }
        - { id: npm, text: "NPM Package" }
    - id: url
      options:
        - { id: triage, text: "https://sentinel.microsoft.com/mcp/triage" }
        - { id: agent, text: "https://sentinel.microsoft.com/mcp/security-copilot-agent-creation" }
        - { id: explore, text: "https://sentinel.microsoft.com/mcp/data-exploration" }
answer:
  values: { cmd: add, transport: http, url: explore }
explanation:
  correct:
    en: |
      The Microsoft Sentinel MCP server is hosted by Microsoft, so you add it with MCP: Add Server and the HTTP (HTTP or Server-Sent Events) type, then enter the URL of a tool collection and a Server ID. The data exploration collection provides search_tables to find tables, query_lake to run KQL on the lake, and analyze_url_entity to analyze URLs.
    fr: |
      Le serveur MCP Microsoft Sentinel est hébergé par Microsoft : vous l'ajoutez avec MCP: Add Server et le type HTTP (HTTP or Server-Sent Events), puis vous saisissez l'URL d'une collection d'outils et un Server ID. La collection d'exploration des données fournit search_tables pour trouver les tables, query_lake pour exécuter du KQL sur le lake et analyze_url_entity pour analyser les URL.
  options:
    list: { en: "MCP: List Servers shows the servers already configured; it doesn't add one.", fr: "MCP: List Servers affiche les serveurs déjà configurés ; elle n'en ajoute pas." }
    stdio: { en: "Command (stdio) starts a local server process; the Sentinel MCP server is a remote HTTP endpoint.", fr: "Command (stdio) démarre un processus de serveur local ; le serveur MCP Sentinel est un point de terminaison HTTP distant." }
    triage: { en: "The triage collection focuses on incident triage and hunting; table search and URL analysis are data exploration tools.", fr: "La collection de triage est axée sur le triage des incidents et la chasse ; la recherche de tables et l'analyse d'URL sont des outils d'exploration des données." }
    agent: { en: "This collection helps create Security Copilot agents; it doesn't provide the lake exploration tools.", fr: "Cette collection aide à créer des agents Security Copilot ; elle ne fournit pas les outils d'exploration du lake." }
references:
  - title: Use a Microsoft Sentinel MCP tool in Visual Studio Code
    url: https://learn.microsoft.com/en-us/azure/sentinel/datalake/sentinel-mcp-use-tool-visual-studio-code
  - title: Data exploration tool collection in Microsoft Sentinel MCP server
    url: https://learn.microsoft.com/en-us/azure/sentinel/datalake/sentinel-mcp-data-exploration-tool
