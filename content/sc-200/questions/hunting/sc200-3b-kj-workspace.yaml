id: sc200-3b-kj-workspace
objective: "3.2.2"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    Adatum is onboarded to the Microsoft Sentinel data lake with two workspaces, **SOC-EU** and **SOC-US**. You create a KQL job, and both workspaces are listed in **Selected workspaces**.

    The job must count the failed sign-ins of each user per day over the last 90 days, by using only the SigninLogs table of SOC-EU.

    How should you complete the job query? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum est intégré au data lake Microsoft Sentinel avec deux espaces de travail, **SOC-EU** et **SOC-US**. Vous créez une tâche KQL, et les deux espaces de travail figurent dans **Selected workspaces**.

    La tâche doit compter les connexions échouées de chaque utilisateur par jour sur les 90 derniers jours, en utilisant uniquement la table SigninLogs de SOC-EU.

    Comment devez-vous compléter la requête de la tâche ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: kusto
  template: |
    [[ws]]("SOC-EU").SigninLogs
    | where TimeGenerated > [[start]]
    | where ResultType != "0"
    | summarize Failures = count() by UserPrincipalName, Day = [[b]]
  slots:
    - id: ws
      options:
        - { id: workspace, text: workspace }
        - { id: union, text: union }
        - { id: table, text: table }
        - { id: cluster, text: cluster }
    - id: start
      options:
        - { id: ago, text: ago(90d) }
        - { id: raw, text: 90d }
        - { id: dt, text: datetime(90d) }
    - id: b
      options:
        - { id: bin, text: "bin(TimeGenerated, 1d)" }
        - { id: binonly, text: bin(1d) }
        - { id: argmax, text: "arg_max(TimeGenerated, *)" }
answer:
  values: { ws: workspace, start: ago, b: bin }
explanation:
  correct:
    en: |
      When several workspaces are selected, same-named tables are combined with union() by default; workspace("SOC-EU").SigninLogs targets the table of one workspace. ago(90d) returns the time 90 days before now, and bin(TimeGenerated, 1d) groups the events into daily buckets in the summarize.
    fr: |
      Lorsque plusieurs espaces de travail sont sélectionnés, les tables de même nom sont combinées par défaut avec union() ; workspace("SOC-EU").SigninLogs cible la table d'un seul espace de travail. ago(90d) renvoie l'heure qu'il était il y a 90 jours, et bin(TimeGenerated, 1d) regroupe les événements par jour dans le summarize.
  options:
    union: { en: "union combines tables; it is applied by default and would include SOC-US.", fr: "union combine des tables ; il s'applique par défaut et inclurait SOC-US." }
    table: { en: "table() references a table by name in the current scope; it doesn't select a workspace.", fr: "table() référence une table par son nom dans l'étendue actuelle ; elle ne sélectionne pas d'espace de travail." }
    raw: { en: "A timespan can't be compared with a datetime column.", fr: "Une durée ne peut pas être comparée à une colonne de date." }
    dt: { en: "datetime() expects a date literal, not a timespan.", fr: "datetime() attend un littéral de date, pas une durée." }
    binonly: { en: "bin needs the value to round as its first argument.", fr: "bin a besoin de la valeur à arrondir comme premier argument." }
    argmax: { en: "arg_max is an aggregation function, not a grouping key for daily buckets.", fr: "arg_max est une fonction d'agrégation, pas une clé de regroupement par jour." }
references:
  - title: Run KQL queries against the Microsoft Sentinel data lake
    url: https://learn.microsoft.com/en-us/azure/sentinel/datalake/kql-queries
  - title: Create KQL jobs in the Microsoft Sentinel data lake
    url: https://learn.microsoft.com/en-us/azure/sentinel/datalake/kql-jobs
