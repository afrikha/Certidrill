id: sc200-3a-kql-mv-expand-ips
objective: "3.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Northwind Traders uses Microsoft Defender for Endpoint. A colleague wrote the following advanced hunting query:

    ```kusto
    DeviceNetworkEvents
    | where Timestamp > ago(1d) and RemoteIPType == "Public"
    | summarize RemoteIPs = make_set(RemoteIP) by DeviceId
    ```

    You need to correlate the result with a list of malicious IP addresses. To do so, you must first turn the result into one row per device and remote IP address.

    Which operator should you add at the end of the query?
  fr: |
    Northwind Traders utilise Microsoft Defender for Endpoint. Un collègue a écrit la requête de repérage avancé suivante :

    ```kusto
    DeviceNetworkEvents
    | where Timestamp > ago(1d) and RemoteIPType == "Public"
    | summarize RemoteIPs = make_set(RemoteIP) by DeviceId
    ```

    Vous devez corréler le résultat avec une liste d'adresses IP malveillantes. Pour cela, vous devez d'abord transformer le résultat en une ligne par appareil et par adresse IP distante.

    Quel opérateur devez-vous ajouter à la fin de la requête ?
body:
  options:
    - { id: a, text: "| mv-expand RemoteIPs" }
    - { id: b, text: "| extend RemoteIP = parse_json(RemoteIPs)" }
    - { id: c, text: "| summarize make_list(RemoteIPs) by DeviceId" }
    - { id: d, text: "| project-away RemoteIPs" }
answer: { optionId: a }
explanation:
  correct:
    en: mv-expand turns each element of a dynamic array into its own row and duplicates the other columns, here DeviceId. It is the opposite of make_set, which built the array.
    fr: mv-expand transforme chaque élément d'un tableau dynamique en ligne distincte et duplique les autres colonnes, ici DeviceId. C'est l'inverse de make_set, qui a construit le tableau.
  options:
    b: { en: "parse_json converts a string to a dynamic value; RemoteIPs is already dynamic, and the operator still returns one row per device.", fr: "parse_json convertit une chaîne en valeur dynamique ; RemoteIPs est déjà dynamique, et l'opérateur renvoie toujours une ligne par appareil." }
    c: { en: "make_list builds another array (an array of arrays), still one row per device.", fr: "make_list construit un autre tableau (un tableau de tableaux), toujours avec une ligne par appareil." }
    d: { en: "project-away removes the RemoteIPs column, so the IP addresses are lost.", fr: "project-away supprime la colonne RemoteIPs : les adresses IP sont perdues." }
references:
  - title: mv-expand operator
    url: https://learn.microsoft.com/en-us/kusto/query/mv-expand-operator
