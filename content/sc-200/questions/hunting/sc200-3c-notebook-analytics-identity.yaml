id: sc200-3c-notebook-analytics-identity
objective: "3.2.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Northwind Traders has onboarded Microsoft Sentinel to the data lake. The Sentinel workspace is named **NW-SOC**. A threat hunter runs a data lake notebook in Visual Studio Code that ends with the following cell.

    ```python
    data_provider.save_as_table(risky_hosts, "RiskyHosts_SPRK_CL", "NW-SOC")
    ```

    The cell fails while it creates the table. The same notebook successfully saves the data to a table named RiskyHosts_SPRK in the System tables database.

    You need the cell to succeed. What should you do?
  fr: |
    Northwind Traders a intégré Microsoft Sentinel au data lake. L'espace de travail Sentinel est nommé **NW-SOC**. Un chasseur de menaces exécute dans Visual Studio Code un notebook du data lake qui se termine par la cellule suivante.

    ```python
    data_provider.save_as_table(risky_hosts, "RiskyHosts_SPRK_CL", "NW-SOC")
    ```

    La cellule échoue lors de la création de la table. Le même notebook enregistre correctement les données dans une table nommée RiskyHosts_SPRK de la base de données System tables.

    Vous devez faire réussir la cellule. Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Assign the Log Analytics Contributor role on NW-SOC to the threat hunter", fr: "Attribuer le rôle Log Analytics Contributor sur NW-SOC au chasseur de menaces" } }
    - { id: b, text: { en: "Assign the Log Analytics Contributor role on NW-SOC to the msg-resources-<guid> managed identity", fr: "Attribuer le rôle Log Analytics Contributor sur NW-SOC à l'identité managée msg-resources-<guid>" } }
    - { id: c, text: { en: "Add write_options={\"mode\": \"overwrite\"} to the save_as_table call", fr: "Ajouter write_options={\"mode\": \"overwrite\"} à l'appel save_as_table" } }
    - { id: d, text: { en: "Assign the Microsoft Sentinel Contributor role on NW-SOC to the msg-resources-<guid> managed identity", fr: "Attribuer le rôle Microsoft Sentinel Contributor sur NW-SOC à l'identité managée msg-resources-<guid>" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      The _SPRK_CL suffix creates a custom table in the analytics tier of the workspace. Creating custom analytics-tier tables is done by the data lake managed identity, a system-assigned identity named msg-resources-<guid>, which needs the Log Analytics Contributor role on the Log Analytics workspace. Lake-tier tables (_SPRK) don't need this assignment, which explains why the second save works.
    fr: |
      Le suffixe _SPRK_CL crée une table personnalisée au niveau Analytics de l'espace de travail. La création de tables personnalisées du niveau Analytics est effectuée par l'identité managée du data lake, une identité affectée par le système nommée msg-resources-<guid>, qui a besoin du rôle Log Analytics Contributor sur l'espace de travail Log Analytics. Les tables du niveau lake (_SPRK) n'exigent pas cette attribution, ce qui explique que le second enregistrement fonctionne.
  options:
    a: { en: "The table is created by the data lake managed identity, not with the hunter's own permissions.", fr: "La table est créée par l'identité managée du data lake, pas avec les autorisations du chasseur lui-même." }
    c: { en: "Analytics-tier tables support only the append mode; overwrite is supported only in the lake tier.", fr: "Les tables du niveau Analytics ne prennent en charge que le mode append ; overwrite n'est pris en charge qu'au niveau lake." }
    d: { en: "Creating the table is a Log Analytics operation that requires Log Analytics Contributor, not a Microsoft Sentinel role.", fr: "Créer la table est une opération Log Analytics qui exige Log Analytics Contributor, pas un rôle Microsoft Sentinel." }
references:
  - title: Run notebooks on the Microsoft Sentinel data lake
    url: https://learn.microsoft.com/en-us/azure/sentinel/datalake/notebooks
  - title: Microsoft Sentinel Provider class reference
    url: https://learn.microsoft.com/en-us/azure/sentinel/datalake/sentinel-provider-class-reference
