id: sc200-3a-tbl-ldap-recon
objective: "3.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam, Inc. has an on-premises Active Directory domain. Microsoft Defender for Identity sensors are installed on all the domain controllers.

    During an investigation, you suspect that a compromised workstation is enumerating the members of privileged groups and the user accounts of the domain. You need to hunt for the queries against Active Directory objects that were sent from the workstation, including the type of query and the object that was queried.

    Which table should you query?
  fr: |
    Fabrikam, Inc. dispose d'un domaine Active Directory local. Des capteurs Microsoft Defender for Identity sont installés sur tous les contrôleurs de domaine.

    Au cours d'une investigation, vous soupçonnez qu'un poste de travail compromis énumère les membres des groupes privilégiés et les comptes d'utilisateur du domaine. Vous devez rechercher les requêtes vers des objets Active Directory envoyées depuis ce poste, avec le type de requête et l'objet interrogé.

    Quelle table devez-vous interroger ?
body:
  options:
    - { id: a, text: IdentityQueryEvents }
    - { id: b, text: IdentityLogonEvents }
    - { id: c, text: IdentityDirectoryEvents }
    - { id: d, text: DeviceNetworkEvents }
answer: { optionId: a }
explanation:
  correct:
    en: IdentityQueryEvents, populated by Defender for Identity, contains the queries performed against Active Directory objects such as users, groups, devices and domains. Its QueryType column (for example QueryGroup or EnumerateUsers) and QueryTarget column give the type of query and the object queried.
    fr: IdentityQueryEvents, alimentée par Defender for Identity, contient les requêtes effectuées sur des objets Active Directory comme les utilisateurs, les groupes, les appareils et les domaines. Ses colonnes QueryType (par exemple QueryGroup ou EnumerateUsers) et QueryTarget donnent le type de requête et l'objet interrogé.
  options:
    b: { en: "IdentityLogonEvents records authentication events (Kerberos, NTLM, LDAP sign-ins), not directory queries.", fr: "IdentityLogonEvents enregistre des événements d'authentification (connexions Kerberos, NTLM, LDAP), pas les requêtes d'annuaire." }
    c: { en: "IdentityDirectoryEvents records changes and system events on domain controllers, such as password changes or UPN changes, not the reconnaissance queries.", fr: "IdentityDirectoryEvents enregistre les modifications et les événements système sur les contrôleurs de domaine, comme les changements de mot de passe ou d'UPN, pas les requêtes de reconnaissance." }
    d: { en: "DeviceNetworkEvents shows network connections from the workstation, but not which Active Directory objects were queried.", fr: "DeviceNetworkEvents montre les connexions réseau du poste de travail, mais pas les objets Active Directory interrogés." }
references:
  - title: IdentityQueryEvents table in the advanced hunting schema
    url: https://learn.microsoft.com/en-us/defender-xdr/advanced-hunting-identityqueryevents-table
