id: sc200-3c-summary-template-order
objective: "3.2.3"
type: ordering
difficulty: 1
status: draft
stem:
  en: |
    Wingtip Toys has a Microsoft Sentinel workspace onboarded to the Microsoft Defender portal. You have the Microsoft Sentinel Contributor role on the workspace.

    You need to create a summary rule from a template provided by a Microsoft Sentinel solution, without writing the summary query yourself.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Wingtip Toys dispose d'un espace de travail Microsoft Sentinel intégré au portail Microsoft Defender. Vous disposez du rôle Microsoft Sentinel Contributor sur l'espace de travail.

    Vous devez créer une règle de synthèse à partir d'un modèle fourni par une solution Microsoft Sentinel, sans écrire vous-même la requête de synthèse.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: filter, text: { en: "In Content hub, set the Content type filter to Summary rules and select the template.", fr: "Dans Content hub, définir le filtre Content type sur Summary rules et sélectionner le modèle." } }
    - { id: install, text: { en: "Select Install.", fr: "Sélectionner Install." } }
    - { id: tab, text: { en: "On the Summary rules page, open the Templates tab and select the installed template.", fr: "Dans la page Summary rules, ouvrir l'onglet Templates et sélectionner le modèle installé." } }
    - { id: create, text: { en: "Select Create, complete the prefilled wizard, and select Save.", fr: "Sélectionner Create, compléter l'assistant prérempli et sélectionner Save." } }
    - { id: analytics, text: { en: "On the Analytics page, open the Rule templates tab and select Create rule.", fr: "Dans la page Analytics, ouvrir l'onglet Rule templates et sélectionner Create rule." } }
    - { id: table, text: { en: "In the workspace, create the destination table with the Auxiliary plan.", fr: "Dans l'espace de travail, créer la table de destination avec le plan Auxiliary." } }
answer:
  sequence: [ filter, install, tab, create ]
explanation:
  correct:
    en: |
      Summary rule templates are delivered through Content hub. You filter Content type to Summary rules, select and install the template, then open the Templates tab of the Summary rules page, select the template and select Create. The wizard opens with the name, query and destination table prefilled; you complete it and save.
    fr: |
      Les modèles de règles de synthèse sont fournis par Content hub. Vous filtrez Content type sur Summary rules, sélectionnez et installez le modèle, puis ouvrez l'onglet Templates de la page Summary rules, sélectionnez le modèle et sélectionnez Create. L'assistant s'ouvre avec le nom, la requête et la table de destination préremplis ; vous le complétez et l'enregistrez.
  options:
    analytics: { en: "Rule templates on the Analytics page create analytics rules, not summary rules.", fr: "Les modèles de la page Analytics créent des règles d'analytique, pas des règles de synthèse." }
    table: { en: "The wizard creates or selects the destination table, which must use the Analytics plan, not Auxiliary.", fr: "L'assistant crée ou sélectionne la table de destination, qui doit utiliser le plan Analytics, pas Auxiliary." }
references:
  - title: Aggregate Microsoft Sentinel data with summary rules
    url: https://learn.microsoft.com/en-us/azure/sentinel/summary-rules
