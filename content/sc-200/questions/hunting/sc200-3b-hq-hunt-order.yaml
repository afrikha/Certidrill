id: sc200-3b-hq-hunt-order
objective: "3.2.1"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    Litware analysts work in Microsoft Sentinel in the Azure portal and have the Microsoft Sentinel Contributor role. They suspect that an attacker uses living-off-the-land binaries, and three hunting queries on the **Hunting** page test this hypothesis.

    You need to run the three queries and end with a new incident that contains the suspicious result rows.

    Which three actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Les analystes de Litware travaillent dans Microsoft Sentinel dans le portail Azure et disposent du rôle Microsoft Sentinel Contributor. Ils soupçonnent un attaquant d'utiliser des binaires living-off-the-land, et trois requêtes de chasse de la page **Hunting** testent cette hypothèse.

    Vous devez exécuter les trois requêtes et terminer par un nouvel incident qui contient les lignes de résultats suspectes.

    Quelles sont les trois actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - { id: run, text: { en: "On the Queries tab, select the three queries, and then select Run selected queries.", fr: "Sous l'onglet Queries, sélectionner les trois requêtes, puis sélectionner Run selected queries." } }
    - { id: bm, text: { en: "Open the results of each query, select the suspicious rows, and then select Add bookmark.", fr: "Ouvrir les résultats de chaque requête, sélectionner les lignes suspectes, puis sélectionner Add bookmark." } }
    - { id: inc, text: { en: "On the Bookmarks tab, select the bookmarks, and then select Incident actions > Create new incident.", fr: "Sous l'onglet Bookmarks, sélectionner les signets, puis sélectionner Incident actions > Create new incident." } }
    - { id: live, text: { en: "Start a livestream session for each query.", fr: "Démarrer une session de livestream pour chaque requête." } }
    - { id: rule, text: { en: "Select New alert rule > Create Microsoft Sentinel alert for each query.", fr: "Sélectionner New alert rule > Create Microsoft Sentinel alert pour chaque requête." } }
    - { id: fav, text: { en: "Add the three queries to the favorites.", fr: "Ajouter les trois requêtes aux favoris." } }
answer:
  sequence: [ run, bm, inc ]
explanation:
  correct:
    en: |
      Run selected queries runs the queries and shows the number of results of each. You then open the results, bookmark the suspicious rows (bookmarks are created in the Azure portal), and use Incident actions on the Bookmarks tab to create a new incident from the bookmarks.
    fr: |
      Run selected queries exécute les requêtes et affiche le nombre de résultats de chacune. Vous ouvrez ensuite les résultats, créez des signets pour les lignes suspectes (les signets se créent dans le portail Azure), puis utilisez Incident actions sous l'onglet Bookmarks pour créer un nouvel incident à partir des signets.
  options:
    live: { en: "Livestream sessions are no longer available in Microsoft Sentinel.", fr: "Les sessions de livestream ne sont plus disponibles dans Microsoft Sentinel." }
    rule: { en: "Analytics rules create future alerts; they don't put the rows already found into an incident.", fr: "Les règles d'analytique créent des alertes futures ; elles ne placent pas les lignes déjà trouvées dans un incident." }
    fav: { en: "Favorites only make the queries run each time the Hunting page opens; they don't keep rows or create an incident.", fr: "Les favoris font seulement exécuter les requêtes à chaque ouverture de la page Hunting ; ils ne conservent pas de lignes et ne créent pas d'incident." }
references:
  - title: Hunt with bookmarks in Microsoft Sentinel
    url: https://learn.microsoft.com/en-us/azure/sentinel/bookmarks
