id: sc200-3b-hq-hunt-order
objective: "3.2.1"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    Litware analysts have the Microsoft Sentinel Contributor role. They suspect that an attacker uses living-off-the-land binaries, and three hunting queries test this hypothesis.

    You need to track the investigation of this hypothesis in a hunt that contains the three queries, and end with a new incident that contains the suspicious result rows.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Les analystes de Litware disposent du rôle Microsoft Sentinel Contributor. Ils soupçonnent un attaquant d'utiliser des binaires légitimes du système (living off the land), et trois requêtes de chasse testent cette hypothèse.

    Vous devez suivre l'investigation de cette hypothèse dans une chasse (hunt) qui contient les trois requêtes, et terminer par un nouvel incident qui contient les lignes de résultats suspectes.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: hunt, text: { en: "On the Queries tab, select the three queries, and then select Hunt actions > Create new hunt.", fr: "Sous l'onglet Queries, sélectionner les trois requêtes, puis sélectionner Hunt actions > Create new hunt." } }
    - { id: run, text: { en: "In the hunt, select Run all queries.", fr: "Dans la chasse, sélectionner Run all queries." } }
    - { id: bm, text: { en: "Select the suspicious result rows, and then select Add bookmark.", fr: "Sélectionner les lignes de résultats suspectes, puis sélectionner Add bookmark." } }
    - { id: inc, text: { en: "Select the bookmarks, and then select Incident actions > Create new incident.", fr: "Sélectionner les signets, puis sélectionner Incident actions > Create new incident." } }
    - { id: live, text: { en: "Start a livestream session for each query.", fr: "Démarrer une session de livestream pour chaque requête." } }
    - { id: rule, text: { en: "Select New alert rule > Create Microsoft Sentinel alert for each query.", fr: "Sélectionner New alert rule > Create Microsoft Sentinel alert pour chaque requête." } }
answer:
  sequence: [ hunt, run, bm, inc ]
explanation:
  correct:
    en: |
      Selecting queries and then Hunt actions > Create new hunt clones them into a new hunt. You run the queries in the hunt, bookmark the suspicious rows, and then use Incident actions on the bookmarks to create the incident, which is linked to the hunt.
    fr: |
      Sélectionner des requêtes puis Hunt actions > Create new hunt les clone dans une nouvelle chasse. Vous exécutez les requêtes dans la chasse, créez des signets pour les lignes suspectes, puis utilisez Incident actions sur les signets pour créer l'incident, qui est lié à la chasse.
  options:
    live: { en: "Livestream sessions are no longer available in Microsoft Sentinel.", fr: "Les sessions de livestream ne sont plus disponibles dans Microsoft Sentinel." }
    rule: { en: "Analytics rules create future alerts; they don't put the rows already found into an incident.", fr: "Les règles d'analytique créent des alertes futures ; elles ne placent pas les lignes déjà trouvées dans un incident." }
references:
  - title: Conduct end-to-end proactive threat hunting in Microsoft Sentinel
    url: https://learn.microsoft.com/en-us/azure/sentinel/hunts
