id: sc200-3a-ah-partial-results
objective: "3.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Contoso, Ltd. uses Microsoft Defender XDR. You run an advanced hunting query on DeviceEvents that projects about 30 columns, including AdditionalFields and long command lines.

    The query completes in two minutes and returns about 40,000 rows. The portal displays a message stating that the results are partial.

    What is the most likely cause of the message?
  fr: |
    Contoso, Ltd. utilise Microsoft Defender XDR. Vous exécutez sur DeviceEvents une requête de repérage avancé qui projette une trentaine de colonnes, dont AdditionalFields et de longues lignes de commande.

    La requête se termine en deux minutes et renvoie environ 40 000 lignes. Le portail affiche un message indiquant que les résultats sont partiels.

    Quelle est la cause la plus probable du message ?
body:
  options:
    - { id: a, text: { en: "The query exceeded the limit of 100,000 rows.", fr: "La requête a dépassé la limite de 100 000 lignes." } }
    - { id: b, text: { en: "The results exceeded the 64 MB size limit.", fr: "Les résultats ont dépassé la limite de taille de 64 Mo." } }
    - { id: c, text: { en: "The query exceeded the 10-minute timeout.", fr: "La requête a dépassé le délai d'expiration de 10 minutes." } }
    - { id: d, text: { en: "The tenant consumed 100 percent of its CPU allocation.", fr: "Le locataire a consommé 100 % de son allocation de processeur." } }
answer: { optionId: b }
explanation:
  correct:
    en: The 64 MB limit applies to the overall size of the results, so wide rows with long fields can reach it well before 100,000 rows. When the results exceed 64 MB, the portal returns as many records as fit and states that the results are partial. Projecting only the needed columns fixes it.
    fr: |
      La limite de 64 Mo s'applique à la taille totale des résultats : des lignes larges avec de longs champs peuvent l'atteindre bien avant 100 000 lignes. Quand les résultats dépassent 64 Mo, le portail renvoie autant d'enregistrements que possible et indique que les résultats sont partiels. Ne projeter que les colonnes nécessaires résout le problème.
  options:
    a: { en: "The query returned about 40,000 rows, below the 100,000-row limit.", fr: "La requête a renvoyé environ 40 000 lignes, sous la limite de 100 000 lignes." }
    c: { en: "The query completed in two minutes; a query that exceeds 10 minutes ends with an error, not partial results.", fr: "La requête s'est terminée en deux minutes ; une requête qui dépasse 10 minutes se termine par une erreur, pas par des résultats partiels." }
    d: { en: "When the tenant reaches 100 percent of its CPU resources, queries are blocked until the next 15-minute cycle; they don't return partial results.", fr: "Quand le locataire atteint 100 % de ses ressources processeur, les requêtes sont bloquées jusqu'au cycle de 15 minutes suivant ; elles ne renvoient pas de résultats partiels." }
references:
  - title: Proactively hunt for threats with advanced hunting in Microsoft Defender
    url: https://learn.microsoft.com/en-us/defender-xdr/advanced-hunting-overview
