id: sc200-3c-summary-time-filter
objective: "3.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Contoso has a Microsoft Sentinel workspace that contains a table named **ProxyLogs_CL**. An analyst created a summary rule that runs every 60 minutes with a delay of 10 minutes and uses the following query.

    ```kusto
    ProxyLogs_CL
    | where TimeGenerated > ago(1h)
    | summarize Requests = count(), TotalSent = sum(SentBytes) by SrcUser, DestHost
    ```

    The destination table consistently contains fewer requests than ProxyLogs_CL for the same hours. Ingestion into ProxyLogs_CL is healthy.

    What should you do?
  fr: |
    Contoso dispose d'un espace de travail Microsoft Sentinel qui contient une table nommée **ProxyLogs_CL**. Un analyste a créé une règle de synthèse qui s'exécute toutes les 60 minutes avec un délai de 10 minutes et qui utilise la requête suivante.

    ```kusto
    ProxyLogs_CL
    | where TimeGenerated > ago(1h)
    | summarize Requests = count(), TotalSent = sum(SentBytes) by SrcUser, DestHost
    ```

    La table de destination contient systématiquement moins de requêtes que ProxyLogs_CL pour les mêmes heures. L'ingestion dans ProxyLogs_CL fonctionne correctement.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Increase the delay of the rule to 60 minutes", fr: "Augmenter le délai de la règle à 60 minutes" } }
    - { id: b, text: { en: "Change the bin size of the rule to 120 minutes", fr: "Modifier la taille d'intervalle de la règle à 120 minutes" } }
    - { id: c, text: { en: "Add bin(TimeGenerated, 1h) to the by clause of the query", fr: "Ajouter bin(TimeGenerated, 1h) à la clause by de la requête" } }
    - { id: d, text: { en: "Remove the where TimeGenerated filter from the query", fr: "Supprimer le filtre where TimeGenerated de la requête" } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Each run of a summary rule already processes exactly one bin, and a time filter in the query is intersected with that bin. Because the run starts 10 minutes after the bin ends, ago(1h) excludes the first 10 minutes of every bin. Removing the filter lets the bin alone define the time range, as Microsoft recommends.
    fr: |
      Chaque exécution d'une règle de synthèse traite déjà exactement un intervalle, et un filtre de temps dans la requête est croisé avec cet intervalle. Comme l'exécution démarre 10 minutes après la fin de l'intervalle, ago(1h) exclut les 10 premières minutes de chaque intervalle. Supprimer le filtre laisse l'intervalle seul définir la plage de temps, comme le recommande Microsoft.
  options:
    a: { en: "A longer delay starts each run later, so ago(1h) would exclude an even larger part of every bin.", fr: "Un délai plus long démarre chaque exécution plus tard : ago(1h) exclurait une part encore plus grande de chaque intervalle." }
    b: { en: "With a 120-minute bin, the one-hour filter would keep less than half of each bin.", fr: "Avec un intervalle de 120 minutes, le filtre d'une heure conserverait moins de la moitié de chaque intervalle." }
    c: { en: "Grouping by hour changes the shape of the results but not the rows removed by the time filter.", fr: "Regrouper par heure change la forme des résultats, mais pas les lignes supprimées par le filtre de temps." }
references:
  - title: Aggregate data in a Log Analytics workspace by using summary rules
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/logs/summary-rules
