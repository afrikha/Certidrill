id: sc200-3a-tbl-alert-evidence
objective: "3.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Tailspin Toys uses Microsoft Defender XDR with all the Defender workloads.

    For a monthly report, you need a single advanced hunting query that returns, for each high-severity alert of the last 30 days, the SHA1 of every file and the identifier of every device associated with the alert. The query must not use a join.

    Which table should you query?
  fr: |
    Tailspin Toys utilise Microsoft Defender XDR avec toutes les charges de travail Defender.

    Pour un rapport mensuel, vous avez besoin d'une seule requête de repérage avancé qui renvoie, pour chaque alerte de gravité élevée des 30 derniers jours, le SHA1 de chaque fichier et l'identificateur de chaque appareil associés à l'alerte. La requête ne doit pas utiliser de jointure.

    Quelle table devez-vous interroger ?
body:
  options:
    - { id: a, text: AlertInfo }
    - { id: b, text: AlertEvidence }
    - { id: c, text: DeviceEvents }
    - { id: d, text: DisruptionAndResponseEvents }
answer: { optionId: b }
explanation:
  correct:
    en: AlertEvidence contains the entities (files, IP addresses, URLs, users, devices) associated with alerts, with columns such as EntityType, SHA1 and DeviceId. It also carries the alert Title and Severity, so a single query can filter on high severity without joining AlertInfo.
    fr: |
      AlertEvidence contient les entités (fichiers, adresses IP, URL, utilisateurs, appareils) associées aux alertes, avec des colonnes comme EntityType, SHA1 et DeviceId. Elle contient aussi le Title et la Severity de l'alerte : une seule requête peut donc filtrer sur la gravité élevée sans jointure avec AlertInfo.
  options:
    a: { en: "AlertInfo describes the alerts themselves (title, severity, category) but not the entities associated with them; you would need to join it with AlertEvidence on AlertId.", fr: "AlertInfo décrit les alertes elles-mêmes (titre, gravité, catégorie) mais pas les entités qui leur sont associées ; il faudrait la joindre à AlertEvidence sur AlertId." }
    c: { en: "DeviceEvents contains raw endpoint events such as antivirus detections; it does not link files and devices to every Defender alert.", fr: "DeviceEvents contient des événements bruts des points de terminaison, comme les détections antivirus ; elle ne relie pas les fichiers et les appareils à chaque alerte Defender." }
    d: { en: "DisruptionAndResponseEvents records automatic attack disruption events, not the evidence of every alert.", fr: "DisruptionAndResponseEvents enregistre les événements de l'interruption automatique des attaques, pas les preuves de chaque alerte." }
references:
  - title: AlertEvidence table in the advanced hunting schema
    url: https://learn.microsoft.com/en-us/defender-xdr/advanced-hunting-alertevidence-table
