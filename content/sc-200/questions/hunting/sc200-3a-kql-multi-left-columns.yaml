id: sc200-3a-kql-multi-left-columns
objective: "3.1.2"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    You are writing an advanced hunting query in the Microsoft Defender portal with the following structure:

    ```kusto
    DeviceInfo
    | join kind=<flavor> (DeviceNetworkEvents | where Timestamp > ago(1d)) on DeviceId
    ```

    You want the result to contain only the columns of DeviceInfo.

    Which two join flavors return only the columns of the left table?

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous écrivez une requête de repérage avancé dans le portail Microsoft Defender avec la structure suivante :

    ```kusto
    DeviceInfo
    | join kind=<flavor> (DeviceNetworkEvents | where Timestamp > ago(1d)) on DeviceId
    ```

    Vous voulez que le résultat ne contienne que les colonnes de DeviceInfo.

    Quels sont les deux types de jointure qui ne renvoient que les colonnes de la table de gauche ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: innerunique }
    - { id: b, text: leftouter }
    - { id: c, text: leftsemi }
    - { id: d, text: rightsemi }
    - { id: e, text: leftanti }
answer: { optionIds: [ c, e ] }
explanation:
  correct:
    en: Semi and anti joins return only the columns of the side they filter. leftsemi keeps the DeviceInfo rows that have a match on the right, and leftanti the DeviceInfo rows that have no match, both with DeviceInfo columns only.
    fr: Les jointures semi et anti ne renvoient que les colonnes du côté qu'elles filtrent. leftsemi garde les lignes de DeviceInfo qui ont une correspondance à droite, et leftanti celles qui n'en ont pas, toutes deux avec les seules colonnes de DeviceInfo.
  options:
    a: { en: "innerunique, the default flavor, returns the columns of both tables.", fr: "innerunique, le type par défaut, renvoie les colonnes des deux tables." }
    b: { en: "leftouter returns all the left rows with the columns of both tables.", fr: "leftouter renvoie toutes les lignes de gauche avec les colonnes des deux tables." }
    d: { en: "rightsemi returns only the columns of the right table, DeviceNetworkEvents.", fr: "rightsemi ne renvoie que les colonnes de la table de droite, DeviceNetworkEvents." }
references:
  - title: join operator
    url: https://learn.microsoft.com/en-us/kusto/query/join-operator
