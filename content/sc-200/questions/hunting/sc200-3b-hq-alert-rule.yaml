id: sc200-3b-hq-alert-rule
objective: "3.2.1"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam analysts run a custom hunting query in Microsoft Sentinel every day. The query consistently finds true positives.

    You need the logic of the query to run every hour and create incidents automatically. The solution must minimize administrative effort.

    How should you complete the procedure? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Les analystes de Fabrikam exécutent chaque jour une requête de chasse personnalisée dans Microsoft Sentinel. La requête trouve régulièrement de vrais positifs.

    La logique de la requête doit s'exécuter toutes les heures et créer automatiquement des incidents. La solution doit réduire au minimum l'effort d'administration.

    Comment devez-vous compléter la procédure ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      From the results of the hunting query, select [[action]], and then complete the [[wizard]] wizard.
    fr: |
      Depuis les résultats de la requête de chasse, sélectionnez [[action]], puis terminez l'assistant [[wizard]].
  slots:
    - id: action
      options:
        - { id: rule, text: "New alert rule > Create Microsoft Sentinel alert" }
        - { id: bm, text: Add bookmark }
        - { id: hunt, text: "Hunt actions > Create new hunt" }
        - { id: clone, text: Clone }
    - id: wizard
      options:
        - { id: ar, text: { en: "analytics rule", fr: "de règle d'analytique" } }
        - { id: auto, text: { en: "automation rule", fr: "de règle d'automatisation" } }
        - { id: summ, text: { en: "summary rule", fr: "de règle de synthèse" } }
        - { id: conn, text: { en: "data connector", fr: "de connecteur de données" } }
answer:
  values: { action: rule, wizard: ar }
explanation:
  correct:
    en: |
      A hunting query never alerts by itself. From its results, New alert rule > Create Microsoft Sentinel alert opens the analytics rule wizard with the query prefilled, where you set the hourly schedule and incident creation.
    fr: |
      Une requête de chasse ne génère jamais d'alerte à elle seule. Depuis ses résultats, New alert rule > Create Microsoft Sentinel alert ouvre l'assistant de règle d'analytique avec la requête préremplie, dans lequel vous définissez la planification horaire et la création d'incidents.
  options:
    bm: { en: "A bookmark keeps selected rows as evidence; it doesn't run the query again.", fr: "Un signet conserve des lignes sélectionnées comme preuves ; il ne réexécute pas la requête." }
    hunt: { en: "A hunt organizes a hunting investigation; it doesn't schedule the query.", fr: "Une chasse organise une investigation de chasse ; elle ne planifie pas la requête." }
    auto: { en: "Automation rules act on incidents that already exist; they don't run queries.", fr: "Les règles d'automatisation agissent sur des incidents existants ; elles n'exécutent pas de requêtes." }
    summ: { en: "Summary rules aggregate data into a table; they don't create incidents.", fr: "Les règles de synthèse agrègent des données dans une table ; elles ne créent pas d'incidents." }
references:
  - title: Threat hunting in Microsoft Sentinel
    url: https://learn.microsoft.com/en-us/azure/sentinel/hunting
