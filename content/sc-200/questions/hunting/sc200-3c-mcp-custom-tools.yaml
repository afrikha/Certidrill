id: sc200-3c-mcp-custom-tools
objective: "3.2.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Tailspin Toys has onboarded Microsoft Sentinel to the data lake. The SOC builds agents in Microsoft Copilot Studio that connect to the Microsoft Sentinel MCP server.

    The SOC has saved and approved a set of KQL queries in advanced hunting. The agents must retrieve security data only by running these approved queries, so that their workflows are deterministic and their data access is tightly controlled.

    What should you do?
  fr: |
    Tailspin Toys a intégré Microsoft Sentinel au data lake. Le SOC crée dans Microsoft Copilot Studio des agents qui se connectent au serveur MCP Microsoft Sentinel.

    Le SOC a enregistré et approuvé un ensemble de requêtes KQL dans le repérage avancé. Les agents ne doivent récupérer des données de sécurité qu'en exécutant ces requêtes approuvées, afin que leurs flux soient déterministes et leur accès aux données étroitement contrôlé.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Add the triage collection to the agents and list the approved queries in their instructions", fr: "Ajouter la collection de triage aux agents et lister les requêtes approuvées dans leurs instructions" } }
    - { id: b, text: { en: "Create custom Sentinel MCP tools from the saved queries and add them to the agents", fr: "Créer des outils MCP Sentinel personnalisés à partir des requêtes enregistrées et les ajouter aux agents" } }
    - { id: c, text: { en: "Add the data exploration collection to the agents and allow only the query_lake tool", fr: "Ajouter la collection d'exploration des données aux agents et n'autoriser que l'outil query_lake" } }
    - { id: d, text: { en: "Add the Security Copilot agent creation collection to the agents and import the saved queries", fr: "Ajouter la collection de création d'agents Security Copilot aux agents et importer les requêtes enregistrées" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Custom Microsoft Sentinel MCP tools let agents retrieve and reason over your saved advanced hunting KQL queries. Because the agents can only call those tools, you control exactly which data they access, and their workflows stay deterministic.
    fr: |
      Les outils MCP Microsoft Sentinel personnalisés permettent aux agents de récupérer vos requêtes KQL de repérage avancé enregistrées et de raisonner dessus. Comme les agents ne peuvent appeler que ces outils, vous contrôlez exactement les données auxquelles ils accèdent, et leurs flux restent déterministes.
  options:
    a: { en: "Instructions don't restrict what the triage tools can run; an agent could still build its own queries.", fr: "Des instructions ne limitent pas ce que les outils de triage peuvent exécuter ; un agent pourrait encore créer ses propres requêtes." }
    c: { en: "query_lake runs any KQL query that the agent writes, so it doesn't limit the agents to the approved queries.", fr: "query_lake exécute n'importe quelle requête KQL écrite par l'agent : il ne limite pas les agents aux requêtes approuvées." }
    d: { en: "The agent creation collection helps build Security Copilot agents; it doesn't turn saved queries into restricted tools.", fr: "La collection de création d'agents aide à créer des agents Security Copilot ; elle ne transforme pas des requêtes enregistrées en outils restreints." }
references:
  - title: Tool collection in Microsoft Sentinel MCP server
    url: https://learn.microsoft.com/en-us/azure/sentinel/datalake/sentinel-mcp-tools-overview
