id: sc200-3a-ta-dd-report-tabs
objective: "3.1.4"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Proseware, Inc. uses Microsoft Defender XDR with all the Defender workloads, and its tenant is verified for threat intelligence. You open a threat analytics report about a new malware family.

    Which tab of the report should you use for each requirement? To answer, drag the appropriate tabs to the correct requirements. Each tab may be used once, more than once, or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware, Inc. utilise Microsoft Defender XDR avec toutes les charges de travail Defender, et son locataire est vérifié pour le renseignement sur les menaces. Vous ouvrez un rapport d'analytique des menaces sur une nouvelle famille de programmes malveillants.

    Quel onglet du rapport devez-vous utiliser pour chaque exigence ? Pour répondre, faites glisser les onglets appropriés vers les exigences correspondantes. Chaque onglet peut être utilisé une fois, plusieurs fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: true
  items:
    - { id: overview, text: Overview }
    - { id: analyst, text: Analyst report }
    - { id: incidents, text: Related incidents }
    - { id: assets, text: Impacted assets }
    - { id: exposure, text: Endpoints exposure }
    - { id: actions, text: Recommended actions }
    - { id: iocs, text: Indicators }
  targets:
    - id: updates
      text: { en: "Deployment status of the security updates on your onboarded devices", fr: "État du déploiement des mises à jour de sécurité sur vos appareils intégrés" }
    - id: ioc
      text: { en: "Indicators of compromise published by Microsoft researchers, including expired ones", fr: "Indicateurs de compromission publiés par les chercheurs Microsoft, y compris ceux qui ont expiré" }
    - id: chain
      text: { en: "Attack chain mapped to MITRE ATT&CK techniques, with advanced hunting queries", fr: "Chaîne d'attaque mappée aux techniques MITRE ATT&CK, avec des requêtes de repérage avancé" }
    - id: assign
      text: { en: "Incidents of your tenant linked to the threat, to assign them to analysts", fr: "Incidents de votre locataire liés à la menace, pour les attribuer à des analystes" }
answer:
  mapping: { updates: exposure, ioc: iocs, chain: analyst, assign: incidents }
explanation:
  correct:
    en: Endpoints exposure shows the exposure level and the deployment status of the supported security updates, from Defender Vulnerability Management data. Indicators lists the IOCs that Microsoft researchers update in near real time and keeps the expired ones; it is reserved for verified tenants. The Analyst report contains the attack chain, the MITRE ATT&CK techniques and the hunting queries. Related incidents lists the linked incidents, which you can assign and manage.
    fr: Endpoints exposure montre le niveau d'exposition et l'état du déploiement des mises à jour de sécurité prises en charge, à partir des données de Defender Vulnerability Management. Indicators liste les IOC que les chercheurs Microsoft mettent à jour quasiment en temps réel et conserve ceux qui ont expiré ; il est réservé aux locataires vérifiés. L'Analyst report contient la chaîne d'attaque, les techniques MITRE ATT&CK et les requêtes de chasse. Related incidents liste les incidents liés, que vous pouvez attribuer et gérer.
references:
  - title: Threat analytics in Microsoft Defender
    url: https://learn.microsoft.com/en-us/defender-xdr/threat-analytics
