id: sc200-3b-sg-graph-job
objective: "3.1.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Litware analysts built a custom graph named **OAuthEscalation** in an interactive notebook session by using the Microsoft Sentinel extension for Visual Studio Code.

    Analysts must be able to query OAuthEscalation from the Microsoft Defender portal for the next six months. The graph must include new data every day.

    What should you do?
  fr: |
    Les analystes de Litware ont créé un graphe personnalisé nommé **OAuthEscalation** dans une session de notebook interactive avec l'extension Microsoft Sentinel pour Visual Studio Code.

    Les analystes doivent pouvoir interroger OAuthEscalation depuis le portail Microsoft Defender pendant les six prochains mois. Le graphe doit intégrer de nouvelles données chaque jour.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Create an on-demand graph job for the notebook.", fr: "Créer une tâche de graphe à la demande pour le notebook." } }
    - { id: b, text: { en: "Create a graph job for the notebook with a Daily schedule.", fr: "Créer une tâche de graphe pour le notebook avec une planification Daily." } }
    - { id: c, text: { en: "Keep the interactive notebook session running.", fr: "Laisser la session de notebook interactive en cours d'exécution." } }
    - { id: d, text: { en: "Create a scheduled KQL job that runs daily.", fr: "Créer une tâche KQL planifiée qui s'exécute chaque jour." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      A graph built in an interactive session is temporary. A scheduled graph job materializes the graph and rebuilds it on its refresh schedule, so a Daily schedule keeps OAuthEscalation available in the Defender portal with fresh data.
    fr: |
      Un graphe créé dans une session interactive est temporaire. Une tâche de graphe planifiée matérialise le graphe et le reconstruit selon sa planification : une planification Daily garde OAuthEscalation disponible dans le portail Defender avec des données à jour.
  options:
    a: { en: "An on-demand job builds the graph once and deletes it after 30 days; it neither refreshes it nor keeps it six months.", fr: "Une tâche à la demande crée le graphe une seule fois et le supprime au bout de 30 jours ; elle ne l'actualise pas et ne le conserve pas six mois." }
    c: { en: "A graph from an interactive session is deleted when the session closes and doesn't appear in the Defender portal.", fr: "Un graphe issu d'une session interactive est supprimé à la fermeture de la session et n'apparaît pas dans le portail Defender." }
    d: { en: "A KQL job writes query results to a table; it doesn't build or refresh a custom graph.", fr: "Une tâche KQL écrit les résultats d'une requête dans une table ; elle ne crée ni n'actualise un graphe personnalisé." }
references:
  - title: Get started with custom graphs in Microsoft Sentinel (preview)
    url: https://learn.microsoft.com/en-us/azure/sentinel/datalake/create-custom-graphs
