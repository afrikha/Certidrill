id: sc200-3a-tbl-tvm-cve
objective: "3.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Proseware, Inc. onboarded all its devices to Microsoft Defender for Endpoint, which includes Microsoft Defender Vulnerability Management.

    A vendor published a critical CVE for a PDF reader. You need an advanced hunting query that lists the devices running a vulnerable version of the software, together with the security update that fixes the vulnerability.

    Which table should you query?
  fr: |
    Proseware, Inc. a intégré tous ses appareils à Microsoft Defender for Endpoint, qui inclut Microsoft Defender Vulnerability Management.

    Un éditeur a publié une CVE critique pour un lecteur PDF. Vous avez besoin d'une requête de repérage avancé qui liste les appareils exécutant une version vulnérable du logiciel, avec la mise à jour de sécurité qui corrige la vulnérabilité.

    Quelle table devez-vous interroger ?
body:
  options:
    - { id: a, text: DeviceTvmSoftwareInventory }
    - { id: b, text: DeviceInfo }
    - { id: c, text: DeviceTvmSoftwareVulnerabilities }
    - { id: d, text: DeviceTvmSecureConfigurationAssessment }
answer: { optionId: c }
explanation:
  correct:
    en: DeviceTvmSoftwareVulnerabilities lists the vulnerabilities found in the software installed on each device, with the CveId, the VulnerabilitySeverityLevel and the RecommendedSecurityUpdate that addresses it. Filtering on the CVE identifier returns the affected devices and the fix.
    fr: DeviceTvmSoftwareVulnerabilities liste les vulnérabilités trouvées dans les logiciels installés sur chaque appareil, avec le CveId, le VulnerabilitySeverityLevel et la RecommendedSecurityUpdate qui la corrige. Un filtre sur l'identificateur de la CVE renvoie les appareils concernés et le correctif.
  options:
    a: { en: "DeviceTvmSoftwareInventory lists installed software and versions, but not the CVEs that affect them nor the recommended update.", fr: "DeviceTvmSoftwareInventory liste les logiciels installés et leurs versions, mais pas les CVE qui les affectent ni la mise à jour recommandée." }
    b: { en: "DeviceInfo describes device properties such as the operating system, not the vulnerabilities of installed software.", fr: "DeviceInfo décrit les propriétés des appareils, comme le système d'exploitation, pas les vulnérabilités des logiciels installés." }
    d: { en: "DeviceTvmSecureConfigurationAssessment reports the status of security configurations, not software CVEs.", fr: "DeviceTvmSecureConfigurationAssessment indique l'état des configurations de sécurité, pas les CVE des logiciels." }
references:
  - title: DeviceTvmSoftwareVulnerabilities table in the advanced hunting schema
    url: https://learn.microsoft.com/en-us/defender-xdr/advanced-hunting-devicetvmsoftwarevulnerabilities-table
