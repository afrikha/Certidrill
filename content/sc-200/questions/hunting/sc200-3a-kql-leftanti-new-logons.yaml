id: sc200-3a-kql-leftanti-new-logons
objective: "3.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Litware, Inc. uses Microsoft Defender for Endpoint. You are hunting for lateral movement and write the following advanced hunting query:

    ```kusto
    let baseline = DeviceLogonEvents
    | where Timestamp between (ago(30d) .. ago(1d))
    | where ActionType == "LogonSuccess"
    | distinct AccountName, DeviceName;
    DeviceLogonEvents
    | where Timestamp > ago(1d) and ActionType == "LogonSuccess"
    | join kind=<flavor> baseline on AccountName, DeviceName
    | project Timestamp, AccountName, DeviceName, LogonType, RemoteIP
    ```

    The query must return the successful sign-ins of the last 24 hours for which the same account had never signed in to the same device during the previous 29 days.

    Which join flavor should you use?
  fr: |
    Litware, Inc. utilise Microsoft Defender for Endpoint. Vous recherchez un mouvement latéral et écrivez la requête de repérage avancé suivante :

    ```kusto
    let baseline = DeviceLogonEvents
    | where Timestamp between (ago(30d) .. ago(1d))
    | where ActionType == "LogonSuccess"
    | distinct AccountName, DeviceName;
    DeviceLogonEvents
    | where Timestamp > ago(1d) and ActionType == "LogonSuccess"
    | join kind=<flavor> baseline on AccountName, DeviceName
    | project Timestamp, AccountName, DeviceName, LogonType, RemoteIP
    ```

    La requête doit renvoyer les ouvertures de session réussies des dernières 24 heures pour lesquelles le même compte ne s'était jamais connecté au même appareil au cours des 29 jours précédents.

    Quel type de jointure devez-vous utiliser ?
body:
  options:
    - { id: a, text: leftsemi }
    - { id: b, text: leftouter }
    - { id: c, text: rightanti }
    - { id: d, text: leftanti }
answer: { optionId: d }
explanation:
  correct:
    en: leftanti returns the rows of the left table (the sign-ins of the last 24 hours) that have no match in the right table (the account and device pairs of the baseline). It returns only the left columns, which is all the project needs.
    fr: leftanti renvoie les lignes de la table de gauche (les ouvertures de session des dernières 24 heures) qui n'ont aucune correspondance dans la table de droite (les couples compte-appareil de la référence). Il ne renvoie que les colonnes de gauche, ce qui suffit au project.
  options:
    a: { en: "leftsemi returns the recent sign-ins that do match the baseline, which is the opposite of the requirement.", fr: "leftsemi renvoie les ouvertures de session récentes qui correspondent à la référence, soit l'inverse de l'exigence." }
    b: { en: "leftouter returns all the recent sign-ins, matching or not, so known pairs aren't excluded.", fr: "leftouter renvoie toutes les ouvertures de session récentes, avec ou sans correspondance : les couples connus ne sont pas exclus." }
    c: { en: "rightanti returns the baseline pairs that didn't sign in during the last 24 hours, and only the baseline columns.", fr: "rightanti renvoie les couples de la référence qui ne se sont pas connectés au cours des dernières 24 heures, avec les seules colonnes de la référence." }
references:
  - title: join operator
    url: https://learn.microsoft.com/en-us/kusto/query/join-operator
