id: sc200-3a-ta-link-custom-detection
objective: "3.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Tailspin Toys uses Microsoft Defender XDR. Your team adapted the hunting guidance of a threat analytics report into a custom detection rule named **CD-LoaderBeacon**.

    You need the incidents created by CD-LoaderBeacon to appear in the **Related incidents** tab of the report, in the same way as incidents from Microsoft detections. The solution must minimize administrative effort.

    What should you do?
  fr: |
    Tailspin Toys utilise Microsoft Defender XDR. Votre équipe a adapté les conseils de chasse d'un rapport d'analytique des menaces en une règle de détection personnalisée nommée **CD-LoaderBeacon**.

    Les incidents créés par CD-LoaderBeacon doivent apparaître dans l'onglet **Related incidents** du rapport, de la même façon que les incidents issus des détections Microsoft. La solution doit réduire au minimum l'effort d'administration.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Add the report's indicators to the Tenant Allow/Block List.", fr: "Ajouter les indicateurs du rapport à la liste d'autorisation/blocage du locataire." } }
    - { id: b, text: { en: "Link CD-LoaderBeacon to the threat analytics report.", fr: "Lier CD-LoaderBeacon au rapport d'analytique des menaces." } }
    - { id: c, text: { en: "Configure email notifications for the threat analytics report.", fr: "Configurer des notifications par e-mail pour le rapport d'analytique des menaces." } }
    - { id: d, text: { en: "Use Link to incident on the results of the rule's query each day.", fr: "Utiliser Link to incident chaque jour sur les résultats de la requête de la règle." } }
answer: { optionId: b }
explanation:
  correct:
    en: A custom detection rule can be linked to a threat analytics report. When the rule fires and creates an incident, the report appears in that incident and the incident appears under Related incidents, like the incidents of Microsoft-defined detections.
    fr: Une règle de détection personnalisée peut être liée à un rapport d'analytique des menaces. Quand la règle se déclenche et crée un incident, le rapport apparaît dans cet incident et l'incident apparaît sous Related incidents, comme les incidents des détections définies par Microsoft.
  options:
    a: { en: "Allow/Block List entries block or allow items; they don't associate incidents with a report.", fr: "Les entrées de la liste d'autorisation/blocage bloquent ou autorisent des éléments ; elles n'associent pas d'incidents à un rapport." }
    c: { en: "Email notifications inform you of new or updated reports; they don't change which incidents are related to a report.", fr: "Les notifications par e-mail vous informent des rapports nouveaux ou mis à jour ; elles ne changent pas les incidents associés à un rapport." }
    d: { en: "Linking results to incidents every day is manual work, and it attaches results to an incident, not incidents to the report.", fr: "Lier des résultats à des incidents chaque jour est un travail manuel, et cela rattache des résultats à un incident, pas des incidents au rapport." }
references:
  - title: Threat analytics in Microsoft Defender
    url: https://learn.microsoft.com/en-us/defender-xdr/threat-analytics
