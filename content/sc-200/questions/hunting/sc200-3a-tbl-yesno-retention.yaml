id: sc200-3a-tbl-yesno-retention
objective: "3.1.1"
type: yesno_statements
difficulty: 3
status: draft
stem:
  en: |
    Contoso, Ltd. uses Microsoft Defender XDR and has a Microsoft Sentinel workspace named **SecOps-WS** onboarded to the Microsoft Defender portal and to the Microsoft Sentinel data lake. Defender XDR data is not streamed to the workspace, and Contoso has no eligible Integrated Security Operations Center (ISOC) license.

    SecOps-WS contains the following tables:

    | Table | Tier | Analytics retention |
    | --- | --- | --- |
    | SecurityEvent | Analytics | 90 days |
    | FirewallFlow_CL | Data lake only | None |

    You write queries in **Advanced hunting**.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso, Ltd. utilise Microsoft Defender XDR et dispose d'un espace de travail Microsoft Sentinel nommé **SecOps-WS** intégré au portail Microsoft Defender et au data lake Microsoft Sentinel. Les données Defender XDR ne sont pas diffusées vers l'espace de travail, et Contoso n'a pas de licence ISOC (Integrated Security Operations Center) éligible.

    SecOps-WS contient les tables suivantes :

    | Table | Niveau | Rétention Analytics |
    | --- | --- | --- |
    | SecurityEvent | Analytics | 90 jours |
    | FirewallFlow_CL | Data lake uniquement | Aucune |

    Vous écrivez des requêtes dans **Advanced hunting**.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: A query can return DeviceProcessEvents records from 60 days ago.
        fr: Une requête peut renvoyer des enregistrements DeviceProcessEvents datant de 60 jours.
    - id: s2
      text:
        en: A query can return SecurityEvent records from 60 days ago.
        fr: Une requête peut renvoyer des enregistrements SecurityEvent datant de 60 jours.
    - id: s3
      text:
        en: A query can return FirewallFlow_CL records from yesterday.
        fr: Une requête peut renvoyer des enregistrements FirewallFlow_CL datant d'hier.
answer:
  values: { s1: false, s2: true, s3: false }
explanation:
  correct:
    en: Without an eligible ISOC license, advanced hunting covers 30 days of native Defender data, so DeviceProcessEvents records from 60 days ago are out of range when the data isn't kept in the workspace. For the tables of an onboarded Sentinel workspace, the date range follows the analytics-tier retention of each table, here 90 days for SecurityEvent. Data stored only in the Sentinel data lake isn't available in advanced hunting; you query it with data lake exploration.
    fr: |
      Sans licence ISOC éligible, le repérage avancé couvre 30 jours de données Defender natives : des enregistrements DeviceProcessEvents datant de 60 jours sont hors de portée quand les données ne sont pas conservées dans l'espace de travail. Pour les tables d'un espace de travail Sentinel intégré, la plage de dates suit la rétention du niveau Analytics de chaque table, ici 90 jours pour SecurityEvent. Les données stockées uniquement dans le data lake Sentinel ne sont pas disponibles dans le repérage avancé ; vous les interrogez avec l'exploration du data lake.
references:
  - title: Proactively hunt for threats with advanced hunting in Microsoft Defender
    url: https://learn.microsoft.com/en-us/defender-xdr/advanced-hunting-overview
