id: sc200-3c-summary-monitor-table
objective: "3.2.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Northwind Traders has a Microsoft Sentinel workspace named **NW-SOC** that runs six summary rules. You turned on the **Summary Logs** category in the diagnostic settings of NW-SOC and sent it to the same workspace.

    You need to create a log alert rule that notifies the SOC when a summary rule bin fails.

    Which table should the alert rule query?
  fr: |
    Northwind Traders dispose d'un espace de travail Microsoft Sentinel nommé **NW-SOC** qui exécute six règles de synthèse. Vous avez activé la catégorie **Summary Logs** dans les paramètres de diagnostic de NW-SOC et l'avez envoyée vers le même espace de travail.

    Vous devez créer une règle d'alerte de journal qui avertit le SOC quand un intervalle d'une règle de synthèse échoue.

    Quelle table la règle d'alerte doit-elle interroger ?
body:
  options:
    - { id: a, text: SentinelHealth }
    - { id: b, text: LAQueryLogs }
    - { id: c, text: SentinelAudit }
    - { id: d, text: LASummaryLogs }
answer: { optionId: d }
explanation:
  correct:
    en: |
      The Summary Logs diagnostic category writes the run events of summary rules to the LASummaryLogs table, with a Status of Started, Succeeded or Failed. A query such as LASummaryLogs | where Status == "Failed" in a log alert rule notifies you of failed bins.
    fr: |
      La catégorie de diagnostic Summary Logs écrit les événements d'exécution des règles de synthèse dans la table LASummaryLogs, avec un Status Started, Succeeded ou Failed. Une requête telle que LASummaryLogs | where Status == "Failed" dans une règle d'alerte de journal vous avertit des intervalles en échec.
  options:
    a: { en: "SentinelHealth records the health of Microsoft Sentinel features such as data connectors, analytics rules and automation rules, not summary rule bins.", fr: "SentinelHealth enregistre l'intégrité de fonctionnalités Microsoft Sentinel telles que les connecteurs de données, les règles d'analytique et les règles d'automatisation, pas les intervalles des règles de synthèse." }
    b: { en: "LAQueryLogs is the query audit log of the workspace; it doesn't report the status of summary rule bins.", fr: "LAQueryLogs est le journal d'audit des requêtes de l'espace de travail ; il ne rapporte pas l'état des intervalles des règles de synthèse." }
    c: { en: "SentinelAudit records changes to Microsoft Sentinel resources such as analytics rules, not summary rule runs.", fr: "SentinelAudit enregistre les modifications des ressources Microsoft Sentinel telles que les règles d'analytique, pas les exécutions des règles de synthèse." }
references:
  - title: Aggregate data in a Log Analytics workspace by using summary rules
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/logs/summary-rules
