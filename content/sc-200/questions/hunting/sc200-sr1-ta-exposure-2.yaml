id: sc200-sr1-ta-exposure-2
objective: "3.1.4"
type: series_yesno
series: sc200-sr1-ta-exposure
seriesOrder: 2
difficulty: 2
status: draft
stem:
  en: You obtain the vulnerability and exposure read permissions, then review Endpoints exposure and Recommended actions.
  fr: Vous obtenez les autorisations de lecture des vulnérabilités et de l'exposition, puis consultez Endpoints exposure et Recommended actions.
body:
  solution:
    en: |
      An administrator adds the **Vulnerability management (read)** and **Exposure Management (read)** permissions to your unified RBAC role. You then open the threat analytics report and review the **Endpoints exposure** and **Recommended actions** sections.
    fr: |
      Un administrateur ajoute les autorisations **Vulnerability management (read)** et **Exposure Management (read)** à votre rôle RBAC unifié. Vous ouvrez ensuite le rapport d'analytique des menaces et consultez les sections **Endpoints exposure** et **Recommended actions**.
answer: { value: true }
explanation:
  correct:
    en: |
      Endpoints exposure shows the exposure level based on the vulnerabilities and misconfigurations exploited by the threat and the number of affected devices, with the deployment status of the security updates, using Defender Vulnerability Management data. Recommended actions shows the status of mitigations such as cloud-delivered protection. Both require the vulnerability management and exposure management read permissions, which Security data basics (read) does not include.
    fr: |
      Endpoints exposure montre le niveau d'exposition selon les vulnérabilités et les erreurs de configuration exploitées par la menace et le nombre d'appareils concernés, avec l'état de déploiement des mises à jour de sécurité, à partir des données de Defender Vulnerability Management. Recommended actions montre l'état des atténuations comme la protection cloud. Les deux exigent les autorisations de lecture de la gestion des vulnérabilités et de la gestion de l'exposition, que Security data basics (read) n'inclut pas.
references:
  - title: Threat analytics in Microsoft Defender
    url: https://learn.microsoft.com/en-us/defender-xdr/threat-analytics
