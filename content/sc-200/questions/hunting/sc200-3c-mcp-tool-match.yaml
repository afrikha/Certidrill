id: sc200-3c-mcp-tool-match
objective: "3.2.4"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Northwind Traders has onboarded Microsoft Sentinel to the data lake. A threat hunter connected an AI agent to the data exploration collection of the Microsoft Sentinel MCP server and is investigating a phishing campaign.

    You need to identify the tool that the agent uses for each step of the investigation.

    Which tool should the agent use for each step? To answer, drag the appropriate tools to the correct steps. Each tool may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind Traders a intégré Microsoft Sentinel au data lake. Un chasseur de menaces a connecté un agent d'IA à la collection d'exploration des données du serveur MCP Microsoft Sentinel et enquête sur une campagne d'hameçonnage.

    Vous devez identifier l'outil que l'agent utilise pour chaque étape de l'investigation.

    Quel outil l'agent doit-il utiliser pour chaque étape ? Pour répondre, faites glisser les outils appropriés vers les étapes correspondantes. Chaque outil peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: lsw, text: list_sentinel_workspaces }
    - { id: st, text: search_tables }
    - { id: ql, text: query_lake }
    - { id: gea, text: get_entity_analysis }
    - { id: aue, text: analyze_user_entity }
    - { id: fbr, text: find_blastradius }
  targets:
    - id: t1
      text: { en: "Get the name and ID of each data lake workspace that the other tools need", fr: "Obtenir le nom et l'ID de chaque espace de travail du data lake dont les autres outils ont besoin" }
    - id: t2
      text: { en: "Find which lake tables record URL clicks and return their schema", fr: "Trouver quelles tables du lake enregistrent les clics sur des URL et renvoyer leur schéma" }
    - id: t3
      text: { en: "Run a KQL query that lists the users who clicked the phishing URL yesterday", fr: "Exécuter une requête KQL qui liste les utilisateurs ayant cliqué hier sur l'URL d'hameçonnage" }
    - id: t4
      text: { en: "Retrieve the verdict of the URL analysis that the agent started earlier", fr: "Récupérer le verdict de l'analyse d'URL que l'agent a démarrée plus tôt" }
answer:
  mapping: { t1: lsw, t2: st, t3: ql, t4: gea }
explanation:
  correct:
    en: |
      list_sentinel_workspaces returns the workspace name and ID pairs and is run first. search_tables performs a semantic search of the table catalog and returns schemas. query_lake runs one KQL query against the lake for focused retrieval. analyze_url_entity starts an analysis and returns an identifier, and get_entity_analysis retrieves the results of that analysis.
    fr: |
      list_sentinel_workspaces renvoie les paires nom et ID des espaces de travail et s'exécute en premier. search_tables effectue une recherche sémantique dans le catalogue des tables et renvoie leurs schémas. query_lake exécute une requête KQL sur le lake pour une récupération ciblée. analyze_url_entity démarre une analyse et renvoie un identifiant, et get_entity_analysis récupère les résultats de cette analyse.
  options:
    aue:
      en: |
        analyze_user_entity starts the analysis of a user, not the retrieval of a URL verdict.
      fr: |
        analyze_user_entity démarre l'analyse d'un utilisateur, pas la récupération du verdict d'une URL.
    fbr:
      en: |
        find_blastradius is a graph tool that evaluates propagation paths toward critical assets.
      fr: |
        find_blastradius est un outil de graphe qui évalue les chemins de propagation vers les ressources critiques.
references:
  - title: Data exploration tool collection in Microsoft Sentinel MCP server
    url: https://learn.microsoft.com/en-us/azure/sentinel/datalake/sentinel-mcp-data-exploration-tool
