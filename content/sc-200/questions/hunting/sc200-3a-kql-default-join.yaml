id: sc200-3a-kql-default-join
objective: "3.1.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Tailspin Toys uses Microsoft Defender for Office 365 and Microsoft Defender for Endpoint. An attacker sent the same ISO attachment to 40 recipients.

    You run the following advanced hunting query to find the messages whose attachment was then written to a device:

    ```kusto
    EmailAttachmentInfo
    | where Timestamp > ago(1d)
    | where FileName endswith ".iso"
    | join (DeviceFileEvents | where Timestamp > ago(1d)) on SHA256
    | project Timestamp, RecipientEmailAddress, FileName, DeviceName
    ```

    The results show only one message per attachment, although several recipients saved the file. You need the results to contain every matching message together with the DeviceName of the device.

    What should you do?
  fr: |
    Tailspin Toys utilise Microsoft Defender for Office 365 et Microsoft Defender for Endpoint. Un attaquant a envoyé la même pièce jointe ISO à 40 destinataires.

    Vous exécutez la requête de repérage avancé suivante pour trouver les messages dont la pièce jointe a ensuite été écrite sur un appareil :

    ```kusto
    EmailAttachmentInfo
    | where Timestamp > ago(1d)
    | where FileName endswith ".iso"
    | join (DeviceFileEvents | where Timestamp > ago(1d)) on SHA256
    | project Timestamp, RecipientEmailAddress, FileName, DeviceName
    ```

    Les résultats ne montrent qu'un message par pièce jointe, alors que plusieurs destinataires ont enregistré le fichier. Les résultats doivent contenir chaque message correspondant avec le DeviceName de l'appareil.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Change the join to join kind=leftsemi", fr: "Remplacer la jointure par join kind=leftsemi" } }
    - { id: b, text: { en: "Add hint.strategy=broadcast to the join", fr: "Ajouter hint.strategy=broadcast à la jointure" } }
    - { id: c, text: { en: "Change the join to join kind=inner", fr: "Remplacer la jointure par join kind=inner" } }
    - { id: d, text: { en: "Change the join to join kind=rightsemi", fr: "Remplacer la jointure par join kind=rightsemi" } }
answer: { optionId: c }
explanation:
  correct:
    en: Without kind, join uses innerunique, which deduplicates the left table on the join key, so only one message per SHA256 survives. kind=inner returns every matching combination of messages and file events, with the columns of both tables.
    fr: |
      Sans kind, join utilise innerunique, qui dédoublonne la table de gauche sur la clé de jointure : un seul message par SHA256 subsiste. kind=inner renvoie toutes les combinaisons correspondantes de messages et d'événements de fichier, avec les colonnes des deux tables.
  options:
    a: { en: "leftsemi returns the matching messages but only the left columns, so DeviceName is missing.", fr: "leftsemi renvoie les messages correspondants mais uniquement les colonnes de gauche : DeviceName manque." }
    b: { en: "Hints such as hint.strategy=broadcast can change performance but never the results.", fr: "Les indicateurs comme hint.strategy=broadcast peuvent modifier les performances, jamais les résultats." }
    d: { en: "rightsemi returns only the columns of DeviceFileEvents, so RecipientEmailAddress is missing.", fr: "rightsemi ne renvoie que les colonnes de DeviceFileEvents : RecipientEmailAddress manque." }
references:
  - title: Advanced hunting query best practices
    url: https://learn.microsoft.com/en-us/defender-xdr/advanced-hunting-best-practices
  - title: join operator
    url: https://learn.microsoft.com/en-us/kusto/query/join-operator
