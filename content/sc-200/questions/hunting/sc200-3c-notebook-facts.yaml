id: sc200-3c-notebook-facts
objective: "3.2.4"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Proseware has onboarded Microsoft Sentinel to the data lake. Threat hunters use Visual Studio Code with the Microsoft Sentinel extension to run data lake notebooks, and some notebooks are scheduled as notebook jobs.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware a intégré Microsoft Sentinel au data lake. Les chasseurs de menaces utilisent Visual Studio Code avec l'extension Microsoft Sentinel pour exécuter des notebooks du data lake, et certains notebooks sont planifiés comme tâches de notebook.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          A notebook job can run for up to eight hours before it times out.
        fr: |
          Une tâche de notebook peut s'exécuter jusqu'à huit heures avant d'expirer.
    - id: s2
      text:
        en: |
          A hunter can run pip install in a notebook cell to add a package from PyPI to the session.
        fr: |
          Un chasseur peut exécuter pip install dans une cellule de notebook pour ajouter un package de PyPI à la session.
    - id: s3
      text:
        en: |
          Switching to another account in the Microsoft Sentinel extension disconnects the active PySpark sessions.
        fr: |
          Passer à un autre compte dans l'extension Microsoft Sentinel déconnecte les sessions PySpark actives.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |
      Notebook jobs time out after eight hours, and up to three run at the same time while the next ones wait in a queue. Data lake notebooks support only the Azure Synapse libraries and the Microsoft Sentinel Provider library; pip installs and custom libraries aren't supported. Only one account can be active in the extension, and switching accounts disconnects any active PySpark session.
    fr: |
      Les tâches de notebook expirent au bout de huit heures, et trois au plus s'exécutent en même temps, les suivantes attendant dans une file. Les notebooks du data lake ne prennent en charge que les bibliothèques Azure Synapse et la bibliothèque Microsoft Sentinel Provider ; pip install et les bibliothèques personnalisées ne sont pas pris en charge. Un seul compte peut être actif dans l'extension, et changer de compte déconnecte toute session PySpark active.
references:
  - title: Run notebooks on the Microsoft Sentinel data lake
    url: https://learn.microsoft.com/en-us/azure/sentinel/datalake/notebooks
