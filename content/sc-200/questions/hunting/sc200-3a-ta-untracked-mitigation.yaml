id: sc200-3a-ta-untracked-mitigation
objective: "3.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam, Inc. uses Microsoft Defender XDR. You review a threat analytics report about a ransomware operator. The **Recommended actions** tab lists cloud-delivered protection, real-time protection and PUA protection.

    A colleague says that the report also recommends randomizing local administrator passwords and blocking .lnk attachments, but these mitigations don't appear in the Recommended actions tab. You need to find the full list of mitigations recommended for this threat.

    Where should you look?
  fr: |
    Fabrikam, Inc. utilise Microsoft Defender XDR. Vous consultez un rapport d'analytique des menaces sur un opérateur de rançongiciel. L'onglet **Recommended actions** liste la protection fournie par le cloud, la protection en temps réel et la protection contre les applications potentiellement indésirables (PUA).

    Un collègue indique que le rapport recommande aussi de rendre aléatoires les mots de passe des administrateurs locaux et de bloquer les pièces jointes .lnk, mais ces atténuations n'apparaissent pas dans l'onglet Recommended actions. Vous devez trouver la liste complète des atténuations recommandées pour cette menace.

    Où devez-vous regarder ?
body:
  options:
    - { id: a, text: { en: "The Analyst report tab", fr: "L'onglet Analyst report" } }
    - { id: b, text: { en: "The Endpoints exposure tab", fr: "L'onglet Endpoints exposure" } }
    - { id: c, text: { en: "The resilience charts of the Overview tab", fr: "Les graphiques de résilience de l'onglet Overview" } }
    - { id: d, text: { en: "The Microsoft Secure Score recommended actions page", fr: "La page des actions recommandées de Microsoft Secure Score" } }
answer: { optionId: a }
explanation:
  correct:
    en: The Recommended actions tab shows only the mitigations tracked in Microsoft Secure Score. The Analyst report also lists mitigations that aren't tracked dynamically, such as randomizing local administrator passwords, blocking .lnk attachments or enabling specific attack surface reduction rules.
    fr: L'onglet Recommended actions n'affiche que les atténuations suivies dans Microsoft Secure Score. L'Analyst report liste aussi les atténuations qui ne sont pas suivies dynamiquement, comme rendre aléatoires les mots de passe des administrateurs locaux, bloquer les pièces jointes .lnk ou activer certaines règles de réduction de la surface d'attaque.
  options:
    b: { en: "Endpoints exposure shows the exposure level and the deployment of security updates, not the untracked mitigations.", fr: "Endpoints exposure montre le niveau d'exposition et le déploiement des mises à jour de sécurité, pas les atténuations non suivies." }
    c: { en: "The resilience charts summarize the status of the recommended actions and the vulnerable devices; they show the same tracked mitigations.", fr: "Les graphiques de résilience résument l'état des actions recommandées et des appareils vulnérables ; ils montrent les mêmes atténuations suivies." }
    d: { en: "Secure Score contains only the tracked recommendations, which is why these mitigations are missing from the tab.", fr: "Secure Score ne contient que les recommandations suivies, c'est pourquoi ces atténuations manquent dans l'onglet." }
references:
  - title: Analyst report in threat analytics
    url: https://learn.microsoft.com/en-us/defender-xdr/threat-analytics-analyst-reports
  - title: Threat analytics in Microsoft Defender
    url: https://learn.microsoft.com/en-us/defender-xdr/threat-analytics
