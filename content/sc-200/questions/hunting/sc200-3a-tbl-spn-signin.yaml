id: sc200-3a-tbl-spn-signin
objective: "3.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Adatum Corporation uses Microsoft Defender XDR and has Microsoft Entra ID P2 licenses. Several automation workloads authenticate to Microsoft Entra ID by using managed identities and app registrations.

    After a client secret leaked, you need to hunt for the sign-ins performed by service principals and managed identities during the last seven days, including the IP address of each sign-in.

    Which table should you query?
  fr: |
    Adatum Corporation utilise Microsoft Defender XDR et dispose de licences Microsoft Entra ID P2. Plusieurs charges de travail d'automatisation s'authentifient auprès de Microsoft Entra ID avec des identités managées et des inscriptions d'applications.

    Après la fuite d'une clé secrète client, vous devez rechercher les connexions effectuées par des principaux de service et des identités managées au cours des sept derniers jours, avec l'adresse IP de chaque connexion.

    Quelle table devez-vous interroger ?
body:
  options:
    - { id: a, text: EntraIdSignInEvents }
    - { id: b, text: EntraIdSpnSignInEvents }
    - { id: c, text: GraphAPIAuditEvents }
    - { id: d, text: IdentityInfo }
answer: { optionId: b }
explanation:
  correct:
    en: EntraIdSpnSignInEvents contains the Microsoft Entra service principal and managed identity sign-ins. It is the table to use when the actor is a workload identity rather than a user.
    fr: EntraIdSpnSignInEvents contient les connexions Microsoft Entra des principaux de service et des identités managées. C'est la table à utiliser quand l'acteur est une identité de charge de travail et non un utilisateur.
  options:
    a: { en: "EntraIdSignInEvents contains the interactive and non-interactive sign-ins of users, not those of service principals and managed identities.", fr: "EntraIdSignInEvents contient les connexions interactives et non interactives des utilisateurs, pas celles des principaux de service et des identités managées." }
    c: { en: "GraphAPIAuditEvents records the requests sent to the Microsoft Graph API after authentication, not the sign-ins themselves.", fr: "GraphAPIAuditEvents enregistre les requêtes envoyées à l'API Microsoft Graph après l'authentification, pas les connexions elles-mêmes." }
    d: { en: "IdentityInfo is an entity table that describes accounts; it does not record sign-in events.", fr: "IdentityInfo est une table d'entités qui décrit les comptes ; elle n'enregistre pas d'événements de connexion." }
references:
  - title: Understand the advanced hunting schema
    url: https://learn.microsoft.com/en-us/defender-xdr/advanced-hunting-schema-tables
