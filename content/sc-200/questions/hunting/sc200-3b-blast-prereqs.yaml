id: sc200-3b-blast-prereqs
objective: "3.1.5"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Adatum uses Microsoft Defender XDR and a Microsoft Sentinel workspace that is onboarded to the Microsoft Defender portal.

    An analyst named **Analyst1** investigates incidents in the Defender portal and reports that blast radius isn't available in the incident graph. You need to check the prerequisites of blast radius.

    Which two requirements must be met?

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum utilise Microsoft Defender XDR et un espace de travail Microsoft Sentinel intégré au portail Microsoft Defender.

    Un analyste nommé **Analyst1** examine les incidents dans le portail Defender et signale que le rayon d'impact n'est pas disponible dans le graphe de l'incident. Vous devez vérifier les prérequis du rayon d'impact.

    Quelles sont les deux conditions qui doivent être remplies ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "The tenant is onboarded to the Microsoft Sentinel data lake.", fr: "Le locataire est intégré au data lake Microsoft Sentinel." } }
    - { id: b, text: { en: "Analyst1 has the Exposure management (read) permission or higher.", fr: "Analyst1 dispose de l'autorisation Exposure management (read) ou supérieure." } }
    - { id: c, text: { en: "Analyst1 has the Microsoft Sentinel Contributor role on the workspace.", fr: "Analyst1 dispose du rôle Microsoft Sentinel Contributor sur l'espace de travail." } }
    - { id: d, text: { en: "Analyst1 has the Security Copilot Contributor role.", fr: "Analyst1 dispose du rôle Security Copilot Contributor." } }
    - { id: e, text: { en: "User and Entity Behavior Analytics (UEBA) is enabled in Microsoft Sentinel.", fr: "L'analyse du comportement des utilisateurs et des entités (UEBA) est activée dans Microsoft Sentinel." } }
answer: { optionIds: [ a, b ] }
explanation:
  correct:
    en: |
      Blast radius is built on the Microsoft Sentinel data lake and graph infrastructure, so the tenant must be onboarded to the data lake. The user also needs the Exposure management (read) permission or higher, granted through Microsoft Defender unified RBAC.
    fr: |
      Le rayon d'impact repose sur l'infrastructure du data lake et du graphe Microsoft Sentinel : le locataire doit donc être intégré au data lake. L'utilisateur a aussi besoin de l'autorisation Exposure management (read) ou supérieure, accordée via le RBAC unifié de Microsoft Defender.
  options:
    c: { en: "Microsoft Sentinel Contributor manages workspace content such as analytics rules; it isn't the permission that blast radius checks.", fr: "Microsoft Sentinel Contributor gère le contenu de l'espace de travail, comme les règles d'analytique ; ce n'est pas l'autorisation que vérifie le rayon d'impact." }
    d: { en: "Security Copilot roles control Copilot features; blast radius doesn't require them.", fr: "Les rôles Security Copilot contrôlent les fonctionnalités de Copilot ; le rayon d'impact ne les exige pas." }
    e: { en: "UEBA builds behavior profiles and anomalies; it isn't a prerequisite of blast radius.", fr: "UEBA crée des profils de comportement et des anomalies ; ce n'est pas un prérequis du rayon d'impact." }
references:
  - title: Investigate incidents in the Microsoft Defender portal
    url: https://learn.microsoft.com/en-us/defender-xdr/investigate-incidents
