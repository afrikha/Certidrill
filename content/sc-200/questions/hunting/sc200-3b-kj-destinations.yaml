id: sc200-3b-kj-destinations
objective: "3.2.2"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Wingtip Toys is onboarded to the Microsoft Sentinel data lake. Its Microsoft Sentinel workspace is named **SOC-WS**. An earlier KQL job created the table **ThreatIPs_KQL_CL** in SOC-WS.

    You plan three new KQL jobs. Which destination should you select for each job? To answer, drag the appropriate destinations to the correct jobs. Each destination may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Wingtip Toys est intégré au data lake Microsoft Sentinel. Son espace de travail Microsoft Sentinel se nomme **SOC-WS**. Une tâche KQL antérieure a créé la table **ThreatIPs_KQL_CL** dans SOC-WS.

    Vous prévoyez trois nouvelles tâches KQL. Quelle destination devez-vous sélectionner pour chaque tâche ? Pour répondre, faites glisser les destinations appropriées vers les tâches correspondantes. Chaque destination peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: sysnew, text: { en: "System tables, new table", fr: "System tables, nouvelle table" } }
    - { id: wsnew, text: { en: "SOC-WS, new table", fr: "SOC-WS, nouvelle table" } }
    - { id: wsexist, text: { en: "SOC-WS, Add to an existing table", fr: "SOC-WS, Add to an existing table" } }
    - { id: fed, text: { en: "A federated Microsoft Entra ID table", fr: "Une table fédérée Microsoft Entra ID" } }
  targets:
    - id: t1
      text: { en: "Store a daily traffic baseline at the lowest storage cost, for later analysis in notebooks", fr: "Stocker une référence quotidienne du trafic au coût de stockage le plus bas, pour une analyse ultérieure dans des notebooks" }
    - id: t2
      text: { en: "Write sign-in anomalies to a new table that scheduled analytics rules in SOC-WS can query", fr: "Écrire les anomalies de connexion dans une nouvelle table que les règles d'analytique planifiées de SOC-WS peuvent interroger" }
    - id: t3
      text: { en: "Add newly matched malicious IP addresses to ThreatIPs_KQL_CL", fr: "Ajouter les adresses IP malveillantes nouvellement détectées à ThreatIPs_KQL_CL" }
answer:
  mapping: { t1: sysnew, t2: wsnew, t3: wsexist }
explanation:
  correct:
    en: |
      Selecting System tables writes a new table to the data lake tier, which costs less than the analytics tier and is read by notebooks. Analytics rules query only the analytics tier, so the anomalies go to a new table in SOC-WS. To append results to ThreatIPs_KQL_CL, select Add to an existing table; the query must match its schema.
    fr: |
      Sélectionner System tables écrit une nouvelle table au niveau data lake, moins coûteux que le niveau Analytics et lu par les notebooks. Les règles d'analytique n'interrogent que le niveau Analytics : les anomalies vont donc dans une nouvelle table de SOC-WS. Pour ajouter des résultats à ThreatIPs_KQL_CL, sélectionnez Add to an existing table ; la requête doit correspondre à son schéma.
  options:
    fed: { en: "KQL jobs can read federated tables but can't write results to them.", fr: "Les tâches KQL peuvent lire les tables fédérées, mais pas y écrire de résultats." }
references:
  - title: Create KQL jobs in the Microsoft Sentinel data lake
    url: https://learn.microsoft.com/en-us/azure/sentinel/datalake/kql-jobs
