id: sc200-3b-hq-bookmark-incident
objective: "3.2.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Wingtip Toys uses Microsoft Sentinel in the Azure portal. While running a hunting query, you find four result rows that show an attacker creating a scheduled task on a server.

    You need to keep these rows, together with the query that produced them, as evidence attached to the existing incident 2214.

    Which two actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Wingtip Toys utilise Microsoft Sentinel dans le portail Azure. En exécutant une requête de chasse, vous trouvez quatre lignes de résultats qui montrent un attaquant en train de créer une tâche planifiée sur un serveur.

    Vous devez conserver ces lignes, avec la requête qui les a produites, comme preuves rattachées à l'incident existant 2214.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Select the four rows and select Add bookmark.", fr: "Sélectionner les quatre lignes et sélectionner Add bookmark." } }
    - { id: b, text: { en: "Select New alert rule > Create Microsoft Sentinel alert.", fr: "Sélectionner New alert rule > Create Microsoft Sentinel alert." } }
    - { id: c, text: { en: "Select the bookmarks, and then select Incident actions > Add to existing incident.", fr: "Sélectionner les signets, puis sélectionner Incident actions > Add to existing incident." } }
    - { id: d, text: { en: "Add the hunting query to the favorites.", fr: "Ajouter la requête de chasse aux favoris." } }
    - { id: e, text: { en: "Clone the hunting query and add the incident number to its description.", fr: "Cloner la requête de chasse et ajouter le numéro de l'incident à sa description." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |
      A hunting bookmark preserves the selected result rows and the source query, with optional tags, notes and entity mappings. From the Bookmarks tab, Incident actions lets you create a new incident from bookmarks or add them to an existing incident, where they appear in the incident's bookmarks.
    fr: |
      Un signet de chasse conserve les lignes de résultats sélectionnées et la requête source, avec des étiquettes, des notes et des mappages d'entités facultatifs. Depuis l'onglet Bookmarks, Incident actions permet de créer un nouvel incident à partir de signets ou de les ajouter à un incident existant, où ils apparaissent dans les signets de l'incident.
  options:
    b: { en: "An analytics rule runs the query on a schedule and creates new alerts; it doesn't attach these rows to incident 2214.", fr: "Une règle d'analytique exécute la requête selon une planification et crée de nouvelles alertes ; elle ne rattache pas ces lignes à l'incident 2214." }
    d: { en: "Favorites only make the query run when the Hunting page opens.", fr: "Les favoris font seulement exécuter la requête à l'ouverture de la page Hunting." }
    e: { en: "A cloned query keeps no result rows and isn't linked to the incident.", fr: "Une requête clonée ne conserve aucune ligne de résultats et n'est pas liée à l'incident." }
references:
  - title: Hunt with bookmarks in Microsoft Sentinel
    url: https://learn.microsoft.com/en-us/azure/sentinel/bookmarks
