id: sc200-3a-ta-multi-exposure-level
objective: "3.1.4"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove Bank uses Microsoft Defender XDR with Microsoft Defender for Endpoint and Microsoft Defender Vulnerability Management. A manager asks why a threat analytics report shows a high exposure level for the bank although no alert related to the threat was raised.

    Which two factors are used to calculate the exposure level shown in a threat analytics report?

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove Bank utilise Microsoft Defender XDR avec Microsoft Defender for Endpoint et Microsoft Defender Vulnerability Management. Un responsable demande pourquoi un rapport d'analytique des menaces indique un niveau d'exposition élevé pour la banque alors qu'aucune alerte liée à la menace n'a été déclenchée.

    Quels sont les deux facteurs utilisés pour calculer le niveau d'exposition affiché dans un rapport d'analytique des menaces ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "The number of active and resolved alerts related to the threat", fr: "Le nombre d'alertes actives et résolues liées à la menace" } }
    - { id: b, text: { en: "The severity of the vulnerabilities and misconfigurations that the threat exploits", fr: "La gravité des vulnérabilités et des erreurs de configuration exploitées par la menace" } }
    - { id: c, text: { en: "The number and severity of the related incidents", fr: "Le nombre et la gravité des incidents associés" } }
    - { id: d, text: { en: "The number of devices of the organization that could be exploited", fr: "Le nombre d'appareils de l'organisation qui pourraient être exploités" } }
    - { id: e, text: { en: "The Microsoft Secure Score of the tenant", fr: "Le Microsoft Secure Score du locataire" } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: Exposure is based on the severity of the vulnerabilities and misconfigurations linked to the threat and on the number of devices in your organization that could be exploited. It measures how vulnerable you are, so it can be high before any attack.
    fr: |
      L'exposition repose sur la gravité des vulnérabilités et des erreurs de configuration liées à la menace et sur le nombre d'appareils de votre organisation qui pourraient être exploités. Elle mesure votre vulnérabilité : elle peut donc être élevée avant toute attaque.
  options:
    a: { en: "Alert counts are used to calculate the impact of the threat, not the exposure.", fr: "Le nombre d'alertes sert à calculer l'impact de la menace, pas l'exposition." }
    c: { en: "The related incidents and their severity are part of the impact, not the exposure.", fr: "Les incidents associés et leur gravité font partie de l'impact, pas de l'exposition." }
    e: { en: "Secure Score tracks the recommended actions, but the exposure level isn't calculated from the tenant score.", fr: "Secure Score suit les actions recommandées, mais le niveau d'exposition n'est pas calculé à partir du score du locataire." }
references:
  - title: Threat analytics in Microsoft Defender
    url: https://learn.microsoft.com/en-us/defender-xdr/threat-analytics
