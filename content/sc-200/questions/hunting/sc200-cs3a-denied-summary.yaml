id: sc200-cs3a-denied-summary
objective: "3.2.3"
type: single
caseStudy: sc200-cs3a-trey-research
difficulty: 2
status: draft
stem:
  en: |
    The CommonSecurityLog table is moved to the Data lake tier. You need to meet the requirement for the denied connections. What should the detection engineers create?
  fr: |
    La table CommonSecurityLog est déplacée vers le niveau Data lake. Vous devez respecter l'exigence relative aux connexions refusées. Que doivent créer les ingénieurs de détection ?
body:
  options:
    - { id: a, text: { en: "A scheduled KQL job in the data lake that writes to a new table in the Analytics tier", fr: "Une tâche KQL planifiée dans le data lake qui écrit dans une nouvelle table du niveau Analytics" } }
    - { id: b, text: { en: "A near-real-time (NRT) analytics rule that queries CommonSecurityLog", fr: "Une règle d'analytique quasi en temps réel (NRT) qui interroge CommonSecurityLog" } }
    - { id: c, text: { en: "A summary rule that writes to a custom table in the Analytics tier", fr: "Une règle de synthèse qui écrit dans une table personnalisée du niveau Analytics" } }
    - { id: d, text: { en: "A workbook that queries CommonSecurityLog with a one-hour time range", fr: "Un classeur qui interroge CommonSecurityLog avec un intervalle de temps d'une heure" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      A summary rule aggregates verbose data on a schedule, including data in low-cost tiers, and writes the results to a custom _CL table that uses the Analytics plan, where analytics rules can query it. Creating a summary rule requires the Microsoft Sentinel Contributor role, which the detection engineers already have on RG-SOC.
    fr: |
      Une règle de synthèse agrège des données volumineuses selon une planification, y compris des données de niveaux à faible coût, et écrit les résultats dans une table personnalisée _CL qui utilise le plan Analytics, où les règles d'analytique peuvent l'interroger. La création d'une règle de synthèse demande le rôle Microsoft Sentinel Contributor, que les ingénieurs de détection ont déjà sur RG-SOC.
  options:
    a: { en: "A KQL job could produce the table, but creating and managing data lake jobs requires a Microsoft Entra role such as Security Operator, and the detection engineers have no Microsoft Entra roles.", fr: "Une tâche KQL pourrait produire la table, mais créer et gérer des tâches du data lake demande un rôle Microsoft Entra tel que Security Operator, et les ingénieurs de détection n'ont aucun rôle Microsoft Entra." }
    b: { en: "Analytics rules do not run on Data lake tier tables, and an NRT rule creates alerts, not an aggregated table.", fr: "Les règles d'analytique ne s'exécutent pas sur les tables du niveau Data lake, et une règle NRT crée des alertes, pas une table agrégée." }
    d: { en: "A workbook only visualizes data; it does not store a table that an analytics rule can query, and workbooks are limited on the Data lake tier.", fr: "Un classeur ne fait que visualiser des données ; il ne stocke pas de table qu'une règle d'analytique peut interroger, et les classeurs sont limités sur le niveau Data lake." }
references:
  - title: Aggregate Microsoft Sentinel data with summary rules
    url: https://learn.microsoft.com/en-us/azure/sentinel/summary-rules
  - title: Roles and permissions in the Microsoft Sentinel platform
    url: https://learn.microsoft.com/en-us/azure/sentinel/roles
