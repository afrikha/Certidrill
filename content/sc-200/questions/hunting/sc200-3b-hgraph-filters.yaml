id: sc200-3b-hgraph-filters
objective: "3.1.5"
type: hotarea
difficulty: 2
status: draft
stem:
  en: |
    You run the **Users with access to sensitive data** hunting graph scenario in Microsoft Defender advanced hunting. The **Add filter** options of the scenario are shown in the following table.

    Answer each prompt by selecting the filter value that you should add.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous exécutez le scénario de graphe de chasse **Users with access to sensitive data** dans le repérage avancé de Microsoft Defender. Les options **Add filter** du scénario figurent dans le tableau suivant.

    Répondez à chaque consigne en sélectionnant la valeur de filtre à ajouter.

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
    - id: p1
      text: { en: "Keep only the paths that start from a node classified as critical", fr: "Ne conserver que les chemins qui partent d'un nœud classé comme critique" }
    - id: p2
      text: { en: "Keep only the relationships in which one node holds the credentials of another node", fr: "Ne conserver que les relations dans lesquelles un nœud détient les informations d'identification d'un autre nœud" }
  grid:
    header: [{ en: "Filter", fr: "Filtre" }, { en: "Value 1", fr: "Valeur 1" }, { en: "Value 2", fr: "Valeur 2" }, { en: "Value 3", fr: "Valeur 3" }]
    rows:
      - [{ text: Source node }, { text: Is critical, area: src-crit }, { text: Is vulnerable, area: src-vuln }, { text: Is exposed to the internet, area: src-inet }]
      - [{ text: Target node }, { text: Has sensitive data, area: tgt-data }, { text: Has risk score, area: tgt-risk }, { text: Is vulnerable, area: tgt-vuln }]
      - [{ text: Edge type }, { text: member of, area: e-member }, { text: has credentials of, area: e-cred }, { text: can authenticate as, area: e-auth }]
      - [{ text: Edge direction }, { text: Incoming, area: d-in }, { text: Outgoing, area: d-out }, { text: Both, area: d-both }]
answer:
  values: { p1: src-crit, p2: e-cred }
explanation:
  correct:
    en: |
      Properties of the node where a path begins are filtered with Source node, so Is critical on Source node keeps paths that start from critical nodes. Relationship types are filtered with Edge type, and has credentials of is the edge for a node that holds the credentials of another. Target node filters describe where paths end, and can authenticate as describes an authentication relationship, not stored credentials.
    fr: |
      Les propriétés du nœud où commence un chemin se filtrent avec Source node : Is critical sur Source node conserve les chemins qui partent de nœuds critiques. Les types de relations se filtrent avec Edge type, et has credentials of est l'arête d'un nœud qui détient les informations d'identification d'un autre. Les filtres Target node décrivent l'arrivée des chemins, et can authenticate as décrit une relation d'authentification, pas des informations d'identification détenues.
references:
  - title: Hunt for threats using the hunting graph
    url: https://learn.microsoft.com/en-us/defender-xdr/advanced-hunting-graph
