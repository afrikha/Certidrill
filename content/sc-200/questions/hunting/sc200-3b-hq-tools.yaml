id: sc200-3b-hq-tools
objective: "3.2.1"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Adatum uses Microsoft Sentinel in the Microsoft Defender portal and is onboarded to the Microsoft Sentinel data lake. Its threat hunting team has four requirements.

    Which feature should the team use for each requirement? To answer, drag the appropriate features to the correct requirements. Each feature may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum utilise Microsoft Sentinel dans le portail Microsoft Defender et est intégré au data lake Microsoft Sentinel. Son équipe de chasse aux menaces a quatre besoins.

    Quelle fonctionnalité l'équipe doit-elle utiliser pour chaque besoin ? Pour répondre, faites glisser les fonctionnalités appropriées vers les besoins correspondants. Chaque fonctionnalité peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: hunt, text: { en: "Hunt", fr: "Chasse (hunt)" } }
    - { id: kql, text: { en: "KQL job", fr: "Tâche KQL" } }
    - { id: nb, text: { en: "Jupyter notebook", fr: "Notebook Jupyter" } }
    - { id: fav, text: { en: "Favorite query", fr: "Requête favorite" } }
    - { id: nrt, text: { en: "Near-real-time (NRT) analytics rule", fr: "Règle d'analytique en quasi-temps réel (NRT)" } }
    - { id: live, text: Livestream }
  targets:
    - id: t1
      text: { en: "Run a hunting query automatically each time an analyst opens the Hunting page", fr: "Exécuter automatiquement une requête de chasse chaque fois qu'un analyste ouvre la page Hunting" }
    - id: t2
      text: { en: "During a compromise, persist the results of a query over historical data to the data lake", fr: "Pendant une compromission, rendre persistants dans le data lake les résultats d'une requête sur des données historiques" }
    - id: t3
      text: { en: "Analyze hunting data with Python libraries such as MSTICPy", fr: "Analyser des données de chasse avec des bibliothèques Python comme MSTICPy" }
    - id: t4
      text: { en: "Generate an alert within minutes each time new events match a hunting query", fr: "Générer une alerte en quelques minutes chaque fois que de nouveaux événements correspondent à une requête de chasse" }
answer:
  mapping: { t1: fav, t2: kql, t3: nb, t4: nrt }
explanation:
  correct:
    en: |
      A favorite hunting query runs automatically each time the Hunting page opens. During a compromise, Microsoft recommends KQL jobs to persist results to the data lake. Jupyter notebooks support Python libraries such as MSTICPy. Livestream sessions are no longer available, and an NRT analytics rule now alerts on new matches within minutes.
    fr: |
      Une requête de chasse favorite s'exécute automatiquement à chaque ouverture de la page Hunting. Pendant une compromission, Microsoft recommande les tâches KQL pour rendre les résultats persistants dans le data lake. Les notebooks Jupyter prennent en charge des bibliothèques Python comme MSTICPy. Les sessions de livestream ne sont plus disponibles, et une règle d'analytique NRT génère désormais une alerte sur les nouvelles correspondances en quelques minutes.
  options:
    hunt: { en: "A hunt (preview) tracks a hypothesis with its queries and bookmarks; it doesn't run a query when the Hunting page opens or generate alerts.", fr: "Une chasse (préversion) suit une hypothèse avec ses requêtes et ses signets ; elle n'exécute pas de requête à l'ouverture de la page Hunting et ne génère pas d'alerte." }
    live: { en: "Livestream is no longer available; KQL jobs, analytics rules and playbooks replace it.", fr: "Livestream n'est plus disponible ; les tâches KQL, les règles d'analytique et les playbooks le remplacent." }
references:
  - title: Threat hunting in Microsoft Sentinel
    url: https://learn.microsoft.com/en-us/azure/sentinel/hunting
