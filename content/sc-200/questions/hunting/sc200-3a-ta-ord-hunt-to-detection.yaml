id: sc200-3a-ta-ord-hunt-to-detection
objective: "3.1.4"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam, Inc. uses Microsoft Defender XDR. Microsoft published a threat analytics report about a loader that your current detections might miss.

    You need to look for past activity of the loader in your environment by using the hunting guidance written by Microsoft analysts, and then be alerted automatically if the same activity occurs again.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Fabrikam, Inc. utilise Microsoft Defender XDR. Microsoft a publié un rapport d'analytique des menaces sur un chargeur que vos détections actuelles pourraient manquer.

    Vous devez rechercher l'activité passée de ce chargeur dans votre environnement à l'aide des conseils de chasse rédigés par les analystes Microsoft, puis être alerté automatiquement si la même activité se reproduit.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: open, text: { en: "Open **Threat analytics** and select the report.", fr: "Ouvrir **Threat analytics** et sélectionner le rapport." } }
    - { id: analyst, text: { en: "Select the **Analyst report** tab and copy the advanced hunting query.", fr: "Sélectionner l'onglet **Analyst report** et copier la requête de repérage avancé." } }
    - { id: run, text: { en: "Paste and run the query in **Advanced hunting**.", fr: "Coller et exécuter la requête dans **Advanced hunting**." } }
    - { id: rule, text: { en: "Select **Create detection rule**.", fr: "Sélectionner **Create detection rule**." } }
    - { id: notif, text: { en: "Configure email notifications for updates of the report.", fr: "Configurer des notifications par e-mail pour les mises à jour du rapport." } }
    - { id: actions, text: { en: "Select the **Recommended actions** tab and review the mitigations.", fr: "Sélectionner l'onglet **Recommended actions** et examiner les atténuations." } }
    - { id: link, text: { en: "Select **Link to incident**.", fr: "Sélectionner **Link to incident**." } }
answer:
  sequence: [ open, analyst, run, rule ]
explanation:
  correct:
    en: The advanced hunting guidance is in the Analyst report tab of the report. Its KQL queries, vetted by Microsoft analysts, run in the advanced hunting editor to find past activity, and you can convert a query into a custom detection rule that alerts on future matches.
    fr: Les conseils de repérage avancé se trouvent dans l'onglet Analyst report du rapport. Ses requêtes KQL, validées par les analystes Microsoft, s'exécutent dans l'éditeur du repérage avancé pour trouver l'activité passée, et vous pouvez convertir une requête en règle de détection personnalisée qui alerte sur les correspondances futures.
  options:
    notif: { en: "Email notifications inform you of report updates; they don't search your data or create alerts.", fr: "Les notifications par e-mail vous informent des mises à jour des rapports ; elles ne recherchent pas dans vos données et ne créent pas d'alertes." }
    actions: { en: "Recommended actions lists mitigations tracked in Secure Score, not hunting queries.", fr: "Recommended actions liste des atténuations suivies dans Secure Score, pas des requêtes de chasse." }
    link: { en: "Link to incident attaches results to an incident; it doesn't create future alerts.", fr: "Link to incident rattache des résultats à un incident ; il ne crée pas d'alertes futures." }
references:
  - title: Analyst report in threat analytics
    url: https://learn.microsoft.com/en-us/defender-xdr/threat-analytics-analyst-reports
  - title: Create custom detection rules in Microsoft Defender XDR
    url: https://learn.microsoft.com/en-us/defender-xdr/custom-detection-rules
