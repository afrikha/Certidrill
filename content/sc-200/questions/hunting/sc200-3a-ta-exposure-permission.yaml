id: sc200-3a-ta-exposure-permission
objective: "3.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Adatum Corporation uses Microsoft Defender XDR with Microsoft Defender Unified role-based access control (RBAC). An analyst named Analyst1 has a custom role that grants **Security data basics (read)**.

    Analyst1 can open threat analytics reports and see their related incidents and impacted assets, but can't see the exposure data and the recommended actions of the reports. You need Analyst1 to see this information. The solution must follow the principle of least privilege.

    Which permissions should you add to the role?
  fr: |
    Adatum Corporation utilise Microsoft Defender XDR avec le contrôle d'accès en fonction du rôle (RBAC) unifié de Microsoft Defender. Un analyste nommé Analyst1 dispose d'un rôle personnalisé qui accorde **Security data basics (read)**.

    Analyst1 peut ouvrir les rapports d'analytique des menaces et voir leurs incidents associés et leurs ressources touchées, mais pas les données d'exposition ni les actions recommandées des rapports. Analyst1 doit voir ces informations. La solution doit respecter le principe du moindre privilège.

    Quelles autorisations devez-vous ajouter au rôle ?
body:
  options:
    - { id: a, text: "Response (manage)" }
    - { id: b, text: "Security settings (manage)" }
    - { id: c, text: "Email & collaboration metadata (read)" }
    - { id: d, text: "Vulnerability management (read) and Exposure Management (read)" }
answer: { optionId: d }
explanation:
  correct:
    en: Security data basics (read) is enough to view the reports, their related incidents and alerts, and the impacted assets. The exposure data and the recommended actions also require Vulnerability management (read) and Exposure Management (read), which are read-only permissions.
    fr: Security data basics (read) suffit pour consulter les rapports, leurs incidents et alertes associés, et les ressources touchées. Les données d'exposition et les actions recommandées exigent en plus Vulnerability management (read) et Exposure Management (read), qui sont des autorisations en lecture seule.
  options:
    a: { en: "Response (manage) allows remediation actions, not the exposure data of threat analytics, and it isn't read-only.", fr: "Response (manage) permet des actions de correction, pas l'affichage des données d'exposition de l'analytique des menaces, et ce n'est pas une autorisation en lecture seule." }
    b: { en: "Security settings (manage) allows managing settings such as custom detections; it grants more than needed and not the exposure data.", fr: "Security settings (manage) permet de gérer des paramètres comme les détections personnalisées ; il accorde plus que nécessaire et pas les données d'exposition." }
    c: { en: "Email & collaboration metadata (read) grants access to the email tables of advanced hunting, not to exposure data.", fr: "Email & collaboration metadata (read) donne accès aux tables d'e-mails du repérage avancé, pas aux données d'exposition." }
references:
  - title: Threat analytics in Microsoft Defender
    url: https://learn.microsoft.com/en-us/defender-xdr/threat-analytics
