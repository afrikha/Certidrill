id: sc200-cs2b-kql-job-timegenerated
objective: "3.2.2"
type: single
caseStudy: sc200-cs2b-consolidated-messenger
difficulty: 3
status: draft
stem:
  en: |
    You need to resolve the issue with FwMonthly_KQL_CL. The job must keep running once a month.

    What should you do?
  fr: |
    Vous devez résoudre le problème de FwMonthly_KQL_CL. La tâche doit continuer à s'exécuter une fois par mois.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "In the job query, add project TimeGenerated as the first column of the output", fr: "Dans la requête de la tâche, ajouter project TimeGenerated comme première colonne de la sortie" } }
    - { id: b, text: { en: "In the job query, add extend EventTime = TimeGenerated before the output columns", fr: "Dans la requête de la tâche, ajouter extend EventTime = TimeGenerated avant les colonnes de sortie" } }
    - { id: c, text: { en: "Change the job destination to a new table in the analytics tier with a name that ends with _CL", fr: "Modifier la destination de la tâche vers une nouvelle table du niveau Analytics dont le nom se termine par _CL" } }
    - { id: d, text: { en: "Change the job schedule so that its From time is 30 minutes after the job is saved", fr: "Modifier la planification de la tâche pour que son heure From soit 30 minutes après l'enregistrement de la tâche" } }
answer: { optionId: b }
explanation:
  correct:
    en: When a KQL job writes to its destination table, TimeGenerated is overwritten for rows older than two days, which is the case for most rows of a monthly job. Copying TimeGenerated into a separate column, such as EventTime, keeps the original event time in FwMonthly_KQL_CL.
    fr: Quand une tâche KQL écrit dans sa table de destination, TimeGenerated est remplacé pour les lignes de plus de deux jours, ce qui est le cas de la plupart des lignes d'une tâche mensuelle. Copier TimeGenerated dans une colonne distincte, par exemple EventTime, conserve l'heure d'origine des événements dans FwMonthly_KQL_CL.
  options:
    a: { en: "Projecting TimeGenerated does not prevent ingestion from overwriting it in the destination table.", fr: "Projeter TimeGenerated n'empêche pas l'ingestion de le remplacer dans la table de destination." }
    c: { en: "New analytics-tier tables created by a KQL job always get the _KQL_CL suffix, and the table name has no effect on how TimeGenerated is written.", fr: "Les nouvelles tables du niveau Analytics créées par une tâche KQL reçoivent toujours le suffixe _KQL_CL, et le nom de la table n'a aucun effet sur la façon dont TimeGenerated est écrit." }
    d: { en: "The From time of a scheduled job only sets when the schedule starts; it does not change how TimeGenerated is written.", fr: "L'heure From d'une tâche planifiée détermine seulement le début de la planification ; elle ne change pas la façon dont TimeGenerated est écrit." }
references:
  - title: Create KQL jobs in the Microsoft Sentinel data lake
    url: https://learn.microsoft.com/en-us/azure/sentinel/datalake/kql-jobs
