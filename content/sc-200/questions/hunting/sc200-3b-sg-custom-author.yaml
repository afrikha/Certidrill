id: sc200-3b-sg-custom-author
objective: "3.1.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam is onboarded to the Microsoft Sentinel data lake, which stores the EmailEvents, UrlClickEvents and DeviceNetworkEvents tables.

    You need to model a phishing kill chain as a graph whose node and edge types you define from these tables. Analysts must then query the graph by using Graph Query Language (GQL).

    What should you use to author the graph?
  fr: |
    Fabrikam est intégré au data lake Microsoft Sentinel, qui stocke les tables EmailEvents, UrlClickEvents et DeviceNetworkEvents.

    Vous devez modéliser une chaîne d'attaque par hameçonnage sous forme de graphe dont vous définissez les types de nœuds et d'arêtes à partir de ces tables. Les analystes doivent ensuite interroger le graphe avec le langage GQL (Graph Query Language).

    Que devez-vous utiliser pour créer le graphe ?
body:
  options:
    - { id: a, text: { en: "A hunting graph in advanced hunting, with the Entity relationship map scenario", fr: "Un graphe de chasse dans le repérage avancé, avec le scénario Entity relationship map" } }
    - { id: b, text: { en: "A KQL job that runs make-graph and writes its output to a _KQL_CL table", fr: "Une tâche KQL qui exécute make-graph et écrit sa sortie dans une table _KQL_CL" } }
    - { id: c, text: { en: "A Jupyter notebook in Visual Studio Code with the Microsoft Sentinel extension", fr: "Un notebook Jupyter dans Visual Studio Code avec l'extension Microsoft Sentinel" } }
    - { id: d, text: { en: "A Microsoft Sentinel workbook with a graph visualization", fr: "Un classeur Microsoft Sentinel avec une visualisation de graphe" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Custom graphs are authored in Jupyter notebooks provided by the Microsoft Sentinel extension for Visual Studio Code. You define nodes and edges from data lake tables with the sentinel_graph library, publish the graph with a graph job and query it with GQL.
    fr: |
      Les graphes personnalisés se créent dans des notebooks Jupyter fournis par l'extension Microsoft Sentinel pour Visual Studio Code. Vous définissez les nœuds et les arêtes à partir des tables du data lake avec la bibliothèque sentinel_graph, publiez le graphe avec une tâche de graphe et l'interrogez en GQL.
  options:
    a: { en: "Hunting graph scenarios are predefined; you can't define your own node and edge types from lake tables.", fr: "Les scénarios du graphe de chasse sont prédéfinis ; vous ne pouvez pas définir vos propres types de nœuds et d'arêtes à partir des tables du lake." }
    b: { en: "A KQL job writes tabular results to a table; it doesn't publish a graph that can be queried with GQL.", fr: "Une tâche KQL écrit des résultats tabulaires dans une table ; elle ne publie pas de graphe interrogeable en GQL." }
    d: { en: "A workbook visualizes query results; it doesn't create a persisted graph queried with GQL.", fr: "Un classeur visualise des résultats de requêtes ; il ne crée pas de graphe persistant interrogé en GQL." }
references:
  - title: Custom graphs in Microsoft Sentinel overview (preview)
    url: https://learn.microsoft.com/en-us/azure/sentinel/datalake/custom-graphs-overview
