id: sc200-3a-ah-ord-save-shared
objective: "3.1.3"
type: ordering
difficulty: 1
status: draft
stem:
  en: |
    Litware, Inc. uses Microsoft Defender XDR. You wrote a hunting query for a new phishing technique in **Advanced hunting**.

    You need to make the query available in the **Queries** tab of every analyst in your organization.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Litware, Inc. utilise Microsoft Defender XDR. Vous avez écrit dans **Advanced hunting** une requête de chasse pour une nouvelle technique d'hameçonnage.

    Vous devez rendre la requête disponible dans l'onglet **Queries** de tous les analystes de votre organisation.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: write, text: { en: "Finalize the query in the query editor.", fr: "Finaliser la requête dans l'éditeur de requêtes." } }
    - { id: saveas, text: { en: "Select the **Save query** drop-down button, and then select **Save as**.", fr: "Sélectionner le bouton déroulant **Save query**, puis **Save as**." } }
    - { id: nameshared, text: { en: "Enter a name for the query and select the **Shared queries** folder.", fr: "Saisir un nom pour la requête et sélectionner le dossier **Shared queries**." } }
    - { id: save, text: { en: "Select **Save**.", fr: "Sélectionner **Save**." } }
    - { id: namemy, text: { en: "Enter a name for the query and select the **My queries** folder.", fr: "Saisir un nom pour la requête et sélectionner le dossier **My queries**." } }
    - { id: link, text: { en: "Select **Share link**.", fr: "Sélectionner **Share link**." } }
answer:
  sequence: [ write, saveas, nameshared, save ]
explanation:
  correct:
    en: You save a query with Save query, Save as, a name and a folder, then Save. The Shared queries folder makes the query visible to all users of the organization in the Queries tab.
    fr: Vous enregistrez une requête avec Save query, Save as, un nom et un dossier, puis Save. Le dossier Shared queries rend la requête visible par tous les utilisateurs de l'organisation dans l'onglet Queries.
  options:
    namemy: { en: "Queries saved in My queries are accessible only to you.", fr: "Les requêtes enregistrées dans My queries ne sont accessibles qu'à vous." }
    link: { en: "Share link creates a link that opens the query in the editor; it doesn't add the query to the Queries tab of other analysts.", fr: "Share link crée un lien qui ouvre la requête dans l'éditeur ; il n'ajoute pas la requête à l'onglet Queries des autres analystes." }
references:
  - title: Use shared queries in advanced hunting
    url: https://learn.microsoft.com/en-us/defender-xdr/advanced-hunting-shared-queries
