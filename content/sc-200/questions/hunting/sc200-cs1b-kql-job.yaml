id: sc200-cs1b-kql-job
objective: "3.2.2"
type: single
caseStudy: sc200-cs1b-city-power-light
difficulty: 2
status: draft
stem:
  en: |
    You configure the tables to meet the retention requirement.

    You need to meet the investigations requirement.

    What should you create?
  fr: |
    Vous configurez les tables pour respecter l'exigence de rétention.

    Vous devez respecter l'exigence relative aux enquêtes.

    Que devez-vous créer ?
body:
  options:
    - { id: a, text: { en: "A hunting query that filters CommonSecurityLog on the IP address over 18 months", fr: "Une requête de chasse qui filtre CommonSecurityLog sur l'adresse IP sur 18 mois" } }
    - { id: b, text: { en: "A one-time KQL job that writes the filtered events to a new analytics tier table", fr: "Une tâche KQL ponctuelle qui écrit les événements filtrés dans une nouvelle table du niveau Analytics" } }
    - { id: c, text: { en: "A scheduled analytics rule that queries CommonSecurityLog for the IP address", fr: "Une règle d'analytique planifiée qui recherche l'adresse IP dans CommonSecurityLog" } }
    - { id: d, text: { en: "A workbook with a query that filters CommonSecurityLog on the IP address", fr: "Un classeur avec une requête qui filtre CommonSecurityLog sur l'adresse IP" } }
answer: { optionId: b }
explanation:
  correct:
    en: "The firewall logs are stored in the data lake tier. A KQL job runs a query against data lake tables and promotes the results to the analytics tier, in a new table with the _KQL_CL suffix or an existing one, where analysts query them with the Advanced Hunting editor. A one-time job runs as soon as you submit it, and a job can cover a time range of up to 12 years."
    fr: "Les journaux des pare-feu sont stockés au niveau Data Lake. Une tâche KQL exécute une requête sur les tables du data lake et promeut les résultats au niveau Analytics, dans une nouvelle table avec le suffixe _KQL_CL ou dans une table existante, que les analystes interrogent avec l'éditeur de repérage avancé. Une tâche ponctuelle s'exécute dès que vous la soumettez, et une tâche peut couvrir une plage de temps allant jusqu'à 12 ans."
  options:
    a: { en: "Data lake tier data cannot be used by hunting queries; the query would not return the firewall events.", fr: "Les données du niveau Data Lake ne peuvent pas être utilisées par les requêtes de chasse : la requête ne renverrait pas les événements de pare-feu." }
    c: { en: "Analytics rules cannot query data lake tier data, and a rule creates alerts rather than a table to investigate.", fr: "Les règles d'analytique ne peuvent pas interroger les données du niveau Data Lake, et une règle crée des alertes plutôt qu'une table à examiner." }
    d: { en: "Workbooks cannot query data lake tier data, and a workbook does not copy events into a table.", fr: "Les classeurs ne peuvent pas interroger les données du niveau Data Lake, et un classeur ne copie pas d'événements dans une table." }
references:
  - title: Create KQL jobs in the Microsoft Sentinel data lake
    url: https://learn.microsoft.com/en-us/azure/sentinel/datalake/kql-jobs
  - title: Manage data tiers and retention in Microsoft Sentinel
    url: https://learn.microsoft.com/en-us/azure/sentinel/manage-data-overview
