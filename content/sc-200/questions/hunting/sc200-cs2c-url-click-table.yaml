id: sc200-cs2c-url-click-table
objective: "3.1.1"
type: single
caseStudy: sc200-cs2c-graphic-design-institute
difficulty: 1
status: draft
stem:
  en: |
    You need to write an advanced hunting query that meets the requirement for the recipients who selected the link.

    Which table should you query?
  fr: |
    Vous devez écrire une requête de repérage avancé qui répond à l'exigence relative aux destinataires qui ont sélectionné le lien.

    Quelle table devez-vous interroger ?
body:
  options:
    - { id: a, text: EmailUrlInfo }
    - { id: b, text: UrlClickEvents }
    - { id: c, text: DeviceNetworkEvents }
    - { id: d, text: EmailEvents }
answer: { optionId: b }
explanation:
  correct:
    en: UrlClickEvents records the Safe Links clicks from email messages, Teams and Office apps, with the AccountUpn of the user who clicked. Its IsClickedThrough column shows whether the user continued to the site after the Safe Links warning page.
    fr: UrlClickEvents enregistre les clics Liens fiables (Safe Links) depuis les e-mails, Teams et les applications Office, avec l'AccountUpn de l'utilisateur qui a cliqué. Sa colonne IsClickedThrough indique si l'utilisateur a continué vers le site après la page d'avertissement de Liens fiables.
  options:
    a: { en: "EmailUrlInfo lists the URLs contained in email messages, not the clicks on them.", fr: "EmailUrlInfo liste les URL contenues dans les e-mails, pas les clics sur ces URL." }
    c: { en: "DeviceNetworkEvents is populated by Defender for Endpoint, and the recipients' devices are not onboarded.", fr: "DeviceNetworkEvents est alimentée par Defender pour point de terminaison, et les appareils des destinataires ne sont pas intégrés." }
    d: { en: "EmailEvents records the delivery of each message, not whether a recipient clicked a link.", fr: "EmailEvents enregistre la remise de chaque message, pas le fait qu'un destinataire ait cliqué sur un lien." }
references:
  - title: UrlClickEvents table in the advanced hunting schema - Microsoft Defender XDR
    url: https://learn.microsoft.com/en-us/defender-xdr/advanced-hunting-urlclickevents-table
