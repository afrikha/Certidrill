id: sc200-3a-tbl-registry-run-key
objective: "3.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso, Ltd. uses Microsoft Defender XDR. All its Windows devices are onboarded to Microsoft Defender for Endpoint.

    A threat intelligence bulletin reports that an attacker gains persistence by adding a value under the `HKEY_CURRENT_USER\Software\Microsoft\Windows\CurrentVersion\Run` key. You need to write an advanced hunting query that finds the devices on which a new value was written under this key during the last seven days.

    Which table should you query?
  fr: |
    Contoso, Ltd. utilise Microsoft Defender XDR. Tous ses appareils Windows sont intégrés à Microsoft Defender for Endpoint.

    Un bulletin de renseignement sur les menaces indique qu'un attaquant assure sa persistance en ajoutant une valeur sous la clé `HKEY_CURRENT_USER\Software\Microsoft\Windows\CurrentVersion\Run`. Vous devez écrire une requête de repérage avancé qui trouve les appareils sur lesquels une nouvelle valeur a été écrite sous cette clé au cours des sept derniers jours.

    Quelle table devez-vous interroger ?
body:
  options:
    - { id: a, text: DeviceProcessEvents }
    - { id: b, text: DeviceEvents }
    - { id: c, text: DeviceRegistryEvents }
    - { id: d, text: DeviceFileEvents }
answer: { optionId: c }
explanation:
  correct:
    en: DeviceRegistryEvents records the creation and modification of registry entries on devices onboarded to Defender for Endpoint, with columns such as RegistryKey, RegistryValueName and RegistryValueData. Filtering it on the Run key returns the devices where a value was added.
    fr: DeviceRegistryEvents enregistre la création et la modification des entrées de registre sur les appareils intégrés à Defender for Endpoint, avec des colonnes comme RegistryKey, RegistryValueName et RegistryValueData. Un filtre sur la clé Run renvoie les appareils où une valeur a été ajoutée.
  options:
    a: { en: "DeviceProcessEvents records process creation; it shows the reg.exe command line only if a process was used, not the registry write itself.", fr: "DeviceProcessEvents enregistre la création des processus ; il montre la ligne de commande de reg.exe seulement si un processus a été utilisé, pas l'écriture dans le registre elle-même." }
    b: { en: "DeviceEvents contains miscellaneous security-control events, such as Defender Antivirus and exploit protection events, not the registry modification events.", fr: "DeviceEvents contient des événements divers de contrôles de sécurité, comme ceux de Defender Antivirus et de la protection contre les attaques, pas les événements de modification du registre." }
    d: { en: "DeviceFileEvents covers file creation, modification and other file system events, not registry values.", fr: "DeviceFileEvents couvre la création, la modification et les autres événements du système de fichiers, pas les valeurs de registre." }
references:
  - title: Understand the advanced hunting schema
    url: https://learn.microsoft.com/en-us/defender-xdr/advanced-hunting-schema-tables
