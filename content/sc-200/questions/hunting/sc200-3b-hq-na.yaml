id: sc200-3b-hq-na
objective: "3.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Tailspin installed several Content hub solutions in its Microsoft Sentinel workspace. After you select **Run all queries** on the Hunting page, several queries show **N/A** in the Results column.

    What is the most likely cause?
  fr: |
    Tailspin a installé plusieurs solutions du Content hub dans son espace de travail Microsoft Sentinel. Après avoir sélectionné **Run all queries** dans la page Hunting, plusieurs requêtes affichent **N/A** dans la colonne Results.

    Quelle est la cause la plus probable ?
body:
  options:
    - { id: a, text: { en: "The queries returned no rows during the selected time range.", fr: "Les requêtes n'ont renvoyé aucune ligne pendant la plage de temps sélectionnée." } }
    - { id: b, text: { en: "The data sources that the queries require aren't connected.", fr: "Les sources de données nécessaires aux requêtes ne sont pas connectées." } }
    - { id: c, text: { en: "The queries come from a solution and can't be run without being cloned.", fr: "Les requêtes proviennent d'une solution et ne peuvent pas être exécutées sans être clonées." } }
    - { id: d, text: { en: "The queries aren't mapped to a MITRE ATT&CK tactic.", fr: "Les requêtes ne sont mappées à aucune tactique MITRE ATT&CK." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      N/A marks hunting queries that aren't active in the environment because the data sources they need aren't connected. Hovering over the information icon shows the required data sources.
    fr: |
      N/A signale les requêtes de chasse qui ne sont pas actives dans l'environnement, car les sources de données dont elles ont besoin ne sont pas connectées. Le survol de l'icône d'information affiche les sources de données requises.
  options:
    a: { en: "N/A doesn't mean an empty result; it marks queries that aren't active because their data sources are missing.", fr: "N/A ne signifie pas un résultat vide ; il signale les requêtes inactives parce que leurs sources de données manquent." }
    c: { en: "Solution queries can be run directly; cloning is only needed to change them.", fr: "Les requêtes d'une solution s'exécutent directement ; le clonage n'est nécessaire que pour les modifier." }
    d: { en: "MITRE ATT&CK mappings classify queries; they don't decide whether a query can run.", fr: "Les mappages MITRE ATT&CK classent les requêtes ; ils ne déterminent pas si une requête peut s'exécuter." }
references:
  - title: Threat hunting in Microsoft Sentinel
    url: https://learn.microsoft.com/en-us/azure/sentinel/hunting
