id: sc200-3a-ah-ord-isolate-results
objective: "3.1.3"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove Bank uses Microsoft Defender for Endpoint. You have the permissions required to submit remediation actions on devices.

    An analyst identified a beacon pattern in DeviceNetworkEvents. You need to isolate the affected devices directly from the advanced hunting results and then verify the status of the isolation.

    Which five actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Woodgrove Bank utilise Microsoft Defender for Endpoint. Vous disposez des autorisations nécessaires pour envoyer des actions de correction sur les appareils.

    Un analyste a identifié un modèle de balisage (beacon) dans DeviceNetworkEvents. Vous devez isoler les appareils concernés directement à partir des résultats du repérage avancé, puis vérifier l'état de l'isolement.

    Quelles sont les cinq actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 5
  actions:
    - { id: run, text: { en: "Run a query that returns the DeviceId column of the affected devices.", fr: "Exécuter une requête qui renvoie la colonne DeviceId des appareils concernés." } }
    - { id: select, text: { en: "Select the records of the affected devices in the results.", fr: "Sélectionner les enregistrements des appareils concernés dans les résultats." } }
    - { id: take, text: { en: "Select **Take actions**.", fr: "Sélectionner **Take actions**." } }
    - { id: isolate, text: { en: "Select **Isolate device**, enter a remediation name and description, and submit.", fr: "Sélectionner **Isolate device**, saisir un nom et une description de correction, puis valider." } }
    - { id: center, text: { en: "Review the status of the actions in the **Action center**.", fr: "Consulter l'état des actions dans le **Action center**." } }
    - { id: link, text: { en: "Select **Link to incident**.", fr: "Sélectionner **Link to incident**." } }
    - { id: rule, text: { en: "Select **Create detection rule**.", fr: "Sélectionner **Create detection rule**." } }
answer:
  sequence: [ run, select, take, isolate, center ]
explanation:
  correct:
    en: Device actions from advanced hunting require the DeviceId column. You select the records, select Take actions, choose Isolate device and give the remediation a name and description to track it, then follow its status in the Action center, where each action is recorded in the history.
    fr: Les actions sur les appareils depuis le repérage avancé exigent la colonne DeviceId. Vous sélectionnez les enregistrements, puis Take actions, choisissez Isolate device et donnez un nom et une description à la correction pour la suivre, puis suivez son état dans le Action center, où chaque action est enregistrée dans l'historique.
  options:
    link: { en: "Link to incident attaches results to an incident; it doesn't isolate devices.", fr: "Link to incident rattache des résultats à un incident ; il n'isole pas les appareils." }
    rule: { en: "A custom detection rule runs the query on a schedule; it isn't needed to act on the current results.", fr: "Une règle de détection personnalisée exécute la requête selon une planification ; elle n'est pas nécessaire pour agir sur les résultats actuels." }
references:
  - title: Take action on advanced hunting query results
    url: https://learn.microsoft.com/en-us/defender-xdr/advanced-hunting-take-action
