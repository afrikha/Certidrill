id: sc200-cs2a-network-logon-hunt
objective: "3.1.2"
type: dropdown
caseStudy: sc200-cs2a-fourth-coffee
difficulty: 3
status: draft
stem:
  en: |
    You need to write an advanced hunting query in the Microsoft Defender portal that meets the hunting requirement.

    How should you complete the query? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez écrire une requête de repérage avancé dans le portail Microsoft Defender qui répond à l'exigence de chasse.

    Comment devez-vous compléter la requête ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: kusto
  template: |
    DeviceLogonEvents
    | where Timestamp > ago(7d)
    | where ActionType == "LogonSuccess" and LogonType == "Network"
    | summarize Devices = [[agg]](DeviceName) by AccountDomain, AccountName, [[window]]
    | where Devices [[cmp]] 10
  slots:
    - id: agg
      options:
        - { id: dcount, text: dcount }
        - { id: count, text: count }
        - { id: makeset, text: make_set }
        - { id: max, text: max }
    - id: window
      options:
        - { id: bin1h, text: "bin(Timestamp, 1h)" }
        - { id: bin7d, text: "bin(Timestamp, 7d)" }
        - { id: ago1h, text: ago(1h) }
        - { id: ts, text: Timestamp }
    - id: cmp
      options:
        - { id: gt, text: ">" }
        - { id: ge, text: ">=" }
        - { id: lt, text: "<" }
answer:
  values: { agg: dcount, window: bin1h, cmp: gt }
explanation:
  correct:
    en: "`dcount(DeviceName)` counts the distinct devices each account signed in to, and grouping by `bin(Timestamp, 1h)` evaluates every one-hour window of the seven days. `> 10` keeps the accounts that reached more than 10 different devices in at least one window."
    fr: "`dcount(DeviceName)` compte les appareils distincts auxquels chaque compte s'est connecté, et le regroupement par `bin(Timestamp, 1h)` évalue chaque fenêtre d'une heure des sept jours. `> 10` conserve les comptes qui ont atteint plus de 10 appareils différents dans au moins une fenêtre."
  options:
    count: { en: "count counts logon events, so repeated logons to the same device would be counted several times.", fr: "count compte les événements de connexion : des connexions répétées au même appareil seraient comptées plusieurs fois." }
    makeset: { en: "make_set returns an array of device names, which cannot be compared with a number.", fr: "make_set renvoie un tableau de noms d'appareils, qui ne peut pas être comparé à un nombre." }
    max: { en: "max returns the largest device name in alphabetical order, not a number of devices.", fr: "max renvoie le plus grand nom d'appareil dans l'ordre alphabétique, pas un nombre d'appareils." }
    bin7d: { en: "A seven-day bin measures the whole week, not one-hour windows.", fr: "Un intervalle de sept jours mesure toute la semaine, pas des fenêtres d'une heure." }
    ago1h: { en: "ago(1h) is a constant point in time, so it does not split the events into one-hour windows.", fr: "ago(1h) est un instant constant : il ne découpe pas les événements en fenêtres d'une heure." }
    ts: { en: "Grouping by the raw Timestamp creates one group per event time, so each group contains almost always one device.", fr: "Regrouper par le Timestamp brut crée un groupe par horodatage d'événement : chaque groupe ne contient presque toujours qu'un appareil." }
    ge: { en: ">= 10 would also return accounts that reached exactly 10 devices.", fr: ">= 10 renverrait aussi les comptes qui ont atteint exactement 10 appareils." }
references:
  - title: DeviceLogonEvents table in the advanced hunting schema - Microsoft Defender XDR
    url: https://learn.microsoft.com/en-us/defender-xdr/advanced-hunting-devicelogonevents-table
  - title: bin()
    url: https://learn.microsoft.com/en-us/kusto/query/bin-function
