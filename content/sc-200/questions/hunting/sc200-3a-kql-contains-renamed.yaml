id: sc200-3a-kql-contains-renamed
objective: "3.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso, Ltd. uses Microsoft Defender for Endpoint. Attackers often copy the rclone tool under names such as `rclone64.exe` or `xrclone.exe` before exfiltrating data.

    You are writing the following advanced hunting query:

    ```kusto
    DeviceProcessEvents
    | where Timestamp > ago(7d)
    | where ProcessCommandLine <operator> "rclone"
    ```

    The query must return every command line in which the string `rclone` appears, including the renamed copies. Case must be ignored.

    Which operator should you use?
  fr: |
    Contoso, Ltd. utilise Microsoft Defender for Endpoint. Les attaquants copient souvent l'outil rclone sous des noms comme `rclone64.exe` ou `xrclone.exe` avant d'exfiltrer des données.

    Vous écrivez la requête de repérage avancé suivante :

    ```kusto
    DeviceProcessEvents
    | where Timestamp > ago(7d)
    | where ProcessCommandLine <operator> "rclone"
    ```

    La requête doit renvoyer toutes les lignes de commande dans lesquelles la chaîne `rclone` apparaît, y compris les copies renommées. La casse doit être ignorée.

    Quel opérateur devez-vous utiliser ?
body:
  options:
    - { id: a, text: has }
    - { id: b, text: contains }
    - { id: c, text: has_cs }
    - { id: d, text: "==" }
answer: { optionId: b }
explanation:
  correct:
    en: contains matches any substring and is case-insensitive, so it finds rclone inside rclone64.exe and xrclone.exe. It is slower than has, but has only matches whole terms.
    fr: |
      contains correspond à n'importe quelle sous-chaîne et ignore la casse : il trouve rclone dans rclone64.exe et xrclone.exe. Il est plus lent que has, mais has ne correspond qu'à des termes entiers.
  options:
    a: { en: "has looks for whole terms (maximal alphanumeric sequences): rclone64 and xrclone are different terms, so the renamed copies are missed.", fr: "has recherche des termes entiers (séquences alphanumériques maximales) : rclone64 et xrclone sont des termes différents, donc les copies renommées sont manquées." }
    c: { en: "has_cs is the case-sensitive version of has; it also matches whole terms only.", fr: "has_cs est la version sensible à la casse de has ; elle ne correspond elle aussi qu'à des termes entiers." }
    d: { en: "== compares the whole command line with the string, so it only matches a command line that is exactly rclone.", fr: "== compare la ligne de commande entière à la chaîne : il ne correspond qu'à une ligne de commande qui vaut exactement rclone." }
references:
  - title: String operators
    url: https://learn.microsoft.com/en-us/kusto/query/datatypes-string-operators
