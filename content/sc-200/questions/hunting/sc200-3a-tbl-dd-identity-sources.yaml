id: sc200-3a-tbl-dd-identity-sources
objective: "3.1.1"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove Bank uses Microsoft Defender XDR. Microsoft Defender for Endpoint, Microsoft Defender for Identity (sensors on all domain controllers) and Microsoft Defender for Cloud Apps (with the Microsoft 365 app connector) are deployed.

    You need to write four advanced hunting queries.

    Which table should you query for each requirement? To answer, drag the appropriate tables to the correct requirements. Each table may be used once, more than once, or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove Bank utilise Microsoft Defender XDR. Microsoft Defender for Endpoint, Microsoft Defender for Identity (capteurs sur tous les contrôleurs de domaine) et Microsoft Defender for Cloud Apps (avec le connecteur d'application Microsoft 365) sont déployés.

    Vous devez écrire quatre requêtes de repérage avancé.

    Quelle table devez-vous interroger pour chaque exigence ? Pour répondre, faites glisser les tables appropriées vers les exigences correspondantes. Chaque table peut être utilisée une fois, plusieurs fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: true
  items:
    - { id: cloudapp, text: CloudAppEvents }
    - { id: idlogon, text: IdentityLogonEvents }
    - { id: iddir, text: IdentityDirectoryEvents }
    - { id: devlogon, text: DeviceLogonEvents }
    - { id: entra, text: EntraIdSignInEvents }
    - { id: idquery, text: IdentityQueryEvents }
  targets:
    - id: inbox
      text: { en: "Inbox rules created in Exchange Online by users", fr: "Règles de boîte de réception créées dans Exchange Online par des utilisateurs" }
    - id: kerb
      text: { en: "Failed Kerberos authentications processed by the domain controllers", fr: "Échecs d'authentification Kerberos traités par les contrôleurs de domaine" }
    - id: pwd
      text: { en: "Password changes of on-premises Active Directory accounts", fr: "Changements de mot de passe de comptes Active Directory locaux" }
    - id: rdp
      text: { en: "RDP sign-ins to a workgroup server (not domain-joined) onboarded to Defender for Endpoint", fr: "Ouvertures de session RDP sur un serveur de groupe de travail (non joint au domaine) intégré à Defender for Endpoint" }
answer:
  mapping: { inbox: cloudapp, kerb: idlogon, pwd: iddir, rdp: devlogon }
explanation:
  correct:
    en: CloudAppEvents holds the activities performed in Exchange Online and other cloud apps connected to Defender for Cloud Apps. IdentityLogonEvents holds the authentications seen by Defender for Identity on Active Directory, including failed Kerberos attempts. IdentityDirectoryEvents holds domain controller events such as password changes. A workgroup server never authenticates against the domain controllers, so its RDP sign-ins are only in DeviceLogonEvents, reported by Defender for Endpoint.
    fr: |
      CloudAppEvents contient les activités effectuées dans Exchange Online et les autres applications cloud connectées à Defender for Cloud Apps. IdentityLogonEvents contient les authentifications vues par Defender for Identity sur Active Directory, y compris les tentatives Kerberos en échec. IdentityDirectoryEvents contient les événements des contrôleurs de domaine comme les changements de mot de passe. Un serveur de groupe de travail ne s'authentifie jamais auprès des contrôleurs de domaine : ses ouvertures de session RDP ne figurent que dans DeviceLogonEvents, alimentée par Defender for Endpoint.
  options:
    entra: { en: "EntraIdSignInEvents contains Microsoft Entra sign-ins, not on-premises authentications, mailbox activities or local device sign-ins.", fr: "EntraIdSignInEvents contient les connexions Microsoft Entra, pas les authentifications locales, les activités de boîte aux lettres ni les ouvertures de session locales des appareils." }
    idquery: { en: "IdentityQueryEvents contains queries against Active Directory objects (reconnaissance), not authentications or changes.", fr: "IdentityQueryEvents contient les requêtes vers des objets Active Directory (reconnaissance), pas les authentifications ni les modifications." }
references:
  - title: Understand the advanced hunting schema
    url: https://learn.microsoft.com/en-us/defender-xdr/advanced-hunting-schema-tables
  - title: IdentityDirectoryEvents table in the advanced hunting schema
    url: https://learn.microsoft.com/en-us/defender-xdr/advanced-hunting-identitydirectoryevents-table
