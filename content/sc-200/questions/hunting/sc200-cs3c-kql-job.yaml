id: sc200-cs3c-kql-job
objective: "3.2.2"
type: yesno_statements
caseStudy: sc200-cs3c-relecloud
difficulty: 2
status: draft
stem:
  en: |
    You plan to meet the historical matching requirement by creating a scheduled KQL job in the Microsoft Sentinel data lake. The job joins StorageBlobLogs with ThreatIntelIndicators and writes the matches to a new table in law-rc-sec.

    For each of the following statements, select Yes if the statement is true. Otherwise, select No.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous prévoyez de respecter l'exigence de correspondance historique en créant une tâche KQL planifiée dans le data lake Microsoft Sentinel. La tâche joint StorageBlobLogs à ThreatIntelIndicators et écrit les correspondances dans une nouvelle table de law-rc-sec.

    Pour chacune des affirmations suivantes, sélectionnez Oui si l'affirmation est vraie. Sinon, sélectionnez Non.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text: { en: "The job can query the full three years of StorageBlobLogs data.", fr: "La tâche peut interroger la totalité des trois ans de données de StorageBlobLogs." }
    - id: s2
      text: { en: "If you create the job at 09:00 with a daily schedule, its first run can start at 09:10.", fr: "Si vous créez la tâche à 09:00 avec une planification quotidienne, sa première exécution peut démarrer à 09:10." }
    - id: s3
      text: { en: "The current Microsoft Entra role of the detection engineers allows them to create and schedule the job.", fr: "Le rôle Microsoft Entra actuel des ingénieurs de détection leur permet de créer et de planifier la tâche." }
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |
      A KQL job can query up to 12 years of data lake data, so three years of StorageBlobLogs are in range. The start time of a scheduled job must be at least 30 minutes after it is created or edited. Managing data lake jobs requires a Microsoft Entra role such as Security Operator, which the detection engineers have; the new _KQL_CL table can be created because the data lake managed identity has Log Analytics Contributor on law-rc-sec.
    fr: |
      Une tâche KQL peut interroger jusqu'à 12 ans de données du data lake : les trois ans de StorageBlobLogs sont donc couverts. L'heure de début d'une tâche planifiée doit se situer au moins 30 minutes après sa création ou sa modification. La gestion des tâches du data lake demande un rôle Microsoft Entra tel que Security Operator, dont disposent les ingénieurs de détection ; la nouvelle table _KQL_CL peut être créée car l'identité managée du data lake dispose de Log Analytics Contributor sur law-rc-sec.
  options:
    s2: { en: "The earliest start time is 09:30, 30 minutes after the job is created.", fr: "L'heure de début la plus proche est 09:30, soit 30 minutes après la création de la tâche." }
references:
  - title: Create KQL jobs in the Microsoft Sentinel data lake
    url: https://learn.microsoft.com/en-us/azure/sentinel/datalake/kql-jobs
  - title: Roles and permissions in the Microsoft Sentinel platform
    url: https://learn.microsoft.com/en-us/azure/sentinel/roles
