id: sc200-sr1-hash-hunt-2
objective: "3.1.2"
type: series_yesno
series: sc200-sr1-hash-hunt
seriesOrder: 2
difficulty: 2
status: draft
stem:
  en: You join the three filtered tables on the SHA256 column.
  fr: Vous joignez les trois tables filtrées sur la colonne SHA256.
body:
  solution:
    en: |
      You run the following query.

      ```kusto
      let FileHash = "e38b80b61ad0c4d528c6401c93983332cb9c4360c6f5d489c61459e246641127";
      DeviceFileEvents
      | where Timestamp > ago(30d) and SHA256 == FileHash
      | join kind=inner (DeviceProcessEvents | where Timestamp > ago(30d) and SHA256 == FileHash) on SHA256
      | join kind=inner (EmailAttachmentInfo | where Timestamp > ago(30d) and SHA256 == FileHash) on SHA256
      ```
    fr: |
      Vous exécutez la requête suivante.

      ```kusto
      let FileHash = "e38b80b61ad0c4d528c6401c93983332cb9c4360c6f5d489c61459e246641127";
      DeviceFileEvents
      | where Timestamp > ago(30d) and SHA256 == FileHash
      | join kind=inner (DeviceProcessEvents | where Timestamp > ago(30d) and SHA256 == FileHash) on SHA256
      | join kind=inner (EmailAttachmentInfo | where Timestamp > ago(30d) and SHA256 == FileHash) on SHA256
      ```
answer: { value: false }
explanation:
  correct:
    en: |
      An inner join returns rows only when the key exists on both sides. If the file was received by email but never written or run on a device, or seen on a device without an email, the query returns nothing. The joins also merge rows from different tables into combined rows instead of returning each record.
    fr: |
      Une jointure inner ne renvoie des lignes que si la clé existe des deux côtés. Si le fichier a été reçu par e-mail sans jamais être écrit ou exécuté sur un appareil, ou vu sur un appareil sans e-mail, la requête ne renvoie rien. Les jointures fusionnent aussi des lignes de tables différentes en lignes combinées au lieu de renvoyer chaque enregistrement.
references:
  - title: union operator
    url: https://learn.microsoft.com/en-us/kusto/query/union-operator
