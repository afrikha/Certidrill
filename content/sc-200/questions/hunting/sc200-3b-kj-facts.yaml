id: sc200-3b-kj-facts
objective: "3.2.2"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove Bank is onboarded to the Microsoft Sentinel data lake, with several Microsoft Sentinel workspaces and federated tables from Microsoft Entra ID. The SOC plans its KQL jobs.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove Bank est intégré au data lake Microsoft Sentinel, avec plusieurs espaces de travail Microsoft Sentinel et des tables fédérées issues de Microsoft Entra ID. Le SOC planifie ses tâches KQL.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          A KQL job can append its results to one of the federated Microsoft Entra ID tables.
        fr: |
          Une tâche KQL peut ajouter ses résultats à l'une des tables fédérées Microsoft Entra ID.
    - id: s2
      text:
        en: |
          If a source workspace of a scheduled KQL job is deleted, the job is set to Disabled automatically.
        fr: |
          Si un espace de travail source d'une tâche KQL planifiée est supprimé, la tâche passe automatiquement à l'état Disabled.
    - id: s3
      text:
        en: |
          A KQL job can be named fw-ioc-daily.
        fr: |
          Une tâche KQL peut être nommée fw-ioc-daily.
answer:
  values: { s1: false, s2: true, s3: false }
explanation:
  correct:
    en: |
      KQL jobs can read federated tables but can't write results to them. Jobs that reference a deleted source workspace are automatically disabled and need user action to resume. Job names must be unique in the tenant, up to 256 characters, and can't contain # or -.
    fr: |
      Les tâches KQL peuvent lire les tables fédérées, mais pas y écrire de résultats. Les tâches qui référencent un espace de travail source supprimé sont automatiquement désactivées et doivent être reprises par un utilisateur. Les noms de tâches doivent être uniques dans le locataire, compter au plus 256 caractères et ne contenir ni # ni -.
references:
  - title: Create KQL jobs in the Microsoft Sentinel data lake
    url: https://learn.microsoft.com/en-us/azure/sentinel/datalake/kql-jobs
