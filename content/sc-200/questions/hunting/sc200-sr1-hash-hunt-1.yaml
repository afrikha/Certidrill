id: sc200-sr1-hash-hunt-1
objective: "3.1.2"
type: series_yesno
series: sc200-sr1-hash-hunt
seriesOrder: 1
difficulty: 1
status: draft
stem:
  en: You combine the three tables with union and then filter on the hash.
  fr: Vous combinez les trois tables avec union, puis filtrez sur le hachage.
body:
  solution:
    en: |
      You run the following query.

      ```kusto
      let FileHash = "e38b80b61ad0c4d528c6401c93983332cb9c4360c6f5d489c61459e246641127";
      union DeviceFileEvents, DeviceProcessEvents, EmailAttachmentInfo
      | where Timestamp > ago(30d)
      | where SHA256 == FileHash
      ```
    fr: |
      Vous exécutez la requête suivante.

      ```kusto
      let FileHash = "e38b80b61ad0c4d528c6401c93983332cb9c4360c6f5d489c61459e246641127";
      union DeviceFileEvents, DeviceProcessEvents, EmailAttachmentInfo
      | where Timestamp > ago(30d)
      | where SHA256 == FileHash
      ```
answer: { value: true }
explanation:
  correct:
    en: |
      The union operator returns the rows of all the input tables, and its default kind (outer) keeps every column of each table. The filters then keep, from any table, the records of the last 30 days whose SHA256 column contains the hash, whether or not the hash appears in the other tables.
    fr: |
      L'opérateur union renvoie les lignes de toutes les tables d'entrée, et son type par défaut (outer) conserve toutes les colonnes de chaque table. Les filtres conservent ensuite, quelle que soit la table, les enregistrements des 30 derniers jours dont la colonne SHA256 contient le hachage, que le hachage apparaisse ou non dans les autres tables.
references:
  - title: union operator
    url: https://learn.microsoft.com/en-us/kusto/query/union-operator
