id: sc200-3a-kql-dd-top-senders
objective: "3.1.2"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    Northwind Traders uses Microsoft Defender for Office 365. The ThreatTypes column of EmailEvents can contain several threat types for the same message.

    You need an advanced hunting query that returns the 10 senders whose phishing messages reached the largest number of distinct recipients during the last seven days.

    How should you complete the query? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind Traders utilise Microsoft Defender for Office 365. La colonne ThreatTypes d'EmailEvents peut contenir plusieurs types de menaces pour un même message.

    Vous avez besoin d'une requête de repérage avancé qui renvoie les 10 expéditeurs dont les messages d'hameçonnage ont atteint le plus grand nombre de destinataires distincts au cours des sept derniers jours.

    Comment devez-vous compléter la requête ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: kusto
  template: |
    EmailEvents
    | where Timestamp > ago(7d)
    | where ThreatTypes [[op]] "Phish"
    | summarize Recipients = [[agg]](RecipientEmailAddress) by SenderFromAddress
    | [[sort]] 10 by Recipients
  slots:
    - id: op
      options:
        - { id: has, text: has }
        - { id: eq, text: "==" }
        - { id: in, text: in }
    - id: agg
      options:
        - { id: dcount, text: dcount }
        - { id: count, text: count }
        - { id: makeset, text: make_set }
    - id: sort
      options:
        - { id: top, text: top }
        - { id: take, text: take }
        - { id: distinct, text: distinct }
answer:
  values: { op: has, agg: dcount, sort: top }
explanation:
  correct:
    en: has finds the term Phish even when ThreatTypes lists several threat types. dcount(RecipientEmailAddress) counts the distinct recipients of each sender. top 10 by Recipients sorts in descending order and keeps the first 10 rows.
    fr: has trouve le terme Phish même quand ThreatTypes contient plusieurs types de menaces. dcount(RecipientEmailAddress) compte les destinataires distincts de chaque expéditeur. top 10 by Recipients trie par ordre décroissant et conserve les 10 premières lignes.
  options:
    eq: { en: "== requires the whole value to be Phish, so messages with several threat types are missed.", fr: "== exige que la valeur entière soit Phish : les messages avec plusieurs types de menaces sont manqués." }
    count: { en: "count() counts messages, so a sender who sent many messages to the same recipient would rank too high.", fr: "count() compte les messages : un expéditeur qui a envoyé de nombreux messages au même destinataire serait trop bien classé." }
    take: { en: "take returns arbitrary rows and doesn't accept a by clause.", fr: "take renvoie des lignes arbitraires et n'accepte pas de clause by." }
references:
  - title: String operators
    url: https://learn.microsoft.com/en-us/kusto/query/datatypes-string-operators
