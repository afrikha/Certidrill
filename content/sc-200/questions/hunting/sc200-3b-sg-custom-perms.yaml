id: sc200-3b-sg-custom-perms
objective: "3.1.6"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    Northwind Traders is onboarded to the Microsoft Sentinel data lake. An analyst named **Analyst3** currently has no Microsoft Entra role and no Defender unified RBAC role.

    Analyst3 must model a custom graph in a notebook by using the Microsoft Sentinel extension for Visual Studio Code, and then persist the graph in the tenant by creating a graph job. The solution must follow the principle of least privilege.

    Which two permissions should you grant to Analyst3? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind Traders est intégré au data lake Microsoft Sentinel. Un analyste nommé **Analyst3** ne dispose actuellement d'aucun rôle Microsoft Entra ni d'aucun rôle RBAC unifié Defender.

    Analyst3 doit modéliser un graphe personnalisé dans un notebook avec l'extension Microsoft Sentinel pour Visual Studio Code, puis rendre le graphe persistant dans le locataire en créant une tâche de graphe. La solution doit respecter le principe du moindre privilège.

    Quelles sont les deux autorisations à accorder à Analyst3 ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "A custom Defender unified RBAC role with data (manage) over the Microsoft Sentinel data collection", fr: "Un rôle RBAC unifié Defender personnalisé avec data (manage) sur la collection de données Microsoft Sentinel" } }
    - { id: b, text: { en: "A custom Defender unified RBAC role with security data basics (read) over the Microsoft Sentinel data collection", fr: "Un rôle RBAC unifié Defender personnalisé avec security data basics (read) sur la collection de données Microsoft Sentinel" } }
    - { id: c, text: { en: "The Security Operator role in Microsoft Entra ID", fr: "Le rôle Security Operator dans Microsoft Entra ID" } }
    - { id: d, text: { en: "The Global Administrator role in Microsoft Entra ID", fr: "Le rôle Global Administrator dans Microsoft Entra ID" } }
    - { id: e, text: { en: "The Microsoft Sentinel Contributor role on the Sentinel workspace", fr: "Le rôle Microsoft Sentinel Contributor sur l'espace de travail Sentinel" } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |
      Modeling and building a graph in a notebook requires a custom Defender unified RBAC role with data (manage) over the Microsoft Sentinel data collection. Persisting the graph in the tenant with a graph job requires one of the Microsoft Entra roles Security Operator, Security Administrator or Global Administrator, and Security Operator is the least privileged of them.
    fr: |
      Modéliser et construire un graphe dans un notebook exige un rôle RBAC unifié Defender personnalisé avec data (manage) sur la collection de données Microsoft Sentinel. Rendre le graphe persistant dans le locataire avec une tâche de graphe exige l'un des rôles Microsoft Entra Security Operator, Security Administrator ou Global Administrator, et Security Operator est le moins privilégié des trois.
  options:
    b: { en: "Security data basics (read) is enough to query a persisted graph, not to model and build one.", fr: "Security data basics (read) suffit pour interroger un graphe persistant, pas pour en modéliser et en construire un." }
    d: { en: "Global Administrator can persist graphs but grants far more than Security Operator.", fr: "Global Administrator peut rendre des graphes persistants, mais accorde beaucoup plus que Security Operator." }
    e: { en: "Custom graphs are authorized through Defender unified RBAC and Entra roles, not through the Sentinel workspace role.", fr: "Les graphes personnalisés sont autorisés par le RBAC unifié Defender et les rôles Entra, pas par le rôle de l'espace de travail Sentinel." }
references:
  - title: Get started with custom graphs in Microsoft Sentinel (preview)
    url: https://learn.microsoft.com/en-us/azure/sentinel/datalake/create-custom-graphs
