id: sc200-3c-summary-rule-behavior
objective: "3.2.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Tailspin Toys has a Microsoft Sentinel workspace. Ingestion of firewall logs into a table named **FwLogs_CL** started three months ago.

    Today, you create a summary rule named **FwDaily** that aggregates FwLogs_CL with a bin size of 1,440 minutes into a table named **FwDaily_CL**.

    Which two statements about FwDaily are true?

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin Toys dispose d'un espace de travail Microsoft Sentinel. L'ingestion des journaux de pare-feu dans une table nommée **FwLogs_CL** a commencé il y a trois mois.

    Aujourd'hui, vous créez une règle de synthèse nommée **FwDaily** qui agrège FwLogs_CL avec une taille d'intervalle de 1 440 minutes dans une table nommée **FwDaily_CL**.

    Quelles sont les deux affirmations vraies concernant FwDaily ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Setting the bin start time to 90 days ago makes FwDaily summarize the last three months.", fr: "Définir l'heure de début des intervalles à il y a 90 jours fait agréger par FwDaily les trois derniers mois." } }
    - { id: b, text: { en: "FwDaily processes only recent data and doesn't backfill FwDaily_CL with older bins.", fr: "FwDaily ne traite que des données récentes et ne remplit pas FwDaily_CL avec des intervalles plus anciens." } }
    - { id: c, text: { en: "If you stop FwDaily for a week and start it again, it processes the missed bins first.", fr: "Si vous arrêtez FwDaily pendant une semaine puis le redémarrez, il traite d'abord les intervalles manqués." } }
    - { id: d, text: { en: "If you set a bin start time for FwDaily, it must be on a whole hour.", fr: "Si vous définissez une heure de début des intervalles pour FwDaily, elle doit tomber sur une heure entière." } }
    - { id: e, text: { en: "A failed bin of FwDaily is retried automatically until it succeeds.", fr: "Un intervalle en échec de FwDaily est réessayé automatiquement jusqu'à ce qu'il réussisse." } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |
      Summary rules have no historical mode. They process data from the recent past only (up to 24 hours, which is why 1,440 minutes is the largest bin), so FwDaily_CL starts empty and fills from now on. The optional bin start time must be in whole hours and no earlier than the rule creation time minus the bin size.
    fr: |
      Les règles de synthèse n'ont pas de mode historique. Elles ne traitent que les données du passé récent (24 heures au plus, d'où l'intervalle maximal de 1 440 minutes) : FwDaily_CL démarre vide et se remplit à partir de maintenant. L'heure de début facultative doit être en heures entières et pas antérieure à l'heure de création de la règle moins la taille d'intervalle.
  options:
    a: { en: "The bin start time can't be earlier than the rule creation time minus the bin size, so it can't reach three months back.", fr: "L'heure de début ne peut pas être antérieure à l'heure de création de la règle moins la taille d'intervalle : elle ne peut pas remonter à trois mois." }
    c: { en: "When a stopped rule starts again, processing resumes at the next whole hour or the bin start time, and earlier gaps aren't backfilled.", fr: "Quand une règle arrêtée redémarre, le traitement reprend à l'heure entière suivante ou à l'heure de début, et les trous antérieurs ne sont pas comblés." }
    e: { en: "A failed bin is retried up to 10 times within 8 hours and then skipped; you can rerun it manually.", fr: "Un intervalle en échec est réessayé jusqu'à 10 fois en 8 heures, puis ignoré ; vous pouvez le réexécuter manuellement." }
references:
  - title: Aggregate data in a Log Analytics workspace by using summary rules
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/logs/summary-rules
