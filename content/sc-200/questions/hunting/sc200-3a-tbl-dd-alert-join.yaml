id: sc200-3a-tbl-dd-alert-join
objective: "3.1.1"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Adatum Corporation uses Microsoft Defender XDR.

    You need an advanced hunting query that returns the 10 devices associated with the largest number of distinct high-severity alerts during the last seven days.

    How should you complete the query? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum Corporation utilise Microsoft Defender XDR.

    Vous avez besoin d'une requête de repérage avancé qui renvoie les 10 appareils associés au plus grand nombre d'alertes distinctes de gravité élevée au cours des sept derniers jours.

    Comment devez-vous compléter la requête ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: kusto
  template: |
    AlertInfo
    | where Timestamp > ago(7d) and Severity == "High"
    | join kind=inner [[tbl]] on [[key]]
    | where isnotempty(DeviceId)
    | summarize Alerts = dcount(AlertId) by DeviceId
    | top 10 by Alerts
  slots:
    - id: tbl
      options:
        - { id: evidence, text: AlertEvidence }
        - { id: devinfo, text: DeviceInfo }
        - { id: devevents, text: DeviceEvents }
        - { id: alertinfo, text: AlertInfo }
    - id: key
      options:
        - { id: alertid, text: AlertId }
        - { id: deviceid, text: DeviceId }
        - { id: title, text: Title }
        - { id: reportid, text: ReportId }
answer:
  values: { tbl: evidence, key: alertid }
explanation:
  correct:
    en: AlertInfo has one row per alert, and AlertEvidence one row per entity associated with an alert, including the DeviceId of the devices. Joining them on AlertId attaches each alert's devices to its severity, and dcount(AlertId) then counts the distinct alerts of each device.
    fr: AlertInfo contient une ligne par alerte, et AlertEvidence une ligne par entité associée à une alerte, y compris le DeviceId des appareils. La jointure sur AlertId rattache les appareils de chaque alerte à sa gravité, puis dcount(AlertId) compte les alertes distinctes de chaque appareil.
  options:
    devinfo: { en: "DeviceInfo describes devices but has no AlertId, so it can't link a device to an alert.", fr: "DeviceInfo décrit les appareils mais ne contient pas d'AlertId : elle ne peut pas relier un appareil à une alerte." }
    devevents: { en: "DeviceEvents contains raw endpoint events, not the entities of every Defender alert.", fr: "DeviceEvents contient des événements bruts des points de terminaison, pas les entités de chaque alerte Defender." }
    alertinfo: { en: "Joining AlertInfo with itself adds no device information.", fr: "Joindre AlertInfo à elle-même n'ajoute aucune information sur les appareils." }
    deviceid: { en: "AlertInfo has no DeviceId column; the alert and its evidence share the AlertId.", fr: "AlertInfo n'a pas de colonne DeviceId ; l'alerte et ses preuves partagent l'AlertId." }
    title: { en: "Several alerts can share the same title, so joining on Title would attach the devices of other alerts.", fr: "Plusieurs alertes peuvent avoir le même titre : une jointure sur Title rattacherait les appareils d'autres alertes." }
    reportid: { en: "ReportId identifies raw events in the activity tables; it doesn't link alerts to their evidence.", fr: "ReportId identifie des événements bruts dans les tables d'activité ; il ne relie pas les alertes à leurs preuves." }
references:
  - title: AlertEvidence table in the advanced hunting schema
    url: https://learn.microsoft.com/en-us/defender-xdr/advanced-hunting-alertevidence-table
