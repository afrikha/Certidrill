id: sc200-3b-hgraph-shortest
objective: "3.1.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You run the **Attack paths to critical asset** hunting graph scenario in Microsoft Defender advanced hunting, with a domain controller named **DC01** as the target.

    The graph shows hundreds of long paths. You need the graph to keep only the most direct paths to DC01. The solution must minimize administrative effort.

    What should you do?
  fr: |
    Vous exécutez le scénario de graphe de chasse **Attack paths to critical asset** dans le repérage avancé de Microsoft Defender, avec un contrôleur de domaine nommé **DC01** comme cible.

    Le graphe affiche des centaines de chemins longs. Le graphe ne doit conserver que les chemins les plus directs vers DC01. La solution doit réduire au minimum l'effort d'administration.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Add an Edge direction filter set to Incoming.", fr: "Ajouter un filtre Edge direction défini sur Incoming." } }
    - { id: b, text: { en: "Select the Show only the shortest paths option.", fr: "Sélectionner l'option Show only the shortest paths." } }
    - { id: c, text: { en: "Turn off the node labels by using the Layers control.", fr: "Désactiver les étiquettes des nœuds avec la commande Layers." } }
    - { id: d, text: { en: "Select Clear all to remove the default filters.", fr: "Sélectionner Clear all pour supprimer les filtres par défaut." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      The scenario side panel has a Show only the shortest paths check box that limits the graph to the shortest paths between the sources and the target. It's a single option to select before you run the scenario.
    fr: |
      Le volet latéral du scénario comporte une case Show only the shortest paths qui limite le graphe aux chemins les plus courts entre les sources et la cible. Il suffit de la cocher avant d'exécuter le scénario.
  options:
    a: { en: "Edge direction keeps edges that point in one direction; long paths toward DC01 would still be displayed.", fr: "Edge direction conserve les arêtes orientées dans un sens ; les longs chemins vers DC01 resteraient affichés." }
    c: { en: "Layers only changes what labels and icons are drawn; it doesn't remove any path.", fr: "Layers change seulement les étiquettes et les icônes dessinées ; aucun chemin n'est supprimé." }
    d: { en: "Removing the default filters widens the results instead of reducing them.", fr: "Supprimer les filtres par défaut élargit les résultats au lieu de les réduire." }
references:
  - title: Hunt for threats using the hunting graph
    url: https://learn.microsoft.com/en-us/defender-xdr/advanced-hunting-graph
