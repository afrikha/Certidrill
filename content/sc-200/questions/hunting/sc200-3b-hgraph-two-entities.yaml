id: sc200-3b-hgraph-two-entities
objective: "3.1.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam uses Microsoft Defender XDR with the hunting graph available in advanced hunting.

    A workstation named **WKS-17** shows suspicious activity. You need to determine whether WKS-17 has any path to a database server named **SRV-DB02**. SRV-DB02 is not classified as a critical asset in Microsoft Security Exposure Management.

    Which predefined scenario should you run?
  fr: |
    Fabrikam utilise Microsoft Defender XDR, et le graphe de chasse est disponible dans le repérage avancé.

    Un poste de travail nommé **WKS-17** présente une activité suspecte. Vous devez déterminer si WKS-17 dispose d'un chemin vers un serveur de base de données nommé **SRV-DB02**. SRV-DB02 n'est pas classé comme ressource critique dans Microsoft Security Exposure Management.

    Quel scénario prédéfini devez-vous exécuter ?
body:
  options:
    - { id: a, text: Attack paths to critical asset }
    - { id: b, text: Entity relationship map }
    - { id: c, text: Paths between two entities }
    - { id: d, text: Potential data exfiltration by device }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Paths between two entities takes a start and a target as inputs and shows the paths that connect them, which answers whether WKS-17 can reach SRV-DB02. It doesn't require the target to be a critical asset.
    fr: |
      Paths between two entities prend un point de départ et une cible comme entrées et affiche les chemins qui les relient, ce qui indique si WKS-17 peut atteindre SRV-DB02. La cible n'a pas besoin d'être une ressource critique.
  options:
    a: { en: "This scenario targets a critical asset, and SRV-DB02 isn't classified as critical.", fr: "Ce scénario cible une ressource critique, et SRV-DB02 n'est pas classé comme critique." }
    b: { en: "The relationship map shows the relationships around one source entity; it doesn't take a target to compute the paths to it.", fr: "La carte des relations montre les relations autour d'une entité source ; elle ne prend pas de cible pour calculer les chemins qui y mènent." }
    d: { en: "This scenario explores where data could leave from a source device; it doesn't test a path to a specific server.", fr: "Ce scénario explore par où des données pourraient sortir à partir d'un appareil source ; il ne teste pas de chemin vers un serveur précis." }
references:
  - title: Hunt for threats using the hunting graph
    url: https://learn.microsoft.com/en-us/defender-xdr/advanced-hunting-graph
