id: sc200-3a-tbl-dd-message-tables
objective: "3.1.1"
type: dragdrop
difficulty: 3
status: draft
stem:
  en: |
    Wingtip Toys uses Microsoft Defender for Office 365 in Microsoft Defender XDR to protect Exchange Online and Microsoft Teams.

    During a phishing investigation, you need to write four advanced hunting queries. None of the requirements is limited to links that users clicked.

    Which table should you query for each requirement? To answer, drag the appropriate tables to the correct requirements. Each table may be used once, more than once, or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Wingtip Toys utilise Microsoft Defender for Office 365 dans Microsoft Defender XDR pour protéger Exchange Online et Microsoft Teams.

    Au cours d'une investigation d'hameçonnage, vous devez écrire quatre requêtes de repérage avancé. Aucune des exigences n'est limitée aux liens sur lesquels les utilisateurs ont cliqué.

    Quelle table devez-vous interroger pour chaque exigence ? Pour répondre, faites glisser les tables appropriées vers les exigences correspondantes. Chaque table peut être utilisée une fois, plusieurs fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: true
  items:
    - { id: email, text: EmailEvents }
    - { id: attach, text: EmailAttachmentInfo }
    - { id: emailurl, text: EmailUrlInfo }
    - { id: msgurl, text: MessageUrlInfo }
    - { id: click, text: UrlClickEvents }
    - { id: msgevents, text: MessageEvents }
  targets:
    - id: hash
      text: { en: "SHA256 of the files attached to inbound messages", fr: "SHA256 des fichiers joints aux messages entrants" }
    - id: urlmail
      text: { en: "URLs contained in email messages", fr: "URL contenues dans les e-mails" }
    - id: urlteams
      text: { en: "URLs sent in Teams messages", fr: "URL envoyées dans des messages Teams" }
    - id: verdict
      text: { en: "Sender, recipient and delivery or blocking verdict of each email message", fr: "Expéditeur, destinataire et verdict de remise ou de blocage de chaque e-mail" }
answer:
  mapping: { hash: attach, urlmail: emailurl, urlteams: msgurl, verdict: email }
explanation:
  correct:
    en: EmailAttachmentInfo describes the files attached to email messages, including their hashes. EmailUrlInfo lists the URLs found in email messages, and MessageUrlInfo the URLs sent through Teams messages, whether or not anyone clicked them. EmailEvents contains the delivery and blocking events with the sender and recipient of each message.
    fr: EmailAttachmentInfo décrit les fichiers joints aux e-mails, y compris leurs hachages. EmailUrlInfo liste les URL trouvées dans les e-mails, et MessageUrlInfo les URL envoyées dans des messages Teams, qu'un utilisateur ait cliqué dessus ou non. EmailEvents contient les événements de remise et de blocage avec l'expéditeur et le destinataire de chaque message.
  options:
    click: { en: "UrlClickEvents records only the Safe Links clicks, so URLs that nobody clicked are missing.", fr: "UrlClickEvents n'enregistre que les clics Liens fiables (Safe Links) : les URL sur lesquelles personne n'a cliqué n'y figurent pas." }
    msgevents: { en: "MessageEvents describes Teams messages at delivery time, not the URLs they contain nor email messages.", fr: "MessageEvents décrit les messages Teams au moment de la remise, pas les URL qu'ils contiennent ni les e-mails." }
references:
  - title: Understand the advanced hunting schema
    url: https://learn.microsoft.com/en-us/defender-xdr/advanced-hunting-schema-tables
