id: sc200-3b-kj-lake-suffix
objective: "3.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso is onboarded to the Microsoft Sentinel data lake. You create a scheduled KQL job that aggregates sign-in data into a daily baseline. In the job details, you select **System tables** as the destination workspace and create a new table named **SigninBaseline**.

    Analysts must query the results in data lake exploration.

    Which table name should the analysts query?
  fr: |
    Contoso est intégré au data lake Microsoft Sentinel. Vous créez une tâche KQL planifiée qui agrège les données de connexion en une référence quotidienne. Dans les détails de la tâche, vous sélectionnez **System tables** comme espace de travail de destination et créez une nouvelle table nommée **SigninBaseline**.

    Les analystes doivent interroger les résultats dans l'exploration du data lake.

    Quel nom de table les analystes doivent-ils interroger ?
body:
  options:
    - { id: a, text: SigninBaseline_CL }
    - { id: b, text: SigninBaseline_KQL_CL }
    - { id: c, text: SigninBaseline_SRCH }
    - { id: d, text: SigninBaseline_KQL }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Selecting System tables as the destination writes the job results to the data lake tier, and new tables created this way get the _KQL suffix. New tables that a KQL job creates in the analytics tier get the _KQL_CL suffix instead.
    fr: |
      Sélectionner System tables comme destination écrit les résultats de la tâche au niveau data lake, et les nouvelles tables créées ainsi reçoivent le suffixe _KQL. Les nouvelles tables qu'une tâche KQL crée au niveau Analytics reçoivent plutôt le suffixe _KQL_CL.
  options:
    a: { en: "_CL is the suffix of custom log tables in general, not of tables created by KQL jobs.", fr: "_CL est le suffixe des tables de journaux personnalisées en général, pas des tables créées par les tâches KQL." }
    b: { en: "_KQL_CL is used for new tables in the analytics tier, not in the data lake tier.", fr: "_KQL_CL s'applique aux nouvelles tables du niveau Analytics, pas du niveau data lake." }
    c: { en: "_SRCH is the suffix of search job results.", fr: "_SRCH est le suffixe des résultats des travaux de recherche (search jobs)." }
references:
  - title: Create KQL jobs in the Microsoft Sentinel data lake
    url: https://learn.microsoft.com/en-us/azure/sentinel/datalake/kql-jobs
