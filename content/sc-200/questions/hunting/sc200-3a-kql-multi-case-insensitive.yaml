id: sc200-3a-kql-multi-case-insensitive
objective: "3.1.2"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    Adatum Corporation uses Microsoft Defender for Endpoint. In DeviceProcessEvents, the FileName column of PowerShell appears as `powershell.exe`, `PowerShell.exe` or `POWERSHELL.EXE`, depending on how the process was started.

    You need a `where` clause that keeps the events whose FileName is exactly powershell.exe, whatever its case, and excludes powershell_ise.exe.

    Which two clauses can you use? Each correct answer presents a complete solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum Corporation utilise Microsoft Defender for Endpoint. Dans DeviceProcessEvents, la colonne FileName de PowerShell apparaît sous la forme `powershell.exe`, `PowerShell.exe` ou `POWERSHELL.EXE`, selon la façon dont le processus a été lancé.

    Vous avez besoin d'une clause `where` qui conserve les événements dont le FileName est exactement powershell.exe, quelle que soit sa casse, et exclut powershell_ise.exe.

    Quelles sont les deux clauses utilisables ? Chaque bonne réponse constitue une solution complète.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: "| where FileName == \"powershell.exe\"" }
    - { id: b, text: "| where FileName =~ \"powershell.exe\"" }
    - { id: c, text: "| where FileName in (\"powershell.exe\")" }
    - { id: d, text: "| where FileName in~ (\"powershell.exe\")" }
    - { id: e, text: "| where FileName has_cs \"powershell.exe\"" }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: =~ compares the whole value without regard to case, and in~ does the same against a list of values. Both match powershell.exe in any case and reject powershell_ise.exe, which is a different whole value.
    fr: =~ compare la valeur entière sans tenir compte de la casse, et in~ fait de même avec une liste de valeurs. Les deux correspondent à powershell.exe quelle que soit la casse et rejettent powershell_ise.exe, qui est une autre valeur entière.
  options:
    a: { en: "== is case-sensitive, so PowerShell.exe and POWERSHELL.EXE are missed.", fr: "== est sensible à la casse : PowerShell.exe et POWERSHELL.EXE sont manqués." }
    c: { en: "in is case-sensitive, like ==.", fr: "in est sensible à la casse, comme ==." }
    e: { en: "has_cs is case-sensitive, so the uppercase variants are missed.", fr: "has_cs est sensible à la casse : les variantes en majuscules sont manquées." }
references:
  - title: String operators
    url: https://learn.microsoft.com/en-us/kusto/query/datatypes-string-operators
