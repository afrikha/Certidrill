id: sc200-3b-blast-full-list
objective: "3.1.5"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    Proseware uses Microsoft Defender XDR and was onboarded to the Microsoft Sentinel data lake in June 2026. Incident 784 involves a compromised device named **LAP-22**.

    You need to review the potential path from LAP-22 to a file server named **SRV-FS03**. SRV-FS03 isn't among the paths that the graph displays when blast radius first loads.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Proseware utilise Microsoft Defender XDR et a été intégré au data lake Microsoft Sentinel en juin 2026. L'incident 784 implique un appareil compromis nommé **LAP-22**.

    Vous devez examiner le chemin potentiel entre LAP-22 et un serveur de fichiers nommé **SRV-FS03**. SRV-FS03 ne figure pas parmi les chemins que le graphe affiche au premier chargement du rayon d'impact.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: open, text: { en: "On the Incidents page, select incident 784 to open its graph.", fr: "Dans la page Incidents, sélectionner l'incident 784 pour ouvrir son graphe." } }
    - { id: view, text: { en: "Select the LAP-22 node, and then select View blast radius.", fr: "Sélectionner le nœud LAP-22, puis sélectionner View blast radius." } }
    - { id: list, text: { en: "Select View full blast radius list.", fr: "Sélectionner View full blast radius list." } }
    - { id: target, text: { en: "Select SRV-FS03 to display its potential path from LAP-22.", fr: "Sélectionner SRV-FS03 pour afficher son chemin potentiel depuis LAP-22." } }
    - { id: hide, text: { en: "Select the LAP-22 node, and then select Hide blast radius.", fr: "Sélectionner le nœud LAP-22, puis sélectionner Hide blast radius." } }
    - { id: hunt, text: { en: "In Advanced hunting, select Create new > Hunting graph.", fr: "Dans Advanced hunting, sélectionner Create new > Hunting graph." } }
answer:
  sequence: [ open, view, list, target ]
explanation:
  correct:
    en: |
      Blast radius starts from the incident graph, so you open the incident, select the node and choose View blast radius. The graph first loads the eight top-rated paths; View full blast radius list shows every path, from which you select SRV-FS03 to see the potential path from the entry point.
    fr: |
      Le rayon d'impact part du graphe de l'incident : vous ouvrez l'incident, sélectionnez le nœud et choisissez View blast radius. Le graphe charge d'abord les huit chemins les mieux classés ; View full blast radius list affiche tous les chemins, parmi lesquels vous sélectionnez SRV-FS03 pour voir le chemin potentiel depuis le point d'entrée.
  options:
    hide: { en: "Hide blast radius returns to the original incident graph; it doesn't show more paths.", fr: "Hide blast radius revient au graphe d'origine de l'incident ; il n'affiche pas plus de chemins." }
    hunt: { en: "A hunting graph is a separate experience in advanced hunting; it isn't needed to browse the blast radius of an incident.", fr: "Le graphe de chasse est une expérience distincte du repérage avancé ; il n'est pas nécessaire pour parcourir le rayon d'impact d'un incident." }
references:
  - title: Investigate incidents in the Microsoft Defender portal
    url: https://learn.microsoft.com/en-us/defender-xdr/investigate-incidents
