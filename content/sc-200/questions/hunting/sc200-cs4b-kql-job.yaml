id: sc200-cs4b-kql-job
objective: "3.2.2"
type: yesno_statements
caseStudy: sc200-cs4b-best-for-you-organics
difficulty: 2
status: draft
stem:
  en: |
    You plan to create CheckoutHourly to meet the checkout aggregation requirement.

    For each of the following statements, select Yes if the statement is true. Otherwise, select No.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous prévoyez de créer CheckoutHourly pour respecter l'exigence relative à l'agrégation des paiements.

    Pour chacune des affirmations suivantes, sélectionnez Oui si l'affirmation est vraie. Sinon, sélectionnez Non.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: Before CheckoutHourly can create its results table, the data lake managed identity must have the Log Analytics Contributor role on law-bfyo-soc.
        fr: Avant que CheckoutHourly puisse créer sa table de résultats, l'identité managée du data lake doit disposer du rôle Log Analytics Contributor sur law-bfyo-soc.
    - id: s2
      text:
        en: The name of the results table that CheckoutHourly creates ends with _KQL_CL.
        fr: Le nom de la table de résultats créée par CheckoutHourly se termine par _KQL_CL.
    - id: s3
      text:
        en: If five KQL jobs of the tenant are already running when CheckoutHourly is due, its run is queued and starts when one of them finishes.
        fr: Si cinq tâches KQL du locataire sont déjà en cours d'exécution à l'heure prévue de CheckoutHourly, son exécution est mise en file d'attente et démarre dès que l'une d'elles se termine.
answer:
  values: { s1: true, s2: true, s3: false }
explanation:
  correct:
    en: |
      To let KQL jobs create new custom tables in the analytics tier, you assign Log Analytics Contributor on the workspace to the data lake managed identity (`msg-resources-<guid>`). A table created in the analytics tier by a KQL job gets the _KQL_CL suffix. A tenant runs at most five KQL jobs concurrently, and a request beyond that limit is rejected rather than queued.
    fr: |
      Pour que les tâches KQL puissent créer de nouvelles tables personnalisées dans le niveau Analytics, vous attribuez Log Analytics Contributor sur l'espace de travail à l'identité managée du data lake (`msg-resources-<guid>`). Une table créée dans le niveau Analytics par une tâche KQL reçoit le suffixe _KQL_CL. Un locataire exécute au plus cinq tâches KQL simultanément, et une demande au-delà de cette limite est rejetée et non mise en file d'attente.
  options:
    s3:
      en: When the concurrent job execution limit is exceeded, the request is rejected, not queued.
      fr: Lorsque la limite d'exécutions simultanées est dépassée, la demande est rejetée, pas mise en file d'attente.
references:
  - title: Create jobs in the Microsoft Sentinel data lake
    url: https://learn.microsoft.com/en-us/azure/sentinel/datalake/kql-jobs
