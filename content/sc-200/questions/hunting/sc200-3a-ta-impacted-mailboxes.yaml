id: sc200-3a-ta-impacted-mailboxes
objective: "3.1.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso, Ltd. uses Microsoft Defender XDR with Microsoft Defender for Office 365 and Microsoft Defender for Endpoint.

    Microsoft published a threat analytics report about a phishing campaign, and alerts linked to the report were raised in your tenant. You need to see which mailboxes of your organization received the campaign's emails, over time.

    Which tab of the report should you open?
  fr: |
    Contoso, Ltd. utilise Microsoft Defender XDR avec Microsoft Defender for Office 365 et Microsoft Defender for Endpoint.

    Microsoft a publié un rapport d'analytique des menaces sur une campagne d'hameçonnage, et des alertes liées au rapport ont été déclenchées dans votre locataire. Vous devez voir quelles boîtes aux lettres de votre organisation ont reçu les e-mails de la campagne, au fil du temps.

    Quel onglet du rapport devez-vous ouvrir ?
body:
  options:
    - { id: a, text: Related incidents }
    - { id: b, text: Endpoints exposure }
    - { id: c, text: Impacted assets }
    - { id: d, text: Indicators }
answer: { optionId: c }
explanation:
  correct:
    en: The Impacted assets tab shows over time the assets of your organization affected by the threat, split into assets with active alerts, assets with resolved alerts and all affected assets. Its categories are devices, users, mailboxes, apps and cloud resources; alerts are triggered for mailboxes that received threat emails.
    fr: L'onglet Impacted assets montre au fil du temps les ressources de votre organisation touchées par la menace, réparties entre ressources avec alertes actives, ressources avec alertes résolues et toutes les ressources touchées. Ses catégories sont les appareils, les utilisateurs, les boîtes aux lettres, les applications et les ressources cloud ; des alertes sont déclenchées pour les boîtes aux lettres qui ont reçu des e-mails de la menace.
  options:
    a: { en: "Related incidents lists the incidents linked to the threat so that you can assign them; it isn't the view of affected mailboxes.", fr: "Related incidents liste les incidents liés à la menace pour vous permettre de les attribuer ; ce n'est pas la vue des boîtes aux lettres touchées." }
    b: { en: "Endpoints exposure shows the vulnerable devices and the deployment of security updates, not mailboxes.", fr: "Endpoints exposure montre les appareils vulnérables et le déploiement des mises à jour de sécurité, pas les boîtes aux lettres." }
    d: { en: "Indicators lists the indicators of compromise of the threat, not your affected assets.", fr: "Indicators liste les indicateurs de compromission de la menace, pas vos ressources touchées." }
references:
  - title: Threat analytics in Microsoft Defender
    url: https://learn.microsoft.com/en-us/defender-xdr/threat-analytics
