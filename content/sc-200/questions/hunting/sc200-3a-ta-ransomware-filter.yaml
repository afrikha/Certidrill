id: sc200-3a-ta-ransomware-filter
objective: "3.1.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Northwind Traders uses Microsoft Defender XDR. Its CISO asks for a weekly review of every threat analytics report that Microsoft Threat Intelligence classified as ransomware.

    You need to display only these reports in the threat analytics report list.

    What should you do?
  fr: |
    Northwind Traders utilise Microsoft Defender XDR. Son RSSI demande une revue hebdomadaire de chaque rapport d'analytique des menaces que Microsoft Threat Intelligence a classé comme rançongiciel.

    Vous devez afficher uniquement ces rapports dans la liste des rapports d'analytique des menaces.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Filter the list on the Ransomware threat tag.", fr: "Filtrer la liste sur l'étiquette de menace Ransomware." } }
    - { id: b, text: { en: "Filter the list on the Actor category.", fr: "Filtrer la liste sur la catégorie Actor." } }
    - { id: c, text: { en: "Open the High-impact threats list of the dashboard.", fr: "Ouvrir la liste High-impact threats du tableau de bord." } }
    - { id: d, text: { en: "Open the Highest exposure threats list of the dashboard.", fr: "Ouvrir la liste Highest exposure threats du tableau de bord." } }
answer: { optionId: a }
explanation:
  correct:
    en: The Microsoft Threat Intelligence team assigns threat tags to reports, including Ransomware, Phishing, Activity group and Vulnerability. Filtering the report list on the Ransomware tag displays only those reports.
    fr: L'équipe Microsoft Threat Intelligence attribue des étiquettes de menace aux rapports, notamment Ransomware, Phishing, Activity group et Vulnerability. Filtrer la liste des rapports sur l'étiquette Ransomware n'affiche que ces rapports.
  options:
    b: { en: "The category filters on the report type, such as actor profiles or OSINT articles, not on ransomware.", fr: "La catégorie filtre sur le type de rapport, comme les profils d'acteurs ou les articles OSINT, pas sur les rançongiciels." }
    c: { en: "High-impact threats lists the threats with the most alerts in your tenant, whatever their type.", fr: "High-impact threats liste les menaces qui ont le plus d'alertes dans votre locataire, quel que soit leur type." }
    d: { en: "Highest exposure threats lists the threats to which your organization is most exposed, whatever their type.", fr: "Highest exposure threats liste les menaces auxquelles votre organisation est le plus exposée, quel que soit leur type." }
references:
  - title: Threat analytics in Microsoft Defender
    url: https://learn.microsoft.com/en-us/defender-xdr/threat-analytics
