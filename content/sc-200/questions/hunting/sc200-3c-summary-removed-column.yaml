id: sc200-3c-summary-removed-column
objective: "3.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam has a Microsoft Sentinel workspace. A summary rule named **FwHourly** aggregates firewall logs every hour into a custom table named **FwHourly_CL**. The query groups the results by SourceIP, DestinationPort and DeviceName.

    You edit the query of FwHourly so that it no longer returns the DeviceName column.

    What is the effect on FwHourly_CL?
  fr: |
    Fabrikam dispose d'un espace de travail Microsoft Sentinel. Une règle de synthèse nommée **FwHourly** agrège chaque heure les journaux de pare-feu dans une table personnalisée nommée **FwHourly_CL**. La requête regroupe les résultats par SourceIP, DestinationPort et DeviceName.

    Vous modifiez la requête de FwHourly pour qu'elle ne renvoie plus la colonne DeviceName.

    Quel est l'effet sur FwHourly_CL ?
body:
  options:
    - { id: a, text: { en: "DeviceName is dropped from the table schema, and its existing values are deleted", fr: "DeviceName est retirée du schéma de la table, et ses valeurs existantes sont supprimées" } }
    - { id: b, text: { en: "DeviceName stays in the table schema, and its existing values are kept until retention expires", fr: "DeviceName reste dans le schéma de la table, et ses valeurs existantes sont conservées jusqu'à l'expiration de la rétention" } }
    - { id: c, text: { en: "The rule fails on every bin until you delete DeviceName from the table schema", fr: "La règle échoue sur chaque intervalle tant que vous ne supprimez pas DeviceName du schéma de la table" } }
    - { id: d, text: { en: "The rule writes to a new table with the new schema, and FwHourly_CL stops receiving data", fr: "La règle écrit dans une nouvelle table avec le nouveau schéma, et FwHourly_CL ne reçoit plus de données" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Changing a summary rule query can add columns to the destination table, but removed fields aren't dropped automatically. The data already stored in DeviceName stays until the table retention expires, and new rows simply have no value in that column. You can delete the column manually if you don't need it.
    fr: |
      Modifier la requête d'une règle de synthèse peut ajouter des colonnes à la table de destination, mais les champs retirés ne sont pas supprimés automatiquement. Les données déjà stockées dans DeviceName restent jusqu'à l'expiration de la rétention de la table, et les nouvelles lignes n'ont simplement pas de valeur dans cette colonne. Vous pouvez supprimer la colonne manuellement si vous n'en avez pas besoin.
  options:
    a: { en: "Removed fields aren't dropped automatically; only a manual schema change removes the column.", fr: "Les champs retirés ne sont pas supprimés automatiquement ; seule une modification manuelle du schéma retire la colonne." }
    c: { en: "An extra column in the destination table doesn't make the rule fail; new rows leave it empty.", fr: "Une colonne en trop dans la table de destination ne fait pas échouer la règle ; les nouvelles lignes la laissent vide." }
    d: { en: "The destination table is a setting of the rule; editing the query doesn't create another table.", fr: "La table de destination est un paramètre de la règle ; modifier la requête ne crée pas d'autre table." }
references:
  - title: Aggregate data in a Log Analytics workspace by using summary rules
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/logs/summary-rules
