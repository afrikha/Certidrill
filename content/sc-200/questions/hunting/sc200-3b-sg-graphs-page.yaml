id: sc200-3b-sg-graphs-page
objective: "3.1.6"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Proseware is onboarded to the Microsoft Sentinel data lake. Its analysts build custom graphs with the Microsoft Sentinel extension for Visual Studio Code and explore them on the **Microsoft Sentinel > Graphs** page of the Microsoft Defender portal.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware est intégré au data lake Microsoft Sentinel. Ses analystes créent des graphes personnalisés avec l'extension Microsoft Sentinel pour Visual Studio Code et les explorent dans la page **Microsoft Sentinel > Graphs** du portail Microsoft Defender.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          A graph that an analyst builds in an interactive notebook session appears on the Graphs page without a graph job.
        fr: |
          Un graphe qu'un analyste crée dans une session de notebook interactive apparaît dans la page Graphs sans tâche de graphe.
    - id: s2
      text:
        en: |
          Because the tenant already uses the data lake, the hunting graph and blast radius are provisioned automatically when users sign in to the Defender portal.
        fr: |
          Comme le locataire utilise déjà le data lake, le graphe de chasse et le rayon d'impact sont provisionnés automatiquement lorsque les utilisateurs se connectent au portail Defender.
    - id: s3
      text:
        en: |
          GQL queries that analysts run on the Graphs page are billed under the Microsoft Sentinel graph meter.
        fr: |
          Les requêtes GQL que les analystes exécutent dans la page Graphs sont facturées sur le compteur Microsoft Sentinel graph.
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: |
      The Graphs page lists only custom graphs materialized by a graph job; a graph from an interactive session exists only in that session. For tenants that already have the data lake, the hunting graph and blast radius are auto-provisioned at sign-in to the Defender portal. Creating and querying custom graphs is billed under the Microsoft Sentinel graph meter.
    fr: |
      La page Graphs ne liste que les graphes personnalisés matérialisés par une tâche de graphe ; un graphe issu d'une session interactive n'existe que dans cette session. Pour les locataires qui disposent déjà du data lake, le graphe de chasse et le rayon d'impact sont provisionnés automatiquement à la connexion au portail Defender. La création et l'interrogation des graphes personnalisés sont facturées sur le compteur Microsoft Sentinel graph.
references:
  - title: Visualize graphs in Microsoft Sentinel (preview)
    url: https://learn.microsoft.com/en-us/azure/sentinel/datalake/graph-visualization
  - title: What is Microsoft Sentinel graph?
    url: https://learn.microsoft.com/en-us/azure/sentinel/datalake/sentinel-graph-overview
