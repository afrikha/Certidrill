id: sc200-3a-ta-yesno-report
objective: "3.1.4"
type: yesno_statements
difficulty: 3
status: draft
stem:
  en: |
    Litware, Inc. uses Microsoft Defender XDR with Microsoft Defender for Endpoint, Microsoft Defender for Office 365 and Microsoft Defender for Cloud. You review the threat analytics reports with the security team.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware, Inc. utilise Microsoft Defender XDR avec Microsoft Defender for Endpoint, Microsoft Defender for Office 365 et Microsoft Defender for Cloud. Vous passez en revue les rapports d'analytique des menaces avec l'équipe de sécurité.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: The Impacted assets tab of a report can list cloud resources affected by the threat.
        fr: L'onglet Impacted assets d'un rapport peut lister des ressources cloud touchées par la menace.
    - id: s2
      text:
        en: The Recommended actions tab of a report lists every mitigation described in its analyst report.
        fr: L'onglet Recommended actions d'un rapport liste toutes les atténuations décrites dans son analyst report.
    - id: s3
      text:
        en: On the threat analytics dashboard, the Misconfigured devices column shows Not available when Microsoft links no recommended actions to the threat.
        fr: Dans le tableau de bord de l'analytique des menaces, la colonne Misconfigured devices affiche Not available quand Microsoft ne lie aucune action recommandée à la menace.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: The Impacted assets tab covers devices, users, mailboxes, apps and cloud resources. The Recommended actions tab shows only the mitigations tracked in Microsoft Secure Score, while the analyst report can contain more. The Misconfigured devices column counts the devices on which the linked recommended actions aren't turned on and shows Not available when no recommended action is linked.
    fr: L'onglet Impacted assets couvre les appareils, les utilisateurs, les boîtes aux lettres, les applications et les ressources cloud. L'onglet Recommended actions n'affiche que les atténuations suivies dans Microsoft Secure Score, alors que l'analyst report peut en contenir davantage. La colonne Misconfigured devices compte les appareils sur lesquels les actions recommandées liées ne sont pas activées et affiche Not available quand aucune action recommandée n'est liée.
references:
  - title: Threat analytics in Microsoft Defender
    url: https://learn.microsoft.com/en-us/defender-xdr/threat-analytics
