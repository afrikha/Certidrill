id: sc200-3c-hunting-tool-match
objective: "3.2.3"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Proseware has a Microsoft Sentinel workspace onboarded to the Microsoft Defender portal. The workspace contains a firewall table named **FwLogs_CL** that uses the Auxiliary plan and receives about 1 TB per day, and the **SecurityEvent** table, which uses the Analytics plan with long-term retention.

    The SOC has the following requirements. You need to recommend a Microsoft Sentinel feature for each requirement. The solution must minimize administrative effort.

    Which feature should you recommend for each requirement? To answer, drag the appropriate features to the correct requirements. Each feature may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware dispose d'un espace de travail Microsoft Sentinel intégré au portail Microsoft Defender. L'espace de travail contient une table de pare-feu nommée **FwLogs_CL** qui utilise le plan Auxiliary et reçoit environ 1 To par jour, ainsi que la table **SecurityEvent**, qui utilise le plan Analytics avec une rétention à long terme.

    Le SOC a les exigences suivantes. Vous devez recommander une fonctionnalité Microsoft Sentinel pour chaque exigence. La solution doit réduire au minimum l'effort d'administration.

    Quelle fonctionnalité devez-vous recommander pour chaque exigence ? Pour répondre, faites glisser les fonctionnalités appropriées vers les exigences correspondantes. Chaque fonctionnalité peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: sr, text: { en: "Summary rule", fr: "Règle de synthèse" } }
    - { id: sj, text: { en: "Search job", fr: "Travail de recherche" } }
    - { id: bm, text: { en: "Bookmark", fr: "Signet" } }
    - { id: nrt, text: { en: "NRT analytics rule", fr: "Règle d'analytique NRT" } }
    - { id: fav, text: { en: "Favorite hunting query", fr: "Requête de chasse favorite" } }
  targets:
    - id: t1
      text: { en: "Every hour, aggregate FwLogs_CL by source IP and destination port into a small table that an analytics rule queries", fr: "Chaque heure, agréger FwLogs_CL par IP source et port de destination dans une petite table qu'interroge une règle d'analytique" }
    - id: t2
      text: { en: "Once, retrieve every SecurityEvent record of a server from long-term retention for an investigation", fr: "Une seule fois, récupérer tous les enregistrements SecurityEvent d'un serveur dans la rétention à long terme pour une investigation" }
    - id: t3
      text: { en: "Keep four rows returned by a hunting query as evidence and add them to an existing incident", fr: "Conserver quatre lignes renvoyées par une requête de chasse comme preuves et les ajouter à un incident existant" }
answer:
  mapping: { t1: sr, t2: sj, t3: bm }
explanation:
  correct:
    en: |
      A summary rule aggregates a verbose table of any plan on a fixed schedule into an Analytics-plan custom table that analytics rules can query cheaply. A search job retrieves records from long-term retention into a new table for a one-time investigation. A bookmark keeps selected query results with notes and entity mappings, and bookmarks can be added to an existing incident.
    fr: |
      Une règle de synthèse agrège selon une planification fixe une table volumineuse de n'importe quel plan dans une table personnalisée du plan Analytics que les règles d'analytique interrogent à faible coût. Un travail de recherche récupère des enregistrements de la rétention à long terme dans une nouvelle table pour une investigation ponctuelle. Un signet conserve des résultats de requête choisis avec des notes et des mappages d'entités, et les signets peuvent être ajoutés à un incident existant.
  options:
    nrt: { en: "An NRT rule raises alerts every minute on Analytics data; it doesn't produce an aggregated table or retrieve archived data.", fr: "Une règle NRT génère des alertes chaque minute sur des données Analytics ; elle ne produit pas de table agrégée et ne récupère pas de données archivées." }
    fav: { en: "A favorite hunting query only runs automatically when the Hunting page opens; it stores no results.", fr: "Une requête de chasse favorite s'exécute seulement à l'ouverture de la page Hunting ; elle ne stocke aucun résultat." }
references:
  - title: Aggregate Microsoft Sentinel data with summary rules
    url: https://learn.microsoft.com/en-us/azure/sentinel/summary-rules
