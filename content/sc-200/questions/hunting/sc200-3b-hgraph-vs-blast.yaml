id: sc200-3b-hgraph-vs-blast
objective: "3.1.5"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    Wingtip Toys uses Microsoft Defender XDR and is onboarded to the Microsoft Sentinel data lake. The SOC has two requirements:

    - Before any incident occurs, list every identity that has a path to the domain admins of the Active Directory domain.
    - During incident 1502, show where the compromised account **svc-backup** could spread next.

    How should you complete the plan? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Wingtip Toys utilise Microsoft Defender XDR et est intégré au data lake Microsoft Sentinel. Le SOC a deux besoins :

    - Avant tout incident, lister chaque identité qui dispose d'un chemin vers les administrateurs du domaine Active Directory.
    - Pendant l'incident 1502, montrer où le compte compromis **svc-backup** pourrait se propager ensuite.

    Comment devez-vous compléter le plan ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      For the first requirement, use [[tool]] with the [[scenario]] scenario.

      For the second requirement, select the svc-backup node in the incident graph and use [[incident]].
    fr: |
      Pour le premier besoin, utilisez [[tool]] avec le scénario [[scenario]].

      Pour le second besoin, sélectionnez le nœud svc-backup dans le graphe de l'incident et utilisez [[incident]].
  slots:
    - id: tool
      options:
        - { id: hg, text: { en: "a hunting graph in advanced hunting", fr: "un graphe de chasse dans le repérage avancé" } }
        - { id: ta, text: { en: "a threat analytics report", fr: "un rapport d'analytique des menaces" } }
        - { id: cd, text: { en: "a custom detection rule", fr: "une règle de détection personnalisée" } }
    - id: scenario
      options:
        - { id: da, text: Paths to domain admins }
        - { id: erm, text: Entity relationship map }
        - { id: kerb, text: Kerberoast paths to critical assets }
        - { id: pte, text: Paths between two entities }
    - id: incident
      options:
        - { id: br, text: { en: "View blast radius", fr: "View blast radius" } }
        - { id: gh, text: { en: "Go hunt", fr: "Go hunt" } }
        - { id: ug, text: { en: "the ungroup toggle", fr: "le bouton ungroup" } }
answer:
  values: { tool: hg, scenario: da, incident: br }
explanation:
  correct:
    en: |
      Proactive questions about who could reach what, without an incident, are answered by a hunting graph; Paths to domain admins needs no input and returns the identities with a path to the domain admins. Inside an incident, View blast radius on a node adds the possible propagation paths from that node to critical targets.
    fr: |
      Les questions proactives sur qui pourrait atteindre quoi, sans incident, relèvent d'un graphe de chasse ; Paths to domain admins ne demande aucune entrée et renvoie les identités disposant d'un chemin vers les administrateurs du domaine. Dans un incident, View blast radius sur un nœud ajoute les chemins de propagation possibles de ce nœud vers des cibles critiques.
  options:
    ta: { en: "Threat analytics reports describe threats and their impact on the tenant; they don't compute identity paths.", fr: "Les rapports d'analytique des menaces décrivent des menaces et leur impact sur le locataire ; ils ne calculent pas de chemins d'identité." }
    cd: { en: "A custom detection rule runs a query on a schedule to raise alerts; it doesn't draw paths.", fr: "Une règle de détection personnalisée exécute une requête selon une planification pour générer des alertes ; elle ne dessine pas de chemins." }
    kerb: { en: "Kerberoast paths only covers accounts exposed to Kerberoasting, not every identity with a path to the domain admins.", fr: "Kerberoast paths ne couvre que les comptes exposés au Kerberoasting, pas toutes les identités disposant d'un chemin vers les administrateurs du domaine." }
    pte: { en: "Paths between two entities needs one start and one target; it doesn't list every identity.", fr: "Paths between two entities demande un départ et une cible ; il ne liste pas toutes les identités." }
    gh: { en: "Go hunt opens an advanced hunting query on the entity's activity, not its possible next paths.", fr: "Go hunt ouvre une requête de repérage avancé sur l'activité de l'entité, pas ses prochains chemins possibles." }
references:
  - title: Hunt for threats using the hunting graph
    url: https://learn.microsoft.com/en-us/defender-xdr/advanced-hunting-graph
  - title: Investigate incidents in the Microsoft Defender portal
    url: https://learn.microsoft.com/en-us/defender-xdr/investigate-incidents
