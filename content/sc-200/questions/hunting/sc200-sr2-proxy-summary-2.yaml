id: sc200-sr2-proxy-summary-2
objective: "3.2.3"
type: series_yesno
series: sc200-sr2-proxy-summary
seriesOrder: 2
difficulty: 3
status: draft
stem:
  en: You create a summary rule that calls the ProxyEnrich function, with a bin size of 60 minutes.
  fr: Vous créez une règle de synthèse qui appelle la fonction ProxyEnrich, avec une taille d'intervalle de 60 minutes.
body:
  solution:
    en: |
      In **Microsoft Sentinel > Configuration > Summary rules**, the engineer creates a summary rule with a bin size of **60 minutes**, a new destination table named **ProxyHourly_CL** and the following query:

      `ProxyEnrich | summarize Requests = count(), Bytes = sum(BytesSent) by UserName, DestinationDomain, RiskCategory`
    fr: |
      Dans **Microsoft Sentinel > Configuration > Summary rules**, l'ingénieur crée une règle de synthèse avec une taille d'intervalle de **60 minutes**, une nouvelle table de destination nommée **ProxyHourly_CL** et la requête suivante :

      `ProxyEnrich | summarize Requests = count(), Bytes = sum(BytesSent) by UserName, DestinationDomain, RiskCategory`
answer: { value: false }
explanation:
  correct:
    en: Summary rule queries don't support user-defined functions; only Microsoft system functions can be used. ProxyEnrich is a saved workspace function, so the rule can't use it, and the enrichment must be written in the query itself.
    fr: "Les requêtes des règles de synthèse ne prennent pas en charge les fonctions définies par l'utilisateur ; seules les fonctions système de Microsoft sont utilisables. ProxyEnrich est une fonction d'espace de travail enregistrée : la règle ne peut pas l'utiliser, et l'enrichissement doit être écrit dans la requête elle-même."
references:
  - title: Aggregate Data in a Log Analytics Workspace with Summary Rules
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/logs/summary-rules
