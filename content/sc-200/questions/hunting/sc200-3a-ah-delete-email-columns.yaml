id: sc200-3a-ah-delete-email-columns
objective: "3.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Litware, Inc. uses Microsoft Defender for Office 365. You have a role that allows you to search and purge email.

    A phishing campaign reached many mailboxes. You run the following advanced hunting query:

    ```kusto
    EmailEvents
    | where Timestamp > ago(2d)
    | where Subject == "Your parcel is waiting"
    | project NetworkMessageId, RecipientEmailAddress, Subject
    ```

    You select all the results and then **Take actions**, but the **Delete email** action isn't offered. You need to soft delete the messages from the results.

    Which columns should you add to the project statement?
  fr: |
    Litware, Inc. utilise Microsoft Defender for Office 365. Vous disposez d'un rôle qui permet de rechercher et de purger des e-mails.

    Une campagne d'hameçonnage a atteint de nombreuses boîtes aux lettres. Vous exécutez la requête de repérage avancé suivante :

    ```kusto
    EmailEvents
    | where Timestamp > ago(2d)
    | where Subject == "Your parcel is waiting"
    | project NetworkMessageId, RecipientEmailAddress, Subject
    ```

    Vous sélectionnez tous les résultats puis **Take actions**, mais l'action **Delete email** n'est pas proposée. Vous devez effectuer une suppression réversible des messages à partir des résultats.

    Quelles colonnes devez-vous ajouter à l'instruction project ?
body:
  options:
    - { id: a, text: "InternetMessageId and SenderMailFromAddress" }
    - { id: b, text: "Timestamp and ReportId" }
    - { id: c, text: "EmailDirection and SenderFromAddress" }
    - { id: d, text: "RecipientObjectId and DeliveryLocation" }
answer: { optionId: c }
explanation:
  correct:
    en: Email actions use NetworkMessageId and RecipientEmailAddress, and the Delete email action appears only when the results also include EmailDirection and SenderFromAddress. With these four columns, you can choose soft delete or hard delete in the Take actions wizard.
    fr: Les actions sur les e-mails utilisent NetworkMessageId et RecipientEmailAddress, et l'action Delete email n'apparaît que si les résultats contiennent aussi EmailDirection et SenderFromAddress. Avec ces quatre colonnes, vous pouvez choisir la suppression réversible ou définitive dans l'assistant Take actions.
  options:
    a: { en: "InternetMessageId and SenderMailFromAddress are not the columns that the Delete email action requires.", fr: "InternetMessageId et SenderMailFromAddress ne sont pas les colonnes exigées par l'action Delete email." }
    b: { en: "Timestamp and ReportId identify the triggering event of a custom detection rule; they don't enable the Delete email action.", fr: "Timestamp et ReportId identifient l'événement déclencheur d'une règle de détection personnalisée ; ils n'activent pas l'action Delete email." }
    d: { en: "RecipientObjectId and DeliveryLocation are not required by the Delete email action.", fr: "RecipientObjectId et DeliveryLocation ne sont pas exigés par l'action Delete email." }
references:
  - title: Take action on advanced hunting query results
    url: https://learn.microsoft.com/en-us/defender-xdr/advanced-hunting-take-action
