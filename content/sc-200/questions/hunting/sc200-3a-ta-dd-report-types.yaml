id: sc200-3a-ta-dd-report-types
objective: "3.1.4"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Contoso, Ltd. uses Microsoft Defender XDR. You are preparing a threat briefing and need to pick threat analytics reports of the right type.

    Which analyst report type should you look for to answer each need? To answer, drag the appropriate report types to the correct needs. Each report type may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso, Ltd. utilise Microsoft Defender XDR. Vous préparez une synthèse sur les menaces et devez choisir des rapports d'analytique des menaces du bon type.

    Quel type d'analyst report devez-vous rechercher pour répondre à chaque besoin ? Pour répondre, faites glisser les types de rapports appropriés vers les besoins correspondants. Chaque type de rapport peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: activity, text: Activity }
    - { id: actor, text: Actor }
    - { id: core, text: Core threat }
    - { id: technique, text: Technique }
    - { id: tool, text: Tool }
    - { id: vuln, text: Vulnerability }
  targets:
    - id: campaign
      text: { en: "The timeline and attack chain of a specific attack campaign", fr: "La chronologie et la chaîne d'attaque d'une campagne d'attaque précise" }
    - id: group
      text: { en: "The motivations, targets and infrastructure of a threat actor tracked by Microsoft", fr: "Les motivations, les cibles et l'infrastructure d'un acteur de menace suivi par Microsoft" }
    - id: cve
      text: { en: "CVEs of a product that are exploited in the wild, with Microsoft's coverage", fr: "Les CVE d'un produit exploitées dans la nature, avec la couverture de Microsoft" }
    - id: ps
      text: { en: "The malicious use of PowerShell by many threat actors", fr: "L'utilisation malveillante de PowerShell par de nombreux acteurs de menace" }
answer:
  mapping: { campaign: activity, group: actor, cve: vuln, ps: technique }
explanation:
  correct:
    en: An Activity report covers a specific attack campaign, often tied to an actor, with timelines and attack chains. An Actor report profiles a tracked threat actor. A Vulnerability report covers one or more CVEs, including in-the-wild exploitation and Microsoft's coverage. A Technique report covers a technique used by threat actors, such as malicious PowerShell use.
    fr: Un rapport Activity couvre une campagne d'attaque précise, souvent liée à un acteur, avec des chronologies et des chaînes d'attaque. Un rapport Actor décrit un acteur de menace suivi. Un rapport Vulnerability couvre une ou plusieurs CVE, y compris leur exploitation dans la nature et la couverture de Microsoft. Un rapport Technique couvre une technique utilisée par les acteurs de menace, comme l'utilisation malveillante de PowerShell.
  options:
    core: { en: "A Core threat report combines several profile reports into a broader narrative.", fr: "Un rapport Core threat combine plusieurs rapports de profil en un récit plus large." }
    tool: { en: "A Tool report profiles a custom or open-source tool, not a technique shared by many actors.", fr: "Un rapport Tool décrit un outil personnalisé ou open source, pas une technique partagée par de nombreux acteurs." }
references:
  - title: Analyst report in threat analytics
    url: https://learn.microsoft.com/en-us/defender-xdr/threat-analytics-analyst-reports
