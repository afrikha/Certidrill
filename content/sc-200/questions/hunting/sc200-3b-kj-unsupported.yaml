id: sc200-3b-kj-unsupported
objective: "3.2.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Tailspin is onboarded to the Microsoft Sentinel data lake. A detection engineer adapts an analytics-tier hunting query so that it can run as a scheduled KQL job over data lake tables.

    Which two functions must the engineer remove from the query?

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin est intégré au data lake Microsoft Sentinel. Un ingénieur de détection adapte une requête de chasse du niveau Analytics pour l'exécuter comme tâche KQL planifiée sur des tables du data lake.

    Quelles sont les deux fonctions que l'ingénieur doit retirer de la requête ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: "externaldata()" }
    - { id: b, text: "bin()" }
    - { id: c, text: "ingestion_time()" }
    - { id: d, text: "arg_max()" }
    - { id: e, text: "parse_json()" }
    - { id: f, text: "ago()" }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |
      KQL jobs support all KQL operators and functions except adx(), arg(), externaldata() and ingestion_time(), and they don't support user-defined functions. Common functions such as bin(), arg_max(), parse_json() and ago() work as usual.
    fr: |
      Les tâches KQL prennent en charge tous les opérateurs et toutes les fonctions KQL, sauf adx(), arg(), externaldata() et ingestion_time(), et elles ne prennent pas en charge les fonctions définies par l'utilisateur. Les fonctions courantes comme bin(), arg_max(), parse_json() et ago() fonctionnent normalement.
  options:
    b: { en: "bin() is supported in KQL jobs.", fr: "bin() est pris en charge dans les tâches KQL." }
    d: { en: "arg_max() is supported in KQL jobs.", fr: "arg_max() est pris en charge dans les tâches KQL." }
    e: { en: "parse_json() is supported in KQL jobs.", fr: "parse_json() est pris en charge dans les tâches KQL." }
    f: { en: "ago() is supported in KQL jobs.", fr: "ago() est pris en charge dans les tâches KQL." }
references:
  - title: Create KQL jobs in the Microsoft Sentinel data lake
    url: https://learn.microsoft.com/en-us/azure/sentinel/datalake/kql-jobs
