id: sc200-3a-tbl-entra-noninteractive
objective: "3.1.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Litware, Inc. has Microsoft Entra ID P2 licenses and uses Microsoft Defender XDR with Microsoft Defender for Endpoint, Microsoft Defender for Identity and Microsoft Defender for Cloud Apps.

    You need to write an advanced hunting query that returns the Microsoft Entra sign-ins of the last 24 hours, **including non-interactive sign-ins**, that came from unmanaged devices and to which no Conditional Access policy was applied.

    Which table should you query?
  fr: |
    Litware, Inc. dispose de licences Microsoft Entra ID P2 et utilise Microsoft Defender XDR avec Microsoft Defender for Endpoint, Microsoft Defender for Identity et Microsoft Defender for Cloud Apps.

    Vous devez écrire une requête de repérage avancé qui renvoie les connexions Microsoft Entra des dernières 24 heures, **y compris les connexions non interactives**, qui provenaient d'appareils non gérés et auxquelles aucune stratégie d'accès conditionnel n'a été appliquée.

    Quelle table devez-vous interroger ?
body:
  options:
    - { id: a, text: IdentityLogonEvents }
    - { id: b, text: DeviceLogonEvents }
    - { id: c, text: CloudAppEvents }
    - { id: d, text: EntraIdSignInEvents }
answer: { optionId: d }
explanation:
  correct:
    en: EntraIdSignInEvents contains the Microsoft Entra interactive and non-interactive sign-ins, and it requires Microsoft Entra ID P2. Its IsManaged column (0 for an unmanaged device) and ConditionalAccessStatus column (2 when no policy was applied) answer both conditions. It replaced AADSignInEventsBeta in October 2026.
    fr: EntraIdSignInEvents contient les connexions interactives et non interactives Microsoft Entra, et nécessite Microsoft Entra ID P2. Sa colonne IsManaged (0 pour un appareil non géré) et sa colonne ConditionalAccessStatus (2 quand aucune stratégie n'a été appliquée) répondent aux deux conditions. Elle a remplacé AADSignInEventsBeta en octobre 2026.
  options:
    a: { en: "The Microsoft online services part of IdentityLogonEvents comes from Defender for Cloud Apps and covers interactive sign-ins and legacy authentication only; non-interactive sign-ins are missing.", fr: "La partie services en ligne Microsoft d'IdentityLogonEvents provient de Defender for Cloud Apps et ne couvre que les connexions interactives et l'authentification héritée ; les connexions non interactives n'y figurent pas." }
    b: { en: "DeviceLogonEvents records sign-ins on devices onboarded to Defender for Endpoint, not sign-ins to Microsoft Entra ID.", fr: "DeviceLogonEvents enregistre les ouvertures de session sur les appareils intégrés à Defender for Endpoint, pas les connexions à Microsoft Entra ID." }
    c: { en: "CloudAppEvents records activities performed in cloud apps, not the Entra sign-ins with their device and Conditional Access details.", fr: "CloudAppEvents enregistre les activités effectuées dans les applications cloud, pas les connexions Entra avec leurs détails d'appareil et d'accès conditionnel." }
references:
  - title: EntraIdSignInEvents table in the advanced hunting schema
    url: https://learn.microsoft.com/en-us/defender-xdr/advanced-hunting-entraidsigninevents-table
  - title: IdentityLogonEvents table in the advanced hunting schema
    url: https://learn.microsoft.com/en-us/defender-xdr/advanced-hunting-identitylogonevents-table
