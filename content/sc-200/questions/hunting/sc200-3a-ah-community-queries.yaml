id: sc200-3a-ah-community-queries
objective: "3.1.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Northwind Traders recently deployed Microsoft Defender XDR. The analysts are new to KQL.

    You need the analysts to start from hunting queries written by Microsoft security researchers, organized in folders such as Defense evasion and Collection, with in-line comments. The solution must minimize administrative effort.

    What should the analysts use in **Advanced hunting**?
  fr: |
    Northwind Traders a récemment déployé Microsoft Defender XDR. Les analystes débutent en KQL.

    Les analystes doivent partir de requêtes de chasse écrites par les chercheurs en sécurité de Microsoft, organisées en dossiers comme Defense evasion et Collection, avec des commentaires dans le code. La solution doit réduire au minimum l'effort d'administration.

    Que doivent utiliser les analystes dans **Advanced hunting** ?
body:
  options:
    - { id: a, text: { en: "The Shared queries folder", fr: "Le dossier Shared queries" } }
    - { id: b, text: { en: "The My queries folder", fr: "Le dossier My queries" } }
    - { id: c, text: { en: "The Custom detection rules page", fr: "La page Custom detection rules" } }
    - { id: d, text: { en: "The Community queries folder", fr: "Le dossier Community queries" } }
answer: { optionId: d }
explanation:
  correct:
    en: The Community queries group of the Queries tab contains hunting queries from Microsoft security researchers, organized in folders such as Campaigns, Collection and Defense evasion, each with in-line comments. They are reviewed before publication and also published in a public GitHub repository.
    fr: Le groupe Community queries de l'onglet Queries contient des requêtes de chasse des chercheurs en sécurité de Microsoft, organisées en dossiers comme Campaigns, Collection et Defense evasion, chacune avec des commentaires dans le code. Elles sont vérifiées avant publication et publiées aussi dans un dépôt GitHub public.
  options:
    a: { en: "Shared queries contains the queries that users of your organization saved and shared, not Microsoft's research queries.", fr: "Shared queries contient les requêtes que les utilisateurs de votre organisation ont enregistrées et partagées, pas les requêtes de recherche de Microsoft." }
    b: { en: "My queries contains only the queries that you saved for yourself.", fr: "My queries ne contient que les requêtes que vous avez enregistrées pour vous-même." }
    c: { en: "Custom detection rules run your own queries on a schedule; they aren't a library of Microsoft queries.", fr: "Les règles de détection personnalisées exécutent vos propres requêtes selon une planification ; ce n'est pas une bibliothèque de requêtes Microsoft." }
references:
  - title: Use shared queries in advanced hunting
    url: https://learn.microsoft.com/en-us/defender-xdr/advanced-hunting-shared-queries
