id: sc200-3b-hq-clone
objective: "3.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam installed a Microsoft Sentinel solution from the Content hub. The solution adds a hunting query that searches for rare processes launched by Office applications.

    You need to add an exclusion for an approved add-in to the query. The original query must stay available unchanged. The solution must minimize administrative effort.

    What should you do?
  fr: |
    Fabrikam a installé une solution Microsoft Sentinel depuis le Content hub. La solution ajoute une requête de chasse qui recherche des processus rares lancés par les applications Office.

    Vous devez ajouter à la requête une exclusion pour un complément approuvé. La requête d'origine doit rester disponible sans modification. La solution doit réduire au minimum l'effort d'administration.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Select Edit on the query and update the Query field.", fr: "Sélectionner Edit sur la requête et mettre à jour le champ Query." } }
    - { id: b, text: { en: "Select Clone on the query and edit the copy.", fr: "Sélectionner Clone sur la requête et modifier la copie." } }
    - { id: c, text: { en: "Uninstall the solution and recreate the query manually.", fr: "Désinstaller la solution et recréer la requête manuellement." } }
    - { id: d, text: { en: "Create a KQL job that runs the modified query.", fr: "Créer une tâche KQL qui exécute la requête modifiée." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Clone creates a copy of a built-in or custom hunting query that you can change and save as your own, while the original stays as it is. Queries that come from Content hub solutions can't be edited in place on the Hunting page.
    fr: |
      Clone crée une copie d'une requête de chasse intégrée ou personnalisée que vous pouvez modifier et enregistrer comme la vôtre, tandis que l'original reste inchangé. Les requêtes issues de solutions du Content hub ne peuvent pas être modifiées sur place dans la page Hunting.
  options:
    a: { en: "Only queries from a custom content source can be edited; a Content hub query must be changed at its source, and the original wouldn't stay unchanged.", fr: "Seules les requêtes d'une source de contenu personnalisée sont modifiables ; une requête du Content hub se modifie à sa source, et l'original ne resterait pas inchangé." }
    c: { en: "Uninstalling the solution removes the original query and costs more effort.", fr: "Désinstaller la solution supprime la requête d'origine et demande plus d'effort." }
    d: { en: "A KQL job writes results to a table; it doesn't create a hunting query on the Hunting page.", fr: "Une tâche KQL écrit des résultats dans une table ; elle ne crée pas de requête de chasse dans la page Hunting." }
references:
  - title: Create custom hunting queries in Microsoft Sentinel
    url: https://learn.microsoft.com/en-us/azure/sentinel/hunts-custom-queries
