id: sc200-sr2-proxy-summary-3
objective: "3.2.3"
type: series_yesno
series: sc200-sr2-proxy-summary
seriesOrder: 3
difficulty: 1
status: draft
stem:
  en: You create a summary rule that uses the lookup operator, with a bin size of 1,440 minutes.
  fr: Vous créez une règle de synthèse qui utilise l'opérateur lookup, avec une taille d'intervalle de 1 440 minutes.
body:
  solution:
    en: |
      In **Microsoft Sentinel > Configuration > Summary rules**, the engineer creates a summary rule with a bin size of **1,440 minutes**, a delay of 60 minutes, a new destination table named **ProxyHourly_CL** and the following query:

      `ProxyLogs_CL | summarize Requests = count(), Bytes = sum(BytesSent) by UserName, DestinationDomain | lookup kind=leftouter HighRiskDomains_CL on $left.DestinationDomain == $right.Domain`
    fr: |
      Dans **Microsoft Sentinel > Configuration > Summary rules**, l'ingénieur crée une règle de synthèse avec une taille d'intervalle de **1 440 minutes**, un délai de 60 minutes, une nouvelle table de destination nommée **ProxyHourly_CL** et la requête suivante :

      `ProxyLogs_CL | summarize Requests = count(), Bytes = sum(BytesSent) by UserName, DestinationDomain | lookup kind=leftouter HighRiskDomains_CL on $left.DestinationDomain == $right.Domain`
answer: { value: false }
explanation:
  correct:
    en: The bin size sets how often the rule runs and the time range of each run. A 1,440-minute bin aggregates one day of data per run, so ProxyHourly_CL is updated only once a day, not every hour; the delay only postpones each run.
    fr: "La taille d'intervalle détermine la fréquence d'exécution de la règle et la plage de temps de chaque exécution. Un intervalle de 1 440 minutes agrège une journée de données par exécution : ProxyHourly_CL n'est mis à jour qu'une fois par jour, et non toutes les heures ; le délai ne fait que retarder chaque exécution."
references:
  - title: Aggregate Data in a Log Analytics Workspace with Summary Rules
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/logs/summary-rules
