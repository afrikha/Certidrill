id: sc200-3b-hgraph-internet-kv
objective: "3.1.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Northwind Traders uses Microsoft Defender XDR and Microsoft Defender for Cloud. A key vault named **KV-Payroll** stores the payroll application secrets. KV-Payroll isn't classified as a critical asset.

    You need a hunting graph that shows how KV-Payroll can be reached from resources exposed to the internet. The graph must show only the most direct paths.

    How should you configure the hunting graph?
  fr: |
    Northwind Traders utilise Microsoft Defender XDR et Microsoft Defender for Cloud. Un coffre de clés nommé **KV-Payroll** stocke les secrets de l'application de paie. KV-Payroll n'est pas classé comme ressource critique.

    Vous avez besoin d'un graphe de chasse qui montre comment KV-Payroll peut être atteint à partir de ressources exposées à Internet. Le graphe ne doit afficher que les chemins les plus directs.

    Comment devez-vous configurer le graphe de chasse ?
body:
  options:
    - { id: a, text: { en: "Access to key vaults with KV-Payroll as the target, a Source node filter set to Is exposed to the internet, and Show only the shortest paths", fr: "Access to key vaults avec KV-Payroll comme cible, un filtre Source node défini sur Is exposed to the internet, et Show only the shortest paths" } }
    - { id: b, text: { en: "Attack paths to critical asset with KV-Payroll as the target, a Source node filter set to Is exposed to the internet, and Show only the shortest paths", fr: "Attack paths to critical asset avec KV-Payroll comme cible, un filtre Source node défini sur Is exposed to the internet, et Show only the shortest paths" } }
    - { id: c, text: { en: "Access to key vaults with KV-Payroll as the target, a Target node filter set to Is vulnerable, and Show only the shortest paths", fr: "Access to key vaults avec KV-Payroll comme cible, un filtre Target node défini sur Is vulnerable, et Show only the shortest paths" } }
    - { id: d, text: { en: "Entity relationship map with KV-Payroll as the source entity, an Edge direction filter set to Incoming, and Show only the shortest paths", fr: "Entity relationship map avec KV-Payroll comme entité source, un filtre Edge direction défini sur Incoming, et Show only the shortest paths" } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Access to key vaults takes a target key vault as input, so it works for KV-Payroll even though the vault isn't classified as critical. The Source node filter with Is exposed to the internet keeps paths that start from internet-facing nodes, and Show only the shortest paths keeps the most direct ones.
    fr: |
      Access to key vaults prend un coffre de clés cible comme entrée ; il fonctionne donc pour KV-Payroll même si le coffre n'est pas classé comme critique. Le filtre Source node avec Is exposed to the internet conserve les chemins qui partent de nœuds exposés à Internet, et Show only the shortest paths conserve les plus directs.
  options:
    b: { en: "Attack paths to critical asset expects a critical asset as the target, and KV-Payroll isn't classified as critical.", fr: "Attack paths to critical asset attend une ressource critique comme cible, et KV-Payroll n'est pas classé comme critique." }
    c: { en: "A Target node filter on Is vulnerable describes the key vault, not where the paths start; nothing limits the sources to internet-exposed nodes.", fr: "Un filtre Target node sur Is vulnerable décrit le coffre de clés, pas le point de départ des chemins ; rien ne limite les sources aux nœuds exposés à Internet." }
    d: { en: "An incoming edge filter on the relationship map doesn't restrict the starting nodes to resources exposed to the internet.", fr: "Un filtre d'arêtes entrantes sur la carte des relations ne limite pas les nœuds de départ aux ressources exposées à Internet." }
references:
  - title: Hunt for threats using the hunting graph
    url: https://learn.microsoft.com/en-us/defender-xdr/advanced-hunting-graph
