id: sc200-3a-ah-yesno-results
objective: "3.1.3"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Tailspin Toys uses Microsoft Defender XDR. Its analysts save their hunting queries in **My queries** and share their findings with managers.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin Toys utilise Microsoft Defender XDR. Ses analystes enregistrent leurs requêtes de chasse dans **My queries** et partagent leurs résultats avec leurs responsables.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: Exporting the results of a query displayed as a table produces a CSV file.
        fr: L'exportation des résultats d'une requête affichés sous forme de tableau produit un fichier CSV.
    - id: s2
      text:
        en: After an analyst deletes a query from My queries, the analyst can restore it from the Queries tab.
        fr: Après avoir supprimé une requête de My queries, un analyste peut la restaurer depuis l'onglet Queries.
    - id: s3
      text:
        en: A link created with Share link opens the query directly in the advanced hunting query editor.
        fr: Un lien créé avec Share link ouvre la requête directement dans l'éditeur de requêtes du repérage avancé.
answer:
  values: { s1: false, s2: false, s3: true }
explanation:
  correct:
    en: A table view of the results is exported as an Excel workbook, and a chart view as a JPEG image. Deleting a saved query is permanent, so Microsoft recommends renaming a query you might still need. Share link creates a link that opens the query directly in the advanced hunting query editor.
    fr: |
      La vue tableau des résultats s'exporte sous forme de classeur Excel, et la vue graphique sous forme d'image JPEG. La suppression d'une requête enregistrée est définitive : Microsoft recommande de renommer une requête dont vous pourriez encore avoir besoin. Share link crée un lien qui ouvre la requête directement dans l'éditeur de requêtes du repérage avancé.
references:
  - title: Work with advanced hunting query results
    url: https://learn.microsoft.com/en-us/defender-xdr/advanced-hunting-query-results
  - title: Use shared queries in advanced hunting
    url: https://learn.microsoft.com/en-us/defender-xdr/advanced-hunting-shared-queries
