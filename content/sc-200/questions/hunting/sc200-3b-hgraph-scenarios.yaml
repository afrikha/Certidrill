id: sc200-3b-hgraph-scenarios
objective: "3.1.5"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Litware uses Microsoft Defender XDR with hunting graphs in advanced hunting. The security team has four hunting requirements.

    Which predefined hunting graph scenario should you run for each requirement? To answer, drag the appropriate scenarios to the correct requirements. Each scenario may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware utilise Microsoft Defender XDR avec les graphes de chasse du repérage avancé. L'équipe de sécurité a quatre besoins de chasse.

    Quel scénario prédéfini de graphe de chasse devez-vous exécuter pour chaque besoin ? Pour répondre, faites glisser les scénarios appropriés vers les besoins correspondants. Chaque scénario peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: dcsync, text: "Paths to domain compromise (DCSync)" }
    - { id: kv, text: Access to key vaults }
    - { id: asrep, text: AS-REP roast paths to critical assets }
    - { id: kerb, text: Kerberoast paths to critical assets }
    - { id: rdp, text: Service accounts with RDP to critical devices }
    - { id: da, text: Paths to domain admins }
  targets:
    - id: t1
      text: { en: "Find identities that could obtain the directory replication rights used to extract password hashes from a domain controller", fr: "Trouver les identités qui pourraient obtenir les droits de réplication d'annuaire utilisés pour extraire les hachages de mots de passe d'un contrôleur de domaine" }
    - id: t2
      text: { en: "Find the paths to a key vault named KV-Payments", fr: "Trouver les chemins vers un coffre de clés nommé KV-Payments" }
    - id: t3
      text: { en: "Find accounts that don't require Kerberos preauthentication and lead to critical assets", fr: "Trouver les comptes qui n'exigent pas la préauthentification Kerberos et mènent à des ressources critiques" }
    - id: t4
      text: { en: "Find service accounts that can open Remote Desktop sessions on critical devices", fr: "Trouver les comptes de service qui peuvent ouvrir des sessions Bureau à distance sur des appareils critiques" }
answer:
  mapping: { t1: dcsync, t2: kv, t3: asrep, t4: rdp }
explanation:
  correct:
    en: |
      DCSync abuses directory replication rights, so Paths to domain compromise (DCSync) answers the first need. Access to key vaults takes a target key vault as input. AS-REP roasting targets accounts without Kerberos preauthentication, unlike Kerberoasting, which targets service tickets. Service accounts with RDP to critical devices needs no input and lists exactly those accounts.
    fr: |
      DCSync exploite les droits de réplication d'annuaire ; Paths to domain compromise (DCSync) répond donc au premier besoin. Access to key vaults prend un coffre de clés cible comme entrée. L'AS-REP roasting vise les comptes sans préauthentification Kerberos, contrairement au Kerberoasting, qui vise les tickets de service. Service accounts with RDP to critical devices ne demande aucune entrée et liste exactement ces comptes.
  options:
    kerb: { en: "Kerberoasting requests service tickets for accounts with service principal names; it doesn't depend on disabled preauthentication.", fr: "Le Kerberoasting demande des tickets de service pour des comptes dotés de noms de principal de service ; il ne dépend pas d'une préauthentification désactivée." }
    da: { en: "Paths to domain admins shows how identities can reach the domain admins, not who can abuse replication rights.", fr: "Paths to domain admins montre comment des identités peuvent atteindre les administrateurs du domaine, pas qui peut abuser des droits de réplication." }
references:
  - title: Hunt for threats using the hunting graph
    url: https://learn.microsoft.com/en-us/defender-xdr/advanced-hunting-graph
