id: sc200-cs3b-clicked-links
objective: "3.1.1"
type: single
caseStudy: sc200-cs3b-humongous-insurance
difficulty: 1
status: draft
stem:
  en: |
    The SOC has the NetworkMessageId values of the messages of a phishing campaign. You need to meet the hunting requirement. Which table should you query in advanced hunting?
  fr: |
    Le SOC dispose des valeurs NetworkMessageId des messages d'une campagne d'hameçonnage. Vous devez respecter l'exigence de chasse. Quelle table devez-vous interroger dans le repérage avancé ?
body:
  options:
    - { id: a, text: EmailUrlInfo }
    - { id: b, text: EmailPostDeliveryEvents }
    - { id: c, text: UrlClickEvents }
    - { id: d, text: EmailEvents }
answer: { optionId: c }
explanation:
  correct:
    en: |
      UrlClickEvents records the Safe Links clicks from email messages, Teams and Office apps, with the AccountUpn of the user who clicked and the NetworkMessageId of the email that contained the link. Filtering on the campaign's NetworkMessageId values returns the users who clicked.
    fr: |
      UrlClickEvents enregistre les clics Liens fiables (Safe Links) depuis les e-mails, Teams et les applications Office, avec l'AccountUpn de l'utilisateur qui a cliqué et le NetworkMessageId de l'e-mail qui contenait le lien. Un filtre sur les valeurs NetworkMessageId de la campagne renvoie les utilisateurs qui ont cliqué.
  options:
    a: { en: "EmailUrlInfo lists the URLs found in messages, not whether a recipient clicked them.", fr: "EmailUrlInfo liste les URL trouvées dans les messages, pas le fait qu'un destinataire a cliqué dessus." }
    b: { en: "EmailPostDeliveryEvents records actions taken on messages after delivery, such as automatic purges, not user clicks.", fr: "EmailPostDeliveryEvents enregistre les actions appliquées aux messages après leur remise, comme les purges automatiques, pas les clics des utilisateurs." }
    d: { en: "EmailEvents describes the sending and delivery of each message, not what recipients did with its links.", fr: "EmailEvents décrit l'envoi et la remise de chaque message, pas ce que les destinataires ont fait de ses liens." }
references:
  - title: UrlClickEvents
    url: https://learn.microsoft.com/en-us/defender-xdr/advanced-hunting-urlclickevents-table
