id: sc200-3c-summary-config
objective: "3.2.3"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Contoso has a Microsoft Sentinel workspace that contains a table named **WebProxy_CL**. Events can reach WebProxy_CL up to 15 minutes after they occur.

    You need to create a summary rule that writes an hourly summary of WebProxy_CL to a new table named ProxyHourly. The rule must not miss late events, and each summary must be available as soon as possible.

    How should you configure the summary rule? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso dispose d'un espace de travail Microsoft Sentinel qui contient une table nommée **WebProxy_CL**. Les événements peuvent arriver dans WebProxy_CL jusqu'à 15 minutes après s'être produits.

    Vous devez créer une règle de synthèse qui écrit une synthèse horaire de WebProxy_CL dans une nouvelle table nommée ProxyHourly. La règle ne doit pas manquer les événements tardifs, et chaque synthèse doit être disponible le plus tôt possible.

    Comment devez-vous configurer la règle de synthèse ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Destination table: [[table]]
      Run summary every: [[bin]]
      Delay: [[delay]]
    fr: |
      Table de destination : [[table]]
      Run summary every : [[bin]]
      Délai : [[delay]]
  slots:
    - id: table
      options:
        - { id: plain, text: ProxyHourly }
        - { id: srch, text: ProxyHourly_SRCH }
        - { id: cl, text: ProxyHourly_CL }
        - { id: sprk, text: ProxyHourly_SPRK }
    - id: bin
      options:
        - { id: b20, text: { en: "20 minutes", fr: "20 minutes" } }
        - { id: b60, text: { en: "60 minutes", fr: "60 minutes" } }
        - { id: b120, text: { en: "120 minutes", fr: "120 minutes" } }
        - { id: b1440, text: { en: "1,440 minutes", fr: "1 440 minutes" } }
    - id: delay
      options:
        - { id: ddef, text: { en: "Default", fr: "Par défaut" } }
        - { id: d15, text: { en: "15 minutes", fr: "15 minutes" } }
        - { id: d60, text: { en: "60 minutes", fr: "60 minutes" } }
        - { id: d1440, text: { en: "1,440 minutes", fr: "1 440 minutes" } }
answer:
  values: { table: cl, bin: b60, delay: d15 }
explanation:
  correct:
    en: |
      The destination of a summary rule is a custom table whose name ends with _CL. An hourly summary uses a bin size of 60 minutes. The delay should be at least the known ingestion latency of the source, so 15 minutes covers late events while publishing each summary as early as possible.
    fr: |
      La destination d'une règle de synthèse est une table personnalisée dont le nom se termine par _CL. Une synthèse horaire utilise une taille d'intervalle de 60 minutes. Le délai doit être au moins égal à la latence d'ingestion connue de la source : 15 minutes couvre les événements tardifs tout en publiant chaque synthèse le plus tôt possible.
  options:
    plain: { en: "A destination table name must end with _CL.", fr: "Le nom d'une table de destination doit se terminer par _CL." }
    srch: { en: "_SRCH is the suffix of search job result tables, not a valid summary rule destination.", fr: "_SRCH est le suffixe des tables de résultats des travaux de recherche, pas une destination valide de règle de synthèse." }
    sprk: { en: "_SPRK is the suffix of data lake tables written by notebooks.", fr: "_SPRK est le suffixe des tables du data lake écrites par les notebooks." }
    ddef: { en: "The default delay is between 3.5 minutes and 10 % of the bin size, about 6 minutes for a 60-minute bin, which is shorter than the 15-minute latency.", fr: "Le délai par défaut est compris entre 3,5 minutes et 10 % de la taille d'intervalle, soit environ 6 minutes pour un intervalle de 60 minutes, ce qui est inférieur à la latence de 15 minutes." }
    d60: { en: "A 60-minute delay also covers late events but makes each summary available 45 minutes later than needed.", fr: "Un délai de 60 minutes couvre aussi les événements tardifs, mais rend chaque synthèse disponible 45 minutes plus tard que nécessaire." }
    d1440: { en: "A one-day delay would postpone every hourly summary by a day.", fr: "Un délai d'un jour retarderait chaque synthèse horaire d'une journée." }
    b20: { en: "A 20-minute bin produces three summaries per hour instead of one hourly summary.", fr: "Un intervalle de 20 minutes produit trois synthèses par heure au lieu d'une synthèse horaire." }
references:
  - title: Aggregate data in a Log Analytics workspace by using summary rules
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/logs/summary-rules
