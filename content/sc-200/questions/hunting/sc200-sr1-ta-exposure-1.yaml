id: sc200-sr1-ta-exposure-1
objective: "3.1.4"
type: series_yesno
series: sc200-sr1-ta-exposure
seriesOrder: 1
difficulty: 1
status: draft
stem:
  en: You review the Impacted assets tab of the report with your current role.
  fr: Vous consultez l'onglet Impacted assets du rapport avec votre rôle actuel.
body:
  solution:
    en: |
      Without changing your role, you open the threat analytics report and review the **Impacted assets** tab, with the view set to **All**.
    fr: |
      Sans modifier votre rôle, vous ouvrez le rapport d'analytique des menaces et consultez l'onglet **Impacted assets**, avec la vue définie sur **All**.
answer: { value: false }
explanation:
  correct:
    en: |
      Impacted assets lists the devices, users, mailboxes, apps and cloud resources that have alerts related to the threat. No alert has been raised, so the tab shows nothing, and it never shows exposure to vulnerabilities or the status of the recommended mitigations.
    fr: |
      Impacted assets liste les appareils, utilisateurs, boîtes aux lettres, applications et ressources cloud qui ont des alertes liées à la menace. Aucune alerte n'a été déclenchée : l'onglet n'affiche rien, et il ne montre jamais l'exposition aux vulnérabilités ni l'état des atténuations recommandées.
references:
  - title: Threat analytics in Microsoft Defender
    url: https://learn.microsoft.com/en-us/defender-xdr/threat-analytics
