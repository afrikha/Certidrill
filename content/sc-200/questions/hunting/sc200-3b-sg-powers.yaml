id: sc200-3b-sg-powers
objective: "3.1.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso is onboarded to the Microsoft Sentinel data lake. SOC analysts use the hunting graph and blast radius in the Microsoft Defender portal. The data security team uses the data risk graph in Microsoft Purview Insider Risk Management.

    You need to identify the capability that provides the graph analytics layer behind all these experiences.

    Which capability should you identify?
  fr: |
    Contoso est intégré au data lake Microsoft Sentinel. Les analystes du SOC utilisent le graphe de chasse et le rayon d'impact dans le portail Microsoft Defender. L'équipe de sécurité des données utilise le graphe des risques liés aux données dans Microsoft Purview Insider Risk Management.

    Vous devez identifier la fonctionnalité qui fournit la couche d'analytique de graphe derrière toutes ces expériences.

    Quelle fonctionnalité devez-vous identifier ?
body:
  options:
    - { id: a, text: User and Entity Behavior Analytics (UEBA) }
    - { id: b, text: Microsoft Sentinel graph }
    - { id: c, text: { en: "The Microsoft Sentinel investigation graph", fr: "Le graphe d'investigation Microsoft Sentinel" } }
    - { id: d, text: { en: "Fusion multistage attack detection", fr: "La détection d'attaques multiphases Fusion" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Microsoft Sentinel graph is the unified graph analytics capability of Microsoft Sentinel. It is enabled with the data lake and powers the incident graph with blast radius, the hunting graph, the Purview data risk graphs, attack paths and custom graphs.
    fr: |
      Microsoft Sentinel graph est la fonctionnalité unifiée d'analytique de graphe de Microsoft Sentinel. Il s'active avec le data lake et alimente le graphe de l'incident avec rayon d'impact, le graphe de chasse, les graphes des risques liés aux données de Purview, les chemins d'attaque et les graphes personnalisés.
  options:
    a: { en: "UEBA builds behavioral baselines and anomalies for users and entities; it isn't a graph layer shared with Purview.", fr: "UEBA crée des références comportementales et des anomalies pour les utilisateurs et les entités ; ce n'est pas une couche de graphe partagée avec Purview." }
    c: { en: "The investigation graph displays the entities of a Sentinel incident; it doesn't power hunting graphs or Purview experiences.", fr: "Le graphe d'investigation affiche les entités d'un incident Sentinel ; il n'alimente ni les graphes de chasse ni les expériences Purview." }
    d: { en: "Fusion correlates alerts into multistage incidents; it doesn't provide graph analytics to other products.", fr: "Fusion met en corrélation des alertes en incidents multiphases ; il ne fournit pas d'analytique de graphe aux autres produits." }
references:
  - title: What is Microsoft Sentinel graph?
    url: https://learn.microsoft.com/en-us/azure/sentinel/datalake/sentinel-graph-overview
