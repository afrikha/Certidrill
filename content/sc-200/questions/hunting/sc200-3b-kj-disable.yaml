id: sc200-3b-kj-disable
objective: "3.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Contoso is onboarded to the Microsoft Sentinel data lake. A scheduled KQL job named **BeaconScan** runs every 30 minutes, and one of its runs is in progress.

    You need to prevent any future run of BeaconScan, starting now. The job definition must be kept so that it can be reused next month.

    What should you do?
  fr: |
    Contoso est intégré au data lake Microsoft Sentinel. Une tâche KQL planifiée nommée **BeaconScan** s'exécute toutes les 30 minutes, et l'une de ses exécutions est en cours.

    Vous devez empêcher toute exécution future de BeaconScan, dès maintenant. La définition de la tâche doit être conservée pour être réutilisée le mois prochain.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Delete BeaconScan from the job details pane.", fr: "Supprimer BeaconScan depuis le volet de détails de la tâche." } }
    - { id: b, text: { en: "Edit BeaconScan and change it to a One time job.", fr: "Modifier BeaconScan pour en faire une tâche One time." } }
    - { id: c, text: { en: "Disable BeaconScan from the job details pane.", fr: "Désactiver BeaconScan depuis le volet de détails de la tâche." } }
    - { id: d, text: { en: "Remove the Log Analytics Contributor role from the msg-resources-<guid> managed identity.", fr: "Retirer le rôle Log Analytics Contributor de l'identité managée msg-resources-<guid>." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      A disabled job doesn't run until it's enabled again, and its definition is kept. Future scheduled runs that aren't queued yet are cancelled, while the run in progress completes.
    fr: |
      Une tâche désactivée ne s'exécute plus jusqu'à sa réactivation, et sa définition est conservée. Les futures exécutions planifiées qui ne sont pas encore en file d'attente sont annulées, tandis que l'exécution en cours se termine.
  options:
    a: { en: "Deletion is permanent, so the job couldn't be reused, and a running job can't be deleted.", fr: "La suppression est définitive : la tâche ne pourrait pas être réutilisée, et une tâche en cours d'exécution ne peut pas être supprimée." }
    b: { en: "Editing a job into a one-time job triggers a new run immediately.", fr: "Transformer une tâche en tâche ponctuelle déclenche immédiatement une nouvelle exécution." }
    d: { en: "The role only matters for creating new tables, and removing it would affect every job of the workspace without disabling BeaconScan.", fr: "Le rôle ne compte que pour créer de nouvelles tables, et le retirer affecterait toutes les tâches de l'espace de travail sans désactiver BeaconScan." }
references:
  - title: Manage jobs in the Microsoft Sentinel data lake
    url: https://learn.microsoft.com/en-us/azure/sentinel/datalake/kql-manage-jobs
