id: sc200-3b-sg-exposure-tables
objective: "3.1.6"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove Bank uses Microsoft Defender XDR and Microsoft Security Exposure Management. An analyst plans to answer hunting questions by querying only the **ExposureGraphNodes** and **ExposureGraphEdges** tables in advanced hunting.

    Which two questions can the analyst answer with these tables?

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove Bank utilise Microsoft Defender XDR et Microsoft Security Exposure Management. Un analyste prévoit de répondre à des questions de chasse en interrogeant uniquement les tables **ExposureGraphNodes** et **ExposureGraphEdges** dans le repérage avancé.

    À quelles deux questions l'analyste peut-il répondre avec ces tables ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Which virtual machines are exposed to the internet and vulnerable to remote code execution?", fr: "Quelles machines virtuelles sont exposées à Internet et vulnérables à l'exécution de code à distance ?" } }
    - { id: b, text: { en: "Which accounts signed in to the virtual machine VM-HR01 yesterday?", fr: "Quels comptes se sont connectés hier à la machine virtuelle VM-HR01 ?" } }
    - { id: c, text: { en: "Which types of nodes have a relationship to virtual machines?", fr: "Quels types de nœuds ont une relation avec des machines virtuelles ?" } }
    - { id: d, text: { en: "Which processes opened a connection to the IP address 203.0.113.50 last week?", fr: "Quels processus ont ouvert une connexion vers l'adresse IP 203.0.113.50 la semaine dernière ?" } }
    - { id: e, text: { en: "Which users read secrets from the key vault KV-Core during the last 24 hours?", fr: "Quels utilisateurs ont lu des secrets du coffre de clés KV-Core au cours des dernières 24 heures ?" } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |
      The exposure graph tables describe assets (ExposureGraphNodes, with properties such as internet exposure and vulnerabilities) and the relationships between them (ExposureGraphEdges). They answer questions about posture and relationships, such as exposed vulnerable VMs or the node types connected to VMs, but they don't record activity such as sign-ins, connections or secret reads.
    fr: |
      Les tables du graphe d'exposition décrivent les ressources (ExposureGraphNodes, avec des propriétés comme l'exposition à Internet et les vulnérabilités) et les relations entre elles (ExposureGraphEdges). Elles répondent aux questions de posture et de relations, comme les machines virtuelles exposées et vulnérables ou les types de nœuds reliés aux machines virtuelles, mais elles n'enregistrent pas d'activité comme les connexions d'utilisateurs, les connexions réseau ou les lectures de secrets.
  options:
    b: { en: "Sign-ins are activity events, recorded in tables such as DeviceLogonEvents, not in the exposure graph.", fr: "Les connexions sont des événements d'activité, enregistrés dans des tables comme DeviceLogonEvents, pas dans le graphe d'exposition." }
    d: { en: "Network connections by processes are activity events recorded in DeviceNetworkEvents.", fr: "Les connexions réseau des processus sont des événements d'activité enregistrés dans DeviceNetworkEvents." }
    e: { en: "Secret reads are activity logged by the key vault, not relationships of the exposure graph.", fr: "Les lectures de secrets sont une activité journalisée par le coffre de clés, pas des relations du graphe d'exposition." }
references:
  - title: Query the enterprise exposure graph
    url: https://learn.microsoft.com/en-us/security-exposure-management/query-enterprise-exposure-graph
