status: draft
stem:
  en: You create a Microsoft Sentinel alert from the query results.
  fr: Vous créez une alerte Microsoft Sentinel à partir des résultats de la requête.
body:
  solution:
    en: You run ShadowCopyDeletion, select **New alert rule > Create Microsoft Sentinel alert**, and in the analytics rule wizard you set the rule to run every **1 hour** on the data of the last **1 hour**, generate an alert when the number of results is greater than 0, and keep incident creation enabled.
    fr: Vous exécutez ShadowCopyDeletion, sélectionnez **New alert rule > Create Microsoft Sentinel alert** puis, dans l'Assistant de règle d'analytique, vous configurez la règle pour qu'elle s'exécute toutes les heures (**1 heure**) sur les données de la dernière heure (**1 heure**), génère une alerte lorsque le nombre de résultats est supérieur à 0, et vous laissez la création d'incidents activée.
answer: { value: true }
explanation:
  correct:
    en: Create Microsoft Sentinel alert opens the analytics rule wizard with the hunting query, which produces a scheduled analytics rule. The rule runs the logic every hour on SecurityEvent, which is in the Analytics tier, and its incident settings create an incident from each alert without analyst action.
    fr: Create Microsoft Sentinel alert ouvre l'Assistant de règle d'analytique avec la requête de chasse, ce qui produit une règle d'analytique planifiée. La règle exécute la logique toutes les heures sur SecurityEvent, qui se trouve dans le niveau Analytics, et ses paramètres d'incident créent un incident à partir de chaque alerte sans action d'un analyste.
references:
  - title: Hunting Capabilities in Microsoft Sentinel
    url: https://learn.microsoft.com/en-us/azure/sentinel/hunting
