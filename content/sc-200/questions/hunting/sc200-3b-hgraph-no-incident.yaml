id: sc200-3b-hgraph-no-incident
objective: "3.1.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso uses Microsoft Defender XDR and a Microsoft Sentinel workspace that is onboarded to the Microsoft Sentinel data lake. You have read access to Microsoft Security Exposure Management and the permissions required for advanced hunting.

    No incident involves a server named **SRV-FIN01**, which is classified as a critical asset. You need to display, as an interactive graph of nodes and edges, the attack paths that lead to SRV-FIN01.

    What should you do?
  fr: |
    Contoso utilise Microsoft Defender XDR et un espace de travail Microsoft Sentinel intégré au data lake Microsoft Sentinel. Vous disposez d'un accès en lecture à Microsoft Security Exposure Management et des autorisations nécessaires au repérage avancé.

    Aucun incident ne concerne le serveur **SRV-FIN01**, classé comme ressource critique. Vous devez afficher, sous forme de graphe interactif de nœuds et d'arêtes, les chemins d'attaque qui mènent à SRV-FIN01.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "In Advanced hunting, select Create new > Hunting graph, and then run a scenario.", fr: "Dans Advanced hunting, sélectionner Create new > Hunting graph, puis exécuter un scénario." } }
    - { id: b, text: { en: "In Advanced hunting, run a query on DeviceNetworkEvents that ends with a render operator.", fr: "Dans Advanced hunting, exécuter une requête sur DeviceNetworkEvents qui se termine par un opérateur render." } }
    - { id: c, text: { en: "On the Incidents page, select a node of the incident graph and select View blast radius.", fr: "Dans la page Incidents, sélectionner un nœud du graphe de l'incident et sélectionner View blast radius." } }
    - { id: d, text: { en: "In Threat analytics, open a report and review the Impacted assets tab for SRV-FIN01.", fr: "Dans Threat analytics, ouvrir un rapport et consulter l'onglet Impacted assets pour SRV-FIN01." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      A hunting graph renders a threat scenario as nodes and edges inside advanced hunting. You open it with the hunting graph icon or Create new > Hunting graph, then select Search with Predefined scenarios and choose a scenario such as Attack paths to critical asset, with SRV-FIN01 as the target.
    fr: |
      Un graphe de chasse représente un scénario de menace sous forme de nœuds et d'arêtes dans le repérage avancé. Vous l'ouvrez avec l'icône de graphe de chasse ou Create new > Hunting graph, puis vous sélectionnez Search with Predefined scenarios et un scénario comme Attack paths to critical asset, avec SRV-FIN01 comme cible.
  options:
    b: { en: "A render operator draws a chart of query results; it doesn't compute attack paths between entities.", fr: "Un opérateur render dessine un graphique à partir des résultats ; il ne calcule pas de chemins d'attaque entre entités." }
    c: { en: "Blast radius starts from a node of an incident graph, and no incident involves SRV-FIN01.", fr: "Le rayon d'impact part d'un nœud du graphe d'un incident, et aucun incident ne concerne SRV-FIN01." }
    d: { en: "Impacted assets lists assets affected by a specific threat; it doesn't draw the paths that lead to an asset.", fr: "Impacted assets liste les ressources touchées par une menace donnée ; il ne dessine pas les chemins qui mènent à une ressource." }
references:
  - title: Hunt for threats using the hunting graph
    url: https://learn.microsoft.com/en-us/defender-xdr/advanced-hunting-graph
