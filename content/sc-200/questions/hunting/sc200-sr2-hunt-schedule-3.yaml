stem:
  en: You bookmark the results and create an incident from the bookmarks.
  fr: Vous ajoutez les résultats aux signets et créez un incident à partir des signets.
body:
  solution:
    en: You run ShadowCopyDeletion, add the returned rows as **bookmarks**, select the bookmarks on the **Bookmarks** tab, and then select **Incident actions > Create new incident**.
    fr: Vous exécutez ShadowCopyDeletion, ajoutez les lignes renvoyées comme **signets** (bookmarks), sélectionnez les signets dans l'onglet **Bookmarks**, puis sélectionnez **Incident actions > Create new incident**.
answer: { value: false }
explanation:
  correct:
    en: Bookmarks keep the rows of one manual run, and Incident actions turns the selected bookmarks into an incident once. The query is not scheduled, and each new incident requires an analyst to run the query and create it.
    fr: Les signets conservent les lignes d'une exécution manuelle, et Incident actions transforme une seule fois les signets sélectionnés en incident. La requête n'est pas planifiée, et chaque nouvel incident exige qu'un analyste exécute la requête et le crée.
references:
  - title: Hunting Capabilities in Microsoft Sentinel
    url: https://learn.microsoft.com/en-us/azure/sentinel/hunting
