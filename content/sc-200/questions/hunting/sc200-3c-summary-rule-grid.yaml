id: sc200-3c-summary-rule-grid
objective: "3.2.3"
type: hotarea
difficulty: 3
status: draft
stem:
  en: |
    Adatum has a Microsoft Sentinel workspace. A detection engineer drafted the summary rules shown in the following table. All the source tables exist, and no destination table exists yet.

    Answer each prompt by selecting the name of the appropriate rule.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum dispose d'un espace de travail Microsoft Sentinel. Un ingénieur de détection a préparé les règles de synthèse présentées dans le tableau suivant. Toutes les tables sources existent, et aucune table de destination n'existe encore.

    Répondez à chaque consigne en sélectionnant le nom de la règle appropriée.

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
    - id: p1
      text: { en: "The rule whose bin size can't be configured", fr: "La règle dont la taille d'intervalle ne peut pas être configurée" }
    - id: p2
      text: { en: "The rule whose query uses an operator that summary rules don't support", fr: "La règle dont la requête utilise un opérateur que les règles de synthèse ne prennent pas en charge" }
  grid:
    header:
      - { en: Rule, fr: Règle }
      - { en: "Source table (plan)", fr: "Table source (plan)" }
      - { en: "Bin size (minutes)", fr: "Taille d'intervalle (minutes)" }
      - { en: Destination table, fr: Table de destination }
      - { en: Query, fr: Requête }
    rows:
      - [{ text: SR-Dns, area: dns }, { text: "DnsLogs_CL (Auxiliary)" }, { text: "60" }, { text: DnsHourly_CL }, { text: "summarize Queries = count() by ClientIP, QueryName" }]
      - [{ text: SR-Proxy, area: proxy }, { text: "ProxyLogs_CL (Basic)" }, { text: "90" }, { text: ProxySummary_CL }, { text: "summarize TotalSent = sum(SentBytes) by SrcUser" }]
      - [{ text: SR-Fw, area: fw }, { text: "CommonSecurityLog (Analytics)" }, { text: "120" }, { text: FwDenied_CL }, { text: "summarize Denied = countif(DeviceAction == \"Deny\") by SourceIP" }]
      - [{ text: SR-Signin, area: signin }, { text: "SigninLogs (Analytics)" }, { text: "1440" }, { text: SigninDaily_CL }, { text: "evaluate bag_unpack(DeviceDetail)" }]
      - [{ text: SR-Audit, area: audit }, { text: "AuditLogs (Analytics)" }, { text: "360" }, { text: AuditOps_CL }, { text: "summarize Ops = count() by OperationName" }]
answer:
  values: { p1: proxy, p2: signin }
explanation:
  correct:
    en: |
      The bin size of a summary rule must be 20, 30, 60, 120, 180, 360, 720 or 1,440 minutes, so the 90 minutes of SR-Proxy can't be configured. Summary rule queries don't support schema-reshaping plugins such as bag_unpack, narrow and pivot, so SR-Signin is invalid. The other rules use allowed bin sizes and supported operators, and any source plan (Analytics, Basic or Auxiliary) is allowed.
    fr: |
      La taille d'intervalle d'une règle de synthèse doit être de 20, 30, 60, 120, 180, 360, 720 ou 1 440 minutes ; les 90 minutes de SR-Proxy ne peuvent donc pas être configurées. Les requêtes des règles de synthèse ne prennent pas en charge les plug-ins qui remodèlent le schéma comme bag_unpack, narrow et pivot ; SR-Signin n'est donc pas valide. Les autres règles utilisent des tailles d'intervalle autorisées et des opérateurs pris en charge, et n'importe quel plan source (Analytics, Basic ou Auxiliary) est autorisé.
references:
  - title: Aggregate data in a Log Analytics workspace by using summary rules
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/logs/summary-rules
