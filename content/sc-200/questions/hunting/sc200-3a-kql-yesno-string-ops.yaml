id: sc200-3a-kql-yesno-string-ops
objective: "3.1.2"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    You are tuning advanced hunting queries in the Microsoft Defender portal and evaluate the following expressions.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous optimisez des requêtes de repérage avancé dans le portail Microsoft Defender et évaluez les expressions suivantes.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: '`"powershell -c Invoke-WebRequest" has "invoke"` returns true.'
        fr: '`"powershell -c Invoke-WebRequest" has "invoke"` renvoie true.'
    - id: s2
      text:
        en: '`"PowerShell.exe" == "powershell.exe"` returns true.'
        fr: '`"PowerShell.exe" == "powershell.exe"` renvoie true.'
    - id: s3
      text:
        en: '`"evilcontoso.com" endswith "contoso.com"` returns true.'
        fr: '`"evilcontoso.com" endswith "contoso.com"` renvoie true.'
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: has matches whole terms, which are maximal sequences of alphanumeric characters; the hyphen separates Invoke from WebRequest, so Invoke is a term, and has ignores case. == is case-sensitive. endswith is a case-insensitive substring match on the end of the value, so evilcontoso.com matches contoso.com; to match a domain exactly, compare the whole value or include the leading dot.
    fr: |
      has correspond à des termes entiers, c'est-à-dire des séquences maximales de caractères alphanumériques ; le trait d'union sépare Invoke de WebRequest, donc Invoke est un terme, et has ignore la casse. == est sensible à la casse. endswith est une correspondance de sous-chaîne, insensible à la casse, sur la fin de la valeur : evilcontoso.com correspond à contoso.com ; pour cibler un domaine exactement, comparez la valeur entière ou incluez le point initial.
references:
  - title: String operators
    url: https://learn.microsoft.com/en-us/kusto/query/datatypes-string-operators
