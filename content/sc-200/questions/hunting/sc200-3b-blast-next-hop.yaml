id: sc200-3b-blast-next-hop
objective: "3.1.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Tailspin uses Microsoft Defender XDR and was onboarded to the Microsoft Sentinel data lake in June 2026. You have the Exposure management (read) permission.

    Incident 3120 shows that the user account **j.moreau** is compromised. You need to identify the critical assets that an attacker could reach next from j.moreau, directly from the incident.

    What should you do?
  fr: |
    Tailspin utilise Microsoft Defender XDR et a été intégré au data lake Microsoft Sentinel en juin 2026. Vous disposez de l'autorisation Exposure management (read).

    L'incident 3120 montre que le compte d'utilisateur **j.moreau** est compromis. Vous devez identifier les ressources critiques qu'un attaquant pourrait atteindre ensuite à partir de j.moreau, directement depuis l'incident.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "In the incident graph, select the j.moreau node, and then select Go hunt.", fr: "Dans le graphe de l'incident, sélectionner le nœud j.moreau, puis sélectionner Go hunt." } }
    - { id: b, text: { en: "In the incident graph, select the j.moreau node, and then select View blast radius.", fr: "Dans le graphe de l'incident, sélectionner le nœud j.moreau, puis sélectionner View blast radius." } }
    - { id: c, text: { en: "In the incident, open the Evidence and Response tab, and then review the j.moreau entity.", fr: "Dans l'incident, ouvrir l'onglet Evidence and Response, puis examiner l'entité j.moreau." } }
    - { id: d, text: { en: "In the incident, open the Alerts tab, and then review the alert story of each alert.", fr: "Dans l'incident, ouvrir l'onglet Alerts, puis examiner l'histoire de chaque alerte." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Blast radius shows the possible propagation paths from a selected node of the incident graph to critical targets. You select the node, then View blast radius in its context menu, and the graph adds the paths the attacker could take next.
    fr: |
      Le rayon d'impact montre les chemins de propagation possibles entre un nœud sélectionné du graphe de l'incident et des cibles critiques. Vous sélectionnez le nœud, puis View blast radius dans son menu contextuel, et le graphe ajoute les chemins que l'attaquant pourrait emprunter ensuite.
  options:
    a: { en: "Go hunt opens a prebuilt advanced hunting query on the entity's activity; it doesn't compute paths to critical assets.", fr: "Go hunt ouvre une requête de repérage avancé prédéfinie sur l'activité de l'entité ; elle ne calcule pas de chemins vers des ressources critiques." }
    c: { en: "Evidence and Response lists the entities involved in the incident and their remediation status, not where an attacker could go next.", fr: "Evidence and Response liste les entités impliquées dans l'incident et leur état de correction, pas l'endroit où un attaquant pourrait aller ensuite." }
    d: { en: "The alert story describes what already happened; it doesn't show possible future paths.", fr: "L'histoire de l'alerte décrit ce qui s'est déjà passé ; elle ne montre pas les chemins futurs possibles." }
references:
  - title: Investigate incidents in the Microsoft Defender portal
    url: https://learn.microsoft.com/en-us/defender-xdr/investigate-incidents
