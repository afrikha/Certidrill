id: sc200-3a-ah-dd-guided-mode
objective: "3.1.3"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    Proseware, Inc. uses Microsoft Defender XDR with Microsoft Defender for Endpoint, Microsoft Defender for Identity and Microsoft Defender for Cloud Apps. A junior analyst who doesn't know KQL must hunt for suspicious account activity.

    You need to explain how to build the query in **Advanced hunting** without writing KQL, and how to limit the hunt to the data of Defender for Identity and Defender for Cloud Apps.

    How should you complete the instructions? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware, Inc. utilise Microsoft Defender XDR avec Microsoft Defender for Endpoint, Microsoft Defender for Identity et Microsoft Defender for Cloud Apps. Un analyste débutant qui ne connaît pas KQL doit rechercher une activité de compte suspecte.

    Vous devez expliquer comment créer la requête dans **Advanced hunting** sans écrire de KQL, et comment limiter la chasse aux données de Defender for Identity et de Defender for Cloud Apps.

    Comment devez-vous compléter les instructions ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Select **Create new**, and then select [[mode]]. In the domain list, select [[domain]], add the conditions, and then select **Run query**.
    fr: |
      Sélectionnez **Create new**, puis [[mode]]. Dans la liste des domaines, sélectionnez [[domain]], ajoutez les conditions, puis sélectionnez **Run query**.
  slots:
    - id: mode
      options:
        - { id: builder, text: "**Query in builder**" }
        - { id: rule, text: "**Create detection rule**" }
        - { id: shared, text: "**Shared queries**" }
    - id: domain
      options:
        - { id: apps, text: "**Apps and identities**" }
        - { id: endpoints, text: "**Endpoints**" }
        - { id: cloud, text: "**Cloud infrastructure**" }
        - { id: exposure, text: "**Exposure management**" }
answer:
  values: { mode: builder, domain: apps }
explanation:
  correct:
    en: Guided mode is opened with Create new and Query in builder; it builds a query from drop-down menus without KQL. The Apps and identities domain limits the hunt to the data of Defender for Cloud Apps and Defender for Identity, and shows only the filters relevant to it.
    fr: Le mode guidé s'ouvre avec Create new puis Query in builder ; il construit une requête à partir de menus déroulants, sans KQL. Le domaine Apps and identities limite la chasse aux données de Defender for Cloud Apps et de Defender for Identity, et n'affiche que les filtres qui le concernent.
  options:
    rule: { en: "Create detection rule turns an existing query into a scheduled custom detection; it doesn't build a query.", fr: "Create detection rule transforme une requête existante en détection personnalisée planifiée ; il ne construit pas de requête." }
    endpoints: { en: "The Endpoints domain contains the Defender for Endpoint data.", fr: "Le domaine Endpoints contient les données de Defender for Endpoint." }
    cloud: { en: "The Cloud infrastructure domain contains the Defender for Cloud data.", fr: "Le domaine Cloud infrastructure contient les données de Defender for Cloud." }
    exposure: { en: "The Exposure management domain contains the Microsoft Security Exposure Management data.", fr: "Le domaine Exposure management contient les données de Microsoft Security Exposure Management." }
references:
  - title: Build hunting queries using guided mode in Microsoft Defender XDR
    url: https://learn.microsoft.com/en-us/defender-xdr/advanced-hunting-query-builder
