id: sc200-3c-summary-cost
objective: "3.2.3"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Adatum has a Microsoft Sentinel workspace that contains the following tables.

    | Table | Plan |
    | --- | --- |
    | SecurityEvent | Analytics |
    | ProxyLogs_CL | Basic |

    You plan to create two summary rules: **SR1**, which aggregates SecurityEvent, and **SR2**, which aggregates ProxyLogs_CL. Both rules run every hour.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum dispose d'un espace de travail Microsoft Sentinel qui contient les tables suivantes.

    | Table | Plan |
    | --- | --- |
    | SecurityEvent | Analytics |
    | ProxyLogs_CL | Basic |

    Vous prévoyez de créer deux règles de synthèse : **SR1**, qui agrège SecurityEvent, et **SR2**, qui agrège ProxyLogs_CL. Les deux règles s'exécutent toutes les heures.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          For SR1, the query isn't charged, and you pay for ingesting the results into the destination table.
        fr: |
          Pour SR1, la requête n'est pas facturée, et vous payez l'ingestion des résultats dans la table de destination.
    - id: s2
      text:
        en: |
          For SR2, each run is charged for the data that the query scans in ProxyLogs_CL.
        fr: |
          Pour SR2, chaque exécution est facturée pour les données que la requête analyse dans ProxyLogs_CL.
    - id: s3
      text:
        en: |
          You can reduce the cost of SR2 by creating its destination table with the Basic plan.
        fr: |
          Vous pouvez réduire le coût de SR2 en créant sa table de destination avec le plan Basic.
answer:
  values: { s1: true, s2: true, s3: false }
explanation:
  correct:
    en: |
      Summary rules have no charge of their own. With an Analytics source table, the query is free and you pay Analytics ingestion for the results. With a Basic or Auxiliary source table, you also pay for the data scanned, and a rule that runs continuously scans all incoming data. The destination of a summary rule is always a custom _CL table with the Analytics plan, so you can't choose the Basic plan for it.
    fr: |
      Les règles de synthèse n'ont pas de frais propres. Avec une table source Analytics, la requête est gratuite et vous payez l'ingestion Analytics des résultats. Avec une table source Basic ou Auxiliary, vous payez aussi les données analysées, et une règle exécutée en continu analyse toutes les données entrantes. La destination d'une règle de synthèse est toujours une table personnalisée _CL du plan Analytics : vous ne pouvez pas choisir le plan Basic pour elle.
references:
  - title: Aggregate data in a Log Analytics workspace by using summary rules
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/logs/summary-rules
