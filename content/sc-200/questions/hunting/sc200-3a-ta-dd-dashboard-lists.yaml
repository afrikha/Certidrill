id: sc200-3a-ta-dd-dashboard-lists
objective: "3.1.4"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Northwind Traders uses Microsoft Defender XDR with Microsoft Defender for Endpoint and Microsoft Defender Vulnerability Management. A new analyst asks you how to read the threat analytics dashboard.

    How should you complete the explanation? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind Traders utilise Microsoft Defender XDR avec Microsoft Defender for Endpoint et Microsoft Defender Vulnerability Management. Un nouvel analyste vous demande comment lire le tableau de bord de l'analytique des menaces.

    Comment devez-vous compléter l'explication ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      The threats with the most active and resolved alerts in our tenant are listed in [[list]]. For each threat, the number of our devices running software affected by its linked vulnerabilities is shown in the [[col]] column.
    fr: |
      Les menaces qui ont le plus d'alertes actives et résolues dans notre locataire sont listées dans [[list]]. Pour chaque menace, le nombre de nos appareils qui exécutent des logiciels touchés par ses vulnérabilités liées figure dans la colonne [[col]].
  slots:
    - id: list
      options:
        - { id: latest, text: "**Latest threats**" }
        - { id: impact, text: "**High-impact threats**" }
        - { id: exposure, text: "**Highest exposure threats**" }
    - id: col
      options:
        - { id: misconf, text: "**Misconfigured devices**" }
        - { id: vuln, text: "**Vulnerable devices**" }
        - { id: assets, text: "**Impacted assets**" }
answer:
  values: { list: impact, col: vuln }
explanation:
  correct:
    en: High-impact threats lists the threats with the most alerts, with the highest active and resolved counts first. The Vulnerable devices column counts the devices running software vulnerable to any vulnerability linked to the threat.
    fr: High-impact threats liste les menaces qui ont le plus d'alertes, avec en premier les plus grands nombres d'alertes actives et résolues. La colonne Vulnerable devices compte les appareils qui exécutent un logiciel vulnérable à l'une des vulnérabilités liées à la menace.
  options:
    latest: { en: "Latest threats lists the recently published or updated reports.", fr: "Latest threats liste les rapports publiés ou mis à jour récemment." }
    exposure: { en: "Highest exposure threats ranks threats by vulnerability severity and the number of exploitable devices, not by alerts.", fr: "Highest exposure threats classe les menaces selon la gravité des vulnérabilités et le nombre d'appareils exploitables, pas selon les alertes." }
    misconf: { en: "Misconfigured devices counts the devices on which the linked recommended actions aren't turned on.", fr: "Misconfigured devices compte les appareils sur lesquels les actions recommandées liées ne sont pas activées." }
    assets: { en: "Impacted assets counts the distinct assets with at least one active alert, not vulnerable devices.", fr: "Impacted assets compte les ressources distinctes avec au moins une alerte active, pas les appareils vulnérables." }
references:
  - title: Threat analytics in Microsoft Defender
    url: https://learn.microsoft.com/en-us/defender-xdr/threat-analytics
