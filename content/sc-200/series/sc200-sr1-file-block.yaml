id: sc200-sr1-file-block
status: draft
stem:
  en: |
    **Note:** This question is part of a series of questions that present the same scenario. Each question in the series contains a unique solution that might meet the stated goals. Some question sets might have more than one correct solution, while others might not have a correct solution.

    Woodgrove Bank has 3,000 Windows 11 devices onboarded to Microsoft Defender for Endpoint Plan 2. Microsoft Defender Antivirus runs in active mode with cloud-delivered protection turned on, and the **Allow or block file** advanced feature is turned on.

    An incident shows that an unsigned executable named **PayView.exe** was run on 14 devices during the last two days. Your investigation confirms that the file is malicious.

    From the file page of PayView.exe, you need to meet the following requirements:

    - Stop the running PayView.exe processes and remove the file from the 14 devices.
    - Prevent PayView.exe from running on any device in the future, including the devices on which it has not been observed yet.
    - Do not affect the other applications of the devices.
  fr: |
    **Remarque :** cette question fait partie d'une série de questions présentant le même scénario. Chaque question de la série propose une solution unique susceptible d'atteindre les objectifs fixés. Certaines séries peuvent avoir plusieurs solutions correctes, d'autres aucune.

    Woodgrove Bank dispose de 3 000 appareils Windows 11 intégrés à Microsoft Defender for Endpoint Plan 2. L'Antivirus Microsoft Defender s'exécute en mode actif avec la protection cloud activée, et la fonctionnalité avancée **Allow or block file** est activée.

    Un incident montre qu'un exécutable non signé nommé **PayView.exe** a été exécuté sur 14 appareils au cours des deux derniers jours. Votre enquête confirme que le fichier est malveillant.

    Depuis la page de fichier de PayView.exe, vous devez répondre aux exigences suivantes :

    - Arrêter les processus PayView.exe en cours d'exécution et supprimer le fichier des 14 appareils.
    - Empêcher PayView.exe de s'exécuter sur tout appareil à l'avenir, y compris sur les appareils où il n'a pas encore été observé.
    - Ne pas affecter les autres applications des appareils.
