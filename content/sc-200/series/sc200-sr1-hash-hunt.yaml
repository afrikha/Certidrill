id: sc200-sr1-hash-hunt
status: draft
stem:
  en: |
    **Note:** This question is part of a series of questions that present the same scenario. Each question in the series contains a unique solution that might meet the stated goals. Some question sets might have more than one correct solution, while others might not have a correct solution.

    Litware, Inc. uses Microsoft Defender for Endpoint and Microsoft Defender for Office 365 Plan 2. A threat intelligence report lists a malicious file whose SHA-256 hash is known.

    You need to create an advanced hunting query in the Microsoft Defender portal that returns every record of the last 30 days that contains this hash in any of the following tables:

    - **DeviceFileEvents**
    - **DeviceProcessEvents**
    - **EmailAttachmentInfo**

    A record that matches in one table must be returned even if the hash does not appear in the other tables.
  fr: |
    **Remarque :** cette question fait partie d'une série de questions présentant le même scénario. Chaque question de la série propose une solution unique susceptible d'atteindre les objectifs fixés. Certaines séries peuvent avoir plusieurs solutions correctes, d'autres aucune.

    Litware, Inc. utilise Microsoft Defender for Endpoint et Microsoft Defender for Office 365 Plan 2. Un rapport de renseignement sur les menaces cite un fichier malveillant dont le hachage SHA-256 est connu.

    Vous devez créer une requête de repérage avancé dans le portail Microsoft Defender qui renvoie chaque enregistrement des 30 derniers jours qui contient ce hachage dans l'une des tables suivantes :

    - **DeviceFileEvents**
    - **DeviceProcessEvents**
    - **EmailAttachmentInfo**

    Un enregistrement correspondant dans une table doit être renvoyé même si le hachage n'apparaît pas dans les autres tables.
