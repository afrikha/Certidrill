id: sc200-sr2-scanner-tuning
status: draft
stem:
  en: |
    **Note:** This question is part of a series of questions that present the same scenario. Each question in the series contains a unique solution that might meet the stated goals. Some question sets might have more than one correct solution, while others might not have a correct solution.

    Fabrikam has a Microsoft 365 E5 subscription. All Windows devices are onboarded to Microsoft Defender for Endpoint.

    Every Monday night, the security team runs an authorized vulnerability scan from the file **C:\Tools\NetScan\netscan.exe** on two devices. The scan triggers Defender for Endpoint alerts, and each week the alerts create incidents in the Microsoft Defender portal.

    You need to configure Microsoft Defender XDR to meet the following requirements:

    - The alerts triggered by netscan.exe must not create incidents.
    - The alerts must remain available in the **AlertInfo** and **AlertEvidence** tables for advanced hunting.
    - Alerts triggered by any other file must not be affected.
  fr: |
    **Remarque :** cette question fait partie d'une série de questions présentant le même scénario. Chaque question de la série propose une solution unique susceptible d'atteindre les objectifs fixés. Certaines séries peuvent avoir plusieurs solutions correctes, d'autres aucune.

    Fabrikam dispose d'un abonnement Microsoft 365 E5. Tous les appareils Windows sont intégrés à Microsoft Defender for Endpoint.

    Chaque lundi soir, l'équipe de sécurité exécute une analyse des vulnérabilités autorisée depuis le fichier **C:\Tools\NetScan\netscan.exe** sur deux appareils. L'analyse déclenche des alertes Defender for Endpoint et, chaque semaine, ces alertes créent des incidents dans le portail Microsoft Defender.

    Vous devez configurer Microsoft Defender XDR pour répondre aux exigences suivantes :

    - Les alertes déclenchées par netscan.exe ne doivent pas créer d'incidents.
    - Les alertes doivent rester disponibles dans les tables **AlertInfo** et **AlertEvidence** pour le repérage avancé.
    - Les alertes déclenchées par tout autre fichier ne doivent pas être affectées.
