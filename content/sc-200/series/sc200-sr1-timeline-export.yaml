id: sc200-sr1-timeline-export
status: draft
stem:
  en: |
    **Note:** This question is part of a series of questions that present the same scenario. Each question in the series contains a unique solution that might meet the stated goals. Some question sets might have more than one correct solution, while others might not have a correct solution.

    Northwind Traders uses Microsoft Defender for Endpoint. An incident shows that a Windows 11 device named **DEV-FIN-07** was compromised between November 9 at 08:00 and November 12 at 18:00. Today is November 17.

    You are investigating DEV-FIN-07 from its device page in the Microsoft Defender portal. You need to meet the following requirements:

    - The forensics team must receive a file that contains the timeline events of DEV-FIN-07 for the compromise period.
    - You must mark the key events of the attack so that any analyst who opens the timeline of DEV-FIN-07 can display only those events.
  fr: |
    **Remarque :** cette question fait partie d'une série de questions présentant le même scénario. Chaque question de la série propose une solution unique susceptible d'atteindre les objectifs fixés. Certaines séries peuvent avoir plusieurs solutions correctes, d'autres aucune.

    Northwind Traders utilise Microsoft Defender for Endpoint. Un incident montre qu'un appareil Windows 11 nommé **DEV-FIN-07** a été compromis entre le 9 novembre à 8 h 00 et le 12 novembre à 18 h 00. Nous sommes le 17 novembre.

    Vous examinez DEV-FIN-07 depuis sa page d'appareil dans le portail Microsoft Defender. Vous devez répondre aux exigences suivantes :

    - L'équipe d'investigation numérique doit recevoir un fichier qui contient les événements de la chronologie de DEV-FIN-07 pour la période de compromission.
    - Vous devez marquer les événements clés de l'attaque afin que tout analyste qui ouvre la chronologie de DEV-FIN-07 puisse n'afficher que ces événements.
