id: sc200-sr2-proxy-summary
status: draft
stem:
  en: |
    **Note:** This question is part of a series of questions that present the same scenario. Each question in the series contains a unique solution that might meet the stated goals. Some question sets might have more than one correct solution, while others might not have a correct solution.

    Woodgrove Bank has a Microsoft Sentinel workspace named **SOC-WS** that is onboarded to the Microsoft Defender portal. SOC-WS contains the tables shown in the following table.

    | Table | Plan | Content |
    | --- | --- | --- |
    | ProxyLogs_CL | Basic | About 900 GB of web proxy logs per day, with the columns TimeGenerated, UserName, DestinationDomain and BytesSent |
    | HighRiskDomains_CL | Analytics | About 2,000 rows, with the columns Domain and RiskCategory |

    SOC-WS also contains a saved workspace function named **ProxyEnrich** that joins ProxyLogs_CL with HighRiskDomains_CL.

    A detection engineer who has the Microsoft Sentinel Contributor and Log Analytics Contributor roles on SOC-WS must create a table for a scheduled analytics rule. The solution must meet the following requirements:

    - The table must be updated at least once every hour.
    - Each row must contain a user, a destination domain, the number of requests, the total bytes sent and, when the domain is listed in HighRiskDomains_CL, its risk category.
    - The analytics rule must not query ProxyLogs_CL directly.
  fr: |
    **Remarque :** cette question fait partie d'une série de questions présentant le même scénario. Chaque question de la série propose une solution unique susceptible d'atteindre les objectifs fixés. Certaines séries peuvent avoir plusieurs solutions correctes, d'autres aucune.

    Woodgrove Bank dispose d'un espace de travail Microsoft Sentinel nommé **SOC-WS** intégré au portail Microsoft Defender. SOC-WS contient les tables présentées dans le tableau suivant.

    | Table | Plan | Contenu |
    | --- | --- | --- |
    | ProxyLogs_CL | Basic | Environ 900 Go de journaux du proxy web par jour, avec les colonnes TimeGenerated, UserName, DestinationDomain et BytesSent |
    | HighRiskDomains_CL | Analytics | Environ 2 000 lignes, avec les colonnes Domain et RiskCategory |

    SOC-WS contient également une fonction d'espace de travail enregistrée nommée **ProxyEnrich** qui joint ProxyLogs_CL à HighRiskDomains_CL.

    Un ingénieur de détection qui dispose des rôles Microsoft Sentinel Contributor et Log Analytics Contributor sur SOC-WS doit créer une table pour une règle d'analytique planifiée. La solution doit répondre aux exigences suivantes :

    - La table doit être mise à jour au moins une fois par heure.
    - Chaque ligne doit contenir un utilisateur, un domaine de destination, le nombre de requêtes, le total des octets envoyés et, lorsque le domaine figure dans HighRiskDomains_CL, sa catégorie de risque.
    - La règle d'analytique ne doit pas interroger directement ProxyLogs_CL.
