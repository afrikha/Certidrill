id: sc200-sr2-mdi-disable
status: draft
stem:
  en: |
    **Note:** This question is part of a series of questions that present the same scenario. Each question in the series contains a unique solution that might meet the stated goals. Some question sets might have more than one correct solution, while others might not have a correct solution.

    Litware has an on-premises Active Directory Domain Services (AD DS) domain synchronized to a Microsoft Entra tenant by using Microsoft Entra Connect. Microsoft Defender for Identity sensors are installed on all the domain controllers. In the Defender for Identity action account settings, **Automatically use the sensor's local system account** is selected.

    Defender for Identity raises a high-severity alert. Your investigation confirms that an attacker controls the synchronized account of a user named **Ben**. A Conditional Access user risk policy blocks the sign-in of high-risk users to Microsoft Entra ID.

    You have a Microsoft Defender XDR unified RBAC custom role that includes the **Response (manage)** permission.

    You need to prevent the account from authenticating to AD DS as quickly as possible. The solution must be performed from the Microsoft Defender portal.
  fr: |
    **Remarque :** cette question fait partie d'une série de questions présentant le même scénario. Chaque question de la série propose une solution unique susceptible d'atteindre les objectifs fixés. Certaines séries peuvent avoir plusieurs solutions correctes, d'autres aucune.

    Litware dispose d'un domaine Active Directory Domain Services (AD DS) local synchronisé avec un locataire Microsoft Entra à l'aide de Microsoft Entra Connect. Des capteurs Microsoft Defender pour Identity sont installés sur tous les contrôleurs de domaine. Dans les paramètres des comptes d'action de Defender pour Identity, **Automatically use the sensor's local system account** est sélectionné.

    Defender pour Identity génère une alerte de gravité élevée. Votre enquête confirme qu'un attaquant contrôle le compte synchronisé d'un utilisateur nommé **Ben**. Une stratégie d'accès conditionnel basée sur le risque utilisateur bloque la connexion des utilisateurs à risque élevé à Microsoft Entra ID.

    Vous disposez d'un rôle personnalisé du RBAC unifié de Microsoft Defender XDR qui inclut l'autorisation **Response (manage)**.

    Vous devez empêcher le compte de s'authentifier auprès d'AD DS le plus rapidement possible. La solution doit être exécutée depuis le portail Microsoft Defender.
