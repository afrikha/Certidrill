id: sc200-sr2-app-ingestion
status: draft
stem:
  en: |
    **Note:** This question is part of a series of questions that present the same scenario. Each question in the series contains a unique solution that might meet the stated goals. Some question sets might have more than one correct solution, while others might not have a correct solution.

    Tailspin Toys has a Microsoft Sentinel workspace named **SentinelWS**. An internal application named **TollGate** runs on an on-premises server and can send its audit records as JSON over HTTPS. Each record contains the fields **EventTime**, **UserName**, **SourceIP** and **Action**. No Microsoft Sentinel data connector exists for TollGate.

    You need to ingest the TollGate records into SentinelWS. The solution must meet the following requirements:

    - The records must be stored in a dedicated table.
    - The **TimeGenerated** column of each record must contain the value of EventTime.
    - TollGate must authenticate by using Microsoft Entra ID, not a workspace shared key.
    - The identity used by TollGate must be granted the least privileges required.
  fr: |
    **Remarque :** cette question fait partie d'une série de questions présentant le même scénario. Chaque question de la série propose une solution unique susceptible d'atteindre les objectifs fixés. Certaines séries peuvent avoir plusieurs solutions correctes, d'autres aucune.

    Tailspin Toys dispose d'un espace de travail Microsoft Sentinel nommé **SentinelWS**. Une application interne nommée **TollGate** s'exécute sur un serveur local et peut envoyer ses enregistrements d'audit au format JSON via HTTPS. Chaque enregistrement contient les champs **EventTime**, **UserName**, **SourceIP** et **Action**. Aucun connecteur de données Microsoft Sentinel n'existe pour TollGate.

    Vous devez ingérer les enregistrements de TollGate dans SentinelWS. La solution doit répondre aux exigences suivantes :

    - Les enregistrements doivent être stockés dans une table dédiée.
    - La colonne **TimeGenerated** de chaque enregistrement doit contenir la valeur de EventTime.
    - TollGate doit s'authentifier à l'aide de Microsoft Entra ID, et non d'une clé partagée de l'espace de travail.
    - L'identité utilisée par TollGate doit recevoir les privilèges minimaux nécessaires.
