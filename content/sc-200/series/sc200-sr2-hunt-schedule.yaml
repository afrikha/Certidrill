id: sc200-sr2-hunt-schedule
status: draft
stem:
  en: |
    **Note:** This question is part of a series of questions that present the same scenario. Each question in the series contains a unique solution that might meet the stated goals. Some question sets might have more than one correct solution, while others might not have a correct solution.

    Northwind Traders has a Microsoft Sentinel workspace that is onboarded to the Microsoft Defender portal. The **SecurityEvent** table is in the Analytics tier.

    On the **Hunting** page of Microsoft Sentinel, an analyst created a custom hunting query named **ShadowCopyDeletion** that returns process creation events in which `vssadmin delete shadows` is run.

    You need to ensure that the ShadowCopyDeletion logic runs every hour. Each time it returns results, an incident must be created without any action from an analyst.
  fr: |
    **Remarque :** cette question fait partie d'une série de questions présentant le même scénario. Chaque question de la série propose une solution unique susceptible d'atteindre les objectifs fixés. Certaines séries peuvent avoir plusieurs solutions correctes, d'autres aucune.

    Northwind Traders dispose d'un espace de travail Microsoft Sentinel intégré au portail Microsoft Defender. La table **SecurityEvent** se trouve dans le niveau Analytics.

    Dans la page **Hunting** de Microsoft Sentinel, un analyste a créé une requête de chasse personnalisée nommée **ShadowCopyDeletion** qui renvoie les événements de création de processus dans lesquels `vssadmin delete shadows` est exécuté.

    Vous devez vous assurer que la logique de ShadowCopyDeletion s'exécute toutes les heures. Chaque fois qu'elle renvoie des résultats, un incident doit être créé sans aucune action d'un analyste.
