id: sc200-sr1-ta-exposure
status: draft
stem:
  en: |
    **Note:** This question is part of a series of questions that present the same scenario. Each question in the series contains a unique solution that might meet the stated goals. Some question sets might have more than one correct solution, while others might not have a correct solution.

    Tailspin Toys has a Microsoft 365 E5 subscription. All its Windows devices are onboarded to Microsoft Defender for Endpoint Plan 2, and Microsoft Defender Vulnerability Management is in use. Microsoft Defender XDR unified role-based access control (RBAC) is active.

    You are a SOC analyst. Your unified RBAC role includes only the **Security data basics (read)** permission. Microsoft publishes a threat analytics report about a ransomware activity group that exploits two vulnerabilities in Windows. No alert related to this threat has been raised in the tenant.

    You need to use the threat analytics report to determine the following:

    - The exposure level of the onboarded devices to the vulnerabilities and misconfigurations that the threat exploits, including the deployment status of the security updates.
    - The status of the mitigations that Microsoft recommends against the threat, such as cloud-delivered protection.
  fr: |
    **Remarque :** cette question fait partie d'une série de questions présentant le même scénario. Chaque question de la série propose une solution unique susceptible d'atteindre les objectifs fixés. Certaines séries peuvent avoir plusieurs solutions correctes, d'autres aucune.

    Tailspin Toys dispose d'un abonnement Microsoft 365 E5. Tous ses appareils Windows sont intégrés à Microsoft Defender for Endpoint Plan 2, et Microsoft Defender Vulnerability Management est utilisé. Le contrôle d'accès en fonction du rôle (RBAC) unifié de Microsoft Defender XDR est actif.

    Vous êtes analyste SOC. Votre rôle RBAC unifié inclut uniquement l'autorisation **Security data basics (read)**. Microsoft publie un rapport d'analytique des menaces sur un groupe d'activités de rançongiciel qui exploite deux vulnérabilités de Windows. Aucune alerte liée à cette menace n'a été déclenchée dans le locataire.

    Vous devez utiliser le rapport d'analytique des menaces pour déterminer les éléments suivants :

    - Le niveau d'exposition des appareils intégrés aux vulnérabilités et aux erreurs de configuration exploitées par la menace, y compris l'état de déploiement des mises à jour de sécurité.
    - L'état des atténuations recommandées par Microsoft contre la menace, comme la protection cloud.
