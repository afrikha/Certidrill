id: sc200-sr1-anomaly-threshold
status: draft
stem:
  en: |
    **Note:** This question is part of a series of questions that present the same scenario. Each question in the series contains a unique solution that might meet the stated goals. Some question sets might have more than one correct solution, while others might not have a correct solution.

    Fabrikam, Inc. has a Microsoft Sentinel workspace named **SOC-WS** that is onboarded to the Microsoft Defender portal. A built-in anomaly rule that detects unusual volumes of failed sign-ins, named **Anomaly1** in this scenario, is enabled in **Production** mode. The SOC reports that Anomaly1 records too many anomalies in the **Anomalies** table.

    You plan to evaluate a higher threshold for Anomaly1. You need to meet the following requirements during the evaluation:

    - The anomalies used by the SOC must continue to come from the current configuration of Anomaly1.
    - The results of the current configuration and of the higher threshold must be comparable in the Anomalies table.
  fr: |
    **Remarque :** cette question fait partie d'une série de questions présentant le même scénario. Chaque question de la série propose une solution unique susceptible d'atteindre les objectifs fixés. Certaines séries peuvent avoir plusieurs solutions correctes, d'autres aucune.

    Fabrikam, Inc. dispose d'un espace de travail Microsoft Sentinel nommé **SOC-WS** qui est intégré au portail Microsoft Defender. Une règle d'anomalie intégrée qui détecte des volumes inhabituels de connexions en échec, nommée **Anomaly1** dans ce scénario, est activée en mode **Production**. Le SOC signale qu'Anomaly1 enregistre trop d'anomalies dans la table **Anomalies**.

    Vous prévoyez d'évaluer un seuil plus élevé pour Anomaly1. Vous devez répondre aux exigences suivantes pendant l'évaluation :

    - Les anomalies utilisées par le SOC doivent continuer à provenir de la configuration actuelle d'Anomaly1.
    - Les résultats de la configuration actuelle et du seuil plus élevé doivent pouvoir être comparés dans la table Anomalies.
