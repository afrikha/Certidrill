chapter: 12-automation
questions:
  # ------------------------------------------------------------------ 1
  - id: sc200-qz-12-01
    objective: "1.1.10"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Fabrikam, Inc. uses Microsoft Sentinel. Every new incident that involves the account of the CEO, **ceo@fabrikam.com**, must get the High severity. The solution must not require code and must minimize administrative effort.

        What should you create?
      fr: |
        Fabrikam, Inc. utilise Microsoft Sentinel. Chaque nouvel incident qui implique le compte du PDG, **ceo@fabrikam.com**, doit recevoir la gravité High (élevée). La solution ne doit pas exiger de code et doit réduire au minimum l'effort d'administration.

        Que devez-vous créer ?
    body:
      options:
        - { id: a, text: { en: "An automation rule with the When alert is created trigger, a condition on the account entity and the Change severity action", fr: "Une règle d'automatisation avec le déclencheur When alert is created, une condition sur l'entité de compte et l'action Change severity" } }
        - { id: b, text: { en: "A playbook with the entity trigger, which analysts run on the account of the CEO when they see it in an incident", fr: "Un playbook avec le déclencheur d'entité, que les analystes exécutent sur le compte du PDG quand ils le voient dans un incident" } }
        - { id: c, text: { en: "An automation rule with the When incident is created trigger, a condition on the account entity and the Change severity action", fr: "Une règle d'automatisation avec le déclencheur When incident is created, une condition sur l'entité de compte et l'action Change severity" } }
        - { id: d, text: { en: "A change of the severity of every scheduled analytics rule to High, so that all their incidents start as High", fr: "Un passage de la gravité de chaque règle d'analyse planifiée à High, pour que tous leurs incidents démarrent en High" } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          An automation rule needs no code. With the When incident is created trigger, its conditions can use the entity properties of the incident, such as the account, and **Change severity** is one of its built-in actions.
        fr: |
          Une règle d'automatisation ne demande aucun code. Avec le déclencheur When incident is created, ses conditions peuvent utiliser les propriétés des entités de l'incident, comme le compte, et **Change severity** fait partie de ses actions intégrées.
      options:
        a: { en: "Rules that use the When alert is created trigger support only the Analytic rule name condition, so no entity condition is possible.", fr: "Les règles qui utilisent le déclencheur When alert is created ne prennent en charge que la condition Analytic rule name : aucune condition d'entité n'est possible." }
        b: { en: "A manually run playbook is neither automatic nor code-free, and it adds effort for every incident.", fr: "Un playbook exécuté manuellement n'est ni automatique ni sans code, et il ajoute un effort pour chaque incident." }
        d: { en: "Raising the severity of the analytics rules affects every incident, not only those that involve the CEO.", fr: "Relever la gravité des règles d'analyse affecte tous les incidents, pas seulement ceux qui impliquent le PDG." }
    references:
      - title: Create and use Microsoft Sentinel automation rules to manage response
        url: https://learn.microsoft.com/en-us/azure/sentinel/create-manage-use-automation-rules

  # ------------------------------------------------------------------ 2
  - id: sc200-qz-12-02
    objective: "1.1.8"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Contoso, Ltd. uses Microsoft Defender XDR. During a human-operated ransomware attack, automatic attack disruption disables a compromised account in the on-premises Active Directory domain.

        Which product performs this action?
      fr: |
        Contoso, Ltd. utilise Microsoft Defender XDR. Pendant une attaque par rançongiciel opérée par des humains, l'interruption automatique des attaques désactive un compte compromis dans le domaine Active Directory local.

        Quel produit exécute cette action ?
    body:
      options:
        - { id: a, text: Microsoft Defender for Endpoint }
        - { id: b, text: Microsoft Defender for Identity }
        - { id: c, text: Microsoft Entra ID }
        - { id: d, text: Microsoft Defender for Cloud Apps }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          The Disable user action is performed by Defender for Identity, which disables the Active Directory account through its sensor on the domain controllers. The sensor must run on the domain controller where the account is disabled.
        fr: |
          L'action Disable user est exécutée par Defender for Identity, qui désactive le compte Active Directory par son capteur sur les contrôleurs de domaine. Le capteur doit s'exécuter sur le contrôleur de domaine où le compte est désactivé.
      options:
        a: { en: "Defender for Endpoint performs the device actions and Contain user, which blocks the user's communication from onboarded devices without disabling the account.", fr: "Defender for Endpoint exécute les actions sur les appareils et Contain user, qui bloque les communications de l'utilisateur depuis les appareils intégrés sans désactiver le compte." }
        c: { en: "Microsoft Entra ID revokes sessions and suspends cloud accounts; it doesn't disable an account in the on-premises domain.", fr: "Microsoft Entra ID révoque des sessions et suspend des comptes cloud ; il ne désactive pas de compte dans le domaine local." }
        d: { en: "Defender for Cloud Apps acts on compromised OAuth apps, not on Active Directory accounts.", fr: "Defender for Cloud Apps agit sur les applications OAuth compromises, pas sur les comptes Active Directory." }
    references:
      - title: Automatic attack disruption in Microsoft Defender
        url: https://learn.microsoft.com/en-us/defender-xdr/automatic-attack-disruption

  # ------------------------------------------------------------------ 3
  - id: sc200-qz-12-03
    objective: "1.1.9"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Adatum Corporation started using Microsoft Defender for Endpoint in March 2026. The tier-1 analysts, members of the Microsoft Entra group **SG-Tier1**, must view endpoint alerts and take response actions on devices. They must not access the data of Microsoft Defender for Office 365 or Microsoft Defender for Identity.

        What should you create?
      fr: |
        Adatum Corporation a commencé à utiliser Microsoft Defender for Endpoint en mars 2026. Les analystes de niveau 1, membres du groupe Microsoft Entra **SG-Tier1**, doivent consulter les alertes des points de terminaison et effectuer des actions de réponse sur les appareils. Ils ne doivent pas accéder aux données de Microsoft Defender for Office 365 ni de Microsoft Defender for Identity.

        Que devez-vous créer ?
    body:
      options:
        - { id: a, text: { en: "A Defender for Endpoint role in Settings > Endpoints > Roles with View data and Active remediation actions, for SG-Tier1", fr: "Un rôle Defender for Endpoint dans Paramètres > Points de terminaison > Rôles avec View data et Active remediation actions, pour SG-Tier1" } }
        - { id: b, text: { en: "A custom role in Permissions > Microsoft Defender XDR > Roles with Security operations permissions, for SG-Tier1 on the Defender for Endpoint data source", fr: "Un rôle personnalisé dans Autorisations > Microsoft Defender XDR > Rôles avec des autorisations Security operations, pour SG-Tier1 sur la source de données Defender for Endpoint" } }
        - { id: c, text: { en: "An assignment of the Security Operator role in Microsoft Entra ID to SG-Tier1, with SG-Tier1 created as a role-assignable group", fr: "Une attribution du rôle Security Operator de Microsoft Entra ID à SG-Tier1, créé comme groupe assignable à des rôles" } }
        - { id: d, text: { en: "A device group that contains all the endpoint devices and whose User access page lists SG-Tier1, without any role for SG-Tier1", fr: "Un groupe d'appareils qui contient tous les appareils et dont la page User access liste SG-Tier1, sans aucun rôle pour SG-Tier1" } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          Since February 16, 2025, new Defender for Endpoint customers have only Microsoft Defender XDR unified RBAC. A custom unified RBAC role combines the needed permissions, and its assignment selects the data sources, here Defender for Endpoint only, so the analysts can't read the alerts of the other services.
        fr: |
          Depuis le 16 février 2025, les nouveaux clients Defender for Endpoint n'ont que le RBAC unifié de Microsoft Defender XDR. Un rôle personnalisé du RBAC unifié combine les autorisations nécessaires, et son attribution sélectionne les sources de données, ici Defender for Endpoint uniquement : les analystes ne peuvent pas lire les alertes des autres services.
      options:
        a: { en: "Defender for Endpoint roles remain only for existing customers; a tenant that started in 2026 uses unified RBAC.", fr: "Les rôles Defender for Endpoint ne restent disponibles que pour les clients existants ; un locataire démarré en 2026 utilise le RBAC unifié." }
        c: { en: "A Microsoft Entra role applies to every Defender workload, including Defender for Office 365 and Defender for Identity data.", fr: "Un rôle Microsoft Entra s'applique à toutes les charges de travail Defender, y compris aux données de Defender for Office 365 et de Defender for Identity." }
        d: { en: "Device group access can be granted only to groups that already have a role, and it grants no permission by itself.", fr: "L'accès à un groupe d'appareils ne peut être accordé qu'à des groupes qui ont déjà un rôle, et il n'accorde aucune autorisation par lui-même." }
    references:
      - title: Create custom roles with Microsoft Defender unified role-based access control (RBAC)
        url: https://learn.microsoft.com/en-us/defender-xdr/create-custom-rbac-roles
      - title: Create and manage roles for role-based access control
        url: https://learn.microsoft.com/en-us/defender-endpoint/user-roles

  # ------------------------------------------------------------------ 4
  - id: sc200-qz-12-04
    objective: "1.1.7"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Northwind Traders uses Microsoft Defender for Endpoint Plan 2, and all its device groups use the **Full - remediate threats automatically** automation level. An in-house tool named **nwsync.exe** is installed in different folders on many devices. Automated investigations keep quarantining the same version of nwsync.exe, which the security team has confirmed as safe.

        You need automated investigation and response to stop remediating nwsync.exe. Remediation must stay automatic for all other files, and Microsoft Defender Antivirus must keep scanning the devices.

        What should you do?
      fr: |
        Northwind Traders utilise Microsoft Defender for Endpoint Plan 2, et tous ses groupes d'appareils utilisent le niveau d'automatisation **Full - remediate threats automatically**. Un outil interne nommé **nwsync.exe** est installé dans des dossiers différents sur de nombreux appareils. Les enquêtes automatisées mettent sans cesse en quarantaine la même version de nwsync.exe, que l'équipe de sécurité a confirmée comme sûre.

        Vous devez faire en sorte que l'enquête et la réponse automatisées cessent de corriger nwsync.exe. La correction doit rester automatique pour tous les autres fichiers, et l'Antivirus Microsoft Defender doit continuer à analyser les appareils.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Add the folders that contain nwsync.exe to the automation folder exclusions.", fr: "Ajouter les dossiers qui contiennent nwsync.exe aux exclusions de dossiers d'automatisation." } }
        - { id: b, text: { en: "Create an alert tuning rule that hides the alerts raised for nwsync.exe.", fr: "Créer une règle de réglage des alertes qui masque les alertes déclenchées pour nwsync.exe." } }
        - { id: c, text: { en: "Set the device groups to Semi - require approval for all folders.", fr: "Passer les groupes d'appareils à Semi - require approval for all folders." } }
        - { id: d, text: { en: "Create a file indicator with the Allow action for the hash of nwsync.exe.", fr: "Créer un indicateur de fichier avec l'action Allow pour le hachage de nwsync.exe." } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          Allow indicators apply to next-generation protection and to automated investigation and remediation: the file can still be detected but isn't quarantined or removed. Microsoft recommends this exception rather than turning off automation because of a false positive, and it targets exactly one file wherever it's stored.
        fr: |
          Les indicateurs Allow s'appliquent à la protection nouvelle génération et à l'enquête et la correction automatisées : le fichier peut toujours être détecté, mais il n'est ni mis en quarantaine ni supprimé. Microsoft recommande cette exception plutôt que de désactiver l'automatisation à cause d'un faux positif, et elle cible exactement un fichier, où qu'il soit stocké.
      options:
        a: { en: "The tool sits in many folders, and a folder exclusion would make investigations skip every other file of those folders.", fr: "L'outil se trouve dans de nombreux dossiers, et une exclusion de dossier ferait ignorer aux enquêtes tous les autres fichiers de ces dossiers." }
        b: { en: "Alert tuning reduces queue noise but doesn't stop remediation actions on the file.", fr: "Le réglage des alertes réduit le bruit dans la file d'alertes mais n'arrête pas les actions de correction sur le fichier." }
        c: { en: "This level makes every remediation wait for approval, which breaks the requirement that other files stay automatic.", fr: "Ce niveau fait attendre une approbation à toutes les corrections, ce qui enfreint l'exigence que les autres fichiers restent en correction automatique." }
    references:
      - title: Address false positives/negatives in Microsoft Defender for Endpoint
        url: https://learn.microsoft.com/en-us/defender-endpoint/defender-endpoint-false-positives-negatives

  # ------------------------------------------------------------------ 5
  - id: sc200-qz-12-05
    objective: "1.1.11"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Tailspin Toys uses Microsoft Sentinel. An automation rule runs a Consumption playbook named **pb-Ticket** for each new incident, and the playbook opens a ticket in the IT service management tool. For some incidents, no ticket is created.

        You need to identify which step of pb-Ticket failed and the error that it returned.

        What should you review?
      fr: |
        Tailspin Toys utilise Microsoft Sentinel. Une règle d'automatisation exécute un playbook Consumption nommé **pb-Ticket** pour chaque nouvel incident, et le playbook ouvre un ticket dans l'outil de gestion des services informatiques. Pour certains incidents, aucun ticket n'est créé.

        Vous devez identifier l'étape de pb-Ticket qui a échoué et l'erreur qu'elle a renvoyée.

        Que devez-vous examiner ?
    body:
      options:
        - { id: a, text: { en: "The History tab of the Action center in the Microsoft Defender portal", fr: "L'onglet History du centre de notifications dans le portail Microsoft Defender" } }
        - { id: b, text: { en: "The SecurityIncident records of the incidents that have no ticket", fr: "Les enregistrements SecurityIncident des incidents qui n'ont pas de ticket" } }
        - { id: c, text: { en: "The run history of the pb-Ticket logic app and the details of a failed run", fr: "L'historique des exécutions de l'application logique pb-Ticket et le détail d'une exécution échouée" } }
        - { id: d, text: { en: "The Azure activity log of the resource group that contains pb-Ticket", fr: "Le journal d'activité Azure du groupe de ressources qui contient pb-Ticket" } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          A playbook is a Logic Apps workflow, and each run is recorded in the logic app's run history. Opening a run shows every action of the workflow with its status, inputs and outputs, so you see which step failed and the error that the service returned.
        fr: |
          Un playbook est un workflow Logic Apps, et chaque exécution est enregistrée dans l'historique des exécutions de l'application logique. Ouvrir une exécution affiche chaque action du workflow avec son statut, ses entrées et ses sorties : vous voyez quelle étape a échoué et l'erreur renvoyée par le service.
      options:
        a: { en: "The Action center tracks Defender response and remediation actions, not the steps of Logic Apps workflows.", fr: "Le centre de notifications suit les actions de réponse et de correction de Defender, pas les étapes des workflows Logic Apps." }
        b: { en: "SecurityIncident records the changes of the incidents themselves, not the result of each action of a playbook.", fr: "SecurityIncident enregistre les modifications des incidents eux-mêmes, pas le résultat de chaque action d'un playbook." }
        d: { en: "The activity log records management operations on resources, not the actions executed inside a workflow run.", fr: "Le journal d'activité enregistre les opérations de gestion sur les ressources, pas les actions exécutées pendant une exécution de workflow." }
    references:
      - title: Automate and run Microsoft Sentinel playbooks
        url: https://learn.microsoft.com/en-us/azure/sentinel/automation/run-playbooks

  # ------------------------------------------------------------------ 6
  - id: sc200-qz-12-06
    objective: "1.1.10"
    difficulty: 3
    status: draft
    type: dropdown
    stem:
      en: |
        Proseware, Inc. has a Microsoft Sentinel workspace onboarded to the Microsoft Defender portal, and incidents are created by Defender XDR correlation. A playbook named **pb-Enrich** looks up every entity of an incident in a threat intelligence service and adds the results to the incident as a comment.

        pb-Enrich must run again each time new alerts are added to an existing incident. It must not run when the only changes are to the owner, the tags or the comments of the incident.

        How should you configure the solution? Select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Proseware, Inc. dispose d'un espace de travail Microsoft Sentinel intégré au portail Microsoft Defender, et les incidents sont créés par la corrélation de Defender XDR. Un playbook nommé **pb-Enrich** recherche chaque entité d'un incident dans un service de renseignement sur les menaces et ajoute les résultats à l'incident sous forme de commentaire.

        pb-Enrich doit s'exécuter à nouveau chaque fois que de nouvelles alertes sont ajoutées à un incident existant. Il ne doit pas s'exécuter quand les seules modifications portent sur le propriétaire, les étiquettes ou les commentaires de l'incident.

        Comment devez-vous configurer la solution ? Sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: text
      template:
        en: |
          Automation rule trigger: [[trg]]

          Automation rule condition: [[prop]] [[op]]

          Trigger of pb-Enrich: [[pbt]]
        fr: |
          Déclencheur de la règle d'automatisation : [[trg]]

          Condition de la règle d'automatisation : [[prop]] [[op]]

          Déclencheur de pb-Enrich : [[pbt]]
      slots:
        - id: trg
          options:
            - { id: created, text: When incident is created }
            - { id: updated, text: When incident is updated }
            - { id: alert, text: When alert is created }
        - id: prop
          options:
            - { id: alerts, text: Alerts }
            - { id: tactics, text: Tactics }
            - { id: severity, text: Severity }
            - { id: status, text: Status }
        - id: op
          options:
            - { id: added, text: Added }
            - { id: changed, text: Changed }
            - { id: contains, text: Contains }
        - id: pbt
          options:
            - { id: incident, text: { en: "Incident trigger", fr: "Déclencheur d'incident" } }
            - { id: alert, text: { en: "Alert trigger", fr: "Déclencheur d'alerte" } }
            - { id: entity, text: { en: "Entity trigger", fr: "Déclencheur d'entité" } }
    answer:
      values: { trg: updated, prop: alerts, op: added, pbt: incident }
    explanation:
      correct:
        en: |
          Adding alerts to an existing incident is an update, and the update trigger offers the **Alerts** property with the **Added** operator, which is true only when alerts are added; owner, tag and comment changes, including the comment written by pb-Enrich itself, don't match it. A playbook run by an incident-trigger automation rule must use the incident trigger, which also gives it the entities of the incident.
        fr: |
          Ajouter des alertes à un incident existant est une mise à jour, et le déclencheur de mise à jour propose la propriété **Alerts** avec l'opérateur **Added**, qui n'est vrai que lorsque des alertes sont ajoutées ; les modifications du propriétaire, des étiquettes et des commentaires, y compris le commentaire écrit par pb-Enrich lui-même, n'y correspondent pas. Un playbook exécuté par une règle d'automatisation à déclencheur d'incident doit utiliser le déclencheur d'incident, qui lui fournit aussi les entités de l'incident.
      options:
        created: { en: "The create trigger runs once, when the incident is created, not when alerts are added later.", fr: "Le déclencheur de création s'exécute une fois, à la création de l'incident, pas quand des alertes sont ajoutées ensuite." }
        alert: { en: "In the Defender portal, alert-trigger automation doesn't cover Defender XDR alerts, and an alert-trigger rule runs alert playbooks.", fr: "Dans le portail Defender, l'automatisation à déclencheur d'alerte ne couvre pas les alertes Defender XDR, et une règle à déclencheur d'alerte exécute des playbooks d'alerte." }
        tactics: { en: "New alerts don't always add a tactic, so a condition on tactics would miss some of them.", fr: "Les nouvelles alertes n'ajoutent pas toujours une tactique : une condition sur les tactiques en manquerait certaines." }
        entity: { en: "An entity playbook is run manually on one entity; automation rules run incident or alert playbooks.", fr: "Un playbook d'entité s'exécute manuellement sur une entité ; les règles d'automatisation exécutent des playbooks d'incident ou d'alerte." }
    references:
      - title: Create and use Microsoft Sentinel automation rules to manage response
        url: https://learn.microsoft.com/en-us/azure/sentinel/create-manage-use-automation-rules
      - title: Automate threat response in Microsoft Sentinel with automation rules
        url: https://learn.microsoft.com/en-us/azure/sentinel/automate-incident-handling-with-automation-rules

  # ------------------------------------------------------------------ 7
  - id: sc200-qz-12-07
    objective: "1.1.9"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Fabrikam, Inc. has used Microsoft Defender for Endpoint since 2022 and manages access with Defender for Endpoint roles; unified RBAC isn't activated. A security engineer named Eng1, a member of the Microsoft Entra group **SG-EndpointEng**, has no Microsoft Entra role.

        Eng1 must create device groups, define their matching rules, and promote, demote and delete them.

        You need to grant Eng1 the required access. The solution must follow the principle of least privilege.

        What should you do?
      fr: |
        Fabrikam, Inc. utilise Microsoft Defender for Endpoint depuis 2022 et gère les accès avec des rôles Defender for Endpoint ; le RBAC unifié n'est pas activé. Un ingénieur sécurité nommé Eng1, membre du groupe Microsoft Entra **SG-EndpointEng**, n'a aucun rôle Microsoft Entra.

        Eng1 doit créer des groupes d'appareils, définir leurs règles de correspondance, et les promouvoir, les rétrograder et les supprimer.

        Vous devez accorder à Eng1 l'accès nécessaire. La solution doit respecter le principe du moindre privilège.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Create a custom Defender for Endpoint role with Manage security settings in Security Center, and assign it to SG-EndpointEng.", fr: "Créer un rôle Defender for Endpoint personnalisé avec Manage security settings in Security Center, et l'attribuer à SG-EndpointEng." } }
        - { id: b, text: { en: "Create a custom Defender for Endpoint role with Alerts investigation and Active remediation actions, linked to all device groups.", fr: "Créer un rôle Defender for Endpoint personnalisé avec Alerts investigation et Active remediation actions, lié à tous les groupes d'appareils." } }
        - { id: c, text: { en: "Assign the Global Administrator role in Microsoft Entra ID to Eng1, and remove it when the device groups are in place.", fr: "Attribuer le rôle Global Administrator de Microsoft Entra ID à Eng1, puis le retirer une fois les groupes d'appareils en place." } }
        - { id: d, text: { en: "Assign SG-EndpointEng to the Microsoft Defender for Endpoint administrator (default) role in the Defender for Endpoint roles.", fr: "Attribuer SG-EndpointEng au rôle Microsoft Defender for Endpoint administrator (default) dans les rôles Defender for Endpoint." } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          Device groups are managed with the **Manage portal system settings** permission, which is available only in the Microsoft Defender for Endpoint administrator (default) role: no custom role can include it. After opting in to RBAC, you can assign users who aren't Global or Security Administrators to this role, which is narrower than a tenant-wide Microsoft Entra role.
        fr: |
          Les groupes d'appareils se gèrent avec l'autorisation **Manage portal system settings**, qui n'existe que dans le rôle Microsoft Defender for Endpoint administrator (default) : aucun rôle personnalisé ne peut l'inclure. Après l'activation du RBAC, vous pouvez attribuer ce rôle à des utilisateurs qui ne sont ni Global Administrators ni Security Administrators, ce qui est plus restreint qu'un rôle Microsoft Entra valable pour tout le locataire.
      options:
        a: { en: "Manage security settings covers alert suppression, folder exclusions, onboarding, email notifications and indicators, not device groups.", fr: "Manage security settings couvre la suppression des alertes, les exclusions de dossiers, l'intégration, les notifications par e-mail et les indicateurs, pas les groupes d'appareils." }
        b: { en: "These permissions cover alert handling and response actions; none of them lets a user manage device groups.", fr: "Ces autorisations couvrent le traitement des alertes et les actions de réponse ; aucune ne permet de gérer les groupes d'appareils." }
        c: { en: "Global Administrator works but grants control over the whole tenant, far beyond device group management.", fr: "Global Administrator fonctionne, mais donne le contrôle de tout le locataire, bien au-delà de la gestion des groupes d'appareils." }
    references:
      - title: Create and manage roles for role-based access control
        url: https://learn.microsoft.com/en-us/defender-endpoint/user-roles
      - title: Use role-based access control to grant fine-grained access to Microsoft Defender portal
        url: https://learn.microsoft.com/en-us/defender-endpoint/rbac

  # ------------------------------------------------------------------ 8
  - id: sc200-qz-12-08
    objective: "1.1.8"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        Woodgrove Bank uses Microsoft Defender XDR, and automatic attack disruption uses its default settings. The environment includes:

        - Two Active Directory domains. The domain controllers of **corp.woodgrovebank.com** run the Microsoft Defender for Identity sensor with the default action account. The domain controllers of **branch.woodgrovebank.com** run no sensor.
        - Microsoft Defender for Cloud Apps, connected to Microsoft 365 through the Microsoft 365 connector. When the connector was configured, the option for Microsoft Entra ID apps wasn't selected.

        You need attack disruption to be able to disable compromised Active Directory accounts in both domains and to act on compromised OAuth apps.

        Which two actions should you perform? Each correct answer presents part of the solution.

        NOTE: Each correct selection is worth one point.
      fr: |
        Woodgrove Bank utilise Microsoft Defender XDR, et l'interruption automatique des attaques utilise ses paramètres par défaut. L'environnement comprend :

        - Deux domaines Active Directory. Les contrôleurs de domaine de **corp.woodgrovebank.com** exécutent le capteur Microsoft Defender for Identity avec le compte d'action par défaut. Les contrôleurs de domaine de **branch.woodgrovebank.com** n'exécutent aucun capteur.
        - Microsoft Defender for Cloud Apps, connecté à Microsoft 365 par le connecteur Microsoft 365. Lors de la configuration du connecteur, l'option des applications Microsoft Entra ID n'a pas été sélectionnée.

        Vous devez faire en sorte que l'interruption des attaques puisse désactiver les comptes Active Directory compromis des deux domaines et agir sur les applications OAuth compromises.

        Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "Replace the default action account of the Defender for Identity sensors with a group Managed Service Account.", fr: "Remplacer le compte d'action par défaut des capteurs Defender for Identity par un compte de service administré de groupe." } }
        - { id: b, text: { en: "Deploy the Defender for Identity sensor on the domain controllers of branch.woodgrovebank.com.", fr: "Déployer le capteur Defender for Identity sur les contrôleurs de domaine de branch.woodgrovebank.com." } }
        - { id: c, text: { en: "Set the device discovery mode of Defender for Endpoint to Standard discovery.", fr: "Définir le mode de découverte d'appareils de Defender for Endpoint sur Standard discovery." } }
        - { id: d, text: { en: "Edit the Microsoft 365 connector in Defender for Cloud Apps and select all its options.", fr: "Modifier le connecteur Microsoft 365 dans Defender for Cloud Apps et sélectionner toutes ses options." } }
        - { id: e, text: { en: "Set the automation level of the domain controllers' device group to Full - remediate threats automatically.", fr: "Définir le niveau d'automatisation du groupe d'appareils des contrôleurs de domaine sur Full - remediate threats automatically." } }
    answer: { optionIds: [b, d] }
    explanation:
      correct:
        en: |
          Defender for Identity disables an Active Directory account through its sensor, which must run on the domain controller where the account is disabled, so the branch domain needs sensors. For OAuth app actions, Defender for Cloud Apps must be connected to Microsoft 365 with every checkbox of the connector selected, including the option for Microsoft Entra ID apps.
        fr: |
          Defender for Identity désactive un compte Active Directory par son capteur, qui doit s'exécuter sur le contrôleur de domaine où le compte est désactivé : le domaine branch a donc besoin de capteurs. Pour agir sur les applications OAuth, Defender for Cloud Apps doit être connecté à Microsoft 365 avec toutes les cases du connecteur cochées, y compris l'option des applications Microsoft Entra ID.
      options:
        a: { en: "The default LocalSystem action account is supported for attack disruption; a gMSA isn't required.", fr: "Le compte d'action LocalSystem par défaut est pris en charge par l'interruption des attaques ; un gMSA n'est pas obligatoire." }
        c: { en: "Standard discovery is the prerequisite of the Contain device action, not of account or OAuth app actions.", fr: "Standard discovery est le prérequis de l'action Contain device, pas des actions sur les comptes ou les applications OAuth." }
        e: { en: "The automation level governs device remediation and containment, not the disabling of accounts by Defender for Identity.", fr: "Le niveau d'automatisation régit la correction et le confinement des appareils, pas la désactivation des comptes par Defender for Identity." }
    references:
      - title: Configure automatic attack disruption in Microsoft Defender XDR
        url: https://learn.microsoft.com/en-us/defender-xdr/configure-attack-disruption

  # ------------------------------------------------------------------ 9
  - id: sc200-qz-12-09
    objective: "1.1.11"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Litware, Inc. uses Microsoft Sentinel, and its playbooks are stored in a resource group named **RG-Playbooks**. A security engineer named Eng1 has the Microsoft Sentinel Contributor role on the workspace and the Logic App Contributor role on RG-Playbooks. An administrator named Admin1 has the Owner role on RG-Playbooks.

        Eng1 creates a playbook named **pb-Isolate** in RG-Playbooks, then an automation rule that must run pb-Isolate for new high-severity incidents. In the automation rule, pb-Isolate appears as unavailable.

        You need the automation rule to run pb-Isolate. The solution must follow the principle of least privilege.

        What should you do?
      fr: |
        Litware, Inc. utilise Microsoft Sentinel, et ses playbooks sont stockés dans un groupe de ressources nommé **RG-Playbooks**. Un ingénieur sécurité nommé Eng1 dispose du rôle Microsoft Sentinel Contributor sur l'espace de travail et du rôle Logic App Contributor sur RG-Playbooks. Un administrateur nommé Admin1 dispose du rôle Owner sur RG-Playbooks.

        Eng1 crée un playbook nommé **pb-Isolate** dans RG-Playbooks, puis une règle d'automatisation qui doit exécuter pb-Isolate pour les nouveaux incidents de gravité élevée. Dans la règle d'automatisation, pb-Isolate apparaît comme indisponible.

        Vous devez faire en sorte que la règle d'automatisation exécute pb-Isolate. La solution doit respecter le principe du moindre privilège.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Assign the Microsoft Sentinel Automation Contributor role to Eng1 on RG-Playbooks.", fr: "Attribuer le rôle Microsoft Sentinel Automation Contributor à Eng1 sur RG-Playbooks." } }
        - { id: b, text: { en: "Have Eng1 grant Microsoft Sentinel permissions on RG-Playbooks in Manage playbook permissions.", fr: "Faire accorder par Eng1 des autorisations à Microsoft Sentinel sur RG-Playbooks dans Gérer les autorisations des playbooks." } }
        - { id: c, text: { en: "Assign the Microsoft Sentinel Responder role to the managed identity of pb-Isolate.", fr: "Attribuer le rôle Microsoft Sentinel Responder à l'identité managée de pb-Isolate." } }
        - { id: d, text: { en: "Ask Admin1 to grant Microsoft Sentinel permissions on RG-Playbooks in Manage playbook permissions.", fr: "Demander à Admin1 d'accorder à Microsoft Sentinel des autorisations sur RG-Playbooks dans Gérer les autorisations des playbooks." } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          A playbook appears unavailable when the Microsoft Sentinel service account has no permission on its resource group. Granting it, through **Manage playbook permissions**, gives the service account the Microsoft Sentinel Automation Contributor role on RG-Playbooks and requires Owner or User Access Administrator, which Eng1 doesn't have but Admin1 does. No new role is needed for anyone.
        fr: |
          Un playbook apparaît indisponible quand le compte de service de Microsoft Sentinel n'a aucune autorisation sur son groupe de ressources. L'accorder, par **Gérer les autorisations des playbooks**, donne au compte de service le rôle Microsoft Sentinel Automation Contributor sur RG-Playbooks et exige Owner ou User Access Administrator, ce qu'Eng1 n'a pas mais qu'Admin1 a. Aucun nouveau rôle n'est nécessaire pour personne.
      options:
        a: { en: "Automation Contributor is meant for the Sentinel service account, not for users, and it doesn't let Eng1 grant permissions.", fr: "Automation Contributor est destiné au compte de service Sentinel, pas aux utilisateurs, et il ne permet pas à Eng1 d'accorder des autorisations." }
        b: { en: "Granting these permissions requires Owner or User Access Administrator on the resource group; Microsoft Sentinel Contributor and Logic App Contributor aren't enough.", fr: "Accorder ces autorisations exige Owner ou User Access Administrator sur le groupe de ressources ; Microsoft Sentinel Contributor et Logic App Contributor ne suffisent pas." }
        c: { en: "The managed identity acts on Sentinel once the playbook runs; the rule fails earlier, because Sentinel can't start the playbook.", fr: "L'identité managée agit sur Sentinel une fois le playbook lancé ; la règle échoue plus tôt, car Sentinel ne peut pas démarrer le playbook." }
    references:
      - title: Automate and run Microsoft Sentinel playbooks
        url: https://learn.microsoft.com/en-us/azure/sentinel/automation/run-playbooks
      - title: Create and use Microsoft Sentinel automation rules to manage response
        url: https://learn.microsoft.com/en-us/azure/sentinel/create-manage-use-automation-rules

  # ------------------------------------------------------------------ 10
  - id: sc200-qz-12-10
    objective: "1.1.7"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        Contoso, Ltd. uses Microsoft Defender for Endpoint Plan 2 and has the following device groups.

        | Rank | Device group | Matching rule | Automation level |
        | --- | --- | --- | --- |
        | 1 | DG-Servers | Tag equals Server | Semi - require approval for core folders remediation |
        | 2 | DG-Lab | Tag equals Lab | No automated response |
        | Last | Ungrouped devices (default) | - | Full - remediate threats automatically |

        The device **LAB-SRV1** has the tags Lab and Server. The device **PC7** has no tag. Automated investigation and response (AIR) finds malicious files on these devices.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Contoso, Ltd. utilise Microsoft Defender for Endpoint Plan 2 et dispose des groupes d'appareils suivants.

        | Rang | Groupe d'appareils | Règle de correspondance | Niveau d'automatisation |
        | --- | --- | --- | --- |
        | 1 | DG-Servers | Tag equals Server | Semi - require approval for core folders remediation |
        | 2 | DG-Lab | Tag equals Lab | No automated response |
        | Dernier | Ungrouped devices (default) | - | Full - remediate threats automatically |

        L'appareil **LAB-SRV1** porte les étiquettes Lab et Server. L'appareil **PC7** ne porte aucune étiquette. L'enquête et la réponse automatisées (AIR) trouvent des fichiers malveillants sur ces appareils.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text: { en: "The remediation of a malicious file in C:\\Windows\\System32 on LAB-SRV1 waits for approval on the Pending tab of the Action center.", fr: "La correction d'un fichier malveillant dans C:\\Windows\\System32 sur LAB-SRV1 attend une approbation dans l'onglet Pending du centre de notifications." }
        - id: s2
          text: { en: "For a malicious file in D:\\Tools on LAB-SRV1, no remediation action is taken or pending.", fr: "Pour un fichier malveillant dans D:\\Tools sur LAB-SRV1, aucune action de correction n'est effectuée ni mise en attente." }
        - id: s3
          text: { en: "The remediation of a malicious file in C:\\Users\\Public on PC7 waits for approval on the Pending tab of the Action center.", fr: "La correction d'un fichier malveillant dans C:\\Users\\Public sur PC7 attend une approbation dans l'onglet Pending du centre de notifications." }
    answer:
      values: { s1: true, s2: false, s3: false }
    explanation:
      correct:
        en: |
          LAB-SRV1 matches both rules but joins only the highest-ranked group, DG-Servers, so No automated response doesn't apply to it. DG-Servers requires approval for files in core folders, such as `\windows\*`, and remediates files in other folders, such as D:\Tools, automatically. PC7 matches no rule and falls into Ungrouped devices, whose Full level remediates without approval.
        fr: |
          LAB-SRV1 correspond aux deux règles mais ne rejoint que le groupe de rang le plus élevé, DG-Servers : No automated response ne s'applique donc pas à lui. DG-Servers exige une approbation pour les fichiers des dossiers principaux, comme `\windows\*`, et corrige automatiquement les fichiers des autres dossiers, comme D:\Tools. PC7 ne correspond à aucune règle et rejoint Ungrouped devices, dont le niveau Full corrige sans approbation.
      options:
        s2: { en: "LAB-SRV1 is in DG-Servers, not DG-Lab, and D:\\Tools isn't a core folder: the file is remediated automatically.", fr: "LAB-SRV1 est dans DG-Servers, pas dans DG-Lab, et D:\\Tools n'est pas un dossier principal : le fichier est corrigé automatiquement." }
        s3: { en: "PC7 is in Ungrouped devices, set to Full: the action runs automatically and appears on the History tab.", fr: "PC7 est dans Ungrouped devices, réglé sur Full : l'action s'exécute automatiquement et apparaît dans l'onglet History." }
    references:
      - title: Automation levels in automated investigation and remediation
        url: https://learn.microsoft.com/en-us/defender-endpoint/automation-levels
      - title: Create and manage device groups in Microsoft Defender for Endpoint
        url: https://learn.microsoft.com/en-us/defender-endpoint/machine-groups
