chapter: 21-xdr-workloads
questions:
  # ------------------------------------------------------------------ 1
  - id: sc200-qz-21-01
    objective: "2.1.1"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Contoso uses Microsoft Defender XDR. For the weekly SOC review, the manager asks for the incidents of the last week in which Defender XDR contained a compromised user account or device automatically, while the attack was in progress and before any analyst action.

        What should you use in the incident queue of the Microsoft Defender portal?
      fr: |
        Contoso utilise Microsoft Defender XDR. Pour la revue hebdomadaire du SOC, le responsable demande les incidents de la semaine écoulée dans lesquels Defender XDR a confiné automatiquement un compte d'utilisateur ou un appareil compromis, pendant l'attaque et avant toute action d'un analyste.

        Qu'est-ce que vous devez utiliser dans la file d'attente des incidents du portail Microsoft Defender ?
    body:
      options:
        - { id: a, text: { en: "A filter on the Automated investigation detection source", fr: "Un filtre sur la source de détection Automated investigation" } }
        - { id: b, text: { en: "A filter on the Microsoft Defender for Office 365 service source", fr: "Un filtre sur la source de service Microsoft Defender for Office 365" } }
        - { id: c, text: { en: "A filter on the High severity of the incidents", fr: "Un filtre sur la gravité High des incidents" } }
        - { id: d, text: { en: "A filter on the Attack Disruption tag of the incidents", fr: "Un filtre sur la balise Attack Disruption des incidents" } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          Incidents in which automatic attack disruption acted carry the Attack Disruption tag in the incident queue and on the incident page, with a highlighted banner below the title. Filtering the queue on this tag lists them, whatever the products that raised the alerts.
        fr: |
          Les incidents dans lesquels l'interruption automatique des attaques a agi portent la balise Attack Disruption dans la file d'attente des incidents et sur la page de l'incident, avec un bandeau mis en évidence sous le titre. Filtrer la file d'attente sur cette balise les liste, quels que soient les produits qui ont déclenché les alertes.
      options:
        a: { en: "Automated investigation is the source of alerts raised by automated investigation and response (AIR), not a marker of attack disruption.", fr: "Automated investigation est la source des alertes déclenchées par l'enquête et la réponse automatisées (AIR), pas une marque de l'interruption des attaques." }
        b: { en: "Disrupted incidents combine signals from several workloads, and disruption actions on users and devices aren't Defender for Office 365 actions.", fr: "Les incidents interrompus combinent des signaux de plusieurs charges de travail, et les actions d'interruption sur les utilisateurs et les appareils ne sont pas des actions de Defender for Office 365." }
        c: { en: "Many high-severity incidents had no disruption; severity doesn't identify the incidents in which disruption acted.", fr: "De nombreux incidents de gravité élevée n'ont subi aucune interruption ; la gravité n'identifie pas les incidents dans lesquels l'interruption a agi." }
    references:
      - title: Details and Results of an Automatic Attack Disruption Action - Microsoft Defender XDR
        url: https://learn.microsoft.com/en-us/defender-xdr/autoad-results

  # ------------------------------------------------------------------ 2
  - id: sc200-qz-21-02
    objective: "2.1.3"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Tailspin uses Microsoft Defender for Cloud with the Defender for Servers plan. An alert reports the exploitation of a vulnerable web service on a VM named **VM-WEB01**. You open the alert, select **View full details**, and go to the **Take action** tab.

        You already applied the manual remediation steps. You now need the security recommendations that reduce the attack surface of VM-WEB01 and improve its security posture.

        Which section of the Take action tab should you use?
      fr: |
        Tailspin utilise Microsoft Defender pour le cloud avec le plan Defender for Servers. Une alerte signale l'exploitation d'un service web vulnérable sur une machine virtuelle nommée **VM-WEB01**. Vous ouvrez l'alerte, sélectionnez **Afficher tous les détails**, puis allez dans l'onglet **Prendre des mesures**.

        Vous avez déjà appliqué les étapes de correction manuelles. Vous avez maintenant besoin des recommandations de sécurité qui réduisent la surface d'attaque de VM-WEB01 et améliorent sa posture de sécurité.

        Quelle section de l'onglet Prendre des mesures devez-vous utiliser ?
    body:
      options:
        - { id: a, text: Inspect resource context }
        - { id: b, text: Mitigate the threat }
        - { id: c, text: Prevent future attacks }
        - { id: d, text: Suppress similar alerts }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          Prevent future attacks lists the security recommendations that reduce the attack surface and improve the security posture of the resource. It's the step that hardens VM-WEB01 after the threat itself has been mitigated.
        fr: |
          Prevent future attacks liste les recommandations de sécurité qui réduisent la surface d'attaque et améliorent la posture de sécurité de la ressource. C'est l'étape qui renforce VM-WEB01 une fois la menace elle-même atténuée.
      options:
        a: { en: "Inspect resource context opens the activity logs around the alert for the investigation; it gives no hardening recommendations.", fr: "Inspect resource context ouvre les journaux d'activité autour de l'alerte pour l'enquête ; il ne donne aucune recommandation de renforcement." }
        b: { en: "Mitigate the threat contains the manual remediation steps, which you already applied.", fr: "Mitigate the threat contient les étapes de correction manuelles, que vous avez déjà appliquées." }
        d: { en: "Suppress similar alerts hides future alerts of benign activity; it doesn't make the VM harder to attack.", fr: "Suppress similar alerts masque les futures alertes d'une activité bénigne ; il ne rend pas la machine virtuelle plus difficile à attaquer." }
    references:
      - title: Manage and Respond to Security Alerts - Microsoft Defender for Cloud
        url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/manage-respond-alerts

  # ------------------------------------------------------------------ 3
  - id: sc200-qz-21-03
    objective: "2.1.6"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Northwind uses Microsoft Defender XDR. Its Okta identities are integrated with Microsoft Defender for Identity and appear on the identity pages of the Microsoft Defender portal. You have the permissions required for remediation actions.

        An investigation shows that an attacker hijacked the active Okta sessions of a user named **User3**. User3's password wasn't exposed.

        You need to end all the active Okta sessions of User3 from the identity page. User3 must be able to sign in again immediately afterward.

        Which action should you take?
      fr: |
        Northwind utilise Microsoft Defender XDR. Ses identités Okta sont intégrées à Microsoft Defender pour Identity et apparaissent sur les pages d'identité du portail Microsoft Defender. Vous disposez des autorisations requises pour les actions de correction.

        Une enquête montre qu'un attaquant a détourné les sessions Okta actives d'un utilisateur nommé **User3**. Le mot de passe de User3 n'a pas été exposé.

        Vous devez mettre fin à toutes les sessions Okta actives de User3 depuis la page d'identité. User3 doit pouvoir se reconnecter immédiatement après.

        Quelle action devez-vous effectuer ?
    body:
      options:
        - { id: a, text: Disable }
        - { id: b, text: Force password change }
        - { id: c, text: Mark as compromised }
        - { id: d, text: Revoke session }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          Revoke session ends the active sessions of the identity and is supported for Microsoft Entra ID and Okta identities. The account stays enabled and the password unchanged, so User3 can sign in again right away.
        fr: |
          Revoke session met fin aux sessions actives de l'identité et est pris en charge pour les identités Microsoft Entra ID et Okta. Le compte reste activé et le mot de passe inchangé : User3 peut donc se reconnecter immédiatement.
      options:
        a: { en: "Disable is supported for Okta, but it prevents User3 from signing in until the account is enabled again.", fr: "Disable est pris en charge pour Okta, mais empêche User3 de se connecter jusqu'à ce que le compte soit réactivé." }
        b: { en: "Force password change is supported only for Active Directory and Microsoft Entra ID identities, not for Okta.", fr: "Force password change n'est pris en charge que pour les identités Active Directory et Microsoft Entra ID, pas pour Okta." }
        c: { en: "Mark as compromised is available only for Microsoft Entra ID identities; it raises the user risk, it doesn't end Okta sessions.", fr: "Mark as compromised n'est disponible que pour les identités Microsoft Entra ID ; il élève le risque utilisateur, il ne met pas fin aux sessions Okta." }
    references:
      - title: Remediate compromised identities in Microsoft Defender - Microsoft Defender for Identity
        url: https://learn.microsoft.com/en-us/defender-for-identity/remediation-actions

  # ------------------------------------------------------------------ 4
  - id: sc200-qz-21-04
    objective: "2.1.2"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Litware uses Microsoft Purview Data Loss Prevention (DLP) and investigates the DLP alerts in the Microsoft Defender portal. A DLP alert shows that a user shared a OneDrive file that contains customer bank details with an external guest.

        The file must stay in the user's OneDrive with its current content, retention label and sensitivity label, but the guest must lose access to it.

        Which action should you take from the alert?
      fr: |
        Litware utilise Microsoft Purview Data Loss Prevention (DLP) et examine les alertes DLP dans le portail Microsoft Defender. Une alerte DLP montre qu'un utilisateur a partagé avec un invité externe un fichier OneDrive qui contient les coordonnées bancaires de clients.

        Le fichier doit rester dans le OneDrive de l'utilisateur avec son contenu, son étiquette de rétention et son étiquette de confidentialité actuels, mais l'invité doit perdre l'accès au fichier.

        Quelle action devez-vous effectuer depuis l'alerte ?
    body:
      options:
        - { id: a, text: Apply retention label }
        - { id: b, text: Unshare }
        - { id: c, text: Apply sensitivity label }
        - { id: d, text: Delete }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          For SharePoint and OneDrive files, the DLP alert offers Apply retention label, Unshare, Delete, Apply sensitivity label and Download. Unshare removes the sharing that gave the guest access, without changing the file, its location or its labels.
        fr: |
          Pour les fichiers SharePoint et OneDrive, l'alerte DLP propose Apply retention label, Unshare, Delete, Apply sensitivity label et Download. Unshare supprime le partage qui donnait l'accès à l'invité, sans modifier le fichier, son emplacement ni ses étiquettes.
      options:
        a: { en: "A retention label controls how long the file is kept or when it's deleted, not who can open it; the label must stay unchanged anyway.", fr: "Une étiquette de rétention contrôle la durée de conservation ou la suppression du fichier, pas qui peut l'ouvrir ; l'étiquette doit de toute façon rester inchangée." }
        c: { en: "Changing the sensitivity label could restrict access, but the current label must be kept.", fr: "Changer l'étiquette de confidentialité pourrait restreindre l'accès, mais l'étiquette actuelle doit être conservée." }
        d: { en: "Delete removes the file from the user's OneDrive, which breaks the requirement to keep it.", fr: "Delete retire le fichier du OneDrive de l'utilisateur, ce qui enfreint l'exigence de le conserver." }
    references:
      - title: Investigate data loss alerts with Microsoft Defender XDR - Microsoft Defender XDR
        url: https://learn.microsoft.com/en-us/defender-xdr/dlp-investigate-alerts-defender

  # ------------------------------------------------------------------ 5
  - id: sc200-qz-21-05
    objective: "2.1.4"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Adatum uses Microsoft Defender for Cloud Apps with app connectors for Microsoft 365 and Salesforce. A user named **User6** left the company two weeks ago, and User6's Microsoft Entra account was deleted.

        Defender for Cloud Apps raises an **Activity performed by terminated user** alert: User6's Salesforce account exported reports yesterday. You confirm that the activity is real and wasn't approved.

        What should you do?
      fr: |
        Adatum utilise Microsoft Defender pour les applications cloud avec des connecteurs d'applications pour Microsoft 365 et Salesforce. Un utilisateur nommé **User6** a quitté l'entreprise il y a deux semaines, et son compte Microsoft Entra a été supprimé.

        Defender pour les applications cloud déclenche une alerte **Activity performed by terminated user** : le compte Salesforce de User6 a exporté des rapports hier. Vous confirmez que l'activité est réelle et n'a pas été approuvée.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Apply Require user to sign in again to User6, so that the active sessions end.", fr: "Appliquer Require user to sign in again à User6, afin de mettre fin aux sessions actives." } }
        - { id: b, text: { en: "Apply Confirm user compromised to User6, so that the user risk policies apply.", fr: "Appliquer Confirm user compromised à User6, afin que les stratégies de risque utilisateur s'appliquent." } }
        - { id: c, text: { en: "Disable User6's account in Salesforce and in the other apps that User6 can still access.", fr: "Désactiver le compte de User6 dans Salesforce et dans les autres applications auxquelles User6 accède encore." } }
        - { id: d, text: { en: "Classify the alert as a benign true positive, because User6 no longer works there.", fr: "Classer l'alerte comme vrai positif bénin, car User6 ne travaille plus dans l'entreprise." } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          A true positive for this alert means that a terminated user still has access to corporate resources and uses it. The recommended response is to disable the user in the apps that the user can still reach, here the Salesforce account that remained active after the Microsoft Entra account was deleted.
        fr: |
          Un vrai positif pour cette alerte signifie qu'un utilisateur parti a encore accès à des ressources de l'entreprise et s'en sert. La réponse recommandée consiste à désactiver l'utilisateur dans les applications qu'il peut encore atteindre, ici le compte Salesforce resté actif après la suppression du compte Microsoft Entra.
      options:
        a: { en: "Signing in again only revokes tokens and session cookies; User6 can still sign in to Salesforce with the account.", fr: "La reconnexion ne fait que révoquer les jetons et les cookies de session ; User6 peut toujours se connecter à Salesforce avec le compte." }
        b: { en: "User risk policies act on Microsoft Entra sign-ins, and User6's Microsoft Entra account no longer exists.", fr: "Les stratégies de risque utilisateur agissent sur les connexions Microsoft Entra, et le compte Microsoft Entra de User6 n'existe plus." }
        d: { en: "A benign true positive covers a user who was temporarily disabled or deleted and re-registered; unapproved exports by a departed user are a true positive.", fr: "Un vrai positif bénin couvre un utilisateur temporairement désactivé, ou supprimé puis réinscrit ; des exportations non approuvées par un utilisateur parti sont un vrai positif." }
    references:
      - title: How to investigate anomaly detection alerts - Microsoft Defender for Cloud Apps
        url: https://learn.microsoft.com/en-us/defender-cloud-apps/investigate-anomaly-alerts

  # ------------------------------------------------------------------ 6
  - id: sc200-qz-21-06
    objective: "2.1.4"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Woodgrove uses Microsoft Defender for Cloud Apps with the Microsoft 365 app connector. A third-party OAuth app named **App-Sync** synchronizes the calendars of 300 users and must keep working for them.

        Defender for Cloud Apps raises an **Unusual ISP for an OAuth app** alert for App-Sync. Your investigation shows that the activities came from a hosting provider that the app vendor never uses and that they read mailbox content, which App-Sync never does. No user account shows signs of compromise.

        You need to remediate the alert. The solution must keep App-Sync available to its users.

        What should you do?
      fr: |
        Woodgrove utilise Microsoft Defender pour les applications cloud avec le connecteur d'application Microsoft 365. Une application OAuth tierce nommée **App-Sync** synchronise les calendriers de 300 utilisateurs et doit continuer à fonctionner pour eux.

        Defender pour les applications cloud déclenche une alerte **Unusual ISP for an OAuth app** pour App-Sync. Votre enquête montre que les activités provenaient d'un hébergeur que l'éditeur de l'application n'utilise jamais et qu'elles lisaient le contenu de boîtes aux lettres, ce que App-Sync ne fait jamais. Aucun compte d'utilisateur ne montre de signe de compromission.

        Vous devez corriger l'alerte. La solution doit laisser App-Sync disponible pour ses utilisateurs.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Ban App-Sync from the OAuth apps page, so that no user can grant it permissions again.", fr: "Interdire App-Sync depuis la page des applications OAuth, afin qu'aucun utilisateur ne puisse plus lui accorder d'autorisations." } }
        - { id: b, text: { en: "Revoke the access tokens of App-Sync, and check whether the attacker can generate new tokens.", fr: "Révoquer les jetons d'accès d'App-Sync, et vérifier si l'attaquant peut générer de nouveaux jetons." } }
        - { id: c, text: { en: "Suspend the users who consented to App-Sync, and have them reset their passwords at sign-in.", fr: "Suspendre les utilisateurs qui ont consenti à App-Sync, et leur faire réinitialiser leur mot de passe à la connexion." } }
        - { id: d, text: { en: "Classify the alert as a benign true positive, because App-Sync is an app the company approved.", fr: "Classer l'alerte comme vrai positif bénin, car App-Sync est une application approuvée par l'entreprise." } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          For a true positive Unusual ISP for an OAuth app alert, the recommended response is to revoke all the access tokens of the OAuth app and to investigate whether an attacker is able to generate OAuth access tokens. This removes the attacker's access while the app, its consents and its legitimate users stay in place.
        fr: |
          Pour une alerte Unusual ISP for an OAuth app qui est un vrai positif, la réponse recommandée consiste à révoquer tous les jetons d'accès de l'application OAuth et à vérifier si un attaquant est capable de générer des jetons d'accès OAuth. Cela retire l'accès de l'attaquant tout en conservant l'application, ses consentements et ses utilisateurs légitimes.
      options:
        a: { en: "Banning the app removes it from the 300 users who rely on it, which breaks the availability requirement.", fr: "Interdire l'application la retire aux 300 utilisateurs qui en dépendent, ce qui enfreint l'exigence de disponibilité." }
        c: { en: "The threat is the app's tokens, not the user accounts; suspending 300 uncompromised users disrupts them without removing the attacker's access.", fr: "La menace porte sur les jetons de l'application, pas sur les comptes d'utilisateurs ; suspendre 300 utilisateurs non compromis les perturbe sans retirer l'accès de l'attaquant." }
        d: { en: "The activity wasn't legitimate for the app: approval of the app doesn't make a malicious use of its tokens benign.", fr: "L'activité n'était pas légitime pour l'application : l'approbation de l'application ne rend pas bénigne une utilisation malveillante de ses jetons." }
    references:
      - title: How to investigate anomaly detection alerts - Microsoft Defender for Cloud Apps
        url: https://learn.microsoft.com/en-us/defender-cloud-apps/investigate-anomaly-alerts

  # ------------------------------------------------------------------ 7
  - id: sc200-qz-21-07
    objective: "2.1.1"
    difficulty: 3
    status: draft
    type: dropdown
    shuffle: false
    stem:
      en: |
        Fabrikam uses Microsoft Defender for Office 365 Plan 2. Microsoft Defender XDR Unified RBAC is active for the **Email & collaboration > Defender for Office 365** workload.

        A Threat Explorer query returns 140,000 delivered messages of a malware campaign. Tier-1 analysts add the remediation to the Action center, and Tier-2 analysts approve it. The messages must be permanently purged. The custom role of the Tier-2 analysts already includes the **Email & collaboration advanced actions (manage)** permission.

        How should you complete the plan? Select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Fabrikam utilise Microsoft Defender pour Office 365 Plan 2. Le RBAC unifié de Microsoft Defender XDR est actif pour la charge de travail **Email & collaboration > Defender for Office 365**.

        Une requête de l'Explorateur de menaces (Threat Explorer) renvoie 140 000 messages remis d'une campagne de logiciels malveillants. Les analystes de niveau 1 ajoutent la correction au Centre de notifications, et les analystes de niveau 2 l'approuvent. Les messages doivent être purgés définitivement. Le rôle personnalisé des analystes de niveau 2 inclut déjà l'autorisation **Email & collaboration advanced actions (manage)**.

        Comment devez-vous compléter le plan ? Sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: text
      template:
        en: |
          Minimum number of remediations to submit, following Microsoft's batch size recommendation: [[batches]]

          Additional permission that the Tier-2 custom role needs to approve the action: [[perm]]

          Where to review, two weeks later, the status and the action logs of each remediation: [[hist]]
        fr: |
          Nombre minimal de corrections à soumettre, selon la recommandation de Microsoft sur la taille des lots : [[batches]]

          Autorisation supplémentaire dont le rôle personnalisé de niveau 2 a besoin pour approuver l'action : [[perm]]

          Où consulter, deux semaines plus tard, l'état et les journaux d'action de chaque correction : [[hist]]
      slots:
        - id: batches
          options:
            - { id: b1, text: "1" }
            - { id: b2, text: "2" }
            - { id: b3, text: "3" }
            - { id: b4, text: "4" }
        - id: perm
          options:
            - { id: basics, text: Security data basics (read) }
            - { id: content, text: Email & collaboration content (read) }
            - { id: alerts, text: Alerts (manage) }
            - { id: response, text: Response (manage) }
        - id: hist
          options:
            - { id: pending, text: { en: "Action center > Pending", fr: "Centre de notifications > En attente" } }
            - { id: campaigns, text: { en: "Threat Explorer > Campaigns", fr: "Explorateur de menaces > Campagnes" } }
            - { id: history, text: { en: "Action center > History", fr: "Centre de notifications > Historique" } }
            - { id: submissions, text: { en: "Submissions", fr: "Envois (Submissions)" } }
    answer:
      values: { batches: b3, perm: content, hist: history }
    explanation:
      correct:
        en: |
          A query selection can include up to 200,000 messages, but Microsoft recommends remediating in batches of 50,000 or fewer, so 140,000 messages need at least three remediations. With Unified RBAC, approving remediation requires Email & collaboration advanced actions (manage), and a hard delete also requires Email & collaboration content (read). The History tab of the Action center shows the remediations of the past 30 days with their status and action logs.
        fr: |
          Une sélection par requête peut inclure jusqu'à 200 000 messages, mais Microsoft recommande de corriger par lots de 50 000 au plus : 140 000 messages exigent donc au moins trois corrections. Avec le RBAC unifié, l'approbation d'une correction exige Email & collaboration advanced actions (manage), et une suppression définitive (hard delete) exige aussi Email & collaboration content (read). L'onglet Historique du Centre de notifications affiche les corrections des 30 derniers jours avec leur état et leurs journaux d'action.
      options:
        b1: { en: "One selection of 140,000 messages is within the 200,000 query limit, but above the recommended batch size of 50,000.", fr: "Une sélection de 140 000 messages respecte la limite de 200 000 par requête, mais dépasse la taille de lot recommandée de 50 000." }
        b2: { en: "Two batches would hold 70,000 messages each, above the recommended 50,000.", fr: "Deux lots contiendraient 70 000 messages chacun, au-delà des 50 000 recommandés." }
        basics: { en: "Security data basics (read) gives read access to security data; it doesn't add the content permission that hard delete needs.", fr: "Security data basics (read) donne un accès en lecture aux données de sécurité ; il n'ajoute pas l'autorisation de contenu dont la suppression définitive a besoin." }
        response: { en: "Response (manage) covers response actions of other workloads, such as identities; it isn't the email permission for hard delete.", fr: "Response (manage) couvre les actions de réponse d'autres charges de travail, comme les identités ; ce n'est pas l'autorisation de messagerie requise pour la suppression définitive." }
        pending: { en: "Pending lists the actions that still wait for approval; approved remediations move to History.", fr: "En attente liste les actions qui attendent encore une approbation ; les corrections approuvées passent dans Historique." }
    references:
      - title: Remediate malicious email that was delivered in Office 365 - Microsoft Defender for Office 365
        url: https://learn.microsoft.com/en-us/defender-office-365/remediate-malicious-email-delivered-office-365

  # ------------------------------------------------------------------ 8
  - id: sc200-qz-21-08
    objective: "2.1.6"
    difficulty: 3
    status: draft
    type: dropdown
    stem:
      en: |
        Contoso synchronizes its on-premises Active Directory users to Microsoft Entra ID by using Microsoft Entra Connect. Microsoft Defender for Identity sensors run on all the domain controllers, and **Automatically use the sensor's local system account** is selected. The analysts have a custom Unified RBAC role with **Response (manage)** and the Microsoft Entra roles that the actions require.

        A synchronized user named **User8** is compromised. The identity page of User8 lists both the Active Directory account and the Microsoft Entra ID account.

        Which remediation action should you take for each requirement? Select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Contoso synchronise ses utilisateurs Active Directory locaux vers Microsoft Entra ID avec Microsoft Entra Connect. Des capteurs Microsoft Defender pour Identity s'exécutent sur tous les contrôleurs de domaine, et **Automatically use the sensor's local system account** est sélectionné. Les analystes disposent d'un rôle personnalisé de RBAC unifié avec **Response (manage)** et des rôles Microsoft Entra que les actions exigent.

        Un utilisateur synchronisé nommé **User8** est compromis. La page d'identité de User8 liste à la fois le compte Active Directory et le compte Microsoft Entra ID.

        Quelle action de correction devez-vous effectuer pour chaque exigence ? Sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: text
      template:
        en: |
          Prevent User8 from signing in, both on-premises and to cloud apps, until the investigation ends: [[block]]

          End the sessions that User8 already has in cloud apps, immediately: [[sessions]]

          Raise the user risk of User8 to High in Microsoft Entra ID: [[risk]]
        fr: |
          Empêcher User8 de se connecter, en local comme aux applications cloud, jusqu'à la fin de l'enquête : [[block]]

          Mettre fin immédiatement aux sessions que User8 a déjà ouvertes dans les applications cloud : [[sessions]]

          Élever à High le risque utilisateur de User8 dans Microsoft Entra ID : [[risk]]
      slots:
        - id: block
          options:
            - { id: disad, text: { en: "Disable on the Active Directory account", fr: "Disable sur le compte Active Directory" } }
            - { id: disentra, text: { en: "Disable on the Microsoft Entra ID account", fr: "Disable sur le compte Microsoft Entra ID" } }
            - { id: revoke, text: { en: "Revoke session on the Microsoft Entra ID account", fr: "Revoke session sur le compte Microsoft Entra ID" } }
            - { id: pwdad, text: { en: "Force password change on the Active Directory account", fr: "Force password change sur le compte Active Directory" } }
        - id: sessions
          options:
            - { id: disad, text: { en: "Disable on the Active Directory account", fr: "Disable sur le compte Active Directory" } }
            - { id: revoke, text: { en: "Revoke session on the Microsoft Entra ID account", fr: "Revoke session sur le compte Microsoft Entra ID" } }
            - { id: mark, text: { en: "Mark as compromised on the Microsoft Entra ID account", fr: "Mark as compromised sur le compte Microsoft Entra ID" } }
            - { id: pwdad, text: { en: "Force password change on the Active Directory account", fr: "Force password change sur le compte Active Directory" } }
        - id: risk
          options:
            - { id: disentra, text: { en: "Disable on the Microsoft Entra ID account", fr: "Disable sur le compte Microsoft Entra ID" } }
            - { id: revoke, text: { en: "Revoke session on the Microsoft Entra ID account", fr: "Revoke session sur le compte Microsoft Entra ID" } }
            - { id: mark, text: { en: "Mark as compromised on the Microsoft Entra ID account", fr: "Mark as compromised sur le compte Microsoft Entra ID" } }
            - { id: markad, text: { en: "Mark as compromised on the Active Directory account", fr: "Mark as compromised sur le compte Active Directory" } }
    answer:
      values: { block: disad, sessions: revoke, risk: mark }
    explanation:
      correct:
        en: |
          User8 is mastered in Active Directory: disabling the Active Directory account, which the domain controller sensor performs, blocks on-premises sign-ins and is synchronized to Microsoft Entra ID, so it blocks cloud sign-ins too. Disabling doesn't end existing cloud sessions at once; Revoke session on the Microsoft Entra ID account does. Mark as compromised exists only for Microsoft Entra ID identities and sets the user risk to High.
        fr: |
          User8 est géré dans Active Directory : désactiver le compte Active Directory, ce que fait le capteur du contrôleur de domaine, bloque les connexions locales et est synchronisé vers Microsoft Entra ID ; il bloque donc aussi les connexions cloud. La désactivation ne met pas fin immédiatement aux sessions cloud existantes ; Revoke session sur le compte Microsoft Entra ID le fait. Mark as compromised n'existe que pour les identités Microsoft Entra ID et passe le risque utilisateur à High.
      options:
        disentra: { en: "For a synchronized user, a cloud-side disable is overwritten by the next synchronization and doesn't block on-premises sign-ins.", fr: "Pour un utilisateur synchronisé, une désactivation côté cloud est écrasée par la synchronisation suivante et ne bloque pas les connexions locales." }
        pwdad: { en: "Forcing a password change doesn't block sign-ins or end sessions: the attacker, or the user, is only asked for a new password.", fr: "Forcer un changement de mot de passe ne bloque pas les connexions et ne met pas fin aux sessions : l'attaquant, ou l'utilisateur, doit seulement choisir un nouveau mot de passe." }
        markad: { en: "Mark as compromised isn't available for Active Directory accounts; user risk is computed in Microsoft Entra ID.", fr: "Mark as compromised n'est pas disponible pour les comptes Active Directory ; le risque utilisateur est calculé dans Microsoft Entra ID." }
    references:
      - title: Remediate compromised identities in Microsoft Defender - Microsoft Defender for Identity
        url: https://learn.microsoft.com/en-us/defender-for-identity/remediation-actions

  # ------------------------------------------------------------------ 9
  - id: sc200-qz-21-09
    objective: "2.1.2"
    difficulty: 3
    status: draft
    type: dropdown
    stem:
      en: |
        Northwind uses Microsoft Purview Data Loss Prevention (DLP) and Microsoft Purview Insider Risk Management, integrated with Microsoft Defender XDR. In the Insider Risk Management data sharing settings, **Share user risk details with other security solutions** is turned on.

        A new analyst named **Analyst4** is assigned only the **Information Protection Analyst** role. Analyst4 investigates a user who shared OneDrive files that matched a DLP policy and who also triggered insider risk alerts.

        How should you complete the following sentences? Select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Northwind utilise Microsoft Purview Data Loss Prevention (DLP) et la gestion des risques internes Microsoft Purview, intégrées à Microsoft Defender XDR. Dans les paramètres de partage de données de la gestion des risques internes, **Share user risk details with other security solutions** est activé.

        Un nouvel analyste nommé **Analyst4** dispose uniquement du rôle **Information Protection Analyst**. Analyst4 enquête sur un utilisateur qui a partagé des fichiers OneDrive correspondant à une stratégie DLP et qui a aussi déclenché des alertes de risque interne.

        Comment devez-vous compléter les phrases suivantes ? Sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: text
      template:
        en: |
          In the Defender portal, Analyst4 can view [[view]].

          To download the matched OneDrive files from the DLP alerts, Analyst4 also needs [[download]].

          To view the insider risk alerts of the user, Analyst4 also needs [[irm]].
        fr: |
          Dans le portail Defender, Analyst4 peut consulter [[view]].

          Pour télécharger depuis les alertes DLP les fichiers OneDrive concernés, Analyst4 a aussi besoin de [[download]].

          Pour consulter les alertes de risque interne de l'utilisateur, Analyst4 a aussi besoin de [[irm]].
      slots:
        - id: view
          options:
            - { id: dlponly, text: { en: "the DLP alerts only", fr: "uniquement les alertes DLP" } }
            - { id: all, text: { en: "the DLP alerts and the other security alerts", fr: "les alertes DLP et les autres alertes de sécurité" } }
            - { id: own, text: { en: "only the DLP alerts of the policies that Analyst4 created", fr: "uniquement les alertes DLP des stratégies créées par Analyst4" } }
        - id: download
          options:
            - { id: purge, text: { en: "the Search and Purge role", fr: "le rôle Search and Purge" } }
            - { id: dccv, text: { en: "the Data Classification Content Viewer role", fr: "le rôle Data Classification Content Viewer" } }
            - { id: vma, text: { en: "the View-Only Manage Alerts role", fr: "le rôle View-Only Manage Alerts" } }
            - { id: reader, text: { en: "the Security Reader role", fr: "le rôle Security Reader" } }
        - id: irm
          options:
            - { id: secop, text: { en: "the Security Operator role", fr: "le rôle Security Operator" } }
            - { id: vodlp, text: { en: "the View-Only DLP Compliance Management role", fr: "le rôle View-Only DLP Compliance Management" } }
            - { id: irmgroup, text: { en: "membership of an Insider Risk Management role group", fr: "l'appartenance à un groupe de rôles Insider Risk Management" } }
            - { id: investigator, text: { en: "membership of the Data Investigator role group", fr: "l'appartenance au groupe de rôles Data Investigator" } }
    answer:
      values: { view: dlponly, download: dccv, irm: irmgroup }
    explanation:
      correct:
        en: |
          Information Protection Analyst is one of the roles that give access to DLP alerts only, unlike Manage Alerts and View-Only Manage Alerts, which also show the security alerts. Downloading a SharePoint or OneDrive file from a DLP alert requires the Data Classification Content Viewer role. Insider risk alerts, once data sharing is turned on, are visible only to members of an Insider Risk Management role group, such as Insider Risk Management Analysts or Investigators.
        fr: |
          Information Protection Analyst fait partie des rôles qui donnent accès aux seules alertes DLP, contrairement à Manage Alerts et View-Only Manage Alerts, qui affichent aussi les alertes de sécurité. Télécharger un fichier SharePoint ou OneDrive depuis une alerte DLP exige le rôle Data Classification Content Viewer. Les alertes de risque interne, une fois le partage de données activé, ne sont visibles que par les membres d'un groupe de rôles Insider Risk Management, comme Insider Risk Management Analysts ou Investigators.
      options:
        all: { en: "Only Manage Alerts and View-Only Manage Alerts show the security alerts in addition to the DLP alerts.", fr: "Seuls Manage Alerts et View-Only Manage Alerts affichent les alertes de sécurité en plus des alertes DLP." }
        vma: { en: "View-Only Manage Alerts adds the security alerts to the view; it doesn't grant the download of the file content.", fr: "View-Only Manage Alerts ajoute les alertes de sécurité à l'affichage ; il ne permet pas de télécharger le contenu du fichier." }
        secop: { en: "Defender roles such as Security Operator don't show insider risk alerts; an Insider Risk Management role group is required.", fr: "Les rôles Defender comme Security Operator n'affichent pas les alertes de risque interne ; un groupe de rôles Insider Risk Management est requis." }
    references:
      - title: Investigate data loss alerts with Microsoft Defender XDR - Microsoft Defender XDR
        url: https://learn.microsoft.com/en-us/defender-xdr/dlp-investigate-alerts-defender

  # ------------------------------------------------------------------ 10
  - id: sc200-qz-21-10
    objective: "2.1.5"
    difficulty: 3
    status: draft
    type: dragdrop
    stem:
      en: |
        Adatum has Microsoft Entra ID P2. A user risk-based Conditional Access policy requires multifactor authentication (MFA) and a secure password change when user risk is **High**. All users are registered for MFA. Five users currently have a **High** user risk with the **At risk** state.

        Analysts and users perform the following actions. None of the users signs in except where stated.

        Which risk state does each user have after the action? To answer, drag the appropriate risk states to the correct actions. Each risk state may be used once, more than once, or not at all.

        NOTE: Each correct selection is worth one point.
      fr: |
        Adatum dispose de Microsoft Entra ID P2. Une stratégie d'accès conditionnel basée sur le risque utilisateur exige l'authentification multifacteur (MFA) et un changement de mot de passe sécurisé quand le risque utilisateur est **High**. Tous les utilisateurs sont inscrits à l'authentification multifacteur. Cinq utilisateurs ont actuellement un risque utilisateur **High** avec l'état **At risk**.

        Les analystes et les utilisateurs effectuent les actions suivantes. Aucun utilisateur ne se connecte, sauf mention contraire.

        Quel état de risque chaque utilisateur a-t-il après l'action ? Pour répondre, faites glisser les états de risque appropriés vers les actions correspondantes. Chaque état de risque peut être utilisé une fois, plusieurs fois ou pas du tout.

        Remarque : chaque sélection correcte vaut un point.
    body:
      reuse: true
      items:
        - { id: atrisk, text: At risk }
        - { id: remediated, text: Remediated }
        - { id: dismissed, text: Dismissed }
        - { id: confirmed, text: Confirmed compromised }
      targets:
        - { id: t1, text: { en: "An analyst resets User1's password and generates a temporary password from the Risky users report.", fr: "Un analyste réinitialise le mot de passe de User1 et génère un mot de passe temporaire depuis le rapport des utilisateurs à risque." } }
        - { id: t2, text: { en: "An analyst selects Require password change for User2.", fr: "Un analyste sélectionne Require password change pour User2." } }
        - { id: t3, text: { en: "An analyst dismisses the user risk of User3.", fr: "Un analyste ignore le risque utilisateur de User3." } }
        - { id: t4, text: { en: "An analyst confirms that User4 is compromised.", fr: "Un analyste confirme que User4 est compromis." } }
        - { id: t5, text: { en: "User5 signs in, completes MFA and performs the secure password change that the policy requires.", fr: "User5 se connecte, effectue l'authentification multifacteur et le changement de mot de passe sécurisé exigé par la stratégie." } }
    answer:
      mapping: { t1: remediated, t2: atrisk, t3: dismissed, t4: confirmed, t5: remediated }
    explanation:
      correct:
        en: |
          A temporary password generated by an administrator remediates the risk at once. Require password change remediates it only once the user performs the change, so User2, who hasn't signed in, stays At risk. Dismissing sets the state to Dismissed without changing the password, and confirming the compromise sets it to Confirmed compromised. A secure password change after MFA, required by the policy, is self-remediation: the state becomes Remediated.
        fr: |
          Un mot de passe temporaire généré par un administrateur corrige le risque immédiatement. Require password change ne le corrige qu'une fois que l'utilisateur a effectué le changement : User2, qui ne s'est pas connecté, reste donc At risk. Ignorer le risque passe l'état à Dismissed sans modifier le mot de passe, et confirmer la compromission le passe à Confirmed compromised. Un changement de mot de passe sécurisé après l'authentification multifacteur, exigé par la stratégie, est une correction autonome : l'état devient Remediated.
      options:
        t2: { en: "The analyst only requests the change; the risk becomes Remediated when User2 completes MFA and changes the password.", fr: "L'analyste ne fait que demander le changement ; le risque devient Remediated quand User2 effectue l'authentification multifacteur et change son mot de passe." }
        t3: { en: "Dismissed isn't Remediated: the password is unchanged, so a really compromised account stays exposed.", fr: "Dismissed n'est pas Remediated : le mot de passe est inchangé, et un compte réellement compromis reste donc exposé." }
    references:
      - title: Remediate risks and unblock users - Microsoft Entra ID Protection
        url: https://learn.microsoft.com/en-us/entra/id-protection/howto-identity-protection-remediate-unblock
