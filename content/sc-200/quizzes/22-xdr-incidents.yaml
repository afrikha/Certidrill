chapter: 22-xdr-incidents
questions:
  # ------------------------------------------------------------------ 1
  - id: sc200-qz-22-01
    objective: "2.1.8"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Contoso has provisioned access to Microsoft Security Copilot. While investigating an incident in the Microsoft Defender portal, an analyst finds an unknown executable named **syncagent.exe** in the attack story.

        The analyst needs Copilot to assess whether the file is malicious and to highlight the strings, API calls and certificates that it contains.

        Which Copilot capability should the analyst use?
      fr: |
        Contoso a provisionné l'accès à Microsoft Security Copilot. En examinant un incident dans le portail Microsoft Defender, un analyste trouve un exécutable inconnu nommé **syncagent.exe** dans l'histoire de l'attaque.

        L'analyste a besoin que Copilot évalue si le fichier est malveillant et mette en évidence les chaînes, les appels d'API et les certificats qu'il contient.

        Quelle fonctionnalité de Copilot l'analyste doit-il utiliser ?
    body:
      options:
        - { id: a, text: { en: "Script analysis", fr: "Analyse de script" } }
        - { id: b, text: { en: "File analysis", fr: "Analyse de fichier" } }
        - { id: c, text: { en: "Device summary", fr: "Résumé d'appareil" } }
        - { id: d, text: { en: "Guided responses", fr: "Réponses guidées" } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          File analysis gives an AI assessment of a file, with a detection name when the file is malicious, its certificates and signer, and a summary of its contents. Its details list the strings found in the file, the API calls it uses and its certificates. The analyst starts it by selecting the file in the attack story and then Analyze in the side pane.
        fr: |
          L'analyse de fichier fournit une évaluation du fichier par l'IA, avec un nom de détection si le fichier est malveillant, ses certificats et son signataire, et un résumé de son contenu. Ses détails listent les chaînes trouvées dans le fichier, les appels d'API qu'il utilise et ses certificats. L'analyste la lance en sélectionnant le fichier dans l'histoire de l'attaque, puis Analyze dans le volet latéral.
      options:
        a: { en: "Script analysis explains a command line or a script, such as an obfuscated PowerShell command, not the contents of an executable file.", fr: "L'analyse de script explique une ligne de commande ou un script, comme une commande PowerShell obscurcie, pas le contenu d'un fichier exécutable." }
        c: { en: "Device summary gives key information about a device, such as its posture and unusual behavior, not an analysis of a file.", fr: "Le résumé d'appareil donne les informations clés sur un appareil, comme sa posture et ses comportements inhabituels, pas l'analyse d'un fichier." }
        d: { en: "Guided responses recommend triage, containment and remediation actions for the incident; they don't analyze what a file contains.", fr: "Les réponses guidées recommandent des actions de triage, de confinement et de correction pour l'incident ; elles n'analysent pas le contenu d'un fichier." }
    references:
      - title: Analyze files with Microsoft Copilot in Microsoft Defender
        url: https://learn.microsoft.com/en-us/defender-xdr/copilot-in-defender-file-analysis

  # ------------------------------------------------------------------ 2
  - id: sc200-qz-22-02
    objective: "2.1.7"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Fabrikam onboarded its Microsoft Sentinel workspace to the Microsoft Defender portal. During an authorized red team exercise, a Sentinel analytics rule created an incident for the password spray attack that the red team ran as planned.

        You confirm that the activity is the planned exercise, and you resolve the incident.

        Which classification should you select?
      fr: |
        Fabrikam a intégré son espace de travail Microsoft Sentinel au portail Microsoft Defender. Pendant un exercice red team autorisé, une règle d'analytique Sentinel a créé un incident pour l'attaque par pulvérisation de mots de passe que l'équipe red team a menée comme prévu.

        Vous confirmez que l'activité correspond à l'exercice prévu, puis vous résolvez l'incident.

        Quelle classification devez-vous sélectionner ?
    body:
      options:
        - { id: a, text: { en: "True positive", fr: "Vrai positif" } }
        - { id: b, text: { en: "False positive", fr: "Faux positif" } }
        - { id: c, text: { en: "Informational, expected activity", fr: "Activité informationnelle attendue" } }
        - { id: d, text: { en: "Not set", fr: "Non défini" } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          The Informational, expected activity classification is meant for security tests, red team activity and expected unusual behavior of trusted apps and users. The detection was accurate, but the activity was planned and authorized, so it isn't a real threat.
        fr: |
          La classification Activité informationnelle attendue est prévue pour les tests de sécurité, les activités red team et les comportements inhabituels attendus d'applications et d'utilisateurs approuvés. La détection était exacte, mais l'activité était prévue et autorisée : ce n'est pas une menace réelle.
      options:
        a: { en: "True positive is for incidents that indicate a real threat; an authorized exercise isn't one, and the classification would distort the threat statistics.", fr: "Vrai positif sert aux incidents qui signalent une menace réelle ; un exercice autorisé n'en est pas une, et cette classification fausserait les statistiques de menaces." }
        b: { en: "False positive is for detections that are technically inaccurate or misleading; here the rule detected exactly the password spray that took place.", fr: "Faux positif sert aux détections techniquement inexactes ou trompeuses ; ici, la règle a détecté exactement la pulvérisation de mots de passe qui a eu lieu." }
        d: { en: "Not set is the default value of an unclassified incident; it records no conclusion about the activity.", fr: "Non défini est la valeur par défaut d'un incident non classé ; elle n'enregistre aucune conclusion sur l'activité." }
    references:
      - title: Manage incidents in the Microsoft Defender portal (legacy)
        url: https://learn.microsoft.com/en-us/defender-xdr/manage-incidents

  # ------------------------------------------------------------------ 3
  - id: sc200-qz-22-03
    objective: "2.1.9"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Tailspin Toys deployed the Microsoft Defender for Identity sensor on all its domain controllers. None of its devices are onboarded to Microsoft Defender for Endpoint yet.

        A multi-stage incident shows that the account **svc-backup** was compromised. You need an advanced hunting query that lists the devices from which svc-backup authenticated against Active Directory during the last seven days.

        Which table should you query?
      fr: |
        Tailspin Toys a déployé le capteur Microsoft Defender pour Identity sur tous ses contrôleurs de domaine. Aucun de ses appareils n'est encore intégré à Microsoft Defender for Endpoint.

        Un incident multi-étapes montre que le compte **svc-backup** a été compromis. Vous avez besoin d'une requête de repérage avancé qui liste les appareils depuis lesquels svc-backup s'est authentifié auprès d'Active Directory au cours des sept derniers jours.

        Quelle table devez-vous interroger ?
    body:
      options:
        - { id: a, text: DeviceLogonEvents }
        - { id: b, text: IdentityDirectoryEvents }
        - { id: c, text: DeviceNetworkEvents }
        - { id: d, text: IdentityLogonEvents }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          IdentityLogonEvents contains the authentication activities made through on-premises Active Directory and captured by Defender for Identity, with the account and the device that the authentication came from. The sensors on the domain controllers populate it even though no device is onboarded to Defender for Endpoint.
        fr: |
          IdentityLogonEvents contient les activités d'authentification effectuées via Active Directory local et capturées par Defender pour Identity, avec le compte et l'appareil d'où provient l'authentification. Les capteurs des contrôleurs de domaine l'alimentent même si aucun appareil n'est intégré à Defender for Endpoint.
      options:
        a: { en: "DeviceLogonEvents is populated by Defender for Endpoint; with no onboarded device, the query returns no results.", fr: "DeviceLogonEvents est alimentée par Defender for Endpoint ; sans appareil intégré, la requête ne renvoie aucun résultat." }
        b: { en: "IdentityDirectoryEvents records changes made in the directory, such as group membership or account changes, not authentications.", fr: "IdentityDirectoryEvents enregistre les modifications faites dans l'annuaire, comme l'appartenance aux groupes ou les modifications de comptes, pas les authentifications." }
        c: { en: "DeviceNetworkEvents is also populated by Defender for Endpoint, and it records network connections, not authentications.", fr: "DeviceNetworkEvents est aussi alimentée par Defender for Endpoint, et elle enregistre des connexions réseau, pas des authentifications." }
    references:
      - title: IdentityLogonEvents table in the advanced hunting schema
        url: https://learn.microsoft.com/en-us/defender-xdr/advanced-hunting-identitylogonevents-table
      - title: DeviceLogonEvents table in the advanced hunting schema - Microsoft Defender XDR
        url: https://learn.microsoft.com/en-us/defender-xdr/advanced-hunting-devicelogonevents-table

  # ------------------------------------------------------------------ 4
  - id: sc200-qz-22-04
    objective: "2.1.7"
    difficulty: 2
    status: draft
    type: yesno_statements
    stem:
      en: |
        At Wingtip Toys, the SOC handles Microsoft Sentinel detections in the unified incident queue of the Microsoft Defender portal, from the incident page (incident cases aren't used).

        Incident 812 was generated by a scheduled analytics rule and groups four active alerts. An automation rule assigns the new incidents of this rule to the network team.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Chez Wingtip Toys, le SOC traite les détections de Microsoft Sentinel dans la file d'attente unifiée des incidents du portail Microsoft Defender, depuis la page de l'incident (les cas d'incident ne sont pas utilisés).

        L'incident 812 a été généré par une règle d'analytique planifiée et regroupe quatre alertes actives. Une règle d'automatisation attribue les nouveaux incidents de cette règle à l'équipe réseau.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text:
            en: "The automation rule might run several minutes after incident 812 appears in the Defender portal."
            fr: "La règle d'automatisation peut s'exécuter plusieurs minutes après l'apparition de l'incident 812 dans le portail Defender."
        - id: s2
          text:
            en: "The incident provider name of incident 812 is Microsoft Sentinel."
            fr: "Le nom du fournisseur d'incidents de l'incident 812 est Microsoft Sentinel."
        - id: s3
          text:
            en: "When an analyst resolves incident 812, its four active alerts are also resolved."
            fr: "Quand un analyste résout l'incident 812, ses quatre alertes actives sont aussi résolues."
    answer:
      values: { s1: true, s2: false, s3: true }
    explanation:
      correct:
        en: |
          Yes: the incident is created in the Defender portal and then forwarded to Microsoft Sentinel, so an automation rule can run up to 10 minutes after the incident is created or updated. No: in the Defender portal, the incident provider name is always Microsoft XDR, including for incidents from Sentinel analytics rules. Yes: on the incident page, resolving an incident also resolves all its linked active alerts.
        fr: |
          Oui : l'incident est créé dans le portail Defender puis transmis à Microsoft Sentinel ; une règle d'automatisation peut donc s'exécuter jusqu'à 10 minutes après la création ou la mise à jour de l'incident. Non : dans le portail Defender, le nom du fournisseur d'incidents est toujours Microsoft XDR, y compris pour les incidents des règles d'analytique Sentinel. Oui : sur la page de l'incident, résoudre un incident résout aussi toutes ses alertes actives liées.
      options:
        s2: { en: "The Incident provider condition was removed from automation rules for this reason: every incident has Microsoft XDR in its ProviderName field.", fr: "La condition Incident provider a été retirée des règles d'automatisation pour cette raison : chaque incident a Microsoft XDR dans son champ ProviderName." }
    references:
      - title: Transition your Microsoft Sentinel environment to the Defender portal
        url: https://learn.microsoft.com/en-us/azure/sentinel/move-to-defender
      - title: Manage incidents in the Microsoft Defender portal (legacy)
        url: https://learn.microsoft.com/en-us/defender-xdr/manage-incidents

  # ------------------------------------------------------------------ 5
  - id: sc200-qz-22-05
    objective: "2.1.10"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Woodgrove Bank connected its Microsoft Sentinel workspace to the Microsoft Defender portal and uses case management. You open case 1120 to track a business email compromise that spans several incidents.

        The case must have one accountable owner, the SOC lead **Mia**. Three analysts each handle one part of the work, and each part must have its own owner, status and due date in the case.

        What should you do?
      fr: |
        Woodgrove Bank a connecté son espace de travail Microsoft Sentinel au portail Microsoft Defender et utilise la gestion des cas. Vous ouvrez le cas 1120 pour suivre une compromission de messagerie professionnelle qui couvre plusieurs incidents.

        Le cas doit avoir un seul responsable, la responsable du SOC **Mia**. Trois analystes traitent chacun une partie du travail, et chaque partie doit avoir son propre propriétaire, son état et son échéance dans le cas.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Assign case 1120 to Mia, and create one task per part with an analyst as its owner.", fr: "Attribuer le cas 1120 à Mia, puis créer une tâche par partie avec un analyste comme propriétaire." } }
        - { id: b, text: { en: "Assign case 1120 to a Microsoft Entra group that contains Mia and the three analysts.", fr: "Attribuer le cas 1120 à un groupe Microsoft Entra qui contient Mia et les trois analystes." } }
        - { id: c, text: { en: "Create one case per analyst, and link the same incidents to each of the three cases.", fr: "Créer un cas par analyste, puis lier les mêmes incidents à chacun des trois cas." } }
        - { id: d, text: { en: "Assign case 1120 to Mia, and list each part, its analyst and its due date in the description.", fr: "Attribuer le cas 1120 à Mia, puis lister chaque partie, son analyste et son échéance dans la description." } }
    answer: { optionId: a }
    explanation:
      correct:
        en: |
          A case is assigned to a single user, which makes Mia the accountable owner. Each task of a case has its own name, status, priority, owner and due date, so one task per part gives each analyst a tracked piece of work inside the same case.
        fr: |
          Un cas est attribué à un seul utilisateur, ce qui fait de Mia la responsable. Chaque tâche d'un cas a son propre nom, son état, sa priorité, son propriétaire et son échéance ; une tâche par partie donne donc à chaque analyste un travail suivi dans le même cas.
      options:
        b: { en: "The Assigned to field of a case accepts a single user in the tenant, not a group.", fr: "Le champ Assigned to d'un cas accepte un seul utilisateur du locataire, pas un groupe." }
        c: { en: "Three cases split the work and leave no single case with one accountable owner for the whole compromise.", fr: "Trois cas éclatent le travail et ne laissent aucun cas unique avec un responsable pour l'ensemble de la compromission." }
        d: { en: "The description is plain text: it gives the parts no status, owner or due date that the case can track.", fr: "La description est du texte brut : elle ne donne aux parties ni état, ni propriétaire, ni échéance que le cas puisse suivre." }
    references:
      - title: Manage security operations cases natively in the Microsoft Defender portal
        url: https://learn.microsoft.com/en-us/unified-secops/cases-overview

  # ------------------------------------------------------------------ 6
  - id: sc200-qz-22-06
    objective: "2.1.7"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Contoso onboarded its Microsoft Sentinel workspace to the Microsoft Defender portal. A Logic Apps playbook named **PB-BlockIP** uses the Microsoft Sentinel incident trigger. An analyst named Ana ran PB-BlockIP successfully on an older incident an hour ago.

        Two minutes after a Microsoft Defender for Endpoint alert created a new incident, Ana tries to run PB-BlockIP on it from the Defender portal. The portal displays the message "Can't access data related to this action. Refresh the screen in a few minutes."

        You need Ana to run PB-BlockIP on the new incident. What should you do?
      fr: |
        Contoso a intégré son espace de travail Microsoft Sentinel au portail Microsoft Defender. Un playbook Logic Apps nommé **PB-BlockIP** utilise le déclencheur d'incident Microsoft Sentinel. Une analyste nommée Ana a exécuté PB-BlockIP avec succès sur un incident plus ancien il y a une heure.

        Deux minutes après qu'une alerte de Microsoft Defender for Endpoint a créé un nouvel incident, Ana essaie d'y exécuter PB-BlockIP depuis le portail Defender. Le portail affiche le message « Can't access data related to this action. Refresh the screen in a few minutes. »

        Vous devez permettre à Ana d'exécuter PB-BlockIP sur le nouvel incident. Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Assign Ana the Microsoft Sentinel Playbook Operator role on the resource group of PB-BlockIP.", fr: "Attribuer à Ana le rôle Microsoft Sentinel Playbook Operator sur le groupe de ressources de PB-BlockIP." } }
        - { id: b, text: { en: "Wait until the incident is synchronized to Microsoft Sentinel, refresh the page, and run PB-BlockIP again.", fr: "Attendre la synchronisation de l'incident vers Microsoft Sentinel, actualiser la page, puis réexécuter PB-BlockIP." } }
        - { id: c, text: { en: "Change PB-BlockIP to the Microsoft Sentinel alert trigger, and run it on the Defender for Endpoint alert.", fr: "Passer PB-BlockIP au déclencheur d'alerte Microsoft Sentinel, puis l'exécuter sur l'alerte de Defender for Endpoint." } }
        - { id: d, text: { en: "Grant the Microsoft Sentinel service account the Microsoft Sentinel Automation Contributor role.", fr: "Accorder au compte de service Microsoft Sentinel le rôle Microsoft Sentinel Automation Contributor." } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          Defender incidents can take up to 5 minutes to appear in Microsoft Sentinel, and playbooks run through Sentinel. This message means that the incident isn't synchronized to Sentinel yet; once it is, the playbook runs. Ana's permissions aren't the issue, because she ran the same playbook an hour ago.
        fr: |
          Les incidents Defender peuvent mettre jusqu'à 5 minutes à apparaître dans Microsoft Sentinel, et les playbooks s'exécutent via Sentinel. Ce message signifie que l'incident n'est pas encore synchronisé vers Sentinel ; une fois qu'il l'est, le playbook s'exécute. Les autorisations d'Ana ne sont pas en cause, puisqu'elle a exécuté le même playbook il y a une heure.
      options:
        a: { en: "Ana already ran PB-BlockIP successfully, so she has the permissions to run it; the message points to a synchronization delay.", fr: "Ana a déjà exécuté PB-BlockIP avec succès : elle a donc les autorisations pour l'exécuter ; le message indique un délai de synchronisation." }
        c: { en: "Running a playbook manually on an alert isn't supported in the Defender portal, and the alert data isn't synchronized yet either.", fr: "L'exécution manuelle d'un playbook sur une alerte n'est pas prise en charge dans le portail Defender, et les données de l'alerte ne sont pas encore synchronisées non plus." }
        d: { en: "The service account permissions let automation rules run playbooks; they already work, since the playbook ran an hour ago.", fr: "Les autorisations du compte de service permettent aux règles d'automatisation d'exécuter des playbooks ; elles fonctionnent déjà, puisque le playbook s'est exécuté il y a une heure." }
    references:
      - title: Transition your Microsoft Sentinel environment to the Defender portal
        url: https://learn.microsoft.com/en-us/azure/sentinel/move-to-defender

  # ------------------------------------------------------------------ 7
  - id: sc200-qz-22-07
    objective: "2.1.8"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Adatum has Microsoft Defender for Office 365 Plan 2 with unified role-based access control (RBAC), and Microsoft Security Copilot with provisioned Security Compute Units (SCUs). **Monitor reported messages in Outlook** and the **Email reported by user as malware or phish** alert policy are turned on.

        Users report about 300 messages a day; most of them are harmless newsletters. You need these alerts to be triaged automatically. Harmless reports must be resolved with an explanation of the verdict, and real phishing must stay open for an analyst. The solution must minimize administrative effort.

        What should you do?
      fr: |
        Adatum dispose de Microsoft Defender pour Office 365 Plan 2 avec le contrôle d'accès en fonction du rôle (RBAC) unifié, et de Microsoft Security Copilot avec des unités de calcul de sécurité (SCU) provisionnées. **Monitor reported messages in Outlook** et la stratégie d'alerte **Email reported by user as malware or phish** sont activés.

        Les utilisateurs signalent environ 300 messages par jour ; la plupart sont des lettres d'information inoffensives. Vous devez faire trier ces alertes automatiquement. Les signalements inoffensifs doivent être résolus avec une explication du verdict, et le vrai hameçonnage doit rester ouvert pour un analyste. La solution doit réduire au minimum l'effort administratif.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Turn on the Auto-Resolve - Email reported by user as malware or phish alert tuning rule.", fr: "Activer la règle de réglage des alertes Auto-Resolve - Email reported by user as malware or phish." } }
        - { id: b, text: { en: "Create an automation rule that closes these incidents with the False positive classification.", fr: "Créer une règle d'automatisation qui ferme ces incidents avec la classification Faux positif." } }
        - { id: c, text: { en: "Set up the Phishing Triage Agent with a new agent identity.", fr: "Configurer le Phishing Triage Agent avec une nouvelle identité d'agent." } }
        - { id: d, text: { en: "Open each incident and apply the triage steps proposed by Guided responses.", fr: "Ouvrir chaque incident et appliquer les étapes de triage proposées par les réponses guidées." } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          The Phishing Triage Agent triages the Email reported by user as malware or phish alerts on its own. It resolves the alerts it classifies as false positives, keeps true positives open for an analyst, and explains each verdict in natural language. The tenant already meets its prerequisites, and a new agent identity is the recommended option.
        fr: |
          Le Phishing Triage Agent trie seul les alertes Email reported by user as malware or phish. Il résout les alertes qu'il classe comme faux positifs, laisse les vrais positifs ouverts pour un analyste et explique chaque verdict en langage naturel. Le locataire remplit déjà ses prérequis, et une nouvelle identité d'agent est l'option recommandée.
      options:
        a: { en: "The tuning rule resolves every user-reported alert, real phishing included, without any verdict; it also prevents the agent from triaging these alerts.", fr: "La règle de réglage résout toutes les alertes signalées par les utilisateurs, vrai hameçonnage compris, sans aucun verdict ; elle empêche aussi l'agent de trier ces alertes." }
        b: { en: "An automation rule applies the same classification to every matching incident; it can't tell harmless reports from real phishing.", fr: "Une règle d'automatisation applique la même classification à tous les incidents correspondants ; elle ne sait pas distinguer les signalements inoffensifs du vrai hameçonnage." }
        d: { en: "Guided responses help an analyst who opens the incident; triaging 300 reports a day by hand doesn't meet the automation and effort requirements.", fr: "Les réponses guidées aident un analyste qui ouvre l'incident ; trier 300 signalements par jour à la main ne répond pas aux exigences d'automatisation et d'effort." }
    references:
      - title: Microsoft Security Copilot Phishing Triage Agent in Microsoft Defender
        url: https://learn.microsoft.com/en-us/defender-xdr/phishing-triage-agent

  # ------------------------------------------------------------------ 8
  - id: sc200-qz-22-08
    objective: "2.1.7"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        Litware will onboard its Microsoft Sentinel workspace to the Microsoft Defender portal. After the onboarding, analysts will work only in the Defender portal. Today, the SOC follows these procedures in the Azure portal:

        - P1: From an incident, an analyst runs the playbook **PB-GeoLookup** manually on an IP address entity.
        - P2: An automation rule runs the playbook **PB-Split**, which removes the alerts of a noisy analytics rule from incidents.
        - P3: An analyst runs the playbook **PB-Notify** manually on an incident.
        - P4: Analysts add comments to incidents during the investigation.
        - P5: Analysts assign incidents and change their status.

        Which two procedures must Litware redesign?

        NOTE: Each correct selection is worth one point.
      fr: |
        Litware va intégrer son espace de travail Microsoft Sentinel au portail Microsoft Defender. Après l'intégration, les analystes travailleront uniquement dans le portail Defender. Aujourd'hui, le SOC suit ces procédures dans le portail Azure :

        - P1 : depuis un incident, un analyste exécute manuellement le playbook **PB-GeoLookup** sur une entité adresse IP.
        - P2 : une règle d'automatisation exécute le playbook **PB-Split**, qui retire des incidents les alertes d'une règle d'analytique trop bavarde.
        - P3 : un analyste exécute manuellement le playbook **PB-Notify** sur un incident.
        - P4 : les analystes ajoutent des commentaires aux incidents pendant l'enquête.
        - P5 : les analystes attribuent les incidents et modifient leur état.

        Quelles sont les deux procédures que Litware doit repenser ?

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 2
      options:
        - { id: a, text: P1 }
        - { id: b, text: P2 }
        - { id: c, text: P3 }
        - { id: d, text: P4 }
        - { id: e, text: P5 }

    answer: { optionIds: [a, b] }
    explanation:
      correct:
        en: |
          Running a playbook manually on an entity (or on an alert) isn't supported in the Defender portal, so P1 must change, for example to a playbook with the incident trigger. Adding or removing Sentinel alerts to or from incidents is supported only manually in the Defender portal, and these actions aren't supported from within playbooks either, so PB-Split stops working.
        fr: |
          L'exécution manuelle d'un playbook sur une entité (ou sur une alerte) n'est pas prise en charge dans le portail Defender : P1 doit changer, par exemple vers un playbook à déclencheur d'incident. L'ajout ou le retrait d'alertes Sentinel dans les incidents n'est pris en charge que manuellement dans le portail Defender, et ces actions ne sont pas prises en charge non plus depuis les playbooks : PB-Split cesse de fonctionner.
      options:
        c: { en: "Running a playbook manually on an incident is supported in the Defender portal.", fr: "L'exécution manuelle d'un playbook sur un incident est prise en charge dans le portail Defender." }
        d: { en: "Comments can be added in the Defender portal; only editing an existing comment isn't supported there.", fr: "Des commentaires peuvent être ajoutés dans le portail Defender ; seule la modification d'un commentaire existant n'y est pas prise en charge." }
        e: { en: "Assigning incidents and changing their status are core tasks of the unified incident queue.", fr: "Attribuer les incidents et modifier leur état sont des tâches de base de la file d'attente unifiée des incidents." }
    references:
      - title: Transition your Microsoft Sentinel environment to the Defender portal
        url: https://learn.microsoft.com/en-us/azure/sentinel/move-to-defender

  # ------------------------------------------------------------------ 9
  - id: sc200-qz-22-09
    objective: "2.1.10"
    difficulty: 3
    status: draft
    type: dropdown
    stem:
      en: |
        Proseware connected its Microsoft Sentinel workspace to the Microsoft Defender portal and uses case management. Access is granted only through Microsoft Sentinel roles; no Defender unified RBAC custom role is used. The case queue contains hundreds of finished cases.

        The queue must show only the cases that are still being worked on. Finished cases must remain available for audits. Each role must follow the principle of least privilege.

        How should you complete the procedure? Select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Proseware a connecté son espace de travail Microsoft Sentinel au portail Microsoft Defender et utilise la gestion des cas. L'accès est accordé uniquement par des rôles Microsoft Sentinel ; aucun rôle personnalisé du RBAC unifié de Defender n'est utilisé. La file d'attente des cas contient des centaines de cas terminés.

        La file d'attente ne doit afficher que les cas encore en cours de traitement. Les cas terminés doivent rester disponibles pour les audits. Chaque rôle doit respecter le principe du moindre privilège.

        Comment devez-vous compléter la procédure ? Sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: text
      template:
        en: |
          1. A SOC administrator who has the [[r1]] role adds a custom case status named Archived.
          2. Analysts who have the [[r2]] role set the status of each finished case to Archived.
          3. The case queue is [[act]].
        fr: |
          1. Un administrateur du SOC qui a le rôle [[r1]] ajoute un état de cas personnalisé nommé Archived.
          2. Les analystes qui ont le rôle [[r2]] passent l'état de chaque cas terminé à Archived.
          3. La file d'attente des cas est [[act]].
      slots:
        - id: r1
          options:
            - { id: reader1, text: Microsoft Sentinel Reader }
            - { id: responder1, text: Microsoft Sentinel Responder }
            - { id: contributor1, text: Microsoft Sentinel Contributor }
            - { id: automation1, text: Microsoft Sentinel Automation Contributor }
        - id: r2
          options:
            - { id: reader2, text: Microsoft Sentinel Reader }
            - { id: responder2, text: Microsoft Sentinel Responder }
            - { id: contributor2, text: Microsoft Sentinel Contributor }
            - { id: automation2, text: Microsoft Sentinel Automation Contributor }
        - id: act
          options:
            - { id: filter, text: { en: "filtered to exclude the Archived status", fr: "filtrée pour exclure l'état Archived" } }
            - { id: purge, text: { en: "purged of the Archived cases after 30 days", fr: "purgée des cas Archived au bout de 30 jours" } }
            - { id: sort, text: { en: "sorted by case ID, newest first", fr: "triée par ID de cas, du plus récent au plus ancien" } }
    answer:
      values: { r1: contributor1, r2: responder2, act: filter }
    explanation:
      correct:
        en: |
          Customizing the case status options requires Microsoft Sentinel Contributor, while creating and managing cases, including updating their status, requires Microsoft Sentinel Responder. Case IDs start at 1000 and cases aren't purged: Microsoft recommends custom statuses and filters to archive cases, which keeps them available for audits.
        fr: |
          Personnaliser les options d'état des cas exige Microsoft Sentinel Contributor, tandis que créer et gérer les cas, y compris mettre à jour leur état, exige Microsoft Sentinel Responder. Les ID de cas commencent à 1000 et les cas ne sont pas purgés : Microsoft recommande les états personnalisés et les filtres pour archiver les cas, ce qui les garde disponibles pour les audits.
      options:
        responder1: { en: "Responder creates and manages cases but can't customize the status options.", fr: "Responder crée et gère les cas mais ne peut pas personnaliser les options d'état." }
        automation1: { en: "Automation Contributor is the role that Microsoft Sentinel itself needs to attach playbooks to automation rules; it grants no access to case settings.", fr: "Automation Contributor est le rôle dont Microsoft Sentinel a besoin pour associer des playbooks aux règles d'automatisation ; il ne donne aucun accès aux paramètres des cas." }
        contributor2: { en: "Contributor lets analysts update case statuses, but it also lets them customize the status options: more than they need.", fr: "Contributor permet aux analystes de mettre à jour l'état des cas, mais aussi de personnaliser les options d'état : plus que nécessaire." }
        reader2: { en: "Reader only views the case queue, case details, tasks and comments; it can't change a case status.", fr: "Reader ne fait que consulter la file d'attente, les détails des cas, les tâches et les commentaires ; il ne peut pas modifier l'état d'un cas." }
        purge: { en: "Cases aren't purged automatically, and purging would break the audit requirement.", fr: "Les cas ne sont pas purgés automatiquement, et une purge enfreindrait l'exigence d'audit." }
    references:
      - title: Manage security operations cases natively in the Microsoft Defender portal
        url: https://learn.microsoft.com/en-us/unified-secops/cases-overview

  # ------------------------------------------------------------------ 10
  - id: sc200-qz-22-10
    objective: "2.1.9"
    difficulty: 3
    status: draft
    type: dropdown
    stem:
      en: |
        Fabrikam onboarded all its Windows devices to Microsoft Defender for Endpoint. During a multi-stage incident, you suspect that attackers use stolen accounts to move laterally to devices that these accounts never used before.

        You need an advanced hunting query that returns, for each account, the devices that the account signed in to remotely or over the network during the last day and that it didn't sign in to during the previous 29 days.

        How should you complete the query? Select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Fabrikam a intégré tous ses appareils Windows à Microsoft Defender for Endpoint. Pendant un incident multi-étapes, vous soupçonnez des attaquants d'utiliser des comptes volés pour se déplacer latéralement vers des appareils que ces comptes n'avaient jamais utilisés.

        Vous avez besoin d'une requête de repérage avancé qui renvoie, pour chaque compte, les appareils auxquels le compte s'est connecté à distance ou par le réseau au cours du dernier jour et auxquels il ne s'est pas connecté pendant les 29 jours précédents.

        Comment devez-vous compléter la requête ? Sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: code
      language: kusto
      template: |
        let Baseline = DeviceLogonEvents
        | where Timestamp [[win]]
        | where ActionType == "LogonSuccess"
        | distinct AccountSid, DeviceName;
        DeviceLogonEvents
        | where Timestamp > ago(1d)
        | where ActionType == "LogonSuccess" and LogonType in ("RemoteInteractive", "Network")
        | join kind=[[kind]] Baseline on [[key]]
        | summarize NewDevices = make_set(DeviceName) by AccountName, AccountDomain, AccountSid
      slots:
        - id: win
          options:
            - { id: between, text: "between (ago(30d) .. ago(1d))" }
            - { id: gt30, text: "> ago(30d)" }
            - { id: lt30, text: "< ago(30d)" }
            - { id: gt1, text: "> ago(1d)" }
        - id: kind
          options:
            - { id: inner, text: inner }
            - { id: leftsemi, text: leftsemi }
            - { id: leftanti, text: leftanti }
            - { id: leftouter, text: leftouter }
        - id: key
          options:
            - { id: sid, text: AccountSid }
            - { id: device, text: DeviceName }
            - { id: both, text: "AccountSid, DeviceName" }
            - { id: report, text: ReportId }
    answer:
      values: { win: between, kind: leftanti, key: both }
    explanation:
      correct:
        en: |
          The baseline must cover the 29 days before the last day, so `between (ago(30d) .. ago(1d))` excludes the recent logons from it. `leftanti` keeps the rows of the last day that have no match in the baseline, and the match must be on the account and device pair, because a device is new only for a given account.
        fr: |
          La référence doit couvrir les 29 jours qui précèdent le dernier jour : `between (ago(30d) .. ago(1d))` en exclut les connexions récentes. `leftanti` garde les lignes du dernier jour sans correspondance dans la référence, et la correspondance doit porter sur le couple compte et appareil, car un appareil n'est nouveau que pour un compte donné.
      options:
        gt30: { en: "`> ago(30d)` includes the last day in the baseline, so every recent logon matches itself and the query returns nothing.", fr: "`> ago(30d)` inclut le dernier jour dans la référence : chaque connexion récente se correspond à elle-même et la requête ne renvoie rien." }
        leftsemi: { en: "`leftsemi` keeps the left rows that do match the baseline: the devices already used, the opposite of the requirement.", fr: "`leftsemi` garde les lignes de gauche qui correspondent à la référence : les appareils déjà utilisés, l'inverse de l'exigence." }
        inner: { en: "`inner` returns only matching rows from both sides, so it also returns the devices already used.", fr: "`inner` ne renvoie que les lignes correspondantes des deux côtés : il renvoie donc aussi les appareils déjà utilisés." }
        sid: { en: "Matching on the account alone drops every logon of an account that signed in anywhere during the baseline, even to a new device.", fr: "Une correspondance sur le seul compte élimine toutes les connexions d'un compte qui s'est connecté n'importe où pendant la référence, même vers un nouvel appareil." }
    references:
      - title: join operator
        url: https://learn.microsoft.com/en-us/kusto/query/join-operator
      - title: DeviceLogonEvents table in the advanced hunting schema - Microsoft Defender XDR
        url: https://learn.microsoft.com/en-us/defender-xdr/advanced-hunting-devicelogonevents-table
