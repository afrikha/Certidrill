chapter: 11-defender-settings
questions:
  # ------------------------------------------------------------------ 1
  - id: sc200-qz-11-01
    objective: "1.1.3"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Northwind Traders uses Microsoft Defender for Endpoint Plan 2. The security team must block access to every website of the Gambling category on the devices of the **Sales** device group. You plan to create the policy in **Settings > Endpoints > Rules**.

        Which advanced feature must be turned on first?
      fr: |
        Northwind Traders utilise Microsoft Defender for Endpoint Plan 2. L'équipe de sécurité doit bloquer l'accès à tous les sites web de la catégorie Gambling (jeux d'argent) sur les appareils du groupe d'appareils **Sales**. Vous prévoyez de créer la stratégie dans **Paramètres > Points de terminaison > Règles**.

        Quelle fonctionnalité avancée doit d'abord être activée ?
    body:
      options:
        - { id: a, text: Custom network indicators }
        - { id: b, text: Web content filtering }
        - { id: c, text: Device discovery }
        - { id: d, text: Microsoft Defender for Cloud Apps }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          Blocking websites by category is the job of web content filtering. Its advanced feature must be **On** (then **Save preferences**), after which you create a web content filtering policy that blocks the Gambling category and scope it to the Sales device group.
        fr: |
          Bloquer des sites web par catégorie est le rôle du filtrage du contenu web. Sa fonctionnalité avancée doit être activée (puis **Save preferences**) ; vous créez ensuite une stratégie de filtrage du contenu web qui bloque la catégorie Gambling et l'appliquez au groupe d'appareils Sales.
      options:
        a: { en: "Custom network indicators block individual IP addresses, URLs and domains that you list, not whole website categories.", fr: "Les indicateurs réseau personnalisés bloquent des adresses IP, des URL et des domaines que vous listez un par un, pas des catégories entières de sites web." }
        c: { en: "Device discovery uses onboarded devices to find unmanaged devices on the network; it doesn't block websites.", fr: "La découverte d'appareils utilise les appareils intégrés pour trouver les appareils non gérés du réseau ; elle ne bloque aucun site web." }
        d: { en: "This integration forwards endpoint signals to Defender for Cloud Apps for cloud app discovery; it doesn't filter website categories.", fr: "Cette intégration transmet les signaux des points de terminaison à Defender for Cloud Apps pour la découverte des applications cloud ; elle ne filtre pas les catégories de sites web." }
    references:
      - title: Web content filtering in Microsoft Defender for Endpoint
        url: https://learn.microsoft.com/en-us/defender-endpoint/web-content-filtering
      - title: Configure Advanced Features in Microsoft Defender for Endpoint
        url: https://learn.microsoft.com/en-us/defender-endpoint/advanced-features

  # ------------------------------------------------------------------ 2
  - id: sc200-qz-11-02
    objective: "1.1.5"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        On the domain controllers of Adatum Corporation, a custom data collection rule of Microsoft Defender for Endpoint records every DLL that processes load. A threat hunter must review these events in Microsoft Sentinel.

        Which table contains the events of this rule?
      fr: |
        Sur les contrôleurs de domaine d'Adatum Corporation, une règle de collecte de données personnalisée de Microsoft Defender for Endpoint enregistre chaque DLL que les processus chargent. Un chasseur de menaces doit examiner ces événements dans Microsoft Sentinel.

        Quelle table contient les événements de cette règle ?
    body:
      options:
        - { id: a, text: "`DeviceImageLoadEvents`" }
        - { id: b, text: "`DeviceCustomImageLoadEvents`" }
        - { id: c, text: "`DeviceCustomProcessEvents`" }
        - { id: d, text: "`DeviceCustomFileEvents`" }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          Custom data collection writes its events to five dedicated tables in the Sentinel workspace. DLL and image loads go to `DeviceCustomImageLoadEvents`, alongside the default telemetry, which the rule doesn't replace.
        fr: |
          La collecte de données personnalisée écrit ses événements dans cinq tables dédiées de l'espace de travail Sentinel. Les chargements de DLL et d'images vont dans `DeviceCustomImageLoadEvents`, en plus de la télémétrie par défaut, que la règle ne remplace pas.
      options:
        a: { en: "`DeviceImageLoadEvents` holds the default, filtered telemetry, not the events collected by custom rules.", fr: "`DeviceImageLoadEvents` contient la télémétrie par défaut, filtrée, pas les événements collectés par les règles personnalisées." }
        c: { en: "`DeviceCustomProcessEvents` stores process creation and termination events, not image loads.", fr: "`DeviceCustomProcessEvents` stocke les événements de création et d'arrêt de processus, pas les chargements d'images." }
        d: { en: "`DeviceCustomFileEvents` stores file creation, modification, deletion and access events.", fr: "`DeviceCustomFileEvents` stocke les événements de création, de modification, de suppression et d'accès aux fichiers." }
    references:
      - title: Custom data collection in Microsoft Defender for Endpoint
        url: https://learn.microsoft.com/en-us/defender-endpoint/custom-data-collection

  # ------------------------------------------------------------------ 3
  - id: sc200-qz-11-03
    objective: "1.1.2"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Contoso, Ltd. uses Microsoft Defender XDR. A new security policy states that the alerts raised by remote management tools must always be triaged by an analyst. You discover that a built-in alert tuning rule suppresses the alerts that one of these tools triggers.

        You need these alerts to appear in the alert queue again. The solution must minimize administrative effort.

        What should you do?
      fr: |
        Contoso, Ltd. utilise Microsoft Defender XDR. Une nouvelle politique de sécurité impose qu'un analyste trie toujours les alertes déclenchées par les outils d'administration à distance. Vous découvrez qu'une règle de réglage des alertes intégrée supprime les alertes que l'un de ces outils déclenche.

        Vous devez faire réapparaître ces alertes dans la file d'alertes. La solution doit réduire au minimum l'effort d'administration.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "On the Alert tuning page, open the built-in rule and select Disable.", fr: "Sur la page Alert tuning, ouvrir la règle intégrée et sélectionner Disable." } }
        - { id: b, text: { en: "Turn off the Automatically resolve alerts advanced feature of Defender for Endpoint.", fr: "Désactiver la fonctionnalité avancée Automatically resolve alerts de Defender for Endpoint." } }
        - { id: c, text: { en: "Create an alert tuning rule that uses the same conditions and the Set as behavior action.", fr: "Créer une règle de réglage des alertes avec les mêmes conditions et l'action Set as behavior." } }
        - { id: d, text: { en: "Set every device group to the Semi - require approval for all folders automation level.", fr: "Passer chaque groupe d'appareils au niveau d'automatisation Semi - require approval for all folders." } }
    answer: { optionId: a }
    explanation:
      correct:
        en: |
          Built-in alert tuning rules are listed on the Alert tuning page with the custom rules. Selecting a built-in rule opens its details pane, where **Disable** stops it from suppressing the matching alerts; nothing else needs to be created.
        fr: |
          Les règles de réglage des alertes intégrées sont listées sur la page Alert tuning avec les règles personnalisées. Sélectionner une règle intégrée ouvre son volet de détails, où **Disable** l'empêche de supprimer les alertes correspondantes ; rien d'autre n'est à créer.
      options:
        b: { en: "Automatically resolve alerts closes alerts after an automated investigation finds no threat; it doesn't control alert tuning rules.", fr: "Automatically resolve alerts ferme des alertes après qu'une enquête automatisée n'a trouvé aucune menace ; il ne pilote pas les règles de réglage des alertes." }
        c: { en: "Set as behavior turns the signals into behaviors that never appear in the alert queue: the opposite of the requirement.", fr: "Set as behavior transforme les signaux en comportements qui n'apparaissent jamais dans la file d'alertes : l'inverse de l'exigence." }
        d: { en: "The automation level decides whether remediation actions wait for approval; it has no effect on alert suppression.", fr: "Le niveau d'automatisation décide si les actions de correction attendent une approbation ; il n'a aucun effet sur la suppression des alertes." }
    references:
      - title: Investigate alerts in Microsoft Defender XDR
        url: https://learn.microsoft.com/en-us/defender-xdr/investigate-alerts

  # ------------------------------------------------------------------ 4
  - id: sc200-qz-11-04
    objective: "1.1.4"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Fabrikam, Inc. has onboarded its Windows 11 devices to Microsoft Defender for Endpoint Plan 2, with network protection in block mode and custom network indicators turned on. A phishing kit is hosted on `cdn-fabrikam-login.com` and on many of its subdomains, which change every day.

        You need to block the domain and all its current and future subdomains in every browser. The solution must minimize the number of indicators to maintain.

        What should you create?
      fr: |
        Fabrikam, Inc. a intégré ses appareils Windows 11 à Microsoft Defender for Endpoint Plan 2, avec la protection réseau en mode blocage et les indicateurs réseau personnalisés activés. Un kit d'hameçonnage est hébergé sur `cdn-fabrikam-login.com` et sur un grand nombre de ses sous-domaines, qui changent chaque jour.

        Vous devez bloquer le domaine et tous ses sous-domaines actuels et futurs dans tous les navigateurs. La solution doit réduire au minimum le nombre d'indicateurs à maintenir.

        Que devez-vous créer ?
    body:
      options:
        - { id: a, text: { en: "A URL indicator for `https://*.cdn-fabrikam-login.com/` with the Block execution action", fr: "Un indicateur d'URL pour `https://*.cdn-fabrikam-login.com/` avec l'action Block execution" } }
        - { id: b, text: { en: "An IP address indicator for the hosting provider's range, with the Block execution action", fr: "Un indicateur d'adresse IP pour la plage de l'hébergeur, avec l'action Block execution" } }
        - { id: c, text: { en: "A domain indicator for `cdn-fabrikam-login.com` with the Block execution action", fr: "Un indicateur de domaine pour `cdn-fabrikam-login.com` avec l'action Block execution" } }
        - { id: d, text: { en: "A web content filtering policy that blocks `cdn-fabrikam-login.com` for all device groups", fr: "Une stratégie de filtrage du contenu web qui bloque `cdn-fabrikam-login.com` pour tous les groupes d'appareils" } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          A domain indicator for `cdn-fabrikam-login.com` also matches every subdomain, such as `sub.cdn-fabrikam-login.com`, including the ones created later. Domain blocks are enforced in non-Microsoft browsers through network protection in block mode, so one indicator covers the requirement.
        fr: |
          Un indicateur de domaine pour `cdn-fabrikam-login.com` correspond aussi à tous ses sous-domaines, comme `sub.cdn-fabrikam-login.com`, y compris ceux créés plus tard. Les blocages de domaine s'appliquent dans les navigateurs non Microsoft grâce à la protection réseau en mode blocage : un seul indicateur couvre l'exigence.
      options:
        a: { en: "Indicators don't support wildcards, and an HTTPS URL path is matched only in Microsoft Edge.", fr: "Les indicateurs ne prennent pas en charge les caractères génériques, et un chemin d'URL HTTPS n'est reconnu que dans Microsoft Edge." }
        b: { en: "IP address indicators accept single addresses only: ranges and CIDR blocks aren't supported.", fr: "Les indicateurs d'adresse IP n'acceptent que des adresses uniques : les plages et les blocs CIDR ne sont pas pris en charge." }
        d: { en: "Web content filtering blocks website categories; blocking one specific domain is done with an indicator.", fr: "Le filtrage du contenu web bloque des catégories de sites web ; bloquer un domaine précis se fait avec un indicateur." }
    references:
      - title: Overview of indicators in Microsoft Defender for Endpoint
        url: https://learn.microsoft.com/en-us/defender-endpoint/indicators-overview
      - title: Create indicators for IPs and URLs/domains
        url: https://learn.microsoft.com/en-us/defender-endpoint/indicator-ip-domain

  # ------------------------------------------------------------------ 5
  - id: sc200-qz-11-05
    objective: "1.1.6"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Tailspin Toys manages its Windows 11 devices with both Group Policy and Microsoft Intune. A Group Policy object sets the ASR rule **Block executable content from email client and webmail** to Audit. Last week, you created an Intune endpoint security policy that sets the same rule to Block and assigned it to a device group that contains all the devices. The rule still runs in Audit mode.

        You need the Intune settings to take precedence over the conflicting Group Policy settings. You must not modify the Group Policy object.

        What should you do?
      fr: |
        Tailspin Toys gère ses appareils Windows 11 à la fois par stratégie de groupe et par Microsoft Intune. Un objet de stratégie de groupe définit la règle ASR **Block executable content from email client and webmail** sur Audit. La semaine dernière, vous avez créé une stratégie de sécurité des points de terminaison Intune qui définit la même règle sur Block et l'avez attribuée à un groupe d'appareils qui contient tous les appareils. La règle s'exécute toujours en mode Audit.

        Vous devez faire en sorte que les paramètres Intune l'emportent sur les paramètres de stratégie de groupe en conflit. Vous ne devez pas modifier l'objet de stratégie de groupe.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Run Set-MpPreference on each device to set the rule to Enabled.", fr: "Exécuter Set-MpPreference sur chaque appareil pour définir la règle sur Enabled." } }
        - { id: b, text: { en: "Assign the Intune policy to a user group that contains the device owners.", fr: "Attribuer la stratégie Intune à un groupe d'utilisateurs qui contient les propriétaires des appareils." } }
        - { id: c, text: { en: "Set the rule to Warn in the Intune policy so that users confirm the block.", fr: "Définir la règle sur Warn dans la stratégie Intune pour que les utilisateurs confirment le blocage." } }
        - { id: d, text: { en: "Deploy an Intune custom profile that sets MDMWinsOverGP to 1 on the devices.", fr: "Déployer un profil personnalisé Intune qui définit MDMWinsOverGP sur 1 sur les appareils." } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          By default, Group Policy wins over MDM when the same ASR rule is configured by both. Setting the `MDMWinsOverGP` policy (ControlPolicyConflict Policy CSP) to 1, through a custom OMA-URI profile in Intune, makes the MDM setting win and blocks the conflicting Group Policy setting.
        fr: |
          Par défaut, la stratégie de groupe l'emporte sur la MDM quand la même règle ASR est configurée par les deux. Définir la stratégie `MDMWinsOverGP` (Policy CSP ControlPolicyConflict) sur 1, par un profil OMA-URI personnalisé dans Intune, fait l'emporter le paramètre MDM et bloque le paramètre de stratégie de groupe en conflit.
      options:
        a: { en: "Local PowerShell settings have the lowest precedence and are overwritten by Group Policy and MDM.", fr: "Les paramètres PowerShell locaux ont la priorité la plus basse et sont écrasés par la stratégie de groupe et la MDM." }
        b: { en: "ASR policies apply to device groups; changing the assignment doesn't change which source wins a conflict.", fr: "Les stratégies ASR s'appliquent à des groupes d'appareils ; changer l'attribution ne change pas la source qui l'emporte en cas de conflit." }
        c: { en: "Any value set by Intune still loses to Group Policy while MDMWinsOverGP keeps its default value of 0.", fr: "Toute valeur définie par Intune perd toujours face à la stratégie de groupe tant que MDMWinsOverGP garde sa valeur par défaut de 0." }
    references:
      - title: Configure ASR rules and exclusions
        url: https://learn.microsoft.com/en-us/defender-endpoint/enable-attack-surface-reduction

  # ------------------------------------------------------------------ 6
  - id: sc200-qz-11-06
    objective: "1.1.2"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        Litware, Inc. uses Microsoft Defender XDR with Microsoft Defender for Endpoint and Microsoft Defender for Identity. The SOC has configured the following:

        - A custom detection rule named **CD-Rclone** that raises an alert when `rclone.exe` uploads data to the internet.
        - The built-in alert tuning rules, all enabled.
        - A custom alert tuning rule named **TR-Backup**, with the Microsoft Defender for Endpoint service source, conditions on the process of the backup agent, and the **Hide alert** action.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Litware, Inc. utilise Microsoft Defender XDR avec Microsoft Defender for Endpoint et Microsoft Defender for Identity. Le SOC a configuré les éléments suivants :

        - Une règle de détection personnalisée nommée **CD-Rclone** qui déclenche une alerte quand `rclone.exe` charge des données vers Internet.
        - Les règles de réglage des alertes intégrées, toutes activées.
        - Une règle de réglage des alertes personnalisée nommée **TR-Backup**, avec la source de service Microsoft Defender for Endpoint, des conditions sur le processus de l'agent de sauvegarde et l'action **Hide alert**.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text: { en: "If the activity detected by CD-Rclone also matches a built-in alert tuning rule, the CD-Rclone alert is suppressed.", fr: "Si l'activité détectée par CD-Rclone correspond aussi à une règle de réglage des alertes intégrée, l'alerte CD-Rclone est supprimée." }
        - id: s2
          text: { en: "When a built-in alert tuning rule suppresses an alert, automated investigation can still examine the activity, and the alert is reactivated if malicious activity is found.", fr: "Quand une règle de réglage des alertes intégrée supprime une alerte, l'enquête automatisée peut toujours examiner l'activité, et l'alerte est réactivée si une activité malveillante est trouvée." }
        - id: s3
          text: { en: "If you add Microsoft Defender for Identity as a service source of TR-Backup, the rule also hides the matching Defender for Identity alerts.", fr: "Si vous ajoutez Microsoft Defender for Identity comme source de service de TR-Backup, la règle masque aussi les alertes Defender for Identity correspondantes." }
    answer:
      values: { s1: false, s2: true, s3: false }
    explanation:
      correct:
        en: |
          Built-in alert tuning rules don't apply to alerts from custom detection rules or custom threat intelligence, so CD-Rclone alerts are never suppressed by them. Built-in rules suppress alerts without affecting automated investigations and email notifications, and a suppressed alert is reactivated when the investigation detects malicious or suspicious activity. The Hide alert action applies only to Defender for Endpoint alerts.
        fr: |
          Les règles de réglage des alertes intégrées ne s'appliquent pas aux alertes des règles de détection personnalisées ni du renseignement sur les menaces personnalisé : les alertes CD-Rclone ne sont donc jamais supprimées par elles. Les règles intégrées suppriment des alertes sans affecter les enquêtes automatisées ni les notifications par e-mail, et une alerte supprimée est réactivée quand l'enquête détecte une activité malveillante ou suspecte. L'action Hide alert ne s'applique qu'aux alertes Defender for Endpoint.
      options:
        s1: { en: "Custom detection alerts are outside the scope of the built-in tuning rules.", fr: "Les alertes des détections personnalisées sont hors du champ des règles de réglage intégrées." }
        s3: { en: "Hide alert works only for Defender for Endpoint alerts; for other sources, use Resolve alert.", fr: "Hide alert ne fonctionne que pour les alertes Defender for Endpoint ; pour les autres sources, utilisez Resolve alert." }
    references:
      - title: Investigate alerts in Microsoft Defender XDR
        url: https://learn.microsoft.com/en-us/defender-xdr/investigate-alerts

  # ------------------------------------------------------------------ 7
  - id: sc200-qz-11-07
    objective: "1.1.1"
    difficulty: 3
    status: draft
    type: dropdown
    stem:
      en: |
        Contoso, Ltd. uses Microsoft Defender XDR and Microsoft Defender for Endpoint with role-based access control (RBAC). The device groups are **DG-Finance**, **DG-HR** and **DG-Servers**. The following incident email notification rules exist:

        | Rule | Device group scope | Recipient |
        | --- | --- | --- |
        | NR-Fin | DG-Finance | finsec@contoso.com |
        | NR-Office | DG-Finance, DG-HR | soc@contoso.com |

        An analyst named Analyst1 has a role that includes the **Manage security settings** permission and is linked only to DG-HR.

        The finance devices are moved to a new device group, and you delete DG-Finance.

        What is the result of the deletion? Select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Contoso, Ltd. utilise Microsoft Defender XDR et Microsoft Defender for Endpoint avec le contrôle d'accès en fonction du rôle (RBAC). Les groupes d'appareils sont **DG-Finance**, **DG-HR** et **DG-Servers**. Les règles de notification par e-mail d'incident suivantes existent :

        | Règle | Étendue des groupes d'appareils | Destinataire |
        | --- | --- | --- |
        | NR-Fin | DG-Finance | finsec@contoso.com |
        | NR-Office | DG-Finance, DG-HR | soc@contoso.com |

        Un analyste nommé Analyst1 dispose d'un rôle qui inclut l'autorisation **Manage security settings** et qui est lié uniquement à DG-HR.

        Les appareils finance sont déplacés vers un nouveau groupe d'appareils, et vous supprimez DG-Finance.

        Quel est le résultat de la suppression ? Sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: text
      template:
        en: |
          NR-Fin: [[fin]]

          NR-Office: [[office]]

          Analyst1, for NR-Office: [[an]]
        fr: |
          NR-Fin : [[fin]]

          NR-Office : [[office]]

          Analyst1, pour NR-Office : [[an]]
      slots:
        - id: fin
          options:
            - { id: del, text: { en: "The rule is deleted.", fr: "La règle est supprimée." } }
            - { id: kept, text: { en: "The rule is kept, with no device group, and sends no email.", fr: "La règle est conservée, sans groupe d'appareils, et n'envoie aucun e-mail." } }
            - { id: all, text: { en: "The rule now applies to all device groups.", fr: "La règle s'applique désormais à tous les groupes d'appareils." } }
        - id: office
          options:
            - { id: hr, text: { en: "The rule applies only to DG-HR.", fr: "La règle s'applique uniquement à DG-HR." } }
            - { id: del, text: { en: "The rule is deleted.", fr: "La règle est supprimée." } }
            - { id: all, text: { en: "The rule now applies to all device groups.", fr: "La règle s'applique désormais à tous les groupes d'appareils." } }
        - id: an
          options:
            - { id: edit, text: { en: "can now edit and delete the rule.", fr: "peut désormais modifier et supprimer la règle." } }
            - { id: owner, text: { en: "still can't edit it, because another user created it.", fr: "ne peut toujours pas la modifier, car un autre utilisateur l'a créée." } }
            - { id: global, text: { en: "still can't edit it, because only a Global Administrator can.", fr: "ne peut toujours pas la modifier, car seul un Global Administrator le peut." } }
    answer:
      values: { fin: del, office: hr, an: edit }
    explanation:
      correct:
        en: |
          Deleting a device group removes it from the email notification rules that use it, and a rule whose only group was the deleted one is deleted with it: NR-Fin disappears and NR-Office keeps DG-HR only. With RBAC, users create, edit and delete only the notification rules limited to the device groups they're allowed to manage. NR-Office now covers only DG-HR, so Analyst1 can manage it, which wasn't the case while it included DG-Finance.
        fr: |
          Supprimer un groupe d'appareils le retire des règles de notification par e-mail qui l'utilisent, et une règle dont c'était le seul groupe est supprimée avec lui : NR-Fin disparaît et NR-Office ne garde que DG-HR. Avec RBAC, les utilisateurs ne créent, ne modifient et ne suppriment que les règles de notification limitées aux groupes d'appareils qu'ils sont autorisés à gérer. NR-Office ne couvre plus que DG-HR : Analyst1 peut donc la gérer, ce qui n'était pas le cas tant qu'elle incluait DG-Finance.
      options:
        kept: { en: "A rule left with no device group isn't kept: it's deleted with the group.", fr: "Une règle qui n'a plus de groupe d'appareils n'est pas conservée : elle est supprimée avec le groupe." }
        all: { en: "Removing a group never widens a rule to all device groups, which would notify recipients about devices they weren't meant to see.", fr: "Retirer un groupe n'élargit jamais une règle à tous les groupes d'appareils, ce qui notifierait des destinataires sur des appareils qu'ils ne devaient pas voir." }
        global: { en: "The Global Administrator restriction applies to rules configured for all device groups, not to a rule scoped to DG-HR.", fr: "La restriction au Global Administrator vise les règles configurées pour tous les groupes d'appareils, pas une règle limitée à DG-HR." }
    references:
      - title: Create and manage device groups in Microsoft Defender for Endpoint
        url: https://learn.microsoft.com/en-us/defender-endpoint/machine-groups
      - title: Get incident notifications by email
        url: https://learn.microsoft.com/en-us/defender-xdr/m365d-notifications-incidents

  # ------------------------------------------------------------------ 8
  - id: sc200-qz-11-08
    objective: "1.1.4"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        Adatum Corporation uses Microsoft Defender for Endpoint Plan 2 on Windows 11 devices. Microsoft Defender Antivirus runs in active mode with cloud-based protection and behavior monitoring, file hash computation is enabled, and the Allow or block file advanced feature is on. A Microsoft Defender Antivirus exclusion exists for the folder **D:\Tools**.

        During an incident, you identify the following files used by the attacker. For each file, you create a file indicator on its SHA-256 hash with the **Block execution** action, scoped to all devices.

        Which two files will the indicators prevent from running?

        NOTE: Each correct selection is worth one point.
      fr: |
        Adatum Corporation utilise Microsoft Defender for Endpoint Plan 2 sur des appareils Windows 11. L'Antivirus Microsoft Defender s'exécute en mode actif avec la protection cloud et la surveillance du comportement, le calcul du hachage des fichiers est activé, et la fonctionnalité avancée Allow or block file est activée. Une exclusion de l'Antivirus Microsoft Defender existe pour le dossier **D:\Tools**.

        Pendant un incident, vous identifiez les fichiers suivants utilisés par l'attaquant. Pour chaque fichier, vous créez un indicateur de fichier sur son hachage SHA-256 avec l'action **Block execution**, appliqué à tous les appareils.

        Quels sont les deux fichiers dont les indicateurs empêcheront l'exécution ?

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "`C:\\Users\\Public\\loader.dll`, an unsigned DLL", fr: "`C:\\Users\\Public\\loader.dll`, une DLL non signée" } }
        - { id: b, text: { en: "`C:\\Windows\\System32\\certutil.exe`, which the attacker uses to download payloads", fr: "`C:\\Windows\\System32\\certutil.exe`, que l'attaquant utilise pour télécharger des charges utiles" } }
        - { id: c, text: { en: "`C:\\Users\\Public\\stage1.ps1`, a PowerShell script", fr: "`C:\\Users\\Public\\stage1.ps1`, un script PowerShell" } }
        - { id: d, text: { en: "`D:\\Tools\\sync.exe`, an unsigned executable", fr: "`D:\\Tools\\sync.exe`, un exécutable non signé" } }
        - { id: e, text: { en: "`C:\\ProgramData\\Upd\\updsvc.exe`, an unsigned executable", fr: "`C:\\ProgramData\\Upd\\updsvc.exe`, un exécutable non signé" } }
    answer: { optionIds: [a, e] }
    explanation:
      correct:
        en: |
          On Windows, file indicators support portable executable (PE) files only, such as `.exe` and `.dll`. With Defender Antivirus active, cloud-based protection and the Allow or block file feature, the indicators block `loader.dll` and `updsvc.exe`, which no exclusion covers.
        fr: |
          Sous Windows, les indicateurs de fichier ne prennent en charge que les fichiers exécutables portables (PE), comme `.exe` et `.dll`. Avec l'Antivirus Defender actif, la protection cloud et la fonctionnalité Allow or block file, les indicateurs bloquent `loader.dll` et `updsvc.exe`, qu'aucune exclusion ne couvre.
      options:
        b: { en: "certutil.exe is signed by Microsoft, and Microsoft-signed apps can't be blocked by Defender indicators.", fr: "certutil.exe est signé par Microsoft, et les applications signées par Microsoft ne peuvent pas être bloquées par les indicateurs Defender." }
        c: { en: "A PowerShell script isn't a PE file; on Windows, file indicators apply only to PE files.", fr: "Un script PowerShell n'est pas un fichier PE ; sous Windows, les indicateurs de fichier ne s'appliquent qu'aux fichiers PE." }
        d: { en: "File indicators don't override Microsoft Defender Antivirus exclusions: an excluded file is allowed before the indicator is evaluated.", fr: "Les indicateurs de fichier ne l'emportent pas sur les exclusions de l'Antivirus Microsoft Defender : un fichier exclu est autorisé avant que l'indicateur ne soit évalué." }
    references:
      - title: Create indicators for files
        url: https://learn.microsoft.com/en-us/defender-endpoint/indicator-file
      - title: Overview of indicators in Microsoft Defender for Endpoint
        url: https://learn.microsoft.com/en-us/defender-endpoint/indicators-overview

  # ------------------------------------------------------------------ 9
  - id: sc200-qz-11-09
    objective: "1.1.5"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        Wingtip Toys uses Microsoft Defender for Endpoint Plan 2 and has two Microsoft Sentinel workspaces connected to the Microsoft Defender portal: **WS-SOC**, which is selected on the **Workspace scope** page of custom data collection, and **WS-Audit**. Asset rule management applies the dynamic tag **AdminHosts** to the following devices, which run an up-to-date Defender for Endpoint client:

        | Device | Operating system |
        | --- | --- |
        | ADM1 | Windows 10 22H2, enrolled in Extended Security Updates (ESU) |
        | ADM2 | Windows Server 2016 |
        | ADM3 | Windows Server 2022 |

        You create a custom data collection rule named **CDC-Proc** on the `DeviceCustomProcessEvents` table, scoped to the AdminHosts tag.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Wingtip Toys utilise Microsoft Defender for Endpoint Plan 2 et dispose de deux espaces de travail Microsoft Sentinel connectés au portail Microsoft Defender : **WS-SOC**, sélectionné sur la page **Workspace scope** de la collecte de données personnalisée, et **WS-Audit**. Asset rule management applique l'étiquette dynamique **AdminHosts** aux appareils suivants, qui exécutent un client Defender for Endpoint à jour :

        | Appareil | Système d'exploitation |
        | --- | --- |
        | ADM1 | Windows 10 22H2, inscrit aux mises à jour de sécurité étendues (ESU) |
        | ADM2 | Windows Server 2016 |
        | ADM3 | Windows Server 2022 |

        Vous créez une règle de collecte de données personnalisée nommée **CDC-Proc** sur la table `DeviceCustomProcessEvents`, appliquée à l'étiquette AdminHosts.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text: { en: "CDC-Proc collects process events from ADM1.", fr: "CDC-Proc collecte des événements de processus sur ADM1." }
        - id: s2
          text: { en: "CDC-Proc collects process events from ADM2.", fr: "CDC-Proc collecte des événements de processus sur ADM2." }
        - id: s3
          text: { en: "You can create a second rule that sends the script events of the same devices to WS-Audit while CDC-Proc keeps sending its events to WS-SOC.", fr: "Vous pouvez créer une seconde règle qui envoie les événements de script des mêmes appareils à WS-Audit pendant que CDC-Proc continue d'envoyer ses événements à WS-SOC." }
    answer:
      values: { s1: true, s2: false, s3: false }
    explanation:
      correct:
        en: |
          Custom data collection supports Windows 10 and 11 (Windows 10 must be enrolled in ESU) and Windows Server 2019 and later, so ADM1 and ADM3 send events but ADM2, on Windows Server 2016, doesn't. Custom data collection is limited to one Microsoft Sentinel workspace per tenant: every rule sends its events to the workspace selected on the Workspace scope page.
        fr: |
          La collecte de données personnalisée prend en charge Windows 10 et 11 (Windows 10 doit être inscrit aux ESU) et Windows Server 2019 et versions ultérieures : ADM1 et ADM3 envoient des événements, mais pas ADM2, sous Windows Server 2016. La collecte de données personnalisée est limitée à un seul espace de travail Microsoft Sentinel par locataire : toutes les règles envoient leurs événements à l'espace sélectionné sur la page Workspace scope.
      options:
        s2: { en: "Windows Server 2016 isn't a supported operating system for custom data collection; the tag alone doesn't make it collect.", fr: "Windows Server 2016 n'est pas un système d'exploitation pris en charge par la collecte de données personnalisée ; l'étiquette seule ne le fait pas collecter." }
        s3: { en: "Rules can't target different workspaces: custom data collection uses a single Sentinel workspace per tenant.", fr: "Les règles ne peuvent pas cibler des espaces de travail différents : la collecte de données personnalisée utilise un seul espace Sentinel par locataire." }
    references:
      - title: Create and manage custom data collection rules in Microsoft Defender for Endpoint
        url: https://learn.microsoft.com/en-us/defender-endpoint/create-custom-data-collection-rules

  # ------------------------------------------------------------------ 10
  - id: sc200-qz-11-10
    objective: "1.1.6"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        Fabrikam, Inc. has a Windows 11 test device named **LAB-07** that is onboarded to Microsoft Defender for Endpoint. No Intune, Configuration Manager or Group Policy setting configures ASR rules on LAB-07. The following ASR rules were configured locally by using PowerShell:

        | Rule | Mode |
        | --- | --- |
        | Block all Office applications from creating child processes | Block |
        | Block process creations originating from PSExec and WMI commands | Audit |

        An administrator then runs the following commands on LAB-07. The GUID `be9ba2d9-53ea-4cdc-84e5-9b1eeee46550` identifies the rule **Block executable content from email client and webmail**.

        ```powershell
        Set-MpPreference -AttackSurfaceReductionRules_Ids be9ba2d9-53ea-4cdc-84e5-9b1eeee46550 -AttackSurfaceReductionRules_Actions Warn
        Add-MpPreference -AttackSurfaceReductionOnlyExclusions "C:\Tools\Packager\pack.exe"
        ```

        Which two statements describe the configuration of LAB-07 after the commands?

        NOTE: Each correct selection is worth one point.
      fr: |
        Fabrikam, Inc. dispose d'un appareil de test Windows 11 nommé **LAB-07**, intégré à Microsoft Defender for Endpoint. Aucun paramètre Intune, Configuration Manager ou de stratégie de groupe ne configure de règles ASR sur LAB-07. Les règles ASR suivantes ont été configurées localement avec PowerShell :

        | Règle | Mode |
        | --- | --- |
        | Block all Office applications from creating child processes | Block |
        | Block process creations originating from PSExec and WMI commands | Audit |

        Un administrateur exécute ensuite les commandes suivantes sur LAB-07. Le GUID `be9ba2d9-53ea-4cdc-84e5-9b1eeee46550` identifie la règle **Block executable content from email client and webmail**.

        ```powershell
        Set-MpPreference -AttackSurfaceReductionRules_Ids be9ba2d9-53ea-4cdc-84e5-9b1eeee46550 -AttackSurfaceReductionRules_Actions Warn
        Add-MpPreference -AttackSurfaceReductionOnlyExclusions "C:\Tools\Packager\pack.exe"
        ```

        Quelles sont les deux affirmations qui décrivent la configuration de LAB-07 après ces commandes ?

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "Block executable content from email client and webmail runs in Warn mode, and users can bypass its block.", fr: "Block executable content from email client and webmail s'exécute en mode Warn, et les utilisateurs peuvent contourner son blocage." } }
        - { id: b, text: { en: "The first command fails because Block executable content from email client and webmail doesn't support Warn.", fr: "La première commande échoue, car Block executable content from email client and webmail ne prend pas en charge Warn." } }
        - { id: c, text: { en: "The Office child process rule and the PSExec and WMI rule are no longer configured on LAB-07.", fr: "La règle sur les processus enfants Office et la règle PSExec et WMI ne sont plus configurées sur LAB-07." } }
        - { id: d, text: { en: "pack.exe is excluded only from Block executable content from email client and webmail.", fr: "pack.exe n'est exclu que de Block executable content from email client and webmail." } }
        - { id: e, text: { en: "pack.exe is also excluded from Microsoft Defender Antivirus scans.", fr: "pack.exe est aussi exclu des analyses de l'Antivirus Microsoft Defender." } }
    answer: { optionIds: [a, c] }
    explanation:
      correct:
        en: |
          `Set-MpPreference` overwrites the whole list of ASR rules and modes, so after the first command only the email client rule is configured, in Warn mode, which blocks but lets the user bypass the block. `Add-MpPreference` would have added the rule without changing the others. The second command adds a global ASR exclusion.
        fr: |
          `Set-MpPreference` écrase toute la liste des règles ASR et de leurs modes : après la première commande, seule la règle sur le client de messagerie est configurée, en mode Warn, qui bloque mais laisse l'utilisateur contourner le blocage. `Add-MpPreference` aurait ajouté la règle sans modifier les autres. La seconde commande ajoute une exclusion ASR globale.
      options:
        b: { en: "Only two rules don't support Warn: the LSASS credential stealing rule and the Office code injection rule.", fr: "Seules deux règles ne prennent pas en charge Warn : la règle sur le vol d'identifiants LSASS et celle sur l'injection de code par Office." }
        d: { en: "AttackSurfaceReductionOnlyExclusions is a global exclusion that applies to every ASR rule; per-rule exclusions are configured separately.", fr: "AttackSurfaceReductionOnlyExclusions est une exclusion globale qui s'applique à toutes les règles ASR ; les exclusions par règle se configurent à part." }
        e: { en: "This setting excludes the file from ASR rules only; antivirus exclusions are a different setting.", fr: "Ce paramètre exclut le fichier des règles ASR uniquement ; les exclusions antivirus sont un autre paramètre." }
    references:
      - title: Configure ASR rules and exclusions
        url: https://learn.microsoft.com/en-us/defender-endpoint/enable-attack-surface-reduction
      - title: ASR rules reference
        url: https://learn.microsoft.com/en-us/defender-endpoint/attack-surface-reduction-rules-reference
