chapter: 23-endpoint-response
questions:
  # ------------------------------------------------------------------ 1
  - id: sc200-qz-23-01
    objective: "2.2.1"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        You investigate the timeline of a device named **WS-HR-04** in the Microsoft Defender portal. The timeline shows thousands of events for the past 30 days.

        You need the timeline to display only the MITRE ATT&CK techniques that Microsoft Defender for Endpoint inferred from these events.

        What should you do?
      fr: |
        Vous analysez la chronologie d'un appareil nommé **WS-HR-04** dans le portail Microsoft Defender. La chronologie affiche des milliers d'événements pour les 30 derniers jours.

        Vous devez faire afficher par la chronologie uniquement les techniques MITRE ATT&CK que Microsoft Defender for Endpoint a déduites de ces événements.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Select Filters, choose the Techniques data type, and select Apply.", fr: "Sélectionner Filters, choisir le type de données Techniques, puis sélectionner Apply." } }
        - { id: b, text: { en: "Select Filters, turn on Flagged events, and select Apply.", fr: "Sélectionner Filters, activer Flagged events, puis sélectionner Apply." } }
        - { id: c, text: { en: "Select one event, and then select Hunt for related events.", fr: "Sélectionner un événement, puis sélectionner Hunt for related events." } }
        - { id: d, text: { en: "Select Customize columns, and add the Additional information column.", fr: "Sélectionner Customize columns, puis ajouter la colonne Additional information." } }
    answer: { optionId: a }
    explanation:
      correct:
        en: |
          The Data type filter of the device timeline shows either events or techniques. Choosing Techniques keeps only the MITRE ATT&CK techniques, which appear in bold with a blue icon and carry their ATT&CK ID and name as tags.
        fr: |
          Le filtre Data type de la chronologie de l'appareil affiche soit les événements, soit les techniques. Choisir Techniques ne garde que les techniques MITRE ATT&CK, qui apparaissent en gras avec une icône bleue et portent leur ID et leur nom ATT&CK sous forme d'étiquettes.
      options:
        b: { en: "Flagged events shows only the events that an analyst flagged, not the techniques.", fr: "Flagged events n'affiche que les événements qu'un analyste a marqués d'un indicateur, pas les techniques." }
        c: { en: "Hunt for related events opens an advanced hunting query on the events around the selected event; it doesn't filter the timeline.", fr: "Hunt for related events ouvre une requête de repérage avancé sur les événements proches de l'événement sélectionné ; il ne filtre pas la chronologie." }
        d: { en: "Customizing columns changes the information displayed for each row, but every event stays in the timeline.", fr: "Personnaliser les colonnes change les informations affichées pour chaque ligne, mais tous les événements restent dans la chronologie." }
    references:
      - title: Investigate devices in Microsoft Defender for Endpoint
        url: https://learn.microsoft.com/en-us/defender-endpoint/device-timeline-event-flag

  # ------------------------------------------------------------------ 2
  - id: sc200-qz-23-02
    objective: "2.2.3"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        An alert involves a script file named **update.vbs** that was observed on a Windows 11 device four days ago. On the file page, **Download file** isn't offered, because Microsoft Defender for Endpoint doesn't already store a copy of the file.

        You need to obtain a copy of update.vbs for analysis. Which action should you use on the file page?
      fr: |
        Une alerte concerne un fichier de script nommé **update.vbs** observé sur un appareil Windows 11 il y a quatre jours. Sur la page du fichier, **Download file** n'est pas proposé, car Microsoft Defender for Endpoint ne stocke pas déjà une copie du fichier.

        Vous devez obtenir une copie d'update.vbs pour l'analyser. Quelle action devez-vous utiliser sur la page du fichier ?
    body:
      options:
        - { id: a, text: Submit for deep analysis }
        - { id: b, text: Stop and quarantine file }
        - { id: c, text: Collect file }
        - { id: d, text: Add indicator }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          Collect file appears on the file page when the file isn't already stored by Defender for Endpoint: it retrieves the file from a device where it was observed, and the copy is then downloaded as a password-protected zip archive. The action is available because the file was seen in the last 30 days.
        fr: |
          Collect file apparaît sur la page du fichier quand Defender for Endpoint ne stocke pas déjà le fichier : il récupère le fichier depuis un appareil où il a été observé, et la copie se télécharge ensuite dans une archive zip protégée par mot de passe. L'action est disponible parce que le fichier a été vu au cours des 30 derniers jours.
      options:
        a: { en: "Deep analysis supports only PE files such as .exe and .dll, and it returns a behavior report, not a copy of the file.", fr: "L'analyse approfondie ne prend en charge que les fichiers PE comme .exe et .dll, et elle renvoie un rapport de comportement, pas une copie du fichier." }
        b: { en: "Stop and quarantine file stops the processes and quarantines the file on the devices; it gives you no copy to analyze.", fr: "Stop and quarantine file arrête les processus et met le fichier en quarantaine sur les appareils ; il ne vous donne aucune copie à analyser." }
        d: { en: "An indicator blocks or allows the file hash from then on; it doesn't retrieve the file.", fr: "Un indicateur bloque ou autorise le hachage du fichier à partir de ce moment ; il ne récupère pas le fichier." }
    references:
      - title: Take response actions on a file in Microsoft Defender for Endpoint
        url: https://learn.microsoft.com/en-us/defender-endpoint/respond-file-alerts

  # ------------------------------------------------------------------ 3
  - id: sc200-qz-23-03
    objective: "2.2.2"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Litware's Windows Server 2022 servers are onboarded to Microsoft Defender for Endpoint. A non-Microsoft antivirus protects them, and Microsoft Defender Antivirus runs in passive mode.

        After an alert on the server **SRV-APP-03**, you need a full Microsoft Defender Antivirus scan of the server, started from the Defender portal. The antivirus configuration of the server must not change.

        What should you do?
      fr: |
        Les serveurs Windows Server 2022 de Litware sont intégrés à Microsoft Defender for Endpoint. Un antivirus non-Microsoft les protège, et l'Antivirus Microsoft Defender fonctionne en mode passif.

        Après une alerte sur le serveur **SRV-APP-03**, vous avez besoin d'une analyse complète de l'Antivirus Microsoft Defender sur ce serveur, lancée depuis le portail Defender. La configuration antivirus du serveur ne doit pas changer.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Select Initiate automated investigation on the device page of SRV-APP-03.", fr: "Sélectionner Initiate automated investigation sur la page de l'appareil SRV-APP-03." } }
        - { id: b, text: { en: "Switch Microsoft Defender Antivirus to active mode, and then scan from the device page.", fr: "Passer l'Antivirus Microsoft Defender en mode actif, puis lancer l'analyse depuis la page de l'appareil." } }
        - { id: c, text: { en: "Open a live response session on SRV-APP-03, and then run the scan command.", fr: "Ouvrir une session de réponse dynamique sur SRV-APP-03, puis exécuter la commande scan." } }
        - { id: d, text: { en: "Select Run antivirus scan on the device page of SRV-APP-03, and choose a full scan.", fr: "Sélectionner Run antivirus scan sur la page de l'appareil SRV-APP-03, puis choisir une analyse complète." } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          Run antivirus scan starts a quick or full Microsoft Defender Antivirus scan from the device page. The scan can run alongside another antivirus solution, whether Defender Antivirus is the active antivirus or runs in passive mode, so nothing has to change on the server.
        fr: |
          Run antivirus scan lance une analyse rapide ou complète de l'Antivirus Microsoft Defender depuis la page de l'appareil. L'analyse peut s'exécuter à côté d'une autre solution antivirus, que l'Antivirus Defender soit l'antivirus actif ou en mode passif : rien ne doit changer sur le serveur.
      options:
        a: { en: "An automated investigation examines the alerts and the evidence of the device; it isn't a full antivirus scan that you control.", fr: "Une enquête automatisée examine les alertes et les preuves de l'appareil ; ce n'est pas une analyse antivirus complète que vous contrôlez." }
        b: { en: "Active mode isn't required for this action, and switching modes changes the antivirus configuration of the server.", fr: "Le mode actif n'est pas requis pour cette action, et changer de mode modifie la configuration antivirus du serveur." }
        c: { en: "The live response scan command exists on macOS and Linux only, not on Windows devices.", fr: "La commande scan de la réponse dynamique n'existe que sous macOS et Linux, pas sur les appareils Windows." }
    references:
      - title: Take response actions on a device in Microsoft Defender for Endpoint
        url: https://learn.microsoft.com/en-us/defender-endpoint/respond-machine-alerts
      - title: Investigate entities on devices using live response in Microsoft Defender for Endpoint
        url: https://learn.microsoft.com/en-us/defender-endpoint/live-response

  # ------------------------------------------------------------------ 4
  - id: sc200-qz-23-04
    objective: "2.2.4"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        During a human-operated attack at Contoso, automatic attack disruption disabled the Active Directory account **rlee** through Microsoft Defender for Identity. The incident has the Attack Disruption tag.

        You completed the investigation, reset the credentials of rlee and removed the attacker's persistence. You need rlee to be able to sign in again.

        What should you do in the Microsoft Defender portal?
      fr: |
        Pendant une attaque menée par des opérateurs humains chez Contoso, l'interruption automatique d'attaque a désactivé le compte Active Directory **rlee** par l'intermédiaire de Microsoft Defender pour Identity. L'incident porte la balise Attack Disruption.

        Vous avez terminé l'enquête, réinitialisé les informations d'identification de rlee et supprimé la persistance de l'attaquant. Vous devez permettre à rlee de se reconnecter.

        Que devez-vous faire dans le portail Microsoft Defender ?
    body:
      options:
        - { id: a, text: { en: "In the incident graph, select rlee, and then select Release from containment.", fr: "Dans le graphe de l'incident, sélectionner rlee, puis Release from containment." } }
        - { id: b, text: { en: "In the incident graph, select rlee, and then select Enable user.", fr: "Dans le graphe de l'incident, sélectionner rlee, puis Enable user." } }
        - { id: c, text: { en: "In the Automated response settings of Defender XDR, add rlee as an excluded user.", fr: "Dans les paramètres Automated response de Defender XDR, ajouter rlee comme utilisateur exclu." } }
        - { id: d, text: { en: "Set the automation level of every device group to No automated response.", fr: "Définir le niveau d'automatisation de chaque groupe d'appareils sur No automated response." } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          To undo a disruption action on an account, select the account in the incident graph and select Enable user; the same release is available from the action details pane in the Action center. Releasing only after the investigation and the cleanup prevents the attacker from resuming the attack.
        fr: |
          Pour annuler une action d'interruption sur un compte, sélectionnez le compte dans le graphe de l'incident, puis Enable user ; la même libération est disponible depuis le volet de détails de l'action dans l'Action center. Libérer seulement après l'enquête et le nettoyage empêche l'attaquant de reprendre l'attaque.
      options:
        a: { en: "Release from containment is the release action of a contained device; a user account is restored with Enable user.", fr: "Release from containment est l'action de libération d'un appareil confiné ; un compte d'utilisateur se rétablit avec Enable user." }
        c: { en: "An exclusion only prevents future automatic actions on the account; it doesn't enable the account that was already disabled.", fr: "Une exclusion empêche seulement les futures actions automatiques sur le compte ; elle ne réactive pas le compte déjà désactivé." }
        d: { en: "Device group automation levels govern automated remediation on devices; they don't re-enable an account.", fr: "Les niveaux d'automatisation des groupes d'appareils régissent la correction automatique sur les appareils ; ils ne réactivent pas un compte." }
    references:
      - title: Details and results of an automatic attack disruption action
        url: https://learn.microsoft.com/en-us/defender-xdr/autoad-results

  # ------------------------------------------------------------------ 5
  - id: sc200-qz-23-05
    objective: "2.2.2"
    difficulty: 2
    status: draft
    type: yesno_statements
    stem:
      en: |
        Adatum uses Microsoft Defender for Endpoint. You plan two response actions:

        - Restrict app execution on a Windows 11 device named **WS-FIN-02**, on which Microsoft Defender Antivirus is the active antivirus.
        - Contain a device named **NAS-07**, which device discovery found and which isn't onboarded. All the other Windows devices of Adatum are onboarded.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Adatum utilise Microsoft Defender for Endpoint. Vous prévoyez deux actions de réponse :

        - Restreindre l'exécution des applications (Restrict app execution) sur un appareil Windows 11 nommé **WS-FIN-02**, dont l'antivirus actif est l'Antivirus Microsoft Defender.
        - Contenir un appareil nommé **NAS-07**, trouvé par la découverte d'appareils et non intégré. Tous les autres appareils Windows d'Adatum sont intégrés.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text:
            en: "While the restriction is in place, an application signed by a trusted non-Microsoft publisher still runs on WS-FIN-02."
            fr: "Tant que la restriction est en place, une application signée par un éditeur non-Microsoft approuvé s'exécute toujours sur WS-FIN-02."
        - id: s2
          text:
            en: "Containing NAS-07 blocks its traffic to internet sites."
            fr: "Contenir NAS-07 bloque son trafic vers les sites Internet."
        - id: s3
          text:
            en: "The onboarded devices can take up to five minutes to start blocking communication with NAS-07."
            fr: "Les appareils intégrés peuvent mettre jusqu'à cinq minutes à commencer à bloquer la communication avec NAS-07."
    answer:
      values: { s1: false, s2: false, s3: true }
    explanation:
      correct:
        en: |
          No: Restrict app execution applies an App Control code integrity policy that lets files run only if they're signed by a Microsoft-issued certificate. No: containment is enforced by the onboarded devices, which block communication with the contained device; NAS-07 itself isn't controlled and can still reach the internet. Yes: the details of a newly contained device can take up to 5 minutes to reach the onboarded devices.
        fr: |
          Non : Restrict app execution applique une stratégie d'intégrité du code App Control qui ne laisse s'exécuter que les fichiers signés par un certificat émis par Microsoft. Non : le confinement est appliqué par les appareils intégrés, qui bloquent la communication avec l'appareil confiné ; NAS-07 lui-même n'est pas contrôlé et peut encore joindre Internet. Oui : les détails d'un appareil nouvellement confiné peuvent mettre jusqu'à 5 minutes à atteindre les appareils intégrés.
    references:
      - title: Take response actions on a device in Microsoft Defender for Endpoint
        url: https://learn.microsoft.com/en-us/defender-endpoint/respond-machine-alerts

  # ------------------------------------------------------------------ 6
  - id: sc200-qz-23-06
    objective: "2.2.2"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Fabrikam uses Microsoft Defender for Endpoint role-based access control; unified RBAC isn't activated. The device groups are configured as follows.

        | Device group | Microsoft Entra user groups with access |
        | --- | --- |
        | Workstations | SOC-T1, SOC-T2 |
        | Servers | SOC-T2 |

        The members of SOC-T1 are assigned a custom role that includes the View data and Active remediation actions permissions. They can isolate workstations, but **Isolate device** isn't available on the device page of the server **SRV-HR-01**, which belongs to the Servers device group.

        You need the members of SOC-T1 to be able to isolate the servers. The solution must follow the principle of least privilege.

        What should you do?
      fr: |
        Fabrikam utilise le contrôle d'accès en fonction du rôle de Microsoft Defender for Endpoint ; le RBAC unifié n'est pas activé. Les groupes d'appareils sont configurés comme suit.

        | Groupe d'appareils | Groupes d'utilisateurs Microsoft Entra ayant accès |
        | --- | --- |
        | Workstations | SOC-T1, SOC-T2 |
        | Servers | SOC-T2 |

        Les membres de SOC-T1 disposent d'un rôle personnalisé qui inclut les autorisations View data et Active remediation actions. Ils peuvent isoler les postes de travail, mais **Isolate device** n'est pas disponible sur la page de l'appareil du serveur **SRV-HR-01**, qui appartient au groupe d'appareils Servers.

        Vous devez permettre aux membres de SOC-T1 d'isoler les serveurs. La solution doit respecter le principe du moindre privilège.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Add Live response capabilities: Advanced to the custom role of SOC-T1.", fr: "Ajouter Live response capabilities: Advanced au rôle personnalisé de SOC-T1." } }
        - { id: b, text: { en: "Assign the Security Administrator role in Microsoft Entra ID to the members of SOC-T1.", fr: "Attribuer le rôle Security Administrator de Microsoft Entra ID aux membres de SOC-T1." } }
        - { id: c, text: { en: "In the user access settings of the Servers device group, give access to SOC-T1.", fr: "Dans les paramètres d'accès utilisateur du groupe d'appareils Servers, donner l'accès à SOC-T1." } }
        - { id: d, text: { en: "Set the automation level of the Servers device group to Full - remediate threats automatically.", fr: "Définir le niveau d'automatisation du groupe d'appareils Servers sur Full - remediate threats automatically." } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          Isolating a device requires at least the Active remediation actions permission and access to the device through the device group settings. SOC-T1 already has the permission, so giving it access to the Servers device group is the only change needed.
        fr: |
          Isoler un appareil exige au moins l'autorisation Active remediation actions et l'accès à l'appareil par les paramètres du groupe d'appareils. SOC-T1 a déjà l'autorisation : lui donner l'accès au groupe d'appareils Servers est la seule modification nécessaire.
      options:
        a: { en: "Advanced live response adds commands that change devices in a live response session; it doesn't give access to devices of another device group.", fr: "Advanced live response ajoute des commandes qui modifient les appareils dans une session de réponse dynamique ; il ne donne pas accès aux appareils d'un autre groupe d'appareils." }
        b: { en: "Security Administrator is a tenant-wide administrator role, far beyond what isolating servers requires.", fr: "Security Administrator est un rôle d'administration à l'échelle du locataire, bien au-delà de ce qu'exige l'isolement des serveurs." }
        d: { en: "The automation level controls the automated remediation of the device group; it gives analysts no access to its devices.", fr: "Le niveau d'automatisation contrôle la correction automatique du groupe d'appareils ; il ne donne aux analystes aucun accès à ses appareils." }
    references:
      - title: Take response actions on a device in Microsoft Defender for Endpoint
        url: https://learn.microsoft.com/en-us/defender-endpoint/respond-machine-alerts
      - title: Create and manage roles for role-based access control
        url: https://learn.microsoft.com/en-us/defender-endpoint/user-roles

  # ------------------------------------------------------------------ 7
  - id: sc200-qz-23-07
    objective: "2.2.2"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Proseware has a Windows Server 2022 Hyper-V host named **HV-01** that runs 12 virtual machines. HV-01 and all its virtual machines are onboarded to Microsoft Defender for Endpoint.

        An alert shows that a virtual machine named **VM-07** communicates with a command-and-control server. While you investigate, VM-07 must stop all network communication except with the Defender for Endpoint service. The other 11 virtual machines must keep their network access.

        What should you do?
      fr: |
        Proseware dispose d'un hôte Hyper-V Windows Server 2022 nommé **HV-01** qui exécute 12 machines virtuelles. HV-01 et toutes ses machines virtuelles sont intégrés à Microsoft Defender for Endpoint.

        Une alerte montre qu'une machine virtuelle nommée **VM-07** communique avec un serveur de commande et de contrôle. Pendant votre enquête, VM-07 doit cesser toute communication réseau, sauf avec le service Defender for Endpoint. Les 11 autres machines virtuelles doivent garder leur accès réseau.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Isolate HV-01 from its device page, and select full isolation.", fr: "Isoler HV-01 depuis sa page d'appareil, en choisissant l'isolation complète." } }
        - { id: b, text: { en: "Contain VM-07 from its device page.", fr: "Contenir VM-07 depuis sa page d'appareil." } }
        - { id: c, text: { en: "Restrict app execution on VM-07 from its device page.", fr: "Restreindre l'exécution des applications sur VM-07 depuis sa page d'appareil." } }
        - { id: d, text: { en: "Isolate VM-07 from its device page, and select full isolation.", fr: "Isoler VM-07 depuis sa page d'appareil, en choisissant l'isolation complète." } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          VM-07 is onboarded, so full isolation cuts it off the network while it keeps its connection to the Defender for Endpoint service. Isolating the virtual machine itself leaves the host and the other virtual machines untouched.
        fr: |
          VM-07 est intégrée : l'isolation complète la coupe du réseau tout en gardant sa connexion au service Defender for Endpoint. Isoler la machine virtuelle elle-même laisse l'hôte et les autres machines virtuelles intacts.
      options:
        a: { en: "Isolating a Hyper-V host blocks the network traffic of all its child virtual machines, so the other 11 lose their access.", fr: "Isoler un hôte Hyper-V bloque le trafic réseau de toutes ses machines virtuelles enfants : les 11 autres perdent leur accès." }
        b: { en: "Containment makes the other onboarded devices block VM-07; VM-07 itself can still reach the command-and-control server on the internet.", fr: "Le confinement fait bloquer VM-07 par les autres appareils intégrés ; VM-07 elle-même peut encore joindre le serveur de commande et de contrôle sur Internet." }
        c: { en: "Restricting app execution blocks files not signed by Microsoft but doesn't stop network communication, for example from a Microsoft-signed tool.", fr: "Restreindre l'exécution des applications bloque les fichiers non signés par Microsoft mais n'arrête pas la communication réseau, par exemple depuis un outil signé par Microsoft." }
    references:
      - title: Take response actions on a device in Microsoft Defender for Endpoint
        url: https://learn.microsoft.com/en-us/defender-endpoint/respond-machine-alerts

  # ------------------------------------------------------------------ 8
  - id: sc200-qz-23-08
    objective: "2.2.3"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        During a ransomware investigation, the Northwind Traders SOC opens the file pages of three suspicious executables in the Microsoft Defender portal. All the devices run Windows 11 and are onboarded to Microsoft Defender for Endpoint.

        | File | Details |
        | --- | --- |
        | tool1.exe | Signed by Microsoft; observed on 20 devices |
        | tool2.exe | Unsigned; observed on 50 devices where Microsoft Defender Antivirus runs in passive mode next to a non-Microsoft antivirus |
        | tool3.exe | Unsigned; observed on 1,400 devices during the last 30 days; Microsoft Defender Antivirus in active mode |

        The SOC considers the **Stop and quarantine file** action for each file.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Pendant une enquête sur un rançongiciel, le SOC de Northwind Traders ouvre les pages de fichier de trois exécutables suspects dans le portail Microsoft Defender. Tous les appareils exécutent Windows 11 et sont intégrés à Microsoft Defender for Endpoint.

        | Fichier | Détails |
        | --- | --- |
        | tool1.exe | Signé par Microsoft ; observé sur 20 appareils |
        | tool2.exe | Non signé ; observé sur 50 appareils où l'Antivirus Microsoft Defender fonctionne en mode passif à côté d'un antivirus non-Microsoft |
        | tool3.exe | Non signé ; observé sur 1 400 appareils au cours des 30 derniers jours ; Antivirus Microsoft Defender en mode actif |

        Le SOC envisage l'action **Stop and quarantine file** pour chaque fichier.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text:
            en: "Stop and quarantine file can stop and quarantine tool1.exe on the 20 devices."
            fr: "Stop and quarantine file peut arrêter et mettre en quarantaine tool1.exe sur les 20 appareils."
        - id: s2
          text:
            en: "Stop and quarantine file can stop and quarantine tool2.exe on the 50 devices."
            fr: "Stop and quarantine file peut arrêter et mettre en quarantaine tool2.exe sur les 50 appareils."
        - id: s3
          text:
            en: "A single Stop and quarantine file action on tool3.exe reaches all 1,400 devices."
            fr: "Une seule action Stop and quarantine file sur tool3.exe atteint les 1 400 appareils."
    answer:
      values: { s1: false, s2: true, s3: false }
    explanation:
      correct:
        en: |
          No: Stop and quarantine file doesn't apply to files signed by Microsoft or by trusted non-Microsoft publishers. Yes: the action requires Microsoft Defender Antivirus running at least in passive mode, which is the case. No: the action is limited to 1,000 devices; for a file seen on more devices, Microsoft recommends a block indicator, which applies to every device.
        fr: |
          Non : Stop and quarantine file ne s'applique pas aux fichiers signés par Microsoft ou par des éditeurs non-Microsoft approuvés. Oui : l'action exige que l'Antivirus Microsoft Defender fonctionne au moins en mode passif, ce qui est le cas. Non : l'action est limitée à 1 000 appareils ; pour un fichier vu sur plus d'appareils, Microsoft recommande un indicateur de blocage, qui s'applique à tous les appareils.
    references:
      - title: Take response actions on a file in Microsoft Defender for Endpoint
        url: https://learn.microsoft.com/en-us/defender-endpoint/respond-file-alerts

  # ------------------------------------------------------------------ 9
  - id: sc200-qz-23-09
    objective: "2.2.2"
    difficulty: 3
    status: draft
    type: dragdrop
    stem:
      en: |
        Woodgrove Bank uses Microsoft Defender for Endpoint role-based access control; unified RBAC isn't activated. Live response is turned on.

        You create one custom role for each of four analysts. Every role already includes the View data permission. Each analyst performs only one of the following tasks on Windows 11 devices, and each role must follow the principle of least privilege.

        Which permission should you add to each role? To answer, drag the appropriate permissions to the correct tasks. Each permission may be used once or not at all.

        NOTE: Each correct selection is worth one point.
      fr: |
        Woodgrove Bank utilise le contrôle d'accès en fonction du rôle de Microsoft Defender for Endpoint ; le RBAC unifié n'est pas activé. La réponse dynamique est activée.

        Vous créez un rôle personnalisé pour chacun de quatre analystes. Chaque rôle inclut déjà l'autorisation View data. Chaque analyste n'effectue qu'une des tâches suivantes sur des appareils Windows 11, et chaque rôle doit respecter le principe du moindre privilège.

        Quelle autorisation devez-vous ajouter à chaque rôle ? Pour répondre, faites glisser les autorisations appropriées vers les tâches correspondantes. Chaque autorisation peut être utilisée une fois ou pas du tout.

        Remarque : chaque sélection correcte vaut un point.
    body:
      reuse: false
      items:
        - { id: alerts, text: Alerts investigation }
        - { id: remediation, text: Active remediation actions }
        - { id: basic, text: "Live response capabilities: Basic" }
        - { id: advanced, text: "Live response capabilities: Advanced" }
        - { id: security, text: Manage security settings in Security Center }
      targets:
        - { id: t1, text: { en: "Collect an investigation package from a device", fr: "Collecter un package d'investigation sur un appareil" } }
        - { id: t2, text: { en: "Isolate a device from the network", fr: "Isoler un appareil du réseau" } }
        - { id: t3, text: { en: "Download a 2-GB log file from a device in a live response session", fr: "Télécharger un fichier journal de 2 Go depuis un appareil dans une session de réponse dynamique" } }
        - { id: t4, text: { en: "Copy a tool from the live response library to a device", fr: "Copier un outil de la bibliothèque de réponse dynamique vers un appareil" } }
    answer:
      mapping: { t1: alerts, t2: remediation, t3: basic, t4: advanced }
    explanation:
      correct:
        en: |
          Alerts investigation covers managing alerts, running scans and collecting investigation packages. Isolation requires at least Active remediation actions, which covers response actions. Basic live response starts sessions, runs read-only commands and downloads files with getfile (up to 3 GB). Copying a library file to the device with putfile is an Advanced command.
        fr: |
          Alerts investigation couvre la gestion des alertes, les analyses et la collecte des packages d'investigation. L'isolement exige au moins Active remediation actions, qui couvre les actions de réponse. Live response Basic ouvre des sessions, exécute les commandes en lecture seule et télécharge des fichiers avec getfile (jusqu'à 3 Go). Copier un fichier de la bibliothèque sur l'appareil avec putfile est une commande avancée.
      options:
        security: { en: "Manage security settings in Security Center covers settings such as alert suppression, onboarding and indicator lists, and uploading files to the library from the console; none of the tasks needs it.", fr: "Manage security settings in Security Center couvre des paramètres comme la suppression d'alertes, l'intégration et les listes d'indicateurs, ainsi que le chargement de fichiers dans la bibliothèque depuis la console ; aucune des tâches n'en a besoin." }
    references:
      - title: Create and manage roles for role-based access control
        url: https://learn.microsoft.com/en-us/defender-endpoint/user-roles
      - title: Investigate entities on devices using live response in Microsoft Defender for Endpoint
        url: https://learn.microsoft.com/en-us/defender-endpoint/live-response

  # ------------------------------------------------------------------ 10
  - id: sc200-qz-23-10
    objective: "2.2.4"
    difficulty: 3
    status: draft
    type: dropdown
    stem:
      en: |
        During an attack at Tailspin Toys, automatic attack disruption contained a compromised device named **WS-DEV-31**. Your manager wants to know how widely the containment was enforced across the organization.

        You need an advanced hunting query that returns, for each hour of the last day, the number of distinct onboarded devices that blocked communication with a contained device.

        How should you complete the query? Select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Pendant une attaque chez Tailspin Toys, l'interruption automatique d'attaque a confiné un appareil compromis nommé **WS-DEV-31**. Votre responsable veut savoir jusqu'où le confinement a été appliqué dans l'organisation.

        Vous avez besoin d'une requête de repérage avancé qui renvoie, pour chaque heure du dernier jour, le nombre d'appareils intégrés distincts qui ont bloqué la communication avec un appareil confiné.

        Comment devez-vous compléter la requête ? Sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: code
      language: kusto
      template: |
        [[tbl]]
        | where Timestamp > ago(1d)
        | where ActionType contains [[val]]
        | summarize BlockingDevices = [[agg]](DeviceName) by bin(Timestamp, 1h)
      slots:
        - id: tbl
          options:
            - { id: network, text: DeviceNetworkEvents }
            - { id: events, text: DeviceEvents }
            - { id: logon, text: DeviceLogonEvents }
            - { id: evidence, text: AlertEvidence }
        - id: val
          options:
            - { id: user, text: "\"ContainedUser\"" }
            - { id: device, text: "\"ContainedDevice\"" }
            - { id: av, text: "\"AntivirusDetection\"" }
        - id: agg
          options:
            - { id: count, text: count }
            - { id: makeset, text: make_set }
            - { id: dcount, text: dcount }
    answer:
      values: { tbl: events, val: device, agg: dcount }
    explanation:
      correct:
        en: |
          The block actions that onboarded devices take against a contained device are recorded in `DeviceEvents` with an `ActionType` that contains "ContainedDevice". `dcount(DeviceName)` counts the distinct reporting devices in each one-hour bin, which gives the number of devices that enforced the containment.
        fr: |
          Les actions de blocage que les appareils intégrés appliquent à un appareil confiné sont enregistrées dans `DeviceEvents` avec un `ActionType` qui contient « ContainedDevice ». `dcount(DeviceName)` compte les appareils distincts qui ont signalé l'événement dans chaque intervalle d'une heure, ce qui donne le nombre d'appareils qui ont appliqué le confinement.
      options:
        user: { en: "\"ContainedUser\" returns the blocks caused by a contained user account, not by a contained device.", fr: "« ContainedUser » renvoie les blocages causés par un compte d'utilisateur confiné, pas par un appareil confiné." }
        count: { en: "`count()` counts block events, so a device that blocked many connections would be counted many times.", fr: "`count()` compte les événements de blocage : un appareil qui a bloqué de nombreuses connexions serait compté plusieurs fois." }
        makeset: { en: "`make_set()` returns the list of device names, not a number of devices.", fr: "`make_set()` renvoie la liste des noms d'appareils, pas un nombre d'appareils." }
    references:
      - title: Details and results of an automatic attack disruption action
        url: https://learn.microsoft.com/en-us/defender-xdr/autoad-results
