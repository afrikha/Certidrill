chapter: 13-sentinel-platform
questions:
  # ------------------------------------------------------------------ 1
  - id: sc200-qz-13-01
    objective: "1.2.1"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Northwind Traders uses Microsoft Sentinel. An engineer named Eng1 must connect a new data source to the Sentinel workspace from the connector page. The documentation of this connector lists no additional permission.

        Which role should Eng1 have on the workspace? The solution must follow the principle of least privilege.
      fr: |
        Northwind Traders utilise Microsoft Sentinel. Un ingénieur nommé Eng1 doit connecter une nouvelle source de données à l'espace de travail Sentinel depuis la page du connecteur. La documentation de ce connecteur ne mentionne aucune autorisation supplémentaire.

        Quel rôle Eng1 doit-il avoir sur l'espace de travail ? La solution doit respecter le principe du moindre privilège.
    body:
      options:
        - { id: a, text: Microsoft Sentinel Reader }
        - { id: b, text: Microsoft Sentinel Responder }
        - { id: c, text: Log Analytics Reader }
        - { id: d, text: Log Analytics Contributor }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          Connecting a data source requires write permission on the workspace, plus any permission that the connector itself requires. Log Analytics Contributor includes the write operations on the workspace, while the three other roles only read data or manage incidents.
        fr: |
          Connecter une source de données exige une autorisation d'écriture sur l'espace de travail, plus les autorisations qu'exige le connecteur lui-même. Log Analytics Contributor inclut les opérations d'écriture sur l'espace de travail, alors que les trois autres rôles ne font que lire des données ou gérer des incidents.
      options:
        a: { en: "Microsoft Sentinel Reader views data, incidents and workbooks; it has no write permission on the workspace.", fr: "Microsoft Sentinel Reader consulte les données, les incidents et les classeurs ; il n'a aucune autorisation d'écriture sur l'espace de travail." }
        b: { en: "Microsoft Sentinel Responder adds incident management to Reader, but still no write permission on the workspace.", fr: "Microsoft Sentinel Responder ajoute la gestion des incidents à Reader, mais toujours aucune autorisation d'écriture sur l'espace de travail." }
        c: { en: "Log Analytics Reader reads the workspace data and settings; it can't write to the workspace.", fr: "Log Analytics Reader lit les données et les paramètres de l'espace de travail ; il ne peut pas y écrire." }
    references:
      - title: Roles and permissions in the Microsoft Sentinel platform
        url: https://learn.microsoft.com/en-us/azure/sentinel/roles

  # ------------------------------------------------------------------ 2
  - id: sc200-qz-13-02
    objective: "1.2.4"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Contoso uses SOC optimization in the Microsoft Defender portal. Two months ago, an analyst dismissed a data value recommendation. The SOC lead now wants the team to work on it again, so you select **Reactivate** on the **Dismissed** tab.

        What happens to the recommendation?
      fr: |
        Contoso utilise l'optimisation SOC dans le portail Microsoft Defender. Il y a deux mois, un analyste a ignoré une recommandation de valeur des données. Le responsable du SOC veut maintenant que l'équipe la traite de nouveau ; vous sélectionnez donc **Reactivate** dans l'onglet **Dismissed**.

        Qu'advient-il de la recommandation ?
    body:
      options:
        - { id: a, text: { en: "It returns to the Overview tab with the values and actions it showed when it was dismissed.", fr: "Elle revient dans l'onglet Overview avec les valeurs et les actions qu'elle affichait quand elle a été ignorée." } }
        - { id: b, text: { en: "It returns to the Overview tab and is recalculated, which can take up to an hour.", fr: "Elle revient dans l'onglet Overview et elle est recalculée, ce qui peut prendre jusqu'à une heure." } }
        - { id: c, text: { en: "It stays on the Dismissed tab until the next daily calculation, then returns as Active.", fr: "Elle reste dans l'onglet Dismissed jusqu'au prochain calcul quotidien, puis revient avec le statut Active." } }
        - { id: d, text: { en: "It's created again as a new recommendation that has the In progress status.", fr: "Elle est recréée comme une nouvelle recommandation qui a le statut In progress." } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          A reactivated optimization goes back to the Overview tab and is recalculated to show its current value and actions. The recalculation can take up to an hour, and the optimization can even move straight to Completed if it's no longer relevant.
        fr: |
          Une optimisation réactivée revient dans l'onglet Overview et elle est recalculée pour afficher sa valeur et ses actions actuelles. Le recalcul peut prendre jusqu'à une heure, et l'optimisation peut même passer directement à Completed si elle n'est plus pertinente.
      options:
        a: { en: "The values aren't restored from the past: the recommendation is recalculated against the current environment.", fr: "Les valeurs ne sont pas restaurées du passé : la recommandation est recalculée par rapport à l'environnement actuel." }
        c: { en: "Reactivation takes effect at once; it doesn't wait for the 24-hour calculation cycle.", fr: "La réactivation prend effet immédiatement ; elle n'attend pas le cycle de calcul de 24 heures." }
        d: { en: "The same recommendation is reactivated; In progress is only set with Mark as in progress.", fr: "C'est la même recommandation qui est réactivée ; In progress ne se fixe qu'avec Mark as in progress." }
    references:
      - title: Optimize security operations
        url: https://learn.microsoft.com/en-us/azure/sentinel/soc-optimization/soc-optimization-access

  # ------------------------------------------------------------------ 3
  - id: sc200-qz-13-03
    objective: "1.2.3"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Fabrikam ingests the logs of its Palo Alto Networks firewalls into its Microsoft Sentinel workspace by using the Common Event Format (CEF) via AMA connector. An engineer who has the Microsoft Sentinel Contributor role wants to use the ready-made workbook for these firewalls. No Palo Alto workbook appears on the **Templates** tab of **Threat management > Workbooks**.

        What should the engineer do?
      fr: |
        Fabrikam ingère les journaux de ses pare-feu Palo Alto Networks dans son espace de travail Microsoft Sentinel à l'aide du connecteur Common Event Format (CEF) via AMA. Un ingénieur qui dispose du rôle Microsoft Sentinel Contributor veut utiliser le classeur prêt à l'emploi pour ces pare-feu. Aucun classeur Palo Alto n'apparaît dans l'onglet **Modèles** de **Gestion des menaces > Classeurs**.

        Que doit faire l'ingénieur ?
    body:
      options:
        - { id: a, text: { en: "Install the Palo Alto solution, or the workbook as a standalone item, from the Content hub.", fr: "Installer la solution Palo Alto, ou le classeur comme élément autonome, depuis le hub de contenu." } }
        - { id: b, text: { en: "Get the Workbook Contributor role, because the Templates tab lists only the templates the user can save.", fr: "Obtenir le rôle Workbook Contributor, car l'onglet Modèles ne liste que les modèles que l'utilisateur peut enregistrer." } }
        - { id: c, text: { en: "Wait for a SOC optimization recommendation to add the template after 30 days of firewall data.", fr: "Attendre qu'une recommandation d'optimisation SOC ajoute le modèle après 30 jours de données de pare-feu." } }
        - { id: d, text: { en: "Re-create the data collection rule of the connector so that the Required data types are detected.", fr: "Recréer la règle de collecte de données du connecteur pour que les Types de données requis soient détectés." } }
    answer: { optionId: a }
    explanation:
      correct:
        en: |
          Workbook templates come from content: install the solution that contains the template, or the workbook as a standalone item, from the Content hub. Microsoft Sentinel Contributor can install solutions, and the template then appears on the Templates tab, ready to be saved.
        fr: |
          Les modèles de classeurs proviennent du contenu : installez depuis le hub de contenu la solution qui contient le modèle, ou le classeur comme élément autonome. Microsoft Sentinel Contributor peut installer des solutions, et le modèle apparaît alors dans l'onglet Modèles, prêt à être enregistré.
      options:
        b: { en: "The Templates tab lists the installed templates whatever the user's role, and Contributor can already create workbooks.", fr: "L'onglet Modèles liste les modèles installés quel que soit le rôle de l'utilisateur, et Contributor peut déjà créer des classeurs." }
        c: { en: "SOC optimization suggests rules, data sources or solutions; it never installs workbook templates.", fr: "L'optimisation SOC suggère des règles, des sources de données ou des solutions ; elle n'installe jamais de modèles de classeurs." }
        d: { en: "Required data types is a check to make before saving a template; it doesn't make a missing template appear.", fr: "Types de données requis est une vérification à faire avant d'enregistrer un modèle ; il ne fait pas apparaître un modèle absent." }
    references:
      - title: Visualize your Data by using Workbooks in Microsoft Sentinel
        url: https://learn.microsoft.com/en-us/azure/sentinel/monitor-your-data

  # ------------------------------------------------------------------ 4
  - id: sc200-qz-13-04
    objective: "1.2.2"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Litware has onboarded Microsoft Sentinel to the Microsoft Defender portal and to the Microsoft Sentinel data lake. Last year, the **EmailEvents** table was configured with an analytics retention of 180 days and a total retention of 180 days.

        Litware now needs EmailEvents only for threat hunting over the last 30 days in advanced hunting, and it wants to stop paying for this table in Microsoft Sentinel.

        What should you configure for EmailEvents?
      fr: |
        Litware a intégré Microsoft Sentinel au portail Microsoft Defender et au data lake Microsoft Sentinel. L'an dernier, la table **EmailEvents** a été configurée avec une rétention Analytics de 180 jours et une rétention totale de 180 jours.

        Litware n'a plus besoin d'EmailEvents que pour la chasse aux menaces sur les 30 derniers jours dans le repérage avancé, et veut cesser de payer pour cette table dans Microsoft Sentinel.

        Que devez-vous configurer pour EmailEvents ?
    body:
      options:
        - { id: a, text: { en: "Switch the table to the Data lake tier with a retention of 30 days.", fr: "Passer la table au niveau Data Lake avec une rétention de 30 jours." } }
        - { id: b, text: { en: "Set the analytics retention to 30 days and keep the total retention at 180 days.", fr: "Fixer la rétention Analytics à 30 jours et conserver la rétention totale à 180 jours." } }
        - { id: c, text: { en: "Set both the analytics retention and the total retention to 30 days.", fr: "Fixer à la fois la rétention Analytics et la rétention totale à 30 jours." } }
        - { id: d, text: { en: "Change the table plan of EmailEvents to Basic in the Log Analytics workspace.", fr: "Passer le plan de la table EmailEvents à Basic dans l'espace de travail Log Analytics." } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          Defender XDR data stays available in advanced hunting for 30 days whatever the table settings. Resetting both the analytics retention and the total retention to the default 30 days stops the ingestion of the table into the Sentinel workspace, so Litware no longer pays for it.
        fr: |
          Les données Defender XDR restent disponibles 30 jours dans le repérage avancé, quels que soient les paramètres de la table. Ramener la rétention Analytics et la rétention totale à la valeur par défaut de 30 jours arrête l'ingestion de la table dans l'espace de travail Sentinel : Litware ne paie donc plus pour elle.
      options:
        a: { en: "Ingesting XDR data into the Data lake tier is cheaper but still has ingestion, storage and processing costs.", fr: "Ingérer des données XDR dans le niveau Data Lake coûte moins cher, mais comporte toujours des coûts d'ingestion, de stockage et de traitement." }
        b: { en: "A total retention above 30 days keeps the table ingested, with 150 days of data lake retention to pay.", fr: "Une rétention totale supérieure à 30 jours maintient l'ingestion de la table, avec 150 jours de rétention dans le data lake à payer." }
        d: { en: "A cheaper plan still bills the ingestion; only the 30-day default stops it for an XDR table.", fr: "Un plan moins cher facture toujours l'ingestion ; seule la valeur par défaut de 30 jours l'arrête pour une table XDR." }
    references:
      - title: Manage data tiers and retention in Microsoft Sentinel
        url: https://learn.microsoft.com/en-us/azure/sentinel/manage-data-overview

  # ------------------------------------------------------------------ 5
  - id: sc200-qz-13-05
    objective: "1.2.1"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Adatum has a Microsoft Sentinel workspace named **law-adatum** whose access control mode is **Use resource or workspace permissions**. The web team's servers are Azure virtual machines in a resource group named **RG-Web**, and they send their logs to law-adatum.

        The web team must query the logs of its own servers from the **Logs** page of those resources. The team must not see the data of other resources and must not access Microsoft Sentinel incidents.

        What should you do?
      fr: |
        Adatum dispose d'un espace de travail Microsoft Sentinel nommé **law-adatum** dont le mode de contrôle d'accès est **Use resource or workspace permissions**. Les serveurs de l'équipe web sont des machines virtuelles Azure d'un groupe de ressources nommé **RG-Web**, et ils envoient leurs journaux à law-adatum.

        L'équipe web doit interroger les journaux de ses propres serveurs depuis la page **Journaux** de ces ressources. L'équipe ne doit pas voir les données des autres ressources et ne doit pas accéder aux incidents Microsoft Sentinel.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Grant the web team read access to RG-Web, so that it queries the logs in the context of its resources.", fr: "Accorder à l'équipe web un accès en lecture à RG-Web, pour qu'elle interroge les journaux dans le contexte de ses ressources." } }
        - { id: b, text: { en: "Assign the Microsoft Sentinel Reader role to the web team on the resource group that contains law-adatum.", fr: "Attribuer le rôle Microsoft Sentinel Reader à l'équipe web sur le groupe de ressources qui contient law-adatum." } }
        - { id: c, text: { en: "Assign the Log Analytics Reader role to the web team on the law-adatum workspace resource.", fr: "Attribuer le rôle Log Analytics Reader à l'équipe web sur la ressource d'espace de travail law-adatum." } }
        - { id: d, text: { en: "Assign the Workbook Reader role to the web team on the resource group that contains law-adatum.", fr: "Attribuer le rôle Workbook Reader à l'équipe web sur le groupe de ressources qui contient law-adatum." } }
    answer: { optionId: a }
    explanation:
      correct:
        en: |
          This is resource-context RBAC: in the Use resource or workspace permissions mode, users who can read a resource see only the log records associated with that resource. Records sent by Azure VMs are tagged automatically with their resource ID, and the team never gets the full Microsoft Sentinel experience.
        fr: |
          C'est le RBAC dans le contexte de la ressource : en mode Use resource or workspace permissions, les utilisateurs qui peuvent lire une ressource ne voient que les enregistrements de journaux associés à cette ressource. Les enregistrements envoyés par des machines virtuelles Azure sont automatiquement marqués avec leur ID de ressource, et l'équipe n'obtient jamais l'expérience Microsoft Sentinel complète.
      options:
        b: { en: "Microsoft Sentinel Reader gives access to all the workspace data and to the incidents.", fr: "Microsoft Sentinel Reader donne accès à toutes les données de l'espace de travail et aux incidents." }
        c: { en: "Log Analytics Reader on the workspace lets the team query every table and every resource's data.", fr: "Log Analytics Reader sur l'espace de travail permet à l'équipe d'interroger toutes les tables et les données de toutes les ressources." }
        d: { en: "Workbook Reader lets users open saved workbooks; it grants no log query access to the resources' data.", fr: "Workbook Reader permet d'ouvrir les classeurs enregistrés ; il n'accorde aucun accès en requête aux données des ressources." }
    references:
      - title: Manage access to Microsoft Sentinel data by resource
        url: https://learn.microsoft.com/en-us/azure/sentinel/resource-context-rbac
      - title: Manage access to Log Analytics workspaces - Azure Monitor
        url: https://learn.microsoft.com/en-us/azure/azure-monitor/logs/manage-access

  # ------------------------------------------------------------------ 6
  - id: sc200-qz-13-06
    objective: "1.2.3"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        Tailspin Toys has a resource group named **RG-SOC** that contains a Microsoft Sentinel workspace named **law-tailspin**. A detection engineer saved the **Microsoft Entra sign-in logs** workbook template as a workbook named **WB-Signins** in RG-SOC. The `SigninLogs` table of law-tailspin contains data.

        The following role assignments exist on RG-SOC. No other role applies to Marta or Kai.

        | User | Role |
        | --- | --- |
        | Marta | Workbook Reader |
        | Kai | Microsoft Sentinel Reader |

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Tailspin Toys dispose d'un groupe de ressources nommé **RG-SOC** qui contient un espace de travail Microsoft Sentinel nommé **law-tailspin**. Un ingénieur de détection a enregistré le modèle de classeur **Microsoft Entra sign-in logs** sous la forme d'un classeur nommé **WB-Signins** dans RG-SOC. La table `SigninLogs` de law-tailspin contient des données.

        Les attributions de rôles suivantes existent sur RG-SOC. Aucun autre rôle ne s'applique à Marta ni à Kai.

        | Utilisateur | Rôle |
        | --- | --- |
        | Marta | Workbook Reader |
        | Kai | Microsoft Sentinel Reader |

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text: { en: "When Marta opens WB-Signins, its charts display the sign-in data of law-tailspin.", fr: "Quand Marta ouvre WB-Signins, ses graphiques affichent les données de connexion de law-tailspin." }
        - id: s2
          text: { en: "Kai can open WB-Signins and see its data, but he can't save changes to the workbook.", fr: "Kai peut ouvrir WB-Signins et en voir les données, mais il ne peut pas enregistrer de modifications du classeur." }
        - id: s3
          text: { en: "A user who has the Owner role on RG-SOC can assign a role whose scope is the WB-Signins resource only.", fr: "Un utilisateur qui dispose du rôle Owner sur RG-SOC peut attribuer un rôle dont l'étendue est uniquement la ressource WB-Signins." }
    answer:
      values: { s1: false, s2: true, s3: true }
    explanation:
      correct:
        en: |
          A saved workbook stores only its JSON definition, never data: its queries run with the permissions of the person who opens it, and Workbook Reader grants no access to the workspace data. Microsoft Sentinel Reader views data and workbooks, but creating or editing a workbook requires Workbook Contributor or Microsoft Sentinel Contributor. Each workbook is an Azure resource, so a role can be assigned at its own scope.
        fr: |
          Un classeur enregistré ne stocke que sa définition JSON, jamais de données : ses requêtes s'exécutent avec les autorisations de la personne qui l'ouvre, et Workbook Reader n'accorde aucun accès aux données de l'espace de travail. Microsoft Sentinel Reader consulte les données et les classeurs, mais créer ou modifier un classeur exige Workbook Contributor ou Microsoft Sentinel Contributor. Chaque classeur est une ressource Azure : un rôle peut donc être attribué à sa propre étendue.
      options:
        s1: { en: "Marta can open the workbook definition, but its queries return nothing: she has no read access to the data of law-tailspin.", fr: "Marta peut ouvrir la définition du classeur, mais ses requêtes ne renvoient rien : elle n'a aucun accès en lecture aux données de law-tailspin." }
    references:
      - title: Visualize your Data by using Workbooks in Microsoft Sentinel
        url: https://learn.microsoft.com/en-us/azure/sentinel/monitor-your-data
      - title: Azure Workbooks overview - Azure Monitor
        url: https://learn.microsoft.com/en-us/azure/azure-monitor/visualize/workbooks-access-control

  # ------------------------------------------------------------------ 7
  - id: sc200-qz-13-07
    objective: "1.2.4"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Woodgrove Bank has onboarded its Microsoft Sentinel workspace to the Microsoft Defender portal and to the Microsoft Sentinel data lake. A billable custom table named **VpnLegacy_CL** is in the Analytics tier with an analytics retention of 90 days, and it receives about 80 GB per day.

        SOC optimization shows a data value recommendation for VpnLegacy_CL with this observation: the table wasn't used at all in the last 30 days. No detection will be built on the table. A regulation requires Woodgrove to keep its VPN logs for one year, and auditors query them a few times a year.

        You need to act on the recommendation. The solution must minimize cost.

        What should you do?
      fr: |
        Woodgrove Bank a intégré son espace de travail Microsoft Sentinel au portail Microsoft Defender et au data lake Microsoft Sentinel. Une table personnalisée facturable nommée **VpnLegacy_CL** est au niveau Analytics avec une rétention Analytics de 90 jours, et elle reçoit environ 80 Go par jour.

        L'optimisation SOC affiche pour VpnLegacy_CL une recommandation de valeur des données avec cette observation : la table n'a pas du tout été utilisée au cours des 30 derniers jours. Aucune détection ne sera créée sur la table. Une réglementation impose à Woodgrove de conserver ses journaux VPN pendant un an, et des auditeurs les interrogent quelques fois par an.

        Vous devez donner suite à la recommandation. La solution doit réduire les coûts au minimum.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Stop the ingestion of VpnLegacy_CL and remove the table, and then mark the recommendation as completed.", fr: "Arrêter l'ingestion de VpnLegacy_CL et supprimer la table, puis marquer la recommandation comme terminée." } }
        - { id: b, text: { en: "Switch VpnLegacy_CL to the Data lake tier with a retention of one year, and then mark the recommendation as completed.", fr: "Passer VpnLegacy_CL au niveau Data Lake avec une rétention d'un an, puis marquer la recommandation comme terminée." } }
        - { id: c, text: { en: "Dismiss the recommendation because the table must be kept for compliance, and keep the current table settings.", fr: "Ignorer la recommandation parce que la table doit être conservée par conformité, et garder les paramètres actuels de la table." } }
        - { id: d, text: { en: "Turn on the analytics rule templates that query VpnLegacy_CL, so that the table is used by detections.", fr: "Activer les modèles de règles d'analytique qui interrogent VpnLegacy_CL, pour que la table soit utilisée par des détections." } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          A data value recommendation changes nothing by itself: you must act, then mark it as completed. For an unused table, the choices are to turn on rule templates, stop ingestion, or move the data to low-cost long-term storage; the regulation rules out deletion, and no detection is planned. The Data lake tier keeps the data for 30 days to 12 years at low cost, and the auditors can still query it.
        fr: |
          Une recommandation de valeur des données ne change rien par elle-même : vous devez agir, puis la marquer comme terminée. Pour une table inutilisée, les choix sont d'activer des modèles de règles, d'arrêter l'ingestion ou de déplacer les données vers un stockage à long terme peu coûteux ; la réglementation exclut la suppression, et aucune détection n'est prévue. Le niveau Data Lake conserve les données de 30 jours à 12 ans à bas coût, et les auditeurs peuvent toujours les interroger.
      options:
        a: { en: "Removing the table deletes the VPN logs that the regulation requires Woodgrove to keep for one year.", fr: "Supprimer la table efface les journaux VPN que la réglementation impose de conserver pendant un an." }
        c: { en: "Dismissing changes nothing: the 80 GB per day stays in the Analytics tier, so the cost isn't reduced.", fr: "Ignorer la recommandation ne change rien : les 80 Go par jour restent au niveau Analytics, le coût n'est donc pas réduit." }
        d: { en: "No detection is planned on the table, and enabling rules keeps the whole Analytics tier cost.", fr: "Aucune détection n'est prévue sur la table, et activer des règles conserve tout le coût du niveau Analytics." }
    references:
      - title: SOC optimization reference
        url: https://learn.microsoft.com/en-us/azure/sentinel/soc-optimization/soc-optimization-reference
      - title: Configure Table Settings in Microsoft Sentinel
        url: https://learn.microsoft.com/en-us/azure/sentinel/manage-table-tiers-retention

  # ------------------------------------------------------------------ 8
  - id: sc200-qz-13-08
    objective: "1.2.2"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        Proseware has onboarded Microsoft Sentinel to the Microsoft Defender portal and to the Microsoft Sentinel data lake. A custom table named **NetFlow_CL** receives 3 TB of flow logs per day. The table is in the Data lake tier with a retention of one year, and it must stay in that tier to control cost.

        The SOC now needs an incident every day for each internal host that sent more than 10 GB to a single external IP address during the previous day.

        Which two actions should you perform? Each correct answer presents part of the solution.

        NOTE: Each correct selection is worth one point.
      fr: |
        Proseware a intégré Microsoft Sentinel au portail Microsoft Defender et au data lake Microsoft Sentinel. Une table personnalisée nommée **NetFlow_CL** reçoit 3 To de journaux de flux par jour. La table est au niveau Data Lake avec une rétention d'un an, et elle doit rester à ce niveau pour maîtriser les coûts.

        Le SOC a maintenant besoin, chaque jour, d'un incident pour chaque hôte interne qui a envoyé plus de 10 Go vers une même adresse IP externe au cours de la veille.

        Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "Create a KQL job that runs daily, aggregates NetFlow_CL and writes the hosts above the threshold to an analytics-tier table.", fr: "Créer une tâche KQL quotidienne qui agrège NetFlow_CL et écrit les hôtes au-dessus du seuil dans une table du niveau Analytics." } }
        - { id: b, text: { en: "Create a scheduled analytics rule that queries the analytics-tier table that the KQL job writes to.", fr: "Créer une règle d'analytique planifiée qui interroge la table du niveau Analytics dans laquelle écrit la tâche KQL." } }
        - { id: c, text: { en: "Create a scheduled analytics rule that queries NetFlow_CL directly with a lookback of one day.", fr: "Créer une règle d'analytique planifiée qui interroge directement NetFlow_CL avec une période de recherche d'un jour." } }
        - { id: d, text: { en: "Create a near-real-time (NRT) rule that queries NetFlow_CL and groups the results by host.", fr: "Créer une règle quasi en temps réel (NRT) qui interroge NetFlow_CL et regroupe les résultats par hôte." } }
        - { id: e, text: { en: "Create a workbook that queries NetFlow_CL, and set its Auto refresh interval to one day.", fr: "Créer un classeur qui interroge NetFlow_CL, et régler son intervalle d'actualisation automatique sur un jour." } }
    answer: { optionIds: [a, b] }
    explanation:
      correct:
        en: |
          Data in the Data lake tier isn't available to analytics rules or other real-time features. A KQL job can query the lake table with full KQL and promote its results to an analytics-tier table, and a scheduled analytics rule on that small table then creates the incidents. NetFlow_CL stays in the low-cost tier.
        fr: |
          Les données du niveau Data Lake ne sont pas disponibles pour les règles d'analytique ni pour les autres fonctionnalités en temps réel. Une tâche KQL peut interroger la table du lac avec tout le langage KQL et promouvoir ses résultats dans une table du niveau Analytics ; une règle d'analytique planifiée sur cette petite table crée ensuite les incidents. NetFlow_CL reste dans le niveau à bas coût.
      options:
        c: { en: "Analytics rules don't run on Data lake tier tables, whatever their lookback.", fr: "Les règles d'analytique ne s'exécutent pas sur les tables du niveau Data Lake, quelle que soit leur période de recherche." }
        d: { en: "NRT rules are analytics rules too: they can't query a Data lake tier table.", fr: "Les règles NRT sont aussi des règles d'analytique : elles ne peuvent pas interroger une table du niveau Data Lake." }
        e: { en: "A workbook only visualizes data; it never creates incidents.", fr: "Un classeur ne fait que visualiser des données ; il ne crée jamais d'incidents." }
    references:
      - title: Manage data tiers and retention in Microsoft Sentinel
        url: https://learn.microsoft.com/en-us/azure/sentinel/manage-data-overview

  # ------------------------------------------------------------------ 9
  - id: sc200-qz-13-09
    objective: "1.2.2"
    difficulty: 3
    status: draft
    type: dropdown
    shuffle: false
    stem:
      en: |
        Contoso uses Microsoft Defender XDR and has onboarded Microsoft Sentinel to the Defender portal and to the Microsoft Sentinel data lake. The **DeviceNetworkEvents** table used its default retention until today.

        To support long investigations, you set the analytics retention of DeviceNetworkEvents to 180 days and its total retention to one year (365 days).

        What costs does this configuration create for DeviceNetworkEvents? Select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Contoso utilise Microsoft Defender XDR et a intégré Microsoft Sentinel au portail Defender et au data lake Microsoft Sentinel. La table **DeviceNetworkEvents** utilisait jusqu'à aujourd'hui sa rétention par défaut.

        Pour permettre de longues investigations, vous fixez la rétention Analytics de DeviceNetworkEvents à 180 jours et sa rétention totale à un an (365 jours).

        Quels coûts cette configuration entraîne-t-elle pour DeviceNetworkEvents ? Sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: text
      template:
        en: |
          Ingestion into the Microsoft Sentinel workspace: [[ingest]]

          Analytics-tier storage is billed for: [[astore]]

          Additional data lake retention is billed for: [[lake]]
        fr: |
          Ingestion dans l'espace de travail Microsoft Sentinel : [[ingest]]

          Le stockage du niveau Analytics est facturé pour : [[astore]]

          La rétention supplémentaire dans le data lake est facturée pour : [[lake]]
      slots:
        - id: ingest
          options:
            - { id: free, text: { en: "Not billed, because XDR data is included in the Defender license", fr: "Non facturée, car les données XDR sont incluses dans la licence Defender" } }
            - { id: billed, text: { en: "Billed as Microsoft Sentinel ingestion", fr: "Facturée comme une ingestion Microsoft Sentinel" } }
            - { id: partial, text: { en: "Billed only for the data kept beyond 30 days", fr: "Facturée uniquement pour les données conservées au-delà de 30 jours" } }
        - id: astore
          options:
            - { id: d0, text: { en: "0 days", fr: "0 jour" } }
            - { id: d90, text: { en: "90 days", fr: "90 jours" } }
            - { id: d150, text: { en: "150 days", fr: "150 jours" } }
            - { id: d180, text: { en: "180 days", fr: "180 jours" } }
        - id: lake
          options:
            - { id: d185, text: { en: "185 days", fr: "185 jours" } }
            - { id: d275, text: { en: "275 days", fr: "275 jours" } }
            - { id: d335, text: { en: "335 days", fr: "335 jours" } }
            - { id: d365, text: { en: "365 days", fr: "365 jours" } }
    answer:
      values: { ingest: billed, astore: d90, lake: d185 }
    explanation:
      correct:
        en: |
          Extending an XDR table beyond 30 days ingests it into the Sentinel workspace, so Sentinel ingestion is billed. Analytics storage has no extra cost up to 90 days, so the 180-day analytics retention bills 90 days of storage. The data lake keeps the data beyond the analytics retention: 365 − 180 = 185 days of additional data lake retention.
        fr: |
          Prolonger une table XDR au-delà de 30 jours l'ingère dans l'espace de travail Sentinel : l'ingestion Sentinel est donc facturée. Le stockage Analytics n'a pas de coût supplémentaire jusqu'à 90 jours : la rétention Analytics de 180 jours facture donc 90 jours de stockage. Le data lake conserve les données au-delà de la rétention Analytics : 365 − 180 = 185 jours de rétention supplémentaire dans le data lake.
      options:
        free: { en: "Only the default 30 days in advanced hunting are included; ingestion into the workspace is billed.", fr: "Seuls les 30 jours par défaut du repérage avancé sont inclus ; l'ingestion dans l'espace de travail est facturée." }
        partial: { en: "Once the retention is extended, the table is ingested and billed as a whole, not only its older data.", fr: "Une fois la rétention prolongée, la table est ingérée et facturée dans son ensemble, pas seulement ses données anciennes." }
        d150: { en: "The free period is 90 days, not the 30-day default of advanced hunting.", fr: "La période gratuite est de 90 jours, pas les 30 jours par défaut du repérage avancé." }
        d335: { en: "The lake bills only the period beyond the analytics retention, which is 180 days here, not 30.", fr: "Le lac ne facture que la période au-delà de la rétention Analytics, qui est ici de 180 jours, pas de 30." }
    references:
      - title: Manage data tiers and retention in Microsoft Sentinel
        url: https://learn.microsoft.com/en-us/azure/sentinel/manage-data-overview

  # ------------------------------------------------------------------ 10
  - id: sc200-qz-13-10
    objective: "1.2.1"
    difficulty: 3
    status: draft
    type: dragdrop
    stem:
      en: |
        Fabrikam has four Microsoft Sentinel workspaces, all onboarded to the Microsoft Defender portal and to the Microsoft Sentinel data lake. One of them is named **law-emea**.

        Three people need the access described in the answer area. Fabrikam's policy forbids any Azure role assignment for Ines. Every permission must follow the principle of least privilege.

        Which permission should you grant for each need? To answer, drag the appropriate permissions to the correct needs. Each permission may be used once or not at all.

        NOTE: Each correct selection is worth one point.
      fr: |
        Fabrikam dispose de quatre espaces de travail Microsoft Sentinel, tous intégrés au portail Microsoft Defender et au data lake Microsoft Sentinel. L'un d'eux est nommé **law-emea**.

        Trois personnes ont besoin des accès décrits dans la zone de réponse. La politique de Fabrikam interdit toute attribution de rôle Azure pour Ines. Chaque autorisation doit respecter le principe du moindre privilège.

        Quelle autorisation devez-vous accorder pour chaque besoin ? Pour répondre, faites glisser les autorisations appropriées vers les besoins correspondants. Chaque autorisation peut être utilisée une fois ou pas du tout.

        Remarque : chaque sélection correcte vaut un point.
    body:
      reuse: false
      items:
        - { id: datamanage, text: { en: "A custom Defender XDR unified RBAC role with Data (manage) permissions", fr: "Un rôle personnalisé du RBAC unifié Defender XDR avec les autorisations Data (manage)" } }
        - { id: secop, text: { en: "The Security Operator role in Microsoft Entra ID", fr: "Le rôle Security Operator dans Microsoft Entra ID" } }
        - { id: secadmin, text: { en: "The Security Administrator role in Microsoft Entra ID", fr: "Le rôle Security Administrator dans Microsoft Entra ID" } }
        - { id: secreader, text: { en: "The Security Reader role in Microsoft Entra ID", fr: "Le rôle Security Reader dans Microsoft Entra ID" } }
        - { id: lar, text: { en: "The Log Analytics Reader role on law-emea", fr: "Le rôle Log Analytics Reader sur law-emea" } }
        - { id: lac, text: { en: "The Log Analytics Contributor role on law-emea", fr: "Le rôle Log Analytics Contributor sur law-emea" } }
      targets:
        - id: ines
          text: { en: "Ines: change the tier and retention of tables in Microsoft Sentinel > Configuration > Tables in the Defender portal", fr: "Ines : modifier le niveau et la rétention des tables dans Microsoft Sentinel > Configuration > Tables du portail Defender" }
        - id: omar
          text: { en: "Omar: run notebooks that write their results to tables in the data lake", fr: "Omar : exécuter des notebooks qui écrivent leurs résultats dans des tables du data lake" }
        - id: lena
          text: { en: "Lena, a contractor: run interactive data lake queries on law-emea only", fr: "Lena, une prestataire : exécuter des requêtes interactives du data lake sur law-emea uniquement" }
    answer:
      mapping: { ines: datamanage, omar: secop, lena: lar }
    explanation:
      correct:
        en: |
          Table settings in the Defender portal can be changed with the unified RBAC Data (manage) permission, which isn't an Azure role. Writing to data lake tables with notebooks or KQL jobs requires Security Operator, Security Administrator or Global Administrator in Microsoft Entra ID; Security Operator is the least privileged. To read one specific workspace in the lake, an Azure role on that workspace such as Log Analytics Reader is enough.
        fr: |
          Les paramètres des tables dans le portail Defender peuvent être modifiés avec l'autorisation Data (manage) du RBAC unifié, qui n'est pas un rôle Azure. Écrire dans les tables du data lake avec des notebooks ou des tâches KQL exige Security Operator, Security Administrator ou Global Administrator dans Microsoft Entra ID ; Security Operator est le moins privilégié. Pour lire un espace de travail précis dans le lac, un rôle Azure sur cet espace, comme Log Analytics Reader, suffit.
      options:
        lac: { en: "Log Analytics Contributor can change table settings, but it's an Azure role, which is forbidden for Ines.", fr: "Log Analytics Contributor peut modifier les paramètres des tables, mais c'est un rôle Azure, interdit pour Ines." }
        secadmin: { en: "Security Administrator can also write to the lake, but it's more privileged than Security Operator.", fr: "Security Administrator peut aussi écrire dans le lac, mais il est plus privilégié que Security Operator." }
        secreader: { en: "Security Reader reads the data lake of all four workspaces, which is broader than law-emea only, and it can't write.", fr: "Security Reader lit le data lake des quatre espaces de travail, ce qui est plus large que law-emea seul, et il ne peut pas écrire." }
    references:
      - title: Roles and permissions in the Microsoft Sentinel platform
        url: https://learn.microsoft.com/en-us/azure/sentinel/roles
      - title: Configure Table Settings in Microsoft Sentinel
        url: https://learn.microsoft.com/en-us/azure/sentinel/manage-table-tiers-retention
