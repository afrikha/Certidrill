chapter: 31-xdr-hunting
questions:
  # ------------------------------------------------------------------ 1
  - id: sc200-qz-31-01
    objective: "3.1.1"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Fabrikam, Inc. uses Microsoft Defender for Endpoint on all its Windows devices. A threat intelligence bulletin reports that a signed application is abused to load a malicious DLL named version.dll from its own folder.

        You need an advanced hunting query that lists the processes that loaded this DLL during the last seven days.

        Which table should you query?
      fr: |
        Fabrikam, Inc. utilise Microsoft Defender for Endpoint sur tous ses appareils Windows. Un bulletin de renseignement sur les menaces signale qu'une application signée est détournée pour charger une DLL malveillante nommée version.dll depuis son propre dossier.

        Vous avez besoin d'une requête de repérage avancé qui liste les processus qui ont chargé cette DLL au cours des sept derniers jours.

        Quelle table devez-vous interroger ?
    body:
      options:
        - { id: a, text: DeviceProcessEvents }
        - { id: b, text: DeviceFileEvents }
        - { id: c, text: DeviceEvents }
        - { id: d, text: DeviceImageLoadEvents }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          DeviceImageLoadEvents contains the DLL loading events of the devices. Each row gives the loaded file (FileName, FolderPath, SHA1) and the process that loaded it (InitiatingProcessFileName and the other InitiatingProcess columns).
        fr: |
          DeviceImageLoadEvents contient les événements de chargement de DLL des appareils. Chaque ligne donne le fichier chargé (FileName, FolderPath, SHA1) et le processus qui l'a chargé (InitiatingProcessFileName et les autres colonnes InitiatingProcess).
      options:
        a: { en: "DeviceProcessEvents records the processes that start, with their command line, not the DLLs that a running process loads.", fr: "DeviceProcessEvents enregistre les processus qui démarrent, avec leur ligne de commande, pas les DLL qu'un processus en cours charge." }
        b: { en: "DeviceFileEvents records files created, modified or renamed, for example when the DLL was written to disk, not when it was loaded.", fr: "DeviceFileEvents enregistre les fichiers créés, modifiés ou renommés, par exemple quand la DLL a été écrite sur le disque, pas quand elle a été chargée." }
        c: { en: "DeviceEvents gathers security-control events such as antivirus and exploit protection; DLL loads have their own table.", fr: "DeviceEvents regroupe les événements des contrôles de sécurité comme l'antivirus et la protection contre les attaques ; les chargements de DLL ont leur propre table." }
    references:
      - title: DeviceImageLoadEvents table in the advanced hunting schema - Microsoft Defender XDR
        url: https://learn.microsoft.com/en-us/defender-xdr/advanced-hunting-deviceimageloadevents-table

  # ------------------------------------------------------------------ 2
  - id: sc200-qz-31-02
    objective: "3.1.4"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Northwind Traders uses Microsoft Defender XDR. The CISO wants to receive an email each time Microsoft Threat Intelligence publishes or updates a threat analytics report that has the Ransomware tag.

        You need to meet the requirement with the least administrative effort. What should you do?
      fr: |
        Northwind Traders utilise Microsoft Defender XDR. Le RSSI veut recevoir un e-mail chaque fois que Microsoft Threat Intelligence publie ou met à jour un rapport d'analytique des menaces qui porte l'étiquette Ransomware.

        Vous devez répondre à cette exigence avec un minimum d'effort administratif. Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "In the email notification settings of Defender XDR, create an incident notification rule for incidents tagged Ransomware.", fr: "Dans les paramètres de notification par e-mail de Defender XDR, créer une règle de notification d'incident pour les incidents étiquetés Ransomware." } }
        - { id: b, text: { en: "Filter the threat analytics report list on the Ransomware tag, and send the filtered view to the CISO every week.", fr: "Filtrer la liste des rapports d'analytique des menaces sur l'étiquette Ransomware, puis envoyer la vue filtrée au RSSI chaque semaine." } }
        - { id: c, text: { en: "In the email notification settings of Defender XDR, create a threat analytics notification rule for reports tagged Ransomware.", fr: "Dans les paramètres de notification par e-mail de Defender XDR, créer une règle de notification d'analytique des menaces pour les rapports étiquetés Ransomware." } }
        - { id: d, text: { en: "Create a custom detection rule from the hunting query of each ransomware report, with the CISO as the alert recipient.", fr: "Créer une règle de détection personnalisée à partir de la requête de chasse de chaque rapport de ransomware, avec le RSSI comme destinataire des alertes." } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          In Settings > Microsoft Defender XDR > Email notifications, the Threat analytics tab lets you create a notification rule. The rule can cover all new or updated reports, or only the reports of a given type or with a given tag, and sends the emails to the recipients you add.
        fr: |
          Dans Settings > Microsoft Defender XDR > Email notifications, l'onglet Threat analytics permet de créer une règle de notification. La règle peut couvrir tous les rapports nouveaux ou mis à jour, ou seulement les rapports d'un type donné ou portant une étiquette donnée, et envoie les e-mails aux destinataires que vous ajoutez.
      options:
        a: { en: "Incident notifications report incidents of the tenant; they don't tell when Microsoft publishes or updates a threat analytics report.", fr: "Les notifications d'incident signalent les incidents du locataire ; elles n'indiquent pas quand Microsoft publie ou met à jour un rapport d'analytique des menaces." }
        b: { en: "A filtered view must be checked and sent by hand every week, and it doesn't alert the CISO when a report is updated.", fr: "Une vue filtrée doit être consultée et envoyée à la main chaque semaine, et elle ne prévient pas le RSSI quand un rapport est mis à jour." }
        d: { en: "A custom detection rule raises alerts on matching activity in the tenant; it isn't triggered by the publication of a report.", fr: "Une règle de détection personnalisée déclenche des alertes sur une activité correspondante dans le locataire ; elle n'est pas déclenchée par la publication d'un rapport." }
    references:
      - title: Get email notifications for Threat analytics updates - Microsoft Defender XDR
        url: https://learn.microsoft.com/en-us/defender-xdr/m365d-threat-analytics-notifications

  # ------------------------------------------------------------------ 3
  - id: sc200-qz-31-03
    objective: "3.1.6"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Contoso, Ltd. is onboarded to the Microsoft Sentinel data lake and graph, and uses Microsoft Defender XDR and Microsoft Purview. The data security team triages the alerts that Microsoft Purview raises about departing employees who might take data with them.

        For a user flagged by these alerts, an analyst must map the user's activities to detect data exfiltration patterns and understand the possible extent of the data leak.

        Which experience powered by Microsoft Sentinel graph should the analyst use?
      fr: |
        Contoso, Ltd. est intégré au data lake et au graphe Microsoft Sentinel, et utilise Microsoft Defender XDR et Microsoft Purview. L'équipe de sécurité des données trie les alertes que Microsoft Purview déclenche au sujet d'employés sur le départ qui pourraient emporter des données.

        Pour un utilisateur signalé par ces alertes, un analyste doit cartographier les activités de l'utilisateur pour détecter des schémas d'exfiltration de données et comprendre l'étendue possible de la fuite.

        Quelle expérience alimentée par Microsoft Sentinel graph l'analyste doit-il utiliser ?
    body:
      options:
        - { id: a, text: { en: "The data risk graph in Microsoft Purview Insider Risk Management", fr: "Le graphe des risques liés aux données de Microsoft Purview Insider Risk Management" } }
        - { id: b, text: { en: "The incident graph with blast radius in the Microsoft Defender portal", fr: "Le graphe d'incident avec rayon d'impact du portail Microsoft Defender" } }
        - { id: c, text: { en: "The hunting graph in Microsoft Defender advanced hunting", fr: "Le graphe de chasse du repérage avancé de Microsoft Defender" } }
        - { id: d, text: { en: "The attack paths in Microsoft Security Exposure Management", fr: "Les chemins d'attaque de Microsoft Security Exposure Management" } }
    answer: { optionId: a }
    explanation:
      correct:
        en: |
          Alerts about departing employees who take data come from Insider Risk Management policies. Its data risk graph, powered by Microsoft Sentinel graph, maps the user's activities to detect exfiltration patterns and shows the blast radius of the data leak.
        fr: |
          Les alertes sur des employés sur le départ qui emportent des données proviennent des stratégies d'Insider Risk Management. Son graphe des risques liés aux données, alimenté par Microsoft Sentinel graph, cartographie les activités de l'utilisateur pour détecter des schémas d'exfiltration et montre le rayon d'impact de la fuite.
      options:
        b: { en: "Blast radius starts from a node of a Defender XDR incident and shows where an attacker could spread, not a user's data activities.", fr: "Le rayon d'impact part d'un nœud d'un incident Defender XDR et montre où un attaquant pourrait se propager, pas les activités d'un utilisateur sur les données." }
        c: { en: "The hunting graph traverses relationships between assets (paths, permissions); it doesn't map a user's data exfiltration activities.", fr: "Le graphe de chasse parcourt les relations entre ressources (chemins, autorisations) ; il ne cartographie pas les activités d'exfiltration de données d'un utilisateur." }
        d: { en: "Attack paths show how an attacker could reach critical assets through misconfigurations and permissions, not what a user did with data.", fr: "Les chemins d'attaque montrent comment un attaquant pourrait atteindre des ressources critiques par des erreurs de configuration et des autorisations, pas ce qu'un utilisateur a fait des données." }
    references:
      - title: What is Microsoft Sentinel graph? - Microsoft Security
        url: https://learn.microsoft.com/en-us/azure/sentinel/datalake/sentinel-graph-overview

  # ------------------------------------------------------------------ 4
  - id: sc200-qz-31-04
    objective: "3.1.3"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Adatum Corporation uses Microsoft Defender XDR and a Microsoft Sentinel workspace onboarded to the Microsoft Defender portal. While you investigate incident 2207, you run an advanced hunting query that finds three more devices that contacted the same command-and-control server.

        You need to attach these query results to incident 2207 so that they appear in the incident with the other evidence. The solution must minimize administrative effort.

        What should you do?
      fr: |
        Adatum Corporation utilise Microsoft Defender XDR et un espace de travail Microsoft Sentinel intégré au portail Microsoft Defender. Pendant que vous examinez l'incident 2207, vous exécutez une requête de repérage avancé qui trouve trois autres appareils ayant contacté le même serveur de commande et de contrôle.

        Vous devez rattacher ces résultats de requête à l'incident 2207 pour qu'ils apparaissent dans l'incident avec les autres preuves. La solution doit réduire l'effort administratif.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Select the rows in the results, select Link to incident, and then choose incident 2207.", fr: "Sélectionner les lignes dans les résultats, sélectionner Link to incident, puis choisir l'incident 2207." } }
        - { id: b, text: { en: "Select the rows in the results, and then add them as hunting bookmarks of incident 2207.", fr: "Sélectionner les lignes dans les résultats, puis les ajouter comme signets de chasse de l'incident 2207." } }
        - { id: c, text: { en: "Create a custom detection rule from the query, and then merge its first incident into incident 2207.", fr: "Créer une règle de détection personnalisée à partir de la requête, puis fusionner son premier incident dans l'incident 2207." } }
        - { id: d, text: { en: "Save the query in Shared queries, and then add the query name in a comment of incident 2207.", fr: "Enregistrer la requête dans Shared queries, puis ajouter le nom de la requête dans un commentaire de l'incident 2207." } }
    answer: { optionId: a }
    explanation:
      correct:
        en: |
          Link to incident attaches the selected advanced hunting results to a new or existing incident, where the linked events appear with the other evidence. It's a direct action from the results, with no rule or extra object to maintain.
        fr: |
          Link to incident rattache les résultats de repérage avancé sélectionnés à un incident nouveau ou existant, où les événements liés apparaissent avec les autres preuves. C'est une action directe depuis les résultats, sans règle ni objet supplémentaire à maintenir.
      options:
        b: { en: "Bookmarks aren't supported in advanced hunting in the Defender portal; Microsoft says to use Link to incident instead.", fr: "Les signets ne sont pas pris en charge dans le repérage avancé du portail Defender ; Microsoft indique d'utiliser Link to incident à la place." }
        c: { en: "A detection rule runs the query on a schedule and creates new alerts later; it doesn't attach the current results and adds a rule to maintain.", fr: "Une règle de détection exécute la requête selon une planification et crée de nouvelles alertes plus tard ; elle ne rattache pas les résultats actuels et ajoute une règle à maintenir." }
        d: { en: "A comment only mentions the query: the results themselves don't become part of the incident.", fr: "Un commentaire ne fait que mentionner la requête : les résultats eux-mêmes ne font pas partie de l'incident." }
    references:
      - title: Advanced hunting with Microsoft Sentinel data in Microsoft Defender - Microsoft Defender XDR
        url: https://learn.microsoft.com/en-us/defender-xdr/advanced-hunting-microsoft-defender

  # ------------------------------------------------------------------ 5
  - id: sc200-qz-31-05
    objective: "3.1.5"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Litware, Inc. uses Microsoft Defender XDR and has the hunting graph available in advanced hunting. An alert flags unusual activity by a service principal named sp-Backup.

        You need a hunting graph that shows all the direct incoming and outgoing connections of sp-Backup, so that you can see what it's related to. You have no specific target in mind.

        Which predefined scenario should you run?
      fr: |
        Litware, Inc. utilise Microsoft Defender XDR et dispose du graphe de chasse dans le repérage avancé. Une alerte signale une activité inhabituelle d'un principal de service nommé sp-Backup.

        Vous avez besoin d'un graphe de chasse qui montre toutes les connexions directes entrantes et sortantes de sp-Backup, pour voir à quoi il est relié. Vous n'avez aucune cible précise en tête.

        Quel scénario prédéfini devez-vous exécuter ?
    body:
      options:
        - { id: a, text: Paths between two entities }
        - { id: b, text: Attack paths to critical asset }
        - { id: c, text: Entity relationship map }
        - { id: d, text: Least privilege access }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          Entity relationship map finds the direct connections of a given entity and analyzes its relationships. Its only input is a source entity, any type of entity can seed the graph, and the graph shows both incoming and outgoing connections.
        fr: |
          Entity relationship map trouve les connexions directes d'une entité donnée et analyse ses relations. Sa seule entrée est une entité source, n'importe quel type d'entité peut servir de point de départ, et le graphe montre les connexions entrantes et sortantes.
      options:
        a: { en: "This scenario needs both a start and a target entity, to tell whether a path leads from one to the other.", fr: "Ce scénario exige une entité de départ et une entité cible, pour savoir si un chemin mène de l'une à l'autre." }
        b: { en: "This scenario takes a target critical asset and shows the routes toward it, not the neighborhood of a source entity.", fr: "Ce scénario prend une ressource critique cible et montre les itinéraires qui y mènent, pas le voisinage d'une entité source." }
        d: { en: "Least privilege access has no input: it finds synced user accounts with privileged permissions to cloud resources.", fr: "Least privilege access n'a pas d'entrée : il trouve les comptes d'utilisateurs synchronisés qui ont des autorisations privilégiées sur des ressources cloud." }
    references:
      - title: Hunting graph in Microsoft Defender advanced hunting - Microsoft Defender XDR
        url: https://learn.microsoft.com/en-us/defender-xdr/advanced-hunting-graph

  # ------------------------------------------------------------------ 6
  - id: sc200-qz-31-06
    objective: "3.1.5"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Woodgrove Bank has an on-premises Active Directory domain monitored by Microsoft Defender for Identity, uses Microsoft Defender XDR, and has the hunting graph available in advanced hunting. Critical assets are classified in Microsoft Security Exposure Management.

        A red team report states that several service accounts have a service principal name (SPN) and a weak password: any authenticated domain user can request a service ticket for these accounts and crack it offline. Accounts that don't require Kerberos preauthentication were already removed.

        You need a hunting graph that shows which of these accounts have paths leading to critical assets. The solution must minimize administrative effort.

        Which predefined scenario should you run?
      fr: |
        Woodgrove Bank dispose d'un domaine Active Directory local surveillé par Microsoft Defender for Identity, utilise Microsoft Defender XDR et dispose du graphe de chasse dans le repérage avancé. Les ressources critiques sont classées dans Microsoft Security Exposure Management.

        Un rapport de red team indique que plusieurs comptes de service ont un nom de principal du service (SPN) et un mot de passe faible : tout utilisateur authentifié du domaine peut demander un ticket de service pour ces comptes et le casser hors ligne. Les comptes qui n'exigent pas la préauthentification Kerberos ont déjà été supprimés.

        Vous avez besoin d'un graphe de chasse qui montre lesquels de ces comptes ont des chemins menant à des ressources critiques. La solution doit réduire l'effort administratif.

        Quel scénario prédéfini devez-vous exécuter ?
    body:
      options:
        - { id: a, text: AS-REP roast paths to critical assets }
        - { id: b, text: Kerberoast paths to critical assets }
        - { id: c, text: Service accounts with RDP to critical devices }
        - { id: d, text: Paths to domain compromise (DCSync) }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          Requesting a service ticket for an account that has an SPN and cracking it offline is Kerberoasting. The Kerberoast paths to critical assets scenario needs no input and shows the Kerberoast-vulnerable accounts that have potential attack paths to sensitive assets, on-premises and in the cloud.
        fr: |
          Demander un ticket de service pour un compte qui a un SPN et le casser hors ligne correspond au Kerberoasting. Le scénario Kerberoast paths to critical assets ne demande aucune entrée et montre les comptes vulnérables au Kerberoasting qui ont des chemins d'attaque potentiels vers des ressources sensibles, locales et cloud.
      options:
        a: { en: "AS-REP roasting targets accounts that don't require Kerberos preauthentication, which the stem says were already removed.", fr: "L'AS-REP roasting cible les comptes qui n'exigent pas la préauthentification Kerberos, que l'énoncé dit déjà supprimés." }
        c: { en: "This scenario looks for service accounts allowed to open RDP sessions on critical devices, not for crackable service tickets.", fr: "Ce scénario recherche des comptes de service autorisés à ouvrir des sessions RDP sur des appareils critiques, pas des tickets de service cassables." }
        d: { en: "This scenario shows multi-step paths from non-privileged users to domain replication rights, not the paths of Kerberoastable accounts to critical assets.", fr: "Ce scénario montre des chemins en plusieurs étapes d'utilisateurs non privilégiés vers les droits de réplication du domaine, pas les chemins des comptes exposés au Kerberoasting vers des ressources critiques." }
    references:
      - title: Hunting graph in Microsoft Defender advanced hunting - Microsoft Defender XDR
        url: https://learn.microsoft.com/en-us/defender-xdr/advanced-hunting-graph

  # ------------------------------------------------------------------ 7
  - id: sc200-qz-31-07
    objective: "3.1.3"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        Tailspin Toys uses Microsoft Defender XDR with Microsoft Defender for Endpoint, Microsoft Defender for Office 365 and Microsoft Defender for Cloud Apps. All user accounts are cloud-only Microsoft Entra accounts. You have the permissions required for the device, user and email remediation actions.

        After a cloud app compromise, the SOC wants analysts to remediate directly from the rows that their hunting queries return, by selecting the rows and then **Take actions**, instead of switching to each workload portal.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Tailspin Toys utilise Microsoft Defender XDR avec Microsoft Defender for Endpoint, Microsoft Defender for Office 365 et Microsoft Defender for Cloud Apps. Tous les comptes d'utilisateurs sont des comptes Microsoft Entra cloud uniquement. Vous disposez des autorisations nécessaires pour les actions de correction sur les appareils, les utilisateurs et les e-mails.

        Après la compromission d'une application cloud, le SOC veut que les analystes corrigent directement depuis les lignes que renvoient leurs requêtes de chasse, en sélectionnant les lignes puis **Take actions**, au lieu de passer par le portail de chaque charge de travail.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text: { en: "To disable users found by a CloudAppEvents query, the results must contain the AccountObjectId column.", fr: "Pour désactiver des utilisateurs trouvés par une requête sur CloudAppEvents, les résultats doivent contenir la colonne AccountObjectId." }
        - id: s2
          text: { en: "To move messages to the Junk Email folder, the results of an EmailEvents query must contain the EmailDirection and SenderFromAddress columns.", fr: "Pour déplacer des messages vers le dossier Courrier indésirable, les résultats d'une requête sur EmailEvents doivent contenir les colonnes EmailDirection et SenderFromAddress." }
        - id: s3
          text: { en: "A DeviceProcessEvents query that returns DeviceId and InitiatingProcessSHA1 lets you quarantine the parent process files.", fr: "Une requête sur DeviceProcessEvents qui renvoie DeviceId et InitiatingProcessSHA1 permet de mettre en quarantaine les fichiers des processus parents." }
    answer:
      values: { s1: true, s2: false, s3: true }
    explanation:
      correct:
        en: |
          For Microsoft Entra identities, the user actions need the AccountObjectId column. Only the delete actions on email need EmailDirection and SenderFromAddress in addition to NetworkMessageId and RecipientEmailAddress; moving to a folder doesn't. The quarantine action accepts SHA1, SHA256 or their InitiatingProcess versions, together with DeviceId.
        fr: |
          Pour les identités Microsoft Entra, les actions sur les utilisateurs exigent la colonne AccountObjectId. Seules les actions de suppression d'e-mails exigent EmailDirection et SenderFromAddress en plus de NetworkMessageId et RecipientEmailAddress ; le déplacement vers un dossier ne les exige pas. L'action de mise en quarantaine accepte SHA1, SHA256 ou leurs versions InitiatingProcess, avec DeviceId.
      options:
        s2: { en: "EmailDirection and SenderFromAddress are required for the soft and hard delete actions, not to move messages to a mailbox folder.", fr: "EmailDirection et SenderFromAddress sont exigées pour les actions de suppression réversible et définitive, pas pour déplacer des messages vers un dossier de la boîte aux lettres." }
    references:
      - title: Take action on advanced hunting results in Microsoft Defender XDR - Microsoft Defender XDR
        url: https://learn.microsoft.com/en-us/defender-xdr/advanced-hunting-take-action

  # ------------------------------------------------------------------ 8
  - id: sc200-qz-31-08
    objective: "3.1.1"
    difficulty: 3
    status: draft
    type: dragdrop
    stem:
      en: |
        Proseware, Inc. uses Microsoft Defender XDR. All its devices are onboarded to Microsoft Defender for Endpoint, which includes Microsoft Defender Vulnerability Management.

        A ransomware group is targeting retailers. Before the holiday season, the SOC plans a hunting campaign on the stores' servers and laptops, and you must prepare four advanced hunting queries for it.

        Which table should you query for each requirement? To answer, drag the appropriate tables to the correct requirements. Each table may be used once or not at all.

        NOTE: Each correct selection is worth one point.
      fr: |
        Proseware, Inc. utilise Microsoft Defender XDR. Tous ses appareils sont intégrés à Microsoft Defender for Endpoint, qui inclut Microsoft Defender Vulnerability Management.

        Un groupe de ransomware cible les distributeurs. Avant la période des fêtes, le SOC prévoit une campagne de chasse sur les serveurs et les ordinateurs portables des magasins, et vous devez préparer quatre requêtes de repérage avancé pour celle-ci.

        Quelle table devez-vous interroger pour chaque exigence ? Pour répondre, faites glisser les tables appropriées vers les exigences correspondantes. Chaque table peut être utilisée une fois ou pas du tout.

        Remarque : chaque sélection correcte vaut un point.
    body:
      reuse: false
      items:
        - { id: events, text: DeviceEvents }
        - { id: procs, text: DeviceProcessEvents }
        - { id: netinfo, text: DeviceNetworkInfo }
        - { id: netevents, text: DeviceNetworkEvents }
        - { id: info, text: DeviceInfo }
        - { id: inventory, text: DeviceTvmSoftwareInventory }
        - { id: vulns, text: DeviceTvmSoftwareVulnerabilities }
        - { id: files, text: DeviceFileEvents }
      targets:
        - id: t1
          text: { en: "Microsoft Defender Antivirus detections and exploit protection events on the devices", fr: "Détections de l'Antivirus Microsoft Defender et événements de protection contre les attaques sur les appareils" }
        - id: t2
          text: { en: "MAC addresses of the network adapters of each device and the networks it's connected to", fr: "Adresses MAC des cartes réseau de chaque appareil et réseaux auxquels il est connecté" }
        - id: t3
          text: { en: "Every installed version of a VPN client, including versions with no known vulnerability, with their end-of-support status", fr: "Toutes les versions installées d'un client VPN, y compris les versions sans vulnérabilité connue, avec leur statut de fin de support" }
        - id: t4
          text: { en: "Files renamed with a .locked extension on the file servers", fr: "Fichiers renommés avec une extension .locked sur les serveurs de fichiers" }
    answer:
      mapping: { t1: events, t2: netinfo, t3: inventory, t4: files }
    explanation:
      correct:
        en: |
          DeviceEvents holds several event types, including those of security controls such as Microsoft Defender Antivirus and exploit protection. DeviceNetworkInfo describes the network properties of the devices: adapters, IP and MAC addresses, connected networks. DeviceTvmSoftwareInventory lists the installed software with its version and end-of-support status, vulnerable or not. DeviceFileEvents records file creation, modification and renaming.
        fr: |
          DeviceEvents contient plusieurs types d'événements, dont ceux des contrôles de sécurité comme l'Antivirus Microsoft Defender et la protection contre les attaques. DeviceNetworkInfo décrit les propriétés réseau des appareils : cartes, adresses IP et MAC, réseaux connectés. DeviceTvmSoftwareInventory liste les logiciels installés avec leur version et leur statut de fin de support, vulnérables ou non. DeviceFileEvents enregistre la création, la modification et le renommage de fichiers.
      options:
        netevents: { en: "DeviceNetworkEvents records network connections, not the configuration of the adapters.", fr: "DeviceNetworkEvents enregistre les connexions réseau, pas la configuration des cartes." }
        info: { en: "DeviceInfo describes the device itself (OS, onboarding), while its network adapters are in DeviceNetworkInfo.", fr: "DeviceInfo décrit l'appareil lui-même (système d'exploitation, intégration), alors que ses cartes réseau se trouvent dans DeviceNetworkInfo." }
        vulns: { en: "DeviceTvmSoftwareVulnerabilities lists only the software that has vulnerabilities, so it misses the versions with none.", fr: "DeviceTvmSoftwareVulnerabilities ne liste que les logiciels qui ont des vulnérabilités ; il manque donc les versions qui n'en ont pas." }
        procs: { en: "DeviceProcessEvents records process starts, not antivirus detections or file renames.", fr: "DeviceProcessEvents enregistre les démarrages de processus, pas les détections antivirus ni les renommages de fichiers." }
    references:
      - title: Data tables in the Microsoft Defender advanced hunting schema - Microsoft Defender XDR
        url: https://learn.microsoft.com/en-us/defender-xdr/advanced-hunting-schema-tables

  # ------------------------------------------------------------------ 9
  - id: sc200-qz-31-09
    objective: "3.1.3"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        Wingtip Toys uses Microsoft Defender XDR. Twenty analysts run advanced hunting queries manually all day, and the SOC also runs 40 custom detection rules. Yesterday afternoon, the portal blocked the analysts' new queries for several minutes because the tenant had consumed 100 percent of its allocated CPU resources.

        Which two statements are true?

        NOTE: Each correct selection is worth one point.
      fr: |
        Wingtip Toys utilise Microsoft Defender XDR. Vingt analystes exécutent manuellement des requêtes de repérage avancé toute la journée, et le SOC exécute aussi 40 règles de détection personnalisées. Hier après-midi, le portail a bloqué les nouvelles requêtes des analystes pendant plusieurs minutes, car le locataire avait consommé 100 % des ressources processeur qui lui sont allouées.

        Quelles sont les deux affirmations vraies ?

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "The analysts could run queries again after the next 15-minute cycle of the CPU quota.", fr: "Les analystes ont pu de nouveau exécuter des requêtes après le cycle de 15 minutes suivant du quota processeur." } }
        - { id: b, text: { en: "The custom detection rules stopped running too, because they consume the quota of the manual queries.", fr: "Les règles de détection personnalisées ont aussi cessé de s'exécuter, car elles consomment le quota des requêtes manuelles." } }
        - { id: c, text: { en: "A manual query that doesn't complete within 10 minutes stops, and the portal displays an error.", fr: "Une requête manuelle qui ne se termine pas en 10 minutes s'arrête, et le portail affiche une erreur." } }
        - { id: d, text: { en: "A manual query can return up to 250,000 rows, provided that the results stay under 64 MB.", fr: "Une requête manuelle peut renvoyer jusqu'à 250 000 lignes, à condition que les résultats restent sous 64 Mo." } }
        - { id: e, text: { en: "Saving the heaviest queries in Shared queries removes them from the CPU quota of the tenant.", fr: "Enregistrer les requêtes les plus lourdes dans Shared queries les retire du quota processeur du locataire." } }
    answer: { optionIds: [a, c] }
    explanation:
      correct:
        en: |
          The CPU quota of advanced hunting depends on the tenant size and is refreshed every 15 minutes: when the tenant reaches 100 percent, queries are blocked until the next cycle. Each query can run for up to 10 minutes; beyond that, the service displays an error.
        fr: |
          Le quota processeur du repérage avancé dépend de la taille du locataire et se renouvelle toutes les 15 minutes : quand le locataire atteint 100 %, les requêtes sont bloquées jusqu'au cycle suivant. Chaque requête peut s'exécuter jusqu'à 10 minutes ; au-delà, le service affiche une erreur.
      options:
        b: { en: "The quotas apply separately to manual queries and to custom detection rules, so the analysts' consumption doesn't block the rules.", fr: "Les quotas s'appliquent séparément aux requêtes manuelles et aux règles de détection personnalisées : la consommation des analystes ne bloque donc pas les règles." }
        d: { en: "A query returns at most 100,000 rows; the 64 MB limit is an additional limit on the size of the results.", fr: "Une requête renvoie au maximum 100 000 lignes ; la limite de 64 Mo est une limite supplémentaire sur la taille des résultats." }
        e: { en: "The folder where a query is saved doesn't change its resource use: every query that runs counts toward the quota.", fr: "Le dossier où une requête est enregistrée ne change pas sa consommation de ressources : chaque requête exécutée compte dans le quota." }
    references:
      - title: Advanced hunting overview in Microsoft Defender - Microsoft Defender XDR
        url: https://learn.microsoft.com/en-us/defender-xdr/advanced-hunting-overview

  # ------------------------------------------------------------------ 10
  - id: sc200-qz-31-10
    objective: "3.1.2"
    difficulty: 3
    status: draft
    type: dropdown
    stem:
      en: |
        Contoso, Ltd. uses Microsoft Defender for Endpoint. Attack surface reduction (ASR) rules are deployed in block mode on the devices of a device group named DG-Finance. In DeviceEvents, the ActionType of an ASR event has the form `Asr<RuleName>Blocked` or `Asr<RuleName>Audited`, for example `AsrOfficeChildProcessBlocked`.

        You need an advanced hunting query that returns every device of DG-Finance with the number of ASR blocks during the last seven days. The devices that had no block must appear with a count of 0.

        How should you complete the query? Select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Contoso, Ltd. utilise Microsoft Defender for Endpoint. Des règles de réduction de la surface d'attaque (ASR) sont déployées en mode blocage sur les appareils d'un groupe d'appareils nommé DG-Finance. Dans DeviceEvents, l'ActionType d'un événement ASR a la forme `Asr<RuleName>Blocked` ou `Asr<RuleName>Audited`, par exemple `AsrOfficeChildProcessBlocked`.

        Vous avez besoin d'une requête de repérage avancé qui renvoie chaque appareil de DG-Finance avec le nombre de blocages ASR des sept derniers jours. Les appareils qui n'ont eu aucun blocage doivent apparaître avec un nombre de 0.

        Comment devez-vous compléter la requête ? Sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: code
      language: kusto
      template: |
        let FinanceDevices = DeviceInfo
        | where Timestamp > ago(1d) and MachineGroup == "DG-Finance"
        | distinct DeviceId, DeviceName;
        let AsrBlocks = DeviceEvents
        | where Timestamp > ago(7d)
        | where ActionType [[op]] "Asr" and ActionType endswith "Blocked"
        | summarize Blocks = count() by DeviceId;
        FinanceDevices
        | join kind=[[kind]] AsrBlocks on DeviceId
        | extend Blocks = [[fill]](Blocks, 0)
        | project DeviceName, Blocks
        | order by Blocks desc
      slots:
        - id: op
          options:
            - { id: has, text: has }
            - { id: starts, text: startswith }
            - { id: eq, text: "==" }
        - id: kind
          options:
            - { id: inner, text: inner }
            - { id: leftsemi, text: leftsemi }
            - { id: leftouter, text: leftouter }
            - { id: leftanti, text: leftanti }
        - id: fill
          options:
            - { id: coalesce, text: coalesce }
            - { id: isnull, text: isnull }
            - { id: max, text: max }
    answer:
      values: { op: starts, kind: leftouter, fill: coalesce }
    explanation:
      correct:
        en: |
          startswith "Asr" matches the beginning of values such as AsrOfficeChildProcessBlocked, and endswith "Blocked" keeps the blocks only. A leftouter join keeps all the DG-Finance devices from the left side, with an empty Blocks value when a device has no match in AsrBlocks. coalesce(Blocks, 0) returns its first non-null argument, so these devices show 0.
        fr: |
          startswith "Asr" correspond au début de valeurs comme AsrOfficeChildProcessBlocked, et endswith "Blocked" ne garde que les blocages. Une jointure leftouter garde tous les appareils de DG-Finance du côté gauche, avec une valeur Blocks vide quand un appareil n'a aucune correspondance dans AsrBlocks. coalesce(Blocks, 0) renvoie son premier argument non nul : ces appareils affichent donc 0.
      options:
        has: { en: "has looks for whole terms: AsrOfficeChildProcessBlocked is one term, so has \"Asr\" matches nothing.", fr: "has recherche des termes entiers : AsrOfficeChildProcessBlocked est un seul terme, donc has \"Asr\" ne correspond à rien." }
        eq: { en: "== compares the whole value, and no ActionType is exactly Asr.", fr: "== compare la valeur entière, et aucun ActionType ne vaut exactement Asr." }
        inner: { en: "An inner join drops the devices that have no row in AsrBlocks, so the devices without blocks disappear.", fr: "Une jointure inner écarte les appareils qui n'ont aucune ligne dans AsrBlocks : les appareils sans blocage disparaissent." }
        leftsemi: { en: "leftsemi keeps only the devices that have blocks, and returns only the columns of the left side, without Blocks.", fr: "leftsemi ne garde que les appareils qui ont des blocages, et ne renvoie que les colonnes du côté gauche, sans Blocks." }
        leftanti: { en: "leftanti keeps only the devices without blocks, and without the Blocks column.", fr: "leftanti ne garde que les appareils sans blocage, et sans la colonne Blocks." }
        isnull: { en: "isnull takes one argument and returns a Boolean; it doesn't replace an empty value with 0.", fr: "isnull prend un seul argument et renvoie un booléen ; il ne remplace pas une valeur vide par 0." }
        max: { en: "max is an aggregation function of summarize; it can't be used as a scalar function in extend.", fr: "max est une fonction d'agrégation de summarize ; elle ne peut pas être utilisée comme fonction scalaire dans extend." }
    references:
      - title: join operator - Kusto
        url: https://learn.microsoft.com/en-us/kusto/query/join-operator
      - title: ASR rules reference - Microsoft Defender for Endpoint
        url: https://learn.microsoft.com/en-us/defender-endpoint/attack-surface-reduction-rules-reference
