chapter: 24-m365-activities
questions:
  # ------------------------------------------------------------------ 1
  - id: sc200-qz-24-01
    objective: "2.3.1"
    difficulty: 1
    status: draft
    type: single
    shuffle: false
    stem:
      en: |
        Northwind Traders has Microsoft 365 E3 licenses for all users and uses Audit (Standard). No custom audit log retention policy exists.

        During an investigation, you need to know how far back an audit log search can still return the Exchange Online and SharePoint activities of the users.

        How long are these audit records retained by default?
      fr: |
        Northwind Traders dispose de licences Microsoft 365 E3 pour tous les utilisateurs et utilise Audit (Standard). Aucune stratégie de rétention des journaux d'audit personnalisée n'existe.

        Pendant une enquête, vous devez savoir jusqu'où dans le passé une recherche dans le journal d'audit peut encore renvoyer les activités Exchange Online et SharePoint des utilisateurs.

        Pendant combien de temps ces enregistrements d'audit sont-ils conservés par défaut ?
    body:
      options:
        - { id: a, text: { en: "90 days", fr: "90 jours" } }
        - { id: b, text: { en: "180 days", fr: "180 jours" } }
        - { id: c, text: { en: "1 year", fr: "1 an" } }
        - { id: d, text: { en: "10 years", fr: "10 ans" } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          Audit (Standard) retains audit records for 180 days by default. The default moved from 90 to 180 days for the records generated on or after October 17, 2023, so it applies to all the records an investigation looks for today.
        fr: |
          Audit (Standard) conserve les enregistrements d'audit 180 jours par défaut. La valeur par défaut est passée de 90 à 180 jours pour les enregistrements générés à partir du 17 octobre 2023 ; elle s'applique donc à tous les enregistrements qu'une enquête recherche aujourd'hui.
      options:
        a: { en: "90 days was the former default of Audit (Standard), which only applied to the records generated before October 17, 2023.", fr: "90 jours était l'ancienne valeur par défaut d'Audit (Standard), qui ne s'appliquait qu'aux enregistrements générés avant le 17 octobre 2023." }
        c: { en: "One year is the default of Audit (Premium) for the Exchange, SharePoint, OneDrive and Microsoft Entra records of E5 users, not of E3 users.", fr: "Un an est la valeur par défaut d'Audit (Premium) pour les enregistrements Exchange, SharePoint, OneDrive et Microsoft Entra des utilisateurs E5, pas des utilisateurs E3." }
        d: { en: "Ten years requires an audit log retention policy, an E5 license and the 10-Year Audit Log Retention add-on; it's never a default.", fr: "Dix ans exigent une stratégie de rétention des journaux d'audit, une licence E5 et la licence complémentaire 10-Year Audit Log Retention ; ce n'est jamais une valeur par défaut." }
    references:
      - title: Manage audit log retention policies
        url: https://learn.microsoft.com/en-us/purview/audit-log-retention-policies

  # ------------------------------------------------------------------ 2
  - id: sc200-qz-24-02
    objective: "2.3.2"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Fabrikam, Inc. uses Microsoft 365. An old SOC runbook tells analysts to look for the copies of a leaked document in the classic Microsoft Purview compliance portal, which is no longer available.

        You need to update the runbook so that analysts can find the documents and the email messages that contain them, then review statistics and a sample of the results.

        Where should analysts create the search?
      fr: |
        Fabrikam, Inc. utilise Microsoft 365. Un ancien runbook du SOC demande aux analystes de rechercher les copies d'un document divulgué dans l'ancien portail de conformité Microsoft Purview, qui n'est plus disponible.

        Vous devez mettre à jour le runbook pour que les analystes puissent trouver les documents et les e-mails qui les contiennent, puis consulter les statistiques et un échantillon des résultats.

        Où les analystes doivent-ils créer la recherche ?
    body:
      options:
        - { id: a, text: { en: "In the Audit solution of the Microsoft Purview portal, as a new search job", fr: "Dans la solution Audit du portail Microsoft Purview, comme nouveau travail de recherche" } }
        - { id: b, text: { en: "In advanced hunting of the Microsoft Defender portal, as a saved query", fr: "Dans le repérage avancé du portail Microsoft Defender, comme requête enregistrée" } }
        - { id: c, text: { en: "In the Content Search case of eDiscovery in the Microsoft Purview portal", fr: "Dans le cas Content Search d'eDiscovery du portail Microsoft Purview" } }
        - { id: d, text: { en: "In Data lifecycle management of the Microsoft Purview portal, as a retention policy", fr: "Dans Gestion du cycle de vie des données du portail Microsoft Purview, comme stratégie de rétention" } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          The classic Content search was retired on August 31, 2025. In the Microsoft Purview portal, all content search functionality is in a system-generated Content Search case of eDiscovery, available by default to the eDiscovery Manager and Administrator role groups. A search there finds the items themselves and gives statistics and samples.
        fr: |
          La recherche de contenu classique a été retirée le 31 août 2025. Dans le portail Microsoft Purview, toutes les fonctionnalités de recherche de contenu se trouvent dans un cas Content Search d'eDiscovery généré par le système, accessible par défaut aux groupes de rôles eDiscovery Manager et Administrator. Une recherche à cet endroit trouve les éléments eux-mêmes et fournit des statistiques et des échantillons.
      options:
        a: { en: "An audit search returns activity records (who downloaded or shared a file), not the documents or messages themselves.", fr: "Une recherche d'audit renvoie des enregistrements d'activité (qui a téléchargé ou partagé un fichier), pas les documents ni les messages eux-mêmes." }
        b: { en: "Advanced hunting queries event tables; it doesn't search the content of mailboxes and OneDrive accounts.", fr: "Le repérage avancé interroge des tables d'événements ; il ne recherche pas dans le contenu des boîtes aux lettres et des comptes OneDrive." }
        d: { en: "A retention policy keeps or deletes content over time; it doesn't return search results, statistics or samples.", fr: "Une stratégie de rétention conserve ou supprime du contenu dans le temps ; elle ne renvoie ni résultats de recherche, ni statistiques, ni échantillons." }
    references:
      - title: Learn about eDiscovery
        url: https://learn.microsoft.com/en-us/purview/edisc
      - title: Get started with Content search
        url: https://learn.microsoft.com/en-us/purview/ediscovery-content-search

  # ------------------------------------------------------------------ 3
  - id: sc200-qz-24-03
    objective: "2.3.3"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Contoso, Ltd. has Microsoft Entra ID P1 licenses and a Microsoft Sentinel workspace named LAW-CTO. The SOC wants to query in LAW-CTO each HTTP request that applications and users send to Microsoft Graph for the tenant, with its URI and response status code.

        What should you configure?
      fr: |
        Contoso, Ltd. dispose de licences Microsoft Entra ID P1 et d'un espace de travail Microsoft Sentinel nommé LAW-CTO. Le SOC veut interroger dans LAW-CTO chaque requête HTTP que les applications et les utilisateurs envoient à Microsoft Graph pour le locataire, avec son URI et son code d'état de réponse.

        Que devez-vous configurer ?
    body:
      options:
        - { id: a, text: { en: "A Microsoft Entra diagnostic setting that sends the Microsoft Graph activity logs to LAW-CTO", fr: "Un paramètre de diagnostic Microsoft Entra qui envoie les journaux d'activité Microsoft Graph vers LAW-CTO" } }
        - { id: b, text: { en: "The Microsoft 365 app connector of Defender for Cloud Apps, so that CloudAppEvents receives the Graph requests", fr: "Le connecteur d'application Microsoft 365 de Defender for Cloud Apps, pour que CloudAppEvents reçoive les requêtes Graph" } }
        - { id: c, text: { en: "An Office 365 Management Activity API subscription that pulls the Graph requests into LAW-CTO", fr: "Un abonnement à l'API Office 365 Management Activity qui récupère les requêtes Graph dans LAW-CTO" } }
        - { id: d, text: { en: "Audit (Premium) for all users, so that the unified audit log records the Graph requests", fr: "Audit (Premium) pour tous les utilisateurs, pour que le journal d'audit unifié enregistre les requêtes Graph" } }
    answer: { optionId: a }
    explanation:
      correct:
        en: |
          The Microsoft Graph activity logs are an audit trail of every HTTP request that Microsoft Graph receives for the tenant. With a Microsoft Entra ID P1 or P2 license, you turn them on in the Microsoft Entra diagnostic settings and send them to a Log Analytics workspace, where they land in the MicrosoftGraphActivityLogs table with RequestUri and ResponseStatusCode.
        fr: |
          Les journaux d'activité Microsoft Graph sont une piste d'audit de chaque requête HTTP que Microsoft Graph reçoit pour le locataire. Avec une licence Microsoft Entra ID P1 ou P2, vous les activez dans les paramètres de diagnostic de Microsoft Entra et vous les envoyez vers un espace de travail Log Analytics, où ils arrivent dans la table MicrosoftGraphActivityLogs avec RequestUri et ResponseStatusCode.
      options:
        b: { en: "The Microsoft 365 app connector adds Microsoft 365 activities to CloudAppEvents in the Defender portal; it doesn't record every Graph HTTP request in LAW-CTO.", fr: "Le connecteur d'application Microsoft 365 ajoute les activités Microsoft 365 à CloudAppEvents dans le portail Defender ; il n'enregistre pas chaque requête HTTP Graph dans LAW-CTO." }
        c: { en: "The Office 365 Management Activity API exposes the unified audit log, not the HTTP requests received by Microsoft Graph.", fr: "L'API Office 365 Management Activity expose le journal d'audit unifié, pas les requêtes HTTP reçues par Microsoft Graph." }
        d: { en: "Audit (Premium) extends audit retention and properties; the unified audit log records user and admin activities, not each Graph request with its status code.", fr: "Audit (Premium) étend la rétention et les propriétés d'audit ; le journal d'audit unifié enregistre les activités des utilisateurs et des administrateurs, pas chaque requête Graph avec son code d'état." }
    references:
      - title: Access Microsoft Graph activity logs for tenant monitoring
        url: https://learn.microsoft.com/en-us/graph/microsoft-graph-activity-logs-overview

  # ------------------------------------------------------------------ 4
  - id: sc200-qz-24-04
    objective: "2.3.2"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Litware, Inc. has Microsoft 365 E5 licenses, which include Microsoft Defender for Office 365 Plan 2. This morning, a phishing message that contains a credential-harvesting link was delivered to 2,300 mailboxes. You have the required permissions in the Microsoft Defender portal and in the Microsoft Purview portal.

        You need to remove the delivered copies of the message. The solution must follow Microsoft's recommendation for this subscription and minimize administrative effort.

        What should you do?
      fr: |
        Litware, Inc. dispose de licences Microsoft 365 E5, qui incluent Microsoft Defender for Office 365 Plan 2. Ce matin, un message d'hameçonnage qui contient un lien de collecte d'informations d'identification a été remis à 2 300 boîtes aux lettres. Vous disposez des autorisations nécessaires dans le portail Microsoft Defender et dans le portail Microsoft Purview.

        Vous devez supprimer les copies remises du message. La solution doit suivre la recommandation de Microsoft pour cet abonnement et réduire l'effort administratif.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Create a search in the Content Search case, and then run a purge action of the SoftDelete type on the search.", fr: "Créer une recherche dans le cas Content Search, puis exécuter une action de purge de type SoftDelete sur la recherche." } }
        - { id: b, text: { en: "Select the messages of the campaign in Threat Explorer, and then take a soft delete remediation action on them.", fr: "Sélectionner les messages de la campagne dans Threat Explorer, puis effectuer sur eux une action de correction Soft delete." } }
        - { id: c, text: { en: "Create an Exchange mail flow rule that deletes the messages that come from the sender's domain.", fr: "Créer une règle de flux de messagerie Exchange qui supprime les messages provenant du domaine de l'expéditeur." } }
        - { id: d, text: { en: "Submit the message to Microsoft as phishing from the Submissions page of the Defender portal.", fr: "Soumettre le message à Microsoft comme hameçonnage depuis la page Submissions du portail Defender." } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          With Defender for Office 365 Plan 2, Microsoft recommends remediating malicious email from Defender for Office 365 rather than with a content search and a purge action. In Threat Explorer, you can select all the messages returned by a query and take an action such as soft delete, without the 10-items-per-mailbox limit of a purge.
        fr: |
          Avec Defender for Office 365 Plan 2, Microsoft recommande de corriger les e-mails malveillants depuis Defender for Office 365 plutôt qu'avec une recherche de contenu et une action de purge. Dans Threat Explorer, vous pouvez sélectionner tous les messages renvoyés par une requête et effectuer une action comme Soft delete, sans la limite de 10 éléments par boîte aux lettres d'une purge.
      options:
        a: { en: "Search and purge works, but Microsoft recommends the Defender for Office 365 remediation when the organization has Plan 2, and the purge is limited to 10 items per mailbox per run.", fr: "La recherche et purge fonctionne, mais Microsoft recommande la correction de Defender for Office 365 quand l'organisation dispose du Plan 2, et la purge est limitée à 10 éléments par boîte aux lettres et par exécution." }
        c: { en: "A mail flow rule acts on messages in transit; it doesn't remove the copies already delivered to the mailboxes.", fr: "Une règle de flux de messagerie agit sur les messages en transit ; elle ne supprime pas les copies déjà remises aux boîtes aux lettres." }
        d: { en: "A submission asks Microsoft for a verdict on the message; it doesn't remove the delivered copies.", fr: "Une soumission demande à Microsoft un verdict sur le message ; elle ne supprime pas les copies remises." }
    references:
      - title: Search for and delete email messages in your organization
        url: https://learn.microsoft.com/en-us/purview/ediscovery-search-for-and-delete-email-messages
      - title: Remediate malicious email that was delivered in Office 365 - Microsoft Defender for Office 365
        url: https://learn.microsoft.com/en-us/defender-office-365/remediate-malicious-email-delivered-office-365

  # ------------------------------------------------------------------ 5
  - id: sc200-qz-24-05
    objective: "2.3.1"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Tailspin Toys uses Microsoft 365 E5 and a third-party SIEM. The SOC wants the SIEM to receive the audit records of Exchange Online, SharePoint, Microsoft Teams and Microsoft Entra ID continuously, so that its correlation rules can use them.

        A colleague proposes a script that runs Search-UnifiedAuditLog every 15 minutes and uploads the results to the SIEM.

        You need to recommend the method that Microsoft supports for retrieving audit data programmatically. What should you recommend?
      fr: |
        Tailspin Toys utilise Microsoft 365 E5 et un SIEM tiers. Le SOC veut que le SIEM reçoive en continu les enregistrements d'audit d'Exchange Online, SharePoint, Microsoft Teams et Microsoft Entra ID, pour que ses règles de corrélation puissent les utiliser.

        Un collègue propose un script qui exécute Search-UnifiedAuditLog toutes les 15 minutes et charge les résultats dans le SIEM.

        Vous devez recommander la méthode que Microsoft prend en charge pour récupérer les données d'audit par programmation. Que devez-vous recommander ?
    body:
      options:
        - { id: a, text: { en: "Have the SIEM pull the audit records from the Office 365 Management Activity API.", fr: "Faire récupérer les enregistrements d'audit par le SIEM depuis l'API Office 365 Management Activity." } }
        - { id: b, text: { en: "Keep the script, but run Search-UnifiedAuditLog in Security & Compliance PowerShell.", fr: "Conserver le script, mais exécuter Search-UnifiedAuditLog dans Security & Compliance PowerShell." } }
        - { id: c, text: { en: "Send the Microsoft Graph activity logs to an event hub that the SIEM reads.", fr: "Envoyer les journaux d'activité Microsoft Graph vers un hub d'événements que le SIEM lit." } }
        - { id: d, text: { en: "Export a CSV file from a search job of the Audit solution every hour.", fr: "Exporter toutes les heures un fichier CSV depuis un travail de recherche de la solution Audit." } }
    answer: { optionId: a }
    explanation:
      correct:
        en: |
          To download audit data programmatically, Microsoft says to use the Office 365 Management Activity API instead of a PowerShell script. A SIEM subscribes to the API content types and pulls the unified audit log records continuously; Audit (Premium) also gives the organization about twice the baseline bandwidth of this API.
        fr: |
          Pour télécharger des données d'audit par programmation, Microsoft indique d'utiliser l'API Office 365 Management Activity plutôt qu'un script PowerShell. Un SIEM s'abonne aux types de contenu de l'API et récupère en continu les enregistrements du journal d'audit unifié ; Audit (Premium) donne aussi à l'organisation environ le double de la bande passante de base de cette API.
      options:
        b: { en: "Changing the PowerShell session doesn't change the guidance: a script around the cmdlet is the approach Microsoft advises against for programmatic download.", fr: "Changer de session PowerShell ne change pas la recommandation : un script autour de l'applet de commande est l'approche que Microsoft déconseille pour le téléchargement par programmation." }
        c: { en: "The Microsoft Graph activity logs contain the HTTP requests sent to Microsoft Graph, not the unified audit log records of Exchange, SharePoint, Teams and Entra ID.", fr: "Les journaux d'activité Microsoft Graph contiennent les requêtes HTTP envoyées à Microsoft Graph, pas les enregistrements du journal d'audit unifié d'Exchange, SharePoint, Teams et Entra ID." }
        d: { en: "Exporting search jobs is a manual, interactive task capped at 1,000,000 rows per export with Audit (Premium); it isn't continuous ingestion.", fr: "L'exportation des travaux de recherche est une tâche manuelle et interactive, limitée à 1 000 000 de lignes par exportation avec Audit (Premium) ; ce n'est pas une ingestion continue." }
    references:
      - title: Search the audit log
        url: https://learn.microsoft.com/en-us/purview/audit-search

  # ------------------------------------------------------------------ 6
  - id: sc200-qz-24-06
    objective: "2.3.1"
    difficulty: 3
    status: draft
    type: dragdrop
    stem:
      en: |
        Woodgrove Bank uses Microsoft 365 E5. The account of a finance manager named Omar was compromised for two days. You search the audit log in Microsoft Purview Audit to rebuild the actions of the attacker.

        You need to identify the operation to search for each finding.

        Which operation should you use for each finding? To answer, drag the appropriate operations to the correct findings. Each operation may be used once or not at all.

        NOTE: Each correct selection is worth one point.
      fr: |
        Woodgrove Bank utilise Microsoft 365 E5. Le compte d'un responsable financier nommé Omar a été compromis pendant deux jours. Vous effectuez des recherches dans le journal d'audit de Microsoft Purview Audit pour reconstituer les actions de l'attaquant.

        Vous devez identifier l'opération à rechercher pour chaque constat.

        Quelle opération devez-vous utiliser pour chaque constat ? Pour répondre, faites glisser les opérations appropriées vers les constats correspondants. Chaque opération peut être utilisée une fois ou pas du tout.

        Remarque : chaque sélection correcte vaut un point.
    body:
      reuse: false
      items:
        - { id: newrule, text: New-InboxRule }
        - { id: setrule, text: Set-InboxRule }
        - { id: updrules, text: UpdateInboxRules }
        - { id: role, text: "Add member to role." }
        - { id: mbxperm, text: Add-MailboxPermission }
        - { id: download, text: FileDownloaded }
        - { id: accessed, text: FileAccessed }
        - { id: sync, text: FileSyncDownloadedFull }
      targets:
        - id: t1
          text: { en: "In Outlook on the web, the attacker changed the conditions of an inbox rule that Omar had created last year.", fr: "Dans Outlook sur le web, l'attaquant a modifié les conditions d'une règle de boîte de réception qu'Omar avait créée l'année dernière." }
        - id: t2
          text: { en: "The attacker made Omar's account a member of a Microsoft 365 admin role.", fr: "L'attaquant a rendu le compte d'Omar membre d'un rôle d'administrateur Microsoft 365." }
        - id: t3
          text: { en: "The attacker used the OneDrive sync app to copy the files of a SharePoint document library to their computer.", fr: "L'attaquant a utilisé l'application de synchronisation OneDrive pour copier les fichiers d'une bibliothèque de documents SharePoint sur son ordinateur." }
        - id: t4
          text: { en: "The attacker opened a budget workbook in the browser without saving a copy.", fr: "L'attaquant a ouvert un classeur budgétaire dans le navigateur sans en enregistrer de copie." }
    answer:
      mapping: { t1: setrule, t2: role, t3: sync, t4: accessed }
    explanation:
      correct:
        en: |
          Set-InboxRule records the modification of an inbox rule in Outlook on the web. "Add member to role." records a user added to an admin role. FileSyncDownloadedFull records files downloaded to a computer with the OneDrive sync app (OneDrive.exe). FileAccessed records a file opened by a user, without a download.
        fr: |
          Set-InboxRule enregistre la modification d'une règle de boîte de réception dans Outlook sur le web. « Add member to role. » enregistre l'ajout d'un utilisateur à un rôle d'administrateur. FileSyncDownloadedFull enregistre les fichiers téléchargés sur un ordinateur avec l'application de synchronisation OneDrive (OneDrive.exe). FileAccessed enregistre un fichier ouvert par un utilisateur, sans téléchargement.
      options:
        newrule: { en: "New-InboxRule records the creation of a rule in Outlook on the web; the rule here already existed.", fr: "New-InboxRule enregistre la création d'une règle dans Outlook sur le web ; ici, la règle existait déjà." }
        updrules: { en: "UpdateInboxRules records rules created, modified or removed with the Outlook desktop client, not with Outlook on the web.", fr: "UpdateInboxRules enregistre les règles créées, modifiées ou supprimées avec le client de bureau Outlook, pas avec Outlook sur le web." }
        mbxperm: { en: "Add-MailboxPermission records FullAccess delegate permissions on a mailbox, not membership of an admin role.", fr: "Add-MailboxPermission enregistre des autorisations de délégué FullAccess sur une boîte aux lettres, pas l'appartenance à un rôle d'administrateur." }
        download: { en: "FileDownloaded records a document downloaded from a site in the browser; files copied by the sync app produce FileSyncDownloadedFull.", fr: "FileDownloaded enregistre un document téléchargé depuis un site dans le navigateur ; les fichiers copiés par l'application de synchronisation produisent FileSyncDownloadedFull." }
    references:
      - title: Audit log activities
        url: https://learn.microsoft.com/en-us/purview/audit-log-activities

  # ------------------------------------------------------------------ 7
  - id: sc200-qz-24-07
    objective: "2.3.3"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        Contoso, Ltd. has Microsoft Entra ID P2 licenses. A diagnostic setting sends the Microsoft Graph activity logs of the Contoso tenant to a Microsoft Sentinel workspace named LAW-CT.

        Contoso consented to a multitenant app named FabSign, published by Fabrikam, that reads the profiles of Contoso users through Microsoft Graph.

        Which two activities are recorded in the MicrosoftGraphActivityLogs table of LAW-CT?

        NOTE: Each correct selection is worth one point.
      fr: |
        Contoso, Ltd. dispose de licences Microsoft Entra ID P2. Un paramètre de diagnostic envoie les journaux d'activité Microsoft Graph du locataire Contoso vers un espace de travail Microsoft Sentinel nommé LAW-CT.

        Contoso a donné son consentement à une application multilocataire nommée FabSign, publiée par Fabrikam, qui lit les profils des utilisateurs de Contoso par Microsoft Graph.

        Quelles sont les deux activités enregistrées dans la table MicrosoftGraphActivityLogs de LAW-CT ?

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "The requests that FabSign sends to Microsoft Graph to read the profiles of Contoso users", fr: "Les requêtes que FabSign envoie à Microsoft Graph pour lire les profils des utilisateurs de Contoso" } }
        - { id: b, text: { en: "The token requests that FabSign sends to Microsoft Entra ID to get an access token for Microsoft Graph", fr: "Les demandes de jeton que FabSign envoie à Microsoft Entra ID pour obtenir un jeton d'accès pour Microsoft Graph" } }
        - { id: c, text: { en: "The requests that Contoso administrators send to Azure Resource Manager to delete virtual machines", fr: "Les requêtes que les administrateurs de Contoso envoient à Azure Resource Manager pour supprimer des machines virtuelles" } }
        - { id: d, text: { en: "The requests that the Microsoft Teams client sends to Microsoft Graph on behalf of Contoso users", fr: "Les requêtes que le client Microsoft Teams envoie à Microsoft Graph pour le compte des utilisateurs de Contoso" } }
    answer: { optionIds: [a, d] }
    explanation:
      correct:
        en: |
          The Microsoft Graph activity logs record the HTTP requests that Microsoft Graph receives for the resource tenant, whoever sends them: line-of-business and third-party apps, and Microsoft apps such as Outlook and Teams. FabSign is published by another tenant, but its requests read Contoso data, so Contoso is the resource tenant and they appear in LAW-CT.
        fr: |
          Les journaux d'activité Microsoft Graph enregistrent les requêtes HTTP que Microsoft Graph reçoit pour le locataire de ressources, quel que soit l'émetteur : applications métier et tierces, et applications Microsoft comme Outlook et Teams. FabSign est publiée par un autre locataire, mais ses requêtes lisent des données de Contoso : Contoso est donc le locataire de ressources et elles apparaissent dans LAW-CT.
      options:
        b: { en: "Getting a token is a sign-in, recorded in the sign-in logs (AADServicePrincipalSignInLogs for an app); only the Graph calls made with the token are in MicrosoftGraphActivityLogs.", fr: "L'obtention d'un jeton est une connexion, enregistrée dans les journaux de connexion (AADServicePrincipalSignInLogs pour une application) ; seuls les appels Graph faits avec le jeton figurent dans MicrosoftGraphActivityLogs." }
        c: { en: "Azure Resource Manager isn't Microsoft Graph; deleting a virtual machine is recorded in the Azure activity log, not in the Graph activity logs.", fr: "Azure Resource Manager n'est pas Microsoft Graph ; la suppression d'une machine virtuelle est enregistrée dans le journal d'activité Azure, pas dans les journaux d'activité Graph." }
    references:
      - title: Access Microsoft Graph activity logs for tenant monitoring
        url: https://learn.microsoft.com/en-us/graph/microsoft-graph-activity-logs-overview

  # ------------------------------------------------------------------ 8
  - id: sc200-qz-24-08
    objective: "2.3.2"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        Adatum Corporation has Microsoft 365 E3 licenses and no Microsoft Defender for Office 365 subscription. Single item recovery uses the default settings. A message that contains customer card data was sent by mistake to 800 mailboxes, and 15 of these mailboxes are on Litigation Hold.

        An analyst named Analyst6 is assigned only the Search And Purge role. You plan to remove the message by using a search in eDiscovery and a purge action of the HardDelete type in Security & Compliance PowerShell.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Adatum Corporation dispose de licences Microsoft 365 E3 et d'aucun abonnement Microsoft Defender for Office 365. La récupération d'élément unique utilise les paramètres par défaut. Un message qui contient des données de cartes bancaires de clients a été envoyé par erreur à 800 boîtes aux lettres, et 15 de ces boîtes aux lettres sont en conservation pour litige.

        Un analyste nommé Analyst6 dispose uniquement du rôle Search And Purge. Vous prévoyez de supprimer le message à l'aide d'une recherche dans eDiscovery et d'une action de purge de type HardDelete dans Security & Compliance PowerShell.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text: { en: "In the mailboxes that aren't on hold, the purged message moves to the Purges folder, out of the recipients' reach.", fr: "Dans les boîtes aux lettres qui ne sont pas en conservation, le message purgé passe dans le dossier Purges, hors de portée des destinataires." }
        - id: s2
          text: { en: "In the 15 mailboxes on Litigation Hold, the purge action permanently removes the message as soon as the action completes.", fr: "Dans les 15 boîtes aux lettres en conservation pour litige, l'action de purge supprime définitivement le message dès la fin de l'action." }
        - id: s3
          text: { en: "Analyst6 can create and start the search that the purge action uses.", fr: "Analyst6 peut créer et démarrer la recherche qu'utilise l'action de purge." }
    answer:
      values: { s1: true, s2: false, s3: false }
    explanation:
      correct:
        en: |
          A hard-deleted message moves to the Purges folder, which the user can't access; with single item recovery on, it's permanently removed after the deleted item retention period. In a mailbox on hold, purged messages are preserved until the hold expires or is removed. Creating and running the search needs the eDiscovery Manager role group or the Compliance Search role: Search And Purge only allows the deletion.
        fr: |
          Un message supprimé définitivement (HardDelete) passe dans le dossier Purges, auquel l'utilisateur n'a pas accès ; avec la récupération d'élément unique activée, il est supprimé définitivement après la période de rétention des éléments supprimés. Dans une boîte aux lettres en conservation, les messages purgés sont conservés jusqu'à l'expiration ou la levée de la conservation. Créer et exécuter la recherche exige le groupe de rôles eDiscovery Manager ou le rôle Compliance Search : Search And Purge ne permet que la suppression.
      options:
        s2: { en: "A hold wins over the purge: the copies are kept in the mailbox until the hold duration expires or the hold is removed.", fr: "La conservation l'emporte sur la purge : les copies restent dans la boîte aux lettres jusqu'à l'expiration de la durée de conservation ou la levée de la conservation." }
        s3: { en: "Search And Purge allows the purge action only; Analyst6 also needs Compliance Search or membership of eDiscovery Manager to create the search.", fr: "Search And Purge n'autorise que l'action de purge ; Analyst6 a aussi besoin de Compliance Search ou de l'appartenance à eDiscovery Manager pour créer la recherche." }
    references:
      - title: Search for and delete email messages in your organization
        url: https://learn.microsoft.com/en-us/purview/ediscovery-search-for-and-delete-email-messages

  # ------------------------------------------------------------------ 9
  - id: sc200-qz-24-09
    objective: "2.3.1"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        Fabrikam, Inc. uses Audit (Premium). The 60 members of the executive team have Microsoft 365 E5 licenses, and the other employees have Microsoft 365 E3 licenses. No custom audit log retention policy exists.

        Today, the SOC discovers that an attacker has been active in the tenant for 10 months. To investigate the first week of the attack, you run audit log searches whose date range covers that week.

        Which two types of records can the searches still return?

        NOTE: Each correct selection is worth one point.
      fr: |
        Fabrikam, Inc. utilise Audit (Premium). Les 60 membres de l'équipe de direction disposent de licences Microsoft 365 E5 et les autres employés de licences Microsoft 365 E3. Aucune stratégie de rétention des journaux d'audit personnalisée n'existe.

        Aujourd'hui, le SOC découvre qu'un attaquant est actif dans le locataire depuis 10 mois. Pour examiner la première semaine de l'attaque, vous lancez des recherches dans le journal d'audit dont la plage de dates couvre cette semaine.

        Quels sont les deux types d'enregistrements que les recherches peuvent encore renvoyer ?

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "MailItemsAccessed records of the Exchange Online mailbox of an executive", fr: "Les enregistrements MailItemsAccessed de la boîte aux lettres Exchange Online d'un membre de la direction" } }
        - { id: b, text: { en: "New-InboxRule records of the Exchange Online mailbox of an E3 employee", fr: "Les enregistrements New-InboxRule de la boîte aux lettres Exchange Online d'un employé E3" } }
        - { id: c, text: { en: "Microsoft Teams activity records of an executive, such as messages sent in chats", fr: "Les enregistrements d'activité Microsoft Teams d'un membre de la direction, comme les messages envoyés dans des conversations" } }
        - { id: d, text: { en: "FileDownloaded records of an executive who downloaded files from a SharePoint site", fr: "Les enregistrements FileDownloaded d'un membre de la direction qui a téléchargé des fichiers depuis un site SharePoint" } }
        - { id: e, text: { en: "Exchange Online records of an E3 employee to whom you assign an E5 license today", fr: "Les enregistrements Exchange Online d'un employé E3 auquel vous attribuez une licence E5 aujourd'hui" } }
    answer: { optionIds: [a, d] }
    explanation:
      correct:
        en: |
          The default policy of Audit (Premium) keeps the Exchange, SharePoint, OneDrive and Microsoft Entra records for one year, but only for the activities of users who have an E5 (or equivalent) license. The executives' Exchange and SharePoint records from 10 months ago are therefore still searchable, and a search range of one week stays far below the 180-day maximum.
        fr: |
          La stratégie par défaut d'Audit (Premium) conserve les enregistrements Exchange, SharePoint, OneDrive et Microsoft Entra pendant un an, mais seulement pour les activités des utilisateurs qui ont une licence E5 (ou équivalente). Les enregistrements Exchange et SharePoint des membres de la direction datant de 10 mois sont donc encore consultables, et une plage de recherche d'une semaine reste très en dessous du maximum de 180 jours.
      options:
        b: { en: "The audit records of users without an E5 license are retained for 180 days, so the E3 employee's records from 10 months ago have expired.", fr: "Les enregistrements d'audit des utilisateurs sans licence E5 sont conservés 180 jours : les enregistrements de l'employé E3 datant de 10 mois ont donc expiré." }
        c: { en: "The one-year default covers Exchange, SharePoint, OneDrive and Microsoft Entra ID only; Teams records are retained for 180 days without a custom policy.", fr: "La valeur par défaut d'un an ne couvre qu'Exchange, SharePoint, OneDrive et Microsoft Entra ID ; les enregistrements Teams sont conservés 180 jours sans stratégie personnalisée." }
        e: { en: "A license change only sets the expiration of new audit records; the records already committed keep their 180-day lifetime and have expired.", fr: "Un changement de licence ne fixe que l'expiration des nouveaux enregistrements d'audit ; les enregistrements déjà validés gardent leur durée de vie de 180 jours et ont expiré." }
    references:
      - title: Manage audit log retention policies
        url: https://learn.microsoft.com/en-us/purview/audit-log-retention-policies
      - title: Search the audit log
        url: https://learn.microsoft.com/en-us/purview/audit-search

  # ------------------------------------------------------------------ 10
  - id: sc200-qz-24-10
    objective: "2.3.3"
    difficulty: 3
    status: draft
    type: dropdown
    stem:
      en: |
        Proseware, Inc. streams the Microsoft Graph activity logs to a Microsoft Sentinel workspace. You suspect that a script that uses stolen user tokens enumerates the directory through Microsoft Graph, and that Microsoft Graph throttles many of its requests.

        You need a query that, for the last three days, counts the throttled requests that were made with delegated permissions on behalf of a signed-in user. The results must show the count for each application and resource path, hour by hour.

        How should you complete the query? Select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Proseware, Inc. diffuse les journaux d'activité Microsoft Graph vers un espace de travail Microsoft Sentinel. Vous soupçonnez qu'un script qui utilise des jetons d'utilisateurs volés énumère l'annuaire par Microsoft Graph, et que Microsoft Graph limite (throttling) une grande partie de ses requêtes.

        Vous avez besoin d'une requête qui, pour les trois derniers jours, compte les requêtes limitées qui ont été faites avec des autorisations déléguées pour le compte d'un utilisateur connecté. Les résultats doivent indiquer le nombre pour chaque application et chaque chemin de ressource, heure par heure.

        Comment devez-vous compléter la requête ? Sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: code
      language: kusto
      template: |
        MicrosoftGraphActivityLogs
        | where TimeGenerated > ago(3d)
        | where [[status]] == 429
        | where isnotempty([[perm]])
        | extend ResourcePath = tostring([[fn]](RequestUri).Path)
        | summarize Throttled = count() by AppId, ResourcePath, [[time]]
        | order by Throttled desc
      slots:
        - id: status
          options:
            - { id: rsc, text: ResponseStatusCode }
            - { id: rt, text: ResultType }
            - { id: rm, text: RequestMethod }
        - id: perm
          options:
            - { id: roles, text: Roles }
            - { id: scopes, text: Scopes }
            - { id: spid, text: ServicePrincipalId }
            - { id: appid, text: AppId }
        - id: fn
          options:
            - { id: path, text: parse_path }
            - { id: json, text: parse_json }
            - { id: url, text: parse_url }
        - id: time
          options:
            - { id: ago, text: "ago(1h)" }
            - { id: sod, text: "startofday(TimeGenerated)" }
            - { id: bin, text: "bin(TimeGenerated, 1h)" }
    answer:
      values: { status: rsc, perm: scopes, fn: url, time: bin }
    explanation:
      correct:
        en: |
          ResponseStatusCode holds the HTTP result of each Graph request, and 429 means that the request was throttled. Scopes contains the delegated permissions of the token, so it's filled only when an app calls on behalf of a signed-in user. parse_url splits RequestUri into its parts, including Path, and bin(TimeGenerated, 1h) groups the counts into one-hour buckets.
        fr: |
          ResponseStatusCode contient le résultat HTTP de chaque requête Graph, et 429 signifie que la requête a été limitée. Scopes contient les autorisations déléguées du jeton : il n'est renseigné que lorsqu'une application appelle pour le compte d'un utilisateur connecté. parse_url découpe RequestUri en ses parties, dont Path, et bin(TimeGenerated, 1h) regroupe les nombres par tranches d'une heure.
      options:
        rt: { en: "ResultType is a column of the sign-in logs, not of MicrosoftGraphActivityLogs.", fr: "ResultType est une colonne des journaux de connexion, pas de MicrosoftGraphActivityLogs." }
        roles: { en: "Roles holds the application permissions of an app-only token; it would keep the requests made without a signed-in user.", fr: "Roles contient les autorisations d'application d'un jeton d'application seule ; il garderait les requêtes faites sans utilisateur connecté." }
        spid: { en: "ServicePrincipalId identifies an app that calls as itself, which is the opposite of a delegated call.", fr: "ServicePrincipalId identifie une application qui appelle en son propre nom, ce qui est l'inverse d'un appel délégué." }
        appid: { en: "AppId is present on every request, delegated or not, so it doesn't filter anything.", fr: "AppId est présent sur chaque requête, déléguée ou non : il ne filtre donc rien." }
        path: { en: "parse_path parses file paths and returns no Path property for a URL.", fr: "parse_path analyse des chemins de fichiers et ne renvoie pas de propriété Path pour une URL." }
        ago: { en: "ago(1h) returns a single point in time, not a bucket for each hour of the three days.", fr: "ago(1h) renvoie un seul instant, pas une tranche pour chaque heure des trois jours." }
        sod: { en: "startofday groups the requests by day, not hour by hour.", fr: "startofday regroupe les requêtes par jour, pas heure par heure." }
    references:
      - title: Access Microsoft Graph activity logs for tenant monitoring
        url: https://learn.microsoft.com/en-us/graph/microsoft-graph-activity-logs-overview
