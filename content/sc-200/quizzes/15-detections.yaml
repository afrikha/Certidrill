chapter: 15-detections
questions:
  # ------------------------------------------------------------------ 1
  - id: sc200-qz-15-01
    objective: "1.4.3"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Adatum has a Microsoft Sentinel workspace. You need an analytics rule that evaluates the new **SecurityEvent** records every minute, so that changes to privileged groups raise an alert with the shortest possible delay.

        Which type of analytics rule should you create?
      fr: |
        Adatum dispose d'un espace de travail Microsoft Sentinel. Vous avez besoin d'une règle d'analytique qui évalue les nouveaux enregistrements de **SecurityEvent** chaque minute, afin que les modifications des groupes privilégiés déclenchent une alerte avec le délai le plus court possible.

        Quel type de règle d'analytique devez-vous créer ?
    body:
      options:
        - { id: a, text: { en: "A scheduled rule with Run query every set to 1 minute", fr: "Une règle planifiée dont le paramètre Exécuter la requête toutes les est réglé sur 1 minute" } }
        - { id: b, text: { en: "A near-real-time (NRT) rule", fr: "Une règle quasi en temps réel (NRT)" } }
        - { id: c, text: { en: "An anomaly rule duplicated from a template", fr: "Une règle d'anomalie dupliquée à partir d'un modèle" } }
        - { id: d, text: { en: "A Microsoft Defender Threat Intelligence Analytics rule", fr: "Une règle Microsoft Defender Threat Intelligence Analytics" } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          NRT rules are hard-coded to run once every minute and to capture the events ingested during the preceding minute, with a two-minute delay instead of the five minutes of scheduled rules. They are the Sentinel analytics rule type designed for the fastest possible detection.
        fr: |
          Les règles NRT sont codées pour s'exécuter une fois par minute et capturer les événements ingérés pendant la minute précédente, avec un délai de deux minutes au lieu des cinq minutes des règles planifiées. C'est le type de règle d'analytique Sentinel conçu pour la détection la plus rapide possible.
      options:
        a: { en: "The query interval of a scheduled rule ranges from 5 minutes to 14 days; 1 minute isn't accepted.", fr: "L'intervalle de requête d'une règle planifiée va de 5 minutes à 14 jours ; 1 minute n'est pas accepté." }
        c: { en: "Anomaly rules write machine learning results to the Anomalies table and don't raise alerts.", fr: "Les règles d'anomalie écrivent des résultats Machine Learning dans la table Anomalies et ne déclenchent pas d'alertes." }
        d: { en: "This rule matches Microsoft threat indicators with logs; it doesn't detect changes to privileged groups.", fr: "Cette règle compare les indicateurs de menace de Microsoft aux journaux ; elle ne détecte pas les modifications des groupes privilégiés." }
    references:
      - title: Quick threat detection with near-real-time (NRT) analytics rules in Microsoft Sentinel
        url: https://learn.microsoft.com/en-us/azure/sentinel/near-real-time-rules
      - title: Create scheduled analytics rules in Microsoft Sentinel
        url: https://learn.microsoft.com/en-us/azure/sentinel/create-analytics-rules

  # ------------------------------------------------------------------ 2
  - id: sc200-qz-15-02
    objective: "1.4.5"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Fabrikam has a Microsoft Sentinel workspace. The SOC wants anomalies that reveal which users and hosts behave unusually compared with their own history and with their peers. No anomaly of this kind is recorded in the workspace today.

        What should you do first?
      fr: |
        Fabrikam dispose d'un espace de travail Microsoft Sentinel. Le SOC souhaite des anomalies qui révèlent quels utilisateurs et quels hôtes se comportent de façon inhabituelle par rapport à leur propre historique et à leurs pairs. Aucune anomalie de ce type n'est enregistrée dans l'espace de travail aujourd'hui.

        Que devez-vous faire en premier ?
    body:
      options:
        - { id: a, text: { en: "Duplicate a built-in anomaly rule and switch the copy to Production.", fr: "Dupliquer une règle d'anomalie intégrée et passer la copie en Production." } }
        - { id: b, text: { en: "Create a near-real-time (NRT) rule that queries the Anomalies table.", fr: "Créer une règle quasi en temps réel (NRT) qui interroge la table Anomalies." } }
        - { id: c, text: { en: "Enable UEBA and anomaly detection in the settings of the workspace.", fr: "Activer UEBA et la détection d'anomalies dans les paramètres de l'espace de travail." } }
        - { id: d, text: { en: "Create a rule from the ML Behavior Analytics template for RDP sign-ins.", fr: "Créer une règle à partir du modèle ML Behavior Analytics des connexions RDP." } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          Anomalies about who behaves unusually come from the UEBA engine, which builds a baseline for each entity from its own history, its peers and the organization. You must enable UEBA and anomaly detection in the Sentinel workspace before these UEBA anomalies are recorded in the Anomalies table.
        fr: |
          Les anomalies sur qui se comporte de façon inhabituelle proviennent du moteur UEBA, qui construit une ligne de base pour chaque entité à partir de son propre historique, de ses pairs et de l'organisation. Vous devez activer UEBA et la détection d'anomalies dans l'espace de travail Sentinel avant que ces anomalies UEBA soient enregistrées dans la table Anomalies.
      options:
        a: { en: "Built-in anomaly rules focus on what activity is unusual; tuning a copy doesn't produce UEBA entity anomalies.", fr: "Les règles d'anomalie intégrées portent sur quelle activité est inhabituelle ; régler une copie ne produit pas d'anomalies UEBA sur les entités." }
        b: { en: "A rule on the Anomalies table only uses anomalies that already exist; UEBA must produce them first.", fr: "Une règle sur la table Anomalies n'utilise que des anomalies qui existent déjà ; UEBA doit d'abord les produire." }
        d: { en: "ML Behavior Analytics rules raise alerts about SSH and RDP sign-ins only; they don't build peer baselines for all users and hosts.", fr: "Les règles ML Behavior Analytics déclenchent des alertes sur les seules connexions SSH et RDP ; elles ne construisent pas de lignes de base par pairs pour tous les utilisateurs et hôtes." }
    references:
      - title: Anomalies detected by the Microsoft Sentinel machine learning engine
        url: https://learn.microsoft.com/en-us/azure/sentinel/anomalies-reference

  # ------------------------------------------------------------------ 3
  - id: sc200-qz-15-03
    objective: "1.4.1"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Woodgrove uses Microsoft Defender XDR. On Monday at 09:00, you save a new custom detection rule named **Rule-Svc** that queries the **DeviceProcessEvents** table with the **Every 3 hours** frequency.

        Which data does Rule-Svc check?
      fr: |
        Woodgrove utilise Microsoft Defender XDR. Le lundi à 09:00, vous enregistrez une nouvelle règle de détection personnalisée nommée **Rule-Svc** qui interroge la table **DeviceProcessEvents** avec la fréquence **Every 3 hours**.

        Quelles données Rule-Svc vérifie-t-elle ?
    body:
      options:
        - { id: a, text: { en: "First at 12:00 on the previous 12 hours, then every 3 hours on the previous 12 hours", fr: "D'abord à 12:00 sur les 12 heures précédentes, puis toutes les 3 heures sur les 12 heures précédentes" } }
        - { id: b, text: { en: "First at 09:00 on the past 30 days, then every 3 hours on the previous 12 hours", fr: "D'abord à 09:00 sur les 30 derniers jours, puis toutes les 3 heures sur les 12 heures précédentes" } }
        - { id: c, text: { en: "First at 09:00 on the previous 12 hours, then every 3 hours on the previous 3 hours", fr: "D'abord à 09:00 sur les 12 heures précédentes, puis toutes les 3 heures sur les 3 heures précédentes" } }
        - { id: d, text: { en: "First at 12:00 on the past 30 days, then every 3 hours on the previous 3 hours", fr: "D'abord à 12:00 sur les 30 derniers jours, puis toutes les 3 heures sur les 3 heures précédentes" } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          When you save a custom detection rule, it runs immediately and checks the past 30 days of data. It then runs at its frequency with the fixed lookback of that frequency: for Defender XDR data, Every 3 hours checks the previous 12 hours.
        fr: |
          Quand vous enregistrez une règle de détection personnalisée, elle s'exécute immédiatement et vérifie les 30 derniers jours de données. Elle s'exécute ensuite à sa fréquence avec la période de recherche fixe de cette fréquence : pour les données Defender XDR, Every 3 hours vérifie les 12 heures précédentes.
      options:
        a: { en: "The rule doesn't wait for its first interval: it runs as soon as it's saved, on the past 30 days.", fr: "La règle n'attend pas son premier intervalle : elle s'exécute dès son enregistrement, sur les 30 derniers jours." }
        c: { en: "The first run covers 30 days, and the lookback of Every 3 hours is 12 hours, not 3 hours.", fr: "La première exécution couvre 30 jours, et la période de recherche de Every 3 hours est de 12 heures, pas de 3 heures." }
        d: { en: "The first run happens at save time, and later runs check 12 hours, not only the interval since the last run.", fr: "La première exécution a lieu à l'enregistrement, et les suivantes vérifient 12 heures, pas seulement l'intervalle depuis la dernière exécution." }
    references:
      - title: Create custom detection rules in Microsoft Defender XDR
        url: https://learn.microsoft.com/en-us/defender-xdr/custom-detection-rules

  # ------------------------------------------------------------------ 4
  - id: sc200-qz-15-04
    objective: "1.4.2"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Contoso uses Microsoft Defender XDR. A custom detection rule named **Rule-LOLBin** raises alerts when certutil.exe downloads files. Every night, a software deployment tool runs certutil.exe on the servers of the **DG-Servers** device group, which creates dozens of benign alerts.

        The rule must keep detecting this behavior on every device, including the servers of DG-Servers when the deployment tool isn't involved.

        What should you do?
      fr: |
        Contoso utilise Microsoft Defender XDR. Une règle de détection personnalisée nommée **Rule-LOLBin** déclenche des alertes quand certutil.exe télécharge des fichiers. Chaque nuit, un outil de déploiement de logiciels exécute certutil.exe sur les serveurs du groupe d'appareils **DG-Servers**, ce qui crée des dizaines d'alertes bénignes.

        La règle doit continuer à détecter ce comportement sur tous les appareils, y compris les serveurs de DG-Servers quand l'outil de déploiement n'est pas en cause.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Turn off Rule-LOLBin before the nightly deployments, and turn it on again every morning.", fr: "Désactiver Rule-LOLBin avant les déploiements nocturnes, puis la réactiver chaque matin." } }
        - { id: b, text: { en: "Exclude Rule-LOLBin from correlation, so that its alerts stay out of incidents.", fr: "Exclure Rule-LOLBin de la corrélation, afin que ses alertes restent en dehors des incidents." } }
        - { id: c, text: { en: "Change the query of Rule-LOLBin so that it excludes the activity of the deployment tool.", fr: "Modifier la requête de Rule-LOLBin pour qu'elle exclue l'activité de l'outil de déploiement." } }
        - { id: d, text: { en: "Change the scope of Rule-LOLBin to every device group except DG-Servers.", fr: "Modifier l'étendue de Rule-LOLBin pour couvrir tous les groupes d'appareils sauf DG-Servers." } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          The alerts come from legitimate activity that the query can identify, such as the parent process of the deployment tool. Editing the query, from Edit or Modify query on the rule, removes only that activity, and the change applies from the next run, so the rule keeps detecting certutil.exe everywhere else.
        fr: |
          Les alertes proviennent d'une activité légitime que la requête peut identifier, comme le processus parent de l'outil de déploiement. Modifier la requête, avec Edit ou Modify query sur la règle, ne retire que cette activité, et la modification s'applique dès l'exécution suivante : la règle continue donc à détecter certutil.exe partout ailleurs.
      options:
        a: { en: "While the rule is off, it detects nothing on any device, which breaks the requirement.", fr: "Tant que la règle est désactivée, elle ne détecte rien sur aucun appareil, ce qui enfreint l'exigence." }
        b: { en: "Excluding the rule from correlation only changes how its alerts are grouped; the benign alerts are still created.", fr: "Exclure la règle de la corrélation ne change que le regroupement de ses alertes ; les alertes bénignes sont toujours créées." }
        d: { en: "Removing DG-Servers from the scope also stops the detection on those servers when the tool isn't involved.", fr: "Retirer DG-Servers de l'étendue arrête aussi la détection sur ces serveurs quand l'outil n'est pas en cause." }
    references:
      - title: Manage custom detection rules in Microsoft Defender XDR - Microsoft Defender XDR
        url: https://learn.microsoft.com/en-us/defender-xdr/custom-detection-manage

  # ------------------------------------------------------------------ 5
  - id: sc200-qz-15-05
    objective: "1.4.4"
    difficulty: 2
    status: draft
    type: hotarea
    stem:
      en: |
        Tailspin has onboarded a Microsoft Sentinel workspace to the Microsoft Defender portal. On the MITRE ATT&CK page, you compare the **Current coverage** view with the **Simulated rules** view (rule templates selected) for four techniques. You also count the hunting queries mapped to each technique.

        The following table shows the results.

        Answer each prompt by selecting the appropriate technique.

        NOTE: Each correct selection is worth one point.
      fr: |
        Tailspin a intégré un espace de travail Microsoft Sentinel au portail Microsoft Defender. Sur la page MITRE ATT&CK, vous comparez la vue **Current coverage** avec la vue **Simulated rules** (modèles de règles sélectionnés) pour quatre techniques. Vous comptez aussi les requêtes de chasse mappées à chaque technique.

        Le tableau suivant présente les résultats.

        Répondez à chaque invite en sélectionnant la technique appropriée.

        Remarque : chaque sélection correcte vaut un point.
    body:
      prompts:
        - id: p1
          text: { en: "The technique that has no active detection today and that you can cover by creating a rule from a rule template", fr: "La technique qui n'a aucune détection active aujourd'hui et que vous pouvez couvrir en créant une règle à partir d'un modèle de règle" }
        - id: p2
          text: { en: "The technique for which you must write and map your own analytics rule to obtain an active detection", fr: "La technique pour laquelle vous devez écrire et mapper votre propre règle d'analytique pour obtenir une détection active" }
      grid:
        header: [{ en: "Technique", fr: "Technique" }, { en: "Active scheduled and NRT rules", fr: "Règles planifiées et NRT actives" }, { en: "Mapped hunting queries", fr: "Requêtes de chasse mappées" }, { en: "Unused rule templates (Simulated rules)", fr: "Modèles de règles non utilisés (Simulated rules)" }]
        rows:
          - [{ text: "T1078 Valid Accounts", area: t1078 }, { text: "2" }, { text: "0" }, { text: "1" }]
          - [{ text: "T1059 Command and Scripting Interpreter", area: t1059 }, { text: "0" }, { text: "3" }, { text: "0" }]
          - [{ text: "T1566 Phishing", area: t1566 }, { text: "0" }, { text: "0" }, { text: "2" }]
          - [{ text: "T1110 Brute Force", area: t1110 }, { text: "1" }, { text: "2" }, { text: "0" }]
    answer:
      values: { p1: t1566, p2: t1059 }
    explanation:
      correct:
        en: |
          The Current coverage view counts only active scheduled and NRT rules, and the Simulated rules view shows the coverage you would get from detections that are available but not configured, such as rule templates. T1566 has no active rule but two unused templates, so creating a rule from one of them closes the gap. T1059 has no active rule and no template: its hunting queries don't count as detections, so you must write a rule and map it to T1059 on its General tab.
        fr: |
          La vue Current coverage ne compte que les règles planifiées et NRT actives, et la vue Simulated rules montre la couverture que donneraient les détections disponibles mais non configurées, comme les modèles de règles. T1566 n'a aucune règle active mais deux modèles non utilisés : créer une règle à partir de l'un d'eux comble la lacune. T1059 n'a ni règle active ni modèle : ses requêtes de chasse ne comptent pas comme des détections, vous devez donc écrire une règle et la mapper à T1059 dans son onglet Général.
      options:
        t1078: { en: "T1078 already has two active rules; its unused template would only add to an existing coverage.", fr: "T1078 a déjà deux règles actives ; son modèle non utilisé ne ferait qu'ajouter à une couverture existante." }
        t1110: { en: "T1110 already has an active rule, so it isn't a gap in the Current coverage view.", fr: "T1110 a déjà une règle active : ce n'est pas une lacune dans la vue Current coverage." }
    references:
      - title: View MITRE ATT&CK Coverage in Microsoft Sentinel
        url: https://learn.microsoft.com/en-us/azure/sentinel/mitre-coverage

  # ------------------------------------------------------------------ 6
  - id: sc200-qz-15-06
    objective: "1.4.3"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Litware has a Microsoft Sentinel workspace. A partner shares IP address indicators through a TAXII server, and a TAXII data connector imports them into the workspace every hour. The Azure Activity data connector is connected.

        You need alerts whenever an IP address from the partner's indicators appears in the Azure activity logs. The rule must run every 30 minutes and raise High severity alerts. The solution must minimize administrative effort.

        What should you do?
      fr: |
        Litware dispose d'un espace de travail Microsoft Sentinel. Un partenaire partage des indicateurs d'adresses IP via un serveur TAXII, et un connecteur de données TAXII les importe dans l'espace de travail toutes les heures. Le connecteur de données Azure Activity est connecté.

        Vous avez besoin d'alertes chaque fois qu'une adresse IP des indicateurs du partenaire apparaît dans les journaux d'activité Azure. La règle doit s'exécuter toutes les 30 minutes et déclencher des alertes de gravité High. La solution doit réduire au minimum l'effort d'administration.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Create a rule from the Microsoft Defender Threat Intelligence Analytics template, then change its schedule and severity.", fr: "Créer une règle à partir du modèle Microsoft Defender Threat Intelligence Analytics, puis modifier sa planification et sa gravité." } }
        - { id: b, text: { en: "Create a rule from the TI map IP entity to AzureActivity template, then change its schedule and severity.", fr: "Créer une règle à partir du modèle TI map IP entity to AzureActivity, puis modifier sa planification et sa gravité." } }
        - { id: c, text: { en: "Duplicate a built-in anomaly rule that analyzes Azure operations, then lower its threshold for the partner's addresses.", fr: "Dupliquer une règle d'anomalie intégrée qui analyse les opérations Azure, puis abaisser son seuil pour les adresses du partenaire." } }
        - { id: d, text: { en: "Write a new scheduled analytics rule that joins the threat indicators with AzureActivity, then map its entities.", fr: "Écrire une nouvelle règle d'analytique planifiée qui joint les indicateurs de menace à AzureActivity, puis mapper ses entités." } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          The TI map templates are built-in scheduled rules that match the threat indicators stored in the workspace, whatever their source, with a data source; TI map IP entity to AzureActivity matches IP indicators with Azure activity events. Because the rule created from it is a scheduled rule, you can change its schedule, threshold and severity in the wizard, without writing the matching logic yourself.
        fr: |
          Les modèles TI map sont des règles planifiées intégrées qui comparent les indicateurs de menace stockés dans l'espace de travail, quelle que soit leur source, à une source de données ; TI map IP entity to AzureActivity compare les indicateurs d'IP aux événements d'activité Azure. Comme la règle créée à partir de ce modèle est une règle planifiée, vous pouvez modifier sa planification, son seuil et sa gravité dans l'assistant, sans écrire vous-même la logique de comparaison.
      options:
        a: { en: "This rule matches only Microsoft-generated indicators, not the partner's, and its details are read only.", fr: "Cette règle ne compare que les indicateurs générés par Microsoft, pas ceux du partenaire, et ses détails sont en lecture seule." }
        c: { en: "Anomaly rules learn baselines and write to the Anomalies table; they don't match indicators or raise alerts.", fr: "Les règles d'anomalie apprennent des lignes de base et écrivent dans la table Anomalies ; elles ne comparent pas d'indicateurs et ne déclenchent pas d'alertes." }
        d: { en: "A rule written from scratch works but requires writing and maintaining the query that a built-in template already provides.", fr: "Une règle écrite de zéro fonctionne, mais exige d'écrire et de maintenir la requête qu'un modèle intégré fournit déjà." }
    references:
      - title: Use Threat Indicators in Analytics Rules - Microsoft Sentinel
        url: https://learn.microsoft.com/en-us/azure/sentinel/use-threat-indicators-in-analytics-rules
      - title: Use matching analytics to detect threats - Microsoft Sentinel
        url: https://learn.microsoft.com/en-us/azure/sentinel/use-matching-analytics-to-detect-threats

  # ------------------------------------------------------------------ 7
  - id: sc200-qz-15-07
    objective: "1.4.1"
    difficulty: 3
    status: draft
    type: dropdown
    stem:
      en: |
        Fabrikam uses Microsoft Defender XDR and has onboarded a Microsoft Sentinel workspace named **LAW1** to the Microsoft Defender portal. The Defender XDR tables aren't streamed to LAW1, and the Microsoft Entra sign-in logs are collected only in LAW1.

        You are creating three custom detection rules:

        - **Rule1** queries DeviceFileEvents and joins it with DeviceInfo. It must raise alerts as soon as possible.
        - **Rule2** queries only SigninLogs. It must run every 20 minutes.
        - **Rule3** queries only IdentityLogonEvents with where and project operators. It must raise alerts as soon as possible.

        Which frequency should you select for each rule? Select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Fabrikam utilise Microsoft Defender XDR et a intégré un espace de travail Microsoft Sentinel nommé **LAW1** au portail Microsoft Defender. Les tables Defender XDR ne sont pas transmises à LAW1, et les journaux de connexion Microsoft Entra ne sont collectés que dans LAW1.

        Vous créez trois règles de détection personnalisées :

        - **Rule1** interroge DeviceFileEvents et la joint à DeviceInfo. Elle doit déclencher des alertes le plus tôt possible.
        - **Rule2** interroge uniquement SigninLogs. Elle doit s'exécuter toutes les 20 minutes.
        - **Rule3** interroge uniquement IdentityLogonEvents avec les opérateurs where et project. Elle doit déclencher des alertes le plus tôt possible.

        Quelle fréquence devez-vous sélectionner pour chaque règle ? Sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: text
      template:
        en: |
          Rule1: [[r1]]

          Rule2: [[r2]]

          Rule3: [[r3]]
        fr: |
          Rule1 : [[r1]]

          Rule2 : [[r2]]

          Rule3 : [[r3]]
      slots:
        - id: r1
          options:
            - { id: nrt, text: "Continuous (NRT)" }
            - { id: hour, text: Every hour }
            - { id: three, text: Every 3 hours }
            - { id: custom, text: Custom }
        - id: r2
          options:
            - { id: nrt, text: "Continuous (NRT)" }
            - { id: hour, text: Every hour }
            - { id: three, text: Every 3 hours }
            - { id: custom, text: Custom }
        - id: r3
          options:
            - { id: nrt, text: "Continuous (NRT)" }
            - { id: hour, text: Every hour }
            - { id: three, text: Every 3 hours }
            - { id: custom, text: Custom }
    answer:
      values: { r1: hour, r2: custom, r3: nrt }
    explanation:
      correct:
        en: |
          Continuous (NRT) requires a query on a single supported table without join, union or externaldata, so Rule1 can't use it; the Custom frequency is available only for data that Microsoft Sentinel ingests, so the fastest option left for Rule1's Defender XDR data is Every hour. Rule2 uses only Sentinel data, so Custom lets it run every 20 minutes (from 5 minutes to 14 days). Rule3 queries one supported table with simple operators, so Continuous (NRT) gives the fastest alerts.
        fr: |
          Continuous (NRT) exige une requête sur une seule table prise en charge, sans join, union ni externaldata : Rule1 ne peut donc pas l'utiliser ; la fréquence Custom n'est disponible que pour les données ingérées par Microsoft Sentinel, si bien que l'option la plus rapide qui reste pour les données Defender XDR de Rule1 est Every hour. Rule2 n'utilise que des données Sentinel : Custom lui permet de s'exécuter toutes les 20 minutes (de 5 minutes à 14 jours). Rule3 interroge une seule table prise en charge avec des opérateurs simples : Continuous (NRT) donne les alertes les plus rapides.
      options:
        nrt: { en: "For Rule1, the join makes the query incompatible with Continuous (NRT). For Rule2, Continuous runs in near real time, not on a 20-minute schedule.", fr: "Pour Rule1, la jointure rend la requête incompatible avec Continuous (NRT). Pour Rule2, Continuous s'exécute en quasi temps réel, pas selon une planification de 20 minutes." }
        custom: { en: "For Rule1 and Rule3, Custom isn't offered: it applies only to data ingested by Microsoft Sentinel, and Rule3 can use the faster Continuous frequency anyway.", fr: "Pour Rule1 et Rule3, Custom n'est pas proposée : elle ne s'applique qu'aux données ingérées par Microsoft Sentinel, et Rule3 peut de toute façon utiliser la fréquence Continuous, plus rapide." }
        three: { en: "Every 3 hours meets none of the requirements: it's slower than Every hour and isn't a 20-minute schedule.", fr: "Every 3 hours ne répond à aucune exigence : elle est plus lente que Every hour et n'est pas une planification de 20 minutes." }
    references:
      - title: Create custom detection rules in Microsoft Defender XDR
        url: https://learn.microsoft.com/en-us/defender-xdr/custom-detection-rules

  # ------------------------------------------------------------------ 8
  - id: sc200-qz-15-08
    objective: "1.4.3"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Proseware has a Microsoft Sentinel workspace onboarded to the Microsoft Defender portal. A scheduled analytics rule named **Rule-Exfil** runs an alert-trigger playbook named **PB-Enrich**, which is attached in the **Alert automation (classic)** section of the rule's **Automated response** tab. The SOC learns that this way of running playbooks is deprecated.

        You need PB-Enrich to keep running for every alert of Rule-Exfil. The playbook must not be modified.

        What should you do?
      fr: |
        Proseware dispose d'un espace de travail Microsoft Sentinel intégré au portail Microsoft Defender. Une règle d'analytique planifiée nommée **Rule-Exfil** exécute un playbook à déclencheur d'alerte nommé **PB-Enrich**, associé dans la section **Alert automation (classic)** de l'onglet **Réponse automatisée** de la règle. Le SOC apprend que cette façon d'exécuter des playbooks est dépréciée.

        Vous devez faire en sorte que PB-Enrich continue à s'exécuter pour chaque alerte de Rule-Exfil. Le playbook ne doit pas être modifié.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Create an automation rule with the When incident is created trigger for Rule-Exfil that runs PB-Enrich, then remove the classic entry.", fr: "Créer une règle d'automatisation avec le déclencheur When incident is created pour Rule-Exfil qui exécute PB-Enrich, puis supprimer l'entrée classique." } }
        - { id: b, text: { en: "Remove the classic entry, then add PB-Enrich again in Alert automation (classic) so that it's registered again.", fr: "Supprimer l'entrée classique, puis ajouter de nouveau PB-Enrich dans Alert automation (classic) pour qu'il soit réinscrit." } }
        - { id: c, text: { en: "Create an automation rule with the When alert is created trigger for Rule-Exfil that runs PB-Enrich, then remove the classic entry.", fr: "Créer une règle d'automatisation avec le déclencheur When alert is created pour Rule-Exfil qui exécute PB-Enrich, puis supprimer l'entrée classique." } }
        - { id: d, text: { en: "Re-create Rule-Exfil as a custom detection rule, and select PB-Enrich as one of the response actions of the rule.", fr: "Recréer Rule-Exfil sous forme de règle de détection personnalisée, et sélectionner PB-Enrich comme l'une des actions de réponse de la règle." } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          Alert-trigger playbooks attached to analytics rules are deprecated, effective March 2026. You migrate them by creating an automation rule that uses the alert-created trigger, scoped to the analytics rule and invoking the playbook, then removing the classic entry. The playbook keeps its alert trigger, so it doesn't need any change.
        fr: |
          Les playbooks à déclencheur d'alerte associés aux règles d'analytique sont dépréciés depuis mars 2026. Vous les migrez en créant une règle d'automatisation qui utilise le déclencheur de création d'alerte, limitée à la règle d'analytique et qui appelle le playbook, puis en supprimant l'entrée classique. Le playbook conserve son déclencheur d'alerte : il n'a besoin d'aucune modification.
      options:
        a: { en: "An incident-trigger automation rule runs incident-trigger playbooks only, and it runs per incident, not for every alert.", fr: "Une règle d'automatisation à déclencheur d'incident n'exécute que des playbooks à déclencheur d'incident, et elle s'exécute par incident, pas pour chaque alerte." }
        b: { en: "New playbooks can no longer be added to Alert automation (classic), and this section is the deprecated mechanism itself.", fr: "On ne peut plus ajouter de nouveaux playbooks dans Alert automation (classic), et cette section est le mécanisme déprécié lui-même." }
        d: { en: "Custom detection response actions are built-in actions on devices, files, users and emails; they don't run playbooks.", fr: "Les actions de réponse des détections personnalisées sont des actions intégrées sur les appareils, les fichiers, les utilisateurs et les e-mails ; elles n'exécutent pas de playbooks." }
    references:
      - title: Create scheduled analytics rules in Microsoft Sentinel
        url: https://learn.microsoft.com/en-us/azure/sentinel/create-analytics-rules

  # ------------------------------------------------------------------ 9
  - id: sc200-qz-15-09
    objective: "1.4.3"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        Wingtip has a Microsoft Sentinel workspace. Its firewalls send CEF logs, including the requested URLs, to the **CommonSecurityLog** table. You created a rule from the **Microsoft Defender Threat Intelligence Analytics** template.

        During one morning, three devices connect to the same domain, which Microsoft threat intelligence identifies as malicious. The firewalls allow the first connection and block the two others.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Wingtip dispose d'un espace de travail Microsoft Sentinel. Ses pare-feu envoient des journaux CEF, y compris les URL demandées, à la table **CommonSecurityLog**. Vous avez créé une règle à partir du modèle **Microsoft Defender Threat Intelligence Analytics**.

        Au cours d'une matinée, trois appareils se connectent au même domaine, que le renseignement sur les menaces de Microsoft identifie comme malveillant. Les pare-feu autorisent la première connexion et bloquent les deux autres.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text: { en: "The alerts for the three connections are grouped into a single incident.", fr: "Les alertes des trois connexions sont regroupées dans un seul incident." }
        - id: s2
          text: { en: "The severity of the incident equals the severity of the alert for the allowed connection.", fr: "La gravité de l'incident est égale à la gravité de l'alerte de la connexion autorisée." }
        - id: s3
          text: { en: "You can edit the query of the rule so that it ignores the connections of a test device.", fr: "Vous pouvez modifier la requête de la règle pour qu'elle ignore les connexions d'un appareil de test." }
    answer:
      values: { s1: true, s2: true, s3: false }
    explanation:
      correct:
        en: |
          The rule groups its alerts by indicator: every alert matching the same indicator within 24 hours goes into one incident. A match on allowed traffic gets a higher severity (High) than a match on blocked traffic (Low or Medium), and the incident takes the highest severity of its alerts, here the allowed connection's. The rule created from this template is read only, so you can't edit its query.
        fr: |
          La règle regroupe ses alertes par indicateur : toutes les alertes qui correspondent au même indicateur sur 24 heures vont dans un seul incident. Une correspondance sur un trafic autorisé reçoit une gravité plus élevée (High) qu'une correspondance sur un trafic bloqué (Low ou Medium), et l'incident prend la gravité la plus élevée de ses alertes, ici celle de la connexion autorisée. La règle créée à partir de ce modèle est en lecture seule : vous ne pouvez pas modifier sa requête.
      options:
        s3: { en: "The details of the Microsoft Defender Threat Intelligence Analytics rule are read only; to control the matching logic, use a scheduled rule instead.", fr: "Les détails de la règle Microsoft Defender Threat Intelligence Analytics sont en lecture seule ; pour contrôler la logique de comparaison, utilisez plutôt une règle planifiée." }
    references:
      - title: Use matching analytics to detect threats - Microsoft Sentinel
        url: https://learn.microsoft.com/en-us/azure/sentinel/use-matching-analytics-to-detect-threats

  # ------------------------------------------------------------------ 10
  - id: sc200-qz-15-10
    objective: "1.4.5"
    difficulty: 3
    status: draft
    type: dropdown
    stem:
      en: |
        Contoso has a Microsoft Sentinel workspace. Several built-in anomaly rules about user activity run in Production mode. For two of them, you created customized copies that run in Flighting mode to test new thresholds.

        You are creating a scheduled analytics rule that runs every hour on the data of the last hour. The rule must raise an alert for each successful sign-in of a user for whom an anomaly was recorded. It must ignore the results of the anomaly rule versions that are still being tested.

        How should you complete the query? Select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Contoso dispose d'un espace de travail Microsoft Sentinel. Plusieurs règles d'anomalie intégrées sur l'activité des utilisateurs s'exécutent en mode Production. Pour deux d'entre elles, vous avez créé des copies personnalisées qui s'exécutent en mode Flighting afin de tester de nouveaux seuils.

        Vous créez une règle d'analytique planifiée qui s'exécute toutes les heures sur les données de la dernière heure. La règle doit déclencher une alerte pour chaque connexion réussie d'un utilisateur pour lequel une anomalie a été enregistrée. Elle doit ignorer les résultats des versions de règles d'anomalie qui sont encore en test.

        Comment devez-vous compléter la requête ? Sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: code
      language: kusto
      template: |
        let AnomalousUsers = [[table]]
        | where RuleStatus == [[status]]
        | distinct UserPrincipalName;
        SigninLogs
        | where ResultType == "0"
        | where UserPrincipalName [[op]] (AnomalousUsers)
        | project TimeGenerated, UserPrincipalName, IPAddress, AppDisplayName
      slots:
        - id: table
          options:
            - { id: alert, text: SecurityAlert }
            - { id: anomalies, text: Anomalies }
            - { id: behavior, text: BehaviorAnalytics }
            - { id: incident, text: SecurityIncident }
        - id: status
          options:
            - { id: flighting, text: '"Flighting"' }
            - { id: enabled, text: '"Enabled"' }
            - { id: production, text: '"Production"' }
        - id: op
          options:
            - { id: eq, text: "==" }
            - { id: has, text: has }
            - { id: notin, text: "!in" }
            - { id: in, text: in }
    answer:
      values: { table: anomalies, status: production, op: in }
    explanation:
      correct:
        en: |
          Anomaly rules don't create alerts: built-in rules and their customized copies write their results to the Anomalies table, so a scheduled rule must query that table to be alerted. Its RuleStatus column records whether the rule version that generated the anomaly runs in Flighting or Production, so keeping "Production" ignores the copies under test. The in operator then keeps the sign-ins whose UserPrincipalName belongs to the list returned by the let statement.
        fr: |
          Les règles d'anomalie ne créent pas d'alertes : les règles intégrées et leurs copies personnalisées écrivent leurs résultats dans la table Anomalies ; une règle planifiée doit donc interroger cette table pour être alertée. Sa colonne RuleStatus indique si la version de règle qui a généré l'anomalie s'exécute en Flighting ou en Production : conserver "Production" ignore les copies en test. L'opérateur in garde ensuite les connexions dont UserPrincipalName appartient à la liste renvoyée par l'instruction let.
      options:
        alert: { en: "SecurityAlert holds alerts; anomaly rules never write alerts there.", fr: "SecurityAlert contient des alertes ; les règles d'anomalie n'y écrivent jamais d'alertes." }
        behavior: { en: "BehaviorAnalytics holds UEBA enriched activity records, not the results of the anomaly rules with their RuleStatus.", fr: "BehaviorAnalytics contient les enregistrements d'activité enrichis par UEBA, pas les résultats des règles d'anomalie avec leur RuleStatus." }
        flighting: { en: "Flighting is the status of the copies under test: keeping it selects exactly the results to ignore.", fr: "Flighting est l'état des copies en test : le conserver sélectionne précisément les résultats à ignorer." }
        enabled: { en: "RuleStatus records Flighting or Production; Enabled describes whether a rule runs, not this column's values.", fr: "RuleStatus enregistre Flighting ou Production ; Enabled indique si une règle s'exécute, ce ne sont pas les valeurs de cette colonne." }
        notin: { en: "!in keeps the sign-ins of users who have no anomaly, the opposite of the requirement.", fr: "!in garde les connexions des utilisateurs qui n'ont aucune anomalie, soit l'inverse de l'exigence." }
        has: { en: "has looks for a term inside a string value; it doesn't test membership in the list returned by AnomalousUsers.", fr: "has recherche un terme dans une valeur de chaîne ; il ne teste pas l'appartenance à la liste renvoyée par AnomalousUsers." }
        eq: { en: "== compares with a single scalar value; it can't test membership in the list returned by AnomalousUsers.", fr: "== compare à une seule valeur scalaire ; il ne peut pas tester l'appartenance à la liste renvoyée par AnomalousUsers." }
    references:
      - title: Work with anomaly detection analytics rules in Microsoft Sentinel
        url: https://learn.microsoft.com/en-us/azure/sentinel/work-with-anomaly-rules
      - title: Azure Monitor Logs reference - Anomalies - Azure Monitor
        url: https://learn.microsoft.com/en-us/azure/azure-monitor/reference/tables/anomalies
