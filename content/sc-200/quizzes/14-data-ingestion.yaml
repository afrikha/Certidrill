chapter: 14-data-ingestion
questions:
  # ------------------------------------------------------------------ 1
  - id: sc200-qz-14-01
    objective: "1.3.1"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Adatum uses Microsoft Defender for Endpoint and Microsoft Defender for Office 365. Adatum has onboarded two Microsoft Sentinel workspaces to the Microsoft Defender portal: **law-corp**, selected as the primary workspace, and **law-labs**.

        To which workspaces are the Microsoft Defender XDR incidents and alerts synchronized?
      fr: |
        Adatum utilise Microsoft Defender for Endpoint et Microsoft Defender for Office 365. Adatum a intégré deux espaces de travail Microsoft Sentinel au portail Microsoft Defender : **law-corp**, sélectionné comme espace de travail principal, et **law-labs**.

        Vers quels espaces de travail les incidents et les alertes Microsoft Defender XDR sont-ils synchronisés ?
    body:
      options:
        - { id: a, text: { en: "law-corp only, because the Defender XDR connector is connected to the primary workspace", fr: "law-corp uniquement, car le connecteur Defender XDR est connecté à l'espace de travail principal" } }
        - { id: b, text: { en: "Both law-corp and law-labs, because each onboarded workspace receives its own copy", fr: "law-corp et law-labs, car chaque espace de travail intégré en reçoit sa propre copie" } }
        - { id: c, text: { en: "law-labs only, because secondary workspaces receive the tenant-based alerts", fr: "law-labs uniquement, car les espaces de travail secondaires reçoivent les alertes au niveau du locataire" } }
        - { id: d, text: { en: "Neither, until you enable the standalone Defender for Endpoint connector in each workspace", fr: "Aucun, tant que vous n'activez pas le connecteur autonome Defender for Endpoint dans chaque espace de travail" } }
    answer: { optionId: a }
    explanation:
      correct:
        en: |
          In the Defender portal, the Microsoft Defender XDR connector for incidents and alerts is connected to the primary workspace only, so all Defender XDR alerts and incidents are synced to law-corp. Secondary workspaces can still ingest Defender XDR tables if you configure them, but they don't receive the incidents and alerts.
        fr: |
          Dans le portail Defender, le connecteur Microsoft Defender XDR des incidents et des alertes n'est connecté qu'à l'espace de travail principal : toutes les alertes et tous les incidents Defender XDR sont donc synchronisés vers law-corp. Les espaces de travail secondaires peuvent quand même ingérer des tables Defender XDR si vous les configurez, mais ils ne reçoivent pas les incidents et les alertes.
      options:
        b: { en: "Syncing the alerts to several workspaces would duplicate them; only the primary workspace receives them.", fr: "Synchroniser les alertes vers plusieurs espaces de travail les dupliquerait ; seul l'espace de travail principal les reçoit." }
        c: { en: "Tenant-based alerts surface only in the primary workspace, never in the secondary ones.", fr: "Les alertes au niveau du locataire n'apparaissent que dans l'espace de travail principal, jamais dans les secondaires." }
        d: { en: "Standalone Defender connectors are disconnected at onboarding; the Defender XDR connector already syncs the primary workspace.", fr: "Les connecteurs Defender autonomes sont déconnectés lors de l'intégration ; le connecteur Defender XDR synchronise déjà l'espace de travail principal." }
    references:
      - title: Multiple workspaces - Microsoft Sentinel in Defender portal
        url: https://learn.microsoft.com/en-us/azure/sentinel/workspaces-defender-portal

  # ------------------------------------------------------------------ 2
  - id: sc200-qz-14-02
    objective: "1.3.3"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Contoso plans Windows Event Forwarding to a Windows Event Collector named **WEC01**, whose forwarded events will be collected into Microsoft Sentinel. Most sources are domain-joined servers, but 60 servers in a perimeter network belong to a workgroup and can't join the domain, so Kerberos authentication isn't an option for them.

        How should the workgroup servers authenticate to WEC01?
      fr: |
        Contoso prévoit un transfert d'événements Windows vers un collecteur d'événements Windows nommé **WEC01**, dont les événements transférés seront collectés dans Microsoft Sentinel. La plupart des sources sont des serveurs joints au domaine, mais 60 serveurs d'un réseau de périmètre appartiennent à un groupe de travail et ne peuvent pas rejoindre le domaine : l'authentification Kerberos n'est donc pas possible pour eux.

        Comment les serveurs du groupe de travail doivent-ils s'authentifier auprès de WEC01 ?
    body:
      options:
        - { id: a, text: { en: "By using HTTPS with certificate-based mutual authentication", fr: "En utilisant HTTPS avec une authentification mutuelle par certificats" } }
        - { id: b, text: { en: "By using Kerberos with the NTLM fallback disabled by Group Policy", fr: "En utilisant Kerberos avec le repli NTLM désactivé par stratégie de groupe" } }
        - { id: c, text: { en: "By using a collector-initiated subscription with their computer accounts", fr: "En utilisant un abonnement initié par le collecteur avec leurs comptes d'ordinateur" } }
        - { id: d, text: { en: "By sending their events as Syslog messages to UDP port 514 of WEC01", fr: "En envoyant leurs événements comme messages Syslog sur le port UDP 514 de WEC01" } }
    answer: { optionId: a }
    explanation:
      correct:
        en: |
          When Kerberos-based mutual authentication isn't an option, WEF uses HTTPS with certificate-based authentication: the server certificate and the provisioned client certificates provide the mutual authentication. Domain-joined sources keep using Kerberos.
        fr: |
          Quand l'authentification mutuelle basée sur Kerberos n'est pas possible, WEF utilise HTTPS avec une authentification par certificats : le certificat du serveur et les certificats clients provisionnés assurent l'authentification mutuelle. Les sources jointes au domaine continuent d'utiliser Kerberos.
      options:
        b: { en: "Workgroup computers have no domain account, so they can't use Kerberos at all.", fr: "Les ordinateurs d'un groupe de travail n'ont pas de compte de domaine : ils ne peuvent pas du tout utiliser Kerberos." }
        c: { en: "Workgroup servers have no computer account in the domain, and the subscription type doesn't solve the authentication.", fr: "Les serveurs d'un groupe de travail n'ont pas de compte d'ordinateur dans le domaine, et le type d'abonnement ne règle pas l'authentification." }
        d: { en: "A Windows Event Collector receives WEF traffic over WinRM, not Syslog messages.", fr: "Un collecteur d'événements Windows reçoit le trafic WEF via WinRM, pas des messages Syslog." }
    references:
      - title: Use Windows Event Forwarding to help with intrusion detection
        url: https://learn.microsoft.com/en-us/windows/security/operating-system-security/device-management/use-windows-event-forwarding-to-assist-in-intrusion-detection

  # ------------------------------------------------------------------ 3
  - id: sc200-qz-14-03
    objective: "1.3.6"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Fabrikam ingests indicators from a commercial feed into Microsoft Sentinel by using the Threat Intelligence - TAXII data connector. A week ago, you created two threat intelligence ingestion rules for this feed, in the following order:

        1. **Rule1**: if the confidence is lower than 40, **Delete**.
        2. **Rule2**: for all objects, extend **Valid until** by 30 days.

        Today, the feed sends a new indicator whose confidence is 25.

        What happens to this indicator?
      fr: |
        Fabrikam ingère dans Microsoft Sentinel les indicateurs d'un flux commercial à l'aide du connecteur de données Threat Intelligence - TAXII. Il y a une semaine, vous avez créé deux règles d'ingestion du renseignement sur les menaces pour ce flux, dans l'ordre suivant :

        1. **Rule1** : si la confiance est inférieure à 40, **Delete**.
        2. **Rule2** : pour tous les objets, prolonger **Valid until** de 30 jours.

        Aujourd'hui, le flux envoie un nouvel indicateur dont la confiance est de 25.

        Qu'advient-il de cet indicateur ?
    body:
      options:
        - { id: a, text: { en: "It's skipped for ingestion, and Rule2 never processes it.", fr: "Il est écarté de l'ingestion, et Rule2 ne le traite jamais." } }
        - { id: b, text: { en: "It's ingested, and Rule2 extends its Valid until date by 30 days.", fr: "Il est ingéré, et Rule2 prolonge sa date Valid until de 30 jours." } }
        - { id: c, text: { en: "It's ingested, and Rule1 deletes it from the workspace a day later.", fr: "Il est ingéré, puis Rule1 le supprime de l'espace de travail un jour plus tard." } }
        - { id: d, text: { en: "It's ingested unchanged, because Delete applies only to manual indicators.", fr: "Il est ingéré sans modification, car Delete ne s'applique qu'aux indicateurs manuels." } }
    answer: { optionId: a }
    explanation:
      correct:
        en: |
          Ingestion rules act on objects coming from connectors before they're ingested, and they run in order. An object is processed by each rule until a Delete action is taken: Rule1 skips the indicator, so it's never stored and Rule2 never sees it.
        fr: |
          Les règles d'ingestion agissent sur les objets provenant des connecteurs avant leur ingestion, et elles s'exécutent dans l'ordre. Un objet est traité par chaque règle jusqu'à ce qu'une action Delete soit appliquée : Rule1 écarte l'indicateur, qui n'est donc jamais stocké, et Rule2 ne le voit jamais.
      options:
        b: { en: "Rule1 comes first and deletes the indicator, so processing stops before Rule2.", fr: "Rule1 passe en premier et supprime l'indicateur : le traitement s'arrête donc avant Rule2." }
        c: { en: "Delete acts before ingestion: the indicator is removed from the pipeline, not deleted afterwards.", fr: "Delete agit avant l'ingestion : l'indicateur est retiré du pipeline, pas supprimé après coup." }
        d: { en: "Ingestion rules apply to connector data only; manual and upload API indicators are the ones they don't affect.", fr: "Les règles d'ingestion ne s'appliquent qu'aux données des connecteurs ; ce sont les indicateurs manuels et ceux de l'API de chargement qu'elles n'affectent pas." }
    references:
      - title: Threat intelligence - Microsoft Sentinel
        url: https://learn.microsoft.com/en-us/azure/sentinel/understand-threat-intelligence

  # ------------------------------------------------------------------ 4
  - id: sc200-qz-14-04
    objective: "1.3.4"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Tailspin Toys collects Syslog messages from Linux appliances in its Tokyo office (UTC+9) through a log forwarder whose time zone is set to UTC. The appliances write their local time in the Syslog header, without time zone information. The Syslog via AMA connector ingests the messages into the `Syslog` table.

        An analyst notices that, for the same message, the `EventTime` value is about nine hours later than the `TimeGenerated` value.

        What explains the difference?
      fr: |
        Tailspin Toys collecte les messages Syslog d'appliances Linux de son bureau de Tokyo (UTC+9) par un redirecteur de journaux dont le fuseau horaire est UTC. Les appliances écrivent leur heure locale dans l'en-tête Syslog, sans information de fuseau horaire. Le connecteur Syslog via AMA ingère les messages dans la table `Syslog`.

        Un analyste remarque que, pour un même message, la valeur `EventTime` est environ neuf heures plus tard que la valeur `TimeGenerated`.

        Qu'est-ce qui explique cet écart ?
    body:
      options:
        - { id: a, text: { en: "EventTime is read from the header with the forwarder's UTC offset; TimeGenerated is when the forwarder processed the message.", fr: "EventTime est lu dans l'en-tête avec le décalage UTC du redirecteur ; TimeGenerated est l'heure de traitement du message par le redirecteur." } }
        - { id: b, text: { en: "TimeGenerated comes from the Syslog header, and EventTime is the time when the record reached the Azure Monitor ingestion point.", fr: "TimeGenerated provient de l'en-tête Syslog, et EventTime est l'heure d'arrivée de l'enregistrement au point d'ingestion Azure Monitor." } }
        - { id: c, text: { en: "The Azure Monitor Agent buffers the messages for several hours, and TimeGenerated records when the buffering started.", fr: "L'agent Azure Monitor met les messages en mémoire tampon pendant plusieurs heures, et TimeGenerated enregistre le début de la mise en mémoire tampon." } }
        - { id: d, text: { en: "The data collection rule converts TimeGenerated to the time zone of the workspace region, but not EventTime.", fr: "La règle de collecte de données convertit TimeGenerated dans le fuseau horaire de la région de l'espace de travail, mais pas EventTime." } }
    answer: { optionId: a }
    explanation:
      correct:
        en: |
          TimeGenerated is the UTC time when the machine that hosts the forwarder processed the message. EventTime is extracted from the Syslog header, which has no time zone, and is converted to UTC with the forwarder's own offset. A Tokyo local time read as UTC ends up nine hours later than the real processing time.
        fr: |
          TimeGenerated est l'heure UTC à laquelle la machine qui héberge le redirecteur a traité le message. EventTime est extrait de l'en-tête Syslog, qui n'a pas de fuseau horaire, et converti en UTC avec le décalage propre au redirecteur. Une heure locale de Tokyo lue comme de l'UTC se retrouve neuf heures plus tard que l'heure réelle de traitement.
      options:
        b: { en: "The roles are reversed: EventTime comes from the header, and the time of arrival at the ingestion point is _TimeReceived.", fr: "Les rôles sont inversés : EventTime provient de l'en-tête, et l'heure d'arrivée au point d'ingestion est _TimeReceived." }
        c: { en: "Nothing in the scenario indicates a delay, and a buffering delay would make TimeGenerated later, not earlier.", fr: "Rien dans le scénario n'indique de retard, et un retard de mise en mémoire tampon rendrait TimeGenerated plus tardif, pas plus précoce." }
        d: { en: "TimeGenerated is stored in UTC; no setting converts it to the time zone of a region.", fr: "TimeGenerated est stocké en UTC ; aucun paramètre ne le convertit dans le fuseau horaire d'une région." }
    references:
      - title: Syslog and CEF AMA connectors - Microsoft Sentinel
        url: https://learn.microsoft.com/en-us/azure/sentinel/cef-syslog-ama-overview
      - title: Standard columns in Azure Monitor log records - Azure Monitor
        url: https://learn.microsoft.com/en-us/azure/azure-monitor/logs/log-standard-columns

  # ------------------------------------------------------------------ 5
  - id: sc200-qz-14-05
    objective: "1.3.7"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Northwind Traders sends records from an access control application to a DCR-based custom table named **BadgeEvents_CL** by using the Logs Ingestion API and a data collection rule named **DCR-Badge**. The application now also sends a **RiskScore** field, so you add a column named RiskScore to BadgeEvents_CL by using the schema editor.

        The next day, the RiskScore column is still empty in all the new records.

        What should you do?
      fr: |
        Northwind Traders envoie les enregistrements d'une application de contrôle d'accès vers une table personnalisée basée sur une DCR nommée **BadgeEvents_CL**, à l'aide de l'API d'ingestion de journaux et d'une règle de collecte de données nommée **DCR-Badge**. L'application envoie désormais aussi un champ **RiskScore** : vous ajoutez donc une colonne nommée RiskScore à BadgeEvents_CL avec l'éditeur de schéma.

        Le lendemain, la colonne RiskScore est toujours vide dans tous les nouveaux enregistrements.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Update DCR-Badge so that its stream declaration and its output include RiskScore.", fr: "Mettre à jour DCR-Badge pour que sa déclaration de flux et sa sortie incluent RiskScore." } }
        - { id: b, text: { en: "Rename the column to RiskScore_CF, the suffix that custom columns require.", fr: "Renommer la colonne en RiskScore_CF, le suffixe qu'exigent les colonnes personnalisées." } }
        - { id: c, text: { en: "Wait up to 48 hours for Azure Monitor to apply the new schema to DCR-Badge.", fr: "Attendre jusqu'à 48 heures qu'Azure Monitor applique le nouveau schéma à DCR-Badge." } }
        - { id: d, text: { en: "Assign the application the Monitoring Metrics Publisher role on BadgeEvents_CL.", fr: "Attribuer à l'application le rôle Monitoring Metrics Publisher sur BadgeEvents_CL." } }
    answer: { optionId: a }
    explanation:
      correct:
        en: |
          The schema declared in the DCR decides how Azure Monitor streams the data to the table, and Azure Monitor doesn't update DCRs when a table schema changes. Until DCR-Badge declares RiskScore in its input stream and keeps it in its output, the field is dropped before it reaches the table.
        fr: |
          Le schéma déclaré dans la DCR détermine comment Azure Monitor achemine les données vers la table, et Azure Monitor ne met pas à jour les DCR quand le schéma d'une table change. Tant que DCR-Badge ne déclare pas RiskScore dans son flux d'entrée et ne le conserve pas dans sa sortie, le champ est écarté avant d'atteindre la table.
      options:
        b: { en: "The _CF suffix is for custom columns added to Azure tables, not to a custom _CL table.", fr: "Le suffixe _CF concerne les colonnes personnalisées ajoutées aux tables Azure, pas à une table personnalisée _CL." }
        c: { en: "Azure Monitor never updates a DCR automatically after a schema change: waiting changes nothing.", fr: "Azure Monitor ne met jamais à jour une DCR automatiquement après une modification de schéma : attendre ne change rien." }
        d: { en: "The application already sends records successfully; the role is assigned on the DCR, not on a table.", fr: "L'application envoie déjà ses enregistrements avec succès ; le rôle s'attribue sur la DCR, pas sur une table." }
    references:
      - title: Add or Delete Tables and Columns in Azure Monitor Logs - Azure Monitor
        url: https://learn.microsoft.com/en-us/azure/azure-monitor/logs/create-custom-table

  # ------------------------------------------------------------------ 6
  - id: sc200-qz-14-06
    objective: "1.3.2"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        Litware collects the Security log of its servers by using the Windows Security Events via AMA connector. You're editing the Custom event set of the connector's data collection rule (DCR).

        The DCR must collect only the following events:

        - All failed sign-ins (event ID 4625)
        - Process creation events (event ID 4688) whose new process is `C:\Windows\System32\cmd.exe`

        Which two XPath entries should you add to the DCR? Each correct answer presents part of the solution.

        NOTE: Each correct selection is worth one point.
      fr: |
        Litware collecte le journal Sécurité de ses serveurs à l'aide du connecteur Windows Security Events via AMA. Vous modifiez le jeu d'événements Custom de la règle de collecte de données (DCR) du connecteur.

        La DCR doit collecter uniquement les événements suivants :

        - Toutes les connexions ayant échoué (ID d'événement 4625)
        - Les événements de création de processus (ID d'événement 4688) dont le nouveau processus est `C:\Windows\System32\cmd.exe`

        Quelles sont les deux entrées XPath à ajouter à la DCR ? Chaque bonne réponse présente une partie de la solution.

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 2
      options:
        - id: a
          text: '`Security!*[System[(EventID=4625)]]`'
        - id: b
          text: '`*[System[(EventID=4625)]]`'
        - id: c
          text: '`Security!*[System[(EventID=4688)]] and *[EventData[Data[@Name=''NewProcessName'']=''C:\Windows\System32\cmd.exe'']]`'
        - id: d
          text: '`Security!*[System[(EventID=4688)]] and *[EventData[contains(Data[@Name=''NewProcessName''],''cmd.exe'')]]`'
        - id: e
          text: '`System!*[System[(EventID=4625 or EventID=4688)]]`'
    answer: { optionIds: [a, c] }
    explanation:
      correct:
        en: |
          Each DCR entry has the form `LogName!XPath`, and both events are written to the Security log. The second entry combines the event ID with an `EventData` filter on the `NewProcessName` value, the same pattern Microsoft documents for filtering 4648 events on a process name. Filtering in the DCR happens on the server, so the other events are never sent.
        fr: |
          Chaque entrée d'une DCR a la forme `LogName!XPath`, et les deux événements sont écrits dans le journal Sécurité. La seconde entrée combine l'ID d'événement avec un filtre `EventData` sur la valeur `NewProcessName`, le même modèle que Microsoft documente pour filtrer les événements 4648 sur un nom de processus. Le filtrage de la DCR se fait sur le serveur : les autres événements ne sont jamais envoyés.
      options:
        b: { en: "This is the form passed to Get-WinEvent -FilterXPath; a DCR entry must start with the log name and !.", fr: "C'est la forme passée à Get-WinEvent -FilterXPath ; une entrée de DCR doit commencer par le nom du journal et !." }
        d: { en: "The XPath supported by Windows event logs doesn't support functions such as contains or starts-with.", fr: "Le XPath pris en charge par les journaux d'événements Windows ne prend pas en charge les fonctions comme contains ou starts-with." }
        e: { en: "Events 4625 and 4688 are written to the Security log, not to the System log; the cmd.exe filter is missing too.", fr: "Les événements 4625 et 4688 sont écrits dans le journal Sécurité, pas dans le journal Système ; le filtre sur cmd.exe manque aussi." }
    references:
      - title: Collect Windows events from virtual machines with Azure Monitor Agent - Azure Monitor
        url: https://learn.microsoft.com/en-us/azure/azure-monitor/vm/data-collection-windows-events

  # ------------------------------------------------------------------ 7
  - id: sc200-qz-14-07
    objective: "1.3.5"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        Woodgrove Bank collects the activity logs of its 25 Azure subscriptions into the Microsoft Sentinel workspace **law-woodgrove** by using the Azure Activity connector. The connector was configured with the Azure Policy assignment wizard and a remediation task. The `AzureActivity` table must be kept for two years.

        The finance team asks you to review the cost of AzureActivity and to reduce the volume of stored records if possible.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Woodgrove Bank collecte les journaux d'activité de ses 25 abonnements Azure dans l'espace de travail Microsoft Sentinel **law-woodgrove** à l'aide du connecteur Azure Activity. Le connecteur a été configuré avec l'assistant d'attribution Azure Policy et une tâche de correction. La table `AzureActivity` doit être conservée pendant deux ans.

        L'équipe financière vous demande d'examiner le coût d'AzureActivity et de réduire si possible le volume d'enregistrements stockés.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text: { en: "The activity log entries ingested into AzureActivity don't generate data ingestion charges.", fr: "Les entrées du journal d'activité ingérées dans AzureActivity n'entraînent pas de frais d'ingestion de données." }
        - id: s2
          text: { en: "You can add an ingestion-time transformation to a data collection rule to drop the AzureActivity records of the Policy category before they're stored.", fr: "Vous pouvez ajouter une transformation au moment de l'ingestion à une règle de collecte de données pour écarter les enregistrements AzureActivity de la catégorie Policy avant leur stockage." }
        - id: s3
          text: { en: "Keeping AzureActivity for two years generates retention charges only for the period beyond the first 90 days.", fr: "Conserver AzureActivity pendant deux ans n'entraîne des frais de rétention que pour la période au-delà des 90 premiers jours." }
    answer:
      values: { s1: true, s2: false, s3: true }
    explanation:
      correct:
        en: |
          There are no data ingestion charges for activity logs, and retention charges apply only to the period beyond the default 90 days. The AzureActivity table doesn't support DCR transformations, so its volume can't be reduced by filtering at ingestion; activity logs reach the workspace through diagnostic settings.
        fr: |
          L'ingestion des journaux d'activité n'entraîne aucun frais, et les frais de rétention ne s'appliquent qu'à la période au-delà des 90 jours par défaut. La table AzureActivity ne prend pas en charge les transformations de DCR : son volume ne peut donc pas être réduit par un filtrage à l'ingestion ; les journaux d'activité arrivent dans l'espace de travail par les paramètres de diagnostic.
      options:
        s2: { en: "AzureActivity isn't one of the tables that support workspace transformations in a DCR.", fr: "AzureActivity ne fait pas partie des tables qui prennent en charge les transformations d'espace de travail dans une DCR." }
    references:
      - title: Activity Log in Azure Monitor - Azure Monitor
        url: https://learn.microsoft.com/en-us/azure/azure-monitor/platform/activity-log
      - title: Azure Monitor Logs table feature support reference - Azure Monitor
        url: https://learn.microsoft.com/en-us/azure/azure-monitor/reference/tables-features

  # ------------------------------------------------------------------ 8
  - id: sc200-qz-14-08
    objective: "1.3.4"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        Fabrikam has 40 branch offices whose firewalls send CEF messages over the internet to log forwarders that run in Azure. Each forwarder runs rsyslog and the Azure Monitor Agent, and the Common Event Format (CEF) via AMA connector collects the messages into the Microsoft Sentinel workspace **law-fabrikam**.

        A single forwarder can't handle the volume, so you plan to deploy the forwarders in a Virtual Machine Scale Set. rsyslog is currently configured to also write every received message to local files.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Fabrikam compte 40 agences dont les pare-feu envoient des messages CEF via Internet à des redirecteurs de journaux qui s'exécutent dans Azure. Chaque redirecteur exécute rsyslog et l'agent Azure Monitor, et le connecteur Common Event Format (CEF) via AMA collecte les messages dans l'espace de travail Microsoft Sentinel **law-fabrikam**.

        Un seul redirecteur ne peut pas absorber le volume : vous prévoyez donc de déployer les redirecteurs dans un groupe de machines virtuelles identiques. rsyslog est actuellement configuré pour écrire aussi chaque message reçu dans des fichiers locaux.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text: { en: "You should place the scale set instances behind a load balancer that distributes the messages by using the round-robin method.", fr: "Vous devez placer les instances du groupe identique derrière un équilibreur de charge qui répartit les messages selon la méthode du tourniquet (round robin)." }
        - id: s2
          text: { en: "Because the forwarders run in Azure, the Azure Monitor Agent encrypts the messages that the firewalls send, so rsyslog needs no TLS configuration.", fr: "Comme les redirecteurs s'exécutent dans Azure, l'agent Azure Monitor chiffre les messages qu'envoient les pare-feu : rsyslog n'a donc besoin d'aucune configuration TLS." }
        - id: s3
          text: { en: "The local copies that rsyslog writes can stop the Azure Monitor Agent from working if they fill the disk of a forwarder.", fr: "Les copies locales qu'écrit rsyslog peuvent empêcher l'agent Azure Monitor de fonctionner si elles remplissent le disque d'un redirecteur." }
    answer:
      values: { s1: true, s2: false, s3: true }
    explanation:
      correct:
        en: |
          Microsoft strongly encourages a load balancer that supports round robin when AMA runs in a scale set, so that the load is spread across all the instances. The agent only receives what the daemon hands it: devices that send over TLS, for example to a forwarder in the cloud, require TLS to be configured in rsyslog or syslog-ng. A full disk disrupts AMA, which is why the daemon shouldn't store unneeded logs.
        fr: |
          Microsoft recommande vivement un équilibreur de charge qui prend en charge le tourniquet (round robin) quand AMA s'exécute dans un groupe identique, pour répartir la charge sur toutes les instances. L'agent ne reçoit que ce que le démon lui transmet : des équipements qui envoient en TLS, par exemple vers un redirecteur dans le cloud, exigent de configurer TLS dans rsyslog ou syslog-ng. Un disque plein perturbe AMA : c'est pourquoi le démon ne doit pas stocker de journaux inutiles.
      options:
        s2: { en: "The traffic from the firewalls ends at the syslog daemon; TLS must be configured in rsyslog itself.", fr: "Le trafic des pare-feu aboutit au démon syslog ; TLS doit être configuré dans rsyslog lui-même." }
    references:
      - title: Ingest syslog and CEF messages to Microsoft Sentinel - AMA
        url: https://learn.microsoft.com/en-us/azure/sentinel/connect-cef-syslog-ama

  # ------------------------------------------------------------------ 9
  - id: sc200-qz-14-09
    objective: "1.3.1"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Contoso uses Microsoft Defender for Endpoint. Before moving to the Microsoft Defender portal, Contoso connected the Microsoft Defender XDR data connector to two Microsoft Sentinel workspaces, **law-hq** and **law-research**, and ingested `DeviceProcessEvents` into law-research only. The research SOC has scheduled analytics rules in law-research that query DeviceProcessEvents.

        Contoso then onboards both workspaces to the Defender portal and selects law-hq as the primary workspace. Since then, the rules in law-research return no results. law-hq doesn't ingest any Defender XDR raw event table.

        The research rules must work again, and law-hq must stay the primary workspace. The solution must minimize administrative effort.

        What should you do?
      fr: |
        Contoso utilise Microsoft Defender for Endpoint. Avant de passer au portail Microsoft Defender, Contoso avait connecté le connecteur de données Microsoft Defender XDR à deux espaces de travail Microsoft Sentinel, **law-hq** et **law-research**, et ingérait `DeviceProcessEvents` dans law-research uniquement. Le SOC de recherche dispose dans law-research de règles d'analytique planifiées qui interrogent DeviceProcessEvents.

        Contoso intègre ensuite les deux espaces de travail au portail Defender et sélectionne law-hq comme espace de travail principal. Depuis, les règles de law-research ne renvoient aucun résultat. law-hq n'ingère aucune table d'événements bruts Defender XDR.

        Les règles de recherche doivent fonctionner de nouveau, et law-hq doit rester l'espace de travail principal. La solution doit réduire au minimum l'effort administratif.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Configure the ingestion of DeviceProcessEvents for law-research in Microsoft Sentinel > Configuration > Tables in the Defender portal.", fr: "Configurer l'ingestion de DeviceProcessEvents pour law-research dans Microsoft Sentinel > Configuration > Tables du portail Defender." } }
        - { id: b, text: { en: "Select law-research as the primary workspace in System > Settings > Microsoft Sentinel > Workspaces in the Defender portal.", fr: "Sélectionner law-research comme espace de travail principal dans Système > Paramètres > Microsoft Sentinel > Espaces de travail du portail Defender." } }
        - { id: c, text: { en: "Reconnect the standalone Microsoft Defender for Endpoint data connector in law-research so that it sends the raw events again.", fr: "Reconnecter le connecteur de données autonome Microsoft Defender for Endpoint dans law-research pour qu'il renvoie les événements bruts." } }
        - { id: d, text: { en: "Rewrite each rule in law-research to read DeviceProcessEvents from law-hq by using the workspace() expression.", fr: "Réécrire chaque règle de law-research pour qu'elle lise DeviceProcessEvents dans law-hq avec l'expression workspace()." } }
    answer: { optionId: a }
    explanation:
      correct:
        en: |
          When a primary workspace is selected, the Defender XDR connector is connected to it only, and the other workspaces become secondary: rules based on Defender XDR data stop working there until you configure table ingestion. A secondary workspace can ingest Defender XDR tables when you configure them under Microsoft Sentinel > Configuration > Tables, without changing the rules.
        fr: |
          Quand un espace de travail principal est sélectionné, le connecteur Defender XDR n'est connecté qu'à lui, et les autres espaces deviennent secondaires : les règles basées sur les données Defender XDR y cessent de fonctionner tant que vous ne configurez pas l'ingestion des tables. Un espace de travail secondaire peut ingérer des tables Defender XDR quand vous les configurez sous Microsoft Sentinel > Configuration > Tables, sans modifier les règles.
      options:
        b: { en: "Changing the primary workspace moves the connector away from law-hq, which must stay primary.", fr: "Changer d'espace de travail principal retire le connecteur de law-hq, qui doit rester principal." }
        c: { en: "Standalone Defender connectors are disconnected at onboarding to avoid duplicate tenant alerts, and they don't provide the advanced hunting tables.", fr: "Les connecteurs Defender autonomes sont déconnectés lors de l'intégration pour éviter les alertes de locataire en double, et ils ne fournissent pas les tables du repérage avancé." }
        d: { en: "law-hq ingests no raw Defender XDR table, so a cross-workspace query would find no DeviceProcessEvents data.", fr: "law-hq n'ingère aucune table brute Defender XDR : une requête inter-espaces de travail ne trouverait donc aucune donnée DeviceProcessEvents." }
    references:
      - title: Multiple workspaces - Microsoft Sentinel in Defender portal
        url: https://learn.microsoft.com/en-us/azure/sentinel/workspaces-defender-portal
      - title: Configure Table Settings in Microsoft Sentinel
        url: https://learn.microsoft.com/en-us/azure/sentinel/manage-table-tiers-retention

  # ------------------------------------------------------------------ 10
  - id: sc200-qz-14-10
    objective: "1.3.7"
    difficulty: 3
    status: draft
    type: dropdown
    stem:
      en: |
        Woodgrove Bank is integrating a payment gateway with its Microsoft Sentinel workspace **law-woodgrove**. The workspace doesn't use private link. The design has the following requirements:

        - The gateway pushes JSON records through the Logs Ingestion API into a new DCR-based custom table named **PayGate_CL**. Scheduled analytics rules will query PayGate_CL every five minutes.
        - The data collection rule (DCR) for PayGate_CL is deployed from an ARM template with `"kind": "Direct"`, so it includes a logs ingestion endpoint.
        - The SOC also wants the existing `CommonSecurityLog` table to receive a new column that holds a branch code, extracted by a transformation in the data collection rule of the CEF via AMA connector.

        How should you complete the design? Select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Woodgrove Bank intègre une passerelle de paiement à son espace de travail Microsoft Sentinel **law-woodgrove**. L'espace de travail n'utilise pas de liaison privée. La conception doit respecter les exigences suivantes :

        - La passerelle pousse des enregistrements JSON par l'API d'ingestion de journaux vers une nouvelle table personnalisée basée sur une DCR nommée **PayGate_CL**. Des règles d'analytique planifiées interrogeront PayGate_CL toutes les cinq minutes.
        - La règle de collecte de données (DCR) de PayGate_CL est déployée depuis un modèle ARM avec `"kind": "Direct"` : elle inclut donc un point de terminaison d'ingestion de journaux.
        - Le SOC veut aussi que la table existante `CommonSecurityLog` reçoive une nouvelle colonne contenant un code d'agence, extrait par une transformation dans la règle de collecte de données du connecteur CEF via AMA.

        Comment devez-vous compléter la conception ? Sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: text
      template:
        en: |
          Table plan of PayGate_CL: [[plan]]

          Data collection endpoint for the gateway: [[dce]]

          Name of the new column in CommonSecurityLog: [[col]]
        fr: |
          Plan de la table PayGate_CL : [[plan]]

          Point de terminaison de collecte de données pour la passerelle : [[dce]]

          Nom de la nouvelle colonne de CommonSecurityLog : [[col]]
      slots:
        - id: plan
          options:
            - { id: analytics, text: Analytics }
            - { id: basic, text: Basic }
            - { id: aux, text: Auxiliary / Lake }
        - id: dce
          options:
            - { id: region, text: { en: "Required, in the same region as law-woodgrove", fr: "Obligatoire, dans la même région que law-woodgrove" } }
            - { id: none, text: { en: "Not required; the gateway uses the logs ingestion endpoint of the DCR", fr: "Pas nécessaire ; la passerelle utilise le point de terminaison d'ingestion de journaux de la DCR" } }
            - { id: any, text: { en: "Required, in any region of the subscription", fr: "Obligatoire, dans n'importe quelle région de l'abonnement" } }
        - id: col
          options:
            - { id: plain, text: BranchCode }
            - { id: cl, text: BranchCode_CL }
            - { id: cf, text: BranchCode_CF }
            - { id: under, text: _BranchCode }
    answer:
      values: { plan: analytics, dce: none, col: cf }
    explanation:
      correct:
        en: |
          Data used by analytics rules belongs in the Analytics plan. A data collection endpoint is needed only with private link or when the DCR has no logs ingestion endpoint; a DCR created with `"kind": "Direct"` has one. Custom columns added to an Azure table such as CommonSecurityLog must end in `_CF`.
        fr: |
          Les données utilisées par les règles d'analytique relèvent du plan Analytics. Un point de terminaison de collecte de données n'est nécessaire qu'avec une liaison privée ou quand la DCR n'a pas de point de terminaison d'ingestion de journaux ; une DCR créée avec `"kind": "Direct"` en possède un. Les colonnes personnalisées ajoutées à une table Azure comme CommonSecurityLog doivent se terminer par `_CF`.
      options:
        basic: { en: "Basic is for high-volume data queried less often, not for tables that scheduled analytics rules query.", fr: "Basic convient aux données volumineuses interrogées moins souvent, pas aux tables qu'interrogent des règles d'analytique planifiées." }
        aux: { en: "Auxiliary / Lake is low-cost storage for verbose data that isn't used for real-time detection.", fr: "Auxiliary / Lake est un stockage à bas coût pour des données verbeuses qui ne servent pas à la détection en temps réel." }
        region: { en: "Without private link, the DCR's own logs ingestion endpoint is enough.", fr: "Sans liaison privée, le point de terminaison d'ingestion de journaux de la DCR suffit." }
        plain: { en: "A custom column of an Azure table needs the _CF suffix.", fr: "Une colonne personnalisée d'une table Azure exige le suffixe _CF." }
        cl: { en: "_CL is the suffix of custom table names, not of columns.", fr: "_CL est le suffixe des noms de tables personnalisées, pas des colonnes." }
        under: { en: "Column names must start with a letter.", fr: "Les noms de colonnes doivent commencer par une lettre." }
    references:
      - title: Logs Ingestion API in Azure Monitor - Azure Monitor
        url: https://learn.microsoft.com/en-us/azure/azure-monitor/logs/logs-ingestion-api-overview
      - title: Add or Delete Tables and Columns in Azure Monitor Logs - Azure Monitor
        url: https://learn.microsoft.com/en-us/azure/azure-monitor/logs/create-custom-table
