# SC-200 — Microsoft Security Operations Analyst (Microsoft Certified: Security Operations Analyst Associate)
# Source: official study guide, "Skills measured as of October 21, 2026" (en-us and fr-fr pages, checked on 2026-11-16).
# Real exam: 100 minutes (certification page: "You will have 100 minutes to complete this assessment"),
# passing score 700/1000, proctored, "may have interactive components"; Microsoft does not publish the number
# of questions (40 to 60 on most exams) nor the list of exams with case studies or labs. Microsoft Learn is
# accessible during the exam. KQL-heavy exam: more drop-down questions (query completion) than AZ-104.
# Readiness and progression rules are those of AZ-104.
# active: false until the bank and the course are reviewed and published.
