id: sc200-cs3b-humongous-insurance
status: draft
title:
  en: Humongous Insurance
  fr: Humongous Insurance
tabs:
  - key: overview
    title: { en: "Overview", fr: "Vue d'ensemble" }
    body:
      en: |
        Humongous Insurance is an insurance company with 3,500 employees, including a claims department and a network of brokers who work in the company's offices. The security operations center (SOC) has tier-1 and tier-2 analysts.

        Humongous Insurance has a Microsoft 365 E5 subscription and uses Microsoft Defender XDR: Microsoft Defender for Endpoint Plan 2, Microsoft Defender for Office 365 Plan 2, Microsoft Defender for Identity and Microsoft Defender for Cloud Apps. The tenant has Microsoft Entra ID P2 licenses.
      fr: |
        Humongous Insurance est une compagnie d'assurance de 3 500 employés, qui comprend un service des sinistres et un réseau de courtiers travaillant dans les bureaux de l'entreprise. Le centre des opérations de sécurité (SOC) compte des analystes de niveau 1 et de niveau 2.

        Humongous Insurance dispose d'un abonnement Microsoft 365 E5 et utilise Microsoft Defender XDR : Microsoft Defender pour point de terminaison Plan 2, Microsoft Defender pour Office 365 Plan 2, Microsoft Defender pour Identity et Microsoft Defender for Cloud Apps. Le locataire dispose de licences Microsoft Entra ID P2.
  - key: existing
    title: { en: "Existing environment", fr: "Environnement existant" }
    body:
      en: |
        All the company devices run Windows 11 and are onboarded to Defender for Endpoint. Device discovery is set to **Basic discovery**. Brokers sometimes connect personal, unmanaged laptops to the office network.

        The Defender for Endpoint device groups are configured as follows:

        | Rank | Device group | Matching rule | Microsoft Entra user groups with access |
        | --- | --- | --- | --- |
        | 1 | DG-Claims | Tag equals Claims | SOC-Claims |
        | 2 | DG-Brokers | Tag equals Broker | None |
        | Last | Ungrouped devices (default) | None | None |

        All mailboxes are hosted in Exchange Online. Safe Links protects email messages, Microsoft Teams and Office apps.

        The tier-2 analysts are members of an Email & collaboration role group named **SOC-Purge** that has the Search and Purge role. The tier-1 analysts are not members of SOC-Purge.
      fr: |
        Tous les appareils de l'entreprise exécutent Windows 11 et sont intégrés à Defender pour point de terminaison. La découverte d'appareils est définie sur **Basic discovery**. Les courtiers connectent parfois des ordinateurs portables personnels non gérés au réseau des bureaux.

        Les groupes d'appareils Defender pour point de terminaison sont configurés comme suit :

        | Rang | Groupe d'appareils | Règle de correspondance | Groupes d'utilisateurs Microsoft Entra ayant accès |
        | --- | --- | --- | --- |
        | 1 | DG-Claims | L'étiquette est égale à Claims | SOC-Claims |
        | 2 | DG-Brokers | L'étiquette est égale à Broker | Aucun |
        | Dernier | Ungrouped devices (default) | Aucune | Aucun |

        Toutes les boîtes aux lettres sont hébergées dans Exchange Online. Liens fiables (Safe Links) protège les e-mails, Microsoft Teams et les applications Office.

        Les analystes de niveau 2 sont membres d'un groupe de rôles Email & collaboration nommé **SOC-Purge** qui dispose du rôle Search and Purge. Les analystes de niveau 1 ne sont pas membres de SOC-Purge.
  - key: requirements
    title: { en: "Requirements", fr: "Exigences" }
    body:
      en: |
        Humongous Insurance identifies the following requirements:

        1. **Attack disruption**: automatic attack disruption must be able to contain the unmanaged devices that connect to the office network.
        2. **Exfiltration tool**: when **rclone.exe** starts on a device in DG-Claims, an alert must be raised within minutes and the device must be cut off from the network while it stays connected to the Defender for Endpoint service. No analyst action can be required.
        3. **Phishing**: tier-1 analysts must start the removal of delivered phishing messages. Only tier-2 analysts can approve the removal.
        4. **Risky users**: when an investigation shows that the risk detections of a user are false positives, the analysts must clear the user risk without changing the user's password.
        5. **Hunting**: for each phishing campaign, the SOC must identify the users who clicked a link in one of the campaign messages.
      fr: |
        Humongous Insurance a défini les exigences suivantes :

        1. **Interruption des attaques** : l'interruption automatique des attaques doit pouvoir contenir les appareils non gérés qui se connectent au réseau des bureaux.
        2. **Outil d'exfiltration** : quand **rclone.exe** démarre sur un appareil de DG-Claims, une alerte doit être générée en quelques minutes et l'appareil doit être coupé du réseau tout en restant connecté au service Defender pour point de terminaison. Aucune action d'un analyste ne doit être nécessaire.
        3. **Hameçonnage** : les analystes de niveau 1 doivent lancer la suppression des messages d'hameçonnage remis. Seuls les analystes de niveau 2 peuvent approuver la suppression.
        4. **Utilisateurs à risque** : quand une investigation montre que les détections de risque d'un utilisateur sont des faux positifs, les analystes doivent effacer le risque de l'utilisateur sans modifier son mot de passe.
        5. **Chasse** : pour chaque campagne d'hameçonnage, le SOC doit identifier les utilisateurs qui ont cliqué sur un lien dans l'un des messages de la campagne.
