id: sc200-cs1b-city-power-light
status: draft
title:
  en: City Power & Light
  fr: City Power & Light
tabs:
  - key: overview
    title: { en: "Overview", fr: "Vue d'ensemble" }
    body:
      en: |
        City Power & Light is an electricity distribution utility that serves 1.2 million customers. Its security operations team protects both the corporate IT network and the operational technology (OT) network that controls the substations.

        A national regulation requires City Power & Light to keep the security logs of its OT network for seven years.
      fr: |
        City Power & Light est un distributeur d'électricité qui dessert 1,2 million de clients. Son équipe des opérations de sécurité protège à la fois le réseau informatique de l'entreprise et le réseau de technologie opérationnelle (OT) qui pilote les postes électriques.

        Une réglementation nationale impose à City Power & Light de conserver les journaux de sécurité de son réseau OT pendant sept ans.
  - key: existing
    title: { en: "Existing environment", fr: "Environnement existant" }
    body:
      en: |
        **Microsoft Sentinel.** A Log Analytics workspace named **LAW-CPL** with Microsoft Sentinel, onboarded to the Microsoft Defender portal and to the Microsoft Sentinel data lake.

        **Azure.** Three subscriptions named **Sub-Corp**, **Sub-OT** and **Sub-Shared**. Each subscription contains Azure Key Vault vaults, and new vaults are created every month. In Sub-OT, the virtual machines **HIST1** to **HIST6** host the substation historian and are protected by Microsoft Defender for Servers Plan 2. A virtual machine named **VM-SCAN1** runs an authorized vulnerability scanner.

        **On-premises.**

        | Source | Log format | Destination |
        | --- | --- | --- |
        | Perimeter firewalls | CEF, facility local4 | LNX-FWD1 |
        | OT gateways (120 devices) | Plain Syslog, facility local4 | LNX-FWD1 |

        **LNX-FWD1** is an Ubuntu server that runs rsyslog and is Azure Arc-enabled. The firewalls generate about 600 GB of logs per day.

        In Microsoft Sentinel, the Microsoft Sentinel connector for Azure Key Vault uses an Azure Policy assignment to deploy diagnostic settings to the vaults.
      fr: |
        **Microsoft Sentinel.** Un espace de travail Log Analytics nommé **LAW-CPL** avec Microsoft Sentinel, intégré au portail Microsoft Defender et au data lake Microsoft Sentinel.

        **Azure.** Trois abonnements nommés **Sub-Corp**, **Sub-OT** et **Sub-Shared**. Chaque abonnement contient des coffres Azure Key Vault, et de nouveaux coffres sont créés chaque mois. Dans Sub-OT, les machines virtuelles **HIST1** à **HIST6** hébergent l'historien des postes électriques et sont protégées par Microsoft Defender pour serveurs Plan 2. Une machine virtuelle nommée **VM-SCAN1** exécute un analyseur de vulnérabilités autorisé.

        **Local.**

        | Source | Format des journaux | Destination |
        | --- | --- | --- |
        | Pare-feu de périmètre | CEF, facility local4 | LNX-FWD1 |
        | Passerelles OT (120 appareils) | Syslog simple, facility local4 | LNX-FWD1 |

        **LNX-FWD1** est un serveur Ubuntu qui exécute rsyslog et qui est activé pour Azure Arc. Les pare-feu génèrent environ 600 Go de journaux par jour.

        Dans Microsoft Sentinel, le connecteur Microsoft Sentinel pour Azure Key Vault utilise une attribution Azure Policy pour déployer des paramètres de diagnostic sur les coffres.
  - key: requirements
    title: { en: "Requirements", fr: "Exigences" }
    body:
      en: |
        City Power & Light identifies the following requirements:

        1. **Ingestion.** Firewall and OT gateway messages must be collected through LNX-FWD1 by using the Azure Monitor Agent.
        2. **Key Vault.** The resource logs of all the existing and future vaults in the three subscriptions must be sent to LAW-CPL.
        3. **OT detection.** An alert must be raised within two minutes when an OT gateway logs a configuration change.
        4. **Retention.** The OT gateway logs must be available to analytics rules and hunting queries for one year and must be kept for seven years in total. The firewall logs are used only for occasional investigations, must be kept for two years and must be stored at the lowest possible cost.
        5. **Investigations.** During an investigation, analysts must copy 18 months of firewall events for a given IP address into a table that they can query with Advanced Hunting.
        6. **Alert noise.** The Defender for Cloud alerts that VM-SCAN1 triggers on HIST1 to HIST6 must be dismissed automatically and permanently. Alerts triggered by any other machine must not be affected.
        7. Administrative effort must be minimized.
      fr: |
        City Power & Light a défini les exigences suivantes :

        1. **Ingestion.** Les messages des pare-feu et des passerelles OT doivent être collectés par LNX-FWD1 à l'aide de l'agent Azure Monitor.
        2. **Key Vault.** Les journaux de ressources de tous les coffres existants et futurs des trois abonnements doivent être envoyés à LAW-CPL.
        3. **Détection OT.** Une alerte doit être déclenchée dans les deux minutes quand une passerelle OT journalise une modification de configuration.
        4. **Rétention.** Les journaux des passerelles OT doivent être accessibles aux règles d'analytique et aux requêtes de chasse pendant un an, et être conservés sept ans au total. Les journaux des pare-feu ne servent qu'à des enquêtes ponctuelles, doivent être conservés deux ans et stockés au coût le plus bas possible.
        5. **Enquêtes.** Pendant une enquête, les analystes doivent copier 18 mois d'événements de pare-feu concernant une adresse IP donnée dans une table qu'ils peuvent interroger avec le repérage avancé.
        6. **Bruit des alertes.** Les alertes Defender pour le cloud que VM-SCAN1 déclenche sur HIST1 à HIST6 doivent être ignorées automatiquement et définitivement. Les alertes déclenchées par toute autre machine ne doivent pas être affectées.
        7. L'effort d'administration doit être réduit au minimum.
