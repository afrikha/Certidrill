id: sc200-cs1c-tailwind-traders
status: draft
title:
  en: Tailwind Traders
  fr: Tailwind Traders
tabs:
  - key: overview
    title: { en: "Overview", fr: "Vue d'ensemble" }
    body:
      en: |
        Tailwind Traders is a home improvement retailer with 300 stores and an online shop. A security team of six analysts handles incidents for 18,000 employees.

        Last week, a gift card phishing campaign targeted the store managers, and the team found signs of data exfiltration.
      fr: |
        Tailwind Traders est une enseigne de bricolage qui compte 300 magasins et une boutique en ligne. Une équipe de sécurité de six analystes traite les incidents pour 18 000 employés.

        La semaine dernière, une campagne d'hameçonnage aux cartes-cadeaux a ciblé les directeurs de magasin, et l'équipe a découvert des signes d'exfiltration de données.
  - key: existing
    title: { en: "Existing environment", fr: "Environnement existant" }
    body:
      en: |
        **Licenses and products.** Microsoft 365 E5 licenses for all the users: Microsoft Defender for Office 365 Plan 2, Microsoft Defender for Endpoint Plan 2, Microsoft Defender for Cloud Apps and Microsoft Entra ID P2.

        **Identity.** User accounts are synchronized from an on-premises Active Directory domain by Microsoft Entra Connect with password hash synchronization. In Microsoft Entra ID Protection, the setting **Allow on-premises password change to reset user risk** is disabled.

        **Devices.** All the Windows 11 devices are onboarded to Defender for Endpoint. Microsoft Defender Antivirus real-time protection and cloud-delivered protection are on, and network protection is in block mode. Cloud Discovery in Defender for Cloud Apps receives data from Defender for Endpoint.

        **Microsoft Sentinel.** A workspace named **LAW-TT** is onboarded to the Microsoft Defender portal. Microsoft Entra diagnostic settings send the sign-in logs, the audit logs and the Microsoft Graph activity logs to LAW-TT.

        **Findings from the investigation.**

        | Item | Details |
        | --- | --- |
        | Phishing campaign | 3,400 messages from the domain giftcards-tailwind.example delivered to the Inbox of 2,900 users |
        | App1 | A cloud storage app found by Cloud Discovery; several store managers uploaded files to it |
        | SyncBot | An app registration with the Mail.Read application permission, suspected of reading mailboxes |
        | Ana Diaz | A store manager whose user risk is High after she entered her password on the phishing site |
      fr: |
        **Licences et produits.** Licences Microsoft 365 E5 pour tous les utilisateurs : Microsoft Defender pour Office 365 Plan 2, Microsoft Defender pour point de terminaison Plan 2, Microsoft Defender for Cloud Apps et Microsoft Entra ID P2.

        **Identité.** Les comptes d'utilisateurs sont synchronisés depuis un domaine Active Directory local par Microsoft Entra Connect avec la synchronisation de hachage de mot de passe. Dans Microsoft Entra ID Protection, le paramètre **Allow on-premises password change to reset user risk** est désactivé.

        **Appareils.** Tous les appareils Windows 11 sont intégrés à Defender pour point de terminaison. La protection en temps réel et la protection fournie par le cloud de l'Antivirus Microsoft Defender sont activées, et la protection du réseau est en mode blocage. Cloud Discovery dans Defender for Cloud Apps reçoit les données de Defender pour point de terminaison.

        **Microsoft Sentinel.** Un espace de travail nommé **LAW-TT** est intégré au portail Microsoft Defender. Les paramètres de diagnostic de Microsoft Entra envoient les journaux de connexion, les journaux d'audit et les journaux d'activité Microsoft Graph à LAW-TT.

        **Constatations de l'enquête.**

        | Élément | Détails |
        | --- | --- |
        | Campagne d'hameçonnage | 3 400 messages du domaine giftcards-tailwind.example remis dans la boîte de réception de 2 900 utilisateurs |
        | App1 | Une application de stockage cloud trouvée par Cloud Discovery ; plusieurs directeurs de magasin y ont chargé des fichiers |
        | SyncBot | Une inscription d'application dotée de l'autorisation d'application Mail.Read, suspectée de lire des boîtes aux lettres |
        | Ana Diaz | Une directrice de magasin dont le risque utilisateur est High après qu'elle a saisi son mot de passe sur le site d'hameçonnage |
  - key: requirements
    title: { en: "Requirements", fr: "Exigences" }
    body:
      en: |
        Tailwind Traders identifies the following requirements:

        1. **Email remediation.** The phishing messages must be removed from the users' mailbox folders but remain recoverable by both users and administrators if a message turns out to be legitimate. Every remediation must be approved by a second analyst before it runs.
        2. **Click analysis.** The analysts must list the users who clicked a link in a message from giftcards-tailwind.example during the last seven days and were allowed to open the link.
        3. **App blocking.** Access to App1 must be blocked on all the Windows 11 devices.
        4. **Identity risk.** The analysts must understand how the user risk of accounts such as Ana Diaz is remediated.
        5. **SyncBot.** The analysts must identify every Microsoft Graph request URI and HTTP method that the SyncBot service principal sent during the last 48 hours.
        6. Administrative effort must be minimized.
      fr: |
        Tailwind Traders a défini les exigences suivantes :

        1. **Correction des e-mails.** Les messages d'hameçonnage doivent être retirés des dossiers des boîtes aux lettres des utilisateurs, mais rester récupérables par les utilisateurs comme par les administrateurs si un message s'avère légitime. Chaque correction doit être approuvée par un second analyste avant de s'exécuter.
        2. **Analyse des clics.** Les analystes doivent lister les utilisateurs qui ont cliqué sur un lien d'un message provenant de giftcards-tailwind.example au cours des sept derniers jours et qui ont été autorisés à ouvrir le lien.
        3. **Blocage d'application.** L'accès à App1 doit être bloqué sur tous les appareils Windows 11.
        4. **Risque d'identité.** Les analystes doivent comprendre comment le risque utilisateur de comptes comme celui d'Ana Diaz est corrigé.
        5. **SyncBot.** Les analystes doivent identifier chaque URI de requête Microsoft Graph et chaque méthode HTTP que le principal de service de SyncBot a envoyés au cours des 48 dernières heures.
        6. L'effort d'administration doit être réduit au minimum.
