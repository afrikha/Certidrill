id: sc200-cs1a-lamna-healthcare
status: draft
title:
  en: Lamna Healthcare
  fr: Lamna Healthcare
tabs:
  - key: overview
    title: { en: "Overview", fr: "Vue d'ensemble" }
    body:
      en: |
        Lamna Healthcare operates nine hospitals and 25 outpatient clinics. A security operations center (SOC) of 14 analysts in two tiers monitors the environment around the clock.

        Lamna recently had a ransomware incident at a partner hospital and wants to tighten detection, response and hunting across its hybrid environment.
      fr: |
        Lamna Healthcare exploite neuf hôpitaux et 25 cliniques ambulatoires. Un centre des opérations de sécurité (SOC) de 14 analystes, répartis sur deux niveaux, surveille l'environnement 24 heures sur 24.

        Un hôpital partenaire de Lamna a récemment subi un rançongiciel, et Lamna veut renforcer la détection, la réponse et la chasse aux menaces sur son environnement hybride.
  - key: existing
    title: { en: "Existing environment", fr: "Environnement existant" }
    body:
      en: |
        **Identity.** An on-premises Active Directory forest named **lamna.local** with eight domain controllers that run Windows Server 2022. The domain controllers are Azure Arc-enabled. Users are synchronized to a Microsoft Entra tenant by Microsoft Entra Connect.

        **Microsoft Defender XDR.** Microsoft 365 E5 licenses. Microsoft Defender for Identity sensors v3.x run on all the domain controllers. Microsoft Defender for Endpoint protects all the devices, which are organized in the following device groups:

        | Device group | Members | Notes |
        | --- | --- | --- |
        | ICU-Workstations | 300 bedside workstations | Connected to patient monitoring systems |
        | Clinical-Workstations | 5,200 Windows 11 devices | Nurses and physicians |
        | Servers | 450 Windows Server devices | Application and file servers |

        **Microsoft Sentinel.** A Log Analytics workspace named **LAW-SOC** with Microsoft Sentinel, onboarded to the Microsoft Defender portal. The Windows Security Events solution is installed from the Content hub, and several of its analytics rules query the **SecurityEvent** table. A playbook named **Notify-ClinicalLead** is stored in a resource group named **RG-Playbooks**.
      fr: |
        **Identité.** Une forêt Active Directory locale nommée **lamna.local** avec huit contrôleurs de domaine sous Windows Server 2022. Les contrôleurs de domaine sont activés pour Azure Arc. Les utilisateurs sont synchronisés vers un locataire Microsoft Entra par Microsoft Entra Connect.

        **Microsoft Defender XDR.** Licences Microsoft 365 E5. Des capteurs Microsoft Defender pour Identity v3.x sont installés sur tous les contrôleurs de domaine. Microsoft Defender pour point de terminaison protège tous les appareils, organisés dans les groupes d'appareils suivants :

        | Groupe d'appareils | Membres | Remarques |
        | --- | --- | --- |
        | ICU-Workstations | 300 postes de chevet | Connectés aux systèmes de surveillance des patients |
        | Clinical-Workstations | 5 200 appareils Windows 11 | Infirmiers et médecins |
        | Servers | 450 appareils Windows Server | Serveurs d'applications et de fichiers |

        **Microsoft Sentinel.** Un espace de travail Log Analytics nommé **LAW-SOC** avec Microsoft Sentinel, intégré au portail Microsoft Defender. La solution Windows Security Events est installée depuis le hub de contenu, et plusieurs de ses règles d'analytique interrogent la table **SecurityEvent**. Un playbook nommé **Notify-ClinicalLead** se trouve dans un groupe de ressources nommé **RG-Playbooks**.
  - key: requirements
    title: { en: "Requirements", fr: "Exigences" }
    body:
      en: |
        Lamna identifies the following requirements:

        1. **Domain controller events.** Only events 4625 (failed logon) and 4740 (account locked out) must be collected from the domain controllers into LAW-SOC. The existing analytics rules must keep working without modification. Ingestion costs must be minimized.
        2. **Automated remediation.** Automated investigations must run on every device group. On ICU-Workstations, no remediation action may be taken without analyst approval. On Clinical-Workstations, threats must be remediated without waiting for an analyst. On Servers, files in temporary folders can be remediated automatically, but files in any other folder require approval.
        3. **Forensics.** When a device is suspected to be compromised, tier-2 analysts must collect autoruns, scheduled tasks, prefetch files and the Security event log in a single action for offline analysis.
        4. **Identity response.** Analysts must be able to disable a compromised Active Directory account directly from the Microsoft Defender portal. Administrative effort must be minimized.
        5. **Hunting.** The SOC must hunt for password spray attacks against the domain controllers: any source IP address that fails to authenticate more than 20 different accounts within one hour.
        6. **Tier-1 permissions.** Tier-1 analysts must be able to assign, comment on and close Microsoft Sentinel incidents and run Notify-ClinicalLead manually on an incident. They must not be able to create or edit analytics rules. The principle of least privilege must be followed.
      fr: |
        Lamna a défini les exigences suivantes :

        1. **Événements des contrôleurs de domaine.** Seuls les événements 4625 (échec d'ouverture de session) et 4740 (compte verrouillé) doivent être collectés depuis les contrôleurs de domaine dans LAW-SOC. Les règles d'analytique existantes doivent continuer à fonctionner sans modification. Les coûts d'ingestion doivent être réduits au minimum.
        2. **Correction automatisée.** Les enquêtes automatisées doivent s'exécuter sur tous les groupes d'appareils. Sur ICU-Workstations, aucune action de correction ne peut être effectuée sans l'approbation d'un analyste. Sur Clinical-Workstations, les menaces doivent être corrigées sans attendre un analyste. Sur Servers, les fichiers des dossiers temporaires peuvent être corrigés automatiquement, mais les fichiers de tout autre dossier nécessitent une approbation.
        3. **Investigation numérique.** Quand un appareil est suspecté d'être compromis, les analystes de niveau 2 doivent collecter les entrées de démarrage automatique (autoruns), les tâches planifiées, les fichiers prefetch et le journal des événements Sécurité en une seule action, pour une analyse hors connexion.
        4. **Réponse sur les identités.** Les analystes doivent pouvoir désactiver un compte Active Directory compromis directement depuis le portail Microsoft Defender. L'effort d'administration doit être réduit au minimum.
        5. **Chasse.** Le SOC doit rechercher les attaques par pulvérisation de mots de passe (password spray) contre les contrôleurs de domaine : toute adresse IP source qui échoue à authentifier plus de 20 comptes différents en une heure.
        6. **Autorisations du niveau 1.** Les analystes de niveau 1 doivent pouvoir attribuer, commenter et fermer les incidents Microsoft Sentinel, et exécuter manuellement Notify-ClinicalLead sur un incident. Ils ne doivent pas pouvoir créer ni modifier de règles d'analytique. Le principe du moindre privilège doit être respecté.
