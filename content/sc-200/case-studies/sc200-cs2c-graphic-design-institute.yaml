id: sc200-cs2c-graphic-design-institute
status: draft
title:
  en: "Graphic Design Institute"
  fr: "Graphic Design Institute"
tabs:
  - key: overview
    title: { en: "Overview", fr: "Vue d'ensemble" }
    body:
      en: |
        Graphic Design Institute is a private design school with 11,000 students and 900 staff members on two campuses. All its IT services are in the cloud: Microsoft 365 for email, Teams and SharePoint, and software-as-a-service (SaaS) applications for admissions and grading.

        A security operations team of three analysts and one engineer works in the Microsoft Defender portal.
      fr: |
        Graphic Design Institute est une école privée de design qui compte 11 000 étudiants et 900 membres du personnel sur deux campus. Tous ses services informatiques sont dans le cloud : Microsoft 365 pour la messagerie, Teams et SharePoint, et des applications SaaS (software as a service) pour les admissions et les notes.

        Une équipe d'opérations de sécurité de trois analystes et d'un ingénieur travaille dans le portail Microsoft Defender.
  - key: existing
    title: { en: "Existing environment", fr: "Environnement existant" }
    body:
      en: |
        **Identity and licensing**

        The Microsoft Entra tenant contains only cloud accounts. All staff members have licenses for Microsoft Defender for Office 365 Plan 2, Microsoft Entra ID P2, Microsoft Defender for Cloud Apps and Microsoft Purview Audit (Premium). Safe Links protects email messages and Teams messages. Mailbox auditing uses the default settings, and the MailItemsAccessed action is audited for all staff mailboxes. Staff members and students use their own devices. No device is onboarded to Microsoft Defender for Endpoint.

        **Microsoft Sentinel**

        A Microsoft Sentinel workspace named **law-gdi** is onboarded to the Defender portal. The Microsoft Entra ID connector sends the sign-in logs to law-gdi, and a diagnostic setting streams the Microsoft Graph activity logs of the tenant to law-gdi.
      fr: |
        **Identité et licences**

        Le locataire Microsoft Entra ne contient que des comptes cloud. Tous les membres du personnel disposent de licences Microsoft Defender pour Office 365 Plan 2, Microsoft Entra ID P2, Microsoft Defender for Cloud Apps et Microsoft Purview Audit (Premium). Liens fiables (Safe Links) protège les e-mails et les messages Teams. L'audit des boîtes aux lettres utilise les paramètres par défaut, et l'action MailItemsAccessed est auditée pour toutes les boîtes aux lettres du personnel. Les membres du personnel et les étudiants utilisent leurs propres appareils. Aucun appareil n'est intégré à Microsoft Defender pour point de terminaison.

        **Microsoft Sentinel**

        Un espace de travail Microsoft Sentinel nommé **law-gdi** est intégré au portail Defender. Le connecteur Microsoft Entra ID envoie les journaux de connexion à law-gdi, et un paramètre de diagnostic transmet à law-gdi les journaux d'activité Microsoft Graph du locataire.
  - key: incident
    title: { en: "Current incident", fr: "Incident en cours" }
    body:
      en: |
        Two days ago, a phishing campaign with the subject "Portfolio review - action required" reached 410 staff mailboxes. The messages contain a link to a fake sign-in page. The messages are still in the Inbox folders.

        After the campaign, Microsoft Entra ID Protection reports three risky users:

        | User | User risk | Findings of the investigation |
        | --- | --- | --- |
        | a.ruiz | High | An attacker signed in with the account, read messages and consented to a multitenant application named **PortfolioSync** that calls Microsoft Graph. |
        | b.okafor | High | All the risky sign-ins came from the hotel where the user stayed during a conference. The activity is legitimate. |
        | c.lindqvist | Medium | The user entered the password on the fake page, but no attacker sign-in is found. The user has not registered for multifactor authentication (MFA). |
      fr: |
        Il y a deux jours, une campagne d'hameçonnage ayant pour objet « Portfolio review - action required » a atteint 410 boîtes aux lettres du personnel. Les messages contiennent un lien vers une fausse page de connexion. Les messages se trouvent toujours dans les dossiers Boîte de réception.

        Après la campagne, Microsoft Entra ID Protection signale trois utilisateurs à risque :

        | Utilisateur | Risque utilisateur | Conclusions de l'investigation |
        | --- | --- | --- |
        | a.ruiz | Élevé | Un attaquant s'est connecté avec le compte, a lu des messages et a donné son consentement à une application multilocataire nommée **PortfolioSync** qui appelle Microsoft Graph. |
        | b.okafor | Élevé | Toutes les connexions à risque provenaient de l'hôtel où l'utilisateur séjournait pendant une conférence. L'activité est légitime. |
        | c.lindqvist | Moyen | L'utilisateur a saisi son mot de passe sur la fausse page, mais aucune connexion d'attaquant n'a été trouvée. L'utilisateur ne s'est pas inscrit à l'authentification multifacteur (MFA). |
  - key: requirements
    title: { en: "Requirements", fr: "Exigences" }
    body:
      en: |
        1. Remove the phishing messages from all the mailboxes. Recipients must not be able to recover the messages, but the messaging administrators must still be able to recover them if needed.
        2. Identify the recipients who selected the link in the phishing messages, including those who continued to the website after the Safe Links warning.
        3. Determine which messages the attacker read in the mailbox of a.ruiz.
        4. List the Microsoft Graph requests that PortfolioSync made and correlate each request with the sign-in that issued its token.
        5. Remediate the risk of each risky user according to the findings. c.lindqvist must set a new password at the next sign-in.
        6. Create a Defender XDR custom detection rule named **CD-PortfolioApps** that alerts when a user consents to an OAuth application. The rule query reads CloudAppEvents and uses a join with the IdentityInfo table to add the user's department.
      fr: |
        1. Supprimer les messages d'hameçonnage de toutes les boîtes aux lettres. Les destinataires ne doivent pas pouvoir récupérer les messages, mais les administrateurs de la messagerie doivent toujours pouvoir les récupérer si nécessaire.
        2. Identifier les destinataires qui ont sélectionné le lien des messages d'hameçonnage, y compris ceux qui ont continué vers le site après l'avertissement de Liens fiables (Safe Links).
        3. Déterminer quels messages l'attaquant a lus dans la boîte aux lettres de a.ruiz.
        4. Lister les requêtes Microsoft Graph effectuées par PortfolioSync et associer chaque requête à la connexion qui a émis son jeton.
        5. Corriger le risque de chaque utilisateur à risque selon les conclusions. c.lindqvist doit définir un nouveau mot de passe à sa prochaine connexion.
        6. Créer une règle de détection personnalisée Defender XDR nommée **CD-PortfolioApps** qui alerte quand un utilisateur donne son consentement à une application OAuth. La requête de la règle lit CloudAppEvents et utilise une jointure avec la table IdentityInfo pour ajouter le service de l'utilisateur.
