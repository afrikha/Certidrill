id: sc200-cs4b-best-for-you-organics
status: draft
title:
  en: Best For You Organics Company
  fr: Best For You Organics Company
tabs:
  - key: overview
    title: { en: "Overview", fr: "Vue d'ensemble" }
    body:
      en: |
        Best For You Organics Company sells organic groceries online and delivers them in France and Belgium. It has 1,100 employees and no on-premises datacenter: the online store and its checkout API run in Azure.

        A security operations team of eight people uses the Microsoft Defender portal. Employees recently received phishing messages that imitate delivery notifications.
      fr: |
        Best For You Organics Company vend des produits d'épicerie biologiques en ligne et les livre en France et en Belgique. Elle compte 1 100 employés et n'a aucun centre de données local : la boutique en ligne et son API de paiement s'exécutent dans Azure.

        Une équipe des opérations de sécurité de huit personnes utilise le portail Microsoft Defender. Des employés ont récemment reçu des messages d'hameçonnage qui imitent des notifications de livraison.
  - key: existing
    title: { en: "Existing environment", fr: "Environnement existant" }
    body:
      en: |
        **Identity and Microsoft 365.** A Microsoft Entra tenant named bestforyouorganics.com. All users have Microsoft 365 E5 licenses and are registered for multifactor authentication and self-service password reset. A Conditional Access policy named **CA-UserRisk** requires a secure password change when the user risk is High. Safe Links policies of Microsoft Defender for Office 365 protect email, Microsoft Teams, and Office apps for all users.

        **Microsoft Sentinel.** The following Azure resources are used by the security operations team.

        | Subscription | Resource group | Content |
        | --- | --- | --- |
        | Sub-SOC | RG-SOC | Log Analytics workspace **law-bfyo-soc** with Microsoft Sentinel, onboarded to the Defender portal and to the Microsoft Sentinel data lake |
        | Sub-Automation | RG-Playbooks | Logic Apps used as Microsoft Sentinel playbooks |

        The checkout API writes its request logs to a custom table named **CheckoutApi_CL**, which is stored in the data lake tier only because of its volume.

        **People and groups.**

        | Name | Type | Current access |
        | --- | --- | --- |
        | Ines Moreau | Automation engineer | Microsoft Sentinel Contributor on RG-SOC; no role on Sub-Automation |
        | GRP-Tier1 | Group of first-line analysts | None |
        | GRP-DetEng | Group of detection engineers | None |
        | GRP-Fraud | Group of the payment fraud team | None |

        You have the Owner role on Sub-SOC and Sub-Automation.
      fr: |
        **Identité et Microsoft 365.** Un locataire Microsoft Entra nommé bestforyouorganics.com. Tous les utilisateurs disposent de licences Microsoft 365 E5 et sont inscrits à l'authentification multifacteur et à la réinitialisation de mot de passe en libre-service. Une stratégie d'accès conditionnel nommée **CA-UserRisk** exige un changement de mot de passe sécurisé lorsque le risque utilisateur est High. Les stratégies Liens fiables (Safe Links) de Microsoft Defender pour Office 365 protègent la messagerie, Microsoft Teams et les applications Office de tous les utilisateurs.

        **Microsoft Sentinel.** L'équipe des opérations de sécurité utilise les ressources Azure suivantes.

        | Abonnement | Groupe de ressources | Contenu |
        | --- | --- | --- |
        | Sub-SOC | RG-SOC | Espace de travail Log Analytics **law-bfyo-soc** avec Microsoft Sentinel, intégré au portail Defender et au data lake Microsoft Sentinel |
        | Sub-Automation | RG-Playbooks | Logic Apps utilisées comme playbooks Microsoft Sentinel |

        L'API de paiement écrit ses journaux de requêtes dans une table personnalisée nommée **CheckoutApi_CL**, stockée uniquement dans le niveau data lake en raison de son volume.

        **Personnes et groupes.**

        | Nom | Type | Accès actuel |
        | --- | --- | --- |
        | Ines Moreau | Ingénieure d'automatisation | Microsoft Sentinel Contributor sur RG-SOC ; aucun rôle sur Sub-Automation |
        | GRP-Tier1 | Groupe des analystes de premier niveau | Aucun |
        | GRP-DetEng | Groupe des ingénieurs de détection | Aucun |
        | GRP-Fraud | Groupe de l'équipe de lutte contre la fraude au paiement | Aucun |

        Vous disposez du rôle Owner sur Sub-SOC et Sub-Automation.
  - key: requirements
    title: { en: "Requirements", fr: "Exigences" }
    body:
      en: |
        Best For You Organics identifies the following requirements:

        1. **Playbook automation.** Ines Moreau must create a playbook named **PB-BlockShopper** in RG-Playbooks and add it to an automation rule in law-bfyo-soc. The automation rule must run the playbook when incidents are created.
        2. **Workspace access.** GRP-Tier1 must assign, comment on, and close incidents. GRP-DetEng must create analytics rules and install solutions from the Content hub. GRP-Fraud must view incidents and workbooks without changing anything.
        3. **Checkout aggregation.** A scheduled KQL job named **CheckoutHourly** must count the failed requests of each client IP address in CheckoutApi_CL every hour and write the results to a new table in the analytics tier, where an analytics rule will use them.
        4. **Phishing scope.** For each message subject, the analysts must find how many distinct users were allowed to open a link from a message sent from the domain **bfyo-delivery.com** during the last seven days.
        5. **Compromised sign-ins.** When an analyst determines that a risky sign-in was performed by an attacker, the user must be forced to perform a secure password change at the next sign-in. Analysts must not create temporary passwords.
        6. All access must follow the principle of least privilege.
      fr: |
        Best For You Organics a défini les exigences suivantes :

        1. **Automatisation par playbook.** Ines Moreau doit créer un playbook nommé **PB-BlockShopper** dans RG-Playbooks et l'ajouter à une règle d'automatisation de law-bfyo-soc. La règle d'automatisation doit exécuter le playbook à la création des incidents.
        2. **Accès à l'espace de travail.** GRP-Tier1 doit attribuer, commenter et fermer des incidents. GRP-DetEng doit créer des règles d'analytique et installer des solutions du hub de contenu. GRP-Fraud doit consulter les incidents et les classeurs sans rien modifier.
        3. **Agrégation des paiements.** Une tâche KQL planifiée nommée **CheckoutHourly** doit compter toutes les heures les requêtes en échec de chaque adresse IP cliente dans CheckoutApi_CL et écrire les résultats dans une nouvelle table du niveau Analytics, où une règle d'analytique les utilisera.
        4. **Portée de l'hameçonnage.** Pour chaque objet de message, les analystes doivent déterminer combien d'utilisateurs distincts ont été autorisés à ouvrir un lien d'un message envoyé depuis le domaine **bfyo-delivery.com** au cours des sept derniers jours.
        5. **Connexions compromises.** Quand un analyste détermine qu'une connexion à risque a été effectuée par un attaquant, l'utilisateur doit être obligé d'effectuer un changement de mot de passe sécurisé à sa prochaine connexion. Les analystes ne doivent pas créer de mots de passe temporaires.
        6. Tous les accès doivent respecter le principe du moindre privilège.
