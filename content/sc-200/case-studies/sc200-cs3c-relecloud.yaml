id: sc200-cs3c-relecloud
status: draft
title:
  en: Relecloud
  fr: Relecloud
tabs:
  - key: overview
    title: { en: "Overview", fr: "Vue d'ensemble" }
    body:
      en: |
        Relecloud is a video streaming company. Its platform runs entirely on Azure. A small security team of detection engineers, automation engineers and identity engineers operates Microsoft Sentinel, and external auditors review the security operations every quarter.
      fr: |
        Relecloud est une entreprise de streaming vidéo. Sa plateforme s'exécute entièrement sur Azure. Une petite équipe de sécurité composée d'ingénieurs de détection, d'ingénieurs d'automatisation et d'ingénieurs d'identité exploite Microsoft Sentinel, et des auditeurs externes examinent les opérations de sécurité chaque trimestre.
  - key: existing
    title: { en: "Existing environment", fr: "Environnement existant" }
    body:
      en: |
        **Azure**

        - A management group named **MG-Prod** contains 14 subscriptions. The platform team adds new subscriptions to MG-Prod every quarter. You are a member of the platform team and have the Owner role on MG-Prod.
        - A Microsoft Sentinel workspace named **law-rc-sec** is in a resource group named **RG-Sentinel**. The workspace is onboarded to the Microsoft Defender portal and the Microsoft Sentinel data lake is enabled.
        - The playbooks are Logic Apps in a resource group named **RG-Playbooks**.
        - The Azure activity logs of the subscriptions are not collected.

        **Data**

        - The StorageBlobLogs table of the content storage accounts is kept for three years in the Data lake tier only.
        - The managed identity of the data lake has the Log Analytics Contributor role on law-rc-sec.

        **Threat intelligence**

        - Relecloud is a member of a media-sector information sharing center that publishes STIX 2.1 indicators on a TAXII 2.1 server.
        - An internal application named **RC-Intel**, registered in Microsoft Entra ID, produces indicators from incident investigations.

        **Identity**

        - The tenant has Microsoft Entra ID P2 licenses. Microsoft Graph activity logs are not collected.
        - The detection engineers have the Microsoft Entra Security Operator role.
        - The identity engineers have the Log Analytics Contributor role on law-rc-sec and no Microsoft Entra roles.
      fr: |
        **Azure**

        - Un groupe d'administration nommé **MG-Prod** contient 14 abonnements. L'équipe plateforme ajoute de nouveaux abonnements à MG-Prod chaque trimestre. Vous êtes membre de l'équipe plateforme et disposez du rôle Owner sur MG-Prod.
        - Un espace de travail Microsoft Sentinel nommé **law-rc-sec** se trouve dans un groupe de ressources nommé **RG-Sentinel**. L'espace de travail est intégré au portail Microsoft Defender et le data lake Microsoft Sentinel est activé.
        - Les playbooks sont des applications Logic Apps situées dans un groupe de ressources nommé **RG-Playbooks**.
        - Les journaux d'activité Azure des abonnements ne sont pas collectés.

        **Données**

        - La table StorageBlobLogs des comptes de stockage de contenu est conservée trois ans, uniquement dans le niveau Data lake.
        - L'identité managée du data lake dispose du rôle Log Analytics Contributor sur law-rc-sec.

        **Renseignement sur les menaces**

        - Relecloud est membre d'un centre de partage d'informations du secteur des médias qui publie des indicateurs STIX 2.1 sur un serveur TAXII 2.1.
        - Une application interne nommée **RC-Intel**, inscrite dans Microsoft Entra ID, produit des indicateurs à partir des investigations d'incidents.

        **Identité**

        - Le locataire dispose de licences Microsoft Entra ID P2. Les journaux d'activité Microsoft Graph ne sont pas collectés.
        - Les ingénieurs de détection disposent du rôle Microsoft Entra Security Operator.
        - Les ingénieurs d'identité disposent du rôle Log Analytics Contributor sur law-rc-sec et d'aucun rôle Microsoft Entra.
  - key: requirements
    title: { en: "Requirements", fr: "Exigences" }
    body:
      en: |
        Relecloud identifies the following requirements:

        1. **Activity logs**: the Azure activity logs of all the existing and future subscriptions in MG-Prod must be sent to law-rc-sec. Administrative effort must be minimized.
        2. **Permissions**: every team must receive only the permissions it needs:
           - The detection engineers create and edit analytics rules in law-rc-sec.
           - The automation engineers create and edit the playbooks in RG-Playbooks.
           - The auditors view incidents and workbooks without changing anything.
           - A platform team member grants Microsoft Sentinel the permissions to run the playbooks of RG-Playbooks from automation rules.
        3. **Threat intelligence**: the indicators of the information sharing center must be imported automatically, and RC-Intel must send its indicators through a REST API. Deprecated connectors and legacy tables must not be used.
        4. **Graph activity logs**: an identity engineer must configure the collection of the Microsoft Graph activity logs into law-rc-sec. Permissions must follow the principle of least privilege.
        5. **Leaked secret**: after the client secret of an application leaks, the team must list, for each service principal, the successful Microsoft Graph requests to /users during the last three days and the IP addresses used.
        6. **Historical matching**: every day, the detection engineers must search the three years of StorageBlobLogs data for the IP addresses of new indicators and keep the matches in a new table in the Analytics tier.
      fr: |
        Relecloud a défini les exigences suivantes :

        1. **Journaux d'activité** : les journaux d'activité Azure de tous les abonnements existants et futurs de MG-Prod doivent être envoyés à law-rc-sec. L'effort d'administration doit être réduit au minimum.
        2. **Autorisations** : chaque équipe ne doit recevoir que les autorisations dont elle a besoin :
           - Les ingénieurs de détection créent et modifient les règles d'analytique de law-rc-sec.
           - Les ingénieurs d'automatisation créent et modifient les playbooks de RG-Playbooks.
           - Les auditeurs consultent les incidents et les classeurs sans rien modifier.
           - Un membre de l'équipe plateforme accorde à Microsoft Sentinel les autorisations nécessaires pour exécuter les playbooks de RG-Playbooks à partir de règles d'automatisation.
        3. **Renseignement sur les menaces** : les indicateurs du centre de partage d'informations doivent être importés automatiquement, et RC-Intel doit envoyer ses indicateurs par une API REST. Les connecteurs dépréciés et les tables héritées ne doivent pas être utilisés.
        4. **Journaux d'activité Graph** : un ingénieur d'identité doit configurer la collecte des journaux d'activité Microsoft Graph dans law-rc-sec. Les autorisations doivent respecter le principe du moindre privilège.
        5. **Secret divulgué** : après la divulgation du secret client d'une application, l'équipe doit lister, pour chaque principal de service, les requêtes Microsoft Graph réussies vers /users au cours des trois derniers jours et les adresses IP utilisées.
        6. **Correspondance historique** : chaque jour, les ingénieurs de détection doivent rechercher dans les trois ans de données de StorageBlobLogs les adresses IP des nouveaux indicateurs, et conserver les correspondances dans une nouvelle table du niveau Analytics.
