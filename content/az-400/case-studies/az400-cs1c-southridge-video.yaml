id: az400-cs1c-southridge-video
status: draft
title:
  en: |
    Southridge Video
  fr: |
    Southridge Video
tabs:
  - key: overview
    title: { en: "Overview", fr: "Vue d'ensemble" }
    body:
      en: |
        Southridge Video is a video game studio with 140 employees. It develops two games, **Skyforge** and **Tidebreaker**, that share an in-house game engine.

        Art production is partly outsourced to Proseware, an external studio whose artists use internal tools published by Southridge.
      fr: |
        Southridge Video est un studio de jeux vidéo de 140 employés. Il développe deux jeux, **Skyforge** et **Tidebreaker**, qui partagent un moteur de jeu interne.

        La production graphique est en partie sous-traitée à Proseware, un studio externe dont les artistes utilisent des outils internes publiés par Southridge.
  - key: existing
    title: { en: "Existing environment", fr: "Environnement existant" }
    body:
      en: |
        **Repositories**

        The source code is in a GitHub Enterprise Cloud organization named **southridge**.

        | Repository | Content |
        | --- | --- |
        | skyforge | Game code, levels and art assets (.fbx, .psd, .wav files); 2 million files and a 180-GB history |
        | tidebreaker | Game code and art assets |
        | forge-engine | C++ game engine used by both games |

        Every developer clones the whole skyforge repository, which takes more than three hours, even though most of them work in a single folder. Each new art file is committed as a regular Git blob.

        **Azure DevOps**

        Southridge has an Azure DevOps Services organization with a project named **Games**. The project uses Azure Boards for planning and Azure Pipelines for the builds of the GitHub repositories. The pipelines run on a Managed DevOps Pools pool named **mdp-win-build**; each job gets a new Windows VM.

        Internal tools are NuGet packages published to an Azure Artifacts feed named **studio-tools**. The builds also restore about 400 packages from nuget.org, which takes 12 minutes per run. All the .NET projects use packages.lock.json lock files.

        **Incident**

        Last week, a developer pushed a file named config/cdn-storage.json to the main branch of skyforge. The file contains an access key of the storage account that hosts the game patches.
      fr: |
        **Dépôts**

        Le code source se trouve dans une organisation GitHub Enterprise Cloud nommée **southridge**.

        | Dépôt | Contenu |
        | --- | --- |
        | skyforge | Code du jeu, niveaux et ressources graphiques (fichiers .fbx, .psd, .wav) ; 2 millions de fichiers et un historique de 180 Go |
        | tidebreaker | Code du jeu et ressources graphiques |
        | forge-engine | Moteur de jeu C++ utilisé par les deux jeux |

        Chaque développeur clone l'intégralité du dépôt skyforge, ce qui prend plus de trois heures, alors que la plupart d'entre eux travaillent dans un seul dossier. Chaque nouveau fichier graphique est commité comme un blob Git ordinaire.

        **Azure DevOps**

        Southridge dispose d'une organisation Azure DevOps Services avec un projet nommé **Games**. Le projet utilise Azure Boards pour la planification et Azure Pipelines pour les builds des dépôts GitHub. Les pipelines s'exécutent sur un pool Managed DevOps Pools nommé **mdp-win-build** ; chaque travail obtient une nouvelle machine virtuelle Windows.

        Les outils internes sont des packages NuGet publiés dans un flux Azure Artifacts nommé **studio-tools**. Les builds restaurent aussi environ 400 packages depuis nuget.org, ce qui prend 12 minutes par exécution. Tous les projets .NET utilisent des fichiers de verrouillage packages.lock.json.

        **Incident**

        La semaine dernière, un développeur a poussé un fichier nommé config/cdn-storage.json sur la branche main de skyforge. Ce fichier contient une clé d'accès du compte de stockage qui héberge les correctifs du jeu.
  - key: requirements
    title: { en: "Requirements", fr: "Exigences" }
    body:
      en: |
        **Repository requirements**

        1. New art files must be versioned with the code but stored outside the Git object database of skyforge.
        2. Developers must be able to clone skyforge with partial clone and sparse checkout, and keep it maintained in the background, by running a single command.
        3. skyforge and tidebreaker must each include forge-engine at a specific commit, and each game team must choose when to move to a newer commit of the engine.
        4. The leaked storage account key must stop working immediately, and config/cdn-storage.json must be removed from the whole history of skyforge.

        **Planning requirements**

        5. Commits and pull requests in the GitHub repositories must be linked to Azure Boards work items. When a pull request is merged into the default branch, the linked bug must move to its resolved state automatically.

        **Pipeline requirements**

        6. A pull request to the main branch of skyforge must not be mergeable until the Azure Pipelines build of the pull request succeeds.
        7. The NuGet restore time of the builds must be reduced. A build must reuse the packages restored by a previous run until a lock file changes.
        8. Builds must keep working when nuget.org is unavailable.
        9. Proseware artists must be able to install only the versions of the internal tools that the quality assurance team has validated.
        10. Administrative effort must be minimized.
      fr: |
        **Exigences relatives aux dépôts**

        1. Les nouveaux fichiers graphiques doivent être versionnés avec le code mais stockés en dehors de la base d'objets Git de skyforge.
        2. Les développeurs doivent pouvoir cloner skyforge avec un clone partiel et une extraction partielle (sparse checkout), et le maintenir en arrière-plan, en exécutant une seule commande.
        3. skyforge et tidebreaker doivent chacun inclure forge-engine à un commit précis, et chaque équipe de jeu doit choisir quand passer à un commit plus récent du moteur.
        4. La clé du compte de stockage divulguée doit cesser de fonctionner immédiatement, et config/cdn-storage.json doit être supprimé de tout l'historique de skyforge.

        **Exigences de planification**

        5. Les commits et les pull requests des dépôts GitHub doivent être liés à des éléments de travail Azure Boards. Quand une pull request est fusionnée dans la branche par défaut, le bogue lié doit passer automatiquement à son état résolu.

        **Exigences relatives aux pipelines**

        6. Une pull request vers la branche main de skyforge ne doit pas pouvoir être fusionnée tant que la build Azure Pipelines de la pull request n'a pas réussi.
        7. Le temps de restauration NuGet des builds doit être réduit. Une build doit réutiliser les packages restaurés par une exécution précédente tant qu'aucun fichier de verrouillage ne change.
        8. Les builds doivent continuer de fonctionner quand nuget.org est indisponible.
        9. Les artistes de Proseware doivent pouvoir installer uniquement les versions des outils internes que l'équipe d'assurance qualité a validées.
        10. L'effort d'administration doit être réduit au minimum.
