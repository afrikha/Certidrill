id: az400-cs2a-trey-research
status: draft
title:
  en: Trey Research
  fr: Trey Research
tabs:
  - key: overview
    title: { en: "Overview", fr: "Vue d'ensemble" }
    body:
      en: |
        Trey Research is a biopharmaceutical research company. Its head office is in Strasbourg, and its main laboratory is in Montréal. A team of 45 developers builds the software that scientists use to run instruments and record test results.

        Trey Research must follow good practice (GxP) rules for regulated laboratories: every change to production software must be traceable and reviewed by a second person.
      fr: |
        Trey Research est une société de recherche biopharmaceutique. Son siège est à Strasbourg et son laboratoire principal à Montréal. Une équipe de 45 développeurs crée les logiciels que les scientifiques utilisent pour piloter les instruments et enregistrer les résultats d'analyse.

        Trey Research doit respecter les bonnes pratiques (GxP) des laboratoires réglementés : chaque modification d'un logiciel de production doit être traçable et relue par une deuxième personne.
  - key: existing
    title: { en: "Existing environment", fr: "Environnement existant" }
    body:
      en: |
        **Azure DevOps**

        Trey Research has an Azure DevOps Services organization named **treyresearch** that contains a project named **LabPortal**. The project contains an Azure Repos Git repository named **labportal** whose default branch is **main**. All the pipelines are YAML pipelines, and they currently run on Microsoft-hosted agents only.

        An Azure Resource Manager service connection named **sc-trey-validated** authenticates with a service principal. The service principal is a Microsoft Entra user of the LabResults database and a member of its db_owner role.

        **Azure**

        | Resource | Type | Configuration |
        | --- | --- | --- |
        | app-trey-portal | App Service web app | Lab portal, .NET |
        | sql-trey-lab | Logical SQL server | Microsoft Entra authentication enabled |
        | LabResults | Azure SQL Database | Schema maintained in a SQL database project that produces a .dacpac file |

        **Laboratory network**

        Four on-premises servers named LAB-SRV1 to LAB-SRV4 run Windows Server 2022 and host the **Instrument Gateway** service. The laboratory firewall blocks every inbound connection from the internet and allows outbound HTTPS. There is no VPN or ExpressRoute connection between the laboratory network and Azure.

        **Current issues**

        - The Instrument Gateway installer is signed with a code signing certificate, **trey-codesign.pfx**, which is stored on a developer's laptop.
        - Last week, a developer committed a file named **src/LabPortal/appsettings.Production.json** that contains the administrator password of sql-trey-lab. The file is in several commits of main.
      fr: |
        **Azure DevOps**

        Trey Research dispose d'une organisation Azure DevOps Services nommée **treyresearch** qui contient un projet nommé **LabPortal**. Le projet contient un dépôt Git Azure Repos nommé **labportal** dont la branche par défaut est **main**. Tous les pipelines sont des pipelines YAML, et ils s'exécutent aujourd'hui uniquement sur des agents hébergés par Microsoft.

        Une connexion de service Azure Resource Manager nommée **sc-trey-validated** s'authentifie avec un principal de service. Ce principal de service est un utilisateur Microsoft Entra de la base de données LabResults et membre de son rôle db_owner.

        **Azure**

        | Ressource | Type | Configuration |
        | --- | --- | --- |
        | app-trey-portal | Application web App Service | Portail du laboratoire, .NET |
        | sql-trey-lab | Serveur SQL logique | Authentification Microsoft Entra activée |
        | LabResults | Azure SQL Database | Schéma géré dans un projet de base de données SQL qui produit un fichier .dacpac |

        **Réseau du laboratoire**

        Quatre serveurs locaux nommés LAB-SRV1 à LAB-SRV4 exécutent Windows Server 2022 et hébergent le service **Instrument Gateway**. Le pare-feu du laboratoire bloque toute connexion entrante depuis Internet et autorise le trafic HTTPS sortant. Il n'existe aucune connexion VPN ni ExpressRoute entre le réseau du laboratoire et Azure.

        **Problèmes actuels**

        - Le programme d'installation d'Instrument Gateway est signé avec un certificat de signature de code, **trey-codesign.pfx**, stocké sur l'ordinateur portable d'un développeur.
        - La semaine dernière, un développeur a commité un fichier nommé **src/LabPortal/appsettings.Production.json** qui contient le mot de passe administrateur de sql-trey-lab. Le fichier figure dans plusieurs commits de main.
  - key: requirements
    title: { en: "Requirements", fr: "Exigences" }
    body:
      en: |
        Trey Research identifies the following requirements:

        1. Twelve quality assurance (QA) reviewers from a contractor named Litware must create and update bugs in Azure Boards and view the project dashboards. They must not access the source code. License costs must be minimized.
        2. YAML pipelines must deploy the Instrument Gateway service to each laboratory server individually, one server at a time.
        3. The pipeline must deploy the LabResults schema changes from the .dacpac file that the build produces. No SQL login or password may be stored in the pipeline; the deployment must use the identity of sc-trey-validated.
        4. The code signing certificate must be stored encrypted in Azure DevOps, be usable only by authorized pipelines, and the QA lead must approve every pipeline run that uses it.
        5. The password committed to labportal must be removed from the repository history. The time during which the exposed password can be used must be minimized.
        6. Every pull request merged into main must be linked to a work item. The person who pushed the latest changes of a pull request must not be able to approve it.
      fr: |
        Trey Research a défini les exigences suivantes :

        1. Douze relecteurs d'assurance qualité (QA) d'un sous-traitant nommé Litware doivent créer et mettre à jour des bogues dans Azure Boards et consulter les tableaux de bord du projet. Ils ne doivent pas accéder au code source. Les coûts de licence doivent être réduits au minimum.
        2. Des pipelines YAML doivent déployer le service Instrument Gateway sur chaque serveur du laboratoire individuellement, un serveur à la fois.
        3. Le pipeline doit déployer les modifications du schéma de LabResults à partir du fichier .dacpac produit par la build. Aucun identifiant de connexion SQL ni mot de passe ne doit être stocké dans le pipeline ; le déploiement doit utiliser l'identité de sc-trey-validated.
        4. Le certificat de signature de code doit être stocké chiffré dans Azure DevOps, être utilisable uniquement par des pipelines autorisés, et le responsable QA doit approuver chaque exécution de pipeline qui l'utilise.
        5. Le mot de passe commité dans labportal doit être supprimé de l'historique du dépôt. La durée pendant laquelle le mot de passe exposé reste utilisable doit être réduite au minimum.
        6. Chaque pull request fusionnée dans main doit être liée à un élément de travail. La personne qui a poussé les dernières modifications d'une pull request ne doit pas pouvoir l'approuver.
