id: az400-cs2b-relecloud
status: draft
title:
  en: Relecloud
  fr: Relecloud
tabs:
  - key: overview
    title: { en: "Overview", fr: "Vue d'ensemble" }
    body:
      en: |
        Relecloud is a video streaming company that broadcasts live concerts and sports events. It has offices in Amsterdam and Toronto, and 60 engineers organized in one team per microservice.

        Relecloud releases several times a day and wants to remove long-lived credentials from its automation.
      fr: |
        Relecloud est une société de streaming vidéo qui diffuse des concerts et des événements sportifs en direct. Elle a des bureaux à Amsterdam et à Toronto, et 60 ingénieurs organisés en une équipe par microservice.

        Relecloud livre plusieurs fois par jour et souhaite supprimer les informations d'identification de longue durée de son automatisation.
  - key: existing
    title: { en: "Existing environment", fr: "Environnement existant" }
    body:
      en: |
        **GitHub**

        Relecloud uses GitHub Enterprise Cloud with an organization named **relecloud**. GitHub Advanced Security is licensed and enabled for every repository. The organization contains the following private repositories.

        | Repository | Content |
        | --- | --- |
        | catalog-api | .NET API that lists the events |
        | player-service | Node.js service that streams video |
        | home-web | Web front end, including the home page |
        | deploy-manifests | YAML definitions of every container app, including the image tag of each service |

        Each service repository has a GitHub Actions workflow that builds a container image, pushes it to an Azure container registry named **crrelecloud**, and then runs a release job. The release job updates the image tag in deploy-manifests by using a classic personal access token (PAT) created by a lead developer. The catalog-api repository has a GitHub environment named **production**.

        **Azure**

        - Each microservice runs as a container app in an Azure Container Apps environment, in a subscription named **Sub-Stream**.
        - The workflows sign in to Azure by using a service principal client secret stored in a repository secret named AZURE_CREDENTIALS.
        - A workspace-based Application Insights resource named **appi-relecloud** collects the telemetry of every service. Each service sets its own cloud role name.
        - The security team uses Microsoft Defender for Cloud on Sub-Stream. No DevOps environment is connected to Defender for Cloud.

        **Client apps**

        The Relecloud TV app for smart TVs is released from the home-web repository.
      fr: |
        **GitHub**

        Relecloud utilise GitHub Enterprise Cloud avec une organisation nommée **relecloud**. GitHub Advanced Security est sous licence et activé pour chaque dépôt. L'organisation contient les dépôts privés suivants.

        | Dépôt | Contenu |
        | --- | --- |
        | catalog-api | API .NET qui liste les événements |
        | player-service | Service Node.js qui diffuse la vidéo |
        | home-web | Front-end web, y compris la page d'accueil |
        | deploy-manifests | Définitions YAML de chaque application conteneur, y compris la balise d'image de chaque service |

        Chaque dépôt de service contient un workflow GitHub Actions qui génère une image conteneur, la pousse vers un registre de conteneurs Azure nommé **crrelecloud**, puis exécute un travail de mise en production. Ce travail met à jour la balise d'image dans deploy-manifests à l'aide d'un jeton d'accès personnel (PAT) classique créé par un développeur principal. Le dépôt catalog-api possède un environnement GitHub nommé **production**.

        **Azure**

        - Chaque microservice s'exécute comme application conteneur dans un environnement Azure Container Apps, dans un abonnement nommé **Sub-Stream**.
        - Les workflows se connectent à Azure avec le secret client d'un principal de service stocké dans un secret de dépôt nommé AZURE_CREDENTIALS.
        - Une ressource Application Insights basée sur un espace de travail, nommée **appi-relecloud**, collecte la télémétrie de chaque service. Chaque service définit son propre nom de rôle cloud.
        - L'équipe de sécurité utilise Microsoft Defender pour le cloud sur Sub-Stream. Aucun environnement DevOps n'est connecté à Defender pour le cloud.

        **Applications clientes**

        L'application Relecloud TV pour téléviseurs connectés est publiée à partir du dépôt home-web.
  - key: requirements
    title: { en: "Requirements", fr: "Exigences" }
    body:
      en: |
        Relecloud identifies the following requirements:

        1. The workflows must sign in to Azure without any stored client secret. For catalog-api, the trust must allow only the jobs that deploy to the production environment.
        2. The release jobs must update deploy-manifests by using a credential that is not tied to any user account and that expires within one hour.
        3. Release strategies:
           - catalog-api: send a small share of the production traffic to each new revision, then increase it while the error rate stays low.
           - player-service: keep the previous revision running with no traffic so that all the traffic can be switched back at once.
           - home-web: show two home page layouts to random groups of viewers and compare their watch time.
           - Relecloud TV app: release to employees first, then to beta subscribers, and then to all subscribers.
        4. Vulnerable open-source dependencies must be detected in every repository, and pull requests that update them must be created automatically.
        5. The operations team needs the failure rate of incoming requests for each microservice over the last hour.
        6. The security team must see the exposed secrets and the open-source vulnerabilities of all the relecloud repositories in Defender for Cloud. Administrative effort must be minimized.
      fr: |
        Relecloud a défini les exigences suivantes :

        1. Les workflows doivent se connecter à Azure sans aucun secret client stocké. Pour catalog-api, l'approbation ne doit autoriser que les travaux qui déploient vers l'environnement production.
        2. Les travaux de mise en production doivent mettre à jour deploy-manifests avec des informations d'identification qui ne sont liées à aucun compte d'utilisateur et qui expirent en moins d'une heure.
        3. Stratégies de mise en production :
           - catalog-api : envoyer une petite part du trafic de production à chaque nouvelle révision, puis l'augmenter tant que le taux d'erreur reste faible.
           - player-service : conserver la révision précédente en cours d'exécution sans trafic, pour pouvoir y rebasculer tout le trafic d'un coup.
           - home-web : présenter deux mises en page de la page d'accueil à des groupes aléatoires de spectateurs et comparer leur temps de visionnage.
           - Application Relecloud TV : publier d'abord pour les employés, puis pour les abonnés bêta, puis pour tous les abonnés.
        4. Les dépendances open source vulnérables doivent être détectées dans chaque dépôt, et des pull requests qui les mettent à jour doivent être créées automatiquement.
        5. L'équipe d'exploitation a besoin du taux d'échec des requêtes entrantes de chaque microservice sur la dernière heure.
        6. L'équipe de sécurité doit voir dans Defender pour le cloud les secrets exposés et les vulnérabilités open source de tous les dépôts relecloud. L'effort d'administration doit être réduit au minimum.
