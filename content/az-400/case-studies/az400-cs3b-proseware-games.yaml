id: az400-cs3b-proseware-games
status: draft
title:
  en: Proseware Games
  fr: Proseware Games
tabs:
  - key: overview
    title: { en: "Overview", fr: "Vue d'ensemble" }
    body:
      en: |
        Proseware Games is a video game studio in Montréal that employs 90 engineers and 40 artists. The studio develops **Skyforge**, an online multiplayer game, on its own game engine.

        Proseware wants to modernize its build infrastructure and to give an external quality assurance (QA) vendor access to its bug tracking.
      fr: |
        Proseware Games est un studio de jeux vidéo de Montréal qui emploie 90 ingénieurs et 40 artistes. Le studio développe **Skyforge**, un jeu multijoueur en ligne, sur son propre moteur de jeu.

        Proseware veut moderniser son infrastructure de build et donner à un prestataire externe d'assurance qualité (QA) l'accès à son suivi des bogues.
  - key: existing
    title: { en: "Existing environment", fr: "Environnement existant" }
    body:
      en: |
        **Azure DevOps**

        - Proseware has an Azure DevOps Services organization named **proseware** that contains a project named **Skyforge**. The project uses Azure Boards with the Agile process.
        - An Azure Repos Git repository named **skyforge** has a default branch named **main** and the top-level folders **/Engine**, **/Game**, and **/Tools**. main has no branch policies.
        - A security group named **Engine Leads** contains the six senior engine programmers.
        - The engine tools are published as NuGet packages to a project-scoped Azure Artifacts feed named **EngineTools**. A CI pipeline publishes a new version of each package on every build of main. EngineTools has no upstream source; the packages that the engine uses from nuget.org are restored directly from nuget.org.

        **Build infrastructure**

        - Four self-hosted Windows agents run on physical computers in the Montréal office.
        - The builds need the Skyforge SDK, which takes several hours to install. The platform team has published a Windows image that contains the SDK in an Azure compute gallery.
        - The builds must check out a license from a license server that is reachable only from a virtual network named **vnet-build** in Azure.

        **QA vendor**

        Adatum QA provides eight testers. They will sign in to Azure DevOps by using Microsoft Entra guest accounts.
      fr: |
        **Azure DevOps**

        - Proseware dispose d'une organisation Azure DevOps Services nommée **proseware** qui contient un projet nommé **Skyforge**. Le projet utilise Azure Boards avec le processus Agile.
        - Un dépôt Git Azure Repos nommé **skyforge** a une branche par défaut nommée **main** et les dossiers de premier niveau **/Engine**, **/Game** et **/Tools**. main n'a aucune stratégie de branche.
        - Un groupe de sécurité nommé **Engine Leads** contient les six programmeurs moteur seniors.
        - Les outils du moteur sont publiés sous forme de packages NuGet dans un flux Azure Artifacts limité au projet, nommé **EngineTools**. Un pipeline CI publie une nouvelle version de chaque package à chaque build de main. EngineTools n'a aucune source en amont ; les packages que le moteur utilise depuis nuget.org sont restaurés directement depuis nuget.org.

        **Infrastructure de build**

        - Quatre agents Windows auto-hébergés s'exécutent sur des ordinateurs physiques du bureau de Montréal.
        - Les builds ont besoin du SDK Skyforge, dont l'installation prend plusieurs heures. L'équipe plateforme a publié une image Windows qui contient le SDK dans une galerie de calcul Azure.
        - Les builds doivent obtenir une licence auprès d'un serveur de licences accessible uniquement depuis un réseau virtuel Azure nommé **vnet-build**.

        **Prestataire QA**

        Adatum QA fournit huit testeurs. Ils se connecteront à Azure DevOps à l'aide de comptes invités Microsoft Entra.
  - key: requirements
    title: { en: "Requirements", fr: "Exigences" }
    body:
      en: |
        **Source control**

        1. A pull request into main that changes any file in /Engine must be approved by a member of Engine Leads before it can be completed.
        2. Each pull request completed into main must add a single commit to the history of main.
        3. Each released build of Skyforge must be identified by a Git tag, such as **v1.8.0**, that stores the name of the release manager, the date, and a description.

        **Build infrastructure**

        4. The office agents must be replaced by agents that use the image from the Azure compute gallery and can reach the license server.
        5. The number of agents must follow the demand.
        6. Proseware does not want to manage agent virtual machines or scale sets in its own subscriptions, and the agents must not consume the compute quota of its subscriptions.

        **Packages**

        7. The game projects must consume only the EngineTools package versions that the QA team has validated.
        8. The engine builds must still restore the nuget.org packages that they already use if nuget.org is unavailable.
        9. EngineTools must keep at most the 25 most recent versions of each package, except versions downloaded during the last 30 days. Validated versions must never be deleted.

        **Access**

        10. The Adatum QA testers must create and edit bugs, move cards on the Skyforge board, and view the project dashboards. They must not access the source code, and their access must not incur any license cost.
        11. Administrative effort must be minimized.
      fr: |
        **Contrôle de code source**

        1. Une pull request vers main qui modifie un fichier de /Engine doit être approuvée par un membre d'Engine Leads avant de pouvoir être terminée.
        2. Chaque pull request terminée dans main doit ajouter un seul commit à l'historique de main.
        3. Chaque build mise en production de Skyforge doit être identifiée par une balise Git, par exemple **v1.8.0**, qui stocke le nom du responsable de la mise en production, la date et une description.

        **Infrastructure de build**

        4. Les agents du bureau doivent être remplacés par des agents qui utilisent l'image de la galerie de calcul Azure et peuvent joindre le serveur de licences.
        5. Le nombre d'agents doit suivre la demande.
        6. Proseware ne veut pas gérer de machines virtuelles d'agents ni de groupes identiques dans ses propres abonnements, et les agents ne doivent pas consommer le quota de calcul de ses abonnements.

        **Packages**

        7. Les projets de jeu doivent consommer uniquement les versions de packages EngineTools que l'équipe QA a validées.
        8. Les builds du moteur doivent toujours pouvoir restaurer les packages nuget.org qu'elles utilisent déjà si nuget.org est indisponible.
        9. EngineTools doit conserver au plus les 25 versions les plus récentes de chaque package, sauf les versions téléchargées au cours des 30 derniers jours. Les versions validées ne doivent jamais être supprimées.

        **Accès**

        10. Les testeurs d'Adatum QA doivent créer et modifier des bogues, déplacer des cartes sur le tableau Skyforge et consulter les tableaux de bord du projet. Ils ne doivent pas accéder au code source, et leur accès ne doit entraîner aucun coût de licence.
        11. L'effort d'administration doit être réduit au minimum.
