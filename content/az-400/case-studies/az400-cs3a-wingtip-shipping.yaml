id: az400-cs3a-wingtip-shipping
status: draft
title:
  en: Wingtip Shipping
  fr: Wingtip Shipping
tabs:
  - key: overview
    title: { en: "Overview", fr: "Vue d'ensemble" }
    body:
      en: |
        Wingtip Shipping operates container terminals in Rotterdam, Le Havre, and Tangier. A platform team of 30 engineers develops **PortCall**, a berth-scheduling platform that shipping lines and harbor pilots use to book arrival windows.

        PortCall is made of containerized microservices that run in Azure. Wingtip wants to release more often while reducing the impact of a faulty release on the terminals.
      fr: |
        Wingtip Shipping exploite des terminaux à conteneurs à Rotterdam, au Havre et à Tanger. Une équipe plateforme de 30 ingénieurs développe **PortCall**, une plateforme de planification des postes à quai que les compagnies maritimes et les pilotes du port utilisent pour réserver des créneaux d'arrivée.

        PortCall est composée de microservices en conteneurs qui s'exécutent dans Azure. Wingtip veut livrer plus souvent tout en réduisant l'impact d'une mise en production défectueuse sur les terminaux.
  - key: existing
    title: { en: "Existing environment", fr: "Environnement existant" }
    body:
      en: |
        **GitHub**

        - Wingtip has a GitHub Enterprise Cloud organization named **wingtip**. The source code of PortCall is in a repository named **wingtip/portcall** whose default branch is **main**.
        - GitHub Advanced Security is enabled on wingtip/portcall: secret scanning, code scanning with CodeQL, and Dependabot alerts.
        - A workflow builds the container images and pushes them to an Azure container registry named **crwingtip**. A job named **deploy** declares `environment: production` and deploys the images by using the Azure CLI.

        **Azure**

        | Resource | Type | Configuration |
        | --- | --- | --- |
        | RG-PortCall-Prod | Resource group | Subscription Sub-PortCall |
        | cae-portcall | Container Apps environment | Hosts the container apps below |
        | berth-api, vessel-tracker, billing | Container apps | Ingress enabled, **single revision mode** |
        | appi-portcall | Application Insights | Workspace-based; every container app sends requests, dependencies, and exceptions |

        berth-api calls several external HTTP services, including the APIs of the harbor authorities and of the pilotage companies.

        **Planning and identity**

        - The product team plans the work in an Azure DevOps Services project named **PortCall** that uses the Agile process. User stories have the states New, Active, Resolved, and Closed.
        - The PortCall project is connected to wingtip/portcall by using the Azure Boards app for GitHub.
        - In the Microsoft Entra tenant, users cannot register applications, and the security team does not create new application registrations for automation. The platform team has the Owner role on RG-PortCall-Prod.
      fr: |
        **GitHub**

        - Wingtip dispose d'une organisation GitHub Enterprise Cloud nommée **wingtip**. Le code source de PortCall se trouve dans un dépôt nommé **wingtip/portcall** dont la branche par défaut est **main**.
        - GitHub Advanced Security est activé sur wingtip/portcall : analyse des secrets, analyse du code avec CodeQL et alertes Dependabot.
        - Un workflow génère les images conteneur et les envoie dans un registre de conteneurs Azure nommé **crwingtip**. Un travail nommé **deploy** déclare `environment: production` et déploie les images à l'aide d'Azure CLI.

        **Azure**

        | Ressource | Type | Configuration |
        | --- | --- | --- |
        | RG-PortCall-Prod | Groupe de ressources | Abonnement Sub-PortCall |
        | cae-portcall | Environnement Container Apps | Héberge les applications conteneur ci-dessous |
        | berth-api, vessel-tracker, billing | Applications conteneur | Entrée activée, **mode révision unique** |
        | appi-portcall | Application Insights | Basé sur un espace de travail ; chaque application conteneur envoie des requêtes, des dépendances et des exceptions |

        berth-api appelle plusieurs services HTTP externes, notamment les API des autorités portuaires et des sociétés de pilotage.

        **Planification et identité**

        - L'équipe produit planifie le travail dans un projet Azure DevOps Services nommé **PortCall** qui utilise le processus Agile. Les récits utilisateur ont les états New, Active, Resolved et Closed.
        - Le projet PortCall est connecté à wingtip/portcall à l'aide de l'application Azure Boards pour GitHub.
        - Dans le locataire Microsoft Entra, les utilisateurs ne peuvent pas inscrire d'applications, et l'équipe de sécurité ne crée pas de nouvelles inscriptions d'applications pour l'automatisation. L'équipe plateforme a le rôle Owner sur RG-PortCall-Prod.
  - key: requirements
    title: { en: "Requirements", fr: "Exigences" }
    body:
      en: |
        **Deployment**

        1. The deploy job must authenticate to Azure without any client secret, certificate, or other long-lived credential stored in GitHub.
        2. Only jobs of wingtip/portcall that run in the **production** environment must be able to obtain an Azure token for RG-PortCall-Prod.
        3. A new version of berth-api must first receive 10 percent of the production traffic while the current version keeps the remaining 90 percent. If the new version misbehaves, all the traffic must return to the current version within minutes, without rebuilding or redeploying an image.

        **Security**

        4. The security team must see the security posture of the wingtip organization, including the findings of GitHub Advanced Security, in Microsoft Defender for Cloud.

        **Monitoring**

        5. After each release, the team must identify the external services that berth-api fails to call most often.

        **Traceability**

        6. When a pull request is merged into main, every user story that the pull request completes must move automatically to the Resolved state.
        7. Administrative effort must be minimized.
      fr: |
        **Déploiement**

        1. Le travail deploy doit s'authentifier auprès d'Azure sans secret client, certificat ni autre information d'identification de longue durée stockés dans GitHub.
        2. Seuls les travaux de wingtip/portcall qui s'exécutent dans l'environnement **production** doivent pouvoir obtenir un jeton Azure pour RG-PortCall-Prod.
        3. Une nouvelle version de berth-api doit d'abord recevoir 10 % du trafic de production pendant que la version actuelle conserve les 90 % restants. Si la nouvelle version se comporte mal, tout le trafic doit revenir à la version actuelle en quelques minutes, sans regénérer ni redéployer d'image.

        **Sécurité**

        4. L'équipe de sécurité doit voir la posture de sécurité de l'organisation wingtip, y compris les résultats de GitHub Advanced Security, dans Microsoft Defender pour le cloud.

        **Supervision**

        5. Après chaque mise en production, l'équipe doit identifier les services externes que berth-api échoue le plus souvent à appeler.

        **Traçabilité**

        6. Quand une pull request est fusionnée dans main, chaque récit utilisateur que la pull request termine doit passer automatiquement à l'état Resolved.
        7. L'effort d'administration doit être réduit au minimum.
