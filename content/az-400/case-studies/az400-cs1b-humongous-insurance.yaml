id: az400-cs1b-humongous-insurance
status: draft
title:
  en: |
    Humongous Insurance
  fr: |
    Humongous Insurance
tabs:
  - key: overview
    title: { en: "Overview", fr: "Vue d'ensemble" }
    body:
      en: |
        Humongous Insurance is a property and casualty insurer. Its head office and its only datacenter are in Hartford.

        The claims department uses a claims portal developed in house by a team of 12 developers. Two release managers approve every production release. The company is modernizing the delivery of the claims portal.
      fr: |
        Humongous Insurance est un assureur de biens et de responsabilité. Son siège et son unique centre de données se trouvent à Hartford.

        Le service des sinistres utilise un portail de gestion des sinistres développé en interne par une équipe de 12 développeurs. Deux responsables des mises en production approuvent chaque mise en production. L'entreprise modernise la livraison du portail des sinistres.
  - key: existing
    title: { en: "Existing environment", fr: "Environnement existant" }
    body:
      en: |
        **Azure DevOps**

        Humongous Insurance has an Azure DevOps Services organization that contains a project named **Claims** based on the Agile process. The project contains:

        - two Azure Repos Git repositories: **claims-portal** (ASP.NET Core application) and **claims-db** (SQL Server database project that produces a DACPAC file);
        - a YAML build pipeline that produces the web package and the DACPAC file;
        - a classic release pipeline named **Claims-Release** with the stages Test and Production. The Production stage has a pre-deployment approval by the **Release Managers** group;
        - a group named **Claims Analysts** that contains 25 business analysts of the claims department. None of them has an Azure DevOps license.

        All the pipelines run on Microsoft-hosted agents.

        **Azure**

        | Resource | Configuration |
        | --- | --- |
        | app-claims-prod | App Service web app in a Premium v3 plan, with a deployment slot named **staging** |
        | sqldb-claims | Azure SQL database used by the production slot and by the staging slot |

        **On-premises**

        A policy rating service named **rating.humongous.local** runs on a Windows server in the Hartford datacenter. It requires client certificate authentication. There is no VPN or ExpressRoute connection between the datacenter and Azure. The datacenter firewall blocks all inbound connections from the internet and allows outbound HTTPS.
      fr: |
        **Azure DevOps**

        Humongous Insurance dispose d'une organisation Azure DevOps Services qui contient un projet nommé **Claims** basé sur le processus Agile. Le projet contient :

        - deux dépôts Git Azure Repos : **claims-portal** (application ASP.NET Core) et **claims-db** (projet de base de données SQL Server qui produit un fichier DACPAC) ;
        - un pipeline de build YAML qui produit le package web et le fichier DACPAC ;
        - un pipeline de mise en production classique nommé **Claims-Release** avec les phases Test et Production. La phase Production a une approbation avant déploiement par le groupe **Release Managers** ;
        - un groupe nommé **Claims Analysts** qui contient 25 analystes métier du service des sinistres. Aucun d'eux ne dispose d'une licence Azure DevOps.

        Tous les pipelines s'exécutent sur des agents hébergés par Microsoft.

        **Azure**

        | Ressource | Configuration |
        | --- | --- |
        | app-claims-prod | Application web App Service dans un plan Premium v3, avec un emplacement de déploiement nommé **staging** |
        | sqldb-claims | Base de données Azure SQL utilisée par l'emplacement de production et par l'emplacement staging |

        **Local**

        Un service de tarification des contrats nommé **rating.humongous.local** s'exécute sur un serveur Windows du centre de données de Hartford. Il exige une authentification par certificat client. Il n'existe aucune connexion VPN ni ExpressRoute entre le centre de données et Azure. Le pare-feu du centre de données bloque toutes les connexions entrantes depuis Internet et autorise le trafic HTTPS sortant.
  - key: requirements
    title: { en: "Requirements", fr: "Exigences" }
    body:
      en: |
        **Pipeline requirements**

        1. Claims-Release must be replaced by a multi-stage YAML pipeline that deploys to a YAML environment named **claims-prod**.
        2. A deployment to claims-prod must start only after a member of Release Managers approves it, only for runs of the main branch, only from Monday to Friday between 08:00 and 17:00 Eastern Time, and only when no Azure Monitor alert of app-claims-prod is fired.
        3. The integration tests must call rating.humongous.local from a pipeline job. No inbound firewall rule may be added, and no new network connection to Azure may be created.
        4. The client certificate used by the integration tests is a file named **rating-client.pfx**. It must never be stored in a repository and must be available only to the pipelines that you authorize.

        **Deployment requirements**

        5. Deployments of the claims portal must cause no downtime.
        6. The new version must pass smoke tests before it receives production traffic.
        7. Schema changes are always backward compatible. The new version of the claims portal checks the schema version at startup and stops if the database has not been updated.

        **Planning requirements**

        8. The business analysts must be able to create and update user stories and see them on the boards, at no license cost. They must not access the source code.
        9. The claims manager wants a dashboard widget that shows the average time between the creation of a user story and its completion.
      fr: |
        **Exigences relatives aux pipelines**

        1. Claims-Release doit être remplacé par un pipeline YAML multiphase qui déploie dans un environnement YAML nommé **claims-prod**.
        2. Un déploiement dans claims-prod ne doit démarrer qu'après l'approbation d'un membre de Release Managers, uniquement pour les exécutions de la branche main, uniquement du lundi au vendredi entre 08:00 et 17:00 (heure de l'Est), et uniquement quand aucune alerte Azure Monitor d'app-claims-prod n'est déclenchée.
        3. Les tests d'intégration doivent appeler rating.humongous.local depuis un travail de pipeline. Aucune règle de pare-feu entrante ne doit être ajoutée, et aucune nouvelle connexion réseau vers Azure ne doit être créée.
        4. Le certificat client utilisé par les tests d'intégration est un fichier nommé **rating-client.pfx**. Il ne doit jamais être stocké dans un dépôt et ne doit être disponible que pour les pipelines que vous autorisez.

        **Exigences de déploiement**

        5. Les déploiements du portail des sinistres ne doivent provoquer aucune interruption de service.
        6. La nouvelle version doit réussir des tests de fumée avant de recevoir le trafic de production.
        7. Les modifications de schéma sont toujours rétrocompatibles. La nouvelle version du portail des sinistres vérifie la version du schéma au démarrage et s'arrête si la base de données n'a pas été mise à jour.

        **Exigences de planification**

        8. Les analystes métier doivent pouvoir créer et mettre à jour des récits utilisateur et les voir sur les tableaux, sans coût de licence. Ils ne doivent pas accéder au code source.
        9. Le responsable des sinistres veut un widget de tableau de bord qui affiche le temps moyen entre la création d'un récit utilisateur et son achèvement.
