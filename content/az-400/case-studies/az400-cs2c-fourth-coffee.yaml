id: az400-cs2c-fourth-coffee
status: draft
title:
  en: Fourth Coffee
  fr: Fourth Coffee
tabs:
  - key: overview
    title: { en: "Overview", fr: "Vue d'ensemble" }
    body:
      en: |
        Fourth Coffee is a chain of 300 coffee shops in North America. Customers order and pay ahead with the Fourth Coffee mobile app and collect their drinks in store.

        A product team of 25 people plans its work in Azure Boards and keeps its source code in GitHub. Store traffic peaks between 06:00 and 10:00, so deployments must cause no downtime.
      fr: |
        Fourth Coffee est une chaîne de 300 cafés en Amérique du Nord. Les clients commandent et paient à l'avance avec l'application mobile Fourth Coffee et récupèrent leurs boissons en magasin.

        Une équipe produit de 25 personnes planifie son travail dans Azure Boards et conserve son code source dans GitHub. L'affluence en magasin culmine entre 6 h et 10 h : les déploiements ne doivent provoquer aucune interruption de service.
  - key: existing
    title: { en: "Existing environment", fr: "Environnement existant" }
    body:
      en: |
        **GitHub**

        The GitHub organization **fourthcoffee** contains two repositories:

        - **order-api**: a Node.js API that receives the mobile orders. Its default branch is main.
        - **ui-kit**: an npm package of shared UI components, named @fourthcoffee/ui-kit, used by several teams.

        **Azure DevOps**

        The Azure DevOps organization **fourthcoffee** contains a project named **Ordering** that uses the Agile process. In Ordering:

        - The team tracks user stories and bugs in Azure Boards. No GitHub repository is connected to Azure Boards yet.
        - A YAML pipeline named **order-api-ci** builds and tests order-api. It connects to GitHub through the Azure Pipelines GitHub App and posts its results as a GitHub check.
        - A YAML pipeline named **order-api-cd** deploys order-api by using deployment jobs that target an environment named **production**.
        - A project-scoped Azure Artifacts feed named **fc-npm** stores @fourthcoffee/ui-kit. The feed has no upstream source.

        **Azure**

        | Resource | Type | Configuration |
        | --- | --- | --- |
        | app-fc-order | App Service web app (Linux) | Premium v3 plan, deployment slot named **staging** |
        | appcs-fc | App Configuration store | Feature flags of order-api |
        | appi-fc-order | Application Insights | Alert rules on failed orders and response time |

        All the resources are in a resource group named **rg-fc-order**, and the pipelines use an Azure Resource Manager service connection named **sc-fc-prod**.
      fr: |
        **GitHub**

        L'organisation GitHub **fourthcoffee** contient deux dépôts :

        - **order-api** : une API Node.js qui reçoit les commandes mobiles. Sa branche par défaut est main.
        - **ui-kit** : un package npm de composants d'interface partagés, nommé @fourthcoffee/ui-kit, utilisé par plusieurs équipes.

        **Azure DevOps**

        L'organisation Azure DevOps **fourthcoffee** contient un projet nommé **Ordering** qui utilise le processus Agile. Dans Ordering :

        - L'équipe suit les récits utilisateur et les bogues dans Azure Boards. Aucun dépôt GitHub n'est encore connecté à Azure Boards.
        - Un pipeline YAML nommé **order-api-ci** génère et teste order-api. Il se connecte à GitHub par l'application GitHub Azure Pipelines et publie ses résultats sous forme de vérification GitHub.
        - Un pipeline YAML nommé **order-api-cd** déploie order-api avec des travaux de déploiement qui ciblent un environnement nommé **production**.
        - Un flux Azure Artifacts limité au projet, nommé **fc-npm**, stocke @fourthcoffee/ui-kit. Le flux n'a aucune source en amont.

        **Azure**

        | Ressource | Type | Configuration |
        | --- | --- | --- |
        | app-fc-order | Application web App Service (Linux) | Plan Premium v3, emplacement de déploiement nommé **staging** |
        | appcs-fc | Magasin App Configuration | Indicateurs de fonctionnalité d'order-api |
        | appi-fc-order | Application Insights | Règles d'alerte sur les commandes en échec et le temps de réponse |

        Toutes les ressources se trouvent dans un groupe de ressources nommé **rg-fc-order**, et les pipelines utilisent une connexion de service Azure Resource Manager nommée **sc-fc-prod**.
  - key: requirements
    title: { en: "Requirements", fr: "Exigences" }
    body:
      en: |
        Fourth Coffee identifies the following requirements:

        1. Pull requests of order-api must be linked to the user stories they implement. When a pull request that fixes a user story is merged into main, the story must move automatically to its Resolved state.
        2. npm packages:
           - Developers must still be able to restore public npm packages when the npmjs.com registry is unavailable.
           - Beta testers must receive the ui-kit versions that passed integration tests.
           - The other teams must receive only the ui-kit versions approved by QA.
        3. order-api must be deployed with no downtime: the new version is deployed and warmed up before it receives production traffic.
        4. A new loyalty feature must be enabled for every customer of five pilot stores and for 10 percent of the other customers, without redeploying order-api.
        5. Deployments to the production environment must run only from main, and they must wait while any alert rule of appi-fc-order is fired.
        6. Pull requests into main of order-api must be blocked until order-api-ci succeeds.
      fr: |
        Fourth Coffee a défini les exigences suivantes :

        1. Les pull requests d'order-api doivent être liées aux récits utilisateur qu'elles implémentent. Lorsqu'une pull request qui corrige un récit utilisateur est fusionnée dans main, le récit doit passer automatiquement à son état Resolved.
        2. Packages npm :
           - Les développeurs doivent pouvoir restaurer les packages npm publics même lorsque le registre npmjs.com est indisponible.
           - Les bêta-testeurs doivent recevoir les versions d'ui-kit qui ont réussi les tests d'intégration.
           - Les autres équipes ne doivent recevoir que les versions d'ui-kit approuvées par l'équipe QA.
        3. order-api doit être déployée sans interruption de service : la nouvelle version est déployée et préchauffée avant de recevoir le trafic de production.
        4. Une nouvelle fonctionnalité de fidélité doit être activée pour tous les clients de cinq magasins pilotes et pour 10 % des autres clients, sans redéployer order-api.
        5. Les déploiements vers l'environnement production ne doivent s'exécuter qu'à partir de main, et ils doivent attendre tant qu'une règle d'alerte d'appi-fc-order est déclenchée.
        6. Les pull requests vers main d'order-api doivent être bloquées tant qu'order-api-ci n'a pas réussi.
