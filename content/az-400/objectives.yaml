# AZ-400 objectives — official study guide, skills measured as of 2026-07-27 (en-us and fr-fr pages).
# `code` is the stable key referenced by question files and course sections.
# French titles are those of the fr-fr study guide (straight apostrophes, no final period).
processes:
- group:
    en: Design and implement traceability and flow of work
    fr: Concevoir et implémenter la traçabilité et le flux de travail
  objectives:
  - code: 1.1.1
    en: Design and implement a structure for the flow of work, including GitHub Flow
    fr: Concevoir et implémenter une structure pour le flux de travail, y compris GitHub Flow
  - code: 1.1.2
    en: Design and implement a strategy for feedback cycles, including notifications and GitHub Issues
    fr: Concevoir et implémenter une stratégie pour les cycles de commentaires, y compris les notifications et GitHub Issues
  - code: 1.1.3
    en: Design and implement integration for tracking work, including GitHub projects, Azure Boards, and repositories
    fr: Concevoir et implémenter l'intégration pour le suivi du travail, y compris les projets GitHub, Azure Boards et les dépôts
  - code: 1.1.4
    en: Design and implement source, bug, and quality traceability
    fr: Concevoir et implémenter la traçabilité des sources, des bogues et de la qualité
- group:
    en: Design and implement appropriate metrics and queries for DevOps
    fr: Concevoir et implémenter des métriques et des requêtes appropriées pour DevOps
  objectives:
  - code: 1.2.1
    en: Design and implement a dashboard, including flow of work, such as cycle times, time to recovery, and lead time
    fr: Concevoir et implémenter un tableau de bord, y compris le flux de travail, comme les durées des cycles, le temps de récupération et les délais
  - code: 1.2.2
    en: Design and implement appropriate metrics and queries for project planning
    fr: Concevoir et implémenter des métriques et des requêtes appropriées pour la planification des projets
  - code: 1.2.3
    en: Design and implement appropriate metrics and queries for development
    fr: Concevoir et implémenter des métriques et des requêtes appropriées pour le développement
  - code: 1.2.4
    en: Design and implement appropriate metrics and queries for testing
    fr: Concevoir et implémenter des métriques et des requêtes appropriées pour les tests
  - code: 1.2.5
    en: Design and implement appropriate metrics and queries for security
    fr: Concevoir et implémenter des métriques et des requêtes appropriées pour la sécurité
  - code: 1.2.6
    en: Design and implement appropriate metrics and queries for delivery
    fr: Concevoir et implémenter des métriques et des requêtes appropriées pour la livraison
  - code: 1.2.7
    en: Design and implement appropriate metrics and queries for operations
    fr: Concevoir et implémenter des métriques et des requêtes appropriées pour les opérations
- group:
    en: Configure collaboration and communication
    fr: Configurer la collaboration et la communication
  objectives:
  - code: 1.3.1
    en: Document a project by configuring wikis and process diagrams, including Markdown and Mermaid syntax
    fr: Documenter un projet en configurant des wikis et des diagrammes des processus, y compris la syntaxe Markdown et Mermaid
  - code: 1.3.2
    en: Configure release documentation, including release notes and API documentation
    fr: Configurer la documentation de mise en production, y compris les notes de publication et la documentation d'API
  - code: 1.3.3
    en: Automate creation of documentation from Git history
    fr: Automatiser la création de la documentation à partir de l'historique Git
  - code: 1.3.4
    en: Configure integration by using webhooks
    fr: Configurer l'intégration en utilisant des webhooks
  - code: 1.3.5
    en: Configure integration between Azure Boards and GitHub repositories
    fr: Configurer l'intégration entre Azure Boards et les référentiels GitHub
  - code: 1.3.6
    en: Configure integration between GitHub or Azure DevOps and Microsoft Teams
    fr: Configurer l'intégration entre GitHub ou Azure DevOps et Microsoft Teams
source-control:
- group:
    en: Design and implement branching strategies for the source code
    fr: Concevoir et implémenter des stratégies de création de branches pour le code source
  objectives:
  - code: 2.1.1
    en: Design a branch strategy, including trunk-based, feature branch, and release branch
    fr: Concevoir une stratégie de branche, y compris basée sur le tronc, branche de fonctionnalité et branche de mise en production
  - code: 2.1.2
    en: Design and implement a pull request workflow by using branch policies and branch protection rules
    fr: Concevoir et implémenter un workflow de pull request à l'aide de politiques de branche et de règles de protection des branches
  - code: 2.1.3
    en: Implement branch merging restrictions by using branch policies and branch protection rules
    fr: Implémenter des restrictions de fusion de branche à l'aide de stratégies de branche et de règles de protection de branche
- group:
    en: Configure and manage repositories
    fr: Configurer et gérer des dépôts
  objectives:
  - code: 2.2.1
    en: Design and implement a strategy for managing large files, including Git Large File Storage (LFS) and git-fat
    fr: Concevoir et implémenter une stratégie pour la gestion des grands fichiers, y compris Git Large File Storage (LFS) et git-fat
  - code: 2.2.2
    en: Design a strategy for scaling and optimizing a Git repository, including Scalar and cross-repository sharing
    fr: Concevoir une stratégie pour la mise à l'échelle et l'optimisation d'un dépôt Git, y compris Scalar et le partage entre dépôts
  - code: 2.2.3
    en: Configure permissions in the source control repository
    fr: Configurer des autorisations dans le dépôt de contrôle de code source
  - code: 2.2.4
    en: Configure tags to organize the source control repository
    fr: Configurer des balises pour organiser le dépôt de gestion du code source
  - code: 2.2.5
    en: Recover specific data by using Git commands
    fr: Récupérer des données spécifiques en utilisant des commandes Git
  - code: 2.2.6
    en: Remove specific data from source control
    fr: Supprimer des données spécifiques du contrôle de code source
pipelines:
- group:
    en: Design and implement a package management strategy
    fr: Concevoir et implémenter une stratégie de gestion des packages
  objectives:
  - code: 3.1.1
    en: Recommend package management tools including GitHub Packages and Azure Artifacts
    fr: Recommander des outils de gestion des packages, notamment GitHub Packages et Azure Artifacts
  - code: 3.1.2
    en: Design and implement package feeds and views for local and upstream packages
    fr: Concevoir et implémenter des flux et des vues de package pour des packages locaux et en amont
  - code: 3.1.3
    en: Design and implement a dependency versioning strategy for code assets and packages, including semantic versioning (SemVer) and date-based (CalVer)
    fr: Concevoir et implémenter une stratégie de versionnement des dépendances pour les packages et actifs de code, y compris le versionnement sémantique (SemVer) et basé sur les dates (CalVer)
  - code: 3.1.4
    en: Design and implement a versioning strategy for pipeline artifacts
    fr: Concevoir et implémenter une stratégie de versioning pour les artefacts de pipeline
- group:
    en: Design and implement a testing strategy for pipelines
    fr: Concevoir et implémenter une stratégie de test pour les pipelines
  objectives:
  - code: 3.2.1
    en: Design and implement quality and release gates, including security and governance
    fr: Concevoir et implémenter des barrières de qualité et de mise en production, y compris la sécurité et la gouvernance
  - code: 3.2.2
    en: Design a comprehensive testing strategy, including local tests, unit tests, integration tests, and load tests
    fr: Concevoir et implémenter une stratégie de test complète, y compris les tests locaux, les tests unitaires, les tests d'intégration et les tests de charge
  - code: 3.2.3
    en: Implement tests in a pipeline, including configuring test tasks, configuring test agents, and integration of test results
    fr: Implémenter des tests dans un pipeline, y compris la configuration des tâches de test, la configuration des agents de test et l'intégration des résultats des tests
  - code: 3.2.4
    en: Implement code coverage analysis
    fr: Implémenter l'analyse de la couverture du code
- group:
    en: Design and implement pipelines
    fr: Concevoir et implémenter des pipelines
  objectives:
  - code: 3.3.1
    en: Select a deployment automation solution, including GitHub Actions and Azure Pipelines
    fr: Sélectionner une solution d'automatisation du déploiement, y compris GitHub Actions et Azure Pipelines
  - code: 3.3.2
    en: Design and implement a GitHub runner or Azure DevOps agent infrastructure, including cost, tool selection, licenses, connectivity, and maintainability
    fr: Concevoir et implémenter un exécuteur GitHub ou une infrastructure d'agent Azure DevOps, y compris le coût, la sélection des outils, les licences, la connectivité et la maintenabilité
  - code: 3.3.3
    en: Design and implement integration between GitHub repositories and Azure Pipelines
    fr: Concevoir et implémenter l'intégration entre des dépôts GitHub et Azure Pipelines
  - code: 3.3.4
    en: Develop and implement pipeline trigger rules
    fr: Développer et implémenter des règles de déclencheur de pipeline
  - code: 3.3.5
    en: Develop pipelines by using YAML
    fr: Développer des pipelines en utilisant YAML
  - code: 3.3.6
    en: Design and implement a strategy for job execution order, including parallelism and multi-stage pipelines
    fr: Concevoir et implémenter une stratégie pour l'ordre d'exécution des travaux, y compris le parallélisme et les pipelines à phases multiples
  - code: 3.3.7
    en: Develop and implement complex pipeline scenarios, such as hybrid pipelines, VM templates, and self-hosted runners or agents
    fr: Développer et implémenter des scénarios de pipelines complexes, comme des pipelines hybrides, des modèles de machine virtuelle, et des exécuteurs ou des agents auto-hébergés
  - code: 3.3.8
    en: Create reusable pipeline elements, including YAML templates, task groups, variables, and variable groups
    fr: Créer des éléments de pipeline réutilisables, y compris des modèles YAML, des groupes de tâches, des variables et des groupes de variables
  - code: 3.3.9
    en: Design and implement checks and approvals by using YAML-based environments
    fr: Concevoir et implémenter des vérifications et des approbations à l'aide d'environnements basés sur YAML
- group:
    en: Design and implement deployments
    fr: Concevoir et implémenter des déploiements
  objectives:
  - code: 3.4.1
    en: Design a deployment strategy, including blue-green, canary, ring, progressive exposure, feature flags, and A/B testing
    fr: Concevoir une stratégie de déploiement, y compris les déploiements de type bleu/vert, canari, en anneau, l'exposition progressive, les indicateurs de fonctionnalités et les tests A/B
  - code: 3.4.2
    en: Design a pipeline to ensure that dependency deployments are reliably ordered
    fr: Concevoir un pipeline pour s'assurer que les déploiements des dépendances sont ordonnés de manière fiable
  - code: 3.4.3
    en: Plan for minimizing downtime during deployments by using load balancing, rolling deployments, and deployment slot usage and swap
    fr: Planifier la réduction des temps d'arrêt pendant les déploiements à l'aide de l'équilibrage de charge, des déploiements progressifs et de l'utilisation et permutation des emplacements de déploiement
  - code: 3.4.4
    en: Design a hotfix path plan for responding to high-priority code fixes
    fr: Concevoir un plan de gestion des correctifs pour répondre aux correctifs de code à priorité élevée
  - code: 3.4.5
    en: Design and implement a resiliency strategy for deployment
    fr: Concevoir et implémenter une stratégie de résilience pour le déploiement
  - code: 3.4.6
    en: Implement feature flags by using Azure App Configuration Feature Manager
    fr: Implémenter des indicateurs de fonctionnalité à l'aide du Gestionnaire de fonctionnalités d'Azure App Configuration
  - code: 3.4.7
    en: Implement application deployment by using containers, binaries, and scripts
    fr: Implémenter le déploiement d'applications en utilisant des conteneurs, des fichiers binaires et des scripts
  - code: 3.4.8
    en: Implement a deployment that includes database tasks
    fr: Implémenter un déploiement qui inclut des tâches de base de données
- group:
    en: Design and implement infrastructure as code (IaC)
    fr: Concevoir et implémenter l'infrastructure en tant que code (IaC)
  objectives:
  - code: 3.5.1
    en: Recommend a configuration management technology for application infrastructure
    fr: Recommander une technologie de gestion de la configuration pour l'infrastructure d'application
  - code: 3.5.2
    en: Implement a configuration management strategy for application infrastructure
    fr: Implémenter une stratégie de gestion de la configuration pour l'infrastructure d'application
  - code: 3.5.3
    en: Define an IaC strategy, including source control and automation of testing and deployment
    fr: Définir une stratégie IaC, y compris le contrôle de code source et l'automatisation des tests et du déploiement
  - code: 3.5.4
    en: Design and implement desired state configuration for environments, including Azure Automation State Configuration, Azure Resource Manager, Bicep, and Azure Machine Configuration
    fr: Concevoir et implémenter la configuration d'état souhaitée pour les environnements, notamment Azure Automation State Configuration, Azure Resource Manager, Bicep et Azure Machine Configuration
  - code: 3.5.5
    en: Design and implement Azure Deployment Environments for on-demand self-deployment
    fr: Concevoir et implémenter des environnements de déploiement Azure pour le déploiement automatique à la demande
- group:
    en: Maintain pipelines
    fr: Gérer les pipelines
  objectives:
  - code: 3.6.1
    en: Monitor pipeline health, including failure rate, duration, and flaky tests
    fr: Superviser l'intégrité des pipelines, y compris le taux d'échec, la durée et les tests instables
  - code: 3.6.2
    en: Optimize a pipeline for cost, time, performance, and reliability
    fr: Optimiser un pipeline en termes de coûts, de durée, de performances et de fiabilité
  - code: 3.6.3
    en: Optimize pipeline concurrency for performance and cost
    fr: Optimiser la concurrence des pipelines en termes de performances et de coûts
  - code: 3.6.4
    en: Design and implement a retention strategy for pipeline artifacts and dependencies
    fr: Concevoir et implémenter une stratégie de rétention pour les artefacts de pipeline et les dépendances
  - code: 3.6.5
    en: Migrate a pipeline from classic to YAML in Azure Pipelines
    fr: Migrer un pipeline de classique à YAML dans Azure Pipelines
security:
- group:
    en: Design and implement authentication and authorization methods
    fr: Concevoir et implémenter des méthodes d'authentification et d'autorisation
  objectives:
  - code: 4.1.1
    en: Choose between Microsoft Entra service principals and managed identities for Azure resources (system-assigned and user-assigned)
    fr: Choisir entre les principaux d'application Microsoft Entra et les identités gérées pour les ressources Azure (attribuées par le système et attribuées par l'utilisateur)
  - code: 4.1.2
    en: Implement and manage GitHub authentication, including GitHub Apps, GITHUB_TOKEN, and personal access tokens
    fr: Implémenter et gérer l'authentification GitHub, y compris GitHub Apps, GITHUB_TOKEN et les jetons d'accès personnels
  - code: 4.1.3
    en: Implement and manage Azure DevOps service connections and personal access tokens
    fr: Implémenter et gérer les connexions de service Azure DevOps et les jetons d'accès personnels Azure DevOps
  - code: 4.1.4
    en: Design and implement permissions and roles in GitHub
    fr: Concevoir et implémenter des autorisations et des rôles dans GitHub
  - code: 4.1.5
    en: Design and implement permissions and security groups in Azure DevOps
    fr: Concevoir et implémenter des autorisations et des groupes de sécurité dans Azure DevOps
  - code: 4.1.6
    en: Recommend appropriate access levels, including stakeholder access in Azure DevOps and outside collaborator access in GitHub
    fr: Recommander les niveaux d'accès appropriés, y compris l'accès des parties prenantes dans Azure DevOps et l'accès des collaborateurs externes dans GitHub
  - code: 4.1.7
    en: Configure projects and teams in Azure DevOps
    fr: Configurer des projets et des équipes dans Azure DevOps
- group:
    en: Design and implement a strategy for managing sensitive information in automation
    fr: Concevoir et implémenter une stratégie de gestion des informations sensibles dans l'automatisation
  objectives:
  - code: 4.2.1
    en: Implement and manage secrets, keys, and certificates by using Azure Key Vault
    fr: Implémenter et gérer des secrets, des clés et des certificats en utilisant Azure Key Vault
  - code: 4.2.2
    en: Implement and manage secrets and secretless authentication (for example, workload identity federation/OpenID Connect) in GitHub Actions and Azure Pipelines
    fr: Implémenter et gérer les secrets et l'authentification sans secret (par exemple, fédération d'identité de charge de travail/OpenID Connect) dans GitHub Actions et Azure Pipelines
  - code: 4.2.3
    en: Design and implement a strategy for managing sensitive files during deployment, including Azure Pipelines secure files
    fr: Concevoir et implémenter une stratégie de gestion des fichiers sensibles pendant le déploiement, y compris les fichiers sécurisé d'Azure Pipelines
  - code: 4.2.4
    en: Design pipelines to prevent leakage of sensitive information
    fr: Concevoir des pipelines pour empêcher la fuite d'informations sensibles
- group:
    en: Automate security and compliance scanning
    fr: Automatiser l'analyse de la sécurité et de la conformité
  objectives:
  - code: 4.3.1
    en: Design a strategy for security and compliance scanning, including dependency, code, secret, and licensing scanning
    fr: Concevoir une stratégie pour l'analyse de la sécurité et de la conformité, y compris l'analyse des dépendances, du code, des secrets et des licences
  - code: 4.3.2
    en: Configure Microsoft Defender for Cloud DevOps Security
    fr: Configurer la sécurité DevOps de Microsoft Defender pour le cloud
  - code: 4.3.3
    en: Configure GitHub Advanced Security for GitHub and GitHub Advanced Security for Azure DevOps
    fr: Configurer GitHub Advanced Security for GitHub et GitHub Advanced Security for Azure DevOps
  - code: 4.3.4
    en: Integrate GitHub Advanced Security with Microsoft Defender for Cloud
    fr: Intégrer GitHub Advanced Security à Microsoft Defender pour le cloud
  - code: 4.3.5
    en: Automate container scanning, including scanning container images and configuring an action to run CodeQL analysis in a container
    fr: Automatiser l'analyse des conteneurs, y compris l'analyse des images conteneur et la configuration d'une action pour exécuter l'analyse CodeQL dans un conteneur
  - code: 4.3.6
    en: Automate analysis of vulnerabilities of open-source components by using Dependabot alerts
    fr: Automatiser l'analyse des vulnérabilités des composants open source à l'aide d'alertes Dependabot
instrumentation:
- group:
    en: Configure monitoring for a DevOps environment
    fr: Configurer le monitoring pour un environnement DevOps
  objectives:
  - code: 5.1.1
    en: Configure Azure Monitor and Azure Monitor Logs to integrate with DevOps tools
    fr: Configurer Azure Monitor et Azure Monitor Logs pour s'intégrer aux outils DevOps
  - code: 5.1.2
    en: Configure collection of telemetry by using Azure Monitor Application Insights, Azure VM Insights, Azure Container Insights, Azure Monitor for Storage, and Azure Monitor for Networks
    fr: Configurer la collecte de données de télémétrie à l'aide de Azure Monitor Application Insights, Azure VM Insights, Azure Container Insights, Azure Monitor pour le stockage et Azure Monitor pour les réseaux
  - code: 5.1.3
    en: Configure monitoring in GitHub, including enabling insights and creating and configuring charts
    fr: Configurer la supervision dans GitHub, y compris l'activation des insights, et la création et la configuration de graphiques
  - code: 5.1.4
    en: Configure alerts for events in GitHub Actions and Azure Pipelines
    fr: Configurer des alertes pour des événements dans GitHub Actions et Azure Pipelines
- group:
    en: Analyze metrics from instrumentation
    fr: Analyser des métriques provenant de l'instrumentation
  objectives:
  - code: 5.2.1
    en: Inspect infrastructure performance indicators, including CPU, memory, disk, and network
    fr: Inspecter les indicateurs de performances de l'infrastructure, notamment le processeur, la mémoire, les disques et le réseau
  - code: 5.2.2
    en: Analyze metrics by using collected telemetry, including usage and application performance
    fr: Analyser des métriques en utilisant des données de télémétrie collectées, y compris l'utilisation et les performances des applications
  - code: 5.2.3
    en: Inspect distributed tracing by using Azure Monitor Application Insights
    fr: Inspecter le traçage distribué à l'aide d'Azure Monitor Application Insights
  - code: 5.2.4
    en: Interrogate logs using basic Kusto Query Language (KQL) queries
    fr: Interroger les journaux à l'aide de requêtes KQL (Kusto Query Language) de base
