chapter: 32-testing-strategy
questions:
  # ------------------------------------------------------------------ 1
  - id: az400-qz-32-01
    objective: "3.2.2"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Tailspin is redesigning the automated tests of its booking API by following Microsoft's guidance for shifting testing left.

        Which kind of test should make up the largest share of the automated tests?
      fr: |
        Tailspin repense les tests automatisés de son API de réservation en suivant les recommandations de Microsoft pour décaler les tests vers la gauche (shift left).

        Quel type de test doit représenter la plus grande part des tests automatisés ?
    body:
      options:
        - { id: a, text: { en: "UI tests that drive the web front end of a deployed environment", fr: "Des tests d'interface utilisateur qui pilotent le front-end web d'un environnement déployé" } }
        - { id: b, text: { en: "Functional tests that call a deployment of the service", fr: "Des tests fonctionnels qui appellent un déploiement du service" } }
        - { id: c, text: { en: "Unit tests that depend only on the code under test", fr: "Des tests unitaires qui ne dépendent que du code testé" } }
        - { id: d, text: { en: "Load tests that run against the staging environment", fr: "Des tests de charge qui s'exécutent sur l'environnement de préproduction" } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          Shifting left means running most tests early, fast and in isolation: Microsoft recommends writing more unit tests and favoring the tests with the fewest external dependencies. Unit tests run in milliseconds on every build and pull request, so they form the wide base of the test pyramid, with fewer, slower tests above them.
        fr: |
          Décaler les tests vers la gauche consiste à exécuter la plupart des tests tôt, vite et de façon isolée : Microsoft recommande d'écrire davantage de tests unitaires et de privilégier les tests qui ont le moins de dépendances externes. Les tests unitaires s'exécutent en quelques millisecondes à chaque build et à chaque pull request : ils forment la large base de la pyramide des tests, avec moins de tests, plus lents, au-dessus.
      options:
        a: { en: "UI tests are the slowest and least reliable tests; Microsoft discourages relying on them, so they stay a small share at the top of the pyramid.", fr: "Les tests d'interface utilisateur sont les plus lents et les moins fiables ; Microsoft déconseille de s'appuyer sur eux : ils restent une petite part au sommet de la pyramide." }
        b: { en: "Functional tests need a deployment of the service, so they are slower and run later; the guidance shifts the balance toward unit tests.", fr: "Les tests fonctionnels ont besoin d'un déploiement du service : ils sont plus lents et s'exécutent plus tard ; les recommandations déplacent l'équilibre vers les tests unitaires." }
        d: { en: "Load tests answer performance and capacity requirements and run a few times before production; they don't check business logic on every change.", fr: "Les tests de charge répondent aux exigences de performances et de capacité et s'exécutent quelques fois avant la production ; ils ne vérifient pas la logique métier à chaque modification." }
    references:
      - title: Shift testing left with unit tests
        url: https://learn.microsoft.com/en-us/devops/develop/shift-left-make-testing-fast-reliable

  # ------------------------------------------------------------------ 2
  - id: az400-qz-32-02
    objective: "3.2.2"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Contoso runs an Azure Load Testing test from its release pipeline. The release must stop when the 90th percentile of the response time measured by the test is above 500 ms.

        Which key of the load test configuration file should you use?
      fr: |
        Contoso exécute un test Azure Load Testing depuis son pipeline de mise en production. La mise en production doit s'arrêter quand le 90e centile du temps de réponse mesuré par le test dépasse 500 ms.

        Quelle clé du fichier de configuration du test de charge devez-vous utiliser ?
    body:
      options:
        - { id: a, text: "`autoStop`" }
        - { id: b, text: "`engineInstances`" }
        - { id: c, text: "`splitAllCSVs`" }
        - { id: d, text: "`failureCriteria`" }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          `failureCriteria` lists conditions such as `p90(response_time_ms) > 500` or `percentage(error) > 5`. When at least one criterion is met, the test run gets the failed status, which turns the load test into a quality gate of the pipeline.
        fr: |
          `failureCriteria` liste des conditions comme `p90(response_time_ms) > 500` ou `percentage(error) > 5`. Quand au moins un critère est rempli, l'exécution du test obtient l'état d'échec, ce qui fait du test de charge une barrière de qualité du pipeline.
      options:
        a: { en: "`autoStop` stops a run when the error percentage exceeds a threshold during a time window (90% over 60 seconds by default), to avoid paying for a broken test; it doesn't evaluate response times.", fr: "`autoStop` arrête une exécution quand le pourcentage d'erreurs dépasse un seuil pendant une fenêtre de temps (90 % sur 60 secondes par défaut), pour éviter de payer un test défaillant ; il n'évalue pas les temps de réponse." }
        b: { en: "`engineInstances` sets the number of parallel test engines that generate the load; it doesn't decide the result of the run.", fr: "`engineInstances` définit le nombre de moteurs de test parallèles qui génèrent la charge ; il ne décide pas du résultat de l'exécution." }
        c: { en: "`splitAllCSVs` splits the input CSV files evenly across the test engines; it has no effect on the test result.", fr: "`splitAllCSVs` répartit équitablement les fichiers CSV d'entrée entre les moteurs de test ; il n'a aucun effet sur le résultat du test." }
    references:
      - title: Configure a load test in YAML
        url: https://learn.microsoft.com/en-us/azure/load-testing/reference-test-config-yaml
      - title: Define fail criteria for load tests by using Azure Load Testing
        url: https://learn.microsoft.com/en-us/azure/load-testing/how-to-define-test-criteria

  # ------------------------------------------------------------------ 3
  - id: az400-qz-32-03
    objective: "3.2.1"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Fabrikam uses GitHub Enterprise Cloud. A private repository has an environment named **production** that has a required reviewers rule. Developers can start the deployment workflow manually from any branch, and last week a reviewer approved by mistake a run that was started from a feature branch.

        You need to ensure that only workflow runs from the main branch can deploy to production, whatever the reviewers decide.

        What should you configure?
      fr: |
        Fabrikam utilise GitHub Enterprise Cloud. Un dépôt privé contient un environnement nommé **production** qui a une règle de réviseurs obligatoires. Les développeurs peuvent lancer manuellement le workflow de déploiement depuis n'importe quelle branche, et la semaine dernière un réviseur a approuvé par erreur une exécution lancée depuis une branche de fonctionnalité.

        Vous devez faire en sorte que seules les exécutions de workflow issues de la branche main puissent déployer vers production, quelle que soit la décision des réviseurs.

        Que devez-vous configurer ?
    body:
      options:
        - { id: a, text: { en: "A branch protection rule on main that requires an approving review", fr: "Une règle de protection de branche sur main qui exige une révision avec approbation" } }
        - { id: b, text: { en: "A deployment branches and tags rule on production that allows only main", fr: "Une règle de branches et d'étiquettes de déploiement sur production qui n'autorise que main" } }
        - { id: c, text: { en: "A wait timer on production that delays each deployment job", fr: "Un minuteur d'attente sur production qui retarde chaque job de déploiement" } }
        - { id: d, text: { en: "The Prevent self-review option on the required reviewers rule", fr: "L'option Prevent self-review sur la règle de réviseurs obligatoires" } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          The deployment branches and tags protection rule restricts which branches or tags can deploy to an environment: with only main allowed, a job that targets production from any other branch is rejected before any reviewer is asked. It complements the required reviewers rule instead of relying on their judgment.
        fr: |
          La règle de protection des branches et étiquettes de déploiement limite les branches ou étiquettes qui peuvent déployer vers un environnement : si seule main est autorisée, un job qui cible production depuis une autre branche est refusé avant même qu'un réviseur soit sollicité. Elle complète la règle de réviseurs obligatoires au lieu de dépendre de leur jugement.
      options:
        a: { en: "A branch protection rule controls how changes are merged into main; it doesn't stop a run started from another branch from targeting the environment.", fr: "Une règle de protection de branche contrôle la façon dont les modifications sont fusionnées dans main ; elle n'empêche pas une exécution lancée depuis une autre branche de cibler l'environnement." }
        c: { en: "A wait timer only delays the deployment job; a run from a feature branch still deploys once the timer ends.", fr: "Un minuteur d'attente ne fait que retarder le job de déploiement ; une exécution issue d'une branche de fonctionnalité déploie quand même une fois le minuteur écoulé." }
        d: { en: "Prevent self-review stops the person who started the run from approving it; another reviewer can still approve a run from a feature branch.", fr: "Prevent self-review empêche la personne qui a lancé l'exécution de l'approuver ; un autre réviseur peut toujours approuver une exécution issue d'une branche de fonctionnalité." }
    references:
      - title: Control deployments with GitHub environments
        url: https://learn.microsoft.com/en-us/training/modules/deploy-model-github-actions/4-control-deployments-github-environments

  # ------------------------------------------------------------------ 4
  - id: az400-qz-32-04
    objective: "3.2.4"
    difficulty: 2
    status: draft
    type: dragdrop
    stem:
      en: |
        Woodgrove builds three applications with Azure Pipelines and will publish their code coverage with the PublishCodeCoverageResults@2 task. None of the pipelines collects code coverage yet.

        What should you use to collect the code coverage of each application? To answer, drag the appropriate settings or tools to the correct applications. Each setting or tool may be used once or not at all.

        NOTE: Each correct selection is worth one point.
      fr: |
        Woodgrove génère trois applications avec Azure Pipelines et publiera leur couverture du code avec la tâche PublishCodeCoverageResults@2. Aucun des pipelines ne collecte encore la couverture du code.

        Que devez-vous utiliser pour collecter la couverture du code de chaque application ? Pour répondre, faites glisser les paramètres ou outils appropriés vers les applications correspondantes. Chaque paramètre ou outil peut être utilisé une fois ou pas du tout.

        Remarque : chaque sélection correcte vaut un point.
    body:
      reuse: false
      items:
        - { id: jacoco, text: { en: "The JaCoCo plug-in of the build", fr: "Le plug-in JaCoCo du build" } }
        - { id: vstest, text: { en: "`codeCoverageEnabled: true` in the test task", fr: "`codeCoverageEnabled: true` dans la tâche de test" } }
        - { id: jest, text: { en: "The `--coverage` option of the test runner", fr: "L'option `--coverage` de l'exécuteur de tests" } }
        - { id: xplat, text: { en: "`--collect \"XPlat Code Coverage\"` in the test arguments", fr: "`--collect \"XPlat Code Coverage\"` dans les arguments de test" } }
        - { id: empty, text: { en: "`failIfCoverageEmpty: true` in the publishing task", fr: "`failIfCoverageEmpty: true` dans la tâche de publication" } }
      targets:
        - id: java
          text: { en: "A Java service built with Maven", fr: "Un service Java généré avec Maven" }
        - id: netfx
          text: { en: "A .NET Framework test assembly run by the VSTest@3 task on a Windows agent", fr: "Un assembly de test .NET Framework exécuté par la tâche VSTest@3 sur un agent Windows" }
        - id: react
          text: { en: "A React front end whose tests run with Jest", fr: "Un front-end React dont les tests s'exécutent avec Jest" }
    answer:
      mapping: { java: jacoco, netfx: vstest, react: jest }
    explanation:
      correct:
        en: |
          Coverage is collected by the test tooling of each stack, then published by PublishCodeCoverageResults@2. Java builds use the JaCoCo Maven or Gradle plug-in, which writes a JaCoCo XML report. The VSTest@3 task collects Microsoft code coverage in the `.coverage` format when `codeCoverageEnabled` is true. Jest (or Istanbul) collects JavaScript coverage with `--coverage` and writes Cobertura or LCOV reports.
        fr: |
          La couverture est collectée par l'outillage de test de chaque pile, puis publiée par PublishCodeCoverageResults@2. Les builds Java utilisent le plug-in JaCoCo de Maven ou de Gradle, qui écrit un rapport XML JaCoCo. La tâche VSTest@3 collecte la couverture du code Microsoft au format `.coverage` quand `codeCoverageEnabled` vaut true. Jest (ou Istanbul) collecte la couverture JavaScript avec `--coverage` et écrit des rapports Cobertura ou LCOV.
      options:
        xplat: { en: "`--collect \"XPlat Code Coverage\"` is the coverlet collector of `dotnet test`; it applies to neither VSTest@3, Maven nor Jest.", fr: "`--collect \"XPlat Code Coverage\"` est le collecteur coverlet de `dotnet test` ; il ne s'applique ni à VSTest@3, ni à Maven, ni à Jest." }
        empty: { en: "`failIfCoverageEmpty` makes the publishing task fail when no coverage was produced; it collects nothing.", fr: "`failIfCoverageEmpty` fait échouer la tâche de publication quand aucune couverture n'a été produite ; il ne collecte rien." }
    references:
      - title: PublishCodeCoverageResults@2 - Publish code coverage results v2 task
        url: https://learn.microsoft.com/en-us/azure/devops/pipelines/tasks/reference/publish-code-coverage-results-v2
      - title: VSTest@3 - Visual Studio Test v3 task
        url: https://learn.microsoft.com/en-us/azure/devops/pipelines/tasks/reference/vstest-v3

  # ------------------------------------------------------------------ 5
  - id: az400-qz-32-05
    objective: "3.2.3"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Northwind runs UI tests with the VSTest@3 task in an Azure DevOps Services project, with `rerunFailedTests: true`. Some tests fail on the first attempt and then pass when the task reruns them, and developers no longer trust the test results.

        You need Azure DevOps to identify these tests automatically and tag them in the test results. You must not write any detection logic.

        What should you do?
      fr: |
        Northwind exécute des tests d'interface utilisateur avec la tâche VSTest@3 dans un projet Azure DevOps Services, avec `rerunFailedTests: true`. Certains tests échouent à la première tentative puis réussissent quand la tâche les réexécute, et les développeurs n'ont plus confiance dans les résultats des tests.

        Vous devez faire en sorte qu'Azure DevOps identifie automatiquement ces tests et les signale dans les résultats des tests. Vous ne devez écrire aucune logique de détection.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Turn on flaky test management in the Test management settings of the project, with system detection.", fr: "Activer la gestion des tests instables dans les paramètres Test management du projet, avec la détection système." } }
        - { id: b, text: { en: "Turn on flaky test management in the Test management settings of the project, with custom detection.", fr: "Activer la gestion des tests instables dans les paramètres Test management du projet, avec la détection personnalisée." } }
        - { id: c, text: { en: "Set `runOnlyImpactedTests: true` in the inputs of VSTest@3 so that only the affected tests run.", fr: "Définir `runOnlyImpactedTests: true` dans les entrées de VSTest@3 pour que seuls les tests concernés s'exécutent." } }
        - { id: d, text: { en: "Set `rerunType: basedOnTestFailureCount` in the inputs of VSTest@3 so that reruns are counted.", fr: "Définir `rerunType: basedOnTestFailureCount` dans les entrées de VSTest@3 pour que les réexécutions soient comptées." } }
    answer: { optionId: a }
    explanation:
      correct:
        en: |
          Flaky test management, turned on in the project settings, tags tests whose outcome changes without any code change. Its system detection relies on reruns within the same pipeline execution, which the VSTest task already performs: a test that fails and then passes on rerun is marked flaky, and the Flaky tag appears in the test results.
        fr: |
          La gestion des tests instables, activée dans les paramètres du projet, signale les tests dont le résultat change sans modification du code. Sa détection système s'appuie sur les réexécutions au sein de la même exécution de pipeline, que la tâche VSTest effectue déjà : un test qui échoue puis réussit à la réexécution est marqué comme instable, et la balise Flaky apparaît dans les résultats des tests.
      options:
        b: { en: "Custom detection expects an external system to run its own detection logic and report flaky tests through the REST API, which the requirement forbids.", fr: "La détection personnalisée attend qu'un système externe exécute sa propre logique de détection et signale les tests instables via l'API REST, ce que l'exigence interdit." }
        c: { en: "Test Impact Analysis runs only the tests affected by a code change; it doesn't identify or tag flaky tests.", fr: "L'analyse d'impact des tests n'exécute que les tests concernés par une modification du code ; elle n'identifie ni ne signale les tests instables." }
        d: { en: "`rerunType` only chooses how the threshold that skips reruns is expressed (failure count or percentage); it doesn't tag any test.", fr: "`rerunType` choisit seulement comment s'exprime le seuil qui annule les réexécutions (nombre ou pourcentage d'échecs) ; il ne signale aucun test." }
    references:
      - title: Manage flaky tests
        url: https://learn.microsoft.com/en-us/azure/devops/pipelines/test/flaky-test-management

  # ------------------------------------------------------------------ 6
  - id: az400-qz-32-06
    objective: "3.2.1"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        Adatum deploys a payroll API with a multi-stage YAML pipeline in Azure Pipelines. The Production stage deploys to the environment **payroll-prod**, which has the following checks:

        - Approvals: the approver is the group **Payroll Release**, the timeout is 2 days, and approvers aren't allowed to approve their own runs.
        - Business hours: Saturday from 01:00 to 03:00, with a timeout of 1 day.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Adatum déploie une API de paie avec un pipeline YAML à phases multiples dans Azure Pipelines. La phase Production déploie vers l'environnement **payroll-prod**, qui a les vérifications suivantes :

        - Approbations : l'approbateur est le groupe **Payroll Release**, le délai d'expiration est de 2 jours, et les approbateurs ne sont pas autorisés à approuver leurs propres exécutions.
        - Heures ouvrables : le samedi de 01:00 à 03:00, avec un délai d'expiration de 1 jour.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text: { en: "If no member of Payroll Release approves a run within 2 days, the Production stage of that run fails.", fr: "Si aucun membre de Payroll Release n'approuve une exécution dans un délai de 2 jours, la phase Production de cette exécution échoue." }
        - id: s2
          text: { en: "If the Business hours check of a run times out, the Production stage of that run fails.", fr: "Si la vérification des heures ouvrables d'une exécution expire, la phase Production de cette exécution échoue." }
        - id: s3
          text: { en: "A member of Payroll Release who queued a run can approve the deployment of that run to payroll-prod.", fr: "Un membre de Payroll Release qui a mis une exécution en file d'attente peut approuver le déploiement de cette exécution vers payroll-prod." }
    answer:
      values: { s1: false, s2: true, s3: false }
    explanation:
      correct:
        en: |
          Checks don't all end the same way when they time out. When an approval isn't given in time, the stage is skipped, not failed. When the Business hours check (like Query Azure Monitor alerts) times out, the check fails and the stage is marked failed. Because approvers aren't allowed to approve their own runs, the member who queued the run must wait for another member of the group.
        fr: |
          Les vérifications ne se terminent pas toutes de la même façon quand elles expirent. Quand une approbation n'est pas donnée à temps, la phase est ignorée, et non en échec. Quand la vérification des heures ouvrables (comme Query Azure Monitor alerts) expire, la vérification échoue et la phase est marquée en échec. Comme les approbateurs ne sont pas autorisés à approuver leurs propres exécutions, le membre qui a mis l'exécution en file d'attente doit attendre un autre membre du groupe.
      options:
        s1: { en: "An approval timeout skips the stage (and the stages that depend on it); it doesn't mark it failed.", fr: "L'expiration d'une approbation ignore la phase (et les phases qui en dépendent) ; elle ne la marque pas en échec." }
        s3: { en: "The check forbids approving your own runs, so another member of Payroll Release must approve.", fr: "La vérification interdit d'approuver ses propres exécutions : un autre membre de Payroll Release doit approuver." }
    references:
      - title: Define approvals and checks
        url: https://learn.microsoft.com/en-us/azure/devops/pipelines/process/approvals

  # ------------------------------------------------------------------ 7
  - id: az400-qz-32-07
    objective: "3.2.1"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        Litware deploys container images to an Azure Kubernetes Service (AKS) cluster by using YAML pipelines in Azure Pipelines. Every production deployment uses an environment named **aks-prod**. The security and change management teams set the following requirements:

        - A deployment can start only if the metadata of the container image being deployed satisfies a policy written by the security team.
        - A deployment can start only after its change request is approved in Litware's change management system. The system exposes an HTTPS endpoint that returns the state of a change request, and Azure Pipelines must query it every 15 minutes, for up to 8 hours.
        - The controls must still apply when a pipeline author edits the YAML file.

        Which two checks should you add to aks-prod? Each correct answer presents part of the solution.

        NOTE: Each correct selection is worth one point.
      fr: |
        Litware déploie des images conteneur sur un cluster Azure Kubernetes Service (AKS) avec des pipelines YAML dans Azure Pipelines. Chaque déploiement en production utilise un environnement nommé **aks-prod**. Les équipes de sécurité et de gestion des changements fixent les exigences suivantes :

        - Un déploiement ne peut démarrer que si les métadonnées de l'image conteneur déployée satisfont une stratégie écrite par l'équipe de sécurité.
        - Un déploiement ne peut démarrer qu'après l'approbation de sa demande de changement dans le système de gestion des changements de Litware. Ce système expose un point de terminaison HTTPS qui renvoie l'état d'une demande de changement, et Azure Pipelines doit l'interroger toutes les 15 minutes, pendant 8 heures au maximum.
        - Les contrôles doivent toujours s'appliquer quand l'auteur d'un pipeline modifie le fichier YAML.

        Quelles sont les deux vérifications que vous devez ajouter à aks-prod ? Chaque bonne réponse présente une partie de la solution.

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 2
      options:
        - { id: a, text: Required template }
        - { id: b, text: Evaluate artifact }
        - { id: c, text: Approvals }
        - { id: d, text: Invoke REST API }
        - { id: e, text: Branch control }
        - { id: f, text: Query Azure Monitor alerts }
    answer: { optionIds: [b, d] }
    explanation:
      correct:
        en: |
          Evaluate artifact checks the container image artifacts of the run against a custom policy evaluated on the image metadata; the stage fails if the policy fails. Invoke REST API calls an external endpoint and repeats the call at the Time between evaluations interval (15 minutes) until it succeeds or the timeout (8 hours) is reached. Both are checks on the environment, configured outside the YAML file, so pipeline authors can't remove them.
        fr: |
          Evaluate artifact vérifie les artefacts d'image conteneur de l'exécution par rapport à une stratégie personnalisée évaluée sur les métadonnées de l'image ; la phase échoue si la stratégie échoue. Invoke REST API appelle un point de terminaison externe et répète l'appel selon l'intervalle Time between evaluations (15 minutes) jusqu'à la réussite ou jusqu'au délai d'expiration (8 heures). Ce sont deux vérifications sur l'environnement, configurées hors du fichier YAML : les auteurs de pipelines ne peuvent pas les retirer.
      options:
        a: { en: "Required template forces pipelines to extend an approved YAML template; it doesn't inspect the image or query the change management system.", fr: "Required template oblige les pipelines à étendre un modèle YAML approuvé ; il n'inspecte pas l'image et n'interroge pas le système de gestion des changements." }
        c: { en: "Approvals waits for a person to approve; the requirement is that Azure Pipelines queries the change management system automatically.", fr: "Approbations attend qu'une personne approuve ; l'exigence est qu'Azure Pipelines interroge automatiquement le système de gestion des changements." }
        e: { en: "Branch control restricts the branches the run's resources come from; it doesn't evaluate image metadata or a change request.", fr: "Branch control limite les branches dont proviennent les ressources de l'exécution ; il n'évalue ni les métadonnées de l'image ni une demande de changement." }
        f: { en: "Query Azure Monitor alerts succeeds only when no alert rule is active; it can't read the state of a change request.", fr: "Query Azure Monitor alerts ne réussit que si aucune règle d'alerte n'est active ; il ne peut pas lire l'état d'une demande de changement." }
    references:
      - title: Define approvals and checks
        url: https://learn.microsoft.com/en-us/azure/devops/pipelines/process/approvals

  # ------------------------------------------------------------------ 8
  - id: az400-qz-32-08
    objective: "3.2.2"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Proseware's API stores its data in PostgreSQL 16. The pull request validation pipeline of the API runs a single job on Microsoft-hosted `macOS-latest` agents, a choice kept from an old mobile project; nothing in the API build needs macOS.

        A new suite of integration tests must check the data access code against a real PostgreSQL 16 database on every pull request. The solution must meet the following requirements:

        - Each run starts with an empty database that no other run uses.
        - No Azure resource or build machine must be created or maintained.
        - The suite runs in the pull request validation pipeline.

        What should you do?
      fr: |
        L'API de Proseware stocke ses données dans PostgreSQL 16. Le pipeline de validation des pull requests de l'API exécute un seul travail sur des agents `macOS-latest` hébergés par Microsoft, un choix hérité d'un ancien projet mobile ; rien dans le build de l'API n'a besoin de macOS.

        Une nouvelle suite de tests d'intégration doit vérifier le code d'accès aux données sur une vraie base de données PostgreSQL 16 à chaque pull request. La solution doit répondre aux exigences suivantes :

        - Chaque exécution démarre avec une base de données vide qu'aucune autre exécution n'utilise.
        - Aucune ressource Azure ni aucune machine de build ne doit être créée ou maintenue.
        - La suite s'exécute dans le pipeline de validation des pull requests.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Keep the job on macOS-latest, and run PostgreSQL 16 as a service container of the job that the tests reach on localhost.", fr: "Conserver le travail sur macOS-latest, et exécuter PostgreSQL 16 comme conteneur de service du travail, que les tests joignent sur localhost." } }
        - { id: b, text: { en: "Move the job to ubuntu-latest, and run PostgreSQL 16 as a service container of the job that the tests reach on localhost.", fr: "Déplacer le travail sur ubuntu-latest, et exécuter PostgreSQL 16 comme conteneur de service du travail, que les tests joignent sur localhost." } }
        - { id: c, text: { en: "Create an Azure Database for PostgreSQL flexible server for the test runs, and pass its connection string from a variable group.", fr: "Créer un serveur flexible Azure Database pour PostgreSQL pour les exécutions de test, et transmettre sa chaîne de connexion depuis un groupe de variables." } }
        - { id: d, text: { en: "Replace the database calls with in-memory fakes, and run the new suite as unit tests in the existing job.", fr: "Remplacer les appels à la base de données par des substituts en mémoire, et exécuter la nouvelle suite comme tests unitaires dans le travail existant." } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          A service container runs a dependency such as a database next to the job, only for that job, and the hosted agent is discarded afterward, so each run gets its own empty database. In a job that runs directly on the agent (not in a container job), the tests reach the service on localhost through a mapped port. Linux containers run on the hosted Ubuntu pool, but the hosted macOS pool doesn't support containers, so the job must move to ubuntu-latest.
        fr: |
          Un conteneur de service exécute une dépendance comme une base de données à côté du travail, pour ce travail seulement, et l'agent hébergé est supprimé ensuite : chaque exécution obtient sa propre base vide. Dans un travail qui s'exécute directement sur l'agent (et non dans un travail de conteneur), les tests joignent le service sur localhost par un port mappé. Les conteneurs Linux s'exécutent sur le pool Ubuntu hébergé, mais le pool macOS hébergé ne prend pas en charge les conteneurs : le travail doit passer sur ubuntu-latest.
      options:
        a: { en: "The hosted macOS pool can't run containers, so a service container can't start on macOS-latest agents.", fr: "Le pool macOS hébergé ne peut pas exécuter de conteneurs : un conteneur de service ne peut pas démarrer sur les agents macOS-latest." }
        c: { en: "A server is an Azure resource to create and maintain, and concurrent pull request runs would share its databases.", fr: "Un serveur est une ressource Azure à créer et à maintenir, et les exécutions simultanées de pull requests partageraient ses bases de données." }
        d: { en: "In-memory fakes turn the suite into unit tests: it would no longer check the code against a real PostgreSQL database.", fr: "Des substituts en mémoire transforment la suite en tests unitaires : elle ne vérifierait plus le code sur une vraie base PostgreSQL." }
    references:
      - title: Service containers
        url: https://learn.microsoft.com/en-us/azure/devops/pipelines/process/service-containers

  # ------------------------------------------------------------------ 9
  - id: az400-qz-32-09
    objective: "3.2.4"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        Wingtip moved a .NET repository from Azure Repos to an organization in GitHub Enterprise Cloud. In Azure Repos, a branch policy blocked the pull requests whose changed lines were less than 80% covered by tests.

        CI now runs in a GitHub Actions workflow named **ci.yml**. Its job **test** runs `dotnet test --collect "XPlat Code Coverage"` for every pull request that targets main and writes a Cobertura report.

        You need to prevent pull requests from being merged into main when the line coverage reported by job test is below 80%. The solution must use only GitHub Actions and GitHub repository settings.

        Which two actions should you perform? Each correct answer presents part of the solution.

        NOTE: Each correct selection is worth one point.
      fr: |
        Wingtip a déplacé un dépôt .NET d'Azure Repos vers une organisation GitHub Enterprise Cloud. Dans Azure Repos, une stratégie de branche bloquait les pull requests dont les lignes modifiées étaient couvertes à moins de 80 % par des tests.

        La CI s'exécute maintenant dans un workflow GitHub Actions nommé **ci.yml**. Son job **test** exécute `dotnet test --collect "XPlat Code Coverage"` pour chaque pull request qui cible main et écrit un rapport Cobertura.

        Vous devez empêcher la fusion des pull requests dans main quand la couverture de lignes indiquée par le job test est inférieure à 80 %. La solution ne doit utiliser que GitHub Actions et les paramètres de dépôt GitHub.

        Quelles sont les deux actions que vous devez effectuer ? Chaque bonne réponse présente une partie de la solution.

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "Add an azurepipelines-coverage.yml file that sets a diff target of 80% at the root of the repository.", fr: "Ajouter à la racine du dépôt un fichier azurepipelines-coverage.yml qui définit un objectif diff de 80 %." } }
        - { id: b, text: { en: "Add a step to job test that reads the Cobertura report and exits with an error below 80% line coverage.", fr: "Ajouter au job test une étape qui lit le rapport Cobertura et se termine en erreur sous 80 % de couverture de lignes." } }
        - { id: c, text: { en: "Add a step to job test that uploads the Cobertura report of each run as a workflow artifact.", fr: "Ajouter au job test une étape qui charge le rapport Cobertura de chaque exécution comme artefact de workflow." } }
        - { id: d, text: { en: "Add a step to job test that runs the PublishCodeCoverageResults@2 task on the Cobertura report.", fr: "Ajouter au job test une étape qui exécute la tâche PublishCodeCoverageResults@2 sur le rapport Cobertura." } }
        - { id: e, text: { en: "Add job test of ci.yml as a required status check in a ruleset that targets the main branch.", fr: "Ajouter le job test de ci.yml comme vérification d'état obligatoire dans un ruleset qui cible la branche main." } }
    answer: { optionIds: [b, e] }
    explanation:
      correct:
        en: |
          GitHub Actions doesn't compute or enforce coverage by itself: the workflow must run the coverage tool and fail the job when the threshold isn't met, since a non-zero exit code fails the job. Making that job a required status check in a ruleset (or a branch protection rule) on main then blocks the merge of every pull request whose job test fails.
        fr: |
          GitHub Actions ne calcule ni n'impose la couverture par lui-même : le workflow doit exécuter l'outil de couverture et faire échouer le job quand le seuil n'est pas atteint, car un code de sortie non nul fait échouer le job. Faire de ce job une vérification d'état obligatoire dans un ruleset (ou une règle de protection de branche) sur main bloque ensuite la fusion de toute pull request dont le job test échoue.
      options:
        a: { en: "azurepipelines-coverage.yml configures the diff coverage status of Azure DevOps, which works only for Azure Repos repositories.", fr: "azurepipelines-coverage.yml configure l'état de couverture différentielle d'Azure DevOps, qui ne fonctionne que pour les dépôts Azure Repos." }
        c: { en: "Uploading the report keeps it with the run but doesn't fail the job, so nothing blocks the merge.", fr: "Charger le rapport le conserve avec l'exécution, mais ne fait pas échouer le job : rien ne bloque la fusion." }
        d: { en: "PublishCodeCoverageResults@2 is an Azure Pipelines task, not a GitHub action, and it doesn't fail on a coverage threshold anyway.", fr: "PublishCodeCoverageResults@2 est une tâche Azure Pipelines, pas une action GitHub, et elle n'échoue de toute façon pas sur un seuil de couverture." }
    references:
      - title: Review and configure code coverage results in Azure Pipelines
        url: https://learn.microsoft.com/en-us/azure/devops/pipelines/test/codecoverage-for-pullrequests
      - title: Branch protections rules and review requirements
        url: https://learn.microsoft.com/en-us/training/modules/github-enterprise-server-repository-workflows/3-branch-protection-rules

  # ------------------------------------------------------------------ 10
  - id: az400-qz-32-10
    objective: "3.2.3"
    difficulty: 3
    status: draft
    type: dropdown
    stem:
      en: |
        Fabrikam's regression suite contains 4,000 MSTest tests and runs for about three hours on one Microsoft-hosted windows-latest agent. The organization has enough Microsoft-hosted parallel jobs. You need to change the job to meet the following requirements:

        - Run only the tests whose category is Regression.
        - Run the tests on four agents at the same time, in batches balanced by the past running time of the tests.
        - Rerun failed tests at most two times, but skip the reruns when more than 25 tests fail, which usually means a broken environment.

        How should you complete the YAML? Select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        La suite de régression de Fabrikam contient 4 000 tests MSTest et s'exécute en trois heures environ sur un agent windows-latest hébergé par Microsoft. L'organisation dispose d'assez de travaux parallèles hébergés par Microsoft. Vous devez modifier le travail pour répondre aux exigences suivantes :

        - N'exécuter que les tests dont la catégorie est Regression.
        - Exécuter les tests sur quatre agents en même temps, par lots équilibrés selon la durée d'exécution passée des tests.
        - Réexécuter les tests en échec deux fois au plus, mais annuler les réexécutions quand plus de 25 tests échouent, ce qui signale en général un environnement défaillant.

        Comment devez-vous compléter le YAML ? Sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: code
      language: yaml
      template: |
        jobs:
          - job: Regression
            pool:
              vmImage: windows-latest
            strategy:
              [[par]]: 4
            steps:
              - task: VSTest@3
                inputs:
                  testSelector: testAssemblies
                  testAssemblyVer2: |
                    **\*Tests.dll
                    !**\obj\**
                  [[filter]]: 'TestCategory=Regression'
                  distributionBatchType: [[dist]]
                  rerunFailedTests: true
                  rerunType: [[rerun]]
                  rerunFailedTestCasesMaxLimit: '25'
                  rerunMaxAttempts: '2'
      slots:
        - id: par
          options:
            - { id: parallel, text: parallel }
            - { id: maxparallel, text: maxParallel }
            - { id: matrix, text: matrix }
        - id: filter
          options:
            - { id: title, text: testRunTitle }
            - { id: criteria, text: testFiltercriteria }
            - { id: settings, text: runSettingsFile }
            - { id: plan, text: testPlan }
        - id: dist
          options:
            - { id: cases, text: basedOnTestCases }
            - { id: assembly, text: basedOnAssembly }
            - { id: time, text: basedOnExecutionTime }
        - id: rerun
          options:
            - { id: percent, text: basedOnTestFailurePercentage }
            - { id: count, text: basedOnTestFailureCount }
    answer:
      values: { par: parallel, filter: criteria, dist: time, rerun: count }
    explanation:
      correct:
        en: |
          `strategy: parallel: 4` dispatches four copies of the job, and VSTest@3 splits the selected tests into batches across them; `basedOnExecutionTime` builds batches of about the same past running time. `testFiltercriteria` selects tests by property, such as `TestCategory=Regression`. With `rerunType: basedOnTestFailureCount`, `rerunFailedTestCasesMaxLimit` is a number of failed tests (25) above which reruns are skipped, and `rerunMaxAttempts` caps the reruns.
        fr: |
          `strategy: parallel: 4` distribue quatre copies du travail, et VSTest@3 répartit les tests sélectionnés en lots entre elles ; `basedOnExecutionTime` forme des lots de durée d'exécution passée à peu près égale. `testFiltercriteria` sélectionne les tests par propriété, par exemple `TestCategory=Regression`. Avec `rerunType: basedOnTestFailureCount`, `rerunFailedTestCasesMaxLimit` est un nombre de tests en échec (25) au-delà duquel les réexécutions sont annulées, et `rerunMaxAttempts` plafonne les réexécutions.
      options:
        par: { en: "`matrix` runs one job per named configuration, and `maxParallel` only limits how many matrix legs run at once: neither slices the tests across four agents.", fr: "`matrix` exécute un travail par configuration nommée, et `maxParallel` limite seulement le nombre de branches de matrice simultanées : aucun ne répartit les tests sur quatre agents." }
        filter: { en: "`testRunTitle` names the test run, `runSettingsFile` points to a .runsettings file and `testPlan` is used when tests are selected from a test plan.", fr: "`testRunTitle` nomme la série de tests, `runSettingsFile` désigne un fichier .runsettings et `testPlan` sert quand les tests sont sélectionnés depuis un plan de test." }
        dist: { en: "`basedOnTestCases` gives each agent the same number of tests whatever their duration; `basedOnAssembly` splits whole assemblies, for tests that share state.", fr: "`basedOnTestCases` donne à chaque agent le même nombre de tests quelle que soit leur durée ; `basedOnAssembly` répartit des assemblys entiers, pour des tests qui partagent un état." }
        rerun: { en: "`basedOnTestFailurePercentage` uses `rerunFailedThreshold`, a percentage of failed tests (30% by default), not a count of 25 tests.", fr: "`basedOnTestFailurePercentage` utilise `rerunFailedThreshold`, un pourcentage de tests en échec (30 % par défaut), et non un nombre de 25 tests." }
    references:
      - title: VSTest@3 - Visual Studio Test v3 task
        url: https://learn.microsoft.com/en-us/azure/devops/pipelines/tasks/reference/vstest-v3
      - title: Run tests in parallel using the Visual Studio Test task
        url: https://learn.microsoft.com/en-us/azure/devops/pipelines/test/parallel-testing-vstest
