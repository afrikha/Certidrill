chapter: 35-infrastructure-as-code
questions:
  # ------------------------------------------------------------------ 1
  - id: az400-qz-35-01
    objective: "3.5.1"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Wingtip deploys new Ubuntu virtual machines in Azure from a Bicep file. When each new virtual machine boots for the first time, three packages must be installed and two configuration files must be written. No ongoing monitoring or correction of these settings is required.

        Which technology should you recommend?
      fr: |
        Wingtip déploie de nouvelles machines virtuelles Ubuntu dans Azure à partir d'un fichier Bicep. Au premier démarrage de chaque nouvelle machine virtuelle, trois packages doivent être installés et deux fichiers de configuration doivent être écrits. Aucune surveillance ni correction continue de ces paramètres n'est nécessaire.

        Quelle technologie devez-vous recommander ?
    body:
      options:
        - { id: a, text: Azure Machine Configuration }
        - { id: b, text: cloud-init }
        - { id: c, text: Azure Automation State Configuration }
        - { id: d, text: Terraform }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          cloud-init customizes a Linux VM as it boots for the first time: it can install packages, write files and configure users. Its configuration is passed in the custom data of the VM, so it fits a one-time bootstrap at provisioning without any extra agent.
        fr: |
          cloud-init personnalise une machine virtuelle Linux lors de son premier démarrage : il peut installer des packages, écrire des fichiers et configurer des utilisateurs. Sa configuration est transmise dans les données personnalisées de la machine virtuelle : il convient à un amorçage unique au provisionnement, sans agent supplémentaire.
      options:
        a: { en: "Machine Configuration audits or enforces settings continuously through Azure Policy: more than a one-time bootstrap needs.", fr: "Machine Configuration audite ou applique des paramètres en continu via Azure Policy : c'est plus que ce qu'exige un amorçage unique." }
        c: { en: "Automation State Configuration no longer supports Linux (since 2023) and retires on September 30, 2027.", fr: "Automation State Configuration ne prend plus en charge Linux (depuis 2023) et sera mis hors service le 30 septembre 2027." }
        d: { en: "Terraform manages Azure resources, like the Bicep file already does; it doesn't configure the inside of the operating system.", fr: "Terraform gère des ressources Azure, comme le fait déjà le fichier Bicep ; il ne configure pas l'intérieur du système d'exploitation." }
    references:
      - title: cloud-init support for virtual machines in Azure
        url: https://learn.microsoft.com/en-us/azure/virtual-machines/linux/using-cloud-init

  # ------------------------------------------------------------------ 2
  - id: az400-qz-35-02
    objective: "3.5.4"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Contoso deploys a Bicep file to a resource group as a deployment stack. When a resource is removed from the Bicep file, the next update of the stack must leave the resource in Azure but stop managing it as part of the stack.

        Which value of the action on unmanage should you use?
      fr: |
        Contoso déploie un fichier Bicep dans un groupe de ressources sous forme de pile de déploiement. Quand une ressource est retirée du fichier Bicep, la mise à jour suivante de la pile doit laisser la ressource dans Azure, mais cesser de la gérer dans le cadre de la pile.

        Quelle valeur de l'action sur les ressources non gérées devez-vous utiliser ?
    body:
      options:
        - { id: a, text: "`deleteResources`" }
        - { id: b, text: "`deleteAll`" }
        - { id: c, text: "`denyDelete`" }
        - { id: d, text: "`detachAll`" }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          `detachAll` detaches the resources and resource groups that are no longer in the template: they stay in Azure and are no longer managed by the stack. Detaching is also what deployment stacks do by default with unmanaged resources.
        fr: |
          `detachAll` détache les ressources et les groupes de ressources qui ne figurent plus dans le modèle : ils restent dans Azure et ne sont plus gérés par la pile. Le détachement est aussi le comportement par défaut des piles de déploiement pour les ressources non gérées.
      options:
        a: { en: "`deleteResources` deletes the managed resources that are removed from the template, instead of keeping them.", fr: "`deleteResources` supprime les ressources gérées retirées du modèle, au lieu de les conserver." }
        b: { en: "`deleteAll` deletes the removed resources and also the removed resource groups.", fr: "`deleteAll` supprime les ressources retirées, ainsi que les groupes de ressources retirés." }
        c: { en: "`denyDelete` is a deny settings mode that protects managed resources from deletion; it isn't an action on unmanage.", fr: "`denyDelete` est un mode de paramètres de refus qui protège les ressources gérées contre la suppression ; ce n'est pas une action sur les ressources non gérées." }
    references:
      - title: Create and deploy Azure deployment stacks in Bicep
        url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/bicep/deployment-stacks

  # ------------------------------------------------------------------ 3
  - id: az400-qz-35-03
    objective: "3.5.3"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Fabrikam keeps its infrastructure as ARM templates written in JSON, in an Azure Repos Git repository. The team adds a pull request validation pipeline. The pipeline must report the templates that don't follow the recommended practices for ARM templates, for example hard-coded locations, without connecting to Azure.

        What should the pipeline run?
      fr: |
        Fabrikam conserve son infrastructure sous forme de modèles ARM écrits en JSON, dans un dépôt Git Azure Repos. L'équipe ajoute un pipeline de validation des demandes de tirage. Le pipeline doit signaler les modèles qui ne suivent pas les pratiques recommandées pour les modèles ARM, par exemple des emplacements codés en dur, sans se connecter à Azure.

        Que doit exécuter le pipeline ?
    body:
      options:
        - { id: a, text: "`az bicep lint` on the JSON templates" }
        - { id: b, text: "`Test-AzTemplate` from the ARM template test toolkit" }
        - { id: c, text: "`az deployment group what-if` on each template" }
        - { id: d, text: "`az deployment group validate` on each template" }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          The ARM template test toolkit (arm-ttk) is a set of PowerShell tests that checks whether a template uses the recommended practices and returns warnings with suggested changes. `Test-AzTemplate` runs on the template files themselves, so it fits a pull request check without any deployment.
        fr: |
          Le kit de ressources de test de modèle ARM (arm-ttk) est un ensemble de tests PowerShell qui vérifie si un modèle utilise les pratiques recommandées et renvoie des avertissements avec les modifications suggérées. `Test-AzTemplate` s'exécute sur les fichiers de modèle eux-mêmes : il convient à une vérification de demande de tirage, sans aucun déploiement.
      options:
        a: { en: "The Bicep linter checks Bicep files; the test toolkit is the tool for JSON ARM templates.", fr: "Le linter Bicep vérifie des fichiers Bicep ; le kit de ressources de test est l'outil des modèles ARM JSON." }
        c: { en: "what-if compares the template with the live resource group to preview changes, which requires a connection to Azure.", fr: "L'opération de simulation (what-if) compare le modèle au groupe de ressources réel pour prévisualiser les modifications, ce qui exige une connexion à Azure." }
        d: { en: "Preflight validation calls Resource Manager to check that the deployment would be accepted; it doesn't review recommended practices.", fr: "La validation préalable appelle Resource Manager pour vérifier que le déploiement serait accepté ; elle n'examine pas les pratiques recommandées." }
    references:
      - title: Use ARM template test toolkit
        url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/templates/test-toolkit

  # ------------------------------------------------------------------ 4
  - id: az400-qz-35-04
    objective: "3.5.2"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Northwind deploys the production resources of a CRM app to a resource group named **rg-crm-prod** from a Bicep file named **main.bicep**. The pipeline runs only when main.bicep changes. rg-crm-prod also contains a storage account that the data team created manually and that must be kept.

        Operators have the Contributor role and sometimes change settings in the portal during incidents; they must still be able to do so. Every night, any setting of a resource declared in main.bicep that differs from the file must be reset to the value in the file. The solution must minimize administrative effort.

        What should you do?
      fr: |
        Northwind déploie les ressources de production d'une application CRM dans un groupe de ressources nommé **rg-crm-prod** à partir d'un fichier Bicep nommé **main.bicep**. Le pipeline ne s'exécute que lorsque main.bicep change. rg-crm-prod contient aussi un compte de stockage que l'équipe de données a créé manuellement et qui doit être conservé.

        Les opérateurs ont le rôle Contributor et modifient parfois des paramètres dans le portail pendant des incidents ; ils doivent pouvoir continuer à le faire. Chaque nuit, tout paramètre d'une ressource déclarée dans main.bicep qui diffère du fichier doit être remis à la valeur du fichier. La solution doit réduire au minimum l'effort administratif.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Add a nightly scheduled trigger that redeploys main.bicep in Complete mode.", fr: "Ajouter un déclencheur planifié chaque nuit qui redéploie main.bicep en mode complet." } }
        - { id: b, text: { en: "Deploy main.bicep as a deployment stack with the `denyWriteAndDelete` deny settings mode.", fr: "Déployer main.bicep sous forme de pile de déploiement avec le mode de paramètres de refus `denyWriteAndDelete`." } }
        - { id: c, text: { en: "Add a nightly scheduled trigger that redeploys main.bicep in Incremental mode.", fr: "Ajouter un déclencheur planifié chaque nuit qui redéploie main.bicep en mode incrémentiel." } }
        - { id: d, text: { en: "Assign Azure Policy definitions with the Audit effect for each setting to rg-crm-prod.", fr: "Attribuer à rg-crm-prod des définitions Azure Policy avec l'effet Audit pour chaque paramètre." } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          Bicep deployments are idempotent: redeploying the same file in Incremental mode reapplies all the properties of the declared resources, which resets the settings changed in the portal. Incremental mode leaves the resources that aren't in the file unchanged, so the storage account of the data team stays, and a scheduled trigger only reuses the existing pipeline.
        fr: |
          Les déploiements Bicep sont idempotents : redéployer le même fichier en mode incrémentiel réapplique toutes les propriétés des ressources déclarées, ce qui réinitialise les paramètres modifiés dans le portail. Le mode incrémentiel laisse inchangées les ressources absentes du fichier : le compte de stockage de l'équipe de données est conservé, et un déclencheur planifié ne fait que réutiliser le pipeline existant.
      options:
        a: { en: "Complete mode also deletes the resources that aren't in the file, including the storage account that must be kept.", fr: "Le mode complet supprime aussi les ressources absentes du fichier, y compris le compte de stockage à conserver." }
        b: { en: "`denyWriteAndDelete` blocks the changes that operators must still be able to make during incidents.", fr: "`denyWriteAndDelete` bloque les modifications que les opérateurs doivent pouvoir continuer à faire pendant les incidents." }
        d: { en: "The Audit effect only reports noncompliance, and writing a definition per setting adds administrative effort.", fr: "L'effet Audit ne fait que signaler la non-conformité, et écrire une définition par paramètre ajoute de l'effort administratif." }
    references:
      - title: Azure Resource Manager deployment modes
        url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/templates/deployment-modes

  # ------------------------------------------------------------------ 5
  - id: az400-qz-35-05
    objective: "3.5.5"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Adatum uses Azure Deployment Environments. The dev center **dc-adatum** defines the environment types Dev and Test, and its catalog contains the environment definitions of the platform team.

        In the project **proj-pay**, environments of type Dev must be created in the subscription **sub-pay-dev**, and environments of type Test in the subscription **sub-pay-test**. Both types must use the same environment definitions.

        What should you configure?
      fr: |
        Adatum utilise Azure Deployment Environments. Le centre de développement **dc-adatum** définit les types d'environnements Dev et Test, et son catalogue contient les définitions d'environnement de l'équipe plateforme.

        Dans le projet **proj-pay**, les environnements de type Dev doivent être créés dans l'abonnement **sub-pay-dev**, et les environnements de type Test dans l'abonnement **sub-pay-test**. Les deux types doivent utiliser les mêmes définitions d'environnement.

        Que devez-vous configurer ?
    body:
      options:
        - { id: a, text: { en: "Two dev centers, one per subscription, each connected to a copy of the catalog", fr: "Deux centres de développement, un par abonnement, chacun connecté à une copie du catalogue" } }
        - { id: b, text: { en: "Two project environment types in proj-pay, each with its own deployment subscription", fr: "Deux types d'environnement de projet dans proj-pay, chacun avec son propre abonnement de déploiement" } }
        - { id: c, text: { en: "Two catalogs in proj-pay, one per subscription, with the same environment definitions", fr: "Deux catalogues dans proj-pay, un par abonnement, avec les mêmes définitions d'environnement" } }
        - { id: d, text: { en: "A subscription parameter in each environment definition, filled in by the developers", fr: "Un paramètre d'abonnement dans chaque définition d'environnement, renseigné par les développeurs" } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          A project environment type enables a dev center environment type for a project and sets its deployment subscription, the managed identity that deploys, and the access given on the environment resources. Enabling Dev and Test in proj-pay with sub-pay-dev and sub-pay-test sends each environment to the right subscription, from the same catalog.
        fr: |
          Un type d'environnement de projet active un type d'environnement du centre de développement pour un projet et définit son abonnement de déploiement, l'identité managée qui déploie et l'accès accordé sur les ressources de l'environnement. Activer Dev et Test dans proj-pay avec sub-pay-dev et sub-pay-test envoie chaque environnement dans le bon abonnement, à partir du même catalogue.
      options:
        a: { en: "A dev center doesn't choose the subscription of an environment, and copying the catalog duplicates the definitions to maintain.", fr: "Un centre de développement ne choisit pas l'abonnement d'un environnement, et copier le catalogue duplique les définitions à maintenir." }
        c: { en: "A catalog only provides environment definitions; the target subscription comes from the project environment type.", fr: "Un catalogue ne fournit que des définitions d'environnement ; l'abonnement cible vient du type d'environnement de projet." }
        d: { en: "Developers would choose the target subscription themselves, and the deployment subscription is a setting of the project environment type.", fr: "Les développeurs choisiraient eux-mêmes l'abonnement cible, alors que l'abonnement de déploiement est un paramètre du type d'environnement de projet." }
    references:
      - title: Configure project environment types
        url: https://learn.microsoft.com/en-us/azure/deployment-environments/how-to-configure-project-environment-types

  # ------------------------------------------------------------------ 6
  - id: az400-qz-35-06
    objective: "3.5.4"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        Contoso has the following Windows Server machines:

        - 40 Azure virtual machines that have the machine configuration extension and a system-assigned managed identity.
        - 25 servers in its datacenter that are onboarded to Azure Arc-enabled servers.
        - A Virtual Machine Scale Set in Uniform orchestration that runs 10 instances.

        You assign a custom Azure Machine Configuration policy definition, generated in the `ApplyAndAutoCorrect` mode, to the subscription that contains all these machines.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Contoso dispose des machines Windows Server suivantes :

        - 40 machines virtuelles Azure qui ont l'extension Machine Configuration et une identité managée affectée par le système.
        - 25 serveurs de son centre de données intégrés comme serveurs avec Azure Arc.
        - Un groupe de machines virtuelles identiques en orchestration Uniform qui exécute 10 instances.

        Vous attribuez une définition de stratégie Azure Machine Configuration personnalisée, générée en mode `ApplyAndAutoCorrect`, à l'abonnement qui contient toutes ces machines.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text: { en: "If a local administrator changes a setting of the configuration on one of the 40 Azure virtual machines, the setting is brought back into conformance without a new assignment.", fr: "Si un administrateur local modifie un paramètre de la configuration sur l'une des 40 machines virtuelles Azure, le paramètre est remis en conformité sans nouvelle attribution." }
        - id: s2
          text: { en: "The machine configuration extension must be installed on the 25 Arc-enabled servers before they can process the assignment.", fr: "L'extension Machine Configuration doit être installée sur les 25 serveurs avec Azure Arc avant qu'ils puissent traiter l'attribution." }
        - id: s3
          text: { en: "The configuration is applied to the 10 instances of the scale set and kept in conformance.", fr: "La configuration est appliquée aux 10 instances du groupe identique et maintenue en conformité." }
    answer:
      values: { s1: true, s2: false, s3: false }
    explanation:
      correct:
        en: |
          In Apply and Autocorrect mode, the configuration is applied and the machine is brought back into conformance whenever drift occurs. Arc-enabled servers don't need the extension, because it's included in the Azure Connected Machine agent. Machine Configuration supports Virtual Machine Scale Sets in Flexible orchestration but not in Uniform orchestration.
        fr: |
          En mode Apply and Autocorrect, la configuration est appliquée et la machine est remise en conformité chaque fois qu'une dérive survient. Les serveurs avec Azure Arc n'ont pas besoin de l'extension, car elle est incluse dans l'agent Azure Connected Machine. Machine Configuration prend en charge les groupes de machines virtuelles identiques en orchestration Flexible, mais pas en orchestration Uniform.
      options:
        s2: { en: "The machine configuration capability is part of the Connected Machine agent of Arc-enabled servers.", fr: "La fonctionnalité Machine Configuration fait partie de l'agent Connected Machine des serveurs avec Azure Arc." }
        s3: { en: "Scale sets in Uniform orchestration aren't supported; Flexible orchestration would be.", fr: "Les groupes identiques en orchestration Uniform ne sont pas pris en charge ; l'orchestration Flexible le serait." }
    references:
      - title: What is Azure Machine Configuration?
        url: https://learn.microsoft.com/en-us/azure/governance/machine-configuration/overview
      - title: Azure Machine Configuration prerequisites
        url: https://learn.microsoft.com/en-us/azure/governance/machine-configuration/overview/02-setup-prerequisites

  # ------------------------------------------------------------------ 7
  - id: az400-qz-35-07
    objective: "3.5.5"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Fabrikam uses Azure Deployment Environments. The project **proj-web** has the project environment types Dev and Staging, mapped to two different subscriptions. The developers have the Deployment Environments User role on proj-web and no role assignment on the subscriptions.

        The platform team sets the following requirements for the Staging type:

        - A developer who creates a Staging environment can view its resources but can't modify them.
        - The members of the Entra group **QA-Leads** can modify the resources of every Staging environment.
        - Developers keep full control of the resources of the Dev environments they create.

        What should you configure?
      fr: |
        Fabrikam utilise Azure Deployment Environments. Le projet **proj-web** a les types d'environnement de projet Dev et Staging, associés à deux abonnements différents. Les développeurs ont le rôle Deployment Environments User sur proj-web et aucune attribution de rôle sur les abonnements.

        L'équipe plateforme fixe les exigences suivantes pour le type Staging :

        - Un développeur qui crée un environnement Staging peut afficher ses ressources, mais ne peut pas les modifier.
        - Les membres du groupe Entra **QA-Leads** peuvent modifier les ressources de chaque environnement Staging.
        - Les développeurs gardent le contrôle total des ressources des environnements Dev qu'ils créent.

        Que devez-vous configurer ?
    body:
      options:
        - { id: a, text: { en: "In proj-web, replace the Deployment Environments User role of the developers with Deployment Environments Reader, and give QA-Leads Deployment Environments User.", fr: "Dans proj-web, remplacer le rôle Deployment Environments User des développeurs par Deployment Environments Reader, et donner Deployment Environments User à QA-Leads." } }
        - { id: b, text: { en: "On the Staging subscription, assign the Reader role to the developers and the Contributor role to QA-Leads.", fr: "Sur l'abonnement de Staging, attribuer le rôle Reader aux développeurs et le rôle Contributor à QA-Leads." } }
        - { id: c, text: { en: "On the Staging project environment type, set the deployment identity to an identity that has only the Reader role on the Staging subscription.", fr: "Sur le type d'environnement de projet Staging, définir comme identité de déploiement une identité qui n'a que le rôle Reader sur l'abonnement de Staging." } }
        - { id: d, text: { en: "On the Staging project environment type, set the environment creator role to Reader, and grant QA-Leads the Contributor role in the additional access.", fr: "Sur le type d'environnement de projet Staging, définir le rôle du créateur de l'environnement sur Reader, et accorder à QA-Leads le rôle Contributor dans l'accès supplémentaire." } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          Each project environment type sets the permissions on the environment resources: the environment creator roles given to the developer who creates an environment, and additional access for chosen users or groups. Setting Reader for the creator and Contributor for QA-Leads on Staging only changes Staging environments, so the Dev type keeps its own settings.
        fr: |
          Chaque type d'environnement de projet définit les autorisations sur les ressources de l'environnement : les rôles du créateur de l'environnement, donnés au développeur qui crée un environnement, et un accès supplémentaire pour des utilisateurs ou groupes choisis. Définir Reader pour le créateur et Contributor pour QA-Leads sur Staging ne change que les environnements Staging : le type Dev garde ses propres paramètres.
      options:
        a: { en: "Deployment Environments Reader can't create environments, so developers would lose the Dev environments too; project roles don't set access to the resources.", fr: "Deployment Environments Reader ne peut pas créer d'environnements : les développeurs perdraient aussi les environnements Dev ; les rôles du projet ne définissent pas l'accès aux ressources." }
        b: { en: "Developers must have no role on the subscriptions, and a subscription role doesn't change the access granted on each environment.", fr: "Les développeurs ne doivent avoir aucun rôle sur les abonnements, et un rôle d'abonnement ne change pas l'accès accordé sur chaque environnement." }
        c: { en: "The deployment identity needs Contributor and User Access Administrator on the subscription; with Reader, Staging environments can't be deployed.", fr: "L'identité de déploiement a besoin de Contributor et de User Access Administrator sur l'abonnement ; avec Reader, les environnements Staging ne peuvent pas être déployés." }
    references:
      - title: Configure project environment types
        url: https://learn.microsoft.com/en-us/azure/deployment-environments/how-to-configure-project-environment-types

  # ------------------------------------------------------------------ 8
  - id: az400-qz-35-08
    objective: "3.5.2"
    difficulty: 3
    status: draft
    type: dropdown
    stem:
      en: |
        Litware deploys an ARM template named **azuredeploy.json** to production from Azure Pipelines. The template declares a `securestring` parameter named `adminPassword` for the administrator of an Azure SQL logical server.

        You are writing the production parameter file **azuredeploy.parameters.prod.json**, which is stored in the repository. The file must meet the following requirements:

        - The password comes from the secret **sqlAdmin** of the key vault **kv-litware-prod**, which is in the resource group **rg-secrets** of another subscription.
        - Each deployment uses the current version of the secret, so that a rotation needs no change to the file.
        - The password never appears in the repository.

        The key vault allows template deployment. How should you complete the parameter file? Select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Litware déploie un modèle ARM nommé **azuredeploy.json** en production depuis Azure Pipelines. Le modèle déclare un paramètre `securestring` nommé `adminPassword` pour l'administrateur d'un serveur logique Azure SQL.

        Vous rédigez le fichier de paramètres de production **azuredeploy.parameters.prod.json**, stocké dans le dépôt. Le fichier doit répondre aux exigences suivantes :

        - Le mot de passe provient du secret **sqlAdmin** du coffre de clés **kv-litware-prod**, qui se trouve dans le groupe de ressources **rg-secrets** d'un autre abonnement.
        - Chaque déploiement utilise la version actuelle du secret, afin qu'une rotation n'exige aucune modification du fichier.
        - Le mot de passe n'apparaît jamais dans le dépôt.

        Le coffre de clés autorise le déploiement de modèles. Comment devez-vous compléter le fichier de paramètres ? Sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: code
      language: json
      template: |
        {
          "$schema": "https://schema.management.azure.com/schemas/2019-04-01/deploymentParameters.json#",
          "contentVersion": "1.0.0.0",
          "parameters": {
            "sqlServerName": {
              "value": "sql-litware-prod"
            },
            "adminPassword": {
              "[[kw]]": {
                "keyVault": {
                  "[[vault]]": "/subscriptions/7c1d4e2a-93b5-4f60-8a1e-2d5f6b9c0e47/resourceGroups/rg-secrets/providers/Microsoft.KeyVault/vaults/kv-litware-prod"
                },
                "[[secret]]": "sqlAdmin"
              }
            }
          }
        }
      slots:
        - id: kw
          options:
            - { id: kValue, text: value }
            - { id: kRef, text: reference }
            - { id: kDefault, text: defaultValue }
        - id: vault
          options:
            - { id: vId, text: id }
            - { id: vUri, text: vaultUri }
            - { id: vName, text: name }
        - id: secret
          options:
            - { id: sVersion, text: secretVersion }
            - { id: sUri, text: secretUri }
            - { id: sName, text: secretName }
    answer:
      values: { kw: kRef, vault: vId, secret: sName }
    explanation:
      correct:
        en: |
          A parameter file passes a Key Vault secret with a `reference` object instead of `value`. The `keyVault.id` property holds the resource ID of the vault, which can be in another subscription, and `secretName` names the secret. Without `secretVersion`, Resource Manager uses the current version of the secret, so a rotation needs no change to the file.
        fr: |
          Un fichier de paramètres transmet un secret Key Vault avec un objet `reference` au lieu de `value`. La propriété `keyVault.id` contient l'ID de ressource du coffre, qui peut se trouver dans un autre abonnement, et `secretName` nomme le secret. Sans `secretVersion`, Resource Manager utilise la version actuelle du secret : une rotation n'exige aucune modification du fichier.
      options:
        kValue: { en: "`value` passes a literal: the password would have to be written in the file stored in the repository.", fr: "`value` transmet une valeur littérale : le mot de passe devrait être écrit dans le fichier stocké dans le dépôt." }
        kDefault: { en: "`defaultValue` belongs to the parameter declaration of the template, not to a parameter file.", fr: "`defaultValue` appartient à la déclaration du paramètre dans le modèle, pas à un fichier de paramètres." }
        vUri: { en: "`vaultUri` is a property of the key vault resource; the reference identifies the vault by its resource ID in `id`.", fr: "`vaultUri` est une propriété de la ressource coffre de clés ; la référence identifie le coffre par son ID de ressource dans `id`." }
        sVersion: { en: "`secretVersion` pins a specific version, which a rotation would make obsolete; it doesn't name the secret.", fr: "`secretVersion` fixe une version précise, qu'une rotation rendrait obsolète ; il ne nomme pas le secret." }
        sUri: { en: "`SecretUri` is used in App Service Key Vault references, not in the reference object of a parameter file.", fr: "`SecretUri` sert dans les références Key Vault d'App Service, pas dans l'objet de référence d'un fichier de paramètres." }
    references:
      - title: Use Azure Key Vault to pass secure parameter value during deployment
        url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/templates/key-vault-parameter

  # ------------------------------------------------------------------ 9
  - id: az400-qz-35-09
    objective: "3.5.4"
    difficulty: 3
    status: draft
    type: ordering
    stem:
      en: |
        Tailspin wrote a PowerShell DSC configuration in a script named **RegBaseline.ps1**. The configuration sets the registry values of a security baseline. It must be enforced on Azure virtual machines and on Azure Arc-enabled servers by using Azure Machine Configuration, and any later drift must be corrected automatically.

        The GuestConfiguration module is installed on the authoring machine, and a storage account that the machines can reach is available.

        Which five actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
      fr: |
        Tailspin a écrit une configuration PowerShell DSC dans un script nommé **RegBaseline.ps1**. La configuration définit les valeurs de Registre d'une base de référence de sécurité. Elle doit être appliquée sur des machines virtuelles Azure et sur des serveurs avec Azure Arc à l'aide d'Azure Machine Configuration, et toute dérive ultérieure doit être corrigée automatiquement.

        Le module GuestConfiguration est installé sur la machine de création, et un compte de stockage accessible aux machines est disponible.

        Quelles sont les cinq actions que vous devez effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste des actions vers la zone de réponse et classez-les dans l'ordre correct.
    body:
      count: 5
      actions:
        - { id: policy, text: { en: "Run `New-GuestConfigurationPolicy` with the URI of the package and `Mode` set to `ApplyAndAutoCorrect`.", fr: "Exécuter `New-GuestConfigurationPolicy` avec l'URI du package et `Mode` défini sur `ApplyAndAutoCorrect`." } }
        - { id: compile, text: { en: "Run RegBaseline.ps1 to compile the configuration into a MOF file.", fr: "Exécuter RegBaseline.ps1 pour compiler la configuration en fichier MOF." } }
        - { id: aasc, text: { en: "Import RegBaseline.ps1 into Azure Automation State Configuration and compile it there.", fr: "Importer RegBaseline.ps1 dans Azure Automation State Configuration et l'y compiler." } }
        - { id: upload, text: { en: "Upload the package .zip file to a blob container of the storage account.", fr: "Charger le fichier .zip du package dans un conteneur d'objets blob du compte de stockage." } }
        - { id: packageAudit, text: { en: "Run `New-GuestConfigurationPackage` with `Type` set to `Audit`.", fr: "Exécuter `New-GuestConfigurationPackage` avec `Type` défini sur `Audit`." } }
        - { id: publish, text: { en: "Run `New-AzPolicyDefinition` with the generated JSON file, then assign the definition.", fr: "Exécuter `New-AzPolicyDefinition` avec le fichier JSON généré, puis attribuer la définition." } }
        - { id: package, text: { en: "Run `New-GuestConfigurationPackage` with `Type` set to `AuditAndSet`.", fr: "Exécuter `New-GuestConfigurationPackage` avec `Type` défini sur `AuditAndSet`." } }
    answer:
      sequence: [compile, package, upload, policy, publish]
    explanation:
      correct:
        en: |
          Running the configuration script compiles it into a MOF file, which `New-GuestConfigurationPackage` turns into a .zip package; the `AuditAndSet` type lets the package change the machine instead of only auditing it. The package is published to a blob container that the machines can reach, `New-GuestConfigurationPolicy` generates the policy JSON from its URI, with `ApplyAndAutoCorrect` for drift correction, and `New-AzPolicyDefinition` publishes the definition before it's assigned.
        fr: |
          Exécuter le script de configuration le compile en fichier MOF, que `New-GuestConfigurationPackage` transforme en package .zip ; le type `AuditAndSet` permet au package de modifier la machine au lieu de seulement l'auditer. Le package est publié dans un conteneur d'objets blob accessible aux machines, `New-GuestConfigurationPolicy` génère le JSON de la stratégie à partir de son URI, avec `ApplyAndAutoCorrect` pour corriger la dérive, et `New-AzPolicyDefinition` publie la définition avant son attribution.
      options:
        aasc: { en: "Automation State Configuration is a separate pull server that retires on September 30, 2027; Machine Configuration doesn't use it.", fr: "Automation State Configuration est un serveur Pull distinct qui sera mis hors service le 30 septembre 2027 ; Machine Configuration ne l'utilise pas." }
        packageAudit: { en: "An `Audit` package only reports the state of the machine, so the settings would never be applied or corrected.", fr: "Un package `Audit` ne fait que signaler l'état de la machine : les paramètres ne seraient jamais appliqués ni corrigés." }
    references:
      - title: How to create custom machine configuration package artifacts
        url: https://learn.microsoft.com/en-us/azure/governance/machine-configuration/how-to/develop-custom-package/2-create-package
      - title: How to create custom machine configuration policy definitions
        url: https://learn.microsoft.com/en-us/azure/governance/machine-configuration/how-to/create-policy-definition

  # ------------------------------------------------------------------ 10
  - id: az400-qz-35-10
    objective: "3.5.3"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        Woodgrove Bank stores the Bicep files of its ERP infrastructure in an Azure Repos Git repository. A YAML pipeline named **infra-cd** has two stages:

        - **Preview** runs `az bicep lint` and `az deployment group what-if` against the resource group **rg-erp-prod**.
        - **Deploy** contains a deployment job that targets the environment **erp-prod** and runs `az deployment group create`. The stage has a condition that skips it unless the run is for the main branch.

        Both stages use the Azure Resource Manager service connection **sc-erp-prod**. You need to meet the following requirements:

        - Every pull request that targets main runs infra-cd, and the pull request can't be completed if the run fails.
        - The Deploy stage starts only after a platform lead approves it. The Preview stage must never wait for an approval.
        - No secret for Azure authentication is stored in Azure DevOps.

        Which three actions should you perform? Each correct answer presents part of the solution.

        NOTE: Each correct selection is worth one point.
      fr: |
        Woodgrove Bank stocke les fichiers Bicep de son infrastructure ERP dans un dépôt Git Azure Repos. Un pipeline YAML nommé **infra-cd** comporte deux phases :

        - **Preview** exécute `az bicep lint` et `az deployment group what-if` sur le groupe de ressources **rg-erp-prod**.
        - **Deploy** contient un travail de déploiement qui cible l'environnement **erp-prod** et exécute `az deployment group create`. La phase a une condition qui l'ignore sauf si l'exécution concerne la branche main.

        Les deux phases utilisent la connexion de service Azure Resource Manager **sc-erp-prod**. Vous devez répondre aux exigences suivantes :

        - Chaque demande de tirage qui cible main exécute infra-cd, et la demande de tirage ne peut pas être terminée si l'exécution échoue.
        - La phase Deploy ne démarre qu'après l'approbation d'un responsable de la plateforme. La phase Preview ne doit jamais attendre d'approbation.
        - Aucun secret d'authentification Azure n'est stocké dans Azure DevOps.

        Quelles sont les trois actions que vous devez effectuer ? Chaque bonne réponse présente une partie de la solution.

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 3
      options:
        - { id: a, text: { en: "Add a `pr` trigger that includes main to the YAML file of infra-cd.", fr: "Ajouter au fichier YAML d'infra-cd un déclencheur `pr` qui inclut main." } }
        - { id: b, text: { en: "Add a required build validation policy that runs infra-cd to the main branch.", fr: "Ajouter à la branche main une stratégie de validation de build obligatoire qui exécute infra-cd." } }
        - { id: c, text: { en: "Add an approval check for the platform leads to the sc-erp-prod service connection.", fr: "Ajouter une vérification d'approbation pour les responsables de la plateforme à la connexion de service sc-erp-prod." } }
        - { id: d, text: { en: "Add an approval check for the platform leads to the erp-prod environment.", fr: "Ajouter une vérification d'approbation pour les responsables de la plateforme à l'environnement erp-prod." } }
        - { id: e, text: { en: "Configure sc-erp-prod to use workload identity federation.", fr: "Configurer sc-erp-prod pour utiliser la fédération d'identité de charge de travail." } }
        - { id: f, text: { en: "Configure sc-erp-prod to use a service principal secret that is rotated every 90 days.", fr: "Configurer sc-erp-prod pour utiliser un secret de principal de service renouvelé tous les 90 jours." } }
    answer: { optionIds: [b, d, e] }
    explanation:
      correct:
        en: |
          In Azure Repos Git, pull request validation is configured with a build validation branch policy, and a required policy blocks completion when the run fails. Checks run before every stage that uses the protected resource, so the approval goes on erp-prod, which only the Deploy stage targets. Workload identity federation lets the service connection authenticate without any stored secret.
        fr: |
          Dans Azure Repos Git, la validation des demandes de tirage se configure avec une stratégie de branche de validation de build, et une stratégie obligatoire bloque l'achèvement quand l'exécution échoue. Les vérifications s'exécutent avant chaque phase qui utilise la ressource protégée : l'approbation se place donc sur erp-prod, que seule la phase Deploy cible. La fédération d'identité de charge de travail permet à la connexion de service de s'authentifier sans aucun secret stocké.
      options:
        a: { en: "An Azure Repos Git repository can't use a YAML `pr` trigger; pull request runs come from branch policies.", fr: "Un dépôt Git Azure Repos ne peut pas utiliser de déclencheur YAML `pr` ; les exécutions de demande de tirage viennent des stratégies de branche." }
        c: { en: "Both stages use sc-erp-prod, so an approval on it would also pause the Preview stage.", fr: "Les deux phases utilisent sc-erp-prod : une approbation sur cette connexion mettrait aussi en pause la phase Preview." }
        f: { en: "A rotated secret is still a secret stored in Azure DevOps.", fr: "Un secret renouvelé reste un secret stocké dans Azure DevOps." }
    references:
      - title: Build Azure Repos Git or TFS Git repositories
        url: https://learn.microsoft.com/en-us/azure/devops/pipelines/repos/azure-repos-git
      - title: Define approvals and checks
        url: https://learn.microsoft.com/en-us/azure/devops/pipelines/process/approvals
