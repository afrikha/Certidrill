chapter: 36-pipeline-maintenance
questions:
  # ------------------------------------------------------------------ 1
  - id: az400-qz-36-01
    objective: "3.6.4"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Fabrikam has an Azure DevOps project named **Retail** that contains 15 YAML pipelines. The release manager wants the runs of every pipeline in Retail to be deleted after 45 days instead of the current value.

        Where should you change the retention of the pipeline runs?
      fr: |
        Fabrikam dispose d'un projet Azure DevOps nommé **Retail** qui contient 15 pipelines YAML. Le responsable des mises en production veut que les exécutions de tous les pipelines de Retail soient supprimées au bout de 45 jours au lieu de la valeur actuelle.

        Où devez-vous modifier la rétention des exécutions de pipeline ?
    body:
      options:
        - { id: a, text: { en: "In the retention policy of each pipeline, from the settings of the pipeline", fr: "Dans la stratégie de rétention de chaque pipeline, depuis les paramètres du pipeline" } }
        - { id: b, text: { en: "In Project settings > Pipelines > Release retention of Retail", fr: "Dans Paramètres du projet > Pipelines > Release retention de Retail" } }
        - { id: c, text: { en: "In Project settings > Pipelines > Settings of Retail", fr: "Dans Paramètres du projet > Pipelines > Paramètres de Retail" } }
        - { id: d, text: { en: "In the retention settings of each Azure Artifacts feed of Retail", fr: "Dans les paramètres de rétention de chaque flux Azure Artifacts de Retail" } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          The retention of pipeline runs, artifacts, symbols and attachments is set at project level in Project settings > Pipelines > Settings, and it applies to every pipeline of the project. Changing Days to keep runs to 45 there meets the requirement for the 15 pipelines at once.
        fr: |
          La rétention des exécutions de pipeline, des artefacts, des symboles et des pièces jointes se définit au niveau du projet dans Paramètres du projet > Pipelines > Paramètres, et elle s'applique à tous les pipelines du projet. Y passer les jours de conservation des exécutions à 45 répond à l'exigence pour les 15 pipelines à la fois.
      options:
        a: { en: "Azure Pipelines no longer supports per-pipeline retention policies; retention rules are defined for the whole project.", fr: "Azure Pipelines ne prend plus en charge les stratégies de rétention par pipeline ; les règles de rétention se définissent pour tout le projet." }
        b: { en: "Release retention governs classic release pipelines and their releases, not the runs of YAML pipelines.", fr: "Release retention régit les pipelines de mise en production classiques et leurs mises en production, pas les exécutions des pipelines YAML." }
        d: { en: "Feed retention deletes old package versions; packages aren't governed by run retention, and runs aren't governed by feed settings.", fr: "La rétention d'un flux supprime les anciennes versions de packages ; les packages ne relèvent pas de la rétention des exécutions, et les exécutions ne relèvent pas des paramètres du flux." }
    references:
      - title: Retention Policies - Azure Pipelines
        url: https://learn.microsoft.com/en-us/azure/devops/pipelines/policies/retention

  # ------------------------------------------------------------------ 2
  - id: az400-qz-36-02
    objective: "3.6.5"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Tailspin Toys has a classic release pipeline named **shop-release** with three stages: Dev, QA and Prod. The team must replace shop-release with a YAML pipeline in Azure Pipelines.

        What should the team do?
      fr: |
        Tailspin Toys dispose d'un pipeline de mise en production classique nommé **shop-release** avec trois phases : Dev, QA et Prod. L'équipe doit remplacer shop-release par un pipeline YAML dans Azure Pipelines.

        Que doit faire l'équipe ?
    body:
      options:
        - { id: a, text: { en: "Select Export to YAML in the three-dot menu of shop-release, then commit the downloaded file", fr: "Sélectionner Export to YAML dans le menu à trois points de shop-release, puis commiter le fichier téléchargé" } }
        - { id: b, text: { en: "Write a multi-stage YAML pipeline whose stages use deployment jobs, and add the tasks one by one", fr: "Écrire un pipeline YAML à phases multiples dont les phases utilisent des travaux de déploiement, et ajouter les tâches une par une" } }
        - { id: c, text: { en: "Save each stage of shop-release as a task group, then reference the task groups from a YAML pipeline", fr: "Enregistrer chaque phase de shop-release comme groupe de tâches, puis référencer les groupes de tâches depuis un pipeline YAML" } }
        - { id: d, text: { en: "Clone shop-release as a classic build pipeline, then export that build pipeline to YAML", fr: "Cloner shop-release en pipeline de build classique, puis exporter ce pipeline de build en YAML" } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          Only classic build pipelines created with the classic build designer can be exported to YAML. A classic release pipeline has no YAML export, so its stages are rewritten by hand as stages with deployment jobs that target environments, task by task.
        fr: |
          Seuls les pipelines de build classiques créés avec le concepteur de build classique peuvent être exportés en YAML. Un pipeline de mise en production classique n'a pas d'export YAML : ses phases se réécrivent à la main, tâche par tâche, en phases avec des travaux de déploiement qui ciblent des environnements.
      options:
        a: { en: "Export to YAML exists only for classic build pipelines; classic release pipelines don't support YAML export.", fr: "Export to YAML n'existe que pour les pipelines de build classiques ; les pipelines de mise en production classiques ne prennent pas en charge l'export YAML." }
        c: { en: "Task groups are a classic feature that YAML pipelines can't reference; their YAML equivalent is a template.", fr: "Les groupes de tâches sont une fonctionnalité classique qu'un pipeline YAML ne peut pas référencer ; leur équivalent YAML est un modèle." }
        d: { en: "A release pipeline can't be cloned into a build pipeline: the two classic pipeline types are separate.", fr: "Un pipeline de mise en production ne peut pas être cloné en pipeline de build : les deux types de pipelines classiques sont distincts." }
    references:
      - title: Migrate your Classic pipeline to YAML - Azure Pipelines
        url: https://learn.microsoft.com/en-us/azure/devops/pipelines/release/from-classic-pipelines

  # ------------------------------------------------------------------ 3
  - id: az400-qz-36-03
    objective: "3.6.2"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Contoso's YAML pipeline **docs-ci** builds an Azure Repos Git repository on every push to main. Every night, an automation job commits a regenerated API reference to main. Its commits change the same folders that the developers change, and each of them starts a 20-minute run that nobody needs.

        You need to prevent the commits of the automation job from starting docs-ci. Every push of the developers must still start a run, and the YAML file of docs-ci must not change.

        What should you do?
      fr: |
        Le pipeline YAML **docs-ci** de Contoso génère un dépôt Git Azure Repos à chaque push sur main. Chaque nuit, un travail d'automatisation commite sur main une référence d'API régénérée. Ses commits modifient les mêmes dossiers que ceux des développeurs, et chacun démarre une exécution de 20 minutes dont personne n'a besoin.

        Vous devez empêcher les commits du travail d'automatisation de démarrer docs-ci. Chaque push des développeurs doit toujours démarrer une exécution, et le fichier YAML de docs-ci ne doit pas changer.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Exclude the folders that the automation job changes with a path filter in the CI trigger", fr: "Exclure les dossiers modifiés par le travail d'automatisation avec un filtre de chemins dans le déclencheur CI" } }
        - { id: b, text: { en: "Set batch to true in the CI trigger so that the automation commits are grouped", fr: "Définir batch sur true dans le déclencheur CI pour regrouper les commits d'automatisation" } }
        - { id: c, text: { en: "Turn off the Build validation branch policy that runs docs-ci on main", fr: "Désactiver la stratégie de branche Build validation qui exécute docs-ci sur main" } }
        - { id: d, text: { en: "Include [skip ci] in the message of the commits that the automation job creates", fr: "Inclure [skip ci] dans le message des commits créés par le travail d'automatisation" } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          When a commit of a push contains `[skip ci]` (or a variant such as `[ci skip]` or `***NO_CI***`) in its message or description, Azure Pipelines doesn't run CI for that push. Only the automation job's commits carry the marker, so developer pushes still trigger docs-ci, and the YAML file stays unchanged.
        fr: |
          Lorsqu'un commit d'un push contient `[skip ci]` (ou une variante comme `[ci skip]` ou `***NO_CI***`) dans son message ou sa description, Azure Pipelines n'exécute pas la CI pour ce push. Seuls les commits du travail d'automatisation portent le marqueur : les push des développeurs déclenchent toujours docs-ci, et le fichier YAML ne change pas.
      options:
        a: { en: "A path filter changes the YAML file, and it would also skip the developer pushes that touch only those folders.", fr: "Un filtre de chemins modifie le fichier YAML, et il ignorerait aussi les push des développeurs qui ne touchent que ces dossiers." }
        b: { en: "batch changes the YAML file and only groups pushes made during a running build; the automation commit still starts a run.", fr: "batch modifie le fichier YAML et ne fait que regrouper les push faits pendant un build en cours ; le commit d'automatisation démarre toujours une exécution." }
        c: { en: "Build validation runs pipelines for pull requests; direct pushes to main start docs-ci through its CI trigger.", fr: "Build validation exécute des pipelines pour les demandes de tirage ; les push directs sur main démarrent docs-ci par son déclencheur CI." }
    references:
      - title: Build Azure Repos Git repositories - Azure Pipelines
        url: https://learn.microsoft.com/en-us/azure/devops/pipelines/repos/azure-repos-git

  # ------------------------------------------------------------------ 4
  - id: az400-qz-36-04
    objective: "3.6.3"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Litware's Azure DevOps organization has two paid Microsoft-hosted parallel jobs and ten self-hosted parallel jobs. Its only self-hosted agent pool, **pool-onprem**, has ten agents that are idle most of the day. All the CI pipelines use `vmImage: ubuntu-24.04`, and their runs often wait in the queue during the day.

        You need up to five CI jobs to run at the same time. The CI pipelines must keep using Microsoft-hosted agents.

        What should you do?
      fr: |
        L'organisation Azure DevOps de Litware dispose de deux travaux parallèles hébergés par Microsoft payants et de dix travaux parallèles auto-hébergés. Son seul pool d'agents auto-hébergés, **pool-onprem**, compte dix agents inactifs la plupart de la journée. Tous les pipelines de CI utilisent `vmImage: ubuntu-24.04`, et leurs exécutions attendent souvent en file pendant la journée.

        Vous devez permettre l'exécution simultanée de cinq travaux de CI au maximum. Les pipelines de CI doivent continuer à utiliser des agents hébergés par Microsoft.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Purchase three more Microsoft-hosted parallel jobs", fr: "Acheter trois travaux parallèles hébergés par Microsoft supplémentaires" } }
        - { id: b, text: { en: "Purchase three more self-hosted parallel jobs", fr: "Acheter trois travaux parallèles auto-hébergés supplémentaires" } }
        - { id: c, text: { en: "Add three agents to the pool-onprem agent pool", fr: "Ajouter trois agents au pool d'agents pool-onprem" } }
        - { id: d, text: { en: "Move the CI pipelines to a project of their own", fr: "Déplacer les pipelines de CI dans un projet dédié" } }
    answer: { optionId: a }
    explanation:
      correct:
        en: |
          Microsoft-hosted and self-hosted parallel jobs are two separate types, bought separately: jobs that run on Microsoft-hosted agents are limited by the Microsoft-hosted parallel jobs only. With two paid jobs, two hosted jobs run at once; three more bring the total to five. The free grant doesn't add a job: the first purchase only removes its time limits.
        fr: |
          Les travaux parallèles hébergés par Microsoft et auto-hébergés sont deux types distincts, achetés séparément : les travaux exécutés sur des agents hébergés par Microsoft sont limités par les seuls travaux parallèles hébergés par Microsoft. Avec deux travaux payants, deux travaux hébergés s'exécutent à la fois ; trois de plus portent le total à cinq. L'octroi gratuit n'ajoute pas de travail : le premier achat ne fait que supprimer ses limites de durée.
      options:
        b: { en: "Self-hosted parallel jobs only count for jobs on self-hosted agents, and the ten existing ones are already mostly unused.", fr: "Les travaux parallèles auto-hébergés ne comptent que pour les travaux sur des agents auto-hébergés, et les dix existants sont déjà en grande partie inutilisés." }
        c: { en: "More self-hosted agents don't help jobs that must run on Microsoft-hosted agents.", fr: "Davantage d'agents auto-hébergés n'aide pas les travaux qui doivent s'exécuter sur des agents hébergés par Microsoft." }
        d: { en: "Parallel jobs belong to the organization and are shared by all projects; a new project gets no parallel job of its own.", fr: "Les travaux parallèles appartiennent à l'organisation et sont partagés par tous les projets ; un nouveau projet n'obtient aucun travail parallèle propre." }
    references:
      - title: Configure and pay for parallel jobs - Azure DevOps
        url: https://learn.microsoft.com/en-us/azure/devops/pipelines/licensing/concurrent-jobs

  # ------------------------------------------------------------------ 5
  - id: az400-qz-36-05
    objective: "3.6.1"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Adatum's YAML pipeline **pay-ci** runs JUnit tests with the Maven task and publishes the results with the Publish Test Results task. Flaky test management is turned on with system detection in the project. A test named OrderTimeoutTest failed in run 412, and the run failed. No test of pay-ci has ever been marked as flaky.

        Which event makes Azure Pipelines mark OrderTimeoutTest as flaky automatically?
      fr: |
        Le pipeline YAML **pay-ci** d'Adatum exécute des tests JUnit avec la tâche Maven et publie les résultats avec la tâche Publish Test Results. La gestion des tests instables est activée avec la détection système dans le projet. Un test nommé OrderTimeoutTest a échoué dans l'exécution 412, et l'exécution a échoué. Aucun test de pay-ci n'a jamais été marqué comme instable.

        Quel événement amène Azure Pipelines à marquer automatiquement OrderTimeoutTest comme instable ?
    body:
      options:
        - { id: a, text: { en: "OrderTimeoutTest fails again in the next run of pay-ci on the same branch.", fr: "OrderTimeoutTest échoue de nouveau dans l'exécution suivante de pay-ci sur la même branche." } }
        - { id: b, text: { en: "A team member reruns the failed jobs of run 412, and OrderTimeoutTest passes.", fr: "Un membre de l'équipe réexécute les travaux en échec de l'exécution 412, et OrderTimeoutTest réussit." } }
        - { id: c, text: { en: "OrderTimeoutTest appears among the top failing tests of the Test failures report.", fr: "OrderTimeoutTest apparaît parmi les tests qui échouent le plus dans le rapport Test failures." } }
        - { id: d, text: { en: "OrderTimeoutTest passes in the next scheduled run, which builds a newer commit.", fr: "OrderTimeoutTest réussit dans l'exécution planifiée suivante, qui génère un commit plus récent." } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          System detection marks a test as flaky when it fails and then passes on a rerun. The rerun happens either inside the Visual Studio Test task or when someone selects Rerun failed jobs on the run. pay-ci doesn't use the Visual Studio Test task, so rerunning the failed jobs of run 412 is the event that can flag the test.
        fr: |
          La détection système marque un test comme instable lorsqu'il échoue puis réussit lors d'une réexécution. La réexécution a lieu soit dans la tâche Visual Studio Test, soit quand quelqu'un sélectionne la réexécution des travaux en échec de l'exécution. pay-ci n'utilise pas la tâche Visual Studio Test : réexécuter les travaux en échec de l'exécution 412 est l'événement qui peut signaler le test.
      options:
        a: { en: "Repeated failures don't make a test flaky: system detection needs a failure followed by a pass on a rerun.", fr: "Des échecs répétés ne rendent pas un test instable : la détection système exige un échec suivi d'une réussite lors d'une réexécution." }
        c: { en: "The Test failures report lists the tests that fail most often; it doesn't mark them as flaky.", fr: "Le rapport Test failures liste les tests qui échouent le plus souvent ; il ne les marque pas comme instables." }
        d: { en: "A new run of a newer commit isn't a rerun of run 412: the code changed, so the pass says nothing about flakiness.", fr: "Une nouvelle exécution d'un commit plus récent n'est pas une réexécution de l'exécution 412 : le code a changé, la réussite ne dit donc rien de l'instabilité." }
    references:
      - title: Manage flaky tests - Azure Pipelines
        url: https://learn.microsoft.com/en-us/azure/devops/pipelines/test/flaky-test-management

  # ------------------------------------------------------------------ 6
  - id: az400-qz-36-06
    objective: "3.6.4"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        Proseware has an Azure DevOps project named **Claims** with the following settings in Project settings > Pipelines > Settings:

        | Setting | Value |
        | --- | --- |
        | Days to keep artifacts, symbols and attachments | 10 |
        | Days to keep runs | 30 |
        | Days to keep pull request runs | 10 |
        | Number of recent runs to retain per pipeline | 3 |

        The YAML pipeline **claims-ci** builds the main branch, publishes a pipeline artifact named app, runs tests and publishes an npm package to an Azure Artifacts feed named **claims-libs**. Package retention isn't enabled on claims-libs. No run has a retention lease, is retained indefinitely or is retained by a release.

        Which two statements are true?

        NOTE: Each correct selection is worth one point.
      fr: |
        Proseware dispose d'un projet Azure DevOps nommé **Claims** avec les paramètres suivants dans Paramètres du projet > Pipelines > Paramètres :

        | Paramètre | Valeur |
        | --- | --- |
        | Jours de conservation des artefacts, symboles et pièces jointes | 10 |
        | Jours de conservation des exécutions | 30 |
        | Jours de conservation des exécutions de demandes de tirage | 10 |
        | Nombre d'exécutions récentes à conserver par pipeline | 3 |

        Le pipeline YAML **claims-ci** génère la branche main, publie un artefact de pipeline nommé app, exécute des tests et publie un package npm dans un flux Azure Artifacts nommé **claims-libs**. La rétention des packages n'est pas activée sur claims-libs. Aucune exécution n'a de bail de rétention, n'est conservée indéfiniment ni n'est retenue par une mise en production.

        Quelles sont les deux affirmations vraies ?

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "A run of main that finished 20 days ago and isn't one of the three most recent runs still exists, but its app artifact is deleted.", fr: "Une exécution de main terminée il y a 20 jours et qui ne fait pas partie des trois exécutions les plus récentes existe toujours, mais son artefact app est supprimé." } }
        - { id: b, text: { en: "When a run of claims-ci is deleted, the npm package version that the run published is deleted from claims-libs.", fr: "Lorsqu'une exécution de claims-ci est supprimée, la version du package npm qu'elle a publiée est supprimée de claims-libs." } }
        - { id: c, text: { en: "When a run of claims-ci is deleted, the test results of the run are deleted with it.", fr: "Lorsqu'une exécution de claims-ci est supprimée, les résultats de tests de l'exécution sont supprimés avec elle." } }
        - { id: d, text: { en: "You can keep the runs of claims-ci for 90 days by adding a retention policy to claims-ci only.", fr: "Vous pouvez conserver les exécutions de claims-ci pendant 90 jours en ajoutant une stratégie de rétention à claims-ci uniquement." } }
        - { id: e, text: { en: "If Days to keep artifacts, symbols and attachments were set to 60, the app artifact would stay available after its run is deleted.", fr: "Si les jours de conservation des artefacts, symboles et pièces jointes étaient définis à 60, l'artefact app resterait disponible après la suppression de son exécution." } }
    answer: { optionIds: [ a, c ] }
    explanation:
      correct:
        en: |
          Artifacts, symbols and attachments have their own age limit: after 10 days they are deleted, while the run itself and its logs stay until Days to keep runs (30) is exceeded. When a run is deleted, Azure Pipelines removes its logs, artifacts, symbols, test results and metadata together.
        fr: |
          Les artefacts, les symboles et les pièces jointes ont leur propre limite d'âge : au bout de 10 jours ils sont supprimés, alors que l'exécution elle-même et ses journaux restent jusqu'au dépassement des jours de conservation des exécutions (30). Lorsqu'une exécution est supprimée, Azure Pipelines efface ensemble ses journaux, ses artefacts, ses symboles, ses résultats de tests et ses métadonnées.
      options:
        b: { en: "Packages in Azure Artifacts feeds aren't governed by pipeline run retention; only feed retention or a manual deletion removes them.", fr: "Les packages des flux Azure Artifacts ne relèvent pas de la rétention des exécutions de pipeline ; seuls la rétention du flux ou une suppression manuelle les retirent." }
        d: { en: "Per-pipeline retention policies are no longer supported: run retention is a project setting, or a lease for specific runs.", fr: "Les stratégies de rétention par pipeline ne sont plus prises en charge : la rétention des exécutions est un paramètre du projet, ou un bail pour des exécutions précises." }
        e: { en: "Deleting a run deletes all its artifacts, whatever the artifact setting: artifacts can't outlive their run.", fr: "La suppression d'une exécution supprime tous ses artefacts, quel que soit le paramètre des artefacts : un artefact ne peut pas survivre à son exécution." }
    references:
      - title: Retention Policies - Azure Pipelines
        url: https://learn.microsoft.com/en-us/azure/devops/pipelines/policies/retention

  # ------------------------------------------------------------------ 7
  - id: az400-qz-36-07
    objective: "3.6.2"
    difficulty: 3
    status: draft
    type: dropdown
    stem:
      en: |
        Woodgrove Bank has the following YAML pipeline. Its UI tests take 50 minutes on one agent, and the Lint stage, which only checks the Markdown files of the repository, waits for the Build stage although it doesn't use its output. The organization has enough parallel jobs.

        You need to modify the pipeline to meet the following requirements:

        - The jobs must keep running on Windows Server 2022 with Visual Studio 2022 when Microsoft moves the windows-latest label to a newer image.
        - The Lint stage must start at the same time as the Build stage.
        - In each run, the UI tests must be split across four agents, each agent running a different part of the tests.

        How should you complete the YAML? Select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Woodgrove Bank dispose du pipeline YAML suivant. Ses tests d'interface utilisateur durent 50 minutes sur un agent, et la phase Lint, qui vérifie seulement les fichiers Markdown du dépôt, attend la phase Build bien qu'elle n'utilise pas sa sortie. L'organisation dispose de suffisamment de travaux parallèles.

        Vous devez modifier le pipeline pour satisfaire les exigences suivantes :

        - Les travaux doivent continuer à s'exécuter sur Windows Server 2022 avec Visual Studio 2022 lorsque Microsoft fait passer l'étiquette windows-latest à une image plus récente.
        - La phase Lint doit démarrer en même temps que la phase Build.
        - Dans chaque exécution, les tests d'interface utilisateur doivent être répartis sur quatre agents, chaque agent exécutant une partie différente des tests.

        Comment devez-vous compléter le YAML ? Sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: code
      language: yaml
      template: |
        pool:
          vmImage: [[image]]

        stages:
        - stage: Build
          jobs:
          - job: Compile
            steps:
            - script: dotnet build --configuration Release
            - task: PublishPipelineArtifact@1
              inputs:
                targetPath: '$(Build.SourcesDirectory)/tests/bin'
                artifact: tests
        - stage: Lint
          dependsOn: [[deps]]
          jobs:
          - job: Markdown
            steps:
            - script: npx markdownlint-cli2 "docs/**/*.md"
        - stage: Test
          dependsOn: Build
          jobs:
          - job: UiTests
            strategy:
              [[slice]]: 4
            steps:
            - download: current
              artifact: tests
            - task: VSTest@3
              inputs:
                testAssemblyVer2: '**/*UiTests.dll'
                searchFolder: '$(Pipeline.Workspace)/tests'
      slots:
        - id: image
          options:
            - { id: latest, text: windows-latest }
            - { id: w2022, text: windows-2022 }
            - { id: w2025, text: windows-2025 }
        - id: deps
          options:
            - { id: none, text: "[]" }
            - { id: build, text: Build }
            - { id: test, text: Test }
        - id: slice
          options:
            - { id: parallel, text: parallel }
            - { id: matrix, text: matrix }
            - { id: maxparallel, text: maxParallel }
    answer:
      values: { image: w2022, deps: none, slice: parallel }
    explanation:
      correct:
        en: |
          A versioned label such as windows-2022 keeps the jobs on the same operating system and Visual Studio version, whereas windows-latest follows Microsoft's moves to newer images. Stages run one after the other by default; `dependsOn: []` removes Lint's dependency on the previous stage so that it starts with Build. `parallel: 4` runs the job on four agents, and the Visual Studio Test task detects the parallel agents and gives each one a different slice of the tests.
        fr: |
          Une étiquette versionnée comme windows-2022 maintient les travaux sur le même système d'exploitation et la même version de Visual Studio, alors que windows-latest suit les passages de Microsoft à des images plus récentes. Les phases s'exécutent l'une après l'autre par défaut ; `dependsOn: []` supprime la dépendance de Lint envers la phase précédente pour qu'elle démarre avec Build. `parallel: 4` exécute le travail sur quatre agents, et la tâche Visual Studio Test détecte les agents parallèles et donne à chacun une tranche différente des tests.
      options:
        latest: { en: "windows-latest moves to the newest Windows image chosen by Microsoft, which the first requirement forbids.", fr: "windows-latest passe à l'image Windows la plus récente choisie par Microsoft, ce que la première exigence interdit." }
        w2025: { en: "windows-2025 is a Windows Server 2025 image, not Windows Server 2022.", fr: "windows-2025 est une image Windows Server 2025, pas Windows Server 2022." }
        build: { en: "dependsOn: Build is what the stage already does by default: Lint would keep waiting for Build.", fr: "dependsOn: Build reproduit le comportement par défaut : Lint continuerait d'attendre Build." }
        test: { en: "dependsOn: Test makes Lint wait for Test, which itself waits for Build.", fr: "dependsOn: Test fait attendre Test à Lint, alors que Test attend lui-même Build." }
        matrix: { en: "matrix expects named configurations with their variables, not a number of agents.", fr: "matrix attend des configurations nommées avec leurs variables, pas un nombre d'agents." }
        maxparallel: { en: "maxParallel only limits how many matrix legs run at once; it doesn't create copies of the job.", fr: "maxParallel limite seulement le nombre de branches d'une matrice exécutées à la fois ; il ne crée pas de copies du travail." }
    references:
      - title: Stages in Azure Pipelines - Azure Pipelines
        url: https://learn.microsoft.com/en-us/azure/devops/pipelines/process/stages
      - title: Run VSTest tests in parallel - Azure Pipelines
        url: https://learn.microsoft.com/en-us/azure/devops/pipelines/test/parallel-testing-vstest

  # ------------------------------------------------------------------ 8
  - id: az400-qz-36-08
    objective: "3.6.3"
    difficulty: 3
    status: draft
    shuffle: false
    type: dropdown
    stem:
      en: |
        Fabrikam's Azure DevOps organization contains two projects, **Web** and **Data**, and has four self-hosted parallel jobs. It doesn't use Microsoft-hosted agents. The pipelines of Web run on the agent pool **pool-web**, which has six online agents. The pipelines of Data run on **pool-data**, which has two online agents.

        At 09:00, the following activity is in progress:

        - A run of the pipeline etl-ci (Data) is running one job on pool-data.
        - A run of the pipeline etl-cd (Data) waits for an approval before its Production stage.
        - A run of the pipeline ui-tests (Web) starts. Its only job uses a matrix of eight configurations with `maxParallel: 5` and runs on pool-web.

        No other job is running or queued.

        How many configurations of ui-tests run at the same time? Select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        L'organisation Azure DevOps de Fabrikam contient deux projets, **Web** et **Data**, et dispose de quatre travaux parallèles auto-hébergés. Elle n'utilise pas d'agents hébergés par Microsoft. Les pipelines de Web s'exécutent sur le pool d'agents **pool-web**, qui compte six agents en ligne. Les pipelines de Data s'exécutent sur **pool-data**, qui compte deux agents en ligne.

        À 09:00, l'activité suivante est en cours :

        - Une exécution du pipeline etl-ci (Data) exécute un travail sur pool-data.
        - Une exécution du pipeline etl-cd (Data) attend une approbation avant sa phase Production.
        - Une exécution du pipeline ui-tests (Web) démarre. Son unique travail utilise une matrice de huit configurations avec `maxParallel: 5` et s'exécute sur pool-web.

        Aucun autre travail n'est en cours ni en file d'attente.

        Combien de configurations de ui-tests s'exécutent en même temps ? Sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: text
      template:
        en: |
          While the job of etl-ci runs: [[during]] configurations of ui-tests run at the same time.

          After the job of etl-ci finishes, while etl-cd still waits for the approval: [[after]] configurations of ui-tests run at the same time.
        fr: |
          Pendant que le travail d'etl-ci s'exécute : [[during]] configurations de ui-tests s'exécutent en même temps.

          Après la fin du travail d'etl-ci, alors qu'etl-cd attend toujours l'approbation : [[after]] configurations de ui-tests s'exécutent en même temps.
      slots:
        - id: during
          options:
            - { id: d2, text: "2" }
            - { id: d3, text: "3" }
            - { id: d4, text: "4" }
            - { id: d5, text: "5" }
        - id: after
          options:
            - { id: a3, text: "3" }
            - { id: a4, text: "4" }
            - { id: a5, text: "5" }
            - { id: a6, text: "6" }
    answer:
      values: { during: d3, after: a4 }
    explanation:
      correct:
        en: |
          The four self-hosted parallel jobs are shared by every project and pool of the organization, so the job of etl-ci in Data uses one of them and leaves three for ui-tests. The etl-cd run that waits for an approval doesn't consume a parallel job. Once etl-ci finishes, four parallel jobs are free: maxParallel (5) and the six agents of pool-web allow more, but the parallel jobs cap ui-tests at four configurations.
        fr: |
          Les quatre travaux parallèles auto-hébergés sont partagés par tous les projets et tous les pools de l'organisation : le travail d'etl-ci dans Data en utilise un et en laisse trois à ui-tests. L'exécution d'etl-cd qui attend une approbation ne consomme pas de travail parallèle. Une fois etl-ci terminé, quatre travaux parallèles sont libres : maxParallel (5) et les six agents de pool-web permettraient davantage, mais les travaux parallèles limitent ui-tests à quatre configurations.
      options:
        d2: { en: "Only etl-ci consumes a parallel job; the run waiting for an approval doesn't.", fr: "Seul etl-ci consomme un travail parallèle ; l'exécution en attente d'approbation n'en consomme pas." }
        d4: { en: "Parallel jobs can't be dedicated to a project or a pool: the job of etl-ci in Data uses one of the four.", fr: "Les travaux parallèles ne peuvent pas être réservés à un projet ou à un pool : le travail d'etl-ci dans Data utilise l'un des quatre." }
        a5: { en: "maxParallel is an upper limit for the matrix; the organization still has only four parallel jobs.", fr: "maxParallel est une limite haute pour la matrice ; l'organisation ne dispose toujours que de quatre travaux parallèles." }
        a6: { en: "Agents beyond the number of parallel jobs stay idle, whatever the size of the pool.", fr: "Les agents au-delà du nombre de travaux parallèles restent inactifs, quelle que soit la taille du pool." }
    references:
      - title: Configure and pay for parallel jobs - Azure DevOps
        url: https://learn.microsoft.com/en-us/azure/devops/pipelines/licensing/concurrent-jobs

  # ------------------------------------------------------------------ 9
  - id: az400-qz-36-09
    objective: "3.6.5"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        Contoso has a classic build pipeline named **crm-build** and a classic release pipeline named **crm-release**. crm-release starts when crm-build produces a new artifact, deploys to a QA stage and then to a Prod stage, and runs the task group **tg-deploy-crm** in both stages. The Prod stage has a pre-deployment approval by the operations lead and a gate that queries Azure Monitor alerts. Two other release pipelines also use tg-deploy-crm.

        You exported crm-build with Export to YAML and created a YAML pipeline named **crm-ci** from the file. You need to replace crm-release. The solution must meet the following requirements:

        - A single run of crm-ci must build the application and deploy it to QA and then to Prod.
        - The deployment to Prod must still need the approval of the operations lead and must not start while an Azure Monitor alert is active.
        - The deployment steps must be defined once, so that the other pipelines can reuse them after their own migration.

        Which three actions should you perform? Each correct answer presents part of the solution.

        NOTE: Each correct selection is worth one point.
      fr: |
        Contoso dispose d'un pipeline de build classique nommé **crm-build** et d'un pipeline de mise en production classique nommé **crm-release**. crm-release démarre lorsque crm-build produit un nouvel artefact, déploie sur une phase QA puis sur une phase Prod, et exécute le groupe de tâches **tg-deploy-crm** dans les deux phases. La phase Prod a une approbation de prédéploiement par le responsable des opérations et une porte qui interroge les alertes Azure Monitor. Deux autres pipelines de mise en production utilisent aussi tg-deploy-crm.

        Vous avez exporté crm-build avec Export to YAML et créé un pipeline YAML nommé **crm-ci** à partir du fichier. Vous devez remplacer crm-release. La solution doit satisfaire les exigences suivantes :

        - Une seule exécution de crm-ci doit générer l'application, puis la déployer sur QA et ensuite sur Prod.
        - Le déploiement sur Prod doit toujours exiger l'approbation du responsable des opérations et ne doit pas démarrer tant qu'une alerte Azure Monitor est active.
        - Les étapes de déploiement doivent être définies une seule fois, pour que les autres pipelines puissent les réutiliser après leur propre migration.

        Quelles sont les trois actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 3
      options:
        - { id: a, text: { en: "Add QA and Prod stages to crm-ci with deployment jobs that target a qa and a prod environment.", fr: "Ajouter à crm-ci des phases QA et Prod avec des travaux de déploiement qui ciblent un environnement qa et un environnement prod." } }
        - { id: b, text: { en: "Create a YAML pipeline that declares crm-ci as a pipeline resource with a trigger, and deploy from it.", fr: "Créer un pipeline YAML qui déclare crm-ci comme ressource de pipeline avec un déclencheur, et déployer depuis celui-ci." } }
        - { id: c, text: { en: "Rewrite tg-deploy-crm as a steps template in a repository and reference it from both deployment jobs.", fr: "Réécrire tg-deploy-crm en modèle d'étapes dans un dépôt et le référencer depuis les deux travaux de déploiement." } }
        - { id: d, text: { en: "Reference tg-deploy-crm by its name in the steps of both deployment jobs of crm-ci.", fr: "Référencer tg-deploy-crm par son nom dans les étapes des deux travaux de déploiement de crm-ci." } }
        - { id: e, text: { en: "Add an Approvals check and a Query Azure Monitor Alerts check to the prod environment.", fr: "Ajouter une vérification Approvals et une vérification Query Azure Monitor Alerts à l'environnement prod." } }
        - { id: f, text: { en: "Export crm-release with Export to YAML so that its approval and gate settings are kept.", fr: "Exporter crm-release avec Export to YAML pour conserver ses paramètres d'approbation et de porte." } }
    answer: { optionIds: [ a, c, e ] }
    explanation:
      correct:
        en: |
          A classic release becomes stages with deployment jobs that target environments; adding them to crm-ci makes one run build and deploy. Pre-deployment approvals and gates become checks on the environment: an Approvals check for the operations lead and a Query Azure Monitor Alerts check. Task groups don't exist in YAML, so the shared steps become a template that each pipeline references.
        fr: |
          Une mise en production classique devient des phases avec des travaux de déploiement qui ciblent des environnements ; les ajouter à crm-ci fait générer et déployer en une seule exécution. Les approbations de prédéploiement et les portes deviennent des vérifications sur l'environnement : une vérification Approvals pour le responsable des opérations et une vérification Query Azure Monitor Alerts. Les groupes de tâches n'existent pas en YAML : les étapes partagées deviennent un modèle que chaque pipeline référence.
      options:
        b: { en: "A pipeline resource trigger starts a second pipeline with its own run, which breaks the single-run requirement.", fr: "Un déclencheur de ressource de pipeline démarre un second pipeline avec sa propre exécution, ce qui enfreint l'exigence d'une seule exécution." }
        d: { en: "YAML pipelines can't reference task groups; the migration replaces them with templates.", fr: "Un pipeline YAML ne peut pas référencer de groupe de tâches ; la migration les remplace par des modèles." }
        f: { en: "Classic release pipelines don't support Export to YAML, and approvals and gates aren't part of any YAML file.", fr: "Les pipelines de mise en production classiques ne prennent pas en charge Export to YAML, et les approbations et les portes ne font partie d'aucun fichier YAML." }
    references:
      - title: Migrate your Classic pipeline to YAML - Azure Pipelines
        url: https://learn.microsoft.com/en-us/azure/devops/pipelines/release/from-classic-pipelines
      - title: Pipeline deployment approvals - Azure Pipelines
        url: https://learn.microsoft.com/en-us/azure/devops/pipelines/process/approvals

  # ------------------------------------------------------------------ 10
  - id: az400-qz-36-10
    objective: "3.6.1"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        Wingtip Toys uses Azure DevOps Services. In the project **Inventory**, flaky test management is turned on with system detection, and the flaky test options exclude flaky tests from the Test Summary. The project has two YAML pipelines that run the same test suite:

        - **inv-ci** builds the main and release/* branches and runs the tests with the VSTest@3 task, with rerunFailedTests set to true.
        - **inv-nightly** builds main. A script step runs `dotnet test`, which returns a nonzero exit code when a test fails, and a PublishTestResults@2 step that runs even after a failure publishes the results.

        In a run of inv-ci on main, the test CartTotalTest fails and then passes when VSTest@3 reruns it.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Wingtip Toys utilise Azure DevOps Services. Dans le projet **Inventory**, la gestion des tests instables est activée avec la détection système, et les options des tests instables excluent les tests instables du résumé des tests. Le projet contient deux pipelines YAML qui exécutent la même suite de tests :

        - **inv-ci** génère les branches main et release/* et exécute les tests avec la tâche VSTest@3, avec rerunFailedTests défini sur true.
        - **inv-nightly** génère main. Une étape de script exécute `dotnet test`, qui renvoie un code de sortie non nul lorsqu'un test échoue, et une étape PublishTestResults@2 qui s'exécute même après un échec publie les résultats.

        Dans une exécution d'inv-ci sur main, le test CartTotalTest échoue puis réussit lorsque VSTest@3 le réexécute.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text:
            en: |
              The results of CartTotalTest in later runs of inv-nightly are treated as flaky.
            fr: |
              Les résultats de CartTotalTest dans les exécutions suivantes d'inv-nightly sont traités comme instables.
        - id: s2
          text:
            en: |
              The results of CartTotalTest in later runs of inv-ci on the release/2.0 branch are treated as flaky.
            fr: |
              Les résultats de CartTotalTest dans les exécutions suivantes d'inv-ci sur la branche release/2.0 sont traités comme instables.
        - id: s3
          text:
            en: |
              When CartTotalTest fails in a later run of inv-nightly, the run succeeds because flaky tests are excluded from the Test Summary.
            fr: |
              Lorsque CartTotalTest échoue dans une exécution suivante d'inv-nightly, l'exécution réussit, car les tests instables sont exclus du résumé des tests.
    answer:
      values: { s1: true, s2: false, s3: false }
    explanation:
      correct:
        en: |
          A test marked as flaky is flaky for that branch, and the information is shared by all the pipelines that build the branch: inv-nightly builds main, so it sees CartTotalTest as flaky. release/2.0 is another branch, where the test isn't marked. Excluding flaky tests from the Test Summary only updates the summary of the Visual Studio Test and Publish Test Results tasks; the `dotnet test` script step still fails on its exit code, so the run fails unless a custom script suppresses the failure.
        fr: |
          Un test marqué comme instable l'est pour cette branche, et l'information est partagée par tous les pipelines qui génèrent la branche : inv-nightly génère main, il voit donc CartTotalTest comme instable. release/2.0 est une autre branche, sur laquelle le test n'est pas marqué. Exclure les tests instables du résumé des tests ne met à jour que le résumé des tâches Visual Studio Test et Publish Test Results ; l'étape de script `dotnet test` échoue toujours à cause de son code de sortie, et l'exécution échoue donc, sauf si un script personnalisé supprime l'échec.
      options:
        s2: { en: "Flakiness is recorded per branch; a detection on main doesn't mark the test on release/2.0.", fr: "L'instabilité est enregistrée par branche ; une détection sur main ne marque pas le test sur release/2.0." }
        s3: { en: "The exclusion acts on the Test Summary and pass percentage, not on the exit code of a script step.", fr: "L'exclusion agit sur le résumé des tests et le pourcentage de réussite, pas sur le code de sortie d'une étape de script." }
    references:
      - title: Manage flaky tests - Azure Pipelines
        url: https://learn.microsoft.com/en-us/azure/devops/pipelines/test/flaky-test-management
