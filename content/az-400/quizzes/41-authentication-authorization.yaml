chapter: 41-authentication-authorization
questions:
  # ------------------------------------------------------------------ 1
  - id: az400-qz-41-01
    objective: "4.1.1"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        You are adding a federated identity credential to a user-assigned managed identity so that a GitHub Actions workflow can sign in to Microsoft Entra ID without a secret. You keep the values that Microsoft recommends.

        Which value should you enter as the audience of the credential?
      fr: |
        Vous ajoutez une information d'identification fédérée à une identité managée attribuée par l'utilisateur pour qu'un workflow GitHub Actions puisse se connecter à Microsoft Entra ID sans secret. Vous conservez les valeurs recommandées par Microsoft.

        Quelle valeur devez-vous saisir comme audience de l'information d'identification ?
    body:
      options:
        - { id: a, text: "`https://token.actions.githubusercontent.com`" }
        - { id: b, text: "`repo:contoso/web:ref:refs/heads/main`" }
        - { id: c, text: "`api://AzureADTokenExchange`" }
        - { id: d, text: "`https://management.azure.com`" }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          The audience lists the audiences that can appear in the external token, and the recommended value is `api://AzureADTokenExchange`, which azure/login also sends by default in the public cloud. Microsoft Entra ID compares issuer, subject and audience case-sensitively with the claims of the GitHub token.
        fr: |
          L'audience liste les audiences qui peuvent figurer dans le jeton externe, et la valeur recommandée est `api://AzureADTokenExchange`, que azure/login envoie aussi par défaut dans le cloud public. Microsoft Entra ID compare l'émetteur, le sujet et l'audience en respectant la casse avec les revendications du jeton GitHub.
      options:
        a: { en: "This URL is the issuer of GitHub's OIDC tokens; it goes in the issuer field, not in the audience.", fr: "Cette URL est l'émetteur des jetons OIDC de GitHub ; elle va dans le champ de l'émetteur, pas dans l'audience." }
        b: { en: "This string is a subject: it identifies the repository and branch allowed to use the credential.", fr: "Cette chaîne est un sujet : elle identifie le dépôt et la branche autorisés à utiliser l'information d'identification." }
        d: { en: "This is the Azure Resource Manager resource that the access token is requested for, not the audience of the GitHub token.", fr: "Il s'agit de la ressource Azure Resource Manager pour laquelle le jeton d'accès est demandé, pas de l'audience du jeton GitHub." }
    references:
      - title: Create a trust relationship between an app and an external identity provider - Microsoft Entra Workload ID
        url: https://learn.microsoft.com/en-us/entra/workload-id/workload-identity-federation-create-trust

  # ------------------------------------------------------------------ 2
  - id: az400-qz-41-02
    objective: "4.1.6"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Elena, the product manager of Northwind Traders, must read the code and comment on the pull requests of the Azure Repos Git repositories of a project. She has no Visual Studio subscription and no GitHub Enterprise license. Licensing costs must be minimized.

        Which access level should you assign to Elena?
      fr: |
        Elena, cheffe de produit chez Northwind Traders, doit lire le code et commenter les demandes de tirage des dépôts Git Azure Repos d'un projet. Elle n'a ni abonnement Visual Studio ni licence GitHub Enterprise. Les coûts de licence doivent être réduits au minimum.

        Quel niveau d'accès devez-vous attribuer à Elena ?
    body:
      options:
        - { id: a, text: Stakeholder }
        - { id: b, text: { en: "Stakeholder, with membership in the Contributors group", fr: "Stakeholder, avec l'appartenance au groupe Contributors" } }
        - { id: c, text: Basic }
        - { id: d, text: Basic + Test Plans }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          Azure Repos is part of Basic, the cheapest paid access level, which gives most features of Azure DevOps. The Stakeholder access level doesn't give access to the code, and Elena needs nothing from Azure Test Plans.
        fr: |
          Azure Repos fait partie de Basic, le niveau d'accès payant le moins cher, qui donne la plupart des fonctionnalités d'Azure DevOps. Le niveau d'accès Stakeholder ne donne pas accès au code, et Elena n'a besoin de rien dans Azure Test Plans.
      options:
        a: { en: "Stakeholder is free but doesn't include the code of Azure Repos.", fr: "Stakeholder est gratuit mais n'inclut pas le code d'Azure Repos." }
        b: { en: "Access levels decide which features a user sees; membership in a security group can't add the code features to Stakeholder.", fr: "Le niveau d'accès décide des fonctionnalités visibles ; l'appartenance à un groupe de sécurité ne peut pas ajouter les fonctionnalités de code à Stakeholder." }
        d: { en: "Basic + Test Plans adds test case management that Elena doesn't need, at a higher cost.", fr: "Basic + Test Plans ajoute une gestion des cas de test dont Elena n'a pas besoin, pour un coût plus élevé." }
    references:
      - title: About access levels - Azure DevOps
        url: https://learn.microsoft.com/en-us/azure/devops/organizations/security/access-levels

  # ------------------------------------------------------------------ 3
  - id: az400-qz-41-03
    objective: "4.1.2"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Contoso has a workflow named **deploy.yml** that deploys to Azure from a GitHub-hosted runner. It uses azure/login@v2 with the client-id, tenant-id and subscription-id inputs, and the Azure identity has a federated credential that trusts the workflow. The workflow file starts with the following block:

        ```yaml
        permissions:
          contents: read
        ```

        The azure/login step fails because the job can't obtain an OIDC token. You need to fix the workflow. The solution must not store any secret and must follow the principle of least privilege.

        What should you do?
      fr: |
        Contoso dispose d'un workflow nommé **deploy.yml** qui déploie dans Azure depuis un exécuteur hébergé par GitHub. Il utilise azure/login@v2 avec les entrées client-id, tenant-id et subscription-id, et l'identité Azure possède une information d'identification fédérée qui approuve le workflow. Le fichier du workflow commence par le bloc suivant :

        ```yaml
        permissions:
          contents: read
        ```

        L'étape azure/login échoue, car le job ne parvient pas à obtenir de jeton OIDC. Vous devez corriger le workflow. La solution ne doit stocker aucun secret et doit respecter le principe du privilège minimum.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Add `id-token: read` to the permissions block", fr: "Ajouter `id-token: read` au bloc permissions" } }
        - { id: b, text: { en: "Add `id-token: write` to the permissions block", fr: "Ajouter `id-token: write` au bloc permissions" } }
        - { id: c, text: { en: "Replace the permissions block with `permissions: write-all`", fr: "Remplacer le bloc permissions par `permissions: write-all`" } }
        - { id: d, text: { en: "Pass a client secret of the identity in the creds input", fr: "Passer un secret client de l'identité dans l'entrée creds" } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          A job can request an OIDC token from GitHub only when GITHUB_TOKEN has the `id-token: write` permission. Because the workflow lists permissions, every permission that isn't listed, including id-token, is set to none; adding `id-token: write` alone keeps the other scopes at their current level.
        fr: |
          Un job ne peut demander un jeton OIDC à GitHub que si GITHUB_TOKEN a l'autorisation `id-token: write`. Comme le workflow liste des autorisations, toute autorisation non listée, y compris id-token, vaut none ; ajouter uniquement `id-token: write` laisse les autres étendues à leur niveau actuel.
      options:
        a: { en: "id-token accepts only write or none: there is no read level for requesting an OIDC token.", fr: "id-token n'accepte que write ou none : il n'existe pas de niveau read pour demander un jeton OIDC." }
        c: { en: "write-all would give id-token write, but also write access to every other scope, which breaks least privilege.", fr: "write-all donnerait id-token en écriture, mais aussi l'écriture sur toutes les autres étendues, ce qui enfreint le privilège minimum." }
        d: { en: "A client secret is a stored, long-lived credential, which the requirement forbids.", fr: "Un secret client est une information d'identification stockée et durable, ce que l'exigence interdit." }
    references:
      - title: Authenticate to Azure from GitHub Actions by OpenID Connect
        url: https://learn.microsoft.com/en-us/azure/developer/github/connect-from-azure-openid-connect

  # ------------------------------------------------------------------ 4
  - id: az400-qz-41-04
    objective: "4.1.5"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        In the Azure DevOps project **Phoenix**, the team Contractors has the security group **[Phoenix]\Contractors**, which is a member of Contributors. Phoenix contains 12 Git repositories.

        The members of Contractors must not be able to read the repository **payroll-api** and must keep their access to the 11 other repositories. The access of the other members of Contributors must not change.

        What should you do?
      fr: |
        Dans le projet Azure DevOps **Phoenix**, l'équipe Contractors dispose du groupe de sécurité **[Phoenix]\Contractors**, membre de Contributors. Phoenix contient 12 dépôts Git.

        Les membres de Contractors ne doivent pas pouvoir lire le dépôt **payroll-api** et doivent conserver leur accès aux 11 autres dépôts. L'accès des autres membres de Contributors ne doit pas changer.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "In the security of payroll-api, set Read to Deny for [Phoenix]\\Contractors", fr: "Dans la sécurité de payroll-api, définir Read sur Deny pour [Phoenix]\\Contractors" } }
        - { id: b, text: { en: "Remove [Phoenix]\\Contractors from the Contributors group of Phoenix", fr: "Retirer [Phoenix]\\Contractors du groupe Contributors de Phoenix" } }
        - { id: c, text: { en: "In the security of payroll-api, set Read to Not set for Contributors", fr: "Dans la sécurité de payroll-api, définir Read sur Not set pour Contributors" } }
        - { id: d, text: { en: "In the security of Git repositories, set Read to Deny for [Phoenix]\\Contractors", fr: "Dans la sécurité de Git repositories, définir Read sur Deny pour [Phoenix]\\Contractors" } }
    answer: { optionId: a }
    explanation:
      correct:
        en: |
          A Deny set on the object-level permissions of one repository applies only to that repository, and at the same scope a Deny wins over the Allow that the members inherit from Contributors. The other repositories and the other contributors keep their current permissions.
        fr: |
          Un Deny défini dans les autorisations au niveau objet d'un dépôt ne s'applique qu'à ce dépôt, et à la même étendue un Deny l'emporte sur l'Allow que les membres héritent de Contributors. Les autres dépôts et les autres contributeurs conservent leurs autorisations actuelles.
      options:
        b: { en: "Leaving Contributors removes the access to all 12 repositories and to the other features that Contributors grants.", fr: "Quitter Contributors retire l'accès aux 12 dépôts et aux autres fonctionnalités accordées par Contributors." }
        c: { en: "Changing the Contributors permission on payroll-api affects every contributor, not only the Contractors team.", fr: "Modifier l'autorisation de Contributors sur payroll-api affecte tous les contributeurs, pas seulement l'équipe Contractors." }
        d: { en: "The Git repositories level is inherited by every repository of the project, so the team would lose all 12.", fr: "Le niveau Git repositories est hérité par tous les dépôts du projet : l'équipe perdrait les 12." }
    references:
      - title: About permissions and security groups - Azure DevOps
        url: https://learn.microsoft.com/en-us/azure/devops/organizations/security/about-permissions

  # ------------------------------------------------------------------ 5
  - id: az400-qz-41-05
    objective: "4.1.7"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Fabrikam's Azure DevOps organization contains one project named **Engineering**, which uses the Scrum process and is administered by the platform team. The HR business unit starts tracking its work in Azure Boards.

        HR needs the CMMI process and its own administrators, who must not administer Engineering. The solution must minimize administrative effort.

        What should you do?
      fr: |
        L'organisation Azure DevOps de Fabrikam contient un seul projet nommé **Engineering**, qui utilise le processus Scrum et est administré par l'équipe plateforme. La division RH commence à suivre son travail dans Azure Boards.

        La division RH a besoin du processus CMMI et de ses propres administrateurs, qui ne doivent pas administrer Engineering. La solution doit réduire au minimum l'effort d'administration.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Create a team named HR in Engineering, and select the CMMI process in the settings of the team", fr: "Créer une équipe nommée HR dans Engineering, puis sélectionner le processus CMMI dans les paramètres de l'équipe" } }
        - { id: b, text: { en: "Create an Azure DevOps organization for HR, and create a project that uses the CMMI process in it", fr: "Créer une organisation Azure DevOps pour HR, puis y créer un projet qui utilise le processus CMMI" } }
        - { id: c, text: { en: "Change the process of Engineering to CMMI, and create a team named HR with its own area path", fr: "Changer le processus d'Engineering en CMMI, puis créer une équipe nommée HR avec son propre chemin de zone" } }
        - { id: d, text: { en: "Create a project named HR that uses the CMMI process, and add the HR leads to its Project Administrators", fr: "Créer un projet nommé HR qui utilise le processus CMMI, puis ajouter les responsables RH à ses Project Administrators" } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          The process is chosen per project, and each project has its own security, so a separate project is the recommended way to support a different work tracking process and separate administration for a business unit. Project Administrators of HR have no administrative rights on Engineering.
        fr: |
          Le processus se choisit par projet, et chaque projet a sa propre sécurité : un projet distinct est la solution recommandée pour offrir à une division un processus de suivi du travail différent et une administration séparée. Les Project Administrators de HR n'ont aucun droit d'administration sur Engineering.
      options:
        a: { en: "Teams share the process of their project; a team can customize its boards but not use another process.", fr: "Les équipes partagent le processus de leur projet ; une équipe peut personnaliser ses tableaux, mais pas utiliser un autre processus." }
        b: { en: "A second organization works but adds organization-level administration, billing and users to manage: more effort than a project.", fr: "Une deuxième organisation fonctionne, mais ajoute l'administration, la facturation et les utilisateurs d'une organisation à gérer : plus d'effort qu'un projet." }
        c: { en: "Changing the process of Engineering imposes CMMI on the engineering teams, and HR would still be administered by the platform team.", fr: "Changer le processus d'Engineering impose CMMI aux équipes d'ingénierie, et HR resterait administrée par l'équipe plateforme." }
    references:
      - title: Plan your organizational structure - Azure DevOps
        url: https://learn.microsoft.com/en-us/azure/devops/user-guide/plan-your-azure-devops-org-structure

  # ------------------------------------------------------------------ 6
  - id: az400-qz-41-06
    objective: "4.1.4"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        Contoso's GitHub organization uses the GitHub Team plan and has the base permission **Read**. The organization contains the following:

        - A team named **mobile-leads** that has the Maintain role on the private repository **contoso/mobile-app**.
        - Lee, a consultant, who is an outside collaborator with the Write role on the private repository **contoso/mobile-docs** only.

        No other access is granted.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        L'organisation GitHub de Contoso utilise le plan GitHub Team et a l'autorisation de base **Read**. L'organisation contient les éléments suivants :

        - Une équipe nommée **mobile-leads** qui a le rôle Maintain sur le dépôt privé **contoso/mobile-app**.
        - Lee, un consultant, collaborateur externe avec le rôle Write sur le seul dépôt privé **contoso/mobile-docs**.

        Aucun autre accès n'est accordé.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text:
            en: |
              The members of mobile-leads can change the pull request merge options of mobile-app, for example to allow only squash merging.
            fr: |
              Les membres de mobile-leads peuvent modifier les options de fusion des pull requests de mobile-app, par exemple pour n'autoriser que la fusion squash.
        - id: s2
          text:
            en: |
              The members of mobile-leads can add a webhook to mobile-app.
            fr: |
              Les membres de mobile-leads peuvent ajouter un webhook à mobile-app.
        - id: s3
          text:
            en: |
              Lee can clone the other private repositories of the organization because the base permission is Read.
            fr: |
              Lee peut cloner les autres dépôts privés de l'organisation, car l'autorisation de base est Read.
    answer:
      values: { s1: true, s2: false, s3: false }
    explanation:
      correct:
        en: |
          Maintain is meant for people who manage a repository without sensitive or destructive actions: it includes the merge options, but webhooks, deploy keys, branch protection rules and rulesets need Admin. Base permissions apply to organization members only, never to outside collaborators, so Lee reaches only mobile-docs.
        fr: |
          Maintain est destiné aux personnes qui gèrent un dépôt sans actions sensibles ou destructrices : il inclut les options de fusion, mais les webhooks, les clés de déploiement, les règles de protection de branche et les rulesets exigent Admin. Les autorisations de base ne s'appliquent qu'aux membres de l'organisation, jamais aux collaborateurs externes : Lee n'accède qu'à mobile-docs.
      options:
        s2: { en: "Managing webhooks is an Admin permission of the repository; Maintain doesn't include it.", fr: "La gestion des webhooks est une autorisation Admin du dépôt ; Maintain ne l'inclut pas." }
        s3: { en: "Base permissions don't apply to outside collaborators; Lee has only the roles granted on specific repositories.", fr: "Les autorisations de base ne s'appliquent pas aux collaborateurs externes ; Lee n'a que les rôles accordés sur des dépôts précis." }
    references:
      - title: Configure Repository Permissions Using GitHub - Training
        url: https://learn.microsoft.com/en-us/training/modules/manage-git-repositories/12-configure-source-control-repository-permissions-use-github

  # ------------------------------------------------------------------ 7
  - id: az400-qz-41-07
    objective: "4.1.3"
    difficulty: 3
    status: draft
    type: dragdrop
    stem:
      en: |
        Litware's Azure DevOps organization, **litware**, is connected to Microsoft Entra ID. You are an Azure DevOps Administrator in Microsoft Entra ID and a member of Project Collection Administrators in litware. The security team sets four requirements for the personal access tokens (PATs) that users create from now on.

        Which policy should you configure for each requirement? To answer, drag the appropriate policies to the correct requirements. Each policy may be used once or not at all.

        NOTE: Each correct selection is worth one point.
      fr: |
        L'organisation Azure DevOps de Litware, **litware**, est connectée à Microsoft Entra ID. Vous êtes Azure DevOps Administrator dans Microsoft Entra ID et membre de Project Collection Administrators dans litware. L'équipe de sécurité fixe quatre exigences pour les jetons d'accès personnels (PAT) que les utilisateurs créeront désormais.

        Quelle stratégie devez-vous configurer pour chaque exigence ? Pour répondre, faites glisser les stratégies appropriées vers les exigences correspondantes. Chaque stratégie peut être utilisée une fois ou pas du tout.

        Remarque : chaque sélection correcte vaut un point.
    body:
      reuse: false
      items:
        - { id: global, text: Restrict global personal access token creation }
        - { id: full, text: Restrict full-scoped personal access token creation }
        - { id: lifespan, text: Enforce maximum personal access token lifespan }
        - { id: creation, text: { en: "Restrict personal access token (PAT) creation, with Allow creation of PAT with packaging scope only", fr: "Restrict personal access token (PAT) creation, avec Allow creation of PAT with packaging scope only" } }
        - { id: leaked, text: Automatically revoke leaked personal access tokens }
        - { id: oauth, text: Third-party application access via OAuth }
      targets:
        - id: t1
          text: { en: "A new PAT must work in one organization only.", fr: "Un nouveau PAT ne doit fonctionner que dans une seule organisation." }
        - id: t2
          text: { en: "A new PAT can't use the Full access scope and must list the scopes it needs.", fr: "Un nouveau PAT ne peut pas utiliser l'étendue Full access et doit lister les étendues dont il a besoin." }
        - id: t3
          text: { en: "No new PAT can be valid for more than 30 days.", fr: "Aucun nouveau PAT ne peut être valide plus de 30 jours." }
        - id: t4
          text: { en: "In litware, users outside an allowlisted group can create PATs only to restore packages from Azure Artifacts feeds.", fr: "Dans litware, les utilisateurs extérieurs à un groupe autorisé ne peuvent créer des PAT que pour restaurer des packages depuis des flux Azure Artifacts." }
    answer:
      mapping: { t1: global, t2: full, t3: lifespan, t4: creation }
    explanation:
      correct:
        en: |
          Three tenant policies, set by an Azure DevOps Administrator in Organization settings > Microsoft Entra, apply to new PATs: restricting global PATs ties every new PAT to one organization, restricting full-scoped PATs forces custom scopes, and the maximum lifespan caps the validity in days. The organization policy Restrict personal access token (PAT) creation, set by a Project Collection Administrator, blocks PAT creation in litware except for its allowlist, and its subpolicy still allows PATs with packaging scopes only.
        fr: |
          Trois stratégies de locataire, définies par un Azure DevOps Administrator dans Paramètres de l'organisation > Microsoft Entra, s'appliquent aux nouveaux PAT : restreindre les PAT globaux lie chaque nouveau PAT à une organisation, restreindre les PAT à étendue complète impose des étendues personnalisées, et la durée de vie maximale plafonne la validité en jours. La stratégie d'organisation Restrict personal access token (PAT) creation, définie par un Project Collection Administrator, bloque la création de PAT dans litware sauf pour sa liste d'autorisation, et sa sous-stratégie autorise encore les PAT limités aux étendues de packaging.
      options:
        leaked: { en: "This policy revokes PATs found in public GitHub repositories; it doesn't restrict how PATs are created.", fr: "Cette stratégie révoque les PAT trouvés dans des dépôts GitHub publics ; elle ne restreint pas la façon dont les PAT sont créés." }
        oauth: { en: "This policy controls OAuth apps' access to the organization, not personal access tokens.", fr: "Cette stratégie contrôle l'accès des applications OAuth à l'organisation, pas les jetons d'accès personnels." }
    references:
      - title: Manage personal access tokens using policies - Azure DevOps
        url: https://learn.microsoft.com/en-us/azure/devops/organizations/accounts/manage-pats-with-policies-for-administrators

  # ------------------------------------------------------------------ 8
  - id: az400-qz-41-08
    objective: "4.1.3"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Adatum's identity team owns an app registration named **app-erp-deploy** that already has the required Azure role assignments. The platform team used it, with a client secret, to create the Azure Resource Manager service connection **sc-erp** by selecting App registration or managed identity (manual). sc-erp is shared with four projects.

        The platform team doesn't have the Owner role on the subscriptions and can't create app registrations. You need the pipelines of the four projects to deploy to Azure without any secret, through app-erp-deploy.

        What should you do?
      fr: |
        L'équipe identité d'Adatum possède une inscription d'application nommée **app-erp-deploy** qui a déjà les attributions de rôles Azure nécessaires. L'équipe plateforme l'a utilisée, avec un secret client, pour créer la connexion de service Azure Resource Manager **sc-erp** en sélectionnant App registration or managed identity (manual). sc-erp est partagée avec quatre projets.

        L'équipe plateforme n'a pas le rôle Owner sur les abonnements et ne peut pas créer d'inscriptions d'application. Vous devez faire en sorte que les pipelines des quatre projets déploient dans Azure sans aucun secret, par app-erp-deploy.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Select Convert on sc-erp so that Azure DevOps switches it to workload identity federation", fr: "Sélectionner Convert sur sc-erp pour qu'Azure DevOps la fasse passer à la fédération d'identité de charge de travail" } }
        - { id: b, text: { en: "Create a connection with App registration (automatic) and workload identity federation, then share it", fr: "Créer une connexion avec App registration (automatic) et la fédération d'identité de charge de travail, puis la partager" } }
        - { id: c, text: { en: "Create a manual workload identity federation connection for app-erp-deploy, and have its federated credential added", fr: "Créer une connexion manuelle avec fédération d'identité de charge de travail pour app-erp-deploy, et faire ajouter son information d'identification fédérée" } }
        - { id: d, text: { en: "Store the client secret in a key vault linked to a variable group, and rotate the secret every 90 days", fr: "Stocker le secret client dans un coffre de clés lié à un groupe de variables, et faire pivoter le secret tous les 90 jours" } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          A manual connection that uses workload identity federation with an existing app registration needs no secret: Azure DevOps shows an issuer and a subject identifier, the identity team adds them as a federated credential on app-erp-deploy, and you finish the setup, share the connection with the four projects and point the pipelines to it. The existing role assignments of app-erp-deploy keep working.
        fr: |
          Une connexion manuelle qui utilise la fédération d'identité de charge de travail avec une inscription d'application existante n'exige aucun secret : Azure DevOps affiche un émetteur et un identificateur de sujet, l'équipe identité les ajoute comme information d'identification fédérée sur app-erp-deploy, puis vous terminez la configuration, partagez la connexion avec les quatre projets et y faites pointer les pipelines. Les attributions de rôles existantes d'app-erp-deploy continuent de fonctionner.
      options:
        a: { en: "The conversion tool works only for connections that Azure DevOps created automatically and that a single project uses; sc-erp is manual and shared.", fr: "L'outil de conversion ne fonctionne que pour les connexions créées automatiquement par Azure DevOps et utilisées par un seul projet ; sc-erp est manuelle et partagée." }
        b: { en: "The automatic option needs the Owner role on the subscription and creates a new app registration instead of using app-erp-deploy.", fr: "L'option automatique exige le rôle Owner sur l'abonnement et crée une nouvelle inscription d'application au lieu d'utiliser app-erp-deploy." }
        d: { en: "Key Vault protects the secret, but the pipelines still authenticate with a stored secret, which the requirement forbids.", fr: "Key Vault protège le secret, mais les pipelines s'authentifient toujours avec un secret stocké, ce que l'exigence interdit." }
    references:
      - title: Use an Azure Resource Manager service connection - Azure Pipelines
        url: https://learn.microsoft.com/en-us/azure/devops/pipelines/library/connect-to-azure
      - title: Set a Resource Manager workload identity service connection - Azure Pipelines
        url: https://learn.microsoft.com/en-us/azure/devops/pipelines/release/configure-workload-identity

  # ------------------------------------------------------------------ 9
  - id: az400-qz-41-09
    objective: "4.1.2"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        Woodgrove Bank's repository **woodgrove/platform** contains a nightly workflow that runs on GitHub-hosted runners. The workflow deploys Bicep files to Azure with a client secret stored as a repository secret. It then opens issues in 30 other repositories of the woodgrove organization by using a personal access token (classic) of the platform lead.

        The security team sets the following requirements:

        - No long-lived credential for Azure is stored in GitHub.
        - The credential that opens the issues doesn't belong to a person, is limited to the Issues permission and expires within one hour.

        Which two actions should you perform? Each correct answer presents part of the solution.

        NOTE: Each correct selection is worth one point.
      fr: |
        Le dépôt **woodgrove/platform** de Woodgrove Bank contient un workflow nocturne qui s'exécute sur des exécuteurs hébergés par GitHub. Le workflow déploie des fichiers Bicep dans Azure avec un secret client stocké comme secret de dépôt. Il ouvre ensuite des issues dans 30 autres dépôts de l'organisation woodgrove avec un jeton d'accès personnel (classique) du responsable de la plateforme.

        L'équipe de sécurité fixe les exigences suivantes :

        - Aucune information d'identification durable pour Azure n'est stockée dans GitHub.
        - L'information d'identification qui ouvre les issues n'appartient à aucune personne, se limite à l'autorisation Issues et expire en moins d'une heure.

        Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "Add a federated credential for the workflow to the Azure identity, grant `id-token: write` and remove the client secret.", fr: "Ajouter à l'identité Azure une information d'identification fédérée pour le workflow, accorder `id-token: write` et supprimer le secret client." } }
        - { id: b, text: { en: "Replace the classic token with a fine-grained personal access token of the platform lead that has only the Issues permission.", fr: "Remplacer le jeton classique par un jeton d'accès personnel fine-grained du responsable de la plateforme qui n'a que l'autorisation Issues." } }
        - { id: c, text: { en: "Grant `issues: write` to GITHUB_TOKEN in the workflow and use GITHUB_TOKEN to open the issues.", fr: "Accorder `issues: write` à GITHUB_TOKEN dans le workflow et utiliser GITHUB_TOKEN pour ouvrir les issues." } }
        - { id: d, text: { en: "Install a GitHub App with the Issues permission on the organization and create an installation access token in the workflow.", fr: "Installer sur l'organisation une GitHub App avec l'autorisation Issues et créer un jeton d'accès d'installation dans le workflow." } }
        - { id: e, text: { en: "Enable the system-assigned managed identity of the runner and assign it a role on the subscription.", fr: "Activer l'identité managée attribuée par le système de l'exécuteur et lui attribuer un rôle sur l'abonnement." } }
        - { id: f, text: { en: "Replace the client secret with a certificate of the Azure identity stored as a repository secret.", fr: "Remplacer le secret client par un certificat de l'identité Azure stocké comme secret de dépôt." } }
    answer: { optionIds: [ a, d ] }
    explanation:
      correct:
        en: |
          With a federated credential and the `id-token: write` permission, azure/login exchanges the short-lived OIDC token of the job for a Microsoft Entra token, so no Azure credential is stored. A GitHub App isn't tied to a user, has only the permissions it was granted, and its installation access tokens are valid for one hour.
        fr: |
          Avec une information d'identification fédérée et l'autorisation `id-token: write`, azure/login échange le jeton OIDC de courte durée du job contre un jeton Microsoft Entra : aucune information d'identification Azure n'est stockée. Une GitHub App n'est liée à aucun utilisateur, n'a que les autorisations qui lui ont été accordées, et ses jetons d'accès d'installation sont valides une heure.
      options:
        b: { en: "A personal access token always acts as the user who created it, which the requirement forbids.", fr: "Un jeton d'accès personnel agit toujours au nom de l'utilisateur qui l'a créé, ce que l'exigence interdit." }
        c: { en: "GITHUB_TOKEN is limited to the repository that contains the workflow; it can't open issues in the 30 other repositories.", fr: "GITHUB_TOKEN est limité au dépôt qui contient le workflow ; il ne peut pas ouvrir d'issues dans les 30 autres dépôts." }
        e: { en: "A GitHub-hosted runner isn't an Azure resource of Woodgrove, so it has no managed identity to enable.", fr: "Un exécuteur hébergé par GitHub n'est pas une ressource Azure de Woodgrove : il n'a pas d'identité managée à activer." }
        f: { en: "A certificate stored as a secret is still a long-lived credential stored in GitHub.", fr: "Un certificat stocké comme secret reste une information d'identification durable stockée dans GitHub." }
    references:
      - title: Authenticate to Azure from GitHub Actions by OpenID Connect
        url: https://learn.microsoft.com/en-us/azure/developer/github/connect-from-azure-openid-connect
      - title: Identify supported Access Tokens - Training
        url: https://learn.microsoft.com/en-us/training/modules/automate-devops-github-apps/manage-tokens

  # ------------------------------------------------------------------ 10
  - id: az400-qz-41-10
    objective: "4.1.1"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        Tailspin deploys an Azure Container Apps app named **orders-api** and a key vault named **kv-orders** with a Bicep file, from a GitHub Actions workflow that runs on GitHub-hosted runners. A deployment can delete and recreate orders-api.

        The solution must meet the following requirements:

        - orders-api must be able to read the secrets of kv-orders as soon as it is created, at every deployment.
        - No secret or certificate is stored in GitHub.
        - The identity that the workflow uses must not be able to create role assignments.
        - Tailspin's tenant doesn't allow the creation of app registrations.

        Which two identities should you use? Each correct answer presents part of the solution.

        NOTE: Each correct selection is worth one point.
      fr: |
        Tailspin déploie une application Azure Container Apps nommée **orders-api** et un coffre de clés nommé **kv-orders** avec un fichier Bicep, depuis un workflow GitHub Actions qui s'exécute sur des exécuteurs hébergés par GitHub. Un déploiement peut supprimer puis recréer orders-api.

        La solution doit satisfaire les exigences suivantes :

        - orders-api doit pouvoir lire les secrets de kv-orders dès sa création, à chaque déploiement.
        - Aucun secret ni certificat n'est stocké dans GitHub.
        - L'identité utilisée par le workflow ne doit pas pouvoir créer d'attributions de rôles.
        - Le locataire de Tailspin n'autorise pas la création d'inscriptions d'application.

        Quelles sont les deux identités à utiliser ? Chaque bonne réponse présente une partie de la solution.

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "A user-assigned managed identity that has a federated credential for the workflow, used by azure/login", fr: "Une identité managée attribuée par l'utilisateur qui a une information d'identification fédérée pour le workflow, utilisée par azure/login" } }
        - { id: b, text: { en: "The system-assigned managed identity of orders-api, given the Key Vault Secrets User role by the Bicep file", fr: "L'identité managée attribuée par le système d'orders-api, qui reçoit le rôle Key Vault Secrets User par le fichier Bicep" } }
        - { id: c, text: { en: "A user-assigned managed identity attached to orders-api, given the Key Vault Secrets User role once in advance", fr: "Une identité managée attribuée par l'utilisateur attachée à orders-api, qui reçoit une fois à l'avance le rôle Key Vault Secrets User" } }
        - { id: d, text: { en: "An app registration that has a federated credential for the workflow, used by azure/login", fr: "Une inscription d'application qui a une information d'identification fédérée pour le workflow, utilisée par azure/login" } }
        - { id: e, text: { en: "A service principal whose certificate is stored as a GitHub environment secret, used by azure/login", fr: "Un principal de service dont le certificat est stocké comme secret d'environnement GitHub, utilisé par azure/login" } }
        - { id: f, text: { en: "The system-assigned managed identity of the GitHub-hosted runner, given the Contributor role on the resource group", fr: "L'identité managée attribuée par le système de l'exécuteur hébergé par GitHub, qui reçoit le rôle Contributor sur le groupe de ressources" } }
    answer: { optionIds: [ a, c ] }
    explanation:
      correct:
        en: |
          A user-assigned managed identity can carry a federated credential, so the workflow signs in without a secret and without an app registration. A second user-assigned identity, granted Key Vault Secrets User once before any deployment, survives the recreation of orders-api: the app can read kv-orders from its first start, and the workflow never needs to create a role assignment.
        fr: |
          Une identité managée attribuée par l'utilisateur peut porter une information d'identification fédérée : le workflow se connecte sans secret et sans inscription d'application. Une deuxième identité attribuée par l'utilisateur, qui reçoit Key Vault Secrets User une fois avant tout déploiement, survit à la recréation d'orders-api : l'application peut lire kv-orders dès son premier démarrage, et le workflow n'a jamais besoin de créer d'attribution de rôle.
      options:
        b: { en: "A system-assigned identity is created with the app, so its role assignment can't exist in advance and must be created by the deployment identity at every recreation.", fr: "Une identité attribuée par le système est créée avec l'application : son attribution de rôle ne peut pas exister à l'avance et doit être créée par l'identité de déploiement à chaque recréation." }
        d: { en: "The tenant doesn't allow app registrations.", fr: "Le locataire n'autorise pas les inscriptions d'application." }
        e: { en: "A certificate stored as a GitHub secret breaks the requirement that no secret or certificate is stored in GitHub.", fr: "Un certificat stocké comme secret GitHub enfreint l'exigence de ne stocker aucun secret ni certificat dans GitHub." }
        f: { en: "A GitHub-hosted runner isn't an Azure resource of Tailspin and has no managed identity.", fr: "Un exécuteur hébergé par GitHub n'est pas une ressource Azure de Tailspin et n'a pas d'identité managée." }
    references:
      - title: Best practice recommendations for managed system identities - Managed identities for Azure resources
        url: https://learn.microsoft.com/en-us/entra/identity/managed-identities-azure-resources/managed-identity-best-practice-recommendations
      - title: Workload Identity Federation - Microsoft Entra Workload ID
        url: https://learn.microsoft.com/en-us/entra/workload-id/workload-identity-federation
