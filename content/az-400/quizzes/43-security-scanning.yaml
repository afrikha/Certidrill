chapter: 43-security-scanning
questions:
  # ------------------------------------------------------------------ 1
  - id: az400-qz-43-01
    objective: "4.3.1"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Fabrikam stores Bicep templates in a GitHub repository. The security team wants each pull request to report misconfigurations in the templates, such as a storage account that allows public access, before anything is deployed.

        Which tool should you add to the pull request workflow?
      fr: |
        Fabrikam stocke des modèles Bicep dans un dépôt GitHub. L'équipe de sécurité veut que chaque pull request signale les erreurs de configuration des modèles, comme un compte de stockage qui autorise l'accès public, avant tout déploiement.

        Quel outil devez-vous ajouter au workflow des pull requests ?
    body:
      options:
        - { id: a, text: { en: "CodeQL code scanning with the default query suite", fr: "L'analyse du code CodeQL avec la suite de requêtes par défaut" } }
        - { id: b, text: { en: "Dependabot alerts for the repository's manifests", fr: "Les alertes Dependabot sur les manifestes du dépôt" } }
        - { id: c, text: { en: "Secret scanning with a custom pattern for Azure", fr: "L'analyse des secrets avec un modèle personnalisé pour Azure" } }
        - { id: d, text: { en: "The Microsoft Security DevOps action with IaC analyzers", fr: "L'action Microsoft Security DevOps avec les analyseurs IaC" } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          Infrastructure-as-code scanning finds misconfigured templates. The Microsoft Security DevOps action runs open-source analyzers in the workflow, including Template Analyzer and Checkov, which both scan Bicep, and its results can also be ingested by Defender for Cloud.
        fr: |
          L'analyse de l'infrastructure as code trouve les modèles mal configurés. L'action Microsoft Security DevOps exécute des analyseurs open source dans le workflow, dont Template Analyzer et Checkov, qui analysent tous deux Bicep, et ses résultats peuvent aussi être ingérés par Defender pour le cloud.
      options:
        a: { en: "CodeQL analyzes vulnerable patterns in application code of the languages it supports; Bicep isn't one of them.", fr: "CodeQL analyse les modèles vulnérables du code applicatif des langages qu'il prend en charge ; Bicep n'en fait pas partie." }
        b: { en: "Dependabot alerts report vulnerable open-source dependencies, not misconfigured resources.", fr: "Les alertes Dependabot signalent les dépendances open source vulnérables, pas les ressources mal configurées." }
        c: { en: "Secret scanning finds keys and tokens in commits; a storage account setting isn't a secret.", fr: "L'analyse des secrets trouve des clés et des jetons dans les commits ; un paramètre de compte de stockage n'est pas un secret." }
    references:
      - title: Configure the Microsoft Security DevOps GitHub Action
        url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/github-action

  # ------------------------------------------------------------------ 2
  - id: az400-qz-43-02
    objective: "4.3.6"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        You are a repository administrator of a private GitHub repository named **contoso/billing**. You plan to turn on Dependabot alerts for the repository.

        Which other feature must be enabled for the alerts to be raised?
      fr: |
        Vous êtes administrateur d'un dépôt GitHub privé nommé **contoso/billing**. Vous prévoyez d'activer les alertes Dependabot pour ce dépôt.

        Quelle autre fonctionnalité doit être activée pour que les alertes soient levées ?
    body:
      options:
        - { id: a, text: { en: "Dependabot version updates in .github/dependabot.yml", fr: "Les mises à jour de version Dependabot dans .github/dependabot.yml" } }
        - { id: b, text: { en: "The dependency graph of the repository", fr: "Le graphe des dépendances du dépôt" } }
        - { id: c, text: { en: "Code scanning with the default setup", fr: "L'analyse du code avec la configuration par défaut" } }
        - { id: d, text: { en: "Dependabot security updates of the repository", fr: "Les mises à jour de sécurité Dependabot du dépôt" } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          Dependabot alerts compare the dependencies listed by the dependency graph with the GitHub Advisory Database, so the dependency graph and Dependabot alerts must both be enabled. An alert is raised when a new advisory affects a dependency or when the dependency graph changes.
        fr: |
          Les alertes Dependabot comparent les dépendances listées par le graphe des dépendances avec la GitHub Advisory Database : le graphe des dépendances et les alertes Dependabot doivent donc être activés tous les deux. Une alerte est levée quand un nouvel avis concerne une dépendance ou quand le graphe des dépendances change.
      options:
        a: { en: "dependabot.yml configures version updates; alerts don't need it.", fr: "dependabot.yml configure les mises à jour de version ; les alertes n'en ont pas besoin." }
        c: { en: "Code scanning analyzes your own code with CodeQL; it plays no part in Dependabot alerts.", fr: "L'analyse du code analyse votre propre code avec CodeQL ; elle ne joue aucun rôle dans les alertes Dependabot." }
        d: { en: "Security updates depend on alerts, not the other way around: they open fix pull requests for alerts that already exist.", fr: "Les mises à jour de sécurité dépendent des alertes, et non l'inverse : elles ouvrent des pull requests de correction pour des alertes qui existent déjà." }
    references:
      - title: Dependabot alerts
        url: https://learn.microsoft.com/en-us/training/modules/configure-dependabot-security-updates-on-github-repo/3-dependabot-alerts

  # ------------------------------------------------------------------ 3
  - id: az400-qz-43-03
    objective: "4.3.5"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Tailspin Toys builds container images in a Jenkins pipeline. You plan to scan each image in the pipeline with the Defender for Cloud CLI by running `defender scan image`, and to query the results in Cloud Security Explorer.

        Which Microsoft Defender for Cloud plan must be enabled on the Azure subscription?
      fr: |
        Tailspin Toys génère des images conteneur dans un pipeline Jenkins. Vous prévoyez d'analyser chaque image dans le pipeline avec Defender for Cloud CLI en exécutant `defender scan image`, puis d'interroger les résultats dans Cloud Security Explorer.

        Quel plan de Microsoft Defender pour le cloud doit être activé sur l'abonnement Azure ?
    body:
      options:
        - { id: a, text: Defender CSPM }
        - { id: b, text: { en: "Foundational CSPM", fr: "CSPM de base (Foundational CSPM)" } }
        - { id: c, text: { en: "Defender for Containers", fr: "Defender pour les conteneurs" } }
        - { id: d, text: { en: "Defender for Servers Plan 2", fr: "Defender pour les serveurs Plan 2" } }
    answer: { optionId: a }
    explanation:
      correct:
        en: |
          The Defender for Cloud CLI requires a subscription with Defender CSPM enabled. It works with any CI/CD system, Jenkins included, authenticates with a token or a DevOps connector, and its container image results are ingested into Cloud Security Explorer, which is itself a Defender CSPM capability.
        fr: |
          Defender for Cloud CLI exige un abonnement où Defender CSPM est activé. Elle fonctionne avec n'importe quel système de CI/CD, Jenkins compris, s'authentifie par jeton ou par un connecteur DevOps, et ses résultats d'analyse d'images conteneur sont ingérés dans Cloud Security Explorer, qui est lui-même une fonctionnalité de Defender CSPM.
      options:
        b: { en: "Foundational CSPM is free but includes neither the CLI scanning nor Cloud Security Explorer.", fr: "Le CSPM de base est gratuit mais n'inclut ni l'analyse par la CLI ni Cloud Security Explorer." }
        c: { en: "Defender for Containers scans images in the registry and at runtime; it isn't the prerequisite of the CLI.", fr: "Defender pour les conteneurs analyse les images dans le registre et à l'exécution ; ce n'est pas le prérequis de la CLI." }
        d: { en: "Defender for Servers protects virtual machines; it plays no part in pipeline image scanning.", fr: "Defender pour les serveurs protège les machines virtuelles ; il ne joue aucun rôle dans l'analyse d'images d'un pipeline." }
    references:
      - title: CI/CD in pipeline-scanning with Defender for Cloud CLI
        url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/cli-cicd-integration

  # ------------------------------------------------------------------ 4
  - id: az400-qz-43-04
    objective: "4.3.4"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Adatum has an Azure DevOps organization connected to Microsoft Defender for Cloud, which provides foundational CSPM. The pipelines run the MicrosoftSecurityDevOps@1 task and publish the CodeAnalysisLogs artifact, and Defender for Cloud shows their infrastructure-as-code findings.

        The security team also needs Defender for Cloud recommendations about secrets exposed in the Azure Repos repositories. What should you do?
      fr: |
        Adatum dispose d'une organisation Azure DevOps connectée à Microsoft Defender pour le cloud, qui fournit le CSPM de base. Les pipelines exécutent la tâche MicrosoftSecurityDevOps@1 et publient l'artefact CodeAnalysisLogs, et Defender pour le cloud affiche leurs résultats d'infrastructure as code.

        L'équipe de sécurité a aussi besoin de recommandations de Defender pour le cloud sur les secrets exposés dans les dépôts Azure Repos. Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Enable GitHub Secret Protection for Azure DevOps on the repositories.", fr: "Activer GitHub Secret Protection for Azure DevOps sur les dépôts." } }
        - { id: b, text: { en: "Enable GitHub Code Security for Azure DevOps on the repositories.", fr: "Activer GitHub Code Security for Azure DevOps sur les dépôts." } }
        - { id: c, text: { en: "Add the CredScan analyzer to the MicrosoftSecurityDevOps@1 task.", fr: "Ajouter l'analyseur CredScan à la tâche MicrosoftSecurityDevOps@1." } }
        - { id: d, text: { en: "Enable the Defender CSPM plan on the Azure subscription.", fr: "Activer le plan Defender CSPM sur l'abonnement Azure." } }
    answer: { optionId: a }
    explanation:
      correct:
        en: |
          Exposed-secret recommendations for Azure DevOps come from GitHub Advanced Security for Azure DevOps secret scanning, which is part of GitHub Secret Protection for Azure DevOps. Once it's enabled, the connector ingests its findings, and these recommendations are already included in foundational CSPM.
        fr: |
          Les recommandations sur les secrets exposés pour Azure DevOps proviennent de l'analyse des secrets de GitHub Advanced Security for Azure DevOps, qui fait partie de GitHub Secret Protection for Azure DevOps. Une fois activée, le connecteur ingère ses résultats, et ces recommandations sont déjà incluses dans le CSPM de base.
      options:
        b: { en: "Code Security brings code scanning and dependency scanning, not secret scanning.", fr: "Code Security apporte l'analyse du code et l'analyse des dépendances, pas l'analyse des secrets." }
        c: { en: "The CredScan tool of the MSDO extension has been deprecated since 2023 and replaced by GitHub Advanced Security for Azure DevOps.", fr: "L'outil CredScan de l'extension MSDO est déprécié depuis 2023 et remplacé par GitHub Advanced Security for Azure DevOps." }
        d: { en: "Exposed-secret recommendations are available in foundational CSPM; without a secret scanner, Defender CSPM adds nothing to find them.", fr: "Les recommandations sur les secrets exposés sont disponibles dans le CSPM de base ; sans analyseur de secrets, Defender CSPM n'ajoute rien pour les trouver." }
    references:
      - title: Support and prerequisites - Microsoft Defender for Cloud
        url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/devops-support
      - title: Configure the Microsoft Security DevOps Azure DevOps Extension
        url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/azure-devops-extension

  # ------------------------------------------------------------------ 5
  - id: az400-qz-43-05
    objective: "4.3.4"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Two hours ago, Contoso completed the setup of the GitHub Advanced Security integration with Microsoft Defender for Cloud: the GitHub connector, GHAS licenses, Defender CSPM on the subscription and the required roles are in place. The images built from the repository **contoso/orders** have been scanned in Azure Container Registry and run in Azure Kubernetes Service.

        The developers don't see any runtime risk on the code scanning alerts of contoso/orders yet. What should you do?
      fr: |
        Il y a deux heures, Contoso a terminé la configuration de l'intégration de GitHub Advanced Security à Microsoft Defender pour le cloud : le connecteur GitHub, les licences GHAS, Defender CSPM sur l'abonnement et les rôles requis sont en place. Les images générées à partir du dépôt **contoso/orders** ont été analysées dans Azure Container Registry et s'exécutent dans Azure Kubernetes Service.

        Les développeurs ne voient encore aucun risque d'exécution sur les alertes d'analyse du code de contoso/orders. Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Delete and re-create the GitHub connector to force a new discovery of the repositories.", fr: "Supprimer puis recréer le connecteur GitHub pour forcer une nouvelle découverte des dépôts." } }
        - { id: b, text: { en: "Switch code scanning of contoso/orders from the default setup to an advanced setup.", fr: "Faire passer l'analyse du code de contoso/orders de la configuration par défaut à une configuration avancée." } }
        - { id: c, text: { en: "Wait, because the results can take up to 24 hours to appear after the setup.", fr: "Attendre, car les résultats peuvent mettre jusqu'à 24 heures à apparaître après la configuration." } }
        - { id: d, text: { en: "Assign the Security Reader role on the subscription to the developers of the repository.", fr: "Attribuer le rôle Security Reader sur l'abonnement aux développeurs du dépôt." } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          After the prerequisites and setup steps are in place, the runtime context computed by Defender CSPM can take up to 24 hours to reach the GHAS alerts. Nothing is missing in the described setup, so the right action is to wait before troubleshooting.
        fr: |
          Une fois les prérequis et les étapes de configuration en place, le contexte d'exécution calculé par Defender CSPM peut mettre jusqu'à 24 heures à parvenir aux alertes GHAS. Rien ne manque dans la configuration décrite : la bonne action est d'attendre avant de chercher une panne.
      options:
        a: { en: "The connector works; re-creating it restarts the discovery and doesn't make the results arrive sooner.", fr: "Le connecteur fonctionne ; le recréer relance la découverte et ne fait pas arriver les résultats plus tôt." }
        b: { en: "The integration doesn't depend on how code scanning is set up; both setups produce code scanning alerts.", fr: "L'intégration ne dépend pas de la façon dont l'analyse du code est configurée ; les deux configurations produisent des alertes d'analyse du code." }
        d: { en: "Developers see runtime risk in GitHub, on the alerts and in campaigns; an Azure role doesn't change what GitHub shows.", fr: "Les développeurs voient le risque d'exécution dans GitHub, sur les alertes et dans les campagnes ; un rôle Azure ne change pas ce que GitHub affiche." }
    references:
      - title: Deploy GitHub Advanced Security Integration with Microsoft Defender for Cloud
        url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/github-advanced-security-deploy

  # ------------------------------------------------------------------ 6
  - id: az400-qz-43-06
    objective: "4.3.3"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        Northwind Traders has an Azure DevOps project named **Web** that contains 40 Git repositories with C# and Java code. A Project Collection Administrator opens the Advanced Security settings of Web, selects **Enable all** for GitHub Code Security for Azure DevOps, and selects **Begin billing**. No other setting is changed.

        Which two statements are true?

        NOTE: Each correct selection is worth one point.
      fr: |
        Northwind Traders dispose d'un projet Azure DevOps nommé **Web** qui contient 40 dépôts Git avec du code C# et Java. Un Project Collection Administrator ouvre les paramètres Advanced Security de Web, sélectionne **Enable all** pour GitHub Code Security for Azure DevOps, puis sélectionne **Begin billing**. Aucun autre paramètre n'est modifié.

        Quelles sont les deux affirmations vraies ?

        Remarque : chaque sélection correcte vaut un point.
    body:
      options:
        - { id: a, text: { en: "A repository created in Web next month has Code Security enabled as soon as it's created, with no further action.", fr: "Un dépôt créé dans Web le mois prochain a Code Security activé dès sa création, sans autre action." } }
        - { id: b, text: { en: "The C# and Java repositories can use the code scanning default setup, which runs weekly without tasks added to their pipelines.", fr: "Les dépôts C# et Java peuvent utiliser la configuration par défaut de l'analyse du code, qui s'exécute chaque semaine sans tâche ajoutée à leurs pipelines." } }
        - { id: c, text: { en: "A user who isn't a Project Collection Administrator can change these settings if Advanced Security: manage settings is set to Allow.", fr: "Un utilisateur qui n'est pas Project Collection Administrator peut modifier ces paramètres si Advanced Security: manage settings est réglé sur Allow." } }
        - { id: d, text: { en: "The monthly bill is based on the number of repositories of Web on which the administrator enabled Code Security.", fr: "La facture mensuelle dépend du nombre de dépôts de Web sur lesquels l'administrateur a activé Code Security." } }
      choose: 2
    answer: { optionIds: [b, c] }
    explanation:
      correct:
        en: |
          Code scanning default setup detects the languages, including C# and Java, and runs on a weekly schedule without CodeQL tasks in the pipelines. Managing Advanced Security settings requires membership of Project Collection Administrators or the Advanced Security: manage settings permission set to Allow.
        fr: |
          La configuration par défaut de l'analyse du code détecte les langages, dont C# et Java, et s'exécute chaque semaine sans tâches CodeQL dans les pipelines. Gérer les paramètres Advanced Security exige d'être membre de Project Collection Administrators ou d'avoir l'autorisation Advanced Security: manage settings réglée sur Allow.
      options:
        a: { en: "Enable all covers only the existing repositories; new ones need the separate option that automatically enables Advanced Security for new repositories.", fr: "Enable all ne couvre que les dépôts existants ; les nouveaux exigent l'option distincte qui active automatiquement Advanced Security pour les nouveaux dépôts." }
        d: { en: "Advanced Security for Azure DevOps is billed per active committer, not per repository.", fr: "Advanced Security for Azure DevOps est facturé par committeur actif, pas par dépôt." }
    references:
      - title: Configure GitHub Advanced Security for Azure DevOps features
        url: https://learn.microsoft.com/en-us/azure/devops/repos/security/configure-github-advanced-security-features

  # ------------------------------------------------------------------ 7
  - id: az400-qz-43-07
    objective: "4.3.2"
    difficulty: 3
    status: draft
    type: dropdown
    stem:
      en: |
        Woodgrove Bank has a GitHub repository that has GitHub Code Security and stores Bicep templates in the **/infra** folder. The GitHub organization is connected to Microsoft Defender for Cloud.

        You need to add a workflow that meets the following requirements:

        - Run only the infrastructure-as-code analyzers of Microsoft Security DevOps on each pull request to main.
        - Show the findings as code scanning alerts in the **Security** tab of the repository.

        How should you complete the workflow? Select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Woodgrove Bank dispose d'un dépôt GitHub qui a GitHub Code Security et stocke des modèles Bicep dans le dossier **/infra**. L'organisation GitHub est connectée à Microsoft Defender pour le cloud.

        Vous devez ajouter un workflow qui répond aux exigences suivantes :

        - Exécuter uniquement les analyseurs d'infrastructure as code de Microsoft Security DevOps sur chaque pull request vers main.
        - Afficher les résultats comme alertes d'analyse du code dans l'onglet **Security** du dépôt.

        Comment devez-vous compléter le workflow ? Sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: code
      language: yaml
      template: |
        name: IaC scan
        on:
          pull_request:
            branches: [ main ]

        jobs:
          msdo:
            runs-on: ubuntu-latest
            permissions:
              contents: read
              id-token: write
              actions: read
              [[perm]]: write
            steps:
              - uses: actions/checkout@v6
              - name: Run Microsoft Security DevOps
                id: msdo
                uses: microsoft/security-devops-action@latest
                with:
                  categories: '[[cat]]'
              - name: Upload results
                uses: [[upload]]
                with:
                  sarif_file: ${{ steps.msdo.outputs.sarifFile }}
      slots:
        - id: perm
          options:
            - { id: checks, text: checks }
            - { id: pr, text: pull-requests }
            - { id: secevents, text: security-events }
            - { id: statuses, text: statuses }
        - id: cat
          options:
            - { id: code, text: code }
            - { id: artifacts, text: artifacts }
            - { id: iac, text: IaC }
            - { id: containers, text: containers }
        - id: upload
          options:
            - { id: analyze, text: github/codeql-action/analyze@v4 }
            - { id: sarif, text: github/codeql-action/upload-sarif@v4 }
            - { id: artifact, text: actions/upload-artifact@v4 }
    answer:
      values: { perm: secevents, cat: iac, upload: sarif }
    explanation:
      correct:
        en: |
          The `categories` input of the Microsoft Security DevOps action selects analyzer families among code, artifacts, IaC and containers; `IaC` runs tools such as Template Analyzer and Checkov, which scan Bicep. The action writes a SARIF file exposed by its `sarifFile` output, and `github/codeql-action/upload-sarif` uploads it to code scanning, which requires the `security-events: write` permission.
        fr: |
          L'entrée `categories` de l'action Microsoft Security DevOps choisit des familles d'analyseurs parmi code, artifacts, IaC et containers ; `IaC` exécute des outils comme Template Analyzer et Checkov, qui analysent Bicep. L'action écrit un fichier SARIF exposé par sa sortie `sarifFile`, et `github/codeql-action/upload-sarif` le charge dans l'analyse du code, ce qui exige l'autorisation `security-events: write`.
      options:
        perm: { en: "checks, pull-requests and statuses control check runs, pull request comments and commit statuses; none of them allows uploading code scanning results.", fr: "checks, pull-requests et statuses contrôlent les exécutions de vérification, les commentaires de pull request et les états de commit ; aucune ne permet de charger des résultats d'analyse du code." }
        upload: { en: "analyze finalizes a CodeQL database created by init, and upload-artifact stores the file as a workflow artifact without creating any alert.", fr: "analyze finalise une base de données CodeQL créée par init, et upload-artifact stocke le fichier comme artefact de workflow sans créer d'alerte." }
    references:
      - title: Configure the Microsoft Security DevOps GitHub Action
        url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/github-action

  # ------------------------------------------------------------------ 8
  - id: az400-qz-43-08
    objective: "4.3.6"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        The GitHub repository **proseware/web** has Dependabot alerts and Dependabot security updates enabled. It contains the following .github/dependabot.yml file.

        ```yaml
        version: 2
        updates:
          - package-ecosystem: "npm"
            directory: "/"
            schedule:
              interval: "weekly"
            open-pull-requests-limit: 3
            groups:
              dev-dependencies:
                dependency-type: "development"
        ```

        The workflow **ci.yml** runs on every pull request and installs private packages with the repository Actions secret **NPM_TOKEN**.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Le dépôt GitHub **proseware/web** a les alertes Dependabot et les mises à jour de sécurité Dependabot activées. Il contient le fichier .github/dependabot.yml suivant.

        ```yaml
        version: 2
        updates:
          - package-ecosystem: "npm"
            directory: "/"
            schedule:
              interval: "weekly"
            open-pull-requests-limit: 3
            groups:
              dev-dependencies:
                dependency-type: "development"
        ```

        Le workflow **ci.yml** s'exécute sur chaque pull request et installe des packages privés avec le secret Actions de dépôt **NPM_TOKEN**.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - { id: s1, text: { en: "Version updates of several development dependencies found in the same weekly check are proposed in a single pull request.", fr: "Les mises à jour de version de plusieurs dépendances de développement trouvées lors de la même vérification hebdomadaire sont proposées dans une seule pull request." } }
        - { id: s2, text: { en: "While three version update pull requests are open, Dependabot opens no security update pull request for a new advisory.", fr: "Tant que trois pull requests de mise à jour de version sont ouvertes, Dependabot n'ouvre aucune pull request de mise à jour de sécurité pour un nouvel avis." } }
        - { id: s3, text: { en: "When ci.yml runs on a pull request opened by Dependabot, the install step receives the value of NPM_TOKEN.", fr: "Quand ci.yml s'exécute sur une pull request ouverte par Dependabot, l'étape d'installation reçoit la valeur de NPM_TOKEN." } }
    answer:
      values: { s1: true, s2: false, s3: false }
    explanation:
      correct:
        en: |
          A group without `applies-to` applies to version updates, so the development dependencies due in the same check share one pull request. `open-pull-requests-limit` counts version update pull requests only; security updates have their own fixed limit of 10 open pull requests. Workflows triggered by Dependabot don't receive the repository's Actions secrets, so NPM_TOKEN is empty there.
        fr: |
          Un groupe sans `applies-to` s'applique aux mises à jour de version : les dépendances de développement dues lors de la même vérification partagent une pull request. `open-pull-requests-limit` ne compte que les pull requests de mise à jour de version ; les mises à jour de sécurité ont leur propre limite fixe de 10 pull requests ouvertes. Les workflows déclenchés par Dependabot ne reçoivent pas les secrets Actions du dépôt : NPM_TOKEN y est vide.
      options:
        s2: { en: "No: dependabot.yml options configure version updates; the security update limit can't be changed with open-pull-requests-limit.", fr: "Non : les options de dependabot.yml configurent les mises à jour de version ; la limite des mises à jour de sécurité ne se modifie pas avec open-pull-requests-limit." }
        s3: { en: "No: secrets are withheld from workflows triggered by Dependabot events, even when the pull request comes from a branch of the repository.", fr: "Non : les secrets ne sont pas fournis aux workflows déclenchés par des événements Dependabot, même quand la pull request provient d'une branche du dépôt." }
    references:
      - title: Dependabot security updates
        url: https://learn.microsoft.com/en-us/training/modules/configure-dependabot-security-updates-on-github-repo/4-dependabot-security-updates
      - title: Manage secrets in GitHub
        url: https://learn.microsoft.com/en-us/training/modules/implement-github-actions/6-manage-github-secrets

  # ------------------------------------------------------------------ 9
  - id: az400-qz-43-09
    objective: "4.3.1"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Litware has a private GitHub repository that has GitHub Code Security. The workflow **dependency-review.yml** runs `actions/dependency-review-action@v4` with `fail-on-severity: low` on every pull request to main. Developers ignore the failing check and merge anyway, and some merged pull requests added packages with critical vulnerabilities.

        The new company policy for pull requests to main is the following:

        - A pull request that adds a dependency with a critical vulnerability can't be merged. Vulnerabilities of lower severity don't block the merge.
        - A pull request that adds a package licensed under AGPL-3.0 can't be merged. Every other license is accepted.

        What should you do?
      fr: |
        Litware dispose d'un dépôt GitHub privé qui a GitHub Code Security. Le workflow **dependency-review.yml** exécute `actions/dependency-review-action@v4` avec `fail-on-severity: low` sur chaque pull request vers main. Les développeurs ignorent la vérification en échec et fusionnent quand même, et certaines pull requests fusionnées ont ajouté des packages présentant des vulnérabilités critiques.

        La nouvelle stratégie de l'entreprise pour les pull requests vers main est la suivante :

        - Une pull request qui ajoute une dépendance présentant une vulnérabilité critique ne peut pas être fusionnée. Les vulnérabilités de gravité inférieure ne bloquent pas la fusion.
        - Une pull request qui ajoute un package sous licence AGPL-3.0 ne peut pas être fusionnée. Toutes les autres licences sont acceptées.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Set `fail-on-severity: critical` and `allow-licenses: AGPL-3.0`, and make the dependency-review check required on main.", fr: "Définir `fail-on-severity: critical` et `allow-licenses: AGPL-3.0`, puis rendre la vérification dependency-review obligatoire sur main." } }
        - { id: b, text: { en: "Set `fail-on-severity: high` and `deny-licenses: AGPL-3.0`, and make the dependency-review check required on main.", fr: "Définir `fail-on-severity: high` et `deny-licenses: AGPL-3.0`, puis rendre la vérification dependency-review obligatoire sur main." } }
        - { id: c, text: { en: "Set `fail-on-severity: critical` and `deny-licenses: AGPL-3.0`, and make the dependency-review check required on main.", fr: "Définir `fail-on-severity: critical` et `deny-licenses: AGPL-3.0`, puis rendre la vérification dependency-review obligatoire sur main." } }
        - { id: d, text: { en: "Set `fail-on-severity: critical` and `deny-licenses: AGPL-3.0`, and set `comment-summary-in-pr: always` on the action.", fr: "Définir `fail-on-severity: critical` et `deny-licenses: AGPL-3.0`, puis définir `comment-summary-in-pr: always` sur l'action." } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          `fail-on-severity` fails the check only for vulnerabilities at or above the given level, so `critical` blocks critical vulnerabilities only. `deny-licenses` blocks the listed licenses and accepts all others. A failed check blocks a merge only when the dependency review check is required, for example in the **Require status checks to pass before merging** setting of a branch protection rule on main.
        fr: |
          `fail-on-severity` ne fait échouer la vérification que pour les vulnérabilités de niveau égal ou supérieur à celui indiqué : `critical` ne bloque donc que les vulnérabilités critiques. `deny-licenses` bloque les licences listées et accepte toutes les autres. Une vérification en échec ne bloque une fusion que si la vérification de révision des dépendances est obligatoire, par exemple dans le paramètre **Require status checks to pass before merging** d'une règle de protection de branche sur main.
      options:
        a: { en: "`allow-licenses` accepts only the listed licenses: this would block every package except those under AGPL-3.0.", fr: "`allow-licenses` n'accepte que les licences listées : cela bloquerait tous les packages sauf ceux sous AGPL-3.0." }
        b: { en: "`high` also fails the check for high-severity vulnerabilities, which the policy says mustn't block the merge.", fr: "`high` fait aussi échouer la vérification pour les vulnérabilités de gravité élevée, qui ne doivent pas bloquer la fusion selon la stratégie." }
        d: { en: "A summary comment informs reviewers but doesn't stop the merge: the check is still optional, as it is today.", fr: "Un commentaire de synthèse informe les relecteurs mais n'empêche pas la fusion : la vérification reste facultative, comme aujourd'hui." }
    references:
      - title: Dependency review
        url: https://learn.microsoft.com/en-us/training/modules/configure-dependabot-security-updates-on-github-repo/6-dependency-review

  # ------------------------------------------------------------------ 10
  - id: az400-qz-43-10
    objective: "4.3.2"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        Fabrikam has an Azure DevOps organization connected to Microsoft Defender for Cloud through a connector in the subscription **Sub1**. Sub1 has the foundational CSPM capabilities and the Defender for Containers plan. The Microsoft Security DevOps extension is installed in the organization but isn't used by any pipeline yet.

        YAML pipelines build container images with the Docker@2 task and push them to Azure Container Registry, and the images run in Azure Kubernetes Service. When a vulnerable image is found running in AKS, the security team must identify in Defender for Cloud the Azure DevOps repository and pipeline that built it.

        Which two actions should you perform? Each correct answer presents part of the solution.

        NOTE: Each correct selection is worth one point.
      fr: |
        Fabrikam dispose d'une organisation Azure DevOps connectée à Microsoft Defender pour le cloud par un connecteur dans l'abonnement **Sub1**. Sub1 a les fonctionnalités du CSPM de base et le plan Defender pour les conteneurs. L'extension Microsoft Security DevOps est installée dans l'organisation mais n'est encore utilisée par aucun pipeline.

        Des pipelines YAML génèrent des images conteneur avec la tâche Docker@2 et les poussent dans Azure Container Registry, et les images s'exécutent dans Azure Kubernetes Service. Quand une image vulnérable est trouvée en exécution dans AKS, l'équipe de sécurité doit identifier dans Defender pour le cloud le dépôt et le pipeline Azure DevOps qui l'ont générée.

        Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

        Remarque : chaque sélection correcte vaut un point.
    body:
      options:
        - { id: a, text: { en: "Enable the Defender CSPM plan on Sub1.", fr: "Activer le plan Defender CSPM sur Sub1." } }
        - { id: b, text: { en: "Enable GitHub Code Security for Azure DevOps on the repositories.", fr: "Activer GitHub Code Security for Azure DevOps sur les dépôts." } }
        - { id: c, text: { en: "Add the MicrosoftSecurityDevOps@1 task to the pipelines that build the images.", fr: "Ajouter la tâche MicrosoftSecurityDevOps@1 aux pipelines qui génèrent les images." } }
        - { id: d, text: { en: "Configure pull request annotations for the repositories in DevOps security.", fr: "Configurer les annotations de pull request pour les dépôts dans la sécurité DevOps." } }
        - { id: e, text: { en: "Enable agentless code scanning on the Azure DevOps connector.", fr: "Activer l'analyse du code sans agent sur le connecteur Azure DevOps." } }
      choose: 2
    answer: { optionIds: [a, c] }
    explanation:
      correct:
        en: |
          Mapping container images back to the code and pipeline that produced them is the code-to-cloud mapping for containers, a Defender CSPM capability that foundational CSPM and Defender for Containers don't provide. For Azure DevOps, its prerequisite is the Microsoft Security DevOps extension running in the pipelines that build the images, so the task must be added to them.
        fr: |
          Remonter des images conteneur jusqu'au code et au pipeline qui les ont produites est le mappage du code au cloud pour les conteneurs, une fonctionnalité de Defender CSPM que ni le CSPM de base ni Defender pour les conteneurs ne fournissent. Pour Azure DevOps, son prérequis est l'extension Microsoft Security DevOps exécutée dans les pipelines qui génèrent les images : la tâche doit donc leur être ajoutée.
      options:
        b: { en: "Code Security adds code and dependency findings to the repositories; it doesn't link images to the pipelines that built them.", fr: "Code Security ajoute des résultats de code et de dépendances aux dépôts ; il ne relie pas les images aux pipelines qui les ont générées." }
        d: { en: "Pull request annotations show findings in pull requests; they don't trace a running image back to its origin.", fr: "Les annotations de pull request affichent les résultats dans les pull requests ; elles ne remontent pas d'une image en exécution à son origine." }
        e: { en: "Agentless code scanning is in preview and isn't the prerequisite of container code-to-cloud mapping for Azure DevOps.", fr: "L'analyse du code sans agent est en préversion et n'est pas le prérequis du mappage du code au cloud des conteneurs pour Azure DevOps." }
    references:
      - title: Support and prerequisites - Microsoft Defender for Cloud
        url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/devops-support
