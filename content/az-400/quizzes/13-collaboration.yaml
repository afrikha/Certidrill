chapter: 13-collaboration
questions:
  # ------------------------------------------------------------------ 1
  - id: az400-qz-13-01
    objective: "1.3.1"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        The project wiki of Litware has a page named **Runbooks**. About 20 pages sit below Runbooks, and the team adds and removes some of them every month.

        The Runbooks page must always show a list of the pages below it, without anyone updating the list by hand. Which syntax should you add to the Markdown of the Runbooks page?
      fr: |
        Le wiki de projet de Litware contient une page nommée **Runbooks**. Une vingtaine de pages se trouvent sous Runbooks, et l'équipe en ajoute et en supprime chaque mois.

        La page Runbooks doit toujours afficher la liste des pages situées sous elle, sans que personne ne mette cette liste à jour à la main. Quelle syntaxe devez-vous ajouter au Markdown de la page Runbooks ?
    body:
      options:
        - { id: a, text: "`[[_TOC_]]`" }
        - { id: b, text: { en: "A `query-table` block with the ID of a work item query", fr: "Un bloc `query-table` avec l'ID d'une requête d'éléments de travail" } }
        - { id: c, text: "`[[_TOSP_]]`" }
        - { id: d, text: { en: "A `::: mermaid` block with a `graph TD` diagram", fr: "Un bloc `::: mermaid` avec un diagramme `graph TD`" } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          `[[_TOSP_]]` renders a table titled Child Pages with an entry for each subpage of the page, so the list follows the wiki structure as pages are added or removed. The tag is case sensitive, and only its first instance on a page is rendered.
        fr: |
          `[[_TOSP_]]` affiche un tableau intitulé Child Pages avec une entrée pour chaque sous-page de la page : la liste suit donc la structure du wiki quand des pages sont ajoutées ou supprimées. La balise est sensible à la casse, et seule sa première occurrence dans une page est affichée.
      options:
        a: { en: "`[[_TOC_]]` builds a table of contents from the headings of the page itself, not from its subpages.", fr: "`[[_TOC_]]` construit une table des matières à partir des titres de la page elle-même, pas de ses sous-pages." }
        b: { en: "A `query-table` block shows the live results of an Azure Boards query, which lists work items, not wiki pages.", fr: "Un bloc `query-table` affiche les résultats à jour d'une requête Azure Boards, qui liste des éléments de travail, pas des pages de wiki." }
        d: { en: "A Mermaid diagram is drawn from the text you write in the block; it doesn't read the wiki structure and would need manual updates.", fr: "Un diagramme Mermaid est dessiné à partir du texte écrit dans le bloc ; il ne lit pas la structure du wiki et devrait être mis à jour à la main." }
    references:
      - title: Use Markdown in Azure DevOps
        url: https://learn.microsoft.com/en-us/azure/devops/project/wiki/wiki-markdown-guidance

  # ------------------------------------------------------------------ 2
  - id: az400-qz-13-02
    objective: "1.3.6"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Contoso uses the GitHub app for Microsoft Teams. In a channel named **Invoicing**, a developer ran `@github subscribe contoso/invoicing`. The channel now receives notifications for issues, pull requests, commits and releases, but none for the GitHub Actions workflow runs of the repository.

        Which command should the developer run in the channel?
      fr: |
        Contoso utilise l'application GitHub pour Microsoft Teams. Dans un canal nommé **Invoicing**, un développeur a exécuté `@github subscribe contoso/invoicing`. Le canal reçoit désormais les notifications des issues, des pull requests, des commits et des releases, mais aucune pour les exécutions de workflows GitHub Actions du dépôt.

        Quelle commande le développeur doit-il exécuter dans le canal ?
    body:
      options:
        - { id: a, text: "`@github subscribe contoso/invoicing deployments`" }
        - { id: b, text: "`@github subscribe contoso/invoicing workflows`" }
        - { id: c, text: "`@github subscribe contoso/invoicing commits:*`" }
        - { id: d, text: "`@github subscribe contoso/invoicing reviews`" }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          A subscription without features enables the default set: issues, pull requests, commits, comments, deployments and releases. Workflow run notifications aren't in that set, so you enable them with the `workflows` feature, which can also be filtered by name, event, actor and branch.
        fr: |
          Un abonnement sans fonctionnalité précisée active l'ensemble par défaut : issues, pull requests, commits, commentaires, déploiements et releases. Les notifications d'exécution de workflow n'en font pas partie : vous les activez avec la fonctionnalité `workflows`, qui peut aussi être filtrée par nom, événement, acteur et branche.
      options:
        a: { en: "Deployments are already in the default features; they report deployment status, not workflow runs.", fr: "Les déploiements font déjà partie des fonctionnalités par défaut ; ils signalent l'état des déploiements, pas les exécutions de workflows." }
        c: { en: "`commits:*` extends commit notifications to every branch; it doesn't add workflow runs.", fr: "`commits:*` étend les notifications de commits à toutes les branches ; il n'ajoute pas les exécutions de workflows." }
        d: { en: "`reviews` adds pull request review notifications, not workflow runs.", fr: "`reviews` ajoute les notifications de revue des pull requests, pas les exécutions de workflows." }
    references:
      - title: Integrate GitHub and Azure DevOps with Microsoft Teams
        url: https://learn.microsoft.com/en-us/training/modules/share-knowledge-within-teams/4-integrate-github-azure-devops-microsoft-teams

  # ------------------------------------------------------------------ 3
  - id: az400-qz-13-03
    objective: "1.3.5"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Woodgrove Bank plans its work in an Azure DevOps project named **Lending**. Nora is a member of the Project Administrators group of Lending, but she didn't create the project. She is an owner of the GitHub organization **woodgrove-dev**.

        Nora opens **Project settings > GitHub connections** to connect repositories of woodgrove-dev to Lending by using the Azure Boards app, but she lacks the permissions to create the connection. The solution must follow the principle of least privilege.

        What should you do?
      fr: |
        Woodgrove Bank planifie son travail dans un projet Azure DevOps nommé **Lending**. Nora est membre du groupe Project Administrators de Lending, mais elle n'a pas créé le projet. Elle est propriétaire de l'organisation GitHub **woodgrove-dev**.

        Nora ouvre **Project settings > GitHub connections** pour connecter des dépôts de woodgrove-dev à Lending avec l'application Azure Boards, mais elle n'a pas les autorisations nécessaires pour créer la connexion. La solution doit respecter le principe du moindre privilège.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Add Nora to the Endpoint Administrators group of the Lending project.", fr: "Ajouter Nora au groupe Endpoint Administrators du projet Lending." } }
        - { id: b, text: { en: "Give Nora the Admin role on each repository of woodgrove-dev.", fr: "Donner à Nora le rôle Admin sur chaque dépôt de woodgrove-dev." } }
        - { id: c, text: { en: "Change the access level of Nora from Basic to Basic + Test Plans.", fr: "Faire passer le niveau d'accès de Nora de Basic à Basic + Test Plans." } }
        - { id: d, text: { en: "Add Nora to the Project Collection Administrators group of the organization.", fr: "Ajouter Nora au groupe Project Collection Administrators de l'organisation." } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          Connecting GitHub repositories to Azure Boards requires membership in the Project Collection Administrators group, unless you created the project, together with administrator or owner rights on the GitHub side. Nora already owns woodgrove-dev and is a project member, so the missing piece is Project Collection Administrators; Project Administrators isn't enough.
        fr: |
          Connecter des dépôts GitHub à Azure Boards exige l'appartenance au groupe Project Collection Administrators, sauf si vous avez créé le projet, ainsi que des droits d'administrateur ou de propriétaire côté GitHub. Nora est déjà propriétaire de woodgrove-dev et membre du projet : il lui manque donc Project Collection Administrators ; Project Administrators ne suffit pas.
      options:
        a: { en: "Endpoint Administrators manage service connections used by pipelines; this group doesn't allow creating GitHub connections for Azure Boards.", fr: "Endpoint Administrators gère les connexions de service utilisées par les pipelines ; ce groupe ne permet pas de créer des connexions GitHub pour Azure Boards." }
        b: { en: "As an owner of the organization, Nora already has administrator rights on its repositories: the missing permission is on the Azure DevOps side.", fr: "En tant que propriétaire de l'organisation, Nora a déjà les droits d'administrateur sur ses dépôts : l'autorisation manquante est côté Azure DevOps." }
        c: { en: "An access level unlocks product features such as Test Plans; it doesn't grant the administrative permission that the connection needs.", fr: "Un niveau d'accès débloque des fonctionnalités comme Test Plans ; il n'accorde pas l'autorisation d'administration dont la connexion a besoin." }
    references:
      - title: Connect Azure Boards to GitHub (cloud)
        url: https://learn.microsoft.com/en-us/azure/devops/boards/github/connect-to-github

  # ------------------------------------------------------------------ 4
  - id: az400-qz-13-04
    objective: "1.3.2"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Northwind Traders publishes the releases of a GitHub repository named **northwind/telemetry** with automatically generated release notes. The repository contains the following `.github/release.yml` file.

        ```yaml
        changelog:
          categories:
            - title: New features
              labels:
                - enhancement
            - title: Bug fixes
              labels:
                - bug
            - title: Other changes
              labels:
                - "*"
        ```

        The notes of the latest release list all 34 merged pull requests under **Other changes**. The developers start the titles of their pull requests with `feat:` or `fix:`, and they rarely add labels.

        You need the next generated notes to group the pull requests as intended, without editing the notes by hand. What should you do?
      fr: |
        Northwind Traders publie les releases d'un dépôt GitHub nommé **northwind/telemetry** avec des notes de publication générées automatiquement. Le dépôt contient le fichier `.github/release.yml` suivant.

        ```yaml
        changelog:
          categories:
            - title: New features
              labels:
                - enhancement
            - title: Bug fixes
              labels:
                - bug
            - title: Other changes
              labels:
                - "*"
        ```

        Les notes de la dernière release listent les 34 pull requests fusionnées sous **Other changes**. Les développeurs commencent les titres de leurs pull requests par `feat:` ou `fix:`, et ajoutent rarement des étiquettes.

        Vous devez faire en sorte que les prochaines notes générées regroupent les pull requests comme prévu, sans modifier les notes à la main. Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Replace the labels of the first two categories with the title prefixes `feat:` and `fix:`.", fr: "Remplacer les étiquettes des deux premières catégories par les préfixes de titre `feat:` et `fix:`." } }
        - { id: b, text: { en: "Move the **Other changes** category to the top of the `categories` list in the file.", fr: "Déplacer la catégorie **Other changes** en tête de la liste `categories` du fichier." } }
        - { id: c, text: { en: "Require the `enhancement` or `bug` label on each pull request, with a check that blocks the merge.", fr: "Exiger l'étiquette `enhancement` ou `bug` sur chaque pull request, avec une vérification qui bloque la fusion." } }
        - { id: d, text: { en: "Create each release with `gh release create --notes-start-tag` and the previous tag.", fr: "Créer chaque release avec `gh release create --notes-start-tag` et la balise précédente." } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          Generated release notes list the merged pull requests and place each one in the first category whose labels it carries; `"*"` catches the pull requests that matched no earlier category. Unlabeled pull requests therefore all land in Other changes. Labeling the pull requests consistently, enforced by a required check, fixes the grouping without changing `release.yml`.
        fr: |
          Les notes de publication générées listent les pull requests fusionnées et placent chacune dans la première catégorie dont elle porte les étiquettes ; `"*"` attrape les pull requests qui ne correspondent à aucune catégorie précédente. Les pull requests sans étiquette atterrissent donc toutes dans Other changes. Étiqueter les pull requests de façon cohérente, avec une vérification obligatoire, corrige le regroupement sans modifier `release.yml`.
      options:
        a: { en: "Categories match pull request labels only; a title prefix written under `labels` would be read as a label name that no pull request carries.", fr: "Les catégories ne correspondent qu'aux étiquettes des pull requests ; un préfixe de titre écrit sous `labels` serait lu comme un nom d'étiquette qu'aucune pull request ne porte." }
        b: { en: "The wildcard category catches the pull requests that no earlier category matched; at the top, it would catch every pull request.", fr: "La catégorie générique attrape les pull requests qu'aucune catégorie précédente n'a retenues ; en tête, elle les attraperait toutes." }
        d: { en: "`--notes-start-tag` only sets the starting point of the range of changes; it doesn't change how pull requests are grouped.", fr: "`--notes-start-tag` fixe seulement le point de départ de la plage de modifications ; il ne change pas le regroupement des pull requests." }
    references:
      - title: Automate release notes with GitHub
        url: https://learn.microsoft.com/en-us/training/modules/manage-git-repositories/9-automate-release-notes-github

  # ------------------------------------------------------------------ 5
  - id: az400-qz-13-05
    objective: "1.3.1"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Tailspin Toys publishes the **/handbook** folder of an Azure Repos Git repository as a code wiki. A technical writer works in Visual Studio Code and adds pages by committing Markdown files to /handbook.

        The writer must add a page whose title appears in the wiki as **Q3: Pre-release checklist**. Which file name should the writer use?
      fr: |
        Tailspin Toys publie le dossier **/handbook** d'un dépôt Git Azure Repos en tant que wiki de code. Une rédactrice technique travaille dans Visual Studio Code et ajoute des pages en validant des fichiers Markdown dans /handbook.

        La rédactrice doit ajouter une page dont le titre s'affiche dans le wiki sous la forme **Q3: Pre-release checklist**. Quel nom de fichier doit-elle utiliser ?
    body:
      options:
        - { id: a, text: "`Q3%3A-Pre-release-checklist.md`" }
        - { id: b, text: "`Q3:-Pre-release-checklist.md`" }
        - { id: c, text: "`Q3%3A%20Pre%2Drelease%20checklist.md`" }
        - { id: d, text: "`Q3%3A-Pre%2Drelease-checklist.md`" }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          In the Git repository of a wiki, a hyphen in a file name stands for a space in the page title. A real hyphen must therefore be encoded `%2D`, and the colon, which can't appear as is, is encoded `%3A`. The file `Q3%3A-Pre%2Drelease-checklist.md` produces the title Q3: Pre-release checklist.
        fr: |
          Dans le dépôt Git d'un wiki, un trait d'union dans un nom de fichier représente une espace dans le titre de la page. Un vrai trait d'union doit donc être encodé `%2D`, et les deux-points, qui ne peuvent pas figurer tels quels, sont encodés `%3A`. Le fichier `Q3%3A-Pre%2Drelease-checklist.md` produit le titre Q3: Pre-release checklist.
      options:
        a: { en: "The hyphen of Pre-release isn't encoded, so it becomes a space: the title would read Q3: Pre release checklist.", fr: "Le trait d'union de Pre-release n'est pas encodé : il devient une espace et le titre serait Q3: Pre release checklist." }
        b: { en: "The colon is a special character that must be encoded `%3A` in the file name, and the hyphen of Pre-release would become a space.", fr: "Les deux-points sont un caractère spécial qui doit être encodé `%3A` dans le nom de fichier, et le trait d'union de Pre-release deviendrait une espace." }
        c: { en: "Spaces are written as hyphens in wiki file names; Learn advises against space characters, encoded or not, in page file names.", fr: "Les espaces s'écrivent avec des traits d'union dans les noms de fichiers du wiki ; Learn déconseille le caractère espace, encodé ou non, dans les noms de fichiers des pages." }
    references:
      - title: Wiki file and folder structure in Git
        url: https://learn.microsoft.com/en-us/azure/devops/project/wiki/wiki-file-structure

  # ------------------------------------------------------------------ 6
  - id: az400-qz-13-06
    objective: "1.3.4"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        Fabrikam has an Azure DevOps project named **Payments**. Its security team runs an incident platform whose endpoint, `incidents.fabrikam.com/api/devops`, accepts HTTP and HTTPS requests and supports basic authentication.

        Kenji is a member of the Contributors group of Payments and was granted the **Edit subscriptions** and **View subscriptions** permissions. He created a service hook subscription with the following settings:

        | Setting | Value |
        | --- | --- |
        | Service | Web Hooks |
        | Event | Work item created, area path `Payments\Fraud` |
        | URL | `http://incidents.fabrikam.com/api/devops` |
        | Basic authentication | Not configured |
        | Resource details to send | All |

        The **Test** step of the wizard succeeded. However, no notification has reached the platform, although several work items were created in `Payments\Fraud` since then. Kenji can't view the work items of the `Payments\Fraud` area path.

        You need to meet the following requirements:

        - The platform is notified of each work item created in `Payments\Fraud`.
        - The payload doesn't carry the field values of the work item; the platform reads them back with its own identity.
        - Credentials and payloads never travel unencrypted.

        Which three actions should you perform? Each correct answer presents part of the solution.

        NOTE: Each correct selection is worth one point.
      fr: |
        Fabrikam dispose d'un projet Azure DevOps nommé **Payments**. Son équipe de sécurité exploite une plateforme d'incidents dont le point de terminaison, `incidents.fabrikam.com/api/devops`, accepte les requêtes HTTP et HTTPS et prend en charge l'authentification de base.

        Kenji est membre du groupe Contributors de Payments et a reçu les autorisations **Edit subscriptions** et **View subscriptions**. Il a créé un abonnement de crochet de service avec les paramètres suivants :

        | Paramètre | Valeur |
        | --- | --- |
        | Service | Web Hooks |
        | Événement | Work item created, chemin de zone `Payments\Fraud` |
        | URL | `http://incidents.fabrikam.com/api/devops` |
        | Authentification de base | Non configurée |
        | Resource details to send | All |

        L'étape **Test** de l'assistant a réussi. Pourtant, aucune notification n'est parvenue à la plateforme, alors que plusieurs éléments de travail ont été créés dans `Payments\Fraud` depuis. Kenji ne peut pas consulter les éléments de travail du chemin de zone `Payments\Fraud`.

        Vous devez répondre aux exigences suivantes :

        - La plateforme est avertie de chaque élément de travail créé dans `Payments\Fraud`.
        - La charge utile ne transporte pas les valeurs des champs de l'élément de travail ; la plateforme les relit avec sa propre identité.
        - Les informations d'identification et les charges utiles ne circulent jamais en clair.

        Quelles sont les trois actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 3
      options:
        - { id: a, text: { en: "Re-create the subscription with an account that can view the work items of `Payments\\Fraud`.", fr: "Recréer l'abonnement avec un compte qui peut consulter les éléments de travail de `Payments\\Fraud`." } }
        - { id: b, text: { en: "Allow the inbound IP ranges of Azure DevOps on the firewall of the incident platform.", fr: "Autoriser les plages d'adresses IP entrantes d'Azure DevOps sur le pare-feu de la plateforme d'incidents." } }
        - { id: c, text: { en: "Set **Resource details to send** to **Minimal** in the action of the subscription.", fr: "Définir **Resource details to send** sur **Minimal** dans l'action de l'abonnement." } }
        - { id: d, text: { en: "Create an Incoming WebHook service connection that targets the URL of the platform.", fr: "Créer une connexion de service Incoming WebHook qui cible l'URL de la plateforme." } }
        - { id: e, text: { en: "Change the URL to `https://` and enter basic authentication credentials in the action.", fr: "Passer l'URL en `https://` et saisir des informations d'identification d'authentification de base dans l'action." } }
        - { id: f, text: { en: "Change the event of the subscription to **Work item updated** for the same area path.", fr: "Remplacer l'événement de l'abonnement par **Work item updated** pour le même chemin de zone." } }
    answer: { optionIds: [a, c, e] }
    explanation:
      correct:
        en: |
          A subscription set up on a resource that its creator can't access doesn't get triggered, which is why the test succeeds but real events in `Payments\Fraud` send nothing: the subscription must belong to a user who can view those work items. **Minimal** sends only key fields such as the ID and URL, so the platform calls back into Azure DevOps with its own permissions, as Microsoft recommends. Basic authentication must be used over HTTPS, which also encrypts the payload.
        fr: |
          Un abonnement configuré sur une ressource à laquelle son créateur n'a pas accès n'est pas déclenché : c'est pourquoi le test réussit alors que les vrais événements de `Payments\Fraud` n'envoient rien ; l'abonnement doit appartenir à un utilisateur qui peut consulter ces éléments de travail. **Minimal** n'envoie que des champs clés comme l'ID et l'URL : la plateforme rappelle donc Azure DevOps avec ses propres autorisations, comme Microsoft le recommande. L'authentification de base doit être utilisée sur HTTPS, qui chiffre aussi la charge utile.
      options:
        b: { en: "The Test step already reached the endpoint, so the network path is open; the missing notifications come from the creator's lack of access.", fr: "L'étape Test a déjà atteint le point de terminaison : le chemin réseau est ouvert ; les notifications manquantes viennent du manque d'accès du créateur." }
        d: { en: "An Incoming WebHook service connection lets an external service trigger a pipeline; it doesn't send Azure DevOps events to an endpoint.", fr: "Une connexion de service Incoming WebHook permet à un service externe de déclencher un pipeline ; elle n'envoie pas d'événements Azure DevOps vers un point de terminaison." }
        f: { en: "The requirement is about created work items; changing the event doesn't fix the missing access and would send updates instead.", fr: "L'exigence porte sur les éléments de travail créés ; changer d'événement ne corrige pas l'accès manquant et enverrait des mises à jour à la place." }
    references:
      - title: Integrate with service hooks
        url: https://learn.microsoft.com/en-us/azure/devops/service-hooks/overview
      - title: Webhooks
        url: https://learn.microsoft.com/en-us/azure/devops/service-hooks/services/webhooks

  # ------------------------------------------------------------------ 7
  - id: az400-qz-13-07
    objective: "1.3.2"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Proseware, Inc. develops an ASP.NET Core minimal API on .NET 10. `Program.cs` calls `AddOpenApi()`, and calls `MapOpenApi()` only when the app runs in the Development environment. The production app must not expose its OpenAPI document.

        For each release, a YAML pipeline builds the API. The pipeline must import into Azure API Management the OpenAPI description of exactly the code it built, so that the developer portal documents the right version. The description must be produced during the build, before any deployment and without starting the app. The solution must minimize development effort.

        What should you do?
      fr: |
        Proseware, Inc. développe une API minimale ASP.NET Core sur .NET 10. `Program.cs` appelle `AddOpenApi()`, et n'appelle `MapOpenApi()` que lorsque l'application s'exécute dans l'environnement Development. L'application de production ne doit pas exposer son document OpenAPI.

        Pour chaque mise en production, un pipeline YAML construit l'API. Le pipeline doit importer dans Azure API Management la description OpenAPI exactement du code qu'il a construit, afin que le portail des développeurs documente la bonne version. La description doit être produite pendant le build, avant tout déploiement et sans démarrer l'application. La solution doit réduire au minimum l'effort de développement.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Call `MapOpenApi()` in every environment, and have the pipeline download `/openapi/v1.json` after the deployment.", fr: "Appeler `MapOpenApi()` dans tous les environnements, et faire télécharger `/openapi/v1.json` par le pipeline après le déploiement." } }
        - { id: b, text: { en: "Add the `Microsoft.Extensions.ApiDescription.Server` package, and publish the document that the build writes.", fr: "Ajouter le package `Microsoft.Extensions.ApiDescription.Server`, et publier le document que le build écrit." } }
        - { id: c, text: { en: "Add a Swagger UI or Scalar package, and publish the interactive page that it renders to the developer portal.", fr: "Ajouter un package Swagger UI ou Scalar, et publier dans le portail des développeurs la page interactive qu'il affiche." } }
        - { id: d, text: { en: "Keep an `openapi.yaml` file in the repository, updated by developers in each pull request that changes an endpoint.", fr: "Conserver un fichier `openapi.yaml` dans le dépôt, mis à jour par les développeurs dans chaque pull request qui modifie un point de terminaison." } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          `Microsoft.AspNetCore.OpenApi` generates the document at run time, while adding `Microsoft.Extensions.ApiDescription.Server` generates it during the build and writes it to the output directory. The pipeline can then publish this file as an artifact and import it into API Management, so the description matches the built code, without running the app or exposing the endpoint in production.
        fr: |
          `Microsoft.AspNetCore.OpenApi` génère le document à l'exécution, tandis que l'ajout de `Microsoft.Extensions.ApiDescription.Server` le génère pendant le build et l'écrit dans le répertoire de sortie. Le pipeline peut alors publier ce fichier comme artefact et l'importer dans API Management : la description correspond au code construit, sans exécuter l'application ni exposer le point de terminaison en production.
      options:
        a: { en: "The production app would expose its OpenAPI document, and the description would only exist after a deployment.", fr: "L'application de production exposerait son document OpenAPI, et la description n'existerait qu'après un déploiement." }
        c: { en: "ASP.NET Core generates documents only; an interactive UI renders an existing document at run time and doesn't produce one during the build.", fr: "ASP.NET Core ne génère que des documents ; une interface interactive affiche un document existant à l'exécution et n'en produit pas pendant le build." }
        d: { en: "A hand-written file is extra effort and can drift from the code, so it doesn't guarantee a description of exactly the built code.", fr: "Un fichier écrit à la main ajoute de l'effort et peut s'écarter du code : il ne garantit pas une description exacte du code construit." }
    references:
      - title: Generate OpenAPI documents
        url: https://learn.microsoft.com/en-us/aspnet/core/fundamentals/openapi/aspnetcore-openapi

  # ------------------------------------------------------------------ 8
  - id: az400-qz-13-08
    objective: "1.3.5"
    difficulty: 3
    status: draft
    type: dragdrop
    stem:
      en: |
        Contoso, Ltd. plans its work in an Azure DevOps project named **Field**. Several repositories of the GitHub organization **contoso-field** are connected to Field by using the Azure Boards app. You are a member of Project Collection Administrators and an owner of the GitHub organizations involved.

        Four situations are listed in the answer area. Each must be resolved with the least administrative effort.

        Which action should you perform for each situation? To answer, drag the appropriate actions to the correct situations. Each action may be used once or not at all.

        NOTE: Each correct selection is worth one point.
      fr: |
        Contoso, Ltd. planifie son travail dans un projet Azure DevOps nommé **Field**. Plusieurs dépôts de l'organisation GitHub **contoso-field** sont connectés à Field avec l'application Azure Boards. Vous êtes membre de Project Collection Administrators et propriétaire des organisations GitHub concernées.

        Quatre situations figurent dans la zone de réponse. Chacune doit être résolue avec un minimum d'effort administratif.

        Quelle action devez-vous effectuer pour chaque situation ? Pour répondre, faites glisser les actions appropriées vers les situations correspondantes. Chaque action peut être utilisée une fois ou pas du tout.

        Remarque : chaque sélection correcte vaut un point.
    body:
      reuse: false
      items:
        - { id: repoaccess, text: { en: "In GitHub, configure the installed Azure Boards app and update its Repository access", fr: "Dans GitHub, configurer l'application Azure Boards installée et mettre à jour son Repository access" } }
        - { id: newconn, text: { en: "In Project settings > GitHub connections, add a new connection", fr: "Dans Project settings > GitHub connections, ajouter une nouvelle connexion" } }
        - { id: areasec, text: { en: "In the security of the area path, allow the Azure Boards identity to view and edit work items", fr: "Dans la sécurité du chemin de zone, autoriser l'identité Azure Boards à consulter et modifier les éléments de travail" } }
        - { id: reconnect, text: { en: "Remove the repository from its connection, then connect it again through the Azure Boards app", fr: "Retirer le dépôt de sa connexion, puis le connecter de nouveau via l'application Azure Boards" } }
        - { id: svcconn, text: { en: "In Project settings > Service connections, create a GitHub service connection", fr: "Dans Project settings > Service connections, créer une connexion de service GitHub" } }
        - { id: webhook, text: { en: "In the repository settings, add a webhook that targets the work events endpoint of Azure DevOps", fr: "Dans les paramètres du dépôt, ajouter un webhook qui cible le point de terminaison des événements de travail d'Azure DevOps" } }
      targets:
        - id: missing
          text: { en: "The app was installed on contoso-field with access to three chosen repositories. The repository mobile-app doesn't appear when you add repositories to the connection.", fr: "L'application a été installée sur contoso-field avec un accès à trois dépôts choisis. Le dépôt mobile-app n'apparaît pas quand vous ajoutez des dépôts à la connexion." }
        - id: otherorg
          text: { en: "Repositories of a second GitHub.com organization, contoso-labs, must be linked to work items of Field.", fr: "Des dépôts d'une seconde organisation GitHub.com, contoso-labs, doivent être liés aux éléments de travail de Field." }
        - id: area
          text: { en: "AB# mentions in a connected repository create links for work items of every area path except Field\\Payroll.", fr: "Les mentions AB# d'un dépôt connecté créent des liens pour les éléments de travail de tous les chemins de zone sauf Field\\Payroll." }
        - id: pat
          text: { en: "The repository legacy-api is connected through a personal access token, and its pull requests must show the Azure Boards status check.", fr: "Le dépôt legacy-api est connecté avec un jeton d'accès personnel, et ses pull requests doivent afficher la vérification d'état Azure Boards." }
    answer:
      mapping: { missing: repoaccess, otherorg: newconn, area: areasec, pat: reconnect }
    explanation:
      correct:
        en: |
          With **Only select repositories**, a repository missing from the list must be added under Repository access of the installed app in GitHub. Repositories of another GitHub organization need a separate connection. When `AB#` links fail for one area path only, the Azure Boards identity needs View and Edit work items in this node on that area path. Pull request status checks require a GitHub App connection, and a repository connected with another authentication type must be removed from that connection before it is reconnected through the app.
        fr: |
          Avec **Only select repositories**, un dépôt absent de la liste doit être ajouté sous Repository access de l'application installée dans GitHub. Les dépôts d'une autre organisation GitHub exigent une connexion distincte. Quand les liens `AB#` échouent pour un seul chemin de zone, l'identité Azure Boards a besoin de View et Edit work items in this node sur ce chemin de zone. Les vérifications d'état des pull requests exigent une connexion par GitHub App, et un dépôt connecté avec un autre type d'authentification doit être retiré de cette connexion avant d'être reconnecté via l'application.
      options:
        svcconn: { en: "A GitHub service connection lets pipelines access GitHub; it plays no part in the Azure Boards integration.", fr: "Une connexion de service GitHub permet aux pipelines d'accéder à GitHub ; elle ne joue aucun rôle dans l'intégration à Azure Boards." }
        webhook: { en: "Updating the webhook URL by hand is a repair step for GitHub Enterprise Server connections after a migration, not for these situations.", fr: "La mise à jour manuelle de l'URL du webhook est une réparation des connexions GitHub Enterprise Server après une migration, pas une solution à ces situations." }
    references:
      - title: Connect Azure Boards to GitHub (cloud)
        url: https://learn.microsoft.com/en-us/azure/devops/boards/github/connect-to-github
      - title: Install the Azure Boards app for GitHub
        url: https://learn.microsoft.com/en-us/azure/devops/boards/github/install-github-app

  # ------------------------------------------------------------------ 9
  - id: az400-qz-13-09
    objective: "1.3.3"
    difficulty: 3
    status: draft
    type: dropdown
    stem:
      en: |
        Litware, Inc. publishes the releases of a GitHub repository from the following GitHub Actions workflow. All changes reach `main` through pull requests merged with merge commits, and developers regularly merge `main` into their feature branches to resolve conflicts.

        The workflow must meet the following requirements:

        - The release notes contain one line per pull request merged into `main` since the previous version tag (the merge commit of the pull request) and no line for the individual commits of the pull request branches.
        - The release uses the notes built by the script.
        - The `GITHUB_TOKEN` has the least permissions that the workflow needs.
        - The script works whatever the number of commits between two versions.

        How should you complete the workflow? Select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Litware, Inc. publie les releases d'un dépôt GitHub avec le workflow GitHub Actions suivant. Toutes les modifications arrivent dans `main` par des pull requests fusionnées avec des commits de fusion, et les développeurs fusionnent régulièrement `main` dans leurs branches de fonctionnalité pour résoudre les conflits.

        Le workflow doit répondre aux exigences suivantes :

        - Les notes de publication contiennent une ligne par pull request fusionnée dans `main` depuis la balise de version précédente (le commit de fusion de la pull request) et aucune ligne pour les commits individuels des branches des pull requests.
        - La release utilise les notes construites par le script.
        - Le `GITHUB_TOKEN` dispose des autorisations minimales dont le workflow a besoin.
        - Le script fonctionne quel que soit le nombre de commits entre deux versions.

        Comment devez-vous compléter le workflow ? Sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: code
      language: yaml
      template: |
        on:
          push:
            tags: ["v*"]
        permissions:
          contents: [[perm]]
        jobs:
          release:
            runs-on: ubuntu-latest
            steps:
              - uses: actions/checkout@v7
                with:
                  fetch-depth: [[depth]]
              - name: Build release notes from the Git history
                run: |
                  PREVIOUS=$(git describe --tags --abbrev=0 "$GITHUB_REF_NAME^")
                  git log "$PREVIOUS..$GITHUB_REF_NAME" [[filter]] --pretty=format:"- %s (%h)" > notes.md
                  gh release create "$GITHUB_REF_NAME" [[notes]] notes.md --verify-tag
                env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      slots:
        - id: perm
          options:
            - { id: none, text: none }
            - { id: read, text: read }
            - { id: write, text: write }
        - id: depth
          options:
            - { id: d0, text: "0" }
            - { id: d1, text: "1" }
            - { id: d2, text: "2" }
        - id: filter
          options:
            - { id: nomerges, text: "--no-merges" }
            - { id: merges, text: "--merges" }
            - { id: firstparent, text: "--first-parent" }
            - { id: all, text: "--all" }
        - id: notes
          options:
            - { id: generate, text: "--generate-notes" }
            - { id: notesfile, text: "--notes-file" }
            - { id: notestext, text: "--notes" }
            - { id: starttag, text: "--notes-start-tag" }
    answer:
      values: { perm: write, depth: d0, filter: firstparent, notes: notesfile }
    explanation:
      correct:
        en: |
          Creating a release requires the Contents write permission, and nothing else in the workflow needs more. `actions/checkout` fetches one commit by default; `fetch-depth: 0` fetches all history for all branches and tags, so `git describe` finds the previous tag and the range is complete. `--first-parent` follows only the first parent of each merge, so on `main` it lists one merge commit per pull request. `--notes-file notes.md` reads the release notes from the file the script wrote.
        fr: |
          Créer une release exige l'autorisation Contents en écriture, et rien d'autre dans le workflow n'en demande davantage. `actions/checkout` ne récupère qu'un commit par défaut ; `fetch-depth: 0` récupère tout l'historique de toutes les branches et balises : `git describe` trouve donc la balise précédente et la plage est complète. `--first-parent` ne suit que le premier parent de chaque fusion : sur `main`, il liste un commit de fusion par pull request. `--notes-file notes.md` lit les notes de publication dans le fichier écrit par le script.
      options:
        read: { en: "With read access only, `gh release create` is rejected, because creating a release writes to the repository contents.", fr: "Avec un accès en lecture seule, `gh release create` est refusé, car créer une release écrit dans le contenu du dépôt." }
        d1: { en: "A depth of 1 fetches only the tagged commit, so the previous tag and the range can't be resolved.", fr: "Une profondeur de 1 ne récupère que le commit balisé : la balise précédente et la plage ne peuvent pas être résolues." }
        d2: { en: "A fixed depth works only when the previous tag is close enough; the script must work for any number of commits.", fr: "Une profondeur fixe ne fonctionne que si la balise précédente est assez proche ; le script doit fonctionner pour n'importe quel nombre de commits." }
        nomerges: { en: "`--no-merges` does the opposite: it drops the merge commits and lists the individual commits of the branches.", fr: "`--no-merges` fait l'inverse : il retire les commits de fusion et liste les commits individuels des branches." }
        merges: { en: "`--merges` also lists the merges of `main` into feature branches, which are reachable from the tag but aren't pull requests.", fr: "`--merges` liste aussi les fusions de `main` dans les branches de fonctionnalité, accessibles depuis la balise mais qui ne sont pas des pull requests." }
        generate: { en: "`--generate-notes` asks GitHub to build the notes from the pull requests, and `notes.md` would then be uploaded as a release asset.", fr: "`--generate-notes` demande à GitHub de construire les notes à partir des pull requests, et `notes.md` serait alors chargé comme ressource de la release." }
        notestext: { en: "`--notes` takes the notes text itself, so the release notes would be the string notes.md.", fr: "`--notes` prend le texte des notes lui-même : les notes de publication seraient la chaîne notes.md." }
    references:
      - title: Implement a changelog
        url: https://learn.microsoft.com/en-us/training/modules/manage-git-repositories/4-implement-change-log
      - title: Manage releases with GitHub repos
        url: https://learn.microsoft.com/en-us/training/modules/manage-git-repositories/8-manage-releases-github-repos

  # ------------------------------------------------------------------ 10
  - id: az400-qz-13-10
    objective: "1.3.6"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        Adatum Corporation uses Azure DevOps Services and Microsoft Teams. The Azure DevOps project **Retail** has two teams, Web and Mobile, whose area paths are `Retail\Web` and `Retail\Mobile`.

        The Azure Boards app is installed in a Teams channel named **Retail-Dev**, and the channel is linked to Retail. Tom, a member of the Project Administrators group of Retail, created a subscription in the channel for the work items created in `Retail\Web`.

        Ana is a Team Administrator of the Mobile team and isn't a Project Administrator. Leo is a member of the Contributors group of Retail.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Adatum Corporation utilise Azure DevOps Services et Microsoft Teams. Le projet Azure DevOps **Retail** compte deux équipes, Web et Mobile, dont les chemins de zone sont `Retail\Web` et `Retail\Mobile`.

        L'application Azure Boards est installée dans un canal Teams nommé **Retail-Dev**, et le canal est lié à Retail. Tom, membre du groupe Project Administrators de Retail, a créé dans le canal un abonnement aux éléments de travail créés dans `Retail\Web`.

        Ana est Team Administrator de l'équipe Mobile et n'est pas Project Administrator. Leo est membre du groupe Contributors de Retail.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text: { en: "Ana can create a subscription in Retail-Dev for the work items created in `Retail\\Mobile`.", fr: "Ana peut créer dans Retail-Dev un abonnement aux éléments de travail créés dans `Retail\\Mobile`." }
        - id: s2
          text: { en: "Ana can add a work item type filter to the subscription that Tom created.", fr: "Ana peut ajouter un filtre de type d'élément de travail à l'abonnement créé par Tom." }
        - id: s3
          text: { en: "Leo can run `@azure boards unlink` in Retail-Dev, then link the channel to another project.", fr: "Leo peut exécuter `@azure boards unlink` dans Retail-Dev, puis lier le canal à un autre projet." }
    answer:
      values: { s1: true, s2: false, s3: false }
    explanation:
      correct:
        en: |
          Creating subscriptions for work item events requires membership in the Project Administrators or Team Administrators group, so Ana can subscribe the channel to `Retail\Mobile`. Team Administrators can't remove or modify subscriptions that Project Administrators created. A channel links to one project at a time, and once it has subscriptions, only Project Administrators can unlink it, because unlinking deletes all its subscriptions.
        fr: |
          Créer des abonnements aux événements d'éléments de travail exige l'appartenance au groupe Project Administrators ou Team Administrators : Ana peut donc abonner le canal à `Retail\Mobile`. Les Team Administrators ne peuvent ni supprimer ni modifier les abonnements créés par des Project Administrators. Un canal est lié à un seul projet à la fois et, dès qu'il a des abonnements, seuls les Project Administrators peuvent le délier, car le déliement supprime tous ses abonnements.
      options:
        s2: { en: "The subscription was created by a Project Administrator, so a Team Administrator can't modify it.", fr: "L'abonnement a été créé par un Project Administrator : un Team Administrator ne peut donc pas le modifier." }
        s3: { en: "Retail-Dev has a subscription, so only a Project Administrator can unlink the project; any user could do it only if the channel had no subscription.", fr: "Retail-Dev a un abonnement : seul un Project Administrator peut donc délier le projet ; n'importe quel utilisateur ne le pourrait que si le canal n'avait aucun abonnement." }
    references:
      - title: Use Azure Boards in Microsoft Teams
        url: https://learn.microsoft.com/en-us/azure/devops/boards/integrations/boards-teams
