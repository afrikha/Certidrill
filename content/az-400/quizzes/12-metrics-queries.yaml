chapter: 12-metrics-queries
questions:
  # ------------------------------------------------------------------ 1
  - id: az400-qz-12-01
    objective: "1.2.4"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        At Proseware, testers are writing the test cases of a suite named **Regression** for the next release. The QA lead wants a dashboard chart that tracks how many test cases of the suite are still being authored and how many are ready.

        Which widget should you add?
      fr: |
        Chez Proseware, des testeurs rédigent les cas de test d'une suite nommée **Regression** pour la prochaine version. La responsable QA veut un graphique de tableau de bord qui suit combien de cas de test de la suite sont encore en cours de rédaction et combien sont prêts.

        Quel widget devez-vous ajouter ?
    body:
      options:
        - { id: a, text: "Test Results Trend" }
        - { id: b, text: "Requirements quality" }
        - { id: c, text: "Chart for Test Plans" }
        - { id: d, text: "Test Results Trend (Advanced)" }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          Chart for Test Plans is configured with a test plan and a test suite, and tracks either the progress of test case authoring or the status of test execution. It is the only widget of the list that reads test plans rather than pipeline test results.
        fr: |
          Chart for Test Plans se configure avec un plan de test et une suite de tests, et suit soit la progression de la création des cas de test, soit l'état de leur exécution. C'est le seul widget de la liste qui lit les plans de test plutôt que les résultats de test des pipelines.
      options:
        a: { en: "Test Results Trend shows the trend of test results of one build or release pipeline.", fr: "Test Results Trend affiche la tendance des résultats de test d'un pipeline de build ou de mise en production." }
        b: { en: "Requirements quality tracks the pass rate of the tests linked to requirements, not test case authoring.", fr: "Requirements quality suit le taux de réussite des tests liés aux exigences, pas la création des cas de test." }
        d: { en: "Test Results Trend (Advanced) shows test data of one or more build or release pipelines, not the authoring of a suite.", fr: "Test Results Trend (Advanced) affiche les données de test d'un ou plusieurs pipelines de build ou de mise en production, pas la création d'une suite." }
    references:
      - title: Out Of Box widget catalog
        url: https://learn.microsoft.com/en-us/azure/devops/report/dashboards/widget-catalog

  # ------------------------------------------------------------------ 2
  - id: az400-qz-12-02
    objective: "1.2.2"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        At Contoso, three teams of the same Azure DevOps project deliver the user stories of a release named **R7**. The release manager wants a single dashboard chart that shows the remaining work of R7 across the three teams over the next three months.

        Which widget should you add?
      fr: |
        Chez Contoso, trois équipes d'un même projet Azure DevOps livrent les user stories d'une version nommée **R7**. Le responsable des mises en production veut un seul graphique de tableau de bord qui affiche le travail restant de R7 pour les trois équipes sur les trois prochains mois.

        Quel widget devez-vous ajouter ?
    body:
      options:
        - { id: a, text: "Velocity" }
        - { id: b, text: "Burndown" }
        - { id: c, text: "Sprint Burndown" }
        - { id: d, text: "Sprint Capacity" }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          The Burndown widget can span one or more teams, work item types and a time period that you choose, so one chart can follow the remaining work of a release delivered by several teams.
        fr: |
          Le widget Burndown peut couvrir une ou plusieurs équipes, des types d'éléments de travail et une période de votre choix : un seul graphique peut donc suivre le travail restant d'une version livrée par plusieurs équipes.
      options:
        a: { en: "Velocity tracks the work completed per sprint by a single team.", fr: "Velocity suit le travail terminé par sprint d'une seule équipe." }
        c: { en: "Sprint Burndown covers one team and one sprint, not three teams over three months.", fr: "Sprint Burndown couvre une équipe et un sprint, pas trois équipes sur trois mois." }
        d: { en: "Sprint Capacity shows one team's capacity for the current sprint.", fr: "Sprint Capacity affiche la capacité d'une équipe pour le sprint en cours." }
    references:
      - title: Out Of Box widget catalog
        url: https://learn.microsoft.com/en-us/azure/devops/report/dashboards/widget-catalog

  # ------------------------------------------------------------------ 3
  - id: az400-qz-12-03
    objective: "1.2.6"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Litware deploys two microservices, **orders** and **billing**, to production by using two YAML pipelines in Azure Pipelines. In each pipeline, the production stage contains a regular job whose script deploys the service.

        The delivery manager needs one place in Azure DevOps that lists every production deployment made by both pipelines, to measure how often production changes. What should you do?
      fr: |
        Litware déploie deux microservices, **orders** et **billing**, en production avec deux pipelines YAML dans Azure Pipelines. Dans chaque pipeline, la phase de production contient un travail standard dont le script déploie le service.

        Le responsable de la livraison a besoin d'un endroit unique dans Azure DevOps qui liste tous les déploiements en production effectués par les deux pipelines, pour mesurer la fréquence des changements en production. Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Add a Build History widget for each pipeline to the team dashboard, and compare the two histograms.", fr: "Ajouter un widget Build History pour chaque pipeline au tableau de bord de l'équipe, et comparer les deux histogrammes." } }
        - { id: b, text: { en: "Add a Release Pipeline Overview widget for each pipeline to the team dashboard, and compare the two widgets.", fr: "Ajouter un widget Release Pipeline Overview pour chaque pipeline au tableau de bord de l'équipe, et comparer les deux widgets." } }
        - { id: c, text: { en: "Turn the production jobs into deployment jobs that target an environment named production, and use its deployment history.", fr: "Transformer les travaux de production en travaux de déploiement qui ciblent un environnement nommé production, et utiliser son historique de déploiement." } }
        - { id: d, text: { en: "Open the Pipeline pass rate report of each pipeline, and filter it on the branch that is deployed to production.", fr: "Ouvrir le rapport Pipeline pass rate de chaque pipeline, et le filtrer sur la branche déployée en production." } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          A deployment job that targets an environment records its deployments in the environment's history, with the pipeline name and run details. When several pipelines deploy to the same environment, its deployment history shows all their deployments in one place, and each deployment lists the commits and work items it delivered.
        fr: |
          Un travail de déploiement qui cible un environnement enregistre ses déploiements dans l'historique de l'environnement, avec le nom du pipeline et les détails de l'exécution. Quand plusieurs pipelines déploient dans le même environnement, son historique de déploiement affiche tous leurs déploiements au même endroit, et chaque déploiement liste les commits et les éléments de travail qu'il a livrés.
      options:
        a: { en: "Build History shows all the runs of one pipeline, including runs that never deployed, and not the two pipelines together.", fr: "Build History affiche toutes les exécutions d'un pipeline, y compris celles qui n'ont rien déployé, et pas les deux pipelines ensemble." }
        b: { en: "Release Pipeline Overview tracks a classic release pipeline, not the stages of YAML pipelines.", fr: "Release Pipeline Overview suit un pipeline de mise en production classique, pas les phases de pipelines YAML." }
        d: { en: "The Pipeline pass rate report measures the share of successful runs of one pipeline, not the deployments to production.", fr: "Le rapport Pipeline pass rate mesure la part d'exécutions réussies d'un pipeline, pas les déploiements en production." }
    references:
      - title: Create and target Azure DevOps environments
        url: https://learn.microsoft.com/en-us/azure/devops/pipelines/process/environments
      - title: Out Of Box widget catalog
        url: https://learn.microsoft.com/en-us/azure/devops/report/dashboards/widget-catalog

  # ------------------------------------------------------------------ 4
  - id: az400-qz-12-04
    objective: "1.2.3"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Adatum develops a payments module in the folder `/src/payments` of an Azure Repos Git repository named **core**. The Pull Request widget shows that pull requests that change this folder wait about four days for a first review, because their authors forget to add the Payments group as reviewers.

        You need to reduce this waiting time without manual triage. What should you configure on the `main` branch?
      fr: |
        Adatum développe un module de paiement dans le dossier `/src/payments` d'un dépôt Git Azure Repos nommé **core**. Le widget Pull Request montre que les pull requests qui modifient ce dossier attendent environ quatre jours une première revue, car leurs auteurs oublient d'ajouter le groupe Payments comme réviseurs.

        Vous devez réduire ce temps d'attente sans tri manuel. Que devez-vous configurer sur la branche `main` ?
    body:
      options:
        - { id: a, text: { en: "A Require a minimum number of reviewers policy that requires two approvals", fr: "Une stratégie Require a minimum number of reviewers qui exige deux approbations" } }
        - { id: b, text: { en: "An Automatically included reviewers policy for the Payments group, with the path filter `/src/payments/*`", fr: "Une stratégie Automatically included reviewers pour le groupe Payments, avec le filtre de chemin `/src/payments/*`" } }
        - { id: c, text: { en: "A Check for linked work items policy that is set to Required for every pull request", fr: "Une stratégie Check for linked work items définie sur Required pour chaque pull request" } }
        - { id: d, text: { en: "A Build validation policy that runs the payments tests, with the path filter `/src/payments/*`", fr: "Une stratégie Build validation qui exécute les tests de paiement, avec le filtre de chemin `/src/payments/*`" } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          Automatically included reviewers adds people or groups as reviewers to the pull requests that change the files matching a path filter. The Payments group is then requested on every pull request that touches `/src/payments`, so the review starts without waiting for the author to add it.
        fr: |
          Automatically included reviewers ajoute des personnes ou des groupes comme réviseurs aux pull requests qui modifient les fichiers correspondant à un filtre de chemin. Le groupe Payments est alors sollicité sur chaque pull request qui touche `/src/payments`, et la revue commence sans attendre que l'auteur l'ajoute.
      options:
        a: { en: "A minimum number of reviewers requires approvals but doesn't add anyone as a reviewer.", fr: "Un nombre minimal de réviseurs exige des approbations mais n'ajoute personne comme réviseur." }
        c: { en: "Check for linked work items improves traceability; it doesn't bring reviewers to the pull request.", fr: "Check for linked work items améliore la traçabilité ; il n'amène aucun réviseur sur la pull request." }
        d: { en: "Build validation adds an automated check; the pull request still waits for a human reviewer to be added.", fr: "Build validation ajoute une vérification automatisée ; la pull request attend toujours qu'un réviseur humain soit ajouté." }
    references:
      - title: Set and manage branch policies
        url: https://learn.microsoft.com/en-us/azure/devops/repos/git/branch-policies

  # ------------------------------------------------------------------ 5
  - id: az400-qz-12-05
    objective: "1.2.2"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        At Tailspin Toys, a steering committee asks for the bugs of the project **Retail** that were in the Active state at midnight at the start of September 30, 2026, with the values their fields had at that moment. Many of those bugs have since been closed or reassigned. You start from the following WIQL query.

        ```text
        SELECT [System.Id], [System.Title], [System.AssignedTo]
        FROM workitems
        WHERE [System.TeamProject] = 'Retail'
            AND [System.WorkItemType] = 'Bug'
            AND [System.State] = 'Active'
        ```

        What should you add at the end of the query?
      fr: |
        Chez Tailspin Toys, un comité de pilotage demande les bogues du projet **Retail** qui étaient à l'état Active à minuit au début du 30 septembre 2026, avec les valeurs que leurs champs avaient à ce moment. Beaucoup de ces bogues ont depuis été fermés ou réaffectés. Vous partez de la requête WIQL suivante.

        ```text
        SELECT [System.Id], [System.Title], [System.AssignedTo]
        FROM workitems
        WHERE [System.TeamProject] = 'Retail'
            AND [System.WorkItemType] = 'Bug'
            AND [System.State] = 'Active'
        ```

        Que devez-vous ajouter à la fin de la requête ?
    body:
      options:
        - { id: a, text: "`AND [System.ChangedDate] <= '2026-09-30'`" }
        - { id: b, text: "`AND [System.CreatedDate] <= '2026-09-30'`" }
        - { id: c, text: "`ORDER BY [System.ChangedDate] DESC`" }
        - { id: d, text: "`ASOF '2026-09-30'`" }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          The `ASOF` clause makes the query historical: the filter is applied to the work items as they were at the given date, midnight when no time is specified. The query therefore returns the bugs that were Active then, with the field values of that moment, even if they are closed today.
        fr: |
          La clause `ASOF` rend la requête historique : le filtre s'applique aux éléments de travail tels qu'ils étaient à la date indiquée, à minuit quand aucune heure n'est précisée. La requête renvoie donc les bogues qui étaient Active à ce moment, avec les valeurs des champs de ce moment, même s'ils sont fermés aujourd'hui.
      options:
        a: { en: "This condition still evaluates the current state: closed bugs are excluded, and bugs changed since September 30 are missing.", fr: "Cette condition évalue toujours l'état actuel : les bogues fermés sont exclus, et ceux modifiés depuis le 30 septembre manquent." }
        b: { en: "This condition filters on the creation date but still returns the current state and field values.", fr: "Cette condition filtre sur la date de création mais renvoie toujours l'état et les valeurs de champs actuels." }
        c: { en: "Sorting changes the order of the results, not the moment at which the data is evaluated.", fr: "Le tri change l'ordre des résultats, pas le moment auquel les données sont évaluées." }
    references:
      - title: Work Item Query Language (WIQL) syntax reference
        url: https://learn.microsoft.com/en-us/azure/devops/boards/queries/wiql-syntax

  # ------------------------------------------------------------------ 6
  - id: az400-qz-12-06
    objective: "1.2.7"
    difficulty: 3
    status: draft
    type: dropdown
    stem:
      en: |
        Fabrikam runs a web app whose cloud role name is **app-orders**. The app sends its telemetry to a workspace-based Application Insights resource, so the data is stored in a Log Analytics workspace.

        During incidents, the on-call engineers need a query that returns the five targets of outgoing calls, such as SQL servers and external APIs, whose calls failed most often during the last hour, with the number of failed calls to each target.

        How should you complete the query? To answer, select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Fabrikam exploite une application web dont le nom de rôle cloud est **app-orders**. L'application envoie sa télémétrie à une ressource Application Insights basée sur un espace de travail : les données sont donc stockées dans un espace de travail Log Analytics.

        Pendant les incidents, les ingénieurs d'astreinte ont besoin d'une requête qui renvoie les cinq cibles d'appels sortants, comme des serveurs SQL et des API externes, dont les appels ont échoué le plus souvent pendant la dernière heure, avec le nombre d'appels en échec vers chaque cible.

        Comment devez-vous compléter la requête ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: code
      language: kusto
      template: |
        [[table]]
        | where TimeGenerated > ago(1h) and AppRoleName == "app-orders"
        | where [[filter]]
        | summarize Failures = count() by [[group]]
        | [[top]]
      slots:
        - id: table
          options:
            - { id: req, text: AppRequests }
            - { id: deps, text: AppDependencies }
            - { id: exc, text: AppExceptions }
            - { id: avail, text: AppAvailabilityResults }
        - id: filter
          options:
            - { id: code, text: "ResultCode == \"200\"" }
            - { id: slow, text: "DurationMs > 1000" }
            - { id: failed, text: "Success == false" }
            - { id: target, text: "isnotempty(Target)" }
        - id: group
          options:
            - { id: op, text: OperationName }
            - { id: code, text: ResultCode }
            - { id: bin, text: "bin(TimeGenerated, 5m)" }
            - { id: target, text: Target }
        - id: top
          options:
            - { id: take, text: "take 5" }
            - { id: asc, text: "top 5 by Failures asc" }
            - { id: desc, text: "top 5 by Failures desc" }
            - { id: sortasc, text: "sort by Failures asc | take 5" }
    answer:
      values: { table: deps, filter: failed, group: target, top: desc }
    explanation:
      correct:
        en: |
          Outgoing calls of an app to SQL servers or HTTP APIs are stored in `AppDependencies`, whose `Success` column says whether each call succeeded and whose `Target` column holds the server or API name. Counting the failed calls by `Target` and keeping the five largest counts with `top 5 by Failures desc` returns the targets that failed most often.
        fr: |
          Les appels sortants d'une application vers des serveurs SQL ou des API HTTP sont stockés dans `AppDependencies`, dont la colonne `Success` indique si chaque appel a réussi et dont la colonne `Target` contient le nom du serveur ou de l'API. Compter les appels en échec par `Target` et garder les cinq plus grands nombres avec `top 5 by Failures desc` renvoie les cibles qui ont échoué le plus souvent.
      options:
        req: { en: "`AppRequests` holds the incoming requests that the app receives, not its outgoing calls.", fr: "`AppRequests` contient les requêtes entrantes reçues par l'application, pas ses appels sortants." }
        code: { en: "`ResultCode == \"200\"` keeps successful HTTP calls, and grouping by result code doesn't identify the targets.", fr: "`ResultCode == \"200\"` garde les appels HTTP réussis, et regrouper par code de résultat n'identifie pas les cibles." }
        op: { en: "`OperationName` is the operation of the app that made the call, not the dependency target.", fr: "`OperationName` est l'opération de l'application qui a fait l'appel, pas la cible de la dépendance." }
        take: { en: "`take 5` returns five arbitrary rows, not the five largest counts.", fr: "`take 5` renvoie cinq lignes quelconques, pas les cinq plus grands nombres." }
        asc: { en: "Ascending order keeps the targets that failed least often.", fr: "L'ordre croissant garde les cibles qui ont échoué le moins souvent." }
    references:
      - title: AppDependencies
        url: https://learn.microsoft.com/en-us/azure/azure-monitor/reference/tables/appdependencies
      - title: top operator
        url: https://learn.microsoft.com/en-us/kusto/query/top-operator

  # ------------------------------------------------------------------ 7
  - id: az400-qz-12-07
    objective: "1.2.5"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        Contoso has an Azure DevOps organization in which GitHub Code Security for Azure DevOps is enabled on every repository. In a repository named **orders-api**, whose default branch is `main`, the only pipeline that runs CodeQL analysis is triggered on the `develop` branch. Its last successful run was eight months ago. Across the organization, 3,400 code scanning alerts are open.

        The security manager uses **Organization settings > Security overview** to prepare a report.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Contoso dispose d'une organisation Azure DevOps dans laquelle GitHub Code Security for Azure DevOps est activé sur chaque dépôt. Dans un dépôt nommé **orders-api**, dont la branche par défaut est `main`, le seul pipeline qui exécute l'analyse CodeQL est déclenché sur la branche `develop`. Sa dernière exécution réussie date d'il y a huit mois. Dans toute l'organisation, 3 400 alertes d'analyse du code sont ouvertes.

        La responsable de la sécurité utilise **Organization settings > Security overview** pour préparer un rapport.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text:
            en: |
              On the Coverage tab, code scanning shows as enabled for orders-api.
            fr: |
              Dans l'onglet Coverage, l'analyse du code apparaît comme activée pour orders-api.
        - id: s2
          text:
            en: |
              Exporting the Alerts tab with only the State filter set to Open produces a CSV file that lists the 3,400 open alerts.
            fr: |
              L'exportation de l'onglet Alerts avec le seul filtre State défini sur Open produit un fichier CSV qui liste les 3 400 alertes ouvertes.
        - id: s3
          text:
            en: |
              If an administrator disables orders-api, the repository stays listed on the Coverage tab with code scanning enabled.
            fr: |
              Si un administrateur désactive orders-api, le dépôt reste listé dans l'onglet Coverage avec l'analyse du code activée.
    answer:
      values: { s1: true, s2: false, s3: false }
    explanation:
      correct:
        en: |
          Coverage turns on for a tool once a result file has been successfully submitted, from a scan on any branch, and the enablement status doesn't consider how recent the scan is: the old develop scan is enough. The Alerts tab exports at most the first 1,000 alerts that match the filters. Disabled and deleted repositories are excluded from the Coverage results.
        fr: |
          La couverture s'active pour un outil dès qu'un fichier de résultats a été soumis avec succès, à partir d'une analyse sur n'importe quelle branche, et l'état d'activation ne tient pas compte de l'ancienneté de l'analyse : l'ancienne analyse de develop suffit. L'onglet Alerts exporte au plus les 1 000 premières alertes qui correspondent aux filtres. Les dépôts désactivés et supprimés sont exclus des résultats de Coverage.
    references:
      - title: Security overview
        url: https://learn.microsoft.com/en-us/azure/devops/repos/security/github-advanced-security-security-overview

  # ------------------------------------------------------------------ 8
  - id: az400-qz-12-08
    objective: "1.2.4"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Woodgrove Bank uses Azure DevOps Services. A YAML pipeline named **web-ci** runs Jest tests in a script step, then a second script uploads the results through the Azure DevOps REST API. Flaky test management is turned on for the project with custom detection: an external tool flags flaky tests, and the team doesn't want to lose this flakiness history.

        Flaky test failures still lower the pass percentage and fail the runs of web-ci. You need to exclude the flaky tests from the test summary of web-ci with the least development effort. What should you do?
      fr: |
        Woodgrove Bank utilise Azure DevOps Services. Un pipeline YAML nommé **web-ci** exécute des tests Jest dans une étape de script, puis un second script charge les résultats avec l'API REST d'Azure DevOps. La gestion des tests instables est activée pour le projet avec la détection personnalisée : un outil externe signale les tests instables, et l'équipe ne veut pas perdre cet historique d'instabilité.

        Les échecs de tests instables font toujours baisser le pourcentage de réussite et échouer les exécutions de web-ci. Vous devez exclure les tests instables du résumé des tests de web-ci avec un minimum d'effort de développement. Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Keep the upload script, and turn on the option that excludes flaky tests from the test summary.", fr: "Conserver le script de chargement, et activer l'option qui exclut les tests instables du résumé des tests." } }
        - { id: b, text: { en: "Switch the project to system detection, and turn on the option that excludes flaky tests from the test summary.", fr: "Passer le projet en détection système, et activer l'option qui exclut les tests instables du résumé des tests." } }
        - { id: c, text: { en: "Publish JUnit results with the Publish Test Results task, and turn on the option that excludes flaky tests from the test summary.", fr: "Publier des résultats JUnit avec la tâche Publish Test Results, et activer l'option qui exclut les tests instables du résumé des tests." } }
        - { id: d, text: { en: "Mark the failed tests as Flaky in the latest run of web-ci, so that this run and the next ones succeed.", fr: "Marquer les tests en échec comme Flaky dans la dernière exécution de web-ci, afin que cette exécution et les suivantes réussissent." } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          When the exclusion option is on, flaky tests leave the pass percentage and appear under Tests not reported, but the test summary is updated this way only for the Visual Studio Test and Publish Test Results tasks. Writing the Jest results in JUnit format and publishing them with Publish Test Results applies the exclusion while keeping custom detection and its history.
        fr: |
          Quand l'option d'exclusion est activée, les tests instables sortent du pourcentage de réussite et apparaissent sous Tests not reported, mais le résumé des tests n'est mis à jour ainsi que pour les tâches Visual Studio Test et Publish Test Results. Écrire les résultats Jest au format JUnit et les publier avec Publish Test Results applique l'exclusion tout en conservant la détection personnalisée et son historique.
      options:
        a: { en: "With a custom upload script, the test summary isn't updated by the exclusion option; you would need more custom code to suppress the failures.", fr: "Avec un script de chargement personnalisé, l'option d'exclusion ne met pas à jour le résumé des tests ; il faudrait davantage de code personnalisé pour supprimer les échecs." }
        b: { en: "Switching between detection systems erases the flakiness history, and the custom upload still isn't covered by the exclusion.", fr: "Changer de système de détection efface l'historique d'instabilité, et le chargement personnalisé n'est toujours pas couvert par l'exclusion." }
        d: { en: "A manual mark changes nothing in the current run; it is evaluated only in future executions, and it doesn't exclude results by itself.", fr: "Un marquage manuel ne change rien à l'exécution en cours ; il n'est évalué que lors des exécutions futures, et il n'exclut pas de résultats à lui seul." }
    references:
      - title: Manage flaky tests
        url: https://learn.microsoft.com/en-us/azure/devops/pipelines/test/flaky-test-management

  # ------------------------------------------------------------------ 9
  - id: az400-qz-12-09
    objective: "1.2.1"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        The Dispatch team at Northwind Traders uses Azure Boards with the Agile process. The **Working with bugs** setting of the team is set so that bugs don't appear on backlogs or boards. The team board has a swimlane named **Expedite** for urgent user stories, and urgent bugs must now be handled in the same lane.

        The team lead needs a dashboard widget that measures, for the items of the Expedite swimlane only, bugs included, the time from the start of the work until completion, and that highlights the items outside the typical variation.

        Which two actions should you perform? Each correct answer presents part of the solution.

        NOTE: Each correct selection is worth one point.
      fr: |
        L'équipe Dispatch de Northwind Traders utilise Azure Boards avec le processus Agile. Le paramètre **Working with bugs** de l'équipe est défini de sorte que les bogues n'apparaissent ni sur les backlogs ni sur les tableaux. Le tableau de l'équipe a un couloir (swimlane) nommé **Expedite** pour les user stories urgentes, et les bogues urgents doivent désormais être traités dans le même couloir.

        Le responsable d'équipe a besoin d'un widget de tableau de bord qui mesure, pour les éléments du couloir Expedite uniquement, bogues compris, le temps entre le début du travail et son achèvement, et qui met en évidence les éléments hors de la variation habituelle.

        Quelles sont les deux actions que vous devez effectuer ? Chaque bonne réponse présente une partie de la solution.

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "Set Working with bugs so that bugs are tracked as tasks.", fr: "Définir Working with bugs pour que les bogues soient suivis comme des tâches." } }
        - { id: b, text: { en: "Set Working with bugs so that bugs are tracked as requirements.", fr: "Définir Working with bugs pour que les bogues soient suivis comme des exigences." } }
        - { id: c, text: { en: "Add a Cycle Time widget that uses the Bug work item type and the Expedite swimlane.", fr: "Ajouter un widget Cycle Time qui utilise le type d'élément de travail Bug et le couloir Expedite." } }
        - { id: d, text: { en: "Add a Lead Time widget that uses the Stories backlog and the Expedite swimlane.", fr: "Ajouter un widget Lead Time qui utilise le backlog Stories et le couloir Expedite." } }
        - { id: e, text: { en: "Add a Cycle Time widget that uses the Stories backlog and the Expedite swimlane.", fr: "Ajouter un widget Cycle Time qui utilise le backlog Stories et le couloir Expedite." } }
    answer: { optionIds: [b, e] }
    explanation:
      correct:
        en: |
          Cycle time runs from the first In Progress state to the Completed state, and the Cycle Time widget shows a moving average with a standard deviation band. The widget can select only work item types that are on a backlog, and a swimlane can be selected only with a backlog level. Tracking bugs as requirements puts them on the Stories backlog and board, so the Stories backlog filtered on Expedite includes both the urgent stories and the urgent bugs.
        fr: |
          Le temps de cycle va du premier état In Progress jusqu'à l'état Completed, et le widget Cycle Time affiche une moyenne mobile avec une bande d'écart type. Le widget ne peut sélectionner que des types d'éléments de travail présents sur un backlog, et un couloir ne peut être sélectionné qu'avec un niveau de backlog. Suivre les bogues comme des exigences les place sur le backlog Stories et sur le tableau : le backlog Stories filtré sur Expedite inclut donc les stories et les bogues urgents.
      options:
        a: { en: "Bugs tracked as tasks appear on sprint backlogs and taskboards, not in the swimlanes of the product board.", fr: "Les bogues suivis comme des tâches apparaissent dans les backlogs de sprint et sur les tableaux des tâches, pas dans les couloirs du tableau de produit." }
        c: { en: "A swimlane can be selected only with a backlog level, and the Bug type alone would leave out the urgent user stories.", fr: "Un couloir ne peut être sélectionné qu'avec un niveau de backlog, et le seul type Bug laisserait de côté les user stories urgentes." }
        d: { en: "Lead time starts when the item is created, not when the work starts.", fr: "Le délai de livraison commence à la création de l'élément, pas au début du travail." }
    references:
      - title: Configure lead time and cycle time widgets
        url: https://learn.microsoft.com/en-us/azure/devops/report/dashboards/cycle-time-and-lead-time
      - title: Show bugs on backlogs and boards
        url: https://learn.microsoft.com/en-us/azure/devops/organizations/settings/show-bugs-on-backlog

  # ------------------------------------------------------------------ 10
  - id: az400-qz-12-10
    objective: "1.2.1"
    difficulty: 3
    status: draft
    type: dropdown
    stem:
      en: |
        Tailspin Toys has an Azure DevOps organization named **tailspin** with a project named **Retail** that uses the Agile process. Each team of Retail owns its own area path.

        For a Power BI report, the engineering manager wants, for each area path, the average number of days between the moment developers start working on a user story and the moment the story is finished, for the user stories finished on or after October 1, 2026. The report must read the Analytics OData feed.

        How should you complete the query? To answer, select the appropriate options in the answer area. (Line breaks were added for readability.)

        NOTE: Each correct selection is worth one point.
      fr: |
        Tailspin Toys dispose d'une organisation Azure DevOps nommée **tailspin** avec un projet nommé **Retail** qui utilise le processus Agile. Chaque équipe de Retail possède son propre chemin de zone.

        Pour un rapport Power BI, le responsable de l'ingénierie veut, pour chaque chemin de zone, le nombre moyen de jours entre le moment où les développeurs commencent à travailler sur une user story et le moment où la story est terminée, pour les user stories terminées le 1er octobre 2026 ou après. Le rapport doit lire le flux OData d'Analytics.

        Comment devez-vous compléter la requête ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse. (Des sauts de ligne ont été ajoutés pour la lisibilité.)

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: code
      language: text
      template: |
        https://analytics.dev.azure.com/tailspin/Retail/_odata/v3.0-preview/WorkItems?
          $apply=filter(WorkItemType eq 'User Story'
            and [[state]]
            and CompletedDate ge 2026-10-01Z)
          /[[group]]((Area/AreaPath),
            aggregate([[measure]] with [[agg]] as AvgDays))
      slots:
        - id: state
          options:
            - { id: inprog, text: "StateCategory eq 'InProgress'" }
            - { id: done, text: "State eq 'Done'" }
            - { id: completed, text: "StateCategory eq 'Completed'" }
            - { id: resolved, text: "State eq 'Resolved'" }
        - id: group
          options:
            - { id: groupby, text: groupby }
            - { id: compute, text: compute }
            - { id: filter, text: filter }
        - id: measure
          options:
            - { id: lead, text: LeadTimeDays }
            - { id: cycle, text: CycleTimeDays }
            - { id: points, text: StoryPoints }
            - { id: remaining, text: RemainingWork }
        - id: agg
          options:
            - { id: sum, text: sum }
            - { id: max, text: max }
            - { id: average, text: average }
            - { id: distinct, text: countdistinct }
    answer:
      values: { state: completed, group: groupby, measure: cycle, agg: average }
    explanation:
      correct:
        en: |
          Lead and cycle time values are calculated only for completed items, so the filter keeps the user stories whose `StateCategory` is `Completed`. The time from the start of the work to completion is the cycle time, `CycleTimeDays`; lead time starts at creation. `groupby` on `Area/AreaPath` with `aggregate(... with average as ...)` returns one average per area path.
        fr: |
          Les valeurs de délai de livraison et de temps de cycle ne sont calculées que pour les éléments terminés : le filtre garde donc les user stories dont la `StateCategory` est `Completed`. Le temps entre le début du travail et l'achèvement est le temps de cycle, `CycleTimeDays` ; le délai de livraison commence à la création. `groupby` sur `Area/AreaPath` avec `aggregate(... with average as ...)` renvoie une moyenne par chemin de zone.
      options:
        done: { en: "Done is a state of the Scrum process; Agile user stories are completed in the Closed state.", fr: "Done est un état du processus Scrum ; les user stories Agile sont terminées à l'état Closed." }
        resolved: { en: "Resolved isn't the completed state of the stories, and cycle time is calculated only for completed items.", fr: "Resolved n'est pas l'état terminé des stories, et le temps de cycle n'est calculé que pour les éléments terminés." }
        lead: { en: "`LeadTimeDays` measures from the creation of the story, not from the start of the work.", fr: "`LeadTimeDays` mesure à partir de la création de la story, pas du début du travail." }
        compute: { en: "`compute` adds a calculated column; it doesn't group the rows by area path.", fr: "`compute` ajoute une colonne calculée ; il ne regroupe pas les lignes par chemin de zone." }
        sum: { en: "A sum adds up the days of all the stories instead of returning their average.", fr: "Une somme additionne les jours de toutes les stories au lieu de renvoyer leur moyenne." }
    references:
      - title: Lead time and cycle time sample report
        url: https://learn.microsoft.com/en-us/azure/devops/report/powerbi/sample-boards-leadcycletime
      - title: Aggregate work tracking data by using Analytics
        url: https://learn.microsoft.com/en-us/azure/devops/report/extend-analytics/aggregated-data-analytics
