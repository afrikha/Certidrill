chapter: 34-deployments
questions:
  # ------------------------------------------------------------------ 1
  - id: az400-qz-34-01
    objective: "3.4.1"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Contoso writes an Azure Pipelines deployment job that uses the `canary` strategy with `increments: [10, 20]`. The job defines the `preDeploy`, `deploy`, `routeTraffic` and `postRouteTraffic` lifecycle hooks.

        Which of these hooks runs only once during the job, whatever the number of increments?
      fr: |
        Contoso écrit un travail de déploiement Azure Pipelines qui utilise la stratégie `canary` avec `increments: [10, 20]`. Le travail définit les hooks de cycle de vie `preDeploy`, `deploy`, `routeTraffic` et `postRouteTraffic`.

        Lequel de ces hooks s'exécute une seule fois pendant le travail, quel que soit le nombre d'incréments ?
    body:
      options:
        - { id: a, text: "`deploy`" }
        - { id: b, text: "`routeTraffic`" }
        - { id: c, text: "`preDeploy`" }
        - { id: d, text: "`postRouteTraffic`" }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          The canary strategy runs `preDeploy` once to initialize the resources, then iterates over `deploy`, `routeTraffic` and `postRouteTraffic` for each increment, and finally exits with the `on: success` or `on: failure` hook.
        fr: |
          La stratégie canary exécute `preDeploy` une fois pour initialiser les ressources, puis itère sur `deploy`, `routeTraffic` et `postRouteTraffic` pour chaque incrément, et se termine par le hook `on: success` ou `on: failure`.
      options:
        a: { en: "`deploy` runs for each increment: it deploys the new version to the share defined by the current increment.", fr: "`deploy` s'exécute pour chaque incrément : il déploie la nouvelle version sur la part définie par l'incrément en cours." }
        b: { en: "`routeTraffic` runs for each increment, to serve the traffic of that increment to the updated version.", fr: "`routeTraffic` s'exécute pour chaque incrément, pour diriger le trafic de cet incrément vers la version mise à jour." }
        d: { en: "`postRouteTraffic` runs after the traffic of each increment is routed, typically to monitor the health of the new version.", fr: "`postRouteTraffic` s'exécute après le routage du trafic de chaque incrément, en général pour surveiller l'intégrité de la nouvelle version." }
    references:
      - title: Deployment jobs
        url: https://learn.microsoft.com/en-us/azure/devops/pipelines/process/deployment-jobs

  # ------------------------------------------------------------------ 2
  - id: az400-qz-34-02
    objective: "3.4.6"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Fabrikam creates a feature flag named **Beta**, without a label, in the **Feature manager** of an Azure App Configuration store named **appcs-fabrikam**.

        How is the flag stored in appcs-fabrikam?
      fr: |
        Fabrikam crée un indicateur de fonctionnalité nommé **Beta**, sans étiquette, dans le **Gestionnaire de fonctionnalités** d'un magasin Azure App Configuration nommé **appcs-fabrikam**.

        Comment l'indicateur est-il stocké dans appcs-fabrikam ?
    body:
      options:
        - { id: a, text: { en: "As a key-value whose key is `.appconfig.featureflag/Beta`", fr: "Comme une paire clé-valeur dont la clé est `.appconfig.featureflag/Beta`" } }
        - { id: b, text: { en: "As a key-value whose key is `Beta` and whose label is `featureflag`", fr: "Comme une paire clé-valeur dont la clé est `Beta` et l'étiquette `featureflag`" } }
        - { id: c, text: { en: "As a secret named `Beta` in a key vault referenced by the store", fr: "Comme un secret nommé `Beta` dans un coffre de clés référencé par le magasin" } }
        - { id: d, text: { en: "As an app setting named `FeatureManagement__Beta` in each connected app", fr: "Comme un paramètre d'application nommé `FeatureManagement__Beta` dans chaque application connectée" } }
    answer: { optionId: a }
    explanation:
      correct:
        en: |
          Feature flags are regular key-values of the store, with the reserved key prefix `.appconfig.featureflag/` and a dedicated feature flag content type. By default a flag has no label; labels can be added to keep different flags with the same key, for example one per environment.
        fr: |
          Les indicateurs de fonctionnalités sont des paires clé-valeur ordinaires du magasin, avec le préfixe de clé réservé `.appconfig.featureflag/` et un type de contenu propre aux indicateurs. Par défaut, un indicateur n'a pas d'étiquette ; des étiquettes permettent de conserver des indicateurs différents pour la même clé, par exemple un par environnement.
      options:
        b: { en: "The key keeps the flag name after the reserved prefix; the label stays free to distinguish environments, it doesn't mark the key-value as a flag.", fr: "La clé garde le nom de l'indicateur après le préfixe réservé ; l'étiquette reste libre pour distinguer les environnements, elle ne marque pas la paire clé-valeur comme un indicateur." }
        c: { en: "Key Vault holds secrets that App Configuration can reference; feature flags are stored in the App Configuration store itself.", fr: "Key Vault contient des secrets qu'App Configuration peut référencer ; les indicateurs de fonctionnalités sont stockés dans le magasin App Configuration lui-même." }
        d: { en: "Apps read the flags from the store at runtime; Feature manager doesn't write app settings into the apps.", fr: "Les applications lisent les indicateurs dans le magasin à l'exécution ; le Gestionnaire de fonctionnalités n'écrit pas de paramètres d'application dans les applications." }
    references:
      - title: "Quickstart: Manage feature flags in Azure App Configuration"
        url: https://learn.microsoft.com/en-us/azure/azure-app-configuration/manage-feature-flags

  # ------------------------------------------------------------------ 3
  - id: az400-qz-34-03
    objective: "3.4.3"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Tailspin Toys runs a Node.js web app named **app-tickets** in Azure App Service on Linux, in the Premium v3 tier, with a slot named **staging**. A YAML pipeline in Azure Pipelines deploys each new version to staging with the `AzureWebApp@1` task.

        Every successful deployment to staging must then be swapped into production, after the instances are warmed up, without any manual action.

        What should you do?
      fr: |
        Tailspin Toys exécute une application web Node.js nommée **app-tickets** dans Azure App Service sur Linux, au niveau Premium v3, avec un emplacement nommé **staging**. Un pipeline YAML d'Azure Pipelines déploie chaque nouvelle version dans staging avec la tâche `AzureWebApp@1`.

        Chaque déploiement réussi dans staging doit ensuite être échangé avec la production, après le préchauffage des instances, sans aucune action manuelle.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Enable Auto swap on the staging slot, with production as the target slot.", fr: "Activer l'échange automatique sur l'emplacement staging, avec production comme emplacement cible." } }
        - { id: b, text: { en: "Add an `AzureAppServiceManage@0` task with the `Swap Slots` action after the deployment task.", fr: "Ajouter une tâche `AzureAppServiceManage@0` avec l'action `Swap Slots` après la tâche de déploiement." } }
        - { id: c, text: { en: "Set the Traffic % of the staging slot to 100 at the end of each deployment.", fr: "Définir le % du trafic de l'emplacement staging à 100 à la fin de chaque déploiement." } }
        - { id: d, text: { en: "Deploy to the production slot and set `WEBSITE_SWAP_WARMUP_PING_PATH` on it.", fr: "Déployer dans l'emplacement de production et y définir `WEBSITE_SWAP_WARMUP_PING_PATH`." } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          Auto swap isn't supported for web apps on Linux or for Web App for Containers, so the pipeline must request the swap itself. The `Swap Slots` action of `AzureAppServiceManage@0` swaps staging with production, and App Service still warms up the staging instances before it switches the routing.
        fr: |
          L'échange automatique n'est pas pris en charge pour les applications web sur Linux ni pour Web App for Containers : le pipeline doit donc demander l'échange lui-même. L'action `Swap Slots` de `AzureAppServiceManage@0` échange staging avec la production, et App Service préchauffe toujours les instances de staging avant de basculer le routage.
      options:
        a: { en: "Auto swap is a valid option on Windows only: app-tickets runs on Linux, where it isn't supported.", fr: "L'échange automatique n'est possible que sous Windows : app-tickets s'exécute sous Linux, où il n'est pas pris en charge." }
        c: { en: "Traffic % routes production users to the staging slot without swapping: production keeps the old content and the slot-specific settings don't change.", fr: "Le % du trafic dirige des utilisateurs de production vers l'emplacement staging sans échange : la production garde l'ancien contenu et les paramètres propres aux emplacements ne changent pas." }
        d: { en: "A direct deployment to production restarts it with the new version, and the warm-up settings apply only to swaps.", fr: "Un déploiement direct en production la redémarre avec la nouvelle version, et les paramètres de préchauffage ne s'appliquent qu'aux échanges." }
    references:
      - title: Set up staging environments in Azure App Service
        url: https://learn.microsoft.com/en-us/azure/app-service/deploy-staging-slots
      - title: AzureAppServiceManage@0 - Azure App Service manage v0 task
        url: https://learn.microsoft.com/en-us/azure/devops/pipelines/tasks/reference/azure-app-service-manage-v0

  # ------------------------------------------------------------------ 4
  - id: az400-qz-34-04
    objective: "3.4.4"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Woodgrove Bank uses Azure Repos. Two versions of an application are in production for different customers: version 5, built from the **release/5** branch, and version 6, built from the **release/6** branch. The **main** branch contains features that aren't ready for release. Like the Azure DevOps team, Woodgrove makes every fix in main first.

        A security bug affects both versions. The fix must reach both production versions and the next release, and no other change may move between main and the release branches.

        What should you do?
      fr: |
        Woodgrove Bank utilise Azure Repos. Deux versions d'une application sont en production pour des clients différents : la version 5, buildée à partir de la branche **release/5**, et la version 6, buildée à partir de la branche **release/6**. La branche **main** contient des fonctionnalités qui ne sont pas prêtes à être publiées. Comme l'équipe Azure DevOps, Woodgrove fait chaque correctif d'abord dans main.

        Un bogue de sécurité affecte les deux versions. Le correctif doit atteindre les deux versions en production et la prochaine version, et aucune autre modification ne doit passer entre main et les branches de mise en production.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Merge the fix into main by pull request, then merge main into release/5 and release/6 by pull request.", fr: "Fusionner le correctif dans main par demande de tirage, puis fusionner main dans release/5 et release/6 par demande de tirage." } }
        - { id: b, text: { en: "Merge the fix into main by pull request, then cherry-pick its commit into release/5 and release/6 through pull requests.", fr: "Fusionner le correctif dans main par demande de tirage, puis sélectionner (cherry-pick) son commit dans release/5 et release/6 par des demandes de tirage." } }
        - { id: c, text: { en: "Merge the fix into release/6 by pull request, then merge release/6 into release/5 and into main.", fr: "Fusionner le correctif dans release/6 par demande de tirage, puis fusionner release/6 dans release/5 et dans main." } }
        - { id: d, text: { en: "Merge the fix into main by pull request, then rebase release/5 and release/6 onto main and force-push them.", fr: "Fusionner le correctif dans main par demande de tirage, puis rebaser release/5 et release/6 sur main et les pousser de force." } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          Fixing main first and then porting the change with a cherry-pick copies only the fix commit to each release branch. Each port goes through a new branch created from the release branch and a pull request, so the usual branch policies still apply, and the next release, built from main, already contains the fix.
        fr: |
          Corriger d'abord main puis reporter la modification par cherry-pick ne copie que le commit du correctif dans chaque branche de mise en production. Chaque report passe par une nouvelle branche créée à partir de la branche de mise en production et par une demande de tirage : les stratégies de branche habituelles s'appliquent toujours, et la prochaine version, buildée à partir de main, contient déjà le correctif.
      options:
        a: { en: "Merging main into the release branches also brings the unreleased features of main into production.", fr: "Fusionner main dans les branches de mise en production apporte aussi en production les fonctionnalités non publiées de main." }
        c: { en: "This doesn't fix main first, and merging release/6 carries its release-specific changes into release/5 and main.", fr: "Cela ne corrige pas main d'abord, et fusionner release/6 transporte ses modifications propres à la version dans release/5 et dans main." }
        d: { en: "Rebasing onto main brings its unreleased features into the release branches and rewrites their shared history.", fr: "Rebaser sur main apporte ses fonctionnalités non publiées dans les branches de mise en production et réécrit leur historique partagé." }
    references:
      - title: Adopt a Git branching strategy
        url: https://learn.microsoft.com/en-us/azure/devops/repos/git/git-branching-guidance

  # ------------------------------------------------------------------ 5
  - id: az400-qz-34-05
    objective: "3.4.2"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Adatum deploys a Bicep file named **main.bicep** to a resource group from a pipeline. The file declares an App Service plan with the symbolic name `plan` and a web app with the symbolic name `site`. The web app sets its plan as follows:

        ```text
        serverFarmId: '/subscriptions/${subscription().subscriptionId}/resourceGroups/${resourceGroup().name}/providers/Microsoft.Web/serverfarms/plan-adatum'
        ```

        In new environments, some deployments fail because Resource Manager starts to create the web app before the plan exists. Both resources must stay in the same Bicep file and the same deployment.

        What should you do?
      fr: |
        Adatum déploie un fichier Bicep nommé **main.bicep** dans un groupe de ressources depuis un pipeline. Le fichier déclare un plan App Service de nom symbolique `plan` et une application web de nom symbolique `site`. L'application web définit son plan comme suit :

        ```text
        serverFarmId: '/subscriptions/${subscription().subscriptionId}/resourceGroups/${resourceGroup().name}/providers/Microsoft.Web/serverfarms/plan-adatum'
        ```

        Dans les nouveaux environnements, certains déploiements échouent parce que Resource Manager commence à créer l'application web avant que le plan existe. Les deux ressources doivent rester dans le même fichier Bicep et dans le même déploiement.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Add `dependsOn: [ site ]` to the App Service plan.", fr: "Ajouter `dependsOn: [ site ]` au plan App Service." } }
        - { id: b, text: { en: "Add the `@batchSize(1)` decorator to the web app.", fr: "Ajouter le décorateur `@batchSize(1)` à l'application web." } }
        - { id: c, text: { en: "Add `retryCountOnTaskFailure: 3` to the deployment task.", fr: "Ajouter `retryCountOnTaskFailure: 3` à la tâche de déploiement." } }
        - { id: d, text: { en: "Set `serverFarmId: plan.id` in the web app.", fr: "Définir `serverFarmId: plan.id` dans l'application web." } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          A string doesn't tell Resource Manager that the web app needs the plan, so both resources are deployed in parallel. Referencing the symbolic name `plan` creates an implicit dependency: the plan is created first. Bicep recommends implicit dependencies through symbolic references and keeps explicit `dependsOn` for the rare cases where no reference exists.
        fr: |
          Une chaîne n'indique pas à Resource Manager que l'application web a besoin du plan : les deux ressources sont donc déployées en parallèle. Référencer le nom symbolique `plan` crée une dépendance implicite : le plan est créé d'abord. Bicep recommande les dépendances implicites par références symboliques et réserve `dependsOn` explicite aux rares cas sans référence.
      options:
        a: { en: "This dependency goes the wrong way: the plan would wait for the web app, which still needs the plan first.", fr: "Cette dépendance va dans le mauvais sens : le plan attendrait l'application web, qui a pourtant besoin du plan d'abord." }
        b: { en: "`@batchSize()` applies only to resource or module loops, to limit parallel copies; it doesn't order two different resources.", fr: "`@batchSize()` ne s'applique qu'aux boucles de ressources ou de modules, pour limiter les copies en parallèle ; il n'ordonne pas deux ressources différentes." }
        c: { en: "Retrying the task only hides the race condition; the order of creation stays unreliable.", fr: "Relancer la tâche ne fait que masquer la concurrence ; l'ordre de création reste non fiable." }
    references:
      - title: Set resource dependencies in Bicep
        url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/bicep/resource-dependencies

  # ------------------------------------------------------------------ 6
  - id: az400-qz-34-06
    objective: "3.4.8"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Contoso deploys the schema of an Azure SQL database named **sqldb-claims**, on the logical server **sql-claims**, from a YAML pipeline in Azure Pipelines. The deployment job runs the `SqlAzureDacpacDeployment@1` task on the Microsoft-hosted `windows-latest` image, with a service connection that uses workload identity federation.

        The security team has just created a private endpoint for sql-claims in a virtual network named **vnet-data** and selected **Deny public network access** on the server. Public access must stay denied at all times, including during deployments. Since this change, the task fails with an error stating that the public network interface of the server isn't accessible.

        You need the pipeline to deploy the DACPAC again. What should you do?
      fr: |
        Contoso déploie le schéma d'une base de données Azure SQL nommée **sqldb-claims**, sur le serveur logique **sql-claims**, depuis un pipeline YAML d'Azure Pipelines. Le travail de déploiement exécute la tâche `SqlAzureDacpacDeployment@1` sur l'image hébergée par Microsoft `windows-latest`, avec une connexion de service qui utilise la fédération d'identité de charge de travail.

        L'équipe de sécurité vient de créer un point de terminaison privé pour sql-claims dans un réseau virtuel nommé **vnet-data** et de sélectionner **Refuser l'accès au réseau public** sur le serveur. L'accès public doit rester refusé en permanence, y compris pendant les déploiements. Depuis ce changement, la tâche échoue avec une erreur indiquant que l'interface réseau publique du serveur n'est pas accessible.

        Vous devez faire en sorte que le pipeline déploie de nouveau le DACPAC. Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Add `AzurePowerShell@5` steps that create a firewall rule for the agent's IP address before the task and delete it afterward.", fr: "Ajouter des étapes `AzurePowerShell@5` qui créent une règle de pare-feu pour l'adresse IP de l'agent avant la tâche et la suppriment ensuite." } }
        - { id: b, text: { en: "Turn on **Allow Azure services and resources to access this server**, because Microsoft-hosted agents run in Azure.", fr: "Activer **Autoriser les services et les ressources Azure à accéder à ce serveur**, car les agents hébergés par Microsoft s'exécutent dans Azure." } }
        - { id: c, text: { en: "Run the job on a self-hosted agent installed on a Windows VM in a virtual network that is peered with vnet-data and linked to the private DNS zone of the endpoint.", fr: "Exécuter le travail sur un agent auto-hébergé installé sur une machine virtuelle Windows d'un réseau virtuel relié à vnet-data par un peering et lié à la zone DNS privée du point de terminaison." } }
        - { id: d, text: { en: "Set the `AuthenticationType` input of the task to `servicePrincipal`, so that it signs in with the service connection identity.", fr: "Définir l'entrée `AuthenticationType` de la tâche sur `servicePrincipal`, afin qu'elle se connecte avec l'identité de la connexion de service." } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          When public network access is denied, the server accepts connections only through its private endpoints. The agent must therefore run where it has line of sight to vnet-data, and the server's FQDN must resolve to the private IP address. A self-hosted Windows agent in or connected to vnet-data meets this, and Windows is also what `SqlAzureDacpacDeployment@1` requires.
        fr: |
          Quand l'accès au réseau public est refusé, le serveur n'accepte les connexions que par ses points de terminaison privés. L'agent doit donc s'exécuter là où il a une visibilité réseau sur vnet-data, et le nom de domaine complet du serveur doit être résolu vers l'adresse IP privée. Un agent Windows auto-hébergé dans vnet-data, ou connecté à celui-ci, y répond ; Windows est aussi ce qu'exige `SqlAzureDacpacDeployment@1`.
      options:
        a: { en: "Firewall rules apply to the public endpoint, and they can't even be created or changed while public network access is denied.", fr: "Les règles de pare-feu s'appliquent au point de terminaison public, et elles ne peuvent même pas être créées ni modifiées tant que l'accès au réseau public est refusé." }
        b: { en: "This setting allows Azure traffic through the public endpoint, which stays closed while public network access is denied.", fr: "Ce paramètre autorise le trafic Azure par le point de terminaison public, qui reste fermé tant que l'accès au réseau public est refusé." }
        d: { en: "The failure is a network path problem, not an authentication problem: no sign-in method reaches a closed public endpoint.", fr: "L'échec vient du chemin réseau, pas de l'authentification : aucune méthode de connexion n'atteint un point de terminaison public fermé." }
    references:
      - title: Azure Private Link for Azure SQL Database
        url: https://learn.microsoft.com/en-us/azure/azure-sql/database/private-endpoint-overview
      - title: Azure Pipelines agents
        url: https://learn.microsoft.com/en-us/azure/devops/pipelines/agents/agents

  # ------------------------------------------------------------------ 7
  - id: az400-qz-34-07
    objective: "3.4.7"
    difficulty: 3
    status: draft
    type: dropdown
    stem:
      en: |
        Proseware releases an API named **orders** to two container apps in Azure Container Apps, **ca-orders-test** and **ca-orders-prod**, by using the GitHub Actions workflow shown in the answer area. The workflow must meet the following requirements:

        - The image is built once per run, in the Azure Container Registry **crproseware**, and tagged with the commit SHA.
        - ca-orders-prod is updated only after the deploy-test job succeeds.
        - ca-orders-prod is updated only after a member of the release team approves the run. The release team is configured as the required reviewers of the GitHub environment **production**.
        - ca-orders-prod runs exactly the image that was tested in ca-orders-test, without rebuilding it.

        How should you complete the workflow? Select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Proseware publie une API nommée **orders** vers deux applications conteneur d'Azure Container Apps, **ca-orders-test** et **ca-orders-prod**, à l'aide du workflow GitHub Actions présenté dans la zone de réponse. Le workflow doit répondre aux exigences suivantes :

        - L'image est buildée une seule fois par exécution, dans l'Azure Container Registry **crproseware**, et porte comme balise le SHA du commit.
        - ca-orders-prod n'est mise à jour qu'après la réussite du job deploy-test.
        - ca-orders-prod n'est mise à jour qu'après l'approbation de l'exécution par un membre de l'équipe de mise en production. Cette équipe est configurée comme réviseurs requis de l'environnement GitHub **production**.
        - ca-orders-prod exécute exactement l'image testée dans ca-orders-test, sans la rebuilder.

        Comment devez-vous compléter le workflow ? Sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: code
      language: yaml
      template: |
        on:
          push:
            branches: [ main ]
        permissions:
          id-token: write
          contents: read
        jobs:
          build:
            runs-on: ubuntu-latest
            steps:
            - uses: actions/checkout@v4
            - uses: azure/login@v2
              with:
                client-id: ${{ secrets.AZURE_CLIENT_ID }}
                tenant-id: ${{ secrets.AZURE_TENANT_ID }}
                subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
            - run: az acr build --registry crproseware --image orders:${{ github.sha }} ./src
          deploy-test:
            needs: build
            runs-on: ubuntu-latest
            steps:
            - run: echo "Steps that deploy the image to ca-orders-test (omitted)"
          deploy-prod:
            [[order]]
            [[gate]]
            runs-on: ubuntu-latest
            steps:
            - uses: azure/login@v2
              with:
                client-id: ${{ secrets.AZURE_CLIENT_ID }}
                tenant-id: ${{ secrets.AZURE_TENANT_ID }}
                subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
            - uses: azure/container-apps-deploy-action@v1
              with:
                acrName: crproseware
                containerAppName: ca-orders-prod
                resourceGroup: rg-orders-prod
                [[input]]: crproseware.azurecr.io/orders:${{ github.sha }}
      slots:
        - id: order
          options:
            - { id: oBuild, text: "needs: build" }
            - { id: oTest, text: "needs: deploy-test" }
            - { id: oIf, text: "if: success()" }
            - { id: oConc, text: "concurrency: deploy-test" }
        - id: gate
          options:
            - { id: gConc, text: "concurrency: production" }
            - { id: gRef, text: "if: github.ref == 'refs/heads/main'" }
            - { id: gEnv, text: "environment: production" }
            - { id: gTimeout, text: "timeout-minutes: 60" }
        - id: input
          options:
            - { id: iSource, text: appSourcePath }
            - { id: iRegistry, text: registryUrl }
            - { id: iImage, text: imageToDeploy }
    answer:
      values: { order: oTest, gate: gEnv, input: iImage }
    explanation:
      correct:
        en: |
          `needs: deploy-test` makes deploy-prod wait for deploy-test and skips it if deploy-test fails. `environment: production` makes the job wait for the protection rules of the environment, here the approval of a required reviewer. `imageToDeploy` deploys the existing image tagged with the commit SHA, the one built once and tested, instead of building a new one.
        fr: |
          `needs: deploy-test` fait attendre deploy-prod jusqu'à la fin de deploy-test et l'ignore si deploy-test échoue. `environment: production` fait attendre le job jusqu'à ce que les règles de protection de l'environnement soient satisfaites, ici l'approbation d'un réviseur requis. `imageToDeploy` déploie l'image existante portant la balise du SHA du commit, celle buildée une fois et testée, au lieu d'en builder une nouvelle.
      options:
        oBuild: { en: "With `needs: build`, deploy-prod runs in parallel with deploy-test, before the test result is known.", fr: "Avec `needs: build`, deploy-prod s'exécute en parallèle de deploy-test, avant que le résultat du test soit connu." }
        oIf: { en: "Without `needs`, the job has no dependency and starts with the first jobs; `if: success()` doesn't create an order.", fr: "Sans `needs`, le job n'a pas de dépendance et démarre avec les premiers jobs ; `if: success()` ne crée pas d'ordre." }
        oConc: { en: "`concurrency` prevents runs of the same group from overlapping; it doesn't make a job wait for another job.", fr: "`concurrency` empêche les exécutions d'un même groupe de se chevaucher ; il ne fait pas attendre un job par un autre." }
        gConc: { en: "A concurrency group named production doesn't apply the required reviewers of the production environment.", fr: "Un groupe de concurrence nommé production n'applique pas les réviseurs requis de l'environnement production." }
        gRef: { en: "A branch condition filters runs but never waits for an approval.", fr: "Une condition de branche filtre les exécutions, mais n'attend jamais d'approbation." }
        gTimeout: { en: "A timeout limits the duration of the job; it doesn't request any approval.", fr: "Un délai d'expiration limite la durée du job ; il ne demande aucune approbation." }
        iSource: { en: "`appSourcePath` makes the action build a new image from the source, which breaks the build-once requirement.", fr: "`appSourcePath` fait builder par l'action une nouvelle image à partir du code source, ce qui enfreint l'exigence d'un build unique." }
        iRegistry: { en: "`registryUrl` names the server of a non-ACR registry; it doesn't select the image to deploy.", fr: "`registryUrl` désigne le serveur d'un registre autre qu'ACR ; il ne sélectionne pas l'image à déployer." }
    references:
      - title: Deploy to Azure Container Apps with GitHub Actions
        url: https://learn.microsoft.com/en-us/azure/container-apps/github-actions
      - title: Authenticate to Azure from GitHub Actions by OpenID Connect
        url: https://learn.microsoft.com/en-us/azure/developer/github/connect-from-azure-openid-connect

  # ------------------------------------------------------------------ 8
  - id: az400-qz-34-08
    objective: "3.4.3"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        Litware has a web app named **app-claims** in Azure App Service, in the Premium v3 tier, with a slot named **staging**. The production slot and the staging slot both have a system-assigned managed identity. A key vault named **kv-claims** uses Azure RBAC, and the identity of the staging slot has the Key Vault Secrets User role on it.

        Release 12 adds an app setting named `PaymentKey`, whose value is a Key Vault reference to a secret in kv-claims. The pipeline added the setting to the staging slot only, without marking it as a deployment slot setting, and the tests in staging passed. After the swap, the Key Vault reference of PaymentKey fails to resolve in production.

        You need PaymentKey to resolve in production after this swap and after the following ones. Both slots must keep using kv-claims, and the solution must follow the principle of least privilege.

        What should you do? Each correct answer presents a complete solution.

        NOTE: Each correct selection is worth one point.
      fr: |
        Litware dispose d'une application web nommée **app-claims** dans Azure App Service, au niveau Premium v3, avec un emplacement nommé **staging**. L'emplacement de production et l'emplacement staging ont tous deux une identité managée affectée par le système. Un coffre de clés nommé **kv-claims** utilise Azure RBAC, et l'identité de l'emplacement staging y détient le rôle Key Vault Secrets User.

        La version 12 ajoute un paramètre d'application nommé `PaymentKey`, dont la valeur est une référence Key Vault à un secret de kv-claims. Le pipeline a ajouté le paramètre à l'emplacement staging uniquement, sans le marquer comme paramètre d'emplacement de déploiement, et les tests dans staging ont réussi. Après l'échange, la référence Key Vault de PaymentKey ne se résout pas en production.

        Vous devez faire en sorte que PaymentKey se résolve en production après cet échange et après les suivants. Les deux emplacements doivent continuer à utiliser kv-claims, et la solution doit respecter le principe du moindre privilège.

        Que devez-vous faire ? Chaque bonne réponse constitue une solution complète.

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "Assign the Key Vault Secrets User role on kv-claims to the system-assigned identity of the production slot.", fr: "Attribuer le rôle Key Vault Secrets User sur kv-claims à l'identité affectée par le système de l'emplacement de production." } }
        - { id: b, text: { en: "Mark PaymentKey as a deployment slot setting in the staging slot before the next swap.", fr: "Marquer PaymentKey comme paramètre d'emplacement de déploiement dans l'emplacement staging avant le prochain échange." } }
        - { id: c, text: { en: "Assign the Key Vault Administrator role on kv-claims to the identity of the staging slot.", fr: "Attribuer le rôle Key Vault Administrator sur kv-claims à l'identité de l'emplacement staging." } }
        - { id: d, text: { en: "Add a user-assigned identity that has Key Vault Secrets User on kv-claims to both slots and set it as their `keyVaultReferenceIdentity`.", fr: "Ajouter aux deux emplacements une identité affectée par l'utilisateur qui détient Key Vault Secrets User sur kv-claims et la définir comme leur `keyVaultReferenceIdentity`." } }
        - { id: e, text: { en: "Swap the slots with preview, so that the production settings are applied to staging before the routing changes.", fr: "Échanger les emplacements avec aperçu, afin que les paramètres de production soient appliqués à staging avant le changement de routage." } }
    answer: { optionIds: [a, d] }
    explanation:
      correct:
        en: |
          Managed identities aren't swapped: after the swap, production runs the new content with the identity of the production slot, which can't read kv-claims. Granting Key Vault Secrets User to that identity fixes it. Alternatively, a user-assigned identity with the role, added to both slots and set as `keyVaultReferenceIdentity`, resolves the reference in whichever slot holds the setting. Both keep a read-only secret role.
        fr: |
          Les identités managées ne sont pas échangées : après l'échange, la production exécute le nouveau contenu avec l'identité de l'emplacement de production, qui ne peut pas lire kv-claims. Attribuer Key Vault Secrets User à cette identité règle le problème. Autre solution : une identité affectée par l'utilisateur dotée de ce rôle, ajoutée aux deux emplacements et définie comme `keyVaultReferenceIdentity`, résout la référence dans l'emplacement qui porte le paramètre. Les deux gardent un rôle de lecture des secrets.
      options:
        b: { en: "A slot setting stays in its slot: PaymentKey would no longer move to production at all.", fr: "Un paramètre d'emplacement reste dans son emplacement : PaymentKey ne passerait plus du tout en production." }
        c: { en: "The staging identity doesn't follow the content to production, and Key Vault Administrator breaks least privilege.", fr: "L'identité de staging ne suit pas le contenu en production, et Key Vault Administrator enfreint le moindre privilège." }
        e: { en: "Swap with preview lets you validate before completing, but production still resolves the reference with its own identity, which has no access.", fr: "L'échange avec aperçu permet de valider avant de terminer, mais la production résout toujours la référence avec sa propre identité, qui n'a pas d'accès." }
    references:
      - title: Set up staging environments in Azure App Service
        url: https://learn.microsoft.com/en-us/azure/app-service/deploy-staging-slots
      - title: Use Key Vault references as app settings in Azure App Service, Azure Functions, and Azure Logic Apps (Standard)
        url: https://learn.microsoft.com/en-us/azure/app-service/app-service-key-vault-references

  # ------------------------------------------------------------------ 9
  - id: az400-qz-34-09
    objective: "3.4.5"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Tailspin Toys releases an order API to Azure App Service with a multi-stage YAML pipeline. A database stage applies the Entity Framework Core migrations of the release by running an idempotent script, then a stage deploys the API to a staging slot and swaps it into production.

        Release 9 contains a migration that splits the `Address` column of the `Customers` table into `Street` and `City`, then drops `Address`. The code of release 8, the previous version, reads `Address`.

        Three hours after the swap of release 9, customers report wrong discounts caused by a bug in the pricing code of release 9. Customers have created 2,000 accounts and orders since the swap. The pricing code isn't behind a feature flag. No customer data may be lost, and every production change must pass the approvals of the production environment.

        What should you do?
      fr: |
        Tailspin Toys publie une API de commandes vers Azure App Service avec un pipeline YAML multiphase. Une phase de base de données applique les migrations Entity Framework Core de la version en exécutant un script idempotent, puis une phase déploie l'API dans un emplacement de préproduction et l'échange avec la production.

        La version 9 contient une migration qui scinde la colonne `Address` de la table `Customers` en `Street` et `City`, puis supprime `Address`. Le code de la version 8, la version précédente, lit `Address`.

        Trois heures après l'échange de la version 9, des clients signalent des remises erronées dues à un bogue dans le code de tarification de la version 9. Les clients ont créé 2 000 comptes et commandes depuis l'échange. Le code de tarification n'est pas derrière un indicateur de fonctionnalité. Aucune donnée client ne doit être perdue, et chaque modification de la production doit passer par les approbations de l'environnement de production.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Swap the slots again, so that release 8 serves production while the pricing bug is fixed.", fr: "Échanger de nouveau les emplacements, afin que la version 8 serve la production pendant la correction du bogue." } }
        - { id: b, text: { en: "Restore the database to a point in time before the migration, then swap the slots again.", fr: "Restaurer la base de données à un instant antérieur à la migration, puis échanger de nouveau les emplacements." } }
        - { id: c, text: { en: "Rerun the production stages of the last release 8 run, to redeploy its artifact and its migration script.", fr: "Réexécuter les phases de production de la dernière exécution de la version 8, pour redéployer son artefact et son script de migration." } }
        - { id: d, text: { en: "Fix the pricing code in a hotfix branch and deploy the fix through the pipeline as a new release.", fr: "Corriger le code de tarification dans une branche de correctif et déployer le correctif par le pipeline comme nouvelle version." } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          The release 9 migration isn't backward compatible, so the previous version can't run on the current schema and no rollback is possible without losing data. Rolling forward with a hotfix keeps the new schema and the data written since the release, and deploying it through the same pipeline keeps the production approvals.
        fr: |
          La migration de la version 9 n'est pas rétrocompatible : la version précédente ne peut pas fonctionner avec le schéma actuel, et aucune restauration n'est possible sans perte de données. Avancer avec un correctif (roll forward) conserve le nouveau schéma et les données écrites depuis la mise en production, et le déployer par le même pipeline conserve les approbations de production.
      options:
        a: { en: "Release 8 reads the `Address` column, which no longer exists: production would fail on every customer read.", fr: "La version 8 lit la colonne `Address`, qui n'existe plus : la production échouerait à chaque lecture d'un client." }
        b: { en: "A point-in-time restore before the migration loses the accounts and orders created during the last three hours.", fr: "Une restauration à un instant antérieur à la migration perd les comptes et les commandes créés pendant les trois dernières heures." }
        c: { en: "An idempotent script only applies the migrations that are missing; it doesn't revert the release 9 migration, so `Address` doesn't come back.", fr: "Un script idempotent n'applique que les migrations manquantes ; il n'annule pas la migration de la version 9, donc `Address` ne revient pas." }
    references:
      - title: Architecture strategies for safe deployment practices
        url: https://learn.microsoft.com/en-us/azure/well-architected/operational-excellence/safe-deployments

  # ------------------------------------------------------------------ 10
  - id: az400-qz-34-10
    objective: "3.4.6"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        Northwind Traders has an ASP.NET Core web app that contains the following code:

        ```text
        builder.Configuration.AddAzureAppConfiguration(options =>
        {
            options.Connect(new Uri(endpoint), new DefaultAzureCredential())
                   .Select("Shop:*", "Production");
            options.UseFeatureFlags();
        });
        builder.Services.AddAzureAppConfiguration();
        builder.Services.AddFeatureManagement();
        var app = builder.Build();
        app.UseAzureAppConfiguration();
        ```

        The App Configuration store contains the following feature flags. The app checks the feature with `IsEnabledAsync("BulkOrder")`.

        | Flag | Label | State | Filter |
        | --- | --- | --- | --- |
        | BulkOrder | (No label) | Enabled | `Microsoft.TimeWindow`, `Start` set to next Monday, no `End` |
        | BulkOrder | Production | Enabled | None |

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Northwind Traders dispose d'une application web ASP.NET Core qui contient le code suivant :

        ```text
        builder.Configuration.AddAzureAppConfiguration(options =>
        {
            options.Connect(new Uri(endpoint), new DefaultAzureCredential())
                   .Select("Shop:*", "Production");
            options.UseFeatureFlags();
        });
        builder.Services.AddAzureAppConfiguration();
        builder.Services.AddFeatureManagement();
        var app = builder.Build();
        app.UseAzureAppConfiguration();
        ```

        Le magasin App Configuration contient les indicateurs de fonctionnalités suivants. L'application teste la fonctionnalité avec `IsEnabledAsync("BulkOrder")`.

        | Indicateur | Étiquette | État | Filtre |
        | --- | --- | --- | --- |
        | BulkOrder | (Aucune étiquette) | Activé | `Microsoft.TimeWindow`, `Start` fixé à lundi prochain, sans `End` |
        | BulkOrder | Production | Activé | Aucun |

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text: { en: "Before next Monday, the app evaluates BulkOrder as enabled.", fr: "Avant lundi prochain, l'application évalue BulkOrder comme activé." }
        - id: s2
          text: { en: "From next Monday, the app evaluates BulkOrder as enabled, without any change to the store or to the app.", fr: "À partir de lundi prochain, l'application évalue BulkOrder comme activé, sans aucune modification du magasin ni de l'application." }
        - id: s3
          text: { en: "After an operator disables the BulkOrder flag that has no label, running instances can keep evaluating it as enabled until the 30-second default refresh interval has passed.", fr: "Après qu'un opérateur a désactivé l'indicateur BulkOrder sans étiquette, les instances en cours d'exécution peuvent continuer à l'évaluer comme activé jusqu'à l'expiration de l'intervalle d'actualisation par défaut de 30 secondes." }
    answer:
      values: { s1: false, s2: true, s3: true }
    explanation:
      correct:
        en: |
          `UseFeatureFlags()` without parameters loads the feature flags that have no label; the label of `Select` applies to the regular key-values only. The app therefore uses the BulkOrder flag without label, whose `Microsoft.TimeWindow` filter keeps it off until next Monday and then turns it on with no end date; this filter is registered by `AddFeatureManagement()`. Feature flags are refreshed every 30 seconds by default, so a change in the store reaches running instances after that interval.
        fr: |
          `UseFeatureFlags()` sans paramètre charge les indicateurs de fonctionnalités sans étiquette ; l'étiquette de `Select` ne s'applique qu'aux paires clé-valeur ordinaires. L'application utilise donc l'indicateur BulkOrder sans étiquette, dont le filtre `Microsoft.TimeWindow` le garde désactivé jusqu'à lundi prochain, puis l'active sans date de fin ; ce filtre est enregistré par `AddFeatureManagement()`. Les indicateurs sont actualisés toutes les 30 secondes par défaut : une modification dans le magasin atteint les instances en cours d'exécution après cet intervalle.
      options:
        s1: { en: "The Production flag, which has no filter, isn't loaded: only the flag without label is, and its time window hasn't started.", fr: "L'indicateur Production, sans filtre, n'est pas chargé : seul l'indicateur sans étiquette l'est, et sa fenêtre de temps n'a pas commencé." }
    references:
      - title: Quickstart for adding feature flags to ASP.NET Core apps
        url: https://learn.microsoft.com/en-us/azure/azure-app-configuration/quickstart-feature-flag-aspnet-core
      - title: .NET feature management
        url: https://learn.microsoft.com/en-us/azure/azure-app-configuration/feature-management-dotnet-reference
