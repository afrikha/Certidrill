chapter: 31-package-management
questions:
  # ------------------------------------------------------------------ 1
  - id: az400-qz-31-01
    objective: "3.1.2"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        A CI pipeline publishes version **2.3.0** of a NuGet package to an Azure Artifacts feed named **core-libs**. Nobody has promoted the version yet, and the views of the feed keep their default settings.

        In which view of core-libs is version 2.3.0 available?
      fr: |
        Un pipeline de CI publie la version **2.3.0** d'un package NuGet dans un flux Azure Artifacts nommé **core-libs**. Personne n'a encore promu cette version, et les vues du flux conservent leurs paramètres par défaut.

        Dans quelle vue de core-libs la version 2.3.0 est-elle disponible ?
    body:
      options:
        - { id: a, text: "@Local" }
        - { id: b, text: "@Prerelease" }
        - { id: c, text: "@Release" }
        - { id: d, text: { en: "None until it is promoted", fr: "Aucune tant qu'elle n'est pas promue" } }
    answer: { optionId: a }
    explanation:
      correct:
        en: |
          Packages are always published to the feed itself, and @Local contains everything published directly to the feed plus everything saved from upstream sources. @Prerelease and @Release contain only the versions that a Feed Publisher (Contributor) promoted to them.
        fr: |
          Les packages sont toujours publiés dans le flux lui-même, et @Local contient tout ce qui est publié directement dans le flux plus tout ce qui est enregistré depuis les sources en amont. @Prerelease et @Release ne contiennent que les versions qu'un Feed Publisher (Contributor) y a promues.
      options:
        b: { en: "A version appears in @Prerelease only after someone promotes it to that view.", fr: "Une version n'apparaît dans @Prerelease qu'après avoir été promue vers cette vue." }
        c: { en: "A version appears in @Release only after someone promotes it to that view.", fr: "Une version n'apparaît dans @Release qu'après avoir été promue vers cette vue." }
        d: { en: "A published version is immediately part of @Local, the default view of the feed.", fr: "Une version publiée fait immédiatement partie d'@Local, la vue par défaut du flux." }
    references:
      - title: What are feed views? - Azure Artifacts
        url: https://learn.microsoft.com/en-us/azure/devops/artifacts/concepts/views

  # ------------------------------------------------------------------ 2
  - id: az400-qz-31-02
    objective: "3.1.3"
    difficulty: 1
    status: draft
    type: single
    shuffle: false
    stem:
      en: |
        The package.json file of a web application contains the dependency `"chart-lib": "~4.7.2"`. The project has no package-lock.json file yet. The registry contains versions 4.7.2, 4.7.5, 4.8.0 and 5.0.0 of chart-lib.

        Which version does `npm install` install?
      fr: |
        Le fichier package.json d'une application web contient la dépendance `"chart-lib": "~4.7.2"`. Le projet n'a pas encore de fichier package-lock.json. Le registre contient les versions 4.7.2, 4.7.5, 4.8.0 et 5.0.0 de chart-lib.

        Quelle version `npm install` installe-t-il ?
    body:
      options:
        - { id: a, text: "4.7.2" }
        - { id: b, text: "4.7.5" }
        - { id: c, text: "4.8.0" }
        - { id: d, text: "5.0.0" }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          The tilde accepts patch updates only: `~4.7.2` means 4.7.2 or later, below 4.8.0. npm installs the highest version in that range, 4.7.5.
        fr: |
          Le tilde n'accepte que les mises à jour de correctif : `~4.7.2` signifie 4.7.2 ou plus, en dessous de 4.8.0. npm installe la version la plus élevée de cette plage, 4.7.5.
      options:
        a: { en: "`~` isn't an exact version: npm takes the highest matching patch, not the lower bound.", fr: "`~` n'est pas une version exacte : npm prend le correctif correspondant le plus élevé, pas la borne inférieure." }
        c: { en: "4.8.0 is a new minor version, which the caret (`^4.7.2`) would accept but the tilde excludes.", fr: "4.8.0 est une nouvelle version mineure, que le caret (`^4.7.2`) accepterait mais que le tilde exclut." }
        d: { en: "5.0.0 is a new major version; neither `~4.7.2` nor `^4.7.2` accepts it.", fr: "5.0.0 est une nouvelle version majeure ; ni `~4.7.2` ni `^4.7.2` ne l'acceptent." }
    references:
      - title: Configure npm packages with package.json - Visual Studio (Windows)
        url: https://learn.microsoft.com/en-us/visualstudio/javascript/configure-packages-with-package-json

  # ------------------------------------------------------------------ 3
  - id: az400-qz-31-03
    objective: "3.1.1"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Fabrikam hosts its code in GitHub and builds it with GitHub Actions. The firmware team publishes internal Rust crates with cargo, and the web team publishes internal npm packages.

        The architects want a single private package service that hosts both kinds of packages and that the cargo and npm clients use natively.

        What should you recommend?
      fr: |
        Fabrikam héberge son code dans GitHub et le construit avec GitHub Actions. L'équipe firmware publie des crates Rust internes avec cargo, et l'équipe web publie des packages npm internes.

        Les architectes veulent un seul service de packages privé qui héberge les deux types de packages et que les clients cargo et npm utilisent nativement.

        Que devez-vous recommander ?
    body:
      options:
        - { id: a, text: { en: "GitHub Packages, with the npm registry and a registry for the crates", fr: "GitHub Packages, avec le registre npm et un registre pour les crates" } }
        - { id: b, text: { en: "An Azure Artifacts feed, with the Cargo and npm packages in the same feed", fr: "Un flux Azure Artifacts, avec les packages Cargo et npm dans le même flux" } }
        - { id: c, text: { en: "The GitHub Container registry, with each crate pushed as an OCI image", fr: "Le Container registry de GitHub, avec chaque crate poussée sous forme d'image OCI" } }
        - { id: d, text: { en: "Azure Container Registry, with one repository for each crate and package", fr: "Azure Container Registry, avec un référentiel pour chaque crate et chaque package" } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          Azure Artifacts supports NuGet, npm, Python, Maven, Cargo and Universal Packages, and a single feed can hold several package types. The cargo and npm clients connect to the feed's endpoints directly, and GitHub Actions workflows can publish to it.
        fr: |
          Azure Artifacts prend en charge NuGet, npm, Python, Maven, Cargo et Universal Packages, et un même flux peut contenir plusieurs types de packages. Les clients cargo et npm se connectent directement aux points de terminaison du flux, et les workflows GitHub Actions peuvent y publier.
      options:
        a: { en: "GitHub Packages supports npm, NuGet, Maven, Gradle, RubyGems and container images, but it has no registry for Rust crates.", fr: "GitHub Packages prend en charge npm, NuGet, Maven, Gradle, RubyGems et les images de conteneur, mais il n'a pas de registre pour les crates Rust." }
        c: { en: "The Container registry stores Docker and OCI images; the cargo client can't use it as a crate registry.", fr: "Le Container registry stocke des images Docker et OCI ; le client cargo ne peut pas l'utiliser comme registre de crates." }
        d: { en: "Azure Container Registry is a registry for container images and OCI artifacts, not a cargo or npm registry.", fr: "Azure Container Registry est un registre d'images de conteneur et d'artefacts OCI, pas un registre cargo ou npm." }
    references:
      - title: What is Azure Artifacts? - Azure Artifacts
        url: https://learn.microsoft.com/en-us/azure/devops/artifacts/start-using-azure-artifacts
      - title: Publish Packages - Training
        url: https://learn.microsoft.com/en-us/training/modules/introduction-github-packages/2-publish-packages

  # ------------------------------------------------------------------ 4
  - id: az400-qz-31-04
    objective: "3.1.2"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Contoso has an Azure Artifacts feed named **core-libs** whose retention policy is set to **Maximum number of versions per package**: 10 and **Days to keep recently downloaded packages**: 30. No version has been promoted to a view.

        The feed contains ten versions of the package **Contoso.Maps**, 1.0.0 to 1.9.0. A legacy service still downloads 1.0.0 every day, 1.1.0 was last downloaded 60 days ago, and every other version was downloaded during the last week. A pipeline then publishes version 2.0.0.

        Which version or versions does the next retention cleanup delete?
      fr: |
        Contoso dispose d'un flux Azure Artifacts nommé **core-libs** dont la stratégie de rétention est définie avec **Maximum number of versions per package** : 10 et **Days to keep recently downloaded packages** : 30. Aucune version n'a été promue vers une vue.

        Le flux contient dix versions du package **Contoso.Maps**, de 1.0.0 à 1.9.0. Un service ancien télécharge toujours 1.0.0 chaque jour, 1.1.0 a été téléchargée pour la dernière fois il y a 60 jours, et toutes les autres versions ont été téléchargées au cours de la dernière semaine. Un pipeline publie ensuite la version 2.0.0.

        Quelle version ou quelles versions le prochain nettoyage de rétention supprime-t-il ?
    body:
      options:
        - { id: a, text: { en: "1.0.0 only", fr: "1.0.0 uniquement" } }
        - { id: b, text: { en: "1.1.0 only", fr: "1.1.0 uniquement" } }
        - { id: c, text: { en: "1.0.0 and 1.1.0", fr: "1.0.0 et 1.1.0" } }
        - { id: d, text: { en: "No version", fr: "Aucune version" } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          A retention policy deletes a package version only when both conditions are true: the package has reached the maximum number of versions, and that version hasn't been downloaded within the configured number of days. With 2.0.0, Contoso.Maps exceeds ten versions, and 1.1.0 is the only version not downloaded for 30 days; 1.0.0 is old but recently downloaded, so it stays. The deleted version goes to the Recycle Bin.
        fr: |
          Une stratégie de rétention ne supprime une version de package que si les deux conditions sont réunies : le package a atteint le nombre maximal de versions, et cette version n'a pas été téléchargée pendant le nombre de jours configuré. Avec 2.0.0, Contoso.Maps dépasse dix versions, et 1.1.0 est la seule version non téléchargée depuis 30 jours ; 1.0.0 est ancienne mais téléchargée récemment, elle est donc conservée. La version supprimée part dans la Corbeille.
      options:
        a: { en: "Being the oldest version isn't enough: 1.0.0 was downloaded within the last 30 days, so retention keeps it.", fr: "Être la plus ancienne version ne suffit pas : 1.0.0 a été téléchargée au cours des 30 derniers jours, la rétention la conserve donc." }
        c: { en: "1.0.0 doesn't meet the download condition, so only one of the two versions is deleted.", fr: "1.0.0 ne remplit pas la condition de téléchargement : une seule des deux versions est donc supprimée." }
        d: { en: "The download condition is evaluated for each version, not only for the oldest one: 1.1.0 meets both conditions.", fr: "La condition de téléchargement s'évalue pour chaque version, pas seulement pour la plus ancienne : 1.1.0 remplit les deux conditions." }
    references:
      - title: Delete and recover packages - Azure Artifacts
        url: https://learn.microsoft.com/en-us/azure/devops/artifacts/how-to/delete-and-recover-packages

  # ------------------------------------------------------------------ 5
  - id: az400-qz-31-05
    objective: "3.1.4"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Each run of a GitHub Actions workflow in the repository **web-portal** uploads two artifacts: the deployable package, which must stay available for the retention period that the repository currently uses, and a 2 GB folder of test screenshots, which the testers need for five days only.

        You need to reduce the storage used by the screenshots. The retention of every other artifact of the repository must not change. What should you do?
      fr: |
        Chaque exécution d'un workflow GitHub Actions du dépôt **web-portal** charge deux artefacts : le package déployable, qui doit rester disponible pendant la période de rétention que le dépôt utilise actuellement, et un dossier de 2 Go de captures d'écran de test, dont les testeurs n'ont besoin que pendant cinq jours.

        Vous devez réduire le stockage utilisé par les captures d'écran. La rétention de tous les autres artefacts du dépôt ne doit pas changer. Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Add `retention-days: 5` to the `actions/upload-artifact` step that uploads the screenshots.", fr: "Ajouter `retention-days: 5` à l'étape `actions/upload-artifact` qui charge les captures d'écran." } }
        - { id: b, text: { en: "Set the artifact and log retention of web-portal to 5 days in the Actions settings of the repository.", fr: "Définir la rétention des artefacts et des journaux de web-portal sur 5 jours dans les paramètres Actions du dépôt." } }
        - { id: c, text: { en: "Add `overwrite: true` to the `actions/upload-artifact` step that uploads the screenshots.", fr: "Ajouter `overwrite: true` à l'étape `actions/upload-artifact` qui charge les captures d'écran." } }
        - { id: d, text: { en: "Save the screenshots with `actions/cache`, with a cache key that contains the run number.", fr: "Enregistrer les captures d'écran avec `actions/cache`, avec une clé de cache qui contient le numéro d'exécution." } }
    answer: { optionId: a }
    explanation:
      correct:
        en: |
          The `retention-days` input of `actions/upload-artifact` sets the retention of that artifact only, within the limit allowed by the repository. The screenshots are deleted after five days, while the deployable package keeps the repository's retention period.
        fr: |
          L'entrée `retention-days` d'`actions/upload-artifact` définit la rétention de cet artefact uniquement, dans la limite autorisée par le dépôt. Les captures d'écran sont supprimées après cinq jours, tandis que le package déployable conserve la période de rétention du dépôt.
      options:
        b: { en: "The repository setting changes the retention of every artifact and log of the repository, including the deployable package.", fr: "Le paramètre du dépôt modifie la rétention de tous les artefacts et journaux du dépôt, y compris le package déployable." }
        c: { en: "`overwrite: true` replaces an artifact of the same name in the same run; it doesn't shorten how long the artifact is kept.", fr: "`overwrite: true` remplace un artefact de même nom dans la même exécution ; il ne raccourcit pas la durée de conservation de l'artefact." }
        d: { en: "The cache is meant for dependencies reused across runs, and a key per run creates a new cache entry each time instead of a five-day artifact.", fr: "Le cache est destiné aux dépendances réutilisées d'une exécution à l'autre, et une clé par exécution crée une nouvelle entrée de cache à chaque fois au lieu d'un artefact de cinq jours." }
    references:
      - title: Share Artifacts Between Jobs - Training
        url: https://learn.microsoft.com/en-us/training/modules/learn-continuous-integration-github-actions/4-share-artifacts-between-jobs

  # ------------------------------------------------------------------ 6
  - id: az400-qz-31-06
    objective: "3.1.2"
    difficulty: 3
    status: draft
    type: dropdown
    stem:
      en: |
        Contoso has an Azure DevOps organization named **contoso** that contains a project named **Retail**. In the settings of Retail, **Limit job authorization scope to current project for non-release pipelines** is enabled.

        A YAML pipeline of Retail must push NuGet packages to **retail-libs**, a project-scoped feed of Retail, by running `dotnet nuget push`. The feed still has its default permissions, and the first runs fail with a 403 error at the push step.

        The solution must follow the principle of least privilege and must not use a personal access token.

        How should you complete the configuration? Select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Contoso dispose d'une organisation Azure DevOps nommée **contoso** qui contient un projet nommé **Retail**. Dans les paramètres de Retail, **Limit job authorization scope to current project for non-release pipelines** est activé.

        Un pipeline YAML de Retail doit pousser des packages NuGet vers **retail-libs**, un flux délimité au projet Retail, en exécutant `dotnet nuget push`. Le flux a toujours ses autorisations par défaut, et les premières exécutions échouent avec une erreur 403 à l'étape de push.

        La solution doit respecter le principe du moindre privilège et ne doit pas utiliser de jeton d'accès personnel.

        Comment devez-vous compléter la configuration ? Sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: text
      template:
        en: |
          Feed settings of retail-libs: grant [[identity]] the [[role]] role.
          Pipeline: add a [[task]] step before the dotnet nuget push step.
        fr: |
          Paramètres du flux retail-libs : accorder à [[identity]] le rôle [[role]].
          Pipeline : ajouter une étape [[task]] avant l'étape dotnet nuget push.
      slots:
        - id: identity
          options:
            - { id: projbs, text: "Retail Build Service (contoso)" }
            - { id: pcbs, text: "Project Collection Build Service (contoso)" }
            - { id: pcbsa, text: "Project Collection Build Service Accounts" }
            - { id: contrib, text: "[Retail]\\Contributors" }
        - id: role
          options:
            - { id: reader, text: Feed Reader }
            - { id: collab, text: Feed and Upstream Reader (Collaborator) }
            - { id: publisher, text: Feed Publisher (Contributor) }
            - { id: owner, text: Feed Owner }
        - id: task
          options:
            - { id: auth, text: "NuGetAuthenticate@1" }
            - { id: installer, text: "NuGetToolInstaller@1" }
            - { id: npmauth, text: "npmAuthenticate@0" }
            - { id: download, text: "DownloadPipelineArtifact@2" }
    answer:
      values: { identity: projbs, role: publisher, task: auth }
    explanation:
      correct:
        en: |
          With the job authorization scope limited to the current project, the job runs as the project-level identity, Retail Build Service (contoso), so that identity is the one to configure. Build identities get Feed and Upstream Reader (Collaborator) by default, which can't publish: Feed Publisher (Contributor) is the lowest role that can. NuGetAuthenticate@1 then configures the NuGet credentials of the job with its access token, so no personal access token is needed.
        fr: |
          Avec l'autorisation de job limitée au projet actuel, le job s'exécute sous l'identité de niveau projet, Retail Build Service (contoso) : c'est donc cette identité qu'il faut configurer. Les identités de build reçoivent par défaut Feed and Upstream Reader (Collaborator), qui ne peut pas publier : Feed Publisher (Contributor) est le rôle le plus faible qui le peut. NuGetAuthenticate@1 configure ensuite les informations d'identification NuGet du job avec son jeton d'accès : aucun jeton d'accès personnel n'est nécessaire.
      options:
        pcbs: { en: "The collection-level identity is used only when the job authorization scope isn't limited to the project.", fr: "L'identité de niveau collection n'est utilisée que si l'autorisation de job n'est pas limitée au projet." }
        pcbsa: { en: "This group contains the collection-level build identities, not the identity that the Retail job uses, and grants access far beyond the pipeline.", fr: "Ce groupe contient les identités de build de niveau collection, pas l'identité qu'utilise le job de Retail, et accorde un accès bien au-delà du pipeline." }
        contrib: { en: "The pipeline doesn't run as a member of Contributors, and the role would apply to every developer of the project.", fr: "Le pipeline ne s'exécute pas en tant que membre de Contributors, et le rôle s'appliquerait à chaque développeur du projet." }
        collab: { en: "Collaborator is the default role of build identities: it can save packages from upstream sources but not publish, which causes the 403.", fr: "Collaborator est le rôle par défaut des identités de build : il peut enregistrer des packages depuis les sources en amont mais pas publier, d'où l'erreur 403." }
        owner: { en: "Feed Owner can publish but also manage the settings, permissions and upstream sources of the feed.", fr: "Feed Owner peut publier, mais aussi gérer les paramètres, les autorisations et les sources en amont du flux." }
        installer: { en: "NuGetToolInstaller@1 installs a version of nuget.exe; it doesn't provide credentials for the feed.", fr: "NuGetToolInstaller@1 installe une version de nuget.exe ; il ne fournit pas d'informations d'identification pour le flux." }
        npmauth: { en: "npmAuthenticate@0 authenticates npm clients through an .npmrc file, not dotnet nuget push.", fr: "npmAuthenticate@0 authentifie les clients npm via un fichier .npmrc, pas dotnet nuget push." }
    references:
      - title: Manage permissions - Azure Artifacts
        url: https://learn.microsoft.com/en-us/azure/devops/artifacts/feeds/feed-permissions
      - title: Understand job access tokens - Azure Pipelines
        url: https://learn.microsoft.com/en-us/azure/devops/pipelines/process/access-tokens

  # ------------------------------------------------------------------ 7
  - id: az400-qz-31-07
    objective: "3.1.4"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        Contoso has an Azure Pipelines YAML pipeline named **orders-ci** that starts with the following definition:

        ```yaml
        name: $(majorMinor).$(patch)
        variables:
          majorMinor: '3.2'
          patch: $[counter(format('{0}-{1}', variables['majorMinor'], variables['Build.Reason']), 0)]
        ```

        orders-ci runs for each push to main, with the Build.Reason value **IndividualCI**, and for pull request validation, with the value **PullRequest**. With majorMinor set to 3.2, it has completed four CI runs and two pull request runs. A new pipeline named **orders-release** was just created from the same YAML file and also runs for each push to main.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Contoso dispose d'un pipeline YAML Azure Pipelines nommé **orders-ci** qui commence par la définition suivante :

        ```yaml
        name: $(majorMinor).$(patch)
        variables:
          majorMinor: '3.2'
          patch: $[counter(format('{0}-{1}', variables['majorMinor'], variables['Build.Reason']), 0)]
        ```

        orders-ci s'exécute à chaque push vers main, avec la valeur de Build.Reason **IndividualCI**, et pour la validation des pull requests, avec la valeur **PullRequest**. Avec majorMinor défini sur 3.2, il a effectué quatre exécutions de CI et deux exécutions de pull request. Un nouveau pipeline nommé **orders-release** vient d'être créé à partir du même fichier YAML et s'exécute lui aussi à chaque push vers main.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text: { en: "The next pull request run of orders-ci is numbered 3.2.2.", fr: "La prochaine exécution de pull request d'orders-ci porte le numéro 3.2.2." }
        - id: s2
          text: { en: "The first run of orders-release is numbered 3.2.4.", fr: "La première exécution d'orders-release porte le numéro 3.2.4." }
        - id: s3
          text: { en: "If majorMinor is changed to 3.3 in orders-ci, the next CI run is numbered 3.3.0 and the next pull request run is numbered 3.3.1.", fr: "Si majorMinor passe à 3.3 dans orders-ci, la prochaine exécution de CI porte le numéro 3.3.0 et la prochaine exécution de pull request le numéro 3.3.1." }
    answer:
      values: { s1: true, s2: false, s3: false }
    explanation:
      correct:
        en: |
          `counter` keeps a separate value for each distinct prefix, starting at the seed. Here the prefix combines majorMinor and Build.Reason, so CI runs (3.2-IndividualCI) and pull request runs (3.2-PullRequest) have independent sequences: after two pull request runs (3.2.0 and 3.2.1), the next one is 3.2.2. Counters are also scoped to a pipeline, so orders-release starts its own sequence at 3.2.0. With 3.3, both prefixes are new and each starts at 0.
        fr: |
          `counter` conserve une valeur distincte pour chaque préfixe différent, en partant de la valeur initiale. Ici, le préfixe combine majorMinor et Build.Reason : les exécutions de CI (3.2-IndividualCI) et de pull request (3.2-PullRequest) ont donc des séquences indépendantes ; après deux exécutions de pull request (3.2.0 et 3.2.1), la suivante est 3.2.2. Les compteurs sont aussi propres à chaque pipeline : orders-release démarre sa propre séquence à 3.2.0. Avec 3.3, les deux préfixes sont nouveaux et chacun part de 0.
      options:
        s2: { en: "Counters are scoped to a pipeline: orders-release doesn't share the counter of orders-ci and starts at 3.2.0.", fr: "Les compteurs sont propres à chaque pipeline : orders-release ne partage pas le compteur d'orders-ci et démarre à 3.2.0." }
        s3: { en: "3.3-IndividualCI and 3.3-PullRequest are two new prefixes: the next CI run and the next pull request run are both numbered 3.3.0.", fr: "3.3-IndividualCI et 3.3-PullRequest sont deux nouveaux préfixes : la prochaine exécution de CI et la prochaine exécution de pull request portent toutes deux le numéro 3.3.0." }
    references:
      - title: Expressions - Azure Pipelines
        url: https://learn.microsoft.com/en-us/azure/devops/pipelines/process/expressions

  # ------------------------------------------------------------------ 8
  - id: az400-qz-31-08
    objective: "3.1.3"
    difficulty: 3
    status: draft
    type: hotarea
    stem:
      en: |
        The package.json file of a web application named **storefront** contains the dependency `"@contoso/charts": "^2.4.1"`. The committed package-lock.json file records version 2.4.1 of @contoso/charts, and package.json and package-lock.json are consistent. The npm feed of storefront now contains the versions of @contoso/charts shown in the following table.

        Answer each prompt by selecting the version of @contoso/charts that is installed.

        NOTE: Each correct selection is worth one point.
      fr: |
        Le fichier package.json d'une application web nommée **storefront** contient la dépendance `"@contoso/charts": "^2.4.1"`. Le fichier package-lock.json validé dans le dépôt enregistre la version 2.4.1 de @contoso/charts, et package.json et package-lock.json sont cohérents. Le flux npm de storefront contient désormais les versions de @contoso/charts présentées dans le tableau suivant.

        Répondez à chaque consigne en sélectionnant la version de @contoso/charts qui est installée.

        Remarque : chaque sélection correcte vaut un point.
    body:
      prompts:
        - id: p1
          text: { en: "The CI pipeline runs npm ci in a fresh clone of the repository.", fr: "Le pipeline de CI exécute npm ci dans un nouveau clone du dépôt." }
        - id: p2
          text: { en: "A developer runs npm update @contoso/charts in a local clone.", fr: "Un développeur exécute npm update @contoso/charts dans un clone local." }
      grid:
        header: [{ en: "Version", fr: "Version" }, { en: "Change since 2.4.1", fr: "Changement depuis 2.4.1" }]
        rows:
          - [{ text: "2.4.1", area: v241 }, { text: { en: "None", fr: "Aucun" } }]
          - [{ text: "2.4.3", area: v243 }, { text: { en: "Bug fixes", fr: "Correctifs" } }]
          - [{ text: "2.6.0", area: v260 }, { text: { en: "New backward-compatible features", fr: "Nouvelles fonctionnalités rétrocompatibles" } }]
          - [{ text: "3.0.0", area: v300 }, { text: { en: "Breaking changes", fr: "Changements cassants" } }]
          - [{ text: "3.1.0", area: v310 }, { text: { en: "Breaking changes and new features", fr: "Changements cassants et nouvelles fonctionnalités" } }]
    answer:
      values: { p1: v241, p2: v260 }
    explanation:
      correct:
        en: |
          `npm ci` installs from the lock file and never writes to package.json or package-lock.json, so the build gets exactly 2.4.1, the version the developers tested, even though newer matching versions exist. `npm update` instead looks for the highest version that satisfies the range: `^2.4.1` accepts minor and patch updates below 3.0.0, so it installs 2.6.0.
        fr: |
          `npm ci` installe à partir du fichier de verrouillage et n'écrit jamais dans package.json ni dans package-lock.json : le build obtient donc exactement 2.4.1, la version que les développeurs ont testée, même si des versions plus récentes correspondent. `npm update` cherche au contraire la version la plus élevée qui satisfait la plage : `^2.4.1` accepte les mises à jour mineures et de correctif en dessous de 3.0.0, il installe donc 2.6.0.
      options:
        v243: { en: "2.4.3 is what `~2.4.1` would allow at most; the caret also accepts new minor versions.", fr: "2.4.3 est le maximum qu'autoriserait `~2.4.1` ; le caret accepte aussi les nouvelles versions mineures." }
        v300: { en: "3.0.0 is a new major version, which `^2.4.1` excludes.", fr: "3.0.0 est une nouvelle version majeure, que `^2.4.1` exclut." }
        v310: { en: "3.1.0 is in the next major version, outside the range of `^2.4.1`.", fr: "3.1.0 appartient à la version majeure suivante, en dehors de la plage de `^2.4.1`." }
    references:
      - title: Configure npm packages with package.json - Visual Studio (Windows)
        url: https://learn.microsoft.com/en-us/visualstudio/javascript/configure-packages-with-package-json

  # ------------------------------------------------------------------ 9
  - id: az400-qz-31-09
    objective: "3.1.4"
    difficulty: 3
    status: draft
    type: dropdown
    stem:
      en: |
        The YAML pipeline of the library **Fabrikam.Pricing** keeps the default run number format. A script step computes the release version from the latest Git tag and sets it in a pipeline variable named **ReleaseVersion**, for example 4.3.0.

        You need to complete the Build stage so that:

        - the version of the NuGet packages equals the value of ReleaseVersion;
        - the packages are published once as a pipeline artifact whose name identifies that version, for the Release stage to download.

        How should you complete the YAML? Select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Le pipeline YAML de la bibliothèque **Fabrikam.Pricing** conserve le format par défaut du numéro d'exécution. Une étape de script calcule la version de mise en production à partir de la dernière balise Git et la place dans une variable de pipeline nommée **ReleaseVersion**, par exemple 4.3.0.

        Vous devez compléter la phase Build pour que :

        - la version des packages NuGet soit égale à la valeur de ReleaseVersion ;
        - les packages soient publiés une seule fois comme artefact de pipeline dont le nom identifie cette version, pour que la phase Release le télécharge.

        Comment devez-vous compléter le YAML ? Sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: code
      language: yaml
      template: |
        - task: DotNetCoreCLI@2
          inputs:
            command: pack
            packagesToPack: 'src/Fabrikam.Pricing/Fabrikam.Pricing.csproj'
            versioningScheme: [[scheme]]
            versionEnvVar: [[var]]
        - publish: $(Build.ArtifactStagingDirectory)
          artifact: [[art]]
      slots:
        - id: scheme
          options:
            - { id: offv, text: "off" }
            - { id: byPre, text: byPrereleaseNumber }
            - { id: byEnv, text: byEnvVar }
            - { id: byBuild, text: byBuildNumber }
        - id: var
          options:
            - { id: plain, text: ReleaseVersion }
            - { id: macro, text: "$(ReleaseVersion)" }
            - { id: envps, text: "$env:ReleaseVersion" }
            - { id: buildnum, text: Build.BuildNumber }
        - id: art
          options:
            - { id: ver, text: "packages-$(ReleaseVersion)" }
            - { id: latest, text: packages-latest }
            - { id: rev, text: "packages-$(Rev:r)" }
            - { id: runnum, text: "packages-$(Build.BuildNumber)" }
    answer:
      values: { scheme: byEnv, var: plain, art: ver }
    explanation:
      correct:
        en: |
          `versioningScheme: byEnvVar` takes the package version from the variable named in `versionEnvVar`, which must be the variable name alone, without `$`, `$env` or `%`. Naming the pipeline artifact `packages-$(ReleaseVersion)` makes the published artifact identify the version that the Release stage downloads, instead of rebuilding.
        fr: |
          `versioningScheme: byEnvVar` prend la version du package dans la variable nommée dans `versionEnvVar`, qui doit être le seul nom de la variable, sans `$`, `$env` ni `%`. Nommer l'artefact de pipeline `packages-$(ReleaseVersion)` fait identifier par l'artefact publié la version que la phase Release télécharge, au lieu de reconstruire.
      options:
        offv: { en: "`off` keeps the version defined in the project file, not ReleaseVersion.", fr: "`off` conserve la version définie dans le fichier projet, pas ReleaseVersion." }
        byPre: { en: "`byPrereleaseNumber` generates an `X.Y.Z-ci-datetime` prerelease version from the major, minor and patch inputs.", fr: "`byPrereleaseNumber` génère une version préliminaire `X.Y.Z-ci-datetime` à partir des entrées major, minor et patch." }
        byBuild: { en: "`byBuildNumber` uses the run number, which here keeps the default date-based format.", fr: "`byBuildNumber` utilise le numéro d'exécution, qui conserve ici le format par défaut basé sur la date." }
        macro: { en: "`versionEnvVar` expects the variable name without `$`; the macro syntax isn't accepted here.", fr: "`versionEnvVar` attend le nom de la variable sans `$` ; la syntaxe de macro n'est pas acceptée ici." }
        envps: { en: "`versionEnvVar` expects the variable name without the `$env` prefix.", fr: "`versionEnvVar` attend le nom de la variable sans le préfixe `$env`." }
        latest: { en: "A fixed name such as latest doesn't identify the version of the packages.", fr: "Un nom fixe comme latest n'identifie pas la version des packages." }
        rev: { en: "`$(Rev:r)` is a token of the run number format, not a variable that can be used in a step.", fr: "`$(Rev:r)` est un jeton du format du numéro d'exécution, pas une variable utilisable dans une étape." }
        runnum: { en: "The default run number is date-based (yyyyMMdd.r), so it doesn't identify the package version.", fr: "Le numéro d'exécution par défaut est basé sur la date (yyyyMMdd.r) : il n'identifie donc pas la version des packages." }
    references:
      - title: DotNetCoreCLI@2 - .NET Core v2 task
        url: https://learn.microsoft.com/en-us/azure/devops/pipelines/tasks/reference/dotnet-core-cli-v2

  # ------------------------------------------------------------------ 10
  - id: az400-qz-31-10
    objective: "3.1.2"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        Fabrikam has an Azure DevOps organization with two projects:

        - In the **Platform** project, the feed **fab-core** receives every build of the internal NuGet libraries. The QA team promotes the validated versions to the **@Release** view, which is visible to all the people in the organization.
        - In the **Mobile** project, the feed **mobile-pkgs** has nuget.org as its only upstream source.

        The members of a group named **G-Contractors** are users of the organization and have no permission on either feed. Their nuget.config file must reference mobile-pkgs only, and they must be able to restore:

        - the validated versions of the fab-core libraries, but never a version that hasn't been validated;
        - any public package from nuget.org, including packages that nobody has restored through mobile-pkgs yet.

        The solution must follow the principle of least privilege.

        Which two actions should you perform? Each correct answer presents part of the solution.

        NOTE: Each correct selection is worth one point.
      fr: |
        Fabrikam dispose d'une organisation Azure DevOps avec deux projets :

        - Dans le projet **Platform**, le flux **fab-core** reçoit chaque build des bibliothèques NuGet internes. L'équipe QA promeut les versions validées vers la vue **@Release**, visible par toutes les personnes de l'organisation.
        - Dans le projet **Mobile**, le flux **mobile-pkgs** a nuget.org comme seule source en amont.

        Les membres d'un groupe nommé **G-Contractors** sont des utilisateurs de l'organisation et n'ont aucune autorisation sur l'un ou l'autre des flux. Leur fichier nuget.config ne doit référencer que mobile-pkgs, et ils doivent pouvoir restaurer :

        - les versions validées des bibliothèques de fab-core, mais jamais une version qui n'a pas été validée ;
        - n'importe quel package public de nuget.org, y compris des packages que personne n'a encore restaurés via mobile-pkgs.

        La solution doit respecter le principe du moindre privilège.

        Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "Add fab-core as an upstream source of mobile-pkgs, with the @Release view.", fr: "Ajouter fab-core comme source en amont de mobile-pkgs, avec la vue @Release." } }
        - { id: b, text: { en: "Add fab-core as an upstream source of mobile-pkgs, with the @Local view.", fr: "Ajouter fab-core comme source en amont de mobile-pkgs, avec la vue @Local." } }
        - { id: c, text: { en: "Grant G-Contractors the Feed Reader role on the fab-core feed.", fr: "Accorder à G-Contractors le rôle Feed Reader sur le flux fab-core." } }
        - { id: d, text: { en: "Grant G-Contractors the Feed and Upstream Reader (Collaborator) role on mobile-pkgs.", fr: "Accorder à G-Contractors le rôle Feed and Upstream Reader (Collaborator) sur mobile-pkgs." } }
        - { id: e, text: { en: "Grant G-Contractors the Feed Reader role on the mobile-pkgs feed.", fr: "Accorder à G-Contractors le rôle Feed Reader sur le flux mobile-pkgs." } }
    answer: { optionIds: [a, d] }
    explanation:
      correct:
        en: |
          An upstream source that points to another feed of the organization uses one of its views: with @Release, mobile-pkgs only exposes the fab-core versions that QA promoted. A package that nobody has restored yet must be saved into mobile-pkgs when a contractor installs it, and saving from upstream sources requires the Feed and Upstream Reader (Collaborator) role or higher on mobile-pkgs.
        fr: |
          Une source en amont qui pointe vers un autre flux de l'organisation utilise l'une de ses vues : avec @Release, mobile-pkgs n'expose que les versions de fab-core promues par l'équipe QA. Un package que personne n'a encore restauré doit être enregistré dans mobile-pkgs quand un prestataire l'installe, et l'enregistrement depuis les sources en amont exige le rôle Feed and Upstream Reader (Collaborator) ou supérieur sur mobile-pkgs.
      options:
        b: { en: "@Local contains every published version of fab-core, including the ones that QA hasn't validated.", fr: "@Local contient toutes les versions publiées de fab-core, y compris celles que l'équipe QA n'a pas validées." }
        c: { en: "Feed Reader on fab-core gives access to its @Local view, with the unvalidated versions, and the contractors don't reference fab-core directly anyway.", fr: "Feed Reader sur fab-core donne accès à sa vue @Local, avec les versions non validées, et les prestataires ne référencent de toute façon pas fab-core directement." }
        e: { en: "A Feed Reader can download packages already in the feed but can't save new packages from upstream sources.", fr: "Un Feed Reader peut télécharger les packages déjà présents dans le flux, mais ne peut pas enregistrer de nouveaux packages depuis les sources en amont." }
    references:
      - title: What are upstream sources? - Azure Artifacts
        url: https://learn.microsoft.com/en-us/azure/devops/artifacts/concepts/upstream-sources
      - title: Manage permissions - Azure Artifacts
        url: https://learn.microsoft.com/en-us/azure/devops/artifacts/feeds/feed-permissions
