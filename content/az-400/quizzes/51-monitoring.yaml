chapter: 51-monitoring
questions:
  # ------------------------------------------------------------------ 1
  - id: az400-qz-51-01
    objective: "5.1.1"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        You create an Azure Monitor metric alert rule on the production web app of Contoso. When the rule fires, the on-call engineers must receive an email, and a webhook of the incident tool must be called.

        Which Azure Monitor resource should you attach to the alert rule to define these notifications and actions?
      fr: |
        Vous créez une règle d'alerte de métrique Azure Monitor sur l'application web de production de Contoso. Quand la règle se déclenche, les ingénieurs d'astreinte doivent recevoir un e-mail, et un webhook de l'outil d'incidents doit être appelé.

        Quelle ressource Azure Monitor devez-vous associer à la règle d'alerte pour définir ces notifications et ces actions ?
    body:
      options:
        - { id: a, text: { en: "A data collection rule", fr: "Une règle de collecte de données" } }
        - { id: b, text: { en: "A diagnostic setting", fr: "Un paramètre de diagnostic" } }
        - { id: c, text: { en: "An action group", fr: "Un groupe d'actions" } }
        - { id: d, text: { en: "A workbook", fr: "Un classeur" } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          An alert rule calls one or more action groups when it fires. An action group holds the notification types, such as email, SMS, push and voice, and the action types, such as webhook, Logic App, Azure Function, Automation runbook, Event Hubs and ITSM.
        fr: |
          Une règle d'alerte appelle un ou plusieurs groupes d'actions quand elle se déclenche. Un groupe d'actions contient les types de notification, comme l'e-mail, le SMS, la notification push et l'appel vocal, et les types d'action, comme le webhook, l'application logique, la fonction Azure, le runbook Automation, Event Hubs et ITSM.
      options:
        a: { en: "A data collection rule tells the Azure Monitor Agent which guest data to collect; it doesn't notify anyone.", fr: "Une règle de collecte de données indique à l'agent Azure Monitor quelles données invitées collecter ; elle n'avertit personne." }
        b: { en: "A diagnostic setting routes resource logs and metrics to a destination; it doesn't react to alerts.", fr: "Un paramètre de diagnostic achemine des journaux de ressources et des métriques vers une destination ; il ne réagit pas aux alertes." }
        d: { en: "A workbook displays monitoring data in interactive reports; it sends no email and calls no webhook.", fr: "Un classeur affiche les données de supervision dans des rapports interactifs ; il n'envoie aucun e-mail et n'appelle aucun webhook." }
    references:
      - title: Create and manage action groups in Azure Monitor - Azure Monitor
        url: https://learn.microsoft.com/en-us/azure/azure-monitor/alerts/action-groups

  # ------------------------------------------------------------------ 2
  - id: az400-qz-51-02
    objective: "5.1.3"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        The Fabrikam web team tracks its issues in a GitHub Project owned by its organization, on GitHub Enterprise Cloud. The engineering manager wants a chart that shows how the number of items in each status changed day by day over the last quarter.

        What should you create in the insights of the project?
      fr: |
        L'équipe web de Fabrikam suit ses issues dans un GitHub Project détenu par son organisation, sur GitHub Enterprise Cloud. Le responsable de l'ingénierie veut un graphique qui montre comment le nombre d'éléments de chaque statut a évolué jour après jour au cours du dernier trimestre.

        Que devez-vous créer dans les insights du projet ?
    body:
      options:
        - { id: a, text: { en: "A current chart with Status on the X-axis", fr: "Un graphique actuel avec Status sur l'axe X" } }
        - { id: b, text: { en: "A current chart grouped by Status", fr: "Un graphique actuel groupé par Status" } }
        - { id: c, text: { en: "A historical chart with Time on the X-axis", fr: "Un graphique historique avec Time sur l'axe X" } }
        - { id: d, text: { en: "A current chart filtered on the quarter", fr: "Un graphique actuel filtré sur le trimestre" } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          Historical charts are time-based: they show the number of items over time, grouped by status or by another field. The default Burn up chart is a historical chart of item status over time, which is exactly the trend the manager asked for.
        fr: |
          Les graphiques historiques sont basés sur le temps : ils montrent le nombre d'éléments dans le temps, groupés par statut ou par un autre champ. Le graphique Burn up par défaut est un graphique historique du statut des éléments dans le temps, c'est-à-dire l'évolution demandée par le responsable.
      options:
        a: { en: "A current chart shows the present state of the items, one bar per status; it doesn't show how the counts evolved.", fr: "Un graphique actuel montre l'état présent des éléments, une barre par statut ; il ne montre pas l'évolution des nombres." }
        b: { en: "Grouping splits the bars of a current chart by status, but the chart still shows only today's state.", fr: "Le regroupement découpe les barres d'un graphique actuel par statut, mais le graphique ne montre toujours que l'état du jour." }
        d: { en: "A filter limits the items used to build the chart; it doesn't turn a current chart into a trend over time.", fr: "Un filtre limite les éléments utilisés pour construire le graphique ; il ne transforme pas un graphique actuel en évolution dans le temps." }
    references:
      - title: Insight and automation with projects - Training
        url: https://learn.microsoft.com/en-us/training/modules/manage-work-github-projects/6-insight-automation-with-projects

  # ------------------------------------------------------------------ 3
  - id: az400-qz-51-03
    objective: "5.1.2"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Litware runs a Node.js web app on Azure App Service on Linux, deployed as code by an Azure Pipelines YAML pipeline. A workspace-based Application Insights resource named **appi-litware** already exists.

        You need appi-litware to receive the requests, dependencies and exceptions of the web app. Neither the application code nor the pipeline can be modified.

        What should you do?
      fr: |
        Litware exécute une application web Node.js sur Azure App Service sous Linux, déployée sous forme de code par un pipeline YAML Azure Pipelines. Une ressource Application Insights basée sur un espace de travail nommée **appi-litware** existe déjà.

        Vous devez faire en sorte qu'appi-litware reçoive les requêtes, les dépendances et les exceptions de l'application web. Ni le code de l'application ni le pipeline ne peuvent être modifiés.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Add the Microsoft OpenTelemetry Distro to the app and configure it at startup.", fr: "Ajouter la Microsoft OpenTelemetry Distro à l'application et la configurer au démarrage." } }
        - { id: b, text: { en: "Turn on Application Insights in the web app settings and select appi-litware.", fr: "Activer Application Insights dans les paramètres de l'application web et sélectionner appi-litware." } }
        - { id: c, text: { en: "Install the Azure Monitor Agent on the web app and associate a data collection rule.", fr: "Installer l'agent Azure Monitor sur l'application web et associer une règle de collecte de données." } }
        - { id: d, text: { en: "Create a diagnostic setting that sends the HTTP logs of the web app to the workspace.", fr: "Créer un paramètre de diagnostic qui envoie les journaux HTTP de l'application web vers l'espace de travail." } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          App Service on Linux supports autoinstrumentation of Node.js apps deployed as code: you turn on Application Insights in the portal and select the resource, without changing the code or the deployment. The agent then sends requests, dependencies and exceptions to appi-litware.
        fr: |
          App Service sous Linux prend en charge l'instrumentation automatique des applications Node.js déployées sous forme de code : vous activez Application Insights dans le portail et sélectionnez la ressource, sans modifier le code ni le déploiement. L'agent envoie alors les requêtes, les dépendances et les exceptions à appi-litware.
      options:
        a: { en: "The OpenTelemetry Distro is code-based instrumentation: adding it changes the application code, which isn't allowed.", fr: "La distribution OpenTelemetry est une instrumentation dans le code : l'ajouter modifie le code de l'application, ce qui n'est pas autorisé." }
        c: { en: "The Azure Monitor Agent collects guest data from VMs and Arc-enabled servers; it isn't installed on an App Service app and doesn't produce Application Insights telemetry.", fr: "L'agent Azure Monitor collecte les données invitées des VM et des serveurs Arc ; il ne s'installe pas sur une application App Service et ne produit pas de télémétrie Application Insights." }
        d: { en: "A diagnostic setting sends platform resource logs to the workspace; HTTP logs contain no dependency calls or exceptions and don't feed Application Insights.", fr: "Un paramètre de diagnostic envoie les journaux de ressources de la plateforme vers l'espace de travail ; les journaux HTTP ne contiennent ni appels de dépendances ni exceptions et n'alimentent pas Application Insights." }
    references:
      - title: Autoinstrumentation for Azure Monitor Application Insights - Azure Monitor
        url: https://learn.microsoft.com/en-us/azure/azure-monitor/app/codeless-overview

  # ------------------------------------------------------------------ 4
  - id: az400-qz-51-04
    objective: "5.1.4"
    difficulty: 2
    status: draft
    type: yesno_statements
    stem:
      en: |
        Adatum has an Azure DevOps project named **Retail** that contains several YAML pipelines. You are a member of the Project Administrators group of Retail, and you plan the alerts sent when pipeline runs fail.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Adatum dispose d'un projet Azure DevOps nommé **Retail** qui contient plusieurs pipelines YAML. Vous êtes membre du groupe Project Administrators de Retail, et vous planifiez les alertes envoyées quand des exécutions de pipeline échouent.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - { id: s1, text: { en: "A project notification subscription can deliver its emails to a custom email address, such as a distribution list.", fr: "Un abonnement aux notifications du projet peut remettre ses e-mails à une adresse e-mail personnalisée, comme une liste de distribution." } }
        - { id: s2, text: { en: "A notification subscription can post its message directly in a Microsoft Teams channel, without a service hook or a chat app.", fr: "Un abonnement aux notifications peut publier son message directement dans un canal Microsoft Teams, sans hook de service ni application de messagerie." } }
        - { id: s3, text: { en: "A member of the team can opt out of a team subscription while the other members stay subscribed.", fr: "Un membre de l'équipe peut se désabonner d'un abonnement d'équipe alors que les autres membres restent abonnés." } }
    answer:
      values: { s1: true, s2: false, s3: true }
    explanation:
      correct:
        en: |
          Team and project subscriptions offer several delivery options, including a custom email address. Notification subscriptions deliver by email; reaching Slack, Microsoft Teams or another external service requires a service hook subscription or the chat app. Each user can opt out of a team or project subscription without affecting the other recipients.
        fr: |
          Les abonnements d'équipe et de projet offrent plusieurs options de remise, dont une adresse e-mail personnalisée. Les abonnements aux notifications remettent par e-mail ; atteindre Slack, Microsoft Teams ou un autre service externe exige un abonnement de hook de service ou l'application de messagerie. Chaque utilisateur peut se désabonner d'un abonnement d'équipe ou de projet sans effet sur les autres destinataires.
      options:
        s2: { en: "Notifications are delivered through email or through a service hook; the Teams integration is a service hook or the Azure Pipelines app, not a notification subscription.", fr: "Les notifications sont remises par e-mail ou par un hook de service ; l'intégration à Teams passe par un hook de service ou l'application Azure Pipelines, pas par un abonnement aux notifications." }
    references:
      - title: About Notifications - Azure DevOps
        url: https://learn.microsoft.com/en-us/azure/devops/organizations/notifications/about-notifications
      - title: Manage Notifications - Team, Project, Organization - Azure DevOps
        url: https://learn.microsoft.com/en-us/azure/devops/organizations/notifications/manage-team-group-global-organization-notifications

  # ------------------------------------------------------------------ 5
  - id: az400-qz-51-05
    objective: "5.1.2"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Tailspin's build pipelines download packages from the blob containers of a storage account named **stpackages**. Storage insights shows a rise in failed transactions on stpackages, but the team must see each failed blob request, with its operation, caller IP address and status, and query it with KQL in a Log Analytics workspace named **law-build**.

        What should you do?
      fr: |
        Les pipelines de build de Tailspin téléchargent des packages depuis les conteneurs d'objets blob d'un compte de stockage nommé **stpackages**. Storage Insights montre une hausse des transactions en échec sur stpackages, mais l'équipe doit voir chaque requête blob en échec, avec son opération, l'adresse IP de l'appelant et son état, et l'interroger en KQL dans un espace de travail Log Analytics nommé **law-build**.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Create a metric alert rule on Transactions split by ResponseType, with law-build as the target.", fr: "Créer une règle d'alerte de métrique sur Transactions fractionnée par ResponseType, avec law-build comme cible." } }
        - { id: b, text: { en: "Install the Azure Monitor Agent for stpackages, with a data collection rule that targets law-build.", fr: "Installer l'agent Azure Monitor pour stpackages, avec une règle de collecte de données qui cible law-build." } }
        - { id: c, text: { en: "Create a diagnostic setting for the blob service of stpackages that sends its logs to law-build.", fr: "Créer un paramètre de diagnostic pour le service blob de stpackages qui envoie ses journaux à law-build." } }
        - { id: d, text: { en: "Open Storage insights from law-build so that the workbook stores its transaction data there.", fr: "Ouvrir Storage Insights depuis law-build afin que le classeur y stocke ses données de transactions." } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          Storage insights is built on platform metrics, which are aggregated and collected without configuration. Per-request data are resource logs, and resource logs aren't collected until you create a diagnostic setting that routes them to a destination such as a Log Analytics workspace, where they can be queried in StorageBlobLogs.
        fr: |
          Storage Insights repose sur les métriques de plateforme, agrégées et collectées sans configuration. Les données par requête sont des journaux de ressources, et les journaux de ressources ne sont pas collectés tant que vous ne créez pas un paramètre de diagnostic qui les achemine vers une destination comme un espace de travail Log Analytics, où ils s'interrogent dans StorageBlobLogs.
      options:
        a: { en: "A metric alert evaluates aggregated transaction counts; it doesn't store individual requests in a workspace.", fr: "Une alerte de métrique évalue des nombres de transactions agrégés ; elle ne stocke pas les requêtes individuelles dans un espace de travail." }
        b: { en: "The Azure Monitor Agent runs on machines; a storage account has no guest operating system to install it on.", fr: "L'agent Azure Monitor s'exécute sur des machines ; un compte de stockage n'a pas de système d'exploitation invité où l'installer." }
        d: { en: "Storage insights is a view over platform metrics; opening it doesn't collect any log data.", fr: "Storage Insights est une vue sur les métriques de plateforme ; l'ouvrir ne collecte aucune donnée de journal." }
    references:
      - title: Monitor Azure Blob Storage
        url: https://learn.microsoft.com/en-us/azure/storage/blobs/monitor-blob-storage

  # ------------------------------------------------------------------ 6
  - id: az400-qz-51-06
    objective: "5.1.1"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Northwind Traders tracks its work in Azure Boards, in a project named **Payments**. The production API of the project is watched by several Azure Monitor alert rules.

        You need a Bug work item to be created automatically in Payments each time one of these alert rules fires, with the alert rule name and the affected resource in the title. The solution must not require writing or hosting any custom code, and it must minimize administrative effort.

        What should you configure?
      fr: |
        Northwind Traders suit son travail dans Azure Boards, dans un projet nommé **Payments**. L'API de production du projet est surveillée par plusieurs règles d'alerte Azure Monitor.

        Vous devez faire en sorte qu'un élément de travail Bug soit créé automatiquement dans Payments chaque fois que l'une de ces règles d'alerte se déclenche, avec le nom de la règle d'alerte et la ressource concernée dans le titre. La solution ne doit exiger ni l'écriture ni l'hébergement de code personnalisé, et doit réduire au minimum l'effort administratif.

        Que devez-vous configurer ?
    body:
      options:
        - { id: a, text: { en: "An action group with a webhook action that calls the work items REST API of Payments", fr: "Un groupe d'actions avec une action webhook qui appelle l'API REST des éléments de travail de Payments" } }
        - { id: b, text: { en: "An action group with an Azure Functions action whose function calls the work items REST API", fr: "Un groupe d'actions avec une action Azure Functions dont la fonction appelle l'API REST des éléments de travail" } }
        - { id: c, text: { en: "An action group with a Logic App action whose workflow uses the Azure DevOps connector", fr: "Un groupe d'actions avec une action d'application logique dont le flux utilise le connecteur Azure DevOps" } }
        - { id: d, text: { en: "A work item template in Application Insights that is linked to the Payments project", fr: "Un modèle d'élément de travail dans Application Insights lié au projet Payments" } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          The action group calls the logic app with the alert payload, and the logic app uses the Create a work item action of the Azure DevOps connector, mapping the alert rule name and resource into the title. The workflow is built in the designer, so there is no code to write or host.
        fr: |
          Le groupe d'actions appelle l'application logique avec la charge utile de l'alerte, et l'application logique utilise l'action Create a work item du connecteur Azure DevOps en reportant le nom de la règle d'alerte et la ressource dans le titre. Le flux se construit dans le concepteur : il n'y a aucun code à écrire ni à héberger.
      options:
        a: { en: "A webhook action posts the alert payload as is and can only pass basic authentication credentials in the URI; it can't build the request body that the work items API expects.", fr: "Une action webhook publie la charge utile de l'alerte telle quelle et ne peut passer des informations d'authentification de base que dans l'URI ; elle ne peut pas construire le corps de requête attendu par l'API des éléments de travail." }
        b: { en: "An Azure Functions action works, but the function is custom code that you must write, deploy and host.", fr: "Une action Azure Functions fonctionne, mais la fonction est du code personnalisé à écrire, déployer et héberger." }
        d: { en: "A work item template lets a developer create a work item by hand from a transaction under investigation; it isn't triggered by alert rules.", fr: "Un modèle d'élément de travail permet à un développeur de créer manuellement un élément de travail depuis une transaction qu'il examine ; il n'est pas déclenché par les règles d'alerte." }
    references:
      - title: Create and manage action groups in Azure Monitor - Azure Monitor
        url: https://learn.microsoft.com/en-us/azure/azure-monitor/alerts/action-groups
      - title: Azure DevOps - Connectors
        url: https://learn.microsoft.com/en-us/connectors/visualstudioteamservices/

  # ------------------------------------------------------------------ 7
  - id: az400-qz-51-07
    objective: "5.1.2"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        Wingtip Toys runs its payment services on an AKS cluster named **aks-pay**. A pipeline enabled Container insights on aks-pay with the monitoring add-on, which sends data to a Log Analytics workspace named **law-pay**. Managed Prometheus isn't enabled, and no diagnostic setting exists on the cluster.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Wingtip Toys exécute ses services de paiement sur un cluster AKS nommé **aks-pay**. Un pipeline a activé Container Insights sur aks-pay avec le module complémentaire de supervision, qui envoie les données à un espace de travail Log Analytics nommé **law-pay**. Prometheus managé n'est pas activé, et aucun paramètre de diagnostic n'existe sur le cluster.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - { id: s1, text: { en: "The stdout and stderr logs of the payment pods can be queried in law-pay.", fr: "Les journaux stdout et stderr des pods de paiement peuvent être interrogés dans law-pay." } }
        - { id: s2, text: { en: "The kube-audit events of the Kubernetes API server can be queried in law-pay.", fr: "Les événements kube-audit du serveur d'API Kubernetes peuvent être interrogés dans law-pay." } }
        - { id: s3, text: { en: "Azure Managed Grafana can chart the Prometheus metrics of the payment pods from an Azure Monitor workspace.", fr: "Azure Managed Grafana peut représenter les métriques Prometheus des pods de paiement depuis un espace de travail Azure Monitor." } }
    answer:
      values: { s1: true, s2: false, s3: false }
    explanation:
      correct:
        en: |
          Container insights runs a containerized Azure Monitor Agent that collects the stdout and stderr logs and the Kubernetes events of every node into the Log Analytics workspace. Control plane logs such as kube-audit are resource logs: they're collected only after you create a diagnostic setting on the cluster. Prometheus metrics reach an Azure Monitor workspace only when managed Prometheus is enabled, which isn't the case here.
        fr: |
          Container Insights exécute un agent Azure Monitor conteneurisé qui collecte les journaux stdout et stderr et les événements Kubernetes de chaque nœud dans l'espace de travail Log Analytics. Les journaux du plan de contrôle comme kube-audit sont des journaux de ressources : ils ne sont collectés qu'après la création d'un paramètre de diagnostic sur le cluster. Les métriques Prometheus n'arrivent dans un espace de travail Azure Monitor que si Prometheus managé est activé, ce qui n'est pas le cas ici.
      options:
        s2: { en: "The monitoring add-on doesn't collect control plane logs; kube-audit needs a diagnostic setting on aks-pay.", fr: "Le module complémentaire de supervision ne collecte pas les journaux du plan de contrôle ; kube-audit exige un paramètre de diagnostic sur aks-pay." }
        s3: { en: "Without managed Prometheus, no Prometheus metrics are scraped into an Azure Monitor workspace for Grafana to read.", fr: "Sans Prometheus managé, aucune métrique Prometheus n'est collectée dans un espace de travail Azure Monitor que Grafana pourrait lire." }
    references:
      - title: Monitor Azure Kubernetes Service (AKS) - Azure Kubernetes Service
        url: https://learn.microsoft.com/en-us/azure/aks/monitor-aks

  # ------------------------------------------------------------------ 8
  - id: az400-qz-51-08
    objective: "5.1.4"
    difficulty: 3
    status: draft
    type: dragdrop
    stem:
      en: |
        Contoso has an Azure DevOps project named **Payments** that contains a team named **Payments Team** and a YAML pipeline named **payments-ci**. The project has four alerting requirements.

        Which mechanism should you use for each requirement? To answer, drag the appropriate mechanisms to the correct requirements. Each mechanism may be used once or not at all.

        NOTE: Each correct selection is worth one point.
      fr: |
        Contoso dispose d'un projet Azure DevOps nommé **Payments** qui contient une équipe nommée **Payments Team** et un pipeline YAML nommé **payments-ci**. Le projet a quatre exigences d'alerte.

        Quel mécanisme devez-vous utiliser pour chaque exigence ? Pour répondre, faites glisser les mécanismes appropriés vers les exigences correspondantes. Chaque mécanisme peut être utilisé une fois ou pas du tout.

        Remarque : chaque sélection correcte vaut un point.
    body:
      reuse: false
      items:
        - { id: team, text: { en: "Team notification subscription", fr: "Abonnement aux notifications de l'équipe" } }
        - { id: personal, text: { en: "Personal notification subscription", fr: "Abonnement aux notifications personnel" } }
        - { id: hook, text: { en: "Service hook subscription", fr: "Abonnement de hook de service" } }
        - { id: job, text: { en: "Pipeline job with `condition: failed()`", fr: "Job de pipeline avec `condition: failed()`" } }
        - { id: check, text: { en: "Query Azure Monitor alerts check", fr: "Vérification Query Azure Monitor alerts" } }
        - { id: stream, text: { en: "Audit stream", fr: "Flux d'audit" } }
      targets:
        - { id: queue, text: { en: "Send the event of every completed run of payments-ci to an Azure Service Bus queue read by the ticketing system, without changing the pipeline", fr: "Envoyer l'événement de chaque exécution terminée de payments-ci vers une file d'attente Azure Service Bus lue par le système de tickets, sans modifier le pipeline" } }
        - { id: members, text: { en: "Email every member of Payments Team when a run of payments-ci on the main branch fails", fr: "Envoyer un e-mail à chaque membre de Payments Team quand une exécution de payments-ci sur la branche main échoue" } }
        - { id: self, text: { en: "Email a developer, and only her, when any pipeline of the project fails, although the team doesn't want these emails", fr: "Envoyer un e-mail à une développeuse, et à elle seule, quand un pipeline du projet échoue, bien que l'équipe ne veuille pas de ces e-mails" } }
        - { id: oncall, text: { en: "Post the build number to the on-call webhook from the run itself, only when the Deploy job of payments-ci fails", fr: "Publier le numéro de build sur le webhook d'astreinte depuis l'exécution elle-même, seulement quand le job Deploy de payments-ci échoue" } }
    answer:
      mapping: { queue: hook, members: team, self: personal, oncall: job }
    explanation:
      correct:
        en: |
          A service hook subscription sends Azure DevOps events, such as Build completed, to external services including Azure Service Bus, without touching the pipeline. A team subscription based on the Build completes template, filtered on the status and the branch, emails the team members. A personal subscription concerns only the user who creates it. A job that depends on Deploy with `condition: failed()` runs inside the pipeline only when Deploy fails and can read the build number.
        fr: |
          Un abonnement de hook de service envoie des événements Azure DevOps, comme Build completed, vers des services externes dont Azure Service Bus, sans toucher au pipeline. Un abonnement d'équipe basé sur le modèle Build completes, filtré sur l'état et la branche, envoie un e-mail aux membres de l'équipe. Un abonnement personnel ne concerne que l'utilisateur qui le crée. Un job qui dépend de Deploy avec `condition: failed()` s'exécute dans le pipeline seulement quand Deploy échoue et peut lire le numéro de build.
      options:
        check: { en: "The Query Azure Monitor alerts check gates a deployment on Azure Monitor alerts; it sends no notification about runs.", fr: "La vérification Query Azure Monitor alerts conditionne un déploiement aux alertes Azure Monitor ; elle n'envoie aucune notification sur les exécutions." }
        stream: { en: "An audit stream exports audit events of the organization, such as policy changes; it isn't a way to alert on pipeline results.", fr: "Un flux d'audit exporte les événements d'audit de l'organisation, comme les modifications de stratégies ; ce n'est pas un moyen d'alerter sur les résultats des pipelines." }
    references:
      - title: Integrate with Service Hooks - Azure DevOps
        url: https://learn.microsoft.com/en-us/azure/devops/service-hooks/overview
      - title: About Notifications - Azure DevOps
        url: https://learn.microsoft.com/en-us/azure/devops/organizations/notifications/about-notifications

  # ------------------------------------------------------------------ 9
  - id: az400-qz-51-09
    objective: "5.1.4"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Fabrikam has an Azure DevOps project named **Retail**. Lena, the lead of the mobile team, is a member of the Contributors group of Retail. She must create and maintain the subscriptions that post the pipeline events of Retail to the Microsoft Teams channels and the webhooks of her team.

        Lena must not be able to change any other project setting, such as permissions, repositories or pipeline settings. The solution must follow the principle of least privilege.

        What should you do?
      fr: |
        Fabrikam dispose d'un projet Azure DevOps nommé **Retail**. Lena, responsable de l'équipe mobile, est membre du groupe Contributors de Retail. Elle doit créer et maintenir les abonnements qui publient les événements de pipeline de Retail dans les canaux Microsoft Teams et les webhooks de son équipe.

        Lena ne doit pouvoir modifier aucun autre paramètre du projet, comme les autorisations, les dépôts ou les paramètres des pipelines. La solution doit respecter le principe du moindre privilège.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Add Lena to the Project Administrators group of Retail.", fr: "Ajouter Lena au groupe Project Administrators de Retail." } }
        - { id: b, text: { en: "Make Lena a team administrator of the mobile team in Retail.", fr: "Faire de Lena une administratrice de l'équipe mobile dans Retail." } }
        - { id: c, text: { en: "Add Lena to the Project Collection Administrators group.", fr: "Ajouter Lena au groupe Project Collection Administrators." } }
        - { id: d, text: { en: "Grant Lena the View and Edit subscriptions permissions of service hooks.", fr: "Accorder à Lena les autorisations View et Edit subscriptions des hooks de service." } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          Posting pipeline events to Microsoft Teams channels and webhooks is done with service hook subscriptions. Creating them requires the Edit subscriptions and View subscriptions permissions, which only project administrators have by default; granting these two permissions to Lena gives her exactly this ability without the other rights of an administrator.
        fr: |
          Publier des événements de pipeline dans des canaux Microsoft Teams et des webhooks se fait avec des abonnements de hook de service. Les créer exige les autorisations Edit subscriptions et View subscriptions, que seuls les administrateurs de projet possèdent par défaut ; accorder ces deux autorisations à Lena lui donne exactement cette capacité, sans les autres droits d'un administrateur.
      options:
        a: { en: "Project Administrators can create service hooks, but they can also change permissions, repositories and pipelines: it breaks least privilege.", fr: "Les Project Administrators peuvent créer des hooks de service, mais aussi modifier les autorisations, les dépôts et les pipelines : cela enfreint le moindre privilège." }
        b: { en: "A team administrator manages the team's settings and its notification subscriptions, which are delivered by email; it doesn't grant the service hook permissions.", fr: "Un administrateur d'équipe gère les paramètres de l'équipe et ses abonnements aux notifications, remis par e-mail ; cela n'accorde pas les autorisations des hooks de service." }
        c: { en: "Project Collection Administrators control the whole organization, far beyond the requirement.", fr: "Les Project Collection Administrators contrôlent toute l'organisation, bien au-delà de l'exigence." }
    references:
      - title: Integrate with Service Hooks - Azure DevOps
        url: https://learn.microsoft.com/en-us/azure/devops/service-hooks/overview
      - title: About Notifications - Azure DevOps
        url: https://learn.microsoft.com/en-us/azure/devops/organizations/notifications/about-notifications

  # ------------------------------------------------------------------ 10
  - id: az400-qz-51-10
    objective: "5.1.2"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        Adatum runs 40 Azure virtual machines and 12 on-premises Linux servers that host build tools. The on-premises servers are onboarded to Azure Arc, and the Azure Connected Machine agent and the Azure Monitor Agent run on all the machines. Adatum enables VM insights on all the machines and selects the OpenTelemetry metrics experience. The operations team also queries a Log Analytics workspace with KQL every day.

        Which two statements are true?

        NOTE: Each correct selection is worth one point.
      fr: |
        Adatum exécute 40 machines virtuelles Azure et 12 serveurs Linux locaux qui hébergent des outils de build. Les serveurs locaux sont intégrés à Azure Arc, et l'agent Azure Connected Machine et l'agent Azure Monitor s'exécutent sur toutes les machines. Adatum active VM Insights sur toutes les machines et sélectionne l'expérience des métriques OpenTelemetry. L'équipe des opérations interroge aussi chaque jour un espace de travail Log Analytics en KQL.

        Quelles sont les deux affirmations vraies ?

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "The guest metrics of all 52 machines are stored in an Azure Monitor workspace and are queried with PromQL.", fr: "Les métriques invitées des 52 machines sont stockées dans un espace de travail Azure Monitor et s'interrogent en PromQL." } }
        - { id: b, text: { en: "The guest metrics are stored in the InsightsMetrics table of the Log Analytics workspace.", fr: "Les métriques invitées sont stockées dans la table InsightsMetrics de l'espace de travail Log Analytics." } }
        - { id: c, text: { en: "A single KQL query can join the guest metrics with the Heartbeat table of the Log Analytics workspace.", fr: "Une seule requête KQL peut joindre les métriques invitées à la table Heartbeat de l'espace de travail Log Analytics." } }
        - { id: d, text: { en: "The Arc-enabled servers are monitored with the same guest metrics experience as the Azure virtual machines.", fr: "Les serveurs Arc sont supervisés avec la même expérience de métriques invitées que les machines virtuelles Azure." } }
        - { id: e, text: { en: "The Percentage CPU host metric of the Azure virtual machines is collected only since the Azure Monitor Agent was installed.", fr: "La métrique d'hôte Percentage CPU des machines virtuelles Azure n'est collectée que depuis l'installation de l'agent Azure Monitor." } }
    answer: { optionIds: [a, d] }
    explanation:
      correct:
        en: |
          With the OpenTelemetry metrics experience, VM insights stores guest metrics in an Azure Monitor workspace, queried with PromQL. This experience supports Azure virtual machines and Arc-enabled servers alike, so once the Connected Machine agent and the Azure Monitor Agent run, the on-premises servers are monitored the same way.
        fr: |
          Avec l'expérience des métriques OpenTelemetry, VM Insights stocke les métriques invitées dans un espace de travail Azure Monitor, interrogé en PromQL. Cette expérience prend en charge à la fois les machines virtuelles Azure et les serveurs Arc : une fois l'agent Connected Machine et l'agent Azure Monitor en place, les serveurs locaux sont supervisés de la même façon.
      options:
        b: { en: "InsightsMetrics in a Log Analytics workspace is used by the logs-based (classic) experience, not by the OpenTelemetry metrics experience.", fr: "InsightsMetrics dans un espace de travail Log Analytics sert à l'expérience basée sur les journaux (classique), pas à l'expérience des métriques OpenTelemetry." }
        c: { en: "A single query can't span a Log Analytics workspace and an Azure Monitor workspace; the guest metrics aren't in the Log Analytics workspace.", fr: "Une seule requête ne peut pas couvrir un espace de travail Log Analytics et un espace de travail Azure Monitor ; les métriques invitées ne sont pas dans l'espace de travail Log Analytics." }
        e: { en: "Host metrics such as Percentage CPU are collected by the Azure platform automatically and for free, with or without an agent.", fr: "Les métriques d'hôte comme Percentage CPU sont collectées automatiquement et gratuitement par la plateforme Azure, avec ou sans agent." }
    references:
      - title: Metrics experience for virtual machines in Azure Monitor - Azure Monitor
        url: https://learn.microsoft.com/en-us/azure/azure-monitor/vm/metrics-opentelemetry-guest
      - title: Monitor virtual machines in Azure - Azure Monitor
        url: https://learn.microsoft.com/en-us/azure/azure-monitor/vm/vminsights-overview
