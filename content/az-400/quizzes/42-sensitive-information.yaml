chapter: 42-sensitive-information
questions:
  # ------------------------------------------------------------------ 1
  - id: az400-qz-42-01
    objective: "4.2.1"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Contoso hosts a web app in Azure App Service. The app needs a TLS certificate issued by DigiCert, with its private key, that must renew automatically before it expires.

        Which type of Azure Key Vault object should you create?
      fr: |
        Contoso héberge une application web dans Azure App Service. L'application a besoin d'un certificat TLS émis par DigiCert, avec sa clé privée, qui doit se renouveler automatiquement avant son expiration.

        Quel type d'objet Azure Key Vault devez-vous créer ?
    body:
      options:
        - { id: a, text: { en: "A secret that holds the PFX file encoded in Base64", fr: "Un secret qui contient le fichier PFX encodé en Base64" } }
        - { id: b, text: { en: "An RSA key protected by a hardware security module", fr: "Une clé RSA protégée par un module de sécurité matériel" } }
        - { id: c, text: { en: "A certificate created with a certificate policy", fr: "Un certificat créé avec une stratégie de certificat" } }
        - { id: d, text: { en: "A secure file uploaded to the Azure Pipelines Library", fr: "Un fichier sécurisé chargé dans la Bibliothèque d'Azure Pipelines" } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          A Key Vault certificate holds the X.509 certificate, its key and a certificate policy that describes its lifecycle. With an integrated partner CA such as DigiCert or GlobalSign, the policy's lifetime action can renew the certificate automatically. Key Vault also creates an addressable secret with the same name, from which the certificate and its private key can be read.
        fr: |
          Un certificat Key Vault contient le certificat X.509, sa clé et une stratégie de certificat qui décrit son cycle de vie. Avec une autorité de certification partenaire intégrée comme DigiCert ou GlobalSign, l'action de durée de vie de la stratégie peut renouveler le certificat automatiquement. Key Vault crée aussi un secret adressable du même nom, d'où l'on peut lire le certificat et sa clé privée.
      options:
        a: { en: "A secret stores the value but has no certificate policy: nothing renews it, someone must upload a new version by hand.", fr: "Un secret stocke la valeur mais n'a pas de stratégie de certificat : rien ne le renouvelle, quelqu'un doit charger une nouvelle version à la main." }
        b: { en: "A key holds only key material for cryptographic operations; it isn't an X.509 certificate and isn't issued by a CA.", fr: "Une clé ne contient que du matériel de clé pour des opérations de chiffrement ; ce n'est pas un certificat X.509 et aucune autorité de certification ne l'émet." }
        d: { en: "A secure file is usable only from pipeline tasks; App Service can't reference it and it's never renewed.", fr: "Un fichier sécurisé n'est utilisable que depuis des tâches de pipeline ; App Service ne peut pas le référencer et il n'est jamais renouvelé." }
    references:
      - title: About Azure Key Vault certificates
        url: https://learn.microsoft.com/en-us/azure/key-vault/certificates/about-certificates

  # ------------------------------------------------------------------ 2
  - id: az400-qz-42-02
    objective: "4.2.3"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        A job of an Azure Pipelines YAML pipeline runs the DownloadSecureFile@1 task to get a provisioning file from **Pipelines > Library > Secure files**, and then uses the file in a script.

        What happens to the downloaded file on the agent?
      fr: |
        Un job d'un pipeline YAML Azure Pipelines exécute la tâche DownloadSecureFile@1 pour obtenir un fichier de provisionnement depuis **Pipelines > Bibliothèque > Fichiers sécurisés**, puis utilise le fichier dans un script.

        Que devient le fichier téléchargé sur l'agent ?
    body:
      options:
        - { id: a, text: { en: "It's deleted when the job completes, whether the job succeeds, fails or is canceled.", fr: "Il est supprimé à la fin du job, que le job réussisse, échoue ou soit annulé." } }
        - { id: b, text: { en: "It's deleted when the job succeeds, and kept for troubleshooting when the job fails.", fr: "Il est supprimé quand le job réussit, et conservé pour le dépannage quand le job échoue." } }
        - { id: c, text: { en: "It stays in the agent's temporary directory until the next job runs on the same agent.", fr: "Il reste dans le répertoire temporaire de l'agent jusqu'au job suivant sur le même agent." } }
        - { id: d, text: { en: "It's published as a pipeline artifact and kept for the retention period of the run.", fr: "Il est publié comme artefact de pipeline et conservé pendant la durée de rétention de l'exécution." } }
    answer: { optionId: a }
    explanation:
      correct:
        en: |
          DownloadSecureFile@1 downloads the file to the agent, under `$(Agent.TempDirectory)`, and exposes its location in the `secureFilePath` output variable. The file is deleted from that location when the pipeline job completes, whatever its result, so the sensitive file doesn't stay on the agent.
        fr: |
          DownloadSecureFile@1 télécharge le fichier sur l'agent, sous `$(Agent.TempDirectory)`, et expose son emplacement dans la variable de sortie `secureFilePath`. Le fichier est supprimé de cet emplacement à la fin du job de pipeline, quel que soit son résultat : le fichier sensible ne reste pas sur l'agent.
      options:
        b: { en: "The deletion doesn't depend on the result: a failed or canceled job also removes the file.", fr: "La suppression ne dépend pas du résultat : un job en échec ou annulé supprime aussi le fichier." }
        c: { en: "The file isn't kept between jobs; it's removed as soon as the job that downloaded it completes.", fr: "Le fichier n'est pas conservé entre les jobs ; il est supprimé dès que le job qui l'a téléchargé se termine." }
        d: { en: "The task never publishes the file; publishing it as an artifact would copy the secret outside the secure files library.", fr: "La tâche ne publie jamais le fichier ; le publier comme artefact copierait le secret hors de la bibliothèque de fichiers sécurisés." }
    references:
      - title: DownloadSecureFile@1 - Download secure file v1 task
        url: https://learn.microsoft.com/en-us/azure/devops/pipelines/tasks/reference/download-secure-file-v1

  # ------------------------------------------------------------------ 3
  - id: az400-qz-42-03
    objective: "4.2.2"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        A GitHub Actions workflow of the repository **fabrikam/portal** has a step that sends code to an analysis service with a repository secret named **SONAR_TOKEN**. Copies of the repository don't always define the secret, and the step must then be skipped instead of failing.

        You add `if: secrets.SONAR_TOKEN != ''` to the step, but the workflow is rejected.

        What should you do?
      fr: |
        Un workflow GitHub Actions du dépôt **fabrikam/portal** comporte une étape qui envoie le code à un service d'analyse avec un secret de dépôt nommé **SONAR_TOKEN**. Les copies du dépôt ne définissent pas toujours le secret, et l'étape doit alors être ignorée au lieu d'échouer.

        Vous ajoutez `if: secrets.SONAR_TOKEN != ''` à l'étape, mais le workflow est refusé.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Write the condition as `if: ${{ secrets.SONAR_TOKEN != '' }}` so that it's evaluated as an expression.", fr: "Écrire la condition sous la forme `if: ${{ secrets.SONAR_TOKEN != '' }}` pour qu'elle soit évaluée comme une expression." } }
        - { id: b, text: { en: "Map the secret to a job-level environment variable, and test that variable with `if: env.SONAR_TOKEN != ''`.", fr: "Mapper le secret dans une variable d'environnement du job, puis tester cette variable avec `if: env.SONAR_TOKEN != ''`." } }
        - { id: c, text: { en: "Store the token as a configuration variable, and test it with `if: vars.SONAR_TOKEN != ''`.", fr: "Stocker le jeton dans une variable de configuration, puis le tester avec `if: vars.SONAR_TOKEN != ''`." } }
        - { id: d, text: { en: "Move the secret to an environment, and reference that environment in the job that contains the step.", fr: "Déplacer le secret dans un environnement, puis référencer cet environnement dans le job qui contient l'étape." } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          Secrets can't be referenced directly in `if:` conditionals. The documented workaround is to set the secret as a job-level environment variable and to reference that variable in the condition. A secret that isn't set evaluates to an empty string, so the step is skipped in the copies that don't define it.
        fr: |
          Les secrets ne peuvent pas être référencés directement dans les conditions `if:`. La solution documentée consiste à définir le secret comme variable d'environnement au niveau du job et à référencer cette variable dans la condition. Un secret non défini vaut une chaîne vide : l'étape est donc ignorée dans les copies qui ne le définissent pas.
      options:
        a: { en: "The `${{ }}` syntax doesn't lift the restriction: the `if:` condition still references the secrets context directly.", fr: "La syntaxe `${{ }}` ne lève pas la restriction : la condition `if:` référence toujours directement le contexte des secrets." }
        c: { en: "Configuration variables aren't encrypted or masked: storing the token there would expose it.", fr: "Les variables de configuration ne sont ni chiffrées ni masquées : y stocker le jeton l'exposerait." }
        d: { en: "Environment secrets are still secrets: they can't be referenced in `if:` either.", fr: "Les secrets d'environnement restent des secrets : ils ne peuvent pas non plus être référencés dans `if:`." }
    references:
      - title: Manage secrets in GitHub
        url: https://learn.microsoft.com/en-us/training/modules/implement-github-actions/6-manage-github-secrets

  # ------------------------------------------------------------------ 4
  - id: az400-qz-42-04
    objective: "4.2.4"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        A workflow of a public GitHub repository runs on pull requests and contains the following step.

        ```yaml
        - name: Check title
          run: echo "Checking ${{ github.event.pull_request.title }}" && ./check-title.sh
        ```

        A security review warns that a contributor can run arbitrary commands on the runner by choosing a crafted pull request title. You need to remove this risk and keep the title check.

        What should you do?
      fr: |
        Un workflow d'un dépôt GitHub public s'exécute sur les pull requests et contient l'étape suivante.

        ```yaml
        - name: Check title
          run: echo "Checking ${{ github.event.pull_request.title }}" && ./check-title.sh
        ```

        Une revue de sécurité signale qu'un contributeur peut exécuter des commandes arbitraires sur l'exécuteur en choisissant un titre de pull request conçu à cet effet. Vous devez supprimer ce risque et conserver la vérification du titre.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Put the expression between single quotes inside the `run:` command instead of double quotes.", fr: "Placer l'expression entre apostrophes dans la commande `run:` au lieu de guillemets doubles." } }
        - { id: b, text: { en: "Register the title with the `::add-mask::` workflow command before the step runs.", fr: "Enregistrer le titre avec la commande de workflow `::add-mask::` avant l'exécution de l'étape." } }
        - { id: c, text: { en: "Set the `permissions` of the job to `contents: read` so that the token can't write to the repository.", fr: "Définir les `permissions` du job à `contents: read` pour que le jeton ne puisse pas écrire dans le dépôt." } }
        - { id: d, text: { en: "Assign the expression to a variable in the `env:` of the step, and use the quoted variable in `run:`.", fr: "Affecter l'expression à une variable dans le `env:` de l'étape, puis utiliser la variable entre guillemets dans `run:`." } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          An expression inside `run:` is replaced by its value before the shell script is generated, so a crafted title becomes part of the script. Passing the value through an intermediate environment variable, for example `env: TITLE: ${{ github.event.pull_request.title }}` and then `"$TITLE"` in the script, makes the shell treat it as data, not as code.
        fr: |
          Une expression placée dans `run:` est remplacée par sa valeur avant la génération du script shell : un titre conçu à cet effet devient une partie du script. Passer la valeur par une variable d'environnement intermédiaire, par exemple `env: TITLE: ${{ github.event.pull_request.title }}` puis `"$TITLE"` dans le script, fait que le shell la traite comme une donnée et non comme du code.
      options:
        a: { en: "The value is still inserted into the script; a title that contains a single quote closes the quoting and injects commands.", fr: "La valeur est toujours insérée dans le script ; un titre qui contient une apostrophe ferme la chaîne et injecte des commandes." }
        b: { en: "Masking only hides a value in the logs; the injected commands still run.", fr: "Le masquage ne fait que cacher une valeur dans les journaux ; les commandes injectées s'exécutent quand même." }
        c: { en: "Reducing the token's permissions limits the damage but doesn't stop the injected commands from running on the runner.", fr: "Réduire les autorisations du jeton limite les dégâts mais n'empêche pas les commandes injectées de s'exécuter sur l'exécuteur." }
    references:
      - title: Manage encrypted secrets
        url: https://learn.microsoft.com/en-us/training/modules/manage-github-actions-enterprise/manage-encrypted-secrets

  # ------------------------------------------------------------------ 5
  - id: az400-qz-42-05
    objective: "4.2.1"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        An Azure key vault named **kv-tailspin-app** stores the password of an Azure SQL login as a secret named **SqlAppPassword**. An App Service app reads the secret through a Key Vault reference.

        You need the password to be replaced automatically before it expires, in Key Vault and in Azure SQL, without redeploying the app.

        What should you do?
      fr: |
        Un coffre de clés Azure nommé **kv-tailspin-app** stocke le mot de passe d'une connexion Azure SQL dans un secret nommé **SqlAppPassword**. Une application App Service lit le secret par une référence Key Vault.

        Vous devez faire en sorte que le mot de passe soit remplacé automatiquement avant son expiration, dans Key Vault et dans Azure SQL, sans redéployer l'application.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Set an expiration date on the secret, and subscribe an Azure function to its SecretNearExpiry event in Event Grid.", fr: "Définir une date d'expiration sur le secret, puis abonner une fonction Azure à son événement SecretNearExpiry dans Event Grid." } }
        - { id: b, text: { en: "Set an expiration date on the secret, and add a rotation policy to the secret with a time before expiry.", fr: "Définir une date d'expiration sur le secret, puis ajouter au secret une stratégie de rotation avec un délai avant expiration." } }
        - { id: c, text: { en: "Import the password as a certificate, and add an autoRenew lifetime action to the certificate policy.", fr: "Importer le mot de passe comme certificat, puis ajouter une action de durée de vie autoRenew à la stratégie de certificat." } }
        - { id: d, text: { en: "Link the secret to a variable group, and run a scheduled pipeline that reads the latest value of the secret.", fr: "Lier le secret à un groupe de variables, puis exécuter un pipeline planifié qui lit la dernière valeur du secret." } }
    answer: { optionId: a }
    explanation:
      correct:
        en: |
          Secrets are rotated by an Azure function triggered by Event Grid. Thirty days before a secret's expiration date, Key Vault publishes the SecretNearExpiry event; the function generates a new password, updates Azure SQL and creates a new version of the secret. The app reads the latest version through its Key Vault reference, so no redeployment is needed.
        fr: |
          La rotation des secrets se fait par une fonction Azure déclenchée par Event Grid. Trente jours avant la date d'expiration d'un secret, Key Vault publie l'événement SecretNearExpiry ; la fonction génère un nouveau mot de passe, met à jour Azure SQL et crée une nouvelle version du secret. L'application lit la dernière version par sa référence Key Vault : aucun redéploiement n'est nécessaire.
      options:
        b: { en: "Rotation policies that create new versions automatically exist for keys, not for secrets.", fr: "Les stratégies de rotation qui créent automatiquement de nouvelles versions existent pour les clés, pas pour les secrets." }
        c: { en: "A password isn't an X.509 certificate, and renewing a certificate wouldn't change the password in Azure SQL.", fr: "Un mot de passe n'est pas un certificat X.509, et renouveler un certificat ne changerait pas le mot de passe dans Azure SQL." }
        d: { en: "Reading the latest value doesn't create a new password: nothing would rotate the secret or update Azure SQL.", fr: "Lire la dernière valeur ne crée pas de nouveau mot de passe : rien ne ferait tourner le secret ni ne mettrait à jour Azure SQL." }
    references:
      - title: Understanding autorotation in Azure Key Vault
        url: https://learn.microsoft.com/en-us/azure/key-vault/general/autorotation
      - title: Rotation tutorial for resources with one set of authentication credentials stored in Azure Key Vault
        url: https://learn.microsoft.com/en-us/azure/key-vault/secrets/tutorial-rotation

  # ------------------------------------------------------------------ 6
  - id: az400-qz-42-06
    objective: "4.2.3"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Litware has an Azure Pipelines YAML pipeline named **desktop-release** with two jobs in the same stage:

        - **Build** compiles the application and publishes the binaries as a pipeline artifact. It also contains a DownloadSecureFile@1 step named **signingCert** that downloads the secure file **litware-codesign.pfx**.
        - **Sign** depends on Build, downloads the binaries artifact, and runs `./sign.ps1 -Certificate "$(signingCert.secureFilePath)"`.

        desktop-release is authorized to use the secure file. The Sign job fails because the certificate file can't be found. The certificate must not be stored anywhere other than the secure files library.

        What should you do?
      fr: |
        Litware dispose d'un pipeline YAML Azure Pipelines nommé **desktop-release** avec deux jobs dans la même phase :

        - **Build** compile l'application et publie les binaires comme artefact de pipeline. Il contient aussi une étape DownloadSecureFile@1 nommée **signingCert** qui télécharge le fichier sécurisé **litware-codesign.pfx**.
        - **Sign** dépend de Build, télécharge l'artefact des binaires et exécute `./sign.ps1 -Certificate "$(signingCert.secureFilePath)"`.

        desktop-release est autorisé à utiliser le fichier sécurisé. Le job Sign échoue car le fichier du certificat est introuvable. Le certificat ne doit être stocké nulle part ailleurs que dans la bibliothèque de fichiers sécurisés.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Read the path in Sign from `dependencies.Build.outputs['signingCert.secureFilePath']` through a job variable.", fr: "Lire le chemin dans Sign depuis `dependencies.Build.outputs['signingCert.secureFilePath']` par une variable de job." } }
        - { id: b, text: { en: "Copy the certificate to the artifact staging directory in Build, and download it in Sign with the binaries.", fr: "Copier le certificat dans le répertoire de préparation des artefacts dans Build, puis le télécharger dans Sign avec les binaires." } }
        - { id: c, text: { en: "Move the signingCert step from Build to Sign, before the step that runs sign.ps1.", fr: "Déplacer l'étape signingCert de Build vers Sign, avant l'étape qui exécute sign.ps1." } }
        - { id: d, text: { en: "Select Open access on the secure file so that every job of the pipeline can read the downloaded file.", fr: "Sélectionner Open access sur le fichier sécurisé pour que tous les jobs du pipeline puissent lire le fichier téléchargé." } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          DownloadSecureFile@1 places the file on the agent that runs its job, and the file is deleted when that job completes. Each job can run on a different agent, so the Sign job must download the secure file itself; the step's output variable `secureFilePath` then points to a file that exists on Sign's agent.
        fr: |
          DownloadSecureFile@1 place le fichier sur l'agent qui exécute son job, et le fichier est supprimé à la fin de ce job. Chaque job peut s'exécuter sur un agent différent : le job Sign doit donc télécharger lui-même le fichier sécurisé ; la variable de sortie `secureFilePath` de l'étape pointe alors vers un fichier présent sur l'agent de Sign.
      options:
        a: { en: "Even if the path is passed to Sign, it points to Build's agent, where the file was deleted when Build completed.", fr: "Même si le chemin est transmis à Sign, il désigne l'agent de Build, où le fichier a été supprimé à la fin de Build." }
        b: { en: "Publishing the certificate as an artifact stores a copy outside the secure files library, which the requirement forbids.", fr: "Publier le certificat comme artefact en stocke une copie hors de la bibliothèque de fichiers sécurisés, ce que l'exigence interdit." }
        d: { en: "The pipeline is already authorized; Open access authorizes more pipelines but doesn't make a file downloaded by one job available to another.", fr: "Le pipeline est déjà autorisé ; Open access autorise davantage de pipelines mais ne rend pas un fichier téléchargé par un job disponible pour un autre." }
    references:
      - title: DownloadSecureFile@1 - Download secure file v1 task
        url: https://learn.microsoft.com/en-us/azure/devops/pipelines/tasks/reference/download-secure-file-v1
      - title: Secure files for Azure Pipelines
        url: https://learn.microsoft.com/en-us/azure/devops/pipelines/library/secure-files

  # ------------------------------------------------------------------ 7
  - id: az400-qz-42-07
    objective: "4.2.2"
    difficulty: 3
    status: draft
    type: dropdown
    stem:
      en: |
        Fabrikam has an Azure Resource Manager service connection named **sc-fabrikam-wif** that uses workload identity federation. A pipeline step must run a PowerShell Core script that uses both Azure CLI commands and Az PowerShell cmdlets with the identity of sc-fabrikam-wif.

        You need to complete the step. The solution must meet the following requirements:

        - Az PowerShell must sign in with the same identity as the Azure CLI, without any secret stored in Azure DevOps.
        - No credential value must be written in the pipeline definition.

        How should you complete the YAML? Select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Fabrikam dispose d'une connexion de service Azure Resource Manager nommée **sc-fabrikam-wif** qui utilise la fédération d'identité de charge de travail. Une étape de pipeline doit exécuter un script PowerShell Core qui utilise à la fois des commandes Azure CLI et des commandes Az PowerShell avec l'identité de sc-fabrikam-wif.

        Vous devez compléter l'étape. La solution doit répondre aux exigences suivantes :

        - Az PowerShell doit se connecter avec la même identité qu'Azure CLI, sans aucun secret stocké dans Azure DevOps.
        - Aucune valeur d'information d'identification ne doit être écrite dans la définition du pipeline.

        Comment devez-vous compléter le YAML ? Sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: code
      language: yaml
      template:
        en: |
          - task: AzureCLI@2
            inputs:
              azureSubscription: 'sc-fabrikam-wif'
              scriptType: 'pscore'
              scriptLocation: 'inlineScript'
              [[input]]: true
              inlineScript: |
                az group list --query "[].name" --output tsv
                Connect-AzAccount -ServicePrincipal `
                  -ApplicationId $env:[[appid]] `
                  -FederatedToken $env:[[token]] `
                  -Tenant $env:tenantId
                ./Update-Tags.ps1
        fr: |
          - task: AzureCLI@2
            inputs:
              azureSubscription: 'sc-fabrikam-wif'
              scriptType: 'pscore'
              scriptLocation: 'inlineScript'
              [[input]]: true
              inlineScript: |
                az group list --query "[].name" --output tsv
                Connect-AzAccount -ServicePrincipal `
                  -ApplicationId $env:[[appid]] `
                  -FederatedToken $env:[[token]] `
                  -Tenant $env:tenantId
                ./Update-Tags.ps1
      slots:
        - id: input
          options:
            - { id: useglobal, text: useGlobalConfig }
            - { id: addspn, text: addSpnToEnvironment }
            - { id: visible, text: visibleAzLogin }
            - { id: failstderr, text: failOnStandardError }
        - id: appid
          options:
            - { id: spid, text: servicePrincipalId }
            - { id: tenant, text: tenantId }
            - { id: idtoken, text: idToken }
            - { id: spkey, text: servicePrincipalKey }
        - id: token
          options:
            - { id: spid, text: servicePrincipalId }
            - { id: spkey, text: servicePrincipalKey }
            - { id: idtoken, text: idToken }
            - { id: accesstoken, text: SYSTEM_ACCESSTOKEN }
    answer:
      values: { input: addspn, appid: spid, token: idtoken }
    explanation:
      correct:
        en: |
          `addSpnToEnvironment: true` adds the service principal ID, the tenant ID and either the service principal key or, for workload identity federation, the federation token to the script's environment. In PowerShell they're read as `$env:servicePrincipalId` and `$env:idToken`, which Connect-AzAccount accepts with `-ApplicationId` and `-FederatedToken`. Nothing is stored in Azure DevOps or written in the YAML.
        fr: |
          `addSpnToEnvironment: true` ajoute à l'environnement du script l'ID du principal de service, l'ID de locataire et soit la clé du principal de service, soit, avec la fédération d'identité de charge de travail, le jeton de fédération. En PowerShell, ils se lisent avec `$env:servicePrincipalId` et `$env:idToken`, que Connect-AzAccount accepte avec `-ApplicationId` et `-FederatedToken`. Rien n'est stocké dans Azure DevOps ni écrit dans le YAML.
      options:
        input: { en: "useGlobalConfig selects the Azure CLI configuration, visibleAzLogin shows or hides the az login output and failOnStandardError fails on stderr output: none of them exposes the identity to the script.", fr: "useGlobalConfig choisit la configuration d'Azure CLI, visibleAzLogin affiche ou masque la sortie de az login et failOnStandardError fait échouer la tâche sur la sortie d'erreur : aucune n'expose l'identité au script." }
        token: { en: "A federation service connection has no client secret: the task provides idToken instead of servicePrincipalKey. SYSTEM_ACCESSTOKEN is an Azure DevOps token, not a Microsoft Entra federation token.", fr: "Une connexion de service fédérée n'a pas de secret client : la tâche fournit idToken au lieu de servicePrincipalKey. SYSTEM_ACCESSTOKEN est un jeton Azure DevOps, pas un jeton de fédération Microsoft Entra." }
    references:
      - title: AzureCLI@2 - Azure CLI v2 task
        url: https://learn.microsoft.com/en-us/azure/devops/pipelines/tasks/reference/azure-cli-v2
      - title: Connect-AzAccount (Az.Accounts)
        url: https://learn.microsoft.com/en-us/powershell/module/az.accounts/connect-azaccount

  # ------------------------------------------------------------------ 8
  - id: az400-qz-42-08
    objective: "4.2.2"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        The public GitHub repository **contoso/shop** has a repository secret named **DEPLOY_KEY** and an environment named **production** that has an environment secret named **PROD_DB** and a required reviewer.

        The workflow **ci.yml** runs on `pull_request` and calls the reusable workflow `./.github/workflows/deploy.yml` from a job that has no `secrets:` key. A job of **release.yml** references the production environment and reads `secrets.PROD_DB`.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Le dépôt GitHub public **contoso/shop** possède un secret de dépôt nommé **DEPLOY_KEY** et un environnement nommé **production** qui a un secret d'environnement nommé **PROD_DB** et un relecteur obligatoire.

        Le workflow **ci.yml** s'exécute sur `pull_request` et appelle le workflow réutilisable `./.github/workflows/deploy.yml` depuis un job qui n'a pas de clé `secrets:`. Un job de **release.yml** référence l'environnement production et lit `secrets.PROD_DB`.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - { id: s1, text: { en: "When ci.yml runs for a pull request opened from a branch of contoso/shop, deploy.yml can read `secrets.DEPLOY_KEY`.", fr: "Quand ci.yml s'exécute pour une pull request ouverte depuis une branche de contoso/shop, deploy.yml peut lire `secrets.DEPLOY_KEY`." } }
        - { id: s2, text: { en: "When ci.yml runs for a pull request opened from a fork of contoso/shop, its jobs can read `secrets.DEPLOY_KEY`.", fr: "Quand ci.yml s'exécute pour une pull request ouverte depuis un fork de contoso/shop, ses jobs peuvent lire `secrets.DEPLOY_KEY`." } }
        - { id: s3, text: { en: "If an administrator changes PROD_DB while the release.yml job waits for the reviewer, the job receives the new value once it's approved.", fr: "Si un administrateur modifie PROD_DB pendant que le job de release.yml attend le relecteur, le job reçoit la nouvelle valeur une fois approuvé." } }
    answer:
      values: { s1: false, s2: false, s3: true }
    explanation:
      correct:
        en: |
          Secrets aren't passed automatically to reusable workflows: the calling job must pass them explicitly, so deploy.yml receives no DEPLOY_KEY. Workflows triggered from forks receive no secrets except GITHUB_TOKEN. Environment secrets are read when a job that references the environment starts, and that job can't start before the required reviewer approves it, so it gets the value current at approval time.
        fr: |
          Les secrets ne sont pas transmis automatiquement aux workflows réutilisables : le job appelant doit les transmettre explicitement, donc deploy.yml ne reçoit pas DEPLOY_KEY. Les workflows déclenchés depuis des forks ne reçoivent aucun secret, sauf GITHUB_TOKEN. Les secrets d'environnement sont lus au démarrage d'un job qui référence l'environnement, et ce job ne peut pas démarrer avant l'approbation du relecteur obligatoire : il obtient la valeur en vigueur au moment de l'approbation.
      options:
        s1: { en: "No: the caller has no `secrets:` key, and secrets are never passed implicitly to a reusable workflow.", fr: "Non : l'appelant n'a pas de clé `secrets:`, et les secrets ne sont jamais transmis implicitement à un workflow réutilisable." }
        s3: { en: "Yes: unlike repository secrets, read when the run is queued, environment secrets are read when the job starts, after the approval.", fr: "Oui : contrairement aux secrets de dépôt, lus quand l'exécution est mise en file d'attente, les secrets d'environnement sont lus au démarrage du job, après l'approbation." }
    references:
      - title: Manage secrets in GitHub
        url: https://learn.microsoft.com/en-us/training/modules/implement-github-actions/6-manage-github-secrets

  # ------------------------------------------------------------------ 9
  - id: az400-qz-42-09
    objective: "4.2.4"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Woodgrove Bank has an Azure DevOps organization created in 2021. It contains 25 projects, and new projects are created every quarter. Many YAML pipelines build public GitHub repositories, and some of them have **Make secrets available to builds of forks** enabled. The **Limit building pull requests from forked GitHub repositories** control is off.

        You need to ensure that, in every current and future project, pull requests from forks can still be built but only after a comment from a team member, never receive secrets, and never get the same permissions as regular builds. The solution must minimize administrative effort.

        What should you do?
      fr: |
        Woodgrove Bank dispose d'une organisation Azure DevOps créée en 2021. Elle contient 25 projets, et de nouveaux projets sont créés chaque trimestre. De nombreux pipelines YAML génèrent des dépôts GitHub publics, et certains ont **Make secrets available to builds of forks** activé. Le contrôle **Limit building pull requests from forked GitHub repositories** est désactivé.

        Vous devez faire en sorte que, dans chaque projet actuel et futur, les pull requests depuis des forks puissent toujours être générées mais seulement après le commentaire d'un membre de l'équipe, ne reçoivent jamais de secrets et n'obtiennent jamais les mêmes autorisations que les builds normaux. La solution doit réduire au minimum l'effort administratif.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "In the organization settings, set the control to Disable building pull requests from forked repositories.", fr: "Dans les paramètres de l'organisation, régler le contrôle sur Disable building pull requests from forked repositories." } }
        - { id: b, text: { en: "In the organization settings, set the control to Securely build pull requests from forked repositories.", fr: "Dans les paramètres de l'organisation, régler le contrôle sur Securely build pull requests from forked repositories." } }
        - { id: c, text: { en: "In the settings of each project, set the control to Securely build pull requests from forked repositories.", fr: "Dans les paramètres de chaque projet, régler le contrôle sur Securely build pull requests from forked repositories." } }
        - { id: d, text: { en: "In the triggers of each pipeline, clear the secrets option and require a team member's comment on all pull requests.", fr: "Dans les déclencheurs de chaque pipeline, désactiver l'option des secrets et exiger le commentaire d'un membre de l'équipe sur toutes les pull requests." } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          The control exists at the organization and project levels. With Securely build pull requests from forked repositories, no pipeline can make secrets available to fork builds or give them the permissions of regular builds, and fork builds must be triggered by a pull request comment. Set once at the organization level, it applies to every project, including the ones created later.
        fr: |
          Le contrôle existe au niveau de l'organisation et du projet. Avec Securely build pull requests from forked repositories, aucun pipeline ne peut rendre les secrets disponibles aux builds de forks ni leur donner les autorisations des builds normaux, et les builds de forks doivent être déclenchés par un commentaire de pull request. Réglé une seule fois au niveau de l'organisation, il s'applique à tous les projets, y compris ceux créés plus tard.
      options:
        a: { en: "Disabling fork builds blocks the validation of fork pull requests, which must still be built.", fr: "Désactiver les builds de forks empêche la validation des pull requests de forks, qui doivent toujours être générées." }
        c: { en: "The project-level setting works for the current projects but must be repeated 25 times and again for every new project.", fr: "Le paramètre au niveau du projet fonctionne pour les projets actuels, mais doit être répété 25 fois puis pour chaque nouveau projet." }
        d: { en: "Editing every pipeline is the most effort, and nothing prevents a pipeline owner, or a new pipeline, from enabling the options again.", fr: "Modifier chaque pipeline demande le plus d'effort, et rien n'empêche le propriétaire d'un pipeline, ou un nouveau pipeline, de réactiver les options." }
    references:
      - title: Build GitHub repositories
        url: https://learn.microsoft.com/en-us/azure/devops/pipelines/repos/github

  # ------------------------------------------------------------------ 10
  - id: az400-qz-42-10
    objective: "4.2.1"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        Woodgrove Bank has an Azure key vault named **kv-wgb-pay** that uses the Azure role-based access control permission model. Public network access to kv-wgb-pay is disabled, and the vault has a private endpoint in a virtual network named **vnet-hub**, with a private DNS zone linked to vnet-hub.

        A YAML pipeline named **pay-deploy** runs on Microsoft-hosted agents. It reads secrets with the AzureKeyVault@2 task through a new Azure Resource Manager service connection named **sc-pay-wif**, whose service principal has no role on kv-wgb-pay. The task fails.

        You need pay-deploy to read the secrets. Public network access to kv-wgb-pay must stay disabled, and the solution must follow the principle of least privilege.

        Which two actions should you perform? Each correct answer presents part of the solution.

        NOTE: Each correct selection is worth one point.
      fr: |
        Woodgrove Bank dispose d'un coffre de clés Azure nommé **kv-wgb-pay** qui utilise le modèle d'autorisation contrôle d'accès en fonction du rôle Azure. L'accès réseau public à kv-wgb-pay est désactivé, et le coffre a un point de terminaison privé dans un réseau virtuel nommé **vnet-hub**, avec une zone DNS privée liée à vnet-hub.

        Un pipeline YAML nommé **pay-deploy** s'exécute sur des agents hébergés par Microsoft. Il lit des secrets avec la tâche AzureKeyVault@2 par une nouvelle connexion de service Azure Resource Manager nommée **sc-pay-wif**, dont le principal de service n'a aucun rôle sur kv-wgb-pay. La tâche échoue.

        Vous devez faire en sorte que pay-deploy lise les secrets. L'accès réseau public à kv-wgb-pay doit rester désactivé, et la solution doit respecter le principe du moindre privilège.

        Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

        Remarque : chaque sélection correcte vaut un point.
    body:
      options:
        - { id: a, text: { en: "Turn on Allow trusted Microsoft services to bypass this firewall on kv-wgb-pay.", fr: "Activer Allow trusted Microsoft services to bypass this firewall sur kv-wgb-pay." } }
        - { id: b, text: { en: "Run pay-deploy on a self-hosted agent pool whose agents are deployed in vnet-hub.", fr: "Exécuter pay-deploy sur un pool d'agents auto-hébergés dont les agents sont déployés dans vnet-hub." } }
        - { id: c, text: { en: "Add the Azure DevOps IP ranges of the organization's geography to the firewall of kv-wgb-pay.", fr: "Ajouter les plages d'adresses IP d'Azure DevOps de la zone géographique de l'organisation au pare-feu de kv-wgb-pay." } }
        - { id: d, text: { en: "Assign the Key Vault Secrets User role on kv-wgb-pay to the service principal of sc-pay-wif.", fr: "Attribuer le rôle Key Vault Secrets User sur kv-wgb-pay au principal de service de sc-pay-wif." } }
        - { id: e, text: { en: "Assign the Key Vault Reader role on kv-wgb-pay to the service principal of sc-pay-wif.", fr: "Attribuer le rôle Key Vault Reader sur kv-wgb-pay au principal de service de sc-pay-wif." } }
        - { id: f, text: { en: "Assign the Key Vault Contributor role on kv-wgb-pay to the service principal of sc-pay-wif.", fr: "Attribuer le rôle Key Vault Contributor sur kv-wgb-pay au principal de service de sc-pay-wif." } }
      choose: 2
    answer: { optionIds: [b, d] }
    explanation:
      correct:
        en: |
          Azure DevOps isn't on the Key Vault trusted services list, so with public access disabled the vault is reachable only through its private endpoint; a self-hosted agent in vnet-hub, where the private DNS zone resolves the vault name to the private endpoint, can run AzureKeyVault@2 against it. With the Azure RBAC model, reading secret contents also needs a data plane role, and Key Vault Secrets User is the least privileged one that allows it.
        fr: |
          Azure DevOps ne fait pas partie de la liste des services approuvés de Key Vault : avec l'accès public désactivé, le coffre n'est joignable que par son point de terminaison privé ; un agent auto-hébergé dans vnet-hub, où la zone DNS privée résout le nom du coffre vers le point de terminaison privé, peut y exécuter AzureKeyVault@2. Avec le modèle Azure RBAC, lire le contenu des secrets exige aussi un rôle du plan de données, et Key Vault Secrets User est le moins privilégié qui le permet.
      options:
        a: { en: "Azure DevOps isn't a trusted Microsoft service for Key Vault: the bypass doesn't let the pipeline through.", fr: "Azure DevOps n'est pas un service Microsoft approuvé pour Key Vault : l'exception ne laisse pas passer le pipeline." }
        c: { en: "IP rules apply to public network access, which must stay disabled; allowing the ranges would reopen the vault to public traffic.", fr: "Les règles IP s'appliquent à l'accès réseau public, qui doit rester désactivé ; autoriser les plages rouvrirait le coffre au trafic public." }
        e: { en: "Key Vault Reader reads only metadata, never secret contents: the task still fails.", fr: "Key Vault Reader ne lit que les métadonnées, jamais le contenu des secrets : la tâche échoue toujours." }
        f: { en: "Key Vault Contributor manages the vault resource only and gives no access to secrets with the RBAC model.", fr: "Key Vault Contributor ne gère que la ressource coffre et ne donne aucun accès aux secrets avec le modèle RBAC." }
    references:
      - title: Access a private key vault from your pipeline
        url: https://learn.microsoft.com/en-us/azure/devops/pipelines/release/key-vault-access
      - title: Configure network security for Azure Key Vault
        url: https://learn.microsoft.com/en-us/azure/key-vault/general/network-security
