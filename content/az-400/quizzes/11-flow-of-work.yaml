chapter: 11-flow-of-work
questions:
  # ------------------------------------------------------------------ 1
  - id: az400-qz-11-01
    objective: "1.1.1"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        The developers at Wingtip Toys work in a single GitHub repository. Each change starts in a branch created from `main`, is reviewed in a pull request and is merged into `main`, which can be deployed at any time. The branch is then deleted. The team keeps no other long-lived branch.

        Which workflow does the team follow?
      fr: |
        Les développeurs de Wingtip Toys travaillent dans un seul dépôt GitHub. Chaque modification commence dans une branche créée à partir de `main`, est révisée dans une pull request puis fusionnée dans `main`, qui peut être déployée à tout moment. La branche est ensuite supprimée. L'équipe ne conserve aucune autre branche de longue durée.

        Quel workflow l'équipe suit-elle ?
    body:
      options:
        - { id: a, text: "Git Flow" }
        - { id: b, text: "GitHub Flow" }
        - { id: c, text: { en: "Forking workflow", fr: "Workflow de duplication (fork)" } }
        - { id: d, text: { en: "Release branching", fr: "Branches de mise en production" } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          GitHub Flow is a lightweight workflow built on one deployable default branch: you create a branch from it, open a pull request to get a review, merge after approval and delete the branch. No `develop` branch and no long-lived release branch are involved.
        fr: |
          GitHub Flow est un workflow léger construit autour d'une seule branche par défaut déployable : vous créez une branche à partir d'elle, ouvrez une pull request pour obtenir une revue, fusionnez après approbation, puis supprimez la branche. Aucune branche `develop` ni aucune branche de mise en production de longue durée n'intervient.
      options:
        a: { en: "Git Flow keeps a long-lived `develop` branch and release branches next to `main`.", fr: "Git Flow conserve une branche `develop` de longue durée et des branches de mise en production à côté de `main`." }
        c: { en: "In a forking workflow, contributors push to their own copy of the repository, not to branches of a single shared repository.", fr: "Dans un workflow de duplication, les contributeurs envoient leurs commits dans leur propre copie du dépôt, pas dans des branches d'un dépôt partagé unique." }
        d: { en: "Release branching keeps one long-lived branch per released version, which the team doesn't have.", fr: "Les branches de mise en production conservent une branche de longue durée par version publiée, ce que l'équipe n'a pas." }
    references:
      - title: Components of the GitHub flow
        url: https://learn.microsoft.com/en-us/training/modules/introduction-to-github/3-components-of-github-flow

  # ------------------------------------------------------------------ 2
  - id: az400-qz-11-02
    objective: "1.1.3"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Contoso has connected a GitHub repository named **web** to an Azure Boards project. A developer opens a pull request that implements user story 1423 and must link the pull request to the user story by typing `AB#1423`.

        Where should the developer type `AB#1423`?
      fr: |
        Contoso a connecté un dépôt GitHub nommé **web** à un projet Azure Boards. Un développeur ouvre une pull request qui implémente la user story 1423 et doit lier la pull request à la user story en saisissant `AB#1423`.

        Où le développeur doit-il saisir `AB#1423` ?
    body:
      options:
        - { id: a, text: { en: "In the title of the pull request", fr: "Dans le titre de la pull request" } }
        - { id: b, text: { en: "In a comment on the pull request", fr: "Dans un commentaire de la pull request" } }
        - { id: c, text: { en: "In the description of the pull request", fr: "Dans la description de la pull request" } }
        - { id: d, text: { en: "In a label added to the pull request", fr: "Dans une étiquette ajoutée à la pull request" } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          Azure Boards parses `AB#` mentions in commit messages, pull request descriptions and issue descriptions of the connected repositories. A mention in the pull request description creates a GitHub Pull Request link that appears in the Development section of the user story.
        fr: |
          Azure Boards analyse les mentions `AB#` dans les messages de commit, les descriptions de pull request et les descriptions d'issue des dépôts connectés. Une mention dans la description de la pull request crée un lien GitHub Pull Request qui apparaît dans la section Development de la user story.
      options:
        a: { en: "A mention in the pull request title creates no link on the work item.", fr: "Une mention dans le titre de la pull request ne crée aucun lien sur l'élément de travail." }
        b: { en: "A mention in a comment creates no link on the work item.", fr: "Une mention dans un commentaire ne crée aucun lien sur l'élément de travail." }
        d: { en: "Labels aren't parsed for `AB#` mentions; only commit messages and pull request and issue descriptions are.", fr: "Les étiquettes ne sont pas analysées pour les mentions `AB#` ; seuls les messages de commit et les descriptions de pull request et d'issue le sont." }
    references:
      - title: Link GitHub commits, pull requests, branches, and issues to work items in Azure Boards
        url: https://learn.microsoft.com/en-us/azure/devops/boards/github/link-to-from-github

  # ------------------------------------------------------------------ 3
  - id: az400-qz-11-03
    objective: "1.1.2"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Litware maintains a public GitHub repository named **litware/pdf-kit**. Anna, a support engineer, has Read access to the repository and doesn't watch it. Issue #317 tracks a defect that affects a major customer. Anna has never commented on this issue.

        Anna must be notified of every new comment on issue #317 and of no other activity in the repository. What should Anna do?
      fr: |
        Litware gère un dépôt GitHub public nommé **litware/pdf-kit**. Anna, ingénieure du support, dispose de l'accès Read au dépôt et ne le suit pas. L'issue #317 suit un défaut qui touche un client important. Anna n'a jamais commenté cette issue.

        Anna doit être avertie de chaque nouveau commentaire sur l'issue #317, et d'aucune autre activité du dépôt. Que doit faire Anna ?
    body:
      options:
        - { id: a, text: { en: "Set **Watch** to **Custom** for litware/pdf-kit and select **Issues**.", fr: "Définir **Watch** sur **Custom** pour litware/pdf-kit et sélectionner **Issues**." } }
        - { id: b, text: { en: "Set **Watch** to **Watching** for litware/pdf-kit.", fr: "Définir **Watch** sur **Watching** pour litware/pdf-kit." } }
        - { id: c, text: { en: "Keep **Watch** set to **Not watching**, and open issue #317 once.", fr: "Conserver **Watch** sur **Not watching**, et ouvrir une fois l'issue #317." } }
        - { id: d, text: { en: "Select **Subscribe** in the sidebar of issue #317.", fr: "Sélectionner **Subscribe** dans la barre latérale de l'issue #317." } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          You can subscribe to a single issue or pull request from its sidebar, even if you never took part in the conversation. Anna then receives the notifications of that thread only, while her watch setting for the rest of the repository stays unchanged.
        fr: |
          Vous pouvez vous abonner à une seule issue ou pull request depuis sa barre latérale, même sans avoir participé à la conversation. Anna reçoit alors uniquement les notifications de ce fil, et son paramètre de suivi pour le reste du dépôt reste inchangé.
      options:
        a: { en: "A custom watch on Issues notifies her about every issue of the repository, not only issue #317.", fr: "Un suivi personnalisé sur Issues l'avertit de toutes les issues du dépôt, pas seulement de l'issue #317." }
        b: { en: "Watching sends notifications for all the activity of the repository.", fr: "Watching envoie des notifications pour toute l'activité du dépôt." }
        c: { en: "Not watching notifies her only when she participates or is @mentioned; reading an issue doesn't subscribe her to it.", fr: "Not watching ne l'avertit que lorsqu'elle participe ou est @mentionnée ; lire une issue ne l'y abonne pas." }
    references:
      - title: GitHub platform management
        url: https://learn.microsoft.com/en-us/training/modules/introduction-to-github/5-platform-management

  # ------------------------------------------------------------------ 4
  - id: az400-qz-11-04
    objective: "1.1.1"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Fabrikam has an Azure DevOps project named **Retail** whose default team is also named **Retail**. Two teams, **Web** and **Mobile**, are added to the project. All work items still use the root area path, so every team backlog shows every item.

        The backlog of each new team must show only the items of that team, and the backlog of the Retail team must keep showing the items of both teams. What should you do?
      fr: |
        Fabrikam dispose d'un projet Azure DevOps nommé **Retail** dont l'équipe par défaut s'appelle aussi **Retail**. Deux équipes, **Web** et **Mobile**, sont ajoutées au projet. Tous les éléments de travail utilisent encore le chemin de zone racine : chaque backlog d'équipe affiche donc tous les éléments.

        Le backlog de chaque nouvelle équipe doit afficher uniquement les éléments de cette équipe, et le backlog de l'équipe Retail doit continuer à afficher les éléments des deux équipes. Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Create the iteration paths Retail\\Web and Retail\\Mobile, select each one for its team, and select every iteration for the Retail team.", fr: "Créer les chemins d'itération Retail\\Web et Retail\\Mobile, sélectionner chacun pour son équipe, et sélectionner toutes les itérations pour l'équipe Retail." } }
        - { id: b, text: { en: "Create the area paths Retail\\Web and Retail\\Mobile, select each one for its team, and select the root area with its subareas for the Retail team.", fr: "Créer les chemins de zone Retail\\Web et Retail\\Mobile, sélectionner chacun pour son équipe, et sélectionner la zone racine avec ses sous-zones pour l'équipe Retail." } }
        - { id: c, text: { en: "Tag each work item with Web or Mobile, and save one shared query per team that filters on its tag and on the root area path.", fr: "Marquer chaque élément de travail avec la balise Web ou Mobile, et enregistrer une requête partagée par équipe qui filtre sur sa balise et sur le chemin de zone racine." } }
        - { id: d, text: { en: "Move the items of each new team to a separate project, and add the backlogs of the three projects to a delivery plan for the Retail team.", fr: "Déplacer les éléments de chaque nouvelle équipe vers un projet distinct, et ajouter les backlogs des trois projets à un plan de livraison pour l'équipe Retail." } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          The area path says who owns a work item, and a team backlog shows the items assigned to the area paths that the team selects. Each new team selects its own area, and the Retail team selects the root area with its subareas to keep a rollup view of both teams. The items then get the area path of their team.
        fr: |
          Le chemin de zone indique qui porte un élément de travail, et le backlog d'une équipe affiche les éléments affectés aux chemins de zone que l'équipe sélectionne. Chaque nouvelle équipe sélectionne sa propre zone, et l'équipe Retail sélectionne la zone racine avec ses sous-zones pour garder une vue consolidée des deux équipes. Les éléments reçoivent ensuite le chemin de zone de leur équipe.
      options:
        a: { en: "Iteration paths say when work happens (sprints); they don't decide which team owns an item.", fr: "Les chemins d'itération indiquent quand le travail a lieu (sprints) ; ils ne déterminent pas quelle équipe porte un élément." }
        c: { en: "Tags and queries don't change what a team backlog shows: the backlogs still filter on the area paths.", fr: "Les balises et les requêtes ne changent pas ce qu'affiche un backlog d'équipe : les backlogs filtrent toujours sur les chemins de zone." }
        d: { en: "Separate projects split the work and the Retail team backlog no longer shows the items; a delivery plan is a calendar view, not a backlog.", fr: "Des projets distincts séparent le travail et le backlog de l'équipe Retail n'affiche plus les éléments ; un plan de livraison est une vue calendaire, pas un backlog." }
    references:
      - title: Define area paths and assign to a team
        url: https://learn.microsoft.com/en-us/azure/devops/organizations/settings/set-area-paths

  # ------------------------------------------------------------------ 5
  - id: az400-qz-11-05
    objective: "1.1.4"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Adatum runs about 600 automated tests in a YAML pipeline named **claims-ci**, which publishes the test results to Azure Pipelines. The project uses the Agile process.

        The product owner needs a dashboard widget that shows, for the user stories of the current sprint, the pass rate of the tests that cover each story in the test stage of claims-ci, and the stories that have no test. What should you do?
      fr: |
        Adatum exécute environ 600 tests automatisés dans un pipeline YAML nommé **claims-ci**, qui publie les résultats des tests dans Azure Pipelines. Le projet utilise le processus Agile.

        Le propriétaire du produit a besoin d'un widget de tableau de bord qui affiche, pour les user stories du sprint en cours, le taux de réussite des tests qui couvrent chaque story dans la phase de test de claims-ci, ainsi que les stories qui n'ont aucun test. Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "From the **Tests** tab of a run, link each test to its user story, then add a Test Results Trend (Advanced) widget for claims-ci.", fr: "Depuis l'onglet **Tests** d'une exécution, lier chaque test à sa user story, puis ajouter un widget Test Results Trend (Advanced) pour claims-ci." } }
        - { id: b, text: { en: "From the **Tests** tab of a run, create a bug for each failed test, then add a Requirements quality widget based on the sprint's stories.", fr: "Depuis l'onglet **Tests** d'une exécution, créer un bogue pour chaque test en échec, puis ajouter un widget Requirements quality basé sur les stories du sprint." } }
        - { id: c, text: { en: "From the **Tests** tab of a run, link each test to the feature of its story, then add a Requirements quality widget based on the sprint's features.", fr: "Depuis l'onglet **Tests** d'une exécution, lier chaque test à la feature de sa story, puis ajouter un widget Requirements quality basé sur les features du sprint." } }
        - { id: d, text: { en: "From the **Tests** tab of a run, link each test to its user story, then add a Requirements quality widget based on the sprint's stories.", fr: "Depuis l'onglet **Tests** d'une exécution, lier chaque test à sa user story, puis ajouter un widget Requirements quality basé sur les stories du sprint." } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          Quality traceability starts by linking automated tests to work items of the Requirements category from the Tests tab of a run. The Requirements quality widget then takes a query that returns the requirements and a pipeline stage, and shows the pass rate and failed tests of each requirement, as well as the requirements without any test.
        fr: |
          La traçabilité de la qualité commence par la liaison des tests automatisés à des éléments de travail de la catégorie Requirements depuis l'onglet Tests d'une exécution. Le widget Requirements quality utilise ensuite une requête qui renvoie les exigences et une phase de pipeline, et affiche le taux de réussite et les tests en échec de chaque exigence, ainsi que les exigences sans aucun test.
      options:
        a: { en: "Test Results Trend (Advanced) shows test trends across pipelines, not the pass rate of each requirement or the requirements without tests.", fr: "Test Results Trend (Advanced) affiche les tendances des tests sur plusieurs pipelines, pas le taux de réussite de chaque exigence ni les exigences sans test." }
        b: { en: "Bugs created from failed tests trace defects; without tests linked to the stories, the widget has no pass rate to show.", fr: "Les bogues créés à partir de tests en échec tracent les défauts ; sans tests liés aux stories, le widget n'a aucun taux de réussite à afficher." }
        c: { en: "Tests can be linked only to work items of the Requirements category; in Agile, features are portfolio items, not requirements.", fr: "Les tests ne peuvent être liés qu'à des éléments de travail de la catégorie Requirements ; en Agile, les features sont des éléments de portefeuille, pas des exigences." }
    references:
      - title: Requirements traceability
        url: https://learn.microsoft.com/en-us/azure/devops/pipelines/test/requirements-traceability

  # ------------------------------------------------------------------ 6
  - id: az400-qz-11-06
    objective: "1.1.1"
    difficulty: 3
    status: draft
    type: dropdown
    stem:
      en: |
        The Claims team at Contoso works in an Azure DevOps project that uses the Agile system process. You are a Team Administrator of Claims and a member of the Project Collection Administrators group. During a retrospective, the team lists three needs.

        You need to meet each need with the least administrative effort. What should you configure? To answer, select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        L'équipe Claims de Contoso travaille dans un projet Azure DevOps qui utilise le processus système Agile. Vous êtes Team Administrator de Claims et membre du groupe Project Collection Administrators. Lors d'une rétrospective, l'équipe liste trois besoins.

        Vous devez satisfaire chaque besoin avec un minimum d'effort administratif. Que devez-vous configurer ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: text
      template:
        en: |
          Developers estimate bugs in hours and update them on the sprint taskboard, under the user story that each bug affects: [[bugs]]
          Urgent production fixes appear in a separate horizontal lane at the top of the board: [[lane]]
          User stories get a Security Review state that work item queries and Analytics reports can filter on: [[state]]
        fr: |
          Les développeurs estiment les bogues en heures et les mettent à jour sur le tableau des tâches du sprint, sous la user story concernée par chaque bogue : [[bugs]]
          Les correctifs urgents de production apparaissent dans un couloir horizontal distinct en haut du tableau : [[lane]]
          Les user stories reçoivent un état Security Review sur lequel les requêtes d'éléments de travail et les rapports Analytics peuvent filtrer : [[state]]
      slots:
        - id: bugs
          options:
            - { id: req, text: { en: "Set Working with bugs to track bugs as requirements", fr: "Définir Working with bugs pour suivre les bogues comme des exigences" } }
            - { id: tasks, text: { en: "Set Working with bugs to track bugs as tasks", fr: "Définir Working with bugs pour suivre les bogues comme des tâches" } }
            - { id: column, text: { en: "Add a Bugs column to the board", fr: "Ajouter une colonne Bugs au tableau" } }
            - { id: lane, text: { en: "Add a Bugs swimlane to the board", fr: "Ajouter un couloir (swimlane) Bugs au tableau" } }
        - id: lane
          options:
            - { id: column, text: { en: "Add an Expedite column with a WIP limit of 1", fr: "Ajouter une colonne Expedite avec une limite de WIP de 1" } }
            - { id: split, text: { en: "Split the Active column into Doing and Done", fr: "Fractionner la colonne Active en Doing et Done" } }
            - { id: swim, text: { en: "Add an Expedite swimlane", fr: "Ajouter un couloir (swimlane) Expedite" } }
            - { id: style, text: { en: "Add a card style rule that colors urgent items", fr: "Ajouter une règle de style de carte qui colore les éléments urgents" } }
        - id: state
          options:
            - { id: column, text: { en: "Add a Security Review column to the board, and map it to the Active state of User Story", fr: "Ajouter une colonne Security Review au tableau, et la mapper à l'état Active de User Story" } }
            - { id: inherit, text: { en: "Add the state to User Story in an inherited process, move the project to it, and map the state to a column", fr: "Ajouter l'état à User Story dans un processus hérité, y basculer le projet, et mapper l'état à une colonne" } }
            - { id: system, text: { en: "Add the state to User Story in the Agile system process of the project, and map the state to a column", fr: "Ajouter l'état à User Story dans le processus système Agile du projet, et mapper l'état à une colonne" } }
            - { id: split, text: { en: "Split the Active column of the board, and rename its Done part to Security Review", fr: "Fractionner la colonne Active du tableau, et renommer sa partie Done en Security Review" } }
    answer:
      values: { bugs: tasks, lane: swim, state: inherit }
    explanation:
      correct:
        en: |
          The Working with bugs team setting decides where bugs live: tracked as tasks, they appear on the sprint backlog and taskboard, where they can be estimated like tasks. A swimlane separates a class of work, such as expedited items, in its own horizontal lane. Board columns and split columns are team views mapped to existing states; a new workflow state requires an inherited process, because the Agile system process is locked, and the new state must then be mapped to a column.
        fr: |
          Le paramètre d'équipe Working with bugs détermine où se trouvent les bogues : suivis comme des tâches, ils apparaissent dans le backlog de sprint et sur le tableau des tâches, où ils s'estiment comme des tâches. Un couloir (swimlane) sépare une classe de travail, comme les éléments urgents, dans sa propre ligne horizontale. Les colonnes et les colonnes fractionnées sont des vues d'équipe mappées à des états existants ; un nouvel état de workflow exige un processus hérité, car le processus système Agile est verrouillé, et le nouvel état doit ensuite être mappé à une colonne.
      options:
        req: { en: "Bugs tracked as requirements appear on the product backlog and board next to the stories, not under them on the taskboard.", fr: "Les bogues suivis comme des exigences apparaissent sur le backlog de produit et le tableau à côté des stories, pas sous elles sur le tableau des tâches." }
        column: { en: "A column is a stage of the board mapped to existing states: it creates no new state and no horizontal lane.", fr: "Une colonne est une étape du tableau mappée à des états existants : elle ne crée ni nouvel état ni couloir horizontal." }
        system: { en: "System processes are locked and can't be modified.", fr: "Les processus système sont verrouillés et ne peuvent pas être modifiés." }
        split: { en: "Split columns show work waiting for the next stage; they don't create a lane or a workflow state.", fr: "Les colonnes fractionnées montrent le travail qui attend l'étape suivante ; elles ne créent ni couloir ni état de workflow." }
    references:
      - title: Show bugs on backlogs and boards
        url: https://learn.microsoft.com/en-us/azure/devops/organizations/settings/show-bugs-on-backlog
      - title: Manage columns on your board
        url: https://learn.microsoft.com/en-us/azure/devops/boards/boards/add-columns

  # ------------------------------------------------------------------ 7
  - id: az400-qz-11-07
    objective: "1.1.3"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        Woodgrove Bank runs an on-premises Azure DevOps Server 2022 collection that hosts a project named **Lending**. Its developers store code in 2,300 repositories of a GitHub Enterprise Cloud organization on GitHub.com, and in 40 repositories of a GitHub Enterprise Server instance that is reachable from the internet. Woodgrove also plans to create an Azure DevOps Services organization.

        Woodgrove wants `AB#` mentions in the repositories to link commits and pull requests to work items.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Woodgrove Bank exploite une collection Azure DevOps Server 2022 locale qui héberge un projet nommé **Lending**. Ses développeurs stockent le code dans 2 300 dépôts d'une organisation GitHub Enterprise Cloud sur GitHub.com, et dans 40 dépôts d'une instance GitHub Enterprise Server accessible depuis Internet. Woodgrove prévoit aussi de créer une organisation Azure DevOps Services.

        Woodgrove veut que les mentions `AB#` dans les dépôts lient les commits et les pull requests aux éléments de travail.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text:
            en: |
              The Lending project on Azure DevOps Server 2022 can be connected to the GitHub.com repositories.
            fr: |
              Le projet Lending d'Azure DevOps Server 2022 peut être connecté aux dépôts GitHub.com.
        - id: s2
          text:
            en: |
              A project of the new Azure DevOps Services organization can be connected to the 40 GitHub Enterprise Server repositories.
            fr: |
              Un projet de la nouvelle organisation Azure DevOps Services peut être connecté aux 40 dépôts GitHub Enterprise Server.
        - id: s3
          text:
            en: |
              A single connection of a project in the new Azure DevOps Services organization can include all 2,300 GitHub.com repositories.
            fr: |
              Une seule connexion d'un projet de la nouvelle organisation Azure DevOps Services peut inclure les 2 300 dépôts GitHub.com.
    answer:
      values: { s1: false, s2: true, s3: false }
    explanation:
      correct:
        en: |
          Azure DevOps Server 2020 and later integrate with GitHub Enterprise Server repositories only, so the on-premises Lending project can't connect to GitHub.com. Azure DevOps Services integrates with both GitHub.com and GitHub Enterprise Server, but one connection to an Azure Boards project holds up to 2,000 repositories: the 2,300 repositories need more than one connection.
        fr: |
          Azure DevOps Server 2020 et versions ultérieures ne s'intègrent qu'aux dépôts GitHub Enterprise Server : le projet local Lending ne peut donc pas se connecter à GitHub.com. Azure DevOps Services s'intègre à la fois à GitHub.com et à GitHub Enterprise Server, mais une connexion à un projet Azure Boards contient au plus 2 000 dépôts : les 2 300 dépôts exigent plus d'une connexion.
    references:
      - title: Connect Azure Boards to GitHub (cloud)
        url: https://learn.microsoft.com/en-us/azure/devops/boards/github/connect-to-github

  # ------------------------------------------------------------------ 8
  - id: az400-qz-11-08
    objective: "1.1.1"
    difficulty: 3
    status: draft
    type: ordering
    stem:
      en: |
        Fabrikam has two Azure DevOps projects named **Claims** and **Billing**. Both use an inherited process named **Fabrikam Agile**, which is based on Agile and contains several custom fields and rules. You are a member of the Project Collection Administrators group.

        You need to add a required field named **Risk Score** to the User Story work item type of Claims. The solution must meet the following requirements:

        - Billing must not be affected.
        - Claims must keep all the customizations of Fabrikam Agile.
        - The change must be validated in a test project before Claims users see it.

        Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
      fr: |
        Fabrikam dispose de deux projets Azure DevOps nommés **Claims** et **Billing**. Tous deux utilisent un processus hérité nommé **Fabrikam Agile**, basé sur Agile et qui contient plusieurs champs et règles personnalisés. Vous êtes membre du groupe Project Collection Administrators.

        Vous devez ajouter un champ obligatoire nommé **Risk Score** au type d'élément de travail User Story de Claims. La solution doit satisfaire les exigences suivantes :

        - Billing ne doit pas être affecté.
        - Claims doit conserver toutes les personnalisations de Fabrikam Agile.
        - La modification doit être validée dans un projet de test avant que les utilisateurs de Claims ne la voient.

        Quelles sont les quatre actions que vous devez effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste des actions vers la zone de réponse, puis placez-les dans l'ordre correct.
    body:
      count: 4
      actions:
        - { id: inherit, text: { en: "Create an inherited process from the Agile system process.", fr: "Créer un processus hérité à partir du processus système Agile." } }
        - { id: copy, text: { en: "Create a copy of the Fabrikam Agile process.", fr: "Créer une copie du processus Fabrikam Agile." } }
        - { id: direct, text: { en: "Add the Risk Score field to User Story in Fabrikam Agile, and make it required.", fr: "Ajouter le champ Risk Score à User Story dans Fabrikam Agile, et le rendre obligatoire." } }
        - { id: field, text: { en: "Add the Risk Score field to User Story in the new process, and make it required.", fr: "Ajouter le champ Risk Score à User Story dans le nouveau processus, et le rendre obligatoire." } }
        - { id: test, text: { en: "Create a test project that uses the new process, and validate the field.", fr: "Créer un projet de test qui utilise le nouveau processus, et valider le champ." } }
        - { id: column, text: { en: "Add a Risk Score column to the board of the Claims team.", fr: "Ajouter une colonne Risk Score au tableau de l'équipe Claims." } }
        - { id: change, text: { en: "Change the process of the Claims project to the new process.", fr: "Changer le processus du projet Claims pour le nouveau processus." } }
    answer:
      sequence: [copy, field, test, change]
    explanation:
      correct:
        en: |
          A change to an inherited process immediately affects every project that uses it, so you copy Fabrikam Agile: no project uses the copy yet, and the copy starts from the existing customizations. You add the field to the copy, validate it in a test project that uses the copy, then change the process of Claims to the copy, which is the documented way to roll out bundled process changes.
        fr: |
          Une modification d'un processus hérité affecte immédiatement tous les projets qui l'utilisent : vous copiez donc Fabrikam Agile. Aucun projet n'utilise encore la copie, et la copie part des personnalisations existantes. Vous ajoutez le champ à la copie, le validez dans un projet de test qui utilise la copie, puis changez le processus de Claims pour la copie, ce qui est la méthode documentée pour déployer un ensemble de modifications de processus.
      options:
        inherit: { en: "A new inherited process from Agile wouldn't contain the custom fields and rules of Fabrikam Agile.", fr: "Un nouveau processus hérité d'Agile ne contiendrait pas les champs et règles personnalisés de Fabrikam Agile." }
        direct: { en: "Changing Fabrikam Agile immediately changes Billing too.", fr: "Modifier Fabrikam Agile modifie immédiatement Billing aussi." }
        column: { en: "A board column is a workflow stage; it adds no field to the work item type.", fr: "Une colonne du tableau est une étape du workflow ; elle n'ajoute aucun champ au type d'élément de travail." }
    references:
      - title: "Tutorial: Create and manage inherited processes"
        url: https://learn.microsoft.com/en-us/azure/devops/organizations/settings/work/manage-process
      - title: Process customization and inheritance
        url: https://learn.microsoft.com/en-us/azure/devops/organizations/settings/work/inheritance-process-model

  # ------------------------------------------------------------------ 9
  - id: az400-qz-11-09
    objective: "1.1.2"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        Northwind Traders has an Azure DevOps project named **Logistics**. You are a Team Administrator of the **Routing** team and hold no other administrative role. Routing develops a service in an Azure Repos Git repository named **routing-api**.

        You need to create a notification subscription that meets the following requirements:

        - When a pull request in routing-api is created or updated, only the members of Routing who are reviewers of that pull request receive an email.
        - A reviewer doesn't receive an email about a change that the reviewer made, such as a vote.

        Which two settings should you configure? Each correct answer presents part of the solution.

        NOTE: Each correct selection is worth one point.
      fr: |
        Northwind Traders dispose d'un projet Azure DevOps nommé **Logistics**. Vous êtes Team Administrator de l'équipe **Routing** et n'avez aucun autre rôle d'administration. Routing développe un service dans un dépôt Git Azure Repos nommé **routing-api**.

        Vous devez créer un abonnement aux notifications qui satisfait les exigences suivantes :

        - Quand une pull request de routing-api est créée ou mise à jour, seuls les membres de Routing qui sont réviseurs de cette pull request reçoivent un e-mail.
        - Un réviseur ne reçoit pas d'e-mail pour une modification qu'il a lui-même effectuée, comme un vote.

        Quels sont les deux paramètres que vous devez configurer ? Chaque bonne réponse présente une partie de la solution.

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "In **Deliver to**, select **Members of Routing Team**, and filter on the routing-api repository.", fr: "Dans **Deliver to**, sélectionner **Members of Routing Team**, et filtrer sur le dépôt routing-api." } }
        - { id: b, text: { en: "In **Deliver to**, select **Members of Routing Team by role**, and select the **Reviewers** role.", fr: "Dans **Deliver to**, sélectionner **Members of Routing Team by role**, et sélectionner le rôle **Reviewers**." } }
        - { id: c, text: { en: "Clear the **Skip initiator** option of the subscription.", fr: "Désactiver l'option **Skip initiator** de l'abonnement." } }
        - { id: d, text: { en: "Keep the **Skip initiator** option of the subscription selected.", fr: "Laisser l'option **Skip initiator** de l'abonnement sélectionnée." } }
        - { id: e, text: { en: "Create a project subscription for Logistics instead of a team subscription.", fr: "Créer un abonnement de projet pour Logistics au lieu d'un abonnement d'équipe." } }
    answer: { optionIds: [b, d] }
    explanation:
      correct:
        en: |
          A Team Administrator can create team subscriptions. Delivering to the members of the team by role notifies only the team members who have the selected role for the event, here the reviewers of the pull request. Skip initiator is selected by default and keeps the user who made the change, such as a reviewer who votes, from being notified.
        fr: |
          Un Team Administrator peut créer des abonnements d'équipe. La remise aux membres de l'équipe par rôle n'avertit que les membres de l'équipe qui ont le rôle choisi pour l'événement, ici les réviseurs de la pull request. Skip initiator est sélectionné par défaut et évite d'avertir l'utilisateur qui a fait la modification, comme un réviseur qui vote.
      options:
        a: { en: "Members of Routing Team sends an individual email to every member of the team, reviewer or not.", fr: "Members of Routing Team envoie un e-mail individuel à chaque membre de l'équipe, réviseur ou non." }
        c: { en: "Clearing Skip initiator makes reviewers receive an email about their own votes and changes.", fr: "Désactiver Skip initiator fait recevoir aux réviseurs un e-mail sur leurs propres votes et modifications." }
        e: { en: "Project subscriptions require Project Administrators or Project Collection Administrators membership, which you don't have.", fr: "Les abonnements de projet exigent l'appartenance aux groupes Project Administrators ou Project Collection Administrators, que vous n'avez pas." }
    references:
      - title: Manage notifications for your team, project, or organization
        url: https://learn.microsoft.com/en-us/azure/devops/organizations/notifications/manage-team-group-global-organization-notifications
      - title: About notifications
        url: https://learn.microsoft.com/en-us/azure/devops/organizations/notifications/about-notifications

  # ------------------------------------------------------------------ 10
  - id: az400-qz-11-10
    objective: "1.1.4"
    difficulty: 3
    status: draft
    type: dropdown
    stem:
      en: |
        Tailspin Toys tracks its work in an Azure Boards project that uses the Agile process. The project is connected to a GitHub repository named **storefront**, whose default branch is `main`. Bugs 700, 701 and 702 are in the Active state.

        A developer opens a pull request that fixes bugs 700 and 701. The same change also confirms that bug 702, a duplicate, is already solved. When the pull request is merged, bugs 700 and 701 must move to the Resolved state and bug 702 must move directly to the Closed state, without manual updates.

        How should the developer complete the pull request? To answer, select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Tailspin Toys suit son travail dans un projet Azure Boards qui utilise le processus Agile. Le projet est connecté à un dépôt GitHub nommé **storefront**, dont la branche par défaut est `main`. Les bogues 700, 701 et 702 sont à l'état Active.

        Un développeur ouvre une pull request qui corrige les bogues 700 et 701. La même modification confirme aussi que le bogue 702, un doublon, est déjà résolu. Quand la pull request est fusionnée, les bogues 700 et 701 doivent passer à l'état Resolved et le bogue 702 doit passer directement à l'état Closed, sans mise à jour manuelle.

        Comment le développeur doit-il compléter la pull request ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: text
      template:
        en: |
          Target branch of the pull request: [[target]]
          Part of the pull request that contains the mentions: [[where]]
          Text for bugs 700 and 701: [[bugs]]
          Text for bug 702: [[dup]]
        fr: |
          Branche cible de la pull request : [[target]]
          Partie de la pull request qui contient les mentions : [[where]]
          Texte pour les bogues 700 et 701 : [[bugs]]
          Texte pour le bogue 702 : [[dup]]
      slots:
        - id: target
          options:
            - { id: release, text: "`release/2.4`" }
            - { id: main, text: "`main`" }
            - { id: develop, text: "`develop`" }
        - id: where
          options:
            - { id: title, text: { en: "Title", fr: "Titre" } }
            - { id: comment, text: { en: "A comment", fr: "Un commentaire" } }
            - { id: desc, text: { en: "Description", fr: "Description" } }
        - id: bugs
          options:
            - { id: one, text: "`Fixes AB#700, AB#701`" }
            - { id: gh, text: "`Fixes #700, Fixes #701`" }
            - { id: each, text: "`Fixes AB#700, Fixes AB#701`" }
            - { id: link, text: "`AB#700, AB#701`" }
        - id: dup
          options:
            - { id: fixes, text: "`Fixes AB#702`" }
            - { id: closed, text: "`Closed AB#702`" }
            - { id: link, text: "`AB#702`" }
            - { id: gh, text: "`Closes #702`" }
    answer:
      values: { target: main, where: desc, bugs: each, dup: closed }
    explanation:
      correct:
        en: |
          State transitions from `AB#` mentions apply only when the pull request is merged into the default branch, and mentions are parsed in the pull request description, not in its title or comments. A fix keyword moves an item to the first state of the Resolved category, which is Resolved for an Agile bug, but it applies only to the `AB#` reference that follows it, so the keyword must be repeated. A valid state name such as `Closed` moves the item to that state.
        fr: |
          Les changements d'état déclenchés par les mentions `AB#` ne s'appliquent que lorsque la pull request est fusionnée dans la branche par défaut, et les mentions sont analysées dans la description de la pull request, pas dans son titre ni ses commentaires. Un mot clé de correction fait passer un élément au premier état de la catégorie Resolved, c'est-à-dire Resolved pour un bogue Agile, mais il ne s'applique qu'à la référence `AB#` qui le suit : il faut donc répéter le mot clé. Un nom d'état valide comme `Closed` fait passer l'élément à cet état.
      options:
        release: { en: "Merging into a branch other than the default branch links the items but applies no state transition.", fr: "Une fusion dans une autre branche que la branche par défaut lie les éléments mais n'applique aucun changement d'état." }
        one: { en: "With one keyword before several references, all the items are linked but only bug 700 changes state.", fr: "Avec un seul mot clé devant plusieurs références, tous les éléments sont liés mais seul le bogue 700 change d'état." }
        gh: { en: "In a GitHub repository, `#700` or `#702` refers to a GitHub issue or pull request, not to an Azure Boards work item.", fr: "Dans un dépôt GitHub, `#700` ou `#702` désigne une issue ou une pull request GitHub, pas un élément de travail Azure Boards." }
        fixes: { en: "`Fixes` moves the Agile bug to Resolved, not to Closed.", fr: "`Fixes` fait passer le bogue Agile à Resolved, pas à Closed." }
    references:
      - title: Link GitHub commits, pull requests, branches, and issues to work items in Azure Boards
        url: https://learn.microsoft.com/en-us/azure/devops/boards/github/link-to-from-github
      - title: About workflow states in backlogs and boards
        url: https://learn.microsoft.com/en-us/azure/devops/boards/work-items/workflow-and-state-categories
