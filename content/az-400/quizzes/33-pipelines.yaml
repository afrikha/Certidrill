chapter: 33-pipelines
questions:
  # ------------------------------------------------------------------ 1
  - id: az400-qz-33-01
    objective: "3.3.2"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Northwind is reviewing how its YAML pipelines use the parallel jobs of its Azure DevOps organization.

        Which of the following doesn't consume a parallel job?
      fr: |
        Northwind examine la façon dont ses pipelines YAML utilisent les travaux parallèles de son organisation Azure DevOps.

        Lequel des éléments suivants ne consomme pas de travail parallèle ?
    body:
      options:
        - { id: a, text: { en: "A deployment job that runs on a Microsoft-hosted agent", fr: "Un travail de déploiement qui s'exécute sur un agent hébergé par Microsoft" } }
        - { id: b, text: { en: "A build job that runs on a self-hosted agent", fr: "Un travail de build qui s'exécute sur un agent auto-hébergé" } }
        - { id: c, text: { en: "A run that waits for an approval on an environment", fr: "Une exécution qui attend une approbation sur un environnement" } }
        - { id: d, text: { en: "A container job that runs on a Microsoft-hosted agent", fr: "Un travail de conteneur qui s'exécute sur un agent hébergé par Microsoft" } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          A run consumes a parallel job only while it's actively running on an agent. A run that waits for an approval or a manual intervention doesn't consume one, and neither do server (agentless) jobs.
        fr: |
          Une exécution ne consomme un travail parallèle que pendant qu'elle s'exécute réellement sur un agent. Une exécution qui attend une approbation ou une intervention manuelle n'en consomme pas, pas plus que les travaux serveur (sans agent).
      options:
        a: { en: "A deployment job runs on an agent like any other job, so it consumes a Microsoft-hosted parallel job while it runs.", fr: "Un travail de déploiement s'exécute sur un agent comme tout autre travail : il consomme un travail parallèle hébergé par Microsoft pendant son exécution." }
        b: { en: "Jobs on self-hosted agents consume self-hosted parallel jobs; only their minutes are unlimited.", fr: "Les travaux sur des agents auto-hébergés consomment des travaux parallèles auto-hébergés ; seules leurs minutes sont illimitées." }
        d: { en: "A container job still runs on the agent's machine, so it consumes a parallel job like any agent job.", fr: "Un travail de conteneur s'exécute toujours sur la machine de l'agent : il consomme un travail parallèle comme tout travail d'agent." }
    references:
      - title: Configure and pay for parallel jobs
        url: https://learn.microsoft.com/en-us/azure/devops/pipelines/licensing/concurrent-jobs

  # ------------------------------------------------------------------ 2
  - id: az400-qz-33-02
    objective: "3.3.8"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        An Azure Pipelines YAML pipeline at Contoso contains the following variables section.

        ```yaml
        variables:
        - group: common-settings   # defines ApiUrl = https://api-test.contoso.com
        - group: prod-settings     # defines ApiUrl = https://api.contoso.com
        ```

        Which value does `$(ApiUrl)` have in the jobs of the pipeline?
      fr: |
        Un pipeline YAML Azure Pipelines de Contoso contient la section variables suivante.

        ```yaml
        variables:
        - group: common-settings   # defines ApiUrl = https://api-test.contoso.com
        - group: prod-settings     # defines ApiUrl = https://api.contoso.com
        ```

        Quelle valeur `$(ApiUrl)` a-t-elle dans les travaux du pipeline ?
    body:
      options:
        - { id: a, text: "https://api-test.contoso.com" }
        - { id: b, text: "https://api.contoso.com" }
        - { id: c, text: { en: "An empty value, because the two definitions conflict", fr: "Une valeur vide, car les deux définitions sont en conflit" } }
        - { id: d, text: { en: "No value: the run fails because the variable is defined twice", fr: "Aucune valeur : l'exécution échoue car la variable est définie deux fois" } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          When several variable groups referenced by a pipeline define the same variable, the last group that defines it in the file sets its value. prod-settings comes after common-settings, so ApiUrl is https://api.contoso.com.
        fr: |
          Quand plusieurs groupes de variables référencés par un pipeline définissent la même variable, c'est le dernier groupe qui la définit dans le fichier qui fixe sa valeur. prod-settings vient après common-settings : ApiUrl vaut donc https://api.contoso.com.
      options:
        a: { en: "common-settings is referenced first; its value is replaced by the value of the group referenced after it.", fr: "common-settings est référencé en premier ; sa valeur est remplacée par celle du groupe référencé après lui." }
        c: { en: "The definitions don't cancel each other: the group referenced last sets the value.", fr: "Les définitions ne s'annulent pas : le groupe référencé en dernier fixe la valeur." }
        d: { en: "Defining the same variable in two groups is allowed; it doesn't make the run fail.", fr: "Définir la même variable dans deux groupes est autorisé ; cela ne fait pas échouer l'exécution." }
    references:
      - title: Manage variable groups
        url: https://learn.microsoft.com/en-us/azure/devops/pipelines/library/variable-groups

  # ------------------------------------------------------------------ 3
  - id: az400-qz-33-03
    objective: "3.3.4"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Fabrikam's YAML pipeline builds an Azure Repos Git repository and contains the following triggers.

        ```yaml
        trigger:
          branches:
            include: [ main ]
        pr:
          branches:
            include: [ main ]
        ```

        Pushes to main start a run, but opening or updating a pull request that targets main never starts one. You need the pipeline to validate every pull request that targets main.

        What should you do?
      fr: |
        Le pipeline YAML de Fabrikam génère un dépôt Git Azure Repos et contient les déclencheurs suivants.

        ```yaml
        trigger:
          branches:
            include: [ main ]
        pr:
          branches:
            include: [ main ]
        ```

        Les poussées vers main démarrent une exécution, mais l'ouverture ou la mise à jour d'une pull request qui cible main n'en démarre jamais. Vous devez faire en sorte que le pipeline valide chaque pull request qui cible main.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Replace the pr section with the short syntax `pr: [ main ]`.", fr: "Remplacer la section pr par la syntaxe courte `pr: [ main ]`." } }
        - { id: b, text: { en: "Add a build validation branch policy on main that runs the pipeline.", fr: "Ajouter sur main une stratégie de branche de validation de build qui exécute le pipeline." } }
        - { id: c, text: { en: "Add the pipeline as a required status check in a branch protection rule on main.", fr: "Ajouter le pipeline comme vérification d'état obligatoire dans une règle de protection de branche sur main." } }
        - { id: d, text: { en: "Add `batch: true` to the trigger section so that pull request pushes are grouped.", fr: "Ajouter `batch: true` à la section trigger pour regrouper les poussées des pull requests." } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          For an Azure Repos Git repository, a pull request trigger can't be configured in the YAML file: the `pr` section is used only for GitHub and Bitbucket Cloud. Pull request validation in Azure Repos comes from a build validation policy on the target branch, which runs the pipeline for every pull request that targets main.
        fr: |
          Pour un dépôt Git Azure Repos, un déclencheur de pull request ne peut pas être configuré dans le fichier YAML : la section `pr` ne sert que pour GitHub et Bitbucket Cloud. La validation des pull requests dans Azure Repos vient d'une stratégie de validation de build sur la branche cible, qui exécute le pipeline pour chaque pull request ciblant main.
      options:
        a: { en: "The short syntax is still a YAML pr trigger, which Azure Repos doesn't use.", fr: "La syntaxe courte reste un déclencheur pr YAML, qu'Azure Repos n'utilise pas." }
        c: { en: "Branch protection rules and required status checks are GitHub settings; the repository is in Azure Repos.", fr: "Les règles de protection de branche et les vérifications d'état obligatoires sont des paramètres GitHub ; le dépôt est dans Azure Repos." }
        d: { en: "`batch` groups the CI runs of pushes made while a run is in progress; it doesn't start runs for pull requests.", fr: "`batch` regroupe les exécutions CI des poussées faites pendant une exécution en cours ; il ne démarre pas d'exécutions pour les pull requests." }
    references:
      - title: Build Azure Repos Git or TFS Git repositories
        url: https://learn.microsoft.com/en-us/azure/devops/pipelines/repos/azure-repos-git

  # ------------------------------------------------------------------ 4
  - id: az400-qz-33-04
    objective: "3.3.5"
    difficulty: 2
    status: draft
    type: dropdown
    stem:
      en: |
        Litware has a multi-stage YAML pipeline. In stage Build, job Package writes the API package to the artifact staging directory. In stage Test, the regular job ApiTests runs on another agent and must test that package.

        How should you complete the YAML? Select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Litware dispose d'un pipeline YAML à phases multiples. Dans la phase Build, le travail Package écrit le package de l'API dans le répertoire intermédiaire des artefacts. Dans la phase Test, le travail standard ApiTests s'exécute sur un autre agent et doit tester ce package.

        Comment devez-vous compléter le YAML ? Sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: code
      language: yaml
      template: |
        stages:
        - stage: Build
          jobs:
          - job: Package
            steps:
            - script: ./build.sh --out $(Build.ArtifactStagingDirectory)
            - [[s1]]: $(Build.ArtifactStagingDirectory)
              artifact: api
        - stage: Test
          jobs:
          - job: ApiTests
            steps:
            - [[s2]]: current
              artifact: api
            - script: ./run-api-tests.sh [[s3]]/api
      slots:
        - id: s1
          options:
            - { id: download, text: download }
            - { id: publish, text: publish }
            - { id: checkout, text: checkout }
        - id: s2
          options:
            - { id: publish, text: publish }
            - { id: checkout, text: checkout }
            - { id: download, text: download }
        - id: s3
          options:
            - { id: sources, text: $(Build.SourcesDirectory) }
            - { id: workspace, text: $(Pipeline.Workspace) }
            - { id: staging, text: $(Build.ArtifactStagingDirectory) }
            - { id: working, text: $(System.DefaultWorkingDirectory) }
    answer:
      values: { s1: publish, s2: download, s3: workspace }
    explanation:
      correct:
        en: |
          The `publish` step is the shortcut of the Publish Pipeline Artifact task and stores the folder as the pipeline artifact api. Only deployment jobs download artifacts automatically, so the regular job ApiTests needs a `download: current` step. `download` always places the artifact in `$(Pipeline.Workspace)/<artifact name>`, here `$(Pipeline.Workspace)/api`.
        fr: |
          L'étape `publish` est le raccourci de la tâche Publish Pipeline Artifact et enregistre le dossier comme artefact de pipeline api. Seuls les travaux de déploiement téléchargent automatiquement les artefacts : le travail standard ApiTests a donc besoin d'une étape `download: current`. `download` place toujours l'artefact dans `$(Pipeline.Workspace)/<artifact name>`, ici `$(Pipeline.Workspace)/api`.
      options:
        s2: { en: "`checkout` clones a repository, not the artifacts of the run; `publish` would upload instead of download.", fr: "`checkout` clone un dépôt, pas les artefacts de l'exécution ; `publish` chargerait au lieu de télécharger." }
        s3: { en: "The staging, sources and default working directories belong to the agent that runs the job; the download step doesn't write the artifact there.", fr: "Les répertoires intermédiaire, des sources et de travail par défaut appartiennent à l'agent qui exécute le travail ; l'étape download n'y écrit pas l'artefact." }
    references:
      - title: Publish and download pipeline artifacts
        url: https://learn.microsoft.com/en-us/azure/devops/pipelines/artifacts/pipeline-artifacts

  # ------------------------------------------------------------------ 5
  - id: az400-qz-33-05
    objective: "3.3.1"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Adatum keeps its code in Azure Repos and its work items in Azure Boards. Its applications are deployed by 20 classic release pipelines that use pre-deployment approvals.

        You need the deployment definitions to be stored with the code and reviewed in pull requests. The approvals must be kept, and the solution must minimize the migration effort.

        What should you do?
      fr: |
        Adatum conserve son code dans Azure Repos et ses éléments de travail dans Azure Boards. Ses applications sont déployées par 20 pipelines de mise en production classiques qui utilisent des approbations de prédéploiement.

        Vous devez faire en sorte que les définitions de déploiement soient stockées avec le code et révisées dans des pull requests. Les approbations doivent être conservées, et la solution doit réduire au minimum l'effort de migration.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Move the repositories to GitHub, and rewrite the deployments as GitHub Actions workflows with environments.", fr: "Déplacer les dépôts vers GitHub, et réécrire les déploiements en workflows GitHub Actions avec des environnements." } }
        - { id: b, text: { en: "Keep the classic release pipelines, and move their shared tasks into task groups stored in the project.", fr: "Conserver les pipelines de mise en production classiques, et déplacer leurs tâches communes dans des groupes de tâches du projet." } }
        - { id: c, text: { en: "Export each classic release pipeline as a JSON file, and commit the files to the repository of the application.", fr: "Exporter chaque pipeline de mise en production classique en fichier JSON, et valider les fichiers dans le dépôt de l'application." } }
        - { id: d, text: { en: "Rewrite the deployments as multi-stage YAML pipelines, and move the approvals to checks on environments.", fr: "Réécrire les déploiements en pipelines YAML à phases multiples, et déplacer les approbations vers des vérifications sur des environnements." } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          Modernizing classic release pipelines in Azure DevOps means moving them to multi-stage YAML pipelines in Azure Pipelines: the YAML file lives in the repository, so every change goes through pull requests. Classic release pipelines can't be exported to YAML, so the stages are rewritten, and the approvals become Approvals checks on the environments that the deployment jobs target.
        fr: |
          Moderniser des pipelines de mise en production classiques dans Azure DevOps consiste à les passer en pipelines YAML à phases multiples dans Azure Pipelines : le fichier YAML vit dans le dépôt, donc chaque modification passe par des pull requests. Les pipelines de mise en production classiques ne peuvent pas être exportés en YAML : les phases sont réécrites, et les approbations deviennent des vérifications Approbations sur les environnements ciblés par les travaux de déploiement.
      options:
        a: { en: "Moving the code and the work tracking context to another platform adds effort; Azure Pipelines YAML keeps everything in Azure DevOps.", fr: "Déplacer le code et le contexte de suivi du travail vers une autre plateforme ajoute de l'effort ; Azure Pipelines YAML garde tout dans Azure DevOps." }
        b: { en: "Task groups are a classic pipeline feature; the deployment definitions would still not be stored with the code or reviewed in pull requests.", fr: "Les groupes de tâches sont une fonctionnalité des pipelines classiques ; les définitions de déploiement ne seraient toujours ni stockées avec le code ni révisées dans des pull requests." }
        c: { en: "A JSON export is only a copy: the pipelines still run from their classic definitions, so reviewing the file in a pull request changes nothing.", fr: "Un export JSON n'est qu'une copie : les pipelines s'exécutent toujours à partir de leurs définitions classiques, donc réviser le fichier dans une pull request ne change rien." }
    references:
      - title: Migrate your Classic pipeline to YAML
        url: https://learn.microsoft.com/en-us/azure/devops/pipelines/release/from-classic-pipelines
      - title: Define approvals and checks
        url: https://learn.microsoft.com/en-us/azure/devops/pipelines/process/approvals

  # ------------------------------------------------------------------ 6
  - id: az400-qz-33-06
    objective: "3.3.3"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Contoso's GitHub organization contains 60 repositories, many of them private. An organization owner installed the Azure Pipelines GitHub App for 12 selected repositories, and their pipelines post GitHub Checks for each run and each job.

        Developers created a new private repository named **billing-api**. When a project administrator creates a pipeline in Azure Pipelines and selects GitHub as the source, billing-api doesn't appear in the list of repositories.

        You need to create the pipeline for billing-api. Its results must appear as GitHub Checks for each job, and the token of the app must not get access to the repositories that aren't built by Azure Pipelines.

        What should you do?
      fr: |
        L'organisation GitHub de Contoso contient 60 dépôts, dont beaucoup sont privés. Un propriétaire de l'organisation a installé l'application GitHub Azure Pipelines pour 12 dépôts sélectionnés, et leurs pipelines publient des GitHub Checks pour chaque exécution et chaque travail.

        Les développeurs ont créé un nouveau dépôt privé nommé **billing-api**. Quand un administrateur de projet crée un pipeline dans Azure Pipelines et sélectionne GitHub comme source, billing-api n'apparaît pas dans la liste des dépôts.

        Vous devez créer le pipeline pour billing-api. Ses résultats doivent apparaître comme GitHub Checks pour chaque travail, et le jeton de l'application ne doit pas obtenir l'accès aux dépôts qui ne sont pas générés par Azure Pipelines.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Have an organization owner change the app installation to give it access to all repositories.", fr: "Faire modifier l'installation de l'application par un propriétaire de l'organisation pour lui donner accès à tous les dépôts." } }
        - { id: b, text: { en: "Have an organization owner add billing-api to the repositories selected for the app installation.", fr: "Faire ajouter billing-api aux dépôts sélectionnés de l'installation de l'application par un propriétaire de l'organisation." } }
        - { id: c, text: { en: "Have the project administrator connect the pipeline to billing-api through an OAuth authorization.", fr: "Faire connecter le pipeline à billing-api par l'administrateur de projet au moyen d'une autorisation OAuth." } }
        - { id: d, text: { en: "Have the project administrator connect the pipeline to billing-api with a PAT that has the repo scope.", fr: "Faire connecter le pipeline à billing-api par l'administrateur de projet avec un PAT qui a l'étendue repo." } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          A repository that the app can't access doesn't appear in the list when you create a pipeline. Adding billing-api to the selected repositories of the existing installation, which requires an organization owner (or an admin of the repository), makes it available while the token keeps access to the selected repositories only. The pipeline then uses the app, so GitHub Checks are posted for the run and for each job.
        fr: |
          Un dépôt auquel l'application n'a pas accès n'apparaît pas dans la liste lors de la création d'un pipeline. Ajouter billing-api aux dépôts sélectionnés de l'installation existante, ce qui exige un propriétaire de l'organisation (ou un administrateur du dépôt), le rend disponible tout en limitant le jeton aux dépôts sélectionnés. Le pipeline utilise alors l'application : des GitHub Checks sont publiés pour l'exécution et pour chaque travail.
      options:
        a: { en: "With access to all repositories, the token of the app can read every repository of the organization, including private ones that Azure Pipelines doesn't build.", fr: "Avec l'accès à tous les dépôts, le jeton de l'application peut lire tous les dépôts de l'organisation, y compris des dépôts privés qu'Azure Pipelines ne génère pas." }
        c: { en: "OAuth runs as the personal GitHub identity of the administrator and only sends a status for the whole run, not GitHub Checks for each job.", fr: "OAuth s'exécute sous l'identité GitHub personnelle de l'administrateur et n'envoie qu'un état pour toute l'exécution, pas de GitHub Checks pour chaque travail." }
        d: { en: "A PAT also uses a personal identity and reports a single status for the run; GitHub Checks require the GitHub App.", fr: "Un PAT utilise aussi une identité personnelle et ne publie qu'un seul état pour l'exécution ; les GitHub Checks exigent l'application GitHub." }
    references:
      - title: Build GitHub repositories
        url: https://learn.microsoft.com/en-us/azure/devops/pipelines/repos/github

  # ------------------------------------------------------------------ 7
  - id: az400-qz-33-07
    objective: "3.3.9"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        Woodgrove's Azure DevOps project has the following protected resources:

        - A variable group named **pay-secrets** with an Approvals check whose approver is the group **Security**. The check was created first.
        - An environment named **pay-prod** with a Branch control check that allows only `refs/heads/main`. The check was created later.

        Several YAML pipelines of the project use these resources.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Le projet Azure DevOps de Woodgrove contient les ressources protégées suivantes :

        - Un groupe de variables nommé **pay-secrets** avec une vérification Approbations dont l'approbateur est le groupe **Security**. Cette vérification a été créée en premier.
        - Un environnement nommé **pay-prod** avec une vérification Branch control qui n'autorise que `refs/heads/main`. Cette vérification a été créée ensuite.

        Plusieurs pipelines YAML du projet utilisent ces ressources.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text: { en: "A stage that uses pay-secrets only in its last job, and that doesn't target pay-prod, waits for an approval from Security before its first job starts.", fr: "Une phase qui utilise pay-secrets uniquement dans son dernier travail, et qui ne cible pas pay-prod, attend une approbation de Security avant le démarrage de son premier travail." }
        - id: s2
          text: { en: "If a pipeline author replaces the deployment job that targets pay-prod with a regular job that doesn't reference the environment, the Branch control check of pay-prod no longer applies to that stage.", fr: "Si l'auteur d'un pipeline remplace le travail de déploiement qui cible pay-prod par un travail standard qui ne référence pas l'environnement, la vérification Branch control de pay-prod ne s'applique plus à cette phase." }
        - id: s3
          text: { en: "When a run from a feature branch reaches a stage that uses both pay-secrets and pay-prod, Security is asked to approve before the Branch control check makes the stage fail.", fr: "Quand une exécution issue d'une branche de fonctionnalité atteint une phase qui utilise à la fois pay-secrets et pay-prod, Security est sollicité pour approuver avant que la vérification Branch control fasse échouer la phase." }
    answer:
      values: { s1: true, s2: true, s3: false }
    explanation:
      correct:
        en: |
          Checks belong to resources, and before a stage starts, all the checks of all the resources used in that stage must be satisfied, whichever job uses them. Environment checks apply to the stages that use the environment, so a stage that stops referencing pay-prod escapes them: that's why sensitive controls are also put on the service connections that the deployment needs. Static checks such as Branch control always run before approvals, whatever the creation order, so a feature branch run fails before Security is asked.
        fr: |
          Les vérifications appartiennent aux ressources, et avant le démarrage d'une phase, toutes les vérifications de toutes les ressources utilisées dans cette phase doivent être satisfaites, quel que soit le travail qui les utilise. Les vérifications d'un environnement s'appliquent aux phases qui utilisent l'environnement : une phase qui ne référence plus pay-prod y échappe, c'est pourquoi les contrôles sensibles se placent aussi sur les connexions de service dont le déploiement a besoin. Les vérifications statiques comme Branch control s'exécutent toujours avant les approbations, quel que soit l'ordre de création : une exécution d'une branche de fonctionnalité échoue avant que Security soit sollicité.
      options:
        s3: { en: "Static checks (Branch control, Required template, Evaluate artifact) are evaluated before pre-check approvals; checks are ordered by creation only within a category.", fr: "Les vérifications statiques (Branch control, Required template, Evaluate artifact) sont évaluées avant les approbations préalables ; l'ordre de création ne compte qu'à l'intérieur d'une catégorie." }
    references:
      - title: Define approvals and checks
        url: https://learn.microsoft.com/en-us/azure/devops/pipelines/process/approvals

  # ------------------------------------------------------------------ 8
  - id: az400-qz-33-08
    objective: "3.3.6"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Tailspin has the following multi-stage YAML pipeline.

        ```yaml
        stages:
        - stage: Build
          jobs:
          - job: Compile
            steps:
            - script: ./build.sh
        - stage: DeployTest
          dependsOn: Build
          jobs:
          - job: Deploy
            steps:
            - script: ./deploy.sh test
        - stage: DeployProd
          dependsOn: DeployTest
          condition: eq(variables['Build.SourceBranch'], 'refs/heads/main')
          jobs:
          - job: Deploy
            steps:
            - script: ./deploy.sh prod
        ```

        Yesterday, a run from main failed in stage DeployTest, but stage DeployProd still ran and deployed the build to production.

        You need DeployProd to run only for runs from main whose DeployTest stage succeeded. What should you do?
      fr: |
        Tailspin dispose du pipeline YAML à phases multiples suivant.

        ```yaml
        stages:
        - stage: Build
          jobs:
          - job: Compile
            steps:
            - script: ./build.sh
        - stage: DeployTest
          dependsOn: Build
          jobs:
          - job: Deploy
            steps:
            - script: ./deploy.sh test
        - stage: DeployProd
          dependsOn: DeployTest
          condition: eq(variables['Build.SourceBranch'], 'refs/heads/main')
          jobs:
          - job: Deploy
            steps:
            - script: ./deploy.sh prod
        ```

        Hier, une exécution issue de main a échoué dans la phase DeployTest, mais la phase DeployProd s'est quand même exécutée et a déployé le build en production.

        Vous devez faire en sorte que DeployProd ne s'exécute que pour les exécutions issues de main dont la phase DeployTest a réussi. Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Change the dependsOn of DeployProd to `[Build, DeployTest]`.", fr: "Remplacer le dependsOn de DeployProd par `[Build, DeployTest]`." } }
        - { id: b, text: { en: "Change the condition of DeployProd to `succeeded()`.", fr: "Remplacer la condition de DeployProd par `succeeded()`." } }
        - { id: c, text: { en: "Change the condition of DeployProd to `and(succeededOrFailed(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))`.", fr: "Remplacer la condition de DeployProd par `and(succeededOrFailed(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))`." } }
        - { id: d, text: { en: "Change the condition of DeployProd to `and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))`.", fr: "Remplacer la condition de DeployProd par `and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))`." } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          A stage runs by default only when all its dependencies succeeded, but a `condition` overwrites that default. The current condition only tests the branch, so DeployProd ran after DeployTest failed. Combining `succeeded()` with the branch test restores the dependency check and keeps the main-only rule.
        fr: |
          Par défaut, une phase ne s'exécute que si toutes ses dépendances ont réussi, mais une `condition` remplace ce comportement par défaut. La condition actuelle ne teste que la branche : DeployProd s'est donc exécuté après l'échec de DeployTest. Combiner `succeeded()` avec le test de branche rétablit la vérification des dépendances et conserve la règle limitée à main.
      options:
        a: { en: "Adding Build to the dependencies changes nothing: the custom condition still ignores the result of the dependencies.", fr: "Ajouter Build aux dépendances ne change rien : la condition personnalisée ignore toujours le résultat des dépendances." }
        b: { en: "`succeeded()` alone restores the dependency check but removes the branch test, so runs from other branches would deploy to production.", fr: "`succeeded()` seul rétablit la vérification des dépendances mais supprime le test de branche : les exécutions d'autres branches déploieraient en production." }
        c: { en: "`succeededOrFailed()` is true even when a dependency failed (unless the run is canceled), so DeployProd would still deploy after DeployTest fails.", fr: "`succeededOrFailed()` est vrai même quand une dépendance a échoué (sauf si l'exécution est annulée) : DeployProd déploierait encore après l'échec de DeployTest." }
    references:
      - title: Pipeline conditions
        url: https://learn.microsoft.com/en-us/azure/devops/pipelines/process/conditions

  # ------------------------------------------------------------------ 9
  - id: az400-qz-33-09
    objective: "3.3.7"
    difficulty: 3
    status: draft
    type: dropdown
    stem:
      en: |
        Contoso builds a .NET Framework 4.8 web app with the VSBuild@1 task and deploys it to IIS servers in its datacenter. The following constraints apply:

        - Contoso doesn't want to maintain any build machine.
        - The datacenter accepts no inbound connection. Self-hosted agents are installed on the servers of the datacenter and registered in the agent pool **DC-Web**.
        - DC-Web also contains agents on file servers. Only the agents on IIS servers have the user-defined capability **IIS**.
        - The deployment must start only after the build succeeds, and it uses the package that the build produced.

        How should you complete the YAML? Select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Contoso génère une application web .NET Framework 4.8 avec la tâche VSBuild@1 et la déploie sur des serveurs IIS de son centre de données. Les contraintes suivantes s'appliquent :

        - Contoso ne veut maintenir aucune machine de build.
        - Le centre de données n'accepte aucune connexion entrante. Des agents auto-hébergés sont installés sur les serveurs du centre de données et inscrits dans le pool d'agents **DC-Web**.
        - DC-Web contient aussi des agents sur des serveurs de fichiers. Seuls les agents des serveurs IIS ont la capacité définie par l'utilisateur **IIS**.
        - Le déploiement ne doit démarrer qu'après la réussite du build, et il utilise le package produit par le build.

        Comment devez-vous compléter le YAML ? Sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: code
      language: yaml
      template: |
        jobs:
        - job: Build
          pool:
            [[bpool]]
          steps:
          - task: VSBuild@1
            inputs:
              solution: 'Web.sln'
              msbuildArgs: '/p:OutDir=$(Build.ArtifactStagingDirectory)'
          - publish: $(Build.ArtifactStagingDirectory)
            artifact: web
        - job: Deploy
          dependsOn: [[dep]]
          pool:
            name: DC-Web
            [[dkey]]: IIS
          steps:
          - download: current
            artifact: web
          - script: deploy-iis.cmd "$(Pipeline.Workspace)\web"
      slots:
        - id: bpool
          options:
            - { id: ubuntu, text: "vmImage: ubuntu-latest" }
            - { id: windows, text: "vmImage: windows-latest" }
            - { id: dcweb, text: "name: DC-Web" }
        - id: dep
          options:
            - { id: empty, text: "[]" }
            - { id: build, text: Build }
            - { id: pool, text: DC-Web }
        - id: dkey
          options:
            - { id: labels, text: labels }
            - { id: vmimage, text: vmImage }
            - { id: demands, text: demands }
    answer:
      values: { bpool: windows, dep: build, dkey: demands }
    explanation:
      correct:
        en: |
          This is a hybrid pipeline: the build runs on a Microsoft-hosted Windows image, which includes the Visual Studio build tools that VSBuild needs for .NET Framework, and the deployment runs on self-hosted agents that only open outbound connections. Jobs of a stage run in parallel by default, so `dependsOn: Build` makes Deploy wait for a successful build. In a self-hosted pool, `demands` selects the agents that have a capability, here IIS.
        fr: |
          C'est un pipeline hybride : le build s'exécute sur une image Windows hébergée par Microsoft, qui contient les outils de build Visual Studio dont VSBuild a besoin pour .NET Framework, et le déploiement s'exécute sur des agents auto-hébergés qui n'ouvrent que des connexions sortantes. Les travaux d'une phase s'exécutent en parallèle par défaut : `dependsOn: Build` fait attendre à Deploy la réussite du build. Dans un pool auto-hébergé, `demands` sélectionne les agents qui ont une capacité, ici IIS.
      options:
        bpool: { en: "Ubuntu can't build a .NET Framework solution with VSBuild, and DC-Web would use datacenter servers as build machines that Contoso maintains.", fr: "Ubuntu ne peut pas générer une solution .NET Framework avec VSBuild, et DC-Web utiliserait comme machines de build des serveurs du centre de données que Contoso maintient." }
        dep: { en: "`dependsOn: []` makes Deploy start at the same time as Build, before the artifact exists; DC-Web is a pool, not a job.", fr: "`dependsOn: []` fait démarrer Deploy en même temps que Build, avant que l'artefact existe ; DC-Web est un pool, pas un travail." }
        dkey: { en: "`vmImage` is valid only for Microsoft-hosted agents, and `labels` is how GitHub Actions selects runners, not an Azure Pipelines pool key.", fr: "`vmImage` n'est valide que pour les agents hébergés par Microsoft, et `labels` est la façon dont GitHub Actions sélectionne les exécuteurs, pas une clé de pool Azure Pipelines." }
    references:
      - title: pool definition
        url: https://learn.microsoft.com/en-us/azure/devops/pipelines/yaml-schema/pool
      - title: Specify jobs in your pipeline
        url: https://learn.microsoft.com/en-us/azure/devops/pipelines/process/phases

  # ------------------------------------------------------------------ 10
  - id: az400-qz-33-10
    objective: "3.3.2"
    difficulty: 3
    status: draft
    type: dropdown
    shuffle: false
    stem:
      en: |
        Tailspin created an Azure DevOps organization, linked it to an Azure subscription, and uses only the free grant of parallel jobs. All its projects are private.

        Three teams must be able to run jobs on Microsoft-hosted agents at the same time, and some of their jobs run for about 90 minutes. You need to buy the required capacity. The solution must minimize cost.

        How should you complete the plan? Select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Tailspin a créé une organisation Azure DevOps, l'a liée à un abonnement Azure et n'utilise que l'octroi gratuit de travaux parallèles. Tous ses projets sont privés.

        Trois équipes doivent pouvoir exécuter des travaux sur des agents hébergés par Microsoft en même temps, et certains de leurs travaux durent environ 90 minutes. Vous devez acheter la capacité nécessaire. La solution doit réduire les coûts au minimum.

        Comment devez-vous compléter le plan ? Sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: text
      template:
        en: |
          A member of the [[who]] group purchases [[count]] Microsoft-hosted parallel jobs. After the purchase, each job on a Microsoft-hosted agent can run for up to [[limit]].
        fr: |
          Un membre du groupe [[who]] achète [[count]] travaux parallèles hébergés par Microsoft. Après l'achat, chaque travail sur un agent hébergé par Microsoft peut s'exécuter jusqu'à [[limit]].
      slots:
        - id: who
          options:
            - { id: pca, text: Project Collection Administrators }
            - { id: pa, text: Project Administrators }
            - { id: ba, text: Build Administrators }
        - id: count
          options:
            - { id: one, text: "1" }
            - { id: two, text: "2" }
            - { id: three, text: "3" }
            - { id: four, text: "4" }
        - id: limit
          options:
            - { id: m60, text: { en: "60 minutes", fr: "60 minutes" } }
            - { id: m360, text: { en: "360 minutes", fr: "360 minutes" } }
            - { id: d2, text: { en: "2 days", fr: "2 jours" } }
    answer:
      values: { who: pca, count: three, limit: m360 }
    explanation:
      correct:
        en: |
          Parallel jobs are bought for the whole organization by a member of Project Collection Administrators, with billing set up through an Azure subscription. The free Microsoft-hosted job isn't added to purchased ones: the first purchase only removes the time limits of that job, so three concurrent jobs need three purchased parallel jobs. A paid Microsoft-hosted parallel job runs jobs of up to 360 minutes with no monthly limit, which covers the 90-minute jobs.
        fr: |
          Les travaux parallèles s'achètent pour toute l'organisation par un membre de Project Collection Administrators, avec une facturation configurée via un abonnement Azure. Le travail gratuit hébergé par Microsoft ne s'ajoute pas aux travaux achetés : le premier achat ne fait que lever les limites de durée de ce travail, donc trois travaux simultanés exigent trois travaux parallèles achetés. Un travail parallèle hébergé par Microsoft payant exécute des travaux de 360 minutes au plus sans limite mensuelle, ce qui couvre les travaux de 90 minutes.
      options:
        who: { en: "Project Administrators and Build Administrators manage a project; buying parallel jobs is an organization-level task.", fr: "Project Administrators et Build Administrators gèrent un projet ; l'achat de travaux parallèles se fait au niveau de l'organisation." }
        count: { en: "Buying two would give only two concurrent jobs: the free job isn't added to the purchased ones. Four exceeds the need and costs more.", fr: "En acheter deux ne donnerait que deux travaux simultanés : le travail gratuit ne s'ajoute pas aux travaux achetés. Quatre dépasse le besoin et coûte plus cher." }
        limit: { en: "60 minutes is the limit of the free grant; 2 days is the maximum job duration of Managed DevOps Pools, not of Microsoft-hosted agents.", fr: "60 minutes est la limite de l'octroi gratuit ; 2 jours est la durée maximale d'un travail dans Managed DevOps Pools, pas sur des agents hébergés par Microsoft." }
    references:
      - title: Configure and pay for parallel jobs
        url: https://learn.microsoft.com/en-us/azure/devops/pipelines/licensing/concurrent-jobs
