chapter: 52-metrics-analysis
questions:
  # ------------------------------------------------------------------ 1
  - id: az400-qz-52-01
    objective: "5.2.4"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Contoso's web API sends its telemetry to a workspace-based Application Insights resource. You open **Logs** in the Log Analytics workspace of the resource, not in the Application Insights resource.

        Which table should you query to list the incoming HTTP requests received by the API?
      fr: |
        L'API web de Contoso envoie sa télémétrie à une ressource Application Insights basée sur un espace de travail. Vous ouvrez **Journaux** dans l'espace de travail Log Analytics de la ressource, et non dans la ressource Application Insights.

        Quelle table devez-vous interroger pour lister les requêtes HTTP entrantes reçues par l'API ?
    body:
      options:
        - { id: a, text: requests }
        - { id: b, text: AppDependencies }
        - { id: c, text: AppRequests }
        - { id: d, text: AppEvents }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          In the Log Analytics workspace, Application Insights telemetry uses the workspace-based schema: requests received by the application are in AppRequests, with columns such as TimeGenerated, DurationMs and OperationId. The classic names apply only in the Logs of the Application Insights resource.
        fr: |
          Dans l'espace de travail Log Analytics, la télémétrie Application Insights utilise le schéma basé sur l'espace de travail : les requêtes reçues par l'application se trouvent dans AppRequests, avec des colonnes comme TimeGenerated, DurationMs et OperationId. Les noms classiques ne s'appliquent que dans les journaux de la ressource Application Insights.
      options:
        a: { en: "requests is the classic table name, available in the Logs of the Application Insights resource, not in the workspace.", fr: "requests est le nom de table classique, disponible dans les journaux de la ressource Application Insights, pas dans l'espace de travail." }
        b: { en: "AppDependencies holds the outgoing calls of the API to other components, not the requests it receives.", fr: "AppDependencies contient les appels sortants de l'API vers d'autres composants, pas les requêtes qu'elle reçoit." }
        d: { en: "AppEvents holds the custom events sent by the application, not its HTTP requests.", fr: "AppEvents contient les événements personnalisés envoyés par l'application, pas ses requêtes HTTP." }
    references:
      - title: Migrate an Application Insights classic resource to a workspace-based resource - Azure Monitor
        url: https://learn.microsoft.com/en-us/azure/azure-monitor/app/convert-classic-resource

  # ------------------------------------------------------------------ 2
  - id: az400-qz-52-02
    objective: "5.2.2"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Wingtip Toys' online store is an ASP.NET Core app instrumented on the server with the Microsoft OpenTelemetry Distro. Requests and dependencies appear in Application Insights, but the Users, Sessions and Funnels tools show no data.

        You need the product team to analyze page views and user behavior in these tools. What should you add?
      fr: |
        La boutique en ligne de Wingtip Toys est une application ASP.NET Core instrumentée côté serveur avec la Microsoft OpenTelemetry Distro. Les requêtes et les dépendances apparaissent dans Application Insights, mais les outils Users, Sessions et Funnels n'affichent aucune donnée.

        Vous devez permettre à l'équipe produit d'analyser les vues de pages et le comportement des utilisateurs dans ces outils. Que devez-vous ajouter ?
    body:
      options:
        - { id: a, text: { en: "Live Metrics for the production instances", fr: "Live Metrics pour les instances de production" } }
        - { id: b, text: { en: "The Application Insights JavaScript SDK in the pages", fr: "Le SDK JavaScript d'Application Insights dans les pages" } }
        - { id: c, text: { en: "A release annotation for each deployment", fr: "Une annotation de version pour chaque déploiement" } }
        - { id: d, text: { en: "A higher sampling rate in the server distro", fr: "Un taux d'échantillonnage plus élevé dans la distribution serveur" } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          The usage tools are built from browser telemetry, page views and custom events, which the Application Insights JavaScript SDK collects in the pages. Server-side instrumentation alone sends requests and dependencies, not the page views these tools need.
        fr: |
          Les outils d'utilisation reposent sur la télémétrie du navigateur, vues de pages et événements personnalisés, que le SDK JavaScript d'Application Insights collecte dans les pages. L'instrumentation côté serveur seule envoie des requêtes et des dépendances, pas les vues de pages dont ces outils ont besoin.
      options:
        a: { en: "Live Metrics streams server metrics in real time and stores nothing; it doesn't feed the usage tools.", fr: "Live Metrics diffuse des métriques serveur en temps réel et ne stocke rien ; il n'alimente pas les outils d'utilisation." }
        c: { en: "Release annotations mark deployments on the charts; they don't produce page views or user data.", fr: "Les annotations de version marquent les déploiements sur les graphiques ; elles ne produisent ni vues de pages ni données utilisateur." }
        d: { en: "Sampling only changes how much server telemetry is kept; the server never sends page views, whatever the rate.", fr: "L'échantillonnage ne change que la quantité de télémétrie serveur conservée ; le serveur n'envoie jamais de vues de pages, quel que soit le taux." }
    references:
      - title: Usage analysis with Application Insights - Azure Monitor
        url: https://learn.microsoft.com/en-us/azure/azure-monitor/app/usage

  # ------------------------------------------------------------------ 3
  - id: az400-qz-52-03
    objective: "5.2.3"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Fabrikam's booking application is made of a web front end and four back-end services that call each other over HTTP. Each component sets its own cloud role name and sends telemetry to Application Insights.

        You need a single view of the last 24 hours that shows which components call which, with the error rate, the average duration and the number of calls between each pair of components.

        What should you use?
      fr: |
        L'application de réservation de Fabrikam se compose d'un frontal web et de quatre services back-end qui s'appellent en HTTP. Chaque composant définit son propre nom de rôle cloud et envoie sa télémétrie à Application Insights.

        Vous avez besoin d'une seule vue des dernières 24 heures qui montre quels composants appellent lesquels, avec le taux d'erreurs, la durée moyenne et le nombre d'appels entre chaque paire de composants.

        Que devez-vous utiliser ?
    body:
      options:
        - { id: a, text: { en: "The end-to-end transaction details of a sample request", fr: "Les détails de transaction de bout en bout d'un exemple de requête" } }
        - { id: b, text: { en: "The Live Metrics pane, filtered on each component", fr: "Le volet Live Metrics, filtré sur chaque composant" } }
        - { id: c, text: { en: "The Failures view, with the Dependencies tab selected", fr: "La vue Failures, avec l'onglet Dependencies sélectionné" } }
        - { id: d, text: { en: "The Application map of the Application Insights resource", fr: "La cartographie d'application de la ressource Application Insights" } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          The Application map draws each component, identified by its cloud role name, as a node, and each HTTP call path as a connector. Each connector shows the error rate, the average call duration and the call count over the selected time range, which is the topology view required here.
        fr: |
          La cartographie d'application dessine chaque composant, identifié par son nom de rôle cloud, sous forme de nœud, et chaque chemin d'appel HTTP sous forme de connecteur. Chaque connecteur affiche le taux d'erreurs, la durée moyenne des appels et le nombre d'appels sur la plage de temps choisie : c'est la vue de topologie demandée.
      options:
        a: { en: "End-to-end transaction details show one transaction across the components, not aggregated statistics for all the calls of the period.", fr: "Les détails de transaction de bout en bout montrent une seule transaction à travers les composants, pas des statistiques agrégées sur tous les appels de la période." }
        b: { en: "Live Metrics shows real-time rates while the pane is open and keeps no history of the last 24 hours.", fr: "Live Metrics affiche des taux en temps réel tant que le volet est ouvert et ne conserve aucun historique des dernières 24 heures." }
        c: { en: "The Failures view lists failed operations and dependencies, but it doesn't show which component calls which.", fr: "La vue Failures liste les opérations et les dépendances en échec, mais ne montre pas quel composant appelle lequel." }
    references:
      - title: Application map in Azure Application Insights - Azure Monitor
        url: https://learn.microsoft.com/en-us/azure/azure-monitor/app/app-map

  # ------------------------------------------------------------------ 4
  - id: az400-qz-52-04
    objective: "5.2.1"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Adatum hosts an API on an App Service plan named **asp-api** in the Premium v3 tier, with three instances. During traffic peaks, response times triple, while the CPU Percentage of the plan stays near 45 % and its Memory Percentage near 50 %. The team suspects that requests wait before an instance processes them.

        Which metric of asp-api should you inspect to confirm this?
      fr: |
        Adatum héberge une API sur un plan App Service nommé **asp-api** au niveau Premium v3, avec trois instances. Pendant les pics de trafic, les temps de réponse triplent, alors que le CPU Percentage du plan reste proche de 45 % et son Memory Percentage proche de 50 %. L'équipe soupçonne que des requêtes attendent avant qu'une instance ne les traite.

        Quelle métrique d'asp-api devez-vous examiner pour le confirmer ?
    body:
      options:
        - { id: a, text: Disk Queue Length }
        - { id: b, text: Data In }
        - { id: c, text: Http Queue Length }
        - { id: d, text: CPU Time }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          Http Queue Length is the average number of HTTP requests that had to wait in the queue before being fulfilled. A high or rising value is a symptom of a plan under heavy load, even when CPU and memory look moderate.
        fr: |
          Http Queue Length est le nombre moyen de requêtes HTTP qui ont dû attendre dans la file avant d'être traitées. Une valeur élevée ou croissante est le symptôme d'un plan soumis à une forte charge, même quand le processeur et la mémoire semblent modérés.
      options:
        a: { en: "Disk Queue Length counts the read and write requests queued on storage; it reveals excessive disk I/O, not HTTP requests waiting for an instance.", fr: "Disk Queue Length compte les requêtes de lecture et d'écriture en attente sur le stockage ; elle révèle des E/S disque excessives, pas des requêtes HTTP qui attendent une instance." }
        b: { en: "Data In measures the incoming bandwidth of the plan; it doesn't show whether requests wait.", fr: "Data In mesure la bande passante entrante du plan ; elle ne montre pas si des requêtes attendent." }
        d: { en: "CPU Time is an app metric mainly useful for the CPU quotas of the Free and Shared tiers; it doesn't measure queuing.", fr: "CPU Time est une métrique d'application surtout utile pour les quotas de processeur des niveaux Free et Shared ; elle ne mesure pas l'attente." }
    references:
      - title: Supported metrics for Microsoft.Web/serverfarms
        url: https://learn.microsoft.com/en-us/azure/azure-monitor/reference/supported-metrics/microsoft-web-serverfarms-metrics
      - title: Azure App Service Quotas and Metrics - Azure App Service
        url: https://learn.microsoft.com/en-us/azure/app-service/web-sites-monitor

  # ------------------------------------------------------------------ 5
  - id: az400-qz-52-05
    objective: "5.2.4"
    difficulty: 2
    status: draft
    type: yesno_statements
    stem:
      en: |
        Northwind's Log Analytics workspace contains the following rows:

        - In AppRequests, a row whose Name is `GET /api/Orders` and whose AppRoleName is `orders-api`.
        - In AppTraces, a row whose Message is `Timeout while calling inventory`.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        L'espace de travail Log Analytics de Northwind contient les lignes suivantes :

        - Dans AppRequests, une ligne dont Name vaut `GET /api/Orders` et AppRoleName vaut `orders-api`.
        - Dans AppTraces, une ligne dont Message vaut `Timeout while calling inventory`.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - { id: s1, text: { en: "The query `AppRequests | where Name == \"GET /api/orders\"` returns the AppRequests row.", fr: "La requête `AppRequests | where Name == \"GET /api/orders\"` renvoie la ligne d'AppRequests." } }
        - { id: s2, text: { en: "The query `AppRequests | where AppRoleName in~ (\"Orders-API\", \"payments-api\")` returns the AppRequests row.", fr: "La requête `AppRequests | where AppRoleName in~ (\"Orders-API\", \"payments-api\")` renvoie la ligne d'AppRequests." } }
        - { id: s3, text: { en: "The query `AppTraces | where Message startswith \"timeout\"` returns the AppTraces row.", fr: "La requête `AppTraces | where Message startswith \"timeout\"` renvoie la ligne d'AppTraces." } }
    answer:
      values: { s1: false, s2: true, s3: true }
    explanation:
      correct:
        en: |
          `==` is case-sensitive, so `GET /api/orders` doesn't equal `GET /api/Orders`. `in~` is the case-insensitive version of `in`, so `Orders-API` matches `orders-api`. `startswith` is case-insensitive (`startswith_cs` is the sensitive version), so `timeout` matches the beginning of `Timeout while calling inventory`.
        fr: |
          `==` respecte la casse : `GET /api/orders` n'est donc pas égal à `GET /api/Orders`. `in~` est la version de `in` insensible à la casse : `Orders-API` correspond donc à `orders-api`. `startswith` est insensible à la casse (`startswith_cs` est la version sensible) : `timeout` correspond donc au début de `Timeout while calling inventory`.
      options:
        s1: { en: "Use `=~` for a case-insensitive equality; `==` compares the case too.", fr: "Utilisez `=~` pour une égalité insensible à la casse ; `==` compare aussi la casse." }
    references:
      - title: String operators - Kusto
        url: https://learn.microsoft.com/en-us/kusto/query/datatypes-string-operators

  # ------------------------------------------------------------------ 6
  - id: az400-qz-52-06
    objective: "5.2.2"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        Litware has a subscription named **Sub-Build** that contains 14 virtual machines used as self-hosted build agents: 10 in West Europe and 4 in North Europe. Raj, an operations engineer, has the Monitoring Reader role on Sub-Build. Raj opens metrics explorer to compare the Percentage CPU of the agents over the last 60 days.

        Which two statements are true?

        NOTE: Each correct selection is worth one point.
      fr: |
        Litware dispose d'un abonnement nommé **Sub-Build** qui contient 14 machines virtuelles utilisées comme agents de build auto-hébergés : 10 en Europe Ouest et 4 en Europe Nord. Raj, ingénieur des opérations, a le rôle Monitoring Reader sur Sub-Build. Raj ouvre Metrics Explorer pour comparer le Percentage CPU des agents au cours des 60 derniers jours.

        Quelles sont les deux affirmations vraies ?

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "One chart can include the 10 West Europe agents, but the 4 North Europe agents need a separate chart.", fr: "Un graphique peut inclure les 10 agents d'Europe Ouest, mais les 4 agents d'Europe Nord exigent un graphique distinct." } }
        - { id: b, text: { en: "One chart can display the full 60 days at once if the time granularity is set to 1 day.", fr: "Un graphique peut afficher les 60 jours en une fois si la granularité temporelle est réglée sur 1 jour." } }
        - { id: c, text: { en: "Applying splitting to a chart shows at most 10 lines, and this limit can't be changed.", fr: "Appliquer un fractionnement à un graphique affiche au maximum 10 lignes, et cette limite n'est pas modifiable." } }
        - { id: d, text: { en: "Raj can pan the chart to view older data, back to the 93-day retention of the metrics.", fr: "Raj peut faire défiler le graphique pour voir des données plus anciennes, jusqu'à la rétention de 93 jours des métriques." } }
        - { id: e, text: { en: "Raj needs the Monitoring Contributor role on each agent to chart several agents together.", fr: "Raj a besoin du rôle Monitoring Contributor sur chaque agent pour représenter plusieurs agents ensemble." } }
    answer: { optionIds: [a, d] }
    explanation:
      correct:
        en: |
          A multi-resource chart only accepts resources of the same type, location and subscription, so the two regions need two charts. Most platform metrics are kept for 93 days, and while a single chart queries at most 30 days, panning moves the time range to reach the full retention.
        fr: |
          Un graphique multiressource n'accepte que des ressources de même type, même emplacement et même abonnement : les deux régions exigent donc deux graphiques. La plupart des métriques de plateforme sont conservées 93 jours, et si un graphique interroge au plus 30 jours, le défilement déplace la plage de temps pour atteindre toute la rétention.
      options:
        b: { en: "A single chart queries at most 30 days of platform metrics, whatever the granularity; the other days are reached by panning.", fr: "Un graphique interroge au plus 30 jours de métriques de plateforme, quelle que soit la granularité ; les autres jours s'atteignent par défilement." }
        c: { en: "Splitting shows 10 values by default, but the limit can be set from 1 to 50.", fr: "Le fractionnement affiche 10 valeurs par défaut, mais la limite se règle de 1 à 50." }
        e: { en: "Monitoring Reader at the subscription level is enough to chart metrics across several resources.", fr: "Monitoring Reader au niveau de l'abonnement suffit pour représenter des métriques sur plusieurs ressources." }
    references:
      - title: Analyze metrics with Azure Monitor metrics explorer - Azure Monitor
        url: https://learn.microsoft.com/en-us/azure/azure-monitor/metrics/analyze-metrics

  # ------------------------------------------------------------------ 7
  - id: az400-qz-52-07
    objective: "5.2.1"
    difficulty: 3
    status: draft
    type: dropdown
    stem:
      en: |
        Tailspin's self-hosted build agents are Azure virtual machines monitored by the logs-based experience of VM insights. Builds fail when a volume of an agent fills up, and an agent can have several volumes.

        You need a query that returns the 10 volumes with the lowest free space over the last 24 hours. Each row must show the computer, the volume and the minimum free space percentage of that volume.

        How should you complete the query? Select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Les agents de build auto-hébergés de Tailspin sont des machines virtuelles Azure supervisées par l'expérience basée sur les journaux de VM Insights. Les builds échouent quand un volume d'un agent se remplit, et un agent peut avoir plusieurs volumes.

        Vous avez besoin d'une requête qui renvoie les 10 volumes ayant le moins d'espace libre au cours des dernières 24 heures. Chaque ligne doit afficher l'ordinateur, le volume et le pourcentage d'espace libre minimal de ce volume.

        Comment devez-vous compléter la requête ? Sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: code
      language: kusto
      template: |
        InsightsMetrics
        | where TimeGenerated > ago(24h)
        | where Origin == "vm.azm.ms"
        | where Namespace == [[ns]] and Name == [[name]]
        | extend Volume = [[vol]]
        | summarize MinFreePct = min(Val) by Computer, Volume
        | [[last]]
      slots:
        - id: ns
          options:
            - { id: memory, text: '"Memory"' }
            - { id: logical, text: '"LogicalDisk"' }
            - { id: processor, text: '"Processor"' }
            - { id: network, text: '"Network"' }
        - id: name
          options:
            - { id: avail, text: '"AvailableMB"' }
            - { id: util, text: '"UtilizationPercentage"' }
            - { id: free, text: '"FreeSpacePercentage"' }
        - id: vol
          options:
            - { id: mount, text: 'tostring(todynamic(Tags)["vm.azm.ms/mountId"])' }
            - { id: size, text: 'tostring(todynamic(Tags)["vm.azm.ms/memorySizeMB"])' }
            - { id: resid, text: _ResourceId }
            - { id: metric, text: tostring(Name) }
        - id: last
          options:
            - { id: topdefault, text: top 10 by MinFreePct }
            - { id: topasc, text: top 10 by MinFreePct asc }
            - { id: take, text: take 10 }
            - { id: sortdesc, text: sort by MinFreePct desc | take 10 }
    answer:
      values: { ns: logical, name: free, vol: mount, last: topasc }
    explanation:
      correct:
        en: |
          VM insights stores the free space of each volume as the FreeSpacePercentage metric of the LogicalDisk namespace in InsightsMetrics, and the volume is identified by the `vm.azm.ms/mountId` key of the Tags column. Summarizing the minimum by Computer and Volume gives one row per volume, and `top 10 by MinFreePct asc` keeps the 10 lowest values, because `top` sorts in descending order by default.
        fr: |
          VM Insights stocke l'espace libre de chaque volume dans la métrique FreeSpacePercentage de l'espace de noms LogicalDisk d'InsightsMetrics, et le volume est identifié par la clé `vm.azm.ms/mountId` de la colonne Tags. Agréger le minimum par Computer et Volume donne une ligne par volume, et `top 10 by MinFreePct asc` garde les 10 valeurs les plus basses, car `top` trie par défaut dans l'ordre décroissant.
      options:
        size: { en: "`vm.azm.ms/memorySizeMB` is the memory size of the machine, used with the Memory namespace; it doesn't identify a volume.", fr: "`vm.azm.ms/memorySizeMB` est la taille mémoire de la machine, utilisée avec l'espace de noms Memory ; elle n'identifie pas un volume." }
        resid: { en: "`_ResourceId` identifies the virtual machine, so all the volumes of an agent would be merged into one row.", fr: "`_ResourceId` identifie la machine virtuelle : tous les volumes d'un agent seraient fusionnés en une seule ligne." }
        topdefault: { en: "Without `asc`, `top` sorts in descending order and returns the 10 volumes with the most free space.", fr: "Sans `asc`, `top` trie dans l'ordre décroissant et renvoie les 10 volumes ayant le plus d'espace libre." }
        take: { en: "`take` returns arbitrary rows, not the lowest values.", fr: "`take` renvoie des lignes arbitraires, pas les valeurs les plus basses." }
        sortdesc: { en: "Sorting in descending order puts the volumes with the most free space first.", fr: "Trier dans l'ordre décroissant place en premier les volumes ayant le plus d'espace libre." }
    references:
      - title: "Monitor virtual machines with Azure Monitor: Alerts - Azure Monitor"
        url: https://learn.microsoft.com/en-us/azure/azure-monitor/vm/monitor-virtual-machine-alerts
      - title: top operator - Kusto
        url: https://learn.microsoft.com/en-us/kusto/query/top-operator

  # ------------------------------------------------------------------ 8
  - id: az400-qz-52-08
    objective: "5.2.3"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        Proseware's checkout is made of three services: **web-front**, **orders-api** and **payments-api**. Each service is instrumented with the Microsoft OpenTelemetry Distro, sets its own `service.name`, and sends telemetry to an Application Insights resource named **appi-shop**. On the Application map of appi-shop for the last 24 hours, the connector from orders-api to payments-api is red.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Le paiement en ligne de Proseware se compose de trois services : **web-front**, **orders-api** et **payments-api**. Chaque service est instrumenté avec la Microsoft OpenTelemetry Distro, définit son propre `service.name` et envoie sa télémétrie à une ressource Application Insights nommée **appi-shop**. Sur la cartographie d'application d'appi-shop pour les dernières 24 heures, le connecteur d'orders-api vers payments-api est rouge.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - { id: s1, text: { en: "If payments-api sent its telemetry to another Application Insights resource in another subscription, a user who can read both resources would still see payments-api as a component on the map.", fr: "Si payments-api envoyait sa télémétrie à une autre ressource Application Insights dans un autre abonnement, un utilisateur qui peut lire les deux ressources verrait toujours payments-api comme composant sur la cartographie." } }
        - { id: s2, text: { en: "Intelligent view can analyze the last 14 days to highlight the connectors that most likely cause the failures.", fr: "Intelligent view peut analyser les 14 derniers jours pour mettre en évidence les connecteurs qui causent le plus probablement les échecs." } }
        - { id: s3, text: { en: "The error rate of the red connector is the number of failed calls from orders-api to payments-api divided by the number of all calls across that connector.", fr: "Le taux d'erreurs du connecteur rouge est le nombre d'appels en échec d'orders-api vers payments-api divisé par le nombre total d'appels sur ce connecteur." } }
    answer:
      values: { s1: true, s2: false, s3: true }
    explanation:
      correct:
        en: |
          Map components can be separate Application Insights resources, even in different subscriptions, as long as you have access to each of them. Intelligent view supports time ranges of up to seven days. A connector's error rate is its failed calls divided by all its calls, and a red connector is in an error state.
        fr: |
          Les composants de la cartographie peuvent être des ressources Application Insights distinctes, même dans des abonnements différents, à condition d'avoir accès à chacune. Intelligent view prend en charge des plages de temps de sept jours au maximum. Le taux d'erreurs d'un connecteur est le nombre de ses appels en échec divisé par le nombre total de ses appels, et un connecteur rouge est en état d'erreur.
      options:
        s2: { en: "Intelligent view analyzes at most seven days; a 14-day range isn't supported.", fr: "Intelligent view analyse au maximum sept jours ; une plage de 14 jours n'est pas prise en charge." }
    references:
      - title: Application map in Azure Application Insights - Azure Monitor
        url: https://learn.microsoft.com/en-us/azure/azure-monitor/app/app-map

  # ------------------------------------------------------------------ 9
  - id: az400-qz-52-09
    objective: "5.2.2"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Adatum's customer portal is instrumented with the Application Insights JavaScript SDK. Customers must sign in, and most of them use the portal from both a phone and a laptop. Each month, the Users tool reports about 40 % more users than the number of customer accounts that were active.

        You need the Users, Sessions and User Retention Analysis tools to count each signed-in customer once, whatever the browser or device. Only the browser code of the portal may be changed.

        What should you do?
      fr: |
        Le portail client d'Adatum est instrumenté avec le SDK JavaScript d'Application Insights. Les clients doivent se connecter, et la plupart utilisent le portail depuis un téléphone et un ordinateur portable. Chaque mois, l'outil Users signale environ 40 % d'utilisateurs de plus que le nombre de comptes clients actifs.

        Vous devez faire en sorte que les outils Users, Sessions et User Retention Analysis comptent chaque client connecté une seule fois, quel que soit le navigateur ou l'appareil. Seul le code du portail exécuté dans le navigateur peut être modifié.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Create a cohort of the users active on at least five days of the last 28 days, and use it in Users.", fr: "Créer une cohorte des utilisateurs actifs au moins cinq jours sur les 28 derniers jours, et l'utiliser dans Users." } }
        - { id: b, text: { en: "Disable sampling in the JavaScript SDK so that every page view of every user is sent.", fr: "Désactiver l'échantillonnage dans le SDK JavaScript afin que chaque vue de page de chaque utilisateur soit envoyée." } }
        - { id: c, text: { en: "Enable the Click Analytics plug-in, and read the user counts in the HEART workbook.", fr: "Activer le plug-in Click Analytics, et lire le nombre d'utilisateurs dans le classeur HEART." } }
        - { id: d, text: { en: "Call setAuthenticatedUserContext() with the customer account ID after each sign-in.", fr: "Appeler setAuthenticatedUserContext() avec l'ID du compte client après chaque connexion." } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          By default, users are counted by anonymous IDs stored in browser cookies, so one person on two devices or browsers counts as two users. Calling `setAuthenticatedUserContext()` after sign-in attaches an authenticated user ID to the browser telemetry, which enables tracking of the same customer across devices and browsers.
        fr: |
          Par défaut, les utilisateurs sont comptés par des ID anonymes stockés dans des cookies du navigateur : une personne sur deux appareils ou navigateurs compte donc pour deux utilisateurs. Appeler `setAuthenticatedUserContext()` après la connexion associe un ID d'utilisateur authentifié à la télémétrie du navigateur, ce qui permet de suivre le même client entre appareils et navigateurs.
      options:
        a: { en: "A cohort reuses the same anonymous user IDs; it filters users but doesn't merge one customer's devices.", fr: "Une cohorte réutilise les mêmes ID d'utilisateurs anonymes ; elle filtre les utilisateurs mais ne fusionne pas les appareils d'un même client." }
        b: { en: "Sampling reduces the telemetry kept; it doesn't create extra users, so disabling it doesn't fix the double counting.", fr: "L'échantillonnage réduit la télémétrie conservée ; il ne crée pas d'utilisateurs supplémentaires, donc le désactiver ne corrige pas le double comptage." }
        c: { en: "The HEART workbook also relies on anonymous users unless the authenticated user context is set.", fr: "Le classeur HEART repose lui aussi sur des utilisateurs anonymes tant que le contexte d'utilisateur authentifié n'est pas défini." }
    references:
      - title: Usage analysis with Application Insights - Azure Monitor
        url: https://learn.microsoft.com/en-us/azure/azure-monitor/app/usage

  # ------------------------------------------------------------------ 10
  - id: az400-qz-52-10
    objective: "5.2.4"
    difficulty: 3
    status: draft
    type: dropdown
    stem:
      en: |
        Woodgrove's order API is instrumented with the Microsoft OpenTelemetry Distro and keeps its default rate-limited sampling. Its telemetry is stored in a Log Analytics workspace.

        You need a query that returns, for the last 24 hours, the five operations with the highest percentage of failed requests. For each operation, the query must also return the estimated real number of requests and of failed requests, corrected for sampling.

        How should you complete the query? Select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        L'API de commandes de Woodgrove est instrumentée avec la Microsoft OpenTelemetry Distro et conserve son échantillonnage limité en débit par défaut. Sa télémétrie est stockée dans un espace de travail Log Analytics.

        Vous avez besoin d'une requête qui renvoie, pour les dernières 24 heures, les cinq opérations ayant le pourcentage de requêtes en échec le plus élevé. Pour chaque opération, la requête doit aussi renvoyer le nombre réel estimé de requêtes et de requêtes en échec, corrigé de l'échantillonnage.

        Comment devez-vous compléter la requête ? Sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: code
      language: kusto
      template: |
        AppRequests
        | where TimeGenerated > ago(24h)
        | summarize Total = [[total]], Failed = [[failed]] by Name
        | extend FailureRate = round(100.0 * Failed / Total, 2)
        | [[last]]
      slots:
        - id: total
          options:
            - { id: count, text: count() }
            - { id: dcount, text: dcount(OperationId) }
            - { id: sumitem, text: sum(ItemCount) }
            - { id: sumdur, text: sum(DurationMs) }
        - id: failed
          options:
            - { id: countif, text: countif(Success == false) }
            - { id: sumif, text: "sumif(ItemCount, Success == false)" }
            - { id: dcountif, text: "dcountif(OperationId, Success == false)" }
            - { id: sumifdur, text: "sumif(DurationMs, Success == false)" }
        - id: last
          options:
            - { id: sortfailed, text: sort by Failed desc | take 5 }
            - { id: topasc, text: top 5 by FailureRate asc }
            - { id: topdesc, text: top 5 by FailureRate desc }
            - { id: take, text: take 5 }
    answer:
      values: { total: sumitem, failed: sumif, last: topdesc }
    explanation:
      correct:
        en: |
          With sampling, each stored row stands for ItemCount original requests, so the real counts are `sum(ItemCount)` and `sumif(ItemCount, Success == false)`. `extend` then computes the rate from the summarized columns, and `top 5 by FailureRate desc` keeps the five highest rates.
        fr: |
          Avec l'échantillonnage, chaque ligne stockée représente ItemCount requêtes d'origine : les nombres réels sont donc `sum(ItemCount)` et `sumif(ItemCount, Success == false)`. `extend` calcule ensuite le taux à partir des colonnes agrégées, et `top 5 by FailureRate desc` garde les cinq taux les plus élevés.
      options:
        count: { en: "`count()` counts the stored rows only, which underestimates the real number of requests when sampling is on.", fr: "`count()` ne compte que les lignes stockées, ce qui sous-estime le nombre réel de requêtes quand l'échantillonnage est actif." }
        countif: { en: "`countif()` counts the stored failed rows, not the failed requests they represent.", fr: "`countif()` compte les lignes en échec stockées, pas les requêtes en échec qu'elles représentent." }
        sortfailed: { en: "Sorting on Failed returns the operations with the most failures, not the highest failure percentage.", fr: "Trier sur Failed renvoie les opérations ayant le plus d'échecs, pas le pourcentage d'échecs le plus élevé." }
        topasc: { en: "`asc` returns the five lowest failure rates.", fr: "`asc` renvoie les cinq taux d'échec les plus bas." }
    references:
      - title: Azure Monitor Logs reference - AppRequests - Azure Monitor
        url: https://learn.microsoft.com/en-us/azure/azure-monitor/reference/tables/apprequests
      - title: top operator - Kusto
        url: https://learn.microsoft.com/en-us/kusto/query/top-operator
