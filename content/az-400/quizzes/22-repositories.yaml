chapter: 22-repositories
questions:
  # ------------------------------------------------------------------ 1
  - id: az400-qz-22-01
    objective: "2.2.1"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Adatum stores its `.psd` design files in an Azure Repos Git repository by using Git LFS. A new developer wants to understand how the repository keeps these files.

        What does the Git repository itself store for each version of a file that Git LFS tracks?
      fr: |
        Adatum stocke ses fichiers de conception `.psd` dans un dépôt Git Azure Repos en utilisant Git LFS. Un nouveau développeur veut comprendre comment le dépôt conserve ces fichiers.

        Que stocke le dépôt Git lui-même pour chaque version d'un fichier suivi par Git LFS ?
    body:
      options:
        - { id: a, text: { en: "A small pointer file that references content kept in separate storage", fr: "Un petit fichier pointeur qui référence un contenu conservé dans un stockage séparé" } }
        - { id: b, text: { en: "A compressed delta between this version and the previous version of the file", fr: "Un delta compressé entre cette version et la version précédente du fichier" } }
        - { id: c, text: { en: "A symbolic link to the file on a network share of the build server", fr: "Un lien symbolique vers le fichier sur un partage réseau du serveur de build" } }
        - { id: d, text: { en: "The full content of the file, split into blocks that Git can merge", fr: "Le contenu complet du fichier, découpé en blocs que Git peut fusionner" } }
    answer: { optionId: a }
    explanation:
      correct:
        en: |
          Git LFS replaces the content of each tracked file in the repository with a small pointer file (version, object ID and size), and stores the binary content in separate remote storage. Clones therefore no longer carry every version of the binaries, and a client without Git LFS gets only the pointers.
        fr: |
          Git LFS remplace le contenu de chaque fichier suivi dans le dépôt par un petit fichier pointeur (version, ID d'objet et taille), et stocke le contenu binaire dans un stockage distant séparé. Les clones ne transportent donc plus toutes les versions des binaires, et un client sans Git LFS ne récupère que les pointeurs.
      options:
        b: { en: "Storing deltas of the binary in the repository is what plain Git does, and it is exactly what makes clones grow; LFS keeps the content out of the repository.", fr: "Stocker des deltas du binaire dans le dépôt, c'est ce que fait Git seul, et c'est justement ce qui fait grossir les clones ; LFS garde le contenu hors du dépôt." }
        c: { en: "Git LFS doesn't use symbolic links or network shares: the pointer references an object on the LFS server of the repository host.", fr: "Git LFS n'utilise ni liens symboliques ni partages réseau : le pointeur référence un objet sur le serveur LFS de l'hébergeur du dépôt." }
        d: { en: "The full content isn't in the repository at all, and Git LFS doesn't make binaries mergeable; it offers file locking for them instead.", fr: "Le contenu complet n'est pas du tout dans le dépôt, et Git LFS ne rend pas les binaires fusionnables ; il propose plutôt le verrouillage de fichiers." }
    references:
      - title: Manage and Store Large Files in Git - Azure Repos
        url: https://learn.microsoft.com/en-us/azure/devops/repos/git/manage-large-files

  # ------------------------------------------------------------------ 2
  - id: az400-qz-22-02
    objective: "2.2.3"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Fabrikam has an Azure Repos Git repository named **Payroll**. A developer named Lena is a member of the **Contributors** group, which has **Contribute** set to **Allow** on Payroll. Lena is also a member of a custom group named **Auditors**, which has **Contribute** set to **Deny** on Payroll.

        What happens when Lena tries to push a commit to Payroll?
      fr: |
        Fabrikam dispose d'un dépôt Git Azure Repos nommé **Payroll**. Une développeuse nommée Lena est membre du groupe **Contributors**, pour lequel **Contribute** est défini sur **Allow** sur Payroll. Lena est aussi membre d'un groupe personnalisé nommé **Auditors**, pour lequel **Contribute** est défini sur **Deny** sur Payroll.

        Que se passe-t-il quand Lena tente de pousser un commit vers Payroll ?
    body:
      options:
        - { id: a, text: { en: "The push is accepted, because an Allow permission overrides a Deny.", fr: "Le push est accepté, car une autorisation Allow l'emporte sur un Deny." } }
        - { id: b, text: { en: "The push is rejected, because a Deny permission overrides an Allow.", fr: "Le push est refusé, car une autorisation Deny l'emporte sur un Allow." } }
        - { id: c, text: { en: "The push is accepted, because a default group takes priority over a custom group.", fr: "Le push est accepté, car un groupe par défaut a priorité sur un groupe personnalisé." } }
        - { id: d, text: { en: "The push is rejected, because two conflicting groups make the permission Not set.", fr: "Le push est refusé, car deux groupes en conflit rendent l'autorisation Not set." } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          In Azure DevOps, Deny generally overrides Allow, including an Allow granted through another group. Because Auditors denies Contribute, Lena can't push to Payroll even though Contributors allows it; to let her push, remove her from Auditors or change that group's permission.
        fr: |
          Dans Azure DevOps, Deny l'emporte en général sur Allow, y compris sur un Allow accordé par un autre groupe. Comme Auditors refuse Contribute, Lena ne peut pas pousser vers Payroll même si Contributors l'autorise ; pour qu'elle puisse pousser, retirez-la d'Auditors ou modifiez l'autorisation de ce groupe.
      options:
        a: { en: "It's the reverse: Allow applies only when no applicable Deny overrides it.", fr: "C'est l'inverse : Allow ne s'applique que si aucun Deny applicable ne l'annule." }
        c: { en: "Azure DevOps doesn't rank default groups above custom groups; an explicit Deny wins whatever the group.", fr: "Azure DevOps ne classe pas les groupes par défaut au-dessus des groupes personnalisés ; un Deny explicite l'emporte quel que soit le groupe." }
        d: { en: "The push is rejected, but because of the Deny: Not set means that a group neither grants nor denies the permission, which isn't the case here.", fr: "Le push est bien refusé, mais à cause du Deny : Not set signifie qu'un groupe n'accorde ni ne refuse l'autorisation, ce qui n'est pas le cas ici." }
    references:
      - title: Set Git repository permissions - Azure Repos
        url: https://learn.microsoft.com/en-us/azure/devops/repos/git/set-git-repository-permissions

  # ------------------------------------------------------------------ 3
  - id: az400-qz-22-03
    objective: "2.2.4"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        A release engineer at Tailspin pushed a tag named **v4.0.0-rc1** to an Azure Repos Git repository by mistake. Nobody has fetched the tag yet. The engineer has the **Force push** permission on the repository and has already run `git tag -d v4.0.0-rc1` in the local clone.

        The tag must also disappear from Azure Repos. Which command should the engineer run next?
      fr: |
        Un ingénieur de mise en production de Tailspin a poussé par erreur une balise nommée **v4.0.0-rc1** vers un dépôt Git Azure Repos. Personne n'a encore récupéré la balise. L'ingénieur dispose de l'autorisation **Force push** sur le dépôt et a déjà exécuté `git tag -d v4.0.0-rc1` dans le clone local.

        La balise doit aussi disparaître d'Azure Repos. Quelle commande l'ingénieur doit-il exécuter ensuite ?
    body:
      options:
        - { id: a, text: "`git push origin --tags`" }
        - { id: b, text: "`git push origin --delete v4.0.0-rc1`" }
        - { id: c, text: "`git fetch origin --prune`" }
        - { id: d, text: "`git revert v4.0.0-rc1`" }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          `git tag -d` deletes only the local tag. `git push origin --delete v4.0.0-rc1` deletes the tag on the remote, which Azure Repos allows to users who have Force push on the repository or on All tags (the creator of a tag also inherits it for that tag).
        fr: |
          `git tag -d` ne supprime que la balise locale. `git push origin --delete v4.0.0-rc1` supprime la balise sur le dépôt distant, ce qu'Azure Repos autorise aux utilisateurs qui ont Force push sur le dépôt ou sur All tags (le créateur d'une balise en hérite aussi pour cette balise).
      options:
        a: { en: "`--tags` pushes the local tags to the remote; it never deletes a remote tag that no longer exists locally.", fr: "`--tags` pousse les balises locales vers le dépôt distant ; il ne supprime jamais une balise distante qui n'existe plus en local." }
        c: { en: "`git fetch --prune` cleans up local remote-tracking references; it doesn't change anything on the server.", fr: "`git fetch --prune` nettoie les références de suivi locales ; il ne modifie rien sur le serveur." }
        d: { en: "`git revert` creates a commit that reverses the changes of the tagged commit; the tag itself stays on the server.", fr: "`git revert` crée un commit qui inverse les modifications du commit balisé ; la balise elle-même reste sur le serveur." }
    references:
      - title: Use Git tags - Azure Repos
        url: https://learn.microsoft.com/en-us/azure/devops/repos/git/git-tags

  # ------------------------------------------------------------------ 4
  - id: az400-qz-22-04
    objective: "2.2.6"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        A developer at Litware has just committed several changes to the local **feature/billing** branch. The commit, which hasn't been pushed, also added the file **config/local.settings.json** by mistake. The file holds only the connection string of the developer's local database emulator.

        The file must not appear in any commit of the branch, the developer must keep the local copy of the file, and the other changes must stay committed.

        What should the developer do?
      fr: |
        Un développeur de Litware vient de valider plusieurs modifications dans la branche locale **feature/billing**. Le commit, qui n'a pas été poussé, a aussi ajouté par erreur le fichier **config/local.settings.json**. Le fichier contient seulement la chaîne de connexion de l'émulateur de base de données local du développeur.

        Le fichier ne doit apparaître dans aucun commit de la branche, le développeur doit conserver sa copie locale du fichier, et les autres modifications doivent rester validées.

        Que doit faire le développeur ?
    body:
      options:
        - { id: a, text: { en: "Run `git rm --cached config/local.settings.json`, add the path to `.gitignore`, and create a new commit.", fr: "Exécuter `git rm --cached config/local.settings.json`, ajouter le chemin à `.gitignore`, puis créer un nouveau commit." } }
        - { id: b, text: { en: "Run `git rm --cached config/local.settings.json`, add the path to `.gitignore`, and run `git commit --amend`.", fr: "Exécuter `git rm --cached config/local.settings.json`, ajouter le chemin à `.gitignore`, puis exécuter `git commit --amend`." } }
        - { id: c, text: { en: "Run `git revert HEAD`, add the path to `.gitignore`, and commit the `.gitignore` file.", fr: "Exécuter `git revert HEAD`, ajouter le chemin à `.gitignore`, puis valider le fichier `.gitignore`." } }
        - { id: d, text: { en: "Run `git reset --hard HEAD~1`, add the path to `.gitignore`, and commit the other changes again.", fr: "Exécuter `git reset --hard HEAD~1`, ajouter le chemin à `.gitignore`, puis valider à nouveau les autres modifications." } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          `git rm --cached` removes the file from the index but leaves it in the working tree, and `.gitignore` keeps it from being added again. `git commit --amend` replaces the last commit with a new one that contains the other changes without the file. Because the commit was never pushed, amending it rewrites no shared history.
        fr: |
          `git rm --cached` retire le fichier de l'index mais le laisse dans l'arborescence de travail, et `.gitignore` empêche de l'ajouter à nouveau. `git commit --amend` remplace le dernier commit par un nouveau commit qui contient les autres modifications sans le fichier. Comme le commit n'a jamais été poussé, le modifier ne réécrit aucun historique partagé.
      options:
        a: { en: "A new commit only deletes the file from that point on; the previous commit of the branch still contains it.", fr: "Un nouveau commit ne supprime le fichier qu'à partir de ce point ; le commit précédent de la branche le contient toujours." }
        c: { en: "`git revert HEAD` reverses all the changes of the commit, including the ones that must stay, and the file stays in the original commit.", fr: "`git revert HEAD` inverse toutes les modifications du commit, y compris celles qui doivent rester, et le fichier reste dans le commit d'origine." }
        d: { en: "`git reset --hard` discards the changes of the commit and removes the file from the working tree, so the local copy is lost.", fr: "`git reset --hard` abandonne les modifications du commit et retire le fichier de l'arborescence de travail : la copie locale est perdue." }
    references:
      - title: Save your changes with Git commits - Azure Repos
        url: https://learn.microsoft.com/en-us/azure/devops/repos/git/commits
      - title: Undo changes in your Git repo - Azure Repos
        url: https://learn.microsoft.com/en-us/azure/devops/repos/git/undo

  # ------------------------------------------------------------------ 5
  - id: az400-qz-22-05
    objective: "2.2.5"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Contoso has an Azure DevOps project that contained an Azure Repos Git repository named **Telemetry**. Twelve days ago, a project administrator deleted the Telemetry repository by mistake. The project itself wasn't deleted, and no developer has a clone that contains all the branches and tags.

        You need to recover Telemetry with all its branches, tags and history. What should you do?
      fr: |
        Contoso dispose d'un projet Azure DevOps qui contenait un dépôt Git Azure Repos nommé **Telemetry**. Il y a douze jours, un administrateur de projet a supprimé par erreur le dépôt Telemetry. Le projet lui-même n'a pas été supprimé, et aucun développeur ne dispose d'un clone qui contient toutes les branches et toutes les balises.

        Vous devez récupérer Telemetry avec toutes ses branches, ses balises et son historique. Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Search the deleted branches in the **Branches** view of the project, and select **Restore branch** for each branch.", fr: "Rechercher les branches supprimées dans la vue **Branches** du projet, puis sélectionner **Restore branch** pour chaque branche." } }
        - { id: b, text: { en: "Restore Telemetry from the recycle bin by calling the **Restore Repository From Recycle Bin** REST API.", fr: "Restaurer Telemetry depuis la corbeille en appelant l'API REST **Restore Repository From Recycle Bin**." } }
        - { id: c, text: { en: "Create an empty repository named Telemetry, and run `git reflog` in a clone of it to find the lost commits.", fr: "Créer un dépôt vide nommé Telemetry, puis exécuter `git reflog` dans un clone de ce dépôt pour retrouver les commits perdus." } }
        - { id: d, text: { en: "Restore the project from the recently deleted projects in **Organization settings** > **Overview**.", fr: "Restaurer le projet depuis les projets récemment supprimés dans **Organization settings** > **Overview**." } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          A deleted Azure Repos Git repository is soft-deleted and stays in a recycle bin for 30 days. During that period, the Restore Repository From Recycle Bin REST API brings it back with its whole content; after 30 days it is permanently deleted.
        fr: |
          Un dépôt Git Azure Repos supprimé fait l'objet d'une suppression réversible et reste 30 jours dans une corbeille. Pendant cette période, l'API REST Restore Repository From Recycle Bin le rétablit avec tout son contenu ; après 30 jours, il est définitivement supprimé.
      options:
        a: { en: "Restore branch brings back a branch deleted from an existing repository; it can't recreate a deleted repository.", fr: "Restore branch rétablit une branche supprimée d'un dépôt existant ; il ne peut pas recréer un dépôt supprimé." }
        c: { en: "The reflog is local to each clone; a clone of a new empty repository has no record of Telemetry's commits.", fr: "Le reflog est propre à chaque clone ; un clone d'un nouveau dépôt vide n'a aucune trace des commits de Telemetry." }
        d: { en: "Only the repository was deleted: the project isn't in the list of deleted projects, and restoring a project doesn't bring back one repository.", fr: "Seul le dépôt a été supprimé : le projet ne figure pas dans la liste des projets supprimés, et restaurer un projet ne rétablit pas un dépôt isolé." }
    references:
      - title: Delete a Git Repo from Your Project - Azure Repos
        url: https://learn.microsoft.com/en-us/azure/devops/repos/git/delete-existing-repo

  # ------------------------------------------------------------------ 6
  - id: az400-qz-22-06
    objective: "2.2.6"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        Woodgrove Bank has an Azure DevOps project named **Lending** that contains 25 Azure Repos Git repositories. GitHub Advanced Security for Azure DevOps is available for the organization but isn't enabled yet.

        This morning, a developer pushed a commit to the main branch of the **loan-api** repository. Among other changes, the commit added an Azure Storage account key to the file **src/appsettings.json**. The security team has decided that the history of loan-api won't be rewritten.

        You need to meet the following requirements:

        - The leaked key can no longer be used to access the storage account.
        - Any future push that contains a credential, in any file of any repository of Lending, is blocked.

        Which two actions should you perform? Each correct answer presents part of the solution.

        NOTE: Each correct selection is worth one point.
      fr: |
        Woodgrove Bank dispose d'un projet Azure DevOps nommé **Lending** qui contient 25 dépôts Git Azure Repos. GitHub Advanced Security pour Azure DevOps est disponible pour l'organisation mais n'est pas encore activé.

        Ce matin, un développeur a poussé un commit vers la branche main du dépôt **loan-api**. Parmi d'autres modifications, le commit a ajouté une clé de compte de stockage Azure au fichier **src/appsettings.json**. L'équipe de sécurité a décidé que l'historique de loan-api ne serait pas réécrit.

        Vous devez répondre aux exigences suivantes :

        - La clé divulguée ne permet plus d'accéder au compte de stockage.
        - Tout push futur qui contient des informations d'identification, dans n'importe quel fichier de n'importe quel dépôt de Lending, est bloqué.

        Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "Regenerate the storage account key that was pushed, and update the services that use it.", fr: "Régénérer la clé du compte de stockage qui a été poussée, puis mettre à jour les services qui l'utilisent." } }
        - { id: b, text: { en: "Enable secret scanning push protection for the repositories of the Lending project.", fr: "Activer la protection push de l'analyse des secrets pour les dépôts du projet Lending." } }
        - { id: c, text: { en: "Remove the key from src/appsettings.json in a new commit, and push the commit to main.", fr: "Retirer la clé de src/appsettings.json dans un nouveau commit, puis pousser le commit vers main." } }
        - { id: d, text: { en: "Add src/appsettings.json to the .gitignore file of each repository of the Lending project.", fr: "Ajouter src/appsettings.json au fichier .gitignore de chaque dépôt du projet Lending." } }
        - { id: e, text: { en: "Enable the File path validation repository policy with a *.json pattern on All Repositories.", fr: "Activer la stratégie de dépôt File path validation avec un modèle *.json sur All Repositories." } }
    answer: { optionIds: [a, b] }
    explanation:
      correct:
        en: |
          Once pushed, a secret must be treated as compromised: invalidating it by regenerating the key, and updating the services that use it, is what makes the leak harmless, history rewrite or not. Secret scanning push protection, part of GitHub Advanced Security for Azure DevOps, checks incoming pushes for high-confidence secrets in any file and rejects them.
        fr: |
          Une fois poussé, un secret doit être considéré comme compromis : l'invalider en régénérant la clé, et mettre à jour les services qui l'utilisent, est ce qui rend la fuite inoffensive, avec ou sans réécriture de l'historique. La protection push de l'analyse des secrets, qui fait partie de GitHub Advanced Security pour Azure DevOps, vérifie dans tous les fichiers les secrets à haut niveau de confiance des push entrants et les rejette.
      options:
        c: { en: "A new commit leaves the key in the earlier commit of the history, and the key remains valid.", fr: "Un nouveau commit laisse la clé dans le commit antérieur de l'historique, et la clé reste valide." }
        d: { en: ".gitignore has no effect on a file that is already tracked, and it doesn't protect the other files that could contain a credential.", fr: ".gitignore n'a aucun effet sur un fichier déjà suivi, et il ne protège pas les autres fichiers qui pourraient contenir des informations d'identification." }
        e: { en: "File path validation blocks files by path, whatever their content: it would block every JSON file and still let credentials through in other files.", fr: "File path validation bloque des fichiers selon leur chemin, quel que soit leur contenu : elle bloquerait tous les fichiers JSON tout en laissant passer des informations d'identification dans d'autres fichiers." }
    references:
      - title: Set up secret scanning for GitHub Advanced Security - Azure Repos
        url: https://learn.microsoft.com/en-us/azure/devops/repos/security/github-advanced-security-secret-scanning

  # ------------------------------------------------------------------ 7
  - id: az400-qz-22-07
    objective: "2.2.2"
    difficulty: 3
    status: draft
    type: dragdrop
    stem:
      en: |
        Adatum is splitting a large monorepo into several repositories hosted in Azure Repos and GitHub. The architects have listed four code-sharing requirements in the answer area.

        Which technique should you use for each requirement? To answer, drag the appropriate techniques to the correct requirements. Each technique may be used once or not at all.

        NOTE: Each correct selection is worth one point.
      fr: |
        Adatum divise un grand monodépôt en plusieurs dépôts hébergés dans Azure Repos et GitHub. Les architectes ont listé quatre exigences de partage de code dans la zone de réponse.

        Quelle technique devez-vous utiliser pour chaque exigence ? Pour répondre, faites glisser les techniques appropriées vers les exigences correspondantes. Chaque technique peut être utilisée une fois ou pas du tout.

        Remarque : chaque sélection correcte vaut un point.
    body:
      reuse: false
      items:
        - { id: subtree, text: { en: "Git subtree", fr: "Git subtree" } }
        - { id: submodule, text: { en: "Git submodule", fr: "Sous-module Git" } }
        - { id: yamltpl, text: { en: "YAML templates referenced from a repository resource", fr: "Modèles YAML référencés depuis une ressource de dépôt" } }
        - { id: tplrepo, text: { en: "GitHub template repository", fr: "Dépôt modèle (template repository) GitHub" } }
        - { id: multicheckout, text: { en: "Multi-repo checkout in Azure Pipelines", fr: "Extraction multidépôt dans Azure Pipelines" } }
        - { id: package, text: { en: "Package in an Azure Artifacts feed", fr: "Package dans un flux Azure Artifacts" } }
      targets:
        - id: t1
          text: { en: "The web repository contains the source code of the design-tokens repository in a folder, and developers get it with a plain git clone, without any additional command.", fr: "Le dépôt web contient le code source du dépôt design-tokens dans un dossier, et les développeurs le récupèrent par un simple git clone, sans aucune commande supplémentaire." }
        - id: t2
          text: { en: "The firmware repository records a reference to one specific commit of the hal repository, without copying the files of hal into its own history.", fr: "Le dépôt firmware enregistre une référence à un commit précis du dépôt hal, sans copier les fichiers de hal dans son propre historique." }
        - id: t3
          text: { en: "Twenty Azure Pipelines YAML pipelines reuse the same deployment stages, maintained in a central pipeline-library repository and pinned to a tag.", fr: "Vingt pipelines YAML Azure Pipelines réutilisent les mêmes phases de déploiement, maintenues dans un dépôt central pipeline-library et figées sur une balise." }
        - id: t4
          text: { en: "Every new GitHub repository of the platform team starts with the same folder structure, workflow files and CODEOWNERS file.", fr: "Chaque nouveau dépôt GitHub de l'équipe plateforme démarre avec la même structure de dossiers, les mêmes fichiers de workflow et le même fichier CODEOWNERS." }
    answer:
      mapping: { t1: subtree, t2: submodule, t3: yamltpl, t4: tplrepo }
    explanation:
      correct:
        en: |
          A subtree copies the other repository's content into a folder of the host repository, so a plain clone already contains it. A submodule only records the URL and the pinned commit in `.gitmodules` and the tree, which is why consumers must run `git submodule update --init` or clone with `--recurse-submodules`. Stages shared across pipelines are YAML templates in another repository, declared under `resources.repositories` with a `ref` and referenced as `file@alias`. A GitHub template repository creates new repositories with the same files.
        fr: |
          Un subtree copie le contenu de l'autre dépôt dans un dossier du dépôt hôte : un simple clone le contient donc déjà. Un sous-module enregistre seulement l'URL et le commit figé, dans `.gitmodules` et l'arborescence, c'est pourquoi les consommateurs doivent exécuter `git submodule update --init` ou cloner avec `--recurse-submodules`. Des phases partagées entre pipelines sont des modèles YAML dans un autre dépôt, déclaré sous `resources.repositories` avec une `ref` et référencé sous la forme `file@alias`. Un dépôt modèle GitHub crée de nouveaux dépôts avec les mêmes fichiers.
      options:
        multicheckout: { en: "Multi-repo checkout downloads the source of another repository during a run; it doesn't let pipelines share stage definitions.", fr: "L'extraction multidépôt télécharge le code d'un autre dépôt pendant une exécution ; elle ne permet pas aux pipelines de partager des définitions de phases." }
        package: { en: "A package distributes a built, versioned component, not the source code in a folder of the consuming repository.", fr: "Un package distribue un composant construit et versionné, pas le code source dans un dossier du dépôt consommateur." }
    references:
      - title: Implement Scalar Cross-Repo - Training
        url: https://learn.microsoft.com/en-us/training/modules/manage-git-repositories/5-implement-scalar-cross-repo
      - title: How to use YAML templates for reusable and secure pipelines - Azure Pipelines
        url: https://learn.microsoft.com/en-us/azure/devops/pipelines/process/templates

  # ------------------------------------------------------------------ 8
  - id: az400-qz-22-08
    objective: "2.2.3"
    difficulty: 3
    status: draft
    type: dropdown
    stem:
      en: |
        Fabrikam uses an Azure DevOps organization and a GitHub Enterprise Cloud organization named **fabrikam-dev**. Jordan, a developer from the partner company Litware, joins Fabrikam's teams for three months. Jordan is already a user of the Azure DevOps organization, with the Stakeholder access level, and is a member of no Azure DevOps project group.

        - In the private Azure DevOps project **Payments**, Jordan must push branches to the Azure Repos repositories and create pull requests.
        - In fabrikam-dev, whose base permission is **Read**, Jordan must push branches and merge pull requests in the **mobile-app** repository, and must not be able to see any other repository of the organization.

        The solution must follow the principle of least privilege.

        How should you configure Jordan's access? Select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Fabrikam utilise une organisation Azure DevOps et une organisation GitHub Enterprise Cloud nommée **fabrikam-dev**. Jordan, un développeur de la société partenaire Litware, rejoint les équipes de Fabrikam pour trois mois. Jordan est déjà utilisateur de l'organisation Azure DevOps, avec le niveau d'accès Stakeholder, et n'est membre d'aucun groupe de projet Azure DevOps.

        - Dans le projet Azure DevOps privé **Payments**, Jordan doit pousser des branches vers les dépôts Azure Repos et créer des pull requests.
        - Dans fabrikam-dev, dont l'autorisation de base est **Read**, Jordan doit pousser des branches et fusionner des pull requests dans le dépôt **mobile-app**, et ne doit pouvoir voir aucun autre dépôt de l'organisation.

        La solution doit respecter le principe du moindre privilège.

        Comment devez-vous configurer l'accès de Jordan ? Sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: text
      template:
        en: |
          Azure DevOps: set Jordan's access level to [[level]] and add Jordan to the [[group]] group of Payments.
          GitHub: give Jordan access to mobile-app as [[member]] with the [[role]] repository role.
        fr: |
          Azure DevOps : définir le niveau d'accès de Jordan sur [[level]] et ajouter Jordan au groupe [[group]] de Payments.
          GitHub : donner à Jordan l'accès à mobile-app en tant que [[member]] avec le rôle de dépôt [[role]].
      slots:
        - id: level
          options:
            - { id: stake, text: Stakeholder }
            - { id: basic, text: Basic }
            - { id: basictp, text: Basic + Test Plans }
        - id: group
          options:
            - { id: readers, text: Readers }
            - { id: contributors, text: Contributors }
            - { id: buildadmins, text: Build Administrators }
            - { id: projadmins, text: Project Administrators }
        - id: member
          options:
            - { id: orgmember, text: { en: "an organization member", fr: "membre de l'organisation" } }
            - { id: outside, text: { en: "an outside collaborator", fr: "collaborateur externe" } }
            - { id: billing, text: { en: "a billing manager", fr: "gestionnaire de facturation" } }
        - id: role
          options:
            - { id: read, text: Read }
            - { id: triage, text: Triage }
            - { id: write, text: Write }
            - { id: maintain, text: Maintain }
    answer:
      values: { level: basic, group: contributors, member: outside, role: write }
    explanation:
      correct:
        en: |
          In a private project, Stakeholder access doesn't include Azure Repos: Jordan needs Basic, the cheapest level with full code access, and the Contributors group, which grants Contribute and Create branch. On GitHub, base permissions apply to every organization member, so a member would see all the repositories with Read; base permissions don't apply to outside collaborators, who get only the repositories they are added to. Write is the lowest role that lets Jordan push and merge pull requests.
        fr: |
          Dans un projet privé, l'accès Stakeholder n'inclut pas Azure Repos : Jordan a besoin de Basic, le niveau le moins cher avec un accès complet au code, et du groupe Contributors, qui accorde Contribute et Create branch. Sur GitHub, l'autorisation de base s'applique à chaque membre de l'organisation : un membre verrait donc tous les dépôts en Read ; l'autorisation de base ne s'applique pas aux collaborateurs externes, qui n'accèdent qu'aux dépôts auxquels on les ajoute. Write est le rôle le plus faible qui permet à Jordan de pousser et de fusionner des pull requests.
      options:
        stake: { en: "Stakeholder access is free but gives no access to the code of a private project.", fr: "L'accès Stakeholder est gratuit mais ne donne aucun accès au code d'un projet privé." }
        basictp: { en: "Basic + Test Plans adds Azure Test Plans, which Jordan doesn't need.", fr: "Basic + Test Plans ajoute Azure Test Plans, dont Jordan n'a pas besoin." }
        readers: { en: "Readers can clone and take part in pull requests but can't push.", fr: "Readers peut cloner et participer aux pull requests, mais ne peut pas pousser." }
        projadmins: { en: "Project Administrators can do everything in the project, far beyond what Jordan needs.", fr: "Project Administrators peut tout faire dans le projet, bien au-delà des besoins de Jordan." }
        orgmember: { en: "An organization member gets the Read base permission on every repository, so Jordan would see the other repositories.", fr: "Un membre de l'organisation reçoit l'autorisation de base Read sur tous les dépôts : Jordan verrait donc les autres dépôts." }
        triage: { en: "Triage manages issues and pull requests without write access: it can't push or merge.", fr: "Triage gère les issues et les pull requests sans accès en écriture : il ne peut ni pousser ni fusionner." }
        maintain: { en: "Maintain adds repository management that Jordan doesn't need.", fr: "Maintain ajoute la gestion du dépôt, dont Jordan n'a pas besoin." }
    references:
      - title: Configure Repository Permissions Using GitHub - Training
        url: https://learn.microsoft.com/en-us/training/modules/manage-git-repositories/12-configure-source-control-repository-permissions-use-github
      - title: About access levels - Azure DevOps
        url: https://learn.microsoft.com/en-us/azure/devops/organizations/security/access-levels

  # ------------------------------------------------------------------ 9
  - id: az400-qz-22-09
    objective: "2.2.5"
    difficulty: 3
    status: draft
    type: ordering
    stem:
      en: |
        A developer at Northwind works in a local clone of a GitHub repository. By mistake, the developer made three commits on the local **main** branch instead of on a new feature branch. None of the commits has been pushed, `origin/main` is up to date, and the working tree is clean.

        You need to meet the following requirements:

        - The three commits are kept on a new branch named **feature/export**.
        - The local main branch points to the same commit as `origin/main`.
        - At the end, feature/export is checked out.
        - No new commit is created.

        Which three commands should you run in sequence? To answer, move the appropriate commands from the list of commands to the answer area and arrange them in the correct order.
      fr: |
        Un développeur de Northwind travaille dans un clone local d'un dépôt GitHub. Par erreur, il a créé trois commits sur la branche locale **main** au lieu d'une nouvelle branche de fonctionnalité. Aucun des commits n'a été poussé, `origin/main` est à jour et l'arborescence de travail est propre.

        Vous devez répondre aux exigences suivantes :

        - Les trois commits sont conservés sur une nouvelle branche nommée **feature/export**.
        - La branche locale main pointe vers le même commit qu'`origin/main`.
        - À la fin, feature/export est extraite.
        - Aucun nouveau commit n'est créé.

        Quelles sont les trois commandes à exécuter dans l'ordre ? Pour répondre, déplacez les commandes appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
    body:
      count: 3
      actions:
        - { id: switch, text: "git switch feature/export" }
        - { id: revert, text: "git revert --no-edit HEAD~3..HEAD" }
        - { id: branch, text: "git branch feature/export" }
        - { id: pushf, text: "git push --force origin main" }
        - { id: reset, text: "git reset --hard origin/main" }
        - { id: newfrom, text: "git switch -c feature/export origin/main" }
    answer:
      sequence: [branch, reset, switch]
    explanation:
      correct:
        en: |
          `git branch feature/export` creates the branch at the current commit of main, so it keeps the three commits. Still on main, `git reset --hard origin/main` moves main back to the remote commit; this is safe because the commits are unpushed, the working tree is clean and feature/export still references them. `git switch feature/export` then checks out the new branch. Switching before the reset would move feature/export instead of main.
        fr: |
          `git branch feature/export` crée la branche sur le commit actuel de main : elle conserve donc les trois commits. Toujours sur main, `git reset --hard origin/main` ramène main sur le commit distant ; c'est sans risque car les commits ne sont pas poussés, l'arborescence de travail est propre et feature/export les référence encore. `git switch feature/export` extrait ensuite la nouvelle branche. Changer de branche avant la réinitialisation déplacerait feature/export au lieu de main.
      options:
        revert: { en: "A revert creates new commits that reverse the three commits, which the requirements forbid.", fr: "Un revert crée de nouveaux commits qui inversent les trois commits, ce que les exigences interdisent." }
        pushf: { en: "Nothing has to change on the remote: origin/main is already correct, and the commits were never pushed.", fr: "Rien ne doit changer sur le dépôt distant : origin/main est déjà correct, et les commits n'ont jamais été poussés." }
        newfrom: { en: "This creates feature/export at origin/main, without the three commits.", fr: "Cette commande crée feature/export sur origin/main, sans les trois commits." }
    references:
      - title: Undo changes in your Git repo - Azure Repos
        url: https://learn.microsoft.com/en-us/azure/devops/repos/git/undo
      - title: Recover Specific Data Using Git Commands - Training
        url: https://learn.microsoft.com/en-us/training/modules/manage-git-repositories/6-recover-specific-data-git-commands

  # ------------------------------------------------------------------ 10
  - id: az400-qz-22-10
    objective: "2.2.1"
    difficulty: 3
    status: draft
    type: dropdown
    stem:
      en: |
        Tailspin has a GitHub repository named **atlas** with 40 branches and no tags. For years, artists committed `.psd` and `.fbx` files directly to Git, and each clone now downloads every old version of these files. Developers use HTTPS remotes and have the Git LFS client installed. No branch protection rule or ruleset applies to atlas.

        The team has stopped pushing to atlas. You have a local clone in which each of the 40 branches exists as a local branch.

        You need to convert the `.psd` and `.fbx` files in the history of every branch to Git LFS, make Git LFS track the future files of these types, and publish all the converted branches to GitHub.

        How should you complete the commands? Select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Tailspin dispose d'un dépôt GitHub nommé **atlas** avec 40 branches et aucune balise. Pendant des années, les graphistes ont validé des fichiers `.psd` et `.fbx` directement dans Git, et chaque clone télécharge désormais toutes les anciennes versions de ces fichiers. Les développeurs utilisent des dépôts distants HTTPS et ont installé le client Git LFS. Aucune règle de protection de branche ni aucun ruleset ne s'applique à atlas.

        L'équipe a cessé de pousser vers atlas. Vous disposez d'un clone local dans lequel chacune des 40 branches existe en tant que branche locale.

        Vous devez convertir vers Git LFS les fichiers `.psd` et `.fbx` de l'historique de chaque branche, faire suivre par Git LFS les futurs fichiers de ces types, et publier toutes les branches converties sur GitHub.

        Comment devez-vous compléter les commandes ? Sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: code
      language: bash
      template: |
        git lfs [[cmd]] --include="*.psd,*.fbx" [[scope]]
        git push [[push]] origin
      slots:
        - id: cmd
          options:
            - { id: track, text: track }
            - { id: import, text: migrate import }
            - { id: export, text: migrate export }
            - { id: install, text: install }
        - id: scope
          options:
            - { id: everything, text: "--everything" }
            - { id: mainref, text: "--include-ref=refs/heads/main" }
            - { id: norewrite, text: "--no-rewrite" }
            - { id: skipfetch, text: "--skip-fetch" }
        - id: push
          options:
            - { id: all, text: "--all" }
            - { id: forceall, text: "--force --all" }
            - { id: forcetags, text: "--force --tags" }
            - { id: followtags, text: "--follow-tags" }
    answer:
      values: { cmd: import, scope: everything, push: forceall }
    explanation:
      correct:
        en: |
          `git lfs migrate import` rewrites the history so that the matching files become LFS pointers, and adds the patterns to `.gitattributes`, so future files are tracked too. `--everything` extends the rewrite to the commits reachable from all the local and remote references instead of the current branch only. Because every commit hash changes, the branches must be published with a force push, and `--all` pushes all the local branches at once.
        fr: |
          `git lfs migrate import` réécrit l'historique pour que les fichiers correspondants deviennent des pointeurs LFS, et ajoute les modèles à `.gitattributes` : les futurs fichiers sont donc suivis eux aussi. `--everything` étend la réécriture aux commits accessibles depuis toutes les références locales et distantes, au lieu de la seule branche actuelle. Comme tous les hachages de commits changent, les branches doivent être publiées par un push forcé, et `--all` pousse toutes les branches locales d'un coup.
      options:
        track: { en: "`git lfs track` only affects files added from now on; the old versions stay in the history.", fr: "`git lfs track` n'agit que sur les fichiers ajoutés à partir de maintenant ; les anciennes versions restent dans l'historique." }
        export: { en: "`migrate export` does the opposite: it converts LFS objects back into regular Git objects.", fr: "`migrate export` fait l'inverse : il reconvertit les objets LFS en objets Git ordinaires." }
        mainref: { en: "Limiting the rewrite to main leaves the binaries in the history of the 39 other branches.", fr: "Limiter la réécriture à main laisse les binaires dans l'historique des 39 autres branches." }
        norewrite: { en: "`--no-rewrite` converts the files in a new commit on the current branch only, and leaves the old versions in the history.", fr: "`--no-rewrite` convertit les fichiers dans un nouveau commit de la seule branche actuelle, et laisse les anciennes versions dans l'historique." }
        all: { en: "Without --force, GitHub rejects the rewritten branches because they aren't fast-forwards of the remote branches.", fr: "Sans --force, GitHub rejette les branches réécrites, car elles ne sont pas des avances rapides des branches distantes." }
        forcetags: { en: "The repository has no tags; --tags wouldn't push any of the rewritten branches.", fr: "Le dépôt n'a aucune balise ; --tags ne pousserait aucune des branches réécrites." }
    references:
      - title: Manage and Store Large Files in Git - Azure Repos
        url: https://learn.microsoft.com/en-us/azure/devops/repos/git/manage-large-files
