chapter: 21-branching
questions:
  # ------------------------------------------------------------------ 1
  - id: az400-qz-21-01
    objective: "2.1.3"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Fabrikam hosts a product in a GitHub repository owned by an organization. Version 1 is no longer supported, and its branch `release/1.x` must become read-only: nobody can add commits to it, but the branch and its history stay available. The other branches of the repository must remain writable.

        What should you configure?
      fr: |
        Fabrikam héberge un produit dans un dépôt GitHub appartenant à une organisation. La version 1 n'est plus prise en charge, et sa branche `release/1.x` doit passer en lecture seule : personne ne peut y ajouter de commits, mais la branche et son historique restent disponibles. Les autres branches du dépôt doivent rester modifiables.

        Que devez-vous configurer ?
    body:
      options:
        - { id: a, text: { en: "A branch protection rule for `release/1.x` with **Require linear history**", fr: "Une règle de protection de branche pour `release/1.x` avec **Require linear history**" } }
        - { id: b, text: { en: "A branch protection rule for `release/1.x` with **Lock branch**", fr: "Une règle de protection de branche pour `release/1.x` avec **Lock branch**" } }
        - { id: c, text: { en: "A branch protection rule for `release/1.x` with **Require a pull request before merging**", fr: "Une règle de protection de branche pour `release/1.x` avec **Require a pull request before merging**" } }
        - { id: d, text: { en: "The **Archive this repository** option in the settings of the repository", fr: "L'option **Archive this repository** dans les paramètres du dépôt" } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          **Lock branch** makes the matching branch read-only, so no commits can be made to it, while the branch and its history remain. Because it is a setting of a branch protection rule, it applies only to `release/1.x`, and the other branches stay writable.
        fr: |
          **Lock branch** fait passer la branche correspondante en lecture seule : aucun commit ne peut y être ajouté, tandis que la branche et son historique demeurent. Comme c'est un paramètre d'une règle de protection de branche, il ne s'applique qu'à `release/1.x`, et les autres branches restent modifiables.
      options:
        a: { en: "Require linear history only blocks merge commits; squashed or rebased commits can still be added.", fr: "Require linear history bloque seulement les commits de fusion ; des commits squash ou rebasés peuvent encore être ajoutés." }
        c: { en: "Requiring a pull request still lets changes reach the branch once a pull request is approved.", fr: "Exiger une pull request laisse encore les changements arriver dans la branche une fois la pull request approuvée." }
        d: { en: "Archiving makes the whole repository read-only, including the branches that must remain writable.", fr: "L'archivage fait passer tout le dépôt en lecture seule, y compris les branches qui doivent rester modifiables." }
    references:
      - title: Implement branch merging restrictions
        url: https://learn.microsoft.com/en-us/training/modules/manage-git-branches-workflows/7-implement-branch-merging-restrictions

  # ------------------------------------------------------------------ 2
  - id: az400-qz-21-02
    objective: "2.1.2"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Litware has an Azure Repos repository named **Ledger**. An **Automatically included reviewers** policy on `main` adds two groups as **Required** reviewers to every pull request: **DBA Reviewers** (five members) and **Security Reviewers** (four members).

        Which approvals must a pull request into `main` receive to satisfy this policy?
      fr: |
        Litware dispose d'un dépôt Azure Repos nommé **Ledger**. Une stratégie **Automatically included reviewers** sur `main` ajoute deux groupes comme réviseurs **obligatoires (Required)** à chaque pull request : **DBA Reviewers** (cinq membres) et **Security Reviewers** (quatre membres).

        Quelles approbations une pull request vers `main` doit-elle recevoir pour satisfaire cette stratégie ?
    body:
      options:
        - { id: a, text: { en: "The approval of one member of either group", fr: "L'approbation d'un membre de l'un ou l'autre groupe" } }
        - { id: b, text: { en: "The approvals of a majority of the members of each group", fr: "Les approbations d'une majorité des membres de chaque groupe" } }
        - { id: c, text: { en: "The approvals of all the members of both groups", fr: "Les approbations de tous les membres des deux groupes" } }
        - { id: d, text: { en: "The approval of at least one member of each group", fr: "L'approbation d'au moins un membre de chaque groupe" } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          When groups are added as required reviewers, the pull request can't be completed until at least one person in every group added as a reviewer approves. One DBA reviewer and one security reviewer are therefore enough; individual users added as required reviewers would each have to approve.
        fr: |
          Quand des groupes sont ajoutés comme réviseurs obligatoires, la pull request ne peut pas être terminée tant qu'au moins une personne de chaque groupe ajouté comme réviseur n'a pas approuvé. Un réviseur DBA et un réviseur de sécurité suffisent donc ; des utilisateurs ajoutés individuellement comme réviseurs obligatoires devraient chacun approuver.
      options:
        a: { en: "Each required group must be satisfied: one approval in one group leaves the other group pending.", fr: "Chaque groupe obligatoire doit être satisfait : une approbation dans un seul groupe laisse l'autre groupe en attente." }
        b: { en: "The policy has no majority rule; one approving member per group satisfies it.", fr: "La stratégie n'a pas de règle de majorité ; un membre approbateur par groupe la satisfait." }
        c: { en: "Every member must approve only for individuals added as reviewers, not for members of a group.", fr: "Chaque membre ne doit approuver que pour les personnes ajoutées individuellement comme réviseurs, pas pour les membres d'un groupe." }
    references:
      - title: Set and manage branch policies
        url: https://learn.microsoft.com/en-us/azure/devops/repos/git/branch-policies

  # ------------------------------------------------------------------ 3
  - id: az400-qz-21-03
    objective: "2.1.1"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Wingtip Toys deploys a web application continuously by using Azure Pipelines and an Azure Repos repository. The repository has three long-lived branches named `dev`, `test` and `prod`. Changes are promoted by merging `dev` into `test`, then `test` into `prod`, and each environment is deployed from a build of its own branch.

        The branches keep drifting apart, fixes made in `prod` are often missing from `dev`, and the promotion merges cause conflicts. You need to adopt the approach that Microsoft recommends for continuous deployment.

        What should the team do?
      fr: |
        Wingtip Toys déploie une application web en continu avec Azure Pipelines et un dépôt Azure Repos. Le dépôt contient trois branches durables nommées `dev`, `test` et `prod`. Les changements sont promus en fusionnant `dev` dans `test`, puis `test` dans `prod`, et chaque environnement est déployé à partir d'un build de sa propre branche.

        Les branches divergent sans cesse, des correctifs faits dans `prod` manquent souvent dans `dev`, et les fusions de promotion provoquent des conflits. Vous devez adopter l'approche que Microsoft recommande pour le déploiement continu.

        Que doit faire l'équipe ?
    body:
      options:
        - { id: a, text: { en: "Keep the three branches, and promote each change by cherry-picking it from `dev` into `test` and `prod`.", fr: "Conserver les trois branches, et promouvoir chaque changement en le sélectionnant (cherry-pick) de `dev` vers `test` et `prod`." } }
        - { id: b, text: { en: "Keep the three branches, and add a required Build validation policy to each of them.", fr: "Conserver les trois branches, et ajouter une stratégie Build validation obligatoire à chacune d'elles." } }
        - { id: c, text: { en: "Work in `main` through pull requests, and have a pipeline promote one build of `main` through the stages.", fr: "Travailler dans `main` par pull requests, et faire promouvoir par un pipeline un même build de `main` à travers les étapes." } }
        - { id: d, text: { en: "Cut a branch from `main` for each environment, and merge it back into `main` after each deployment.", fr: "Créer une branche depuis `main` pour chaque environnement, et la refusionner dans `main` après chaque déploiement." } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          Microsoft's branching guidance treats deployment branches like release branches, with one exception: for continuous deployment, it recommends Azure Pipelines to promote builds from `main` to the deployment targets. Feature branches merged into `main` by pull request keep one source of truth, and promoting the same build through the dev, test and prod stages removes the drift and the promotion merges.
        fr: |
          Les recommandations de branchement de Microsoft traitent les branches de déploiement comme des branches de mise en production, à une exception près : pour le déploiement continu, elles recommandent Azure Pipelines pour promouvoir les builds de `main` vers les cibles de déploiement. Des branches de fonctionnalité fusionnées dans `main` par pull request gardent une seule source de vérité, et promouvoir un même build à travers les étapes dev, test et prod supprime la divergence et les fusions de promotion.
      options:
        a: { en: "Cherry-picking every change into two more branches multiplies the work and keeps three versions of the code that can still drift.", fr: "Sélectionner chaque changement vers deux autres branches multiplie le travail et conserve trois versions du code qui peuvent encore diverger." }
        b: { en: "Build validation checks pull requests into each branch but keeps the long-lived environment branches and their drift.", fr: "La validation de build contrôle les pull requests vers chaque branche, mais conserve les branches d'environnement durables et leur divergence." }
        d: { en: "Long-lived release or deployment branches are never merged back into `main`; fixes are cherry-picked instead.", fr: "Les branches durables de mise en production ou de déploiement ne sont jamais refusionnées dans `main` ; les correctifs sont sélectionnés (cherry-pick) à la place." }
    references:
      - title: Adopt a Git branching strategy
        url: https://learn.microsoft.com/en-us/azure/devops/repos/git/git-branching-guidance

  # ------------------------------------------------------------------ 4
  - id: az400-qz-21-04
    objective: "2.1.2"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Tailspin Toys hosts its infrastructure code in a GitHub repository. The branch protection rule of `main` requires a pull request with **Require review from Code Owners** enabled. The three teams below have the Write role on the repository. The `main` branch contains the following `.github/CODEOWNERS` file.

        ```text
        *                 @tailspin/app-team
        /infra/network/   @tailspin/network-team
        *.bicep           @tailspin/platform-team
        ```

        A pull request into `main` changes only the file `infra/network/hub.bicep`.

        Whose approval does the rule require before the pull request can be merged?
      fr: |
        Tailspin Toys héberge son code d'infrastructure dans un dépôt GitHub. La règle de protection de branche de `main` exige une pull request avec **Require review from Code Owners** activé. Les trois équipes ci-dessous ont le rôle Write sur le dépôt. La branche `main` contient le fichier `.github/CODEOWNERS` suivant.

        ```text
        *                 @tailspin/app-team
        /infra/network/   @tailspin/network-team
        *.bicep           @tailspin/platform-team
        ```

        Une pull request vers `main` ne modifie que le fichier `infra/network/hub.bicep`.

        L'approbation de qui la règle exige-t-elle avant que la pull request puisse être fusionnée ?
    body:
      options:
        - { id: a, text: { en: "A member of network-team", fr: "Un membre de network-team" } }
        - { id: b, text: { en: "A member of platform-team", fr: "Un membre de platform-team" } }
        - { id: c, text: { en: "A member of network-team and a member of platform-team", fr: "Un membre de network-team et un membre de platform-team" } }
        - { id: d, text: { en: "A member of each of the three teams", fr: "Un membre de chacune des trois équipes" } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          When several patterns of a CODEOWNERS file match a file, the last matching pattern takes the most precedence. The three lines match `infra/network/hub.bicep`, and `*.bicep` comes last, so platform-team owns the file and one approval from one of its members satisfies the code owner review.
        fr: |
          Quand plusieurs modèles d'un fichier CODEOWNERS correspondent à un fichier, le dernier modèle correspondant l'emporte. Les trois lignes correspondent à `infra/network/hub.bicep`, et `*.bicep` vient en dernier : platform-team est donc propriétaire du fichier, et l'approbation d'un de ses membres satisfait la revue des propriétaires de code.
      options:
        a: { en: "The most specific path doesn't win: `*.bicep`, the last matching pattern, overrides `/infra/network/`.", fr: "Le chemin le plus précis ne l'emporte pas : `*.bicep`, le dernier modèle correspondant, remplace `/infra/network/`." }
        c: { en: "Matching patterns don't add up; only the last matching pattern assigns the owners of a file.", fr: "Les modèles correspondants ne s'additionnent pas ; seul le dernier modèle correspondant désigne les propriétaires d'un fichier." }
        d: { en: "The `*` line is overridden by the later lines; owners of earlier matching patterns aren't required.", fr: "La ligne `*` est remplacée par les lignes suivantes ; les propriétaires des modèles correspondants antérieurs ne sont pas requis." }
    references:
      - title: Enforce governance with GitHub controls
        url: https://learn.microsoft.com/en-us/training/modules/governance-guardrails-operations/3-enforce-governance-github-controls

  # ------------------------------------------------------------------ 5
  - id: az400-qz-21-05
    objective: "2.1.3"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Adatum Corporation has an Azure Repos repository named **Claims**. Pull requests into `main` usually contain several commits.

        The team wants the history of `main` to keep every individual commit of each pull request, in a straight sequence after the latest commit of `main`, and to end each pull request with a commit that has two parents.

        Which merge type should the **Limit merge types** policy of `main` allow?
      fr: |
        Adatum Corporation dispose d'un dépôt Azure Repos nommé **Claims**. Les pull requests vers `main` contiennent généralement plusieurs commits.

        L'équipe veut que l'historique de `main` conserve chaque commit individuel de chaque pull request, en une séquence droite après le dernier commit de `main`, et termine chaque pull request par un commit qui a deux parents.

        Quel type de fusion la stratégie **Limit merge types** de `main` doit-elle autoriser ?
    body:
      options:
        - { id: a, text: Basic merge (no fast-forward) }
        - { id: b, text: Squash merge }
        - { id: c, text: Rebase and fast-forward }
        - { id: d, text: Rebase with merge commit }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          **Rebase with merge commit** replays the source commits onto the target branch and also creates a merge commit, which gives a semi-linear history: the individual commits are kept in sequence after the latest `main`, and each pull request ends with a visible merge.
        fr: |
          **Rebase with merge commit** rejoue les commits source sur la branche cible et crée aussi un commit de fusion, ce qui donne un historique semi-linéaire : les commits individuels sont conservés à la suite de la dernière version de `main`, et chaque pull request se termine par une fusion visible.
      options:
        a: { en: "Basic merge keeps the commits and adds a merge commit, but it doesn't replay them on top of the latest `main`.", fr: "Basic merge conserve les commits et ajoute un commit de fusion, mais ne les rejoue pas au-dessus de la dernière version de `main`." }
        b: { en: "Squash merge condenses each pull request into a single commit, so the individual commits are lost.", fr: "Squash merge condense chaque pull request en un seul commit : les commits individuels sont perdus." }
        c: { en: "Rebase and fast-forward replays the commits but creates no merge commit, so the end of each pull request isn't marked.", fr: "Rebase and fast-forward rejoue les commits mais ne crée aucun commit de fusion : la fin de chaque pull request n'est pas marquée." }
    references:
      - title: Set and manage branch policies
        url: https://learn.microsoft.com/en-us/azure/devops/repos/git/branch-policies

  # ------------------------------------------------------------------ 6
  - id: az400-qz-21-06
    objective: "2.1.2"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Contoso, Ltd. has an Azure DevOps project that contains 38 Azure Repos Git repositories. Most of them use `main` as their default branch, nine legacy repositories use `master`, and two repositories use `Main`. Teams create new repositories in the project every month, with the default branch name they prefer.

        You need every pull request into the default branch of every current and future repository of the project to require two approvals. Branch names must not change. The solution must minimize administrative effort.

        What should you do?
      fr: |
        Contoso, Ltd. dispose d'un projet Azure DevOps qui contient 38 dépôts Git Azure Repos. La plupart utilisent `main` comme branche par défaut, neuf dépôts hérités utilisent `master`, et deux dépôts utilisent `Main`. Les équipes créent chaque mois de nouveaux dépôts dans le projet, avec le nom de branche par défaut qu'elles préfèrent.

        Vous devez faire en sorte que toute pull request vers la branche par défaut de chaque dépôt actuel et futur du projet exige deux approbations. Les noms des branches ne doivent pas changer. La solution doit réduire au minimum l'effort administratif.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Add a cross-repo policy that protects current and future branches matching `main`, with two minimum reviewers.", fr: "Ajouter une stratégie inter-dépôts qui protège les branches actuelles et futures correspondant à `main`, avec deux réviseurs au minimum." } }
        - { id: b, text: { en: "Run `az repos policy approver-count create` for the default branch of each repository, and repeat it for each new one.", fr: "Exécuter `az repos policy approver-count create` pour la branche par défaut de chaque dépôt, et le répéter pour chaque nouveau dépôt." } }
        - { id: c, text: { en: "Add a cross-repo policy that protects the default branch of each repository, with two minimum reviewers.", fr: "Ajouter une stratégie inter-dépôts qui protège la branche par défaut de chaque dépôt, avec deux réviseurs au minimum." } }
        - { id: d, text: { en: "Add three cross-repo policies for the patterns `main`, `master` and `Main`, each with two minimum reviewers.", fr: "Ajouter trois stratégies inter-dépôts pour les modèles `main`, `master` et `Main`, chacune avec deux réviseurs au minimum." } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          In **Project settings > Repositories > Policies**, a cross-repo branch policy can target **the default branch of each repository**, whatever its name, across all the repositories of the project, including the ones created later. One policy with a minimum of two reviewers therefore covers the 38 repositories and every new one, without renaming any branch.
        fr: |
          Dans **Project settings > Repositories > Policies**, une stratégie de branche inter-dépôts peut cibler **la branche par défaut de chaque dépôt**, quel que soit son nom, dans tous les dépôts du projet, y compris ceux créés plus tard. Une seule stratégie avec un minimum de deux réviseurs couvre donc les 38 dépôts et chaque nouveau dépôt, sans renommer aucune branche.
      options:
        a: { en: "The pattern is case sensitive and matches a name, so `master`, `Main` and other names chosen for new repositories aren't protected.", fr: "Le modèle est sensible à la casse et correspond à un nom : `master`, `Main` et les autres noms choisis pour les nouveaux dépôts ne sont pas protégés." }
        b: { en: "Per-repository policies work, but they must be created again for every new repository, which doesn't minimize effort.", fr: "Des stratégies par dépôt fonctionnent, mais elles doivent être recréées pour chaque nouveau dépôt, ce qui ne réduit pas l'effort au minimum." }
        d: { en: "Three patterns cover today's names but not a different name chosen by a team for a future repository, and they add policies to maintain.", fr: "Trois modèles couvrent les noms actuels, mais pas un autre nom choisi par une équipe pour un futur dépôt, et ils ajoutent des stratégies à maintenir." }
    references:
      - title: Set Git repository settings and policies
        url: https://learn.microsoft.com/en-us/azure/devops/repos/git/repository-settings

  # ------------------------------------------------------------------ 7
  - id: az400-qz-21-07
    objective: "2.1.1"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        Proseware, Inc. sells a product in two editions from one Azure Repos repository:

        - A SaaS edition, deployed from `main` to production several times a day.
        - An on-premises edition, released quarterly as versions such as 2026.3 and 2026.4. Each version is supported for 18 months and receives only security fixes.

        The team uses Git Flow today: a long-lived `develop` branch, feature branches that live for weeks, and release branches merged into both `develop` and `main`. The merges are large and frequently conflict.

        You need to redesign the branch strategy by following Microsoft's guidance. The solution must meet the following requirements:

        - Integrate changes continuously and minimize merge conflicts.
        - Unfinished features can reach `main` but stay invisible to SaaS customers.
        - Each supported on-premises version can receive security fixes without receiving new features.

        Which two actions should you perform? Each correct answer presents part of the solution.

        NOTE: Each correct selection is worth one point.
      fr: |
        Proseware, Inc. vend un produit en deux éditions à partir d'un seul dépôt Azure Repos :

        - Une édition SaaS, déployée depuis `main` en production plusieurs fois par jour.
        - Une édition locale, publiée chaque trimestre sous des versions comme 2026.3 et 2026.4. Chaque version est prise en charge pendant 18 mois et ne reçoit que des correctifs de sécurité.

        L'équipe utilise aujourd'hui Git Flow : une branche `develop` durable, des branches de fonctionnalité qui vivent des semaines, et des branches de mise en production fusionnées à la fois dans `develop` et dans `main`. Les fusions sont volumineuses et provoquent souvent des conflits.

        Vous devez revoir la stratégie de branche en suivant les recommandations de Microsoft. La solution doit répondre aux exigences suivantes :

        - Intégrer les changements en continu et réduire au minimum les conflits de fusion.
        - Les fonctionnalités inachevées peuvent arriver dans `main` mais restent invisibles pour les clients SaaS.
        - Chaque version locale prise en charge peut recevoir des correctifs de sécurité sans recevoir de nouvelles fonctionnalités.

        Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "Keep `develop` as the integration branch, and merge it into `main` at the end of each quarter.", fr: "Conserver `develop` comme branche d'intégration, et la fusionner dans `main` à la fin de chaque trimestre." } }
        - { id: b, text: { en: "Merge work into `main` at least daily through short-lived branches, and hide unfinished features behind feature flags.", fr: "Fusionner le travail dans `main` au moins une fois par jour par des branches de courte durée, et masquer les fonctionnalités inachevées derrière des indicateurs de fonctionnalité." } }
        - { id: c, text: { en: "Create one long-lived branch per environment, and promote changes by merging each branch into the next one.", fr: "Créer une branche durable par environnement, et promouvoir les changements en fusionnant chaque branche dans la suivante." } }
        - { id: d, text: { en: "Mark each on-premises version with a tag only, and move the tag to a newer commit of `main` when a fix is needed.", fr: "Marquer chaque version locale uniquement par une balise, et déplacer la balise vers un commit plus récent de `main` quand un correctif est nécessaire." } }
        - { id: e, text: { en: "Create a release branch from `main` for each on-premises version, keep it while the version is supported, then lock it.", fr: "Créer une branche de mise en production depuis `main` pour chaque version locale, la conserver tant que la version est prise en charge, puis la verrouiller." } }
    answer: { optionIds: [b, e] }
    explanation:
      correct:
        en: |
          Short-lived branches merged into `main` at least daily keep integration continuous and merges small, and feature flags decouple deployment from exposure, so unfinished code can ship in the SaaS edition while staying hidden. A release branch cut from `main` freezes the feature set of each on-premises version; fixes are cherry-picked into it while the version is supported, and the branch is locked when support ends.
        fr: |
          Des branches de courte durée fusionnées dans `main` au moins une fois par jour gardent une intégration continue et des fusions petites, et les indicateurs de fonctionnalité découplent le déploiement de l'exposition : le code inachevé peut être livré dans l'édition SaaS tout en restant masqué. Une branche de mise en production créée depuis `main` fige l'ensemble des fonctionnalités de chaque version locale ; les correctifs y sont sélectionnés (cherry-pick) tant que la version est prise en charge, et la branche est verrouillée à la fin de la prise en charge.
      options:
        a: { en: "A long-lived `develop` branch merged once a quarter keeps the large, conflicting merges that the team must eliminate.", fr: "Une branche `develop` durable fusionnée une fois par trimestre conserve les fusions volumineuses et conflictuelles que l'équipe doit éliminer." }
        c: { en: "Environment branches drift apart and add promotion merges; for continuous deployment, a pipeline promotes builds of `main` instead.", fr: "Les branches d'environnement divergent et ajoutent des fusions de promotion ; pour le déploiement continu, un pipeline promeut plutôt les builds de `main`." }
        d: { en: "Moving a tag to a newer commit of `main` brings every new feature into the on-premises version, and tags are easy to forget or misplace.", fr: "Déplacer une balise vers un commit plus récent de `main` apporte toutes les nouvelles fonctionnalités à la version locale, et les balises sont faciles à oublier ou à mal placer." }
    references:
      - title: Adopt a Git branching strategy
        url: https://learn.microsoft.com/en-us/azure/devops/repos/git/git-branching-guidance
      - title: How Microsoft develops with DevOps
        url: https://learn.microsoft.com/en-us/devops/develop/how-microsoft-develops-devops

  # ------------------------------------------------------------------ 8
  - id: az400-qz-21-08
    objective: "2.1.2"
    difficulty: 3
    status: draft
    type: dropdown
    stem:
      en: |
        Litware, Inc. uses GitHub Enterprise Cloud. A private repository of the organization receives about 60 pull requests into `main` every day. A workflow named **ci** contains a job named `build` that runs on the `pull_request` event, and `build` is a required status check of the branch protection rule of `main`.

        You need to meet the following requirements:

        - Approved pull requests are merged one after the other, each one tested with the latest `main` plus the pull requests queued ahead of it.
        - The `build` check reports a result for the pull requests in that process.
        - A pull request can't be merged on the approval of the person who pushed its latest commits.

        How should you complete the configuration? Select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Litware, Inc. utilise GitHub Enterprise Cloud. Un dépôt privé de l'organisation reçoit environ 60 pull requests vers `main` chaque jour. Un workflow nommé **ci** contient un job nommé `build` qui s'exécute sur l'événement `pull_request`, et `build` est une vérification d'état obligatoire de la règle de protection de branche de `main`.

        Vous devez répondre aux exigences suivantes :

        - Les pull requests approuvées sont fusionnées l'une après l'autre, chacune testée avec la dernière version de `main` plus les pull requests placées avant elle dans la file.
        - La vérification `build` publie un résultat pour les pull requests de ce processus.
        - Une pull request ne peut pas être fusionnée sur l'approbation de la personne qui a poussé ses derniers commits.

        Comment devez-vous compléter la configuration ? Sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: text
      template:
        en: |
          Setting to enable in the branch protection rule of main: [[queue]]
          Event to add to the triggers of the ci workflow: [[event]]
          Setting to enable for the approval requirement: [[approval]]
        fr: |
          Paramètre à activer dans la règle de protection de branche de main : [[queue]]
          Événement à ajouter aux déclencheurs du workflow ci : [[event]]
          Paramètre à activer pour l'exigence d'approbation : [[approval]]
      slots:
        - id: queue
          options:
            - { id: uptodate, text: Require branches to be up to date before merging }
            - { id: mq, text: Require merge queue }
            - { id: linear, text: Require linear history }
            - { id: deploy, text: Require deployments to succeed before merging }
        - id: event
          options:
            - { id: push, text: push }
            - { id: prtarget, text: pull_request_target }
            - { id: mergegroup, text: merge_group }
            - { id: workflowrun, text: workflow_run }
        - id: approval
          options:
            - { id: stale, text: Dismiss stale pull request approvals when new commits are pushed }
            - { id: owners, text: Require review from Code Owners }
            - { id: nobypass, text: Do not allow bypassing the above settings }
            - { id: lastpush, text: Require approval of the most recent reviewable push }
    answer:
      values: { queue: mq, event: mergegroup, approval: lastpush }
    explanation:
      correct:
        en: |
          A merge queue groups each queued pull request with the latest `main` and the pull requests ahead of it on a temporary branch, and merges it only after the required checks pass; it is available for private repositories of organizations on GitHub Enterprise Cloud. A GitHub Actions workflow that provides a required check must also be triggered by `merge_group`, or the check never reports in the queue. **Require approval of the most recent reviewable push** requires someone other than the last pusher to approve.
        fr: |
          Une file d'attente de fusion regroupe chaque pull request de la file avec la dernière version de `main` et les pull requests placées avant elle sur une branche temporaire, et ne la fusionne qu'une fois les vérifications obligatoires réussies ; elle est disponible pour les dépôts privés des organisations sur GitHub Enterprise Cloud. Un workflow GitHub Actions qui fournit une vérification obligatoire doit aussi être déclenché par `merge_group`, sinon la vérification ne publie jamais de résultat dans la file. **Require approval of the most recent reviewable push** exige qu'une autre personne que le dernier à avoir poussé approuve.
      options:
        uptodate: { en: "Strict status checks make each author update the branch and rerun the checks; they don't queue pull requests or test them with the ones ahead.", fr: "Les vérifications d'état strictes obligent chaque auteur à mettre à jour sa branche et à relancer les vérifications ; elles ne mettent pas les pull requests en file et ne les testent pas avec celles qui précèdent." }
        push: { en: "The queue's temporary branches are tested through the `merge_group` event; GitHub requires it for Actions workflows that report required checks.", fr: "Les branches temporaires de la file sont testées via l'événement `merge_group` ; GitHub l'exige pour les workflows Actions qui publient des vérifications obligatoires." }
        stale: { en: "Dismissing stale approvals forces a new review after new commits, but the person who pushed them could still give that approval.", fr: "Rejeter les approbations obsolètes impose une nouvelle revue après de nouveaux commits, mais la personne qui les a poussés pourrait encore donner cette approbation." }
        nobypass: { en: "This setting applies the rule to administrators; it doesn't decide who may approve the latest push.", fr: "Ce paramètre applique la règle aux administrateurs ; il ne détermine pas qui peut approuver le dernier push." }
    references:
      - title: Branch protections rules and review requirements
        url: https://learn.microsoft.com/en-us/training/modules/github-enterprise-server-repository-workflows/3-branch-protection-rules

  # ------------------------------------------------------------------ 9
  - id: az400-qz-21-09
    objective: "2.1.3"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        Northwind Traders has an Azure Repos repository named **Freight**. The `main` branch has the following required policies: **Require a minimum number of reviewers** set to 2, and **Build validation** with a YAML pipeline. No permission was changed from its default value, except the following ones on `main`:

        | User | Permission | Value |
        | --- | --- | --- |
        | Ines | Bypass policies when completing pull requests | Allow |
        | Paul | Bypass policies when pushing | Allow |

        Marc is a member of the Project Administrators group and holds no other permission.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Northwind Traders dispose d'un dépôt Azure Repos nommé **Freight**. La branche `main` a les stratégies obligatoires suivantes : **Require a minimum number of reviewers** défini sur 2, et **Build validation** avec un pipeline YAML. Aucune autorisation n'a été modifiée par rapport à sa valeur par défaut, à l'exception des suivantes sur `main` :

        | Utilisateur | Autorisation | Valeur |
        | --- | --- | --- |
        | Ines | Bypass policies when completing pull requests | Allow |
        | Paul | Bypass policies when pushing | Allow |

        Marc est membre du groupe Project Administrators et ne détient aucune autre autorisation.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text: { en: "Marc can complete a pull request into `main` whose required build validation failed.", fr: "Marc peut terminer une pull request vers `main` dont la validation de build obligatoire a échoué." }
        - id: s2
          text: { en: "When Ines completes a pull request that has one approval, the policies are bypassed only if she selects the override option in the completion dialog.", fr: "Quand Ines termine une pull request qui a une seule approbation, les stratégies ne sont contournées que si elle sélectionne l'option de remplacement dans la boîte de dialogue d'achèvement." }
        - id: s3
          text: { en: "When Paul pushes a commit directly to `main`, Azure Repos asks him to confirm that he bypasses the policies.", fr: "Quand Paul pousse un commit directement sur `main`, Azure Repos lui demande de confirmer qu'il contourne les stratégies." }
    answer:
      values: { s1: false, s2: true, s3: false }
    explanation:
      correct:
        en: |
          The two bypass permissions aren't set for any security group by default, so Project Administrators must satisfy the policies like everyone else. **Bypass policies when completing pull requests** exempts its holder at completion, and the user opts in by selecting **Override branch policies and enable merge**. **Bypass policies when pushing** lets its holder push to a branch with required policies, and the push bypasses them automatically, with no opt-in step or warning.
        fr: |
          Les deux autorisations de contournement ne sont définies pour aucun groupe de sécurité par défaut : les Project Administrators doivent donc satisfaire les stratégies comme tout le monde. **Bypass policies when completing pull requests** exempte son détenteur lors de l'achèvement, et l'utilisateur choisit de contourner en sélectionnant **Override branch policies and enable merge**. **Bypass policies when pushing** permet à son détenteur de pousser sur une branche ayant des stratégies obligatoires, et le push les contourne automatiquement, sans étape de confirmation ni avertissement.
      options:
        s1: { en: "Membership in Project Administrators doesn't include a bypass permission; Marc would need Bypass policies when completing pull requests.", fr: "L'appartenance à Project Administrators n'inclut pas d'autorisation de contournement ; Marc aurait besoin de Bypass policies when completing pull requests." }
        s3: { en: "A push by a user who holds Bypass policies when pushing bypasses the policies automatically, without any confirmation.", fr: "Un push d'un utilisateur qui détient Bypass policies when pushing contourne les stratégies automatiquement, sans aucune confirmation." }
    references:
      - title: Set branch permissions
        url: https://learn.microsoft.com/en-us/azure/devops/repos/git/branch-permissions
      - title: Set Git repository permissions
        url: https://learn.microsoft.com/en-us/azure/devops/repos/git/set-git-repository-permissions

  # ------------------------------------------------------------------ 10
  - id: az400-qz-21-10
    objective: "2.1.3"
    difficulty: 3
    status: draft
    type: dragdrop
    stem:
      en: |
        Woodgrove Bank stores code in private repositories of a GitHub Team organization and in an Azure Repos repository. You must meet four merge and push requirements, listed in the answer area. Each solution must follow the principle of least privilege.

        Which configuration should you use for each requirement? To answer, drag the appropriate configurations to the correct requirements. Each configuration may be used once or not at all.

        NOTE: Each correct selection is worth one point.
      fr: |
        Woodgrove Bank stocke du code dans des dépôts privés d'une organisation GitHub Team et dans un dépôt Azure Repos. Vous devez répondre à quatre exigences de fusion et de push, listées dans la zone de réponse. Chaque solution doit respecter le principe du moindre privilège.

        Quelle configuration devez-vous utiliser pour chaque exigence ? Pour répondre, faites glisser les configurations appropriées vers les exigences correspondantes. Chaque configuration peut être utilisée une fois ou pas du tout.

        Remarque : chaque sélection correcte vaut un point.
    body:
      reuse: false
      items:
        - { id: rulesetbypass, text: { en: "A ruleset that requires a pull request, with the GitHub App in its bypass list", fr: "Un ruleset qui exige une pull request, avec la GitHub App dans sa liste de contournement" } }
        - { id: restrictpush, text: { en: "Restrict who can push to matching branches, with only the team listed", fr: "Restrict who can push to matching branches, avec seulement l'équipe listée" } }
        - { id: forcepush, text: { en: "The Force push (rewrite history, delete branches and tags) permission", fr: "L'autorisation Force push (rewrite history, delete branches and tags)" } }
        - { id: signed, text: { en: "Require signed commits", fr: "Require signed commits" } }
        - { id: bypasspush, text: { en: "The Bypass policies when pushing permission", fr: "L'autorisation Bypass policies when pushing" } }
        - { id: allowforce, text: { en: "Allow force pushes, for the release bot only", fr: "Allow force pushes, pour le robot de mise en production uniquement" } }
        - { id: linear, text: { en: "Require linear history", fr: "Require linear history" } }
      targets:
        - id: bot
          text: { en: "GitHub, main: a release bot, implemented as a GitHub App, pushes version-bump commits directly; everyone else, administrators included, goes through pull requests.", fr: "GitHub, main : un robot de mise en production, implémenté comme GitHub App, pousse directement des commits d'incrément de version ; tous les autres, administrateurs compris, passent par des pull requests." }
        - id: releaseteam
          text: { en: "GitHub, release/*: among the users who have the Write role, only the members of the release-managers team can push to these branches or merge pull requests into them.", fr: "GitHub, release/* : parmi les utilisateurs qui ont le rôle Write, seuls les membres de l'équipe release-managers peuvent pousser sur ces branches ou y fusionner des pull requests." }
        - id: cleanup
          text: { en: "Azure Repos: Nadia deletes obsolete feature branches that other developers created, without bypassing any branch policy.", fr: "Azure Repos : Nadia supprime les branches de fonctionnalité obsolètes créées par d'autres développeurs, sans contourner aucune stratégie de branche." }
        - id: verified
          text: { en: "GitHub, main: every commit that reaches the branch must be signed and verified.", fr: "GitHub, main : chaque commit qui arrive dans la branche doit être signé et vérifié." }
    answer:
      mapping: { bot: rulesetbypass, releaseteam: restrictpush, cleanup: forcepush, verified: signed }
    explanation:
      correct:
        en: |
          A ruleset applies to everyone, administrators included, except the actors of its bypass list, which can contain GitHub Apps: the bot pushes directly while everyone else needs a pull request. **Restrict who can push to matching branches** limits pushes, including merges, to the listed people, teams or apps in organization repositories. In Azure Repos, deleting a branch requires the **Force push** permission, and branch creators get it only on their own branches. **Require signed commits** accepts only signed and verified commits.
        fr: |
          Un ruleset s'applique à tous, administrateurs compris, sauf aux acteurs de sa liste de contournement, qui peut contenir des GitHub Apps : le robot pousse directement tandis que tous les autres ont besoin d'une pull request. **Restrict who can push to matching branches** limite les push, fusions comprises, aux personnes, équipes ou applications listées dans les dépôts d'organisation. Dans Azure Repos, supprimer une branche exige l'autorisation **Force push**, et les créateurs de branches ne l'obtiennent que sur leurs propres branches. **Require signed commits** n'accepte que des commits signés et vérifiés.
      options:
        bypasspush: { en: "Bypass policies when pushing lets its holder push past branch policies, which Nadia must not do, and it isn't the permission that deletes branches.", fr: "Bypass policies when pushing permet à son détenteur de pousser en passant outre les stratégies de branche, ce que Nadia ne doit pas faire, et ce n'est pas l'autorisation qui supprime les branches." }
        allowforce: { en: "Allowing force pushes lets the bot rewrite history, but it doesn't remove the pull request requirement.", fr: "Autoriser les push forcés permet au robot de réécrire l'historique, mais ne lève pas l'exigence de pull request." }
        linear: { en: "Require linear history blocks merge commits; it doesn't check commit signatures.", fr: "Require linear history bloque les commits de fusion ; il ne vérifie pas les signatures des commits." }
    references:
      - title: Implement branch merging restrictions
        url: https://learn.microsoft.com/en-us/training/modules/manage-git-branches-workflows/7-implement-branch-merging-restrictions
      - title: Set branch permissions
        url: https://learn.microsoft.com/en-us/azure/devops/repos/git/branch-permissions
