id: az400-sr2-feature-flags
status: draft
stem:
  en: |
    **Note:** This question is part of a series of questions that present the same scenario. Each question in the series contains a unique solution that might meet the stated goals. Some question sets might have more than one correct solution, while others might not have a correct solution.

    Contoso runs an ASP.NET Core web app named **ShopWeb** in Azure App Service. ShopWeb loads its configuration from an Azure App Configuration store named **appcs-shop** by using the App Configuration provider with `UseFeatureFlags()`, and it uses the `Microsoft.FeatureManagement` library with targeting enabled. The groups of a signed-in user are read from the user's role claims.

    The developers have wrapped a new checkout experience in a feature named **NewCheckout**. NewCheckout must be enabled only for the users in the **BetaTesters** group; all other users must keep the current checkout. Later, the product owner must be able to extend NewCheckout to more users without redeploying or restarting ShopWeb.
  fr: |
    **Remarque :** cette question fait partie d'une série de questions présentant le même scénario. Chaque question de la série propose une solution unique susceptible d'atteindre les objectifs fixés. Certaines séries peuvent avoir plusieurs solutions correctes, d'autres aucune.

    Contoso exécute une application web ASP.NET Core nommée **ShopWeb** dans Azure App Service. ShopWeb charge sa configuration depuis un magasin Azure App Configuration nommé **appcs-shop** à l'aide du fournisseur App Configuration avec `UseFeatureFlags()`, et utilise la bibliothèque `Microsoft.FeatureManagement` avec le ciblage activé. Les groupes d'un utilisateur connecté sont lus dans ses revendications de rôle.

    Les développeurs ont encapsulé une nouvelle expérience de paiement dans une fonctionnalité nommée **NewCheckout**. NewCheckout doit être activée uniquement pour les utilisateurs du groupe **BetaTesters** ; tous les autres utilisateurs doivent conserver le paiement actuel. Plus tard, le product owner doit pouvoir étendre NewCheckout à davantage d'utilisateurs sans redéployer ni redémarrer ShopWeb.
