id: az400-sr1-restore-branch
status: draft
stem:
  en: |
    **Note:** This question is part of a series of questions that present the same scenario. Each question in the series contains a unique solution that might meet the stated goals. Some question sets might have more than one correct solution, while others might not have a correct solution.

    Adatum Corporation has an Azure DevOps Services project that contains an Azure Repos Git repository named **Billing**. Yesterday, a developer deleted the branch **release/3.1** from the Azure Repos web portal by mistake. The branch had two branch policies: a minimum of two reviewers and a build validation policy that runs a pipeline named **billing-ci**.

    The commits of release/3.1 were never merged into another branch, and no developer has a local copy of the branch. You need to meet the following requirements:

    - release/3.1 must exist again in Billing and point to the commit it pointed to when it was deleted.
    - After the recovery, release/3.1 must be protected by the same branch policies as before.
  fr: |
    **Remarque :** cette question fait partie d'une série de questions présentant le même scénario. Chaque question de la série propose une solution unique susceptible d'atteindre les objectifs fixés. Certaines séries peuvent avoir plusieurs solutions correctes, d'autres aucune.

    Adatum Corporation dispose d'un projet Azure DevOps Services qui contient un dépôt Git Azure Repos nommé **Billing**. Hier, un développeur a supprimé par erreur la branche **release/3.1** depuis le portail web Azure Repos. La branche avait deux stratégies de branche : un nombre minimal de deux réviseurs et une stratégie de validation de build qui exécute un pipeline nommé **billing-ci**.

    Les commits de release/3.1 n'ont jamais été fusionnés dans une autre branche, et aucun développeur ne possède de copie locale de la branche. Vous devez répondre aux exigences suivantes :

    - release/3.1 doit exister de nouveau dans Billing et pointer vers le commit vers lequel elle pointait lors de sa suppression.
    - Après la récupération, release/3.1 doit être protégée par les mêmes stratégies de branche qu'auparavant.
