id: az400-sr1-ci-paths
status: draft
stem:
  en: |
    **Note:** This question is part of a series of questions that present the same scenario. Each question in the series contains a unique solution that might meet the stated goals. Some question sets might have more than one correct solution, while others might not have a correct solution.

    Tailspin Toys has an Azure DevOps Services project that contains an Azure Repos Git repository named **Inventory**. The repository root contains the folders **src**, **tests**, and **docs**, and a YAML pipeline file named **azure-pipelines.yml** that currently has no `trigger` section.

    You need to configure the CI trigger of the pipeline to meet the following requirements:

    - A push to **main** or to any branch whose name starts with **release/** (for example, release/2.4) must start a run.
    - A push to any other branch must not start a run.
    - A push that changes only files in the docs folder must not start a run. A push that changes files in docs and in src must start a run.
  fr: |
    **Remarque :** cette question fait partie d'une série de questions présentant le même scénario. Chaque question de la série propose une solution unique susceptible d'atteindre les objectifs fixés. Certaines séries peuvent avoir plusieurs solutions correctes, d'autres aucune.

    Tailspin Toys dispose d'un projet Azure DevOps Services qui contient un dépôt Git Azure Repos nommé **Inventory**. La racine du dépôt contient les dossiers **src**, **tests** et **docs**, ainsi qu'un fichier de pipeline YAML nommé **azure-pipelines.yml** qui n'a actuellement aucune section `trigger`.

    Vous devez configurer le déclencheur CI du pipeline pour répondre aux exigences suivantes :

    - Une poussée vers **main** ou vers toute branche dont le nom commence par **release/** (par exemple release/2.4) doit démarrer une exécution.
    - Une poussée vers toute autre branche ne doit pas démarrer d'exécution.
    - Une poussée qui modifie uniquement des fichiers du dossier docs ne doit pas démarrer d'exécution. Une poussée qui modifie des fichiers dans docs et dans src doit démarrer une exécution.
