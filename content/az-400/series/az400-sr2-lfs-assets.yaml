id: az400-sr2-lfs-assets
status: draft
stem:
  en: |
    **Note:** This question is part of a series of questions that present the same scenario. Each question in the series contains a unique solution that might meet the stated goals. Some question sets might have more than one correct solution, while others might not have a correct solution.

    Tailspin Toys has an Azure DevOps Services project that contains an Azure Repos Git repository named **GameAssets**. Artists use Git for Windows on their workstations and currently clone and push GameAssets over SSH.

    The artists will start adding Photoshop (`.psd`) and FBX (`.fbx`) files of 20 MB to 400 MB to GameAssets. The new files must be versioned in GameAssets, and the Git history must store only small pointer files for them so that clones stay small. Files already in the history are not concerned.
  fr: |
    **Remarque :** cette question fait partie d'une série de questions présentant le même scénario. Chaque question de la série propose une solution unique susceptible d'atteindre les objectifs fixés. Certaines séries peuvent avoir plusieurs solutions correctes, d'autres aucune.

    Tailspin Toys dispose d'un projet Azure DevOps Services qui contient un dépôt Git Azure Repos nommé **GameAssets**. Les artistes utilisent Git for Windows sur leurs postes de travail et clonent et envoient actuellement GameAssets par SSH.

    Les artistes vont commencer à ajouter à GameAssets des fichiers Photoshop (`.psd`) et FBX (`.fbx`) de 20 Mo à 400 Mo. Les nouveaux fichiers doivent être versionnés dans GameAssets, et l'historique Git ne doit stocker que de petits fichiers pointeurs pour eux afin que les clones restent petits. Les fichiers déjà présents dans l'historique ne sont pas concernés.
