id: az400-sr2-boards-github
status: draft
stem:
  en: |
    **Note:** This question is part of a series of questions that present the same scenario. Each question in the series contains a unique solution that might meet the stated goals. Some question sets might have more than one correct solution, while others might not have a correct solution.

    Fabrikam has an Azure DevOps Services organization that contains a project named **Retail**. Retail uses the Agile process, in which the Bug work item type has the states New, Active, Resolved and Closed. The application code is stored in a GitHub.com repository named **fabrikam/storefront**. The default branch of the repository is **main**.

    When a developer merges a pull request that fixes a bug into main, the bug must be linked to the pull request in the **Development** section of the work item and must move to the **Resolved** state automatically. The solution must not use custom code or scripts.
  fr: |
    **Remarque :** cette question fait partie d'une série de questions présentant le même scénario. Chaque question de la série propose une solution unique susceptible d'atteindre les objectifs fixés. Certaines séries peuvent avoir plusieurs solutions correctes, d'autres aucune.

    Fabrikam dispose d'une organisation Azure DevOps Services qui contient un projet nommé **Retail**. Retail utilise le processus Agile, dans lequel le type d'élément de travail Bug a les états New, Active, Resolved et Closed. Le code de l'application est stocké dans un dépôt GitHub.com nommé **fabrikam/storefront**. La branche par défaut du dépôt est **main**.

    Lorsqu'un développeur fusionne dans main une pull request qui corrige un bogue, le bogue doit être lié à la pull request dans la section **Development** de l'élément de travail et doit passer automatiquement à l'état **Resolved**. La solution ne doit pas utiliser de code ni de scripts personnalisés.
