id: az400-sr1-kv-secrets
status: draft
stem:
  en: |
    **Note:** This question is part of a series of questions that present the same scenario. Each question in the series contains a unique solution that might meet the stated goals. Some question sets might have more than one correct solution, while others might not have a correct solution.

    Proseware has an Azure DevOps project that contains a YAML pipeline named **web-deploy**. The pipeline uses an Azure Resource Manager service connection named **sc-prod** to deploy a web app. An Azure key vault named **kv-proseware-prod** uses the **Azure role-based access control** permission model and stores two secrets named **SqlPassword** and **ApiKey**.

    web-deploy must use SqlPassword and ApiKey during each run. You need to meet the following requirements:

    - The secret values must not be stored in Azure DevOps.
    - When a secret is rotated in kv-proseware-prod, the next run must use the new value without any change in Azure DevOps.
    - The identity of sc-prod must be granted the least privilege required.
  fr: |
    **Remarque :** cette question fait partie d'une série de questions présentant le même scénario. Chaque question de la série propose une solution unique susceptible d'atteindre les objectifs fixés. Certaines séries peuvent avoir plusieurs solutions correctes, d'autres aucune.

    Proseware dispose d'un projet Azure DevOps qui contient un pipeline YAML nommé **web-deploy**. Le pipeline utilise une connexion de service Azure Resource Manager nommée **sc-prod** pour déployer une application web. Un coffre de clés Azure nommé **kv-proseware-prod** utilise le modèle d'autorisation **contrôle d'accès en fonction du rôle Azure** et stocke deux secrets nommés **SqlPassword** et **ApiKey**.

    web-deploy doit utiliser SqlPassword et ApiKey à chaque exécution. Vous devez répondre aux exigences suivantes :

    - Les valeurs des secrets ne doivent pas être stockées dans Azure DevOps.
    - Lorsqu'un secret est renouvelé dans kv-proseware-prod, l'exécution suivante doit utiliser la nouvelle valeur sans aucune modification dans Azure DevOps.
    - L'identité de sc-prod doit recevoir le privilège minimum nécessaire.
