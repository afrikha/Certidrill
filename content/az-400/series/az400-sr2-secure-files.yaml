id: az400-sr2-secure-files
status: draft
stem:
  en: |
    **Note:** This question is part of a series of questions that present the same scenario. Each question in the series contains a unique solution that might meet the stated goals. Some question sets might have more than one correct solution, while others might not have a correct solution.

    Woodgrove Bank has an Azure DevOps Services project named **Mobile** that contains several YAML pipelines, including **android-ci** and **android-release**. The android-release pipeline signs the Android app with a 3 MB keystore file named **release.jks**.

    You need to provide release.jks to android-release. The solution must meet the following requirements:

    - release.jks must not be stored in any Git repository and must be stored encrypted at rest in Azure DevOps.
    - Only the android-release pipeline must be able to use release.jks.
    - A member of the **Mobile Security** group must approve each run before it can use release.jks.
  fr: |
    **Remarque :** cette question fait partie d'une série de questions présentant le même scénario. Chaque question de la série propose une solution unique susceptible d'atteindre les objectifs fixés. Certaines séries peuvent avoir plusieurs solutions correctes, d'autres aucune.

    Woodgrove Bank dispose d'un projet Azure DevOps Services nommé **Mobile** qui contient plusieurs pipelines YAML, dont **android-ci** et **android-release**. Le pipeline android-release signe l'application Android avec un fichier de magasin de clés de 3 Mo nommé **release.jks**.

    Vous devez fournir release.jks à android-release. La solution doit répondre aux exigences suivantes :

    - release.jks ne doit être stocké dans aucun dépôt Git et doit être stocké chiffré au repos dans Azure DevOps.
    - Seul le pipeline android-release doit pouvoir utiliser release.jks.
    - Un membre du groupe **Mobile Security** doit approuver chaque exécution avant qu'elle puisse utiliser release.jks.
