id: az400-sr1-prod-approval
status: draft
stem:
  en: |
    **Note:** This question is part of a series of questions that present the same scenario. Each question in the series contains a unique solution that might meet the stated goals. Some question sets might have more than one correct solution, while others might not have a correct solution.

    Northwind Traders has an Azure DevOps project named **Retail**. Retail contains six YAML pipelines, and new pipelines are added every quarter. Each pipeline has a stage with a deployment job that targets a YAML-based environment named **Production**. A security group named **Release Approvers** exists in Retail.

    You need to meet the following requirements:

    - Before a stage that deploys to Production starts, a member of Release Approvers must approve the run. This applies to the existing pipelines and to the pipelines added later.
    - Developers who can edit the pipeline YAML files must not be able to remove or bypass the approval.
    - Administrative effort must be minimized.
  fr: |
    **Remarque :** cette question fait partie d'une série de questions présentant le même scénario. Chaque question de la série propose une solution unique susceptible d'atteindre les objectifs fixés. Certaines séries peuvent avoir plusieurs solutions correctes, d'autres aucune.

    Northwind Traders dispose d'un projet Azure DevOps nommé **Retail**. Retail contient six pipelines YAML, et de nouveaux pipelines sont ajoutés chaque trimestre. Chaque pipeline comporte une phase avec un travail de déploiement qui cible un environnement YAML nommé **Production**. Un groupe de sécurité nommé **Release Approvers** existe dans Retail.

    Vous devez répondre aux exigences suivantes :

    - Avant le démarrage d'une phase qui déploie sur Production, un membre de Release Approvers doit approuver l'exécution. Cela s'applique aux pipelines existants et aux pipelines ajoutés ultérieurement.
    - Les développeurs qui peuvent modifier les fichiers YAML des pipelines ne doivent pas pouvoir supprimer ou contourner l'approbation.
    - L'effort d'administration doit être réduit au minimum.
