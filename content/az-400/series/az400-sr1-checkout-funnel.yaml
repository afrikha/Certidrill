id: az400-sr1-checkout-funnel
status: draft
stem:
  en: |
    **Note:** This question is part of a series of questions that present the same scenario. Each question in the series contains a unique solution that might meet the stated goals. Some question sets might have more than one correct solution, while others might not have a correct solution.

    Wingtip Toys has an online store instrumented with the Application Insights JavaScript SDK. The checkout process sends four custom events, always in this order: **CheckoutStarted**, **ShippingEntered**, **PaymentSubmitted**, and **OrderConfirmed**.

    After a redesign of the checkout pages, the product owner asks for a report in Application Insights that shows, for the users who sent CheckoutStarted during the last 30 days, the percentage of users who reached each of the next three steps in order. The report must be built with an existing Application Insights usage tool, without writing a query.
  fr: |
    **Remarque :** cette question fait partie d'une série de questions présentant le même scénario. Chaque question de la série propose une solution unique susceptible d'atteindre les objectifs fixés. Certaines séries peuvent avoir plusieurs solutions correctes, d'autres aucune.

    Wingtip Toys dispose d'une boutique en ligne instrumentée avec le SDK JavaScript d'Application Insights. Le processus de commande envoie quatre événements personnalisés, toujours dans cet ordre : **CheckoutStarted**, **ShippingEntered**, **PaymentSubmitted** et **OrderConfirmed**.

    Après une refonte des pages de commande, le propriétaire du produit demande un rapport dans Application Insights qui montre, pour les utilisateurs ayant envoyé CheckoutStarted au cours des 30 derniers jours, le pourcentage d'utilisateurs qui ont atteint chacune des trois étapes suivantes dans l'ordre. Le rapport doit être créé avec un outil d'analyse de l'utilisation existant d'Application Insights, sans écrire de requête.
