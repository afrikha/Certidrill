id: az400-sr2-kql-failures
status: draft
stem:
  en: |
    **Note:** This question is part of a series of questions that present the same scenario. Each question in the series contains a unique solution that might meet the stated goals. Some question sets might have more than one correct solution, while others might not have a correct solution.

    Northwind Traders has a workspace-based Azure Monitor Application Insights resource that stores its telemetry in a Log Analytics workspace named **law-northwind**. Sampling is disabled. Several services send telemetry; the cloud role name of the checkout service is **checkout-api**.

    After each deployment, the DevOps team runs a query in the **Logs** of law-northwind. The query must return the five operations of checkout-api that had the most failed requests during the last 24 hours, with one row per operation that contains the total number of failed requests, sorted from highest to lowest.
  fr: |
    **Remarque :** cette question fait partie d'une série de questions présentant le même scénario. Chaque question de la série propose une solution unique susceptible d'atteindre les objectifs fixés. Certaines séries peuvent avoir plusieurs solutions correctes, d'autres aucune.

    Northwind Traders dispose d'une ressource Azure Monitor Application Insights basée sur un espace de travail qui stocke sa télémétrie dans un espace de travail Log Analytics nommé **law-northwind**. L'échantillonnage est désactivé. Plusieurs services envoient de la télémétrie ; le nom de rôle cloud du service de paiement est **checkout-api**.

    Après chaque déploiement, l'équipe DevOps exécute une requête dans les **Journaux** de law-northwind. La requête doit renvoyer les cinq opérations de checkout-api qui ont eu le plus de requêtes en échec au cours des dernières 24 heures, avec une ligne par opération contenant le nombre total de requêtes en échec, triées de la plus élevée à la plus faible.
