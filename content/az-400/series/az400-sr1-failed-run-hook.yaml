id: az400-sr1-failed-run-hook
status: draft
stem:
  en: |
    **Note:** This question is part of a series of questions that present the same scenario. Each question in the series contains a unique solution that might meet the stated goals. Some question sets might have more than one correct solution, while others might not have a correct solution.

    Litware has an Azure DevOps Services project named **Orders** that contains a YAML pipeline named **orders-ci**. The operations team uses an incident platform that accepts JSON payloads sent by HTTP POST to the public endpoint **https://incidents.litware.com/api/devops**. The endpoint requires basic authentication.

    You need to meet the following requirements:

    - Each time a run of orders-ci completes with the **Failed** result, the endpoint must receive a JSON payload that describes the run.
    - The endpoint must not receive payloads for runs that succeed or for other pipelines.
    - The solution must not require changes to the pipeline YAML or any custom code.
  fr: |
    **Remarque :** cette question fait partie d'une série de questions présentant le même scénario. Chaque question de la série propose une solution unique susceptible d'atteindre les objectifs fixés. Certaines séries peuvent avoir plusieurs solutions correctes, d'autres aucune.

    Litware dispose d'un projet Azure DevOps Services nommé **Orders** qui contient un pipeline YAML nommé **orders-ci**. L'équipe des opérations utilise une plateforme d'incidents qui accepte des charges utiles JSON envoyées par HTTP POST au point de terminaison public **https://incidents.litware.com/api/devops**. Le point de terminaison exige une authentification de base.

    Vous devez répondre aux exigences suivantes :

    - Chaque fois qu'une exécution d'orders-ci se termine avec le résultat **Failed**, le point de terminaison doit recevoir une charge utile JSON qui décrit l'exécution.
    - Le point de terminaison ne doit pas recevoir de charges utiles pour les exécutions réussies ni pour les autres pipelines.
    - La solution ne doit nécessiter aucune modification du YAML du pipeline ni aucun code personnalisé.
