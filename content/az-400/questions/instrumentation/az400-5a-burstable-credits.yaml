id: az400-5a-burstable-credits
objective: "5.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Northwind runs a self-hosted build agent on an Azure virtual machine of the B-series (burstable). Builds are fast early in the morning. After about two hours of continuous builds, the Percentage CPU metric no longer exceeds a fixed level that is much lower than in the morning, and build durations double. Memory, disk and network metrics show no change.

    You need to confirm the cause of the slowdown.

    Which metric should you inspect?
  fr: |
    Northwind exécute un agent de build auto-hébergé sur une machine virtuelle Azure de la série B (burstable). Les builds sont rapides tôt le matin. Après environ deux heures de builds continues, la métrique Percentage CPU ne dépasse plus un niveau fixe bien plus bas que le matin, et la durée des builds double. Les métriques de mémoire, de disque et de réseau ne montrent aucun changement.

    Vous devez confirmer la cause du ralentissement.

    Quelle métrique devez-vous examiner ?
body:
  options:
    - { id: a, text: VM Availability Metric }
    - { id: b, text: Available Memory Bytes }
    - { id: c, text: Inbound Flows }
    - { id: d, text: CPU Credits Remaining }
answer: { optionId: d }
explanation:
  correct:
    en: B-series VMs accumulate CPU credits while they run below their baseline and spend them to burst above it. CPU Credits Remaining, available only on B-series VMs, shows the credits left; when it reaches zero, the VM is held at its baseline, which explains the CPU plateau. A non-burstable size suits agents that build continuously.
    fr: Les machines virtuelles de la série B accumulent des crédits de processeur quand elles fonctionnent sous leur niveau de base et les dépensent pour le dépasser. CPU Credits Remaining, disponible uniquement sur la série B, indique les crédits restants ; quand elle atteint zéro, la machine virtuelle est maintenue à son niveau de base, ce qui explique le plafond de processeur. Une taille non burstable convient mieux aux agents qui génèrent en continu.
  options:
    a: { en: "VM Availability Metric measures whether the VM is available, and the VM stays up here.", fr: "VM Availability Metric mesure la disponibilité de la machine virtuelle, qui reste ici en fonctionnement." }
    b: { en: "The memory metrics show no change, and memory pressure does not cap CPU at a fixed level.", fr: "Les métriques de mémoire ne montrent aucun changement, et une pression mémoire ne plafonne pas le processeur à un niveau fixe." }
    c: { en: "Inbound Flows counts network flows, and the network metrics show no change.", fr: "Inbound Flows compte les flux réseau, et les métriques réseau ne montrent aucun changement." }
references:
  - title: Supported metrics for Microsoft.Compute/virtualMachines
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/reference/supported-metrics/microsoft-compute-virtualmachines-metrics
