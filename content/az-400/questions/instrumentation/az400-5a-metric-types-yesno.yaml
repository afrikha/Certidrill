id: az400-5a-metric-types-yesno
objective: "5.2.2"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Contoso analyzes the performance of a web API by using a workspace-based Application Insights resource. Each request carries a custom property named **StoreId**. The team compares the standard metrics and the log-based metrics of the resource.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso analyse les performances d'une API web avec une ressource Application Insights basée sur un espace de travail. Chaque requête porte une propriété personnalisée nommée **StoreId**. L'équipe compare les métriques standard et les métriques basées sur les journaux de la ressource.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: You can split the standard metric requests/duration by StoreId in metrics explorer.
        fr: Vous pouvez fractionner la métrique standard requests/duration par StoreId dans Metrics Explorer.
    - id: s2
      text:
        en: Log-based metrics are computed at query time from the telemetry stored in the Log Analytics workspace.
        fr: Les métriques basées sur les journaux sont calculées au moment de la requête à partir de la télémétrie stockée dans l'espace de travail Log Analytics.
    - id: s3
      text:
        en: Standard metrics are stored with a fixed granularity of one minute.
        fr: Les métriques standard sont stockées avec une granularité fixe d'une minute.
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: Standard metrics are preaggregated during collection and stored as time series in the metrics store with a fixed one-minute granularity, but only with key dimensions, so a custom property such as StoreId is not available for splitting. Log-based metrics are derived by Kusto queries over the stored telemetry, so every logged property, including StoreId, can be used as a dimension.
    fr: "Les métriques standard sont préagrégées pendant la collecte et stockées sous forme de séries chronologiques dans le magasin de métriques, avec une granularité fixe d'une minute, mais uniquement avec des dimensions clés ; une propriété personnalisée comme StoreId n'est donc pas disponible pour le fractionnement. Les métriques basées sur les journaux sont obtenues par des requêtes Kusto sur la télémétrie stockée : chaque propriété journalisée, y compris StoreId, peut servir de dimension."
references:
  - title: Metrics in Application Insights
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/app/metrics-overview
