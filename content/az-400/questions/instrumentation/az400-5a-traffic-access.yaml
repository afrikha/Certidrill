id: az400-5a-traffic-access
objective: "5.1.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Tailspin maintains a public open-source SDK in a GitHub repository owned by the **tailspin** organization, on GitHub Team. A developer advocate named Kai must see the traffic graph of the repository: visitors, clones, referring sites and popular content. Kai currently has the Triage role on the repository.

    You need to grant Kai access to the traffic graph. The solution must follow the principle of least privilege.

    Which repository role should you assign to Kai?
  fr: |
    Tailspin maintient un SDK open source public dans un dépôt GitHub appartenant à l'organisation **tailspin**, sous GitHub Team. Un developer advocate nommé Kai doit voir le graphique de trafic du dépôt : visiteurs, clones, sites référents et contenu populaire. Kai dispose actuellement du rôle Triage sur le dépôt.

    Vous devez accorder à Kai l'accès au graphique de trafic. La solution doit respecter le principe du moindre privilège.

    Quel rôle de dépôt devez-vous attribuer à Kai ?
shuffle: false
body:
  options:
    - { id: read, text: Read }
    - { id: write, text: Write }
    - { id: maintain, text: Maintain }
    - { id: admin, text: Admin }
answer: { optionId: write }
explanation:
  correct:
    en: Anyone with push access to a repository can view its traffic. Write is the least privileged repository role that includes push access; Read and Kai's current Triage role do not.
    fr: Toute personne disposant d'un accès push à un dépôt peut consulter son trafic. Write est le rôle de dépôt le moins privilégié qui inclut l'accès push ; Read et le rôle Triage actuel de Kai ne l'incluent pas.
  options:
    read: { en: "Read does not include push access.", fr: "Read n'inclut pas l'accès push." }
    maintain: { en: "Maintain includes push access, but it also lets Kai manage some repository settings, which is more than needed.", fr: "Maintain inclut l'accès push, mais permet aussi à Kai de gérer certains paramètres du dépôt, ce qui dépasse le besoin." }
    admin: { en: "Admin includes push access but grants far more than needed.", fr: "Admin inclut l'accès push, mais accorde bien plus que nécessaire." }
references:
  - title: Viewing traffic to a repository
    url: https://docs.github.com/en/repositories/viewing-activity-and-data-for-your-repository/viewing-traffic-to-a-repository
