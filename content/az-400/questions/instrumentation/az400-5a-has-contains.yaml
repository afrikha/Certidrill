id: az400-5a-has-contains
objective: "5.2.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Contoso's API writes log messages to the AppTraces table. Two of the messages are:

    - `Connection timeout after 30 seconds`
    - `Unhandled SqlTimeoutException in OrderRepository`

    You need a query that returns both messages. You start with:

    `AppTraces | where Message ...`

    Which condition should you use?
  fr: |
    L'API de Contoso écrit des messages de journal dans la table AppTraces. Deux de ces messages sont :

    - `Connection timeout after 30 seconds`
    - `Unhandled SqlTimeoutException in OrderRepository`

    Vous avez besoin d'une requête qui renvoie les deux messages. Vous commencez par :

    `AppTraces | where Message ...`

    Quelle condition devez-vous utiliser ?
body:
  options:
    - { id: a, text: '`has "timeout"`' }
    - { id: b, text: '`has_cs "Timeout"`' }
    - { id: c, text: '`startswith "timeout"`' }
    - { id: d, text: '`contains "timeout"`' }
answer: { optionId: d }
explanation:
  correct:
    en: "contains matches any substring and is case-insensitive, so it finds timeout in both the word timeout and the identifier SqlTimeoutException. It scans the column values and is slower than has, but has matches whole terms only, and SqlTimeoutException is a single term."
    fr: "contains correspond à n'importe quelle sous-chaîne et ne respecte pas la casse : il trouve timeout à la fois dans le mot timeout et dans l'identificateur SqlTimeoutException. Il analyse les valeurs de la colonne et est plus lent que has, mais has ne correspond qu'à des termes entiers, et SqlTimeoutException est un seul terme."
  options:
    a: { en: "has matches only the whole term timeout, so it misses SqlTimeoutException.", fr: "has ne correspond qu'au terme entier timeout : il manque SqlTimeoutException." }
    b: { en: "has_cs is a case-sensitive whole-term match; Timeout is not a whole term in either message.", fr: "has_cs est une correspondance de terme entier qui respecte la casse ; Timeout n'est un terme entier dans aucun des deux messages." }
    c: { en: "Neither message starts with timeout.", fr: "Aucun des deux messages ne commence par timeout." }
references:
  - title: String operators
    url: https://learn.microsoft.com/en-us/kusto/query/datatypes-string-operators
