id: az400-5a-arc-vminsights
objective: "5.1.2"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    Fabrikam has 40 on-premises Linux servers that host build tools. The servers are not connected to Azure. Fabrikam has a Log Analytics workspace named **law-ops** and plans to use the logs-based VM insights experience for the servers.

    You need the guest CPU, memory, disk and network performance of the servers to appear in VM insights.

    Which three actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam dispose de 40 serveurs Linux locaux qui hébergent des outils de build. Les serveurs ne sont pas connectés à Azure. Fabrikam dispose d'un espace de travail Log Analytics nommé **law-ops** et prévoit d'utiliser l'expérience VM Insights basée sur les journaux pour ces serveurs.

    Les performances invitées (processeur, mémoire, disque et réseau) des serveurs doivent apparaître dans VM Insights.

    Quelles sont les trois actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 3
  options:
    - { id: a, text: { en: "Install the Log Analytics agent (MMA/OMS) on each server.", fr: "Installer l'agent Log Analytics (MMA/OMS) sur chaque serveur." } }
    - { id: b, text: { en: "Install the Azure Connected Machine agent on each server.", fr: "Installer l'agent Azure Connected Machine sur chaque serveur." } }
    - { id: c, text: { en: "Create a diagnostic setting on law-ops that collects the server metrics.", fr: "Créer sur law-ops un paramètre de diagnostic qui collecte les métriques des serveurs." } }
    - { id: d, text: { en: "Install the Azure Monitor Agent extension on each Arc-enabled server.", fr: "Installer l'extension de l'agent Azure Monitor sur chaque serveur avec Arc." } }
    - { id: e, text: { en: "Install only the Dependency agent on each server.", fr: "Installer uniquement l'agent Dependency sur chaque serveur." } }
    - { id: f, text: { en: "Create a VM insights data collection rule that targets law-ops, and associate it with the servers.", fr: "Créer une règle de collecte de données VM Insights qui cible law-ops, et l'associer aux serveurs." } }
answer: { optionIds: [ b, d, f ] }
explanation:
  correct:
    en: Non-Azure machines must first be Arc-enabled with the Azure Connected Machine agent. VM insights then follows the same three steps as for Azure VMs; install the Azure Monitor Agent, create a data collection rule that defines what to collect and where to send it, and associate the rule with the machines.
    fr: "Les machines non Azure doivent d'abord être activées par Arc avec l'agent Azure Connected Machine. VM Insights suit ensuite les trois mêmes étapes que pour les machines virtuelles Azure : installer l'agent Azure Monitor, créer une règle de collecte de données qui définit quoi collecter et où l'envoyer, puis associer la règle aux machines."
  options:
    a: { en: "The Log Analytics agent is deprecated; VM insights uses the Azure Monitor Agent.", fr: "L'agent Log Analytics est déprécié ; VM Insights utilise l'agent Azure Monitor." }
    c: { en: "Diagnostic settings export the platform logs of Azure resources; they do not collect guest data from servers.", fr: "Les paramètres de diagnostic exportent les journaux de plateforme des ressources Azure ; ils ne collectent pas les données invitées des serveurs." }
    e: { en: "The Dependency agent only adds process and connection data for the Map feature, which retires in June 2028; it does not collect performance data by itself.", fr: "L'agent Dependency n'ajoute que les données de processus et de connexions pour la fonctionnalité Map, qui sera retirée en juin 2028 ; il ne collecte pas seul les données de performances." }
references:
  - title: Enable VM monitoring in Azure Monitor
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/vm/vminsights-enable
