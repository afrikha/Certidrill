id: az400-cs4b-trace-latency
objective: "5.2.3"
type: single
caseStudy: az400-cs4b-alpine-ski-house
difficulty: 1
status: draft
stem:
  en: |
    You need to meet the monitoring requirement. What should the support engineers use in appi-ask?
  fr: |
    Vous devez satisfaire l'exigence de supervision. Que doivent utiliser les ingénieurs du support dans appi-ask ?
body:
  options:
    - { id: a, text: { en: "Application Map, to view the average duration of the calls between the components", fr: "Application Map, pour afficher la durée moyenne des appels entre les composants" } }
    - { id: b, text: { en: "End-to-end transaction details, opened from a sample operation in the Performance view", fr: "End-to-end transaction details, ouvert depuis un exemple d'opération dans la vue Performance" } }
    - { id: c, text: { en: "Metrics Explorer, to chart the server response time metric split by role", fr: "Metrics Explorer, pour représenter la métrique de temps de réponse du serveur fractionnée par rôle" } }
    - { id: d, text: { en: "A standard availability test, to measure the response time of the booking endpoint", fr: "Un test de disponibilité standard, pour mesurer le temps de réponse du point de terminaison de réservation" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      End-to-end transaction details correlates the telemetry of all the monitored components into one view and shows a Gantt chart of a single transaction, with the duration of each dependency call. Support engineers can see whether pricing-api or payment-api consumed the time of that specific booking request.
    fr: |
      End-to-end transaction details met en corrélation la télémétrie de tous les composants supervisés dans une seule vue et affiche un diagramme de Gantt d'une transaction donnée, avec la durée de chaque appel de dépendance. Les ingénieurs du support voient si pricing-api ou payment-api a consommé le temps de cette requête de réservation précise.
  options:
    a:
      en: |
        Application Map shows aggregated performance and failures between components, not the timeline of one request.
      fr: |
        Application Map présente des performances et des échecs agrégés entre composants, pas la chronologie d'une requête.
    c:
      en: |
        Metrics Explorer charts aggregated metrics over time; it cannot break down an individual request into its dependency calls.
      fr: |
        Metrics Explorer représente des métriques agrégées dans le temps ; il ne peut pas décomposer une requête donnée en appels de dépendance.
    d:
      en: |
        An availability test sends synthetic requests from outside; it does not explain where the time of a real customer request went.
      fr: |
        Un test de disponibilité envoie des requêtes synthétiques depuis l'extérieur ; il n'explique pas où est passé le temps d'une vraie requête client.
references:
  - title: Investigate failures, performance, and transactions with Application Insights
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/app/transaction-search-and-diagnostics
