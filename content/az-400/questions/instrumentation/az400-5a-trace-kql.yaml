id: az400-5a-trace-kql
objective: "5.2.3"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Contoso's web front end and three back-end APIs send telemetry to workspace-based Application Insights resources that share a Log Analytics workspace. A customer reports a failed checkout, and the support engineer has the operation ID of the transaction: **4bf92f3577b34da6a3ce929d0e0e4736**.

    You need a query that lists every incoming request and outgoing call of that distributed operation across all the components, in chronological order.

    How should you complete the query? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Le front-end web et les trois API back-end de Contoso envoient leur télémétrie à des ressources Application Insights basées sur un espace de travail qui partagent un même espace de travail Log Analytics. Un client signale un paiement en échec, et l'ingénieur du support dispose de l'ID d'opération de la transaction : **4bf92f3577b34da6a3ce929d0e0e4736**.

    Vous avez besoin d'une requête qui liste chaque requête entrante et chaque appel sortant de cette opération distribuée dans tous les composants, dans l'ordre chronologique.

    Comment devez-vous compléter la requête ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: kusto
  template: |
    [[op]] AppRequests, AppDependencies
    | where [[col]] == "4bf92f3577b34da6a3ce929d0e0e4736"
    | project TimeGenerated, Type, AppRoleName, Name, Id, ParentId, DurationMs, Success
    | order by [[ord]] asc
  slots:
    - id: op
      options:
        - { id: union, text: union }
        - { id: join, text: join }
        - { id: lookup, text: lookup }
        - { id: extend, text: extend }
    - id: col
      options:
        - { id: id, text: Id }
        - { id: parent, text: ParentId }
        - { id: opid, text: OperationId }
        - { id: session, text: SessionId }
    - id: ord
      options:
        - { id: duration, text: DurationMs }
        - { id: time, text: TimeGenerated }
        - { id: name, text: Name }
answer:
  values: { op: union, col: opid, ord: time }
explanation:
  correct:
    en: "Incoming calls are stored in AppRequests and outgoing calls in AppDependencies, so union appends the rows of both tables. OperationId identifies the root operation and is shared by all the telemetry of the distributed transaction, across components. Ordering by TimeGenerated ascending lists the calls chronologically, and Id and ParentId show which call triggered which."
    fr: "Les appels entrants sont stockés dans AppRequests et les appels sortants dans AppDependencies : union ajoute les lignes des deux tables. OperationId identifie l'opération racine et est partagé par toute la télémétrie de la transaction distribuée, dans tous les composants. Le tri croissant sur TimeGenerated liste les appels dans l'ordre chronologique, et Id et ParentId montrent quel appel a déclenché quel autre."
  options:
    join: { en: "join matches rows of two tables on a key; it does not start a query from a list of tables.", fr: "join met en correspondance les lignes de deux tables sur une clé ; il ne démarre pas une requête à partir d'une liste de tables." }
    id: { en: "Id identifies a single request or dependency, not the whole operation.", fr: "Id identifie une seule requête ou dépendance, pas l'opération entière." }
    parent: { en: "ParentId is the ID of the immediate parent of an item, so it returns only its direct children.", fr: "ParentId est l'ID du parent immédiat d'un élément : il ne renvoie que ses enfants directs." }
    duration: { en: "Ordering by duration does not give the chronological order.", fr: "Trier par durée ne donne pas l'ordre chronologique." }
references:
  - title: Azure Monitor Logs reference - AppRequests
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/reference/tables/apprequests
  - title: Application Insights telemetry data model
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/app/data-model-complete
