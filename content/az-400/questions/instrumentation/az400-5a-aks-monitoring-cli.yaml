id: az400-5a-aks-monitoring-cli
objective: "5.1.2"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Proseware runs an AKS cluster named **aks-shop** in a resource group named **rg-aks**. The cluster uses a managed identity. The variable LAW_ID contains the resource ID of an existing Log Analytics workspace, and AMW_ID contains the resource ID of an existing Azure Monitor workspace.

    You need to add a step to the deployment pipeline that collects container logs in the Log Analytics workspace by using Container insights, and Prometheus metrics in the Azure Monitor workspace.

    How should you complete the commands? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware exécute un cluster AKS nommé **aks-shop** dans un groupe de ressources nommé **rg-aks**. Le cluster utilise une identité managée. La variable LAW_ID contient l'ID de ressource d'un espace de travail Log Analytics existant, et AMW_ID contient l'ID de ressource d'un espace de travail Azure Monitor existant.

    Vous devez ajouter au pipeline de déploiement une étape qui collecte les journaux de conteneurs dans l'espace de travail Log Analytics avec Container Insights, et les métriques Prometheus dans l'espace de travail Azure Monitor.

    Comment devez-vous compléter les commandes ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: bash
  template: |
    az aks [[cmd]] --addon monitoring --name aks-shop \
      --resource-group rg-aks [[ws]] "$LAW_ID"

    az aks update [[prom]] --name aks-shop \
      --resource-group rg-aks --azure-monitor-workspace-resource-id "$AMW_ID"
  slots:
    - id: cmd
      options:
        - { id: upgrade, text: upgrade }
        - { id: enable, text: enable-addons }
        - { id: getcred, text: get-credentials }
        - { id: nodepool, text: nodepool add }
    - id: ws
      options:
        - { id: amw, text: --azure-monitor-workspace-resource-id }
        - { id: grafana, text: --grafana-resource-id }
        - { id: law, text: --workspace-resource-id }
        - { id: dcs, text: --data-collection-settings }
    - id: prom
      options:
        - { id: prom, text: --enable-azure-monitor-metrics }
        - { id: cp, text: --enable-control-plane-metrics }
        - { id: mi, text: --enable-managed-identity }
        - { id: addons, text: --enable-addons monitoring }
answer:
  values: { cmd: enable, ws: law, prom: prom }
explanation:
  correct:
    en: "Container insights and container logging are enabled with the monitoring add-on: az aks enable-addons --addon monitoring, with --workspace-resource-id to use an existing Log Analytics workspace. Managed Prometheus is enabled separately with az aks update --enable-azure-monitor-metrics, and --azure-monitor-workspace-resource-id selects the existing Azure Monitor workspace."
    fr: "Container Insights et la journalisation des conteneurs s'activent avec le module complémentaire monitoring : az aks enable-addons --addon monitoring, avec --workspace-resource-id pour utiliser un espace de travail Log Analytics existant. Le service managé pour Prometheus s'active séparément avec az aks update --enable-azure-monitor-metrics, et --azure-monitor-workspace-resource-id sélectionne l'espace de travail Azure Monitor existant."
  options:
    upgrade: { en: "az aks upgrade changes the Kubernetes version of the cluster.", fr: "az aks upgrade change la version Kubernetes du cluster." }
    amw: { en: "The Azure Monitor workspace stores Prometheus metrics, not container logs.", fr: "L'espace de travail Azure Monitor stocke les métriques Prometheus, pas les journaux de conteneurs." }
    dcs: { en: "--data-collection-settings points to a JSON file that customizes log collection; it does not select the workspace.", fr: "--data-collection-settings désigne un fichier JSON qui personnalise la collecte des journaux ; il ne sélectionne pas l'espace de travail." }
    cp: { en: "Control plane metrics require Managed Prometheus to be enabled; the flag does not enable Prometheus collection itself.", fr: "Les métriques du plan de contrôle exigent que le service managé pour Prometheus soit activé ; l'indicateur n'active pas lui-même la collecte Prometheus." }
    addons: { en: "--enable-addons monitoring is not how az aks update enables Prometheus metrics.", fr: "--enable-addons monitoring n'est pas la façon dont az aks update active les métriques Prometheus." }
references:
  - title: Enable monitoring for Azure Kubernetes Service (AKS) clusters
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/containers/kubernetes-monitoring-enable
