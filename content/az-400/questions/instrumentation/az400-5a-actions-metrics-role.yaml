id: az400-5a-actions-metrics-role
objective: "5.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Adatum has a GitHub organization named **adatum-eng** that contains 120 repositories. A release manager named Ines must review, every month, the minutes consumed and the failure rates of the workflows of all the repositories in Actions Usage Metrics and Actions Performance Metrics. Ines must not be able to change organization settings or repository content.

    You need to give Ines access. The solution must follow the principle of least privilege.

    What should you do?
  fr: |
    Adatum dispose d'une organisation GitHub nommée **adatum-eng** qui contient 120 dépôts. Une responsable des versions nommée Ines doit examiner chaque mois les minutes consommées et les taux d'échec des workflows de tous les dépôts dans Actions Usage Metrics et Actions Performance Metrics. Ines ne doit pas pouvoir modifier les paramètres de l'organisation ni le contenu des dépôts.

    Vous devez donner l'accès à Ines. La solution doit respecter le principe du moindre privilège.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Make Ines an owner of the adatum-eng organization.", fr: "Faire d'Ines une propriétaire de l'organisation adatum-eng." } }
    - { id: b, text: { en: "Grant Ines the Write role on every repository of the organization.", fr: "Accorder à Ines le rôle Write sur chaque dépôt de l'organisation." } }
    - { id: c, text: { en: "Assign Ines a custom organization role that includes View organization Actions metrics.", fr: "Attribuer à Ines un rôle d'organisation personnalisé qui inclut View organization Actions metrics." } }
    - { id: d, text: { en: "Grant Ines the Read role on every repository of the organization.", fr: "Accorder à Ines le rôle Read sur chaque dépôt de l'organisation." } }
answer: { optionId: c }
explanation:
  correct:
    en: The organization Actions metrics can be viewed by organization owners and by users who have the View organization Actions metrics permission. Owners grant that permission through a custom organization role, which gives access to the metrics without any administrative or write access.
    fr: Les métriques Actions de l'organisation peuvent être consultées par les propriétaires de l'organisation et par les utilisateurs qui disposent de l'autorisation View organization Actions metrics. Les propriétaires accordent cette autorisation au moyen d'un rôle d'organisation personnalisé, qui donne accès aux métriques sans aucun accès d'administration ni d'écriture.
  options:
    a: { en: "Owners can view the metrics, but they can also change every organization setting, which violates least privilege.", fr: "Les propriétaires peuvent consulter les métriques, mais aussi modifier tous les paramètres de l'organisation, ce qui viole le moindre privilège." }
    b: { en: "Repository roles do not give access to the organization Actions metrics, and Write lets Ines change content.", fr: "Les rôles de dépôt ne donnent pas accès aux métriques Actions de l'organisation, et Write permet à Ines de modifier le contenu." }
    d: { en: "Read lets Ines open each repository's workflow runs, but not the organization-wide usage and performance metrics.", fr: "Read permet à Ines d'ouvrir les exécutions de workflows de chaque dépôt, mais pas les métriques d'utilisation et de performances à l'échelle de l'organisation." }
references:
  - title: Viewing GitHub Actions metrics for your organization
    url: https://docs.github.com/en/organizations/collaborating-with-groups-in-organizations/viewing-github-actions-metrics-for-your-organization
