id: az400-5a-ado-build-fail-subscription
objective: "5.1.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Litware uses an Azure DevOps project named **Billing** that contains a team named **Billing Team** and a CI pipeline named **billing-ci**, the only pipeline of the project. You are a Project Administrator.

    You need every member of Billing Team to receive an email when a run of billing-ci fails. Members must not receive an email when a run succeeds. No pipeline may be modified.

    What should you create?
  fr: |
    Litware utilise un projet Azure DevOps nommé **Billing** qui contient une équipe nommée **Billing Team** et un pipeline CI nommé **billing-ci**, le seul pipeline du projet. Vous êtes Project Administrator.

    Chaque membre de Billing Team doit recevoir un e-mail quand une exécution de billing-ci échoue. Les membres ne doivent pas recevoir d'e-mail quand une exécution réussit. Aucun pipeline ne doit être modifié.

    Que devez-vous créer ?
body:
  options:
    - { id: a, text: { en: "A service hook subscription that uses the Web Hooks service for the Build completed event", fr: "Un abonnement de hook de service qui utilise le service Web Hooks pour l'événement Build completed" } }
    - { id: b, text: { en: "A build validation branch policy that runs billing-ci and notifies Billing Team", fr: "Une stratégie de branche de validation de build qui exécute billing-ci et avertit Billing Team" } }
    - { id: c, text: { en: "A personal notification subscription for each member of Billing Team", fr: "Un abonnement aux notifications personnel pour chaque membre de Billing Team" } }
    - { id: d, text: { en: "A team subscription based on the Build completes template, filtered on the status", fr: "Un abonnement d'équipe basé sur le modèle Build completes, filtré sur le statut" } }
answer: { optionId: d }
explanation:
  correct:
    en: A team subscription delivers email to the members of the team. In Project settings > Notifications, the Build completes template with a filter criterion on the status (Failed) limits the email to failed runs, without any change to the pipeline.
    fr: Un abonnement d'équipe envoie un e-mail aux membres de l'équipe. Dans Project settings > Notifications, le modèle Build completes avec un critère de filtre sur le statut (Failed) limite l'e-mail aux exécutions en échec, sans aucune modification du pipeline.
  options:
    a: { en: "A Web Hooks service hook posts an HTTP request to an endpoint; it does not email the team members.", fr: "Un hook de service Web Hooks envoie une requête HTTP vers un point de terminaison ; il n'envoie pas d'e-mail aux membres de l'équipe." }
    b: { en: "Build validation runs a pipeline for pull requests; it is not a notification mechanism.", fr: "La validation de build exécute un pipeline pour les pull requests ; ce n'est pas un mécanisme de notification." }
    c: { en: "Personal subscriptions are managed by each user for themselves; you cannot create them for the members, and a team subscription does it once.", fr: "Les abonnements personnels sont gérés par chaque utilisateur pour lui-même ; vous ne pouvez pas les créer à la place des membres, et un abonnement d'équipe le fait en une fois." }
references:
  - title: Manage notifications for your team, project, or organization
    url: https://learn.microsoft.com/en-us/azure/devops/organizations/notifications/manage-team-group-global-organization-notifications
