id: az400-5a-slack-service-hook
objective: "5.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Contoso has an Azure DevOps project named **Retail** that contains a YAML pipeline named **retail-ci**. The release managers follow a Slack channel named **#retail-builds**.

    You need a message to be posted to #retail-builds every time a run of retail-ci completes, whatever its result. The YAML file of retail-ci must not be modified.

    What should you create in the Retail project?
  fr: |
    Contoso dispose d'un projet Azure DevOps nommé **Retail** qui contient un pipeline YAML nommé **retail-ci**. Les responsables des versions suivent un canal Slack nommé **#retail-builds**.

    Un message doit être publié dans #retail-builds chaque fois qu'une exécution de retail-ci se termine, quel que soit son résultat. Le fichier YAML de retail-ci ne doit pas être modifié.

    Que devez-vous créer dans le projet Retail ?
body:
  options:
    - { id: a, text: { en: "A team notification subscription for the Build completes event, delivered to the release managers", fr: "Un abonnement aux notifications d'équipe pour l'événement Build completes, remis aux responsables des versions" } }
    - { id: b, text: { en: "A service hook subscription that uses the Slack service for the Build completed event", fr: "Un abonnement de hook de service qui utilise le service Slack pour l'événement Build completed" } }
    - { id: c, text: { en: "An audit stream to Event Grid that forwards pipeline events to the Slack channel", fr: "Un flux d'audit vers Event Grid qui transfère les événements de pipeline vers le canal Slack" } }
    - { id: d, text: { en: "A final job with `condition: always()` that posts to the Slack webhook of the channel", fr: "Un dernier travail avec `condition: always()` qui publie sur le webhook Slack du canal" } }
answer: { optionId: b }
explanation:
  correct:
    en: Service hooks run actions in other services when events happen in a project. A subscription in Project settings > Service hooks with the Slack service and the Build completed event posts a message to the channel after each run, whatever its result, without any change to the pipeline.
    fr: Les hooks de service exécutent des actions dans d'autres services quand des événements se produisent dans un projet. Un abonnement dans Project settings > Service hooks avec le service Slack et l'événement Build completed publie un message dans le canal après chaque exécution, quel que soit son résultat, sans aucune modification du pipeline.
  options:
    a: { en: "Notification subscriptions send email to people; they do not post to a Slack channel.", fr: "Les abonnements aux notifications envoient des e-mails à des personnes ; ils ne publient pas dans un canal Slack." }
    c: { en: "Audit streams send audit events of the organization, such as permission or policy changes, not a message per pipeline run.", fr: "Les flux d'audit envoient les événements d'audit de l'organisation, comme les modifications d'autorisations ou de stratégies, pas un message par exécution de pipeline." }
    d: { en: "A job in the pipeline would work, but it requires modifying the YAML file, which is not allowed.", fr: "Un travail dans le pipeline fonctionnerait, mais il exige de modifier le fichier YAML, ce qui n'est pas autorisé." }
references:
  - title: Integrate with service hooks
    url: https://learn.microsoft.com/en-us/azure/devops/service-hooks/overview
