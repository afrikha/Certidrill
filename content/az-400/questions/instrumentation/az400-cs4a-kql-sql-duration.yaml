id: az400-cs4a-kql-sql-duration
objective: "5.2.4"
type: dropdown
caseStudy: az400-cs4a-humongous-insurance
difficulty: 1
status: draft
stem:
  en: |
    You need to write the query in log-claims that meets the monitoring requirement. How should you complete the query? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez écrire dans log-claims la requête qui satisfait l'exigence de supervision. Comment devez-vous compléter la requête ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: kusto
  template: |
    [[table]]
    | where TimeGenerated > ago(24h)
    | where DependencyType == "SQL"
    | summarize Duration = [[agg]] by bin(TimeGenerated, 1h)
    | render [[chart]]
  slots:
    - id: table
      options:
        - { id: req, text: AppRequests }
        - { id: dep, text: AppDependencies }
        - { id: trc, text: AppTraces }
    - id: agg
      options:
        - { id: avg, text: "avg(DurationMs)" }
        - { id: max, text: "max(DurationMs)" }
        - { id: pct, text: "percentile(DurationMs, 95)" }
        - { id: cnt, text: "count()" }
    - id: chart
      options:
        - { id: time, text: timechart }
        - { id: pie, text: piechart }
        - { id: tbl, text: table }
answer:
  values: { table: dep, agg: pct, chart: time }
explanation:
  correct:
    en: |
      Calls that claims-api makes to claimsdb are dependency calls, stored in AppDependencies with the type SQL and their duration in DurationMs. The percentile() aggregation returns the 95th percentile for each hourly bin, and render timechart draws the result as a chart over time.
    fr: |
      Les appels de claims-api vers claimsdb sont des appels de dépendance, stockés dans AppDependencies avec le type SQL et leur durée dans DurationMs. L'agrégation percentile() renvoie le 95e centile pour chaque intervalle d'une heure, et render timechart dessine le résultat sous forme de graphique dans le temps.
  options:
    req:
      en: |
        AppRequests contains the requests that claims-api receives, not the calls it makes to the database, and it has no DependencyType column.
      fr: |
        AppRequests contient les requêtes reçues par claims-api, pas les appels qu'elle effectue vers la base de données, et ne possède pas de colonne DependencyType.
    avg:
      en: |
        The average hides the slowest calls; the requirement asks for the 95th percentile.
      fr: |
        La moyenne masque les appels les plus lents ; l'exigence demande le 95e centile.
references:
  - title: Azure Monitor Logs reference - AppDependencies
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/reference/tables/appdependencies
