id: az400-5a-monitor-alerts-check
objective: "5.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Tailspin Toys deploys a web app by using a multi-stage YAML pipeline in Azure Pipelines. The **Staging** stage deploys to an environment named **staging**, and the **Production** stage deploys to an environment named **production**. Azure Monitor alert rules watch the failure rate and response time of the staging app.

    You need to ensure that the Production stage waits while any of these alert rules is activated, and starts automatically once no alert is activated. The solution must minimize administrative effort.

    What should you add to the production environment?
  fr: |
    Tailspin Toys déploie une application web avec un pipeline YAML multiphase dans Azure Pipelines. La phase **Staging** déploie vers un environnement nommé **staging**, et la phase **Production** déploie vers un environnement nommé **production**. Des règles d'alerte Azure Monitor surveillent le taux d'échec et le temps de réponse de l'application de préproduction.

    Vous devez faire en sorte que la phase Production attende tant que l'une de ces règles d'alerte est activée, et démarre automatiquement dès qu'aucune alerte n'est activée. La solution doit réduire au minimum l'effort d'administration.

    Que devez-vous ajouter à l'environnement production ?
body:
  options:
    - { id: a, text: { en: "A Business Hours check", fr: "Une vérification Business Hours" } }
    - { id: b, text: { en: "An approval assigned to the operations team", fr: "Une approbation attribuée à l'équipe d'exploitation" } }
    - { id: c, text: { en: "A Query Azure Monitor alerts check", fr: "Une vérification Query Azure Monitor alerts" } }
    - { id: d, text: { en: "An Exclusive lock check", fr: "Une vérification Exclusive lock" } }
answer: { optionId: c }
explanation:
  correct:
    en: The Query Azure Monitor alerts check succeeds only if no alert rule is activated when it is evaluated. It is re-evaluated at the interval set by Time between evaluations, so the stage starts on its own as soon as the alerts clear, or fails when the timeout is reached.
    fr: "La vérification Query Azure Monitor alerts ne réussit que si aucune règle d'alerte n'est activée au moment de l'évaluation. Elle est réévaluée à l'intervalle défini par Time between evaluations : la phase démarre d'elle-même dès que les alertes disparaissent, ou échoue quand le délai d'expiration est atteint."
  options:
    a: { en: "Business Hours only lets the stage run during a time window; it does not look at Azure Monitor alerts.", fr: "Business Hours n'autorise la phase que dans une plage horaire ; elle ne consulte pas les alertes Azure Monitor." }
    b: { en: "An approval requires a person to check the alerts and approve each run, which adds administrative effort and is not automatic.", fr: "Une approbation exige qu'une personne consulte les alertes et approuve chaque exécution, ce qui ajoute de l'effort d'administration et n'est pas automatique." }
    d: { en: "Exclusive lock only prevents several runs from using the environment at the same time.", fr: "Exclusive lock empêche seulement plusieurs exécutions d'utiliser l'environnement en même temps." }
references:
  - title: Define approvals and checks
    url: https://learn.microsoft.com/en-us/azure/devops/pipelines/process/approvals
