id: az400-sr2-kql-failures-1
objective: "5.2.4"
type: series_yesno
series: az400-sr2-kql-failures
seriesOrder: 1
difficulty: 3
status: draft
stem:
  en: You summarize failed requests by Name and hourly bins, then use top 5.
  fr: Vous agrégez les requêtes en échec par Name et par intervalles d'une heure, puis utilisez top 5.
body:
  solution:
    en: |
      You run the following query.

      ```kusto
      AppRequests
      | where TimeGenerated > ago(24h)
      | where AppRoleName == "checkout-api" and Success == false
      | summarize FailedCount = count() by Name, bin(TimeGenerated, 1h)
      | top 5 by FailedCount desc
      ```
    fr: |
      Vous exécutez la requête suivante.

      ```kusto
      AppRequests
      | where TimeGenerated > ago(24h)
      | where AppRoleName == "checkout-api" and Success == false
      | summarize FailedCount = count() by Name, bin(TimeGenerated, 1h)
      | top 5 by FailedCount desc
      ```
answer: { value: false }
explanation:
  correct:
    en: Grouping by `bin(TimeGenerated, 1h)` as well as `Name` produces one row per operation and per hour, so `top 5` returns the five busiest operation-hour pairs. The same operation can appear several times, and the counts are not the 24-hour totals per operation.
    fr: "Le regroupement par `bin(TimeGenerated, 1h)` en plus de `Name` produit une ligne par opération et par heure : `top 5` renvoie les cinq couples opération-heure les plus élevés. La même opération peut apparaître plusieurs fois, et les nombres ne sont pas les totaux sur 24 heures par opération."
