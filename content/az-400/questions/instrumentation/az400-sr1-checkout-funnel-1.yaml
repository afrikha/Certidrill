series: az400-sr1-checkout-funnel
seriesOrder: 1
difficulty: 2
status: draft
stem:
  en: You use the User Flows tool, starting from CheckoutStarted.
  fr: Vous utilisez l'outil User Flows, à partir de CheckoutStarted.
body:
  solution:
    en: |
      In the Application Insights resource, you open **User Flows**, select the **CheckoutStarted** custom event as the initial event, and show the steps after it.
    fr: |
      Dans la ressource Application Insights, vous ouvrez **User Flows**, sélectionnez l'événement personnalisé **CheckoutStarted** comme événement initial et affichez les étapes qui le suivent.
answer: { value: false }
explanation:
  correct:
    en: User Flows is designed for exploratory path analysis; it shows every path that users take before or after an event, and by default it samples only the last 24 hours of page views and custom events. When the ordered sequence is already known and step-by-step conversion rates are needed, Funnels is the tool to use.
    fr: "User Flows est conçu pour l'analyse exploratoire des parcours : il montre tous les chemins empruntés par les utilisateurs avant ou après un événement et, par défaut, il n'échantillonne que les dernières 24 heures de vues de page et d'événements personnalisés. Lorsque la séquence ordonnée est déjà connue et que des taux de conversion étape par étape sont nécessaires, il faut utiliser Funnels."
references:
  - title: Usage analysis with Application Insights
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/app/usage
