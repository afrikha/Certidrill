id: az400-5a-audit-stream-order
objective: "5.1.1"
type: ordering
difficulty: 1
status: draft
stem:
  en: |
    Fabrikam has an Azure DevOps organization backed by Microsoft Entra ID. Auditing has never been turned on. The security team already created a Log Analytics workspace named **law-devops-audit** and copied its resource ID and the tenant ID. You are a member of the Project Collection Administrators group.

    You need the audit events of the organization to be sent to law-devops-audit, where they will be kept for two years.

    Which three actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Fabrikam dispose d'une organisation Azure DevOps adossée à Microsoft Entra ID. L'audit n'a jamais été activé. L'équipe de sécurité a déjà créé un espace de travail Log Analytics nommé **law-devops-audit** et copié son ID de ressource ainsi que l'ID de locataire. Vous êtes membre du groupe Project Collection Administrators.

    Les événements d'audit de l'organisation doivent être envoyés à law-devops-audit, où ils seront conservés deux ans.

    Quelles sont les trois actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - { id: policy, text: { en: "In Organization settings, turn on auditing in the organization policies.", fr: "Dans Organization settings, activer l'audit dans les stratégies de l'organisation." } }
    - { id: stream, text: { en: "In Organization settings > Auditing > Streams, select New stream and choose Azure Monitor Logs.", fr: "Dans Organization settings > Auditing > Streams, sélectionner New stream et choisir Azure Monitor Logs." } }
    - { id: ids, text: { en: "Enter the resource ID of the workspace and the tenant ID, and then sign in to Azure.", fr: "Saisir l'ID de ressource de l'espace de travail et l'ID de locataire, puis se connecter à Azure." } }
    - { id: diag, text: { en: "In the Azure portal, create a diagnostic setting for the Azure DevOps organization.", fr: "Dans le portail Azure, créer un paramètre de diagnostic pour l'organisation Azure DevOps." } }
    - { id: dcr, text: { en: "Create a data collection rule that targets law-devops-audit.", fr: "Créer une règle de collecte de données qui cible law-devops-audit." } }
    - { id: export, text: { en: "Export the audit log to a CSV file from the Auditing page.", fr: "Exporter le journal d'audit dans un fichier CSV depuis la page Auditing." } }
answer:
  sequence: [ policy, stream, ids ]
explanation:
  correct:
    en: |
      Auditing is off by default, and the Auditing page does not appear in Organization settings until an administrator turns it on in the organization policies. You then create a stream on the Streams tab with Azure Monitor Logs as the target, enter the workspace resource ID and the tenant ID, and sign in so that Azure DevOps can validate access to the workspace. Events arrive in the AzureDevOpsAuditing table, and the workspace retention can be extended beyond the 90 days that Azure DevOps keeps.
    fr: |
      L'audit est désactivé par défaut, et la page Auditing n'apparaît pas dans Organization settings tant qu'un administrateur ne l'a pas activé dans les stratégies de l'organisation. Vous créez ensuite un flux dans l'onglet Streams avec Azure Monitor Logs comme cible, vous saisissez l'ID de ressource de l'espace de travail et l'ID de locataire, puis vous vous connectez pour qu'Azure DevOps valide l'accès à l'espace de travail. Les événements arrivent dans la table AzureDevOpsAuditing, et la rétention de l'espace de travail peut dépasser les 90 jours conservés par Azure DevOps.
  options:
    diag: { en: "An Azure DevOps organization is not an Azure resource with diagnostic settings; audit events leave Azure DevOps through audit streams.", fr: "Une organisation Azure DevOps n'est pas une ressource Azure dotée de paramètres de diagnostic ; les événements d'audit sortent d'Azure DevOps par des flux d'audit." }
    dcr: { en: "Data collection rules drive the Azure Monitor Agent and other collection scenarios, not Azure DevOps auditing.", fr: "Les règles de collecte de données pilotent l'agent Azure Monitor et d'autres scénarios de collecte, pas l'audit Azure DevOps." }
    export: { en: "A one-time export does not send new events continuously to the workspace.", fr: "Un export ponctuel n'envoie pas les nouveaux événements en continu vers l'espace de travail." }
references:
  - title: Create audit streaming for Azure DevOps
    url: https://learn.microsoft.com/en-us/azure/devops/organizations/audit/auditing-streaming
