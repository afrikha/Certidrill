id: az400-5a-audit-stream-order
objective: "5.1.1"
type: ordering
difficulty: 1
status: draft
stem:
  en: |
    Fabrikam tracks the bugs of its order service in a GitHub repository named **fabrikam/orders**. A metric alert rule named **ar-orders-5xx** watches the production web app in the Azure subscription **Sub1**. The rule has no action group.

    You need a GitHub issue to be opened automatically in fabrikam/orders each time ar-orders-5xx fires, with the alert rule name and the severity in the title. No custom code may be written or hosted.

    Which three actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Fabrikam suit les bogues de son service de commandes dans un dépôt GitHub nommé **fabrikam/orders**. Une règle d'alerte de métrique nommée **ar-orders-5xx** surveille l'application web de production de l'abonnement Azure **Sub1**. La règle n'a aucun groupe d'actions.

    Une issue GitHub doit être ouverte automatiquement dans fabrikam/orders chaque fois que ar-orders-5xx se déclenche, avec le nom de la règle d'alerte et la gravité dans le titre. Aucun code personnalisé ne doit être écrit ni hébergé.

    Quelles sont les trois actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - { id: logicapp, text: { en: "Create a logic app with the When a HTTP request is received trigger and the Create an issue action of the GitHub connector.", fr: "Créer une application logique avec le déclencheur When a HTTP request is received et l'action Create an issue du connecteur GitHub." } }
    - { id: actiongroup, text: { en: "Create an action group with a Logic App action that calls the logic app, with the common alert schema enabled.", fr: "Créer un groupe d'actions avec une action Logic App qui appelle l'application logique, avec le schéma d'alerte courant activé." } }
    - { id: link, text: { en: "Edit ar-orders-5xx and select the action group on the Actions tab.", fr: "Modifier ar-orders-5xx et sélectionner le groupe d'actions dans l'onglet Actions." } }
    - { id: diag, text: { en: "Create a diagnostic setting on the web app that sends its metrics to fabrikam/orders.", fr: "Créer sur l'application web un paramètre de diagnostic qui envoie ses métriques vers fabrikam/orders." } }
    - { id: ghwebhook, text: { en: "In fabrikam/orders, add a repository webhook for the Issues event.", fr: "Dans fabrikam/orders, ajouter un webhook de dépôt pour l'événement Issues." } }
    - { id: dcr, text: { en: "Create a data collection rule that sends the alerts of Sub1 to the logic app.", fr: "Créer une règle de collecte de données qui envoie les alertes de Sub1 à l'application logique." } }
answer:
  sequence: [ logicapp, actiongroup, link ]
explanation:
  correct:
    en: |
      The logic app comes first: its HTTP request trigger receives the alert payload, and the GitHub connector's Create an issue action builds the title from the alert fields, without custom code. The action group's Logic App action needs an existing logic app to select, and the common alert schema must be enabled so that the payload matches the trigger's schema. Finally, the alert rule calls the action group once you select it on the rule's Actions tab.
    fr: |
      L'application logique vient en premier : son déclencheur de requête HTTP reçoit la charge utile de l'alerte, et l'action Create an issue du connecteur GitHub construit le titre à partir des champs de l'alerte, sans code personnalisé. L'action Logic App du groupe d'actions exige une application logique existante à sélectionner, et le schéma d'alerte courant doit être activé pour que la charge utile corresponde au schéma du déclencheur. Enfin, la règle d'alerte appelle le groupe d'actions une fois celui-ci sélectionné dans l'onglet Actions de la règle.
  options:
    diag: { en: "A diagnostic setting routes metrics and resource logs to a storage account, an event hub or a workspace; it can't target a GitHub repository or react to an alert.", fr: "Un paramètre de diagnostic achemine des métriques et des journaux de ressources vers un compte de stockage, un hub d'événements ou un espace de travail ; il ne peut pas cibler un dépôt GitHub ni réagir à une alerte." }
    ghwebhook: { en: "A repository webhook sends GitHub events to an external endpoint; it doesn't receive Azure Monitor alerts or create issues.", fr: "Un webhook de dépôt envoie des événements GitHub vers un point de terminaison externe ; il ne reçoit pas les alertes Azure Monitor et ne crée pas d'issues." }
    dcr: { en: "Data collection rules define what the Azure Monitor Agent and other collection scenarios collect; alert rules call action groups, not data collection rules.", fr: "Les règles de collecte de données définissent ce que collectent l'agent Azure Monitor et d'autres scénarios de collecte ; les règles d'alerte appellent des groupes d'actions, pas des règles de collecte de données." }
references:
  - title: Customize alert notifications by using Logic Apps
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/alerts/alerts-logic-apps
  - title: GitHub - Connectors
    url: https://learn.microsoft.com/en-us/connectors/github/
