id: az400-sr1-checkout-funnel-3
objective: "5.2.2"
type: series_yesno
series: az400-sr1-checkout-funnel
seriesOrder: 3
difficulty: 2
status: draft
stem:
  en: You use the User Retention Analysis workbook for the CheckoutStarted event.
  fr: Vous utilisez le classeur User Retention Analysis pour l'événement CheckoutStarted.
body:
  solution:
    en: |
      In the Application Insights resource, you open the **User Retention Analysis** workbook, filter it on the CheckoutStarted and OrderConfirmed events, and set the time range to the last 30 days.
    fr: |
      Dans la ressource Application Insights, vous ouvrez le classeur **User Retention Analysis**, le filtrez sur les événements CheckoutStarted et OrderConfirmed, et définissez la plage de temps sur les 30 derniers jours.
answer: { value: false }
explanation:
  correct:
    en: The User Retention Analysis workbook measures how often users return to the application and use features over successive time periods, with one row per cohort of users. It does not report the conversion through the intermediate ShippingEntered and PaymentSubmitted steps in order; a funnel does.
    fr: "Le classeur User Retention Analysis mesure la fréquence à laquelle les utilisateurs reviennent dans l'application et utilisent des fonctionnalités sur des périodes successives, avec une ligne par cohorte d'utilisateurs. Il ne rend pas compte de la conversion à travers les étapes intermédiaires ShippingEntered et PaymentSubmitted dans l'ordre ; c'est le rôle d'un entonnoir."
references:
  - title: Usage analysis with Application Insights
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/app/usage
