id: az400-5a-slow-request-order
objective: "5.2.3"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    Since the last release, the operation **POST /api/quotes** of Woodgrove's quote service has become slow. The service and its downstream APIs are instrumented with Application Insights.

    You need to find which component or call of a slow POST /api/quotes transaction takes the most time, by using the Application Insights portal experience.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Depuis la dernière version, l'opération **POST /api/quotes** du service de devis de Woodgrove est devenue lente. Le service et ses API en aval sont instrumentés avec Application Insights.

    Vous devez trouver le composant ou l'appel d'une transaction POST /api/quotes lente qui prend le plus de temps, en utilisant l'expérience Application Insights du portail.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: perf, text: { en: "Open the Performance view of the Application Insights resource.", fr: "Ouvrir la vue Performance de la ressource Application Insights." } }
    - { id: select, text: { en: "Select POST /api/quotes in the list of operations, and then select Drill into to list sample operations.", fr: "Sélectionner POST /api/quotes dans la liste des opérations, puis sélectionner Drill into pour lister des exemples d'opérations." } }
    - { id: sample, text: { en: "Open a slow sample in the end-to-end transaction details.", fr: "Ouvrir un exemple lent dans les détails de transaction de bout en bout." } }
    - { id: gantt, text: { en: "In the Gantt chart, identify the longest bars and check whether they are dependencies or time spent in process.", fr: "Dans le diagramme de Gantt, repérer les barres les plus longues et vérifier s'il s'agit de dépendances ou de temps passé dans le processus." } }
    - { id: live, text: { en: "Open Live metrics and add a custom filter on POST /api/quotes.", fr: "Ouvrir Live metrics et ajouter un filtre personnalisé sur POST /api/quotes." } }
    - { id: annot, text: { en: "Create a release annotation for the last release.", fr: "Créer une annotation de version pour la dernière version." } }
answer:
  sequence: [ perf, select, sample, gantt ]
explanation:
  correct:
    en: |
      Start from the Performance view and select the slow operation, then use Drill into to list sample operations and open one in the end-to-end transaction details. Its Gantt chart shows every request and dependency across the components with their duration; time not covered by any dependency is time spent in process or in calls that are not instrumented.
    fr: |
      Commencez par la vue Performance et sélectionnez l'opération lente, puis utilisez Drill into pour lister des exemples d'opérations et ouvrez-en un dans les détails de transaction de bout en bout. Son diagramme de Gantt montre chaque requête et dépendance des composants avec leur durée ; le temps qui n'est couvert par aucune dépendance est passé dans le processus ou dans des appels non instrumentés.
  options:
    live: { en: "Live metrics shows real-time rates and samples; it does not break down a past transaction call by call.", fr: "Live metrics affiche des taux et des exemples en temps réel ; il ne décompose pas une transaction passée appel par appel." }
    annot: { en: "Azure Pipelines can create release annotations automatically, and they help correlate a regression with a release, but they do not show which call is slow.", fr: "Azure Pipelines peut créer les annotations de version automatiquement, et elles aident à relier une régression à une version, mais elles ne montrent pas quel appel est lent." }
references:
  - title: Investigate failures, performance, and transactions with Application Insights
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/app/failures-performance-transactions
