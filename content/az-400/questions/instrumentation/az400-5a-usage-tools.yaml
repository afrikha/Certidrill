id: az400-5a-usage-tools
objective: "5.2.2"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Wingtip Toys has an online store instrumented with the Application Insights JavaScript SDK, including custom events. The product team asks four questions.

    Which Application Insights tool should you use to answer each question? To answer, drag the appropriate tools to the correct questions. Each tool may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Wingtip Toys dispose d'une boutique en ligne instrumentée avec le SDK JavaScript d'Application Insights, y compris des événements personnalisés. L'équipe produit pose quatre questions.

    Quel outil d'Application Insights devez-vous utiliser pour répondre à chaque question ? Pour répondre, faites glisser les outils appropriés vers les questions correspondantes. Chaque outil peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: users, text: Users }
    - { id: sessions, text: Sessions }
    - { id: funnels, text: Funnels }
    - { id: flows, text: User Flows }
    - { id: cohorts, text: Cohorts }
    - { id: retention, text: User Retention Analysis }
  targets:
    - { id: conv, text: { en: "What percentage of visitors go from the product page to the cart and then to payment, in that order?", fr: "Quel pourcentage de visiteurs passe de la page produit au panier, puis au paiement, dans cet ordre ?" } }
    - { id: back, text: { en: "How many users who used the wish list in a given week come back in the following weeks?", fr: "Combien d'utilisateurs ayant utilisé la liste de souhaits une semaine donnée reviennent les semaines suivantes ?" } }
    - { id: group, text: { en: "Define once the users active on five or more days in the last 28 days, and reuse that group in other usage tools", fr: "Définir une fois les utilisateurs actifs cinq jours ou plus au cours des 28 derniers jours, et réutiliser ce groupe dans d'autres outils d'utilisation" } }
    - { id: country, text: { en: "How many unique users visited the store last month, by country or region?", fr: "Combien d'utilisateurs uniques ont visité la boutique le mois dernier, par pays ou région ?" } }
answer:
  mapping: { conv: funnels, back: retention, group: cohorts, country: users }
explanation:
  correct:
    en: Funnels measure conversion through a known, ordered sequence of up to six steps. The User Retention Analysis workbook shows how often users return. Cohorts are reusable groups of users, sessions or events defined by a query and usable in Users, Sessions, Events and User Flows. Users counts unique users and can split them by properties such as country or region.
    fr: Funnels mesure la conversion le long d'une séquence connue et ordonnée de six étapes au plus. Le classeur User Retention Analysis montre à quelle fréquence les utilisateurs reviennent. Cohorts définit des groupes réutilisables d'utilisateurs, de sessions ou d'événements à partir d'une requête, utilisables dans Users, Sessions, Events et User Flows. Users compte les utilisateurs uniques et peut les ventiler par propriétés comme le pays ou la région.
  options:
    sessions: { en: "Sessions counts periods of activity, not unique users or conversion.", fr: "Sessions compte des périodes d'activité, pas des utilisateurs uniques ni une conversion." }
    flows: { en: "User Flows explores the paths users take from a starting event when the sequence is not known in advance.", fr: "User Flows explore les chemins suivis par les utilisateurs à partir d'un événement de départ quand la séquence n'est pas connue à l'avance." }
references:
  - title: Usage analysis with Application Insights
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/app/usage
