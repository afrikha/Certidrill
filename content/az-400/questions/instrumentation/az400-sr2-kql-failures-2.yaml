id: az400-sr2-kql-failures-2
objective: "5.2.4"
type: series_yesno
series: az400-sr2-kql-failures
seriesOrder: 2
difficulty: 2
status: draft
stem:
  en: You summarize failed requests by Name, sort descending, then take 5.
  fr: Vous agrégez les requêtes en échec par Name, triez par ordre décroissant, puis utilisez take 5.
body:
  solution:
    en: |
      You run the following query.

      ```kusto
      AppRequests
      | where TimeGenerated > ago(1d)
      | where AppRoleName == "checkout-api" and Success == false
      | summarize FailedCount = count() by Name
      | sort by FailedCount desc
      | take 5
      ```
    fr: |
      Vous exécutez la requête suivante.

      ```kusto
      AppRequests
      | where TimeGenerated > ago(1d)
      | where AppRoleName == "checkout-api" and Success == false
      | summarize FailedCount = count() by Name
      | sort by FailedCount desc
      | take 5
      ```
answer: { value: true }
explanation:
  correct:
    en: "`ago(1d)` covers the last 24 hours, and `Success == false` keeps only the failed requests of checkout-api. `summarize ... by Name` returns one total per operation; because the rows are sorted before `take`, `take 5` returns the five highest counts, which gives the same result as `top 5 by FailedCount desc`."
    fr: "`ago(1d)` couvre les dernières 24 heures, et `Success == false` ne conserve que les requêtes en échec de checkout-api. `summarize ... by Name` renvoie un total par opération ; comme les lignes sont triées avant `take`, `take 5` renvoie les cinq nombres les plus élevés, ce qui donne le même résultat que `top 5 by FailedCount desc`."
references:
  - title: take operator - Kusto
    url: https://learn.microsoft.com/en-us/kusto/query/take-operator
