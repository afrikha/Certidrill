id: az400-5a-correlation-ids
objective: "5.2.3"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    Tailspin's **web-front** service calls the **orders-api** service, which calls an Azure SQL database. Both services send telemetry to the same Log Analytics workspace. For one slow checkout, a query on AppRequests and AppDependencies returns the following rows (DurationMs in milliseconds; all rows have the OperationId 0af7651916cd43dd8448eb211c80319c).

    | Table | AppRoleName | Name | Id | ParentId | DurationMs |
    | --- | --- | --- | --- | --- | --- |
    | AppRequests | web-front | GET /checkout | b7ad6b7169203331 | | 1450 |
    | AppDependencies | web-front | POST /orders | 00f067aa0ba902b7 | b7ad6b7169203331 | 1320 |
    | AppRequests | orders-api | POST /orders | 5fb6d2a3c41e9087 | 00f067aa0ba902b7 | 1290 |
    | AppDependencies | orders-api | sqldb-orders | 9c4e1b7a2d8f3065 | 5fb6d2a3c41e9087 | 1180 |

    Which two statements are true?

    NOTE: Each correct selection is worth one point.
  fr: |
    Le service **web-front** de Tailspin appelle le service **orders-api**, qui appelle une base de données Azure SQL. Les deux services envoient leur télémétrie au même espace de travail Log Analytics. Pour un paiement lent, une requête sur AppRequests et AppDependencies renvoie les lignes suivantes (DurationMs en millisecondes ; toutes les lignes ont l'OperationId 0af7651916cd43dd8448eb211c80319c).

    | Table | AppRoleName | Name | Id | ParentId | DurationMs |
    | --- | --- | --- | --- | --- | --- |
    | AppRequests | web-front | GET /checkout | b7ad6b7169203331 | | 1450 |
    | AppDependencies | web-front | POST /orders | 00f067aa0ba902b7 | b7ad6b7169203331 | 1320 |
    | AppRequests | orders-api | POST /orders | 5fb6d2a3c41e9087 | 00f067aa0ba902b7 | 1290 |
    | AppDependencies | orders-api | sqldb-orders | 9c4e1b7a2d8f3065 | 5fb6d2a3c41e9087 | 1180 |

    Quelles sont les deux affirmations vraies ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "The four rows belong to four different operations because their Id values differ.", fr: "Les quatre lignes appartiennent à quatre opérations différentes, car leurs valeurs Id diffèrent." } }
    - { id: b, text: { en: "Most of the checkout duration is spent in the code of web-front, outside any dependency call.", fr: "La majeure partie de la durée du paiement est passée dans le code de web-front, en dehors de tout appel de dépendance." } }
    - { id: c, text: { en: "GET /checkout is the root of the distributed operation.", fr: "GET /checkout est la racine de l'opération distribuée." } }
    - { id: d, text: { en: "The SQL dependency of orders-api was called directly by GET /checkout.", fr: "La dépendance SQL de orders-api a été appelée directement par GET /checkout." } }
    - { id: e, text: { en: "The request received by orders-api was triggered by the outgoing call that web-front recorded as a dependency.", fr: "La requête reçue par orders-api a été déclenchée par l'appel sortant que web-front a enregistré comme dépendance." } }
answer: { optionIds: [ c, e ] }
explanation:
  correct:
    en: All the telemetry of a distributed operation shares the same OperationId, and ParentId holds the ID of the immediate parent. GET /checkout has no parent, so it is the root. The ParentId of the orders-api request equals the Id of the web-front dependency, which links the outgoing call to the request it triggered. The SQL call accounts for 1,180 of the 1,450 ms, so the time is spent in the database, not in web-front's code.
    fr: "Toute la télémétrie d'une opération distribuée partage le même OperationId, et ParentId contient l'ID du parent immédiat. GET /checkout n'a pas de parent, c'est donc la racine. Le ParentId de la requête d'orders-api est égal à l'Id de la dépendance de web-front, ce qui relie l'appel sortant à la requête qu'il a déclenchée. L'appel SQL représente 1 180 des 1 450 ms : le temps est passé dans la base de données, pas dans le code de web-front."
  options:
    a: { en: "Id identifies each request or dependency; the shared OperationId shows that the rows belong to one operation.", fr: "Id identifie chaque requête ou dépendance ; l'OperationId commun montre que les lignes appartiennent à une seule opération." }
    b: { en: "The dependency call to orders-api covers 1,320 of the 1,450 ms, so little time is spent in web-front's own code.", fr: "L'appel de dépendance vers orders-api couvre 1 320 des 1 450 ms : peu de temps est passé dans le code propre de web-front." }
    d: { en: "The ParentId of the SQL dependency is the Id of the orders-api request, not of GET /checkout.", fr: "Le ParentId de la dépendance SQL est l'Id de la requête d'orders-api, pas celui de GET /checkout." }
references:
  - title: Application Insights telemetry data model
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/app/data-model-complete
