id: az400-5a-devops-integrations
objective: "5.1.1"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Adatum uses Azure Pipelines to deploy an App Service web app instrumented with Application Insights, and Azure Monitor to watch it. The DevOps team has four requirements.

    Which feature should you use for each requirement? To answer, drag the appropriate features to the correct requirements. Each feature may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum utilise Azure Pipelines pour déployer une application web App Service instrumentée avec Application Insights, et Azure Monitor pour la superviser. L'équipe DevOps a quatre exigences.

    Quelle fonctionnalité devez-vous utiliser pour chaque exigence ? Pour répondre, faites glisser les fonctionnalités appropriées vers les exigences correspondantes. Chaque fonctionnalité peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: check, text: { en: "Query Azure Monitor alerts check", fr: "Vérification Query Azure Monitor alerts" } }
    - { id: annot, text: { en: "Release annotations", fr: "Annotations de version" } }
    - { id: stream, text: { en: "Audit stream to Azure Monitor Logs", fr: "Flux d'audit vers les journaux Azure Monitor" } }
    - { id: ag, text: { en: "Action group", fr: "Groupe d'actions" } }
    - { id: hook, text: { en: "Service hook", fr: "Hook de service" } }
    - { id: diag, text: { en: "Diagnostic setting", fr: "Paramètre de diagnostic" } }
  targets:
    - { id: gate, text: { en: "Keep the production stage waiting while an alert rule on the app is activated", fr: "Faire attendre la phase de production tant qu'une règle d'alerte sur l'application est activée" } }
    - { id: marker, text: { en: "Show each deployment as a marker on the Performance and Failures charts of Application Insights", fr: "Afficher chaque déploiement sous forme de repère sur les graphiques Performance et Failures d'Application Insights" } }
    - { id: retain, text: { en: "Keep the Azure DevOps audit events for two years and query them with KQL", fr: "Conserver les événements d'audit Azure DevOps deux ans et les interroger en KQL" } }
    - { id: runbook, text: { en: "Start an Azure Automation runbook when the response-time alert fires", fr: "Démarrer un runbook Azure Automation quand l'alerte sur le temps de réponse se déclenche" } }
answer:
  mapping: { gate: check, marker: annot, retain: stream, runbook: ag }
explanation:
  correct:
    en: The Query Azure Monitor alerts check passes only when no alert rule is activated. Release annotations mark deployments on the Performance, Failures and Usage charts, and Azure Pipelines creates them automatically with supported deployment tasks. An audit stream sends Azure DevOps audit events to the AzureDevOpsAuditing table, where workspace retention can exceed the 90 days kept by Azure DevOps. An action group attached to the alert rule can run an Automation runbook.
    fr: La vérification Query Azure Monitor alerts ne réussit que si aucune règle d'alerte n'est activée. Les annotations de version marquent les déploiements sur les graphiques Performance, Failures et Usage, et Azure Pipelines les crée automatiquement avec les tâches de déploiement prises en charge. Un flux d'audit envoie les événements d'audit Azure DevOps vers la table AzureDevOpsAuditing, où la rétention de l'espace de travail peut dépasser les 90 jours conservés par Azure DevOps. Un groupe d'actions associé à la règle d'alerte peut exécuter un runbook Automation.
  options:
    hook: { en: "A service hook sends Azure DevOps events to other services; it does not react to Azure Monitor alerts.", fr: "Un hook de service envoie des événements Azure DevOps vers d'autres services ; il ne réagit pas aux alertes Azure Monitor." }
    diag: { en: "A diagnostic setting routes the resource logs of an Azure resource; the Azure DevOps organization uses audit streams instead.", fr: "Un paramètre de diagnostic achemine les journaux de ressources d'une ressource Azure ; l'organisation Azure DevOps utilise des flux d'audit à la place." }
references:
  - title: Define approvals and checks
    url: https://learn.microsoft.com/en-us/azure/devops/pipelines/process/approvals
  - title: Investigate failures, performance, and transactions with Application Insights
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/app/failures-performance-transactions
