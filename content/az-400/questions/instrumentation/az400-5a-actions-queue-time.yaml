id: az400-5a-actions-queue-time
objective: "5.1.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Woodgrove has a GitHub organization in which hundreds of workflows run on both GitHub-hosted runners and self-hosted runners. Developers complain that some jobs wait a long time before they start. You are an organization owner.

    You need to identify which jobs wait the longest for a runner over the last 30 days, without writing any code.

    What should you use?
  fr: |
    Woodgrove dispose d'une organisation GitHub dans laquelle des centaines de workflows s'exécutent sur des exécuteurs hébergés par GitHub et sur des exécuteurs auto-hébergés. Les développeurs se plaignent que certains travaux attendent longtemps avant de démarrer. Vous êtes propriétaire de l'organisation.

    Vous devez identifier les travaux qui attendent le plus longtemps un exécuteur au cours des 30 derniers jours, sans écrire de code.

    Que devez-vous utiliser ?
body:
  options:
    - { id: a, text: { en: "The Jobs tab of Actions Usage Metrics in the organization insights", fr: "L'onglet Jobs de Actions Usage Metrics dans les insights de l'organisation" } }
    - { id: b, text: { en: "The Jobs tab of Actions Performance Metrics in the organization insights", fr: "L'onglet Jobs de Actions Performance Metrics dans les insights de l'organisation" } }
    - { id: c, text: { en: "The Pulse page in the Insights tab of each repository", fr: "La page Pulse de l'onglet Insights de chaque dépôt" } }
    - { id: d, text: { en: "The Traffic page in the Insights tab of each repository", fr: "La page Traffic de l'onglet Insights de chaque dépôt" } }
answer: { optionId: b }
explanation:
  correct:
    en: Actions Performance Metrics shows average run time, average queue time and failure rates, and can be broken down by workflow, job, repository, runtime OS or runner type. The Jobs tab sorted by queue time shows the jobs that wait longest for a runner over the selected period.
    fr: Actions Performance Metrics affiche la durée moyenne d'exécution, la durée moyenne d'attente en file et les taux d'échec, ventilés par workflow, travail, dépôt, système d'exploitation ou type d'exécuteur. L'onglet Jobs trié par durée d'attente montre les travaux qui attendent le plus longtemps un exécuteur sur la période choisie.
  options:
    a: { en: "Usage metrics show the minutes consumed, which relate to cost, not the time jobs spend waiting in the queue.", fr: "Les métriques d'utilisation montrent les minutes consommées, liées au coût, pas le temps d'attente des travaux dans la file." }
    c: { en: "Pulse summarizes the recent activity of a repository, such as pull requests and issues, not job queue times.", fr: "Pulse résume l'activité récente d'un dépôt, comme les pull requests et les issues, pas les durées d'attente des travaux." }
    d: { en: "Traffic shows visitors and clones of a repository.", fr: "Traffic montre les visiteurs et les clones d'un dépôt." }
references:
  - title: Viewing GitHub Actions metrics for your organization
    url: https://docs.github.com/en/organizations/collaborating-with-groups-in-organizations/viewing-github-actions-metrics-for-your-organization
