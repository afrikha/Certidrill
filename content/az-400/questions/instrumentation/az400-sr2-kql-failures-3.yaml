stem:
  en: You take 5 failed requests, then summarize them by Name.
  fr: Vous prenez 5 requêtes en échec, puis les agrégez par Name.
body:
  solution:
    en: |
      You run the following query.

      ```kusto
      AppRequests
      | where TimeGenerated > ago(24h)
      | where AppRoleName == "checkout-api" and Success == false
      | take 5
      | summarize FailedCount = count() by Name
      | sort by FailedCount desc
      ```
    fr: |
      Vous exécutez la requête suivante.

      ```kusto
      AppRequests
      | where TimeGenerated > ago(24h)
      | where AppRoleName == "checkout-api" and Success == false
      | take 5
      | summarize FailedCount = count() by Name
      | sort by FailedCount desc
      ```
answer: { value: false }
explanation:
  correct:
    en: "`take 5` runs before the aggregation and keeps five arbitrary failed requests, with no guarantee about which records are returned. The `summarize` then counts at most five requests in total, so the result does not reflect the 24-hour failure totals of each operation."
    fr: "`take 5` s'exécute avant l'agrégation et conserve cinq requêtes en échec arbitraires, sans garantie sur les enregistrements renvoyés. `summarize` compte ensuite au plus cinq requêtes au total : le résultat ne reflète pas les totaux d'échecs sur 24 heures de chaque opération."
references:
  - title: take operator - Kusto
    url: https://learn.microsoft.com/en-us/kusto/query/take-operator
