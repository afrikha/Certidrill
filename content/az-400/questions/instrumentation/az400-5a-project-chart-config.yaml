id: az400-5a-project-chart-config
objective: "5.1.3"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    The Contoso mobile team plans its work in a GitHub Project. The project has an Iteration field named **Sprint**, a single-select field named **Status**, and a number field named **Estimate** that holds story points.

    You need to configure a current chart in the project's insights. The chart must show one column per sprint. Each column must be divided by status, and its height must represent the total story points of its items.

    How should you configure the chart? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    L'équipe mobile de Contoso planifie son travail dans un projet GitHub (GitHub Project). Le projet comporte un champ d'itération nommé **Sprint**, un champ à sélection unique nommé **Status** et un champ numérique nommé **Estimate** qui contient les points d'histoire.

    Vous devez configurer un graphique actuel dans les insights du projet. Le graphique doit afficher une colonne par sprint. Chaque colonne doit être divisée par statut, et sa hauteur doit représenter le total des points d'histoire de ses éléments.

    Comment devez-vous configurer le graphique ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      X-axis: [[x]]
      Group by: [[group]]
      Y-axis: [[y]]
    fr: |
      X-axis : [[x]]
      Group by : [[group]]
      Y-axis : [[y]]
  slots:
    - id: x
      options:
        - { id: status, text: Status }
        - { id: time, text: Time }
        - { id: sprint, text: Sprint }
        - { id: assignees, text: Assignees }
    - id: group
      options:
        - { id: none, text: None }
        - { id: g-status, text: Status }
        - { id: g-sprint, text: Sprint }
        - { id: labels, text: Labels }
    - id: y
      options:
        - { id: count, text: { en: "Count of items", fr: "Nombre d'éléments" } }
        - { id: avg, text: { en: "Average of Estimate", fr: "Moyenne de Estimate" } }
        - { id: max, text: { en: "Maximum of Estimate", fr: "Maximum de Estimate" } }
        - { id: sum, text: { en: "Sum of Estimate", fr: "Somme de Estimate" } }
answer:
  values: { x: sprint, group: g-status, y: sum }
explanation:
  correct:
    en: In the Configure panel of a chart, the X-axis field draws one column per value, here one per sprint. Group by, available on current charts, splits each column by a second field such as Status. The Y-axis can aggregate a number field instead of counting items; the sum of Estimate gives the total story points.
    fr: Dans le volet Configure d'un graphique, le champ X-axis dessine une colonne par valeur, ici une par sprint. Group by, disponible sur les graphiques actuels, divise chaque colonne selon un second champ comme Status. Y-axis peut agréger un champ numérique au lieu de compter les éléments ; la somme de Estimate donne le total des points d'histoire.
  options:
    time: { en: "Time on the X-axis makes a historical chart, which tracks items over time instead of per sprint.", fr: "Time sur X-axis crée un graphique historique, qui suit les éléments dans le temps plutôt que par sprint." }
    none: { en: "Without grouping, each column would not be divided by status.", fr: "Sans regroupement, chaque colonne ne serait pas divisée par statut." }
    count: { en: "A count gives the number of items, not the story points.", fr: "Un nombre donne la quantité d'éléments, pas les points d'histoire." }
    avg: { en: "The average gives the mean estimate per item, not the total.", fr: "La moyenne donne l'estimation moyenne par élément, pas le total." }
references:
  - title: Configuring charts
    url: https://docs.github.com/en/issues/planning-and-tracking-with-projects/viewing-insights-from-your-project/configuring-charts
  - title: Insight and automation with projects
    url: https://learn.microsoft.com/en-us/training/modules/manage-work-github-projects/6-insight-automation-with-projects
