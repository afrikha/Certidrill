id: az400-5a-split-vs-filter
objective: "5.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Northwind's build pipelines read and write packages in a storage account named **stnwpackages**. Some builds fail with HTTP 503 errors returned by storage. In metrics explorer, you select the **Transactions** metric of stnwpackages.

    You need a single chart that shows only the requests that failed with ServerBusyError, with one line for each API operation, such as GetBlob or PutBlob.

    How should you configure the chart?
  fr: |
    Les pipelines de build de Northwind lisent et écrivent des packages dans un compte de stockage nommé **stnwpackages**. Certaines builds échouent avec des erreurs HTTP 503 renvoyées par le stockage. Dans Metrics Explorer, vous sélectionnez la métrique **Transactions** de stnwpackages.

    Vous avez besoin d'un seul graphique qui affiche uniquement les requêtes en échec avec ServerBusyError, avec une ligne pour chaque opération d'API, comme GetBlob ou PutBlob.

    Comment devez-vous configurer le graphique ?
body:
  options:
    - { id: a, text: { en: "Add a filter on ApiName, and apply splitting on ResponseType.", fr: "Ajouter un filtre sur ApiName, et appliquer un fractionnement sur ResponseType." } }
    - { id: b, text: { en: "Add a filter on ResponseType, and apply splitting on ApiName.", fr: "Ajouter un filtre sur ResponseType, et appliquer un fractionnement sur ApiName." } }
    - { id: c, text: { en: "Apply splitting on both ResponseType and ApiName, without a filter.", fr: "Appliquer un fractionnement sur ResponseType et sur ApiName, sans filtre." } }
    - { id: d, text: { en: "Add a filter on ResponseType, and change the aggregation to Average.", fr: "Ajouter un filtre sur ResponseType, et changer l'agrégation en Average." } }
answer: { optionId: b }
explanation:
  correct:
    en: Filtering keeps only some values of a dimension, here ResponseType = ServerBusyError, the authenticated requests that returned HTTP 503. Splitting draws a separate line for each value of a dimension, here one per ApiName, up to 50 values (10 by default).
    fr: Le filtrage ne conserve que certaines valeurs d'une dimension, ici ResponseType = ServerBusyError, les requêtes authentifiées qui ont renvoyé HTTP 503. Le fractionnement trace une ligne distincte pour chaque valeur d'une dimension, ici une par ApiName, jusqu'à 50 valeurs (10 par défaut).
  options:
    a: { en: "This inverts the two settings; it would show one line per response type for the selected operations.", fr: "Cette configuration inverse les deux réglages : elle afficherait une ligne par type de réponse pour les opérations sélectionnées." }
    c: { en: "Without a filter, the chart also shows successful and other failed requests, one line per combination.", fr: "Sans filtre, le graphique affiche aussi les requêtes réussies et les autres échecs, une ligne par combinaison." }
    d: { en: "Changing the aggregation does not draw one line per operation.", fr: "Changer l'agrégation ne trace pas une ligne par opération." }
references:
  - title: Analyze metrics with Azure Monitor metrics explorer
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/essentials/metrics-charts
  - title: Azure Blob Storage monitoring data reference
    url: https://learn.microsoft.com/en-us/azure/storage/blobs/monitor-blob-storage-reference
