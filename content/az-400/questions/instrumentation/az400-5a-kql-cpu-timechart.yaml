id: az400-5a-kql-cpu-timechart
objective: "5.2.4"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    Adatum's Windows build agents send performance counters to a Log Analytics workspace, in the Perf table.

    You need a query that charts, for each agent, the average total processor time in 5-minute intervals over the last hour.

    How should you complete the query? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Les agents de build Windows d'Adatum envoient des compteurs de performances à un espace de travail Log Analytics, dans la table Perf.

    Vous avez besoin d'une requête qui représente dans un graphique, pour chaque agent, la moyenne du temps processeur total par intervalles de 5 minutes au cours de la dernière heure.

    Comment devez-vous compléter la requête ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: kusto
  template: |
    Perf
    | where TimeGenerated > ago(1h)
    | where ObjectName == "Processor" and CounterName == [[counter]] and InstanceName == "_Total"
    | summarize avg(CounterValue) by [[bin]], Computer
    | [[render]]
  slots:
    - id: counter
      options:
        - { id: free, text: '"% Free Space"' }
        - { id: cpu, text: '"% Processor Time"' }
        - { id: mem, text: '"Available MBytes"' }
    - id: bin
      options:
        - { id: raw, text: TimeGenerated }
        - { id: ago, text: ago(5m) }
        - { id: bin, text: "bin(TimeGenerated, 5m)" }
        - { id: binval, text: "bin(CounterValue, 5)" }
    - id: render
      options:
        - { id: time, text: render timechart }
        - { id: pie, text: render piechart }
        - { id: card, text: render card }
answer:
  values: { counter: cpu, bin: bin, render: time }
explanation:
  correct:
    en: "% Processor Time of the Processor object with the _Total instance is the total CPU usage. bin(TimeGenerated, 5m) groups the rows into 5-minute intervals, so summarize returns one average per interval and per computer. render timechart, the last operator, draws one line per computer over time."
    fr: "% Processor Time de l'objet Processor avec l'instance _Total correspond à l'utilisation totale du processeur. bin(TimeGenerated, 5m) regroupe les lignes par intervalles de 5 minutes : summarize renvoie une moyenne par intervalle et par ordinateur. render timechart, dernier opérateur, trace une ligne par ordinateur dans le temps."
  options:
    free: { en: "% Free Space belongs to the LogicalDisk object, not to Processor.", fr: "% Free Space appartient à l'objet LogicalDisk, pas à Processor." }
    mem: { en: "Available MBytes belongs to the Memory object.", fr: "Available MBytes appartient à l'objet Memory." }
    raw: { en: "Grouping by the raw TimeGenerated creates one group per timestamp instead of 5-minute intervals.", fr: "Grouper sur TimeGenerated brut crée un groupe par horodatage au lieu d'intervalles de 5 minutes." }
    ago: { en: "ago(5m) returns a single point in time; it does not create intervals.", fr: "ago(5m) renvoie un seul instant ; il ne crée pas d'intervalles." }
    binval: { en: "This bins the counter values, not the time.", fr: "Cette expression regroupe les valeurs du compteur, pas le temps." }
    pie: { en: "A pie chart shows proportions, not a trend over time.", fr: "Un graphique en secteurs montre des proportions, pas une tendance dans le temps." }
references:
  - title: Azure Monitor Logs reference - Perf
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/reference/tables/perf
