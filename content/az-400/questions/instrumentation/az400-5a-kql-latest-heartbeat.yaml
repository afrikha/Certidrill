id: az400-5a-kql-latest-heartbeat
objective: "5.2.4"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    Woodgrove's self-hosted agents send heartbeats to a Log Analytics workspace by using the Azure Monitor Agent.

    You need a query that lists the agents whose most recent heartbeat is more than one day old. For each agent, the query must return the computer name, the OS type and the IP address reported in its most recent heartbeat, and the time of that heartbeat.

    How should you complete the query? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Les agents auto-hébergés de Woodgrove envoient des pulsations (heartbeats) à un espace de travail Log Analytics avec l'agent Azure Monitor.

    Vous avez besoin d'une requête qui liste les agents dont la pulsation la plus récente date de plus d'un jour. Pour chaque agent, la requête doit renvoyer le nom de l'ordinateur, le type de système d'exploitation et l'adresse IP indiqués dans sa pulsation la plus récente, ainsi que l'heure de cette pulsation.

    Comment devez-vous compléter la requête ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: kusto
  template: |
    Heartbeat
    | summarize [[agg]] by Computer
    | where [[filter]]
    | project Computer, OSType, ComputerIP, TimeGenerated
  slots:
    - id: agg
      options:
        - { id: max, text: max(TimeGenerated) }
        - { id: argmax, text: "arg_max(TimeGenerated, *)" }
        - { id: argmin, text: "arg_min(TimeGenerated, *)" }
        - { id: count, text: count() }
    - id: filter
      options:
        - { id: gt, text: TimeGenerated > ago(1d) }
        - { id: lt, text: TimeGenerated < ago(1d) }
        - { id: now, text: TimeGenerated < now(1d) }
answer:
  values: { agg: argmax, filter: lt }
explanation:
  correct:
    en: "arg_max(TimeGenerated, *) returns, for each computer, the whole row with the latest TimeGenerated, so OSType and ComputerIP come from the most recent heartbeat and the TimeGenerated column keeps its name. TimeGenerated < ago(1d) keeps the computers whose latest heartbeat is older than one day."
    fr: "arg_max(TimeGenerated, *) renvoie, pour chaque ordinateur, la ligne entière dont TimeGenerated est le plus récent : OSType et ComputerIP proviennent de la pulsation la plus récente, et la colonne TimeGenerated conserve son nom. TimeGenerated < ago(1d) conserve les ordinateurs dont la dernière pulsation date de plus d'un jour."
  options:
    max: { en: "max() returns only the value, in a column named max_TimeGenerated; OSType, ComputerIP and TimeGenerated are no longer available for project.", fr: "max() ne renvoie que la valeur, dans une colonne nommée max_TimeGenerated ; OSType, ComputerIP et TimeGenerated ne sont plus disponibles pour project." }
    argmin: { en: "arg_min returns the oldest heartbeat of each computer.", fr: "arg_min renvoie la pulsation la plus ancienne de chaque ordinateur." }
    count: { en: "count() returns a number of rows and drops the other columns.", fr: "count() renvoie un nombre de lignes et supprime les autres colonnes." }
    gt: { en: "This keeps the computers that sent a heartbeat during the last day, the opposite of the requirement.", fr: "Cette condition conserve les ordinateurs qui ont envoyé une pulsation au cours du dernier jour, l'inverse de l'exigence." }
    now: { en: "now(1d) returns a time one day in the future.", fr: "now(1d) renvoie une heure située un jour dans le futur." }
references:
  - title: arg_max() (aggregation function)
    url: https://learn.microsoft.com/en-us/kusto/query/arg-max-aggregation-function
  - title: Azure Monitor Logs reference - Heartbeat
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/reference/tables/heartbeat
