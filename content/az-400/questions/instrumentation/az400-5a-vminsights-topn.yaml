id: az400-5a-vminsights-topn
objective: "5.2.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Litware monitors 260 Azure virtual machines with the logs-based experience of VM insights. An operator opens **Monitor > Virtual Machines > Performance** to find the machines that are short of resources.

    Which two statements are true?

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware supervise 260 machines virtuelles Azure avec l'expérience VM Insights basée sur les journaux. Un opérateur ouvre **Monitor > Virtual Machines > Performance** pour trouver les machines qui manquent de ressources.

    Quelles sont les deux affirmations vraies ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "The Available Memory aggregated chart shows the 95th percentile by default.", fr: "Le graphique agrégé Available Memory affiche le 95e centile par défaut." } }
    - { id: b, text: { en: "The time range of the view can go back up to 93 days.", fr: "La plage de temps de la vue peut remonter jusqu'à 93 jours." } }
    - { id: c, text: { en: "Each Top N chart shows the five machines with the worst value for its metric.", fr: "Chaque graphique Top N montre les cinq machines qui ont la pire valeur pour sa métrique." } }
    - { id: d, text: { en: "The Top N List shows 20 machines by default and can load up to 500 machines.", fr: "Top N List affiche 20 machines par défaut et peut en charger jusqu'à 500." } }
    - { id: e, text: { en: "The operator needs the Virtual Machine Contributor role on the VMs to open the view.", fr: "L'opérateur a besoin du rôle Virtual Machine Contributor sur les machines virtuelles pour ouvrir la vue." } }
answer: { optionIds: [ c, d ] }
explanation:
  correct:
    en: Top N Charts show the top five machines per metric, such as the highest CPU utilization or the lowest available memory. The Top N List shows 20 machines by default, sorted by the 95th percentile of CPU, and Load More expands it to 500.
    fr: Les graphiques Top N montrent les cinq premières machines par métrique, comme l'utilisation du processeur la plus élevée ou la mémoire disponible la plus faible. Top N List affiche 20 machines par défaut, triées sur le 95e centile du processeur, et Load More l'étend à 500.
  options:
    a: { en: "Available Memory shows the average and the 5th and 10th percentiles by default, because low values are the problem.", fr: "Available Memory affiche par défaut la moyenne et les 5e et 10e centiles, car ce sont les valeurs basses qui posent problème." }
    b: { en: "The time range of VM insights performance views reaches 30 days.", fr: "La plage de temps des vues de performances de VM Insights atteint 30 jours." }
    e: { en: "Viewing requires only Monitoring Reader on the VMs and on the VM insights data collection rule.", fr: "La consultation exige seulement Monitoring Reader sur les machines virtuelles et sur la règle de collecte de données VM Insights." }
references:
  - title: Analyze the health and status of your virtual machine with Azure Monitor
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/vm/vminsights-performance
