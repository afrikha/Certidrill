id: az400-5a-project-insights-yesno
objective: "5.1.3"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Northwind Traders uses a GitHub Project owned by its organization, on GitHub Enterprise Cloud, to track the issues of three repositories. The team uses the Insights page of the project.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind Traders utilise un projet GitHub appartenant à son organisation, sous GitHub Enterprise Cloud, pour suivre les issues de trois dépôts. L'équipe utilise la page Insights du projet.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: The default Burn up chart shows how the completed and remaining work of the project's issues evolved over a period.
        fr: Le graphique Burn up par défaut montre l'évolution, sur une période, du travail terminé et restant des issues du projet.
    - id: s2
      text:
        en: An issue that you archive from the project is still counted in the project's charts.
        fr: Une issue que vous archivez dans le projet est toujours comptée dans les graphiques du projet.
    - id: s3
      text:
        en: A chart saved in the project's insights can be viewed by anyone who can view the project.
        fr: Un graphique enregistré dans les insights du projet peut être consulté par toute personne qui peut consulter le projet.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: The default chart is a historical Burn up chart that shows finished and remaining work over time. Insights does not track archived or deleted items, so an archived issue leaves the charts. A chart is available to anyone who can view the project.
    fr: "Le graphique par défaut est un graphique historique Burn up qui montre le travail terminé et restant dans le temps. Les insights ne suivent pas les éléments archivés ou supprimés : une issue archivée disparaît des graphiques. Un graphique est accessible à toute personne qui peut consulter le projet."
references:
  - title: About insights for Projects
    url: https://docs.github.com/en/issues/planning-and-tracking-with-projects/viewing-insights-from-your-project/about-insights-for-projects
  - title: Insight and automation with projects
    url: https://learn.microsoft.com/en-us/training/modules/manage-work-github-projects/6-insight-automation-with-projects
