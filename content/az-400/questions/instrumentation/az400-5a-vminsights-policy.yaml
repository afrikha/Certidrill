id: az400-5a-vminsights-policy
objective: "5.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Woodgrove Bank has an Azure subscription named **Sub-Build** that contains 300 Windows and Linux virtual machines used as self-hosted build agents. New agent VMs are created in Sub-Build every day by a pipeline. A VM insights data collection rule already exists.

    You need guest performance data to be collected by VM insights from all the existing VMs and from every VM created later. The solution must minimize administrative effort.

    What should you do?
  fr: |
    Woodgrove Bank dispose d'un abonnement Azure nommé **Sub-Build** qui contient 300 machines virtuelles Windows et Linux utilisées comme agents de build auto-hébergés. Un pipeline crée chaque jour de nouvelles machines virtuelles d'agent dans Sub-Build. Une règle de collecte de données VM Insights existe déjà.

    Les données de performances invitées doivent être collectées par VM Insights sur toutes les machines virtuelles existantes et sur chaque machine virtuelle créée ensuite. La solution doit réduire au minimum l'effort d'administration.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Enable VM insights from the Insights page of each VM, and add the same step to the pipeline that creates the agents.", fr: "Activer VM Insights depuis la page Insights de chaque machine virtuelle, et ajouter la même étape au pipeline qui crée les agents." } }
    - { id: b, text: { en: "Assign the Legacy: Enable Azure Monitor for VMs initiative to Sub-Build, and remediate the existing VMs.", fr: "Attribuer l'initiative Legacy: Enable Azure Monitor for VMs à Sub-Build, et corriger les machines virtuelles existantes." } }
    - { id: c, text: { en: "Create a diagnostic setting on each VM that sends all metrics to a Log Analytics workspace.", fr: "Créer sur chaque machine virtuelle un paramètre de diagnostic qui envoie toutes les métriques vers un espace de travail Log Analytics." } }
    - { id: d, text: { en: "Assign the Enable Azure Monitor for VMs with Azure Monitoring Agent (AMA) initiative to Sub-Build, and remediate the existing VMs.", fr: "Attribuer l'initiative Enable Azure Monitor for VMs with Azure Monitoring Agent (AMA) à Sub-Build, et corriger les machines virtuelles existantes." } }
answer: { optionId: d }
explanation:
  correct:
    en: The VM insights initiative based on the Azure Monitor Agent installs the agent and configures VM insights data collection. Once assigned to the subscription, it applies automatically to VMs created later in that scope; existing VMs need remediation tasks, one per policy definition of the initiative.
    fr: "L'initiative VM Insights basée sur l'agent Azure Monitor installe l'agent et configure la collecte de données VM Insights. Une fois attribuée à l'abonnement, elle s'applique automatiquement aux machines virtuelles créées ensuite dans cette étendue ; les machines virtuelles existantes exigent des tâches de correction, une par définition de stratégie de l'initiative."
  options:
    a: { en: "Enabling each VM by hand and changing the pipeline works but requires far more administrative effort than a policy assignment.", fr: "Activer chaque machine virtuelle à la main et modifier le pipeline fonctionne, mais exige beaucoup plus d'effort d'administration qu'une attribution de stratégie." }
    b: { en: "The legacy initiatives use the Log Analytics agent, which is deprecated; use the AMA-based initiative.", fr: "Les initiatives Legacy utilisent l'agent Log Analytics, qui est déprécié ; utilisez l'initiative basée sur AMA." }
    c: { en: "A diagnostic setting exports host platform metrics only; it does not collect guest performance data for VM insights.", fr: "Un paramètre de diagnostic exporte uniquement les métriques de plateforme de l'hôte ; il ne collecte pas les données de performances invitées pour VM Insights." }
references:
  - title: Enable VM insights using Azure Policy
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/vm/vminsights-enable-policy
