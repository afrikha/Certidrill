id: az400-5a-workitem-template
objective: "5.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso tracks its backlog in a GitHub repository named **contoso/orders**. The developers investigate production failures in the end-to-end transaction details of a workspace-based Application Insights resource named **appi-orders**.

    You need the developers to be able to create a GitHub issue from the transaction they are investigating, prefilled with the exception details and a link back to the transaction.

    What should you configure in appi-orders?
  fr: |
    Contoso suit son backlog dans un dépôt GitHub nommé **contoso/orders**. Les développeurs analysent les défaillances de production dans les détails de transaction de bout en bout d'une ressource Application Insights basée sur un espace de travail, nommée **appi-orders**.

    Les développeurs doivent pouvoir créer une issue GitHub depuis la transaction qu'ils analysent, préremplie avec les détails de l'exception et un lien vers la transaction.

    Que devez-vous configurer dans appi-orders ?
body:
  options:
    - { id: a, text: { en: "A work item template linked to contoso/orders", fr: "Un modèle d'élément de travail lié à contoso/orders" } }
    - { id: b, text: { en: "An action group with a webhook to contoso/orders", fr: "Un groupe d'actions avec un webhook vers contoso/orders" } }
    - { id: c, text: { en: "A release annotation for each deployment of contoso/orders", fr: "Une annotation de version pour chaque déploiement de contoso/orders" } }
    - { id: d, text: { en: "A smart detection rule that emails the contoso/orders maintainers", fr: "Une règle de détection intelligente qui envoie un e-mail aux mainteneurs de contoso/orders" } }
answer: { optionId: a }
explanation:
  correct:
    en: Work item integration lets you create GitHub issues or Azure DevOps work items from Application Insights. You create a template under Configure > Work Items with the repository URL, and then select Create work item in the end-to-end transaction details; the new item is prefilled with the exception details, the operation name and a link to the transaction.
    fr: "L'intégration des éléments de travail permet de créer des issues GitHub ou des éléments de travail Azure DevOps depuis Application Insights. Vous créez un modèle sous Configure > Work Items avec l'URL du dépôt, puis vous sélectionnez Create work item dans les détails de transaction de bout en bout ; le nouvel élément est prérempli avec les détails de l'exception, le nom de l'opération et un lien vers la transaction."
  options:
    b: { en: "An action group runs when an alert fires; it does not let a developer create an issue from the transaction being investigated.", fr: "Un groupe d'actions s'exécute quand une alerte se déclenche ; il ne permet pas à un développeur de créer une issue depuis la transaction qu'il analyse." }
    c: { en: "Release annotations mark deployments on charts; they do not create issues.", fr: "Les annotations de version marquent les déploiements sur les graphiques ; elles ne créent pas d'issues." }
    d: { en: "Smart detection notifies people about anomalies by email; it does not create prefilled GitHub issues.", fr: "La détection intelligente avertit des personnes des anomalies par e-mail ; elle ne crée pas d'issues GitHub préremplies." }
references:
  - title: Work item integration with Application Insights
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/app/release-and-work-item-insights
