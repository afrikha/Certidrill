id: az400-5a-vm-metrics-hotarea
objective: "5.2.1"
type: hotarea
difficulty: 3
status: draft
stem:
  en: |
    Contoso runs a SQL Server test database on an Azure virtual machine named **vm-sqltest1**. The VM size supports Premium storage, and the database files are on a Premium SSD data disk. Integration tests that run against the database have become slow. The following table shows the platform metrics of vm-sqltest1 during the last test run.

    Answer each prompt by selecting the appropriate metric.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso exécute une base de données de test SQL Server sur une machine virtuelle Azure nommée **vm-sqltest1**. La taille de la machine virtuelle prend en charge le stockage Premium, et les fichiers de la base de données se trouvent sur un disque de données SSD Premium. Les tests d'intégration exécutés contre la base de données sont devenus lents. Le tableau suivant présente les métriques de plateforme de vm-sqltest1 pendant la dernière série de tests.

    Répondez à chaque consigne en sélectionnant la métrique appropriée.

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
    - id: p1
      text: { en: "The metric that identifies the resource that limits performance", fr: "La métrique qui identifie la ressource qui limite les performances" }
    - id: p2
      text: { en: "The metric that confirms that I/O requests are waiting to be served by the data disk", fr: "La métrique qui confirme que des requêtes d'E/S attendent d'être traitées par le disque de données" }
  grid:
    header: [{ en: "Metric", fr: "Métrique" }, { en: "Average", fr: "Moyenne" }, { en: "Maximum", fr: "Maximum" }]
    rows:
      - [{ text: Percentage CPU, area: cpu }, { text: "31 %" }, { text: "48 %" }]
      - [{ text: Available Memory Percentage, area: mem }, { text: "38 %" }, { text: "44 %" }]
      - [{ text: Data Disk IOPS Consumed Percentage, area: diskiops }, { text: "99 %" }, { text: "100 %" }]
      - [{ text: Data Disk Bandwidth Consumed Percentage, area: diskbw }, { text: "27 %" }, { text: "35 %" }]
      - [{ text: Data Disk Queue Depth, area: queue }, { text: "38" }, { text: "64" }]
      - [{ text: VM Uncached IOPS Consumed Percentage, area: vmiops }, { text: "18 %" }, { text: "24 %" }]
      - [{ text: Network Out Total, area: net }, { text: "0.4 GB" }, { text: "0.6 GB" }]
answer:
  values: { p1: diskiops, p2: queue }
explanation:
  correct:
    en: Data Disk IOPS Consumed Percentage at 100 % shows that the data disk is at the IOPS limit of its size and performance tier, while VM Uncached IOPS Consumed Percentage stays low, so the VM-level limit is not the cause. Data Disk Queue Depth counts I/O requests waiting for the disk, and a high value confirms that the database waits on storage. CPU, memory, bandwidth and network all have headroom; a faster disk tier or a larger disk addresses the bottleneck.
    fr: Data Disk IOPS Consumed Percentage à 100 % montre que le disque de données atteint la limite d'IOPS de sa taille et de son niveau de performances, alors que VM Uncached IOPS Consumed Percentage reste bas ; la limite au niveau de la machine virtuelle n'est donc pas en cause. Data Disk Queue Depth compte les requêtes d'E/S en attente du disque, et une valeur élevée confirme que la base de données attend le stockage. Le processeur, la mémoire, la bande passante et le réseau ont tous de la marge ; un niveau de disque plus rapide ou un disque plus grand traite le goulot d'étranglement.
references:
  - title: Supported metrics for Microsoft.Compute/virtualMachines
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/reference/supported-metrics/microsoft-compute-virtualmachines-metrics
