id: az400-5a-live-metrics
objective: "5.2.2"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    Adatum deploys an ASP.NET Core web app instrumented with the Microsoft OpenTelemetry Distro. During each production deployment, the release manager watches the request rate, the failure rate and the CPU of the new instances in the **Live metrics** pane of Application Insights.

    Which two statements are true?

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum déploie une application web ASP.NET Core instrumentée avec la Microsoft OpenTelemetry Distro. Pendant chaque déploiement en production, la responsable des versions surveille le taux de requêtes, le taux d'échec et le processeur des nouvelles instances dans le volet **Live metrics** d'Application Insights.

    Quelles sont les deux affirmations vraies ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "The data shown in the pane is kept for 90 days, so yesterday's deployment can be replayed.", fr: "Les données affichées dans le volet sont conservées 90 jours : le déploiement d'hier peut être rejoué." } }
    - { id: b, text: { en: "The data in the pane appears about one second after it is produced.", fr: "Les données du volet apparaissent environ une seconde après avoir été produites." } }
    - { id: c, text: { en: "The data streams to Application Insights continuously, even when nobody has the pane open.", fr: "Les données sont diffusées en continu vers Application Insights, même quand personne n'a ouvert le volet." } }
    - { id: d, text: { en: "The pane requires the classic ASP.NET SDK, because the OpenTelemetry Distro does not support it.", fr: "Le volet exige le SDK ASP.NET classique, car la distribution OpenTelemetry ne le prend pas en charge." } }
    - { id: e, text: { en: "The data streamed to the pane is not charged.", fr: "Les données diffusées vers le volet ne sont pas facturées." } }
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: Live metrics shows data with about one second of latency, and there is no charge for Live Stream data. It is enabled by default in the OpenTelemetry distro for ASP.NET Core.
    fr: Live metrics affiche les données avec environ une seconde de latence, et les données Live Stream ne sont pas facturées. Il est activé par défaut dans la distribution OpenTelemetry pour ASP.NET Core.
  options:
    a: { en: "Live metrics data is not retained; it exists only while it is on the chart. Use the Performance view or Logs for past periods.", fr: "Les données de Live metrics ne sont pas conservées ; elles n'existent que tant qu'elles sont sur le graphique. Utilisez la vue Performance ou Logs pour les périodes passées." }
    c: { en: "Data streams only while the Live metrics pane is open.", fr: "Les données ne sont diffusées que pendant que le volet Live metrics est ouvert." }
    d: { en: "Live metrics is enabled by default for ASP.NET Core in the OpenTelemetry distro; classic ASP.NET is the platform it does not support.", fr: "Live metrics est activé par défaut pour ASP.NET Core dans la distribution OpenTelemetry ; c'est ASP.NET classique qu'elle ne prend pas en charge." }
references:
  - title: "Live metrics: Monitor and diagnose with 1-second latency"
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/app/live-stream
