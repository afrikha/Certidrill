id: az400-5a-appinsights-connection
objective: "5.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Wingtip Toys builds a container image for a Node.js API that is instrumented with the Microsoft OpenTelemetry Distro. A YAML pipeline deploys the same image to three Azure Container Apps environments: dev, test and prod. Each environment has its own workspace-based Application Insights resource.

    You need each deployment to send its telemetry to the Application Insights resource of its environment. The image must not be rebuilt for each environment.

    What should you do?
  fr: |
    Wingtip Toys génère une image conteneur pour une API Node.js instrumentée avec la Microsoft OpenTelemetry Distro. Un pipeline YAML déploie la même image vers trois environnements Azure Container Apps : dev, test et prod. Chaque environnement possède sa propre ressource Application Insights basée sur un espace de travail.

    Chaque déploiement doit envoyer sa télémétrie à la ressource Application Insights de son environnement. L'image ne doit pas être régénérée pour chaque environnement.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Set the OTEL_SERVICE_NAME environment variable of each container app to the name of its Application Insights resource.", fr: "Définir la variable d'environnement OTEL_SERVICE_NAME de chaque application conteneur sur le nom de sa ressource Application Insights." } }
    - { id: b, text: { en: "Set the APPLICATIONINSIGHTS_CONNECTION_STRING environment variable of each container app to the connection string of its resource.", fr: "Définir la variable d'environnement APPLICATIONINSIGHTS_CONNECTION_STRING de chaque application conteneur sur la chaîne de connexion de sa ressource." } }
    - { id: c, text: { en: "Create a diagnostic setting on each container app that sends its logs to the Application Insights resource of the environment.", fr: "Créer sur chaque application conteneur un paramètre de diagnostic qui envoie ses journaux à la ressource Application Insights de l'environnement." } }
    - { id: d, text: { en: "Write the instrumentation key of each resource into the application source code, and select the key at startup.", fr: "Écrire la clé d'instrumentation de chaque ressource dans le code source de l'application, et sélectionner la clé au démarrage." } }
answer: { optionId: b }
explanation:
  correct:
    en: The OpenTelemetry distro reads the connection string from the APPLICATIONINSIGHTS_CONNECTION_STRING environment variable, so the pipeline can set a different value per environment without changing the image. The connection string identifies the target resource and its ingestion endpoint.
    fr: La distribution OpenTelemetry lit la chaîne de connexion dans la variable d'environnement APPLICATIONINSIGHTS_CONNECTION_STRING ; le pipeline peut donc définir une valeur différente par environnement sans modifier l'image. La chaîne de connexion identifie la ressource cible et son point de terminaison d'ingestion.
  options:
    a: { en: "OTEL_SERVICE_NAME sets service.name, which becomes the cloud role name; it does not choose where telemetry is sent.", fr: "OTEL_SERVICE_NAME définit service.name, qui devient le nom de rôle cloud ; elle ne choisit pas la destination de la télémétrie." }
    c: { en: "Diagnostic settings route platform logs and metrics of the resource; they do not carry the application's OpenTelemetry telemetry.", fr: "Les paramètres de diagnostic acheminent les journaux et métriques de plateforme de la ressource ; ils ne transportent pas la télémétrie OpenTelemetry de l'application." }
    d: { en: "Keys stored in code require a code change for every new environment, and the distro is configured with a connection string, not with an instrumentation key alone.", fr: "Des clés stockées dans le code exigent une modification du code pour chaque nouvel environnement, et la distribution se configure avec une chaîne de connexion, pas avec une clé d'instrumentation seule." }
references:
  - title: Configure OpenTelemetry in Application Insights
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/app/opentelemetry-configuration
  - title: Connection strings in Application Insights
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/app/connection-strings
