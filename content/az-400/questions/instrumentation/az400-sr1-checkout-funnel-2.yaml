id: az400-sr1-checkout-funnel-2
objective: "5.2.2"
type: series_yesno
series: az400-sr1-checkout-funnel
seriesOrder: 2
difficulty: 1
status: draft
stem:
  en: You create a funnel with the four checkout events as steps.
  fr: Vous créez un entonnoir avec les quatre événements de commande comme étapes.
body:
  solution:
    en: |
      In the Application Insights resource, you open **Funnels**, create a funnel whose steps are CheckoutStarted, ShippingEntered, PaymentSubmitted, and OrderConfirmed in this order, and set the time range to the last 30 days.
    fr: |
      Dans la ressource Application Insights, vous ouvrez **Funnels**, créez un entonnoir dont les étapes sont CheckoutStarted, ShippingEntered, PaymentSubmitted et OrderConfirmed dans cet ordre, et définissez la plage de temps sur les 30 derniers jours.
answer: { value: true }
explanation:
  correct:
    en: Funnels show the step-by-step conversion rates of users through a known ordered sequence of events. Four steps are within the limit of six steps per funnel, so the funnel shows the percentage of users who reached each step after CheckoutStarted.
    fr: "Les entonnoirs (Funnels) montrent les taux de conversion étape par étape des utilisateurs dans une séquence ordonnée d'événements connue. Quatre étapes respectent la limite de six étapes par entonnoir : l'entonnoir affiche le pourcentage d'utilisateurs ayant atteint chaque étape après CheckoutStarted."
references:
  - title: Usage analysis with Application Insights
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/app/usage
