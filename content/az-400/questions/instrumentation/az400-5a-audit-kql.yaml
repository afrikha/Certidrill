id: az400-5a-audit-kql
objective: "5.1.1"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Northwind Traders deploys Bicep templates to the Azure subscription **Sub1** from Azure Pipelines. A diagnostic setting sends the activity log of Sub1 to a Log Analytics workspace so that the release team can keep it longer than 90 days.

    You need a query that returns, for the last 30 days, the number of failed operations in each resource group of Sub1, with the resource groups that have the most failures first.

    How should you complete the query? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind Traders déploie des modèles Bicep dans l'abonnement Azure **Sub1** depuis Azure Pipelines. Un paramètre de diagnostic envoie le journal d'activité de Sub1 vers un espace de travail Log Analytics afin que l'équipe des mises en production le conserve plus de 90 jours.

    Vous avez besoin d'une requête qui renvoie, pour les 30 derniers jours, le nombre d'opérations en échec dans chaque groupe de ressources de Sub1, les groupes de ressources qui ont le plus d'échecs en premier.

    Comment devez-vous compléter la requête ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: kusto
  template: |
    [[tbl]]
    | where TimeGenerated > ago(30d)
    | where [[col]] == "Failed"
    | summarize Failures = [[agg]] by ResourceGroup
    | order by Failures desc
  slots:
    - id: tbl
      options:
        - { id: diag, text: AzureDiagnostics }
        - { id: activity, text: AzureActivity }
        - { id: audit, text: AuditLogs }
        - { id: metrics, text: AzureMetrics }
    - id: col
      options:
        - { id: category, text: CategoryValue }
        - { id: level, text: Level }
        - { id: status, text: ActivityStatusValue }
        - { id: operation, text: OperationNameValue }
    - id: agg
      options:
        - { id: dcount, text: dcount(OperationNameValue) }
        - { id: count, text: count() }
        - { id: max, text: max(TimeGenerated) }
        - { id: dcountrg, text: dcount(ResourceGroup) }
answer:
  values: { tbl: activity, col: status, agg: count }
explanation:
  correct:
    en: "Activity log entries sent to a Log Analytics workspace are stored in the AzureActivity table. ActivityStatusValue holds the display-friendly status of the operation, such as Started, Succeeded or Failed. count() returns the number of rows, that is the number of failed operations, for each ResourceGroup."
    fr: "Les entrées du journal d'activité envoyées vers un espace de travail Log Analytics sont stockées dans la table AzureActivity. ActivityStatusValue contient l'état lisible de l'opération, comme Started, Succeeded ou Failed. count() renvoie le nombre de lignes, c'est-à-dire le nombre d'opérations en échec, pour chaque ResourceGroup."
  options:
    diag: { en: "AzureDiagnostics holds resource logs of resources in Azure diagnostics mode, not the subscription activity log.", fr: "AzureDiagnostics contient les journaux de ressources des ressources en mode Diagnostics Azure, pas le journal d'activité de l'abonnement." }
    audit: { en: "AuditLogs holds Microsoft Entra ID audit events.", fr: "AuditLogs contient les événements d'audit de Microsoft Entra ID." }
    metrics: { en: "AzureMetrics holds platform metrics exported by diagnostic settings, not operations.", fr: "AzureMetrics contient les métriques de plateforme exportées par des paramètres de diagnostic, pas des opérations." }
    category: { en: "CategoryValue holds the category of the entry, such as Administrative, Policy or Security.", fr: "CategoryValue contient la catégorie de l'entrée, comme Administrative, Policy ou Security." }
    level: { en: "Level holds Critical, Error, Warning, Informational or Verbose, never Failed.", fr: "Level contient Critical, Error, Warning, Informational ou Verbose, jamais Failed." }
    operation: { en: "OperationNameValue identifies the operation, for example a resource type and action, not its result.", fr: "OperationNameValue identifie l'opération, par exemple un type de ressource et une action, pas son résultat." }
    dcount: { en: "dcount(OperationNameValue) counts the distinct kinds of operations that failed, not the number of failures.", fr: "dcount(OperationNameValue) compte les types d'opérations distincts qui ont échoué, pas le nombre d'échecs." }
    max: { en: "max(TimeGenerated) returns the time of the latest failure, not a number of failures.", fr: "max(TimeGenerated) renvoie l'heure du dernier échec, pas un nombre d'échecs." }
    dcountrg: { en: "dcount(ResourceGroup) grouped by ResourceGroup always returns 1.", fr: "dcount(ResourceGroup) groupé par ResourceGroup renvoie toujours 1." }
references:
  - title: Azure Monitor Logs reference - AzureActivity
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/reference/tables/azureactivity
  - title: Activity log in Azure Monitor
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/platform/activity-log
