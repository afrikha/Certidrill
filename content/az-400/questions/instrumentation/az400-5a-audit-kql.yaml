id: az400-5a-audit-kql
objective: "5.1.1"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Northwind Traders streams the audit events of its Azure DevOps organization to a Log Analytics workspace.

    You need a query that returns, for the last 30 days, the number of audit events generated by each user in the Azure DevOps project named **Payments**, with the most active users first.

    How should you complete the query? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind Traders diffuse en continu les événements d'audit de son organisation Azure DevOps vers un espace de travail Log Analytics.

    Vous avez besoin d'une requête qui renvoie, pour les 30 derniers jours, le nombre d'événements d'audit générés par chaque utilisateur dans le projet Azure DevOps nommé **Payments**, les utilisateurs les plus actifs en premier.

    Comment devez-vous compléter la requête ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: kusto
  template: |
    [[tbl]]
    | where TimeGenerated > ago(30d)
    | where [[col]] == "Payments"
    | summarize Events = [[agg]] by ActorUPN
    | order by Events desc
  slots:
    - id: tbl
      options:
        - { id: ado, text: AzureDevOpsAuditing }
        - { id: activity, text: AzureActivity }
        - { id: diag, text: AzureDiagnostics }
        - { id: audit, text: AuditLogs }
    - id: col
      options:
        - { id: projid, text: ProjectId }
        - { id: projname, text: ProjectName }
        - { id: area, text: Area }
        - { id: category, text: Category }
    - id: agg
      options:
        - { id: dcount, text: dcount(ActorUPN) }
        - { id: max, text: max(TimeGenerated) }
        - { id: count, text: count() }
        - { id: sum, text: sum(Id) }
answer:
  values: { tbl: ado, col: projname, agg: count }
explanation:
  correct:
    en: "Audit streams to Azure Monitor Logs write to the AzureDevOpsAuditing table. ProjectName holds the project name, while ProjectId holds its GUID. count() returns the number of rows, that is the number of audit events, for each ActorUPN."
    fr: "Les flux d'audit vers les journaux Azure Monitor écrivent dans la table AzureDevOpsAuditing. ProjectName contient le nom du projet, alors que ProjectId contient son GUID. count() renvoie le nombre de lignes, c'est-à-dire le nombre d'événements d'audit, pour chaque ActorUPN."
  options:
    activity: { en: "AzureActivity holds the Azure activity log of subscriptions, not Azure DevOps audit events.", fr: "AzureActivity contient le journal d'activité Azure des abonnements, pas les événements d'audit Azure DevOps." }
    audit: { en: "AuditLogs holds Microsoft Entra ID audit events.", fr: "AuditLogs contient les événements d'audit de Microsoft Entra ID." }
    projid: { en: "ProjectId is a GUID, so it never equals the string Payments.", fr: "ProjectId est un GUID : il n'est jamais égal à la chaîne Payments." }
    dcount: { en: "dcount(ActorUPN) grouped by ActorUPN always returns 1.", fr: "dcount(ActorUPN) groupé par ActorUPN renvoie toujours 1." }
    max: { en: "max(TimeGenerated) returns the time of the latest event, not a number of events.", fr: "max(TimeGenerated) renvoie l'heure du dernier événement, pas un nombre d'événements." }
references:
  - title: Azure Monitor Logs reference - AzureDevOpsAuditing
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/reference/tables/azuredevopsauditing
  - title: Create audit streaming for Azure DevOps
    url: https://learn.microsoft.com/en-us/azure/devops/organizations/audit/auditing-streaming
