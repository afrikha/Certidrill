id: az400-5a-kql-operator-order
objective: "5.2.4"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam's virtual machines send performance counters to the Perf table of a Log Analytics workspace.

    You need a query that displays, as a bar chart, the five computers with the highest average value of the **% Processor Time** counter over the last hour. The query starts with the table name `Perf`.

    Which four operators should you add in sequence after `Perf`? To answer, move the appropriate operators from the list to the answer area and arrange them in the correct order.
  fr: |
    Les machines virtuelles de Fabrikam envoient des compteurs de performances dans la table Perf d'un espace de travail Log Analytics.

    Vous avez besoin d'une requête qui affiche, sous forme de graphique à barres, les cinq ordinateurs dont la valeur moyenne du compteur **% Processor Time** est la plus élevée au cours de la dernière heure. La requête commence par le nom de table `Perf`.

    Quels sont les quatre opérateurs à ajouter dans l'ordre après `Perf` ? Pour répondre, déplacez les opérateurs appropriés de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: where, text: '`| where TimeGenerated > ago(1h) and CounterName == "% Processor Time"`' }
    - { id: summarize, text: '`| summarize AvgCpu = avg(CounterValue) by Computer`' }
    - { id: top, text: '`| top 5 by AvgCpu desc`' }
    - { id: render, text: '`| render barchart`' }
    - { id: take, text: '`| take 5`' }
    - { id: extend, text: '`| extend AvgCpu = avg(CounterValue)`' }
answer:
  sequence: [ where, summarize, top, render ]
explanation:
  correct:
    en: |
      The query first filters the rows on time and counter, while TimeGenerated and CounterName still exist. summarize then computes one average per computer, top 5 by AvgCpu desc keeps the five highest averages, and render, which must be the last operator, draws the bar chart.
    fr: |
      La requête filtre d'abord les lignes sur le temps et le compteur, tant que TimeGenerated et CounterName existent encore. summarize calcule ensuite une moyenne par ordinateur, top 5 by AvgCpu desc conserve les cinq moyennes les plus élevées, et render, qui doit être le dernier opérateur, trace le graphique à barres.
  options:
    take: { en: "take returns arbitrary rows, not the five highest values.", fr: "take renvoie des lignes arbitraires, pas les cinq valeurs les plus élevées." }
    extend: { en: "avg() is an aggregation function that must be used with summarize; extend computes a value per row.", fr: "avg() est une fonction d'agrégation qui doit être utilisée avec summarize ; extend calcule une valeur par ligne." }
references:
  - title: Azure Monitor Logs reference - Perf
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/reference/tables/perf
