id: az400-5a-insight-match
objective: "5.1.2"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Litware hosts an online store in Azure. The operations team lists four monitoring requirements.

    Which Azure Monitor insight should you use for each requirement? To answer, drag the appropriate insights to the correct requirements. Each insight may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware héberge une boutique en ligne dans Azure. L'équipe d'exploitation liste quatre exigences de supervision.

    Quel insight Azure Monitor devez-vous utiliser pour chaque exigence ? Pour répondre, faites glisser les insights appropriés vers les exigences correspondantes. Chaque insight peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: appi, text: Application Insights }
    - { id: vmi, text: VM Insights }
    - { id: ci, text: Container Insights }
    - { id: si, text: Storage Insights }
    - { id: ni, text: Network Insights }
  targets:
    - { id: api, text: { en: "Request rates, failed dependency calls and exceptions of the checkout API", fr: "Taux de requêtes, appels de dépendances en échec et exceptions de l'API de paiement" } }
    - { id: vms, text: { en: "Guest memory and logical disk usage of 150 Azure virtual machines", fr: "Mémoire invitée et utilisation des disques logiques de 150 machines virtuelles Azure" } }
    - { id: pods, text: { en: "Pod restarts and container stdout logs of the AKS cluster", fr: "Redémarrages de pods et journaux stdout des conteneurs du cluster AKS" } }
    - { id: stor, text: { en: "Availability, latency and capacity of all the storage accounts, without installing anything", fr: "Disponibilité, latence et capacité de tous les comptes de stockage, sans rien installer" } }
answer:
  mapping: { api: appi, vms: vmi, pods: ci, stor: si }
explanation:
  correct:
    en: Application Insights collects application telemetry such as requests, dependencies and exceptions. VM insights uses the Azure Monitor Agent and a data collection rule to collect guest performance data. Container insights uses the AKS monitoring add-on for node, pod and container data and logs. Storage insights is built on platform metrics, so it needs no agent or configuration.
    fr: Application Insights collecte la télémétrie applicative, comme les requêtes, les dépendances et les exceptions. VM Insights utilise l'agent Azure Monitor et une règle de collecte de données pour collecter les performances invitées. Container Insights utilise le module complémentaire de supervision d'AKS pour les données et journaux des nœuds, pods et conteneurs. Storage Insights repose sur les métriques de plateforme et ne nécessite donc ni agent ni configuration.
  options:
    ni: { en: "Network insights shows the health, topology and metrics of network resources, not application, VM guest, container or storage data.", fr: "Network Insights affiche l'intégrité, la topologie et les métriques des ressources réseau, pas les données d'application, d'invité de machine virtuelle, de conteneur ou de stockage." }
references:
  - title: Enable VM monitoring in Azure Monitor
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/vm/vminsights-enable
  - title: Enable monitoring for Azure Kubernetes Service (AKS) clusters
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/containers/kubernetes-monitoring-enable
