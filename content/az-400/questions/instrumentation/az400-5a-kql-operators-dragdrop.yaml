id: az400-5a-kql-operators-dragdrop
objective: "5.2.4"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    You are writing queries on the AppRequests table of a Log Analytics workspace for Northwind's support team.

    Which KQL operator should you use for each requirement? To answer, drag the appropriate operators to the correct requirements. Each operator may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous écrivez des requêtes sur la table AppRequests d'un espace de travail Log Analytics pour l'équipe de support de Northwind.

    Quel opérateur KQL devez-vous utiliser pour chaque exigence ? Pour répondre, faites glisser les opérateurs appropriés vers les exigences correspondantes. Chaque opérateur peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: where, text: where }
    - { id: extend, text: extend }
    - { id: project, text: project }
    - { id: summarize, text: summarize }
    - { id: take, text: take }
    - { id: join, text: join }
  targets:
    - { id: add, text: { en: "Add a DurationSec column computed from DurationMs, and keep all the other columns", fr: "Ajouter une colonne DurationSec calculée à partir de DurationMs, et conserver toutes les autres colonnes" } }
    - { id: keep, text: { en: "Return only the Name, ResultCode and DurationMs columns", fr: "Renvoyer uniquement les colonnes Name, ResultCode et DurationMs" } }
    - { id: preview, text: { en: "Preview 10 arbitrary rows to discover the content of the table", fr: "Prévisualiser 10 lignes arbitraires pour découvrir le contenu de la table" } }
    - { id: count, text: { en: "Count the failed requests for each operation Name", fr: "Compter les requêtes en échec pour chaque Name d'opération" } }
answer:
  mapping: { add: extend, keep: project, preview: take, count: summarize }
explanation:
  correct:
    en: extend appends calculated columns and keeps every input column. project returns only the listed columns. take returns a number of rows in no particular order, which is useful to preview a table. summarize aggregates rows by groups, for example count() by Name after a where filter on Success.
    fr: extend ajoute des colonnes calculées et conserve toutes les colonnes d'entrée. project ne renvoie que les colonnes listées. take renvoie un nombre de lignes sans ordre particulier, ce qui est utile pour prévisualiser une table. summarize agrège les lignes par groupes, par exemple count() by Name après un filtre where sur Success.
  options:
    where: { en: "where filters rows; it does not add, select or aggregate columns.", fr: "where filtre les lignes ; il n'ajoute, ne sélectionne ni n'agrège de colonnes." }
    join: { en: "join combines the rows of two tables on matching keys.", fr: "join combine les lignes de deux tables sur des clés correspondantes." }
references:
  - title: extend operator
    url: https://learn.microsoft.com/en-us/kusto/query/extend-operator
