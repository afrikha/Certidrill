id: az400-5a-guest-disk-space
objective: "5.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Adatum runs self-hosted Azure Pipelines agents on 20 Windows virtual machines. Builds fail when the D: volume of an agent runs out of space. Only the default platform metrics are collected today.

    You need to chart the free space of each volume of each agent VM.

    What should you do first?
  fr: |
    Adatum exécute des agents Azure Pipelines auto-hébergés sur 20 machines virtuelles Windows. Les builds échouent quand le volume D: d'un agent manque d'espace. Seules les métriques de plateforme par défaut sont collectées aujourd'hui.

    Vous devez représenter dans un graphique l'espace libre de chaque volume de chaque machine virtuelle d'agent.

    Que devez-vous faire en premier ?
body:
  options:
    - { id: a, text: { en: "Enable VM insights so that the Azure Monitor Agent collects guest logical disk data.", fr: "Activer VM Insights pour que l'agent Azure Monitor collecte les données des disques logiques invités." } }
    - { id: b, text: { en: "Chart the OS Disk IOPS Consumed Percentage platform metric of each VM.", fr: "Représenter la métrique de plateforme OS Disk IOPS Consumed Percentage de chaque machine virtuelle." } }
    - { id: c, text: { en: "Enable boot diagnostics on each VM and review the screenshots.", fr: "Activer les diagnostics de démarrage sur chaque machine virtuelle et examiner les captures d'écran." } }
    - { id: d, text: { en: "Chart the Data Disk Bandwidth Consumed Percentage platform metric of each VM.", fr: "Représenter la métrique de plateforme Data Disk Bandwidth Consumed Percentage de chaque machine virtuelle." } }
answer: { optionId: a }
explanation:
  correct:
    en: The host platform metrics of a VM cover CPU, memory, disk I/O and network, but no free-space metric. Free space per volume is guest data, collected by the Azure Monitor Agent with a data collection rule when you enable VM insights; the Performance view then shows logical disk space used for each volume.
    fr: Les métriques de plateforme de l'hôte d'une machine virtuelle couvrent le processeur, la mémoire, les E/S disque et le réseau, mais aucune métrique d'espace libre. L'espace libre par volume est une donnée invitée, collectée par l'agent Azure Monitor avec une règle de collecte de données quand vous activez VM Insights ; la vue Performance affiche alors l'espace utilisé de chaque disque logique.
  options:
    b: { en: "IOPS consumed measures the I/O load against the disk's limit, not the space left on a volume.", fr: "Les IOPS consommées mesurent la charge d'E/S par rapport à la limite du disque, pas l'espace restant sur un volume." }
    c: { en: "Boot diagnostics capture the console and screenshots to troubleshoot startup, not disk space.", fr: "Les diagnostics de démarrage capturent la console et des captures d'écran pour dépanner le démarrage, pas l'espace disque." }
    d: { en: "Bandwidth consumed measures throughput against the disk's limit, not the space left on a volume.", fr: "La bande passante consommée mesure le débit par rapport à la limite du disque, pas l'espace restant sur un volume." }
references:
  - title: Supported metrics for Microsoft.Compute/virtualMachines
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/reference/supported-metrics/microsoft-compute-virtualmachines-metrics
  - title: Enable VM monitoring in Azure Monitor
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/vm/vminsights-enable
