id: az400-5a-uninstrumented-node
objective: "5.2.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Litware's storefront API is instrumented with Application Insights in a resource named **appi-storefront** in the subscription **Sub-Web**. The storefront calls an inventory API owned by another team. The inventory API is instrumented with the latest stable OpenTelemetry distro and sends telemetry to **appi-inventory** in the subscription **Sub-Supply**. You have the Monitoring Reader role on Sub-Web only.

    In the end-to-end transaction details of a slow request, the call to the inventory API appears only as an HTTP dependency of the storefront, without any of the inventory API's own requests or dependencies.

    What is the most likely cause?
  fr: |
    L'API storefront de Litware est instrumentée avec Application Insights dans une ressource nommée **appi-storefront** de l'abonnement **Sub-Web**. Le storefront appelle une API d'inventaire gérée par une autre équipe. L'API d'inventaire est instrumentée avec la dernière distribution OpenTelemetry stable et envoie sa télémétrie à **appi-inventory**, dans l'abonnement **Sub-Supply**. Vous disposez du rôle Monitoring Reader sur Sub-Web uniquement.

    Dans les détails de transaction de bout en bout d'une requête lente, l'appel à l'API d'inventaire n'apparaît que comme une dépendance HTTP du storefront, sans aucune des requêtes ni dépendances propres à l'API d'inventaire.

    Quelle est la cause la plus probable ?
body:
  options:
    - { id: a, text: { en: "End-to-end transaction details cannot correlate telemetry stored in two subscriptions.", fr: "Les détails de transaction de bout en bout ne peuvent pas corréler une télémétrie stockée dans deux abonnements." } }
    - { id: b, text: { en: "Intelligent view is turned off on the Application map of appi-storefront.", fr: "Intelligent view est désactivé sur la cartographie d'application de appi-storefront." } }
    - { id: c, text: { en: "Live metrics is not enabled for the inventory API.", fr: "Live metrics n'est pas activé pour l'API d'inventaire." } }
    - { id: d, text: { en: "You do not have read access to the appi-inventory resource.", fr: "Vous n'avez pas d'accès en lecture à la ressource appi-inventory." } }
answer: { optionId: d }
explanation:
  correct:
    en: The end-to-end view correlates server-side telemetry from all monitored components, even when they use separate Application Insights resources. When another component appears only as an external dependency, check that it is instrumented, that it uses a recent SDK, and that you have access to its resource. Here the inventory API is instrumented with the latest distro, so the missing access to appi-inventory is the likely cause.
    fr: "La vue de bout en bout corrèle la télémétrie côté serveur de tous les composants supervisés, même lorsqu'ils utilisent des ressources Application Insights distinctes. Quand un autre composant n'apparaît que comme une dépendance externe, vérifiez qu'il est instrumenté, qu'il utilise un SDK récent et que vous avez accès à sa ressource. Ici, l'API d'inventaire est instrumentée avec la dernière distribution : l'absence d'accès à appi-inventory est la cause probable."
  options:
    a: { en: "Components can send telemetry to different Application Insights resources, even in different subscriptions, and still be correlated.", fr: "Les composants peuvent envoyer leur télémétrie à des ressources Application Insights différentes, même dans des abonnements différents, et rester corrélés." }
    b: { en: "Intelligent view only highlights likely failure causes on the map; it has no effect on the transaction details.", fr: "Intelligent view ne fait que mettre en évidence les causes probables d'échec sur la cartographie ; il n'a aucun effet sur les détails de transaction." }
    c: { en: "Live metrics streams real-time data and is not used to build stored transactions.", fr: "Live metrics diffuse des données en temps réel et ne sert pas à construire les transactions stockées." }
references:
  - title: Investigate failures, performance, and transactions with Application Insights
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/app/failures-performance-transactions
  - title: Application map in Azure Application Insights
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/app/app-map
