id: az400-5a-storage-latency-yesno
objective: "5.2.1"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam's on-premises build servers upload build artifacts over the internet to a storage account named **stfabartifacts**. Uploads have become slow. Over the last 24 hours, the storage account shows the following metrics:

    | Metric | Average |
    | --- | --- |
    | SuccessE2ELatency | 420 ms |
    | SuccessServerLatency | 8 ms |
    | Availability | 100 % |

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Les serveurs de build locaux de Fabrikam chargent des artefacts de build sur Internet vers un compte de stockage nommé **stfabartifacts**. Les chargements sont devenus lents. Au cours des dernières 24 heures, le compte de stockage présente les métriques suivantes :

    | Métrique | Moyenne |
    | --- | --- |
    | SuccessE2ELatency | 420 ms |
    | SuccessServerLatency | 8 ms |
    | Availability | 100 % |

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: Most of the latency of the uploads is spent processing the requests inside Azure Storage.
        fr: La majeure partie de la latence des chargements est consacrée au traitement des requêtes dans Stockage Azure.
    - id: s2
      text:
        en: The slowdown is more likely caused by the network path or by the build servers than by the storage service.
        fr: Le ralentissement est plus probablement dû au chemin réseau ou aux serveurs de build qu'au service de stockage.
    - id: s3
      text:
        en: If requests had failed with unexpected server errors during the period, the Availability metric would be lower than 100 %.
        fr: Si des requêtes avaient échoué avec des erreurs serveur inattendues pendant la période, la métrique Availability serait inférieure à 100 %.
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: SuccessServerLatency is the time Azure Storage takes to process a successful request, here 8 ms. SuccessE2ELatency adds the time to read the request, send the response and receive the acknowledgment, so the 412 ms gap points to the network or the client. Availability is computed from billable requests over applicable requests, and every unexpected error lowers it.
    fr: SuccessServerLatency est le temps que met Stockage Azure à traiter une requête réussie, ici 8 ms. SuccessE2ELatency y ajoute le temps de lecture de la requête, d'envoi de la réponse et de réception de l'accusé de réception ; l'écart de 412 ms désigne donc le réseau ou le client. Availability est calculée à partir des requêtes facturables rapportées aux requêtes applicables, et chaque erreur inattendue la fait baisser.
references:
  - title: Azure Blob Storage monitoring data reference
    url: https://learn.microsoft.com/en-us/azure/storage/blobs/monitor-blob-storage-reference
