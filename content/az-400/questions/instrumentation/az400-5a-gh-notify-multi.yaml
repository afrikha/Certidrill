id: az400-5a-gh-notify-multi
objective: "5.1.4"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    Tailspin uses GitHub Actions. In a repository named **tailspin/web**, the workflow **nightly.yml** runs on a `schedule` event. Ana created the workflow. Last week, Ben changed the cron syntax of the schedule. Carla often starts the workflow **release.yml** manually by using `workflow_dispatch`. All three have enabled email notifications for GitHub Actions.

    Which two statements are true?

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin utilise GitHub Actions. Dans un dépôt nommé **tailspin/web**, le workflow **nightly.yml** s'exécute sur un événement `schedule`. Ana a créé le workflow. La semaine dernière, Ben a modifié la syntaxe cron de la planification. Carla lance souvent le workflow **release.yml** manuellement avec `workflow_dispatch`. Tous trois ont activé les notifications par e-mail pour GitHub Actions.

    Quelles sont les deux affirmations vraies ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Every repository administrator receives a notification for each failed run of release.yml.", fr: "Chaque administrateur du dépôt reçoit une notification pour chaque exécution en échec de release.yml." } }
    - { id: b, text: { en: "Ben now receives the notifications for the scheduled runs of nightly.yml.", fr: "Ben reçoit désormais les notifications des exécutions planifiées de nightly.yml." } }
    - { id: c, text: { en: "Ana keeps receiving the notifications for nightly.yml because she created the workflow.", fr: "Ana continue de recevoir les notifications de nightly.yml parce qu'elle a créé le workflow." } }
    - { id: d, text: { en: "Carla can receive notifications only for failed runs; successful runs never send one.", fr: "Carla ne peut recevoir des notifications que pour les exécutions en échec ; les exécutions réussies n'en envoient jamais." } }
    - { id: e, text: { en: "Carla receives a notification for each run of release.yml that she starts.", fr: "Carla reçoit une notification pour chaque exécution de release.yml qu'elle lance." } }
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: Notifications for a run go to the user who triggered it, so Carla is notified for the runs she starts. For scheduled workflows, the creator is notified until another user changes the cron syntax; from then on, that user receives the notifications. Each user chooses whether to be notified for every completed run or only for failed runs.
    fr: "Les notifications d'une exécution vont à l'utilisateur qui l'a déclenchée : Carla est avertie pour les exécutions qu'elle lance. Pour les workflows planifiés, le créateur est averti jusqu'à ce qu'un autre utilisateur modifie la syntaxe cron ; à partir de là, c'est cet utilisateur qui reçoit les notifications. Chaque utilisateur choisit d'être averti pour chaque exécution terminée ou seulement pour les exécutions en échec."
  options:
    c: { en: "After Ben changed the cron syntax, Ben receives the later notifications instead of Ana.", fr: "Depuis que Ben a modifié la syntaxe cron, c'est Ben qui reçoit les notifications suivantes à la place d'Ana." }
    a: { en: "Workflow run notifications are not sent to all administrators; they go to the user who triggered the run.", fr: "Les notifications d'exécution de workflow ne sont pas envoyées à tous les administrateurs ; elles vont à l'utilisateur qui a déclenché l'exécution." }
    d: { en: "Users can be notified for every completed run (success, failure, neutral or canceled) or only for failed runs.", fr: "Les utilisateurs peuvent être avertis pour chaque exécution terminée (réussie, en échec, neutre ou annulée) ou seulement pour les exécutions en échec." }
references:
  - title: Notifications for workflow runs
    url: https://docs.github.com/en/actions/concepts/workflows-and-actions/notifications-for-workflow-runs
