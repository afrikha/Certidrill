id: az400-5a-role-name-merge
objective: "5.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam runs four Python microservices (catalog, cart, payment and shipping) in Azure Container Apps. Each service is instrumented with the Microsoft OpenTelemetry Distro and sends telemetry to the same Application Insights resource. Every container sets the environment variable `OTEL_SERVICE_NAME=fabrikam-shop`.

    The Application map shows a single node for the four services, so the team cannot see which service calls which.

    You need each service to appear as its own node on the map, with the calls between them.

    What should you do?
  fr: |
    Fabrikam exécute quatre microservices Python (catalog, cart, payment et shipping) dans Azure Container Apps. Chaque service est instrumenté avec la Microsoft OpenTelemetry Distro et envoie sa télémétrie à la même ressource Application Insights. Chaque conteneur définit la variable d'environnement `OTEL_SERVICE_NAME=fabrikam-shop`.

    La cartographie d'application (Application map) affiche un seul nœud pour les quatre services : l'équipe ne voit pas quel service appelle quel autre.

    Chaque service doit apparaître comme un nœud distinct sur la cartographie, avec les appels entre eux.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Set OTEL_SERVICE_NAME to a different value in each service, such as catalog or cart.", fr: "Définir OTEL_SERVICE_NAME sur une valeur différente dans chaque service, par exemple catalog ou cart." } }
    - { id: b, text: { en: "Set service.instance.id to a different value in each service by using OTEL_RESOURCE_ATTRIBUTES.", fr: "Définir service.instance.id sur une valeur différente dans chaque service avec OTEL_RESOURCE_ATTRIBUTES." } }
    - { id: c, text: { en: "Turn on Intelligent view in the Application map, and set its sensitivity to Low.", fr: "Activer Intelligent view dans la cartographie d'application, et régler sa sensibilité sur Low." } }
    - { id: d, text: { en: "Create a separate Log Analytics workspace for each service, and keep the same service name.", fr: "Créer un espace de travail Log Analytics distinct pour chaque service, et conserver le même nom de service." } }
answer: { optionId: a }
explanation:
  correct:
    en: The Application map builds one node per cloud role name, and the OpenTelemetry distros derive the cloud role name from the service.name resource attribute (with service.namespace when it is set). OTEL_SERVICE_NAME sets service.name, so giving each service its own value creates one node per service, connected by their HTTP dependency calls.
    fr: "La cartographie d'application crée un nœud par nom de rôle cloud, et les distributions OpenTelemetry dérivent le nom de rôle cloud de l'attribut de ressource service.name (avec service.namespace quand il est défini). OTEL_SERVICE_NAME définit service.name : donner à chaque service sa propre valeur crée un nœud par service, reliés par leurs appels de dépendances HTTP."
  options:
    b: { en: "service.instance.id sets the cloud role instance, which distinguishes instances within a node, not separate components.", fr: "service.instance.id définit l'instance de rôle cloud, qui distingue les instances d'un même nœud, pas des composants distincts." }
    c: { en: "Intelligent view highlights the connectors most likely to cause failures; it does not split a node.", fr: "Intelligent view met en évidence les connecteurs les plus susceptibles de causer des échecs ; il ne divise pas un nœud." }
    d: { en: "Components are identified by cloud role name, not by workspace; with the same service name the services stay merged.", fr: "Les composants sont identifiés par nom de rôle cloud, pas par espace de travail : avec le même nom de service, les services restent fusionnés." }
references:
  - title: Application map in Azure Application Insights
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/app/app-map
  - title: Configure OpenTelemetry in Application Insights
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/app/opentelemetry-configuration
