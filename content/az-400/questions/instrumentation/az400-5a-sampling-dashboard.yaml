id: az400-5a-sampling-dashboard
objective: "5.2.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Tailspin's order API is instrumented with the Microsoft OpenTelemetry Distro and uses its default sampling settings. A dashboard and a log search alert rule count requests and failed requests with `AppRequests | summarize count()`. During peak hours, the dashboard shows far fewer requests than the load balancer, and the alert on failed requests fires late.

    You need the dashboard and the alert to reflect the real request and failure counts. Sampling must stay enabled to control costs, and the dashboard must show the last 30 days.

    What should you do?
  fr: |
    L'API de commandes de Tailspin est instrumentée avec la Microsoft OpenTelemetry Distro et utilise ses paramètres d'échantillonnage par défaut. Un tableau de bord et une règle d'alerte de recherche dans les journaux comptent les requêtes et les requêtes en échec avec `AppRequests | summarize count()`. Aux heures de pointe, le tableau de bord affiche bien moins de requêtes que l'équilibreur de charge, et l'alerte sur les requêtes en échec se déclenche en retard.

    Le tableau de bord et l'alerte doivent refléter le nombre réel de requêtes et d'échecs. L'échantillonnage doit rester activé pour maîtriser les coûts, et le tableau de bord doit afficher les 30 derniers jours.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Replace count() with dcount(OperationId) in the queries of the dashboard and the alert rule.", fr: "Remplacer count() par dcount(OperationId) dans les requêtes du tableau de bord et de la règle d'alerte." } }
    - { id: b, text: { en: "Pin the request and failure charts of the Live metrics pane to the dashboard, and alert from them.", fr: "Épingler au tableau de bord les graphiques de requêtes et d'échecs du volet Live metrics, et créer les alertes à partir d'eux." } }
    - { id: c, text: { en: "Base the dashboard and a metric alert rule on the standard metrics requests/count and requests/failed.", fr: "Baser le tableau de bord et une règle d'alerte de métrique sur les métriques standard requests/count et requests/failed." } }
    - { id: d, text: { en: "Lower the OTEL_TRACES_SAMPLER_ARG value so that fewer traces are sent per second.", fr: "Diminuer la valeur de OTEL_TRACES_SAMPLER_ARG pour envoyer moins de traces par seconde." } }
answer: { optionId: c }
explanation:
  correct:
    en: The distro defaults to rate-limited sampling, so AppRequests holds only part of the requests and count() underreports them. Standard metrics are preaggregated before sampling, so their counts stay accurate; they suit dashboards and near real-time metric alerts, and metrics explorer can show 30 days per chart.
    fr: "La distribution applique par défaut un échantillonnage à débit limité ; AppRequests ne contient donc qu'une partie des requêtes, et count() en sous-estime le nombre. Les métriques standard sont préagrégées avant l'échantillonnage : leurs nombres restent exacts. Elles conviennent aux tableaux de bord et aux alertes de métrique quasi en temps réel, et Metrics Explorer peut afficher 30 jours par graphique."
  options:
    a: { en: "dcount(OperationId) still counts only the sampled rows that were kept, so it underreports traffic too.", fr: "dcount(OperationId) ne compte toujours que les lignes échantillonnées conservées : il sous-estime lui aussi le trafic." }
    b: { en: "Live metrics keeps no history, so it cannot show 30 days or support alert rules.", fr: "Live metrics ne conserve aucun historique : il ne peut ni afficher 30 jours ni servir de base à des règles d'alerte." }
    d: { en: "Lowering the rate samples even more traces, which makes count() less accurate.", fr: "Diminuer le débit échantillonne encore plus de traces, ce qui rend count() moins exact." }
references:
  - title: Metrics in Application Insights
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/app/metrics-overview
  - title: Configure OpenTelemetry in Application Insights
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/app/opentelemetry-configuration
