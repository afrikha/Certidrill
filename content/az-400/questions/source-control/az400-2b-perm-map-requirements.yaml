id: az400-2b-perm-map-requirements
objective: "2.2.3"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Adatum has an Azure Repos Git repository named **Payroll**. You create a custom security group for each team below. The groups have no permissions on Payroll yet.

    You need to grant each group the single permission it needs on the repository. The solution must follow the principle of least privilege.

    Which permission should you set to **Allow** for each group? To answer, drag the appropriate permissions to the correct groups. Each permission may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum dispose d'un dépôt Git Azure Repos nommé **Payroll**. Vous créez un groupe de sécurité personnalisé pour chacune des équipes ci-dessous. Les groupes n'ont encore aucune autorisation sur Payroll.

    Vous devez accorder à chaque groupe l'unique autorisation dont il a besoin sur le dépôt. La solution doit respecter le principe du moindre privilège.

    Quelle autorisation devez-vous définir sur **Allow** pour chaque groupe ? Pour répondre, faites glisser les autorisations appropriées vers les groupes correspondants. Chaque autorisation peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: contribute, text: Contribute }
    - { id: force, text: "Force push (rewrite history, delete branches and tags)" }
    - { id: locks, text: Remove others' locks }
    - { id: policies, text: Edit policies }
    - { id: manage, text: Manage permissions }
    - { id: bypass, text: Bypass policies when pushing }
  targets:
    - id: devs
      text: { en: "Developers: push new commits to existing branches", fr: "Développeurs : pousser de nouveaux commits vers des branches existantes" }
    - id: maint
      text: { en: "Maintainers: rewrite the history of a shared branch after an interactive rebase", fr: "Mainteneurs : réécrire l'historique d'une branche partagée après un rebase interactif" }
    - id: release
      text: { en: "Release team: unlock the release branch when another user left it locked", fr: "Équipe de mise en production : déverrouiller la branche release lorsqu'un autre utilisateur l'a laissée verrouillée" }
    - id: quality
      text: { en: "Quality team: add a minimum number of reviewers policy to main", fr: "Équipe qualité : ajouter une stratégie de nombre minimal de réviseurs sur main" }
answer:
  mapping: { devs: contribute, maint: force, release: locks, quality: policies }
explanation:
  correct:
    en: Contribute allows pushing new commits but not rewriting existing ones. Force push is required to rewrite history (and to delete branches and tags). Remove others' locks lets a user unlock a branch locked by someone else. Edit policies lets a user configure branch policies such as required reviewers.
    fr: Contribute permet de pousser de nouveaux commits, mais pas de réécrire ceux qui existent. Force push est nécessaire pour réécrire l'historique (et pour supprimer des branches et des balises). Remove others' locks permet de déverrouiller une branche verrouillée par un autre utilisateur. Edit policies permet de configurer des stratégies de branche, comme les réviseurs obligatoires.
  options:
    manage: { en: "Manage permissions lets a user change security settings, which none of the teams needs.", fr: "Manage permissions permet de modifier les paramètres de sécurité, ce dont aucune équipe n'a besoin." }
    bypass: { en: "Bypass policies when pushing skips branch policies on direct pushes; it does not allow rewriting history.", fr: "Bypass policies when pushing ignore les stratégies de branche lors des push directs ; elle ne permet pas de réécrire l'historique." }
references:
  - title: Set branch permissions
    url: https://learn.microsoft.com/en-us/azure/devops/repos/git/branch-permissions
  - title: Lock a branch
    url: https://learn.microsoft.com/en-us/azure/devops/repos/git/lock-branches
