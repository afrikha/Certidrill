id: az400-2a-binary-storage-match
objective: "2.2.1"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Contoso is cleaning up an Azure Repos repository that has grown too large. You are defining where each kind of content must be stored, following the Microsoft recommendations for large files in Git.

    Which approach should you use for each kind of content? To answer, drag the appropriate approaches to the correct kinds of content. Each approach may be used once, more than once, or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso fait le ménage dans un dépôt Azure Repos devenu trop volumineux. Vous définissez où chaque type de contenu doit être stocké, en suivant les recommandations de Microsoft pour les gros fichiers dans Git.

    Quelle approche devez-vous utiliser pour chaque type de contenu ? Pour répondre, faites glisser les approches appropriées vers les types de contenu correspondants. Chaque approche peut être utilisée une fois, plusieurs fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: true
  items:
    - { id: git, text: { en: "Commit the files to Git", fr: "Valider les fichiers dans Git" } }
    - { id: lfs, text: { en: "Track the files with Git LFS", fr: "Suivre les fichiers avec Git LFS" } }
    - { id: artifacts, text: { en: "Publish the files to an Azure Artifacts feed", fr: "Publier les fichiers dans un flux Azure Artifacts" } }
    - { id: none, text: { en: "Don't store the files in the repository", fr: "Ne pas stocker les fichiers dans le dépôt" } }
  targets:
    - id: icons
      text: { en: "Small web icons that rarely change", fr: "De petites icônes web qui changent rarement" }
    - id: videos
      text: { en: "Training videos that the documentation team updates every week", fr: "Des vidéos de formation que l'équipe de documentation met à jour chaque semaine" }
    - id: sdk
      text: { en: "Third-party SDK libraries consumed by several solutions", fr: "Des bibliothèques de SDK tiers consommées par plusieurs solutions" }
    - id: output
      text: { en: "Build outputs and diagnostic logs", fr: "Des sorties de build et des journaux de diagnostic" }
answer:
  mapping: { icons: git, videos: lfs, sdk: artifacts, output: none }
explanation:
  correct:
    en: |
      Small binaries that rarely change are acceptable in Git. Large binaries that change often belong in Git LFS, so the history stores only pointers. Reusable dependencies such as libraries should be delivered through package management with Azure Artifacts. Build outputs, logs and diagnostic data should not be committed at all.
    fr: |
      Les petits binaires qui changent rarement sont acceptables dans Git. Les gros binaires qui changent souvent ont leur place dans Git LFS, pour que l'historique ne stocke que des pointeurs. Les dépendances réutilisables comme les bibliothèques doivent être fournies par la gestion des packages avec Azure Artifacts. Les sorties de build, les journaux et les données de diagnostic ne doivent pas être validés du tout.
references:
  - title: Work with large files in your Git repo
    url: https://learn.microsoft.com/en-us/azure/devops/repos/git/manage-large-files
