id: az400-2a-scalar-monorepo
objective: "2.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso has a monorepo in Azure Repos with ten years of history and millions of files. Developers on Windows and macOS complain that `git status`, `git fetch` and `git log` are slow. They need the full commit history for investigations.

    You need to configure the developers' clones with partial clone, sparse-checkout, background prefetch, a commit-graph and a file system monitor. The solution must minimize administrative effort.

    What should you use?
  fr: |
    Contoso dispose dans Azure Repos d'un monodépôt (monorepo) avec dix ans d'historique et des millions de fichiers. Les développeurs sous Windows et macOS se plaignent de la lenteur de `git status`, `git fetch` et `git log`. Ils ont besoin de l'historique complet des commits pour leurs analyses.

    Vous devez configurer les clones des développeurs avec le clonage partiel, l'extraction partielle (sparse-checkout), la prérécupération en arrière-plan, un graphe de commits et un moniteur du système de fichiers. La solution doit réduire au minimum l'effort d'administration.

    Que devez-vous utiliser ?
body:
  options:
    - id: a
      text: { en: "Git LFS, with every binary file type tracked", fr: "Git LFS, en suivant tous les types de fichiers binaires" }
    - id: b
      text: { en: "Scalar, to clone and register the repository", fr: "Scalar, pour cloner et inscrire le dépôt" }
    - id: c
      text: { en: "A shallow clone, with git clone --depth 1", fr: "Un clone superficiel, avec git clone --depth 1" }
    - id: d
      text: { en: "git-fat, with an rsync store for large files", fr: "git-fat, avec un stockage rsync pour les gros fichiers" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Scalar is a tool from Microsoft for very large repositories, used for the Windows and Office repositories. It turns on advanced Git features, including partial clone, background prefetch, sparse-checkout, the file system monitor, the commit-graph and multi-pack-index, without the developers configuring each one. The full history stays available.
    fr: |
      Scalar est un outil de Microsoft pour les très grands dépôts, utilisé pour les dépôts de Windows et d'Office. Il active des fonctionnalités avancées de Git, notamment le clonage partiel, la prérécupération en arrière-plan, le sparse-checkout, le moniteur du système de fichiers, le graphe de commits et le multi-pack-index, sans que les développeurs aient à configurer chacune d'elles. L'historique complet reste disponible.
  options:
    a: { en: "Git LFS keeps large binaries out of the history but doesn't speed up status, fetch or log on millions of files.", fr: "Git LFS garde les gros binaires hors de l'historique, mais n'accélère pas status, fetch ni log sur des millions de fichiers." }
    c: { en: "A shallow clone drops the history that the developers need.", fr: "Un clone superficiel supprime l'historique dont les développeurs ont besoin." }
    d: { en: "git-fat only handles large binary files; it configures none of the required features.", fr: "git-fat ne gère que les gros fichiers binaires ; il ne configure aucune des fonctionnalités requises." }
references:
  - title: Work with large repositories
    url: https://learn.microsoft.com/en-us/training/modules/manage-git-repositories/2-work-large-repositories
