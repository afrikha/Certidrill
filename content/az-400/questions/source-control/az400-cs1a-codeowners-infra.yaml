id: az400-cs1a-codeowners-infra
objective: "2.1.2"
type: yesno_statements
caseStudy: az400-cs1a-consolidated-messenger
difficulty: 2
status: draft
stem:
  en: |
    You are configuring the pull request workflow of tracking-api to meet the source control requirements. The main branch already has a branch protection rule that requires a pull request with one approval.

    You plan to add the following file to the .github folder of the main branch:

    ```text
    /infra/ @consolidated-messenger/platform
    ```

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous configurez le workflow de pull request de tracking-api pour respecter les exigences de contrôle de code source. La branche main a déjà une règle de protection de branche qui exige une pull request avec une approbation.

    Vous prévoyez d'ajouter le fichier suivant au dossier .github de la branche main :

    ```text
    /infra/ @consolidated-messenger/platform
    ```

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          If the file is named CODEOWNERS, the platform team is automatically requested as a reviewer on pull requests that change files in the /infra folder.
        fr: |
          Si le fichier est nommé CODEOWNERS, l'équipe plateforme est automatiquement demandée comme réviseur sur les pull requests qui modifient des fichiers du dossier /infra.
    - id: s2
      text:
        en: |
          Once the CODEOWNERS file is merged, a pull request that changes the /infra folder can no longer be merged until a member of the platform team approves it, without any other change to the branch protection rule.
        fr: |
          Une fois le fichier CODEOWNERS fusionné, une pull request qui modifie le dossier /infra ne peut plus être fusionnée tant qu'un membre de l'équipe plateforme ne l'a pas approuvée, sans autre modification de la règle de protection de branche.
    - id: s3
      text:
        en: |
          To prevent the two repository administrators from merging such a pull request without the approval of the platform team, you must enable the option that applies the rule to administrators (Do not allow bypassing the above settings).
        fr: |
          Pour empêcher les deux administrateurs du dépôt de fusionner une telle pull request sans l'approbation de l'équipe plateforme, vous devez activer l'option qui applique la règle aux administrateurs (Do not allow bypassing the above settings).
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |
      A CODEOWNERS file in .github, the root or docs of the base branch makes GitHub request a review from the owners of the matching paths; the platform team qualifies because it has write access through the Maintain role. Code owner approval is only enforced when the branch protection rule (or a ruleset) also enables Require review from Code Owners, so the file alone keeps the rule advisory. By default, branch protection does not apply to repository administrators; enabling Do not allow bypassing the above settings applies it to them too.
    fr: |
      Un fichier CODEOWNERS placé dans .github, à la racine ou dans docs de la branche de base fait demander par GitHub une révision aux propriétaires des chemins correspondants ; l'équipe plateforme est éligible car elle a un accès en écriture par le rôle Maintain. L'approbation des propriétaires de code n'est imposée que si la règle de protection de branche (ou un ensemble de règles) active aussi Require review from Code Owners : le fichier seul reste indicatif. Par défaut, la protection de branche ne s'applique pas aux administrateurs du dépôt ; l'option Do not allow bypassing the above settings la leur applique aussi.
references:
  - title: Enforce governance with GitHub controls
    url: https://learn.microsoft.com/en-us/training/modules/governance-guardrails-operations/3-enforce-governance-github-controls
  - title: Implement branch merging restrictions
    url: https://learn.microsoft.com/en-us/training/modules/manage-git-branches-workflows/7-implement-branch-merging-restrictions
