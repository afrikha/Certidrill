id: az400-2a-bypass-push
objective: "2.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Adatum has an Azure Repos repository named **Payroll**. The `main` branch has required branch policies, so all changes reach `main` through pull requests.

    During incidents, the members of a security group named **Release Managers** must be able to push hotfix commits directly to `main` without creating a pull request. All other contributors must continue to use pull requests. The solution must follow the principle of least privilege.

    What should you do?
  fr: |
    Adatum dispose d'un dépôt Azure Repos nommé **Payroll**. La branche `main` a des stratégies de branche obligatoires : tous les changements arrivent dans `main` par des pull requests.

    Lors des incidents, les membres d'un groupe de sécurité nommé **Release Managers** doivent pouvoir envoyer des commits de correctif directement vers `main` sans créer de pull request. Tous les autres contributeurs doivent continuer à utiliser des pull requests. La solution doit respecter le principe du moindre privilège.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "On the main branch, set Bypass policies when completing pull requests to Allow for Release Managers.", fr: "Sur la branche main, définir Bypass policies when completing pull requests sur Allow pour Release Managers." }
    - id: b
      text: { en: "On the main branch, set Bypass policies when pushing to Allow for Release Managers.", fr: "Sur la branche main, définir Bypass policies when pushing sur Allow pour Release Managers." }
    - id: c
      text: { en: "On the main branch, set Force push (rewrite history, delete branches and tags) to Allow for Release Managers.", fr: "Sur la branche main, définir Force push (rewrite history, delete branches and tags) sur Allow pour Release Managers." }
    - id: d
      text: { en: "On the project, add Release Managers to the Project Administrators group.", fr: "Sur le projet, ajouter Release Managers au groupe Project Administrators." }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Bypass policies when pushing applies to pushes from local repositories and to edits made on the web; users who have it can push directly to a branch with required policies. Granting it on the main branch only, to Release Managers only, keeps the scope minimal, while everyone else still needs a pull request.
    fr: |
      Bypass policies when pushing s'applique aux envois depuis des dépôts locaux et aux modifications faites sur le web ; les utilisateurs qui l'ont peuvent envoyer directement vers une branche dotée de stratégies obligatoires. L'accorder sur la seule branche main et au seul groupe Release Managers limite l'étendue au minimum, et tous les autres ont toujours besoin d'une pull request.
  options:
    a: { en: "This permission lets users complete a pull request that fails policies, but they would still need a pull request.", fr: "Cette autorisation permet de terminer une pull request qui ne respecte pas les stratégies, mais une pull request resterait nécessaire." }
    c: { en: "Force push lets users rewrite history and delete branches; it doesn't exempt pushes from branch policies.", fr: "Force push permet de réécrire l'historique et de supprimer des branches ; il n'exempte pas les envois des stratégies de branche." }
    d: { en: "Project Administrators can manage every repository, policy and permission of the project, which is far more than pushing to main and violates least privilege.", fr: "Project Administrators peut gérer tous les dépôts, toutes les stratégies et toutes les autorisations du projet, ce qui dépasse largement l'envoi vers main et ne respecte pas le moindre privilège." }
references:
  - title: Set and manage branch policies
    url: https://learn.microsoft.com/en-us/azure/devops/repos/git/branch-policies
