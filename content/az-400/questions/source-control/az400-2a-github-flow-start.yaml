id: az400-2a-github-flow-start
objective: "2.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Wingtip hosts an application in a GitHub repository and uses GitHub flow. Every merge into `main` triggers an automated deployment to production.

    A developer must start working on a new search feature.

    What should the developer do?
  fr: |
    Wingtip héberge une application dans un dépôt GitHub et utilise GitHub flow. Chaque fusion dans `main` déclenche un déploiement automatisé en production.

    Un développeur doit commencer à travailler sur une nouvelle fonctionnalité de recherche.

    Que doit faire le développeur ?
body:
  options:
    - id: a
      text: { en: "Create a branch from a develop branch, and merge it into develop when the feature is complete.", fr: "Créer une branche à partir d'une branche develop, et la fusionner dans develop quand la fonctionnalité est terminée." }
    - id: b
      text: { en: "Create a release branch from main, and create the feature branch from that release branch.", fr: "Créer une branche de mise en production à partir de main, puis créer la branche de fonctionnalité à partir de celle-ci." }
    - id: c
      text: { en: "Commit the changes to main, and open a pull request from main into a production branch.", fr: "Valider les changements dans main, puis ouvrir une pull request de main vers une branche de production." }
    - id: d
      text: { en: "Create a branch from main, push commits to it, and open a pull request into main for review and checks.", fr: "Créer une branche à partir de main, y envoyer des commits, puis ouvrir une pull request vers main pour la revue et les vérifications." }
answer: { optionId: d }
explanation:
  correct:
    en: |
      In GitHub flow, all work happens in short-lived branches created from main, and main is always deployable. The developer opens a pull request into main; once the review and the required checks pass, the branch is merged and the merge triggers the deployment.
    fr: |
      Dans GitHub flow, tout le travail se fait dans des branches de courte durée créées à partir de main, et main est toujours déployable. Le développeur ouvre une pull request vers main ; une fois la revue et les vérifications requises réussies, la branche est fusionnée et la fusion déclenche le déploiement.
  options:
    a: { en: "GitHub flow has no develop branch; branches are created from main and merged into main.", fr: "GitHub flow n'a pas de branche develop ; les branches sont créées à partir de main et fusionnées dans main." }
    b: { en: "GitHub flow uses no release branch; main itself is the deployable branch.", fr: "GitHub flow n'utilise pas de branche de mise en production ; main est elle-même la branche déployable." }
    c: { en: "Committing directly to main skips the pull request review that GitHub flow relies on.", fr: "Valider directement dans main contourne la revue par pull request sur laquelle repose GitHub flow." }
references:
  - title: Explore branch workflow types
    url: https://learn.microsoft.com/en-us/training/modules/manage-git-branches-workflows/2-explore-branch-workflow-types
