id: az400-2b-tag-pipeline-trigger
objective: "2.2.4"
type: dropdown
difficulty: 3
shuffle: false
status: draft
stem:
  en: |
    Fabrikam has an Azure Repos Git repository named **Engine** and a YAML pipeline for it. The checkout step currently performs a shallow fetch with a depth of 1 and does not fetch tags.

    You need to modify the pipeline to meet the following requirements:

    - CI runs for pushes to main and for pushed tags whose names start with **v**, except release candidate tags such as **v2.0.0-rc1**.
    - The `git describe --tags` command must find the most recent tag, which can be hundreds of commits behind the commit being built.

    How should you complete the YAML? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam dispose d'un dépôt Git Azure Repos nommé **Engine** et d'un pipeline YAML associé. L'étape checkout effectue actuellement une extraction superficielle (shallow fetch) d'une profondeur de 1 et ne récupère pas les balises.

    Vous devez modifier le pipeline pour répondre aux exigences suivantes :

    - La CI s'exécute pour les push vers main et pour les balises poussées dont le nom commence par **v**, à l'exception des balises de version candidate comme **v2.0.0-rc1**.
    - La commande `git describe --tags` doit trouver la balise la plus récente, qui peut se trouver des centaines de commits avant le commit généré.

    Comment devez-vous compléter le code YAML ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: yaml
  template: |
    trigger:
      branches:
        include:
        - main
      [[key]]:
        include:
        - v*
        [[exc]]:
        - v*-rc*

    steps:
    - checkout: self
      [[fetch]]
      fetchDepth: [[depth]]
    - script: git describe --tags
      displayName: Compute version
  slots:
    - id: key
      options:
        - { id: paths, text: paths }
        - { id: tags, text: tags }
        - { id: batch, text: batch }
    - id: exc
      options:
        - { id: exclude, text: exclude }
        - { id: tagsignore, text: tags-ignore }
    - id: fetch
      options:
        - { id: persist, text: "persistCredentials: true" }
        - { id: clean, text: "clean: true" }
        - { id: ftrue, text: "fetchTags: true" }
        - { id: ffalse, text: "fetchTags: false" }
    - id: depth
      options:
        - { id: d0, text: "0" }
        - { id: d1, text: "1" }
        - { id: d10, text: "10" }
answer:
  values: { key: tags, exc: exclude, fetch: ftrue, depth: d0 }
explanation:
  correct:
    en: "In an Azure Pipelines CI trigger, tags are filtered in a `tags` section with `include` and `exclude` lists; without a tag filter, pushed tags do not trigger the pipeline. `fetchTags: true` makes the checkout fetch the tags, and `fetchDepth: 0` fetches the full history so that `git describe` can reach a tag that is many commits back."
    fr: "Dans un déclencheur CI Azure Pipelines, les balises sont filtrées dans une section `tags` avec des listes `include` et `exclude` ; sans filtre de balises, les balises poussées ne déclenchent pas le pipeline. `fetchTags: true` fait récupérer les balises par l'étape checkout, et `fetchDepth: 0` récupère tout l'historique pour que `git describe` atteigne une balise située de nombreux commits en arrière."
  options:
    paths: { en: "A paths filter selects runs by the files changed in the push, not by tag name.", fr: "Un filtre paths sélectionne les exécutions selon les fichiers modifiés par le push, pas selon le nom de la balise." }
    tagsignore: { en: "tags-ignore is GitHub Actions syntax; Azure Pipelines uses include and exclude.", fr: "tags-ignore est une syntaxe GitHub Actions ; Azure Pipelines utilise include et exclude." }
    persist: { en: "persistCredentials keeps the token for later Git commands; it does not fetch tags.", fr: "persistCredentials conserve le jeton pour les commandes Git suivantes ; il ne récupère pas les balises." }
    d1: { en: "A depth of 1 fetches only the built commit, so git describe cannot find an older tag.", fr: "Une profondeur de 1 ne récupère que le commit généré : git describe ne peut pas trouver une balise plus ancienne." }
    d10: { en: "Ten commits are not enough when the tag can be hundreds of commits back.", fr: "Dix commits ne suffisent pas lorsque la balise peut se trouver des centaines de commits en arrière." }
references:
  - title: Build Azure Repos Git or TFS Git repositories
    url: https://learn.microsoft.com/en-us/azure/devops/pipelines/repos/azure-repos-git
