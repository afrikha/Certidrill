stem:
  en: You configure Git LFS tracking and switch the remotes to HTTPS.
  fr: Vous configurez le suivi Git LFS et basculez les dépôts distants vers HTTPS.
body:
  solution:
    en: |
      Each artist installs the Git LFS client and changes the `origin` remote of their clone to the **HTTPS** URL of GameAssets. You run the following commands once, commit the resulting `.gitattributes` file and push it before the artists add the new files.

      ```bash
      git lfs install
      git lfs track "*.psd" "*.fbx"
      git add .gitattributes
      git commit -m "Track PSD and FBX files with Git LFS"
      ```
    fr: |
      Chaque artiste installe le client Git LFS et remplace le dépôt distant `origin` de son clone par l'URL **HTTPS** de GameAssets. Vous exécutez une fois les commandes suivantes, commitez le fichier `.gitattributes` obtenu et l'envoyez avant que les artistes n'ajoutent les nouveaux fichiers.

      ```bash
      git lfs install
      git lfs track "*.psd" "*.fbx"
      git add .gitattributes
      git commit -m "Track PSD and FBX files with Git LFS"
      ```
answer: { value: true }
explanation:
  correct:
    en: Azure DevOps Services supports Git LFS for free. With the LFS client installed on every workstation and the tracking patterns committed in `.gitattributes`, the history stores pointer files while the binaries go to LFS storage, and HTTPS avoids the SSH limitation of Azure Repos for LFS.
    fr: Azure DevOps Services prend en charge Git LFS gratuitement. Avec le client LFS installé sur chaque poste et les modèles de suivi commités dans `.gitattributes`, l'historique stocke des fichiers pointeurs tandis que les fichiers binaires vont dans le stockage LFS, et HTTPS évite la limitation SSH d'Azure Repos pour LFS.
references:
  - title: Manage and Store Large Files in Git - Azure Repos
    url: https://learn.microsoft.com/en-us/azure/devops/repos/git/manage-large-files
