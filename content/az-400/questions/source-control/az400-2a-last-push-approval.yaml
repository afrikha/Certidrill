id: az400-2a-last-push-approval
objective: "2.1.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Woodgrove has an Azure Repos repository. The `main` branch has a Minimum number of reviewers policy set to 1, with **Allow requestors to approve their own changes** cleared and **When new changes are pushed** set to **Reset all approval votes (does not reset votes to reject or wait)**.

    A compliance review found that a reviewer pushed a commit to another developer's pull request branch and then approved the pull request, which was completed with only that approval.

    You need to ensure that the vote of the person who pushed the latest changes never counts toward the minimum number of reviewers. The solution must not increase the number of required approvals.

    What should you do?
  fr: |
    Woodgrove dispose d'un dépôt Azure Repos. La branche `main` a une stratégie Minimum number of reviewers définie sur 1, avec **Allow requestors to approve their own changes** désactivé et **When new changes are pushed** défini sur **Reset all approval votes (does not reset votes to reject or wait)**.

    Un contrôle de conformité a révélé qu'un réviseur a envoyé un commit dans la branche de la pull request d'un autre développeur, puis a approuvé la pull request, qui a été terminée avec cette seule approbation.

    Vous devez vous assurer que le vote de la personne qui a envoyé les derniers changements ne compte jamais dans le nombre minimum de réviseurs. La solution ne doit pas augmenter le nombre d'approbations requises.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Change When new changes are pushed to Reset all code reviewer votes.", fr: "Définir When new changes are pushed sur Reset all code reviewer votes." }
    - id: b
      text: { en: "Clear Allow completion even if some reviewers vote to wait or reject.", fr: "Désactiver Allow completion even if some reviewers vote to wait or reject." }
    - id: c
      text: { en: "Enable Prohibit the most recent pusher from approving their own changes.", fr: "Activer Prohibit the most recent pusher from approving their own changes." }
    - id: d
      text: { en: "Enable the Strict Vote Mode setting of the repository.", fr: "Activer le paramètre Strict Vote Mode du dépôt." }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Prohibit the most recent pusher from approving their own changes enforces segregation of duties; the vote of the person who pushed last doesn't count, even if that person could otherwise approve. The reviewer who pushed a commit can no longer be the only approval, and the minimum stays at one.
    fr: |
      Prohibit the most recent pusher from approving their own changes impose la séparation des tâches ; le vote de la dernière personne à avoir envoyé des changements ne compte pas, même si elle pourrait normalement approuver. Le réviseur qui a envoyé un commit ne peut plus constituer la seule approbation, et le minimum reste à un.
  options:
    a: { en: "Votes are reset when the commit is pushed, but the pusher can approve again afterwards and that vote counts.", fr: "Les votes sont réinitialisés lors de l'envoi du commit, mais la personne qui l'a envoyé peut approuver ensuite, et ce vote compte." }
    b: { en: "This option only controls whether wait or reject votes block completion.", fr: "Cette option détermine seulement si les votes d'attente ou de rejet bloquent la finalisation." }
    d: { en: "Strict Vote Mode requires the Contribute permission to vote; the reviewer already has it.", fr: "Strict Vote Mode exige l'autorisation Contribute pour voter ; le réviseur la possède déjà." }
references:
  - title: Set and manage branch policies
    url: https://learn.microsoft.com/en-us/azure/devops/repos/git/branch-policies
