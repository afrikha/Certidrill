id: az400-2b-perm-github-triage
objective: "2.2.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Tailspin Toys has a GitHub organization that contains a private repository named **booking-api**. A project coordinator who is a member of the organization must apply labels, assign issues and pull requests, close and reopen them, and request reviews.

    The coordinator must not be able to push code or merge pull requests. The solution must follow the principle of least privilege.

    Which repository role should you assign to the coordinator?
  fr: |
    Tailspin Toys dispose d'une organisation GitHub qui contient un dépôt privé nommé **booking-api**. Une coordinatrice de projet, membre de l'organisation, doit appliquer des étiquettes, attribuer des problèmes (issues) et des demandes de tirage (pull requests), les fermer et les rouvrir, et demander des révisions.

    La coordinatrice ne doit pas pouvoir pousser du code ni fusionner des demandes de tirage. La solution doit respecter le principe du moindre privilège.

    Quel rôle de dépôt devez-vous attribuer à la coordinatrice ?
body:
  options:
    - { id: a, text: Read }
    - { id: b, text: Write }
    - { id: c, text: Triage }
    - { id: d, text: Maintain }
answer: { optionId: c }
explanation:
  correct:
    en: The Triage role is designed for contributors who manage issues, discussions and pull requests without write access. It lets the coordinator apply labels, assign, close and reopen issues and pull requests, and request reviews, but not push code or merge.
    fr: Le rôle Triage est conçu pour les contributeurs qui gèrent les problèmes, les discussions et les demandes de tirage sans accès en écriture. Il permet d'appliquer des étiquettes, d'attribuer, de fermer et de rouvrir des problèmes et des demandes de tirage, et de demander des révisions, mais pas de pousser du code ni de fusionner.
  options:
    a:
      en: Read lets a user open and comment on issues and review pull requests, but not apply labels or assign issues.
      fr: Read permet d'ouvrir des problèmes, de les commenter et de réviser des demandes de tirage, mais pas d'appliquer des étiquettes ni d'attribuer des problèmes.
    b:
      en: Write lets a user push code and merge pull requests, which the coordinator must not do.
      fr: Write permet de pousser du code et de fusionner des demandes de tirage, ce que la coordinatrice ne doit pas faire.
    d:
      en: Maintain includes Write and repository management tasks, so it also allows pushing and merging.
      fr: |
        Maintain inclut Write et des tâches de gestion du dépôt : il permet donc aussi de pousser et de fusionner.
references:
  - title: Configure repository permissions using GitHub
    url: https://learn.microsoft.com/en-us/training/modules/manage-git-repositories/12-configure-source-control-repository-permissions-use-github
