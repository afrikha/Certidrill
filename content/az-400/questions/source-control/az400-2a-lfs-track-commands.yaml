id: az400-2a-lfs-track-commands
objective: "2.2.1"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    Fabrikam has a GitHub repository for a simulation product. A developer has just installed the Git LFS client on a workstation that has never used Git LFS.

    The developer needs to store all the `.fbx` model files of the repository in Git LFS, starting with a new file named `models/ship.fbx`, and share the tracking configuration with the team.

    How should the developer complete the commands? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam dispose d'un dépôt GitHub pour un produit de simulation. Un développeur vient d'installer le client Git LFS sur un poste de travail qui n'a jamais utilisé Git LFS.

    Le développeur doit stocker dans Git LFS tous les fichiers de modèles `.fbx` du dépôt, en commençant par un nouveau fichier nommé `models/ship.fbx`, et partager la configuration de suivi avec l'équipe.

    Comment le développeur doit-il compléter les commandes ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: bash
  template: |
    git lfs [[setup]]
    git lfs [[cmd]] "*.fbx"
    git add [[file]] models/ship.fbx
    git commit -m "Store FBX models in Git LFS"
    git push
  slots:
    - id: setup
      options:
        - { id: install, text: install }
        - { id: pull, text: pull }
        - { id: prune, text: prune }
    - id: cmd
      options:
        - { id: track, text: track }
        - { id: lock, text: lock }
        - { id: lsfiles, text: ls-files }
        - { id: migrate, text: migrate }
    - id: file
      options:
        - { id: attr, text: .gitattributes }
        - { id: ignore, text: .gitignore }
        - { id: modules, text: .gitmodules }
        - { id: lfsconfig, text: .lfsconfig }
answer:
  values: { setup: install, cmd: track, file: attr }
explanation:
  correct:
    en: |
      git lfs install sets up the Git LFS filters and hooks for the user, once per workstation. git lfs track writes the pattern to the .gitattributes file, and that file must be committed so that every clone sends matching files to LFS. The .fbx file added afterward is stored as a pointer in the commit and its content is uploaded to LFS storage on push.
    fr: |
      git lfs install configure les filtres et les hooks Git LFS pour l'utilisateur, une fois par poste de travail. git lfs track écrit le modèle dans le fichier .gitattributes, et ce fichier doit être validé pour que chaque clone envoie les fichiers correspondants vers LFS. Le fichier .fbx ajouté ensuite est stocké sous forme de pointeur dans le commit, et son contenu est chargé dans le stockage LFS lors de l'envoi.
  options:
    pull: { en: "git lfs pull downloads LFS content for the current checkout; it doesn't set up the client.", fr: "git lfs pull télécharge le contenu LFS de l'extraction en cours ; il ne configure pas le client." }
    lock: { en: "git lfs lock locks a file for editing; it doesn't define which files go to LFS.", fr: "git lfs lock verrouille un fichier pour le modifier ; il ne définit pas les fichiers qui vont dans LFS." }
    migrate: { en: "git lfs migrate rewrites existing history; tracking a pattern for new files uses git lfs track.", fr: "git lfs migrate réécrit l'historique existant ; suivre un modèle pour de nouveaux fichiers se fait avec git lfs track." }
    ignore: { en: ".gitignore excludes files from Git; the LFS patterns are stored in .gitattributes.", fr: ".gitignore exclut des fichiers de Git ; les modèles LFS sont stockés dans .gitattributes." }
references:
  - title: Work with large files in your Git repo
    url: https://learn.microsoft.com/en-us/azure/devops/repos/git/manage-large-files
