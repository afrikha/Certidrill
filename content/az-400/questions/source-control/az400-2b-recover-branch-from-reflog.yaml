id: az400-2b-recover-branch-from-reflog
objective: "2.2.5"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A developer created a local branch named **spike/cache**, made three commits on it and never pushed it. The developer then checked out main and ran `git branch -D spike/cache`.

    By using `git reflog`, you find that **3f9a2b1** is the last commit that was made on spike/cache.

    You need to recreate the spike/cache branch so that it points to 3f9a2b1 and contains its three commits. The main branch must not change.

    Which two commands can you run? Each correct answer presents a complete solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Un développeur a créé une branche locale nommée **spike/cache**, y a effectué trois commits et ne l'a jamais poussée. Il a ensuite extrait main et exécuté `git branch -D spike/cache`.

    À l'aide de `git reflog`, vous trouvez que **3f9a2b1** est le dernier commit effectué sur spike/cache.

    Vous devez recréer la branche spike/cache pour qu'elle pointe vers 3f9a2b1 et contienne ses trois commits. La branche main ne doit pas changer.

    Quelles sont les deux commandes que vous pouvez exécuter ? Chaque bonne réponse constitue une solution complète.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: "`git cherry-pick 3f9a2b1`" }
    - { id: b, text: "`git branch spike/cache 3f9a2b1`" }
    - { id: c, text: "`git reset --soft 3f9a2b1`" }
    - { id: d, text: "`git checkout -b spike/cache 3f9a2b1`" }
    - { id: e, text: "`git revert 3f9a2b1`" }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: Deleting a branch removes only the reference; its commits stay in the object database, and the HEAD reflog still records their hashes. `git branch spike/cache 3f9a2b1` creates the branch at that commit, and `git checkout -b spike/cache 3f9a2b1` does the same and also switches to it. Neither command changes main.
    fr: Supprimer une branche ne supprime que la référence ; ses commits restent dans la base d'objets, et le reflog de HEAD conserve leurs hachages. `git branch spike/cache 3f9a2b1` crée la branche sur ce commit, et `git checkout -b spike/cache 3f9a2b1` fait de même tout en basculant dessus. Aucune de ces commandes ne modifie main.
  options:
    a: { en: "cherry-pick copies only the changes of 3f9a2b1 into a new commit on main, which changes main and loses the two earlier commits.", fr: "cherry-pick copie uniquement les modifications de 3f9a2b1 dans un nouveau commit sur main, ce qui modifie main et perd les deux commits précédents." }
    c: { en: "reset --soft moves the current branch, main, to 3f9a2b1 instead of recreating spike/cache.", fr: "reset --soft déplace la branche actuelle, main, vers 3f9a2b1 au lieu de recréer spike/cache." }
    e: { en: "revert adds a commit on main that reverses changes; it does not recreate a branch.", fr: "revert ajoute sur main un commit qui inverse des modifications ; il ne recrée pas de branche." }
references:
  - title: Recover specific data by using Git commands
    url: https://learn.microsoft.com/en-us/training/modules/manage-git-repositories/6-recover-specific-data-git-commands
