id: az400-cs3b-branch-policies
objective: "2.1.3"
type: multi
caseStudy: az400-cs3b-proseware-games
difficulty: 2
status: draft
stem:
  en: |
    You need to configure the main branch of skyforge to meet the source control requirements 1 and 2. Which two branch policies should you configure? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez configurer la branche main de skyforge pour satisfaire les exigences de contrôle de code source 1 et 2. Quelles sont les deux stratégies de branche à configurer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Automatically included reviewers: Engine Leads, path filter /Engine/*, set to Required", fr: "Réviseurs inclus automatiquement : Engine Leads, filtre de chemin /Engine/*, défini sur Obligatoire" } }
    - { id: b, text: { en: "Require a minimum number of reviewers: 1, with requestors not allowed to approve their own changes", fr: "Exiger un nombre minimal de réviseurs : 1, sans autoriser les demandeurs à approuver leurs propres modifications" } }
    - { id: c, text: { en: "Build validation: path filter /Engine/*, trigger Automatic, set to Required", fr: "Validation de build : filtre de chemin /Engine/*, déclencheur Automatique, défini sur Obligatoire" } }
    - { id: d, text: { en: "Limit merge types: allow only Squash merge", fr: "Limiter les types de fusion : autoriser uniquement Squash merge" } }
    - { id: e, text: { en: "Limit merge types: allow only Rebase and fast-forward", fr: "Limiter les types de fusion : autoriser uniquement Rebase and fast-forward" } }
answer: { optionIds: [a, d] }
explanation:
  correct:
    en: |
      An automatically included reviewers policy with a path filter adds Engine Leads to every pull request that changes files in /Engine, and setting it to Required blocks completion until a member of the group approves. Allowing only squash merges condenses the commits of each pull request into a single new commit on main.
    fr: |
      Une stratégie de réviseurs inclus automatiquement avec un filtre de chemin ajoute Engine Leads à chaque pull request qui modifie des fichiers de /Engine, et la définir sur Obligatoire bloque la fin de la pull request jusqu'à ce qu'un membre du groupe l'approuve. N'autoriser que les fusions squash condense les commits de chaque pull request en un seul nouveau commit sur main.
  options:
    b:
      en: |
        A minimum number of reviewers can be met by any reviewer, not specifically by a member of Engine Leads, and it does not depend on the changed paths.
      fr: |
        Un nombre minimal de réviseurs peut être atteint par n'importe quel réviseur, pas forcément par un membre d'Engine Leads, et il ne dépend pas des chemins modifiés.
    c:
      en: |
        Build validation requires a successful build, not an approval by a group.
      fr: |
        La validation de build exige une build réussie, pas l'approbation d'un groupe.
    e:
      en: |
        Rebase and fast-forward replays every commit of the source branch on main, so a pull request can add several commits.
      fr: |
        Rebase and fast-forward rejoue chaque commit de la branche source sur main : une pull request peut donc ajouter plusieurs commits.
references:
  - title: Set and manage branch policies
    url: https://learn.microsoft.com/en-us/azure/devops/repos/git/branch-policies
