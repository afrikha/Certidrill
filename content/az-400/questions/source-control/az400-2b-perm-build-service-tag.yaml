id: az400-2b-perm-build-service-tag
objective: "2.2.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Contoso has an Azure DevOps project named **Retail** in an organization named **contoso**. A YAML pipeline builds an Azure Repos Git repository named **Storefront**. The checkout step sets `persistCredentials: true`, and a script step runs `git tag -a v3.1.0 -m "Release 3.1.0"` followed by `git push origin v3.1.0`.

    The push fails with an error stating that the Git **CreateTag** permission is missing. The project setting that limits the job authorization scope to the current project is enabled.

    You need to make the push succeed. The solution must follow the principle of least privilege.

    What should you do?
  fr: |
    Contoso dispose d'un projet Azure DevOps nommé **Retail** dans une organisation nommée **contoso**. Un pipeline YAML génère un dépôt Git Azure Repos nommé **Storefront**. L'étape checkout définit `persistCredentials: true`, et une étape de script exécute `git tag -a v3.1.0 -m "Release 3.1.0"` puis `git push origin v3.1.0`.

    Le push échoue avec une erreur indiquant que l'autorisation Git **CreateTag** est manquante. Le paramètre de projet qui limite l'étendue d'autorisation des travaux au projet actuel est activé.

    Vous devez faire en sorte que le push réussisse. La solution doit respecter le principe du moindre privilège.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Allow Create tag for the Project Collection Build Service Accounts group on All Repositories.", fr: "Autoriser Create tag pour le groupe Project Collection Build Service Accounts sur All Repositories." }
    - id: b
      text: { en: "Allow Force push for the Retail Build Service (contoso) user on the Storefront repository.", fr: "Autoriser Force push pour l'utilisateur Retail Build Service (contoso) sur le dépôt Storefront." }
    - id: c
      text: { en: "Add the Retail Build Service (contoso) user to the Contributors group of the Retail project.", fr: "Ajouter l'utilisateur Retail Build Service (contoso) au groupe Contributors du projet Retail." }
    - id: d
      text: { en: "Allow Create tag for the Retail Build Service (contoso) user on the Storefront repository.", fr: "Autoriser Create tag pour l'utilisateur Retail Build Service (contoso) sur le dépôt Storefront." }
answer: { optionId: d }
explanation:
  correct:
    en: With the job authorization scope limited to the current project, the pipeline runs as the project build service identity, named Retail Build Service (contoso). By default it can read the repository but not push, so you allow only Create tag for that user, on the Storefront repository only.
    fr: |
      Lorsque l'étendue d'autorisation des travaux est limitée au projet actuel, le pipeline s'exécute sous l'identité du service de build du projet, nommée Retail Build Service (contoso). Par défaut, elle peut lire le dépôt mais pas pousser : vous autorisez donc uniquement Create tag pour cet utilisateur, et seulement sur le dépôt Storefront.
  options:
    a:
      en: The pipeline does not run as the collection-level build service identity here, and granting the permission on all repositories exceeds what is needed.
      fr: Ici, le pipeline ne s'exécute pas sous l'identité de service de build de la collection, et accorder l'autorisation sur tous les dépôts dépasse les besoins.
    b:
      en: Force push lets the identity rewrite history and delete branches and tags; it does not grant the missing CreateTag permission.
      fr: Force push permet à l'identité de réécrire l'historique et de supprimer des branches et des balises ; elle n'accorde pas l'autorisation CreateTag manquante.
    c:
      en: Contributors membership would grant Create tag, but also Contribute and Create branch on every repository of the project, which is more than needed.
      fr: L'appartenance au groupe Contributors accorderait Create tag, mais aussi Contribute et Create branch sur tous les dépôts du projet, ce qui dépasse les besoins.
references:
  - title: Run Git commands in pipeline scripts
    url: https://learn.microsoft.com/en-us/azure/devops/pipelines/scripts/git-commands
  - title: Set Git repository permissions
    url: https://learn.microsoft.com/en-us/azure/devops/repos/git/set-git-repository-permissions
