id: az400-2a-policy-match
objective: "2.1.2"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam has an Azure Repos repository named **Orders** and a YAML pipeline named **Orders-CI**. You are designing the pull request workflow for the `main` branch of Orders.

    Which branch policy should you configure for each requirement? To answer, drag the appropriate policies to the correct requirements. Each policy may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam dispose d'un dépôt Azure Repos nommé **Orders** et d'un pipeline YAML nommé **Orders-CI**. Vous concevez le workflow de pull request de la branche `main` d'Orders.

    Quelle stratégie de branche devez-vous configurer pour chaque exigence ? Pour répondre, faites glisser les stratégies appropriées vers les exigences correspondantes. Chaque stratégie peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: min, text: Minimum number of reviewers }
    - { id: auto, text: Automatically included reviewers }
    - { id: build, text: Build validation }
    - { id: status, text: Status checks }
    - { id: comment, text: Check for comment resolution }
    - { id: merge, text: Limit merge types }
  targets:
    - id: dba
      text: { en: "The Database Admins group must approve every pull request that changes a .sql file.", fr: "Le groupe Database Admins doit approuver chaque pull request qui modifie un fichier .sql." }
    - id: scan
      text: { en: "A third-party code scanning service posts its result to the pull request, and that result must be successful.", fr: "Un service tiers d'analyse du code publie son résultat dans la pull request, et ce résultat doit être un succès." }
    - id: ci
      text: { en: "Orders-CI must run and succeed for the changes of the pull request.", fr: "Orders-CI doit s'exécuter et réussir pour les changements de la pull request." }
    - id: threads
      text: { en: "Every review comment must be resolved before the pull request is completed.", fr: "Chaque commentaire de revue doit être résolu avant que la pull request soit terminée." }
answer:
  mapping: { dba: auto, scan: status, ci: build, threads: comment }
explanation:
  correct:
    en: |
      Automatically included reviewers adds a group as Required reviewers for the paths you specify, such as *.sql. Status checks require a status posted by an external service through the pull request status API. Build validation queues an Azure Pipelines build for the pull request and can require it to succeed. Check for comment resolution blocks completion until comments are resolved.
    fr: |
      Automatically included reviewers ajoute un groupe comme réviseurs Required pour les chemins indiqués, comme *.sql. Status checks exige un état publié par un service externe au moyen de l'API d'état des pull requests. Build validation met en file d'attente un build Azure Pipelines pour la pull request et peut exiger sa réussite. Check for comment resolution bloque la finalisation tant que les commentaires ne sont pas résolus.
  options:
    min: { en: "Minimum number of reviewers counts approvals from anyone; it can't target a group or a file type.", fr: "Minimum number of reviewers compte les approbations de n'importe qui ; il ne peut cibler ni un groupe ni un type de fichier." }
    merge: { en: "Limit merge types controls how the pull request is merged, not whether it may be completed.", fr: "Limit merge types contrôle la façon dont la pull request est fusionnée, pas si elle peut être terminée." }
references:
  - title: Set and manage branch policies
    url: https://learn.microsoft.com/en-us/azure/devops/repos/git/branch-policies
