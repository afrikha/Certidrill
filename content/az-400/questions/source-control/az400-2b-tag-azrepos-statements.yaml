id: az400-2b-tag-azrepos-statements
objective: "2.2.4"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam has an Azure Repos Git repository named **Billing**. The repository uses the default permissions. A YAML pipeline for Billing contains the following trigger.

    ```yaml
    trigger:
      branches:
        include:
        - main
    ```

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam dispose d'un dépôt Git Azure Repos nommé **Billing**. Le dépôt utilise les autorisations par défaut. Un pipeline YAML pour Billing contient le déclencheur suivant.

    ```yaml
    trigger:
      branches:
        include:
        - main
    ```

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: You can create a lightweight tag from the Tags page of the Billing repository in the web portal.
        fr: Vous pouvez créer une balise légère depuis la page Tags du dépôt Billing dans le portail web.
    - id: s2
      text:
        en: The user who created a tag can delete that tag without being granted any additional permission.
        fr: L'utilisateur qui a créé une balise peut supprimer cette balise sans recevoir d'autorisation supplémentaire.
    - id: s3
      text:
        en: Pushing a tag named v1.0.0 to Billing does not start a CI run of the pipeline.
        fr: Pousser une balise nommée v1.0.0 vers Billing ne démarre pas d'exécution CI du pipeline.
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: The web portal creates annotated tags only; lightweight tags are created with the Git command line. Deleting a tag requires Force push, and the tag's creator inherits Force push on that tag. When a trigger specifies no tag filter, pushed tags do not trigger the pipeline.
    fr: Le portail web ne crée que des balises annotées ; les balises légères se créent en ligne de commande Git. La suppression d'une balise exige Force push, et le créateur d'une balise hérite de Force push sur cette balise. Lorsqu'un déclencheur ne précise aucun filtre de balises, les balises poussées ne déclenchent pas le pipeline.
references:
  - title: Use Git tags
    url: https://learn.microsoft.com/en-us/azure/devops/repos/git/git-tags
  - title: Build Azure Repos Git or TFS Git repositories
    url: https://learn.microsoft.com/en-us/azure/devops/pipelines/repos/azure-repos-git
