id: az400-2b-remove-untrack-file
objective: "2.2.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Litware has an Azure Repos Git repository. A developer committed the file **.vscode/settings.json**, which contains only personal editor preferences and no secret.

    You need to ensure that Git stops tracking the file in future commits. Each developer must keep a local copy of the file, and the existing history does not need to change.

    What should you do?
  fr: |
    Litware dispose d'un dépôt Git Azure Repos. Un développeur a commité le fichier **.vscode/settings.json**, qui ne contient que des préférences personnelles d'éditeur et aucun secret.

    Vous devez faire en sorte que Git cesse de suivre le fichier dans les prochains commits. Chaque développeur doit conserver une copie locale du fichier, et l'historique existant n'a pas besoin d'être modifié.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Run `git rm .vscode/settings.json`, add the path to `.gitignore`, and commit.", fr: "Exécuter `git rm .vscode/settings.json`, ajouter le chemin à `.gitignore`, puis commiter." } }
    - { id: b, text: { en: "Add the path to `.gitignore` only, and commit the `.gitignore` file.", fr: "Ajouter uniquement le chemin à `.gitignore`, puis commiter le fichier `.gitignore`." } }
    - { id: c, text: { en: "Run `git rm --cached .vscode/settings.json`, add the path to `.gitignore`, and commit.", fr: "Exécuter `git rm --cached .vscode/settings.json`, ajouter le chemin à `.gitignore`, puis commiter." } }
    - { id: d, text: { en: "Run `git filter-repo --invert-paths --path .vscode/settings.json`, and force push.", fr: "Exécuter `git filter-repo --invert-paths --path .vscode/settings.json`, puis effectuer un push forcé." } }
answer: { optionId: c }
explanation:
  correct:
    en: "`git rm --cached` removes the file from the index only, so the next commit stops tracking it while the working tree copy stays on disk. Adding the path to `.gitignore` prevents the file from being added again."
    fr: "`git rm --cached` retire le fichier de l'index uniquement : le commit suivant cesse de le suivre, tandis que la copie de l'arborescence de travail reste sur le disque. Ajouter le chemin à `.gitignore` empêche que le fichier soit de nouveau ajouté."
  options:
    a:
      en: Without `--cached`, git rm also deletes the file from the working tree.
      fr: Sans `--cached`, git rm supprime aussi le fichier de l'arborescence de travail.
    b:
      en: "`.gitignore` affects only untracked files; a file that is already tracked keeps being tracked."
      fr: "`.gitignore` ne concerne que les fichiers non suivis ; un fichier déjà suivi continue d'être suivi."
    d:
      en: Rewriting history is not needed for a file without secrets, and it forces every developer to resynchronize.
      fr: Réécrire l'historique n'est pas nécessaire pour un fichier sans secret, et cela oblige chaque développeur à se resynchroniser.
references:
  - title: Clean up repository data
    url: https://learn.microsoft.com/en-us/training/modules/manage-git-repositories/7-purge-repository-data
