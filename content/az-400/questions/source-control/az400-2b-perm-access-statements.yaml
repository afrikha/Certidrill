id: az400-2b-perm-access-statements
objective: "2.2.3"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Northwind Traders has an Azure DevOps organization that contains a private project named **Retail**. Retail contains several Azure Repos Git repositories. The default security groups, permissions and repository settings are unchanged.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind Traders dispose d'une organisation Azure DevOps qui contient un projet privé nommé **Retail**. Retail contient plusieurs dépôts Git Azure Repos. Les groupes de sécurité, les autorisations et les paramètres de dépôt par défaut n'ont pas été modifiés.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: A project member who has the Stakeholder access level can browse the code of the Retail repositories.
        fr: Un membre du projet qui dispose du niveau d'accès Stakeholder peut parcourir le code des dépôts de Retail.
    - id: s2
      text:
        en: Members of the Readers group can comment on and vote on pull requests.
        fr: Les membres du groupe Readers peuvent commenter des demandes de tirage et voter sur celles-ci.
    - id: s3
      text:
        en: A member of the Contributors group who creates a branch receives the Force push permission on that branch.
        fr: Un membre du groupe Contributors qui crée une branche reçoit l'autorisation Force push sur cette branche.
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: In a private project, the Stakeholder access level gives no access to Azure Repos. The Read permission, which Readers have by default, includes creating, commenting on and voting on pull requests. A branch creator automatically receives explicit Contribute, Force push and Remove others' locks permissions on that branch (and Manage permissions when the repository setting allows it).
    fr: Dans un projet privé, le niveau d'accès Stakeholder ne donne aucun accès à Azure Repos. L'autorisation Read, que les Readers ont par défaut, inclut la création, le commentaire et le vote sur les demandes de tirage. Le créateur d'une branche reçoit automatiquement les autorisations explicites Contribute, Force push et Remove others' locks sur cette branche (et Manage permissions lorsque le paramètre du dépôt le permet).
references:
  - title: Set Git repository permissions
    url: https://learn.microsoft.com/en-us/azure/devops/repos/git/set-git-repository-permissions
  - title: Set branch permissions
    url: https://learn.microsoft.com/en-us/azure/devops/repos/git/branch-permissions
