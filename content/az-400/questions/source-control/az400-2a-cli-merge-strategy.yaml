id: az400-2a-cli-merge-strategy
objective: "2.1.3"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    Tailspin has an Azure Repos repository whose ID is stored in `$REPO_ID`. Release branches are created in the `release` branch folder, for example `release/2026.11`.

    You need to create a single blocking policy that applies to every current and future branch of the `release` folder and meets the following requirements:

    - Pull requests can be completed with a squash merge or with a rebase and fast-forward.
    - No merge type that creates a merge commit is allowed.

    How should you complete the command? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin dispose d'un dépôt Azure Repos dont l'ID est stocké dans `$REPO_ID`. Les branches de mise en production sont créées dans le dossier de branches `release`, par exemple `release/2026.11`.

    Vous devez créer une seule stratégie bloquante qui s'applique à toutes les branches actuelles et futures du dossier `release` et qui répond aux exigences suivantes :

    - les pull requests peuvent être terminées par une fusion squash ou par un rebase avec avance rapide (fast-forward) ;
    - aucun type de fusion qui crée un commit de fusion n'est autorisé.

    Comment devez-vous compléter la commande ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: bash
  template: |
    az repos policy [[grp]] create \
      --repository-id $REPO_ID \
      [[scope]] \
      --blocking true --enabled true \
      --allow-squash true --allow-rebase true \
      [[mc]]
  slots:
    - id: grp
      options:
        - { id: merge, text: merge-strategy }
        - { id: approver, text: approver-count }
        - { id: build, text: build }
        - { id: case, text: case-enforcement }
    - id: scope
      options:
        - { id: exactstar, text: "--branch release/* --branch-match-type exact" }
        - { id: prefix, text: "--branch release --branch-match-type prefix" }
        - { id: exact, text: "--branch release --branch-match-type exact" }
    - id: mc
      options:
        - { id: tt, text: "--allow-no-fast-forward true --allow-rebase-merge true" }
        - { id: tf, text: "--allow-no-fast-forward true --allow-rebase-merge false" }
        - { id: ft, text: "--allow-no-fast-forward false --allow-rebase-merge true" }
        - { id: ff, text: "--allow-no-fast-forward false --allow-rebase-merge false" }
answer:
  values: { grp: merge, scope: prefix, mc: ff }
explanation:
  correct:
    en: |
      The Limit merge types policy is created with az repos policy merge-strategy create. With --branch-match-type prefix, the policy applies to all the branch folders that match the prefix, including future branches, whereas exact only matches one branch name. Basic merge (no fast-forward) and Rebase with merge commit both create a merge commit, so --allow-no-fast-forward and --allow-rebase-merge must be false.
    fr: |
      La stratégie Limit merge types se crée avec az repos policy merge-strategy create. Avec --branch-match-type prefix, la stratégie s'applique à tous les dossiers de branches qui correspondent au préfixe, y compris les branches futures, alors que exact ne correspond qu'à un seul nom de branche. Basic merge (no fast-forward) et Rebase with merge commit créent tous deux un commit de fusion : --allow-no-fast-forward et --allow-rebase-merge doivent donc être à false.
  options:
    approver: { en: "approver-count manages the Minimum number of reviewers policy.", fr: "approver-count gère la stratégie Minimum number of reviewers." }
    build: { en: "build manages the Build validation policy.", fr: "build gère la stratégie Build validation." }
    case: { en: "case-enforcement manages case sensitivity of paths, not merge types.", fr: "case-enforcement gère la sensibilité à la casse des chemins, pas les types de fusion." }
    exactstar: { en: "With exact, the value is matched literally; it is not a wildcard pattern.", fr: "Avec exact, la valeur est comparée littéralement ; ce n'est pas un modèle avec caractère générique." }
    exact: { en: "exact would apply the policy only to a branch named release.", fr: "exact n'appliquerait la stratégie qu'à une branche nommée release." }
    ft: { en: "Rebase with merge commit creates a semi-linear history with a merge commit.", fr: "Rebase with merge commit crée un historique semi-linéaire avec un commit de fusion." }
    tf: { en: "Basic merge (no fast-forward) creates a merge commit.", fr: "Basic merge (no fast-forward) crée un commit de fusion." }
references:
  - title: az repos policy merge-strategy
    url: https://learn.microsoft.com/en-us/cli/azure/repos/policy/merge-strategy
