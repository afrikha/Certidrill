id: az400-2b-recover-revert-shared
objective: "2.2.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Northwind Traders has an Azure Repos Git repository. Yesterday, a developer pushed commit **a1b2c3d** to the main branch, and the commit introduced a bug. Since then, a dozen team members have pulled main and pushed more commits.

    You need to undo the changes made by commit a1b2c3d without rewriting the history of main.

    What should you do?
  fr: |
    Northwind Traders dispose d'un dépôt Git Azure Repos. Hier, un développeur a poussé le commit **a1b2c3d** vers la branche main, et ce commit a introduit un bogue. Depuis, une douzaine de membres de l'équipe ont tiré main et poussé d'autres commits.

    Vous devez annuler les modifications apportées par le commit a1b2c3d sans réécrire l'historique de main.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Run `git reset --hard a1b2c3d~1`, and then force push main.", fr: "Exécuter `git reset --hard a1b2c3d~1`, puis effectuer un push forcé de main." } }
    - { id: b, text: { en: "Run `git checkout a1b2c3d~1`, and then push main.", fr: "Exécuter `git checkout a1b2c3d~1`, puis pousser main." } }
    - { id: c, text: { en: "Run `git commit --amend`, and then force push main.", fr: "Exécuter `git commit --amend`, puis effectuer un push forcé de main." } }
    - { id: d, text: { en: "Run `git revert a1b2c3d`, and then push main.", fr: "Exécuter `git revert a1b2c3d`, puis pousser main." } }
answer: { optionId: d }
explanation:
  correct:
    en: "`git revert` creates a new commit that reverses the changes of a1b2c3d and leaves the original commit in place. The local and remote histories stay in sync, which is the safe way to undo a commit that others have already pulled."
    fr: "`git revert` crée un nouveau commit qui inverse les modifications de a1b2c3d et laisse le commit d'origine en place. Les historiques local et distant restent synchronisés : c'est la méthode sûre pour annuler un commit que d'autres ont déjà tiré."
  options:
    a:
      en: A hard reset followed by a force push rewrites the shared history and also discards every commit pushed after a1b2c3d.
      fr: Un `git reset --hard` suivi d'un push forcé réécrit l'historique partagé et supprime aussi tous les commits poussés après a1b2c3d.
    b:
      en: Checking out an older commit only moves HEAD (detached) in your clone; it changes nothing on main.
      fr: Extraire un commit plus ancien ne fait que déplacer HEAD (détaché) dans votre clone ; cela ne change rien sur main.
    c:
      en: "`--amend` rewrites only the latest commit, which is not a1b2c3d, and a force push rewrites shared history."
      fr: "`--amend` ne réécrit que le dernier commit, qui n'est pas a1b2c3d, et un push forcé réécrit l'historique partagé."
references:
  - title: Undo changes
    url: https://learn.microsoft.com/en-us/azure/devops/repos/git/undo
