id: az400-2a-long-feature-flags
objective: "2.1.1"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    Proseware uses trunk-based development in an Azure Repos repository. Azure Pipelines deploys `main` to production after every completed pull request.

    The team starts a new checkout experience that will take four months to build. You need a branching approach that meets the following requirements:

    - The new code reaches production regularly but stays invisible to customers until it is complete.
    - Merge conflicts with the rest of the team are minimized.
    - `main` stays deployable at all times.

    Which two actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware utilise le développement basé sur le tronc dans un dépôt Azure Repos. Azure Pipelines déploie `main` en production après chaque pull request terminée.

    L'équipe démarre une nouvelle expérience de paiement dont le développement prendra quatre mois. Vous avez besoin d'une approche de branches qui répond aux exigences suivantes :

    - le nouveau code arrive régulièrement en production mais reste invisible pour les clients jusqu'à ce qu'il soit terminé ;
    - les conflits de fusion avec le reste de l'équipe sont réduits au minimum ;
    - `main` reste déployable en permanence.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Create a feature/checkout branch and merge it into main when the four months of work are complete.", fr: "Créer une branche feature/checkout et la fusionner dans main quand les quatre mois de travail sont terminés." } }
    - { id: b, text: { en: "Merge the work into main in small increments, at least daily, through short-lived branches and pull requests.", fr: "Fusionner le travail dans main par petits incréments, au moins chaque jour, au moyen de branches de courte durée et de pull requests." } }
    - { id: c, text: { en: "Create a release branch for the checkout experience and deploy that branch to production.", fr: "Créer une branche de mise en production pour l'expérience de paiement et déployer cette branche en production." } }
    - { id: d, text: { en: "Wrap the new code paths in a feature flag that is turned off in production until the work is complete.", fr: "Encapsuler les nouveaux chemins de code dans un indicateur de fonctionnalité désactivé en production jusqu'à la fin du travail." } }
    - { id: e, text: { en: "Exclude the checkout folder from the build validation policy of main until the work is complete.", fr: "Exclure le dossier de paiement de la stratégie de validation de build de main jusqu'à la fin du travail." } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |
      Small, frequent merges through short-lived branches keep the divergence with main minimal, so conflicts stay small. A feature flag decouples deployment from exposure: the unfinished checkout code is deployed with main but stays turned off for customers until the team enables it.
    fr: "Des fusions petites et fréquentes au moyen de branches de courte durée limitent la divergence avec main, donc les conflits restent petits. Un indicateur de fonctionnalité sépare le déploiement de l'exposition : le code de paiement non terminé est déployé avec main mais reste désactivé pour les clients jusqu'à ce que l'équipe l'active."
  options:
    a: { en: "A four-month branch accumulates divergence and ends in a large, conflict-prone merge.", fr: "Une branche de quatre mois accumule les divergences et se termine par une grosse fusion sujette aux conflits." }
    c: { en: "A release branch stabilizes a version cut from main; it is not a way to develop a feature, and deploying it would bypass main.", fr: "Une branche de mise en production stabilise une version créée à partir de main ; ce n'est pas un moyen de développer une fonctionnalité, et la déployer contournerait main." }
    e: { en: "Removing validation from part of the code puts the deployability of main at risk.", fr: "Retirer la validation d'une partie du code met en danger la capacité de déploiement de main." }
references:
  - title: How Microsoft develops with DevOps
    url: https://learn.microsoft.com/en-us/devops/develop/how-microsoft-develops-devops
