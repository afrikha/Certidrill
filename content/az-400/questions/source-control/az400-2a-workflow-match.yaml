id: az400-2a-workflow-match
objective: "2.1.1"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove has three development teams that use Git. Each team must use the branch workflow that best fits its constraints.

    Which workflow should each team use? To answer, drag the appropriate workflows to the correct teams. Each workflow may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove compte trois équipes de développement qui utilisent Git. Chaque équipe doit utiliser le workflow de branches le plus adapté à ses contraintes.

    Quel workflow chaque équipe doit-elle utiliser ? Pour répondre, faites glisser les workflows appropriés vers les équipes correspondantes. Chaque workflow peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: fork, text: { en: "Forking workflow", fr: "Workflow de duplication (fork)" } }
    - { id: release, text: { en: "Release branch workflow", fr: "Workflow de branches de mise en production" } }
    - { id: trunk, text: { en: "Trunk-based development with feature flags", fr: "Développement basé sur le tronc avec indicateurs de fonctionnalité" } }
    - { id: env, text: { en: "One long-lived branch per environment", fr: "Une branche de longue durée par environnement" } }
  targets:
    - id: oss
      text: { en: "An open-source SDK that accepts contributions from people who have no write access to the repository", fr: "Un SDK open source qui accepte des contributions de personnes sans accès en écriture au dépôt" }
    - id: mobile
      text: { en: "A mobile app shipped quarterly, where versions 4.1 and 4.2 must be stabilized and patched in parallel", fr: "Une application mobile livrée chaque trimestre, dont les versions 4.1 et 4.2 doivent être stabilisées et corrigées en parallèle" }
    - id: saas
      text: { en: "A SaaS service deployed many times a day, where unfinished features are merged but hidden from users", fr: "Un service SaaS déployé plusieurs fois par jour, dont les fonctionnalités non terminées sont fusionnées mais masquées aux utilisateurs" }
answer:
  mapping: { oss: fork, mobile: release, saas: trunk }
explanation:
  correct:
    en: |
      In the forking workflow, each contributor works in their own copy of the repository and proposes changes by pull request, so contributors need no write access to the main repository. Release branches are created from main to stabilize a version and receive its fixes, which lets several versions be supported in parallel. Trunk-based development with short-lived branches and feature flags fits continuous deployment, because unfinished code can be merged while staying hidden.
    fr: |
      Dans le workflow de duplication, chaque contributeur travaille dans sa propre copie du dépôt et propose ses changements par pull request ; il n'a donc pas besoin d'accès en écriture au dépôt principal. Les branches de mise en production sont créées à partir de main pour stabiliser une version et recevoir ses correctifs, ce qui permet de prendre en charge plusieurs versions en parallèle. Le développement basé sur le tronc, avec des branches de courte durée et des indicateurs de fonctionnalité, convient au déploiement continu, car le code non terminé peut être fusionné tout en restant masqué.
  options:
    env:
      en: |
        Environment branches add long-lived branches and merges without solving any of the three constraints; promotion between environments belongs to the pipeline.
      fr: |
        Les branches d'environnement ajoutent des branches de longue durée et des fusions sans répondre à aucune des trois contraintes ; la promotion entre environnements relève du pipeline.
references:
  - title: Explore branch workflow types
    url: https://learn.microsoft.com/en-us/training/modules/manage-git-branches-workflows/2-explore-branch-workflow-types
