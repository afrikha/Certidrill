id: az400-2b-remove-binary-rebase
objective: "2.2.6"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam has an Azure Repos Git repository named **Docs**. You accidentally committed a 600 MB video in commit **7d0e9f3** and pushed it to a branch named **docs-update**. Nobody else has pushed to docs-update since, and the team has stopped pushing. The previous commit, **25b4c1e**, is good. You have the **Force push** permission.

    You need to remove commit 7d0e9f3 from the history of docs-update in Azure Repos.

    How should you complete the commands? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam dispose d'un dépôt Git Azure Repos nommé **Docs**. Vous avez commité par erreur une vidéo de 600 Mo dans le commit **7d0e9f3** et l'avez poussée vers une branche nommée **docs-update**. Personne d'autre n'a poussé vers docs-update depuis, et l'équipe a cessé de pousser. Le commit précédent, **25b4c1e**, est correct. Vous disposez de l'autorisation **Force push**.

    Vous devez supprimer le commit 7d0e9f3 de l'historique de docs-update dans Azure Repos.

    Comment devez-vous compléter les commandes ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: bash
  template:
    en: |
      git checkout docs-update
      git rebase [[opt]] 25b4c1e
      # In the todo list, replace "pick" with the following command
      # on the line of commit 7d0e9f3: [[act]]

      git push [[push]]
    fr: |
      git checkout docs-update
      git rebase [[opt]] 25b4c1e
      # Dans la liste des tâches, remplacez "pick" par la commande suivante
      # sur la ligne du commit 7d0e9f3 : [[act]]

      git push [[push]]
  slots:
    - id: opt
      options:
        - { id: onto, text: "--onto" }
        - { id: cont, text: "--continue" }
        - { id: inter, text: "-i" }
        - { id: abort, text: "--abort" }
    - id: act
      options:
        - { id: drop, text: drop }
        - { id: squash, text: squash }
        - { id: edit, text: edit }
        - { id: reword, text: reword }
    - id: push
      options:
        - { id: tags, text: "--tags" }
        - { id: force, text: "--force" }
        - { id: follow, text: "--follow-tags" }
answer:
  values: { opt: inter, act: drop, push: force }
explanation:
  correct:
    en: An interactive rebase from the last good commit lists the later commits in a todo list. Changing `pick` to `drop` on the line of 7d0e9f3 removes that commit from the branch. Because the branch history changed, `git push --force` is required to overwrite docs-update in Azure Repos, which the Force push permission allows.
    fr: Un rebase interactif depuis le dernier commit correct liste les commits suivants dans une liste de tâches. Remplacer `pick` par `drop` sur la ligne de 7d0e9f3 supprime ce commit de la branche. Comme l'historique de la branche a changé, `git push --force` est nécessaire pour remplacer docs-update dans Azure Repos, ce que permet l'autorisation Force push.
  options:
    squash: { en: "squash combines the commit with the previous one, so the video stays in the history.", fr: "squash combine le commit avec le précédent : la vidéo reste dans l'historique." }
    edit: { en: "edit stops the rebase on the commit so you can amend it; it does not remove it.", fr: "edit arrête le rebase sur le commit pour le modifier ; il ne le supprime pas." }
    tags: { en: "--tags pushes tags only and cannot replace the rewritten branch.", fr: "--tags ne pousse que les balises et ne peut pas remplacer la branche réécrite." }
references:
  - title: Remove a large binary from your Git history to manage the size of cloned repositories
    url: https://learn.microsoft.com/en-us/azure/devops/repos/git/remove-binaries
