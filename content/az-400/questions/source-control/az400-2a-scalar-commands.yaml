id: az400-2a-scalar-commands
objective: "2.2.2"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam developers use a Git version that includes Scalar. You need to give them the commands for two situations:

    - Create a new Scalar enlistment of the **Monolith** repository and then move to its working tree.
    - Start background maintenance and apply the recommended Scalar configuration to an existing clone, named **Legacy**, that was created earlier with `git clone`.

    How should you complete the commands? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Les développeurs de Fabrikam utilisent une version de Git qui inclut Scalar. Vous devez leur fournir les commandes pour deux situations :

    - créer une nouvelle copie Scalar (enlistment) du dépôt **Monolith**, puis se placer dans son arborescence de travail ;
    - démarrer la maintenance en arrière-plan et appliquer la configuration Scalar recommandée à un clone existant, nommé **Legacy**, créé auparavant avec `git clone`.

    Comment devez-vous compléter les commandes ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: bash
  template: |
    # New enlistment
    scalar [[new]] https://dev.azure.com/fabrikam/Platform/_git/Monolith
    cd Monolith/[[dir]]

    # Existing clone
    scalar [[existing]] ~/repos/Legacy
  slots:
    - id: new
      options:
        - { id: clone, text: clone }
        - { id: register, text: register }
        - { id: reconfigure, text: reconfigure }
        - { id: run, text: run }
    - id: dir
      options:
        - { id: src, text: src }
        - { id: git, text: .git }
        - { id: worktree, text: worktree }
    - id: existing
      options:
        - { id: register, text: register }
        - { id: clone, text: clone }
        - { id: unregister, text: unregister }
        - { id: diagnose, text: diagnose }
answer:
  values: { new: clone, dir: src, existing: register }
explanation:
  correct:
    en: |
      scalar clone creates an enlistment whose working tree is in the src folder, with only commits and trees downloaded at first and sparse-checkout enabled unless --full-clone is used. scalar register adds an existing repository to the list of registered repositories, applies the recommended configuration and starts background maintenance.
    fr: |
      scalar clone crée une copie dont l'arborescence de travail se trouve dans le dossier src ; seuls les commits et les arbres sont téléchargés au départ, et le sparse-checkout est activé sauf avec --full-clone. scalar register ajoute un dépôt existant à la liste des dépôts inscrits, applique la configuration recommandée et démarre la maintenance en arrière-plan.
  options:
    reconfigure: { en: "reconfigure repairs or refreshes the configuration of enlistments that are already registered.", fr: "reconfigure répare ou actualise la configuration de copies déjà inscrites." }
    run: { en: "run executes a maintenance task once; it doesn't create an enlistment.", fr: "run exécute une fois une tâche de maintenance ; il ne crée pas de copie." }
    git: { en: "The working tree of a Scalar enlistment is in src, not in the .git folder.", fr: "L'arborescence de travail d'une copie Scalar se trouve dans src, pas dans le dossier .git." }
    unregister: { en: "unregister stops the background maintenance of a repository.", fr: "unregister arrête la maintenance en arrière-plan d'un dépôt." }
    clone: { en: "clone creates a new enlistment; it doesn't convert an existing clone.", fr: "clone crée une nouvelle copie ; il ne convertit pas un clone existant." }
references:
  - title: Implement Scalar and cross-repository sharing
    url: https://learn.microsoft.com/en-us/training/modules/manage-git-repositories/5-implement-scalar-cross-repo
