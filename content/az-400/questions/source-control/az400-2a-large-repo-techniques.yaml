id: az400-2a-large-repo-techniques
objective: "2.2.2"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Litware is optimizing how its teams work with a very large Git repository.

    Which Git feature should you use for each requirement? To answer, drag the appropriate features to the correct requirements. Each feature may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware optimise la façon dont ses équipes travaillent avec un très grand dépôt Git.

    Quelle fonctionnalité Git devez-vous utiliser pour chaque exigence ? Pour répondre, faites glisser les fonctionnalités appropriées vers les exigences correspondantes. Chaque fonctionnalité peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: shallow, text: { en: "Shallow clone", fr: "Clone superficiel (shallow clone)" } }
    - { id: sparse, text: Sparse-checkout }
    - { id: partial, text: { en: "Partial clone", fr: "Clonage partiel (partial clone)" } }
    - { id: graph, text: Commit-graph }
    - { id: lfs, text: Git LFS }
  targets:
    - id: ci
      text: { en: "A CI job needs only the latest commit and none of the history.", fr: "Un travail CI n'a besoin que du dernier commit, sans aucun historique." }
    - id: folders
      text: { en: "A developer's working directory contains only the folders that the developer works on.", fr: "Le répertoire de travail d'un développeur ne contient que les dossiers sur lesquels il travaille." }
    - id: ondemand
      text: { en: "A clone gets the full commit history quickly, and Git objects are downloaded only when they are needed.", fr: "Un clone obtient rapidement l'historique complet des commits, et les objets Git ne sont téléchargés que lorsqu'ils sont nécessaires." }
    - id: log
      text: { en: "Commit walks such as git log run faster on a long history.", fr: "Les parcours de commits comme git log s'exécutent plus vite sur un long historique." }
answer:
  mapping: { ci: shallow, folders: sparse, ondemand: partial, log: graph }
explanation:
  correct:
    en: |
      A shallow clone (git clone --depth) skips the history that isn't needed. Sparse-checkout reduces the working directory to the files you need. Partial clone gets a working repository faster by not downloading all Git objects at once. The commit-graph speeds up commit walks and reachability calculations such as git log. Scalar turns on the last three features automatically.
    fr: |
      Un clone superficiel (git clone --depth) ignore l'historique inutile. Le sparse-checkout réduit le répertoire de travail aux fichiers nécessaires. Le clonage partiel fournit plus vite un dépôt utilisable en ne téléchargeant pas tous les objets Git immédiatement. Le graphe de commits accélère les parcours de commits et les calculs d'accessibilité comme git log. Scalar active automatiquement ces trois dernières fonctionnalités.
  options:
    lfs: { en: "Git LFS moves large binary contents out of the history; it doesn't address any of these requirements.", fr: "Git LFS sort le contenu des gros binaires de l'historique ; il ne répond à aucune de ces exigences." }
references:
  - title: Work with large repositories
    url: https://learn.microsoft.com/en-us/training/modules/manage-git-repositories/2-work-large-repositories
