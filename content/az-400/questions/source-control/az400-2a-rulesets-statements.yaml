id: az400-2a-rulesets-statements
objective: "2.1.3"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Contoso has a GitHub Team organization. A private repository named **Inventory** has two active rulesets that target `main`:

    | Ruleset | Rule |
    | --- | --- |
    | Baseline | Require a pull request before merging, with 1 required approval |
    | Critical | Require a pull request before merging, with 2 required approvals |

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso dispose d'une organisation GitHub Team. Un dépôt privé nommé **Inventory** a deux ensembles de règles actifs qui ciblent `main` :

    | Ensemble de règles | Règle |
    | --- | --- |
    | Baseline | Require a pull request before merging, avec 1 approbation requise |
    | Critical | Require a pull request before merging, avec 2 approbations requises |

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          Both rulesets apply to main at the same time.
        fr: |
          Les deux ensembles de règles s'appliquent en même temps à main.
    - id: s2
      text:
        en: |
          A pull request into main needs one approval if Baseline was created after Critical.
        fr: |
          Une pull request vers main a besoin d'une approbation si Baseline a été créé après Critical.
    - id: s3
      text:
        en: |
          A user who has only the Read role on Inventory can view both rulesets.
        fr: |
          Un utilisateur qui a seulement le rôle Read sur Inventory peut consulter les deux ensembles de règles.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |
      Unlike branch protection rules, of which only one applies to a branch, several rulesets can apply to the same branch at the same time. Rulesets have no priority order; their rules are aggregated, and when they conflict the most restrictive version applies, so two approvals are required whatever the creation order. Anyone with read access to the repository can view its active rulesets.
    fr: |
      Contrairement aux règles de protection de branche, dont une seule s'applique à une branche, plusieurs ensembles de règles peuvent s'appliquer en même temps à la même branche. Les ensembles de règles n'ont pas d'ordre de priorité ; leurs règles sont cumulées et, en cas de conflit, la version la plus restrictive s'applique : deux approbations sont donc requises quel que soit l'ordre de création. Toute personne qui a un accès en lecture au dépôt peut consulter ses ensembles de règles actifs.
references:
  - title: Branch protections rules and review requirements
    url: https://learn.microsoft.com/en-us/training/modules/github-enterprise-server-repository-workflows/3-branch-protection-rules
