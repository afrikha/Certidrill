id: az400-2a-reviewer-policy-statements
objective: "2.1.2"
type: yesno_statements
difficulty: 3
status: draft
stem:
  en: |
    Northwind has an Azure Repos repository. The `main` branch has the following branch policies:

    - **Minimum number of reviewers**: 2, **Allow requestors to approve their own changes** cleared, **When new changes are pushed** set to **Reset all approval votes (does not reset votes to reject or wait)**.
    - **Build validation**: a YAML pipeline, **Policy requirement** set to **Required**.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind dispose d'un dépôt Azure Repos. La branche `main` a les stratégies de branche suivantes :

    - **Minimum number of reviewers** : 2, **Allow requestors to approve their own changes** désactivé, **When new changes are pushed** défini sur **Reset all approval votes (does not reset votes to reject or wait)** ;
    - **Build validation** : un pipeline YAML, **Policy requirement** défini sur **Required**.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          The creator of a pull request can vote Approve on it, but that vote doesn't count toward the two required approvals.
        fr: |
          Le créateur d'une pull request peut voter Approve sur celle-ci, mais ce vote ne compte pas dans les deux approbations requises.
    - id: s2
      text:
        en: |
          If the author pushes a new commit after two reviewers approved, the pull request can be completed without new approvals.
        fr: |
          Si l'auteur envoie un nouveau commit après l'approbation de deux réviseurs, la pull request peut être terminée sans nouvelles approbations.
    - id: s3
      text:
        en: |
          A user who has the Bypass policies when completing pull requests permission can complete a pull request whose required build failed.
        fr: |
          Un utilisateur qui a l'autorisation Bypass policies when completing pull requests peut terminer une pull request dont le build requis a échoué.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |
      When Allow requestors to approve their own changes is cleared, the creator can still vote Approve, but the vote doesn't count toward the minimum. With Reset all approval votes, a new push clears the two approvals, so the pull request needs two new approvals; only Reject and Wait votes are kept. Users with Bypass policies when completing pull requests can complete pull requests that don't satisfy the policies.
    fr: |
      Quand Allow requestors to approve their own changes est désactivé, le créateur peut toujours voter Approve, mais ce vote ne compte pas dans le minimum. Avec Reset all approval votes, un nouvel envoi efface les deux approbations : la pull request a besoin de deux nouvelles approbations ; seuls les votes Reject et Wait sont conservés. Les utilisateurs qui ont Bypass policies when completing pull requests peuvent terminer des pull requests qui ne respectent pas les stratégies.
references:
  - title: Set and manage branch policies
    url: https://learn.microsoft.com/en-us/azure/devops/repos/git/branch-policies
