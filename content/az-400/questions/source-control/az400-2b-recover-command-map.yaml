id: az400-2b-recover-command-map
objective: "2.2.5"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    You work in a local clone of a Git repository. None of the work described below has been pushed.

    Which command should you use for each requirement? To answer, drag the appropriate commands to the correct requirements. Each command may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous travaillez dans un clone local d'un dépôt Git. Aucun des travaux décrits ci-dessous n'a été poussé.

    Quelle commande devez-vous utiliser pour chaque exigence ? Pour répondre, faites glisser les commandes appropriées vers les exigences correspondantes. Chaque commande peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: restore, text: "git restore <file>" }
    - { id: staged, text: "git restore --staged <file>" }
    - { id: soft, text: "git reset --soft HEAD~1" }
    - { id: hard, text: "git reset --hard HEAD~1" }
    - { id: cherry, text: "git cherry-pick <commit>" }
    - { id: revert, text: "git revert <commit>" }
  targets:
    - id: t1
      text: { en: "Discard the uncommitted changes made to one file in the working tree", fr: "Abandonner les modifications non commitées d'un fichier dans l'arborescence de travail" }
    - id: t2
      text: { en: "Remove a file from the staging area but keep its changes in the working tree", fr: "Retirer un fichier de la zone de préparation tout en conservant ses modifications dans l'arborescence de travail" }
    - id: t3
      text: { en: "Undo the last commit and keep its changes staged", fr: "Annuler le dernier commit et conserver ses modifications indexées" }
    - id: t4
      text: { en: "Apply the changes of a single commit from the hotfix branch to the current branch", fr: "Appliquer à la branche actuelle les modifications d'un seul commit de la branche hotfix" }
answer:
  mapping: { t1: restore, t2: staged, t3: soft, t4: cherry }
explanation:
  correct:
    en: "`git restore <file>` discards uncommitted working tree changes, and `--staged` unstages the file while keeping its changes. `git reset --soft HEAD~1` moves the branch back one commit and leaves that commit's changes staged. `git cherry-pick` applies the changes of a specific commit to the current branch."
    fr: "`git restore <file>` abandonne les modifications non commitées de l'arborescence de travail, et `--staged` retire le fichier de l'index en conservant ses modifications. `git reset --soft HEAD~1` recule la branche d'un commit et laisse les modifications de ce commit indexées. `git cherry-pick` applique à la branche actuelle les modifications d'un commit précis."
  options:
    hard: { en: "reset --hard also discards the changes of the undone commit.", fr: "reset --hard supprime aussi les modifications du commit annulé." }
    revert: { en: "revert adds a new commit that reverses changes; it is meant for commits already shared.", fr: "revert ajoute un nouveau commit qui inverse des modifications ; il est destiné aux commits déjà partagés." }
references:
  - title: Undo changes
    url: https://learn.microsoft.com/en-us/azure/devops/repos/git/undo
  - title: Recover specific data by using Git commands
    url: https://learn.microsoft.com/en-us/training/modules/manage-git-repositories/6-recover-specific-data-git-commands
