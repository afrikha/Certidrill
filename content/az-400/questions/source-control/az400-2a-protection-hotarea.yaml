id: az400-2a-protection-hotarea
objective: "2.1.3"
type: hotarea
difficulty: 3
status: draft
stem:
  en: |
    Litware hosts a service in a GitHub repository owned by an organization. You are editing the branch protection rule of `main`. **Require a pull request before merging** and **Require status checks to pass before merging** are already enabled, with the `build` check required.

    The following table shows other settings of the rule.

    Answer each prompt by selecting the setting that you must enable.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware héberge un service dans un dépôt GitHub appartenant à une organisation. Vous modifiez la règle de protection de branche de `main`. **Require a pull request before merging** et **Require status checks to pass before merging** sont déjà activés, avec la vérification `build` requise.

    Le tableau suivant présente d'autres paramètres de la règle.

    Répondez à chaque consigne en sélectionnant le paramètre que vous devez activer.

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
    - id: p1
      text: { en: "The build check must have run against the latest version of main before a pull request can be merged.", fr: "La vérification build doit avoir été exécutée sur la dernière version de main avant qu'une pull request puisse être fusionnée." }
    - id: p2
      text: { en: "Repository administrators must not be able to merge a pull request that fails the rule.", fr: "Les administrateurs du dépôt ne doivent pas pouvoir fusionner une pull request qui ne respecte pas la règle." }
  grid:
    header: [{ en: "Setting", fr: "Paramètre" }]
    rows:
      - [{ text: Require branches to be up to date before merging, area: uptodate }]
      - [{ text: Require conversation resolution before merging, area: conv }]
      - [{ text: Require signed commits, area: signed }]
      - [{ text: Require linear history, area: linear }]
      - [{ text: Require deployments to succeed before merging, area: deploy }]
      - [{ text: Lock branch, area: lock }]
      - [{ text: Do not allow bypassing the above settings, area: nobypass }]
      - [{ text: Restrict who can push to matching branches, area: restrict }]
answer:
  values: { p1: uptodate, p2: nobypass }
explanation:
  correct:
    en: |
      Require branches to be up to date before merging makes the status checks strict, so the head branch must contain the latest commits of main and the check must pass again after the update. Do not allow bypassing the above settings applies the rule to administrators and to roles that can bypass branch protections. Restrict who can push to matching branches limits pushes but doesn't remove the bypass that administrators have.
    fr: |
      Require branches to be up to date before merging rend les vérifications d'état strictes ; la branche de la pull request doit contenir les derniers commits de main, et la vérification doit réussir à nouveau après la mise à jour. Do not allow bypassing the above settings applique la règle aux administrateurs et aux rôles autorisés à contourner les protections de branche. Restrict who can push to matching branches limite les envois mais ne supprime pas le contournement dont disposent les administrateurs.
references:
  - title: Implement branch merging restrictions
    url: https://learn.microsoft.com/en-us/training/modules/manage-git-branches-workflows/7-implement-branch-merging-restrictions
  - title: Branch protections rules and review requirements
    url: https://learn.microsoft.com/en-us/training/modules/github-enterprise-server-repository-workflows/3-branch-protection-rules
