id: az400-2a-build-expiration
objective: "2.1.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Northwind has an Azure Repos repository and a YAML pipeline named **Web-CI**. You add a Build validation policy for Web-CI on the `main` branch, with the trigger set to **Automatic (whenever the source branch is updated)**.

    You need to configure the policy to meet the following requirements:

    - A pull request into `main` cannot be completed unless Web-CI succeeds.
    - A successful Web-CI result becomes invalid as soon as another pull request updates `main`.

    Which two settings should you configure? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind dispose d'un dépôt Azure Repos et d'un pipeline YAML nommé **Web-CI**. Vous ajoutez sur la branche `main` une stratégie Build validation pour Web-CI, avec le déclencheur défini sur **Automatic (whenever the source branch is updated)**.

    Vous devez configurer la stratégie pour répondre aux exigences suivantes :

    - une pull request vers `main` ne peut pas être terminée si Web-CI ne réussit pas ;
    - un résultat réussi de Web-CI devient non valide dès qu'une autre pull request met à jour `main`.

    Quels sont les deux paramètres à configurer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Policy requirement: Required", fr: "Policy requirement : Required" } }
    - { id: b, text: { en: "Policy requirement: Optional", fr: "Policy requirement : Optional" } }
    - { id: c, text: { en: "Build expiration: Immediately when main is updated", fr: "Build expiration : Immediately when main is updated" } }
    - { id: d, text: { en: "Build expiration: After 12 hours if main has been updated", fr: "Build expiration : After 12 hours if main has been updated" } }
    - { id: e, text: { en: "Build expiration: Never", fr: "Build expiration : Never" } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |
      With Policy requirement set to Required, builds must complete successfully for pull requests to be completed. Build expiration set to Immediately when main is updated sets the policy status to failed when main changes and, because the trigger is automatic, queues a new build against the updated target.
    fr: |
      Avec Policy requirement défini sur Required, les builds doivent réussir pour que les pull requests puissent être terminées. Build expiration défini sur Immediately when main is updated fait passer l'état de la stratégie à l'échec quand main change et, comme le déclencheur est automatique, met en file d'attente un nouveau build sur la cible mise à jour.
  options:
    b: { en: "An optional build only informs; a failed build doesn't block completion.", fr: "Un build facultatif ne fait qu'informer ; un build en échec ne bloque pas la finalisation." }
    d: { en: "The result would stay valid for up to 12 hours after main changes.", fr: "Le résultat resterait valide jusqu'à 12 heures après la modification de main." }
    e: { en: "With Never, updates to main don't change the status of a successful build.", fr: "Avec Never, les mises à jour de main ne changent pas l'état d'un build réussi." }
references:
  - title: Set and manage branch policies
    url: https://learn.microsoft.com/en-us/azure/devops/repos/git/branch-policies
