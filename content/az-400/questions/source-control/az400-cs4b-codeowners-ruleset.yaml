id: az400-cs4b-codeowners-ruleset
objective: "2.1.3"
type: multi
caseStudy: az400-cs4b-alpine-ski-house
difficulty: 2
status: draft
stem:
  en: |
    You need to meet the source control requirement. Which two actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez satisfaire l'exigence de contrôle de code source. Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Create a branch protection rule for the default branch in each repository.", fr: "Créer une règle de protection de branche pour la branche par défaut dans chaque dépôt." } }
    - { id: b, text: { en: "Add a CODEOWNERS file that assigns /infra/ to @alpineskihouse/platform-team in each repository.", fr: "Ajouter dans chaque dépôt un fichier CODEOWNERS qui attribue /infra/ à @alpineskihouse/platform-team." } }
    - { id: c, text: { en: "Grant platform-team the Maintain role on every repository of the organization.", fr: "Accorder à platform-team le rôle Maintain sur chaque dépôt de l'organisation." } }
    - { id: d, text: { en: "Create an organization ruleset that targets the default branch of all repositories and requires a pull request with Code Owners review.", fr: "Créer un ensemble de règles d'organisation qui cible la branche par défaut de tous les dépôts et exige une pull request avec revue des propriétaires du code." } }
    - { id: e, text: { en: "Add a required status check that runs a workflow when a pull request changes files under /infra/.", fr: "Ajouter une vérification d'état obligatoire qui exécute un workflow quand une pull request modifie des fichiers sous /infra/." } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |
      The CODEOWNERS file maps the /infra/ path to platform-team, which makes the team the code owner of those files. An organization ruleset enforces a policy across many repositories from one central place, and its requirement of a Code Owners review makes the CODEOWNERS assignment mandatory; without that requirement, CODEOWNERS only requests a review.
    fr: |
      Le fichier CODEOWNERS associe le chemin /infra/ à platform-team, qui devient propriétaire du code de ces fichiers. Un ensemble de règles d'organisation applique une stratégie à de nombreux dépôts depuis un point central, et son exigence d'une revue des propriétaires du code rend obligatoire l'attribution de CODEOWNERS ; sans cette exigence, CODEOWNERS ne fait que demander une revue.
  options:
    a:
      en: |
        Branch protection rules are configured repository by repository, so 35 separate rules would not meet the single central configuration requirement.
      fr: |
        Les règles de protection de branche se configurent dépôt par dépôt : 35 règles distinctes ne respecteraient pas l'exigence d'une configuration centrale unique.
    c:
      en: |
        A repository role grants permissions to platform-team but does not require its approval before a merge.
      fr: |
        Un rôle de dépôt accorde des autorisations à platform-team mais n'exige pas son approbation avant une fusion.
    e:
      en: |
        A status check validates the change automatically; it does not require the approval of a person from platform-team.
      fr: |
        Une vérification d'état valide la modification automatiquement ; elle n'exige pas l'approbation d'une personne de platform-team.
references:
  - title: Branch Protection Rules and Review Requirements
    url: https://learn.microsoft.com/en-us/training/modules/github-enterprise-server-repository-workflows/3-branch-protection-rules
  - title: Enforce governance with GitHub controls
    url: https://learn.microsoft.com/en-us/training/modules/governance-guardrails-operations/3-enforce-governance-github-controls
