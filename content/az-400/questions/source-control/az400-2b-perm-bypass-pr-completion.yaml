id: az400-2b-perm-bypass-pr-completion
objective: "2.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Contoso uses an Azure Repos Git repository named **WebShop**. The **main** branch has branch policies that require two reviewers and a successful build validation.

    During production incidents, a release lead named Megan must be able to complete pull requests into main even when the policies are not met. Megan must not be able to push commits directly to main. The solution must follow the principle of least privilege.

    Which permission should you set to **Allow** for Megan on the main branch?
  fr: |
    Contoso utilise un dépôt Git Azure Repos nommé **WebShop**. La branche **main** possède des stratégies de branche qui exigent deux réviseurs et une validation de build réussie.

    Lors des incidents de production, une responsable des mises en production nommée Megan doit pouvoir terminer des demandes de tirage (pull requests) vers main même si les stratégies ne sont pas respectées. Megan ne doit pas pouvoir pousser des commits directement vers main. La solution doit respecter le principe du moindre privilège.

    Quelle autorisation devez-vous définir sur **Allow** pour Megan sur la branche main ?
body:
  options:
    - { id: a, text: Bypass policies when pushing }
    - { id: b, text: Bypass policies when completing pull requests }
    - { id: c, text: "Force push (rewrite history, delete branches and tags)" }
    - { id: d, text: Edit policies }
answer: { optionId: b }
explanation:
  correct:
    en: "Bypass policies when completing pull requests lets Megan select **Override branch policies and enable merge** when she completes a pull request, so she can merge without the required reviewers or build. It does not let her push directly to a branch that has required policies."
    fr: "Bypass policies when completing pull requests permet à Megan de sélectionner **Override branch policies and enable merge** lorsqu'elle termine une demande de tirage : elle peut fusionner sans les réviseurs ni le build exigés. Cette autorisation ne lui permet pas de pousser directement vers une branche dotée de stratégies obligatoires."
  options:
    a:
      en: Bypass policies when pushing lets a user push directly to a branch that has required policies, which Megan must not be able to do.
      fr: Bypass policies when pushing permet de pousser directement vers une branche dotée de stratégies obligatoires, ce que Megan ne doit pas pouvoir faire.
    c:
      en: Force push lets a user rewrite history and delete branches and tags; it does not let a pull request complete without meeting the policies.
      fr: Force push permet de réécrire l'historique et de supprimer des branches et des balises ; elle ne permet pas de terminer une demande de tirage sans respecter les stratégies.
    d:
      en: Edit policies lets Megan change or remove the policies for everyone, which grants more than she needs.
      fr: Edit policies permet à Megan de modifier ou de supprimer les stratégies pour tout le monde, ce qui lui accorde plus que nécessaire.
references:
  - title: Set branch permissions
    url: https://learn.microsoft.com/en-us/azure/devops/repos/git/branch-permissions
  - title: Set Git repository permissions
    url: https://learn.microsoft.com/en-us/azure/devops/repos/git/set-git-repository-permissions
