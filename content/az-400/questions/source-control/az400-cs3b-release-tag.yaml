id: az400-cs3b-release-tag
objective: "2.2.4"
type: dropdown
caseStudy: az400-cs3b-proseware-games
difficulty: 1
status: draft
stem:
  en: |
    You are the release manager. You validated Skyforge 1.8.0 on the commit **9c41e7a** of main, and you need to identify the release in skyforge by running Git commands from an up-to-date local clone. The solution must meet the source control requirements.

    How should you complete the commands? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous êtes le responsable de la mise en production. Vous avez validé Skyforge 1.8.0 sur le commit **9c41e7a** de main, et vous devez identifier la mise en production dans skyforge en exécutant des commandes Git depuis un clone local à jour. La solution doit satisfaire les exigences de contrôle de code source.

    Comment devez-vous compléter les commandes ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: bash
  template: |
    git tag [[tag]]
    git push origin [[push]]
  slots:
    - id: tag
      options:
        - { id: annotated, text: "-a v1.8.0 9c41e7a -m \"Skyforge 1.8.0 - season 3 launch\"" }
        - { id: light, text: "v1.8.0 9c41e7a" }
        - { id: list, text: "-l \"v1.8*\"" }
        - { id: delete, text: "-d v1.8.0" }
    - id: push
      options:
        - { id: tagname, text: "v1.8.0" }
        - { id: main, text: "main" }
        - { id: all, text: "--all" }
answer:
  values: { tag: annotated, push: tagname }
explanation:
  correct:
    en: |
      An annotated tag stores the tagger, the date, and a message in addition to the commit it points to, which requirement 3 asks for; `git tag -a` with `-m` creates it on the given commit. `git push` does not send tags by default, so you push the tag explicitly with `git push origin v1.8.0`.
    fr: |
      Une balise annotée stocke l'auteur de la balise, la date et un message en plus du commit qu'elle désigne, ce que demande l'exigence 3 ; `git tag -a` avec `-m` la crée sur le commit indiqué. `git push` n'envoie pas les balises par défaut : vous envoyez donc la balise explicitement avec `git push origin v1.8.0`.
  options:
    light:
      en: |
        Without `-a` or `-m`, Git creates a lightweight tag, which is only a pointer to the commit and stores no tagger, date, or description.
      fr: |
        Sans `-a` ni `-m`, Git crée une balise légère, qui n'est qu'un pointeur vers le commit et ne stocke ni auteur, ni date, ni description.
    all:
      en: |
        `git push --all` pushes all the local branches but no tags.
      fr: |
        `git push --all` envoie toutes les branches locales, mais aucune balise.
    main:
      en: |
        Pushing main sends the branch, which is already up to date, and not the new tag.
      fr: |
        Envoyer main envoie la branche, déjà à jour, et pas la nouvelle balise.
references:
  - title: Use Git tags
    url: https://learn.microsoft.com/en-us/azure/devops/repos/git/git-tags
