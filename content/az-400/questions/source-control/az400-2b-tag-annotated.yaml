id: az400-2b-tag-annotated
objective: "2.2.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Adatum stores the source code of an application in a Git repository. Release managers mark each release with a tag.

    You need to create a tag named **v2.4.0** on the current commit. The tag must record the name of the person who created it, the date and a message, so that release managers can see who tagged each release.

    Which command should you run?
  fr: |
    Adatum stocke le code source d'une application dans un dépôt Git. Les responsables des mises en production marquent chaque version avec une balise.

    Vous devez créer une balise nommée **v2.4.0** sur le commit actuel. La balise doit enregistrer le nom de la personne qui l'a créée, la date et un message, afin que les responsables des mises en production voient qui a balisé chaque version.

    Quelle commande devez-vous exécuter ?
body:
  options:
    - { id: a, text: "`git tag v2.4.0 HEAD`" }
    - { id: b, text: "`git notes add -m \"Release 2.4.0\" HEAD`" }
    - { id: c, text: "`git tag -a v2.4.0 -m \"Release 2.4.0\"`" }
    - { id: d, text: "`git tag -f v2.4.0 HEAD`" }
answer: { optionId: c }
explanation:
  correct:
    en: "`git tag -a` creates an annotated tag, a full Git object that stores the tagger's name, the date and a message. A lightweight tag, created without `-a` or `-m`, is only a pointer to a commit and records none of this information."
    fr: "`git tag -a` crée une balise annotée, un objet Git complet qui stocke le nom de l'auteur de la balise, la date et un message. Une balise légère, créée sans `-a` ni `-m`, n'est qu'un pointeur vers un commit et n'enregistre aucune de ces informations."
  options:
    a:
      en: Without `-a` or `-m`, git tag creates a lightweight tag that stores no tagger, date or message.
      fr: Sans `-a` ni `-m`, git tag crée une balise légère qui ne stocke ni auteur, ni date, ni message.
    b:
      en: Git notes attach a note to a commit but do not create a tag that marks the release.
      fr: Les notes Git attachent une note à un commit, mais ne créent pas de balise qui marque la version.
    d:
      en: "`-f` replaces an existing tag of the same name; without `-a` or `-m` it still creates a lightweight tag."
      fr: "`-f` remplace une balise existante de même nom ; sans `-a` ni `-m`, elle crée toujours une balise légère."
references:
  - title: Use Git tags
    url: https://learn.microsoft.com/en-us/azure/devops/repos/git/git-tags
