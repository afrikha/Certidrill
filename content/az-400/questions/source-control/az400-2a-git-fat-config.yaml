id: az400-2a-git-fat-config
objective: "2.2.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Northwind has a Git repository for a firmware project. The team works on Linux, has Python and rsync on every workstation, and already runs a storage server that is reachable over SSH.

    The team decides to use git-fat to keep `.bin` and `.zip` files out of the Git history while still tracking them in the repository. git-fat is installed on every workstation.

    Which two files must the team commit to configure git-fat for the repository? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind dispose d'un dépôt Git pour un projet de firmware. L'équipe travaille sous Linux, dispose de Python et de rsync sur chaque poste de travail, et exploite déjà un serveur de stockage accessible par SSH.

    L'équipe décide d'utiliser git-fat pour garder les fichiers `.bin` et `.zip` hors de l'historique Git tout en les suivant dans le dépôt. git-fat est installé sur chaque poste de travail.

    Quels sont les deux fichiers que l'équipe doit valider pour configurer git-fat pour le dépôt ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "A .gitattributes file that contains *.bin filter=fat -crlf and *.zip filter=fat -crlf", fr: "Un fichier .gitattributes qui contient *.bin filter=fat -crlf et *.zip filter=fat -crlf" } }
    - { id: b, text: { en: "A .gitfat file whose [rsync] section sets remote to the storage server path", fr: "Un fichier .gitfat dont la section [rsync] définit remote sur le chemin du serveur de stockage" } }
    - { id: c, text: { en: "A .lfsconfig file whose [lfs] section sets url to the storage server", fr: "Un fichier .lfsconfig dont la section [lfs] définit url sur le serveur de stockage" } }
    - { id: d, text: { en: "A .gitattributes file that contains *.bin filter=lfs -text and *.zip filter=lfs -text", fr: "Un fichier .gitattributes qui contient *.bin filter=lfs -text et *.zip filter=lfs -text" } }
    - { id: e, text: { en: "A .gitignore file that contains *.bin and *.zip", fr: "Un fichier .gitignore qui contient *.bin et *.zip" } }
answer: { optionIds: [ a, b ] }
explanation:
  correct:
    en: |
      git-fat uses the fat filter declared in .gitattributes to replace matching files with small placeholders in the commits, while the content goes to a local cache. The .gitfat file names the remote store, usually an rsync target over SSH, that git fat push and git fat pull synchronize with. Each clone also runs git fat init once to activate the filter.
    fr: |
      git-fat utilise le filtre fat déclaré dans .gitattributes pour remplacer les fichiers correspondants par de petits espaces réservés dans les commits, tandis que le contenu va dans un cache local. Le fichier .gitfat désigne le stockage distant, en général une cible rsync accessible par SSH, avec lequel git fat push et git fat pull se synchronisent. Chaque clone exécute aussi une fois git fat init pour activer le filtre.
  options:
    c: { en: ".lfsconfig configures Git LFS, not git-fat.", fr: ".lfsconfig configure Git LFS, pas git-fat." }
    d: { en: "filter=lfs sends the files to Git LFS, not to the git-fat store.", fr: "filter=lfs envoie les fichiers vers Git LFS, pas vers le stockage git-fat." }
    e: { en: "Ignored files are not tracked at all, which contradicts the requirement.", fr: "Les fichiers ignorés ne sont pas suivis du tout, ce qui contredit l'exigence." }
references:
  - title: Work with large files in your Git repo
    url: https://learn.microsoft.com/en-us/azure/devops/repos/git/manage-large-files
