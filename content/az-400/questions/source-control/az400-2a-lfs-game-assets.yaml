id: az400-2a-lfs-game-assets
objective: "2.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Tailspin develops a game in an Azure Repos repository. Artists commit texture and video files of 20 MB to 80 MB that they modify several times a week. Clone and fetch times have become very long.

    You need to keep the assets versioned in the same commits and branches as the code, while preventing the Git history from storing a full copy of every version of each asset.

    What should you use?
  fr: |
    Tailspin développe un jeu dans un dépôt Azure Repos. Les artistes valident des fichiers de textures et de vidéos de 20 Mo à 80 Mo qu'ils modifient plusieurs fois par semaine. Les durées de clonage et de récupération (fetch) sont devenues très longues.

    Vous devez conserver les ressources versionnées dans les mêmes commits et branches que le code, tout en évitant que l'historique Git stocke une copie complète de chaque version de chaque ressource.

    Que devez-vous utiliser ?
body:
  options:
    - id: a
      text: { en: "Scalar, to enable partial clone and background prefetch", fr: "Scalar, pour activer le clonage partiel et la prérécupération en arrière-plan" }
    - id: b
      text: { en: "Universal Packages in an Azure Artifacts feed", fr: "Des packages universels dans un flux Azure Artifacts" }
    - id: c
      text: { en: "Git Large File Storage (LFS) for the asset file types", fr: "Git Large File Storage (LFS) pour les types de fichiers des ressources" }
    - id: d
      text: { en: "A shallow clone with git clone --depth 1", fr: "Un clone superficiel avec git clone --depth 1" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Git LFS replaces each tracked binary in the repository with a small pointer file and stores the content in separate LFS storage; the right version is downloaded when you check out a commit. Large binaries that change often are the case Microsoft recommends LFS for, and Azure DevOps Services supports it at no extra cost.
    fr: |
      Git LFS remplace chaque binaire suivi dans le dépôt par un petit fichier pointeur et stocke le contenu dans un stockage LFS distinct ; la bonne version est téléchargée quand vous extrayez un commit. Les gros binaires qui changent souvent sont le cas pour lequel Microsoft recommande LFS, et Azure DevOps Services le prend en charge sans coût supplémentaire.
  options:
    a: { en: "Scalar speeds up Git operations on large repositories, but every version of each binary still enters the history.", fr: "Scalar accélère les opérations Git sur les grands dépôts, mais chaque version de chaque binaire entre toujours dans l'historique." }
    b: { en: "Packages are versioned separately from the code; they suit reusable dependencies, not assets tied to each commit.", fr: "Les packages sont versionnés séparément du code ; ils conviennent aux dépendances réutilisables, pas aux ressources liées à chaque commit." }
    d: { en: "A shallow clone downloads less history, but the repository itself keeps every version of each binary.", fr: "Un clone superficiel télécharge moins d'historique, mais le dépôt lui-même conserve toutes les versions de chaque binaire." }
references:
  - title: Work with large files in your Git repo
    url: https://learn.microsoft.com/en-us/azure/devops/repos/git/manage-large-files
