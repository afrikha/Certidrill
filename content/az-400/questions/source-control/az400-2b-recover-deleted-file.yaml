id: az400-2b-recover-deleted-file
objective: "2.2.5"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    A file named **src/config/rates.json** was deleted from the main branch of a Git repository several weeks ago. Nobody knows which commit deleted it.

    You need to find the commit that deleted the file, and then restore the last version of the file in a new commit on main.

    How should you complete the commands? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Un fichier nommé **src/config/rates.json** a été supprimé de la branche main d'un dépôt Git il y a plusieurs semaines. Personne ne sait quel commit l'a supprimé.

    Vous devez trouver le commit qui a supprimé le fichier, puis restaurer la dernière version du fichier dans un nouveau commit sur main.

    Comment devez-vous compléter les commandes ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: bash
  template:
    en: |
      git log --oneline --diff-filter=[[filter]] -- src/config/rates.json
      # Output: 7f3e2d1 Remove unused configuration

      git [[cmd]] 7f3e2d1[[rev]] -- src/config/rates.json
      git commit -m "Restore rates.json"
    fr: |
      git log --oneline --diff-filter=[[filter]] -- src/config/rates.json
      # Sortie : 7f3e2d1 Remove unused configuration

      git [[cmd]] 7f3e2d1[[rev]] -- src/config/rates.json
      git commit -m "Restore rates.json"
  slots:
    - id: filter
      options:
        - { id: A, text: A }
        - { id: D, text: D }
        - { id: M, text: M }
    - id: cmd
      options:
        - { id: checkout, text: checkout }
        - { id: revert, text: revert }
        - { id: cherry, text: cherry-pick }
        - { id: show, text: show }
    - id: rev
      options:
        - { id: tilde0, text: "~0" }
        - { id: range, text: "..HEAD" }
        - { id: caret, text: "^" }
answer:
  values: { filter: D, cmd: checkout, rev: caret }
explanation:
  correct:
    en: "`--diff-filter=D` limits the log to commits that deleted the path. The file no longer exists in that commit, so you restore it from the commit's parent with `git checkout 7f3e2d1^ -- src/config/rates.json`, which writes the file to the working tree and stages it, ready to commit."
    fr: "`--diff-filter=D` limite le journal aux commits qui ont supprimé le chemin. Le fichier n'existe plus dans ce commit : vous le restaurez donc depuis le parent du commit avec `git checkout 7f3e2d1^ -- src/config/rates.json`, qui écrit le fichier dans l'arborescence de travail et l'indexe, prêt à être commité."
  options:
    A: { en: "A lists the commit that added the file, not the one that deleted it.", fr: "A liste le commit qui a ajouté le fichier, pas celui qui l'a supprimé." }
    revert: { en: "git revert undoes a whole commit and does not accept a file path.", fr: "git revert annule un commit entier et n'accepte pas de chemin de fichier." }
    show: { en: "git show displays content; it does not restore the file in the working tree.", fr: "git show affiche du contenu ; il ne restaure pas le fichier dans l'arborescence de travail." }
    tilde0: { en: "~0 is the deleting commit itself, in which the file no longer exists.", fr: "~0 désigne le commit de suppression lui-même, dans lequel le fichier n'existe plus." }
references:
  - title: Recover specific data by using Git commands
    url: https://learn.microsoft.com/en-us/training/modules/manage-git-repositories/6-recover-specific-data-git-commands
  - title: Undo changes
    url: https://learn.microsoft.com/en-us/azure/devops/repos/git/undo
