id: az400-2b-tag-push-single
objective: "2.2.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You work in a local clone of an Azure Repos Git repository named **Billing**. You create an annotated tag named **v1.8.0** and run `git push origin main`. The tag does not appear on the **Tags** page of the repository.

    Your clone also contains several experimental local tags that must stay local.

    You need to publish only the v1.8.0 tag to Azure Repos. Which command should you run?
  fr: |
    Vous travaillez dans un clone local d'un dépôt Git Azure Repos nommé **Billing**. Vous créez une balise annotée nommée **v1.8.0** et vous exécutez `git push origin main`. La balise n'apparaît pas dans la page **Tags** du dépôt.

    Votre clone contient aussi plusieurs balises locales expérimentales qui doivent rester locales.

    Vous devez publier uniquement la balise v1.8.0 dans Azure Repos. Quelle commande devez-vous exécuter ?
body:
  options:
    - { id: a, text: "`git push origin --tags`" }
    - { id: b, text: "`git push origin v1.8.0`" }
    - { id: c, text: "`git push --all origin`" }
    - { id: d, text: "`git fetch origin --tags`" }
answer: { optionId: b }
explanation:
  correct:
    en: "`git push` does not send tags with a branch. Naming the tag, as in `git push origin v1.8.0`, pushes that single tag to the remote, where it appears on the Tags page."
    fr: "`git push` n'envoie pas les balises avec une branche. Nommer la balise, comme dans `git push origin v1.8.0`, pousse cette seule balise vers le dépôt distant, où elle apparaît dans la page Tags."
  options:
    a:
      en: "`--tags` pushes every local tag, including the experimental tags that must stay local."
      fr: "`--tags` pousse toutes les balises locales, y compris les balises expérimentales qui doivent rester locales."
    c:
      en: "`--all` pushes all local branches, not tags."
      fr: "`--all` pousse toutes les branches locales, pas les balises."
    d:
      en: "`git fetch` downloads objects and tags from the remote; it does not publish anything."
      fr: "`git fetch` télécharge des objets et des balises depuis le dépôt distant ; il ne publie rien."
references:
  - title: Use Git tags
    url: https://learn.microsoft.com/en-us/azure/devops/repos/git/git-tags
  - title: Configure GitHub tags to organize repositories
    url: https://learn.microsoft.com/en-us/training/modules/manage-git-repositories/13-configure-github-tags-organize-repositories
