id: az400-sr1-restore-branch-2
objective: "2.2.5"
type: series_yesno
series: az400-sr1-restore-branch
seriesOrder: 2
difficulty: 3
status: draft
stem:
  en: You restore the branch from the deleted branches search in the Branches view.
  fr: Vous restaurez la branche depuis la recherche des branches supprimées de la vue Branches.
body:
  solution:
    en: |
      In the **Branches** view of Billing, you search for `release/3.1`, select **Search for exact match in deleted branches**, and then select **Restore branch** for the branch that is found.
    fr: |
      Dans la vue **Branches** de Billing, vous recherchez `release/3.1`, sélectionnez **Search for exact match in deleted branches**, puis sélectionnez **Restore branch** pour la branche trouvée.
answer: { value: false }
explanation:
  correct:
    en: Restore branch recreates release/3.1 at the last commit it pointed to, which meets the first requirement. However, branch policies and permissions are not restored with the branch, so the reviewer and build validation policies must be configured again.
    fr: "Restore branch recrée release/3.1 sur le dernier commit vers lequel elle pointait, ce qui répond à la première exigence. Cependant, les stratégies de branche et les autorisations ne sont pas restaurées avec la branche : les stratégies de réviseurs et de validation de build doivent être reconfigurées."
references:
  - title: Restore a deleted Git branch from the web portal
    url: https://learn.microsoft.com/en-us/azure/devops/repos/git/restore-deleted-branch
