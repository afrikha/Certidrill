id: az400-2b-recover-revert-merge
objective: "2.2.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Litware has a GitHub repository. A branch named **feature/loyalty** was merged into main by the merge commit **5d4c3b2**, in which main is the first parent. The merge was pushed, and other developers have pushed commits to main since then.

    You need to undo all the changes that the merge brought into main. The solution must not rewrite the history of main.

    Which command should you run before you push main?
  fr: |
    Litware dispose d'un dépôt GitHub. Une branche nommée **feature/loyalty** a été fusionnée dans main par le commit de fusion **5d4c3b2**, dont main est le premier parent. La fusion a été poussée, et d'autres développeurs ont poussé des commits vers main depuis.

    Vous devez annuler toutes les modifications que la fusion a apportées à main. La solution ne doit pas réécrire l'historique de main.

    Quelle commande devez-vous exécuter avant de pousser main ?
body:
  options:
    - { id: a, text: "`git revert 5d4c3b2`" }
    - { id: b, text: "`git revert -m 2 5d4c3b2`" }
    - { id: c, text: "`git revert -m 1 5d4c3b2`" }
    - { id: d, text: "`git reset --hard 5d4c3b2^1`" }
answer: { optionId: c }
explanation:
  correct:
    en: Reverting a merge commit requires `-m` to name the parent that is kept as the mainline. With `-m 1`, Git creates a new commit that reverses the changes the merge introduced relative to main, the first parent, without changing existing commits.
    fr: L'annulation d'un commit de fusion exige `-m` pour indiquer le parent conservé comme ligne principale. Avec `-m 1`, Git crée un nouveau commit qui inverse les modifications introduites par la fusion par rapport à main, le premier parent, sans modifier les commits existants.
  options:
    a:
      en: Without `-m`, git revert refuses to revert a merge commit because it cannot tell which parent to keep.
      fr: Sans `-m`, git revert refuse d'annuler un commit de fusion, car il ne sait pas quel parent conserver.
    b:
      en: With `-m 2`, the feature branch is treated as the mainline, so the revert would reverse the main side changes instead of the feature changes.
      fr: |
        Avec `-m 2`, la branche de fonctionnalité est considérée comme la ligne principale : l'annulation inverserait les modifications côté main au lieu de celles de la fonctionnalité.
    d:
      en: A hard reset rewrites main and discards the commits pushed after the merge.
      fr: Un `git reset --hard` réécrit main et supprime les commits poussés après la fusion.
references:
  - title: Undo changes
    url: https://learn.microsoft.com/en-us/azure/devops/repos/git/undo
