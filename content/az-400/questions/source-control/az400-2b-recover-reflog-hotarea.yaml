id: az400-2b-recover-reflog-hotarea
objective: "2.2.5"
type: hotarea
difficulty: 3
status: draft
stem:
  en: |
    A developer at Contoso works on a local branch named **feature/cart**. The branch was never pushed. By mistake, the developer runs `git reset --hard HEAD~2` and then runs `git reflog`, which returns the entries shown in the following table.

    Answer each prompt by selecting the reflog entry to use.

    NOTE: Each correct selection is worth one point.
  fr: |
    Une développeuse de Contoso travaille sur une branche locale nommée **feature/cart**. La branche n'a jamais été poussée. Par erreur, elle exécute `git reset --hard HEAD~2`, puis elle exécute `git reflog`, qui renvoie les entrées du tableau suivant.

    Répondez à chaque consigne en sélectionnant l'entrée du reflog à utiliser.

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
    - id: p1
      text: { en: "Run git reset --hard on this entry to return the branch to its exact state before the mistake.", fr: "Exécuter git reset --hard sur cette entrée pour ramener la branche à son état exact avant l'erreur." }
    - id: p2
      text: { en: "Run git reset --hard on this entry to keep the cart tests but not the discount calculation.", fr: "Exécuter git reset --hard sur cette entrée pour conserver les tests du panier, mais pas le calcul de remise." }
  grid:
    header: [{ en: "Entry", fr: "Entrée" }, { en: "Commit", fr: "Commit" }, { en: "Action", fr: "Action" }]
    rows:
      - [{ text: "HEAD@{0}", area: h0 }, { text: 4e5f6a7 }, { text: "reset: moving to HEAD~2" }]
      - [{ text: "HEAD@{1}", area: h1 }, { text: 9c8d7e6 }, { text: "commit: Add discount calculation" }]
      - [{ text: "HEAD@{2}", area: h2 }, { text: 1a2b3c4 }, { text: "commit: Add cart total tests" }]
      - [{ text: "HEAD@{3}", area: h3 }, { text: 4e5f6a7 }, { text: "checkout: moving from main to feature/cart" }]
      - [{ text: "HEAD@{4}", area: h4 }, { text: 4e5f6a7 }, { text: "pull: Fast-forward" }]
answer:
  values: { p1: h1, p2: h2 }
explanation:
  correct:
    en: The reflog lists where HEAD pointed, newest first. HEAD@{0} is the reset itself, so HEAD@{1} (9c8d7e6) is the branch tip just before the mistake, which includes both commits. HEAD@{2} (1a2b3c4) is the commit that added the cart tests, before the discount calculation was committed. HEAD@{0}, HEAD@{3} and HEAD@{4} all point to 4e5f6a7, the state after the reset.
    fr: Le reflog liste les positions successives de HEAD, de la plus récente à la plus ancienne. HEAD@{0} est la réinitialisation elle-même ; HEAD@{1} (9c8d7e6) est donc l'extrémité de la branche juste avant l'erreur, avec les deux commits. HEAD@{2} (1a2b3c4) est le commit qui a ajouté les tests du panier, avant le commit du calcul de remise. HEAD@{0}, HEAD@{3} et HEAD@{4} pointent tous vers 4e5f6a7, l'état obtenu après la réinitialisation.
references:
  - title: Recover specific data by using Git commands
    url: https://learn.microsoft.com/en-us/training/modules/manage-git-repositories/6-recover-specific-data-git-commands
