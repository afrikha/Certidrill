id: az400-cs4a-branch-policies
objective: "2.1.2"
type: yesno_statements
caseStudy: az400-cs4a-humongous-insurance
difficulty: 2
status: draft
stem:
  en: |
    To meet requirement 10, you configure the following branch policies on main in claims-api:

    - **Require a minimum number of reviewers**: 2. **Allow requestors to approve their own changes** is cleared.
    - **Check for linked work items**: Required.
    - **Build validation**: claims-ci, trigger **Automatic**, policy requirement **Required**, build expiration **Immediately when main is updated**.

    No developer has the **Bypass policies when pushing** or **Bypass policies when completing pull requests** permission.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour satisfaire l'exigence 10, vous configurez les stratégies de branche suivantes sur main dans claims-api :

    - **Require a minimum number of reviewers** : 2. **Allow requestors to approve their own changes** est désactivé.
    - **Check for linked work items** : Required.
    - **Build validation** : claims-ci, déclencheur **Automatic**, exigence de stratégie **Required**, expiration de la build **Immediately when main is updated**.

    Aucun développeur ne dispose de l'autorisation **Bypass policies when pushing** ni **Bypass policies when completing pull requests**.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          A developer can push an urgent fix from a local clone directly to main if the fix is linked to a work item.
        fr: |
          Un développeur peut envoyer un correctif urgent directement d'un clone local vers main si ce correctif est lié à un élément de travail.
    - id: s2
      text:
        en: |
          A pull request created by Ana can be completed after Ana and one other developer approve it, if the other policies are met.
        fr: |
          Une pull request créée par Ana peut être terminée une fois qu'Ana et un autre développeur l'ont approuvée, si les autres stratégies sont respectées.
    - id: s3
      text:
        en: |
          When another pull request is completed into main, the build validation of each open pull request that targets main expires and claims-ci is queued again for it.
        fr: |
          Quand une autre pull request est terminée dans main, la validation de build de chaque pull request ouverte qui cible main expire et claims-ci est remis en file d'attente pour elle.
answer:
  values: { s1: false, s2: false, s3: true }
explanation:
  correct:
    en: |
      A branch with required policies accepts changes only through pull requests unless the user can bypass policies, so a direct push is rejected whatever its work item links. When requestors cannot approve their own changes, the author's vote does not count toward the minimum of two reviewers. With the expiration Immediately when main is updated and an automatic trigger, any update of main expires the build status of open pull requests and queues a new build.
    fr: |
      Une branche dotée de stratégies obligatoires n'accepte de modifications que par des pull requests, sauf pour un utilisateur qui peut contourner les stratégies ; un envoi direct est donc refusé, quels que soient ses liens vers des éléments de travail. Quand les demandeurs ne peuvent pas approuver leurs propres modifications, le vote de l'auteur ne compte pas dans le minimum de deux relecteurs. Avec l'expiration Immediately when main is updated et un déclencheur automatique, toute mise à jour de main fait expirer l'état de build des pull requests ouvertes et met une nouvelle build en file d'attente.
references:
  - title: Set and manage branch policies
    url: https://learn.microsoft.com/en-us/azure/devops/repos/git/branch-policies
