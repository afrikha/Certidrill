id: az400-2a-shared-lib-package
objective: "2.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Northwind has a .NET library named **CoreLib** in its own Azure Repos repository. Twelve application repositories, owned by different teams, use CoreLib.

    You need a cross-repository sharing strategy that meets the following requirements:

    - Each team chooses when to adopt a new version of CoreLib by changing a version number.
    - The application teams don't get access to the CoreLib repository.

    What should you do?
  fr: |
    Northwind dispose d'une bibliothèque .NET nommée **CoreLib** dans son propre dépôt Azure Repos. Douze dépôts d'applications, gérés par des équipes différentes, utilisent CoreLib.

    Vous avez besoin d'une stratégie de partage entre dépôts qui répond aux exigences suivantes :

    - chaque équipe choisit quand adopter une nouvelle version de CoreLib en modifiant un numéro de version ;
    - les équipes d'application n'obtiennent pas d'accès au dépôt CoreLib.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Add CoreLib as a Git submodule in each application repository.", fr: "Ajouter CoreLib comme sous-module Git dans chaque dépôt d'application." }
    - id: b
      text: { en: "Check out the CoreLib repository in each application pipeline.", fr: "Extraire le dépôt CoreLib dans chaque pipeline d'application." }
    - id: c
      text: { en: "Merge the thirteen repositories into a single monorepo.", fr: "Fusionner les treize dépôts en un seul monodépôt." }
    - id: d
      text: { en: "Publish CoreLib as a NuGet package to an Azure Artifacts feed.", fr: "Publier CoreLib sous forme de package NuGet dans un flux Azure Artifacts." }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Publishing the shared component to a centralized package registry such as an Azure Artifacts feed lets each consumer reference a specific version and upgrade when ready, like a third-party library. The application teams only need permission on the feed, not on the source repository.
    fr: |
      Publier le composant partagé dans un registre de packages centralisé comme un flux Azure Artifacts permet à chaque consommateur de référencer une version précise et de la mettre à niveau quand il est prêt, comme une bibliothèque tierce. Les équipes d'application n'ont besoin d'une autorisation que sur le flux, pas sur le dépôt source.
  options:
    a: { en: "A submodule pins a commit, but cloning it requires access to the CoreLib repository.", fr: "Un sous-module fixe un commit, mais son clonage exige l'accès au dépôt CoreLib." }
    b: { en: "Multi-repository checkout requires access to CoreLib and gives no version choice to the teams.", fr: "L'extraction de plusieurs dépôts exige l'accès à CoreLib et ne laisse aux équipes aucun choix de version." }
    c: { en: "A monorepo gives every team access to all the code and removes independent versioning.", fr: "Un monodépôt donne à chaque équipe l'accès à tout le code et supprime le versionnement indépendant." }
references:
  - title: Implement Scalar and cross-repository sharing
    url: https://learn.microsoft.com/en-us/training/modules/manage-git-repositories/5-implement-scalar-cross-repo
  - title: Explore monorepo versus multiple repos
    url: https://learn.microsoft.com/en-us/training/modules/manage-git-repositories/3-explore-monorepo-versus-multiple-repos
