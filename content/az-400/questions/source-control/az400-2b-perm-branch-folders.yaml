id: az400-2b-perm-branch-folders
objective: "2.2.3"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Contoso has an Azure DevOps organization at https://dev.azure.com/contoso that contains a project named **Contoso** with an Azure Repos Git repository named **WebApp**.

    You need to enforce the following branch naming rules:

    - Members of the **Contributors** group can create new branches only under **feature/**.
    - Only members of the **Project Administrators** group can create branches under **release/**.

    You run the following commands from a Developer Command Prompt.

    How should you complete the commands? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso dispose d'une organisation Azure DevOps à l'adresse https://dev.azure.com/contoso qui contient un projet nommé **Contoso** avec un dépôt Git Azure Repos nommé **WebApp**.

    Vous devez appliquer les règles de nommage de branches suivantes :

    - Les membres du groupe **Contributors** peuvent créer de nouvelles branches uniquement sous **feature/**.
    - Seuls les membres du groupe **Project Administrators** peuvent créer des branches sous **release/**.

    Vous exécutez les commandes suivantes depuis une invite de commandes développeur (Developer Command Prompt).

    Comment devez-vous compléter les commandes ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: text
  template: |
    tf git permission /deny:[[perm]] /group:[Contoso]\Contributors /collection:https://dev.azure.com/contoso/ /teamproject:Contoso /repository:WebApp

    tf git permission /allow:CreateBranch /group:[Contoso]\Contributors /collection:https://dev.azure.com/contoso/ /teamproject:Contoso /repository:WebApp [[scope]]

    tf git permission /allow:CreateBranch /group:[[grp]] /collection:https://dev.azure.com/contoso/ /teamproject:Contoso /repository:WebApp /branch:release
  slots:
    - id: perm
      options:
        - { id: gc, text: GenericContribute }
        - { id: cb, text: CreateBranch }
        - { id: fp, text: ForcePush }
        - { id: ct, text: CreateTag }
    - id: scope
      options:
        - { id: main, text: "/branch:main" }
        - { id: rel, text: "/branch:release" }
        - { id: feat, text: "/branch:feature" }
    - id: grp
      options:
        - { id: contrib, text: '[Contoso]\Contributors' }
        - { id: readers, text: '[Contoso]\Readers' }
        - { id: buildadm, text: '"[Contoso]\Build Administrators"' }
        - { id: projadm, text: '"[Contoso]\Project Administrators"' }
answer:
  values: { perm: cb, scope: feat, grp: projadm }
explanation:
  correct:
    en: Denying CreateBranch at the repository level stops Contributors from creating branches anywhere, including at the root. An explicit Allow of CreateBranch on the feature folder then lets them create branches only under feature/, and a separate Allow on the release folder gives that right to Project Administrators only.
    fr: Refuser CreateBranch au niveau du dépôt empêche les Contributors de créer des branches où que ce soit, y compris à la racine. Une autorisation explicite CreateBranch sur le dossier feature leur permet ensuite de créer des branches uniquement sous feature/, et une autorisation distincte sur le dossier release accorde ce droit aux seuls Project Administrators.
  options:
    gc: { en: "Denying GenericContribute would stop Contributors from pushing any commit, not only from creating branches.", fr: "Refuser GenericContribute empêcherait les Contributors de pousser le moindre commit, et pas seulement de créer des branches." }
    fp: { en: "ForcePush controls history rewriting and branch deletion, not branch creation.", fr: "ForcePush contrôle la réécriture de l'historique et la suppression de branches, pas la création de branches." }
    rel: { en: "Allowing Contributors on release would let them create release branches.", fr: "Une autorisation sur release permettrait aux Contributors de créer des branches de mise en production." }
    contrib: { en: "Only Project Administrators must be able to create branches under release/.", fr: "Seuls les Project Administrators doivent pouvoir créer des branches sous release/." }
references:
  - title: Require branches to be created in folders
    url: https://learn.microsoft.com/en-us/azure/devops/repos/git/require-branch-folders
