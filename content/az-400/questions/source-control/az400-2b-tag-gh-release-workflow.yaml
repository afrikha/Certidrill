id: az400-2b-tag-gh-release-workflow
objective: "2.2.4"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Tailspin Toys has a GitHub repository named **booking-api**. Release managers mark each release by pushing a semantic version tag such as **v1.4.2**.

    You need to create a GitHub Actions workflow that meets the following requirements:

    - The workflow runs only when a tag that matches `v*.*.*` is pushed, never for pushes to branches.
    - The workflow creates a GitHub release for the pushed tag by using the GitHub CLI and the `GITHUB_TOKEN`, with the least privileges.

    How should you complete the workflow? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin Toys dispose d'un dépôt GitHub nommé **booking-api**. Les responsables des mises en production marquent chaque version en poussant une balise de version sémantique comme **v1.4.2**.

    Vous devez créer un workflow GitHub Actions qui répond aux exigences suivantes :

    - Le workflow s'exécute uniquement lorsqu'une balise qui correspond à `v*.*.*` est poussée, jamais pour les push vers des branches.
    - Le workflow crée une version (release) GitHub pour la balise poussée à l'aide de GitHub CLI et du `GITHUB_TOKEN`, avec le moins de privilèges possible.

    Comment devez-vous compléter le workflow ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: yaml
  template: |
    name: publish-release
    on:
      push:
        [[trg]]:
          - 'v*.*.*'

    permissions:
      [[perm]]

    jobs:
      release:
        runs-on: ubuntu-latest
        steps:
          - uses: actions/checkout@v4
          - name: Create release
            run: gh release create "$TAG" --generate-notes
            env:
              GH_TOKEN: ${{ github.token }}
              TAG: ${{ [[ref]] }}
  slots:
    - id: trg
      options:
        - { id: branches, text: branches }
        - { id: tags, text: tags }
        - { id: tagsignore, text: tags-ignore }
        - { id: paths, text: paths }
    - id: perm
      options:
        - { id: cread, text: "contents: read" }
        - { id: pwrite, text: "packages: write" }
        - { id: awrite, text: "actions: write" }
        - { id: cwrite, text: "contents: write" }
    - id: ref
      options:
        - { id: sha, text: github.sha }
        - { id: refname, text: github.ref_name }
        - { id: headref, text: github.head_ref }
        - { id: baseref, text: github.base_ref }
answer:
  values: { trg: tags, perm: cwrite, ref: refname }
explanation:
  correct:
    en: "A `push` event with only a `tags` filter runs for matching tags and never for branch pushes. Creating a release writes to the repository contents, so the `GITHUB_TOKEN` needs `contents: write`. For a tag push, `github.ref_name` holds the short tag name, such as v1.4.2, which `gh release create` uses as the release tag."
    fr: "Un événement `push` avec uniquement un filtre `tags` s'exécute pour les balises correspondantes et jamais pour les push vers des branches. La création d'une version écrit dans le contenu du dépôt : le `GITHUB_TOKEN` a donc besoin de `contents: write`. Pour un push de balise, `github.ref_name` contient le nom court de la balise, par exemple v1.4.2, que `gh release create` utilise comme balise de la version."
  options:
    branches: { en: "A branches filter would run the workflow for branch pushes and not for tags.", fr: "Un filtre branches exécuterait le workflow pour les push vers des branches, et pas pour les balises." }
    tagsignore: { en: "tags-ignore would run the workflow for every tag except v*.*.*.", fr: "tags-ignore exécuterait le workflow pour toutes les balises sauf v*.*.*." }
    cread: { en: "contents: read does not allow the token to create a release.", fr: "contents: read ne permet pas au jeton de créer une version." }
    sha: { en: "github.sha is the commit SHA, not the tag name.", fr: "github.sha est le SHA du commit, pas le nom de la balise." }
    headref: { en: "github.head_ref is set only for pull request events.", fr: "github.head_ref n'est défini que pour les événements de demande de tirage." }
references:
  - title: Manage releases with GitHub repos
    url: https://learn.microsoft.com/en-us/training/modules/manage-git-repositories/8-manage-releases-github-repos
  - title: Configure GitHub tags to organize repositories
    url: https://learn.microsoft.com/en-us/training/modules/manage-git-repositories/13-configure-github-tags-organize-repositories
