id: az400-2a-min-reviewers-creator
objective: "2.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Tailspin has an Azure Repos repository named **Api**. Changes to the `main` branch must go through pull requests.

    You need to ensure that every pull request into `main` is approved by at least two people other than its author before it can be completed.

    What should you configure on `main`?
  fr: |
    Tailspin dispose d'un dépôt Azure Repos nommé **Api**. Les changements apportés à la branche `main` doivent passer par des pull requests.

    Vous devez vous assurer que chaque pull request vers `main` est approuvée par au moins deux personnes autres que son auteur avant de pouvoir être terminée.

    Que devez-vous configurer sur `main` ?
body:
  options:
    - id: a
      text: { en: "The Minimum number of reviewers policy set to 2, with Allow requestors to approve their own changes selected", fr: "La stratégie Minimum number of reviewers définie sur 2, avec Allow requestors to approve their own changes activé" }
    - id: b
      text: { en: "The Minimum number of reviewers policy set to 2, with Allow requestors to approve their own changes cleared", fr: "La stratégie Minimum number of reviewers définie sur 2, avec Allow requestors to approve their own changes désactivé" }
    - id: c
      text: { en: "The Automatically included reviewers policy that adds the Contributors group as Optional reviewers", fr: "La stratégie Automatically included reviewers qui ajoute le groupe Contributors comme réviseurs Optional" }
    - id: d
      text: { en: "The Strict Vote Mode repository setting, with the Check for comment resolution policy set to Required", fr: "Le paramètre de dépôt Strict Vote Mode, avec la stratégie Check for comment resolution définie sur Required" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      The Minimum number of reviewers policy blocks completion until the set number of reviewers approve. When Allow requestors to approve their own changes is cleared, the author can still vote Approve, but that vote doesn't count toward the minimum, so two other people must approve.
    fr: |
      La stratégie Minimum number of reviewers bloque la finalisation tant que le nombre défini de réviseurs n'a pas approuvé. Quand Allow requestors to approve their own changes est désactivé, l'auteur peut toujours voter Approve, mais ce vote ne compte pas dans le minimum ; deux autres personnes doivent donc approuver.
  options:
    a: { en: "With this option selected, the author's own approval counts, so only one other person would need to approve.", fr: "Avec cette option activée, l'approbation de l'auteur compte : une seule autre personne aurait besoin d'approuver." }
    c: { en: "Optional reviewers are added to the pull request but are not required to approve it.", fr: "Les réviseurs Optional sont ajoutés à la pull request, mais leur approbation n'est pas requise." }
    d: { en: "Strict Vote Mode only changes who may vote, and comment resolution doesn't require any approval.", fr: "Strict Vote Mode ne change que les personnes autorisées à voter, et la résolution des commentaires n'exige aucune approbation." }
references:
  - title: Set and manage branch policies
    url: https://learn.microsoft.com/en-us/azure/devops/repos/git/branch-policies
