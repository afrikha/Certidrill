id: az400-2a-multi-repo-checkout
objective: "2.2.2"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove has an Azure DevOps organization with two projects. The **Retail** project contains a repository named **WebApp**. The **Shared** project contains a repository named **BuildTools** with scripts used by several teams. The job authorization scope of Retail pipelines already allows access to the Shared project.

    You are writing the YAML pipeline of WebApp. The job must check out both WebApp and BuildTools.

    How should you complete the pipeline? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove dispose d'une organisation Azure DevOps avec deux projets. Le projet **Retail** contient un dépôt nommé **WebApp**. Le projet **Shared** contient un dépôt nommé **BuildTools** avec des scripts utilisés par plusieurs équipes. L'étendue d'autorisation des travaux des pipelines de Retail autorise déjà l'accès au projet Shared.

    Vous écrivez le pipeline YAML de WebApp. Le travail doit extraire WebApp et BuildTools.

    Comment devez-vous compléter le pipeline ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: yaml
  template: |
    resources:
      repositories:
      - repository: tools
        type: [[type]]
        name: [[name]]

    steps:
    - checkout: [[first]]
    - checkout: tools
    - script: ls $(Build.SourcesDirectory)
  slots:
    - id: type
      options:
        - { id: git, text: git }
        - { id: github, text: github }
        - { id: bitbucket, text: bitbucket }
    - id: name
      options:
        - { id: projrepo, text: Shared/BuildTools }
        - { id: repo, text: BuildTools }
        - { id: url, text: https://dev.azure.com/woodgrove/Shared/_git/BuildTools }
    - id: first
      options:
        - { id: self, text: self }
        - { id: none, text: none }
        - { id: webapp, text: WebApp }
answer:
  values: { type: git, name: projrepo, first: self }
explanation:
  correct:
    en: |
      An Azure Repos Git repository is declared with type git, and a repository of another project in the same organization is named ProjectName/RepositoryName; no service connection is needed inside the organization. checkout self gets the repository of the pipeline. With two checkout steps, each repository goes to a folder named after the repository under $(Build.SourcesDirectory), here WebApp and BuildTools.
    fr: |
      Un dépôt Git Azure Repos se déclare avec le type git, et un dépôt d'un autre projet de la même organisation se nomme NomDuProjet/NomDuDépôt ; aucune connexion de service n'est nécessaire au sein de l'organisation. checkout self récupère le dépôt du pipeline. Avec deux étapes checkout, chaque dépôt est placé sous $(Build.SourcesDirectory) dans un dossier portant le nom du dépôt, ici WebApp et BuildTools.
  options:
    github: { en: "github is for repositories hosted on GitHub and requires a service connection.", fr: "github concerne les dépôts hébergés sur GitHub et exige une connexion de service." }
    repo: { en: "Without the project name, the repository is looked up in the pipeline's own project, Retail.", fr: "Sans le nom du projet, le dépôt est recherché dans le projet du pipeline, Retail." }
    url: { en: "The name property takes the project and repository names, not a clone URL.", fr: "La propriété name attend les noms du projet et du dépôt, pas une URL de clonage." }
    none: { en: "checkout none skips the WebApp repository.", fr: "checkout none ignore le dépôt WebApp." }
    webapp: { en: "The repository of the pipeline is referenced as self; WebApp is not a declared repository resource.", fr: "Le dépôt du pipeline se référence avec self ; WebApp n'est pas une ressource de dépôt déclarée." }
references:
  - title: Check out multiple repositories in your pipeline
    url: https://learn.microsoft.com/en-us/azure/devops/pipelines/repos/multi-repo-checkout
