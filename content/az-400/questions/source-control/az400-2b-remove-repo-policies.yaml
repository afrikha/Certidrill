id: az400-2b-remove-repo-policies
objective: "2.2.6"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Contoso has an Azure DevOps project that contains 30 Azure Repos Git repositories. After two incidents, the security team had certificate files with the **.pfx** extension and very large video files removed from the history of several repositories.

    You need to configure Azure Repos to reject pushes that add a .pfx file or a file larger than a defined size. The configuration must apply to all the repositories in the project, including those created later. The solution must minimize administrative effort.

    Which two actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso dispose d'un projet Azure DevOps qui contient 30 dépôts Git Azure Repos. Après deux incidents, l'équipe de sécurité a fait supprimer de l'historique de plusieurs dépôts des fichiers de certificat d'extension **.pfx** et des fichiers vidéo très volumineux.

    Vous devez configurer Azure Repos pour rejeter les push qui ajoutent un fichier .pfx ou un fichier plus grand qu'une taille définie. La configuration doit s'appliquer à tous les dépôts du projet, y compris ceux créés ultérieurement. La solution doit réduire au minimum l'effort d'administration.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Enable the Maximum file size policy on All Repositories.", fr: "Activer la stratégie Maximum file size sur All Repositories." } }
    - { id: b, text: { en: "Add a pattern for .pfx files to the `.gitignore` file of each repository.", fr: "Ajouter un modèle pour les fichiers .pfx au fichier `.gitignore` de chaque dépôt." } }
    - { id: c, text: { en: "Enable the Reserved names policy on All Repositories.", fr: "Activer la stratégie Reserved names sur All Repositories." } }
    - { id: d, text: { en: "Enable the File path validation policy on All Repositories with a pattern for .pfx files.", fr: "Activer la stratégie File path validation sur All Repositories avec un modèle pour les fichiers .pfx." } }
    - { id: e, text: { en: "Add a build validation policy to the main branch of each repository.", fr: "Ajouter une stratégie de validation de build à la branche main de chaque dépôt." } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: Repository policies are enforced by the server on every push. File path validation blocks pushes that introduce paths matching the patterns, and Maximum file size blocks pushes that add or update files above the selected limit. Set on All Repositories, they also become the default for repositories added later.
    fr: Les stratégies de dépôt sont appliquées par le serveur à chaque push. File path validation bloque les push qui introduisent des chemins correspondant aux modèles, et Maximum file size bloque les push qui ajoutent ou modifient des fichiers dépassant la limite choisie. Définies sur All Repositories, elles deviennent aussi la valeur par défaut des dépôts ajoutés ultérieurement.
  options:
    b: { en: ".gitignore is a client-side convention that users can bypass, and it must be maintained in each repository.", fr: ".gitignore est une convention côté client que les utilisateurs peuvent contourner, et il doit être maintenu dans chaque dépôt." }
    c: { en: "Reserved names blocks names that are invalid on some platforms, not file types or sizes.", fr: "Reserved names bloque les noms invalides sur certaines plateformes, pas des types ni des tailles de fichiers." }
    e: { en: "Build validation applies only to pull requests into main, per repository, and does not block direct pushes to other branches.", fr: "La validation de build ne s'applique qu'aux demandes de tirage vers main, dépôt par dépôt, et ne bloque pas les push directs vers d'autres branches." }
references:
  - title: Set Git repository settings and policies
    url: https://learn.microsoft.com/en-us/azure/devops/repos/git/repository-settings
