id: az400-2b-perm-delete-branch
objective: "2.2.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Fabrikam has an Azure Repos Git repository named **Inventory**. A developer named Ben is a member of the project's **Contributors** group, which has its default permissions.

    Ben must clean up the stale branches that other developers created under **feature/**. The solution must follow the principle of least privilege.

    Which permission should you grant to Ben on the repository?
  fr: |
    Fabrikam dispose d'un dépôt Git Azure Repos nommé **Inventory**. Un développeur nommé Ben est membre du groupe **Contributors** du projet, qui possède ses autorisations par défaut.

    Ben doit supprimer les branches obsolètes que d'autres développeurs ont créées sous **feature/**. La solution doit respecter le principe du moindre privilège.

    Quelle autorisation devez-vous accorder à Ben sur le dépôt ?
body:
  options:
    - { id: a, text: Contribute }
    - { id: b, text: Remove others' locks }
    - { id: c, text: "Force push (rewrite history, delete branches and tags)" }
    - { id: d, text: Manage permissions }
answer: { optionId: c }
explanation:
  correct:
    en: In Azure Repos, deleting a branch requires the **Force push** permission, which no default group has. Branch creators receive it automatically on their own branches, which is why Ben can delete his own branches but not those created by others.
    fr: |
      Dans Azure Repos, la suppression d'une branche exige l'autorisation **Force push**, qu'aucun groupe par défaut ne possède. Le créateur d'une branche la reçoit automatiquement sur ses propres branches : Ben peut donc supprimer ses branches, mais pas celles des autres.
  options:
    a:
      en: Ben already has Contribute through the Contributors group; it allows pushing new commits but not deleting branches.
      fr: Ben possède déjà Contribute grâce au groupe Contributors ; cette autorisation permet de pousser de nouveaux commits, mais pas de supprimer des branches.
    b:
      en: Remove others' locks only lets a user unlock branches that someone else locked.
      fr: Remove others' locks permet seulement de déverrouiller les branches verrouillées par d'autres utilisateurs.
    d:
      en: Manage permissions lets Ben change permissions; he could grant himself Force push, which is more than he needs.
      fr: Manage permissions permet à Ben de modifier les autorisations ; il pourrait s'accorder Force push, ce qui dépasse ses besoins.
references:
  - title: Set branch permissions
    url: https://learn.microsoft.com/en-us/azure/devops/repos/git/branch-permissions
