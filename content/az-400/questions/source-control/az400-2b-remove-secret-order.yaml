id: az400-2b-remove-secret-order
objective: "2.2.6"
type: ordering
difficulty: 3
status: draft
stem:
  en: |
    Proseware has a private GitHub repository named **orders-service**. Five days ago, a developer pushed a file named **deploy/prod.env** to main. The file contains a database connection string that includes a password. All open pull requests have been merged or closed, and the collaborators know that the history will be rewritten.

    You need to remove the file from the entire repository history on GitHub and mitigate the exposure.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Proseware dispose d'un dépôt GitHub privé nommé **orders-service**. Il y a cinq jours, un développeur a poussé vers main un fichier nommé **deploy/prod.env**. Le fichier contient une chaîne de connexion à une base de données qui inclut un mot de passe. Toutes les demandes de tirage ouvertes ont été fusionnées ou fermées, et les collaborateurs savent que l'historique va être réécrit.

    Vous devez supprimer le fichier de tout l'historique du dépôt sur GitHub et atténuer l'exposition.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: push, text: { en: "Run `git push --force --mirror origin`.", fr: "Exécuter `git push --force --mirror origin`." } }
    - { id: support, text: { en: "Contact GitHub Support to remove cached views and dereference the affected pull requests.", fr: "Contacter le support GitHub pour supprimer les vues mises en cache et déréférencer les demandes de tirage concernées." } }
    - { id: rotate, text: { en: "Rotate the database password and update the services that use it.", fr: "Renouveler le mot de passe de la base de données et mettre à jour les services qui l'utilisent." } }
    - { id: filter, text: { en: "In a fresh clone, run `git-filter-repo --sensitive-data-removal --invert-paths --path deploy/prod.env`.", fr: "Dans un nouveau clone, exécuter `git-filter-repo --sensitive-data-removal --invert-paths --path deploy/prod.env`." } }
    - { id: revert, text: { en: "Run `git revert` on the commit that added the file, and push main.", fr: "Exécuter `git revert` sur le commit qui a ajouté le fichier, puis pousser main." } }
    - { id: delete, text: { en: "Delete deploy/prod.env in a new commit, and push main.", fr: "Supprimer deploy/prod.env dans un nouveau commit, puis pousser main." } }
    - { id: protect, text: { en: "Add a branch protection rule that blocks force pushes to main.", fr: "Ajouter une règle de protection de branche qui bloque les push forcés vers main." } }
answer:
  sequence: [ rotate, filter, push, support ]
explanation:
  correct:
    en: A secret that was pushed must be treated as compromised, so you rotate it first; clones and forks may already hold it. You then rewrite the history with git-filter-repo, force push all the rewritten refs with `--mirror`, and finally ask GitHub Support to remove cached views and dereference the pull requests that still reference the old commits.
    fr: Un secret qui a été poussé doit être considéré comme compromis ; vous le renouvelez donc en premier, car des clones et des duplications (forks) peuvent déjà le contenir. Vous réécrivez ensuite l'historique avec git-filter-repo, vous effectuez un push forcé de toutes les références réécrites avec `--mirror`, puis vous demandez au support GitHub de supprimer les vues mises en cache et de déréférencer les demandes de tirage qui référencent encore les anciens commits.
  options:
    revert: { en: "A revert adds a new commit; the file stays in the earlier commits.", fr: "Une annulation (revert) ajoute un nouveau commit ; le fichier reste dans les commits antérieurs." }
    delete: { en: "Deleting the file in a new commit leaves it in the history.", fr: "Supprimer le fichier dans un nouveau commit le laisse dans l'historique." }
    protect: { en: "Blocking force pushes would prevent the rewritten history from being pushed.", fr: "Bloquer les push forcés empêcherait de pousser l'historique réécrit." }
references:
  - title: Clean up repository data
    url: https://learn.microsoft.com/en-us/training/modules/manage-git-repositories/7-purge-repository-data
