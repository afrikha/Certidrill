id: az400-2a-build-validation-order
objective: "2.1.3"
type: ordering
difficulty: 1
status: draft
stem:
  en: |
    Wingtip has an Azure Repos repository named **Booking** that contains an `azure-pipelines.yml` file. No pipeline exists yet for Booking.

    You need to prevent pull requests into `main` from being completed unless the build defined in `azure-pipelines.yml` succeeds.

    Which three actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Wingtip dispose d'un dépôt Azure Repos nommé **Booking** qui contient un fichier `azure-pipelines.yml`. Aucun pipeline n'existe encore pour Booking.

    Vous devez empêcher que les pull requests vers `main` soient terminées si le build défini dans `azure-pipelines.yml` ne réussit pas.

    Quelles sont les trois actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - { id: create, text: { en: "Create a pipeline in Azure Pipelines from the existing azure-pipelines.yml file.", fr: "Créer un pipeline dans Azure Pipelines à partir du fichier azure-pipelines.yml existant." } }
    - { id: open, text: { en: "In Repos > Branches, open the Branch policies of main.", fr: "Dans Repos > Branches, ouvrir les stratégies de branche (Branch policies) de main." } }
    - { id: add, text: { en: "Add a Build validation policy that uses the pipeline, with Policy requirement set to Required.", fr: "Ajouter une stratégie Build validation qui utilise le pipeline, avec Policy requirement défini sur Required." } }
    - { id: prtrigger, text: { en: "Add a pr trigger for main to the azure-pipelines.yml file.", fr: "Ajouter un déclencheur pr pour main au fichier azure-pipelines.yml." } }
    - { id: status, text: { en: "Add a Status checks policy that uses the pipeline, with Policy requirement set to Required.", fr: "Ajouter une stratégie Status checks qui utilise le pipeline, avec Policy requirement défini sur Required." } }
    - { id: bypass, text: { en: "Set Bypass policies when pushing to Deny for the Contributors group.", fr: "Définir Bypass policies when pushing sur Deny pour le groupe Contributors." } }
answer:
  sequence: [ create, open, add ]
explanation:
  correct:
    en: |
      A Build validation policy references an existing build pipeline, so the pipeline must be created first. You then open the branch policies of main and add Build validation with Policy requirement set to Required, so builds must succeed for pull requests to be completed.
    fr: |
      Une stratégie Build validation référence un pipeline de build existant ; le pipeline doit donc être créé en premier. Vous ouvrez ensuite les stratégies de branche de main et ajoutez Build validation avec Policy requirement défini sur Required, pour que les builds doivent réussir avant que les pull requests puissent être terminées.
  options:
    prtrigger: { en: "YAML pr triggers don't apply to Azure Repos Git; pull request builds come from the Build validation policy.", fr: "Les déclencheurs pr YAML ne s'appliquent pas à Azure Repos Git ; les builds de pull request proviennent de la stratégie Build validation." }
    status: { en: "Status checks wait for a status posted by an external service; Azure Pipelines builds are validated with Build validation.", fr: "Status checks attend un état publié par un service externe ; les builds Azure Pipelines se valident avec Build validation." }
    bypass: { en: "Denying a bypass permission doesn't make any build required for pull requests.", fr: "Refuser une autorisation de contournement ne rend aucun build obligatoire pour les pull requests." }
references:
  - title: Set and manage branch policies
    url: https://learn.microsoft.com/en-us/azure/devops/repos/git/branch-policies
