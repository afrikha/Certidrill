id: az400-2a-submodule-order
objective: "2.2.2"
type: ordering
difficulty: 3
status: draft
stem:
  en: |
    Adatum has two Azure Repos repositories in the same project: **App** and **Common**. You need App to include Common in the `libs/common` folder as a Git submodule pinned to the commit tagged `v2.3.0` in Common.

    You already have a local clone of App on the `main` branch.

    Which three actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Adatum dispose de deux dépôts Azure Repos dans le même projet : **App** et **Common**. Vous devez faire en sorte qu'App inclue Common dans le dossier `libs/common` sous forme de sous-module Git fixé au commit portant la balise `v2.3.0` dans Common.

    Vous disposez déjà d'un clone local d'App sur la branche `main`.

    Quelles sont les trois actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - { id: add, text: { en: "In App, run git submodule add with the HTTPS URL of Common and the path libs/common.", fr: "Dans App, exécuter git submodule add avec l'URL HTTPS de Common et le chemin libs/common." } }
    - { id: pin, text: { en: "In libs/common, run git checkout v2.3.0.", fr: "Dans libs/common, exécuter git checkout v2.3.0." } }
    - { id: commit, text: { en: "In App, stage .gitmodules and libs/common, commit, and push.", fr: "Dans App, indexer .gitmodules et libs/common, valider, puis envoyer." } }
    - { id: lfs, text: { en: "In App, run git lfs track \"libs/common/**\".", fr: "Dans App, exécuter git lfs track \"libs/common/**\"." } }
    - { id: ignore, text: { en: "In App, add libs/common to the .gitignore file.", fr: "Dans App, ajouter libs/common au fichier .gitignore." } }
    - { id: tagapp, text: { en: "In App, run git tag v2.3.0 and push the tag.", fr: "Dans App, exécuter git tag v2.3.0 et envoyer la balise." } }
answer:
  sequence: [ add, pin, commit ]
explanation:
  correct:
    en: |
      git submodule add clones Common into libs/common and creates the .gitmodules file that stores the submodule URL. Checking out v2.3.0 inside the submodule moves it to the tagged commit, and committing .gitmodules with the libs/common entry in App records that exact commit. Registering the submodule with HTTPS, in the same project, lets Azure Pipelines check it out when the checkout step sets submodules to true.
    fr: |
      git submodule add clone Common dans libs/common et crée le fichier .gitmodules qui stocke l'URL du sous-module. Extraire v2.3.0 dans le sous-module le place sur le commit balisé, et valider .gitmodules avec l'entrée libs/common dans App enregistre ce commit exact. Inscrire le sous-module en HTTPS, dans le même projet, permet à Azure Pipelines de l'extraire quand l'étape checkout définit submodules sur true.
  options:
    lfs: { en: "Git LFS is for large files; a submodule is recorded as a commit reference, not as files.", fr: "Git LFS concerne les gros fichiers ; un sous-module est enregistré comme une référence de commit, pas comme des fichiers." }
    ignore: { en: "Ignoring the folder would prevent App from recording the submodule.", fr: "Ignorer le dossier empêcherait App d'enregistrer le sous-module." }
    tagapp: { en: "The tag v2.3.0 belongs to Common; tagging App doesn't pin the submodule.", fr: "La balise v2.3.0 appartient à Common ; baliser App ne fixe pas le sous-module." }
references:
  - title: Implement Scalar and cross-repository sharing
    url: https://learn.microsoft.com/en-us/training/modules/manage-git-repositories/5-implement-scalar-cross-repo
  - title: Pipeline options for Git repositories
    url: https://learn.microsoft.com/en-us/azure/devops/pipelines/repos/pipeline-options-for-git
