id: az400-2a-lfs-gitattributes-lock
objective: "2.2.1"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Wingtip develops a game in an Azure Repos repository that uses Git LFS. Level designers edit `.umap` map files, which Git cannot merge. Two designers recently edited the same map at the same time and one of them lost a day of work.

    You need to update the repository so that:

    - `.psd` and `.umap` files are stored in Git LFS;
    - `.umap` files can be locked, and designers lock a map before editing it.

    How should you complete the `.gitattributes` file and the command that a designer runs before editing `Maps/Harbor.umap`? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Wingtip développe un jeu dans un dépôt Azure Repos qui utilise Git LFS. Les concepteurs de niveaux modifient des fichiers de cartes `.umap` que Git ne sait pas fusionner. Deux concepteurs ont récemment modifié la même carte en même temps, et l'un d'eux a perdu une journée de travail.

    Vous devez mettre à jour le dépôt pour que :

    - les fichiers `.psd` et `.umap` soient stockés dans Git LFS ;
    - les fichiers `.umap` puissent être verrouillés, et que les concepteurs verrouillent une carte avant de la modifier.

    Comment devez-vous compléter le fichier `.gitattributes` et la commande qu'un concepteur exécute avant de modifier `Maps/Harbor.umap` ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: text
  template: |
    # .gitattributes
    *.psd [[filter]] diff=lfs merge=lfs -text
    *.umap filter=lfs diff=lfs merge=lfs -text [[attr]]

    # Command run by a designer
    git lfs [[cmd]] Maps/Harbor.umap
  slots:
    - id: filter
      options:
        - { id: lfs, text: filter=lfs }
        - { id: fat, text: filter=fat }
        - { id: binary, text: merge=binary }
    - id: attr
      options:
        - { id: lockable, text: lockable }
        - { id: locked, text: locked }
        - { id: readonly, text: readonly }
    - id: cmd
      options:
        - { id: lock, text: lock }
        - { id: track, text: track }
        - { id: checkout, text: checkout }
answer:
  values: { filter: lfs, attr: lockable, cmd: lock }
explanation:
  correct:
    en: |
      The filter=lfs attribute sends matching files through the Git LFS filter so that the repository stores pointers. The lockable attribute, which git lfs track --lockable writes, marks files that must be locked before editing; Git LFS keeps them read-only in the working tree until they are locked. git lfs lock takes the lock on the server, so other designers cannot push changes to that file until it is unlocked. Designers still need to pull the latest version before they start.
    fr: |
      L'attribut filter=lfs fait passer les fichiers correspondants par le filtre Git LFS, pour que le dépôt stocke des pointeurs. L'attribut lockable, qu'écrit git lfs track --lockable, marque les fichiers qui doivent être verrouillés avant modification ; Git LFS les laisse en lecture seule dans l'arborescence de travail tant qu'ils ne sont pas verrouillés. git lfs lock prend le verrou sur le serveur, et les autres concepteurs ne peuvent pas envoyer de modifications de ce fichier tant qu'il n'est pas déverrouillé. Les concepteurs doivent toujours récupérer la dernière version avant de commencer.
  options:
    fat: { en: "filter=fat is the git-fat filter, not Git LFS.", fr: "filter=fat est le filtre de git-fat, pas celui de Git LFS." }
    locked: { en: "The Git LFS attribute is lockable; locks themselves are taken with a command, not declared in .gitattributes.", fr: "L'attribut Git LFS est lockable ; les verrous se prennent par une commande et ne se déclarent pas dans .gitattributes." }
    track: { en: "git lfs track adds a pattern to .gitattributes; it doesn't lock a file.", fr: "git lfs track ajoute un modèle à .gitattributes ; il ne verrouille pas de fichier." }
references:
  - title: Work with large files in your Git repo
    url: https://learn.microsoft.com/en-us/azure/devops/repos/git/manage-large-files
