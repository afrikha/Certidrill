id: az400-2a-hotfix-from-tag
objective: "2.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Litware has an Azure Repos repository. Each release is deployed from `main` and marked with a tag. Production runs the commit tagged `v3.2`.

    Since that release, `main` has received several commits for features that are not ready to ship. A critical bug is found in production. You need to deliver a fix to production without shipping the unreleased features, and the fix must also end up in `main`.

    What should you do?
  fr: |
    Litware dispose d'un dépôt Azure Repos. Chaque version est déployée à partir de `main` et marquée par une balise. La production exécute le commit portant la balise `v3.2`.

    Depuis cette version, `main` a reçu plusieurs commits pour des fonctionnalités qui ne sont pas prêtes à être livrées. Un bogue critique est découvert en production. Vous devez livrer un correctif en production sans livrer les fonctionnalités non publiées, et le correctif doit aussi se retrouver dans `main`.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Create a hotfix branch from the v3.2 tag, fix and deploy it, and then merge the branch into main through a pull request.", fr: "Créer une branche de correctif à partir de la balise v3.2, corriger et déployer, puis fusionner la branche dans main par une pull request." }
    - id: b
      text: { en: "Fix the bug in a branch created from main, merge it into main through a pull request, and then deploy main.", fr: "Corriger le bogue dans une branche créée à partir de main, la fusionner dans main par une pull request, puis déployer main." }
    - id: c
      text: { en: "Run git reset --hard v3.2 on main, commit the fix, force-push main, and then deploy main.", fr: "Exécuter git reset --hard v3.2 sur main, valider le correctif, forcer l'envoi de main, puis déployer main." }
    - id: d
      text: { en: "Move the v3.2 tag to the latest commit of main, commit the fix on main, and then deploy the tag.", fr: "Déplacer la balise v3.2 vers le dernier commit de main, valider le correctif sur main, puis déployer la balise." }
answer: { optionId: a }
explanation:
  correct:
    en: |
      A tag marks the exact commit that runs in production, so it is a reliable starting point for a hotfix branch that contains none of the later commits of main. After the fix is deployed, a pull request merges the hotfix branch into main so the bug does not come back in the next release.
    fr: |
      Une balise marque le commit exact qui s'exécute en production ; c'est donc un point de départ fiable pour une branche de correctif qui ne contient aucun des commits ultérieurs de main. Une fois le correctif déployé, une pull request fusionne la branche de correctif dans main, pour que le bogue ne réapparaisse pas dans la version suivante.
  options:
    b: { en: "Deploying main would also ship the features that are not ready.", fr: "Déployer main livrerait aussi les fonctionnalités qui ne sont pas prêtes." }
    c: { en: "Resetting and force-pushing main rewrites shared history and discards the team's unreleased work.", fr: "Réinitialiser main et forcer son envoi réécrit l'historique partagé et supprime le travail non publié de l'équipe." }
    d: { en: "Moving the tag makes it point to the unreleased commits, which would then be deployed.", fr: "Déplacer la balise la fait pointer vers les commits non publiés, qui seraient alors déployés." }
references:
  - title: Explore Git branch model for continuous delivery
    url: https://learn.microsoft.com/en-us/training/modules/manage-git-branches-workflows/4-explore-git-branch-model-for-continuous-delivery
