id: az400-cs1c-repo-scaling
objective: "2.2.2"
type: dragdrop
caseStudy: az400-cs1c-southridge-video
difficulty: 2
status: draft
stem:
  en: |
    You need to meet the first three repository requirements.

    Which technology should you use for each requirement? To answer, drag the appropriate technologies to the correct requirements. Each technology may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez satisfaire les trois premières exigences relatives aux dépôts.

    Quelle technologie devez-vous utiliser pour chaque exigence ? Pour répondre, faites glisser les technologies appropriées vers les exigences correspondantes. Chaque technologie peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: lfs, text: Git Large File Storage (LFS) }
    - { id: scalar, text: Scalar }
    - { id: submodule, text: { en: "Git submodule", fr: "Sous-module Git" } }
    - { id: shallow, text: { en: "Shallow clone (git clone --depth)", fr: "Clone superficiel (git clone --depth)" } }
    - { id: gc, text: { en: "Garbage collection (git gc)", fr: "Nettoyage de la mémoire (git gc)" } }
  targets:
    - id: r1
      text: { en: "Requirement 1: new art files stored outside the Git object database", fr: "Exigence 1 : nouveaux fichiers graphiques stockés hors de la base d'objets Git" }
    - id: r2
      text: { en: "Requirement 2: partial clone, sparse checkout and background maintenance in one command", fr: "Exigence 2 : clone partiel, extraction partielle et maintenance en arrière-plan en une commande" }
    - id: r3
      text: { en: "Requirement 3: forge-engine included at a specific commit in each game", fr: "Exigence 3 : forge-engine inclus à un commit précis dans chaque jeu" }
answer:
  mapping: { r1: lfs, r2: scalar, r3: submodule }
explanation:
  correct:
    en: |
      Git LFS replaces tracked files with small pointer files in the repository and stores their content in separate storage, downloading it only when needed. Scalar clones a repository with partial clone and sparse-checkout and turns on background prefetch, the file system monitor, the commit-graph and incremental repack. A submodule records another repository at a specific commit, and each parent repository moves to a newer commit only when its team updates the submodule.
    fr: |
      Git LFS remplace les fichiers suivis par de petits fichiers pointeurs dans le dépôt et stocke leur contenu dans un stockage séparé, téléchargé uniquement quand il est nécessaire. Scalar clone un dépôt avec un clone partiel et une extraction partielle, et active la prérécupération en arrière-plan, le moniteur du système de fichiers, le commit-graph et le reconditionnement incrémentiel. Un sous-module enregistre un autre dépôt à un commit précis, et chaque dépôt parent ne passe à un commit plus récent que lorsque son équipe met à jour le sous-module.
  options:
    shallow: { en: "A shallow clone limits the history that is downloaded, but it does not provide sparse checkout or background maintenance.", fr: "Un clone superficiel limite l'historique téléchargé, mais il n'apporte ni extraction partielle ni maintenance en arrière-plan." }
    gc: { en: "git gc compresses and cleans the local object database; it does not move files out of it or share code between repositories.", fr: "git gc compresse et nettoie la base d'objets locale ; il n'en sort pas de fichiers et ne partage pas de code entre dépôts." }
references:
  - title: Work with large repositories
    url: https://learn.microsoft.com/en-us/training/modules/manage-git-repositories/2-work-large-repositories
  - title: Work with large files in your Git repo
    url: https://learn.microsoft.com/en-us/azure/devops/repos/git/manage-large-files
