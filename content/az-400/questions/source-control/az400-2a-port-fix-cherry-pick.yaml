id: az400-2a-port-fix-cherry-pick
objective: "2.1.1"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    Adatum uses the branching guidance of Azure Repos: feature branches merged into `main` through pull requests, and a release branch named `release/20` for the current release.

    A developer fixed a bug directly in `release/20` through a pull request. You need to bring only this fix into `main` without bringing any other change of `release/20`.

    Which three actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Adatum applique les recommandations de création de branches d'Azure Repos : des branches de fonctionnalité fusionnées dans `main` par des pull requests, et une branche de mise en production nommée `release/20` pour la version en cours.

    Un développeur a corrigé un bogue directement dans `release/20` par une pull request. Vous devez reporter uniquement ce correctif dans `main`, sans y apporter aucun autre changement de `release/20`.

    Quelles sont les trois actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - { id: branch, text: { en: "Create a new feature branch from main.", fr: "Créer une nouvelle branche de fonctionnalité à partir de main." } }
    - { id: pick, text: { en: "Cherry-pick the fix commit from release/20 into the new branch.", fr: "Faire un cherry-pick du commit de correctif de release/20 dans la nouvelle branche." } }
    - { id: pr, text: { en: "Open a pull request from the new branch into main and complete it.", fr: "Ouvrir une pull request de la nouvelle branche vers main et la terminer." } }
    - { id: merge, text: { en: "Open a pull request from release/20 into main and complete it.", fr: "Ouvrir une pull request de release/20 vers main et la terminer." } }
    - { id: rebase, text: { en: "Rebase release/20 onto main.", fr: "Rebaser release/20 sur main." } }
    - { id: tag, text: { en: "Create an annotated tag on the fix commit in release/20.", fr: "Créer une balise annotée sur le commit de correctif de release/20." } }
answer:
  sequence: [ branch, pick, pr ]
explanation:
  correct:
    en: |
      The Azure Repos guidance recommends cherry-picking instead of merging so that you control exactly which commits reach `main`. You create a feature branch from `main`, cherry-pick the fix into it, and merge it into `main` through a second pull request, so the branch policies of `main` apply to the fix.
    fr: |
      Les recommandations d'Azure Repos conseillent le cherry-pick plutôt que la fusion, pour contrôler exactement les commits qui arrivent dans `main`. Vous créez une branche de fonctionnalité à partir de `main`, vous y faites un cherry-pick du correctif, puis vous la fusionnez dans `main` par une seconde pull request : les stratégies de branche de `main` s'appliquent ainsi au correctif.
  options:
    merge:
      en: |
        Merging release/20 into main can bring release-specific changes that you don't want in main.
      fr: |
        Fusionner release/20 dans main peut y importer des changements propres à la version, dont vous ne voulez pas dans main.
    rebase:
      en: |
        Rebasing the release branch rewrites its history and doesn't bring the fix into main.
      fr: |
        Rebaser la branche de mise en production réécrit son historique et n'apporte pas le correctif dans main.
    tag:
      en: |
        A tag marks a commit but doesn't copy any change into main.
      fr: |
        Une balise marque un commit mais ne reporte aucun changement dans main.
references:
  - title: Adopt a Git branching strategy
    url: https://learn.microsoft.com/en-us/azure/devops/repos/git/git-branching-guidance
