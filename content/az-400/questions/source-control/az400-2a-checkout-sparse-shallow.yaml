id: az400-2a-checkout-sparse-shallow
objective: "2.2.2"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    Tailspin has a 30 GB Azure Repos repository with a long history. A YAML pipeline created in 2021 builds only the `src/api` folder. Its checkout step currently is:

    ```yaml
    steps:
    - checkout: self
    ```

    The pipeline doesn't use shallow fetch in its settings. The build doesn't need the Git history. The agents are up to date and run Git 2.45.

    You need to reduce the time and the data needed to check out the repository.

    Which two settings should you add to the checkout step? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin dispose d'un dépôt Azure Repos de 30 Go avec un long historique. Un pipeline YAML créé en 2021 ne construit que le dossier `src/api`. Son étape d'extraction est actuellement :

    ```yaml
    steps:
    - checkout: self
    ```

    Le pipeline n'utilise pas l'extraction superficielle (shallow fetch) dans ses paramètres. Le build n'a pas besoin de l'historique Git. Les agents sont à jour et exécutent Git 2.45.

    Vous devez réduire la durée et le volume de données nécessaires à l'extraction du dépôt.

    Quels sont les deux paramètres à ajouter à l'étape d'extraction ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: "fetchDepth: 1" }
    - { id: b, text: "fetchDepth: 0" }
    - { id: c, text: "sparseCheckoutDirectories: src/api" }
    - { id: d, text: "submodules: recursive" }
    - { id: e, text: "lfs: true" }
    - { id: f, text: "fetchTags: true" }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: "fetchDepth: 1 performs a shallow fetch of only the latest commit, which is what git fetch --depth=1 does. sparseCheckoutDirectories enables sparse checkout in cone mode, so only the listed directories are written to the working directory; it requires Git 2.25 or later on the agent."
    fr: "fetchDepth: 1 effectue une récupération superficielle du seul dernier commit, ce que fait git fetch --depth=1. sparseCheckoutDirectories active l'extraction partielle en mode cône : seuls les répertoires indiqués sont écrits dans le répertoire de travail ; il faut Git 2.25 ou ultérieur sur l'agent."
  options:
    b: { en: "fetchDepth: 0 fetches the whole history, the opposite of the goal.", fr: "fetchDepth: 0 récupère tout l'historique, à l'inverse de l'objectif." }
    d: { en: "Fetching submodules recursively adds data instead of reducing it.", fr: "Récupérer les sous-modules de façon récursive ajoute des données au lieu d'en retirer." }
    e: { en: "lfs: true downloads Git LFS content, which increases the data transferred.", fr: "lfs: true télécharge le contenu Git LFS, ce qui augmente les données transférées." }
    f: { en: "Syncing tags adds data and doesn't help the build.", fr: "Synchroniser les balises ajoute des données et n'aide pas le build." }
references:
  - title: steps.checkout definition
    url: https://learn.microsoft.com/en-us/azure/devops/pipelines/yaml-schema/steps-checkout
