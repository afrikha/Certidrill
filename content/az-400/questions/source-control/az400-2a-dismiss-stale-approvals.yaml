id: az400-2a-dismiss-stale-approvals
objective: "2.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Contoso hosts a service in a GitHub repository. A branch protection rule on `main` requires a pull request with one approving review before merging.

    An audit shows that some authors obtain an approval and then push more commits to the pull request before merging it, so the final code was never reviewed.

    You need to ensure that a pull request cannot be merged on the strength of an approval given before its latest changes.

    Which setting should you enable in the branch protection rule?
  fr: |
    Contoso héberge un service dans un dépôt GitHub. Une règle de protection de branche sur `main` exige une pull request avec une revue d'approbation avant la fusion.

    Un audit montre que certains auteurs obtiennent une approbation, puis envoient d'autres commits dans la pull request avant de la fusionner : le code final n'a donc jamais été relu.

    Vous devez vous assurer qu'une pull request ne peut pas être fusionnée sur la base d'une approbation donnée avant ses derniers changements.

    Quel paramètre devez-vous activer dans la règle de protection de branche ?
body:
  options:
    - id: a
      text: Require conversation resolution before merging
    - id: b
      text: Require review from Code Owners
    - id: c
      text: Dismiss stale pull request approvals when new commits are pushed
    - id: d
      text: Require status checks to pass before merging
answer: { optionId: c }
explanation:
  correct:
    en: |
      With Dismiss stale pull request approvals when new commits are pushed, an approval is dismissed as soon as the diff of the pull request changes, for example after a new commit. The pull request then needs a new approving review before it can be merged.
    fr: |
      Avec Dismiss stale pull request approvals when new commits are pushed, une approbation est annulée dès que le diff de la pull request change, par exemple après un nouveau commit. La pull request a alors besoin d'une nouvelle revue d'approbation avant de pouvoir être fusionnée.
  options:
    a: { en: "Conversation resolution only requires review comments to be resolved; earlier approvals stay valid.", fr: "La résolution des conversations exige seulement que les commentaires de revue soient résolus ; les approbations précédentes restent valides." }
    b: { en: "Code owner review decides who must approve, not whether an approval survives new commits.", fr: "La revue des propriétaires de code détermine qui doit approuver, pas si une approbation survit aux nouveaux commits." }
    d: { en: "Status checks validate the code automatically but don't affect existing approvals.", fr: "Les vérifications d'état valident le code automatiquement mais n'ont pas d'effet sur les approbations existantes." }
references:
  - title: Branch protections rules and review requirements
    url: https://learn.microsoft.com/en-us/training/modules/github-enterprise-server-repository-workflows/3-branch-protection-rules
