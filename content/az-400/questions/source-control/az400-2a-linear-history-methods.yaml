id: az400-2a-linear-history-methods
objective: "2.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Proseware has a GitHub repository whose settings allow merge commits, squash merging and rebase merging for pull requests.

    You enable **Require linear history** in the branch protection rule of `main`. No other setting of the rule restricts merge methods.

    Which merge methods can contributors use to merge pull requests into `main`?
  fr: |
    Proseware dispose d'un dépôt GitHub dont les paramètres autorisent les commits de fusion, la fusion squash et la fusion par rebase pour les pull requests.

    Vous activez **Require linear history** dans la règle de protection de branche de `main`. Aucun autre paramètre de la règle ne restreint les méthodes de fusion.

    Quelles méthodes de fusion les contributeurs peuvent-ils utiliser pour fusionner des pull requests dans `main` ?
body:
  options:
    - id: a
      text: { en: "Merge commits only", fr: "Les commits de fusion uniquement" }
    - id: b
      text: { en: "Squash merging only", fr: "La fusion squash uniquement" }
    - id: c
      text: { en: "Merge commits, squash merging and rebase merging", fr: "Les commits de fusion, la fusion squash et la fusion par rebase" }
    - id: d
      text: { en: "Squash merging and rebase merging", fr: "La fusion squash et la fusion par rebase" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Require linear history prevents anyone from pushing merge commits to the protected branch, so pull requests into main must be squash merged or rebase merged. Both methods remain available because the repository allows them, and at least one of them must be allowed for the setting to work.
    fr: |
      Require linear history empêche quiconque d'envoyer des commits de fusion vers la branche protégée ; les pull requests vers main doivent donc être fusionnées par squash ou par rebase. Les deux méthodes restent disponibles, car le dépôt les autorise, et au moins l'une d'elles doit être autorisée pour que le paramètre fonctionne.
  options:
    a: { en: "Merge commits are exactly what linear history blocks.", fr: "Les commits de fusion sont précisément ce que l'historique linéaire bloque." }
    b: { en: "Rebase merging also keeps the history linear, so it stays available.", fr: "La fusion par rebase conserve aussi un historique linéaire : elle reste disponible." }
    c: { en: "Merge commits create a non-linear history and are blocked.", fr: "Les commits de fusion créent un historique non linéaire et sont bloqués." }
references:
  - title: Implement branch merging restrictions
    url: https://learn.microsoft.com/en-us/training/modules/manage-git-branches-workflows/7-implement-branch-merging-restrictions
