id: az400-2a-lfs-migrate-unpushed
objective: "2.2.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Proseware has a GitHub repository that already uses Git LFS for images. A developer made three local commits on a new branch named `feature/scoring`. The first of these commits added `data/model.onnx`, a 140 MiB file. None of the three commits has been pushed.

    The push of `feature/scoring` is rejected because of the file size. The file must stay versioned in the repository.

    What should the developer do before pushing again?
  fr: |
    Proseware dispose d'un dépôt GitHub qui utilise déjà Git LFS pour les images. Un développeur a fait trois commits locaux sur une nouvelle branche nommée `feature/scoring`. Le premier de ces commits a ajouté `data/model.onnx`, un fichier de 140 Mio. Aucun des trois commits n'a été envoyé.

    L'envoi de `feature/scoring` est rejeté à cause de la taille du fichier. Le fichier doit rester versionné dans le dépôt.

    Que doit faire le développeur avant de renvoyer la branche ?
body:
  options:
    - id: a
      text: { en: "Run git lfs migrate import --include=\"data/model.onnx\" on the feature/scoring branch.", fr: "Exécuter git lfs migrate import --include=\"data/model.onnx\" sur la branche feature/scoring." }
    - id: b
      text: { en: "Run git rm --cached data/model.onnx, commit, and then add the file again with Git LFS.", fr: "Exécuter git rm --cached data/model.onnx, valider, puis ajouter à nouveau le fichier avec Git LFS." }
    - id: c
      text: { en: "Run git lfs track \"data/model.onnx\" and commit the updated .gitattributes file.", fr: "Exécuter git lfs track \"data/model.onnx\" et valider le fichier .gitattributes mis à jour." }
    - id: d
      text: { en: "Run git push --force so that the push bypasses the file size check.", fr: "Exécuter git push --force pour que l'envoi contourne la vérification de taille des fichiers." }
answer: { optionId: a }
explanation:
  correct:
    en: |
      GitHub blocks files larger than 100 MiB, and the blob is inside an existing commit, so the unpushed commits must be rewritten. git lfs migrate import rewrites the commits of the current branch so that the matching file is stored as an LFS pointer, and it adds the pattern to .gitattributes. Because the branch was never pushed, the rewritten branch can then be pushed normally.
    fr: |
      GitHub bloque les fichiers de plus de 100 Mio, et l'objet blob se trouve dans un commit existant ; les commits non envoyés doivent donc être réécrits. git lfs migrate import réécrit les commits de la branche courante pour que le fichier correspondant soit stocké sous forme de pointeur LFS, et ajoute le modèle à .gitattributes. Comme la branche n'a jamais été envoyée, la branche réécrite peut ensuite être envoyée normalement.
  options:
    c: { en: "Tracking only applies to files added afterward; the first commit still contains the 140 MiB blob.", fr: "Le suivi ne s'applique qu'aux fichiers ajoutés ensuite ; le premier commit contient toujours l'objet blob de 140 Mio." }
    b: { en: "Removing the file in a new commit leaves the blob in the earlier commit, so the push is still rejected.", fr: "Supprimer le fichier dans un nouveau commit laisse l'objet blob dans le commit précédent : l'envoi est toujours rejeté." }
    d: { en: "Forcing a push doesn't bypass the file size limit of GitHub.", fr: "Forcer l'envoi ne contourne pas la limite de taille des fichiers de GitHub." }
references:
  - title: Work with large files in your Git repo
    url: https://learn.microsoft.com/en-us/azure/devops/repos/git/manage-large-files
