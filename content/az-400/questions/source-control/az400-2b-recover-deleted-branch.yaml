id: az400-2b-recover-deleted-branch
objective: "2.2.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Adatum has an Azure Repos Git repository named **Invoicing**. Two months ago, a branch named **feature/invoice-export** was deleted by mistake. No team member has a local copy of the branch.

    You need to recreate the branch at the commit it pointed to when it was deleted. The solution must minimize administrative effort.

    What should you do?
  fr: |
    Adatum dispose d'un dépôt Git Azure Repos nommé **Invoicing**. Il y a deux mois, une branche nommée **feature/invoice-export** a été supprimée par erreur. Aucun membre de l'équipe ne possède de copie locale de la branche.

    Vous devez recréer la branche sur le commit vers lequel elle pointait lors de sa suppression. La solution doit réduire au minimum l'effort d'administration.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "In Project settings, open Repositories and restore the branch from the recycle bin.", fr: "Dans Project settings, ouvrir Repositories et restaurer la branche depuis la corbeille." }
    - id: b
      text: { en: "In the Branches view, search the deleted branches for the exact name, and then select Restore branch.", fr: "Dans la vue Branches, rechercher le nom exact parmi les branches supprimées, puis sélectionner Restore branch." }
    - id: c
      text: { en: "Clone the repository, run git reflog to find the commit, and then push a new branch.", fr: "Cloner le dépôt, exécuter git reflog pour trouver le commit, puis pousser une nouvelle branche." }
    - id: d
      text: { en: "Call the REST API to restore the Invoicing repository from the recycle bin.", fr: "Appeler l'API REST pour restaurer le dépôt Invoicing depuis la corbeille." }
answer: { optionId: b }
explanation:
  correct:
    en: In the Branches view, you search for the exact branch name and select the option to search deleted branches. Azure Repos shows the commit the branch pointed to, who deleted it and when, and **Restore branch** recreates it at that commit. Deleted branches do not expire, but their branch policies and permissions are not restored.
    fr: Dans la vue Branches, vous recherchez le nom exact de la branche et sélectionnez l'option de recherche parmi les branches supprimées. Azure Repos affiche le commit vers lequel pointait la branche, qui l'a supprimée et quand, et **Restore branch** la recrée sur ce commit. Les branches supprimées n'expirent pas, mais leurs stratégies de branche et leurs autorisations ne sont pas restaurées.
  options:
    a:
      en: The recycle bin holds deleted repositories, not deleted branches.
      fr: La corbeille contient les dépôts supprimés, pas les branches supprimées.
    c:
      en: A fresh clone has no reflog history of the deleted branch, so it cannot reveal the commit.
      fr: |
        Un nouveau clone ne possède aucun historique reflog de la branche supprimée : il ne peut pas révéler le commit.
    d:
      en: The repository was not deleted; restoring repositories from the recycle bin does not apply to a deleted branch.
      fr: Le dépôt n'a pas été supprimé ; la restauration de dépôts depuis la corbeille ne s'applique pas à une branche supprimée.
references:
  - title: Restore a deleted Git branch from the web portal
    url: https://learn.microsoft.com/en-us/azure/devops/repos/git/restore-deleted-branch
