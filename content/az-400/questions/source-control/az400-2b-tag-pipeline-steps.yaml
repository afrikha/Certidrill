id: az400-2b-tag-pipeline-steps
objective: "2.2.4"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove Bank has an Azure Repos Git repository named **Ledger** and a YAML pipeline that builds it. After a successful build, the pipeline must create an annotated tag named after the build number on the built commit and publish the tag to Ledger.

    The project build service identity already has the **Contribute** and **Create tag** permissions on Ledger.

    Which four steps should the job perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Woodgrove Bank dispose d'un dépôt Git Azure Repos nommé **Ledger** et d'un pipeline YAML qui le génère. Après un build réussi, le pipeline doit créer sur le commit généré une balise annotée portant le numéro de build, puis publier la balise dans Ledger.

    L'identité du service de build du projet possède déjà les autorisations **Contribute** et **Create tag** sur Ledger.

    Quelles sont les quatre étapes que le travail doit effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: tag, text: { en: "Run `git tag -a v$(Build.BuildNumber) -m \"Build $(Build.BuildNumber)\"`.", fr: "Exécuter `git tag -a v$(Build.BuildNumber) -m \"Build $(Build.BuildNumber)\"`." } }
    - { id: checkout, text: { en: "Check out the repository with `persistCredentials: true`.", fr: "Extraire le dépôt avec `persistCredentials: true`." } }
    - { id: push, text: { en: "Run `git push origin v$(Build.BuildNumber)`.", fr: "Exécuter `git push origin v$(Build.BuildNumber)`." } }
    - { id: config, text: { en: "Run `git config user.email` and `git config user.name` to set the tagger identity.", fr: "Exécuter `git config user.email` et `git config user.name` pour définir l'identité de l'auteur de la balise." } }
    - { id: force, text: { en: "Run `git push --force origin main`.", fr: "Exécuter `git push --force origin main`." } }
    - { id: delete, text: { en: "Run `git push origin --delete v$(Build.BuildNumber)`.", fr: "Exécuter `git push origin --delete v$(Build.BuildNumber)`." } }
answer:
  sequence: [ checkout, config, tag, push ]
explanation:
  correct:
    en: "The checkout must keep the job's access token with `persistCredentials: true` so that later Git commands can authenticate. An annotated tag records a tagger, so the Git identity must be set in the repository before `git tag -a` runs. The tag is local until you push it by name to the remote."
    fr: "L'étape checkout doit conserver le jeton d'accès du travail avec `persistCredentials: true` pour que les commandes Git suivantes puissent s'authentifier. Une balise annotée enregistre son auteur : l'identité Git doit donc être définie dans le dépôt avant l'exécution de `git tag -a`. La balise reste locale tant que vous ne la poussez pas par son nom vers le dépôt distant."
  options:
    force: { en: "Force pushing main rewrites the branch and does not publish the tag.", fr: "Un push forcé de main réécrit la branche et ne publie pas la balise." }
    delete: { en: "This command deletes a remote tag instead of publishing it.", fr: "Cette commande supprime une balise distante au lieu de la publier." }
references:
  - title: Run Git commands in pipeline scripts
    url: https://learn.microsoft.com/en-us/azure/devops/pipelines/scripts/git-commands
  - title: Use Git tags
    url: https://learn.microsoft.com/en-us/azure/devops/repos/git/git-tags
