id: az400-2a-cli-approver-count
objective: "2.1.2"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Adatum manages the branch policies of its Azure Repos repositories by script. The variable `$REPO_ID` contains the ID of a repository named **Billing**.

    You need to create a policy on the `main` branch of Billing that meets the following requirements:

    - Pull requests require two approvals, and the vote of the pull request creator doesn't count.
    - All approvals are reset when new changes are pushed to the source branch.
    - The policy blocks the completion of pull requests that don't meet it.

    How should you complete the command? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum gère par script les stratégies de branche de ses dépôts Azure Repos. La variable `$REPO_ID` contient l'ID d'un dépôt nommé **Billing**.

    Vous devez créer sur la branche `main` de Billing une stratégie qui répond aux exigences suivantes :

    - les pull requests exigent deux approbations, et le vote du créateur de la pull request ne compte pas ;
    - toutes les approbations sont réinitialisées quand de nouveaux changements sont envoyés vers la branche source ;
    - la stratégie bloque la finalisation des pull requests qui ne la respectent pas.

    Comment devez-vous compléter la commande ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: bash
  template: |
    az repos policy [[grp]] create \
      --repository-id $REPO_ID --branch main \
      --blocking true --enabled true \
      --minimum-approver-count 2 \
      --allow-downvotes false \
      [[votes]]
  slots:
    - id: grp
      options:
        - { id: approver, text: approver-count }
        - { id: required, text: required-reviewer }
        - { id: comment, text: comment-required }
        - { id: workitem, text: work-item-linking }
    - id: votes
      options:
        - { id: ff, text: "--creator-vote-counts false --reset-on-source-push false" }
        - { id: ft, text: "--creator-vote-counts false --reset-on-source-push true" }
        - { id: tf, text: "--creator-vote-counts true --reset-on-source-push false" }
        - { id: tt, text: "--creator-vote-counts true --reset-on-source-push true" }
answer:
  values: { grp: approver, votes: ft }
explanation:
  correct:
    en: |
      The Minimum number of reviewers policy is created with az repos policy approver-count create, which takes --minimum-approver-count. Setting --creator-vote-counts to false makes the creator's vote not count toward the minimum, and setting --reset-on-source-push to true resets the votes when the source branch receives new changes.
    fr: |
      La stratégie Minimum number of reviewers se crée avec az repos policy approver-count create, qui accepte --minimum-approver-count. Avec --creator-vote-counts à false, le vote du créateur ne compte pas dans le minimum, et avec --reset-on-source-push à true, les votes sont réinitialisés quand la branche source reçoit de nouveaux changements.
  options:
    required: { en: "required-reviewer adds specific required reviewers for paths; it has no minimum approver count.", fr: "required-reviewer ajoute des réviseurs obligatoires précis pour des chemins ; il n'a pas de nombre minimum d'approbateurs." }
    comment: { en: "comment-required only checks that comments are resolved.", fr: "comment-required vérifie seulement que les commentaires sont résolus." }
    workitem: { en: "work-item-linking only checks that work items are linked.", fr: "work-item-linking vérifie seulement que des éléments de travail sont liés." }
    tf: { en: "The creator's vote would count, and approvals would survive new pushes.", fr: "Le vote du créateur compterait, et les approbations survivraient aux nouveaux envois." }
    tt: { en: "The creator's vote would count toward the two approvals.", fr: "Le vote du créateur compterait dans les deux approbations." }
    ff: { en: "Approvals would not be reset when new changes are pushed.", fr: "Les approbations ne seraient pas réinitialisées lors de l'envoi de nouveaux changements." }
references:
  - title: az repos policy approver-count
    url: https://learn.microsoft.com/en-us/cli/azure/repos/policy/approver-count
  - title: Set and manage branch policies
    url: https://learn.microsoft.com/en-us/azure/devops/repos/git/branch-policies
