id: az400-2b-remove-after-rewrite
objective: "2.2.6"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    Wingtip Toys has a public GitHub repository named **ticketing** that several external users have forked. An API key was committed to the repository a month ago. You revoked the key, removed the file from the history by running `git-filter-repo --sensitive-data-removal --invert-paths`, and ran `git push --force --mirror origin`. Some commits in the repository were signed.

    Which two statements are true?

    NOTE: Each correct selection is worth one point.
  fr: |
    Wingtip Toys dispose d'un dépôt GitHub public nommé **ticketing** que plusieurs utilisateurs externes ont dupliqué (fork). Une clé API a été commitée dans le dépôt il y a un mois. Vous avez révoqué la clé, supprimé le fichier de l'historique en exécutant `git-filter-repo --sensitive-data-removal --invert-paths`, puis exécuté `git push --force --mirror origin`. Certains commits du dépôt étaient signés.

    Quelles sont les deux affirmations vraies ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "GitHub notifies the owners of the forks and purges the file from their repositories.", fr: "GitHub avertit les propriétaires des duplications et purge le fichier de leurs dépôts." } }
    - { id: b, text: { en: "The hashes of the commit that added the file and of every later commit have changed.", fr: "Les hachages du commit qui a ajouté le fichier et de tous les commits suivants ont changé." } }
    - { id: c, text: { en: "The signatures of the rewritten commits are preserved.", fr: "Les signatures des commits réécrits sont conservées." } }
    - { id: d, text: { en: "Collaborators can safely merge their existing local branches into the rewritten main.", fr: "Les collaborateurs peuvent fusionner sans risque leurs branches locales existantes dans la branche main réécrite." } }
    - { id: e, text: { en: "Forks of the repository can still contain the file until their owners remove it.", fr: "Les duplications du dépôt peuvent encore contenir le fichier jusqu'à ce que leurs propriétaires le suppriment." } }
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: Rewriting history gives new hashes to the first affected commit and to every commit after it. The rewrite changes only your repository; GitHub cannot contact fork owners, so forks, clones and cached copies outside your control can still contain the file.
    fr: |
      La réécriture de l'historique attribue de nouveaux hachages au premier commit concerné et à tous les commits suivants. Elle ne modifie que votre dépôt ; GitHub ne peut pas contacter les propriétaires des duplications : les duplications, les clones et les copies en cache hors de votre contrôle peuvent encore contenir le fichier.
  options:
    a: { en: "GitHub cannot contact fork owners; you must ask them to remove the data or delete the fork.", fr: "GitHub ne peut pas contacter les propriétaires des duplications ; vous devez leur demander de supprimer les données ou la duplication." }
    c: { en: "git-filter-repo removes commit and tag signatures, even on commits that predate the removal.", fr: "git-filter-repo supprime les signatures des commits et des balises, même sur les commits antérieurs à la suppression." }
    d: { en: "Collaborators must rebase, not merge, branches based on the old history; a merge could reintroduce the file.", fr: "Les collaborateurs doivent rebaser, et non fusionner, les branches basées sur l'ancien historique ; une fusion pourrait réintroduire le fichier." }
references:
  - title: Clean up repository data
    url: https://learn.microsoft.com/en-us/training/modules/manage-git-repositories/7-purge-repository-data
