id: az400-2a-trunk-based-cd
objective: "2.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Fabrikam has a web application in a GitHub repository. A GitHub Actions workflow deploys the `main` branch to production several times a day.

    The development team wants to integrate code continuously and minimize merge conflicts. Features that are not finished must not prevent the team from deploying `main`.

    Which branch strategy should the team adopt?
  fr: |
    Fabrikam dispose d'une application web dans un dépôt GitHub. Un workflow GitHub Actions déploie la branche `main` en production plusieurs fois par jour.

    L'équipe de développement veut intégrer le code en continu et réduire au minimum les conflits de fusion. Les fonctionnalités non terminées ne doivent pas empêcher l'équipe de déployer `main`.

    Quelle stratégie de branche l'équipe doit-elle adopter ?
body:
  options:
    - id: a
      text: { en: "A develop branch that integrates all feature branches and is merged into main at each release", fr: "Une branche develop qui intègre toutes les branches de fonctionnalité et qui est fusionnée dans main à chaque mise en production" }
    - id: b
      text: { en: "A long-lived feature branch for each epic, merged into main when the epic is complete", fr: "Une branche de fonctionnalité de longue durée pour chaque epic, fusionnée dans main quand l'epic est terminé" }
    - id: c
      text: { en: "Trunk-based development: short-lived branches merged into main daily, with feature flags", fr: "Le développement basé sur le tronc : branches de courte durée fusionnées chaque jour dans main, avec des indicateurs de fonctionnalité" }
    - id: d
      text: { en: "One long-lived branch per environment (dev, test, prod), with changes promoted by merging between them", fr: "Une branche de longue durée par environnement (dev, test, prod), avec une promotion des changements par fusion entre elles" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      In trunk-based development, every change goes through a short-lived branch that is merged into the trunk (`main`) quickly, so integration happens continuously and merges stay small. Feature flags decouple deployment from exposure, so unfinished code can be merged and deployed while it stays hidden from users. This is how Microsoft keeps its main branch buildable at all times.
    fr: |
      Dans le développement basé sur le tronc, chaque changement passe par une branche de courte durée fusionnée rapidement dans le tronc (`main`) ; l'intégration est donc continue et les fusions restent petites. Les indicateurs de fonctionnalité séparent le déploiement de l'exposition : le code non terminé peut être fusionné et déployé tout en restant masqué aux utilisateurs. C'est ainsi que Microsoft maintient sa branche principale constructible en permanence.
  options:
    a:
      en: |
        A develop branch delays integration into main until each release, which contradicts deploying main several times a day.
      fr: |
        Une branche develop retarde l'intégration dans main jusqu'à chaque mise en production, ce qui contredit le déploiement de main plusieurs fois par jour.
    b:
      en: |
        Long-lived feature branches accumulate divergence and produce large, conflict-prone merges.
      fr: |
        Les branches de fonctionnalité de longue durée accumulent les divergences et produisent de grosses fusions sujettes aux conflits.
    d:
      en: |
        Environment branches multiply long-lived branches and merges; promotion between environments belongs to the pipeline, not to branches.
      fr: |
        Les branches d'environnement multiplient les branches de longue durée et les fusions ; la promotion entre environnements relève du pipeline, pas des branches.
references:
  - title: How Microsoft develops with DevOps
    url: https://learn.microsoft.com/en-us/devops/develop/how-microsoft-develops-devops
  - title: Explore branch workflow types
    url: https://learn.microsoft.com/en-us/training/modules/manage-git-branches-workflows/2-explore-branch-workflow-types
