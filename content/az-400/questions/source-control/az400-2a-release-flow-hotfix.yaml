id: az400-2a-release-flow-hotfix
objective: "2.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Contoso uses Azure Repos and follows Release Flow. At the end of each sprint, the team creates a release branch from `main`, for example `releases/M140`, and deploys it to production.

    A bug is found in production. The same code is also in `main`. The fix must reach production as soon as possible, and the bug must not come back with the deployment of the next sprint.

    What should the team do?
  fr: |
    Contoso utilise Azure Repos et applique Release Flow. À la fin de chaque sprint, l'équipe crée une branche de mise en production à partir de `main`, par exemple `releases/M140`, et la déploie en production.

    Un bogue est découvert en production. Le même code se trouve aussi dans `main`. Le correctif doit arriver en production le plus vite possible, et le bogue ne doit pas réapparaître avec le déploiement du sprint suivant.

    Que doit faire l'équipe ?
body:
  options:
    - id: a
      text: { en: "Fix the bug in a branch created from releases/M140, merge it into releases/M140, and then merge releases/M140 into main.", fr: "Corriger le bogue dans une branche créée à partir de releases/M140, la fusionner dans releases/M140, puis fusionner releases/M140 dans main." }
    - id: b
      text: { en: "Fix the bug in a branch created from main, merge it into main through a pull request, and then cherry-pick the change into releases/M140.", fr: "Corriger le bogue dans une branche créée à partir de main, la fusionner dans main par une pull request, puis faire un cherry-pick du changement dans releases/M140." }
    - id: c
      text: { en: "Fix the bug only in a branch created from releases/M140 and merge it into releases/M140, because the next release branch replaces it.", fr: "Corriger le bogue uniquement dans une branche créée à partir de releases/M140 et la fusionner dans releases/M140, car la branche de mise en production suivante la remplacera." }
    - id: d
      text: { en: "Fix the bug in a branch created from main, and then merge that branch into both main and releases/M140 with merge commits.", fr: "Corriger le bogue dans une branche créée à partir de main, puis fusionner cette branche dans main et dans releases/M140 avec des commits de fusion." }
answer: { optionId: b }
explanation:
  correct:
    en: |
      In Release Flow, a fix always starts in `main`, so it cannot be forgotten in the next sprint's release branch. Once the pull request is merged into `main`, the change is cherry-picked into the release branch, which creates a new pull request that targets `releases/M140` and goes through review and policies again. Release branches never merge back into `main`.
    fr: |
      Avec Release Flow, un correctif commence toujours dans `main`, ce qui évite de l'oublier dans la branche de mise en production du sprint suivant. Une fois la pull request fusionnée dans `main`, le changement fait l'objet d'un cherry-pick dans la branche de mise en production, ce qui crée une nouvelle pull request ciblant `releases/M140`, soumise à nouveau à la revue et aux stratégies. Les branches de mise en production ne sont jamais refusionnées dans `main`.
  options:
    a:
      en: |
        Merging a release branch into main can bring release-specific changes into main; Release Flow never merges release branches back.
      fr: |
        Fusionner une branche de mise en production dans main peut y importer des changements propres à cette version ; Release Flow ne refusionne jamais les branches de mise en production.
    c:
      en: |
        The next release branch is cut from main, which still contains the bug, so the bug would come back.
      fr: |
        La branche de mise en production suivante est créée à partir de main, qui contient toujours le bogue : le bogue réapparaîtrait.
    d:
      en: |
        A branch created from main carries every commit of main, so merging it into the release branch would ship unreleased changes.
      fr: |
        Une branche créée à partir de main contient tous les commits de main : la fusionner dans la branche de mise en production livrerait des changements non publiés.
references:
  - title: How Microsoft develops with DevOps
    url: https://learn.microsoft.com/en-us/devops/develop/how-microsoft-develops-devops
