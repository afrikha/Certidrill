id: az400-2a-limit-merge-squash
objective: "2.1.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso has an Azure Repos repository named **Portal**. Changes to `main` are made through pull requests.

    You need to ensure that each completed pull request adds exactly one new commit to `main`, whatever the number of commits in its source branch. Developers must not be able to choose another merge type.

    What should you configure on `main`?
  fr: |
    Contoso dispose d'un dépôt Azure Repos nommé **Portal**. Les changements apportés à `main` passent par des pull requests.

    Vous devez vous assurer que chaque pull request terminée ajoute exactement un nouveau commit à `main`, quel que soit le nombre de commits de sa branche source. Les développeurs ne doivent pas pouvoir choisir un autre type de fusion.

    Que devez-vous configurer sur `main` ?
body:
  options:
    - id: a
      text: { en: "The Limit merge types policy, with only Squash merge allowed", fr: "La stratégie Limit merge types, avec uniquement Squash merge autorisé" }
    - id: b
      text: { en: "The Limit merge types policy, with only Basic merge (no fast-forward) allowed", fr: "La stratégie Limit merge types, avec uniquement Basic merge (no fast-forward) autorisé" }
    - id: c
      text: { en: "The Limit merge types policy, with only Rebase and fast-forward allowed", fr: "La stratégie Limit merge types, avec uniquement Rebase and fast-forward autorisé" }
    - id: d
      text: { en: "The Limit merge types policy, with only Rebase with merge commit allowed", fr: "La stratégie Limit merge types, avec uniquement Rebase with merge commit autorisé" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      A squash merge adds all the file changes of the source branch to a single new commit on the target branch. With Limit merge types allowing only Squash merge, the Complete pull request dialog offers no other merge type, so each pull request adds one commit to main. By default, all merge types are allowed.
    fr: |
      Une fusion squash ajoute tous les changements de fichiers de la branche source dans un seul nouveau commit sur la branche cible. Si Limit merge types n'autorise que Squash merge, la boîte de dialogue de finalisation de la pull request ne propose aucun autre type de fusion : chaque pull request ajoute un commit à main. Par défaut, tous les types de fusion sont autorisés.
  options:
    c: { en: "Rebase and fast-forward replays every commit of the source branch onto main, so several commits can be added.", fr: "Rebase and fast-forward rejoue chaque commit de la branche source sur main : plusieurs commits peuvent donc être ajoutés." }
    b: { en: "A basic merge keeps all the source commits and adds a merge commit.", fr: "Une fusion de base conserve tous les commits source et ajoute un commit de fusion." }
    d: { en: "Rebase with merge commit replays the source commits and then adds a merge commit.", fr: "Rebase with merge commit rejoue les commits source puis ajoute un commit de fusion." }
references:
  - title: Set and manage branch policies
    url: https://learn.microsoft.com/en-us/azure/devops/repos/git/branch-policies
  - title: Merge strategies and squash merge
    url: https://learn.microsoft.com/en-us/azure/devops/repos/git/merging-with-squash
