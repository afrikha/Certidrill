id: az400-cs1c-leaked-key-purge
objective: "2.2.6"
type: ordering
caseStudy: az400-cs1c-southridge-video
difficulty: 3
status: draft
stem:
  en: |
    You need to meet the repository requirement about the leaked storage account key. git-filter-repo is installed on your computer, and all the open pull requests of skyforge have been merged or closed.

    Which three actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Vous devez satisfaire l'exigence relative aux dépôts concernant la clé du compte de stockage divulguée. git-filter-repo est installé sur votre ordinateur, et toutes les pull requests ouvertes de skyforge ont été fusionnées ou fermées.

    Quelles sont les trois actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - { id: revert, text: { en: "Run git revert on the commit that added the file, and push the new commit.", fr: "Exécuter git revert sur le commit qui a ajouté le fichier, puis pousser le nouveau commit." } }
    - { id: rotate, text: { en: "Regenerate the leaked access key of the storage account.", fr: "Régénérer la clé d'accès divulguée du compte de stockage." } }
    - { id: filter, text: { en: "In a fresh clone, run git filter-repo --invert-paths --path config/cdn-storage.json.", fr: "Dans un nouveau clone, exécuter git filter-repo --invert-paths --path config/cdn-storage.json." } }
    - { id: rm, text: { en: "Run git rm config/cdn-storage.json, commit and push.", fr: "Exécuter git rm config/cdn-storage.json, commiter et pousser." } }
    - { id: push, text: { en: "Run git push --force --mirror origin.", fr: "Exécuter git push --force --mirror origin." } }
    - { id: reset, text: { en: "Run git reset --hard HEAD~1 in your local clone.", fr: "Exécuter git reset --hard HEAD~1 dans votre clone local." } }
answer:
  sequence: [ rotate, filter, push ]
explanation:
  correct:
    en: |
      A secret that reached a remote must be considered compromised, so you regenerate the key first; this alone makes it stop working. git filter-repo with --invert-paths and --path then rewrites every commit of every ref without the file, and the rewritten history replaces the one on GitHub only after a force push. Collaborators must then re-clone or clean up their clones, and GitHub Support can remove cached views and dereference old pull requests.
    fr: |
      Un secret qui a atteint un dépôt distant doit être considéré comme compromis : vous régénérez d'abord la clé, ce qui suffit à la rendre inutilisable. git filter-repo avec --invert-paths et --path réécrit ensuite chaque commit de chaque référence sans le fichier, et l'historique réécrit ne remplace celui de GitHub qu'après un push forcé. Les collaborateurs doivent ensuite recloner ou nettoyer leurs clones, et le support GitHub peut supprimer les vues en cache et déréférencer les anciennes pull requests.
  options:
    revert: { en: "git revert adds a new commit that undoes the change; the key stays in the history.", fr: "git revert ajoute un nouveau commit qui annule la modification ; la clé reste dans l'historique." }
    rm: { en: "git rm removes the file only from the next commits; earlier commits still contain it.", fr: "git rm supprime le fichier uniquement des commits suivants ; les commits précédents le contiennent toujours." }
    reset: { en: "The commit is already on GitHub and may not be the last one; resetting a local branch does not remove it from the remote history.", fr: "Le commit est déjà sur GitHub et n'est peut-être pas le dernier ; réinitialiser une branche locale ne le supprime pas de l'historique distant." }
references:
  - title: Clean up repository data
    url: https://learn.microsoft.com/en-us/training/modules/manage-git-repositories/3-purge-repository-data
