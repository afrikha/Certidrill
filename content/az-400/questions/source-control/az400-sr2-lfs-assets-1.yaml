stem:
  en: You configure Git LFS tracking and keep the existing SSH remote.
  fr: Vous configurez le suivi Git LFS et conservez le dépôt distant SSH existant.
body:
  solution:
    en: |
      Each artist installs the Git LFS client. You run the following commands once, commit the resulting `.gitattributes` file and push it. The artists keep their existing **SSH** remote to push the new files.

      ```bash
      git lfs install
      git lfs track "*.psd" "*.fbx"
      git add .gitattributes
      git commit -m "Track PSD and FBX files with Git LFS"
      ```
    fr: |
      Chaque artiste installe le client Git LFS. Vous exécutez une fois les commandes suivantes, commitez le fichier `.gitattributes` obtenu et l'envoyez. Les artistes conservent leur dépôt distant **SSH** existant pour envoyer les nouveaux fichiers.

      ```bash
      git lfs install
      git lfs track "*.psd" "*.fbx"
      git add .gitattributes
      git commit -m "Track PSD and FBX files with Git LFS"
      ```
answer: { value: false }
explanation:
  correct:
    en: The tracking configuration is correct, but Azure Repos doesn't support SSH for repositories that contain Git LFS tracked files. The artists must use an HTTPS remote to push and fetch the LFS objects.
    fr: "La configuration du suivi est correcte, mais Azure Repos ne prend pas en charge SSH pour les dépôts qui contiennent des fichiers suivis par Git LFS : les artistes doivent utiliser un dépôt distant HTTPS pour envoyer et récupérer les objets LFS."
references:
  - title: Manage and Store Large Files in Git - Azure Repos
    url: https://learn.microsoft.com/en-us/azure/devops/repos/git/manage-large-files
