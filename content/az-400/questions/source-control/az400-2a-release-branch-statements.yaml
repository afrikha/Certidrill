id: az400-2a-release-branch-statements
objective: "2.1.1"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Northwind follows the Git branching guidance of Azure Repos for an application that is released at the end of each sprint. The team uses feature branches, pull requests into `main`, and release branches such as `release/31`.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind applique les recommandations de création de branches Git d'Azure Repos pour une application mise en production à la fin de chaque sprint. L'équipe utilise des branches de fonctionnalité, des pull requests vers `main` et des branches de mise en production comme `release/31`.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          A release branch is long-lived and is not merged back into main through a pull request.
        fr: |
          Une branche de mise en production est de longue durée et n'est pas refusionnée dans main par une pull request.
    - id: s2
      text:
        en: |
          To bring a fix made in release/31 into main, the guidance recommends merging release/31 into main.
        fr: |
          Pour reporter dans main un correctif apporté à release/31, les recommandations préconisent de fusionner release/31 dans main.
    - id: s3
      text:
        en: |
          When the team stops supporting a release, the guidance recommends locking its release branch.
        fr: |
          Quand l'équipe cesse de prendre en charge une version, les recommandations préconisent de verrouiller sa branche de mise en production.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |
      Release branches coordinate and stabilize a release; unlike feature branches, they live long and are not merged into main by pull request. Fixes are ported to main by cherry-picking into a new branch from main, because merging the release branch could bring release-specific changes. A release branch is locked once the release is no longer supported.
    fr: |
      Les branches de mise en production coordonnent et stabilisent une version ; contrairement aux branches de fonctionnalité, elles sont de longue durée et ne sont pas fusionnées dans main par pull request. Les correctifs sont reportés dans main par cherry-pick dans une nouvelle branche créée à partir de main, car fusionner la branche de mise en production pourrait importer des changements propres à cette version. Une branche de mise en production est verrouillée quand la version n'est plus prise en charge.
references:
  - title: Adopt a Git branching strategy
    url: https://learn.microsoft.com/en-us/azure/devops/repos/git/git-branching-guidance
