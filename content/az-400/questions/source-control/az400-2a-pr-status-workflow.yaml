id: az400-2a-pr-status-workflow
objective: "2.1.2"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    Woodgrove hosts an application in a GitHub repository. Developers work in branches named `feature/<name>` and open pull requests into `main`.

    The branch protection rule of `main` has **Require status checks to pass before merging** enabled, with the `build` job of the following workflow as the required check. You need the workflow to run every time a pull request that targets `main` is opened or updated.

    How should you complete the workflow? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove héberge une application dans un dépôt GitHub. Les développeurs travaillent dans des branches nommées `feature/<name>` et ouvrent des pull requests vers `main`.

    La règle de protection de branche de `main` a **Require status checks to pass before merging** activé, avec le job `build` du workflow suivant comme vérification requise. Le workflow doit s'exécuter chaque fois qu'une pull request ciblant `main` est ouverte ou mise à jour.

    Comment devez-vous compléter le workflow ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: yaml
  template: |
    name: ci
    on:
      [[event]]:
        branches: [ [[branch]] ]
    jobs:
      build:
        runs-on: ubuntu-latest
        steps:
          - uses: actions/checkout@v7
          - run: dotnet test
  slots:
    - id: event
      options:
        - { id: pr, text: pull_request }
        - { id: push, text: push }
        - { id: dispatch, text: workflow_dispatch }
        - { id: release, text: release }
    - id: branch
      options:
        - { id: main, text: main }
        - { id: feature, text: "'feature/**'" }
        - { id: releases, text: "'releases/**'" }
answer:
  values: { event: pr, branch: main }
explanation:
  correct:
    en: |
      The pull_request event runs the workflow when a pull request is opened, reopened or receives new commits, and its result is reported as a status check on the pull request. For pull_request, the branches filter applies to the base branch, the branch the pull request targets, so the filter is main and not the feature branch pattern.
    fr: |
      L'événement pull_request exécute le workflow quand une pull request est ouverte, rouverte ou reçoit de nouveaux commits, et son résultat est signalé comme vérification d'état sur la pull request. Pour pull_request, le filtre branches s'applique à la branche de base, celle que cible la pull request : le filtre est donc main et non le modèle des branches de fonctionnalité.
  options:
    push: { en: "push runs after commits reach a branch; with main it would run only after merging, too late for the check.", fr: "push s'exécute après l'arrivée de commits sur une branche ; avec main, il ne s'exécuterait qu'après la fusion, trop tard pour la vérification." }
    dispatch: { en: "workflow_dispatch runs only when someone starts the workflow manually.", fr: "workflow_dispatch ne s'exécute que lorsque quelqu'un démarre le workflow manuellement." }
    feature: { en: "The branches filter of pull_request matches the target branch, not the source branch.", fr: "Le filtre branches de pull_request correspond à la branche cible, pas à la branche source." }
references:
  - title: Branch protections rules and review requirements
    url: https://learn.microsoft.com/en-us/training/modules/github-enterprise-server-repository-workflows/3-branch-protection-rules
