id: az400-2b-tag-gh-ruleset
objective: "2.2.4"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove Bank uses GitHub Enterprise Cloud. A repository named **payments-api** marks each release with a tag that matches `v*`. Developers have the Write role on the repository, and a team named **release-managers** owns the releases.

    You need to ensure that only members of release-managers can create, update or delete tags that match `v*`. Developers must still be able to create other tags.

    Which two actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove Bank utilise GitHub Enterprise Cloud. Un dépôt nommé **payments-api** marque chaque version avec une balise qui correspond à `v*`. Les développeurs disposent du rôle Write sur le dépôt, et une équipe nommée **release-managers** est responsable des versions.

    Vous devez faire en sorte que seuls les membres de release-managers puissent créer, mettre à jour ou supprimer les balises qui correspondent à `v*`. Les développeurs doivent toujours pouvoir créer d'autres balises.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Create a branch protection rule with the branch name pattern v*.", fr: "Créer une règle de protection de branche avec le modèle de nom de branche v*." } }
    - { id: b, text: { en: "Create a ruleset that targets tags matching v* and enables Restrict creations, Restrict updates and Restrict deletions.", fr: "Créer un ensemble de règles (ruleset) qui cible les balises correspondant à v* et active Restrict creations, Restrict updates et Restrict deletions." } }
    - { id: c, text: { en: "Add a CODEOWNERS entry that assigns the v* pattern to the release-managers team.", fr: "Ajouter une entrée CODEOWNERS qui attribue le modèle v* à l'équipe release-managers." } }
    - { id: d, text: { en: "Add the release-managers team to the bypass list of the ruleset.", fr: "Ajouter l'équipe release-managers à la liste de contournement (bypass list) de l'ensemble de règles." } }
    - { id: e, text: { en: "Change the organization base permission to Read.", fr: "Définir l'autorisation de base de l'organisation sur Read." } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: Rulesets can target tags as well as branches. A tag ruleset that restricts creations, updates and deletions for v* blocks those actions for everyone who is not on its bypass list, so you add release-managers to the bypass list. Tags that do not match v* are not targeted and stay unrestricted.
    fr: |
      Les ensembles de règles peuvent cibler des balises comme des branches. Un ensemble de règles de balises qui restreint les créations, les mises à jour et les suppressions pour v* bloque ces actions pour toute personne absente de sa liste de contournement : vous ajoutez donc release-managers à cette liste. Les balises qui ne correspondent pas à v* ne sont pas ciblées et restent libres.
  options:
    a: { en: "Branch protection rules apply to branches, not to tags.", fr: "Les règles de protection de branche s'appliquent aux branches, pas aux balises." }
    c: { en: "CODEOWNERS requests reviews for changes to file paths; it does not control tags.", fr: "CODEOWNERS demande des révisions pour les modifications de chemins de fichiers ; il ne contrôle pas les balises." }
    e: { en: "Base permissions are overridden by the Write role granted on the repository, and Read would also stop developers from creating other tags.", fr: "L'autorisation de base est remplacée par le rôle Write accordé sur le dépôt, et Read empêcherait aussi les développeurs de créer d'autres balises." }
references:
  - title: Configure GitHub tags to organize repositories
    url: https://learn.microsoft.com/en-us/training/modules/manage-git-repositories/13-configure-github-tags-organize-repositories
