id: az400-cs2a-purge-password
objective: "2.2.6"
type: ordering
caseStudy: az400-cs2a-trey-research
difficulty: 3
status: draft
stem:
  en: |
    You need to meet the requirement for the password committed to labportal. The developers have already stopped pushing to the repository, and you have the Force push permission on it.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Vous devez respecter l'exigence relative au mot de passe commité dans labportal. Les développeurs ont déjà cessé de pousser vers le dépôt, et vous disposez de l'autorisation Force push sur celui-ci.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: revert, text: { en: "Run git revert on the commit that added the file, and push the new commit.", fr: "Exécuter git revert sur le commit qui a ajouté le fichier et pousser le nouveau commit." } }
    - { id: rotate, text: { en: "Change the administrator password of sql-trey-lab.", fr: "Changer le mot de passe administrateur de sql-trey-lab." } }
    - { id: filter, text: { en: "In a fresh clone, run git filter-repo --invert-paths --path src/LabPortal/appsettings.Production.json.", fr: "Dans un nouveau clone, exécuter git filter-repo --invert-paths --path src/LabPortal/appsettings.Production.json." } }
    - { id: ignore, text: { en: "Add appsettings.Production.json to the .gitignore file, and push the change.", fr: "Ajouter appsettings.Production.json au fichier .gitignore et pousser la modification." } }
    - { id: push, text: { en: "Force-push the rewritten branches and tags to labportal.", fr: "Pousser en force les branches et les balises réécrites vers labportal." } }
    - { id: reclone, text: { en: "Ask every developer to delete their local clone and clone labportal again.", fr: "Demander à chaque développeur de supprimer son clone local et de cloner à nouveau labportal." } }
answer:
  sequence: [ rotate, filter, push, reclone ]
explanation:
  correct:
    en: |
      A committed secret must be treated as compromised, so you change the password first to minimize the time it can be used; the old value may already exist in other clones. git filter-repo then rewrites every commit to remove the file, the rewritten history is force-pushed to overwrite the server copy, and developers re-clone so that no local copy reintroduces the old commits.
    fr: |
      Un secret commité doit être considéré comme compromis : vous changez d'abord le mot de passe pour réduire au minimum la durée pendant laquelle il est utilisable, car l'ancienne valeur peut déjà se trouver dans d'autres clones. git filter-repo réécrit ensuite chaque commit pour supprimer le fichier, l'historique réécrit est poussé en force pour remplacer la copie du serveur, et les développeurs clonent à nouveau le dépôt pour qu'aucune copie locale ne réintroduise les anciens commits.
  options:
    revert: { en: "git revert adds a new commit that deletes the file, but the password stays in the earlier commits of the history.", fr: "git revert ajoute un commit qui supprime le fichier, mais le mot de passe reste dans les commits antérieurs de l'historique." }
    ignore: { en: ".gitignore only prevents untracked files from being added; it doesn't remove a file that is already in the history.", fr: ".gitignore empêche seulement l'ajout de fichiers non suivis ; il ne supprime pas un fichier déjà présent dans l'historique." }
references:
  - title: Purge repository data
    url: https://learn.microsoft.com/en-us/training/modules/manage-git-repositories/3-purge-repository-data
  - title: Remove Large Binaries from Your Git History
    url: https://learn.microsoft.com/en-us/azure/devops/repos/git/remove-binaries
