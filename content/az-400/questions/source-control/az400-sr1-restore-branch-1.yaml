id: az400-sr1-restore-branch-1
objective: "2.2.5"
type: series_yesno
series: az400-sr1-restore-branch
seriesOrder: 1
difficulty: 2
status: draft
stem:
  en: You clone Billing, use git reflog to find the last commit of release/3.1, and push the branch.
  fr: Vous clonez Billing, utilisez git reflog pour trouver le dernier commit de release/3.1 et poussez la branche.
body:
  solution:
    en: |
      You run `git clone` to create a new local clone of Billing, run `git reflog` to find the last commit of release/3.1, create the branch on that commit, and run `git push origin release/3.1`. You then add the two branch policies to release/3.1.
    fr: |
      Vous exécutez `git clone` pour créer un nouveau clone local de Billing, exécutez `git reflog` pour trouver le dernier commit de release/3.1, créez la branche sur ce commit et exécutez `git push origin release/3.1`. Vous ajoutez ensuite les deux stratégies de branche à release/3.1.
answer: { value: false }
explanation:
  correct:
    en: The reflog records the movements of references in the local repository only. A new clone has never had release/3.1, and it does not download commits that are reachable only from a deleted branch, so the commit cannot be found this way. Azure Repos keeps deleted branches, which can be restored from the Branches view.
    fr: "Le reflog enregistre uniquement les déplacements des références du dépôt local. Un nouveau clone n'a jamais eu release/3.1 et ne télécharge pas les commits accessibles uniquement depuis une branche supprimée : le commit est introuvable de cette façon. Azure Repos conserve les branches supprimées, qui peuvent être restaurées depuis la vue Branches."
references:
  - title: Restore a deleted Git branch from the web portal
    url: https://learn.microsoft.com/en-us/azure/devops/repos/git/restore-deleted-branch
