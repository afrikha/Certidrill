id: az400-cs2a-main-policies
objective: "2.1.2"
type: multi
caseStudy: az400-cs2a-trey-research
difficulty: 2
status: draft
stem:
  en: |
    You need to configure the main branch of labportal to meet the pull request requirement.

    Which two branch policy settings should you configure? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez configurer la branche main de labportal pour respecter l'exigence relative aux pull requests.

    Quels sont les deux paramètres de stratégie de branche à configurer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Check for linked work items, set to Required", fr: "Check for linked work items, défini sur Required" } }
    - { id: b, text: { en: "Check for comment resolution, set to Required", fr: "Check for comment resolution, défini sur Required" } }
    - { id: c, text: { en: "Require a minimum number of reviewers, with Prohibit the most recent pusher from approving their own changes", fr: "Require a minimum number of reviewers, avec Prohibit the most recent pusher from approving their own changes" } }
    - { id: d, text: { en: "Automatically included reviewers, with the QA lead added as an optional reviewer", fr: "Automatically included reviewers, avec le responsable QA ajouté comme relecteur facultatif" } }
    - { id: e, text: { en: "Limit merge types, with only Squash merge allowed", fr: "Limit merge types, avec uniquement Squash merge autorisé" } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |
      The Check for linked work items policy, when set to Required, blocks the completion of any pull request that has no linked work item. The Require a minimum number of reviewers policy with Prohibit the most recent pusher from approving their own changes makes sure that the person who pushed the latest changes can't count as the approver.
    fr: |
      La stratégie Check for linked work items, définie sur Required, bloque l'achèvement de toute pull request qui n'est liée à aucun élément de travail. La stratégie Require a minimum number of reviewers avec Prohibit the most recent pusher from approving their own changes garantit que la personne qui a poussé les dernières modifications ne compte pas comme approbateur.
  options:
    b: { en: "Comment resolution only requires that all comments be resolved; it doesn't link work items or control who approves.", fr: "La résolution des commentaires exige seulement que tous les commentaires soient résolus ; elle ne lie pas d'éléments de travail et ne contrôle pas qui approuve." }
    d: { en: "An optional reviewer is only added to the pull request; their vote isn't required and the pusher could still approve.", fr: "Un relecteur facultatif est seulement ajouté à la pull request ; son vote n'est pas exigé et l'auteur de la dernière poussée pourrait toujours approuver." }
    e: { en: "Limiting merge types shapes the history of main but doesn't enforce work item links or reviewer rules.", fr: "Limiter les types de fusion façonne l'historique de main mais n'impose ni lien vers un élément de travail ni règle de relecture." }
references:
  - title: Set and manage branch policies
    url: https://learn.microsoft.com/en-us/azure/devops/repos/git/branch-policies
