id: az400-2a-checkout-lfs
objective: "2.2.1"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    Litware stores product images in Git LFS. The same repository is built by an Azure Pipelines YAML pipeline and by a GitHub Actions workflow.

    Both builds fail because the image files in the working directory contain pointer text instead of the images. You need both builds to download the Git LFS content when they check out the repository.

    How should you complete the checkout steps? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware stocke des images de produits dans Git LFS. Le même dépôt est construit par un pipeline YAML Azure Pipelines et par un workflow GitHub Actions.

    Les deux builds échouent, car les fichiers images du répertoire de travail contiennent un texte de pointeur au lieu des images. Les deux builds doivent télécharger le contenu Git LFS lorsqu'ils extraient le dépôt.

    Comment devez-vous compléter les étapes d'extraction ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: yaml
  template: |
    # Azure Pipelines
    steps:
    - checkout: self
      [[azp]]

    # GitHub Actions
    steps:
      - uses: actions/checkout@v7
        with:
          [[gha]]
  slots:
    - id: azp
      options:
        - { id: lfs, text: "lfs: true" }
        - { id: submodules, text: "submodules: true" }
        - { id: depth, text: "fetchDepth: 0" }
        - { id: persist, text: "persistCredentials: true" }
    - id: gha
      options:
        - { id: lfs, text: "lfs: true" }
        - { id: submodules, text: "submodules: true" }
        - { id: depth, text: "fetch-depth: 0" }
        - { id: persist, text: "persist-credentials: true" }
answer:
  values: { azp: lfs, gha: lfs }
explanation:
  correct:
    en: |
      Both checkout implementations skip Git LFS content by default. In Azure Pipelines, the checkout step downloads LFS files when lfs is true; self-hosted agents need git-lfs installed. In GitHub Actions, the actions/checkout action has an lfs input whose default is false.
    fr: |
      Les deux mécanismes d'extraction ignorent le contenu Git LFS par défaut. Dans Azure Pipelines, l'étape checkout télécharge les fichiers LFS quand lfs vaut true ; les agents auto-hébergés ont besoin de git-lfs installé. Dans GitHub Actions, l'action actions/checkout a une entrée lfs dont la valeur par défaut est false.
  options:
    submodules: { en: "Submodules are separate repositories; this setting doesn't download LFS content.", fr: "Les sous-modules sont des dépôts distincts ; ce paramètre ne télécharge pas le contenu LFS." }
    depth: { en: "Fetching the full history doesn't replace pointer files with LFS content.", fr: "Récupérer tout l'historique ne remplace pas les fichiers pointeurs par le contenu LFS." }
    persist: { en: "Keeping the token in the Git configuration doesn't download LFS content.", fr: "Conserver le jeton dans la configuration Git ne télécharge pas le contenu LFS." }
references:
  - title: steps.checkout definition
    url: https://learn.microsoft.com/en-us/azure/devops/pipelines/yaml-schema/steps-checkout
  - title: Pipeline options for Git repositories
    url: https://learn.microsoft.com/en-us/azure/devops/pipelines/repos/pipeline-options-for-git
