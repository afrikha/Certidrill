id: az400-2b-remove-filter-repo
objective: "2.2.6"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Contoso has a GitHub repository named **inventory-api**. Months ago, a developer committed a code-signing certificate at the path **config/keys/signing.pfx**. The certificate has already been revoked and replaced, but security policy requires that the file be removed from every commit of every branch and tag.

    You use git-filter-repo 2.47 and run the following commands.

    How should you complete the commands? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso dispose d'un dépôt GitHub nommé **inventory-api**. Il y a plusieurs mois, un développeur a commité un certificat de signature de code au chemin **config/keys/signing.pfx**. Le certificat a déjà été révoqué et remplacé, mais la stratégie de sécurité exige que le fichier soit supprimé de tous les commits de toutes les branches et balises.

    Vous utilisez git-filter-repo 2.47 et vous exécutez les commandes suivantes.

    Comment devez-vous compléter les commandes ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: bash
  template: |
    git clone https://github.com/contoso/inventory-api
    cd inventory-api
    git-filter-repo --sensitive-data-removal [[mode]] --path [[path]]
    git push [[push]] origin
  slots:
    - id: mode
      options:
        - { id: replace, text: "--replace-text" }
        - { id: invert, text: "--invert-paths" }
        - { id: rename, text: "--path-rename" }
        - { id: strip, text: "--strip-blobs-bigger-than" }
    - id: path
      options:
        - { id: name, text: signing.pfx }
        - { id: partial, text: keys/signing.pfx }
        - { id: full, text: config/keys/signing.pfx }
    - id: push
      options:
        - { id: tags, text: "--tags" }
        - { id: follow, text: "--follow-tags" }
        - { id: upstream, text: "--set-upstream" }
        - { id: mirror, text: "--force --mirror" }
answer:
  values: { mode: invert, path: full, push: mirror }
explanation:
  correct:
    en: "`--path` selects the file by its full path from the repository root, and `--invert-paths` keeps everything except that path, so the file is removed from every commit. The rewritten branches and tags must then replace the remote history, which `git push --force --mirror origin` does."
    fr: "`--path` sélectionne le fichier par son chemin complet depuis la racine du dépôt, et `--invert-paths` conserve tout sauf ce chemin : le fichier est supprimé de tous les commits. Les branches et balises réécrites doivent ensuite remplacer l'historique distant, ce que fait `git push --force --mirror origin`."
  options:
    replace: { en: "--replace-text replaces strings listed in a file; it does not remove a path.", fr: "--replace-text remplace des chaînes listées dans un fichier ; il ne supprime pas de chemin." }
    name: { en: "git-filter-repo matches the full Git path, not just the file name.", fr: "git-filter-repo compare le chemin Git complet, pas seulement le nom du fichier." }
    tags: { en: "--tags pushes tags without force, so the rewritten branches are not pushed and rewritten tags are rejected.", fr: "--tags pousse les balises sans forcer : les branches réécrites ne sont pas poussées et les balises réécrites sont rejetées." }
references:
  - title: Clean up repository data
    url: https://learn.microsoft.com/en-us/training/modules/manage-git-repositories/7-purge-repository-data
