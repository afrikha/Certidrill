id: az400-2a-max-file-size-policy
objective: "2.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Adatum has an Azure Repos repository named **Analytics**. Developers sometimes commit large data extracts by mistake, which makes every clone slower.

    You need to ensure that any push to Analytics that contains a new or updated file larger than 10 MB is rejected, whatever the branch and whether or not a pull request is used. The solution must minimize administrative effort.

    What should you configure?
  fr: |
    Adatum dispose d'un dépôt Azure Repos nommé **Analytics**. Les développeurs valident parfois par erreur de gros extraits de données, ce qui ralentit chaque clonage.

    Vous devez vous assurer que tout envoi vers Analytics qui contient un fichier nouveau ou modifié de plus de 10 Mo est rejeté, quelle que soit la branche et qu'une pull request soit utilisée ou non. La solution doit réduire au minimum l'effort d'administration.

    Que devez-vous configurer ?
body:
  options:
    - id: a
      text: { en: "The File path validation repository policy, with a pattern for data file extensions", fr: "La stratégie de dépôt File path validation, avec un modèle pour les extensions de fichiers de données" }
    - id: b
      text: { en: "The Maximum file size repository policy, set to 10 MB", fr: "La stratégie de dépôt Maximum file size, définie sur 10 Mo" }
    - id: c
      text: { en: "A Build validation branch policy on main that runs a script to check file sizes", fr: "Une stratégie de branche Build validation sur main qui exécute un script de vérification de la taille des fichiers" }
    - id: d
      text: { en: "A .gitattributes file that tracks data file extensions with Git LFS", fr: "Un fichier .gitattributes qui suit les extensions de fichiers de données avec Git LFS" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      The Maximum file size repository policy blocks a push that contains a new or updated file larger than the configured limit, on every branch. The user must then rewrite the unpushed history to remove the large file before pushing again.
    fr: |
      La stratégie de dépôt Maximum file size bloque un envoi qui contient un fichier nouveau ou modifié plus grand que la limite configurée, sur toutes les branches. L'utilisateur doit alors réécrire l'historique non envoyé pour retirer le gros fichier avant de renvoyer.
  options:
    a: { en: "File path validation blocks paths that match a pattern, whatever their size, and misses large files with other extensions.", fr: "File path validation bloque les chemins qui correspondent à un modèle, quelle que soit leur taille, et laisse passer les gros fichiers d'autres extensions." }
    c: { en: "A branch policy only applies to pull requests into main; direct pushes to other branches would not be checked.", fr: "Une stratégie de branche ne s'applique qu'aux pull requests vers main ; les envois directs vers d'autres branches ne seraient pas vérifiés." }
    d: { en: ".gitattributes only works on clients that have Git LFS installed and doesn't reject anything.", fr: ".gitattributes ne fonctionne que sur les clients où Git LFS est installé et ne rejette rien." }
references:
  - title: Set Git repository settings and policies
    url: https://learn.microsoft.com/en-us/azure/devops/repos/git/repository-settings
