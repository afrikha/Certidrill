id: az400-cs2c-required-ci
objective: "2.1.3"
type: single
caseStudy: az400-cs2c-fourth-coffee
difficulty: 1
status: draft
stem:
  en: |
    order-api-ci has already run several times on pull requests of order-api.

    You need to meet the requirement for pull requests into main. What should you do?
  fr: |
    order-api-ci s'est déjà exécuté plusieurs fois sur des pull requests d'order-api.

    Vous devez respecter l'exigence relative aux pull requests vers main. Que devez-vous faire ?
body:
  options:
    - id: a
      text:
        en: "In Azure DevOps, add a build validation branch policy on main that runs order-api-ci."
        fr: "Dans Azure DevOps, ajouter sur main une stratégie de branche de validation de build qui exécute order-api-ci."
    - id: b
      text:
        en: "In the order-api-ci YAML file, add a pr trigger that includes the main branch."
        fr: "Dans le fichier YAML d'order-api-ci, ajouter un déclencheur pr qui inclut la branche main."
    - id: c
      text:
        en: "In Azure DevOps, add an Approvals check on the production environment for the CI owners."
        fr: "Dans Azure DevOps, ajouter une vérification Approbations sur l'environnement production pour les responsables de la CI."
    - id: d
      text:
        en: "In GitHub, add a branch protection rule on main that requires the order-api-ci status check."
        fr: "Dans GitHub, ajouter sur main une règle de protection de branche qui exige la vérification d'état order-api-ci."
answer: { optionId: d }
explanation:
  correct:
    en: The repository is in GitHub, so merges are controlled by GitHub branch protection. Because order-api-ci uses the Azure Pipelines GitHub App and has already run, it appears in the status checks list, and requiring it blocks the merge until the pipeline succeeds.
    fr: |
      Le dépôt est dans GitHub : les fusions sont donc contrôlées par la protection de branche GitHub. Comme order-api-ci utilise l'application GitHub Azure Pipelines et s'est déjà exécuté, il apparaît dans la liste des vérifications d'état, et l'exiger bloque la fusion jusqu'à la réussite du pipeline.
  options:
    a: { en: "Azure DevOps branch policies apply only to Azure Repos Git repositories, not to a GitHub repository.", fr: "Les stratégies de branche Azure DevOps ne s'appliquent qu'aux dépôts Git Azure Repos, pas à un dépôt GitHub." }
    b: { en: "A pr trigger runs the pipeline on pull requests, but nothing prevents the merge when the run fails.", fr: "Un déclencheur pr exécute le pipeline sur les pull requests, mais rien n'empêche la fusion si l'exécution échoue." }
    c: { en: "An environment check gates deployment stages that target production; it has no effect on merging pull requests.", fr: "Une vérification d'environnement contrôle les phases de déploiement qui ciblent production ; elle n'a aucun effet sur la fusion des pull requests." }
references:
  - title: Build GitHub repositories
    url: https://learn.microsoft.com/en-us/azure/devops/pipelines/repos/github
