id: az400-2b-remove-tool-map
objective: "2.2.6"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Adatum manages several Git repositories in Azure Repos. You have the following requirements.

    Which command or feature should you use for each requirement? To answer, drag the appropriate commands or features to the correct requirements. Each command or feature may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum gère plusieurs dépôts Git dans Azure Repos. Vous avez les exigences suivantes.

    Quelle commande ou fonctionnalité devez-vous utiliser pour chaque exigence ? Pour répondre, faites glisser les commandes ou fonctionnalités appropriées vers les exigences correspondantes. Chaque commande ou fonctionnalité peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: strip, text: "git filter-repo --strip-blobs-bigger-than 50M" }
    - { id: replace, text: "git filter-repo --replace-text expressions.txt" }
    - { id: bfg, text: "bfg --delete-folders dumps" }
    - id: push
      text: { en: "Secret scanning push protection (GitHub Secret Protection for Azure DevOps)", fr: "Protection push de l'analyse des secrets (GitHub Secret Protection for Azure DevOps)" }
    - { id: revert, text: "git revert <commit>" }
    - { id: lfs, text: "git lfs track \"*.mp4\"" }
  targets:
    - id: t1
      text: { en: "Remove every file larger than 50 MB from all the commits of the history", fr: "Supprimer de tous les commits de l'historique chaque fichier de plus de 50 Mo" }
    - id: t2
      text: { en: "Replace a leaked password with a placeholder in every commit of the history", fr: "Remplacer un mot de passe divulgué par une valeur d'espace réservé dans chaque commit de l'historique" }
    - id: t3
      text: { en: "Delete a folder named dumps from all the commits of the history", fr: "Supprimer un dossier nommé dumps de tous les commits de l'historique" }
    - id: t4
      text: { en: "Block pushes that contain high-confidence secrets", fr: "Bloquer les push qui contiennent des secrets à haut niveau de confiance" }
answer:
  mapping: { t1: strip, t2: replace, t3: bfg, t4: push }
explanation:
  correct:
    en: "git filter-repo rewrites history: `--strip-blobs-bigger-than` removes large blobs and `--replace-text` replaces the strings listed in a file. BFG Repo-Cleaner can delete files or folders from every commit with options such as `--delete-folders`. Push protection, part of GitHub Secret Protection for Azure DevOps, scans incoming pushes and blocks those that contain high-confidence secrets."
    fr: "git filter-repo réécrit l'historique : `--strip-blobs-bigger-than` supprime les objets blob volumineux et `--replace-text` remplace les chaînes listées dans un fichier. BFG Repo-Cleaner peut supprimer des fichiers ou des dossiers de chaque commit avec des options comme `--delete-folders`. La protection push, incluse dans GitHub Secret Protection for Azure DevOps, analyse les push entrants et bloque ceux qui contiennent des secrets à haut niveau de confiance."
  options:
    revert: { en: "A revert adds a new commit and leaves the data in the earlier commits.", fr: "Une annulation (revert) ajoute un nouveau commit et laisse les données dans les commits antérieurs." }
    lfs: { en: "git lfs track only affects files added from now on; it does not remove anything from the history.", fr: "git lfs track ne concerne que les fichiers ajoutés à partir de maintenant ; il ne supprime rien de l'historique." }
references:
  - title: Clean up repository data
    url: https://learn.microsoft.com/en-us/training/modules/manage-git-repositories/7-purge-repository-data
  - title: Set up secret scanning
    url: https://learn.microsoft.com/en-us/azure/devops/repos/security/github-advanced-security-secret-scanning
