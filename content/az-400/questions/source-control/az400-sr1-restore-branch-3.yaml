id: az400-sr1-restore-branch-3
objective: "2.2.5"
type: series_yesno
series: az400-sr1-restore-branch
seriesOrder: 3
difficulty: 2
status: draft
stem:
  en: You restore the branch from the Branches view and then add the two branch policies again.
  fr: Vous restaurez la branche depuis la vue Branches, puis ajoutez de nouveau les deux stratégies de branche.
body:
  solution:
    en: |
      In the **Branches** view of Billing, you search for `release/3.1`, select **Search for exact match in deleted branches**, and select **Restore branch**. You then configure release/3.1 to require a minimum of two reviewers and add a build validation policy that runs billing-ci.
    fr: |
      Dans la vue **Branches** de Billing, vous recherchez `release/3.1`, sélectionnez **Search for exact match in deleted branches** et sélectionnez **Restore branch**. Vous configurez ensuite release/3.1 pour exiger un nombre minimal de deux réviseurs et ajoutez une stratégie de validation de build qui exécute billing-ci.
answer: { value: true }
explanation:
  correct:
    en: Azure Repos keeps deleted branches with no retention limit, and Restore branch recreates release/3.1 at the commit it pointed to when it was deleted. Because policies are not restored with the branch, adding the two policies again returns release/3.1 to its previous protection.
    fr: "Azure Repos conserve les branches supprimées sans limite de rétention, et Restore branch recrée release/3.1 sur le commit vers lequel elle pointait lors de sa suppression. Comme les stratégies ne sont pas restaurées avec la branche, l'ajout des deux stratégies rétablit la protection précédente de release/3.1."
references:
  - title: Restore a deleted Git branch from the web portal
    url: https://learn.microsoft.com/en-us/azure/devops/repos/git/restore-deleted-branch
