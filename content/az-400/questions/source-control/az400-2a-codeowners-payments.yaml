id: az400-2a-codeowners-payments
objective: "2.1.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam has a GitHub repository in an organization. The repository contains a `payments/` folder. A team named **payments-team** has the Write role on the repository. A branch protection rule on `main` already requires a pull request before merging.

    You need to ensure that every pull request into `main` that changes a file in `payments/` is approved by a member of payments-team before it can be merged.

    Which two actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam dispose d'un dépôt GitHub dans une organisation. Le dépôt contient un dossier `payments/`. Une équipe nommée **payments-team** a le rôle Write sur le dépôt. Une règle de protection de branche sur `main` exige déjà une pull request avant la fusion.

    Vous devez vous assurer que chaque pull request vers `main` qui modifie un fichier de `payments/` est approuvée par un membre de payments-team avant de pouvoir être fusionnée.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Add a .github/CODEOWNERS file to the main branch that assigns /payments/ to @fabrikam/payments-team.", fr: "Ajouter à la branche main un fichier .github/CODEOWNERS qui attribue /payments/ à @fabrikam/payments-team." } }
    - { id: b, text: { en: "Add a .github/CODEOWNERS file only to each feature branch that changes /payments/.", fr: "Ajouter un fichier .github/CODEOWNERS uniquement dans chaque branche de fonctionnalité qui modifie /payments/." } }
    - { id: c, text: { en: "Enable Require review from Code Owners in the branch protection rule for main.", fr: "Activer Require review from Code Owners dans la règle de protection de branche de main." } }
    - { id: d, text: { en: "Enable Require conversation resolution before merging in the branch protection rule for main.", fr: "Activer Require conversation resolution before merging dans la règle de protection de branche de main." } }
    - { id: e, text: { en: "Change the role of payments-team on the repository from Write to Triage.", fr: "Remplacer le rôle de payments-team sur le dépôt, Write, par Triage." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |
      A CODEOWNERS file in .github/, the root or docs/ maps paths to owners, and GitHub reads the file on the base branch of the pull request, here main. Owners are only required to approve when the branch protection rule enables Require review from Code Owners; an approval from any listed owner then satisfies the rule.
    fr: |
      Un fichier CODEOWNERS placé dans .github/, à la racine ou dans docs/ associe des chemins à des propriétaires, et GitHub lit le fichier de la branche de base de la pull request, ici main. L'approbation des propriétaires n'est exigée que si la règle de protection de branche active Require review from Code Owners ; l'approbation de n'importe quel propriétaire listé satisfait alors la règle.
  options:
    b: { en: "Code owners are taken from the CODEOWNERS file of the base branch, not from the pull request branch.", fr: "Les propriétaires de code sont lus dans le fichier CODEOWNERS de la branche de base, pas dans celui de la branche de la pull request." }
    d: { en: "Conversation resolution doesn't require any approval from a specific team.", fr: "La résolution des conversations n'exige aucune approbation d'une équipe précise." }
    e: { en: "Code owners must have write permission on the repository; Triage would prevent the team from being a code owner.", fr: "Les propriétaires de code doivent avoir l'autorisation d'écriture sur le dépôt ; Triage empêcherait l'équipe d'être propriétaire de code." }
references:
  - title: Branch protections rules and review requirements
    url: https://learn.microsoft.com/en-us/training/modules/github-enterprise-server-repository-workflows/3-branch-protection-rules
