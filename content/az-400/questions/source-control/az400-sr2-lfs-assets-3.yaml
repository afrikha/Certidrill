id: az400-sr2-lfs-assets-3
objective: "2.2.1"
type: series_yesno
series: az400-sr2-lfs-assets
seriesOrder: 3
difficulty: 2
status: draft
stem:
  en: You commit the LFS tracking patterns and have artists upload files in the web portal.
  fr: Vous commitez les modèles de suivi LFS et faites téléverser les fichiers par les artistes dans le portail web.
body:
  solution:
    en: |
      You commit a `.gitattributes` file that tracks `*.psd` and `*.fbx` with Git LFS. Instead of installing a Git client extension, the artists add the new files by dragging them into the **Files** view of GameAssets in the Azure DevOps web portal and committing from there.
    fr: |
      Vous commitez un fichier `.gitattributes` qui suit `*.psd` et `*.fbx` avec Git LFS. Au lieu d'installer une extension du client Git, les artistes ajoutent les nouveaux fichiers en les faisant glisser dans la vue **Files** de GameAssets dans le portail web Azure DevOps et en les commitant depuis cette vue.
answer: { value: false }
explanation:
  correct:
    en: Dragging a binary file into the Azure Repos web interface commits the binary itself to the repository, not an LFS pointer, even when `.gitattributes` tracks the extension. The full files would enter the Git history and every clone would grow.
    fr: Faire glisser un fichier binaire dans l'interface web d'Azure Repos commite le fichier binaire lui-même dans le dépôt, et non un pointeur LFS, même si `.gitattributes` suit l'extension. Les fichiers complets entreraient dans l'historique Git et chaque clone grossirait.
references:
  - title: Manage and Store Large Files in Git - Azure Repos
    url: https://learn.microsoft.com/en-us/azure/devops/repos/git/manage-large-files
