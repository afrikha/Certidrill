id: az400-4b-ghas-defender-setup
objective: "4.3.4"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove Bank has a GitHub Enterprise Cloud organization named **woodgrove**. All its repositories have GitHub Advanced Security licenses. The applications are deployed as containers to an Azure Kubernetes Service (AKS) cluster in the Azure subscription **Sub1**, where the Defender CSPM plan is enabled. Woodgrove hasn't connected GitHub to Microsoft Defender for Cloud yet.

    You need the developers to work on a security campaign that contains only the code scanning alerts affecting code that runs in Azure, prioritized by runtime risk. Before the campaign is created, the security team requires proof that Defender for Cloud traces the images in Azure Container Registry and the containers running on the AKS cluster back to their repositories.

    Which three actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Woodgrove Bank dispose d'une organisation GitHub Enterprise Cloud nommée **woodgrove**. Tous ses dépôts disposent de licences GitHub Advanced Security. Les applications sont déployées sous forme de conteneurs dans un cluster Azure Kubernetes Service (AKS) de l'abonnement Azure **Sub1**, où le plan Defender CSPM est activé. Woodgrove n'a pas encore connecté GitHub à Microsoft Defender pour le cloud.

    Vous devez faire travailler les développeurs sur une campagne de sécurité qui ne contient que les alertes d'analyse du code concernant du code exécuté dans Azure, classées par risque d'exécution. Avant la création de la campagne, l'équipe de sécurité exige la preuve que Defender pour le cloud relie les images d'Azure Container Registry et les conteneurs exécutés sur le cluster AKS à leurs dépôts.

    Quelles sont les trois actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - { id: repocampaign, text: { en: "In the Security tab of each repository, create a campaign from the open code scanning alerts.", fr: "Dans l'onglet Security de chaque dépôt, créer une campagne à partir des alertes d'analyse du code ouvertes." } }
    - { id: connector, text: { en: "In Defender for Cloud > Environment settings, add a GitHub environment, authorize it and install the DevOps security GitHub app on woodgrove.", fr: "Dans Defender pour le cloud > Environment settings, ajouter un environnement GitHub, l'autoriser et installer l'application GitHub de sécurité DevOps sur woodgrove." } }
    - { id: campaign, text: { en: "In the woodgrove organization, select Security > Campaigns > Create campaign > From code scanning filters, and select the Runtime Risks filters.", fr: "Dans l'organisation woodgrove, sélectionner Security > Campaigns > Create campaign > From code scanning filters, puis sélectionner les filtres Runtime Risks." } }
    - { id: auditlog, text: { en: "Stream the audit log of woodgrove to a Log Analytics workspace in Sub1.", fr: "Diffuser le journal d'audit de woodgrove vers un espace de travail Log Analytics de Sub1." } }
    - { id: explorer, text: { en: "In Defender for Cloud, run Cloud Security Explorer queries that return the images and running containers mapped to the woodgrove repositories.", fr: "Dans Defender pour le cloud, exécuter des requêtes Cloud Security Explorer qui renvoient les images et les conteneurs en cours d'exécution associés aux dépôts de woodgrove." } }
    - { id: dependabotupd, text: { en: "In the woodgrove organization, enable Dependabot security updates for all repositories.", fr: "Dans l'organisation woodgrove, activer les mises à jour de sécurité Dependabot pour tous les dépôts." } }
    - { id: secreader, text: { en: "Assign the Security Reader role on Sub1 to the developers.", fr: "Attribuer le rôle Security Reader sur Sub1 aux développeurs." } }
answer:
  sequence: [ connector, explorer, campaign ]
explanation:
  correct:
    en: |
      The GitHub Advanced Security integration needs a GitHub connector in Defender for Cloud, GHAS licenses and Defender CSPM. Once the connector exists, Cloud Security Explorer queries validate the code-to-runtime correlation: if they return the scanned images and the running containers, mapping works (results can take up to 24 hours). The runtime risk factors then flow to GitHub, where campaigns are created at the organization level from code scanning filters that include Runtime Risks.
    fr: |
      L'intégration de GitHub Advanced Security exige un connecteur GitHub dans Defender pour le cloud, des licences GHAS et Defender CSPM. Une fois le connecteur créé, des requêtes Cloud Security Explorer valident la corrélation du code à l'exécution : si elles renvoient les images analysées et les conteneurs en cours d'exécution, le mappage fonctionne (les résultats peuvent mettre jusqu'à 24 heures à apparaître). Les facteurs de risque d'exécution remontent alors dans GitHub, où les campagnes se créent au niveau de l'organisation à partir de filtres d'analyse du code qui incluent Runtime Risks.
  options:
    repocampaign: { en: "Campaigns can't be created at the repository level, and this campaign wouldn't filter on runtime risk.", fr: "Les campagnes ne peuvent pas être créées au niveau du dépôt, et cette campagne ne filtrerait pas sur le risque d'exécution." }
    auditlog: { en: "The audit log records activity in the organization; it doesn't provide runtime context to alerts.", fr: "Le journal d'audit enregistre l'activité de l'organisation ; il n'apporte pas de contexte d'exécution aux alertes." }
    dependabotupd: { en: "Security updates open pull requests that fix vulnerable dependencies; they don't map code to runtime or filter code scanning alerts.", fr: "Les mises à jour de sécurité ouvrent des pull requests qui corrigent les dépendances vulnérables ; elles ne relient pas le code à l'exécution et ne filtrent pas les alertes d'analyse du code." }
    secreader: { en: "The developers work in GitHub; they don't need access to Defender for Cloud for the campaign.", fr: "Les développeurs travaillent dans GitHub ; ils n'ont pas besoin d'accéder à Defender pour le cloud pour la campagne." }
references:
  - title: Deploy GitHub Advanced Security integration with Microsoft Defender for Cloud
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/github-advanced-security-deploy
  - title: Connect your GitHub organizations
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/quickstart-onboard-github
