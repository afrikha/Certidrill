id: az400-4b-defender-oauth
objective: "4.3.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Tailspin Toys has an Azure DevOps organization named **tailspin**. An engineer who is a Project Collection Administrator of tailspin, has the Basic access level, and is a Contributor on the Azure subscription **Sub1** creates an Azure DevOps connector in Microsoft Defender for Cloud.

    The connector can't be authorized to access tailspin. You discover that an organization policy of tailspin blocks the connection.

    Which policy should you turn on in tailspin?
  fr: |
    Tailspin Toys dispose d'une organisation Azure DevOps nommée **tailspin**. Un ingénieur qui est Project Collection Administrator de tailspin, dispose du niveau d'accès Basic et a le rôle Contributor sur l'abonnement Azure **Sub1** crée un connecteur Azure DevOps dans Microsoft Defender pour le cloud.

    Le connecteur ne peut pas être autorisé à accéder à tailspin. Vous découvrez qu'une stratégie de l'organisation tailspin bloque la connexion.

    Quelle stratégie devez-vous activer dans tailspin ?
body:
  options:
    - { id: a, text: Third-party application access via OAuth }
    - { id: b, text: Allow public projects }
    - { id: c, text: SSH authentication }
    - { id: d, text: Log audit events }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Defender for Cloud connects to Azure DevOps through an OAuth authorization, so **Third-party application access via OAuth** must be on in every organization that you onboard. The engineer already meets the other prerequisites: Project Collection Administrator, Basic access level and Contributor on the subscription.
    fr: |
      Defender pour le cloud se connecte à Azure DevOps par une autorisation OAuth : **Third-party application access via OAuth** doit donc être activé dans chaque organisation intégrée. L'ingénieur remplit déjà les autres prérequis : Project Collection Administrator, niveau d'accès Basic et Contributor sur l'abonnement.
  options:
    b: { en: "Public projects make projects visible to anonymous users; the connector doesn't need them.", fr: "Les projets publics rendent des projets visibles par les utilisateurs anonymes ; le connecteur n'en a pas besoin." }
    c: { en: "SSH authentication controls Git access with SSH keys, not application authorization.", fr: "SSH authentication contrôle l'accès Git par clés SSH, pas l'autorisation des applications." }
    d: { en: "Auditing records events of the organization; it doesn't block or allow connections.", fr: "L'audit enregistre les événements de l'organisation ; il ne bloque ni n'autorise les connexions." }
references:
  - title: Connect your Azure DevOps organizations
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/quickstart-onboard-devops
