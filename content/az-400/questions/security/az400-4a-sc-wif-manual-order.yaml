id: az400-4a-sc-wif-manual-order
objective: "4.1.3"
type: ordering
difficulty: 3
status: draft
stem:
  en: |
    At Northwind, the automatic creation of Azure Resource Manager service connections fails because the Azure DevOps users aren't allowed to create service principals.

    You need to create a service connection named **sc-nw-prod** that authenticates by using workload identity federation with a new user-assigned managed identity, and that can deploy to a resource group named **rg-nw-prod**.

    Which five actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Chez Northwind, la création automatique de connexions de service Azure Resource Manager échoue, car les utilisateurs d'Azure DevOps ne sont pas autorisés à créer des principaux de service.

    Vous devez créer une connexion de service nommée **sc-nw-prod** qui s'authentifie par la fédération d'identité de charge de travail avec une nouvelle identité managée attribuée par l'utilisateur, et qui peut déployer dans un groupe de ressources nommé **rg-nw-prod**.

    Quelles sont les cinq actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 5
  actions:
    - { id: mi, text: { en: "Create a user-assigned managed identity and copy its client ID, tenant ID and subscription ID.", fr: "Créer une identité managée attribuée par l'utilisateur et copier son ID client, l'ID de locataire et l'ID d'abonnement." } }
    - { id: sc, text: { en: "In Azure DevOps, create sc-nw-prod with the manual option and workload identity federation, enter the IDs, copy the issuer and the subject identifier, and keep the connection as a draft.", fr: "Dans Azure DevOps, créer sc-nw-prod avec l'option manuelle et la fédération d'identité de charge de travail, saisir les ID, copier l'émetteur et l'identificateur du sujet, puis conserver la connexion comme brouillon." } }
    - { id: fic, text: { en: "Add a federated credential to the managed identity by using the Other issuer scenario, the copied issuer and the explicit subject identifier.", fr: "Ajouter une information d'identification fédérée à l'identité managée avec le scénario Other issuer, l'émetteur copié et l'identificateur de sujet explicite." } }
    - { id: role, text: { en: "Assign the managed identity a role, such as Contributor, on rg-nw-prod.", fr: "Attribuer à l'identité managée un rôle, par exemple Contributor, sur rg-nw-prod." } }
    - { id: verify, text: { en: "In Azure DevOps, select Finish setup, and then select Verify and save.", fr: "Dans Azure DevOps, sélectionner Finish setup, puis Verify and save." } }
    - { id: secret, text: { en: "Create a client secret for the managed identity and paste it into sc-nw-prod.", fr: "Créer un secret client pour l'identité managée et le coller dans sc-nw-prod." } }
    - { id: convert, text: { en: "Select Convert on sc-nw-prod to switch it to workload identity federation.", fr: "Sélectionner Convert sur sc-nw-prod pour la faire passer à la fédération d'identité de charge de travail." } }
answer:
  sequence: [ mi, sc, fic, role, verify ]
explanation:
  correct:
    en: |
      The identity must exist before the connection can reference its IDs. Azure DevOps then generates the issuer and subject identifier, which you copy into a federated credential of the managed identity so that it trusts the tokens of sc-nw-prod. After the identity receives a role on rg-nw-prod, Verify and save checks the whole chain. Microsoft Learn says to follow these steps in this order.
    fr: |
      L'identité doit exister avant que la connexion puisse référencer ses ID. Azure DevOps génère ensuite l'émetteur et l'identificateur du sujet, que vous copiez dans une information d'identification fédérée de l'identité managée afin qu'elle approuve les jetons de sc-nw-prod. Une fois que l'identité a reçu un rôle sur rg-nw-prod, Verify and save vérifie l'ensemble de la chaîne. Microsoft Learn indique de suivre ces étapes dans cet ordre.
  options:
    secret:
      en: |
        A managed identity has no client secret, and workload identity federation exists precisely to avoid secrets.
      fr: |
        Une identité managée n'a pas de secret client, et la fédération d'identité de charge de travail sert justement à éviter les secrets.
    convert:
      en: |
        Convert applies to an existing connection that Azure DevOps created automatically; sc-nw-prod is created with federation from the start.
      fr: |
        Convert s'applique à une connexion existante créée automatiquement par Azure DevOps ; sc-nw-prod est créée avec la fédération dès le départ.
references:
  - title: Set a Resource Manager workload identity service connection
    url: https://learn.microsoft.com/en-us/azure/devops/pipelines/release/configure-workload-identity
