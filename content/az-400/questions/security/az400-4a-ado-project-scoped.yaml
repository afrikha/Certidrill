id: az400-4a-ado-project-scoped
objective: "4.1.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Wingtip's Azure DevOps organization contains 12 projects. Twenty external testers are added to a project named **Mobile** only.

    In the web portal, the testers must not see the other projects or the organization's user lists, and the people picker must suggest only people from Mobile. The solution must minimize administrative effort.

    What should you do?
  fr: |
    L'organisation Azure DevOps de Wingtip contient 12 projets. Vingt testeurs externes sont ajoutés au seul projet **Mobile**.

    Dans le portail web, les testeurs ne doivent voir ni les autres projets ni les listes d'utilisateurs de l'organisation, et le sélecteur de personnes ne doit proposer que des personnes de Mobile. La solution doit réduire au minimum l'effort d'administration.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Assign the Stakeholder access level to the testers so that they see only the projects they belong to.", fr: "Attribuer le niveau d'accès Stakeholder aux testeurs pour qu'ils ne voient que les projets dont ils sont membres." } }
    - { id: b, text: { en: "Add the testers to the Readers group of Mobile instead of the Contributors group of Mobile.", fr: "Ajouter les testeurs au groupe Readers de Mobile au lieu du groupe Contributors de Mobile." } }
    - { id: c, text: { en: "Set View project-level information to Deny for the testers in each of the other 11 projects.", fr: "Définir View project-level information sur Deny pour les testeurs dans chacun des 11 autres projets." } }
    - { id: d, text: { en: "Enable the Limit user visibility and collaboration to specific projects feature and add the testers to Project-Scoped Users.", fr: "Activer la fonctionnalité Limit user visibility and collaboration to specific projects et ajouter les testeurs à Project-Scoped Users." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      By default, users can view all organization and project information. The Limit user visibility and collaboration to specific projects preview feature restricts the members of Project-Scoped Users to the projects they are added to, hides user lists in Organization settings, and scopes people picker and @mention suggestions to their project. The restriction applies to the web portal only.
    fr: |
      Par défaut, les utilisateurs peuvent consulter toutes les informations de l'organisation et des projets. La fonctionnalité en préversion Limit user visibility and collaboration to specific projects limite les membres de Project-Scoped Users aux projets auxquels ils sont ajoutés, masque les listes d'utilisateurs dans Organization settings et limite les suggestions du sélecteur de personnes et des @mentions à leur projet. La restriction ne s'applique qu'au portail web.
  options:
    a:
      en: |
        An access level decides which features a user can use, not which projects or users they can see.
      fr: |
        Un niveau d'accès détermine les fonctionnalités qu'un utilisateur peut utiliser, pas les projets ni les utilisateurs qu'il peut voir.
    b:
      en: |
        Readers limits what the testers can change in Mobile, but it doesn't hide the organization's user lists or limit the people picker, and it blocks their work.
      fr: |
        Readers limite ce que les testeurs peuvent modifier dans Mobile, mais ne masque pas les listes d'utilisateurs de l'organisation, ne limite pas le sélecteur de personnes et bloque leur travail.
    c:
      en: |
        Eleven sets of explicit Deny assignments are hard to maintain, must be repeated for every new project, and don't hide user lists or limit the people picker.
      fr: |
        Onze ensembles d'attributions Deny explicites sont difficiles à maintenir, doivent être répétés pour chaque nouveau projet et ne masquent ni les listes d'utilisateurs ni ne limitent le sélecteur de personnes.
references:
  - title: Manage your organization or collection
    url: https://learn.microsoft.com/en-us/azure/devops/user-guide/manage-organization-collection
