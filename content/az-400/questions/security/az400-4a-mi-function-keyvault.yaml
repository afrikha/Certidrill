id: az400-4a-mi-function-keyvault
objective: "4.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso has an Azure Functions app named **func-orders** that reads connection strings from an Azure key vault named **kv-orders**. func-orders is the only workload that needs this access.

    You need to configure the identity that func-orders uses to access kv-orders. The solution must meet the following requirements:

    - The team must not store or rotate any credential.
    - The identity must be deleted automatically when func-orders is deleted.

    What should you use?
  fr: |
    Contoso dispose d'une application Azure Functions nommée **func-orders** qui lit des chaînes de connexion dans un coffre de clés Azure nommé **kv-orders**. func-orders est la seule charge de travail qui a besoin de cet accès.

    Vous devez configurer l'identité que func-orders utilise pour accéder à kv-orders. La solution doit répondre aux exigences suivantes :

    - L'équipe ne doit stocker ni renouveler aucune information d'identification.
    - L'identité doit être supprimée automatiquement lorsque func-orders est supprimée.

    Que devez-vous utiliser ?
body:
  options:
    - { id: a, text: { en: "A user-assigned managed identity attached to func-orders", fr: "Une identité managée attribuée par l'utilisateur, attachée à func-orders" } }
    - { id: b, text: { en: "The system-assigned managed identity of func-orders", fr: "L'identité managée attribuée par le système de func-orders" } }
    - { id: c, text: { en: "An app registration that has a client certificate stored in kv-orders", fr: "Une inscription d'application qui a un certificat client stocké dans kv-orders" } }
    - { id: d, text: { en: "An app registration that has a federated identity credential", fr: "Une inscription d'application qui a une information d'identification fédérée" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      A system-assigned managed identity is created as part of the Azure resource and shares its life cycle, so it is deleted when func-orders is deleted. Azure manages its credentials, so the team stores and rotates nothing. It suits a workload contained in a single resource.
    fr: |
      Une identité managée attribuée par le système est créée avec la ressource Azure et partage son cycle de vie ; elle est donc supprimée en même temps que func-orders. Azure gère ses informations d'identification, l'équipe n'a rien à stocker ni à renouveler. Elle convient à une charge de travail contenue dans une seule ressource.
  options:
    a:
      en: |
        A user-assigned managed identity has an independent life cycle and must be deleted explicitly, so it remains after func-orders is deleted.
      fr: |
        Une identité managée attribuée par l'utilisateur a un cycle de vie indépendant et doit être supprimée explicitement ; elle subsiste après la suppression de func-orders.
    c:
      en: |
        A client certificate is a credential that the team must store and renew, and the app registration is not deleted with the app.
      fr: |
        Un certificat client est une information d'identification que l'équipe doit stocker et renouveler, et l'inscription d'application n'est pas supprimée avec l'application.
    d:
      en: |
        A federated credential lets an external workload, such as a GitHub workflow, sign in. Code running in func-orders uses its own managed identity, and the app registration is not deleted with the app.
      fr: |
        Une information d'identification fédérée permet à une charge de travail externe, comme un workflow GitHub, de se connecter. Le code exécuté dans func-orders utilise sa propre identité managée, et l'inscription d'application n'est pas supprimée avec l'application.
references:
  - title: What is managed identities for Azure resources?
    url: https://learn.microsoft.com/en-us/entra/identity/managed-identities-azure-resources/overview
