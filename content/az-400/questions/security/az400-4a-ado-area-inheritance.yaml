id: az400-4a-ado-area-inheritance
objective: "4.1.5"
type: yesno_statements
difficulty: 3
status: draft
stem:
  en: |
    In an Azure DevOps project named **Fabrikam**, the permission **Edit work items in this node** is set as follows:

    | Area path | Group | Value |
    | --- | --- | --- |
    | Fabrikam (root) | Contributors | Allow |
    | Fabrikam\Mobile | Mobile Testers | Deny |
    | Fabrikam\Mobile\Payments | Mobile Testers | Allow |

    A user named **Ana** is a member of Contributors and of Mobile Testers. No other assignment of this permission exists.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Dans un projet Azure DevOps nommé **Fabrikam**, l'autorisation **Edit work items in this node** est définie comme suit :

    | Chemin de zone | Groupe | Valeur |
    | --- | --- | --- |
    | Fabrikam (racine) | Contributors | Allow |
    | Fabrikam\Mobile | Mobile Testers | Deny |
    | Fabrikam\Mobile\Payments | Mobile Testers | Allow |

    Une utilisatrice nommée **Ana** est membre de Contributors et de Mobile Testers. Il n'existe aucune autre attribution de cette autorisation.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          Ana can edit work items in Fabrikam\Mobile\Payments.
        fr: |
          Ana peut modifier des éléments de travail dans Fabrikam\Mobile\Payments.
    - id: s2
      text:
        en: |
          Ana can edit work items in Fabrikam\Mobile.
        fr: |
          Ana peut modifier des éléments de travail dans Fabrikam\Mobile.
    - id: s3
      text:
        en: |
          If you remove Ana from Contributors, she loses the ability to edit work items in Fabrikam\Mobile\Payments.
        fr: |
          Si vous retirez Ana de Contributors, elle perd la possibilité de modifier des éléments de travail dans Fabrikam\Mobile\Payments.
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: |
      On Fabrikam\Mobile, Ana receives an inherited Allow from Contributors and an explicit Deny from Mobile Testers; at the same scope, a Deny from one group takes precedence over an Allow from another group. On Payments, the explicit Allow of Mobile Testers replaces the Deny that the group inherits from Mobile, so Ana can edit work items there. That Allow comes from Mobile Testers, not Contributors, so removing her from Contributors doesn't change it.
    fr: |
      Sur Fabrikam\Mobile, Ana reçoit un Allow hérité de Contributors et un Deny explicite de Mobile Testers ; à la même étendue, un Deny d'un groupe l'emporte sur un Allow d'un autre groupe. Sur Payments, l'Allow explicite de Mobile Testers remplace le Deny que ce groupe hérite de Mobile : Ana peut y modifier des éléments de travail. Cet Allow vient de Mobile Testers, pas de Contributors ; la retirer de Contributors ne change rien.
references:
  - title: About permissions and security groups
    url: https://learn.microsoft.com/en-us/azure/devops/organizations/security/about-permissions
