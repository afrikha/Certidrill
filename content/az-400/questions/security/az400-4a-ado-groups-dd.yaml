id: az400-4a-ado-groups-dd
objective: "4.1.5"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    Contoso has an Azure DevOps organization that contains a project named **Phoenix**. You need to grant access to three users by adding each of them to one default security group. Each user must receive the least privilege required.

    To which group should you add each user? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso dispose d'une organisation Azure DevOps qui contient un projet nommé **Phoenix**. Vous devez accorder l'accès à trois utilisateurs en ajoutant chacun d'eux à un groupe de sécurité par défaut. Chaque utilisateur doit recevoir le privilège minimum requis.

    À quel groupe devez-vous ajouter chaque utilisateur ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Mia manages organization-wide policies, agent pools and process customization: [[g1]]

      Raj creates teams, area paths and repositories in Phoenix, without organization-level rights: [[g2]]

      Lea views the code, work items and pipelines of Phoenix without changing them: [[g3]]
    fr: |
      Mia gère les stratégies de l'organisation, les pools d'agents et la personnalisation des processus : [[g1]]

      Raj crée des équipes, des chemins de zone et des dépôts dans Phoenix, sans droits au niveau de l'organisation : [[g2]]

      Lea consulte le code, les éléments de travail et les pipelines de Phoenix sans les modifier : [[g3]]
  slots:
    - id: g1
      options:
        - { id: pca, text: Project Collection Administrators }
        - { id: pa, text: Project Administrators }
        - { id: contrib, text: Contributors }
        - { id: readers, text: Readers }
    - id: g2
      options:
        - { id: pca, text: Project Collection Administrators }
        - { id: pa, text: Project Administrators }
        - { id: contrib, text: Contributors }
        - { id: readers, text: Readers }
    - id: g3
      options:
        - { id: pca, text: Project Collection Administrators }
        - { id: pa, text: Project Administrators }
        - { id: contrib, text: Contributors }
        - { id: readers, text: Readers }
answer:
  values: { g1: pca, g2: pa, g3: readers }
explanation:
  correct:
    en: |
      Project Collection Administrators perform all operations for the organization, including its settings, policies and processes. Project Administrators administer all aspects of teams and the project, such as teams, area paths and repositories, but can't create projects. Readers view project information, the code base and work items without modifying them.
    fr: |
      Project Collection Administrators effectue toutes les opérations de l'organisation, y compris ses paramètres, stratégies et processus. Project Administrators administre tous les aspects des équipes et du projet, comme les équipes, les chemins de zone et les dépôts, mais ne peut pas créer de projets. Readers consulte les informations du projet, le code et les éléments de travail sans les modifier.
  options:
    contrib:
      en: |
        Contributors contribute fully to code and work items but don't manage or administer resources such as teams, area paths or organization policies.
      fr: |
        Contributors contribue pleinement au code et aux éléments de travail mais ne gère ni n'administre les ressources comme les équipes, les chemins de zone ou les stratégies de l'organisation.
references:
  - title: Permissions, security groups, and service accounts reference
    url: https://learn.microsoft.com/en-us/azure/devops/organizations/security/permissions
