id: az400-cs2a-signing-cert
objective: "4.2.3"
type: yesno_statements
caseStudy: az400-cs2a-trey-research
difficulty: 2
status: draft
stem:
  en: |
    To meet the certificate requirement, you upload trey-codesign.pfx as a secure file in the LabPortal project, and the signing job downloads it with the DownloadSecureFile@1 task.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour respecter l'exigence relative au certificat, vous chargez trey-codesign.pfx comme fichier sécurisé dans le projet LabPortal, et le travail de signature le télécharge avec la tâche DownloadSecureFile@1.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          When the certificate is renewed, you can edit the content of the existing secure file in the Library to replace the certificate.
        fr: |
          Lorsque le certificat est renouvelé, vous pouvez modifier le contenu du fichier sécurisé existant dans la bibliothèque pour remplacer le certificat.
    - id: s2
      text:
        en: |
          A YAML pipeline that is not listed in the Pipeline permissions of the secure file can use it only if open access is granted on the file.
        fr: |
          Un pipeline YAML qui ne figure pas dans les autorisations de pipeline du fichier sécurisé ne peut l'utiliser que si l'accès ouvert est accordé sur le fichier.
    - id: s3
      text:
        en: |
          You can add an Approvals check on the secure file so that the QA lead approves each run that uses it.
        fr: |
          Vous pouvez ajouter une vérification Approbations sur le fichier sécurisé pour que le responsable QA approuve chaque exécution qui l'utilise.
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: |
      The content of a secure file can't be edited after upload; to replace the certificate you delete the file and upload a new one. Secure files are protected resources, so a YAML pipeline must be authorized in the file's Pipeline permissions, unless open access lets every pipeline use it. Checks, including approvals, can be configured on secure files, which meets the QA lead requirement.
    fr: |
      Le contenu d'un fichier sécurisé ne peut pas être modifié après le chargement ; pour remplacer le certificat, vous supprimez le fichier et en chargez un nouveau. Les fichiers sécurisés sont des ressources protégées : un pipeline YAML doit être autorisé dans les autorisations de pipeline du fichier, sauf si l'accès ouvert permet à tous les pipelines de l'utiliser. Des vérifications, dont les approbations, peuvent être configurées sur les fichiers sécurisés, ce qui répond à l'exigence du responsable QA.
references:
  - title: Secure files for Azure Pipelines
    url: https://learn.microsoft.com/en-us/azure/devops/pipelines/library/secure-files
  - title: Define approvals and checks
    url: https://learn.microsoft.com/en-us/azure/devops/pipelines/process/approvals
