id: az400-4a-gh-ruleset-role
objective: "4.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Proseware's GitHub organization uses the GitHub Team plan. A team named **frontend-leads** has the Maintain role on the repository **proseware/storefront**.

    The team leads must now change the number of required approvals in the ruleset that protects the main branch of storefront. They must not receive access to any other repository. The solution must follow the principle of least privilege.

    What should you do?
  fr: |
    L'organisation GitHub de Proseware utilise le forfait GitHub Team. Une équipe nommée **frontend-leads** a le rôle Maintain sur le dépôt **proseware/storefront**.

    Les responsables d'équipe doivent désormais modifier le nombre d'approbations requises dans l'ensemble de règles qui protège la branche main de storefront. Ils ne doivent recevoir d'accès à aucun autre dépôt. La solution doit respecter le principe du privilège minimum.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Give frontend-leads the Write role on storefront.", fr: "Donner à frontend-leads le rôle Write sur storefront." } }
    - { id: b, text: { en: "Make the members of frontend-leads organization owners.", fr: "Faire des membres de frontend-leads des propriétaires de l'organisation." } }
    - { id: c, text: { en: "Give frontend-leads the Admin role on storefront.", fr: "Donner à frontend-leads le rôle Admin sur storefront." } }
    - { id: d, text: { en: "Create a custom repository role based on Maintain and assign it to frontend-leads.", fr: "Créer un rôle de dépôt personnalisé basé sur Maintain et l'attribuer à frontend-leads." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Managing branch protection rules and repository rulesets requires the Admin role on the repository. Maintain manages the repository without sensitive or destructive actions and can't edit rulesets. Granting Admin on storefront only keeps the access limited to that repository.
    fr: |
      La gestion des règles de protection de branche et des ensembles de règles du dépôt nécessite le rôle Admin sur le dépôt. Maintain gère le dépôt sans les actions sensibles ou destructrices et ne peut pas modifier les ensembles de règles. Accorder Admin sur storefront seulement limite l'accès à ce dépôt.
  options:
    a:
      en: |
        Write is lower than Maintain; it lets people push and merge, not manage rulesets.
      fr: |
        Write est inférieur à Maintain ; il permet de pousser et de fusionner, pas de gérer les ensembles de règles.
    b:
      en: |
        Organization owners have full control over every repository and setting, far more than required.
      fr: |
        Les propriétaires de l'organisation contrôlent entièrement tous les dépôts et paramètres, bien au-delà du nécessaire.
    d:
      en: |
        Custom repository roles require GitHub Enterprise Cloud, and Proseware uses GitHub Team.
      fr: |
        Les rôles de dépôt personnalisés nécessitent GitHub Enterprise Cloud, or Proseware utilise GitHub Team.
references:
  - title: Configure repository permissions using GitHub
    url: https://learn.microsoft.com/en-us/training/modules/manage-git-repositories/12-configure-source-control-repository-permissions-use-github
