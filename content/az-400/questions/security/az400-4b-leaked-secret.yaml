id: az400-4b-leaked-secret
objective: "4.3.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Adatum Corporation has an Azure Repos repository that has GitHub Secret Protection for Azure DevOps. A secret scanning alert reports that an Azure Storage account access key was committed to the main branch three days ago. The key is still valid.

    You need to remove the risk created by the exposed key.

    What should you do first?
  fr: |
    Adatum Corporation dispose d'un dépôt Azure Repos qui bénéficie de GitHub Secret Protection for Azure DevOps. Une alerte d'analyse des secrets signale qu'une clé d'accès de compte de stockage Azure a été commitée dans la branche main il y a trois jours. La clé est toujours valide.

    Vous devez éliminer le risque créé par la clé exposée.

    Que devez-vous faire en premier ?
body:
  options:
    - id: a
      text:
        en: "Rewrite the history of main to remove the key, and force-push the branch."
        fr: "Réécrire l'historique de main pour supprimer la clé, et forcer le push de la branche."
    - id: b
      text:
        en: "Rotate the storage account key, and update the applications that use it."
        fr: "Régénérer la clé du compte de stockage, et mettre à jour les applications qui l'utilisent."
    - id: c
      text:
        en: "Turn on push protection for the repository."
        fr: "Activer la protection push pour le dépôt."
    - id: d
      text:
        en: "Dismiss the alert with the reason Risk accepted, and add a comment."
        fr: "Fermer l'alerte avec le motif Risk accepted, et ajouter un commentaire."
answer: { optionId: b }
explanation:
  correct:
    en: |
      Once a secret is committed it must be considered compromised, because anyone who cloned or read the repository may have it. Revoking or rotating the key and updating the services that use it is the only action that makes the exposed value useless; you should then review what the key was used for.
    fr: |
      Une fois commité, un secret doit être considéré comme compromis, car toute personne qui a cloné ou lu le dépôt peut le posséder. Révoquer ou régénérer la clé et mettre à jour les services qui l'utilisent est la seule action qui rend la valeur exposée inutilisable ; vous devez ensuite vérifier à quoi la clé a servi.
  options:
    a: { en: "Removing the key from history doesn't invalidate copies already pulled; it can follow the rotation but doesn't replace it.", fr: "Supprimer la clé de l'historique n'invalide pas les copies déjà récupérées ; cela peut suivre la régénération, mais ne la remplace pas." }
    c: { en: "Push protection blocks future pushes; it does nothing for a key already in the repository. It is also on by default once Secret Protection is enabled.", fr: "La protection push bloque les pushes futurs ; elle ne fait rien pour une clé déjà présente dans le dépôt. Elle est en outre activée par défaut avec Secret Protection." }
    d: { en: "Dismissing the alert hides it but leaves a valid key exposed.", fr: "Fermer l'alerte la masque, mais laisse une clé valide exposée." }
references:
  - title: Set up secret scanning for GitHub Advanced Security
    url: https://learn.microsoft.com/en-us/azure/devops/repos/security/github-advanced-security-secret-scanning
