id: az400-4a-access-external-auditor
objective: "4.1.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Adatum's GitHub organization has a base permission of **Read**. An auditor from an external firm needs read access to two private repositories, **adatum/ledger** and **adatum/payroll**, for three months.

    The auditor must not see any other repository of the organization.

    What should you do?
  fr: |
    L'organisation GitHub d'Adatum a une autorisation de base **Read**. Un auditeur d'un cabinet externe a besoin d'un accès en lecture à deux dépôts privés, **adatum/ledger** et **adatum/payroll**, pendant trois mois.

    L'auditeur ne doit voir aucun autre dépôt de l'organisation.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Invite the auditor as an organization member and add them to a team that has Read on the two repositories.", fr: "Inviter l'auditeur comme membre de l'organisation et l'ajouter à une équipe qui a Read sur les deux dépôts." } }
    - { id: b, text: { en: "Add the auditor as an outside collaborator who has the Read role on each of the two repositories.", fr: "Ajouter l'auditeur comme collaborateur externe avec le rôle Read sur chacun des deux dépôts." } }
    - { id: c, text: { en: "Add the auditor as an outside collaborator and add them to a team that has Read on the two repositories.", fr: "Ajouter l'auditeur comme collaborateur externe et l'ajouter à une équipe qui a Read sur les deux dépôts." } }
    - { id: d, text: { en: "Invite the auditor to the organization with the billing manager role and no repository role.", fr: "Inviter l'auditeur dans l'organisation avec le rôle de gestionnaire de facturation et sans rôle de dépôt." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      An outside collaborator isn't an organization member, so the Read base permission doesn't apply; they see only the repositories on which they receive a role. Grant Read directly on each repository and remove the collaborator when the audit ends. On a paid plan, an outside collaborator on a private repository uses a license.
    fr: |
      Un collaborateur externe n'est pas membre de l'organisation : l'autorisation de base Read ne s'applique pas à lui et il ne voit que les dépôts sur lesquels il reçoit un rôle. Accordez Read directement sur chaque dépôt et retirez le collaborateur à la fin de l'audit. Avec un forfait payant, un collaborateur externe sur un dépôt privé utilise une licence.
  options:
    a:
      en: |
        As a member, the auditor receives the Read base permission on every repository of the organization.
      fr: |
        En tant que membre, l'auditeur reçoit l'autorisation de base Read sur tous les dépôts de l'organisation.
    c:
      en: |
        Outside collaborators can't be added to teams; team membership is limited to organization members.
      fr: |
        Les collaborateurs externes ne peuvent pas être ajoutés à des équipes ; l'appartenance aux équipes est réservée aux membres de l'organisation.
    d:
      en: |
        A billing manager manages billing settings only and gets no access to the two repositories.
      fr: |
        Un gestionnaire de facturation gère uniquement les paramètres de facturation et n'obtient aucun accès aux deux dépôts.
references:
  - title: Configure repository permissions using GitHub
    url: https://learn.microsoft.com/en-us/training/modules/manage-git-repositories/12-configure-source-control-repository-permissions-use-github
