id: az400-4a-ado-pat-agent
objective: "4.1.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You are installing a self-hosted Azure Pipelines agent on a Linux server named **build01** and adding it to an agent pool of your Azure DevOps organization. The registration script that you use authenticates with an Azure DevOps personal access token (PAT).

    The PAT must have the least privilege required.

    Which scope should you select for the PAT?
  fr: |
    Vous installez un agent Azure Pipelines auto-hébergé sur un serveur Linux nommé **build01** et vous l'ajoutez à un pool d'agents de votre organisation Azure DevOps. Le script d'inscription que vous utilisez s'authentifie avec un jeton d'accès personnel (PAT) Azure DevOps.

    Le PAT doit avoir le privilège minimum requis.

    Quelle étendue devez-vous sélectionner pour le PAT ?
body:
  options:
    - { id: a, text: Full access }
    - { id: b, text: "Agent Pools (Read & manage)" }
    - { id: c, text: "Build (Read & execute)" }
    - { id: d, text: "Project and Team (Read, write, & manage)" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Registering a self-hosted agent needs the Agent Pools (Read & manage) scope, which Microsoft Learn gives as the example of choosing only the scopes a task requires. Give the PAT the shortest practical lifetime.
    fr: |
      L'inscription d'un agent auto-hébergé nécessite l'étendue Agent Pools (Read & manage), que Microsoft Learn donne en exemple de choix des seules étendues nécessaires à une tâche. Donnez au PAT la durée de vie la plus courte possible.
  options:
    a:
      en: |
        Full access grants every permission of the user and can be restricted by the organization's policies; it breaks least privilege.
      fr: |
        Full access accorde toutes les autorisations de l'utilisateur et peut être restreint par les stratégies de l'organisation ; il enfreint le privilège minimum.
    c:
      en: |
        Build (Read & execute) lets you queue and read builds, but it doesn't allow adding an agent to a pool.
      fr: |
        Build (Read & execute) permet de mettre en file d'attente et de lire des builds, mais pas d'ajouter un agent à un pool.
    d:
      en: |
        Project and Team manages projects and teams, not agent pools.
      fr: |
        Project and Team gère les projets et les équipes, pas les pools d'agents.
references:
  - title: Use personal access tokens
    url: https://learn.microsoft.com/en-us/azure/devops/organizations/accounts/use-personal-access-tokens-to-authenticate
