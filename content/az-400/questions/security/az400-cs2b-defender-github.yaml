id: az400-cs2b-defender-github
objective: "4.3.4"
type: single
caseStudy: az400-cs2b-relecloud
difficulty: 2
status: draft
stem:
  en: |
    You need to meet the requirement of the security team.

    What should you do?
  fr: |
    Vous devez respecter l'exigence de l'équipe de sécurité.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text:
        en: "Add the Microsoft Security DevOps action to the workflow of every repository."
        fr: "Ajouter l'action Microsoft Security DevOps au workflow de chaque dépôt."
    - id: b
      text:
        en: "Create a GitHub connector in Defender for Cloud, and install its app on the organization."
        fr: "Créer un connecteur GitHub dans Defender pour le cloud et installer son application sur l'organisation."
    - id: c
      text:
        en: "Enable the Defender for Containers plan on Sub-Stream, and scan the crrelecloud registry."
        fr: "Activer le plan Defender pour conteneurs sur Sub-Stream et analyser le registre crrelecloud."
    - id: d
      text:
        en: "Stream the GitHub audit log of the organization to a Log Analytics workspace."
        fr: "Diffuser le journal d'audit GitHub de l'organisation vers un espace de travail Log Analytics."
answer: { optionId: b }
explanation:
  correct:
    en: Connecting the relecloud organization to Defender for Cloud (Environment settings, Add environment, GitHub) installs the DevOps security GitHub application and discovers the repositories. Because GitHub Advanced Security is already enabled, its exposed secret and open-source vulnerability findings then surface as Defender for Cloud recommendations, with no change to the workflows.
    fr: Connecter l'organisation relecloud à Defender pour le cloud (Environment settings, Add environment, GitHub) installe l'application GitHub de sécurité DevOps et découvre les dépôts. Comme GitHub Advanced Security est déjà activé, ses résultats sur les secrets exposés et les vulnérabilités open source apparaissent ensuite comme recommandations de Defender pour le cloud, sans modifier les workflows.
  options:
    a: { en: "The Microsoft Security DevOps action adds code and IaC scanning, but findings reach Defender for Cloud only through a connector, and editing every workflow adds effort.", fr: "L'action Microsoft Security DevOps ajoute l'analyse du code et de l'IaC, mais ses résultats n'arrivent dans Defender pour le cloud que par un connecteur, et modifier chaque workflow ajoute de l'effort." }
    c: { en: "Defender for Containers assesses container images and runtimes; it doesn't report the secrets or dependencies found in the GitHub repositories.", fr: "Defender pour conteneurs évalue les images conteneur et l'exécution ; il ne signale pas les secrets ni les dépendances détectés dans les dépôts GitHub." }
    d: { en: "The audit log records actions in the organization; it doesn't contain security findings and doesn't feed Defender for Cloud recommendations.", fr: "Le journal d'audit enregistre les actions effectuées dans l'organisation ; il ne contient pas de résultats de sécurité et n'alimente pas les recommandations de Defender pour le cloud." }
references:
  - title: "Quick Start: Connect your GitHub Environment to Microsoft Defender for Cloud"
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/quickstart-onboard-github
  - title: "Support and prerequisites: DevOps security"
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/devops-support
