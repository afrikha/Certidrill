id: az400-4b-codeql-container-git
objective: "4.3.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso, Ltd. has a GitHub workflow that runs CodeQL code scanning for a Java application in a container job. The job uses the image `ghcr.io/contoso/java-build:21`, which is based on Debian and contains only the JDK and Gradle.

    The checkout step succeeds, but the CodeQL steps fail and the log reports that the git command can't be found.

    What should you do?
  fr: |
    Contoso, Ltd. dispose d'un workflow GitHub qui exécute l'analyse du code CodeQL d'une application Java dans un travail de conteneur. Le travail utilise l'image `ghcr.io/contoso/java-build:21`, basée sur Debian, qui ne contient que le JDK et Gradle.

    L'étape d'extraction réussit, mais les étapes CodeQL échouent et le journal indique que la commande git est introuvable.

    Que devez-vous faire ?
body:
  options:
    - id: d
      text:
        en: "Rebuild the image on an Alpine Linux base image that includes Git."
        fr: "Régénérer l'image à partir d'une image de base Alpine Linux qui inclut Git."
    - id: b
      text:
        en: "Set build-mode to none in the CodeQL init step."
        fr: "Définir build-mode sur none dans l'étape init de CodeQL."
    - id: c
      text:
        en: "Grant the workflow the `contents: write` permission."
        fr: "Accorder au workflow l'autorisation `contents: write`."
    - id: a
      text:
        en: "Install Git in the image and make sure it's on the PATH."
        fr: "Installer Git dans l'image et vérifier qu'il figure dans le PATH."
answer: { optionId: a }
explanation:
  correct:
    en: |
      When CodeQL runs in a container, the image must provide the dependencies that GitHub-hosted runner images normally include; Git must be installed and added to the PATH. Adding Git to the Debian-based image fixes the failure without changing how the code is built.
    fr: |
      Lorsque CodeQL s'exécute dans un conteneur, l'image doit fournir les dépendances que les images des exécuteurs hébergés par GitHub incluent normalement ; Git doit être installé et ajouté au PATH. Ajouter Git à l'image basée sur Debian corrige l'échec sans modifier la façon dont le code est généré.
  options:
    d: { en: "The CodeQL CLI isn't compatible with musl-based Alpine Linux, so this change would cause a new failure.", fr: "L'interface CLI CodeQL n'est pas compatible avec Alpine Linux, basée sur musl : ce changement provoquerait un nouvel échec." }
    b: { en: "The build mode controls how CodeQL extracts the code; it doesn't remove the need for Git in the container.", fr: "Le mode de build détermine la façon dont CodeQL extrait le code ; il ne supprime pas le besoin de Git dans le conteneur." }
    c: { en: "A missing executable isn't a permission problem, and code scanning needs `security-events: write`, not write access to contents.", fr: "Un exécutable manquant n'est pas un problème d'autorisation, et l'analyse du code exige `security-events: write`, pas un accès en écriture au contenu." }
references:
  - title: Configure code scanning
    url: https://learn.microsoft.com/en-us/training/modules/configure-code-scanning/4-configure-code-scanning
