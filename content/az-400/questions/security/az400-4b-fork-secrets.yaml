id: az400-4b-fork-secrets
objective: "4.2.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Tailspin Toys has an Azure DevOps project that contains a YAML pipeline named **web-ci**. web-ci builds a public GitHub repository and uses a variable group that contains secret variables for the integration tests. No organization-level or project-level restriction on builds from forks is configured.

    External contributors open pull requests from forks of the repository. You need web-ci to build these pull requests to validate them. The solution must prevent the code of a fork from reading the secrets used by web-ci.

    What should you do?
  fr: |
    Tailspin Toys dispose d'un projet Azure DevOps qui contient un pipeline YAML nommé **web-ci**. web-ci génère un dépôt GitHub public et utilise un groupe de variables qui contient des variables secrètes pour les tests d'intégration. Aucune restriction sur les builds de forks n'est configurée au niveau de l'organisation ni du projet.

    Des contributeurs externes ouvrent des pull requests depuis des forks du dépôt. Vous devez faire en sorte que web-ci génère ces pull requests pour les valider. La solution doit empêcher le code d'un fork de lire les secrets utilisés par web-ci.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text:
        en: "Run web-ci on a self-hosted agent pool that has no outbound internet access."
        fr: "Exécuter web-ci sur un pool d'agents auto-hébergés sans accès sortant à Internet."
    - id: b
      text:
        en: "Move the secret variables from the variable group to the pipeline settings of web-ci."
        fr: "Déplacer les variables secrètes du groupe de variables vers les paramètres du pipeline web-ci."
    - id: c
      text:
        en: "On the Triggers tab of web-ci, select **Build pull requests from forks of this repository** and leave **Make secrets available to builds of forks** cleared."
        fr: "Sous l'onglet Triggers de web-ci, sélectionner **Build pull requests from forks of this repository** et laisser **Make secrets available to builds of forks** désélectionné."
    - id: d
      text:
        en: "On the Triggers tab of web-ci, select **Build pull requests from forks of this repository** and **Make fork builds have the same permissions as regular builds**."
        fr: "Sous l'onglet Triggers de web-ci, sélectionner **Build pull requests from forks of this repository** et **Make fork builds have the same permissions as regular builds**."
answer: { optionId: c }
explanation:
  correct:
    en: |
      Building pull requests from forks is enabled on the Triggers tab of the pipeline. As long as **Make secrets available to builds of forks** stays cleared (its default for GitHub pipelines), fork builds don't receive secret variables, service connection credentials, secure files or the GitHub token with repository access.
    fr: |
      La génération des pull requests issues de forks s'active sous l'onglet Triggers du pipeline. Tant que **Make secrets available to builds of forks** reste désélectionné (sa valeur par défaut pour les pipelines GitHub), les builds de forks ne reçoivent ni les variables secrètes, ni les informations d'identification des connexions de service, ni les fichiers sécurisés, ni le jeton GitHub qui donne accès au dépôt.
  options:
    a:
      en: |
        Blocking internet access doesn't stop the fork code from reading secrets on the agent, and Microsoft recommends hosted agents, which are discarded after each build, for untrusted fork code.
      fr: |
        Bloquer l'accès à Internet n'empêche pas le code du fork de lire les secrets sur l'agent, et Microsoft recommande des agents hébergés, supprimés après chaque build, pour du code de fork non fiable.
    b:
      en: |
        Secret variables defined in the pipeline settings are still secrets of the pipeline; what controls their exposure to forks is the fork setting, not where they are defined.
      fr: |
        Les variables secrètes définies dans les paramètres du pipeline restent des secrets du pipeline ; leur exposition aux forks dépend du paramètre des forks, pas de l'endroit où elles sont définies.
    d:
      en: |
        That option gives fork builds the regular, less restricted access token, which increases the risk instead of reducing it.
      fr: |
        Cette option donne aux builds de forks le jeton d'accès normal, moins restreint, ce qui augmente le risque au lieu de le réduire.
references:
  - title: Build GitHub repositories
    url: https://learn.microsoft.com/en-us/azure/devops/pipelines/repos/github
