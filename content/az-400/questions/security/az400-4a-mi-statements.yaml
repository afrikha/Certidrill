id: az400-4a-mi-statements
objective: "4.1.1"
type: yesno_statements
difficulty: 3
status: draft
stem:
  en: |
    Contoso has an Azure virtual machine named **VM1** that has a system-assigned managed identity. The identity has the Key Vault Secrets User role on a key vault named **kv1**. Contoso also has a user-assigned managed identity named **id-deploy**.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso dispose d'une machine virtuelle Azure nommée **VM1** qui a une identité managée attribuée par le système. Cette identité a le rôle Key Vault Secrets User sur un coffre de clés nommé **kv1**. Contoso dispose aussi d'une identité managée attribuée par l'utilisateur nommée **id-deploy**.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          If you delete VM1, the role assignment of its system-assigned managed identity on kv1 is removed automatically.
        fr: |
          Si vous supprimez VM1, l'attribution de rôle de son identité managée attribuée par le système sur kv1 est supprimée automatiquement.
    - id: s2
      text:
        en: |
          You can attach id-deploy to VM1 while VM1 keeps its system-assigned managed identity.
        fr: |
          Vous pouvez attacher id-deploy à VM1 tout en conservant l'identité managée attribuée par le système de VM1.
    - id: s3
      text:
        en: |
          You can add a federated identity credential to id-deploy so that a GitHub Actions workflow signs in to Microsoft Entra ID as id-deploy.
        fr: |
          Vous pouvez ajouter une information d'identification fédérée à id-deploy afin qu'un workflow GitHub Actions se connecte à Microsoft Entra ID en tant qu'id-deploy.
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: |
      Deleting VM1 deletes its system-assigned identity, but role assignments are not deleted automatically; they remain as orphaned assignments shown as "Identity not found" and must be removed manually. A resource can have a system-assigned identity and one or more user-assigned identities at the same time. A user-assigned managed identity, like an app registration, can carry a federated credential that trusts GitHub Actions tokens.
    fr: |
      La suppression de VM1 supprime son identité attribuée par le système, mais les attributions de rôles ne sont pas supprimées automatiquement ; elles restent comme attributions orphelines affichées « Identity not found » et doivent être supprimées manuellement. Une ressource peut avoir à la fois une identité attribuée par le système et une ou plusieurs identités attribuées par l'utilisateur. Une identité managée attribuée par l'utilisateur, comme une inscription d'application, peut porter une information d'identification fédérée qui approuve les jetons de GitHub Actions.
references:
  - title: Managed identity best practice recommendations
    url: https://learn.microsoft.com/en-us/entra/identity/managed-identities-azure-resources/managed-identity-best-practice-recommendations
  - title: Authenticate to Azure from GitHub Actions by OpenID Connect
    url: https://learn.microsoft.com/en-us/azure/developer/github/connect-from-azure-openid-connect
