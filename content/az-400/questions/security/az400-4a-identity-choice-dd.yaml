id: az400-4a-identity-choice-dd
objective: "4.1.1"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Contoso is designing the Microsoft Entra identities of three workloads.

    You need to recommend an identity type for each workload.

    Which identity type should you recommend for each workload? To answer, drag the appropriate identity types to the correct workloads. Each identity type may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso conçoit les identités Microsoft Entra de trois charges de travail.

    Vous devez recommander un type d'identité pour chaque charge de travail.

    Quel type d'identité devez-vous recommander pour chaque charge de travail ? Pour répondre, faites glisser les types d'identité appropriés vers les charges de travail correspondantes. Chaque type d'identité peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: sys, text: { en: "System-assigned managed identity", fr: "Identité managée attribuée par le système" } }
    - { id: uami, text: { en: "User-assigned managed identity", fr: "Identité managée attribuée par l'utilisateur" } }
    - { id: app, text: { en: "Multitenant app registration and its service principal", fr: "Inscription d'application multilocataire et son principal de service" } }
    - { id: user, text: { en: "Microsoft Entra user account used as a service account", fr: "Compte d'utilisateur Microsoft Entra utilisé comme compte de service" } }
  targets:
    - id: t1
      text: { en: "An App Service app writes to Azure SQL Database. The logs must show which app performed each action, and the permissions must disappear with the app.", fr: "Une application App Service écrit dans Azure SQL Database. Les journaux doivent indiquer quelle application a effectué chaque action, et les autorisations doivent disparaître avec l'application." }
    - id: t2
      text: { en: "Fifteen Azure Container Apps apps run the same job and must receive one set of permissions, approved once by the security team.", fr: "Quinze applications Azure Container Apps exécutent la même tâche et doivent recevoir un seul ensemble d'autorisations, approuvé une fois par l'équipe de sécurité." }
    - id: t3
      text: { en: "A SaaS application published by Contoso must be granted consent in the Microsoft Entra tenants of its customers.", fr: "Une application SaaS publiée par Contoso doit recevoir un consentement dans les locataires Microsoft Entra de ses clients." }
answer:
  mapping: { t1: sys, t2: uami, t3: app }
explanation:
  correct:
    en: |
      A system-assigned identity belongs to one resource, so audit logs name that specific app, and its permissions go away when the resource is deleted. A user-assigned identity can be shared by many resources that need the same permissions, so one approval and one set of role assignments cover all fifteen apps. Managed identities live in a single tenant; an application that customers consent to in their own tenants needs a multitenant app registration.
    fr: |
      Une identité attribuée par le système appartient à une seule ressource, les journaux d'audit nomment donc cette application précise, et ses autorisations disparaissent quand la ressource est supprimée. Une identité attribuée par l'utilisateur peut être partagée par plusieurs ressources qui ont besoin des mêmes autorisations : une seule approbation et un seul jeu d'attributions de rôles couvrent les quinze applications. Les identités managées appartiennent à un seul locataire ; une application à laquelle les clients consentent dans leurs propres locataires nécessite une inscription d'application multilocataire.
  options:
    user:
      en: |
        A user account used as a service account has a password to manage and is not a workload identity; none of the workloads needs it.
      fr: |
        Un compte d'utilisateur utilisé comme compte de service a un mot de passe à gérer et n'est pas une identité de charge de travail ; aucune des charges de travail n'en a besoin.
references:
  - title: Managed identity best practice recommendations
    url: https://learn.microsoft.com/en-us/entra/identity/managed-identities-azure-resources/managed-identity-best-practice-recommendations
  - title: What is managed identities for Azure resources?
    url: https://learn.microsoft.com/en-us/entra/identity/managed-identities-azure-resources/overview
