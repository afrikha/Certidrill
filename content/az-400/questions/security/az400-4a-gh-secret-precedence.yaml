id: az400-4a-gh-secret-precedence
objective: "4.2.2"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    The GitHub organization **contoso** has an organization secret named **DB_CONN** that is available to all private repositories. The private repository **contoso/shop** also has a repository secret named DB_CONN, and its environment **staging** has an environment secret named DB_CONN. The three secrets have different values.

    A workflow in contoso/shop has two jobs that reference `secrets.DB_CONN`:

    - **build** doesn't reference any environment.
    - **deploy** declares `environment: staging`.

    Which value of DB_CONN does each job receive? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    L'organisation GitHub **contoso** a un secret d'organisation nommé **DB_CONN** disponible pour tous les dépôts privés. Le dépôt privé **contoso/shop** a aussi un secret de dépôt nommé DB_CONN, et son environnement **staging** a un secret d'environnement nommé DB_CONN. Les trois secrets ont des valeurs différentes.

    Un workflow de contoso/shop contient deux jobs qui référencent `secrets.DB_CONN` :

    - **build** ne référence aucun environnement.
    - **deploy** déclare `environment: staging`.

    Quelle valeur de DB_CONN chaque job reçoit-il ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      build: [[b]]

      deploy: [[d]]
    fr: |
      build : [[b]]

      deploy : [[d]]
  slots:
    - id: b
      options:
        - { id: org, text: { en: "The organization secret", fr: "Le secret d'organisation" } }
        - { id: repo, text: { en: "The repository secret", fr: "Le secret de dépôt" } }
        - { id: env, text: { en: "The environment secret", fr: "Le secret d'environnement" } }
        - { id: none, text: { en: "No value", fr: "Aucune valeur" } }
    - id: d
      options:
        - { id: org, text: { en: "The organization secret", fr: "Le secret d'organisation" } }
        - { id: repo, text: { en: "The repository secret", fr: "Le secret de dépôt" } }
        - { id: env, text: { en: "The environment secret", fr: "Le secret d'environnement" } }
        - { id: none, text: { en: "No value", fr: "Aucune valeur" } }
answer:
  values: { b: repo, d: env }
explanation:
  correct:
    en: |
      When a secret with the same name exists at several levels, the lowest level takes precedence. A repository secret overrides an organization secret, so build receives the repository value. Environment secrets are available only to jobs that reference the environment, and they override both other levels, so deploy receives the staging value.
    fr: |
      Lorsqu'un secret de même nom existe à plusieurs niveaux, le niveau le plus bas l'emporte. Un secret de dépôt remplace un secret d'organisation : build reçoit la valeur du dépôt. Les secrets d'environnement ne sont disponibles que pour les jobs qui référencent l'environnement, et ils remplacent les deux autres niveaux : deploy reçoit la valeur de staging.
  options:
    org:
      en: |
        The organization secret is overridden by the repository and environment secrets of the same name.
      fr: |
        Le secret d'organisation est remplacé par les secrets de dépôt et d'environnement de même nom.
    none:
      en: |
        Both jobs can read a secret named DB_CONN; a duplicate name doesn't cause an empty value.
      fr: |
        Les deux jobs peuvent lire un secret nommé DB_CONN ; un nom en double ne produit pas de valeur vide.
references:
  - title: Control deployments with GitHub environments
    url: https://learn.microsoft.com/en-us/training/modules/deploy-model-github-actions/4-control-deployments-github-environments
