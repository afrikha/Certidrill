id: az400-4a-gh-base-permissions
objective: "4.1.4"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    Fabrikam's GitHub organization has 300 members and 60 private repositories. The base permission of the organization is **No permission**. Two consultants from Litware are outside collaborators who have the Write role on the repository **fabrikam/docs** only.

    You need to meet the following requirements:

    - Every organization member can read every repository, including repositories created later.
    - The members of the team **payments** can push to **fabrikam/payments-api**.
    - The Litware consultants keep their access to fabrikam/docs and get no access to other repositories.

    The solution must minimize administrative effort.

    Which two actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    L'organisation GitHub de Fabrikam compte 300 membres et 60 dépôts privés. L'autorisation de base de l'organisation est **No permission**. Deux consultants de Litware sont des collaborateurs externes qui ont le rôle Write sur le seul dépôt **fabrikam/docs**.

    Vous devez répondre aux exigences suivantes :

    - Chaque membre de l'organisation peut lire tous les dépôts, y compris ceux créés ultérieurement.
    - Les membres de l'équipe **payments** peuvent pousser vers **fabrikam/payments-api**.
    - Les consultants de Litware conservent leur accès à fabrikam/docs et n'obtiennent aucun accès aux autres dépôts.

    La solution doit réduire au minimum l'effort d'administration.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Create a team that contains every member and give it the Read role on each repository.", fr: "Créer une équipe qui contient tous les membres et lui donner le rôle Read sur chaque dépôt." } }
    - { id: b, text: { en: "Set the base permission of the organization to Read.", fr: "Définir l'autorisation de base de l'organisation sur Read." } }
    - { id: c, text: { en: "Set the base permission of the organization to Write.", fr: "Définir l'autorisation de base de l'organisation sur Write." } }
    - { id: d, text: { en: "Give the payments team the Write role on fabrikam/payments-api.", fr: "Donner à l'équipe payments le rôle Write sur fabrikam/payments-api." } }
    - { id: e, text: { en: "Convert the Litware consultants to organization members and add them to a team that has Write on fabrikam/docs.", fr: "Convertir les consultants de Litware en membres de l'organisation et les ajouter à une équipe qui a Write sur fabrikam/docs." } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |
      A base permission applies to all organization members on every repository, including new ones, and it doesn't apply to outside collaborators, so the Litware consultants keep access to fabrikam/docs only. A higher role granted on one repository overrides the base permission, so Write for the payments team on payments-api lets its members push there.
    fr: |
      Une autorisation de base s'applique à tous les membres de l'organisation sur tous les dépôts, y compris les nouveaux, et ne s'applique pas aux collaborateurs externes : les consultants de Litware conservent l'accès au seul dépôt fabrikam/docs. Un rôle plus élevé accordé sur un dépôt remplace l'autorisation de base ; Write pour l'équipe payments sur payments-api permet à ses membres d'y pousser.
  options:
    a:
      en: |
        A team must be granted Read on each of the 60 repositories and on every new repository, which doesn't minimize effort.
      fr: |
        Il faut accorder Read à l'équipe sur chacun des 60 dépôts et sur chaque nouveau dépôt, ce qui ne réduit pas l'effort.
    c:
      en: |
        Write as the base permission lets every member push to every repository, far beyond the requirement.
      fr: |
        Write comme autorisation de base permet à chaque membre de pousser vers tous les dépôts, bien au-delà de l'exigence.
    e:
      en: |
        As members, the consultants would receive the base permission and could read every repository.
      fr: |
        En tant que membres, les consultants recevraient l'autorisation de base et pourraient lire tous les dépôts.
references:
  - title: Configure repository permissions using GitHub
    url: https://learn.microsoft.com/en-us/training/modules/manage-git-repositories/12-configure-source-control-repository-permissions-use-github
