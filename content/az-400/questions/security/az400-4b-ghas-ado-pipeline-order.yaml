id: az400-4b-ghas-ado-pipeline-order
objective: "4.3.3"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    Northwind Traders has an Azure Repos repository named **inventory-api** that contains a Java application built with Maven. GitHub Code Security for Azure DevOps isn't enabled yet. A YAML pipeline named **inventory-ci** runs on a Microsoft-hosted agent.

    You need to add CodeQL code scanning to inventory-ci by using the advanced setup. The results must appear in the **Advanced Security** tab of the repository.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Northwind Traders dispose d'un dépôt Azure Repos nommé **inventory-api** qui contient une application Java générée avec Maven. GitHub Code Security for Azure DevOps n'est pas encore activé. Un pipeline YAML nommé **inventory-ci** s'exécute sur un agent hébergé par Microsoft.

    Vous devez ajouter l'analyse du code CodeQL à inventory-ci à l'aide de la configuration avancée. Les résultats doivent apparaître dans l'onglet **Advanced Security** du dépôt.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: cache, text: { en: "Add a Cache@2 task that restores the Maven build output of the previous run.", fr: "Ajouter une tâche Cache@2 qui restaure la sortie de build Maven de l'exécution précédente." } }
    - { id: init, text: { en: "Add the AdvancedSecurity-Codeql-Init@1 task with the input `languages: java`.", fr: "Ajouter la tâche AdvancedSecurity-Codeql-Init@1 avec l'entrée `languages: java`." } }
    - { id: enable, text: { en: "In Project settings > Repos > Repositories, turn on Code Security for inventory-api and select Begin billing.", fr: "Dans Project settings > Repos > Repositories, activer Code Security pour inventory-api et sélectionner Begin billing." } }
    - { id: analyze, text: { en: "Add the AdvancedSecurity-Codeql-Analyze@1 task.", fr: "Ajouter la tâche AdvancedSecurity-Codeql-Analyze@1." } }
    - { id: publish, text: { en: "Add the AdvancedSecurity-Publish@1 task to upload a SARIF file produced by the CodeQL CLI.", fr: "Ajouter la tâche AdvancedSecurity-Publish@1 pour charger un fichier SARIF produit par l'interface CLI CodeQL." } }
    - { id: build, text: { en: "Add a Maven@4 task that runs the clean package goals.", fr: "Ajouter une tâche Maven@4 qui exécute les objectifs clean package." } }
answer:
  sequence: [ enable, init, build, analyze ]
explanation:
  correct:
    en: |
      Code scanning requires GitHub Code Security for Azure DevOps on the repository, enabled in the repository settings and activated by Begin billing. In the pipeline, the Initialize CodeQL task comes first, then the build steps, which CodeQL monitors to build its database, and then the Perform CodeQL Analysis task, which runs the queries and sends the results to the Advanced Security tab.
    fr: |
      L'analyse du code exige GitHub Code Security for Azure DevOps sur le dépôt, activé dans les paramètres du dépôt et mis en service par Begin billing. Dans le pipeline, la tâche d'initialisation de CodeQL vient en premier, puis les étapes de build, que CodeQL surveille pour construire sa base de données, et enfin la tâche d'analyse CodeQL, qui exécute les requêtes et envoie les résultats dans l'onglet Advanced Security.
  options:
    cache: { en: "Build caching can prevent CodeQL from seeing all the compiled code; Microsoft recommends a clean build without caching.", fr: "La mise en cache du build peut empêcher CodeQL de voir tout le code compilé ; Microsoft recommande un build propre sans mise en cache." }
    publish: { en: "The Publish task is for SARIF files from the standalone CodeQL CLI; the Analyze task already sends the results.", fr: "La tâche Publish sert aux fichiers SARIF de l'interface CLI CodeQL autonome ; la tâche Analyze envoie déjà les résultats." }
references:
  - title: Set up code scanning for GitHub Advanced Security for Azure DevOps
    url: https://learn.microsoft.com/en-us/azure/devops/repos/security/github-advanced-security-code-scanning
  - title: Configure GitHub Advanced Security for Azure DevOps features
    url: https://learn.microsoft.com/en-us/azure/devops/repos/security/configure-github-advanced-security-features
