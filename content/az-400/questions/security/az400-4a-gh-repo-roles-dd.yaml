id: az400-4a-gh-repo-roles-dd
objective: "4.1.4"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Contoso has a private GitHub repository named **contoso/portal**. You must grant access to four groups of people. Each group must receive the least privileged repository role that meets its needs.

    Which role should you assign to each group? To answer, drag the appropriate roles to the correct groups. Each role may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso dispose d'un dépôt GitHub privé nommé **contoso/portal**. Vous devez accorder l'accès à quatre groupes de personnes. Chaque groupe doit recevoir le rôle de dépôt le moins privilégié qui répond à ses besoins.

    Quel rôle devez-vous attribuer à chaque groupe ? Pour répondre, faites glisser les rôles appropriés vers les groupes correspondants. Chaque rôle peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: read, text: Read }
    - { id: triage, text: Triage }
    - { id: write, text: Write }
    - { id: maintain, text: Maintain }
    - { id: admin, text: Admin }
  targets:
    - id: t1
      text: { en: "Support engineers: apply labels, close and assign issues and pull requests, without pushing code", fr: "Ingénieurs du support : appliquer des étiquettes, fermer et attribuer des problèmes et des pull requests, sans pousser de code" }
    - id: t2
      text: { en: "Developers: push branches, merge pull requests and rerun workflows", fr: "Développeurs : pousser des branches, fusionner des pull requests et réexécuter des workflows" }
    - id: t3
      text: { en: "Product owner: edit the repository description and topics, without access to security settings or repository deletion", fr: "Product owner : modifier la description et les rubriques du dépôt, sans accès aux paramètres de sécurité ni à la suppression du dépôt" }
    - id: t4
      text: { en: "Auditors: clone the code and open issues", fr: "Auditeurs : cloner le code et ouvrir des problèmes" }
answer:
  mapping: { t1: triage, t2: write, t3: maintain, t4: read }
explanation:
  correct:
    en: |
      Triage manages issues and pull requests without write access. Write is for people who push changes, merge pull requests and run workflows. Maintain manages the repository, including its description and topics, without sensitive or destructive actions. Read lets people view, clone and discuss the project. Admin adds security settings and repository deletion, which no group needs.
    fr: |
      Triage gère les problèmes et les pull requests sans accès en écriture. Write s'adresse aux personnes qui poussent des modifications, fusionnent des pull requests et exécutent des workflows. Maintain gère le dépôt, y compris sa description et ses rubriques, sans les actions sensibles ou destructrices. Read permet de consulter, cloner et discuter du projet. Admin ajoute les paramètres de sécurité et la suppression du dépôt, dont aucun groupe n'a besoin.
references:
  - title: Configure repository permissions using GitHub
    url: https://learn.microsoft.com/en-us/training/modules/manage-git-repositories/12-configure-source-control-repository-permissions-use-github
