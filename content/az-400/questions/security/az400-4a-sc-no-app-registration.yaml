id: az400-4a-sc-no-app-registration
objective: "4.1.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Adatum uses Azure Pipelines with Microsoft-hosted agents. The platform team must create an Azure Resource Manager service connection that deploys to a resource group named **rg-adatum-web**.

    The team members aren't allowed to create app registrations in Microsoft Entra ID. An existing user-assigned managed identity named **id-adatum-deploy** has the Contributor role on rg-adatum-web. The service connection must not use any secret.

    Which authentication option should the team select when creating the service connection?
  fr: |
    Adatum utilise Azure Pipelines avec des agents hébergés par Microsoft. L'équipe plateforme doit créer une connexion de service Azure Resource Manager qui déploie dans un groupe de ressources nommé **rg-adatum-web**.

    Les membres de l'équipe ne sont pas autorisés à créer des inscriptions d'application dans Microsoft Entra ID. Une identité managée attribuée par l'utilisateur existante, nommée **id-adatum-deploy**, a le rôle Contributor sur rg-adatum-web. La connexion de service ne doit utiliser aucun secret.

    Quelle option d'authentification l'équipe doit-elle sélectionner lors de la création de la connexion de service ?
body:
  options:
    - { id: a, text: { en: "App registration (automatic) with workload identity federation", fr: "Inscription d'application (automatique) avec fédération d'identité de charge de travail" } }
    - { id: b, text: { en: "App registration (automatic) with a secret", fr: "Inscription d'application (automatique) avec un secret" } }
    - { id: c, text: { en: "Managed identity (existing user-assigned) with workload identity federation", fr: "Identité managée (attribuée par l'utilisateur existante) avec fédération d'identité de charge de travail" } }
    - { id: d, text: { en: "Agent-assigned managed identity", fr: "Identité managée attribuée à l'agent" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      The managed identity option uses an existing user-assigned managed identity and creates a workload identity federation credential on it, so no secret exists. Microsoft Learn recommends it when you don't have permission to create an app registration.
    fr: |
      L'option d'identité managée utilise une identité managée attribuée par l'utilisateur existante et crée sur celle-ci une information d'identification de fédération d'identité de charge de travail : aucun secret n'existe. Microsoft Learn la recommande lorsque vous n'êtes pas autorisé à créer une inscription d'application.
  options:
    a:
      en: |
        The automatic option creates an app registration in Microsoft Entra ID (and needs the Owner role on the subscription), which the team isn't allowed to do.
      fr: |
        L'option automatique crée une inscription d'application dans Microsoft Entra ID (et nécessite le rôle Owner sur l'abonnement), ce que l'équipe n'est pas autorisée à faire.
    b:
      en: |
        This option also creates an app registration, and it relies on a secret; it is kept only for backward compatibility.
      fr: |
        Cette option crée aussi une inscription d'application et repose sur un secret ; elle n'est conservée que pour la compatibilité descendante.
    d:
      en: |
        An agent-assigned managed identity is the identity of a self-hosted agent running on an Azure VM; Microsoft-hosted agents can't use it, and the option is not recommended.
      fr: |
        Une identité managée attribuée à l'agent est l'identité d'un agent auto-hébergé exécuté sur une VM Azure ; les agents hébergés par Microsoft ne peuvent pas l'utiliser, et l'option n'est pas recommandée.
references:
  - title: Connect to Azure with an Azure Resource Manager service connection
    url: https://learn.microsoft.com/en-us/azure/devops/pipelines/library/connect-to-azure
