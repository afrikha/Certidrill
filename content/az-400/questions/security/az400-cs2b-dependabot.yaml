id: az400-cs2b-dependabot
objective: "4.3.6"
type: yesno_statements
caseStudy: az400-cs2b-relecloud
difficulty: 2
status: draft
stem:
  en: |
    To meet the dependency requirement, you plan to enable the dependency graph, Dependabot alerts and Dependabot security updates for all the relecloud repositories.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour respecter l'exigence relative aux dépendances, vous prévoyez d'activer le graphique des dépendances, les alertes Dependabot et les mises à jour de sécurité Dependabot pour tous les dépôts relecloud.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: A new Dependabot alert is raised for player-service when a new advisory added to the GitHub Advisory Database affects one of its dependencies.
        fr: Une nouvelle alerte Dependabot est déclenchée pour player-service lorsqu'un nouvel avis ajouté à la GitHub Advisory Database concerne l'une de ses dépendances.
    - id: s2
      text:
        en: Dependabot creates security update pull requests only in the repositories that contain a .github/dependabot.yml file.
        fr: Dependabot crée des pull requests de mise à jour de sécurité uniquement dans les dépôts qui contiennent un fichier .github/dependabot.yml.
    - id: s3
      text:
        en: By default, the engineers who have the Read role on catalog-api can view its Dependabot alerts.
        fr: Par défaut, les ingénieurs qui ont le rôle Read sur catalog-api peuvent consulter ses alertes Dependabot.
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: Dependabot alerts are generated when a new advisory is added to the GitHub Advisory Database or when the dependency graph of a repository changes. Security updates are enabled in the repository or organization settings and don't need a dependabot.yml file, which configures version updates. Dependabot alerts are visible to people with write, maintain or admin access and to organization owners, not to the Read role unless an administrator grants it.
    fr: Les alertes Dependabot sont générées lorsqu'un nouvel avis est ajouté à la GitHub Advisory Database ou lorsque le graphique des dépendances d'un dépôt change. Les mises à jour de sécurité s'activent dans les paramètres du dépôt ou de l'organisation et n'ont pas besoin d'un fichier dependabot.yml, qui configure les mises à jour de version. Les alertes Dependabot sont visibles par les personnes disposant d'un accès write, maintain ou admin et par les propriétaires de l'organisation, pas par le rôle Read sauf si un administrateur le lui accorde.
references:
  - title: Dependabot alerts
    url: https://learn.microsoft.com/en-us/training/modules/configure-dependabot-security-updates-on-github-repo/3-dependabot-alerts
  - title: Dependabot security updates
    url: https://learn.microsoft.com/en-us/training/modules/configure-dependabot-security-updates-on-github-repo/4-dependabot-security-updates
