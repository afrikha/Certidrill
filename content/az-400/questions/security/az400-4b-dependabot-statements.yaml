id: az400-4b-dependabot-statements
objective: "4.3.6"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Wingtip Toys has a GitHub repository named **booking-api**. Its default branch is **main**. Its workflows reference actions such as `actions/setup-dotnet@v4` and `azure/login@v2`. The team has worked for months on a feature branch named **feature/payments** that isn't merged.

    You enable the dependency graph and Dependabot alerts on booking-api today. The repository already contains several vulnerable dependencies.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Wingtip Toys dispose d'un dépôt GitHub nommé **booking-api**. Sa branche par défaut est **main**. Ses workflows référencent des actions comme `actions/setup-dotnet@v4` et `azure/login@v2`. L'équipe travaille depuis des mois sur une branche de fonctionnalité nommée **feature/payments**, qui n'est pas fusionnée.

    Vous activez aujourd'hui le graphe des dépendances et les alertes Dependabot sur booking-api. Le dépôt contient déjà plusieurs dépendances vulnérables.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          GitHub sends a notification for each vulnerable dependency that already exists in main when you enable the alerts.
        fr: |
          GitHub envoie une notification pour chaque dépendance vulnérable déjà présente dans main au moment où vous activez les alertes.
    - id: s2
      text:
        en: |
          The actions referenced by a version tag in the workflows can receive Dependabot alerts.
        fr: |
          Les actions référencées par une balise de version dans les workflows peuvent recevoir des alertes Dependabot.
    - id: s3
      text:
        en: |
          A vulnerable package that is declared only in feature/payments raises a Dependabot alert.
        fr: |
          Un package vulnérable déclaré uniquement dans feature/payments lève une alerte Dependabot.
answer:
  values: { s1: false, s2: true, s3: false }
explanation:
  correct:
    en: |
      When you enable Dependabot alerts, existing vulnerable dependencies get alerts, but GitHub notifies you only about vulnerabilities identified after the alerts are enabled. Alerts cover GitHub Actions referenced with semantic versioning, such as v4, but not actions pinned to a commit SHA. Dependabot scans the default branch only, so a dependency declared only in an unmerged branch doesn't raise an alert.
    fr: |
      Lorsque vous activez les alertes Dependabot, les dépendances vulnérables existantes reçoivent des alertes, mais GitHub ne vous notifie que des vulnérabilités identifiées après l'activation. Les alertes couvrent les actions GitHub référencées par une version sémantique, comme v4, mais pas les actions épinglées sur un SHA de commit. Dependabot n'analyse que la branche par défaut : une dépendance déclarée uniquement dans une branche non fusionnée ne lève pas d'alerte.
references:
  - title: Dependabot alerts
    url: https://learn.microsoft.com/en-us/training/modules/configure-dependabot-security-updates-on-github-repo/3-dependabot-alerts
