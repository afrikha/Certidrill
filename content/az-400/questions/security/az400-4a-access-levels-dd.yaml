id: az400-4a-access-levels-dd
objective: "4.1.6"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Tailspin is adding three users to its Azure DevOps organization. None of the users has a Visual Studio subscription or a GitHub Enterprise license. Licensing costs must be minimized.

    Which access level should you assign to each user? To answer, drag the appropriate access levels to the correct users. Each access level may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin ajoute trois utilisateurs à son organisation Azure DevOps. Aucun d'eux n'a d'abonnement Visual Studio ni de licence GitHub Enterprise. Les coûts de licence doivent être réduits au minimum.

    Quel niveau d'accès devez-vous attribuer à chaque utilisateur ? Pour répondre, faites glisser les niveaux d'accès appropriés vers les utilisateurs correspondants. Chaque niveau d'accès peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: stake, text: Stakeholder }
    - { id: basic, text: Basic }
    - { id: btp, text: Basic + Test Plans }
    - { id: vss, text: Visual Studio subscriber }
  targets:
    - id: t1
      text: { en: "A QA lead who creates test plans and test suites in Azure Test Plans", fr: "Une responsable QA qui crée des plans de test et des suites de tests dans Azure Test Plans" }
    - id: t2
      text: { en: "A developer who pushes code to Azure Repos and edits YAML pipelines", fr: "Un développeur qui pousse du code vers Azure Repos et modifie des pipelines YAML" }
    - id: t3
      text: { en: "A marketing manager who views dashboards and adds work items to the backlog", fr: "Un responsable marketing qui consulte des tableaux de bord et ajoute des éléments de travail au backlog" }
answer:
  mapping: { t1: btp, t2: basic, t3: stake }
explanation:
  correct:
    en: |
      Basic + Test Plans adds Azure Test Plans to the Basic features. Basic gives most features, including Azure Repos and authoring pipelines. Stakeholder is free and gives limited access to work items, boards and dashboards, without code access.
    fr: |
      Basic + Test Plans ajoute Azure Test Plans aux fonctionnalités de Basic. Basic donne accès à la plupart des fonctionnalités, dont Azure Repos et la création de pipelines. Stakeholder est gratuit et donne un accès limité aux éléments de travail, aux tableaux et aux tableaux de bord, sans accès au code.
  options:
    vss:
      en: |
        The Visual Studio subscriber level is for users who already have a Visual Studio subscription; none of these users has one.
      fr: |
        Le niveau Visual Studio subscriber est destiné aux utilisateurs qui ont déjà un abonnement Visual Studio ; aucun de ces utilisateurs n'en a.
references:
  - title: About access levels
    url: https://learn.microsoft.com/en-us/azure/devops/organizations/security/access-levels
