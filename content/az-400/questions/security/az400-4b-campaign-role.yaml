id: az400-4b-campaign-role
objective: "4.3.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Litware, Inc. has deployed the GitHub Advanced Security integration with Microsoft Defender for Cloud for its GitHub organization named **litware**. A security engineer named Megan has the Security Admin role on the Azure subscription that contains the connector and the Admin role on every repository of litware.

    Megan must create a security campaign that covers all the repositories of litware and uses the Runtime Risks filters. The solution must meet the documented prerequisites of the integration.

    What should you grant Megan?
  fr: |
    Litware, Inc. a déployé l'intégration de GitHub Advanced Security avec Microsoft Defender pour le cloud pour son organisation GitHub nommée **litware**. Une ingénieure sécurité nommée Megan a le rôle Security Admin sur l'abonnement Azure qui contient le connecteur et le rôle Admin sur chaque dépôt de litware.

    Megan doit créer une campagne de sécurité qui couvre tous les dépôts de litware et utilise les filtres Runtime Risks. La solution doit respecter les prérequis documentés de l'intégration.

    Que devez-vous accorder à Megan ?
body:
  options:
    - id: a
      text:
        en: "The Owner role on the Azure subscription"
        fr: "Le rôle Owner sur l'abonnement Azure"
    - id: b
      text:
        en: "The owner role in the litware organization"
        fr: "Le rôle de propriétaire (owner) dans l'organisation litware"
    - id: c
      text:
        en: "The Maintain role on every repository of litware"
        fr: "Le rôle Maintain sur chaque dépôt de litware"
    - id: d
      text:
        en: "The Security Reader role on the GitHub connector"
        fr: "Le rôle Security Reader sur le connecteur GitHub"
answer: { optionId: b }
explanation:
  correct:
    en: |
      Security campaigns are created at the GitHub organization level, not per repository, so even the Admin role on every repository isn't enough. The integration's prerequisites list the GitHub organization owner role for connecting repositories and configuring security campaigns, while Security Admin on the subscription, which Megan already has, covers the Defender for Cloud side.
    fr: |
      Les campagnes de sécurité se créent au niveau de l'organisation GitHub, pas par dépôt : même le rôle Admin sur chaque dépôt ne suffit pas. Les prérequis de l'intégration indiquent le rôle de propriétaire de l'organisation GitHub pour connecter les dépôts et configurer les campagnes de sécurité, tandis que Security Admin sur l'abonnement, que Megan possède déjà, couvre la partie Defender pour le cloud.
  options:
    a: { en: "Azure roles don't give permissions in GitHub, where the campaign is created.", fr: "Les rôles Azure ne donnent pas d'autorisations dans GitHub, où la campagne est créée." }
    c: { en: "Maintain is a repository role with fewer permissions than Admin; campaigns need an organization-level role.", fr: "Maintain est un rôle de dépôt qui a moins d'autorisations qu'Admin ; les campagnes exigent un rôle au niveau de l'organisation." }
    d: { en: "Security Reader only lets Megan view findings in Defender for Cloud, which Security Admin already allows.", fr: "Security Reader permet seulement de consulter les résultats dans Defender pour le cloud, ce que Security Admin permet déjà." }
references:
  - title: Deploy GitHub Advanced Security integration with Microsoft Defender for Cloud
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/github-advanced-security-deploy
