id: az400-4a-kv-purge-protection
objective: "4.2.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    You are creating an Azure key vault named **kv-tailspin-prod** for the production secrets used by Tailspin's pipelines. You need to meet the following requirements:

    - A deleted secret or a deleted vault must remain recoverable for 90 days.
    - No one, including the subscription owners, can permanently delete a secret or the vault before those 90 days end.

    Which two actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous créez un coffre de clés Azure nommé **kv-tailspin-prod** pour les secrets de production utilisés par les pipelines de Tailspin. Vous devez répondre aux exigences suivantes :

    - Un secret supprimé ou un coffre supprimé doit rester récupérable pendant 90 jours.
    - Personne, y compris les propriétaires de l'abonnement, ne peut supprimer définitivement un secret ou le coffre avant la fin de ces 90 jours.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Assign the Key Vault Purge Operator role to the security team.", fr: "Attribuer le rôle Key Vault Purge Operator à l'équipe de sécurité." } }
    - { id: b, text: { en: "Set the soft-delete retention period to 90 days when you create the vault.", fr: "Définir la période de rétention de la suppression réversible sur 90 jours lors de la création du coffre." } }
    - { id: c, text: { en: "Configure the vault to use the Azure role-based access control permission model.", fr: "Configurer le coffre pour qu'il utilise le modèle d'autorisation contrôle d'accès en fonction du rôle Azure." } }
    - { id: d, text: { en: "Schedule a daily backup of each secret by running az keyvault secret backup.", fr: "Planifier une sauvegarde quotidienne de chaque secret en exécutant az keyvault secret backup." } }
    - { id: e, text: { en: "Enable purge protection on the vault.", fr: "Activer la protection contre la suppression définitive sur le coffre." } }
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: |
      Soft delete is on for every new vault, with a retention period from 7 to 90 days that can be set only when the vault is created. Purge protection, which is off by default, prevents purging a deleted vault or object until the retention period ends; without it, a subscription owner or a Key Vault Purge Operator can purge earlier.
    fr: |
      La suppression réversible est activée pour chaque nouveau coffre, avec une période de rétention de 7 à 90 jours qui ne peut être définie qu'à la création du coffre. La protection contre la suppression définitive, désactivée par défaut, empêche de purger un coffre ou un objet supprimé avant la fin de la période de rétention ; sans elle, un propriétaire de l'abonnement ou un Key Vault Purge Operator peut purger plus tôt.
  options:
    a:
      en: |
        Key Vault Purge Operator grants the right to purge soft-deleted vaults, which is the opposite of the requirement.
      fr: |
        Key Vault Purge Operator accorde le droit de purger les coffres supprimés de manière réversible, soit l'inverse de l'exigence.
    c:
      en: |
        The permission model controls data plane access; it doesn't change retention or prevent purging.
      fr: |
        Le modèle d'autorisation contrôle l'accès au plan de données ; il ne change pas la rétention et n'empêche pas la purge.
    d:
      en: |
        Backups help restore data, but they don't prevent anyone from purging a secret or the vault.
      fr: |
        Les sauvegardes aident à restaurer des données, mais n'empêchent personne de purger un secret ou le coffre.
references:
  - title: Azure Key Vault soft-delete
    url: https://learn.microsoft.com/en-us/azure/key-vault/general/soft-delete-overview
