id: az400-4b-ghas-ado-statements
objective: "4.3.3"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Northwind Traders has an Azure DevOps project named **Logistics** that contains a Git repository named **routing**. The repository has been in use for three years. You enable GitHub Secret Protection for Azure DevOps on routing and select **Begin billing**. You don't change any other setting.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind Traders dispose d'un projet Azure DevOps nommé **Logistics** qui contient un dépôt Git nommé **routing**. Le dépôt est utilisé depuis trois ans. Vous activez GitHub Secret Protection for Azure DevOps sur routing et sélectionnez **Begin billing**. Vous ne modifiez aucun autre paramètre.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          Secret scanning alerts can be raised for secrets in commits that were made before you enabled Secret Protection.
        fr: |
          Des alertes d'analyse des secrets peuvent être levées pour des secrets présents dans des commits effectués avant l'activation de Secret Protection.
    - id: s2
      text:
        en: |
          When a developer adds skip-secret-scanning:true to the commit message to push a blocked secret, no secret scanning alert is created for that secret.
        fr: |
          Lorsqu'un développeur ajoute skip-secret-scanning:true au message de commit pour pousser un secret bloqué, aucune alerte d'analyse des secrets n'est créée pour ce secret.
    - id: s3
      text:
        en: |
          Members of the Contributors group of Logistics can dismiss the secret scanning alerts of routing.
        fr: |
          Les membres du groupe Contributors de Logistics peuvent fermer les alertes d'analyse des secrets de routing.
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: |
      Enabling Secret Protection turns on push protection and repository scanning, and repository scanning detects existing secrets, including those in historical commits. Bypassing push protection with skip-secret-scanning:true lets the push through, but an alert is still generated once the secret is pushed. Contributors can view the alerts of a repository, but dismissing an alert requires Project Administrator permissions.
    fr: |
      L'activation de Secret Protection active la protection push et l'analyse du dépôt, et l'analyse du dépôt détecte les secrets existants, y compris ceux des commits historiques. Contourner la protection push avec skip-secret-scanning:true laisse passer le push, mais une alerte est quand même générée une fois le secret poussé. Les Contributors peuvent afficher les alertes d'un dépôt, mais fermer une alerte exige les autorisations Project Administrator.
references:
  - title: Set up secret scanning for GitHub Advanced Security
    url: https://learn.microsoft.com/en-us/azure/devops/repos/security/github-advanced-security-secret-scanning
  - title: Configure GitHub Advanced Security for Azure DevOps features
    url: https://learn.microsoft.com/en-us/azure/devops/repos/security/configure-github-advanced-security-features
