id: az400-4a-gh-security-manager
objective: "4.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Contoso's GitHub organization contains 140 repositories, and new repositories are created every week. The members of a team named **appsec** must view the security alerts of every repository and manage the settings of security features across the organization.

    The appsec members must not be able to change other organization settings or delete repositories. The solution must minimize administrative effort.

    What should you do?
  fr: |
    L'organisation GitHub de Contoso contient 140 dépôts, et de nouveaux dépôts sont créés chaque semaine. Les membres d'une équipe nommée **appsec** doivent consulter les alertes de sécurité de tous les dépôts et gérer les paramètres des fonctionnalités de sécurité dans l'ensemble de l'organisation.

    Les membres d'appsec ne doivent pas pouvoir modifier les autres paramètres de l'organisation ni supprimer des dépôts. La solution doit réduire au minimum l'effort d'administration.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Assign the security manager role to the appsec team.", fr: "Attribuer le rôle de gestionnaire de sécurité à l'équipe appsec." } }
    - { id: b, text: { en: "Make the members of the appsec team organization owners.", fr: "Faire des membres de l'équipe appsec des propriétaires de l'organisation." } }
    - { id: c, text: { en: "Give the appsec team the Admin role on every repository.", fr: "Donner à l'équipe appsec le rôle Admin sur chaque dépôt." } }
    - { id: d, text: { en: "Set the base permission of the organization to Admin.", fr: "Définir l'autorisation de base de l'organisation sur Admin." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      The security manager role can be assigned to a team. It lets its members view security alerts and manage security feature settings across the organization, with read access to all repositories, including repositories created later. It grants no other administrative right.
    fr: |
      Le rôle de gestionnaire de sécurité peut être attribué à une équipe. Il permet à ses membres de consulter les alertes de sécurité et de gérer les paramètres des fonctionnalités de sécurité dans toute l'organisation, avec un accès en lecture à tous les dépôts, y compris ceux créés ultérieurement. Il n'accorde aucun autre droit d'administration.
  options:
    b:
      en: |
        Owners have full administrative control, including every organization setting and repository deletion.
      fr: |
        Les propriétaires disposent d'un contrôle administratif complet, y compris sur tous les paramètres de l'organisation et la suppression des dépôts.
    c:
      en: |
        Admin on each repository lets the team delete repositories, and it must be granted again for every new repository.
      fr: |
        Admin sur chaque dépôt permet à l'équipe de supprimer des dépôts, et il faut l'accorder de nouveau pour chaque nouveau dépôt.
    d:
      en: |
        A base permission applies to every member of the organization, not only to appsec, and Admin lets them delete repositories.
      fr: |
        Une autorisation de base s'applique à tous les membres de l'organisation, pas seulement à appsec, et Admin leur permet de supprimer des dépôts.
references:
  - title: Configure repository permissions using GitHub
    url: https://learn.microsoft.com/en-us/training/modules/manage-git-repositories/12-configure-source-control-repository-permissions-use-github
