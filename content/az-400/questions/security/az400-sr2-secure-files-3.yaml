id: az400-sr2-secure-files-3
objective: "4.2.3"
type: series_yesno
series: az400-sr2-secure-files
seriesOrder: 3
difficulty: 3
status: draft
stem:
  en: You publish the keystore as a Universal Package to a restricted Azure Artifacts feed.
  fr: Vous publiez le magasin de clés en tant que package universel dans un flux Azure Artifacts restreint.
body:
  solution:
    en: |
      You publish release.jks as a Universal Package to a new Azure Artifacts feed named **mobile-signing**. You remove all permissions on the feed except read access for the build service identity of the Mobile project, and you ask Mobile Security to review the feed's activity. android-release downloads the package from the feed in its first step.
    fr: |
      Vous publiez release.jks en tant que package universel dans un nouveau flux Azure Artifacts nommé **mobile-signing**. Vous supprimez toutes les autorisations sur le flux, sauf l'accès en lecture pour l'identité du service de build du projet Mobile, et vous demandez à Mobile Security de passer en revue l'activité du flux. android-release télécharge le package depuis le flux lors de sa première étape.
answer: { value: false }
explanation:
  correct:
    en: Approvals and checks can be configured on environments, service connections, repositories, variable groups, secure files and agent pools, not on Azure Artifacts feeds, so no run waits for Mobile Security. In addition, the project build service identity is shared by every pipeline of Mobile, so android-ci could also download the keystore.
    fr: Les approbations et vérifications peuvent être configurées sur les environnements, les connexions de service, les dépôts, les groupes de variables, les fichiers sécurisés et les pools d'agents, mais pas sur les flux Azure Artifacts ; aucune exécution n'attend donc Mobile Security. De plus, l'identité du service de build du projet est partagée par tous les pipelines de Mobile ; android-ci pourrait donc aussi télécharger le magasin de clés.
references:
  - title: Pipeline deployment approvals - Azure Pipelines
    url: https://learn.microsoft.com/en-us/azure/devops/pipelines/process/approvals
