id: az400-sr2-secure-files-1
objective: "4.2.3"
type: series_yesno
series: az400-sr2-secure-files
seriesOrder: 1
difficulty: 2
status: draft
stem:
  en: You upload a secure file, authorize android-release only, and add an approval check.
  fr: Vous chargez un fichier sécurisé, autorisez uniquement android-release et ajoutez une vérification d'approbation.
body:
  solution:
    en: |
      You upload release.jks to **Pipelines** > **Library** > **Secure files**. In the **Pipeline permissions** of the file, you add only android-release. In **Approvals and checks**, you add an **Approvals** check with the Mobile Security group as approver. You add the following steps to android-release.

      ```yaml
      steps:
      - task: DownloadSecureFile@1
        name: keystore
        inputs:
          secureFile: 'release.jks'
      - script: echo "Signing with $(keystore.secureFilePath)"
      ```
    fr: |
      Vous chargez release.jks dans **Pipelines** > **Library** > **Secure files**. Dans les **Pipeline permissions** du fichier, vous ajoutez uniquement android-release. Dans **Approvals and checks**, vous ajoutez une vérification **Approvals** avec le groupe Mobile Security comme approbateur. Vous ajoutez les étapes suivantes à android-release.

      ```yaml
      steps:
      - task: DownloadSecureFile@1
        name: keystore
        inputs:
          secureFile: 'release.jks'
      - script: echo "Signing with $(keystore.secureFilePath)"
      ```
answer: { value: true }
explanation:
  correct:
    en: Secure files are stored encrypted on the server, are limited to 10 MB each, and a YAML pipeline can use one only after it is authorized in the file's pipeline permissions. Secure files support approvals and checks, so each run waits for Mobile Security before `DownloadSecureFile@1` downloads the file and exposes its path in `secureFilePath`.
    fr: Les fichiers sécurisés sont stockés chiffrés sur le serveur, sont limités à 10 Mo chacun, et un pipeline YAML ne peut en utiliser un qu'après avoir été autorisé dans les permissions de pipeline du fichier. Les fichiers sécurisés prennent en charge les approbations et vérifications ; chaque exécution attend donc Mobile Security avant que `DownloadSecureFile@1` télécharge le fichier et expose son chemin dans `secureFilePath`.
references:
  - title: Secure files for Azure Pipelines - Azure Pipelines
    url: https://learn.microsoft.com/en-us/azure/devops/pipelines/library/secure-files
  - title: Pipeline deployment approvals - Azure Pipelines
    url: https://learn.microsoft.com/en-us/azure/devops/pipelines/process/approvals
