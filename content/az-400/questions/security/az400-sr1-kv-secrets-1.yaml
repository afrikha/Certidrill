id: az400-sr1-kv-secrets-1
objective: "4.2.1"
type: series_yesno
series: az400-sr1-kv-secrets
seriesOrder: 1
difficulty: 1
status: draft
stem:
  en: You assign Key Vault Secrets User to the identity of sc-prod and add an AzureKeyVault@2 task.
  fr: Vous attribuez Key Vault Secrets User à l'identité de sc-prod et ajoutez une tâche AzureKeyVault@2.
body:
  solution:
    en: |
      You assign the **Key Vault Secrets User** role on kv-proseware-prod to the identity of sc-prod. You add the following task at the start of the deployment job and reference the secrets as `$(SqlPassword)` and `$(ApiKey)` in the later steps.

      ```yaml
      - task: AzureKeyVault@2
        inputs:
          azureSubscription: 'sc-prod'
          KeyVaultName: 'kv-proseware-prod'
          SecretsFilter: 'SqlPassword,ApiKey'
          RunAsPreJob: false
      ```
    fr: |
      Vous attribuez le rôle **Key Vault Secrets User** sur kv-proseware-prod à l'identité de sc-prod. Vous ajoutez la tâche suivante au début du travail de déploiement et référencez les secrets sous la forme `$(SqlPassword)` et `$(ApiKey)` dans les étapes suivantes.

      ```yaml
      - task: AzureKeyVault@2
        inputs:
          azureSubscription: 'sc-prod'
          KeyVaultName: 'kv-proseware-prod'
          SecretsFilter: 'SqlPassword,ApiKey'
          RunAsPreJob: false
      ```
answer: { value: true }
explanation:
  correct:
    en: The AzureKeyVault@2 task downloads the selected secrets from the key vault at run time and exposes them as secret variables to the later steps, so the values are never stored in Azure DevOps and a rotated secret is read by the next run. Key Vault Secrets User only allows reading secret contents, which is the least privilege for this need.
    fr: "La tâche AzureKeyVault@2 télécharge les secrets sélectionnés depuis le coffre de clés au moment de l'exécution et les expose comme variables secrètes aux étapes suivantes : les valeurs ne sont jamais stockées dans Azure DevOps et un secret renouvelé est lu par l'exécution suivante. Key Vault Secrets User permet uniquement de lire le contenu des secrets, ce qui constitue le privilège minimum pour ce besoin."
references:
  - title: Use Azure Key Vault secrets in Azure Pipelines
    url: https://learn.microsoft.com/en-us/azure/devops/pipelines/release/azure-key-vault
  - title: Provide access to Key Vault keys, certificates, and secrets with Azure role-based access control
    url: https://learn.microsoft.com/en-us/azure/key-vault/general/rbac-guide
