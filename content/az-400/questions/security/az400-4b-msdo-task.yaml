id: az400-4b-msdo-task
objective: "4.3.2"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    Fabrikam has an Azure DevOps organization connected to Microsoft Defender for Cloud. The Microsoft Security DevOps extension is installed. A repository contains Bicep templates and a Dockerfile.

    You need to add a scan to the pipeline of the repository. The solution must meet the following requirements:

    - Run only the analyzers for infrastructure as code and container images.
    - Fail the step when a high-severity result is found.
    - Make the results available to Defender for Cloud.

    How should you complete the YAML? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam dispose d'une organisation Azure DevOps connectée à Microsoft Defender pour le cloud. L'extension Microsoft Security DevOps est installée. Un dépôt contient des modèles Bicep et un Dockerfile.

    Vous devez ajouter une analyse au pipeline du dépôt. La solution doit répondre aux exigences suivantes :

    - Exécuter uniquement les analyseurs de l'infrastructure as code et des images conteneur.
    - Faire échouer l'étape quand un résultat de gravité élevée est trouvé.
    - Mettre les résultats à la disposition de Defender pour le cloud.

    Comment devez-vous compléter le YAML ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: yaml
  template: |
    trigger:
    - main

    pool:
      vmImage: ubuntu-latest

    steps:
    - task: [[task]]
      displayName: Microsoft Security DevOps
      inputs:
        categories: [[categories]]
        [[fail]]
        publish: true
        artifactName: [[artifact]]
  slots:
    - id: task
      options:
        - { id: msdo, text: MicrosoftSecurityDevOps@1 }
        - { id: cli, text: MicrosoftDefenderCLI@2 }
        - { id: codeql, text: AdvancedSecurity-Codeql-Analyze@1 }
    - id: categories
      options:
        - { id: codeart, text: "'code,artifacts'" }
        - { id: iaccont, text: "'IaC,containers'" }
        - { id: codeiac, text: "'code,IaC'" }
    - id: fail
      options:
        - { id: policy, text: "policy: 'microsoft'" }
        - { id: breaktrue, text: "break: true" }
        - { id: breakfalse, text: "break: false" }
    - id: artifact
      options:
        - { id: drop, text: drop }
        - { id: sarif, text: SarifResults }
        - { id: logs, text: CodeAnalysisLogs }
answer:
  values: { task: msdo, categories: iaccont, fail: breaktrue, artifact: logs }
explanation:
  correct:
    en: |
      The extension adds the MicrosoftSecurityDevOps@1 task. `categories` selects analyzer families among code, artifacts, IaC and containers, so `'IaC,containers'` runs tools such as Template Analyzer, Checkov and Trivy only. `break: true` fails the step on high-severity results (the default is false). Defender for Cloud reads the SARIF results from the pipeline artifact named CodeAnalysisLogs, which is required for the integration.
    fr: |
      L'extension ajoute la tâche MicrosoftSecurityDevOps@1. `categories` sélectionne des familles d'analyseurs parmi code, artifacts, IaC et containers : `'IaC,containers'` n'exécute que des outils comme Template Analyzer, Checkov et Trivy. `break: true` fait échouer l'étape sur les résultats de gravité élevée (la valeur par défaut est false). Defender pour le cloud lit les résultats SARIF dans l'artefact de pipeline nommé CodeAnalysisLogs, obligatoire pour l'intégration.
  options:
    cli: { en: "The Defender for Cloud CLI task scans container images; it doesn't take the categories input of MSDO or scan Bicep templates.", fr: "La tâche Defender for Cloud CLI analyse les images conteneur ; elle ne prend pas l'entrée categories de MSDO et n'analyse pas les modèles Bicep." }
    codeql: { en: "The CodeQL Analyze task belongs to GitHub Code Security for Azure DevOps and analyzes source code.", fr: "La tâche CodeQL Analyze appartient à GitHub Code Security for Azure DevOps et analyse le code source." }
    codeart: { en: "These categories run code and binary analyzers, not the IaC and container ones.", fr: "Ces catégories exécutent les analyseurs de code et de binaires, pas ceux de l'IaC et des conteneurs." }
    codeiac: { en: "This adds code analyzers and omits container image analysis.", fr: "Cela ajoute les analyseurs de code et omet l'analyse des images conteneur." }
    policy: { en: "policy selects a well-known set of tools when no list is given; it doesn't fail the step.", fr: "policy sélectionne un ensemble d'outils connu quand aucune liste n'est fournie ; elle ne fait pas échouer l'étape." }
    breakfalse: { en: "false is the default and lets the step succeed whatever the results.", fr: "false est la valeur par défaut et laisse l'étape réussir quels que soient les résultats." }
    drop: { en: "Defender for Cloud monitors only the CodeAnalysisLogs artifact.", fr: "Defender pour le cloud ne surveille que l'artefact CodeAnalysisLogs." }
    sarif: { en: "Defender for Cloud monitors only the CodeAnalysisLogs artifact.", fr: "Defender pour le cloud ne surveille que l'artefact CodeAnalysisLogs." }
references:
  - title: Configure the Microsoft Security DevOps Azure DevOps extension
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/azure-devops-extension
