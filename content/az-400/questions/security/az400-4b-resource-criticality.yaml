id: az400-4b-resource-criticality
objective: "4.3.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Contoso, Ltd. has deployed the GitHub Advanced Security integration with Microsoft Defender for Cloud for its GitHub organization. An Azure Kubernetes Service (AKS) cluster named **aks-payments** runs the containers built from the repository **contoso/payments**.

    The code scanning alerts of contoso/payments already show the Internet Exposure runtime risk factor in GitHub. The security team wants these alerts to also show the Critical Resources risk factor, because aks-payments processes card data.

    What should you do?
  fr: |
    Contoso, Ltd. a déployé l'intégration de GitHub Advanced Security avec Microsoft Defender pour le cloud pour son organisation GitHub. Un cluster Azure Kubernetes Service (AKS) nommé **aks-payments** exécute les conteneurs générés à partir du dépôt **contoso/payments**.

    Les alertes d'analyse du code de contoso/payments affichent déjà le facteur de risque d'exécution Internet Exposure dans GitHub. L'équipe de sécurité souhaite qu'elles affichent aussi le facteur Critical Resources, car aks-payments traite des données de cartes bancaires.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text:
        en: "In GitHub, add a custom property named critical to the contoso/payments repository."
        fr: "Dans GitHub, ajouter une propriété personnalisée nommée critical au dépôt contoso/payments."
    - id: b
      text:
        en: "In Defender for Cloud, classify aks-payments as critical in Settings > Resource criticality."
        fr: "Dans Defender pour le cloud, classer aks-payments comme critique dans Settings > Resource criticality."
    - id: c
      text:
        en: "In GitHub, create a campaign that contains the code scanning alerts of severity Critical."
        fr: "Dans GitHub, créer une campagne qui contient les alertes d'analyse du code de gravité Critical."
    - id: d
      text:
        en: "In Defender for Cloud, deploy the Defender sensor to aks-payments."
        fr: "Dans Defender pour le cloud, déployer le capteur Defender sur aks-payments."
answer: { optionId: b }
explanation:
  correct:
    en: |
      The runtime risk factors attached to GHAS alerts (Internet Exposure, Sensitive Data, Critical Resources, Lateral Movement) come from Defender CSPM attack path analysis. Critical Resources depends on resource criticality, which you set in Defender for Cloud under Settings > Resource criticality. After the classification, the data can take up to 12 hours to reach GitHub.
    fr: |
      Les facteurs de risque d'exécution associés aux alertes GHAS (Internet Exposure, Sensitive Data, Critical Resources, Lateral Movement) proviennent de l'analyse des chemins d'attaque de Defender CSPM. Critical Resources dépend de la criticité des ressources, que vous définissez dans Defender pour le cloud sous Settings > Resource criticality. Après la classification, les données peuvent mettre jusqu'à 12 heures pour parvenir à GitHub.
  options:
    a: { en: "Custom properties classify repositories inside GitHub; Defender for Cloud doesn't read them to compute runtime risk.", fr: "Les propriétés personnalisées classent les dépôts dans GitHub ; Defender pour le cloud ne les lit pas pour calculer le risque d'exécution." }
    c: { en: "Alert severity describes the code flaw, not the criticality of the workload where the code runs.", fr: "La gravité d'une alerte décrit la faille du code, pas la criticité de la charge de travail où le code s'exécute." }
    d: { en: "The sensor improves runtime inventory and threat detection, but criticality is a classification that you must define.", fr: "Le capteur améliore l'inventaire d'exécution et la détection des menaces, mais la criticité est une classification que vous devez définir." }
references:
