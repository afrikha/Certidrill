id: az400-4a-kv-roles-dd
objective: "4.2.1"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    Contoso has an Azure key vault named **kv-contoso-prod** that uses the Azure role-based access control permission model. Three groups of principals need access to the vault. Each must receive the least privileged built-in role, assigned at the vault scope.

    Which role should you assign to each group of principals? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso dispose d'un coffre de clés Azure nommé **kv-contoso-prod** qui utilise le modèle d'autorisation contrôle d'accès en fonction du rôle Azure. Trois groupes de principaux ont besoin d'accéder au coffre. Chacun doit recevoir le rôle intégré le moins privilégié, attribué à l'étendue du coffre.

    Quel rôle devez-vous attribuer à chaque groupe de principaux ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Release engineers create, update and delete secrets, without managing keys, certificates or permissions: [[r1]]

      The identity of the pipeline service connection reads secret values during deployments: [[r2]]

      Compliance auditors list secret names and expiration dates, without reading secret values: [[r3]]
    fr: |
      Les ingénieurs de mise en production créent, modifient et suppriment des secrets, sans gérer les clés, les certificats ni les autorisations : [[r1]]

      L'identité de la connexion de service du pipeline lit les valeurs des secrets pendant les déploiements : [[r2]]

      Les auditeurs de conformité listent les noms des secrets et leurs dates d'expiration, sans lire les valeurs : [[r3]]
  slots:
    - id: r1
      options:
        - { id: so, text: Key Vault Secrets Officer }
        - { id: su, text: Key Vault Secrets User }
        - { id: rd, text: Key Vault Reader }
        - { id: adm, text: Key Vault Administrator }
    - id: r2
      options:
        - { id: so, text: Key Vault Secrets Officer }
        - { id: su, text: Key Vault Secrets User }
        - { id: rd, text: Key Vault Reader }
        - { id: adm, text: Key Vault Administrator }
    - id: r3
      options:
        - { id: so, text: Key Vault Secrets Officer }
        - { id: su, text: Key Vault Secrets User }
        - { id: rd, text: Key Vault Reader }
        - { id: adm, text: Key Vault Administrator }
answer:
  values: { r1: so, r2: su, r3: rd }
explanation:
  correct:
    en: |
      Key Vault Secrets Officer performs any action on secrets except managing permissions. Key Vault Secrets User reads secret contents, which is all a pipeline identity needs. Key Vault Reader reads the metadata of the vault and its objects but never secret contents.
    fr: |
      Key Vault Secrets Officer effectue toute action sur les secrets, sauf la gestion des autorisations. Key Vault Secrets User lit le contenu des secrets, ce qui suffit à l'identité d'un pipeline. Key Vault Reader lit les métadonnées du coffre et de ses objets, mais jamais le contenu des secrets.
  options:
    adm:
      en: |
        Key Vault Administrator performs all data plane operations on certificates, keys and secrets, more than any of these groups needs.
      fr: |
        Key Vault Administrator effectue toutes les opérations du plan de données sur les certificats, les clés et les secrets, plus qu'aucun de ces groupes n'en a besoin.
references:
  - title: Provide access to Key Vault keys, certificates, and secrets with Azure role-based access control
    url: https://learn.microsoft.com/en-us/azure/key-vault/general/rbac-guide
