id: az400-4b-dependabot-yml
objective: "4.3.6"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Adatum Corporation has a GitHub repository that contains a .NET solution in the **/src** folder and GitHub Actions workflows in **.github/workflows**. Dependabot alerts are enabled.

    You need to configure Dependabot to meet the following requirements:

    - Check the NuGet packages in /src every week.
    - Never open a pull request for a major version update of the packages whose names start with **Serilog**.
    - Check the actions used by the workflows once a month.

    How should you complete the .github/dependabot.yml file? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum Corporation dispose d'un dépôt GitHub qui contient une solution .NET dans le dossier **/src** et des workflows GitHub Actions dans **.github/workflows**. Les alertes Dependabot sont activées.

    Vous devez configurer Dependabot pour répondre aux exigences suivantes :

    - Vérifier chaque semaine les packages NuGet de /src.
    - Ne jamais ouvrir de pull request pour une mise à jour de version majeure des packages dont le nom commence par **Serilog**.
    - Vérifier une fois par mois les actions utilisées par les workflows.

    Comment devez-vous compléter le fichier .github/dependabot.yml ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: yaml
  template: |
    version: 2
    updates:
      - package-ecosystem: [[eco1]]
        directory: "/src"
        schedule:
          interval: "weekly"
        ignore:
          - dependency-name: "Serilog*"
            update-types:
              - [[updatetype]]
      - package-ecosystem: [[eco2]]
        directory: "/"
        schedule:
          interval: [[interval]]
  slots:
    - id: eco1
      options:
        - { id: dotnetsdk, text: "\"dotnet-sdk\"" }
        - { id: nuget, text: "\"nuget\"" }
        - { id: maven, text: "\"maven\"" }
    - id: updatetype
      options:
        - { id: patch, text: "\"version-update:semver-patch\"" }
        - { id: minor, text: "\"version-update:semver-minor\"" }
        - { id: major, text: "\"version-update:semver-major\"" }
    - id: eco2
      options:
        - { id: docker, text: "\"docker\"" }
        - { id: submodule, text: "\"gitsubmodule\"" }
        - { id: actions, text: "\"github-actions\"" }
    - id: interval
      options:
        - { id: daily, text: "\"daily\"" }
        - { id: weekly, text: "\"weekly\"" }
        - { id: monthly, text: "\"monthly\"" }
answer:
  values: { eco1: nuget, updatetype: major, eco2: actions, interval: monthly }
explanation:
  correct:
    en: |
      The `nuget` ecosystem checks the NuGet packages of the given directory. An `ignore` entry with `dependency-name` (where `*` matches any characters) and `update-types` set to `version-update:semver-major` skips only major updates of the matching packages. The `github-actions` ecosystem with the directory `/` checks the actions used in .github/workflows, here on a `monthly` schedule.
    fr: |
      L'écosystème `nuget` vérifie les packages NuGet du répertoire indiqué. Une entrée `ignore` avec `dependency-name` (où `*` correspond à n'importe quels caractères) et `update-types` défini sur `version-update:semver-major` n'ignore que les mises à jour majeures des packages correspondants. L'écosystème `github-actions` avec le répertoire `/` vérifie les actions utilisées dans .github/workflows, ici selon une planification `monthly`.
  options:
    dotnetsdk: { en: "dotnet-sdk updates the .NET SDK version, not the NuGet packages.", fr: "dotnet-sdk met à jour la version du SDK .NET, pas les packages NuGet." }
    maven: { en: "maven is the ecosystem of Java packages.", fr: "maven est l'écosystème des packages Java." }
    patch: { en: "Ignoring patch updates would still allow major updates.", fr: "Ignorer les mises à jour correctives autoriserait toujours les mises à jour majeures." }
    minor: { en: "Ignoring minor updates would still allow major updates.", fr: "Ignorer les mises à jour mineures autoriserait toujours les mises à jour majeures." }
    docker: { en: "docker updates image tags in Dockerfiles, not the actions of the workflows.", fr: "docker met à jour les balises d'image des Dockerfiles, pas les actions des workflows." }
    submodule: { en: "gitsubmodule updates Git submodules.", fr: "gitsubmodule met à jour les sous-modules Git." }
references:
  - title: Dependabot security updates
    url: https://learn.microsoft.com/en-us/training/modules/configure-dependabot-security-updates-on-github-repo/4-dependabot-security-updates
