id: az400-4a-cli-project-team
objective: "4.1.7"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    You need to create a private Azure DevOps project named **Tailspin-Web** in the organization **tailspin**, and then add a team named **Checkout Team** to it. The project must use the process whose backlog contains the Product Backlog Item and Impediment work item types.

    How should you complete the commands? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez créer un projet Azure DevOps privé nommé **Tailspin-Web** dans l'organisation **tailspin**, puis y ajouter une équipe nommée **Checkout Team**. Le projet doit utiliser le processus dont le backlog contient les types d'éléments de travail Product Backlog Item et Impediment.

    Comment devez-vous compléter les commandes ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: bash
  template: |
    az devops [[s1]] --name Tailspin-Web --process [[s2]] \
      --source-control git --visibility private --org https://dev.azure.com/tailspin

    az devops [[s3]] --name "Checkout Team" --project Tailspin-Web \
      --org https://dev.azure.com/tailspin
  slots:
    - id: s1
      options:
        - { id: pc, text: project create }
        - { id: tc, text: team create }
        - { id: pa, text: project add }
    - id: s2
      options:
        - { id: agile, text: Agile }
        - { id: scrum, text: Scrum }
        - { id: cmmi, text: CMMI }
        - { id: basic, text: Basic }
    - id: s3
      options:
        - { id: tc, text: team create }
        - { id: sg, text: security group create }
        - { id: ua, text: user add }
answer:
  values: { s1: pc, s2: scrum, s3: tc }
explanation:
  correct:
    en: "`az devops project create` creates the project with its process, source control type and visibility. The Scrum process uses Product Backlog Items and Impediments. `az devops team create` adds a team to the project, which also creates the team's security group and default dashboard."
    fr: "`az devops project create` crée le projet avec son processus, son type de contrôle de code source et sa visibilité. Le processus Scrum utilise les Product Backlog Items et les Impediments. `az devops team create` ajoute une équipe au projet, ce qui crée aussi le groupe de sécurité et le tableau de bord par défaut de l'équipe."
  options:
    agile:
      en: |
        Agile uses User Story and Issue work items.
      fr: |
        Agile utilise les éléments de travail User Story et Issue.
    cmmi:
      en: |
        CMMI uses Requirement, Change Request and Issue work items.
      fr: |
        CMMI utilise les éléments de travail Requirement, Change Request et Issue.
    basic:
      en: |
        Basic uses Epic, Issue and Task work items only.
      fr: |
        Basic utilise uniquement les éléments de travail Epic, Issue et Task.
    sg:
      en: |
        A security group alone isn't a team; it has no backlog, board or team settings.
      fr: |
        Un groupe de sécurité seul n'est pas une équipe ; il n'a ni backlog, ni tableau, ni paramètres d'équipe.
references:
  - title: Create a project in Azure DevOps
    url: https://learn.microsoft.com/en-us/azure/devops/organizations/projects/create-project
  - title: Create or add a team
    url: https://learn.microsoft.com/en-us/azure/devops/organizations/settings/add-teams
