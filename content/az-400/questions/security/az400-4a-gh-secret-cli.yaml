id: az400-4a-gh-secret-cli
objective: "4.2.2"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    You use the GitHub CLI to create two GitHub Actions secrets in the organization **contoso**:

    - **NPM_TOKEN** must be available only to the repositories **contoso/api** and **contoso/web**.
    - **SQL_PASSWORD** must be readable only by the jobs of contoso/api that reference the **production** environment.

    How should you complete the commands? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous utilisez l'interface CLI GitHub pour créer deux secrets GitHub Actions dans l'organisation **contoso** :

    - **NPM_TOKEN** doit être disponible uniquement pour les dépôts **contoso/api** et **contoso/web**.
    - **SQL_PASSWORD** doit être lisible uniquement par les jobs de contoso/api qui référencent l'environnement **production**.

    Comment devez-vous compléter les commandes ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: bash
  template: |
    gh secret set NPM_TOKEN [[s1]] contoso [[s2]] api,web

    gh secret set SQL_PASSWORD [[s3]] production --repo contoso/api
  slots:
    - id: s1
      options:
        - { id: org, text: "--org" }
        - { id: repo, text: "--repo" }
        - { id: user, text: "--user" }
        - { id: env, text: "--env" }
    - id: s2
      options:
        - { id: repos, text: "--repos" }
        - { id: vis, text: "--visibility" }
        - { id: app, text: "--app" }
    - id: s3
      options:
        - { id: env, text: "--env" }
        - { id: org, text: "--org" }
        - { id: app, text: "--app" }
answer:
  values: { s1: org, s2: repos, s3: env }
explanation:
  correct:
    en: "`--org` creates an organization secret, and `--repos` lists the repositories that can access it, which sets a selected-repositories access policy. `--env` creates an environment secret; jobs can read it only when they reference that environment and its protection rules pass."
    fr: "`--org` crée un secret d'organisation, et `--repos` liste les dépôts qui peuvent y accéder, ce qui définit une stratégie d'accès limitée aux dépôts sélectionnés. `--env` crée un secret d'environnement ; les jobs ne peuvent le lire que s'ils référencent cet environnement et que ses règles de protection sont satisfaites."
  options:
    repo:
      en: "`--repo` selects a repository in OWNER/REPO format; it can't create an organization secret."
      fr: "`--repo` sélectionne un dépôt au format OWNER/REPO ; il ne peut pas créer de secret d'organisation."
    user:
      en: "`--user` creates a user secret for Codespaces, not an organization secret for GitHub Actions."
      fr: "`--user` crée un secret d'utilisateur pour Codespaces, pas un secret d'organisation pour GitHub Actions."
    vis:
      en: "`--visibility` takes all, private or selected, not a list of repositories."
      fr: "`--visibility` accepte all, private ou selected, pas une liste de dépôts."
    app:
      en: "`--app` chooses the application of the secret (actions, codespaces or dependabot), not its scope."
      fr: "`--app` choisit l'application du secret (actions, codespaces ou dependabot), pas son étendue."
references:
  - title: Control deployments with GitHub environments
    url: https://learn.microsoft.com/en-us/training/modules/deploy-model-github-actions/4-control-deployments-github-environments
