id: az400-sr1-kv-secrets-2
objective: "4.2.1"
type: series_yesno
series: az400-sr1-kv-secrets
seriesOrder: 2
difficulty: 2
status: draft
stem:
  en: You assign Key Vault Reader to the identity of sc-prod and add an AzureKeyVault@2 task.
  fr: Vous attribuez Key Vault Reader à l'identité de sc-prod et ajoutez une tâche AzureKeyVault@2.
body:
  solution:
    en: |
      You assign the **Key Vault Reader** role on kv-proseware-prod to the identity of sc-prod. You add the following task at the start of the deployment job and reference the secrets as `$(SqlPassword)` and `$(ApiKey)` in the later steps.

      ```yaml
      - task: AzureKeyVault@2
        inputs:
          azureSubscription: 'sc-prod'
          KeyVaultName: 'kv-proseware-prod'
          SecretsFilter: 'SqlPassword,ApiKey'
          RunAsPreJob: false
      ```
    fr: |
      Vous attribuez le rôle **Key Vault Reader** sur kv-proseware-prod à l'identité de sc-prod. Vous ajoutez la tâche suivante au début du travail de déploiement et référencez les secrets sous la forme `$(SqlPassword)` et `$(ApiKey)` dans les étapes suivantes.

      ```yaml
      - task: AzureKeyVault@2
        inputs:
          azureSubscription: 'sc-prod'
          KeyVaultName: 'kv-proseware-prod'
          SecretsFilter: 'SqlPassword,ApiKey'
          RunAsPreJob: false
      ```
answer: { value: false }
explanation:
  correct:
    en: The task is correct, but Key Vault Reader only reads the metadata of the key vault and of its secrets; it cannot read secret contents. The task fails to retrieve the values, so web-deploy cannot use SqlPassword and ApiKey.
    fr: "La tâche est correcte, mais Key Vault Reader permet seulement de lire les métadonnées du coffre de clés et de ses secrets ; il ne permet pas de lire le contenu des secrets. La tâche ne parvient pas à récupérer les valeurs : web-deploy ne peut donc pas utiliser SqlPassword et ApiKey."
references:
  - title: Provide access to Key Vault keys, certificates, and secrets with Azure role-based access control
    url: https://learn.microsoft.com/en-us/azure/key-vault/general/rbac-guide
