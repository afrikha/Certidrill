id: az400-4b-defender-pr-annotations
objective: "4.3.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Wingtip Toys has an Azure subscription named **Sub1** in which Microsoft Defender for Cloud provides only the foundational CSPM capabilities. An Azure DevOps connector in Sub1 onboards the organization **wingtip**.

    The CI pipeline of the repository **infra-core** runs the MicrosoftSecurityDevOps@1 task and publishes the CodeAnalysisLogs artifact. The main branch of infra-core has a build validation policy that runs the CI pipeline.

    You need Defender for Cloud to show infrastructure-as-code findings as annotations on the pull requests of infra-core.

    What else is required before you can turn on pull request annotations?
  fr: |
    Wingtip Toys dispose d'un abonnement Azure nommé **Sub1** dans lequel Microsoft Defender pour le cloud ne fournit que les fonctionnalités CSPM de base (Foundational CSPM). Un connecteur Azure DevOps de Sub1 intègre l'organisation **wingtip**.

    Le pipeline de CI du dépôt **infra-core** exécute la tâche MicrosoftSecurityDevOps@1 et publie l'artefact CodeAnalysisLogs. La branche main d'infra-core a une stratégie de validation de build qui exécute le pipeline de CI.

    Vous devez faire en sorte que Defender pour le cloud affiche les résultats de l'infrastructure as code sous forme d'annotations sur les pull requests d'infra-core.

    Que faut-il d'autre avant de pouvoir activer les annotations de pull request ?
body:
  options:
    - id: a
      text:
        en: "Enable GitHub Code Security for Azure DevOps on infra-core."
        fr: "Activer GitHub Code Security for Azure DevOps sur infra-core."
    - id: b
      text:
        en: "Assign the Security Reader role on the connector to the developers of infra-core."
        fr: "Attribuer le rôle Security Reader sur le connecteur aux développeurs d'infra-core."
    - id: c
      text:
        en: "Replace the MicrosoftSecurityDevOps@1 task with the MicrosoftDefenderCLI@2 task."
        fr: "Remplacer la tâche MicrosoftSecurityDevOps@1 par la tâche MicrosoftDefenderCLI@2."
    - id: d
      text:
        en: "Enable the Defender CSPM plan on Sub1."
        fr: "Activer le plan Defender CSPM sur Sub1."
answer: { optionId: d }
explanation:
  correct:
    en: |
      Pull request annotations for Azure DevOps are a Defender CSPM capability; foundational CSPM gives inventory and recommendations only. The other prerequisites are already met: a connected organization, the MSDO extension publishing CodeAnalysisLogs, and a build validation policy on main. You then turn annotations on in **DevOps security** > **Manage resources**, which requires Contributor or Owner on the subscription.
    fr: |
      Les annotations de pull request pour Azure DevOps sont une fonctionnalité de Defender CSPM ; le CSPM de base ne fournit que l'inventaire et les recommandations. Les autres prérequis sont déjà remplis : une organisation connectée, l'extension MSDO qui publie CodeAnalysisLogs et une stratégie de validation de build sur main. Vous activez ensuite les annotations dans **DevOps security** > **Manage resources**, ce qui exige Contributor ou Owner sur l'abonnement.
  options:
    a: { en: "GitHub Code Security for Azure DevOps produces its own CodeQL and dependency annotations; it isn't a prerequisite for Defender for Cloud IaC annotations.", fr: "GitHub Code Security for Azure DevOps produit ses propres annotations CodeQL et de dépendances ; ce n'est pas un prérequis des annotations IaC de Defender pour le cloud." }
    b: { en: "Security Reader lets people view findings in Defender for Cloud; it doesn't enable annotations.", fr: "Security Reader permet de consulter les résultats dans Defender pour le cloud ; il n'active pas les annotations." }
    c: { en: "IaC findings come from the MSDO extension, which is a prerequisite of annotations; the Defender for Cloud CLI scans container images.", fr: "Les résultats IaC viennent de l'extension MSDO, qui est un prérequis des annotations ; Defender for Cloud CLI analyse les images conteneur." }
references:
  - title: "Support and prerequisites: DevOps security"
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/devops-support
  - title: Enable pull request annotations in GitHub or in Azure DevOps
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/enable-pull-request-annotations
