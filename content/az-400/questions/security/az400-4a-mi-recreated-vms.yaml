id: az400-4a-mi-recreated-vms
objective: "4.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam uses an Azure Pipelines pipeline to rebuild a pool of 20 build virtual machines every night from a custom image. Each virtual machine must read packages from an Azure Storage account named **stbuildcache** as soon as it starts.

    The service connection used by the pipeline can create virtual machines and attach identities to them, but its identity doesn't have permission to create role assignments.

    You need to give the virtual machines access to stbuildcache. The solution must minimize administrative effort.

    What should you do?
  fr: |
    Fabrikam utilise un pipeline Azure Pipelines pour reconstruire chaque nuit, à partir d'une image personnalisée, un pool de 20 machines virtuelles de build. Chaque machine virtuelle doit lire des packages dans un compte Stockage Azure nommé **stbuildcache** dès son démarrage.

    La connexion de service utilisée par le pipeline peut créer des machines virtuelles et leur attacher des identités, mais son identité n'est pas autorisée à créer des attributions de rôles.

    Vous devez donner aux machines virtuelles l'accès à stbuildcache. La solution doit réduire au minimum l'effort d'administration.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Enable a system-assigned managed identity on each virtual machine in the pipeline, and then assign it the Storage Blob Data Reader role.", fr: "Activer une identité managée attribuée par le système sur chaque machine virtuelle dans le pipeline, puis lui attribuer le rôle Storage Blob Data Reader." } }
    - { id: b, text: { en: "Create an app registration, assign it the Storage Blob Data Reader role, and then copy its client secret to each virtual machine.", fr: "Créer une inscription d'application, lui attribuer le rôle Storage Blob Data Reader, puis copier son secret client sur chaque machine virtuelle." } }
    - { id: c, text: { en: "Create one user-assigned managed identity, assign it the Storage Blob Data Reader role once, and then attach it to each virtual machine in the pipeline.", fr: "Créer une identité managée attribuée par l'utilisateur, lui attribuer une fois le rôle Storage Blob Data Reader, puis l'attacher à chaque machine virtuelle dans le pipeline." } }
    - { id: d, text: { en: "Enable a system-assigned managed identity on each virtual machine, and then have an administrator assign it the Storage Blob Data Reader role after each rebuild.", fr: "Activer une identité managée attribuée par le système sur chaque machine virtuelle, puis demander à un administrateur de lui attribuer le rôle Storage Blob Data Reader après chaque reconstruction." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      A user-assigned managed identity has a life cycle independent of the virtual machines, so its role assignment is created once, before the machines exist, and survives every rebuild. The deployer only needs permission to attach the identity, not to create role assignments, and the access is available as soon as each machine starts.
    fr: |
      Une identité managée attribuée par l'utilisateur a un cycle de vie indépendant des machines virtuelles : son attribution de rôle est créée une seule fois, avant l'existence des machines, et survit à chaque reconstruction. Le déployeur a seulement besoin d'attacher l'identité, pas de créer des attributions de rôles, et l'accès est disponible dès le démarrage de chaque machine.
  options:
    a:
      en: |
        Each rebuild creates new system-assigned identities that need new role assignments, which the service connection is not allowed to create.
      fr: |
        Chaque reconstruction crée de nouvelles identités attribuées par le système qui ont besoin de nouvelles attributions de rôles, que la connexion de service n'est pas autorisée à créer.
    b:
      en: |
        A client secret copied to every machine must be stored, protected and rotated, which adds effort and risk compared to a managed identity.
      fr: |
        Un secret client copié sur chaque machine doit être stocké, protégé et renouvelé, ce qui ajoute de l'effort et du risque par rapport à une identité managée.
    d:
      en: |
        A manual role assignment after every nightly rebuild maximizes administrative effort, and the machines have no access when they start.
      fr: |
        Une attribution de rôle manuelle après chaque reconstruction nocturne maximise l'effort d'administration, et les machines n'ont pas d'accès au démarrage.
references:
  - title: Managed identity best practice recommendations
    url: https://learn.microsoft.com/en-us/entra/identity/managed-identities-azure-resources/managed-identity-best-practice-recommendations
