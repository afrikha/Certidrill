id: az400-4a-gh-pat-pending
objective: "4.1.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    The owners of a GitHub organization named **woodgrove** block personal access tokens (classic) and require approval for fine-grained personal access tokens.

    A developer named Ines creates a fine-grained personal access token. She selects woodgrove as the resource owner, gives the token access to the private repository **woodgrove/billing** only, and grants it the Issues (read and write) permission. Her script can read the public repositories of woodgrove, but every call to woodgrove/billing fails.

    You need Ines's script to work. The solution must follow the principle of least privilege.

    What should you do?
  fr: |
    Les propriétaires d'une organisation GitHub nommée **woodgrove** bloquent les jetons d'accès personnels (classiques) et exigent une approbation pour les jetons d'accès personnels affinés.

    Une développeuse nommée Ines crée un jeton d'accès personnel affiné. Elle sélectionne woodgrove comme propriétaire de la ressource, donne au jeton l'accès au seul dépôt privé **woodgrove/billing** et lui accorde l'autorisation Issues (lecture et écriture). Son script peut lire les dépôts publics de woodgrove, mais chaque appel vers woodgrove/billing échoue.

    Vous devez faire fonctionner le script d'Ines. La solution doit respecter le principe du privilège minimum.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Have an organization owner approve the pending request for the token.", fr: "Faire approuver par un propriétaire de l'organisation la demande en attente pour le jeton." } }
    - { id: b, text: { en: "Have Ines create a personal access token (classic) that has the repo scope.", fr: "Demander à Ines de créer un jeton d'accès personnel (classique) avec l'étendue repo." } }
    - { id: c, text: { en: "Add the Contents (read and write) permission to the token.", fr: "Ajouter l'autorisation Contents (lecture et écriture) au jeton." } }
    - { id: d, text: { en: "Regenerate the token without an expiration date.", fr: "Régénérer le jeton sans date d'expiration." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      When an organization requires approval, a fine-grained token targeting it stays pending until an owner reviews it, and until then it can only read public resources. That explains why public repositories work and woodgrove/billing doesn't. Approving the request activates the token with the narrow permissions already chosen.
    fr: |
      Lorsqu'une organisation exige une approbation, un jeton affiné qui la cible reste en attente jusqu'à ce qu'un propriétaire l'examine, et d'ici là il ne peut lire que les ressources publiques. Cela explique pourquoi les dépôts publics fonctionnent et pas woodgrove/billing. Approuver la demande active le jeton avec les autorisations restreintes déjà choisies.
  options:
    b:
      en: |
        The organization blocks classic tokens, and the repo scope would grant access to every repository Ines can reach.
      fr: |
        L'organisation bloque les jetons classiques, et l'étendue repo donnerait accès à tous les dépôts auxquels Ines a accès.
    c:
      en: |
        The script only manages issues, so an extra permission breaks least privilege, and the token would still be pending approval.
      fr: |
        Le script ne gère que des problèmes : une autorisation supplémentaire enfreint le privilège minimum, et le jeton resterait en attente d'approbation.
    d:
      en: |
        The expiration date isn't the cause, and an unlimited lifetime can be blocked by a maximum lifetime policy and increases risk.
      fr: |
        La date d'expiration n'est pas en cause, et une durée de vie illimitée peut être bloquée par une stratégie de durée de vie maximale et augmente le risque.
references:
  - title: Identify supported Access Tokens
    url: https://learn.microsoft.com/en-us/training/modules/automate-devops-github-apps/manage-tokens
