id: az400-4b-container-scan-points
objective: "4.3.5"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Adatum Corporation builds container images in Azure Pipelines, stores them in Azure Container Registry and runs them in Azure Kubernetes Service (AKS). The Azure DevOps organization is connected to Microsoft Defender for Cloud, and the Defender CSPM and Defender for Containers plans are enabled. The Dockerfiles are stored in GitHub repositories.

    Which tool should you use for each requirement? To answer, drag the appropriate tools to the correct requirements. Each tool may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum Corporation génère des images conteneur dans Azure Pipelines, les stocke dans Azure Container Registry et les exécute dans Azure Kubernetes Service (AKS). L'organisation Azure DevOps est connectée à Microsoft Defender pour le cloud, et les plans Defender CSPM et Defender pour les conteneurs sont activés. Les Dockerfiles sont stockés dans des dépôts GitHub.

    Quel outil devez-vous utiliser pour chaque exigence ? Pour répondre, faites glisser les outils appropriés vers les exigences correspondantes. Chaque outil peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: cli, text: { en: "The MicrosoftDefenderCLI@2 task in the pipeline", fr: "La tâche MicrosoftDefenderCLI@2 dans le pipeline" } }
    - { id: registry, text: { en: "Defender for Containers registry vulnerability assessment", fr: "L'évaluation des vulnérabilités du registre par Defender pour les conteneurs" } }
    - { id: sensor, text: { en: "Defender for Containers with the Defender sensor on the clusters", fr: "Defender pour les conteneurs avec le capteur Defender sur les clusters" } }
    - { id: dependabot, text: { en: "Dependabot version updates for the docker ecosystem", fr: "Les mises à jour de version Dependabot pour l'écosystème docker" } }
    - { id: codeql, text: { en: "CodeQL code scanning", fr: "L'analyse du code (code scanning) CodeQL" } }
  targets:
    - { id: build, text: { en: "Scan the image produced by the build before it's pushed to the registry", fr: "Analyser l'image produite par le build avant qu'elle soit poussée dans le registre" } }
    - { id: rescan, text: { en: "Reassess an image pushed two weeks ago against a vulnerability published yesterday, without rebuilding it", fr: "Réévaluer une image poussée il y a deux semaines par rapport à une vulnérabilité publiée hier, sans la régénérer" } }
    - { id: running, text: { en: "Keep a near real-time inventory of the vulnerable images running in AKS", fr: "Tenir un inventaire quasi en temps réel des images vulnérables exécutées dans AKS" } }
    - { id: baseimage, text: { en: "Receive pull requests that update the base image tag in the Dockerfiles when a newer version is published", fr: "Recevoir des pull requests qui mettent à jour la balise de l'image de base dans les Dockerfiles quand une version plus récente est publiée" } }
answer:
  mapping: { build: cli, rescan: registry, running: sensor, baseimage: dependabot }
explanation:
  correct:
    en: |
      The Defender for Cloud CLI, run by the MicrosoftDefenderCLI@2 task, scans an image inside the pipeline and requires Defender CSPM. Registry vulnerability assessment rescans every day the images pushed or pulled in the last 30 days, so new vulnerabilities are reported without a rebuild. With the Defender sensor, the inventory of running containers is updated in near real time. Dependabot version updates with the docker ecosystem open pull requests that bump image tags in Dockerfiles.
    fr: |
      Defender for Cloud CLI, exécuté par la tâche MicrosoftDefenderCLI@2, analyse une image dans le pipeline et exige Defender CSPM. L'évaluation des vulnérabilités du registre réanalyse chaque jour les images poussées ou tirées au cours des 30 derniers jours : les nouvelles vulnérabilités sont signalées sans nouveau build. Avec le capteur Defender, l'inventaire des conteneurs en cours d'exécution est mis à jour quasi en temps réel. Les mises à jour de version Dependabot pour l'écosystème docker ouvrent des pull requests qui font évoluer les balises d'image dans les Dockerfiles.
  options:
    codeql: { en: "CodeQL analyzes source code; it doesn't assess image layers or packages installed in an image.", fr: "CodeQL analyse le code source ; il n'évalue ni les couches d'une image ni les packages qui y sont installés." }
references:
  - title: Vulnerability management for containers
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/agentless-vulnerability-assessment-azure
  - title: CI/CD in pipeline-scanning with Defender for Cloud CLI
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/cli-cicd-integration
