id: az400-4a-gh-trigger-ci-token
objective: "4.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Tailspin has a GitHub organization. A scheduled workflow named **release-notes** in the repository **tailspin/web** commits an updated CHANGELOG.md to a new branch and opens a pull request against main. A ruleset on main requires the status check **build**, which is produced by a workflow that runs on `pull_request`.

    release-notes authenticates with GITHUB_TOKEN. The build workflow never starts automatically on the pull requests that release-notes opens.

    You need the build workflow to start automatically on these pull requests. The credential used by release-notes must not be tied to a user account and must not consume a license.

    What should release-notes use?
  fr: |
    Tailspin dispose d'une organisation GitHub. Un workflow planifié nommé **release-notes** du dépôt **tailspin/web** valide un fichier CHANGELOG.md mis à jour dans une nouvelle branche et ouvre une pull request vers main. Un ensemble de règles sur main exige la vérification d'état **build**, produite par un workflow qui s'exécute sur `pull_request`.

    release-notes s'authentifie avec GITHUB_TOKEN. Le workflow build ne démarre jamais automatiquement sur les pull requests ouvertes par release-notes.

    Vous devez faire démarrer automatiquement le workflow build sur ces pull requests. L'information d'identification utilisée par release-notes ne doit pas être liée à un compte d'utilisateur et ne doit pas consommer de licence.

    Que doit utiliser release-notes ?
body:
  options:
    - { id: a, text: { en: "GITHUB_TOKEN with the `contents: write` and `pull-requests: write` permissions", fr: "GITHUB_TOKEN avec les autorisations `contents: write` et `pull-requests: write`" } }
    - { id: b, text: { en: "A fine-grained personal access token created by the release manager", fr: "Un jeton d'accès personnel affiné créé par le responsable des mises en production" } }
    - { id: c, text: { en: "GITHUB_TOKEN with the `actions: write` and `checks: write` permissions", fr: "GITHUB_TOKEN avec les autorisations `actions: write` et `checks: write`" } }
    - { id: d, text: { en: "An installation access token of a GitHub App installed on tailspin/web", fr: "Un jeton d'accès d'installation d'une GitHub App installée sur tailspin/web" } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Events created with GITHUB_TOKEN don't start new workflow runs (a pull request opened with it creates runs that wait for approval), whatever permissions the token has. GitHub recommends a GitHub App installation access token or a personal access token instead. A GitHub App isn't tied to a user account, doesn't use a seat, and its installation tokens expire after one hour.
    fr: |
      Les événements créés avec GITHUB_TOKEN ne démarrent pas de nouvelles exécutions de workflow (une pull request ouverte avec ce jeton crée des exécutions en attente d'approbation), quelles que soient ses autorisations. GitHub recommande plutôt un jeton d'accès d'installation de GitHub App ou un jeton d'accès personnel. Une GitHub App n'est pas liée à un compte d'utilisateur, ne consomme pas de siège, et ses jetons d'installation expirent au bout d'une heure.
  options:
    a:
      en: |
        These permissions let the token push and open the pull request, but events created by GITHUB_TOKEN still don't start the build workflow automatically.
      fr: |
        Ces autorisations permettent au jeton de pousser et d'ouvrir la pull request, mais les événements créés par GITHUB_TOKEN ne démarrent toujours pas automatiquement le workflow build.
    b:
      en: |
        A personal access token would start the workflow, but it is tied to the release manager's account and stops working if that user loses access.
      fr: |
        Un jeton d'accès personnel démarrerait le workflow, mais il est lié au compte du responsable des mises en production et cesse de fonctionner si cet utilisateur perd son accès.
    c:
      en: |
        More permissions don't change the rule that events created by GITHUB_TOKEN don't trigger new runs.
      fr: |
        Des autorisations supplémentaires ne changent pas la règle selon laquelle les événements créés par GITHUB_TOKEN ne déclenchent pas de nouvelles exécutions.
references:
  - title: Identify supported Access Tokens
    url: https://learn.microsoft.com/en-us/training/modules/automate-devops-github-apps/manage-tokens
