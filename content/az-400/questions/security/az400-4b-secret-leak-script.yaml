id: az400-4b-secret-leak-script
objective: "4.2.4"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam has an Azure Pipelines YAML pipeline that uploads files to a partner. A variable group contains a secret variable named **PartnerCredentials** whose value is a JSON object that holds a user name and a password. The pipeline contains the following step.

    ```yaml
    - bash: ./upload.sh --credentials '$(PartnerCredentials)'
      displayName: Upload to partner
    ```

    A review finds the partner password in clear text in the log lines written by upload.sh. You need to prevent the password from appearing in the logs.

    Which two actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam dispose d'un pipeline YAML Azure Pipelines qui charge des fichiers chez un partenaire. Un groupe de variables contient une variable secrète nommée **PartnerCredentials** dont la valeur est un objet JSON contenant un nom d'utilisateur et un mot de passe. Le pipeline contient l'étape suivante.

    ```yaml
    - bash: ./upload.sh --credentials '$(PartnerCredentials)'
      displayName: Upload to partner
    ```

    Une revue trouve le mot de passe du partenaire en clair dans les lignes de journal écrites par upload.sh. Vous devez empêcher le mot de passe d'apparaître dans les journaux.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text:
        en: "Base64-encode the JSON value before you store it in the variable group."
        fr: "Encoder la valeur JSON en Base64 avant de la stocker dans le groupe de variables."
    - id: b
      text:
        en: "Store the user name and the password in two separate secret variables."
        fr: "Stocker le nom d'utilisateur et le mot de passe dans deux variables secrètes distinctes."
    - id: c
      text:
        en: "Mark PartnerCredentials as settable at queue time."
        fr: "Marquer PartnerCredentials comme définissable au moment de la mise en file d'attente."
    - id: d
      text:
        en: "Pass the secret values to upload.sh through environment variables mapped with env instead of command-line arguments."
        fr: "Transmettre les valeurs secrètes à upload.sh par des variables d'environnement mappées avec env plutôt que par des arguments de ligne de commande."
    - id: e
      text:
        en: "Set the system.debug variable to true for the pipeline."
        fr: "Définir la variable system.debug sur true pour le pipeline."
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |
      Azure Pipelines masks the registered secret value, but not its substrings, so the password extracted from the JSON object isn't masked; one secret per value lets the password itself be masked. Microsoft also recommends never passing secrets on the command line, because some operating systems log command-line arguments, and mapping them into environment variables instead.
    fr: |
      Azure Pipelines masque la valeur secrète enregistrée, mais pas ses sous-chaînes ; le mot de passe extrait de l'objet JSON n'est donc pas masqué, alors qu'avec un secret par valeur le mot de passe lui-même est masqué. Microsoft recommande aussi de ne jamais passer de secrets sur la ligne de commande, car certains systèmes d'exploitation journalisent les arguments, et de les mapper plutôt dans des variables d'environnement.
  options:
    a: { en: "A transformed value is still unmasked once the script decodes it and prints the password.", fr: "Une valeur transformée n'est toujours pas masquée une fois que le script la décode et affiche le mot de passe." }
    c: { en: "Settable at queue time lets users override the value when they run the pipeline; it has no effect on masking.", fr: "Définissable au moment de la mise en file d'attente permet aux utilisateurs de remplacer la valeur à l'exécution ; cela n'a aucun effet sur le masquage." }
    e: { en: "Debug logging writes more details to the logs, which increases the exposure instead of reducing it.", fr: "La journalisation de débogage écrit davantage de détails dans les journaux, ce qui augmente l'exposition au lieu de la réduire." }
references:
  - title: Set secret variables
    url: https://learn.microsoft.com/en-us/azure/devops/pipelines/process/set-secret-variables
