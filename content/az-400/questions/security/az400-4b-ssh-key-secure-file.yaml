id: az400-4b-ssh-key-secure-file
objective: "4.2.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Fabrikam has an Azure Pipelines YAML pipeline that must clone a second private GitHub repository named **fabrikam/shared-config** over SSH. An administrator generated an SSH key pair and added the public key as a deploy key of fabrikam/shared-config.

    You need to make the private key available to the pipeline. The solution must meet the following requirements:

    - The private key must be stored encrypted in Azure DevOps and never in a Git repository.
    - Custom scripting must be minimized.

    What should you do?
  fr: |
    Fabrikam dispose d'un pipeline YAML Azure Pipelines qui doit cloner par SSH un second dépôt GitHub privé nommé **fabrikam/shared-config**. Un administrateur a généré une paire de clés SSH et a ajouté la clé publique comme clé de déploiement de fabrikam/shared-config.

    Vous devez mettre la clé privée à la disposition du pipeline. La solution doit répondre aux exigences suivantes :

    - La clé privée doit être stockée chiffrée dans Azure DevOps et jamais dans un dépôt Git.
    - Les scripts personnalisés doivent être réduits au minimum.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text:
        en: "Store the private key in a secret pipeline variable, and write it to ~/.ssh/id_rsa in a script step."
        fr: "Stocker la clé privée dans une variable secrète du pipeline, et l'écrire dans ~/.ssh/id_rsa dans une étape de script."
    - id: b
      text:
        en: "Publish the private key as a universal package to an Azure Artifacts feed, and download it in the pipeline."
        fr: "Publier la clé privée en tant que package universel dans un flux Azure Artifacts, et la télécharger dans le pipeline."
    - id: c
      text:
        en: "Upload the private key as a secure file, and add an InstallSSHKey@0 task that references it."
        fr: "Charger la clé privée en tant que fichier sécurisé, et ajouter une tâche InstallSSHKey@0 qui le référence."
    - id: d
      text:
        en: "Commit the private key to a protected branch of the pipeline repository, and restrict the branch with a branch policy."
        fr: "Commiter la clé privée dans une branche protégée du dépôt du pipeline, et restreindre la branche avec une stratégie de branche."
answer: { optionId: c }
explanation:
  correct:
    en: |
      Secure files store sensitive files such as SSH keys encrypted on the server and make them usable only from pipeline tasks. InstallSSHKey@0 takes the name of the secure file in `sshKeySecureFile` and a `knownHostsEntry` (from `ssh-keyscan github.com`), installs the key before the next steps and restores the SSH configuration afterward, with no script to write.
    fr: |
      Les fichiers sécurisés stockent des fichiers sensibles comme les clés SSH chiffrés sur le serveur et ne les rendent utilisables que depuis des tâches de pipeline. InstallSSHKey@0 prend le nom du fichier sécurisé dans `sshKeySecureFile` et une entrée `knownHostsEntry` (obtenue avec `ssh-keyscan github.com`), installe la clé avant les étapes suivantes et restaure ensuite la configuration SSH, sans script à écrire.
  options:
    a: { en: "A secret variable is encrypted, but writing the key, setting its permissions and configuring known_hosts is custom scripting that the task already does.", fr: "Une variable secrète est chiffrée, mais écrire la clé, définir ses autorisations et configurer known_hosts est un script personnalisé que la tâche fait déjà." }
    b: { en: "A feed is a package store, not an encrypted secret store, and anyone with read access to the feed could download the key.", fr: "Un flux est un magasin de packages, pas un magasin de secrets chiffrés, et toute personne ayant accès en lecture au flux pourrait télécharger la clé." }
    d: { en: "The requirement forbids storing the key in a Git repository; a branch policy doesn't stop anyone who can read the repository from reading the key.", fr: "L'exigence interdit de stocker la clé dans un dépôt Git ; une stratégie de branche n'empêche pas les personnes qui lisent le dépôt de lire la clé." }
references:
  - title: InstallSSHKey@0 - Install SSH key v0 task
    url: https://learn.microsoft.com/en-us/azure/devops/pipelines/tasks/reference/install-ssh-key-v0
  - title: Secure files for Azure Pipelines
    url: https://learn.microsoft.com/en-us/azure/devops/pipelines/library/secure-files
