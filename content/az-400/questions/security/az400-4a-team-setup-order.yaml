id: az400-4a-team-setup-order
objective: "4.1.7"
type: ordering
difficulty: 1
status: draft
stem:
  en: |
    Contoso's claims business unit starts using Azure DevOps. It needs a new project named **Claims** that contains a team named **Claims Intake**. Maria, who isn't a member of Project Administrators, must be able to add members to Claims Intake and configure its backlog and boards.

    You are a member of Project Collection Administrators.

    Which three actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    L'unité commerciale Sinistres de Contoso commence à utiliser Azure DevOps. Elle a besoin d'un nouveau projet nommé **Claims** qui contient une équipe nommée **Claims Intake**. Maria, qui n'est pas membre de Project Administrators, doit pouvoir ajouter des membres à Claims Intake et configurer son backlog et ses tableaux.

    Vous êtes membre de Project Collection Administrators.

    Quelles sont les trois actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - { id: project, text: { en: "Create the project Claims.", fr: "Créer le projet Claims." } }
    - { id: team, text: { en: "In Project settings > Teams, create the team Claims Intake and select Create an area path with the name of the team.", fr: "Dans Project settings > Teams, créer l'équipe Claims Intake et sélectionner Create an area path with the name of the team." } }
    - { id: admin, text: { en: "Add Maria as a team administrator of Claims Intake.", fr: "Ajouter Maria comme administratrice de l'équipe Claims Intake." } }
    - { id: pca, text: { en: "Add Maria to Project Collection Administrators.", fr: "Ajouter Maria à Project Collection Administrators." } }
    - { id: group, text: { en: "Create a security group named Claims Intake at the organization level and add Maria to it.", fr: "Créer un groupe de sécurité nommé Claims Intake au niveau de l'organisation et y ajouter Maria." } }
    - { id: org, text: { en: "Create a new Azure DevOps organization for the claims business unit.", fr: "Créer une nouvelle organisation Azure DevOps pour l'unité commerciale Sinistres." } }
answer:
  sequence: [ project, team, admin ]
explanation:
  correct:
    en: |
      A team belongs to a project, so the project comes first, and Project Collection Administrators can create projects. Creating the team also creates its security group, default dashboard and, if selected, an area path with the team's name. A team administrator can then add team members and configure all team settings, including backlogs and boards, without being a project administrator.
    fr: |
      Une équipe appartient à un projet : le projet vient en premier, et Project Collection Administrators peut créer des projets. La création de l'équipe crée aussi son groupe de sécurité, son tableau de bord par défaut et, si l'option est sélectionnée, un chemin de zone portant le nom de l'équipe. Un administrateur d'équipe peut ensuite ajouter des membres et configurer tous les paramètres de l'équipe, y compris les backlogs et les tableaux, sans être administrateur du projet.
  options:
    pca:
      en: |
        Project Collection Administrators grants rights on the whole organization, far more than managing one team.
      fr: |
        Project Collection Administrators accorde des droits sur toute l'organisation, bien plus que la gestion d'une équipe.
    group:
      en: |
        Creating a team already creates its security group; a separate organization-level group doesn't make Maria a team administrator.
      fr: |
        La création d'une équipe crée déjà son groupe de sécurité ; un groupe distinct au niveau de l'organisation ne fait pas de Maria une administratrice d'équipe.
    org:
      en: |
        A new project in the existing organization is enough; a new organization adds billing and administration overhead.
      fr: |
        Un nouveau projet dans l'organisation existante suffit ; une nouvelle organisation ajoute une charge de facturation et d'administration.
references:
  - title: Create or add a team
    url: https://learn.microsoft.com/en-us/azure/devops/organizations/settings/add-teams
  - title: Create a project in Azure DevOps
    url: https://learn.microsoft.com/en-us/azure/devops/organizations/projects/create-project
