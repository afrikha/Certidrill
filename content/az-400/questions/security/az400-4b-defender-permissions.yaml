id: az400-4b-defender-permissions
objective: "4.3.2"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Contoso, Ltd. plans to connect its Azure DevOps organization named **contoso** to Microsoft Defender for Cloud by using the Azure subscription **Sub1**. Several people will take part in the setup and the daily use of DevOps security.

    Which role should each person have? To answer, drag the appropriate roles to the correct tasks. Each role may be used once, more than once, or not at all. The solution must follow the principle of least privilege.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso, Ltd. prévoit de connecter son organisation Azure DevOps nommée **contoso** à Microsoft Defender pour le cloud à l'aide de l'abonnement Azure **Sub1**. Plusieurs personnes participeront à la configuration et à l'utilisation quotidienne de la sécurité DevOps.

    Quel rôle chaque personne doit-elle avoir ? Pour répondre, faites glisser les rôles appropriés vers les tâches correspondantes. Chaque rôle peut être utilisé une fois, plusieurs fois ou pas du tout. La solution doit respecter le principe du moindre privilège.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: true
  items:
    - { id: pca, text: { en: "Project Collection Administrator in contoso", fr: "Project Collection Administrator dans contoso" } }
    - { id: projadmin, text: { en: "Project Administrator in each project of contoso", fr: "Project Administrator dans chaque projet de contoso" } }
    - { id: contributor, text: { en: "Contributor on Sub1", fr: "Contributor sur Sub1" } }
    - { id: owner, text: { en: "Owner on Sub1", fr: "Owner sur Sub1" } }
    - { id: secreader, text: { en: "Security Reader on the resource group of the connector", fr: "Security Reader sur le groupe de ressources du connecteur" } }
  targets:
    - { id: create, text: { en: "Create the Azure DevOps connector resource in Sub1", fr: "Créer la ressource de connecteur Azure DevOps dans Sub1" } }
    - { id: authorize, text: { en: "Authorize the connector so that it discovers the projects and repositories of contoso", fr: "Autoriser le connecteur pour qu'il découvre les projets et dépôts de contoso" } }
    - { id: extension, text: { en: "Install the Microsoft Security DevOps extension in contoso", fr: "Installer l'extension Microsoft Security DevOps dans contoso" } }
    - { id: review, text: { en: "Review the DevOps security findings without changing any configuration", fr: "Consulter les résultats de la sécurité DevOps sans modifier aucune configuration" } }
answer:
  mapping: { create: contributor, authorize: pca, extension: pca, review: secreader }
explanation:
  correct:
    en: |
      Creating the connector needs Contributor (or Security Admin) on the subscription; Owner isn't needed. The account that authorizes the connector must be a Project Collection Administrator of the organization, because Defender for Cloud discovers only the organizations where it is one, and installing the Microsoft Security DevOps extension also requires Project Collection Administrator. Security Reader, scoped to the resource group or the connector, is enough to review findings.
    fr: |
      Créer le connecteur exige Contributor (ou Security Admin) sur l'abonnement ; Owner n'est pas nécessaire. Le compte qui autorise le connecteur doit être Project Collection Administrator de l'organisation, car Defender pour le cloud ne découvre que les organisations où il l'est, et l'installation de l'extension Microsoft Security DevOps exige aussi Project Collection Administrator. Security Reader, limité au groupe de ressources ou au connecteur, suffit pour consulter les résultats.
  options:
    projadmin: { en: "Project Administrator manages one project; it can't authorize organization-level discovery or install extensions.", fr: "Project Administrator gère un projet ; il ne peut ni autoriser la découverte au niveau de l'organisation ni installer d'extensions." }
    owner: { en: "Owner also works for the connector but grants more than required.", fr: "Owner convient aussi pour le connecteur, mais accorde plus que nécessaire." }
references:
  - title: "Support and prerequisites: DevOps security"
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/devops-support
  - title: Connect your Azure DevOps organizations
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/quickstart-onboard-devops
