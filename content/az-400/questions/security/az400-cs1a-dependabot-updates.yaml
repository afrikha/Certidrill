id: az400-cs1a-dependabot-updates
objective: "4.3.6"
type: multi
caseStudy: az400-cs1a-consolidated-messenger
difficulty: 1
status: draft
stem:
  en: |
    You need to meet the security requirements for the dependencies of the repositories.

    Which two actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez satisfaire les exigences de sécurité concernant les dépendances des dépôts.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Enable secret scanning with push protection on every repository", fr: "Activer l'analyse des secrets avec la protection push sur chaque dépôt" } }
    - { id: b, text: { en: "Enable Dependabot security updates on the web-portal repository", fr: "Activer les mises à jour de sécurité Dependabot sur le dépôt web-portal" } }
    - { id: c, text: { en: "Enable grouped security updates for the organization", fr: "Activer les mises à jour de sécurité groupées pour l'organisation" } }
    - { id: d, text: { en: "Add a .github/dependabot.yml file to every repository with the github-actions package ecosystem and a weekly schedule", fr: "Ajouter à chaque dépôt un fichier .github/dependabot.yml avec l'écosystème de packages github-actions et une planification hebdomadaire" } }
    - { id: e, text: { en: "Enable the default setup of CodeQL code scanning on every repository", fr: "Activer la configuration par défaut de l'analyse du code CodeQL sur chaque dépôt" } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |
      Dependabot security updates open pull requests that upgrade a vulnerable dependency to a patched version when a Dependabot alert is raised; the alerts are already enabled. Version updates keep dependencies current even when no vulnerability is known, and they are configured in .github/dependabot.yml with a package-ecosystem (github-actions for workflow actions), a directory and a schedule interval.
    fr: |
      Les mises à jour de sécurité Dependabot ouvrent des pull requests qui mettent à niveau une dépendance vulnérable vers une version corrigée quand une alerte Dependabot est levée ; les alertes sont déjà activées. Les mises à jour de version maintiennent les dépendances à jour même sans vulnérabilité connue ; elles se configurent dans .github/dependabot.yml avec un package-ecosystem (github-actions pour les actions des workflows), un répertoire et un intervalle de planification.
  options:
    a: { en: "Push protection blocks commits that contain secrets; it does not update dependencies.", fr: "La protection push bloque les commits qui contiennent des secrets ; elle ne met pas à jour les dépendances." }
    c: { en: "Grouped security updates only combine security pull requests into one per ecosystem; they need security updates to be enabled and do not check actions for new versions.", fr: "Les mises à jour de sécurité groupées regroupent seulement les pull requests de sécurité en une par écosystème ; elles exigent que les mises à jour de sécurité soient activées et ne vérifient pas les nouvelles versions des actions." }
    e: { en: "CodeQL analyzes the code written by the teams for vulnerabilities; it does not create pull requests that upgrade packages or actions.", fr: "CodeQL analyse le code écrit par les équipes pour y trouver des vulnérabilités ; il ne crée pas de pull requests qui mettent à niveau des packages ou des actions." }
references:
  - title: Dependabot security updates
    url: https://learn.microsoft.com/en-us/training/modules/configure-dependabot-security-updates-on-github-repo/4-dependabot-security-updates
