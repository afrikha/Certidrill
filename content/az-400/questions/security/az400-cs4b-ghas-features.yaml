id: az400-cs4b-ghas-features
objective: "4.3.1"
type: dragdrop
caseStudy: az400-cs4b-alpine-ski-house
difficulty: 1
status: draft
stem:
  en: |
    You need to meet security requirements 3 to 6 for booking-service.

    Which GitHub feature should you enable for each requirement? To answer, drag the appropriate features to the correct requirements. Each feature may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez satisfaire les exigences de sécurité 3 à 6 pour booking-service.

    Quelle fonctionnalité GitHub devez-vous activer pour chaque exigence ? Pour répondre, faites glisser les fonctionnalités appropriées vers les exigences correspondantes. Chaque fonctionnalité peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: alerts, text: { en: "Secret scanning alerts", fr: "Alertes d'analyse des secrets (secret scanning)" } }
    - { id: push, text: { en: "Push protection", fr: "Protection push (push protection)" } }
    - { id: codeql, text: { en: "Code scanning with CodeQL", fr: "Analyse du code (code scanning) avec CodeQL" } }
    - { id: review, text: { en: "Dependency review", fr: "Revue des dépendances (dependency review)" } }
    - { id: secupd, text: { en: "Dependabot security updates", fr: "Mises à jour de sécurité Dependabot" } }
    - { id: verupd, text: { en: "Dependabot version updates", fr: "Mises à jour de version Dependabot" } }
  targets:
    - { id: r3, text: { en: "Requirement 3: reject pushes that contain secrets", fr: "Exigence 3 : refuser les envois qui contiennent des secrets" } }
    - { id: r4, text: { en: "Requirement 4: report SQL injection flaws before the merge", fr: "Exigence 4 : signaler les failles d'injection SQL avant la fusion" } }
    - { id: r5, text: { en: "Requirement 5: show vulnerable dependencies added by a pull request", fr: "Exigence 5 : indiquer les dépendances vulnérables ajoutées par une pull request" } }
    - { id: r6, text: { en: "Requirement 6: open pull requests that fix vulnerable dependencies", fr: "Exigence 6 : ouvrir des pull requests qui corrigent les dépendances vulnérables" } }
answer:
  mapping: { r3: push, r4: codeql, r5: review, r6: secupd }
explanation:
  correct:
    en: |
      Push protection blocks commits that contain high-confidence secret patterns before they reach the repository. Code scanning uses CodeQL static analysis to report vulnerabilities in new or modified code so that they can be fixed before the merge. Dependency review shows, in the pull request, the dependencies that are added or updated and whether they introduce vulnerable versions. Dependabot security updates create pull requests that upgrade a vulnerable dependency to a secure version.
    fr: |
      La protection push bloque les commits qui contiennent des modèles de secrets à haut niveau de confiance avant qu'ils n'atteignent le dépôt. L'analyse du code utilise l'analyse statique CodeQL pour signaler les vulnérabilités du code nouveau ou modifié, afin de les corriger avant la fusion. La revue des dépendances indique, dans la pull request, les dépendances ajoutées ou mises à jour et si elles introduisent des versions vulnérables. Les mises à jour de sécurité Dependabot créent des pull requests qui mettent à niveau une dépendance vulnérable vers une version sûre.
  options:
    alerts:
      en: |
        Secret scanning alerts report secrets that are already in the repository; they do not reject the push.
      fr: |
        Les alertes d'analyse des secrets signalent des secrets déjà présents dans le dépôt ; elles ne refusent pas l'envoi.
    verupd:
      en: |
        Dependabot version updates open pull requests for any newer version, whether or not the current one is vulnerable.
      fr: |
        Les mises à jour de version Dependabot ouvrent des pull requests pour toute version plus récente, que la version actuelle soit vulnérable ou non.
references:
  - title: Examine GitHub's security and code quality tools
    url: https://learn.microsoft.com/en-us/training/modules/resolve-github-secret-scanning-alerts-github-copilot-agent/2-examine-github-security-code-quality-tools
