id: az400-cs2b-manifest-token
objective: "4.1.2"
type: single
caseStudy: az400-cs2b-relecloud
difficulty: 2
status: draft
stem:
  en: |
    You need to replace the credential that the release jobs use to update deploy-manifests. The solution must meet the requirements.

    What should you use?
  fr: |
    Vous devez remplacer les informations d'identification que les travaux de mise en production utilisent pour mettre à jour deploy-manifests. La solution doit respecter les exigences.

    Que devez-vous utiliser ?
body:
  options:
    - id: a
      text:
        en: "The GITHUB_TOKEN of each workflow, with the contents: write permission"
        fr: "Le GITHUB_TOKEN de chaque workflow, avec l'autorisation contents: write"
    - id: b
      text:
        en: "A fine-grained PAT of a dedicated user account, limited to deploy-manifests"
        fr: "Un PAT à granularité fine d'un compte d'utilisateur dédié, limité à deploy-manifests"
    - id: c
      text:
        en: "An installation access token of a GitHub App installed on deploy-manifests"
        fr: "Un jeton d'accès d'installation d'une GitHub App installée sur deploy-manifests"
    - id: d
      text:
        en: "A deploy key with write access, added to deploy-manifests"
        fr: "Une clé de déploiement avec accès en écriture, ajoutée à deploy-manifests"
answer: { optionId: c }
explanation:
  correct:
    en: A GitHub App acts with its own identity instead of a user's, and its installation access tokens are valid for one hour. The workflow generates a token for the app installation on deploy-manifests, with only the repository permissions that the app was granted.
    fr: Une GitHub App agit avec sa propre identité et non celle d'un utilisateur, et ses jetons d'accès d'installation sont valides pendant une heure. Le workflow génère un jeton pour l'installation de l'application sur deploy-manifests, avec uniquement les autorisations de dépôt accordées à l'application.
  options:
    a: { en: "The GITHUB_TOKEN is limited to the repository that contains the workflow, so it can't push to deploy-manifests.", fr: "Le GITHUB_TOKEN est limité au dépôt qui contient le workflow : il ne peut pas pousser vers deploy-manifests." }
    b: { en: "A personal access token is always tied to a user account, even a dedicated one.", fr: "Un jeton d'accès personnel est toujours lié à un compte d'utilisateur, même dédié." }
    d: { en: "A deploy key isn't tied to a user, but it is a long-lived SSH key that doesn't expire within one hour.", fr: "Une clé de déploiement n'est pas liée à un utilisateur, mais c'est une clé SSH de longue durée qui n'expire pas en moins d'une heure." }
references:
  - title: Identify supported Access Tokens
    url: https://learn.microsoft.com/en-us/training/modules/automate-devops-github-apps/manage-tokens
