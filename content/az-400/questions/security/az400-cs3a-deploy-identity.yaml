id: az400-cs3a-deploy-identity
objective: "4.1.1"
type: single
caseStudy: az400-cs3a-wingtip-shipping
difficulty: 2
status: draft
stem:
  en: |
    You need to create the Microsoft Entra identity that the deploy job will use to deploy to RG-PortCall-Prod. The solution must meet the deployment requirements and the identity constraints of Wingtip. What should you create?
  fr: |
    Vous devez créer l'identité Microsoft Entra que le travail deploy utilisera pour déployer dans RG-PortCall-Prod. La solution doit satisfaire les exigences de déploiement et les contraintes d'identité de Wingtip. Que devez-vous créer ?
body:
  options:
    - { id: a, text: { en: "A user-assigned managed identity that has a federated credential for GitHub Actions", fr: "Une identité managée affectée par l'utilisateur qui a une information d'identification fédérée pour GitHub Actions" } }
    - { id: b, text: { en: "A system-assigned managed identity on berth-api that has a federated credential for GitHub Actions", fr: "Une identité managée affectée par le système sur berth-api qui a une information d'identification fédérée pour GitHub Actions" } }
    - { id: c, text: { en: "An application registration that has a federated credential for GitHub Actions", fr: "Une inscription d'application qui a une information d'identification fédérée pour GitHub Actions" } }
    - { id: d, text: { en: "A service principal that has a certificate stored as a GitHub environment secret", fr: "Un principal de service qui a un certificat stocké comme secret d'environnement GitHub" } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Workload identity federation can be configured on an application registration or on a user-assigned managed identity. Because Wingtip does not allow new application registrations, a user-assigned managed identity, which the platform team can create in its resource group, is the identity to federate with GitHub Actions. No secret or certificate is stored in GitHub.
    fr: |
      La fédération d'identité de charge de travail peut être configurée sur une inscription d'application ou sur une identité managée affectée par l'utilisateur. Comme Wingtip n'autorise pas de nouvelles inscriptions d'applications, c'est une identité managée affectée par l'utilisateur, que l'équipe plateforme peut créer dans son groupe de ressources, qu'il faut fédérer avec GitHub Actions. Aucun secret ni certificat n'est stocké dans GitHub.
  options:
    b:
      en: |
        Federated credentials are configured on user-assigned managed identities and application registrations; a system-assigned identity belongs to its Azure resource and is not offered for a GitHub workflow.
      fr: |
        Les informations d'identification fédérées se configurent sur des identités managées affectées par l'utilisateur et des inscriptions d'applications ; une identité affectée par le système appartient à sa ressource Azure et n'est pas proposée pour un workflow GitHub.
    c:
      en: |
        This would be secretless, but Wingtip's users cannot register applications and the security team does not create new ones for automation.
      fr: |
        Cette solution serait sans secret, mais les utilisateurs de Wingtip ne peuvent pas inscrire d'applications et l'équipe de sécurité n'en crée pas de nouvelles pour l'automatisation.
    d:
      en: |
        A certificate stored in GitHub is a long-lived credential, which requirement 1 forbids, and it requires an application registration.
      fr: |
        Un certificat stocké dans GitHub est une information d'identification de longue durée, ce que l'exigence 1 interdit, et il exige une inscription d'application.
references:
  - title: Workload Identity Federation
    url: https://learn.microsoft.com/en-us/entra/workload-id/workload-identity-federation
  - title: Authenticate to Azure from GitHub Actions by OpenID Connect
    url: https://learn.microsoft.com/en-us/azure/developer/github/connect-from-azure-openid-connect
