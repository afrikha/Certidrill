id: az400-4b-secret-protection-features
objective: "4.3.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Proseware, Inc. uses GitHub Enterprise Cloud. The company purchased GitHub Secret Protection, but not GitHub Code Security, for its private repositories.

    You need to meet the following requirements:

    - Detect the tokens of the internal ticketing system, which use the format `PSW-TKN-` followed by 32 hexadecimal characters, and block them at push time.
    - Only members of the **security-champions** team can approve a push that push protection blocks.

    Which two features should you configure? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware, Inc. utilise GitHub Enterprise Cloud. L'entreprise a acheté GitHub Secret Protection, mais pas GitHub Code Security, pour ses dépôts privés.

    Vous devez répondre aux exigences suivantes :

    - Détecter les jetons du système de tickets interne, au format `PSW-TKN-` suivi de 32 caractères hexadécimaux, et les bloquer au moment du push.
    - Seuls les membres de l'équipe **security-champions** peuvent approuver un push bloqué par la protection push.

    Quelles sont les deux fonctionnalités à configurer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Dependency review", fr: "La révision des dépendances (dependency review)" } }
    - { id: b, text: { en: "Custom patterns for secret scanning", fr: "Des modèles personnalisés (custom patterns) pour l'analyse des secrets" } }
    - { id: c, text: { en: "Copilot Autofix", fr: "Copilot Autofix" } }
    - { id: d, text: { en: "Code scanning default setup", fr: "La configuration par défaut de l'analyse du code (code scanning)" } }
    - { id: e, text: { en: "Delegated bypass for push protection", fr: "Le contournement délégué (delegated bypass) de la protection push" } }
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: |
      GitHub Secret Protection includes custom patterns, which define organization-specific secret formats with regular expressions and can be included in push protection. It also includes delegated bypass, which replaces the free bypass of push protection with bypass requests that only designated reviewers, such as a team, can approve.
    fr: |
      GitHub Secret Protection inclut les modèles personnalisés, qui définissent par des expressions régulières des formats de secrets propres à l'organisation et peuvent être inclus dans la protection push. Il inclut aussi le contournement délégué, qui remplace le contournement libre de la protection push par des demandes de contournement que seuls des réviseurs désignés, comme une équipe, peuvent approuver.
  options:
    a: { en: "Dependency review is a GitHub Code Security feature and checks dependency changes, not secrets.", fr: "La révision des dépendances est une fonctionnalité de GitHub Code Security et vérifie les modifications de dépendances, pas les secrets." }
    c: { en: "Copilot Autofix belongs to GitHub Code Security and proposes fixes for code scanning alerts.", fr: "Copilot Autofix appartient à GitHub Code Security et propose des correctifs pour les alertes d'analyse du code." }
    d: { en: "Code scanning is part of GitHub Code Security, which wasn't purchased, and it finds code vulnerabilities, not tokens.", fr: "L'analyse du code fait partie de GitHub Code Security, qui n'a pas été acheté, et trouve des vulnérabilités du code, pas des jetons." }
references:
  - title: Examine GitHub's security and code quality tools
    url: https://learn.microsoft.com/en-us/training/modules/resolve-github-secret-scanning-alerts-github-copilot-agent/2-examine-github-security-code-quality-tools
