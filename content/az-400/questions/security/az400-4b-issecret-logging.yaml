id: az400-4b-issecret-logging
objective: "4.2.4"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    You have an Azure Pipelines YAML pipeline. Its first step runs a script that obtains a short-lived API token at run time. A later step runs a script that reads the token from an environment variable named **API_TOKEN**.

    You need to complete the pipeline. The solution must meet the following requirements:

    - The token must be available to the later step as a pipeline variable named **apiToken**.
    - The token must be masked in the pipeline logs.
    - The token must not be passed on a command line.

    How should you complete the YAML? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un pipeline YAML Azure Pipelines. Sa première étape exécute un script qui obtient un jeton d'API de courte durée au moment de l'exécution. Une étape ultérieure exécute un script qui lit le jeton dans une variable d'environnement nommée **API_TOKEN**.

    Vous devez compléter le pipeline. La solution doit répondre aux exigences suivantes :

    - Le jeton doit être disponible pour l'étape ultérieure sous la forme d'une variable de pipeline nommée **apiToken**.
    - Le jeton doit être masqué dans les journaux du pipeline.
    - Le jeton ne doit pas être passé sur une ligne de commande.

    Comment devez-vous compléter le YAML ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: yaml
  template: |
    steps:
    - bash: |
        TOKEN=$(./scripts/get-token.sh)
        echo "[[cmd]]$TOKEN"
      displayName: Get API token
    - bash: ./scripts/publish-results.sh
      displayName: Publish results
      [[map]]:
        API_TOKEN: [[ref]]
  slots:
    - id: cmd
      options:
        - { id: secret, text: "##vso[task.setvariable variable=apiToken;issecret=true]" }
        - { id: plain, text: "##vso[task.setvariable variable=apiToken]" }
        - { id: readonly, text: "##vso[task.setvariable variable=apiToken;isreadonly=true]" }
        - { id: mask, text: "::add-mask::" }
    - id: map
      options:
        - { id: env, text: env }
        - { id: variables, text: variables }
        - { id: inputs, text: inputs }
    - id: ref
      options:
        - { id: macro, text: $(apiToken) }
        - { id: template, text: "${{ variables.apiToken }}" }
        - { id: psenv, text: $env:apiToken }
answer:
  values: { cmd: secret, map: env, ref: macro }
explanation:
  correct:
    en: |
      The `task.setvariable` logging command with `issecret=true` creates the variable for the following steps and registers its value as a secret, so the agent masks it in the logs. Secret variables aren't decrypted into environment variables automatically, so the later step maps it explicitly with `env:`, using the run-time macro syntax `$(apiToken)`.
    fr: |
      La commande de journalisation `task.setvariable` avec `issecret=true` crée la variable pour les étapes suivantes et enregistre sa valeur comme secret, si bien que l'agent la masque dans les journaux. Les variables secrètes ne sont pas déchiffrées automatiquement dans des variables d'environnement : l'étape ultérieure la mappe explicitement avec `env:`, à l'aide de la syntaxe de macro `$(apiToken)` évaluée à l'exécution.
  options:
    plain: { en: "Without `issecret=true` the variable is created as a normal variable, so its value isn't masked in the logs.", fr: "Sans `issecret=true`, la variable est créée comme variable normale : sa valeur n'est pas masquée dans les journaux." }
    readonly: { en: "isreadonly prevents later steps from overwriting the variable but doesn't mask its value.", fr: "isreadonly empêche les étapes suivantes de remplacer la variable, mais ne masque pas sa valeur." }
    mask: { en: "`::add-mask::` is a GitHub Actions workflow command; Azure Pipelines doesn't create a variable from it.", fr: "`::add-mask::` est une commande de workflow GitHub Actions ; Azure Pipelines n'en crée pas de variable." }
    variables: { en: "A step has no variables property; environment variables of a script step are set with env.", fr: "Une étape n'a pas de propriété variables ; les variables d'environnement d'une étape de script se définissent avec env." }
    inputs: { en: "inputs is used by task steps; the bash shortcut takes its environment variables from env.", fr: "inputs sert aux étapes de type tâche ; le raccourci bash reçoit ses variables d'environnement par env." }
    template: { en: "A template expression is evaluated when the pipeline is compiled, before the first step has created apiToken, so it would be empty.", fr: "Une expression de modèle est évaluée à la compilation du pipeline, avant que la première étape ait créé apiToken : elle serait vide." }
    psenv: { en: "`$env:apiToken` is PowerShell syntax that Azure Pipelines doesn't resolve in YAML, and secrets aren't in the environment anyway.", fr: "`$env:apiToken` est une syntaxe PowerShell qu'Azure Pipelines ne résout pas dans le YAML, et les secrets ne sont de toute façon pas dans l'environnement." }
references:
  - title: Set secret variables
    url: https://learn.microsoft.com/en-us/azure/devops/pipelines/process/set-secret-variables
