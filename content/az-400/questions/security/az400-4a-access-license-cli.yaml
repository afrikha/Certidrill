id: az400-4a-access-license-cli
objective: "4.1.6"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    You are adding two users to the Azure DevOps organization **contoso** by using the Azure DevOps CLI:

    - **Ana**, a sales director, views dashboards, adds work items to the backlog and approves the releases assigned to her.
    - **Raj**, a QA lead, creates test plans and test suites and runs manual tests in Azure Test Plans.

    Neither user has a Visual Studio subscription or a GitHub Enterprise license. Licensing costs must be minimized.

    How should you complete the commands? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous ajoutez deux utilisateurs à l'organisation Azure DevOps **contoso** avec l'interface CLI Azure DevOps :

    - **Ana**, directrice commerciale, consulte des tableaux de bord, ajoute des éléments de travail au backlog et approuve les mises en production qui lui sont attribuées.
    - **Raj**, responsable QA, crée des plans de test et des suites de tests et exécute des tests manuels dans Azure Test Plans.

    Aucun des deux n'a d'abonnement Visual Studio ni de licence GitHub Enterprise. Les coûts de licence doivent être réduits au minimum.

    Comment devez-vous compléter les commandes ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: bash
  template: |
    az devops user add --email-id ana@contoso.com --license-type [[s1]] \
      --org https://dev.azure.com/contoso

    az devops user add --email-id raj@contoso.com --license-type [[s2]] \
      --org https://dev.azure.com/contoso
  slots:
    - id: s1
      options:
        - { id: stakeholder, text: stakeholder }
        - { id: express, text: express }
        - { id: advanced, text: advanced }
    - id: s2
      options:
        - { id: stakeholder, text: stakeholder }
        - { id: express, text: express }
        - { id: advanced, text: advanced }
answer:
  values: { s1: stakeholder, s2: advanced }
explanation:
  correct:
    en: |
      In the CLI and REST API, the license type `stakeholder` is the Stakeholder access level, `express` is Basic, and `advanced` is Basic + Test Plans. Stakeholder is free and covers work items, dashboards and assigned release approvals. Creating test plans and running manual tests requires Basic + Test Plans.
    fr: |
      Dans l'interface CLI et l'API REST, le type de licence `stakeholder` correspond au niveau d'accès Stakeholder, `express` à Basic et `advanced` à Basic + Test Plans. Stakeholder est gratuit et couvre les éléments de travail, les tableaux de bord et les approbations de mises en production attribuées. La création de plans de test et l'exécution de tests manuels nécessitent Basic + Test Plans.
  options:
    express:
      en: |
        Basic is a paid level that Ana doesn't need, and it doesn't include Azure Test Plans for Raj.
      fr: |
        Basic est un niveau payant dont Ana n'a pas besoin, et il n'inclut pas Azure Test Plans pour Raj.
references:
  - title: About access levels
    url: https://learn.microsoft.com/en-us/azure/devops/organizations/security/access-levels
