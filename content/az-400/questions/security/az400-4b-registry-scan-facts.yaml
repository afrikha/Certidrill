id: az400-4b-registry-scan-facts
objective: "4.3.5"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Tailspin Toys enables the Defender for Containers plan on an Azure subscription that contains an Azure container registry named **crtailspin**. Registry access is enabled for the plan. Build pipelines push new images to crtailspin every day, and some old images are no longer pulled.

    Which two statements about the vulnerability assessment of the images in crtailspin are true?

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin Toys active le plan Defender pour les conteneurs sur un abonnement Azure qui contient un registre de conteneurs Azure nommé **crtailspin**. L'accès au registre est activé pour le plan. Des pipelines de build poussent chaque jour de nouvelles images dans crtailspin, et certaines anciennes images ne sont plus tirées.

    Quelles sont les deux affirmations vraies concernant l'évaluation des vulnérabilités des images de crtailspin ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "A newly pushed image is typically scanned within a few hours.", fr: "Une image nouvellement poussée est généralement analysée en quelques heures." } }
    - { id: b, text: { en: "An image is rescanned every day for 90 days after its push, whether or not it's pulled.", fr: "Une image est réanalysée chaque jour pendant 90 jours après son push, qu'elle soit tirée ou non." } }
    - { id: c, text: { en: "Images pushed or pulled in the last 30 days are rescanned daily to update their findings.", fr: "Les images poussées ou tirées au cours des 30 derniers jours sont réanalysées chaque jour pour mettre à jour leurs résultats." } }
    - { id: d, text: { en: "The Defender sensor must be installed on the registry before images are scanned.", fr: "Le capteur Defender doit être installé sur le registre avant que les images soient analysées." } }
    - { id: e, text: { en: "Only images stored in Azure Container Registry can be assessed by Defender for Cloud.", fr: "Seules les images stockées dans Azure Container Registry peuvent être évaluées par Defender pour le cloud." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |
      Defender for Containers typically scans newly pushed or imported images within a few hours. A daily rescan updates the findings of images pushed or pulled in the last 30 days and of images running in monitored Kubernetes clusters; an image outside these criteria isn't rescanned until it's pulled again.
    fr: |
      Defender pour les conteneurs analyse généralement les images nouvellement poussées ou importées en quelques heures. Une nouvelle analyse quotidienne met à jour les résultats des images poussées ou tirées au cours des 30 derniers jours et des images exécutées dans des clusters Kubernetes surveillés ; une image hors de ces critères n'est plus réanalysée tant qu'elle n'est pas tirée de nouveau.
  options:
    b: { en: "The rescan window is 30 days since the last push or pull, not 90 days after the push.", fr: "La fenêtre de nouvelle analyse est de 30 jours depuis le dernier push ou pull, pas de 90 jours après le push." }
    d: { en: "Registry scanning needs registry access for the plan; the Defender sensor runs in Kubernetes clusters for runtime scenarios.", fr: "L'analyse du registre exige l'accès au registre pour le plan ; le capteur Defender s'exécute dans les clusters Kubernetes pour les scénarios d'exécution." }
    e: { en: "Amazon ECR, Google Artifact Registry, Google Container Registry and configured external registries such as Docker Hub are also supported.", fr: "Amazon ECR, Google Artifact Registry, Google Container Registry et des registres externes configurés comme Docker Hub sont aussi pris en charge." }
references:
  - title: Vulnerability management for containers
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/agentless-vulnerability-assessment-azure
