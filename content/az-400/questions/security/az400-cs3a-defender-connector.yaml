id: az400-cs3a-defender-connector
objective: "4.3.2"
type: yesno_statements
caseStudy: az400-cs3a-wingtip-shipping
difficulty: 2
status: draft
stem:
  en: |
    To meet requirement 4, you plan to create a GitHub connector in Microsoft Defender for Cloud for the wingtip organization. Sub-PortCall has no paid Defender CSPM plan, and you do not plan to enable one.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour satisfaire l'exigence 4, vous prévoyez de créer un connecteur GitHub dans Microsoft Defender pour le cloud pour l'organisation wingtip. Sub-PortCall n'a pas de plan payant Defender CSPM, et vous ne prévoyez pas d'en activer un.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          The account that authorizes the connector during its creation must be an owner of the wingtip organization in GitHub.
        fr: |
          Le compte qui autorise le connecteur lors de sa création doit être propriétaire de l'organisation wingtip dans GitHub.
    - id: s2
      text:
        en: |
          Recommendations about the secrets exposed in wingtip/portcall will appear in Defender for Cloud because secret scanning of GitHub Advanced Security is enabled on the repository.
        fr: |
          Des recommandations sur les secrets exposés dans wingtip/portcall apparaîtront dans Defender pour le cloud, car l'analyse des secrets de GitHub Advanced Security est activée sur le dépôt.
    - id: s3
      text:
        en: |
          The security team will be able to use attack path analysis to see how the findings of wingtip/portcall relate to the container apps in Sub-PortCall.
        fr: |
          L'équipe de sécurité pourra utiliser l'analyse du chemin d'attaque pour voir comment les résultats de wingtip/portcall se rattachent aux applications conteneur de Sub-PortCall.
answer:
  values: { s1: true, s2: true, s3: false }
explanation:
  correct:
    en: |
      Creating the GitHub connector requires the Contributor role on the Azure subscription and the Organization Owner role in GitHub, because the connector installs the Defender for Cloud DevOps security GitHub app on the organization. Exposed-secret and open-source vulnerability recommendations are part of the foundational CSPM capabilities and have GitHub Advanced Security as their prerequisite. Attack path analysis, cloud security explorer, and code-to-cloud mapping require the paid Defender CSPM plan.
    fr: |
      La création du connecteur GitHub exige le rôle Contributor sur l'abonnement Azure et le rôle Organization Owner dans GitHub, car le connecteur installe l'application GitHub de sécurité DevOps de Defender pour le cloud sur l'organisation. Les recommandations sur les secrets exposés et sur les vulnérabilités open source font partie des fonctionnalités CSPM de base et ont GitHub Advanced Security comme prérequis. L'analyse du chemin d'attaque, l'explorateur de sécurité cloud et le mappage du code au cloud exigent le plan payant Defender CSPM.
references:
  - title: Connect your GitHub organizations
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/quickstart-onboard-github
  - title: Support and prerequisites
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/devops-support
