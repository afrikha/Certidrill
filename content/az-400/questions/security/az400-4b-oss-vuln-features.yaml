id: az400-4b-oss-vuln-features
objective: "4.3.1"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    Litware, Inc. stores its code in two places:

    - GitHub Enterprise Cloud repositories that have GitHub Code Security.
    - Azure Repos repositories that have GitHub Code Security for Azure DevOps and are built by Azure Pipelines.

    The security team must be alerted to known vulnerabilities in the open-source packages that the applications depend on, in both places.

    Which two features should you use? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware, Inc. stocke son code à deux endroits :

    - des dépôts GitHub Enterprise Cloud qui disposent de GitHub Code Security ;
    - des dépôts Azure Repos qui disposent de GitHub Code Security for Azure DevOps et sont générés par Azure Pipelines.

    L'équipe de sécurité doit être alertée des vulnérabilités connues dans les packages open source dont dépendent les applications, aux deux endroits.

    Quelles sont les deux fonctionnalités à utiliser ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "CodeQL code scanning in the GitHub repositories", fr: "L'analyse du code (code scanning) CodeQL dans les dépôts GitHub" } }
    - { id: b, text: { en: "Dependabot alerts in the GitHub repositories", fr: "Les alertes Dependabot dans les dépôts GitHub" } }
    - { id: c, text: { en: "Push protection in the Azure Repos repositories", fr: "La protection push dans les dépôts Azure Repos" } }
    - { id: d, text: { en: "The Template Analyzer tool of Microsoft Security DevOps in Azure Pipelines", fr: "L'outil Template Analyzer de Microsoft Security DevOps dans Azure Pipelines" } }
    - { id: e, text: { en: "The AdvancedSecurity-Dependency-Scanning@1 task in Azure Pipelines", fr: "La tâche AdvancedSecurity-Dependency-Scanning@1 dans Azure Pipelines" } }
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: |
      Dependabot alerts compare the dependency graph of a GitHub repository with the GitHub Advisory Database and raise alerts for vulnerable packages. In Azure DevOps, dependency scanning is part of GitHub Code Security for Azure DevOps and runs in a pipeline through the AdvancedSecurity-Dependency-Scanning@1 task, with results aggregated per repository.
    fr: |
      Les alertes Dependabot comparent le graphe des dépendances d'un dépôt GitHub à la GitHub Advisory Database et lèvent des alertes pour les packages vulnérables. Dans Azure DevOps, l'analyse des dépendances fait partie de GitHub Code Security for Azure DevOps et s'exécute dans un pipeline avec la tâche AdvancedSecurity-Dependency-Scanning@1, les résultats étant agrégés par dépôt.
  options:
    a: { en: "CodeQL finds vulnerable patterns in your own code, not known vulnerabilities in third-party packages.", fr: "CodeQL trouve des modèles vulnérables dans votre propre code, pas les vulnérabilités connues des packages tiers." }
    c: { en: "Push protection blocks secrets in pushes; it doesn't assess packages.", fr: "La protection push bloque les secrets dans les pushes ; elle n'évalue pas les packages." }
    d: { en: "Template Analyzer checks ARM and Bicep templates for misconfigurations.", fr: "Template Analyzer vérifie les erreurs de configuration des modèles ARM et Bicep." }
references:
  - title: Configure GitHub Advanced Security for Azure DevOps features
    url: https://learn.microsoft.com/en-us/azure/devops/repos/security/configure-github-advanced-security-features
  - title: Dependabot alerts
    url: https://learn.microsoft.com/en-us/training/modules/configure-dependabot-security-updates-on-github-repo/3-dependabot-alerts
