id: az400-4b-generate-issue
objective: "4.3.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam has deployed the GitHub Advanced Security integration with Microsoft Defender for Cloud. A security manager reviews an **Update software** recommendation about a vulnerable container image that runs in Azure. The code-to-runtime diagram shows that the image is built from the GitHub repository **fabrikam/checkout**.

    The developers of fabrikam/checkout must receive a tracked work item in their repository that includes the runtime context of the finding, and its progress must be visible in Defender for Cloud. The solution must minimize administrative effort.

    What should the security manager do?
  fr: |
    Fabrikam a déployé l'intégration de GitHub Advanced Security avec Microsoft Defender pour le cloud. Un responsable de la sécurité examine une recommandation **Update software** concernant une image conteneur vulnérable exécutée dans Azure. Le diagramme du code à l'exécution montre que l'image est générée à partir du dépôt GitHub **fabrikam/checkout**.

    Les développeurs de fabrikam/checkout doivent recevoir dans leur dépôt un élément de travail suivi qui inclut le contexte d'exécution du résultat, et sa progression doit être visible dans Defender pour le cloud. La solution doit réduire au minimum l'effort d'administration.

    Que doit faire le responsable de la sécurité ?
body:
  options:
    - id: a
      text:
        en: "Create a workflow automation in Defender for Cloud that emails the recommendation to the repository administrators."
        fr: "Créer une automatisation de workflow dans Defender pour le cloud qui envoie la recommandation par e-mail aux administrateurs du dépôt."
    - id: b
      text:
        en: "Ask the developers to enable Dependabot security updates on fabrikam/checkout."
        fr: "Demander aux développeurs d'activer les mises à jour de sécurité Dependabot sur fabrikam/checkout."
    - id: c
      text:
        en: "Export the recommendations to a Log Analytics workspace, and create an alert rule for the repository."
        fr: "Exporter les recommandations vers un espace de travail Log Analytics, et créer une règle d'alerte pour le dépôt."
    - id: d
      text:
        en: "In Remediation Insights of the recommendation, select Take action > Generate GitHub issue."
        fr: "Dans Remediation Insights de la recommandation, sélectionner Take action > Generate GitHub issue."
answer: { optionId: d }
explanation:
  correct:
    en: |
      From a recommendation, **Take action** > **Generate GitHub issue** creates an issue in the repository of origin with the runtime context attached. The issue can be assigned to a developer, and its status is synchronized so that progress is visible in both GitHub and Defender for Cloud. Generating the issue requires GitHub and repository permissions.
    fr: |
      Depuis une recommandation, **Take action** > **Generate GitHub issue** crée un problème (issue) dans le dépôt d'origine avec le contexte d'exécution joint. Le problème peut être attribué à un développeur, et son état est synchronisé : la progression est visible à la fois dans GitHub et dans Defender pour le cloud. Générer le problème exige des autorisations GitHub et sur le dépôt.
  options:
    a: { en: "An email isn't a tracked item in the repository, and its progress isn't reflected in Defender for Cloud.", fr: "Un e-mail n'est pas un élément suivi dans le dépôt, et sa progression n'est pas reflétée dans Defender pour le cloud." }
    b: { en: "Dependabot security updates fix vulnerable packages declared in manifests; they don't create a tracked item linked to the Defender recommendation.", fr: "Les mises à jour de sécurité Dependabot corrigent les packages vulnérables déclarés dans les manifestes ; elles ne créent pas d'élément suivi lié à la recommandation de Defender." }
    c: { en: "A log alert notifies people but creates nothing in the repository and requires extra configuration.", fr: "Une alerte de journal avertit des personnes, mais ne crée rien dans le dépôt et exige une configuration supplémentaire." }
references:
  - title: Deploy GitHub Advanced Security integration with Microsoft Defender for Cloud
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/github-advanced-security-deploy
  - title: GitHub Advanced Security integration with Microsoft Defender for Cloud
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/github-advanced-security-overview
