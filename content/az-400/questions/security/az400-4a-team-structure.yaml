id: az400-4a-team-structure
objective: "4.1.7"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Tailspin is moving three feature teams, **Checkout**, **Catalog** and **Search**, to Azure Boards. The teams work on one product, share one Git repository and release together every two weeks.

    Each feature team must have its own backlog and board. A product manager must see the work of all three teams on a single backlog. The solution must minimize administrative effort.

    What should you do?
  fr: |
    Tailspin migre trois équipes de fonctionnalités, **Checkout**, **Catalog** et **Search**, vers Azure Boards. Les équipes travaillent sur un même produit, partagent un dépôt Git et livrent ensemble toutes les deux semaines.

    Chaque équipe de fonctionnalité doit avoir son propre backlog et son propre tableau. Un chef de produit doit voir le travail des trois équipes dans un seul backlog. La solution doit réduire au minimum l'effort d'administration.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Create one project with a team per feature team, each with its own area path, and a product team that selects the parent area path with its sub-areas.", fr: "Créer un projet avec une équipe par équipe de fonctionnalité, chacune avec son chemin de zone, et une équipe produit qui sélectionne le chemin de zone parent avec ses sous-zones." } }
    - { id: b, text: { en: "Create one project per feature team, each with its own repository, and a fourth project in which the product manager tracks the teams in a delivery plan.", fr: "Créer un projet par équipe de fonctionnalité, chacun avec son dépôt, et un quatrième projet dans lequel le chef de produit suit les équipes dans un plan de livraison." } }
    - { id: c, text: { en: "Create one project with a single team, and create one iteration path per feature team so that each team plans its own work.", fr: "Créer un projet avec une seule équipe, et créer un chemin d'itération par équipe de fonctionnalité pour que chaque équipe planifie son travail." } }
    - { id: d, text: { en: "Create one project with a team per feature team, and configure every team to select the root area path with its sub-areas.", fr: "Créer un projet avec une équipe par équipe de fonctionnalité, et configurer chaque équipe pour qu'elle sélectionne le chemin de zone racine avec ses sous-zones." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Teams that share a product, code and release cadence belong in one project. The work items under the area paths assigned to a team appear on that team's backlog and board, so one area path per team separates their work. A product team that selects the parent area path and includes its sub-areas gets a rollup view of all three teams.
    fr: |
      Des équipes qui partagent un produit, du code et un rythme de livraison appartiennent à un même projet. Les éléments de travail des chemins de zone attribués à une équipe apparaissent dans son backlog et son tableau : un chemin de zone par équipe sépare leur travail. Une équipe produit qui sélectionne le chemin de zone parent en incluant ses sous-zones obtient une vue consolidée des trois équipes.
  options:
    b:
      en: |
        Separate projects isolate the data and split a shared repository and release cadence, which adds administration without any benefit here.
      fr: |
        Des projets distincts isolent les données et séparent un dépôt et un rythme de livraison partagés, ce qui ajoute de l'administration sans bénéfice ici.
    c:
      en: |
        Iteration paths define sprints, not ownership; a single team has only one backlog and board.
      fr: |
        Les chemins d'itération définissent les sprints, pas l'appartenance ; une seule équipe n'a qu'un backlog et un tableau.
    d:
      en: |
        If every team selects the root area path with its sub-areas, every backlog shows all the work, so no team has its own backlog.
      fr: |
        Si chaque équipe sélectionne le chemin de zone racine avec ses sous-zones, chaque backlog affiche tout le travail : aucune équipe n'a son propre backlog.
references:
  - title: Define area paths and assign to a team
    url: https://learn.microsoft.com/en-us/azure/devops/organizations/settings/set-area-paths
