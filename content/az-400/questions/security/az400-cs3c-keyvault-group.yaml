id: az400-cs3c-keyvault-group
objective: "4.2.1"
type: yesno_statements
caseStudy: az400-cs3c-litware-energy
difficulty: 2
status: draft
stem:
  en: |
    vg-meterhub-secrets maps the secret sql-meterhub-pwd of kv-meterhub-prod. You are reviewing how the variable group behaves.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    vg-meterhub-secrets mappe le secret sql-meterhub-pwd de kv-meterhub-prod. Vous examinez le comportement du groupe de variables.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          After the security team creates a new version of sql-meterhub-pwd, the next run of each of the 14 pipelines uses the new value.
        fr: |
          Après que l'équipe de sécurité a créé une nouvelle version de sql-meterhub-pwd, la prochaine exécution de chacun des 14 pipelines utilise la nouvelle valeur.
    - id: s2
      text:
        en: |
          If the security team adds a secret named sql-reporting-pwd to kv-meterhub-prod, the pipelines can use it through vg-meterhub-secrets without anyone updating the variable group.
        fr: |
          Si l'équipe de sécurité ajoute un secret nommé sql-reporting-pwd à kv-meterhub-prod, les pipelines peuvent l'utiliser via vg-meterhub-secrets sans que personne ne mette à jour le groupe de variables.
    - id: s3
      text:
        en: |
          Assigning the Key Vault Reader role on kv-meterhub-prod to the identity of the service connection used by the variable group is enough for the pipelines to read the secret values.
        fr: |
          Attribuer le rôle Key Vault Reader sur kv-meterhub-prod à l'identité de la connexion de service utilisée par le groupe de variables suffit pour que les pipelines lisent les valeurs des secrets.
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: |
      A variable group linked to a key vault stores only the names of the mapped secrets; each run fetches the latest values from the vault, so a rotation reaches all the pipelines without any change. Secrets added to or deleted from the vault are not added to the group automatically: someone must update the mapped secrets. With the Azure RBAC permission model, the identity of the service connection needs a data-plane role such as Key Vault Secrets User; Key Vault Reader allows reading the vault metadata, not the secret values.
    fr: |
      Un groupe de variables lié à un coffre de clés ne stocke que les noms des secrets mappés ; chaque exécution récupère les dernières valeurs dans le coffre : une rotation atteint donc tous les pipelines sans aucune modification. Les secrets ajoutés au coffre ou supprimés ne sont pas ajoutés automatiquement au groupe : quelqu'un doit mettre à jour les secrets mappés. Avec le modèle d'autorisation Azure RBAC, l'identité de la connexion de service a besoin d'un rôle de plan de données comme Key Vault Secrets User ; Key Vault Reader permet de lire les métadonnées du coffre, pas les valeurs des secrets.
references:
  - title: Link a variable group to secrets in Azure Key Vault
    url: https://learn.microsoft.com/en-us/azure/devops/pipelines/library/link-variable-groups-to-key-vaults
