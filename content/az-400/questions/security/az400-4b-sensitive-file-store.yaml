id: az400-4b-sensitive-file-store
objective: "4.2.3"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Litware, Inc. uses Azure Pipelines for its mobile apps and GitHub Actions for its web apps. Several deployments need sensitive files. None of the files may be stored unencrypted in a Git repository.

    Where should you store each file? To answer, drag the appropriate storage options to the correct files. Each storage option may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware, Inc. utilise Azure Pipelines pour ses applications mobiles et GitHub Actions pour ses applications web. Plusieurs déploiements ont besoin de fichiers sensibles. Aucun fichier ne peut être stocké non chiffré dans un dépôt Git.

    Où devez-vous stocker chaque fichier ? Pour répondre, faites glisser les options de stockage appropriées vers les fichiers correspondants. Chaque option de stockage peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: securefile, text: { en: "An Azure Pipelines secure file", fr: "Un fichier sécurisé Azure Pipelines" } }
    - { id: kvcert, text: { en: "An Azure Key Vault certificate", fr: "Un certificat Azure Key Vault" } }
    - { id: b64secret, text: { en: "A GitHub Actions secret that contains the Base64-encoded file", fr: "Un secret GitHub Actions qui contient le fichier encodé en Base64" } }
    - { id: gpgfile, text: { en: "A gpg-encrypted file in the repository, with its passphrase in a GitHub Actions secret", fr: "Un fichier chiffré avec gpg dans le dépôt, avec sa phrase secrète dans un secret GitHub Actions" } }
    - { id: feed, text: { en: "A universal package in an Azure Artifacts feed", fr: "Un package universel dans un flux Azure Artifacts" } }
  targets:
    - { id: keystore, text: { en: "A 3 MB Android keystore that an Azure Pipelines YAML pipeline uses to sign the app", fr: "Un magasin de clés Android de 3 Mo qu'un pipeline YAML Azure Pipelines utilise pour signer l'application" } }
    - { id: tls, text: { en: "A TLS certificate that Azure App Service uses for a custom domain and that must be renewed in a single place", fr: "Un certificat TLS qu'Azure App Service utilise pour un domaine personnalisé et qui doit être renouvelé à un seul endroit" } }
    - { id: license, text: { en: "A 12 KB license file that a GitHub Actions workflow needs during the build", fr: "Un fichier de licence de 12 Ko dont un workflow GitHub Actions a besoin pendant le build" } }
    - { id: bundle, text: { en: "A 400 KB key bundle that a GitHub Actions workflow needs during the deployment", fr: "Un lot de clés de 400 Ko dont un workflow GitHub Actions a besoin pendant le déploiement" } }
answer:
  mapping: { keystore: securefile, tls: kvcert, license: b64secret, bundle: gpgfile }
explanation:
  correct:
    en: |
      Secure files hold files up to 10 MB, such as keystores, encrypted on the server and usable only from pipeline tasks. A TLS certificate used by an Azure service belongs in Key Vault, where it's renewed once and referenced by the service. A GitHub Actions secret holds at most 48 KB, so a small file can be stored Base64-encoded and decoded on the runner; a larger file is encrypted with gpg and committed, and only its passphrase is stored as a secret.
    fr: |
      Les fichiers sécurisés contiennent des fichiers de 10 Mo au maximum, comme des magasins de clés, chiffrés sur le serveur et utilisables uniquement depuis des tâches de pipeline. Un certificat TLS utilisé par un service Azure doit être placé dans Key Vault, où il est renouvelé une seule fois et référencé par le service. Un secret GitHub Actions contient au maximum 48 Ko : un petit fichier peut y être stocké encodé en Base64 et décodé sur l'exécuteur ; un fichier plus volumineux est chiffré avec gpg et commité, et seule sa phrase secrète est stockée en secret.
  options:
    feed: { en: "A feed is a package store: anyone with read access to it can download the file, and it isn't designed for secrets.", fr: "Un flux est un magasin de packages : toute personne qui y a accès en lecture peut télécharger le fichier, et il n'est pas conçu pour les secrets." }
references:
  - title: Secure files for Azure Pipelines
    url: https://learn.microsoft.com/en-us/azure/devops/pipelines/library/secure-files
