id: az400-4a-ado-effective-permission
objective: "4.1.5"
type: hotarea
difficulty: 2
status: draft
stem:
  en: |
    In an Azure DevOps project named **Phoenix**, a user named **User1** is a member of the Contributors group and of a group named **Contractors**. User1 isn't a member of Readers.

    The following table shows every assignment of the **Contribute** permission that exists for the Git repositories of Phoenix. Inheritance is enabled on every repository.

    Answer each prompt by selecting the assignment that determines User1's effective Contribute permission.

    NOTE: Each correct selection is worth one point.
  fr: |
    Dans un projet Azure DevOps nommé **Phoenix**, un utilisateur nommé **User1** est membre du groupe Contributors et d'un groupe nommé **Contractors**. User1 n'est pas membre de Readers.

    Le tableau suivant présente toutes les attributions de l'autorisation **Contribute** qui existent pour les dépôts Git de Phoenix. L'héritage est activé sur chaque dépôt.

    Répondez à chaque consigne en sélectionnant l'attribution qui détermine l'autorisation Contribute effective de User1.

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
    - id: p1
      text: { en: "User1 pushes a commit to a branch of the repository web-app.", fr: "User1 pousse un commit vers une branche du dépôt web-app." }
    - id: p2
      text: { en: "User1 pushes a commit to a branch of the repository api.", fr: "User1 pousse un commit vers une branche du dépôt api." }
  grid:
    header: [{ en: "Scope", fr: "Étendue" }, { en: "Group", fr: "Groupe" }, Permission, { en: "Value", fr: "Valeur" }]
    rows:
      - [{ text: { en: "Git repositories (all repositories)", fr: "Git repositories (tous les dépôts)" }, area: all }, { text: Contributors }, { text: Contribute }, { text: Allow }]
      - [{ text: { en: "Repository web-app", fr: "Dépôt web-app" }, area: webc }, { text: Contractors }, { text: Contribute }, { text: Deny }]
      - [{ text: { en: "Repository web-app", fr: "Dépôt web-app" }, area: webr }, { text: Readers }, { text: Contribute }, { text: Not set }]
      - [{ text: { en: "Repository api", fr: "Dépôt api" }, area: apic }, { text: Contractors }, { text: Contribute }, { text: Not set }]
answer:
  values: { p1: webc, p2: all }
explanation:
  correct:
    en: |
      Repositories inherit the assignments of the project-level Git repositories entry, so Contributors' Allow reaches web-app and api. On web-app, the Deny of Contractors applies to User1 and a Deny from one group takes precedence over an Allow from another group, so the push fails. On api, Not set neither grants nor denies and doesn't override another group's assignment, so the inherited Allow of Contributors applies.
    fr: |
      Les dépôts héritent des attributions de l'entrée Git repositories du projet ; l'Allow de Contributors atteint donc web-app et api. Sur web-app, le Deny de Contractors s'applique à User1, et un Deny d'un groupe l'emporte sur un Allow d'un autre groupe : la poussée échoue. Sur api, Not set n'accorde ni ne refuse rien et ne remplace pas l'attribution d'un autre groupe : l'Allow hérité de Contributors s'applique.
references:
  - title: About permissions and security groups
    url: https://learn.microsoft.com/en-us/azure/devops/organizations/security/about-permissions
  - title: Set Git repository permissions
    url: https://learn.microsoft.com/en-us/azure/devops/repos/git/set-git-repository-permissions
