id: az400-cs3b-qa-access
objective: "4.1.6"
type: single
caseStudy: az400-cs3b-proseware-games
difficulty: 1
status: draft
stem:
  en: |
    You add the eight Adatum QA testers to the proseware organization and to the Contributors group of the Skyforge project. You need to assign an access level to the testers that meets requirement 10. Which access level should you assign?
  fr: |
    Vous ajoutez les huit testeurs d'Adatum QA à l'organisation proseware et au groupe Contributors du projet Skyforge. Vous devez attribuer aux testeurs un niveau d'accès qui satisfait l'exigence 10. Quel niveau d'accès devez-vous attribuer ?
body:
  options:
    - { id: a, text: Stakeholder }
    - { id: b, text: Basic }
    - { id: c, text: Basic + Test Plans }
    - { id: d, text: Visual Studio Subscriber }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Stakeholder access is free for an unlimited number of users. In a private project, it lets users add and edit work items, update their state by dragging cards on a board, and view dashboards, but it gives no access to Azure Repos, so the testers cannot see the source code even as members of Contributors.
    fr: |
      L'accès Stakeholder est gratuit pour un nombre illimité d'utilisateurs. Dans un projet privé, il permet d'ajouter et de modifier des éléments de travail, d'en changer l'état en faisant glisser les cartes d'un tableau et de consulter les tableaux de bord, mais il ne donne aucun accès à Azure Repos : les testeurs ne peuvent donc pas voir le code source, même en tant que membres de Contributors.
  options:
    b:
      en: |
        Basic is a paid access level beyond the free users of the organization, and with membership in Contributors it gives access to the repository.
      fr: |
        Basic est un niveau d'accès payant au-delà des utilisateurs gratuits de l'organisation, et, avec l'appartenance à Contributors, il donne accès au dépôt.
    c:
      en: |
        Basic + Test Plans is a paid access level that also includes Azure Repos.
      fr: |
        Basic + Test Plans est un niveau d'accès payant qui inclut aussi Azure Repos.
    d:
      en: |
        Visual Studio Subscriber requires a Visual Studio subscription for each tester, and it includes Azure Repos.
      fr: |
        Visual Studio Subscriber exige un abonnement Visual Studio pour chaque testeur, et il inclut Azure Repos.
references:
  - title: Stakeholder access quick reference
    url: https://learn.microsoft.com/en-us/azure/devops/organizations/security/stakeholder-access
