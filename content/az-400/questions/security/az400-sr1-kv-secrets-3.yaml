id: az400-sr1-kv-secrets-3
objective: "4.2.1"
type: series_yesno
series: az400-sr1-kv-secrets
seriesOrder: 3
difficulty: 1
status: draft
stem:
  en: You copy the secret values into secret variables of a variable group.
  fr: Vous copiez les valeurs des secrets dans des variables secrètes d'un groupe de variables.
body:
  solution:
    en: |
      You create a variable group named **web-prod-secrets** in **Pipelines > Library**, add the variables SqlPassword and ApiKey with the values copied from kv-proseware-prod, and mark both variables as secret. You reference the variable group in web-deploy.
    fr: |
      Vous créez un groupe de variables nommé **web-prod-secrets** dans **Pipelines > Library**, ajoutez les variables SqlPassword et ApiKey avec les valeurs copiées depuis kv-proseware-prod et marquez les deux variables comme secrètes. Vous référencez le groupe de variables dans web-deploy.
answer: { value: false }
explanation:
  correct:
    en: Secret variables are encrypted and masked, but their values are still stored in Azure DevOps, which the first requirement forbids. After a rotation in the key vault, someone must also update the variable group by hand, so the next run would use the old values.
    fr: "Les variables secrètes sont chiffrées et masquées, mais leurs valeurs restent stockées dans Azure DevOps, ce que la première exigence interdit. Après un renouvellement dans le coffre de clés, quelqu'un doit aussi mettre à jour le groupe de variables manuellement : l'exécution suivante utiliserait les anciennes valeurs."
references:
  - title: Use Azure Key Vault secrets in Azure Pipelines
    url: https://learn.microsoft.com/en-us/azure/devops/pipelines/release/azure-key-vault
