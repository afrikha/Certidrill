id: az400-cs1b-analysts-access
objective: "4.1.6"
type: single
caseStudy: az400-cs1b-humongous-insurance
difficulty: 1
status: draft
stem:
  en: |
    You need to meet the planning requirement for the members of Claims Analysts.

    Which access level should you assign to them?
  fr: |
    Vous devez satisfaire l'exigence de planification pour les membres de Claims Analysts.

    Quel niveau d'accès devez-vous leur attribuer ?
body:
  options:
    - { id: a, text: Basic }
    - { id: b, text: Stakeholder }
    - { id: c, text: Basic + Test Plans }
    - { id: d, text: { en: "Basic, with membership in the Readers group of the project", fr: "Basic, avec l'appartenance au groupe Readers du projet" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Stakeholder access is free for an unlimited number of users. In a private project, Stakeholders can add and modify work items, view the boards and create queries, but they have no access to the code in Azure Repos.
    fr: |
      L'accès Stakeholder est gratuit pour un nombre illimité d'utilisateurs. Dans un projet privé, les utilisateurs Stakeholder peuvent ajouter et modifier des éléments de travail, consulter les tableaux et créer des requêtes, mais ils n'ont pas accès au code dans Azure Repos.
  options:
    a: { en: "Basic is a paid access level beyond the free users, and it includes full access to Azure Repos.", fr: "Basic est un niveau d'accès payant au-delà des utilisateurs gratuits, et il inclut un accès complet à Azure Repos." }
    c: { en: "Basic + Test Plans adds Azure Test Plans to Basic; it is paid and includes code access.", fr: "Basic + Test Plans ajoute Azure Test Plans à Basic ; il est payant et inclut l'accès au code." }
    d: { en: "Basic still requires a paid license, and members of Readers can view the work items but cannot create or update them.", fr: "Basic exige toujours une licence payante, et les membres de Readers peuvent consulter les éléments de travail mais pas les créer ni les modifier." }
references:
  - title: About access levels
    url: https://learn.microsoft.com/en-us/azure/devops/organizations/security/access-levels
