id: az400-cs4a-service-connection
objective: "4.1.3"
type: single
caseStudy: az400-cs4a-humongous-insurance
difficulty: 2
status: draft
stem:
  en: |
    You need to meet the authentication requirement for sc-claims-azure. What should you do?
  fr: |
    Vous devez satisfaire l'exigence d'authentification concernant sc-claims-azure. Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Store the client secret in an Azure key vault and link the vault to a variable group used by the pipelines.", fr: "Stocker la clé secrète client dans un coffre de clés Azure et lier le coffre à un groupe de variables utilisé par les pipelines." } }
    - { id: b, text: { en: "Convert sc-claims-azure to workload identity federation from Project settings > Service connections.", fr: "Convertir sc-claims-azure en fédération d'identité de charge de travail depuis Project settings > Service connections." } }
    - { id: c, text: { en: "Create a service connection that uses workload identity federation and update every pipeline to reference it.", fr: "Créer une connexion de service qui utilise la fédération d'identité de charge de travail et mettre à jour chaque pipeline pour qu'il la référence." } }
    - { id: d, text: { en: "Extend the lifetime of the client secret to 24 months and create an alert before it expires.", fr: "Prolonger la durée de vie de la clé secrète client à 24 mois et créer une alerte avant son expiration." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      An Azure Resource Manager service connection that Azure DevOps created automatically and that only one project uses can be converted in place to workload identity federation. The connection keeps its name, so the pipelines still reference sc-claims-azure, and no secret remains. The conversion can be reverted within seven days.
    fr: |
      Une connexion de service Azure Resource Manager créée automatiquement par Azure DevOps et utilisée par un seul projet peut être convertie sur place en fédération d'identité de charge de travail. La connexion garde son nom : les pipelines référencent toujours sc-claims-azure, et il ne reste aucun secret. La conversion peut être annulée pendant sept jours.
  options:
    a:
      en: |
        Key Vault protects where the secret is stored, but the connection still authenticates with a client secret, which requirement 9 forbids.
      fr: |
        Key Vault protège l'endroit où le secret est stocké, mais la connexion s'authentifie toujours avec une clé secrète client, ce que l'exigence 9 interdit.
    c:
      en: |
        A new connection removes the secret but forces changes to every pipeline definition, which violates the requirement to keep referencing sc-claims-azure and adds effort.
      fr: |
        Une nouvelle connexion supprime le secret mais impose de modifier chaque définition de pipeline, ce qui enfreint l'obligation de continuer à référencer sc-claims-azure et ajoute de l'effort.
    d:
      en: |
        A longer secret lifetime still relies on a client secret and increases the exposure if the secret leaks.
      fr: |
        Une durée de vie plus longue repose toujours sur une clé secrète client et augmente l'exposition en cas de fuite du secret.
references:
  - title: Use an Azure Resource Manager service connection
    url: https://learn.microsoft.com/en-us/azure/devops/pipelines/library/connect-to-azure
