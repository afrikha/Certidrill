id: az400-cs2a-qa-access
objective: "4.1.6"
type: single
caseStudy: az400-cs2a-trey-research
difficulty: 1
status: draft
stem:
  en: |
    You need to configure access for the Litware QA reviewers. The solution must meet the requirements.

    Which access level should you assign to the reviewers?
  fr: |
    Vous devez configurer l'accès des relecteurs QA de Litware. La solution doit respecter les exigences.

    Quel niveau d'accès devez-vous attribuer aux relecteurs ?
body:
  options:
    - { id: a, text: { en: "Basic", fr: "Basic" } }
    - { id: b, text: { en: "Basic + Test Plans", fr: "Basic + Test Plans" } }
    - { id: c, text: { en: "Stakeholder", fr: "Partie prenante (Stakeholder)" } }
    - { id: d, text: { en: "Visual Studio Enterprise subscriber", fr: "Abonné Visual Studio Enterprise" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Stakeholder access is free and can be assigned to an unlimited number of users. In a private project, Stakeholders can add and modify work items such as bugs and view dashboards, but they don't get access to the code in Azure Repos, which matches requirement 1.
    fr: |
      L'accès Partie prenante est gratuit et peut être attribué à un nombre illimité d'utilisateurs. Dans un projet privé, les parties prenantes peuvent ajouter et modifier des éléments de travail comme des bogues et consulter les tableaux de bord, mais elles n'ont pas accès au code d'Azure Repos, ce qui correspond à l'exigence 1.
  options:
    a: { en: "Basic is a paid access level and includes full access to Azure Repos, so it costs more and grants code access.", fr: "Basic est un niveau d'accès payant qui donne un accès complet à Azure Repos : il coûte plus cher et ouvre l'accès au code." }
    b: { en: "Basic + Test Plans adds manual test management on top of Basic; it is the most expensive option and also grants code access.", fr: "Basic + Test Plans ajoute la gestion des tests manuels à Basic ; c'est l'option la plus chère et elle donne aussi accès au code." }
    d: { en: "A Visual Studio Enterprise subscription is a paid license and includes access to the code repositories.", fr: "Un abonnement Visual Studio Enterprise est une licence payante qui inclut l'accès aux dépôts de code." }
references:
  - title: About access levels
    url: https://learn.microsoft.com/en-us/azure/devops/organizations/security/access-levels
