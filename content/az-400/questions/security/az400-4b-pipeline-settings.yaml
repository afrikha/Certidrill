id: az400-4b-pipeline-settings
objective: "4.2.4"
type: hotarea
difficulty: 3
status: draft
stem:
  en: |
    Woodgrove Bank has an Azure DevOps organization. The project **Retail** contains only YAML pipelines, including multistage pipelines that deploy to production. Another project, **Payments**, contains Git repositories that store sensitive code.

    The following table shows settings available in **Project settings** > **Pipelines** > **Settings** of Retail. All the settings are currently off at the organization level and in Retail.

    You need to reduce the risk of the Retail pipelines being misused. Answer each prompt by selecting the setting that you should turn on.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove Bank dispose d'une organisation Azure DevOps. Le projet **Retail** ne contient que des pipelines YAML, dont des pipelines multiphases qui déploient en production. Un autre projet, **Payments**, contient des dépôts Git qui stockent du code sensible.

    Le tableau suivant présente des paramètres disponibles dans **Project settings** > **Pipelines** > **Settings** de Retail. Tous les paramètres sont actuellement désactivés au niveau de l'organisation et dans Retail.

    Vous devez réduire le risque d'utilisation abusive des pipelines de Retail. Répondez à chaque consigne en sélectionnant le paramètre que vous devez activer.

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
    - id: p1
      text:
        en: "When a user queues a Retail pipeline, the user must be able to set only the variables that are marked as overridable."
        fr: "Lorsqu'un utilisateur met en file d'attente un pipeline de Retail, il ne doit pouvoir définir que les variables marquées comme remplaçables."
    - id: p2
      text:
        en: "The job access token of the Retail pipelines must be unable to read the repositories of Payments."
        fr: "Le jeton d'accès des travaux des pipelines de Retail ne doit pas pouvoir lire les dépôts de Payments."
  grid:
    header: [{ en: "Setting", fr: "Paramètre" }, { en: "State", fr: "État" }]
    rows:
      - [{ text: "Limit variables that can be set at queue time", area: queuetime }, { text: "Off" }]
      - [{ text: "Limit job authorization scope to current project for non-release pipelines", area: scopenonrelease }, { text: "Off" }]
      - [{ text: "Limit job authorization scope to current project for release pipelines", area: scoperelease }, { text: "Off" }]
      - [{ text: "Protect access to repositories in YAML pipelines", area: protectrepos }, { text: "Off" }]
      - [{ text: "Enable shell tasks arguments validation", area: shellvalidation }, { text: "Off" }]
answer:
  values: { p1: queuetime, p2: scopenonrelease }
explanation:
  correct:
    en: |
      With **Limit variables that can be set at queue time** on, users can set only the variables marked as settable at queue time and can't add new ones. YAML pipelines, including multistage deployment pipelines, are non-release pipelines; **Limit job authorization scope to current project for non-release pipelines** makes them use a project-scoped identity that can check out only the repositories of the current project.
    fr: |
      Lorsque **Limit variables that can be set at queue time** est activé, les utilisateurs ne peuvent définir que les variables marquées comme définissables au moment de la mise en file d'attente et ne peuvent pas en ajouter. Les pipelines YAML, y compris les pipelines de déploiement multiphases, sont des pipelines autres que de mise en production ; **Limit job authorization scope to current project for non-release pipelines** leur fait utiliser une identité limitée au projet, qui ne peut extraire que les dépôts du projet actuel.
  options:
    scoperelease: { en: "This setting applies to classic release pipelines, and Retail contains only YAML pipelines.", fr: "Ce paramètre s'applique aux pipelines de mise en production classiques, or Retail ne contient que des pipelines YAML." }
    protectrepos: { en: "This setting makes YAML pipelines ask for permission to use each repository, but once permitted the token can still access repositories in other projects.", fr: "Ce paramètre oblige les pipelines YAML à demander l'autorisation d'utiliser chaque dépôt, mais une fois l'autorisation accordée le jeton peut toujours accéder aux dépôts d'autres projets." }
    shellvalidation: { en: "This setting checks the arguments of shell tasks for characters that could inject commands; it doesn't control queue-time variables or token scope.", fr: "Ce paramètre vérifie dans les arguments des tâches shell les caractères susceptibles d'injecter des commandes ; il ne contrôle ni les variables de mise en file d'attente ni l'étendue du jeton." }
references:
  - title: Access repositories from pipelines
    url: https://learn.microsoft.com/en-us/azure/devops/pipelines/security/secure-access-to-repos
  - title: Securely use variables and parameters
    url: https://learn.microsoft.com/en-us/azure/devops/pipelines/security/inputs
