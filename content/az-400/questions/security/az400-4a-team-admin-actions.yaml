id: az400-4a-team-admin-actions
objective: "4.1.7"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    In an Azure DevOps project named **Fabrikam-Mobile**, Lena is a team administrator of the team **Payments**. She isn't a member of Project Administrators and has no other administrative permission.

    Which two actions can Lena perform?

    NOTE: Each correct selection is worth one point.
  fr: |
    Dans un projet Azure DevOps nommé **Fabrikam-Mobile**, Lena est administratrice de l'équipe **Payments**. Elle n'est pas membre de Project Administrators et n'a aucune autre autorisation d'administration.

    Quelles sont les deux actions que Lena peut effectuer ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Create a team named Payments-API in Fabrikam-Mobile.", fr: "Créer une équipe nommée Payments-API dans Fabrikam-Mobile." } }
    - { id: b, text: { en: "Add an area path under the root node of Fabrikam-Mobile.", fr: "Ajouter un chemin de zone sous le nœud racine de Fabrikam-Mobile." } }
    - { id: c, text: { en: "Add members to the Payments team.", fr: "Ajouter des membres à l'équipe Payments." } }
    - { id: d, text: { en: "Change the process used by Fabrikam-Mobile.", fr: "Changer le processus utilisé par Fabrikam-Mobile." } }
    - { id: e, text: { en: "Configure the backlogs, boards and taskboards of the Payments team.", fr: "Configurer les backlogs, les tableaux et les tableaux de tâches de l'équipe Payments." } }
answer: { optionIds: [ c, e ] }
explanation:
  correct:
    en: |
      Team administrators have the permissions to add team members and configure all team settings, including backlogs, boards and taskboards. These rights apply to their own team only.
    fr: |
      Les administrateurs d'équipe ont les autorisations nécessaires pour ajouter des membres à l'équipe et configurer tous ses paramètres, y compris les backlogs, les tableaux et les tableaux de tâches. Ces droits ne s'appliquent qu'à leur propre équipe.
  options:
    a:
      en: |
        Creating a team requires membership in Project Administrators.
      fr: |
        La création d'une équipe nécessite l'appartenance à Project Administrators.
    b:
      en: |
        Adding an area path under the root node requires membership in Project Administrators.
      fr: |
        L'ajout d'un chemin de zone sous le nœud racine nécessite l'appartenance à Project Administrators.
    d:
      en: |
        Changing a project's process is a project or organization administration task, not a team setting.
      fr: |
        Le changement de processus d'un projet relève de l'administration du projet ou de l'organisation, pas des paramètres d'équipe.
references:
  - title: Create or add a team
    url: https://learn.microsoft.com/en-us/azure/devops/organizations/settings/add-teams
  - title: Define area paths and assign to a team
    url: https://learn.microsoft.com/en-us/azure/devops/organizations/settings/set-area-paths
