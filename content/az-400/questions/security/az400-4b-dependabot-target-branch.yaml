id: az400-4b-dependabot-target-branch
objective: "4.3.6"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Northwind Traders has a GitHub repository whose default branch is **main**. Developers integrate their work in a branch named **develop**. Dependabot alerts and Dependabot security updates are enabled. The repository contains the following .github/dependabot.yml file.

    ```yaml
    version: 2
    updates:
      - package-ecosystem: "nuget"
        directory: "/"
        target-branch: "develop"
        schedule:
          interval: "weekly"
    ```

    A new advisory published in the GitHub Advisory Database affects a NuGet package used in main. A patched version exists.

    Which statement describes the pull requests that Dependabot opens?
  fr: |
    Northwind Traders dispose d'un dépôt GitHub dont la branche par défaut est **main**. Les développeurs intègrent leur travail dans une branche nommée **develop**. Les alertes Dependabot et les mises à jour de sécurité Dependabot sont activées. Le dépôt contient le fichier .github/dependabot.yml suivant.

    ```yaml
    version: 2
    updates:
      - package-ecosystem: "nuget"
        directory: "/"
        target-branch: "develop"
        schedule:
          interval: "weekly"
    ```

    Un nouvel avis publié dans la GitHub Advisory Database touche un package NuGet utilisé dans main. Une version corrigée existe.

    Quelle affirmation décrit les pull requests ouvertes par Dependabot ?
body:
  options:
    - id: a
      text:
        en: "The security update pull request and the weekly version update pull requests target develop."
        fr: "La pull request de mise à jour de sécurité et les pull requests hebdomadaires de mise à jour de version ciblent develop."
    - id: b
      text:
        en: "The security update pull request targets develop, and the weekly version update pull requests target main."
        fr: "La pull request de mise à jour de sécurité cible develop, et les pull requests hebdomadaires de mise à jour de version ciblent main."
    - id: c
      text:
        en: "The security update pull request targets main, and the weekly version update pull requests target develop."
        fr: "La pull request de mise à jour de sécurité cible main, et les pull requests hebdomadaires de mise à jour de version ciblent develop."
    - id: d
      text:
        en: "No security update pull request is opened while target-branch is set, and the weekly version update pull requests target develop."
        fr: "Aucune pull request de mise à jour de sécurité n'est ouverte tant que target-branch est défini, et les pull requests hebdomadaires de mise à jour de version ciblent develop."
answer: { optionId: c }
explanation:
  correct:
    en: |
      The target-branch option applies to version updates, so the weekly pull requests target develop. Security updates always use the default branch of the repository, where Dependabot alerts are raised, so the fix for the advisory is proposed against main; when target-branch is set, the other options of that ecosystem no longer apply to security updates either.
    fr: |
      L'option target-branch s'applique aux mises à jour de version : les pull requests hebdomadaires ciblent develop. Les mises à jour de sécurité utilisent toujours la branche par défaut du dépôt, où les alertes Dependabot sont levées : le correctif de l'avis est donc proposé sur main ; lorsque target-branch est défini, les autres options de cet écosystème ne s'appliquent pas non plus aux mises à jour de sécurité.
  options:
    a: { en: "Security updates ignore target-branch and always use the default branch.", fr: "Les mises à jour de sécurité ignorent target-branch et utilisent toujours la branche par défaut." }
    b: { en: "This inverts the behavior: target-branch affects version updates, not security updates.", fr: "Cela inverse le comportement : target-branch concerne les mises à jour de version, pas les mises à jour de sécurité." }
    d: { en: "Security updates are still opened; they just target the default branch.", fr: "Les mises à jour de sécurité sont toujours ouvertes ; elles ciblent simplement la branche par défaut." }
references:
  - title: Dependabot security updates
    url: https://learn.microsoft.com/en-us/training/modules/configure-dependabot-security-updates-on-github-repo/4-dependabot-security-updates
