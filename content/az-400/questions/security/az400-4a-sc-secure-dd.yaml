id: az400-4a-sc-secure-dd
objective: "4.1.3"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Litware has an Azure DevOps project named **Retail** that contains an Azure Resource Manager service connection named **sc-prod**. Several YAML pipelines exist in the project.

    You need to configure sc-prod to meet the following requirements.

    Which setting should you configure for each requirement? To answer, drag the appropriate settings to the correct requirements. Each setting may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware dispose d'un projet Azure DevOps nommé **Retail** qui contient une connexion de service Azure Resource Manager nommée **sc-prod**. Plusieurs pipelines YAML existent dans le projet.

    Vous devez configurer sc-prod pour répondre aux exigences suivantes.

    Quel paramètre devez-vous configurer pour chaque exigence ? Pour répondre, faites glisser les paramètres appropriés vers les exigences correspondantes. Chaque paramètre peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: pipeperm, text: { en: "Pipeline permissions restricted to selected pipelines", fr: "Autorisations de pipeline limitées à des pipelines sélectionnés" } }
    - { id: approval, text: { en: "Approvals check", fr: "Vérification Approvals" } }
    - { id: branch, text: { en: "Branch control check", fr: "Vérification Branch control" } }
    - { id: hours, text: { en: "Business hours check", fr: "Vérification Business hours" } }
    - { id: admin, text: { en: "Administrator role in the connection's security", fr: "Rôle Administrator dans la sécurité de la connexion" } }
    - { id: userrole, text: { en: "User role in the connection's security", fr: "Rôle User dans la sécurité de la connexion" } }
  targets:
    - id: t1
      text: { en: "Only the pipeline named retail-deploy can use sc-prod.", fr: "Seul le pipeline nommé retail-deploy peut utiliser sc-prod." }
    - id: t2
      text: { en: "A stage that uses sc-prod waits until a member of Release Managers approves it.", fr: "Une phase qui utilise sc-prod attend qu'un membre de Release Managers l'approuve." }
    - id: t3
      text: { en: "Only runs of the main branch can use sc-prod.", fr: "Seules les exécutions de la branche main peuvent utiliser sc-prod." }
    - id: t4
      text: { en: "The members of the Platform group can manage the roles of other users on sc-prod.", fr: "Les membres du groupe Platform peuvent gérer les rôles des autres utilisateurs sur sc-prod." }
answer:
  mapping: { t1: pipeperm, t2: approval, t3: branch, t4: admin }
explanation:
  correct:
    en: |
      Pipeline permissions decide which pipelines may use the connection; Microsoft recommends authorizing pipelines individually instead of granting access to all pipelines. Checks on the connection run before any stage that uses it, so an Approvals check waits for the approvers and a Branch control check accepts only the allowed branches. The Administrator role can use the connection and manage roles for other users and groups.
    fr: |
      Les autorisations de pipeline déterminent quels pipelines peuvent utiliser la connexion ; Microsoft recommande d'autoriser chaque pipeline individuellement plutôt que d'accorder l'accès à tous les pipelines. Les vérifications de la connexion s'exécutent avant toute phase qui l'utilise : une vérification Approvals attend les approbateurs et une vérification Branch control n'accepte que les branches autorisées. Le rôle Administrator peut utiliser la connexion et gérer les rôles des autres utilisateurs et groupes.
  options:
    hours:
      en: |
        Business hours limits when a stage can run, not which pipeline or branch uses the connection.
      fr: |
        Business hours limite le moment où une phase peut s'exécuter, pas le pipeline ni la branche qui utilisent la connexion.
    userrole:
      en: |
        The User role lets people use the connection in pipelines but not manage roles.
      fr: |
        Le rôle User permet d'utiliser la connexion dans des pipelines, mais pas de gérer les rôles.
references:
  - title: Manage security in Azure Pipelines
    url: https://learn.microsoft.com/en-us/azure/devops/pipelines/policies/permissions
  - title: Manage service connections
    url: https://learn.microsoft.com/en-us/azure/devops/pipelines/library/service-endpoints
