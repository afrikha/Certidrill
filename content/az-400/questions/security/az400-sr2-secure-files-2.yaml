id: az400-sr2-secure-files-2
objective: "4.2.3"
type: series_yesno
series: az400-sr2-secure-files
seriesOrder: 2
difficulty: 1
status: draft
stem:
  en: You upload a secure file, select Open access, and add an approval check.
  fr: Vous chargez un fichier sécurisé, sélectionnez Open access et ajoutez une vérification d'approbation.
body:
  solution:
    en: |
      You upload release.jks to **Pipelines** > **Library** > **Secure files**. On the file, you select **More actions** > **Open access**. In **Approvals and checks**, you add an **Approvals** check with the Mobile Security group as approver. android-release downloads the file by using the `DownloadSecureFile@1` task.
    fr: |
      Vous chargez release.jks dans **Pipelines** > **Library** > **Secure files**. Sur le fichier, vous sélectionnez **More actions** > **Open access**. Dans **Approvals and checks**, vous ajoutez une vérification **Approvals** avec le groupe Mobile Security comme approbateur. android-release télécharge le fichier à l'aide de la tâche `DownloadSecureFile@1`.
answer: { value: false }
explanation:
  correct:
    en: Open access authorizes every pipeline of the project to use the secure file, so android-ci could also reference release.jks. The approval check adds a human gate but does not restrict which pipelines can request the file.
    fr: Open access autorise tous les pipelines du projet à utiliser le fichier sécurisé ; android-ci pourrait donc aussi référencer release.jks. La vérification d'approbation ajoute une validation humaine mais ne limite pas les pipelines qui peuvent demander le fichier.
references:
  - title: Secure files for Azure Pipelines - Azure Pipelines
    url: https://learn.microsoft.com/en-us/azure/devops/pipelines/library/secure-files
