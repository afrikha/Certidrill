id: az400-4b-library-roles
objective: "4.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Contoso, Ltd. has an Azure DevOps project named **Payments**. The Library of the project stores code-signing certificates and keystores as secure files.

    Members of a group named **Release Engineers** must be able to upload new secure files to the Library. They must not be able to view or use the existing secure files, and they must not be able to manage the permissions of other users. The solution must follow the principle of least privilege.

    Which security role should you assign to Release Engineers at the Library level?
  fr: |
    Contoso, Ltd. dispose d'un projet Azure DevOps nommé **Payments**. La bibliothèque (Library) du projet stocke des certificats de signature de code et des magasins de clés sous forme de fichiers sécurisés.

    Les membres d'un groupe nommé **Release Engineers** doivent pouvoir charger de nouveaux fichiers sécurisés dans la bibliothèque. Ils ne doivent pas pouvoir afficher ni utiliser les fichiers sécurisés existants, ni gérer les autorisations des autres utilisateurs. La solution doit respecter le principe du moindre privilège.

    Quel rôle de sécurité devez-vous attribuer à Release Engineers au niveau de la bibliothèque ?
body:
  options:
    - { id: a, text: Reader }
    - { id: b, text: User }
    - { id: c, text: Administrator }
    - { id: d, text: Creator }
answer: { optionId: d }
explanation:
  correct:
    en: |
      The Creator role can create new Library items such as secure files. It doesn't include the Reader or User permissions and can't manage the permissions of other users. The creator of an item becomes Administrator of that item only, so the existing secure files stay out of reach.
    fr: |
      Le rôle Creator peut créer de nouveaux éléments de bibliothèque comme des fichiers sécurisés. Il n'inclut pas les autorisations Reader ni User et ne peut pas gérer les autorisations des autres utilisateurs. Le créateur d'un élément devient Administrator de cet élément uniquement : les fichiers sécurisés existants restent hors de portée.
  options:
    a: { en: "Reader can view items but can't create them.", fr: "Reader peut afficher les éléments, mais pas en créer." }
    b: { en: "User can use items in pipelines but can't create them, and using existing files is forbidden here.", fr: "User peut utiliser les éléments dans les pipelines, mais pas en créer, et l'utilisation des fichiers existants est interdite ici." }
    c: { en: "Administrator includes Reader, User and Creator and can manage role membership, which exceeds the requirement.", fr: "Administrator inclut Reader, User et Creator et peut gérer l'appartenance aux rôles, ce qui dépasse l'exigence." }
references:
  - title: Asset library
    url: https://learn.microsoft.com/en-us/azure/devops/pipelines/library/
