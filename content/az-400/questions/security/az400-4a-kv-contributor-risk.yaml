id: az400-4a-kv-contributor-risk
objective: "4.2.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    An Azure key vault named **kv-litware-ci** uses the **Vault access policy** permission model. Access policies grant the Get and List secret permissions to the identities of three Azure Pipelines service connections. A contractor team has the Key Vault Contributor role on the vault so that it can manage the vault's network settings and tags.

    A security review finds that the contractors could read the secrets even though no access policy grants them access.

    You need to ensure that the contractors keep managing the vault resource but can't obtain access to secret values. The pipelines must keep reading the secrets.

    What should you do?
  fr: |
    Un coffre de clés Azure nommé **kv-litware-ci** utilise le modèle d'autorisation **Vault access policy**. Des stratégies d'accès accordent les autorisations de secret Get et List aux identités de trois connexions de service Azure Pipelines. Une équipe de sous-traitants a le rôle Key Vault Contributor sur le coffre pour gérer ses paramètres réseau et ses étiquettes.

    Un audit de sécurité constate que les sous-traitants pourraient lire les secrets alors qu'aucune stratégie d'accès ne leur accorde d'accès.

    Vous devez faire en sorte que les sous-traitants continuent à gérer la ressource coffre sans pouvoir obtenir l'accès aux valeurs des secrets. Les pipelines doivent continuer à lire les secrets.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Enable purge protection on kv-litware-ci, and then remove the List permission from every access policy.", fr: "Activer la protection contre la suppression définitive sur kv-litware-ci, puis retirer l'autorisation List de chaque stratégie d'accès." } }
    - { id: b, text: { en: "Replace the Key Vault Contributor assignment with Key Vault Reader, and then add an access policy for the contractors.", fr: "Remplacer l'attribution Key Vault Contributor par Key Vault Reader, puis ajouter une stratégie d'accès pour les sous-traitants." } }
    - { id: c, text: { en: "Restrict the vault firewall to the agents' networks, and then remove the contractors from every access policy.", fr: "Limiter le pare-feu du coffre aux réseaux des agents, puis retirer les sous-traitants de chaque stratégie d'accès." } }
    - { id: d, text: { en: "Assign Key Vault Secrets User to the pipeline identities, and then switch the vault to the Azure role-based access control model.", fr: "Attribuer Key Vault Secrets User aux identités des pipelines, puis passer le coffre au modèle contrôle d'accès en fonction du rôle Azure." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Key Vault Contributor manages the vault resource only, but with the access policy model a principal that can write the vault's control plane can grant itself data plane access by editing an access policy. With the Azure RBAC model, data access requires a data role, and Key Vault Contributor can't create role assignments. Assigning Key Vault Secrets User to the pipeline identities first keeps the pipelines working after the switch.
    fr: |
      Key Vault Contributor gère uniquement la ressource coffre, mais avec le modèle des stratégies d'accès, un principal qui peut écrire dans le plan de contrôle du coffre peut s'accorder l'accès au plan de données en modifiant une stratégie d'accès. Avec le modèle Azure RBAC, l'accès aux données exige un rôle de données, et Key Vault Contributor ne peut pas créer d'attributions de rôles. Attribuer d'abord Key Vault Secrets User aux identités des pipelines garantit qu'ils continuent de fonctionner après le changement.
  options:
    a:
      en: |
        Purge protection only prevents early purging, and the contractors could still add an access policy for themselves.
      fr: |
        La protection contre la suppression définitive empêche seulement une purge anticipée, et les sous-traitants pourraient toujours s'ajouter une stratégie d'accès.
    b:
      en: |
        Key Vault Reader can't manage network settings, and an access policy for the contractors is the access you must prevent.
      fr: |
        Key Vault Reader ne peut pas gérer les paramètres réseau, et une stratégie d'accès pour les sous-traitants est précisément l'accès à empêcher.
    c:
      en: |
        The contractors have no access policy to remove, and as Contributors they can change the firewall and the access policies themselves.
      fr: |
        Les sous-traitants n'ont aucune stratégie d'accès à retirer, et en tant que Contributors ils peuvent modifier eux-mêmes le pare-feu et les stratégies d'accès.
references:
  - title: Provide access to Key Vault keys, certificates, and secrets with Azure role-based access control
    url: https://learn.microsoft.com/en-us/azure/key-vault/general/rbac-guide
