id: az400-4a-access-statements
objective: "4.1.6"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Contoso uses a private Azure DevOps project named **Retail** and a GitHub organization on GitHub Enterprise Cloud. You are reviewing the access of several users.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso utilise un projet Azure DevOps privé nommé **Retail** et une organisation GitHub sur GitHub Enterprise Cloud. Vous examinez l'accès de plusieurs utilisateurs.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          A user who is assigned the Stakeholder access level and who has a GitHub Enterprise license receives Basic access in Azure DevOps.
        fr: |
          Un utilisateur auquel le niveau d'accès Stakeholder est attribué et qui dispose d'une licence GitHub Enterprise reçoit l'accès Basic dans Azure DevOps.
    - id: s2
      text:
        en: |
          A user who has the Stakeholder access level can browse the files of the Azure Repos Git repositories of Retail.
        fr: |
          Un utilisateur qui a le niveau d'accès Stakeholder peut parcourir les fichiers des dépôts Git Azure Repos de Retail.
    - id: s3
      text:
        en: |
          Adding an outside collaborator to a private repository of the GitHub organization uses one of the organization's paid licenses.
        fr: |
          L'ajout d'un collaborateur externe à un dépôt privé de l'organisation GitHub utilise l'une des licences payantes de l'organisation.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |
      Azure DevOps recognizes a GitHub Enterprise license at sign-in and gives Basic access, whatever access level is assigned. In private projects, Stakeholders have no access to Azure Repos code. Unless the organization is on a free plan, an outside collaborator added to a private repository uses a paid license.
    fr: |
      Azure DevOps reconnaît une licence GitHub Enterprise à la connexion et donne l'accès Basic, quel que soit le niveau d'accès attribué. Dans les projets privés, les Stakeholders n'ont pas accès au code d'Azure Repos. Sauf avec un forfait gratuit, un collaborateur externe ajouté à un dépôt privé utilise une licence payante.
references:
  - title: About access levels
    url: https://learn.microsoft.com/en-us/azure/devops/organizations/security/access-levels
  - title: Stakeholder access quick reference
    url: https://learn.microsoft.com/en-us/azure/devops/organizations/security/stakeholder-access
