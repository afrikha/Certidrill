id: az400-4b-scan-stages
objective: "4.3.1"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Northwind Traders is designing a security scanning strategy for its GitHub repositories. Each scan must run at the point of the development lifecycle where it can meet its goal.

    At which point should each scan run? To answer, drag the appropriate points to the correct goals. Each point may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind Traders conçoit une stratégie d'analyse de la sécurité pour ses dépôts GitHub. Chaque analyse doit s'exécuter au moment du cycle de développement où elle peut atteindre son objectif.

    À quel moment chaque analyse doit-elle s'exécuter ? Pour répondre, faites glisser les moments appropriés vers les objectifs correspondants. Chaque moment peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: push, text: { en: "When commits are pushed to GitHub", fr: "Lorsque des commits sont poussés vers GitHub" } }
    - { id: pr, text: { en: "During pull request validation", fr: "Pendant la validation des pull requests" } }
    - { id: schedule, text: { en: "On a weekly schedule against the default branch", fr: "Selon une planification hebdomadaire sur la branche par défaut" } }
    - { id: advisory, text: { en: "When a new advisory is added to the GitHub Advisory Database", fr: "Lorsqu'un nouvel avis est ajouté à la GitHub Advisory Database" } }
    - { id: approval, text: { en: "During a manual approval before the production deployment", fr: "Pendant une approbation manuelle avant le déploiement en production" } }
  targets:
    - { id: key, text: { en: "Reject a commit that contains a storage account key before it reaches the remote repository", fr: "Refuser un commit qui contient une clé de compte de stockage avant qu'il n'atteigne le dépôt distant" } }
    - { id: license, text: { en: "Block the merge of a change that adds a package with a denied license", fr: "Bloquer la fusion d'une modification qui ajoute un package sous une licence refusée" } }
    - { id: queries, text: { en: "Run the latest CodeQL queries against code that hasn't changed for months", fr: "Exécuter les dernières requêtes CodeQL sur du code qui n'a pas changé depuis des mois" } }
    - { id: cve, text: { en: "Learn that a package already used on the default branch is affected by a newly disclosed vulnerability", fr: "Savoir qu'un package déjà utilisé sur la branche par défaut est touché par une vulnérabilité récemment divulguée" } }
answer:
  mapping: { key: push, license: pr, queries: schedule, cve: advisory }
explanation:
  correct:
    en: |
      Push protection evaluates pushes and blocks secrets before they land. License and vulnerability checks on dependency changes belong in pull request validation, made required so they block the merge. A scheduled scan of the default branch applies new queries to code nobody touches. Dependabot alerts are raised when a new advisory enters the GitHub Advisory Database or when the dependency graph changes, without waiting for a code change.
    fr: |
      La protection push évalue les pushes et bloque les secrets avant qu'ils n'arrivent. Les vérifications de licences et de vulnérabilités sur les modifications de dépendances se placent dans la validation des pull requests, rendue obligatoire pour bloquer la fusion. Une analyse planifiée de la branche par défaut applique les nouvelles requêtes au code que personne ne modifie. Les alertes Dependabot sont levées quand un nouvel avis entre dans la GitHub Advisory Database ou quand le graphe des dépendances change, sans attendre une modification du code.
  options:
    approval: { en: "A manual approval before production comes too late: the secret, the license or the vulnerable code would already be merged.", fr: "Une approbation manuelle avant la production arrive trop tard : le secret, la licence ou le code vulnérable seraient déjà fusionnés." }
references:
  - title: Dependabot alerts
    url: https://learn.microsoft.com/en-us/training/modules/configure-dependabot-security-updates-on-github-repo/3-dependabot-alerts
  - title: Set up secret scanning for GitHub Advanced Security
    url: https://learn.microsoft.com/en-us/azure/devops/repos/security/github-advanced-security-secret-scanning
