id: az400-4a-fic-tags-environment
objective: "4.2.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A workflow in the GitHub repository **fabrikam/api** deploys to Azure when a tag that matches `v*` is pushed. The workflow signs in with OpenID Connect as a user-assigned managed identity named **id-api-deploy**.

    Today, the team adds a new federated identity credential to id-api-deploy for each release tag, and the identity is close to the maximum number of federated credentials.

    You need a configuration that works for every future release tag without adding federated credentials. No secret must be stored in GitHub.

    What should you do?
  fr: |
    Un workflow du dépôt GitHub **fabrikam/api** déploie dans Azure lorsqu'une balise correspondant à `v*` est poussée. Le workflow se connecte avec OpenID Connect en tant qu'identité managée attribuée par l'utilisateur nommée **id-api-deploy**.

    Aujourd'hui, l'équipe ajoute une nouvelle information d'identification fédérée à id-api-deploy pour chaque balise de version, et l'identité approche du nombre maximal d'informations d'identification fédérées.

    Vous avez besoin d'une configuration qui fonctionne pour toutes les futures balises de version sans ajouter d'informations d'identification fédérées. Aucun secret ne doit être stocké dans GitHub.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Replace the credentials with one credential whose subject is `repo:fabrikam/api:ref:refs/tags/v*`.", fr: "Remplacer les informations d'identification par une seule dont le sujet est `repo:fabrikam/api:ref:refs/tags/v*`." } }
    - { id: b, text: { en: "Replace the credentials with one credential whose subject is `repo:fabrikam/api:ref:refs/heads/main`.", fr: "Remplacer les informations d'identification par une seule dont le sujet est `repo:fabrikam/api:ref:refs/heads/main`." } }
    - { id: c, text: { en: "Make the deploy job reference an environment named release, and use one credential whose subject is `repo:fabrikam/api:environment:release`.", fr: "Faire référencer par le job de déploiement un environnement nommé release, et utiliser une seule information d'identification dont le sujet est `repo:fabrikam/api:environment:release`." } }
    - { id: d, text: { en: "Create a client secret for an app registration and store it in a repository secret named AZURE_CREDENTIALS.", fr: "Créer un secret client pour une inscription d'application et le stocker dans un secret de dépôt nommé AZURE_CREDENTIALS." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Federated identity credentials don't support wildcards or pattern matching for branches and tags, and an application or user-assigned managed identity accepts at most 20 federated credentials. When the job references an environment, the OIDC token presents the environment subject, so one credential for `environment:release` covers every tag that deploys through that environment.
    fr: |
      Les informations d'identification fédérées ne prennent pas en charge les caractères génériques ni la correspondance de modèles pour les branches et les balises, et une application ou une identité managée attribuée par l'utilisateur accepte au maximum 20 informations d'identification fédérées. Lorsque le job référence un environnement, le jeton OIDC présente le sujet de l'environnement : une seule information d'identification pour `environment:release` couvre toutes les balises qui déploient via cet environnement.
  options:
    a:
      en: |
        The subject must match exactly; `v*` is compared literally, so no tag matches it.
      fr: |
        Le sujet doit correspondre exactement ; `v*` est comparé littéralement, aucune balise n'y correspond donc.
    b:
      en: |
        A job triggered by a tag push runs on the tag ref, not on refs/heads/main, so the token exchange fails.
      fr: |
        Un job déclenché par la poussée d'une balise s'exécute sur la référence de la balise, pas sur refs/heads/main : l'échange de jetons échoue.
    d:
      en: |
        A client secret stored in GitHub violates the requirement and must be rotated.
      fr: |
        Un secret client stocké dans GitHub enfreint l'exigence et doit être renouvelé.
references:
  - title: Configure an app to trust an external identity provider
    url: https://learn.microsoft.com/en-us/entra/workload-id/workload-identity-federation-create-trust
