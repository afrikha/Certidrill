id: az400-4a-gh-env-secret-approval
objective: "4.2.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    The GitHub repository **contoso/payments** contains a workflow with a job named **deploy-prod** that needs the production database password.

    You need to ensure that the password can be read only by jobs that a member of the team **release-managers** has approved.

    Which two actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Le dépôt GitHub **contoso/payments** contient un workflow avec un job nommé **deploy-prod** qui a besoin du mot de passe de la base de données de production.

    Vous devez faire en sorte que le mot de passe ne puisse être lu que par les jobs approuvés par un membre de l'équipe **release-managers**.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Store the password as a secret of an environment named production, and make deploy-prod reference the environment.", fr: "Stocker le mot de passe comme secret d'un environnement nommé production, et faire référencer l'environnement par deploy-prod." } }
    - { id: b, text: { en: "Store the password as a repository secret, and add an `if:` condition on github.actor to deploy-prod.", fr: "Stocker le mot de passe comme secret de dépôt, et ajouter à deploy-prod une condition `if:` sur github.actor." } }
    - { id: c, text: { en: "Store the password as an organization secret that is available to selected repositories only.", fr: "Stocker le mot de passe comme secret d'organisation disponible uniquement pour des dépôts sélectionnés." } }
    - { id: d, text: { en: "Add release-managers as required reviewers of the production environment.", fr: "Ajouter release-managers comme réviseurs requis de l'environnement production." } }
    - { id: e, text: { en: "Add a ruleset on main that requires an approving review from release-managers.", fr: "Ajouter sur main un ensemble de règles qui exige une révision approuvée par release-managers." } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: |
      Environment secrets are read only when a job that references the environment starts, and a job can't access them until the required reviewers approve it. Storing the password in the production environment and adding release-managers as required reviewers therefore gates every read behind an approval.
    fr: |
      Les secrets d'environnement ne sont lus qu'au démarrage d'un job qui référence l'environnement, et un job ne peut pas y accéder tant que les réviseurs requis ne l'ont pas approuvé. Stocker le mot de passe dans l'environnement production et ajouter release-managers comme réviseurs requis conditionne donc chaque lecture à une approbation.
  options:
    b:
      en: |
        A repository secret is available to every workflow of the repository, and a condition on the actor isn't an approval.
      fr: |
        Un secret de dépôt est disponible pour tous les workflows du dépôt, et une condition sur l'acteur n'est pas une approbation.
    c:
      en: |
        An organization secret limits which repositories can use the secret, not which jobs are approved.
      fr: |
        Un secret d'organisation limite les dépôts qui peuvent l'utiliser, pas les jobs approuvés.
    e:
      en: |
        A ruleset controls merges into main; workflows triggered another way, or from other branches, could still read a repository secret.
      fr: |
        Un ensemble de règles contrôle les fusions dans main ; des workflows déclenchés autrement, ou depuis d'autres branches, pourraient toujours lire un secret de dépôt.
references:
  - title: Control deployments with GitHub environments
    url: https://learn.microsoft.com/en-us/training/modules/deploy-model-github-actions/4-control-deployments-github-environments
