id: az400-4a-gh-token-facts
objective: "4.1.2"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    You are reviewing the workflows of a GitHub repository named **contoso/api**. The jobs call the GitHub API by using GITHUB_TOKEN.

    Which two statements about GITHUB_TOKEN are true?

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous examinez les workflows d'un dépôt GitHub nommé **contoso/api**. Les jobs appellent l'API GitHub avec GITHUB_TOKEN.

    Quelles sont les deux affirmations vraies concernant GITHUB_TOKEN ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "The token expires when the job finishes or when it reaches its maximum lifetime.", fr: "Le jeton expire à la fin du job ou lorsqu'il atteint sa durée de vie maximale." } }
    - { id: b, text: { en: "The token can push to another private repository of the organization if the job has the `contents: write` permission.", fr: "Le jeton peut pousser vers un autre dépôt privé de l'organisation si le job a l'autorisation `contents: write`." } }
    - { id: c, text: { en: "The token's permissions are limited to contoso/api, the repository that contains the workflow.", fr: "Les autorisations du jeton sont limitées à contoso/api, le dépôt qui contient le workflow." } }
    - { id: d, text: { en: "A commit pushed with the token starts the workflows of contoso/api that run on push.", fr: "Un commit poussé avec le jeton démarre les workflows de contoso/api qui s'exécutent sur push." } }
    - { id: e, text: { en: "The token acts as the user who triggered the workflow and has that user's permissions.", fr: "Le jeton agit en tant qu'utilisateur ayant déclenché le workflow et dispose de ses autorisations." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |
      GITHUB_TOKEN is generated for each job and expires when the job finishes or at its maximum lifetime. Its permissions are limited to the repository that contains the workflow, and the permissions key only narrows or widens what it can do inside that repository.
    fr: |
      GITHUB_TOKEN est généré pour chaque job et expire à la fin du job ou à sa durée de vie maximale. Ses autorisations sont limitées au dépôt qui contient le workflow, et la clé permissions ne fait que restreindre ou étendre ce qu'il peut faire dans ce dépôt.
  options:
    b:
      en: |
        The token never reaches other repositories; use a GitHub App installation token for cross-repository access.
      fr: |
        Le jeton n'atteint jamais d'autres dépôts ; utilisez un jeton d'installation de GitHub App pour un accès entre dépôts.
    d:
      en: |
        Events created with GITHUB_TOKEN don't create new workflow runs, except workflow_dispatch and repository_dispatch, to prevent recursive runs.
      fr: |
        Les événements créés avec GITHUB_TOKEN ne créent pas de nouvelles exécutions, sauf workflow_dispatch et repository_dispatch, pour éviter les exécutions récursives.
    e:
      en: |
        The token isn't a user credential; its permissions come from the workflow permissions settings and the permissions key.
      fr: |
        Le jeton n'est pas une information d'identification d'utilisateur ; ses autorisations viennent des paramètres d'autorisations des workflows et de la clé permissions.
references:
  - title: Identify supported Access Tokens
    url: https://learn.microsoft.com/en-us/training/modules/automate-devops-github-apps/manage-tokens
