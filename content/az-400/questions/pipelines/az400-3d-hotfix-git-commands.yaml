id: az400-3d-hotfix-git-commands
objective: "3.4.4"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Tailspin Toys is documenting the Git commands of its hotfix plan. The repository is shared by 40 developers, and the history of shared branches must never be rewritten.

    Which command should you use for each step? To answer, drag the appropriate commands to the correct steps. Each command may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin Toys documente les commandes Git de son plan de correctifs. Le dépôt est partagé par 40 développeurs, et l'historique des branches partagées ne doit jamais être réécrit.

    Quelle commande devez-vous utiliser pour chaque étape ? Pour répondre, faites glisser les commandes appropriées vers les étapes correspondantes. Chaque commande peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: switch, text: "git switch -c" }
    - { id: cherry, text: "git cherry-pick" }
    - { id: revert, text: "git revert" }
    - { id: tag, text: "git tag -a" }
    - { id: reset, text: "git reset --hard" }
    - { id: rebase, text: "git rebase" }
  targets:
    - id: t1
      text: { en: "Start a hotfix branch from the commit that is deployed in production", fr: "Démarrer une branche de correctif à partir du commit déployé en production" }
    - id: t2
      text: { en: "Copy only the fix commit from release/5.2 to a branch created from main", fr: "Copier uniquement le commit du correctif de release/5.2 vers une branche créée à partir de main" }
    - id: t3
      text: { en: "Undo a faulty commit that is already pushed to release/5.2", fr: "Annuler un commit défectueux déjà envoyé dans release/5.2" }
    - id: t4
      text: { en: "Mark the commit of the hotfix release as version 5.2.1", fr: "Marquer le commit de la version corrective comme version 5.2.1" }
answer:
  mapping: { t1: switch, t2: cherry, t3: revert, t4: tag }
explanation:
  correct:
    en: |
      `git switch -c` creates and checks out a new branch from the given commit. `git cherry-pick` applies selected commits to the current branch without merging the rest of the source branch. `git revert` adds a new commit that undoes a pushed commit, so shared history isn't rewritten. `git tag -a` creates an annotated tag that marks the released commit.
    fr: |
      `git switch -c` crée une nouvelle branche à partir du commit indiqué et bascule dessus. `git cherry-pick` applique les commits sélectionnés à la branche active sans fusionner le reste de la branche source. `git revert` ajoute un nouveau commit qui annule un commit déjà envoyé : l'historique partagé n'est pas réécrit. `git tag -a` crée une balise annotée qui marque le commit publié.
  options:
    reset: { en: "git reset --hard moves the branch pointer and, once pushed with force, rewrites shared history.", fr: "git reset --hard déplace le pointeur de branche et, une fois envoyé avec force, réécrit l'historique partagé." }
    rebase: { en: "git rebase rewrites the commits of a branch, which is forbidden on shared branches here.", fr: "git rebase réécrit les commits d'une branche, ce qui est interdit ici sur les branches partagées." }
references:
  - title: Copy changes with cherry-pick
    url: https://learn.microsoft.com/en-us/azure/devops/repos/git/cherry-pick
  - title: Undo changes
    url: https://learn.microsoft.com/en-us/azure/devops/repos/git/undo
