id: az400-3b-auto-compare-yesno
objective: "3.3.1"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    Northwind hosts its code in GitHub and is choosing between GitHub Actions and Azure Pipelines for CI/CD.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind héberge son code dans GitHub et hésite entre GitHub Actions et Azure Pipelines pour la CI/CD.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: An Azure Pipelines YAML pipeline can build the code stored in Northwind's GitHub repositories.
        fr: Un pipeline YAML Azure Pipelines peut générer le code stocké dans les dépôts GitHub de Northwind.
    - id: s2
      text:
        en: A GitHub Actions workflow file can be stored in any folder of the repository.
        fr: Un fichier de workflow GitHub Actions peut être stocké dans n'importe quel dossier du dépôt.
    - id: s3
      text:
        en: A GitHub Actions job that references an environment can wait until a required reviewer approves it.
        fr: Un job GitHub Actions qui référence un environnement peut attendre l'approbation d'un réviseur obligatoire.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |
      Azure Pipelines builds GitHub repositories, ideally through the Azure Pipelines GitHub App. GitHub Actions only reads workflows stored as YAML files in the .github/workflows directory, whereas an Azure Pipelines YAML file can be anywhere in the repository. A job that references an environment with required reviewers doesn't start until the reviewers approve it.
    fr: |
      Azure Pipelines génère des dépôts GitHub, de préférence par l'application GitHub Azure Pipelines. GitHub Actions ne lit que les workflows stockés sous forme de fichiers YAML dans le répertoire .github/workflows, alors qu'un fichier YAML Azure Pipelines peut se trouver n'importe où dans le dépôt. Un job qui référence un environnement avec des réviseurs obligatoires ne démarre pas avant leur approbation.
references:
  - title: Understand workflows
    url: https://learn.microsoft.com/en-us/training/modules/introduction-to-github-actions/4-understand-workflows
  - title: Remove artifacts, create status badges, and configure environment protections
    url: https://learn.microsoft.com/en-us/training/modules/github-actions-cd/2b-manage-workflow-runs
