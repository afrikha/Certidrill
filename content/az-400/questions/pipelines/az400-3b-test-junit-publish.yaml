id: az400-3b-test-junit-publish
objective: "3.2.3"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Northwind has a Python API built by an Azure Pipelines YAML pipeline. The test step is configured with `continueOnError: true` so that the diagnostic steps that follow it always run.

    You need to complete the pipeline so that:

    - the results of the pytest run appear on the **Tests** tab of each run;
    - the run is marked as failed when at least one test fails.

    How should you complete the YAML? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind dispose d'une API Python générée par un pipeline YAML Azure Pipelines. L'étape de test est configurée avec `continueOnError: true` pour que les étapes de diagnostic qui la suivent s'exécutent toujours.

    Vous devez compléter le pipeline pour que :

    - les résultats de l'exécution de pytest apparaissent dans l'onglet **Tests** de chaque exécution ;
    - l'exécution soit marquée comme ayant échoué quand au moins un test échoue.

    Comment devez-vous compléter le YAML ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: yaml
  template: |
    steps:
      - script: |
          pip install -r requirements.txt
          pytest tests --junitxml=reports/TEST-api.xml
        displayName: Run tests
        continueOnError: true
      - task: [[task]]
        condition: succeededOrFailed()
        inputs:
          testResultsFormat: [[fmt]]
          testResultsFiles: 'reports/TEST-*.xml'
          [[fail]]: true
  slots:
    - id: task
      options:
        - { id: ptr, text: PublishTestResults@2 }
        - { id: pcc, text: PublishCodeCoverageResults@2 }
        - { id: ppa, text: PublishPipelineArtifact@1 }
        - { id: vst, text: VSTest@3 }
    - id: fmt
      options:
        - { id: nunit, text: NUnit }
        - { id: junit, text: JUnit }
        - { id: vstest, text: VSTest }
        - { id: xunit, text: XUnit }
    - id: fail
      options:
        - { id: missing, text: failTaskOnMissingResultsFile }
        - { id: merge, text: mergeTestResults }
        - { id: failed, text: failTaskOnFailedTests }
        - { id: attach, text: publishRunAttachments }
answer:
  values: { task: ptr, fmt: junit, fail: failed }
explanation:
  correct:
    en: |
      `pytest --junitxml` writes a JUnit XML file, which PublishTestResults@2 publishes with `testResultsFormat: JUnit`. Because `continueOnError: true` turns a failed test step into a warning, `failTaskOnFailedTests: true` is what makes the publishing task, and therefore the run, fail when a test failed.
    fr: |
      `pytest --junitxml` écrit un fichier XML JUnit, que PublishTestResults@2 publie avec `testResultsFormat: JUnit`. Comme `continueOnError: true` transforme l'échec de l'étape de test en avertissement, c'est `failTaskOnFailedTests: true` qui fait échouer la tâche de publication, et donc l'exécution, quand un test a échoué.
  options:
    pcc: { en: "PublishCodeCoverageResults@2 publishes coverage reports, not test results.", fr: "PublishCodeCoverageResults@2 publie des rapports de couverture, pas des résultats de test." }
    ppa: { en: "A pipeline artifact keeps the file but doesn't fill the Tests tab.", fr: "Un artefact de pipeline conserve le fichier mais ne remplit pas l'onglet Tests." }
    vst: { en: "VSTest@3 runs .NET test assemblies; it doesn't read pytest results.", fr: "VSTest@3 exécute des assemblys de test .NET ; il ne lit pas les résultats de pytest." }
    vstest: { en: "The VSTest format is TRX, not the JUnit XML that pytest writes.", fr: "Le format VSTest correspond au TRX, pas au XML JUnit écrit par pytest." }
    missing: { en: "This input fails the task only when no result file is found.", fr: "Cette entrée fait échouer la tâche uniquement quand aucun fichier de résultats n'est trouvé." }
    merge: { en: "mergeTestResults groups files into one test run; it doesn't fail the task.", fr: "mergeTestResults regroupe les fichiers dans une série de tests ; il ne fait pas échouer la tâche." }
references:
  - title: PublishTestResults@2 - Publish Test Results v2 task
    url: https://learn.microsoft.com/en-us/azure/devops/pipelines/tasks/reference/publish-test-results-v2
