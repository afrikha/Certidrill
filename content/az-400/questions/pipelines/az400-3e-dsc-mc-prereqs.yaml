id: az400-3e-dsc-mc-prereqs
objective: "3.5.4"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Adatum has 200 Windows Server virtual machines in Azure. You plan to assign a built-in Azure Machine Configuration policy definition that audits the local Administrators group membership on the virtual machines.

    You need to ensure that the virtual machines can report their compliance.

    Which two prerequisites must be in place on each virtual machine? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum dispose de 200 machines virtuelles Windows Server dans Azure. Vous prévoyez d'affecter une définition de stratégie Azure Machine Configuration intégrée qui audite l'appartenance au groupe Administrateurs local des machines virtuelles.

    Vous devez vous assurer que les machines virtuelles peuvent signaler leur conformité.

    Quels sont les deux prérequis qui doivent être en place sur chaque machine virtuelle ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "The Azure Monitor Agent with a data collection rule", fr: "L'agent Azure Monitor (AMA) avec une règle de collecte de données" } }
    - { id: b, text: { en: "The guest configuration (machine configuration) extension", fr: "L'extension de configuration d'invité (machine configuration)" } }
    - { id: c, text: { en: "A system-assigned managed identity", fr: "Une identité managée affectée par le système" } }
    - { id: d, text: { en: "A Hybrid Runbook Worker registered in an Azure Automation account", fr: "Un Runbook Worker hybride inscrit dans un compte Azure Automation" } }
    - { id: e, text: { en: "The Azure Connected Machine agent", fr: "L'agent Azure Connected Machine" } }
answer: { optionIds: [ b, c ] }
explanation:
  correct:
    en: "On Azure VMs, Machine Configuration needs the guest configuration extension and a system-assigned managed identity. The built-in initiative \"Deploy prerequisites to enable Guest Configuration policies on virtual machines\" deploys both at scale."
    fr: "Sur les machines virtuelles Azure, Machine Configuration exige l'extension de configuration d'invité et une identité managée affectée par le système. L'initiative intégrée « Deploy prerequisites to enable Guest Configuration policies on virtual machines » déploie les deux à grande échelle."
  options:
    a:
      en: "The Azure Monitor Agent collects monitoring data; Machine Configuration doesn't use it."
      fr: "L'agent Azure Monitor collecte des données de supervision ; Machine Configuration ne l'utilise pas."
    d:
      en: "A Hybrid Runbook Worker runs Azure Automation runbooks; it isn't involved in Machine Configuration."
      fr: "Un Runbook Worker hybride exécute des runbooks Azure Automation ; il n'intervient pas dans Machine Configuration."
    e:
      en: "The Connected Machine agent is required for Azure Arc-enabled servers, where it replaces the extension, not for Azure VMs."
      fr: "L'agent Connected Machine est requis pour les serveurs avec Azure Arc, où il remplace l'extension, pas pour les machines virtuelles Azure."
references:
  - title: Azure Machine Configuration prerequisites
    url: https://learn.microsoft.com/en-us/azure/governance/machine-configuration/overview/02-setup-prerequisites
