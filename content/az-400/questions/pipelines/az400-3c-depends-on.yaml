id: az400-3c-depends-on
objective: "3.3.6"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Tailspin has a multi-stage YAML pipeline whose stages are defined in this order: **Build**, **Lint**, **DeployUS**, **DeployEU** and **Integration**. You need to meet the following requirements:

    - Lint starts at the same time as Build.
    - DeployUS and DeployEU start when Build succeeds, and run in parallel.
    - Integration starts only after both DeployUS and DeployEU succeed.

    Which `dependsOn` value should you set on each stage? To answer, drag the appropriate values to the correct stages. Each value may be used once, more than once, or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin dispose d'un pipeline YAML à phases multiples dont les phases sont définies dans cet ordre : **Build**, **Lint**, **DeployUS**, **DeployEU** et **Integration**. Vous devez respecter les exigences suivantes :

    - Lint démarre en même temps que Build.
    - DeployUS et DeployEU démarrent quand Build réussit, et s'exécutent en parallèle.
    - Integration ne démarre qu'une fois DeployUS et DeployEU réussies.

    Quelle valeur `dependsOn` devez-vous définir sur chaque phase ? Pour répondre, faites glisser les valeurs appropriées vers les phases correspondantes. Chaque valeur peut être utilisée une fois, plusieurs fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: true
  items:
    - { id: empty, text: "dependsOn: []" }
    - { id: build, text: "dependsOn: Build" }
    - { id: lint, text: "dependsOn: Lint" }
    - { id: us, text: "dependsOn: DeployUS" }
    - { id: both, text: "dependsOn: [DeployUS, DeployEU]" }
  targets:
    - { id: tlint, text: Lint }
    - { id: tus, text: DeployUS }
    - { id: teu, text: DeployEU }
    - { id: tint, text: Integration }
answer:
  mapping: { tlint: empty, tus: build, teu: build, tint: both }
explanation:
  correct:
    en: |
      Without dependsOn, each stage depends on the stage defined just before it. An empty list removes that dependency, so Lint runs in parallel with Build. Two stages that both depend on Build fan out and run in parallel, and a list of two stages makes Integration fan in and wait for both.
    fr: |
      Sans dependsOn, chaque phase dépend de la phase définie juste avant elle. Une liste vide supprime cette dépendance : Lint s'exécute en parallèle avec Build. Deux phases qui dépendent toutes deux de Build se déploient en éventail et s'exécutent en parallèle, et une liste de deux phases fait converger Integration, qui attend les deux.
  options:
    lint: { en: "DeployUS would then wait for Lint instead of Build.", fr: "DeployUS attendrait alors Lint au lieu de Build." }
    us: { en: "DeployEU would wait for DeployUS, so the two deployments would run in sequence.", fr: "DeployEU attendrait DeployUS : les deux déploiements s'exécuteraient en séquence." }
references:
  - title: Add stages, dependencies, and conditions
    url: https://learn.microsoft.com/en-us/azure/devops/pipelines/process/stages
