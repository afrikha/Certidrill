id: az400-3b-trg-schedule-yesno
objective: "3.3.4"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Northwind's YAML pipeline builds an Azure Repos Git repository. The organization's time zone is set to (UTC+01:00) Paris, and azure-pipelines.yml contains the following schedule.

    ```yaml
    schedules:
      - cron: '0 3 * * *'
        displayName: Nightly
        branches:
          include:
            - main
    ```

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Le pipeline YAML de Northwind génère un dépôt Git Azure Repos. Le fuseau horaire de l'organisation est défini sur (UTC+01:00) Paris, et azure-pipelines.yml contient la planification suivante.

    ```yaml
    schedules:
      - cron: '0 3 * * *'
        displayName: Nightly
        branches:
          include:
            - main
    ```

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: The scheduled run starts at 03:00 in the time zone of the organization.
        fr: L'exécution planifiée démarre à 03:00 dans le fuseau horaire de l'organisation.
    - id: s2
      text:
        en: A run started by this schedule sets the `Build.CronSchedule.DisplayName` variable to Nightly.
        fr: Une exécution démarrée par cette planification définit la variable `Build.CronSchedule.DisplayName` sur Nightly.
    - id: s3
      text:
        en: You can replace `main` in the branches filter with a variable such as `$(releaseBranch)`.
        fr: Vous pouvez remplacer `main` dans le filtre branches par une variable comme `$(releaseBranch)`.
answer:
  values: { s1: false, s2: true, s3: false }
explanation:
  correct:
    en: |
      Cron schedules are evaluated in UTC, without any daylight saving adjustment, so this run starts at 03:00 UTC whatever the organization's time zone. When a schedule starts a run, `Build.CronSchedule.DisplayName` contains its displayName, which conditions can test. Pipeline variables can't be used in schedules.
    fr: |
      Les planifications cron sont évaluées en UTC, sans ajustement à l'heure d'été : cette exécution démarre à 03:00 UTC quel que soit le fuseau horaire de l'organisation. Quand une planification démarre une exécution, `Build.CronSchedule.DisplayName` contient son displayName, que des conditions peuvent tester. Les variables de pipeline ne peuvent pas être utilisées dans les planifications.
references:
  - title: Configure schedules for pipelines
    url: https://learn.microsoft.com/en-us/azure/devops/pipelines/process/scheduled-triggers
