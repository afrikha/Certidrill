id: az400-3b-gh-comment-member
objective: "3.3.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Fabrikam builds a public GitHub repository with Azure Pipelines through the GitHub App. Pull requests from forks are built only after a team member comments on them.

    Ines belongs to the Fabrikam GitHub organization through a team that has the Write role on the repository, and her organization membership is private. When Ines comments `/azp run` on a pull request from a fork, no build starts. Comments from other maintainers start builds as expected.

    What should you do?
  fr: |
    Fabrikam génère un dépôt GitHub public avec Azure Pipelines par l'application GitHub. Les pull requests issues de duplications ne sont générées qu'après le commentaire d'un membre de l'équipe.

    Ines appartient à l'organisation GitHub de Fabrikam par une équipe qui a le rôle Write sur le dépôt, et son appartenance à l'organisation est privée. Quand Ines commente `/azp run` sur une pull request issue d'une duplication, aucune build ne démarre. Les commentaires des autres mainteneurs démarrent les builds comme prévu.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Make Ines's membership of the Fabrikam organization public.", fr: "Rendre publique l'appartenance d'Ines à l'organisation Fabrikam." } }
    - { id: b, text: { en: "Ask Ines to comment `/AzurePipelines run` instead of `/azp run`.", fr: "Demander à Ines de commenter `/AzurePipelines run` au lieu de `/azp run`." } }
    - { id: c, text: { en: "Enable **Make secrets available to builds of forks** in the pipeline settings.", fr: "Activer **Make secrets available to builds of forks** dans les paramètres du pipeline." } }
    - { id: d, text: { en: "Add Ines to the Contributors group of the Azure DevOps project.", fr: "Ajouter Ines au groupe Contributors du projet Azure DevOps." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Only repository owners and collaborators with Write permission can trigger builds by commenting. When comments from a member don't trigger builds, Learn's fix is to make the organization membership public or to add the user directly as a repository collaborator.
    fr: |
      Seuls les propriétaires du dépôt et les collaborateurs disposant de l'autorisation Write peuvent déclencher des builds par un commentaire. Quand les commentaires d'un membre ne déclenchent pas de build, Learn recommande de rendre publique l'appartenance à l'organisation ou d'ajouter directement l'utilisateur comme collaborateur du dépôt.
  options:
    b: { en: "`/azp` is a supported shorthand of `/AzurePipelines`; both commands behave the same way.", fr: "`/azp` est un raccourci pris en charge de `/AzurePipelines` ; les deux commandes se comportent de la même façon." }
    c: { en: "This setting controls access to secrets; it doesn't decide who can trigger a build.", fr: "Ce paramètre contrôle l'accès aux secrets ; il ne détermine pas qui peut déclencher une build." }
    d: { en: "Comment triggers are evaluated against GitHub permissions, not Azure DevOps groups.", fr: "Les déclencheurs par commentaire sont évalués selon les autorisations GitHub, pas selon les groupes Azure DevOps." }
references:
  - title: Build GitHub repositories
    url: https://learn.microsoft.com/en-us/azure/devops/pipelines/repos/github
