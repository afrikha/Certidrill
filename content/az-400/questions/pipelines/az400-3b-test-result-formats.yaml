id: az400-3b-test-result-formats
objective: "3.2.3"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Proseware's pipelines run tests with several frameworks and publish every results file with the PublishTestResults@2 task.

    Which `testResultsFormat` value should you use for each results file? To answer, drag the appropriate values to the correct files. Each value may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Les pipelines de Proseware exécutent des tests avec plusieurs frameworks et publient chaque fichier de résultats avec la tâche PublishTestResults@2.

    Quelle valeur de `testResultsFormat` devez-vous utiliser pour chaque fichier de résultats ? Pour répondre, faites glisser les valeurs appropriées vers les fichiers correspondants. Chaque valeur peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: junit, text: JUnit }
    - { id: nunit, text: NUnit }
    - { id: vstest, text: VSTest }
    - { id: xunit, text: XUnit }
    - { id: ctest, text: CTest }
  targets:
    - id: gradle
      text: { en: "The XML reports written by the Gradle test task in build/test-results/test", fr: "Les rapports XML écrits par la tâche de test Gradle dans build/test-results/test" }
    - id: trx
      text: { en: "A .trx file written by `dotnet test --logger trx`", fr: "Un fichier .trx écrit par `dotnet test --logger trx`" }
    - id: xunitxml
      text: { en: "An XML file written by the xUnit.net v2 console runner with the `-xml` option", fr: "Un fichier XML écrit par l'exécuteur console xUnit.net v2 avec l'option `-xml`" }
    - id: nunitxml
      text: { en: "A TestResult.xml file written by the NUnit 3 console runner", fr: "Un fichier TestResult.xml écrit par l'exécuteur console NUnit 3" }
answer:
  mapping: { gradle: junit, trx: vstest, xunitxml: xunit, nunitxml: nunit }
explanation:
  correct:
    en: |
      PublishTestResults@2 supports JUnit, NUnit 2 and 3, VSTest (the TRX format), xUnit 2 and CTest. Gradle, like Maven Surefire, writes JUnit XML reports. A .trx file uses the VSTest value, the xUnit.net v2 XML report uses XUnit, and the NUnit 3 TestResult.xml uses NUnit. CTest is for CMake test results and isn't needed here.
    fr: |
      PublishTestResults@2 prend en charge JUnit, NUnit 2 et 3, VSTest (le format TRX), xUnit 2 et CTest. Gradle, comme Maven Surefire, écrit des rapports XML JUnit. Un fichier .trx utilise la valeur VSTest, le rapport XML de xUnit.net v2 utilise XUnit et le fichier TestResult.xml de NUnit 3 utilise NUnit. CTest concerne les résultats de test CMake et n'est pas utile ici.
references:
  - title: PublishTestResults@2 - Publish Test Results v2 task
    url: https://learn.microsoft.com/en-us/azure/devops/pipelines/tasks/reference/publish-test-results-v2
