id: az400-3b-agent-ephemeral-runner
objective: "3.3.2"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Adatum autoscales self-hosted GitHub Actions runners on Linux virtual machines that have GPUs. The organization also has other self-hosted Linux runners without GPUs.

    You need to meet the following requirements:

    - Each GPU runner processes a single job and is then removed from the organization, so that no state is shared between jobs.
    - Jobs that need a GPU run only on the GPU runners.

    How should you complete the registration command and the workflow? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum met à l'échelle automatiquement des exécuteurs GitHub Actions auto-hébergés sur des machines virtuelles Linux équipées de GPU. L'organisation dispose aussi d'autres exécuteurs Linux auto-hébergés sans GPU.

    Vous devez satisfaire les exigences suivantes :

    - Chaque exécuteur GPU traite un seul job, puis il est supprimé de l'organisation, pour qu'aucun état ne soit partagé entre les jobs.
    - Les jobs qui ont besoin d'un GPU s'exécutent uniquement sur les exécuteurs GPU.

    Comment devez-vous compléter la commande d'inscription et le workflow ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: yaml
  template: |
    # Runner registration, run by the autoscaling script
    ./config.sh --url https://github.com/adatum --token "$REG_TOKEN" --labels gpu [[flag]]

    # Workflow job
    jobs:
      train:
        runs-on: [[runson]]
        steps:
          - uses: actions/checkout@v4
          - run: ./train.sh
  slots:
    - id: flag
      options:
        - { id: replace, text: "--replace" }
        - { id: unattended, text: "--unattended" }
        - { id: ephemeral, text: "--ephemeral" }
        - { id: service, text: "--runasservice" }
    - id: runson
      options:
        - { id: selfonly, text: self-hosted }
        - { id: labels, text: "[self-hosted, linux, gpu]" }
        - { id: hosted, text: ubuntu-latest }
        - { id: hostedgpu, text: "[ubuntu-latest, gpu]" }
answer:
  values: { flag: ephemeral, runson: labels }
explanation:
  correct:
    en: |
      A runner registered with `--ephemeral` is de-registered by GitHub after it processes one job, which is the recommended pattern for autoscaled runners. A job runs on a runner that has all the labels listed in `runs-on`, so `[self-hosted, linux, gpu]` selects only the self-hosted Linux runners that carry the custom gpu label.
    fr: |
      Un exécuteur inscrit avec `--ephemeral` est désinscrit par GitHub après avoir traité un job, ce qui est le modèle recommandé pour les exécuteurs mis à l'échelle automatiquement. Un job s'exécute sur un exécuteur qui possède toutes les étiquettes indiquées dans `runs-on` : `[self-hosted, linux, gpu]` ne sélectionne que les exécuteurs Linux auto-hébergés qui portent l'étiquette personnalisée gpu.
  options:
    replace: { en: "--replace reuses the name of an existing runner; the runner still accepts several jobs.", fr: "--replace réutilise le nom d'un exécuteur existant ; l'exécuteur accepte toujours plusieurs jobs." }
    unattended: { en: "--unattended skips the prompts but keeps the runner registered after its jobs.", fr: "--unattended évite les invites mais laisse l'exécuteur inscrit après ses jobs." }
    service: { en: "--runasservice is a Windows option that installs the runner as a service.", fr: "--runasservice est une option Windows qui installe l'exécuteur comme service." }
    selfonly: { en: "self-hosted alone also matches the runners without GPUs.", fr: "self-hosted seul correspond aussi aux exécuteurs sans GPU." }
    hosted: { en: "ubuntu-latest selects a GitHub-hosted runner.", fr: "ubuntu-latest sélectionne un exécuteur hébergé par GitHub." }
    hostedgpu: { en: "No runner has both the ubuntu-latest and gpu labels.", fr: "Aucun exécuteur ne possède à la fois les étiquettes ubuntu-latest et gpu." }
references:
  - title: Explore runners
    url: https://learn.microsoft.com/en-us/training/modules/introduction-to-github-actions/8-explore-runners
