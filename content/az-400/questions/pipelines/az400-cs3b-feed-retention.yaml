id: az400-cs3b-feed-retention
objective: "3.6.4"
type: single
caseStudy: az400-cs3b-proseware-games
difficulty: 1
status: draft
stem:
  en: |
    The storage used by EngineTools keeps growing. You need to meet requirement 9. The validated versions are promoted to the @Release view. What should you do?
  fr: |
    Le stockage utilisé par EngineTools ne cesse de croître. Vous devez satisfaire l'exigence 9. Les versions validées sont promues vers la vue @Release. Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Enable package retention on EngineTools with 25 maximum versions per package and 30 days to keep recently downloaded packages", fr: "Activer la rétention des packages sur EngineTools avec 25 versions maximum par package et 30 jours de conservation des packages récemment téléchargés" } }
    - { id: b, text: { en: "Set the retention policy for runs and artifacts in the Skyforge project settings to 30 days and 25 runs", fr: "Définir la stratégie de rétention des exécutions et des artefacts dans les paramètres du projet Skyforge sur 30 jours et 25 exécutions" } }
    - { id: c, text: { en: "Add a scheduled pipeline that deletes the package versions older than 30 days and then empties the feed Recycle Bin", fr: "Ajouter un pipeline planifié qui supprime les versions de packages de plus de 30 jours, puis vide la Corbeille du flux" } }
    - { id: d, text: { en: "Create a lifecycle management rule that deletes the package blobs older than 30 days in the storage account of EngineTools", fr: "Créer une règle de gestion du cycle de vie qui supprime les objets blob de packages de plus de 30 jours dans le compte de stockage d'EngineTools" } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      A feed retention policy deletes a package version only when the package has reached the maximum number of versions and that version has not been downloaded during the configured number of days. Versions promoted to a view are never deleted by retention, so the validated versions in @Release are protected without extra work.
    fr: |
      Une stratégie de rétention de flux supprime une version de package seulement quand le package a atteint le nombre maximal de versions et que cette version n'a pas été téléchargée pendant le nombre de jours configuré. Les versions promues vers une vue ne sont jamais supprimées par la rétention : les versions validées de @Release sont donc protégées sans travail supplémentaire.
  options:
    b:
      en: |
        Pipeline retention settings control runs and pipeline artifacts, not the packages stored in an Azure Artifacts feed.
      fr: |
        Les paramètres de rétention des pipelines contrôlent les exécutions et les artefacts de pipeline, pas les packages stockés dans un flux Azure Artifacts.
    c:
      en: |
        A custom deletion script adds maintenance, ignores the 25-version and recent-download rules, and could delete validated versions.
      fr: |
        Un script de suppression personnalisé ajoute de la maintenance, ignore les règles des 25 versions et des téléchargements récents, et pourrait supprimer des versions validées.
    d:
      en: |
        Azure Artifacts stores packages in storage that Microsoft manages, not in a storage account of Proseware, so lifecycle management rules cannot apply to a feed.
      fr: |
        Azure Artifacts stocke les packages dans un stockage géré par Microsoft, pas dans un compte de stockage de Proseware : les règles de gestion du cycle de vie ne peuvent pas s'appliquer à un flux.
references:
  - title: Delete and recover packages
    url: https://learn.microsoft.com/en-us/azure/devops/artifacts/how-to/delete-and-recover-packages
