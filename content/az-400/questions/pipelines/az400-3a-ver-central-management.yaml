id: az400-3a-ver-central-management
objective: "3.1.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Fabrikam has a repository that contains 60 .NET projects. The projects often reference different versions of the same NuGet package, which causes runtime conflicts.

    You need to ensure that the version of each package is defined once for the whole repository and that the project files reference packages without a version.

    What should you use?
  fr: |
    Fabrikam dispose d'un dépôt qui contient 60 projets .NET. Les projets référencent souvent des versions différentes du même package NuGet, ce qui provoque des conflits à l'exécution.

    Vous devez faire en sorte que la version de chaque package soit définie une seule fois pour tout le dépôt et que les fichiers projet référencent les packages sans version.

    Que devez-vous utiliser ?
body:
  options:
    - { id: a, text: { en: "A packages.lock.json file in each project", fr: "Un fichier packages.lock.json dans chaque projet" } }
    - { id: b, text: { en: "Floating versions such as * in every PackageReference element", fr: "Des versions flottantes comme * dans chaque élément PackageReference" } }
    - { id: c, text: { en: "A Directory.Packages.props file with central package management enabled", fr: "Un fichier Directory.Packages.props avec la gestion centralisée des packages activée" } }
    - { id: d, text: { en: "A nuget.config file with package source mapping at the repository root", fr: "Un fichier nuget.config avec un mappage des sources de packages à la racine du dépôt" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Central Package Management uses a Directory.Packages.props file at the repository root with ManagePackageVersionsCentrally set to true. The file declares PackageVersion items, and the projects keep PackageReference elements without a Version attribute.
    fr: |
      La gestion centralisée des packages utilise un fichier Directory.Packages.props à la racine du dépôt, avec ManagePackageVersionsCentrally défini sur true. Le fichier déclare des éléments PackageVersion, et les projets conservent des éléments PackageReference sans attribut Version.
  options:
    a: { en: "A lock file records the resolved graph of one project; versions are still declared in each project file.", fr: "Un fichier de verrouillage enregistre le graphe résolu d'un projet ; les versions restent déclarées dans chaque fichier projet." }
    b: { en: "Floating versions are still written in each project and can resolve differently over time.", fr: "Les versions flottantes restent écrites dans chaque projet et peuvent se résoudre différemment au fil du temps." }
    d: { en: "Package source mapping decides which feed provides a package, not which version is used.", fr: "Le mappage des sources de packages détermine quel flux fournit un package, pas quelle version est utilisée." }
references:
  - title: Central Package Management
    url: https://learn.microsoft.com/en-us/nuget/consume-packages/central-package-management
