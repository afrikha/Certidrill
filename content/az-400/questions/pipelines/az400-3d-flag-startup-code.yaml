id: az400-3d-flag-startup-code
objective: "3.4.6"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Contoso is adding feature flags to an ASP.NET Core web app. The flags are managed in Azure App Configuration Feature manager. The app already references the Microsoft.Azure.AppConfiguration.AspNetCore and Microsoft.FeatureManagement.AspNetCore packages.

    The app must load the feature flags from the store, register the feature management services, and show the new dashboard only when the **NewDashboard** flag is enabled.

    How should you complete the code? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso ajoute des indicateurs de fonctionnalités à une application web ASP.NET Core. Les indicateurs sont gérés dans le Gestionnaire de fonctionnalités d'Azure App Configuration. L'application référence déjà les packages Microsoft.Azure.AppConfiguration.AspNetCore et Microsoft.FeatureManagement.AspNetCore.

    L'application doit charger les indicateurs de fonctionnalités depuis le magasin, enregistrer les services de gestion des fonctionnalités et afficher le nouveau tableau de bord uniquement quand l'indicateur **NewDashboard** est activé.

    Comment devez-vous compléter le code ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: text
  template: |
    // Program.cs
    builder.Configuration.AddAzureAppConfiguration(options =>
    {
        options.Connect(new Uri(endpoint), new DefaultAzureCredential());
        options.[[load]]();
    });
    builder.Services.AddAzureAppConfiguration();
    builder.Services.[[register]]();

    // DashboardController.cs
    if (await _featureManager.[[check]]("NewDashboard"))
    {
        return View("NewDashboard");
    }
  slots:
    - id: load
      options:
        - { id: lFlags, text: UseFeatureFlags }
        - { id: lKeyVault, text: ConfigureKeyVault }
        - { id: lRefresh, text: ConfigureRefresh }
    - id: register
      options:
        - { id: rHttp, text: AddHttpContextAccessor }
        - { id: rFeature, text: AddFeatureManagement }
        - { id: rConfig, text: AddAzureAppConfiguration }
    - id: check
      options:
        - { id: cNames, text: GetFeatureNamesAsync }
        - { id: cVariant, text: GetVariantAsync }
        - { id: cEnabled, text: IsEnabledAsync }
answer:
  values: { load: lFlags, register: rFeature, check: cEnabled }
explanation:
  correct:
    en: |
      `UseFeatureFlags()` tells the App Configuration provider to load the feature flags, which are refreshed every 30 seconds by default. `AddFeatureManagement()` registers the feature manager and the built-in filters. `IsEnabledAsync` evaluates the flag, including its filters, and returns true or false.
    fr: |
      `UseFeatureFlags()` indique au fournisseur App Configuration de charger les indicateurs de fonctionnalités, actualisés toutes les 30 secondes par défaut. `AddFeatureManagement()` enregistre le gestionnaire de fonctionnalités et les filtres intégrés. `IsEnabledAsync` évalue l'indicateur, y compris ses filtres, et renvoie true ou false.
  options:
    lKeyVault: { en: "ConfigureKeyVault resolves Key Vault references; it doesn't load feature flags.", fr: "ConfigureKeyVault résout les références Key Vault ; il ne charge pas les indicateurs de fonctionnalités." }
    lRefresh: { en: "ConfigureRefresh sets which key-values trigger a configuration reload; feature flags still aren't loaded.", fr: "ConfigureRefresh définit les paires clé-valeur qui déclenchent un rechargement de la configuration ; les indicateurs ne sont toujours pas chargés." }
    rHttp: { en: "AddHttpContextAccessor only helps a custom targeting context accessor; it doesn't register feature management.", fr: "AddHttpContextAccessor ne sert qu'à un accesseur de contexte de ciblage personnalisé ; il n'enregistre pas la gestion des fonctionnalités." }
    rConfig: { en: "AddAzureAppConfiguration is already registered on the previous line and doesn't provide a feature manager.", fr: "AddAzureAppConfiguration est déjà enregistré à la ligne précédente et ne fournit pas de gestionnaire de fonctionnalités." }
    cNames: { en: "GetFeatureNamesAsync lists the flags without evaluating one.", fr: "GetFeatureNamesAsync liste les indicateurs sans en évaluer un." }
    cVariant: { en: "GetVariantAsync returns the assigned variant of a variant flag, not a Boolean.", fr: "GetVariantAsync renvoie la variante attribuée d'un indicateur à variantes, pas un booléen." }
references:
  - title: "Quickstart: Add feature flags to an ASP.NET Core app"
    url: https://learn.microsoft.com/en-us/azure/azure-app-configuration/quickstart-feature-flag-aspnet-core
  - title: .NET feature management
    url: https://learn.microsoft.com/en-us/azure/azure-app-configuration/feature-management-dotnet-reference
