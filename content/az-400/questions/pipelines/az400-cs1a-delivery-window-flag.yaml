id: az400-cs1a-delivery-window-flag
objective: "3.4.7"
type: single
caseStudy: az400-cs1a-consolidated-messenger
difficulty: 2
status: draft
stem:
  en: |
    routing-api loads its configuration from appcs-cm-prod by using the App Configuration provider and the .NET feature management library.

    You need to meet the requirement for the delivery-window feature. What should you do?
  fr: |
    routing-api charge sa configuration depuis appcs-cm-prod au moyen du fournisseur App Configuration et de la bibliothèque de gestion des fonctionnalités .NET.

    Vous devez satisfaire l'exigence concernant la fonctionnalité delivery-window. Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Create a feature flag in appcs-cm-prod with a time window filter that starts the rollout today", fr: "Créer un indicateur de fonctionnalité dans appcs-cm-prod avec un filtre de fenêtre de temps qui démarre le déploiement aujourd'hui" } }
    - { id: b, text: { en: "Add an environment variable that holds the rollout percentage to the ca-routing container app", fr: "Ajouter à l'application conteneur ca-routing une variable d'environnement qui contient le pourcentage de déploiement" } }
    - { id: c, text: { en: "Create a feature flag in appcs-cm-prod with a targeting filter whose default percentage is 20", fr: "Créer un indicateur de fonctionnalité dans appcs-cm-prod avec un filtre de ciblage dont le pourcentage par défaut est 20" } }
    - { id: d, text: { en: "Switch ca-routing to multiple revision mode and send 20 percent of the traffic to a revision that has the feature enabled", fr: "Passer ca-routing en mode de révision multiple et envoyer 20 % du trafic vers une révision dont la fonctionnalité est activée" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      The targeting filter enables a feature flag for listed users and groups and for a default percentage of the other users, and a given user always gets the same result. The application refreshes feature flags from App Configuration at runtime (every 30 seconds by default), so the product owner can change the percentage or disable the flag without redeploying or restarting routing-api.
    fr: |
      Le filtre de ciblage active un indicateur de fonctionnalité pour des utilisateurs et des groupes listés et pour un pourcentage par défaut des autres utilisateurs, et un même utilisateur obtient toujours le même résultat. L'application actualise les indicateurs depuis App Configuration pendant l'exécution (toutes les 30 secondes par défaut) : le propriétaire du produit peut changer le pourcentage ou désactiver l'indicateur sans redéployer ni redémarrer routing-api.
  options:
    a: { en: "A time window filter turns a feature on during a period of time for everyone; it does not expose the feature to a percentage of customers.", fr: "Un filtre de fenêtre de temps active une fonctionnalité pendant une période pour tout le monde ; il n'expose pas la fonctionnalité à un pourcentage de clients." }
    b: { en: "Changing an environment variable of a container app creates a new revision, which is a redeployment, and the code would still have to split the customers itself.", fr: "Modifier une variable d'environnement d'une application conteneur crée une nouvelle révision, donc un redéploiement, et le code devrait encore répartir lui-même les clients." }
    d: { en: "Traffic splitting distributes requests, not customers, so the same customer could switch between the two experiences, and turning the feature off would still depend on a revision built with it disabled.", fr: "Le fractionnement du trafic répartit des requêtes, pas des clients : un même client pourrait passer d'une expérience à l'autre, et la désactivation de la fonctionnalité dépendrait encore d'une révision générée sans elle." }
references:
  - title: Roll out features to targeted audiences
    url: https://learn.microsoft.com/en-us/azure/azure-app-configuration/howto-targetingfilter
  - title: "Quickstart: Add feature flags to an ASP.NET Core app"
    url: https://learn.microsoft.com/en-us/azure/azure-app-configuration/quickstart-feature-flag-aspnet-core
