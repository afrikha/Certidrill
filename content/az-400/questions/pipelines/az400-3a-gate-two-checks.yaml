id: az400-3a-gate-two-checks
objective: "3.2.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Litware deploys a web application to an Azure Pipelines environment named **web-prod**. Azure Monitor alert rules watch the failure rate and the response time of the application.

    You need to configure web-prod to meet the following requirements:

    - Only runs of pipelines built from main or from a release/* branch can deploy.
    - A deployment starts only if no alert rule of the application is active.

    Which two checks should you add to web-prod? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware déploie une application web vers un environnement Azure Pipelines nommé **web-prod**. Des règles d'alerte Azure Monitor surveillent le taux d'échec et le temps de réponse de l'application.

    Vous devez configurer web-prod pour répondre aux exigences suivantes :

    - Seules les exécutions de pipelines générées depuis main ou depuis une branche release/* peuvent déployer.
    - Un déploiement ne démarre que si aucune règle d'alerte de l'application n'est active.

    Quelles sont les deux vérifications à ajouter à web-prod ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: Branch control }
    - { id: b, text: Required template }
    - { id: c, text: Query Azure Monitor alerts }
    - { id: d, text: Evaluate artifact }
    - { id: e, text: Business hours }
    - { id: f, text: Exclusive lock }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |
      Branch control validates that the resources of the run come from allowed branches, written fully qualified (refs/heads/main, refs/heads/release/*), and can also require branch protection. Query Azure Monitor alerts succeeds only if no alert rule is activated when it is evaluated, and it is reevaluated at the configured interval until the timeout.
    fr: |
      Branch control vérifie que les ressources de l'exécution proviennent de branches autorisées, écrites sous forme complète (refs/heads/main, refs/heads/release/*), et peut aussi exiger une protection de branche. Query Azure Monitor alerts ne réussit que si aucune règle d'alerte n'est activée au moment de l'évaluation, et elle est réévaluée à l'intervalle configuré jusqu'au délai d'expiration.
  options:
    b: { en: "Required template forces the pipeline to extend an approved template; it does not filter branches.", fr: "Required template oblige le pipeline à étendre un modèle approuvé ; elle ne filtre pas les branches." }
    d: { en: "Evaluate artifact checks container image artifacts against a custom policy, not alerts.", fr: "Evaluate artifact contrôle les artefacts d'images conteneur au regard d'une stratégie personnalisée, pas les alertes." }
    e: { en: "Business hours restricts the time window, not the branch or the application health.", fr: "Business hours restreint la plage horaire, pas la branche ni l'intégrité de l'application." }
    f: { en: "Exclusive lock serializes runs on the resource.", fr: "Exclusive lock sérialise les exécutions sur la ressource." }
references:
  - title: Define approvals and checks
    url: https://learn.microsoft.com/en-us/azure/devops/pipelines/process/approvals
