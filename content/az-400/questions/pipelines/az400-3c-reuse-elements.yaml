id: az400-3c-reuse-elements
objective: "3.3.8"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Proseware uses Azure Pipelines YAML pipelines and GitHub Actions workflows. You need to choose a reusable element for each requirement.

    Which element should you use for each requirement? To answer, drag the appropriate elements to the correct requirements. Each element may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware utilise des pipelines YAML Azure Pipelines et des workflows GitHub Actions. Vous devez choisir un élément réutilisable pour chaque exigence.

    Quel élément devez-vous utiliser pour chaque exigence ? Pour répondre, faites glisser les éléments appropriés vers les exigences correspondantes. Chaque élément peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: steptpl, text: { en: "Step template", fr: "Modèle d'étapes" } }
    - { id: vartpl, text: { en: "Variable template", fr: "Modèle de variables" } }
    - { id: taskgroup, text: { en: "Task group", fr: "Groupe de tâches" } }
    - { id: vargroup, text: { en: "Variable group", fr: "Groupe de variables" } }
    - { id: reusable, text: { en: "Reusable workflow", fr: "Workflow réutilisable" } }
    - { id: composite, text: { en: "Composite action", fr: "Action composite" } }
  targets:
    - { id: t1, text: { en: "Azure Pipelines: share non-secret build settings that are versioned with the code in Git", fr: "Azure Pipelines : partager des paramètres de build non secrets versionnés avec le code dans Git" } }
    - { id: t2, text: { en: "Azure Pipelines: share secrets stored outside the repositories and protected by pipeline permissions and approvals", fr: "Azure Pipelines : partager des secrets stockés hors des dépôts et protégés par des autorisations de pipeline et des approbations" } }
    - { id: t3, text: { en: "GitHub Actions: share a complete deployment process made of several jobs across repositories", fr: "GitHub Actions : partager un processus de déploiement complet composé de plusieurs jobs entre des dépôts" } }
    - { id: t4, text: { en: "GitHub Actions: package several steps that a job runs as a single step", fr: "GitHub Actions : regrouper plusieurs étapes qu'un job exécute comme une seule étape" } }
answer:
  mapping: { t1: vartpl, t2: vargroup, t3: reusable, t4: composite }
explanation:
  correct:
    en: |
      A variable template is a YAML file in a repository, so it is versioned with Git, but it must not hold secrets. A variable group lives in the Library, can hold secrets or link to Azure Key Vault, and is protected by pipeline permissions and checks. A reusable workflow (`on: workflow_call`) is called from a job and can contain several jobs, while a composite action bundles steps that run as one step.
    fr: |
      Un modèle de variables est un fichier YAML d'un dépôt, donc versionné avec Git, mais il ne doit pas contenir de secrets. Un groupe de variables réside dans la Bibliothèque, peut contenir des secrets ou être lié à Azure Key Vault, et est protégé par des autorisations de pipeline et des vérifications. Un workflow réutilisable (`on: workflow_call`) est appelé depuis un job et peut contenir plusieurs jobs, alors qu'une action composite regroupe des étapes qui s'exécutent comme une seule.
  options:
    steptpl: { en: "A step template shares steps, not settings or secrets, and doesn't apply to GitHub Actions.", fr: "Un modèle d'étapes partage des étapes, pas des paramètres ni des secrets, et ne s'applique pas à GitHub Actions." }
    taskgroup: { en: "Task groups exist only in classic pipelines.", fr: "Les groupes de tâches n'existent que dans les pipelines classiques." }
references:
  - title: Use YAML templates in pipelines for reusable and secure processes
    url: https://learn.microsoft.com/en-us/azure/devops/pipelines/process/templates
  - title: Manage variable groups
    url: https://learn.microsoft.com/en-us/azure/devops/pipelines/library/variable-groups
