id: az400-3e-cfg-multicloud
objective: "3.5.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso hosts its storefront in Azure and its analytics platform in Amazon Web Services (AWS). The platform team wants to describe the networks, databases and compute resources of both clouds as code, with one language and one workflow, and to review an execution plan before each change is applied.

    Which technology should you recommend?
  fr: |
    Contoso héberge sa boutique en ligne dans Azure et sa plateforme d'analyse dans Amazon Web Services (AWS). L'équipe plateforme veut décrire sous forme de code les réseaux, les bases de données et les ressources de calcul des deux clouds, avec un seul langage et un seul flux de travail, et examiner un plan d'exécution avant d'appliquer chaque modification.

    Quelle technologie devez-vous recommander ?
body:
  options:
    - { id: a, text: Bicep }
    - { id: b, text: { en: "Azure Resource Manager templates (JSON)", fr: "Modèles Azure Resource Manager (JSON)" } }
    - { id: c, text: Terraform }
    - { id: d, text: Azure Machine Configuration }
answer: { optionId: c }
explanation:
  correct:
    en: "Terraform uses providers to manage resources in Azure and in other clouds with the same HCL language, and its CLI creates an execution plan that you review before applying it. It's the tool Microsoft recommends for multicloud scenarios."
    fr: "Terraform utilise des fournisseurs (providers) pour gérer des ressources dans Azure et dans d'autres clouds avec le même langage HCL, et son interface CLI crée un plan d'exécution que vous examinez avant de l'appliquer. C'est l'outil que Microsoft recommande pour les scénarios multiclouds."
  options:
    a:
      en: "Bicep is Azure-specific and isn't designed to deploy resources to other clouds."
      fr: "Bicep est propre à Azure et n'est pas conçu pour déployer des ressources dans d'autres clouds."
    b:
      en: "ARM templates deploy only Azure resources through Azure Resource Manager."
      fr: "Les modèles ARM ne déploient que des ressources Azure, via Azure Resource Manager."
    d:
      en: "Machine Configuration audits or configures settings inside operating systems; it doesn't create cloud resources."
      fr: "Machine Configuration audite ou configure des paramètres à l'intérieur des systèmes d'exploitation ; il ne crée pas de ressources cloud."
references:
  - title: Comparing Terraform and Bicep
    url: https://learn.microsoft.com/en-us/azure/developer/terraform/comparing-terraform-and-bicep
