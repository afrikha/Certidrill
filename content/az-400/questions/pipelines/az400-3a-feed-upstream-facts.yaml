id: az400-3a-feed-upstream-facts
objective: "3.1.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Northwind has an Azure Artifacts feed named **nw-packages**. The feed contains npm packages published by Northwind teams and has npmjs.com as its only upstream source. The build pipelines install all their packages through nw-packages.

    Which two statements are true?

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind dispose d'un flux Azure Artifacts nommé **nw-packages**. Le flux contient des packages npm publiés par les équipes de Northwind et a npmjs.com comme seule source en amont. Les pipelines de build installent tous leurs packages via nw-packages.

    Quelles sont les deux affirmations vraies ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "If the npmjs.com upstream source is removed, the npmjs.com packages that the builds already installed remain available in nw-packages.", fr: "Si la source en amont npmjs.com est supprimée, les packages npmjs.com déjà installés par les builds restent disponibles dans nw-packages." } }
    - { id: b, text: { en: "When a version exists both as a package published to nw-packages and on npmjs.com, the feed checks npmjs.com first.", fr: "Quand une version existe à la fois comme package publié dans nw-packages et sur npmjs.com, le flux interroge d'abord npmjs.com." } }
    - { id: c, text: { en: "A version that a Northwind team published to nw-packages takes precedence over the upstream source when a client requests it.", fr: "Une version publiée dans nw-packages par une équipe de Northwind est prioritaire sur la source en amont quand un client la demande." } }
    - { id: d, text: { en: "A user who has only the Feed Reader role saves a new npmjs.com package into nw-packages when installing it.", fr: "Un utilisateur qui n'a que le rôle Feed Reader enregistre un nouveau package npmjs.com dans nw-packages en l'installant." } }
    - { id: e, text: { en: "A Feed Owner can demote a package version from the @Release view back to @Prerelease.", fr: "Un Feed Owner peut rétrograder une version de package de la vue @Release vers @Prerelease." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |
      Package versions saved from an upstream source are immutable copies that stay in the feed even if the upstream is disabled or removed. The feed searches packages published to it first, then packages saved from upstreams, then the upstream sources in their configured order.
    fr: |
      Les versions de packages enregistrées depuis une source en amont sont des copies immuables qui restent dans le flux même si la source en amont est désactivée ou supprimée. Le flux recherche d'abord les packages qui y sont publiés, puis les packages enregistrés depuis les sources en amont, puis les sources en amont dans l'ordre configuré.
  options:
    b: { en: "Upstream sources are searched last, after the published and the saved packages.", fr: "Les sources en amont sont interrogées en dernier, après les packages publiés et enregistrés." }
    d: { en: "Saving from an upstream requires Feed and Upstream Reader (Collaborator) or higher; a Feed Reader can only download packages already saved.", fr: "L'enregistrement depuis une source en amont nécessite Feed and Upstream Reader (Collaborator) ou plus ; un Feed Reader ne peut télécharger que les packages déjà enregistrés." }
    e: { en: "Azure Artifacts does not support demotion: a promoted version cannot be reverted to a previous view.", fr: "Azure Artifacts ne prend pas en charge la rétrogradation : une version promue ne peut pas revenir à une vue précédente." }
references:
  - title: What are upstream sources?
    url: https://learn.microsoft.com/en-us/azure/devops/artifacts/concepts/upstream-sources
  - title: Promote packages and manage feed views
    url: https://learn.microsoft.com/en-us/azure/devops/artifacts/feeds/views
