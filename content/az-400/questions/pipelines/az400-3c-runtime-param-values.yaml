id: az400-3c-runtime-param-values
objective: "3.3.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Release managers at Tailspin queue a YAML pipeline manually from the **Run pipeline** panel. When they queue a run, they must choose the target region among westeurope, northeurope and swedencentral, and must not be able to enter any other value. The chosen region decides which deployment stage is included in the run.

    What should you add to the pipeline?
  fr: |
    Les responsables des mises en production de Tailspin mettent en file d'attente un pipeline YAML manuellement depuis le panneau **Run pipeline**. Lorsqu'ils lancent une exécution, ils doivent choisir la région cible parmi westeurope, northeurope et swedencentral, sans pouvoir saisir une autre valeur. La région choisie détermine la phase de déploiement incluse dans l'exécution.

    Que devez-vous ajouter au pipeline ?
body:
  options:
    - { id: a, text: { en: "A pipeline variable defined in the UI with Let users override this value when running this pipeline", fr: "Une variable de pipeline définie dans l'interface avec l'option Let users override this value when running this pipeline" } }
    - { id: b, text: { en: "A runtime parameter of type string with a values list", fr: "Un paramètre d'exécution de type string avec une liste values" } }
    - { id: c, text: { en: "A variable in the variables block of the YAML file", fr: "Une variable dans le bloc variables du fichier YAML" } }
    - { id: d, text: { en: "A variable template that defines one variable per region", fr: "Un modèle de variables qui définit une variable par région" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      A runtime parameter appears in the Run pipeline panel, and its `values` list restricts the choice to the allowed regions. Parameters are resolved at compile time, so a `${{ if }}` expression on the parameter can include or exclude a stage.
    fr: |
      Un paramètre d'exécution apparaît dans le panneau Run pipeline, et sa liste `values` limite le choix aux régions autorisées. Les paramètres sont résolus à la compilation : une expression `${{ if }}` sur le paramètre peut donc inclure ou exclure une phase.
  options:
    a: { en: "A queue-time variable is free text, so any value can be entered, and as a variable it can't add or remove stages at compile time.", fr: "Une variable modifiable à la mise en file d'attente est un texte libre : n'importe quelle valeur peut être saisie, et une variable ne peut pas ajouter ou retirer des phases à la compilation." }
    c: { en: "Variables defined in the YAML file can't be changed when the run is queued.", fr: "Les variables définies dans le fichier YAML ne peuvent pas être modifiées lors de la mise en file d'attente." }
    d: { en: "A variable template only reuses fixed values; it gives users no choice at queue time.", fr: "Un modèle de variables réutilise seulement des valeurs fixes ; il ne propose aucun choix lors de la mise en file d'attente." }
references:
  - title: Runtime parameters
    url: https://learn.microsoft.com/en-us/azure/devops/pipelines/process/runtime-parameters
