id: az400-3d-hotfix-statements
objective: "3.4.4"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Contoso uses Azure Repos and Azure Pipelines. The YAML pipeline of a web app contains the following trigger:

    ```yaml
    trigger:
      branches:
        include:
        - main
        - release/*
    ```

    Production runs from **release/3.1**. A developer fixed a production bug in a pull request from **hotfix/3.1.1** into release/3.1, and the pull request was completed.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso utilise Azure Repos et Azure Pipelines. Le pipeline YAML d'une application web contient le déclencheur suivant :

    ```yaml
    trigger:
      branches:
        include:
        - main
        - release/*
    ```

    La production s'exécute à partir de **release/3.1**. Un développeur a corrigé un bogue de production dans une demande de tirage de **hotfix/3.1.1** vers release/3.1, et la demande de tirage a été terminée.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          Each push of a commit to hotfix/3.1.1 starts a run of the pipeline through the CI trigger.
        fr: |
          Chaque envoi d'un commit dans hotfix/3.1.1 démarre une exécution du pipeline par le déclencheur CI.
    - id: s2
      text:
        en: |
          Completing the pull request into release/3.1 starts a run of the pipeline through the CI trigger.
        fr: |
          La fin de la demande de tirage vers release/3.1 démarre une exécution du pipeline par le déclencheur CI.
    - id: s3
      text:
        en: |
          From the completed pull request in the web portal, the Cherry-pick action can create a new topic branch with the changes so that you can open a pull request into main.
        fr: |
          Depuis la demande de tirage terminée dans le portail web, l'action Cherry-pick peut créer une nouvelle branche de rubrique contenant les modifications afin que vous puissiez ouvrir une demande de tirage vers main.
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: |
      The CI trigger includes only main and the branches that match release/*, so pushes to hotfix/3.1.1 don't start a run. Completing the pull request pushes a merge commit to release/3.1, which matches release/* and starts a run. The Cherry-pick action of a pull request creates a new topic branch with all its changes and prompts you to create a pull request into another target branch, such as main.
    fr: |
      Le déclencheur CI n'inclut que main et les branches qui correspondent à release/* : les envois dans hotfix/3.1.1 ne démarrent pas d'exécution. Terminer la demande de tirage envoie un commit de fusion dans release/3.1, qui correspond à release/* et démarre une exécution. L'action Cherry-pick d'une demande de tirage crée une nouvelle branche de rubrique avec toutes ses modifications et vous invite à créer une demande de tirage vers une autre branche cible, comme main.
references:
  - title: Copy changes with cherry-pick
    url: https://learn.microsoft.com/en-us/azure/devops/repos/git/cherry-pick
  - title: Build Azure Repos Git or TFS Git repositories
    url: https://learn.microsoft.com/en-us/azure/devops/pipelines/repos/azure-repos-git
