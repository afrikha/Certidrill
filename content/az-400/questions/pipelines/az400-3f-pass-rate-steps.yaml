id: az400-3f-pass-rate-steps
objective: "3.6.1"
type: ordering
difficulty: 1
status: draft
stem:
  en: |
    Woodgrove Bank has a YAML pipeline named **payments-ci**. Its failure rate increased during the last month.

    You need to identify the tasks that caused most of the failures of the runs on the main branch during the last 30 days.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Woodgrove Bank dispose d'un pipeline YAML nommé **payments-ci**. Son taux d'échec a augmenté au cours du dernier mois.

    Vous devez identifier les tâches qui ont causé la plupart des échecs des exécutions de la branche main au cours des 30 derniers jours.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: open, text: { en: "Open payments-ci in Pipelines.", fr: "Ouvrir payments-ci dans Pipelines." } }
    - { id: tab, text: { en: "Select the Analytics tab.", fr: "Sélectionner l'onglet Analytics." } }
    - { id: card, text: { en: "Select the pipeline pass rate card to open the full report.", fr: "Sélectionner la carte du taux de réussite du pipeline pour ouvrir le rapport complet." } }
    - { id: filter, text: { en: "Set the date filter to 30 days and the branch filter to main, then review the top failing tasks.", fr: "Définir le filtre de dates sur 30 jours et le filtre de branche sur main, puis examiner les tâches qui échouent le plus." } }
    - { id: duration, text: { en: "Select the pipeline duration card to open the full report.", fr: "Sélectionner la carte de durée du pipeline pour ouvrir le rapport complet." } }
    - { id: testmgmt, text: { en: "Open Project settings > Pipelines > Test management.", fr: "Ouvrir Paramètres du projet > Pipelines > Gestion des tests." } }
answer:
  sequence: [ open, tab, card, filter ]
explanation:
  correct:
    en: |
      The Analytics tab of a pipeline shows summary cards; selecting the pass rate card opens the Pipeline pass rate report. Its date filter (14 days by default) and branch filter narrow the data, and its Top failing tasks section lists the tasks that cause most failures with links to the failed runs.
    fr: |
      L'onglet Analytics d'un pipeline affiche des cartes de synthèse ; sélectionner la carte du taux de réussite ouvre le rapport Pipeline pass rate. Son filtre de dates (14 jours par défaut) et son filtre de branche restreignent les données, et sa section des tâches qui échouent le plus liste les tâches responsables de la plupart des échecs avec des liens vers les exécutions en échec.
  options:
    duration: { en: "The duration report shows the longest tasks, not the failing ones.", fr: "Le rapport de durée montre les tâches les plus longues, pas celles qui échouent." }
    testmgmt: { en: "Test management settings configure flaky test detection; they contain no failure report.", fr: "Les paramètres de gestion des tests configurent la détection des tests instables ; ils ne contiennent aucun rapport d'échecs." }
references:
  - title: Pipeline reports
    url: https://learn.microsoft.com/en-us/azure/devops/pipelines/reports/pipelinereport
