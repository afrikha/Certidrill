id: az400-sr1-ci-paths-2
objective: "3.3.4"
type: series_yesno
series: az400-sr1-ci-paths
seriesOrder: 2
difficulty: 3
status: draft
stem:
  en: You add a trigger that includes main and release/* and excludes docs/*.
  fr: Vous ajoutez un déclencheur qui inclut main et release/* et exclut docs/*.
body:
  solution:
    en: |
      You add the following section to azure-pipelines.yml.

      ```yaml
      trigger:
        branches:
          include:
          - main
          - release/*
          exclude:
          - docs/*
      ```
    fr: |
      Vous ajoutez la section suivante à azure-pipelines.yml.

      ```yaml
      trigger:
        branches:
          include:
          - main
          - release/*
          exclude:
          - docs/*
      ```
answer: { value: false }
explanation:
  correct:
    en: The exclude list under `branches` filters branch names, so it only stops runs for branches such as docs/update; it does not look at the changed files. Folders are filtered with `paths`, so a push to main that changes only files in docs still starts a run.
    fr: "La liste exclude sous `branches` filtre des noms de branches : elle empêche seulement les exécutions pour des branches comme docs/update et n'examine pas les fichiers modifiés. Les dossiers se filtrent avec `paths` : une poussée vers main qui modifie uniquement des fichiers de docs démarre donc quand même une exécution."
references:
  - title: trigger definition
    url: https://learn.microsoft.com/en-us/azure/devops/pipelines/yaml-schema/trigger
