id: az400-3f-classic-mapping
objective: "3.6.5"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Tailspin Toys is migrating a classic release pipeline named **tickets-release** to a multi-stage YAML pipeline. The classic pipeline uses four elements that must keep the same behavior after the migration.

    Which YAML feature should replace each classic element? To answer, drag the appropriate features to the correct elements. Each feature may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin Toys migre un pipeline de mise en production classique nommé **tickets-release** vers un pipeline YAML à phases multiples. Le pipeline classique utilise quatre éléments qui doivent conserver le même comportement après la migration.

    Quelle fonctionnalité YAML doit remplacer chaque élément classique ? Pour répondre, faites glisser les fonctionnalités appropriées vers les éléments correspondants. Chaque fonctionnalité peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: template, text: { en: "A steps template stored in a repository", fr: "Un modèle d'étapes stocké dans un dépôt" } }
    - { id: schedules, text: { en: "A schedules section with a cron expression in UTC", fr: "Une section schedules avec une expression cron en UTC" } }
    - { id: group, text: { en: "A variables section that references the variable group", fr: "Une section variables qui référence le groupe de variables" } }
    - { id: function, text: { en: "An Invoke Azure Function check on the environment", fr: "Une vérification Invoke Azure Function sur l'environnement" } }
    - { id: parameter, text: { en: "A runtime parameter of the pipeline", fr: "Un paramètre d'exécution du pipeline" } }
    - { id: canary, text: { en: "A deployment job that uses the canary strategy", fr: "Un travail de déploiement qui utilise la stratégie canary" } }
  targets:
    - { id: t1, text: { en: "A task group that several release pipelines use to deploy the API", fr: "Un groupe de tâches que plusieurs pipelines de mise en production utilisent pour déployer l'API" } }
    - { id: t2, text: { en: "A scheduled release trigger that deploys every night", fr: "Un déclencheur de mise en production planifié qui effectue un déploiement chaque nuit" } }
    - { id: t3, text: { en: "A variable group named tickets-prod linked to the release pipeline", fr: "Un groupe de variables nommé tickets-prod lié au pipeline de mise en production" } }
    - { id: t4, text: { en: "A pre-deployment gate that calls an Azure function before production", fr: "Une porte de prédéploiement qui appelle une fonction Azure avant la production" } }
answer:
  mapping: { t1: template, t2: schedules, t3: group, t4: function }
explanation:
  correct:
    en: |
      Task groups are not supported in YAML pipelines; templates provide reusable steps instead. YAML scheduled triggers use cron expressions in UTC. Variable groups are reused as they are by referencing them in the variables section. Gates exist only in classic releases; in YAML, the Invoke Azure Function check on the environment calls the function before the stage runs.
    fr: |
      Les groupes de tâches ne sont pas pris en charge dans les pipelines YAML ; les modèles fournissent à la place des étapes réutilisables. Les déclencheurs planifiés YAML utilisent des expressions cron en UTC. Les groupes de variables sont réutilisés tels quels en les référençant dans la section variables. Les portes n'existent que dans les mises en production classiques ; en YAML, la vérification Invoke Azure Function sur l'environnement appelle la fonction avant l'exécution de la phase.
  options:
    parameter: { en: "Runtime parameters take values when a run is queued; they replace none of the four elements.", fr: "Les paramètres d'exécution prennent des valeurs à la mise en file d'une exécution ; ils ne remplacent aucun des quatre éléments." }
    canary: { en: "The canary strategy controls how a deployment rolls out; it does not call an external service before the stage.", fr: "La stratégie canary contrôle la façon dont un déploiement se propage ; elle n'appelle pas de service externe avant la phase." }
references:
  - title: YAML vs Classic Pipelines
    url: https://learn.microsoft.com/en-us/azure/devops/pipelines/get-started/pipelines-get-started
  - title: Define approvals and checks
    url: https://learn.microsoft.com/en-us/azure/devops/pipelines/process/approvals
