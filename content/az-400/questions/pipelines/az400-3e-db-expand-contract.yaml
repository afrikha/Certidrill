id: az400-3e-db-expand-contract
objective: "3.4.8"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Tailspin runs an order API on Azure App Service. Each release deploys the database changes first, then deploys the new application version to a staging slot and swaps it into production. If a problem appears after the swap, the team swaps the slots back.

    The next release renames the column **CustName** of the table **Orders** to **CustomerName**. Rolling back the application by swapping the slots back must remain possible after the database changes are deployed, without losing data written since the release.

    What should the next release do?
  fr: |
    Tailspin exécute une API de commandes sur Azure App Service. Chaque mise en production déploie d'abord les modifications de base de données, puis déploie la nouvelle version de l'application dans un emplacement de préproduction et la permute en production. Si un problème survient après la permutation, l'équipe permute de nouveau les emplacements.

    La prochaine mise en production renomme la colonne **CustName** de la table **Orders** en **CustomerName**. Le retour arrière de l'application par une nouvelle permutation des emplacements doit rester possible après le déploiement des modifications de base de données, sans perte des données écrites depuis la mise en production.

    Que doit faire la prochaine mise en production ?
body:
  options:
    - id: a
      text:
        en: "Rename the column with `sp_rename` in the database step, then deploy the application that reads **CustomerName**."
        fr: "Renommer la colonne avec `sp_rename` dans l'étape de base de données, puis déployer l'application qui lit **CustomerName**."
    - id: b
      text:
        en: "Rename the column in the database step, and restore a database backup taken before the release if the slots are swapped back."
        fr: "Renommer la colonne dans l'étape de base de données, et restaurer une sauvegarde de la base prise avant la mise en production si les emplacements sont permutés de nouveau."
    - id: c
      text:
        en: "Add **CustomerName** next to **CustName** and deploy code that writes both columns; drop **CustName** in a later release."
        fr: "Ajouter **CustomerName** à côté de **CustName** et déployer du code qui écrit dans les deux colonnes ; supprimer **CustName** dans une mise en production ultérieure."
    - id: d
      text:
        en: "Deploy the application first, then rename the column with a script in a job that runs after the swap."
        fr: "Déployer d'abord l'application, puis renommer la colonne avec un script dans un travail exécuté après la permutation."
answer: { optionId: c }
explanation:
  correct:
    en: "An expand-and-contract change keeps the schema backward compatible. The old application version still finds **CustName**, so swapping the slots back works, while the new version uses **CustomerName**. The old column is removed only in a later release, once no running version depends on it."
    fr: "Une modification de type expansion puis contraction (expand and contract) garde le schéma rétrocompatible. L'ancienne version de l'application trouve toujours **CustName** ; la nouvelle permutation fonctionne donc, tandis que la nouvelle version utilise **CustomerName**. L'ancienne colonne n'est supprimée que dans une mise en production ultérieure, lorsqu'aucune version en cours d'exécution n'en dépend."
  options:
    a:
      en: "After the rename, the previous application version no longer finds **CustName**, so swapping the slots back breaks the API."
      fr: "Après le renommage, la version précédente de l'application ne trouve plus **CustName** : une nouvelle permutation casse l'API."
    b:
      en: "Restoring a backup loses every order written since the backup was taken."
      fr: "La restauration d'une sauvegarde perd toutes les commandes écrites depuis la sauvegarde."
    d:
      en: "The new application version would run against the old schema until the script runs, and the rename still breaks a rollback."
      fr: "La nouvelle version de l'application s'exécuterait avec l'ancien schéma jusqu'à l'exécution du script, et le renommage empêche toujours le retour arrière."
references:
  - title: Deploy to Azure SQL Database
    url: https://learn.microsoft.com/en-us/azure/devops/pipelines/targets/azure-sqldb
