id: az400-3c-untyped-param
objective: "3.3.8"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Wingtip has the following step template, **scan-steps.yml**:

    ```yaml
    parameters:
      runScan: true

    steps:
    - script: ./build.sh
    - ${{ if eq(true, parameters.runScan) }}:
      - script: ./scan.sh
    ```

    A pipeline uses the template as follows:

    ```yaml
    steps:
    - template: scan-steps.yml
      parameters:
        runScan: false
    ```

    The scan step still runs. You need the scan step to be left out of the run when runScan is false, without changing the pipeline.

    What should you do?
  fr: |
    Wingtip dispose du modèle d'étapes suivant, **scan-steps.yml** :

    ```yaml
    parameters:
      runScan: true

    steps:
    - script: ./build.sh
    - ${{ if eq(true, parameters.runScan) }}:
      - script: ./scan.sh
    ```

    Un pipeline utilise le modèle comme suit :

    ```yaml
    steps:
    - template: scan-steps.yml
      parameters:
        runScan: false
    ```

    L'étape d'analyse s'exécute quand même. Vous devez faire en sorte que l'étape d'analyse soit exclue de l'exécution quand runScan vaut false, sans modifier le pipeline.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Replace the condition with `$[ eq(true, parameters.runScan) ]`.", fr: "Remplacer la condition par `$[ eq(true, parameters.runScan) ]`." } }
    - { id: b, text: { en: "Declare the parameter in the template as `- name: runScan` with `type: boolean` and `default: true`.", fr: "Déclarer le paramètre dans le modèle sous la forme `- name: runScan` avec `type: boolean` et `default: true`." } }
    - { id: c, text: { en: "Replace the condition with `${{ if eq(true, variables.runScan) }}`.", fr: "Remplacer la condition par `${{ if eq(true, variables.runScan) }}`." } }
    - { id: d, text: { en: "Add `condition: succeeded()` to the scan step.", fr: "Ajouter `condition: succeeded()` à l'étape d'analyse." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Untyped scalar parameters are treated as strings. `eq(true, parameters.runScan)` converts the right operand to the type of the left one, and the non-empty string 'false' converts to true, so the step is inserted. Declaring the parameter with `type: boolean` makes the comparison work on a real boolean.
    fr: |
      Les paramètres scalaires non typés sont traités comme des chaînes. `eq(true, parameters.runScan)` convertit l'opérande de droite dans le type de celui de gauche, et la chaîne non vide 'false' devient true : l'étape est insérée. Déclarer le paramètre avec `type: boolean` fait porter la comparaison sur un vrai booléen.
  options:
    a: { en: "Runtime expressions can't be used as keys to insert steps, and template parameters aren't available at runtime.", fr: "Les expressions d'exécution ne peuvent pas servir de clé pour insérer des étapes, et les paramètres de modèle ne sont pas disponibles à l'exécution." }
    c: { en: "runScan is a template parameter, not a variable; the step would never be inserted, even when runScan is true.", fr: "runScan est un paramètre de modèle, pas une variable ; l'étape ne serait jamais insérée, même quand runScan vaut true." }
    d: { en: "succeeded() is the default condition; it doesn't look at the parameter.", fr: "succeeded() est la condition par défaut ; elle ne tient pas compte du paramètre." }
references:
  - title: Use YAML templates in pipelines for reusable and secure processes
    url: https://learn.microsoft.com/en-us/azure/devops/pipelines/process/templates
  - title: Expressions
    url: https://learn.microsoft.com/en-us/azure/devops/pipelines/process/expressions
