id: az400-cs3c-swap-rollback
objective: "3.4.5"
type: single
caseStudy: az400-cs3c-litware-energy
difficulty: 1
status: draft
stem:
  en: |
    Release 4.2 was swapped into production 20 minutes ago. The billing system now reports errors that the smoke tests did not detect. No other deployment has run since the swap.

    You need to meet requirement 4. What should you do?
  fr: |
    La version 4.2 a été permutée en production il y a 20 minutes. Le système de facturation signale maintenant des erreurs que les tests de fumée n'ont pas détectées. Aucun autre déploiement n'a eu lieu depuis la permutation.

    Vous devez satisfaire l'exigence 4. Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Swap the staging slot with the production slot of app-meterhub again", fr: "Permuter de nouveau l'emplacement staging avec l'emplacement de production de app-meterhub" } }
    - { id: b, text: { en: "Rerun the meterhub-ci pipeline from the commit of release 4.1", fr: "Réexécuter le pipeline meterhub-ci à partir du commit de la version 4.1" } }
    - { id: c, text: { en: "Restore app-meterhub from the most recent App Service backup", fr: "Restaurer app-meterhub à partir de la sauvegarde App Service la plus récente" } }
    - { id: d, text: { en: "Restore sqldb-meterhub to a point in time before the deployment", fr: "Restaurer sqldb-meterhub à un point dans le temps antérieur au déploiement" } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      After a swap, the staging slot holds the previous production release, 4.1, already warmed up. Swapping the same two slots again immediately restores release 4.1 in production, without downtime, and release 4.1 still works because the schema change is backward compatible.
    fr: |
      Après une permutation, l'emplacement staging contient la version de production précédente, 4.1, déjà préchauffée. Permuter de nouveau les deux mêmes emplacements rétablit immédiatement la version 4.1 en production, sans temps d'arrêt, et la version 4.1 fonctionne toujours, car la modification du schéma est rétrocompatible.
  options:
    b:
      en: |
        Rebuilding and redeploying release 4.1 takes longer than a swap and goes again through the staging validation and the approval.
      fr: |
        Regénérer et redéployer la version 4.1 prend plus de temps qu'une permutation et repasse par la validation dans staging et par l'approbation.
    c:
      en: |
        A backup restore takes longer than a swap and overwrites the app, which can cause downtime.
      fr: |
        Une restauration de sauvegarde prend plus de temps qu'une permutation et écrase l'application, ce qui peut entraîner un temps d'arrêt.
    d:
      en: |
        Release 4.2 would still run in production, and a point-in-time restore would lose the meter readings received since the deployment.
      fr: |
        La version 4.2 resterait en production, et une restauration à un point dans le temps perdrait les relevés de compteurs reçus depuis le déploiement.
references:
  - title: Set Up Staging Environments
    url: https://learn.microsoft.com/en-us/azure/app-service/deploy-staging-slots
