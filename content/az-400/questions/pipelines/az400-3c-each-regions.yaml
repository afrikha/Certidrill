id: az400-3c-each-regions
objective: "3.3.5"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove deploys an API to several Azure regions with a YAML pipeline. The list of regions changes often. You need one deployment job per region in the list, and adding a region must only require changing the default value of the parameter.

    How should you complete the YAML? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove déploie une API dans plusieurs régions Azure avec un pipeline YAML. La liste des régions change souvent. Vous avez besoin d'un travail de déploiement par région de la liste, et l'ajout d'une région ne doit exiger que la modification de la valeur par défaut du paramètre.

    Comment devez-vous compléter le YAML ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: yaml
  template: |
    parameters:
    - name: regions
      type: [[s1]]
      default:
      - westeurope
      - northeurope

    jobs:
    - [[s2]]:
      - deployment: Deploy_${{ region }}
        environment: prod
        strategy:
          runOnce:
            deploy:
              steps:
              - script: ./deploy.sh --region [[s3]]
  slots:
    - id: s1
      options:
        - { id: object, text: object }
        - { id: string, text: string }
        - { id: boolean, text: boolean }
        - { id: steplist, text: stepList }
    - id: s2
      options:
        - { id: eachparam, text: "${{ each region in parameters.regions }}" }
        - { id: eachvar, text: "${{ each region in variables.regions }}" }
        - { id: eachruntime, text: "$[ each region in parameters.regions ]" }
    - id: s3
      options:
        - { id: tpl, text: "${{ region }}" }
        - { id: macro, text: "$(region)" }
        - { id: runtime, text: "$[ region ]" }
answer:
  values: { s1: object, s2: eachparam, s3: tpl }
explanation:
  correct:
    en: |
      A list default needs a parameter of type object. The `${{ each }}` template expression loops over the parameter at compile time and emits one deployment job per item. Inside the loop, the iteration variable is a template value, so it is read with `${{ region }}`, both in the job name and in the script.
    fr: |
      Une valeur par défaut de type liste exige un paramètre de type object. L'expression de modèle `${{ each }}` parcourt le paramètre à la compilation et génère un travail de déploiement par élément. Dans la boucle, la variable d'itération est une valeur de modèle : elle se lit avec `${{ region }}`, dans le nom du travail comme dans le script.
  options:
    string: { en: "A string parameter holds one value, not a list to iterate over.", fr: "Un paramètre string contient une seule valeur, pas une liste à parcourir." }
    boolean: { en: "A boolean holds true or false only.", fr: "Un booléen ne contient que true ou false." }
    steplist: { en: "stepList holds pipeline steps, not region names.", fr: "stepList contient des étapes de pipeline, pas des noms de régions." }
    eachvar: { en: "regions is a parameter, not a variable.", fr: "regions est un paramètre, pas une variable." }
    eachruntime: { en: "each is a template expression; it can't be used with the runtime syntax.", fr: "each est une expression de modèle ; il ne s'utilise pas avec la syntaxe d'exécution." }
    macro: { en: "region is not a pipeline variable, so the macro is not replaced.", fr: "region n'est pas une variable de pipeline : la macro n'est pas remplacée." }
    runtime: { en: "The loop variable only exists during template expansion, not at runtime.", fr: "La variable de boucle n'existe que pendant l'expansion des modèles, pas à l'exécution." }
references:
  - title: Expressions
    url: https://learn.microsoft.com/en-us/azure/devops/pipelines/process/expressions
  - title: Runtime parameters
    url: https://learn.microsoft.com/en-us/azure/devops/pipelines/process/runtime-parameters
