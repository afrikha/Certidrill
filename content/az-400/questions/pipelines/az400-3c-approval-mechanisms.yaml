id: az400-3c-approval-mechanisms
objective: "3.3.9"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Tailspin deploys with Azure Pipelines YAML pipelines and with GitHub Actions workflows. You need to choose the control that meets each requirement.

    Which control should you use for each requirement? To answer, drag the appropriate controls to the correct requirements. Each control may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin déploie avec des pipelines YAML Azure Pipelines et avec des workflows GitHub Actions. Vous devez choisir le contrôle qui répond à chaque exigence.

    Quel contrôle devez-vous utiliser pour chaque exigence ? Pour répondre, faites glisser les contrôles appropriés vers les exigences correspondantes. Chaque contrôle peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: approvals, text: { en: "Approvals check on the environment", fr: "Vérification Approvals sur l'environnement" } }
    - { id: manual, text: { en: "ManualValidation@1 task in an agentless job", fr: "Tâche ManualValidation@1 dans un travail sans agent" } }
    - { id: lock, text: { en: "Exclusive lock check on the environment", fr: "Vérification Exclusive lock sur l'environnement" } }
    - { id: hours, text: { en: "Business hours check on the environment", fr: "Vérification Business hours sur l'environnement" } }
    - { id: reviewers, text: { en: "Required reviewers rule on the GitHub environment", fr: "Règle Required reviewers sur l'environnement GitHub" } }
    - { id: branchrule, text: { en: "Branch protection rule on the main branch", fr: "Règle de protection de branche sur la branche main" } }
  targets:
    - { id: t1, text: { en: "Azure Pipelines: the Release Managers group must approve every run before it deploys to the prod environment", fr: "Azure Pipelines : le groupe Release Managers doit approuver chaque exécution avant qu'elle déploie vers l'environnement prod" } }
    - { id: t2, text: { en: "Azure Pipelines: pause in the middle of a stage until an operator confirms that a manual database step is done", fr: "Azure Pipelines : marquer une pause au milieu d'une phase jusqu'à ce qu'un opérateur confirme qu'une opération manuelle sur la base de données est terminée" } }
    - { id: t3, text: { en: "Azure Pipelines: only one run at a time may deploy to the prod environment", fr: "Azure Pipelines : une seule exécution à la fois peut déployer vers l'environnement prod" } }
    - { id: t4, text: { en: "GitHub Actions: a job that targets the production environment must wait for a team lead's approval", fr: "GitHub Actions : un job qui cible l'environnement production doit attendre l'approbation d'un chef d'équipe" } }
answer:
  mapping: { t1: approvals, t2: manual, t3: lock, t4: reviewers }
explanation:
  correct:
    en: |
      An Approvals check on an environment gates every stage that deploys to it. ManualValidation@1 pauses a run inside a stage, but only in an agentless job. The Exclusive lock check lets one run at a time use the environment. In GitHub, required reviewers are a deployment protection rule of the environment that the job references.
    fr: |
      Une vérification Approvals sur un environnement conditionne chaque phase qui y déploie. ManualValidation@1 met une exécution en pause au sein d'une phase, mais uniquement dans un travail sans agent. La vérification Exclusive lock ne laisse qu'une exécution à la fois utiliser l'environnement. Dans GitHub, les réviseurs obligatoires sont une règle de protection de déploiement de l'environnement référencé par le job.
  options:
    hours: { en: "Business hours restricts when a stage can start; it doesn't need a person.", fr: "Business hours restreint le moment où une phase peut démarrer ; elle ne fait intervenir personne." }
    branchrule: { en: "A branch protection rule governs pushes and merges to main, not deployment jobs.", fr: "Une règle de protection de branche régit les push et les fusions vers main, pas les jobs de déploiement." }
references:
  - title: Define approvals and checks
    url: https://learn.microsoft.com/en-us/azure/devops/pipelines/process/approvals
  - title: ManualValidation@1 - Manual validation v1 task
    url: https://learn.microsoft.com/en-us/azure/devops/pipelines/tasks/reference/manual-validation-v1
