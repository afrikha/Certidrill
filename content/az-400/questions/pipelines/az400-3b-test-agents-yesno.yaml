id: az400-3b-test-agents-yesno
objective: "3.2.3"
type: yesno_statements
difficulty: 3
status: draft
stem:
  en: |
    Adatum runs UI tests that open browser windows. The tests run in the following job on a self-hosted Windows agent pool named **UITest-Pool**, and the organization has enough self-hosted parallel jobs.

    ```yaml
    jobs:
      - job: UITests
        pool: UITest-Pool
        strategy:
          parallel: 3
        steps:
          - task: VSTest@3
            inputs:
              testSelector: testAssemblies
              testAssemblyVer2: |
                **\*UITests.dll
                !**\obj\**
              uiTests: true
    ```

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum exécute des tests d'interface utilisateur qui ouvrent des fenêtres de navigateur. Les tests s'exécutent dans le travail suivant sur un pool d'agents Windows auto-hébergés nommé **UITest-Pool**, et l'organisation dispose de suffisamment de travaux parallèles auto-hébergés.

    ```yaml
    jobs:
      - job: UITests
        pool: UITest-Pool
        strategy:
          parallel: 3
        steps:
          - task: VSTest@3
            inputs:
              testSelector: testAssemblies
              testAssemblyVer2: |
                **\*UITests.dll
                !**\obj\**
              uiTests: true
    ```

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: VSTest@3 splits the selected tests into batches that the three agents run in parallel.
        fr: VSTest@3 répartit les tests sélectionnés en lots que les trois agents exécutent en parallèle.
    - id: s2
      text:
        en: Setting `uiTests` to `true` configures the agents of UITest-Pool to run in interactive mode with autologon.
        fr: Le fait de définir `uiTests` sur `true` configure les agents de UITest-Pool pour qu'ils s'exécutent en mode interactif avec ouverture de session automatique.
    - id: s3
      text:
        en: The agents of UITest-Pool must run interactively with autologon enabled rather than as a Windows service.
        fr: Les agents de UITest-Pool doivent s'exécuter en mode interactif avec l'ouverture de session automatique activée, et non comme service Windows.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |
      In a multi-agent job, VSTest@3 detects the parallel agents and distributes test batches between them, unless `dontDistribute` is set to `true`. The `uiTests` input is only a reminder: it doesn't change the agent configuration. Tests that open a UI need an agent running in interactive mode with autologon, configured before the run is queued.
    fr: |
      Dans un travail multi-agent, VSTest@3 détecte les agents parallèles et leur répartit des lots de tests, sauf si `dontDistribute` vaut `true`. L'entrée `uiTests` n'est qu'un rappel : elle ne modifie pas la configuration de l'agent. Les tests qui ouvrent une interface utilisateur exigent un agent en mode interactif avec ouverture de session automatique, configuré avant la mise en file d'attente de l'exécution.
references:
  - title: VSTest@3 - Visual Studio Test v3 task
    url: https://learn.microsoft.com/en-us/azure/devops/pipelines/tasks/reference/vstest-v3
