id: az400-3a-test-levels
objective: "3.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam classifies its automated tests by using the test taxonomy that Microsoft describes for shifting testing left (L0 to L3). A new test suite verifies the repository classes of the inventory service. The tests load the compiled assembly and run queries against a SQL Server database, but they do not need a deployment of the service.

    You need to classify the new suite.

    Which level should you assign?
  fr: |
    Fabrikam classe ses tests automatisés selon la taxonomie de tests que Microsoft décrit pour déplacer les tests vers la gauche (L0 à L3). Une nouvelle suite de tests vérifie les classes de dépôt du service d'inventaire. Les tests chargent l'assembly compilé et exécutent des requêtes sur une base de données SQL Server, mais ils n'ont pas besoin d'un déploiement du service.

    Vous devez classer la nouvelle suite.

    Quel niveau devez-vous attribuer ?
shuffle: false
body:
  options:
    - { id: a, text: "L0" }
    - { id: b, text: "L1" }
    - { id: c, text: "L2" }
    - { id: d, text: "L3" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      In this taxonomy, L2 tests are functional tests that might require the assembly plus other dependencies, such as SQL or the file system. They sit between unit tests, which depend only on the assembly under test, and L3 tests, which require a service deployment.
    fr: |
      Dans cette taxonomie, les tests L2 sont des tests fonctionnels qui peuvent nécessiter l'assembly ainsi que d'autres dépendances, comme SQL ou le système de fichiers. Ils se situent entre les tests unitaires, qui ne dépendent que de l'assembly testé, et les tests L3, qui nécessitent un déploiement du service.
  options:
    a: { en: "L0 tests are fast, in-memory unit tests with no external dependency.", fr: "Les tests L0 sont des tests unitaires rapides, en mémoire, sans dépendance externe." }
    b: { en: "L1 tests are unit tests too: they depend on the code of the assembly under test and nothing else.", fr: "Les tests L1 sont aussi des tests unitaires : ils ne dépendent que du code de l'assembly testé." }
    d: { en: "L3 tests run against a testable service deployment, which this suite does not need.", fr: "Les tests L3 s'exécutent sur un déploiement de service testable, dont cette suite n'a pas besoin." }
references:
  - title: Shift testing left with unit tests
    url: https://learn.microsoft.com/en-us/devops/develop/shift-left-make-testing-fast-reliable
