id: az400-3b-agent-register-order
objective: "3.3.2"
type: ordering
difficulty: 1
status: draft
stem:
  en: |
    You are an administrator of an agent pool named **Linux-Build** in an Azure DevOps organization, and you created a personal access token (PAT) with the **Agent Pools (Read & manage)** scope.

    You need to add an Ubuntu virtual machine to Linux-Build as an agent that starts automatically when the virtual machine restarts.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Vous êtes administrateur d'un pool d'agents nommé **Linux-Build** dans une organisation Azure DevOps, et vous avez créé un jeton d'accès personnel (PAT) avec l'étendue **Agent Pools (Read & manage)**.

    Vous devez ajouter une machine virtuelle Ubuntu à Linux-Build en tant qu'agent qui démarre automatiquement au redémarrage de la machine virtuelle.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: download, text: { en: "Download and extract the Linux x64 agent package on the virtual machine.", fr: "Télécharger et extraire le package de l'agent Linux x64 sur la machine virtuelle." } }
    - { id: config, text: { en: "Run `./config.sh` and enter the organization URL, the PAT and the pool name Linux-Build.", fr: "Exécuter `./config.sh` et saisir l'URL de l'organisation, le PAT et le nom de pool Linux-Build." } }
    - { id: install, text: { en: "Run `sudo ./svc.sh install`.", fr: "Exécuter `sudo ./svc.sh install`." } }
    - { id: start, text: { en: "Run `sudo ./svc.sh start`.", fr: "Exécuter `sudo ./svc.sh start`." } }
    - { id: runonce, text: { en: "Run `./run.sh --once`.", fr: "Exécuter `./run.sh --once`." } }
    - { id: remove, text: { en: "Run `./config.sh remove`.", fr: "Exécuter `./config.sh remove`." } }
    - { id: conn, text: { en: "Create an Azure Resource Manager service connection for the virtual machine.", fr: "Créer une connexion de service Azure Resource Manager pour la machine virtuelle." } }
answer:
  sequence: [ download, config, install, start ]
explanation:
  correct:
    en: |
      You download and unpack the agent, then `./config.sh` registers it in the pool; the PAT is used only for this registration. To start the agent automatically, you install it as a systemd service with `./svc.sh install` and then start the service with `./svc.sh start`.
    fr: |
      Vous téléchargez et décompressez l'agent, puis `./config.sh` l'inscrit dans le pool ; le PAT ne sert qu'à cette inscription. Pour que l'agent démarre automatiquement, vous l'installez comme service systemd avec `./svc.sh install`, puis vous démarrez le service avec `./svc.sh start`.
  options:
    runonce: { en: "run.sh runs the agent interactively; with --once it accepts one job and exits.", fr: "run.sh exécute l'agent en mode interactif ; avec --once, il accepte un travail puis se termine." }
    remove: { en: "config.sh remove unregisters the agent.", fr: "config.sh remove désinscrit l'agent." }
    conn: { en: "Service connections let pipelines reach external services; they don't register agents.", fr: "Les connexions de service permettent aux pipelines d'atteindre des services externes ; elles n'inscrivent pas d'agents." }
references:
  - title: Self-hosted Linux agents
    url: https://learn.microsoft.com/en-us/azure/devops/pipelines/agents/linux-agent
  - title: Register an agent using a personal access token (PAT)
    url: https://learn.microsoft.com/en-us/azure/devops/pipelines/agents/personal-access-token-agent-registration
