id: az400-3b-cov-publish-multi
objective: "3.2.4"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Litware publishes the code coverage of several test projects by using the PublishCodeCoverageResults@2 task in an Azure Pipelines YAML pipeline.

    Which two statements about the PublishCodeCoverageResults@2 task are true?

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware publie la couverture du code de plusieurs projets de test avec la tâche PublishCodeCoverageResults@2 dans un pipeline YAML Azure Pipelines.

    Quelles sont les deux affirmations vraies sur la tâche PublishCodeCoverageResults@2 ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "The task fails when the line coverage is below a percentage set in its inputs.", fr: "La tâche échoue quand la couverture des lignes est inférieure à un pourcentage défini dans ses entrées." } }
    - { id: b, text: { en: "When summaryFileLocation matches several summary files, the task merges them into a single report.", fr: "Quand summaryFileLocation correspond à plusieurs fichiers de synthèse, la tâche les fusionne en un seul rapport." } }
    - { id: c, text: { en: "The task accepts only Cobertura and JaCoCo XML files.", fr: "La tâche n'accepte que des fichiers XML Cobertura et JaCoCo." } }
    - { id: d, text: { en: "The task requires the tests to run with the VSTest@3 task in the same job.", fr: "La tâche exige que les tests s'exécutent avec la tâche VSTest@3 dans le même travail." } }
    - { id: e, text: { en: "The task fills the Code Coverage tab of the run and adds an HTML report to the build artifacts.", fr: "La tâche remplit l'onglet Code Coverage de l'exécution et ajoute un rapport HTML aux artefacts de build." } }
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: |
      PublishCodeCoverageResults@2 merges all the summary files that match summaryFileLocation into one report. After the run, the results appear on the Code Coverage tab, and an HTML report with an index.html file is added to the build artifacts.
    fr: |
      PublishCodeCoverageResults@2 fusionne en un seul rapport tous les fichiers de synthèse qui correspondent à summaryFileLocation. Après l'exécution, les résultats apparaissent dans l'onglet Code Coverage, et un rapport HTML avec un fichier index.html est ajouté aux artefacts de build.
  options:
    a: { en: "The task has no threshold input; its only failure option is failIfCoverageEmpty. Thresholds are enforced on pull requests by the diff coverage status.", fr: "La tâche n'a aucune entrée de seuil ; sa seule option d'échec est failIfCoverageEmpty. Les seuils sont appliqués aux pull requests par l'état de couverture différentielle." }
    c: { en: "Version 2 accepts many formats, such as .coverage, .covx, .cjson, LCOV and several XML formats.", fr: "La version 2 accepte de nombreux formats, comme .coverage, .covx, .cjson, LCOV et plusieurs formats XML." }
    d: { en: "The task publishes files produced by any tool, such as coverlet, JaCoCo or Istanbul.", fr: "La tâche publie des fichiers produits par n'importe quel outil, comme coverlet, JaCoCo ou Istanbul." }
references:
  - title: PublishCodeCoverageResults@2 - Publish code coverage results v2 task
    url: https://learn.microsoft.com/en-us/azure/devops/pipelines/tasks/reference/publish-code-coverage-results-v2
