id: az400-3c-aca-blue-green
objective: "3.4.1"
type: ordering
difficulty: 3
status: draft
stem:
  en: |
    Proseware runs the container app **ca-orders** in single revision mode; its only active revision receives all the traffic. For the next release, you must meet the following requirements:

    - The new version is tested in production through its own URL while it receives no user traffic.
    - All users then move to the new version at once.
    - The previous version stays available for an immediate rollback.

    Which five actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Proseware exécute l'application conteneur **ca-orders** en mode révision unique ; sa seule révision active reçoit tout le trafic. Pour la prochaine mise en production, vous devez respecter les exigences suivantes :

    - La nouvelle version est testée en production via sa propre URL, sans recevoir de trafic utilisateur.
    - Tous les utilisateurs passent ensuite à la nouvelle version en une fois.
    - La version précédente reste disponible pour une restauration immédiate.

    Quelles sont les cinq actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 5
  actions:
    - { id: mode, text: { en: "Switch ca-orders to multiple active revisions mode.", fr: "Passer ca-orders en mode révisions actives multiples." } }
    - { id: blue, text: { en: "Add the label blue to the current revision and set its traffic weight to 100.", fr: "Ajouter l'étiquette blue à la révision actuelle et définir son poids de trafic sur 100." } }
    - { id: green, text: { en: "Deploy the new image as a new revision, add the label green to it, and keep its traffic weight at 0.", fr: "Déployer la nouvelle image comme nouvelle révision, lui ajouter l'étiquette green et maintenir son poids de trafic à 0." } }
    - { id: test, text: { en: "Test the new revision through the green label URL.", fr: "Tester la nouvelle révision via l'URL de l'étiquette green." } }
    - { id: switch, text: { en: "Set the label weights to blue=0 and green=100.", fr: "Définir les poids des étiquettes sur blue=0 et green=100." } }
    - { id: deactivate, text: { en: "Deactivate the blue revision.", fr: "Désactiver la révision blue." } }
    - { id: latest, text: { en: "Set the traffic weight of the latest revision to 100.", fr: "Définir le poids de trafic de la dernière révision sur 100." } }
answer:
  sequence: [ mode, blue, green, test, switch ]
explanation:
  correct:
    en: |
      Traffic splitting and revision labels need multiple active revisions mode. Pinning 100 percent of the traffic to the labeled blue revision before the deployment ensures that the new green revision starts with 0 percent. Each label has its own URL, so green is tested without user traffic, and the label weights then move all users at once while blue keeps running for rollback.
    fr: |
      La répartition du trafic et les étiquettes de révision exigent le mode révisions actives multiples. Fixer 100 % du trafic sur la révision étiquetée blue avant le déploiement garantit que la nouvelle révision green démarre à 0 %. Chaque étiquette a sa propre URL : green est testée sans trafic utilisateur, puis les poids des étiquettes font basculer tous les utilisateurs en une fois, tandis que blue reste en cours d'exécution pour la restauration.
  options:
    deactivate: { en: "A deactivated blue revision can't take traffic back immediately, which breaks the rollback requirement.", fr: "Une révision blue désactivée ne peut pas reprendre le trafic immédiatement, ce qui enfreint l'exigence de restauration." }
    latest: { en: "Sending traffic to the latest revision gives the new revision all user traffic as soon as it is created, before any test.", fr: "Envoyer le trafic vers la dernière révision donne tout le trafic utilisateur à la nouvelle révision dès sa création, avant tout test." }
references:
  - title: Blue-Green Deployment in Azure Container Apps
    url: https://learn.microsoft.com/en-us/azure/container-apps/blue-green-deployment
  - title: Traffic splitting in Azure Container Apps
    url: https://learn.microsoft.com/en-us/azure/container-apps/traffic-splitting
