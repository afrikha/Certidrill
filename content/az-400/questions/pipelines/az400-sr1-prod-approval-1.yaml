id: az400-sr1-prod-approval-1
objective: "3.3.9"
type: series_yesno
series: az400-sr1-prod-approval
seriesOrder: 1
difficulty: 1
status: draft
stem:
  en: You add an Approvals check to the Production environment.
  fr: Vous ajoutez une vérification Approvals à l'environnement Production.
body:
  solution:
    en: |
      In **Pipelines > Environments**, you open Production, select **Approvals and checks**, and add an **Approvals** check that lists the Release Approvers group as approvers.
    fr: |
      Dans **Pipelines > Environments**, vous ouvrez Production, sélectionnez **Approvals and checks** et ajoutez une vérification **Approvals** qui désigne le groupe Release Approvers comme approbateurs.
answer: { value: true }
explanation:
  correct:
    en: An approval defined on the environment applies to every stage, in any pipeline, that consumes Production, including pipelines created later, so it is configured only once. Approvals and checks are not defined in the YAML file, so users who edit the pipeline YAML cannot remove them.
    fr: "Une approbation définie sur l'environnement s'applique à chaque phase, dans n'importe quel pipeline, qui consomme Production, y compris les pipelines créés ultérieurement : elle n'est configurée qu'une seule fois. Les approbations et vérifications ne sont pas définies dans le fichier YAML, donc les utilisateurs qui modifient le YAML du pipeline ne peuvent pas les supprimer."
references:
  - title: Define approvals and checks
    url: https://learn.microsoft.com/en-us/azure/devops/pipelines/process/approvals
