series: az400-sr1-ci-paths
seriesOrder: 1
difficulty: 1
status: draft
stem:
  en: You add a trigger that lists main and release/*.
  fr: Vous ajoutez un déclencheur qui liste main et release/*.
body:
  solution:
    en: |
      You add the following section to azure-pipelines.yml.

      ```yaml
      trigger:
      - main
      - release/*
      ```
    fr: |
      Vous ajoutez la section suivante à azure-pipelines.yml.

      ```yaml
      trigger:
      - main
      - release/*
      ```
answer: { value: false }
explanation:
  correct:
    en: The branch list limits CI runs to main and the release/ branches, but it has no path filter. Without a path filter the root folder is implicitly included, so a push that changes only files in docs still starts a run.
    fr: "La liste de branches limite les exécutions CI à main et aux branches release/, mais elle ne contient aucun filtre de chemin. Sans filtre de chemin, le dossier racine est implicitement inclus : une poussée qui modifie uniquement des fichiers de docs démarre donc quand même une exécution."
references:
  - title: Build Azure Repos Git or TFS Git repositories
    url: https://learn.microsoft.com/en-us/azure/devops/pipelines/repos/azure-repos-git
