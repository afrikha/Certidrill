id: az400-cs4a-db-slot-order
objective: "3.4.8"
type: ordering
caseStudy: az400-cs4a-humongous-insurance
difficulty: 3
status: draft
stem:
  en: |
    You are designing the production stage of the new YAML pipeline. The stage deploys a new version of claims-db and claims-api. The solution must meet the deployment requirements.

    Which four actions should the stage perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Vous concevez la phase de production du nouveau pipeline YAML. Cette phase déploie une nouvelle version de claims-db et de claims-api. La solution doit respecter les exigences relatives aux déploiements.

    Quelles sont les quatre actions que la phase doit effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: stop, text: { en: "Stop the production slot of app-claims-prod.", fr: "Arrêter l'emplacement de production d'app-claims-prod." } }
    - { id: staging, text: { en: "Deploy the new claims-api package to the staging slot.", fr: "Déployer le nouveau package claims-api dans l'emplacement staging." } }
    - { id: swap, text: { en: "Swap the staging slot with the production slot.", fr: "Permuter l'emplacement staging avec l'emplacement de production." } }
    - { id: dacpac, text: { en: "Deploy the DACPAC to claimsdb.", fr: "Déployer le DACPAC dans claimsdb." } }
    - { id: autoswap, text: { en: "Enable auto swap from the staging slot to the production slot.", fr: "Activer la permutation automatique de l'emplacement staging vers l'emplacement de production." } }
    - { id: smoke, text: { en: "Run the smoke tests against the URL of the staging slot.", fr: "Exécuter les tests de fumée sur l'URL de l'emplacement staging." } }
    - { id: direct, text: { en: "Deploy the new claims-api package to the production slot.", fr: "Déployer le nouveau package claims-api dans l'emplacement de production." } }
answer:
  sequence: [ dacpac, staging, smoke, swap ]
explanation:
  correct:
    en: |
      The schema changes are backward compatible, so the DACPAC can be deployed first while the current version keeps running; if it fails, the stage stops before any application deployment (requirement 4). The new version then goes to the staging slot, which uses the same database, and the smoke tests run against it. Finally, the swap warms up the staging instances and switches the routing without dropping requests, so production receives only a tested version and users see no downtime.
    fr: |
      Les modifications de schéma sont rétrocompatibles : le DACPAC peut être déployé en premier pendant que la version actuelle continue de fonctionner ; s'il échoue, la phase s'arrête avant tout déploiement de l'application (exigence 4). La nouvelle version est ensuite déployée dans l'emplacement staging, qui utilise la même base de données, et les tests de fumée s'exécutent dessus. Enfin, la permutation préchauffe les instances de staging et bascule le routage sans perdre de requêtes : la production ne reçoit qu'une version testée et les utilisateurs ne subissent aucun temps d'arrêt.
  options:
    stop:
      en: |
        Stopping the production slot causes downtime, and a slot swap does not require it.
      fr: |
        Arrêter l'emplacement de production provoque un temps d'arrêt, et une permutation d'emplacements ne l'exige pas.
    autoswap:
      en: |
        Auto swap moves the code to production as soon as the slot is warmed up, before the smoke tests can run.
      fr: |
        La permutation automatique fait passer le code en production dès que l'emplacement est préchauffé, avant que les tests de fumée puissent s'exécuter.
    direct:
      en: |
        Deploying directly to the production slot exposes an untested version to users and can restart the production instances.
      fr: |
        Un déploiement direct dans l'emplacement de production expose aux utilisateurs une version non testée et peut redémarrer les instances de production.
references:
  - title: Set up staging environments in Azure App Service
    url: https://learn.microsoft.com/en-us/azure/app-service/deploy-staging-slots
  - title: Deploy to Azure SQL Database
    url: https://learn.microsoft.com/en-us/azure/devops/pipelines/targets/azure-sqldb
