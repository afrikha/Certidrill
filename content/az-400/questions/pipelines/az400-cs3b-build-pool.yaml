id: az400-cs3b-build-pool
objective: "3.3.2"
type: single
caseStudy: az400-cs3b-proseware-games
difficulty: 3
status: draft
stem:
  en: |
    You need to recommend an agent infrastructure to replace the office agents. The solution must meet the build infrastructure requirements. What should you recommend?
  fr: |
    Vous devez recommander une infrastructure d'agents pour remplacer les agents du bureau. La solution doit satisfaire les exigences d'infrastructure de build. Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "A Managed DevOps Pools pool that uses the gallery image and joins vnet-build", fr: "Un pool Managed DevOps Pools qui utilise l'image de la galerie et qui rejoint vnet-build" } }
    - { id: b, text: { en: "An Azure Virtual Machine Scale Set agent pool that uses the gallery image in vnet-build", fr: "Un pool d'agents de groupe de machines virtuelles identiques Azure qui utilise l'image de la galerie dans vnet-build" } }
    - { id: c, text: { en: "The Azure Pipelines pool with the windows-latest image and additional Microsoft-hosted parallel jobs", fr: "Le pool Azure Pipelines avec l'image windows-latest et des travaux parallèles hébergés par Microsoft supplémentaires" } }
    - { id: d, text: { en: "Self-hosted agents on Azure virtual machines created from the gallery image in vnet-build", fr: "Des agents auto-hébergés sur des machines virtuelles Azure créées à partir de l'image de la galerie dans vnet-build" } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Managed DevOps Pools runs the agents on virtual machines in a subscription that Microsoft owns and manages, scales them up and down with the demand, supports Azure compute gallery images, and can join an existing virtual network. The pool uses quota dedicated to the Managed DevOps Pools resource instead of the compute quota of Proseware's subscriptions.
    fr: |
      Managed DevOps Pools exécute les agents sur des machines virtuelles d'un abonnement que Microsoft possède et gère, les met à l'échelle selon la demande, prend en charge les images d'une galerie de calcul Azure et peut rejoindre un réseau virtuel existant. Le pool utilise un quota dédié à la ressource Managed DevOps Pools au lieu du quota de calcul des abonnements de Proseware.
  options:
    b:
      en: |
        Scale set agents meet the image, network, and scaling needs, but the scale set runs in Proseware's subscription and shares its compute quota, which requirement 6 forbids.
      fr: |
        Les agents de groupe identique satisfont les besoins d'image, de réseau et de mise à l'échelle, mais le groupe identique s'exécute dans l'abonnement de Proseware et partage son quota de calcul, ce que l'exigence 6 interdit.
    c:
      en: |
        Microsoft-hosted agents cannot use a custom image from an Azure compute gallery, and they cannot reach the license server in vnet-build.
      fr: |
        Les agents hébergés par Microsoft ne peuvent pas utiliser une image personnalisée d'une galerie de calcul Azure, et ils ne peuvent pas joindre le serveur de licences dans vnet-build.
    d:
      en: |
        Self-hosted agents on virtual machines run in Proseware's subscription, are managed by Proseware, and do not scale with the demand.
      fr: |
        Des agents auto-hébergés sur des machines virtuelles s'exécutent dans l'abonnement de Proseware, sont gérés par Proseware et ne suivent pas la demande.
references:
  - title: Compare Managed DevOps Pools with Azure Virtual Machine Scale Set agents
    url: https://learn.microsoft.com/en-us/azure/devops/managed-devops-pools/migrate-from-scale-set-agents
