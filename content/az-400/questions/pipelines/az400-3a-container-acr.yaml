id: az400-3a-container-acr
objective: "3.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Northwind uses Azure Pipelines and an Azure Artifacts feed named **nw-libs** for its NuGet packages. A new pipeline builds Docker images of a web API that is deployed to Azure App Service.

    You need to recommend where to store the images. The images must be stored in the Northwind Azure subscription, and access must be controlled by Microsoft Entra ID and Azure role-based access control (Azure RBAC).

    What should you recommend?
  fr: |
    Northwind utilise Azure Pipelines et un flux Azure Artifacts nommé **nw-libs** pour ses packages NuGet. Un nouveau pipeline génère des images Docker d'une API web déployée sur Azure App Service.

    Vous devez recommander où stocker les images. Les images doivent être stockées dans l'abonnement Azure de Northwind, et l'accès doit être contrôlé par Microsoft Entra ID et le contrôle d'accès en fonction du rôle Azure (Azure RBAC).

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "The nw-libs feed, with Docker as an additional package type", fr: "Le flux nw-libs, avec Docker comme type de package supplémentaire" } }
    - { id: b, text: { en: "An Azure container registry", fr: "Un registre de conteneurs Azure Container Registry" } }
    - { id: c, text: { en: "A Universal Package in the nw-libs feed", fr: "Un package universel dans le flux nw-libs" } }
    - { id: d, text: { en: "The GitHub Container registry (ghcr.io)", fr: "Le GitHub Container registry (ghcr.io)" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Azure Container Registry stores Docker and OCI container images as an Azure resource in your subscription. Every tier supports authentication with Microsoft Entra ID, and access is granted with Azure RBAC roles.
    fr: |
      Azure Container Registry stocke des images conteneur Docker et OCI en tant que ressource Azure de votre abonnement. Tous les niveaux prennent en charge l'authentification Microsoft Entra ID, et l'accès est accordé avec des rôles Azure RBAC.
  options:
    a: { en: "Azure Artifacts feeds support NuGet, npm, Maven, Gradle, Python, Cargo and Universal Packages, not container images.", fr: "Les flux Azure Artifacts prennent en charge NuGet, npm, Maven, Gradle, Python, Cargo et les packages universels, pas les images conteneur." }
    c: { en: "A Universal Package is a set of files, not an image that App Service or Docker can pull from a registry.", fr: "Un package universel est un ensemble de fichiers, pas une image qu'App Service ou Docker peut extraire d'un registre." }
    d: { en: "The GitHub Container registry is a GitHub service, outside the Azure subscription and outside Azure RBAC.", fr: "Le GitHub Container registry est un service GitHub, hors de l'abonnement Azure et hors d'Azure RBAC." }
references:
  - title: Introduction to Azure Container Registry
    url: https://learn.microsoft.com/en-us/azure/container-registry/container-registry-intro
  - title: What is Azure Artifacts?
    url: https://learn.microsoft.com/en-us/azure/devops/artifacts/start-using-azure-artifacts
