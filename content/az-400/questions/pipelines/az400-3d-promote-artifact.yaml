id: az400-3d-promote-artifact
objective: "3.4.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Northwind Traders has a YAML pipeline with the stages QA and Prod. Each stage checks out the repository, restores the NuGet packages, compiles the application, and deploys the output.

    Last week, a version that passed all the tests in QA failed in Prod because a floating package version resolved differently during the Prod build. You need to guarantee that Prod deploys exactly the binaries that were tested in QA.

    What should you do?
  fr: |
    Northwind Traders dispose d'un pipeline YAML avec les phases QA et Prod. Chaque phase extrait le dépôt, restaure les packages NuGet, compile l'application et déploie le résultat.

    La semaine dernière, une version qui avait réussi tous les tests en QA a échoué en Prod, car une version de package flottante a été résolue différemment pendant la build de Prod. Vous devez garantir que Prod déploie exactement les fichiers binaires testés en QA.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Run both stages on the same self-hosted agent pool.", fr: "Exécuter les deux phases sur le même pool d'agents auto-hébergés." }
    - id: b
      text: { en: "Add a manual approval to the Prod environment.", fr: "Ajouter une approbation manuelle à l'environnement Prod." }
    - id: c
      text: { en: "Add a dependsOn entry for QA to the Prod stage.", fr: "Ajouter une entrée dependsOn sur QA à la phase Prod." }
    - id: d
      text: { en: "Build once in a Build stage, publish a pipeline artifact, and deploy it in both stages.", fr: "Générer une seule fois dans une phase Build, publier un artefact de pipeline et le déployer dans les deux phases." }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Building once and promoting the same pipeline artifact through every stage removes any difference between what was tested and what is deployed. Deployment jobs download the artifacts of the current run automatically, so Prod receives the QA-tested files.
    fr: |
      Générer une seule fois et promouvoir le même artefact de pipeline à travers toutes les phases supprime tout écart entre ce qui a été testé et ce qui est déployé. Les travaux de déploiement téléchargent automatiquement les artefacts de l'exécution en cours : Prod reçoit les fichiers testés en QA.
  options:
    a:
      en: "The same pool doesn't prevent the restore from resolving a different package version at another time."
      fr: "Le même pool n'empêche pas la restauration de résoudre une autre version de package à un autre moment."
    c:
      en: "Stages already run in sequence by default; ordering them doesn't stop Prod from rebuilding different binaries."
      fr: "Les phases s'exécutent déjà dans l'ordre par défaut ; les ordonner n'empêche pas Prod de recompiler des binaires différents."
    b:
      en: "An approval adds human control but Prod would still rebuild the application."
      fr: "Une approbation ajoute un contrôle humain mais Prod recompilerait toujours l'application."
references:
  - title: Deployment jobs
    url: https://learn.microsoft.com/en-us/azure/devops/pipelines/process/deployment-jobs
