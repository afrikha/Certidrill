id: az400-cs3a-canary-revisions
objective: "3.4.1"
type: single
caseStudy: az400-cs3a-wingtip-shipping
difficulty: 2
status: draft
stem:
  en: |
    You need to recommend a release approach for berth-api that meets requirement 3. The solution must minimize administrative effort. What should you recommend?
  fr: |
    Vous devez recommander une approche de mise en production pour berth-api qui satisfait l'exigence 3. La solution doit réduire au minimum l'effort d'administration. Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "Switch berth-api to multiple revision mode, deploy the new revision, and set traffic weights of 90 and 10 between the two revisions", fr: "Passer berth-api en mode révisions multiples, déployer la nouvelle révision et définir des pondérations de trafic de 90 et 10 entre les deux révisions" } }
    - { id: b, text: { en: "Keep single revision mode and deploy the new image to berth-api, then redeploy the previous image tag if errors occur", fr: "Conserver le mode révision unique et déployer la nouvelle image dans berth-api, puis redéployer la balise d'image précédente en cas d'erreurs" } }
    - { id: c, text: { en: "Create a second container app for the new version and add both apps to an Azure Front Door origin group with weights of 90 and 10", fr: "Créer une deuxième application conteneur pour la nouvelle version et ajouter les deux applications à un groupe d'origines Azure Front Door avec des pondérations de 90 et 10" } }
    - { id: d, text: { en: "Deploy the new version to a second Container Apps environment and switch the DNS record of berth-api when it is validated", fr: "Déployer la nouvelle version dans un deuxième environnement Container Apps et basculer l'enregistrement DNS de berth-api une fois la version validée" } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      In multiple revision mode, Azure Container Apps keeps several revisions active and splits the ingress traffic between them by weight, for example with `az containerapp ingress traffic set --revision-weight`. Moving the weight of the new revision back to 0 returns all the traffic to the current revision in minutes, without rebuilding or redeploying an image, and no extra resource is needed.
    fr: |
      En mode révisions multiples, Azure Container Apps garde plusieurs révisions actives et répartit le trafic d'entrée entre elles selon des pondérations, par exemple avec `az containerapp ingress traffic set --revision-weight`. Ramener la pondération de la nouvelle révision à 0 renvoie tout le trafic vers la révision actuelle en quelques minutes, sans regénérer ni redéployer d'image, et aucune ressource supplémentaire n'est nécessaire.
  options:
    b:
      en: |
        In single revision mode, the new revision receives all the traffic at once, and rolling back means redeploying an image, which requirement 3 forbids.
      fr: |
        En mode révision unique, la nouvelle révision reçoit tout le trafic d'un coup, et revenir en arrière impose de redéployer une image, ce que l'exigence 3 interdit.
    c:
      en: |
        Weighted routing to a second app through another service could work, but it adds resources to manage, whereas Container Apps splits traffic natively between revisions.
      fr: |
        Un routage pondéré vers une deuxième application par un autre service pourrait fonctionner, mais il ajoute des ressources à gérer, alors que Container Apps répartit nativement le trafic entre les révisions.
    d:
      en: |
        A DNS switch is a blue-green cutover that moves all the traffic at once; it cannot send 10 percent of the traffic to the new version, and DNS caching slows the rollback.
      fr: |
        Une bascule DNS est un basculement bleu-vert qui déplace tout le trafic d'un coup ; elle ne peut pas envoyer 10 % du trafic vers la nouvelle version, et la mise en cache DNS ralentit le retour arrière.
references:
  - title: Traffic splitting in Azure Container Apps
    url: https://learn.microsoft.com/en-us/azure/container-apps/traffic-splitting
