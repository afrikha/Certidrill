id: az400-3b-trg-gh-events
objective: "3.3.4"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Wingtip uses GitHub Actions and is writing four workflows.

    Which event should trigger each workflow? To answer, drag the appropriate events to the correct workflows. Each event may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Wingtip utilise GitHub Actions et écrit quatre workflows.

    Quel événement doit déclencher chaque workflow ? Pour répondre, faites glisser les événements appropriés vers les workflows correspondants. Chaque événement peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: wfrun, text: workflow_run }
    - { id: repodispatch, text: repository_dispatch }
    - { id: wfdispatch, text: workflow_dispatch }
    - { id: schedule, text: schedule }
    - { id: prtarget, text: pull_request_target }
    - { id: wfcall, text: workflow_call }
  targets:
    - id: deploy
      text: { en: "A deployment workflow that must start when the Build workflow completes", fr: "Un workflow de déploiement qui doit démarrer quand le workflow Build se termine" }
    - id: ticket
      text: { en: "A workflow that starts when an external ticketing system sends an event with the event_type `ticket-approved` to the repository through the REST API", fr: "Un workflow qui démarre quand un système de tickets externe envoie au dépôt, par l'API REST, un événement dont l'event_type est `ticket-approved`" }
    - id: manual
      text: { en: "A workflow that an operator starts from the Actions tab and that asks for a target region as input", fr: "Un workflow qu'un opérateur démarre depuis l'onglet Actions et qui demande une région cible en entrée" }
    - id: cleanup
      text: { en: "A cleanup workflow that runs every Sunday at 02:00 UTC", fr: "Un workflow de nettoyage qui s'exécute chaque dimanche à 02:00 UTC" }
answer:
  mapping: { deploy: wfrun, ticket: repodispatch, manual: wfdispatch, cleanup: schedule }
explanation:
  correct:
    en: |
      `workflow_run` starts a workflow when another workflow is requested, in progress or completed. `repository_dispatch` lets an external system trigger workflows through the REST API, and its `types` filter matches the event_type of the request. `workflow_dispatch` adds a Run workflow button with typed inputs. `schedule` uses cron syntax in UTC and runs on the default branch.
    fr: |
      `workflow_run` démarre un workflow quand un autre workflow est demandé, en cours ou terminé. `repository_dispatch` permet à un système externe de déclencher des workflows par l'API REST, et son filtre `types` correspond à l'event_type de la requête. `workflow_dispatch` ajoute un bouton Run workflow avec des entrées typées. `schedule` utilise la syntaxe cron en UTC et s'exécute sur la branche par défaut.
references:
  - title: Explore events
    url: https://learn.microsoft.com/en-us/training/modules/introduction-to-github-actions/6-explore-events
