id: az400-3f-recycle-bin-storage
objective: "3.6.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam has an Azure Artifacts feed named **libs** that is close to its storage limit. As a Feed Owner, you deleted 600 old npm package versions from libs yesterday. The deleted versions are now in the Recycle Bin of the feed.

    You need to reduce the storage used by libs as soon as possible. The deleted versions will never be needed again.

    What should you do?
  fr: |
    Fabrikam dispose d'un flux Azure Artifacts nommé **libs** proche de sa limite de stockage. En tant que Feed Owner, vous avez supprimé hier 600 anciennes versions de packages npm de libs. Les versions supprimées se trouvent maintenant dans la Corbeille du flux.

    Vous devez réduire le plus tôt possible le stockage utilisé par libs. Les versions supprimées ne seront plus jamais nécessaires.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Permanently delete the versions from the Recycle Bin of the feed", fr: "Supprimer définitivement les versions de la Corbeille du flux" } }
    - { id: b, text: { en: "Wait seven days for the Recycle Bin to remove the versions automatically", fr: "Attendre sept jours que la Corbeille supprime automatiquement les versions" } }
    - { id: c, text: { en: "Enable package retention on libs with a maximum of 5 versions per package", fr: "Activer la rétention des packages sur libs avec un maximum de 5 versions par package" } }
    - { id: d, text: { en: "Deprecate the remaining old versions of each npm package in libs", fr: "Déprécier les anciennes versions restantes de chaque package npm de libs" } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Deleted packages stay in the Recycle Bin for 30 days and keep counting toward storage during that window. You can permanently delete them earlier from the web interface or the REST API, which releases the storage without waiting.
    fr: |
      Les packages supprimés restent 30 jours dans la Corbeille et continuent de compter dans le stockage pendant cette période. Vous pouvez les supprimer définitivement plus tôt depuis l'interface web ou l'API REST, ce qui libère le stockage sans attendre.
  options:
    b: { en: "Packages stay in the Recycle Bin for 30 days, not seven, and count toward storage until then.", fr: "Les packages restent 30 jours dans la Corbeille, pas sept, et comptent dans le stockage jusque-là." }
    c: { en: "Retention soft-deletes versions to the Recycle Bin, where they still count toward storage.", fr: "La rétention supprime les versions de manière réversible vers la Corbeille, où elles comptent toujours dans le stockage." }
    d: { en: "Deprecating an npm version only adds a warning to its metadata; the version stays in the feed.", fr: "Déprécier une version npm ajoute seulement un avertissement à ses métadonnées ; la version reste dans le flux." }
references:
  - title: Delete and recover packages
    url: https://learn.microsoft.com/en-us/azure/devops/artifacts/how-to/delete-and-recover-packages
