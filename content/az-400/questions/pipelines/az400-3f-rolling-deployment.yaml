id: az400-3f-rolling-deployment
objective: "3.6.5"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Proseware is migrating a classic release pipeline that deploys a website to six web servers of a deployment group, two servers at a time. The six servers are now registered as virtual machine resources of an environment named **prod-web**. The build stage publishes the website as a pipeline artifact named site.

    You need the YAML pipeline to deploy the site to all the virtual machines of prod-web, two machines at a time, and to download the site artifact automatically before the deployment script runs.

    How should you complete the YAML? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware migre un pipeline de mise en production classique qui déploie un site web sur six serveurs web d'un groupe de déploiement, deux serveurs à la fois. Les six serveurs sont maintenant inscrits comme ressources de machine virtuelle d'un environnement nommé **prod-web**. La phase de build publie le site web sous forme d'artefact de pipeline nommé site.

    Le pipeline YAML doit déployer le site sur toutes les machines virtuelles de prod-web, deux machines à la fois, et télécharger automatiquement l'artefact site avant l'exécution du script de déploiement.

    Comment devez-vous compléter le YAML ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: yaml
  template: |
    - stage: Production
      dependsOn: Build
      jobs:
      - [[jobtype]]: DeployWeb
        environment:
          name: prod-web
          resourceType: virtualMachine
        strategy:
          [[strategy]]:
            maxParallel: 2
            [[hook]]:
              steps:
              - powershell: ./deploy-site.ps1 -Package "$(Pipeline.Workspace)/site"
  slots:
    - id: jobtype
      options:
        - { id: job, text: job }
        - { id: deployment, text: deployment }
        - { id: template, text: template }
    - id: strategy
      options:
        - { id: runonce, text: runOnce }
        - { id: canary, text: canary }
        - { id: rolling, text: rolling }
    - id: hook
      options:
        - { id: deploy, text: deploy }
        - { id: predeploy, text: preDeploy }
        - { id: route, text: routeTraffic }
answer:
  values: { jobtype: deployment, strategy: rolling, hook: deploy }
explanation:
  correct:
    en: |
      Only a deployment job can target an environment and use a deployment strategy. The rolling strategy, which is supported for virtual machine resources, runs its hooks on batches of maxParallel machines. The download of the pipeline artifacts is injected automatically only in the deploy hook, so the script must be in deploy.
    fr: |
      Seul un travail de déploiement peut cibler un environnement et utiliser une stratégie de déploiement. La stratégie rolling, prise en charge pour les ressources de machine virtuelle, exécute ses hooks sur des lots de maxParallel machines. Le téléchargement des artefacts de pipeline n'est injecté automatiquement que dans le hook deploy : le script doit donc se trouver dans deploy.
  options:
    job: { en: "A regular job has no environment or deployment strategy.", fr: "Un travail standard n'a ni environnement ni stratégie de déploiement." }
    template: { en: "A template reference inserts content from another file; it is not a job type that targets an environment.", fr: "Une référence de modèle insère le contenu d'un autre fichier ; ce n'est pas un type de travail qui cible un environnement." }
    runonce: { en: "runOnce runs the deployment once and has no maxParallel batches.", fr: "runOnce exécute le déploiement une seule fois et n'a pas de lots maxParallel." }
    canary: { en: "canary rolls out by increments of traffic, and rolling is the strategy documented for virtual machine resources.", fr: "canary procède par incréments de trafic, et rolling est la stratégie documentée pour les ressources de machine virtuelle." }
    predeploy: { en: "Artifacts are not downloaded automatically in the preDeploy hook.", fr: "Les artefacts ne sont pas téléchargés automatiquement dans le hook preDeploy." }
    route: { en: "routeTraffic serves traffic to the updated version and gets no automatic artifact download.", fr: "routeTraffic dirige le trafic vers la version mise à jour et ne bénéficie pas du téléchargement automatique des artefacts." }
references:
  - title: Deployment jobs
    url: https://learn.microsoft.com/en-us/azure/devops/pipelines/process/deployment-jobs
  - title: Manage VM resources in environments
    url: https://learn.microsoft.com/en-us/azure/devops/pipelines/process/environments-virtual-machines
