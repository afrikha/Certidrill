id: az400-3c-selfhosted-network
objective: "3.3.7"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove must run an Azure Pipelines self-hosted agent on a server named **BLD01** in its datacenter, so that builds can reach an internal file share. The security policy forbids any inbound connection from the internet to the datacenter, and outbound traffic is allowed only to approved destinations.

    Which two actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove doit exécuter un agent auto-hébergé Azure Pipelines sur un serveur nommé **BLD01** de son centre de données, afin que les builds puissent joindre un partage de fichiers interne. La stratégie de sécurité interdit toute connexion entrante depuis Internet vers le centre de données, et le trafic sortant n'est autorisé que vers des destinations approuvées.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Allow inbound HTTPS from the Azure DevOps IP ranges to BLD01.", fr: "Autoriser le trafic HTTPS entrant depuis les plages IP d'Azure DevOps vers BLD01." } }
    - { id: b, text: { en: "Allow outbound HTTPS from BLD01 to the Azure DevOps service URLs.", fr: "Autoriser le trafic HTTPS sortant de BLD01 vers les URL du service Azure DevOps." } }
    - { id: c, text: { en: "Assign a public IP address to BLD01.", fr: "Attribuer une adresse IP publique à BLD01." } }
    - { id: d, text: { en: "Configure the agent to run interactively with automatic sign-in.", fr: "Configurer l'agent pour qu'il s'exécute de façon interactive avec ouverture de session automatique." } }
    - { id: e, text: { en: "Register the agent with an identity that is an administrator of the agent pool.", fr: "Inscrire l'agent avec une identité qui est administrateur du pool d'agents." } }
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: |
      The agent always initiates the communication and uses HTTP long polling to ask Azure Pipelines for jobs, so it only needs outbound HTTPS to the service. To register the agent, you authenticate (for example with a PAT, the device code flow or a service principal) with an identity that is an agent pool administrator; that role isn't kept on the agent after registration.
    fr: |
      L'agent initie toujours la communication et utilise l'interrogation longue HTTP pour demander des travaux à Azure Pipelines : il n'a besoin que de HTTPS sortant vers le service. Pour inscrire l'agent, vous vous authentifiez (par exemple avec un PAT, le flux de code d'appareil ou un principal de service) avec une identité administrateur du pool d'agents ; ce rôle n'est pas conservé sur l'agent après l'inscription.
  options:
    a: { en: "Azure Pipelines never connects to the agent, so no inbound rule is needed, and the policy forbids it.", fr: "Azure Pipelines ne se connecte jamais à l'agent : aucune règle entrante n'est nécessaire, et la stratégie l'interdit." }
    c: { en: "A public IP address isn't needed for outbound connections and would expose the server.", fr: "Une adresse IP publique n'est pas nécessaire pour les connexions sortantes et exposerait le serveur." }
    d: { en: "Interactive mode is for UI tests; the service mode is recommended and has no network impact.", fr: "Le mode interactif sert aux tests d'interface utilisateur ; le mode service est recommandé et n'a aucun impact réseau." }
references:
  - title: Azure Pipelines agents
    url: https://learn.microsoft.com/en-us/azure/devops/pipelines/agents/agents
