id: az400-3c-yaml-facts
objective: "3.3.5"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Your team at Proseware is converting its build definitions to Azure Pipelines YAML pipelines.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Votre équipe chez Proseware convertit ses définitions de build en pipelines YAML Azure Pipelines.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          A step that reads `${{ variables.version }}` gets the value that an earlier step of the same job assigned with `##vso[task.setvariable variable=version]`.
        fr: |
          Une étape qui lit `${{ variables.version }}` obtient la valeur qu'une étape précédente du même travail a affectée avec `##vso[task.setvariable variable=version]`.
    - id: s2
      text:
        en: |
          If a variable named `config` is defined at the root of the pipeline and in the `variables` block of a job, the steps of that job use the job-level value.
        fr: |
          Si une variable nommée `config` est définie à la racine du pipeline et dans le bloc `variables` d'un travail, les étapes de ce travail utilisent la valeur définie au niveau du travail.
    - id: s3
      text:
        en: |
          A pipeline that has no `stages` keyword runs its jobs in a single implicit stage.
        fr: |
          Un pipeline sans mot clé `stages` exécute ses travaux dans une seule phase implicite.
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: |
      Template expressions are resolved at compile time, so `${{ variables.version }}` keeps the initial value; use the macro `$(version)` to read a value set by `task.setvariable`. The most specific scope wins, so a job-level variable overrides the root value. Every pipeline has at least one stage, and jobs listed without `stages` run in one implicit stage.
    fr: |
      Les expressions de modèle sont résolues à la compilation : `${{ variables.version }}` conserve la valeur initiale ; utilisez la macro `$(version)` pour lire une valeur définie par `task.setvariable`. La portée la plus spécifique l'emporte : une variable de travail remplace la valeur racine. Chaque pipeline a au moins une phase, et les travaux listés sans `stages` s'exécutent dans une phase implicite.
references:
  - title: Define variables
    url: https://learn.microsoft.com/en-us/azure/devops/pipelines/process/variables
  - title: Add stages, dependencies, and conditions
    url: https://learn.microsoft.com/en-us/azure/devops/pipelines/process/stages
