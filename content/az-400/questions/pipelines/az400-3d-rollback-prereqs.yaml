id: az400-3d-rollback-prereqs
objective: "3.4.5"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Adatum deploys an order service by using a multi-stage YAML pipeline. Each release updates the application and applies schema changes to its Azure SQL database. The release cadence is one release every two months.

    The resiliency plan states that if a release fails in production, the team reruns the production stage of the previous successful run, so that the exact artifact deployed before is deployed again. Schema changes are never reverted during a rollback.

    Which two actions should you include in the plan? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum déploie un service de commandes à l'aide d'un pipeline YAML multiphase. Chaque mise en production met à jour l'application et applique des modifications de schéma à sa base de données Azure SQL. Le rythme est d'une mise en production tous les deux mois.

    Le plan de résilience stipule que si une mise en production échoue en production, l'équipe relance la phase de production de la précédente exécution réussie, afin de redéployer exactement l'artefact déployé auparavant. Les modifications de schéma ne sont jamais annulées lors d'une restauration.

    Quelles sont les deux actions à inclure dans le plan ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text: { en: "Retain each run that deploys to production, by using a retention lease or by retaining it indefinitely.", fr: "Conserver chaque exécution qui déploie en production, à l'aide d'un bail de rétention ou en la conservant indéfiniment." }
    - id: b
      text: { en: "Save the artifact of each release by using the Cache@2 task.", fr: "Enregistrer l'artefact de chaque version à l'aide de la tâche Cache@2." }
    - id: c
      text: { en: "Make each schema change backward compatible with the previous version of the application.", fr: "Rendre chaque modification de schéma rétrocompatible avec la version précédente de l'application." }
    - id: d
      text: { en: "Restore the database from a backup taken before the release.", fr: "Restaurer la base de données à partir d'une sauvegarde prise avant la mise en production." }
    - id: e
      text: { en: "Rebuild the previous version from its commit when a rollback is needed.", fr: "Régénérer la version précédente à partir de son commit quand une restauration est nécessaire." }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |
      When the retention policy deletes a run, its artifacts and logs are deleted too, so the previous production run, two months old by the next release, must be retained explicitly to stay available for a rerun. Because the schema isn't reverted, the previous version of the application must still work with the new schema, which requires backward-compatible (expand and contract) changes.
    fr: |
      Quand la stratégie de rétention supprime une exécution, ses artefacts et ses journaux sont supprimés aussi : la précédente exécution de production, vieille de deux mois à la version suivante, doit donc être conservée explicitement pour rester disponible. Comme le schéma n'est pas annulé, la version précédente de l'application doit toujours fonctionner avec le nouveau schéma, ce qui exige des modifications rétrocompatibles (expansion puis contraction).
  options:
    b:
      en: "Pipeline caching speeds up runs by reusing files such as dependencies; it isn't a guaranteed store for the artifacts of a release."
      fr: "La mise en cache de pipeline accélère les exécutions en réutilisant des fichiers comme les dépendances ; ce n'est pas un stockage garanti pour les artefacts d'une version."
    d:
      en: "Restoring a backup loses the orders written since the backup, and the plan never reverts schema changes."
      fr: "Restaurer une sauvegarde fait perdre les commandes écrites depuis la sauvegarde, et le plan n'annule jamais les modifications de schéma."
    e:
      en: "A rebuild produces a new artifact, not the exact one deployed before."
      fr: "Une nouvelle génération produit un nouvel artefact, pas exactement celui déployé auparavant."
references:
  - title: Retention policies
    url: https://learn.microsoft.com/en-us/azure/devops/pipelines/policies/retention
