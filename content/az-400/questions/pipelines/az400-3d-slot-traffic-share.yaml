id: az400-3d-slot-traffic-share
objective: "3.4.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Contoso has an App Service web app named **app-catalog** in the Standard tier, with a slot named **staging** that contains the next version.

    Before swapping, the product team wants about 10 percent of the production users to use the new version for one day. A user who reaches the new version must keep using it for the rest of the session. The solution must not require any new Azure resource.

    What should you do?
  fr: |
    Contoso dispose d'une application web App Service nommée **app-catalog** dans le niveau Standard, avec un emplacement nommé **staging** qui contient la prochaine version.

    Avant la permutation, l'équipe produit veut qu'environ 10 pour cent des utilisateurs de production utilisent la nouvelle version pendant une journée. Un utilisateur qui accède à la nouvelle version doit continuer à l'utiliser pendant le reste de sa session. La solution ne doit nécessiter aucune nouvelle ressource Azure.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Create an Azure Front Door profile with weighted origins for the two slots.", fr: "Créer un profil Azure Front Door avec des origines pondérées pour les deux emplacements." }
    - id: b
      text: { en: "Scale out app-catalog and enable ARR affinity.", fr: "Effectuer un scale-out d'app-catalog et activer l'affinité ARR." }
    - id: c
      text: { en: "Perform a swap with preview and wait one day before completing it.", fr: "Effectuer une permutation avec aperçu et attendre une journée avant de la terminer." }
    - id: d
      text: { en: "Set the Traffic % of the staging slot to 10.", fr: "Définir le % du trafic de l'emplacement staging sur 10." }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Traffic routing on a slot sends the chosen percentage of production requests to it, which is a built-in canary for App Service. The `x-ms-routing-name` cookie pins each routed client to the slot, so a user stays on the same version.
    fr: |
      Le routage du trafic sur un emplacement envoie le pourcentage choisi des requêtes de production vers celui-ci : c'est un canari intégré à App Service. Le cookie `x-ms-routing-name` fixe chaque client routé sur l'emplacement, si bien qu'un utilisateur reste sur la même version.
  options:
    a:
      en: "Front Door could split traffic, but it is a new Azure resource, which the requirements exclude."
      fr: "Front Door pourrait répartir le trafic, mais c'est une nouvelle ressource Azure, ce que les exigences excluent."
    c:
      en: "During a swap with preview, production users still reach the current version only; the staging slot just runs with production settings."
      fr: "Pendant une permutation avec aperçu, les utilisateurs de production n'atteignent que la version actuelle ; l'emplacement staging s'exécute simplement avec les paramètres de production."
    b:
      en: "ARR affinity keeps a client on one instance of the same slot; it doesn't send users to another slot."
      fr: "L'affinité ARR maintient un client sur une instance du même emplacement ; elle n'envoie pas d'utilisateurs vers un autre emplacement."
references:
  - title: Set up staging environments in Azure App Service
    url: https://learn.microsoft.com/en-us/azure/app-service/deploy-staging-slots
