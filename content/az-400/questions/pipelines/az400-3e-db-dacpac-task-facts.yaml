id: az400-3e-db-dacpac-task-facts
objective: "3.4.8"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    Contoso uses Azure Pipelines to deploy a SQL Server Database Project to an Azure SQL database named **sqldb-orders**. The build stage publishes the file **Orders.dacpac**. The deployment stage uses the **SqlAzureDacpacDeployment@1** task with an Azure Resource Manager service connection named **sc-orders-prod**.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso utilise Azure Pipelines pour déployer un projet de base de données SQL Server vers une base de données Azure SQL nommée **sqldb-orders**. La phase de build publie le fichier **Orders.dacpac**. La phase de déploiement utilise la tâche **SqlAzureDacpacDeployment@1** avec une connexion de service Azure Resource Manager nommée **sc-orders-prod**.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "The deployment job can run the task on the Microsoft-hosted image **ubuntu-latest**."
        fr: "Le travail de déploiement peut exécuter la tâche sur l'image hébergée par Microsoft **ubuntu-latest**."
    - id: s2
      text:
        en: "With `AuthenticationType` set to `servicePrincipal`, the task connects to the database by using the identity of the service connection, without a SQL login and password in the pipeline."
        fr: "Avec `AuthenticationType` défini sur `servicePrincipal`, la tâche se connecte à la base de données avec l'identité de la connexion de service, sans identifiant de connexion ni mot de passe SQL dans le pipeline."
    - id: s3
      text:
        en: "With `DeploymentAction` set to `DeployReport`, the task applies the schema changes and then writes a report of the changes it made."
        fr: "Avec `DeploymentAction` défini sur `DeployReport`, la tâche applique les modifications de schéma, puis écrit un rapport des modifications effectuées."
answer:
  values: { s1: false, s2: true, s3: false }
explanation:
  correct:
    en: "The Azure SQL Database deployment task is supported only on Windows agents, so the job needs a Windows image such as windows-latest. The servicePrincipal authentication type uses the service principal of the Azure Resource Manager service connection instead of SQL credentials. DeployReport only produces an XML report of the changes that a Publish action would make; it doesn't modify the database."
    fr: "La tâche de déploiement Azure SQL Database n'est prise en charge que sur des agents Windows ; le travail a donc besoin d'une image Windows, comme windows-latest. Le type d'authentification servicePrincipal utilise le principal de service de la connexion de service Azure Resource Manager à la place d'informations d'identification SQL. DeployReport produit seulement un rapport XML des modifications qu'une action Publish effectuerait ; il ne modifie pas la base de données."
references:
  - title: SqlAzureDacpacDeployment@1 - Azure SQL Database deployment v1 task
    url: https://learn.microsoft.com/en-us/azure/devops/pipelines/tasks/reference/sql-azure-dacpac-deployment-v1
  - title: SqlPackage
    url: https://learn.microsoft.com/en-us/sql/tools/sqlpackage/sqlpackage
