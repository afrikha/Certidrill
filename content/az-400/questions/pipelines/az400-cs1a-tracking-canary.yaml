id: az400-cs1a-tracking-canary
objective: "3.4.1"
type: single
caseStudy: az400-cs1a-consolidated-messenger
difficulty: 2
status: draft
stem:
  en: |
    You need to design the release process of tracking-api to meet the deployment requirements and the requirement to minimize administrative effort.

    What should you include in the design?
  fr: |
    Vous devez concevoir le processus de mise en production de tracking-api pour respecter les exigences de déploiement et l'exigence de réduire au minimum l'effort d'administration.

    Que devez-vous inclure dans la conception ?
body:
  options:
    - { id: a, text: { en: "Keep ca-tracking in single revision mode and add readiness probes so that traffic moves to a new revision only when it is ready", fr: "Conserver ca-tracking en mode de révision unique et ajouter des sondes readiness pour que le trafic ne bascule vers une nouvelle révision que lorsqu'elle est prête" } }
    - { id: b, text: { en: "Deploy each new version to a second container app and route 10 percent of the traffic to it with Azure Traffic Manager weighted routing", fr: "Déployer chaque nouvelle version sur une deuxième application conteneur et lui envoyer 10 % du trafic avec le routage pondéré d'Azure Traffic Manager" } }
    - { id: c, text: { en: "Add a scale rule so that the new revision starts with one replica for every nine replicas of the current revision", fr: "Ajouter une règle de mise à l'échelle pour que la nouvelle révision démarre avec un réplica pour neuf réplicas de la révision actuelle" } }
    - { id: d, text: { en: "Switch ca-tracking to multiple revision mode and set the ingress traffic weights of the new and current revisions to 10 and 90", fr: "Passer ca-tracking en mode de révision multiple et définir les poids de trafic d'entrée de la nouvelle révision et de la révision actuelle à 10 et 90" } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      In multiple revision mode, several revisions of a container app stay active and ingress splits the traffic between them by percentage weights that total 100. Setting the weight of the new revision back to 0 returns all the traffic to the previous revision immediately, with no new build or deployment, and the whole process stays inside one container app.
    fr: |
      En mode de révision multiple, plusieurs révisions d'une application conteneur restent actives et l'entrée répartit le trafic entre elles selon des poids en pourcentage dont le total vaut 100. Remettre le poids de la nouvelle révision à 0 renvoie immédiatement tout le trafic vers la révision précédente, sans nouvelle build ni nouveau déploiement, et tout le processus reste dans une seule application conteneur.
  options:
    a: { en: "Single revision mode gives a zero-downtime switch, but it moves 100 percent of the traffic to the new revision and deprovisions the old one, so there is no 10 percent stage and no instant rollback.", fr: "Le mode de révision unique assure une bascule sans interruption, mais il envoie 100 % du trafic vers la nouvelle révision et déprovisionne l'ancienne : il n'y a ni étape à 10 % ni restauration instantanée." }
    b: { en: "Traffic Manager works at the DNS level, so clients keep cached answers and the rollback is not done within seconds; a second app also adds administrative effort.", fr: "Traffic Manager agit au niveau DNS : les clients conservent les réponses en cache et la restauration ne se fait pas en quelques secondes ; une deuxième application ajoute aussi de l'effort d'administration." }
    c: { en: "Scale rules set the number of replicas of a revision; they do not decide how ingress traffic is split between revisions.", fr: "Les règles de mise à l'échelle définissent le nombre de réplicas d'une révision ; elles ne décident pas de la répartition du trafic d'entrée entre les révisions." }
references:
  - title: Traffic splitting in Azure Container Apps
    url: https://learn.microsoft.com/en-us/azure/container-apps/traffic-splitting
  - title: Update and deploy changes in Azure Container Apps
    url: https://learn.microsoft.com/en-us/azure/container-apps/revisions
