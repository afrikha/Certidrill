id: az400-3b-gh-app-scope
objective: "3.3.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Contoso's GitHub organization contains private repositories and public open-source repositories. An organization owner plans to install the Azure Pipelines GitHub App so that two private repositories can be built by Azure Pipelines.

    You need to limit the repositories that the token of the app can access. The pipelines must report their results as GitHub Checks.

    What should you do?
  fr: |
    L'organisation GitHub de Contoso contient des dépôts privés et des dépôts open source publics. Un propriétaire de l'organisation prévoit d'installer l'application GitHub Azure Pipelines pour que deux dépôts privés puissent être générés par Azure Pipelines.

    Vous devez limiter les dépôts auxquels le jeton de l'application peut accéder. Les pipelines doivent publier leurs résultats sous forme de GitHub Checks.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Install the app for all repositories and set the visibility of the Azure DevOps project to private.", fr: "Installer l'application pour tous les dépôts et définir la visibilité du projet Azure DevOps sur privé." } }
    - { id: b, text: { en: "Install the app and select only the two private repositories.", fr: "Installer l'application et sélectionner uniquement les deux dépôts privés." } }
    - { id: c, text: { en: "Connect the pipelines with a PAT that has the `repo` scope instead of the app.", fr: "Connecter les pipelines avec un PAT qui a l'étendue `repo` au lieu de l'application." } }
    - { id: d, text: { en: "Connect the pipelines with OAuth instead of the app.", fr: "Connecter les pipelines avec OAuth au lieu de l'application." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      When the app is installed for all repositories, its token can access every repository of the organization, including private ones. Learn recommends selecting specific repositories when an organization contains both private and public repositories, and the GitHub App is the only connection type that supports GitHub Checks.
    fr: |
      Quand l'application est installée pour tous les dépôts, son jeton peut accéder à tous les dépôts de l'organisation, y compris les dépôts privés. Learn recommande de sélectionner des dépôts précis quand une organisation contient à la fois des dépôts privés et publics, et l'application GitHub est le seul type de connexion qui prend en charge les GitHub Checks.
  options:
    a: { en: "The Azure DevOps project visibility doesn't limit what the app's token can access in GitHub.", fr: "La visibilité du projet Azure DevOps ne limite pas ce à quoi le jeton de l'application peut accéder dans GitHub." }
    c: { en: "A PAT acts with the personal identity of its owner, on every repository that owner can reach, and doesn't support Checks.", fr: "Un PAT agit avec l'identité personnelle de son propriétaire, sur tous les dépôts accessibles à ce propriétaire, et ne prend pas en charge les Checks." }
    d: { en: "OAuth also uses a personal identity and doesn't support GitHub Checks.", fr: "OAuth utilise aussi une identité personnelle et ne prend pas en charge les GitHub Checks." }
references:
  - title: Build GitHub repositories
    url: https://learn.microsoft.com/en-us/azure/devops/pipelines/repos/github
