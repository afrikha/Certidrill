id: az400-cs4a-feed-views
objective: "3.1.2"
type: dragdrop
caseStudy: az400-cs4a-humongous-insurance
difficulty: 2
status: draft
stem:
  en: |
    You need to meet the package requirements for humongous-libs.

    What should you configure for each requirement? To answer, drag the appropriate actions to the correct requirements. Each action may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez satisfaire les exigences relatives aux packages de humongous-libs.

    Que devez-vous configurer pour chaque exigence ? Pour répondre, faites glisser les actions appropriées vers les exigences correspondantes. Chaque action peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: promote, text: { en: "Promote each version that passes the integration tests to the @Release view, and have the other teams connect to humongous-libs@Release", fr: "Promouvoir chaque version qui réussit les tests d'intégration dans la vue @Release, et faire connecter les autres équipes à humongous-libs@Release" } }
    - { id: publishview, text: { en: "Publish each version that passes the integration tests directly to the @Release view", fr: "Publier chaque version qui réussit les tests d'intégration directement dans la vue @Release" } }
    - { id: upstream, text: { en: "Add nuget.org as an upstream source of humongous-libs", fr: "Ajouter nuget.org comme source en amont de humongous-libs" } }
    - { id: reader, text: { en: "Assign the Feed Reader role to the developers", fr: "Attribuer le rôle Feed Reader aux développeurs" } }
    - { id: collab, text: { en: "Assign the Feed and Upstream Reader (Collaborator) role to the developers", fr: "Attribuer le rôle Feed and Upstream Reader (Collaborator) aux développeurs" } }
    - { id: contrib, text: { en: "Assign the Feed Publisher (Contributor) role to the developers", fr: "Attribuer le rôle Feed Publisher (Contributor) aux développeurs" } }
  targets:
    - { id: r6, text: { en: "Requirement 6: other teams consume only tested versions", fr: "Exigence 6 : les autres équipes ne consomment que les versions testées" } }
    - { id: r7, text: { en: "Requirement 7: restores keep working during a nuget.org outage", fr: "Exigence 7 : les restaurations fonctionnent pendant une panne de nuget.org" } }
    - { id: r8, text: { en: "Requirement 8: developers can save new nuget.org packages in the feed", fr: "Exigence 8 : les développeurs peuvent conserver de nouveaux packages de nuget.org dans le flux" } }
answer:
  mapping: { r6: promote, r7: upstream, r8: collab }
explanation:
  correct:
    en: |
      Packages are always published to the base feed (@Local); a version is then promoted to a view such as @Release, and consumers connected to that view see only the promoted versions. With nuget.org as an upstream source, every package installed through the feed is saved in it, so restores keep working when nuget.org is unavailable. Saving packages from an upstream source requires the Feed and Upstream Reader (Collaborator) role, the lowest role that allows it.
    fr: |
      Les packages sont toujours publiés dans le flux de base (@Local) ; une version est ensuite promue dans une vue comme @Release, et les consommateurs connectés à cette vue ne voient que les versions promues. Avec nuget.org comme source en amont, chaque package installé au travers du flux y est enregistré, et les restaurations fonctionnent même si nuget.org est indisponible. L'enregistrement de packages depuis une source en amont exige le rôle Feed and Upstream Reader (Collaborator), le rôle le plus bas qui le permet.
  options:
    publishview:
      en: |
        You cannot publish directly to a view; publishing targets the @Local view, and only promotion adds a version to @Release.
      fr: |
        Il est impossible de publier directement dans une vue : la publication cible la vue @Local, et seule la promotion ajoute une version à @Release.
    reader:
      en: |
        Feed Reader can restore packages already in the feed but cannot save new packages from upstream sources.
      fr: |
        Feed Reader peut restaurer les packages déjà présents dans le flux, mais ne peut pas enregistrer de nouveaux packages depuis les sources en amont.
    contrib:
      en: |
        Feed Publisher (Contributor) can save upstream packages but also publish, promote and unlist packages, which exceeds least privilege.
      fr: |
        Feed Publisher (Contributor) peut enregistrer des packages en amont, mais aussi publier, promouvoir et retirer de la liste des packages, ce qui dépasse le privilège minimum.
references:
  - title: What are feed views?
    url: https://learn.microsoft.com/en-us/azure/devops/artifacts/concepts/views
  - title: Manage permissions
    url: https://learn.microsoft.com/en-us/azure/devops/artifacts/feeds/feed-permissions
