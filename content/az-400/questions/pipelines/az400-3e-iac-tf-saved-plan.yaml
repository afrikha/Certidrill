id: az400-3e-iac-tf-saved-plan
objective: "3.5.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Litware deploys its network with Terraform from a GitHub Actions workflow. The first job generates a plan and posts it on the pull request. A second job, which runs in a GitHub environment with required reviewers, applies the change after approval.

    You need to ensure that the second job applies exactly the changes that the reviewers approved, even if the infrastructure or the main branch changes in the meantime.

    What should you do?
  fr: |
    Litware déploie son réseau avec Terraform depuis un flux de travail GitHub Actions. Le premier job génère un plan et le publie dans la demande de tirage. Un second job, exécuté dans un environnement GitHub avec des réviseurs requis, applique la modification après approbation.

    Vous devez vous assurer que le second job applique exactement les modifications approuvées par les réviseurs, même si l'infrastructure ou la branche main change entre-temps.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text:
        en: "In the second job, run `terraform apply -auto-approve` on the checked-out configuration."
        fr: "Dans le second job, exécuter `terraform apply -auto-approve` sur la configuration extraite."
    - id: b
      text:
        en: "In the second job, run `terraform plan` again, then `terraform apply` with the new plan."
        fr: "Dans le second job, exécuter de nouveau `terraform plan`, puis `terraform apply` avec le nouveau plan."
    - id: c
      text:
        en: "In the first job, run `terraform validate` and upload its output; in the second job, run `terraform apply`."
        fr: "Dans le premier job, exécuter `terraform validate` et charger sa sortie ; dans le second job, exécuter `terraform apply`."
    - id: d
      text:
        en: "In the first job, run `terraform plan -out=tfplan` and upload tfplan as an artifact; in the second job, run `terraform apply tfplan`."
        fr: "Dans le premier job, exécuter `terraform plan -out=tfplan` et charger tfplan comme artefact ; dans le second job, exécuter `terraform apply tfplan`."
answer: { optionId: d }
explanation:
  correct:
    en: "A saved plan file records the exact actions that Terraform computed. Applying that file performs those actions only, and Terraform refuses to apply it if the state changed since the plan was created, so nothing beyond the approved changes is applied."
    fr: "Un fichier de plan enregistré contient les actions exactes calculées par Terraform. L'application de ce fichier n'effectue que ces actions, et Terraform refuse de l'appliquer si l'état a changé depuis la création du plan : rien d'autre que les modifications approuvées n'est appliqué."
  options:
    a:
      en: "Without a saved plan, apply computes a new plan at run time, which can differ from the one the reviewers saw."
      fr: "Sans plan enregistré, apply calcule un nouveau plan au moment de l'exécution, qui peut différer de celui que les réviseurs ont vu."
    b:
      en: "A new plan reflects the current state and configuration, not the plan that was approved."
      fr: "Un nouveau plan reflète l'état et la configuration actuels, pas le plan approuvé."
    c:
      en: "`terraform validate` only checks the configuration syntax; it doesn't record any change to apply."
      fr: "`terraform validate` vérifie seulement la syntaxe de la configuration ; il n'enregistre aucune modification à appliquer."
references:
  - title: Comparing Terraform and Bicep
    url: https://learn.microsoft.com/en-us/azure/developer/terraform/comparing-terraform-and-bicep
