id: az400-3a-feed-cross-org
objective: "3.1.2"
type: ordering
difficulty: 3
status: draft
stem:
  en: |
    Adatum has two Azure DevOps organizations, **adatum-platform** and **adatum-retail**, connected to the same Microsoft Entra tenant. The project-scoped feed **core** in the project **Shared** of adatum-platform publishes validated packages to its @Release view.

    The retail developers use a feed named **retail** in adatum-retail. They must restore the validated core packages through the retail feed, without adding a second package source to their configuration.

    Which three actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Adatum dispose de deux organisations Azure DevOps, **adatum-platform** et **adatum-retail**, connectées au même locataire Microsoft Entra. Le flux délimité au projet **core** du projet **Shared** d'adatum-platform publie les packages validés dans sa vue @Release.

    Les développeurs retail utilisent un flux nommé **retail** dans adatum-retail. Ils doivent restaurer les packages core validés par l'intermédiaire du flux retail, sans ajouter de deuxième source de packages à leur configuration.

    Quelles sont les trois actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - { id: share, text: { en: "In the core feed, edit the @Release view and share it with All feeds and people in organizations associated with my Microsoft Entra tenant.", fr: "Dans le flux core, modifier la vue @Release et la partager avec All feeds and people in organizations associated with my Microsoft Entra tenant." } }
    - { id: add, text: { en: "In the retail feed, add an upstream source of type Azure Artifacts feed in another organization with the locator azure-feed://adatum-platform/Shared/core@Release.", fr: "Dans le flux retail, ajouter une source en amont de type Azure Artifacts feed in another organization avec le localisateur azure-feed://adatum-platform/Shared/core@Release." } }
    - { id: restore, text: { en: "Restore the projects by using a nuget.config file that clears the other sources and contains only the retail feed.", fr: "Restaurer les projets avec un fichier nuget.config qui efface les autres sources et ne contient que le flux retail." } }
    - { id: sc, text: { en: "In adatum-retail, create a NuGet service connection to the core feed with a personal access token.", fr: "Dans adatum-retail, créer une connexion de service NuGet vers le flux core avec un jeton d'accès personnel." } }
    - { id: promote, text: { en: "In the core feed, promote the validated packages to the @Local view.", fr: "Dans le flux core, promouvoir les packages validés vers la vue @Local." } }
    - { id: both, text: { en: "Add the core feed URL as a second source in the nuget.config file of the retail projects.", fr: "Ajouter l'URL du flux core comme deuxième source dans le fichier nuget.config des projets retail." } }
answer:
  sequence: [ share, add, restore ]
explanation:
  correct:
    en: |
      A feed of another organization can be an upstream source only if its owner first shares the view with All feeds and people in organizations associated with my Microsoft Entra tenant. A Feed Owner of retail then adds the upstream source with the azure-feed://ORGANIZATION/PROJECT/FEED@VIEW locator of a project-scoped feed. Clients finally use the retail feed as their only source, so every request goes through it and its upstreams.
    fr: |
      Un flux d'une autre organisation ne peut être une source en amont que si son propriétaire partage d'abord la vue avec All feeds and people in organizations associated with my Microsoft Entra tenant. Un Feed Owner de retail ajoute ensuite la source en amont avec le localisateur azure-feed://ORGANIZATION/PROJECT/FEED@VIEW d'un flux délimité au projet. Les clients utilisent enfin le flux retail comme source unique : chaque requête passe par lui et ses sources en amont.
  options:
    sc: { en: "Upstream sources between organizations of the same tenant rely on the shared view, not on a service connection or a token.", fr: "Les sources en amont entre organisations du même locataire reposent sur la vue partagée, pas sur une connexion de service ni sur un jeton." }
    promote: { en: "Packages are in @Local as soon as they are published; you cannot promote to @Local, and it would expose unvalidated versions.", fr: "Les packages sont dans @Local dès leur publication ; on ne promeut pas vers @Local, et cette vue exposerait des versions non validées." }
    both: { en: "A second source in nuget.config is what the requirement forbids.", fr: "Une deuxième source dans nuget.config est précisément ce que l'exigence interdit." }
references:
  - title: Set up upstream sources for your feed
    url: https://learn.microsoft.com/en-us/azure/devops/artifacts/how-to/set-up-upstream-sources
