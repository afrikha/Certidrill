id: az400-3d-docker-build-args
objective: "3.4.7"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Fabrikam builds a container image in Azure Pipelines and pushes it to Azure Container Registry by using the following step:

    ```yaml
    - task: Docker@2
      inputs:
        command: buildAndPush
        containerRegistry: sc-acr-fabrikam
        repository: billing/api
        tags: $(Build.BuildId)
        arguments: --build-arg APP_VERSION=$(Build.BuildNumber)
    ```

    The image is pushed successfully, but the APP_VERSION build argument is never set in the image. You need the image to receive the build argument and still be pushed to the registry with the same tag. The solution must keep using the Docker@2 task.

    What should you do?
  fr: |
    Fabrikam génère une image conteneur dans Azure Pipelines et l'envoie vers Azure Container Registry à l'aide de l'étape suivante :

    ```yaml
    - task: Docker@2
      inputs:
        command: buildAndPush
        containerRegistry: sc-acr-fabrikam
        repository: billing/api
        tags: $(Build.BuildId)
        arguments: --build-arg APP_VERSION=$(Build.BuildNumber)
    ```

    L'image est envoyée avec succès, mais l'argument de build APP_VERSION n'est jamais défini dans l'image. Vous devez faire en sorte que l'image reçoive l'argument de build et soit toujours envoyée vers le registre avec la même balise. La solution doit continuer à utiliser la tâche Docker@2.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Set addPipelineData to false in the existing step.", fr: "Définir addPipelineData sur false dans l'étape existante." }
    - id: b
      text: { en: "Replace the step with a Docker@2 build step that has the arguments, followed by a Docker@2 push step.", fr: "Remplacer l'étape par une étape Docker@2 build qui porte les arguments, suivie d'une étape Docker@2 push." }
    - id: c
      text: { en: "Move the build argument to the buildContext input of the existing step.", fr: "Déplacer l'argument de build dans l'entrée buildContext de l'étape existante." }
    - id: d
      text: { en: "Add a Docker@2 login step before the existing step.", fr: "Ajouter une étape Docker@2 login avant l'étape existante." }
answer: { optionId: b }
explanation:
  correct:
    en: |
      The `arguments` input is ignored when the command is `buildAndPush`, because it would be ambiguous between the internal build and push steps. Splitting the work into a `build` command that carries `--build-arg` and a `push` command with the same repository and tags passes the argument and still pushes the image.
    fr: |
      L'entrée `arguments` est ignorée quand la commande est `buildAndPush`, car elle serait ambiguë entre les étapes internes de build et de push. Séparer le travail en une commande `build` qui porte `--build-arg` et une commande `push` avec le même dépôt et les mêmes balises transmet l'argument et envoie toujours l'image.
  options:
    a:
      en: "addPipelineData only controls the pipeline metadata labels added to the image."
      fr: "addPipelineData contrôle uniquement les étiquettes de métadonnées du pipeline ajoutées à l'image."
    c:
      en: "buildContext is the path of the build context folder; it can't carry Docker arguments."
      fr: "buildContext est le chemin du dossier de contexte de build ; il ne peut pas porter d'arguments Docker."
    d:
      en: "The push already succeeds, so authentication isn't the problem; arguments are still ignored."
      fr: "L'envoi réussit déjà : l'authentification n'est pas le problème, et les arguments sont toujours ignorés."
references:
  - title: Docker@2 - Docker v2 task
    url: https://learn.microsoft.com/en-us/azure/devops/pipelines/tasks/reference/docker-v2
