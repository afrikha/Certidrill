id: az400-cs2b-release-strategies
objective: "3.4.1"
type: dragdrop
caseStudy: az400-cs2b-relecloud
difficulty: 1
status: draft
stem:
  en: |
    You need to recommend a release strategy for each component to meet the requirements.

    Which strategy should you recommend for each component? To answer, drag the appropriate strategies to the correct components. Each strategy may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez recommander une stratégie de mise en production pour chaque composant afin de respecter les exigences.

    Quelle stratégie devez-vous recommander pour chaque composant ? Pour répondre, faites glisser les stratégies appropriées vers les composants correspondants. Chaque stratégie peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: bg, text: { en: "Blue-green deployment", fr: "Déploiement bleu/vert" } }
    - { id: canary, text: { en: "Canary release", fr: "Mise en production canari" } }
    - { id: ring, text: { en: "Ring-based deployment", fr: "Déploiement en anneaux" } }
    - { id: ab, text: { en: "A/B testing", fr: "Test A/B" } }
    - { id: rolling, text: { en: "Rolling deployment", fr: "Déploiement progressif (rolling)" } }
  targets:
    - { id: catalog, text: { en: "catalog-api", fr: "catalog-api" } }
    - { id: player, text: { en: "player-service", fr: "player-service" } }
    - { id: home, text: { en: "home-web", fr: "home-web" } }
    - { id: tv, text: { en: "Relecloud TV app", fr: "Application Relecloud TV" } }
answer:
  mapping: { catalog: canary, player: bg, home: ab, tv: ring }
explanation:
  correct:
    en: A canary release exposes a new version to a small share of the traffic and increases it as long as the health signals stay good; in Container Apps, traffic splitting between revisions implements it. Blue-green keeps two complete versions side by side and moves all the traffic at once, so the idle previous revision allows an instant switch back. A/B testing shows variants to random groups and compares a business metric. Ring-based deployment releases to successive groups of users (employees, beta subscribers, everyone).
    fr: |
      Une mise en production canari expose une nouvelle version à une petite part du trafic et l'augmente tant que les signaux d'intégrité restent bons ; dans Container Apps, le fractionnement du trafic entre révisions la met en œuvre. Le déploiement bleu/vert conserve deux versions complètes côte à côte et bascule tout le trafic d'un coup : la révision précédente inactive permet un retour immédiat. Le test A/B présente des variantes à des groupes aléatoires et compare une métrique métier. Le déploiement en anneaux publie pour des groupes d'utilisateurs successifs (employés, abonnés bêta, tout le monde).
  options:
    rolling: { en: "A rolling deployment replaces instances in batches; it doesn't keep an idle previous version, compare variants or target user groups.", fr: "Un déploiement progressif (rolling) remplace les instances par lots ; il ne conserve pas de version précédente inactive, ne compare pas de variantes et ne cible pas de groupes d'utilisateurs." }
references:
  - title: Traffic splitting in Azure Container Apps
    url: https://learn.microsoft.com/en-us/azure/container-apps/traffic-splitting
