id: az400-3d-flag-env-labels
objective: "3.4.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam uses one Azure App Configuration store for the test and production deployments of a web app. The app checks a feature flag named **Checkout2** in its code.

    Checkout2 must be enabled in test and disabled in production. You must be able to change the state of the flag in each environment independently, without changing the flag name in the code and without creating another store.

    What should you do?
  fr: |
    Fabrikam utilise un seul magasin Azure App Configuration pour les déploiements de test et de production d'une application web. L'application vérifie dans son code un indicateur de fonctionnalité nommé **Checkout2**.

    Checkout2 doit être activé en test et désactivé en production. Vous devez pouvoir modifier l'état de l'indicateur dans chaque environnement indépendamment, sans changer le nom de l'indicateur dans le code et sans créer d'autre magasin.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Create two Checkout2 flags with the labels Test and Production, and make each deployment load the flags of its label.", fr: "Créer deux indicateurs Checkout2 avec les étiquettes (labels) Test et Production, et faire charger à chaque déploiement les indicateurs de son étiquette." }
    - id: b
      text: { en: "Create two Checkout2 flags with the tags Test and Production, and make each deployment load the flags of its tag.", fr: "Créer deux indicateurs Checkout2 avec les balises (tags) Test et Production, et faire charger à chaque déploiement les indicateurs de sa balise." }
    - id: c
      text: { en: "Add a time window filter to Checkout2 that covers only the test deployment hours.", fr: "Ajouter à Checkout2 un filtre de fenêtre de temps qui ne couvre que les heures du déploiement de test." }
    - id: d
      text: { en: "Add a percentage filter to Checkout2 with a value of 50.", fr: "Ajouter à Checkout2 un filtre de pourcentage avec la valeur 50." }
answer: { optionId: a }
explanation:
  correct:
    en: |
      A label lets you create different flags for the same key, so Checkout2 can exist once per environment and be enabled or disabled independently. Each deployment selects its label when it loads the flags, for example with `featureFlagOptions.Select("*", "Production")` in `UseFeatureFlags`.
    fr: |
      Une étiquette (label) permet de créer des indicateurs différents pour la même clé : Checkout2 peut exister une fois par environnement et être activé ou désactivé indépendamment. Chaque déploiement sélectionne son étiquette quand il charge les indicateurs, par exemple avec `featureFlagOptions.Select("*", "Production")` dans `UseFeatureFlags`.
  options:
    b:
      en: "A key and a label identify a key-value; tags are metadata and can't hold two flags with the same key."
      fr: "Une clé et une étiquette identifient une paire clé-valeur ; les balises sont des métadonnées et ne peuvent pas contenir deux indicateurs de même clé."
    c:
      en: "A time window filter depends on the date and time, not on the environment that evaluates the flag."
      fr: "Un filtre de fenêtre de temps dépend de la date et de l'heure, pas de l'environnement qui évalue l'indicateur."
    d:
      en: "A percentage filter enables the flag for half of the evaluations in both environments."
      fr: "Un filtre de pourcentage active l'indicateur pour la moitié des évaluations dans les deux environnements."
references:
  - title: "Quickstart: Manage feature flags in Azure App Configuration"
    url: https://learn.microsoft.com/en-us/azure/azure-app-configuration/manage-feature-flags
