id: az400-3a-test-load-private
objective: "3.2.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Contoso hosts an internal pricing API that is reachable only through a private endpoint in a virtual network named **vnet-pricing** in the West Europe region. You have an Azure Load Testing resource named **lt-contoso** in the same subscription and region, and you have the Network Contributor role on vnet-pricing.

    You need to run a JMeter load test against the private endpoint of the API. The API must not be exposed to the internet.

    What should you do?
  fr: |
    Contoso héberge une API interne de tarification accessible uniquement par un point de terminaison privé dans un réseau virtuel nommé **vnet-pricing** de la région West Europe. Vous disposez d'une ressource Azure Load Testing nommée **lt-contoso** dans le même abonnement et la même région, et vous avez le rôle Network Contributor sur vnet-pricing.

    Vous devez exécuter un test de charge JMeter sur le point de terminaison privé de l'API. L'API ne doit pas être exposée à Internet.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Run the AzureLoadTest@1 task on a self-hosted agent that is connected to vnet-pricing", fr: "Exécuter la tâche AzureLoadTest@1 sur un agent auto-hébergé connecté à vnet-pricing" } }
    - { id: b, text: { en: "Recreate the test as a URL-based test that targets the private IP address of the API", fr: "Recréer le test en tant que test basé sur des URL qui cible l'adresse IP privée de l'API" } }
    - { id: c, text: { en: "Assign the Load Test Contributor role on lt-contoso to the managed identity of the API", fr: "Attribuer le rôle Load Test Contributor sur lt-contoso à l'identité managée de l'API" } }
    - { id: d, text: { en: "Configure the test for private traffic and select a non-delegated subnet of vnet-pricing", fr: "Configurer le test pour le trafic privé et sélectionner un sous-réseau non délégué de vnet-pricing" } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      With virtual network injection, Azure Load Testing deploys its test engines into a subnet of your virtual network for the duration of the test, so they reach private endpoints directly. The virtual network must be in the same subscription and region as the load testing resource, and the subnet must not be delegated to another service. In a pipeline, the subnet is set with subnetId in the load test YAML.
    fr: |
      Avec l'injection dans un réseau virtuel, Azure Load Testing déploie ses moteurs de test dans un sous-réseau de votre réseau virtuel pendant la durée du test : ils atteignent directement les points de terminaison privés. Le réseau virtuel doit être dans le même abonnement et la même région que la ressource de test de charge, et le sous-réseau ne doit pas être délégué à un autre service. Dans un pipeline, le sous-réseau se définit avec subnetId dans le YAML du test de charge.
  options:
    a: { en: "The task only starts the test in the service; the test engines still run outside vnet-pricing.", fr: "La tâche démarre seulement le test dans le service ; les moteurs de test s'exécutent toujours hors de vnet-pricing." }
    b: { en: "The test type does not change where the engines run; without VNet injection they cannot reach a private IP address.", fr: "Le type de test ne change pas l'emplacement des moteurs ; sans injection dans le réseau virtuel, ils ne peuvent pas atteindre une adresse IP privée." }
    c: { en: "Load Test Contributor lets an identity run load tests; it gives the test engines no network path to the API.", fr: "Load Test Contributor permet à une identité d'exécuter des tests de charge ; il ne donne aux moteurs de test aucun chemin réseau vers l'API." }
references:
  - title: Load test private endpoints
    url: https://learn.microsoft.com/en-us/azure/load-testing/how-to-test-private-endpoint
