id: az400-3a-ver-lock-file
objective: "3.1.3"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    Contoso develops a .NET web application named **BillingService**. No other project depends on BillingService. Its project file references packages by using version ranges, and several of these packages bring transitive dependencies.

    You need to ensure that the CI pipeline restores exactly the same direct and transitive package versions that the developers tested. If a developer changes the package references without updating the restore graph, the CI restore must fail.

    Which two actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso développe une application web .NET nommée **BillingService**. Aucun autre projet ne dépend de BillingService. Son fichier projet référence des packages avec des plages de versions, et plusieurs de ces packages apportent des dépendances transitives.

    Vous devez faire en sorte que le pipeline de CI restaure exactement les mêmes versions de packages directes et transitives que celles testées par les développeurs. Si un développeur modifie les références de packages sans mettre à jour le graphe de restauration, la restauration de CI doit échouer.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Set RestorePackagesWithLockFile to true and commit the generated packages.lock.json file", fr: "Définir RestorePackagesWithLockFile sur true et valider le fichier packages.lock.json généré" } }
    - { id: b, text: { en: "Move the package versions to a Directory.Packages.props file with ManagePackageVersionsCentrally", fr: "Déplacer les versions de packages dans un fichier Directory.Packages.props avec ManagePackageVersionsCentrally" } }
    - { id: c, text: { en: "Restore in the pipeline by running dotnet restore with the --locked-mode option", fr: "Restaurer dans le pipeline en exécutant dotnet restore avec l'option --locked-mode" } }
    - { id: d, text: { en: "Restore in the pipeline by running dotnet restore with the --no-cache option", fr: "Restaurer dans le pipeline en exécutant dotnet restore avec l'option --no-cache" } }
    - { id: e, text: { en: "Replace the version ranges with floating versions such as 6.*", fr: "Remplacer les plages de versions par des versions flottantes comme 6.*" } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |
      With RestorePackagesWithLockFile, restore writes packages.lock.json, which lists the whole package closure, direct and transitive. For an application at the start of the dependency chain, the lock file should be checked in. In locked mode (dotnet restore --locked-mode or RestoreLockedMode), restore uses exactly the locked versions and fails if the package references changed after the lock file was created.
    fr: |
      Avec RestorePackagesWithLockFile, la restauration écrit packages.lock.json, qui liste toute la fermeture des packages, directs et transitifs. Pour une application en début de chaîne de dépendances, le fichier de verrouillage doit être archivé dans le dépôt. En mode verrouillé (dotnet restore --locked-mode ou RestoreLockedMode), la restauration utilise exactement les versions verrouillées et échoue si les références de packages ont changé après la création du fichier.
  options:
    b: { en: "Central Package Management defines versions in one place but does not record the resolved transitive graph or fail on changes.", fr: "La gestion centralisée des packages définit les versions à un seul endroit, mais n'enregistre pas le graphe transitif résolu et n'échoue pas en cas de modification." }
    d: { en: "--no-cache only bypasses the HTTP cache; NuGet still resolves the ranges again.", fr: "--no-cache contourne seulement le cache HTTP ; NuGet résout toujours les plages à nouveau." }
    e: { en: "Floating versions pick the highest matching version at each restore, which makes restores less repeatable.", fr: "Les versions flottantes choisissent la version correspondante la plus élevée à chaque restauration, ce qui rend les restaurations moins reproductibles." }
references:
  - title: NuGet PackageReference in project files
    url: https://learn.microsoft.com/en-us/nuget/consume-packages/package-references-in-project-files
  - title: Central Package Management
    url: https://learn.microsoft.com/en-us/nuget/consume-packages/central-package-management
