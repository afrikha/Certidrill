id: az400-3a-feed-roles
objective: "3.1.2"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Litware has an Azure Artifacts feed named **shared** that has nuget.org as an upstream source. You need to grant feed roles to the following users and identities. Each must receive only the permissions it needs.

    Which role should you assign to each? To answer, drag the appropriate roles to the correct users or identities. Each role may be used once, more than once, or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware dispose d'un flux Azure Artifacts nommé **shared** qui a nuget.org comme source en amont. Vous devez accorder des rôles de flux aux utilisateurs et identités suivants. Chacun ne doit recevoir que les autorisations dont il a besoin.

    Quel rôle devez-vous attribuer à chacun ? Pour répondre, faites glisser les rôles appropriés vers les utilisateurs ou identités correspondants. Chaque rôle peut être utilisé une fois, plusieurs fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: true
  items:
    - { id: reader, text: Feed Reader }
    - { id: collab, text: Feed and Upstream Reader (Collaborator) }
    - { id: contrib, text: Feed Publisher (Contributor) }
    - { id: owner, text: Feed Owner }
  targets:
    - { id: dev, text: { en: "Developers who restore packages, including nuget.org packages that nobody has used through the feed yet", fr: "Les développeurs qui restaurent des packages, y compris des packages nuget.org que personne n'a encore utilisés via le flux" } }
    - { id: build, text: { en: "The Build Service identity of the pipeline that publishes new versions and promotes them to @Release", fr: "L'identité Build Service du pipeline qui publie de nouvelles versions et les promeut vers @Release" } }
    - { id: lead, text: { en: "The platform lead who adds and removes upstream sources", fr: "Le responsable de plateforme qui ajoute et supprime des sources en amont" } }
answer:
  mapping: { dev: collab, build: contrib, lead: owner }
explanation:
  correct:
    en: |
      A package is saved from an upstream source only when a user with Feed and Upstream Reader (Collaborator) or higher installs it; a Feed Reader can download only packages already saved in the feed. Feed Publisher (Contributor) adds publishing, promoting, deprecating and unlisting. Managing upstream sources and feed settings requires Feed Owner.
    fr: |
      Un package n'est enregistré depuis une source en amont que lorsqu'un utilisateur disposant de Feed and Upstream Reader (Collaborator) ou d'un rôle supérieur l'installe ; un Feed Reader ne peut télécharger que les packages déjà enregistrés dans le flux. Feed Publisher (Contributor) ajoute la publication, la promotion, la dépréciation et le retrait de la liste. La gestion des sources en amont et des paramètres du flux nécessite Feed Owner.
  options:
    reader: { en: "Feed Reader cannot save new packages from nuget.org, so restores of packages not yet in the feed fail.", fr: "Feed Reader ne peut pas enregistrer de nouveaux packages depuis nuget.org : les restaurations de packages absents du flux échouent." }
references:
  - title: Manage permissions
    url: https://learn.microsoft.com/en-us/azure/devops/artifacts/feeds/feed-permissions
  - title: Set up upstream sources for your feed
    url: https://learn.microsoft.com/en-us/azure/devops/artifacts/how-to/set-up-upstream-sources
