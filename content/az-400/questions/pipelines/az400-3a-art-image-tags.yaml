id: az400-3a-art-image-tags
objective: "3.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Contoso builds the container image of an API in Azure Pipelines and pushes it to an Azure container registry named **crcontoso**. The image is deployed to several hosts.

    You need to define a tagging strategy that meets the following requirements:

    - Every host runs the same image for a given deployment, even when new images are built.
    - Each deployed image can be traced to the logs of the pipeline run that built it.
    - Nobody can accidentally delete or overwrite a deployed image.

    What should you do?
  fr: |
    Contoso génère l'image conteneur d'une API dans Azure Pipelines et l'envoie vers un registre de conteneurs Azure nommé **crcontoso**. L'image est déployée sur plusieurs hôtes.

    Vous devez définir une stratégie de balises qui répond aux exigences suivantes :

    - Tous les hôtes exécutent la même image pour un déploiement donné, même quand de nouvelles images sont générées.
    - Chaque image déployée peut être rattachée aux journaux de l'exécution de pipeline qui l'a générée.
    - Personne ne peut supprimer ni remplacer par accident une image déployée.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Tag each image as latest, and set write-enabled to false on the latest tag", fr: "Baliser chaque image latest et définir write-enabled sur false sur la balise latest" } }
    - { id: b, text: { en: "Tag each image with a stable tag such as 2.5, and move the tag after each build", fr: "Baliser chaque image avec une balise stable comme 2.5 et déplacer la balise après chaque build" } }
    - { id: c, text: { en: "Tag each image with the Build.BuildId value, and set write-enabled to false on each deployed tag", fr: "Baliser chaque image avec la valeur de Build.BuildId et définir write-enabled sur false sur chaque balise déployée" } }
    - { id: d, text: { en: "Tag each image with the commit SHA, and enable a retention policy for untagged manifests", fr: "Baliser chaque image avec le SHA du commit et activer une stratégie de rétention pour les manifestes sans balise" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Deployments should use unique tags, which are never reused, so every host pulls the same image. A build ID tag is unique and traceable to the run, its artifacts and its logs. Setting write-enabled to false on a deployed tag (az acr repository update --write-enabled false) locks it against deletion and overwriting.
    fr: |
      Les déploiements doivent utiliser des balises uniques, jamais réutilisées, pour que tous les hôtes extraient la même image. Une balise d'ID de build est unique et traçable jusqu'à l'exécution, ses artefacts et ses journaux. Définir write-enabled sur false sur une balise déployée (az acr repository update --write-enabled false) la verrouille contre la suppression et le remplacement.
  options:
    a: { en: "latest is a stable tag that moves to each new image, so hosts can pull different images; a locked latest tag also blocks the next builds.", fr: "latest est une balise stable qui passe à chaque nouvelle image : les hôtes peuvent extraire des images différentes ; une balise latest verrouillée bloque en plus les builds suivantes." }
    b: { en: "Stable tags keep receiving updates, which is why they should not be used for deployments.", fr: "Les balises stables continuent de recevoir des mises à jour, c'est pourquoi il ne faut pas les utiliser pour les déploiements." }
    d: { en: "A commit SHA traces to source, not to the run logs, and rebuilding the same commit reuses the tag; a retention policy deletes images instead of protecting them.", fr: "Un SHA de commit renvoie au code source, pas aux journaux de l'exécution, et régénérer le même commit réutilise la balise ; une stratégie de rétention supprime des images au lieu de les protéger." }
references:
  - title: Image Tag Best Practices
    url: https://learn.microsoft.com/en-us/azure/container-registry/container-registry-image-tag-version
