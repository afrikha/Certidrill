id: az400-3c-matrix-capacity
objective: "3.3.6"
type: single
difficulty: 2
shuffle: false
status: draft
stem:
  en: |
    The Azure DevOps organization of Wingtip has two purchased Microsoft-hosted parallel jobs. A YAML pipeline contains the following job, which runs on Microsoft-hosted agents. No other pipeline is running.

    ```yaml
    jobs:
    - job: Test
      strategy:
        maxParallel: 3
        matrix:
          linux_net8:   { imageName: ubuntu-latest,  sdk: '8.0' }
          linux_net9:   { imageName: ubuntu-latest,  sdk: '9.0' }
          windows_net8: { imageName: windows-latest, sdk: '8.0' }
          windows_net9: { imageName: windows-latest, sdk: '9.0' }
          mac_net8:     { imageName: macOS-latest,   sdk: '8.0' }
          mac_net9:     { imageName: macOS-latest,   sdk: '9.0' }
      pool:
        vmImage: $(imageName)
      steps:
      - script: dotnet test
    ```

    How many matrix legs can run at the same time?
  fr: |
    L'organisation Azure DevOps de Wingtip dispose de deux travaux parallèles hébergés par Microsoft achetés. Un pipeline YAML contient le travail suivant, qui s'exécute sur des agents hébergés par Microsoft. Aucun autre pipeline n'est en cours d'exécution.

    ```yaml
    jobs:
    - job: Test
      strategy:
        maxParallel: 3
        matrix:
          linux_net8:   { imageName: ubuntu-latest,  sdk: '8.0' }
          linux_net9:   { imageName: ubuntu-latest,  sdk: '9.0' }
          windows_net8: { imageName: windows-latest, sdk: '8.0' }
          windows_net9: { imageName: windows-latest, sdk: '9.0' }
          mac_net8:     { imageName: macOS-latest,   sdk: '8.0' }
          mac_net9:     { imageName: macOS-latest,   sdk: '9.0' }
      pool:
        vmImage: $(imageName)
      steps:
      - script: dotnet test
    ```

    Combien de branches de la matrice peuvent s'exécuter en même temps ?
body:
  options:
    - { id: a, text: "1" }
    - { id: b, text: "2" }
    - { id: c, text: "3" }
    - { id: d, text: "6" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Each matrix leg is a separate job that needs one parallel job while it runs. maxParallel only sets an upper limit of three legs; the organization's two Microsoft-hosted parallel jobs are the real limit, so two legs run at a time and the others wait in the queue.
    fr: |
      Chaque branche de la matrice est un travail distinct qui consomme un travail parallèle pendant son exécution. maxParallel fixe seulement une limite haute de trois branches ; les deux travaux parallèles hébergés par Microsoft de l'organisation sont la vraie limite : deux branches s'exécutent à la fois et les autres attendent dans la file.
  options:
    a: { en: "One leg at a time would only apply with a single parallel job.", fr: "Une seule branche à la fois ne s'appliquerait qu'avec un seul travail parallèle." }
    c: { en: "maxParallel is a cap, not a guarantee: only two parallel jobs are available.", fr: "maxParallel est un plafond, pas une garantie : seuls deux travaux parallèles sont disponibles." }
    d: { en: "maxParallel limits the matrix to three legs, and the parallel jobs limit it further to two.", fr: "maxParallel limite la matrice à trois branches, et les travaux parallèles la limitent encore à deux." }
references:
  - title: Specify jobs in your pipeline
    url: https://learn.microsoft.com/en-us/azure/devops/pipelines/process/phases
  - title: Configure and pay for parallel jobs
    url: https://learn.microsoft.com/en-us/azure/devops/pipelines/licensing/concurrent-jobs
