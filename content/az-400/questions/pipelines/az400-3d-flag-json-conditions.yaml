id: az400-3d-flag-json-conditions
objective: "3.4.6"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    Northwind Traders is editing a feature flag named **QuickReorder** in Azure App Configuration by using **Advanced Edit**. The web app identifies each signed-in user and uses the .NET feature management library with targeting enabled.

    QuickReorder must meet the following requirements:

    - The feature is available only during the weekend promotion defined by the time window.
    - During the promotion, about 25 percent of the users get the feature, and each user always gets the same result.

    How should you complete the JSON? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind Traders modifie un indicateur de fonctionnalité nommé **QuickReorder** dans Azure App Configuration à l'aide de **Advanced Edit**. L'application web identifie chaque utilisateur connecté et utilise la bibliothèque de gestion des fonctionnalités .NET avec le ciblage activé.

    QuickReorder doit respecter les exigences suivantes :

    - La fonctionnalité n'est disponible que pendant la promotion du week-end définie par la fenêtre de temps.
    - Pendant la promotion, environ 25 pour cent des utilisateurs obtiennent la fonctionnalité, et chaque utilisateur obtient toujours le même résultat.

    Comment devez-vous compléter le JSON ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: json
  template: |
    {
      "id": "QuickReorder",
      "enabled": true,
      "conditions": {
        "requirement_type": "[[req]]",
        "client_filters": [
          {
            "name": "Microsoft.TimeWindow",
            "parameters": {
              "Start": "Sat, 05 Dec 2026 00:00:00 GMT",
              "End": "Mon, 07 Dec 2026 00:00:00 GMT"
            }
          },
          {
            "name": "[[filter]]",
            "parameters": {
              "Audience": {
                "Users": [],
                "Groups": [],
                "[[pct]]": 25
              }
            }
          }
        ]
      }
    }
  slots:
    - id: req
      options:
        - { id: rAny, text: Any }
        - { id: rAll, text: All }
    - id: filter
      options:
        - { id: fPercentage, text: Microsoft.Percentage }
        - { id: fTargeting, text: Microsoft.Targeting }
        - { id: fTime, text: Microsoft.TimeWindow }
    - id: pct
      options:
        - { id: pValue, text: Value }
        - { id: pRollout, text: RolloutPercentage }
        - { id: pDefault, text: DefaultRolloutPercentage }
answer:
  values: { req: rAll, filter: fTargeting, pct: pDefault }
explanation:
  correct:
    en: |
      With `requirement_type` set to `All`, the flag is on only when both filters pass: the time window and the targeting filter. The default, `Any`, would turn it on for everyone during the window. Microsoft.Targeting assigns users consistently, and its `DefaultRolloutPercentage` applies to every user who isn't listed in Users or in a group.
    fr: |
      Avec `requirement_type` défini sur `All`, l'indicateur n'est activé que si les deux filtres réussissent : la fenêtre de temps et le filtre de ciblage. La valeur par défaut, `Any`, l'activerait pour tout le monde pendant la fenêtre. Microsoft.Targeting attribue les utilisateurs de façon cohérente, et son `DefaultRolloutPercentage` s'applique à chaque utilisateur qui ne figure ni dans Users ni dans un groupe.
  options:
    rAny: { en: "With Any, one passing filter is enough, so the time window alone would enable the feature for all users.", fr: "Avec Any, un seul filtre satisfait suffit : la fenêtre de temps seule activerait la fonctionnalité pour tous les utilisateurs." }
    fPercentage: { en: "Microsoft.Percentage evaluates each request independently with a Value parameter, so a user doesn't always get the same result.", fr: "Microsoft.Percentage évalue chaque requête indépendamment avec un paramètre Value : un utilisateur n'obtient pas toujours le même résultat." }
    fTime: { en: "The time window is already the first filter; an Audience parameter belongs to the targeting filter.", fr: "La fenêtre de temps est déjà le premier filtre ; un paramètre Audience appartient au filtre de ciblage." }
    pValue: { en: "Value is the parameter of the percentage filter, not of an audience.", fr: "Value est le paramètre du filtre de pourcentage, pas d'une audience." }
    pRollout: { en: "RolloutPercentage is set on each entry of Groups, not on the audience itself.", fr: "RolloutPercentage se définit sur chaque entrée de Groups, pas sur l'audience elle-même." }
references:
  - title: .NET feature management
    url: https://learn.microsoft.com/en-us/azure/azure-app-configuration/feature-management-dotnet-reference
