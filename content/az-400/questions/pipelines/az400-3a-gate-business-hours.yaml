id: az400-3a-gate-business-hours
objective: "3.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Fabrikam deploys an order processing API by using a multi-stage YAML pipeline in Azure Pipelines. The Production stage targets an environment named **orders-prod**.

    Operations requires that deployments to orders-prod start only between 22:00 and 04:00 on weekdays, whatever the time a run is queued. Pipeline authors must not be able to remove this control by editing the YAML file.

    What should you configure?
  fr: |
    Fabrikam déploie une API de traitement des commandes avec un pipeline YAML multiphase dans Azure Pipelines. La phase Production cible un environnement nommé **orders-prod**.

    L'exploitation exige que les déploiements vers orders-prod ne démarrent qu'entre 22:00 et 04:00 en semaine, quelle que soit l'heure de mise en file d'une exécution. Les auteurs de pipelines ne doivent pas pouvoir supprimer ce contrôle en modifiant le fichier YAML.

    Que devez-vous configurer ?
body:
  options:
    - { id: a, text: { en: "A Business hours check on the orders-prod environment", fr: "Une vérification Business hours sur l'environnement orders-prod" } }
    - { id: b, text: { en: "A scheduled trigger in the YAML file that runs at 22:00 on weekdays", fr: "Un déclencheur planifié dans le fichier YAML qui s'exécute à 22:00 en semaine" } }
    - { id: c, text: { en: "A condition on the Production stage that compares the current time", fr: "Une condition sur la phase Production qui compare l'heure actuelle" } }
    - { id: d, text: { en: "An Exclusive lock check on the orders-prod environment", fr: "Une vérification Exclusive lock sur l'environnement orders-prod" } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      The Business hours check lets deployments to an environment happen only in a defined time window; a stage that reaches the environment outside the window is held until the window opens, or fails if the check times out first. Checks are configured on the resource, not in the YAML file, so pipeline authors cannot remove them.
    fr: |
      La vérification Business hours n'autorise les déploiements vers un environnement que dans une plage horaire définie ; une phase qui atteint l'environnement hors de cette plage est retenue jusqu'à l'ouverture de la plage, ou échoue si le délai d'expiration de la vérification est atteint avant. Les vérifications sont configurées sur la ressource, pas dans le fichier YAML : les auteurs de pipelines ne peuvent pas les supprimer.
  options:
    b: { en: "A scheduled trigger starts runs at a time but does not stop runs queued at other times, and authors can edit it in the YAML file.", fr: "Un déclencheur planifié démarre des exécutions à une heure donnée, mais n'empêche pas les exécutions mises en file à d'autres heures, et les auteurs peuvent le modifier dans le YAML." }
    c: { en: "A stage condition lives in the YAML file, so any author can remove it.", fr: "Une condition de phase se trouve dans le fichier YAML : n'importe quel auteur peut la supprimer." }
    d: { en: "Exclusive lock allows only one run at a time on the resource; it does not restrict when deployments start.", fr: "Exclusive lock n'autorise qu'une exécution à la fois sur la ressource ; il ne restreint pas l'heure de démarrage des déploiements." }
references:
  - title: Define approvals and checks
    url: https://learn.microsoft.com/en-us/azure/devops/pipelines/process/approvals
