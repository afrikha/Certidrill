id: az400-3a-ver-precedence
objective: "3.1.3"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Litware publishes NuGet packages that follow Semantic Versioning 2.0.0, including prerelease labels and build metadata. Consumers restore them with a current version of the .NET SDK.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware publie des packages NuGet qui suivent Semantic Versioning 2.0.0, y compris les étiquettes de préversion et les métadonnées de build. Les consommateurs les restaurent avec une version actuelle du SDK .NET.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          When NuGet resolves dependencies, version 3.1.0+build.981 is treated as 3.1.0.
        fr: |
          Lors de la résolution des dépendances, NuGet traite la version 3.1.0+build.981 comme 3.1.0.
    - id: s2
      text:
        en: |
          Version 3.1.0-rc.10 has a higher precedence than version 3.1.0-rc.2.
        fr: |
          La version 3.1.0-rc.10 a une priorité plus élevée que la version 3.1.0-rc.2.
    - id: s3
      text:
        en: |
          Version 3.1.0-beta has a higher precedence than version 3.1.0.
        fr: |
          La version 3.1.0-beta a une priorité plus élevée que la version 3.1.0.
answer:
  values: { s1: true, s2: true, s3: false }
explanation:
  correct:
    en: |
      NuGet removes SemVer 2.0.0 build metadata when it matches versions, so 3.1.0+build.981 behaves as 3.1.0. Dot-separated numeric identifiers in a prerelease label are compared numerically, so rc.10 is higher than rc.2. A version without a prerelease suffix always has a higher precedence than the same version with a suffix.
    fr: |
      NuGet supprime les métadonnées de build SemVer 2.0.0 lorsqu'il compare des versions : 3.1.0+build.981 se comporte comme 3.1.0. Les identifiants numériques séparés par des points dans une étiquette de préversion sont comparés numériquement : rc.10 est supérieur à rc.2. Une version sans suffixe de préversion a toujours une priorité plus élevée que la même version avec un suffixe.
references:
  - title: Package versioning
    url: https://learn.microsoft.com/en-us/nuget/concepts/package-versioning
