id: az400-3d-flag-filter-choice
objective: "3.4.6"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Adatum manages the feature flags of a web app in Azure App Configuration. The app uses the .NET feature management library with targeting enabled, and it identifies signed-in users.

    You need to configure four flags to meet the requirements below.

    What should you configure for each flag? To answer, drag the appropriate configurations to the correct flags. Each configuration may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum gère les indicateurs de fonctionnalités d'une application web dans Azure App Configuration. L'application utilise la bibliothèque de gestion des fonctionnalités .NET avec le ciblage activé, et elle identifie les utilisateurs connectés.

    Vous devez configurer quatre indicateurs pour respecter les exigences ci-dessous.

    Que devez-vous configurer pour chaque indicateur ? Pour répondre, faites glisser les configurations appropriées vers les indicateurs correspondants. Chaque configuration peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: time, text: { en: "Microsoft.TimeWindow filter", fr: "Filtre Microsoft.TimeWindow" } }
    - { id: percentage, text: { en: "Microsoft.Percentage filter", fr: "Filtre Microsoft.Percentage" } }
    - { id: targeting, text: { en: "Microsoft.Targeting filter", fr: "Filtre Microsoft.Targeting" } }
    - { id: none, text: { en: "No filter, only the Enabled state", fr: "Aucun filtre, uniquement l'état Enabled" } }
    - { id: variants, text: { en: "Variants with a default allocation", fr: "Variantes avec une allocation par défaut" } }
  targets:
    - id: t1
      text: { en: "Maintenance banner: shown to every user, turned on and off by the operations team", fr: "Bannière de maintenance : affichée à tous les utilisateurs, activée et désactivée par l'équipe d'exploitation" }
    - id: t2
      text: { en: "Holiday theme: turned on automatically on 20 December at 06:00 and off on 3 January at 00:00", fr: "Thème des fêtes : activé automatiquement le 20 décembre à 06:00 et désactivé le 3 janvier à 00:00" }
    - id: t3
      text: { en: "New search: enabled for the users in the BetaTesters group and for 10 percent of the other users, consistently", fr: "Nouvelle recherche : activée pour les utilisateurs du groupe BetaTesters et pour 10 pour cent des autres utilisateurs, de façon cohérente" }
    - id: t4
      text: { en: "Image compression: enabled at random for 30 percent of the requests to a background API that has no user identity", fr: "Compression d'images : activée aléatoirement pour 30 pour cent des requêtes vers une API d'arrière-plan sans identité utilisateur" }
answer:
  mapping: { t1: none, t2: time, t3: targeting, t4: percentage }
explanation:
  correct:
    en: |
      A switch flag with no filter is on for everyone while it is enabled. The time window filter turns a flag on between a start and an end time. The targeting filter combines groups and a default rollout percentage and assigns each user consistently. The percentage filter evaluates each request independently, which suits a caller without a user identity.
    fr: |
      Un indicateur de type Switch sans filtre est activé pour tout le monde tant qu'il est activé. Le filtre de fenêtre de temps active un indicateur entre une heure de début et une heure de fin. Le filtre de ciblage combine des groupes et un pourcentage de déploiement par défaut, et attribue chaque utilisateur de façon cohérente. Le filtre de pourcentage évalue chaque requête indépendamment, ce qui convient à un appelant sans identité utilisateur.
  options:
    variants: { en: "Variants return different configurations for an experiment; none of these flags needs more than on or off.", fr: "Les variantes renvoient des configurations différentes pour une expérimentation ; aucun de ces indicateurs n'a besoin de plus qu'activé ou désactivé." }
references:
  - title: .NET feature management
    url: https://learn.microsoft.com/en-us/azure/azure-app-configuration/feature-management-dotnet-reference
  - title: Enable features on a schedule
    url: https://learn.microsoft.com/en-us/azure/azure-app-configuration/howto-timewindow-filter
