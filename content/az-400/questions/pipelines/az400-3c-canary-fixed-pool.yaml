id: az400-3c-canary-fixed-pool
objective: "3.4.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Adatum's web application runs on 20 virtual machines behind Azure Load Balancer. The next release upgrades the .NET runtime of the application, so the change can't be wrapped in a feature flag. There is no budget for additional virtual machines, even temporarily.

    You need to validate the new version with real production traffic on a small part of the capacity, and stop the rollout if the error rate rises, before the other servers are changed.

    Which strategy should you use?
  fr: |
    L'application web d'Adatum s'exécute sur 20 machines virtuelles derrière Azure Load Balancer. La prochaine mise en production met à niveau le runtime .NET de l'application : la modification ne peut donc pas être encapsulée dans un indicateur de fonctionnalité. Aucun budget n'est prévu pour des machines virtuelles supplémentaires, même temporairement.

    Vous devez valider la nouvelle version avec du trafic de production réel sur une petite partie de la capacité, et arrêter le déploiement si le taux d'erreur augmente, avant que les autres serveurs soient modifiés.

    Quelle stratégie devez-vous utiliser ?
body:
  options:
    - { id: a, text: { en: "A blue-green deployment to a second pool of 20 virtual machines", fr: "Un déploiement bleu/vert vers un second pool de 20 machines virtuelles" } }
    - { id: b, text: { en: "A/B testing of the two runtime versions on half of the servers each", fr: "Des tests A/B des deux versions du runtime sur la moitié des serveurs chacune" } }
    - { id: c, text: { en: "A canary release on two of the existing servers, then wider batches", fr: "Une mise en production canari sur deux des serveurs existants, puis par lots plus larges" } }
    - { id: d, text: { en: "Feature flags with a targeting filter set to 10 percent of the users", fr: "Des indicateurs de fonctionnalités avec un filtre de ciblage réglé sur 10 % des utilisateurs" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      A canary release updates a small subset of the existing servers, so a small share of real traffic reaches the new version. The team watches the health metrics and widens the rollout only if they stay green, which limits the blast radius without extra capacity.
    fr: |
      Une mise en production canari met à jour un petit sous-ensemble des serveurs existants : une petite part du trafic réel atteint la nouvelle version. L'équipe surveille les métriques d'intégrité et n'élargit le déploiement que si elles restent bonnes, ce qui limite le rayon d'impact sans capacité supplémentaire.
  options:
    a: { en: "Blue-green needs a second full environment, which the budget doesn't allow.", fr: "Le bleu/vert exige un second environnement complet, ce que le budget ne permet pas." }
    b: { en: "A/B testing compares two variants on a business metric and exposes half of the traffic, not a small part.", fr: "Les tests A/B comparent deux variantes sur un indicateur métier et exposent la moitié du trafic, pas une petite partie." }
    d: { en: "A runtime upgrade can't be wrapped in a feature flag, as stated.", fr: "Une mise à niveau du runtime ne peut pas être encapsulée dans un indicateur de fonctionnalité, comme indiqué." }
references:
  - title: Architecture strategies for safe deployment practices
    url: https://learn.microsoft.com/en-us/azure/well-architected/operational-excellence/safe-deployments
  - title: What is continuous delivery?
    url: https://learn.microsoft.com/en-us/devops/deliver/what-is-continuous-delivery
