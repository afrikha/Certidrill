id: az400-3c-gh-needs-matrix
objective: "3.3.6"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam builds a library with a GitHub Actions workflow that contains the jobs **build** and **test** and a matrix job that runs the tests on three operating systems. No job sets a `strategy.fail-fast` value.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam génère une bibliothèque avec un workflow GitHub Actions qui contient les jobs **build** et **test** ainsi qu'un job de matrice qui exécute les tests sur trois systèmes d'exploitation. Aucun job ne définit de valeur `strategy.fail-fast`.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          Jobs that have no `needs` key start in parallel when runners are available.
        fr: |
          Les jobs qui n'ont pas de clé `needs` démarrent en parallèle lorsque des exécuteurs sont disponibles.
    - id: s2
      text:
        en: |
          When one job of the matrix fails, the other in-progress jobs of the matrix keep running.
        fr: |
          Quand un job de la matrice échoue, les autres jobs en cours de la matrice continuent de s'exécuter.
    - id: s3
      text:
        en: |
          A job that has `needs: [build, test]` and `if: ${{ always() }}` runs even if job test fails.
        fr: |
          Un job qui a `needs: [build, test]` et `if: ${{ always() }}` s'exécute même si le job test échoue.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |
      GitHub Actions runs jobs in parallel by default; `needs` creates dependencies. `fail-fast` defaults to true, so a failing matrix job cancels the other in-progress and queued jobs of the matrix. A job whose needed job failed is skipped unless its `if` uses a status function such as `always()`.
    fr: |
      GitHub Actions exécute les jobs en parallèle par défaut ; `needs` crée des dépendances. `fail-fast` vaut true par défaut : un job de matrice en échec annule les autres jobs en cours et en file d'attente de la matrice. Un job dont un job requis a échoué est ignoré, sauf si son `if` utilise une fonction d'état comme `always()`.
references:
  - title: Workflow syntax for GitHub Actions
    url: https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax
