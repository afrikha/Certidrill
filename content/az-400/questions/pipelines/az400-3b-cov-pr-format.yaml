id: az400-3b-cov-pr-format
objective: "3.2.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Fabrikam hosts a .NET repository in Azure Repos. A build validation branch policy on main runs the following pipeline on Microsoft-hosted windows-latest agents for every pull request.

    ```yaml
    steps:
      - task: DotNetCoreCLI@2
        inputs:
          command: test
          projects: '**/*Tests.csproj'
          arguments: '--collect "XPlat Code Coverage"'
      - task: PublishCodeCoverageResults@2
        inputs:
          summaryFileLocation: '$(Agent.TempDirectory)/**/coverage.cobertura.xml'
    ```

    The **Code Coverage** tab of each run shows a report, but no code coverage status is posted on the pull requests.

    You need the diff coverage status to be posted on pull requests. What should you do?
  fr: |
    Fabrikam héberge un dépôt .NET dans Azure Repos. Une stratégie de branche de validation de build sur main exécute le pipeline suivant sur des agents windows-latest hébergés par Microsoft pour chaque pull request.

    ```yaml
    steps:
      - task: DotNetCoreCLI@2
        inputs:
          command: test
          projects: '**/*Tests.csproj'
          arguments: '--collect "XPlat Code Coverage"'
      - task: PublishCodeCoverageResults@2
        inputs:
          summaryFileLocation: '$(Agent.TempDirectory)/**/coverage.cobertura.xml'
    ```

    L'onglet **Code Coverage** de chaque exécution affiche un rapport, mais aucun état de couverture du code n'est publié sur les pull requests.

    Vous devez faire en sorte que l'état de couverture différentielle (diff coverage) soit publié sur les pull requests. Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Change the test arguments to `--collect \"Code Coverage\"` so that the coverage is collected in the `.coverage` format.", fr: "Remplacer les arguments de test par `--collect \"Code Coverage\"` pour que la couverture soit collectée au format `.coverage`." } }
    - { id: b, text: { en: "Add an azurepipelines-coverage.yml file to the repository that sets a diff coverage target of 70%.", fr: "Ajouter au dépôt un fichier azurepipelines-coverage.yml qui définit une cible de couverture différentielle de 70 %." } }
    - { id: c, text: { en: "Add a status check branch policy on main that requires the codecoverage status of the pipeline.", fr: "Ajouter sur main une stratégie de branche de vérification d'état qui exige l'état codecoverage du pipeline." } }
    - { id: d, text: { en: "Set `failIfCoverageEmpty: true` in the inputs of the PublishCodeCoverageResults@2 task.", fr: "Définir `failIfCoverageEmpty: true` dans les entrées de la tâche PublishCodeCoverageResults@2." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      PublishCodeCoverageResults@2 can display Cobertura reports, but Learn states that only the Visual Studio code coverage format (`.coverage`) can currently be used to validate coverage on pull requests. Collecting coverage with the Microsoft `Code Coverage` collector of `dotnet test` produces that format, and the diff coverage status is then posted on the pull requests that the build validation policy runs for.
    fr: |
      PublishCodeCoverageResults@2 sait afficher des rapports Cobertura, mais Learn indique que seul le format de couverture du code Visual Studio (`.coverage`) permet actuellement de valider la couverture sur les pull requests. La collecte avec le collecteur Microsoft `Code Coverage` de `dotnet test` produit ce format, et l'état de couverture différentielle est alors publié sur les pull requests pour lesquelles la stratégie de validation de build s'exécute.
  options:
    b: { en: "70% is already the default target; the file changes thresholds but not the supported format.", fr: "70 % est déjà la cible par défaut ; le fichier modifie les seuils, pas le format pris en charge." }
    c: { en: "A status check policy can only evaluate a status that is posted; none is posted yet.", fr: "Une stratégie de vérification d'état ne peut évaluer qu'un état publié ; aucun ne l'est encore." }
    d: { en: "failIfCoverageEmpty fails the task when no coverage is found; the report already exists.", fr: "failIfCoverageEmpty fait échouer la tâche quand aucune couverture n'est trouvée ; le rapport existe déjà." }
references:
  - title: Review and configure code coverage results in Azure Pipelines
    url: https://learn.microsoft.com/en-us/azure/devops/pipelines/test/codecoverage-for-pullrequests
