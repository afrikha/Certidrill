id: az400-3b-gh-fork-comment
objective: "3.3.3"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Adatum's Azure Pipelines YAML pipeline builds a public GitHub repository through the Azure Pipelines GitHub App, and building pull requests from forks is enabled.

    You need to meet the following requirements:

    - Pull requests from members of the team are built automatically.
    - Pull requests from outside contributors are built only after a maintainer reviews the change and requests a build in a comment.

    How should you complete the configuration? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Le pipeline YAML Azure Pipelines d'Adatum génère un dépôt GitHub public par l'application GitHub Azure Pipelines, et la génération des pull requests issues de duplications est activée.

    Vous devez satisfaire les exigences suivantes :

    - Les pull requests des membres de l'équipe sont générées automatiquement.
    - Les pull requests des contributeurs externes ne sont générées qu'après qu'un mainteneur a examiné la modification et demandé une build dans un commentaire.

    Comment devez-vous compléter la configuration ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      In the **Triggers** settings of the pipeline, under **Pull request validation**, enable [[setting]] and select [[scope]].

      After reviewing a contributor's change, a maintainer who has the [[perm]] permission on the repository comments `/azp run` on the pull request.
    fr: |
      Dans les paramètres **Triggers** du pipeline, sous **Pull request validation**, activez [[setting]] et sélectionnez [[scope]].

      Après avoir examiné la modification d'un contributeur, un mainteneur qui dispose de l'autorisation [[perm]] sur le dépôt commente `/azp run` sur la pull request.
  slots:
    - id: setting
      options:
        - { id: secrets, text: "Make secrets available to builds of forks" }
        - { id: comment, text: "Require a team member's comment before building a pull request" }
        - { id: perms, text: "Make fork builds have the same permissions as regular builds" }
    - id: scope
      options:
        - { id: all, text: "On all pull requests" }
        - { id: nonteam, text: "Only on pull requests from non-team members" }
    - id: perm
      options:
        - { id: read, text: Read }
        - { id: triage, text: Triage }
        - { id: write, text: Write }
answer:
  values: { setting: comment, scope: nonteam, perm: write }
explanation:
  correct:
    en: |
      **Require a team member's comment before building a pull request** holds pull request builds until a team member comments. Its **Only on pull requests from non-team members** option lets team members' pull requests build automatically. Only repository owners and collaborators with Write permission can trigger builds by commenting `/azp run`, the shorthand of `/AzurePipelines run`.
    fr: |
      **Require a team member's comment before building a pull request** retient les builds de pull request jusqu'au commentaire d'un membre de l'équipe. Son option **Only on pull requests from non-team members** laisse les pull requests des membres de l'équipe se générer automatiquement. Seuls les propriétaires du dépôt et les collaborateurs disposant de l'autorisation Write peuvent déclencher des builds en commentant `/azp run`, le raccourci de `/AzurePipelines run`.
  options:
    secrets: { en: "This setting exposes secrets to fork builds; it doesn't hold builds until a comment.", fr: "Ce paramètre expose les secrets aux builds de duplications ; il ne retient pas les builds jusqu'à un commentaire." }
    perms: { en: "This setting gives fork builds the regular token permissions; it doesn't require a comment.", fr: "Ce paramètre donne aux builds de duplications les autorisations normales du jeton ; il n'exige pas de commentaire." }
    all: { en: "Team members' pull requests would also wait for a comment.", fr: "Les pull requests des membres de l'équipe attendraient elles aussi un commentaire." }
    read: { en: "Users with Read permission can't trigger builds by commenting.", fr: "Les utilisateurs disposant de l'autorisation Read ne peuvent pas déclencher de build par un commentaire." }
    triage: { en: "Triage is below Write; comment triggers require Write.", fr: "Triage est inférieur à Write ; les déclencheurs par commentaire exigent Write." }
references:
  - title: Build GitHub repositories
    url: https://learn.microsoft.com/en-us/azure/devops/pipelines/repos/github
