id: az400-3b-cov-xplat
objective: "3.2.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso builds a .NET 8 API with an Azure Pipelines YAML pipeline that runs on Microsoft-hosted ubuntu-latest agents. The test project references the coverlet.collector NuGet package.

    A third-party quality tool requires a code coverage report in the Cobertura XML format.

    Which argument should you add to the `dotnet test` command?
  fr: |
    Contoso génère une API .NET 8 avec un pipeline YAML Azure Pipelines qui s'exécute sur des agents ubuntu-latest hébergés par Microsoft. Le projet de test référence le package NuGet coverlet.collector.

    Un outil de qualité tiers exige un rapport de couverture du code au format XML Cobertura.

    Quel argument devez-vous ajouter à la commande `dotnet test` ?
body:
  options:
    - { id: a, text: "`--logger trx`" }
    - { id: b, text: "`--collect \"Code Coverage\"`" }
    - { id: c, text: "`--blame-hang-timeout 10m`" }
    - { id: d, text: "`--collect \"XPlat Code Coverage\"`" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      The `XPlat Code Coverage` data collector is provided by coverlet.collector and writes a coverage.cobertura.xml file for each test project, which you can then publish with PublishCodeCoverageResults@2 or pass to another tool. No extra run settings are needed to get the Cobertura format.
    fr: |
      Le collecteur de données `XPlat Code Coverage` est fourni par coverlet.collector et écrit un fichier coverage.cobertura.xml pour chaque projet de test, que vous pouvez ensuite publier avec PublishCodeCoverageResults@2 ou transmettre à un autre outil. Aucun paramètre d'exécution supplémentaire n'est nécessaire pour obtenir le format Cobertura.
  options:
    a: { en: "The trx logger writes test results, not code coverage.", fr: "Le journaliseur trx écrit des résultats de test, pas la couverture du code." }
    b: { en: "The Microsoft code coverage collector writes a binary .coverage file by default, not Cobertura XML.", fr: "Le collecteur de couverture du code Microsoft écrit par défaut un fichier binaire .coverage, pas du XML Cobertura." }
    c: { en: "The blame options collect diagnostics for hanging tests.", fr: "Les options blame collectent des diagnostics pour les tests bloqués." }
references:
  - title: Build, test, and deploy .NET Core projects
    url: https://learn.microsoft.com/en-us/azure/devops/pipelines/ecosystems/dotnet-core
