id: az400-3f-shallow-fetch
objective: "3.6.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso has an Azure Repos Git repository named **erp** with 12 years of history. The YAML pipeline **erp-ci** runs on Microsoft-hosted agents, and the checkout step alone takes six minutes because it downloads the full history.

    The build only needs the files of the commit being built. You need to minimize the checkout time.

    What should you add to the checkout step?
  fr: |
    Contoso dispose d'un dépôt Git Azure Repos nommé **erp** avec 12 ans d'historique. Le pipeline YAML **erp-ci** s'exécute sur des agents hébergés par Microsoft, et l'étape d'extraction prend à elle seule six minutes, car elle télécharge tout l'historique.

    Le build n'a besoin que des fichiers du commit généré. Vous devez réduire au minimum la durée de l'extraction.

    Que devez-vous ajouter à l'étape d'extraction ?
body:
  options:
    - { id: a, text: "fetchDepth: 0" }
    - { id: b, text: "clean: true" }
    - { id: c, text: "persistCredentials: true" }
    - { id: d, text: "fetchDepth: 1" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      fetchDepth limits the depth of the Git graph that the agent fetches, so fetchDepth set to 1 downloads only the latest commit (a shallow fetch). An explicit fetchDepth in the checkout step overrides the Shallow fetch setting of the pipeline UI.
    fr: |
      fetchDepth limite la profondeur du graphe Git récupéré par l'agent ; fetchDepth défini sur 1 ne télécharge donc que le dernier commit (extraction superficielle). Un fetchDepth explicite dans l'étape d'extraction remplace le paramètre Shallow fetch de l'interface du pipeline.
  options:
    a: { en: "fetchDepth: 0 fetches the entire history, which is the current slow behavior.", fr: "fetchDepth: 0 récupère tout l'historique, ce qui correspond au comportement lent actuel." }
    b: { en: "clean runs git clean and git reset before fetching; it does not reduce the history downloaded.", fr: "clean exécute git clean et git reset avant la récupération ; il ne réduit pas l'historique téléchargé." }
    c: { en: "persistCredentials keeps the OAuth token in the Git config for later Git commands; it does not change what is fetched.", fr: "persistCredentials conserve le jeton OAuth dans la configuration Git pour les commandes Git suivantes ; il ne change pas ce qui est récupéré." }
references:
  - title: steps.checkout definition
    url: https://learn.microsoft.com/en-us/azure/devops/pipelines/yaml-schema/steps-checkout
