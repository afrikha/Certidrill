id: az400-3a-ver-semver-changes
objective: "3.1.3"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Tailspin publishes a NuGet library named **Tailspin.Routing** by using semantic versioning. The current stable version is **2.4.1**. The next release can contain one of the following changes.

    Which version should Tailspin publish for each change? To answer, drag the appropriate versions to the correct changes. Each version may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin publie une bibliothèque NuGet nommée **Tailspin.Routing** en utilisant le versionnement sémantique. La version stable actuelle est **2.4.1**. La prochaine version peut contenir l'une des modifications suivantes.

    Quelle version Tailspin doit-il publier pour chaque modification ? Pour répondre, faites glisser les versions appropriées vers les modifications correspondantes. Chaque version peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: v242, text: "2.4.2" }
    - { id: v250, text: "2.5.0" }
    - { id: v300, text: "3.0.0" }
    - { id: v300b, text: "3.0.0-beta.1" }
    - { id: v241m, text: "2.4.1+fix.1" }
  targets:
    - { id: fix, text: { en: "A backward-compatible fix of a null reference bug", fr: "Une correction rétrocompatible d'un bogue de référence null" } }
    - { id: feat, text: { en: "A new optional overload of a public method, released as stable", fr: "Une nouvelle surcharge facultative d'une méthode publique, publiée en stable" } }
    - { id: break, text: { en: "A public method is removed, released as stable", fr: "Une méthode publique est supprimée, publiée en stable" } }
    - { id: preview, text: { en: "The same removal, offered first to early adopters for feedback", fr: "La même suppression, proposée d'abord à des utilisateurs pionniers pour recueillir leurs retours" } }
answer:
  mapping: { fix: v242, feat: v250, break: v300, preview: v300b }
explanation:
  correct:
    en: |
      A backward-compatible fix increments PATCH (2.4.2), a backward-compatible feature increments MINOR and resets PATCH (2.5.0), and a breaking change increments MAJOR and resets the others (3.0.0). A prerelease label after a hyphen, such as 3.0.0-beta.1, marks an unstable version that sorts before 3.0.0. Build metadata after a plus sign (2.4.1+fix.1) is ignored for precedence, so it would look like the existing 2.4.1.
    fr: |
      Une correction rétrocompatible incrémente PATCH (2.4.2), une fonctionnalité rétrocompatible incrémente MINOR et remet PATCH à zéro (2.5.0), et une modification cassante incrémente MAJOR et remet les autres à zéro (3.0.0). Une étiquette de préversion après un trait d'union, comme 3.0.0-beta.1, marque une version instable classée avant 3.0.0. Les métadonnées de build après un signe plus (2.4.1+fix.1) sont ignorées pour la priorité : la version serait vue comme l'actuelle 2.4.1.
references:
  - title: Explore semantic versioning
    url: https://learn.microsoft.com/en-us/training/modules/implement-versioning-strategy/3-explore-semantic-versioning
  - title: Package versioning
    url: https://learn.microsoft.com/en-us/nuget/concepts/package-versioning
