id: az400-cs4a-agent-pool
objective: "3.3.2"
type: single
caseStudy: az400-cs4a-humongous-insurance
difficulty: 3
status: draft
stem:
  en: |
    You need to provide agents for the jobs of the new YAML pipeline that deploy the DACPAC. The solution must meet the pipeline and agent requirements. What should you do?
  fr: |
    Vous devez fournir des agents aux travaux du nouveau pipeline YAML qui déploient le DACPAC. La solution doit respecter les exigences relatives aux pipelines et aux agents. Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Keep the Microsoft-hosted agents and add a server firewall rule on sql-claims-prod for their IP address ranges.", fr: "Conserver les agents hébergés par Microsoft et ajouter sur sql-claims-prod une règle de pare-feu de serveur pour leurs plages d'adresses IP." } }
    - { id: b, text: { en: "Deploy two Azure virtual machines in snet-build and install the Azure Pipelines agent on each of them.", fr: "Déployer deux machines virtuelles Azure dans snet-build et installer l'agent Azure Pipelines sur chacune d'elles." } }
    - { id: c, text: { en: "Create a Managed DevOps Pool that injects its agents into snet-build and uses an Azure Pipelines image.", fr: "Créer un pool Managed DevOps Pools qui injecte ses agents dans snet-build et utilise une image Azure Pipelines." } }
    - { id: d, text: { en: "Create a virtual machine scale set from a custom image in snet-build and register it as a scale set agent pool.", fr: "Créer un groupe de machines virtuelles identiques à partir d'une image personnalisée dans snet-build et l'inscrire comme pool d'agents de groupe identique." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Managed DevOps Pools runs agents on virtual machines that the service manages, and it can inject them into a subnet of your virtual network (delegated to Microsoft.DevOpsInfrastructure/pools), so the agents reach resources isolated behind private endpoints. With an Azure Pipelines image, the agents have the same software as Microsoft-hosted agents and the team does not maintain the image or the VMs.
    fr: |
      Managed DevOps Pools exécute les agents sur des machines virtuelles gérées par le service et peut les injecter dans un sous-réseau de votre réseau virtuel (délégué à Microsoft.DevOpsInfrastructure/pools) : les agents joignent ainsi les ressources isolées derrière des points de terminaison privés. Avec une image Azure Pipelines, les agents disposent des mêmes logiciels que les agents hébergés par Microsoft, et l'équipe ne maintient ni l'image ni les machines virtuelles.
  options:
    a:
      en: |
        Public network access is disabled on sql-claims-prod, so a firewall rule does not let Microsoft-hosted agents connect; they cannot reach the private endpoint either.
      fr: |
        L'accès au réseau public est désactivé sur sql-claims-prod ; une règle de pare-feu ne permet donc pas aux agents hébergés par Microsoft de se connecter, et ils ne peuvent pas non plus joindre le point de terminaison privé.
    b:
      en: |
        Self-hosted agents in snet-build reach the private endpoint, but the platform team would have to patch and maintain the virtual machines, which requirement 2 forbids.
      fr: |
        Des agents auto-hébergés dans snet-build joignent le point de terminaison privé, mais l'équipe plateforme devrait corriger et maintenir les machines virtuelles, ce que l'exigence 2 interdit.
    d:
      en: |
        A scale set agent pool runs in your subscription from an image that you build and update yourself, so the team would still maintain the operating system image.
      fr: |
        Un pool d'agents de groupe identique s'exécute dans votre abonnement à partir d'une image que vous créez et mettez à jour vous-même : l'équipe maintiendrait donc toujours l'image du système d'exploitation.
references:
  - title: Configure networking
    url: https://learn.microsoft.com/en-us/azure/devops/managed-devops-pools/configure-networking
