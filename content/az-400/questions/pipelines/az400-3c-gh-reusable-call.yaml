id: az400-3c-gh-reusable-call
objective: "3.3.8"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Contoso's GitHub organization has a private repository named **contoso/platform-workflows** whose workflows can be used by the other repositories of the organization. Its workflow **deploy.yml** must be reusable, and its release is tagged **v2**. The repository **contoso/web** must call deploy.yml, pass the input environment with the value staging, and pass all the secrets that the caller can access without listing them.

    How should you complete the two workflows? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    L'organisation GitHub de Contoso possède un dépôt privé nommé **contoso/platform-workflows** dont les workflows sont utilisables par les autres dépôts de l'organisation. Son workflow **deploy.yml** doit être réutilisable, et sa version est balisée **v2**. Le dépôt **contoso/web** doit appeler deploy.yml, transmettre l'entrée environment avec la valeur staging, et transmettre tous les secrets auxquels l'appelant a accès sans les énumérer.

    Comment devez-vous compléter les deux workflows ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: yaml
  template: |
    # contoso/platform-workflows/.github/workflows/deploy.yml
    on:
      [[s3]]:
        inputs:
          environment:
            type: string
            required: true

    # contoso/web/.github/workflows/release.yml
    jobs:
      deploy:
        uses: [[s1]]
        with:
          environment: staging
        secrets: [[s2]]
  slots:
    - id: s1
      options:
        - { id: fullpath, text: contoso/platform-workflows/.github/workflows/deploy.yml@v2 }
        - { id: shortpath, text: contoso/platform-workflows/deploy.yml@v2 }
        - { id: refstags, text: contoso/platform-workflows/.github/workflows/deploy.yml@refs/tags/v2 }
        - { id: localpath, text: ./.github/workflows/deploy.yml@v2 }
    - id: s2
      options:
        - { id: inherit, text: inherit }
        - { id: all, text: all }
        - { id: ctx, text: "${{ secrets }}" }
    - id: s3
      options:
        - { id: wfcall, text: workflow_call }
        - { id: wfdispatch, text: workflow_dispatch }
        - { id: wfrun, text: workflow_run }
        - { id: repodispatch, text: repository_dispatch }
answer:
  values: { s1: fullpath, s2: inherit, s3: wfcall }
explanation:
  correct:
    en: |
      A reusable workflow is triggered by `workflow_call`, which declares its inputs. A job in another repository calls it with `{owner}/{repo}/.github/workflows/{filename}@{ref}`, where the ref is a tag, branch or SHA without the refs/ prefix. `secrets: inherit` passes all the secrets the caller can access within the same organization.
    fr: |
      Un workflow réutilisable est déclenché par `workflow_call`, qui déclare ses entrées. Un job d'un autre dépôt l'appelle avec `{owner}/{repo}/.github/workflows/{filename}@{ref}`, où la référence est une balise, une branche ou un SHA sans le préfixe refs/. `secrets: inherit` transmet tous les secrets accessibles à l'appelant au sein de la même organisation.
  options:
    shortpath: { en: "The path must include the .github/workflows directory.", fr: "Le chemin doit inclure le répertoire .github/workflows." }
    refstags: { en: "The refs/heads and refs/tags prefixes aren't allowed in uses.", fr: "Les préfixes refs/heads et refs/tags ne sont pas autorisés dans uses." }
    localpath: { en: "A ./ path refers to the caller's own repository and takes no @ref.", fr: "Un chemin ./ désigne le dépôt de l'appelant lui-même et ne prend pas de @ref." }
    all: { en: "all isn't a valid value; use inherit or list the secrets.", fr: "all n'est pas une valeur valide ; utilisez inherit ou énumérez les secrets." }
    ctx: { en: "The secrets keyword takes inherit or a map of named secrets, not the whole context.", fr: "Le mot clé secrets accepte inherit ou une table de secrets nommés, pas le contexte entier." }
    wfdispatch: { en: "workflow_dispatch starts a workflow manually; it doesn't make it callable from another workflow.", fr: "workflow_dispatch démarre un workflow manuellement ; il ne le rend pas appelable depuis un autre workflow." }
    wfrun: { en: "workflow_run starts a workflow after another one completes; it doesn't accept inputs from a caller.", fr: "workflow_run démarre un workflow après la fin d'un autre ; il n'accepte pas d'entrées d'un appelant." }
    repodispatch: { en: "repository_dispatch is triggered by an API call, not by a calling job.", fr: "repository_dispatch est déclenché par un appel d'API, pas par un job appelant." }
references:
  - title: Reusing workflow configurations
    url: https://docs.github.com/en/actions/reference/workflows-and-actions/reusable-workflows
  - title: Workflow syntax for GitHub Actions
    url: https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax
