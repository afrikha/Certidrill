id: az400-3a-ver-rc-float
objective: "3.1.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A test project references the package **Adatum.Payments** with the following element:

    `<PackageReference Include="Adatum.Payments" Version="3.0.0-rc.*" />`

    The only package source contains these versions of Adatum.Payments: 2.9.4, 3.0.0-rc.1, 3.0.0-rc.2, 3.0.0-rc.10 and 3.0.0. The package is not in the local NuGet cache.

    Which version does NuGet restore?
  fr: |
    Un projet de test référence le package **Adatum.Payments** avec l'élément suivant :

    `<PackageReference Include="Adatum.Payments" Version="3.0.0-rc.*" />`

    La seule source de packages contient ces versions d'Adatum.Payments : 2.9.4, 3.0.0-rc.1, 3.0.0-rc.2, 3.0.0-rc.10 et 3.0.0. Le package n'est pas dans le cache NuGet local.

    Quelle version NuGet restaure-t-il ?
shuffle: false
body:
  options:
    - { id: a, text: "2.9.4" }
    - { id: b, text: "3.0.0-rc.2" }
    - { id: c, text: "3.0.0-rc.10" }
    - { id: d, text: "3.0.0" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      A floating version resolves to the highest version that matches the pattern. With a pattern that has a prerelease part such as 3.0.0-rc.*, stable versions are allowed when they match the stable part, and 3.0.0 is higher than any 3.0.0-rc version, so NuGet restores 3.0.0.
    fr: |
      Une version flottante se résout vers la version la plus élevée qui correspond au modèle. Avec un modèle qui comporte une partie de préversion comme 3.0.0-rc.*, les versions stables sont autorisées si elles correspondent à la partie stable, et 3.0.0 est supérieure à toute version 3.0.0-rc : NuGet restaure donc 3.0.0.
  options:
    a: { en: "2.9.4 does not match the 3.0.0 part of the pattern.", fr: "2.9.4 ne correspond pas à la partie 3.0.0 du modèle." }
    b: { en: "Numeric prerelease identifiers compare numerically, so rc.10 is higher than rc.2, and 3.0.0 is higher still.", fr: "Les identifiants numériques de préversion se comparent numériquement : rc.10 est supérieur à rc.2, et 3.0.0 l'est encore plus." }
    c: { en: "rc.10 is the highest release candidate, but the stable 3.0.0 matches the pattern and has a higher precedence.", fr: "rc.10 est la version candidate la plus élevée, mais la version stable 3.0.0 correspond au modèle et a une priorité plus élevée." }
references:
  - title: How NuGet resolves package dependencies
    url: https://learn.microsoft.com/en-us/nuget/concepts/dependency-resolution
