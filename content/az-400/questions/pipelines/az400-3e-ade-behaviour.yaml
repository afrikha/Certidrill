id: az400-3e-ade-behaviour
objective: "3.5.5"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Adatum uses Azure Deployment Environments. A dev center named **dc-adatum** has a catalog connected to a GitHub repository, with automatic sync disabled. A project named **proj-hr** has the project environment types Dev and Test.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum utilise Azure Deployment Environments. Un centre de développement nommé **dc-adatum** a un catalogue connecté à un dépôt GitHub, avec la synchronisation automatique désactivée. Un projet nommé **proj-hr** a les types d'environnement de projet Dev et Test.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "Each environment that a developer creates in proj-hr is deployed to its own resource group."
        fr: "Chaque environnement qu'un développeur crée dans proj-hr est déployé dans son propre groupe de ressources."
    - id: s2
      text:
        en: "A change pushed to an environment.yaml file of the catalog repository is available to developers without syncing the catalog."
        fr: "Une modification envoyée sur un fichier environment.yaml du dépôt du catalogue est disponible pour les développeurs sans synchronisation du catalogue."
    - id: s3
      text:
        en: "Disabling the Test project environment type deletes the environments that were created with it."
        fr: "La désactivation du type d'environnement de projet Test supprime les environnements créés avec celui-ci."
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: "Each environment gets its own resource group, named after the project and the environment. Changes to an environment.yaml file require a catalog sync, which is manual here because automatic sync (a scan every 30 minutes) is disabled. Disabling a project environment type only prevents new environments of that type; existing environments aren't affected."
    fr: "Chaque environnement dispose de son propre groupe de ressources, nommé d'après le projet et l'environnement. Les modifications d'un fichier environment.yaml exigent une synchronisation du catalogue, ici manuelle, car la synchronisation automatique (une analyse toutes les 30 minutes) est désactivée. La désactivation d'un type d'environnement de projet empêche seulement la création de nouveaux environnements de ce type ; les environnements existants ne sont pas affectés."
references:
  - title: Add and configure an environment definition in a catalog
    url: https://learn.microsoft.com/en-us/azure/deployment-environments/configure-environment-definition
  - title: Configure environment types for Azure Deployment Environments projects
    url: https://learn.microsoft.com/en-us/azure/deployment-environments/how-to-configure-project-environment-types
