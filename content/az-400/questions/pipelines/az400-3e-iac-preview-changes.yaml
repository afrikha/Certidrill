id: az400-3e-iac-preview-changes
objective: "3.5.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Fabrikam deploys a Bicep file to a resource group named **rg-crm-prod** from a multi-stage YAML pipeline. An approval check protects the production environment.

    Before approving a run, the approvers must see which resources the deployment will create, modify or delete, and the property changes, without any change being made to rg-crm-prod.

    Which command should the stage that runs before the approval execute?
  fr: |
    Fabrikam déploie un fichier Bicep vers un groupe de ressources nommé **rg-crm-prod** depuis un pipeline YAML à phases multiples. Une vérification d'approbation protège l'environnement de production.

    Avant d'approuver une exécution, les approbateurs doivent voir quelles ressources le déploiement va créer, modifier ou supprimer, ainsi que les modifications de propriétés, sans qu'aucune modification ne soit apportée à rg-crm-prod.

    Quelle commande la phase exécutée avant l'approbation doit-elle lancer ?
body:
  options:
    - { id: a, text: "az deployment group what-if" }
    - { id: b, text: "az bicep build" }
    - { id: c, text: "az deployment group validate" }
    - { id: d, text: "az deployment group create --confirm-with-what-if" }
answer: { optionId: a }
explanation:
  correct:
    en: "The what-if operation predicts the changes a deployment would make, resource by resource and property by property, without modifying existing resources. Its output can be published in the run so that approvers review it before the deployment stage starts."
    fr: "L'opération what-if prédit les modifications qu'un déploiement effectuerait, ressource par ressource et propriété par propriété, sans modifier les ressources existantes. Sa sortie peut être publiée dans l'exécution pour que les approbateurs l'examinent avant le début de la phase de déploiement."
  options:
    c:
      en: "Validate runs the preflight checks (syntax, values, policy) but doesn't list the resource and property changes."
      fr: "Validate exécute les vérifications préalables (syntaxe, valeurs, stratégie), mais ne liste pas les modifications de ressources et de propriétés."
    b:
      en: "`bicep build` only compiles the file to an ARM template; it doesn't compare it with Azure."
      fr: "`bicep build` compile seulement le fichier en modèle ARM ; il ne le compare pas à Azure."
    d:
      en: "This command shows the what-if result and then prompts to continue the deployment; it's interactive and part of the deployment itself."
      fr: "Cette commande affiche le résultat what-if, puis demande de poursuivre le déploiement ; elle est interactive et fait partie du déploiement lui-même."
references:
  - title: Bicep deployment what-if operation
    url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/bicep/deploy-what-if
