id: az400-3a-test-local
objective: "3.2.2"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    Developers at Litware often push commits that break the formatting rules or the unit tests, and the CI pipeline reports the problem 20 minutes later.

    You need to catch these problems on the developer's computer, before the commits reach the remote repository.

    Which two actions should you recommend? Each correct answer presents a complete solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Les développeurs de Litware envoient souvent des commits qui enfreignent les règles de mise en forme ou cassent les tests unitaires, et le pipeline de CI signale le problème 20 minutes plus tard.

    Vous devez détecter ces problèmes sur l'ordinateur du développeur, avant que les commits n'atteignent le dépôt distant.

    Quelles sont les deux actions à recommander ? Chaque bonne réponse constitue une solution complète.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Add a build validation branch policy that runs the CI pipeline for pull requests", fr: "Ajouter une stratégie de branche de validation de build qui exécute le pipeline de CI pour les demandes de tirage" } }
    - { id: b, text: { en: "Have developers run the formatter check and the unit tests locally before each push", fr: "Faire exécuter localement la vérification de mise en forme et les tests unitaires par les développeurs avant chaque envoi" } }
    - { id: c, text: { en: "Run an Azure Load Testing test after each deployment to the test environment", fr: "Exécuter un test Azure Load Testing après chaque déploiement dans l'environnement de test" } }
    - { id: d, text: { en: "Add a client-side pre-commit Git hook that runs the formatter check and the unit tests", fr: "Ajouter un hook Git pre-commit côté client qui exécute la vérification de mise en forme et les tests unitaires" } }
    - { id: e, text: { en: "Schedule the CI pipeline to run every night on the main branch", fr: "Planifier l'exécution du pipeline de CI chaque nuit sur la branche main" } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |
      Client-side Git hooks run on each developer's computer and give immediate feedback: a pre-commit hook can check formatting and run unit tests before the commit is created. Running the same fast tests locally before pushing also catches the problems before they reach the shared repository.
    fr: |
      Les hooks Git côté client s'exécutent sur l'ordinateur de chaque développeur et donnent un retour immédiat : un hook pre-commit peut vérifier la mise en forme et exécuter les tests unitaires avant la création du commit. Exécuter localement les mêmes tests rapides avant l'envoi détecte aussi les problèmes avant qu'ils n'atteignent le dépôt partagé.
  options:
    a: { en: "Build validation runs after the branch is pushed and a pull request exists, on a pipeline agent.", fr: "La validation de build s'exécute après l'envoi de la branche et la création d'une demande de tirage, sur un agent de pipeline." }
    e: { en: "A nightly run finds problems even later than the current CI run.", fr: "Une exécution nocturne détecte les problèmes encore plus tard que la CI actuelle." }
    c: { en: "Load tests measure performance after deployment; they do not check formatting or unit tests.", fr: "Les tests de charge mesurent les performances après le déploiement ; ils ne vérifient ni la mise en forme ni les tests unitaires." }
references:
  - title: Introduction to Git hooks
    url: https://learn.microsoft.com/en-us/training/modules/explore-git-hooks/2-introduction-to
  - title: Shift testing left with unit tests
    url: https://learn.microsoft.com/en-us/devops/develop/shift-left-make-testing-fast-reliable
