id: az400-3f-report-sections
objective: "3.6.1"
type: hotarea
difficulty: 2
status: draft
stem:
  en: |
    Proseware has a multi-stage YAML pipeline named **portal-cd** with the stages Build, Test and Deploy. You open the reports of the Analytics tab of portal-cd. The following table lists the sections of the reports.

    Answer each prompt by selecting the section that provides the information.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware dispose d'un pipeline YAML à phases multiples nommé **portal-cd**, avec les phases Build, Test et Deploy. Vous ouvrez les rapports de l'onglet Analytics de portal-cd. Le tableau suivant liste les sections des rapports.

    Répondez à chaque consigne en sélectionnant la section qui fournit l'information.

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
    - id: p1
      text: { en: "Which stage produced the most failures on each day of the period", fr: "Quelle phase a produit le plus d'échecs chaque jour de la période" }
    - id: p2
      text: { en: "Which task to optimize first to shorten the successful runs", fr: "Quelle tâche optimiser en premier pour raccourcir les exécutions réussies" }
  grid:
    header: [{ en: "Report", fr: "Rapport" }, { en: "Section", fr: "Section" }]
    rows:
      - [{ text: Pipeline pass rate }, { text: Summary, area: prsum }]
      - [{ text: Pipeline pass rate }, { text: Failure trend, area: prtrend }]
      - [{ text: Pipeline pass rate }, { text: "Top failing tasks & their failed runs", area: prtop }]
      - [{ text: Pipeline duration }, { text: Duration summary, area: dsum }]
      - [{ text: Pipeline duration }, { text: Duration trend, area: dtrend }]
      - [{ text: Pipeline duration }, { text: Top tasks by duration, area: dtop }]
      - [{ text: Test failures }, { text: Top failing tests, area: ttop }]
answer:
  values: { p1: prtrend, p2: dtop }
explanation:
  correct:
    en: |
      The Failure trend section of the pass rate report shows the number of failures per day, divided by stage when the pipeline has several stages. The Pipeline duration report covers successful runs, and its top tasks by duration show which task contributes most to the duration. The top failing tasks section ranks tasks by failures, not by stage per day.
    fr: |
      La section Failure trend du rapport de taux de réussite montre le nombre d'échecs par jour, réparti par phase quand le pipeline a plusieurs phases. Le rapport Pipeline duration porte sur les exécutions réussies, et sa liste des tâches les plus longues montre la tâche qui pèse le plus dans la durée. La section des tâches qui échouent le plus classe les tâches par nombre d'échecs, pas les phases par jour.
references:
  - title: Pipeline reports
    url: https://learn.microsoft.com/en-us/azure/devops/pipelines/reports/pipelinereport
