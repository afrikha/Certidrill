id: az400-3b-auto-public-oss
objective: "3.3.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam keeps its private projects in an Azure DevOps organization. The company now wants to publish a new open-source SDK.

    Anyone must be able to browse the code and the CI results without signing in, and pull requests from external contributors must be validated by CI without paying for build minutes or maintaining build machines.

    What should you recommend?
  fr: |
    Fabrikam conserve ses projets privés dans une organisation Azure DevOps. L'entreprise veut maintenant publier un nouveau SDK open source.

    Tout le monde doit pouvoir parcourir le code et les résultats de la CI sans se connecter, et les pull requests des contributeurs externes doivent être validées par la CI sans payer de minutes de build ni maintenir de machines de build.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "Create a public project in the Azure DevOps organization and build it with Microsoft-hosted agents.", fr: "Créer un projet public dans l'organisation Azure DevOps et le générer avec des agents hébergés par Microsoft." } }
    - { id: b, text: { en: "Create a private Azure DevOps project and purchase one Microsoft-hosted parallel job.", fr: "Créer un projet Azure DevOps privé et acheter un travail parallèle hébergé par Microsoft." } }
    - { id: c, text: { en: "Create a public GitHub repository and build it with self-hosted runners in Fabrikam's datacenter.", fr: "Créer un dépôt GitHub public et le générer avec des exécuteurs auto-hébergés dans le centre de données de Fabrikam." } }
    - { id: d, text: { en: "Create a public GitHub repository and build it with GitHub Actions on GitHub-hosted runners.", fr: "Créer un dépôt GitHub public et le générer avec GitHub Actions sur des exécuteurs hébergés par GitHub." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Azure DevOps public projects are retired: new public projects can no longer be created, and Microsoft directs open-source collaboration to GitHub. A public GitHub repository can be browsed anonymously, and GitHub Actions on GitHub-hosted runners validates pull requests without machines to maintain.
    fr: |
      Les projets publics Azure DevOps sont retirés : il n'est plus possible d'en créer, et Microsoft oriente la collaboration open source vers GitHub. Un dépôt GitHub public peut être parcouru anonymement, et GitHub Actions sur des exécuteurs hébergés par GitHub valide les pull requests sans machine à maintenir.
  options:
    a: { en: "New public projects can't be created in Azure DevOps.", fr: "Il n'est plus possible de créer de projets publics dans Azure DevOps." }
    b: { en: "A private project requires sign-in and the parallel job is paid.", fr: "Un projet privé exige une connexion et le travail parallèle est payant." }
    c: { en: "Self-hosted runners must be maintained, and running pull requests from a public repository on them exposes the internal network.", fr: "Les exécuteurs auto-hébergés doivent être maintenus, et y exécuter les pull requests d'un dépôt public expose le réseau interne." }
references:
  - title: Public projects retirement in Azure DevOps
    url: https://learn.microsoft.com/en-us/azure/devops/organizations/projects/public-projects-retirement
  - title: Explore runners
    url: https://learn.microsoft.com/en-us/training/modules/introduction-to-github-actions/8-explore-runners
