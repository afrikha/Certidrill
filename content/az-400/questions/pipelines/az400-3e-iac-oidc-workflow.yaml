id: az400-3e-iac-oidc-workflow
objective: "3.5.3"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    Adatum is creating a GitHub Actions workflow that deploys Bicep files to a resource group named **rg-portal**. A Microsoft Entra application has the Contributor role on rg-portal, and the repository secrets **AZURE_CLIENT_ID**, **AZURE_TENANT_ID** and **AZURE_SUBSCRIPTION_ID** contain its identifiers. The workflow signs in with `azure/login@v3`.

    The workflow must authenticate to Azure without storing any client secret or certificate in GitHub.

    Which two actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum crée un flux de travail GitHub Actions qui déploie des fichiers Bicep vers un groupe de ressources nommé **rg-portal**. Une application Microsoft Entra dispose du rôle Contributor sur rg-portal, et les secrets de dépôt **AZURE_CLIENT_ID**, **AZURE_TENANT_ID** et **AZURE_SUBSCRIPTION_ID** contiennent ses identifiants. Le flux de travail se connecte avec `azure/login@v3`.

    Le flux de travail doit s'authentifier auprès d'Azure sans stocker de secret client ni de certificat dans GitHub.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text:
        en: "Add a federated identity credential to the application for the repository and the branch or environment that runs the workflow."
        fr: "Ajouter à l'application des informations d'identification fédérées pour le dépôt et la branche ou l'environnement qui exécute le flux de travail."
    - id: b
      text:
        en: "Create a client secret for the application and store it in a repository secret named AZURE_CLIENT_SECRET."
        fr: "Créer un secret client pour l'application et le stocker dans un secret de dépôt nommé AZURE_CLIENT_SECRET."
    - id: c
      text:
        en: "Add `id-token: write` to the `permissions` of the workflow."
        fr: "Ajouter `id-token: write` aux `permissions` du flux de travail."
    - id: d
      text:
        en: "Add `contents: write` to the `permissions` of the workflow."
        fr: "Ajouter `contents: write` aux `permissions` du flux de travail."
    - id: e
      text:
        en: "Create a personal access token and store it in a repository secret named AZURE_TOKEN."
        fr: "Créer un jeton d'accès personnel et le stocker dans un secret de dépôt nommé AZURE_TOKEN."
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: "With OpenID Connect, the job requests a token from GitHub, which requires the `id-token: write` permission, and azure/login exchanges it for an Azure token. Microsoft Entra accepts the exchange only if the application has a federated identity credential whose subject matches the repository and the branch or environment of the run."
    fr: "Avec OpenID Connect, le job demande un jeton à GitHub, ce qui exige l'autorisation `id-token: write`, et azure/login l'échange contre un jeton Azure. Microsoft Entra n'accepte l'échange que si l'application possède des informations d'identification fédérées dont le sujet correspond au dépôt et à la branche ou à l'environnement de l'exécution."
  options:
    b:
      en: "A client secret is a stored secret, which the requirement forbids."
      fr: "Un secret client est un secret stocké, ce que l'exigence interdit."
    d:
      en: "`contents: write` lets the job push to the repository; it doesn't allow requesting an OIDC token."
      fr: "`contents: write` permet au job d'envoyer des modifications au dépôt ; il ne permet pas de demander un jeton OIDC."
    e:
      en: "A personal access token is a GitHub credential; Azure doesn't accept it, and it's a stored secret too."
      fr: "Un jeton d'accès personnel est une information d'identification GitHub ; Azure ne l'accepte pas, et c'est aussi un secret stocké."
references:
  - title: "Quickstart: Deploy Bicep files by using GitHub Actions"
    url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/bicep/deploy-github-actions
