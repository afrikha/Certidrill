id: az400-3c-gh-runner-group
objective: "3.3.7"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    Proseware uses GitHub Enterprise Cloud. Self-hosted runners that can reach an internal data store are in a runner group named **ml-runners**. Some of those runners have the labels **linux** and **gpu**. A training job must run only on runners of the ml-runners group that have both labels.

    How should you complete the workflow? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware utilise GitHub Enterprise Cloud. Des exécuteurs auto-hébergés qui peuvent joindre un magasin de données interne font partie d'un groupe d'exécuteurs nommé **ml-runners**. Certains de ces exécuteurs ont les étiquettes **linux** et **gpu**. Un job d'entraînement ne doit s'exécuter que sur les exécuteurs du groupe ml-runners qui ont les deux étiquettes.

    Comment devez-vous compléter le workflow ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: yaml
  template: |
    jobs:
      train:
        runs-on:
          [[s1]]: ml-runners
          [[s2]]: [ linux, gpu ]
        steps:
        - uses: actions/checkout@v4
        - run: python train.py
  slots:
    - id: s1
      options:
        - { id: group, text: group }
        - { id: pool, text: pool }
        - { id: name, text: name }
    - id: s2
      options:
        - { id: labels, text: labels }
        - { id: demands, text: demands }
        - { id: tags, text: tags }
answer:
  values: { s1: group, s2: labels }
explanation:
  correct:
    en: "`runs-on` accepts a `group` and `labels` pair. The job is routed to a runner that belongs to the group and has every listed label."
    fr: "`runs-on` accepte une paire `group` et `labels`. Le job est dirigé vers un exécuteur qui appartient au groupe et possède toutes les étiquettes listées."
  options:
    pool: { en: "pool selects an agent pool in Azure Pipelines, not in GitHub Actions.", fr: "pool sélectionne un pool d'agents dans Azure Pipelines, pas dans GitHub Actions." }
    name: { en: "name isn't a key of runs-on.", fr: "name n'est pas une clé de runs-on." }
    demands: { en: "demands matches agent capabilities in Azure Pipelines.", fr: "demands correspond aux capacités des agents dans Azure Pipelines." }
    tags: { en: "tags filters virtual machine resources of an Azure Pipelines environment.", fr: "tags filtre les ressources machine virtuelle d'un environnement Azure Pipelines." }
references:
  - title: Workflow syntax for GitHub Actions
    url: https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax
  - title: Self-hosted runners reference
    url: https://docs.github.com/en/actions/reference/runners/self-hosted-runners
