id: az400-3c-kv-new-secret
objective: "3.3.8"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Northwind has a variable group named **app-secrets** that is linked to the Azure key vault **kv-shop** through an Azure Resource Manager service connection. The service connection's identity has the Key Vault Secrets User role on kv-shop, and pipelines read the secret **DbPassword** from the group without issue.

    Yesterday, an administrator added the secret **PaymentApiKey** to kv-shop. A pipeline step that uses `$(PaymentApiKey)` doesn't get the value.

    What should you do?
  fr: |
    Northwind dispose d'un groupe de variables nommé **app-secrets** lié au coffre de clés Azure **kv-shop** via une connexion de service Azure Resource Manager. L'identité de la connexion de service a le rôle Key Vault Secrets User sur kv-shop, et les pipelines lisent sans problème le secret **DbPassword** depuis le groupe.

    Hier, un administrateur a ajouté le secret **PaymentApiKey** à kv-shop. Une étape de pipeline qui utilise `$(PaymentApiKey)` n'obtient pas la valeur.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Edit app-secrets and add PaymentApiKey to the secrets mapped from the key vault.", fr: "Modifier app-secrets et ajouter PaymentApiKey aux secrets mappés depuis le coffre de clés." } }
    - { id: b, text: { en: "Assign the Key Vault Secrets Officer role to the service connection's identity.", fr: "Attribuer le rôle Key Vault Secrets Officer à l'identité de la connexion de service." } }
    - { id: c, text: { en: "Enable Open access on app-secrets for all the pipelines of the project.", fr: "Activer Open access sur app-secrets pour tous les pipelines du projet." } }
    - { id: d, text: { en: "Reference the secret with `${{ variables.PaymentApiKey }}` instead of the macro syntax.", fr: "Référencer le secret avec `${{ variables.PaymentApiKey }}` au lieu de la syntaxe macro." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      A variable group linked to Azure Key Vault maps secret names only, and pipelines fetch the latest values at runtime. Secrets added to or deleted from the vault don't update the group automatically, so you must add PaymentApiKey to the group explicitly.
    fr: |
      Un groupe de variables lié à Azure Key Vault ne mappe que des noms de secrets, et les pipelines récupèrent les dernières valeurs à l'exécution. Les secrets ajoutés au coffre ou supprimés ne mettent pas le groupe à jour automatiquement : vous devez ajouter explicitement PaymentApiKey au groupe.
  options:
    b: { en: "Key Vault Secrets User already lets the connection read secrets, as DbPassword shows.", fr: "Key Vault Secrets User permet déjà à la connexion de lire les secrets, comme le montre DbPassword." }
    c: { en: "The pipeline is already authorized, since it reads DbPassword; open access only widens who can use the group.", fr: "Le pipeline est déjà autorisé, puisqu'il lit DbPassword ; l'accès ouvert ne fait qu'élargir qui peut utiliser le groupe." }
    d: { en: "Template expressions are evaluated at compile time and don't read variable group secrets.", fr: "Les expressions de modèle sont évaluées à la compilation et ne lisent pas les secrets d'un groupe de variables." }
references:
  - title: Link a variable group to secrets in Azure Key Vault
    url: https://learn.microsoft.com/en-us/azure/devops/pipelines/library/link-variable-groups-to-key-vaults
