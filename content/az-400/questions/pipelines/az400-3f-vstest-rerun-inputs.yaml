id: az400-3f-vstest-rerun-inputs
objective: "3.6.1"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    Adatum runs MSTest tests in a YAML pipeline. Flaky test management is turned on with system detection. Some tests fail intermittently because of a shared test database.

    You need to configure the Visual Studio Test task to meet the following requirements:

    - Rerun the failed tests only when 10 tests or fewer failed. When more tests fail, the run must not rerun anything.
    - Rerun a failed test at most 2 times.

    How should you complete the YAML? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum exécute des tests MSTest dans un pipeline YAML. La gestion des tests instables est activée avec la détection système. Certains tests échouent par intermittence à cause d'une base de données de test partagée.

    Vous devez configurer la tâche Visual Studio Test pour satisfaire les exigences suivantes :

    - Réexécuter les tests en échec seulement si 10 tests ou moins ont échoué. Si davantage de tests échouent, l'exécution ne doit rien réexécuter.
    - Réexécuter un test en échec au maximum 2 fois.

    Comment devez-vous compléter le YAML ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: yaml
  template: |
    steps:
    - task: VSTest@3
      inputs:
        testSelector: testAssemblies
        testAssemblyVer2: |
          **\*Tests.dll
          !**\obj\**
        rerunFailedTests: true
        rerunType: [[type]]
        [[limit]]: '10'
        [[attempts]]: '2'
  slots:
    - id: type
      options:
        - { id: pct, text: basedOnTestFailurePercentage }
        - { id: count, text: basedOnTestFailureCount }
        - { id: time, text: basedOnExecutionTime }
    - id: limit
      options:
        - { id: threshold, text: rerunFailedThreshold }
        - { id: minimum, text: minimumExpectedTests }
        - { id: maxlimit, text: rerunFailedTestCasesMaxLimit }
    - id: attempts
      options:
        - { id: maxatt, text: rerunMaxAttempts }
        - { id: runall, text: runAllTestsAfterXBuilds }
        - { id: retrycount, text: retryCountOnTaskFailure }
answer:
  values: { type: count, limit: maxlimit, attempts: maxatt }
explanation:
  correct:
    en: |
      With rerunType set to basedOnTestFailureCount, the task skips reruns when the number of failed tests crosses rerunFailedTestCasesMaxLimit, here 10. rerunMaxAttempts sets the maximum number of retries of a failed test (default 3). A test that fails and then passes on a rerun is marked flaky by system detection.
    fr: |
      Avec rerunType défini sur basedOnTestFailureCount, la tâche ne réexécute rien lorsque le nombre de tests en échec dépasse rerunFailedTestCasesMaxLimit, ici 10. rerunMaxAttempts définit le nombre maximal de nouvelles tentatives pour un test en échec (3 par défaut). Un test qui échoue puis réussit lors d'une réexécution est marqué instable par la détection système.
  options:
    pct: { en: "basedOnTestFailurePercentage compares a failure percentage with rerunFailedThreshold, not a number of tests.", fr: "basedOnTestFailurePercentage compare un pourcentage d'échec à rerunFailedThreshold, pas un nombre de tests." }
    time: { en: "basedOnExecutionTime is a value of distributionBatchType, used to slice tests across agents.", fr: "basedOnExecutionTime est une valeur de distributionBatchType, utilisée pour découper les tests entre agents." }
    threshold: { en: "rerunFailedThreshold is the percentage limit used with basedOnTestFailurePercentage.", fr: "rerunFailedThreshold est la limite en pourcentage utilisée avec basedOnTestFailurePercentage." }
    minimum: { en: "minimumExpectedTests fails the task when too few tests run; it does not control reruns.", fr: "minimumExpectedTests fait échouer la tâche quand trop peu de tests s'exécutent ; il ne contrôle pas les réexécutions." }
    runall: { en: "runAllTestsAfterXBuilds belongs to test impact analysis.", fr: "runAllTestsAfterXBuilds relève de l'analyse d'impact des tests." }
    retrycount: { en: "retryCountOnTaskFailure is a step property that reruns the whole task, not an input that reruns individual tests.", fr: "retryCountOnTaskFailure est une propriété d'étape qui réexécute toute la tâche, pas une entrée qui réexécute des tests individuels." }
references:
  - title: VSTest@3 - Visual Studio Test v3 task
    url: https://learn.microsoft.com/en-us/azure/devops/pipelines/tasks/reference/vstest-v3
  - title: Manage flaky tests
    url: https://learn.microsoft.com/en-us/azure/devops/pipelines/test/flaky-test-management
