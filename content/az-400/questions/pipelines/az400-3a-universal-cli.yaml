id: az400-3a-universal-cli
objective: "3.1.1"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    Tailspin has an Azure DevOps organization named **tailspin** that contains a project named **Firmware**. The project contains a project-scoped feed named **device-images**.

    You need to publish the content of the `./out/images` folder as a Universal Package named for the sensor firmware, with the version of the first release candidate of release 3.2.0. The command must succeed on the first attempt.

    How should you complete the command? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin dispose d'une organisation Azure DevOps nommée **tailspin** qui contient un projet nommé **Firmware**. Le projet contient un flux délimité au projet nommé **device-images**.

    Vous devez publier le contenu du dossier `./out/images` sous forme de package universel nommé d'après le firmware du capteur, avec le numéro de la première version candidate (release candidate) de la version 3.2.0. La commande doit réussir du premier coup.

    Comment devez-vous compléter la commande ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: bash
  template: |
    az artifacts universal publish \
      --organization https://dev.azure.com/tailspin \
      --project Firmware \
      --scope [[scope]] \
      --feed device-images \
      --name [[name]] \
      --version [[ver]] \
      --path ./out/images
  slots:
    - id: scope
      options:
        - { id: project, text: project }
        - { id: org, text: organization }
        - { id: feed, text: feed }
    - id: name
      options:
        - { id: lower, text: sensor-firmware }
        - { id: upper, text: Sensor-Firmware }
        - { id: double, text: sensor--firmware }
        - { id: lead, text: "-sensor-firmware" }
    - id: ver
      options:
        - { id: rc, text: 3.2.0-rc.1 }
        - { id: rcup, text: 3.2.0-RC.1 }
        - { id: meta, text: 3.2.0+rc.1 }
        - { id: four, text: 3.2.0.1 }
answer:
  values: { scope: project, name: lower, ver: rc }
explanation:
  correct:
    en: |
      A project-scoped feed is addressed with `--project` and `--scope project`. Universal Package names must be lowercase, start and end with a letter or digit, and contain only letters, digits, non-consecutive dashes, underscores or periods. Versions follow semantic versioning, must be lowercase and cannot contain build metadata, so the first release candidate is `3.2.0-rc.1`.
    fr: |
      Un flux délimité au projet s'adresse avec `--project` et `--scope project`. Les noms de packages universels doivent être en minuscules, commencer et se terminer par une lettre ou un chiffre, et ne contenir que des lettres, des chiffres, des tirets non consécutifs, des traits de soulignement ou des points. Les versions suivent le versionnement sémantique, doivent être en minuscules et ne peuvent pas contenir de métadonnées de build : la première version candidate est donc `3.2.0-rc.1`.
  options:
    org: { en: "organization is the scope of an organization-scoped feed, which is used without --project.", fr: "organization est l'étendue d'un flux délimité à l'organisation, utilisé sans --project." }
    upper: { en: "Universal Package names must be lowercase.", fr: "Les noms de packages universels doivent être en minuscules." }
    double: { en: "Consecutive dashes are not allowed in a Universal Package name.", fr: "Les tirets consécutifs ne sont pas autorisés dans un nom de package universel." }
    lead: { en: "A name must start with a letter or a digit.", fr: "Un nom doit commencer par une lettre ou un chiffre." }
    rcup: { en: "Universal Package versions must be lowercase.", fr: "Les versions de packages universels doivent être en minuscules." }
    meta: { en: "The + suffix is build metadata, which Universal Package versions cannot contain; it also would not mark a prerelease.", fr: "Le suffixe + correspond à des métadonnées de build, interdites dans les versions de packages universels ; il ne marquerait pas non plus une préversion." }
    four: { en: "A four-part number is not a semantic version and does not express a release candidate.", fr: "Un numéro en quatre parties n'est pas une version sémantique et n'exprime pas une version candidate." }
references:
  - title: Publish Universal Packages in Azure Artifacts
    url: https://learn.microsoft.com/en-us/azure/devops/artifacts/quickstarts/universal-packages
