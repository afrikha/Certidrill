id: az400-3b-agent-hosted-facts
objective: "3.3.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Contoso plans to run its Azure Pipelines jobs on Microsoft-hosted Windows and Linux agents instead of maintaining build servers.

    Which two statements about Microsoft-hosted agents are true?

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso prévoit d'exécuter ses travaux Azure Pipelines sur des agents Windows et Linux hébergés par Microsoft au lieu de maintenir des serveurs de build.

    Quelles sont les deux affirmations vraies sur les agents hébergés par Microsoft ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "You can select a larger VM size for the agents when a build needs more memory.", fr: "Vous pouvez choisir une taille de machine virtuelle plus grande pour les agents quand une build a besoin de plus de mémoire." } }
    - { id: b, text: { en: "Each job runs on a new virtual machine that is discarded after the job.", fr: "Chaque travail s'exécute sur une nouvelle machine virtuelle qui est supprimée après le travail." } }
    - { id: c, text: { en: "The agents can reach on-premises servers through a site-to-site VPN connected to your Azure virtual network.", fr: "Les agents peuvent atteindre des serveurs locaux par un VPN site à site connecté à votre réseau virtuel Azure." } }
    - { id: d, text: { en: "A firewall rule can allow the agents by using an Azure service tag.", fr: "Une règle de pare-feu peut autoriser les agents à l'aide d'une étiquette de service Azure." } }
    - { id: e, text: { en: "You can't connect remotely to the agent virtual machine to troubleshoot a job.", fr: "Vous ne pouvez pas vous connecter à distance à la machine virtuelle de l'agent pour diagnostiquer un travail." } }
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: |
      Each job gets a fresh Microsoft-hosted VM that is discarded afterward, so no file system change persists to the next job. Microsoft-hosted agents don't support remote connections; to inspect a machine, you need a self-hosted agent, a scale set agent or a Managed DevOps Pool.
    fr: |
      Chaque travail reçoit une nouvelle machine virtuelle hébergée par Microsoft, supprimée ensuite : aucune modification du système de fichiers ne persiste au travail suivant. Les agents hébergés par Microsoft ne prennent pas en charge les connexions à distance ; pour inspecter une machine, il faut un agent auto-hébergé, un agent de groupe identique ou un Managed DevOps Pool.
  options:
    a: { en: "Windows and Linux agents run on Standard_DS2_v2; you can't increase disk or processing power.", fr: "Les agents Windows et Linux s'exécutent sur Standard_DS2_v2 ; vous ne pouvez augmenter ni le disque ni la puissance de calcul." }
    c: { en: "ExpressRoute and VPN aren't supported: Microsoft-hosted agents aren't on your network.", fr: "ExpressRoute et VPN ne sont pas pris en charge : les agents hébergés par Microsoft ne sont pas sur votre réseau." }
    d: { en: "Microsoft-hosted agents can't be identified by service tags; you must allow the weekly published IP ranges of your geography.", fr: "Les agents hébergés par Microsoft ne peuvent pas être identifiés par des étiquettes de service ; vous devez autoriser les plages d'adresses IP publiées chaque semaine pour votre zone géographique." }
references:
  - title: Microsoft-hosted agents
    url: https://learn.microsoft.com/en-us/azure/devops/pipelines/agents/hosted
