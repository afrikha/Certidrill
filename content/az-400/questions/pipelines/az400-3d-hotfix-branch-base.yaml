id: az400-3d-hotfix-branch-base
objective: "3.4.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso uses Azure Repos. Version 4.2 of an application was built from the **release/4.2** branch and is running in production. Since then, the **main** branch has received several features that are not ready to be released.

    A critical bug is reported in production. You need to plan where the developers create the branch for the fix, so that the next production deployment contains only the fix and the code already in production.

    From which branch should the developers create the fix branch?
  fr: |
    Contoso utilise Azure Repos. La version 4.2 d'une application a été générée à partir de la branche **release/4.2** et s'exécute en production. Depuis, la branche **main** a reçu plusieurs fonctionnalités qui ne sont pas prêtes à être publiées.

    Un bogue critique est signalé en production. Vous devez prévoir à partir de quelle branche les développeurs créent la branche du correctif, pour que le prochain déploiement en production ne contienne que le correctif et le code déjà en production.

    À partir de quelle branche les développeurs doivent-ils créer la branche du correctif ?
body:
  options:
    - id: a
      text: main
    - id: b
      text: release/4.2
    - id: c
      text: { en: "A new branch created from the oldest commit of main", fr: "Une nouvelle branche créée à partir du plus ancien commit de main" }
    - id: d
      text: { en: "The feature branch of the last completed pull request", fr: "La branche de fonctionnalité de la dernière demande de tirage terminée" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      The fix branch must start from the code that is in production, which is release/4.2. The fix is merged back into release/4.2 by a pull request, deployed from there, and then ported to main so that the bug doesn't come back in the next release.
    fr: |
      La branche du correctif doit partir du code en production, c'est-à-dire release/4.2. Le correctif est fusionné dans release/4.2 par une demande de tirage, déployé à partir de cette branche, puis reporté dans main pour que le bogue ne revienne pas dans la version suivante.
  options:
    a:
      en: "main contains unreleased features, which would be deployed together with the fix."
      fr: "main contient des fonctionnalités non publiées, qui seraient déployées avec le correctif."
    c:
      en: "The oldest commit of main doesn't match the code of version 4.2."
      fr: "Le plus ancien commit de main ne correspond pas au code de la version 4.2."
    d:
      en: "A feature branch holds one unreleased change, not the code that runs in production."
      fr: "Une branche de fonctionnalité contient une modification non publiée, pas le code qui s'exécute en production."
references:
  - title: Adopt a Git branching strategy
    url: https://learn.microsoft.com/en-us/azure/devops/repos/git/git-branching-guidance
