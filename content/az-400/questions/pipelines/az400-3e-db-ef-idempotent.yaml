id: az400-3e-db-ef-idempotent
objective: "3.4.8"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Adatum has an ASP.NET Core application that uses Entity Framework Core migrations. The application is deployed to four regional Azure SQL databases. Because of past incidents, the databases aren't all at the same migration.

    You need to update the build pipeline so that it produces one artifact that the database administrators can review before production, and that brings every database to the latest migration whatever its current state.

    Which command should the build run?
  fr: |
    Adatum dispose d'une application ASP.NET Core qui utilise les migrations Entity Framework Core. L'application est déployée vers quatre bases de données Azure SQL régionales. À la suite d'incidents passés, les bases ne sont pas toutes au même niveau de migration.

    Vous devez modifier le pipeline de build pour qu'il produise un artefact unique que les administrateurs de bases de données peuvent examiner avant la production, et qui amène chaque base à la dernière migration, quel que soit son état actuel.

    Quelle commande le build doit-il exécuter ?
body:
  options:
    - id: a
      text: "dotnet ef migrations script --output artifacts/migrations.sql"
    - id: b
      text: "dotnet ef database update --connection \"$(ConnectionString)\""
    - id: c
      text: "dotnet ef migrations add Release42 --output-dir Migrations"
    - id: d
      text: "dotnet ef migrations script --idempotent --output artifacts/migrations.sql"
answer: { optionId: d }
explanation:
  correct:
    en: "An idempotent script checks the migrations history table and applies only the migrations that are missing, so the same reviewed SQL file works for databases at different states. Writing it to a file during the build gives the administrators an artifact to review before an approval gate."
    fr: "Un script idempotent vérifie la table d'historique des migrations et n'applique que les migrations manquantes ; le même fichier SQL examiné fonctionne donc pour des bases dans des états différents. L'écrire dans un fichier pendant le build donne aux administrateurs un artefact à examiner avant une approbation."
  options:
    a:
      en: "Without `--idempotent`, the script starts from an empty database (from migration 0) and fails or duplicates objects on databases that already have some migrations."
      fr: "Sans `--idempotent`, le script part d'une base vide (depuis la migration 0) et échoue ou duplique des objets sur les bases qui ont déjà des migrations."
    b:
      en: "`database update` applies the migrations directly; it produces no SQL artifact to review before production."
      fr: "`database update` applique directement les migrations ; il ne produit aucun artefact SQL à examiner avant la production."
    c:
      en: "`migrations add` creates a new migration in the source code; it doesn't produce a deployment artifact."
      fr: "`migrations add` crée une nouvelle migration dans le code source ; il ne produit pas d'artefact de déploiement."
references:
  - title: Applying Migrations - EF Core
    url: https://learn.microsoft.com/en-us/ef/core/managing-schemas/migrations/applying
