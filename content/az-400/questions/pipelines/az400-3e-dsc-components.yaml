id: az400-3e-dsc-components
objective: "3.5.4"
type: dragdrop
difficulty: 3
status: draft
stem:
  en: |
    Proseware is documenting how it keeps server settings in their desired state with Azure Machine Configuration for new servers and Azure Automation State Configuration for legacy servers.

    Which component matches each description? To answer, drag the appropriate components to the correct descriptions. Each component may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware documente la manière dont il maintient les paramètres de ses serveurs dans leur état souhaité, avec Azure Machine Configuration pour les nouveaux serveurs et Azure Automation State Configuration pour les serveurs existants.

    Quel composant correspond à chaque description ? Pour répondre, faites glisser les composants appropriés vers les descriptions correspondantes. Chaque composant peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: assignment, text: { en: "Guest assignment", fr: "Affectation d'invité" } }
    - { id: package, text: { en: "Configuration package (.zip)", fr: "Package de configuration (.zip)" } }
    - { id: dine, text: { en: "Policy definition with the DeployIfNotExists effect", fr: "Définition de stratégie avec l'effet DeployIfNotExists" } }
    - { id: law, text: { en: "Log Analytics workspace", fr: "Espace de travail Log Analytics" } }
    - { id: hrw, text: { en: "Hybrid Runbook Worker", fr: "Runbook Worker hybride" } }
  targets:
    - id: t1
      text: { en: "Machine Configuration: extension resource that links a configuration to one machine and shows its compliance", fr: "Machine Configuration : ressource d'extension qui relie une configuration à une machine et montre sa conformité" }
    - id: t2
      text: { en: "Machine Configuration: compiled MOF file with the DSC resource modules it requires", fr: "Machine Configuration : fichier MOF compilé avec les modules de ressources DSC dont il a besoin" }
    - id: t3
      text: { en: "Machine Configuration: applies the configuration to the machines in scope, including machines created later", fr: "Machine Configuration : applique la configuration aux machines de l'étendue, y compris celles créées ultérieurement" }
    - id: t4
      text: { en: "State Configuration: receives node reporting data for alerting and queries", fr: "State Configuration : reçoit les données de rapport des nœuds pour les alertes et les requêtes" }
answer:
  mapping: { t1: assignment, t2: package, t3: dine, t4: law }
explanation:
  correct:
    en: "A Machine Configuration configuration is modeled as an extension resource of the machine, the guest assignment, whose results appear on the Guest assignments page. The package is a .zip file that contains the compiled MOF and the required modules. A policy definition generated in an apply mode uses DeployIfNotExists to create the assignment on every machine in scope. State Configuration can forward node reporting data to a Log Analytics workspace."
    fr: "Une configuration Machine Configuration est modélisée comme une ressource d'extension de la machine, l'affectation d'invité, dont les résultats apparaissent sur la page des affectations d'invité. Le package est un fichier .zip qui contient le MOF compilé et les modules requis. Une définition de stratégie générée dans un mode d'application utilise DeployIfNotExists pour créer l'affectation sur chaque machine de l'étendue. State Configuration peut transférer les données de rapport des nœuds vers un espace de travail Log Analytics."
  options:
    hrw: { en: "A Hybrid Runbook Worker runs Automation runbooks; it plays no role in either configuration service.", fr: "Un Runbook Worker hybride exécute des runbooks Automation ; il ne joue aucun rôle dans ces deux services de configuration." }
references:
  - title: What is Azure Machine Configuration?
    url: https://learn.microsoft.com/en-us/azure/governance/machine-configuration/overview
  - title: Azure Automation State Configuration overview
    url: https://learn.microsoft.com/en-us/azure/automation/automation-dsc-overview
