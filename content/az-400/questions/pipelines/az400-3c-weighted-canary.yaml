id: az400-3c-weighted-canary
objective: "3.4.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Adatum runs the current version of a public API in an App Service app named **api-v1** and has deployed the new version to a separate app named **api-v2**. Both apps are endpoints of the Azure Traffic Manager profile **tm-api**.

    You need to send about 5 percent of the client traffic to api-v2 first, and then increase that share gradually as the team gains confidence. The solution must not require changes to the application code.

    Which routing method should you configure for tm-api?
  fr: |
    Adatum exécute la version actuelle d'une API publique dans une application App Service nommée **api-v1** et a déployé la nouvelle version dans une application distincte nommée **api-v2**. Les deux applications sont des points de terminaison du profil Azure Traffic Manager **tm-api**.

    Vous devez d'abord envoyer environ 5 % du trafic des clients vers api-v2, puis augmenter progressivement cette part à mesure que l'équipe gagne en confiance. La solution ne doit pas exiger de modifier le code de l'application.

    Quelle méthode de routage devez-vous configurer pour tm-api ?
body:
  options:
    - { id: a, text: Priority }
    - { id: b, text: Performance }
    - { id: c, text: Geographic }
    - { id: d, text: Weighted }
answer: { optionId: d }
explanation:
  correct:
    en: |
      The Weighted routing method returns each endpoint in proportion to its weight (1 to 1000). Giving api-v2 a small weight compared with api-v1 sends it a small share of the traffic, and raising its weight step by step implements a gradual canary rollout.
    fr: |
      La méthode de routage Weighted renvoie chaque point de terminaison en proportion de son poids (1 à 1000). Attribuer à api-v2 un faible poids par rapport à api-v1 lui envoie une petite part du trafic, et augmenter son poids par étapes réalise un déploiement canari progressif.
  options:
    a: { en: "Priority sends all traffic to the highest-priority endpoint and uses the others only for failover.", fr: "Priority envoie tout le trafic vers le point de terminaison prioritaire et n'utilise les autres qu'en cas de basculement." }
    b: { en: "Performance routes each user to the endpoint with the lowest latency, not by a chosen percentage.", fr: "Performance dirige chaque utilisateur vers le point de terminaison de plus faible latence, pas selon un pourcentage choisi." }
    c: { en: "Geographic routes users by the location of their DNS queries, so the share can't be set to 5 percent.", fr: "Geographic dirige les utilisateurs selon l'emplacement de leurs requêtes DNS : la part ne peut pas être fixée à 5 %." }
references:
  - title: Traffic Manager routing methods
    url: https://learn.microsoft.com/en-us/azure/traffic-manager/traffic-manager-routing-methods
