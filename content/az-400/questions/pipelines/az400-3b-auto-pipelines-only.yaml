id: az400-3b-auto-pipelines-only
objective: "3.3.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Litware is comparing GitHub Actions and Azure Pipelines for a new set of deployment pipelines.

    Which two requirements can be met by Azure Pipelines YAML pipelines but have no direct equivalent in GitHub Actions?

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware compare GitHub Actions et Azure Pipelines pour un nouvel ensemble de pipelines de déploiement.

    Quelles sont les deux exigences auxquelles les pipelines YAML Azure Pipelines peuvent répondre mais qui n'ont pas d'équivalent direct dans GitHub Actions ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Require approval by a reviewer before a job deploys to the production environment.", fr: "Exiger l'approbation d'un réviseur avant qu'un travail déploie dans l'environnement de production." } }
    - { id: b, text: { en: "Group jobs into stages, each of which waits for the stages it depends on.", fr: "Regrouper des travaux en phases, chacune attendant les phases dont elle dépend." } }
    - { id: c, text: { en: "Run jobs on self-hosted machines inside the corporate network.", fr: "Exécuter des travaux sur des machines auto-hébergées du réseau de l'entreprise." } }
    - { id: d, text: { en: "Enforce approvals and checks on an agent pool or a service connection for every pipeline that uses it.", fr: "Appliquer des approbations et des vérifications sur un pool d'agents ou une connexion de service pour chaque pipeline qui l'utilise." } }
    - { id: e, text: { en: "Reuse a set of jobs defined in another repository.", fr: "Réutiliser un ensemble de travaux défini dans un autre dépôt." } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |
      Azure Pipelines organizes jobs into stages with `dependsOn`, while a GitHub Actions workflow contains only jobs and steps. Azure Pipelines also attaches approvals and checks to shared resources such as agent pools, service connections and variable groups; GitHub only offers protection rules on environments.
    fr: |
      Azure Pipelines organise les travaux en phases avec `dependsOn`, alors qu'un workflow GitHub Actions ne contient que des jobs et des étapes. Azure Pipelines associe aussi des approbations et des vérifications à des ressources partagées comme les pools d'agents, les connexions de service et les groupes de variables ; GitHub ne propose que des règles de protection sur les environnements.
  options:
    a: { en: "GitHub environments support required reviewers too.", fr: "Les environnements GitHub prennent aussi en charge les réviseurs obligatoires." }
    c: { en: "GitHub Actions supports self-hosted runners.", fr: "GitHub Actions prend en charge les exécuteurs auto-hébergés." }
    e: { en: "GitHub Actions reusable workflows can be called from another repository.", fr: "Les workflows réutilisables GitHub Actions peuvent être appelés depuis un autre dépôt." }
references:
  - title: Define approvals and checks
    url: https://learn.microsoft.com/en-us/azure/devops/pipelines/process/approvals
