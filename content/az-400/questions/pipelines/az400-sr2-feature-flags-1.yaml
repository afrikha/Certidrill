id: az400-sr2-feature-flags-1
objective: "3.4.6"
type: series_yesno
series: az400-sr2-feature-flags
seriesOrder: 1
difficulty: 2
status: draft
stem:
  en: You create the NewCheckout feature flag with a time window filter.
  fr: Vous créez l'indicateur de fonctionnalité NewCheckout avec un filtre de fenêtre temporelle.
body:
  solution:
    en: |
      In the Feature manager of appcs-shop, you create an enabled feature flag named **NewCheckout** and add a **time window** filter (`Microsoft.TimeWindow`) whose `Start` value is the planned beta launch date and that has no `End` value.
    fr: |
      Dans le Gestionnaire de fonctionnalités d'appcs-shop, vous créez un indicateur de fonctionnalité activé nommé **NewCheckout** et ajoutez un filtre de **fenêtre temporelle** (`Microsoft.TimeWindow`) dont la valeur `Start` est la date de lancement prévue de la bêta et qui n'a pas de valeur `End`.
answer: { value: false }
explanation:
  correct:
    en: The time window filter enables a feature for everyone between its `Start` and `End` values; with only `Start`, the feature stays enabled for all users after that time. It has no user or group criteria, so it cannot limit NewCheckout to BetaTesters.
    fr: "Le filtre de fenêtre temporelle active une fonctionnalité pour tout le monde entre ses valeurs `Start` et `End` ; avec seulement `Start`, la fonctionnalité reste activée pour tous les utilisateurs après cette date. Il n'a aucun critère d'utilisateur ni de groupe : il ne peut pas limiter NewCheckout à BetaTesters."
references:
  - title: .NET Feature Flag Management - Azure App Configuration
    url: https://learn.microsoft.com/en-us/azure/azure-app-configuration/feature-management-dotnet-reference
