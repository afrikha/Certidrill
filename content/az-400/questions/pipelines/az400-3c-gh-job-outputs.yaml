id: az400-3c-gh-job-outputs
objective: "3.3.5"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Northwind uses a GitHub Actions workflow. Job **build** computes the tag of a container image in a step whose id is **meta**. Job **deploy** must run after build and pass the tag to its deployment script.

    How should you complete the workflow? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind utilise un workflow GitHub Actions. Le job **build** calcule la balise d'une image conteneur dans une étape dont l'id est **meta**. Le job **deploy** doit s'exécuter après build et transmettre la balise à son script de déploiement.

    Comment devez-vous compléter le workflow ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: yaml
  template: |
    jobs:
      build:
        runs-on: ubuntu-latest
        outputs:
          tag: ${{ [[s2]] }}
        steps:
        - id: meta
          run: echo "tag=1.8.${{ github.run_number }}" >> [[s1]]
      deploy:
        runs-on: ubuntu-latest
        needs: build
        steps:
        - run: ./deploy.sh --tag ${{ [[s3]] }}
  slots:
    - id: s1
      options:
        - { id: ghoutput, text: "\"$GITHUB_OUTPUT\"" }
        - { id: ghenv, text: "\"$GITHUB_ENV\"" }
        - { id: ghsummary, text: "\"$GITHUB_STEP_SUMMARY\"" }
        - { id: ghpath, text: "\"$GITHUB_PATH\"" }
    - id: s2
      options:
        - { id: stepsout, text: steps.meta.outputs.tag }
        - { id: jobsout, text: jobs.build.outputs.tag }
        - { id: envtag, text: env.tag }
    - id: s3
      options:
        - { id: needsout, text: needs.build.outputs.tag }
        - { id: jobsout2, text: jobs.build.outputs.tag }
        - { id: stepsout2, text: steps.meta.outputs.tag }
answer:
  values: { s1: ghoutput, s2: stepsout, s3: needsout }
explanation:
  correct:
    en: |
      A step sets an output by appending `name=value` to the file in `$GITHUB_OUTPUT`. The job maps it to a job output with `steps.<id>.outputs.<name>`, and a dependent job listed with `needs` reads it through the `needs.<job>.outputs.<name>` context.
    fr: |
      Une étape définit une sortie en ajoutant `nom=valeur` au fichier indiqué par `$GITHUB_OUTPUT`. Le job la mappe vers une sortie de job avec `steps.<id>.outputs.<nom>`, et un job dépendant déclaré avec `needs` la lit via le contexte `needs.<job>.outputs.<nom>`.
  options:
    ghenv: { en: "GITHUB_ENV sets environment variables for later steps of the same job, not job outputs.", fr: "GITHUB_ENV définit des variables d'environnement pour les étapes suivantes du même job, pas des sorties de job." }
    ghsummary: { en: "GITHUB_STEP_SUMMARY writes Markdown to the run summary page.", fr: "GITHUB_STEP_SUMMARY écrit du Markdown dans la page de résumé de l'exécution." }
    ghpath: { en: "GITHUB_PATH adds directories to the PATH of later steps.", fr: "GITHUB_PATH ajoute des répertoires au PATH des étapes suivantes." }
    jobsout: { en: "The jobs context is only available in reusable workflows, to map workflow outputs.", fr: "Le contexte jobs n'est disponible que dans les workflows réutilisables, pour mapper les sorties du workflow." }
    envtag: { en: "The step output isn't an environment variable.", fr: "La sortie de l'étape n'est pas une variable d'environnement." }
    jobsout2: { en: "A dependent job reads the outputs of the jobs it needs through the needs context.", fr: "Un job dépendant lit les sorties des jobs dont il dépend via le contexte needs." }
    stepsout2: { en: "The steps context only covers the steps of the current job.", fr: "Le contexte steps ne couvre que les étapes du job en cours." }
references:
  - title: Workflow syntax for GitHub Actions
    url: https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax
