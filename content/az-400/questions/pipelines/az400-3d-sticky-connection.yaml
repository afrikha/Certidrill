id: az400-3d-sticky-connection
objective: "3.4.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Woodgrove Bank has an App Service web app named **app-loans** in the Premium v3 tier. The pipeline deploys each new version to a slot named **staging**, runs integration tests against a test database, and then swaps staging with production.

    After the last swap, production started to use the test database. Each slot must always keep its own database connection string, and deployments must continue to use swaps.

    What should you do?
  fr: |
    Woodgrove Bank dispose d'une application web App Service nommée **app-loans** dans le niveau Premium v3. Le pipeline déploie chaque nouvelle version dans un emplacement nommé **staging**, exécute des tests d'intégration sur une base de données de test, puis permute staging avec la production.

    Après la dernière permutation, la production a commencé à utiliser la base de données de test. Chaque emplacement doit toujours conserver sa propre chaîne de connexion à la base de données, et les déploiements doivent continuer à utiliser des permutations.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Mark the connection string as a deployment slot setting in both slots.", fr: "Marquer la chaîne de connexion comme paramètre d'emplacement de déploiement dans les deux emplacements." }
    - id: b
      text: { en: "Use swap with preview for every deployment.", fr: "Utiliser la permutation avec aperçu pour chaque déploiement." }
    - id: c
      text: { en: "Set WEBSITE_OVERRIDE_PRESERVE_DEFAULT_STICKY_SLOT_SETTINGS to false in both slots.", fr: "Définir WEBSITE_OVERRIDE_PRESERVE_DEFAULT_STICKY_SLOT_SETTINGS sur false dans les deux emplacements." }
    - id: d
      text: { en: "Enable auto swap on the staging slot.", fr: "Activer la permutation automatique sur l'emplacement staging." }
answer: { optionId: a }
explanation:
  correct:
    en: |
      App settings and connection strings move with the content during a swap unless they are marked as deployment slot settings. A sticky connection string stays with its slot, so production keeps the production database and staging keeps the test database after every swap.
    fr: |
      Les paramètres d'application et les chaînes de connexion suivent le contenu lors d'une permutation, sauf s'ils sont marqués comme paramètres d'emplacement de déploiement. Une chaîne de connexion fixée reste dans son emplacement : la production conserve la base de production et staging conserve la base de test après chaque permutation.
  options:
    b:
      en: "Swap with preview only adds a validation pause; the non-sticky connection string still moves to production when the swap completes."
      fr: "La permutation avec aperçu ajoute seulement une pause de validation ; la chaîne de connexion non fixée passe quand même en production à la fin de la permutation."
    c:
      en: "This setting makes some default sticky settings swappable; it doesn't make a connection string sticky."
      fr: "Ce paramètre rend permutables certains paramètres fixés par défaut ; il ne rend pas une chaîne de connexion fixe."
    d:
      en: "Auto swap only automates the swap after each deployment; the connection string would still move."
      fr: "La permutation automatique ne fait qu'automatiser la permutation après chaque déploiement ; la chaîne de connexion serait toujours déplacée."
references:
  - title: Set up staging environments in Azure App Service
    url: https://learn.microsoft.com/en-us/azure/app-service/deploy-staging-slots
