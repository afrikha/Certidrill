id: az400-3b-test-installer
objective: "3.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam runs a YAML pipeline on a self-hosted Windows agent pool named **Build-Win**. The agents have the .NET Framework 4.8 developer pack but no edition of Visual Studio, and the security team doesn't allow Visual Studio to be installed on build servers.

    A new job must run MSTest tests from compiled test assemblies by using the VSTest@3 task. The job fails because no agent in Build-Win meets the `vstest` demand.

    What should you do?
  fr: |
    Fabrikam exécute un pipeline YAML sur un pool d'agents Windows auto-hébergés nommé **Build-Win**. Les agents disposent du pack de développement .NET Framework 4.8 mais d'aucune édition de Visual Studio, et l'équipe de sécurité interdit l'installation de Visual Studio sur les serveurs de build.

    Un nouveau travail doit exécuter des tests MSTest à partir d'assemblys de test compilés avec la tâche VSTest@3. Le travail échoue, car aucun agent de Build-Win ne satisfait la demande `vstest`.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Add a `VisualStudio` demand to the pool section of the job.", fr: "Ajouter une demande `VisualStudio` à la section pool du travail." } }
    - { id: b, text: { en: "Add the VisualStudioTestPlatformInstaller@1 task before VSTest@3 and set `vsTestVersion: toolsInstaller`.", fr: "Ajouter la tâche VisualStudioTestPlatformInstaller@1 avant VSTest@3 et définir `vsTestVersion: toolsInstaller`." } }
    - { id: c, text: { en: "Set `vsTestVersion: latest` in VSTest@3 so that the newest installed version is detected.", fr: "Définir `vsTestVersion: latest` dans VSTest@3 pour que la version installée la plus récente soit détectée." } }
    - { id: d, text: { en: "Set `uiTests: true` in VSTest@3 and configure the agents to run interactively.", fr: "Définir `uiTests: true` dans VSTest@3 et configurer les agents pour qu'ils s'exécutent en mode interactif." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      The Visual Studio Test Platform Installer task acquires the test platform on the agent and satisfies the `vstest` demand when Visual Studio isn't installed. VSTest@3 then uses that platform when `vsTestVersion` is set to `toolsInstaller`, so the tests run without installing Visual Studio.
    fr: |
      La tâche Visual Studio Test Platform Installer obtient la plateforme de test sur l'agent et satisfait la demande `vstest` quand Visual Studio n'est pas installé. VSTest@3 utilise ensuite cette plateforme quand `vsTestVersion` vaut `toolsInstaller` : les tests s'exécutent sans installer Visual Studio.
  options:
    a: { en: "A demand only selects an agent that already has the capability; no agent in Build-Win has Visual Studio.", fr: "Une demande ne fait que choisir un agent qui possède déjà la capacité ; aucun agent de Build-Win n'a Visual Studio." }
    c: { en: "latest picks the newest Visual Studio installed on the agent; there is none.", fr: "latest choisit la version la plus récente de Visual Studio installée sur l'agent ; il n'y en a aucune." }
    d: { en: "uiTests is only a reminder flag, and interactive mode is for UI tests; neither provides the test platform.", fr: "uiTests n'est qu'un indicateur de rappel, et le mode interactif concerne les tests d'interface utilisateur ; aucun des deux ne fournit la plateforme de test." }
references:
  - title: VSTest@3 - Visual Studio Test v3 task
    url: https://learn.microsoft.com/en-us/azure/devops/pipelines/tasks/reference/vstest-v3
