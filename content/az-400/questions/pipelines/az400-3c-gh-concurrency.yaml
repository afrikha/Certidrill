id: az400-3c-gh-concurrency
objective: "3.3.6"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Proseware has a GitHub Actions workflow named **deploy.yml** that runs on every push to the main branch. Its job **deploy** updates the production web app. Developers often push several commits within a few minutes.

    You need to ensure that two runs of job deploy never update production at the same time, and that a deployment that has already started is never stopped by a newer run.

    What should you add to job deploy?
  fr: |
    Proseware dispose d'un workflow GitHub Actions nommé **deploy.yml** qui s'exécute à chaque push sur la branche main. Son job **deploy** met à jour l'application web de production. Les développeurs envoient souvent plusieurs commits en quelques minutes.

    Vous devez vous assurer que deux exécutions du job deploy ne mettent jamais à jour la production en même temps, et qu'un déploiement déjà démarré n'est jamais arrêté par une exécution plus récente.

    Que devez-vous ajouter au job deploy ?
body:
  options:
    - { id: a, text: "concurrency: { group: production, cancel-in-progress: true }" }
    - { id: b, text: "strategy: { max-parallel: 1 }" }
    - { id: c, text: "concurrency: { group: production, cancel-in-progress: false }" }
    - { id: d, text: "timeout-minutes: 60" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      A concurrency group lets only one job or run of the group run at a time; newer runs wait as pending. With `cancel-in-progress: false`, the running deployment is never canceled by a newer run.
    fr: |
      Un groupe de concurrence ne laisse s'exécuter qu'un job ou une exécution du groupe à la fois ; les exécutions plus récentes attendent à l'état en attente. Avec `cancel-in-progress: false`, le déploiement en cours n'est jamais annulé par une exécution plus récente.
  options:
    a: { en: "`cancel-in-progress: true` cancels the running deployment when a newer run starts.", fr: "`cancel-in-progress: true` annule le déploiement en cours quand une exécution plus récente démarre." }
    b: { en: "max-parallel limits the jobs of one matrix inside a run; it doesn't coordinate separate workflow runs.", fr: "max-parallel limite les jobs d'une matrice au sein d'une exécution ; il ne coordonne pas des exécutions distinctes du workflow." }
    d: { en: "A timeout stops long jobs; it doesn't prevent two runs from deploying at the same time.", fr: "Un délai d'expiration arrête les jobs trop longs ; il n'empêche pas deux exécutions de déployer en même temps." }
references:
  - title: Workflow syntax for GitHub Actions
    url: https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax
