id: az400-3e-cs-module-sharing
objective: "3.5.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Adatum's platform team maintains approved Bicep modules for storage accounts, key vaults and virtual networks. Twenty application teams must reuse the modules in their own Bicep files.

    The solution must meet the following requirements:

    - Each module is published with a version, and teams choose the version they reference.
    - Access to the modules is controlled with Azure role-based access control (Azure RBAC).
    - Teams reference a module directly in a `module` statement of their Bicep files.

    Which two solutions meet the requirements? Each correct answer presents a complete solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    L'équipe plateforme d'Adatum maintient des modules Bicep approuvés pour les comptes de stockage, les coffres de clés et les réseaux virtuels. Vingt équipes applicatives doivent réutiliser ces modules dans leurs propres fichiers Bicep.

    La solution doit respecter les exigences suivantes :

    - Chaque module est publié avec une version, et les équipes choisissent la version qu'elles référencent.
    - L'accès aux modules est contrôlé avec le contrôle d'accès en fonction du rôle Azure (Azure RBAC).
    - Les équipes référencent un module directement dans une instruction `module` de leurs fichiers Bicep.

    Quelles sont les deux solutions qui répondent aux exigences ? Chaque bonne réponse constitue une solution complète.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text:
        en: "Publish the modules to a private Bicep registry in Azure Container Registry and reference them with the `br:` scheme."
        fr: "Publier les modules dans un registre Bicep privé dans Azure Container Registry et les référencer avec le schéma `br:`."
    - id: b
      text:
        en: "Upload the modules to an Azure Storage blob container and reference them with their blob URLs."
        fr: "Charger les modules dans un conteneur Stockage Blob Azure et les référencer par leurs URL de blob."
    - id: c
      text:
        en: "Publish the modules as template specs and reference them with the `ts:` scheme."
        fr: "Publier les modules en tant que spécifications de modèle (template specs) et les référencer avec le schéma `ts:`."
    - id: d
      text:
        en: "Publish the modules as universal packages in an Azure Artifacts feed and reference the feed in the module path."
        fr: "Publier les modules en tant que packages universels dans un flux Azure Artifacts et référencer le flux dans le chemin du module."
    - id: e
      text:
        en: "Publish the modules to the public Bicep module registry and reference them with the `br/public:` alias."
        fr: "Publier les modules dans le registre public de modules Bicep et les référencer avec l'alias `br/public:`."
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: "A private module registry hosted in Azure Container Registry stores versioned modules (`br:<registry>.azurecr.io/<path>:<tag>`); publishing requires push permission and using a module requires pull permission. Template specs are versioned Azure resources that Bicep files can reference as modules, and the Template Spec Reader role lets users deploy them without changing them."
    fr: "Un registre de modules privé hébergé dans Azure Container Registry stocke des modules versionnés (`br:<registry>.azurecr.io/<path>:<tag>`) ; la publication exige l'autorisation d'envoi (push) et l'utilisation d'un module l'autorisation d'extraction (pull). Les spécifications de modèle sont des ressources Azure versionnées que les fichiers Bicep peuvent référencer comme modules, et le rôle Template Spec Reader permet de les déployer sans les modifier."
  options:
    b:
      en: "A Bicep module path is a local file, a registry reference or a template spec reference; a blob URL isn't a supported module path."
      fr: "Le chemin d'un module Bicep est un fichier local, une référence de registre ou une référence de spécification de modèle ; une URL de blob n'est pas un chemin de module pris en charge."
    d:
      en: "Bicep can't restore modules from an Azure Artifacts feed, and feed permissions aren't Azure RBAC."
      fr: "Bicep ne peut pas restaurer de modules depuis un flux Azure Artifacts, et les autorisations des flux ne relèvent pas d'Azure RBAC."
    e:
      en: "The public registry hosts modules published by Microsoft for everyone; it isn't a place for an organization's private modules."
      fr: "Le registre public héberge des modules publiés par Microsoft pour tous ; ce n'est pas un emplacement pour les modules privés d'une organisation."
references:
  - title: Create a private registry for Bicep modules
    url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/bicep/private-module-registry
  - title: Azure Resource Manager template specs in Bicep
    url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/bicep/template-specs
