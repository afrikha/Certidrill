id: az400-sr1-prod-approval-3
objective: "3.3.9"
type: series_yesno
series: az400-sr1-prod-approval
seriesOrder: 3
difficulty: 2
status: draft
stem:
  en: You add a branch policy on main that requires a reviewer from Release Approvers.
  fr: Vous ajoutez une stratégie de branche sur main qui exige un réviseur de Release Approvers.
body:
  solution:
    en: |
      For each repository used by the Retail pipelines, you add a branch policy on **main** that automatically includes the Release Approvers group as a **required** reviewer.
    fr: |
      Pour chaque dépôt utilisé par les pipelines Retail, vous ajoutez sur **main** une stratégie de branche qui inclut automatiquement le groupe Release Approvers comme réviseur **obligatoire**.
answer: { value: false }
explanation:
  correct:
    en: A required-reviewer policy controls which pull requests can be merged into main; it does not gate pipeline runs. A run started manually, or from another branch, can still reach the Production stage without any approval, because only checks on the environment control when a stage can consume it.
    fr: "Une stratégie de réviseur obligatoire contrôle quelles pull requests peuvent être fusionnées dans main ; elle ne conditionne pas les exécutions de pipeline. Une exécution lancée manuellement, ou depuis une autre branche, peut encore atteindre la phase Production sans aucune approbation, car seules les vérifications de l'environnement contrôlent quand une phase peut le consommer."
references:
  - title: Define approvals and checks
    url: https://learn.microsoft.com/en-us/azure/devops/pipelines/process/approvals
