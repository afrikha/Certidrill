id: az400-3d-stage-completion-trigger
objective: "3.4.2"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    Contoso has a YAML pipeline named **web-cd** that deploys a web app through the stages Dev, PreProd, and Prod. A separate YAML pipeline in the same project runs load tests by using the **drop** artifact that web-cd consumes.

    The load test pipeline must start automatically as soon as the PreProd stage of a web-cd run from main completes, without waiting for Prod approval. It must test the files of that exact run.

    How should you complete the YAML of the load test pipeline? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso dispose d'un pipeline YAML nommé **web-cd** qui déploie une application web à travers les phases Dev, PreProd et Prod. Un pipeline YAML distinct du même projet exécute des tests de charge à l'aide de l'artefact **drop** que web-cd consomme.

    Le pipeline de tests de charge doit démarrer automatiquement dès que la phase PreProd d'une exécution de web-cd depuis main se termine, sans attendre l'approbation de Prod. Il doit tester les fichiers de cette exécution précise.

    Comment devez-vous compléter le YAML du pipeline de tests de charge ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: yaml
  template: |
    resources:
      pipelines:
      - pipeline: webcd
        source: [[source]]
        trigger:
          branches:
            include:
            - main
          [[filter]]:
          - PreProd

    steps:
    - [[step]]: webcd
      artifact: drop
    - script: ./run-load-test.sh $(Pipeline.Workspace)/webcd/drop
  slots:
    - id: source
      options:
        - { id: srcName, text: web-cd }
        - { id: srcAlias, text: webcd }
        - { id: srcStage, text: PreProd }
    - id: filter
      options:
        - { id: fStages, text: stages }
        - { id: fTags, text: tags }
        - { id: fPaths, text: paths }
    - id: step
      options:
        - { id: stDownload, text: download }
        - { id: stCheckout, text: checkout }
        - { id: stPublish, text: publish }
answer:
  values: { source: srcName, filter: fStages, step: stDownload }
explanation:
  correct:
    en: |
      `source` is the name of the triggering pipeline (web-cd), while `pipeline` is the local alias (webcd). A `stages` filter in the trigger starts the run when the listed stages of the source run complete, so it doesn't wait for Prod. The `download` step with the alias fetches the artifact of the run that triggered the pipeline.
    fr: |
      `source` est le nom du pipeline déclencheur (web-cd), tandis que `pipeline` est l'alias local (webcd). Un filtre `stages` dans le déclencheur démarre l'exécution quand les phases listées de l'exécution source se terminent : il n'attend donc pas Prod. L'étape `download` avec l'alias récupère l'artefact de l'exécution qui a déclenché le pipeline.
  options:
    srcAlias: { en: "webcd is the alias declared by `pipeline`; `source` must name the pipeline itself.", fr: "webcd est l'alias déclaré par `pipeline` ; `source` doit nommer le pipeline lui-même." }
    srcStage: { en: "`source` names a pipeline, not a stage.", fr: "`source` nomme un pipeline, pas une phase." }
    fTags: { en: "A tags filter matches tags on the source run, not the completion of a stage.", fr: "Un filtre tags correspond aux balises de l'exécution source, pas à l'achèvement d'une phase." }
    fPaths: { en: "Pipeline resource triggers have no paths filter; paths filter commits in CI triggers.", fr: "Les déclencheurs de ressource de pipeline n'ont pas de filtre paths ; paths filtre les commits dans les déclencheurs CI." }
    stCheckout: { en: "checkout clones a repository; it doesn't download pipeline artifacts.", fr: "checkout clone un dépôt ; il ne télécharge pas les artefacts de pipeline." }
    stPublish: { en: "publish uploads an artifact from the current run instead of downloading one.", fr: "publish charge un artefact de l'exécution en cours au lieu d'en télécharger un." }
references:
  - title: Trigger one pipeline after another
    url: https://learn.microsoft.com/en-us/azure/devops/pipelines/process/pipeline-triggers
