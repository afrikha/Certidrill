id: az400-3c-manual-stage
objective: "3.3.6"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Northwind has a YAML pipeline with the stages **Build**, **Scan**, **Test** and **Production**, in this order. Scan runs a malware scan that the security team requires. You need to meet the following requirements:

    - Production must not start automatically when Test succeeds; a release manager starts it from the run when the business is ready.
    - Users who select the stages to run when they queue the pipeline must not be able to exclude Scan.

    Which two settings should you add? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind dispose d'un pipeline YAML avec les phases **Build**, **Scan**, **Test** et **Production**, dans cet ordre. Scan exécute une analyse anti-programme malveillant exigée par l'équipe de sécurité. Vous devez respecter les exigences suivantes :

    - Production ne doit pas démarrer automatiquement quand Test réussit ; un responsable des mises en production la démarre depuis l'exécution lorsque l'activité est prête.
    - Les utilisateurs qui sélectionnent les phases à exécuter lors de la mise en file d'attente ne doivent pas pouvoir exclure Scan.

    Quels sont les deux paramètres à ajouter ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "`trigger: manual` on Production", fr: "`trigger: manual` sur Production" } }
    - { id: b, text: { en: "`dependsOn: []` on Production", fr: "`dependsOn: []` sur Production" } }
    - { id: c, text: { en: "`condition: always()` on Scan", fr: "`condition: always()` sur Scan" } }
    - { id: d, text: { en: "`isSkippable: false` on Scan", fr: "`isSkippable: false` sur Scan" } }
    - { id: e, text: { en: "`lockBehavior: sequential` on Production", fr: "`lockBehavior: sequential` sur Production" } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: |
      A stage with `trigger: manual` doesn't start on its own; someone runs it from the pipeline run while the other stages run automatically. `isSkippable: false` greys out the stage in the Stages to run panel, so it can't be excluded from a run.
    fr: |
      Une phase avec `trigger: manual` ne démarre pas d'elle-même ; un utilisateur la lance depuis l'exécution du pipeline, tandis que les autres phases s'exécutent automatiquement. `isSkippable: false` désactive la phase dans le panneau Stages to run : elle ne peut pas être exclue d'une exécution.
  options:
    b: { en: "An empty dependsOn makes Production start at the beginning of the run, in parallel with Build.", fr: "Un dependsOn vide fait démarrer Production au début de l'exécution, en parallèle avec Build." }
    c: { en: "A condition decides whether a stage that is part of the run executes; it doesn't stop users from excluding the stage when they queue the run.", fr: "Une condition décide si une phase incluse dans l'exécution s'exécute ; elle n'empêche pas les utilisateurs d'exclure la phase lors de la mise en file d'attente." }
    e: { en: "lockBehavior orders runs that wait for an exclusive lock; it doesn't wait for a person to start the stage.", fr: "lockBehavior ordonne les exécutions qui attendent un verrou exclusif ; il n'attend pas qu'une personne lance la phase." }
references:
  - title: Add stages, dependencies, and conditions
    url: https://learn.microsoft.com/en-us/azure/devops/pipelines/process/stages
