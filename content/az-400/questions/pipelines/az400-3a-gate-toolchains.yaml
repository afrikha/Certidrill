id: az400-3a-gate-toolchains
objective: "3.2.1"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Proseware uses Azure Repos and Azure Pipelines for its billing platform, and GitHub with GitHub Actions for its mobile backend. You need to implement the following quality and release gates.

    Which feature should you use for each gate? To answer, drag the appropriate features to the correct gates. Each feature may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware utilise Azure Repos et Azure Pipelines pour sa plateforme de facturation, et GitHub avec GitHub Actions pour son back-end mobile. Vous devez implémenter les barrières de qualité et de mise en production suivantes.

    Quelle fonctionnalité devez-vous utiliser pour chaque barrière ? Pour répondre, faites glisser les fonctionnalités appropriées vers les barrières correspondantes. Chaque fonctionnalité peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: policy, text: { en: "A branch policy with build validation", fr: "Une stratégie de branche avec validation de build" } }
    - { id: protect, text: { en: "A branch protection rule with required status checks", fr: "Une règle de protection de branche avec des vérifications d'état obligatoires" } }
    - { id: approvals, text: { en: "An Approvals check on an environment", fr: "Une vérification Approvals sur un environnement" } }
    - { id: reviewers, text: { en: "Required reviewers on an environment", fr: "Des réviseurs obligatoires (required reviewers) sur un environnement" } }
    - { id: codeowners, text: { en: "A CODEOWNERS file", fr: "Un fichier CODEOWNERS" } }
  targets:
    - { id: t1, text: { en: "Billing (Azure Repos): a pull request to main can be completed only if the CI pipeline succeeds.", fr: "Facturation (Azure Repos) : une demande de tirage vers main ne peut être terminée que si le pipeline de CI réussit." } }
    - { id: t2, text: { en: "Mobile backend (GitHub): a pull request to main can be merged only if the CodeQL workflow succeeds.", fr: "Back-end mobile (GitHub) : une demande de tirage vers main ne peut être fusionnée que si le workflow CodeQL réussit." } }
    - { id: t3, text: { en: "Billing (Azure Pipelines YAML): a release manager approves before the Production stage runs.", fr: "Facturation (Azure Pipelines YAML) : un responsable des mises en production approuve avant l'exécution de la phase Production." } }
    - { id: t4, text: { en: "Mobile backend (GitHub Actions): a release manager approves before the deploy job can read the production secrets.", fr: "Back-end mobile (GitHub Actions) : un responsable des mises en production approuve avant que le job de déploiement puisse lire les secrets de production." } }
answer:
  mapping: { t1: policy, t2: protect, t3: approvals, t4: reviewers }
explanation:
  correct:
    en: |
      Before merge, Azure Repos uses branch policies (build validation runs a pipeline for each pull request) and GitHub uses branch protection rules or rulesets with required status checks. Before deployment, YAML pipelines use checks such as Approvals on the environment, and GitHub Actions uses environment protection rules such as required reviewers; a job cannot read environment secrets until a reviewer approves.
    fr: |
      Avant la fusion, Azure Repos utilise des stratégies de branche (la validation de build exécute un pipeline pour chaque demande de tirage) et GitHub utilise des règles de protection de branche ou des ensembles de règles avec des vérifications d'état obligatoires. Avant le déploiement, les pipelines YAML utilisent des vérifications comme Approvals sur l'environnement, et GitHub Actions utilise des règles de protection d'environnement comme les réviseurs obligatoires ; un job ne peut pas lire les secrets d'environnement avant qu'un réviseur approuve.
  options:
    codeowners: { en: "CODEOWNERS requests reviews from the owners of changed files; it does not check a workflow result or gate a deployment.", fr: "CODEOWNERS demande la revue des propriétaires des fichiers modifiés ; il ne vérifie pas le résultat d'un workflow et ne contrôle pas un déploiement." }
references:
  - title: Set and manage branch policies
    url: https://learn.microsoft.com/en-us/azure/devops/repos/git/branch-policies
  - title: Enforce governance with GitHub controls
    url: https://learn.microsoft.com/en-us/training/modules/governance-guardrails-operations/3-enforce-governance-github-controls
