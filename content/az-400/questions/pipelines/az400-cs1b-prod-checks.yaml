id: az400-cs1b-prod-checks
objective: "3.3.8"
type: dragdrop
caseStudy: az400-cs1b-humongous-insurance
difficulty: 1
status: draft
stem:
  en: |
    You are configuring the claims-prod environment to meet the second pipeline requirement.

    Which check should you add to claims-prod for each condition? To answer, drag the appropriate checks to the correct conditions. Each check may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous configurez l'environnement claims-prod pour respecter la deuxième exigence relative aux pipelines.

    Quelle vérification devez-vous ajouter à claims-prod pour chaque condition ? Pour répondre, faites glisser les vérifications appropriées vers les conditions correspondantes. Chaque vérification peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: approvals, text: Approvals }
    - { id: branch, text: Branch control }
    - { id: hours, text: Business hours }
    - { id: alerts, text: Query Azure Monitor alerts }
    - { id: template, text: Required template }
    - { id: lock, text: Exclusive lock }
  targets:
    - id: t1
      text: { en: "A member of Release Managers accepts the deployment", fr: "Un membre de Release Managers accepte le déploiement" }
    - id: t2
      text: { en: "The run was built from the main branch", fr: "L'exécution a été générée à partir de la branche main" }
    - id: t3
      text: { en: "Monday to Friday, 08:00 to 17:00 Eastern Time", fr: "Du lundi au vendredi, de 08:00 à 17:00 (heure de l'Est)" }
    - id: t4
      text: { en: "No fired alert on app-claims-prod", fr: "Aucune alerte déclenchée sur app-claims-prod" }
answer:
  mapping: { t1: approvals, t2: branch, t3: hours, t4: alerts }
explanation:
  correct:
    en: |
      Checks of a YAML environment are configured in the web interface, not in the YAML file, and they replace the pre-deployment conditions of a classic release stage. Approvals waits for a designated user or group, Branch control verifies that the linked resources were built from allowed branches, Business hours holds the stage until the time window is open, and Query Azure Monitor alerts passes only when no alert rule is fired.
    fr: |
      Les vérifications d'un environnement YAML se configurent dans l'interface web, pas dans le fichier YAML, et remplacent les conditions avant déploiement d'une phase de mise en production classique. Approvals attend un utilisateur ou un groupe désigné, Branch control vérifie que les ressources liées ont été générées à partir de branches autorisées, Business hours retient la phase jusqu'à l'ouverture de la fenêtre horaire, et Query Azure Monitor alerts ne réussit que si aucune règle d'alerte n'est déclenchée.
  options:
    template: { en: "Required template makes the run fail unless the pipeline extends a given YAML template; it does not check the branch.", fr: "Required template fait échouer l'exécution si le pipeline n'étend pas un modèle YAML donné ; il ne vérifie pas la branche." }
    lock: { en: "Exclusive lock lets only one run use the environment at a time; it is not tied to a schedule or to alerts.", fr: "Exclusive lock ne laisse qu'une exécution à la fois utiliser l'environnement ; il n'est lié ni à un horaire ni à des alertes." }
references:
  - title: Define approvals and checks
    url: https://learn.microsoft.com/en-us/azure/devops/pipelines/process/approvals
