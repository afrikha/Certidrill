id: az400-3a-gh-package-types
objective: "3.1.1"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    Adatum is moving its source code and its CI workflows to GitHub Enterprise Cloud. The architects want to publish the company's internal packages to GitHub Packages instead of a separate package service.

    Which two package types can Adatum publish to GitHub Packages?

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum migre son code source et ses workflows de CI vers GitHub Enterprise Cloud. Les architectes veulent publier les packages internes de l'entreprise dans GitHub Packages plutôt que dans un service de packages distinct.

    Quels sont les deux types de packages qu'Adatum peut publier dans GitHub Packages ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Python packages for pip", fr: "Des packages Python pour pip" } }
    - { id: b, text: { en: "RubyGems packages", fr: "Des packages RubyGems" } }
    - { id: c, text: "Universal Packages" }
    - { id: d, text: { en: "Cargo crates for Rust", fr: "Des crates Cargo pour Rust" } }
    - { id: e, text: { en: "npm packages", fr: "Des packages npm" } }
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: |
      GitHub Packages offers registries for npm, RubyGems, Maven and Gradle, NuGet, and container images (Docker). Each registry works with the usual client of the ecosystem, such as npm or gem.
    fr: |
      GitHub Packages propose des registres pour npm, RubyGems, Maven et Gradle, NuGet, et les images conteneur (Docker). Chaque registre fonctionne avec le client habituel de l'écosystème, comme npm ou gem.
  options:
    a: { en: "GitHub Packages has no Python registry; Azure Artifacts feeds support Python packages.", fr: "GitHub Packages n'a pas de registre Python ; les flux Azure Artifacts prennent en charge les packages Python." }
    c: { en: "Universal Packages are an Azure Artifacts package type.", fr: "Les packages universels sont un type de package Azure Artifacts." }
    d: { en: "Cargo is supported by Azure Artifacts feeds, not by GitHub Packages.", fr: "Cargo est pris en charge par les flux Azure Artifacts, pas par GitHub Packages." }
references:
  - title: Publish packages
    url: https://learn.microsoft.com/en-us/training/modules/introduction-github-packages/2-publish-packages
  - title: What is Azure Artifacts?
    url: https://learn.microsoft.com/en-us/azure/devops/artifacts/start-using-azure-artifacts
