id: az400-3c-env-checks-hotarea
objective: "3.3.9"
type: hotarea
difficulty: 2
status: draft
stem:
  en: |
    At Litware, the Azure Pipelines environment **prod** has the checks shown in the following table. A YAML pipeline deploys to prod.

    Answer each prompt by selecting the check that decides the outcome.

    NOTE: Each correct selection is worth one point.
  fr: |
    Chez Litware, l'environnement Azure Pipelines **prod** possède les vérifications indiquées dans le tableau suivant. Un pipeline YAML déploie vers prod.

    Répondez à chaque consigne en sélectionnant la vérification qui détermine le résultat.

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
    - id: p1
      text: { en: "A run built from refs/heads/feature/cart reaches the stage. Which check fails the stage?", fr: "Une exécution générée depuis refs/heads/feature/cart atteint la phase. Quelle vérification fait échouer la phase ?" }
    - id: p2
      text: { en: "A run built from refs/heads/main is approved by Release Managers at 14:00 UTC on a Tuesday. No alert is active and no other run uses prod. Which check keeps the stage waiting?", fr: "Une exécution générée depuis refs/heads/main est approuvée par Release Managers à 14 h 00 UTC un mardi. Aucune alerte n'est active et aucune autre exécution n'utilise prod. Quelle vérification fait attendre la phase ?" }
  grid:
    header: [{ en: Check, fr: Vérification }, { en: Configuration, fr: Configuration }]
    rows:
      - [{ text: Approvals, area: approvals }, { text: { en: "Approvers: Release Managers", fr: "Approbateurs : Release Managers" } }]
      - [{ text: Branch control, area: branch }, { text: { en: "Allowed branches: refs/heads/main, refs/heads/release/*", fr: "Branches autorisées : refs/heads/main, refs/heads/release/*" } }]
      - [{ text: Business hours, area: hours }, { text: { en: "Monday to Friday, 20:00 to 23:00 (UTC)", fr: "Du lundi au vendredi, de 20 h 00 à 23 h 00 (UTC)" } }]
      - [{ text: Query Azure Monitor alerts, area: alerts }, { text: { en: "Severity 0 and 1 alert rules of shop-api", fr: "Règles d'alerte de gravité 0 et 1 de shop-api" } }]
      - [{ text: Exclusive lock, area: lock }, { text: "—" }]
answer:
  values: { p1: branch, p2: hours }
explanation:
  correct:
    en: |
      Branch control is a static check, evaluated first, that fails the stage when a resource comes from a branch that isn't in the allowed list; feature/cart isn't allowed. For the run from main, the approval is given, no alert is active and the lock is free, but 14:00 UTC is outside the business hours window, so the Business hours check keeps the stage waiting until 20:00.
    fr: |
      Branch control est une vérification statique, évaluée en premier, qui fait échouer la phase quand une ressource provient d'une branche absente de la liste autorisée ; feature/cart n'est pas autorisée. Pour l'exécution issue de main, l'approbation est donnée, aucune alerte n'est active et le verrou est libre, mais 14 h 00 UTC est hors de la plage Business hours : cette vérification fait attendre la phase jusqu'à 20 h 00.
references:
  - title: Define approvals and checks
    url: https://learn.microsoft.com/en-us/azure/devops/pipelines/process/approvals
