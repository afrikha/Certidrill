id: az400-3e-cs-bicepparam
objective: "3.5.2"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    Tailspin deploys a Bicep file named **main.bicep** to production. You are writing the production parameters file **prod.bicepparam**.

    The file must meet the following requirements:

    - Provide the values of the parameters declared in main.bicep.
    - Read the SQL administrator password from the secret **sqlAdminPassword** in the key vault **kv-tailspin-prod**, so that the password never appears in the repository.

    How should you complete the file? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin déploie en production un fichier Bicep nommé **main.bicep**. Vous écrivez le fichier de paramètres de production **prod.bicepparam**.

    Le fichier doit respecter les exigences suivantes :

    - Fournir les valeurs des paramètres déclarés dans main.bicep.
    - Lire le mot de passe d'administrateur SQL dans le secret **sqlAdminPassword** du coffre de clés **kv-tailspin-prod**, afin que le mot de passe n'apparaisse jamais dans le dépôt.

    Comment devez-vous compléter le fichier ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: bicep
  template: |
    [[kw]] 'main.bicep'

    param environmentName = 'prod'
    param appServiceSku = 'P1v3'
    param sqlAdminLogin = 'sqladmin'
    param sqlAdminPassword = [[fn]]('<subscription-id>', 'rg-secrets', 'kv-tailspin-prod', 'sqlAdminPassword')
  slots:
    - id: kw
      options:
        - { id: using, text: using }
        - { id: import, text: import }
        - { id: extends, text: extends }
        - { id: target, text: targetScope }
    - id: fn
      options:
        - { id: getsecret, text: az.getSecret }
        - { id: reference, text: reference }
        - { id: listkeys, text: listKeys }
        - { id: envvar, text: readEnvironmentVariable }
answer:
  values: { kw: using, fn: getsecret }
explanation:
  correct:
    en: "A .bicepparam file starts with a `using` statement that links it to the Bicep file whose parameters it sets. `az.getSecret()` takes the subscription ID, the resource group, the key vault name and the secret name (and optionally a version) and passes the secret to a secure parameter at deployment time."
    fr: "Un fichier .bicepparam commence par une instruction `using` qui le lie au fichier Bicep dont il définit les paramètres. `az.getSecret()` prend l'ID d'abonnement, le groupe de ressources, le nom du coffre de clés et le nom du secret (et éventuellement une version), et transmet le secret à un paramètre sécurisé au moment du déploiement."
  options:
    import: { en: "import brings types or variables from another Bicep file; it doesn't link a parameters file to a template.", fr: "import apporte des types ou des variables d'un autre fichier Bicep ; il ne lie pas un fichier de paramètres à un modèle." }
    extends: { en: "extends inherits values from a base .bicepparam file, not from a .bicep file.", fr: "extends hérite des valeurs d'un fichier .bicepparam de base, pas d'un fichier .bicep." }
    target: { en: "targetScope sets the deployment scope inside a Bicep file.", fr: "targetScope définit l'étendue de déploiement dans un fichier Bicep." }
    envvar: { en: "readEnvironmentVariable reads an environment variable of the machine that builds the file, not a Key Vault secret.", fr: "readEnvironmentVariable lit une variable d'environnement de la machine qui compile le fichier, pas un secret Key Vault." }
references:
  - title: Create parameters files for Bicep deployment
    url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/bicep/parameter-files
  - title: Use Azure Key Vault to pass a secret as a parameter during Bicep deployment
    url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/bicep/key-vault-parameter
