id: az400-3b-gh-app-install
objective: "3.3.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Proseware stores its code in a GitHub organization named **proseware-eng**. A developer who has the Write role on the **web-store** repository tries to create an Azure Pipelines pipeline that uses the Azure Pipelines GitHub App, but the installation of the app can't be completed.

    Who can install the Azure Pipelines GitHub App for web-store?
  fr: |
    Proseware stocke son code dans une organisation GitHub nommée **proseware-eng**. Un développeur qui a le rôle Write sur le dépôt **web-store** tente de créer un pipeline Azure Pipelines qui utilise l'application GitHub Azure Pipelines, mais l'installation de l'application ne peut pas aboutir.

    Qui peut installer l'application GitHub Azure Pipelines pour web-store ?
body:
  options:
    - { id: a, text: { en: "A member of the Project Administrators group of the Azure DevOps project", fr: "Un membre du groupe Project Administrators du projet Azure DevOps" } }
    - { id: b, text: { en: "A member of the Project Collection Administrators group of the Azure DevOps organization", fr: "Un membre du groupe Project Collection Administrators de l'organisation Azure DevOps" } }
    - { id: c, text: { en: "Any collaborator who has the Maintain role on web-store", fr: "Tout collaborateur qui a le rôle Maintain sur web-store" } }
    - { id: d, text: { en: "An owner of the proseware-eng organization or an admin of the web-store repository", fr: "Un propriétaire de l'organisation proseware-eng ou un administrateur du dépôt web-store" } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Installing the Azure Pipelines GitHub App is a GitHub operation: it requires a GitHub organization owner or a repository admin. Once the app is installed for the repository, developers can create pipelines that use it.
    fr: |
      L'installation de l'application GitHub Azure Pipelines est une opération GitHub : elle exige un propriétaire de l'organisation GitHub ou un administrateur du dépôt. Une fois l'application installée pour le dépôt, les développeurs peuvent créer des pipelines qui l'utilisent.
  options:
    a: { en: "Azure DevOps permissions don't allow installing apps in a GitHub organization.", fr: "Les autorisations Azure DevOps ne permettent pas d'installer des applications dans une organisation GitHub." }
    b: { en: "Project Collection Administrators manage Azure DevOps, not GitHub app installations.", fr: "Les Project Collection Administrators gèrent Azure DevOps, pas les installations d'applications GitHub." }
    c: { en: "The Maintain role doesn't include installing GitHub Apps; an admin or an organization owner is required.", fr: "Le rôle Maintain ne permet pas d'installer des applications GitHub ; il faut un administrateur ou un propriétaire de l'organisation." }
references:
  - title: Build GitHub repositories
    url: https://learn.microsoft.com/en-us/azure/devops/pipelines/repos/github
