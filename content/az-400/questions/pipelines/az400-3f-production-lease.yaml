id: az400-3f-production-lease
objective: "3.6.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Litware has a multi-stage YAML pipeline named **claims-cd** with the stages Build, Test and Production. The project retention settings keep runs for 30 days, and this value must not change.

    Every run that deploys to production must be kept for 365 days with its artifacts, automatically and without any manual action. Runs that do not reach the Production stage must follow the project retention settings.

    What should you do?
  fr: |
    Litware dispose d'un pipeline YAML à phases multiples nommé **claims-cd** avec les phases Build, Test et Production. Les paramètres de rétention du projet conservent les exécutions pendant 30 jours, et cette valeur ne doit pas changer.

    Chaque exécution qui effectue un déploiement en production doit être conservée pendant 365 jours avec ses artefacts, automatiquement et sans aucune action manuelle. Les exécutions qui n'atteignent pas la phase Production doivent suivre les paramètres de rétention du projet.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Configure a retention policy of 365 days on the Production environment", fr: "Configurer une stratégie de rétention de 365 jours sur l'environnement Production" } }
    - { id: b, text: { en: "Add a step to the Production stage that calls the Leases - Add REST API with daysValid set to 365", fr: "Ajouter à la phase Production une étape qui appelle l'API REST Leases - Add avec daysValid défini sur 365" } }
    - { id: c, text: { en: "Set Number of recent runs to retain per pipeline to 365 in the project settings", fr: "Définir le nombre d'exécutions récentes à conserver par pipeline sur 365 dans les paramètres du projet" } }
    - { id: d, text: { en: "Add a release retention policy of 365 days for the Production stage in Release retention", fr: "Ajouter une stratégie de rétention des mises en production de 365 jours pour la phase Production dans Release retention" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      A retention lease prevents automated retention from deleting a run for the number of days given in daysValid. A script step in the Production stage can add the lease with the definition ID and run ID of the current run, so only the runs that reach production are kept longer, while the others follow the 30-day project setting.
    fr: |
      Un bail de rétention empêche la rétention automatique de supprimer une exécution pendant le nombre de jours indiqué dans daysValid. Une étape de script dans la phase Production peut ajouter le bail avec l'ID de définition et l'ID de l'exécution en cours : seules les exécutions qui atteignent la production sont conservées plus longtemps, les autres suivant le paramètre de 30 jours du projet.
  options:
    a: { en: "Retention of multi-stage YAML pipelines is configured only in the project settings, not per environment.", fr: "La rétention des pipelines YAML à phases multiples se configure uniquement dans les paramètres du projet, pas par environnement." }
    c: { en: "This setting keeps the latest runs whatever their stage, and it applies to every pipeline of the project.", fr: "Ce paramètre conserve les dernières exécutions quelle que soit leur phase, et il s'applique à tous les pipelines du projet." }
    d: { en: "Release retention applies to classic release pipelines, not to YAML pipelines.", fr: "La rétention des mises en production s'applique aux pipelines de mise en production classiques, pas aux pipelines YAML." }
references:
  - title: Retention policies
    url: https://learn.microsoft.com/en-us/azure/devops/pipelines/policies/retention
  - title: Leases - Add
    url: https://learn.microsoft.com/en-us/rest/api/azure/devops/build/leases/add
