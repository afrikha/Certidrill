id: az400-3e-iac-whatif-types
objective: "3.5.3"
type: hotarea
difficulty: 3
status: draft
stem:
  en: |
    Proseware runs `az deployment group what-if` in a pull request pipeline before each deployment of a Bicep file to a resource group named **rg1**. A storage account named **stlegacy01** exists in rg1, but no Bicep file declares it.

    The what-if result can report the change types shown in the following table.

    Answer each prompt by selecting the change type that what-if reports.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware exécute `az deployment group what-if` dans un pipeline de demande de tirage avant chaque déploiement d'un fichier Bicep vers un groupe de ressources nommé **rg1**. Un compte de stockage nommé **stlegacy01** existe dans rg1, mais aucun fichier Bicep ne le déclare.

    Le résultat what-if peut indiquer les types de modifications figurant dans le tableau suivant.

    Répondez à chaque consigne en sélectionnant le type de modification indiqué par what-if.

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
    - id: p1
      text: { en: "stlegacy01, when the what-if runs in the default deployment mode", fr: "stlegacy01, lorsque le what-if s'exécute dans le mode de déploiement par défaut" }
    - id: p2
      text: { en: "stlegacy01, when the what-if runs with `--mode Complete`", fr: "stlegacy01, lorsque le what-if s'exécute avec `--mode Complete`" }
  grid:
    caption: { en: "What-if change types", fr: "Types de modifications what-if" }
    header: [ { en: "Change type", fr: "Type de modification" } ]
    rows:
      - [ { text: Create, area: create } ]
      - [ { text: Delete, area: delete } ]
      - [ { text: Ignore, area: ignore } ]
      - [ { text: NoChange, area: nochange } ]
      - [ { text: Modify, area: modify } ]
      - [ { text: Deploy, area: deploy } ]
answer:
  values: { p1: ignore, p2: delete }
explanation:
  correct:
    en: "The default mode is Incremental, which leaves resources that aren't in the template untouched, so what-if reports stlegacy01 as Ignore. The Delete change type applies only in Complete mode, where Resource Manager deletes resources of the resource group that the template doesn't contain."
    fr: "Le mode par défaut est Incremental, qui laisse intactes les ressources absentes du modèle : what-if indique donc stlegacy01 comme Ignore. Le type de modification Delete ne s'applique qu'en mode Complete, dans lequel Resource Manager supprime les ressources du groupe de ressources que le modèle ne contient pas."
references:
  - title: Bicep deployment what-if operation
    url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/bicep/deploy-what-if
  - title: Azure Resource Manager deployment modes
    url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/templates/deployment-modes
