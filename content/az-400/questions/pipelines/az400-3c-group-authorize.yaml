id: az400-3c-group-authorize
objective: "3.3.8"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You add `- group: shop-prod` to the `variables` block of an existing YAML pipeline at Adatum. The variable group contains secret variables. The first run pauses with a message saying that the pipeline needs permission to access a resource.

    You need to let this pipeline use the variable group. The other pipelines of the project must not get access to it.

    What should you do?
  fr: |
    Vous ajoutez `- group: shop-prod` au bloc `variables` d'un pipeline YAML existant chez Adatum. Le groupe de variables contient des variables secrètes. La première exécution se met en pause avec un message indiquant que le pipeline a besoin d'une autorisation pour accéder à une ressource.

    Vous devez permettre à ce pipeline d'utiliser le groupe de variables. Les autres pipelines du projet ne doivent pas y avoir accès.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Select Open access on the variable group.", fr: "Sélectionner Open access sur le groupe de variables." } }
    - { id: b, text: { en: "Link the variable group to an Azure key vault.", fr: "Lier le groupe de variables à un coffre de clés Azure." } }
    - { id: c, text: { en: "Mark the variables of the group as non-secret.", fr: "Marquer les variables du groupe comme non secrètes." } }
    - { id: d, text: { en: "Add the pipeline to the Pipeline permissions of the variable group.", fr: "Ajouter le pipeline aux Pipeline permissions du groupe de variables." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      A variable group is a protected resource: a pipeline that references it must be authorized, otherwise anyone who can push YAML could read its secrets. Adding this pipeline under Pipeline permissions, or selecting Permit on the paused run, authorizes only this pipeline.
    fr: |
      Un groupe de variables est une ressource protégée : un pipeline qui le référence doit être autorisé, sinon toute personne pouvant pousser du YAML pourrait lire ses secrets. Ajouter ce pipeline dans Pipeline permissions, ou sélectionner Permit sur l'exécution en pause, n'autorise que ce pipeline.
  options:
    a: { en: "Open access authorizes every pipeline of the project, which the requirement forbids.", fr: "Open access autorise tous les pipelines du projet, ce que l'exigence interdit." }
    b: { en: "Linking to Key Vault changes where the secrets come from, not which pipelines may use the group.", fr: "La liaison à Key Vault change la provenance des secrets, pas les pipelines autorisés à utiliser le groupe." }
    c: { en: "Removing the secret flag exposes the values and doesn't authorize the pipeline.", fr: "Retirer l'indicateur secret expose les valeurs et n'autorise pas le pipeline." }
references:
  - title: Manage variable groups
    url: https://learn.microsoft.com/en-us/azure/devops/pipelines/library/variable-groups
