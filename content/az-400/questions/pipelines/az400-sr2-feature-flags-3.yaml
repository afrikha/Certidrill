id: az400-sr2-feature-flags-3
objective: "3.4.6"
type: series_yesno
series: az400-sr2-feature-flags
seriesOrder: 3
difficulty: 2
status: draft
stem:
  en: You add a FeatureManagement application setting in App Service.
  fr: Vous ajoutez un paramètre d'application FeatureManagement dans App Service.
body:
  solution:
    en: |
      In the **Environment variables** settings of the ShopWeb app, you add the application setting `FeatureManagement__NewCheckout` with the value `true`. To extend NewCheckout later, the product owner edits this setting.
    fr: |
      Dans les paramètres **Environment variables** de l'application ShopWeb, vous ajoutez le paramètre d'application `FeatureManagement__NewCheckout` avec la valeur `true`. Pour étendre NewCheckout plus tard, le product owner modifie ce paramètre.
answer: { value: false }
explanation:
  correct:
    en: A Boolean flag declared in configuration is on or off for every user, so it cannot target BetaTesters only. In addition, App Service restarts the app whenever an app setting is added, removed or edited, which breaks the no-restart requirement.
    fr: "Un indicateur booléen déclaré dans la configuration est activé ou désactivé pour tous les utilisateurs : il ne peut pas cibler uniquement BetaTesters. De plus, App Service redémarre l'application chaque fois qu'un paramètre d'application est ajouté, supprimé ou modifié, ce qui enfreint l'exigence de ne pas redémarrer."
references:
  - title: Configure an App Service App - Azure App Service
    url: https://learn.microsoft.com/en-us/azure/app-service/configure-common
  - title: .NET Feature Flag Management - Azure App Configuration
    url: https://learn.microsoft.com/en-us/azure/azure-app-configuration/feature-management-dotnet-reference
