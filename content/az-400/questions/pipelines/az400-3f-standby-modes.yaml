id: az400-3f-standby-modes
objective: "3.6.3"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Northwind Traders has four Managed DevOps Pools pools. Each pool has different requirements for its standby agents.

    Which standby agent setting should you configure for each pool? To answer, drag the appropriate settings to the correct pools. Each setting may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind Traders dispose de quatre pools Managed DevOps Pools. Chaque pool a des exigences différentes pour ses agents en attente.

    Quel paramètre d'agents en attente devez-vous configurer pour chaque pool ? Pour répondre, faites glisser les paramètres appropriés vers les pools correspondants. Chaque paramètre peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: off, text: Off }
    - { id: weekday, text: { en: "Manual, weekday scheme", fr: "Manual, schéma jours de semaine (weekday)" } }
    - { id: allweek, text: { en: "Manual, all-week scheme", fr: "Manual, schéma toute la semaine (all-week)" } }
    - { id: cheap, text: { en: "Automatic, Most cost effective", fr: "Automatic, Most cost effective" } }
    - { id: balanced, text: { en: "Automatic, Balanced", fr: "Automatic, Balanced" } }
    - { id: fast, text: { en: "Automatic, Best performance", fr: "Automatic, Best performance" } }
  targets:
    - { id: t1, text: { en: "Pool1: provision agents only when a job is queued and accept waits of several minutes", fr: "Pool1 : provisionner des agents seulement lorsqu'un travail est en file d'attente et accepter des attentes de plusieurs minutes" } }
    - { id: t2, text: { en: "Pool2: keep agents ready on weekdays between 08:00 and 18:00 only", fr: "Pool2 : garder des agents prêts en semaine entre 8 h et 18 h uniquement" } }
    - { id: t3, text: { en: "Pool3: forecast demand from past usage and favor the lowest cost", fr: "Pool3 : prévoir la demande à partir de l'utilisation passée et privilégier le coût le plus bas" } }
    - { id: t4, text: { en: "Pool4: forecast demand from past usage and favor the shortest wait", fr: "Pool4 : prévoir la demande à partir de l'utilisation passée et privilégier l'attente la plus courte" } }
answer:
  mapping: { t1: off, t2: weekday, t3: cheap, t4: fast }
explanation:
  correct:
    en: |
      With standby agent mode Off (the default), agents are provisioned on demand and a job can wait up to about 15 minutes. The Manual mode offers a weekday scheme with a start and end time on weekdays. The Automatic mode forecasts demand from the last three weeks; Most cost effective uses the 10th percentile and Best performance the 90th, while Balanced (50th) is in between.
    fr: |
      Avec le mode d'agents en attente Off (par défaut), les agents sont provisionnés à la demande et un travail peut attendre jusqu'à environ 15 minutes. Le mode Manual propose un schéma jours de semaine avec une heure de début et de fin en semaine. Le mode Automatic prévoit la demande à partir des trois dernières semaines ; Most cost effective utilise le 10e centile et Best performance le 90e, tandis que Balanced (50e) se situe entre les deux.
  options:
    allweek: { en: "The all-week scheme keeps a fixed number of agents available at all times, including nights and weekends.", fr: "Le schéma toute la semaine garde en permanence un nombre fixe d'agents disponibles, y compris la nuit et le week-end." }
    balanced: { en: "Balanced is the default middle setting and favors neither cost nor wait time.", fr: "Balanced est le réglage intermédiaire par défaut et ne privilégie ni le coût ni le temps d'attente." }
references:
  - title: Configure scaling
    url: https://learn.microsoft.com/en-us/azure/devops/managed-devops-pools/configure-scaling
