id: az400-3a-gate-gh-env-rules
objective: "3.2.1"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Adatum uses GitHub Enterprise Cloud. A private repository has an environment named **production** with the following deployment protection rules:

    - Required reviewers: three users, Prevent self-review enabled.
    - Wait timer: enabled.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum utilise GitHub Enterprise Cloud. Un dépôt privé possède un environnement nommé **production** avec les règles de protection de déploiement suivantes :

    - Réviseurs obligatoires : trois utilisateurs, Prevent self-review activé.
    - Minuteur d'attente : activé.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          A job that targets production waits until all three reviewers approve it.
        fr: |
          Un job qui cible production attend que les trois réviseurs l'aient approuvé.
    - id: s2
      text:
        en: |
          The wait timer can delay a job for up to 30 days.
        fr: |
          Le minuteur d'attente peut retarder un job jusqu'à 30 jours.
    - id: s3
      text:
        en: |
          One of the three reviewers who triggers a workflow run can approve that run's deployment to production.
        fr: |
          Un des trois réviseurs qui déclenche une exécution de workflow peut approuver le déploiement de cette exécution vers production.
answer:
  values: { s1: false, s2: true, s3: false }
explanation:
  correct:
    en: |
      Up to six users or teams can be required reviewers, and the approval of only one of them is needed. A wait timer is an integer number of minutes between 1 and 43,200, which is 30 days. With Prevent self-review enabled, the user who started the deployment cannot approve it, even if that user is a required reviewer.
    fr: |
      Jusqu'à six utilisateurs ou équipes peuvent être réviseurs obligatoires, et l'approbation d'un seul d'entre eux suffit. Un minuteur d'attente est un nombre entier de minutes compris entre 1 et 43 200, soit 30 jours. Avec Prevent self-review activé, l'utilisateur qui a lancé le déploiement ne peut pas l'approuver, même s'il fait partie des réviseurs obligatoires.
references:
  - title: Enforce governance with GitHub controls
    url: https://learn.microsoft.com/en-us/training/modules/governance-guardrails-operations/3-enforce-governance-github-controls
