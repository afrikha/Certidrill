id: az400-3d-resiliency-mitigations
objective: "3.4.5"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Contoso is designing a resiliency strategy for the deployments of a customer portal. The portal runs on Azure App Service in the Premium v3 tier, with three instances and a staging slot, in two regions. It is deployed by an Azure Pipelines YAML pipeline.

    Which mitigation should you use for each risk? To answer, drag the appropriate mitigations to the correct risks. Each mitigation may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso conçoit une stratégie de résilience pour les déploiements d'un portail client. Le portail s'exécute sur Azure App Service dans le niveau Premium v3, avec trois instances et un emplacement staging, dans deux régions. Il est déployé par un pipeline YAML Azure Pipelines.

    Quelle atténuation devez-vous utiliser pour chaque risque ? Pour répondre, faites glisser les atténuations appropriées vers les risques correspondants. Chaque atténuation peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: retry, text: { en: "retryCountOnTaskFailure on the task", fr: "retryCountOnTaskFailure sur la tâche" } }
    - { id: health, text: { en: "App Service Health check path", fr: "Chemin de contrôle d'intégrité App Service" } }
    - { id: afd, text: { en: "Azure Front Door with an origin in each region", fr: "Azure Front Door avec une origine dans chaque région" } }
    - { id: swapBack, text: { en: "Swap the staging and production slots again", fr: "Permuter de nouveau les emplacements staging et production" } }
    - { id: lock, text: { en: "Exclusive lock check on the environment", fr: "Vérification Exclusive lock sur l'environnement" } }
    - { id: delay, text: { en: "Delay task before the deployment", fr: "Tâche Delay avant le déploiement" } }
  targets:
    - id: t1
      text: { en: "The deployment task sometimes fails because of a transient network error", fr: "La tâche de déploiement échoue parfois à cause d'une erreur réseau transitoire" }
    - id: t2
      text: { en: "After a deployment, one instance hangs and keeps receiving requests", fr: "Après un déploiement, une instance se bloque et continue de recevoir des requêtes" }
    - id: t3
      text: { en: "A whole region becomes unavailable while a release is being deployed there", fr: "Une région entière devient indisponible pendant le déploiement d'une version dans cette région" }
    - id: t4
      text: { en: "A defect is found in production ten minutes after the last swap", fr: "Un défaut est détecté en production dix minutes après la dernière permutation" }
answer:
  mapping: { t1: retry, t2: health, t3: afd, t4: swapBack }
explanation:
  correct:
    en: |
      A task retry absorbs transient errors without rerunning the stage. Health check pings each instance and removes an instance that keeps failing from the load balancer rotation. Front Door routes users to the healthy region when the other one is unavailable. After a swap, the previous version is still in the staging slot, so swapping again restores it within minutes.
    fr: |
      Une relance de tâche absorbe les erreurs transitoires sans relancer la phase. Le contrôle d'intégrité interroge chaque instance et retire de la rotation de l'équilibreur de charge une instance qui échoue de manière répétée. Front Door achemine les utilisateurs vers la région saine quand l'autre est indisponible. Après une permutation, la version précédente se trouve encore dans l'emplacement staging : permuter de nouveau la restaure en quelques minutes.
  options:
    lock: { en: "An Exclusive lock check serializes runs; it doesn't recover from any of these failures.", fr: "Une vérification Exclusive lock sérialise les exécutions ; elle ne permet de récupérer d'aucune de ces défaillances." }
    delay: { en: "Waiting before deploying doesn't make the deployment or the app more resilient.", fr: "Attendre avant de déployer ne rend ni le déploiement ni l'application plus résilients." }
references:
  - title: Monitor App Service instances by using Health check
    url: https://learn.microsoft.com/en-us/azure/app-service/monitor-instances-health-check
  - title: Task types and usage
    url: https://learn.microsoft.com/en-us/azure/devops/pipelines/process/tasks
