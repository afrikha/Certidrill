id: az400-3f-schedule-cron
objective: "3.6.5"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    Adatum is migrating a classic build pipeline to YAML. The classic pipeline has a scheduled trigger that builds main every Monday to Friday at 01:30 in the time zone of the organization, which is UTC+03:00 and does not observe daylight saving time. The classic trigger is configured to build even when nothing changed since the last scheduled run.

    You need the YAML pipeline to build at exactly the same times and under the same conditions.

    How should you complete the YAML? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum migre un pipeline de build classique vers YAML. Le pipeline classique a un déclencheur planifié qui génère main du lundi au vendredi à 1 h 30 dans le fuseau horaire de l'organisation, UTC+03:00, sans heure d'été. Le déclencheur classique est configuré pour générer même si rien n'a changé depuis la dernière exécution planifiée.

    Le pipeline YAML doit générer exactement aux mêmes moments et dans les mêmes conditions.

    Comment devez-vous compléter le YAML ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: yaml
  template: |
    schedules:
    - cron: [[cron]]
      displayName: Nightly build
      branches:
        include:
        - main
      always: [[always]]
  slots:
    - id: cron
      options:
        - { id: local, text: "'30 1 * * Mon-Fri'" }
        - { id: noshift, text: "'30 22 * * Mon-Fri'" }
        - { id: shifted, text: "'30 22 * * Sun-Thu'" }
        - { id: swapped, text: "'22 30 * * Sun-Thu'" }
    - id: always
      options:
        - { id: "yes", text: "true" }
        - { id: "no", text: "false" }
answer:
  values: { cron: shifted, always: "yes" }
explanation:
  correct:
    en: |
      YAML schedules are always in UTC, whereas classic schedules use the organization's time zone. 01:30 at UTC+03:00 is 22:30 UTC on the previous day, so Monday to Friday becomes Sunday to Thursday, with the fields in the order minutes, hours, day, month, day of week. always defaults to false, which skips the run when nothing changed, so it must be true.
    fr: |
      Les planifications YAML sont toujours en UTC, alors que les planifications classiques utilisent le fuseau horaire de l'organisation. 1 h 30 à UTC+03:00 correspond à 22 h 30 UTC la veille : du lundi au vendredi devient du dimanche au jeudi, avec les champs dans l'ordre minutes, heures, jour, mois, jour de la semaine. always vaut false par défaut, ce qui ignore l'exécution quand rien n'a changé : il doit donc valoir true.
  options:
    local: { en: "The cron expression would be read as 01:30 UTC, three hours later than the classic schedule.", fr: "L'expression cron serait lue comme 1 h 30 UTC, trois heures après la planification classique." }
    noshift: { en: "22:30 UTC on Monday to Friday is 01:30 local time on Tuesday to Saturday.", fr: "22 h 30 UTC du lundi au vendredi correspond à 1 h 30 heure locale du mardi au samedi." }
    swapped: { en: "The first field is the minutes and the second the hours; 30 is not a valid hour.", fr: "Le premier champ correspond aux minutes et le deuxième aux heures ; 30 n'est pas une heure valide." }
    "no": { en: "With always set to false, the scheduled run is skipped when the code did not change.", fr: "Avec always défini sur false, l'exécution planifiée est ignorée quand le code n'a pas changé." }
references:
  - title: Configure schedules for pipelines
    url: https://learn.microsoft.com/en-us/azure/devops/pipelines/process/scheduled-triggers
  - title: Migrate your Classic pipeline to YAML
    url: https://learn.microsoft.com/en-us/azure/devops/pipelines/release/from-classic-pipelines
