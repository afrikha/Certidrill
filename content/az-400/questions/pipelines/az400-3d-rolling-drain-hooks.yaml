id: az400-3d-rolling-drain-hooks
objective: "3.4.3"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    Northwind Traders runs a web application on six Linux virtual machines behind an Azure Standard Load Balancer. The health probe of the load balancer requests **/probe** on each machine. The machines are registered as resources in an Azure Pipelines environment named **web-prod**.

    You write a deployment job that uses the `rolling` strategy with `maxParallel: 2`. The repository provides two scripts:

    - **drain.sh** makes /probe return HTTP 503, so the load balancer stops sending new requests to the machine.
    - **undrain.sh** makes /probe return HTTP 200 again.

    Each machine must stop receiving user traffic before its files are replaced and must receive traffic again once the new version is installed.

    Which two actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind Traders exécute une application web sur six machines virtuelles Linux derrière un Azure Standard Load Balancer. La sonde d'intégrité de l'équilibreur de charge interroge **/probe** sur chaque machine. Les machines sont inscrites comme ressources dans un environnement Azure Pipelines nommé **web-prod**.

    Vous écrivez un travail de déploiement qui utilise la stratégie `rolling` avec `maxParallel: 2`. Le dépôt fournit deux scripts :

    - **drain.sh** fait renvoyer HTTP 503 par /probe : l'équilibreur de charge cesse d'envoyer de nouvelles requêtes à la machine.
    - **undrain.sh** fait de nouveau renvoyer HTTP 200 par /probe.

    Chaque machine doit cesser de recevoir le trafic des utilisateurs avant le remplacement de ses fichiers, et recevoir de nouveau le trafic une fois la nouvelle version installée.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text: { en: "Run drain.sh in the `on: success` hook.", fr: "Exécuter drain.sh dans le hook `on: success`." }
    - id: b
      text: { en: "Run drain.sh in the `preDeploy` hook.", fr: "Exécuter drain.sh dans le hook `preDeploy`." }
    - id: c
      text: { en: "Run undrain.sh in the `preDeploy` hook.", fr: "Exécuter undrain.sh dans le hook `preDeploy`." }
    - id: d
      text: { en: "Run undrain.sh in the `routeTraffic` hook.", fr: "Exécuter undrain.sh dans le hook `routeTraffic`." }
    - id: e
      text: { en: "Set `maxParallel` to `100%`.", fr: "Définir `maxParallel` sur `100%`." }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |
      With the rolling strategy, the lifecycle hooks run for each batch of `maxParallel` machines, in the order preDeploy, deploy, routeTraffic, postRouteTraffic. Draining in preDeploy takes the two machines of the batch out of rotation before deploy replaces the files, and undraining in routeTraffic serves traffic to the new version, while the four other machines keep serving users.
    fr: |
      Avec la stratégie rolling, les hooks de cycle de vie s'exécutent pour chaque lot de `maxParallel` machines, dans l'ordre preDeploy, deploy, routeTraffic, postRouteTraffic. Vider la machine dans preDeploy retire les deux machines du lot de la rotation avant que deploy remplace les fichiers, et la remettre en service dans routeTraffic envoie le trafic vers la nouvelle version, pendant que les quatre autres machines continuent de servir les utilisateurs.
  options:
    a:
      en: "`on: success` runs only after the deployment hooks complete, so the files would be replaced while the machine still receives traffic, and nothing would put it back in rotation."
      fr: "`on: success` ne s'exécute qu'après les hooks de déploiement : les fichiers seraient remplacés alors que la machine reçoit encore du trafic, et rien ne la remettrait en rotation."
    c:
      en: "Undraining before deploy sends traffic to a machine whose files are being replaced."
      fr: "Remettre la machine en service avant deploy envoie du trafic vers une machine dont les fichiers sont en cours de remplacement."
    e:
      en: "100% deploys to all six machines at once, so no machine is left to serve users."
      fr: "100% déploie sur les six machines à la fois : aucune machine ne reste pour servir les utilisateurs."
references:
  - title: Deployment jobs
    url: https://learn.microsoft.com/en-us/azure/devops/pipelines/process/deployment-jobs
