id: az400-3e-dsc-stack-deny
objective: "3.5.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Litware deploys its production resources to a resource group named **rg-erp-prod** from a pipeline that uses a service principal named **sp-erp-deploy**. Operators have the Contributor role on rg-erp-prod, which they need for other tasks. An operator recently deleted a database by mistake.

    You need to prevent everyone except sp-erp-deploy from deleting the resources that the pipeline deploys. The pipeline must still be able to update the resources and delete those removed from the template.

    What should you do?
  fr: |
    Litware déploie ses ressources de production dans un groupe de ressources nommé **rg-erp-prod** depuis un pipeline qui utilise un principal de service nommé **sp-erp-deploy**. Les opérateurs disposent du rôle Contributor sur rg-erp-prod, dont ils ont besoin pour d'autres tâches. Un opérateur a récemment supprimé une base de données par erreur.

    Vous devez empêcher tout le monde, sauf sp-erp-deploy, de supprimer les ressources que le pipeline déploie. Le pipeline doit toujours pouvoir mettre à jour les ressources et supprimer celles retirées du modèle.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text:
        en: "Add a CanNotDelete lock to rg-erp-prod and keep the Contributor role of the operators."
        fr: "Ajouter un verrou Suppression (CanNotDelete) à rg-erp-prod et conserver le rôle Contributor des opérateurs."
    - id: b
      text:
        en: "Add a ReadOnly lock to rg-erp-prod and assign the Owner role to sp-erp-deploy."
        fr: "Ajouter un verrou Lecture seule (ReadOnly) à rg-erp-prod et attribuer le rôle Owner à sp-erp-deploy."
    - id: c
      text:
        en: "Deploy the template with sp-erp-deploy in Complete mode every night to recreate missing resources."
        fr: "Déployer le modèle avec sp-erp-deploy en mode Complete chaque nuit pour recréer les ressources manquantes."
    - id: d
      text:
        en: "Deploy the template as a deployment stack with the deny settings mode `denyDelete` and sp-erp-deploy as an excluded principal."
        fr: "Déployer le modèle comme pile de déploiement avec le mode de paramètres de refus `denyDelete` et sp-erp-deploy comme principal exclu."
answer: { optionId: d }
explanation:
  correct:
    en: "Deny settings make the stack create a deny assignment on the resources it manages, which blocks control plane deletes even for Contributors. Up to five principals can be excluded, so the pipeline's service principal keeps full control. Managing a stack with deny settings requires the Azure Deployment Stack Owner role."
    fr: "Les paramètres de refus font créer par la pile une attribution de refus sur les ressources qu'elle gère, ce qui bloque les suppressions sur le plan de contrôle, même pour les Contributors. Jusqu'à cinq principaux peuvent être exclus : le principal de service du pipeline garde donc le contrôle total. La gestion d'une pile avec paramètres de refus exige le rôle Azure Deployment Stack Owner."
  options:
    a:
      en: "A lock applies to every user and service principal, so the pipeline could no longer delete the resources removed from the template."
      fr: "Un verrou s'applique à tous les utilisateurs et principaux de service : le pipeline ne pourrait plus supprimer les ressources retirées du modèle."
    b:
      en: "A lock applies whatever the role, even Owner, and a ReadOnly lock also blocks updates, including the pipeline's deployments."
      fr: "Un verrou s'applique quel que soit le rôle, même Owner, et un verrou Lecture seule bloque aussi les mises à jour, y compris les déploiements du pipeline."
    c:
      en: "A recreated database is empty; nightly redeployment doesn't prevent the deletion or the data loss."
      fr: "Une base de données recréée est vide ; un redéploiement nocturne n'empêche ni la suppression ni la perte de données."
references:
  - title: Create and deploy Azure deployment stacks in Bicep
    url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/bicep/deployment-stacks
