id: az400-3f-pipeline-resource-trigger
objective: "3.6.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam is migrating a classic release pipeline to YAML. The classic release has a continuous deployment trigger on the artifact of the build pipeline, filtered on the main branch.

    The build is now the YAML pipeline **inventory-ci**, and the deployment is the YAML pipeline **inventory-cd**. You need inventory-cd to start automatically each time a run of inventory-ci on main completes, and to consume the artifacts of that run.

    What should you add to inventory-cd?
  fr: |
    Fabrikam migre un pipeline de mise en production classique vers YAML. La mise en production classique a un déclencheur de déploiement continu sur l'artefact du pipeline de build, filtré sur la branche main.

    Le build est maintenant le pipeline YAML **inventory-ci**, et le déploiement le pipeline YAML **inventory-cd**. Vous devez faire en sorte qu'inventory-cd démarre automatiquement chaque fois qu'une exécution d'inventory-ci sur main se termine, et qu'il consomme les artefacts de cette exécution.

    Que devez-vous ajouter à inventory-cd ?
body:
  options:
    - { id: a, text: { en: "A CI trigger whose branches include main", fr: "Un déclencheur CI dont les branches incluent main" } }
    - { id: b, text: { en: "A pipeline resource whose source is inventory-ci, with a trigger that includes main", fr: "Une ressource de pipeline dont la source est inventory-ci, avec un déclencheur qui inclut main" } }
    - { id: c, text: { en: "A scheduled trigger that runs every 15 minutes on main with always set to true", fr: "Un déclencheur planifié qui s'exécute toutes les 15 minutes sur main avec always défini sur true" } }
    - { id: d, text: { en: "A dependsOn property that references inventory-ci on the first stage", fr: "Une propriété dependsOn qui référence inventory-ci sur la première phase" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Under resources.pipelines, a pipeline resource names the pipeline that produces the artifacts in source, and its trigger with a branch filter starts the current pipeline when a run of that pipeline completes on a matching branch. The artifacts of the triggering run can then be downloaded from the resource.
    fr: |
      Sous resources.pipelines, une ressource de pipeline indique dans source le pipeline qui produit les artefacts, et son déclencheur avec un filtre de branche démarre le pipeline actuel quand une exécution de ce pipeline se termine sur une branche correspondante. Les artefacts de l'exécution déclenchante peuvent ensuite être téléchargés depuis la ressource.
  options:
    a: { en: "A CI trigger starts the pipeline on pushes to the repository, not when another pipeline completes.", fr: "Un déclencheur CI démarre le pipeline sur les push vers le dépôt, pas quand un autre pipeline se termine." }
    c: { en: "A schedule runs at fixed times whether or not a new build exists, and it does not identify the triggering run.", fr: "Une planification s'exécute à heures fixes qu'un nouveau build existe ou non, et elle n'identifie pas l'exécution déclenchante." }
    d: { en: "dependsOn orders stages or jobs inside the same pipeline; it cannot reference another pipeline.", fr: "dependsOn ordonne des phases ou des travaux dans le même pipeline ; il ne peut pas référencer un autre pipeline." }
references:
  - title: resources.pipelines.pipeline definition
    url: https://learn.microsoft.com/en-us/azure/devops/pipelines/yaml-schema/resources-pipelines-pipeline
