id: az400-3d-lib-pipeline-trigger
objective: "3.4.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam has two YAML pipelines in the same Azure DevOps project. The **pricing-lib-ci** pipeline builds a shared library and publishes it as a pipeline artifact. The **pricing-app-cd** pipeline deploys an application that embeds the library, and its code is in a different repository.

    Each new version of the library must be deployed with the application automatically, but only after a run of pricing-lib-ci on the main branch completes. The solution must not rely on timing assumptions.

    What should you configure in pricing-app-cd?
  fr: |
    Fabrikam dispose de deux pipelines YAML dans le même projet Azure DevOps. Le pipeline **pricing-lib-ci** génère une bibliothèque partagée et la publie sous forme d'artefact de pipeline. Le pipeline **pricing-app-cd** déploie une application qui intègre la bibliothèque, et son code se trouve dans un autre dépôt.

    Chaque nouvelle version de la bibliothèque doit être déployée automatiquement avec l'application, mais seulement après la fin d'une exécution de pricing-lib-ci sur la branche main. La solution ne doit pas reposer sur des hypothèses de durée.

    Que devez-vous configurer dans pricing-app-cd ?
body:
  options:
    - id: a
      text: { en: "A scheduled trigger that runs pricing-app-cd every 30 minutes on main", fr: "Un déclencheur planifié qui exécute pricing-app-cd toutes les 30 minutes sur main" }
    - id: b
      text: { en: "A CI trigger with a path filter on the folder of the library", fr: "Un déclencheur CI avec un filtre de chemin sur le dossier de la bibliothèque" }
    - id: c
      text: { en: "A pipeline resource for pricing-lib-ci with a trigger filtered on main", fr: "Une ressource de pipeline pour pricing-lib-ci avec un déclencheur filtré sur main" }
    - id: d
      text: { en: "A dependsOn entry that names pricing-lib-ci on the first stage", fr: "Une entrée dependsOn qui nomme pricing-lib-ci sur la première phase" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      A pipeline completion trigger is declared under `resources.pipelines` with `source: pricing-lib-ci` and a `trigger` whose branch filter includes main. pricing-app-cd then starts only when a matching run of the library pipeline completes, and it can download that run's artifact through the resource alias.
    fr: |
      Un déclencheur d'achèvement de pipeline se déclare sous `resources.pipelines` avec `source: pricing-lib-ci` et un `trigger` dont le filtre de branche inclut main. pricing-app-cd ne démarre alors qu'à la fin d'une exécution correspondante du pipeline de la bibliothèque, et peut télécharger l'artefact de cette exécution grâce à l'alias de la ressource.
  options:
    a:
      en: "A schedule runs regardless of whether the library build has finished, which is a timing assumption."
      fr: "Une planification s'exécute que la build de la bibliothèque soit terminée ou non, ce qui est une hypothèse de durée."
    b:
      en: "The library code is in another repository, so a CI trigger of pricing-app-cd never sees its commits, and a commit is not a completed build anyway."
      fr: "Le code de la bibliothèque se trouve dans un autre dépôt : un déclencheur CI de pricing-app-cd ne voit jamais ses commits, et un commit n'est de toute façon pas une build terminée."
    d:
      en: "dependsOn orders stages and jobs inside one pipeline; it can't reference another pipeline."
      fr: "dependsOn ordonne les phases et les travaux d'un même pipeline ; il ne peut pas référencer un autre pipeline."
references:
  - title: Trigger one pipeline after another
    url: https://learn.microsoft.com/en-us/azure/devops/pipelines/process/pipeline-triggers
