id: az400-3a-gate-gh-env-secrets
objective: "3.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Wingtip has a private repository in GitHub Enterprise Cloud. Its deployment workflow reads a production API key that is stored as a repository secret, so every job of every workflow in the repository can read it.

    You need to ensure that only the job that deploys to production can read the key, and only after a member of the **release-managers** team approves the deployment.

    What should you do?
  fr: |
    Wingtip dispose d'un dépôt privé dans GitHub Enterprise Cloud. Son workflow de déploiement lit une clé d'API de production stockée comme secret de dépôt : chaque job de chaque workflow du dépôt peut la lire.

    Vous devez faire en sorte que seul le job qui déploie en production puisse lire la clé, et uniquement après l'approbation du déploiement par un membre de l'équipe **release-managers**.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Add a CODEOWNERS entry that makes release-managers the owners of the workflow files", fr: "Ajouter une entrée CODEOWNERS qui fait de release-managers les propriétaires des fichiers de workflow" } }
    - { id: b, text: { en: "Move the key to an organization secret whose access policy allows only this repository", fr: "Déplacer la clé dans un secret d'organisation dont la stratégie d'accès n'autorise que ce dépôt" } }
    - { id: c, text: { en: "Add a branch protection rule on main that requires an approving review from release-managers", fr: "Ajouter sur main une règle de protection de branche qui exige une revue approuvée par release-managers" } }
    - { id: d, text: { en: "Store the key as a secret of an environment that has release-managers as required reviewers", fr: "Stocker la clé comme secret d'un environnement qui a release-managers comme réviseurs obligatoires" } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Environment secrets are available only to jobs that reference the environment, here the production deploy job. When the environment has required reviewers, the job waits, and it cannot access the environment secrets until one of the reviewers approves it.
    fr: |
      Les secrets d'environnement ne sont disponibles que pour les jobs qui référencent l'environnement, ici le job de déploiement en production. Quand l'environnement a des réviseurs obligatoires, le job attend et ne peut pas accéder aux secrets de l'environnement tant qu'un des réviseurs n'a pas approuvé.
  options:
    b: { en: "An organization secret restricted to the repository is still readable by every job of the repository, without approval.", fr: "Un secret d'organisation limité au dépôt reste lisible par chaque job du dépôt, sans approbation." }
    c: { en: "A branch protection rule controls merges into main, not which job can read a secret at deployment time.", fr: "Une règle de protection de branche contrôle les fusions dans main, pas le job qui peut lire un secret au moment du déploiement." }
    a: { en: "CODEOWNERS requests reviews of changes to workflow files; it does not protect secrets at run time.", fr: "CODEOWNERS demande la revue des modifications des fichiers de workflow ; il ne protège pas les secrets à l'exécution." }
references:
  - title: Enforce governance with GitHub controls
    url: https://learn.microsoft.com/en-us/training/modules/governance-guardrails-operations/3-enforce-governance-github-controls
