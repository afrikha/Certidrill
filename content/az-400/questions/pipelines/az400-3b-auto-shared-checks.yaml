id: az400-3b-auto-shared-checks
objective: "3.3.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Adatum uses Azure Boards and Azure Repos in an Azure DevOps organization. Every deployment to production must use one Azure Resource Manager service connection named **sc-prod**.

    The security team requires that an approval and a business hours check be enforced on sc-prod itself, so that they apply to every pipeline that uses it, whoever writes the pipeline.

    You need to select the deployment automation solution. What should you use?
  fr: |
    Adatum utilise Azure Boards et Azure Repos dans une organisation Azure DevOps. Chaque déploiement en production doit utiliser une même connexion de service Azure Resource Manager nommée **sc-prod**.

    L'équipe de sécurité exige qu'une approbation et une vérification des heures ouvrables soient appliquées sur sc-prod elle-même, afin qu'elles concernent chaque pipeline qui l'utilise, quel que soit son auteur.

    Vous devez sélectionner la solution d'automatisation du déploiement. Que devez-vous utiliser ?
body:
  options:
    - { id: a, text: { en: "GitHub Actions workflows that deploy to a production environment", fr: "Des workflows GitHub Actions qui déploient dans un environnement production" } }
    - { id: b, text: { en: "Azure Pipelines YAML pipelines", fr: "Des pipelines YAML Azure Pipelines" } }
    - { id: c, text: { en: "GitHub Actions reusable workflows called from each repository", fr: "Des workflows réutilisables GitHub Actions appelés depuis chaque dépôt" } }
    - { id: d, text: { en: "GitHub Actions workflows that run on a self-hosted runner group", fr: "Des workflows GitHub Actions qui s'exécutent sur un groupe d'exécuteurs auto-hébergés" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      In Azure Pipelines, approvals and checks such as business hours are defined on protected resources, including service connections, agent pools, variable groups and environments. They run for every YAML pipeline run that uses the resource, so the protection doesn't depend on how each pipeline is written.
    fr: |
      Dans Azure Pipelines, les approbations et les vérifications, comme les heures ouvrables, sont définies sur des ressources protégées, notamment les connexions de service, les pools d'agents, les groupes de variables et les environnements. Elles s'exécutent pour chaque exécution de pipeline YAML qui utilise la ressource : la protection ne dépend pas de la manière dont chaque pipeline est écrit.
  options:
    a: { en: "GitHub environment protection rules apply only to jobs that reference the environment; a workflow can deploy without it.", fr: "Les règles de protection d'environnement GitHub ne s'appliquent qu'aux jobs qui référencent l'environnement ; un workflow peut déployer sans lui." }
    c: { en: "Reusable workflows share steps, but each caller decides whether to use them.", fr: "Les workflows réutilisables partagent des étapes, mais chaque appelant décide de les utiliser ou non." }
    d: { en: "A runner group controls where jobs run, not approvals on a deployment credential.", fr: "Un groupe d'exécuteurs contrôle l'endroit où les jobs s'exécutent, pas les approbations sur des informations d'identification de déploiement." }
references:
  - title: Define approvals and checks
    url: https://learn.microsoft.com/en-us/azure/devops/pipelines/process/approvals
