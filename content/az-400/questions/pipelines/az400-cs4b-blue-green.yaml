id: az400-cs4b-blue-green
objective: "3.4.1"
type: single
caseStudy: az400-cs4b-alpine-ski-house
difficulty: 2
status: draft
stem:
  en: |
    You need to recommend a deployment strategy for booking-service that meets requirement 8. What should you recommend?
  fr: |
    Vous devez recommander pour booking-service une stratégie de déploiement qui satisfait l'exigence 8. Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "Add a staging deployment slot to ca-booking, test the new version in the slot, and then swap the slot into production.", fr: "Ajouter un emplacement de déploiement staging à ca-booking, tester la nouvelle version dans cet emplacement, puis le permuter en production." } }
    - { id: b, text: { en: "Keep the single revision mode and let Container Apps replace the running revision once the new revision is ready.", fr: "Conserver le mode de révision unique et laisser Container Apps remplacer la révision en cours dès que la nouvelle révision est prête." } }
    - { id: c, text: { en: "Deploy the new version to a second container app and route traffic between both apps by using weighted Azure Front Door origins.", fr: "Déployer la nouvelle version dans une deuxième application de conteneur et répartir le trafic entre les deux avec des origines pondérées Azure Front Door." } }
    - { id: d, text: { en: "Switch ca-booking to multiple revision mode, label the revisions blue and green, and move the traffic weights between the labels.", fr: "Passer ca-booking en mode de révisions multiples, étiqueter les révisions blue et green, et déplacer les pondérations de trafic entre les étiquettes." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      A blue-green deployment in Azure Container Apps requires the multiple revision mode, which allows traffic weights. The green revision receives no production traffic but is reachable at its label-specific URL for QA; az containerapp ingress traffic set then moves 100 percent of the traffic to green, and the same command moves it back to blue in seconds, with no new resource.
    fr: |
      Un déploiement bleu/vert dans Azure Container Apps exige le mode de révisions multiples, qui autorise les pondérations de trafic. La révision green ne reçoit aucun trafic de production mais reste joignable pour la QA par l'URL propre à son étiquette ; az containerapp ingress traffic set fait ensuite passer 100 pour cent du trafic vers green, et la même commande le ramène vers blue en quelques secondes, sans nouvelle ressource.
  options:
    a:
      en: |
        Deployment slots are an App Service feature; Azure Container Apps uses revisions and labels instead.
      fr: |
        Les emplacements de déploiement sont une fonctionnalité d'App Service ; Azure Container Apps utilise à la place des révisions et des étiquettes.
    b:
      en: |
        In single revision mode, the new revision takes all the traffic as soon as it is ready, so QA cannot test it apart from production, and traffic weights, which need the multiple revision mode, are not available to move the traffic back.
      fr: |
        En mode de révision unique, la nouvelle révision prend tout le trafic dès qu'elle est prête : la QA ne peut pas la tester à l'écart de la production, et les pondérations de trafic, qui exigent le mode de révisions multiples, ne sont pas disponibles pour ramener le trafic.
    c:
      en: |
        A second container app and an Azure Front Door profile are additional Azure resources, which requirement 8 forbids.
      fr: |
        Une deuxième application de conteneur et un profil Azure Front Door sont des ressources Azure supplémentaires, ce que l'exigence 8 interdit.
references:
  - title: Blue-Green Deployment in Azure Container Apps
    url: https://learn.microsoft.com/en-us/azure/container-apps/blue-green-deployment
