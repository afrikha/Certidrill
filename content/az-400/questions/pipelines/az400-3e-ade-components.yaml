id: az400-3e-ade-components
objective: "3.5.5"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Northwind is setting up Azure Deployment Environments for its development teams. You are explaining the components of the service to the platform team.

    Which component matches each description? To answer, drag the appropriate components to the correct descriptions. Each component may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind met en place Azure Deployment Environments pour ses équipes de développement. Vous expliquez les composants du service à l'équipe plateforme.

    Quel composant correspond à chaque description ? Pour répondre, faites glisser les composants appropriés vers les descriptions correspondantes. Chaque composant peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: devcenter, text: { en: "Dev center", fr: "Centre de développement" } }
    - { id: catalog, text: { en: "Catalog", fr: "Catalogue" } }
    - { id: definition, text: { en: "Environment definition", fr: "Définition d'environnement" } }
    - { id: pet, text: { en: "Project environment type", fr: "Type d'environnement de projet" } }
    - { id: environment, text: { en: "Environment", fr: "Environnement" } }
    - { id: stack, text: { en: "Deployment stack", fr: "Pile de déploiement" } }
  targets:
    - id: t1
      text: { en: "Collection of projects that share settings; also used by Microsoft Dev Box", fr: "Collection de projets qui partagent des paramètres ; également utilisée par Microsoft Dev Box" }
    - id: t2
      text: { en: "Repository in GitHub or Azure DevOps scanned for IaC templates and their manifests", fr: "Dépôt GitHub ou Azure DevOps analysé pour y trouver des modèles IaC et leurs manifestes" }
    - id: t3
      text: { en: "IaC template combined with an environment.yaml file", fr: "Modèle IaC associé à un fichier environment.yaml" }
    - id: t4
      text: { en: "Sets the deployment subscription, the managed identity and the developers' access for one project", fr: "Définit l'abonnement de déploiement, l'identité managée et l'accès des développeurs pour un projet" }
answer:
  mapping: { t1: devcenter, t2: catalog, t3: definition, t4: pet }
explanation:
  correct:
    en: "The dev center groups projects with similar settings and is shared with Dev Box. A catalog is a GitHub or Azure DevOps repository folder that the service scans for environment definitions. An environment definition combines an IaC template and its environment.yaml manifest. A project environment type maps a dev center environment type to a target subscription, a deployment identity and access levels for one project."
    fr: "Le centre de développement regroupe des projets aux paramètres similaires et est partagé avec Dev Box. Un catalogue est un dossier de dépôt GitHub ou Azure DevOps que le service analyse pour y trouver des définitions d'environnement. Une définition d'environnement associe un modèle IaC et son manifeste environment.yaml. Un type d'environnement de projet associe, pour un projet, un type d'environnement du centre de développement à un abonnement cible, à une identité de déploiement et à des niveaux d'accès."
  options:
    environment: { en: "An environment is the set of Azure resources deployed from a definition.", fr: "Un environnement est l'ensemble des ressources Azure déployées à partir d'une définition." }
    stack: { en: "A deployment stack is an Azure Resource Manager feature, not a Deployment Environments component.", fr: "Une pile de déploiement est une fonctionnalité d'Azure Resource Manager, pas un composant de Deployment Environments." }
references:
  - title: Key concepts for Azure Deployment Environments
    url: https://learn.microsoft.com/en-us/azure/deployment-environments/concept-environments-key-concepts
