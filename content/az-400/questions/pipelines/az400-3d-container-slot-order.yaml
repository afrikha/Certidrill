id: az400-3d-container-slot-order
objective: "3.4.7"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    Contoso has an App Service app on Linux in the Premium v3 tier, configured as Web App for Containers, with a slot named **staging**. A YAML pipeline in Azure Pipelines must release each new version of the container image with no downtime, and the new version must be tested before production users reach it.

    Which four actions should the pipeline perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Contoso dispose d'une application App Service sous Linux dans le niveau Premium v3, configurée en tant que Web App for Containers, avec un emplacement nommé **staging**. Un pipeline YAML dans Azure Pipelines doit publier chaque nouvelle version de l'image conteneur sans interruption de service, et la nouvelle version doit être testée avant que les utilisateurs de production l'atteignent.

    Quelles sont les quatre actions que le pipeline doit effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: smoke, text: { en: "Run smoke tests against the URL of the staging slot.", fr: "Exécuter des tests de fumée sur l'URL de l'emplacement staging." } }
    - { id: build, text: { en: "Build the image and push it to Azure Container Registry with a tag set to the build ID.", fr: "Générer l'image et l'envoyer vers Azure Container Registry avec une balise égale à l'ID de build." } }
    - { id: autoswap, text: { en: "Enable auto swap from staging to production.", fr: "Activer la permutation automatique de staging vers la production." } }
    - { id: swap, text: { en: "Swap the staging slot with production by using AzureAppServiceManage@0.", fr: "Permuter l'emplacement staging avec la production à l'aide d'AzureAppServiceManage@0." } }
    - { id: deployStaging, text: { en: "Deploy the image to the staging slot by using AzureWebAppContainer@1.", fr: "Déployer l'image dans l'emplacement staging à l'aide d'AzureWebAppContainer@1." } }
    - { id: deployProd, text: { en: "Deploy the image to the production slot by using AzureWebAppContainer@1.", fr: "Déployer l'image dans l'emplacement de production à l'aide d'AzureWebAppContainer@1." } }
answer:
  sequence: [ build, deployStaging, smoke, swap ]
explanation:
  correct:
    en: |
      The image is built and pushed once with an immutable tag, then deployed to the staging slot, which receives no production traffic. After the smoke tests pass, the Swap Slots action warms up the staging instances and switches routing, so production has no downtime and the previous version stays in staging for a quick rollback.
    fr: |
      L'image est générée et envoyée une seule fois avec une balise immuable, puis déployée dans l'emplacement staging, qui ne reçoit pas de trafic de production. Une fois les tests de fumée réussis, l'action Swap Slots préchauffe les instances de staging et bascule le routage : la production ne subit aucune interruption et la version précédente reste dans staging pour une restauration rapide.
  options:
    autoswap: { en: "Auto swap isn't supported for Web App for Containers, and it would swap before the smoke tests run.", fr: "La permutation automatique n'est pas prise en charge pour Web App for Containers, et elle permuterait avant l'exécution des tests de fumée." }
    deployProd: { en: "Deploying directly to production skips the tests and restarts the production app.", fr: "Déployer directement en production contourne les tests et redémarre l'application de production." }
references:
  - title: Set up staging environments in Azure App Service
    url: https://learn.microsoft.com/en-us/azure/app-service/deploy-staging-slots
  - title: AzureWebAppContainer@1 - Azure Web App for Containers v1 task
    url: https://learn.microsoft.com/en-us/azure/devops/pipelines/tasks/reference/azure-web-app-container-v1
