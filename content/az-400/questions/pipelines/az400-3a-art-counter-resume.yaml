id: az400-3a-art-counter-resume
objective: "3.1.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    The YAML pipeline of the library **Adatum.Rates** contains the following definition:

    ```yaml
    variables:
      majorMinor: '2.6'
      patch: $[counter(variables['majorMinor'], 0)]
    name: $(majorMinor).$(patch)
    ```

    The pipeline ran five times with majorMinor set to 2.6 (2.6.0 to 2.6.4). The team then set majorMinor to 2.7, and the pipeline ran three times (2.7.0 to 2.7.2). To ship a hotfix of the 2.6 line, a developer sets majorMinor back to 2.6 and runs the pipeline once.

    What is the run number of the hotfix run?
  fr: |
    Le pipeline YAML de la bibliothèque **Adatum.Rates** contient la définition suivante :

    ```yaml
    variables:
      majorMinor: '2.6'
      patch: $[counter(variables['majorMinor'], 0)]
    name: $(majorMinor).$(patch)
    ```

    Le pipeline s'est exécuté cinq fois avec majorMinor défini sur 2.6 (2.6.0 à 2.6.4). L'équipe a ensuite défini majorMinor sur 2.7, et le pipeline s'est exécuté trois fois (2.7.0 à 2.7.2). Pour livrer un correctif de la ligne 2.6, un développeur remet majorMinor sur 2.6 et exécute le pipeline une fois.

    Quel est le numéro d'exécution de l'exécution du correctif ?
shuffle: false
body:
  options:
    - { id: a, text: "2.6.0" }
    - { id: b, text: "2.6.3" }
    - { id: c, text: "2.6.5" }
    - { id: d, text: "2.6.8" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      counter tracks a separate value for each prefix. When a prefix is used again, the counter resumes where it left off for that prefix. The prefix 2.6 last produced 4, so the next run with 2.6 produces 5 and the run number is 2.6.5. Counters are scoped to the pipeline.
    fr: |
      counter suit une valeur distincte pour chaque préfixe. Quand un préfixe est réutilisé, le compteur reprend là où il s'était arrêté pour ce préfixe. Le préfixe 2.6 a produit 4 en dernier : l'exécution suivante avec 2.6 produit 5, et le numéro d'exécution est 2.6.5. Les compteurs sont propres au pipeline.
  options:
    a: { en: "The seed applies only the first time a prefix is used; the 2.6 counter already exists.", fr: "La valeur initiale ne s'applique que la première fois qu'un préfixe est utilisé ; le compteur 2.6 existe déjà." }
    b: { en: "2.6.3 was already produced; versions of the same counter never repeat.", fr: "2.6.3 a déjà été produite ; les valeurs d'un même compteur ne se répètent jamais." }
    d: { en: "The runs with the prefix 2.7 increment only the 2.7 counter.", fr: "Les exécutions avec le préfixe 2.7 n'incrémentent que le compteur 2.7." }
references:
  - title: Expressions
    url: https://learn.microsoft.com/en-us/azure/devops/pipelines/process/expressions
