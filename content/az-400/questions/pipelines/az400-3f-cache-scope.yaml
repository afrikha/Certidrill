id: az400-3f-cache-scope
objective: "3.6.2"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    Adatum has two YAML pipelines in the same project: **mobile-ci**, which runs for pushes to main and for pull requests that target main, and **mobile-nightly**, which runs on a schedule on main. Both pipelines use the Cache@2 task with identical keys for npm packages.

    Which two statements are true?

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum dispose de deux pipelines YAML dans le même projet : **mobile-ci**, qui s'exécute pour les push vers main et pour les demandes de tirage qui ciblent main, et **mobile-nightly**, qui s'exécute selon une planification sur main. Les deux pipelines utilisent la tâche Cache@2 avec des clés identiques pour les packages npm.

    Quelles sont les deux affirmations vraies ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "A pull request run of mobile-ci can restore a cache entry saved by a CI run of mobile-ci on main.", fr: "Une exécution de demande de tirage de mobile-ci peut restaurer une entrée de cache enregistrée par une exécution CI de mobile-ci sur main." } }
    - { id: b, text: { en: "A pull request run of mobile-ci saves its new cache entries in the cache of the main branch.", fr: "Une exécution de demande de tirage de mobile-ci enregistre ses nouvelles entrées de cache dans le cache de la branche main." } }
    - { id: c, text: { en: "mobile-nightly can restore the cache entries saved by mobile-ci because the keys are identical.", fr: "mobile-nightly peut restaurer les entrées de cache enregistrées par mobile-ci, car les clés sont identiques." } }
    - { id: d, text: { en: "A cache entry that no run uses for seven days expires.", fr: "Une entrée de cache qu'aucune exécution n'utilise pendant sept jours expire." } }
    - { id: e, text: { en: "Cache storage is billed with the Azure Artifacts storage of the organization.", fr: "Le stockage du cache est facturé avec le stockage Azure Artifacts de l'organisation." } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: |
      Pull request runs can read the caches of the source, target and main branches but write only to the intermediate merge branch such as refs/pull/1/merge. Caches expire after seven days of no activity. Caches are scoped per pipeline, so jobs of one pipeline cannot access the caches of another, whatever the key.
    fr: |
      Les exécutions de demande de tirage peuvent lire les caches des branches source, cible et main, mais n'écrivent que dans la branche de fusion intermédiaire, comme refs/pull/1/merge. Les caches expirent après sept jours d'inactivité. Les caches sont limités à un pipeline : les travaux d'un pipeline ne peuvent pas accéder aux caches d'un autre, quelle que soit la clé.
  options:
    b: { en: "A pull request run cannot write to the target branch cache; it writes to the intermediate merge branch.", fr: "Une exécution de demande de tirage ne peut pas écrire dans le cache de la branche cible ; elle écrit dans la branche de fusion intermédiaire." }
    c: { en: "Each pipeline is a separate cache scope, so identical keys in two pipelines do not share entries.", fr: "Chaque pipeline est une étendue de cache distincte : des clés identiques dans deux pipelines ne partagent pas d'entrées." }
    e: { en: "Pipeline caching and pipeline artifacts are available at no cost on all tiers.", fr: "Le cache de pipeline et les artefacts de pipeline sont disponibles sans frais sur tous les niveaux." }
references:
  - title: Pipeline caching
    url: https://learn.microsoft.com/en-us/azure/devops/pipelines/release/caching
