id: az400-3d-gh-job-needs
objective: "3.4.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Litware uses GitHub Actions. A workflow named **release.yml** contains three jobs named **infra**, **database**, and **app**, in that order. No job uses the `needs` or `if` keywords.

    You need to modify the workflow to meet the following requirements:

    - database must start only after infra succeeds.
    - app must start only after database succeeds.
    - app must not run if any earlier job fails.

    Which two changes should you make? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware utilise GitHub Actions. Un workflow nommé **release.yml** contient trois travaux nommés **infra**, **database** et **app**, dans cet ordre. Aucun travail n'utilise les mots clés `needs` ou `if`.

    Vous devez modifier le workflow pour respecter les exigences suivantes :

    - database ne doit démarrer qu'après la réussite d'infra.
    - app ne doit démarrer qu'après la réussite de database.
    - app ne doit pas s'exécuter si un travail précédent échoue.

    Quelles sont les deux modifications à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text: { en: "Add `needs: infra` to the database job.", fr: "Ajouter `needs: infra` au travail database." }
    - id: b
      text: { en: "Add `if: always()` to the app job.", fr: "Ajouter `if: always()` au travail app." }
    - id: c
      text: { en: "Add `needs: database` to the app job.", fr: "Ajouter `needs: database` au travail app." }
    - id: d
      text: { en: "Add a `concurrency` group to the app job.", fr: "Ajouter un groupe `concurrency` au travail app." }
    - id: e
      text: { en: "Move the app job to the end of the file.", fr: "Déplacer le travail app à la fin du fichier." }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |
      Jobs in a GitHub Actions workflow run in parallel unless a job declares the jobs it depends on with `needs`. A job with `needs` waits for those jobs and is skipped if one of them fails, so `needs: infra` on database and `needs: database` on app create the chain infra, database, app.
    fr: |
      Les travaux d'un workflow GitHub Actions s'exécutent en parallèle, sauf si un travail déclare ceux dont il dépend avec `needs`. Un travail doté de `needs` attend ces travaux et est ignoré si l'un d'eux échoue : `needs: infra` sur database et `needs: database` sur app créent la chaîne infra, database, app.
  options:
    b:
      en: "`always()` makes app run even when a previous job fails, which breaks the third requirement."
      fr: "`always()` fait s'exécuter app même si un travail précédent échoue, ce qui enfreint la troisième exigence."
    d:
      en: "A concurrency group prevents two runs from executing the job at the same time; it doesn't order jobs inside one run."
      fr: "Un groupe concurrency empêche deux exécutions de lancer le travail en même temps ; il n'ordonne pas les travaux d'une même exécution."
    e:
      en: "The position of a job in the file has no effect on when it starts."
      fr: "La position d'un travail dans le fichier n'a aucun effet sur le moment où il démarre."
references:
  - title: How do I use GitHub Actions to deploy to Azure?
    url: https://learn.microsoft.com/en-us/training/modules/github-actions-cd/2-deploy-azure
