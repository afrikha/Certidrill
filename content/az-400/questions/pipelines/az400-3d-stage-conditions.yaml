id: az400-3d-stage-conditions
objective: "3.4.2"
type: yesno_statements
difficulty: 3
status: draft
stem:
  en: |
    Proseware has the following YAML pipeline. No stage defines a custom condition.

    ```yaml
    stages:
    - stage: Build
    - stage: DeployDb
      dependsOn: Build
    - stage: DeployApi
      dependsOn: DeployDb
    - stage: DeployWeb
      dependsOn: DeployDb
    - stage: Smoke
      dependsOn:
      - DeployApi
      - DeployWeb
    ```

    The jobs of each stage are omitted.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware dispose du pipeline YAML suivant. Aucune phase ne définit de condition personnalisée.

    ```yaml
    stages:
    - stage: Build
    - stage: DeployDb
      dependsOn: Build
    - stage: DeployApi
      dependsOn: DeployDb
    - stage: DeployWeb
      dependsOn: DeployDb
    - stage: Smoke
      dependsOn:
      - DeployApi
      - DeployWeb
    ```

    Les travaux de chaque phase sont omis.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          If DeployApi fails, Smoke runs after DeployWeb succeeds.
        fr: |
          Si DeployApi échoue, Smoke s'exécute après la réussite de DeployWeb.
    - id: s2
      text:
        en: |
          If you delete the dependsOn line of DeployWeb, DeployWeb starts only after DeployApi completes.
        fr: |
          Si vous supprimez la ligne dependsOn de DeployWeb, DeployWeb ne démarre qu'après la fin de DeployApi.
    - id: s3
      text:
        en: |
          If you replace the dependsOn value of DeployWeb with `[]`, DeployWeb starts at the same time as Build.
        fr: |
          Si vous remplacez la valeur dependsOn de DeployWeb par `[]`, DeployWeb démarre en même temps que Build.
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: |
      By default, a stage runs only if all the stages it depends on have succeeded, so a failed DeployApi prevents Smoke from running. A stage without dependsOn depends on the stage defined just before it in the file, which is DeployApi here. `dependsOn: []` removes all dependencies, so DeployWeb starts with Build, the first stage of the run.
    fr: |
      Par défaut, une phase ne s'exécute que si toutes les phases dont elle dépend ont réussi : un échec de DeployApi empêche donc Smoke de s'exécuter. Une phase sans dependsOn dépend de la phase définie juste avant elle dans le fichier, ici DeployApi. `dependsOn: []` supprime toutes les dépendances : DeployWeb démarre avec Build, la première phase de l'exécution.
references:
  - title: Add stages, dependencies, and conditions
    url: https://learn.microsoft.com/en-us/azure/devops/pipelines/process/stages
