id: az400-3d-hotfix-branch-control
objective: "3.4.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Adatum has a YAML pipeline that deploys to an Azure Pipelines environment named **prod**. The prod environment has an approval and a Branch control check whose allowed branches list contains only `refs/heads/main`.

    The hotfix plan states that urgent fixes are merged into **release/2.4** and deployed by a pipeline run of that branch. During the first hotfix, the run failed at the prod stage on the Branch control check.

    You need runs of release/2.4 to deploy to prod. Runs of feature branches must remain blocked, and the approval must stay in place.

    What should you do?
  fr: |
    Adatum dispose d'un pipeline YAML qui déploie vers un environnement Azure Pipelines nommé **prod**. L'environnement prod possède une approbation et une vérification Branch control dont la liste des branches autorisées contient uniquement `refs/heads/main`.

    Le plan de correctifs stipule que les correctifs urgents sont fusionnés dans **release/2.4** et déployés par une exécution de pipeline de cette branche. Lors du premier correctif, l'exécution a échoué à la phase prod sur la vérification Branch control.

    Vous devez permettre aux exécutions de release/2.4 de déployer vers prod. Les exécutions des branches de fonctionnalité doivent rester bloquées, et l'approbation doit être conservée.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Add release/2.4 to the allowed branches list of the check.", fr: "Ajouter release/2.4 à la liste des branches autorisées de la vérification." }
    - id: b
      text: { en: "Add refs/heads/release/2.4 to the allowed branches list of the check.", fr: "Ajouter refs/heads/release/2.4 à la liste des branches autorisées de la vérification." }
    - id: c
      text: { en: "Require branch protection in the Branch control check.", fr: "Exiger la protection de branche dans la vérification Branch control." }
    - id: d
      text: { en: "Replace the Branch control check with a second approval.", fr: "Remplacer la vérification Branch control par une seconde approbation." }
answer: { optionId: b }
explanation:
  correct:
    en: |
      The Branch control check compares the branch of every resource of the run with a comma-separated list of allowed branches, and it requires fully qualified names in the form `refs/heads/<branch name>`. Adding `refs/heads/release/2.4` lets hotfix runs pass while other branches still fail the check, and the approval remains.
    fr: |
      La vérification Branch control compare la branche de chaque ressource de l'exécution à une liste de branches autorisées séparées par des virgules, et elle exige des noms complets au format `refs/heads/<nom de branche>`. Ajouter `refs/heads/release/2.4` laisse passer les exécutions de correctif, tandis que les autres branches échouent toujours à la vérification, et l'approbation est conservée.
  options:
    a:
      en: "A short branch name isn't fully qualified, so it doesn't match the run of release/2.4 and the check still fails."
      fr: "Un nom de branche court n'est pas complet : il ne correspond pas à l'exécution de release/2.4 et la vérification échoue toujours."
    c:
      en: "Requiring branch protection adds a condition; release/2.4 would still be missing from the allowed list."
      fr: "Exiger la protection de branche ajoute une condition ; release/2.4 serait toujours absente de la liste autorisée."
    d:
      en: "Removing the Branch control check would also let feature branches deploy once someone approves."
      fr: "Supprimer la vérification Branch control laisserait aussi les branches de fonctionnalité déployer dès qu'une personne approuve."
references:
  - title: Define approvals and checks
    url: https://learn.microsoft.com/en-us/azure/devops/pipelines/process/approvals
