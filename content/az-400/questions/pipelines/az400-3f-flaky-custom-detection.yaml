id: az400-3f-flaky-custom-detection
objective: "3.6.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam uses Azure DevOps Services. The test results of the YAML pipeline **billing-ci** are published to Azure Pipelines.

    The quality team already runs an internal service that analyzes the history of every test and decides which tests are flaky on each branch. You need the tests chosen by that service to be marked as flaky in Azure Pipelines automatically and to stay flaky in later runs. The pipeline must not rerun failed tests.

    What should you do?
  fr: |
    Fabrikam utilise Azure DevOps Services. Les résultats de tests du pipeline YAML **billing-ci** sont publiés dans Azure Pipelines.

    L'équipe qualité exploite déjà un service interne qui analyse l'historique de chaque test et décide quels tests sont instables sur chaque branche. Les tests choisis par ce service doivent être marqués automatiquement comme instables dans Azure Pipelines et le rester dans les exécutions suivantes. Le pipeline ne doit pas réexécuter les tests en échec.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Turn on flaky test management with system detection, and set rerunMaxAttempts on the Visual Studio Test task", fr: "Activer la gestion des tests instables avec la détection système, et définir rerunMaxAttempts sur la tâche Visual Studio Test" } }
    - { id: b, text: { en: "Turn on flaky test management with custom detection, and have the service call the Result Meta Data - Update REST API", fr: "Activer la gestion des tests instables avec la détection personnalisée, et faire appeler l'API REST Result Meta Data - Update par le service" } }
    - { id: c, text: { en: "Turn on flaky test management, and have a team member mark each reported test as Flaky in the test results", fr: "Activer la gestion des tests instables, et faire marquer chaque test signalé comme Flaky dans les résultats de tests par un membre de l'équipe" } }
    - { id: d, text: { en: "Turn off flaky test management, and have the service set the testRunTitle input of the Publish Test Results task", fr: "Désactiver la gestion des tests instables, et faire définir l'entrée testRunTitle de la tâche Publish Test Results par le service" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      With custom detection, an external system marks a test as flaky through the Result Meta Data - Update REST API, giving the test case reference ID, the flaky flag and the branch. Azure DevOps stores the status and propagates it to later runs until someone unmarks the test.
    fr: |
      Avec la détection personnalisée, un système externe marque un test comme instable via l'API REST Result Meta Data - Update, en indiquant l'ID de référence du cas de test, l'indicateur d'instabilité et la branche. Azure DevOps stocke ce statut et le propage aux exécutions suivantes jusqu'à ce que quelqu'un retire la marque.
  options:
    a: { en: "System detection marks a test flaky when it fails and then passes on a rerun, which the pipeline must not do, and it ignores the decisions of the internal service.", fr: "La détection système marque un test instable lorsqu'il échoue puis réussit lors d'une réexécution, ce que le pipeline ne doit pas faire, et elle ignore les décisions du service interne." }
    c: { en: "Manual marking depends on a person copying every decision of the service, so the tests are not marked automatically.", fr: "Le marquage manuel dépend d'une personne qui recopie chaque décision du service : les tests ne sont donc pas marqués automatiquement." }
    d: { en: "The test run title is only a label; it does not mark tests as flaky, and flaky information requires flaky test management to be on.", fr: "Le titre de la série de tests n'est qu'un libellé ; il ne marque pas les tests comme instables, et les informations d'instabilité exigent que la gestion des tests instables soit activée." }
references:
  - title: Manage flaky tests
    url: https://learn.microsoft.com/en-us/azure/devops/pipelines/test/flaky-test-management
