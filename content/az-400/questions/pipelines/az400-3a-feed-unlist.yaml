id: az400-3a-feed-unlist
objective: "3.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam publishes a NuGet package named **Fabrikam.Telemetry** to an Azure Artifacts feed. Version 4.2.0 contains a performance bug, and version 4.2.1 fixes it.

    You need to prevent developers from finding version 4.2.0 when they search the feed for packages to add. Existing projects that reference version 4.2.0 exactly must continue to restore until they are updated.

    What should you do with version 4.2.0?
  fr: |
    Fabrikam publie un package NuGet nommé **Fabrikam.Telemetry** dans un flux Azure Artifacts. La version 4.2.0 contient un bogue de performances, corrigé par la version 4.2.1.

    Vous devez empêcher les développeurs de trouver la version 4.2.0 quand ils recherchent dans le flux des packages à ajouter. Les projets existants qui référencent exactement la version 4.2.0 doivent continuer à la restaurer jusqu'à leur mise à jour.

    Que devez-vous faire de la version 4.2.0 ?
body:
  options:
    - { id: a, text: { en: "Delete it from the feed", fr: "La supprimer du flux" } }
    - { id: b, text: { en: "Unlist it", fr: "La retirer de la liste (Unlist)" } }
    - { id: c, text: { en: "Delete it, and then restore it from the Recycle Bin", fr: "La supprimer, puis la restaurer depuis la Corbeille" } }
    - { id: d, text: { en: "Publish 4.2.1 under the same version number 4.2.0", fr: "Publier 4.2.1 sous le même numéro de version 4.2.0" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Unlisting a NuGet package version hides it from search results but keeps it in the feed, so projects that request that exact version still restore it. A Feed Publisher (Contributor) or higher can unlist a version.
    fr: |
      Retirer de la liste une version de package NuGet la masque des résultats de recherche, mais la conserve dans le flux : les projets qui demandent exactement cette version la restaurent toujours. Un Feed Publisher (Contributor) ou un rôle supérieur peut retirer une version de la liste.
  options:
    a: { en: "Deleting moves the version to the Recycle Bin and makes it unavailable for installation, so the existing projects would fail to restore.", fr: "La suppression déplace la version dans la Corbeille et la rend indisponible à l'installation : les projets existants ne pourraient plus la restaurer." }
    c: { en: "Restoring from the Recycle Bin brings the version back exactly as it was, visible in search again.", fr: "La restauration depuis la Corbeille rétablit la version telle qu'elle était, de nouveau visible dans les recherches." }
    d: { en: "Package versions are immutable: a version number that was published can never be reused, even after deletion.", fr: "Les versions de packages sont immuables : un numéro de version déjà publié ne peut jamais être réutilisé, même après suppression." }
references:
  - title: Delete and recover packages
    url: https://learn.microsoft.com/en-us/azure/devops/artifacts/how-to/delete-and-recover-packages
