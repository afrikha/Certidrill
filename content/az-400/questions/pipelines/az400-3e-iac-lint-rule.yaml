id: az400-3e-iac-lint-rule
objective: "3.5.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso stores its Bicep files in an Azure Repos Git repository. A build validation pipeline runs `az bicep lint` on every pull request that targets main.

    Several Bicep files contain hard-coded Azure regions. You need the pull request validation to fail whenever a resource location is hard-coded.

    What should you do?
  fr: |
    Contoso stocke ses fichiers Bicep dans un dépôt Git Azure Repos. Un pipeline de validation de build exécute `az bicep lint` sur chaque demande de tirage qui cible main.

    Plusieurs fichiers Bicep contiennent des régions Azure codées en dur. La validation de la demande de tirage doit échouer chaque fois qu'un emplacement de ressource est codé en dur.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text:
        en: "In bicepconfig.json, set the level of the `no-hardcoded-location` rule to `error`."
        fr: "Dans bicepconfig.json, définir le niveau de la règle `no-hardcoded-location` sur `error`."
    - id: b
      text:
        en: "In bicepconfig.json, set the level of the `no-hardcoded-location` rule to `warning`."
        fr: "Dans bicepconfig.json, définir le niveau de la règle `no-hardcoded-location` sur `warning`."
    - id: c
      text:
        en: "Add a step that runs `Test-AzTemplate` from the ARM template test toolkit on the Bicep files."
        fr: "Ajouter une étape qui exécute `Test-AzTemplate` de l'ARM template test toolkit sur les fichiers Bicep."
    - id: d
      text:
        en: "Add a step that runs `az deployment group what-if` for each Bicep file."
        fr: "Ajouter une étape qui exécute `az deployment group what-if` pour chaque fichier Bicep."
answer: { optionId: a }
explanation:
  correct:
    en: "The Bicep linter reads its rules from bicepconfig.json. The `no-hardcoded-location` rule is off by default; at the `error` level, a violation is reported as an error and fails the lint or build step of the pipeline."
    fr: "Le linter Bicep lit ses règles dans bicepconfig.json. La règle `no-hardcoded-location` est désactivée par défaut ; au niveau `error`, une violation est signalée comme une erreur et fait échouer l'étape de lint ou de build du pipeline."
  options:
    b:
      en: "A warning is reported but doesn't fail the pipeline."
      fr: "Un avertissement est signalé, mais il ne fait pas échouer le pipeline."
    c:
      en: "The ARM template test toolkit tests JSON ARM templates only; for Bicep files, Microsoft points to the Bicep linter."
      fr: "L'ARM template test toolkit ne teste que des modèles ARM JSON ; pour les fichiers Bicep, Microsoft renvoie vers le linter Bicep."
    d:
      en: "What-if previews resource changes in Azure; it doesn't enforce coding rules on the files."
      fr: "What-if affiche un aperçu des modifications de ressources dans Azure ; il n'applique pas de règles de codage aux fichiers."
references:
  - title: Use Bicep linter
    url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/bicep/linter
