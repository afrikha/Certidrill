id: az400-3f-mdp-parallel-jobs
objective: "3.6.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Fabrikam created a Managed DevOps Pools pool named **mdp-linux** with the Maximum agents setting set to 6. The organization has only the free self-hosted parallel job.

    When six pipelines are queued, only one runs at a time and the others wait, although the pool could provision more agents. You need to run up to six jobs at the same time on mdp-linux.

    What should you do?
  fr: |
    Fabrikam a créé un pool Managed DevOps Pools nommé **mdp-linux** dont le paramètre Maximum agents est défini sur 6. L'organisation ne dispose que du travail parallèle auto-hébergé gratuit.

    Lorsque six pipelines sont en file d'attente, un seul s'exécute à la fois et les autres attendent, alors que le pool pourrait provisionner davantage d'agents. Vous devez exécuter jusqu'à six travaux en même temps sur mdp-linux.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Purchase additional self-hosted parallel jobs for the organization", fr: "Acheter des travaux parallèles auto-hébergés supplémentaires pour l'organisation" } }
    - { id: b, text: { en: "Purchase additional Microsoft-hosted parallel jobs for the organization", fr: "Acheter des travaux parallèles hébergés par Microsoft supplémentaires pour l'organisation" } }
    - { id: c, text: { en: "Increase the Maximum agents setting of mdp-linux to 12", fr: "Augmenter le paramètre Maximum agents de mdp-linux à 12" } }
    - { id: d, text: { en: "Set the standby agent mode of mdp-linux to Automatic", fr: "Définir le mode d'agents en attente de mdp-linux sur Automatic" } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Managed DevOps Pools agents are self-hosted agents, so they consume the self-hosted parallel jobs of the organization. Maximum agents only caps the pool: with the single free self-hosted parallel job, one pipeline runs at a time. Purchasing five more self-hosted parallel jobs allows six concurrent jobs.
    fr: |
      Les agents Managed DevOps Pools sont des agents auto-hébergés : ils consomment les travaux parallèles auto-hébergés de l'organisation. Maximum agents ne fait que plafonner le pool : avec le seul travail parallèle auto-hébergé gratuit, un pipeline s'exécute à la fois. L'achat de cinq travaux parallèles auto-hébergés supplémentaires permet six travaux simultanés.
  options:
    b: { en: "Microsoft-hosted parallel jobs apply to Microsoft-hosted agents, not to Managed DevOps Pools agents.", fr: "Les travaux parallèles hébergés par Microsoft s'appliquent aux agents hébergés par Microsoft, pas aux agents Managed DevOps Pools." }
    c: { en: "The pool is not the bottleneck; more agents still share one parallel job.", fr: "Le pool n'est pas le goulot d'étranglement ; davantage d'agents partageraient toujours un seul travail parallèle." }
    d: { en: "Standby agents shorten agent provisioning but add no concurrency, and their hours are billed.", fr: "Les agents en attente raccourcissent le provisionnement des agents mais n'ajoutent pas de concurrence, et leurs heures sont facturées." }
references:
  - title: Managed DevOps Pools pricing
    url: https://learn.microsoft.com/en-us/azure/devops/managed-devops-pools/pricing
