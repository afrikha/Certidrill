id: az400-3a-gh-npm-publish
objective: "3.1.1"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    The repository **litware/charts** contains an npm package named `@litware/charts`. You are writing a GitHub Actions workflow that publishes the package to GitHub Packages when a release is published.

    The workflow must not use a personal access token or any other stored secret, and the token used by the workflow must have only the permissions it needs.

    How should you complete the workflow? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Le dépôt **litware/charts** contient un package npm nommé `@litware/charts`. Vous écrivez un workflow GitHub Actions qui publie le package dans GitHub Packages quand une release est publiée.

    Le workflow ne doit utiliser ni jeton d'accès personnel ni aucun autre secret stocké, et le jeton utilisé par le workflow ne doit avoir que les autorisations nécessaires.

    Comment devez-vous compléter le workflow ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: yaml
  template: |
    on:
      release:
        types: [published]
    jobs:
      publish:
        runs-on: ubuntu-latest
        permissions:
          contents: read
          [[perm]]
        steps:
          - uses: actions/checkout@v4
          - uses: actions/setup-node@v4
            with:
              node-version: 20
              registry-url: [[registry]]
          - run: npm ci
          - run: npm publish
            env:
              NODE_AUTH_TOKEN: [[token]]
  slots:
    - id: perm
      options:
        - { id: pkgw, text: "packages: write" }
        - { id: pkgr, text: "packages: read" }
        - { id: idt, text: "id-token: write" }
        - { id: depl, text: "deployments: write" }
    - id: registry
      options:
        - { id: gh, text: "https://npm.pkg.github.com" }
        - { id: npmjs, text: "https://registry.npmjs.org" }
        - { id: ghcr, text: "https://ghcr.io" }
        - { id: ado, text: "https://pkgs.dev.azure.com/litware/_packaging/charts/npm/registry/" }
    - id: token
      options:
        - { id: gt, text: "${{ secrets.GITHUB_TOKEN }}" }
        - { id: pat, text: "${{ secrets.NPM_PAT }}" }
        - { id: sha, text: "${{ github.sha }}" }
        - { id: actor, text: "${{ github.actor }}" }
answer:
  values: { perm: pkgw, registry: gh, token: gt }
explanation:
  correct:
    en: |
      The npm registry of GitHub Packages is `https://npm.pkg.github.com`; `actions/setup-node` writes an `.npmrc` that reads the token from `NODE_AUTH_TOKEN`. The built-in `GITHUB_TOKEN` can publish a package of the workflow's own repository when the job grants it `packages: write`, so no stored secret is needed.
    fr: |
      Le registre npm de GitHub Packages est `https://npm.pkg.github.com` ; `actions/setup-node` écrit un fichier `.npmrc` qui lit le jeton dans `NODE_AUTH_TOKEN`. Le jeton intégré `GITHUB_TOKEN` peut publier un package du dépôt du workflow quand le job lui accorde `packages: write` : aucun secret stocké n'est nécessaire.
  options:
    pkgr: { en: "`packages: read` lets the job download packages but not publish them.", fr: "`packages: read` permet au job de télécharger des packages, mais pas de les publier." }
    idt: { en: "`id-token: write` requests an OIDC token for cloud federation; it gives no right on GitHub Packages.", fr: "`id-token: write` demande un jeton OIDC pour la fédération avec un cloud ; il ne donne aucun droit sur GitHub Packages." }
    npmjs: { en: "registry.npmjs.org is the public npm registry, not GitHub Packages.", fr: "registry.npmjs.org est le registre npm public, pas GitHub Packages." }
    ghcr: { en: "ghcr.io is the Container registry for images, not the npm registry.", fr: "ghcr.io est le Container registry pour les images, pas le registre npm." }
    pat: { en: "A personal access token stored as a secret is exactly what the requirement excludes.", fr: "Un jeton d'accès personnel stocké comme secret est précisément ce que l'exigence exclut." }
references:
  - title: Publish to GitHub Packages and GitHub Container Registry
    url: https://learn.microsoft.com/en-us/training/modules/github-actions-packages/2b-publish-using-workflow
  - title: Publish packages
    url: https://learn.microsoft.com/en-us/training/modules/introduction-github-packages/2-publish-packages
