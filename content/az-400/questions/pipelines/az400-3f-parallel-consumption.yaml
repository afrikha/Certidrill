id: az400-3f-parallel-consumption
objective: "3.6.3"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Proseware has an Azure DevOps organization with three projects: Payments, Portal and Tools. The organization has purchased five self-hosted parallel jobs. Multi-stage YAML pipelines deploy to environments that have approval checks.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware dispose d'une organisation Azure DevOps avec trois projets : Payments, Portal et Tools. L'organisation a acheté cinq travaux parallèles auto-hébergés. Des pipelines YAML à phases multiples effectuent des déploiements sur des environnements dotés de vérifications d'approbation.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          A run whose Production stage waits for an approval consumes a parallel job while it waits.
        fr: |
          Une exécution dont la phase Production attend une approbation consomme un travail parallèle pendant cette attente.
    - id: s2
      text:
        en: |
          A server job (pool: server) of a pipeline does not consume a parallel job.
        fr: |
          Un travail serveur (pool: server) d'un pipeline ne consomme pas de travail parallèle.
    - id: s3
      text:
        en: |
          Two of the five parallel jobs can be dedicated to the Payments project so that the other projects never use them.
        fr: |
          Deux des cinq travaux parallèles peuvent être réservés au projet Payments pour que les autres projets ne les utilisent jamais.
answer:
  values: { s1: false, s2: true, s3: false }
explanation:
  correct:
    en: |
      A run consumes a parallel job only while it actively runs on an agent; a run waiting for an approval or a manual intervention consumes none. Server jobs do not consume parallel jobs. Parallel jobs are set at the organization level and shared by all projects; they cannot be partitioned or dedicated to a project or an agent pool.
    fr: |
      Une exécution ne consomme un travail parallèle que lorsqu'elle s'exécute effectivement sur un agent ; une exécution qui attend une approbation ou une intervention manuelle n'en consomme pas. Les travaux serveur ne consomment pas de travaux parallèles. Les travaux parallèles sont définis au niveau de l'organisation et partagés par tous les projets ; ils ne peuvent pas être répartis ni réservés à un projet ou à un pool d'agents.
references:
  - title: Configure and pay for parallel jobs
    url: https://learn.microsoft.com/en-us/azure/devops/pipelines/licensing/concurrent-jobs
