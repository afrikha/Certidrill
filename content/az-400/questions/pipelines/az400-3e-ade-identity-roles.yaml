id: az400-3e-ade-identity-roles
objective: "3.5.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam uses Azure Deployment Environments. In the project **proj-billing**, the project environment type **Dev** deploys environments to a subscription named **sub-billing-dev** by using the system-assigned managed identity of the dev center.

    You need to grant the identity the permissions it needs to create environments in sub-billing-dev and to give developers access to the resources of their environments. The solution must follow the principle of least privilege.

    Which roles should you assign to the identity on sub-billing-dev?
  fr: |
    Fabrikam utilise Azure Deployment Environments. Dans le projet **proj-billing**, le type d'environnement de projet **Dev** déploie les environnements vers un abonnement nommé **sub-billing-dev** à l'aide de l'identité managée affectée par le système du centre de développement.

    Vous devez accorder à l'identité les autorisations nécessaires pour créer des environnements dans sub-billing-dev et donner aux développeurs l'accès aux ressources de leurs environnements. La solution doit respecter le principe du moindre privilège.

    Quels rôles devez-vous attribuer à l'identité sur sub-billing-dev ?
body:
  options:
    - { id: a, text: { en: "Contributor only", fr: "Contributor uniquement" } }
    - { id: b, text: { en: "Contributor and User Access Administrator", fr: "Contributor et User Access Administrator" } }
    - { id: c, text: { en: "Deployment Environments User and Reader", fr: "Deployment Environments User et Reader" } }
    - { id: d, text: { en: "DevCenter Project Admin and Contributor", fr: "DevCenter Project Admin et Contributor" } }
answer: { optionId: b }
explanation:
  correct:
    en: "The deployment identity creates the environment's resource group and resources, which requires Contributor, and assigns the environment creator roles and additional access on that resource group, which requires User Access Administrator. Microsoft documents exactly these two roles on the deployment subscription."
    fr: "L'identité de déploiement crée le groupe de ressources et les ressources de l'environnement, ce qui exige Contributor, et attribue les rôles du créateur de l'environnement ainsi que les accès supplémentaires sur ce groupe de ressources, ce qui exige User Access Administrator. Microsoft documente précisément ces deux rôles sur l'abonnement de déploiement."
  options:
    a:
      en: "Contributor can't create role assignments, so developers wouldn't get access to their environment's resources."
      fr: "Contributor ne peut pas créer d'attributions de rôles : les développeurs n'obtiendraient pas l'accès aux ressources de leur environnement."
    c:
      en: "Deployment Environments User is a project role for people who create environments; it grants nothing on the deployment subscription."
      fr: "Deployment Environments User est un rôle de projet destiné aux personnes qui créent des environnements ; il n'accorde rien sur l'abonnement de déploiement."
    d:
      en: "DevCenter Project Admin manages a project and its environment types; it doesn't let the identity assign roles in the subscription."
      fr: "DevCenter Project Admin gère un projet et ses types d'environnements ; il ne permet pas à l'identité d'attribuer des rôles dans l'abonnement."
references:
  - title: Configure environment types for Azure Deployment Environments projects
    url: https://learn.microsoft.com/en-us/azure/deployment-environments/how-to-configure-project-environment-types
