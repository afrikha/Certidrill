id: az400-3c-scale-set-image
objective: "3.3.7"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    Contoso has an Azure Virtual Machine Scale Set agent pool that uses the Ubuntu scale set **vmss-agents**. You need all the agents created from now on to include a new version of the build tools. You have already created a virtual machine named **vm-image** from the current base image.

    Which five actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Contoso dispose d'un pool d'agents Azure Virtual Machine Scale Set qui utilise le groupe de machines virtuelles identiques Ubuntu **vmss-agents**. Vous devez faire en sorte que tous les agents créés désormais incluent une nouvelle version des outils de build. Vous avez déjà créé une machine virtuelle nommée **vm-image** à partir de l'image de base actuelle.

    Quelles sont les cinq actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 5
  actions:
    - { id: tools, text: { en: "Install the new versions of the build tools on vm-image.", fr: "Installer les nouvelles versions des outils de build sur vm-image." } }
    - { id: deprov, text: { en: "Run `sudo waagent -deprovision+user -force` on vm-image.", fr: "Exécuter `sudo waagent -deprovision+user -force` sur vm-image." } }
    - { id: gen, text: { en: "Run `az vm deallocate`, and then `az vm generalize`, for vm-image.", fr: "Exécuter `az vm deallocate`, puis `az vm generalize`, pour vm-image." } }
    - { id: img, text: { en: "Run `az image create` with vm-image as the source.", fr: "Exécuter `az image create` avec vm-image comme source." } }
    - { id: upd, text: { en: "Run `az vmss update` to set the image reference of vmss-agents to the ID of the new image.", fr: "Exécuter `az vmss update` pour définir la référence d'image de vmss-agents sur l'ID de la nouvelle image." } }
    - { id: agent, text: { en: "Install and configure the Azure Pipelines agent on vm-image.", fr: "Installer et configurer l'agent Azure Pipelines sur vm-image." } }
    - { id: over, text: { en: "Enable overprovisioning on vmss-agents.", fr: "Activer le surprovisionnement sur vmss-agents." } }
answer:
  sequence: [ tools, deprov, gen, img, upd ]
explanation:
  correct:
    en: |
      You customize the VM, generalize it with the Azure Linux agent, deallocate it and mark it as generalized, create the image, and then point the scale set at the new image ID. Future VMs of the scale set are created from the new image; Azure Pipelines installs the agent on them through its VM extension.
    fr: |
      Vous personnalisez la machine, vous la généralisez avec l'agent Linux Azure, vous la libérez et la marquez comme généralisée, vous créez l'image, puis vous faites pointer le groupe identique vers l'ID de la nouvelle image. Les futures machines du groupe identique sont créées à partir de la nouvelle image ; Azure Pipelines y installe l'agent au moyen de son extension de machine virtuelle.
  options:
    agent: { en: "The agent must not be preinstalled in the image; the Azure Pipelines extension installs and registers it on each VM.", fr: "L'agent ne doit pas être préinstallé dans l'image ; l'extension Azure Pipelines l'installe et l'inscrit sur chaque machine." }
    over: { en: "Overprovisioning must stay disabled on a scale set used as an agent pool.", fr: "Le surprovisionnement doit rester désactivé sur un groupe identique utilisé comme pool d'agents." }
references:
  - title: Azure Virtual Machine Scale Set agents
    url: https://learn.microsoft.com/en-us/azure/devops/pipelines/agents/scale-set-agents
