id: az400-3a-feed-release-view
objective: "3.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso has an Azure Artifacts feed named **core-libs**. A CI pipeline publishes a new version of each library to core-libs after every merge to main. The QA team then runs integration tests on some of these versions.

    You need to ensure that the product teams can restore only the library versions that passed the integration tests. The solution must minimize administrative effort.

    What should you do?
  fr: |
    Contoso dispose d'un flux Azure Artifacts nommé **core-libs**. Un pipeline de CI publie une nouvelle version de chaque bibliothèque dans core-libs après chaque fusion dans main. L'équipe QA exécute ensuite des tests d'intégration sur certaines de ces versions.

    Vous devez faire en sorte que les équipes produit ne puissent restaurer que les versions de bibliothèques qui ont réussi les tests d'intégration. La solution doit réduire au minimum l'effort d'administration.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Promote each tested version to the @Release view and connect the product teams to core-libs@Release", fr: "Promouvoir chaque version testée vers la vue @Release et connecter les équipes produit à core-libs@Release" } }
    - { id: b, text: { en: "Configure a retention policy that keeps only the versions downloaded by the QA team", fr: "Configurer une stratégie de rétention qui ne conserve que les versions téléchargées par l'équipe QA" } }
    - { id: c, text: { en: "Create a second feed and copy each tested version to it with a pipeline", fr: "Créer un deuxième flux et y copier chaque version testée avec un pipeline" } }
    - { id: d, text: { en: "Unlist every version that has not passed the integration tests yet", fr: "Retirer de la liste chaque version qui n'a pas encore réussi les tests d'intégration" } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Views expose a subset of a feed by quality. Packages are always published to the feed (the @Local view); a Feed Publisher (Contributor) then promotes a tested version to @Release, and consumers that use the core-libs@Release source see only the promoted versions.
    fr: |
      Les vues exposent un sous-ensemble d'un flux selon la qualité. Les packages sont toujours publiés dans le flux (vue @Local) ; un Feed Publisher (Contributor) promeut ensuite une version testée vers @Release, et les consommateurs qui utilisent la source core-libs@Release ne voient que les versions promues.
  options:
    c: { en: "A second feed with copied packages works but duplicates storage and adds a pipeline to maintain, which views avoid.", fr: "Un deuxième flux avec des packages copiés fonctionne, mais duplique le stockage et ajoute un pipeline à maintenir, ce que les vues évitent." }
    d: { en: "Unlisting only hides a version from search; a project that references the version can still restore it, and every new version would have to be unlisted manually.", fr: "Retirer de la liste masque seulement une version des recherches ; un projet qui référence la version peut encore la restaurer, et chaque nouvelle version devrait être retirée manuellement." }
    b: { en: "Retention policies delete old versions by count and last download date; they are not a quality filter.", fr: "Les stratégies de rétention suppriment les anciennes versions selon leur nombre et leur date de dernier téléchargement ; ce n'est pas un filtre de qualité." }
references:
  - title: Promote packages and manage feed views
    url: https://learn.microsoft.com/en-us/azure/devops/artifacts/feeds/views
