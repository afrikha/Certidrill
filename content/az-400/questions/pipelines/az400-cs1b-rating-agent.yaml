id: az400-cs1b-rating-agent
objective: "3.3.2"
type: single
caseStudy: az400-cs1b-humongous-insurance
difficulty: 2
status: draft
stem:
  en: |
    You need to choose where the integration test job runs. The solution must meet the third pipeline requirement.

    What should you use?
  fr: |
    Vous devez choisir où s'exécute le travail de tests d'intégration. La solution doit respecter la troisième exigence relative aux pipelines.

    Que devez-vous utiliser ?
body:
  options:
    - { id: a, text: { en: "A Managed DevOps Pools pool that uses an Azure virtual network", fr: "Un pool Managed DevOps Pools qui utilise un réseau virtuel Azure" } }
    - { id: b, text: { en: "The Microsoft-hosted Azure Pipelines pool with a Windows image", fr: "Le pool Azure Pipelines hébergé par Microsoft avec une image Windows" } }
    - { id: c, text: { en: "A self-hosted agent installed on a server in the Hartford datacenter", fr: "Un agent auto-hébergé installé sur un serveur du centre de données de Hartford" } }
    - { id: d, text: { en: "An agent pool based on an Azure Virtual Machine Scale Set", fr: "Un pool d'agents basé sur un groupe de machines virtuelles identiques Azure" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      An agent always initiates the communication with Azure DevOps and polls for jobs over HTTP or HTTPS, so a self-hosted agent in the datacenter only needs the outbound HTTPS traffic that the firewall already allows. Because it runs inside the datacenter, it can reach rating.humongous.local directly. Microsoft documents this design for on-premises environments that Microsoft-hosted agents cannot reach.
    fr: |
      Un agent initie toujours la communication avec Azure DevOps et interroge le service pour obtenir des travaux en HTTP ou HTTPS : un agent auto-hébergé dans le centre de données n'a besoin que du trafic HTTPS sortant que le pare-feu autorise déjà. Comme il s'exécute dans le centre de données, il atteint directement rating.humongous.local. Microsoft documente cette conception pour les environnements locaux que les agents hébergés par Microsoft ne peuvent pas atteindre.
  options:
    a: { en: "A Managed DevOps Pools pool can use an Azure virtual network, but without a VPN or ExpressRoute connection that network cannot reach the datacenter.", fr: "Un pool Managed DevOps Pools peut utiliser un réseau virtuel Azure, mais sans connexion VPN ni ExpressRoute ce réseau n'atteint pas le centre de données." }
    b: { en: "Microsoft-hosted agents run in Azure; reaching the rating service would require an inbound firewall rule for their IP ranges.", fr: "Les agents hébergés par Microsoft s'exécutent dans Azure ; atteindre le service de tarification exigerait une règle de pare-feu entrante pour leurs plages d'adresses IP." }
    d: { en: "Scale set agents run on Azure VMs that have no network path to the datacenter.", fr: "Les agents de groupe identique s'exécutent sur des machines virtuelles Azure qui n'ont aucun chemin réseau vers le centre de données." }
references:
  - title: Azure Pipelines agents
    url: https://learn.microsoft.com/en-us/azure/devops/pipelines/agents/agents
