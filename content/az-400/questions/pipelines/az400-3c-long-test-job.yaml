id: az400-3c-long-test-job
objective: "3.3.7"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Woodgrove runs an end-to-end test suite in a single job of a YAML pipeline, in a private project. The job uses Microsoft-hosted agents, and the organization has purchased Microsoft-hosted parallel jobs. The suite needs about nine hours and can't be split into several jobs. The job is always canceled after six hours.

    The team must not install, patch or scale agent machines itself.

    What should you do?
  fr: |
    Woodgrove exécute une suite de tests de bout en bout dans un seul travail d'un pipeline YAML, dans un projet privé. Le travail utilise des agents hébergés par Microsoft, et l'organisation a acheté des travaux parallèles hébergés par Microsoft. La suite dure environ neuf heures et ne peut pas être découpée en plusieurs travaux. Le travail est toujours annulé au bout de six heures.

    L'équipe ne doit pas installer, corriger ni mettre à l'échelle elle-même des machines d'agent.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Set `timeoutInMinutes: 0` on the job.", fr: "Définir `timeoutInMinutes: 0` sur le travail." } }
    - { id: b, text: { en: "Run the job in a Managed DevOps Pool.", fr: "Exécuter le travail dans un pool Managed DevOps Pools." } }
    - { id: c, text: { en: "Purchase additional Microsoft-hosted parallel jobs.", fr: "Acheter des travaux parallèles hébergés par Microsoft supplémentaires." } }
    - { id: d, text: { en: "Set `cancelTimeoutInMinutes: 600` on the job.", fr: "Définir `cancelTimeoutInMinutes: 600` sur le travail." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      With purchased parallel jobs, a job on Microsoft-hosted agents can run up to 360 minutes, and the platform limit overrides any higher job timeout. Managed DevOps Pools is a fully managed service in which jobs can run for up to two days, and Microsoft manages the agent machines.
    fr: |
      Avec des travaux parallèles achetés, un travail sur des agents hébergés par Microsoft peut durer jusqu'à 360 minutes, et la limite de la plateforme l'emporte sur tout délai d'expiration plus élevé du travail. Managed DevOps Pools est un service entièrement managé dans lequel les travaux peuvent durer jusqu'à deux jours, et Microsoft gère les machines d'agent.
  options:
    a: { en: "0 means the maximum allowed, which is still 360 minutes on Microsoft-hosted agents.", fr: "0 signifie le maximum autorisé, qui reste de 360 minutes sur les agents hébergés par Microsoft." }
    c: { en: "More parallel jobs let more jobs run at once; they don't extend the duration of one job.", fr: "Davantage de travaux parallèles permettent d'exécuter plus de travaux à la fois ; ils n'allongent pas la durée d'un travail." }
    d: { en: "cancelTimeoutInMinutes only limits how long always-run tasks may run after a cancellation.", fr: "cancelTimeoutInMinutes limite seulement la durée des tâches toujours exécutées après une annulation." }
references:
  - title: Specify jobs in your pipeline
    url: https://learn.microsoft.com/en-us/azure/devops/pipelines/process/phases
  - title: Overview of Managed DevOps Pools
    url: https://learn.microsoft.com/en-us/azure/devops/managed-devops-pools/overview
