id: az400-3e-db-ef-bundle-order
objective: "3.4.8"
type: ordering
difficulty: 3
status: draft
stem:
  en: |
    Proseware runs an ASP.NET Core API that uses Entity Framework Core migrations against an Azure SQL database. Releases are deployed by an Azure Pipelines multi-stage pipeline. The production deployment jobs run on self-hosted Linux agents that have neither the .NET SDK nor the source code.

    You need to apply the migrations during each release by using a migration bundle. The application must start only after the schema is up to date, and the application's runtime identity must keep data read and write permissions only.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Proseware exécute une API ASP.NET Core qui utilise les migrations Entity Framework Core sur une base de données Azure SQL. Les mises en production sont déployées par un pipeline Azure Pipelines à phases multiples. Les travaux de déploiement en production s'exécutent sur des agents Linux auto-hébergés qui ne disposent ni du kit SDK .NET ni du code source.

    Vous devez appliquer les migrations à chaque mise en production à l'aide d'un bundle de migration. L'application ne doit démarrer qu'une fois le schéma à jour, et l'identité d'exécution de l'application ne doit conserver que des autorisations de lecture et d'écriture des données.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: bundle, text: { en: "In the build stage, run `dotnet ef migrations bundle --self-contained --target-runtime linux-x64 --output efbundle`.", fr: "Dans la phase de build, exécuter `dotnet ef migrations bundle --self-contained --target-runtime linux-x64 --output efbundle`." } }
    - { id: publish, text: { en: "Publish **efbundle** as a pipeline artifact.", fr: "Publier **efbundle** comme artefact de pipeline." } }
    - { id: run, text: { en: "In the production deployment job, run `./efbundle --connection` with a deployment connection string stored as a secret variable.", fr: "Dans le travail de déploiement en production, exécuter `./efbundle --connection` avec une chaîne de connexion de déploiement stockée dans une variable secrète." } }
    - { id: app, text: { en: "Deploy the new version of the API.", fr: "Déployer la nouvelle version de l'API." } }
    - { id: update, text: { en: "In the production deployment job, run `dotnet ef database update`.", fr: "Dans le travail de déploiement en production, exécuter `dotnet ef database update`." } }
    - { id: migrate, text: { en: "Call `Database.MigrateAsync()` when the API starts.", fr: "Appeler `Database.MigrateAsync()` au démarrage de l'API." } }
    - { id: add, text: { en: "In the build stage, run `dotnet ef migrations add Release`.", fr: "Dans la phase de build, exécuter `dotnet ef migrations add Release`." } }
answer:
  sequence: [ bundle, publish, run, app ]
explanation:
  correct:
    en: "A migration bundle is a single executable built in CI; with `--self-contained` and a target runtime it runs on an agent without the .NET SDK, EF tools or source code. The build creates and publishes it, the deployment job runs it with a separate deployment connection string from the secret store, and the API is deployed afterward so it finds the new schema."
    fr: "Un bundle de migration est un exécutable unique créé pendant l'intégration continue ; avec `--self-contained` et un runtime cible, il s'exécute sur un agent sans kit SDK .NET, outils EF ni code source. Le build le crée et le publie, le travail de déploiement l'exécute avec une chaîne de connexion de déploiement distincte issue du magasin de secrets, puis l'API est déployée pour trouver le nouveau schéma."
  options:
    update: { en: "`dotnet ef database update` needs the .NET SDK, the EF tools and the project source on the agent.", fr: "`dotnet ef database update` exige le kit SDK .NET, les outils EF et le code source du projet sur l'agent." }
    migrate: { en: "Migrating at startup gives the runtime identity schema permissions and doesn't run before the application starts.", fr: "La migration au démarrage donne des autorisations de schéma à l'identité d'exécution et ne s'exécute pas avant le démarrage de l'application." }
    add: { en: "`migrations add` creates a new migration in the source code; developers run it, not the release.", fr: "`migrations add` crée une nouvelle migration dans le code source ; les développeurs l'exécutent, pas la mise en production." }
references:
  - title: Applying Migrations - EF Core
    url: https://learn.microsoft.com/en-us/ef/core/managing-schemas/migrations/applying
