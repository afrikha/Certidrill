id: az400-3a-ver-nuget-ranges
objective: "3.1.3"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    You are editing the project file of a .NET service named **OrderApi**. The project references three packages, and each reference must meet one requirement:

    - **Contoso.Security**: exactly version 4.2.1, which the security team approved.
    - **Contoso.Data**: version 2.3.0 or any later 2.x version, never 3.0.0 or later.
    - **Contoso.Logging**: the highest stable 5.x version available at each restore.

    How should you complete the version attributes? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous modifiez le fichier projet d'un service .NET nommé **OrderApi**. Le projet référence trois packages, et chaque référence doit répondre à une exigence :

    - **Contoso.Security** : exactement la version 4.2.1, approuvée par l'équipe sécurité.
    - **Contoso.Data** : la version 2.3.0 ou toute version 2.x ultérieure, jamais 3.0.0 ou ultérieure.
    - **Contoso.Logging** : la version stable 5.x la plus élevée disponible à chaque restauration.

    Comment devez-vous compléter les attributs de version ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: text
  template: |
    <ItemGroup>
      <PackageReference Include="Contoso.Security" Version="[[sec]]" />
      <PackageReference Include="Contoso.Data" Version="[[data]]" />
      <PackageReference Include="Contoso.Logging" Version="[[log]]" />
    </ItemGroup>
  slots:
    - id: sec
      options:
        - { id: exact, text: "[4.2.1]" }
        - { id: min, text: "4.2.1" }
        - { id: excl, text: "(4.2.1)" }
        - { id: float42, text: "4.2.*" }
    - id: data
      options:
        - { id: mixed, text: "[2.3.0,3.0.0)" }
        - { id: incl, text: "[2.3.0,3.0.0]" }
        - { id: min, text: "2.3.0" }
        - { id: max, text: "(,3.0.0)" }
    - id: log
      options:
        - { id: float, text: "5.*" }
        - { id: floatpre, text: "5.*-*" }
        - { id: min, text: "5.0.0" }
        - { id: range, text: "[5.0.0,6.0.0)" }
answer:
  values: { sec: exact, data: mixed, log: float }
explanation:
  correct:
    en: |
      Square brackets around a single version, [4.2.1], require an exact match. [2.3.0,3.0.0) is an inclusive minimum with an exclusive maximum, so 3.0.0 is excluded. A floating version 5.* resolves to the highest stable 5.x version; ranges and minimum versions instead resolve to the lowest applicable version.
    fr: |
      Des crochets autour d'une seule version, [4.2.1], exigent une correspondance exacte. [2.3.0,3.0.0) est un minimum inclusif avec un maximum exclusif : 3.0.0 est exclu. Une version flottante 5.* se résout vers la version stable 5.x la plus élevée ; les plages et les versions minimales se résolvent au contraire vers la version applicable la plus basse.
  options:
    min: { en: "A bare version number is a minimum, inclusive: it accepts any later version, and NuGet resolves the lowest one available.", fr: "Un numéro de version seul est un minimum inclusif : il accepte toute version ultérieure, et NuGet résout la plus basse disponible." }
    excl: { en: "(4.2.1) is an invalid notation.", fr: "(4.2.1) est une notation non valide." }
    incl: { en: "[2.3.0,3.0.0] includes 3.0.0, which is forbidden.", fr: "[2.3.0,3.0.0] inclut 3.0.0, qui est interdite." }
    max: { en: "(,3.0.0) has no lower bound, so versions before 2.3.0 are accepted.", fr: "(,3.0.0) n'a pas de borne inférieure : des versions antérieures à 2.3.0 sont acceptées." }
    float42: { en: "4.2.* floats to the highest stable 4.2.x version, so a later patch would replace the approved 4.2.1.", fr: "4.2.* flotte vers la version stable 4.2.x la plus élevée : un correctif ultérieur remplacerait la version 4.2.1 approuvée." }
    floatpre: { en: "5.*-* also includes prerelease versions.", fr: "5.*-* inclut aussi les préversions." }
    range: { en: "A range resolves to the lowest applicable version, not the highest.", fr: "Une plage se résout vers la version applicable la plus basse, pas la plus élevée." }
references:
  - title: Package versioning
    url: https://learn.microsoft.com/en-us/nuget/concepts/package-versioning
  - title: How NuGet resolves package dependencies
    url: https://learn.microsoft.com/en-us/nuget/concepts/dependency-resolution
