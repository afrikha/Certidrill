id: az400-3d-layer-order
objective: "3.4.2"
type: ordering
difficulty: 1
status: draft
stem:
  en: |
    Wingtip Toys is creating a YAML pipeline that deploys a new version of its booking solution to Azure. The release contains the following changes:

    - A new subnet and a private endpoint for the database server, defined in Bicep.
    - A backward-compatible database schema change that adds a table.
    - A new version of the booking API that reads the new table.
    - A new version of the web front end that calls the new API operations.

    Each stage must start only after the components it depends on are deployed.

    Which four stages should the pipeline run in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Wingtip Toys crée un pipeline YAML qui déploie une nouvelle version de sa solution de réservation dans Azure. La mise en production contient les modifications suivantes :

    - Un nouveau sous-réseau et un point de terminaison privé pour le serveur de base de données, définis en Bicep.
    - Une modification rétrocompatible du schéma de base de données qui ajoute une table.
    - Une nouvelle version de l'API de réservation qui lit la nouvelle table.
    - Une nouvelle version du front-end web qui appelle les nouvelles opérations de l'API.

    Chaque phase ne doit démarrer qu'après le déploiement des composants dont elle dépend.

    Quelles sont les quatre phases que le pipeline doit exécuter dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: web, text: { en: "Deploy the web front end.", fr: "Déployer le front-end web." } }
    - { id: net, text: { en: "Deploy the subnet and the private endpoint from Bicep.", fr: "Déployer le sous-réseau et le point de terminaison privé à partir de Bicep." } }
    - { id: restore, text: { en: "Restore the database from the latest backup.", fr: "Restaurer la base de données à partir de la dernière sauvegarde." } }
    - { id: api, text: { en: "Deploy the booking API.", fr: "Déployer l'API de réservation." } }
    - { id: schema, text: { en: "Apply the database schema change.", fr: "Appliquer la modification du schéma de base de données." } }
    - { id: delay, text: { en: "Wait 15 minutes by using a Delay task.", fr: "Attendre 15 minutes à l'aide d'une tâche Delay." } }
answer:
  sequence: [ net, schema, api, web ]
explanation:
  correct:
    en: |
      Deploy what others depend on first: the network path to the database, then the schema, then the API that reads the new table, and last the front end that calls the new API. Each stage declares `dependsOn` on the previous one, so a failure stops the chain before a dependent component is deployed.
    fr: |
      Déployez d'abord ce dont les autres dépendent : le chemin réseau vers la base de données, puis le schéma, puis l'API qui lit la nouvelle table, et enfin le front-end qui appelle la nouvelle API. Chaque phase déclare `dependsOn` sur la précédente : un échec arrête la chaîne avant le déploiement d'un composant dépendant.
  options:
    restore: { en: "Restoring a backup is not a deployment step and would lose recent data.", fr: "Restaurer une sauvegarde n'est pas une étape de déploiement et ferait perdre les données récentes." }
    delay: { en: "A fixed wait is a timing assumption; explicit stage dependencies order the deployment reliably.", fr: "Une attente fixe est une hypothèse de durée ; des dépendances explicites entre phases ordonnent le déploiement de manière fiable." }
references:
  - title: Add stages, dependencies, and conditions
    url: https://learn.microsoft.com/en-us/azure/devops/pipelines/process/stages
