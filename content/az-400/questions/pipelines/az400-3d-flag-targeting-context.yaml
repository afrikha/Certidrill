id: az400-3d-flag-targeting-context
objective: "3.4.6"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Proseware has an ASP.NET Core web app that signs users in with Microsoft Entra ID. The app loads its feature flags from Azure App Configuration and contains the following registration:

    ```text
    builder.Services.AddFeatureManagement()
                    .WithTargeting();
    ```

    A flag named **Ledger** has a Microsoft.Targeting filter that includes the group **Auditors** with a rollout percentage of 100.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware dispose d'une application web ASP.NET Core qui connecte les utilisateurs avec Microsoft Entra ID. L'application charge ses indicateurs de fonctionnalités depuis Azure App Configuration et contient l'enregistrement suivant :

    ```text
    builder.Services.AddFeatureManagement()
                    .WithTargeting();
    ```

    Un indicateur nommé **Ledger** possède un filtre Microsoft.Targeting qui inclut le groupe **Auditors** avec un pourcentage de déploiement de 100.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          With this registration, the group membership used by the targeting filter comes from the Role claims of the signed-in user.
        fr: |
          Avec cet enregistrement, l'appartenance aux groupes utilisée par le filtre de ciblage provient des revendications Role de l'utilisateur connecté.
    - id: s2
      text:
        en: |
          If `.WithTargeting()` is removed, the targeting filter of Ledger is still evaluated, because `AddFeatureManagement()` registers every built-in filter for web apps.
        fr: |
          Si `.WithTargeting()` est supprimé, le filtre de ciblage de Ledger est toujours évalué, car `AddFeatureManagement()` enregistre tous les filtres intégrés pour les applications web.
    - id: s3
      text:
        en: |
          If the **Enable feature flag** setting of Ledger is turned off, members of Auditors still get the feature.
        fr: |
          Si le paramètre **Enable feature flag** de Ledger est désactivé, les membres d'Auditors obtiennent toujours la fonctionnalité.
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: |
      Without a custom accessor, `WithTargeting()` uses a default targeting context that takes the user ID from the identity name and the groups from the Role claims. All the built-in filters except the web targeting filter are added by `AddFeatureManagement()`; the targeting filter is added by `WithTargeting()`. A flag whose enabled state is false is off for everyone, whatever its filters say.
    fr: |
      Sans accesseur personnalisé, `WithTargeting()` utilise un contexte de ciblage par défaut qui prend l'ID utilisateur dans le nom de l'identité et les groupes dans les revendications Role. Tous les filtres intégrés, sauf le filtre de ciblage web, sont ajoutés par `AddFeatureManagement()` ; le filtre de ciblage est ajouté par `WithTargeting()`. Un indicateur dont l'état enabled vaut false est désactivé pour tout le monde, quels que soient ses filtres.
references:
  - title: Roll out features to targeted audiences in an ASP.NET Core application
    url: https://learn.microsoft.com/en-us/azure/azure-app-configuration/howto-targetingfilter-aspnet-core
  - title: .NET feature management
    url: https://learn.microsoft.com/en-us/azure/azure-app-configuration/feature-management-dotnet-reference
