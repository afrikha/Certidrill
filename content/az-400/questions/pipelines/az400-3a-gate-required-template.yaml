id: az400-3a-gate-required-template
objective: "3.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Contoso has 40 YAML pipelines that deploy to Azure by using a service connection named **sc-prod**. The security team published a YAML template named `secure-deploy.yml` in the repository **governance/templates**. The template runs a dependency scan and a credential scan before any deployment step.

    You need to ensure that no pipeline can use sc-prod unless it runs the steps of secure-deploy.yml. The solution must not rely on pipeline authors to follow a convention.

    What should you do?
  fr: |
    Contoso dispose de 40 pipelines YAML qui déploient sur Azure avec une connexion de service nommée **sc-prod**. L'équipe sécurité a publié un modèle YAML nommé `secure-deploy.yml` dans le dépôt **governance/templates**. Le modèle exécute une analyse des dépendances et une analyse des informations d'identification avant toute étape de déploiement.

    Vous devez faire en sorte qu'aucun pipeline ne puisse utiliser sc-prod sans exécuter les étapes de secure-deploy.yml. La solution ne doit pas dépendre du respect d'une convention par les auteurs de pipelines.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Add a Required template check on sc-prod that references secure-deploy.yml", fr: "Ajouter sur sc-prod une vérification Required template qui référence secure-deploy.yml" } }
    - { id: b, text: { en: "Add a Branch control check on sc-prod that allows only refs/heads/main", fr: "Ajouter sur sc-prod une vérification Branch control qui n'autorise que refs/heads/main" } }
    - { id: c, text: { en: "Add a build validation branch policy that runs secure-deploy.yml on governance/templates", fr: "Ajouter une stratégie de branche de validation de build qui exécute secure-deploy.yml sur governance/templates" } }
    - { id: d, text: { en: "Add an Approvals check on sc-prod for the security team", fr: "Ajouter sur sc-prod une vérification Approvals pour l'équipe sécurité" } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      The Required template check makes a run fail when the pipeline does not extend from the referenced template (repository, ref and path). Configured on the service connection, it applies to every pipeline that uses sc-prod and cannot be bypassed by editing a pipeline.
    fr: |
      La vérification Required template fait échouer une exécution lorsque le pipeline n'étend pas le modèle référencé (dépôt, référence et chemin). Configurée sur la connexion de service, elle s'applique à chaque pipeline qui utilise sc-prod et ne peut pas être contournée en modifiant un pipeline.
  options:
    b: { en: "Branch control limits which branches can use the resource; a pipeline on main could still skip the scans.", fr: "Branch control limite les branches qui peuvent utiliser la ressource ; un pipeline sur main pourrait toujours ignorer les analyses." }
    c: { en: "A branch policy on the template repository validates changes to the template, not the pipelines that use sc-prod.", fr: "Une stratégie de branche sur le dépôt des modèles valide les modifications du modèle, pas les pipelines qui utilisent sc-prod." }
    d: { en: "A manual approval relies on reviewers inspecting each run; it does not enforce the template.", fr: "Une approbation manuelle repose sur l'inspection de chaque exécution par des réviseurs ; elle n'impose pas le modèle." }
references:
  - title: Define approvals and checks
    url: https://learn.microsoft.com/en-us/azure/devops/pipelines/process/approvals
