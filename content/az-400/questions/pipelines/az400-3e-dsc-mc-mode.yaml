id: az400-3e-dsc-mc-mode
objective: "3.5.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso assigns a custom Azure Machine Configuration policy to its Windows Server virtual machines. The configuration sets the required registry values for TLS.

    The configuration must be applied to each machine, and later changes made by local administrators must be reported as noncompliant but not reverted automatically.

    Which assignment mode should you use?
  fr: |
    Contoso affecte une stratégie Azure Machine Configuration personnalisée à ses machines virtuelles Windows Server. La configuration définit les valeurs de registre requises pour TLS.

    La configuration doit être appliquée à chaque machine, et les modifications faites ensuite par les administrateurs locaux doivent être signalées comme non conformes, mais pas annulées automatiquement.

    Quel mode d'affectation devez-vous utiliser ?
body:
  options:
    - { id: a, text: Audit }
    - { id: b, text: ApplyAndAutoCorrect }
    - { id: c, text: ApplyAndMonitor }
    - { id: d, text: ApplyOnly }
answer: { optionId: c }
explanation:
  correct:
    en: "Apply and Monitor (ApplyAndMonitor) applies the configuration, then only monitors the machine and reports drift. Apply and Autocorrect would restore the settings whenever drift occurs."
    fr: "Le mode Apply and Monitor (ApplyAndMonitor) applique la configuration, puis se contente de surveiller la machine et de signaler la dérive. Apply and Autocorrect rétablirait les paramètres à chaque dérive."
  options:
    a:
      en: "Audit only reports the machine's state; it never applies the configuration."
      fr: "Audit signale uniquement l'état de la machine ; il n'applique jamais la configuration."
    b:
      en: "ApplyAndAutoCorrect reverts local changes, which the requirement forbids."
      fr: "ApplyAndAutoCorrect annule les modifications locales, ce que l'exigence interdit."
    d:
      en: "ApplyOnly is a configuration mode of the PowerShell DSC Local Configuration Manager, not a Machine Configuration assignment mode."
      fr: "ApplyOnly est un mode de configuration du gestionnaire de configuration local (LCM) de PowerShell DSC, pas un mode d'affectation de Machine Configuration."
references:
  - title: What is Azure Machine Configuration?
    url: https://learn.microsoft.com/en-us/azure/governance/machine-configuration/overview
