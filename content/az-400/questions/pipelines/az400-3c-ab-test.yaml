id: az400-3c-ab-test
objective: "3.4.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    The product team at Northwind has built two versions of the product recommendation engine. Both versions are production-ready and healthy. For two weeks, the team wants to show each version to half of the users, and then keep the version that produces the larger average basket.

    Which approach should you recommend?
  fr: |
    L'équipe produit de Northwind a développé deux versions du moteur de recommandation de produits. Les deux versions sont prêtes pour la production et intègres. Pendant deux semaines, l'équipe veut montrer chaque version à la moitié des utilisateurs, puis conserver celle qui produit le panier moyen le plus élevé.

    Quelle approche devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "A/B testing", fr: "Des tests A/B" } }
    - { id: b, text: { en: "A canary release", fr: "Une mise en production canari" } }
    - { id: c, text: { en: "A blue-green deployment", fr: "Un déploiement bleu/vert" } }
    - { id: d, text: { en: "A ring-based deployment", fr: "Un déploiement en anneau" } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      A/B testing shows two variants to two groups of users at the same time and compares them against a business metric, here the average basket, to choose a winner. Variant feature flags are a common way to assign the users to each variant.
    fr: |
      Les tests A/B montrent deux variantes à deux groupes d'utilisateurs en même temps et les comparent sur un indicateur métier, ici le panier moyen, pour en retenir une. Les indicateurs de fonctionnalités à variantes sont un moyen courant d'affecter les utilisateurs à chaque variante.
  options:
    b: { en: "A canary validates the health of one new version on a small share of traffic before rolling it out; it doesn't compare two healthy variants.", fr: "Un canari valide l'intégrité d'une nouvelle version sur une petite part du trafic avant de la déployer ; il ne compare pas deux variantes intègres." }
    c: { en: "Blue-green moves all users from one environment to the other at once.", fr: "Le bleu/vert fait passer tous les utilisateurs d'un environnement à l'autre en une fois." }
    d: { en: "Rings expose one version to successive audiences; they don't split users evenly between two variants.", fr: "Les anneaux exposent une version à des audiences successives ; ils ne répartissent pas les utilisateurs de façon égale entre deux variantes." }
references:
  - title: Use variant feature flags
    url: https://learn.microsoft.com/en-us/azure/azure-app-configuration/howto-variant-feature-flags
