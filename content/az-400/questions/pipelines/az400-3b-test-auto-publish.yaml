id: az400-3b-test-auto-publish
objective: "3.2.3"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    Litware has an Azure Pipelines YAML pipeline that runs several test suites. The team wants to remove every PublishTestResults@2 task that isn't needed.

    Which two steps publish their test results to the **Tests** tab of the run without a PublishTestResults@2 task?

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware dispose d'un pipeline YAML Azure Pipelines qui exécute plusieurs suites de tests. L'équipe veut supprimer chaque tâche PublishTestResults@2 qui n'est pas nécessaire.

    Quelles sont les deux étapes qui publient leurs résultats de test dans l'onglet **Tests** de l'exécution sans tâche PublishTestResults@2 ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "A DotNetCoreCLI@2 task with `command: test`", fr: "Une tâche DotNetCoreCLI@2 avec `command: test`" } }
    - { id: b, text: { en: "A script step that runs `pytest --junitxml=results.xml`", fr: "Une étape de script qui exécute `pytest --junitxml=results.xml`" } }
    - { id: c, text: { en: "A VSTest@3 task with `testSelector: testAssemblies`", fr: "Une tâche VSTest@3 avec `testSelector: testAssemblies`" } }
    - { id: d, text: { en: "A script step that runs `npm test` with the jest-junit reporter", fr: "Une étape de script qui exécute `npm test` avec le générateur de rapports jest-junit" } }
    - { id: e, text: { en: "A PowerShell@2 task that runs `Invoke-Pester -OutputFile results.xml`", fr: "Une tâche PowerShell@2 qui exécute `Invoke-Pester -OutputFile results.xml`" } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |
      The Visual Studio Test task and the .NET Core CLI task publish test results automatically, so they don't need a separate PublishTestResults@2 task. Test runners started from a script only write a results file: a PublishTestResults@2 task must read that file to fill the Tests tab.
    fr: |
      La tâche Visual Studio Test et la tâche .NET Core CLI publient automatiquement les résultats de test : elles n'ont pas besoin d'une tâche PublishTestResults@2 distincte. Les exécuteurs de tests lancés depuis un script ne font qu'écrire un fichier de résultats : une tâche PublishTestResults@2 doit lire ce fichier pour remplir l'onglet Tests.
  options:
    b: { en: "pytest writes a JUnit XML file; publishing it requires PublishTestResults@2.", fr: "pytest écrit un fichier XML JUnit ; sa publication exige PublishTestResults@2." }
    d: { en: "jest-junit writes a JUnit XML file but doesn't publish it to Azure Pipelines.", fr: "jest-junit écrit un fichier XML JUnit mais ne le publie pas dans Azure Pipelines." }
    e: { en: "Pester writes an NUnit-style XML file; a publishing task is still needed.", fr: "Pester écrit un fichier XML de type NUnit ; une tâche de publication reste nécessaire." }
references:
  - title: PublishTestResults@2 - Publish Test Results v2 task
    url: https://learn.microsoft.com/en-us/azure/devops/pipelines/tasks/reference/publish-test-results-v2
