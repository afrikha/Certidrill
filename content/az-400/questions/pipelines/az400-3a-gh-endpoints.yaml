id: az400-3a-gh-endpoints
objective: "3.1.1"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    The GitHub organization **proseware** publishes three kinds of packages to GitHub Packages from its workflows.

    Which host should each workflow publish to? To answer, drag the appropriate hosts to the correct packages. Each host may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    L'organisation GitHub **proseware** publie trois types de packages dans GitHub Packages depuis ses workflows.

    Vers quel hôte chaque workflow doit-il publier ? Pour répondre, faites glisser les hôtes appropriés vers les packages correspondants. Chaque hôte peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: npm, text: "npm.pkg.github.com" }
    - { id: nuget, text: "nuget.pkg.github.com" }
    - { id: ghcr, text: "ghcr.io" }
    - { id: maven, text: "maven.pkg.github.com" }
    - { id: ado, text: "pkgs.dev.azure.com" }
  targets:
    - { id: t1, text: { en: "The Docker image of the billing API", fr: "L'image Docker de l'API de facturation" } }
    - { id: t2, text: { en: "The .NET client library Proseware.Billing.Client", fr: "La bibliothèque cliente .NET Proseware.Billing.Client" } }
    - { id: t3, text: { en: "The JavaScript package @proseware/billing-widgets", fr: "Le package JavaScript @proseware/billing-widgets" } }
answer:
  mapping: { t1: ghcr, t2: nuget, t3: npm }
explanation:
  correct:
    en: |
      Container images go to the Container registry at `ghcr.io/OWNER/IMAGE-NAME`. Code packages use the host of their ecosystem, `PACKAGE-TYPE.pkg.github.com`, so a NuGet library goes to `nuget.pkg.github.com` and an npm package to `npm.pkg.github.com`. `maven.pkg.github.com` is for Maven and Gradle packages, and `pkgs.dev.azure.com` is Azure Artifacts, not GitHub Packages.
    fr: |
      Les images conteneur vont dans le Container registry à l'adresse `ghcr.io/OWNER/IMAGE-NAME`. Les packages de code utilisent l'hôte de leur écosystème, `PACKAGE-TYPE.pkg.github.com` : une bibliothèque NuGet va vers `nuget.pkg.github.com` et un package npm vers `npm.pkg.github.com`. `maven.pkg.github.com` sert aux packages Maven et Gradle, et `pkgs.dev.azure.com` est Azure Artifacts, pas GitHub Packages.
references:
  - title: Publish to GitHub Packages and GitHub Container Registry
    url: https://learn.microsoft.com/en-us/training/modules/github-actions-packages/2b-publish-using-workflow
  - title: GitHub Packages for code packages
    url: https://learn.microsoft.com/en-us/training/modules/github-actions-packages/5-github-packages-code-packages
