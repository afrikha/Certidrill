id: az400-3b-cov-sources
objective: "3.2.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Adatum builds a Java service with Maven on a self-hosted Linux agent. The JaCoCo plug-in writes target/site/jacoco/jacoco.xml, and the pipeline publishes that file with the PublishCodeCoverageResults@2 task.

    The report contains the coverage of each class, but the source files are referenced with paths relative to the source folders, so the HTML report of the run can't show the source code of the classes.

    What should you do?
  fr: |
    Adatum génère un service Java avec Maven sur un agent Linux auto-hébergé. Le plug-in JaCoCo écrit target/site/jacoco/jacoco.xml, et le pipeline publie ce fichier avec la tâche PublishCodeCoverageResults@2.

    Le rapport contient la couverture de chaque classe, mais les fichiers sources y sont référencés par des chemins relatifs aux dossiers sources : le rapport HTML de l'exécution ne peut pas afficher le code source des classes.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Set `failIfCoverageEmpty: true` in the inputs of PublishCodeCoverageResults@2.", fr: "Définir `failIfCoverageEmpty: true` dans les entrées de PublishCodeCoverageResults@2." } }
    - { id: b, text: { en: "Set `pathToSources` to the absolute path of the source folder, such as `$(System.DefaultWorkingDirectory)/src/main/java`.", fr: "Définir `pathToSources` sur le chemin absolu du dossier source, par exemple `$(System.DefaultWorkingDirectory)/src/main/java`." } }
    - { id: c, text: { en: "Set `summaryFileLocation` to the binary jacoco.exec file instead of jacoco.xml.", fr: "Définir `summaryFileLocation` sur le fichier binaire jacoco.exec au lieu de jacoco.xml." } }
    - { id: d, text: { en: "Add a PublishTestResults@2 task with `testResultsFormat: JUnit` before the coverage task.", fr: "Ajouter une tâche PublishTestResults@2 avec `testResultsFormat: JUnit` avant la tâche de couverture." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      The `pathToSources` input gives the absolute path of the source files. It's required when the coverage XML doesn't contain absolute source paths, which is the case for JaCoCo reports, so that the generated HTML report can link each class to its source code.
    fr: |
      L'entrée `pathToSources` indique le chemin absolu des fichiers sources. Elle est nécessaire quand le XML de couverture ne contient pas de chemins sources absolus, ce qui est le cas des rapports JaCoCo, pour que le rapport HTML généré puisse relier chaque classe à son code source.
  options:
    a: { en: "failIfCoverageEmpty only fails the task when no coverage data is produced.", fr: "failIfCoverageEmpty fait seulement échouer la tâche quand aucune donnée de couverture n'est produite." }
    c: { en: "The task reads XML summary files such as jacoco.xml; the binary execution data doesn't add source paths.", fr: "La tâche lit des fichiers de synthèse XML comme jacoco.xml ; les données d'exécution binaires n'ajoutent pas de chemins sources." }
    d: { en: "Test results don't affect the source mapping of the coverage report.", fr: "Les résultats de test n'ont pas d'effet sur la correspondance des sources du rapport de couverture." }
references:
  - title: PublishCodeCoverageResults@2 - Publish code coverage results v2 task
    url: https://learn.microsoft.com/en-us/azure/devops/pipelines/tasks/reference/publish-code-coverage-results-v2
