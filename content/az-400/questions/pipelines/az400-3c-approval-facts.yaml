id: az400-3c-approval-facts
objective: "3.3.9"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    At Adatum, the Azure Pipelines environment **prod** has an Approvals check whose approver is the group **Release Managers**. Several YAML pipelines deploy to prod.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Chez Adatum, l'environnement Azure Pipelines **prod** possède une vérification Approvals dont l'approbateur est le groupe **Release Managers**. Plusieurs pipelines YAML déploient vers prod.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          Every member of Release Managers must approve a run before its stage that deploys to prod starts.
        fr: |
          Chaque membre de Release Managers doit approuver une exécution avant que sa phase qui déploie vers prod démarre.
    - id: s2
      text:
        en: |
          A pipeline author can remove the approval for a pipeline by deleting the approval settings from the pipeline's YAML file.
        fr: |
          Un auteur de pipeline peut supprimer l'approbation pour un pipeline en effaçant les paramètres d'approbation de son fichier YAML.
    - id: s3
      text:
        en: |
          An approver can defer an approval so that it takes effect at a later time that the approver chooses.
        fr: |
          Un approbateur peut différer une approbation pour qu'elle prenne effet à une date ultérieure qu'il choisit.
answer:
  values: { s1: false, s2: false, s3: true }
explanation:
  correct:
    en: |
      When a group is the approver, one member of the group is enough. Approvals and checks are defined on the resource in the web UI, not in YAML, so pipeline authors can't change them by editing their files. A deferred approval becomes effective at the time the approver sets, which is useful to deploy during a low-traffic window.
    fr: |
      Quand un groupe est l'approbateur, un seul membre du groupe suffit. Les approbations et les vérifications sont définies sur la ressource dans l'interface web, pas dans le YAML : les auteurs de pipelines ne peuvent pas les modifier en éditant leurs fichiers. Une approbation différée prend effet à l'heure fixée par l'approbateur, ce qui permet de déployer pendant une période de faible trafic.
references:
  - title: Define approvals and checks
    url: https://learn.microsoft.com/en-us/azure/devops/pipelines/process/approvals
