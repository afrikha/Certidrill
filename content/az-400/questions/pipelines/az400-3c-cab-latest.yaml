id: az400-3c-cab-latest
objective: "3.3.9"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Northwind's YAML pipeline deploys to the environment **prod** after each merge to main. The YAML doesn't set `lockBehavior`. You need to meet the following requirements:

    - A member of the CAB group must approve each deployment to prod.
    - When several runs are waiting to deploy to prod, only the most recent run deploys; the older runs must not deploy.

    Which two checks should you add to prod? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Le pipeline YAML de Northwind déploie vers l'environnement **prod** après chaque fusion dans main. Le YAML ne définit pas `lockBehavior`. Vous devez respecter les exigences suivantes :

    - Un membre du groupe CAB doit approuver chaque déploiement vers prod.
    - Quand plusieurs exécutions attendent de déployer vers prod, seule la plus récente déploie ; les plus anciennes ne doivent pas déployer.

    Quelles sont les deux vérifications à ajouter à prod ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: Business hours }
    - { id: b, text: Branch control }
    - { id: c, text: Approvals }
    - { id: d, text: Invoke REST API }
    - { id: e, text: Exclusive lock }
answer: { optionIds: [ c, e ] }
explanation:
  correct:
    en: |
      An Approvals check with the CAB group as approver needs one member of the group to approve each run. With an Exclusive lock check and no lockBehavior in the YAML, the default runLatest behavior applies, so only the latest run acquires the lock and the older waiting runs don't deploy.
    fr: |
      Une vérification Approvals avec le groupe CAB comme approbateur exige qu'un membre du groupe approuve chaque exécution. Avec une vérification Exclusive lock et sans lockBehavior dans le YAML, le comportement par défaut runLatest s'applique : seule la dernière exécution obtient le verrou et les exécutions plus anciennes en attente ne déploient pas.
  options:
    a: { en: "Business hours limits deployments to a time window; it neither collects approvals nor discards older runs.", fr: "Business hours limite les déploiements à une plage horaire ; elle ne recueille pas d'approbation et n'écarte pas les exécutions plus anciennes." }
    b: { en: "Branch control checks the source branch of the resources.", fr: "Branch control vérifie la branche source des ressources." }
    d: { en: "Invoke REST API waits for an external system's answer, not for a person or a lock.", fr: "Invoke REST API attend la réponse d'un système externe, pas une personne ni un verrou." }
references:
  - title: Define approvals and checks
    url: https://learn.microsoft.com/en-us/azure/devops/pipelines/process/approvals
