id: az400-3b-trg-ci-filters
objective: "3.3.4"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Adatum's YAML pipeline builds an Azure Repos Git repository. You need the pipeline to meet the following requirements:

    - Run for pushes to main and to the branches whose names start with releases/.
    - When several pushes arrive while a run is in progress, start only one new run for all of them.
    - Run when a tag whose name starts with v is pushed.
    - Don't run for pushes that only change files in the docs folder.

    How should you complete the YAML? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Le pipeline YAML d'Adatum génère un dépôt Git Azure Repos. Le pipeline doit satisfaire les exigences suivantes :

    - S'exécuter pour les envois sur main et sur les branches dont le nom commence par releases/.
    - Quand plusieurs envois arrivent pendant une exécution, ne démarrer qu'une seule nouvelle exécution pour l'ensemble.
    - S'exécuter quand une balise dont le nom commence par v est envoyée.
    - Ne pas s'exécuter pour les envois qui ne modifient que des fichiers du dossier docs.

    Comment devez-vous compléter le YAML ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: yaml
  template: |
    trigger:
      [[batch]]: true
      branches:
        include:
          - main
          - releases/*
      [[tags]]:
        include:
          - v*
      [[paths]]:
        exclude:
          - docs
  slots:
    - id: batch
      options:
        - { id: autocancel, text: autoCancel }
        - { id: always, text: always }
        - { id: batch, text: batch }
    - id: tags
      options:
        - { id: tags, text: tags }
        - { id: stages, text: stages }
        - { id: drafts, text: drafts }
    - id: paths
      options:
        - { id: branches, text: branches }
        - { id: paths, text: paths }
        - { id: tags2, text: tags }
answer:
  values: { batch: batch, tags: tags, paths: paths }
explanation:
  correct:
    en: |
      `batch: true` makes the system wait for the run in progress and then start one run for all the changes pushed meanwhile. Tags don't trigger pipelines by default, so a `tags` filter includes the v* tags. A `paths` filter with `exclude` prevents runs for pushes that only change the docs folder.
    fr: |
      `batch: true` fait attendre la fin de l'exécution en cours, puis démarre une seule exécution pour toutes les modifications envoyées entre-temps. Les balises ne déclenchent pas de pipeline par défaut : un filtre `tags` inclut les balises v*. Un filtre `paths` avec `exclude` empêche les exécutions pour les envois qui ne modifient que le dossier docs.
  options:
    autocancel: { en: "autoCancel is a pull request trigger property.", fr: "autoCancel est une propriété du déclencheur de pull request." }
    always: { en: "always is a property of scheduled triggers.", fr: "always est une propriété des déclencheurs planifiés." }
    stages: { en: "Stage filters belong to pipeline resource triggers.", fr: "Les filtres de phases appartiennent aux déclencheurs de ressources de pipeline." }
    drafts: { en: "drafts is a pull request trigger property for draft pull requests.", fr: "drafts est une propriété du déclencheur de pull request qui concerne les pull requests en brouillon." }
    branches: { en: "branches filters branch names, not the files changed by a push.", fr: "branches filtre les noms de branches, pas les fichiers modifiés par un envoi." }
    tags2: { en: "tags filters tag names, not the files changed by a push.", fr: "tags filtre les noms de balises, pas les fichiers modifiés par un envoi." }
references:
  - title: Build Azure Repos Git or TFS Git repositories
    url: https://learn.microsoft.com/en-us/azure/devops/pipelines/repos/azure-repos-git
