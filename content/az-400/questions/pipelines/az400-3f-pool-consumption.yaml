id: az400-3f-pool-consumption
objective: "3.6.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Litware's developers complain that their pipelines often wait in the queue of the self-hosted agent pool **pool-build**. Before you purchase more parallel jobs, you need to determine whether, during the last 30 days, the running jobs reached the concurrency limit while other jobs were queued.

    What should you use?
  fr: |
    Les développeurs de Litware se plaignent que leurs pipelines attendent souvent dans la file du pool d'agents auto-hébergés **pool-build**. Avant d'acheter davantage de travaux parallèles, vous devez déterminer si, au cours des 30 derniers jours, les travaux en cours ont atteint la limite de concurrence pendant que d'autres travaux étaient en file d'attente.

    Que devez-vous utiliser ?
body:
  options:
    - { id: a, text: { en: "The View in-progress jobs page of Organization settings > Pipelines > Parallel jobs", fr: "La page View in-progress jobs de Paramètres de l'organisation > Pipelines > Travaux parallèles" } }
    - { id: b, text: { en: "The Pipeline duration report on the Analytics tab of each pipeline", fr: "Le rapport Pipeline duration de l'onglet Analytics de chaque pipeline" } }
    - { id: c, text: { en: "The Pool consumption report on the Analytics tab of pool-build", fr: "Le rapport Pool consumption de l'onglet Analytics de pool-build" } }
    - { id: d, text: { en: "The Pipeline pass rate report on the Analytics tab of each pipeline", fr: "Le rapport Pipeline pass rate de l'onglet Analytics de chaque pipeline" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      The Pool consumption report, on the Analytics tab of an agent pool, shows the running and queued jobs against the parallel jobs for the previous 30 days. A queued backlog while running jobs sit at the concurrency limit indicates that more parallel jobs are needed.
    fr: |
      Le rapport Pool consumption, dans l'onglet Analytics d'un pool d'agents, montre les travaux en cours et en file d'attente par rapport aux travaux parallèles sur les 30 jours précédents. Une file d'attente qui s'allonge pendant que les travaux en cours sont à la limite de concurrence indique qu'il faut davantage de travaux parallèles.
  options:
    a: { en: "This page lists the jobs running and queued now; it has no history for the last 30 days.", fr: "Cette page liste les travaux en cours et en file d'attente maintenant ; elle n'a pas d'historique sur les 30 derniers jours." }
    b: { en: "The duration report covers one pipeline's successful runs and does not compare usage with the parallel job limit.", fr: "Le rapport de durée couvre les exécutions réussies d'un pipeline et ne compare pas l'utilisation à la limite de travaux parallèles." }
    d: { en: "The pass rate report shows failures, not queuing or concurrency.", fr: "Le rapport de taux de réussite montre les échecs, pas la file d'attente ni la concurrence." }
references:
  - title: Configure and pay for parallel jobs
    url: https://learn.microsoft.com/en-us/azure/devops/pipelines/licensing/concurrent-jobs
