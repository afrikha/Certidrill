id: az400-3d-downtime-techniques
objective: "3.4.3"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam is planning zero-downtime deployments for four workloads. Each workload must keep serving users while its new version is deployed.

    Which technique should you use for each workload? To answer, drag the appropriate techniques to the correct workloads. Each technique may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam planifie des déploiements sans interruption de service pour quatre charges de travail. Chaque charge de travail doit continuer à servir les utilisateurs pendant le déploiement de sa nouvelle version.

    Quelle technique devez-vous utiliser pour chaque charge de travail ? Pour répondre, faites glisser les techniques appropriées vers les charges de travail correspondantes. Chaque technique peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: slots, text: { en: "Deployment slots and swap", fr: "Emplacements de déploiement et permutation" } }
    - { id: vmssRolling, text: { en: "Rolling upgrade policy of the scale set", fr: "Stratégie de mise à niveau propagée du groupe identique" } }
    - { id: afd, text: { en: "Azure Front Door origin priorities", fr: "Priorités d'origine d'Azure Front Door" } }
    - { id: jobRolling, text: { en: "Deployment job with the rolling strategy", fr: "Travail de déploiement avec la stratégie rolling" } }
    - { id: autoswap, text: { en: "Auto swap to production", fr: "Permutation automatique vers la production" } }
    - { id: restart, text: { en: "Restart of the App Service app", fr: "Redémarrage de l'application App Service" } }
  targets:
    - id: t1
      text: { en: "An App Service web app on Linux in the Standard tier: deploy and warm up the new version before it receives production traffic", fr: "Une application web App Service sous Linux dans le niveau Standard : déployer et préchauffer la nouvelle version avant qu'elle reçoive le trafic de production" }
    - id: t2
      text: { en: "A Virtual Machine Scale Set behind a Standard Load Balancer: apply a new image to 20 percent of the instances at a time and stop if instances become unhealthy", fr: "Un groupe de machines virtuelles identiques derrière un Standard Load Balancer : appliquer une nouvelle image à 20 pour cent des instances à la fois et s'arrêter si des instances deviennent défectueuses" }
    - id: t3
      text: { en: "Two identical deployments in West Europe and North Europe: send all users to West Europe while North Europe is upgraded", fr: "Deux déploiements identiques en Europe de l'Ouest et en Europe du Nord : envoyer tous les utilisateurs vers l'Europe de l'Ouest pendant la mise à niveau de l'Europe du Nord" }
    - id: t4
      text: { en: "Six virtual machines registered in an Azure Pipelines environment: deploy a package to two machines at a time", fr: "Six machines virtuelles inscrites dans un environnement Azure Pipelines : déployer un package sur deux machines à la fois" }
answer:
  mapping: { t1: slots, t2: vmssRolling, t3: afd, t4: jobRolling }
explanation:
  correct:
    en: |
      A slot swap warms up the new version before routing changes, so App Service users see no downtime. A rolling upgrade policy upgrades a scale set in batches and stops when the unhealthy thresholds are exceeded. Front Door sends traffic to the healthy origins that have the highest priority (the lowest priority value), so giving the region being upgraded a lower priority drains it. The rolling strategy of a deployment job deploys to virtual machine resources in batches of `maxParallel`.
    fr: |
      Une permutation d'emplacements préchauffe la nouvelle version avant de modifier le routage : les utilisateurs d'App Service ne subissent aucune interruption. Une stratégie de mise à niveau propagée met à niveau un groupe identique par lots et s'arrête quand les seuils d'instances défectueuses sont dépassés. Front Door envoie le trafic vers les origines saines de plus haute priorité (la plus petite valeur de priorité) : donner une priorité inférieure à la région mise à niveau la vide de son trafic. La stratégie rolling d'un travail de déploiement déploie vers des ressources de machines virtuelles par lots de `maxParallel`.
  options:
    autoswap: { en: "Auto swap isn't supported for web apps on Linux.", fr: "La permutation automatique n'est pas prise en charge pour les applications web sous Linux." }
    restart: { en: "A restart interrupts the app and deploys nothing.", fr: "Un redémarrage interrompt l'application et ne déploie rien." }
references:
  - title: Set up staging environments in Azure App Service
    url: https://learn.microsoft.com/en-us/azure/app-service/deploy-staging-slots
  - title: Configure rolling upgrades on Virtual Machine Scale Sets
    url: https://learn.microsoft.com/en-us/azure/virtual-machine-scale-sets/virtual-machine-scale-sets-configure-rolling-upgrades
