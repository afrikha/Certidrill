id: az400-3f-cache-reset
objective: "3.6.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Litware has a YAML pipeline that caches Yarn packages with the following step.

    ```yaml
    - task: Cache@2
      inputs:
        key: 'yarn | "$(Agent.OS)" | yarn.lock'
        path: $(YARN_CACHE_FOLDER)
    ```

    A cache entry saved yesterday contains corrupted files, and yarn.lock will not change in the coming weeks. You need the next run to stop using the corrupted entry and to save a new one.

    What should you do?
  fr: |
    Litware dispose d'un pipeline YAML qui met en cache les packages Yarn avec l'étape suivante.

    ```yaml
    - task: Cache@2
      inputs:
        key: 'yarn | "$(Agent.OS)" | yarn.lock'
        path: $(YARN_CACHE_FOLDER)
    ```

    Une entrée de cache enregistrée hier contient des fichiers corrompus, et yarn.lock ne changera pas au cours des prochaines semaines. L'exécution suivante doit cesser d'utiliser l'entrée corrompue et en enregistrer une nouvelle.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Disable the Cache@2 step for the next run so that the entry expires, then enable it again", fr: "Désactiver l'étape Cache@2 pour l'exécution suivante afin que l'entrée expire, puis la réactiver" } }
    - { id: b, text: { en: "Add a string literal such as version2 as a new segment of the key", fr: "Ajouter une chaîne littérale comme version2 en tant que nouveau segment de la clé" } }
    - { id: c, text: { en: "Add a restoreKeys input that contains the same value as the key", fr: "Ajouter une entrée restoreKeys qui contient la même valeur que la clé" } }
    - { id: d, text: { en: "Rerun the failed job so that the Post-job: Cache step overwrites the entry", fr: "Réexécuter le travail en échec pour que l'étape Post-job: Cache écrase l'entrée" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Clearing a pipeline cache is not supported and cache entries are immutable. The documented workaround is to change the key, for example by adding a literal segment such as version2, so that existing entries no longer match and the next successful run saves a new entry.
    fr: |
      Vider un cache de pipeline n'est pas pris en charge et les entrées de cache sont immuables. Le contournement documenté consiste à changer la clé, par exemple en ajoutant un segment littéral comme version2, pour que les entrées existantes ne correspondent plus et que la prochaine exécution réussie enregistre une nouvelle entrée.
  options:
    a: { en: "An entry expires only after seven days without use, so skipping one run does not remove it, and clearing a cache is not supported.", fr: "Une entrée n'expire qu'après sept jours sans utilisation : sauter une exécution ne la supprime pas, et vider un cache n'est pas pris en charge." }
    c: { en: "Restore keys are used only when the key misses; the key still matches the corrupted entry.", fr: "Les clés de restauration ne sont utilisées que lorsque la clé ne correspond pas ; or la clé correspond toujours à l'entrée corrompue." }
    d: { en: "Caches are immutable: the cache step finds the existing entry again and no new entry is saved for the same key.", fr: "Les caches sont immuables : l'étape de cache retrouve l'entrée existante et aucune nouvelle entrée n'est enregistrée pour la même clé." }
references:
  - title: Pipeline caching
    url: https://learn.microsoft.com/en-us/azure/devops/pipelines/release/caching
