id: az400-3d-task-retry
objective: "3.4.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Fabrikam has a YAML pipeline in which an AzureCLI@2 task uploads static files to a storage account. About one run in ten fails on this task because of transient network errors, and rerunning the stage always succeeds.

    You need the pipeline to retry the task automatically up to three times when it fails, without rerunning the other steps of the job and without hiding real failures.

    What should you add to the task?
  fr: |
    Fabrikam dispose d'un pipeline YAML dans lequel une tâche AzureCLI@2 charge des fichiers statiques dans un compte de stockage. Environ une exécution sur dix échoue sur cette tâche à cause d'erreurs réseau transitoires, et relancer la phase réussit toujours.

    Vous devez faire en sorte que le pipeline relance automatiquement la tâche jusqu'à trois fois en cas d'échec, sans relancer les autres étapes du travail et sans masquer les vrais échecs.

    Que devez-vous ajouter à la tâche ?
body:
  options:
    - id: a
      text: "continueOnError: true"
    - id: b
      text: "timeoutInMinutes: 3"
    - id: c
      text: "retryCountOnTaskFailure: 3"
    - id: d
      text: "condition: always()"
answer: { optionId: c }
explanation:
  correct:
    en: |
      `retryCountOnTaskFailure` reruns only the failed task, up to the given number of times (10 at most), with an increasing delay between attempts. If every attempt fails, the task and the job still fail, so real problems stay visible.
    fr: |
      `retryCountOnTaskFailure` relance uniquement la tâche en échec, jusqu'au nombre de fois indiqué (10 au maximum), avec un délai croissant entre les tentatives. Si toutes les tentatives échouent, la tâche et le travail échouent toujours : les vrais problèmes restent visibles.
  options:
    a:
      en: "continueOnError ignores the failure instead of retrying, which hides real failures."
      fr: "continueOnError ignore l'échec au lieu de relancer la tâche, ce qui masque les vrais échecs."
    b:
      en: "timeoutInMinutes stops a task that runs too long; it doesn't retry a failed task."
      fr: "timeoutInMinutes arrête une tâche trop longue ; il ne relance pas une tâche en échec."
    d:
      en: "always() decides whether the task starts; it doesn't run the task again after a failure."
      fr: "always() détermine si la tâche démarre ; il ne réexécute pas la tâche après un échec."
references:
  - title: Task types and usage
    url: https://learn.microsoft.com/en-us/azure/devops/pipelines/process/tasks
