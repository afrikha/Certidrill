id: az400-3b-trg-completion
objective: "3.3.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Two YAML pipelines use the same Azure Repos repository: **lib-ci** builds a shared library and **app-ci** builds the app. Neither YAML file has a `trigger` section, and the organization and project use the default trigger settings. You add the following resource to app-ci.

    ```yaml
    resources:
      pipelines:
        - pipeline: lib
          source: lib-ci
          trigger: true
    ```

    Each push to main now starts lib-ci once and app-ci twice. app-ci must run only after lib-ci completes.

    What should you do?
  fr: |
    Deux pipelines YAML utilisent le même dépôt Azure Repos : **lib-ci** génère une bibliothèque partagée et **app-ci** génère l'application. Aucun des deux fichiers YAML n'a de section `trigger`, et l'organisation et le projet utilisent les paramètres de déclencheur par défaut. Vous ajoutez la ressource suivante à app-ci.

    ```yaml
    resources:
      pipelines:
        - pipeline: lib
          source: lib-ci
          trigger: true
    ```

    Chaque envoi sur main démarre désormais lib-ci une fois et app-ci deux fois. app-ci ne doit s'exécuter qu'après l'achèvement de lib-ci.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Add `trigger: none` to app-ci.", fr: "Ajouter `trigger: none` à app-ci." } }
    - { id: b, text: { en: "Add `pr: none` to app-ci.", fr: "Ajouter `pr: none` à app-ci." } }
    - { id: c, text: { en: "Add `trigger: none` to lib-ci.", fr: "Ajouter `trigger: none` à lib-ci." } }
    - { id: d, text: { en: "Add `batch: true` to the trigger of the pipeline resource.", fr: "Ajouter `batch: true` au déclencheur de la ressource de pipeline." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Without a `trigger` section, app-ci has an implicit CI trigger, so a push starts it once by CI and once more when lib-ci completes. Adding `trigger: none` to app-ci disables its CI trigger while the pipeline resource trigger still runs it after lib-ci.
    fr: |
      Sans section `trigger`, app-ci possède un déclencheur de CI implicite : un envoi le démarre une fois par la CI, puis une nouvelle fois quand lib-ci se termine. `trigger: none` dans app-ci désactive son déclencheur de CI, tandis que le déclencheur de ressource de pipeline l'exécute toujours après lib-ci.
  options:
    b: { en: "pr: none only concerns pull request triggers, which Azure Repos doesn't use anyway.", fr: "pr: none ne concerne que les déclencheurs de pull request, qu'Azure Repos n'utilise de toute façon pas." }
    c: { en: "lib-ci would no longer run on pushes, so app-ci would never be triggered.", fr: "lib-ci ne s'exécuterait plus lors des envois : app-ci ne serait jamais déclenché." }
    d: { en: "batch isn't a property of pipeline resource triggers and wouldn't remove the CI run.", fr: "batch n'est pas une propriété des déclencheurs de ressource de pipeline et ne supprimerait pas l'exécution de CI." }
references:
  - title: Trigger one pipeline after another
    url: https://learn.microsoft.com/en-us/azure/devops/pipelines/process/pipeline-triggers
