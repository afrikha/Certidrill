id: az400-cs3c-prod-stage
objective: "3.3.9"
type: dropdown
caseStudy: az400-cs3c-litware-energy
difficulty: 2
status: draft
stem:
  en: |
    You are adding a production stage to meterhub-ci after the Build stage that publishes the drop and db artifacts. The StagingUrl variable contains the URL of the staging slot. The stage must meet the deployment requirements 1, 2, and 3.

    How should you complete the YAML? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous ajoutez une phase de production à meterhub-ci après la phase Build qui publie les artefacts drop et db. La variable StagingUrl contient l'URL de l'emplacement staging. La phase doit satisfaire les exigences de déploiement 1, 2 et 3.

    Comment devez-vous compléter le YAML ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: yaml
  template: |
    - stage: Production
      dependsOn: Build
      jobs:
      - [[job]]: DeployMeterHub
        pool:
          vmImage: windows-latest
        environment: [[env]]
        strategy:
          runOnce:
            [[hook]]:
              steps:
              - task: AzureWebApp@1
                inputs:
                  azureSubscription: sc-meterhub-prod
                  appType: webApp
                  appName: app-meterhub
                  deployToSlotOrASE: true
                  resourceGroupName: RG-MeterHub-Prod
                  slotName: staging
                  package: $(Pipeline.Workspace)/drop/*.zip
              - pwsh: Invoke-WebRequest -Uri "$(StagingUrl)/health" -UseBasicParsing
              - task: AzureAppServiceManage@0
                inputs:
                  azureSubscription: sc-meterhub-prod
                  Action: Swap Slots
                  WebAppName: app-meterhub
                  ResourceGroupName: RG-MeterHub-Prod
                  SourceSlot: staging
  slots:
    - id: job
      options:
        - { id: deployment, text: "deployment" }
        - { id: plainjob, text: "job" }
        - { id: template, text: "template" }
    - id: env
      options:
        - { id: prodenv, text: "meterhub-prod" }
        - { id: sc, text: "sc-meterhub-prod" }
        - { id: rg, text: "RG-MeterHub-Prod" }
    - id: hook
      options:
        - { id: deploy, text: "deploy" }
        - { id: predeploy, text: "preDeploy" }
        - { id: onfailure, text: "on" }
answer:
  values: { job: deployment, env: prodenv, hook: deploy }
explanation:
  correct:
    en: |
      Only a deployment job can target an environment and use a deployment strategy. Targeting the meterhub-prod environment makes the stage wait for the approval check of the Operations group before the job starts. In the runOnce strategy, the deploy hook runs the deployment steps, and it is the only hook in which the download of the pipeline artifacts is injected automatically, so the drop package is available. The steps deploy to staging, test it, and swap it into production without downtime.
    fr: |
      Seul un travail de déploiement peut cibler un environnement et utiliser une stratégie de déploiement. Cibler l'environnement meterhub-prod fait attendre la phase jusqu'à la vérification d'approbation du groupe Operations avant le démarrage du travail. Dans la stratégie runOnce, le hook deploy exécute les étapes de déploiement, et c'est le seul hook dans lequel le téléchargement des artefacts de pipeline est injecté automatiquement : le package drop est donc disponible. Les étapes déploient dans staging, le testent, puis le permutent en production sans temps d'arrêt.
  options:
    plainjob:
      en: |
        A regular job cannot declare a deployment strategy, so the strategy section would be invalid.
      fr: |
        Un travail standard ne peut pas déclarer de stratégie de déploiement : la section strategy serait invalide.
    sc:
      en: |
        The service connection authenticates the tasks to Azure; the approval check is configured on the meterhub-prod environment.
      fr: |
        La connexion de service authentifie les tâches auprès d'Azure ; la vérification d'approbation est configurée sur l'environnement meterhub-prod.
    predeploy:
      en: |
        The preDeploy hook initializes resources, and the artifacts are not downloaded automatically in it, so the drop package would be missing.
      fr: |
        Le hook preDeploy initialise des ressources, et les artefacts n'y sont pas téléchargés automatiquement : le package drop serait absent.
references:
  - title: Deployment jobs
    url: https://learn.microsoft.com/en-us/azure/devops/pipelines/process/deployment-jobs
  - title: AzureAppServiceManage@0 - Azure App Service manage v0 task
    url: https://learn.microsoft.com/en-us/azure/devops/pipelines/tasks/reference/azure-app-service-manage-v0
