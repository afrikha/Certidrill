id: az400-3a-gh-npm-registry
objective: "3.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso hosts all its source code in a GitHub organization named **contoso-web** and builds it with GitHub Actions. The UI team maintains a private npm library named `@contoso-web/design-system` that is consumed by 12 other repositories of the organization.

    You need to recommend where the UI team should publish the library. The solution must keep the package private to the organization and must minimize administrative effort.

    What should you recommend?
  fr: |
    Contoso héberge tout son code source dans une organisation GitHub nommée **contoso-web** et le génère avec GitHub Actions. L'équipe UI maintient une bibliothèque npm privée nommée `@contoso-web/design-system`, consommée par 12 autres dépôts de l'organisation.

    Vous devez recommander l'endroit où l'équipe UI doit publier la bibliothèque. La solution doit garder le package privé pour l'organisation et réduire au minimum l'effort d'administration.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "The npm registry of GitHub Packages", fr: "Le registre npm de GitHub Packages" } }
    - { id: b, text: { en: "An npm feed in a new Azure Artifacts organization", fr: "Un flux npm dans une nouvelle organisation Azure Artifacts" } }
    - { id: c, text: { en: "The public npm registry at npmjs.com", fr: "Le registre npm public npmjs.com" } }
    - { id: d, text: { en: "A Universal Package in an Azure Artifacts feed", fr: "Un package universel dans un flux Azure Artifacts" } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      GitHub Packages provides an npm registry tied to the GitHub organization and its repositories, so the code, the workflows and the packages stay on one platform. A workflow publishes to `https://npm.pkg.github.com` with the built-in `GITHUB_TOKEN`, so there is no other service or stored secret to manage.
    fr: |
      GitHub Packages fournit un registre npm lié à l'organisation GitHub et à ses dépôts : le code, les workflows et les packages restent sur une seule plateforme. Un workflow publie vers `https://npm.pkg.github.com` avec le jeton intégré `GITHUB_TOKEN`, sans autre service ni secret stocké à gérer.
  options:
    b: { en: "An Azure Artifacts feed works, but it adds a second platform, its permissions and a token to store in GitHub, which does not minimize administrative effort.", fr: "Un flux Azure Artifacts fonctionne, mais il ajoute une deuxième plateforme, ses autorisations et un jeton à stocker dans GitHub, ce qui ne réduit pas l'effort d'administration." }
    c: { en: "The public npm registry is an external service outside the GitHub organization, and packages published there are public by default; the library must stay private to the organization.", fr: "Le registre npm public est un service externe à l'organisation GitHub, et les packages qui y sont publiés sont publics par défaut ; la bibliothèque doit rester privée pour l'organisation." }
    d: { en: "A Universal Package is a versioned set of files, not an npm package that npm install can resolve as a dependency.", fr: "Un package universel est un ensemble de fichiers versionné, pas un package npm que npm install peut résoudre comme dépendance." }
references:
  - title: Publish to GitHub Packages and GitHub Container Registry
    url: https://learn.microsoft.com/en-us/training/modules/github-actions-packages/2b-publish-using-workflow
