id: az400-cs2c-prod-checks
objective: "3.3.9"
type: multi
caseStudy: az400-cs2c-fourth-coffee
difficulty: 3
status: draft
stem:
  en: |
    You need to meet the requirement for deployments to the production environment.

    Which two checks should you add to the production environment? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez respecter l'exigence relative aux déploiements vers l'environnement production.

    Quelles sont les deux vérifications à ajouter à l'environnement production ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Business hours", fr: "Business hours (heures ouvrables)" } }
    - { id: b, text: { en: "Branch control", fr: "Branch control (contrôle de branche)" } }
    - { id: c, text: { en: "Exclusive lock", fr: "Exclusive lock (verrou exclusif)" } }
    - { id: d, text: { en: "Query Azure Monitor Alerts", fr: "Query Azure Monitor Alerts (interroger les alertes Azure Monitor)" } }
    - { id: e, text: { en: "Required template", fr: "Required template (modèle obligatoire)" } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: The Branch control check validates the branches of all the resources of the run against an allowed list, here refs/heads/main, and fails the stage otherwise. The Query Azure Monitor Alerts check succeeds only when none of the selected alert rules is fired; it is evaluated again after each Time between evaluations interval, so the deployment waits until the alerts clear or the timeout expires.
    fr: La vérification Branch control compare les branches de toutes les ressources de l'exécution à une liste autorisée, ici refs/heads/main, et fait échouer la phase dans le cas contraire. La vérification Query Azure Monitor Alerts ne réussit que si aucune des règles d'alerte sélectionnées n'est déclenchée ; elle est réévaluée après chaque intervalle Time between evaluations, si bien que le déploiement attend que les alertes disparaissent ou que le délai d'expiration soit atteint.
  options:
    a: { en: "Business hours delays deployments to a time window; it doesn't check the branch or the alerts.", fr: "Business hours reporte les déploiements à une plage horaire ; elle ne vérifie ni la branche ni les alertes." }
    c: { en: "Exclusive lock lets only one run use the environment at a time; it doesn't restrict branches or watch alerts.", fr: "Exclusive lock ne laisse qu'une exécution à la fois utiliser l'environnement ; elle ne restreint pas les branches et ne surveille pas les alertes." }
    e: { en: "Required template forces pipelines to extend a specific YAML template; it doesn't control which branch runs.", fr: "Required template oblige les pipelines à étendre un modèle YAML précis ; elle ne contrôle pas la branche exécutée." }
references:
  - title: Define approvals and checks
    url: https://learn.microsoft.com/en-us/azure/devops/pipelines/process/approvals
