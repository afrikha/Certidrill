id: az400-3c-status-functions
objective: "3.3.6"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    A job in an Azure Pipelines YAML pipeline runs integration tests against a test database. You need to set the `condition` of three steps that run after the tests.

    Which condition should you use for each step? To answer, drag the appropriate conditions to the correct steps. Each condition may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Un travail d'un pipeline YAML Azure Pipelines exécute des tests d'intégration sur une base de données de test. Vous devez définir la `condition` de trois étapes qui s'exécutent après les tests.

    Quelle condition devez-vous utiliser pour chaque étape ? Pour répondre, faites glisser les conditions appropriées vers les étapes correspondantes. Chaque condition peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: succeeded, text: "succeeded()" }
    - { id: sof, text: "succeededOrFailed()" }
    - { id: failed, text: "failed()" }
    - { id: always, text: "always()" }
    - { id: canceled, text: "canceled()" }
  targets:
    - { id: publish, text: { en: "Publish the test results whether the tests passed or failed, but not when the run is canceled", fr: "Publier les résultats des tests, que les tests aient réussi ou échoué, mais pas quand l'exécution est annulée" } }
    - { id: notify, text: { en: "Send a notification only when an earlier step of the job failed", fr: "Envoyer une notification uniquement quand une étape précédente du travail a échoué" } }
    - { id: cleanup, text: { en: "Remove a temporary firewall rule in every case, including when the run is canceled", fr: "Supprimer une règle de pare-feu temporaire dans tous les cas, y compris quand l'exécution est annulée" } }
answer:
  mapping: { publish: sof, notify: failed, cleanup: always }
explanation:
  correct:
    en: |
      succeededOrFailed() runs the step whatever the result of the earlier steps, but evaluates to false when the run is canceled. failed() is true only when an earlier step failed. always() is true even when the run is canceled, which suits cleanup steps.
    fr: |
      succeededOrFailed() exécute l'étape quel que soit le résultat des étapes précédentes, mais vaut false quand l'exécution est annulée. failed() n'est vrai que si une étape précédente a échoué. always() est vrai même quand l'exécution est annulée, ce qui convient aux étapes de nettoyage.
  options:
    succeeded: { en: "succeeded() is the default and skips the step after a failure.", fr: "succeeded() est la valeur par défaut et ignore l'étape après un échec." }
    canceled: { en: "canceled() is true only when the run is canceled.", fr: "canceled() n'est vrai que si l'exécution est annulée." }
references:
  - title: Expressions
    url: https://learn.microsoft.com/en-us/azure/devops/pipelines/process/expressions
