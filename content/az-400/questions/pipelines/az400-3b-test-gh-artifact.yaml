id: az400-3b-test-gh-artifact
objective: "3.2.3"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    Tailspin uses GitHub Actions. The test job of a workflow writes a JUnit report to reports/junit.xml.

    You need the report to be kept as an artifact of every workflow run, whether the tests pass or fail.

    How should you complete the workflow? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin utilise GitHub Actions. Le job de test d'un workflow écrit un rapport JUnit dans reports/junit.xml.

    Vous devez conserver ce rapport comme artefact de chaque exécution du workflow, que les tests réussissent ou échouent.

    Comment devez-vous compléter le workflow ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: yaml
  template: |
    jobs:
      test:
        runs-on: ubuntu-latest
        steps:
          - uses: actions/checkout@v4
          - run: npm ci
          - run: npm test
          - name: Keep the test report
            if: [[cond]]
            uses: [[act]]
            with:
              name: junit-report
              path: reports/junit.xml
  slots:
    - id: cond
      options:
        - { id: success, text: success() }
        - { id: failure, text: failure() }
        - { id: always, text: always() }
        - { id: cancelled, text: cancelled() }
    - id: act
      options:
        - { id: upload, text: actions/upload-artifact@v4 }
        - { id: download, text: actions/download-artifact@v4 }
        - { id: cache, text: actions/cache@v4 }
answer:
  values: { cond: always, act: upload }
explanation:
  correct:
    en: |
      A step runs by default only if the previous steps succeeded, so a failed `npm test` would skip the upload. `if: always()` runs the step whatever the result of the previous steps. The upload-artifact action stores the file as an artifact of the run, where it can be downloaded later.
    fr: |
      Par défaut, une étape ne s'exécute que si les étapes précédentes ont réussi : un échec de `npm test` ignorerait le chargement. `if: always()` exécute l'étape quel que soit le résultat des étapes précédentes. L'action upload-artifact enregistre le fichier comme artefact de l'exécution, où il peut être téléchargé plus tard.
  options:
    success: { en: "success() is the default: the step is skipped when the tests fail.", fr: "success() est la valeur par défaut : l'étape est ignorée quand les tests échouent." }
    failure: { en: "failure() runs the step only when a previous step failed.", fr: "failure() n'exécute l'étape que si une étape précédente a échoué." }
    cancelled: { en: "cancelled() runs the step only when the workflow is canceled.", fr: "cancelled() n'exécute l'étape que si le workflow est annulé." }
    download: { en: "download-artifact retrieves an artifact that was already uploaded.", fr: "download-artifact récupère un artefact déjà chargé." }
    cache: { en: "The cache action reuses dependencies between runs; it doesn't keep run artifacts.", fr: "L'action cache réutilise des dépendances entre exécutions ; elle ne conserve pas d'artefacts d'exécution." }
references:
  - title: Share artifacts between jobs
    url: https://learn.microsoft.com/en-us/training/modules/learn-continuous-integration-github-actions/4-share-artifacts-between-jobs
