id: az400-3d-hotfix-mainline-first
objective: "3.4.4"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam uses Azure Repos and Azure Pipelines. The team follows the same rule as the Azure DevOps team: every change, including an urgent fix, is made in **main** first and then ported to the release branch. Production runs from the **release/m214** branch, and only the pipeline runs of release branches can deploy to production.

    A high-priority bug is found in production. Branch policies on main and release/* require a pull request with a successful build.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Fabrikam utilise Azure Repos et Azure Pipelines. L'équipe applique la même règle que l'équipe Azure DevOps : chaque modification, y compris un correctif urgent, est d'abord effectuée dans **main**, puis reportée dans la branche de mise en production. La production s'exécute à partir de la branche **release/m214**, et seules les exécutions de pipeline des branches de mise en production peuvent déployer en production.

    Un bogue de priorité élevée est détecté en production. Les stratégies de branche de main et de release/* exigent une demande de tirage avec une build réussie.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: topic, text: { en: "Create a topic branch from main and commit the fix.", fr: "Créer une branche de rubrique à partir de main et y valider le correctif." } }
    - { id: prMain, text: { en: "Complete a pull request from the topic branch into main.", fr: "Terminer une demande de tirage de la branche de rubrique vers main." } }
    - { id: cherry, text: { en: "Cherry-pick the pull request into a new branch and complete a pull request into release/m214.", fr: "Sélectionner (cherry-pick) la demande de tirage dans une nouvelle branche et terminer une demande de tirage vers release/m214." } }
    - { id: deploy, text: { en: "Let the pipeline run of release/m214 deploy the fix through its stages to production.", fr: "Laisser l'exécution de pipeline de release/m214 déployer le correctif en production à travers ses phases." } }
    - { id: mergeMain, text: { en: "Merge main into release/m214.", fr: "Fusionner main dans release/m214." } }
    - { id: force, text: { en: "Push the fix directly to release/m214 with a force push.", fr: "Envoyer le correctif directement dans release/m214 avec un push forcé." } }
answer:
  sequence: [ topic, prMain, cherry, deploy ]
explanation:
  correct:
    en: |
      With a mainline-first policy, the fix goes through a pull request into main, so it can't be forgotten in the next release. Azure Repos then cherry-picks the changes of the pull request into a new topic branch that you merge into release/m214 with a second pull request. The run of the release branch builds the fix once and deploys it through the normal stages and approvals.
    fr: |
      Avec une règle « main d'abord », le correctif passe par une demande de tirage vers main : il ne peut pas être oublié dans la version suivante. Azure Repos sélectionne ensuite les modifications de la demande de tirage dans une nouvelle branche de rubrique, que vous fusionnez dans release/m214 avec une seconde demande de tirage. L'exécution de la branche de mise en production génère le correctif une seule fois et le déploie à travers les phases et approbations habituelles.
  options:
    mergeMain: { en: "Merging main brings the unreleased work of main into the release branch, not only the fix.", fr: "Fusionner main apporte dans la branche de mise en production le travail non publié de main, pas seulement le correctif." }
    force: { en: "A force push bypasses the pull request and build required by the branch policies and rewrites shared history.", fr: "Un push forcé contourne la demande de tirage et la build exigées par les stratégies de branche, et réécrit l'historique partagé." }
references:
  - title: Adopt a Git branching strategy
    url: https://learn.microsoft.com/en-us/azure/devops/repos/git/git-branching-guidance
  - title: Copy changes with cherry-pick
    url: https://learn.microsoft.com/en-us/azure/devops/repos/git/cherry-pick
