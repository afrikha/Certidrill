id: az400-3c-extends-required
objective: "3.3.8"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    At Litware, every YAML pipeline that uses the Azure Resource Manager service connection **sc-prod** must run credential scanning steps that the security team defines. Pipeline authors must not be able to skip or remove those steps by editing their own YAML files.

    Which two actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Chez Litware, chaque pipeline YAML qui utilise la connexion de service Azure Resource Manager **sc-prod** doit exécuter des étapes d'analyse des informations d'identification définies par l'équipe de sécurité. Les auteurs de pipelines ne doivent pas pouvoir ignorer ni supprimer ces étapes en modifiant leurs propres fichiers YAML.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Create a task group that contains the scanning tasks.", fr: "Créer un groupe de tâches qui contient les tâches d'analyse." } }
    - { id: b, text: { en: "Create an extends template that injects the scanning steps, in a repository that only the security team can change.", fr: "Créer un modèle extends qui injecte les étapes d'analyse, dans un dépôt que seule l'équipe de sécurité peut modifier." } }
    - { id: c, text: { en: "Create a step template that pipelines insert with `- template:`.", fr: "Créer un modèle d'étapes que les pipelines insèrent avec `- template:`." } }
    - { id: d, text: { en: "Add a Required template check to sc-prod that references the extends template.", fr: "Ajouter à sc-prod une vérification Required template qui référence le modèle extends." } }
    - { id: e, text: { en: "Add a Branch control check to sc-prod that allows only refs/heads/main.", fr: "Ajouter à sc-prod une vérification Branch control qui n'autorise que refs/heads/main." } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |
      An extends template defines the structure the pipeline must follow and can inject mandatory steps. A Required template check on the service connection makes any stage that uses sc-prod fail unless the pipeline extends that template, so authors can't bypass it.
    fr: |
      Un modèle extends définit la structure que le pipeline doit suivre et peut injecter des étapes obligatoires. Une vérification Required template sur la connexion de service fait échouer toute phase qui utilise sc-prod si le pipeline n'étend pas ce modèle : les auteurs ne peuvent pas le contourner.
  options:
    a: { en: "Task groups aren't supported in YAML pipelines.", fr: "Les groupes de tâches ne sont pas pris en charge dans les pipelines YAML." }
    c: { en: "An includes template is optional: an author can delete the `- template:` line.", fr: "Un modèle inclus est facultatif : un auteur peut supprimer la ligne `- template:`." }
    e: { en: "Branch control restricts the source branch; it doesn't force the scanning steps to run.", fr: "Branch control restreint la branche source ; elle n'oblige pas à exécuter les étapes d'analyse." }
references:
  - title: Use YAML templates in pipelines for reusable and secure processes
    url: https://learn.microsoft.com/en-us/azure/devops/pipelines/process/templates
  - title: Define approvals and checks
    url: https://learn.microsoft.com/en-us/azure/devops/pipelines/process/approvals
