id: az400-3b-agent-pool-choice
objective: "3.3.2"
type: hotarea
difficulty: 3
status: draft
stem:
  en: |
    Tailspin builds a public GitHub repository with Azure Pipelines and deploys the app to Azure. The Azure DevOps organization has the agent pools shown in the following table. The datacenter has no network connection to Azure virtual networks.

    Each job must run in a pool that can complete it and that exposes the fewest internal resources to the code being run.

    Answer each prompt by selecting the pool that should run the job.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin génère un dépôt GitHub public avec Azure Pipelines et déploie l'application sur Azure. L'organisation Azure DevOps dispose des pools d'agents présentés dans le tableau suivant. Le centre de données n'a aucune connexion réseau vers les réseaux virtuels Azure.

    Chaque travail doit s'exécuter dans un pool capable de le mener à bien et qui expose le moins de ressources internes au code exécuté.

    Répondez à chaque consigne en sélectionnant le pool qui doit exécuter le travail.

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
    - id: p1
      text: { en: "Validate the pull requests opened from forks of the repository", fr: "Valider les pull requests ouvertes depuis des duplications du dépôt" }
    - id: p2
      text: { en: "Deploy a schema change to the sql-orders database", fr: "Déployer une modification de schéma sur la base de données sql-orders" }
  grid:
    header: [{ en: "Pool", fr: "Pool" }, { en: "Type", fr: "Type" }, { en: "Network access", fr: "Accès réseau" }, { en: "Machine state", fr: "État des machines" }]
    rows:
      - [{ text: Azure Pipelines, area: hosted }, { text: { en: "Microsoft-hosted agents", fr: "Agents hébergés par Microsoft" } }, { text: { en: "Public internet only", fr: "Internet public uniquement" } }, { text: { en: "New VM for each job", fr: "Nouvelle machine virtuelle pour chaque travail" } }]
      - [{ text: Pool-DC, area: dc }, { text: { en: "Self-hosted agents on datacenter servers", fr: "Agents auto-hébergés sur des serveurs du centre de données" } }, { text: { en: "Corporate network", fr: "Réseau de l'entreprise" } }, { text: { en: "Files kept between jobs", fr: "Fichiers conservés entre les travaux" } }]
      - [{ text: Pool-MDP, area: mdp }, { text: { en: "Managed DevOps Pool", fr: "Managed DevOps Pool" } }, { text: { en: "Subnet of VNet-Prod, which contains the private endpoint of the sql-orders database", fr: "Sous-réseau de VNet-Prod, qui contient le point de terminaison privé de la base de données sql-orders" } }, { text: { en: "New agent for each job", fr: "Nouvel agent pour chaque travail" } }]
answer:
  values: { p1: hosted, p2: mdp }
explanation:
  correct:
    en: |
      Code from fork pull requests is untrusted, so it should run on Microsoft-hosted agents: each job gets a fresh VM that isn't connected to any of Tailspin's networks. The sql-orders database is reachable only through its private endpoint in VNet-Prod, so the deployment must run on Pool-MDP, whose agents are injected into that virtual network. Pool-DC can't reach Azure virtual networks and keeps state between jobs.
    fr: |
      Le code des pull requests issues de duplications n'est pas fiable : il doit s'exécuter sur des agents hébergés par Microsoft, où chaque travail reçoit une nouvelle machine virtuelle connectée à aucun réseau de Tailspin. La base de données sql-orders n'est accessible que par son point de terminaison privé dans VNet-Prod : le déploiement doit s'exécuter sur Pool-MDP, dont les agents sont injectés dans ce réseau virtuel. Pool-DC ne peut pas atteindre les réseaux virtuels Azure et conserve son état entre les travaux.
references:
  - title: Microsoft-hosted agents
    url: https://learn.microsoft.com/en-us/azure/devops/pipelines/agents/hosted
  - title: Configure networking
    url: https://learn.microsoft.com/en-us/azure/devops/managed-devops-pools/configure-networking
