id: az400-3a-art-rev-number
objective: "3.1.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An Azure Pipelines YAML pipeline named **web-ci** contains the following line at the pipeline level:

    `name: $(Build.DefinitionName)_$(Date:yyyyMMdd).$(Rev:r)`

    On November 17, 2026, the pipeline completed three runs, all between 09:00 and 17:00 UTC. The next run starts on November 18, 2026, at 10:00 UTC. The YAML file was not changed.

    What is the run number of the run on November 18?
  fr: |
    Un pipeline YAML Azure Pipelines nommé **web-ci** contient la ligne suivante au niveau du pipeline :

    `name: $(Build.DefinitionName)_$(Date:yyyyMMdd).$(Rev:r)`

    Le 17 novembre 2026, le pipeline a effectué trois exécutions, toutes entre 09:00 et 17:00 UTC. L'exécution suivante démarre le 18 novembre 2026 à 10:00 UTC. Le fichier YAML n'a pas été modifié.

    Quel est le numéro d'exécution de l'exécution du 18 novembre ?
shuffle: false
body:
  options:
    - { id: a, text: "web-ci_20261118.0" }
    - { id: b, text: "web-ci_20261118.1" }
    - { id: c, text: "web-ci_20261118.3" }
    - { id: d, text: "web-ci_20261118.4" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      $(Rev:r) increments by one while the rest of the run number stays the same, and it resets to 1 when any other part changes. The date part changes from 20261117 to 20261118, so the first run of November 18 gets revision 1. Dates in run numbers use UTC.
    fr: |
      $(Rev:r) s'incrémente de un tant que le reste du numéro d'exécution ne change pas, et revient à 1 dès qu'une autre partie change. La partie date passe de 20261117 à 20261118 : la première exécution du 18 novembre obtient la révision 1. Les dates des numéros d'exécution sont en UTC.
  options:
    a: { en: "Revisions start at 1, not 0.", fr: "Les révisions commencent à 1, pas à 0." }
    c: { en: "3 was the revision of the last run of November 17; the date changed, so the revision resets.", fr: "3 était la révision de la dernière exécution du 17 novembre ; la date a changé, donc la révision repart de zéro." }
    d: { en: "Rev keeps counting only while the rest of the number is unchanged; here the date changed.", fr: "Rev ne continue de compter que si le reste du numéro est inchangé ; ici, la date a changé." }
references:
  - title: Run and build numbers
    url: https://learn.microsoft.com/en-us/azure/devops/pipelines/process/run-number
