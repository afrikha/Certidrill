id: az400-3b-gh-auth-types
objective: "3.3.3"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Northwind connects Azure Pipelines to the GitHub repositories of three teams.

    Which authentication type should you use for each team? To answer, drag the appropriate authentication types to the correct teams. Each authentication type may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind connecte Azure Pipelines aux dépôts GitHub de trois équipes.

    Quel type d'authentification devez-vous utiliser pour chaque équipe ? Pour répondre, faites glisser les types d'authentification appropriés vers les équipes correspondantes. Chaque type d'authentification peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: app, text: { en: "Azure Pipelines GitHub App", fr: "Application GitHub Azure Pipelines" } }
    - { id: oauth, text: OAuth }
    - { id: pat, text: { en: "Personal access token (PAT)", fr: "Jeton d'accès personnel (PAT)" } }
    - { id: ghtoken, text: GITHUB_TOKEN }
  targets:
    - id: team1
      text: { en: "Team 1: builds must run under the Azure Pipelines identity and report their results as GitHub Checks.", fr: "Équipe 1 : les builds doivent s'exécuter sous l'identité Azure Pipelines et publier leurs résultats sous forme de GitHub Checks." }
    - id: team2
      text: { en: "Team 2: no admin can install apps; a developer authorizes Azure Pipelines with a GitHub account in the browser during pipeline creation, without creating any token.", fr: "Équipe 2 : aucun administrateur ne peut installer d'applications ; un développeur autorise Azure Pipelines avec un compte GitHub dans le navigateur pendant la création du pipeline, sans créer de jeton." }
    - id: team3
      text: { en: "Team 3: the connection must use a token that has the repo, admin:repo_hook, read:user and user:email scopes.", fr: "Équipe 3 : la connexion doit utiliser un jeton qui a les étendues repo, admin:repo_hook, read:user et user:email." }
answer:
  mapping: { team1: app, team2: oauth, team3: pat }
explanation:
  correct:
    en: |
      Only the GitHub App runs pipelines under the Azure Pipelines identity and supports GitHub Checks. OAuth is authorized interactively with a personal GitHub account, and a PAT is a token created with the repo, admin:repo_hook, read:user and user:email scopes; both act as a personal identity. GITHUB_TOKEN is generated for GitHub Actions workflow runs and isn't used to connect Azure Pipelines.
    fr: |
      Seule l'application GitHub exécute les pipelines sous l'identité Azure Pipelines et prend en charge les GitHub Checks. OAuth est autorisé de manière interactive avec un compte GitHub personnel, et un PAT est un jeton créé avec les étendues repo, admin:repo_hook, read:user et user:email ; les deux agissent sous une identité personnelle. GITHUB_TOKEN est généré pour les exécutions de workflows GitHub Actions et ne sert pas à connecter Azure Pipelines.
references:
  - title: Build GitHub repositories
    url: https://learn.microsoft.com/en-us/azure/devops/pipelines/repos/github
