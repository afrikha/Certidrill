id: az400-3a-test-load-config
objective: "3.2.2"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Contoso runs a JMeter script named checkout.jmx in Azure Load Testing from its release pipeline. The pipeline must fail when the checkout API gets slower or less reliable. The test run must fail if either of the following conditions is true:

    - The 95th percentile of the response time exceeds 800 ms.
    - More than 2 percent of the requests fail.

    How should you complete the load test configuration file? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso exécute un script JMeter nommé checkout.jmx dans Azure Load Testing depuis son pipeline de mise en production. Le pipeline doit échouer quand l'API de paiement devient plus lente ou moins fiable. L'exécution du test doit échouer si l'une des conditions suivantes est vraie :

    - Le 95e centile du temps de réponse dépasse 800 ms.
    - Plus de 2 % des requêtes échouent.

    Comment devez-vous compléter le fichier de configuration du test de charge ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: yaml
  template: |
    version: v0.1
    testId: checkout-api
    displayName: Checkout API load test
    testPlan: checkout.jmx
    testType: [[type]]
    engineInstances: 2
    failureCriteria:
      - [[rt]]
      - [[err]]
    autoStop:
      errorPercentage: 80
      timeWindow: 60
  slots:
    - id: type
      options:
        - { id: jmx, text: JMX }
        - { id: locust, text: Locust }
        - { id: url, text: URL }
    - id: rt
      options:
        - { id: p95, text: "p95(response_time_ms) > 800" }
        - { id: avg, text: "avg(response_time_ms) > 800" }
        - { id: max, text: "max(response_time_ms) > 800" }
        - { id: lt, text: "p95(response_time_ms) < 800" }
    - id: err
      options:
        - { id: pct, text: "percentage(error) > 2" }
        - { id: count, text: "count(requests) > 2" }
        - { id: rps, text: "avg(requests_per_sec) < 2" }
answer:
  values: { type: jmx, rt: p95, err: pct }
explanation:
  correct:
    en: |
      A JMeter script is a JMX test plan. A client-side criterion has the form aggregate(metric) condition threshold: p95(response_time_ms) > 800 checks the 95th percentile, and percentage(error) > 2 checks the share of failed requests. When at least one criterion is true, the test run gets the failed status, which fails the pipeline task.
    fr: |
      Un script JMeter est un plan de test JMX. Un critère côté client a la forme agrégat(métrique) condition seuil : p95(response_time_ms) > 800 contrôle le 95e centile, et percentage(error) > 2 contrôle la part de requêtes en échec. Quand au moins un critère est vrai, l'exécution du test obtient l'état Échec, ce qui fait échouer la tâche du pipeline.
  options:
    locust: { en: "Locust tests use a Python script, not a .jmx file.", fr: "Les tests Locust utilisent un script Python, pas un fichier .jmx." }
    url: { en: "URL-based tests use a requests JSON file instead of a script.", fr: "Les tests basés sur des URL utilisent un fichier JSON de requêtes au lieu d'un script." }
    avg: { en: "avg checks the mean response time, not the 95th percentile.", fr: "avg contrôle le temps de réponse moyen, pas le 95e centile." }
    max: { en: "max fails on a single slow request, which is stricter than the requirement.", fr: "max échoue sur une seule requête lente, ce qui est plus strict que l'exigence." }
    lt: { en: "A criterion describes the failing condition, so it must use > 800, not < 800.", fr: "Un critère décrit la condition d'échec : il doit utiliser > 800, pas < 800." }
    count: { en: "count(requests) counts all requests, not failed ones.", fr: "count(requests) compte toutes les requêtes, pas celles qui ont échoué." }
    rps: { en: "requests_per_sec measures throughput, not errors.", fr: "requests_per_sec mesure le débit, pas les erreurs." }
references:
  - title: Load test configuration YAML
    url: https://learn.microsoft.com/en-us/azure/load-testing/reference-test-config-yaml
  - title: Define fail criteria for load tests by using Azure Load Testing
    url: https://learn.microsoft.com/en-us/azure/load-testing/how-to-define-test-criteria
