id: az400-3c-template-repo-order
objective: "3.3.8"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    At Fabrikam, the platform team owns the Azure Repos repository **pipeline-templates** in the project **Platform**. The YAML pipelines of the project **Shop** must use the template **build.yml** from that repository. They must keep using the approved version 2.1 of the template, even when the platform team later changes build.yml on the main branch. In the Shop pipelines, the repository resource must have the alias **templates**.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Chez Fabrikam, l'équipe plateforme possède le dépôt Azure Repos **pipeline-templates** du projet **Platform**. Les pipelines YAML du projet **Shop** doivent utiliser le modèle **build.yml** de ce dépôt. Ils doivent continuer à utiliser la version approuvée 2.1 du modèle, même quand l'équipe plateforme modifie ensuite build.yml sur la branche main. Dans les pipelines Shop, la ressource de dépôt doit avoir l'alias **templates**.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: commit, text: { en: "Commit build.yml to the main branch of pipeline-templates.", fr: "Valider build.yml dans la branche main de pipeline-templates." } }
    - { id: tag, text: { en: "Create the Git tag v2.1 on the commit that contains the approved template.", fr: "Créer la balise Git v2.1 sur le commit qui contient le modèle approuvé." } }
    - { id: res, text: { en: "In each Shop pipeline, declare the repository resource templates with `type: git`, `name: Platform/pipeline-templates` and `ref: refs/tags/v2.1`.", fr: "Dans chaque pipeline Shop, déclarer la ressource de dépôt templates avec `type: git`, `name: Platform/pipeline-templates` et `ref: refs/tags/v2.1`." } }
    - { id: use, text: { en: "In each Shop pipeline, insert the template with `- template: build.yml@templates`.", fr: "Dans chaque pipeline Shop, insérer le modèle avec `- template: build.yml@templates`." } }
    - { id: tg, text: { en: "Export the build tasks as a task group and import it in the Shop project.", fr: "Exporter les tâches de build sous forme de groupe de tâches et l'importer dans le projet Shop." } }
    - { id: vg, text: { en: "Create a variable group in the Shop project that stores the path of the template.", fr: "Créer dans le projet Shop un groupe de variables qui stocke le chemin du modèle." } }
answer:
  sequence: [ commit, tag, res, use ]
explanation:
  correct:
    en: |
      The template must exist in the repository and be tagged before a pipeline can pin it. A repository resource of type git uses the `<project>/<repo>` name for another project of the organization, and `ref` pins the tag; without `ref` the pipeline would follow refs/heads/main. The template is then referenced with the `@templates` alias.
    fr: |
      Le modèle doit exister dans le dépôt et être balisé avant qu'un pipeline puisse l'épingler. Une ressource de dépôt de type git utilise le nom `<projet>/<dépôt>` pour un autre projet de l'organisation, et `ref` épingle la balise ; sans `ref`, le pipeline suivrait refs/heads/main. Le modèle est ensuite référencé avec l'alias `@templates`.
  options:
    tg: { en: "Task groups can't be used in YAML pipelines.", fr: "Les groupes de tâches ne sont pas utilisables dans les pipelines YAML." }
    vg: { en: "Templates are expanded at compile time from a repository resource; a variable can't supply the template file.", fr: "Les modèles sont développés à la compilation depuis une ressource de dépôt ; une variable ne peut pas fournir le fichier de modèle." }
references:
  - title: Use YAML templates in pipelines for reusable and secure processes
    url: https://learn.microsoft.com/en-us/azure/devops/pipelines/process/templates
