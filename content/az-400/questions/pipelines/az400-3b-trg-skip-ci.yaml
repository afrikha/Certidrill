id: az400-3b-trg-skip-ci
objective: "3.3.4"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    Litware's YAML pipeline builds an Azure Repos repository and has a CI trigger on main. A developer is about to push a commit to main that only fixes a typo in a code comment. This push must not start the pipeline, and later pushes must still trigger it.

    What can the developer do? Each correct answer presents a complete solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Le pipeline YAML de Litware génère un dépôt Azure Repos et possède un déclencheur de CI sur main. Un développeur s'apprête à envoyer sur main un commit qui corrige seulement une faute de frappe dans un commentaire du code. Cet envoi ne doit pas démarrer le pipeline, et les envois suivants doivent toujours le déclencher.

    Que peut faire le développeur ? Chaque bonne réponse constitue une solution complète.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Add `trigger: none` to the YAML file in the same commit.", fr: "Ajouter `trigger: none` au fichier YAML dans le même commit." } }
    - { id: b, text: { en: "Include `[skip ci]` in the commit message.", fr: "Inclure `[skip ci]` dans le message de commit." } }
    - { id: c, text: { en: "Push the commit with `git push --no-verify`.", fr: "Envoyer le commit avec `git push --no-verify`." } }
    - { id: d, text: { en: "Include `***NO_CI***` in the commit message.", fr: "Inclure `***NO_CI***` dans le message de commit." } }
    - { id: e, text: { en: "Set `batch: true` in the CI trigger.", fr: "Définir `batch: true` dans le déclencheur de CI." } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |
      Azure Pipelines skips CI for a push when a commit message or description contains one of the skip strings, such as `[skip ci]`, `[ci skip]`, `[skip azp]` or `***NO_CI***`. The trigger stays in place, so later pushes run the pipeline normally.
    fr: |
      Azure Pipelines ignore la CI d'un envoi quand un message ou une description de commit contient l'une des chaînes d'exclusion, comme `[skip ci]`, `[ci skip]`, `[skip azp]` ou `***NO_CI***`. Le déclencheur reste en place : les envois suivants exécutent normalement le pipeline.
  options:
    a: { en: "trigger: none disables CI for every later push until it's removed.", fr: "trigger: none désactive la CI pour tous les envois suivants tant qu'il n'est pas supprimé." }
    c: { en: "--no-verify skips local Git hooks; it doesn't affect pipeline triggers.", fr: "--no-verify ignore les hooks Git locaux ; il n'a aucun effet sur les déclencheurs de pipeline." }
    e: { en: "batch groups pushes made during a run into one run; the push still triggers the pipeline.", fr: "batch regroupe en une exécution les envois effectués pendant une exécution ; l'envoi déclenche toujours le pipeline." }
references:
  - title: Build Azure Repos Git or TFS Git repositories
    url: https://learn.microsoft.com/en-us/azure/devops/pipelines/repos/azure-repos-git
