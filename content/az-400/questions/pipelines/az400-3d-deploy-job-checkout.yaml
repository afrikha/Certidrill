id: az400-3d-deploy-job-checkout
objective: "3.4.7"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Proseware deploys a Java application to Linux virtual machines that are registered in an Azure Pipelines environment named **vm-prod**. The build stage publishes the application binaries as a pipeline artifact named **drop**. The installation script **scripts/install.sh** is stored in the repository and isn't part of the artifact.

    The deployment stage contains the following job:

    ```yaml
    - deployment: InstallApp
      environment:
        name: vm-prod
        resourceType: VirtualMachine
      strategy:
        runOnce:
          deploy:
            steps:
            - script: bash scripts/install.sh $(Pipeline.Workspace)/drop
    ```

    The job fails with the error **scripts/install.sh: No such file or directory**. You need to fix the job with the fewest changes.

    What should you do?
  fr: |
    Proseware déploie une application Java sur des machines virtuelles Linux inscrites dans un environnement Azure Pipelines nommé **vm-prod**. La phase de build publie les fichiers binaires de l'application sous forme d'artefact de pipeline nommé **drop**. Le script d'installation **scripts/install.sh** est stocké dans le dépôt et ne fait pas partie de l'artefact.

    La phase de déploiement contient le travail suivant :

    ```yaml
    - deployment: InstallApp
      environment:
        name: vm-prod
        resourceType: VirtualMachine
      strategy:
        runOnce:
          deploy:
            steps:
            - script: bash scripts/install.sh $(Pipeline.Workspace)/drop
    ```

    Le travail échoue avec l'erreur **scripts/install.sh: No such file or directory**. Vous devez corriger le travail avec le moins de modifications possible.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Add a `download: current` step with `artifact: drop` before the script step.", fr: "Ajouter une étape `download: current` avec `artifact: drop` avant l'étape de script." }
    - id: b
      text: { en: "Add a `checkout: self` step before the script step.", fr: "Ajouter une étape `checkout: self` avant l'étape de script." }
    - id: c
      text: { en: "Set the workingDirectory of the script step to $(Pipeline.Workspace)/drop.", fr: "Définir le workingDirectory de l'étape de script sur $(Pipeline.Workspace)/drop." }
    - id: d
      text: { en: "Replace the runOnce strategy with the rolling strategy.", fr: "Remplacer la stratégie runOnce par la stratégie rolling." }
answer: { optionId: b }
explanation:
  correct:
    en: |
      A deployment job doesn't clone the repository automatically, so files that exist only in the repository are missing on the target machine. A `checkout: self` step clones the repository into the job's working directory, where the relative path scripts/install.sh resolves. The artifacts of the current run are already downloaded automatically in the deploy hook.
    fr: |
      Un travail de déploiement ne clone pas automatiquement le dépôt : les fichiers qui n'existent que dans le dépôt sont absents de la machine cible. Une étape `checkout: self` clone le dépôt dans le répertoire de travail du travail, où le chemin relatif scripts/install.sh est résolu. Les artefacts de l'exécution en cours sont déjà téléchargés automatiquement dans le hook deploy.
  options:
    a:
      en: "The drop artifact is already downloaded in the deploy hook, and it doesn't contain the script."
      fr: "L'artefact drop est déjà téléchargé dans le hook deploy, et il ne contient pas le script."
    c:
      en: "The script isn't in the artifact folder either, so changing the working directory doesn't help."
      fr: "Le script ne se trouve pas non plus dans le dossier de l'artefact : changer le répertoire de travail n'aide pas."
    d:
      en: "The strategy controls how many machines are deployed at a time; it doesn't check out the repository."
      fr: "La stratégie contrôle le nombre de machines déployées à la fois ; elle n'extrait pas le dépôt."
references:
  - title: Deployment jobs
    url: https://learn.microsoft.com/en-us/azure/devops/pipelines/process/deployment-jobs
