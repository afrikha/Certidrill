id: az400-3e-cs-param-mechanisms
objective: "3.5.2"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Proseware deploys one Bicep file named **main.bicep** to dev, test and production from Azure Pipelines. You are defining where each kind of value is provided.

    Which mechanism should you use for each value? To answer, drag the appropriate mechanisms to the correct values. Each mechanism may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware déploie un même fichier Bicep nommé **main.bicep** vers dev, test et production depuis Azure Pipelines. Vous définissez où chaque type de valeur est fourni.

    Quel mécanisme devez-vous utiliser pour chaque valeur ? Pour répondre, faites glisser les mécanismes appropriés vers les valeurs correspondantes. Chaque mécanisme peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: perenv, text: { en: "A .bicepparam file for each environment", fr: "Un fichier .bicepparam pour chaque environnement" } }
    - { id: extends, text: { en: "A base .bicepparam file referenced with `extends`", fr: "Un fichier .bicepparam de base référencé avec `extends`" } }
    - { id: envvar, text: { en: "`readEnvironmentVariable()` in the .bicepparam file", fr: "`readEnvironmentVariable()` dans le fichier .bicepparam" } }
    - { id: default, text: { en: "A default value in main.bicep", fr: "Une valeur par défaut dans main.bicep" } }
    - { id: secure, text: { en: "The `@secure()` decorator in main.bicep", fr: "Le décorateur `@secure()` dans main.bicep" } }
  targets:
    - id: sku
      text: { en: "The App Service plan SKU, which is different in dev, test and production", fr: "La référence SKU du plan App Service, différente en dev, test et production" }
    - id: common
      text: { en: "Tags and network settings shared by the dev, test and production parameter files, maintained in one place", fr: "Les étiquettes et paramètres réseau communs aux fichiers de paramètres de dev, test et production, gérés à un seul endroit" }
    - id: build
      text: { en: "The build number that the pipeline exposes to the deployment step at run time", fr: "Le numéro de build que le pipeline expose à l'étape de déploiement au moment de l'exécution" }
answer:
  mapping: { sku: perenv, common: extends, build: envvar }
explanation:
  correct:
    en: "Each environment gets its own .bicepparam file for the values that differ. The `extends` keyword lets those files inherit parameters from a base .bicepparam file and override only some of them. `readEnvironmentVariable()` reads a value, such as a pipeline variable exposed as an environment variable, when the parameters file is evaluated."
    fr: "Chaque environnement dispose de son propre fichier .bicepparam pour les valeurs qui diffèrent. Le mot clé `extends` permet à ces fichiers d'hériter des paramètres d'un fichier .bicepparam de base et de n'en remplacer que certains. `readEnvironmentVariable()` lit une valeur, comme une variable de pipeline exposée en variable d'environnement, lors de l'évaluation du fichier de paramètres."
  options:
    default: { en: "A default value is the same for every environment, and it is used only when no parameters file provides a value.", fr: "Une valeur par défaut est identique pour tous les environnements, et elle n'est utilisée que si aucun fichier de paramètres ne fournit de valeur." }
    secure: { en: "@secure() hides a parameter value from logs and outputs; it doesn't supply a value.", fr: "@secure() masque la valeur d'un paramètre dans les journaux et les sorties ; il ne fournit pas de valeur." }
references:
  - title: Create parameters files for Bicep deployment
    url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/bicep/parameter-files
