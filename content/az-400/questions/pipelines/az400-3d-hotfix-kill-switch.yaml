id: az400-3d-hotfix-kill-switch
objective: "3.4.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Wingtip Toys released a new recommendation engine to all users this morning. The engine is wrapped in a feature flag named **Recommendations** that the web app reads from Azure App Configuration by using the .NET feature management library.

    The engine now causes checkout errors for many users. Developers estimate that a code fix will take four hours to build, test, and deploy through the pipeline. You need to stop the errors as quickly as possible, without bypassing the pipeline controls.

    What should you do first?
  fr: |
    Wingtip Toys a publié ce matin un nouveau moteur de recommandations pour tous les utilisateurs. Le moteur est encapsulé dans un indicateur de fonctionnalité nommé **Recommendations** que l'application web lit depuis Azure App Configuration à l'aide de la bibliothèque de gestion des fonctionnalités .NET.

    Le moteur provoque désormais des erreurs de paiement pour de nombreux utilisateurs. Les développeurs estiment qu'un correctif de code prendra quatre heures pour être généré, testé et déployé par le pipeline. Vous devez faire cesser les erreurs le plus rapidement possible, sans contourner les contrôles du pipeline.

    Que devez-vous faire en premier ?
body:
  options:
    - id: a
      text: { en: "Disable the Recommendations feature flag in the App Configuration store.", fr: "Désactiver l'indicateur de fonctionnalité Recommendations dans le magasin App Configuration." }
    - id: b
      text: { en: "Create a hotfix branch and start the pipeline with the production approvals skipped.", fr: "Créer une branche de correctif et démarrer le pipeline en ignorant les approbations de production." }
    - id: c
      text: { en: "Revert the last commit in main and wait for the next pipeline run.", fr: "Annuler (revert) le dernier commit dans main et attendre la prochaine exécution du pipeline." }
    - id: d
      text: { en: "Restart the web app so that it reloads its configuration.", fr: "Redémarrer l'application web pour qu'elle recharge sa configuration." }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Turning the flag off is a configuration change that the app picks up at its next feature flag refresh, without any build or deployment. It acts as a kill switch that stops the errors while the hotfix goes through the normal pipeline.
    fr: |
      Désactiver l'indicateur est une modification de configuration que l'application prend en compte à la prochaine actualisation de ses indicateurs, sans build ni déploiement. Cela agit comme un interrupteur d'arrêt qui fait cesser les erreurs pendant que le correctif passe par le pipeline habituel.
  options:
    b:
      en: "Skipping approvals bypasses the pipeline controls, and the fix itself still takes hours."
      fr: "Ignorer les approbations contourne les contrôles du pipeline, et le correctif lui-même prend toujours des heures."
    c:
      en: "A revert must still be built and deployed through the pipeline, which is slower than changing the flag."
      fr: "Un revert doit encore être généré et déployé par le pipeline, ce qui est plus lent que de modifier l'indicateur."
    d:
      en: "A restart reloads the same configuration, so the flag is still on and the engine still runs."
      fr: "Un redémarrage recharge la même configuration : l'indicateur reste activé et le moteur s'exécute toujours."
references:
  - title: "Quickstart: Manage feature flags in Azure App Configuration"
    url: https://learn.microsoft.com/en-us/azure/azure-app-configuration/manage-feature-flags
