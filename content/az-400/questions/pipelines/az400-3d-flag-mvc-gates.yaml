id: az400-3d-flag-mvc-gates
objective: "3.4.6"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    Wingtip Toys has an ASP.NET Core MVC app that loads its feature flags from Azure App Configuration and registers feature management. A new **ReportsController** must be reachable only when the **NewReports** flag is enabled, and the link to it in the navigation menu of the shared layout view must be shown only when the flag is enabled. The `_ViewImports.cshtml` file already registers the feature management tag helpers.

    Which two actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Wingtip Toys dispose d'une application ASP.NET Core MVC qui charge ses indicateurs de fonctionnalités depuis Azure App Configuration et enregistre la gestion des fonctionnalités. Un nouveau **ReportsController** ne doit être accessible que lorsque l'indicateur **NewReports** est activé, et le lien vers celui-ci dans le menu de navigation de la vue de disposition partagée ne doit être affiché que lorsque l'indicateur est activé. Le fichier `_ViewImports.cshtml` enregistre déjà les tag helpers de gestion des fonctionnalités.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text: { en: "Add the `[FeatureGate(\"NewReports\")]` attribute to ReportsController.", fr: "Ajouter l'attribut `[FeatureGate(\"NewReports\")]` à ReportsController." }
    - id: b
      text: { en: "Add the `[Authorize(Policy = \"NewReports\")]` attribute to ReportsController.", fr: "Ajouter l'attribut `[Authorize(Policy = \"NewReports\")]` à ReportsController." }
    - id: c
      text: { en: "Wrap the menu link in a `<feature name=\"NewReports\">` element.", fr: "Encadrer le lien du menu par un élément `<feature name=\"NewReports\">`." }
    - id: d
      text: { en: "Wrap the menu link in an `<environment include=\"NewReports\">` element.", fr: "Encadrer le lien du menu par un élément `<environment include=\"NewReports\">`." }
    - id: e
      text: { en: "Add a route constraint named NewReports to the controller route.", fr: "Ajouter une contrainte de route nommée NewReports à la route du contrôleur." }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |
      The FeatureGate attribute blocks the controller's actions when the flag is disabled; by default the request returns HTTP 404. The feature tag helper renders its content only when the named flag is enabled, so the menu link disappears together with the controller.
    fr: |
      L'attribut FeatureGate bloque les actions du contrôleur quand l'indicateur est désactivé ; par défaut, la requête renvoie HTTP 404. Le tag helper feature n'affiche son contenu que si l'indicateur nommé est activé : le lien du menu disparaît en même temps que le contrôleur.
  options:
    b:
      en: "An authorization policy checks the user's permissions, not the state of a feature flag."
      fr: "Une stratégie d'autorisation vérifie les autorisations de l'utilisateur, pas l'état d'un indicateur de fonctionnalité."
    d:
      en: "The environment tag helper compares the hosting environment name, such as Development, not a feature flag."
      fr: "Le tag helper environment compare le nom de l'environnement d'hébergement, comme Development, pas un indicateur de fonctionnalité."
    e:
      en: "A route constraint validates route values; it doesn't evaluate feature flags."
      fr: "Une contrainte de route valide les valeurs de route ; elle n'évalue pas les indicateurs de fonctionnalités."
references:
  - title: .NET feature management
    url: https://learn.microsoft.com/en-us/azure/azure-app-configuration/feature-management-dotnet-reference
