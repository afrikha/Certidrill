id: az400-3d-hotfix-release-first
objective: "3.4.4"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    Litware uses Azure Repos. Production runs version 7 from the **release/7** branch. The team's hotfix policy states that an urgent fix is developed and validated against the release branch first, and then ported to **main**. Release-specific changes of release/7 must never reach main.

    A security bug must be fixed in production today.

    Which five actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Litware utilise Azure Repos. La production exécute la version 7 à partir de la branche **release/7**. La stratégie de correctifs de l'équipe stipule qu'un correctif urgent est développé et validé d'abord sur la branche de mise en production, puis reporté dans **main**. Les modifications propres à release/7 ne doivent jamais atteindre main.

    Un bogue de sécurité doit être corrigé en production aujourd'hui.

    Quelles sont les cinq actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  actions:
    - { id: mergeRel, text: { en: "Merge release/7 into main by using a pull request.", fr: "Fusionner release/7 dans main à l'aide d'une demande de tirage." } }
    - { id: branchRel, text: { en: "Create a fix branch from release/7 and commit the fix.", fr: "Créer une branche de correctif à partir de release/7 et y valider le correctif." } }
    - { id: prRel, text: { en: "Merge the fix branch into release/7 by using a pull request, and deploy release/7.", fr: "Fusionner la branche de correctif dans release/7 à l'aide d'une demande de tirage, puis déployer release/7." } }
    - { id: portBranch, text: { en: "Create a new branch from main.", fr: "Créer une nouvelle branche à partir de main." } }
    - { id: cherry, text: { en: "Cherry-pick the fix commit from release/7 into the new branch.", fr: "Sélectionner (cherry-pick) le commit du correctif de release/7 dans la nouvelle branche." } }
    - { id: prMain, text: { en: "Merge the new branch into main by using a pull request.", fr: "Fusionner la nouvelle branche dans main à l'aide d'une demande de tirage." } }
    - { id: branchMain, text: { en: "Create a fix branch from main and commit the fix.", fr: "Créer une branche de correctif à partir de main et y valider le correctif." } }
  count: 5
answer:
  sequence: [ branchRel, prRel, portBranch, cherry, prMain ]
explanation:
  correct:
    en: |
      The fix starts from the code in production and reaches production through a pull request into release/7. To port it, you create a branch from main, cherry-pick only the fix commit into it, and merge that branch into main with a second pull request. Cherry-picking gives exact control over what reaches main, unlike merging the whole release branch.
    fr: |
      Le correctif part du code en production et atteint la production par une demande de tirage vers release/7. Pour le reporter, vous créez une branche à partir de main, y sélectionnez uniquement le commit du correctif, puis fusionnez cette branche dans main avec une seconde demande de tirage. La sélection de commits (cherry-pick) donne un contrôle exact sur ce qui atteint main, contrairement à la fusion de toute la branche de mise en production.
  options:
    mergeRel: { en: "Merging release/7 brings its release-specific changes into main.", fr: "Fusionner release/7 apporte dans main ses modifications propres à la version." }
    branchMain: { en: "The policy requires the fix to be developed against the release branch first.", fr: "La stratégie exige que le correctif soit d'abord développé sur la branche de mise en production." }
references:
  - title: Adopt a Git branching strategy
    url: https://learn.microsoft.com/en-us/azure/devops/repos/git/git-branching-guidance
