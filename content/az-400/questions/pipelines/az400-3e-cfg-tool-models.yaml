id: az400-3e-cfg-tool-models
objective: "3.5.1"
type: dragdrop
difficulty: 3
status: draft
stem:
  en: |
    You are preparing a comparison of configuration management technologies for the architecture board of Litware.

    Which technology matches each description? To answer, drag the appropriate technologies to the correct descriptions. Each technology may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous préparez une comparaison des technologies de gestion de la configuration pour le comité d'architecture de Litware.

    Quelle technologie correspond à chaque description ? Pour répondre, faites glisser les technologies appropriées vers les descriptions correspondantes. Chaque technologie peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: aasc, text: Azure Automation State Configuration }
    - { id: mc, text: Azure Machine Configuration }
    - { id: tf, text: Terraform }
    - { id: bicep, text: Bicep }
    - { id: ansible, text: Ansible }
  targets:
    - id: pull
      text: { en: "A managed PowerShell DSC pull server from which registered nodes get their configurations", fr: "Un serveur Pull PowerShell DSC managé auprès duquel les nœuds inscrits obtiennent leurs configurations" }
    - id: guest
      text: { en: "Configurations modeled as extension resources of each machine and assigned at scale by Azure Policy", fr: "Des configurations modélisées comme des ressources d'extension de chaque machine et affectées à grande échelle par Azure Policy" }
    - id: state
      text: { en: "A state file maps the configuration to the deployed resources and must be backed up and secured", fr: "Un fichier d'état associe la configuration aux ressources déployées et doit être sauvegardé et sécurisé" }
answer:
  mapping: { pull: aasc, guest: mc, state: tf }
explanation:
  correct:
    en: "State Configuration provides a built-in DSC pull server, so you don't maintain your own. Machine Configuration models each configuration as an extension resource of the machine (a guest assignment) that Azure Policy can assign dynamically. Terraform stores state in terraform.tfstate, locally or remotely, and that file must be backed up and secured."
    fr: "State Configuration fournit un serveur Pull DSC intégré : vous n'avez pas à maintenir le vôtre. Machine Configuration modélise chaque configuration comme une ressource d'extension de la machine (une affectation d'invité) qu'Azure Policy peut affecter dynamiquement. Terraform stocke l'état dans terraform.tfstate, en local ou à distance, et ce fichier doit être sauvegardé et sécurisé."
  options:
    bicep: { en: "Bicep doesn't store state and doesn't configure the inside of machines.", fr: "Bicep ne stocke pas d'état et ne configure pas l'intérieur des machines." }
    ansible: { en: "Ansible pushes playbooks over SSH without an agent; it has no pull server or Azure Policy assignment.", fr: "Ansible envoie des playbooks en SSH sans agent ; il n'a ni serveur Pull ni affectation Azure Policy." }
references:
  - title: Azure Automation State Configuration overview
    url: https://learn.microsoft.com/en-us/azure/automation/automation-dsc-overview
  - title: Comparing Terraform and Bicep
    url: https://learn.microsoft.com/en-us/azure/developer/terraform/comparing-terraform-and-bicep
