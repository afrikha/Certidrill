id: az400-3e-cfg-server-side
objective: "3.5.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam is choosing an infrastructure as code technology for workloads that run only in Azure. The platform team sets the following requirements:

    - Deployments are processed by Azure Resource Manager, not by a client-side engine.
    - A preflight validation rejects a deployment that violates an Azure Policy assignment before any resource is created.
    - No state file has to be stored, locked or backed up.

    Which two technologies meet the requirements? Each correct answer presents a complete solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam choisit une technologie d'infrastructure en tant que code pour des charges de travail qui s'exécutent uniquement dans Azure. L'équipe plateforme fixe les exigences suivantes :

    - Les déploiements sont traités par Azure Resource Manager, pas par un moteur côté client.
    - Une validation préalable (preflight) rejette un déploiement qui enfreint une attribution Azure Policy avant la création de toute ressource.
    - Aucun fichier d'état ne doit être stocké, verrouillé ni sauvegardé.

    Quelles sont les deux technologies qui répondent aux exigences ? Chaque bonne réponse constitue une solution complète.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: Terraform }
    - { id: b, text: Bicep }
    - { id: c, text: { en: "Ansible playbooks", fr: "Playbooks Ansible" } }
    - { id: d, text: { en: "Azure Resource Manager templates (JSON)", fr: "Modèles Azure Resource Manager (JSON)" } }
    - { id: e, text: Azure Machine Configuration }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: "Bicep files are transpiled to ARM templates, and both are processed inside Azure Resource Manager. Their preflight validation detects resources that don't comply with a policy, so the deployment fails before it starts. Neither keeps a state file; Azure itself is the source of truth."
    fr: "Les fichiers Bicep sont transpilés en modèles ARM, et les deux sont traités dans Azure Resource Manager. Leur validation préalable détecte les ressources non conformes à une stratégie : le déploiement échoue avant de commencer. Aucun des deux ne conserve de fichier d'état ; Azure est la source de vérité."
  options:
    a:
      en: "Terraform processes the configuration in its client, keeps a state file, and fails only when a resource disallowed by policy is deployed."
      fr: "Terraform traite la configuration dans son client, conserve un fichier d'état et n'échoue qu'au moment où une ressource interdite par une stratégie est déployée."
    c:
      en: "Ansible runs from a control machine that calls Azure for each task; it has no Azure Resource Manager preflight validation."
      fr: "Ansible s'exécute depuis une machine de contrôle qui appelle Azure pour chaque tâche ; il n'a pas de validation préalable d'Azure Resource Manager."
    e:
      en: "Machine Configuration manages settings inside operating systems, not Azure resources."
      fr: "Machine Configuration gère des paramètres à l'intérieur des systèmes d'exploitation, pas des ressources Azure."
references:
  - title: Comparing Terraform and Bicep
    url: https://learn.microsoft.com/en-us/azure/developer/terraform/comparing-terraform-and-bicep
