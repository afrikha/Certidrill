id: az400-3a-test-types
objective: "3.2.2"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Tailspin is designing the testing strategy of its online booking service. The strategy must cover the following requirements.

    Which type of test should Tailspin use for each requirement? To answer, drag the appropriate test types to the correct requirements. Each test type may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin conçoit la stratégie de test de son service de réservation en ligne. La stratégie doit couvrir les exigences suivantes.

    Quel type de test Tailspin doit-il utiliser pour chaque exigence ? Pour répondre, faites glisser les types de tests appropriés vers les exigences correspondantes. Chaque type de test peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: unit, text: { en: "Unit tests", fr: "Tests unitaires" } }
    - { id: integ, text: { en: "Integration tests", fr: "Tests d'intégration" } }
    - { id: load, text: { en: "Load tests", fr: "Tests de charge" } }
    - { id: smoke, text: { en: "Smoke tests", fr: "Tests de fumée (smoke tests)" } }
    - { id: explo, text: { en: "Exploratory tests", fr: "Tests exploratoires" } }
  targets:
    - { id: t1, text: { en: "Check the fare calculation rules in milliseconds on every pull request, with all dependencies mocked.", fr: "Vérifier les règles de calcul des tarifs en quelques millisecondes à chaque demande de tirage, avec toutes les dépendances simulées." } }
    - { id: t2, text: { en: "Check that the data access layer works with the real database schema and the message queue.", fr: "Vérifier que la couche d'accès aux données fonctionne avec le schéma réel de la base de données et la file de messages." } }
    - { id: t3, text: { en: "Check that searches keep a 95th percentile response time under 800 ms with 3,000 concurrent users.", fr: "Vérifier que les recherches conservent un temps de réponse au 95e centile inférieur à 800 ms avec 3 000 utilisateurs simultanés." } }
    - { id: t4, text: { en: "Right after each production deployment, call the three critical endpoints before shifting traffic.", fr: "Juste après chaque déploiement en production, appeler les trois points de terminaison critiques avant de basculer le trafic." } }
answer:
  mapping: { t1: unit, t2: integ, t3: load, t4: smoke }
explanation:
  correct:
    en: |
      Unit tests depend only on the code under test and run fast in every build. Integration tests exercise components with their real dependencies, such as a database or a queue. Load tests measure response time, errors and throughput under expected and peak traffic. Smoke tests are a small set of checks of critical paths right after a deployment. Exploratory tests are manual sessions, which cannot be a fast automated gate.
    fr: |
      Les tests unitaires ne dépendent que du code testé et s'exécutent rapidement à chaque build. Les tests d'intégration exercent des composants avec leurs dépendances réelles, comme une base de données ou une file d'attente. Les tests de charge mesurent le temps de réponse, les erreurs et le débit sous un trafic attendu et de pointe. Les tests de fumée sont un petit ensemble de vérifications des chemins critiques juste après un déploiement. Les tests exploratoires sont des sessions manuelles, qui ne peuvent pas servir de barrière automatisée rapide.
references:
  - title: Shift testing left with unit tests
    url: https://learn.microsoft.com/en-us/devops/develop/shift-left-make-testing-fast-reliable
  - title: Define fail criteria for load tests by using Azure Load Testing
    url: https://learn.microsoft.com/en-us/azure/load-testing/how-to-define-test-criteria
