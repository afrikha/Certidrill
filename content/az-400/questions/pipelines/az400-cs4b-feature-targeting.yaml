id: az400-cs4b-feature-targeting
objective: "3.4.6"
type: yesno_statements
caseStudy: az400-cs4b-alpine-ski-house
difficulty: 2
status: draft
stem:
  en: |
    DynamicPricing is enabled and has a targeting filter with the following audience:

    | Setting | Value |
    | --- | --- |
    | Default percentage | 10 |
    | Include groups | **Testers**: 100 percent |
    | Exclude groups | **Corporate** |

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    DynamicPricing est activé et possède un filtre de ciblage avec l'audience suivante :

    | Paramètre | Valeur |
    | --- | --- |
    | Default percentage | 10 |
    | Include groups | **Testers** : 100 pour cent |
    | Exclude groups | **Corporate** |

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          About 10 percent of the users who are in neither Testers nor Corporate get the dynamic pricing feature.
        fr: |
          Environ 10 pour cent des utilisateurs qui ne sont ni dans Testers ni dans Corporate obtiennent la fonctionnalité de tarification dynamique.
    - id: s2
      text:
        en: |
          A user who is a member of both Testers and Corporate gets the dynamic pricing feature.
        fr: |
          Un utilisateur membre à la fois de Testers et de Corporate obtient la fonctionnalité de tarification dynamique.
    - id: s3
      text:
        en: |
          To raise the default percentage to 50, you must deploy a new revision of ca-booking.
        fr: |
          Pour porter le pourcentage par défaut à 50, vous devez déployer une nouvelle révision de ca-booking.
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: |
      The default percentage applies to the users who match no included user or group, so about 10 percent of them get the feature. An exclusion always wins over an inclusion, so a member of Corporate never gets it, even if they are also in Testers. The audience is stored in appcs-ask, and booking-service refreshes its feature flags every 30 seconds, so you change the percentage in the store without deploying anything.
    fr: |
      Le pourcentage par défaut s'applique aux utilisateurs qui ne correspondent à aucun utilisateur ni groupe inclus ; environ 10 pour cent d'entre eux obtiennent donc la fonctionnalité. Une exclusion l'emporte toujours sur une inclusion : un membre de Corporate ne l'obtient jamais, même s'il fait aussi partie de Testers. L'audience est stockée dans appcs-ask et booking-service actualise ses indicateurs toutes les 30 secondes : vous modifiez le pourcentage dans le magasin sans rien déployer.
references:
  - title: Roll Out Features to Targeted Audiences
    url: https://learn.microsoft.com/en-us/azure/azure-app-configuration/howto-targetingfilter
