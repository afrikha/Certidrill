id: az400-3b-test-load-order
objective: "3.2.3"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove has an Azure Load Testing resource named **lt-shop** that contains a load test. The config.yaml file and the JMeter script of the test are committed to an Azure Repos repository, and the Azure Load Testing extension is installed in the Azure DevOps organization.

    You need a YAML pipeline to run the load test after each deployment to the test environment. The solution must follow the principle of least privilege.

    Which three actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Woodgrove dispose d'une ressource Azure Load Testing nommée **lt-shop** qui contient un test de charge. Le fichier config.yaml et le script JMeter du test sont validés dans un dépôt Azure Repos, et l'extension Azure Load Testing est installée dans l'organisation Azure DevOps.

    Un pipeline YAML doit exécuter le test de charge après chaque déploiement dans l'environnement de test. La solution doit respecter le principe du moindre privilège.

    Quelles sont les trois actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - { id: conn, text: { en: "Create an Azure Resource Manager service connection for the subscription that contains lt-shop.", fr: "Créer une connexion de service Azure Resource Manager pour l'abonnement qui contient lt-shop." } }
    - { id: role, text: { en: "Assign the Load Test Contributor role on lt-shop to the identity of the service connection.", fr: "Attribuer le rôle Load Test Contributor sur lt-shop à l'identité de la connexion de service." } }
    - { id: task, text: { en: "Add an AzureLoadTest@1 task that references the service connection, config.yaml and lt-shop.", fr: "Ajouter une tâche AzureLoadTest@1 qui référence la connexion de service, config.yaml et lt-shop." } }
    - { id: owner, text: { en: "Assign the Owner role on the resource group of lt-shop to the identity of the service connection.", fr: "Attribuer le rôle Owner sur le groupe de ressources de lt-shop à l'identité de la connexion de service." } }
    - { id: reader, text: { en: "Assign the Load Test Reader role on lt-shop to the identity of the service connection.", fr: "Attribuer le rôle Load Test Reader sur lt-shop à l'identité de la connexion de service." } }
    - { id: publish, text: { en: "Add a PublishTestResults@2 task that reads config.yaml.", fr: "Ajouter une tâche PublishTestResults@2 qui lit config.yaml." } }
answer:
  sequence: [ conn, role, task ]
explanation:
  correct:
    en: |
      The pipeline reaches Azure through a service connection, so you create it first. Its identity then needs the Load Test Contributor role on the load testing resource to create and run test runs. Finally, the AzureLoadTest@1 task uses the service connection, the config.yaml file and the resource name to start the test.
    fr: |
      Le pipeline accède à Azure par une connexion de service : vous la créez d'abord. Son identité a ensuite besoin du rôle Load Test Contributor sur la ressource de test de charge pour créer et lancer des séries de tests. Enfin, la tâche AzureLoadTest@1 utilise la connexion de service, le fichier config.yaml et le nom de la ressource pour démarrer le test.
  options:
    owner: { en: "Owner on the resource group grants far more than needed.", fr: "Owner sur le groupe de ressources accorde bien plus que nécessaire." }
    reader: { en: "Load Test Reader can view tests but can't run them.", fr: "Load Test Reader permet de consulter les tests mais pas de les exécuter." }
    publish: { en: "config.yaml describes the load test; it isn't a test results file.", fr: "config.yaml décrit le test de charge ; ce n'est pas un fichier de résultats de test." }
references:
  - title: Manually configure CI/CD for load tests
    url: https://learn.microsoft.com/en-us/azure/load-testing/how-to-configure-load-test-cicd
