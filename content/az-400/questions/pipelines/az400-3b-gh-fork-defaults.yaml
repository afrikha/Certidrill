id: az400-3b-gh-fork-defaults
objective: "3.3.3"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    In 2026, Litware creates a new Azure DevOps organization and a YAML pipeline that builds a public GitHub repository through the Azure Pipelines GitHub App. Nobody changes the settings related to forks.

    Which two statements are true?

    NOTE: Each correct selection is worth one point.
  fr: |
    En 2026, Litware crée une nouvelle organisation Azure DevOps et un pipeline YAML qui génère un dépôt GitHub public par l'application GitHub Azure Pipelines. Personne ne modifie les paramètres liés aux duplications (forks).

    Quelles sont les deux affirmations vraies ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Fork builds receive the secret variables and service connections of the pipeline.", fr: "Les builds de duplications reçoivent les variables secrètes et les connexions de service du pipeline." } }
    - { id: b, text: { en: "Pull requests opened from forks don't trigger builds.", fr: "Les pull requests ouvertes depuis des duplications ne déclenchent pas de build." } }
    - { id: c, text: { en: "Fork builds get the same permissions as the builds of the repository's own branches.", fr: "Les builds de duplications obtiennent les mêmes autorisations que les builds des branches du dépôt lui-même." } }
    - { id: d, text: { en: "Any GitHub user can start a fork build by commenting `/azp run` on the pull request.", fr: "Tout utilisateur GitHub peut démarrer une build de duplication en commentant `/azp run` sur la pull request." } }
    - { id: e, text: { en: "If an administrator selects **Securely build pull requests from forked repositories**, fork builds must be triggered by a pull request comment.", fr: "Si un administrateur sélectionne **Securely build pull requests from forked repositories**, les builds de duplications doivent être déclenchées par un commentaire de pull request." } }
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: |
      Since Sprint 229, Azure Pipelines no longer builds pull requests from forks automatically: new organizations and projects default to disabling them. The secure option allows fork builds with restrictions: secrets can't be made available, fork builds can't get regular permissions, and a comment on the pull request must trigger them.
    fr: |
      Depuis le Sprint 229, Azure Pipelines ne génère plus automatiquement les pull requests issues de duplications : les nouvelles organisations et les nouveaux projets les désactivent par défaut. L'option sécurisée autorise les builds de duplications avec des restrictions : les secrets ne peuvent pas être rendus disponibles, les builds de duplications ne peuvent pas obtenir les autorisations normales, et un commentaire sur la pull request doit les déclencher.
  options:
    a: { en: "Secrets aren't available to fork builds unless Make secrets available to builds of forks is enabled.", fr: "Les secrets ne sont pas disponibles pour les builds de duplications, sauf si Make secrets available to builds of forks est activé." }
    c: { en: "Fork builds get a restricted token unless Make fork builds have the same permissions as regular builds is enabled.", fr: "Les builds de duplications obtiennent un jeton restreint, sauf si Make fork builds have the same permissions as regular builds est activé." }
    d: { en: "Only repository owners and collaborators with Write permission can trigger builds by commenting.", fr: "Seuls les propriétaires du dépôt et les collaborateurs disposant de l'autorisation Write peuvent déclencher des builds par un commentaire." }
references:
  - title: Build GitHub repositories
    url: https://learn.microsoft.com/en-us/azure/devops/pipelines/repos/github
