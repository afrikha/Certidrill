id: az400-3e-ade-definition-order
objective: "3.5.5"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    Proseware's dev center **dc-proseware** has a catalog connected to the **Environments** folder of the main branch of a GitHub repository. Automatic sync is disabled on the catalog. The project **proj-api** already has the project environment type Dev, and the developers have the Deployment Environments User role.

    A platform engineer must make a new environment definition, **FunctionApp**, written in Bicep, available so that a developer can create a Dev environment from it.

    Which four actions should be performed in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Le centre de développement **dc-proseware** de Proseware a un catalogue connecté au dossier **Environments** de la branche main d'un dépôt GitHub. La synchronisation automatique est désactivée sur le catalogue. Le projet **proj-api** a déjà le type d'environnement de projet Dev, et les développeurs disposent du rôle Deployment Environments User.

    Un ingénieur plateforme doit rendre disponible une nouvelle définition d'environnement, **FunctionApp**, écrite en Bicep, pour qu'un développeur puisse créer un environnement Dev à partir de celle-ci.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: folder, text: { en: "Create the folder Environments/FunctionApp with main.bicep and an environment.yaml file.", fr: "Créer le dossier Environments/FunctionApp avec main.bicep et un fichier environment.yaml." } }
    - { id: merge, text: { en: "Merge the new folder into the main branch of the repository.", fr: "Fusionner le nouveau dossier dans la branche main du dépôt." } }
    - { id: sync, text: { en: "Sync the catalog in dc-proseware.", fr: "Synchroniser le catalogue dans dc-proseware." } }
    - { id: create, text: { en: "Create a Dev environment from FunctionApp in the developer portal.", fr: "Créer un environnement Dev à partir de FunctionApp dans le portail des développeurs." } }
    - { id: spec, text: { en: "Publish main.bicep as a template spec.", fr: "Publier main.bicep en tant que spécification de modèle." } }
    - { id: newtype, text: { en: "Create a new environment type named FunctionApp in dc-proseware.", fr: "Créer un nouveau type d'environnement nommé FunctionApp dans dc-proseware." } }
answer:
  sequence: [ folder, merge, sync, create ]
explanation:
  correct:
    en: "An environment definition is a subfolder of the catalog's folder path that contains the template and its environment.yaml manifest. The catalog reads the configured branch, so the folder must be merged first, and with automatic sync disabled a manual sync makes the new definition available to the projects. A developer can then create an environment from it with the existing Dev type."
    fr: "Une définition d'environnement est un sous-dossier du chemin de dossier du catalogue qui contient le modèle et son manifeste environment.yaml. Le catalogue lit la branche configurée : le dossier doit donc d'abord être fusionné, puis, la synchronisation automatique étant désactivée, une synchronisation manuelle rend la nouvelle définition disponible pour les projets. Un développeur peut ensuite créer un environnement à partir de celle-ci avec le type Dev existant."
  options:
    spec: { en: "Deployment Environments reads definitions from the catalog repository, not from template specs.", fr: "Deployment Environments lit les définitions dans le dépôt du catalogue, pas dans des spécifications de modèle." }
    newtype: { en: "Environment types describe stages such as Dev or Test; a new definition doesn't need a new type.", fr: "Les types d'environnements décrivent des étapes comme Dev ou Test ; une nouvelle définition n'exige pas de nouveau type." }
references:
  - title: Add and configure an environment definition in a catalog
    url: https://learn.microsoft.com/en-us/azure/deployment-environments/configure-environment-definition
  - title: Add and configure a catalog from GitHub or Azure Repos
    url: https://learn.microsoft.com/en-us/azure/deployment-environments/how-to-configure-catalog
