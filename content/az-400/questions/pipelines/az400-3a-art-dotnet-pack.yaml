id: az400-3a-art-dotnet-pack
objective: "3.1.4"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    The CI pipeline of the repository **fabrikam-sdk** runs for every feature branch. It must pack every library project of the src folder, but not the test projects, whose names end with .Tests.

    Each CI package must get a prerelease version that is generated automatically from the date and time of the build, such as 1.8.0-ci-20261117-093012, without a script that computes the version.

    How should you complete the task? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Le pipeline de CI du dépôt **fabrikam-sdk** s'exécute pour chaque branche de fonctionnalité. Il doit empaqueter chaque projet de bibliothèque du dossier src, mais pas les projets de test, dont le nom se termine par .Tests.

    Chaque package de CI doit obtenir une version préliminaire générée automatiquement à partir de la date et de l'heure de la build, comme 1.8.0-ci-20261117-093012, sans script qui calcule la version.

    Comment devez-vous compléter la tâche ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: yaml
  template: |
    - task: DotNetCoreCLI@2
      inputs:
        command: pack
        packagesToPack: [[pattern]]
        versioningScheme: [[scheme]]
        majorVersion: '1'
        minorVersion: '8'
        patchVersion: '0'
  slots:
    - id: pattern
      options:
        - { id: neg, text: "'src/**/*.csproj;!src/**/*.Tests.csproj'" }
        - { id: all, text: "'src/**/*.csproj'" }
        - { id: only, text: "'!src/**/*.Tests.csproj'" }
        - { id: tests, text: "'src/**/*.Tests.csproj'" }
    - id: scheme
      options:
        - { id: pre, text: byPrereleaseNumber }
        - { id: bn, text: byBuildNumber }
        - { id: env, text: byEnvVar }
        - { id: none, text: "off" }
answer:
  values: { pattern: neg, scheme: pre }
explanation:
  correct:
    en: |
      packagesToPack accepts several patterns separated by semicolons, and a pattern prefixed with ! excludes files, so the test projects are removed from the match. versioningScheme byPrereleaseNumber (Use the date and time) generates a version formatted as X.Y.Z-ci-datetime from majorVersion, minorVersion and patchVersion.
    fr: |
      packagesToPack accepte plusieurs modèles séparés par des points-virgules, et un modèle précédé de ! exclut des fichiers : les projets de test sont retirés de la correspondance. versioningScheme byPrereleaseNumber (Use the date and time) génère une version au format X.Y.Z-ci-datetime à partir de majorVersion, minorVersion et patchVersion.
  options:
    all: { en: "This pattern also packs the test projects.", fr: "Ce modèle empaquette aussi les projets de test." }
    only: { en: "An exclusion pattern alone matches no project to pack.", fr: "Un modèle d'exclusion seul ne correspond à aucun projet à empaqueter." }
    tests: { en: "This pattern packs only the test projects.", fr: "Ce modèle n'empaquette que les projets de test." }
    bn: { en: "byBuildNumber uses the run number as the version; it does not build X.Y.Z-ci-datetime from the major, minor and patch inputs.", fr: "byBuildNumber utilise le numéro d'exécution comme version ; il ne construit pas X.Y.Z-ci-datetime à partir des entrées majeure, mineure et correctif." }
    env: { en: "byEnvVar reads a version from an environment variable that something must compute first.", fr: "byEnvVar lit une version dans une variable d'environnement que quelque chose doit d'abord calculer." }
    none: { en: "off keeps the version defined in the project file.", fr: "off conserve la version définie dans le fichier projet." }
references:
  - title: DotNetCoreCLI@2 - .NET Core v2 task
    url: https://learn.microsoft.com/en-us/azure/devops/pipelines/tasks/reference/dotnet-core-cli-v2
