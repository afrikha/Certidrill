id: az400-3c-variable-precedence
objective: "3.3.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Adatum has the following YAML pipeline.

    ```yaml
    variables:
      configuration: Debug

    stages:
    - stage: Build
      variables:
        configuration: Release
      jobs:
      - job: UnitTests
        steps:
        - script: echo $(configuration)
      - job: Package
        variables:
          configuration: Staging
        steps:
        - script: echo $(configuration)
    ```

    What does the script of job **UnitTests** print?
  fr: |
    Adatum dispose du pipeline YAML suivant.

    ```yaml
    variables:
      configuration: Debug

    stages:
    - stage: Build
      variables:
        configuration: Release
      jobs:
      - job: UnitTests
        steps:
        - script: echo $(configuration)
      - job: Package
        variables:
          configuration: Staging
        steps:
        - script: echo $(configuration)
    ```

    Qu'affiche le script du travail **UnitTests** ?
body:
  options:
    - { id: a, text: Debug }
    - { id: b, text: Release }
    - { id: c, text: Staging }
    - { id: d, text: "$(configuration)" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      When a variable is defined at several scopes, the most specific one wins. Job UnitTests defines no variable, so the stage-level value Release overrides the root value Debug. The job-level value Staging only applies inside job Package.
    fr: |
      Quand une variable est définie à plusieurs portées, la plus spécifique l'emporte. Le travail UnitTests ne définit aucune variable : la valeur Release de la phase remplace la valeur racine Debug. La valeur Staging du travail ne s'applique qu'au travail Package.
  options:
    a: { en: "The root value is overridden by the stage-level value.", fr: "La valeur racine est remplacée par celle de la phase." }
    c: { en: "Staging is scoped to job Package only.", fr: "Staging n'a pour portée que le travail Package." }
    d: { en: "The macro is printed as is only when the variable doesn't exist; here it is defined.", fr: "La macro n'est affichée telle quelle que si la variable n'existe pas ; ici, elle est définie." }
references:
  - title: Define variables
    url: https://learn.microsoft.com/en-us/azure/devops/pipelines/process/variables
