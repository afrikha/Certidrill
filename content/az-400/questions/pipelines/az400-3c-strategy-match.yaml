id: az400-3c-strategy-match
objective: "3.4.1"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Wingtip is defining the release approach of four applications. You need to choose the deployment strategy that matches each description.

    Which strategy should you use for each description? To answer, drag the appropriate strategies to the correct descriptions. Each strategy may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Wingtip définit l'approche de mise en production de quatre applications. Vous devez choisir la stratégie de déploiement qui correspond à chaque description.

    Quelle stratégie devez-vous utiliser pour chaque description ? Pour répondre, faites glisser les stratégies appropriées vers les descriptions correspondantes. Chaque stratégie peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: bluegreen, text: { en: "Blue-green deployment", fr: "Déploiement bleu/vert" } }
    - { id: canary, text: { en: "Canary release", fr: "Mise en production canari" } }
    - { id: ring, text: { en: "Ring-based deployment", fr: "Déploiement en anneau" } }
    - { id: rolling, text: { en: "Rolling deployment", fr: "Déploiement progressif (rolling)" } }
    - { id: flags, text: { en: "Feature flags", fr: "Indicateurs de fonctionnalités" } }
    - { id: ab, text: { en: "A/B testing", fr: "Tests A/B" } }
  targets:
    - { id: t1, text: { en: "Run two identical production environments, move all the traffic to the new one at once, and move it back to roll back", fr: "Exécuter deux environnements de production identiques, basculer tout le trafic vers le nouveau en une fois, et le rebasculer pour revenir en arrière" } }
    - { id: t2, text: { en: "Deploy new code turned off, then turn it on for beta testers without redeploying", fr: "Déployer du nouveau code désactivé, puis l'activer pour les bêta-testeurs sans redéployer" } }
    - { id: t3, text: { en: "Release to the internal team first, then to early adopters, then to all customers", fr: "Publier d'abord pour l'équipe interne, puis pour les premiers utilisateurs, puis pour tous les clients" } }
    - { id: t4, text: { en: "Replace the application on a fixed pool of servers, a few servers at a time, behind a load balancer", fr: "Remplacer l'application sur un pool fixe de serveurs, quelques serveurs à la fois, derrière un équilibreur de charge" } }
answer:
  mapping: { t1: bluegreen, t2: flags, t3: ring, t4: rolling }
explanation:
  correct:
    en: |
      Blue-green keeps two full environments and switches traffic between them, which also gives an immediate rollback. Feature flags separate deployment from release, so code ships dark and is turned on for chosen users. A ring deployment exposes successive groups of users. A rolling deployment replaces instances in batches without a second environment.
    fr: |
      Le bleu/vert conserve deux environnements complets et bascule le trafic de l'un à l'autre, ce qui permet aussi une restauration immédiate. Les indicateurs de fonctionnalités séparent le déploiement de la mise en production : le code est livré masqué puis activé pour les utilisateurs choisis. Un déploiement en anneau expose des groupes d'utilisateurs successifs. Un déploiement progressif remplace les instances par lots, sans second environnement.
  options:
    canary: { en: "A canary sends a small share of real traffic to the new version to check its health before a wider rollout.", fr: "Un canari envoie une petite part du trafic réel vers la nouvelle version pour vérifier son intégrité avant un déploiement plus large." }
    ab: { en: "A/B testing compares two variants on a business metric to pick one.", fr: "Les tests A/B comparent deux variantes sur un indicateur métier pour en retenir une." }
references:
  - title: What is continuous delivery?
    url: https://learn.microsoft.com/en-us/devops/deliver/what-is-continuous-delivery
  - title: Architecture strategies for safe deployment practices
    url: https://learn.microsoft.com/en-us/azure/well-architected/operational-excellence/safe-deployments
