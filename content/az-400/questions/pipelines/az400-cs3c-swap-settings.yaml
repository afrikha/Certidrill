id: az400-cs3c-swap-settings
objective: "3.4.3"
type: multi
caseStudy: az400-cs3c-litware-energy
difficulty: 3
status: draft
stem:
  en: |
    The production slot of app-meterhub has the custom domain of the API and several settings that the staging slot does not have. No setting is marked as a deployment slot setting, and the default sticky settings of App Service are not overridden.

    When the deployment pipeline swaps the staging slot with production, which two settings remain with the production slot instead of moving with the content?

    NOTE: Each correct selection is worth one point.
  fr: |
    L'emplacement de production de app-meterhub possède le domaine personnalisé de l'API et plusieurs paramètres que l'emplacement staging n'a pas. Aucun paramètre n'est marqué comme paramètre d'emplacement de déploiement, et les paramètres persistants par défaut d'App Service ne sont pas remplacés.

    Quand le pipeline de déploiement permute l'emplacement staging avec la production, quels sont les deux paramètres qui restent dans l'emplacement de production au lieu de suivre le contenu ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "The custom domain name api.meterhub.litware.example", fr: "Le nom de domaine personnalisé api.meterhub.litware.example" } }
    - { id: b, text: { en: "The scale settings of the slot", fr: "Les paramètres de mise à l'échelle de l'emplacement" } }
    - { id: c, text: { en: "An app setting named Telemetry__SamplingPercentage", fr: "Un paramètre d'application nommé Telemetry__SamplingPercentage" } }
    - { id: d, text: { en: "The .NET version of the app", fr: "La version .NET de l'application" } }
    - { id: e, text: { en: "A connection string named MeterDb", fr: "Une chaîne de connexion nommée MeterDb" } }
    - { id: f, text: { en: "The handler mappings of the app", fr: "Les mappages de gestionnaires de l'application" } }
answer: { optionIds: [a, b] }
explanation:
  correct:
    en: |
      Some settings are tied to the slot and are never swapped, including custom domain names, publishing endpoints, nonpublic certificates and TLS/SSL settings, scale settings, and managed identities. Settings related to the content, such as the language framework version, handler mappings, and the app settings and connection strings that are not marked as deployment slot settings, move with the app during the swap.
    fr: |
      Certains paramètres sont liés à l'emplacement et ne sont jamais permutés, notamment les noms de domaine personnalisés, les points de terminaison de publication, les certificats non publics et paramètres TLS/SSL, les paramètres de mise à l'échelle et les identités managées. Les paramètres liés au contenu, comme la version du framework de langage, les mappages de gestionnaires ainsi que les paramètres d'application et chaînes de connexion non marqués comme paramètres d'emplacement de déploiement, suivent l'application lors de la permutation.
  options:
    c:
      en: |
        An app setting is swapped unless it is marked as a deployment slot setting, and none is.
      fr: |
        Un paramètre d'application est permuté sauf s'il est marqué comme paramètre d'emplacement de déploiement, et aucun ne l'est.
    d:
      en: |
        Language framework versions are swapped with the content.
      fr: |
        Les versions du framework de langage sont permutées avec le contenu.
    e:
      en: |
        A connection string is swapped unless it is marked as a deployment slot setting, and none is.
      fr: |
        Une chaîne de connexion est permutée sauf si elle est marquée comme paramètre d'emplacement de déploiement, et aucune ne l'est.
    f:
      en: |
        Handler mappings are swapped with the content.
      fr: |
        Les mappages de gestionnaires sont permutés avec le contenu.
references:
  - title: Set Up Staging Environments
    url: https://learn.microsoft.com/en-us/azure/app-service/deploy-staging-slots
