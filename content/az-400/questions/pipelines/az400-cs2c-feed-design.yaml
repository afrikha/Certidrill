id: az400-cs2c-feed-design
objective: "3.1.2"
type: dragdrop
caseStudy: az400-cs2c-fourth-coffee
difficulty: 2
status: draft
stem:
  en: |
    You need to configure the fc-npm feed to meet the npm package requirements. The ui-kit pipeline publishes every new version to fc-npm.

    What should each consumer use? To answer, drag the appropriate feed elements to the correct consumers. Each feed element may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez configurer le flux fc-npm pour respecter les exigences relatives aux packages npm. Le pipeline d'ui-kit publie chaque nouvelle version dans fc-npm.

    Qu'est-ce que chaque consommateur doit utiliser ? Pour répondre, faites glisser les éléments de flux appropriés vers les consommateurs correspondants. Chaque élément de flux peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: upstream, text: { en: "fc-npm with an npmjs.com upstream source", fr: "fc-npm avec une source en amont npmjs.com" } }
    - { id: local, text: { en: "The @Local view of fc-npm", fr: "La vue @Local de fc-npm" } }
    - { id: pre, text: { en: "The @Prerelease view of fc-npm", fr: "La vue @Prerelease de fc-npm" } }
    - { id: rel, text: { en: "The @Release view of fc-npm", fr: "La vue @Release de fc-npm" } }
    - { id: retention, text: { en: "fc-npm with a retention policy of 30 versions", fr: "fc-npm avec une stratégie de rétention de 30 versions" } }
  targets:
    - { id: devs, text: { en: "Developers who restore public npm packages", fr: "Développeurs qui restaurent des packages npm publics" } }
    - { id: beta, text: { en: "Beta testers", fr: "Bêta-testeurs" } }
    - { id: teams, text: { en: "Other teams", fr: "Autres équipes" } }
answer:
  mapping: { devs: upstream, beta: pre, teams: rel }
explanation:
  correct:
    en: With an npmjs.com upstream source, fc-npm saves a copy of every public package that a collaborator installs, so restores keep working when npmjs.com is unavailable. Packages are always published to the base feed (the @Local view); the pipeline or QA then promotes validated versions to @Prerelease after integration tests and to @Release after QA approval, and each audience consumes only its view.
    fr: |
      Avec une source en amont npmjs.com, fc-npm enregistre une copie de chaque package public installé par un collaborateur : les restaurations continuent de fonctionner quand npmjs.com est indisponible. Les packages sont toujours publiés dans le flux de base (la vue @Local) ; le pipeline ou l'équipe QA promeut ensuite les versions validées vers @Prerelease après les tests d'intégration et vers @Release après l'approbation QA, et chaque public ne consomme que sa vue.
  options:
    local: { en: "@Local contains every published version, including the ones that haven't passed any test.", fr: "@Local contient toutes les versions publiées, y compris celles qui n'ont réussi aucun test." }
    retention: { en: "A retention policy deletes old versions; it doesn't filter versions by quality or cache public packages.", fr: "Une stratégie de rétention supprime les anciennes versions ; elle ne filtre pas les versions par qualité et ne met pas en cache les packages publics." }
references:
  - title: What are upstream sources?
    url: https://learn.microsoft.com/en-us/azure/devops/artifacts/concepts/upstream-sources
  - title: Promote packages and manage feed views
    url: https://learn.microsoft.com/en-us/azure/devops/artifacts/feeds/views
