id: az400-3e-cfg-tool-facts
objective: "3.5.1"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Proseware is choosing configuration management technologies for a hybrid estate of Azure resources, Windows servers and Linux servers. You review the characteristics of the candidate technologies.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware choisit des technologies de gestion de la configuration pour un parc hybride de ressources Azure, de serveurs Windows et de serveurs Linux. Vous examinez les caractéristiques des technologies candidates.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "A single Terraform configuration can use several provider credentials."
        fr: "Une même configuration Terraform peut utiliser plusieurs informations d'identification de fournisseur."
    - id: s2
      text:
        en: "When someone changes a resource deployed by Bicep in the Azure portal, the change must be imported before the next Bicep deployment can run."
        fr: "Lorsque quelqu'un modifie dans le portail Azure une ressource déployée par Bicep, la modification doit être importée avant que le prochain déploiement Bicep puisse s'exécuter."
    - id: s3
      text:
        en: "Azure Automation State Configuration is a supported choice to configure new Linux servers."
        fr: "Azure Automation State Configuration est un choix pris en charge pour configurer de nouveaux serveurs Linux."
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: "Terraform authenticates with provider credentials (Azure CLI, service principal, managed identity), and one configuration can use several of them. Out-of-band changes don't block a Bicep deployment, because Bicep keeps no state to reconcile; with Terraform, such changes have to be imported into the state. Azure Automation DSC for Linux retired on September 30, 2023."
    fr: "Terraform s'authentifie avec des informations d'identification de fournisseur (Azure CLI, principal de service, identité managée), et une configuration peut en utiliser plusieurs. Les modifications hors bande ne bloquent pas un déploiement Bicep, car Bicep ne conserve aucun état à réconcilier ; avec Terraform, ces modifications doivent être importées dans l'état. Azure Automation DSC pour Linux a été mis hors service le 30 septembre 2023."
references:
  - title: Comparing Terraform and Bicep
    url: https://learn.microsoft.com/en-us/azure/developer/terraform/comparing-terraform-and-bicep
  - title: Azure Automation State Configuration overview
    url: https://learn.microsoft.com/en-us/azure/automation/automation-dsc-overview
