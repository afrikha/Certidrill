id: az400-3f-lock-default
objective: "3.6.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Adatum has an environment named **int-shared** with an Exclusive lock check. A multi-stage YAML pipeline deploys to int-shared in its Integration stage. The YAML file does not contain the lockBehavior property.

    Run 100 is deploying to int-shared. Runs 101, 102 and 103 then reach the Integration stage, in that order, before run 100 finishes.

    What happens when run 100 releases the lock?
  fr: |
    Adatum dispose d'un environnement nommé **int-shared** doté d'une vérification Exclusive lock. Un pipeline YAML à phases multiples effectue un déploiement sur int-shared dans sa phase Integration. Le fichier YAML ne contient pas la propriété lockBehavior.

    L'exécution 100 effectue un déploiement sur int-shared. Les exécutions 101, 102 et 103 atteignent ensuite la phase Integration, dans cet ordre, avant la fin de l'exécution 100.

    Que se passe-t-il quand l'exécution 100 libère le verrou ?
body:
  options:
    - { id: a, text: { en: "Runs 101, 102 and 103 deploy one after the other, in the order in which they arrived.", fr: "Les exécutions 101, 102 et 103 effectuent leur déploiement l'une après l'autre, dans leur ordre d'arrivée." } }
    - { id: b, text: { en: "Only run 103 acquires the lock and deploys; runs 101 and 102 do not deploy to int-shared.", fr: "Seule l'exécution 103 obtient le verrou et effectue le déploiement ; les exécutions 101 et 102 n'effectuent pas de déploiement sur int-shared." } }
    - { id: c, text: { en: "Runs 101, 102 and 103 deploy at the same time, because the lock applies only to run 100.", fr: "Les exécutions 101, 102 et 103 effectuent leur déploiement en même temps, car le verrou ne s'applique qu'à l'exécution 100." } }
    - { id: d, text: { en: "Runs 101, 102 and 103 fail, because the check requires lockBehavior to be set in the YAML file.", fr: "Les exécutions 101, 102 et 103 échouent, car la vérification exige que lockBehavior soit défini dans le fichier YAML." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      When a resource has an exclusive lock and the pipeline does not specify lockBehavior, the default value runLatest is used, so only the latest run acquires the lock. To have every run deploy in turn, set lockBehavior to sequential on the stage or on the pipeline.
    fr: |
      Quand une ressource a un verrou exclusif et que le pipeline ne précise pas lockBehavior, la valeur par défaut runLatest s'applique : seule la dernière exécution obtient le verrou. Pour que chaque exécution effectue son déploiement à tour de rôle, définissez lockBehavior sur sequential sur la phase ou sur le pipeline.
  options:
    a: { en: "This is the sequential behavior, which must be set explicitly.", fr: "C'est le comportement sequential, qui doit être défini explicitement." }
    c: { en: "The exclusive lock allows only a single run to proceed at a time.", fr: "Le verrou exclusif ne laisse avancer qu'une seule exécution à la fois." }
    d: { en: "lockBehavior is optional; runLatest applies when it is missing.", fr: "lockBehavior est facultatif ; runLatest s'applique en son absence." }
references:
  - title: Define approvals and checks
    url: https://learn.microsoft.com/en-us/azure/devops/pipelines/process/approvals
