id: az400-3f-limit-matrix
objective: "3.6.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove Bank uses only self-hosted agents. The agent pool **pool-shared** has 12 agents, and the organization has 10 self-hosted parallel jobs. A YAML pipeline named **risk-tests** has a job with a matrix strategy of eight configurations that runs on pool-shared. While risk-tests runs, the pipelines of other teams stay queued.

    You need to ensure that a run of risk-tests never executes more than three of its matrix configurations at the same time. All eight configurations must still run.

    Which two actions should you perform? Each correct answer presents a complete solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove Bank utilise uniquement des agents auto-hébergés. Le pool d'agents **pool-shared** compte 12 agents, et l'organisation dispose de 10 travaux parallèles auto-hébergés. Un pipeline YAML nommé **risk-tests** contient un travail avec une stratégie de matrice de huit configurations qui s'exécute sur pool-shared. Pendant l'exécution de risk-tests, les pipelines des autres équipes restent en file d'attente.

    Vous devez vous assurer qu'une exécution de risk-tests ne lance jamais plus de trois de ses configurations de matrice en même temps. Les huit configurations doivent toujours s'exécuter.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse constitue une solution complète.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Add maxParallel: 3 to the matrix strategy of the job.", fr: "Ajouter maxParallel: 3 à la stratégie de matrice du travail." } }
    - { id: b, text: { en: "Replace the matrix strategy with parallel: 3.", fr: "Remplacer la stratégie de matrice par parallel: 3." } }
    - { id: c, text: { en: "Create an agent pool that contains three agents and run the job of risk-tests in that pool.", fr: "Créer un pool d'agents qui contient trois agents et exécuter le travail de risk-tests dans ce pool." } }
    - { id: d, text: { en: "Dedicate three of the parallel jobs to the project that contains risk-tests.", fr: "Réserver trois des travaux parallèles au projet qui contient risk-tests." } }
    - { id: e, text: { en: "Set lockBehavior: sequential on the stage that contains the matrix job.", fr: "Définir lockBehavior: sequential sur la phase qui contient le travail de matrice." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |
      maxParallel limits the number of matrix legs that run simultaneously, so the eight configurations run three at a time. A pool with only three agents also caps the job at three concurrent legs, because each leg needs an agent of the pool, and the parallel jobs are left to the other teams' pools.
    fr: |
      maxParallel limite le nombre de branches de la matrice exécutées simultanément : les huit configurations s'exécutent trois par trois. Un pool de trois agents seulement plafonne aussi le travail à trois branches simultanées, car chaque branche a besoin d'un agent du pool, et les travaux parallèles restent disponibles pour les pools des autres équipes.
  options:
    b: { en: "parallel: 3 runs three copies of one job for test slicing, so the eight configurations would no longer run.", fr: "parallel: 3 exécute trois copies d'un même travail pour découper les tests : les huit configurations ne s'exécuteraient plus." }
    d: { en: "Parallel jobs are shared by the whole organization and cannot be dedicated to a project or a pool.", fr: "Les travaux parallèles sont partagés par toute l'organisation et ne peuvent pas être réservés à un projet ou à un pool." }
    e: { en: "lockBehavior applies to runs waiting for an exclusive lock on a resource, not to matrix legs.", fr: "lockBehavior s'applique aux exécutions qui attendent un verrou exclusif sur une ressource, pas aux branches d'une matrice." }
references:
  - title: jobs.job.strategy definition
    url: https://learn.microsoft.com/en-us/azure/devops/pipelines/yaml-schema/jobs-job-strategy
  - title: Configure and pay for parallel jobs
    url: https://learn.microsoft.com/en-us/azure/devops/pipelines/licensing/concurrent-jobs
