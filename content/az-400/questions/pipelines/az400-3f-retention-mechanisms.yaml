id: az400-3f-retention-mechanisms
objective: "3.6.4"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Northwind Traders uses Azure Pipelines and Azure Artifacts in a project named **Retail**. The release manager lists four retention requirements.

    Which feature should you use for each requirement? To answer, drag the appropriate features to the correct requirements. Each feature may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind Traders utilise Azure Pipelines et Azure Artifacts dans un projet nommé **Retail**. Le responsable des mises en production liste quatre exigences de rétention.

    Quelle fonctionnalité devez-vous utiliser pour chaque exigence ? Pour répondre, faites glisser les fonctionnalités appropriées vers les exigences correspondantes. Chaque fonctionnalité peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: view, text: { en: "Promotion to the @Release view", fr: "Promotion vers la vue @Release" } }
    - { id: feedret, text: { en: "Package retention on the feed", fr: "Rétention des packages sur le flux" } }
    - { id: recent, text: { en: "Number of recent runs to retain per pipeline", fr: "Nombre d'exécutions récentes à conserver par pipeline" } }
    - { id: prdays, text: { en: "Days to keep pull request runs", fr: "Jours de conservation des exécutions de demandes de tirage" } }
    - { id: lease, text: { en: "Retention lease", fr: "Bail de rétention" } }
    - { id: recycle, text: { en: "Recycle Bin of the feed", fr: "Corbeille du flux" } }
  targets:
    - { id: t1, text: { en: "Protect the validated versions of each package from automatic deletion.", fr: "Protéger de la suppression automatique les versions validées de chaque package." } }
    - { id: t2, text: { en: "Keep at most 25 versions of each package, unless a version was downloaded recently.", fr: "Conserver au plus 25 versions de chaque package, sauf si une version a été téléchargée récemment." } }
    - { id: t3, text: { en: "Always keep the latest runs of the default branch and of each protected branch, whatever their age.", fr: "Toujours conserver les dernières exécutions de la branche par défaut et de chaque branche protégée, quel que soit leur âge." } }
    - { id: t4, text: { en: "Delete the validation runs of pull requests sooner than the CI runs.", fr: "Supprimer les exécutions de validation des demandes de tirage plus tôt que les exécutions CI." } }
answer:
  mapping: { t1: view, t2: feedret, t3: recent, t4: prdays }
explanation:
  correct:
    en: |
      Versions promoted to a view are exempt from feed retention, while package retention deletes versions beyond the maximum count that were not downloaded recently. In the project pipeline settings, the number of recent runs is always kept per pipeline, default branch and protected branch, and pull request runs have their own number of days to keep.
    fr: |
      Les versions promues vers une vue sont exemptées de la rétention du flux, tandis que la rétention des packages supprime les versions au-delà du nombre maximal qui n'ont pas été téléchargées récemment. Dans les paramètres de pipeline du projet, le nombre d'exécutions récentes est toujours conservé par pipeline, branche par défaut et branche protégée, et les exécutions de demandes de tirage ont leur propre nombre de jours de conservation.
  options:
    lease: { en: "A lease protects specific runs chosen by a script or API call, not a rule for all branches.", fr: "Un bail protège des exécutions précises choisies par un script ou un appel d'API, ce n'est pas une règle pour toutes les branches." }
    recycle: { en: "The Recycle Bin holds deleted packages for 30 days; it does not decide what is deleted.", fr: "La Corbeille conserve les packages supprimés pendant 30 jours ; elle ne décide pas de ce qui est supprimé." }
references:
  - title: Retention policies
    url: https://learn.microsoft.com/en-us/azure/devops/pipelines/policies/retention
  - title: Delete and recover packages
    url: https://learn.microsoft.com/en-us/azure/devops/artifacts/how-to/delete-and-recover-packages
