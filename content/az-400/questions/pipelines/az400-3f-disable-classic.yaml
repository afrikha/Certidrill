id: az400-3f-disable-classic
objective: "3.6.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Litware has migrated all its classic pipelines to YAML in the 14 projects of its Azure DevOps organization. Classic and YAML pipelines share service connections, so the security team wants to stop the use of classic pipelines.

    You need to prevent users in every project from creating classic build pipelines and classic release pipelines. YAML pipelines must keep working. The solution must minimize administrative effort.

    What should you do?
  fr: |
    Litware a migré tous ses pipelines classiques vers YAML dans les 14 projets de son organisation Azure DevOps. Les pipelines classiques et YAML partagent des connexions de service ; l'équipe sécurité veut donc mettre fin à l'utilisation des pipelines classiques.

    Vous devez empêcher les utilisateurs de tous les projets de créer des pipelines de build classiques et des pipelines de mise en production classiques. Les pipelines YAML doivent continuer de fonctionner. La solution doit réduire au minimum l'effort d'administration.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "In Organization settings > Pipelines > Settings, turn on Disable creation of classic build pipelines and Disable creation of classic release pipelines", fr: "Dans Paramètres de l'organisation > Pipelines > Paramètres, activer Disable creation of classic build pipelines et Disable creation of classic release pipelines" } }
    - { id: b, text: { en: "In each project's Project settings > Pipelines > Settings, turn on Disable creation of classic build pipelines and Disable creation of classic release pipelines", fr: "Dans Paramètres du projet > Pipelines > Paramètres de chaque projet, activer Disable creation of classic build pipelines et Disable creation of classic release pipelines" } }
    - { id: c, text: { en: "In each project, deny the Edit build pipeline permission to the Contributors group at the pipeline level", fr: "Dans chaque projet, refuser l'autorisation Edit build pipeline au groupe Contributors au niveau des pipelines" } }
    - { id: d, text: { en: "In Organization settings > Pipelines > Settings, turn on Disable implied YAML CI trigger", fr: "Dans Paramètres de l'organisation > Pipelines > Paramètres, activer Disable implied YAML CI trigger" } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      The two General settings Disable creation of classic build pipelines and Disable creation of classic release pipelines exist at organization and project level. Turned on at organization level, they apply to every project, and users can no longer create classic build or release pipelines, task groups or deployment groups through the UI or the REST API.
    fr: |
      Les deux paramètres généraux Disable creation of classic build pipelines et Disable creation of classic release pipelines existent au niveau de l'organisation et du projet. Activés au niveau de l'organisation, ils s'appliquent à tous les projets, et les utilisateurs ne peuvent plus créer de pipelines de build ou de mise en production classiques, de groupes de tâches ni de groupes de déploiement par l'interface ou l'API REST.
  options:
    b: { en: "This works, but configuring 14 projects one by one does not minimize administrative effort.", fr: "Cela fonctionne, mais configurer les 14 projets un par un ne réduit pas l'effort d'administration." }
    c: { en: "Denying Edit build pipeline also blocks changes to YAML pipelines and does not cover classic release pipelines.", fr: "Refuser Edit build pipeline bloque aussi les modifications des pipelines YAML et ne couvre pas les pipelines de mise en production classiques." }
    d: { en: "This setting removes the default CI trigger of YAML pipelines; it does not affect classic pipelines.", fr: "Ce paramètre supprime le déclencheur CI implicite des pipelines YAML ; il n'a pas d'effet sur les pipelines classiques." }
references:
  - title: Determine your approach for securing YAML pipelines
    url: https://learn.microsoft.com/en-us/azure/devops/pipelines/security/approach
