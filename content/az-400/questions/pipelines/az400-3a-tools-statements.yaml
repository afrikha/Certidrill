id: az400-3a-tools-statements
objective: "3.1.1"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove is choosing between GitHub Packages and Azure Artifacts for its internal NuGet and npm packages. Its builds currently download public packages directly from nuget.org and npmjs.com.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove hésite entre GitHub Packages et Azure Artifacts pour ses packages NuGet et npm internes. Ses builds téléchargent actuellement les packages publics directement depuis nuget.org et npmjs.com.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          Azure Artifacts includes 2 GiB of free storage for each Azure DevOps organization.
        fr: |
          Azure Artifacts inclut 2 Gio de stockage gratuit pour chaque organisation Azure DevOps.
    - id: s2
      text:
        en: |
          A GitHub Packages registry can be configured with npmjs.com as an upstream source that caches the public packages used by the builds.
        fr: |
          Un registre GitHub Packages peut être configuré avec npmjs.com comme source en amont qui met en cache les packages publics utilisés par les builds.
    - id: s3
      text:
        en: |
          A GitHub Actions workflow can push a NuGet package to GitHub Packages by passing the built-in GITHUB_TOKEN as the API key.
        fr: |
          Un workflow GitHub Actions peut envoyer un package NuGet vers GitHub Packages en passant le jeton intégré GITHUB_TOKEN comme clé d'API.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |
      Azure Artifacts gives each organization 2 GiB of free storage; beyond that, storage is billed. Upstream sources, which proxy and save public packages, are an Azure Artifacts feature; GitHub Packages has no equivalent. In a workflow, `dotnet nuget push` can use `--api-key ${{ secrets.GITHUB_TOKEN }}` when the job has `packages: write`.
    fr: |
      Azure Artifacts offre 2 Gio de stockage gratuit par organisation ; au-delà, le stockage est facturé. Les sources en amont, qui servent de proxy aux packages publics et les enregistrent, sont une fonctionnalité d'Azure Artifacts ; GitHub Packages n'a pas d'équivalent. Dans un workflow, `dotnet nuget push` peut utiliser `--api-key ${{ secrets.GITHUB_TOKEN }}` quand le job dispose de `packages: write`.
references:
  - title: What is Azure Artifacts?
    url: https://learn.microsoft.com/en-us/azure/devops/artifacts/start-using-azure-artifacts
  - title: Publish packages
    url: https://learn.microsoft.com/en-us/training/modules/introduction-github-packages/2-publish-packages
