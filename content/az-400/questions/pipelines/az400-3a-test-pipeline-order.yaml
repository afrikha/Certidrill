id: az400-3a-test-pipeline-order
objective: "3.2.2"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    Wingtip is redesigning the release pipeline of its ticketing API. The test strategy must meet the following requirements:

    - The fastest and cheapest tests run first, before anything is deployed.
    - Integration tests and load tests run against a staging environment that mirrors production.
    - Load tests run only on builds that passed the integration tests.
    - Nothing reaches production unless every test passed, and production receives the artifact that was tested.

    Which five actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Wingtip refond le pipeline de mise en production de son API de billetterie. La stratégie de test doit répondre aux exigences suivantes :

    - Les tests les plus rapides et les moins coûteux s'exécutent en premier, avant tout déploiement.
    - Les tests d'intégration et les tests de charge s'exécutent sur un environnement de préproduction identique à la production.
    - Les tests de charge ne s'exécutent que sur les builds qui ont réussi les tests d'intégration.
    - Rien n'atteint la production si un test a échoué, et la production reçoit l'artefact qui a été testé.

    Quelles sont les cinq actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 5
  actions:
    - { id: unit, text: { en: "Run the unit tests on the build agent.", fr: "Exécuter les tests unitaires sur l'agent de build." } }
    - { id: stage, text: { en: "Deploy the build artifact to the staging environment.", fr: "Déployer l'artefact de build dans l'environnement de préproduction." } }
    - { id: integ, text: { en: "Run the integration tests against staging.", fr: "Exécuter les tests d'intégration sur la préproduction." } }
    - { id: load, text: { en: "Run the Azure Load Testing test against staging.", fr: "Exécuter le test Azure Load Testing sur la préproduction." } }
    - { id: prod, text: { en: "Deploy the same artifact to production.", fr: "Déployer le même artefact en production." } }
    - { id: loadprod, text: { en: "Run the Azure Load Testing test against production.", fr: "Exécuter le test Azure Load Testing sur la production." } }
    - { id: rebuild, text: { en: "Rebuild the application before the production deployment.", fr: "Régénérer l'application avant le déploiement en production." } }
answer:
  sequence: [ unit, stage, integ, load, prod ]
explanation:
  correct:
    en: |
      Unit tests have the fewest dependencies and run in the build, so they fail fast before any deployment. The tested artifact is then deployed to staging, where integration tests run first and the load test runs only after them. Production receives the same artifact only after all of these tests pass.
    fr: |
      Les tests unitaires ont le moins de dépendances et s'exécutent dans la build : ils échouent vite, avant tout déploiement. L'artefact testé est ensuite déployé en préproduction, où les tests d'intégration s'exécutent d'abord, puis le test de charge seulement après eux. La production reçoit le même artefact uniquement après la réussite de tous ces tests.
  options:
    loadprod: { en: "The load tests must run on staging and gate the production deployment, not run on production afterward.", fr: "Les tests de charge doivent s'exécuter en préproduction et conditionner le déploiement en production, pas s'exécuter en production ensuite." }
    rebuild: { en: "Rebuilding produces a new artifact that was not tested.", fr: "Régénérer produit un nouvel artefact qui n'a pas été testé." }
references:
  - title: Shift testing left with unit tests
    url: https://learn.microsoft.com/en-us/devops/develop/shift-left-make-testing-fast-reliable
  - title: Manually configure CI/CD for load tests
    url: https://learn.microsoft.com/en-us/azure/load-testing/how-to-configure-load-test-cicd
