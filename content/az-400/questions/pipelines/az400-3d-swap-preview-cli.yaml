id: az400-3d-swap-preview-cli
objective: "3.4.3"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Adatum has an App Service web app named **app-billing** in a resource group named **rg-billing**. A pipeline deploys each version to the **staging** slot and then swaps it into production by running Azure CLI commands.

    The pipeline must meet the following requirements:

    - Before routing changes, staging must run with the production slot settings so that the testers can validate it.
    - If the validation succeeds, the swap must finish.
    - If the validation fails, staging must return to its own settings and production must stay unchanged.

    How should you complete the commands? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum dispose d'une application web App Service nommée **app-billing** dans un groupe de ressources nommé **rg-billing**. Un pipeline déploie chaque version dans l'emplacement **staging**, puis la permute en production en exécutant des commandes Azure CLI.

    Le pipeline doit respecter les exigences suivantes :

    - Avant toute modification du routage, staging doit s'exécuter avec les paramètres d'emplacement de la production pour que les testeurs puissent le valider.
    - Si la validation réussit, la permutation doit se terminer.
    - Si la validation échoue, staging doit retrouver ses propres paramètres et la production doit rester inchangée.

    Comment devez-vous compléter les commandes ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: bash
  template:
    en: |
      # Before validation
      az webapp deployment slot swap -g rg-billing -n app-billing \
        --slot staging --target-slot production --action [[first]]

      # Validation succeeded
      az webapp deployment slot swap -g rg-billing -n app-billing \
        --slot staging --target-slot production --action [[success]]

      # Validation failed
      az webapp deployment slot swap -g rg-billing -n app-billing \
        --slot staging --target-slot production --action [[failure]]
    fr: |
      # Avant la validation
      az webapp deployment slot swap -g rg-billing -n app-billing \
        --slot staging --target-slot production --action [[first]]

      # Validation réussie
      az webapp deployment slot swap -g rg-billing -n app-billing \
        --slot staging --target-slot production --action [[success]]

      # Validation échouée
      az webapp deployment slot swap -g rg-billing -n app-billing \
        --slot staging --target-slot production --action [[failure]]
  slots:
    - id: first
      options:
        - { id: fSwap, text: swap }
        - { id: fPreview, text: preview }
        - { id: fReset, text: reset }
    - id: success
      options:
        - { id: sPreview, text: preview }
        - { id: sReset, text: reset }
        - { id: sSwap, text: swap }
    - id: failure
      options:
        - { id: xReset, text: reset }
        - { id: xSwap, text: swap }
        - { id: xPreview, text: preview }
answer:
  values: { first: fPreview, success: sSwap, failure: xReset }
explanation:
  correct:
    en: |
      `--action preview` runs the first phase of a multi-phase swap: the production slot settings are applied to staging and its instances restart, but routing doesn't change. `--action swap` completes the swap, and `--action reset` cancels it and reapplies the staging settings to the staging slot, leaving production untouched.
    fr: |
      `--action preview` exécute la première phase d'une permutation en plusieurs phases : les paramètres d'emplacement de la production sont appliqués à staging et ses instances redémarrent, mais le routage ne change pas. `--action swap` termine la permutation, et `--action reset` l'annule et réapplique les paramètres de staging à l'emplacement staging, sans toucher à la production.
  options:
    fSwap: { en: "A plain swap switches routing immediately, so the testers can't validate before production changes.", fr: "Une permutation simple bascule immédiatement le routage : les testeurs ne peuvent pas valider avant que la production change." }
    sReset: { en: "reset cancels the swap instead of finishing it.", fr: "reset annule la permutation au lieu de la terminer." }
    xSwap: { en: "swap would put the failed version into production.", fr: "swap mettrait la version défaillante en production." }
references:
  - title: az webapp deployment slot
    url: https://learn.microsoft.com/en-us/cli/azure/webapp/deployment/slot
  - title: Set up staging environments in Azure App Service
    url: https://learn.microsoft.com/en-us/azure/app-service/deploy-staging-slots
