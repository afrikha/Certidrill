id: az400-3b-trg-gh-filters
objective: "3.3.4"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Proseware's GitHub Actions CI workflow must meet the following requirements:

    - Run for pushes to main, except when a push only changes Markdown files in the docs folder.
    - Run for pull requests that target main when they are opened, updated or reopened, and when a draft pull request is marked as ready for review.

    How should you complete the workflow? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Le workflow de CI GitHub Actions de Proseware doit satisfaire les exigences suivantes :

    - S'exécuter pour les envois sur main, sauf quand un envoi ne modifie que des fichiers Markdown du dossier docs.
    - S'exécuter pour les pull requests qui ciblent main quand elles sont ouvertes, mises à jour ou rouvertes, et quand une pull request en brouillon est marquée comme prête pour la revue.

    Comment devez-vous compléter le workflow ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: yaml
  template: |
    on:
      push:
        branches: [ main ]
        [[ignore]]: [ 'docs/**/*.md' ]
      pull_request:
        [[target]]: [ main ]
        types: [ opened, synchronize, reopened, [[type]] ]
  slots:
    - id: ignore
      options:
        - { id: paths, text: paths }
        - { id: pathsignore, text: paths-ignore }
        - { id: branchesignore, text: branches-ignore }
        - { id: tagsignore, text: tags-ignore }
    - id: target
      options:
        - { id: branches, text: branches }
        - { id: branchesignore2, text: branches-ignore }
        - { id: paths2, text: paths }
    - id: type
      options:
        - { id: edited, text: edited }
        - { id: converted, text: converted_to_draft }
        - { id: ready, text: ready_for_review }
        - { id: closed, text: closed }
answer:
  values: { ignore: pathsignore, target: branches, type: ready }
explanation:
  correct:
    en: |
      `paths-ignore` skips the workflow when every changed file matches the patterns, here the Markdown files of docs. For `pull_request`, `branches` filters on the target branch of the pull request. When `types` is set, it replaces the default activity types (opened, synchronize, reopened), so `ready_for_review` must be listed to run when a draft is marked as ready.
    fr: |
      `paths-ignore` ignore le workflow quand tous les fichiers modifiés correspondent aux modèles, ici les fichiers Markdown de docs. Pour `pull_request`, `branches` filtre sur la branche cible de la pull request. Quand `types` est défini, il remplace les types d'activité par défaut (opened, synchronize, reopened) : `ready_for_review` doit donc figurer dans la liste pour une exécution quand un brouillon est marqué comme prêt.
  options:
    paths: { en: "paths would run the workflow only when Markdown files in docs change.", fr: "paths n'exécuterait le workflow que lorsque des fichiers Markdown de docs changent." }
    branchesignore: { en: "branches-ignore filters branch names, not changed files.", fr: "branches-ignore filtre les noms de branches, pas les fichiers modifiés." }
    tagsignore: { en: "tags-ignore filters tag names.", fr: "tags-ignore filtre les noms de balises." }
    branchesignore2: { en: "branches-ignore would run for every pull request except those that target main.", fr: "branches-ignore exécuterait le workflow pour toutes les pull requests sauf celles qui ciblent main." }
    paths2: { en: "paths filters changed files, not the target branch.", fr: "paths filtre les fichiers modifiés, pas la branche cible." }
    converted: { en: "converted_to_draft fires when a pull request goes back to draft.", fr: "converted_to_draft se produit quand une pull request repasse en brouillon." }
references:
  - title: Explore events
    url: https://learn.microsoft.com/en-us/training/modules/introduction-to-github-actions/6-explore-events
