id: az400-3c-sequential-lock
objective: "3.3.9"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    At Fabrikam, the Azure Pipelines environment **prod** has an Exclusive lock check and a virtual machine resource named **web01**. You need to meet the following requirements:

    - Every queued run must deploy, one run after the other.
    - The deployment must be recorded in the deployment history of web01 and be subject to the checks of prod.

    How should you complete the YAML? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Chez Fabrikam, l'environnement Azure Pipelines **prod** possède une vérification Exclusive lock et une ressource machine virtuelle nommée **web01**. Vous devez respecter les exigences suivantes :

    - Chaque exécution mise en file d'attente doit déployer, une exécution après l'autre.
    - Le déploiement doit être enregistré dans l'historique de déploiement de web01 et être soumis aux vérifications de prod.

    Comment devez-vous compléter le YAML ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: yaml
  template: |
    stages:
    - stage: Prod
      lockBehavior: [[s1]]
      jobs:
      - [[s2]]: DeployWeb
        environment: [[s3]]
        strategy:
          runOnce:
            deploy:
              steps:
              - script: ./deploy.sh
  slots:
    - id: s1
      options:
        - { id: runlatest, text: runLatest }
        - { id: sequential, text: sequential }
        - { id: exclusive, text: exclusive }
    - id: s2
      options:
        - { id: job, text: job }
        - { id: deployment, text: deployment }
        - { id: template, text: template }
    - id: s3
      options:
        - { id: dot, text: prod.web01 }
        - { id: slash, text: prod/web01 }
        - { id: reverse, text: web01.prod }
answer:
  values: { s1: sequential, s2: deployment, s3: dot }
explanation:
  correct:
    en: "`lockBehavior: sequential` makes all runs acquire the exclusive lock one after another, instead of the default runLatest. Only a deployment job records deployment history in an environment, and the shorthand `environment.resourceName` (`prod.web01`) targets one resource of the environment."
    fr: "`lockBehavior: sequential` fait obtenir le verrou exclusif par toutes les exécutions l'une après l'autre, au lieu du comportement par défaut runLatest. Seul un travail de déploiement enregistre l'historique de déploiement dans un environnement, et la forme abrégée `environnement.nomRessource` (`prod.web01`) cible une ressource de l'environnement."
  options:
    runlatest: { en: "runLatest lets only the latest run acquire the lock, so older waiting runs never deploy.", fr: "runLatest ne laisse que la dernière exécution obtenir le verrou : les exécutions plus anciennes en attente ne déploient jamais." }
    exclusive: { en: "exclusive isn't a value of lockBehavior.", fr: "exclusive n'est pas une valeur de lockBehavior." }
    job: { en: "A regular job has no environment, deployment history or deployment strategy.", fr: "Un travail ordinaire n'a ni environnement, ni historique de déploiement, ni stratégie de déploiement." }
    template: { en: "template inserts a template file; it isn't a job type.", fr: "template insère un fichier de modèle ; ce n'est pas un type de travail." }
    slash: { en: "The environment and resource names are separated by a dot.", fr: "Les noms de l'environnement et de la ressource sont séparés par un point." }
    reverse: { en: "The environment name comes first, then the resource name.", fr: "Le nom de l'environnement vient en premier, puis celui de la ressource." }
references:
  - title: Define approvals and checks
    url: https://learn.microsoft.com/en-us/azure/devops/pipelines/process/approvals
  - title: Deployment jobs
    url: https://learn.microsoft.com/en-us/azure/devops/pipelines/process/deployment-jobs
