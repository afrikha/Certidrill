id: az400-cs2c-loyalty-flag
objective: "3.4.6"
type: single
caseStudy: az400-cs2c-fourth-coffee
difficulty: 1
status: draft
stem:
  en: |
    order-api reads its feature flags from appcs-fc by using a feature management library. The application identifies each customer and adds the customer to a group named after their home store.

    You need to configure the loyalty feature to meet the requirements. What should you configure in appcs-fc?
  fr: |
    order-api lit ses indicateurs de fonctionnalité dans appcs-fc à l'aide d'une bibliothèque de gestion des fonctionnalités. L'application identifie chaque client et l'ajoute à un groupe portant le nom de son magasin habituel.

    Vous devez configurer la fonctionnalité de fidélité pour respecter les exigences. Que devez-vous configurer dans appcs-fc ?
body:
  options:
    - id: a
      text:
        en: "A feature flag with a time window filter that starts on the launch date of the pilot"
        fr: "Un indicateur de fonctionnalité avec un filtre de fenêtre de temps qui commence à la date de lancement du pilote"
    - id: b
      text:
        en: "A key-value named LoyaltyEnabled, with one label for each of the five pilot stores"
        fr: "Une paire clé-valeur nommée LoyaltyEnabled, avec une étiquette pour chacun des cinq magasins pilotes"
    - id: c
      text:
        en: "A feature flag with a targeting filter: the five store groups at 100 percent, default percentage 10"
        fr: "Un indicateur de fonctionnalité avec un filtre de ciblage : les cinq groupes de magasins à 100 %, pourcentage par défaut de 10"
    - id: d
      text:
        en: "A feature flag with a targeting filter: the five store groups excluded, default percentage 10"
        fr: "Un indicateur de fonctionnalité avec un filtre de ciblage : les cinq groupes de magasins exclus, pourcentage par défaut de 10"
answer: { optionId: c }
explanation:
  correct:
    en: The targeting filter enables a feature for an audience made of users, groups with their own rollout percentage, and a default percentage for everyone else. Including the five store groups at 100 percent and setting the default percentage to 10 meets the requirement, and changing the flag in App Configuration doesn't require a redeployment.
    fr: Le filtre de ciblage active une fonctionnalité pour une audience composée d'utilisateurs, de groupes avec leur propre pourcentage de déploiement et d'un pourcentage par défaut pour tous les autres. Inclure les cinq groupes de magasins à 100 % et définir le pourcentage par défaut à 10 respecte l'exigence, et la modification de l'indicateur dans App Configuration n'impose aucun redéploiement.
  options:
    a: { en: "A time window filter turns the feature on for everyone during a period; it can't target stores or a percentage of customers.", fr: "Un filtre de fenêtre de temps active la fonctionnalité pour tout le monde pendant une période ; il ne peut cibler ni des magasins ni un pourcentage de clients." }
    b: { en: "Labels select configuration values by environment or version; they don't enable a feature for 10 percent of the other customers.", fr: "Les étiquettes sélectionnent des valeurs de configuration par environnement ou par version ; elles n'activent pas une fonctionnalité pour 10 % des autres clients." }
    d: { en: "Excluded groups always have the feature disabled, so the customers of the pilot stores would never get it.", fr: "Les groupes exclus ont toujours la fonctionnalité désactivée : les clients des magasins pilotes ne l'obtiendraient jamais." }
references:
  - title: Roll out features to targeted audiences
    url: https://learn.microsoft.com/en-us/azure/azure-app-configuration/howto-targetingfilter
