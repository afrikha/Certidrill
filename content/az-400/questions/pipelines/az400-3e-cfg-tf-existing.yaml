id: az400-3e-cfg-tf-existing
objective: "3.5.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Tailspin has chosen Terraform to manage its Azure infrastructure. A resource group named **rg-legacy** contains about 60 resources that administrators created manually in the Azure portal over several years.

    You need to bring the existing resources under Terraform management, including Terraform configuration files that describe them. The solution must minimize manual effort.

    What should you use?
  fr: |
    Tailspin a choisi Terraform pour gérer son infrastructure Azure. Un groupe de ressources nommé **rg-legacy** contient environ 60 ressources que les administrateurs ont créées manuellement dans le portail Azure au fil des années.

    Vous devez placer les ressources existantes sous la gestion de Terraform, avec des fichiers de configuration Terraform qui les décrivent. La solution doit réduire au minimum l'effort manuel.

    Que devez-vous utiliser ?
body:
  options:
    - id: a
      text:
        en: "The **Export template** page of the resource group in the Azure portal"
        fr: "La page **Exporter le modèle** du groupe de ressources dans le portail Azure"
    - id: b
      text:
        en: "Azure Export for Terraform"
        fr: "Azure Export for Terraform"
    - id: c
      text:
        en: "A deployment stack created at the scope of rg-legacy"
        fr: "Une pile de déploiement créée à l'étendue de rg-legacy"
    - id: d
      text:
        en: "The `terraform validate` command run against rg-legacy"
        fr: "La commande `terraform validate` exécutée sur rg-legacy"
answer: { optionId: b }
explanation:
  correct:
    en: "Azure Export for Terraform is an open-source tool maintained by Microsoft that takes existing Azure infrastructure under Terraform management. It generates the configuration and the state for the exported resources, so the team doesn't write the HCL and import each resource by hand."
    fr: "Azure Export for Terraform est un outil open source maintenu par Microsoft qui place une infrastructure Azure existante sous la gestion de Terraform. Il génère la configuration et l'état des ressources exportées : l'équipe n'a pas à écrire le HCL ni à importer chaque ressource à la main."
  options:
    a:
      en: "The portal exports an ARM template, which Terraform doesn't use as configuration."
      fr: "Le portail exporte un modèle ARM, que Terraform n'utilise pas comme configuration."
    c:
      en: "A deployment stack manages resources deployed by Bicep or ARM templates; it doesn't produce Terraform files."
      fr: "Une pile de déploiement gère des ressources déployées par Bicep ou des modèles ARM ; elle ne produit pas de fichiers Terraform."
    d:
      en: "`terraform validate` checks existing configuration files; it doesn't create them or import resources."
      fr: "`terraform validate` vérifie des fichiers de configuration existants ; il ne les crée pas et n'importe pas de ressources."
references:
  - title: Comparing Terraform and Bicep
    url: https://learn.microsoft.com/en-us/azure/developer/terraform/comparing-terraform-and-bicep
