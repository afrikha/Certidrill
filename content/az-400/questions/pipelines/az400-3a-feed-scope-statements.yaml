id: az400-3a-feed-scope-statements
objective: "3.1.2"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    Wingtip is designing its Azure Artifacts feeds. The organization contains 15 projects, and the architects are comparing project-scoped and organization-scoped feeds.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Wingtip conçoit ses flux Azure Artifacts. L'organisation contient 15 projets, et les architectes comparent les flux délimités au projet et les flux délimités à l'organisation.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          An organization-scoped feed can later be converted to a project-scoped feed.
        fr: |
          Un flux délimité à l'organisation peut être converti ultérieurement en flux délimité au projet.
    - id: s2
      text:
        en: |
          A single feed can contain both npm packages and NuGet packages.
        fr: |
          Un même flux peut contenir à la fois des packages npm et des packages NuGet.
    - id: s3
      text:
        en: |
          After version 1.3.0 of a package is deleted and purged from the Recycle Bin, version 1.3.0 can be published again to the same feed.
        fr: |
          Après la suppression de la version 1.3.0 d'un package et sa purge de la Corbeille, la version 1.3.0 peut de nouveau être publiée dans le même flux.
answer:
  values: { s1: false, s2: true, s3: false }
explanation:
  correct:
    en: |
      Organization-scoped feeds cannot be converted to project-scoped feeds, which is one reason Microsoft recommends scoping new feeds to a project. A feed is not tied to one package type: it can hold NuGet, npm, Maven, Python, Cargo and Universal Packages side by side. Package versions are immutable, so a published version number stays reserved forever, even after deletion.
    fr: |
      Les flux délimités à l'organisation ne peuvent pas être convertis en flux délimités au projet, ce qui explique en partie que Microsoft recommande de délimiter les nouveaux flux à un projet. Un flux n'est pas lié à un seul type de package : il peut contenir côte à côte des packages NuGet, npm, Maven, Python, Cargo et universels. Les versions de packages sont immuables : un numéro de version publié reste réservé pour toujours, même après suppression.
references:
  - title: Project-scoped vs organization-scoped feeds
    url: https://learn.microsoft.com/en-us/azure/devops/artifacts/feeds/project-scoped-feeds
  - title: Delete and recover packages
    url: https://learn.microsoft.com/en-us/azure/devops/artifacts/how-to/delete-and-recover-packages
