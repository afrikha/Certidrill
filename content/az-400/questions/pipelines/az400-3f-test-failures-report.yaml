id: az400-3f-test-failures-report
objective: "3.6.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso has a YAML pipeline named **orders-ci** in Azure Pipelines. The pipeline runs unit tests with the Visual Studio Test task and publishes the results.

    The QA lead asks for the list of tests that failed most often in orders-ci during the last 14 days, with the failure details of each test. The solution must use the reporting that is built into Azure Pipelines.

    What should you use?
  fr: |
    Contoso dispose d'un pipeline YAML nommé **orders-ci** dans Azure Pipelines. Le pipeline exécute des tests unitaires avec la tâche Visual Studio Test et publie les résultats.

    La responsable QA demande la liste des tests qui ont échoué le plus souvent dans orders-ci au cours des 14 derniers jours, avec les détails des échecs de chaque test. La solution doit utiliser les rapports intégrés à Azure Pipelines.

    Que devez-vous utiliser ?
body:
  options:
    - { id: a, text: { en: "The Pipeline duration report on the Analytics tab of orders-ci", fr: "Le rapport Pipeline duration de l'onglet Analytics d'orders-ci" } }
    - { id: b, text: { en: "The Test failures report on the Analytics tab of orders-ci", fr: "Le rapport Test failures de l'onglet Analytics d'orders-ci" } }
    - { id: c, text: { en: "The Pool consumption report on the Analytics tab of the agent pool", fr: "Le rapport Pool consumption de l'onglet Analytics du pool d'agents" } }
    - { id: d, text: { en: "The Progress report of a test plan in Azure Test Plans", fr: "Le rapport Progress d'un plan de test dans Azure Test Plans" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      The Test failures report of the pipeline Analytics tab lists the top failing tests of the pipeline with their failure details, and it is linked to the Test Analytics page. Like the other pipeline reports, it covers the last 14 days by default.
    fr: |
      Le rapport Test failures de l'onglet Analytics du pipeline liste les tests qui échouent le plus dans le pipeline avec les détails de leurs échecs, et il est lié à la page Test Analytics. Comme les autres rapports de pipeline, il couvre les 14 derniers jours par défaut.
  options:
    a: { en: "The duration report shows how long successful runs take and the longest tasks, not failing tests.", fr: "Le rapport de durée montre la durée des exécutions réussies et les tâches les plus longues, pas les tests en échec." }
    c: { en: "The pool consumption report shows running and queued jobs against the parallel jobs, not test results.", fr: "Le rapport de consommation du pool montre les travaux en cours et en file d'attente par rapport aux travaux parallèles, pas les résultats de tests." }
    d: { en: "A test plan Progress report tracks planned manual testing, not the automated test results published by a pipeline.", fr: "Le rapport Progress d'un plan de test suit les tests manuels planifiés, pas les résultats de tests automatisés publiés par un pipeline." }
references:
  - title: Pipeline reports
    url: https://learn.microsoft.com/en-us/azure/devops/pipelines/reports/pipelinereport
  - title: Test Analytics
    url: https://learn.microsoft.com/en-us/azure/devops/pipelines/test/test-analytics
