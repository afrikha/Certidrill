id: az400-3a-art-promote-order
objective: "3.1.4"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    The YAML pipeline of the library **Contoso.Ledger** sets its run number to a MAJOR.MINOR.PATCH value. The pipeline has a Build stage and a Release stage. The Release stage runs only after an approval on the ledger-release environment.

    You need the pipeline to push to the Azure Artifacts feed the exact package that was built and tested, with the run number as the package version, and only after the approval.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Le pipeline YAML de la bibliothèque **Contoso.Ledger** définit son numéro d'exécution sur une valeur MAJOR.MINOR.PATCH. Le pipeline comporte une phase Build et une phase Release. La phase Release ne s'exécute qu'après une approbation sur l'environnement ledger-release.

    Le pipeline doit envoyer vers le flux Azure Artifacts exactement le package généré et testé, avec le numéro d'exécution comme version du package, et uniquement après l'approbation.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: pack, text: { en: "In the Build stage, run dotnet pack with -p:PackageVersion=$(Build.BuildNumber).", fr: "Dans la phase Build, exécuter dotnet pack avec -p:PackageVersion=$(Build.BuildNumber)." } }
    - { id: pub, text: { en: "In the Build stage, publish the .nupkg file as a pipeline artifact.", fr: "Dans la phase Build, publier le fichier .nupkg en tant qu'artefact de pipeline." } }
    - { id: dl, text: { en: "In the Release stage, download the pipeline artifact.", fr: "Dans la phase Release, télécharger l'artefact de pipeline." } }
    - { id: push, text: { en: "In the Release stage, push the downloaded .nupkg file to the feed.", fr: "Dans la phase Release, envoyer vers le flux le fichier .nupkg téléchargé." } }
    - { id: repack, text: { en: "In the Release stage, run dotnet pack again with the same version.", fr: "Dans la phase Release, exécuter de nouveau dotnet pack avec la même version." } }
    - { id: early, text: { en: "In the Build stage, push the .nupkg file to the feed.", fr: "Dans la phase Build, envoyer le fichier .nupkg vers le flux." } }
answer:
  sequence: [ pack, pub, dl, push ]
explanation:
  correct:
    en: |
      The Build stage packs once with the run number as the version and publishes the package as a pipeline artifact. After the approval, the Release stage downloads that artifact and pushes it, so the feed receives the tested file. Because package versions are immutable, pushing only once, after approval, also avoids reserving version numbers for packages that are never released.
    fr: |
      La phase Build empaquette une seule fois avec le numéro d'exécution comme version et publie le package en tant qu'artefact de pipeline. Après l'approbation, la phase Release télécharge cet artefact et l'envoie : le flux reçoit le fichier testé. Comme les versions de packages sont immuables, un seul envoi après l'approbation évite aussi de réserver des numéros de version pour des packages jamais publiés.
  options:
    repack: { en: "Packing again in the Release stage produces a new file instead of the tested one.", fr: "Réempaqueter dans la phase Release produit un nouveau fichier au lieu du fichier testé." }
    early: { en: "Pushing from the Build stage publishes the package before the approval.", fr: "Envoyer depuis la phase Build publie le package avant l'approbation." }
references:
  - title: Publish and download pipeline artifacts
    url: https://learn.microsoft.com/en-us/azure/devops/pipelines/artifacts/pipeline-artifacts
  - title: Run and build numbers
    url: https://learn.microsoft.com/en-us/azure/devops/pipelines/process/run-number
