id: az400-3e-cs-kv-deploy-action
objective: "3.5.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Litware deploys a Bicep file to a resource group named **rg-app** from Azure Pipelines. The service connection's service principal has a role on rg-app that allows the deployment. The parameters file reads a secret with `az.getSecret()` from a key vault named **kv-shared**, which is in a resource group named **rg-secrets**. The key vault already allows template deployment.

    The deployment fails with an authorization error on kv-shared. You need to fix the deployment. The solution must follow the principle of least privilege.

    What should you assign to the service principal?
  fr: |
    Litware déploie un fichier Bicep vers un groupe de ressources nommé **rg-app** depuis Azure Pipelines. Le principal de service de la connexion de service dispose sur rg-app d'un rôle qui autorise le déploiement. Le fichier de paramètres lit un secret avec `az.getSecret()` dans un coffre de clés nommé **kv-shared**, situé dans un groupe de ressources nommé **rg-secrets**. Le coffre de clés autorise déjà le déploiement de modèles.

    Le déploiement échoue avec une erreur d'autorisation sur kv-shared. Vous devez corriger le déploiement. La solution doit respecter le principe du moindre privilège.

    Que devez-vous attribuer au principal de service ?
body:
  options:
    - { id: a, text: { en: "The Contributor role at the scope of rg-secrets", fr: "Le rôle Contributor à l'étendue de rg-secrets" } }
    - { id: b, text: { en: "A custom role that contains only `Microsoft.KeyVault/vaults/deploy/action`, at the scope of rg-secrets", fr: "Un rôle personnalisé qui contient uniquement `Microsoft.KeyVault/vaults/deploy/action`, à l'étendue de rg-secrets" } }
    - { id: c, text: { en: "The Key Vault Reader role at the scope of kv-shared", fr: "Le rôle Key Vault Reader à l'étendue de kv-shared" } }
    - { id: d, text: { en: "The Key Vault Secrets User role at the scope of kv-shared", fr: "Le rôle Key Vault Secrets User à l'étendue de kv-shared" } }
answer: { optionId: b }
explanation:
  correct:
    en: "The identity that deploys a template referencing a Key Vault secret needs the `Microsoft.KeyVault/vaults/deploy/action` permission. Owner and Contributor include it, but a custom role that contains only this action grants the minimum required."
    fr: "L'identité qui déploie un modèle faisant référence à un secret Key Vault a besoin de l'autorisation `Microsoft.KeyVault/vaults/deploy/action`. Owner et Contributor l'incluent, mais un rôle personnalisé qui ne contient que cette action accorde le strict nécessaire."
  options:
    a:
      en: "Contributor includes the required action, but it also lets the service principal modify every resource of rg-secrets."
      fr: "Contributor inclut l'action requise, mais il permet aussi au principal de service de modifier toutes les ressources de rg-secrets."
    c:
      en: "Key Vault Reader reads vault metadata only and doesn't include the deploy action."
      fr: "Key Vault Reader lit uniquement les métadonnées du coffre et n'inclut pas l'action de déploiement."
    d:
      en: "Key Vault Secrets User grants data-plane read access to secret contents, not the deploy action that Resource Manager checks for template deployments."
      fr: "Key Vault Secrets User accorde la lecture du contenu des secrets sur le plan de données, pas l'action de déploiement que Resource Manager vérifie pour les déploiements de modèles."
references:
  - title: Use Azure Key Vault to pass a secret as a parameter during Bicep deployment
    url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/bicep/key-vault-parameter
