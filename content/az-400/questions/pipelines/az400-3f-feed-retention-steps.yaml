id: az400-3f-feed-retention-steps
objective: "3.6.4"
type: ordering
difficulty: 1
status: draft
stem:
  en: |
    Wingtip Toys has an Azure Artifacts feed named **toys-nuget**. You are a Feed Owner of toys-nuget.

    You need to configure the feed so that each package keeps at most 20 versions, except versions that were downloaded during the last 45 days.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Wingtip Toys dispose d'un flux Azure Artifacts nommé **toys-nuget**. Vous êtes Feed Owner de toys-nuget.

    Vous devez configurer le flux pour que chaque package conserve au plus 20 versions, sauf les versions téléchargées au cours des 45 derniers jours.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: feed, text: { en: "In Artifacts, select toys-nuget.", fr: "Dans Artifacts, sélectionner toys-nuget." } }
    - { id: gear, text: { en: "Select the gear icon to open the feed settings.", fr: "Sélectionner l'icône d'engrenage pour ouvrir les paramètres du flux." } }
    - { id: details, text: { en: "On Feed details, turn on Enable package retention, and set Maximum number of versions per package to 20 and Days to keep recently downloaded packages to 45.", fr: "Dans Feed details, activer Enable package retention, puis définir Maximum number of versions per package sur 20 et Days to keep recently downloaded packages sur 45." } }
    - { id: save, text: { en: "Select Save.", fr: "Sélectionner Save." } }
    - { id: project, text: { en: "Open Project settings > Pipelines > Settings.", fr: "Ouvrir Paramètres du projet > Pipelines > Paramètres." } }
    - { id: recycle, text: { en: "Open the Recycle Bin of toys-nuget.", fr: "Ouvrir la Corbeille de toys-nuget." } }
answer:
  sequence: [ feed, gear, details, save ]
explanation:
  correct:
    en: |
      Package retention is a feed setting that a Feed Owner configures from the gear icon of the feed, on Feed details. A version is deleted only when the package reaches the maximum number of versions and the version was not downloaded within the number of days, and the cleanup job runs once a day.
    fr: |
      La rétention des packages est un paramètre du flux qu'un Feed Owner configure depuis l'icône d'engrenage du flux, dans Feed details. Une version n'est supprimée que si le package atteint le nombre maximal de versions et que la version n'a pas été téléchargée pendant le nombre de jours indiqué, et le travail de nettoyage s'exécute une fois par jour.
  options:
    project: { en: "Pipeline retention settings do not govern packages in Azure Artifacts feeds.", fr: "Les paramètres de rétention des pipelines ne régissent pas les packages des flux Azure Artifacts." }
    recycle: { en: "The Recycle Bin restores or permanently deletes packages; it holds no retention settings.", fr: "La Corbeille restaure ou supprime définitivement des packages ; elle ne contient aucun paramètre de rétention." }
references:
  - title: Delete and recover packages
    url: https://learn.microsoft.com/en-us/azure/devops/artifacts/how-to/delete-and-recover-packages
