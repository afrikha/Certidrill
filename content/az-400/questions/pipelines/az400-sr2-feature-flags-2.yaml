id: az400-sr2-feature-flags-2
objective: "3.4.6"
type: series_yesno
series: az400-sr2-feature-flags
seriesOrder: 2
difficulty: 1
status: draft
stem:
  en: You create the NewCheckout feature flag with a targeting filter.
  fr: Vous créez l'indicateur de fonctionnalité NewCheckout avec un filtre de ciblage.
body:
  solution:
    en: |
      In the Feature manager of appcs-shop, you create an enabled feature flag named **NewCheckout**. In **Rollout** > **Audience**, you set **Default Percentage** to `0` and, under **Override by Groups**, you include the **BetaTesters** group with a percentage of `100`.
    fr: |
      Dans le Gestionnaire de fonctionnalités d'appcs-shop, vous créez un indicateur de fonctionnalité activé nommé **NewCheckout**. Dans **Rollout** > **Audience**, vous définissez **Default Percentage** sur `0` et, sous **Override by Groups**, vous incluez le groupe **BetaTesters** avec un pourcentage de `100`.
answer: { value: true }
explanation:
  correct:
    en: The targeting filter enables a feature for an audience made of users, groups and a default percentage of the user base. With BetaTesters at 100 % and the default at 0 %, only that group sees NewCheckout, and ShopWeb reloads feature flags from App Configuration at the refresh interval (30 seconds by default), so the product owner can widen the audience later without a restart.
    fr: Le filtre de ciblage active une fonctionnalité pour un public composé d'utilisateurs, de groupes et d'un pourcentage par défaut de la base d'utilisateurs. Avec BetaTesters à 100 % et le pourcentage par défaut à 0 %, seul ce groupe voit NewCheckout, et ShopWeb recharge les indicateurs de fonctionnalité depuis App Configuration à l'intervalle d'actualisation (30 secondes par défaut) ; le product owner peut donc élargir le public plus tard sans redémarrage.
references:
  - title: Roll Out Features to Targeted Audiences - Azure App Configuration
    url: https://learn.microsoft.com/en-us/azure/azure-app-configuration/howto-targetingfilter
  - title: Quickstart for adding feature flags to ASP.NET Core apps - Azure App Configuration
    url: https://learn.microsoft.com/en-us/azure/azure-app-configuration/quickstart-feature-flag-aspnet-core
