id: az400-3d-vmss-rolling-policy
objective: "3.4.3"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    Litware has a Virtual Machine Scale Set with Uniform orchestration that hosts an API behind a load balancer. The scale set uses the Application Health extension. A pipeline updates the image reference in the scale set model for each release.

    You need to configure the upgrade policy to meet the following requirements:

    - When the model changes, the instances must be upgraded automatically in batches of 25 percent of the instances.
    - The upgrade must be canceled if more than 10 percent of the upgraded instances become unhealthy.

    How should you complete the JSON? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware dispose d'un groupe de machines virtuelles identiques en orchestration Uniform qui héberge une API derrière un équilibreur de charge. Le groupe identique utilise l'extension Application Health. Un pipeline met à jour la référence d'image dans le modèle du groupe identique à chaque mise en production.

    Vous devez configurer la stratégie de mise à niveau pour respecter les exigences suivantes :

    - Quand le modèle change, les instances doivent être mises à niveau automatiquement par lots de 25 pour cent des instances.
    - La mise à niveau doit être annulée si plus de 10 pour cent des instances mises à niveau deviennent défectueuses.

    Comment devez-vous compléter le JSON ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: json
  template: |
    "upgradePolicy": {
      "mode": "[[mode]]",
      "rollingUpgradePolicy": {
        "[[batch]]": 25,
        "[[health]]": 10,
        "pauseTimeBetweenBatches": "PT30S"
      }
    }
  slots:
    - id: mode
      options:
        - { id: mAutomatic, text: Automatic }
        - { id: mManual, text: Manual }
        - { id: mRolling, text: Rolling }
    - id: batch
      options:
        - { id: bBatch, text: maxBatchInstancePercent }
        - { id: bUnhealthy, text: maxUnhealthyInstancePercent }
        - { id: bUpgraded, text: maxUnhealthyUpgradedInstancePercent }
    - id: health
      options:
        - { id: hBatch, text: maxBatchInstancePercent }
        - { id: hUnhealthy, text: maxUnhealthyInstancePercent }
        - { id: hUpgraded, text: maxUnhealthyUpgradedInstancePercent }
answer:
  values: { mode: mRolling, batch: bBatch, health: hUpgraded }
explanation:
  correct:
    en: |
      The Rolling mode upgrades the instances in batches when the model changes, and it relies on the health probe or the Application Health extension. `maxBatchInstancePercent` sets the share of instances upgraded at once. `maxUnhealthyUpgradedInstancePercent` is the share of upgraded instances that may be unhealthy before the upgrade is canceled.
    fr: |
      Le mode Rolling met à niveau les instances par lots quand le modèle change, et il s'appuie sur la sonde d'intégrité ou sur l'extension Application Health. `maxBatchInstancePercent` définit la part d'instances mises à niveau à la fois. `maxUnhealthyUpgradedInstancePercent` est la part d'instances mises à niveau qui peuvent être défectueuses avant l'annulation de la mise à niveau.
  options:
    mAutomatic: { en: "Automatic mode doesn't upgrade the instances in controlled batches with these health thresholds.", fr: "Le mode Automatic ne met pas à niveau les instances par lots contrôlés avec ces seuils d'intégrité." }
    mManual: { en: "Manual mode leaves existing instances on the old model until you upgrade them yourself.", fr: "Le mode Manual laisse les instances existantes sur l'ancien modèle jusqu'à ce que vous les mettiez à niveau vous-même." }
    hUnhealthy: { en: "maxUnhealthyInstancePercent counts all the instances of the scale set, before and during the upgrade, not only the upgraded ones.", fr: "maxUnhealthyInstancePercent compte toutes les instances du groupe identique, avant et pendant la mise à niveau, pas seulement les instances mises à niveau." }
references:
  - title: Configure rolling upgrades on Virtual Machine Scale Sets
    url: https://learn.microsoft.com/en-us/azure/virtual-machine-scale-sets/virtual-machine-scale-sets-configure-rolling-upgrades
