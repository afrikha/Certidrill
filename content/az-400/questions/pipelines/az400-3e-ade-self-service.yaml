id: az400-3e-ade-self-service
objective: "3.5.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso's developers regularly need short-lived test environments that contain an App Service web app and an Azure SQL database. The platform team wants developers to create these environments themselves, only from infrastructure templates that the platform team approves, in a subscription where the developers have no role assignment.

    What should you recommend?
  fr: |
    Les développeurs de Contoso ont régulièrement besoin d'environnements de test de courte durée contenant une application web App Service et une base de données Azure SQL. L'équipe plateforme veut que les développeurs créent eux-mêmes ces environnements, uniquement à partir de modèles d'infrastructure qu'elle approuve, dans un abonnement où les développeurs n'ont aucune attribution de rôle.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: Microsoft Dev Box }
    - { id: b, text: { en: "Template specs shared with the Template Spec Reader role", fr: "Des spécifications de modèle partagées avec le rôle Template Spec Reader" } }
    - { id: c, text: { en: "A private Bicep module registry in Azure Container Registry", fr: "Un registre de modules Bicep privé dans Azure Container Registry" } }
    - { id: d, text: Azure Deployment Environments }
answer: { optionId: d }
explanation:
  correct:
    en: "Deployment Environments lets developers create environments on demand from environment definitions in a catalog curated by platform engineers. The deployment runs under the managed identity configured on the project environment type, so developers don't need permissions on the target subscription."
    fr: "Deployment Environments permet aux développeurs de créer des environnements à la demande à partir de définitions d'environnement figurant dans un catalogue organisé par les ingénieurs plateforme. Le déploiement s'exécute sous l'identité managée configurée sur le type d'environnement de projet : les développeurs n'ont pas besoin d'autorisations sur l'abonnement cible."
  options:
    a:
      en: "Dev Box provides cloud developer workstations, not application infrastructure created from templates."
      fr: "Dev Box fournit des postes de travail de développement dans le cloud, pas une infrastructure applicative créée à partir de modèles."
    b:
      en: "Template Spec Reader lets users read the template, but deploying it still requires deployment permissions on the target subscription."
      fr: "Template Spec Reader permet de lire le modèle, mais son déploiement exige toujours des autorisations de déploiement sur l'abonnement cible."
    c:
      en: "A module registry shares reusable modules; the developers would still deploy with their own permissions on the subscription."
      fr: "Un registre de modules partage des modules réutilisables ; les développeurs déploieraient toujours avec leurs propres autorisations sur l'abonnement."
references:
  - title: What is Azure Deployment Environments?
    url: https://learn.microsoft.com/en-us/azure/deployment-environments/overview-what-is-azure-deployment-environments
  - title: Key concepts for Azure Deployment Environments
    url: https://learn.microsoft.com/en-us/azure/deployment-environments/concept-environments-key-concepts
