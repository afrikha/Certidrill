id: az400-3c-strategy-facts
objective: "3.4.1"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    Litware is comparing deployment strategies for its customer portal.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware compare des stratégies de déploiement pour son portail client.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          A blue-green deployment needs enough capacity to run two complete production environments at the time of the switch.
        fr: |
          Un déploiement bleu/vert exige une capacité suffisante pour exécuter deux environnements de production complets au moment de la bascule.
    - id: s2
      text:
        en: |
          Turning off a feature flag removes a faulty feature from users without redeploying the application.
        fr: |
          La désactivation d'un indicateur de fonctionnalité retire une fonctionnalité défaillante aux utilisateurs sans redéployer l'application.
    - id: s3
      text:
        en: |
          In a canary release, all users are moved to the new version at the same moment.
        fr: |
          Dans une mise en production canari, tous les utilisateurs passent à la nouvelle version au même moment.
answer:
  values: { s1: true, s2: true, s3: false }
explanation:
  correct:
    en: |
      In a blue-green deployment, both pools must be able to handle the full production load, so the capacity is doubled while both exist. A feature flag acts as a kill switch that disables the feature at runtime. A canary sends the new version to a small group first and widens the audience step by step while monitoring health.
    fr: |
      Dans un déploiement bleu/vert, les deux pools doivent pouvoir absorber toute la charge de production : la capacité est doublée tant que les deux existent. Un indicateur de fonctionnalité sert de coupe-circuit qui désactive la fonctionnalité à l'exécution. Un canari envoie d'abord la nouvelle version à un petit groupe et élargit l'audience par étapes en surveillant l'intégrité.
references:
  - title: Architecture strategies for safe deployment practices
    url: https://learn.microsoft.com/en-us/azure/well-architected/operational-excellence/safe-deployments
