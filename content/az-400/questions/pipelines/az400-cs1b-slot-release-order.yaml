id: az400-cs1b-slot-release-order
objective: "3.4.3"
type: ordering
caseStudy: az400-cs1b-humongous-insurance
difficulty: 2
status: draft
stem:
  en: |
    You are writing the deployment job of the claims-prod stage. The build pipeline has produced the web package and the DACPAC file of a new version.

    You need to meet the deployment requirements.

    Which four actions should the job perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Vous écrivez le travail de déploiement de la phase claims-prod. Le pipeline de build a produit le package web et le fichier DACPAC d'une nouvelle version.

    Vous devez satisfaire les exigences de déploiement.

    Quelles sont les quatre actions que le travail doit effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: stop, text: { en: "Stop the production slot of app-claims-prod.", fr: "Arrêter l'emplacement de production d'app-claims-prod." } }
    - { id: dacpac, text: { en: "Deploy the DACPAC file to sqldb-claims.", fr: "Déployer le fichier DACPAC sur sqldb-claims." } }
    - { id: staging, text: { en: "Deploy the web package to the staging slot.", fr: "Déployer le package web sur l'emplacement staging." } }
    - { id: prod, text: { en: "Deploy the web package to the production slot.", fr: "Déployer le package web sur l'emplacement de production." } }
    - { id: smoke, text: { en: "Run the smoke tests against the URL of the staging slot.", fr: "Exécuter les tests de fumée sur l'URL de l'emplacement staging." } }
    - { id: swap, text: { en: "Swap the staging slot with the production slot.", fr: "Échanger l'emplacement staging avec l'emplacement de production." } }
answer:
  sequence: [ dacpac, staging, smoke, swap ]
explanation:
  correct:
    en: |
      The schema change is backward compatible, so the current production version keeps working after the DACPAC deployment, and the new version needs the updated schema to start. The package then goes to the staging slot, where the smoke tests run before any production traffic reaches it. The swap warms up the staging instances and switches the routing only when they are ready, so production has no downtime.
    fr: |
      La modification de schéma est rétrocompatible : la version de production actuelle continue de fonctionner après le déploiement du DACPAC, et la nouvelle version a besoin du schéma à jour pour démarrer. Le package est ensuite déployé sur l'emplacement staging, où les tests de fumée s'exécutent avant que le trafic de production ne l'atteigne. L'échange préchauffe les instances de staging et ne bascule le routage que lorsqu'elles sont prêtes : la production ne subit aucune interruption.
  options:
    stop: { en: "Stopping the production slot causes downtime.", fr: "Arrêter l'emplacement de production provoque une interruption de service." }
    prod: { en: "Deploying directly to production skips the smoke tests and restarts the production app.", fr: "Déployer directement en production contourne les tests de fumée et redémarre l'application de production." }
references:
  - title: Set up staging environments in Azure App Service
    url: https://learn.microsoft.com/en-us/azure/app-service/deploy-staging-slots
  - title: Azure SQL database deployment
    url: https://learn.microsoft.com/en-us/azure/devops/pipelines/targets/azure-sqldb
