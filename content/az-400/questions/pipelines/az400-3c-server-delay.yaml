id: az400-3c-server-delay
objective: "3.3.7"
type: single
difficulty: 1
status: draft
stem:
  en: |
    In a YAML pipeline at Tailspin, stage **Canary** deploys a new version to a small part of the production servers. The next stage must start two hours after Canary ends, so that the team can watch the telemetry. During the wait, the pipeline must not hold an agent or consume a parallel job.

    What should you add at the end of stage Canary?
  fr: |
    Dans un pipeline YAML de Tailspin, la phase **Canary** déploie une nouvelle version sur une petite partie des serveurs de production. La phase suivante doit démarrer deux heures après la fin de Canary, afin que l'équipe puisse observer la télémétrie. Pendant l'attente, le pipeline ne doit pas occuper d'agent ni consommer de travail parallèle.

    Que devez-vous ajouter à la fin de la phase Canary ?
body:
  options:
    - { id: a, text: { en: "An agentless job (`pool: server`) that runs `Delay@1` with `delayForMinutes: '120'`, with a job timeout above 120 minutes", fr: "Un travail sans agent (`pool: server`) qui exécute `Delay@1` avec `delayForMinutes: '120'`, avec un délai d'expiration du travail supérieur à 120 minutes" } }
    - { id: b, text: { en: "An agent job on a self-hosted agent that runs `sleep 7200`, with a job timeout above 120 minutes", fr: "Un travail d'agent sur un agent auto-hébergé qui exécute `sleep 7200`, avec un délai d'expiration du travail supérieur à 120 minutes" } }
    - { id: c, text: { en: "An agent job on a Microsoft-hosted agent that runs `Delay@1` with `delayForMinutes: '120'`", fr: "Un travail d'agent sur un agent hébergé par Microsoft qui exécute `Delay@1` avec `delayForMinutes: '120'`" } }
    - { id: d, text: { en: "A Business hours check on the environment used by the next stage", fr: "Une vérification Business hours sur l'environnement utilisé par la phase suivante" } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      The Delay task runs only in an agentless (server) job, which uses no agent and no parallel job. Agentless jobs time out after 60 minutes by default, so the job timeout must be set above the 120-minute delay.
    fr: |
      La tâche Delay ne s'exécute que dans un travail sans agent (serveur), qui n'utilise ni agent ni travail parallèle. Les travaux sans agent expirent par défaut au bout de 60 minutes : le délai d'expiration du travail doit donc dépasser le délai de 120 minutes.
  options:
    b: { en: "The sleeping job holds an agent and a parallel job for two hours.", fr: "Le travail en veille occupe un agent et un travail parallèle pendant deux heures." }
    c: { en: "Delay is a server task; it can't run in an agent job.", fr: "Delay est une tâche serveur ; elle ne peut pas s'exécuter dans un travail d'agent." }
    d: { en: "Business hours waits for a time window, not for a fixed delay after the previous stage.", fr: "Business hours attend une plage horaire, pas un délai fixe après la phase précédente." }
references:
  - title: Delay@1 - Delay v1 task
    url: https://learn.microsoft.com/en-us/azure/devops/pipelines/tasks/reference/delay-v1
  - title: Specify jobs in your pipeline
    url: https://learn.microsoft.com/en-us/azure/devops/pipelines/process/phases
