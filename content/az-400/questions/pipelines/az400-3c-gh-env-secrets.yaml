id: az400-3c-gh-env-secrets
objective: "3.3.9"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    Woodgrove configured a GitHub environment named **production** with a required reviewer, an environment secret named **PROD_API_KEY** and an environment variable named **DEPLOY_REGION**. Job deploy must wait for the protection rules of production and use both values.

    How should you complete the workflow? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove a configuré un environnement GitHub nommé **production** avec un réviseur obligatoire, un secret d'environnement nommé **PROD_API_KEY** et une variable d'environnement nommée **DEPLOY_REGION**. Le job deploy doit attendre les règles de protection de production et utiliser les deux valeurs.

    Comment devez-vous compléter le workflow ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: yaml
  template: |
    jobs:
      deploy:
        runs-on: ubuntu-latest
        [[s1]]:
          name: production
          url: https://shop.woodgrove.com
        steps:
        - run: ./deploy.sh
          env:
            API_KEY: ${{ [[s2]].PROD_API_KEY }}
            REGION: ${{ [[s3]].DEPLOY_REGION }}
  slots:
    - id: s1
      options:
        - { id: environment, text: environment }
        - { id: concurrency, text: concurrency }
        - { id: deployment, text: deployment }
    - id: s2
      options:
        - { id: secrets, text: secrets }
        - { id: vars2, text: vars }
        - { id: env2, text: env }
    - id: s3
      options:
        - { id: vars, text: vars }
        - { id: secrets3, text: secrets }
        - { id: env3, text: env }
answer:
  values: { s1: environment, s2: secrets, s3: vars }
explanation:
  correct:
    en: |
      The `environment` key of the job makes it wait for the deployment protection rules of production and gives it access to the environment's secrets and variables. Secrets are read through the `secrets` context, and environment variables (configuration variables) through the `vars` context.
    fr: |
      La clé `environment` du job le fait attendre les règles de protection de déploiement de production et lui donne accès aux secrets et aux variables de l'environnement. Les secrets se lisent via le contexte `secrets`, et les variables d'environnement (variables de configuration) via le contexte `vars`.
  options:
    concurrency: { en: "concurrency serializes runs; it doesn't apply protection rules or expose environment secrets.", fr: "concurrency sérialise les exécutions ; il n'applique pas de règles de protection et n'expose pas les secrets d'environnement." }
    deployment: { en: "deployment isn't a job-level key in GitHub Actions; it's a property inside environment.", fr: "deployment n'est pas une clé de niveau job dans GitHub Actions ; c'est une propriété à l'intérieur d'environment." }
    vars2: { en: "Secrets aren't available in the vars context.", fr: "Les secrets ne sont pas disponibles dans le contexte vars." }
    env2: { en: "The env context holds variables set with env in the workflow, not environment secrets.", fr: "Le contexte env contient les variables définies avec env dans le workflow, pas les secrets d'environnement." }
    secrets3: { en: "DEPLOY_REGION is a variable, not a secret.", fr: "DEPLOY_REGION est une variable, pas un secret." }
    env3: { en: "Variables of a GitHub environment are accessible only through the vars context.", fr: "Les variables d'un environnement GitHub ne sont accessibles que via le contexte vars." }
references:
  - title: Deployments and environments
    url: https://docs.github.com/en/actions/reference/workflows-and-actions/deployments-and-environments
  - title: Control deployments with GitHub environments
    url: https://learn.microsoft.com/en-us/training/modules/deploy-model-github-actions/4-control-deployments-github-environments
