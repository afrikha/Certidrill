id: az400-3c-test-slicing
objective: "3.3.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A job named **UITests** in an Azure Pipelines YAML pipeline runs 3,000 UI tests in about two hours on one agent. You need to run the same job on four agents at the same time, each agent running about a quarter of the tests. The test script already selects its share of the tests by reading `System.JobPositionInPhase` and `System.TotalJobsInPhase`. The organization has enough parallel jobs.

    What should you add to the job?
  fr: |
    Un travail nommé **UITests** d'un pipeline YAML Azure Pipelines exécute 3 000 tests d'interface utilisateur en deux heures environ sur un agent. Vous devez exécuter le même travail sur quatre agents en même temps, chaque agent exécutant environ un quart des tests. Le script de test sélectionne déjà sa part des tests en lisant `System.JobPositionInPhase` et `System.TotalJobsInPhase`. L'organisation dispose d'assez de travaux parallèles.

    Que devez-vous ajouter au travail ?
body:
  options:
    - { id: a, text: { en: "`strategy: parallel: 4`", fr: "`strategy: parallel: 4`" } }
    - { id: b, text: { en: "Three copies of the job, each with `dependsOn` set to the previous copy", fr: "Trois copies du travail, chacune avec `dependsOn` défini sur la copie précédente" } }
    - { id: c, text: { en: "`runOnlyImpactedTests: true` on the Visual Studio Test task", fr: "`runOnlyImpactedTests: true` sur la tâche Visual Studio Test" } }
    - { id: d, text: { en: "`strategy: maxParallel: 4` with no other strategy keyword", fr: "`strategy: maxParallel: 4` sans autre mot clé de stratégie" } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      The `parallel` strategy duplicates a job the given number of times. Each copy receives `System.JobPositionInPhase` and `System.TotalJobsInPhase`, which the test script uses to pick its slice of the tests.
    fr: |
      La stratégie `parallel` duplique un travail le nombre de fois indiqué. Chaque copie reçoit `System.JobPositionInPhase` et `System.TotalJobsInPhase`, que le script de test utilise pour choisir sa tranche de tests.
  options:
    d: { en: "maxParallel only limits the legs of a matrix; on its own it doesn't create copies of the job.", fr: "maxParallel ne fait que limiter les branches d'une matrice ; seul, il ne crée pas de copies du travail." }
    b: { en: "Chained jobs run one after another, so the total duration doesn't decrease.", fr: "Des travaux chaînés s'exécutent l'un après l'autre : la durée totale ne diminue pas." }
    c: { en: "Test impact analysis runs fewer tests on one agent; it doesn't spread the tests over four agents.", fr: "L'analyse d'impact des tests exécute moins de tests sur un agent ; elle ne répartit pas les tests sur quatre agents." }
references:
  - title: Specify jobs in your pipeline
    url: https://learn.microsoft.com/en-us/azure/devops/pipelines/process/phases
