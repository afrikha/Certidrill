id: az400-3b-agent-mdp-network
objective: "3.3.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Litware's Azure Pipelines deploy to Azure SQL databases and storage accounts that are reachable only through private endpoints in a virtual network named **VNet-Hub** in West Europe. The jobs need the same tools as the Microsoft-hosted Ubuntu images.

    The number of agents must scale with the queue, and the DevOps team must not manage virtual machines, scale sets or images.

    What should you use?
  fr: |
    Les pipelines Azure Pipelines de Litware déploient sur des bases de données Azure SQL et des comptes de stockage accessibles uniquement par des points de terminaison privés dans un réseau virtuel nommé **VNet-Hub** situé en West Europe. Les travaux ont besoin des mêmes outils que les images Ubuntu hébergées par Microsoft.

    Le nombre d'agents doit s'adapter à la file d'attente, et l'équipe DevOps ne doit gérer ni machines virtuelles, ni groupes identiques, ni images.

    Que devez-vous utiliser ?
body:
  options:
    - { id: a, text: { en: "Microsoft-hosted agents that use the ubuntu-latest image", fr: "Des agents hébergés par Microsoft qui utilisent l'image ubuntu-latest" } }
    - { id: b, text: { en: "Azure Virtual Machine Scale Set agents deployed in a subnet of VNet-Hub", fr: "Des agents Azure Virtual Machine Scale Set déployés dans un sous-réseau de VNet-Hub" } }
    - { id: c, text: { en: "A Managed DevOps Pool in West Europe whose agents are injected into a subnet of VNet-Hub", fr: "Un Managed DevOps Pool en West Europe dont les agents sont injectés dans un sous-réseau de VNet-Hub" } }
    - { id: d, text: { en: "Self-hosted agents installed on Azure virtual machines in VNet-Hub", fr: "Des agents auto-hébergés installés sur des machines virtuelles Azure dans VNet-Hub" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Managed DevOps Pools is a managed service: the agent VMs run in a Microsoft-owned subscription, scale with demand and can use the same images as Microsoft-hosted agents. Agents can be injected into your own virtual network by delegating a subnet to Microsoft.DevOpsInfrastructure/pools, in the same region as the pool, so they reach the private endpoints.
    fr: |
      Managed DevOps Pools est un service managé : les machines virtuelles des agents s'exécutent dans un abonnement appartenant à Microsoft, s'adaptent à la demande et peuvent utiliser les mêmes images que les agents hébergés par Microsoft. Les agents peuvent être injectés dans votre propre réseau virtuel en déléguant un sous-réseau à Microsoft.DevOpsInfrastructure/pools, dans la même région que le pool : ils atteignent ainsi les points de terminaison privés.
  options:
    a: { en: "Microsoft-hosted agents have no private connectivity to your virtual networks.", fr: "Les agents hébergés par Microsoft n'ont aucune connectivité privée vers vos réseaux virtuels." }
    b: { en: "Scale set agents run in your subscription: you manage the scale set and its image.", fr: "Les agents de groupe identique s'exécutent dans votre abonnement : vous gérez le groupe identique et son image." }
    d: { en: "Self-hosted VMs must be created, patched and scaled by the team.", fr: "Les machines virtuelles auto-hébergées doivent être créées, mises à jour et mises à l'échelle par l'équipe." }
references:
  - title: Overview of Managed DevOps Pools
    url: https://learn.microsoft.com/en-us/azure/devops/managed-devops-pools/overview
  - title: Configure networking
    url: https://learn.microsoft.com/en-us/azure/devops/managed-devops-pools/configure-networking
