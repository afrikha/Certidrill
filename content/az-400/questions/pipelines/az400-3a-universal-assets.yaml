id: az400-3a-universal-assets
objective: "3.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Tailspin uses Azure DevOps. The firmware team produces a 40 GB set of binary device images for each release. Pipelines in four Azure DevOps projects must download a specific version of the image set.

    You need to recommend how to store the image sets. The solution must meet the following requirements:

    - Each image set has a version number.
    - Image sets remain available for years, independently of pipeline run retention.

    What should you recommend?
  fr: |
    Tailspin utilise Azure DevOps. L'équipe firmware produit à chaque version un ensemble de 40 Go d'images binaires d'appareils. Des pipelines de quatre projets Azure DevOps doivent télécharger une version précise de cet ensemble d'images.

    Vous devez recommander comment stocker les ensembles d'images. La solution doit répondre aux exigences suivantes :

    - Chaque ensemble d'images a un numéro de version.
    - Les ensembles d'images restent disponibles pendant des années, indépendamment de la rétention des exécutions de pipeline.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "Publish the images as pipeline artifacts of the firmware pipeline", fr: "Publier les images en tant qu'artefacts de pipeline du pipeline firmware" } }
    - { id: b, text: { en: "Publish the images as a NuGet package in an Azure Artifacts feed", fr: "Publier les images sous forme de package NuGet dans un flux Azure Artifacts" } }
    - { id: c, text: { en: "Publish the images as a Universal Package in an Azure Artifacts feed", fr: "Publier les images sous forme de package universel dans un flux Azure Artifacts" } }
    - { id: d, text: { en: "Commit the images to an Azure Repos repository that uses Git LFS", fr: "Valider les images dans un dépôt Azure Repos qui utilise Git LFS" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Universal Packages store any set of files under a name and a version in an Azure Artifacts feed, up to 4 TiB per package. They do not depend on a pipeline run, and pipelines in other projects can download an exact version when they have access to the feed.
    fr: |
      Les packages universels stockent n'importe quel ensemble de fichiers sous un nom et une version dans un flux Azure Artifacts, jusqu'à 4 Tio par package. Ils ne dépendent d'aucune exécution de pipeline, et des pipelines d'autres projets peuvent en télécharger une version exacte dès qu'ils ont accès au flux.
  options:
    a: { en: "Pipeline artifacts follow the retention of their run: deleting the run deletes its artifacts.", fr: "Les artefacts de pipeline suivent la rétention de leur exécution : supprimer l'exécution supprime ses artefacts." }
    b: { en: "NuGet packages are meant for .NET libraries consumed by projects, not for large sets of binary files.", fr: "Les packages NuGet sont destinés aux bibliothèques .NET consommées par des projets, pas à de grands ensembles de fichiers binaires." }
    d: { en: "Git LFS keeps large files with source history; it gives no package version and every clone of a release must fetch tens of gigabytes through Git.", fr: "Git LFS conserve de gros fichiers dans l'historique du code ; il ne fournit pas de version de package et chaque récupération d'une version doit télécharger des dizaines de gigaoctets via Git." }
references:
  - title: Publish Universal Packages in Azure Artifacts
    url: https://learn.microsoft.com/en-us/azure/devops/artifacts/quickstarts/universal-packages
  - title: Publish and download pipeline artifacts
    url: https://learn.microsoft.com/en-us/azure/devops/pipelines/artifacts/pipeline-artifacts
