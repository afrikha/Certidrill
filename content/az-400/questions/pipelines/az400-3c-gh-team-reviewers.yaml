id: az400-3c-gh-team-reviewers
objective: "3.3.9"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam's GitHub organization uses the GitHub Team plan. A private repository contains a workflow whose job **release** references the environment **production**. In the settings of the production environment, the required reviewers rule can't be enabled.

    You need a designated person to approve each run of job release before it accesses the production secrets. The repository must remain private.

    What should you do?
  fr: |
    L'organisation GitHub de Fabrikam utilise le plan GitHub Team. Un dépôt privé contient un workflow dont le job **release** référence l'environnement **production**. Dans les paramètres de l'environnement production, la règle des réviseurs obligatoires ne peut pas être activée.

    Vous devez faire approuver chaque exécution du job release par une personne désignée avant qu'il accède aux secrets de production. Le dépôt doit rester privé.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Upgrade the organization to GitHub Enterprise Cloud.", fr: "Passer l'organisation à GitHub Enterprise Cloud." } }
    - { id: b, text: { en: "Add a wait timer to the production environment.", fr: "Ajouter un minuteur d'attente à l'environnement production." } }
    - { id: c, text: { en: "Add a branch protection rule on main that requires an approving pull request review.", fr: "Ajouter sur main une règle de protection de branche qui exige une revue de pull request approuvée." } }
    - { id: d, text: { en: "Add a CODEOWNERS file that assigns the workflow files to the designated person.", fr: "Ajouter un fichier CODEOWNERS qui attribue les fichiers de workflow à la personne désignée." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      On the Free, Pro and Team plans, required reviewers and wait timers are available only for public repositories. For a private repository, the organization needs GitHub Enterprise; then a required reviewer must approve the job before it runs or reads the environment secrets.
    fr: |
      Sur les plans Free, Pro et Team, les réviseurs obligatoires et les minuteurs d'attente ne sont disponibles que pour les dépôts publics. Pour un dépôt privé, l'organisation a besoin de GitHub Enterprise ; un réviseur obligatoire doit alors approuver le job avant qu'il s'exécute ou lise les secrets d'environnement.
  options:
    c: { en: "A pull request review approves code changes, not each run of the deployment job.", fr: "Une revue de pull request approuve des modifications de code, pas chaque exécution du job de déploiement." }
    b: { en: "A wait timer only delays the job and, like required reviewers, isn't available for private repositories on the Team plan.", fr: "Un minuteur d'attente ne fait que retarder le job et, comme les réviseurs obligatoires, n'est pas disponible pour les dépôts privés sur le plan Team." }
    d: { en: "CODEOWNERS requests reviews on pull requests; it doesn't gate workflow jobs.", fr: "CODEOWNERS demande des revues sur les pull requests ; il ne conditionne pas les jobs de workflow." }
references:
  - title: Deployments and environments
    url: https://docs.github.com/en/actions/reference/workflows-and-actions/deployments-and-environments
  - title: Control deployments with GitHub environments
    url: https://learn.microsoft.com/en-us/training/modules/deploy-model-github-actions/4-control-deployments-github-environments
