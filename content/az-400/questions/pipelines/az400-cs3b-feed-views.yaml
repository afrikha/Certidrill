id: az400-cs3b-feed-views
objective: "3.1.2"
type: dragdrop
caseStudy: az400-cs3b-proseware-games
difficulty: 2
status: draft
stem:
  en: |
    You need to configure Azure Artifacts to meet the package requirements 7 and 8.

    Which action should you perform for each goal? To answer, drag the appropriate actions to the correct goals. Each action may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez configurer Azure Artifacts pour satisfaire les exigences de packages 7 et 8.

    Quelle action devez-vous effectuer pour chaque objectif ? Pour répondre, faites glisser les actions appropriées vers les objectifs correspondants. Chaque action peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: promote, text: { en: "Promote each validated package version to the @Release view of EngineTools.", fr: "Promouvoir chaque version de package validée vers la vue @Release d'EngineTools." } }
    - { id: consume, text: { en: "Connect the game projects to the @Release view of EngineTools instead of the feed.", fr: "Connecter les projets de jeu à la vue @Release d'EngineTools au lieu du flux." } }
    - { id: upstream, text: { en: "Add nuget.org as an upstream source of EngineTools and restore the engine builds from EngineTools only.", fr: "Ajouter nuget.org comme source en amont d'EngineTools et restaurer les builds du moteur uniquement depuis EngineTools." } }
    - { id: publish, text: { en: "Publish each validated package version directly to the @Release view of EngineTools.", fr: "Publier chaque version de package validée directement dans la vue @Release d'EngineTools." } }
    - { id: second, text: { en: "Add nuget.org as a second package source next to EngineTools in the nuget.config of the engine builds.", fr: "Ajouter nuget.org comme deuxième source de packages à côté d'EngineTools dans le nuget.config des builds du moteur." } }
  targets:
    - { id: mark, text: { en: "The QA team marks a package version as validated.", fr: "L'équipe QA marque une version de package comme validée." } }
    - { id: game, text: { en: "The game projects see only the validated package versions.", fr: "Les projets de jeu ne voient que les versions de packages validées." } }
    - { id: outage, text: { en: "The engine builds restore their nuget.org packages during a nuget.org outage.", fr: "Les builds du moteur restaurent leurs packages nuget.org pendant une panne de nuget.org." } }
answer:
  mapping: { mark: promote, game: consume, outage: upstream }
explanation:
  correct:
    en: |
      Packages are always published to the feed, where they appear in the default @Local view; a version is then promoted to a view such as @Release, which only Feed Publisher (Contributor) or Feed Owner can do. Consumers that connect to the @Release view see only the promoted versions. With nuget.org as an upstream source, each package that a build restores through EngineTools is saved in the feed and remains available when nuget.org is down.
    fr: |
      Les packages sont toujours publiés dans le flux, où ils apparaissent dans la vue par défaut @Local ; une version est ensuite promue vers une vue comme @Release, ce que seuls Feed Publisher (Contributor) ou Feed Owner peuvent faire. Les consommateurs connectés à la vue @Release ne voient que les versions promues. Avec nuget.org comme source en amont, chaque package qu'une build restaure via EngineTools est enregistré dans le flux et reste disponible quand nuget.org est en panne.
  options:
    publish:
      en: |
        Azure Artifacts supports publishing only to the base feed (@Local); a view is filled by promotion.
      fr: |
        Azure Artifacts ne prend en charge la publication que dans le flux de base (@Local) ; une vue se remplit par promotion.
    second:
      en: |
        A second package source makes the builds download directly from nuget.org, so nothing is saved in EngineTools for an outage.
      fr: |
        Une deuxième source de packages fait télécharger les builds directement depuis nuget.org : rien n'est enregistré dans EngineTools en prévision d'une panne.
references:
  - title: Promote packages and manage feed views
    url: https://learn.microsoft.com/en-us/azure/devops/artifacts/feeds/views
  - title: What are upstream sources?
    url: https://learn.microsoft.com/en-us/azure/devops/artifacts/concepts/upstream-sources
