id: az400-3e-cfg-dsc-migration
objective: "3.5.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Woodgrove Bank uses Azure Automation State Configuration to keep 120 Windows Server virtual machines in Azure and 40 Windows servers in its datacenter compliant with a security baseline written as PowerShell DSC configurations. Drift is corrected automatically.

    You need to recommend a replacement that remains supported after 2027, keeps correcting drift automatically on all 160 servers, and reports compliance in Azure. The solution must minimize the effort needed to maintain the infrastructure.

    What should you recommend?
  fr: |
    Woodgrove Bank utilise Azure Automation State Configuration pour maintenir 120 machines virtuelles Windows Server dans Azure et 40 serveurs Windows de son centre de données conformes à une base de référence de sécurité écrite sous forme de configurations PowerShell DSC. La dérive est corrigée automatiquement.

    Vous devez recommander une solution de remplacement qui reste prise en charge après 2027, continue de corriger automatiquement la dérive sur les 160 serveurs et indique la conformité dans Azure. La solution doit réduire au minimum l'effort de maintenance de l'infrastructure.

    Que devez-vous recommander ?
body:
  options:
    - id: a
      text:
        en: "Deploy a PowerShell DSC pull server on an Azure virtual machine and register the 160 servers with it."
        fr: "Déployer un serveur Pull PowerShell DSC sur une machine virtuelle Azure et y inscrire les 160 serveurs."
    - id: b
      text:
        en: "Run the configurations on each server with the Custom Script Extension from a scheduled pipeline."
        fr: "Exécuter les configurations sur chaque serveur avec l'extension de script personnalisé depuis un pipeline planifié."
    - id: c
      text:
        en: "Onboard the datacenter servers to Azure Arc, package the configurations, and assign them with Azure Machine Configuration in Apply and Autocorrect mode."
        fr: "Intégrer les serveurs du centre de données à Azure Arc, empaqueter les configurations et les affecter avec Azure Machine Configuration en mode Appliquer et corriger automatiquement (Apply and Autocorrect)."
    - id: d
      text:
        en: "Keep Azure Automation State Configuration and forward its node reports to a Log Analytics workspace."
        fr: "Conserver Azure Automation State Configuration et transférer ses rapports de nœuds vers un espace de travail Log Analytics."
answer: { optionId: c }
explanation:
  correct:
    en: "Microsoft recommends moving from State Configuration, which retires on September 30, 2027, to Azure Machine Configuration. Machine Configuration packages PowerShell DSC configurations, applies them to Azure VMs and Azure Arc-enabled servers, and the Apply and Autocorrect mode restores conformance whenever drift occurs, with compliance reported through Azure Policy."
    fr: "Microsoft recommande de passer de State Configuration, mis hors service le 30 septembre 2027, à Azure Machine Configuration. Machine Configuration empaquette des configurations PowerShell DSC, les applique aux machines virtuelles Azure et aux serveurs avec Azure Arc, et le mode Apply and Autocorrect rétablit la conformité dès qu'une dérive survient, la conformité étant indiquée via Azure Policy."
  options:
    a:
      en: "A self-managed pull server is infrastructure that the team must patch, secure and keep available, which doesn't minimize maintenance."
      fr: "Un serveur Pull autogéré est une infrastructure que l'équipe doit mettre à jour, sécuriser et maintenir disponible, ce qui ne réduit pas l'effort de maintenance."
    b:
      en: "The Custom Script Extension runs scripts on Azure VMs only, and a scheduled run doesn't monitor or report drift continuously."
      fr: "L'extension de script personnalisé n'exécute des scripts que sur des machines virtuelles Azure, et une exécution planifiée ne surveille ni n'indique la dérive en continu."
    d:
      en: "Forwarding reports doesn't change the retirement date of the service."
      fr: "Le transfert des rapports ne change pas la date de mise hors service du service."
references:
  - title: Azure Automation State Configuration overview
    url: https://learn.microsoft.com/en-us/azure/automation/automation-dsc-overview
  - title: What is Azure Machine Configuration?
    url: https://learn.microsoft.com/en-us/azure/governance/machine-configuration/overview
