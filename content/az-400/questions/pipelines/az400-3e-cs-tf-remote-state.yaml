id: az400-3e-cs-tf-remote-state
objective: "3.5.2"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    Northwind manages its Azure infrastructure with Terraform. Until now, an engineer ran Terraform from a laptop, and the state file was stored on that laptop. The deployments will now run from Azure Pipelines on different agents.

    You need every pipeline run to use the same state, and the state must be locked while a run writes it.

    Which three actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Northwind gère son infrastructure Azure avec Terraform. Jusqu'à présent, un ingénieur exécutait Terraform depuis son ordinateur portable, où était stocké le fichier d'état. Les déploiements s'exécuteront désormais depuis Azure Pipelines sur différents agents.

    Chaque exécution du pipeline doit utiliser le même état, et l'état doit être verrouillé pendant qu'une exécution l'écrit.

    Quelles sont les trois actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - { id: storage, text: { en: "Create a storage account and a blob container for the state.", fr: "Créer un compte de stockage et un conteneur d'objets blob pour l'état." } }
    - { id: backend, text: { en: "Add a `backend \"azurerm\"` block that names the resource group, the storage account, the container and the state key.", fr: "Ajouter un bloc `backend \"azurerm\"` qui nomme le groupe de ressources, le compte de stockage, le conteneur et la clé d'état." } }
    - { id: init, text: { en: "Run `terraform init` to initialize the backend.", fr: "Exécuter `terraform init` pour initialiser le backend." } }
    - { id: commit, text: { en: "Commit the terraform.tfstate file to the repository.", fr: "Valider le fichier terraform.tfstate dans le dépôt." } }
    - { id: secure, text: { en: "Upload the terraform.tfstate file to the secure files library of the project.", fr: "Charger le fichier terraform.tfstate dans la bibliothèque de fichiers sécurisés du projet." } }
    - { id: anon, text: { en: "Enable anonymous read access on the blob container.", fr: "Activer l'accès en lecture anonyme sur le conteneur d'objets blob." } }
answer:
  sequence: [ storage, backend, init ]
explanation:
  correct:
    en: "The azurerm backend stores the state in an Azure Storage blob container, so the account and container must exist first. The backend block tells Terraform where the state is, and `terraform init` configures the backend before any plan or apply. Azure Storage locks the state blob automatically before each operation that writes the state."
    fr: "Le backend azurerm stocke l'état dans un conteneur Stockage Blob Azure : le compte et le conteneur doivent donc exister d'abord. Le bloc backend indique à Terraform où se trouve l'état, et `terraform init` configure le backend avant tout plan ou toute application. Stockage Azure verrouille automatiquement l'objet blob d'état avant chaque opération qui écrit l'état."
  options:
    commit: { en: "A state file in Git isn't locked, and the state can contain secrets in plain text.", fr: "Un fichier d'état dans Git n'est pas verrouillé, et l'état peut contenir des secrets en texte clair." }
    secure: { en: "Pipelines only download secure files (Download secure file task); runs can't write the updated state back, and secure files provide no lock.", fr: "Les pipelines ne font que télécharger les fichiers sécurisés (tâche Download secure file) : les exécutions ne peuvent pas y réécrire l'état mis à jour, et les fichiers sécurisés n'offrent aucun verrou." }
    anon: { en: "The state can contain secrets; access to the container must be restricted, not opened.", fr: "L'état peut contenir des secrets ; l'accès au conteneur doit être restreint, pas ouvert." }
references:
  - title: Store Terraform state in Azure Storage
    url: https://learn.microsoft.com/en-us/azure/developer/terraform/store-state-in-azure-storage
