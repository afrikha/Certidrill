id: az400-3b-gh-pr-drafts
objective: "3.3.3"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Tailspin's Azure Pipelines YAML pipeline builds a GitHub repository through the Azure Pipelines GitHub App.

    You need to configure pull request validation so that:

    - pull requests that target main are validated;
    - draft pull requests aren't built;
    - pull requests that change only files in the docs folder aren't built;
    - a new push to a pull request still cancels the run in progress for that pull request.

    How should you complete the YAML? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Le pipeline YAML Azure Pipelines de Tailspin génère un dépôt GitHub par l'application GitHub Azure Pipelines.

    Vous devez configurer la validation des pull requests pour que :

    - les pull requests qui ciblent main soient validées ;
    - les pull requests en brouillon ne soient pas générées ;
    - les pull requests qui ne modifient que des fichiers du dossier docs ne soient pas générées ;
    - un nouvel envoi (push) sur une pull request annule toujours l'exécution en cours pour cette pull request.

    Comment devez-vous compléter le YAML ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: yaml
  template: |
    [[trig]]:
      branches:
        include:
          - main
      [[key]]: false
      [[filter]]:
        exclude:
          - docs
  slots:
    - id: trig
      options:
        - { id: trigger, text: trigger }
        - { id: pr, text: pr }
        - { id: schedules, text: schedules }
    - id: key
      options:
        - { id: autocancel, text: autoCancel }
        - { id: batch, text: batch }
        - { id: drafts, text: drafts }
    - id: filter
      options:
        - { id: paths, text: paths }
        - { id: tags, text: tags }
        - { id: stages, text: stages }
answer:
  values: { trig: pr, key: drafts, filter: paths }
explanation:
  correct:
    en: |
      For GitHub repositories, the `pr` section defines pull request validation. `drafts: false` stops builds of draft pull requests (the default is `true`), and a `paths` filter with `exclude` skips pull requests that only change the docs folder. `autoCancel` keeps its default value of `true`, so new pushes still cancel the run in progress.
    fr: |
      Pour les dépôts GitHub, la section `pr` définit la validation des pull requests. `drafts: false` arrête les builds des pull requests en brouillon (la valeur par défaut est `true`), et un filtre `paths` avec `exclude` ignore les pull requests qui ne modifient que le dossier docs. `autoCancel` conserve sa valeur par défaut `true` : les nouveaux envois annulent toujours l'exécution en cours.
  options:
    trigger: { en: "trigger defines CI builds for pushes, not pull request validation.", fr: "trigger définit les builds de CI pour les envois, pas la validation des pull requests." }
    schedules: { en: "schedules defines scheduled runs.", fr: "schedules définit des exécutions planifiées." }
    autocancel: { en: "autoCancel: false would stop new pushes from canceling the run in progress.", fr: "autoCancel: false empêcherait les nouveaux envois d'annuler l'exécution en cours." }
    batch: { en: "batch belongs to CI triggers; it isn't a pull request trigger property.", fr: "batch appartient aux déclencheurs de CI ; ce n'est pas une propriété du déclencheur de pull request." }
    tags: { en: "Tag filters belong to CI triggers.", fr: "Les filtres de balises appartiennent aux déclencheurs de CI." }
    stages: { en: "Stage filters belong to pipeline resource triggers.", fr: "Les filtres de phases appartiennent aux déclencheurs de ressources de pipeline." }
references:
  - title: Build GitHub repositories
    url: https://learn.microsoft.com/en-us/azure/devops/pipelines/repos/github
