id: az400-3a-feed-override-upstream
objective: "3.1.2"
type: ordering
difficulty: 3
status: draft
stem:
  en: |
    Proseware has an Azure Artifacts feed named **pw-nuget** that has nuget.org as an upstream source. A vendor delivered a patched build of an open-source package that keeps the package ID and the version number 4.1.2 of the public release. A licensing tool that Proseware cannot change requires that exact ID and version.

    When the pipeline pushes the patched package to pw-nuget, the push fails because version 4.1.2 already exists in the upstream source. No project has restored version 4.1.2 through pw-nuget yet.

    You need to make the patched build available as version 4.1.2 in pw-nuget, and nuget.org must remain an upstream source afterward.

    Which three actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Proseware dispose d'un flux Azure Artifacts nommé **pw-nuget** qui a nuget.org comme source en amont. Un fournisseur a livré une build corrigée d'un package open source, qui conserve l'ID du package et le numéro de version 4.1.2 de la version publique. Un outil de gestion des licences que Proseware ne peut pas modifier exige exactement cet ID et cette version.

    Quand le pipeline envoie le package corrigé vers pw-nuget, l'envoi échoue, car la version 4.1.2 existe déjà dans la source en amont. Aucun projet n'a encore restauré la version 4.1.2 via pw-nuget.

    Vous devez rendre la build corrigée disponible en version 4.1.2 dans pw-nuget, et nuget.org doit rester ensuite une source en amont.

    Quelles sont les trois actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - { id: disable, text: { en: "Disable the nuget.org upstream source of pw-nuget.", fr: "Désactiver la source en amont nuget.org de pw-nuget." } }
    - { id: publish, text: { en: "Push the patched 4.1.2 package to pw-nuget.", fr: "Envoyer le package 4.1.2 corrigé vers pw-nuget." } }
    - { id: enable, text: { en: "Enable the nuget.org upstream source again.", fr: "Réactiver la source en amont nuget.org." } }
    - { id: allow, text: { en: "Turn on Allow externally-sourced versions for the package.", fr: "Activer Allow externally-sourced versions pour le package." } }
    - { id: promote, text: { en: "Promote version 4.1.2 of the package to the @Release view.", fr: "Promouvoir la version 4.1.2 du package vers la vue @Release." } }
    - { id: bin, text: { en: "Delete version 4.1.2 from the feed and empty the Recycle Bin.", fr: "Supprimer la version 4.1.2 du flux et vider la Corbeille." } }
answer:
  sequence: [ disable, publish, enable ]
explanation:
  correct:
    en: |
      While an upstream source is enabled, you cannot publish a version that already exists in it. The documented workaround is to disable the upstream source, publish your version to the feed, and then enable the upstream source again. Packages published to the feed are searched before upstream sources, so clients then get the patched 4.1.2.
    fr: |
      Tant qu'une source en amont est activée, vous ne pouvez pas publier une version qui y existe déjà. La solution documentée consiste à désactiver la source en amont, publier votre version dans le flux, puis réactiver la source en amont. Les packages publiés dans le flux sont recherchés avant les sources en amont : les clients obtiennent ensuite la version 4.1.2 corrigée.
  options:
    allow: { en: "Allow externally-sourced versions controls whether public versions can be saved for a package; it does not let you publish a version that exists upstream.", fr: "Allow externally-sourced versions détermine si des versions publiques peuvent être enregistrées pour un package ; il ne permet pas de publier une version qui existe en amont." }
    promote: { en: "Promotion applies to a version that is already in the feed; it does not solve the publishing conflict.", fr: "La promotion s'applique à une version déjà présente dans le flux ; elle ne résout pas le conflit de publication." }
    bin: { en: "Version 4.1.2 was never in pw-nuget, and a deleted version number stays reserved anyway.", fr: "La version 4.1.2 n'a jamais été dans pw-nuget, et un numéro de version supprimé reste de toute façon réservé." }
references:
  - title: What are upstream sources?
    url: https://learn.microsoft.com/en-us/azure/devops/artifacts/concepts/upstream-sources
