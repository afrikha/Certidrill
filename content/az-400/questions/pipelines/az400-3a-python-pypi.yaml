id: az400-3a-python-pypi
objective: "3.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam stores its code in GitHub and builds it with GitHub Actions. The data science team develops internal Python libraries and also depends on about 80 packages from the Python Package Index (PyPI).

    You need to recommend a package management solution. The solution must meet the following requirements:

    - Host the internal Python packages privately.
    - Keep a copy of every PyPI package that the builds use, so that builds succeed when PyPI is unavailable.
    - Use a single package source in the pip configuration.

    What should you recommend?
  fr: |
    Fabrikam stocke son code dans GitHub et le génère avec GitHub Actions. L'équipe de science des données développe des bibliothèques Python internes et dépend aussi d'environ 80 packages du Python Package Index (PyPI).

    Vous devez recommander une solution de gestion des packages. La solution doit répondre aux exigences suivantes :

    - Héberger les packages Python internes de manière privée.
    - Conserver une copie de chaque package PyPI utilisé par les builds, afin que les builds réussissent quand PyPI est indisponible.
    - Utiliser une seule source de packages dans la configuration de pip.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "The GitHub Container registry, with one image per library", fr: "Le GitHub Container registry, avec une image par bibliothèque" } }
    - { id: b, text: { en: "GitHub Packages, with one registry for each repository", fr: "GitHub Packages, avec un registre pour chaque dépôt" } }
    - { id: c, text: { en: "Pipeline artifacts that contain the downloaded wheel files", fr: "Des artefacts de pipeline contenant les fichiers wheel téléchargés" } }
    - { id: d, text: { en: "An Azure Artifacts feed that has PyPI as an upstream source", fr: "Un flux Azure Artifacts qui a PyPI comme source en amont" } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Azure Artifacts feeds support Python packages and can use PyPI as an upstream source. When a build installs a PyPI package through the feed, the feed saves a copy, which stays available if PyPI is down, and pip only needs the feed as its index.
    fr: |
      Les flux Azure Artifacts prennent en charge les packages Python et peuvent utiliser PyPI comme source en amont. Quand une build installe un package PyPI par l'intermédiaire du flux, le flux en enregistre une copie, qui reste disponible si PyPI est en panne, et pip n'a besoin que du flux comme index.
  options:
    b: { en: "GitHub Packages has no Python (PyPI) registry and no upstream sources that cache public packages.", fr: "GitHub Packages n'a pas de registre Python (PyPI) ni de sources en amont qui mettent en cache les packages publics." }
    a: { en: "The Container registry stores container images; pip cannot install Python packages from it.", fr: "Le Container registry stocke des images conteneur ; pip ne peut pas y installer de packages Python." }
    c: { en: "Pipeline artifacts belong to a run and are not a package index that pip can query; they do not cache PyPI automatically.", fr: "Les artefacts de pipeline appartiennent à une exécution et ne sont pas un index de packages que pip peut interroger ; ils ne mettent pas PyPI en cache automatiquement." }
references:
  - title: What are upstream sources?
    url: https://learn.microsoft.com/en-us/azure/devops/artifacts/concepts/upstream-sources
  - title: Publish packages
    url: https://learn.microsoft.com/en-us/training/modules/introduction-github-packages/2-publish-packages
