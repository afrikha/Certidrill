id: az400-3a-art-build-once
objective: "3.1.4"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    Northwind has a multi-stage YAML pipeline with the stages Build, Test, Staging and Production. Today, each stage checks out the commit and runs dotnet publish before it deploys the web application.

    You need to ensure that every stage deploys exactly the binaries that were tested and that each deployment can be traced to one build.

    Which two actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind dispose d'un pipeline YAML multiphase avec les phases Build, Test, Staging et Production. Aujourd'hui, chaque phase extrait le commit et exécute dotnet publish avant de déployer l'application web.

    Vous devez faire en sorte que chaque phase déploie exactement les binaires testés et que chaque déploiement puisse être rattaché à une seule build.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "In each stage, check out the same commit SHA before running dotnet publish", fr: "Dans chaque phase, extraire le même SHA de commit avant d'exécuter dotnet publish" } }
    - { id: b, text: { en: "In the Build stage, publish the output of dotnet publish once as a pipeline artifact", fr: "Dans la phase Build, publier une seule fois la sortie de dotnet publish en tant qu'artefact de pipeline" } }
    - { id: c, text: { en: "In each stage, publish its own pipeline artifact named latest", fr: "Dans chaque phase, publier son propre artefact de pipeline nommé latest" } }
    - { id: d, text: { en: "Increase the run retention of the pipeline to 365 days", fr: "Augmenter la rétention des exécutions du pipeline à 365 jours" } }
    - { id: e, text: { en: "In the Test, Staging and Production stages, download that pipeline artifact instead of building", fr: "Dans les phases Test, Staging et Production, télécharger cet artefact de pipeline au lieu de générer" } }
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: |
      Build once, deploy many: the Build stage produces one pipeline artifact tied to the run and its run number, and every later stage downloads that same artifact. The tested binaries are then the deployed binaries, and every deployment traces back to one run.
    fr: |
      Générer une fois, déployer plusieurs fois : la phase Build produit un seul artefact de pipeline lié à l'exécution et à son numéro, et chaque phase suivante télécharge ce même artefact. Les binaires testés sont alors les binaires déployés, et chaque déploiement remonte à une seule exécution.
  options:
    a: { en: "Rebuilding the same commit can produce different binaries (new dependency versions, different agent images), so what is deployed was not what was tested.", fr: "Régénérer le même commit peut produire des binaires différents (nouvelles versions de dépendances, autres images d'agent) : ce qui est déployé n'est pas ce qui a été testé." }
    c: { en: "Each stage would still build its own binaries, and a name such as latest identifies no specific build.", fr: "Chaque phase générerait toujours ses propres binaires, et un nom comme latest n'identifie aucune build précise." }
    d: { en: "Retention keeps runs longer but does not change what each stage deploys.", fr: "La rétention conserve les exécutions plus longtemps, mais ne change pas ce que chaque phase déploie." }
references:
  - title: Publish and download pipeline artifacts
    url: https://learn.microsoft.com/en-us/azure/devops/pipelines/artifacts/pipeline-artifacts
