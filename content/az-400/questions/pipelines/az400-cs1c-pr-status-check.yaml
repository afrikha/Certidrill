id: az400-cs1c-pr-status-check
objective: "3.3.3"
type: single
caseStudy: az400-cs1c-southridge-video
difficulty: 2
status: draft
stem:
  en: |
    The skyforge pipeline is connected to GitHub through the Azure Pipelines GitHub App and already runs for every pull request that targets main.

    You need to meet the pipeline requirement for pull requests. What should you do?
  fr: |
    Le pipeline de skyforge est connecté à GitHub par l'application GitHub Azure Pipelines et s'exécute déjà pour chaque pull request qui cible main.

    Vous devez satisfaire l'exigence relative aux pipelines concernant les pull requests. Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Add a build validation branch policy for main in the Games project", fr: "Ajouter une stratégie de branche de validation de build pour main dans le projet Games" } }
    - { id: b, text: { en: "Add `autoCancel: true` to the pr trigger of the pipeline", fr: "Ajouter `autoCancel: true` au déclencheur pr du pipeline" } }
    - { id: c, text: { en: "Add a Branch control check to the GitHub service connection", fr: "Ajouter une vérification Branch control à la connexion de service GitHub" } }
    - { id: d, text: { en: "Select the pipeline as a required status check in a branch protection rule for main", fr: "Sélectionner le pipeline comme vérification d'état obligatoire dans une règle de protection de branche pour main" } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      With the GitHub App, Azure Pipelines posts GitHub Checks for each run. Merging is controlled by GitHub, so you protect main in the GitHub repository settings and select the pipeline in the list of required status checks; the pipeline appears there after it has run at least once in the last week.
    fr: |
      Avec l'application GitHub, Azure Pipelines publie des GitHub Checks pour chaque exécution. La fusion est contrôlée par GitHub : vous protégez main dans les paramètres du dépôt GitHub et vous sélectionnez le pipeline dans la liste des vérifications d'état obligatoires ; le pipeline y apparaît après s'être exécuté au moins une fois au cours de la dernière semaine.
  options:
    a: { en: "Branch policies apply to Azure Repos Git repositories; skyforge is hosted on GitHub.", fr: "Les stratégies de branche s'appliquent aux dépôts Git Azure Repos ; skyforge est hébergé sur GitHub." }
    b: { en: "autoCancel only cancels a running pull request build when new commits are pushed; it does not block the merge.", fr: "autoCancel annule seulement une build de pull request en cours quand de nouveaux commits sont poussés ; il ne bloque pas la fusion." }
    c: { en: "Checks on a service connection control which pipeline runs can use it; they do not stop GitHub from merging a pull request.", fr: "Les vérifications d'une connexion de service contrôlent quelles exécutions de pipeline peuvent l'utiliser ; elles n'empêchent pas GitHub de fusionner une pull request." }
references:
  - title: Build GitHub repositories
    url: https://learn.microsoft.com/en-us/azure/devops/pipelines/repos/github
