id: az400-3b-test-publish-condition
objective: "3.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Contoso has an Azure Pipelines YAML pipeline for a Node.js web app. The test job contains the following steps.

    ```yaml
    steps:
      - script: npm ci && npx jest --ci --reporters=default --reporters=jest-junit
        displayName: Unit tests
      - task: PublishTestResults@2
        inputs:
          testResultsFormat: JUnit
          testResultsFiles: '**/junit.xml'
    ```

    When all the tests pass, the results appear on the **Tests** tab of the run. When at least one test fails, the run fails and the **Tests** tab is empty.

    You need the test results to be published every time the tests run, including when tests fail. What should you do?
  fr: |
    Contoso dispose d'un pipeline YAML Azure Pipelines pour une application web Node.js. Le travail de test contient les étapes suivantes.

    ```yaml
    steps:
      - script: npm ci && npx jest --ci --reporters=default --reporters=jest-junit
        displayName: Unit tests
      - task: PublishTestResults@2
        inputs:
          testResultsFormat: JUnit
          testResultsFiles: '**/junit.xml'
    ```

    Quand tous les tests réussissent, les résultats apparaissent dans l'onglet **Tests** de l'exécution. Quand au moins un test échoue, l'exécution échoue et l'onglet **Tests** est vide.

    Vous devez faire en sorte que les résultats des tests soient publiés à chaque exécution des tests, y compris quand des tests échouent. Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Set `failTaskOnFailedTests: true` in the inputs of the PublishTestResults@2 task.", fr: "Définir `failTaskOnFailedTests: true` dans les entrées de la tâche PublishTestResults@2." } }
    - { id: b, text: { en: "Set `mergeTestResults: true` in the inputs of the PublishTestResults@2 task.", fr: "Définir `mergeTestResults: true` dans les entrées de la tâche PublishTestResults@2." } }
    - { id: c, text: { en: "Add `condition: succeededOrFailed()` to the PublishTestResults@2 task.", fr: "Ajouter `condition: succeededOrFailed()` à la tâche PublishTestResults@2." } }
    - { id: d, text: { en: "Set `failTaskOnMissingResultsFile: true` in the inputs of the PublishTestResults@2 task.", fr: "Définir `failTaskOnMissingResultsFile: true` dans les entrées de la tâche PublishTestResults@2." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      A step runs by default only when all the previous steps succeeded. When Jest returns a non-zero exit code, the script step fails and the publishing task is skipped, so no results reach the Tests tab. The `succeededOrFailed()` condition runs the publishing task whether the test step passed or failed (but not when the run is canceled).
    fr: |
      Par défaut, une étape ne s'exécute que si toutes les étapes précédentes ont réussi. Quand Jest renvoie un code de sortie différent de zéro, l'étape de script échoue et la tâche de publication est ignorée : aucun résultat n'arrive dans l'onglet Tests. La condition `succeededOrFailed()` exécute la tâche de publication que l'étape de test ait réussi ou échoué (mais pas quand l'exécution est annulée).
  options:
    a: { en: "failTaskOnFailedTests makes the publishing task fail when a test failed; it doesn't make a skipped task run.", fr: "failTaskOnFailedTests fait échouer la tâche de publication quand un test a échoué ; il ne fait pas s'exécuter une tâche ignorée." }
    b: { en: "mergeTestResults groups several result files into one test run; the task is still skipped after a failed test step.", fr: "mergeTestResults regroupe plusieurs fichiers de résultats dans une même série de tests ; la tâche reste ignorée après l'échec de l'étape de test." }
    d: { en: "failTaskOnMissingResultsFile fails the task when no file matches; it doesn't change when the task runs.", fr: "failTaskOnMissingResultsFile fait échouer la tâche quand aucun fichier ne correspond ; il ne change pas le moment où la tâche s'exécute." }
references:
  - title: PublishTestResults@2 - Publish Test Results v2 task
    url: https://learn.microsoft.com/en-us/azure/devops/pipelines/tasks/reference/publish-test-results-v2
  - title: Build, test, and deploy .NET Core projects
    url: https://learn.microsoft.com/en-us/azure/devops/pipelines/ecosystems/dotnet-core
