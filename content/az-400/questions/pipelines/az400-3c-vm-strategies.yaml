id: az400-3c-vm-strategies
objective: "3.4.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Tailspin has an Azure Pipelines environment named **prod** that contains 30 virtual machine resources tagged **web**. You are writing a deployment job that targets those resources.

    Which two deployment strategies can you set on the deployment job? Each correct answer presents a complete solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin dispose d'un environnement Azure Pipelines nommé **prod** qui contient 30 ressources machine virtuelle étiquetées **web**. Vous écrivez un travail de déploiement qui cible ces ressources.

    Quelles sont les deux stratégies de déploiement que vous pouvez définir sur le travail de déploiement ? Chaque bonne réponse constitue une solution complète.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: runOnce }
    - { id: b, text: matrix }
    - { id: c, text: rolling }
    - { id: d, text: parallel }
    - { id: e, text: canary }
answer: { optionIds: [ c, a ] }
explanation:
  correct:
    en: |
      Virtual machine resources of an environment support the runOnce and rolling strategies. rolling updates the VMs in batches set by `maxParallel` (a number or a percentage) and runs the lifecycle hooks for each batch.
    fr: |
      Les ressources machine virtuelle d'un environnement prennent en charge les stratégies runOnce et rolling. rolling met à jour les machines par lots définis par `maxParallel` (un nombre ou un pourcentage) et exécute les hooks de cycle de vie pour chaque lot.
  options:
    e: { en: "The documentation lists only runOnce and rolling for virtual machine resources; canary is used with resources such as Kubernetes.", fr: "La documentation ne cite que runOnce et rolling pour les ressources machine virtuelle ; canary s'utilise avec des ressources comme Kubernetes." }
    b: { en: "matrix is a strategy of regular agent jobs, not a deployment strategy.", fr: "matrix est une stratégie des travaux d'agent ordinaires, pas une stratégie de déploiement." }
    d: { en: "parallel duplicates a regular agent job; it isn't a deployment strategy.", fr: "parallel duplique un travail d'agent ordinaire ; ce n'est pas une stratégie de déploiement." }
references:
  - title: Manage VM resources in environments
    url: https://learn.microsoft.com/en-us/azure/devops/pipelines/process/environments-virtual-machines
  - title: Deployment jobs
    url: https://learn.microsoft.com/en-us/azure/devops/pipelines/process/deployment-jobs
