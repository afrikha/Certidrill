id: az400-3c-container-job
objective: "3.3.7"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam wants its build tools to be defined by a Linux container image instead of a maintained agent image. The image is stored in a private Azure Container Registry named **contosoacr**, and a Docker Registry service connection named **acr-build** gives access to it. All steps must run in the container, except the signing step, which must run on the agent host.

    How should you complete the YAML? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam veut que ses outils de build soient définis par une image conteneur Linux plutôt que par une image d'agent à maintenir. L'image est stockée dans un registre Azure Container Registry privé nommé **contosoacr**, et une connexion de service Docker Registry nommée **acr-build** permet d'y accéder. Toutes les étapes doivent s'exécuter dans le conteneur, sauf l'étape de signature, qui doit s'exécuter sur l'hôte de l'agent.

    Comment devez-vous compléter le YAML ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: yaml
  template: |
    pool:
      vmImage: ubuntu-latest

    [[s1]]:
      image: contosoacr.azurecr.io/build/dotnet-sdk:8.0
      [[s2]]: acr-build

    steps:
    - script: dotnet build --configuration Release
    - script: ./sign.sh
      [[s3]]: host
  slots:
    - id: s1
      options:
        - { id: container, text: container }
        - { id: services, text: services }
        - { id: resources, text: resources }
    - id: s2
      options:
        - { id: endpoint, text: endpoint }
        - { id: credentials, text: credentials }
        - { id: azsub, text: azureSubscription }
    - id: s3
      options:
        - { id: target, text: target }
        - { id: pool, text: pool }
        - { id: demands, text: demands }
answer:
  values: { s1: container, s2: endpoint, s3: target }
explanation:
  correct:
    en: |
      The `container` keyword turns the job into a container job, and its `endpoint` property names the service connection used to pull the image from the private registry. A step overrides its execution context with `target`, which accepts `host` or the name of a container.
    fr: |
      Le mot clé `container` transforme le travail en travail de conteneur, et sa propriété `endpoint` indique la connexion de service utilisée pour extraire l'image du registre privé. Une étape remplace son contexte d'exécution avec `target`, qui accepte `host` ou le nom d'un conteneur.
  options:
    services: { en: "services starts side containers, such as a database, next to the job; the steps don't run in them.", fr: "services démarre des conteneurs annexes, comme une base de données, à côté du travail ; les étapes ne s'y exécutent pas." }
    resources: { en: "resources declares containers by alias, but doesn't by itself run the job in one.", fr: "resources déclare des conteneurs par alias, mais n'exécute pas à lui seul le travail dans l'un d'eux." }
    credentials: { en: "credentials is the GitHub Actions key for registry sign-in, not the Azure Pipelines one.", fr: "credentials est la clé GitHub Actions pour la connexion au registre, pas celle d'Azure Pipelines." }
    azsub: { en: "azureSubscription is an input of Azure tasks, not a property of a container.", fr: "azureSubscription est une entrée des tâches Azure, pas une propriété de conteneur." }
    pool: { en: "pool is set on a job, not on a step.", fr: "pool se définit sur un travail, pas sur une étape." }
    demands: { en: "demands selects agents by capability for a job; it doesn't move a step out of the container.", fr: "demands sélectionne des agents selon leurs capacités pour un travail ; il ne sort pas une étape du conteneur." }
references:
  - title: Container jobs in YAML pipelines
    url: https://learn.microsoft.com/en-us/azure/devops/pipelines/process/container-phases
  - title: Task types and usage
    url: https://learn.microsoft.com/en-us/azure/devops/pipelines/process/tasks
