id: az400-3d-container-apps-source
objective: "3.4.7"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Litware has a Python web API in an Azure Repos repository. The repository contains no Dockerfile, and the team doesn't want to write or maintain one. The API must run in an existing Azure Container Apps environment, and its images must be stored in an Azure Container Registry named **crlitware**.

    You need to add a single step to an Azure Pipelines YAML pipeline that builds an image from the source code, pushes it to crlitware, and creates or updates the container app.

    Which task should you use?
  fr: |
    Litware dispose d'une API web Python dans un dépôt Azure Repos. Le dépôt ne contient aucun Dockerfile, et l'équipe ne veut pas en écrire ni en maintenir un. L'API doit s'exécuter dans un environnement Azure Container Apps existant, et ses images doivent être stockées dans un registre Azure Container Registry nommé **crlitware**.

    Vous devez ajouter une seule étape à un pipeline YAML Azure Pipelines qui génère une image à partir du code source, l'envoie vers crlitware et crée ou met à jour l'application conteneur.

    Quelle tâche devez-vous utiliser ?
body:
  options:
    - id: a
      text: { en: "Docker@2 with the buildAndPush command", fr: "Docker@2 avec la commande buildAndPush" }
    - id: b
      text: { en: "AzureWebAppContainer@1 with the containers input", fr: "AzureWebAppContainer@1 avec l'entrée containers" }
    - id: c
      text: { en: "AzureContainerApps@1 with the imageToDeploy input only", fr: "AzureContainerApps@1 avec uniquement l'entrée imageToDeploy" }
    - id: d
      text: { en: "AzureContainerApps@1 with the appSourcePath and acrName inputs", fr: "AzureContainerApps@1 avec les entrées appSourcePath et acrName" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      When AzureContainerApps@1 receives `appSourcePath` and `acrName` and finds no Dockerfile, it builds a runnable image with the Oryx++ builder, pushes it to the registry, and creates or updates the container app. One step covers the build, the push, and the deployment.
    fr: |
      Quand AzureContainerApps@1 reçoit `appSourcePath` et `acrName` et ne trouve aucun Dockerfile, il génère une image exécutable avec le générateur Oryx++, l'envoie vers le registre, puis crée ou met à jour l'application conteneur. Une seule étape couvre la build, l'envoi et le déploiement.
  options:
    a:
      en: "buildAndPush needs a Dockerfile and doesn't deploy anything to Container Apps."
      fr: "buildAndPush a besoin d'un Dockerfile et ne déploie rien vers Container Apps."
    b:
      en: "AzureWebAppContainer@1 deploys an existing image to App Service, not to Container Apps."
      fr: "AzureWebAppContainer@1 déploie une image existante vers App Service, pas vers Container Apps."
    c:
      en: "imageToDeploy deploys an image that already exists; no image is built from the source."
      fr: "imageToDeploy déploie une image qui existe déjà ; aucune image n'est générée à partir du code source."
references:
  - title: AzureContainerApps@1 - Azure Container Apps Deploy v1 task
    url: https://learn.microsoft.com/en-us/azure/devops/pipelines/tasks/reference/azure-container-apps-v1
