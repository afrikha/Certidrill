id: az400-3e-cs-kv-template-deploy
objective: "3.5.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam stores the administrator password of its Azure SQL logical server as a secret in a key vault named **kv-fabrikam-prod**. The production parameters file of the Bicep deployment retrieves the secret with `az.getSecret()`, so the password never appears in the repository. The pipeline identity already has all the role assignments it needs.

    The deployment fails because Azure Resource Manager isn't allowed to retrieve the secret.

    What should you configure on kv-fabrikam-prod?
  fr: |
    Fabrikam stocke le mot de passe d'administrateur de son serveur logique Azure SQL comme secret dans un coffre de clés nommé **kv-fabrikam-prod**. Le fichier de paramètres de production du déploiement Bicep récupère le secret avec `az.getSecret()` ; le mot de passe n'apparaît donc jamais dans le dépôt. L'identité du pipeline dispose déjà de toutes les attributions de rôles nécessaires.

    Le déploiement échoue, car Azure Resource Manager n'est pas autorisé à récupérer le secret.

    Que devez-vous configurer sur kv-fabrikam-prod ?
body:
  options:
    - { id: a, text: { en: "Set `enabledForDeployment` to true.", fr: "Définir `enabledForDeployment` sur true." } }
    - { id: b, text: { en: "Set `enabledForDiskEncryption` to true.", fr: "Définir `enabledForDiskEncryption` sur true." } }
    - { id: c, text: { en: "Set `enablePurgeProtection` to true.", fr: "Définir `enablePurgeProtection` sur true." } }
    - { id: d, text: { en: "Set `enabledForTemplateDeployment` to true.", fr: "Définir `enabledForTemplateDeployment` sur true." } }
answer: { optionId: d }
explanation:
  correct:
    en: "A key vault used by template or Bicep deployments must allow template deployment: `enabledForTemplateDeployment` set to true (for example with `az keyvault update --enabled-for-template-deployment true`). Azure Resource Manager can then read the secret during the deployment, in addition to the deploying identity's permission."
    fr: "Un coffre de clés utilisé par des déploiements de modèles ou Bicep doit autoriser le déploiement de modèles : `enabledForTemplateDeployment` défini sur true (par exemple avec `az keyvault update --enabled-for-template-deployment true`). Azure Resource Manager peut alors lire le secret pendant le déploiement, en plus de l'autorisation de l'identité qui déploie."
  options:
    a:
      en: "This setting lets virtual machines retrieve certificates stored as secrets; it doesn't apply to template deployments."
      fr: "Ce paramètre permet aux machines virtuelles de récupérer des certificats stockés comme secrets ; il ne concerne pas les déploiements de modèles."
    b:
      en: "This setting lets Azure Disk Encryption use the vault's keys and secrets."
      fr: "Ce paramètre permet à Azure Disk Encryption d'utiliser les clés et secrets du coffre."
    c:
      en: "Purge protection prevents permanent deletion of deleted vaults and objects; it doesn't grant any access."
      fr: "La protection contre le vidage empêche la suppression définitive des coffres et objets supprimés ; elle n'accorde aucun accès."
references:
  - title: Use Azure Key Vault to pass a secret as a parameter during Bicep deployment
    url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/bicep/key-vault-parameter
