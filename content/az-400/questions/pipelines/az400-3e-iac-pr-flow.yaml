id: az400-3e-iac-pr-flow
objective: "3.5.3"
type: ordering
difficulty: 1
status: draft
stem:
  en: |
    Contoso manages the Bicep files of its production infrastructure in an Azure Repos Git repository. The main branch has a build validation policy that runs a pipeline executing `az bicep lint` and `az deployment group what-if`. A pipeline triggered by changes to main deploys the files in a stage that targets the environment **infra-prod**, which has an approval check.

    An engineer must add a storage account to production, following the IaC process.

    Which four actions should the engineer and the team perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Contoso gère les fichiers Bicep de son infrastructure de production dans un dépôt Git Azure Repos. La branche main a une stratégie de validation de build qui lance un pipeline exécutant `az bicep lint` et `az deployment group what-if`. Un pipeline déclenché par les modifications de main déploie les fichiers dans une phase qui cible l'environnement **infra-prod**, doté d'une vérification d'approbation.

    Un ingénieur doit ajouter un compte de stockage en production en respectant le processus IaC.

    Quelles sont les quatre actions que l'ingénieur et l'équipe doivent effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: branch, text: { en: "Commit the change to the Bicep file in a feature branch.", fr: "Valider la modification du fichier Bicep dans une branche de fonctionnalité." } }
    - { id: pr, text: { en: "Create a pull request to main and let the build validation run the lint and what-if.", fr: "Créer une demande de tirage vers main et laisser la validation de build exécuter le lint et le what-if." } }
    - { id: complete, text: { en: "Complete the pull request after the reviewers approve the what-if output.", fr: "Terminer la demande de tirage après l'approbation de la sortie what-if par les réviseurs." } }
    - { id: approve, text: { en: "Approve the infra-prod check when the main pipeline reaches the deployment stage.", fr: "Approuver la vérification d'infra-prod lorsque le pipeline de main atteint la phase de déploiement." } }
    - { id: local, text: { en: "Run `az deployment group create` from the engineer's workstation.", fr: "Exécuter `az deployment group create` depuis le poste de l'ingénieur." } }
    - { id: portal, text: { en: "Create the storage account in the Azure portal, then export its template.", fr: "Créer le compte de stockage dans le portail Azure, puis exporter son modèle." } }
answer:
  sequence: [ branch, pr, complete, approve ]
explanation:
  correct:
    en: "Infrastructure changes follow the same flow as application code. The change is made in a branch, the pull request triggers the validation pipeline whose what-if output the reviewers read, and completing the pull request updates main. The main pipeline then pauses on the environment's approval check before it deploys."
    fr: "Les modifications d'infrastructure suivent le même flux que le code applicatif. La modification est faite dans une branche, la demande de tirage déclenche le pipeline de validation dont les réviseurs lisent la sortie what-if, et la fin de la demande de tirage met à jour main. Le pipeline de main s'arrête ensuite sur la vérification d'approbation de l'environnement avant de déployer."
  options:
    local: { en: "A deployment from a workstation bypasses the review, the approval and the pipeline history.", fr: "Un déploiement depuis un poste de travail contourne l'examen, l'approbation et l'historique du pipeline." }
    portal: { en: "A manual change in the portal is out-of-band and isn't reviewed before it reaches production.", fr: "Une modification manuelle dans le portail est hors bande et n'est pas examinée avant d'atteindre la production." }
references:
  - title: Bicep deployment what-if operation
    url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/bicep/deploy-what-if
