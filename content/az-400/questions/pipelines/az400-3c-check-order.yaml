id: az400-3c-check-order
objective: "3.3.9"
type: ordering
difficulty: 3
status: draft
stem:
  en: |
    At Contoso, the environment **prod** of Azure Pipelines has four checks, which were added in this order:

    1. Exclusive lock
    2. Query Azure Monitor alerts
    3. Evaluate artifact
    4. Branch control

    A stage that deploys to prod is about to start.

    In which order does Azure Pipelines evaluate the checks of prod? To answer, move the appropriate checks from the list to the answer area and arrange them in the correct order.
  fr: |
    Chez Contoso, l'environnement **prod** d'Azure Pipelines a quatre vérifications, ajoutées dans cet ordre :

    1. Exclusive lock
    2. Query Azure Monitor alerts
    3. Evaluate artifact
    4. Branch control

    Une phase qui déploie vers prod est sur le point de démarrer.

    Dans quel ordre Azure Pipelines évalue-t-il les vérifications de prod ? Pour répondre, déplacez les vérifications appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: lock, text: Exclusive lock }
    - { id: alerts, text: Query Azure Monitor alerts }
    - { id: artifact, text: Evaluate artifact }
    - { id: branch, text: Branch control }
    - { id: hours, text: Business hours }
    - { id: template, text: Required template }
answer:
  sequence: [ artifact, branch, alerts, lock ]
explanation:
  correct:
    en: |
      Checks are evaluated by category, and in creation order within a category. Static checks (Branch control, Required template, Evaluate artifact) come first, so Evaluate artifact, created before Branch control, runs first. Then come pre-check approvals, dynamic checks such as Query Azure Monitor alerts, post-check approvals, and finally the Exclusive lock.
    fr: |
      Les vérifications sont évaluées par catégorie, et dans l'ordre de création au sein d'une catégorie. Les vérifications statiques (Branch control, Required template, Evaluate artifact) passent en premier : Evaluate artifact, créée avant Branch control, est donc évaluée en premier. Viennent ensuite les approbations préalables, les vérifications dynamiques comme Query Azure Monitor alerts, les approbations postérieures, et enfin Exclusive lock.
  options:
    hours: { en: "Business hours isn't configured on prod.", fr: "Business hours n'est pas configurée sur prod." }
    template: { en: "Required template isn't configured on prod.", fr: "Required template n'est pas configurée sur prod." }
references:
  - title: Define approvals and checks
    url: https://learn.microsoft.com/en-us/azure/devops/pipelines/process/approvals
