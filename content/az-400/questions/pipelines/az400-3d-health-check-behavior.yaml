id: az400-3d-health-check-behavior
objective: "3.4.5"
type: yesno_statements
difficulty: 3
status: draft
stem:
  en: |
    Fabrikam has an App Service web app that runs on four instances in the Standard tier. You set the Health check path of the app to **/healthz** and keep all the other Health check settings at their default values. The /healthz endpoint returns HTTP 200 when the app and its database are available, and HTTP 503 otherwise.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam dispose d'une application web App Service qui s'exécute sur quatre instances dans le niveau Standard. Vous définissez le chemin de contrôle d'intégrité de l'application sur **/healthz** et laissez tous les autres paramètres du contrôle d'intégrité à leurs valeurs par défaut. Le point de terminaison /healthz renvoie HTTP 200 quand l'application et sa base de données sont disponibles, et HTTP 503 sinon.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          If three instances return HTTP 503 at the same time, only two of them are removed from the load balancer rotation.
        fr: |
          Si trois instances renvoient HTTP 503 en même temps, seules deux d'entre elles sont retirées de la rotation de l'équilibreur de charge.
    - id: s2
      text:
        en: |
          If the database becomes unavailable and all four instances return HTTP 503, all four instances are removed from the load balancer rotation.
        fr: |
          Si la base de données devient indisponible et que les quatre instances renvoient HTTP 503, les quatre instances sont retirées de la rotation de l'équilibreur de charge.
    - id: s3
      text:
        en: |
          An instance that is removed from rotation and later returns HTTP 200 from /healthz is put back into rotation.
        fr: |
          Une instance retirée de la rotation qui renvoie ensuite HTTP 200 depuis /healthz est remise en rotation.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |
      By default, Health check never removes more than half of the active instances, so with four instances and three unhealthy, two are excluded. When all instances are unhealthy, none is removed, because removing them would take the app down. Health check keeps pinging a removed instance and returns it to rotation as soon as it responds with a status code from 200 to 299.
    fr: |
      Par défaut, le contrôle d'intégrité ne retire jamais plus de la moitié des instances actives : avec quatre instances dont trois défectueuses, deux sont exclues. Quand toutes les instances sont défectueuses, aucune n'est retirée, car les retirer arrêterait l'application. Le contrôle d'intégrité continue d'interroger une instance retirée et la remet en rotation dès qu'elle répond avec un code d'état compris entre 200 et 299.
references:
  - title: Monitor App Service instances by using Health check
    url: https://learn.microsoft.com/en-us/azure/app-service/monitor-instances-health-check
