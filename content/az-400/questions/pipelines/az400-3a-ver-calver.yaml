id: az400-3a-ver-calver
objective: "3.1.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Woodgrove releases its internal expense portal every two weeks on a fixed schedule. No other code depends on the portal. The support team wants the version shown in the portal footer to tell them immediately in which month and year a release was shipped.

    You need to recommend a versioning scheme for the portal releases.

    What should you recommend?
  fr: |
    Woodgrove publie son portail interne de notes de frais toutes les deux semaines selon un calendrier fixe. Aucun autre code ne dépend du portail. L'équipe de support veut que la version affichée dans le pied de page du portail indique immédiatement le mois et l'année de livraison d'une version.

    Vous devez recommander un schéma de versionnement pour les versions du portail.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "Semantic versioning (SemVer), such as 4.12.0", fr: "Le versionnement sémantique (SemVer), par exemple 4.12.0" } }
    - { id: b, text: { en: "Calendar versioning (CalVer), such as 2026.11.1", fr: "Le versionnement calendaire (CalVer), par exemple 2026.11.1" } }
    - { id: c, text: { en: "The short SHA of the release commit, such as 5114f85", fr: "Le SHA court du commit de la version, par exemple 5114f85" } }
    - { id: d, text: { en: "The pipeline run ID, such as 48211", fr: "L'ID d'exécution du pipeline, par exemple 48211" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Calendar versioning derives the version from the release date (for example YYYY.MM.MICRO), so anyone can read when a release shipped. It fits applications released on a schedule that no other code consumes as a dependency.
    fr: |
      Le versionnement calendaire déduit la version de la date de publication (par exemple AAAA.MM.MICRO) : chacun peut lire quand une version a été livrée. Il convient aux applications publiées selon un calendrier et qu'aucun autre code ne consomme comme dépendance.
  options:
    a: { en: "SemVer tells consumers whether a release is compatible (major, minor, patch), not when it shipped.", fr: "SemVer indique aux consommateurs si une version est compatible (majeure, mineure, correctif), pas quand elle a été livrée." }
    c: { en: "A commit SHA identifies the source exactly but carries no date that the support team can read.", fr: "Un SHA de commit identifie exactement le code source, mais ne contient aucune date lisible par l'équipe de support." }
    d: { en: "A run ID is unique and traceable to the build, but it does not show the release month or year.", fr: "Un ID d'exécution est unique et traçable jusqu'à la build, mais il n'indique ni le mois ni l'année de la version." }
references:
  - title: Explore semantic versioning
    url: https://learn.microsoft.com/en-us/training/modules/implement-versioning-strategy/3-explore-semantic-versioning
  - title: Understand versioning of artifacts
    url: https://learn.microsoft.com/en-us/training/modules/implement-versioning-strategy/2-understand-versioning-of-artifacts
