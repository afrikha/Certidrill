id: az400-3b-trg-schedule-always
objective: "3.3.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso's Azure Pipelines YAML pipeline contains the following schedule.

    ```yaml
    schedules:
      - cron: '0 1 * * *'
        displayName: Nightly security scan
        branches:
          include:
            - main
    ```

    The scan downloads the latest vulnerability definitions, so it must run every night. On nights after which no change was pushed to main, no run starts.

    What should you do?
  fr: |
    Le pipeline YAML Azure Pipelines de Contoso contient la planification suivante.

    ```yaml
    schedules:
      - cron: '0 1 * * *'
        displayName: Nightly security scan
        branches:
          include:
            - main
    ```

    L'analyse télécharge les dernières définitions de vulnérabilités : elle doit s'exécuter chaque nuit. Les nuits où aucune modification n'a été envoyée sur main, aucune exécution ne démarre.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Add `batch: true` to the schedule.", fr: "Ajouter `batch: true` à la planification." } }
    - { id: b, text: { en: "Add `always: true` to the schedule.", fr: "Ajouter `always: true` à la planification." } }
    - { id: c, text: { en: "Add a `trigger` section that includes main.", fr: "Ajouter une section `trigger` qui inclut main." } }
    - { id: d, text: { en: "Change the cron expression to `0 1 * * 0-6`.", fr: "Remplacer l'expression cron par `0 1 * * 0-6`." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      By default, `always` is `false`: a scheduled run starts only if the source or the pipeline changed since the last successful scheduled run. Setting `always: true` makes the pipeline run at every scheduled time, whether or not anything changed.
    fr: |
      Par défaut, `always` vaut `false` : une exécution planifiée ne démarre que si la source ou le pipeline a changé depuis la dernière exécution planifiée réussie. `always: true` fait s'exécuter le pipeline à chaque horaire planifié, qu'il y ait eu des modifications ou non.
  options:
    a: { en: "batch prevents a scheduled run from starting while another scheduled run is in progress; it doesn't remove the change condition.", fr: "batch empêche une exécution planifiée de démarrer pendant qu'une autre est en cours ; il ne supprime pas la condition de modification." }
    c: { en: "A CI trigger starts runs on pushes; it doesn't make the nightly schedule run without changes.", fr: "Un déclencheur de CI démarre des exécutions lors des envois ; il ne fait pas s'exécuter la planification nocturne sans modification." }
    d: { en: "The current expression already runs every day; the days aren't the problem.", fr: "L'expression actuelle s'exécute déjà tous les jours ; les jours ne sont pas en cause." }
references:
  - title: Configure schedules for pipelines
    url: https://learn.microsoft.com/en-us/azure/devops/pipelines/process/scheduled-triggers
