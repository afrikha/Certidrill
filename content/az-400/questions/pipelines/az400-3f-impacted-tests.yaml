id: az400-3f-impacted-tests
objective: "3.6.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Wingtip Toys has a YAML pipeline that runs 4,000 MSTest tests with the VSTest@3 task on every commit. The test step takes 35 minutes, although most commits change a small part of the code. The tests are not data-driven.

    You need to reduce the test duration by running only the tests that validate the code change, while all the tests still run regularly.

    Which input should you set to true on the VSTest@3 task?
  fr: |
    Wingtip Toys dispose d'un pipeline YAML qui exécute 4 000 tests MSTest avec la tâche VSTest@3 à chaque commit. L'étape de test prend 35 minutes, alors que la plupart des commits modifient une petite partie du code. Les tests ne sont pas pilotés par les données.

    Vous devez réduire la durée des tests en n'exécutant que les tests qui valident la modification du code, tout en exécutant régulièrement l'ensemble des tests.

    Quelle entrée devez-vous définir sur true dans la tâche VSTest@3 ?
body:
  options:
    - { id: a, text: runInParallel }
    - { id: b, text: rerunFailedTests }
    - { id: c, text: runOnlyImpactedTests }
    - { id: d, text: failOnMinTestsNotRun }
answer: { optionId: c }
explanation:
  correct:
    en: |
      runOnlyImpactedTests turns on test impact analysis, which runs only the tests needed to validate the change. The companion input runAllTestsAfterXBuilds (50 by default) runs the full set periodically to refresh the mapping between tests and code.
    fr: |
      runOnlyImpactedTests active l'analyse d'impact des tests, qui n'exécute que les tests nécessaires pour valider la modification. L'entrée associée runAllTestsAfterXBuilds (50 par défaut) exécute périodiquement l'ensemble des tests pour actualiser la correspondance entre les tests et le code.
  options:
    a: { en: "runInParallel uses the cores of the machine, but every test still runs on every commit.", fr: "runInParallel utilise les cœurs de la machine, mais tous les tests s'exécutent toujours à chaque commit." }
    b: { en: "rerunFailedTests reruns failing tests, which can only add time.", fr: "rerunFailedTests réexécute les tests en échec, ce qui ne peut qu'ajouter du temps." }
    d: { en: "failOnMinTestsNotRun fails the task when too few tests run; it does not select tests.", fr: "failOnMinTestsNotRun fait échouer la tâche quand trop peu de tests s'exécutent ; il ne sélectionne pas de tests." }
references:
  - title: VSTest@3 - Visual Studio Test v3 task
    url: https://learn.microsoft.com/en-us/azure/devops/pipelines/tasks/reference/vstest-v3
