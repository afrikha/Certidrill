id: az400-3e-ade-pr-cli
objective: "3.5.5"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove wants a temporary Azure Deployment Environments environment for each pull request of the **shop** repository. The dev center is **dc-woodgrove**, the project is **proj-shop**, the catalog is **platform**, and the environment definition is **WebApi**. The pipeline identity has the Deployment Environments User role on the Test environment type of proj-shop.

    You are writing the Azure CLI script that the pipeline runs. It must install the required CLI extension, create an environment of type Test when the pull request is opened, and remove the environment and its resources when the pull request is closed.

    How should you complete the script? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove veut un environnement Azure Deployment Environments temporaire pour chaque demande de tirage du dépôt **shop**. Le centre de développement est **dc-woodgrove**, le projet **proj-shop**, le catalogue **platform** et la définition d'environnement **WebApi**. L'identité du pipeline dispose du rôle Deployment Environments User sur le type d'environnement Test de proj-shop.

    Vous écrivez le script Azure CLI exécuté par le pipeline. Il doit installer l'extension CLI requise, créer un environnement de type Test à l'ouverture de la demande de tirage, puis supprimer l'environnement et ses ressources à la fermeture de la demande de tirage.

    Comment devez-vous compléter le script ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: bash
  template: |
    az extension add --name [[ext]] --upgrade

    # Pull request opened
    az devcenter dev environment [[open]] --dev-center-name dc-woodgrove \
      --project-name proj-shop --environment-name "pr-$PR_ID" \
      --environment-type Test --environment-definition-name WebApi \
      --catalog-name platform

    # Pull request closed
    az devcenter dev environment [[close]] --dev-center-name dc-woodgrove \
      --project-name proj-shop --environment-name "pr-$PR_ID" --user-id "me"
  slots:
    - id: ext
      options:
        - { id: devcenter, text: devcenter }
        - { id: azdevops, text: azure-devops }
        - { id: containerapp, text: containerapp }
        - { id: graph, text: resource-graph }
    - id: open
      options:
        - { id: create, text: create }
        - { id: odeploy, text: deploy }
        - { id: oshow, text: show }
        - { id: olist, text: list }
    - id: close
      options:
        - { id: delete, text: delete }
        - { id: cdeploy, text: deploy }
        - { id: cshow, text: show }
        - { id: clist, text: list }
answer:
  values: { ext: devcenter, open: create, close: delete }
explanation:
  correct:
    en: "The `az devcenter` commands come from the devcenter extension. `az devcenter dev environment create` creates the environment from the definition of the catalog and a project environment type, in a new resource group. `az devcenter dev environment delete` removes the environment, its resource group and the resources in it."
    fr: "Les commandes `az devcenter` proviennent de l'extension devcenter. `az devcenter dev environment create` crée l'environnement à partir de la définition du catalogue et d'un type d'environnement de projet, dans un nouveau groupe de ressources. `az devcenter dev environment delete` supprime l'environnement, son groupe de ressources et les ressources qu'il contient."
  options:
    azdevops: { en: "The azure-devops extension manages Azure DevOps organizations, not dev centers.", fr: "L'extension azure-devops gère des organisations Azure DevOps, pas des centres de développement." }
    odeploy: { en: "deploy redeploys an existing environment with its latest definition; it doesn't create a new one.", fr: "deploy redéploie un environnement existant avec sa dernière définition ; il n'en crée pas de nouveau." }
    cdeploy: { en: "deploy updates the environment instead of removing it.", fr: "deploy met à jour l'environnement au lieu de le supprimer." }
    olist: { en: "list only returns the environments of the project.", fr: "list renvoie seulement les environnements du projet." }
references:
  - title: Create and access an environment by using the Azure CLI
    url: https://learn.microsoft.com/en-us/azure/deployment-environments/how-to-create-access-environments
  - title: Manage your environment
    url: https://learn.microsoft.com/en-us/azure/deployment-environments/how-to-manage-environments
