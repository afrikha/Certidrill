id: az400-3f-health-statements
objective: "3.6.1"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Northwind Traders uses Azure DevOps Services. Flaky test management is turned on with system detection in the project that hosts the YAML pipeline **api-ci**. The pipeline builds the main and release/* branches.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind Traders utilise Azure DevOps Services. La gestion des tests instables est activée avec la détection système dans le projet qui héberge le pipeline YAML **api-ci**. Le pipeline génère les branches main et release/*.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          The Pipeline pass rate report of api-ci can be filtered to show only the runs of the release/* branches.
        fr: |
          Le rapport Pipeline pass rate d'api-ci peut être filtré pour n'afficher que les exécutions des branches release/*.
    - id: s2
      text:
        en: |
          When you manually mark a failed test as Flaky, the outcome of the run in which the test failed is updated.
        fr: |
          Lorsque vous marquez manuellement comme Flaky un test en échec, le résultat de l'exécution dans laquelle le test a échoué est mis à jour.
    - id: s3
      text:
        en: |
          If you switch the project from system detection to custom detection, the flakiness history recorded so far is kept.
        fr: |
          Si vous faites passer le projet de la détection système à la détection personnalisée, l'historique d'instabilité enregistré jusque-là est conservé.
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: |
      Pipeline reports have a branch filter in addition to the date range filter, which is 14 days by default. Marking a test Flaky or UnFlaky manually applies only to future executions of the test, not to the current run. Switching between detection systems erases all the flakiness history stored in Azure DevOps.
    fr: |
      Les rapports de pipeline ont un filtre de branche en plus du filtre de plage de dates, de 14 jours par défaut. Marquer manuellement un test Flaky ou UnFlaky ne s'applique qu'aux exécutions futures du test, pas à l'exécution en cours. Changer de système de détection efface tout l'historique d'instabilité stocké dans Azure DevOps.
references:
  - title: Pipeline reports
    url: https://learn.microsoft.com/en-us/azure/devops/pipelines/reports/pipelinereport
  - title: Manage flaky tests
    url: https://learn.microsoft.com/en-us/azure/devops/pipelines/test/flaky-test-management
