id: az400-cs2a-lab-servers
objective: "3.3.7"
type: single
caseStudy: az400-cs2a-trey-research
difficulty: 2
status: draft
stem:
  en: |
    You need to recommend a solution to deploy the Instrument Gateway service to the laboratory servers. The solution must meet the requirements.

    What should you recommend?
  fr: |
    Vous devez recommander une solution pour déployer le service Instrument Gateway sur les serveurs du laboratoire. La solution doit respecter les exigences.

    Que devez-vous recommander ?
body:
  options:
    - id: a
      text:
        en: "Create a deployment group, and install the deployment group agent on each laboratory server."
        fr: "Créer un groupe de déploiement et installer l'agent de groupe de déploiement sur chaque serveur du laboratoire."
    - id: b
      text:
        en: "Use Microsoft-hosted agents, and run PowerShell remoting tasks against each laboratory server."
        fr: "Utiliser des agents hébergés par Microsoft et exécuter des tâches de communication à distance PowerShell sur chaque serveur du laboratoire."
    - id: c
      text:
        en: "Create a Managed DevOps Pools pool in Azure, and deploy to the laboratory servers from that pool."
        fr: "Créer un pool Managed DevOps Pools dans Azure et déployer sur les serveurs du laboratoire depuis ce pool."
    - id: d
      text:
        en: "Register each laboratory server as a virtual machine resource of an environment, and use a deployment job."
        fr: "Inscrire chaque serveur du laboratoire comme ressource de machine virtuelle d'un environnement et utiliser un travail de déploiement."
answer: { optionId: d }
explanation:
  correct:
    en: |
      Registering a server as a virtual machine resource of an Azure Pipelines environment installs an agent on it. The agent always initiates the communication with Azure Pipelines over HTTPS, so the blocked inbound connections are not a problem. Environments are designed for YAML pipelines, and a deployment job that targets the VM resources can use the rolling strategy to update one server at a time.
    fr: |
      Inscrire un serveur comme ressource de machine virtuelle d'un environnement Azure Pipelines installe un agent sur ce serveur. L'agent initie toujours la communication avec Azure Pipelines en HTTPS, si bien que le blocage des connexions entrantes ne pose pas de problème. Les environnements sont conçus pour les pipelines YAML, et un travail de déploiement qui cible les ressources de machine virtuelle peut utiliser la stratégie rolling pour mettre à jour un serveur à la fois.
  options:
    a: { en: "Deployment groups provide this capability for Classic release pipelines only; the requirement calls for YAML pipelines.", fr: "Les groupes de déploiement offrent cette fonctionnalité uniquement pour les pipelines de mise en production classiques ; l'exigence impose des pipelines YAML." }
    b: { en: "Remoting from a Microsoft-hosted agent needs an inbound connection to the servers, which the laboratory firewall blocks.", fr: "La communication à distance depuis un agent hébergé par Microsoft exige une connexion entrante vers les serveurs, que le pare-feu du laboratoire bloque." }
    c: { en: "Agents in Azure have no network path to the laboratory servers, because there is no VPN or ExpressRoute connection and inbound traffic is blocked.", fr: "Des agents dans Azure n'ont aucun chemin réseau vers les serveurs du laboratoire, car il n'existe ni VPN ni ExpressRoute et le trafic entrant est bloqué." }
references:
  - title: Manage VM resources in environments
    url: https://learn.microsoft.com/en-us/azure/devops/pipelines/process/environments-virtual-machines
  - title: Azure Pipelines agents
    url: https://learn.microsoft.com/en-us/azure/devops/pipelines/agents/agents
