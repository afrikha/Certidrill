id: az400-3f-optimization-techniques
objective: "3.6.2"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Northwind Traders has a YAML pipeline named **shop-ci** that builds a Java application with Maven and then deploys it in a second job. The team reports four problems.

    Which technique should you use for each problem? To answer, drag the appropriate techniques to the correct problems. Each technique may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind Traders dispose d'un pipeline YAML nommé **shop-ci** qui génère une application Java avec Maven puis la déploie dans un second travail. L'équipe signale quatre problèmes.

    Quelle technique devez-vous utiliser pour chaque problème ? Pour répondre, faites glisser les techniques appropriées vers les problèmes correspondants. Chaque technique peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: paths, text: { en: "Path filters in the CI trigger", fr: "Filtres de chemins dans le déclencheur CI" } }
    - { id: cache, text: { en: "The Cache@2 task", fr: "La tâche Cache@2" } }
    - { id: artifact, text: { en: "The publish and download pipeline artifact steps", fr: "Les étapes publish et download d'artefacts de pipeline" } }
    - { id: batch, text: { en: "batch: true in the CI trigger", fr: "batch: true dans le déclencheur CI" } }
    - { id: depth, text: { en: "fetchDepth: 1 in the checkout step", fr: "fetchDepth: 1 dans l'étape d'extraction" } }
    - { id: retry, text: { en: "retryCountOnTaskFailure on the Maven step", fr: "retryCountOnTaskFailure sur l'étape Maven" } }
  targets:
    - { id: t1, text: { en: "A run starts even when a commit changes only files in the docs folder.", fr: "Une exécution démarre même lorsqu'un commit ne modifie que des fichiers du dossier docs." } }
    - { id: t2, text: { en: "Every run downloads the same Maven dependencies again.", fr: "Chaque exécution télécharge de nouveau les mêmes dépendances Maven." } }
    - { id: t3, text: { en: "The deployment job needs the JAR file produced by the build job.", fr: "Le travail de déploiement a besoin du fichier JAR produit par le travail de build." } }
    - { id: t4, text: { en: "Ten pushes made during a running build start ten separate runs.", fr: "Dix push effectués pendant un build en cours démarrent dix exécutions distinctes." } }
answer:
  mapping: { t1: paths, t2: cache, t3: artifact, t4: batch }
explanation:
  correct:
    en: |
      Path filters start a CI run only when the pushed changes touch the included paths. Caching reuses dependencies from previous runs when a missing cache would not break the job, whereas pipeline artifacts pass files that a later job needs. With batch set to true, the pushes made during a run are built together in one new run when the current run finishes.
    fr: |
      Les filtres de chemins ne démarrent une exécution CI que si les modifications poussées touchent les chemins inclus. Le cache réutilise les dépendances des exécutions précédentes lorsqu'un cache manquant ne casserait pas le travail, alors que les artefacts de pipeline transmettent des fichiers dont un travail ultérieur a besoin. Avec batch défini sur true, les push effectués pendant une exécution sont générés ensemble dans une seule nouvelle exécution à la fin de l'exécution en cours.
  options:
    depth: { en: "A shallow fetch shortens checkout; it solves none of the four problems.", fr: "Une extraction superficielle raccourcit l'extraction ; elle ne résout aucun des quatre problèmes." }
    retry: { en: "Retrying a task helps with transient failures, not with duplicated work.", fr: "Réessayer une tâche aide contre les échecs passagers, pas contre le travail en double." }
references:
  - title: Pipeline caching
    url: https://learn.microsoft.com/en-us/azure/devops/pipelines/release/caching
  - title: Build Azure Repos Git or TFS Git repositories
    url: https://learn.microsoft.com/en-us/azure/devops/pipelines/repos/azure-repos-git
