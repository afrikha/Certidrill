id: az400-3c-secret-script-input
objective: "3.3.5"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Litware has a YAML pipeline in Azure Pipelines. A secret variable named **apiKey** is defined in the pipeline settings with **Keep this value secret** selected. A Bash step runs `./call-api.sh`, which must receive the value of apiKey. The value must not be stored in the repository.

    Which two step definitions meet the requirements? Each correct answer presents a complete solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware dispose d'un pipeline YAML dans Azure Pipelines. Une variable secrète nommée **apiKey** est définie dans les paramètres du pipeline avec l'option **Keep this value secret**. Une étape Bash exécute `./call-api.sh`, qui doit recevoir la valeur d'apiKey. La valeur ne doit pas être stockée dans le dépôt.

    Quelles sont les deux définitions d'étape qui répondent aux exigences ? Chaque bonne réponse constitue une solution complète.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "`bash: ./call-api.sh`, with the script reading `$APIKEY` and no other change", fr: "`bash: ./call-api.sh`, le script lisant `$APIKEY`, sans autre modification" } }
    - { id: b, text: { en: "`bash: ./call-api.sh \"$(apiKey)\"`, with the script reading its first argument", fr: "`bash: ./call-api.sh \"$(apiKey)\"`, le script lisant son premier argument" } }
    - { id: c, text: { en: "`bash: ./call-api.sh` with `env: { API_KEY: $(apiKey) }`, the script reading `$API_KEY`", fr: "`bash: ./call-api.sh` avec `env: { API_KEY: $(apiKey) }`, le script lisant `$API_KEY`" } }
    - { id: d, text: { en: "`bash: ./call-api.sh` after moving apiKey to the YAML `variables` block, the script reading `$APIKEY`", fr: "`bash: ./call-api.sh` après avoir déplacé apiKey dans le bloc `variables` du YAML, le script lisant `$APIKEY`" } }
answer: { optionIds: [ b, c ] }
explanation:
  correct:
    en: |
      Secret variables are not exported automatically as environment variables. You can pass the value as an argument with the macro syntax, which is expanded before the step runs and masked in the logs, or map it explicitly to an environment variable with `env` on the step.
    fr: |
      Les variables secrètes ne sont pas exportées automatiquement en variables d'environnement. Vous pouvez transmettre la valeur en argument avec la syntaxe macro, développée avant l'exécution de l'étape et masquée dans les journaux, ou la mapper explicitement vers une variable d'environnement avec `env` sur l'étape.
  options:
    a: { en: "Unlike regular variables, a secret is not mapped to an environment variable, so `$APIKEY` is empty.", fr: "Contrairement aux variables ordinaires, un secret n'est pas mappé vers une variable d'environnement : `$APIKEY` est vide." }
    d: { en: "A value in the YAML file is stored in the repository in clear text, which breaks the requirement.", fr: "Une valeur placée dans le fichier YAML est stockée en clair dans le dépôt, ce qui enfreint l'exigence." }
references:
  - title: Define variables
    url: https://learn.microsoft.com/en-us/azure/devops/pipelines/process/variables
