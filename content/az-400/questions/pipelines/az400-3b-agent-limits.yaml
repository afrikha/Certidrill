id: az400-3b-agent-limits
objective: "3.3.2"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Northwind is sizing the agent capacity of a private Azure DevOps project.

    Which value should you use for each limit? To answer, drag the appropriate values to the correct limits. Each value may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind dimensionne la capacité d'agents d'un projet Azure DevOps privé.

    Quelle valeur devez-vous utiliser pour chaque limite ? Pour répondre, faites glisser les valeurs appropriées vers les limites correspondantes. Chaque valeur peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: m30, text: "30 minutes" }
    - { id: m60, text: "60 minutes" }
    - { id: m360, text: "360 minutes" }
    - { id: m1800, text: { en: "1,800 minutes", fr: "1 800 minutes" } }
    - { id: d2, text: { en: "2 days", fr: "2 jours" } }
    - { id: d7, text: { en: "7 days", fr: "7 jours" } }
  targets:
    - id: freerun
      text: { en: "Maximum duration of a run on the free Microsoft-hosted parallel job", fr: "Durée maximale d'une exécution sur le travail parallèle gratuit hébergé par Microsoft" }
    - id: freemonth
      text: { en: "Monthly limit of the free Microsoft-hosted grant", fr: "Limite mensuelle de l'octroi gratuit hébergé par Microsoft" }
    - id: paidjob
      text: { en: "Maximum duration of a job on a paid Microsoft-hosted parallel job", fr: "Durée maximale d'un travail sur un travail parallèle hébergé par Microsoft payant" }
    - id: mdpjob
      text: { en: "Maximum duration of a job on a Managed DevOps Pools agent", fr: "Durée maximale d'un travail sur un agent Managed DevOps Pools" }
answer:
  mapping: { freerun: m60, freemonth: m1800, paidjob: m360, mdpjob: d2 }
explanation:
  correct:
    en: |
      The free Microsoft-hosted grant for private projects runs one job at a time, up to 60 minutes per run and 1,800 minutes per month. A paid Microsoft-hosted parallel job removes the monthly limit and allows jobs of up to 360 minutes. Managed DevOps Pools allows jobs of up to two days; seven days is how long its agents can keep their state.
    fr: |
      L'octroi gratuit hébergé par Microsoft des projets privés exécute un travail à la fois, jusqu'à 60 minutes par exécution et 1 800 minutes par mois. Un travail parallèle hébergé par Microsoft payant supprime la limite mensuelle et autorise des travaux de 360 minutes au plus. Managed DevOps Pools autorise des travaux de deux jours au plus ; sept jours correspondent à la durée pendant laquelle ses agents peuvent conserver leur état.
references:
  - title: Configure and pay for parallel jobs
    url: https://learn.microsoft.com/en-us/azure/devops/pipelines/licensing/concurrent-jobs
  - title: Overview of Managed DevOps Pools
    url: https://learn.microsoft.com/en-us/azure/devops/managed-devops-pools/overview
