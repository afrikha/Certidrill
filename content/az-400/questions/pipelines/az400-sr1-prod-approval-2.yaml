id: az400-sr1-prod-approval-2
objective: "3.3.9"
type: series_yesno
series: az400-sr1-prod-approval
seriesOrder: 2
difficulty: 2
status: draft
stem:
  en: You add a ManualValidation task in an agentless job before each Production stage.
  fr: Vous ajoutez une tâche ManualValidation dans un travail sans agent avant chaque phase Production.
body:
  solution:
    en: |
      In each pipeline, you add the following job to a stage that runs before the stage that deploys to Production, and you document the job in the pipeline template that teams copy for new pipelines.

      ```yaml
      - job: waitForApproval
        pool: server
        timeoutInMinutes: 1500
        steps:
        - task: ManualValidation@1
          timeoutInMinutes: 1440
          inputs:
            notifyUsers: '[Retail]\Release Approvers'
            approvers: '[Retail]\Release Approvers'
            onTimeout: 'reject'
      ```
    fr: |
      Dans chaque pipeline, vous ajoutez le travail suivant à une phase qui s'exécute avant la phase qui déploie sur Production, et vous documentez ce travail dans le modèle de pipeline que les équipes copient pour les nouveaux pipelines.

      ```yaml
      - job: waitForApproval
        pool: server
        timeoutInMinutes: 1500
        steps:
        - task: ManualValidation@1
          timeoutInMinutes: 1440
          inputs:
            notifyUsers: '[Retail]\Release Approvers'
            approvers: '[Retail]\Release Approvers'
            onTimeout: 'reject'
      ```
answer: { value: false }
explanation:
  correct:
    en: The ManualValidation task pauses the run until an approver resumes it, but it lives in the YAML file, so a developer who can edit the pipeline can delete the job. It must also be added to each new pipeline, which neither guarantees coverage nor minimizes effort; an Approvals check on the Production environment does both.
    fr: "La tâche ManualValidation suspend l'exécution jusqu'à ce qu'un approbateur la reprenne, mais elle se trouve dans le fichier YAML : un développeur qui peut modifier le pipeline peut supprimer le travail. Elle doit aussi être ajoutée à chaque nouveau pipeline, ce qui ne garantit pas la couverture et ne réduit pas l'effort ; une vérification Approvals sur l'environnement Production assure les deux."
references:
  - title: ManualValidation@1 - Manual validation v1 task
    url: https://learn.microsoft.com/en-us/azure/devops/pipelines/tasks/reference/manual-validation-v1
  - title: Define approvals and checks
    url: https://learn.microsoft.com/en-us/azure/devops/pipelines/process/approvals
