id: az400-3d-run-from-package
objective: "3.4.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Tailspin Toys deploys an ASP.NET Core web app to Azure App Service on Windows by copying the files of a ZIP package into wwwroot. Some deployments fail because files are locked by the running app, and after a failed deployment the app sometimes runs with a mix of old and new files.

    You need to make each deployment atomic, so that the app runs either the complete previous version or the complete new version. The app never writes to its own content folder.

    What should you do?
  fr: |
    Tailspin Toys déploie une application web ASP.NET Core sur Azure App Service sous Windows en copiant les fichiers d'un package ZIP dans wwwroot. Certains déploiements échouent, car des fichiers sont verrouillés par l'application en cours d'exécution, et après un déploiement en échec, l'application s'exécute parfois avec un mélange d'anciens et de nouveaux fichiers.

    Vous devez rendre chaque déploiement atomique, pour que l'application exécute soit la version précédente complète, soit la nouvelle version complète. L'application n'écrit jamais dans son propre dossier de contenu.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Set WEBSITE_RUN_FROM_PACKAGE to 1 and deploy the ZIP package.", fr: "Définir WEBSITE_RUN_FROM_PACKAGE sur 1 et déployer le package ZIP." }
    - id: b
      text: { en: "Enable Always On and deploy the ZIP package.", fr: "Activer Always On et déployer le package ZIP." }
    - id: c
      text: { en: "Enable local cache and deploy the ZIP package.", fr: "Activer le cache local et déployer le package ZIP." }
    - id: d
      text: { en: "Add retryCountOnTaskFailure to the deployment task.", fr: "Ajouter retryCountOnTaskFailure à la tâche de déploiement." }
answer: { optionId: a }
explanation:
  correct:
    en: |
      With run from package, App Service mounts the ZIP package as a read-only wwwroot instead of extracting its files. This removes file lock conflicts between the deployment and the running app and ensures that only fully deployed apps run. The app doesn't write to its content folder, so the read-only wwwroot isn't a problem.
    fr: |
      Avec l'exécution à partir d'un package, App Service monte le package ZIP en tant que wwwroot en lecture seule au lieu d'extraire ses fichiers. Cela supprime les conflits de verrouillage de fichiers entre le déploiement et l'application en cours d'exécution, et garantit que seules des applications entièrement déployées s'exécutent. L'application n'écrit pas dans son dossier de contenu : le wwwroot en lecture seule n'est pas un problème.
  options:
    b:
      en: "Always On keeps the app loaded; files are still copied one by one and can still be locked."
      fr: "Always On maintient l'application chargée ; les fichiers sont toujours copiés un par un et peuvent toujours être verrouillés."
    c:
      en: "Local cache isn't compatible with running from a package and doesn't make the file copy atomic."
      fr: "Le cache local n'est pas compatible avec l'exécution à partir d'un package et ne rend pas la copie des fichiers atomique."
    d:
      en: "A retry can repeat a failed copy, but a partial deployment can still leave mixed files in wwwroot."
      fr: "Une relance peut répéter une copie en échec, mais un déploiement partiel peut toujours laisser des fichiers mélangés dans wwwroot."
references:
  - title: Run your app in Azure App Service directly from a ZIP package
    url: https://learn.microsoft.com/en-us/azure/app-service/deploy-run-package
