id: az400-3a-ver-nuget-resolution
objective: "3.1.3"
type: hotarea
difficulty: 3
status: draft
stem:
  en: |
    An Azure Artifacts feed contains the versions of the package **Fabrikam.Geo** shown in the following table. The feed is the only package source, and the package is not in the local NuGet cache.

    Two projects reference Fabrikam.Geo with different version attributes. Answer each prompt by selecting the version that NuGet restores.

    NOTE: Each correct selection is worth one point.
  fr: |
    Un flux Azure Artifacts contient les versions du package **Fabrikam.Geo** présentées dans le tableau suivant. Le flux est la seule source de packages, et le package n'est pas dans le cache NuGet local.

    Deux projets référencent Fabrikam.Geo avec des attributs de version différents. Répondez à chaque consigne en sélectionnant la version que NuGet restaure.

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
    - { id: p1, text: { en: "Project A: Version=\"1.4\"", fr: "Projet A : Version=\"1.4\"" } }
    - { id: p2, text: { en: "Project B: Version=\"1.*\"", fr: "Projet B : Version=\"1.*\"" } }
  grid:
    header: [{ en: "Version", fr: "Version" }, { en: "Published", fr: "Publiée" }]
    rows:
      - [{ text: "1.3.0", area: v130 }, { text: "2026-03-02" }]
      - [{ text: "1.4.0-beta.2", area: v140b }, { text: "2026-04-11" }]
      - [{ text: "1.4.2", area: v142 }, { text: "2026-05-20" }]
      - [{ text: "1.6.0", area: v160 }, { text: "2026-07-08" }]
      - [{ text: "1.9.3", area: v193 }, { text: "2026-09-15" }]
      - [{ text: "2.0.0-rc.1", area: v200rc }, { text: "2026-10-27" }]
      - [{ text: "2.0.0", area: v200 }, { text: "2026-11-10" }]
answer:
  values: { p1: v142, p2: v193 }
explanation:
  correct:
    en: |
      Version="1.4" is a minimum version (1.4 or higher). NuGet applies the lowest applicable version rule: 1.4.0 does not exist, the prerelease 1.4.0-beta.2 sorts below 1.4.0, so NuGet picks the next lowest stable version, 1.4.2. A floating version such as 1.* resolves to the highest stable version that matches the pattern, 1.9.3; prereleases are considered only with a pattern such as 1.*-*.
    fr: |
      Version="1.4" est une version minimale (1.4 ou supérieure). NuGet applique la règle de la version applicable la plus basse : 1.4.0 n'existe pas et la préversion 1.4.0-beta.2 se classe avant 1.4.0, donc NuGet choisit la version stable immédiatement supérieure, 1.4.2. Une version flottante comme 1.* se résout vers la version stable la plus élevée qui correspond au modèle, 1.9.3 ; les préversions ne sont prises en compte qu'avec un modèle comme 1.*-*.
references:
  - title: How NuGet resolves package dependencies
    url: https://learn.microsoft.com/en-us/nuget/concepts/dependency-resolution
  - title: Package versioning
    url: https://learn.microsoft.com/en-us/nuget/concepts/package-versioning
