id: az400-3e-cs-param-files
objective: "3.5.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso deploys the infrastructure of an internal web app from a Bicep file named **main.bicep** to three environments: dev, test and production. The environments differ only in their resource names, App Service plan SKU and instance count.

    You need to implement a configuration strategy in which a change to a resource definition applies to every environment, and duplicated code is minimized.

    What should you do?
  fr: |
    Contoso déploie l'infrastructure d'une application web interne à partir d'un fichier Bicep nommé **main.bicep** vers trois environnements : dev, test et production. Les environnements ne diffèrent que par les noms des ressources, la référence SKU du plan App Service et le nombre d'instances.

    Vous devez implémenter une stratégie de configuration dans laquelle une modification d'une définition de ressource s'applique à tous les environnements, et où le code dupliqué est réduit au minimum.

    Que devez-vous faire ?
body:
  options:
    - id: b
      text:
        en: "Create one copy of main.bicep per environment, each with its own values."
        fr: "Créer une copie de main.bicep par environnement, chacune avec ses propres valeurs."
    - id: a
      text:
        en: "Create one .bicepparam file per environment that references main.bicep with a `using` statement."
        fr: "Créer un fichier .bicepparam par environnement qui référence main.bicep avec une instruction `using`."
    - id: c
      text:
        en: "Store the values of the three environments as tags on the target resource groups."
        fr: "Stocker les valeurs des trois environnements comme étiquettes sur les groupes de ressources cibles."
    - id: d
      text:
        en: "Deploy main.bicep in Complete mode to each environment."
        fr: "Déployer main.bicep en mode Complet (Complete) dans chaque environnement."
answer: { optionId: a }
explanation:
  correct:
    en: "A Bicep parameters file links to the Bicep file with `using` and sets the parameter values of one environment. The template stays unique, so every change to a resource definition reaches all environments, and only the values differ."
    fr: "Un fichier de paramètres Bicep est lié au fichier Bicep par `using` et définit les valeurs des paramètres d'un environnement. Le modèle reste unique : toute modification d'une définition de ressource atteint tous les environnements, et seules les valeurs diffèrent."
  options:
    b:
      en: "Copies of the template diverge over time, and each change must be made three times."
      fr: "Les copies du modèle divergent avec le temps, et chaque modification doit être faite trois fois."
    c:
      en: "Tags are metadata on resources; a Bicep deployment doesn't read its parameter values from them."
      fr: "Les étiquettes sont des métadonnées sur les ressources ; un déploiement Bicep n'y lit pas ses valeurs de paramètres."
    d:
      en: "The deployment mode controls what happens to resources that aren't in the template; it doesn't provide per-environment values."
      fr: "Le mode de déploiement détermine le sort des ressources absentes du modèle ; il ne fournit pas de valeurs par environnement."
references:
  - title: Create parameters files for Bicep deployment
    url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/bicep/parameter-files
