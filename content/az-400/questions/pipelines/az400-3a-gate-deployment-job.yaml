id: az400-3a-gate-deployment-job
objective: "3.2.1"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    An environment named **contoso-prod** has an Approvals check and a Query Azure Monitor alerts check. You are writing the Production stage of a YAML pipeline. The stage must meet the following requirements:

    - The checks of contoso-prod must be evaluated before the job runs, and the deployment must be recorded in the history of contoso-prod.
    - The deployment steps run once.
    - The pipeline artifacts of the run are downloaded automatically before the deployment steps.

    How should you complete the YAML? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Un environnement nommé **contoso-prod** a une vérification Approvals et une vérification Query Azure Monitor alerts. Vous écrivez la phase Production d'un pipeline YAML. La phase doit répondre aux exigences suivantes :

    - Les vérifications de contoso-prod doivent être évaluées avant l'exécution du job, et le déploiement doit être enregistré dans l'historique de contoso-prod.
    - Les étapes de déploiement s'exécutent une seule fois.
    - Les artefacts de pipeline de l'exécution sont téléchargés automatiquement avant les étapes de déploiement.

    Comment devez-vous compléter le YAML ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: yaml
  template: |
    - stage: Production
      dependsOn: Staging
      jobs:
        - [[kind]]: DeployApi
          pool:
            vmImage: ubuntu-latest
          environment: contoso-prod
          strategy:
            [[strat]]:
              [[hook]]:
                steps:
                  - script: ./deploy.sh $(Pipeline.Workspace)/api
  slots:
    - id: kind
      options:
        - { id: deployment, text: deployment }
        - { id: job, text: job }
        - { id: template, text: template }
    - id: strat
      options:
        - { id: runonce, text: runOnce }
        - { id: rolling, text: rolling }
        - { id: canary, text: canary }
        - { id: parallel, text: parallel }
    - id: hook
      options:
        - { id: deploy, text: deploy }
        - { id: predeploy, text: preDeploy }
        - { id: route, text: routeTraffic }
        - { id: post, text: postRouteTraffic }
answer:
  values: { kind: deployment, strat: runonce, hook: deploy }
explanation:
  correct:
    en: |
      A deployment job targets an environment, so the checks of the environment run before the job and the deployment appears in the environment history. The runOnce strategy runs each lifecycle hook once. The Download Pipeline Artifact task is injected automatically only in the deploy hook.
    fr: |
      Un job de déploiement cible un environnement : les vérifications de l'environnement s'exécutent avant le job et le déploiement apparaît dans l'historique de l'environnement. La stratégie runOnce exécute chaque hook de cycle de vie une seule fois. La tâche Download Pipeline Artifact n'est injectée automatiquement que dans le hook deploy.
  options:
    job: { en: "A regular job does not record deployments to an environment, and artifacts are not downloaded automatically in it.", fr: "Un job standard n'enregistre pas de déploiements dans un environnement, et les artefacts n'y sont pas téléchargés automatiquement." }
    rolling: { en: "rolling deploys to virtual machine resources in batches.", fr: "rolling déploie sur des ressources de machines virtuelles par lots." }
    canary: { en: "canary deploys in increments to a growing share of the targets.", fr: "canary déploie par incréments sur une part croissante des cibles." }
    parallel: { en: "parallel is a strategy for regular jobs (job slicing), not a deployment strategy.", fr: "parallel est une stratégie de jobs standard (découpage de job), pas une stratégie de déploiement." }
    predeploy: { en: "preDeploy initializes resources before the deployment; artifacts are not downloaded automatically there.", fr: "preDeploy initialise des ressources avant le déploiement ; les artefacts n'y sont pas téléchargés automatiquement." }
    route: { en: "routeTraffic serves traffic to the updated version, after the deploy hook.", fr: "routeTraffic dirige le trafic vers la version mise à jour, après le hook deploy." }
    post: { en: "postRouteTraffic runs after the traffic is routed, typically to monitor health.", fr: "postRouteTraffic s'exécute après le routage du trafic, généralement pour surveiller l'intégrité." }
references:
  - title: Deployment jobs
    url: https://learn.microsoft.com/en-us/azure/devops/pipelines/process/deployment-jobs
