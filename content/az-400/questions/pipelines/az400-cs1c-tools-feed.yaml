id: az400-cs1c-tools-feed
objective: "3.1.2"
type: multi
caseStudy: az400-cs1c-southridge-video
difficulty: 3
status: draft
stem:
  en: |
    The builds will restore all their NuGet packages through studio-tools. The Proseware artists are guest users of the Azure DevOps organization and have no permission on studio-tools.

    You need to meet the pipeline requirements for nuget.org and for Proseware.

    Which two actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Les builds restaureront tous leurs packages NuGet par l'intermédiaire de studio-tools. Les artistes de Proseware sont des utilisateurs invités de l'organisation Azure DevOps et n'ont aucune autorisation sur studio-tools.

    Vous devez satisfaire les exigences relatives aux pipelines concernant nuget.org et Proseware.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Add nuget.org as an upstream source of studio-tools", fr: "Ajouter nuget.org comme source en amont de studio-tools" } }
    - { id: b, text: { en: "Grant the Proseware artists the Feed Reader role on studio-tools", fr: "Accorder aux artistes de Proseware le rôle Feed Reader sur studio-tools" } }
    - { id: c, text: { en: "Promote the validated versions to the @Local view and share that view with the Proseware artists", fr: "Promouvoir les versions validées dans la vue @Local et partager cette vue avec les artistes de Proseware" } }
    - { id: d, text: { en: "Promote the validated versions to the @Release view and share that view with the Proseware artists", fr: "Promouvoir les versions validées dans la vue @Release et partager cette vue avec les artistes de Proseware" } }
    - { id: e, text: { en: "Set a retention policy on studio-tools that keeps the 20 latest versions of each package", fr: "Définir sur studio-tools une stratégie de rétention qui conserve les 20 dernières versions de chaque package" } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: |
      With nuget.org as an upstream source, the feed saves a copy of every package that a build restores through it, and the saved copies stay available when nuget.org is down. A view exposes only the package versions promoted to it, and users who can access a view can download through it even without access to the feed, so promoting the validated versions to @Release and setting the view's visibility to the Proseware artists limits them to those versions.
    fr: |
      Avec nuget.org comme source en amont, le flux enregistre une copie de chaque package qu'une build restaure par son intermédiaire, et les copies enregistrées restent disponibles quand nuget.org est indisponible. Une vue n'expose que les versions de packages qui y ont été promues, et les utilisateurs qui ont accès à une vue peuvent télécharger par son intermédiaire même sans accès au flux : promouvoir les versions validées dans @Release et définir la visibilité de la vue pour les artistes de Proseware les limite à ces versions.
  options:
    b: { en: "Feed Reader on the feed lets the artists download every version, including the versions that were not validated.", fr: "Feed Reader sur le flux permet aux artistes de télécharger toutes les versions, y compris celles qui n'ont pas été validées." }
    c: { en: "@Local is the default view and already contains every package published to the feed or saved from upstream sources, so it does not filter the validated versions.", fr: "@Local est la vue par défaut et contient déjà tous les packages publiés dans le flux ou enregistrés depuis les sources en amont : elle ne filtre pas les versions validées." }
    e: { en: "Retention deletes old versions; it neither protects the builds from a nuget.org outage nor filters what Proseware can install.", fr: "La rétention supprime les anciennes versions ; elle ne protège pas les builds d'une panne de nuget.org et ne filtre pas ce que Proseware peut installer." }
references:
  - title: What are upstream sources?
    url: https://learn.microsoft.com/en-us/azure/devops/artifacts/concepts/upstream-sources
  - title: Manage permissions
    url: https://learn.microsoft.com/en-us/azure/devops/artifacts/feeds/feed-permissions
