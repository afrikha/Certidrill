id: az400-3d-swap-warmup-path
objective: "3.4.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Tailspin Toys has a Node.js web app on Linux in Azure App Service, with a staging slot. The app needs about two minutes after startup to load its caches, and it exposes the endpoint **/ready**, which returns HTTP 200 only when the caches are loaded.

    During recent swaps, users received errors because production traffic reached instances that were still loading. You need the swap to switch routing only after every instance of the staging slot returns HTTP 200 from /ready.

    What should you do?
  fr: |
    Tailspin Toys dispose d'une application web Node.js sous Linux dans Azure App Service, avec un emplacement staging. L'application a besoin d'environ deux minutes après le démarrage pour charger ses caches, et elle expose le point de terminaison **/ready**, qui ne renvoie HTTP 200 que lorsque les caches sont chargés.

    Lors des dernières permutations, des utilisateurs ont reçu des erreurs, car le trafic de production atteignait des instances encore en chargement. Vous devez faire en sorte que la permutation ne bascule le routage qu'après que chaque instance de l'emplacement staging renvoie HTTP 200 depuis /ready.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Set the Health check path of the app to /ready.", fr: "Définir le chemin de contrôle d'intégrité de l'application sur /ready." }
    - id: b
      text: { en: "Add an applicationInitialization section that requests /ready to web.config.", fr: "Ajouter à web.config une section applicationInitialization qui interroge /ready." }
    - id: c
      text: { en: "Set WEBSITE_SWAP_WARMUP_PING_PATH to /ready and WEBSITE_SWAP_WARMUP_PING_STATUSES to 200.", fr: "Définir WEBSITE_SWAP_WARMUP_PING_PATH sur /ready et WEBSITE_SWAP_WARMUP_PING_STATUSES sur 200." }
    - id: d
      text: { en: "Enable Always On on the staging slot.", fr: "Activer Always On sur l'emplacement staging." }
answer: { optionId: c }
explanation:
  correct:
    en: |
      During a swap, App Service warms up each instance of the source slot before it swaps the routing rules. The two app settings replace the default request to the root with a request to /ready and accept only HTTP 200, so the swap waits for the caches and stops if an instance never returns that code.
    fr: |
      Pendant une permutation, App Service préchauffe chaque instance de l'emplacement source avant de permuter les règles de routage. Les deux paramètres d'application remplacent la requête par défaut vers la racine par une requête vers /ready et n'acceptent que HTTP 200 : la permutation attend le chargement des caches et s'arrête si une instance ne renvoie jamais ce code.
  options:
    a:
      en: "Health check removes unhealthy instances from the load balancer during normal operation; it isn't the warm-up request of a swap."
      fr: "Le contrôle d'intégrité retire les instances défectueuses de l'équilibreur de charge pendant le fonctionnement normal ; ce n'est pas la requête de préchauffage d'une permutation."
    b:
      en: "web.config and applicationInitialization are IIS features of Windows apps; a Node.js app on Linux doesn't use them."
      fr: "web.config et applicationInitialization sont des fonctionnalités IIS des applications Windows ; une application Node.js sous Linux ne les utilise pas."
    d:
      en: "Always On keeps the app loaded between requests, but the swap still doesn't wait for /ready."
      fr: "Always On maintient l'application chargée entre les requêtes, mais la permutation n'attend toujours pas /ready."
references:
  - title: Set up staging environments in Azure App Service
    url: https://learn.microsoft.com/en-us/azure/app-service/deploy-staging-slots
