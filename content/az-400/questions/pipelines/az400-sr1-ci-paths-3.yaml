id: az400-sr1-ci-paths-3
objective: "3.3.4"
type: series_yesno
series: az400-sr1-ci-paths
seriesOrder: 3
difficulty: 2
status: draft
stem:
  en: You add a trigger with a branch include list and a docs path exclusion.
  fr: Vous ajoutez un déclencheur avec une liste d'inclusion de branches et une exclusion du chemin docs.
body:
  solution:
    en: |
      You add the following section to azure-pipelines.yml.

      ```yaml
      trigger:
        branches:
          include:
          - main
          - release/*
        paths:
          exclude:
          - docs
      ```
    fr: |
      Vous ajoutez la section suivante à azure-pipelines.yml.

      ```yaml
      trigger:
        branches:
          include:
          - main
          - release/*
        paths:
          exclude:
          - docs
      ```
answer: { value: true }
explanation:
  correct:
    en: The branch filter starts runs only for main and the release/ branches. A `paths` exclude without an include is equivalent to including everything, so a run starts when at least one changed file is outside docs, and a push that touches only docs is ignored.
    fr: "Le filtre de branches ne démarre des exécutions que pour main et les branches release/. Un `exclude` sous `paths` sans `include` équivaut à tout inclure : une exécution démarre dès qu'au moins un fichier modifié se trouve hors de docs, et une poussée qui ne touche que docs est ignorée."
references:
  - title: trigger definition
    url: https://learn.microsoft.com/en-us/azure/devops/pipelines/yaml-schema/trigger
  - title: Build Azure Repos Git or TFS Git repositories
    url: https://learn.microsoft.com/en-us/azure/devops/pipelines/repos/azure-repos-git
