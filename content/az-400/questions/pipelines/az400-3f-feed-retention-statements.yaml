id: az400-3f-feed-retention-statements
objective: "3.6.4"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Tailspin Toys has an Azure Artifacts feed named **game-libs**. Package retention is enabled with a maximum of 10 versions per package and 30 days to keep recently downloaded packages. Validated versions are promoted to the @Release view.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin Toys dispose d'un flux Azure Artifacts nommé **game-libs**. La rétention des packages est activée avec un maximum de 10 versions par package et 30 jours de conservation des packages récemment téléchargés. Les versions validées sont promues vers la vue @Release.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          A version that was downloaded 12 days ago is kept even though its package has 15 versions.
        fr: |
          Une version téléchargée il y a 12 jours est conservée même si son package compte 15 versions.
    - id: s2
      text:
        en: |
          A version promoted to @Release is deleted when its package exceeds 10 versions and the version was not downloaded for 30 days.
        fr: |
          Une version promue vers @Release est supprimée lorsque son package dépasse 10 versions et que la version n'a pas été téléchargée depuis 30 jours.
    - id: s3
      text:
        en: |
          After retention deletes version 2.3.0 of a package, the team can publish a new build of that package as version 2.3.0.
        fr: |
          Après la suppression de la version 2.3.0 d'un package par la rétention, l'équipe peut publier un nouveau build de ce package en version 2.3.0.
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: |
      A version is deleted only when the package has reached the maximum number of versions and the version was not downloaded during the configured period, so a version downloaded 12 days ago is kept. Versions promoted to a view are exempt from retention. Published versions are immutable, and a deleted version number stays reserved forever.
    fr: |
      Une version n'est supprimée que si le package a atteint le nombre maximal de versions et que la version n'a pas été téléchargée pendant la période configurée : une version téléchargée il y a 12 jours est donc conservée. Les versions promues vers une vue sont exemptées de la rétention. Les versions publiées sont immuables, et un numéro de version supprimé reste réservé définitivement.
references:
  - title: Delete and recover packages
    url: https://learn.microsoft.com/en-us/azure/devops/artifacts/how-to/delete-and-recover-packages
