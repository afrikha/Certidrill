id: az400-3e-db-deploy-report
objective: "3.4.8"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    Northwind deploys the schema of an Azure SQL database named **sqldb-inventory** from a .dacpac file by using the **SqlAzureDacpacDeployment@1** task in a multi-stage YAML pipeline.

    A new rule states that before each production deployment, a database administrator must read the exact list of changes that the deployment will make to the production database, and the changes must be applied only after the administrator agrees.

    Which two actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind déploie le schéma d'une base de données Azure SQL nommée **sqldb-inventory** à partir d'un fichier .dacpac avec la tâche **SqlAzureDacpacDeployment@1** dans un pipeline YAML à phases multiples.

    Une nouvelle règle impose qu'avant chaque déploiement en production, un administrateur de bases de données lise la liste exacte des modifications que le déploiement apportera à la base de production, et que les modifications ne soient appliquées qu'après son accord.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text:
        en: "Add a job that runs the task with `DeploymentAction: 'DriftReport'` against the production database and publishes the report as a pipeline artifact."
        fr: "Ajouter un travail qui exécute la tâche avec `DeploymentAction: 'DriftReport'` sur la base de production et publie le rapport comme artefact de pipeline."
    - id: b
      text:
        en: "Add a job that runs the task with `DeploymentAction: 'DeployReport'` against the production database and publishes the file in `$(SqlDeploymentOutputFile)` as a pipeline artifact."
        fr: "Ajouter un travail qui exécute la tâche avec `DeploymentAction: 'DeployReport'` sur la base de production et publie le fichier de `$(SqlDeploymentOutputFile)` comme artefact de pipeline."
    - id: c
      text:
        en: "Add a job that runs the task with `DeploymentAction: 'Extract'` against the production database and publishes the .dacpac file as a pipeline artifact."
        fr: "Ajouter un travail qui exécute la tâche avec `DeploymentAction: 'Extract'` sur la base de production et publie le fichier .dacpac comme artefact de pipeline."
    - id: d
      text:
        en: "Add an approval check, assigned to the administrators, on the environment targeted by the deployment job that runs `DeploymentAction: 'Publish'`."
        fr: "Ajouter une vérification d'approbation, attribuée aux administrateurs, sur l'environnement ciblé par le travail de déploiement qui exécute `DeploymentAction: 'Publish'`."
    - id: e
      text:
        en: "Add a branch policy that requires an administrator to approve pull requests that change the database project."
        fr: "Ajouter une stratégie de branche qui exige l'approbation d'un administrateur pour les demandes de tirage qui modifient le projet de base de données."
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: "DeployReport compares the .dacpac file with the target database and writes an XML report of the changes a Publish would make; the task exposes the file path in the SqlDeploymentOutputFile output variable, so the pipeline can publish it for review. An approval check on the production environment pauses the Publish job until an administrator approves it."
    fr: "DeployReport compare le fichier .dacpac à la base cible et écrit un rapport XML des modifications qu'une action Publish effectuerait ; la tâche expose le chemin du fichier dans la variable de sortie SqlDeploymentOutputFile, ce qui permet au pipeline de le publier pour examen. Une vérification d'approbation sur l'environnement de production met en pause le travail Publish jusqu'à l'approbation d'un administrateur."
  options:
    a:
      en: "DriftReport lists the changes made to a registered database since it was last registered, not the changes the next deployment will make."
      fr: "DriftReport liste les modifications apportées à une base inscrite depuis sa dernière inscription, pas les modifications que le prochain déploiement effectuera."
    c:
      en: "Extract creates a .dacpac file from the existing database; it doesn't compare it with the new version."
      fr: "Extract crée un fichier .dacpac à partir de la base existante ; elle ne le compare pas à la nouvelle version."
    e:
      en: "A pull request review shows source changes, not the actual changes against the production database, and it doesn't hold the deployment."
      fr: "L'examen d'une demande de tirage montre les modifications du code source, pas les modifications réelles sur la base de production, et il ne retient pas le déploiement."
references:
  - title: SqlAzureDacpacDeployment@1 - Azure SQL Database deployment v1 task
    url: https://learn.microsoft.com/en-us/azure/devops/pipelines/tasks/reference/sql-azure-dacpac-deployment-v1
  - title: SqlPackage
    url: https://learn.microsoft.com/en-us/sql/tools/sqlpackage/sqlpackage
