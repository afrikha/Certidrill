id: az400-3e-cs-appconfig-import
objective: "3.5.2"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove keeps the application settings of all environments in one Azure App Configuration store named **appcs-woodgrove**. The keys are identical in every environment; the production instances of the app load only the key-values that have the label **prod**.

    A release stage must import the file **config/settings.prod.json** from the repository into the store. Access keys are disabled on the store, and the stage authenticates with the Microsoft Entra identity of its service connection.

    How should you complete the Azure CLI command? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove conserve les paramètres d'application de tous ses environnements dans un magasin Azure App Configuration nommé **appcs-woodgrove**. Les clés sont identiques dans chaque environnement ; les instances de production de l'application ne chargent que les paires clé-valeur qui portent l'étiquette **prod**.

    Une phase de mise en production doit importer le fichier **config/settings.prod.json** du dépôt dans le magasin. Les clés d'accès sont désactivées sur le magasin, et la phase s'authentifie avec l'identité Microsoft Entra de sa connexion de service.

    Comment devez-vous compléter la commande Azure CLI ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: bash
  template: |
    az appconfig kv import --name appcs-woodgrove \
      --source [[src]] --path config/settings.prod.json --format json --separator : \
      --label [[label]] --auth-mode [[auth]] --yes
  slots:
    - id: src
      options:
        - { id: file, text: file }
        - { id: appconfig, text: appconfig }
        - { id: appservice, text: appservice }
        - { id: aks, text: aks }
    - id: label
      options:
        - { id: prod, text: prod }
        - { id: nolabel, text: "'\\0'" }
        - { id: any, text: "'*'" }
    - id: auth
      options:
        - { id: login, text: login }
        - { id: key, text: key }
        - { id: anonymous, text: anonymous }
answer:
  values: { src: file, label: prod, auth: login }
explanation:
  correct:
    en: "`--source file` imports key-values from a JSON, YAML or properties file given by `--path`. The `prod` label creates key-values that share the keys of the other environments but are selected only by the production instances. `--auth-mode login` uses the signed-in Microsoft Entra identity instead of an access key."
    fr: "`--source file` importe des paires clé-valeur depuis un fichier JSON, YAML ou properties indiqué par `--path`. L'étiquette `prod` crée des paires clé-valeur qui partagent les clés des autres environnements, mais que seules les instances de production sélectionnent. `--auth-mode login` utilise l'identité Microsoft Entra connectée au lieu d'une clé d'accès."
  options:
    appconfig: { en: "This source copies key-values from another App Configuration store.", fr: "Cette source copie des paires clé-valeur depuis un autre magasin App Configuration." }
    appservice: { en: "This source imports the app settings of an App Service app.", fr: "Cette source importe les paramètres d'application d'une application App Service." }
    nolabel: { en: "\\0 is the null label: the key-values would have no label and wouldn't be selected as production values.", fr: "\\0 est l'étiquette nulle : les paires clé-valeur n'auraient pas d'étiquette et ne seraient pas sélectionnées comme valeurs de production." }
    any: { en: "* is a query pattern that matches any label; it isn't a label to assign.", fr: "* est un modèle de requête qui correspond à toutes les étiquettes ; ce n'est pas une étiquette à attribuer." }
    key: { en: "Key authentication uses an access key, and access keys are disabled on the store.", fr: "L'authentification par clé utilise une clé d'accès, et les clés d'accès sont désactivées sur le magasin." }
    anonymous: { en: "Anonymous mode sends no credentials, so the request isn't made with the service connection identity.", fr: "Le mode anonyme n'envoie aucune information d'identification : la requête n'utilise pas l'identité de la connexion de service." }
references:
  - title: Understand Azure App Configuration key-value store
    url: https://learn.microsoft.com/en-us/azure/azure-app-configuration/concept-key-value
  - title: az appconfig kv
    url: https://learn.microsoft.com/en-us/cli/azure/appconfig/kv
