id: az400-3b-auto-github-native
objective: "3.3.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Proseware hosts all its repositories in a GitHub Enterprise Cloud organization. Developers use Dependabot, GitHub Advanced Security code scanning and GitHub Projects, and the company doesn't use Azure DevOps.

    You need to add CI/CD for a new web app that deploys to Azure App Service. The solution must minimize the number of platforms that developers use and the administrative effort.

    What should you use?
  fr: |
    Proseware héberge tous ses dépôts dans une organisation GitHub Enterprise Cloud. Les développeurs utilisent Dependabot, l'analyse du code de GitHub Advanced Security et GitHub Projects, et l'entreprise n'utilise pas Azure DevOps.

    Vous devez mettre en place la CI/CD d'une nouvelle application web déployée sur Azure App Service. La solution doit réduire au minimum le nombre de plateformes utilisées par les développeurs et l'effort d'administration.

    Que devez-vous utiliser ?
body:
  options:
    - { id: a, text: { en: "Azure Pipelines YAML pipelines connected to the repository through the Azure Pipelines GitHub App", fr: "Des pipelines YAML Azure Pipelines connectés au dépôt par l'application GitHub Azure Pipelines" } }
    - { id: b, text: { en: "Azure Pipelines classic build and release pipelines that use the GitHub repository", fr: "Des pipelines de build et de mise en production classiques Azure Pipelines qui utilisent le dépôt GitHub" } }
    - { id: c, text: { en: "GitHub Actions workflows that sign in to Azure by using the azure/login action", fr: "Des workflows GitHub Actions qui se connectent à Azure avec l'action azure/login" } }
    - { id: d, text: { en: "Azure DevOps Server with self-hosted agents that clone the GitHub repository", fr: "Azure DevOps Server avec des agents auto-hébergés qui clonent le dépôt GitHub" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      The code, the security features and the work tracking are already on GitHub. GitHub Actions runs workflows stored next to the code, on GitHub-hosted runners, and deploys to Azure after the azure/login action signs in, so developers keep a single platform and there is no Azure DevOps organization to administer.
    fr: |
      Le code, les fonctionnalités de sécurité et le suivi du travail sont déjà sur GitHub. GitHub Actions exécute des workflows stockés avec le code, sur des exécuteurs hébergés par GitHub, et déploie sur Azure après la connexion de l'action azure/login : les développeurs conservent une seule plateforme et il n'y a aucune organisation Azure DevOps à administrer.
  options:
    a: { en: "Azure Pipelines works with GitHub but adds an Azure DevOps organization to manage.", fr: "Azure Pipelines fonctionne avec GitHub mais ajoute une organisation Azure DevOps à gérer." }
    b: { en: "Classic pipelines add Azure DevOps and aren't stored as code next to the application.", fr: "Les pipelines classiques ajoutent Azure DevOps et ne sont pas stockés sous forme de code avec l'application." }
    d: { en: "Azure DevOps Server adds an on-premises server and agents to maintain.", fr: "Azure DevOps Server ajoute un serveur local et des agents à maintenir." }
references:
  - title: Authenticate to Azure from GitHub Actions by OpenID Connect
    url: https://learn.microsoft.com/en-us/azure/developer/github/connect-from-azure-openid-connect
