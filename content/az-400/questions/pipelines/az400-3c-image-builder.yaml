id: az400-3c-image-builder
objective: "3.3.7"
type: single
difficulty: 1
status: draft
stem:
  en: |
    The platform team at Adatum maintains the VM images used by its Managed DevOps Pools. Every week, the team must produce a new image version that contains the latest OS updates and build tools. The image must be created by a managed Azure service from a declarative template that runs shell and PowerShell customizations, and distributed to an Azure Compute Gallery. The solution must minimize the infrastructure the team maintains.

    What should you use?
  fr: |
    L'équipe plateforme d'Adatum gère les images de machine virtuelle utilisées par ses pools Managed DevOps Pools. Chaque semaine, l'équipe doit produire une nouvelle version d'image qui contient les dernières mises à jour du système d'exploitation et les derniers outils de build. L'image doit être créée par un service Azure managé à partir d'un modèle déclaratif qui exécute des personnalisations shell et PowerShell, puis distribuée vers une Azure Compute Gallery. La solution doit réduire au minimum l'infrastructure que l'équipe gère.

    Que devez-vous utiliser ?
body:
  options:
    - { id: a, text: Azure Update Manager }
    - { id: b, text: Azure Container Registry Tasks }
    - { id: c, text: Azure Machine Configuration }
    - { id: d, text: Azure VM Image Builder }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Azure VM Image Builder is a fully managed service built on HashiCorp Packer. You describe the source image, the File, Shell and PowerShell customizations and the distribution targets in an image template, and the service builds the image and distributes it to an Azure Compute Gallery, a managed image or a VHD.
    fr: |
      Azure VM Image Builder est un service entièrement managé basé sur HashiCorp Packer. Vous décrivez l'image source, les personnalisations File, Shell et PowerShell et les cibles de distribution dans un modèle d'image, et le service génère l'image puis la distribue vers une Azure Compute Gallery, une image managée ou un VHD.
  options:
    a: { en: "Update Manager patches existing machines; it doesn't produce versioned images.", fr: "Update Manager applique des correctifs aux machines existantes ; il ne produit pas d'images versionnées." }
    b: { en: "ACR Tasks build container images, not VM images for agent pools.", fr: "ACR Tasks génère des images conteneur, pas des images de machine virtuelle pour des pools d'agents." }
    c: { en: "Machine Configuration audits and configures the settings of running machines; it doesn't build images.", fr: "Machine Configuration audite et configure les paramètres de machines en cours d'exécution ; elle ne génère pas d'images." }
references:
  - title: Azure VM Image Builder overview
    url: https://learn.microsoft.com/en-us/azure/virtual-machines/image-builder-overview
  - title: Overview of Managed DevOps Pools
    url: https://learn.microsoft.com/en-us/azure/devops/managed-devops-pools/overview
