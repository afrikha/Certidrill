id: az400-3e-dsc-stack-sub-cli
objective: "3.5.4"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Northwind's platform team deploys a subscription-scope Bicep file named **platform.bicep**. The file creates several resource groups and the resources in them. You are moving the deployment to a deployment stack.

    The stack must meet the following requirements:

    - When a resource is removed from the template, it's deleted from Azure.
    - When a resource group is removed from the template, it's kept in Azure.
    - Nobody can modify or delete the managed resources outside the stack.

    How should you complete the command? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    L'équipe plateforme de Northwind déploie un fichier Bicep à l'étendue de l'abonnement nommé **platform.bicep**. Le fichier crée plusieurs groupes de ressources et les ressources qu'ils contiennent. Vous migrez ce déploiement vers une pile de déploiement.

    La pile doit respecter les exigences suivantes :

    - Lorsqu'une ressource est retirée du modèle, elle est supprimée d'Azure.
    - Lorsqu'un groupe de ressources est retiré du modèle, il est conservé dans Azure.
    - Personne ne peut modifier ni supprimer les ressources gérées en dehors de la pile.

    Comment devez-vous compléter la commande ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: bash
  template: |
    az stack sub create --name stack-platform --location westeurope \
      --template-file infra/platform.bicep \
      --parameters @infra/platform.parameters.json \
      --action-on-unmanage [[aou]] \
      --deny-settings-mode [[deny]]
  slots:
    - id: aou
      options:
        - { id: detach, text: detachAll }
        - { id: delres, text: deleteResources }
        - { id: delall, text: deleteAll }
    - id: deny
      options:
        - { id: none, text: none }
        - { id: denydel, text: denyDelete }
        - { id: denywd, text: denyWriteAndDelete }
answer:
  values: { aou: delres, deny: denywd }
explanation:
  correct:
    en: "`deleteResources` deletes the managed resources that are no longer in the template but only detaches resource groups, while `deleteAll` would delete the resource groups too. `denyWriteAndDelete` creates a deny assignment that blocks both changes and deletions of the managed resources."
    fr: "`deleteResources` supprime les ressources gérées qui ne figurent plus dans le modèle, mais se contente de détacher les groupes de ressources, alors que `deleteAll` supprimerait aussi les groupes de ressources. `denyWriteAndDelete` crée une attribution de refus qui bloque à la fois les modifications et les suppressions des ressources gérées."
  options:
    detach: { en: "detachAll leaves removed resources in Azure, unmanaged.", fr: "detachAll laisse dans Azure les ressources retirées, sans gestion." }
    delall: { en: "deleteAll also deletes the resource groups removed from the template, with everything they contain.", fr: "deleteAll supprime aussi les groupes de ressources retirés du modèle, avec tout ce qu'ils contiennent." }
    none: { en: "none creates no deny assignment.", fr: "none ne crée aucune attribution de refus." }
    denydel: { en: "denyDelete blocks deletions only; the resources could still be modified.", fr: "denyDelete bloque uniquement les suppressions ; les ressources pourraient encore être modifiées." }
references:
  - title: Create and deploy Azure deployment stacks in Bicep
    url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/bicep/deployment-stacks
  - title: az stack sub
    url: https://learn.microsoft.com/en-us/cli/azure/stack/sub
