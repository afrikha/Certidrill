id: az400-3e-dsc-stack-cleanup
objective: "3.5.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Two teams at Fabrikam deploy resources to the same resource group, **rg-shared**. The web team deploys its resources from a Bicep file in an Azure Pipelines pipeline; the data team deploys its own resources from another pipeline.

    When the web team removes a resource from its Bicep file, the next deployment must delete that resource from Azure. The deployments of the web team must never delete the data team's resources.

    What should the web team use?
  fr: |
    Deux équipes de Fabrikam déploient des ressources dans le même groupe de ressources, **rg-shared**. L'équipe web déploie ses ressources à partir d'un fichier Bicep dans un pipeline Azure Pipelines ; l'équipe données déploie ses propres ressources depuis un autre pipeline.

    Lorsque l'équipe web supprime une ressource de son fichier Bicep, le déploiement suivant doit supprimer cette ressource d'Azure. Les déploiements de l'équipe web ne doivent jamais supprimer les ressources de l'équipe données.

    Que doit utiliser l'équipe web ?
body:
  options:
    - id: a
      text:
        en: "A deployment in Complete mode"
        fr: "Un déploiement en mode Complete"
    - id: b
      text:
        en: "A deployment in Incremental mode"
        fr: "Un déploiement en mode Incremental"
    - id: c
      text:
        en: "A deployment stack with the action on unmanage set to `deleteResources`"
        fr: "Une pile de déploiement avec l'action sur les ressources non gérées définie sur `deleteResources`"
    - id: d
      text:
        en: "A CanNotDelete lock on rg-shared and a deployment in Complete mode"
        fr: "Un verrou Suppression (CanNotDelete) sur rg-shared et un déploiement en mode Complete"
answer: { optionId: c }
explanation:
  correct:
    en: "A deployment stack tracks the resources that its template defines. When a resource is removed from the template, `deleteResources` deletes it on the next update, while resources the stack never managed, such as the data team's, are left untouched."
    fr: "Une pile de déploiement suit les ressources définies par son modèle. Lorsqu'une ressource est retirée du modèle, `deleteResources` la supprime à la mise à jour suivante, tandis que les ressources que la pile n'a jamais gérées, comme celles de l'équipe données, restent intactes."
  options:
    a:
      en: "Complete mode deletes every resource of the resource group that isn't in the template, including the data team's resources."
      fr: "Le mode Complete supprime toutes les ressources du groupe de ressources absentes du modèle, y compris celles de l'équipe données."
    b:
      en: "Incremental mode leaves the removed resource in Azure."
      fr: "Le mode Incremental laisse la ressource retirée dans Azure."
    d:
      en: "Complete mode doesn't delete resources in a locked resource group, so the removed resource would stay."
      fr: "Le mode Complete ne supprime pas les ressources d'un groupe de ressources verrouillé : la ressource retirée resterait."
references:
  - title: Create and deploy Azure deployment stacks in Bicep
    url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/bicep/deployment-stacks
  - title: Azure Resource Manager deployment modes
    url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/templates/deployment-modes
