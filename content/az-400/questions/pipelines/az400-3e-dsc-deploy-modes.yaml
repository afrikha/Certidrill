id: az400-3e-dsc-deploy-modes
objective: "3.5.4"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Wingtip redeploys the same ARM templates and Bicep files on every release to keep its environments in their desired state. You review how Azure Resource Manager deployment modes behave.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Wingtip redéploie les mêmes modèles ARM et fichiers Bicep à chaque mise en production pour maintenir ses environnements dans leur état souhaité. Vous examinez le comportement des modes de déploiement d'Azure Resource Manager.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "In Incremental mode, a resource that exists in the resource group but isn't in the template is deleted."
        fr: "En mode Incremental, une ressource qui existe dans le groupe de ressources mais pas dans le modèle est supprimée."
    - id: s2
      text:
        en: "Complete mode can be used for a deployment at subscription scope."
        fr: "Le mode Complete peut être utilisé pour un déploiement à l'étendue de l'abonnement."
    - id: s3
      text:
        en: "In Incremental mode, a property that is omitted from a redeployed resource is reset to its default value."
        fr: "En mode Incremental, une propriété omise d'une ressource redéployée est réinitialisée à sa valeur par défaut."
answer:
  values: { s1: false, s2: false, s3: true }
explanation:
  correct:
    en: "Incremental mode, the default, leaves unlisted resources unchanged. Complete mode is supported only for root-level templates at resource group scope, not for subscription deployments, linked or nested templates, or the portal. Properties aren't merged: redeploying a resource reapplies all its properties, so any property you omit returns to its default."
    fr: "Le mode Incremental, par défaut, laisse inchangées les ressources non listées. Le mode Complete n'est pris en charge que pour les modèles de niveau racine à l'étendue du groupe de ressources, pas pour les déploiements d'abonnement, les modèles liés ou imbriqués ni le portail. Les propriétés ne sont pas fusionnées : le redéploiement d'une ressource réapplique toutes ses propriétés, et toute propriété omise revient donc à sa valeur par défaut."
references:
  - title: Azure Resource Manager deployment modes
    url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/templates/deployment-modes
