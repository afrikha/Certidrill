id: az400-3d-cli-script-deploy
objective: "3.4.7"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    Northwind Traders has a Bash script named **scripts/deploy-infra.sh** in its repository. The script runs `az` commands that create resources in an Azure subscription. The script must run in an Azure Pipelines YAML pipeline on a Microsoft-hosted Ubuntu agent.

    The script must be authenticated to Azure without any secret stored in Azure DevOps, and it must not run `az login` itself.

    Which two actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind Traders dispose d'un script Bash nommé **scripts/deploy-infra.sh** dans son dépôt. Le script exécute des commandes `az` qui créent des ressources dans un abonnement Azure. Le script doit s'exécuter dans un pipeline YAML Azure Pipelines sur un agent Ubuntu hébergé par Microsoft.

    Le script doit être authentifié auprès d'Azure sans aucun secret stocké dans Azure DevOps, et il ne doit pas exécuter `az login` lui-même.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text: { en: "Create an Azure Resource Manager service connection that uses workload identity federation.", fr: "Créer une connexion de service Azure Resource Manager qui utilise la fédération d'identité de charge de travail." }
    - id: b
      text: { en: "Store a client secret of a service principal in a secret pipeline variable.", fr: "Stocker un secret client d'un principal de service dans une variable de pipeline secrète." }
    - id: c
      text: { en: "Run the script with AzureCLI@2, with scriptType set to bash and scriptPath set to the script.", fr: "Exécuter le script avec AzureCLI@2, avec scriptType défini sur bash et scriptPath défini sur le script." }
    - id: d
      text: { en: "Run the script with AzureCLI@2, with scriptType set to batch and scriptPath set to the script.", fr: "Exécuter le script avec AzureCLI@2, avec scriptType défini sur batch et scriptPath défini sur le script." }
    - id: e
      text: { en: "Run the script in a Bash@3 task.", fr: "Exécuter le script dans une tâche Bash@3." }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |
      A service connection with workload identity federation authenticates with a federated token, so no secret is stored. AzureCLI@2 signs in to Azure with that connection before running the script, and `bash` is a script type supported on Linux agents.
    fr: |
      Une connexion de service avec fédération d'identité de charge de travail s'authentifie avec un jeton fédéré : aucun secret n'est stocké. AzureCLI@2 se connecte à Azure avec cette connexion avant d'exécuter le script, et `bash` est un type de script pris en charge sur les agents Linux.
  options:
    b:
      en: "A client secret is a stored secret, and the script would have to run az login itself."
      fr: "Un secret client est un secret stocké, et le script devrait exécuter az login lui-même."
    d:
      en: "batch scripts run on Windows agents; on Ubuntu, use bash or pscore."
      fr: "Les scripts batch s'exécutent sur des agents Windows ; sur Ubuntu, utilisez bash ou pscore."
    e:
      en: "Bash@3 runs the script without signing in to Azure, so the az commands aren't authenticated."
      fr: "Bash@3 exécute le script sans se connecter à Azure : les commandes az ne sont pas authentifiées."
references:
  - title: AzureCLI@2 - Azure CLI v2 task
    url: https://learn.microsoft.com/en-us/azure/devops/pipelines/tasks/reference/azure-cli-v2
