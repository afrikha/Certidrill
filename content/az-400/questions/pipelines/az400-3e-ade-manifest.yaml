id: az400-3e-ade-manifest
objective: "3.5.5"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    Tailspin's platform team adds an environment definition to the Azure Deployment Environments catalog. The folder **Environments/WebApi** of the catalog repository contains a Bicep file named **main.bicep** and the manifest file of the definition.

    You need to complete the manifest so that the environment is deployed from main.bicep by the built-in runner for this language.

    How should you complete the manifest? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    L'équipe plateforme de Tailspin ajoute une définition d'environnement au catalogue Azure Deployment Environments. Le dossier **Environments/WebApi** du dépôt du catalogue contient un fichier Bicep nommé **main.bicep** et le fichier manifeste de la définition.

    Vous devez compléter le manifeste pour que l'environnement soit déployé à partir de main.bicep par l'exécuteur intégré de ce langage.

    Comment devez-vous compléter le manifeste ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: yaml
  template: |
    name: WebApi
    version: 1.0.0
    summary: Web API with an Azure SQL database
    description: Deploys an App Service web app and an Azure SQL database
    runner: [[runner]]
    templatePath: [[path]]
    parameters:
    - id: "location"
      name: "location"
      description: "Location to deploy the environment resources"
      type: "string"
      required: false
  slots:
    - id: runner
      options:
        - { id: arm, text: ARM }
        - { id: bicep, text: Bicep }
        - { id: tf, text: Terraform }
        - { id: pwsh, text: PowerShell }
    - id: path
      options:
        - { id: main, text: main.bicep }
        - { id: azdeploy, text: azuredeploy.json }
        - { id: param, text: main.bicepparam }
        - { id: env, text: environment.yaml }
answer:
  values: { runner: bicep, path: main }
explanation:
  correct:
    en: "The environment.yaml manifest names the IaC framework in `runner` and the template file in `templatePath`. The built-in runners are ARM and Bicep; another framework, such as Terraform, needs a custom container image referenced in `runner`."
    fr: "Le manifeste environment.yaml indique l'infrastructure IaC dans `runner` et le fichier de modèle dans `templatePath`. Les exécuteurs intégrés sont ARM et Bicep ; une autre infrastructure, comme Terraform, exige une image conteneur personnalisée référencée dans `runner`."
  options:
    arm: { en: "The ARM runner deploys JSON ARM templates, not Bicep files.", fr: "L'exécuteur ARM déploie des modèles ARM JSON, pas des fichiers Bicep." }
    tf: { en: "Terraform has no built-in runner value; it requires a custom image, and the template here is Bicep.", fr: "Terraform n'a pas de valeur d'exécuteur intégrée ; il exige une image personnalisée, et le modèle est ici en Bicep." }
    azdeploy: { en: "The folder contains main.bicep, not a JSON template.", fr: "Le dossier contient main.bicep, pas un modèle JSON." }
    param: { en: "templatePath points to the template; parameters are declared in the manifest.", fr: "templatePath désigne le modèle ; les paramètres sont déclarés dans le manifeste." }
    env: { en: "environment.yaml is the manifest itself, not the template.", fr: "environment.yaml est le manifeste lui-même, pas le modèle." }
references:
  - title: Add and configure an environment definition in a catalog
    url: https://learn.microsoft.com/en-us/azure/deployment-environments/configure-environment-definition
