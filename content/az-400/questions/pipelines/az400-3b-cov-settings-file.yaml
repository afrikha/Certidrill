id: az400-3b-cov-settings-file
objective: "3.2.4"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    Northwind hosts a repository in Azure Repos. A build validation pipeline already posts a diff coverage status on pull requests that target main.

    You need to:

    - require 80% coverage of the changed lines instead of the default target;
    - post per-file coverage details as comments on pull requests.

    You write the following settings. Where should you store them? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind héberge un dépôt dans Azure Repos. Un pipeline de validation de build publie déjà un état de couverture différentielle sur les pull requests qui ciblent main.

    Vous devez :

    - exiger une couverture de 80 % des lignes modifiées au lieu de la cible par défaut ;
    - publier le détail de la couverture par fichier sous forme de commentaires sur les pull requests.

    Vous écrivez les paramètres suivants. Où devez-vous les stocker ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: yaml
  template:
    en: |
      # File name: [[file]]
      # Location: [[loc]]
      coverage:
        status:
          comments: on
          diff:
            target: 80%
    fr: |
      # Nom du fichier : [[file]]
      # Emplacement : [[loc]]
      coverage:
        status:
          comments: on
          diff:
            target: 80%
  slots:
    - id: file
      options:
        - { id: azpcov, text: azurepipelines-coverage.yml }
        - { id: azp, text: azure-pipelines.yml }
        - { id: codecov, text: codecov.yml }
        - { id: runsettings, text: coverage.runsettings }
    - id: loc
      options:
        - { id: testproj, text: { en: "The folder of the test project", fr: "Le dossier du projet de test" } }
        - { id: root, text: { en: "The root of the repository", fr: "La racine du dépôt" } }
        - { id: azdo, text: { en: "The .azuredevops folder of the repository", fr: "Le dossier .azuredevops du dépôt" } }
answer:
  values: { file: azpcov, loc: root }
explanation:
  correct:
    en: |
      Azure DevOps reads the coverage settings from a file named azurepipelines-coverage.yml at the root of the repository. `diff.target` replaces the default 70% target, and `comments: on` posts per-file coverage as pull request comments. The settings apply from the next pipeline run.
    fr: |
      Azure DevOps lit les paramètres de couverture dans un fichier nommé azurepipelines-coverage.yml à la racine du dépôt. `diff.target` remplace la cible par défaut de 70 %, et `comments: on` publie la couverture par fichier dans des commentaires de pull request. Les paramètres s'appliquent à partir de l'exécution suivante du pipeline.
  options:
    azp: { en: "azure-pipelines.yml defines the pipeline, not the coverage status settings.", fr: "azure-pipelines.yml définit le pipeline, pas les paramètres de l'état de couverture." }
    codecov: { en: "codecov.yml configures the third-party Codecov service.", fr: "codecov.yml configure le service tiers Codecov." }
    runsettings: { en: "A .runsettings file configures test execution and data collectors, not the pull request status.", fr: "Un fichier .runsettings configure l'exécution des tests et les collecteurs de données, pas l'état de la pull request." }
    azdo: { en: "The .azuredevops folder can hold pull request templates; the coverage file must be at the root.", fr: "Le dossier .azuredevops peut contenir des modèles de pull request ; le fichier de couverture doit être à la racine." }
references:
  - title: Code coverage for pull requests
    url: https://learn.microsoft.com/en-us/azure/devops/pipelines/test/codecoverage-for-pullrequests
