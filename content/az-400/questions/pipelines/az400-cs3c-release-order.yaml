id: az400-cs3c-release-order
objective: "3.4.8"
type: ordering
caseStudy: az400-cs3c-litware-energy
difficulty: 2
status: draft
stem:
  en: |
    You are designing the production stage that will deploy release 4.2 of MeterHub. The stage must meet the deployment requirements and must account for the database change of release 4.2.

    Which four actions should the stage perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Vous concevez la phase de production qui déploiera la version 4.2 de MeterHub. La phase doit satisfaire les exigences de déploiement et tenir compte de la modification de base de données de la version 4.2.

    Quelles sont les quatre actions que la phase doit effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: dacpac, text: { en: "Deploy the .dacpac file of the db artifact to sqldb-meterhub by using the SqlAzureDacpacDeployment@1 task.", fr: "Déployer le fichier .dacpac de l'artefact db sur sqldb-meterhub à l'aide de la tâche SqlAzureDacpacDeployment@1." } }
    - { id: slot, text: { en: "Deploy the drop package to the staging slot of app-meterhub by using the AzureWebApp@1 task.", fr: "Déployer le package drop dans l'emplacement staging de app-meterhub à l'aide de la tâche AzureWebApp@1." } }
    - { id: smoke, text: { en: "Run the smoke tests against the URL of the staging slot.", fr: "Exécuter les tests de fumée sur l'URL de l'emplacement staging." } }
    - { id: swap, text: { en: "Swap the staging slot with production by using the AzureAppServiceManage@0 task.", fr: "Permuter l'emplacement staging avec la production à l'aide de la tâche AzureAppServiceManage@0." } }
    - { id: stop, text: { en: "Stop app-meterhub until the database deployment completes.", fr: "Arrêter app-meterhub jusqu'à la fin du déploiement de la base de données." } }
    - { id: prod, text: { en: "Deploy the drop package directly to the production slot of app-meterhub.", fr: "Déployer le package drop directement dans l'emplacement de production de app-meterhub." } }
answer:
  sequence: [dacpac, slot, smoke, swap]
explanation:
  correct:
    en: |
      Release 4.2 fails at startup without the new column, so the database must be updated first; because the change is backward compatible, release 4.1 keeps running in production meanwhile. The package is then deployed to the staging slot, which uses the same database, and smoke-tested there. Finally, the swap warms up the staging instances before it switches the routing, so production gets release 4.2 without dropping requests.
    fr: |
      La version 4.2 échoue au démarrage sans la nouvelle colonne : la base de données doit donc être mise à jour en premier ; comme la modification est rétrocompatible, la version 4.1 continue de fonctionner en production pendant ce temps. Le package est ensuite déployé dans l'emplacement staging, qui utilise la même base de données, et y fait l'objet de tests de fumée. Enfin, la permutation préchauffe les instances de staging avant de basculer le routage : la production reçoit la version 4.2 sans perte de requêtes.
  options:
    stop:
      en: |
        Stopping the app causes downtime, and it is unnecessary because the schema change is backward compatible with release 4.1.
      fr: |
        Arrêter l'application entraîne un temps d'arrêt, et c'est inutile, car la modification du schéma est rétrocompatible avec la version 4.1.
    prod:
      en: |
        Deploying directly to production skips the validation in the staging slot that requirement 2 demands.
      fr: |
        Déployer directement en production saute la validation dans l'emplacement staging qu'exige l'exigence 2.
references:
  - title: Deploy to Azure SQL Database
    url: https://learn.microsoft.com/en-us/azure/devops/pipelines/targets/azure-sqldb
  - title: Set Up Staging Environments
    url: https://learn.microsoft.com/en-us/azure/app-service/deploy-staging-slots
