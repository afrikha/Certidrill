id: az400-3b-agent-mdp-jobs
objective: "3.3.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Fabrikam created a Managed DevOps Pool with **Maximum agents** set to 8. The Azure DevOps organization has the free self-hosted parallel job and two purchased Microsoft-hosted parallel jobs.

    During peak hours, pipelines that target the pool wait in the queue, and only one job runs on the pool at a time.

    You need up to eight jobs to run concurrently on the pool. The solution must minimize cost. What should you do?
  fr: |
    Fabrikam a créé un Managed DevOps Pool dont le paramètre **Maximum agents** vaut 8. L'organisation Azure DevOps dispose du travail parallèle auto-hébergé gratuit et de deux travaux parallèles hébergés par Microsoft achetés.

    Aux heures de pointe, les pipelines qui ciblent le pool attendent dans la file d'attente, et un seul travail s'exécute à la fois sur le pool.

    Vous devez permettre l'exécution simultanée de huit travaux au maximum sur le pool. La solution doit réduire les coûts au minimum. Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Increase Maximum agents to 16.", fr: "Augmenter Maximum agents à 16." } }
    - { id: b, text: { en: "Purchase six more Microsoft-hosted parallel jobs.", fr: "Acheter six travaux parallèles hébergés par Microsoft supplémentaires." } }
    - { id: c, text: { en: "Configure standby agents for the pool.", fr: "Configurer des agents en veille pour le pool." } }
    - { id: d, text: { en: "Purchase seven self-hosted parallel jobs.", fr: "Acheter sept travaux parallèles auto-hébergés." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Managed DevOps Pools agents are self-hosted agents, so they consume self-hosted parallel jobs, an organization-level setting separate from Maximum agents. With only the free self-hosted parallel job, the pool can provision eight agents but runs one job at a time; one free job plus seven purchased ones allows eight concurrent jobs.
    fr: |
      Les agents Managed DevOps Pools sont des agents auto-hébergés : ils consomment des travaux parallèles auto-hébergés, un paramètre de l'organisation distinct de Maximum agents. Avec le seul travail parallèle auto-hébergé gratuit, le pool peut provisionner huit agents mais n'exécute qu'un travail à la fois ; un travail gratuit plus sept travaux achetés permettent huit travaux simultanés.
  options:
    a: { en: "More agents don't help: concurrency is limited by the self-hosted parallel jobs.", fr: "Plus d'agents n'aident pas : la simultanéité est limitée par les travaux parallèles auto-hébergés." }
    b: { en: "Microsoft-hosted parallel jobs apply to Microsoft-hosted agents, not to Managed DevOps Pools.", fr: "Les travaux parallèles hébergés par Microsoft s'appliquent aux agents hébergés par Microsoft, pas à Managed DevOps Pools." }
    c: { en: "Standby agents reduce start-up time and add compute cost; they don't raise the number of concurrent jobs.", fr: "Les agents en veille réduisent le temps de démarrage et ajoutent un coût de calcul ; ils n'augmentent pas le nombre de travaux simultanés." }
references:
  - title: Managed DevOps Pools pricing
    url: https://learn.microsoft.com/en-us/azure/devops/managed-devops-pools/pricing
