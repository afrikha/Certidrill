id: az400-3b-trg-ui-schedule
objective: "3.3.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Fabrikam's YAML pipeline was created several years ago, and a nightly schedule was then configured in the pipeline settings. A developer pushes the following schedule to main to replace it.

    ```yaml
    schedules:
      - cron: '30 18 * * 1-5'
        displayName: Weekday build
        branches:
          include:
            - main
        always: true
    ```

    A week later, the pipeline still runs only at the time of the old schedule.

    What should you do?
  fr: |
    Le pipeline YAML de Fabrikam a été créé il y a plusieurs années, et une planification nocturne a alors été configurée dans les paramètres du pipeline. Un développeur envoie la planification suivante sur main pour la remplacer.

    ```yaml
    schedules:
      - cron: '30 18 * * 1-5'
        displayName: Weekday build
        branches:
          include:
            - main
        always: true
    ```

    Une semaine plus tard, le pipeline s'exécute toujours uniquement à l'heure de l'ancienne planification.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Change the time zone of the Azure DevOps organization to UTC.", fr: "Définir le fuseau horaire de l'organisation Azure DevOps sur UTC." } }
    - { id: b, text: { en: "Add `trigger: none` to the YAML file.", fr: "Ajouter `trigger: none` au fichier YAML." } }
    - { id: c, text: { en: "Remove the scheduled triggers defined in the Triggers settings of the pipeline, then push a change to the repository.", fr: "Supprimer les déclencheurs planifiés définis dans les paramètres Triggers du pipeline, puis envoyer une modification au dépôt." } }
    - { id: d, text: { en: "Move the schedules section to a template that the pipeline extends.", fr: "Déplacer la section schedules dans un modèle que le pipeline étend." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      When a pipeline has both YAML schedules and scheduled triggers defined in the UI, only the UI-defined triggers run. You must remove the UI schedules from the Triggers settings and push a change so that the YAML schedules are evaluated.
    fr: |
      Quand un pipeline possède à la fois des planifications YAML et des déclencheurs planifiés définis dans l'interface, seuls ceux de l'interface s'exécutent. Vous devez supprimer les planifications de l'interface dans les paramètres Triggers et envoyer une modification pour que les planifications YAML soient évaluées.
  options:
    a: { en: "Cron schedules are always evaluated in UTC; the organization time zone doesn't change which schedule runs.", fr: "Les planifications cron sont toujours évaluées en UTC ; le fuseau horaire de l'organisation ne change pas la planification exécutée." }
    b: { en: "trigger: none disables CI triggers; it doesn't remove the UI schedule.", fr: "trigger: none désactive les déclencheurs de CI ; il ne supprime pas la planification de l'interface." }
    d: { en: "Schedules must be defined in the main YAML file, not in templates.", fr: "Les planifications doivent être définies dans le fichier YAML principal, pas dans des modèles." }
references:
  - title: Configure schedules for pipelines
    url: https://learn.microsoft.com/en-us/azure/devops/pipelines/process/scheduled-triggers
