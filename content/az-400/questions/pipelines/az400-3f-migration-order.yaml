id: az400-3f-migration-order
objective: "3.6.5"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove Bank has a classic build pipeline named **loans-build** that uses variables defined in the classic editor. You are replacing it with a YAML pipeline.

    The new pipeline must be validated against the classic pipeline before the team stops using loans-build, and the run history of loans-build must be kept.

    Which five actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Woodgrove Bank dispose d'un pipeline de build classique nommé **loans-build** qui utilise des variables définies dans l'éditeur classique. Vous le remplacez par un pipeline YAML.

    Le nouveau pipeline doit être validé par rapport au pipeline classique avant que l'équipe cesse d'utiliser loans-build, et l'historique des exécutions de loans-build doit être conservé.

    Quelles sont les cinq actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 5
  actions:
    - { id: export, text: { en: "Export loans-build with Export to YAML.", fr: "Exporter loans-build avec Export to YAML." } }
    - { id: create, text: { en: "Create a YAML pipeline from the exported content and commit the file to the repository.", fr: "Créer un pipeline YAML à partir du contenu exporté et commiter le fichier dans le dépôt." } }
    - { id: vars, text: { en: "Redefine the variables of loans-build in the YAML file or in the pipeline settings.", fr: "Redéfinir les variables de loans-build dans le fichier YAML ou dans les paramètres du pipeline." } }
    - { id: compare, text: { en: "Run the YAML pipeline alongside loans-build and compare the results.", fr: "Exécuter le pipeline YAML en parallèle de loans-build et comparer les résultats." } }
    - { id: disable, text: { en: "Disable loans-build.", fr: "Désactiver loans-build." } }
    - { id: delete, text: { en: "Delete loans-build.", fr: "Supprimer loans-build." } }
    - { id: taskgroup, text: { en: "Convert loans-build into a task group.", fr: "Convertir loans-build en groupe de tâches." } }
answer:
  sequence: [ export, create, vars, compare, disable ]
explanation:
  correct:
    en: |
      Export to YAML produces a file that you paste into a new YAML pipeline. Variables defined in the classic editor are not carried over and must be redefined before the new pipeline can run correctly. Running both pipelines until the results match validates the migration; disabling the classic pipeline, rather than deleting it, keeps its run history.
    fr: |
      Export to YAML produit un fichier que vous collez dans un nouveau pipeline YAML. Les variables définies dans l'éditeur classique ne sont pas reprises et doivent être redéfinies pour que le nouveau pipeline s'exécute correctement. Exécuter les deux pipelines jusqu'à obtenir les mêmes résultats valide la migration ; désactiver le pipeline classique, plutôt que le supprimer, conserve son historique d'exécutions.
  options:
    delete: { en: "Deleting the pipeline removes its runs, which must be kept.", fr: "Supprimer le pipeline supprime ses exécutions, qui doivent être conservées." }
    taskgroup: { en: "Task groups are not supported in YAML pipelines.", fr: "Les groupes de tâches ne sont pas pris en charge dans les pipelines YAML." }
references:
  - title: Migrate your Classic pipeline to YAML
    url: https://learn.microsoft.com/en-us/azure/devops/pipelines/release/from-classic-pipelines
