id: az400-3f-deployment-group-migration
objective: "3.6.5"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Northwind Traders has a classic release pipeline whose Production stage deploys a website to a deployment group named **dg-web** that contains six Windows Server virtual machines. A pre-deployment approval by the operations lead is required before the stage starts.

    You are rewriting the release as a stage of a multi-stage YAML pipeline that uses a deployment job. The deployment must still target the six servers and still require the approval of the operations lead.

    Which two actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind Traders dispose d'un pipeline de mise en production classique dont la phase Production déploie un site web sur un groupe de déploiement nommé **dg-web** qui contient six machines virtuelles Windows Server. Une approbation de prédéploiement du responsable des opérations est exigée avant le démarrage de la phase.

    Vous réécrivez la mise en production sous forme de phase d'un pipeline YAML à phases multiples qui utilise un travail de déploiement. Le déploiement doit toujours cibler les six serveurs et toujours exiger l'approbation du responsable des opérations.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Create an environment and register the six servers as virtual machine resources by running the registration script on each server.", fr: "Créer un environnement et inscrire les six serveurs comme ressources de machine virtuelle en exécutant le script d'inscription sur chaque serveur." } }
    - { id: b, text: { en: "Reference dg-web in the pool property of the deployment job.", fr: "Référencer dg-web dans la propriété pool du travail de déploiement." } }
    - { id: c, text: { en: "Add an Approvals check on the environment with the operations lead as the approver.", fr: "Ajouter une vérification Approvals sur l'environnement avec le responsable des opérations comme approbateur." } }
    - { id: d, text: { en: "Export the classic release pipeline with Export to YAML and keep its approval settings.", fr: "Exporter le pipeline de mise en production classique avec Export to YAML et conserver ses paramètres d'approbation." } }
    - { id: e, text: { en: "Save the deployment tasks of the Production stage as a task group and reference it from the deployment job.", fr: "Enregistrer les tâches de déploiement de la phase Production comme groupe de tâches et le référencer depuis le travail de déploiement." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |
      Deployment groups are a classic feature; in YAML, an environment with virtual machine resources provides the same targeting, and machines are added by running the registration script that installs an agent. Approvals are not defined in the YAML file: they are checks configured on the environment, evaluated before a stage that targets it starts.
    fr: |
      Les groupes de déploiement sont une fonctionnalité classique ; en YAML, un environnement avec des ressources de machine virtuelle offre le même ciblage, et les machines sont ajoutées en exécutant le script d'inscription qui installe un agent. Les approbations ne sont pas définies dans le fichier YAML : ce sont des vérifications configurées sur l'environnement, évaluées avant le démarrage d'une phase qui le cible.
  options:
    b: { en: "A deployment group is not an agent pool, and YAML pipelines cannot target deployment groups.", fr: "Un groupe de déploiement n'est pas un pool d'agents, et les pipelines YAML ne peuvent pas cibler de groupes de déploiement." }
    d: { en: "Classic release pipelines do not support Export to YAML.", fr: "Les pipelines de mise en production classiques ne prennent pas en charge Export to YAML." }
    e: { en: "Task groups are not supported in YAML pipelines; use a template instead.", fr: "Les groupes de tâches ne sont pas pris en charge dans les pipelines YAML ; utilisez plutôt un modèle." }
references:
  - title: Manage VM resources in environments
    url: https://learn.microsoft.com/en-us/azure/devops/pipelines/process/environments-virtual-machines
  - title: Define approvals and checks
    url: https://learn.microsoft.com/en-us/azure/devops/pipelines/process/approvals
