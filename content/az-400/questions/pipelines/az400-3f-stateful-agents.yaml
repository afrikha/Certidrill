id: az400-3f-stateful-agents
objective: "3.6.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Woodgrove Bank runs the C++ build of its trading engine on a Managed DevOps Pools pool named **mdp-cpp**. The pool uses the default agent state and standby agent mode. A full build takes 40 minutes, but an incremental build that reuses the intermediate files of the previous run on the same agent takes 8 minutes.

    Jobs arrive at a steady rate during the working day. The pipelines do not process untrusted code, and the security team accepts that agents are reused. You need to minimize the build duration while keeping the Azure cost as low as possible.

    What should you configure?
  fr: |
    Woodgrove Bank exécute le build C++ de son moteur de trading sur un pool Managed DevOps Pools nommé **mdp-cpp**. Le pool utilise l'état d'agent et le mode d'agents en attente par défaut. Un build complet prend 40 minutes, mais un build incrémentiel qui réutilise les fichiers intermédiaires de l'exécution précédente sur le même agent prend 8 minutes.

    Les travaux arrivent à un rythme régulier pendant la journée de travail. Les pipelines ne traitent pas de code non approuvé, et l'équipe sécurité accepte la réutilisation des agents. Vous devez réduire au minimum la durée du build tout en maintenant le coût Azure aussi bas que possible.

    Que devez-vous configurer ?
body:
  options:
    - { id: a, text: { en: "Keep stateless agents and set the standby agent mode to Automatic with Best performance", fr: "Conserver des agents sans état et définir le mode d'agents en attente sur Automatic avec Best performance" } }
    - { id: b, text: { en: "Keep stateless agents and increase the Maximum agents setting of the pool", fr: "Conserver des agents sans état et augmenter le paramètre Maximum agents du pool" } }
    - { id: c, text: { en: "Switch to stateful agents and set a grace period for idle agents", fr: "Passer à des agents avec état et définir une période de grâce pour les agents inactifs" } }
    - { id: d, text: { en: "Move to a scale set agent pool that tears down virtual machines after every use", fr: "Passer à un pool d'agents de groupe identique qui supprime les machines virtuelles après chaque utilisation" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Stateless is the default agent state, so every job gets a fresh agent and always rebuilds from scratch. Stateful agents are reused across jobs and keep their files, which enables incremental builds. For a steady load on a stateful pool, a grace period that keeps idle agents waiting for the next job is the most cost-effective option and does not require standby mode.
    fr: |
      L'état sans état est l'état d'agent par défaut : chaque travail obtient un nouvel agent et regénère donc tout. Les agents avec état sont réutilisés entre les travaux et conservent leurs fichiers, ce qui permet les builds incrémentiels. Pour une charge régulière sur un pool avec état, une période de grâce qui garde les agents inactifs en attente du travail suivant est l'option la plus économique et ne nécessite pas le mode d'agents en attente.
  options:
    a: { en: "Standby agents reduce the wait for an agent, but stateless agents are discarded after each job, so every build stays a full build, and standby hours are billed.", fr: "Les agents en attente réduisent l'attente d'un agent, mais les agents sans état sont supprimés après chaque travail : chaque build reste complet, et les heures d'attente sont facturées." }
    b: { en: "More agents allow more parallel jobs but do not keep intermediate files between runs.", fr: "Davantage d'agents permettent davantage de travaux parallèles, mais ne conservent pas les fichiers intermédiaires entre les exécutions." }
    d: { en: "Tearing down VMs after every use gives each job a clean machine, which prevents incremental builds.", fr: "Supprimer les machines virtuelles après chaque utilisation donne une machine propre à chaque travail, ce qui empêche les builds incrémentiels." }
references:
  - title: Configure scaling
    url: https://learn.microsoft.com/en-us/azure/devops/managed-devops-pools/configure-scaling
