id: az400-3d-flag-import-task
objective: "3.4.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Contoso stores the definitions of its feature flags in a JSON file named **flags/production.json** in the repository of a web app. Changes to the file are reviewed in pull requests.

    The release pipeline must write the flags of the file to an Azure App Configuration store named **appcs-contoso** with the label **Production** during each deployment. The solution must minimize custom scripting.

    Which task should you add to the deployment job?
  fr: |
    Contoso stocke les définitions de ses indicateurs de fonctionnalités dans un fichier JSON nommé **flags/production.json** dans le dépôt d'une application web. Les modifications du fichier sont révisées dans des demandes de tirage.

    Le pipeline de mise en production doit écrire les indicateurs du fichier dans un magasin Azure App Configuration nommé **appcs-contoso** avec l'étiquette **Production** à chaque déploiement. La solution doit réduire au minimum les scripts personnalisés.

    Quelle tâche devez-vous ajouter au travail de déploiement ?
body:
  options:
    - id: a
      text: AzureAppConfigurationExport@10
    - id: b
      text: AzureAppServiceSettings@1
    - id: c
      text: AzureAppConfigurationImport@10
    - id: d
      text: AzureKeyVault@2
answer: { optionId: c }
explanation:
  correct:
    en: |
      AzureAppConfigurationImport@10 imports a JSON, YAML, or properties file into App Configuration, with inputs such as `ConfigurationFile` and `Label`. Feature flags in the file are imported unless `ExcludeFeatureFlags` is set to true, so no script is needed. The identity of the service connection needs a data plane role that can write, such as App Configuration Data Owner.
    fr: |
      AzureAppConfigurationImport@10 importe un fichier JSON, YAML ou properties dans App Configuration, avec des entrées comme `ConfigurationFile` et `Label`. Les indicateurs de fonctionnalités du fichier sont importés sauf si `ExcludeFeatureFlags` vaut true : aucun script n'est nécessaire. L'identité de la connexion de service a besoin d'un rôle du plan de données qui peut écrire, comme App Configuration Data Owner.
  options:
    a:
      en: "The Export task reads key-values from the store into pipeline variables, the opposite direction."
      fr: "La tâche Export lit les paires clé-valeur du magasin dans des variables de pipeline, soit le sens inverse."
    b:
      en: "AzureAppServiceSettings@1 writes app settings of an App Service app, not feature flags of an App Configuration store."
      fr: "AzureAppServiceSettings@1 écrit les paramètres d'application d'une application App Service, pas les indicateurs d'un magasin App Configuration."
    d:
      en: "AzureKeyVault@2 downloads secrets from a key vault into pipeline variables."
      fr: "AzureKeyVault@2 télécharge les secrets d'un coffre de clés dans des variables de pipeline."
references:
  - title: AzureAppConfigurationImport@10 - Azure App Configuration Import v10 task
    url: https://learn.microsoft.com/en-us/azure/devops/pipelines/tasks/reference/azure-app-configuration-import-v10
  - title: AzureAppConfigurationExport@10 - Azure App Configuration Export v10 task
    url: https://learn.microsoft.com/en-us/azure/devops/pipelines/tasks/reference/azure-app-configuration-export-v10
