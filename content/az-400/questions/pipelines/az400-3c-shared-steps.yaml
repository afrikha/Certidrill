id: az400-3c-shared-steps
objective: "3.3.8"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso has 20 YAML pipelines in different Azure Repos repositories of the same project. Each pipeline must run the same five security scanning steps. The security team must be able to change the steps in one place, and each pipeline must be able to pass the path of its solution file.

    What should you create?
  fr: |
    Contoso dispose de 20 pipelines YAML dans différents dépôts Azure Repos du même projet. Chaque pipeline doit exécuter les cinq mêmes étapes d'analyse de sécurité. L'équipe de sécurité doit pouvoir modifier les étapes à un seul endroit, et chaque pipeline doit pouvoir transmettre le chemin de son fichier solution.

    Que devez-vous créer ?
body:
  options:
    - { id: a, text: { en: "A task group that contains the five tasks", fr: "Un groupe de tâches qui contient les cinq tâches" } }
    - { id: b, text: { en: "A variable group that contains the path of each solution", fr: "Un groupe de variables qui contient le chemin de chaque solution" } }
    - { id: c, text: { en: "A step template with a parameter, stored in a shared repository", fr: "Un modèle d'étapes avec un paramètre, stocké dans un dépôt partagé" } }
    - { id: d, text: { en: "A deployment group that contains the build agents", fr: "Un groupe de déploiement qui contient les agents de build" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      A step template defines the steps once and accepts typed parameters such as the solution path. Each pipeline declares the shared repository as a repository resource and inserts the template with `- template: scan.yml@alias`.
    fr: |
      Un modèle d'étapes définit les étapes une seule fois et accepte des paramètres typés, comme le chemin de la solution. Chaque pipeline déclare le dépôt partagé comme ressource de dépôt et insère le modèle avec `- template: scan.yml@alias`.
  options:
    a: { en: "Task groups are only supported in classic pipelines, not in YAML pipelines.", fr: "Les groupes de tâches ne sont pris en charge que dans les pipelines classiques, pas dans les pipelines YAML." }
    b: { en: "A variable group shares values, not steps.", fr: "Un groupe de variables partage des valeurs, pas des étapes." }
    d: { en: "Deployment groups are sets of target machines for classic release pipelines.", fr: "Les groupes de déploiement sont des ensembles de machines cibles pour les pipelines de mise en production classiques." }
references:
  - title: Use YAML templates in pipelines for reusable and secure processes
    url: https://learn.microsoft.com/en-us/azure/devops/pipelines/process/templates
  - title: Task groups in Classic pipelines
    url: https://learn.microsoft.com/en-us/azure/devops/pipelines/library/task-groups
