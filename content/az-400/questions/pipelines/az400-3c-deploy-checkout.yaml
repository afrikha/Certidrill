id: az400-3c-deploy-checkout
objective: "3.3.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Fabrikam has a YAML pipeline in Azure Pipelines. Stage **Deploy** contains a deployment job that targets the environment **staging** and uses the `runOnce` strategy. The pipeline artifact **drop** from the build stage is downloaded correctly in the `deploy` hook.

    The next step of the `deploy` hook runs `./scripts/configure-app.sh`, a script stored in the same repository as the pipeline. The step fails because the file is not found.

    What should you do?
  fr: |
    Fabrikam dispose d'un pipeline YAML dans Azure Pipelines. La phase **Deploy** contient un travail de déploiement qui cible l'environnement **staging** et utilise la stratégie `runOnce`. L'artefact de pipeline **drop** de la phase de build est correctement téléchargé dans le hook `deploy`.

    L'étape suivante du hook `deploy` exécute `./scripts/configure-app.sh`, un script stocké dans le même dépôt que le pipeline. L'étape échoue car le fichier est introuvable.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Add a `download: current` step before the script step.", fr: "Ajouter une étape `download: current` avant l'étape de script." } }
    - { id: b, text: { en: "Set `workspace: clean: all` on the deployment job.", fr: "Définir `workspace: clean: all` sur le travail de déploiement." } }
    - { id: c, text: { en: "Add a `checkout: self` step before the script step.", fr: "Ajouter une étape `checkout: self` avant l'étape de script." } }
    - { id: d, text: { en: "Change the strategy of the deployment job from runOnce to rolling.", fr: "Remplacer la stratégie runOnce du travail de déploiement par rolling." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      A deployment job doesn't clone the source repository automatically; it only injects the download of the pipeline artifacts in the `deploy` hook. Adding `checkout: self` makes the repository files, including the script, available to the job.
    fr: |
      Un travail de déploiement ne clone pas automatiquement le dépôt source ; il injecte seulement le téléchargement des artefacts de pipeline dans le hook `deploy`. L'ajout de `checkout: self` rend disponibles les fichiers du dépôt, dont le script.
  options:
    a: { en: "The artifacts are already downloaded; the missing file comes from the repository, not from an artifact.", fr: "Les artefacts sont déjà téléchargés ; le fichier manquant provient du dépôt, pas d'un artefact." }
    b: { en: "Cleaning the workspace deletes files before the job; it doesn't fetch the repository.", fr: "Le nettoyage de l'espace de travail supprime des fichiers avant le travail ; il ne récupère pas le dépôt." }
    d: { en: "The strategy changes how targets are updated, not whether the source is checked out; rolling also requires virtual machine resources.", fr: "La stratégie modifie la façon dont les cibles sont mises à jour, pas l'extraction de la source ; rolling exige en outre des ressources machine virtuelle." }
references:
  - title: Deployment jobs
    url: https://learn.microsoft.com/en-us/azure/devops/pipelines/process/deployment-jobs
