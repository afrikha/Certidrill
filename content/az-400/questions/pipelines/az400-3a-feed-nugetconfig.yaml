id: az400-3a-feed-nugetconfig
objective: "3.1.2"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Contoso has a project-scoped Azure Artifacts feed named **core-libs** in the project **Platform** of the organization **contoso**. Tested package versions are promoted to the @Release view. The mobile team's projects depend only on packages from core-libs.

    You need to create a nuget.config file for the mobile team. The file must meet the following requirements:

    - Restores ignore every package source defined at the user or machine level.
    - The projects can restore only the tested versions.

    How should you complete the file? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso dispose d'un flux Azure Artifacts délimité au projet nommé **core-libs** dans le projet **Platform** de l'organisation **contoso**. Les versions de packages testées sont promues vers la vue @Release. Les projets de l'équipe mobile ne dépendent que de packages de core-libs.

    Vous devez créer un fichier nuget.config pour l'équipe mobile. Le fichier doit répondre aux exigences suivantes :

    - Les restaurations ignorent toutes les sources de packages définies au niveau de l'utilisateur ou de l'ordinateur.
    - Les projets ne peuvent restaurer que les versions testées.

    Comment devez-vous compléter le fichier ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: text
  template: |
    <?xml version="1.0" encoding="utf-8"?>
    <configuration>
      <packageSources>
        [[clear]]
        <add key="core-libs" value="https://pkgs.dev.azure.com/contoso/Platform/_packaging/[[feed]]/nuget/v3/index.json" />
      </packageSources>
    </configuration>
  slots:
    - id: clear
      options:
        - { id: clear, text: "<clear />" }
        - { id: disabled, text: "<disabledPackageSources />" }
        - { id: nugetorg, text: "<add key=\"nuget.org\" value=\"https://api.nuget.org/v3/index.json\" />" }
    - id: feed
      options:
        - { id: release, text: "core-libs@Release" }
        - { id: base, text: "core-libs" }
        - { id: local, text: "core-libs@Local" }
        - { id: prerelease, text: "core-libs@Prerelease" }
answer:
  values: { clear: clear, feed: release }
explanation:
  correct:
    en: |
      `<clear />` removes the package sources inherited from the user-level and machine-level configuration files, so the restore uses only the sources listed in this file. A view is consumed by appending `@ViewName` to the feed name in the URL; core-libs@Release returns only the versions promoted to @Release.
    fr: |
      `<clear />` supprime les sources de packages héritées des fichiers de configuration de l'utilisateur et de l'ordinateur : la restauration n'utilise que les sources listées dans ce fichier. Une vue se consomme en ajoutant `@NomDeVue` au nom du flux dans l'URL ; core-libs@Release ne renvoie que les versions promues vers @Release.
  options:
    disabled: { en: "An empty disabledPackageSources section disables nothing; the inherited sources stay active.", fr: "Une section disabledPackageSources vide ne désactive rien ; les sources héritées restent actives." }
    nugetorg: { en: "Adding nuget.org creates a second source instead of ignoring the inherited ones.", fr: "Ajouter nuget.org crée une deuxième source au lieu d'ignorer les sources héritées." }
    base: { en: "The feed URL without a view is the @Local view, which contains every published version.", fr: "L'URL du flux sans vue correspond à la vue @Local, qui contient toutes les versions publiées." }
    local: { en: "@Local contains every published version and every package saved from upstream sources.", fr: "@Local contient toutes les versions publiées et tous les packages enregistrés depuis les sources en amont." }
    prerelease: { en: "@Prerelease would expose the versions promoted as prerelease, not only the tested ones.", fr: "@Prerelease exposerait les versions promues en préversion, pas uniquement les versions testées." }
references:
  - title: Promote packages and manage feed views
    url: https://learn.microsoft.com/en-us/azure/devops/artifacts/feeds/views
  - title: What are upstream sources?
    url: https://learn.microsoft.com/en-us/azure/devops/artifacts/concepts/upstream-sources
