id: az400-3f-hosted-parallel-count
objective: "3.6.3"
type: single
difficulty: 3
shuffle: false
status: draft
stem:
  en: |
    Contoso has an Azure DevOps organization with private projects only. Billing is set up, and the organization uses the free grant of Microsoft-hosted parallel jobs. No parallel job was purchased.

    The team needs to run up to three jobs at the same time on Microsoft-hosted agents. Some of the jobs run for 90 minutes. You need to purchase the minimum number of Microsoft-hosted parallel jobs that meets the requirement.

    How many Microsoft-hosted parallel jobs should you purchase?
  fr: |
    Contoso dispose d'une organisation Azure DevOps qui ne contient que des projets privés. La facturation est configurée, et l'organisation utilise l'octroi gratuit de travaux parallèles hébergés par Microsoft. Aucun travail parallèle n'a été acheté.

    L'équipe doit exécuter jusqu'à trois travaux en même temps sur des agents hébergés par Microsoft. Certains travaux durent 90 minutes. Vous devez acheter le nombre minimal de travaux parallèles hébergés par Microsoft qui satisfait l'exigence.

    Combien de travaux parallèles hébergés par Microsoft devez-vous acheter ?
body:
  options:
    - { id: a, text: "1" }
    - { id: b, text: "2" }
    - { id: c, text: "3" }
    - { id: d, text: "4" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      The free grant is one job of up to 60 minutes per run with 1,800 minutes per month, so it cannot run the 90-minute jobs. Buying the first Microsoft-hosted parallel job removes the time limits of that first job but does not add concurrency to the free grant: to run two jobs at once you buy two, so three concurrent jobs require three purchased parallel jobs.
    fr: |
      L'octroi gratuit correspond à un travail d'au plus 60 minutes par exécution avec 1 800 minutes par mois : il ne peut pas exécuter les travaux de 90 minutes. L'achat du premier travail parallèle hébergé par Microsoft supprime les limites de durée de ce premier travail mais n'ajoute pas de concurrence à l'octroi gratuit : pour exécuter deux travaux à la fois, vous en achetez deux, donc trois travaux simultanés exigent trois travaux parallèles achetés.
  options:
    a: { en: "One purchased job removes the time limit but still runs only one job at a time.", fr: "Un travail acheté supprime la limite de durée, mais n'exécute toujours qu'un travail à la fois." }
    b: { en: "The free job is not added to purchased jobs, so two purchased jobs run only two jobs at once.", fr: "Le travail gratuit ne s'ajoute pas aux travaux achetés : deux travaux achetés n'exécutent que deux travaux à la fois." }
    d: { en: "Four jobs allow four concurrent jobs, one more than required.", fr: "Quatre travaux permettent quatre travaux simultanés, soit un de plus que nécessaire." }
references:
  - title: Configure and pay for parallel jobs
    url: https://learn.microsoft.com/en-us/azure/devops/pipelines/licensing/concurrent-jobs
