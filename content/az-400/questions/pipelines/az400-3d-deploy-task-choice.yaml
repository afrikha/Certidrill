id: az400-3d-deploy-task-choice
objective: "3.4.7"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Woodgrove Bank is writing Azure Pipelines YAML pipelines for four deployments. All the target resources already exist.

    Which task should you use for each deployment? To answer, drag the appropriate tasks to the correct deployments. Each task may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove Bank écrit des pipelines YAML Azure Pipelines pour quatre déploiements. Toutes les ressources cibles existent déjà.

    Quelle tâche devez-vous utiliser pour chaque déploiement ? Pour répondre, faites glisser les tâches appropriées vers les déploiements correspondants. Chaque tâche peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: webApp, text: "AzureWebApp@1" }
    - { id: webAppContainer, text: "AzureWebAppContainer@1" }
    - { id: containerApps, text: "AzureContainerApps@1" }
    - { id: cli, text: "AzureCLI@2" }
    - { id: docker, text: "Docker@2" }
    - { id: manage, text: "AzureAppServiceManage@0" }
  targets:
    - id: t1
      text: { en: "Deploy the ZIP package of an ASP.NET Core app to an App Service web app on Linux", fr: "Déployer le package ZIP d'une application ASP.NET Core sur une application web App Service sous Linux" }
    - id: t2
      text: { en: "Deploy an image from Azure Container Registry to an App Service app configured as Web App for Containers", fr: "Déployer une image d'Azure Container Registry sur une application App Service configurée en tant que Web App for Containers" }
    - id: t3
      text: { en: "Deploy an image from Azure Container Registry to an Azure Container Apps app", fr: "Déployer une image d'Azure Container Registry sur une application Azure Container Apps" }
    - id: t4
      text: { en: "Run a Bash script of az commands that configures a storage account after the deployment", fr: "Exécuter un script Bash de commandes az qui configure un compte de stockage après le déploiement" }
answer:
  mapping: { t1: webApp, t2: webAppContainer, t3: containerApps, t4: cli }
explanation:
  correct:
    en: |
      AzureWebApp@1 deploys a package or folder of code to App Service. AzureWebAppContainer@1 deploys a container image to App Service. AzureContainerApps@1 deploys an existing image, or builds one, to Azure Container Apps. AzureCLI@2 signs in with the service connection and runs a Bash or PowerShell script of Azure CLI commands.
    fr: |
      AzureWebApp@1 déploie un package ou un dossier de code sur App Service. AzureWebAppContainer@1 déploie une image conteneur sur App Service. AzureContainerApps@1 déploie une image existante, ou en génère une, vers Azure Container Apps. AzureCLI@2 se connecte avec la connexion de service et exécute un script Bash ou PowerShell de commandes Azure CLI.
  options:
    docker: { en: "Docker@2 builds and pushes images; it doesn't deploy them to an Azure service.", fr: "Docker@2 génère et envoie des images ; il ne les déploie pas vers un service Azure." }
    manage: { en: "AzureAppServiceManage@0 starts, stops, restarts, or swaps App Service apps; it doesn't deploy code or images.", fr: "AzureAppServiceManage@0 démarre, arrête, redémarre ou permute des applications App Service ; il ne déploie ni code ni image." }
references:
  - title: AzureWebAppContainer@1 - Azure Web App for Containers v1 task
    url: https://learn.microsoft.com/en-us/azure/devops/pipelines/tasks/reference/azure-web-app-container-v1
  - title: AzureContainerApps@1 - Azure Container Apps Deploy v1 task
    url: https://learn.microsoft.com/en-us/azure/devops/pipelines/tasks/reference/azure-container-apps-v1
