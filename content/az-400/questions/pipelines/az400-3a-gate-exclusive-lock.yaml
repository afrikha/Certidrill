id: az400-3a-gate-exclusive-lock
objective: "3.2.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    The environment **stock-prod** has an Exclusive lock check. The Production stage of the pipeline that targets stock-prod does not set the lockBehavior property, and no other check is configured.

    Run 100 is deploying to stock-prod. While it is deploying, runs 101, 102 and 103 of the same pipeline reach the Production stage, in that order.

    What happens after run 100 completes?
  fr: |
    L'environnement **stock-prod** a une vérification Exclusive lock. La phase Production du pipeline qui cible stock-prod ne définit pas la propriété lockBehavior, et aucune autre vérification n'est configurée.

    L'exécution 100 est en cours de déploiement vers stock-prod. Pendant ce déploiement, les exécutions 101, 102 et 103 du même pipeline atteignent la phase Production, dans cet ordre.

    Que se passe-t-il une fois l'exécution 100 terminée ?
body:
  options:
    - { id: a, text: { en: "Runs 101, 102 and 103 deploy one after the other, in that order.", fr: "Les exécutions 101, 102 et 103 déploient l'une après l'autre, dans cet ordre." } }
    - { id: b, text: { en: "Only run 101 deploys, and runs 102 and 103 wait for a manual retry.", fr: "Seule l'exécution 101 déploie, et les exécutions 102 et 103 attendent une relance manuelle." } }
    - { id: c, text: { en: "Only run 103 deploys; runs 101 and 102 do not deploy to stock-prod.", fr: "Seule l'exécution 103 déploie ; les exécutions 101 et 102 ne déploient pas vers stock-prod." } }
    - { id: d, text: { en: "Runs 101, 102 and 103 deploy at the same time.", fr: "Les exécutions 101, 102 et 103 déploient en même temps." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Exclusive lock lets only one run use the resource at a time. When lockBehavior is not set, the default runLatest applies: only the latest run acquires the lock, so run 103 deploys and the older waiting runs do not. lockBehavior sequential would make all runs acquire the lock one after the other.
    fr: |
      Exclusive lock ne laisse qu'une exécution à la fois utiliser la ressource. Quand lockBehavior n'est pas défini, la valeur par défaut runLatest s'applique : seule la dernière exécution obtient le verrou, donc l'exécution 103 déploie et les exécutions plus anciennes en attente ne déploient pas. lockBehavior sequential ferait obtenir le verrou à toutes les exécutions l'une après l'autre.
  options:
    a: { en: "This is the behavior of lockBehavior sequential, not of the default runLatest.", fr: "C'est le comportement de lockBehavior sequential, pas celui de la valeur par défaut runLatest." }
    b: { en: "With runLatest, the latest run gets the lock, not the oldest one.", fr: "Avec runLatest, c'est la dernière exécution qui obtient le verrou, pas la plus ancienne." }
    d: { en: "An exclusive lock never lets several runs use the resource at the same time.", fr: "Un verrou exclusif ne laisse jamais plusieurs exécutions utiliser la ressource en même temps." }
references:
  - title: Define approvals and checks
    url: https://learn.microsoft.com/en-us/azure/devops/pipelines/process/approvals
