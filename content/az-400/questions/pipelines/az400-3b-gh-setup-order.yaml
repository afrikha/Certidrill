id: az400-3b-gh-setup-order
objective: "3.3.3"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove's code is in a GitHub repository named **orders-api** that contains an azure-pipelines.yml file. The Azure Pipelines GitHub App is already installed for orders-api.

    You need an Azure Pipelines pipeline to validate the pull requests that target main, and pull requests must not be mergeable until the pipeline succeeds.

    Which three actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Le code de Woodgrove se trouve dans un dépôt GitHub nommé **orders-api** qui contient un fichier azure-pipelines.yml. L'application GitHub Azure Pipelines est déjà installée pour orders-api.

    Un pipeline Azure Pipelines doit valider les pull requests qui ciblent main, et les pull requests ne doivent pas pouvoir être fusionnées tant que le pipeline n'a pas réussi.

    Quelles sont les trois actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - { id: create, text: { en: "In Azure DevOps, create a pipeline from the azure-pipelines.yml file of orders-api by selecting GitHub as the source.", fr: "Dans Azure DevOps, créer un pipeline à partir du fichier azure-pipelines.yml d'orders-api en sélectionnant GitHub comme source." } }
    - { id: run, text: { en: "Run the pipeline, for example by opening a pull request that targets main.", fr: "Exécuter le pipeline, par exemple en ouvrant une pull request qui cible main." } }
    - { id: protect, text: { en: "In GitHub, add a branch protection rule for main that requires the pipeline's status check.", fr: "Dans GitHub, ajouter pour main une règle de protection de branche qui exige la vérification d'état du pipeline." } }
    - { id: policy, text: { en: "Add a build validation branch policy for main in the Azure DevOps project.", fr: "Ajouter une stratégie de branche de validation de build pour main dans le projet Azure DevOps." } }
    - { id: pat, text: { en: "Create a GitHub PAT with the admin:repo_hook scope and store it in a variable group.", fr: "Créer un PAT GitHub avec l'étendue admin:repo_hook et le stocker dans un groupe de variables." } }
    - { id: forks, text: { en: "Enable **Make secrets available to builds of forks** for the pipeline.", fr: "Activer **Make secrets available to builds of forks** pour le pipeline." } }
answer:
  sequence: [ create, run, protect ]
explanation:
  correct:
    en: |
      You first create the pipeline from the YAML file in the GitHub repository. GitHub only learns the name of the status check after the pipeline has run, so you run it once, for example on a pull request. You can then select the pipeline as a required status check in the branch protection rule for main.
    fr: |
      Vous créez d'abord le pipeline à partir du fichier YAML du dépôt GitHub. GitHub ne connaît le nom de la vérification d'état qu'après une exécution du pipeline : vous l'exécutez donc une fois, par exemple sur une pull request. Vous pouvez ensuite sélectionner le pipeline comme vérification d'état obligatoire dans la règle de protection de branche de main.
  options:
    policy: { en: "Branch policies apply to Azure Repos; merging on GitHub is controlled by branch protection rules.", fr: "Les stratégies de branche s'appliquent à Azure Repos ; la fusion sur GitHub est contrôlée par les règles de protection de branche." }
    pat: { en: "The GitHub App already provides the connection; a PAT isn't needed.", fr: "L'application GitHub fournit déjà la connexion ; un PAT n'est pas nécessaire." }
    forks: { en: "Exposing secrets to fork builds doesn't gate merges and adds risk.", fr: "Exposer les secrets aux builds de duplications ne conditionne pas les fusions et ajoute un risque." }
references:
  - title: Build GitHub repositories
    url: https://learn.microsoft.com/en-us/azure/devops/pipelines/repos/github
