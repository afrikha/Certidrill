id: az400-3f-flaky-exclude
objective: "3.6.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Tailspin Toys uses Azure DevOps Services. The YAML pipeline **game-ci** runs tests with the VSTest@3 task, which has rerunFailedTests set to true. Runs often fail because of tests that fail once and then pass on a rerun.

    You need to meet the following requirements:

    - Tests that fail and then pass on a rerun must be identified as flaky automatically.
    - Failures of flaky tests must not fail the pipeline.
    - Any other failing test must still fail the pipeline.

    Which two actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin Toys utilise Azure DevOps Services. Le pipeline YAML **game-ci** exécute des tests avec la tâche VSTest@3, dont rerunFailedTests est défini sur true. Les exécutions échouent souvent à cause de tests qui échouent une fois puis réussissent lors d'une réexécution.

    Vous devez satisfaire les exigences suivantes :

    - Les tests qui échouent puis réussissent lors d'une réexécution doivent être identifiés automatiquement comme instables.
    - Les échecs des tests instables ne doivent pas faire échouer le pipeline.
    - Tout autre test en échec doit toujours faire échouer le pipeline.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "In Project settings > Pipelines > Test management, turn on flaky test management with system detection.", fr: "Dans Paramètres du projet > Pipelines > Gestion des tests, activer la gestion des tests instables avec la détection système." } }
    - { id: b, text: { en: "Set continueOnError to true on the VSTest@3 step.", fr: "Définir continueOnError sur true pour l'étape VSTest@3." } }
    - { id: c, text: { en: "In the flaky test options, exclude flaky tests from the Test Summary.", fr: "Dans les options des tests instables, exclure les tests instables du résumé des tests (Test Summary)." } }
    - { id: d, text: { en: "Set runOnlyImpactedTests to true on the VSTest@3 task.", fr: "Définir runOnlyImpactedTests sur true pour la tâche VSTest@3." } }
    - { id: e, text: { en: "Set failOnMinTestsNotRun to false on the VSTest@3 task.", fr: "Définir failOnMinTestsNotRun sur false pour la tâche VSTest@3." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |
      With system detection, a test that fails and then passes when the VSTest task reruns it is marked flaky for the branch. By default flaky tests are still included in the Test Summary; excluding them removes their results from the pass percentage so that their failures do not fail the pipeline, while other failures still do.
    fr: |
      Avec la détection système, un test qui échoue puis réussit lorsque la tâche VSTest le réexécute est marqué instable pour la branche. Par défaut, les tests instables restent inclus dans le résumé des tests ; les exclure retire leurs résultats du pourcentage de réussite pour que leurs échecs ne fassent pas échouer le pipeline, alors que les autres échecs le font toujours.
  options:
    b: { en: "continueOnError hides every test failure, including the failures of tests that are not flaky.", fr: "continueOnError masque tous les échecs de tests, y compris ceux des tests qui ne sont pas instables." }
    d: { en: "Test impact analysis selects the tests affected by a change; it does not detect or exclude flaky tests.", fr: "L'analyse d'impact des tests sélectionne les tests concernés par une modification ; elle ne détecte ni n'exclut les tests instables." }
    e: { en: "failOnMinTestsNotRun is already false by default and only checks the minimum number of tests that run.", fr: "failOnMinTestsNotRun est déjà false par défaut et ne vérifie que le nombre minimal de tests exécutés." }
references:
  - title: Manage flaky tests
    url: https://learn.microsoft.com/en-us/azure/devops/pipelines/test/flaky-test-management
