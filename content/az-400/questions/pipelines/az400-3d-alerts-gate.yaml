id: az400-3d-alerts-gate
objective: "3.4.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Litware deploys a web app to five Azure regions by using a YAML pipeline. The first stage deploys to an environment named **canary-region**, and the next stage deploys the four other regions through an environment named **all-regions**. Azure Monitor alert rules watch the failure rate and the response time of the app.

    The all-regions stage must start only if no alert rule is active after the canary deployment. The decision must be automatic, without human intervention.

    What should you add to the all-regions environment?
  fr: |
    Litware déploie une application web dans cinq régions Azure à l'aide d'un pipeline YAML. La première phase déploie vers un environnement nommé **canary-region**, et la phase suivante déploie les quatre autres régions via un environnement nommé **all-regions**. Des règles d'alerte Azure Monitor surveillent le taux d'échec et le temps de réponse de l'application.

    La phase all-regions ne doit démarrer que si aucune règle d'alerte n'est active après le déploiement canari. La décision doit être automatique, sans intervention humaine.

    Que devez-vous ajouter à l'environnement all-regions ?
body:
  options:
    - id: a
      text: { en: "An Approvals check", fr: "Une vérification Approvals" }
    - id: b
      text: { en: "A Business hours check", fr: "Une vérification Business hours" }
    - id: c
      text: { en: "An Exclusive lock check", fr: "Une vérification Exclusive lock" }
    - id: d
      text: { en: "A Query Azure Monitor alerts check", fr: "Une vérification Query Azure Monitor alerts" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      The Query Azure Monitor alerts check evaluates the selected alert rules and succeeds only when none of them is active. It is reevaluated at the configured interval until it passes or its timeout expires, so the promotion to the other regions is decided by telemetry.
    fr: |
      La vérification Query Azure Monitor alerts évalue les règles d'alerte sélectionnées et ne réussit que si aucune d'elles n'est active. Elle est réévaluée à l'intervalle configuré jusqu'à ce qu'elle réussisse ou que son délai expire : la promotion vers les autres régions est décidée par la télémétrie.
  options:
    a:
      en: "An approval requires a person to decide, which the requirements exclude."
      fr: "Une approbation exige qu'une personne décide, ce que les exigences excluent."
    b:
      en: "A Business hours check controls when the stage may start, not the health of the app."
      fr: "Une vérification Business hours contrôle quand la phase peut démarrer, pas l'intégrité de l'application."
    c:
      en: "An Exclusive lock check prevents concurrent runs; it doesn't evaluate alerts."
      fr: "Une vérification Exclusive lock empêche les exécutions simultanées ; elle n'évalue pas les alertes."
references:
  - title: Define approvals and checks
    url: https://learn.microsoft.com/en-us/azure/devops/pipelines/process/approvals
