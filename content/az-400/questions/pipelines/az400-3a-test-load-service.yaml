id: az400-3a-test-load-service
objective: "3.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Northwind has JMeter scripts that simulate 5,000 concurrent users of its ordering API. Today, a tester runs them from a laptop, which cannot generate enough traffic.

    You need to run the scripts from the release pipeline at the required scale, on infrastructure managed by Azure, and fail the pipeline when response times exceed a threshold. The solution must minimize administrative effort.

    What should you use?
  fr: |
    Northwind dispose de scripts JMeter qui simulent 5 000 utilisateurs simultanés de son API de commande. Aujourd'hui, un testeur les exécute depuis un ordinateur portable, qui ne peut pas générer assez de trafic.

    Vous devez exécuter les scripts depuis le pipeline de mise en production à l'échelle requise, sur une infrastructure gérée par Azure, et faire échouer le pipeline quand les temps de réponse dépassent un seuil. La solution doit réduire au minimum l'effort d'administration.

    Que devez-vous utiliser ?
body:
  options:
    - { id: a, text: "Azure Load Testing" }
    - { id: b, text: "Azure Chaos Studio" }
    - { id: c, text: { en: "Application Insights availability tests", fr: "Les tests de disponibilité Application Insights" } }
    - { id: d, text: "Azure Test Plans" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Azure Load Testing runs JMeter (or Locust) scripts on test engines that it manages, scaled out with engineInstances. A pipeline runs the test with the AzureLoadTest@1 task, and fail criteria such as p90(response_time_ms) > 500 mark the run as failed, which fails the task.
    fr: |
      Azure Load Testing exécute des scripts JMeter (ou Locust) sur des moteurs de test qu'il gère, mis à l'échelle avec engineInstances. Un pipeline lance le test avec la tâche AzureLoadTest@1, et des critères d'échec comme p90(response_time_ms) > 500 marquent l'exécution comme ayant échoué, ce qui fait échouer la tâche.
  options:
    b: { en: "Chaos Studio injects faults to test resilience; it does not generate user load from JMeter scripts.", fr: "Chaos Studio injecte des pannes pour tester la résilience ; il ne génère pas de charge utilisateur à partir de scripts JMeter." }
    c: { en: "Availability tests periodically check that an endpoint responds; they do not simulate thousands of concurrent users.", fr: "Les tests de disponibilité vérifient périodiquement qu'un point de terminaison répond ; ils ne simulent pas des milliers d'utilisateurs simultanés." }
    d: { en: "Azure Test Plans manages manual and exploratory test plans; it does not run load tests.", fr: "Azure Test Plans gère des plans de test manuels et exploratoires ; il n'exécute pas de tests de charge." }
references:
  - title: Manually configure CI/CD for load tests
    url: https://learn.microsoft.com/en-us/azure/load-testing/how-to-configure-load-test-cicd
  - title: Load test configuration YAML
    url: https://learn.microsoft.com/en-us/azure/load-testing/reference-test-config-yaml
