id: az400-3f-timeout-retry
objective: "3.6.2"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Tailspin Toys has a YAML pipeline that runs integration tests against Azure resources. The job sometimes hangs for the full default timeout, and the Azure CLI step sometimes fails because of a transient network error.

    You need to modify the pipeline to meet the following requirements:

    - The server must stop the job if it runs for more than 30 minutes.
    - The Azure CLI step must be retried up to two times when it fails.

    How should you complete the YAML? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin Toys dispose d'un pipeline YAML qui exécute des tests d'intégration sur des ressources Azure. Le travail reste parfois bloqué pendant toute la durée du délai d'expiration par défaut, et l'étape Azure CLI échoue parfois à cause d'une erreur réseau passagère.

    Vous devez modifier le pipeline pour satisfaire les exigences suivantes :

    - Le serveur doit arrêter le travail s'il dure plus de 30 minutes.
    - L'étape Azure CLI doit être réessayée jusqu'à deux fois en cas d'échec.

    Comment devez-vous compléter le YAML ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: yaml
  template: |
    jobs:
    - job: Integration
      [[jobkey]]: 30
      pool:
        vmImage: ubuntu-latest
      steps:
      - task: AzureCLI@2
        [[stepkey]]: 2
        inputs:
          azureSubscription: sc-tailspin-test
          scriptType: bash
          scriptLocation: inlineScript
          inlineScript: ./tests/run-integration.sh
  slots:
    - id: jobkey
      options:
        - { id: cancel, text: cancelTimeoutInMinutes }
        - { id: timeout, text: timeoutInMinutes }
        - { id: maxpar, text: maxParallel }
    - id: stepkey
      options:
        - { id: retry, text: retryCountOnTaskFailure }
        - { id: rerun, text: rerunMaxAttempts }
        - { id: steptimeout, text: timeoutInMinutes }
answer:
  values: { jobkey: timeout, stepkey: retry }
explanation:
  correct:
    en: |
      timeoutInMinutes on a job is the time the server waits for the job to complete before killing it; the default is 60 minutes. retryCountOnTaskFailure on a step sets the number of retries when the task fails.
    fr: |
      timeoutInMinutes sur un travail est le temps pendant lequel le serveur attend la fin du travail avant de l'arrêter ; la valeur par défaut est de 60 minutes. retryCountOnTaskFailure sur une étape définit le nombre de nouvelles tentatives lorsque la tâche échoue.
  options:
    cancel: { en: "cancelTimeoutInMinutes is the time allowed for a job to cancel before it is forcibly terminated.", fr: "cancelTimeoutInMinutes est le temps accordé à un travail pour s'annuler avant son arrêt forcé." }
    maxpar: { en: "maxParallel limits matrix legs or rolling batches; it is not a timeout.", fr: "maxParallel limite les branches d'une matrice ou les lots d'un déploiement progressif ; ce n'est pas un délai d'expiration." }
    rerun: { en: "rerunMaxAttempts is an input of the Visual Studio Test task for failed tests.", fr: "rerunMaxAttempts est une entrée de la tâche Visual Studio Test pour les tests en échec." }
    steptimeout: { en: "A step timeout of 2 minutes would kill the step; it does not retry it.", fr: "Un délai d'expiration de 2 minutes arrêterait l'étape ; il ne la réessaie pas." }
references:
  - title: jobs.job definition
    url: https://learn.microsoft.com/en-us/azure/devops/pipelines/yaml-schema/jobs-job
  - title: steps.task definition
    url: https://learn.microsoft.com/en-us/azure/devops/pipelines/yaml-schema/steps-task
