id: az400-3e-cfg-layer-tools
objective: "3.5.1"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Northwind is designing the configuration management of a new Azure-only line-of-business application that runs on Windows Server virtual machines and an Azure SQL database.

    You need to recommend a technology for each requirement.

    Which technology should you recommend for each requirement? To answer, drag the appropriate technologies to the correct requirements. Each technology may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind conçoit la gestion de la configuration d'une nouvelle application métier, uniquement dans Azure, qui s'exécute sur des machines virtuelles Windows Server et une base de données Azure SQL.

    Vous devez recommander une technologie pour chaque exigence.

    Quelle technologie devez-vous recommander pour chaque exigence ? Pour répondre, faites glisser les technologies appropriées vers les exigences correspondantes. Chaque technologie peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: bicep, text: Bicep }
    - { id: kv, text: Azure Key Vault }
    - { id: appcs, text: Azure App Configuration }
    - { id: mc, text: Azure Machine Configuration }
    - { id: acr, text: Azure Container Registry }
    - { id: artifacts, text: Azure Artifacts }
  targets:
    - id: res
      text: { en: "Declare the virtual machines, the virtual network and the SQL database", fr: "Déclarer les machines virtuelles, le réseau virtuel et la base de données SQL" }
    - id: secret
      text: { en: "Store the SQL administrator password that the deployment reads", fr: "Stocker le mot de passe d'administrateur SQL que le déploiement lit" }
    - id: settings
      text: { en: "Store application settings per environment by using labels, read by the app at runtime", fr: "Stocker les paramètres d'application par environnement à l'aide d'étiquettes, lus par l'application à l'exécution" }
    - id: os
      text: { en: "Audit and enforce the time zone and local security settings inside the VMs", fr: "Auditer et appliquer le fuseau horaire et les paramètres de sécurité locaux à l'intérieur des machines virtuelles" }
answer:
  mapping: { res: bicep, secret: kv, settings: appcs, os: mc }
explanation:
  correct:
    en: "Bicep declares the Azure resources (control plane). Key Vault stores the secret, which a parameter file reads with `getSecret()`. App Configuration stores key-values that share a key and differ by label, such as one label per environment. Machine Configuration audits or configures operating system settings inside the VMs."
    fr: "Bicep déclare les ressources Azure (plan de contrôle). Key Vault stocke le secret, qu'un fichier de paramètres lit avec `getSecret()`. App Configuration stocke des paires clé-valeur qui partagent une clé et diffèrent par leur étiquette, par exemple une étiquette par environnement. Machine Configuration audite ou configure les paramètres du système d'exploitation à l'intérieur des machines virtuelles."
  options:
    acr: { en: "Container Registry can host Bicep modules, but it doesn't declare or configure anything by itself.", fr: "Container Registry peut héberger des modules Bicep, mais il ne déclare ni ne configure rien par lui-même." }
    artifacts: { en: "Azure Artifacts hosts packages for builds, not configuration or secrets for the application.", fr: "Azure Artifacts héberge des packages pour les builds, pas la configuration ni les secrets de l'application." }
references:
  - title: Understand Azure App Configuration key-value store
    url: https://learn.microsoft.com/en-us/azure/azure-app-configuration/concept-key-value
  - title: What is Azure Machine Configuration?
    url: https://learn.microsoft.com/en-us/azure/governance/machine-configuration/overview
