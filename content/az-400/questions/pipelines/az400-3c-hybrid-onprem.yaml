id: az400-3c-hybrid-onprem
objective: "3.3.7"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Litware builds a .NET application in Azure Pipelines on Microsoft-hosted agents. The application must be deployed to 12 Windows servers in an on-premises datacenter. The datacenter firewall blocks all inbound connections from the internet and allows outbound HTTPS. There is no VPN or ExpressRoute connection to Azure, and none will be created.

    You need a deployment design that records the deployment history of each server and requires no inbound firewall rule.

    What should you do?
  fr: |
    Litware génère une application .NET dans Azure Pipelines sur des agents hébergés par Microsoft. L'application doit être déployée sur 12 serveurs Windows d'un centre de données local. Le pare-feu du centre de données bloque toutes les connexions entrantes depuis Internet et autorise le trafic HTTPS sortant. Il n'existe aucune connexion VPN ou ExpressRoute vers Azure, et aucune ne sera créée.

    Vous avez besoin d'une conception de déploiement qui enregistre l'historique de déploiement de chaque serveur et n'exige aucune règle de pare-feu entrante.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Open inbound WinRM over HTTPS from the Azure DevOps IP ranges, and deploy from Microsoft-hosted agents.", fr: "Ouvrir WinRM sur HTTPS en entrée depuis les plages IP d'Azure DevOps, et déployer depuis des agents hébergés par Microsoft." } }
    - { id: b, text: { en: "Create a Managed DevOps Pool in an Azure virtual network, and deploy from that pool.", fr: "Créer un pool Managed DevOps Pools dans un réseau virtuel Azure, et déployer depuis ce pool." } }
    - { id: c, text: { en: "Register the servers as virtual machine resources of an environment, and deploy with a deployment job.", fr: "Inscrire les serveurs comme ressources machine virtuelle d'un environnement, et déployer avec un travail de déploiement." } }
    - { id: d, text: { en: "Run the deployment scripts in a container job on Microsoft-hosted agents.", fr: "Exécuter les scripts de déploiement dans un travail de conteneur sur des agents hébergés par Microsoft." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Registering each server as a virtual machine resource installs an agent on it. The agent initiates outbound connections to Azure Pipelines, so no inbound rule is needed, and the environment keeps the deployment history per resource. The build can stay on Microsoft-hosted agents, which makes the pipeline hybrid.
    fr: |
      L'inscription de chaque serveur comme ressource machine virtuelle y installe un agent. L'agent initie des connexions sortantes vers Azure Pipelines : aucune règle entrante n'est nécessaire, et l'environnement conserve l'historique de déploiement par ressource. Le build peut rester sur des agents hébergés par Microsoft, ce qui rend le pipeline hybride.
  options:
    a: { en: "This requires an inbound firewall rule, which the requirement forbids.", fr: "Cette solution exige une règle de pare-feu entrante, ce que l'exigence interdit." }
    b: { en: "Agents in an Azure virtual network can't reach the datacenter without a VPN or ExpressRoute connection.", fr: "Des agents dans un réseau virtuel Azure ne peuvent pas joindre le centre de données sans connexion VPN ou ExpressRoute." }
    d: { en: "A container job still runs on a Microsoft-hosted agent, which has no line of sight to the on-premises servers.", fr: "Un travail de conteneur s'exécute toujours sur un agent hébergé par Microsoft, qui n'a aucune visibilité réseau sur les serveurs locaux." }
references:
  - title: Manage VM resources in environments
    url: https://learn.microsoft.com/en-us/azure/devops/pipelines/process/environments-virtual-machines
  - title: Azure Pipelines agents
    url: https://learn.microsoft.com/en-us/azure/devops/pipelines/agents/agents
