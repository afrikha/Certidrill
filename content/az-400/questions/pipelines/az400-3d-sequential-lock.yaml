id: az400-3d-sequential-lock
objective: "3.4.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Adatum has a YAML pipeline that deploys an API to an Azure Pipelines environment named **api-prod**. Developers merge to main several times an hour, and each merge starts a run.

    Two runs recently deployed to api-prod at the same time and left the API in an inconsistent state. Each run must deploy its own version to api-prod, runs must never deploy to api-prod concurrently, and no queued run may be skipped.

    What should you do?
  fr: |
    Adatum dispose d'un pipeline YAML qui déploie une API vers un environnement Azure Pipelines nommé **api-prod**. Les développeurs fusionnent dans main plusieurs fois par heure, et chaque fusion démarre une exécution.

    Deux exécutions ont récemment déployé vers api-prod en même temps et ont laissé l'API dans un état incohérent. Chaque exécution doit déployer sa propre version vers api-prod, les exécutions ne doivent jamais déployer vers api-prod simultanément, et aucune exécution en file d'attente ne doit être ignorée.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Add an Exclusive lock check to api-prod and set lockBehavior to runLatest.", fr: "Ajouter une vérification Exclusive lock à api-prod et définir lockBehavior sur runLatest." }
    - id: b
      text: { en: "Set batch to true in the CI trigger of the pipeline.", fr: "Définir batch sur true dans le déclencheur CI du pipeline." }
    - id: c
      text: { en: "Add a Business hours check to api-prod.", fr: "Ajouter une vérification Business hours à api-prod." }
    - id: d
      text: { en: "Add an Exclusive lock check to api-prod and set lockBehavior to sequential.", fr: "Ajouter une vérification Exclusive lock à api-prod et définir lockBehavior sur sequential." }
answer: { optionId: d }
explanation:
  correct:
    en: |
      The Exclusive lock check lets only one run at a time proceed on the environment. With `lockBehavior: sequential`, every run acquires the lock in turn, so each version is deployed and none is dropped.
    fr: |
      La vérification Exclusive lock ne laisse qu'une exécution à la fois progresser sur l'environnement. Avec `lockBehavior: sequential`, chaque exécution acquiert le verrou à son tour : chaque version est déployée et aucune n'est abandonnée.
  options:
    a:
      en: "With runLatest, which is also the default, only the latest run gets the lock and older queued runs are canceled, so some versions are skipped."
      fr: "Avec runLatest, qui est aussi la valeur par défaut, seule la dernière exécution obtient le verrou et les exécutions plus anciennes en attente sont annulées : certaines versions sont ignorées."
    b:
      en: "Batching groups several merges into one run, so individual versions are never deployed."
      fr: "Le traitement par lots regroupe plusieurs fusions dans une seule exécution : les versions individuelles ne sont jamais déployées."
    c:
      en: "A Business hours check delays the stage to a time window but lets several runs enter that window together."
      fr: "Une vérification Business hours retarde la phase jusqu'à une plage horaire mais laisse plusieurs exécutions y entrer ensemble."
references:
  - title: Define approvals and checks
    url: https://learn.microsoft.com/en-us/azure/devops/pipelines/process/approvals
