id: az400-3f-export-yaml
objective: "3.6.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso has a classic build pipeline named **hr-build** that was created with the classic build designer. You plan to replace it with a YAML pipeline.

    You need to obtain a YAML file that contains the tasks of hr-build. The solution must minimize the effort.

    What should you do?
  fr: |
    Contoso dispose d'un pipeline de build classique nommé **hr-build**, créé avec le concepteur de build classique. Vous prévoyez de le remplacer par un pipeline YAML.

    Vous devez obtenir un fichier YAML qui contient les tâches de hr-build. La solution doit réduire au minimum l'effort.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Open the latest run of hr-build and select Export to YAML in its three-dot menu", fr: "Ouvrir la dernière exécution de hr-build et sélectionner Export to YAML dans son menu à trois points" } }
    - { id: b, text: { en: "Open the classic release pipeline that deploys hr-build and select Export to YAML", fr: "Ouvrir le pipeline de mise en production classique qui déploie hr-build et sélectionner Export to YAML" } }
    - { id: c, text: { en: "Create a starter YAML pipeline and use the Task Assistant to import hr-build", fr: "Créer un pipeline YAML de démarrage et utiliser l'assistant de tâches (Task Assistant) pour importer hr-build" } }
    - { id: d, text: { en: "Open the definition of hr-build and select Export to YAML in its three-dot menu", fr: "Ouvrir la définition de hr-build et sélectionner Export to YAML dans son menu à trois points" } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Classic pipelines created with the classic build designer can be exported from the three-dot menu of the pipeline definition, which downloads a .yml file. You then paste its content into a YAML pipeline and fix what did not convert, such as variables.
    fr: |
      Les pipelines classiques créés avec le concepteur de build classique peuvent être exportés depuis le menu à trois points de la définition du pipeline, ce qui télécharge un fichier .yml. Vous collez ensuite son contenu dans un pipeline YAML et corrigez ce qui n'a pas été converti, comme les variables.
  options:
    a: { en: "Export to YAML appears only in the pipeline definition view, not in a specific run.", fr: "Export to YAML n'apparaît que dans la vue de définition du pipeline, pas dans une exécution précise." }
    b: { en: "Classic release pipelines do not support YAML export, and the build tasks are not in the release.", fr: "Les pipelines de mise en production classiques ne prennent pas en charge l'export YAML, et les tâches de build ne se trouvent pas dans la mise en production." }
    c: { en: "The Task Assistant adds or edits individual tasks in the editor; it cannot import a classic pipeline.", fr: "L'assistant de tâches ajoute ou modifie des tâches individuelles dans l'éditeur ; il ne peut pas importer un pipeline classique." }
references:
  - title: Migrate your Classic pipeline to YAML
    url: https://learn.microsoft.com/en-us/azure/devops/pipelines/release/from-classic-pipelines
