id: az400-3b-agent-fork-runner
objective: "3.3.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Wingtip maintains a public GitHub repository for an open-source library. The CI workflow runs on `pull_request` events on self-hosted runners in the corporate datacenter, which can reach internal servers. External contributors open pull requests from forks.

    You need to prevent the code of pull requests from running on machines that can reach the corporate network. Every pull request must still be validated by CI.

    What should you do?
  fr: |
    Wingtip gère un dépôt GitHub public pour une bibliothèque open source. Le workflow de CI s'exécute sur les événements `pull_request` sur des exécuteurs auto-hébergés du centre de données de l'entreprise, qui peuvent atteindre des serveurs internes. Des contributeurs externes ouvrent des pull requests depuis des duplications (forks).

    Vous devez empêcher le code des pull requests de s'exécuter sur des machines qui peuvent atteindre le réseau de l'entreprise. Chaque pull request doit toujours être validée par la CI.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Change `runs-on` of the CI workflow to a GitHub-hosted runner label such as ubuntu-latest.", fr: "Remplacer `runs-on` du workflow de CI par une étiquette d'exécuteur hébergé par GitHub, comme ubuntu-latest." } }
    - { id: b, text: { en: "Reconfigure the self-hosted runners as ephemeral runners by using `--ephemeral`.", fr: "Reconfigurer les exécuteurs auto-hébergés en exécuteurs éphémères avec `--ephemeral`." } }
    - { id: c, text: { en: "Move the self-hosted runners to a runner group that only this repository can use.", fr: "Déplacer les exécuteurs auto-hébergés dans un groupe d'exécuteurs que seul ce dépôt peut utiliser." } }
    - { id: d, text: { en: "Replace the `pull_request` event with the `pull_request_target` event.", fr: "Remplacer l'événement `pull_request` par l'événement `pull_request_target`." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Anyone can open a pull request on a public repository, so self-hosted runners should be used only with private repositories. GitHub-hosted runners give each job a clean, isolated machine outside the corporate network, so contributors' code can't reach internal servers while every pull request is still validated.
    fr: |
      N'importe qui peut ouvrir une pull request sur un dépôt public : les exécuteurs auto-hébergés ne doivent être utilisés qu'avec des dépôts privés. Les exécuteurs hébergés par GitHub donnent à chaque job une machine propre et isolée, en dehors du réseau de l'entreprise : le code des contributeurs ne peut pas atteindre les serveurs internes, et chaque pull request reste validée.
  options:
    b: { en: "An ephemeral runner runs one job and is removed, but the machine is still in the corporate network during the job.", fr: "Un exécuteur éphémère exécute un seul job puis est supprimé, mais la machine reste dans le réseau de l'entreprise pendant le job." }
    c: { en: "A runner group limits which repositories use the runners; fork pull requests target this repository anyway.", fr: "Un groupe d'exécuteurs limite les dépôts qui utilisent les exécuteurs ; les pull requests des duplications ciblent de toute façon ce dépôt." }
    d: { en: "pull_request_target runs with the base repository's secrets and permissions, which makes untrusted code more dangerous.", fr: "pull_request_target s'exécute avec les secrets et les autorisations du dépôt de base, ce qui rend le code non fiable plus dangereux." }
references:
  - title: Explore runners
    url: https://learn.microsoft.com/en-us/training/modules/introduction-to-github-actions/8-explore-runners
  - title: Manage runners
    url: https://learn.microsoft.com/en-us/training/modules/manage-github-actions-enterprise/manage-runners
