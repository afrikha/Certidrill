id: az400-3d-flag-reader-role
objective: "3.4.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Litware has an App Service web app that reads its feature flags from an Azure App Configuration store named **appcs-litware**. The app connects to the store with `DefaultAzureCredential` and its system-assigned managed identity. Access key authentication is disabled on the store.

    You need to grant the managed identity the permissions it needs to load the feature flags. The solution must follow the principle of least privilege.

    Which role should you assign to the managed identity on appcs-litware?
  fr: |
    Litware dispose d'une application web App Service qui lit ses indicateurs de fonctionnalités depuis un magasin Azure App Configuration nommé **appcs-litware**. L'application se connecte au magasin avec `DefaultAzureCredential` et son identité managée affectée par le système. L'authentification par clé d'accès est désactivée sur le magasin.

    Vous devez accorder à l'identité managée les autorisations nécessaires pour charger les indicateurs de fonctionnalités. La solution doit respecter le principe du moindre privilège.

    Quel rôle devez-vous attribuer à l'identité managée sur appcs-litware ?
body:
  options:
    - id: a
      text: App Configuration Reader
    - id: b
      text: App Configuration Data Owner
    - id: c
      text: App Configuration Data Reader
    - id: d
      text: Reader
answer: { optionId: c }
explanation:
  correct:
    en: |
      Feature flags are key-values stored in the store, so reading them is a data plane operation. App Configuration Data Reader grants read access to the data and nothing more, which is the least privilege for an app that only loads flags.
    fr: |
      Les indicateurs de fonctionnalités sont des paires clé-valeur stockées dans le magasin : les lire est une opération du plan de données. App Configuration Data Reader accorde l'accès en lecture aux données et rien de plus, ce qui constitue le moindre privilège pour une application qui ne fait que charger des indicateurs.
  options:
    a:
      en: "App Configuration Reader is a control plane role; it reads the resource but not the data stored in it."
      fr: "App Configuration Reader est un rôle du plan de contrôle ; il lit la ressource mais pas les données qu'elle contient."
    b:
      en: "App Configuration Data Owner also grants write and delete access to the data, which is more than needed."
      fr: "App Configuration Data Owner accorde aussi l'accès en écriture et en suppression aux données, ce qui dépasse le besoin."
    d:
      en: "Reader can read the resource but grants no access to the stored data with Microsoft Entra ID."
      fr: "Reader peut lire la ressource mais n'accorde aucun accès aux données stockées avec Microsoft Entra ID."
references:
  - title: Access Azure App Configuration using Microsoft Entra ID
    url: https://learn.microsoft.com/en-us/azure/azure-app-configuration/concept-enable-rbac
