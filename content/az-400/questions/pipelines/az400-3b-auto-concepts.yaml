id: az400-3b-auto-concepts
objective: "3.3.1"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Woodgrove is moving its pipelines from Azure Pipelines to GitHub Actions.

    Which GitHub Actions element should you use for each Azure Pipelines element? To answer, drag the appropriate GitHub Actions elements to the correct Azure Pipelines elements. Each element may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove migre ses pipelines d'Azure Pipelines vers GitHub Actions.

    Quel élément GitHub Actions devez-vous utiliser pour chaque élément Azure Pipelines ? Pour répondre, faites glisser les éléments GitHub Actions appropriés vers les éléments Azure Pipelines correspondants. Chaque élément peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: needs, text: "`needs`" }
    - { id: group, text: { en: "Runner group", fr: "Groupe d'exécuteurs" } }
    - { id: reusable, text: { en: "Reusable workflow", fr: "Workflow réutilisable" } }
    - { id: protection, text: { en: "Deployment protection rules", fr: "Règles de protection de déploiement" } }
    - { id: wfrun, text: "`workflow_run`" }
  targets:
    - id: depends
      text: { en: "`dependsOn` between jobs", fr: "`dependsOn` entre des travaux" }
    - id: pool
      text: { en: "Agent pool", fr: "Pool d'agents" }
    - id: template
      text: { en: "Template that defines a set of jobs", fr: "Modèle qui définit un ensemble de travaux" }
    - id: checks
      text: { en: "Approvals and checks on an environment", fr: "Approbations et vérifications sur un environnement" }
answer:
  mapping: { depends: needs, pool: group, template: reusable, checks: protection }
explanation:
  correct:
    en: |
      A GitHub job waits for other jobs listed in `needs`, as `dependsOn` does in Azure Pipelines. Runner groups play the role of agent pools, a reusable workflow replaces a template of jobs, and deployment protection rules (required reviewers, wait timer, branch restrictions) replace the approvals and checks of an environment. `workflow_run` starts a workflow after another one, like a pipeline completion trigger.
    fr: |
      Un job GitHub attend les jobs indiqués dans `needs`, comme `dependsOn` dans Azure Pipelines. Les groupes d'exécuteurs jouent le rôle des pools d'agents, un workflow réutilisable remplace un modèle de travaux, et les règles de protection de déploiement (réviseurs obligatoires, minuteur d'attente, restrictions de branche) remplacent les approbations et vérifications d'un environnement. `workflow_run` démarre un workflow après un autre, comme un déclencheur d'achèvement de pipeline.
references:
  - title: Explore jobs
    url: https://learn.microsoft.com/en-us/training/modules/introduction-to-github-actions/7-explore-jobs
  - title: Remove artifacts, create status badges, and configure environment protections
    url: https://learn.microsoft.com/en-us/training/modules/github-actions-cd/2b-manage-workflow-runs
