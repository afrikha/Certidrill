id: az400-3a-test-load-task
objective: "3.2.2"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam stores the load test configuration of its catalog API in the file `loadtests/catalog.yaml`. The test must run from the Staging stage of an Azure Pipelines YAML pipeline in the Azure Load Testing resource **lt-fabrikam** of the resource group **rg-testing**. The service connection **sc-testing** is used to access Azure.

    How should you complete the step? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam stocke la configuration du test de charge de son API de catalogue dans le fichier `loadtests/catalog.yaml`. Le test doit s'exécuter depuis la phase Staging d'un pipeline YAML Azure Pipelines dans la ressource Azure Load Testing **lt-fabrikam** du groupe de ressources **rg-testing**. La connexion de service **sc-testing** est utilisée pour accéder à Azure.

    Comment devez-vous compléter l'étape ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: yaml
  template: |
    - task: [[task]]
      inputs:
        azureSubscription: sc-testing
        [[cfg]]: 'loadtests/catalog.yaml'
        loadTestResource: lt-fabrikam
        resourceGroup: rg-testing
  slots:
    - id: task
      options:
        - { id: alt, text: AzureLoadTest@1 }
        - { id: vstest, text: VSTest@3 }
        - { id: publish, text: PublishTestResults@2 }
        - { id: cli, text: AzureCLI@2 }
    - id: cfg
      options:
        - { id: config, text: loadTestConfigFile }
        - { id: plan, text: testPlan }
        - { id: results, text: testResultsFiles }
        - { id: script, text: scriptPath }
answer:
  values: { task: alt, cfg: config }
explanation:
  correct:
    en: |
      The AzureLoadTest@1 task runs an Azure Load Testing test from a pipeline: loadTestConfigFile points to the test configuration YAML, and loadTestResource and resourceGroup identify the resource. The service principal of the service connection needs the Load Test Contributor role on the load testing resource.
    fr: |
      La tâche AzureLoadTest@1 exécute un test Azure Load Testing depuis un pipeline : loadTestConfigFile désigne le YAML de configuration du test, et loadTestResource et resourceGroup identifient la ressource. Le principal de service de la connexion de service a besoin du rôle Load Test Contributor sur la ressource de test de charge.
  options:
    vstest: { en: "VSTest@3 runs Visual Studio test assemblies, not Azure Load Testing tests.", fr: "VSTest@3 exécute des assemblys de test Visual Studio, pas des tests Azure Load Testing." }
    publish: { en: "PublishTestResults@2 publishes result files produced by other runners.", fr: "PublishTestResults@2 publie des fichiers de résultats produits par d'autres exécuteurs." }
    cli: { en: "AzureCLI@2 runs Azure CLI scripts; it has no input for a load test configuration file.", fr: "AzureCLI@2 exécute des scripts Azure CLI ; il n'a pas d'entrée pour un fichier de configuration de test de charge." }
    plan: { en: "testPlan is a key inside the load test YAML (the JMeter script), not an input of the task.", fr: "testPlan est une clé du YAML du test de charge (le script JMeter), pas une entrée de la tâche." }
    results: { en: "testResultsFiles is an input of PublishTestResults@2.", fr: "testResultsFiles est une entrée de PublishTestResults@2." }
    script: { en: "scriptPath is an input of script tasks such as AzureCLI@2.", fr: "scriptPath est une entrée de tâches de script comme AzureCLI@2." }
references:
  - title: Manually configure CI/CD for load tests
    url: https://learn.microsoft.com/en-us/azure/load-testing/how-to-configure-load-test-cicd
