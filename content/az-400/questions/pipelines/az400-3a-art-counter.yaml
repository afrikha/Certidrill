id: az400-3a-art-counter
objective: "3.1.4"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    You are writing the YAML pipeline of a NuGet library. The version of each run must have the format MAJOR.MINOR.PATCH and meet the following requirements:

    - The team sets MAJOR.MINOR by editing only the majorMinor variable.
    - PATCH starts at 0 the first time a majorMinor value is used and increments by one with each run.
    - The package version equals the run number of the pipeline.

    How should you complete the YAML? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous écrivez le pipeline YAML d'une bibliothèque NuGet. La version de chaque exécution doit avoir le format MAJOR.MINOR.PATCH et répondre aux exigences suivantes :

    - L'équipe définit MAJOR.MINOR en modifiant uniquement la variable majorMinor.
    - PATCH commence à 0 la première fois qu'une valeur de majorMinor est utilisée et s'incrémente de un à chaque exécution.
    - La version du package est égale au numéro d'exécution du pipeline.

    Comment devez-vous compléter le YAML ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: yaml
  template: |
    variables:
      majorMinor: '3.4'
      patch: [[expr]]
    name: [[name]]
    steps:
      - script: dotnet pack src/Contoso.Pricing -c Release -o $(Build.ArtifactStagingDirectory) -p:PackageVersion=[[pv]]
  slots:
    - id: expr
      options:
        - { id: counter, text: "$[counter(variables['majorMinor'], 0)]" }
        - { id: fixed, text: "$[counter('3.4', 0)]" }
        - { id: rev, text: "$(Rev:r)" }
        - { id: bn, text: "$[counter(variables['Build.BuildNumber'], 0)]" }
    - id: name
      options:
        - { id: mmp, text: "$(majorMinor).$(patch)" }
        - { id: mmid, text: "$(majorMinor).$(Build.BuildId)" }
        - { id: date, text: "$(Date:yyyyMMdd).$(Rev:r)" }
    - id: pv
      options:
        - { id: bnum, text: "$(Build.BuildNumber)" }
        - { id: bid, text: "$(Build.BuildId)" }
        - { id: patchonly, text: "$(patch)" }
answer:
  values: { expr: counter, name: mmp, pv: bnum }
explanation:
  correct:
    en: |
      counter(prefix, seed) keeps a separate value for each prefix: with variables['majorMinor'] as the prefix and 0 as the seed, each new majorMinor value starts at 0 and then increments with each run. name sets the run number to $(majorMinor).$(patch), and $(Build.BuildNumber) passes that run number to dotnet pack as the package version.
    fr: |
      counter(prefix, seed) conserve une valeur distincte pour chaque préfixe : avec variables['majorMinor'] comme préfixe et 0 comme valeur initiale, chaque nouvelle valeur de majorMinor commence à 0 puis s'incrémente à chaque exécution. name définit le numéro d'exécution $(majorMinor).$(patch), et $(Build.BuildNumber) transmet ce numéro d'exécution à dotnet pack comme version du package.
  options:
    fixed: { en: "A hard-coded prefix keeps counting under 3.4 when majorMinor changes, unless the expression is edited too.", fr: "Un préfixe codé en dur continue de compter sous 3.4 quand majorMinor change, sauf si l'expression est aussi modifiée." }
    rev: { en: "$(Rev:r) works only in the run number field, not as a variable value.", fr: "$(Rev:r) ne fonctionne que dans le champ du numéro d'exécution, pas comme valeur de variable." }
    bn: { en: "Build.BuildNumber is not set yet when expressions are evaluated, so it cannot be the prefix.", fr: "Build.BuildNumber n'est pas encore défini quand les expressions sont évaluées : il ne peut pas servir de préfixe." }
    mmid: { en: "Build.BuildId is unique in the organization and never restarts at 0 for a new majorMinor.", fr: "Build.BuildId est unique dans l'organisation et ne recommence jamais à 0 pour un nouveau majorMinor." }
    bid: { en: "Build.BuildId is an integer such as 752, not a MAJOR.MINOR.PATCH version.", fr: "Build.BuildId est un entier comme 752, pas une version MAJOR.MINOR.PATCH." }
    patchonly: { en: "$(patch) alone gives only the PATCH number.", fr: "$(patch) seul ne donne que le numéro PATCH." }
references:
  - title: Expressions
    url: https://learn.microsoft.com/en-us/azure/devops/pipelines/process/expressions
  - title: Run and build numbers
    url: https://learn.microsoft.com/en-us/azure/devops/pipelines/process/run-number
