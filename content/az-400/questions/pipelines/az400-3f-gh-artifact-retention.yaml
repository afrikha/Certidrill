id: az400-3f-gh-artifact-retention
objective: "3.6.4"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    Proseware has a GitHub repository whose artifacts and logs use the default retention of 90 days. A workflow produces test reports in the reports folder. The reports use a lot of storage and are useful only for a few days.

    You need to modify the workflow to meet the following requirements:

    - Keep the test reports for 5 days instead of the repository default.
    - Make the step fail if the reports folder contains no file.

    How should you complete the workflow? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware dispose d'un dépôt GitHub dont les artefacts et les journaux utilisent la rétention par défaut de 90 jours. Un workflow produit des rapports de tests dans le dossier reports. Les rapports occupent beaucoup de stockage et ne sont utiles que quelques jours.

    Vous devez modifier le workflow pour satisfaire les exigences suivantes :

    - Conserver les rapports de tests pendant 5 jours au lieu de la valeur par défaut du dépôt.
    - Faire échouer l'étape si le dossier reports ne contient aucun fichier.

    Comment devez-vous compléter le workflow ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: yaml
  template: |
    jobs:
      test:
        runs-on: ubuntu-latest
        steps:
          - uses: actions/checkout@v4
          - run: npm ci && npm test
          - uses: actions/[[action]]@v4
            if: always()
            with:
              name: test-reports
              path: reports/
              [[key]]: 5
              if-no-files-found: [[nofiles]]
  slots:
    - id: action
      options:
        - { id: download, text: download-artifact }
        - { id: upload, text: upload-artifact }
        - { id: cache, text: cache }
    - id: key
      options:
        - { id: retention, text: retention-days }
        - { id: merge, text: merge-multiple }
        - { id: pattern, text: pattern }
    - id: nofiles
      options:
        - { id: warn, text: warn }
        - { id: ignore, text: ignore }
        - { id: error, text: error }
answer:
  values: { action: upload, key: retention, nofiles: error }
explanation:
  correct:
    en: |
      actions/upload-artifact stores files as a workflow artifact, and its retention-days input overrides the default retention for that artifact only. The if-no-files-found input accepts error, warn or ignore; error makes the step fail when no file matches the path.
    fr: |
      actions/upload-artifact stocke des fichiers comme artefact de workflow, et son entrée retention-days remplace la rétention par défaut pour cet artefact uniquement. L'entrée if-no-files-found accepte error, warn ou ignore ; error fait échouer l'étape quand aucun fichier ne correspond au chemin.
  options:
    download: { en: "download-artifact retrieves an artifact in a later job; it does not store one.", fr: "download-artifact récupère un artefact dans un travail ultérieur ; il n'en stocke pas." }
    cache: { en: "actions/cache stores dependencies to speed up later runs, not reports to keep as artifacts.", fr: "actions/cache stocke des dépendances pour accélérer les exécutions suivantes, pas des rapports à conserver comme artefacts." }
    merge: { en: "merge-multiple is an input of download-artifact that merges several artifacts into one folder.", fr: "merge-multiple est une entrée de download-artifact qui fusionne plusieurs artefacts dans un dossier." }
    pattern: { en: "pattern is an input of download-artifact that selects artifacts by name.", fr: "pattern est une entrée de download-artifact qui sélectionne des artefacts par nom." }
    warn: { en: "warn only writes a warning when no file is found; the step succeeds.", fr: "warn écrit seulement un avertissement quand aucun fichier n'est trouvé ; l'étape réussit." }
    ignore: { en: "ignore succeeds silently when no file is found.", fr: "ignore réussit sans message quand aucun fichier n'est trouvé." }
references:
  - title: Share artifacts between jobs
    url: https://learn.microsoft.com/en-us/training/modules/learn-continuous-integration-github-actions/4-share-artifacts-between-jobs
  - title: Remove artifacts, create status badges, and configure environment protections
    url: https://learn.microsoft.com/en-us/training/modules/github-actions-cd/2b-manage-workflow-runs
