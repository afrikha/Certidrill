id: az400-3d-slot-capabilities
objective: "3.4.3"
type: hotarea
difficulty: 2
status: draft
stem:
  en: |
    Proseware has the App Service apps shown in the following table. Each app that has a staging slot deploys to it and swaps it with production.

    Answer each prompt by selecting the appropriate app.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware dispose des applications App Service figurant dans le tableau suivant. Chaque application qui possède un emplacement staging y déploie puis le permute avec la production.

    Répondez à chaque consigne en sélectionnant l'application appropriée.

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
    - id: p1
      text: { en: "The only app on which you can enable auto swap from its staging slot to production", fr: "La seule application sur laquelle vous pouvez activer la permutation automatique de son emplacement staging vers la production" }
    - id: p2
      text: { en: "The app whose App Service plan must be scaled up before you can add a staging slot", fr: "L'application dont le plan App Service doit faire l'objet d'un scale-up avant de pouvoir ajouter un emplacement staging" }
  grid:
    header: [{ en: "App", fr: "Application" }, { en: "Operating system", fr: "Système d'exploitation" }, { en: "Publishing model", fr: "Modèle de publication" }, { en: "Plan tier", fr: "Niveau du plan" }, { en: "Slots", fr: "Emplacements" }]
    rows:
      - [{ text: app-quotes, area: quotes }, { text: Windows }, { text: Code }, { text: Basic B2 }, { text: { en: "None", fr: "Aucun" } }]
      - [{ text: app-claims, area: claims }, { text: Linux }, { text: Code }, { text: Premium v3 P1v3 }, { text: staging }]
      - [{ text: app-portal, area: portal }, { text: Windows }, { text: Code }, { text: Standard S1 }, { text: staging }]
      - [{ text: app-agents, area: agents }, { text: Linux }, { text: { en: "Container", fr: "Conteneur" } }, { text: Standard S2 }, { text: staging }]
answer:
  values: { p1: portal, p2: quotes }
explanation:
  correct:
    en: |
      Auto swap isn't supported for web apps on Linux or for Web App for Containers, so app-claims and app-agents can't use it, while app-portal runs code on Windows in a tier that supports slots. Deployment slots require the Standard, Premium, or Isolated tier, so the Basic plan of app-quotes must be scaled up first.
    fr: |
      La permutation automatique n'est pas prise en charge pour les applications web sous Linux ni pour Web App for Containers : app-claims et app-agents ne peuvent pas l'utiliser, tandis qu'app-portal exécute du code sous Windows dans un niveau qui prend en charge les emplacements. Les emplacements de déploiement exigent le niveau Standard, Premium ou Isolated : le plan Basic d'app-quotes doit d'abord faire l'objet d'un scale-up.
references:
  - title: Set up staging environments in Azure App Service
    url: https://learn.microsoft.com/en-us/azure/app-service/deploy-staging-slots
