id: az400-3b-auto-server
objective: "3.3.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Tailspin runs Azure DevOps Server 2022 in its datacenter. The repositories, the work items and the classic build pipelines are on that server. Regulations forbid storing the source code in a cloud service, and the build servers can't reach the internet.

    You need to modernize the build process by moving to pipelines defined as YAML code. What should you use?
  fr: |
    Tailspin exécute Azure DevOps Server 2022 dans son centre de données. Les dépôts, les éléments de travail et les pipelines de build classiques se trouvent sur ce serveur. La réglementation interdit de stocker le code source dans un service cloud, et les serveurs de build n'ont pas accès à Internet.

    Vous devez moderniser le processus de build en passant à des pipelines définis sous forme de code YAML. Que devez-vous utiliser ?
body:
  options:
    - { id: a, text: { en: "Azure Pipelines YAML pipelines on Azure DevOps Server that run on self-hosted agents", fr: "Des pipelines YAML Azure Pipelines sur Azure DevOps Server qui s'exécutent sur des agents auto-hébergés" } }
    - { id: b, text: { en: "Azure Pipelines YAML pipelines that run on Microsoft-hosted agents", fr: "Des pipelines YAML Azure Pipelines qui s'exécutent sur des agents hébergés par Microsoft" } }
    - { id: c, text: { en: "GitHub Actions workflows in GitHub Enterprise Cloud that run on GitHub-hosted runners", fr: "Des workflows GitHub Actions dans GitHub Enterprise Cloud qui s'exécutent sur des exécuteurs hébergés par GitHub" } }
    - { id: d, text: { en: "GitHub Actions workflows in GitHub Enterprise Cloud that run on self-hosted runners in the datacenter", fr: "Des workflows GitHub Actions dans GitHub Enterprise Cloud qui s'exécutent sur des exécuteurs auto-hébergés du centre de données" } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Azure DevOps Server supports YAML pipelines, so the code and the work items stay on the on-premises server. Microsoft-hosted agents are available only with Azure DevOps Services, so on-premises Azure DevOps Server needs self-hosted agents, which can run without internet access.
    fr: |
      Azure DevOps Server prend en charge les pipelines YAML : le code et les éléments de travail restent sur le serveur local. Les agents hébergés par Microsoft ne sont disponibles qu'avec Azure DevOps Services ; Azure DevOps Server en local exige des agents auto-hébergés, qui peuvent fonctionner sans accès à Internet.
  options:
    b: { en: "Microsoft-hosted agents exist only for Azure DevOps Services and need internet access to the code.", fr: "Les agents hébergés par Microsoft n'existent que pour Azure DevOps Services et doivent accéder au code par Internet." }
    c: { en: "GitHub Enterprise Cloud stores the code in a cloud service, which the regulations forbid.", fr: "GitHub Enterprise Cloud stocke le code dans un service cloud, ce que la réglementation interdit." }
    d: { en: "The runners would be local, but the repositories would still be stored in GitHub Enterprise Cloud.", fr: "Les exécuteurs seraient locaux, mais les dépôts resteraient stockés dans GitHub Enterprise Cloud." }
references:
  - title: Microsoft-hosted agents
    url: https://learn.microsoft.com/en-us/azure/devops/pipelines/agents/hosted
