id: az400-3b-cov-diff-yesno
objective: "3.2.4"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Wingtip hosts its code in an Azure Repos Git repository. A build validation branch policy on main runs a pipeline that collects code coverage in the Visual Studio `.coverage` format, and the diff coverage status is posted on pull requests. The repository doesn't contain an azurepipelines-coverage.yml file.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Wingtip héberge son code dans un dépôt Git Azure Repos. Une stratégie de branche de validation de build sur main exécute un pipeline qui collecte la couverture du code au format Visual Studio `.coverage`, et l'état de couverture différentielle est publié sur les pull requests. Le dépôt ne contient pas de fichier azurepipelines-coverage.yml.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: A pull request whose changed lines are 75% covered by tests receives a successful coverage status.
        fr: Une pull request dont 75 % des lignes modifiées sont couvertes par des tests reçoit un état de couverture réussi.
    - id: s2
      text:
        en: The coverage status is calculated on all the lines of the repository, not only on the lines that the pull request changes.
        fr: L'état de couverture est calculé sur toutes les lignes du dépôt, et pas seulement sur les lignes modifiées par la pull request.
    - id: s3
      text:
        en: If the code moved to a GitHub repository built by the same pipeline, the same coverage status would be posted on GitHub pull requests.
        fr: Si le code était déplacé vers un dépôt GitHub généré par le même pipeline, le même état de couverture serait publié sur les pull requests GitHub.
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: |
      Without a configuration file, the diff coverage target is 70% of the changed lines, so 75% passes. Diff coverage only measures the lines added or changed by the pull request, not the full coverage of the code base. Learn states that pull request code coverage is currently available only for Azure Repos.
    fr: |
      Sans fichier de configuration, la cible de couverture différentielle est de 70 % des lignes modifiées : 75 % réussit. La couverture différentielle ne mesure que les lignes ajoutées ou modifiées par la pull request, pas la couverture complète du code. Learn indique que la couverture du code des pull requests n'est actuellement disponible que pour Azure Repos.
references:
  - title: Review and configure code coverage results in Azure Pipelines
    url: https://learn.microsoft.com/en-us/azure/devops/pipelines/test/codecoverage-for-pullrequests
