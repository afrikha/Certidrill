id: az400-3d-hotfix-practices
objective: "3.4.4"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    Northwind Traders is writing a hotfix plan for high-priority production bugs. The plan must meet the following requirements:

    - A fix must reach production as fast as possible.
    - The security scans, builds, and production approvals required for normal releases must still apply.
    - A bug fixed in production must not reappear in the next release.

    Which two practices should the plan include? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind Traders rédige un plan de correctifs pour les bogues de production de priorité élevée. Le plan doit respecter les exigences suivantes :

    - Un correctif doit atteindre la production le plus vite possible.
    - Les analyses de sécurité, les builds et les approbations de production exigées pour les mises en production habituelles doivent toujours s'appliquer.
    - Un bogue corrigé en production ne doit pas réapparaître dans la version suivante.

    Quelles sont les deux pratiques que le plan doit inclure ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text: { en: "Grant hotfix authors the permission to bypass branch policies.", fr: "Accorder aux auteurs de correctifs l'autorisation de contourner les stratégies de branche." }
    - id: b
      text: { en: "Deploy the fix through the same pipeline, promoting one artifact through the stages.", fr: "Déployer le correctif par le même pipeline, en promouvant un seul artefact à travers les phases." }
    - id: c
      text: { en: "Build the fix on a developer workstation and upload it to production.", fr: "Générer le correctif sur le poste d'un développeur et le charger en production." }
    - id: d
      text: { en: "Port the fix to main after it is deployed to production.", fr: "Reporter le correctif dans main après son déploiement en production." }
    - id: e
      text: { en: "Disable the security scan for branches named hotfix/*.", fr: "Désactiver l'analyse de sécurité pour les branches nommées hotfix/*." }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |
      Reusing the normal pipeline keeps the required builds, scans, and approvals while still deploying the fix quickly, for example with shorter wait timers. Porting the fix to main, by a merge or a cherry-pick, ensures that the next release built from main contains it.
    fr: |
      Réutiliser le pipeline habituel conserve les builds, analyses et approbations exigées tout en déployant rapidement le correctif, par exemple avec des minuteurs d'attente plus courts. Reporter le correctif dans main, par une fusion ou une sélection de commit, garantit que la prochaine version générée à partir de main le contient.
  options:
    a:
      en: "Bypassing branch policies skips the required build validation and reviews."
      fr: "Contourner les stratégies de branche ignore la validation de build et les révisions exigées."
    c:
      en: "A workstation build skips the pipeline, its scans, and its approvals."
      fr: "Une build sur un poste de travail contourne le pipeline, ses analyses et ses approbations."
    e:
      en: "Disabling the scan removes a control that the requirements keep."
      fr: "Désactiver l'analyse supprime un contrôle que les exigences maintiennent."
references:
  - title: Adopt a Git branching strategy
    url: https://learn.microsoft.com/en-us/azure/devops/repos/git/git-branching-guidance
