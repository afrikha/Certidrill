id: az400-3f-retain-run
objective: "3.6.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso keeps pipeline runs for 30 days in the project retention settings. A completed run of the YAML pipeline **crm-ci** produced the build that an auditor must be able to inspect next year.

    You need to keep only that run, and all its artifacts, beyond the retention period. The retention of the other runs must not change, and the solution must minimize administrative effort.

    What should you do?
  fr: |
    Contoso conserve les exécutions de pipeline pendant 30 jours dans les paramètres de rétention du projet. Une exécution terminée du pipeline YAML **crm-ci** a produit le build qu'un auditeur doit pouvoir examiner l'an prochain.

    Vous devez conserver uniquement cette exécution, avec tous ses artefacts, au-delà de la période de rétention. La rétention des autres exécutions ne doit pas changer, et la solution doit réduire au minimum l'effort d'administration.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Increase Days to keep runs in Project settings > Pipelines > Settings", fr: "Augmenter les jours de conservation des exécutions dans Paramètres du projet > Pipelines > Paramètres" } }
    - { id: b, text: { en: "Add a retention rule for crm-ci in the retention settings of the pipeline", fr: "Ajouter une règle de rétention pour crm-ci dans les paramètres de rétention du pipeline" } }
    - { id: c, text: { en: "Retain the run from the More actions menu of its run details page", fr: "Conserver l'exécution depuis le menu More actions de sa page de détails" } }
    - { id: d, text: { en: "Add a CopyFiles@2 step to crm-ci that copies the build output to a file share", fr: "Ajouter à crm-ci une étape CopyFiles@2 qui copie la sortie du build vers un partage de fichiers" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      You can manually retain a run from the More actions menu of the pipeline run details page; a run marked for indefinite retention is not deleted by the retention policy, and its logs and artifacts are kept with it. Only that run is affected.
    fr: |
      Vous pouvez conserver manuellement une exécution depuis le menu More actions de la page de détails de l'exécution ; une exécution marquée pour une conservation indéfinie n'est pas supprimée par la stratégie de rétention, et ses journaux et artefacts sont conservés avec elle. Seule cette exécution est concernée.
  options:
    a: { en: "The project setting applies to every run of every pipeline in the project.", fr: "Le paramètre du projet s'applique à toutes les exécutions de tous les pipelines du projet." }
    b: { en: "Per-pipeline retention policies are no longer supported; retention is configured at project level.", fr: "Les stratégies de rétention par pipeline ne sont plus prises en charge ; la rétention se configure au niveau du projet." }
    d: { en: "A new step affects only future runs, not the completed run, and it adds storage to manage.", fr: "Une nouvelle étape ne concerne que les exécutions futures, pas l'exécution terminée, et elle ajoute un stockage à gérer." }
references:
  - title: Retention policies
    url: https://learn.microsoft.com/en-us/azure/devops/pipelines/policies/retention
