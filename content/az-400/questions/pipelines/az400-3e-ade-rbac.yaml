id: az400-3e-ade-rbac
objective: "3.5.5"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    Litware uses Azure Deployment Environments with a project named **proj-retail**. You need to grant the following permissions on proj-retail:

    - The developers must create environments from the project's environment definitions.
    - The auditors must view the environments that other users create, without creating any.

    The solution must follow the principle of least privilege.

    Which two roles should you assign? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware utilise Azure Deployment Environments avec un projet nommé **proj-retail**. Vous devez accorder les autorisations suivantes sur proj-retail :

    - Les développeurs doivent créer des environnements à partir des définitions d'environnement du projet.
    - Les auditeurs doivent consulter les environnements créés par d'autres utilisateurs, sans en créer.

    La solution doit respecter le principe du moindre privilège.

    Quels sont les deux rôles à attribuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Deployment Environments Reader to the auditors", fr: "Deployment Environments Reader aux auditeurs" } }
    - { id: b, text: { en: "DevCenter Project Admin to the developers", fr: "DevCenter Project Admin aux développeurs" } }
    - { id: c, text: { en: "DevCenter Owner to the auditors", fr: "DevCenter Owner aux auditeurs" } }
    - { id: d, text: { en: "Deployment Environments User to the developers", fr: "Deployment Environments User aux développeurs" } }
    - { id: e, text: { en: "Contributor on the deployment subscription to the developers", fr: "Contributor sur l'abonnement de déploiement aux développeurs" } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: "Deployment Environments User lets project members create environments, and Deployment Environments Reader lets users read environments that others create. Both are project-level roles; developers need no role on the deployment subscription."
    fr: "Deployment Environments User permet aux membres du projet de créer des environnements, et Deployment Environments Reader permet de lire les environnements créés par d'autres. Ce sont deux rôles au niveau du projet ; les développeurs n'ont besoin d'aucun rôle sur l'abonnement de déploiement."
  options:
    b:
      en: "DevCenter Project Admin can also manage the project's environment types, which is more than developers need."
      fr: "DevCenter Project Admin peut aussi gérer les types d'environnements du projet, ce qui dépasse les besoins des développeurs."
    c:
      en: "DevCenter Owner manages the dev center itself and assigns project roles, far more than reading environments."
      fr: "DevCenter Owner gère le centre de développement lui-même et attribue les rôles de projet, bien plus que la lecture des environnements."
    e:
      en: "Deployments run under the project environment type's managed identity, so developers don't need a role on the subscription."
      fr: "Les déploiements s'exécutent sous l'identité managée du type d'environnement de projet : les développeurs n'ont pas besoin de rôle sur l'abonnement."
references:
  - title: Key concepts for Azure Deployment Environments
    url: https://learn.microsoft.com/en-us/azure/deployment-environments/concept-environments-key-concepts
