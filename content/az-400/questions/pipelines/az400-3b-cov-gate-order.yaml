id: az400-3b-cov-gate-order
objective: "3.2.4"
type: ordering
difficulty: 3
status: draft
stem:
  en: |
    Contoso hosts a .NET web app in an Azure Repos Git repository. A YAML pipeline named **Shop-CI** builds the app on Microsoft-hosted windows-latest agents, but it doesn't collect code coverage, and no branch policy exists on main.

    You need to prevent pull requests that target main from being completed when their changed lines aren't sufficiently covered by tests. The default coverage target is acceptable.

    Which three actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Contoso héberge une application web .NET dans un dépôt Git Azure Repos. Un pipeline YAML nommé **Shop-CI** génère l'application sur des agents windows-latest hébergés par Microsoft, mais il ne collecte pas la couverture du code, et aucune stratégie de branche n'existe sur main.

    Vous devez empêcher l'achèvement des pull requests qui ciblent main quand leurs lignes modifiées ne sont pas suffisamment couvertes par des tests. La cible de couverture par défaut convient.

    Quelles sont les trois actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - { id: collect, text: { en: "Configure Shop-CI to collect code coverage in the Visual Studio `.coverage` format and publish it.", fr: "Configurer Shop-CI pour collecter la couverture du code au format Visual Studio `.coverage` et la publier." } }
    - { id: buildpol, text: { en: "Add a build validation branch policy on main that runs Shop-CI.", fr: "Ajouter sur main une stratégie de branche de validation de build qui exécute Shop-CI." } }
    - { id: statuspol, text: { en: "Add a status check branch policy on main that requires the `Shop-CI/codecoverage` status.", fr: "Ajouter sur main une stratégie de branche de vérification d'état qui exige l'état `Shop-CI/codecoverage`." } }
    - { id: ghrule, text: { en: "Add a branch protection rule for main that requires the `Shop-CI/codecoverage` status check.", fr: "Ajouter pour main une règle de protection de branche qui exige la vérification d'état `Shop-CI/codecoverage`." } }
    - { id: prtrig, text: { en: "Add a `pr` trigger for main to the YAML file of Shop-CI.", fr: "Ajouter un déclencheur `pr` pour main au fichier YAML de Shop-CI." } }
    - { id: empty, text: { en: "Set `failIfCoverageEmpty: true` in a PublishCodeCoverageResults@2 task of Shop-CI.", fr: "Définir `failIfCoverageEmpty: true` dans une tâche PublishCodeCoverageResults@2 de Shop-CI." } }
answer:
  sequence: [ collect, buildpol, statuspol ]
explanation:
  correct:
    en: |
      The pipeline must first produce coverage in the `.coverage` format, the format supported for pull request validation. A build validation policy then runs Shop-CI for each pull request, which makes Azure DevOps post the diff coverage status. That status is advisory until a status check policy on main requires `Shop-CI/codecoverage`.
    fr: |
      Le pipeline doit d'abord produire la couverture au format `.coverage`, le format pris en charge pour la validation des pull requests. Une stratégie de validation de build exécute ensuite Shop-CI pour chaque pull request, ce qui fait publier l'état de couverture différentielle par Azure DevOps. Cet état reste indicatif tant qu'une stratégie de vérification d'état sur main n'exige pas `Shop-CI/codecoverage`.
  options:
    ghrule: { en: "Branch protection rules are a GitHub feature; Azure Repos uses branch policies.", fr: "Les règles de protection de branche sont une fonctionnalité GitHub ; Azure Repos utilise des stratégies de branche." }
    prtrig: { en: "The pr keyword is ignored for Azure Repos; pull request builds come from build validation.", fr: "Le mot clé pr est ignoré pour Azure Repos ; les builds de pull request proviennent de la validation de build." }
    empty: { en: "failIfCoverageEmpty catches a missing report but doesn't block pull requests.", fr: "failIfCoverageEmpty détecte un rapport manquant mais ne bloque pas les pull requests." }
references:
  - title: Review and configure code coverage results in Azure Pipelines
    url: https://learn.microsoft.com/en-us/azure/devops/pipelines/test/codecoverage-for-pullrequests
  - title: Build Azure Repos Git or TFS Git repositories
    url: https://learn.microsoft.com/en-us/azure/devops/pipelines/repos/azure-repos-git
