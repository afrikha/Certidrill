id: az400-3f-recent-runs-kept
objective: "3.6.4"
type: multi
difficulty: 3
shuffle: false
status: draft
stem:
  en: |
    Adatum has a YAML pipeline named **core-ci** that builds an Azure Repos Git repository. The default branch is main. The main and release/2.0 branches have branch policies; the feature branches have none.

    The project retention settings are: Days to keep runs = 30 and Number of recent runs to retain per pipeline = 2. The pipeline has the following runs, newest first. All of them succeeded and finished more than 30 days ago. None is retained indefinitely, has a retention lease or is retained by a release.

    | Run | Branch |
    | --- | --- |
    | Run 6 | feature/a |
    | Run 5 | main |
    | Run 4 | feature/b |
    | Run 3 | main |
    | Run 2 | release/2.0 |
    | Run 1 | main |

    Which two runs will be deleted the next time the retention policies are processed?

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum dispose d'un pipeline YAML nommé **core-ci** qui génère un dépôt Git Azure Repos. La branche par défaut est main. Les branches main et release/2.0 ont des stratégies de branche ; les branches feature n'en ont aucune.

    Les paramètres de rétention du projet sont : jours de conservation des exécutions = 30 et nombre d'exécutions récentes à conserver par pipeline = 2. Le pipeline compte les exécutions suivantes, de la plus récente à la plus ancienne. Toutes ont réussi et se sont terminées il y a plus de 30 jours. Aucune n'est conservée indéfiniment, n'a de bail de rétention ni n'est retenue par une mise en production.

    | Exécution | Branche |
    | --- | --- |
    | Run 6 | feature/a |
    | Run 5 | main |
    | Run 4 | feature/b |
    | Run 3 | main |
    | Run 2 | release/2.0 |
    | Run 1 | main |

    Quelles sont les deux exécutions qui seront supprimées lors du prochain traitement des stratégies de rétention ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: r6, text: Run 6 }
    - { id: r5, text: Run 5 }
    - { id: r4, text: Run 4 }
    - { id: r3, text: Run 3 }
    - { id: r2, text: Run 2 }
    - { id: r1, text: Run 1 }
answer: { optionIds: [ r4, r1 ] }
explanation:
  correct:
    en: |
      For Azure Repos, the number of recent runs is kept for the pipeline overall (runs 6 and 5), for the default branch (runs 5 and 3) and for each protected branch, that is each branch with branch policies (run 2 for release/2.0). Runs 4 and 1 are in none of these sets and are older than 30 days, so they are deleted.
    fr: |
      Pour Azure Repos, le nombre d'exécutions récentes est conservé pour le pipeline dans son ensemble (exécutions 6 et 5), pour la branche par défaut (exécutions 5 et 3) et pour chaque branche protégée, c'est-à-dire chaque branche dotée de stratégies de branche (exécution 2 pour release/2.0). Les exécutions 4 et 1 ne font partie d'aucun de ces ensembles et ont plus de 30 jours : elles sont supprimées.
  options:
    r6: { en: "Run 6 is one of the two latest runs of the pipeline.", fr: "L'exécution 6 fait partie des deux dernières exécutions du pipeline." }
    r5: { en: "Run 5 is among the latest runs of the pipeline and of main.", fr: "L'exécution 5 fait partie des dernières exécutions du pipeline et de main." }
    r3: { en: "Run 3 is one of the two latest runs of main, the default branch.", fr: "L'exécution 3 fait partie des deux dernières exécutions de main, la branche par défaut." }
    r2: { en: "Run 2 is the latest run of release/2.0, a protected branch.", fr: "L'exécution 2 est la dernière exécution de release/2.0, une branche protégée." }
references:
  - title: Retention policies
    url: https://learn.microsoft.com/en-us/azure/devops/pipelines/policies/retention
