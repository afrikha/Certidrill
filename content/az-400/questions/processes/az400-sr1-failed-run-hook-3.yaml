id: az400-sr1-failed-run-hook-3
objective: "1.3.4"
type: series_yesno
series: az400-sr1-failed-run-hook
seriesOrder: 3
difficulty: 3
status: draft
stem:
  en: You create a Web Hooks subscription filtered on the Failed result that targets an http:// URL.
  fr: Vous créez un abonnement Web Hooks filtré sur le résultat Failed qui cible une URL http://.
body:
  solution:
    en: |
      In **Project settings > Service hooks** of Orders, you create a subscription for the **Web Hooks** service. You select the **Run state changed** event, filtered on the orders-ci pipeline, the **Completed** state, and the **Failed** result. You enter the URL `http://incidents.litware.com/api/devops` with the basic authentication user name and password.
    fr: |
      Dans **Project settings > Service hooks** d'Orders, vous créez un abonnement pour le service **Web Hooks**. Vous sélectionnez l'événement **Run state changed**, filtré sur le pipeline orders-ci, l'état **Completed** et le résultat **Failed**. Vous saisissez l'URL `http://incidents.litware.com/api/devops` avec le nom d'utilisateur et le mot de passe de l'authentification de base.
answer: { value: false }
explanation:
  correct:
    en: The event and filters are correct, but a webhook that uses basic authentication must target an HTTPS endpoint. Over HTTP the credentials and the payload would travel unencrypted, so this subscription does not provide a supported way to deliver the payloads to the incident platform.
    fr: "L'événement et les filtres sont corrects, mais un webhook qui utilise l'authentification de base doit cibler un point de terminaison HTTPS. En HTTP, les informations d'identification et la charge utile circuleraient sans chiffrement : cet abonnement ne fournit pas de moyen pris en charge pour remettre les charges utiles à la plateforme d'incidents."
references:
  - title: Webhooks
    url: https://learn.microsoft.com/en-us/azure/devops/service-hooks/services/webhooks
