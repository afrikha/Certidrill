id: az400-1a-linked-workitems-policy
objective: "1.1.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso stores the code of its billing service in an Azure Repos Git repository named **billing**. Auditors require that every change merged into the `main` branch can be traced back to a work item in Azure Boards.

    You need to prevent pull requests that target `main` from being completed unless they are associated with at least one work item.

    What should you configure?
  fr: |
    Contoso stocke le code de son service de facturation dans un dépôt Git Azure Repos nommé **billing**. Les auditeurs exigent que chaque modification fusionnée dans la branche `main` puisse être rattachée à un élément de travail dans Azure Boards.

    Vous devez empêcher la complétion des pull requests qui ciblent `main` tant qu'elles ne sont pas associées à au moins un élément de travail.

    Que devez-vous configurer ?
body:
  options:
    - { id: a, text: { en: "The Automatically link new work in this build option of the build pipeline", fr: "L'option Automatically link new work in this build du pipeline de build" } }
    - { id: b, text: { en: "The Commit mention work item resolution setting of the repository", fr: "Le paramètre Commit mention work item resolution du dépôt" } }
    - { id: c, text: { en: "The Check for linked work items branch policy on main", fr: "La stratégie de branche Check for linked work items sur main" } }
    - { id: d, text: { en: "The Automatically included reviewers branch policy on main", fr: "La stratégie de branche Automatically included reviewers sur main" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      The Check for linked work items branch policy blocks the completion of a pull request into the protected branch until at least one work item is linked, which gives traceability from every merged change to a work item. Setting the policy to Optional would only show a warning.
    fr: |
      La stratégie de branche Check for linked work items bloque la complétion d'une pull request vers la branche protégée tant qu'aucun élément de travail n'y est lié, ce qui assure la traçabilité de chaque modification fusionnée vers un élément de travail. Définie sur Optional, la stratégie n'afficherait qu'un avertissement.
  options:
    a: { en: "This pipeline option adds Integrated in build links for successful builds; it never blocks a pull request.", fr: "Cette option de pipeline ajoute des liens Integrated in build pour les builds réussies ; elle ne bloque jamais une pull request." }
    b: { en: "This setting controls whether mentions such as Fixes #123 change the state of work items; it does not require a link.", fr: "Ce paramètre détermine si des mentions comme Fixes #123 changent l'état des éléments de travail ; il n'exige aucun lien." }
    d: { en: "This policy adds reviewers to pull requests; it does not check for work item links.", fr: "Cette stratégie ajoute des réviseurs aux pull requests ; elle ne vérifie pas les liens vers des éléments de travail." }
references:
  - title: Set and manage branch policies
    url: https://learn.microsoft.com/en-us/azure/devops/repos/git/branch-policies
