id: az400-1a-agile-backlog-levels
objective: "1.1.1"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Fabrikam creates an Azure DevOps project named **Claims** that uses the default Agile process. The product owner wants to structure the work from large business initiatives down to the daily work of developers, by using the default backlog levels.

    Which work item type should you use at each level? To answer, drag the appropriate work item types to the correct levels. Each work item type may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam crée un projet Azure DevOps nommé **Claims** qui utilise le processus Agile par défaut. Le propriétaire de produit veut structurer le travail, des grandes initiatives métier jusqu'au travail quotidien des développeurs, en utilisant les niveaux de backlog par défaut.

    Quel type d'élément de travail devez-vous utiliser à chaque niveau ? Pour répondre, faites glisser les types d'éléments de travail appropriés vers les niveaux correspondants. Chaque type d'élément de travail peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: epic, text: Epic }
    - { id: feature, text: Feature }
    - { id: story, text: User Story }
    - { id: task, text: Task }
    - { id: pbi, text: Product Backlog Item }
    - { id: req, text: Requirement }
  targets:
    - { id: l1, text: { en: "Top portfolio backlog", fr: "Backlog de portefeuille supérieur" } }
    - { id: l2, text: { en: "Second portfolio backlog", fr: "Second backlog de portefeuille" } }
    - { id: l3, text: { en: "Requirement backlog (product backlog)", fr: "Backlog des exigences (backlog de produit)" } }
    - { id: l4, text: { en: "Taskboard (sprint work)", fr: "Tableau des tâches (travail du sprint)" } }
answer:
  mapping: { l1: epic, l2: feature, l3: story, l4: task }
explanation:
  correct:
    en: |
      In the Agile process, the portfolio backlogs use Epic and Feature, the product backlog uses User Story, and the sprint taskboard uses Task. Bugs can optionally appear on the backlog or the taskboard depending on the team setting.
    fr: |
      Dans le processus Agile, les backlogs de portefeuille utilisent Epic et Feature, le backlog de produit utilise User Story et le tableau des tâches du sprint utilise Task. Les bogues peuvent apparaître sur le backlog ou sur le tableau des tâches selon le paramètre de l'équipe.
  options:
    pbi: { en: "Product Backlog Item is the requirement type of the Scrum process.", fr: "Product Backlog Item est le type d'exigence du processus Scrum." }
    req: { en: "Requirement is the requirement type of the CMMI process.", fr: "Requirement est le type d'exigence du processus CMMI." }
references:
  - title: Default processes and process templates
    url: https://learn.microsoft.com/en-us/azure/devops/boards/work-items/guidance/choose-process
