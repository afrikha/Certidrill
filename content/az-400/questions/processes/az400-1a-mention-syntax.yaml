id: az400-1a-mention-syntax
objective: "1.1.3"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    Contoso tracks all its work in an Azure Boards project. The team develops the **api** service in an Azure Repos Git repository and the **web** front end in a GitHub repository that is connected to the Azure Boards project by using the Azure Boards app for GitHub. Both repositories use `main` as the default branch.

    You need to write the text that developers must include to meet each requirement.

    Which text should you use? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso suit tout son travail dans un projet Azure Boards. L'équipe développe le service **api** dans un dépôt Git Azure Repos et le front-end **web** dans un dépôt GitHub connecté au projet Azure Boards avec l'application Azure Boards pour GitHub. Les deux dépôts utilisent `main` comme branche par défaut.

    Vous devez rédiger le texte que les développeurs doivent inclure pour satisfaire chaque exigence.

    Quel texte devez-vous utiliser ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Azure Repos commit message that links work item 412 without changing its state: [[ado]]
      GitHub commit message that links work item 413 without changing its state: [[ghlink]]
      GitHub pull request description that links work item 414 and resolves it when the pull request is merged into main: [[ghfix]]
    fr: |
      Message de commit Azure Repos qui lie l'élément de travail 412 sans changer son état : [[ado]]
      Message de commit GitHub qui lie l'élément de travail 413 sans changer son état : [[ghlink]]
      Description de pull request GitHub qui lie l'élément de travail 414 et le résout lors de la fusion de la pull request dans main : [[ghfix]]
  slots:
    - id: ado
      options:
        - { id: hash, text: "#412" }
        - { id: ab, text: "AB#412" }
        - { id: fix, text: "Fixes #412" }
        - { id: wi, text: "WI-412" }
    - id: ghlink
      options:
        - { id: ab, text: "AB#413" }
        - { id: hash, text: "#413" }
        - { id: fixab, text: "Fixes AB#413" }
        - { id: at, text: "@AB413" }
    - id: ghfix
      options:
        - { id: fixab, text: "Fixes AB#414" }
        - { id: fixhash, text: "Fixes #414" }
        - { id: ab, text: "AB#414" }
        - { id: closegh, text: "Closes GH#414" }
answer:
  values: { ado: hash, ghlink: ab, ghfix: fixab }
explanation:
  correct:
    en: |
      In Azure Repos, a #ID mention in a commit message creates a Commit link to the work item; a keyword such as Fixes would also try to resolve it when the commit reaches main. In a connected GitHub repository, work items are referenced with AB#ID, because #ID refers to GitHub issues and pull requests. A keyword such as Fixes before AB#ID in a pull request description also transitions the work item to its Resolved (or Completed) state when the pull request is merged into the default branch.
    fr: |
      Dans Azure Repos, une mention #ID dans un message de commit crée un lien Commit vers l'élément de travail ; un mot clé comme Fixes tenterait aussi de le résoudre quand le commit atteint main. Dans un dépôt GitHub connecté, les éléments de travail se référencent avec AB#ID, car #ID désigne les issues et pull requests GitHub. Un mot clé comme Fixes devant AB#ID dans la description d'une pull request fait aussi passer l'élément de travail à l'état Resolved (ou Completed) quand la pull request est fusionnée dans la branche par défaut.
  options:
    fix: { en: "Fixes #412 also resolves the work item once the commit reaches main, which changes its state.", fr: "Fixes #412 résout aussi l'élément de travail lorsque le commit atteint main, ce qui change son état." }
    hash: { en: "In a GitHub repository, #413 references GitHub issue or pull request 413, not the Azure Boards work item.", fr: "Dans un dépôt GitHub, #413 référence l'issue ou la pull request GitHub 413, pas l'élément de travail Azure Boards." }
    fixab: { en: "The Fixes keyword before AB#413 requests a state transition, which the requirement excludes.", fr: "Le mot clé Fixes devant AB#413 demande un changement d'état, ce que l'exigence exclut." }
    fixhash: { en: "Fixes #414 would close GitHub issue 414, not resolve the Azure Boards work item.", fr: "Fixes #414 fermerait l'issue GitHub 414, et non l'élément de travail Azure Boards." }
references:
  - title: Link work items to objects
    url: https://learn.microsoft.com/en-us/azure/devops/boards/backlogs/add-link
  - title: Link GitHub commits, pull requests, branches, and issues to work items in Azure Boards
    url: https://learn.microsoft.com/en-us/azure/devops/boards/github/link-to-from-github
