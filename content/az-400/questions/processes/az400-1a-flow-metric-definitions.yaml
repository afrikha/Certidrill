id: az400-1a-flow-metric-definitions
objective: "1.2.1"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Adatum is designing a DevOps dashboard for its engineering leadership. The dashboard must display four metrics, each defined in the dashboard specification.

    Which metric matches each definition? To answer, drag the appropriate metrics to the correct definitions. Each metric may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum conçoit un tableau de bord DevOps pour sa direction de l'ingénierie. Le tableau de bord doit afficher quatre métriques, chacune définie dans la spécification du tableau de bord.

    Quelle métrique correspond à chaque définition ? Pour répondre, faites glisser les métriques appropriées vers les définitions correspondantes. Chaque métrique peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: lead, text: { en: "Lead time", fr: "Délai de livraison (lead time)" } }
    - { id: cycle, text: { en: "Cycle time", fr: "Durée de cycle (cycle time)" } }
    - { id: mttr, text: { en: "Mean time to recovery", fr: "Temps moyen de récupération (MTTR)" } }
    - { id: wip, text: { en: "Work in progress", fr: "Travail en cours (WIP)" } }
    - { id: velocity, text: { en: "Velocity", fr: "Vélocité" } }
  targets:
    - { id: t1, text: { en: "Elapsed time from the creation of a work item until it reaches a Completed state", fr: "Temps écoulé entre la création d'un élément de travail et son arrivée dans un état Completed" } }
    - { id: t2, text: { en: "Elapsed time from when a work item first enters an In Progress state until it reaches a Completed state", fr: "Temps écoulé entre la première entrée d'un élément de travail dans un état In Progress et son arrivée dans un état Completed" } }
    - { id: t3, text: { en: "How long it takes to recover from a failure or a breach in production", fr: "Temps nécessaire pour se rétablir d'une défaillance ou d'une faille en production" } }
    - { id: t4, text: { en: "Number of requirements that are started but not finished at a given time", fr: "Nombre d'exigences commencées mais non terminées à un instant donné" } }
answer:
  mapping: { t1: lead, t2: cycle, t3: mttr, t4: wip }
explanation:
  correct:
    en: |
      Lead time starts when the work item is created, whereas cycle time starts when work actually begins (first In Progress state); both end when the item reaches a Completed state. Mean time to recovery measures how quickly a team recovers from a failure or breach. Work in progress counts unfinished requirements, which a cumulative flow diagram shows as the height of the in-progress bands.
    fr: |
      Le délai de livraison commence à la création de l'élément de travail, alors que la durée de cycle commence quand le travail débute réellement (premier état In Progress) ; les deux se terminent quand l'élément atteint un état Completed. Le temps moyen de récupération mesure la rapidité avec laquelle une équipe se rétablit d'une défaillance ou d'une faille. Le travail en cours compte les exigences non terminées, qu'un diagramme de flux cumulé montre par la hauteur des bandes en cours.
  options:
    velocity: { en: "Velocity is the amount of work (count or sum of estimates) a team completes per sprint, not a duration or a snapshot of unfinished work.", fr: "La vélocité est la quantité de travail (nombre ou somme des estimations) qu'une équipe termine par sprint, pas une durée ni un instantané du travail non terminé." }
references:
  - title: Configure lead time and cycle time widgets
    url: https://learn.microsoft.com/en-us/azure/devops/report/dashboards/cycle-time-and-lead-time
  - title: What is DevOps?
    url: https://learn.microsoft.com/en-us/devops/what-is-devops
