id: az400-1b-hook-incoming-trigger
objective: "1.3.4"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam, Inc. stores build artifacts in an on-premises Artifactory server. Azure DevOps has no visibility into this server. The server can send a webhook request to any URL when a package is published.

    You need a YAML pipeline in Azure Pipelines to start automatically each time a package is published to the Artifactory repository named **maven-releases**.

    Which two actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam, Inc. stocke des artefacts de build dans un serveur Artifactory local. Azure DevOps n'a aucune visibilité sur ce serveur. Le serveur peut envoyer une requête webhook à n'importe quelle URL quand un package est publié.

    Un pipeline YAML d'Azure Pipelines doit démarrer automatiquement chaque fois qu'un package est publié dans le dépôt Artifactory nommé **maven-releases**.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Create a service hook subscription that uses the Web Hooks service in Project settings.", fr: "Créer, dans Project settings, un abonnement de hook de service qui utilise le service Web Hooks." } }
    - { id: b, text: { en: "Create an Incoming WebHook service connection and configure Artifactory to post to its URL.", fr: "Créer une connexion de service Incoming WebHook et configurer Artifactory pour publier vers son URL." } }
    - { id: c, text: { en: "Add a pipelines resource with a trigger to the YAML pipeline.", fr: "Ajouter au pipeline YAML une ressource pipelines dotée d'un déclencheur." } }
    - { id: d, text: { en: "Add a webhooks resource that references the service connection and filters on the repository name.", fr: "Ajouter une ressource webhooks qui référence la connexion de service et filtre sur le nom du dépôt." } }
    - { id: e, text: { en: "Add a schedules trigger that runs the pipeline every five minutes.", fr: "Ajouter un déclencheur schedules qui exécute le pipeline toutes les cinq minutes." } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: "An external service triggers a YAML pipeline through an Incoming WebHook service connection, whose URL has the form `https://dev.azure.com/<org>/_apis/public/distributedtask/webhooks/<connection name>?api-version=6.0-preview`. The pipeline subscribes to the events with a `webhooks` resource that names the connection, and `filters` on the JSON payload (for example `path: repositoryName`, `value: maven-releases`) limit the runs to the right repository."
    fr: "Un service externe déclenche un pipeline YAML par une connexion de service Incoming WebHook, dont l'URL a la forme `https://dev.azure.com/<org>/_apis/public/distributedtask/webhooks/<nom de la connexion>?api-version=6.0-preview`. Le pipeline s'abonne aux événements avec une ressource `webhooks` qui nomme la connexion, et des `filters` sur la charge utile JSON (par exemple `path: repositoryName`, `value: maven-releases`) limitent les exécutions au bon dépôt."
  options:
    a: { en: "A Web Hooks service hook sends Azure DevOps events out to another service; it doesn't receive events from Artifactory.", fr: "Un hook de service Web Hooks envoie des événements Azure DevOps vers un autre service ; il ne reçoit pas d'événements d'Artifactory." }
    c: { en: "A pipelines resource triggers a pipeline when another Azure Pipelines pipeline completes, not on external events.", fr: "Une ressource pipelines déclenche un pipeline quand un autre pipeline Azure Pipelines se termine, pas sur des événements externes." }
    e: { en: "A schedule runs the pipeline whether or not a package was published, and doesn't start it when the package is published.", fr: "Une planification exécute le pipeline qu'un package ait été publié ou non, et ne le démarre pas au moment de la publication." }
references:
  - title: Resources in YAML pipelines
    url: https://learn.microsoft.com/en-us/azure/devops/pipelines/process/resources
