id: az400-1b-hook-signature-header
objective: "1.3.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Woodgrove Bank uses GitHub Enterprise Server and Azure DevOps Services. A repository webhook on GitHub Enterprise Server posts push events to an Incoming WebHook service connection named **ghes-push**, which triggers a YAML pipeline through a `webhooks` resource.

    The GitHub webhook is configured with a secret. You need Azure DevOps to reject any request whose payload wasn't signed with this secret. You set the **Secret** field of ghes-push to the same secret.

    Which value should you enter in the **Http Header** field of ghes-push?
  fr: |
    Woodgrove Bank utilise GitHub Enterprise Server et Azure DevOps Services. Un webhook de dépôt sur GitHub Enterprise Server publie les événements push vers une connexion de service Incoming WebHook nommée **ghes-push**, qui déclenche un pipeline YAML par une ressource `webhooks`.

    Le webhook GitHub est configuré avec un secret. Azure DevOps doit rejeter toute requête dont la charge utile n'a pas été signée avec ce secret. Vous renseignez le champ **Secret** de ghes-push avec le même secret.

    Quelle valeur devez-vous saisir dans le champ **Http Header** de ghes-push ?
body:
  options:
    - { id: a, text: X-GitHub-Event }
    - { id: b, text: X-GitHub-Delivery }
    - { id: c, text: X-Hub-Signature }
    - { id: d, text: X-GitHub-Hook-ID }
answer: { optionId: c }
explanation:
  correct:
    en: The Secret field of an Incoming WebHook service connection is used to verify the HMAC-SHA1 hash of the payload, and the Http Header field names the request header that carries this hash. For GitHub, the header is X-Hub-Signature. A request whose hash doesn't match the secret isn't accepted.
    fr: Le champ Secret d'une connexion de service Incoming WebHook sert à vérifier le hachage HMAC-SHA1 de la charge utile, et le champ Http Header indique l'en-tête de la requête qui transporte ce hachage. Pour GitHub, il s'agit de l'en-tête X-Hub-Signature. Une requête dont le hachage ne correspond pas au secret n'est pas acceptée.
  options:
    a:
      en: X-GitHub-Event carries the name of the event, such as push, not a signature of the payload.
      fr: X-GitHub-Event transporte le nom de l'événement, comme push, pas une signature de la charge utile.
    b:
      en: X-GitHub-Delivery carries a unique identifier of the delivery, not a signature.
      fr: X-GitHub-Delivery transporte un identifiant unique de la livraison, pas une signature.
    d:
      en: X-GitHub-Hook-ID identifies the webhook that sent the request; it doesn't prove that the payload was signed with the secret.
      fr: X-GitHub-Hook-ID identifie le webhook qui a envoyé la requête ; il ne prouve pas que la charge utile a été signée avec le secret.
references:
  - title: Resources in YAML pipelines
    url: https://learn.microsoft.com/en-us/azure/devops/pipelines/process/resources
