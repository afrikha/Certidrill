id: az400-cs1c-boards-links
objective: "1.3.5"
type: single
caseStudy: az400-cs1c-southridge-video
difficulty: 1
status: draft
stem:
  en: |
    You need to meet the planning requirement.

    What should you do?
  fr: |
    Vous devez satisfaire l'exigence de planification.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Connect the repositories to Games with the Azure Boards app for GitHub, and ask developers to add Fixes AB# and the work item ID to pull request titles", fr: "Connecter les dépôts à Games avec l'application Azure Boards pour GitHub, et demander aux développeurs d'ajouter Fixes AB# et l'ID de l'élément de travail au titre des pull requests" } }
    - { id: b, text: { en: "Connect the repositories to Games with the Azure Boards app for GitHub, and ask developers to add Fixes AB# and the work item ID to pull request descriptions", fr: "Connecter les dépôts à Games avec l'application Azure Boards pour GitHub, et demander aux développeurs d'ajouter Fixes AB# et l'ID de l'élément de travail à la description des pull requests" } }
    - { id: c, text: { en: "Connect the repositories to Games with the Azure Boards app for GitHub, and ask developers to add Fixes # and the work item ID to commit messages", fr: "Connecter les dépôts à Games avec l'application Azure Boards pour GitHub, et demander aux développeurs d'ajouter Fixes # et l'ID de l'élément de travail aux messages de commit" } }
    - { id: d, text: { en: "Create a service hook subscription in Games that sends work item events to the GitHub repositories, and ask developers to reference work items in commit messages", fr: "Créer un abonnement de raccordement de service dans Games qui envoie les événements d'éléments de travail aux dépôts GitHub, et demander aux développeurs de référencer les éléments de travail dans les messages de commit" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      The Azure Boards app for GitHub connects the GitHub repositories to the project. The AB#ID syntax in commit messages and pull request descriptions then creates links on the work items, and a keyword such as Fixes before AB#ID moves the work item to the first state of the Resolved category (or Completed) when the pull request merges into the default branch.
    fr: |
      L'application Azure Boards pour GitHub connecte les dépôts GitHub au projet. La syntaxe AB#ID dans les messages de commit et les descriptions de pull request crée alors des liens sur les éléments de travail, et un mot clé comme Fixes devant AB#ID fait passer l'élément de travail au premier état de la catégorie Resolved (ou Completed) quand la pull request est fusionnée dans la branche par défaut.
  options:
    a: { en: "AB# mentions in pull request titles and comments do not create links, so the bug is neither linked nor transitioned.", fr: "Les mentions AB# dans les titres et les commentaires de pull request ne créent pas de liens : le bogue n'est ni lié ni changé d'état." }
    c: { en: "Fixes #ID refers to a GitHub issue of the repository, not to an Azure Boards work item.", fr: "Fixes #ID fait référence à un problème GitHub du dépôt, pas à un élément de travail Azure Boards." }
    d: { en: "Service hooks send Azure DevOps events to other services; they do not link GitHub commits or pull requests to work items.", fr: "Les raccordements de service envoient des événements Azure DevOps vers d'autres services ; ils ne lient pas les commits ni les pull requests GitHub aux éléments de travail." }
references:
  - title: Link GitHub commits, pull requests, branches, and issues to work items in Azure Boards
    url: https://learn.microsoft.com/en-us/azure/devops/boards/github/link-to-from-github
