id: az400-sr1-failed-run-hook-2
objective: "1.3.4"
type: series_yesno
series: az400-sr1-failed-run-hook
seriesOrder: 2
difficulty: 1
status: draft
stem:
  en: You create a Web Hooks subscription for the Run state changed event filtered on the Failed result.
  fr: Vous créez un abonnement Web Hooks pour l'événement Run state changed filtré sur le résultat Failed.
body:
  solution:
    en: |
      In **Project settings > Service hooks** of Orders, you create a subscription for the **Web Hooks** service. You select the **Run state changed** event, filtered on the orders-ci pipeline, the **Completed** state, and the **Failed** result. In the action, you enter the HTTPS URL of the endpoint and the basic authentication user name and password.
    fr: |
      Dans **Project settings > Service hooks** d'Orders, vous créez un abonnement pour le service **Web Hooks**. Vous sélectionnez l'événement **Run state changed**, filtré sur le pipeline orders-ci, l'état **Completed** et le résultat **Failed**. Dans l'action, vous saisissez l'URL HTTPS du point de terminaison ainsi que le nom d'utilisateur et le mot de passe de l'authentification de base.
answer: { value: true }
explanation:
  correct:
    en: A Web Hooks service hook sends a JSON representation of an Azure DevOps event to a public endpoint, with no code and no change to the pipeline. The Run state changed event can be filtered on a specific pipeline and on the Failed result, so only failed runs of orders-ci are sent, and basic authentication is supported over HTTPS.
    fr: "Un service hook Web Hooks envoie une représentation JSON d'un événement Azure DevOps à un point de terminaison public, sans code ni modification du pipeline. L'événement Run state changed peut être filtré sur un pipeline précis et sur le résultat Failed : seules les exécutions en échec d'orders-ci sont envoyées, et l'authentification de base est prise en charge via HTTPS."
references:
  - title: Webhooks
    url: https://learn.microsoft.com/en-us/azure/devops/service-hooks/services/webhooks
  - title: Service hook events
    url: https://learn.microsoft.com/en-us/azure/devops/service-hooks/events
