id: az400-1a-gh-projects-roadmap
objective: "1.1.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Wingtip Toys tracks the work of three repositories in a single GitHub project. Each item has an iteration field named **Sprint** and a date field named **Target date**.

    The product manager needs a view that places the issues and pull requests on a timeline by sprint, can be zoomed to a month or a quarter, and lets items be dragged to change their dates.

    Which layout should you configure for the view?
  fr: |
    Wingtip Toys suit le travail de trois dépôts dans un seul projet GitHub. Chaque élément possède un champ d'itération nommé **Sprint** et un champ de date nommé **Target date**.

    Le responsable produit a besoin d'une vue qui place les issues et les pull requests sur une chronologie par sprint, qui peut être zoomée sur un mois ou un trimestre et qui permet de faire glisser les éléments pour changer leurs dates.

    Quelle disposition devez-vous configurer pour la vue ?
body:
  options:
    - { id: a, text: { en: "Table, grouped by the Sprint field", fr: "Table, groupée par le champ Sprint" } }
    - { id: b, text: { en: "Board, with a column per sprint", fr: "Board, avec une colonne par sprint" } }
    - { id: c, text: { en: "Roadmap, using the Sprint field", fr: "Roadmap, avec le champ Sprint" } }
    - { id: d, text: { en: "An insights chart, using the Sprint field", fr: "Un graphique Insights, avec le champ Sprint" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      The roadmap layout displays project items on a timeline positioned by date or iteration fields, with zoom levels of month, quarter or year. You can drag items to change their start or target dates or their iteration, and add markers for iterations and milestones.
    fr: |
      La disposition Roadmap affiche les éléments du projet sur une chronologie positionnée par des champs de date ou d'itération, avec des niveaux de zoom mois, trimestre ou année. Vous pouvez faire glisser les éléments pour changer leurs dates de début ou de fin ou leur itération, et ajouter des marqueurs pour les itérations et les jalons.
  options:
    a: { en: "A table groups items by sprint as rows, but it does not draw a timeline or offer zoom levels.", fr: "Une table regroupe les éléments par sprint sous forme de lignes, mais elle ne dessine pas de chronologie et n'offre pas de niveaux de zoom." }
    b: { en: "A board shows cards in columns, which suits status tracking rather than a dated timeline.", fr: "Un board affiche des cartes en colonnes, ce qui convient au suivi des statuts plutôt qu'à une chronologie datée." }
    d: { en: "Insights charts summarize item counts; items cannot be dragged on them to change dates.", fr: "Les graphiques Insights résument des nombres d'éléments ; on ne peut pas y faire glisser des éléments pour changer leurs dates." }
references:
  - title: How to organize your project
    url: https://learn.microsoft.com/en-us/training/modules/manage-work-github-projects/4-how-to-organize-your-project
  - title: Manage work with GitHub Project boards
    url: https://learn.microsoft.com/en-us/training/modules/plan-agile-github-projects-azure-boards/7-manage-work-github-project-boards
