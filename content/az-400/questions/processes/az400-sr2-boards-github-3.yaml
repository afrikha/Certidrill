series: az400-sr2-boards-github
seriesOrder: 3
difficulty: 2
status: draft
stem:
  en: You connect the repository with the Azure Boards app and use Fixes #ID in pull request descriptions.
  fr: Vous connectez le dépôt avec l'application Azure Boards et utilisez Fixes #ID dans les descriptions des pull requests.
body:
  solution:
    en: |
      You install the **Azure Boards app for GitHub** on fabrikam/storefront and connect the repository to the Retail project. You instruct developers to add `Fixes #<work item ID>` to the **description** of each bug-fix pull request.
    fr: |
      Vous installez l'**application Azure Boards pour GitHub** sur fabrikam/storefront et connectez le dépôt au projet Retail. Vous demandez aux développeurs d'ajouter `Fixes #<ID de l'élément de travail>` à la **description** de chaque pull request de correction de bogue.
answer: { value: false }
explanation:
  correct:
    en: In GitHub, `#ID` without the `AB` prefix refers to an issue or pull request of the GitHub repository, so `Fixes #412` targets GitHub item 412, not Azure Boards work item 412. Azure Boards recognizes only the `AB#ID` syntax to create the link and apply the state transition.
    fr: "Dans GitHub, `#ID` sans le préfixe `AB` désigne un ticket ou une pull request du dépôt GitHub : `Fixes #412` vise l'élément GitHub 412 et non l'élément de travail Azure Boards 412. Azure Boards reconnaît uniquement la syntaxe `AB#ID` pour créer le lien et appliquer la transition d'état."
references:
  - title: Link GitHub commits, PRs, branches, and issues to work items - Azure Boards
    url: https://learn.microsoft.com/en-us/azure/devops/boards/github/link-to-from-github
