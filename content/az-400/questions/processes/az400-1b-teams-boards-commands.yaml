id: az400-1b-teams-boards-commands
objective: "1.3.6"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Proseware, Inc. uses Azure DevOps Services and Microsoft Teams. The Azure Boards app is installed in a Teams channel named **Payments**. The Azure DevOps project **webshop** contains more than 300 area paths.

    You need to configure the channel so that the team can create work items in webshop from the channel and receive notifications for the work items of the area path `webshop\Payments`. That area path doesn't appear in the **Area path** drop-down list of the subscription dialog.

    Which commands should you run in the channel, in this order? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware, Inc. utilise Azure DevOps Services et Microsoft Teams. L'application Azure Boards est installée dans un canal Teams nommé **Payments**. Le projet Azure DevOps **webshop** contient plus de 300 chemins de zone.

    Vous devez configurer le canal pour que l'équipe puisse créer des éléments de travail dans webshop depuis le canal et recevoir des notifications pour les éléments de travail du chemin de zone `webshop\Payments`. Ce chemin de zone n'apparaît pas dans la liste déroulante **Area path** de la boîte de dialogue d'abonnement.

    Quelles commandes devez-vous exécuter dans le canal, dans cet ordre ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: text
  template: |
    @azure boards [[first]]
    @azure boards [[second]] https://dev.azure.com/proseware/webshop/
    @azure boards [[third]] 'webshop\Payments'
  slots:
    - id: first
      options:
        - { id: signin, text: signin }
        - { id: help, text: help }
        - { id: feedback, text: feedback }
    - id: second
      options:
        - { id: subscribe, text: subscribe }
        - { id: link, text: link }
        - { id: subscriptions, text: subscriptions }
        - { id: addarea, text: addAreapath }
    - id: third
      options:
        - { id: link3, text: link }
        - { id: subscriptions3, text: subscriptions }
        - { id: addarea3, text: addAreapath }
        - { id: subscribe3, text: subscribe }
answer:
  values: { first: signin, second: link, third: addarea3 }
explanation:
  correct:
    en: "You first sign in to the Azure Boards organization with `@azure boards signin`. `@azure boards link <project url>` links the project to the channel, which lets members create work items and receive notifications; a channel can be linked to one project at a time. `@azure boards addAreapath` adds an area path that is missing from the Area path drop-down list, which happens in projects with more than 100 area paths; you can then select it in the subscription filters."
    fr: "Vous vous connectez d'abord à l'organisation Azure Boards avec `@azure boards signin`. `@azure boards link <url du projet>` lie le projet au canal, ce qui permet aux membres de créer des éléments de travail et de recevoir des notifications ; un canal ne peut être lié qu'à un projet à la fois. `@azure boards addAreapath` ajoute un chemin de zone absent de la liste déroulante Area path, ce qui arrive dans les projets de plus de 100 chemins de zone ; vous pouvez ensuite le sélectionner dans les filtres de l'abonnement."
  options:
    help: { en: "help lists the commands; it doesn't authenticate you.", fr: "help liste les commandes ; il ne vous authentifie pas." }
    feedback: { en: "feedback reports a problem or suggests a feature.", fr: "feedback signale un problème ou suggère une fonctionnalité." }
    subscribe: { en: "subscribe is a command of the Azure Repos app; the Azure Boards app links a project with link.", fr: "subscribe est une commande de l'application Azure Repos ; l'application Azure Boards lie un projet avec link." }
    subscriptions: { en: "subscriptions manages the notification subscriptions of a channel that is already linked to a project.", fr: "subscriptions gère les abonnements aux notifications d'un canal déjà lié à un projet." }
    subscriptions3: { en: "subscriptions opens the subscription dialog, where the missing area path still doesn't appear.", fr: "subscriptions ouvre la boîte de dialogue d'abonnement, où le chemin de zone manquant n'apparaît toujours pas." }
references:
  - title: Use Azure Boards in Microsoft Teams
    url: https://learn.microsoft.com/en-us/azure/devops/boards/integrations/boards-teams
