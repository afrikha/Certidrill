id: az400-1b-rel-release-yml
objective: "1.3.2"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Wingtip Toys publishes releases of a GitHub repository named **wingtip/storefront**. The maintainers want the notes that GitHub generates automatically for each release to meet the following requirements:

    - Pull requests labeled `ignore-for-release` and pull requests opened by the account `wingtip-bot` don't appear.
    - Pull requests labeled `breaking-change` appear under **Breaking Changes**, and pull requests labeled `enhancement` appear under **New Features**.
    - Every other pull request appears under **Other Changes**.

    You create the file `.github/release.yml`. How should you complete the file? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Wingtip Toys publie des versions d'un dépôt GitHub nommé **wingtip/storefront**. Les responsables souhaitent que les notes que GitHub génère automatiquement pour chaque version répondent aux exigences suivantes :

    - Les pull requests portant l'étiquette `ignore-for-release` et les pull requests ouvertes par le compte `wingtip-bot` n'apparaissent pas.
    - Les pull requests portant l'étiquette `breaking-change` apparaissent sous **Breaking Changes**, et celles portant l'étiquette `enhancement` sous **New Features**.
    - Toutes les autres pull requests apparaissent sous **Other Changes**.

    Vous créez le fichier `.github/release.yml`. Comment devez-vous compléter le fichier ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: yaml
  template: |
    [[root]]:
      [[skip]]:
        labels:
          - ignore-for-release
        authors:
          - wingtip-bot
      categories:
        - title: Breaking Changes
          labels:
            - breaking-change
        - title: New Features
          labels:
            - enhancement
        - title: Other Changes
          labels:
            - [[rest]]
  slots:
    - id: root
      options:
        - { id: release, text: release }
        - { id: notes, text: release-notes }
        - { id: changelog, text: changelog }
    - id: skip
      options:
        - { id: ignore, text: ignore }
        - { id: exclude, text: exclude }
        - { id: filter, text: filter }
    - id: rest
      options:
        - { id: star, text: "\"*\"" }
        - { id: all, text: all }
        - { id: default, text: default }
answer:
  values: { root: changelog, skip: exclude, rest: star }
explanation:
  correct:
    en: "The configuration of automatically generated release notes sits under the top-level `changelog` key of `.github/release.yml`. `exclude` lists the labels and authors whose pull requests are left out, `categories` groups the pull requests by label under a title, and the wildcard `\"*\"` catches the pull requests that no other category matched."
    fr: "La configuration des notes de publication générées automatiquement se trouve sous la clé de premier niveau `changelog` du fichier `.github/release.yml`. `exclude` liste les étiquettes et les auteurs dont les pull requests sont écartées, `categories` regroupe les pull requests par étiquette sous un titre, et le caractère générique `\"*\"` récupère les pull requests qu'aucune autre catégorie n'a retenues."
  options:
    release: { en: "release and release-notes aren't keys of the file; GitHub reads the changelog key.", fr: "release et release-notes ne sont pas des clés du fichier ; GitHub lit la clé changelog." }
    ignore: { en: "The key that leaves labels and authors out is exclude.", fr: "La clé qui écarte des étiquettes et des auteurs est exclude." }
    all: { en: "all and default would be read as label names; the catch-all value is the wildcard \"*\".", fr: "all et default seraient lus comme des noms d'étiquettes ; la valeur fourre-tout est le caractère générique \"*\"." }
references:
  - title: Automate release notes with GitHub
    url: https://learn.microsoft.com/en-us/training/modules/manage-git-repositories/9-automate-release-notes-github
