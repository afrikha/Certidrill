id: az400-1b-boards-fixes-multiple
objective: "1.3.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Contoso, Ltd. connected a GitHub repository to an Azure Boards project by using the Azure Boards app. The default branch of the repository is **main**. The work items 101, 102 and 103 are bugs in the Active state, and their workflow has a state in the Resolved category.

    A developer opens a pull request that targets main and fixes the three bugs. When the pull request is merged, the three bugs must be linked to it and must move to their resolved state.

    Which text should the developer put in the description of the pull request?
  fr: |
    Contoso, Ltd. a connecté un dépôt GitHub à un projet Azure Boards à l'aide de l'application Azure Boards. La branche par défaut du dépôt est **main**. Les éléments de travail 101, 102 et 103 sont des bogues à l'état Active, et leur workflow comporte un état de la catégorie Resolved.

    Un développeur ouvre une pull request qui cible main et corrige les trois bogues. Quand la pull request est fusionnée, les trois bogues doivent être liés à celle-ci et passer à leur état résolu.

    Quel texte le développeur doit-il placer dans la description de la pull request ?
body:
  options:
    - { id: a, text: "Fixes AB#101, AB#102, and AB#103" }
    - { id: b, text: "Fixes #101, Fixes #102, Fixes #103" }
    - { id: c, text: "AB#101 AB#102 AB#103 fixed" }
    - { id: d, text: "Fixes AB#101, Fixes AB#102, Fixes AB#103" }
answer: { optionId: d }
explanation:
  correct:
    en: "Azure Boards applies a keyword such as fix, fixes or fixed, or a state name, to the AB# reference that directly follows it. Repeating Fixes before each AB# reference links the three work items and moves each one to the first state of the Resolved category when the pull request merges into the default branch."
    fr: "Azure Boards applique un mot clé comme fix, fixes ou fixed, ou un nom d'état, à la référence AB# qui le suit directement. Répéter Fixes devant chaque référence AB# lie les trois éléments de travail et fait passer chacun d'eux au premier état de la catégorie Resolved quand la pull request est fusionnée dans la branche par défaut."
  options:
    a: { en: "All three work items are linked, but only AB#101 follows the keyword, so only 101 transitions.", fr: "Les trois éléments de travail sont liés, mais seul AB#101 suit le mot clé : seul 101 change d'état." }
    b: { en: "Without the AB prefix, #101 refers to a GitHub issue or pull request, not to an Azure Boards work item.", fr: "Sans le préfixe AB, #101 désigne un problème (issue) ou une pull request GitHub, pas un élément de travail Azure Boards." }
    c: { en: "The keyword applies to the reference that follows it; placed at the end, it doesn't transition any work item.", fr: "Le mot clé s'applique à la référence qui le suit ; placé à la fin, il ne fait changer d'état aucun élément de travail." }
references:
  - title: Link GitHub commits, pull requests, branches, and issues to work items in Azure Boards
    url: https://learn.microsoft.com/en-us/azure/devops/boards/github/link-to-from-github
