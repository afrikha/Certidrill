id: az400-1b-rel-api-docs-pages
objective: "1.3.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Proseware, Inc. documents the endpoints of its public REST API in Markdown files stored in a GitHub repository. The team uses MkDocs, a static site generator, to turn the Markdown files into an HTML site.

    You need to publish the API documentation site automatically each time the documentation or the code changes. The solution must not require any hosting service outside GitHub.

    What should you do?
  fr: |
    Proseware, Inc. documente les points de terminaison de son API REST publique dans des fichiers Markdown stockés dans un dépôt GitHub. L'équipe utilise MkDocs, un générateur de site statique, pour transformer les fichiers Markdown en site HTML.

    Vous devez publier automatiquement le site de documentation de l'API chaque fois que la documentation ou le code change. La solution ne doit nécessiter aucun service d'hébergement en dehors de GitHub.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Copy the Markdown files to the GitHub wiki of the repository after each merge.", fr: "Copier les fichiers Markdown dans le wiki GitHub du dépôt après chaque fusion." }
    - id: b
      text: { en: "Attach the generated HTML site to each GitHub release as a ZIP asset.", fr: "Joindre le site HTML généré à chaque version GitHub sous forme de ressource ZIP." }
    - id: c
      text: { en: "Publish the repository as a code wiki in an Azure DevOps project.", fr: "Publier le dépôt en tant que wiki de code dans un projet Azure DevOps." }
    - id: d
      text: { en: "Create a GitHub Actions workflow that builds the site and deploys it to GitHub Pages.", fr: "Créer un workflow GitHub Actions qui génère le site et le déploie sur GitHub Pages." }
answer: { optionId: d }
explanation:
  correct:
    en: A static site generator such as MkDocs turns the Markdown into HTML, and GitHub Pages hosts the site from the repository. A GitHub Actions workflow triggered by changes to the documentation or the code builds and deploys the site automatically, so the published documentation always matches the latest endpoints.
    fr: "Un générateur de site statique comme MkDocs transforme le Markdown en HTML, et GitHub Pages héberge le site à partir du dépôt. Un workflow GitHub Actions déclenché par les modifications de la documentation ou du code génère et déploie le site automatiquement : la documentation publiée correspond toujours aux derniers points de terminaison."
  options:
    a:
      en: Copying the files after each merge is a manual task, and the wiki doesn't use the site that MkDocs builds.
      fr: Copier les fichiers après chaque fusion est une tâche manuelle, et le wiki n'utilise pas le site généré par MkDocs.
    b:
      en: A release asset must be downloaded and opened; it doesn't publish a browsable site, and releases don't follow every documentation change.
      fr: Une ressource de version doit être téléchargée puis ouverte ; elle ne publie pas un site consultable, et les versions ne suivent pas chaque modification de la documentation.
    c:
      en: Azure DevOps is a service outside GitHub, and a code wiki publishes Git repositories of the Azure DevOps project, not the HTML site built by MkDocs.
      fr: Azure DevOps est un service extérieur à GitHub, et un wiki de code publie des dépôts Git du projet Azure DevOps, pas le site HTML généré par MkDocs.
references:
  - title: Create API documentation
    url: https://learn.microsoft.com/en-us/training/modules/manage-git-repositories/10-create-api-documentation
