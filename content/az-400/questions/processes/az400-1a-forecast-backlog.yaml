id: az400-1a-forecast-backlog
objective: "1.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    The Checkout team at Contoso uses the Agile process and estimates its user stories in story points. Future two-week sprints are defined and assigned to the team. The Velocity widget shows that the team completed an average of 30 story points over the last six sprints.

    The product owner needs to see which user stories of the product backlog the team is likely to complete in each of the upcoming sprints.

    What should you use?
  fr: |
    L'équipe Checkout de Contoso utilise le processus Agile et estime ses récits utilisateur en points d'histoire. Les futurs sprints de deux semaines sont définis et attribués à l'équipe. Le widget Velocity montre que l'équipe a terminé en moyenne 30 points d'histoire au cours des six derniers sprints.

    Le propriétaire de produit doit voir quels récits utilisateur du backlog de produit l'équipe est susceptible de terminer dans chacun des prochains sprints.

    Que devez-vous utiliser ?
body:
  options:
    - { id: a, text: { en: "The Forecasting view option of the Stories backlog, with a velocity of 30", fr: "L'option d'affichage Forecasting du backlog Stories, avec une vélocité de 30" } }
    - { id: b, text: { en: "The Sprint Burndown widget, configured on story points", fr: "Le widget Sprint Burndown, configuré sur les points d'histoire" } }
    - { id: c, text: { en: "The Capacity page of the next sprint, with 30 hours per day", fr: "La page Capacity du prochain sprint, avec 30 heures par jour" } }
    - { id: d, text: { en: "The Velocity widget, configured to show 15 iterations", fr: "Le widget Velocity, configuré pour afficher 15 itérations" } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      The forecast tool of the product backlog uses the velocity you enter and the story point estimates to draw lines that divide the backlog into upcoming sprints. Microsoft recommends entering the average velocity of the last three to six sprints.
    fr: |
      L'outil de prévision du backlog de produit utilise la vélocité saisie et les estimations en points d'histoire pour tracer des lignes qui répartissent le backlog dans les prochains sprints. Microsoft recommande de saisir la vélocité moyenne des trois à six derniers sprints.
  options:
    b: { en: "A sprint burndown tracks the remaining work of one sprint; it does not assign backlog items to future sprints.", fr: "Un burndown de sprint suit le travail restant d'un seul sprint ; il ne répartit pas les éléments du backlog dans les futurs sprints." }
    c: { en: "Capacity is set per team member in hours per day for task work; it does not forecast backlog items.", fr: "La capacité se définit par membre de l'équipe en heures par jour pour le travail sur les tâches ; elle ne prévoit pas les éléments du backlog." }
    d: { en: "The Velocity widget shows past sprints (up to 15); it does not project which stories fit in future sprints.", fr: "Le widget Velocity affiche les sprints passés (jusqu'à 15) ; il ne projette pas les récits qui tiennent dans les futurs sprints." }
references:
  - title: Forecast your product backlog
    url: https://learn.microsoft.com/en-us/azure/devops/boards/sprints/forecast
  - title: View and configure team velocity
    url: https://learn.microsoft.com/en-us/azure/devops/report/dashboards/team-velocity
