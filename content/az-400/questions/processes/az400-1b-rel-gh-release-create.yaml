id: az400-1b-rel-gh-release-create
objective: "1.3.2"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    Tailspin Toys publishes the releases of a GitHub repository from a GitHub Actions workflow that runs the GitHub CLI. The tag `v3.2.0` was pushed to the repository. Version v3.1.0 was published but was never used by customers.

    You need to create the release of v3.2.0. The solution must meet the following requirements:

    - GitHub generates the release notes automatically from the changes made since the tag `v3.0.0`.
    - The release is published immediately and is marked as a prerelease.
    - The command fails if the tag doesn't exist in the remote repository.

    How should you complete the command? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin Toys publie les versions d'un dépôt GitHub à partir d'un workflow GitHub Actions qui exécute GitHub CLI. La balise `v3.2.0` a été poussée dans le dépôt. La version v3.1.0 a été publiée mais n'a jamais été utilisée par les clients.

    Vous devez créer la version v3.2.0. La solution doit répondre aux exigences suivantes :

    - GitHub génère automatiquement les notes de publication à partir des modifications effectuées depuis la balise `v3.0.0`.
    - La version est publiée immédiatement et marquée comme préversion.
    - La commande échoue si la balise n'existe pas dans le dépôt distant.

    Comment devez-vous compléter la commande ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: bash
  template: |
    gh release create v3.2.0 [[notes]] [[start]] v3.0.0 [[kind]] --verify-tag
  slots:
    - id: notes
      options:
        - { id: fromtag, text: --notes-from-tag }
        - { id: generate, text: --generate-notes }
        - { id: file, text: --notes-file }
        - { id: nocommits, text: --fail-on-no-commits }
    - id: start
      options:
        - { id: target, text: --target }
        - { id: title, text: --title }
        - { id: starttag, text: --notes-start-tag }
    - id: kind
      options:
        - { id: draft, text: --draft }
        - { id: pre, text: --prerelease }
        - { id: latest, text: --latest=false }
answer:
  values: { notes: generate, start: starttag, kind: pre }
explanation:
  correct:
    en: "`--generate-notes` asks the GitHub Release Notes API to generate the notes, and `--notes-start-tag v3.0.0` sets the tag used as the starting point instead of the previous release v3.1.0. `--prerelease` publishes the release and marks it as a prerelease, and `--verify-tag` aborts when the tag isn't in the remote repository."
    fr: "`--generate-notes` demande à l'API Release Notes de GitHub de générer les notes, et `--notes-start-tag v3.0.0` définit la balise utilisée comme point de départ au lieu de la version précédente v3.1.0. `--prerelease` publie la version en la marquant comme préversion, et `--verify-tag` interrompt la commande si la balise n'est pas dans le dépôt distant."
  options:
    fromtag: { en: "--notes-from-tag uses the message of the tag as the notes; nothing is generated from the changes.", fr: "--notes-from-tag utilise le message de la balise comme notes ; rien n'est généré à partir des modifications." }
    file: { en: "--notes-file reads notes that already exist in a file.", fr: "--notes-file lit des notes qui existent déjà dans un fichier." }
    nocommits: { en: "--fail-on-no-commits only makes the command fail when there's no new commit; it doesn't generate notes.", fr: "--fail-on-no-commits fait seulement échouer la commande en l'absence de nouveau commit ; il ne génère pas de notes." }
    target: { en: "--target sets the branch or commit used when the tag must be created, not the start of the notes.", fr: "--target définit la branche ou le commit utilisé quand la balise doit être créée, pas le début des notes." }
    title: { en: "--title sets the title of the release.", fr: "--title définit le titre de la version." }
    draft: { en: "--draft saves the release as a draft instead of publishing it.", fr: "--draft enregistre la version comme brouillon au lieu de la publier." }
    latest: { en: "--latest=false only prevents the release from being marked as Latest; it isn't marked as a prerelease.", fr: "--latest=false empêche seulement la version d'être marquée Latest ; elle n'est pas marquée comme préversion." }
references:
  - title: Manage releases with GitHub repos
    url: https://learn.microsoft.com/en-us/training/modules/manage-git-repositories/8-manage-releases-github-repos
  - title: Automate release notes with GitHub
    url: https://learn.microsoft.com/en-us/training/modules/manage-git-repositories/9-automate-release-notes-github
