id: az400-1b-git-shallow-history
objective: "1.3.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Contoso, Ltd. created a new YAML pipeline in Azure Pipelines in 2026. The pipeline generates release notes with the following steps.

    ```yaml
    steps:
    - checkout: self
    - script: git log v4.1.0..HEAD --no-merges --pretty=format:"- %s" > notes.md
    ```

    In the settings of the pipeline, Shallow fetch is enabled with a depth of 1. The script fails with the error `unknown revision or path not in the working tree`.

    You need the script to list all the commits made since the tag `v4.1.0`.

    What should you do?
  fr: |
    Contoso, Ltd. a créé un nouveau pipeline YAML dans Azure Pipelines en 2026. Le pipeline génère des notes de publication avec les étapes suivantes.

    ```yaml
    steps:
    - checkout: self
    - script: git log v4.1.0..HEAD --no-merges --pretty=format:"- %s" > notes.md
    ```

    Dans les paramètres du pipeline, Shallow fetch est activé avec une profondeur de 1. Le script échoue avec l'erreur `unknown revision or path not in the working tree`.

    Le script doit lister tous les commits effectués depuis la balise `v4.1.0`.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Add `fetchTags: true` to the checkout step.", fr: "Ajouter `fetchTags: true` à l'étape checkout." }
    - id: b
      text: { en: "Add `clean: true` to the checkout step.", fr: "Ajouter `clean: true` à l'étape checkout." }
    - id: c
      text: { en: "Add `persistCredentials: true` to the checkout step.", fr: "Ajouter `persistCredentials: true` à l'étape checkout." }
    - id: d
      text: { en: "Add `fetchDepth: 0` and `fetchTags: true` to the checkout step.", fr: "Ajouter `fetchDepth: 0` et `fetchTags: true` à l'étape checkout." }
answer: { optionId: d }
explanation:
  correct:
    en: "With Shallow fetch at a depth of 1, the clone contains only the last commit, and pipelines created after the September 2022 sprint 209 update don't sync tags by default, so the clone has neither the tag nor the history before HEAD. `fetchDepth: 0` fetches the whole history and overrides the Shallow fetch setting, and `fetchTags: true` syncs the tags, so `v4.1.0..HEAD` resolves to the complete list of commits."
    fr: "Avec Shallow fetch à une profondeur de 1, le clone ne contient que le dernier commit, et les pipelines créés après la mise à jour du sprint 209 de septembre 2022 ne synchronisent pas les balises par défaut : le clone ne contient ni la balise ni l'historique antérieur à HEAD. `fetchDepth: 0` récupère tout l'historique et remplace le paramètre Shallow fetch, et `fetchTags: true` synchronise les balises : `v4.1.0..HEAD` correspond alors à la liste complète des commits."
  options:
    a:
      en: "With a depth of 1, the history between the tag and HEAD is still missing, so the list of commits would be incomplete."
      fr: "Avec une profondeur de 1, l'historique entre la balise et HEAD manque toujours : la liste des commits serait incomplète."
    b:
      en: "`clean: true` cleans the working folder before the fetch; the fetch is still shallow and without tags."
      fr: "`clean: true` nettoie le dossier de travail avant la récupération ; celle-ci reste superficielle et sans balises."
    c:
      en: "`persistCredentials: true` keeps the OAuth token for later Git commands; it doesn't fetch history or tags."
      fr: "`persistCredentials: true` conserve le jeton OAuth pour les commandes Git suivantes ; il ne récupère ni l'historique ni les balises."
references:
  - title: steps.checkout definition
    url: https://learn.microsoft.com/en-us/azure/devops/pipelines/yaml-schema/steps-checkout
