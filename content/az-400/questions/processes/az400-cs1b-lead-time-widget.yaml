id: az400-cs1b-lead-time-widget
objective: "1.2.1"
type: single
caseStudy: az400-cs1b-humongous-insurance
difficulty: 1
status: draft
stem:
  en: |
    You are adding a widget to a dashboard of the Claims project for the claims manager.

    You need to meet the planning requirement for the dashboard. Which widget should you add?
  fr: |
    Vous ajoutez un widget à un tableau de bord du projet Claims pour le responsable des sinistres.

    Vous devez satisfaire l'exigence de planification concernant le tableau de bord. Quel widget devez-vous ajouter ?
body:
  options:
    - { id: a, text: Cycle Time }
    - { id: b, text: Velocity }
    - { id: c, text: Cumulative Flow Diagram }
    - { id: d, text: Lead Time }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Lead time is the elapsed time from the creation of a work item until it reaches a Completed state, which is what the claims manager asks for. The Lead Time widget shows it for the selected work item types, such as user stories.
    fr: |
      Le délai d'exécution (lead time) est le temps écoulé entre la création d'un élément de travail et son arrivée dans un état Completed, ce que demande le responsable des sinistres. Le widget Lead Time l'affiche pour les types d'éléments de travail sélectionnés, comme les récits utilisateur.
  options:
    a: { en: "Cycle time starts when the work item first enters an In Progress state, not when it is created.", fr: "La durée de cycle (cycle time) commence quand l'élément de travail entre pour la première fois dans un état In Progress, pas à sa création." }
    b: { en: "Velocity shows the amount of work completed per sprint, not the time each item takes.", fr: "Velocity affiche la quantité de travail terminée par sprint, pas le temps que prend chaque élément." }
    c: { en: "The cumulative flow diagram shows the count of items in each state over time, not an average duration per item.", fr: "Le diagramme de flux cumulé affiche le nombre d'éléments dans chaque état au fil du temps, pas une durée moyenne par élément." }
references:
  - title: Configure lead time and cycle time widgets
    url: https://learn.microsoft.com/en-us/azure/devops/report/dashboards/cycle-time-and-lead-time
