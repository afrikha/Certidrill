id: az400-1a-secoverview-tabs
objective: "1.2.5"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Fabrikam has an Azure DevOps organization with 40 Azure Repos repositories. GitHub Advanced Security for Azure DevOps is enabled on some of them. The security manager uses **Organization settings > Security overview** to build a monthly security report.

    Which tab should the security manager use for each part of the report? To answer, drag the appropriate tabs to the correct report sections. Each tab may be used once, more than once, or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam dispose d'une organisation Azure DevOps avec 40 dépôts Azure Repos. GitHub Advanced Security for Azure DevOps est activé sur certains d'entre eux. Le responsable de la sécurité utilise **Paramètres de l'organisation > Security overview** pour établir un rapport de sécurité mensuel.

    Quel onglet le responsable de la sécurité doit-il utiliser pour chaque partie du rapport ? Pour répondre, faites glisser les onglets appropriés vers les sections du rapport correspondantes. Chaque onglet peut être utilisé une fois, plusieurs fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: true
  items:
    - { id: risk, text: Risk }
    - { id: coverage, text: Coverage }
    - { id: alerts, text: Alerts }
  targets:
    - { id: t1, text: { en: "Repositories on which secret scanning or code scanning is not enabled", fr: "Dépôts sur lesquels l'analyse des secrets ou l'analyse du code n'est pas activée" } }
    - { id: t2, text: { en: "Number of open, new, dismissed and fixed alerts per repository during the month", fr: "Nombre d'alertes ouvertes, nouvelles, ignorées et corrigées par dépôt au cours du mois" } }
    - { id: t3, text: { en: "List of the individual critical alerts introduced during the month, across all repositories", fr: "Liste des alertes critiques individuelles apparues au cours du mois, sur l'ensemble des dépôts" } }
answer:
  mapping: { t1: coverage, t2: risk, t3: alerts }
explanation:
  correct:
    en: |
      The Coverage tab shows the enablement status of dependency, code and secret scanning for every repository. The Risk tab shows the distribution of alerts by severity with Open, New, Dismissed and Fixed columns for a selected period. The Alerts tab lists individual alerts across repositories, with filters such as severity and the time the alert was introduced.
    fr: |
      L'onglet Coverage affiche l'état d'activation de l'analyse des dépendances, du code et des secrets pour chaque dépôt. L'onglet Risk affiche la répartition des alertes par gravité avec les colonnes Open, New, Dismissed et Fixed pour une période sélectionnée. L'onglet Alerts liste les alertes individuelles de tous les dépôts, avec des filtres comme la gravité et la date d'apparition de l'alerte.
references:
  - title: Security overview
    url: https://learn.microsoft.com/en-us/azure/devops/repos/security/github-advanced-security-security-overview
