id: az400-1a-cycle-time-widget
objective: "1.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    The Payments team at Woodgrove Bank uses Azure Boards. Product backlog items often wait several weeks in the New state before a developer starts them.

    The team lead wants a dashboard widget that measures only how long the team takes to finish a product backlog item once developers start working on it, shows a moving average, and highlights the items that fall outside the typical variation.

    Which widget should you add to the team dashboard?
  fr: |
    L'équipe Payments de Woodgrove Bank utilise Azure Boards. Les éléments du backlog de produit attendent souvent plusieurs semaines à l'état New avant qu'un développeur ne les commence.

    Le responsable d'équipe veut un widget de tableau de bord qui mesure uniquement le temps que met l'équipe à terminer un élément du backlog de produit une fois que les développeurs ont commencé à y travailler, qui affiche une moyenne mobile et qui met en évidence les éléments situés en dehors de la variation habituelle.

    Quel widget devez-vous ajouter au tableau de bord de l'équipe ?
body:
  options:
    - { id: a, text: Lead Time }
    - { id: b, text: Cycle Time }
    - { id: c, text: Velocity }
    - { id: d, text: Cumulative Flow Diagram }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Cycle time runs from the first time a work item enters an In Progress state until it reaches a Completed state, so the weeks spent in New are excluded. The Cycle Time widget is a control chart that shows each completed item, a moving average trend line and a standard deviation band that reveals outliers.
    fr: |
      La durée de cycle court de la première entrée d'un élément de travail dans un état In Progress jusqu'à son arrivée dans un état Completed : les semaines passées à l'état New sont donc exclues. Le widget Cycle Time est un graphique de contrôle qui affiche chaque élément terminé, une courbe de tendance en moyenne mobile et une bande d'écart type qui révèle les valeurs aberrantes.
  options:
    a: { en: "Lead time starts when the work item is created, so it includes the waiting time in the New state.", fr: "Le délai de livraison commence à la création de l'élément de travail : il inclut donc l'attente à l'état New." }
    c: { en: "Velocity shows the work completed per sprint, not the duration of individual items.", fr: "La vélocité affiche le travail terminé par sprint, pas la durée de chaque élément." }
    d: { en: "A cumulative flow diagram shows item counts per state over time; it does not plot the duration of each item with a moving average.", fr: "Un diagramme de flux cumulé affiche le nombre d'éléments par état dans le temps ; il ne trace pas la durée de chaque élément avec une moyenne mobile." }
references:
  - title: Configure lead time and cycle time widgets
    url: https://learn.microsoft.com/en-us/azure/devops/report/dashboards/cycle-time-and-lead-time
