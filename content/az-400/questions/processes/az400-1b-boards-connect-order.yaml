id: az400-1b-boards-connect-order
objective: "1.3.5"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    Adatum Corporation plans its work in an Azure Boards project named **Retail** and stores its code in the GitHub organization **adatum**. You are a member of the Project Collection Administrators group of the Azure DevOps organization and an owner of the adatum GitHub organization. The adatum organization has no third-party application restrictions.

    You need to connect all the repositories of adatum to Retail by using the Azure Boards app, then confirm that commits are linked to work items.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Adatum Corporation planifie son travail dans un projet Azure Boards nommé **Retail** et stocke son code dans l'organisation GitHub **adatum**. Vous êtes membre du groupe Project Collection Administrators de l'organisation Azure DevOps et propriétaire de l'organisation GitHub adatum. L'organisation adatum n'a aucune restriction sur les applications tierces.

    Vous devez connecter tous les dépôts d'adatum à Retail à l'aide de l'application Azure Boards, puis vérifier que les commits sont liés aux éléments de travail.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: market, text: { en: "Open the Azure Boards app in GitHub Marketplace and select Install for the Free plan.", fr: "Ouvrir l'application Azure Boards dans GitHub Marketplace et sélectionner Install pour le plan Free." } }
    - { id: repos, text: { en: "Select All repositories, then select Install & Authorize.", fr: "Sélectionner All repositories, puis Install & Authorize." } }
    - { id: project, text: { en: "Select the Azure DevOps organization and the Retail project.", fr: "Sélectionner l'organisation Azure DevOps et le projet Retail." } }
    - { id: commit, text: { en: "Push a commit whose message contains AB# followed by a work item ID, then check the Development section of the work item.", fr: "Pousser un commit dont le message contient AB# suivi d'un ID d'élément de travail, puis vérifier la section Development de l'élément de travail." } }
    - { id: svcconn, text: { en: "Create a GitHub service connection in Project settings > Service connections.", fr: "Créer une connexion de service GitHub dans Project settings > Service connections." } }
    - { id: pipelinesapp, text: { en: "Install the Azure Pipelines app from GitHub Marketplace.", fr: "Installer l'application Azure Pipelines depuis GitHub Marketplace." } }
answer:
  sequence: [ market, repos, project, commit ]
explanation:
  correct:
    en: "You install the Azure Boards app from GitHub Marketplace, choose the repositories (here All repositories) and select Install & Authorize, then choose the Azure DevOps organization and the project to connect. Once connected, an AB# mention in a pushed commit message creates a link in the Development section of the work item."
    fr: "Vous installez l'application Azure Boards depuis GitHub Marketplace, choisissez les dépôts (ici All repositories) et sélectionnez Install & Authorize, puis choisissez l'organisation Azure DevOps et le projet à connecter. Une fois la connexion établie, une mention AB# dans le message d'un commit poussé crée un lien dans la section Development de l'élément de travail."
  options:
    svcconn: { en: "A GitHub service connection lets pipelines access GitHub; it doesn't connect repositories to Azure Boards.", fr: "Une connexion de service GitHub permet aux pipelines d'accéder à GitHub ; elle ne connecte pas les dépôts à Azure Boards." }
    pipelinesapp: { en: "The Azure Pipelines app builds GitHub repositories; the Boards integration uses the Azure Boards app.", fr: "L'application Azure Pipelines génère les dépôts GitHub ; l'intégration à Boards utilise l'application Azure Boards." }
references:
  - title: Install the Azure Boards app for GitHub
    url: https://learn.microsoft.com/en-us/azure/devops/boards/github/install-github-app
