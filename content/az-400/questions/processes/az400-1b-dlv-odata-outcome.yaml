id: az400-1b-dlv-odata-outcome
objective: "1.2.6"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    Contoso, Ltd. uses an Azure DevOps organization named **contoso** that contains a project named **webshop**. The project contains a YAML pipeline named **web-ci**.

    The delivery manager wants a Power BI report that shows, for the runs of web-ci that finished on or after September 1, 2026, the total number of runs, the number of succeeded runs and the number of failed runs. The report must read the Analytics OData feed.

    How should you complete the OData query? To answer, select the appropriate options in the answer area. (Line breaks were added for readability.)

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso, Ltd. utilise une organisation Azure DevOps nommée **contoso** qui contient un projet nommé **webshop**. Le projet contient un pipeline YAML nommé **web-ci**.

    Le responsable de la livraison souhaite un rapport Power BI qui indique, pour les exécutions de web-ci terminées le 1er septembre 2026 ou après, le nombre total d'exécutions, le nombre d'exécutions réussies et le nombre d'exécutions en échec. Le rapport doit lire le flux OData d'Analytics.

    Comment devez-vous compléter la requête OData ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse. (Des sauts de ligne ont été ajoutés pour la lisibilité.)

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: text
  template: |
    https://analytics.dev.azure.com/contoso/webshop/_odata/v3.0-preview/[[entity]]?
      $apply=filter(Pipeline/PipelineName eq 'web-ci'
        and [[date]] ge 2026-09-01Z)
      /aggregate($count as TotalCount,
        SucceededCount with sum as SucceededCount,
        [[failed]])
  slots:
    - id: entity
      options:
        - { id: runs, text: PipelineRuns }
        - { id: pipelines, text: Pipelines }
        - { id: tasks, text: PipelineRunActivityResults }
        - { id: tests, text: TestRuns }
    - id: date
      options:
        - { id: created, text: CreatedDate }
        - { id: completed, text: CompletedDate }
        - { id: closed, text: ClosedDate }
        - { id: changed, text: ChangedDate }
    - id: failed
      options:
        - { id: count, text: "$count as FailedCount" }
        - { id: max, text: "FailedCount with max as FailedCount" }
        - { id: sum, text: "FailedCount with sum as FailedCount" }
        - { id: distinct, text: "FailedCount with countdistinct as FailedCount" }
answer:
  values: { entity: runs, date: completed, failed: sum }
explanation:
  correct:
    en: "Each row of the `PipelineRuns` entity set is one run of a pipeline, with outcome counters such as `SucceededCount` and `FailedCount` that equal 1 or 0. Filtering on `CompletedDate ge 2026-09-01Z` keeps the runs that finished on or after the start date, and `FailedCount with sum` adds up the failed runs, exactly like the `SucceededCount` line."
    fr: "Chaque ligne du jeu d'entités `PipelineRuns` correspond à une exécution d'un pipeline, avec des compteurs de résultat comme `SucceededCount` et `FailedCount` qui valent 1 ou 0. Le filtre `CompletedDate ge 2026-09-01Z` conserve les exécutions terminées à partir de la date de début, et `FailedCount with sum` additionne les exécutions en échec, comme la ligne `SucceededCount`."
  options:
    pipelines: { en: "Pipelines describes the pipeline definitions, one row per pipeline, not their runs.", fr: "Pipelines décrit les définitions de pipeline, une ligne par pipeline, pas leurs exécutions." }
    tasks: { en: "PipelineRunActivityResults holds the results of the tasks inside the runs, so counting its rows does not count runs.", fr: "PipelineRunActivityResults contient les résultats des tâches au sein des exécutions : compter ses lignes ne compte pas les exécutions." }
    tests: { en: "TestRuns describes test runs, not pipeline runs.", fr: "TestRuns décrit des exécutions de tests, pas des exécutions de pipeline." }
    created: { en: "CreatedDate, ClosedDate and ChangedDate are date fields of work items; a pipeline run is filtered on its completion date.", fr: "CreatedDate, ClosedDate et ChangedDate sont des champs de date des éléments de travail ; une exécution de pipeline se filtre sur sa date de fin." }
    count: { en: "$count counts every filtered run, so it returns the total, not the failed runs.", fr: "$count compte toutes les exécutions filtrées : il renvoie le total, pas les exécutions en échec." }
    max: { en: "The maximum of a 0/1 counter returns 1 as soon as one run failed, not the number of failures.", fr: "Le maximum d'un compteur 0/1 renvoie 1 dès qu'une exécution a échoué, pas le nombre d'échecs." }
    distinct: { en: "countdistinct counts the distinct values of the counter (at most two), not the failed runs.", fr: "countdistinct compte les valeurs distinctes du compteur (deux au plus), pas les exécutions en échec." }
references:
  - title: Pipeline outcome summary sample report
    url: https://learn.microsoft.com/en-us/azure/devops/report/powerbi/sample-pipelines-outcome-summary
