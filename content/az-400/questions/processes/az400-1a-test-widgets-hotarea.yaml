id: az400-1a-test-widgets-hotarea
objective: "1.2.4"
type: hotarea
difficulty: 2
status: draft
stem:
  en: |
    Contoso builds three microservices, each with its own build pipeline in Azure Pipelines that runs automated tests. User stories are linked to test cases in Azure Test Plans. The QA manager is designing a test dashboard and reviews the widget catalog shown in the following table.

    Answer each prompt by selecting the widget to add.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso développe trois microservices, chacun avec son propre pipeline de build dans Azure Pipelines qui exécute des tests automatisés. Les récits utilisateur sont liés à des cas de test dans Azure Test Plans. Le responsable QA conçoit un tableau de bord de test et examine le catalogue de widgets présenté dans le tableau suivant.

    Répondez à chaque consigne en sélectionnant le widget à ajouter.

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
    - id: p1
      text: { en: "Show one trend of the test pass rate and test duration for the three pipelines together, filtered by test owner", fr: "Afficher une seule tendance du taux de réussite et de la durée des tests pour les trois pipelines ensemble, filtrée par propriétaire de test" }
    - id: p2
      text: { en: "Show the user stories whose linked tests are failing or that have no test results", fr: "Afficher les récits utilisateur dont les tests liés échouent ou qui n'ont aucun résultat de test" }
  grid:
    header: [{ en: "Widget", fr: "Widget" }]
    rows:
      - [{ text: Test Results Trend, area: trend }]
      - [{ text: Test Results Trend (Advanced), area: adv }]
      - [{ text: Chart for Test Plans, area: plans }]
      - [{ text: Requirements quality, area: req }]
      - [{ text: Deployment status, area: deploy }]
      - [{ text: Build History, area: history }]
answer:
  values: { p1: adv, p2: req }
explanation:
  correct:
    en: |
      Test Results Trend (Advanced) is based on Analytics and can combine one or more build or release pipelines, with filters such as branch, test file, owner and test run, to show pass rate, failures and duration over time. The Requirements quality widget maps requirements to the latest results of their tests, which reveals failing and untested requirements.
    fr: |
      Test Results Trend (Advanced) s'appuie sur Analytics et peut combiner un ou plusieurs pipelines de build ou de mise en production, avec des filtres comme la branche, le fichier de test, le propriétaire et l'exécution de test, pour afficher le taux de réussite, les échecs et la durée dans le temps. Le widget Requirements quality associe les exigences aux derniers résultats de leurs tests, ce qui révèle les exigences en échec et non testées.
  options:
    trend: { en: "Test Results Trend shows the trend of a single selected build or release pipeline.", fr: "Test Results Trend affiche la tendance d'un seul pipeline de build ou de mise en production sélectionné." }
    plans: { en: "Chart for Test Plans tracks a test plan or suite, not pipeline trends or requirement coverage.", fr: "Chart for Test Plans suit un plan ou une suite de tests, pas les tendances de pipeline ni la couverture des exigences." }
    deploy: { en: "Deployment status shows deployments and pass rates per environment for recent builds.", fr: "Deployment status affiche les déploiements et les taux de réussite par environnement pour les builds récentes." }
references:
  - title: Out Of Box widget catalog
    url: https://learn.microsoft.com/en-us/azure/devops/report/dashboards/widget-catalog
  - title: Configure the Test Results Trend (Advanced) widget
    url: https://learn.microsoft.com/en-us/azure/devops/report/dashboards/configure-test-results-trend
