id: az400-1a-burndown-prereqs
objective: "1.2.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    The Claims team at Fabrikam starts using Azure Boards and wants a Sprint Burndown widget on its dashboard that burns down on the sum of **Remaining Work**. Azure Boards and Analytics are enabled. The team does not plan to display capacity lines.

    Which two actions must the team perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    L'équipe Claims de Fabrikam commence à utiliser Azure Boards et souhaite un widget Sprint Burndown sur son tableau de bord, basé sur la somme de **Remaining Work**. Azure Boards et Analytics sont activés. L'équipe ne prévoit pas d'afficher les lignes de capacité.

    Quelles sont les deux actions que l'équipe doit effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Schedule the team's sprints and assign the backlog items to a sprint.", fr: "Planifier les sprints de l'équipe et attribuer les éléments du backlog à un sprint." } }
    - { id: b, text: { en: "Define tasks for each backlog item and update their Remaining Work as work progresses.", fr: "Définir des tâches pour chaque élément du backlog et mettre à jour leur Remaining Work au fil du travail." } }
    - { id: c, text: { en: "Set the capacity of each team member for every sprint.", fr: "Définir la capacité de chaque membre de l'équipe pour chaque sprint." } }
    - { id: d, text: { en: "Turn on Forecasting on the product backlog and enter the team's velocity.", fr: "Activer Forecasting sur le backlog de produit et saisir la vélocité de l'équipe." } }
    - { id: e, text: { en: "Set WIP limits on the columns of the team's board.", fr: "Définir des limites de travail en cours (WIP) sur les colonnes du tableau de l'équipe." } }
answer: { optionIds: [ a, b ] }
explanation:
  correct:
    en: |
      A sprint burndown needs scheduled sprints with work assigned to them. To burn down on Remaining Work, the team must define and estimate tasks for each backlog item and keep their Remaining Work up to date; infrequent updates produce a staircase pattern.
    fr: |
      Un burndown de sprint nécessite des sprints planifiés auxquels du travail est attribué. Pour un burndown sur Remaining Work, l'équipe doit définir et estimer des tâches pour chaque élément du backlog et tenir leur Remaining Work à jour ; des mises à jour peu fréquentes produisent une courbe en escalier.
  options:
    c: { en: "Capacity is only needed to display capacity lines, which the team does not plan to use.", fr: "La capacité n'est nécessaire que pour afficher les lignes de capacité, que l'équipe ne prévoit pas d'utiliser." }
    d: { en: "Forecasting projects backlog items into future sprints; the burndown does not use it.", fr: "La prévision projette les éléments du backlog dans les futurs sprints ; le burndown ne l'utilise pas." }
    e: { en: "WIP limits highlight overloaded board columns; they have no effect on the burndown.", fr: "Les limites de travail en cours mettent en évidence les colonnes surchargées du tableau ; elles n'ont aucun effet sur le burndown." }
references:
  - title: Configure and monitor sprint burndown
    url: https://learn.microsoft.com/en-us/azure/devops/report/dashboards/configure-sprint-burndown
