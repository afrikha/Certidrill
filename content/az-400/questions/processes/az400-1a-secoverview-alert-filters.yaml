id: az400-1a-secoverview-alert-filters
objective: "1.2.5"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    Contoso uses GitHub Secret Protection for Azure DevOps and GitHub Code Security for Azure DevOps on all its repositories. The security team prepares a remediation campaign from **Organization settings > Security overview > Alerts**.

    You need to meet the following requirements:

    - Show only the exposed secrets that can still be used.
    - Show only the dependency alerts of npm packages.
    - Let the platform teams open exactly the same filtered list of alerts.

    How should you complete the configuration? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso utilise GitHub Secret Protection for Azure DevOps et GitHub Code Security for Azure DevOps sur tous ses dépôts. L'équipe de sécurité prépare une campagne de correction depuis **Paramètres de l'organisation > Security overview > Alerts**.

    Vous devez satisfaire les exigences suivantes :

    - Afficher uniquement les secrets exposés qui sont encore utilisables.
    - Afficher uniquement les alertes de dépendances des packages npm.
    - Permettre aux équipes plateforme d'ouvrir exactement la même liste filtrée d'alertes.

    Comment devez-vous compléter la configuration ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Secrets that can still be used: tool Secrets, plus the [[secret]] filter
      npm dependency alerts: tool Dependencies, plus the [[dep]] filter
      Same list for the platform teams: [[share]]
    fr: |
      Secrets encore utilisables : outil Secrets, plus le filtre [[secret]]
      Alertes de dépendances npm : outil Dependencies, plus le filtre [[dep]]
      Même liste pour les équipes plateforme : [[share]]
  slots:
    - id: secret
      options:
        - { id: validity, text: { en: "validity", fr: "validity (validité)" } }
        - { id: severity, text: { en: "severity", fr: "severity (gravité)" } }
        - { id: state, text: { en: "state", fr: "state (état)" } }
        - { id: rule, text: { en: "rule", fr: "rule (règle)" } }
    - id: dep
      options:
        - { id: eco, text: { en: "ecosystem", fr: "ecosystem (écosystème)" } }
        - { id: rule, text: { en: "rule", fr: "rule (règle)" } }
        - { id: repo, text: { en: "repository", fr: "repository (dépôt)" } }
        - { id: type, text: { en: "secret type", fr: "secret type (type de secret)" } }
    - id: share
      options:
        - { id: url, text: { en: "Share the URL of the filtered page", fr: "Partager l'URL de la page filtrée" } }
        - { id: csv, text: { en: "Export the alerts to CSV every week", fr: "Exporter les alertes au format CSV chaque semaine" } }
        - { id: widget, text: { en: "Pin the Alerts tab to a project dashboard", fr: "Épingler l'onglet Alerts à un tableau de bord de projet" } }
answer:
  values: { secret: validity, dep: eco, share: url }
explanation:
  correct:
    en: |
      The Alerts tab of the security overview lists the alerts of all repositories and adds tool-specific filters, such as validity and secret type for secrets, package and ecosystem for dependencies, and tool and rule for code. Filtered views are stored in the page URL, so sharing the URL gives other teams the same view for a security campaign.
    fr: |
      L'onglet Alerts du Security overview liste les alertes de tous les dépôts et ajoute des filtres propres à chaque outil, comme validity et secret type pour les secrets, package et ecosystem pour les dépendances, et tool et rule pour le code. Les vues filtrées sont stockées dans l'URL de la page : partager l'URL donne aux autres équipes la même vue pour une campagne de sécurité.
  options:
    severity: { en: "Severity ranks alerts but does not tell whether a secret is still valid.", fr: "La gravité classe les alertes mais n'indique pas si un secret est encore valide." }
    state: { en: "State is open, dismissed or fixed; an open secret alert can concern a revoked secret.", fr: "L'état est open, dismissed ou fixed ; une alerte de secret ouverte peut concerner un secret révoqué." }
    rule: { en: "The rule filter applies to code scanning alerts.", fr: "Le filtre rule s'applique aux alertes d'analyse du code." }
    csv: { en: "A CSV export is a static copy limited to the first 1,000 alerts, not a live shared view.", fr: "Un export CSV est une copie statique limitée aux 1 000 premières alertes, pas une vue partagée dynamique." }
references:
  - title: Security overview
    url: https://learn.microsoft.com/en-us/azure/devops/repos/security/github-advanced-security-security-overview
