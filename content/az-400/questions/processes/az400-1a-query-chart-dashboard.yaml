id: az400-1a-query-chart-dashboard
objective: "1.2.2"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    The Logistics team at Northwind Traders wants a pie chart on its team dashboard that shows the open bugs of the current sprint grouped by **Assigned To**. You are a member of the team and have Basic access.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    L'équipe Logistics de Northwind Traders souhaite un graphique en secteurs sur son tableau de bord d'équipe qui affiche les bogues ouverts du sprint actuel regroupés par **Assigned To**. Vous êtes membre de l'équipe et disposez de l'accès Basic.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: flat, text: { en: "Create a Flat list of work items query that returns the open bugs of @CurrentIteration.", fr: "Créer une requête de type Flat list of work items qui renvoie les bogues ouverts de @CurrentIteration." } }
    - { id: shared, text: { en: "Save the query in the Shared Queries folder.", fr: "Enregistrer la requête dans le dossier Shared Queries." } }
    - { id: chart, text: { en: "On the Charts tab of the query, create a pie chart grouped by Assigned To.", fr: "Dans l'onglet Charts de la requête, créer un graphique en secteurs regroupé par Assigned To." } }
    - { id: add, text: { en: "Select Add to dashboard for the chart and choose the team dashboard.", fr: "Sélectionner Add to dashboard pour le graphique et choisir le tableau de bord de l'équipe." } }
    - { id: tree, text: { en: "Create a Tree of work items query that returns the open bugs of @CurrentIteration.", fr: "Créer une requête de type Tree of work items qui renvoie les bogues ouverts de @CurrentIteration." } }
    - { id: mine, text: { en: "Save the query in the My Queries folder.", fr: "Enregistrer la requête dans le dossier My Queries." } }
answer:
  sequence: [ flat, shared, chart, add ]
explanation:
  correct:
    en: |
      Only flat-list queries support charts. Charts of queries saved in My Queries are visible only to you, and only queries saved in a Shared Queries folder offer Add to dashboard. You then create the chart on the Charts tab and add it to the dashboard; as a team member you can add it to the team dashboard.
    fr: |
      Seules les requêtes de type liste plate prennent en charge les graphiques. Les graphiques des requêtes enregistrées dans My Queries ne sont visibles que par vous, et seules les requêtes enregistrées dans un dossier Shared Queries proposent Add to dashboard. Vous créez ensuite le graphique dans l'onglet Charts et l'ajoutez au tableau de bord ; en tant que membre de l'équipe, vous pouvez l'ajouter au tableau de bord de l'équipe.
  options:
    tree: { en: "Tree queries are not supported for charting.", fr: "Les requêtes d'arborescence ne sont pas prises en charge pour les graphiques." }
    mine: { en: "A query in My Queries has no Add to dashboard option.", fr: "Une requête de My Queries n'offre pas l'option Add to dashboard." }
references:
  - title: Track progress with status and trend query-based charts
    url: https://learn.microsoft.com/en-us/azure/devops/report/dashboards/charts
