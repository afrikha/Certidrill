id: az400-1a-flaky-statements
objective: "1.2.4"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    Woodgrove Bank uses Azure DevOps Services. Flaky test management is turned on for the project **Lending** with system detection. Several YAML pipelines of the project run the same test suite on the `main` branch.

    Which two statements are true?

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove Bank utilise Azure DevOps Services. La gestion des tests non fiables (flaky) est activée pour le projet **Lending** avec la détection système. Plusieurs pipelines YAML du projet exécutent la même suite de tests sur la branche `main`.

    Quelles sont les deux affirmations vraies ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "A test flagged as flaky in one pipeline on main is shown as flaky in the other pipelines that run on main.", fr: "Un test signalé comme non fiable dans un pipeline sur main apparaît comme non fiable dans les autres pipelines exécutés sur main." } }
    - { id: b, text: { en: "Marking a failed test as Flaky in a run changes the outcome of that same run.", fr: "Marquer un test en échec comme Flaky dans une exécution modifie le résultat de cette même exécution." } }
    - { id: c, text: { en: "Switching the project from system detection to custom detection erases the stored flakiness history.", fr: "Faire passer le projet de la détection système à la détection personnalisée efface l'historique enregistré des tests non fiables." } }
    - { id: d, text: { en: "System detection only flags tests that are rerun by the Visual Studio Test task.", fr: "La détection système ne signale que les tests réexécutés par la tâche Visual Studio Test." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |
      Flakiness data is shared across all the pipelines of the same branch, so a test flagged on main is visible as flaky everywhere on main. Changing the detection system erases all the stored flakiness history.
    fr: |
      Les données de non-fiabilité sont partagées entre tous les pipelines d'une même branche : un test signalé sur main apparaît donc comme non fiable partout sur main. Changer de système de détection efface tout l'historique enregistré des tests non fiables.
  options:
    b: { en: "A manual Flaky or UnFlaky change is only evaluated on future executions of the test; the current run is not affected.", fr: "Un changement manuel Flaky ou UnFlaky n'est évalué que lors des exécutions futures du test ; l'exécution en cours n'est pas affectée." }
    d: { en: "System detection also flags tests that pass when you rerun failed jobs of a pipeline run.", fr: "La détection système signale aussi les tests qui réussissent lorsque vous réexécutez les travaux en échec d'une exécution de pipeline." }
references:
  - title: Manage flaky tests
    url: https://learn.microsoft.com/en-us/azure/devops/pipelines/test/flaky-test-management
