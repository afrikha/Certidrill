id: az400-1a-cfd-statements
objective: "1.2.1"
type: yesno_statements
difficulty: 3
status: draft
stem:
  en: |
    The Routing team at Northwind Traders uses a board in Azure Boards with the columns New, Active, Review and Closed. The team lead opens the in-context cumulative flow diagram (CFD) report from the backlog and also adds a Cumulative Flow Diagram widget to the team dashboard.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    L'équipe Routing de Northwind Traders utilise un tableau dans Azure Boards avec les colonnes New, Active, Review et Closed. Le responsable d'équipe ouvre le rapport contextuel de diagramme de flux cumulé (CFD) depuis le backlog et ajoute aussi un widget Cumulative Flow Diagram au tableau de bord de l'équipe.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          If the Review band keeps getting wider over several weeks, items are entering Review faster than they leave it.
        fr: |
          Si la bande Review ne cesse de s'élargir pendant plusieurs semaines, les éléments entrent dans Review plus vite qu'ils n'en sortent.
    - id: s2
      text:
        en: |
          The rolling period that the team lead selects in the in-context CFD report applies to every member of the team.
        fr: |
          La période glissante que le responsable d'équipe sélectionne dans le rapport CFD contextuel s'applique à tous les membres de l'équipe.
    - id: s3
      text:
        en: |
          The CFD widget can show a fixed-scope view that starts on a chosen date instead of a rolling period.
        fr: |
          Le widget CFD peut afficher une vue à périmètre fixe qui commence à une date choisie au lieu d'une période glissante.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |
      Each CFD band is a column or state; a band that widens means a queue is building because work enters the state faster than it leaves, a sign of a bottleneck. Settings chosen in the in-context report are personal and persist only for the user who sets them. The widget offers either a rolling period or a start date for fixed-scope tracking, for example for sprints or Scrumban.
    fr: |
      Chaque bande du CFD correspond à une colonne ou à un état ; une bande qui s'élargit indique qu'une file d'attente se forme, car le travail entre dans l'état plus vite qu'il n'en sort, signe d'un goulot d'étranglement. Les paramètres choisis dans le rapport contextuel sont personnels et ne persistent que pour l'utilisateur qui les définit. Le widget propose soit une période glissante, soit une date de début pour un suivi à périmètre fixe, par exemple pour des sprints ou en Scrumban.
references:
  - title: "Tutorial: View and configure a cumulative flow diagram"
    url: https://learn.microsoft.com/en-us/azure/devops/report/dashboards/cumulative-flow
