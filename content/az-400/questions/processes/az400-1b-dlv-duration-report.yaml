id: az400-1b-dlv-duration-report
objective: "1.2.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Fabrikam, Inc. has an Azure DevOps project that contains a YAML pipeline named **api-ci**. Over the last two weeks, successful runs of api-ci have become slower, which delays deliveries to the test environment.

    You need to identify which tasks of api-ci take the most time. The solution must use a built-in report and must not require you to write a query.

    What should you use?
  fr: |
    Fabrikam, Inc. dispose d'un projet Azure DevOps qui contient un pipeline YAML nommé **api-ci**. Depuis deux semaines, les exécutions réussies d'api-ci sont devenues plus lentes, ce qui retarde les livraisons vers l'environnement de test.

    Vous devez identifier les tâches d'api-ci qui prennent le plus de temps. La solution doit utiliser un rapport intégré et ne doit pas vous obliger à écrire une requête.

    Que devez-vous utiliser ?
body:
  options:
    - id: a
      text: { en: "The Pipeline pass rate report on the Analytics tab of api-ci", fr: "Le rapport Pipeline pass rate de l'onglet Analytics d'api-ci" }
    - id: b
      text: { en: "The Pipeline duration report on the Analytics tab of api-ci", fr: "Le rapport Pipeline duration de l'onglet Analytics d'api-ci" }
    - id: c
      text: { en: "The Test failures report on the Analytics tab of api-ci", fr: "Le rapport Test failures de l'onglet Analytics d'api-ci" }
    - id: d
      text: { en: "The deployment history of the test environment", fr: "L'historique des déploiements de l'environnement de test" }
answer: { optionId: b }
explanation:
  correct:
    en: The Pipeline duration report shows how long the pipeline usually takes to complete successfully, the duration trend and the top tasks by duration. It is built from the run history and opens from the duration card on the Analytics tab of the pipeline, with date range and branch filters.
    fr: Le rapport Pipeline duration indique la durée habituelle d'une exécution réussie du pipeline, la tendance de cette durée et les tâches les plus longues. Il est construit à partir de l'historique des exécutions et s'ouvre depuis la carte de durée de l'onglet Analytics du pipeline, avec des filtres de plage de dates et de branche.
  options:
    a:
      en: The pass rate report shows the failure trend and the tasks that fail most often, not the tasks that take the most time.
      fr: Le rapport de taux de réussite montre la tendance des échecs et les tâches qui échouent le plus souvent, pas les tâches les plus longues.
    c:
      en: The Test failures report lists the tests that fail most often; it says nothing about task durations.
      fr: Le rapport Test failures liste les tests qui échouent le plus souvent ; il ne dit rien de la durée des tâches.
    d:
      en: The deployment history of an environment lists the runs that deployed to it, without a breakdown of task durations.
      fr: L'historique des déploiements d'un environnement liste les exécutions qui y ont déployé, sans détail de la durée des tâches.
references:
  - title: Pipeline reports
    url: https://learn.microsoft.com/en-us/azure/devops/pipelines/reports/pipelinereport
