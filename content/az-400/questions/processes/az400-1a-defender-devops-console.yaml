id: az400-1a-defender-devops-console
objective: "1.2.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove Bank stores code in three places: an Azure DevOps organization, a GitHub organization and a GitLab group. Each platform runs its own code, secret and dependency scanning.

    The CISO needs a single console that shows the total number of security scan findings across the three platforms, grouped by severity and by finding type, together with the DevOps environment posture recommendations. The solution must minimize development effort.

    What should you use?
  fr: |
    Woodgrove Bank stocke son code à trois endroits : une organisation Azure DevOps, une organisation GitHub et un groupe GitLab. Chaque plateforme exécute sa propre analyse du code, des secrets et des dépendances.

    Le RSSI a besoin d'une console unique qui affiche le nombre total de résultats d'analyse de sécurité sur les trois plateformes, regroupés par gravité et par type de résultat, ainsi que les recommandations de posture de l'environnement DevOps. La solution doit réduire au minimum l'effort de développement.

    Que devez-vous utiliser ?
body:
  options:
    - { id: a, text: { en: "Security overview in the Azure DevOps organization settings", fr: "Security overview dans les paramètres de l'organisation Azure DevOps" } }
    - { id: b, text: { en: "Security overview on the Security tab of the GitHub organization", fr: "Security overview dans l'onglet Security de l'organisation GitHub" } }
    - { id: c, text: { en: "DevOps security in Microsoft Defender for Cloud", fr: "DevOps security dans Microsoft Defender for Cloud" } }
    - { id: d, text: { en: "An Azure DevOps dashboard with Query Tile widgets", fr: "Un tableau de bord Azure DevOps avec des widgets Query Tile" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Defender for Cloud DevOps security connects Azure DevOps, GitHub and GitLab environments through one connector per platform and provides a central console. Its overview shows the scan findings (code, secrets, dependencies, infrastructure as code) grouped by severity and finding type, the posture management recommendations and the advanced security coverage, and its DevOps workbook can be customized.
    fr: |
      DevOps security de Defender for Cloud connecte les environnements Azure DevOps, GitHub et GitLab au moyen d'un connecteur par plateforme et fournit une console centrale. Sa vue d'ensemble affiche les résultats d'analyse (code, secrets, dépendances, infrastructure en tant que code) regroupés par gravité et par type de résultat, les recommandations de gestion de la posture et la couverture de la sécurité avancée, et son classeur DevOps est personnalisable.
  options:
    a: { en: "The Azure DevOps security overview only covers Azure Repos repositories of that organization.", fr: "Le Security overview d'Azure DevOps ne couvre que les dépôts Azure Repos de cette organisation." }
    b: { en: "The GitHub security overview only covers the repositories of that GitHub organization.", fr: "Le Security overview de GitHub ne couvre que les dépôts de cette organisation GitHub." }
    d: { en: "Query Tile counts work items from a shared query; it cannot read security findings from GitHub or GitLab.", fr: "Query Tile compte des éléments de travail issus d'une requête partagée ; il ne peut pas lire les résultats de sécurité de GitHub ou GitLab." }
references:
  - title: Overview of Microsoft Defender for Cloud DevOps security
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/defender-for-devops-introduction
