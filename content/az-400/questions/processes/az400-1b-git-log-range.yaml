id: az400-1b-git-log-range
objective: "1.3.3"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Adatum Corporation tags each version of an application in a Git repository, for example `v2.4.0` and `v2.5.0`. A release pipeline must generate a draft of the release notes of v2.5.0 from the Git history.

    The command must meet the following requirements:

    - It lists only the commits that are in v2.5.0 but not in v2.4.0.
    - It ignores merge commits.
    - Each line shows the abbreviated commit hash, the author name and the commit subject.

    How should you complete the command? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum Corporation pose une balise sur chaque version d'une application dans un dépôt Git, par exemple `v2.4.0` et `v2.5.0`. Un pipeline de mise en production doit générer un brouillon des notes de publication de v2.5.0 à partir de l'historique Git.

    La commande doit répondre aux exigences suivantes :

    - Elle liste uniquement les commits présents dans v2.5.0 mais absents de v2.4.0.
    - Elle ignore les commits de fusion.
    - Chaque ligne affiche le hachage abrégé du commit, le nom de l'auteur et l'objet du commit.

    Comment devez-vous compléter la commande ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: bash
  template: |
    git log [[range]] [[merges]] --pretty=format:"[[fmt]]" > notes/v2.5.0.md
  slots:
    - id: range
      options:
        - { id: back, text: v2.5.0..v2.4.0 }
        - { id: fwd, text: v2.4.0..v2.5.0 }
        - { id: both, text: v2.4.0 v2.5.0 }
    - id: merges
      options:
        - { id: merges, text: --merges }
        - { id: all, text: --all }
        - { id: nomerges, text: --no-merges }
    - id: fmt
      options:
        - { id: ok, text: "- %h %an %s" }
        - { id: full, text: "- %H %an %b" }
        - { id: email, text: "- %h %ae %s" }
        - { id: committer, text: "- %h %cn %s" }
answer:
  values: { range: fwd, merges: nomerges, fmt: ok }
explanation:
  correct:
    en: "The range `A..B` selects the commits reachable from B that aren't reachable from A, so `v2.4.0..v2.5.0` returns the commits added since v2.4.0. `--no-merges` skips commits that have more than one parent. In the format string, `%h` is the abbreviated hash, `%an` the author name and `%s` the subject."
    fr: "La plage `A..B` sélectionne les commits accessibles depuis B qui ne sont pas accessibles depuis A : `v2.4.0..v2.5.0` renvoie les commits ajoutés depuis v2.4.0. `--no-merges` ignore les commits qui ont plus d'un parent. Dans la chaîne de format, `%h` est le hachage abrégé, `%an` le nom de l'auteur et `%s` l'objet."
  options:
    back: { en: "The reversed range lists the commits of v2.4.0 that aren't in v2.5.0, usually none.", fr: "La plage inversée liste les commits de v2.4.0 absents de v2.5.0, en général aucun." }
    both: { en: "Two revisions without .. list every commit reachable from either tag, that is, the whole history.", fr: "Deux révisions sans .. listent tous les commits accessibles depuis l'une ou l'autre balise, c'est-à-dire tout l'historique." }
    merges: { en: "--merges keeps only the merge commits, the opposite of the requirement.", fr: "--merges ne conserve que les commits de fusion, l'inverse de l'exigence." }
    all: { en: "--all adds the commits of every reference of the repository.", fr: "--all ajoute les commits de toutes les références du dépôt." }
    full: { en: "%H is the full hash and %b the body of the message, not the subject.", fr: "%H est le hachage complet et %b le corps du message, pas l'objet." }
    email: { en: "%ae is the author email, not the author name.", fr: "%ae est l'adresse e-mail de l'auteur, pas son nom." }
    committer: { en: "%cn is the committer name, which can differ from the author name.", fr: "%cn est le nom du validateur (committer), qui peut différer du nom de l'auteur." }
references:
  - title: Implement a changelog
    url: https://learn.microsoft.com/en-us/training/modules/manage-git-repositories/4-implement-change-log
