id: az400-1b-boards-default-branch
objective: "1.3.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Tailspin Toys connected a GitHub repository to an Azure Boards project by using the Azure Boards app. The default branch of the repository is **main**. The team fixes production issues in a branch named **release/2026.11** and merges them into main once a week.

    A developer merges a pull request into release/2026.11. The description of the pull request contains `Fixes AB#230`. Bug 230 now shows the pull request in its Development section, but the bug is still in the Active state. The workflow of the Bug work item type has a state in the Resolved category.

    What is the cause of the issue?
  fr: |
    Tailspin Toys a connecté un dépôt GitHub à un projet Azure Boards à l'aide de l'application Azure Boards. La branche par défaut du dépôt est **main**. L'équipe corrige les incidents de production dans une branche nommée **release/2026.11** et les fusionne dans main une fois par semaine.

    Un développeur fusionne une pull request dans release/2026.11. La description de la pull request contient `Fixes AB#230`. Le bogue 230 affiche désormais la pull request dans sa section Development, mais il est toujours à l'état Active. Le workflow du type d'élément de travail Bug comporte un état de la catégorie Resolved.

    Quelle est la cause du problème ?
body:
  options:
    - { id: a, text: { en: "The fix keyword must be in the title of the pull request, not in its description.", fr: "Le mot clé de correction doit figurer dans le titre de la pull request, pas dans sa description." } }
    - { id: b, text: { en: "State transitions apply only when a pull request merges into the default branch.", fr: "Les changements d'état ne s'appliquent que quand une pull request est fusionnée dans la branche par défaut." } }
    - { id: c, text: { en: "The Azure Boards app needs read and write access to Checks before it can change states.", fr: "L'application Azure Boards a besoin d'un accès en lecture et en écriture à Checks pour pouvoir changer les états." } }
    - { id: d, text: { en: "Fixes moves a work item only to the Closed state, which the Bug workflow doesn't define.", fr: "Fixes fait passer un élément de travail uniquement à l'état Closed, que le workflow Bug ne définit pas." } }
answer: { optionId: b }
explanation:
  correct:
    en: Links are created whatever branch the pull request targets, which is why the pull request appears in the Development section. The keyword-based state transitions, however, apply only when the pull request merges into the default branch, here main. The bug will transition when a pull request that contains the mention merges into main.
    fr: Les liens sont créés quelle que soit la branche ciblée par la pull request, d'où la présence de la pull request dans la section Development. En revanche, les changements d'état déclenchés par les mots clés ne s'appliquent que quand la pull request est fusionnée dans la branche par défaut, ici main. Le bogue changera d'état quand une pull request contenant la mention sera fusionnée dans main.
  options:
    a: { en: "An AB# mention in the title of a pull request doesn't even create a link; the description is the right place.", fr: "Une mention AB# dans le titre d'une pull request ne crée même pas de lien ; la description est le bon emplacement." }
    c: { en: "The Checks permission adds pull request insights (draft, review and checks status) to the Development section; it isn't needed for transitions.", fr: "L'autorisation Checks ajoute les informations de pull request (brouillon, revue et état des vérifications) à la section Development ; elle n'est pas nécessaire aux changements d'état." }
    d: { en: "Fix keywords move the work item to the first state of the Resolved category, or of the Completed category if there's none.", fr: "Les mots clés de correction font passer l'élément de travail au premier état de la catégorie Resolved, ou de la catégorie Completed s'il n'y en a pas." }
references:
  - title: Link GitHub commits, pull requests, branches, and issues to work items in Azure Boards
    url: https://learn.microsoft.com/en-us/azure/devops/boards/github/link-to-from-github
