id: az400-1a-link-types
objective: "1.1.4"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Tailspin Toys tracks defects in Azure Boards and builds its code from Azure Repos. A tester finds a defect in build 20261104.3 and creates Bug 812. A developer then fixes the defect in a dedicated branch, and the fix ships in build 20261106.1.

    You need to record each of these relationships on Bug 812 by using the appropriate link type.

    Which link type should you use for each relationship? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin Toys suit les défauts dans Azure Boards et génère son code à partir d'Azure Repos. Un testeur trouve un défaut dans la build 20261104.3 et crée le Bug 812. Un développeur corrige ensuite le défaut dans une branche dédiée, et le correctif est livré dans la build 20261106.1.

    Vous devez enregistrer chacune de ces relations sur le Bug 812 avec le type de lien approprié.

    Quel type de lien devez-vous utiliser pour chaque relation ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Build 20261104.3, where the defect was discovered: [[found]]
      Branch where the developer works on the fix: [[branch]]
      Build 20261106.1, which contains the fix: [[integrated]]
    fr: |
      Build 20261104.3, dans laquelle le défaut a été découvert : [[found]]
      Branche dans laquelle le développeur travaille sur le correctif : [[branch]]
      Build 20261106.1, qui contient le correctif : [[integrated]]
  slots:
    - id: found
      options:
        - { id: found, text: Found in build }
        - { id: integ, text: Integrated in build }
        - { id: commit, text: Commit }
        - { id: related, text: Related }
    - id: branch
      options:
        - { id: branch, text: Branch }
        - { id: pr, text: Pull Request }
        - { id: build, text: Build }
        - { id: tested, text: Tested By }
    - id: integrated
      options:
        - { id: integ, text: Integrated in build }
        - { id: found, text: Found in build }
        - { id: release, text: Integrated in release environment }
        - { id: commit, text: Commit }
answer:
  values: { found: found, branch: branch, integrated: integ }
explanation:
  correct:
    en: |
      Found in build records the build in which a defect was discovered, and Integrated in build records the build that contains the work. Branch connects a work item to a Git branch; the Development section of the work item also uses the Commit and Pull Request link types. Together they give end-to-end traceability from the defect to the fix.
    fr: |
      Found in build enregistre la build dans laquelle un défaut a été découvert, et Integrated in build la build qui contient le travail. Branch relie un élément de travail à une branche Git ; la section Development de l'élément de travail utilise aussi les types de liens Commit et Pull Request. Ensemble, ils assurent une traçabilité de bout en bout, du défaut jusqu'au correctif.
  options:
    release: { en: "Integrated in release environment records the release stage where the work was deployed, not a build.", fr: "Integrated in release environment enregistre l'étape de mise en production dans laquelle le travail a été déployé, pas une build." }
    pr: { en: "Pull Request links a pull request, not the branch on which the developer works.", fr: "Pull Request lie une pull request, pas la branche sur laquelle le développeur travaille." }
    tested: { en: "Tested By links a work item to a test case.", fr: "Tested By lie un élément de travail à un cas de test." }
references:
  - title: Link work items to objects
    url: https://learn.microsoft.com/en-us/azure/devops/boards/backlogs/add-link
