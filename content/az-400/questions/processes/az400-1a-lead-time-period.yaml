id: az400-1a-lead-time-period
objective: "1.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    The Claims team at Fabrikam uses Azure Boards and a field named **Release** on its user stories. Release 3 started on September 1. The team adds a Lead Time widget to its dashboard.

    You need the widget to show only the user stories of Release 3 that were completed since the release started, rather than a continuous view of the last weeks.

    How should you configure the widget?
  fr: |
    L'équipe Claims de Fabrikam utilise Azure Boards et un champ nommé **Release** sur ses récits utilisateur. La Release 3 a commencé le 1er septembre. L'équipe ajoute un widget Lead Time à son tableau de bord.

    Le widget doit afficher uniquement les récits utilisateur de la Release 3 terminés depuis le début de la release, plutôt qu'une vue continue des dernières semaines.

    Comment devez-vous configurer le widget ?
body:
  options:
    - id: a
      text: { en: "Set Field criteria to Release = Release 3, and set Time period to Start date with September 1.", fr: "Définir Field criteria sur Release = Release 3, et Time period sur Start date avec le 1er septembre." }
    - id: b
      text: { en: "Set Field criteria to Release = Release 3, and set Time period to Rolling period with 30 days.", fr: "Définir Field criteria sur Release = Release 3, et Time period sur Rolling period avec 30 jours." }
    - id: c
      text: { en: "Select a swimlane named Release 3, and set Time period to Rolling period with 90 days.", fr: "Sélectionner un couloir (swimlane) nommé Release 3, et définir Time period sur Rolling period avec 90 jours." }
    - id: d
      text: { en: "Select the Release 3 iteration as the team's current sprint, and keep the default time period.", fr: "Sélectionner l'itération Release 3 comme sprint actuel de l'équipe, et conserver la période par défaut." }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Field criteria filter the work items included in the chart (here Release = Release 3). A Start date time period gives a fixed-scope view from that date, which suits a release or a sprint, whereas a rolling period of N days suits continuous flow.
    fr: |
      Les critères de champ (Field criteria) filtrent les éléments de travail inclus dans le graphique (ici Release = Release 3). Une période de type Start date donne une vue à périmètre fixe à partir de cette date, adaptée à une release ou à un sprint, alors qu'une période glissante de N jours convient à un flux continu.
  options:
    b: { en: "A 30-day rolling period would drop the stories completed in early September once the window moves past them.", fr: "Une période glissante de 30 jours exclurait les récits terminés début septembre dès que la fenêtre les dépasse." }
    c: { en: "Swimlanes are board rows, not release values, and a rolling period is not anchored to the release start.", fr: "Les couloirs sont des lignes du tableau, pas des valeurs de release, et une période glissante n'est pas ancrée au début de la release." }
    d: { en: "The Lead Time widget has no iteration selector; the team's current sprint does not filter on the Release field.", fr: "Le widget Lead Time n'a pas de sélecteur d'itération ; le sprint actuel de l'équipe ne filtre pas sur le champ Release." }
references:
  - title: Configure lead time and cycle time widgets
    url: https://learn.microsoft.com/en-us/azure/devops/report/dashboards/cycle-time-and-lead-time
