id: az400-1b-wiki-order-file
objective: "1.3.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Proseware, Inc. publishes the **/handbook** folder of an Azure Repos Git repository as a code wiki. The folder contains about 40 Markdown files, such as `Get-Started.md`, `Release-Process.md` and `Team-Contacts.md`.

    The team wants to control the sequence of the pages in the navigation pane and make Get-Started the home page. You plan to add `.order` files to the folder.

    Which two statements about `.order` files are true?

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware, Inc. publie le dossier **/handbook** d'un dépôt Git Azure Repos en tant que wiki de code. Le dossier contient environ 40 fichiers Markdown, comme `Get-Started.md`, `Release-Process.md` et `Team-Contacts.md`.

    L'équipe souhaite contrôler l'ordre des pages dans le volet de navigation et faire de Get-Started la page d'accueil. Vous prévoyez d'ajouter des fichiers `.order` au dossier.

    Quelles sont les deux affirmations vraies concernant les fichiers `.order` ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Each line must contain the file name with its .md extension, for example Get-Started.md.", fr: "Chaque ligne doit contenir le nom du fichier avec son extension .md, par exemple Get-Started.md." } }
    - { id: b, text: { en: "The first line of the .order file at the root of the wiki defines the home page.", fr: "La première ligne du fichier .order à la racine du wiki définit la page d'accueil." } }
    - { id: c, text: { en: "Page names in a .order file aren't case-sensitive.", fr: "Les noms de page d'un fichier .order ne respectent pas la casse." } }
    - { id: d, text: { en: "Pages that aren't listed in the .order file are added in alphabetical order after the listed pages.", fr: "Les pages qui ne figurent pas dans le fichier .order sont ajoutées par ordre alphabétique après les pages listées." } }
    - { id: e, text: { en: "Only the root folder of the wiki can contain a .order file.", fr: "Seul le dossier racine du wiki peut contenir un fichier .order." } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: "A .order file is a plain-text list of page names, one per line, that sets the sequence of the pages of its folder. The first entry of the root .order file is the home page, and pages that aren't listed follow the listed pages in alphabetical order."
    fr: "Un fichier .order est une liste en texte brut de noms de pages, un par ligne, qui fixe l'ordre des pages de son dossier. La première entrée du fichier .order racine est la page d'accueil, et les pages non listées suivent les pages listées par ordre alphabétique."
  options:
    a: { en: "Entries are page names without the .md extension, for example Get-Started.", fr: "Les entrées sont des noms de pages sans l'extension .md, par exemple Get-Started." }
    c: { en: "Page names in a .order file are case-sensitive.", fr: "Les noms de page d'un fichier .order respectent la casse." }
    e: { en: "The root of the wiki and each subfolder can have their own .order file.", fr: "La racine du wiki et chaque sous-dossier peuvent avoir leur propre fichier .order." }
references:
  - title: Publish a Git repo to a wiki
    url: https://learn.microsoft.com/en-us/azure/devops/project/wiki/publish-repo-to-wiki
  - title: Wiki file and folder structure in Git
    url: https://learn.microsoft.com/en-us/azure/devops/project/wiki/wiki-file-structure
