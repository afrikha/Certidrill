id: az400-1b-teams-workflows-webhook
objective: "1.3.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Litware, Inc. has a deployment script that runs at the end of each release and sends a JSON message to an Incoming Webhook connector of a Microsoft Teams channel named **Releases**. The Office 365 connectors of Teams, including the connector-based Incoming Webhook, are retired.

    You need the script to keep posting a message to the Releases channel after each release. The solution must minimize development effort.

    What should you do?
  fr: |
    Litware, Inc. dispose d'un script de déploiement qui s'exécute à la fin de chaque mise en production et envoie un message JSON à un connecteur Incoming Webhook d'un canal Microsoft Teams nommé **Releases**. Les connecteurs Office 365 de Teams, y compris le connecteur Incoming Webhook, sont mis hors service.

    Le script doit continuer à publier un message dans le canal Releases après chaque mise en production. La solution doit réduire au minimum l'effort de développement.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Register a new webhook connector in the Connector developer portal and add it to the channel.", fr: "Inscrire un nouveau connecteur webhook dans le portail des développeurs de connecteurs et l'ajouter au canal." }
    - id: b
      text: { en: "Link the channel to the Azure DevOps project by using the Azure Boards app.", fr: "Lier le canal au projet Azure DevOps à l'aide de l'application Azure Boards." }
    - id: c
      text: { en: "Create a workflow from the Send webhook alerts to a channel template and post to its URL.", fr: "Créer un workflow à partir du modèle Send webhook alerts to a channel et publier vers son URL." }
    - id: d
      text: { en: "Add the Azure DevOps app to the channel as a tab that shows a dashboard.", fr: "Ajouter l'application Azure DevOps au canal sous forme d'onglet affichant un tableau de bord." }
answer: { optionId: c }
explanation:
  correct:
    en: The Workflows app replaces the connector-based Incoming Webhook. The Send webhook alerts to a channel template generates a webhook URL; the script posts its JSON message (for example an Adaptive Card) to this URL, and the workflow publishes it in the channel, with no app to develop.
    fr: L'application Workflows remplace l'Incoming Webhook basé sur un connecteur. Le modèle Send webhook alerts to a channel génère une URL de webhook ; le script publie son message JSON (par exemple une carte adaptative) vers cette URL, et le workflow le publie dans le canal, sans application à développer.
  options:
    a:
      en: Developers can no longer register new connectors in the Connector developer portal.
      fr: Les développeurs ne peuvent plus inscrire de nouveaux connecteurs dans le portail des développeurs de connecteurs.
    b:
      en: The Azure Boards app sends work item notifications; it doesn't accept messages posted by a script.
      fr: L'application Azure Boards envoie des notifications sur les éléments de travail ; elle n'accepte pas les messages publiés par un script.
    d:
      en: A dashboard tab displays project data in the channel; it doesn't publish messages sent by a script.
      fr: Un onglet de tableau de bord affiche les données d'un projet dans le canal ; il ne publie pas les messages envoyés par un script.
references:
  - title: Create Incoming Webhooks
    url: https://learn.microsoft.com/en-us/microsoftteams/platform/webhooks-and-connectors/how-to/add-incoming-webhook
