id: az400-1a-resolution-mentions
objective: "1.1.4"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam stores the code of its portal in an Azure Repos Git repository named **portal**. The default branch is `main`. The **Commit mention work item resolution** setting of the repository has its default value. Bugs 123, 124 and 125 are in the Active state.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam stocke le code de son portail dans un dépôt Git Azure Repos nommé **portal**. La branche par défaut est `main`. Le paramètre **Commit mention work item resolution** du dépôt a sa valeur par défaut. Les bogues 123, 124 et 125 sont à l'état Active.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "Pushing a commit whose message is `Fixes #123` to the branch `feature/login` resolves bug 123."
        fr: "L'envoi (push) d'un commit dont le message est `Fixes #123` vers la branche `feature/login` résout le bogue 123."
    - id: s2
      text:
        en: "Pushing a commit whose message is `Fixes #123 and fixes #124` to `main` attempts to resolve bugs 123 and 124."
        fr: "L'envoi (push) vers `main` d'un commit dont le message est `Fixes #123 and fixes #124` tente de résoudre les bogues 123 et 124."
    - id: s3
      text:
        en: "Pushing a commit whose message is `fixes #123,124,125` to `main` attempts to resolve the three bugs."
        fr: "L'envoi (push) vers `main` d'un commit dont le message est `fixes #123,124,125` tente de résoudre les trois bogues."
answer:
  values: { s1: false, s2: true, s3: false }
explanation:
  correct:
    en: |
      Resolution mentions (fix, fixes or fixed followed by #ID) are processed only when the commit reaches the default branch, by a push or by completing a pull request into it; the setting is enabled by default. Each work item needs its own keyword and number. In a comma-separated list after one keyword, only the first work item is resolved, to limit accidental resolutions.
    fr: |
      Les mentions de résolution (fix, fixes ou fixed suivi de #ID) ne sont traitées que lorsque le commit atteint la branche par défaut, par un push ou par la complétion d'une pull request vers celle-ci ; le paramètre est activé par défaut. Chaque élément de travail doit avoir son propre mot clé et son numéro. Dans une liste séparée par des virgules après un seul mot clé, seul le premier élément de travail est résolu, pour limiter les résolutions accidentelles.
references:
  - title: Resolve work items on commit
    url: https://learn.microsoft.com/en-us/azure/devops/repos/git/resolution-mentions
