id: az400-1b-ops-workitem-template-roles
objective: "1.2.7"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove Bank monitors a payment API with an Application Insights resource named **appi-payments**. The developers track their work in an Azure DevOps project.

    When an exception appears in the Failures view, the on-call engineers must be able to create an Azure DevOps bug that is prefilled with the exception details and a link back to the transaction. A developer named Dev1 must create the work item template in appi-payments.

    Which two Azure roles can you assign to Dev1 so that Dev1 can create the template? Each correct answer presents a complete solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove Bank supervise une API de paiement avec une ressource Application Insights nommée **appi-payments**. Les développeurs suivent leur travail dans un projet Azure DevOps.

    Quand une exception apparaît dans la vue Échecs, les ingénieurs d'astreinte doivent pouvoir créer un bogue Azure DevOps prérempli avec les détails de l'exception et un lien vers la transaction. Un développeur nommé Dev1 doit créer le modèle d'élément de travail dans appi-payments.

    Quels sont les deux rôles Azure que vous pouvez attribuer à Dev1 pour qu'il puisse créer le modèle ? Chaque bonne réponse constitue une solution complète.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: Monitoring Reader }
    - { id: b, text: Workbook Contributor }
    - { id: c, text: Workbook Reader }
    - { id: d, text: Monitoring Contributor }
    - { id: e, text: Log Analytics Reader }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: "A work item template is an Azure Monitor workbook saved as a `Microsoft.Insights/workbooks` resource, so creating or editing one requires the `Microsoft.Insights/workbooks/write` permission. Workbook Contributor and Monitoring Contributor both include it. Creating the bug itself also requires permission in the Azure DevOps project."
    fr: "Un modèle d'élément de travail est un classeur Azure Monitor enregistré comme ressource `Microsoft.Insights/workbooks` : sa création ou sa modification exige l'autorisation `Microsoft.Insights/workbooks/write`. Workbook Contributor et Monitoring Contributor l'incluent tous les deux. La création du bogue lui-même exige aussi une autorisation dans le projet Azure DevOps."
  options:
    a: { en: "Monitoring Reader can read monitoring data and settings but can't save a workbook.", fr: "Monitoring Reader peut lire les données et les paramètres de supervision, mais ne peut pas enregistrer de classeur." }
    c: { en: "Workbook Reader can open workbooks but can't create or modify them.", fr: "Workbook Reader peut ouvrir des classeurs, mais ne peut ni en créer ni en modifier." }
    e: { en: "Log Analytics Reader can query logs but has no write permission on workbooks.", fr: "Log Analytics Reader peut interroger les journaux, mais n'a aucune autorisation d'écriture sur les classeurs." }
references:
  - title: Work item integration
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/app/release-and-work-item-insights
