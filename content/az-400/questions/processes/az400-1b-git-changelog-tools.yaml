id: az400-1b-git-changelog-tools
objective: "1.3.3"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Contoso, Ltd. wants to generate change documentation from the history of its repositories instead of writing it by hand. Several teams describe what they need.

    Which option should each team use? To answer, drag the appropriate options to the correct requirements. Each option may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso, Ltd. souhaite générer la documentation des modifications à partir de l'historique de ses dépôts au lieu de la rédiger à la main. Plusieurs équipes décrivent leur besoin.

    Quelle option chaque équipe doit-elle utiliser ? Pour répondre, faites glisser les options appropriées vers les exigences correspondantes. Chaque option peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: gitlog, text: { en: "git log with a range of version tags", fr: "git log avec une plage de balises de version" } }
    - { id: gitchangelog, text: gitchangelog }
    - { id: ghgen, text: github_changelog_generator }
    - { id: autonotes, text: { en: "GitHub automatically generated release notes", fr: "Notes de publication générées automatiquement par GitHub" } }
    - { id: pages, text: GitHub Pages }
  targets:
    - id: t1
      text: { en: "A native Git command whose output for one version is piped to an in-house script", fr: "Une commande Git native dont la sortie pour une version est transmise à un script interne" }
    - id: t2
      text: { en: "A Python tool that builds a changelog from the commit messages", fr: "Un outil Python qui construit un journal des modifications à partir des messages de commit" }
    - id: t3
      text: { en: "A Ruby gem that builds a changelog from the tags, issues and pull requests of a GitHub repository", fr: "Une gem Ruby qui construit un journal des modifications à partir des balises, des problèmes (issues) et des pull requests d'un dépôt GitHub" }
    - id: t4
      text: { en: "Notes created on the release page, grouped by pull request label through a configuration file", fr: "Des notes créées depuis la page de version, regroupées par étiquette de pull request grâce à un fichier de configuration" }
answer:
  mapping: { t1: gitlog, t2: gitchangelog, t3: ghgen, t4: autonotes }
explanation:
  correct:
    en: "`git log` with a range such as `v1.2.0..v1.3.0` lists the commits of one version and can feed a helper script. gitchangelog is a Python tool, and github_changelog_generator is a Ruby gem that reads a GitHub repository. GitHub generates release notes from the merged pull requests when you create a release, grouped by the categories of `.github/release.yml`. GitHub Pages publishes documentation but doesn't generate it."
    fr: "`git log` avec une plage comme `v1.2.0..v1.3.0` liste les commits d'une version et peut alimenter un script. gitchangelog est un outil Python, et github_changelog_generator est une gem Ruby qui lit un dépôt GitHub. GitHub génère des notes de publication à partir des pull requests fusionnées quand vous créez une version, regroupées selon les catégories de `.github/release.yml`. GitHub Pages publie de la documentation mais ne la génère pas."
references:
  - title: Implement a changelog
    url: https://learn.microsoft.com/en-us/training/modules/manage-git-repositories/4-implement-change-log
  - title: Automate release notes with GitHub
    url: https://learn.microsoft.com/en-us/training/modules/manage-git-repositories/9-automate-release-notes-github
