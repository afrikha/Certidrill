id: az400-1b-git-push-changelog
objective: "1.3.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Northwind Traders has a YAML pipeline in Azure Pipelines that builds an application stored in an Azure Repos Git repository. You add a script step that regenerates the `CHANGELOG.md` file from the Git history, then runs `git commit` and `git push` to update the file in the repository.

    The build service identity already has the Contribute permission on the repository. The push step fails because Git has no credentials. The solution must not store any personal access token.

    Which setting should you add to the `checkout` step?
  fr: |
    Northwind Traders dispose d'un pipeline YAML dans Azure Pipelines qui génère une application stockée dans un dépôt Git Azure Repos. Vous ajoutez une étape de script qui régénère le fichier `CHANGELOG.md` à partir de l'historique Git, puis exécute `git commit` et `git push` pour mettre à jour le fichier dans le dépôt.

    L'identité du service de build dispose déjà de l'autorisation Contribute sur le dépôt. L'étape de push échoue, car Git n'a pas d'informations d'identification. La solution ne doit stocker aucun jeton d'accès personnel.

    Quel paramètre devez-vous ajouter à l'étape `checkout` ?
body:
  options:
    - id: a
      text: "clean: true"
    - id: b
      text: "persistCredentials: true"
    - id: c
      text: "fetchTags: true"
    - id: d
      text: "fetchDepth: 0"
answer: { optionId: b }
explanation:
  correct:
    en: "By default, the checkout step doesn't leave the OAuth token of the pipeline in the Git configuration after the initial fetch. `persistCredentials: true` keeps the token, so later Git commands of the job, such as `git push`, authenticate as the build service identity without a personal access token."
    fr: "Par défaut, l'étape checkout ne conserve pas le jeton OAuth du pipeline dans la configuration Git après la récupération initiale. `persistCredentials: true` conserve ce jeton : les commandes Git suivantes du travail, comme `git push`, s'authentifient avec l'identité du service de build, sans jeton d'accès personnel."
  options:
    a:
      en: "`clean: true` cleans the working folder before the fetch; it doesn't provide credentials."
      fr: "`clean: true` nettoie le dossier de travail avant la récupération ; il ne fournit pas d'informations d'identification."
    c:
      en: "`fetchTags: true` downloads the tags during the checkout; it doesn't keep the token for later commands."
      fr: "`fetchTags: true` télécharge les balises pendant le checkout ; il ne conserve pas le jeton pour les commandes suivantes."
    d:
      en: "`fetchDepth: 0` downloads the full history; it doesn't keep the token for later commands."
      fr: "`fetchDepth: 0` télécharge tout l'historique ; il ne conserve pas le jeton pour les commandes suivantes."
references:
  - title: steps.checkout definition
    url: https://learn.microsoft.com/en-us/azure/devops/pipelines/yaml-schema/steps-checkout
