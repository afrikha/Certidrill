id: az400-1a-pass-rate-filters
objective: "1.2.3"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Tailspin Toys builds pull request branches and the `main` branch with the same YAML pipeline, named **web-ci**. Failures on pull request branches are expected while developers work, so the team lead wants to measure the reliability of web-ci on `main` only, over the last 30 days.

    How should the team lead view the data? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin Toys génère les branches de pull request et la branche `main` avec le même pipeline YAML, nommé **web-ci**. Les échecs sur les branches de pull request sont attendus pendant que les développeurs travaillent : le responsable d'équipe veut donc mesurer la fiabilité de web-ci sur `main` uniquement, sur les 30 derniers jours.

    Comment le responsable d'équipe doit-il afficher les données ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Report to open: [[report]]
      Restrict the data to main: [[branch]]
      Cover the last 30 days: [[period]]
    fr: |
      Rapport à ouvrir : [[report]]
      Limiter les données à main : [[branch]]
      Couvrir les 30 derniers jours : [[period]]
  slots:
    - id: report
      options:
        - { id: pass, text: { en: "Pipeline pass rate, on the Analytics tab of web-ci", fr: "Pipeline pass rate, dans l'onglet Analytics de web-ci" } }
        - { id: dur, text: { en: "Pipeline duration, on the Analytics tab of web-ci", fr: "Pipeline duration, dans l'onglet Analytics de web-ci" } }
        - { id: runs, text: { en: "The Runs list of web-ci", fr: "La liste Runs de web-ci" } }
    - id: branch
      options:
        - { id: filter, text: { en: "Select main in the branch filter of the report", fr: "Sélectionner main dans le filtre de branche du rapport" } }
        - { id: trigger, text: { en: "Change the trigger of web-ci to include only main", fr: "Modifier le déclencheur de web-ci pour n'inclure que main" } }
        - { id: policy, text: { en: "Add a path filter to the build validation policy", fr: "Ajouter un filtre de chemin à la stratégie de validation de build" } }
    - id: period
      options:
        - { id: days, text: { en: "Change the days filter from its default of 14 days to 30 days", fr: "Faire passer le filtre de jours de sa valeur par défaut de 14 jours à 30 jours" } }
        - { id: retention, text: { en: "Set the run retention of the project to 30 days", fr: "Définir la rétention des exécutions du projet sur 30 jours" } }
        - { id: none, text: { en: "Keep the default period, which already covers 30 days", fr: "Conserver la période par défaut, qui couvre déjà 30 jours" } }
answer:
  values: { report: pass, branch: filter, period: days }
explanation:
  correct:
    en: |
      The Pipeline pass rate report on the Analytics tab shows the pass rate and its trend for the selected period. Its branch filter limits the report to one branch or a set of branches, so failures on pull request branches are excluded. The reports cover the last 14 days by default, and you change the range with the days filter.
    fr: |
      Le rapport Pipeline pass rate de l'onglet Analytics affiche le taux de réussite et sa tendance pour la période sélectionnée. Son filtre de branche limite le rapport à une branche ou à un ensemble de branches : les échecs sur les branches de pull request sont donc exclus. Les rapports couvrent par défaut les 14 derniers jours, et vous modifiez la plage avec le filtre de jours.
  options:
    dur: { en: "The duration report measures how long successful runs take, not their reliability.", fr: "Le rapport de durée mesure le temps pris par les exécutions réussies, pas leur fiabilité." }
    trigger: { en: "Changing the trigger would stop validating pull request branches instead of filtering the report.", fr: "Modifier le déclencheur arrêterait la validation des branches de pull request au lieu de filtrer le rapport." }
    retention: { en: "Retention deletes old runs; it does not choose the period of the report.", fr: "La rétention supprime les anciennes exécutions ; elle ne choisit pas la période du rapport." }
    none: { en: "The default period is 14 days.", fr: "La période par défaut est de 14 jours." }
references:
  - title: Pipeline reports
    url: https://learn.microsoft.com/en-us/azure/devops/pipelines/reports/pipelinereport
