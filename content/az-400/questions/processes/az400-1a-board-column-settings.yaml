id: az400-1a-board-column-settings
objective: "1.1.1"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    The Tailspin mobile team uses a board in Azure Boards with the columns New, Develop, Test and Closed. During retrospectives, the team identifies three problems in its flow of work.

    You need to configure the board to address each problem.

    What should you configure? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    L'équipe mobile de Tailspin utilise un tableau dans Azure Boards avec les colonnes New, Develop, Test et Closed. Lors des rétrospectives, l'équipe identifie trois problèmes dans son flux de travail.

    Vous devez configurer le tableau pour traiter chaque problème.

    Que devez-vous configurer ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Items whose development is finished sit in Develop until a tester notices them: [[idle]]
      Developers move items to Test without running the agreed checks first: [[dod]]
      Testers pull new items while many items are still in Test: [[wip]]
    fr: |
      Les éléments dont le développement est terminé restent dans Develop jusqu'à ce qu'un testeur les remarque : [[idle]]
      Les développeurs déplacent des éléments vers Test sans effectuer d'abord les vérifications convenues : [[dod]]
      Les testeurs prennent de nouveaux éléments alors que de nombreux éléments sont encore dans Test : [[wip]]
  slots:
    - id: idle
      options:
        - { id: split, text: { en: "Split columns", fr: "Fractionnement des colonnes" } }
        - { id: swim, text: { en: "Swimlanes", fr: "Couloirs (swimlanes)" } }
        - { id: wip, text: { en: "WIP limits", fr: "Limites de travail en cours (WIP)" } }
        - { id: style, text: { en: "Card styling rules", fr: "Règles de style des cartes" } }
    - id: dod
      options:
        - { id: dod, text: { en: "Definition of Done on the Develop column", fr: "Définition de Terminé (Definition of Done) sur la colonne Develop" } }
        - { id: swim, text: { en: "A swimlane for unchecked items", fr: "Un couloir (swimlane) pour les éléments non vérifiés" } }
        - { id: wip, text: { en: "A WIP limit on the Test column", fr: "Une limite de travail en cours (WIP) sur la colonne Test" } }
        - { id: tag, text: { en: "A tag color rule", fr: "Une règle de couleur d'étiquette" } }
    - id: wip
      options:
        - { id: wip, text: { en: "A WIP limit on the Test column", fr: "Une limite de travail en cours (WIP) sur la colonne Test" } }
        - { id: split, text: { en: "Split columns on the Test column", fr: "Le fractionnement de la colonne Test" } }
        - { id: dod, text: { en: "Definition of Done on the Test column", fr: "Définition de Terminé (Definition of Done) sur la colonne Test" } }
        - { id: swim, text: { en: "An Expedite swimlane", fr: "Un couloir (swimlane) Expedite" } }
answer:
  values: { idle: split, dod: dod, wip: wip }
explanation:
  correct:
    en: |
      Split columns divide Develop into Doing and Done, so finished items become visible and testers can pull them; a pile-up in Done reveals a bottleneck. A Definition of Done, set per column, states the criteria an item must meet before it moves on. A WIP limit on Test highlights the column when it holds too many items; limits are not enforced, but they signal the team to finish work before pulling more.
    fr: |
      Le fractionnement divise Develop en Doing et Done, ce qui rend visibles les éléments terminés que les testeurs peuvent prendre ; une accumulation dans Done révèle un goulot d'étranglement. Une définition de Terminé, définie par colonne, indique les critères qu'un élément doit remplir avant d'avancer. Une limite de travail en cours sur Test met la colonne en évidence lorsqu'elle contient trop d'éléments ; les limites ne sont pas bloquantes, mais elles incitent l'équipe à terminer le travail avant d'en prendre davantage.
  options:
    swim: { en: "Swimlanes group cards horizontally (for example, expedited work); they do not show hand-offs, criteria or overload.", fr: "Les couloirs regroupent les cartes horizontalement (par exemple le travail urgent) ; ils ne montrent ni les transferts, ni les critères, ni la surcharge." }
    style: { en: "Styling rules change card colors based on field values; they do not create a hand-off point.", fr: "Les règles de style changent la couleur des cartes selon des valeurs de champ ; elles ne créent pas de point de transfert." }
references:
  - title: Manage columns on your board
    url: https://learn.microsoft.com/en-us/azure/devops/boards/boards/split-columns
  - title: Set Work in Progress limits
    url: https://learn.microsoft.com/en-us/azure/devops/boards/boards/wip-limits
