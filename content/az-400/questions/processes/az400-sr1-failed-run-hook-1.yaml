id: az400-sr1-failed-run-hook-1
objective: "1.3.4"
type: series_yesno
series: az400-sr1-failed-run-hook
seriesOrder: 1
difficulty: 2
status: draft
stem:
  en: You create a Web Hooks subscription for the Run state changed event filtered on the Completed state.
  fr: Vous créez un abonnement Web Hooks pour l'événement Run state changed filtré sur l'état Completed.
body:
  solution:
    en: |
      In **Project settings > Service hooks** of Orders, you create a subscription for the **Web Hooks** service. You select the **Run state changed** event, filtered on the orders-ci pipeline and the **Completed** state, and you leave the result filter set to any result. In the action, you enter the HTTPS URL of the endpoint and the basic authentication user name and password.
    fr: |
      Dans **Project settings > Service hooks** d'Orders, vous créez un abonnement pour le service **Web Hooks**. Vous sélectionnez l'événement **Run state changed**, filtré sur le pipeline orders-ci et l'état **Completed**, et vous laissez le filtre de résultat sur n'importe quel résultat. Dans l'action, vous saisissez l'URL HTTPS du point de terminaison ainsi que le nom d'utilisateur et le mot de passe de l'authentification de base.
answer: { value: false }
explanation:
  correct:
    en: A service hook is the right no-code integration, but the Completed state is reached by every finished run, whatever its result. Without a filter on the Failed result, the endpoint also receives payloads for the successful and canceled runs of orders-ci.
    fr: "Un service hook est la bonne intégration sans code, mais l'état Completed est atteint par chaque exécution terminée, quel que soit son résultat. Sans filtre sur le résultat Failed, le point de terminaison reçoit aussi des charges utiles pour les exécutions réussies et annulées d'orders-ci."
references:
  - title: Service hook events
    url: https://learn.microsoft.com/en-us/azure/devops/service-hooks/events
