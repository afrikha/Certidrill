id: az400-1a-process-cmmi
objective: "1.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Woodgrove Bank is creating an Azure DevOps project for a payments platform that is subject to regulatory audits. The project must use a default process that provides dedicated work item types to track change requests, risks and formal reviews, in addition to requirements, tasks and bugs.

    Which process should you select when you create the project?
  fr: |
    Woodgrove Bank crée un projet Azure DevOps pour une plateforme de paiement soumise à des audits réglementaires. Le projet doit utiliser un processus par défaut qui fournit des types d'éléments de travail dédiés au suivi des demandes de modification, des risques et des revues formelles, en plus des exigences, des tâches et des bogues.

    Quel processus devez-vous sélectionner lors de la création du projet ?
body:
  options:
    - { id: a, text: Basic }
    - { id: b, text: Agile }
    - { id: c, text: Scrum }
    - { id: d, text: CMMI }
answer: { optionId: d }
explanation:
  correct:
    en: |
      The CMMI process plans work with the Requirement work item type and adds the Change Request, Issue, Risk and Review types, which suits teams that need formal change management and audit trails. It also includes the Bug type.
    fr: |
      Le processus CMMI planifie le travail avec le type d'élément de travail Requirement et ajoute les types Change Request, Issue, Risk et Review, ce qui convient aux équipes qui ont besoin d'une gestion formelle des modifications et de pistes d'audit. Il inclut aussi le type Bug.
  options:
    a: { en: "Basic only provides Epic, Issue and Task; bugs are tracked as issues and there are no risk or change request types.", fr: "Basic ne fournit que Epic, Issue et Task ; les bogues sont suivis comme des Issues et il n'existe aucun type pour les risques ou les demandes de modification." }
    b: { en: "Agile uses User Story, Task, Bug and Issue, but has no Change Request, Risk or Review types.", fr: "Agile utilise User Story, Task, Bug et Issue, mais n'a pas de types Change Request, Risk ou Review." }
    c: { en: "Scrum uses Product Backlog Item, Task, Bug and Impediment, but has no Change Request, Risk or Review types.", fr: "Scrum utilise Product Backlog Item, Task, Bug et Impediment, mais n'a pas de types Change Request, Risk ou Review." }
references:
  - title: Default processes and process templates
    url: https://learn.microsoft.com/en-us/azure/devops/boards/work-items/guidance/choose-process
