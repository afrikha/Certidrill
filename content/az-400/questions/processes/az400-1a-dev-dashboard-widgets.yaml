id: az400-1a-dev-dashboard-widgets
objective: "1.2.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Contoso develops a payments module in the folder **/src/payments** of an Azure Repos Git repository named **core**. A YAML pipeline named **payments-ci** builds the module on every push.

    The development manager wants a dashboard that shows:

    - a summary of the recent changes made in the /src/payments folder;
    - a histogram of the recent runs of payments-ci, colored by result.

    Which two widgets should you add? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso développe un module de paiement dans le dossier **/src/payments** d'un dépôt Git Azure Repos nommé **core**. Un pipeline YAML nommé **payments-ci** génère le module à chaque push.

    Le responsable du développement veut un tableau de bord qui affiche :

    - un résumé des modifications récentes effectuées dans le dossier /src/payments ;
    - un histogramme des exécutions récentes de payments-ci, coloré selon le résultat.

    Quels sont les deux widgets à ajouter ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: Code Tile }
    - { id: b, text: Build History }
    - { id: c, text: Query Tile }
    - { id: d, text: Deployment status }
    - { id: e, text: Release Pipeline Overview }
answer: { optionIds: [ a, b ] }
explanation:
  correct:
    en: |
      Code Tile shows a summary tile for a repository, a Git branch or a folder path, so it can target /src/payments. Build History displays a histogram of the runs of a selected build pipeline, colored green, red or yellow according to the result.
    fr: |
      Code Tile affiche une vignette de résumé pour un dépôt, une branche Git ou un chemin de dossier ; il peut donc cibler /src/payments. Build History affiche un histogramme des exécutions d'un pipeline de build sélectionné, coloré en vert, rouge ou jaune selon le résultat.
  options:
    c: { en: "Query Tile shows the number of work items returned by a shared query, not code changes or builds.", fr: "Query Tile affiche le nombre d'éléments de travail renvoyés par une requête partagée, pas les modifications de code ni les builds." }
    d: { en: "Deployment status shows a matrix of deployments and test pass rates per environment, not a histogram of builds.", fr: "Deployment status affiche une matrice des déploiements et des taux de réussite des tests par environnement, pas un histogramme des builds." }
    e: { en: "Release Pipeline Overview shows the environments of a classic release pipeline, not the runs of a build pipeline.", fr: "Release Pipeline Overview affiche les environnements d'un pipeline de mise en production classique, pas les exécutions d'un pipeline de build." }
references:
  - title: Out Of Box widget catalog
    url: https://learn.microsoft.com/en-us/azure/devops/report/dashboards/widget-catalog
