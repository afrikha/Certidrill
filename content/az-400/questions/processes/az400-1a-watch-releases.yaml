id: az400-1a-watch-releases
objective: "1.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    The platform team at Litware consumes an internal library published from a GitHub repository named **litware/telemetry-lib**. The team members do not contribute to the repository.

    You need the team members to receive a GitHub notification each time a new release of the library is published, without receiving notifications for issues, pull requests or discussions.

    What should each team member configure on the repository?
  fr: |
    L'équipe plateforme de Litware consomme une bibliothèque interne publiée à partir d'un dépôt GitHub nommé **litware/telemetry-lib**. Les membres de l'équipe ne contribuent pas au dépôt.

    Les membres de l'équipe doivent recevoir une notification GitHub chaque fois qu'une nouvelle version (release) de la bibliothèque est publiée, sans recevoir de notifications pour les issues, les pull requests ou les discussions.

    Que doit configurer chaque membre de l'équipe sur le dépôt ?
body:
  options:
    - { id: a, text: { en: "Watch > All Activity", fr: "Watch > All Activity" } }
    - { id: b, text: { en: "Watch > Custom > Releases", fr: "Watch > Custom > Releases" } }
    - { id: c, text: { en: "Watch > Participating and @mentions", fr: "Watch > Participating and @mentions" } }
    - { id: d, text: { en: "Star the repository", fr: "Ajouter une étoile au dépôt (Star)" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      The Custom watch setting lets you choose the activity types that send notifications, such as issues, pull requests, releases, security alerts or discussions. Selecting only Releases notifies the team of each new release and of nothing else.
    fr: |
      Le paramètre de suivi Custom permet de choisir les types d'activité qui envoient des notifications, comme les issues, les pull requests, les releases, les alertes de sécurité ou les discussions. En sélectionnant uniquement Releases, l'équipe est avertie de chaque nouvelle version et de rien d'autre.
  options:
    a: { en: "Watching all activity also sends notifications for issues, pull requests and discussions.", fr: "Suivre toute l'activité envoie aussi des notifications pour les issues, les pull requests et les discussions." }
    c: { en: "This setting only notifies you about conversations you participate in or where you are @mentioned; a release does not qualify.", fr: "Ce paramètre ne notifie que les conversations auxquelles vous participez ou dans lesquelles vous êtes mentionné (@mention) ; une release n'en fait pas partie." }
    d: { en: "Starring bookmarks a repository and shows appreciation; it does not subscribe you to notifications.", fr: "Ajouter une étoile marque un dépôt comme favori ; cela n'abonne pas aux notifications." }
references:
  - title: GitHub platform management
    url: https://learn.microsoft.com/en-us/training/modules/introduction-to-github/5-platform-management
