id: az400-1a-issue-config-yml
objective: "1.1.2"
type: dropdown
difficulty: 2
status: draft
shuffle: true
stem:
  en: |
    Proseware hosts an open-source library in a GitHub repository. The repository already contains issue forms for bug reports and feature requests.

    You need to configure the issue template chooser so that:

    - contributors who have the Read or Triage role can only open issues by using the existing forms;
    - usage questions are redirected to the Proseware support portal.

    How should you complete the configuration file? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware héberge une bibliothèque open source dans un dépôt GitHub. Le dépôt contient déjà des formulaires d'issue pour les rapports de bogue et les demandes de fonctionnalité.

    Vous devez configurer le sélecteur de modèles d'issue pour que :

    - les contributeurs qui ont le rôle Read ou Triage ne puissent ouvrir des issues qu'avec les formulaires existants ;
    - les questions d'utilisation soient redirigées vers le portail de support de Proseware.

    Comment devez-vous compléter le fichier de configuration ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: yaml
  template: |
    # File path: [[path]]
    [[blank]]: false
    [[links]]:
      - name: Proseware support portal
        url: https://support.proseware.com
        about: Ask usage questions here.
  slots:
    - id: path
      options:
        - { id: tmpl, text: .github/ISSUE_TEMPLATE/config.yml }
        - { id: root, text: .github/config.yml }
        - { id: wf, text: .github/workflows/issues.yml }
        - { id: docs, text: docs/ISSUE_TEMPLATE.md }
    - id: blank
      options:
        - { id: enabled, text: blank_issues_enabled }
        - { id: allow, text: allow_blank_issues }
        - { id: forms, text: forms_only }
        - { id: tmpl, text: templates_required }
    - id: links
      options:
        - { id: contact, text: contact_links }
        - { id: ext, text: external_links }
        - { id: redir, text: redirects }
        - { id: support, text: support_links }
answer:
  values: { path: tmpl, blank: enabled, links: contact }
explanation:
  correct:
    en: |
      The template chooser is configured by a config.yml file in .github/ISSUE_TEMPLATE, which takes effect once it is merged into the default branch. Setting blank_issues_enabled to false hides the blank issue option from users with the Read or Triage role (users with Write, Maintain or Admin still see it, labeled for maintainers). Each contact_links entry has a name, a url and an about text and sends people to an external site.
    fr: "Le sélecteur de modèles se configure avec un fichier config.yml placé dans .github/ISSUE_TEMPLATE, qui prend effet une fois fusionné dans la branche par défaut. Avec blank_issues_enabled à false, l'option d'issue vierge est masquée pour les utilisateurs qui ont le rôle Read ou Triage (les utilisateurs Write, Maintain ou Admin la voient toujours, signalée comme réservée aux mainteneurs). Chaque entrée de contact_links comporte un name, une url et un texte about, et renvoie vers un site externe."
  options:
    root: { en: "The chooser only reads config.yml from the .github/ISSUE_TEMPLATE folder.", fr: "Le sélecteur ne lit config.yml que dans le dossier .github/ISSUE_TEMPLATE." }
    wf: { en: "The workflows folder contains GitHub Actions workflows, not issue template settings.", fr: "Le dossier workflows contient des workflows GitHub Actions, pas les paramètres des modèles d'issue." }
    allow: { en: "The supported key is blank_issues_enabled.", fr: "La clé prise en charge est blank_issues_enabled." }
    ext: { en: "External links are declared with the contact_links key.", fr: "Les liens externes se déclarent avec la clé contact_links." }
references:
  - title: GitHub is a collaborative platform
    url: https://learn.microsoft.com/en-us/training/modules/introduction-to-github/4-collaborative-platform
