id: az400-1a-delivery-plans
objective: "1.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Northwind Traders has two Azure DevOps projects: **Mobile**, which uses the Scrum process, and **Backend**, which uses the Agile process. Each project contains three teams, and every team plans its features in two-week sprints that have start and end dates.

    The program manager needs a single calendar view that shows the features of all six teams by sprint and the Predecessor and Successor links between them. The solution must minimize administrative effort.

    What should you use?
  fr: |
    Northwind Traders dispose de deux projets Azure DevOps : **Mobile**, qui utilise le processus Scrum, et **Backend**, qui utilise le processus Agile. Chaque projet contient trois équipes, et chaque équipe planifie ses fonctionnalités dans des sprints de deux semaines qui ont des dates de début et de fin.

    Le responsable de programme a besoin d'une vue calendaire unique qui affiche les fonctionnalités des six équipes par sprint ainsi que les liens Predecessor et Successor entre elles. La solution doit réduire au minimum l'effort d'administration.

    Que devez-vous utiliser ?
body:
  options:
    - { id: a, text: { en: "A delivery plan that includes the Features backlog of the six teams", fr: "Un plan de livraison (Delivery Plan) qui inclut le backlog Features des six équipes" } }
    - { id: b, text: { en: "A portfolio team in each project whose area path includes its three teams", fr: "Une équipe de portefeuille dans chaque projet dont le chemin de zone inclut ses trois équipes" } }
    - { id: c, text: { en: "A shared query of features in each project, pinned to a dashboard", fr: "Une requête partagée des fonctionnalités dans chaque projet, épinglée à un tableau de bord" } }
    - { id: d, text: { en: "A Velocity widget for each team on a single dashboard", fr: "Un widget Velocity par équipe sur un tableau de bord unique" } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      A delivery plan shows the backlogs of selected teams as rows on a calendar organized by sprint, and it can include teams from different projects, even when they use different processes. Work items linked by Predecessor or Successor links display dependency lines. A plan can show up to 20 team backlogs.
    fr: |
      Un plan de livraison affiche les backlogs des équipes sélectionnées sous forme de lignes sur un calendrier organisé par sprint, et il peut inclure des équipes de projets différents, même s'ils utilisent des processus différents. Les éléments de travail reliés par des liens Predecessor ou Successor affichent des lignes de dépendance. Un plan peut afficher jusqu'à 20 backlogs d'équipe.
  options:
    b: { en: "A portfolio team only rolls up the teams of its own project, so you would still have two views and no calendar.", fr: "Une équipe de portefeuille ne regroupe que les équipes de son propre projet : vous auriez toujours deux vues, et aucun calendrier." }
    c: { en: "Query charts show counts and lists, not a sprint calendar with dependency lines, and they require one query per project.", fr: "Les graphiques de requête affichent des nombres et des listes, pas un calendrier de sprints avec des lignes de dépendance, et ils exigent une requête par projet." }
    d: { en: "The Velocity widget shows completed work per sprint for one team; it does not schedule features on a calendar.", fr: "Le widget Velocity affiche le travail terminé par sprint pour une équipe ; il ne planifie pas les fonctionnalités sur un calendrier." }
references:
  - title: Use team delivery plans in Azure Boards
    url: https://learn.microsoft.com/en-us/azure/devops/boards/plans/review-team-plans
