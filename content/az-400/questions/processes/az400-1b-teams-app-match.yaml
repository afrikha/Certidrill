id: az400-1b-teams-app-match
objective: "1.3.6"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Contoso, Ltd. uses Microsoft Teams, Azure DevOps Services and GitHub. Some product teams store their code in Azure Repos, and others in GitHub. You need to bring development activity into the Teams channel of each team.

    Which Teams app should you use for each requirement? To answer, drag the appropriate apps to the correct requirements. Each app may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso, Ltd. utilise Microsoft Teams, Azure DevOps Services et GitHub. Certaines équipes produit stockent leur code dans Azure Repos, d'autres dans GitHub. Vous devez faire remonter l'activité de développement dans le canal Teams de chaque équipe.

    Quelle application Teams devez-vous utiliser pour chaque exigence ? Pour répondre, faites glisser les applications appropriées vers les exigences correspondantes. Chaque application peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: boards, text: Azure Boards }
    - { id: repos, text: Azure Repos }
    - { id: pipelines, text: Azure Pipelines }
    - { id: devops, text: Azure DevOps }
    - { id: github, text: GitHub }
  targets:
    - id: t1
      text: { en: "Turn a message of the channel into a bug in an Azure DevOps project", fr: "Transformer un message du canal en bogue dans un projet Azure DevOps" }
    - id: t2
      text: { en: "Notify the channel when a pull request is created in an Azure Repos Git repository", fr: "Avertir le canal quand une pull request est créée dans un dépôt Git Azure Repos" }
    - id: t3
      text: { en: "Display a project dashboard in a tab of the channel", fr: "Afficher un tableau de bord de projet dans un onglet du canal" }
    - id: t4
      text: { en: "Notify the channel when a pull request is opened in a GitHub repository", fr: "Avertir le canal quand une pull request est ouverte dans un dépôt GitHub" }
answer:
  mapping: { t1: boards, t2: repos, t3: devops, t4: github }
explanation:
  correct:
    en: "The Azure Boards app creates work items, including from a message action on a channel message. The Azure Repos app subscribes a channel to commits and pull requests of Azure Repos repositories, but it doesn't support GitHub repositories. The Azure DevOps app adds a dashboard or a Kanban board as a tab. The GitHub app (`@github subscribe owner/repo`) sends notifications for issues, pull requests, commits and releases of GitHub repositories. The Azure Pipelines app covers builds, releases and approvals."
    fr: "L'application Azure Boards crée des éléments de travail, y compris par une action sur un message du canal. L'application Azure Repos abonne un canal aux commits et aux pull requests des dépôts Azure Repos, mais elle ne prend pas en charge les dépôts GitHub. L'application Azure DevOps ajoute un tableau de bord ou un tableau Kanban sous forme d'onglet. L'application GitHub (`@github subscribe owner/repo`) envoie des notifications pour les problèmes (issues), pull requests, commits et versions des dépôts GitHub. L'application Azure Pipelines couvre les builds, les mises en production et les approbations."
references:
  - title: Azure DevOps integration with Microsoft Teams
    url: https://learn.microsoft.com/en-us/azure/devops/service-hooks/services/teams
  - title: Integrate GitHub and Azure DevOps with Microsoft Teams
    url: https://learn.microsoft.com/en-us/training/modules/share-knowledge-within-teams/4-integrate-github-azure-devops-microsoft-teams
