id: az400-1b-hook-events-hotarea
objective: "1.3.4"
type: hotarea
difficulty: 2
status: draft
stem:
  en: |
    Litware, Inc. uses YAML pipelines and Azure Repos Git repositories in an Azure DevOps project. You are creating service hook subscriptions that use the Web Hooks service. The following table shows some of the events that you can select.

    Answer each prompt by selecting the event that you should use.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware, Inc. utilise des pipelines YAML et des dépôts Git Azure Repos dans un projet Azure DevOps. Vous créez des abonnements de hook de service qui utilisent le service Web Hooks. Le tableau suivant présente certains des événements que vous pouvez sélectionner.

    Répondez à chaque consigne en sélectionnant l'événement à utiliser.

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
    - id: p1
      text: { en: "Notify the change management system each time a stage of a YAML pipeline waits for an approval", fr: "Avertir le système de gestion des changements chaque fois qu'une phase d'un pipeline YAML attend une approbation" }
    - id: p2
      text: { en: "Start an external static analysis job each time commits are pushed to a Git repository", fr: "Démarrer une tâche externe d'analyse statique chaque fois que des commits sont poussés dans un dépôt Git" }
  grid:
    header: [{ en: "Category", fr: "Catégorie" }, { en: "Event", fr: "Événement" }]
    rows:
      - [{ text: Build and release }, { text: Build completed, area: build }]
      - [{ text: Pipeline }, { text: Run state changed, area: run }]
      - [{ text: Pipeline }, { text: Run stage state changed, area: stage }]
      - [{ text: Pipeline }, { text: Run stage waiting for approval, area: approval }]
      - [{ text: Code }, { text: Code pushed, area: push }]
      - [{ text: Code }, { text: Pull request created, area: prcreated }]
      - [{ text: Code }, { text: Pull request merge attempted, area: prmerge }]
answer:
  values: { p1: approval, p2: push }
explanation:
  correct:
    en: "Run stage waiting for approval (ms.vss-pipelinechecks-events.approval-pending) fires when a stage of a YAML pipeline run waits for an approval, which is more precise than Run stage state changed, which fires for every state change of a stage. Code pushed (git.push) fires for every push to a Git repository, whereas the pull request events fire only for pull requests."
    fr: "Run stage waiting for approval (ms.vss-pipelinechecks-events.approval-pending) se déclenche quand une phase d'une exécution de pipeline YAML attend une approbation, ce qui est plus précis que Run stage state changed, qui se déclenche à chaque changement d'état d'une phase. Code pushed (git.push) se déclenche pour chaque push dans un dépôt Git, alors que les événements de pull request ne se déclenchent que pour les pull requests."
references:
  - title: Service hook events
    url: https://learn.microsoft.com/en-us/azure/devops/service-hooks/events
