id: az400-1a-gh-projects-workflows
objective: "1.1.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Litware creates a new GitHub project to track the work of the repository **litware/checkout**. The built-in workflows that are enabled by default are left unchanged.

    You need to meet the following requirements by using the project's built-in workflows only:

    - Every new issue labeled `bug` in litware/checkout must appear in the project without manual action.
    - Closed items that have not been updated for 30 days must be removed from the project views.

    Which two workflows should you turn on? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware crée un nouveau projet GitHub pour suivre le travail du dépôt **litware/checkout**. Les workflows intégrés activés par défaut restent inchangés.

    Vous devez satisfaire les exigences suivantes en utilisant uniquement les workflows intégrés du projet :

    - Chaque nouvelle issue portant l'étiquette `bug` dans litware/checkout doit apparaître dans le projet sans action manuelle.
    - Les éléments fermés qui n'ont pas été mis à jour depuis 30 jours doivent être retirés des vues du projet.

    Quels sont les deux workflows à activer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Auto-add to project, with a filter on the bug label", fr: "Auto-add to project, avec un filtre sur l'étiquette bug" } }
    - { id: b, text: { en: "Auto-archive items, with a filter on closed items not updated for 30 days", fr: "Auto-archive items, avec un filtre sur les éléments fermés non mis à jour depuis 30 jours" } }
    - { id: c, text: { en: "Item closed, which sets the status to Done", fr: "Item closed, qui définit le statut sur Done" } }
    - { id: d, text: { en: "Pull request merged, which sets the status to Done", fr: "Pull request merged, qui définit le statut sur Done" } }
    - { id: e, text: { en: "Item added to project, which sets the status to Todo", fr: "Item added to project, qui définit le statut sur Todo" } }
answer: { optionIds: [ a, b ] }
explanation:
  correct:
    en: |
      The auto-add workflow adds the items of a repository that match a filter (here the bug label) to the project as they are created or updated. The auto-archive workflow archives the items that match its criteria, such as closed items not updated for a given period, which removes them from the views while keeping them in the archive.
    fr: |
      Le workflow d'ajout automatique ajoute au projet les éléments d'un dépôt qui correspondent à un filtre (ici l'étiquette bug) dès qu'ils sont créés ou mis à jour. Le workflow d'archivage automatique archive les éléments qui correspondent à ses critères, comme les éléments fermés non mis à jour depuis une période donnée, ce qui les retire des vues tout en les conservant dans l'archive.
  options:
    c: { en: "Item closed only changes the status of items already in the project; it is also one of the two workflows enabled by default.", fr: "Item closed ne fait que changer le statut d'éléments déjà présents dans le projet ; c'est aussi l'un des deux workflows activés par défaut." }
    d: { en: "Pull request merged only changes the status of a pull request already in the project; it is enabled by default.", fr: "Pull request merged ne fait que changer le statut d'une pull request déjà présente dans le projet ; il est activé par défaut." }
    e: { en: "This workflow sets the status of items once they are in the project; it does not add issues from the repository.", fr: "Ce workflow définit le statut des éléments une fois qu'ils sont dans le projet ; il n'ajoute pas les issues du dépôt." }
references:
  - title: How to organize your project
    url: https://learn.microsoft.com/en-us/training/modules/manage-work-github-projects/4-how-to-organize-your-project
