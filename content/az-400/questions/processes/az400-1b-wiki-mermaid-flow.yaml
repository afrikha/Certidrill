id: az400-1b-wiki-mermaid-flow
objective: "1.3.1"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    Northwind Traders documents its release process in the project wiki of an Azure DevOps Services project. You are writing a page that must meet the following requirements:

    - The top of the page shows a table of contents of the headings of the page.
    - The page contains a flowchart that goes from left to right and renders in the wiki.

    How should you complete the Markdown of the page? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind Traders documente son processus de mise en production dans le wiki de projet d'un projet Azure DevOps Services. Vous rédigez une page qui doit répondre aux exigences suivantes :

    - Le haut de la page affiche une table des matières des titres de la page.
    - La page contient un organigramme qui se lit de gauche à droite et qui s'affiche dans le wiki.

    Comment devez-vous compléter le code Markdown de la page ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: text
  template: |
    [[toc]]

    ## Release flow

    [[open]]
    [[kind]]
        A[Pull request] --> B{Build passes?}
        B -- Yes --> C[Deploy to staging]
        B -- No --> D[Fix and push]
    :::
  slots:
    - id: toc
      options:
        - { id: tosp, text: "[[_TOSP_]]" }
        - { id: lower, text: "[[_toc_]]" }
        - { id: upper, text: "[[_TOC_]]" }
        - { id: braces, text: "{{TOC}}" }
    - id: open
      options:
        - { id: colon, text: "::: mermaid" }
        - { id: fence, text: "```mermaid" }
        - { id: diagram, text: "::: diagram" }
        - { id: video, text: "::: video" }
    - id: kind
      options:
        - { id: graph, text: graph LR }
        - { id: flowchart, text: flowchart LR }
        - { id: seq, text: sequenceDiagram }
        - { id: graphtd, text: graph TD }
answer:
  values: { toc: upper, open: colon, kind: graph }
explanation:
  correct:
    en: "`[[_TOC_]]` inserts a table of contents built from the headings of the page; the tag is case-sensitive. The block closes with `:::`, so it must open with `::: mermaid`. Azure DevOps supports only part of the Mermaid syntax: it doesn't support the `flowchart` keyword, so a left-to-right flowchart uses `graph LR`."
    fr: "`[[_TOC_]]` insère une table des matières construite à partir des titres de la page ; la balise respecte la casse. Le bloc se ferme par `:::`, il doit donc s'ouvrir par `::: mermaid`. Azure DevOps ne prend en charge qu'une partie de la syntaxe Mermaid : le mot clé `flowchart` n'est pas pris en charge, un organigramme de gauche à droite utilise donc `graph LR`."
  options:
    tosp: { en: "[[_TOSP_]] lists the subpages of the page, not its headings.", fr: "[[_TOSP_]] liste les sous-pages de la page, pas ses titres." }
    lower: { en: "The tag is case-sensitive: [[_toc_]] might not render.", fr: "La balise respecte la casse : [[_toc_]] peut ne pas s'afficher." }
    braces: { en: "{{TOC}} isn't an Azure DevOps wiki tag.", fr: "{{TOC}} n'est pas une balise du wiki Azure DevOps." }
    fence: { en: "A fenced Mermaid block is also supported, but it must close with three backticks, not with `:::`.", fr: "Un bloc Mermaid délimité par des accents graves est aussi pris en charge, mais il doit se fermer par trois accents graves, pas par `:::`." }
    diagram: { en: "`::: diagram` isn't a wiki container; diagrams use `::: mermaid`.", fr: "`::: diagram` n'est pas un conteneur du wiki ; les diagrammes utilisent `::: mermaid`." }
    video: { en: "`::: video` embeds a video in an iframe; it doesn't render a diagram.", fr: "`::: video` incorpore une vidéo dans un iframe ; il n'affiche pas de diagramme." }
    flowchart: { en: "The flowchart keyword isn't supported by the Azure DevOps wiki; use graph instead.", fr: "Le mot clé flowchart n'est pas pris en charge par le wiki Azure DevOps ; utilisez graph à la place." }
    seq: { en: "sequenceDiagram draws a sequence diagram, not a flowchart.", fr: "sequenceDiagram dessine un diagramme de séquence, pas un organigramme." }
    graphtd: { en: "TD draws the flowchart from top to bottom, not from left to right.", fr: "TD dessine l'organigramme de haut en bas, pas de gauche à droite." }
references:
  - title: Use Markdown in Azure DevOps
    url: https://learn.microsoft.com/en-us/azure/devops/project/wiki/wiki-markdown-guidance
