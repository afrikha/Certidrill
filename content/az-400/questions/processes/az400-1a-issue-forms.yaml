id: az400-1a-issue-forms
objective: "1.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Adatum maintains a public GitHub repository named **sdk-dotnet**. Many bug reports arrive without the SDK version or the steps to reproduce the problem, which slows down triage.

    You need to ensure that contributors who report a bug must fill in a version field selected from a list and a reproduction steps field before they can submit the issue.

    What should you do?
  fr: |
    Adatum gère un dépôt GitHub public nommé **sdk-dotnet**. De nombreux rapports de bogue arrivent sans la version du SDK ni les étapes pour reproduire le problème, ce qui ralentit le tri.

    Vous devez faire en sorte que les contributeurs qui signalent un bogue soient obligés de renseigner un champ de version choisi dans une liste et un champ d'étapes de reproduction avant de pouvoir soumettre le problème (issue).

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Add a CONTRIBUTING.md file that lists the required information on the default branch.", fr: "Ajouter sur la branche par défaut un fichier CONTRIBUTING.md qui liste les informations requises." }
    - id: b
      text: { en: "Add a Markdown issue template to .github/ISSUE_TEMPLATE on the default branch.", fr: "Ajouter un modèle d'issue Markdown dans .github/ISSUE_TEMPLATE sur la branche par défaut." }
    - id: c
      text: { en: "Add a pull request template to .github/pull_request_template.md on the default branch.", fr: "Ajouter un modèle de pull request dans .github/pull_request_template.md sur la branche par défaut." }
    - id: d
      text: { en: "Add a YAML issue form to .github/ISSUE_TEMPLATE on the default branch.", fr: "Ajouter un formulaire d'issue YAML dans .github/ISSUE_TEMPLATE sur la branche par défaut." }
answer: { optionId: d }
explanation:
  correct:
    en: |
      An issue form is a YAML file in .github/ISSUE_TEMPLATE that renders a web form with inputs, text areas, drop-downs and checkboxes, and each field can be marked as required. Like every issue template, it becomes available once it is committed to the default branch.
    fr: |
      Un formulaire d'issue est un fichier YAML placé dans .github/ISSUE_TEMPLATE qui affiche un formulaire web avec des champs de saisie, des zones de texte, des listes déroulantes et des cases à cocher, chaque champ pouvant être marqué comme obligatoire. Comme tout modèle d'issue, il devient disponible une fois commité sur la branche par défaut.
  options:
    b: { en: "A Markdown template only prefills the issue body; contributors can delete the text and submit the issue without the information.", fr: "Un modèle Markdown ne fait que préremplir le corps de l'issue ; les contributeurs peuvent effacer le texte et soumettre l'issue sans les informations." }
    c: { en: "A pull request template applies to pull requests, not to bug reports opened as issues.", fr: "Un modèle de pull request s'applique aux pull requests, pas aux rapports de bogue ouverts sous forme d'issues." }
    a: { en: "Contributing guidelines are only displayed as a link; they cannot make a field mandatory.", fr: "Les recommandations de contribution ne sont affichées que sous forme de lien ; elles ne peuvent pas rendre un champ obligatoire." }
references:
  - title: GitHub is a collaborative platform
    url: https://learn.microsoft.com/en-us/training/modules/introduction-to-github/4-collaborative-platform
