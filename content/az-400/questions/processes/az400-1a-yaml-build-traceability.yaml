id: az400-1a-yaml-build-traceability
objective: "1.1.4"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    Adatum builds a service by using a YAML pipeline in Azure Pipelines. The code is in an Azure Repos Git repository, and developers link their commits to work items by using `#ID` mentions.

    You need to meet the following requirements:

    - Each work item must show the successful builds that include its commits.
    - When a run of the pipeline fails, a Bug work item must be created automatically.

    Which two actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum génère un service avec un pipeline YAML dans Azure Pipelines. Le code se trouve dans un dépôt Git Azure Repos, et les développeurs lient leurs commits à des éléments de travail avec des mentions `#ID`.

    Vous devez satisfaire les exigences suivantes :

    - Chaque élément de travail doit afficher les builds réussies qui incluent ses commits.
    - Lorsqu'une exécution du pipeline échoue, un élément de travail Bug doit être créé automatiquement.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text: { en: "In the pipeline settings, turn on Automatically link new work in this build.", fr: "Dans les paramètres du pipeline, activer Automatically link new work in this build." }
    - id: b
      text: { en: "In the pipeline settings, turn on Create work item on failure and select the Bug type.", fr: "Dans les paramètres du pipeline, activer Create work item on failure et sélectionner le type Bug." }
    - id: c
      text: { en: "Add a step that runs az boards work-item create with the condition failed().", fr: "Ajouter une étape qui exécute az boards work-item create avec la condition failed()." }
    - id: d
      text: { en: "In the repository settings, turn on Commit mention work item resolution.", fr: "Dans les paramètres du dépôt, activer Commit mention work item resolution." }
    - id: e
      text: { en: "In the release pipeline options, turn on Report release status to Boards.", fr: "Dans les options du pipeline de mise en production, activer Report release status to Boards." }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |
      The Automatically link new work in this build setting of a YAML pipeline adds Integrated in build links to the work items associated with the commits of each successful build, and they appear in the Development section of the work item. YAML pipelines have no built-in option to create a work item on failure, so you add a step that calls the Azure CLI (or the REST API) and runs only when a previous step failed.
    fr: |
      Le paramètre Automatically link new work in this build d'un pipeline YAML ajoute des liens Integrated in build aux éléments de travail associés aux commits de chaque build réussie, et ces liens apparaissent dans la section Development de l'élément de travail. Les pipelines YAML n'ont pas d'option intégrée pour créer un élément de travail en cas d'échec : vous ajoutez donc une étape qui appelle Azure CLI (ou l'API REST) et ne s'exécute que si une étape précédente a échoué.
  options:
    b: { en: "Create work item on failure is a build option of classic pipelines only; YAML pipelines do not offer it.", fr: "Create work item on failure est une option de build des pipelines classiques uniquement ; les pipelines YAML ne la proposent pas." }
    d: { en: "This setting lets mentions such as Fixes #123 change the state of work items; it neither shows builds nor creates bugs.", fr: "Ce paramètre permet à des mentions comme Fixes #123 de changer l'état des éléments de travail ; il n'affiche pas les builds et ne crée pas de bogues." }
    e: { en: "Report release status to Boards applies to classic release pipelines and shows deployments, not builds.", fr: "Report release status to Boards s'applique aux pipelines de mise en production classiques et affiche les déploiements, pas les builds." }
references:
  - title: Configure pipelines to support work tracking
    url: https://learn.microsoft.com/en-us/azure/devops/pipelines/integrations/configure-pipelines-work-tracking
