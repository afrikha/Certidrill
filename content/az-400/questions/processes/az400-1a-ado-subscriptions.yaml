id: az400-1a-ado-subscriptions
objective: "1.1.2"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Northwind Traders uses an Azure DevOps organization. The project **Logistics** contains a team named **Routing**. Megan is a Team Administrator of Routing. Omar is a member of the Contributors group of the project and holds no administrative role.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind Traders utilise une organisation Azure DevOps. Le projet **Logistics** contient une équipe nommée **Routing**. Megan est Team Administrator de Routing. Omar est membre du groupe Contributors du projet et n'a aucun rôle d'administration.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          Megan can create a team subscription that notifies the Routing team when a build fails.
        fr: |
          Megan peut créer un abonnement d'équipe qui avertit l'équipe Routing lorsqu'une build échoue.
    - id: s2
      text:
        en: |
          Omar can opt out of a default subscription without affecting the other members of the Routing team.
        fr: |
          Omar peut se désabonner d'un abonnement par défaut sans affecter les autres membres de l'équipe Routing.
    - id: s3
      text:
        en: |
          Omar can create a project-level subscription that sends email to every member of the Logistics project.
        fr: |
          Omar peut créer un abonnement au niveau du projet qui envoie un e-mail à tous les membres du projet Logistics.
answer:
  values: { s1: true, s2: true, s3: false }
explanation:
  correct:
    en: |
      Team subscriptions can be managed by Team Administrators, Project Administrators or Project Collection Administrators, and the Build category is available to them. Any user can opt out of a default, team or project subscription for themselves while the other members stay subscribed. Project-level subscriptions require Project Administrators or Project Collection Administrators; a Contributor can only manage personal subscriptions.
    fr: |
      Les abonnements d'équipe peuvent être gérés par les Team Administrators, les Project Administrators ou les Project Collection Administrators, et la catégorie Build leur est disponible. Tout utilisateur peut se désabonner pour lui-même d'un abonnement par défaut, d'équipe ou de projet, les autres membres restant abonnés. Les abonnements au niveau du projet nécessitent les Project Administrators ou les Project Collection Administrators ; un Contributor ne peut gérer que ses abonnements personnels.
references:
  - title: About notifications
    url: https://learn.microsoft.com/en-us/azure/devops/organizations/notifications/about-notifications
