id: az400-1b-dlv-metrics-match
objective: "1.2.6"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Adatum Corporation is designing an Azure DevOps dashboard that tracks how the team delivers software to production. The release manager lists three questions that the dashboard must answer.

    Which metric should you display for each question? To answer, drag the appropriate metrics to the correct questions. Each metric may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum Corporation conçoit un tableau de bord Azure DevOps qui suit la façon dont l'équipe livre les logiciels en production. Le responsable des mises en production liste trois questions auxquelles le tableau de bord doit répondre.

    Quelle métrique devez-vous afficher pour chaque question ? Pour répondre, faites glisser les métriques appropriées vers les questions correspondantes. Chaque métrique peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: freq, text: { en: "Release deployment frequency", fr: "Fréquence des déploiements de mise en production" } }
    - { id: lead, text: { en: "Deployment lead time", fr: "Délai de déploiement" } }
    - { id: success, text: { en: "Deployment success rate", fr: "Taux de réussite des déploiements" } }
    - { id: build, text: { en: "Build duration", fr: "Durée de build" } }
    - { id: cycle, text: { en: "Cycle time", fr: "Durée de cycle" } }
    - { id: velocity, text: { en: "Velocity", fr: "Vélocité" } }
  targets:
    - id: t1
      text: { en: "How often does a new version reach production?", fr: "À quelle fréquence une nouvelle version arrive-t-elle en production ?" }
    - id: t2
      text: { en: "How much time passes between a commit and its deployment to production?", fr: "Combien de temps s'écoule entre un commit et son déploiement en production ?" }
    - id: t3
      text: { en: "Which percentage of the deployments to production complete without failing?", fr: "Quel pourcentage des déploiements en production se termine sans échec ?" }
answer:
  mapping: { t1: freq, t2: lead, t3: success }
explanation:
  correct:
    en: Release deployment frequency counts how often deployments happen, deployment lead time measures the time from a commit to production, and deployment success rate is the share of deployments that succeed. Build duration only covers the build, cycle time measures work items from the start of the work to completion, and velocity is the amount of work completed per sprint.
    fr: La fréquence des déploiements compte la fréquence à laquelle les déploiements ont lieu, le délai de déploiement mesure le temps entre un commit et la production, et le taux de réussite des déploiements est la part des déploiements qui réussissent. La durée de build ne couvre que le build, la durée de cycle mesure les éléments de travail du début du travail jusqu'à leur achèvement, et la vélocité est la quantité de travail terminée par sprint.
references:
  - title: Design and Implement Metrics and Queries
    url: https://learn.microsoft.com/en-us/training/modules/implement-tools-track-usage-flow/8-design-implement-metrics-queries
