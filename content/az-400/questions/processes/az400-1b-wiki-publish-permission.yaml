id: az400-1b-wiki-publish-permission
objective: "1.3.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Adatum Corporation has an Azure DevOps project named **Platform** that already has a project wiki. A user named User1 has Basic access and is a member of the Contributors group of Platform. User1 adds and edits pages of the project wiki without any issue.

    User1 must publish the **/runbooks** folder of an existing Git repository of Platform as a second wiki. The solution must follow the principle of least privilege.

    What should you grant to User1?
  fr: |
    Adatum Corporation dispose d'un projet Azure DevOps nommé **Platform** qui possède déjà un wiki de projet. Un utilisateur nommé User1 dispose de l'accès Basic et est membre du groupe Contributors de Platform. User1 ajoute et modifie des pages du wiki de projet sans difficulté.

    User1 doit publier le dossier **/runbooks** d'un dépôt Git existant de Platform en tant que second wiki. La solution doit respecter le principe du moindre privilège.

    Que devez-vous accorder à User1 ?
body:
  options:
    - id: a
      text: { en: "The Create Repository permission for the Git repositories of Platform", fr: "L'autorisation Create Repository sur les dépôts Git de Platform" }
    - id: b
      text: { en: "Membership in the Project Administrators group of Platform", fr: "L'appartenance au groupe Project Administrators de Platform" }
    - id: c
      text: { en: "The Basic + Test Plans access level", fr: "Le niveau d'accès Basic + Test Plans" }
    - id: d
      text: { en: "The Contribute permission on the repository that contains /runbooks", fr: "L'autorisation Contribute sur le dépôt qui contient /runbooks" }
answer: { optionId: a }
explanation:
  correct:
    en: Publishing code as a wiki requires the Create Repository permission, which members of the Project Administrators group have by default. Granting this single permission is enough; adding and editing pages only requires membership in the Contributors group, which User1 already has.
    fr: La publication de code en tant que wiki exige l'autorisation Create Repository, que les membres du groupe Project Administrators possèdent par défaut. Accorder cette seule autorisation suffit ; ajouter et modifier des pages exige seulement l'appartenance au groupe Contributors, dont User1 est déjà membre.
  options:
    b:
      en: Project Administrators has the permission, but the group grants far more than the task requires.
      fr: Le groupe Project Administrators possède l'autorisation, mais il accorde bien plus que ce que la tâche exige.
    c:
      en: An access level controls which features a user can use, not repository permissions; Basic is already enough for wikis.
      fr: Un niveau d'accès contrôle les fonctionnalités utilisables, pas les autorisations sur les dépôts ; Basic suffit déjà pour les wikis.
    d:
      en: As a contributor, User1 can already push to the repository; publishing a wiki needs the Create Repository permission.
      fr: En tant que contributeur, User1 peut déjà pousser dans le dépôt ; la publication d'un wiki exige l'autorisation Create Repository.
references:
  - title: Create a wiki for your project
    url: https://learn.microsoft.com/en-us/azure/devops/project/wiki/wiki-create-repo
