id: az400-1b-ops-kql-p95
objective: "1.2.7"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam, Inc. sends the telemetry of a web app to a workspace-based Application Insights resource. The site reliability team defines a service level objective: for each operation of the app, 95 percent of the incoming requests must complete in less than 800 milliseconds.

    You need a Log Analytics query that returns, for each operation, the value to compare with the objective over the last hour.

    Which query should you use?
  fr: |
    Fabrikam, Inc. envoie la télémétrie d'une application web à une ressource Application Insights basée sur un espace de travail. L'équipe d'ingénierie de fiabilité de site définit un objectif de niveau de service : pour chaque opération de l'application, 95 % des requêtes entrantes doivent se terminer en moins de 800 millisecondes.

    Vous avez besoin d'une requête Log Analytics qui renvoie, pour chaque opération, la valeur à comparer à l'objectif sur la dernière heure.

    Quelle requête devez-vous utiliser ?
body:
  options:
    - id: a
      text: "AppRequests | where TimeGenerated > ago(1h) | summarize percentile(DurationMs, 95) by Name"
    - id: b
      text: "AppRequests | where TimeGenerated > ago(1h) | summarize percentile(DurationMs, 95) by bin(TimeGenerated, 1h)"
    - id: c
      text: "AppDependencies | where TimeGenerated > ago(1h) | summarize percentile(DurationMs, 95) by Name"
    - id: d
      text: "AppRequests | where TimeGenerated > ago(1h) | summarize avg(DurationMs) by Name"
answer: { optionId: a }
explanation:
  correct:
    en: The objective is a 95th percentile per operation, so the query computes `percentile(DurationMs, 95)` on the incoming requests of `AppRequests`, grouped by the request name. If the value of an operation is below 800 ms, at least 95 percent of its requests met the objective.
    fr: "L'objectif est un 95e centile par opération : la requête calcule `percentile(DurationMs, 95)` sur les requêtes entrantes de `AppRequests`, regroupées par nom de requête. Si la valeur d'une opération est inférieure à 800 ms, au moins 95 % de ses requêtes ont respecté l'objectif."
  options:
    d:
      en: An average can stay below 800 ms while far more than 5 percent of the requests are slower.
      fr: Une moyenne peut rester sous 800 ms alors que bien plus de 5 % des requêtes sont plus lentes.
    b:
      en: Grouping by time returns one percentile for all the operations together, not one value per operation.
      fr: Regrouper par période renvoie un seul centile pour l'ensemble des opérations, pas une valeur par opération.
    c:
      en: AppDependencies measures the outgoing calls of the app, not the duration of the requests it serves.
      fr: AppDependencies mesure les appels sortants de l'application, pas la durée des requêtes qu'elle sert.
references:
  - title: AppRequests
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/reference/tables/apprequests
