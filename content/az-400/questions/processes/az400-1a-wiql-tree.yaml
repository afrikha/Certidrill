id: az400-1a-wiql-tree
objective: "1.2.2"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    The Mobile project at Tailspin Toys uses the Scrum process. For sprint planning, you need a WIQL query that returns every product backlog item of the project together with all its descendants at every level of the parent-child hierarchy, excluding the descendants in the Done state.

    How should you complete the query? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Le projet Mobile de Tailspin Toys utilise le processus Scrum. Pour la planification des sprints, vous avez besoin d'une requête WIQL qui renvoie chaque élément du backlog de produit du projet avec tous ses descendants, à tous les niveaux de la hiérarchie parent-enfant, en excluant les descendants à l'état Done.

    Comment devez-vous compléter la requête ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: sql
  template: |
    SELECT [System.Id], [System.Title], [System.State]
    FROM [[from]]
    WHERE
        ([Source].[System.TeamProject] = @project
         AND [Source].[System.WorkItemType] = 'Product Backlog Item')
        AND ([System.Links.LinkType] = '[[link]]')
        AND ([Target].[System.TeamProject] = @project
         AND [Target].[System.State] <> 'Done')
    MODE ([[mode]])
  slots:
    - id: from
      options:
        - { id: links, text: workitemLinks }
        - { id: items, text: workitems }
        - { id: tree, text: workitemTree }
        - { id: rel, text: workitemRelations }
    - id: link
      options:
        - { id: fwd, text: System.LinkTypes.Hierarchy-Forward }
        - { id: rev, text: System.LinkTypes.Hierarchy-Reverse }
        - { id: dep, text: System.LinkTypes.Dependency-Forward }
        - { id: rel, text: System.LinkTypes.Related-Forward }
    - id: mode
      options:
        - { id: rec, text: Recursive }
        - { id: must, text: MustContain }
        - { id: may, text: MayContain }
        - { id: not, text: DoesNotContain }
answer:
  values: { from: links, link: fwd, mode: rec }
explanation:
  correct:
    en: |
      Queries on links between work items select FROM workitemLinks and filter on [Source], [Target] and [System.Links.LinkType]. A tree query uses the forward direction of the tree topology, System.LinkTypes.Hierarchy-Forward (parent to child), with MODE (Recursive) to return descendants at every level. ORDER BY and ASOF cannot be used in tree queries.
    fr: |
      Les requêtes sur les liens entre éléments de travail utilisent FROM workitemLinks et filtrent sur [Source], [Target] et [System.Links.LinkType]. Une requête d'arborescence utilise le sens direct de la topologie arborescente, System.LinkTypes.Hierarchy-Forward (du parent vers l'enfant), avec MODE (Recursive) pour renvoyer les descendants à tous les niveaux. ORDER BY et ASOF ne peuvent pas être utilisés dans les requêtes d'arborescence.
  options:
    items: { en: "FROM workitems returns a flat list and cannot use [Source], [Target] or link types.", fr: "FROM workitems renvoie une liste plate et ne peut pas utiliser [Source], [Target] ni les types de liens." }
    rev: { en: "Recursive mode requires the forward direction of a tree link type; Hierarchy-Reverse points from child to parent.", fr: "Le mode Recursive exige le sens direct d'un type de lien arborescent ; Hierarchy-Reverse va de l'enfant vers le parent." }
    dep: { en: "Dependency links are not parent-child links, and Recursive mode only works with a tree topology.", fr: "Les liens de dépendance ne sont pas des liens parent-enfant, et le mode Recursive ne fonctionne qu'avec une topologie arborescente." }
    must: { en: "MustContain is the default mode for direct-link queries; it returns one level of links, not the whole hierarchy.", fr: "MustContain est le mode par défaut des requêtes de liens directs ; il renvoie un seul niveau de liens, pas toute la hiérarchie." }
references:
  - title: Work Item Query Language (WIQL) syntax reference
    url: https://learn.microsoft.com/en-us/azure/devops/boards/queries/wiql-syntax
