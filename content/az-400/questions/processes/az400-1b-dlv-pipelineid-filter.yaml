id: az400-1b-dlv-pipelineid-filter
objective: "1.2.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Litware, Inc. has a Power BI report that shows the outcome of the runs of an Azure DevOps pipeline. The report uses the following Analytics OData query.

    ```text
    https://analytics.dev.azure.com/litware/retail/_odata/v3.0-preview/PipelineRuns?$apply=filter(Pipeline/PipelineName eq 'retail-ci' and CompletedDate ge 2026-10-01Z)/aggregate($count as TotalCount, FailedCount with sum as FailedCount)
    ```

    The pipeline has the ID 42. The team plans to rename the pipeline several times as the product changes.

    You need to ensure that the report keeps returning the runs of this pipeline, and only this pipeline, after each rename.

    What should you do?
  fr: |
    Litware, Inc. dispose d'un rapport Power BI qui affiche le résultat des exécutions d'un pipeline Azure DevOps. Le rapport utilise la requête OData d'Analytics suivante.

    ```text
    https://analytics.dev.azure.com/litware/retail/_odata/v3.0-preview/PipelineRuns?$apply=filter(Pipeline/PipelineName eq 'retail-ci' and CompletedDate ge 2026-10-01Z)/aggregate($count as TotalCount, FailedCount with sum as FailedCount)
    ```

    Le pipeline a l'ID 42. L'équipe prévoit de renommer le pipeline plusieurs fois au fil de l'évolution du produit.

    Vous devez vous assurer que le rapport continue de renvoyer les exécutions de ce pipeline, et uniquement de ce pipeline, après chaque changement de nom.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Replace the name condition with startswith(Pipeline/PipelineName, 'retail').", fr: "Remplacer la condition sur le nom par startswith(Pipeline/PipelineName, 'retail')." }
    - id: b
      text: { en: "Add /groupby((Pipeline/PipelineName)) before the aggregate transformation.", fr: "Ajouter /groupby((Pipeline/PipelineName)) avant la transformation aggregate." }
    - id: c
      text: { en: "Replace the name condition with PipelineId eq 42.", fr: "Remplacer la condition sur le nom par PipelineId eq 42." }
    - id: d
      text: { en: "Remove the name condition and keep only the CompletedDate condition.", fr: "Supprimer la condition sur le nom et ne conserver que la condition CompletedDate." }
answer: { optionId: c }
explanation:
  correct:
    en: A report that filters on the pipeline name stops working when the pipeline is renamed. Microsoft recommends filtering on `PipelineId` instead; the ID is visible in the pipeline URL (`definitionId=42`) and does not change when the name changes.
    fr: Un rapport qui filtre sur le nom du pipeline ne fonctionne plus quand le pipeline est renommé. Microsoft recommande de filtrer plutôt sur `PipelineId` ; l'ID figure dans l'URL du pipeline (`definitionId=42`) et ne change pas quand le nom change.
  options:
    a:
      en: A new name may not start with retail, and other pipelines whose names start with retail would be counted too.
      fr: Un nouveau nom peut ne pas commencer par retail, et d'autres pipelines dont le nom commence par retail seraient aussi comptés.
    b:
      en: Grouping by name does not change the filter, which still matches only the old name.
      fr: Regrouper par nom ne modifie pas le filtre, qui ne correspond toujours qu'à l'ancien nom.
    d:
      en: Without a pipeline condition, the query counts the runs of every pipeline of the project.
      fr: Sans condition sur le pipeline, la requête compte les exécutions de tous les pipelines du projet.
references:
  - title: Pipeline outcome summary sample report
    url: https://learn.microsoft.com/en-us/azure/devops/report/powerbi/sample-pipelines-outcome-summary
