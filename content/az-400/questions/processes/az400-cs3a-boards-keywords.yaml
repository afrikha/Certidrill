id: az400-cs3a-boards-keywords
objective: "1.3.5"
type: single
caseStudy: az400-cs3a-wingtip-shipping
difficulty: 3
status: draft
stem:
  en: |
    A developer opens a pull request from a feature branch to main in wingtip/portcall. The pull request completes user stories **2210** and **2214** of the PortCall project.

    You need to ensure that the pull request meets the traceability requirement for both user stories when it is merged. What should the developer do?
  fr: |
    Un développeur ouvre une pull request d'une branche de fonctionnalité vers main dans wingtip/portcall. La pull request termine les récits utilisateur **2210** et **2214** du projet PortCall.

    Vous devez vous assurer que la pull request satisfait l'exigence de traçabilité pour les deux récits utilisateur lors de sa fusion. Que doit faire le développeur ?
body:
  options:
    - { id: a, text: { en: "Add the line `Resolved AB#2210, Resolved AB#2214` to the pull request description", fr: "Ajouter la ligne `Resolved AB#2210, Resolved AB#2214` à la description de la pull request" } }
    - { id: b, text: { en: "Add the line `Resolved AB#2210, AB#2214` to the pull request description", fr: "Ajouter la ligne `Resolved AB#2210, AB#2214` à la description de la pull request" } }
    - { id: c, text: { en: "Set the pull request title to `Resolved AB#2210, Resolved AB#2214`", fr: "Définir le titre de la pull request sur `Resolved AB#2210, Resolved AB#2214`" } }
    - { id: d, text: { en: "Add the comment `Resolved AB#2210, Resolved AB#2214` to the pull request", fr: "Ajouter le commentaire `Resolved AB#2210, Resolved AB#2214` à la pull request" } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      The Azure Boards app links a work item when `AB#<ID>` appears in a commit message, a pull request description, or an issue description. A valid state name such as Resolved moves the work item to that state when the pull request is merged into the default branch (the keyword Fixes would target the Resolved category, which holds only the Bug's Resolved state in the Agile process). A state name or keyword applies only to the reference that follows it, so it must be repeated for each user story.
    fr: |
      L'application Azure Boards lie un élément de travail quand `AB#<ID>` figure dans un message de validation, une description de pull request ou une description de problème. Un nom d'état valide comme Resolved fait passer l'élément de travail à cet état quand la pull request est fusionnée dans la branche par défaut (le mot clé Fixes viserait la catégorie Resolved, qui ne contient que l'état Resolved du bogue dans le processus Agile). Un nom d'état ou un mot clé ne s'applique qu'à la référence qui le suit : il doit être répété pour chaque récit utilisateur.
  options:
    b:
      en: |
        Both user stories are linked, but only 2210 changes state, because `Resolved` applies only to the first reference.
      fr: |
        Les deux récits utilisateur sont liés, mais seul 2210 change d'état, car `Resolved` ne s'applique qu'à la première référence.
    c:
      en: |
        A mention of `AB#` in a pull request title does not create a link, so no user story is linked or transitioned.
      fr: |
        Une mention `AB#` dans le titre d'une pull request ne crée pas de lien : aucun récit utilisateur n'est lié ni ne change d'état.
    d:
      en: |
        A mention of `AB#` in a comment does not create a link, so no user story is linked or transitioned.
      fr: |
        Une mention `AB#` dans un commentaire ne crée pas de lien : aucun récit utilisateur n'est lié ni ne change d'état.
references:
  - title: Link GitHub commits, PRs, branches, and issues to work items
    url: https://learn.microsoft.com/en-us/azure/devops/boards/github/link-to-from-github
