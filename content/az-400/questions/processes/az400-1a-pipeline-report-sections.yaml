id: az400-1a-pipeline-report-sections
objective: "1.2.3"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Developers at Fabrikam complain that the YAML pipeline **portal-ci** is often red and slow. You open the **Analytics** tab of the pipeline to investigate before the next sprint planning.

    Which report or report section should you use to answer each question? To answer, drag the appropriate reports or sections to the correct questions. Each report or section may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Les développeurs de Fabrikam se plaignent que le pipeline YAML **portal-ci** est souvent en échec et lent. Vous ouvrez l'onglet **Analytics** du pipeline pour enquêter avant la prochaine planification de sprint.

    Quel rapport ou quelle section de rapport devez-vous utiliser pour répondre à chaque question ? Pour répondre, faites glisser les rapports ou sections appropriés vers les questions correspondantes. Chaque rapport ou section peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: trend, text: { en: "Pipeline pass rate > Failure trend", fr: "Pipeline pass rate > Failure trend" } }
    - { id: tasks, text: { en: "Pipeline pass rate > Top failing tasks & their failed runs", fr: "Pipeline pass rate > Top failing tasks & their failed runs" } }
    - { id: duration, text: { en: "Pipeline duration", fr: "Pipeline duration" } }
    - { id: tests, text: { en: "Test failures", fr: "Test failures" } }
    - { id: summary, text: { en: "Pipeline pass rate > Summary", fr: "Pipeline pass rate > Summary" } }
  targets:
    - { id: q1, text: { en: "How many runs failed each day, and in which stage?", fr: "Combien d'exécutions ont échoué chaque jour, et à quelle étape (stage) ?" } }
    - { id: q2, text: { en: "Which task should be fixed first to reduce failed runs?", fr: "Quelle tâche faut-il corriger en premier pour réduire les exécutions en échec ?" } }
    - { id: q3, text: { en: "Which tasks take the longest in successful runs?", fr: "Quelles tâches prennent le plus de temps dans les exécutions réussies ?" } }
answer:
  mapping: { q1: trend, q2: tasks, q3: duration }
explanation:
  correct:
    en: |
      The Pipeline pass rate report contains a summary, a failure trend that counts failures per day (split by stage for multi-stage pipelines) and the list of the top failing tasks with links to their failed runs, which shows what to fix first. The Pipeline duration report shows how long successful runs take and lets you analyze the top tasks by duration.
    fr: |
      Le rapport Pipeline pass rate contient un résumé, une tendance des échecs qui compte les échecs par jour (répartis par étape pour les pipelines à plusieurs étapes) et la liste des tâches les plus en échec avec des liens vers leurs exécutions en échec, ce qui indique quoi corriger en premier. Le rapport Pipeline duration montre la durée des exécutions réussies et permet d'analyser les tâches les plus longues.
  options:
    tests: { en: "Test failures lists the failing tests, not failing tasks, daily run failures or slow tasks.", fr: "Test failures liste les tests en échec, pas les tâches en échec, les échecs quotidiens d'exécution ni les tâches lentes." }
    summary: { en: "The summary gives the key pass-rate metrics of the period, without a daily breakdown by stage.", fr: "Le résumé donne les indicateurs clés du taux de réussite de la période, sans répartition quotidienne par étape." }
references:
  - title: Pipeline reports
    url: https://learn.microsoft.com/en-us/azure/devops/pipelines/reports/pipelinereport
