id: az400-sr2-boards-github-2
objective: "1.3.5"
type: series_yesno
series: az400-sr2-boards-github
seriesOrder: 2
difficulty: 2
status: draft
stem:
  en: You connect the repository with the Azure Boards app and use Fixes AB#ID in pull request titles.
  fr: Vous connectez le dépôt avec l'application Azure Boards et utilisez Fixes AB#ID dans les titres des pull requests.
body:
  solution:
    en: |
      You install the **Azure Boards app for GitHub** on fabrikam/storefront and connect the repository to the Retail project. You instruct developers to start the **title** of each bug-fix pull request with `Fixes AB#<work item ID>` and to leave the description empty.
    fr: |
      Vous installez l'**application Azure Boards pour GitHub** sur fabrikam/storefront et connectez le dépôt au projet Retail. Vous demandez aux développeurs de commencer le **titre** de chaque pull request de correction de bogue par `Fixes AB#<ID de l'élément de travail>` et de laisser la description vide.
answer: { value: false }
explanation:
  correct:
    en: An `AB#ID` mention in a pull request title or in a comment does not create a link to the work item; only commit messages, pull request descriptions and issue descriptions do. Without a link, the bug is not listed in the Development section and no state transition is applied.
    fr: Une mention `AB#ID` dans le titre d'une pull request ou dans un commentaire ne crée pas de lien vers l'élément de travail ; seuls les messages de commit, les descriptions de pull request et les descriptions de ticket le font. Sans lien, le bogue n'apparaît pas dans la section Development et aucune transition d'état n'est appliquée.
references:
  - title: Link GitHub commits, PRs, branches, and issues to work items - Azure Boards
    url: https://learn.microsoft.com/en-us/azure/devops/boards/github/link-to-from-github
