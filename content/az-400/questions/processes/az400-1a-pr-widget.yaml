id: az400-1a-pr-widget
objective: "1.2.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    The Inventory team at Litware works in a single Azure Repos Git repository named **inventory-api**. Pull requests often wait several days before a reviewer looks at them.

    The development lead wants the team dashboard to list the active pull requests of inventory-api that request a review from the team, with minimal configuration.

    Which widget should you add to the dashboard?
  fr: |
    L'équipe Inventory de Litware travaille dans un seul dépôt Git Azure Repos nommé **inventory-api**. Les pull requests attendent souvent plusieurs jours avant qu'un réviseur ne les examine.

    Le responsable du développement veut que le tableau de bord de l'équipe liste les pull requests actives d'inventory-api qui demandent une revue à l'équipe, avec une configuration minimale.

    Quel widget devez-vous ajouter au tableau de bord ?
body:
  options:
    - { id: a, text: Code Tile }
    - { id: b, text: Pull Request }
    - { id: c, text: Query Results }
    - { id: d, text: Build History }
answer: { optionId: b }
explanation:
  correct:
    en: |
      The Pull Request widget lists the active pull requests of one Git repository that are requested by the team, or assigned to or requested by the signed-in user. It shows the review backlog directly on the dashboard.
    fr: |
      Le widget Pull Request liste les pull requests actives d'un dépôt Git demandées à l'équipe, ou attribuées à l'utilisateur connecté ou demandées par celui-ci. Il affiche directement le retard de revue sur le tableau de bord.
  options:
    a: { en: "Code Tile summarizes recent changes in a repository, branch or folder; it does not list pull requests awaiting review.", fr: "Code Tile résume les modifications récentes d'un dépôt, d'une branche ou d'un dossier ; il ne liste pas les pull requests en attente de revue." }
    c: { en: "Query Results lists work items returned by a shared query; work item queries cannot return pull requests.", fr: "Query Results liste les éléments de travail renvoyés par une requête partagée ; les requêtes d'éléments de travail ne peuvent pas renvoyer de pull requests." }
    d: { en: "Build History shows a histogram of the runs of a build pipeline, not pull requests.", fr: "Build History affiche un histogramme des exécutions d'un pipeline de build, pas les pull requests." }
references:
  - title: Out Of Box widget catalog
    url: https://learn.microsoft.com/en-us/azure/devops/report/dashboards/widget-catalog
