id: az400-1b-ops-release-annotations
objective: "1.2.7"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Tailspin Toys deploys a web app named **app-tailspin-web** to Azure App Service by using a YAML pipeline in Azure Pipelines. The pipeline deploys the app with the `AzureWebApp@1` task.

    The app has an app setting named `APPLICATIONINSIGHTS_CONNECTION_STRING` that points to an Application Insights resource named **appi-tailspin**. The web app and appi-tailspin are in the same Azure subscription. The operations team wants to correlate changes in failure rates with deployments.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin Toys déploie une application web nommée **app-tailspin-web** sur Azure App Service à l'aide d'un pipeline YAML dans Azure Pipelines. Le pipeline déploie l'application avec la tâche `AzureWebApp@1`.

    L'application possède un paramètre d'application nommé `APPLICATIONINSIGHTS_CONNECTION_STRING` qui pointe vers une ressource Application Insights nommée **appi-tailspin**. L'application web et appi-tailspin se trouvent dans le même abonnement Azure. L'équipe d'exploitation souhaite mettre en corrélation l'évolution des taux d'échec et les déploiements.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: Each deployment that the AzureWebApp@1 task performs creates a release annotation in appi-tailspin, without any additional script.
        fr: Chaque déploiement effectué par la tâche AzureWebApp@1 crée une annotation de mise en production dans appi-tailspin, sans script supplémentaire.
    - id: s2
      text:
        en: The release annotations are displayed as markers on the charts of the Metrics pane of appi-tailspin.
        fr: Les annotations de mise en production s'affichent sous forme de marqueurs sur les graphiques du volet Métriques d'appi-tailspin.
    - id: s3
      text:
        en: An annotation that a custom script creates through the Annotations API is displayed in the Azure portal only if its category is Deployment.
        fr: Une annotation créée par un script personnalisé via l'API Annotations ne s'affiche dans le portail Azure que si sa catégorie est Deployment.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: Azure Pipelines creates a release annotation automatically when the target resource is linked to Application Insights through the APPLICATIONINSIGHTS_CONNECTION_STRING app setting, the Application Insights resource is in the same subscription, and the deployment uses a supported task such as Azure Web App. Annotations appear on the charts of the Performance, Failures and Usage experiences and in workbooks, but not in the Metrics pane. A script must set the category to Deployment, otherwise the portal doesn't show the annotation.
    fr: Azure Pipelines crée automatiquement une annotation de mise en production quand la ressource cible est liée à Application Insights par le paramètre d'application APPLICATIONINSIGHTS_CONNECTION_STRING, que la ressource Application Insights se trouve dans le même abonnement et que le déploiement utilise une tâche prise en charge comme Azure Web App. Les annotations apparaissent sur les graphiques des expériences Performances, Échecs et Utilisation et dans les classeurs, mais pas dans le volet Métriques. Un script doit définir la catégorie Deployment, sinon le portail n'affiche pas l'annotation.
references:
  - title: Investigate failures, performance, and transactions with Application Insights
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/app/annotations
