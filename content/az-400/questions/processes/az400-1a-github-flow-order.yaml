id: az400-1a-github-flow-order
objective: "1.1.1"
type: ordering
difficulty: 1
status: draft
stem:
  en: |
    The web team at Contoso stores its code in a GitHub repository named **storefront**. The default branch is `main`. The team adopts GitHub Flow and must fix a pricing bug without affecting `main` until the change is reviewed.

    Which five actions should a developer perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    L'équipe web de Contoso stocke son code dans un dépôt GitHub nommé **storefront**. La branche par défaut est `main`. L'équipe adopte GitHub Flow et doit corriger un bogue de tarification sans affecter `main` tant que la modification n'a pas été revue.

    Quelles sont les cinq actions qu'un développeur doit effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 5
  actions:
    - { id: branch, text: { en: "Create a branch named fix-pricing from main.", fr: "Créer une branche nommée fix-pricing à partir de main." } }
    - { id: commit, text: { en: "Commit the fix to fix-pricing and push the branch.", fr: "Commiter le correctif dans fix-pricing et envoyer (push) la branche." } }
    - { id: pr, text: { en: "Open a pull request from fix-pricing to main.", fr: "Ouvrir une pull request de fix-pricing vers main." } }
    - { id: merge, text: { en: "Merge the pull request after the reviewers approve it.", fr: "Fusionner la pull request après l'approbation des réviseurs." } }
    - { id: delete, text: { en: "Delete the fix-pricing branch.", fr: "Supprimer la branche fix-pricing." } }
    - { id: release, text: { en: "Create a release branch named release/1.4 from main.", fr: "Créer une branche de mise en production nommée release/1.4 à partir de main." } }
    - { id: direct, text: { en: "Push the fix directly to main.", fr: "Envoyer (push) le correctif directement dans main." } }
answer:
  sequence: [ branch, commit, pr, merge, delete ]
explanation:
  correct:
    en: |
      GitHub Flow is a lightweight, branch-based workflow. You create a branch from the default branch, commit and push your changes there, open a pull request to start the review, merge once the change is approved, and then delete the branch to avoid stale branches. The merge history is kept after the branch is deleted.
    fr: |
      GitHub Flow est un workflow léger fondé sur les branches. Vous créez une branche à partir de la branche par défaut, vous y commitez et envoyez vos modifications, vous ouvrez une pull request pour lancer la revue, vous fusionnez une fois la modification approuvée, puis vous supprimez la branche pour éviter les branches obsolètes. L'historique de fusion est conservé après la suppression de la branche.
  options:
    release: { en: "GitHub Flow has no release branches: everything branches from and merges back to the default branch.", fr: "GitHub Flow n'utilise pas de branches de mise en production : tout part de la branche par défaut et y revient." }
    direct: { en: "Pushing to main skips the review and affects main immediately, which the requirement forbids.", fr: "Envoyer dans main contourne la revue et affecte main immédiatement, ce que l'exigence interdit." }
references:
  - title: Components of the GitHub flow
    url: https://learn.microsoft.com/en-us/training/modules/introduction-to-github/3-components-of-github-flow
  - title: Explore GitHub flow
    url: https://learn.microsoft.com/en-us/training/modules/manage-git-branches-workflows/5-explore-github-flow
