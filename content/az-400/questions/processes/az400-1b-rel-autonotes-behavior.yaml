id: az400-1b-rel-autonotes-behavior
objective: "1.3.2"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam, Inc. maintains a GitHub repository named **fabrikam/sdk** that has never had a release. The repository contains the following `.github/release.yml` file.

    ```yaml
    changelog:
      exclude:
        labels:
          - ignore-for-release
        authors:
          - octocat
      categories:
        - title: New Features
          labels:
            - enhancement
        - title: Other Changes
          labels:
            - "*"
    ```

    You create the first release of the repository from the tag `v1.0.0` and select the option to generate the release notes automatically.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam, Inc. gère un dépôt GitHub nommé **fabrikam/sdk** qui n'a encore jamais eu de version. Le dépôt contient le fichier `.github/release.yml` suivant.

    ```yaml
    changelog:
      exclude:
        labels:
          - ignore-for-release
        authors:
          - octocat
      categories:
        - title: New Features
          labels:
            - enhancement
        - title: Other Changes
          labels:
            - "*"
    ```

    Vous créez la première version du dépôt à partir de la balise `v1.0.0` et sélectionnez l'option de génération automatique des notes de publication.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: The generated notes cover all the changes of the repository up to v1.0.0.
        fr: Les notes générées couvrent toutes les modifications du dépôt jusqu'à v1.0.0.
    - id: s2
      text:
        en: A merged pull request labeled ignore-for-release is listed under Other Changes.
        fr: Une pull request fusionnée portant l'étiquette ignore-for-release est listée sous Other Changes.
    - id: s3
      text:
        en: A merged pull request labeled enhancement that octocat opened is listed under New Features.
        fr: Une pull request fusionnée portant l'étiquette enhancement et ouverte par octocat est listée sous New Features.
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: Automatically generated notes include the changes between the tag and the previous release; when the repository has no earlier release, they include all its changes. The exclude section removes the pull requests that carry an excluded label or come from an excluded author before the categories are applied, so neither pull request appears, even with the wildcard category.
    fr: "Les notes générées automatiquement incluent les modifications entre la balise et la version précédente ; quand le dépôt n'a aucune version antérieure, elles incluent toutes ses modifications. La section exclude retire les pull requests qui portent une étiquette exclue ou qui viennent d'un auteur exclu avant l'application des catégories : aucune des deux pull requests n'apparaît, même avec la catégorie générique."
references:
  - title: Automate release notes with GitHub
    url: https://learn.microsoft.com/en-us/training/modules/manage-git-repositories/9-automate-release-notes-github
