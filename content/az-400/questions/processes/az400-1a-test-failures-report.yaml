id: az400-1a-test-failures-report
objective: "1.2.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Adatum runs about 2,000 automated tests in a YAML pipeline named **orders-ci**. The pipeline publishes its test results to Azure Pipelines. Every run reports a few failed tests, and the developers fix them one run at a time.

    The QA lead needs to identify the tests that caused the most failures across all the runs of orders-ci during the last 14 days, grouped by test file, with minimal effort.

    What should the QA lead use?
  fr: |
    Adatum exécute environ 2 000 tests automatisés dans un pipeline YAML nommé **orders-ci**. Le pipeline publie ses résultats de test dans Azure Pipelines. Chaque exécution signale quelques tests en échec, et les développeurs les corrigent exécution par exécution.

    Le responsable QA doit identifier les tests qui ont provoqué le plus d'échecs sur l'ensemble des exécutions d'orders-ci au cours des 14 derniers jours, regroupés par fichier de test, avec un effort minimal.

    Que doit utiliser le responsable QA ?
body:
  options:
    - { id: a, text: { en: "The Tests tab of the latest run of orders-ci", fr: "L'onglet Tests de la dernière exécution d'orders-ci" } }
    - { id: b, text: { en: "The Test failures report on the Analytics tab of orders-ci", fr: "Le rapport Test failures de l'onglet Analytics d'orders-ci" } }
    - { id: c, text: { en: "The Chart for Test Plans widget on the team dashboard", fr: "Le widget Chart for Test Plans du tableau de bord de l'équipe" } }
    - { id: d, text: { en: "The Pipeline duration report on the Analytics tab of orders-ci", fr: "Le rapport Pipeline duration de l'onglet Analytics d'orders-ci" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Test analytics, opened from the Analytics tab of the pipeline, aggregates the published test results of all runs over a period (14 days by default). The Test failures report ranks the top failing tests by number of failures, can group them by test file and lets you drill down into each test's daily pass and fail trend.
    fr: |
      L'analytique des tests, ouverte depuis l'onglet Analytics du pipeline, agrège les résultats de test publiés de toutes les exécutions sur une période (14 jours par défaut). Le rapport Test failures classe les tests les plus en échec selon leur nombre d'échecs, peut les regrouper par fichier de test et permet d'explorer la tendance quotidienne de réussite et d'échec de chaque test.
  options:
    a: { en: "The Tests tab of a run only shows the results of that single run, not the failures accumulated over 14 days.", fr: "L'onglet Tests d'une exécution n'affiche que les résultats de cette exécution, pas les échecs cumulés sur 14 jours." }
    c: { en: "Chart for Test Plans tracks test case authoring or execution results of a test plan or suite, not pipeline test failures.", fr: "Chart for Test Plans suit la création des cas de test ou les résultats d'exécution d'un plan ou d'une suite de tests, pas les échecs de tests de pipeline." }
    d: { en: "The duration report shows how long the pipeline and its tasks take, not which tests fail.", fr: "Le rapport de durée montre le temps pris par le pipeline et ses tâches, pas les tests qui échouent." }
references:
  - title: Test Analytics
    url: https://learn.microsoft.com/en-us/azure/devops/pipelines/test/test-analytics
