id: az400-1b-hook-webhook-steps
objective: "1.3.4"
type: ordering
difficulty: 1
status: draft
stem:
  en: |
    Northwind Traders has an Azure DevOps project named **Orders** that contains Azure Repos Git repositories. The compliance team runs an internal service that exposes a public HTTPS endpoint. You are a member of the Project Administrators group of Orders.

    You need the endpoint to receive a JSON payload each time a pull request is created in Orders.

    Which five actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Northwind Traders dispose d'un projet Azure DevOps nommé **Orders** qui contient des dépôts Git Azure Repos. L'équipe de conformité exécute un service interne qui expose un point de terminaison HTTPS public. Vous êtes membre du groupe Project Administrators d'Orders.

    Le point de terminaison doit recevoir une charge utile JSON chaque fois qu'une pull request est créée dans Orders.

    Quelles sont les cinq actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 5
  actions:
    - { id: open, text: { en: "In Project settings, open Service hooks and select Create subscription.", fr: "Dans Project settings, ouvrir Service hooks et sélectionner Create subscription." } }
    - { id: service, text: { en: "Select the Web Hooks service.", fr: "Sélectionner le service Web Hooks." } }
    - { id: trigger, text: { en: "Select the Pull request created event and set its filters.", fr: "Sélectionner l'événement Pull request created et définir ses filtres." } }
    - { id: action, text: { en: "Enter the HTTPS URL of the endpoint in the action settings.", fr: "Saisir l'URL HTTPS du point de terminaison dans les paramètres de l'action." } }
    - { id: test, text: { en: "Select Test, then select Finish.", fr: "Sélectionner Test, puis Finish." } }
    - { id: conn, text: { en: "Create an Incoming WebHook service connection.", fr: "Créer une connexion de service Incoming WebHook." } }
    - { id: pat, text: { en: "Create a personal access token and give it to the compliance team.", fr: "Créer un jeton d'accès personnel et le remettre à l'équipe de conformité." } }
answer:
  sequence: [ open, service, trigger, action, test ]
explanation:
  correct:
    en: A service hook subscription sends Azure DevOps events to another service. You create it from Project settings > Service hooks, choose the Web Hooks service, choose the event (trigger) and its filters, configure the action with the target URL, then test the subscription and finish the wizard. Only HTTPS endpoints should be used, and HTTPS is required for basic authentication.
    fr: Un abonnement de hook de service envoie des événements Azure DevOps à un autre service. Vous le créez depuis Project settings > Service hooks, choisissez le service Web Hooks, choisissez l'événement (déclencheur) et ses filtres, configurez l'action avec l'URL cible, puis testez l'abonnement et terminez l'assistant. Seuls des points de terminaison HTTPS doivent être utilisés, et HTTPS est obligatoire pour l'authentification de base.
  options:
    conn:
      en: An Incoming WebHook service connection receives events from an external service to trigger a pipeline; it's the opposite direction.
      fr: Une connexion de service Incoming WebHook reçoit des événements d'un service externe pour déclencher un pipeline ; c'est le sens inverse.
    pat:
      en: The endpoint receives the payload; it doesn't need a token to call Azure DevOps for this requirement.
      fr: Le point de terminaison reçoit la charge utile ; il n'a pas besoin de jeton pour appeler Azure DevOps afin de répondre à cette exigence.
references:
  - title: Webhooks
    url: https://learn.microsoft.com/en-us/azure/devops/service-hooks/services/webhooks
