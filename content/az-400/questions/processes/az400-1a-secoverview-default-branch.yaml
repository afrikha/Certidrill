id: az400-1a-secoverview-default-branch
objective: "1.2.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Adatum uses GitHub Code Security for Azure DevOps on all the repositories of its organization. A pipeline runs CodeQL on every branch. In the repository **claims-api**, the branch `feature/export` has five open high-severity code scanning alerts that do not exist on the default branch `main`.

    The security lead opens **Organization settings > Security overview**, selects the **Risk** tab and sees no high-severity alert for claims-api.

    What is the cause?
  fr: |
    Adatum utilise GitHub Code Security for Azure DevOps sur tous les dépôts de son organisation. Un pipeline exécute CodeQL sur chaque branche. Dans le dépôt **claims-api**, la branche `feature/export` présente cinq alertes d'analyse du code ouvertes de gravité élevée qui n'existent pas sur la branche par défaut `main`.

    Le responsable de la sécurité ouvre **Paramètres de l'organisation > Security overview**, sélectionne l'onglet **Risk** et ne voit aucune alerte de gravité élevée pour claims-api.

    Quelle est la cause ?
body:
  options:
    - { id: a, text: { en: "The Risk tab only shows the alerts of repositories in the security lead's own project.", fr: "L'onglet Risk n'affiche que les alertes des dépôts du propre projet du responsable de la sécurité." } }
    - { id: b, text: { en: "The Risk tab only shows secret scanning alerts, not code scanning alerts.", fr: "L'onglet Risk n'affiche que les alertes d'analyse des secrets, pas les alertes d'analyse du code." } }
    - { id: c, text: { en: "The Risk tab only counts the alerts found on the default branch of each repository.", fr: "L'onglet Risk ne compte que les alertes trouvées sur la branche par défaut de chaque dépôt." } }
    - { id: d, text: { en: "The Risk tab only shows the alerts dismissed during the selected period.", fr: "L'onglet Risk n'affiche que les alertes ignorées pendant la période sélectionnée." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      The Risk tab shows the distribution of alerts, by severity, across all projects and repositories with Advanced Security enabled, but its counts only include the alerts found on the default branch of each repository. Alerts that exist only on a feature branch are not counted until the code reaches main.
    fr: |
      L'onglet Risk affiche la répartition des alertes, par gravité, pour tous les projets et dépôts où Advanced Security est activé, mais ses décomptes n'incluent que les alertes trouvées sur la branche par défaut de chaque dépôt. Les alertes qui n'existent que sur une branche de fonctionnalité ne sont pas comptées tant que le code n'atteint pas main.
  options:
    b: { en: "The Risk tab can be filtered by toolset and covers dependency, code and secret scanning.", fr: "L'onglet Risk peut être filtré par ensemble d'outils et couvre l'analyse des dépendances, du code et des secrets." }
    a: { en: "The security overview is an organization-level view that covers all projects; it can be filtered by project.", fr: "Le Security overview est une vue au niveau de l'organisation qui couvre tous les projets ; il peut être filtré par projet." }
    d: { en: "The Risk tab lists open, new, dismissed and fixed alerts, not only dismissed ones.", fr: "L'onglet Risk répertorie les alertes ouvertes, nouvelles, ignorées et corrigées, pas seulement les alertes ignorées." }
references:
  - title: Security overview
    url: https://learn.microsoft.com/en-us/azure/devops/repos/security/github-advanced-security-security-overview
