id: az400-1b-wiki-code-wiki
objective: "1.3.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Litware, Inc. stores the documentation of its payment API as Markdown files in the **/docs** folder of an Azure Repos Git repository named **payments-api**. The project doesn't have a wiki yet.

    You need to make the documentation available in Azure DevOps Wiki. The solution must meet the following requirements:

    - Documentation changes are reviewed through pull requests, in the same branches as the code.
    - Readers can choose between the documentation of the **main** branch and the documentation of the **release/2026.10** branch.

    What should you do?
  fr: |
    Litware, Inc. stocke la documentation de son API de paiement sous forme de fichiers Markdown dans le dossier **/docs** d'un dépôt Git Azure Repos nommé **payments-api**. Le projet n'a pas encore de wiki.

    Vous devez rendre la documentation disponible dans Azure DevOps Wiki. La solution doit répondre aux exigences suivantes :

    - Les modifications de la documentation sont relues au moyen de pull requests, dans les mêmes branches que le code.
    - Les lecteurs peuvent choisir entre la documentation de la branche **main** et celle de la branche **release/2026.10**.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Create a project wiki and copy the Markdown files of /docs into it.", fr: "Créer un wiki de projet et y copier les fichiers Markdown de /docs." }
    - id: b
      text: { en: "Create a project wiki and add a branch policy to its wikiMain branch.", fr: "Créer un wiki de projet et ajouter une stratégie de branche à sa branche wikiMain." }
    - id: c
      text: { en: "Publish the /docs folder of payments-api as a code wiki for both branches.", fr: "Publier le dossier /docs de payments-api comme wiki de code pour les deux branches." }
    - id: d
      text: { en: "Add a Markdown widget that points to /docs to a project dashboard.", fr: "Ajouter à un tableau de bord du projet un widget Markdown qui pointe vers /docs." }
answer: { optionId: c }
explanation:
  correct:
    en: "Publish code as wiki maps a folder of a branch of a Git repository to a wiki, so the pages are maintained like code, with pull requests and branch policies. A code wiki can publish several branches (up to 10), and readers pick the version in the branch drop-down list. A provisioned project wiki has no versions."
    fr: "La publication de code en tant que wiki associe un dossier d'une branche d'un dépôt Git à un wiki : les pages sont maintenues comme du code, avec des pull requests et des stratégies de branche. Un wiki de code peut publier plusieurs branches (jusqu'à 10), et les lecteurs choisissent la version dans la liste déroulante des branches. Un wiki de projet provisionné n'a pas de versions."
  options:
    a:
      en: A copy in a project wiki is no longer maintained with the code, and a project wiki can't show one version per branch.
      fr: Une copie dans un wiki de projet n'est plus maintenue avec le code, et un wiki de projet ne peut pas afficher une version par branche.
    b:
      en: A branch policy on wikiMain adds reviews to the project wiki, but the pages still live outside the code branches and have a single version.
      fr: Une stratégie de branche sur wikiMain ajoute des relectures au wiki de projet, mais les pages restent hors des branches du code et n'ont qu'une version.
    d:
      en: A dashboard widget displays some Markdown text; it doesn't publish a set of pages as a wiki with versions.
      fr: Un widget de tableau de bord affiche un texte Markdown ; il ne publie pas un ensemble de pages sous forme de wiki avec des versions.
references:
  - title: Publish a Git repo to a wiki
    url: https://learn.microsoft.com/en-us/azure/devops/project/wiki/publish-repo-to-wiki
  - title: Provisioned wiki vs. published as code wiki
    url: https://learn.microsoft.com/en-us/azure/devops/project/wiki/provisioned-vs-published-wiki
