id: az400-sr2-boards-github-1
objective: "1.3.5"
type: series_yesno
series: az400-sr2-boards-github
seriesOrder: 1
difficulty: 1
status: draft
stem:
  en: You connect the repository with the Azure Boards app and use Fixes AB#ID in pull request descriptions.
  fr: Vous connectez le dépôt avec l'application Azure Boards et utilisez Fixes AB#ID dans les descriptions des pull requests.
body:
  solution:
    en: |
      You install the **Azure Boards app for GitHub** on fabrikam/storefront and connect the repository to the Retail project. You instruct developers to add `Fixes AB#<work item ID>` to the **description** of each bug-fix pull request.
    fr: |
      Vous installez l'**application Azure Boards pour GitHub** sur fabrikam/storefront et connectez le dépôt au projet Retail. Vous demandez aux développeurs d'ajouter `Fixes AB#<ID de l'élément de travail>` à la **description** de chaque pull request de correction de bogue.
answer: { value: true }
explanation:
  correct:
    en: Once the repository is connected through the Azure Boards app, an `AB#ID` mention in a pull request description creates a link that appears in the Development section of the work item. The `fix`, `fixes` and `fixed` keywords move the work item to the first state of the Resolved category, which is Resolved for an Agile bug, when the pull request is merged into the default branch.
    fr: Une fois le dépôt connecté par l'application Azure Boards, une mention `AB#ID` dans la description d'une pull request crée un lien qui apparaît dans la section Development de l'élément de travail. Les mots clés `fix`, `fixes` et `fixed` font passer l'élément de travail au premier état de la catégorie Resolved, c'est-à-dire Resolved pour un bogue Agile, lorsque la pull request est fusionnée dans la branche par défaut.
references:
  - title: Link GitHub commits, PRs, branches, and issues to work items - Azure Boards
    url: https://learn.microsoft.com/en-us/azure/devops/boards/github/link-to-from-github
  - title: How workflow category states are used in Azure Boards backlogs and boards - Azure Boards
    url: https://learn.microsoft.com/en-us/azure/devops/boards/work-items/workflow-and-state-categories
