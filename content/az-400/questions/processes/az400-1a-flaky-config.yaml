id: az400-1a-flaky-config
objective: "1.2.4"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    Fabrikam uses Azure DevOps Services. Its YAML pipelines run tests by using the Visual Studio Test task, which is configured to rerun failed tests. Some tests fail and then pass on rerun without any code change, which makes the test pass percentage unreliable.

    You need to configure flaky test management to meet the following requirements:

    - Tests that fail and then pass on rerun in the same pipeline execution must be flagged as flaky automatically.
    - Flaky test failures must not fail the pipeline.

    How should you complete the configuration? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam utilise Azure DevOps Services. Ses pipelines YAML exécutent les tests avec la tâche Visual Studio Test, configurée pour réexécuter les tests en échec. Certains tests échouent puis réussissent lors de la réexécution sans aucune modification du code, ce qui rend le pourcentage de réussite des tests peu fiable.

    Vous devez configurer la gestion des tests non fiables (flaky) pour satisfaire les exigences suivantes :

    - Les tests qui échouent puis réussissent lors d'une réexécution dans la même exécution de pipeline doivent être signalés automatiquement comme non fiables.
    - Les échecs des tests non fiables ne doivent pas faire échouer le pipeline.

    Comment devez-vous compléter la configuration ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Location of the setting: [[where]]
      Flaky test detection: [[detect]]
      Flaky test options: [[summary]]
    fr: |
      Emplacement du paramètre : [[where]]
      Détection des tests non fiables : [[detect]]
      Options des tests non fiables : [[summary]]
  slots:
    - id: where
      options:
        - { id: proj, text: { en: "Project settings > Pipelines > Test management", fr: "Paramètres du projet > Pipelines > Test management" } }
        - { id: pipe, text: { en: "The Settings pane of each YAML pipeline", fr: "Le volet Settings de chaque pipeline YAML" } }
        - { id: plans, text: { en: "The settings of the test plan in Azure Test Plans", fr: "Les paramètres du plan de test dans Azure Test Plans" } }
        - { id: org, text: { en: "Organization settings > Pipelines > Settings", fr: "Paramètres de l'organisation > Pipelines > Settings" } }
    - id: detect
      options:
        - { id: system, text: { en: "System detection", fr: "Détection système (System detection)" } }
        - { id: custom, text: { en: "Custom detection that calls the Result Meta Data - Update API", fr: "Détection personnalisée qui appelle l'API Result Meta Data - Update" } }
        - { id: manual, text: { en: "Manual marking of each test as Flaky", fr: "Marquage manuel de chaque test comme Flaky" } }
    - id: summary
      options:
        - { id: exclude, text: { en: "Do not include flaky tests in the test summary, so they are reported in Tests not reported", fr: "Ne pas inclure les tests non fiables dans le résumé des tests, afin qu'ils figurent dans Tests not reported" } }
        - { id: include, text: { en: "Include flaky tests in the test summary", fr: "Inclure les tests non fiables dans le résumé des tests" } }
        - { id: coe, text: { en: "Set continueOnError to true on the test task", fr: "Définir continueOnError sur true pour la tâche de test" } }
answer:
  values: { where: proj, detect: system, summary: exclude }
explanation:
  correct:
    en: |
      Flaky test management is configured in Project settings, on the Test management page of the Pipelines section. System detection marks a test as flaky when it fails and then passes on a rerun within the same pipeline execution, for example through the rerun option of the Visual Studio Test task. Choosing not to include flaky tests in the test summary removes them from the pass percentage and suppresses their failures, which applies to the Visual Studio Test and Publish Test Results tasks.
    fr: |
      La gestion des tests non fiables se configure dans les paramètres du projet, sur la page Test management de la section Pipelines. La détection système marque un test comme non fiable lorsqu'il échoue puis réussit lors d'une réexécution dans la même exécution de pipeline, par exemple grâce à l'option de réexécution de la tâche Visual Studio Test. Choisir de ne pas inclure les tests non fiables dans le résumé des tests les retire du pourcentage de réussite et supprime leurs échecs, ce qui s'applique aux tâches Visual Studio Test et Publish Test Results.
  options:
    custom: { en: "Custom detection is for an external system that applies its own logic and reports flakiness through the API.", fr: "La détection personnalisée sert à un système externe qui applique sa propre logique et signale les tests non fiables via l'API." }
    manual: { en: "Manual marking is not automatic and only applies to future executions.", fr: "Le marquage manuel n'est pas automatique et ne s'applique qu'aux exécutions futures." }
    include: { en: "Including flaky tests in the summary is the default, and their failures still count against the run.", fr: "Inclure les tests non fiables dans le résumé est le comportement par défaut, et leurs échecs comptent toujours pour l'exécution." }
    coe: { en: "continueOnError hides every failure of the task, not only flaky failures.", fr: "continueOnError masque tous les échecs de la tâche, pas seulement ceux des tests non fiables." }
references:
  - title: Manage flaky tests
    url: https://learn.microsoft.com/en-us/azure/devops/pipelines/test/flaky-test-management
