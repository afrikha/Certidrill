id: az400-cs2c-boards-link
objective: "1.3.5"
type: single
caseStudy: az400-cs2c-fourth-coffee
difficulty: 1
status: draft
stem:
  en: |
    You need to meet the requirement for linking the order-api pull requests to user stories.

    What should you do?
  fr: |
    Vous devez respecter l'exigence de liaison des pull requests d'order-api aux récits utilisateur.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text:
        en: "Connect order-api to Ordering with the Azure Boards app, and write Resolved AB#{ID} in the pull request title."
        fr: "Connecter order-api à Ordering avec l'application Azure Boards et écrire Resolved AB#{ID} dans le titre de la pull request."
    - id: b
      text:
        en: "Connect order-api to Ordering with the Azure Boards app, and write Resolved AB#{ID} in the pull request description."
        fr: "Connecter order-api à Ordering avec l'application Azure Boards et écrire Resolved AB#{ID} dans la description de la pull request."
    - id: c
      text:
        en: "Create an autolink reference for the AB# prefix in order-api, and write AB#{ID} in each commit message."
        fr: "Créer une référence de lien automatique pour le préfixe AB# dans order-api et écrire AB#{ID} dans chaque message de commit."
    - id: d
      text:
        en: "Leave order-api unconnected, and write Fixes #{ID} in the pull request description to close the story."
        fr: "Laisser order-api non connecté et écrire Fixes #{ID} dans la description de la pull request pour fermer le récit."
answer: { optionId: b }
explanation:
  correct:
    en: AB# links work only for a GitHub repository connected to the Azure Boards project. AB#{ID} in a pull request description creates the link, and a valid state name before it, such as Resolved, moves the user story to that state when the pull request is merged into the default branch. A keyword such as Fixes would target the first state of the Resolved category, and in the Agile process that category holds the Bug's Resolved state only.
    fr: Les liens AB# ne fonctionnent que pour un dépôt GitHub connecté au projet Azure Boards. AB#{ID} dans la description d'une pull request crée le lien, et un nom d'état valide placé devant, comme Resolved, fait passer le récit utilisateur à cet état lorsque la pull request est fusionnée dans la branche par défaut. Un mot clé comme Fixes viserait le premier état de la catégorie Resolved, et dans le processus Agile cette catégorie ne contient que l'état Resolved du bogue.
  options:
    a: { en: "AB# in a pull request title doesn't create a link on the work item; use the description.", fr: "AB# dans le titre d'une pull request ne crée pas de lien sur l'élément de travail ; il faut utiliser la description." }
    c: { en: "An autolink only turns the text into a hyperlink in GitHub; it creates no link in Azure Boards and changes no state.", fr: "Un lien automatique transforme seulement le texte en lien hypertexte dans GitHub ; il ne crée aucun lien dans Azure Boards et ne change aucun état." }
    d: { en: "Fixes #{ID} closes a GitHub issue of the repository, not an Azure Boards work item.", fr: "Fixes #{ID} ferme un problème GitHub du dépôt, pas un élément de travail Azure Boards." }
references:
  - title: Link GitHub commits, pull requests, branches, and issues to work items in Azure Boards
    url: https://learn.microsoft.com/en-us/azure/devops/boards/github/link-to-from-github
