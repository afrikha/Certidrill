id: az400-1b-boards-ab-locations
objective: "1.3.5"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    Fabrikam, Inc. connected its GitHub repositories to an Azure Boards project. The developers must link their GitHub work to user story 418 by typing `AB#418`.

    In which two places does `AB#418` create a link on the work item? Each correct answer presents a complete solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam, Inc. a connecté ses dépôts GitHub à un projet Azure Boards. Les développeurs doivent lier leur travail GitHub au récit utilisateur 418 en tapant `AB#418`.

    À quels deux endroits `AB#418` crée-t-il un lien sur l'élément de travail ? Chaque bonne réponse constitue une solution complète.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "The title of a pull request", fr: "Le titre d'une pull request" } }
    - { id: b, text: { en: "The message of a commit that is pushed to the repository", fr: "Le message d'un commit poussé dans le dépôt" } }
    - { id: c, text: { en: "A comment on a pull request", fr: "Un commentaire sur une pull request" } }
    - { id: d, text: { en: "The description of a pull request", fr: "La description d'une pull request" } }
    - { id: e, text: { en: "A comment on an issue", fr: "Un commentaire sur un problème (issue)" } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: "An AB# mention creates a link when it is in a commit message, a pull request description or an issue description, after the commit is pushed or the pull request or issue is saved. The link appears in the Development section of the work item."
    fr: "Une mention AB# crée un lien quand elle figure dans un message de commit, la description d'une pull request ou la description d'un problème (issue), une fois le commit poussé ou la pull request ou le problème enregistré. Le lien apparaît dans la section Development de l'élément de travail."
  options:
    a: { en: "An AB# mention in the title of a pull request doesn't create a link.", fr: "Une mention AB# dans le titre d'une pull request ne crée pas de lien." }
    c: { en: "Mentions in comments don't create links on the work item.", fr: "Les mentions dans les commentaires ne créent pas de lien sur l'élément de travail." }
    e: { en: "Mentions in comments don't create links; only the issue description does.", fr: "Les mentions dans les commentaires ne créent pas de lien ; seule la description du problème le fait." }
references:
  - title: Link GitHub commits, pull requests, branches, and issues to work items in Azure Boards
    url: https://learn.microsoft.com/en-us/azure/devops/boards/github/link-to-from-github
