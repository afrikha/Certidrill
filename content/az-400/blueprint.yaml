# AZ-400 — Designing and Implementing Microsoft DevOps Solutions (Microsoft Certified: DevOps Engineer Expert)
# Source: official study guide, "Skills measured as of July 27, 2026" (en-us and fr-fr pages, checked on 2026-11-16).
# Real exam: 120 minutes of exam time, passing score 700/1000. The exam page does not print the duration;
# 120 minutes is the "associate and expert role-based exams that may contain labs" row of Microsoft's
# "Exam duration and exam experience" page (140-minute seat time, the appointment length of AZ-400 in 2026).
# Microsoft does not publish the number of questions nor the formats; the simulator draws 45 to 58 questions,
# one case study and one Yes/No series. YAML-heavy exam: more drop-down (code completion) than AZ-104.
# Readiness and progression rules are those of AZ-104.
# active: false until the bank and the course are reviewed and published.
