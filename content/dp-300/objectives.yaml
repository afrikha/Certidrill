# DP-300 objectives — official study guide, skills measured as of 2026-10-27 (en-us and fr-fr pages, checked on 2026-11-16).
# `code` is the stable key referenced by question files and course sections.
# English: verbatim. French: fr-fr page with straight apostrophes; a few obvious machine-translation
# slips of the fr-fr page are corrected ("conformité" for compliance, "Magasin des requêtes",
# "masquage dynamique des données", "Microsoft Entra ID").
platform:
  - group:
      en: "Plan and deploy Azure SQL solutions"
      fr: "Planifier et déployer des solutions Azure SQL"
    objectives:
      - code: "1.1.1"
        en: "Recommend a database offering based on specific requirements"
        fr: "Recommander une offre de base de données en fonction des exigences spécifiques"
      - code: "1.1.2"
        en: "Choose an automated deployment method"
        fr: "Choisir une méthode de déploiement automatisée"
      - code: "1.1.3"
        en: "Identify use cases for Azure Arc-enabled SQL services"
        fr: "Identifier les cas d'usage pour les services SQL avec Azure Arc"
      - code: "1.1.4"
        en: "Identify use cases for Azure SQL Database in Microsoft Fabric"
        fr: "Identifier les cas d'usage pour Azure SQL Database dans Microsoft Fabric"
      - code: "1.1.5"
        en: "Plan for table partitioning"
        fr: "Planifier le partitionnement de tables"
      - code: "1.1.6"
        en: "Recommend a database sharding solution"
        fr: "Recommander une solution de sharding de base de données"
      - code: "1.1.7"
        en: "Deploy database offerings on selected platforms"
        fr: "Déployer des offres de base de données sur les plateformes sélectionnées"
      - code: "1.1.8"
        en: "Deploy hybrid SQL Server solutions"
        fr: "Déployer des solutions SQL Server hybrides"
      - code: "1.1.9"
        en: "Apply patches and updates for hybrid and infrastructure as a service (IaaS) deployment"
        fr: "Appliquer des correctifs et des mises à jour pour les déploiements hybrides et IaaS (infrastructure as a service)"
  - group:
      en: "Configure resources for scale and performance"
      fr: "Configurer les ressources pour la mise à l'échelle et les performances"
    objectives:
      - code: "1.2.1"
        en: "Configure Azure SQL Database for scale and performance"
        fr: "Configurer Azure SQL Database pour la mise à l'échelle et les performances"
      - code: "1.2.2"
        en: "Configure Azure SQL Managed Instance for scale and performance"
        fr: "Configurer Azure SQL Managed Instance pour la mise à l'échelle et les performances"
      - code: "1.2.3"
        en: "Configure SQL Server on Azure Virtual Machines for scale and performance"
        fr: "Configurer SQL Server sur les machines virtuelles Azure pour la mise à l'échelle et les performances"
      - code: "1.2.4"
        en: "Configure table partitioning"
        fr: "Configurer le partitionnement de table"
      - code: "1.2.5"
        en: "Configure data compression"
        fr: "Configurer la compression des données"
  - group:
      en: "Plan and implement a migration strategy"
      fr: "Planifier et implémenter une stratégie de migration"
    objectives:
      - code: "1.3.1"
        en: "Evaluate requirements for a migration"
        fr: "Évaluer les exigences d'une migration"
      - code: "1.3.2"
        en: "Evaluate offline or online migration strategies"
        fr: "Évaluer les stratégies de migration hors connexion ou en ligne"
      - code: "1.3.3"
        en: "Implement an online migration strategy"
        fr: "Implémenter une stratégie de migration en ligne"
      - code: "1.3.4"
        en: "Implement an offline migration strategy"
        fr: "Implémenter une stratégie de migration hors connexion"
      - code: "1.3.5"
        en: "Implement a migration to Azure"
        fr: "Implémenter une migration vers Azure"
      - code: "1.3.6"
        en: "Implement a migration between Azure SQL services"
        fr: "Implémenter une migration entre services Azure SQL"
      - code: "1.3.7"
        en: "Implement Azure SQL Managed Instance database copy and move"
        fr: "Implémenter la copie et le déplacement d'une base de données Azure SQL Managed Instance"
      - code: "1.3.8"
        en: "Troubleshoot a migration"
        fr: "Résoudre les problèmes liés à une migration"
security:
  - group:
      en: "Configure database authentication and authorization"
      fr: "Configurer l'authentification et l'autorisation des bases de données"
    objectives:
      - code: "2.1.1"
        en: "Configure Microsoft Entra ID authentication for Azure SQL Database, Azure SQL Managed Instance, and SQL Server"
        fr: "Configurer l'authentification Microsoft Entra ID pour Azure SQL Database, Azure SQL Managed Instance et SQL Server"
      - code: "2.1.2"
        en: "Configure authentication for SQL on Azure VMs and Azure SQL Managed Instance"
        fr: "Configurer l'authentification pour SQL sur des machines virtuelles Azure et Azure SQL Managed Instance"
      - code: "2.1.3"
        en: "Configure security principals"
        fr: "Configurer des principaux de sécurité"
      - code: "2.1.4"
        en: "Create users from Microsoft Entra identities"
        fr: "Créer des utilisateurs à partir d'identités Microsoft Entra"
      - code: "2.1.5"
        en: "Configure database and object-level permissions using graphical tools"
        fr: "Configurer des autorisations au niveau de la base de données et des objets à l'aide d'outils graphiques"
      - code: "2.1.6"
        en: "Apply the principle of least privilege for all securables"
        fr: "Appliquer le principe des privilèges minimum pour tous les sécurisables"
      - code: "2.1.7"
        en: "Troubleshoot authentication and authorization issues"
        fr: "Résoudre les problèmes d'authentification et d'autorisation"
      - code: "2.1.8"
        en: "Manage authentication and authorization by using T-SQL"
        fr: "Gérer l'authentification et l'autorisation à l'aide de T-SQL"
  - group:
      en: "Implement security for data at rest and data in transit"
      fr: "Implémenter la sécurité pour les données au repos et les données en transit"
    objectives:
      - code: "2.2.1"
        en: "Implement transparent data encryption (TDE)"
        fr: "Implémenter le chiffrement TDE (Transparent Data Encryption)"
      - code: "2.2.2"
        en: "Implement object-level encryption"
        fr: "Implémenter le chiffrement au niveau de l'objet"
      - code: "2.2.3"
        en: "Configure server- and database-level firewall rules"
        fr: "Configurer les règles de pare-feu au niveau du serveur et de la base de données"
      - code: "2.2.4"
        en: "Implement Always Encrypted"
        fr: "Implémenter Always Encrypted"
      - code: "2.2.5"
        en: "Implement Always Encrypted with secure enclaves"
        fr: "Implémenter Always Encrypted avec enclaves sécurisées"
      - code: "2.2.6"
        en: "Configure private links and service endpoints"
        fr: "Configurer des liens privés et des points de terminaison de service"
  - group:
      en: "Implement compliance controls for sensitive data"
      fr: "Implémenter des contrôles de conformité pour les données sensibles"
    objectives:
      - code: "2.3.1"
        en: "Apply a data classification strategy"
        fr: "Appliquer une stratégie de classification des données"
      - code: "2.3.2"
        en: "Configure server and database audits"
        fr: "Configurer les audits de serveur et de base de données"
      - code: "2.3.3"
        en: "Implement change data tracking"
        fr: "Implémenter le suivi des données modifiées"
      - code: "2.3.4"
        en: "Implement dynamic data masking"
        fr: "Implémenter le masquage dynamique des données"
      - code: "2.3.5"
        en: "Implement ledger in Azure SQL"
        fr: "Implémenter le registre dans Azure SQL"
      - code: "2.3.6"
        en: "Implement row-level security"
        fr: "Implémenter la sécurité au niveau des lignes"
performance:
  - group:
      en: "Monitor resource activity and performance"
      fr: "Monitorer l'activité et les performances des ressources"
    objectives:
      - code: "3.1.1"
        en: "Prepare an operational performance baseline"
        fr: "Préparer une base de référence des performances opérationnelles"
      - code: "3.1.2"
        en: "Determine sources for performance metrics"
        fr: "Déterminer les sources des métriques de performances"
      - code: "3.1.3"
        en: "Interpret performance metrics"
        fr: "Interpréter les métriques de performances"
      - code: "3.1.4"
        en: "Configure and monitor activity and performance"
        fr: "Configurer et monitorer l'activité et les performances"
      - code: "3.1.5"
        en: "Monitor by using database watcher"
        fr: "Surveiller à l'aide de l'observateur de base de données"
      - code: "3.1.6"
        en: "Monitor by using Extended Events"
        fr: "Monitorer à l'aide des événements étendus"
  - group:
      en: "Monitor and optimize query performance"
      fr: "Monitorer et optimiser les performances des requêtes"
    objectives:
      - code: "3.2.1"
        en: "Configure Query Store"
        fr: "Configurer le Magasin des requêtes"
      - code: "3.2.2"
        en: "Monitor by using Query Store"
        fr: "Monitorer à l'aide du Magasin des requêtes"
      - code: "3.2.3"
        en: "Identify and resolve session blocking"
        fr: "Identifier et résoudre le blocage de session"
      - code: "3.2.4"
        en: "Identify performance issues using dynamic management views (DMVs)"
        fr: "Identifier les problèmes de performances à l'aide des vues de gestion dynamique (DMV)"
      - code: "3.2.5"
        en: "Identify and implement index changes for queries"
        fr: "Identifier et implémenter les changements d'index pour les requêtes"
      - code: "3.2.6"
        en: "Recommend query construct modifications based on resource usage"
        fr: "Recommander des modifications pour la construction de requêtes en fonction de l'utilisation des ressources"
      - code: "3.2.7"
        en: "Review execution plans"
        fr: "Passer en revue les plans d'exécution"
      - code: "3.2.8"
        en: "Monitor by using Intelligent Insights"
        fr: "Monitorer en utilisant Intelligent Insights"
  - group:
      en: "Configure database solutions for optimal performance"
      fr: "Configurer des solutions de base de données pour des performances optimales"
    objectives:
      - code: "3.3.1"
        en: "Implement index maintenance tasks"
        fr: "Implémenter des tâches de maintenance d'index"
      - code: "3.3.2"
        en: "Implement statistics maintenance tasks"
        fr: "Implémenter des tâches de maintenance des statistiques"
      - code: "3.3.3"
        en: "Implement database integrity checks"
        fr: "Implémenter des vérifications de l'intégrité des bases de données"
      - code: "3.3.4"
        en: "Configure database automatic tuning"
        fr: "Configurer le réglage automatique de base de données"
      - code: "3.3.5"
        en: "Configure server settings for performance"
        fr: "Configurer les paramètres serveur pour les performances"
      - code: "3.3.6"
        en: "Configure Resource Governor for performance"
        fr: "Configurer le Resource Governor pour la performance"
      - code: "3.3.7"
        en: "Implement database-scoped configuration"
        fr: "Implémenter une configuration à l'échelle de la base de données"
      - code: "3.3.8"
        en: "Configure compute and storage resources for scaling"
        fr: "Configurer les ressources de calcul et de stockage pour la mise à l'échelle"
      - code: "3.3.9"
        en: "Identify use cases for intelligent query processing (IQP) features"
        fr: "Identifier les cas d'usage pour les fonctionnalités de traitement des requêtes intelligentes (IQP)"
automation:
  - group:
      en: "Create and manage SQL Server Agent jobs"
      fr: "Créer et gérer des travaux SQL Server Agent"
    objectives:
      - code: "4.1.1"
        en: "Manage schedules for regular maintenance jobs"
        fr: "Gérer les planifications des travaux de maintenance réguliers"
      - code: "4.1.2"
        en: "Configure job alerts and notifications"
        fr: "Configurer les alertes et les notifications relatives aux travaux"
      - code: "4.1.3"
        en: "Troubleshoot SQL Server Agent jobs"
        fr: "Résoudre les problèmes liés aux travaux SQL Server Agent"
  - group:
      en: "Automate deployment of database resources"
      fr: "Automatiser le déploiement de ressources de bases de données"
    objectives:
      - code: "4.2.1"
        en: "Automate deployment by using Azure Resource Manager (ARM) and Bicep templates"
        fr: "Automatiser le déploiement avec des modèles ARM (Azure Resource Manager) et Bicep"
      - code: "4.2.2"
        en: "Automate deployment by using Azure PowerShell"
        fr: "Automatiser le déploiement à l'aide d'Azure PowerShell"
      - code: "4.2.3"
        en: "Automate deployment by using Azure CLI"
        fr: "Automatiser le déploiement avec Azure CLI"
      - code: "4.2.4"
        en: "Monitor and troubleshoot deployments"
        fr: "Monitorer les déploiements et résoudre les problèmes inhérents"
  - group:
      en: "Create and manage database tasks in Azure"
      fr: "Créer et gérer des tâches de base de données dans Azure"
    objectives:
      - code: "4.3.1"
        en: "Create and configure elastic jobs"
        fr: "Créer et configurer des travaux élastiques"
      - code: "4.3.2"
        en: "Create and configure database tasks by using automation"
        fr: "Créer et configurer des tâches de base de données à l'aide de l'automatisation"
      - code: "4.3.3"
        en: "Configure alerts and notifications on database tasks"
        fr: "Configurer les alertes et les notifications pour les tâches de base de données"
      - code: "4.3.4"
        en: "Troubleshoot automated database tasks"
        fr: "Résoudre les problèmes liés aux tâches de base de données automatisées"
hadr:
  - group:
      en: "Plan an HA/DR strategy for database solutions"
      fr: "Planifier une stratégie de haute disponibilité/récupération d'urgence pour les solutions de base de données"
    objectives:
      - code: "5.1.1"
        en: "Recommend HA/DR strategy based on Recovery Point Objective/Recovery Time Objective (RPO/RTO) requirements"
        fr: "Recommander une stratégie HA/DR en fonction des impératifs RPO/RTO (objectif de point de récupération/objectif de temps de récupération)"
      - code: "5.1.2"
        en: "Evaluate HA/DR for hybrid deployments"
        fr: "Évaluer les solutions HA/DR pour les déploiements hybrides"
      - code: "5.1.3"
        en: "Evaluate Azure-specific HA/DR solutions"
        fr: "Évaluer les solutions HA/DR spécifiques à Azure"
      - code: "5.1.4"
        en: "Plan a testing procedure for an HA/DR solution"
        fr: "Planifier une procédure de test pour une solution haute disponibilité/récupération d'urgence"
  - group:
      en: "Plan and perform backup and restore of a database"
      fr: "Planifier et effectuer une sauvegarde et une restauration d'une base de données"
    objectives:
      - code: "5.2.1"
        en: "Recommend a database backup and restore strategy"
        fr: "Recommander une stratégie de sauvegarde et de restauration de base de données"
      - code: "5.2.2"
        en: "Perform a database backup by using native tools"
        fr: "Effectuer une sauvegarde de base de données à l'aide d'outils natifs"
      - code: "5.2.3"
        en: "Perform a database restore by using native tools"
        fr: "Effectuer une restauration de base de données à l'aide d'outils natifs"
      - code: "5.2.4"
        en: "Perform a database restore to a point in time"
        fr: "Effectuer une restauration de base de données à un point dans le temps"
      - code: "5.2.5"
        en: "Configure long-term backup retention"
        fr: "Configurer la rétention des sauvegardes à long terme"
      - code: "5.2.6"
        en: "Backup and restore a database by using T-SQL"
        fr: "Sauvegarder et restaurer une base de données à l'aide de T-SQL"
      - code: "5.2.7"
        en: "Backup to and restore from cloud storage"
        fr: "Sauvegarde vers et restauration à partir du stockage cloud"
  - group:
      en: "Configure HA/DR for database solutions"
      fr: "Configurer HA/DR pour des solutions de base de données"
    objectives:
      - code: "5.3.1"
        en: "Configure active geo-replication"
        fr: "Configurer la géoréplication active"
      - code: "5.3.2"
        en: "Configure Always On availability groups on SQL Managed Instance and Azure virtual machines"
        fr: "Configurer des groupes de disponibilité Always On sur SQL Managed Instance et des machines virtuelles Azure"
      - code: "5.3.3"
        en: "Configure failover groups"
        fr: "Configurer des groupes de basculement"
      - code: "5.3.4"
        en: "Configure Always On Failover Cluster Instances on Azure virtual machines"
        fr: "Configurer des instances de cluster de basculement Always On sur les machines virtuelles Azure"
      - code: "5.3.5"
        en: "Configure log shipping"
        fr: "Configurer la copie des journaux de transaction"
      - code: "5.3.6"
        en: "Monitor an HA/DR solution"
        fr: "Monitorer une solution HA/DR"
      - code: "5.3.7"
        en: "Troubleshoot an HA/DR solution"
        fr: "Résoudre les problèmes liés à une solution HA/DR"
