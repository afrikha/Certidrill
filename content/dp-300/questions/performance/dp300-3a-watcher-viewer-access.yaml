id: dp300-3a-watcher-viewer-access
objective: "3.1.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Tailspin has a watcher named **wch-tailspin** that monitors 25 Azure SQL databases. The watcher stores its data in a database named **wchdata** on an Azure Data Explorer cluster named **adx-tailspin**.

    A group of performance analysts must run their own KQL queries against the data collected by wch-tailspin. The solution must follow the principle of least privilege.

    What should you grant to the analysts?
  fr: |
    Tailspin dispose d'un observateur nommé **wch-tailspin** qui surveille 25 bases de données Azure SQL. L'observateur stocke ses données dans une base de données nommée **wchdata** sur un cluster Azure Data Explorer nommé **adx-tailspin**.

    Un groupe d'analystes des performances doit exécuter ses propres requêtes KQL sur les données collectées par wch-tailspin. La solution doit respecter le principe du moindre privilège.

    Que devez-vous accorder aux analystes ?
body:
  options:
    - { id: a, text: { en: "The Admin role on the wchdata database", fr: "Le rôle Admin sur la base de données wchdata" } }
    - { id: b, text: { en: "The Viewer role on the wchdata database", fr: "Le rôle Viewer sur la base de données wchdata" } }
    - { id: c, text: { en: "The Reader Azure role on the adx-tailspin cluster", fr: "Le rôle Azure Reader sur le cluster adx-tailspin" } }
    - { id: d, text: { en: "The ##MS_ServerPerformanceStateReader## role on each logical server", fr: "Le rôle ##MS_ServerPerformanceStateReader## sur chaque serveur logique" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      The collected data lives in the Azure Data Explorer database, so access is granted with a database role of the data store. Users who only need to view and query the data get the Viewer role; the Admin role is the one the watcher identity itself needs to ingest data.
    fr: |
      Les données collectées se trouvent dans la base de données Azure Data Explorer : l'accès s'accorde avec un rôle de base de données du magasin de données. Les utilisateurs qui doivent seulement consulter et interroger les données reçoivent le rôle Viewer ; le rôle Admin est celui dont l'identité de l'observateur a besoin pour ingérer les données.
  options:
    a: { en: "Admin lets the analysts change the database, which is more than they need.", fr: "Admin permet aux analystes de modifier la base de données, ce qui dépasse leurs besoins." }
    c: { en: "An Azure role on the cluster acts on the control plane; it doesn't grant the right to query the data of a database.", fr: "Un rôle Azure sur le cluster agit sur le plan de contrôle ; il n'accorde pas le droit d'interroger les données d'une base." }
    d: { en: "This role lets a principal read DMVs on the SQL targets; it gives no access to the data already collected in Azure Data Explorer.", fr: "Ce rôle permet de lire les DMV sur les cibles SQL ; il ne donne aucun accès aux données déjà collectées dans Azure Data Explorer." }
references:
  - title: Create and configure a watcher (preview)
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database-watcher-manage
