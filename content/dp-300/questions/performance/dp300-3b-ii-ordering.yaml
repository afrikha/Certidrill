id: dp300-3b-ii-ordering
objective: "3.2.8"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    You have an Azure SQL database named **BillingDB** in the Japan East region. No Log Analytics workspace exists in the subscription.

    You need the database administrators to receive an email when Intelligent Insights detects a performance issue in BillingDB.

    Which three actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Vous disposez d'une base de données Azure SQL nommée **BillingDB** dans la région Japan East. Aucun espace de travail Log Analytics n'existe dans l'abonnement.

    Les administrateurs de bases de données doivent recevoir un e-mail quand Intelligent Insights détecte un problème de performances dans BillingDB.

    Quelles sont les trois actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - { id: ws, text: { en: "Create a Log Analytics workspace.", fr: "Créer un espace de travail Log Analytics." } }
    - { id: diag, text: { en: "Add a diagnostic setting to BillingDB that sends the SQLInsights category to the workspace.", fr: "Ajouter à BillingDB un paramètre de diagnostic qui envoie la catégorie SQLInsights vers l'espace de travail." } }
    - { id: alert, text: { en: "Create a log search alert rule on the workspace that queries the SQLInsights records and uses an action group that sends email.", fr: "Créer, sur l'espace de travail, une règle d'alerte de recherche dans les journaux qui interroge les enregistrements SQLInsights et utilise un groupe d'actions qui envoie un e-mail." } }
    - { id: tuning, text: { en: "Enable automatic tuning on BillingDB.", fr: "Activer le réglage automatique sur BillingDB." } }
    - { id: eh, text: { en: "Create an Azure Event Hubs namespace.", fr: "Créer un espace de noms Azure Event Hubs." } }
    - { id: qs, text: { en: "Set Query Store on BillingDB to READ_ONLY.", fr: "Passer le Magasin des requêtes de BillingDB en READ_ONLY." } }
answer:
  sequence: [ ws, diag, alert ]
explanation:
  correct:
    en: |
      The diagnostic setting needs an existing destination, so you create the workspace first, then stream the SQLInsights log to it from the database's Diagnostic settings page. Once the records arrive in the workspace, a log search alert rule can query them and notify the administrators through an action group.
    fr: |
      Le paramètre de diagnostic exige une destination existante : vous créez donc d'abord l'espace de travail, puis vous y diffusez le journal SQLInsights depuis la page Paramètres de diagnostic de la base. Une fois les enregistrements arrivés dans l'espace de travail, une règle d'alerte de recherche dans les journaux peut les interroger et prévenir les administrateurs via un groupe d'actions.
  options:
    tuning: { en: "Automatic tuning applies corrections; it isn't needed for Intelligent Insights to detect and log issues.", fr: "Le réglage automatique applique des corrections ; il n'est pas nécessaire pour qu'Intelligent Insights détecte et journalise les problèmes." }
    eh: { en: "Event Hubs is for streaming to custom or third-party tools; email alerts are simpler with Log Analytics.", fr: "Event Hubs sert à la diffusion vers des outils personnalisés ou tiers ; les alertes par e-mail sont plus simples avec Log Analytics." }
    qs: { en: "Setting Query Store to READ_ONLY stops capturing new query data and doesn't help send alerts.", fr: "Passer le Magasin des requêtes en READ_ONLY arrête la capture de nouvelles données de requêtes et n'aide pas à envoyer des alertes." }
references:
  - title: Intelligent Insights to monitor and troubleshoot database performance (preview)
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/intelligent-insights-overview
