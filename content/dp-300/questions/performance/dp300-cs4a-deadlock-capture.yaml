id: dp300-cs4a-deadlock-capture
objective: "3.1.6"
type: multi
caseStudy: dp300-cs4a-humongous-insurance
difficulty: 1
status: draft
stem:
  en: |
    You need to meet the monitoring requirement.

    Which two actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez satisfaire l'exigence de supervision.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text: { en: "In each user database of MI-PROD, create a database scoped credential that stores the SAS token.", fr: "Dans chaque base de données utilisateur de MI-PROD, créer des informations d'identification délimitées à la base de données qui stockent le jeton SAS." }
    - id: b
      text: { en: "In master, create a server credential named with the URL of the xevents container that stores the SAS token.", fr: "Dans master, créer des informations d'identification de serveur nommées avec l'URL du conteneur xevents et qui stockent le jeton SAS." }
    - id: c
      text: { en: "Create an event session ON SERVER that captures xml_deadlock_report to a ring_buffer target.", fr: "Créer une session d'événements ON SERVER qui capture xml_deadlock_report dans une cible ring_buffer." }
    - id: d
      text: { en: "Create an event session ON SERVER that captures xml_deadlock_report to an event_file target in xevents.", fr: "Créer une session d'événements ON SERVER qui capture xml_deadlock_report dans une cible event_file dans xevents." }
    - id: e
      text: { en: "Create an event session ON SERVER that captures xml_deadlock_report to an event_file target on drive D.", fr: "Créer une session d'événements ON SERVER qui capture xml_deadlock_report dans une cible event_file sur le lecteur D." }
answer:
  optionIds: [b, d]
explanation:
  correct:
    en: |
      In SQL Managed Instance, the event_file target always writes blobs to Azure Storage. With a SAS token, the instance uses a server-scoped credential whose name is the container URL and whose identity is SHARED ACCESS SIGNATURE. A server-scoped event session, the recommended scope on SQL Managed Instance, then captures xml_deadlock_report to an event_file target whose file name is a blob URL in xevents, so the events persist after a restart.
    fr: |
      Dans SQL Managed Instance, la cible event_file écrit toujours des objets blob dans Stockage Azure. Avec un jeton SAS, l'instance utilise des informations d'identification de niveau serveur dont le nom est l'URL du conteneur et dont l'identité est SHARED ACCESS SIGNATURE. Une session d'événements de niveau serveur, l'étendue recommandée sur SQL Managed Instance, capture ensuite xml_deadlock_report dans une cible event_file dont le nom de fichier est une URL d'objet blob dans xevents : les événements sont conservés après un redémarrage.
  options:
    a: { en: "Database scoped credentials are used by Azure SQL Database, where event sessions are database-scoped; SQL Managed Instance uses a server-scoped credential.", fr: "Les informations d'identification délimitées à la base de données sont utilisées par Azure SQL Database, où les sessions d'événements sont limitées à la base de données ; SQL Managed Instance utilise des informations d'identification de niveau serveur." }
    c: { en: "A ring_buffer target keeps events in memory only; they are lost when the session stops or the instance restarts.", fr: "Une cible ring_buffer ne conserve les événements qu'en mémoire ; ils sont perdus quand la session s'arrête ou que l'instance redémarre." }
    e: { en: "SQL Managed Instance can't write an event_file target to a local disk path; the target must be a blob in Azure Storage.", fr: "SQL Managed Instance ne peut pas écrire une cible event_file dans un chemin de disque local ; la cible doit être un objet blob dans Stockage Azure." }
references:
  - title: Extended Events in Azure SQL - Azure SQL Database & Azure SQL Managed Instance & SQL database in Fabric
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/xevent-db-diff-from-svr
