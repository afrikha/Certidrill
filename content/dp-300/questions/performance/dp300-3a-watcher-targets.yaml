id: dp300-3a-watcher-targets
objective: "3.1.5"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    Litware has the following resources in one Microsoft Entra tenant:

    | Name | Type |
    | --- | --- |
    | DB1 | Azure SQL database in the Hyperscale service tier |
    | Pool1 | Elastic pool on an Azure SQL logical server |
    | MI1 | Azure SQL managed instance |
    | SQLVM1 | SQL Server 2022 on an Azure virtual machine |
    | ARC1 | Azure Arc-enabled SQL Server instance in the on-premises datacenter |

    Litware uses database watcher to monitor its SQL estate.

    Which three resources can be SQL targets of a watcher?

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware dispose des ressources suivantes dans un même locataire Microsoft Entra :

    | Nom | Type |
    | --- | --- |
    | DB1 | Base de données Azure SQL dans le niveau de service Hyperscale |
    | Pool1 | Pool élastique sur un serveur logique Azure SQL |
    | MI1 | Instance managée Azure SQL |
    | SQLVM1 | SQL Server 2022 sur une machine virtuelle Azure |
    | ARC1 | Instance SQL Server activée par Azure Arc dans le centre de données local |

    Litware utilise l'observateur de base de données pour surveiller son parc SQL.

    Quelles sont les trois ressources qui peuvent être des cibles SQL d'un observateur ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 3
  options:
    - { id: a, text: DB1 }
    - { id: b, text: Pool1 }
    - { id: c, text: MI1 }
    - { id: d, text: SQLVM1 }
    - { id: e, text: ARC1 }
answer: { optionIds: [ a, b, c ] }
explanation:
  correct:
    en: |
      Database watcher monitors Azure SQL Database (single databases and elastic pools, in every service tier including Hyperscale, DTU or vCore, provisioned or serverless) and Azure SQL Managed Instance. Targets can be in any subscription of the same Microsoft Entra tenant.
    fr: |
      L'observateur de base de données surveille Azure SQL Database (bases uniques et pools élastiques, dans tous les niveaux de service dont Hyperscale, en DTU ou en vCore, provisionnés ou serverless) et Azure SQL Managed Instance. Les cibles peuvent se trouver dans n'importe quel abonnement du même locataire Microsoft Entra.
  options:
    d: { en: "SQL Server on Azure Virtual Machines isn't a supported target of database watcher.", fr: "SQL Server sur des machines virtuelles Azure n'est pas une cible prise en charge par l'observateur de base de données." }
    e: { en: "Arc-enabled SQL Server isn't a supported target of database watcher.", fr: "SQL Server activé par Azure Arc n'est pas une cible prise en charge par l'observateur de base de données." }
references:
  - title: Monitor Azure SQL workloads with database watcher (preview)
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database-watcher-overview
