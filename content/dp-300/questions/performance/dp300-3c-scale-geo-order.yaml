id: dp300-3c-scale-geo-order
objective: "3.3.8"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    You have an Azure SQL database named SalesDB on a logical server named sql-weu. SalesDB uses the General Purpose service tier with 4 vCores. SalesDB has an active geo-replication secondary on a logical server named sql-neu.

    You need to move both databases to the Business Critical service tier with 8 vCores. The solution must keep geo-replication and must not fail over SalesDB.

    Which three actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Vous disposez d'une base de données Azure SQL nommée SalesDB sur un serveur logique nommé sql-weu. SalesDB utilise le niveau de service General Purpose avec 4 vCores. SalesDB possède un secondaire de géoréplication active sur un serveur logique nommé sql-neu.

    Vous devez passer les deux bases de données au niveau de service Business Critical avec 8 vCores. La solution doit conserver la géoréplication et ne doit pas faire basculer SalesDB.

    Quelles sont les trois actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - { id: sec, text: { en: "Scale the secondary database on sql-neu to BC_Gen5_8.", fr: "Mettre à l'échelle la base secondaire de sql-neu vers BC_Gen5_8." } }
    - { id: wait, text: { en: "Wait until the scaling operation of the secondary database completes.", fr: "Attendre la fin de l'opération de mise à l'échelle de la base secondaire." } }
    - { id: prim, text: { en: "Scale the primary database on sql-weu to BC_Gen5_8.", fr: "Mettre à l'échelle la base primaire de sql-weu vers BC_Gen5_8." } }
    - { id: remove, text: { en: "Remove the geo-replication link between the databases.", fr: "Supprimer le lien de géoréplication entre les bases de données." } }
    - { id: failover, text: { en: "Perform a planned failover to the secondary database.", fr: "Effectuer un basculement planifié vers la base secondaire." } }
    - { id: maxsize, text: { en: "Increase the max size of the secondary database.", fr: "Augmenter la taille maximale de la base secondaire." } }
answer:
  sequence: [ sec, wait, prim ]
explanation:
  correct:
    en: |
      When databases are in a geo-replication relationship, you upgrade the secondary first and then the primary; upgrading to another edition requires this order. Waiting for the secondary operation to complete (for example with `Get-AzSqlDatabaseActivity` or `sys.dm_operation_status`) makes sure the primary isn't upgraded first. For a downgrade, the order is the reverse.
    fr: |
      Quand des bases sont dans une relation de géoréplication, vous mettez d'abord à niveau le secondaire, puis le primaire ; un passage à une autre édition exige cet ordre. Attendre la fin de l'opération sur le secondaire (par exemple avec `Get-AzSqlDatabaseActivity` ou `sys.dm_operation_status`) garantit que le primaire n'est pas mis à niveau en premier. Pour une rétrogradation, l'ordre est inverse.
  options:
    remove: { en: "Removing the link breaks geo-replication, which the requirements forbid.", fr: "Supprimer le lien rompt la géoréplication, ce que les exigences interdisent." }
    failover: { en: "A failover isn't needed to scale and is forbidden by the requirements.", fr: "Un basculement n'est pas nécessaire pour la mise à l'échelle et il est interdit par les exigences." }
    maxsize: { en: "The storage size of a geo-secondary follows the primary; you change it on the primary.", fr: "La taille de stockage d'un géo-secondaire suit le primaire ; vous la modifiez sur le primaire." }
references:
  - title: Scale single database resources in Azure SQL Database
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/single-database-scale
