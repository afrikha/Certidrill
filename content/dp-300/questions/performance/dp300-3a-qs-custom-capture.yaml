id: dp300-3a-qs-custom-capture
objective: "3.2.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    You have an Azure SQL database named **DB1**. The application generates thousands of distinct ad hoc queries, and most of them run only a few times. Query Store fills up quickly.

    You need to change the Query Store capture so that a query is captured when it runs at least 50 times within one hour. The default compile and execution CPU thresholds of the capture policy must stay unchanged.

    Which Transact-SQL statement should you run?
  fr: |
    Vous disposez d'une base de données Azure SQL nommée **DB1**. L'application génère des milliers de requêtes ad hoc distinctes, dont la plupart ne s'exécutent que quelques fois. Le Magasin des requêtes se remplit rapidement.

    Vous devez modifier la capture du Magasin des requêtes afin qu'une requête soit capturée lorsqu'elle s'exécute au moins 50 fois en une heure. Les seuils par défaut de processeur de compilation et d'exécution de la stratégie de capture doivent rester inchangés.

    Quelle instruction Transact-SQL devez-vous exécuter ?
body:
  options:
    - { id: a, text: "ALTER DATABASE DB1 SET QUERY_STORE (QUERY_CAPTURE_MODE = AUTO, QUERY_CAPTURE_POLICY = (STALE_CAPTURE_POLICY_THRESHOLD = 1 HOURS, EXECUTION_COUNT = 50));" }
    - { id: b, text: "ALTER DATABASE DB1 SET QUERY_STORE (QUERY_CAPTURE_MODE = CUSTOM, QUERY_CAPTURE_POLICY = (STALE_CAPTURE_POLICY_THRESHOLD = 50 HOURS, EXECUTION_COUNT = 1));" }
    - { id: c, text: "ALTER DATABASE DB1 SET QUERY_STORE (QUERY_CAPTURE_MODE = CUSTOM, QUERY_CAPTURE_POLICY = (STALE_CAPTURE_POLICY_THRESHOLD = 1 HOURS, EXECUTION_COUNT = 50));" }
    - { id: d, text: "ALTER DATABASE DB1 SET QUERY_STORE (QUERY_CAPTURE_MODE = ALL, INTERVAL_LENGTH_MINUTES = 60, MAX_PLANS_PER_QUERY = 50);" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      A QUERY_CAPTURE_POLICY applies only when QUERY_CAPTURE_MODE = CUSTOM. STALE_CAPTURE_POLICY_THRESHOLD sets the evaluation period (1 hour to 7 days, default 1 day) and EXECUTION_COUNT the number of executions within it. The thresholds you don't specify, TOTAL_COMPILE_CPU_TIME_MS (1000) and TOTAL_EXECUTION_CPU_TIME_MS (100), keep their defaults, and a query is captured when it reaches any one threshold.
    fr: |
      Une QUERY_CAPTURE_POLICY ne s'applique que lorsque QUERY_CAPTURE_MODE = CUSTOM. STALE_CAPTURE_POLICY_THRESHOLD définit la période d'évaluation (de 1 heure à 7 jours, 1 jour par défaut) et EXECUTION_COUNT le nombre d'exécutions dans cette période. Les seuils non précisés, TOTAL_COMPILE_CPU_TIME_MS (1000) et TOTAL_EXECUTION_CPU_TIME_MS (100), gardent leur valeur par défaut, et une requête est capturée dès qu'elle atteint l'un des seuils.
  options:
    a: { en: "With AUTO, the engine uses its own thresholds; a capture policy requires CUSTOM.", fr: "Avec AUTO, le moteur utilise ses propres seuils ; une stratégie de capture exige CUSTOM." }
    b: { en: "This captures a query after a single execution in a 50-hour period, the opposite of the requirement.", fr: "Cette instruction capture une requête dès une seule exécution sur une période de 50 heures, l'inverse de l'exigence." }
    d: { en: "ALL captures every query, and MAX_PLANS_PER_QUERY limits plans per query, not the number of executions needed for capture.", fr: "ALL capture toutes les requêtes, et MAX_PLANS_PER_QUERY limite le nombre de plans par requête, pas le nombre d'exécutions nécessaires à la capture." }
references:
  - title: ALTER DATABASE SET options (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/statements/alter-database-transact-sql-set-options
