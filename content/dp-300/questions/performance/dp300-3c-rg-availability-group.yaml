id: dp300-3c-rg-availability-group
objective: "3.3.6"
type: single
difficulty: 3
status: draft
stem:
  en: |
    You have two Azure virtual machines named SQLVM8 and SQLVM9 that run SQL Server 2022 Enterprise. SQLVM8 and SQLVM9 host the replicas of an Always On availability group named AG1 that contains a database named SalesDB.

    On SQLVM8, the primary replica, you created a resource pool, a workload group and a classifier function in the master database, and the reporting sessions are limited as expected. After a planned failover to SQLVM9, the reporting sessions are no longer limited.

    You need the reporting sessions to be limited whichever replica is the primary.

    What should you do?
  fr: |
    Vous disposez de deux machines virtuelles Azure nommées SQLVM8 et SQLVM9 qui exécutent SQL Server 2022 Enterprise. SQLVM8 et SQLVM9 hébergent les réplicas d'un groupe de disponibilité Always On nommé AG1 qui contient une base de données nommée SalesDB.

    Sur SQLVM8, le réplica principal, vous avez créé un pool de ressources, un groupe de charges de travail et une fonction de classification dans la base master, et les sessions de rapports sont limitées comme prévu. Après un basculement planifié vers SQLVM9, les sessions de rapports ne sont plus limitées.

    Les sessions de rapports doivent être limitées quel que soit le réplica principal.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Run ALTER RESOURCE GOVERNOR RECONFIGURE on SQLVM8 after each failover.", fr: "Exécuter ALTER RESOURCE GOVERNOR RECONFIGURE sur SQLVM8 après chaque basculement." } }
    - { id: b, text: { en: "Re-create the classifier function in SalesDB so that it fails over with the database.", fr: "Recréer la fonction de classification dans SalesDB pour qu'elle bascule avec la base de données." } }
    - { id: c, text: { en: "Create the same pool, group and classifier function on SQLVM9, and then reconfigure Resource Governor on SQLVM9.", fr: "Créer le même pool, le même groupe et la même fonction de classification sur SQLVM9, puis reconfigurer Resource Governor sur SQLVM9." } }
    - { id: d, text: { en: "Set the IMPORTANCE option of the reporting workload group to LOW on SQLVM8.", fr: "Définir l'option IMPORTANCE du groupe de charges de travail de rapports sur LOW sur SQLVM8." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      In SQL Server, the Resource Governor configuration is stored per instance and isn't propagated from the primary replica to the secondary replicas of an availability group. Microsoft recommends configuring Resource Governor identically on every instance that hosts a replica, and applying it with ALTER RESOURCE GOVERNOR RECONFIGURE. Azure SQL Managed Instance differs: its configuration propagates to secondaries.
    fr: |
      Dans SQL Server, la configuration Resource Governor est stockée par instance et n'est pas propagée du réplica principal vers les réplicas secondaires d'un groupe de disponibilité. Microsoft recommande de configurer Resource Governor de façon identique sur chaque instance qui héberge un réplica, et de l'appliquer avec ALTER RESOURCE GOVERNOR RECONFIGURE. Azure SQL Managed Instance diffère : sa configuration est propagée aux secondaires.
  options:
    a: { en: "After the failover, the sessions connect to SQLVM9, where no configuration exists; reconfiguring SQLVM8 has no effect on them.", fr: "Après le basculement, les sessions se connectent à SQLVM9, où aucune configuration n'existe ; reconfigurer SQLVM8 n'a aucun effet sur elles." }
    b: { en: "The classifier function must be created in the master database; it can't be registered from a user database.", fr: "La fonction de classification doit être créée dans la base master ; elle ne peut pas être inscrite depuis une base utilisateur." }
    d: { en: "IMPORTANCE only changes priority between groups of the same pool on SQLVM8; SQLVM9 still has no configuration.", fr: "IMPORTANCE ne change que la priorité entre groupes d'un même pool sur SQLVM8 ; SQLVM9 n'a toujours aucune configuration." }
references:
  - title: Resource governor
    url: https://learn.microsoft.com/en-us/sql/relational-databases/resource-governor/resource-governor
