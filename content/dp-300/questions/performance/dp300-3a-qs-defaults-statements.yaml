id: dp300-3a-qs-defaults-statements
objective: "3.2.1"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    Northwind runs databases on Azure SQL Database and on a SQL Server 2019 instance hosted on an Azure virtual machine. You are reviewing the Query Store configuration of these databases.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind exécute des bases de données sur Azure SQL Database et sur une instance SQL Server 2019 hébergée sur une machine virtuelle Azure. Vous examinez la configuration du Magasin des requêtes de ces bases.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: Query Store is enabled by default on a new Azure SQL database.
        fr: Le Magasin des requêtes est activé par défaut sur une nouvelle base de données Azure SQL.
    - id: s2
      text:
        en: Query Store is enabled by default on a new database of the SQL Server 2019 instance.
        fr: Le Magasin des requêtes est activé par défaut sur une nouvelle base de données de l'instance SQL Server 2019.
    - id: s3
      text:
        en: You can disable Query Store on an Azure SQL database by running ALTER DATABASE with SET QUERY_STORE = OFF.
        fr: Vous pouvez désactiver le Magasin des requêtes sur une base de données Azure SQL en exécutant ALTER DATABASE avec SET QUERY_STORE = OFF.
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: |
      Query Store is on by default for new databases in Azure SQL Database, Azure SQL Managed Instance and SQL Server 2022 and later, but not in SQL Server 2016, 2017 or 2019, where you enable it per database. In Azure SQL Database, Query Store can't be disabled: SET QUERY_STORE = OFF returns a warning that it isn't supported.
    fr: |
      Le Magasin des requêtes est activé par défaut pour les nouvelles bases d'Azure SQL Database, d'Azure SQL Managed Instance et de SQL Server 2022 et versions ultérieures, mais pas dans SQL Server 2016, 2017 ou 2019, où vous l'activez base par base. Dans Azure SQL Database, le Magasin des requêtes ne peut pas être désactivé : SET QUERY_STORE = OFF renvoie un avertissement indiquant que ce n'est pas pris en charge.
references:
  - title: Monitor performance by using the Query Store
    url: https://learn.microsoft.com/en-us/sql/relational-databases/performance/monitoring-performance-by-using-the-query-store
  - title: ALTER DATABASE SET options (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/statements/alter-database-transact-sql-set-options
