id: dp300-3a-source-qs-wait-logs
objective: "3.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have an Azure SQL database named **DB1** that uses the default Query Store settings, and a Log Analytics workspace named **LAW1**.

    You need the wait statistics that Query Store records for each query of DB1 to be available in LAW1, so that you can analyze them with KQL.

    What should you do?
  fr: |
    Vous disposez d'une base de données Azure SQL nommée **DB1** qui utilise les paramètres par défaut du Magasin des requêtes, et d'un espace de travail Log Analytics nommé **LAW1**.

    Les statistiques d'attente que le Magasin des requêtes enregistre pour chaque requête de DB1 doivent être disponibles dans LAW1 afin que vous puissiez les analyser en KQL.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Create a diagnostic setting on DB1 that sends the QueryStoreWaitStatistics category to LAW1.", fr: "Créer sur DB1 un paramètre de diagnostic qui envoie la catégorie QueryStoreWaitStatistics vers LAW1." } }
    - { id: b, text: { en: "Create a data collection rule that collects the wait statistics of DB1 and sends them to LAW1.", fr: "Créer une règle de collecte de données qui collecte les statistiques d'attente de DB1 et les envoie vers LAW1." } }
    - { id: c, text: { en: "Set WAIT_STATS_CAPTURE_MODE to ON in the Query Store options of DB1.", fr: "Définir WAIT_STATS_CAPTURE_MODE sur ON dans les options du Magasin des requêtes de DB1." } }
    - { id: d, text: { en: "Create a metric alert rule on DB1 whose action group writes to LAW1.", fr: "Créer sur DB1 une règle d'alerte de métrique dont le groupe d'actions écrit dans LAW1." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Resource logs of Azure SQL Database, such as QueryStoreWaitStatistics or QueryStoreRuntimeStatistics, aren't stored anywhere until you create a diagnostic setting. The setting streams the selected categories to a Log Analytics workspace, where they land in the AzureDiagnostics table.
    fr: |
      Les journaux de ressources d'Azure SQL Database, comme QueryStoreWaitStatistics ou QueryStoreRuntimeStatistics, ne sont stockés nulle part tant que vous ne créez pas de paramètre de diagnostic. Le paramètre envoie les catégories sélectionnées vers un espace de travail Log Analytics, où elles arrivent dans la table AzureDiagnostics.
  options:
    b: { en: "Data collection rules are used with the Azure Monitor Agent on machines; a PaaS database sends its logs through diagnostic settings.", fr: "Les règles de collecte de données s'utilisent avec l'agent Azure Monitor sur des machines ; une base de données PaaS envoie ses journaux par des paramètres de diagnostic." }
    c: { en: "WAIT_STATS_CAPTURE_MODE is already ON by default, and it only records waits inside Query Store, not in LAW1.", fr: "WAIT_STATS_CAPTURE_MODE est déjà sur ON par défaut, et il n'enregistre les attentes que dans le Magasin des requêtes, pas dans LAW1." }
    d: { en: "An alert rule evaluates a signal and notifies; it doesn't export Query Store data to a workspace.", fr: "Une règle d'alerte évalue un signal et notifie ; elle n'exporte pas les données du Magasin des requêtes vers un espace de travail." }
references:
  - title: Configure streaming export of Azure SQL Database and SQL Managed Instance diagnostic telemetry
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/metrics-diagnostic-telemetry-logging-streaming-export-configure
