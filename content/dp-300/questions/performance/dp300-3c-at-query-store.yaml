id: dp300-3c-at-query-store
objective: "3.3.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have an Azure virtual machine that runs SQL Server 2019 and hosts a database named LoansDB. LoansDB was migrated from SQL Server 2016 with its default database options.

    You run the following statement:

    `ALTER DATABASE LoansDB SET AUTOMATIC_TUNING (FORCE_LAST_GOOD_PLAN = ON);`

    In `sys.database_automatic_tuning_options`, the desired state of FORCE_LAST_GOOD_PLAN is ON, but the actual state is OFF. Plan regressions in LoansDB aren't corrected.

    You need to make sure that automatic plan correction works for LoansDB.

    What should you do?
  fr: |
    Vous disposez d'une machine virtuelle Azure qui exécute SQL Server 2019 et héberge une base de données nommée LoansDB. LoansDB a été migrée depuis SQL Server 2016 avec ses options de base de données par défaut.

    Vous exécutez l'instruction suivante :

    `ALTER DATABASE LoansDB SET AUTOMATIC_TUNING (FORCE_LAST_GOOD_PLAN = ON);`

    Dans `sys.database_automatic_tuning_options`, l'état souhaité de FORCE_LAST_GOOD_PLAN est ON, mais l'état réel est OFF. Les régressions de plan de LoansDB ne sont pas corrigées.

    Vous devez vous assurer que la correction automatique des plans fonctionne pour LoansDB.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Start the SQL Server Agent service and set it to start automatically.", fr: "Démarrer le service SQL Server Agent et le configurer en démarrage automatique." } }
    - { id: b, text: { en: "Raise the compatibility level of LoansDB to 150.", fr: "Relever le niveau de compatibilité de LoansDB à 150." } }
    - { id: c, text: { en: "Enable Query Store on LoansDB in READ_WRITE mode.", fr: "Activer le Magasin des requêtes sur LoansDB en mode READ_WRITE." } }
    - { id: d, text: { en: "Enable Resource Governor and register a classifier function.", fr: "Activer Resource Governor et inscrire une fonction de classification." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Automatic plan correction detects plan choice regressions from the execution history that Query Store captures, so Query Store must be enabled and able to write. Query Store isn't enabled by default for databases created in SQL Server 2016 or 2019; once it runs in READ_WRITE mode, the actual state of FORCE_LAST_GOOD_PLAN follows the desired state.
    fr: |
      La correction automatique des plans détecte les régressions de choix de plan à partir de l'historique d'exécution capturé par le Magasin des requêtes, qui doit donc être activé et pouvoir écrire. Le Magasin des requêtes n'est pas activé par défaut pour les bases créées dans SQL Server 2016 ou 2019 ; une fois en mode READ_WRITE, l'état réel de FORCE_LAST_GOOD_PLAN suit l'état souhaité.
  options:
    a: { en: "Automatic tuning is performed by the Database Engine; it doesn't depend on SQL Server Agent jobs.", fr: "Le réglage automatique est effectué par le moteur de base de données ; il ne dépend pas des travaux SQL Server Agent." }
    b: { en: "Automatic plan correction is available in SQL Server 2017 and later; it doesn't require a specific compatibility level.", fr: "La correction automatique des plans est disponible à partir de SQL Server 2017 ; elle n'exige pas de niveau de compatibilité particulier." }
    d: { en: "Resource Governor limits resources for workloads; it plays no part in plan regression detection.", fr: "Resource Governor limite les ressources des charges de travail ; il ne joue aucun rôle dans la détection des régressions de plan." }
references:
  - title: Automatic tuning
    url: https://learn.microsoft.com/en-us/sql/relational-databases/automatic-tuning/automatic-tuning
