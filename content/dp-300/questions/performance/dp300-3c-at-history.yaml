id: dp300-3c-at-history
objective: "3.3.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have an Azure SQL Database logical server named sql-fin that hosts 12 databases. Automatic tuning is enabled for all the databases.

    The compliance team requires a record of every automatic tuning action for the last 180 days. The records must be queryable by using Kusto Query Language (KQL).

    What should you do?
  fr: |
    Vous disposez d'un serveur logique Azure SQL Database nommé sql-fin qui héberge 12 bases de données. Le réglage automatique est activé pour toutes les bases.

    L'équipe de conformité exige un historique de toutes les actions de réglage automatique des 180 derniers jours. Cet historique doit pouvoir être interrogé avec le langage KQL (Kusto Query Language).

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Configure Query Store on each database with a stale query threshold of 180 days.", fr: "Configurer le Magasin des requêtes de chaque base avec un seuil de requêtes obsolètes de 180 jours." } }
    - { id: b, text: { en: "Enable auditing on sql-fin and send the audit logs to a Log Analytics workspace.", fr: "Activer l'audit sur sql-fin et envoyer les journaux d'audit vers un espace de travail Log Analytics." } }
    - { id: c, text: { en: "Configure long-term backup retention of 180 days for each database.", fr: "Configurer une conservation des sauvegardes à long terme de 180 jours pour chaque base." } }
    - { id: d, text: { en: "Stream the AutomaticTuning diagnostic category of each database to a Log Analytics workspace.", fr: "Diffuser la catégorie de diagnostic AutomaticTuning de chaque base vers un espace de travail Log Analytics." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Azure SQL Database keeps the history of automatic tuning actions for 21 days only. To keep it longer, you enable the AutomaticTuning diagnostic setting and stream the data to a destination such as a Log Analytics workspace, where the retention can be set to 180 days and the records are queried with KQL.
    fr: |
      Azure SQL Database ne conserve l'historique des actions de réglage automatique que 21 jours. Pour le garder plus longtemps, vous activez le paramètre de diagnostic AutomaticTuning et diffusez les données vers une destination comme un espace de travail Log Analytics, où la conservation peut être fixée à 180 jours et les enregistrements interrogés en KQL.
  options:
    a: { en: "Query Store keeps query and plan statistics, not the history of automatic tuning actions, and its data can't be queried with KQL.", fr: "Le Magasin des requêtes conserve les statistiques des requêtes et des plans, pas l'historique des actions de réglage automatique, et ses données ne s'interrogent pas en KQL." }
    b: { en: "Auditing records database events and queries run by principals; it doesn't record automatic tuning actions.", fr: "L'audit enregistre les événements de base de données et les requêtes exécutées par les principaux ; il n'enregistre pas les actions de réglage automatique." }
    c: { en: "Long-term retention keeps full backups for restores; it doesn't provide a queryable history of tuning actions.", fr: "La conservation à long terme garde des sauvegardes complètes pour les restaurations ; elle ne fournit pas d'historique interrogeable des actions de réglage." }
references:
  - title: Automatic database tuning
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/automatic-tuning-overview
