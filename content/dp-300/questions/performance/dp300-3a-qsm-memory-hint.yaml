id: dp300-3a-qsm-memory-hint
objective: "3.2.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    You have an Azure SQL database named **DB1**. Query Store shows that the query with query_id **39** requests a very large memory grant on each execution. While it runs, other queries wait with the RESOURCE_SEMAPHORE wait type. All the plans of query 39 in Query Store request a similar grant.

    You need to limit the memory grant of query 39 to 10 percent. The application code can't be modified, and the other queries of DB1 must not be affected.

    What should you do?
  fr: |
    Vous disposez d'une base de données Azure SQL nommée **DB1**. Le Magasin des requêtes montre que la requête dont le query_id vaut **39** demande une très grande allocation de mémoire à chaque exécution. Pendant son exécution, d'autres requêtes attendent avec le type d'attente RESOURCE_SEMAPHORE. Tous les plans de la requête 39 dans le Magasin des requêtes demandent une allocation similaire.

    Vous devez limiter l'allocation de mémoire de la requête 39 à 10 %. Le code de l'application ne peut pas être modifié, et les autres requêtes de DB1 ne doivent pas être affectées.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: "Run sys.sp_query_store_set_hints for query 39 with N'OPTION(MAX_GRANT_PERCENT = 10)'." }
    - { id: b, text: "Run sp_query_store_force_plan for query 39 with the plan that has the smallest grant." }
    - { id: c, text: "Run ALTER DATABASE SCOPED CONFIGURATION SET MAXDOP = 1 in DB1." }
    - { id: d, text: "Run sp_query_store_remove_query for query 39." }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Query Store hints apply a query hint to one query, identified by its query_id, without changing the code. They persist across restarts and failovers and override hard-coded statement hints and plan guides. If a hint can't be applied, it is ignored and the query still runs; the reason appears in sys.query_store_query_hints.
    fr: |
      Les indicateurs du Magasin des requêtes appliquent un indicateur de requête à une seule requête, identifiée par son query_id, sans modifier le code. Ils persistent après les redémarrages et les basculements, et ils l'emportent sur les indicateurs codés en dur et les repères de plan. Si un indicateur ne peut pas s'appliquer, il est ignoré et la requête s'exécute quand même ; la raison apparaît dans sys.query_store_query_hints.
  options:
    b: { en: "Every plan of query 39 requests a similar grant, so forcing one of them doesn't limit the memory.", fr: "Tous les plans de la requête 39 demandent une allocation similaire : en forcer un ne limite pas la mémoire." }
    c: { en: "A database scoped MAXDOP change affects every query of DB1 and doesn't cap memory grants.", fr: "Une modification de MAXDOP délimitée à la base affecte toutes les requêtes de DB1 et ne plafonne pas les allocations de mémoire." }
    d: { en: "Removing the query from Query Store deletes its history; the next execution requests the same grant.", fr: "Supprimer la requête du Magasin des requêtes efface son historique ; l'exécution suivante demande la même allocation." }
references:
  - title: Query Store hints
    url: https://learn.microsoft.com/en-us/sql/relational-databases/performance/query-store-hints
