id: dp300-3a-interpret-dtu
objective: "3.1.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have an Azure SQL database named **DB1** in the Standard service tier (S3, 100 DTUs). The DTU percentage metric of DB1 stays between 95 % and 100 % during business hours.

    During the same period, `sys.dm_db_resource_stats` shows the following averages:

    | Column | Average |
    | --- | --- |
    | avg_cpu_percent | 31 |
    | avg_data_io_percent | 97 |
    | avg_log_write_percent | 22 |

    Which resource limits the workload of DB1?
  fr: |
    Vous disposez d'une base de données Azure SQL nommée **DB1** dans le niveau de service Standard (S3, 100 DTU). La métrique DTU percentage de DB1 reste entre 95 % et 100 % pendant les heures de bureau.

    Pendant la même période, `sys.dm_db_resource_stats` affiche les moyennes suivantes :

    | Colonne | Moyenne |
    | --- | --- |
    | avg_cpu_percent | 31 |
    | avg_data_io_percent | 97 |
    | avg_log_write_percent | 22 |

    Quelle ressource limite la charge de travail de DB1 ?
body:
  options:
    - { id: a, text: { en: "CPU", fr: "Le processeur" } }
    - { id: b, text: { en: "Transaction log write throughput", fr: "Le débit d'écriture du journal des transactions" } }
    - { id: c, text: { en: "Data file I/O", fr: "Les E/S des fichiers de données" } }
    - { id: d, text: { en: "Concurrent sessions", fr: "Les sessions simultanées" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      The percentages are relative to the limits of the compute size. The DTU percentage follows the most used of the three resources, and here data I/O is close to its limit while CPU and log write are far from theirs. The next step is to find the queries with the most physical reads (missing indexes, scans) before deciding to scale.
    fr: |
      Les pourcentages sont relatifs aux limites de la taille de calcul. Le pourcentage de DTU suit la plus utilisée des trois ressources, et ici les E/S de données sont proches de leur limite alors que le processeur et l'écriture dans le journal en sont loin. L'étape suivante consiste à trouver les requêtes qui effectuent le plus de lectures physiques (index manquants, analyses) avant de décider d'une mise à l'échelle.
  options:
    a: { en: "CPU is at 31 % of the limit, so it isn't the constrained resource.", fr: "Le processeur est à 31 % de la limite : ce n'est pas la ressource contrainte." }
    b: { en: "Log write is at 22 % of the limit.", fr: "L'écriture dans le journal est à 22 % de la limite." }
    d: { en: "Nothing in the data points to sessions; the DTU percentage combines CPU, data I/O and log write only.", fr: "Rien dans les données n'indique les sessions ; le pourcentage de DTU ne combine que le processeur, les E/S de données et l'écriture dans le journal." }
references:
  - title: sys.dm_db_resource_stats (Azure SQL Database)
    url: https://learn.microsoft.com/en-us/sql/relational-databases/system-dynamic-management-views/sys-dm-db-resource-stats-azure-sql-database
