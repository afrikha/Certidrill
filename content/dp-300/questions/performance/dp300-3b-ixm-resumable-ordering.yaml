id: dp300-3b-ixm-resumable-ordering
objective: "3.3.1"
type: ordering
difficulty: 3
status: draft
stem:
  en: |
    You have an Azure SQL managed instance named **MI1**. A database on MI1 contains a table named **dbo.Invoices** with a clustered index named **PK_Invoices**.

    You plan to rebuild PK_Invoices online during two maintenance windows. At the end of the first window, you must stop the rebuild without losing its progress. Before the second window, you must check how much of the rebuild is complete. During the second window, you must complete the rebuild.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Vous disposez d'une instance managée Azure SQL nommée **MI1**. Une base de données de MI1 contient une table nommée **dbo.Invoices** avec un index cluster nommé **PK_Invoices**.

    Vous prévoyez de reconstruire PK_Invoices en ligne pendant deux fenêtres de maintenance. À la fin de la première fenêtre, vous devez arrêter la reconstruction sans perdre sa progression. Avant la seconde fenêtre, vous devez vérifier quelle part de la reconstruction est terminée. Pendant la seconde fenêtre, vous devez terminer la reconstruction.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: start, text: { en: "Run `ALTER INDEX PK_Invoices ON dbo.Invoices REBUILD WITH (ONLINE = ON, RESUMABLE = ON)`.", fr: "Exécuter `ALTER INDEX PK_Invoices ON dbo.Invoices REBUILD WITH (ONLINE = ON, RESUMABLE = ON)`." } }
    - { id: pause, text: { en: "Run `ALTER INDEX PK_Invoices ON dbo.Invoices PAUSE`.", fr: "Exécuter `ALTER INDEX PK_Invoices ON dbo.Invoices PAUSE`." } }
    - { id: check, text: { en: "Query the `sys.index_resumable_operations` catalog view.", fr: "Interroger l'affichage catalogue `sys.index_resumable_operations`." } }
    - { id: resume, text: { en: "Run `ALTER INDEX PK_Invoices ON dbo.Invoices RESUME`.", fr: "Exécuter `ALTER INDEX PK_Invoices ON dbo.Invoices RESUME`." } }
    - { id: abort, text: { en: "Run `ALTER INDEX PK_Invoices ON dbo.Invoices ABORT`.", fr: "Exécuter `ALTER INDEX PK_Invoices ON dbo.Invoices ABORT`." } }
    - { id: reorg, text: { en: "Run `ALTER INDEX PK_Invoices ON dbo.Invoices REORGANIZE`.", fr: "Exécuter `ALTER INDEX PK_Invoices ON dbo.Invoices REORGANIZE`." } }
answer:
  sequence: [ start, pause, check, resume ]
explanation:
  correct:
    en: |
      A resumable online rebuild is started with `ONLINE = ON, RESUMABLE = ON`. `PAUSE` stops it and keeps the progress made so far, and `sys.index_resumable_operations` shows the state and progress of the paused operation. `RESUME` (or re-running the original statement) continues the rebuild from where it stopped.
    fr: |
      Une reconstruction en ligne pouvant être reprise se lance avec `ONLINE = ON, RESUMABLE = ON`. `PAUSE` l'arrête en conservant la progression réalisée, et `sys.index_resumable_operations` affiche l'état et la progression de l'opération suspendue. `RESUME` (ou la réexécution de l'instruction d'origine) poursuit la reconstruction là où elle s'est arrêtée.
  options:
    abort: { en: "`ABORT` cancels the operation; an aborted rebuild can't be resumed.", fr: "`ABORT` annule l'opération ; une reconstruction abandonnée ne peut pas être reprise." }
    reorg: { en: "A reorganize is a different operation; it doesn't continue the paused rebuild.", fr: "Une réorganisation est une opération différente ; elle ne poursuit pas la reconstruction suspendue." }
references:
  - title: ALTER INDEX (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/statements/alter-index-transact-sql
