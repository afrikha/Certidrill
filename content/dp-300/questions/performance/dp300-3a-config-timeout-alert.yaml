id: dp300-3a-config-timeout-alert
objective: "3.1.4"
type: ordering
difficulty: 1
status: draft
stem:
  en: |
    You have an Azure SQL database named **DB1**. No monitoring is configured for DB1 beyond the defaults. An action group named **ag-dba** exists.

    You need to notify the members of ag-dba when DB1 records more than 10 query timeouts in one hour. The timeout details must be queryable with KQL.

    Which three actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Vous disposez d'une base de données Azure SQL nommée **DB1**. Aucune supervision n'est configurée pour DB1 au-delà des paramètres par défaut. Un groupe d'actions nommé **ag-dba** existe.

    Vous devez avertir les membres de ag-dba lorsque DB1 enregistre plus de 10 dépassements de délai d'expiration de requête en une heure. Le détail des dépassements de délai doit pouvoir être interrogé en KQL.

    Quelles sont les trois actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - { id: law, text: { en: "Create a Log Analytics workspace.", fr: "Créer un espace de travail Log Analytics." } }
    - { id: diag, text: { en: "Create a diagnostic setting on DB1 that sends the Timeouts category to the workspace.", fr: "Créer sur DB1 un paramètre de diagnostic qui envoie la catégorie Timeouts vers l'espace de travail." } }
    - { id: alert, text: { en: "Create a log search alert rule on the workspace that uses ag-dba.", fr: "Créer sur l'espace de travail une règle d'alerte de recherche dans les journaux qui utilise ag-dba." } }
    - { id: ama, text: { en: "Install the Azure Monitor Agent for DB1.", fr: "Installer l'agent Azure Monitor pour DB1." } }
    - { id: activity, text: { en: "Create an activity log alert rule on DB1 that uses ag-dba.", fr: "Créer sur DB1 une règle d'alerte du journal d'activité qui utilise ag-dba." } }
    - { id: dcr, text: { en: "Create a data collection rule that targets DB1.", fr: "Créer une règle de collecte de données qui cible DB1." } }
answer:
  sequence: [ law, diag, alert ]
explanation:
  correct:
    en: |
      Timeouts is a resource log category, stored only after a diagnostic setting sends it to a destination. The workspace must exist before the diagnostic setting can target it, and the log search alert rule then runs a KQL query on the workspace and calls the action group.
    fr: |
      Timeouts est une catégorie de journaux de ressources, stockée seulement après qu'un paramètre de diagnostic l'envoie vers une destination. L'espace de travail doit exister avant que le paramètre de diagnostic puisse le cibler, puis la règle d'alerte de recherche dans les journaux exécute une requête KQL sur l'espace de travail et appelle le groupe d'actions.
  options:
    ama: { en: "Azure SQL Database is a PaaS service; no agent is installed to collect its logs.", fr: "Azure SQL Database est un service PaaS ; aucun agent n'est installé pour collecter ses journaux." }
    activity: { en: "The activity log records control plane operations, not query timeouts.", fr: "Le journal d'activité enregistre les opérations du plan de contrôle, pas les dépassements de délai des requêtes." }
    dcr: { en: "Data collection rules are used by the Azure Monitor Agent on machines, not by Azure SQL Database resource logs.", fr: "Les règles de collecte de données sont utilisées par l'agent Azure Monitor sur des machines, pas par les journaux de ressources d'Azure SQL Database." }
references:
  - title: Configure streaming export of Azure SQL Database and SQL Managed Instance diagnostic telemetry
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/metrics-diagnostic-telemetry-logging-streaming-export-configure
  - title: Monitor Azure SQL Database
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/monitoring-sql-database-azure-monitor
