id: dp300-3c-checkdb-hyperscale
objective: "3.3.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have an Azure SQL database named OrdersDB in the Hyperscale service tier. OrdersDB contains 40 tables.

    You need to check the logical and physical integrity of the tables in OrdersDB.

    What should you use?
  fr: |
    Vous disposez d'une base de données Azure SQL nommée OrdersDB dans le niveau de service Hyperscale. OrdersDB contient 40 tables.

    Vous devez vérifier l'intégrité logique et physique des tables d'OrdersDB.

    Que devez-vous utiliser ?
body:
  options:
    - { id: a, text: { en: "DBCC CHECKDB on OrdersDB with the PHYSICAL_ONLY option", fr: "DBCC CHECKDB sur OrdersDB avec l'option PHYSICAL_ONLY" } }
    - { id: b, text: { en: "DBCC CHECKTABLE on each table with the TABLOCK option", fr: "DBCC CHECKTABLE sur chaque table avec l'option TABLOCK" } }
    - { id: c, text: { en: "DBCC CHECKFILEGROUP on the PRIMARY filegroup", fr: "DBCC CHECKFILEGROUP sur le groupe de fichiers PRIMARY" } }
    - { id: d, text: { en: "DBCC CHECKDB on OrdersDB with the TABLOCK option", fr: "DBCC CHECKDB sur OrdersDB avec l'option TABLOCK" } }
answer: { optionId: b }
explanation:
  correct:
    en: "`DBCC CHECKDB` and `DBCC CHECKFILEGROUP` aren't supported in Azure SQL Database Hyperscale. Microsoft documents `DBCC CHECKTABLE ('TableName') WITH TABLOCK` as the alternative, so you run it for each table."
    fr: "`DBCC CHECKDB` et `DBCC CHECKFILEGROUP` ne sont pas pris en charge dans Azure SQL Database Hyperscale. Microsoft documente `DBCC CHECKTABLE ('TableName') WITH TABLOCK` comme solution de remplacement : vous l'exécutez pour chaque table."
  options:
    a: { en: "DBCC CHECKDB isn't supported in Hyperscale, whatever the options.", fr: "DBCC CHECKDB n'est pas pris en charge dans Hyperscale, quelles que soient les options." }
    c: { en: "DBCC CHECKFILEGROUP isn't supported in Hyperscale either.", fr: "DBCC CHECKFILEGROUP n'est pas non plus pris en charge dans Hyperscale." }
    d: { en: "TABLOCK changes how DBCC CHECKDB gets a consistent view, but DBCC CHECKDB itself isn't supported in Hyperscale.", fr: "TABLOCK change la façon dont DBCC CHECKDB obtient une vue cohérente, mais DBCC CHECKDB lui-même n'est pas pris en charge dans Hyperscale." }
references:
  - title: DBCC CHECKDB (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/database-console-commands/dbcc-checkdb-transact-sql
