id: dp300-3c-at-statements
objective: "3.3.4"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    You have an Azure SQL database named RetailDB in the Business Critical service tier. The CREATE_INDEX and DROP_INDEX automatic tuning options are enabled for RetailDB.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'une base de données Azure SQL nommée RetailDB dans le niveau de service Business Critical. Les options de réglage automatique CREATE_INDEX et DROP_INDEX sont activées pour RetailDB.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          If an index that the service created automatically doesn't improve the performance of the affected queries, the service reverts the change.
        fr: |
          Si un index créé automatiquement par le service n'améliore pas les performances des requêtes concernées, le service annule la modification.
    - id: s2
      text:
        en: |
          If you apply an index recommendation by running its Transact-SQL script yourself, the service validates the new index and reverts it if performance regresses.
        fr: |
          Si vous appliquez une recommandation d'index en exécutant vous-même son script Transact-SQL, le service valide le nouvel index et l'annule si les performances se dégradent.
    - id: s3
      text:
        en: |
          The service drops the indexes of RetailDB that haven't been used for more than 90 days.
        fr: |
          Le service supprime les index de RetailDB qui n'ont pas été utilisés depuis plus de 90 jours.
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: |
      Every automatic tuning action is validated over a period of 30 minutes to 72 hours and reverted if performance doesn't improve. Recommendations that you apply yourself with Transact-SQL get no automatic validation or reversal. On the Premium and Business Critical tiers, DROP_INDEX never drops unused indexes; it drops only duplicate indexes.
    fr: |
      Chaque action de réglage automatique est validée pendant une période de 30 minutes à 72 heures et annulée si les performances ne s'améliorent pas. Les recommandations que vous appliquez vous-même en Transact-SQL ne bénéficient d'aucune validation ni annulation automatique. Dans les niveaux Premium et Business Critical, DROP_INDEX ne supprime jamais les index inutilisés ; elle ne supprime que les index en double.
references:
  - title: Automatic database tuning
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/automatic-tuning-overview
