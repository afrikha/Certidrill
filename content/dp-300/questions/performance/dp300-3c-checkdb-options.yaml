id: dp300-3c-checkdb-options
objective: "3.3.3"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    You have an Azure virtual machine named SQLVM2 that runs SQL Server 2022 and hosts a 3-TB database named ClaimsDB. The volume that stores the data files of ClaimsDB is almost full, so the integrity check must not create internal database snapshot files on that volume. Blocking is acceptable during the weekend maintenance window.

    You need to perform the following tasks during the window:

    - First, report the estimated `tempdb` space that the check needs, without running the check.
    - Then, run a full integrity check of ClaimsDB that displays only error messages.

    How should you complete the Transact-SQL script? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'une machine virtuelle Azure nommée SQLVM2 qui exécute SQL Server 2022 et héberge une base de données de 3 To nommée ClaimsDB. Le volume qui stocke les fichiers de données de ClaimsDB est presque plein : la vérification d'intégrité ne doit donc pas créer de fichiers de capture instantanée interne de la base sur ce volume. Le blocage est acceptable pendant la fenêtre de maintenance du week-end.

    Vous devez effectuer les tâches suivantes pendant la fenêtre :

    - D'abord, indiquer l'espace `tempdb` estimé nécessaire à la vérification, sans exécuter la vérification.
    - Ensuite, exécuter une vérification d'intégrité complète de ClaimsDB qui n'affiche que les messages d'erreur.

    Comment devez-vous compléter le script Transact-SQL ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: sql
  template: |
    DBCC CHECKDB (ClaimsDB) WITH [[est]];
    GO
    DBCC CHECKDB (ClaimsDB) WITH [[msgs]], [[lock]];
    GO
  slots:
    - id: est
      options:
        - { id: estimate, text: ESTIMATEONLY }
        - { id: physical, text: PHYSICAL_ONLY }
        - { id: purity, text: DATA_PURITY }
        - { id: allerr, text: ALL_ERRORMSGS }
    - id: msgs
      options:
        - { id: noinfo, text: NO_INFOMSGS }
        - { id: allerr2, text: ALL_ERRORMSGS }
        - { id: extended, text: EXTENDED_LOGICAL_CHECKS }
    - id: lock
      options:
        - { id: tablock, text: TABLOCK }
        - { id: physical2, text: PHYSICAL_ONLY }
        - { id: maxdop, text: "MAXDOP = 1" }
answer:
  values: { est: estimate, msgs: noinfo, lock: tablock }
explanation:
  correct:
    en: "`ESTIMATEONLY` reports the estimated `tempdb` space that the other options need and doesn't run the check. `NO_INFOMSGS` suppresses informational messages so that only errors appear. `TABLOCK` makes `DBCC CHECKDB` take locks instead of creating the internal snapshot, whose sparse files are written in the folder of the data files; the blocking it causes is acceptable during the window."
    fr: "`ESTIMATEONLY` indique l'espace `tempdb` estimé nécessaire aux autres options et n'exécute pas la vérification. `NO_INFOMSGS` supprime les messages d'information pour n'afficher que les erreurs. `TABLOCK` fait prendre des verrous à `DBCC CHECKDB` au lieu de créer la capture instantanée interne, dont les fichiers partiellement alloués sont écrits dans le dossier des fichiers de données ; le blocage qui en résulte est acceptable pendant la fenêtre."
  options:
    physical: { en: "PHYSICAL_ONLY runs a lighter check; it doesn't report a space estimate.", fr: "PHYSICAL_ONLY exécute une vérification allégée ; elle n'indique pas d'estimation d'espace." }
    purity: { en: "DATA_PURITY checks column values; it runs the check instead of estimating space.", fr: "DATA_PURITY vérifie les valeurs des colonnes ; elle exécute la vérification au lieu d'estimer l'espace." }
    allerr: { en: "ALL_ERRORMSGS is the default display behavior and runs the check.", fr: "ALL_ERRORMSGS est le comportement d'affichage par défaut et exécute la vérification." }
    allerr2: { en: "ALL_ERRORMSGS displays all errors but still shows informational messages.", fr: "ALL_ERRORMSGS affiche toutes les erreurs mais affiche toujours les messages d'information." }
    extended: { en: "EXTENDED_LOGICAL_CHECKS adds checks; it doesn't filter the messages.", fr: "EXTENDED_LOGICAL_CHECKS ajoute des vérifications ; elle ne filtre pas les messages." }
    physical2: { en: "PHYSICAL_ONLY isn't a full check, and it still uses the internal snapshot.", fr: "PHYSICAL_ONLY n'est pas une vérification complète et utilise toujours la capture instantanée interne." }
    maxdop: { en: "MAXDOP limits parallelism; the check still creates the internal snapshot.", fr: "MAXDOP limite le parallélisme ; la vérification crée toujours la capture instantanée interne." }
references:
  - title: DBCC CHECKDB (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/database-console-commands/dbcc-checkdb-transact-sql
