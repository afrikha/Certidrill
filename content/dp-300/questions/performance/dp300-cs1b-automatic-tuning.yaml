id: dp300-cs1b-automatic-tuning
objective: "3.3.4"
type: yesno_statements
caseStudy: dp300-cs1b-margies-travel
difficulty: 2
status: draft
stem:
  en: |
    You are reviewing the automatic tuning configuration of sql-mt-prod and its tenant databases against the performance requirements.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous examinez la configuration du réglage automatique de sql-mt-prod et de ses bases de données de locataire au regard des exigences de performances.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          The FORCE_LAST_GOOD_PLAN option is already enabled for the tenant databases that inherit the server configuration.
        fr: |
          L'option FORCE_LAST_GOOD_PLAN est déjà activée pour les bases de données de locataire qui héritent de la configuration du serveur.
    - id: s2
      text:
        en: |
          To meet the index review requirement, you should enable the CREATE_INDEX option at the server level and keep DROP_INDEX disabled.
        fr: |
          Pour satisfaire l'exigence d'examen des index, vous devez activer l'option CREATE_INDEX au niveau du serveur et laisser DROP_INDEX désactivée.
    - id: s3
      text:
        en: "Running `ALTER DATABASE CURRENT SET AUTOMATIC_TUNING = INHERIT` in a tenant database makes the database use the automatic tuning settings of sql-mt-prod."
        fr: "L'exécution de `ALTER DATABASE CURRENT SET AUTOMATIC_TUNING = INHERIT` dans une base de données de locataire fait utiliser à cette base les paramètres de réglage automatique de sql-mt-prod."
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |
      sql-mt-prod uses the Azure defaults, in which FORCE_LAST_GOOD_PLAN is enabled and CREATE_INDEX and DROP_INDEX are disabled, so plan regressions are already corrected automatically for the databases that inherit the server settings. Enabling CREATE_INDEX would let the service create indexes without a DBA review; leaving it disabled keeps index recommendations for manual review. `AUTOMATIC_TUNING = INHERIT` makes a database follow the server-level configuration.
    fr: |
      sql-mt-prod utilise les valeurs par défaut d'Azure, dans lesquelles FORCE_LAST_GOOD_PLAN est activée et CREATE_INDEX et DROP_INDEX sont désactivées : les régressions de plan sont déjà corrigées automatiquement pour les bases qui héritent des paramètres du serveur. Activer CREATE_INDEX permettrait au service de créer des index sans examen par un DBA ; la laisser désactivée conserve les recommandations d'index pour un examen manuel. `AUTOMATIC_TUNING = INHERIT` fait suivre à une base de données la configuration définie au niveau du serveur.
references:
  - title: Automatic database tuning
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/automatic-tuning-overview
