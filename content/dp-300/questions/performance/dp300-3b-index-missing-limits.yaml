id: dp300-3b-index-missing-limits
objective: "3.2.5"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    You plan to use the missing index suggestions of an Azure SQL managed instance named **MI1** to design new indexes for a database named **ErpDB**.

    Which two statements about the missing index suggestions are true?

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous prévoyez d'utiliser les suggestions d'index manquants d'une instance managée Azure SQL nommée **MI1** pour concevoir de nouveaux index pour une base de données nommée **ErpDB**.

    Quelles sont les deux affirmations vraies concernant les suggestions d'index manquants ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "The suggestions in the missing index DMVs are cleared when MI1 fails over.", fr: "Les suggestions des DMV d'index manquants sont effacées quand MI1 bascule." } }
    - { id: b, text: { en: "The suggested key columns are listed in the order in which they should be defined in the index key.", fr: "Les colonnes clés suggérées sont listées dans l'ordre dans lequel elles doivent être définies dans la clé de l'index." } }
    - { id: c, text: { en: "The suggestions are re-evaluated after each execution by using the actual number of rows.", fr: "Les suggestions sont réévaluées après chaque exécution à l'aide du nombre réel de lignes." } }
    - { id: d, text: { en: "The suggestions never propose filtered or unique indexes.", fr: "Les suggestions ne proposent jamais d'index filtrés ni d'index uniques." } }
    - { id: e, text: { en: "The suggestions are checked against the existing indexes so that they never duplicate one.", fr: "Les suggestions sont comparées aux index existants afin de ne jamais en dupliquer un." } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: |
      Missing index data lives in memory and is cleared by events such as a restart, a failover or setting the database offline. The feature suggests only nonclustered disk-based rowstore indexes, never unique, filtered or columnstore indexes. Treat the suggestions as one input among others and review them against the existing indexes before creating anything.
    fr: |
      Les données d'index manquants résident en mémoire et sont effacées par des événements comme un redémarrage, un basculement ou la mise hors connexion de la base. La fonctionnalité ne suggère que des index rowstore non cluster sur disque, jamais d'index uniques, filtrés ou columnstore. Traitez les suggestions comme une source parmi d'autres et comparez-les aux index existants avant de créer quoi que ce soit.
  options:
    b: { en: "The suggestion lists key columns without specifying their order; you decide it (equality columns first, most selective first).", fr: "La suggestion liste les colonnes clés sans en préciser l'ordre ; c'est à vous de le décider (colonnes d'égalité d'abord, les plus sélectives en premier)." }
    c: { en: "Suggestions are based on estimates made when the query is optimized; they aren't tested or updated after execution.", fr: "Les suggestions reposent sur des estimations faites lors de l'optimisation de la requête ; elles ne sont ni testées ni mises à jour après l'exécution." }
    e: { en: "The feature doesn't check for overlap with existing indexes; you must look for duplicates yourself.", fr: "La fonctionnalité ne vérifie pas le chevauchement avec les index existants ; vous devez rechercher vous-même les doublons." }
references:
  - title: Tune nonclustered indexes with missing index suggestions
    url: https://learn.microsoft.com/en-us/sql/relational-databases/indexes/tune-nonclustered-missing-index-suggestions
