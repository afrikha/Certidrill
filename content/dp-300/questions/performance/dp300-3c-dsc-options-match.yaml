id: dp300-3c-dsc-options-match
objective: "3.3.7"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    You manage an Azure SQL database named CrmDB. You need to meet the requirements shown in the answer area by using database-scoped configuration.

    Which setting should you use for each requirement? To answer, drag the appropriate settings to the correct requirements. Each setting may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous gérez une base de données Azure SQL nommée CrmDB. Vous devez satisfaire les exigences indiquées dans la zone de réponse avec la configuration à l'échelle de la base de données.

    Quel paramètre devez-vous utiliser pour chaque exigence ? Pour répondre, faites glisser les paramètres appropriés vers les exigences correspondantes. Chaque paramètre peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: lqps, text: "LAST_QUERY_PLAN_STATS = ON" }
    - { id: hotfix, text: "QUERY_OPTIMIZER_HOTFIXES = ON" }
    - { id: sniff, text: "PARAMETER_SNIFFING = OFF" }
    - { id: identity, text: "IDENTITY_CACHE = OFF" }
    - { id: legacy, text: "LEGACY_CARDINALITY_ESTIMATION = ON" }
    - { id: lwp, text: "LIGHTWEIGHT_QUERY_PROFILING = OFF" }
  targets:
    - { id: plan, text: { en: "Make the last actual execution plan of each query available in sys.dm_exec_query_plan_stats.", fr: "Rendre le dernier plan d'exécution réel de chaque requête disponible dans sys.dm_exec_query_plan_stats." } }
    - { id: fixes, text: { en: "Enable the query optimizer fixes released after the compatibility level of the database.", fr: "Activer les correctifs de l'optimiseur de requête publiés après le niveau de compatibilité de la base." } }
    - { id: average, text: { en: "Compile plans for the average distribution of parameter values instead of the first values supplied.", fr: "Compiler les plans pour la distribution moyenne des valeurs des paramètres au lieu des premières valeurs fournies." } }
    - { id: gaps, text: { en: "Avoid gaps in identity values after an unexpected restart or failover.", fr: "Éviter les écarts dans les valeurs d'identité après un redémarrage inattendu ou un basculement." } }
answer:
  mapping: { plan: lqps, fixes: hotfix, average: sniff, gaps: identity }
explanation:
  correct:
    en: |
      `LAST_QUERY_PLAN_STATS = ON` collects the last actual plan in `sys.dm_exec_query_plan_stats`. `QUERY_OPTIMIZER_HOTFIXES = ON` is the equivalent of trace flag 4199. `PARAMETER_SNIFFING = OFF` (trace flag 4136) builds plans for average values. `IDENTITY_CACHE = OFF` avoids identity gaps after an unexpected restart or failover. `LEGACY_CARDINALITY_ESTIMATION` changes the estimation model and `LIGHTWEIGHT_QUERY_PROFILING` controls the profiling infrastructure; neither meets a listed requirement.
    fr: |
      `LAST_QUERY_PLAN_STATS = ON` collecte le dernier plan réel dans `sys.dm_exec_query_plan_stats`. `QUERY_OPTIMIZER_HOTFIXES = ON` équivaut à l'indicateur de trace 4199. `PARAMETER_SNIFFING = OFF` (indicateur de trace 4136) construit les plans pour des valeurs moyennes. `IDENTITY_CACHE = OFF` évite les écarts d'identité après un redémarrage inattendu ou un basculement. `LEGACY_CARDINALITY_ESTIMATION` change le modèle d'estimation et `LIGHTWEIGHT_QUERY_PROFILING` contrôle l'infrastructure de profilage ; aucun ne satisfait une exigence de la liste.
references:
  - title: ALTER DATABASE SCOPED CONFIGURATION (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/statements/alter-database-scoped-configuration-transact-sql
