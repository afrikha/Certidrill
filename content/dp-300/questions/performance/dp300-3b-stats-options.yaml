id: dp300-3b-stats-options
objective: "3.3.2"
type: dragdrop
difficulty: 3
status: draft
stem:
  en: |
    You have an Azure SQL database named **SensorDB**. You plan to run `UPDATE STATISTICS` statements to meet four maintenance requirements. The table **dbo.Measurements** is partitioned and its statistics were created with `INCREMENTAL = ON`.

    Which option should you use for each requirement? To answer, drag the appropriate options to the correct requirements. Each option may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'une base de données Azure SQL nommée **SensorDB**. Vous prévoyez d'exécuter des instructions `UPDATE STATISTICS` pour répondre à quatre exigences de maintenance. La table **dbo.Measurements** est partitionnée et ses statistiques ont été créées avec `INCREMENTAL = ON`.

    Quelle option devez-vous utiliser pour chaque exigence ? Pour répondre, faites glisser les options appropriées vers les exigences correspondantes. Chaque option peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: full, text: "WITH FULLSCAN" }
    - { id: persist, text: "WITH SAMPLE 30 PERCENT, PERSIST_SAMPLE_PERCENT = ON" }
    - { id: partitions, text: "WITH RESAMPLE ON PARTITIONS (11, 12)" }
    - { id: norecompute, text: "WITH NORECOMPUTE" }
    - { id: autodrop, text: "WITH AUTO_DROP = ON" }
    - { id: maxdop, text: "WITH MAXDOP = 1" }
  targets:
    - { id: t1, text: { en: "Later automatic updates of a statistics object on a large table must reuse the sampling rate that you specify now.", fr: "Les mises à jour automatiques ultérieures d'un objet de statistiques d'une grande table doivent réutiliser le taux d'échantillonnage que vous spécifiez maintenant." } }
    - { id: t2, text: { en: "The histogram of a statistics object must be built by reading every row of the table.", fr: "L'histogramme d'un objet de statistiques doit être construit en lisant toutes les lignes de la table." } }
    - { id: t3, text: { en: "Only the statistics of the two most recent partitions of dbo.Measurements must be recomputed.", fr: "Seules les statistiques des deux partitions les plus récentes de dbo.Measurements doivent être recalculées." } }
    - { id: t4, text: { en: "A statistics object that you maintain manually must no longer be updated automatically.", fr: "Un objet de statistiques que vous gérez manuellement ne doit plus être mis à jour automatiquement." } }
answer:
  mapping: { t1: persist, t2: full, t3: partitions, t4: norecompute }
explanation:
  correct:
    en: "`PERSIST_SAMPLE_PERCENT = ON` keeps the specified sampling rate for later updates that don't specify one. `FULLSCAN` reads all rows (same result as `SAMPLE 100 PERCENT`). With incremental statistics, `RESAMPLE ON PARTITIONS` recomputes only the listed partitions and merges them into the table-level statistics. `NORECOMPUTE` disables automatic updates for those statistics; use it sparingly."
    fr: "`PERSIST_SAMPLE_PERCENT = ON` conserve le taux d'échantillonnage spécifié pour les mises à jour ultérieures qui n'en précisent pas. `FULLSCAN` lit toutes les lignes (même résultat que `SAMPLE 100 PERCENT`). Avec des statistiques incrémentielles, `RESAMPLE ON PARTITIONS` ne recalcule que les partitions listées et les fusionne dans les statistiques de niveau table. `NORECOMPUTE` désactive les mises à jour automatiques de ces statistiques ; utilisez-le avec parcimonie."
  options:
    autodrop: { en: "`AUTO_DROP` lets schema changes drop the statistics instead of being blocked by them; it doesn't control sampling or automatic updates.", fr: "`AUTO_DROP` permet aux modifications de schéma de supprimer les statistiques au lieu d'être bloquées par elles ; il ne contrôle ni l'échantillonnage ni les mises à jour automatiques." }
    maxdop: { en: "`MAXDOP = 1` only prevents a parallel plan for the update operation.", fr: "`MAXDOP = 1` empêche seulement un plan parallèle pour l'opération de mise à jour." }
references:
  - title: UPDATE STATISTICS (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/statements/update-statistics-transact-sql
