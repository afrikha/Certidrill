id: dp300-3b-stats-statements
objective: "3.3.2"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    You maintain the statistics of an Azure SQL managed instance database named **InventoryDB**. None of its tables is partitioned.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous assurez la maintenance des statistiques d'une base de données Azure SQL Managed Instance nommée **InventoryDB**. Aucune de ses tables n'est partitionnée.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          Running `ALTER INDEX ... REORGANIZE` on an index updates the statistics of that index.
        fr: |
          Exécuter `ALTER INDEX ... REORGANIZE` sur un index met à jour les statistiques de cet index.
    - id: s2
      text:
        en: |
          An `ALTER INDEX ... REBUILD` run without `RESUMABLE = ON` updates the statistics of the index as if `FULLSCAN` were used.
        fr: |
          Un `ALTER INDEX ... REBUILD` exécuté sans `RESUMABLE = ON` met à jour les statistiques de l'index comme si `FULLSCAN` était utilisé.
    - id: s3
      text:
        en: |
          The `modification_counter` column of `sys.dm_db_stats_properties` shows the number of modifications since the statistics were last updated.
        fr: |
          La colonne `modification_counter` de `sys.dm_db_stats_properties` indique le nombre de modifications depuis la dernière mise à jour des statistiques.
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: |
      Statistics aren't updated when an index is reorganized. Creating or rebuilding a rowstore index updates its statistics by scanning all the rows, which is equivalent to `FULLSCAN`, except for partitioned indexes and resumable rebuilds, which use the default sampling. `sys.dm_db_stats_properties` returns `last_updated`, `rows`, `rows_sampled` and `modification_counter` to check how fresh statistics are.
    fr: |
      Les statistiques ne sont pas mises à jour quand un index est réorganisé. Créer ou reconstruire un index rowstore met à jour ses statistiques en analysant toutes les lignes, ce qui équivaut à `FULLSCAN`, sauf pour les index partitionnés et les reconstructions pouvant être reprises, qui utilisent l'échantillonnage par défaut. `sys.dm_db_stats_properties` renvoie `last_updated`, `rows`, `rows_sampled` et `modification_counter` pour vérifier la fraîcheur des statistiques.
references:
  - title: Statistics
    url: https://learn.microsoft.com/en-us/sql/relational-databases/statistics/statistics
  - title: Optimize index maintenance to improve query performance and reduce resource consumption
    url: https://learn.microsoft.com/en-us/sql/relational-databases/indexes/reorganize-and-rebuild-indexes
