id: dp300-3c-scale-serverless-cli
objective: "3.3.8"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    You have an Azure SQL database named DevDB on a logical server named sql-dev. DevDB uses the General Purpose service tier with provisioned compute.

    You need to reconfigure DevDB to meet the following requirements:

    - Compute must scale automatically between 0.5 and 4 vCores.
    - DevDB must pause automatically after two hours without activity.

    How should you complete the Azure CLI command? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'une base de données Azure SQL nommée DevDB sur un serveur logique nommé sql-dev. DevDB utilise le niveau de service General Purpose avec un calcul provisionné.

    Vous devez reconfigurer DevDB pour satisfaire les exigences suivantes :

    - Le calcul doit s'adapter automatiquement entre 0,5 et 4 vCores.
    - DevDB doit se mettre en pause automatiquement après deux heures sans activité.

    Comment devez-vous compléter la commande Azure CLI ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: bash
  template: |
    az sql db update --resource-group rg-dev --server sql-dev --name DevDB \
      --edition GeneralPurpose --family Gen5 \
      --compute-model [[model]] [[maxflag]] 4 --min-capacity 0.5 \
      --auto-pause-delay [[delay]]
  slots:
    - id: model
      options:
        - { id: serverless, text: Serverless }
        - { id: provisioned, text: Provisioned }
        - { id: hyperscale, text: Hyperscale }
    - id: maxflag
      options:
        - { id: capacity, text: "--capacity" }
        - { id: maxsize, text: "--max-size" }
        - { id: replicas, text: "--ha-replicas" }
    - id: delay
      options:
        - { id: m60, text: "60" }
        - { id: m120, text: "120" }
        - { id: h2, text: "2" }
        - { id: s7200, text: "7200" }
answer:
  values: { model: serverless, maxflag: capacity, delay: m120 }
explanation:
  correct:
    en: "`--compute-model Serverless` switches the database to serverless compute. For a serverless database, `--capacity` sets the maximum vCores and `--min-capacity` the minimum. `--auto-pause-delay` is expressed in minutes, so two hours is 120; in General Purpose the delay ranges from 15 minutes to 7 days, and -1 disables auto-pause."
    fr: "`--compute-model Serverless` fait passer la base au calcul serverless. Pour une base serverless, `--capacity` définit le nombre maximal de vCores et `--min-capacity` le minimum. `--auto-pause-delay` s'exprime en minutes : deux heures valent donc 120 ; en General Purpose, le délai va de 15 minutes à 7 jours, et -1 désactive la pause automatique."
  options:
    provisioned: { en: "Provisioned compute has a fixed size and never pauses.", fr: "Le calcul provisionné a une taille fixe et ne se met jamais en pause." }
    hyperscale: { en: "Hyperscale is a service tier, not a compute model.", fr: "Hyperscale est un niveau de service, pas un modèle de calcul." }
    maxsize: { en: "--max-size sets the maximum storage size, not the vCores.", fr: "--max-size définit la taille de stockage maximale, pas les vCores." }
    replicas: { en: "--ha-replicas sets the number of high-availability replicas.", fr: "--ha-replicas définit le nombre de réplicas haute disponibilité." }
    m60: { en: "60 minutes is the default delay, which is one hour.", fr: "60 minutes est le délai par défaut, soit une heure." }
    h2: { en: "The delay is in minutes; 2 is also below the 15-minute minimum.", fr: "Le délai est en minutes ; 2 est en outre inférieur au minimum de 15 minutes." }
    s7200: { en: "7200 minutes is five days; the delay isn't expressed in seconds.", fr: "7200 minutes font cinq jours ; le délai ne s'exprime pas en secondes." }
references:
  - title: Serverless compute tier for Azure SQL Database
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/serverless-tier-overview
