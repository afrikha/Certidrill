id: dp300-3a-source-qpi
objective: "3.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have an Azure SQL database named **DB1** that uses the default Query Store settings.

    A developer needs to see, in the Azure portal, the five queries of DB1 that consumed the most CPU during the past week, and how their CPU usage evolved. The developer doesn't want to write any Transact-SQL or KQL query.

    Which tool should the developer use?
  fr: |
    Vous disposez d'une base de données Azure SQL nommée **DB1** qui utilise les paramètres par défaut du Magasin des requêtes.

    Un développeur doit voir, dans le portail Azure, les cinq requêtes de DB1 qui ont consommé le plus de processeur au cours de la semaine passée, et l'évolution de leur utilisation du processeur. Le développeur ne veut écrire aucune requête Transact-SQL ni KQL.

    Quel outil le développeur doit-il utiliser ?
body:
  options:
    - { id: a, text: Metrics Explorer }
    - { id: b, text: Query Performance Insight }
    - { id: c, text: { en: "The activity log of DB1", fr: "Le journal d'activité de DB1" } }
    - { id: d, text: Azure Advisor }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Query Performance Insight reads the Query Store data of the database and shows, by default, the top five CPU-consuming queries with their CPU, duration and execution count over a time range you choose (last 24 hours, past week or past month on the Custom tab).
    fr: |
      Query Performance Insight lit les données du Magasin des requêtes de la base et affiche, par défaut, les cinq requêtes les plus consommatrices de processeur avec leur processeur, leur durée et leur nombre d'exécutions sur la plage de temps choisie (dernières 24 heures, semaine passée ou mois passé dans l'onglet Custom).
  options:
    a: { en: "Metrics Explorer charts database-level metrics such as CPU percentage, not individual queries.", fr: "Metrics Explorer affiche des métriques au niveau de la base comme CPU percentage, pas des requêtes individuelles." }
    c: { en: "The activity log records control plane operations, such as scaling, not query execution.", fr: "Le journal d'activité enregistre les opérations du plan de contrôle, comme la mise à l'échelle, pas l'exécution des requêtes." }
    d: { en: "Azure Advisor gives recommendations; it doesn't list the top queries and their CPU over time.", fr: "Azure Advisor fournit des recommandations ; il ne liste pas les requêtes principales et leur processeur dans le temps." }
references:
  - title: Query Performance Insight for Azure SQL Database
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/query-performance-insight-use
