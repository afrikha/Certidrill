id: dp300-3c-iqp-table-variable
objective: "3.3.9"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You migrated a database named FinanceDB from SQL Server 2016 to an Azure SQL managed instance. FinanceDB kept compatibility level 130.

    Several stored procedures load thousands of rows into table variables and then join them to large tables. Their plans estimate one row for each table variable, which produces inefficient joins.

    You need to improve the estimates for the table variables without modifying the code.

    What should you do?
  fr: |
    Vous avez migré une base de données nommée FinanceDB de SQL Server 2016 vers une instance managée Azure SQL. FinanceDB a conservé le niveau de compatibilité 130.

    Plusieurs procédures stockées chargent des milliers de lignes dans des variables de table, puis les joignent à de grandes tables. Leurs plans estiment une ligne pour chaque variable de table, ce qui produit des jointures inefficaces.

    Vous devez améliorer les estimations des variables de table sans modifier le code.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Set the compatibility level of FinanceDB to 140.", fr: "Définir le niveau de compatibilité de FinanceDB sur 140." } }
    - { id: b, text: { en: "Set the compatibility level of FinanceDB to 150.", fr: "Définir le niveau de compatibilité de FinanceDB sur 150." } }
    - { id: c, text: { en: "Set LEGACY_CARDINALITY_ESTIMATION to ON for FinanceDB.", fr: "Définir LEGACY_CARDINALITY_ESTIMATION sur ON pour FinanceDB." } }
    - { id: d, text: { en: "Set PARAMETER_SNIFFING to OFF for FinanceDB.", fr: "Définir PARAMETER_SNIFFING sur OFF pour FinanceDB." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Table variable deferred compilation is an intelligent query processing feature enabled at compatibility level 150 and later. The optimizer defers the compilation of a statement that references a table variable until its first execution and uses the actual row count instead of a fixed guess.
    fr: |
      La compilation différée des variables de table est une fonctionnalité de traitement intelligent des requêtes activée à partir du niveau de compatibilité 150. L'optimiseur reporte la compilation d'une instruction qui référence une variable de table jusqu'à sa première exécution et utilise le nombre réel de lignes au lieu d'une estimation fixe.
  options:
    a: { en: "Level 140 enables interleaved execution, which fixes estimates of multi-statement table-valued functions, not table variables.", fr: "Le niveau 140 active l'exécution entrelacée, qui corrige les estimations des fonctions table à instructions multiples, pas celles des variables de table." }
    c: { en: "The legacy cardinality estimator also uses a fixed guess for table variables.", fr: "L'ancien estimateur de cardinalité utilise lui aussi une estimation fixe pour les variables de table." }
    d: { en: "Parameter sniffing concerns parameter values, not the row count of table variables.", fr: "La détection des paramètres concerne les valeurs des paramètres, pas le nombre de lignes des variables de table." }
references:
  - title: Intelligent query processing in SQL databases
    url: https://learn.microsoft.com/en-us/sql/relational-databases/performance/intelligent-query-processing
