id: dp300-cs3b-integrity-checks
objective: "3.3.3"
type: yesno_statements
caseStudy: dp300-cs3b-bellows-college
difficulty: 1
status: draft
stem:
  en: |
    You are planning the integrity checks of SIS to meet the maintenance requirements.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous planifiez les vérifications d'intégrité de SIS pour satisfaire les exigences de maintenance.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          The nightly check can be implemented by running `DBCC CHECKDB (N'SIS') WITH PHYSICAL_ONLY`.
        fr: |
          La vérification nocturne peut être implémentée en exécutant `DBCC CHECKDB (N'SIS') WITH PHYSICAL_ONLY`.
    - id: s2
      text:
        en: |
          The nightly `PHYSICAL_ONLY` check also meets the requirement for the monthly complete check.
        fr: |
          La vérification nocturne `PHYSICAL_ONLY` satisfait aussi l'exigence de vérification complète mensuelle.
    - id: s3
      text:
        en: |
          While `DBCC CHECKDB` runs against SIS with its default options, the updates of the users are blocked until the check completes.
        fr: |
          Pendant l'exécution de `DBCC CHECKDB` sur SIS avec ses options par défaut, les mises à jour des utilisateurs sont bloquées jusqu'à la fin de la vérification.
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: |
      `PHYSICAL_ONLY` limits the check to the physical structure of the pages and record headers and to allocation consistency; it has a small overhead and detects torn pages and checksum failures, so it suits frequent production checks. It skips the logical checks, so Microsoft still recommends a periodic `DBCC CHECKDB` without options for the complete check. By default, `DBCC CHECKDB` works on an internal database snapshot, which avoids blocking the users.
    fr: |
      `PHYSICAL_ONLY` limite la vérification à la structure physique des pages et des en-têtes d'enregistrement ainsi qu'à la cohérence des allocations ; sa surcharge est faible et elle détecte les pages déchirées et les erreurs de somme de contrôle : elle convient aux vérifications fréquentes en production. Elle ignore les vérifications logiques : Microsoft recommande donc toujours un `DBCC CHECKDB` périodique sans option pour la vérification complète. Par défaut, `DBCC CHECKDB` travaille sur un instantané de base de données interne, ce qui évite de bloquer les utilisateurs.
references:
  - title: DBCC CHECKDB (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/database-console-commands/dbcc-checkdb-transact-sql
