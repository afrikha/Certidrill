id: dp300-3b-dmv-last-hour
objective: "3.2.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have an Azure SQL database named **WebDB** that uses the General Purpose service tier.

    Users reported slow response times 20 minutes ago. You need to review the CPU, data I/O and log write utilization of WebDB for the last 30 minutes at a 15-second granularity. You are connected to WebDB.

    Which view should you query?
  fr: |
    Vous disposez d'une base de données Azure SQL nommée **WebDB** qui utilise le niveau de service General Purpose.

    Des utilisateurs ont signalé des temps de réponse lents il y a 20 minutes. Vous devez examiner l'utilisation du processeur, des E/S de données et de l'écriture du journal de WebDB au cours des 30 dernières minutes, avec une granularité de 15 secondes. Vous êtes connecté à WebDB.

    Quelle vue devez-vous interroger ?
body:
  options:
    - { id: a, text: "`sys.resource_stats`" }
    - { id: b, text: "`sys.dm_exec_query_stats`" }
    - { id: c, text: "`sys.dm_db_resource_stats`" }
    - { id: d, text: "`sys.dm_db_wait_stats`" }
answer: { optionId: c }
explanation:
  correct:
    en: "`sys.dm_db_resource_stats` returns one row for every 15-second interval for about the last hour, with columns such as `avg_cpu_percent`, `avg_data_io_percent` and `avg_log_write_percent`. It's the recommended starting point for analyzing the current resource use of a database."
    fr: "`sys.dm_db_resource_stats` renvoie une ligne pour chaque intervalle de 15 secondes pendant environ la dernière heure, avec des colonnes comme `avg_cpu_percent`, `avg_data_io_percent` et `avg_log_write_percent`. C'est le point de départ recommandé pour analyser l'utilisation actuelle des ressources d'une base."
  options:
    a: { en: "`sys.resource_stats` is in the `master` database and aggregates data every 5 minutes for about 14 days: too coarse for a 15-second analysis.", fr: "`sys.resource_stats` se trouve dans la base `master` et agrège les données toutes les 5 minutes pendant environ 14 jours : trop grossier pour une analyse à 15 secondes." }
    b: { en: "`sys.dm_exec_query_stats` aggregates statistics per cached statement, not resource utilization over time intervals.", fr: "`sys.dm_exec_query_stats` agrège des statistiques par instruction en cache, pas l'utilisation des ressources par intervalle de temps." }
    d: { en: "`sys.dm_db_wait_stats` returns waits aggregated for the database, not CPU, I/O and log percentages over time.", fr: "`sys.dm_db_wait_stats` renvoie les attentes agrégées de la base, pas les pourcentages de processeur, d'E/S et de journal dans le temps." }
references:
  - title: Monitor performance using dynamic management views
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/monitoring-with-dmvs
