id: dp300-3b-ixm-reorganize
objective: "3.3.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have an Azure SQL managed instance named **MI1** that hosts a database named **HRDB**. A nonclustered rowstore index named **IX_Employees_DeptID** shows moderate fragmentation and low page density, and queries that scan it have slowed down.

    You need to defragment and compact the index. The solution must meet the following requirements:

    - Minimize the resources consumed by the operation.
    - Never block queries on the table.
    - Keep the work already done if the operation is interrupted.

    Which statement should you run?
  fr: |
    Vous disposez d'une instance managée Azure SQL nommée **MI1** qui héberge une base de données nommée **HRDB**. Un index rowstore non cluster nommé **IX_Employees_DeptID** présente une fragmentation modérée et une faible densité de pages, et les requêtes qui l'analysent ont ralenti.

    Vous devez défragmenter et compacter l'index. La solution doit répondre aux exigences suivantes :

    - Réduire au minimum les ressources consommées par l'opération.
    - Ne jamais bloquer les requêtes sur la table.
    - Conserver le travail déjà effectué si l'opération est interrompue.

    Quelle instruction devez-vous exécuter ?
body:
  options:
    - { id: a, text: "ALTER INDEX IX_Employees_DeptID ON dbo.Employees REORGANIZE;" }
    - { id: b, text: "ALTER INDEX IX_Employees_DeptID ON dbo.Employees REBUILD;" }
    - { id: c, text: "ALTER INDEX IX_Employees_DeptID ON dbo.Employees REBUILD WITH (ONLINE = ON);" }
    - { id: d, text: "UPDATE STATISTICS dbo.Employees IX_Employees_DeptID WITH FULLSCAN;" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Reorganizing defragments the leaf level and compacts pages to the fill factor. It uses fewer resources than a rebuild and is Microsoft's preferred method unless there's a reason to rebuild, it is always an online operation, and the progress it has made is kept if it is stopped.
    fr: |
      La réorganisation défragmente le niveau feuille et compacte les pages selon le facteur de remplissage. Elle consomme moins de ressources qu'une reconstruction et constitue la méthode préférée de Microsoft sauf raison de reconstruire ; c'est toujours une opération en ligne, et la progression déjà réalisée est conservée si elle est arrêtée.
  options:
    b: { en: "An offline rebuild holds object-level locks for its whole duration and blocks queries.", fr: "Une reconstruction hors connexion détient des verrous au niveau de l'objet pendant toute sa durée et bloque les requêtes." }
    c: { en: "An online rebuild uses more resources and space for a second copy of the index, and a rebuild started without `RESUMABLE = ON` loses its progress if interrupted.", fr: "Une reconstruction en ligne consomme davantage de ressources et d'espace pour une seconde copie de l'index, et une reconstruction lancée sans `RESUMABLE = ON` perd sa progression si elle est interrompue." }
    d: { en: "Updating statistics refreshes the histogram but doesn't remove fragmentation or increase page density.", fr: "Mettre à jour les statistiques actualise l'histogramme mais ne supprime pas la fragmentation et n'augmente pas la densité des pages." }
references:
  - title: Optimize index maintenance to improve query performance and reduce resource consumption
    url: https://learn.microsoft.com/en-us/sql/relational-databases/indexes/reorganize-and-rebuild-indexes
