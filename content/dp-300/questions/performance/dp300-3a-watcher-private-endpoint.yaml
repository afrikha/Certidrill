id: dp300-3a-watcher-private-endpoint
objective: "3.1.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Contoso has a watcher named **wch1** that stores data in an Azure Data Explorer cluster. wch1 has two SQL targets: a managed instance named **MI1** and an elastic pool on a logical server named **sql-contoso**. The grant access script was run on both targets.

    Public network access is disabled on sql-contoso and must stay disabled. An administrator added a managed private endpoint for sql-contoso to wch1. wch1 is currently stopped.

    You need to ensure that wch1 can collect data from sql-contoso when it is started.

    What should you do?
  fr: |
    Contoso dispose d'un observateur nommé **wch1** qui stocke les données dans un cluster Azure Data Explorer. wch1 a deux cibles SQL : une instance managée nommée **MI1** et un pool élastique sur un serveur logique nommé **sql-contoso**. Le script d'octroi d'accès a été exécuté sur les deux cibles.

    L'accès réseau public est désactivé sur sql-contoso et doit le rester. Un administrateur a ajouté à wch1 un point de terminaison privé managé pour sql-contoso. wch1 est actuellement arrêté.

    Vous devez vous assurer que wch1 peut collecter les données de sql-contoso lorsqu'il sera démarré.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Approve the private endpoint connection of wch1 on sql-contoso.", fr: "Approuver la connexion de point de terminaison privé de wch1 sur sql-contoso." } }
    - { id: b, text: { en: "Allow Azure services and resources to access sql-contoso.", fr: "Autoriser les services et ressources Azure à accéder à sql-contoso." } }
    - { id: c, text: { en: "Add the login of wch1 to the ##MS_ServerStateManager## server role.", fr: "Ajouter la connexion de wch1 au rôle serveur ##MS_ServerStateManager##." } }
    - { id: d, text: { en: "Create a managed private endpoint for the Azure Data Explorer cluster.", fr: "Créer un point de terminaison privé managé pour le cluster Azure Data Explorer." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      A managed private endpoint is created in the Pending state. The owner of the target resource must approve it (for example in Private Link Center, Pending connections) before the watcher can use it. After approval, all the traffic to sql-contoso uses private connectivity, so public access can stay disabled.
    fr: |
      Un point de terminaison privé managé est créé à l'état Pending. Le propriétaire de la ressource cible doit l'approuver (par exemple dans le Centre Private Link, connexions en attente) avant que l'observateur puisse l'utiliser. Après l'approbation, tout le trafic vers sql-contoso passe par la connectivité privée : l'accès public peut rester désactivé.
  options:
    b: { en: "This setting uses public connectivity, and the requirement is to keep public network access disabled.", fr: "Ce paramètre utilise la connectivité publique, alors que l'accès réseau public doit rester désactivé." }
    c: { en: "A watcher needs only the roles of the grant script; extra permissions make it disconnect, and permissions don't fix connectivity.", fr: "Un observateur n'a besoin que des rôles du script d'octroi ; des autorisations supplémentaires provoquent sa déconnexion, et les autorisations ne résolvent pas la connectivité." }
    d: { en: "The problem is the connectivity to sql-contoso, not to the data store; nothing indicates that the data store is unreachable.", fr: "Le problème est la connectivité vers sql-contoso, pas vers le magasin de données ; rien n'indique que le magasin de données est inaccessible." }
references:
  - title: Create and configure a watcher (preview)
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database-watcher-manage
