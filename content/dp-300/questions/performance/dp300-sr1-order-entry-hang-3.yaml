id: dp300-sr1-order-entry-hang-3
objective: "3.2.3"
type: series_yesno
series: dp300-sr1-order-entry-hang
seriesOrder: 3
difficulty: 3
status: draft
stem:
  en: |
    You end each session returned by a filter on blocking_session_id.
  fr: |
    Vous mettez fin à chaque session renvoyée par un filtre sur blocking_session_id.
body:
  solution:
    en: |
      You run the following query, you run `SELECT * FROM sys.dm_exec_input_buffer(<session_id>, 0);` for each `session_id` returned, and then you run `KILL <session_id>` for each of them:

      `SELECT session_id, wait_type, wait_time FROM sys.dm_exec_requests WHERE blocking_session_id <> 0;`
    fr: |
      Vous exécutez la requête suivante, vous exécutez `SELECT * FROM sys.dm_exec_input_buffer(<session_id>, 0);` pour chaque `session_id` renvoyé, puis vous exécutez `KILL <session_id>` pour chacun d'eux :

      `SELECT session_id, wait_type, wait_time FROM sys.dm_exec_requests WHERE blocking_session_id <> 0;`
answer: { value: false }
explanation:
  correct:
    en: |
      The filter `blocking_session_id <> 0` returns the blocked requests, not the blocker: their `session_id` values are the victims of the chain. Killing them ends the users' order saves, while the head blocker keeps its locks and goes on blocking new requests.
    fr: |
      Le filtre `blocking_session_id <> 0` renvoie les requêtes bloquées, pas le bloqueur : leurs valeurs `session_id` sont les victimes de la chaîne. Les tuer interrompt les enregistrements de commandes des utilisateurs, tandis que le bloqueur de tête conserve ses verrous et continue de bloquer les nouvelles requêtes.
references:
  - title: Understand and resolve blocking problems
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/understand-resolve-blocking
