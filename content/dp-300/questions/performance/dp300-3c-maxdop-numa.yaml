id: dp300-3c-maxdop-numa
objective: "3.3.5"
type: single
difficulty: 3
status: draft
shuffle: false
stem:
  en: |
    You have an Azure virtual machine named SQLVM3 that runs SQL Server 2022. SQLVM3 has two NUMA nodes with 24 logical processors each. Automatic soft-NUMA is disabled.

    You need to set the `max degree of parallelism` server configuration option to the highest value that follows Microsoft's recommendations.

    Which value should you set?
  fr: |
    Vous disposez d'une machine virtuelle Azure nommée SQLVM3 qui exécute SQL Server 2022. SQLVM3 possède deux nœuds NUMA de 24 processeurs logiques chacun. Le soft-NUMA automatique est désactivé.

    Vous devez définir l'option de configuration de serveur `max degree of parallelism` sur la valeur la plus élevée conforme aux recommandations de Microsoft.

    Quelle valeur devez-vous définir ?
body:
  options:
    - { id: a, text: "8" }
    - { id: b, text: "12" }
    - { id: c, text: "16" }
    - { id: d, text: "24" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      For a server with several NUMA nodes and more than 16 logical processors per node, Microsoft recommends a MAXDOP of half the logical processors per NUMA node, with a maximum of 16. Half of 24 is 12, which is below the cap of 16.
    fr: |
      Pour un serveur à plusieurs nœuds NUMA et plus de 16 processeurs logiques par nœud, Microsoft recommande un MAXDOP égal à la moitié des processeurs logiques par nœud NUMA, avec un maximum de 16. La moitié de 24 est 12, en dessous du plafond de 16.
  options:
    a: { en: "8 is the recommendation for a single NUMA node with more than eight logical processors, not for this configuration.", fr: "8 est la recommandation pour un seul nœud NUMA de plus de huit processeurs logiques, pas pour cette configuration." }
    c: { en: "16 is only the upper limit of the recommendation; half of 24 logical processors per node is lower.", fr: "16 n'est que la limite supérieure de la recommandation ; la moitié de 24 processeurs logiques par nœud est inférieure." }
    d: { en: "Using all the logical processors of a node applies only when a node has 16 logical processors or fewer.", fr: "Utiliser tous les processeurs logiques d'un nœud ne s'applique que lorsqu'un nœud compte 16 processeurs logiques ou moins." }
references:
  - title: "Server configuration: max degree of parallelism"
    url: https://learn.microsoft.com/en-us/sql/database-engine/configure-windows/configure-the-max-degree-of-parallelism-server-configuration-option
