id: dp300-3b-blocking-rcsi-vm
objective: "3.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have an Azure virtual machine named **SQLVM1** that runs SQL Server 2022. SQLVM1 hosts a database named **InventoryDB** that uses the default database options. All the applications use the read committed isolation level.

    Reporting `SELECT` queries are frequently blocked by `UPDATE` transactions, and the `UPDATE` transactions are blocked by the reporting queries.

    You need to prevent readers and writers from blocking each other. The solution must not require changes to the application code.

    Which statement should you run during a maintenance window?
  fr: |
    Vous disposez d'une machine virtuelle Azure nommée **SQLVM1** qui exécute SQL Server 2022. SQLVM1 héberge une base de données nommée **InventoryDB** qui utilise les options de base de données par défaut. Toutes les applications utilisent le niveau d'isolation read committed.

    Les requêtes `SELECT` de création de rapports sont souvent bloquées par des transactions `UPDATE`, et les transactions `UPDATE` sont bloquées par les requêtes de création de rapports.

    Vous devez empêcher les lecteurs et les écrivains de se bloquer mutuellement. La solution ne doit pas exiger de modification du code des applications.

    Quelle instruction devez-vous exécuter pendant une fenêtre de maintenance ?
body:
  options:
    - { id: a, text: "ALTER DATABASE InventoryDB SET ALLOW_SNAPSHOT_ISOLATION ON;" }
    - { id: b, text: "ALTER DATABASE InventoryDB SET OPTIMIZED_LOCKING = ON;" }
    - { id: c, text: "ALTER DATABASE InventoryDB SET AUTO_UPDATE_STATISTICS_ASYNC ON;" }
    - { id: d, text: "ALTER DATABASE InventoryDB SET READ_COMMITTED_SNAPSHOT ON;" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      With `READ_COMMITTED_SNAPSHOT ON`, transactions that run at the read committed isolation level use row versioning instead of shared locks, so readers see the last committed version and don't block or wait for writers. The applications keep their isolation level, so no code changes are needed. The statement requires that no other connection is active in the database, hence the maintenance window.
    fr: |
      Avec `READ_COMMITTED_SNAPSHOT ON`, les transactions exécutées au niveau d'isolation read committed utilisent le contrôle de version de ligne au lieu de verrous partagés ; les lecteurs voient la dernière version validée et ne bloquent ni n'attendent les écrivains. Les applications conservent leur niveau d'isolation : aucune modification du code n'est nécessaire. L'instruction exige qu'aucune autre connexion ne soit active dans la base, d'où la fenêtre de maintenance.
  options:
    a: { en: "`ALLOW_SNAPSHOT_ISOLATION` only allows transactions to request the SNAPSHOT isolation level; each application would have to run `SET TRANSACTION ISOLATION LEVEL SNAPSHOT`, which is a code change.", fr: "`ALLOW_SNAPSHOT_ISOLATION` permet seulement aux transactions de demander le niveau d'isolation SNAPSHOT ; chaque application devrait exécuter `SET TRANSACTION ISOLATION LEVEL SNAPSHOT`, ce qui est une modification du code." }
    b: { en: "Optimized locking isn't available in SQL Server 2022 (it starts with SQL Server 2025), and it reduces the locks held by writers rather than the shared locks taken by readers.", fr: "Le verrouillage optimisé n'est pas disponible dans SQL Server 2022 (il apparaît avec SQL Server 2025) et il réduit les verrous détenus par les écrivains, pas les verrous partagés pris par les lecteurs." }
    c: { en: "Asynchronous statistics updates avoid compilation waits; they have no effect on lock blocking between readers and writers.", fr: "Les mises à jour asynchrones des statistiques évitent les attentes à la compilation ; elles n'ont aucun effet sur le blocage par verrous entre lecteurs et écrivains." }
references:
  - title: ALTER DATABASE SET options (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/statements/alter-database-transact-sql-set-options
  - title: Optimized locking
    url: https://learn.microsoft.com/en-us/sql/relational-databases/performance/optimized-locking
