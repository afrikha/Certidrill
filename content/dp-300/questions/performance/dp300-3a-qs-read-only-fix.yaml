id: dp300-3a-qs-read-only-fix
objective: "3.2.1"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    You have a SQL Server 2022 instance on an Azure virtual machine. Query Store is enabled on a database named **SalesDB** with `SIZE_BASED_CLEANUP_MODE = OFF`.

    The Query Store reports in SQL Server Management Studio (SSMS) show that no new query data has been captured for SalesDB since last week. You suspect that Query Store reached its storage limit.

    You need to confirm the cause and resume data capture without losing the data already collected.

    Which three actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Vous disposez d'une instance SQL Server 2022 sur une machine virtuelle Azure. Le Magasin des requêtes est activé sur une base de données nommée **SalesDB** avec `SIZE_BASED_CLEANUP_MODE = OFF`.

    Les rapports du Magasin des requêtes dans SQL Server Management Studio (SSMS) montrent qu'aucune nouvelle donnée de requête n'a été capturée pour SalesDB depuis la semaine dernière. Vous soupçonnez que le Magasin des requêtes a atteint sa limite de stockage.

    Vous devez confirmer la cause et reprendre la capture des données sans perdre les données déjà collectées.

    Quelles sont les trois actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - { id: check, text: { en: "Query sys.database_query_store_options and check actual_state_desc and readonly_reason.", fr: "Interroger sys.database_query_store_options et vérifier actual_state_desc et readonly_reason." } }
    - { id: size, text: { en: "Increase MAX_STORAGE_SIZE_MB of SalesDB.", fr: "Augmenter MAX_STORAGE_SIZE_MB de SalesDB." } }
    - { id: rw, text: { en: "Set OPERATION_MODE to READ_WRITE on SalesDB.", fr: "Définir OPERATION_MODE sur READ_WRITE sur SalesDB." } }
    - { id: clear, text: { en: "Run ALTER DATABASE SalesDB SET QUERY_STORE CLEAR ALL.", fr: "Exécuter ALTER DATABASE SalesDB SET QUERY_STORE CLEAR ALL." } }
    - { id: restart, text: { en: "Restart the SQL Server service.", fr: "Redémarrer le service SQL Server." } }
    - { id: capture, text: { en: "Set QUERY_CAPTURE_MODE to ALL on SalesDB.", fr: "Définir QUERY_CAPTURE_MODE sur ALL sur SalesDB." } }
answer:
  sequence: [ check, size, rw ]
explanation:
  correct:
    en: |
      When Query Store exceeds its size quota, it silently switches to READ_ONLY: actual_state_desc differs from desired_state_desc and readonly_reason is 65536. Raising MAX_STORAGE_SIZE_MB gives it room again, and setting OPERATION_MODE = READ_WRITE resumes capture while keeping the existing data.
    fr: |
      Quand le Magasin des requêtes dépasse son quota de taille, il passe silencieusement en READ_ONLY : actual_state_desc diffère de desired_state_desc et readonly_reason vaut 65536. Augmenter MAX_STORAGE_SIZE_MB lui redonne de la place, et définir OPERATION_MODE = READ_WRITE reprend la capture en conservant les données existantes.
  options:
    clear: { en: "CLEAR ALL also frees space, but it deletes the data already collected.", fr: "CLEAR ALL libère aussi de l'espace, mais il supprime les données déjà collectées." }
    restart: { en: "A restart doesn't free Query Store space; the store stays full.", fr: "Un redémarrage ne libère pas d'espace dans le Magasin des requêtes ; il reste plein." }
    capture: { en: "Capturing all queries makes Query Store grow faster and doesn't leave the READ_ONLY state.", fr: "Capturer toutes les requêtes fait croître le Magasin des requêtes plus vite et ne le fait pas sortir de l'état READ_ONLY." }
references:
  - title: Best practices for monitoring workloads with Query Store
    url: https://learn.microsoft.com/en-us/sql/relational-databases/performance/best-practice-with-the-query-store
  - title: sys.database_query_store_options (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/relational-databases/system-catalog-views/sys-database-query-store-options-transact-sql
