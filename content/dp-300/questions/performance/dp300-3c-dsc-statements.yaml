id: dp300-3c-dsc-statements
objective: "3.3.7"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    You have an Azure SQL managed instance named MI5 that hosts several databases, including a database named PayrollDB. You plan to use database-scoped configuration in PayrollDB.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'une instance managée Azure SQL nommée MI5 qui héberge plusieurs bases de données, dont une base nommée PayrollDB. Vous prévoyez d'utiliser la configuration à l'échelle de la base de données dans PayrollDB.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          Running `ALTER DATABASE SCOPED CONFIGURATION CLEAR PROCEDURE_CACHE;` in PayrollDB removes the cached plans of every database on MI5.
        fr: |
          L'exécution de `ALTER DATABASE SCOPED CONFIGURATION CLEAR PROCEDURE_CACHE;` dans PayrollDB supprime les plans en cache de toutes les bases de données de MI5.
    - id: s2
      text:
        en: |
          A user who has the `ALTER ANY DATABASE SCOPED CONFIGURATION` permission on PayrollDB can change the MAXDOP setting of PayrollDB.
        fr: |
          Un utilisateur qui dispose de l'autorisation `ALTER ANY DATABASE SCOPED CONFIGURATION` sur PayrollDB peut modifier le paramètre MAXDOP de PayrollDB.
    - id: s3
      text:
        en: |
          If you restore PayrollDB to another managed instance, its database-scoped configuration settings are reset to their default values.
        fr: |
          Si vous restaurez PayrollDB sur une autre instance managée, ses paramètres de configuration à l'échelle de la base de données reprennent leurs valeurs par défaut.
answer:
  values: { s1: false, s2: true, s3: false }
explanation:
  correct:
    en: |
      `CLEAR PROCEDURE_CACHE` clears the procedure cache of the current database only. Changing a database-scoped configuration requires the `ALTER ANY DATABASE SCOPED CONFIGURATION` permission on the database, which a user with `CONTROL` on the database can grant. The settings are stored in the database, so they stay with it when it's restored or attached elsewhere.
    fr: |
      `CLEAR PROCEDURE_CACHE` ne vide que le cache des procédures de la base de données courante. Modifier une configuration à l'échelle de la base exige l'autorisation `ALTER ANY DATABASE SCOPED CONFIGURATION` sur la base, qu'un utilisateur disposant de `CONTROL` sur la base peut accorder. Les paramètres sont stockés dans la base : ils la suivent quand elle est restaurée ou attachée ailleurs.
references:
  - title: ALTER DATABASE SCOPED CONFIGURATION (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/statements/alter-database-scoped-configuration-transact-sql
