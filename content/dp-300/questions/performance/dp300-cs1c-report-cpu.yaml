id: dp300-cs1c-report-cpu
objective: "3.3.6"
type: single
caseStudy: dp300-cs1c-litware-energy
difficulty: 2
status: draft
stem:
  en: |
    You plan to use Resource Governor on SQLVM2 with a classifier function that assigns the ReportSvc sessions to a dedicated workload group. You need to meet the performance requirements. What should you configure for the resource pool of that workload group?
  fr: |
    Vous prévoyez d'utiliser Resource Governor sur SQLVM2 avec une fonction de classification qui affecte les sessions de ReportSvc à un groupe de charges de travail dédié. Vous devez satisfaire les exigences de performances. Que devez-vous configurer pour le pool de ressources de ce groupe de charges de travail ?
body:
  options:
    - { id: a, text: "MAX_CPU_PERCENT = 25" }
    - { id: b, text: "MIN_CPU_PERCENT = 25" }
    - { id: c, text: "CAP_CPU_PERCENT = 25" }
    - { id: d, text: "MAX_MEMORY_PERCENT = 25" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      CAP_CPU_PERCENT is a hard limit: the requests of the pool never use more than 25 percent of the CPU, even when the rest of the server is idle. After you create the pool, the workload group and the classifier function, you run `ALTER RESOURCE GOVERNOR RECONFIGURE` to apply the configuration.
    fr: |
      CAP_CPU_PERCENT est une limite stricte : les requêtes du pool n'utilisent jamais plus de 25 % du processeur, même quand le reste du serveur est inactif. Après avoir créé le pool, le groupe de charges de travail et la fonction de classification, vous exécutez `ALTER RESOURCE GOVERNOR RECONFIGURE` pour appliquer la configuration.
  options:
    a: { en: "MAX_CPU_PERCENT is a soft limit enforced only when other pools compete for the CPU; when the server is otherwise idle, the reports could use all the CPU.", fr: "MAX_CPU_PERCENT est une limite souple appliquée uniquement quand d'autres pools sont en concurrence pour le processeur ; quand le serveur est inactif par ailleurs, les rapports pourraient utiliser tout le processeur." }
    b: { en: "MIN_CPU_PERCENT reserves CPU for the pool under contention; it sets no upper limit.", fr: "MIN_CPU_PERCENT réserve du processeur pour le pool en cas de contention ; il ne fixe aucune limite supérieure." }
    d: { en: "MAX_MEMORY_PERCENT limits the memory of the pool, not its CPU usage.", fr: "MAX_MEMORY_PERCENT limite la mémoire du pool, pas son utilisation du processeur." }
references:
  - title: Resource governor resource pool
    url: https://learn.microsoft.com/en-us/sql/relational-databases/resource-governor/resource-governor-resource-pool
