id: dp300-3c-host-caching
objective: "3.3.5"
type: hotarea
difficulty: 2
status: draft
stem:
  en: |
    You have an Azure virtual machine named SQLVM5 that runs SQL Server 2022. SQLVM5 has the Premium SSD data disks shown in the following table. `tempdb` is stored on the local temporary disk D:.

    You need to configure the host caching of each disk by following Microsoft's best practices for SQL Server on Azure VMs.

    Answer each prompt by selecting the appropriate host caching setting in the table.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'une machine virtuelle Azure nommée SQLVM5 qui exécute SQL Server 2022. SQLVM5 possède les disques de données SSD Premium indiqués dans le tableau suivant. `tempdb` est stockée sur le disque temporaire local D:.

    Vous devez configurer la mise en cache de l'hôte de chaque disque en suivant les bonnes pratiques de Microsoft pour SQL Server sur machines virtuelles Azure.

    Répondez à chaque consigne en sélectionnant le paramètre de mise en cache de l'hôte approprié dans le tableau.

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
    - id: p1
      text: { en: "Host caching for disk F:", fr: "Mise en cache de l'hôte pour le disque F:" }
    - id: p2
      text: { en: "Host caching for disk G:", fr: "Mise en cache de l'hôte pour le disque G:" }
  grid:
    header: [{ en: "Disk", fr: "Disque" }, { en: "Content", fr: "Contenu" }, None, ReadOnly, ReadWrite]
    rows:
      - [{ text: "F: (P30)" }, { text: { en: "Data files", fr: "Fichiers de données" } }, { text: None, area: f-none }, { text: ReadOnly, area: f-ro }, { text: ReadWrite, area: f-rw }]
      - [{ text: "G: (P30)" }, { text: { en: "Transaction log files", fr: "Fichiers du journal des transactions" } }, { text: None, area: g-none }, { text: ReadOnly, area: g-ro }, { text: ReadWrite, area: g-rw }]
answer:
  values: { p1: f-ro, p2: g-none }
explanation:
  correct:
    en: |
      Microsoft recommends read-only host caching for data disks, which speeds up reads of data pages, and no caching for log disks, whose writes are sequential and must be durable. Read/write caching is never recommended for SQL Server data or log disks. Stop the SQL Server service before changing the cache setting of a disk.
    fr: |
      Microsoft recommande la mise en cache de l'hôte en lecture seule pour les disques de données, ce qui accélère la lecture des pages de données, et aucune mise en cache pour les disques de journal, dont les écritures sont séquentielles et doivent être durables. La mise en cache en lecture/écriture n'est jamais recommandée pour les disques de données ou de journal de SQL Server. Arrêtez le service SQL Server avant de modifier la mise en cache d'un disque.
references:
  - title: "Checklist: Best practices for SQL Server on Azure VMs"
    url: https://learn.microsoft.com/en-us/azure/azure-sql/virtual-machines/windows/performance-guidelines-best-practices-checklist
