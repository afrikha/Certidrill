id: dp300-3c-rg-platform
objective: "3.3.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Fabrikam has an on-premises SQL Server 2019 Enterprise instance. The instance uses Resource Governor resource pools, workload groups and a classifier function to limit the CPU and memory used by reporting applications.

    You plan to migrate the instance to Azure. The solution must use a platform as a service (PaaS) offering and must keep the Resource Governor configuration.

    Which offering should you use?
  fr: |
    Fabrikam dispose d'une instance SQL Server 2019 Enterprise locale. L'instance utilise des pools de ressources, des groupes de charges de travail et une fonction de classification Resource Governor pour limiter le processeur et la mémoire utilisés par les applications de rapports.

    Vous prévoyez de migrer l'instance vers Azure. La solution doit utiliser une offre PaaS (platform as a service) et doit conserver la configuration Resource Governor.

    Quelle offre devez-vous utiliser ?
body:
  options:
    - { id: a, text: { en: "Azure SQL Database single databases in the Business Critical service tier", fr: "Des bases de données uniques Azure SQL Database dans le niveau de service Business Critical" } }
    - { id: b, text: { en: "Azure SQL Database elastic pools in the General Purpose service tier", fr: "Des pools élastiques Azure SQL Database dans le niveau de service General Purpose" } }
    - { id: c, text: { en: "Azure SQL Managed Instance in the General Purpose service tier", fr: "Azure SQL Managed Instance dans le niveau de service General Purpose" } }
    - { id: d, text: { en: "SQL Server 2022 Enterprise on Azure Virtual Machines", fr: "SQL Server 2022 Enterprise sur des machines virtuelles Azure" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Resource Governor is supported in SQL Server and Azure SQL Managed Instance, which is a PaaS offering. On a managed instance, you create resource pools, workload groups and the classifier function in the master database of the primary replica.
    fr: |
      Resource Governor est pris en charge dans SQL Server et dans Azure SQL Managed Instance, qui est une offre PaaS. Sur une instance managée, vous créez les pools de ressources, les groupes de charges de travail et la fonction de classification dans la base master du réplica principal.
  options:
    a: { en: "Azure SQL Database uses Resource Governor internally, but you can't configure resource pools or workload groups.", fr: "Azure SQL Database utilise Resource Governor en interne, mais vous ne pouvez pas configurer de pools de ressources ni de groupes de charges de travail." }
    b: { en: "Elastic pools share resources between databases, but they don't support a user Resource Governor configuration either.", fr: "Les pools élastiques partagent des ressources entre bases de données, mais ne prennent pas non plus en charge une configuration Resource Governor utilisateur." }
    d: { en: "SQL Server on Azure VMs supports Resource Governor, but it's an infrastructure as a service (IaaS) offering.", fr: "SQL Server sur machines virtuelles Azure prend en charge Resource Governor, mais c'est une offre IaaS (infrastructure as a service)." }
references:
  - title: Resource governor
    url: https://learn.microsoft.com/en-us/sql/relational-databases/resource-governor/resource-governor
