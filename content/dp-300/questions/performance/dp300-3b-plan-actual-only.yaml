id: dp300-3b-plan-actual-only
objective: "3.2.7"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    You have an Azure SQL managed instance named **MI1**. You need to explain to a junior administrator the difference between the estimated execution plan and the actual execution plan of a query.

    Which two pieces of information are available in the actual execution plan but not in the estimated execution plan?

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'une instance managée Azure SQL nommée **MI1**. Vous devez expliquer à un administrateur débutant la différence entre le plan d'exécution estimé et le plan d'exécution réel d'une requête.

    Quelles sont les deux informations disponibles dans le plan d'exécution réel mais pas dans le plan d'exécution estimé ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "The estimated subtree cost of each operator", fr: "Le coût estimé de la sous-arborescence de chaque opérateur" } }
    - { id: b, text: { en: "The actual number of rows returned by each operator", fr: "Le nombre réel de lignes renvoyées par chaque opérateur" } }
    - { id: c, text: { en: "A missing index suggestion", fr: "Une suggestion d'index manquant" } }
    - { id: d, text: { en: "A warning that a Hash Match operator spilled to `tempdb`", fr: "Un avertissement indiquant qu'un opérateur Hash Match a débordé dans `tempdb`" } }
    - { id: e, text: { en: "The estimated number of rows of each operator", fr: "Le nombre de lignes estimé de chaque opérateur" } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |
      The actual plan is the compiled plan enriched with runtime information collected during execution, such as the actual number of rows per operator, resource usage and runtime warnings like spills to `tempdb`. The estimated plan is compiled without running the query, so it contains only the optimizer's estimates.
    fr: |
      Le plan réel est le plan compilé enrichi des informations d'exécution collectées pendant l'exécution, comme le nombre réel de lignes par opérateur, l'utilisation des ressources et les avertissements d'exécution tels que les débordements dans `tempdb`. Le plan estimé est compilé sans exécuter la requête : il ne contient que les estimations de l'optimiseur.
  options:
    a: { en: "Costs are optimizer estimates calculated at compilation; both plans show them.", fr: "Les coûts sont des estimations de l'optimiseur calculées à la compilation ; les deux plans les affichent." }
    c: { en: "Missing index suggestions are produced during optimization, so the estimated plan can also contain them.", fr: "Les suggestions d'index manquants sont produites pendant l'optimisation : le plan estimé peut donc aussi les contenir." }
    e: { en: "Estimated row counts come from compilation and appear in both plans.", fr: "Les nombres de lignes estimés proviennent de la compilation et figurent dans les deux plans." }
references:
  - title: Display an actual execution plan
    url: https://learn.microsoft.com/en-us/sql/relational-databases/performance/display-an-actual-execution-plan
  - title: Tune nonclustered indexes with missing index suggestions
    url: https://learn.microsoft.com/en-us/sql/relational-databases/indexes/tune-nonclustered-missing-index-suggestions
