id: dp300-cs2a-psp
objective: "3.3.9"
type: yesno_statements
caseStudy: dp300-cs2a-proseware-market
difficulty: 2
status: draft
stem:
  en: |
    You plan to use parameter sensitive plan (PSP) optimization to meet the performance requirement for dbo.SearchListings.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous prévoyez d'utiliser l'optimisation du plan sensible aux paramètres (PSP) pour satisfaire l'exigence de performances relative à dbo.SearchListings.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          You must change the compatibility level of Orders before PSP optimization can be used for dbo.SearchListings.
        fr: |
          Vous devez modifier le niveau de compatibilité d'Orders avant que l'optimisation PSP puisse être utilisée pour dbo.SearchListings.
    - id: s2
      text:
        en: |
          PSP optimization is used for dbo.SearchListings only while Query Store is enabled on Orders.
        fr: |
          L'optimisation PSP n'est utilisée pour dbo.SearchListings que lorsque le Magasin des requêtes est activé sur Orders.
    - id: s3
      text:
        en: |
          After PSP optimization applies, a call for a seller with one million listings and a call for a seller with 50 listings can use different plans for the same parameterized statement.
        fr: |
          Une fois l'optimisation PSP appliquée, un appel pour un vendeur ayant un million d'annonces et un appel pour un vendeur ayant 50 annonces peuvent utiliser des plans différents pour la même instruction paramétrable.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |
      PSP optimization requires database compatibility level 160 or higher, and Orders is at 150, so the level must be raised; no code change is needed. Query Store is recommended for insight into the dispatcher and variant plans, but PSP optimization does not depend on it. At compile time, PSP builds a dispatcher plan that sorts the cardinality of the at-risk predicate into ranges, and each range gets its own query variant and plan, so large and small sellers can use different plans.
    fr: |
      L'optimisation PSP exige un niveau de compatibilité de base de données 160 ou supérieur, et Orders est au niveau 150 : le niveau doit donc être relevé, sans modification de code. Le Magasin des requêtes est recommandé pour observer les plans répartiteurs et les plans de variantes, mais l'optimisation PSP n'en dépend pas. À la compilation, PSP crée un plan répartiteur qui classe la cardinalité du prédicat à risque en plages, et chaque plage reçoit sa propre variante de requête et son propre plan : les grands et les petits vendeurs peuvent utiliser des plans différents.
references:
  - title: Parameter Sensitive Plan Optimization - SQL Server
    url: https://learn.microsoft.com/en-us/sql/relational-databases/performance/parameter-sensitive-plan-optimization
