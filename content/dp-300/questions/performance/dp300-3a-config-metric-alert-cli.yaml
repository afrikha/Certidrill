id: dp300-3a-config-metric-alert-cli
objective: "3.1.4"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    You have an Azure SQL database named **DB1** on a logical server named **sql-contoso**. DB1 uses the vCore purchasing model. An action group named **ag-dba** already exists in the resource group **RG1**.

    You need to notify the database administrators when the average CPU percentage of DB1 exceeds 80 % over a 15-minute period.

    How should you complete the Azure CLI command? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'une base de données Azure SQL nommée **DB1** sur un serveur logique nommé **sql-contoso**. DB1 utilise le modèle d'achat vCore. Un groupe d'actions nommé **ag-dba** existe déjà dans le groupe de ressources **RG1**.

    Vous devez avertir les administrateurs de bases de données lorsque le pourcentage moyen de processeur de DB1 dépasse 80 % sur une période de 15 minutes.

    Comment devez-vous compléter la commande Azure CLI ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: bash
  template: |
    az monitor [[cmd]] create --name sql-db1-cpu --resource-group RG1 \
      --scopes /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/RG1/providers/Microsoft.Sql/servers/sql-contoso/databases/DB1 \
      --condition "avg [[metric]] > 80" \
      --window-size 15m --evaluation-frequency 5m \
      --action ag-dba
  slots:
    - id: cmd
      options:
        - { id: metrics, text: metrics alert }
        - { id: activity, text: activity-log alert }
        - { id: sched, text: scheduled-query }
        - { id: ag, text: action-group }
    - id: metric
      options:
        - { id: cpu, text: cpu_percent }
        - { id: dtu, text: dtu_consumption_percent }
        - { id: inst, text: sql_instance_cpu_percent }
        - { id: io, text: physical_data_read_percent }
answer:
  values: { cmd: metrics, metric: cpu }
explanation:
  correct:
    en: "`az monitor metrics alert create` creates a metric alert rule that evaluates a platform metric against a threshold over a window. The CPU percentage metric of an Azure SQL database is named `cpu_percent`; it is relative to the vCore limit of the database."
    fr: "`az monitor metrics alert create` crée une règle d'alerte de métrique qui compare une métrique de plateforme à un seuil sur une fenêtre de temps. La métrique CPU percentage d'une base de données Azure SQL se nomme `cpu_percent` ; elle est relative à la limite de vCores de la base."
  options:
    activity: { en: "An activity log alert reacts to control plane events, not to a metric threshold.", fr: "Une alerte du journal d'activité réagit à des événements du plan de contrôle, pas à un seuil de métrique." }
    sched: { en: "scheduled-query creates a log search alert on a workspace; it doesn't take a metric condition such as avg cpu_percent > 80.", fr: "scheduled-query crée une alerte de recherche dans les journaux sur un espace de travail ; elle n'accepte pas une condition de métrique comme avg cpu_percent > 80." }
    ag: { en: "action-group creates the notification target, not the rule.", fr: "action-group crée la cible de notification, pas la règle." }
    dtu: { en: "dtu_consumption_percent applies to DTU-based databases.", fr: "dtu_consumption_percent s'applique aux bases de données du modèle DTU." }
    inst: { en: "sql_instance_cpu_percent measures the CPU of the hosting SQL instance, including internal workloads, not the CPU percentage of DB1.", fr: "sql_instance_cpu_percent mesure le processeur de l'instance SQL d'hébergement, charges internes comprises, pas le pourcentage de processeur de DB1." }
    io: { en: "physical_data_read_percent is the Data IO percentage metric.", fr: "physical_data_read_percent est la métrique Data IO percentage." }
references:
  - title: Monitoring data reference for Azure SQL Database
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/monitoring-sql-database-azure-monitor-reference
  - title: Monitor Azure SQL Database
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/monitoring-sql-database-azure-monitor
