id: dp300-3b-construct-implicit
objective: "3.2.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have an Azure SQL database named **CrmDB**. The table **dbo.Customers** contains 30 million rows and has a nonclustered index on the **AccountCode** column, defined as `varchar(20)`.

    An application runs a parameterized query that filters on AccountCode and passes the parameter as `nvarchar(20)`. The query consumes a high amount of CPU. Its actual execution plan shows an Index Scan on the AccountCode index and a `CONVERT_IMPLICIT` warning on AccountCode.

    You need to reduce the CPU consumption of the query.

    What should you recommend?
  fr: |
    Vous disposez d'une base de données Azure SQL nommée **CrmDB**. La table **dbo.Customers** contient 30 millions de lignes et a un index non cluster sur la colonne **AccountCode**, définie en `varchar(20)`.

    Une application exécute une requête paramétrable qui filtre sur AccountCode et transmet le paramètre en `nvarchar(20)`. La requête consomme beaucoup de processeur. Son plan d'exécution réel montre un Index Scan sur l'index d'AccountCode et un avertissement `CONVERT_IMPLICIT` sur AccountCode.

    Vous devez réduire la consommation de processeur de la requête.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "Add `OPTION (RECOMPILE)` to the query.", fr: "Ajouter `OPTION (RECOMPILE)` à la requête." } }
    - { id: b, text: { en: "Pass the parameter as `varchar(20)` in the application.", fr: "Transmettre le paramètre en `varchar(20)` dans l'application." } }
    - { id: c, text: { en: "Update the statistics of the AccountCode index with `FULLSCAN`.", fr: "Mettre à jour les statistiques de l'index d'AccountCode avec `FULLSCAN`." } }
    - { id: d, text: { en: "Rebuild the AccountCode index with `ONLINE = ON`.", fr: "Reconstruire l'index d'AccountCode avec `ONLINE = ON`." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Because `nvarchar` has a higher data type precedence than `varchar`, the engine converts the column value of every row to compare it with the parameter, which prevents an efficient seek and burns CPU. Declaring the parameter with the column's data type removes the conversion, and the optimizer can seek on the index.
    fr: |
      Comme `nvarchar` a une priorité de type de données supérieure à `varchar`, le moteur convertit la valeur de la colonne de chaque ligne pour la comparer au paramètre, ce qui empêche une recherche (seek) efficace et consomme du processeur. Déclarer le paramètre avec le type de données de la colonne supprime la conversion, et l'optimiseur peut effectuer une recherche dans l'index.
  options:
    a: { en: "Recompiling for each execution doesn't remove the data type mismatch; it adds compilation CPU.", fr: "Recompiler à chaque exécution ne supprime pas l'incompatibilité de types ; cela ajoute du processeur de compilation." }
    c: { en: "Accurate statistics don't help when the predicate itself requires converting every row.", fr: "Des statistiques exactes n'aident pas quand le prédicat lui-même exige de convertir chaque ligne." }
    d: { en: "A rebuild removes fragmentation, but the conversion still forces the scan.", fr: "Une reconstruction supprime la fragmentation, mais la conversion impose toujours l'analyse." }
references:
  - title: Detect query performance bottlenecks
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/identify-query-performance-issues
