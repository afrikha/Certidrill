id: dp300-3c-iqp-feature-match
objective: "3.3.9"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    You have an Azure SQL database named AnalyticsDB that uses compatibility level 160. Query Store is enabled in `READ_WRITE` mode. You identify the performance problems shown in the answer area.

    Which intelligent query processing feature addresses each problem without code changes? To answer, drag the appropriate features to the correct problems. Each feature may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'une base de données Azure SQL nommée AnalyticsDB qui utilise le niveau de compatibilité 160. Le Magasin des requêtes est activé en mode `READ_WRITE`. Vous identifiez les problèmes de performances indiqués dans la zone de réponse.

    Quelle fonctionnalité de traitement intelligent des requêtes résout chaque problème sans modification du code ? Pour répondre, faites glisser les fonctionnalités appropriées vers les problèmes correspondants. Chaque fonctionnalité peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: inline, text: { en: "Scalar UDF inlining", fr: "Incorporation des UDF scalaires" } }
    - { id: psp, text: { en: "Parameter Sensitive Plan optimization", fr: "Optimisation du plan sensible aux paramètres" } }
    - { id: mgf, text: { en: "Memory grant feedback", fr: "Rétroaction d'allocation de mémoire" } }
    - { id: interleaved, text: { en: "Interleaved execution", fr: "Exécution entrelacée" } }
    - { id: adaptive, text: { en: "Adaptive joins", fr: "Jointures adaptatives" } }
    - { id: batch, text: { en: "Batch mode on rowstore", fr: "Mode batch sur rowstore" } }
  targets:
    - { id: udf, text: { en: "A query calls a scalar user-defined function that runs once per row.", fr: "Une requête appelle une fonction scalaire définie par l'utilisateur qui s'exécute une fois par ligne." } }
    - { id: params, text: { en: "The cached plan of a stored procedure is fast for some parameter values and slow for others.", fr: "Le plan en cache d'une procédure stockée est rapide pour certaines valeurs de paramètres et lent pour d'autres." } }
    - { id: spill, text: { en: "A query that runs every few minutes spills to tempdb because its memory grant is too small.", fr: "Une requête exécutée toutes les quelques minutes déborde dans tempdb car son allocation de mémoire est trop petite." } }
    - { id: mstvf, text: { en: "A query uses a multi-statement table-valued function whose row count is a fixed guess.", fr: "Une requête utilise une fonction table à instructions multiples dont le nombre de lignes est une estimation fixe." } }
answer:
  mapping: { udf: inline, params: psp, spill: mgf, mstvf: interleaved }
explanation:
  correct:
    en: |
      Scalar UDF inlining (level 150) transforms scalar functions into relational expressions so they no longer run row by row. Parameter Sensitive Plan optimization (level 160) caches several plans for a parameterized statement. Memory grant feedback adjusts the grant of repeating queries that spill or waste memory. Interleaved execution (level 140) pauses optimization to use the actual row count of a multi-statement table-valued function. Adaptive joins choose the join type at run time, and batch mode on rowstore speeds up analytic queries; neither fixes a listed problem.
    fr: |
      L'incorporation des UDF scalaires (niveau 150) transforme les fonctions scalaires en expressions relationnelles pour qu'elles ne s'exécutent plus ligne par ligne. L'optimisation du plan sensible aux paramètres (niveau 160) met en cache plusieurs plans pour une instruction paramétrable. La rétroaction d'allocation de mémoire ajuste l'allocation des requêtes répétées qui débordent ou gaspillent de la mémoire. L'exécution entrelacée (niveau 140) interrompt l'optimisation pour utiliser le nombre réel de lignes d'une fonction table à instructions multiples. Les jointures adaptatives choisissent le type de jointure à l'exécution et le mode batch sur rowstore accélère les requêtes analytiques ; aucun ne résout un problème de la liste.
references:
  - title: Intelligent query processing in SQL databases
    url: https://learn.microsoft.com/en-us/sql/relational-databases/performance/intelligent-query-processing
