id: dp300-3a-baseline-compat-level
objective: "3.1.1"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    You have a SQL Server 2022 instance on an Azure virtual machine. You restored a database named **SalesDB** from a SQL Server 2019 instance. SalesDB uses compatibility level 150, and Query Store is disabled on it.

    You plan to change the compatibility level of SalesDB to 160. You need to build a performance baseline so that you can identify and fix the queries that regress after the change.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Vous disposez d'une instance SQL Server 2022 sur une machine virtuelle Azure. Vous avez restauré une base de données nommée **SalesDB** à partir d'une instance SQL Server 2019. SalesDB utilise le niveau de compatibilité 150, et le Magasin des requêtes y est désactivé.

    Vous prévoyez de passer le niveau de compatibilité de SalesDB à 160. Vous devez constituer une base de référence des performances afin de pouvoir identifier et corriger les requêtes qui régressent après le changement.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: enable, text: { en: "Enable Query Store on SalesDB in READ_WRITE mode.", fr: "Activer le Magasin des requêtes sur SalesDB en mode READ_WRITE." } }
    - { id: capture, text: { en: "Run the workload for a representative period at compatibility level 150.", fr: "Exécuter la charge de travail pendant une période représentative au niveau de compatibilité 150." } }
    - { id: change, text: { en: "Set the compatibility level of SalesDB to 160.", fr: "Définir le niveau de compatibilité de SalesDB sur 160." } }
    - { id: review, text: { en: "Review the Regressed Queries report and force the previous plan of each regressed query.", fr: "Examiner le rapport Regressed Queries et forcer le plan précédent de chaque requête qui a régressé." } }
    - { id: clear, text: { en: "Clear the Query Store data of SalesDB.", fr: "Effacer les données du Magasin des requêtes de SalesDB." } }
    - { id: none, text: { en: "Set QUERY_CAPTURE_MODE to NONE on SalesDB.", fr: "Définir QUERY_CAPTURE_MODE sur NONE sur SalesDB." } }
answer:
  sequence: [ enable, capture, change, review ]
explanation:
  correct:
    en: |
      Query Store must collect data before the change, so you enable it first and let it record the plans and runtime statistics of the workload at level 150: that is the baseline. After you raise the level to 160, the Regressed Queries report compares the new plans with the baseline, and you can force the previous plan of a query that got slower without changing the code.
    fr: |
      Le Magasin des requêtes doit collecter des données avant le changement : vous l'activez d'abord et le laissez enregistrer les plans et les statistiques d'exécution de la charge de travail au niveau 150, ce qui constitue la base de référence. Après le passage au niveau 160, le rapport Regressed Queries compare les nouveaux plans à cette base de référence, et vous pouvez forcer le plan précédent d'une requête devenue plus lente sans modifier le code.
  options:
    clear: { en: "Clearing Query Store deletes the baseline you need for the comparison.", fr: "Effacer le Magasin des requêtes supprime la base de référence nécessaire à la comparaison." }
    none: { en: "With QUERY_CAPTURE_MODE = NONE, Query Store stops capturing new queries, so new plans would be missing.", fr: "Avec QUERY_CAPTURE_MODE = NONE, le Magasin des requêtes ne capture plus les nouvelles requêtes : les nouveaux plans manqueraient." }
references:
  - title: Monitor performance by using the Query Store
    url: https://learn.microsoft.com/en-us/sql/relational-databases/performance/monitoring-performance-by-using-the-query-store
