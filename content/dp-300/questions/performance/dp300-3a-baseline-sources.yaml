id: dp300-3a-baseline-sources
objective: "3.1.1"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Contoso has an Azure SQL database named **DB1** and an Azure SQL managed instance named **MI1**. No diagnostic setting, agent or custom collection is configured.

    You are preparing a performance baseline. You need to identify the source that provides each set of data.

    Which source should you use for each requirement? To answer, drag the appropriate sources to the correct requirements. Each source may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso dispose d'une base de données Azure SQL nommée **DB1** et d'une instance managée Azure SQL nommée **MI1**. Aucun paramètre de diagnostic, aucun agent et aucune collecte personnalisée ne sont configurés.

    Vous préparez une base de référence des performances. Vous devez identifier la source qui fournit chaque ensemble de données.

    Quelle source devez-vous utiliser pour chaque exigence ? Pour répondre, faites glisser les sources appropriées vers les exigences correspondantes. Chaque source peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: dbres, text: sys.dm_db_resource_stats }
    - { id: res, text: sys.resource_stats }
    - { id: srvres, text: sys.server_resource_stats }
    - { id: metrics, text: { en: "Azure Monitor platform metrics", fr: "Métriques de plateforme Azure Monitor" } }
    - { id: qs, text: { en: "Query Store", fr: "Magasin des requêtes" } }
  targets:
    - id: t1
      text: { en: "CPU and log write usage of DB1 in 15-second intervals for the last 30 minutes", fr: "Utilisation du processeur et de l'écriture dans le journal de DB1 par intervalles de 15 secondes pendant les 30 dernières minutes" }
    - id: t2
      text: { en: "Charts of the CPU percentage of DB1 for a week two months ago, compared with last week", fr: "Graphiques du pourcentage de processeur de DB1 pour une semaine d'il y a deux mois, comparés à la semaine dernière" }
    - id: t3
      text: { en: "CPU usage history of MI1 retrieved with Transact-SQL", fr: "Historique de l'utilisation du processeur de MI1 récupéré en Transact-SQL" }
answer:
  mapping: { t1: dbres, t2: metrics, t3: srvres }
explanation:
  correct:
    en: "`sys.dm_db_resource_stats` returns one row every 15 seconds for about one hour, in each Azure SQL database. Azure Monitor platform metrics are collected without configuration and kept for 93 days, so a week two months ago is still available (each chart covers up to 30 days). `sys.dm_db_resource_stats` isn't supported in SQL Managed Instance: its resource usage history comes from `sys.server_resource_stats` in `master`."
    fr: "`sys.dm_db_resource_stats` renvoie une ligne toutes les 15 secondes pendant environ une heure, dans chaque base de données Azure SQL. Les métriques de plateforme Azure Monitor sont collectées sans configuration et conservées 93 jours : une semaine d'il y a deux mois est donc encore disponible (chaque graphique couvre jusqu'à 30 jours). `sys.dm_db_resource_stats` n'est pas pris en charge dans SQL Managed Instance : l'historique d'utilisation de ses ressources provient de `sys.server_resource_stats` dans `master`."
  options:
    res: { en: "sys.resource_stats exists in the master database of a logical server only, and keeps about 14 days.", fr: "sys.resource_stats n'existe que dans la base master d'un serveur logique et conserve environ 14 jours." }
    qs: { en: "Query Store records per-query statistics, not the CPU percentage of the database or the instance.", fr: "Le Magasin des requêtes enregistre des statistiques par requête, pas le pourcentage de processeur de la base ou de l'instance." }
references:
  - title: sys.dm_db_resource_stats (Azure SQL Database)
    url: https://learn.microsoft.com/en-us/sql/relational-databases/system-dynamic-management-views/sys-dm-db-resource-stats-azure-sql-database
  - title: Azure Monitor Metrics overview
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/metrics/data-platform-metrics
