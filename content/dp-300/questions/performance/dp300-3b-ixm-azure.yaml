id: dp300-3b-ixm-azure
objective: "3.3.1"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    You are defining the index maintenance strategy for an Azure SQL database named **OrdersDB** that uses the Business Critical service tier.

    Which two statements are true?

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous définissez la stratégie de maintenance des index d'une base de données Azure SQL nommée **OrdersDB** qui utilise le niveau de service Business Critical.

    Quelles sont les deux affirmations vraies ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Index rebuilds and reorganizations consume the same governed resources as the user workload, so they can slow down concurrent queries.", fr: "Les reconstructions et réorganisations d'index consomment les mêmes ressources gouvernées que la charge de travail utilisateur ; elles peuvent donc ralentir les requêtes simultanées." } }
    - { id: b, text: { en: "Microsoft recommends basing index maintenance decisions only on fixed fragmentation thresholds.", fr: "Microsoft recommande de fonder les décisions de maintenance des index uniquement sur des seuils de fragmentation fixes." } }
    - { id: c, text: { en: "Reorganizing an index updates the statistics of the index.", fr: "Réorganiser un index met à jour les statistiques de l'index." } }
    - { id: d, text: { en: "Data latency on the replicas of OrdersDB can increase while index maintenance runs on the primary replica.", fr: "La latence des données sur les réplicas d'OrdersDB peut augmenter pendant que la maintenance des index s'exécute sur le réplica principal." } }
    - { id: e, text: { en: "A resumable index rebuild can be run on a filtered index.", fr: "Une reconstruction d'index pouvant être reprise peut être exécutée sur un index filtré." } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: |
      In Azure SQL Database, maintenance operations are subject to the same resource governance as user queries, so they compete with the workload for CPU, I/O and log throughput. The large volume of log they generate can also increase data latency on the replicas. Run maintenance only when it brings a demonstrated benefit, preferably outside peak hours.
    fr: |
      Dans Azure SQL Database, les opérations de maintenance sont soumises à la même gouvernance des ressources que les requêtes utilisateur : elles sont en concurrence avec la charge de travail pour le processeur, les E/S et le débit du journal. Le volume important de journal qu'elles génèrent peut aussi augmenter la latence des données sur les réplicas. N'exécutez la maintenance que lorsqu'elle apporte un bénéfice démontré, de préférence en dehors des heures de pointe.
  options:
    b: { en: "Microsoft states that maintenance decisions shouldn't be based on fixed fragmentation or page density thresholds alone, nor on a fixed schedule.", fr: "Microsoft indique que les décisions de maintenance ne doivent pas reposer uniquement sur des seuils fixes de fragmentation ou de densité des pages, ni sur une planification fixe." }
    c: { en: "Statistics aren't updated when an index is reorganized; a rebuild updates the index statistics.", fr: "Les statistiques ne sont pas mises à jour lors de la réorganisation d'un index ; une reconstruction met à jour les statistiques de l'index." }
    e: { en: "Resumable operations aren't supported for filtered indexes, columnstore indexes or disabled indexes.", fr: "Les opérations pouvant être reprises ne sont pas prises en charge pour les index filtrés, les index columnstore ni les index désactivés." }
references:
  - title: Optimize index maintenance to improve query performance and reduce resource consumption
    url: https://learn.microsoft.com/en-us/sql/relational-databases/indexes/reorganize-and-rebuild-indexes
  - title: ALTER INDEX (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/statements/alter-index-transact-sql
