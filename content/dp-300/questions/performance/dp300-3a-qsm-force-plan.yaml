id: dp300-3a-qsm-force-plan
objective: "3.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have an Azure SQL database named **DB1**. In Query Store, the query with query_id **48** has two plans: plan_id **12**, which ran in 300 ms on average until yesterday, and plan_id **57**, which has been used since this morning and runs in 9 seconds on average.

    You need to restore the previous performance of the query immediately. The application code can't be modified.

    Which Transact-SQL statement should you run?
  fr: |
    Vous disposez d'une base de données Azure SQL nommée **DB1**. Dans le Magasin des requêtes, la requête dont le query_id vaut **48** a deux plans : le plan_id **12**, qui s'exécutait en 300 ms en moyenne jusqu'à hier, et le plan_id **57**, utilisé depuis ce matin, qui s'exécute en 9 secondes en moyenne.

    Vous devez rétablir immédiatement les performances précédentes de la requête. Le code de l'application ne peut pas être modifié.

    Quelle instruction Transact-SQL devez-vous exécuter ?
body:
  options:
    - { id: a, text: "EXEC sp_query_store_unforce_plan @query_id = 48, @plan_id = 12;" }
    - { id: b, text: "EXEC sp_query_store_remove_plan @plan_id = 57;" }
    - { id: c, text: "EXEC sp_query_store_force_plan @query_id = 48, @plan_id = 12;" }
    - { id: d, text: "EXEC sp_query_store_reset_exec_stats @plan_id = 57;" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      sp_query_store_force_plan makes the optimizer use plan 12 for query 48 on every compilation, without any change to the application. You can later remove the forcing with sp_query_store_unforce_plan.
    fr: |
      sp_query_store_force_plan oblige l'optimiseur à utiliser le plan 12 pour la requête 48 à chaque compilation, sans aucune modification de l'application. Vous pouvez ensuite supprimer le forçage avec sp_query_store_unforce_plan.
  options:
    a: { en: "unforce removes a forcing; plan 12 isn't forced, and the query keeps using plan 57.", fr: "unforce supprime un forçage ; le plan 12 n'est pas forcé, et la requête continue d'utiliser le plan 57." }
    b: { en: "Removing plan 57 from Query Store doesn't prevent the optimizer from compiling the same plan again.", fr: "Supprimer le plan 57 du Magasin des requêtes n'empêche pas l'optimiseur de recompiler le même plan." }
    d: { en: "Resetting the runtime statistics of plan 57 only clears its statistics; the plan stays in use.", fr: "Réinitialiser les statistiques d'exécution du plan 57 efface seulement ses statistiques ; le plan reste utilisé." }
references:
  - title: Monitor performance by using the Query Store
    url: https://learn.microsoft.com/en-us/sql/relational-databases/performance/monitoring-performance-by-using-the-query-store
