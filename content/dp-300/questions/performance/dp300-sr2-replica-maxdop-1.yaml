id: dp300-sr2-replica-maxdop-1
objective: "3.3.7"
type: series_yesno
series: dp300-sr2-replica-maxdop
seriesOrder: 1
difficulty: 2
status: draft
stem:
  en: |
    You set MAXDOP by using the FOR SECONDARY clause.
  fr: |
    Vous définissez MAXDOP avec la clause FOR SECONDARY.
body:
  solution:
    en: |
      You connect to SalesDb on the primary replica and run `ALTER DATABASE SCOPED CONFIGURATION FOR SECONDARY SET MAXDOP = 2;`.
    fr: |
      Vous vous connectez à SalesDb sur le réplica principal et exécutez `ALTER DATABASE SCOPED CONFIGURATION FOR SECONDARY SET MAXDOP = 2;`.
answer: { value: true }
explanation:
  correct:
    en: |
      The `FOR SECONDARY` clause sets a MAXDOP value that applies to the secondary replicas, such as the read scale-out replica, independently of the primary. The primary keeps its value of 8, and `sys.database_scoped_configurations` then shows 8 in `value` and 2 in `value_for_secondary`. No application code changes.
    fr: |
      La clause `FOR SECONDARY` définit une valeur de MAXDOP qui s'applique aux réplicas secondaires, comme le réplica de scale-out en lecture, indépendamment du principal. Le principal conserve sa valeur de 8, et `sys.database_scoped_configurations` affiche alors 8 dans `value` et 2 dans `value_for_secondary`. Aucun code d'application ne change.
references:
  - title: "Configure the max degree of parallelism (MAXDOP) in Azure SQL Database and SQL database in Fabric"
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/configure-max-degree-of-parallelism
