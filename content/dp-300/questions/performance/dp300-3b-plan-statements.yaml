id: dp300-3b-plan-statements
objective: "3.2.7"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    You review execution plans for queries that run in an Azure SQL database named **LogisticsDB** by using SQL Server Management Studio (SSMS).

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous examinez les plans d'exécution des requêtes exécutées dans une base de données Azure SQL nommée **LogisticsDB** à l'aide de SQL Server Management Studio (SSMS).

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          A Key Lookup operator that executes thousands of times shows that the nonclustered index used by the query doesn't contain all the columns that the query needs.
        fr: |
          Un opérateur Key Lookup qui s'exécute des milliers de fois montre que l'index non cluster utilisé par la requête ne contient pas toutes les colonnes dont la requête a besoin.
    - id: s2
      text:
        en: |
          You must enable trace flag 7412 before you can collect lightweight profiling data for queries in LogisticsDB.
        fr: |
          Vous devez activer l'indicateur de trace 7412 avant de pouvoir collecter des données de profilage léger pour les requêtes de LogisticsDB.
    - id: s3
      text:
        en: |
          Live Query Statistics shows the progress of the operators of a query while the query is still running.
        fr: |
          Live Query Statistics affiche la progression des opérateurs d'une requête pendant que celle-ci est encore en cours d'exécution.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |
      A Key Lookup retrieves from the clustered index the columns that the nonclustered index doesn't cover; executed many times, it suggests adding those columns with `INCLUDE`. Lightweight profiling is enabled by default in Azure SQL Database and SQL Server 2019 and later, where trace flag 7412 has no effect. Live Query Statistics uses the profiling infrastructure to display operator progress during execution.
    fr: |
      Un Key Lookup récupère dans l'index cluster les colonnes que l'index non cluster ne couvre pas ; exécuté de nombreuses fois, il suggère d'ajouter ces colonnes avec `INCLUDE`. Le profilage léger est activé par défaut dans Azure SQL Database et dans SQL Server 2019 et versions ultérieures, où l'indicateur de trace 7412 n'a aucun effet. Live Query Statistics utilise l'infrastructure de profilage pour afficher la progression des opérateurs pendant l'exécution.
references:
  - title: Query Profiling Infrastructure
    url: https://learn.microsoft.com/en-us/sql/relational-databases/performance/query-profiling-infrastructure
  - title: Index architecture and design guide
    url: https://learn.microsoft.com/en-us/sql/relational-databases/sql-server-index-design-guide
