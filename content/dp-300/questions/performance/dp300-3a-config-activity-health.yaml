id: dp300-3a-config-activity-health
objective: "3.1.4"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    You have an Azure SQL database named **DB1** and an action group named **ag-ops**.

    You need to notify the members of ag-ops in the following situations:

    - Someone changes the service objective of DB1.
    - Azure Resource Health reports that DB1 is unavailable.

    Which two alert rules should you create? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'une base de données Azure SQL nommée **DB1** et d'un groupe d'actions nommé **ag-ops**.

    Vous devez avertir les membres de ag-ops dans les situations suivantes :

    - Quelqu'un modifie l'objectif de service de DB1.
    - Azure Resource Health signale que DB1 est indisponible.

    Quelles sont les deux règles d'alerte à créer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "A metric alert rule on the CPU percentage of DB1", fr: "Une règle d'alerte de métrique sur le pourcentage de processeur de DB1" } }
    - { id: b, text: { en: "An activity log alert rule on the write operation of DB1 (Microsoft.Sql/servers/databases/write)", fr: "Une règle d'alerte du journal d'activité sur l'opération d'écriture de DB1 (Microsoft.Sql/servers/databases/write)" } }
    - { id: c, text: { en: "A log search alert rule on the Errors category of DB1", fr: "Une règle d'alerte de recherche dans les journaux sur la catégorie Errors de DB1" } }
    - { id: d, text: { en: "A Resource Health alert rule for DB1", fr: "Une règle d'alerte Resource Health pour DB1" } }
    - { id: e, text: { en: "A metric alert rule on the Failed Connections metric of DB1", fr: "Une règle d'alerte de métrique sur la métrique Failed Connections de DB1" } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |
      Changing the service objective is a control plane update of the database resource, recorded in the activity log, so an activity log alert rule on that operation fires. Resource Health alerts are a type of activity log alert that fire when the health status of the resource changes, for example to Unavailable.
    fr: |
      Modifier l'objectif de service est une mise à jour de la ressource base de données par le plan de contrôle, enregistrée dans le journal d'activité : une règle d'alerte du journal d'activité sur cette opération se déclenche. Les alertes Resource Health sont un type d'alerte du journal d'activité qui se déclenche quand l'état d'intégrité de la ressource change, par exemple vers Unavailable.
  options:
    a: { en: "CPU percentage doesn't show who changed the service objective, nor the health status reported by Resource Health.", fr: "Le pourcentage de processeur n'indique ni qui a modifié l'objectif de service, ni l'état d'intégrité signalé par Resource Health." }
    c: { en: "The Errors log records database engine errors; it needs a diagnostic setting and doesn't report scaling operations or Resource Health status.", fr: "Le journal Errors enregistre les erreurs du moteur de base de données ; il exige un paramètre de diagnostic et ne signale ni les opérations de mise à l'échelle, ni l'état Resource Health." }
    e: { en: "Failed connections can have many causes; this metric is not the Resource Health availability signal.", fr: "Les échecs de connexion peuvent avoir de nombreuses causes ; cette métrique n'est pas le signal de disponibilité de Resource Health." }
references:
  - title: Monitor Azure SQL Database
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/monitoring-sql-database-azure-monitor
