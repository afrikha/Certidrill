id: dp300-3b-dmv-statements
objective: "3.2.4"
type: yesno_statements
difficulty: 3
status: draft
stem:
  en: |
    You have an Azure SQL database named **AppDB** in the General Purpose service tier. A database user named **Monitor1** must analyze query performance by using dynamic management views (DMVs). One of the application's stored procedures uses `OPTION (RECOMPILE)` on its main query.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'une base de données Azure SQL nommée **AppDB** au niveau de service General Purpose. Un utilisateur de base de données nommé **Monitor1** doit analyser les performances des requêtes à l'aide des vues de gestion dynamique (DMV). L'une des procédures stockées de l'application utilise `OPTION (RECOMPILE)` sur sa requête principale.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          After a failover of AppDB, `sys.dm_exec_query_stats` still returns the statistics of the queries that ran before the failover.
        fr: |
          Après un basculement d'AppDB, `sys.dm_exec_query_stats` renvoie toujours les statistiques des requêtes exécutées avant le basculement.
    - id: s2
      text:
        en: |
          The main query of the stored procedure that uses `OPTION (RECOMPILE)` appears in `sys.dm_exec_query_stats`.
        fr: |
          La requête principale de la procédure stockée qui utilise `OPTION (RECOMPILE)` apparaît dans `sys.dm_exec_query_stats`.
    - id: s3
      text:
        en: |
          After you grant `VIEW DATABASE STATE` to Monitor1, Monitor1 can query `sys.dm_db_resource_stats` in AppDB.
        fr: |
          Après que vous avez accordé `VIEW DATABASE STATE` à Monitor1, Monitor1 peut interroger `sys.dm_db_resource_stats` dans AppDB.
answer:
  values: { s1: false, s2: false, s3: true }
explanation:
  correct:
    en: "`sys.dm_exec_query_stats` returns one row per statement in the plan cache, and the cache is cleared by a restart or a failover; use Query Store for history that survives them. A query compiled with `OPTION (RECOMPILE)` isn't cached, so it doesn't appear in the view. In Azure SQL Database, `VIEW DATABASE STATE` granted to a database user is the permission that database-scoped DMVs such as `sys.dm_db_resource_stats` require."
    fr: "`sys.dm_exec_query_stats` renvoie une ligne par instruction du cache de plans, et ce cache est vidé par un redémarrage ou un basculement ; utilisez le Magasin des requêtes pour un historique qui leur survit. Une requête compilée avec `OPTION (RECOMPILE)` n'est pas mise en cache : elle n'apparaît donc pas dans la vue. Dans Azure SQL Database, `VIEW DATABASE STATE` accordé à un utilisateur de base de données est l'autorisation qu'exigent les DMV de niveau base comme `sys.dm_db_resource_stats`."
references:
  - title: Monitor performance using dynamic management views
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/monitoring-with-dmvs
  - title: Tune nonclustered indexes with missing index suggestions
    url: https://learn.microsoft.com/en-us/sql/relational-databases/indexes/tune-nonclustered-missing-index-suggestions
