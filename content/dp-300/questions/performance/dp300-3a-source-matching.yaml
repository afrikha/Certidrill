id: dp300-3a-source-matching
objective: "3.1.2"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam has 30 Azure SQL databases on three logical servers. One of them is named **Orders**.

    You need to choose a source of performance data for each requirement.

    Which source should you use for each requirement? To answer, drag the appropriate sources to the correct requirements. Each source may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam dispose de 30 bases de données Azure SQL réparties sur trois serveurs logiques. L'une d'elles se nomme **Orders**.

    Vous devez choisir une source de données de performances pour chaque exigence.

    Quelle source devez-vous utiliser pour chaque exigence ? Pour répondre, faites glisser les sources appropriées vers les exigences correspondantes. Chaque source peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: dmv, text: { en: "Dynamic management views", fr: "Vues de gestion dynamique" } }
    - { id: qs, text: { en: "Query Store", fr: "Magasin des requêtes" } }
    - { id: xe, text: { en: "Extended Events", fr: "Événements étendus" } }
    - { id: diag, text: { en: "Diagnostic settings to a Log Analytics workspace", fr: "Paramètres de diagnostic vers un espace de travail Log Analytics" } }
    - { id: metrics, text: { en: "Azure Monitor platform metrics", fr: "Métriques de plateforme Azure Monitor" } }
  targets:
    - id: t1
      text: { en: "See the requests that run in Orders right now and the wait type of each one", fr: "Voir les requêtes qui s'exécutent en ce moment dans Orders et le type d'attente de chacune" } 
    - id: t2
      text: { en: "Find out on which day of the last week the execution plan of a stored procedure in Orders changed", fr: "Déterminer quel jour de la semaine dernière le plan d'exécution d'une procédure stockée d'Orders a changé" }
    - id: t3
      text: { en: "Capture each statement in Orders that runs longer than 10 seconds, with the name of the client application", fr: "Capturer chaque instruction d'Orders qui s'exécute plus de 10 secondes, avec le nom de l'application cliente" }
    - id: t4
      text: { en: "Analyze with KQL the deadlocks of all 30 databases over the last six months", fr: "Analyser en KQL les interblocages des 30 bases de données au cours des six derniers mois" }
answer:
  mapping: { t1: dmv, t2: qs, t3: xe, t4: diag }
explanation:
  correct:
    en: |
      DMVs such as `sys.dm_exec_requests` show the current state of the engine. Query Store keeps the history of plans and runtime statistics, so it shows when a plan changed. Extended Events capture individual events filtered by a predicate (duration) with actions such as `client_app_name`. The Deadlocks resource log, sent by diagnostic settings to a Log Analytics workspace, gives a long, cross-database history that you query with KQL.
    fr: |
      Les DMV comme `sys.dm_exec_requests` montrent l'état actuel du moteur. Le Magasin des requêtes conserve l'historique des plans et des statistiques d'exécution, il montre donc quand un plan a changé. Les événements étendus capturent des événements individuels filtrés par un prédicat (la durée), avec des actions comme `client_app_name`. Le journal de ressources Deadlocks, envoyé par des paramètres de diagnostic vers un espace de travail Log Analytics, fournit un historique long et multibase que vous interrogez en KQL.
  options:
    metrics: { en: "The Deadlocks platform metric is a count kept 93 days; it holds no deadlock details for six months of KQL analysis.", fr: "La métrique de plateforme Deadlocks est un nombre conservé 93 jours ; elle ne contient pas le détail des interblocages pour six mois d'analyse en KQL." }
references:
  - title: Monitoring and performance tuning in Azure SQL Database and Azure SQL Managed Instance
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/monitor-tune-overview
  - title: Configure streaming export of Azure SQL Database and SQL Managed Instance diagnostic telemetry
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/metrics-diagnostic-telemetry-logging-streaming-export-configure
