id: dp300-3c-iqp-dop-feedback
objective: "3.3.9"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    You have an Azure virtual machine that runs SQL Server 2022 and hosts a database named WarehouseDB. WarehouseDB uses compatibility level 150, Query Store is disabled, and all database-scoped configurations use their default values.

    Reporting queries that run many times a day use more parallelism than they need, which wastes CPU.

    You need the Database Engine to adjust the degree of parallelism of these repeating queries automatically. The solution must not modify the queries.

    Which three actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'une machine virtuelle Azure qui exécute SQL Server 2022 et héberge une base de données nommée WarehouseDB. WarehouseDB utilise le niveau de compatibilité 150, le Magasin des requêtes est désactivé, et toutes les configurations à l'échelle de la base utilisent leurs valeurs par défaut.

    Des requêtes de rapports exécutées de nombreuses fois par jour utilisent plus de parallélisme que nécessaire, ce qui gaspille du processeur.

    Le moteur de base de données doit ajuster automatiquement le degré de parallélisme de ces requêtes répétées. La solution ne doit pas modifier les requêtes.

    Quelles sont les trois actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 3
  options:
    - { id: a, text: { en: "Set the compatibility level of WarehouseDB to 160.", fr: "Définir le niveau de compatibilité de WarehouseDB sur 160." } }
    - { id: b, text: { en: "Set the max degree of parallelism server option to 0.", fr: "Définir l'option de serveur max degree of parallelism sur 0." } }
    - { id: c, text: { en: "Enable Query Store on WarehouseDB in READ_WRITE mode.", fr: "Activer le Magasin des requêtes sur WarehouseDB en mode READ_WRITE." } }
    - { id: d, text: { en: "Set LEGACY_CARDINALITY_ESTIMATION to ON for WarehouseDB.", fr: "Définir LEGACY_CARDINALITY_ESTIMATION sur ON pour WarehouseDB." } }
    - { id: e, text: { en: "Set DOP_FEEDBACK to ON for WarehouseDB.", fr: "Définir DOP_FEEDBACK sur ON pour WarehouseDB." } }
    - { id: f, text: { en: "Set BATCH_MODE_ON_ROWSTORE to OFF for WarehouseDB.", fr: "Définir BATCH_MODE_ON_ROWSTORE sur OFF pour WarehouseDB." } }
answer: { optionIds: [ a, c, e ] }
explanation:
  correct:
    en: |
      Degree of parallelism (DOP) feedback, introduced in SQL Server 2022, lowers the DOP of repeating queries that use parallelism inefficiently. It requires compatibility level 160 and Query Store in READ_WRITE mode, and its database-scoped configuration DOP_FEEDBACK is OFF by default, so you must enable it.
    fr: |
      La rétroaction du degré de parallélisme (DOP), introduite dans SQL Server 2022, réduit le DOP des requêtes répétées qui utilisent le parallélisme de façon inefficace. Elle exige le niveau de compatibilité 160 et le Magasin des requêtes en mode READ_WRITE, et sa configuration à l'échelle de la base DOP_FEEDBACK est OFF par défaut : vous devez donc l'activer.
  options:
    b: { en: "MAXDOP 0 lets queries use all available processors, which increases parallelism instead of adjusting it.", fr: "MAXDOP 0 laisse les requêtes utiliser tous les processeurs disponibles, ce qui augmente le parallélisme au lieu de l'ajuster." }
    d: { en: "The legacy cardinality estimator changes row estimates; it doesn't adjust the degree of parallelism.", fr: "L'ancien estimateur de cardinalité change les estimations de lignes ; il n'ajuste pas le degré de parallélisme." }
    f: { en: "Disabling batch mode on rowstore changes the execution mode; it doesn't provide DOP feedback.", fr: "Désactiver le mode batch sur rowstore change le mode d'exécution ; il ne fournit pas de rétroaction du degré de parallélisme." }
references:
  - title: Intelligent query processing in SQL databases
    url: https://learn.microsoft.com/en-us/sql/relational-databases/performance/intelligent-query-processing
  - title: ALTER DATABASE SCOPED CONFIGURATION (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/statements/alter-database-scoped-configuration-transact-sql
