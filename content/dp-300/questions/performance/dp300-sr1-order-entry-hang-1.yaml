id: dp300-sr1-order-entry-hang-1
objective: "3.2.3"
type: series_yesno
series: dp300-sr1-order-entry-hang
seriesOrder: 1
difficulty: 2
status: draft
stem:
  en: |
    You query sys.dm_db_wait_stats and end the session with the most lock waits.
  fr: |
    Vous interrogez sys.dm_db_wait_stats et mettez fin à la session qui a le plus d'attentes de verrou.
body:
  solution:
    en: |
      You query `sys.dm_db_wait_stats`, filter on the `LCK_M_%` wait types, and sort by `wait_time_ms`. You run `KILL` for the session that has accumulated the most lock wait time.
    fr: |
      Vous interrogez `sys.dm_db_wait_stats`, filtrez sur les types d'attente `LCK_M_%` et triez par `wait_time_ms`. Vous exécutez `KILL` pour la session qui a accumulé le plus de temps d'attente de verrou.
answer: { value: false }
explanation:
  correct:
    en: |
      `sys.dm_db_wait_stats` returns wait statistics aggregated for the whole database by wait type. It has no session ID and no statement text, so it can't identify the head blocker or what it ran. The sessions that wait the most are blocked sessions, not the blocker.
    fr: |
      `sys.dm_db_wait_stats` renvoie des statistiques d'attente agrégées pour toute la base, par type d'attente. Elle ne contient ni ID de session ni texte d'instruction : elle ne peut pas identifier le bloqueur de tête ni ce qu'il a exécuté. Les sessions qui attendent le plus sont des sessions bloquées, pas le bloqueur.
references:
  - title: Understand and resolve blocking problems
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/understand-resolve-blocking
