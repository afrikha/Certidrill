id: dp300-3b-stats-threshold
objective: "3.3.2"
type: single
difficulty: 2
status: draft
shuffle: false
stem:
  en: |
    You have an Azure SQL database named **PayrollDB** that uses compatibility level 160 and the default statistics options. The table **dbo.TimeEntries** contains 4,000,000 rows.

    You need to estimate how many row modifications on dbo.TimeEntries are needed before the statistics on the table are marked as out of date and updated automatically by the next query that uses them.

    Approximately how many modifications are needed?
  fr: |
    Vous disposez d'une base de données Azure SQL nommée **PayrollDB** qui utilise le niveau de compatibilité 160 et les options de statistiques par défaut. La table **dbo.TimeEntries** contient 4 000 000 lignes.

    Vous devez estimer combien de modifications de lignes sur dbo.TimeEntries sont nécessaires avant que les statistiques de la table soient marquées comme obsolètes et mises à jour automatiquement par la prochaine requête qui les utilise.

    Combien de modifications environ sont nécessaires ?
body:
  options:
    - { id: a, text: { en: "2,000", fr: "2 000" } }
    - { id: b, text: { en: "63,246", fr: "63 246" } }
    - { id: c, text: { en: "400,500", fr: "400 500" } }
    - { id: d, text: { en: "800,500", fr: "800 500" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      At compatibility level 130 and later, the threshold for a table of more than 500 rows is `MIN(500 + 0.20 * n, SQRT(1000 * n))`. For 4,000,000 rows, that is the minimum of 800,500 and about 63,246, so statistics become out of date after about 63,246 modifications. This dynamic threshold keeps statistics fresher on large tables.
    fr: |
      Au niveau de compatibilité 130 et supérieur, le seuil pour une table de plus de 500 lignes est `MIN(500 + 0.20 * n, SQRT(1000 * n))`. Pour 4 000 000 lignes, c'est le minimum entre 800 500 et environ 63 246 : les statistiques deviennent obsolètes après environ 63 246 modifications. Ce seuil dynamique maintient les statistiques plus à jour sur les grandes tables.
  options:
    a: { en: "2,000 is the square root of the number of rows, not of 1,000 times the number of rows.", fr: "2 000 est la racine carrée du nombre de lignes, pas de 1 000 fois le nombre de lignes." }
    c: { en: "400,500 would correspond to 500 plus 10 percent of the rows, which isn't a threshold the engine uses.", fr: "400 500 correspondrait à 500 plus 10 % des lignes, ce qui n'est pas un seuil utilisé par le moteur." }
    d: { en: "800,500 is the legacy threshold (500 + 20 percent of the rows), used below compatibility level 130.", fr: "800 500 est l'ancien seuil (500 + 20 % des lignes), utilisé en dessous du niveau de compatibilité 130." }
references:
  - title: Statistics
    url: https://learn.microsoft.com/en-us/sql/relational-databases/statistics/statistics
