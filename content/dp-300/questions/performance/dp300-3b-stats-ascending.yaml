id: dp300-3b-stats-ascending
objective: "3.3.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have an Azure virtual machine that runs SQL Server 2022 and hosts a database named **SalesDW**. A SQL Server Agent job loads about 200,000 new rows into the table **dbo.Orders** every night. The table contains 300 million rows, and the **OrderDate** values of the new rows are always later than the existing values.

    Each morning, queries that filter on the previous day's OrderDate have estimated row counts of 1 in their actual execution plans, while about 200,000 rows are returned. `AUTO_UPDATE_STATISTICS` is on.

    You need to ensure that the morning queries get accurate estimates. The solution must minimize the resources used.

    What should you do?
  fr: |
    Vous disposez d'une machine virtuelle Azure qui exécute SQL Server 2022 et héberge une base de données nommée **SalesDW**. Un travail SQL Server Agent charge chaque nuit environ 200 000 nouvelles lignes dans la table **dbo.Orders**. La table contient 300 millions de lignes, et les valeurs **OrderDate** des nouvelles lignes sont toujours postérieures aux valeurs existantes.

    Chaque matin, les requêtes qui filtrent sur l'OrderDate de la veille ont des nombres de lignes estimés de 1 dans leurs plans d'exécution réels, alors qu'environ 200 000 lignes sont renvoyées. `AUTO_UPDATE_STATISTICS` est activé.

    Vous devez faire en sorte que les requêtes du matin obtiennent des estimations exactes. La solution doit réduire au minimum les ressources utilisées.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Add a step to the load job that reorganizes the indexes of dbo.Orders.", fr: "Ajouter au travail de chargement une étape qui réorganise les index de dbo.Orders." } }
    - { id: b, text: { en: "Turn on `AUTO_UPDATE_STATISTICS_ASYNC` for SalesDW.", fr: "Activer `AUTO_UPDATE_STATISTICS_ASYNC` pour SalesDW." } }
    - { id: c, text: { en: "Add a step to the load job that rebuilds all the indexes of dbo.Orders.", fr: "Ajouter au travail de chargement une étape qui reconstruit tous les index de dbo.Orders." } }
    - { id: d, text: { en: "Add a step to the load job that runs `UPDATE STATISTICS` on the statistics of the OrderDate column.", fr: "Ajouter au travail de chargement une étape qui exécute `UPDATE STATISTICS` sur les statistiques de la colonne OrderDate." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      With an ascending key, the newest values are beyond the last step of the histogram, and 200,000 changes on a 300-million-row table stay below the automatic update threshold. Updating the OrderDate statistics right after each load adds the new values to the histogram. Updating one statistics object costs far less than maintaining every index.
    fr: |
      Avec une clé croissante, les valeurs les plus récentes se trouvent au-delà de la dernière étape de l'histogramme, et 200 000 modifications sur une table de 300 millions de lignes restent sous le seuil de mise à jour automatique. Mettre à jour les statistiques d'OrderDate juste après chaque chargement ajoute les nouvelles valeurs à l'histogramme. Mettre à jour un seul objet de statistiques coûte bien moins que la maintenance de tous les index.
  options:
    a: { en: "Reorganizing an index doesn't update statistics, so the histogram would still miss the new dates.", fr: "Réorganiser un index ne met pas à jour les statistiques : l'histogramme ignorerait toujours les nouvelles dates." }
    b: { en: "Asynchronous updates change only when an automatic update runs; the modification threshold still isn't reached.", fr: "Les mises à jour asynchrones changent seulement le moment où une mise à jour automatique s'exécute ; le seuil de modifications n'est toujours pas atteint." }
    c: { en: "Rebuilding all the indexes of a 300-million-row table every night uses far more resources than updating one statistics object.", fr: "Reconstruire chaque nuit tous les index d'une table de 300 millions de lignes consomme bien plus de ressources que la mise à jour d'un seul objet de statistiques." }
references:
  - title: Statistics
    url: https://learn.microsoft.com/en-us/sql/relational-databases/statistics/statistics
