id: dp300-3a-xe-persist-events
objective: "3.1.6"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    You have an Azure SQL database named **DB1**. An event session named **Errors1** captures the `error_reported` event in DB1 and uses a ring_buffer target. You have a storage account that contains a blob container named **xe**, created according to Microsoft recommendations.

    You need to ensure that the captured events are kept after Errors1 is stopped and can be read with `sys.fn_xe_file_target_read_file`.

    Which two actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'une base de données Azure SQL nommée **DB1**. Une session d'événements nommée **Errors1** capture l'événement `error_reported` dans DB1 et utilise une cible ring_buffer. Vous disposez d'un compte de stockage qui contient un conteneur blob nommé **xe**, créé selon les recommandations de Microsoft.

    Vous devez vous assurer que les événements capturés sont conservés après l'arrêt d'Errors1 et peuvent être lus avec `sys.fn_xe_file_target_read_file`.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "In DB1, create a database scoped credential that grants access to the xe container.", fr: "Dans DB1, créer des informations d'identification délimitées à la base de données qui donnent accès au conteneur xe." } }
    - { id: b, text: { en: "Add an event_file target whose filename is a .xel blob URL in the xe container.", fr: "Ajouter une cible event_file dont le nom de fichier est une URL de blob .xel dans le conteneur xe." } }
    - { id: c, text: { en: "Re-create Errors1 in the master database with ON SERVER.", fr: "Recréer Errors1 dans la base de données master avec ON SERVER." } }
    - { id: d, text: { en: "Add an event_file target whose filename is D:\\xe\\Errors1.xel.", fr: "Ajouter une cible event_file dont le nom de fichier est D:\\xe\\Errors1.xel." } }
    - { id: e, text: { en: "Set MAX_MEMORY of Errors1 to 512 MB.", fr: "Définir MAX_MEMORY d'Errors1 sur 512 Mo." } }
answer: { optionIds: [ a, b ] }
explanation:
  correct:
    en: |
      ring_buffer data lives in memory and disappears when the session stops. In Azure SQL Database, event_file writes only to Azure Blob Storage, so the target needs a blob URL and DB1 needs a database scoped credential (SAS with rwdl permissions or managed identity) for the container. sys.fn_xe_file_target_read_file then reads the .xel files.
    fr: |
      Les données de ring_buffer résident en mémoire et disparaissent à l'arrêt de la session. Dans Azure SQL Database, event_file n'écrit que dans le Stockage Blob Azure : la cible a besoin d'une URL de blob et DB1 a besoin d'informations d'identification délimitées à la base de données (SAS avec les autorisations rwdl ou identité managée) pour le conteneur. sys.fn_xe_file_target_read_file lit ensuite les fichiers .xel.
  options:
    c: { en: "Azure SQL Database supports only database-scoped sessions; ON SERVER fails.", fr: "Azure SQL Database ne prend en charge que les sessions délimitées à la base de données ; ON SERVER échoue." }
    d: { en: "Azure SQL Database has no access to a local disk; event_file must point to a blob.", fr: "Azure SQL Database n'a pas accès à un disque local ; event_file doit pointer vers un blob." }
    e: { en: "Memory doesn't persist events, and the total session memory of a database is limited to 128 MB.", fr: "La mémoire ne rend pas les événements persistants, et la mémoire totale des sessions d'une base est limitée à 128 Mo." }
references:
  - title: Extended Events in Azure SQL
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/xevent-db-diff-from-svr
  - title: Targets for Extended Events
    url: https://learn.microsoft.com/en-us/sql/relational-databases/extended-events/targets-for-extended-events-in-sql-server
