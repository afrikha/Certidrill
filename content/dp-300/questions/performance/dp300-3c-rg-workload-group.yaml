id: dp300-3c-rg-workload-group
objective: "3.3.6"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    You have an Azure SQL managed instance named MI3. Resource Governor is enabled, and a resource pool named AdhocPool exists.

    You need to create a workload group for ad hoc analyst queries that meets the following requirements:

    - The memory grant of each query must not exceed 10 percent of the memory of AdhocPool.
    - Each query must use at most two processors in parallel.
    - Any request that uses more than 300 seconds of CPU time must be stopped.

    How should you complete the Transact-SQL statement? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'une instance managée Azure SQL nommée MI3. Resource Governor est activé et un pool de ressources nommé AdhocPool existe.

    Vous devez créer un groupe de charges de travail pour les requêtes ad hoc des analystes qui satisfait les exigences suivantes :

    - L'allocation de mémoire de chaque requête ne doit pas dépasser 10 % de la mémoire d'AdhocPool.
    - Chaque requête doit utiliser au plus deux processeurs en parallèle.
    - Toute demande qui utilise plus de 300 secondes de temps processeur doit être arrêtée.

    Comment devez-vous compléter l'instruction Transact-SQL ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: sql
  template: |
    USE master;
    CREATE WORKLOAD GROUP AdhocGroup
    WITH (
        [[mem]] = 10,
        [[dop]] = 2,
        [[cpu]] = 300
    )
    USING AdhocPool;
    GO
    ALTER RESOURCE GOVERNOR RECONFIGURE;
  slots:
    - id: mem
      options:
        - { id: grant, text: REQUEST_MAX_MEMORY_GRANT_PERCENT }
        - { id: maxmem, text: MAX_MEMORY_PERCENT }
        - { id: minmem, text: MIN_MEMORY_PERCENT }
        - { id: timeout, text: REQUEST_MEMORY_GRANT_TIMEOUT_SEC }
    - id: dop
      options:
        - { id: maxdop, text: MAX_DOP }
        - { id: maxreq, text: GROUP_MAX_REQUESTS }
        - { id: importance, text: IMPORTANCE }
    - id: cpu
      options:
        - { id: cputime, text: REQUEST_MAX_CPU_TIME_SEC }
        - { id: cap, text: CAP_CPU_PERCENT }
        - { id: maxcpu, text: MAX_CPU_PERCENT }
        - { id: timeout2, text: REQUEST_MEMORY_GRANT_TIMEOUT_SEC }
answer:
  values: { mem: grant, dop: maxdop, cpu: cputime }
explanation:
  correct:
    en: "`REQUEST_MAX_MEMORY_GRANT_PERCENT` caps the memory grant of a single request as a percentage of the pool's memory. `MAX_DOP` caps the degree of parallelism of the group's requests. `REQUEST_MAX_CPU_TIME_SEC` sets the maximum CPU time of a request; on Azure SQL Managed Instance a request that exceeds it is aborted with error 10961, whereas SQL Server only raises an event unless trace flag 2422 is enabled."
    fr: "`REQUEST_MAX_MEMORY_GRANT_PERCENT` plafonne l'allocation de mémoire d'une requête en pourcentage de la mémoire du pool. `MAX_DOP` plafonne le degré de parallélisme des requêtes du groupe. `REQUEST_MAX_CPU_TIME_SEC` fixe le temps processeur maximal d'une demande ; sur Azure SQL Managed Instance, une demande qui le dépasse est abandonnée avec l'erreur 10961, alors que SQL Server ne déclenche qu'un événement sauf si l'indicateur de trace 2422 est activé."
  options:
    maxmem: { en: "MAX_MEMORY_PERCENT is a resource pool option that limits the whole pool, not each request.", fr: "MAX_MEMORY_PERCENT est une option de pool de ressources qui limite le pool entier, pas chaque requête." }
    minmem: { en: "MIN_MEMORY_PERCENT is a resource pool option that reserves memory.", fr: "MIN_MEMORY_PERCENT est une option de pool de ressources qui réserve de la mémoire." }
    timeout: { en: "This option sets how long a query waits for a memory grant, not its size.", fr: "Cette option fixe la durée d'attente d'une allocation de mémoire, pas sa taille." }
    maxreq: { en: "GROUP_MAX_REQUESTS limits the number of concurrent requests in the group.", fr: "GROUP_MAX_REQUESTS limite le nombre de demandes simultanées du groupe." }
    importance: { en: "IMPORTANCE sets the relative priority of the group inside its pool.", fr: "IMPORTANCE fixe la priorité relative du groupe dans son pool." }
    cap: { en: "CAP_CPU_PERCENT is a resource pool option that caps CPU bandwidth; it doesn't stop requests.", fr: "CAP_CPU_PERCENT est une option de pool de ressources qui plafonne la bande passante processeur ; elle n'arrête pas les demandes." }
    maxcpu: { en: "MAX_CPU_PERCENT is a resource pool option that limits CPU bandwidth under contention.", fr: "MAX_CPU_PERCENT est une option de pool de ressources qui limite la bande passante processeur en cas de contention." }
    timeout2: { en: "This option limits the wait for a memory grant, not CPU time.", fr: "Cette option limite l'attente d'une allocation de mémoire, pas le temps processeur." }
references:
  - title: CREATE WORKLOAD GROUP (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/statements/create-workload-group-transact-sql
  - title: CREATE RESOURCE POOL (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/statements/create-resource-pool-transact-sql
