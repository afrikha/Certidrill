id: dp300-3c-scale-duration
objective: "3.3.8"
type: yesno_statements
difficulty: 3
status: draft
stem:
  en: |
    You have the following Azure SQL single databases. Both use the provisioned compute tier.

    | Name | Service tier | vCores | Used space |
    | --- | --- | --- | --- |
    | DB1 | General Purpose | 4 | 800 GB |
    | DB2 | Hyperscale | 4 | 3 TB |

    You plan to change the service objective of each database.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez des bases de données uniques Azure SQL suivantes. Les deux utilisent le niveau de calcul provisionné.

    | Nom | Niveau de service | vCores | Espace utilisé |
    | --- | --- | --- | --- |
    | DB1 | General Purpose | 4 | 800 Go |
    | DB2 | Hyperscale | 4 | 3 To |

    Vous prévoyez de modifier l'objectif de service de chaque base de données.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          Scaling DB1 to General Purpose with 8 vCores takes a time proportional to its 800 GB of used space.
        fr: |
          La mise à l'échelle de DB1 vers General Purpose avec 8 vCores prend un temps proportionnel à ses 800 Go d'espace utilisé.
    - id: s2
      text:
        en: |
          Scaling DB1 to Business Critical with 8 vCores takes a time proportional to its used space.
        fr: |
          La mise à l'échelle de DB1 vers Business Critical avec 8 vCores prend un temps proportionnel à son espace utilisé.
    - id: s3
      text:
        en: |
          Scaling DB2 to Hyperscale with 16 vCores takes a time that doesn't depend on its 3 TB of data.
        fr: |
          La mise à l'échelle de DB2 vers Hyperscale avec 16 vCores prend un temps qui ne dépend pas de ses 3 To de données.
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: |
      A General Purpose single database that changes its compute size within General Purpose keeps its remote storage, so the change takes a constant time, typically under five minutes. Moving to Business Critical requires copying the data to local storage, about one minute per GB of used space. A Hyperscale database that scales within Hyperscale also takes a constant time, typically under two minutes. In every case, connections drop briefly at the switch, so applications need retry logic.
    fr: |
      Une base unique General Purpose qui change de taille de calcul au sein de General Purpose conserve son stockage distant : la modification prend un temps constant, en général moins de cinq minutes. Passer à Business Critical exige de copier les données vers un stockage local, environ une minute par Go d'espace utilisé. Une base Hyperscale mise à l'échelle au sein d'Hyperscale prend aussi un temps constant, en général moins de deux minutes. Dans tous les cas, les connexions sont brièvement coupées au basculement : les applications ont besoin d'une logique de nouvelle tentative.
references:
  - title: Scale single database resources in Azure SQL Database
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/single-database-scale
