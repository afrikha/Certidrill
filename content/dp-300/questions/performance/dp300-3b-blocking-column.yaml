id: dp300-3b-blocking-column
objective: "3.2.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You manage an Azure SQL database named **SalesDB**. Users report that several `UPDATE` statements have been waiting for several minutes.

    You query `sys.dm_exec_requests`. You need to identify, for each waiting request, the session that holds the lock the request is waiting for.

    Which column should you examine?
  fr: |
    Vous gérez une base de données Azure SQL nommée **SalesDB**. Des utilisateurs signalent que plusieurs instructions `UPDATE` attendent depuis plusieurs minutes.

    Vous interrogez `sys.dm_exec_requests`. Vous devez identifier, pour chaque requête en attente, la session qui détient le verrou attendu par cette requête.

    Quelle colonne devez-vous examiner ?
body:
  options:
    - { id: a, text: "`wait_resource`" }
    - { id: b, text: "`blocking_session_id`" }
    - { id: c, text: "`open_transaction_count`" }
    - { id: d, text: "`wait_time`" }
answer: { optionId: b }
explanation:
  correct:
    en: "`blocking_session_id` returns the ID of the session that blocks the request; 0 means the request is not blocked. By following these IDs you walk the chain up to the head blocker, the session that is blocked by nobody, and then investigate why it keeps its locks."
    fr: "`blocking_session_id` renvoie l'ID de la session qui bloque la requête ; 0 signifie que la requête n'est pas bloquée. En suivant ces ID, vous remontez la chaîne jusqu'au bloqueur de tête (head blocker), la session bloquée par personne, puis vous cherchez pourquoi elle conserve ses verrous."
  options:
    a: { en: "`wait_resource` identifies the locked resource (table, page, key, row), not the session that holds the lock.", fr: "`wait_resource` identifie la ressource verrouillée (table, page, clé, ligne), pas la session qui détient le verrou." }
    c: { en: "`open_transaction_count` tells whether the session itself is inside an open transaction; it doesn't identify another session.", fr: "`open_transaction_count` indique si la session elle-même se trouve dans une transaction ouverte ; il n'identifie pas une autre session." }
    d: { en: "`wait_time` shows how long the request has been waiting, not who it is waiting for.", fr: "`wait_time` indique depuis combien de temps la requête attend, pas qui elle attend." }
references:
  - title: Understand and resolve blocking problems
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/understand-resolve-blocking
