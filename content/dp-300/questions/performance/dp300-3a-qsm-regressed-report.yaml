id: dp300-3a-qsm-regressed-report
objective: "3.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have an Azure SQL managed instance named **MI1** that hosts a database named **Sales**. Query Store uses the default settings.

    After a statistics update last night, a report query that used to run in 2 seconds now runs in 40 seconds. You suspect that its execution plan changed.

    You need to find the query and compare its old and new plans by using a built-in report of SQL Server Management Studio (SSMS).

    Which Query Store report should you open?
  fr: |
    Vous disposez d'une instance managée Azure SQL nommée **MI1** qui héberge une base de données nommée **Sales**. Le Magasin des requêtes utilise les paramètres par défaut.

    Après une mise à jour des statistiques la nuit dernière, une requête de rapport qui s'exécutait en 2 secondes s'exécute désormais en 40 secondes. Vous soupçonnez que son plan d'exécution a changé.

    Vous devez trouver la requête et comparer son ancien et son nouveau plan à l'aide d'un rapport intégré de SQL Server Management Studio (SSMS).

    Quel rapport du Magasin des requêtes devez-vous ouvrir ?
body:
  options:
    - { id: a, text: Overall Resource Consumption }
    - { id: b, text: Queries With Forced Plans }
    - { id: c, text: Query Wait Statistics }
    - { id: d, text: Regressed Queries }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Regressed Queries lists the queries whose duration (the default metric), CPU or reads got worse in the recent period compared with the history. You can view the plans of a query, compare them, and force or unforce a plan from the same pane.
    fr: |
      Regressed Queries liste les requêtes dont la durée (la métrique par défaut), le processeur ou les lectures se sont dégradés sur la période récente par rapport à l'historique. Vous pouvez afficher les plans d'une requête, les comparer, et forcer ou annuler le forçage d'un plan dans le même volet.
  options:
    a: { en: "Overall Resource Consumption shows the total consumption of the database over time, not individual regressed queries.", fr: "Overall Resource Consumption affiche la consommation totale de la base dans le temps, pas les requêtes individuelles qui ont régressé." }
    b: { en: "Queries With Forced Plans lists only the plans already forced.", fr: "Queries With Forced Plans ne liste que les plans déjà forcés." }
    c: { en: "Query Wait Statistics shows wait categories and the queries that wait the most, not plan changes.", fr: "Query Wait Statistics affiche les catégories d'attente et les requêtes qui attendent le plus, pas les changements de plan." }
references:
  - title: Monitor performance by using the Query Store
    url: https://learn.microsoft.com/en-us/sql/relational-databases/performance/monitoring-performance-by-using-the-query-store
