id: dp300-3c-dsc-secondary-maxdop
objective: "3.3.7"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    You have an Azure SQL database named OrdersDB in the Business Critical service tier. Read scale-out is enabled, and the reporting application connects with `ApplicationIntent=ReadOnly`.

    You need to meet the following requirements:

    - Queries on the primary replica must use a maximum degree of parallelism of 4.
    - Queries on the readable secondary replica must use a maximum degree of parallelism of 8.

    Which two statements should you run in OrdersDB? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'une base de données Azure SQL nommée OrdersDB dans le niveau de service Business Critical. Le scale-out en lecture est activé, et l'application de rapports se connecte avec `ApplicationIntent=ReadOnly`.

    Vous devez satisfaire les exigences suivantes :

    - Les requêtes sur le réplica principal doivent utiliser un degré maximal de parallélisme de 4.
    - Les requêtes sur le réplica secondaire lisible doivent utiliser un degré maximal de parallélisme de 8.

    Quelles sont les deux instructions à exécuter dans OrdersDB ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: "ALTER DATABASE SCOPED CONFIGURATION SET MAXDOP = 8;" }
    - { id: b, text: "ALTER DATABASE SCOPED CONFIGURATION SET MAXDOP = 4;" }
    - { id: c, text: "ALTER DATABASE SCOPED CONFIGURATION FOR SECONDARY SET MAXDOP = PRIMARY;" }
    - { id: d, text: "ALTER DATABASE SCOPED CONFIGURATION FOR SECONDARY SET MAXDOP = 8;" }
    - { id: e, text: "EXEC sp_configure 'max degree of parallelism', 8;" }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |
      Without `FOR SECONDARY`, the statement sets the value for the primary replica. `FOR SECONDARY` sets a value that every readable secondary uses, so the reporting queries routed to the read scale-out replica run with MAXDOP 8 while the primary keeps 4.
    fr: |
      Sans `FOR SECONDARY`, l'instruction définit la valeur du réplica principal. `FOR SECONDARY` définit une valeur utilisée par tous les secondaires lisibles : les requêtes de rapports dirigées vers le réplica de scale-out en lecture s'exécutent avec MAXDOP 8, tandis que le principal garde 4.
  options:
    a: { en: "This statement sets 8 on the primary replica, which violates the first requirement.", fr: "Cette instruction définit 8 sur le réplica principal, ce qui enfreint la première exigence." }
    c: { en: "PRIMARY makes the secondaries inherit the primary's value, which would be 4.", fr: "PRIMARY fait hériter les secondaires de la valeur du principal, qui serait 4." }
    e: { en: "Azure SQL Database has no instance-level configuration; sp_configure options can't be changed there.", fr: "Azure SQL Database n'a pas de configuration au niveau de l'instance ; les options sp_configure n'y sont pas modifiables." }
references:
  - title: ALTER DATABASE SCOPED CONFIGURATION (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/statements/alter-database-scoped-configuration-transact-sql
