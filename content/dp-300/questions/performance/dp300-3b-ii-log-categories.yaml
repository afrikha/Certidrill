id: dp300-3b-ii-log-categories
objective: "3.2.8"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    You stream the Intelligent Insights log of several Azure SQL databases to a Log Analytics workspace. You review the detected issues and prepare guidance for the operations team.

    How should you complete the guidance? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous diffusez le journal Intelligent Insights de plusieurs bases de données Azure SQL vers un espace de travail Log Analytics. Vous examinez les problèmes détectés et préparez des consignes pour l'équipe d'exploitation.

    Comment devez-vous compléter les consignes ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      For an issue in the Plan Regression category, compare the good and bad plan IDs reported in the log, and then force the better plan by running [[force]].

      An issue in the Database-Scoped Configuration Value Change category points to a recent change of a setting such as [[setting]].

      Issues in the Elastic pool DTU Shortage category can be reported only for [[offering]].
    fr: |
      Pour un problème de la catégorie Plan Regression, comparez les ID des bons et des mauvais plans indiqués dans le journal, puis forcez le meilleur plan en exécutant [[force]].

      Un problème de la catégorie Database-Scoped Configuration Value Change signale la modification récente d'un paramètre comme [[setting]].

      Les problèmes de la catégorie Elastic pool DTU Shortage ne peuvent être signalés que pour [[offering]].
  slots:
    - id: force
      options:
        - { id: force, text: sp_query_store_force_plan }
        - { id: recompile, text: sp_recompile }
        - { id: updatestats, text: sp_updatestats }
    - id: setting
      options:
        - { id: maxdop, text: MAXDOP }
        - { id: autostats, text: AUTO_UPDATE_STATISTICS }
        - { id: rcsi, text: READ_COMMITTED_SNAPSHOT }
    - id: offering
      options:
        - { id: sqldb, text: { en: "Azure SQL Database", fr: "Azure SQL Database" } }
        - { id: mi, text: { en: "Azure SQL Managed Instance", fr: "Azure SQL Managed Instance" } }
        - { id: vm, text: { en: "SQL Server on Azure Virtual Machines", fr: "SQL Server sur machines virtuelles Azure" } }
answer:
  values: { force: force, setting: maxdop, offering: sqldb }
explanation:
  correct:
    en: |
      The Plan Regression detection reports the query hash with the good and bad plan IDs; after you determine which plan performs better, you force it with Query Store (`sp_query_store_force_plan`). The Database-Scoped Configuration Value Change pattern covers settings such as MAXDOP, LEGACY_CARDINALITY_ESTIMATION and PARAMETER_SNIFFING. Elastic pools with eDTUs exist only in Azure SQL Database, so that pattern doesn't apply to managed instances.
    fr: |
      La détection Plan Regression indique le hachage de la requête avec les ID des bons et des mauvais plans ; après avoir déterminé quel plan est le plus performant, vous le forcez avec le Magasin des requêtes (`sp_query_store_force_plan`). Le modèle Database-Scoped Configuration Value Change couvre des paramètres comme MAXDOP, LEGACY_CARDINALITY_ESTIMATION et PARAMETER_SNIFFING. Les pools élastiques en eDTU n'existent que dans Azure SQL Database : ce modèle ne s'applique donc pas aux instances managées.
  options:
    recompile: { en: "`sp_recompile` only marks an object for recompilation; the optimizer could choose the bad plan again.", fr: "`sp_recompile` marque seulement un objet pour recompilation ; l'optimiseur pourrait choisir de nouveau le mauvais plan." }
    updatestats: { en: "Updating statistics can change plans but doesn't pin the plan identified as good.", fr: "Mettre à jour les statistiques peut changer les plans mais n'impose pas le plan identifié comme bon." }
    autostats: { en: "AUTO_UPDATE_STATISTICS is a database option set with ALTER DATABASE, not a database scoped configuration.", fr: "AUTO_UPDATE_STATISTICS est une option de base de données définie avec ALTER DATABASE, pas une configuration étendue à la base de données." }
    rcsi: { en: "READ_COMMITTED_SNAPSHOT is a database option set with ALTER DATABASE, not a database scoped configuration.", fr: "READ_COMMITTED_SNAPSHOT est une option de base de données définie avec ALTER DATABASE, pas une configuration étendue à la base de données." }
    mi: { en: "Managed instances use the vCore model and have no elastic pool eDTUs, so this pattern isn't reported for them.", fr: "Les instances managées utilisent le modèle vCore et n'ont pas d'eDTU de pool élastique : ce modèle n'est pas signalé pour elles." }
    vm: { en: "Intelligent Insights doesn't support SQL Server on Azure Virtual Machines.", fr: "Intelligent Insights ne prend pas en charge SQL Server sur machines virtuelles Azure." }
references:
  - title: Troubleshoot performance issues with Intelligent Insights
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/intelligent-insights-troubleshoot-performance
  - title: Use the Intelligent Insights performance diagnostics log of Azure SQL Database and Azure SQL Managed Instance performance issues
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/intelligent-insights-use-diagnostics-log
