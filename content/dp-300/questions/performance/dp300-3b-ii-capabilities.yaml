id: dp300-3b-ii-capabilities
objective: "3.2.8"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    You enable Intelligent Insights for an Azure SQL database named **PortalDB** by streaming the SQLInsights log to a Log Analytics workspace.

    Which two actions does Intelligent Insights perform for PortalDB?

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous activez Intelligent Insights pour une base de données Azure SQL nommée **PortalDB** en diffusant le journal SQLInsights vers un espace de travail Log Analytics.

    Quelles sont les deux actions effectuées par Intelligent Insights pour PortalDB ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "It compares the workload of the last hour with a seven-day baseline to detect performance degradation.", fr: "Il compare la charge de travail de la dernière heure avec une base de référence de sept jours pour détecter les dégradations de performances." } }
    - { id: b, text: { en: "It forces the last known good plan when it detects a plan regression.", fr: "Il force le dernier plan correct connu quand il détecte une régression de plan." } }
    - { id: c, text: { en: "It writes a root cause analysis of each detected issue to the diagnostics log.", fr: "Il écrit une analyse de la cause racine de chaque problème détecté dans le journal de diagnostic." } }
    - { id: d, text: { en: "It creates the indexes that it identifies as missing.", fr: "Il crée les index qu'il identifie comme manquants." } }
    - { id: e, text: { en: "It scales PortalDB up when the database reaches its resource limits.", fr: "Il augmente la taille de PortalDB quand la base atteint ses limites de ressources." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |
      Intelligent Insights compares the database workload of the last hour with the past seven-day baseline, measuring query duration, timeouts, excessive waits and errors. For each detected issue, it writes a root cause analysis and, when possible, improvement recommendations to the SQLInsights log. It reports problems but doesn't change the database.
    fr: |
      Intelligent Insights compare la charge de travail de la dernière heure avec la base de référence des sept jours précédents, en mesurant la durée des requêtes, les délais d'attente dépassés, les attentes excessives et les erreurs. Pour chaque problème détecté, il écrit une analyse de la cause racine et, si possible, des recommandations d'amélioration dans le journal SQLInsights. Il signale les problèmes mais ne modifie pas la base.
  options:
    b: { en: "Forcing the last good plan is done by automatic tuning (FORCE_LAST_GOOD_PLAN); Intelligent Insights only reports the good and bad plan IDs.", fr: "Le forçage du dernier plan correct relève du réglage automatique (FORCE_LAST_GOOD_PLAN) ; Intelligent Insights indique seulement les ID des bons et des mauvais plans." }
    d: { en: "Intelligent Insights reports the queries that would benefit from an index; creating indexes automatically is an automatic tuning option.", fr: "Intelligent Insights signale les requêtes qui bénéficieraient d'un index ; la création automatique d'index est une option du réglage automatique." }
    e: { en: "Intelligent Insights may recommend a higher pricing tier, but it never changes the service objective.", fr: "Intelligent Insights peut recommander un niveau tarifaire supérieur, mais il ne modifie jamais l'objectif de service." }
references:
  - title: Intelligent Insights to monitor and troubleshoot database performance (preview)
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/intelligent-insights-overview
  - title: Troubleshoot performance issues with Intelligent Insights
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/intelligent-insights-troubleshoot-performance
