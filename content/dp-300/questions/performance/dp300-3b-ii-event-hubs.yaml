id: dp300-3b-ii-event-hubs
objective: "3.2.8"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam has an Azure SQL managed instance named **MI1** in the Canada Central region. Fabrikam's operations team uses a third-party monitoring platform that ingests events from streaming sources.

    You need the performance issues that Intelligent Insights detects for the databases of MI1 to be sent to the third-party platform in near real time. The solution must minimize development effort.

    Which destination should you select in the diagnostic setting for the SQLInsights log?
  fr: |
    Fabrikam dispose d'une instance managée Azure SQL nommée **MI1** dans la région Canada Central. L'équipe d'exploitation de Fabrikam utilise une plateforme de supervision tierce qui ingère des événements provenant de sources de diffusion en continu.

    Vous devez faire en sorte que les problèmes de performances détectés par Intelligent Insights pour les bases de données de MI1 soient envoyés à la plateforme tierce en temps quasi réel. La solution doit réduire au minimum l'effort de développement.

    Quelle destination devez-vous sélectionner dans le paramètre de diagnostic du journal SQLInsights ?
body:
  options:
    - { id: a, text: { en: "A Log Analytics workspace", fr: "Un espace de travail Log Analytics" } }
    - { id: b, text: { en: "An Azure Storage account", fr: "Un compte Stockage Azure" } }
    - { id: c, text: { en: "An Azure Event Hubs namespace", fr: "Un espace de noms Azure Event Hubs" } }
    - { id: d, text: { en: "An Azure Monitor action group", fr: "Un groupe d'actions Azure Monitor" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Streaming the SQLInsights log to Azure Event Hubs is the documented option for custom monitoring and alerting solutions and third-party tools, which read the events from the event hub as they arrive. Intelligent Insights supports Azure SQL Managed Instance databases, and Canada Central isn't one of the regions where the preview is unavailable.
    fr: |
      Diffuser le journal SQLInsights vers Azure Event Hubs est l'option documentée pour les solutions de supervision et d'alerte personnalisées et les outils tiers, qui lisent les événements dans le hub d'événements au fur et à mesure de leur arrivée. Intelligent Insights prend en charge les bases de données Azure SQL Managed Instance, et Canada Central ne fait pas partie des régions où la préversion est indisponible.
  options:
    a: { en: "Log Analytics is meant for KQL queries, workbooks and alerts in Azure Monitor; the third-party platform would need custom code to pull the data.", fr: "Log Analytics est destiné aux requêtes KQL, aux classeurs et aux alertes d'Azure Monitor ; la plateforme tierce aurait besoin de code personnalisé pour récupérer les données." }
    b: { en: "A storage account is for archiving and custom reporting, not for streaming events in near real time.", fr: "Un compte de stockage sert à l'archivage et aux rapports personnalisés, pas à la diffusion d'événements en temps quasi réel." }
    d: { en: "An action group defines notifications for alerts; it isn't a diagnostic setting destination.", fr: "Un groupe d'actions définit les notifications des alertes ; ce n'est pas une destination de paramètre de diagnostic." }
references:
  - title: Intelligent Insights to monitor and troubleshoot database performance (preview)
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/intelligent-insights-overview
