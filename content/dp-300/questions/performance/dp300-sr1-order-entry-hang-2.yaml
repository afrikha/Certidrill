id: dp300-sr1-order-entry-hang-2
objective: "3.2.3"
type: series_yesno
series: dp300-sr1-order-entry-hang
seriesOrder: 2
difficulty: 2
status: draft
stem:
  en: |
    You follow blocking_session_id to the head blocker, read its input buffer and end it.
  fr: |
    Vous suivez blocking_session_id jusqu'au bloqueur de tête, lisez son tampon d'entrée et y mettez fin.
body:
  solution:
    en: |
      You query `sys.dm_exec_requests` and follow the `blocking_session_id` values until you reach a session that blocks others but isn't blocked itself. You run `SELECT * FROM sys.dm_exec_input_buffer(<session_id>, 0);` for that session, and then you run `KILL <session_id>`.
    fr: |
      Vous interrogez `sys.dm_exec_requests` et suivez les valeurs `blocking_session_id` jusqu'à une session qui bloque les autres sans être elle-même bloquée. Vous exécutez `SELECT * FROM sys.dm_exec_input_buffer(<session_id>, 0);` pour cette session, puis vous exécutez `KILL <session_id>`.
answer: { value: true }
explanation:
  correct:
    en: |
      In `sys.dm_exec_requests`, `blocking_session_id` names the session that each blocked request waits for; the session at the top of the chain blocks others but has no blocker itself. `sys.dm_exec_input_buffer` returns the last statement a session submitted, even if the session is sleeping with an open transaction. `KILL` then ends only the head blocker, and its transaction is rolled back so the waiting requests can acquire their locks.
    fr: |
      Dans `sys.dm_exec_requests`, `blocking_session_id` indique la session qu'attend chaque requête bloquée ; la session en haut de la chaîne bloque les autres mais n'a elle-même aucun bloqueur. `sys.dm_exec_input_buffer` renvoie la dernière instruction envoyée par une session, même si celle-ci est inactive avec une transaction ouverte. `KILL` met ensuite fin uniquement au bloqueur de tête, et sa transaction est annulée pour que les requêtes en attente obtiennent leurs verrous.
references:
  - title: Understand and resolve blocking problems
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/understand-resolve-blocking
