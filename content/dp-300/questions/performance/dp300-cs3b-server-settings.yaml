id: dp300-cs3b-server-settings
objective: "3.3.5"
type: dragdrop
caseStudy: dp300-cs3b-bellows-college
difficulty: 1
status: draft
stem:
  en: |
    You need to meet the server configuration requirements on SIS-VM1 and SIS-VM2.

    Which configuration should you apply for each requirement? To answer, drag the appropriate configurations to the correct requirements. Each configuration may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez satisfaire les exigences de configuration des serveurs sur SIS-VM1 et SIS-VM2.

    Quelle configuration devez-vous appliquer pour chaque exigence ? Pour répondre, faites glisser les configurations appropriées vers les exigences correspondantes. Chaque configuration peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: ifi, text: { en: "Grant the Perform volume maintenance tasks right to the Database Engine service", fr: "Accorder le droit Perform volume maintenance tasks au service Moteur de base de données" } }
    - { id: lpim, text: { en: "Grant the Lock pages in memory right to the Database Engine service", fr: "Accorder le droit Lock pages in memory au service Moteur de base de données" } }
    - { id: maxdop8, text: { en: "Set max degree of parallelism to 8", fr: "Définir max degree of parallelism sur 8" } }
    - { id: maxdop16, text: { en: "Set max degree of parallelism to 16", fr: "Définir max degree of parallelism sur 16" } }
    - { id: adhoc, text: { en: "Enable optimize for ad hoc workloads", fr: "Activer optimize for ad hoc workloads" } }
    - { id: maxmem, text: { en: "Lower max server memory (MB)", fr: "Réduire max server memory (MB)" } }
  targets:
    - { id: growth, text: { en: "Requirement 1: data file growth", fr: "Exigence 1 : croissance des fichiers de données" } }
    - { id: parallel, text: { en: "Requirement 2: max degree of parallelism", fr: "Exigence 2 : degré maximal de parallélisme" } }
    - { id: paging, text: { en: "Requirement 3: buffer pool paging", fr: "Exigence 3 : pagination du pool de mémoires tampons" } }
answer:
  mapping: { growth: ifi, parallel: maxdop8, paging: lpim }
explanation:
  correct:
    en: |
      The Perform volume maintenance tasks right (SE_MANAGE_VOLUME_NAME) enables instant file initialization, so data file growth no longer zeroes the new space. For a server with a single NUMA node and more than eight logical processors, Microsoft recommends a MAXDOP of 8. The Lock pages in memory right lets SQL Server lock the buffer pool pages in physical memory, so that Windows cannot page them out to disk.
    fr: |
      Le droit Perform volume maintenance tasks (SE_MANAGE_VOLUME_NAME) active l'initialisation instantanée des fichiers : la croissance des fichiers de données ne remplit plus le nouvel espace de zéros. Pour un serveur à un seul nœud NUMA et plus de huit processeurs logiques, Microsoft recommande un MAXDOP de 8. Le droit Lock pages in memory permet à SQL Server de verrouiller les pages du pool de mémoires tampons en mémoire physique : Windows ne peut plus les paginer sur le disque.
  options:
    adhoc: { en: "Optimize for ad hoc workloads reduces the plan cache used by single-use plans; it does not prevent Windows from paging out memory.", fr: "Optimize for ad hoc workloads réduit le cache des plans utilisé par les plans à usage unique ; il n'empêche pas Windows de paginer la mémoire." }
    maxdop16: { en: "Above eight logical processors on a single NUMA node, the recommendation is to keep MAXDOP at 8, not at the number of processors.", fr: "Au-delà de huit processeurs logiques sur un seul nœud NUMA, la recommandation est de maintenir MAXDOP à 8, pas au nombre de processeurs." }
    maxmem: { en: "Lowering max server memory leaves more memory to Windows and can reduce memory pressure, but it does not prevent Windows from paging out the buffer pool.", fr: "Réduire max server memory laisse plus de mémoire à Windows et peut réduire la pression sur la mémoire, mais n'empêche pas Windows de paginer le pool de mémoires tampons." }
references:
  - title: Database instant file initialization
    url: https://learn.microsoft.com/en-us/sql/relational-databases/databases/database-instant-file-initialization
  - title: "Server configuration: max degree of parallelism"
    url: https://learn.microsoft.com/en-us/sql/database-engine/configure-windows/configure-the-max-degree-of-parallelism-server-configuration-option
