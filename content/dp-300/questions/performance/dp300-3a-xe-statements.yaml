id: dp300-3a-xe-statements
objective: "3.1.6"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    Woodgrove uses Extended Events on an Azure SQL logical server named **sql-woodgrove** that hosts 12 databases, and on an Azure SQL managed instance named **MI1**.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove utilise les événements étendus sur un serveur logique Azure SQL nommé **sql-woodgrove** qui héberge 12 bases de données, et sur une instance managée Azure SQL nommée **MI1**.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: A single event session created in one database of sql-woodgrove can capture the events of all 12 databases.
        fr: Une seule session d'événements créée dans une base de sql-woodgrove peut capturer les événements des 12 bases de données.
    - id: s2
      text:
        en: On MI1, Microsoft recommends server-scoped event sessions for most scenarios.
        fr: Sur MI1, Microsoft recommande des sessions d'événements délimitées au serveur pour la plupart des scénarios.
    - id: s3
      text:
        en: An event session created with STARTUP_STATE = ON starts again automatically after a failover.
        fr: Une session d'événements créée avec STARTUP_STATE = ON redémarre automatiquement après un basculement.
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: |
      In Azure SQL Database, sessions are database-scoped: a session collects only the events of the database where it is created. SQL Managed Instance supports both scopes, and server-scoped sessions are recommended for most scenarios. STARTUP_STATE = ON restarts a session each time the Database Engine restarts, for example after a failover or a maintenance event.
    fr: |
      Dans Azure SQL Database, les sessions sont délimitées à la base de données : une session ne collecte que les événements de la base dans laquelle elle est créée. SQL Managed Instance prend en charge les deux étendues, et les sessions délimitées au serveur sont recommandées pour la plupart des scénarios. STARTUP_STATE = ON redémarre une session à chaque redémarrage du moteur de base de données, par exemple après un basculement ou un événement de maintenance.
references:
  - title: Extended Events in Azure SQL
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/xevent-db-diff-from-svr
