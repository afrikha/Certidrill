id: dp300-3a-config-dynamic-threshold
objective: "3.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have an Azure SQL database named **DB1**. The CPU percentage of DB1 follows a weekly pattern: it reaches 85 % every Monday morning during batch processing and stays below 40 % the rest of the week.

    You need an alert when the CPU percentage of DB1 deviates from its usual pattern. Monday batch peaks must not trigger the alert. The solution must minimize administrative effort.

    What should you create?
  fr: |
    Vous disposez d'une base de données Azure SQL nommée **DB1**. Le pourcentage de processeur de DB1 suit un modèle hebdomadaire : il atteint 85 % chaque lundi matin pendant le traitement par lots et reste inférieur à 40 % le reste de la semaine.

    Vous avez besoin d'une alerte lorsque le pourcentage de processeur de DB1 s'écarte de son modèle habituel. Les pics du traitement par lots du lundi ne doivent pas déclencher l'alerte. La solution doit réduire au minimum l'effort d'administration.

    Que devez-vous créer ?
body:
  options:
    - { id: a, text: { en: "A metric alert rule on CPU percentage with a static threshold of 90", fr: "Une règle d'alerte de métrique sur CPU percentage avec un seuil statique de 90" } }
    - { id: b, text: { en: "A metric alert rule on CPU percentage with dynamic thresholds", fr: "Une règle d'alerte de métrique sur CPU percentage avec des seuils dynamiques" } }
    - { id: c, text: { en: "An activity log alert rule on the Administrative category of DB1", fr: "Une règle d'alerte du journal d'activité sur la catégorie Administrative de DB1" } }
    - { id: d, text: { en: "A log search alert rule with a KQL query that compares each hour with the same hour of the previous week", fr: "Une règle d'alerte de recherche dans les journaux avec une requête KQL qui compare chaque heure à la même heure de la semaine précédente" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Dynamic thresholds learn the history of the metric, including weekly seasonality, and alert when the value leaves the expected range. The Monday peak is part of the learned pattern, and no threshold or query has to be maintained.
    fr: |
      Les seuils dynamiques apprennent l'historique de la métrique, y compris sa saisonnalité hebdomadaire, et déclenchent une alerte quand la valeur sort de la plage attendue. Le pic du lundi fait partie du modèle appris, et aucun seuil ni aucune requête n'est à maintenir.
  options:
    a: { en: "A static threshold of 90 misses abnormal values during the rest of the week, when the usual CPU is below 40 %.", fr: "Un seuil statique de 90 ignore les valeurs anormales le reste de la semaine, quand le processeur habituel est inférieur à 40 %." }
    c: { en: "Activity log alerts react to control plane operations, not to CPU usage.", fr: "Les alertes du journal d'activité réagissent aux opérations du plan de contrôle, pas à l'utilisation du processeur." }
    d: { en: "A custom KQL comparison needs the metrics in a workspace and a query to write and maintain, which doesn't minimize effort.", fr: "Une comparaison KQL personnalisée exige les métriques dans un espace de travail et une requête à écrire et à maintenir, ce qui ne réduit pas l'effort." }
references:
  - title: Monitor Azure SQL Database
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/monitoring-sql-database-azure-monitor
