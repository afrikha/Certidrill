id: dp300-3b-plan-actual-spill
objective: "3.2.7"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have an Azure SQL database named **ReportDB**. A report query that you can run from SQL Server Management Studio (SSMS) takes several minutes.

    You need to determine whether the Sort operator of the query spills to `tempdb` and compare the estimated and actual number of rows of each operator.

    What should you do?
  fr: |
    Vous disposez d'une base de données Azure SQL nommée **ReportDB**. Une requête de rapport que vous pouvez exécuter depuis SQL Server Management Studio (SSMS) dure plusieurs minutes.

    Vous devez déterminer si l'opérateur Sort de la requête déborde dans `tempdb` et comparer le nombre de lignes estimé et réel de chaque opérateur.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Select **Display Estimated Execution Plan** for the query in SSMS.", fr: "Sélectionner **Display Estimated Execution Plan** pour la requête dans SSMS." } }
    - { id: b, text: { en: "Select **Include Actual Execution Plan** in SSMS, and then execute the query.", fr: "Sélectionner **Include Actual Execution Plan** dans SSMS, puis exécuter la requête." } }
    - { id: c, text: { en: "Query `sys.dm_exec_query_plan` by using the plan handle of the query.", fr: "Interroger `sys.dm_exec_query_plan` avec le descripteur de plan (plan handle) de la requête." } }
    - { id: d, text: { en: "Run `SET SHOWPLAN_XML ON`, and then submit the query.", fr: "Exécuter `SET SHOWPLAN_XML ON`, puis soumettre la requête." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      The actual execution plan is produced after the query runs and contains runtime information such as the actual number of rows per operator, resource usage and runtime warnings, including spills to `tempdb`. In SSMS, you turn on Include Actual Execution Plan and execute the query; the plan appears on the Execution Plan tab.
    fr: |
      Le plan d'exécution réel est produit après l'exécution de la requête et contient des informations d'exécution comme le nombre réel de lignes par opérateur, l'utilisation des ressources et les avertissements d'exécution, y compris les débordements dans `tempdb`. Dans SSMS, vous activez Include Actual Execution Plan et exécutez la requête ; le plan apparaît dans l'onglet Execution Plan.
  options:
    a: { en: "The estimated plan is compiled without running the query, so it contains no actual row counts and no spill warnings.", fr: "Le plan estimé est compilé sans exécuter la requête : il ne contient ni nombre réel de lignes, ni avertissement de débordement." }
    c: { en: "`sys.dm_exec_query_plan` returns the cached compiled plan, which has estimates only.", fr: "`sys.dm_exec_query_plan` renvoie le plan compilé en cache, qui ne contient que des estimations." }
    d: { en: "With `SHOWPLAN_XML ON`, the query isn't executed; only the estimated plan is returned.", fr: "Avec `SHOWPLAN_XML ON`, la requête n'est pas exécutée ; seul le plan estimé est renvoyé." }
references:
  - title: Display an actual execution plan
    url: https://learn.microsoft.com/en-us/sql/relational-databases/performance/display-an-actual-execution-plan
