id: dp300-3c-cost-threshold
objective: "3.3.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have an Azure virtual machine that runs SQL Server 2022. The instance uses the default server configuration options.

    Many inexpensive OLTP queries get parallel plans, which increases CPU usage. The nightly reporting queries are expensive and must keep running in parallel.

    You need to prevent the inexpensive queries from using parallel plans.

    Which server configuration option should you change?
  fr: |
    Vous disposez d'une machine virtuelle Azure qui exécute SQL Server 2022. L'instance utilise les options de configuration de serveur par défaut.

    De nombreuses requêtes OLTP peu coûteuses obtiennent des plans parallèles, ce qui augmente l'utilisation du processeur. Les requêtes de rapports nocturnes sont coûteuses et doivent continuer à s'exécuter en parallèle.

    Vous devez empêcher les requêtes peu coûteuses d'utiliser des plans parallèles.

    Quelle option de configuration de serveur devez-vous modifier ?
body:
  options:
    - { id: a, text: "max degree of parallelism" }
    - { id: b, text: "optimize for ad hoc workloads" }
    - { id: c, text: "max server memory (MB)" }
    - { id: d, text: "cost threshold for parallelism" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      The optimizer considers a parallel plan only for queries whose estimated cost exceeds `cost threshold for parallelism`, which is 5 by default. Raising the value keeps cheap OLTP queries serial while expensive reporting queries can still go parallel.
    fr: |
      L'optimiseur n'envisage un plan parallèle que pour les requêtes dont le coût estimé dépasse `cost threshold for parallelism`, qui vaut 5 par défaut. Augmenter cette valeur garde les requêtes OLTP peu coûteuses en série, tandis que les requêtes de rapports coûteuses peuvent toujours s'exécuter en parallèle.
  options:
    a: { en: "Setting MAXDOP to 1 would also remove parallelism from the reporting queries; MAXDOP limits the degree, not which queries go parallel.", fr: "Fixer MAXDOP à 1 supprimerait aussi le parallélisme des requêtes de rapports ; MAXDOP limite le degré, pas les requêtes qui passent en parallèle." }
    b: { en: "This option reduces plan cache memory for single-use plans; it doesn't affect parallelism.", fr: "Cette option réduit la mémoire du cache des plans pour les plans à usage unique ; elle n'a aucun effet sur le parallélisme." }
    c: { en: "This option limits the memory of the instance; it doesn't decide which queries use parallel plans.", fr: "Cette option limite la mémoire de l'instance ; elle ne détermine pas quelles requêtes utilisent des plans parallèles." }
references:
  - title: Server configuration options
    url: https://learn.microsoft.com/en-us/sql/database-engine/configure-windows/server-configuration-options-sql-server
