id: dp300-3c-dsc-legacy-ce
objective: "3.3.7"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have an Azure SQL database named VendorDB that uses compatibility level 160. After the migration, several critical queries regressed because of the cardinality estimator of the current model. The application vendor supports only the legacy cardinality estimator.

    You need VendorDB to use the legacy cardinality estimator. The solution must keep the other query processing features of compatibility level 160.

    Which statement should you run in VendorDB?
  fr: |
    Vous disposez d'une base de données Azure SQL nommée VendorDB qui utilise le niveau de compatibilité 160. Après la migration, plusieurs requêtes critiques se sont dégradées à cause de l'estimateur de cardinalité du modèle actuel. L'éditeur de l'application ne prend en charge que l'ancien estimateur de cardinalité.

    VendorDB doit utiliser l'ancien estimateur de cardinalité. La solution doit conserver les autres fonctionnalités de traitement des requêtes du niveau de compatibilité 160.

    Quelle instruction devez-vous exécuter dans VendorDB ?
body:
  options:
    - { id: a, text: "ALTER DATABASE CURRENT SET COMPATIBILITY_LEVEL = 110;" }
    - { id: b, text: "ALTER DATABASE SCOPED CONFIGURATION SET QUERY_OPTIMIZER_HOTFIXES = ON;" }
    - { id: c, text: "ALTER DATABASE SCOPED CONFIGURATION SET LEGACY_CARDINALITY_ESTIMATION = ON;" }
    - { id: d, text: "ALTER DATABASE SCOPED CONFIGURATION SET PARAMETER_SNIFFING = OFF;" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      `LEGACY_CARDINALITY_ESTIMATION = ON` makes the optimizer use the SQL Server 2012 cardinality estimation model for the database, whatever its compatibility level. VendorDB stays at level 160 and keeps features such as Parameter Sensitive Plan optimization.
    fr: |
      `LEGACY_CARDINALITY_ESTIMATION = ON` fait utiliser à l'optimiseur le modèle d'estimation de cardinalité de SQL Server 2012 pour la base, quel que soit son niveau de compatibilité. VendorDB reste au niveau 160 et conserve des fonctionnalités comme l'optimisation du plan sensible aux paramètres.
  options:
    a: { en: "Level 110 also selects the legacy estimator, but it removes the query processing features of the newer levels.", fr: "Le niveau 110 sélectionne aussi l'ancien estimateur, mais il supprime les fonctionnalités de traitement des requêtes des niveaux plus récents." }
    b: { en: "This option enables optimizer hotfixes released after the compatibility level; it doesn't change the cardinality estimation model.", fr: "Cette option active les correctifs de l'optimiseur publiés après le niveau de compatibilité ; elle ne change pas le modèle d'estimation de cardinalité." }
    d: { en: "Disabling parameter sniffing makes plans use average values; the current cardinality estimator stays in use.", fr: "Désactiver la détection des paramètres fait utiliser des valeurs moyennes aux plans ; l'estimateur de cardinalité actuel reste utilisé." }
references:
  - title: ALTER DATABASE SCOPED CONFIGURATION (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/statements/alter-database-scoped-configuration-transact-sql
