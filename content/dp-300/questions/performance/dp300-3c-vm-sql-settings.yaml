id: dp300-3c-vm-sql-settings
objective: "3.3.5"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    You deploy SQL Server 2022 on a new Azure virtual machine named SQLVM4 from a custom image. SQL Server runs under a dedicated domain service account.

    You need to configure SQLVM4 by following Microsoft's best practices to meet the following requirements:

    - Data file growth and database restores must not wait for the new space to be zeroed.
    - Windows must not page out the memory used by the buffer pool.

    Which two actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous déployez SQL Server 2022 sur une nouvelle machine virtuelle Azure nommée SQLVM4 à partir d'une image personnalisée. SQL Server s'exécute sous un compte de service de domaine dédié.

    Vous devez configurer SQLVM4 en suivant les bonnes pratiques de Microsoft pour satisfaire les exigences suivantes :

    - La croissance des fichiers de données et les restaurations de bases ne doivent pas attendre la mise à zéro du nouvel espace.
    - Windows ne doit pas paginer la mémoire utilisée par le pool de mémoires tampons.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Grant the service account the Perform volume maintenance tasks user right.", fr: "Accorder au compte de service le droit utilisateur Effectuer les tâches de maintenance de volume." } }
    - { id: b, text: { en: "Set the max server memory (MB) option to the total memory of the virtual machine.", fr: "Définir l'option max server memory (MB) sur la mémoire totale de la machine virtuelle." } }
    - { id: c, text: { en: "Enable read/write host caching on the disk that stores the log files.", fr: "Activer la mise en cache de l'hôte en lecture/écriture sur le disque qui stocke les fichiers journaux." } }
    - { id: d, text: { en: "Grant the service account the Lock pages in memory user right.", fr: "Accorder au compte de service le droit utilisateur Verrouiller les pages en mémoire." } }
    - { id: e, text: { en: "Set the AUTO_SHRINK option to ON for the user databases.", fr: "Définir l'option AUTO_SHRINK sur ON pour les bases de données utilisateur." } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: |
      The Perform volume maintenance tasks right enables instant file initialization, so data files grow and are restored without zeroing the new space. The Lock pages in memory right prevents Windows from paging out the memory that SQL Server allocates for the buffer pool. The best practices checklist for SQL Server on Azure VMs recommends both.
    fr: |
      Le droit Effectuer les tâches de maintenance de volume active l'initialisation instantanée des fichiers : les fichiers de données croissent et sont restaurés sans mise à zéro du nouvel espace. Le droit Verrouiller les pages en mémoire empêche Windows de paginer la mémoire allouée par SQL Server au pool de mémoires tampons. La liste de contrôle des bonnes pratiques de SQL Server sur machines virtuelles Azure recommande les deux.
  options:
    b: { en: "Max server memory must leave enough memory for the operating system; setting it to the total memory causes memory pressure.", fr: "Max server memory doit laisser assez de mémoire au système d'exploitation ; la fixer à la mémoire totale provoque une pression sur la mémoire." }
    c: { en: "Log disks must use no host caching; read/write caching is never recommended for SQL Server data or log disks.", fr: "Les disques de journal ne doivent utiliser aucune mise en cache de l'hôte ; la mise en cache en lecture/écriture n'est jamais recommandée pour les disques de données ou de journal de SQL Server." }
    e: { en: "Microsoft recommends disabling autoshrink; it doesn't relate to file initialization or memory paging.", fr: "Microsoft recommande de désactiver la réduction automatique ; elle n'a aucun rapport avec l'initialisation des fichiers ni la pagination de la mémoire." }
references:
  - title: "Checklist: Best practices for SQL Server on Azure VMs"
    url: https://learn.microsoft.com/en-us/azure/azure-sql/virtual-machines/windows/performance-guidelines-best-practices-checklist
