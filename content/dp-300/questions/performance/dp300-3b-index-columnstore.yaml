id: dp300-3b-index-columnstore
objective: "3.2.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have an Azure SQL database named **AnalyticsDB** that contains a fact table named **dbo.SalesHistory** with 900 million rows. The table is loaded once per night and is used only by reporting queries that aggregate millions of rows by month and region.

    You need to reduce the I/O and the storage used by the table and speed up the reporting queries.

    Which type of index should you use for dbo.SalesHistory?
  fr: |
    Vous disposez d'une base de données Azure SQL nommée **AnalyticsDB** qui contient une table de faits nommée **dbo.SalesHistory** de 900 millions de lignes. La table est chargée une fois par nuit et n'est utilisée que par des requêtes de création de rapports qui agrègent des millions de lignes par mois et par région.

    Vous devez réduire les E/S et le stockage utilisés par la table, et accélérer les requêtes de création de rapports.

    Quel type d'index devez-vous utiliser pour dbo.SalesHistory ?
body:
  options:
    - { id: a, text: { en: "A filtered nonclustered index", fr: "Un index non cluster filtré" } }
    - { id: b, text: { en: "A nonclustered index that includes every column of the table", fr: "Un index non cluster qui inclut toutes les colonnes de la table" } }
    - { id: c, text: { en: "A clustered rowstore index on (Region, SaleMonth)", fr: "Un index rowstore cluster sur (Region, SaleMonth)" } }
    - { id: d, text: { en: "A clustered columnstore index", fr: "Un index columnstore cluster" } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      A clustered columnstore index is the recommended storage for large data warehouse fact tables. Columns compress well (typically about 10 times), queries read only the columns they need, and batch mode execution speeds up scans and aggregations of large numbers of rows.
    fr: |
      Un index columnstore cluster est le stockage recommandé pour les grandes tables de faits d'entrepôt de données. Les colonnes se compressent bien (en général d'un facteur 10 environ), les requêtes ne lisent que les colonnes nécessaires, et l'exécution en mode batch accélère les analyses et les agrégations d'un grand nombre de lignes.
  options:
    a: { en: "A filtered index helps queries on a small, well-defined subset of rows, not aggregations over most of the table.", fr: "Un index filtré aide les requêtes sur un petit sous-ensemble de lignes bien défini, pas les agrégations sur la majeure partie de la table." }
    b: { en: "Including every column duplicates the table in rowstore format, which increases storage and doesn't reduce the I/O of large scans.", fr: "Inclure toutes les colonnes duplique la table au format rowstore, ce qui augmente le stockage et ne réduit pas les E/S des grandes analyses." }
    c: { en: "A rowstore clustered index orders the rows, but aggregations still read entire rows with no columnar compression.", fr: "Un index rowstore cluster ordonne les lignes, mais les agrégations lisent toujours des lignes entières, sans compression en colonnes." }
references:
  - title: "Columnstore indexes: overview"
    url: https://learn.microsoft.com/en-us/sql/relational-databases/indexes/columnstore-indexes-overview
