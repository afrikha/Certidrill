id: dp300-3c-checkdb-physical-only
objective: "3.3.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have an Azure virtual machine named SQLVM1 that runs SQL Server 2022. SQLVM1 hosts a 6-TB database named SalesDB.

    A full `DBCC CHECKDB` of SalesDB takes 14 hours. The nightly maintenance window is three hours. A full check already runs every weekend.

    You need to check the page and allocation structures of SalesDB every night. The solution must minimize the duration of the check.

    Which command should you run every night?
  fr: |
    Vous disposez d'une machine virtuelle Azure nommée SQLVM1 qui exécute SQL Server 2022. SQLVM1 héberge une base de données de 6 To nommée SalesDB.

    Un `DBCC CHECKDB` complet de SalesDB dure 14 heures. La fenêtre de maintenance nocturne est de trois heures. Une vérification complète s'exécute déjà chaque week-end.

    Vous devez vérifier chaque nuit les structures des pages et des allocations de SalesDB. La solution doit réduire au minimum la durée de la vérification.

    Quelle commande devez-vous exécuter chaque nuit ?
body:
  options:
    - { id: a, text: "DBCC CHECKDB (SalesDB) WITH NO_INFOMSGS;" }
    - { id: b, text: "DBCC CHECKDB (SalesDB) WITH DATA_PURITY;" }
    - { id: c, text: "DBCC CHECKDB (SalesDB) WITH EXTENDED_LOGICAL_CHECKS;" }
    - { id: d, text: "DBCC CHECKDB (SalesDB) WITH PHYSICAL_ONLY;" }
answer: { optionId: d }
explanation:
  correct:
    en: "`PHYSICAL_ONLY` limits the check to the physical structure of pages and record headers and to allocation consistency, which greatly reduces its duration and overhead on a large database. Microsoft recommends it for frequent checks on production systems, combined with a periodic full `DBCC CHECKDB`, as the weekend run here."
    fr: "`PHYSICAL_ONLY` limite la vérification à la structure physique des pages et des en-têtes d'enregistrements et à la cohérence des allocations, ce qui réduit fortement sa durée et sa charge sur une grande base de données. Microsoft la recommande pour les vérifications fréquentes en production, combinée à un `DBCC CHECKDB` complet périodique, comme l'exécution du week-end ici."
  options:
    a: { en: "NO_INFOMSGS only hides informational messages; the check is still a full logical and physical check that lasts about 14 hours.", fr: "NO_INFOMSGS masque seulement les messages d'information ; la vérification reste une vérification logique et physique complète d'environ 14 heures." }
    b: { en: "DATA_PURITY adds checks of column values that are invalid or out of range; it makes the check longer, not shorter.", fr: "DATA_PURITY ajoute des vérifications des valeurs de colonnes non valides ou hors limites ; elle allonge la vérification au lieu de la raccourcir." }
    c: { en: "EXTENDED_LOGICAL_CHECKS adds logical checks of indexed views, XML indexes and spatial indexes, which can significantly slow the check.", fr: "EXTENDED_LOGICAL_CHECKS ajoute des vérifications logiques des vues indexées, des index XML et des index spatiaux, ce qui peut ralentir nettement la vérification." }
references:
  - title: DBCC CHECKDB (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/database-console-commands/dbcc-checkdb-transact-sql
