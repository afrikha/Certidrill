id: dp300-3a-source-statements
objective: "3.1.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    You manage an Azure SQL logical server that hosts single databases and an elastic pool named **Pool1**. You also manage an Azure SQL managed instance named **MI1**.

    You are reviewing the sources of performance metrics available for these resources.

    Which two statements are true?

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous gérez un serveur logique Azure SQL qui héberge des bases de données uniques et un pool élastique nommé **Pool1**. Vous gérez aussi une instance managée Azure SQL nommée **MI1**.

    Vous examinez les sources de métriques de performances disponibles pour ces ressources.

    Quelles sont les deux affirmations vraies ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Platform metrics of the single databases are collected without any configuration.", fr: "Les métriques de plateforme des bases de données uniques sont collectées sans aucune configuration." } }
    - { id: b, text: { en: "A diagnostic setting on Pool1 sends the Query Store runtime statistics of every pooled database.", fr: "Un paramètre de diagnostic sur Pool1 envoie les statistiques d'exécution du Magasin des requêtes de chaque base de données du pool." } }
    - { id: c, text: { en: "Query Performance Insight shows the top CPU-consuming queries of the databases on MI1.", fr: "Query Performance Insight affiche les requêtes les plus consommatrices de processeur des bases de données de MI1." } }
    - { id: d, text: { en: "The databases on MI1 can stream the QueryStoreRuntimeStatistics and Errors resource log categories.", fr: "Les bases de données de MI1 peuvent envoyer les catégories de journaux de ressources QueryStoreRuntimeStatistics et Errors." } }
    - { id: e, text: { en: "The Azure Monitor Agent must be installed on the logical server to collect its database metrics.", fr: "L'agent Azure Monitor doit être installé sur le serveur logique pour collecter les métriques de ses bases de données." } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: |
      Platform metrics are collected automatically for Azure SQL resources. Each database of a managed instance supports the QueryStoreRuntimeStatistics, QueryStoreWaitStatistics, SQLInsights and Errors log categories in a diagnostic setting.
    fr: |
      Les métriques de plateforme sont collectées automatiquement pour les ressources Azure SQL. Chaque base de données d'une instance managée prend en charge les catégories de journaux QueryStoreRuntimeStatistics, QueryStoreWaitStatistics, SQLInsights et Errors dans un paramètre de diagnostic.
  options:
    b: { en: "An elastic pool supports only the Basic metrics; each pooled database needs its own diagnostic setting for its logs.", fr: "Un pool élastique ne prend en charge que les métriques Basic ; chaque base du pool a besoin de son propre paramètre de diagnostic pour ses journaux." }
    c: { en: "Query Performance Insight is available for single and pooled databases of Azure SQL Database only, not for SQL Managed Instance.", fr: "Query Performance Insight n'est disponible que pour les bases uniques et en pool d'Azure SQL Database, pas pour SQL Managed Instance." }
    e: { en: "A logical server is a PaaS resource with no agent; its databases emit platform metrics on their own.", fr: "Un serveur logique est une ressource PaaS sans agent ; ses bases de données émettent elles-mêmes leurs métriques de plateforme." }
references:
  - title: Configure streaming export of Azure SQL Database and SQL Managed Instance diagnostic telemetry
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/metrics-diagnostic-telemetry-logging-streaming-export-configure
  - title: Monitoring and performance tuning in Azure SQL Database and Azure SQL Managed Instance
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/monitor-tune-overview
