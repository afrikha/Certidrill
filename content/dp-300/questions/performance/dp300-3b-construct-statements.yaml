id: dp300-3b-construct-statements
objective: "3.2.6"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    You review the Transact-SQL code that an application runs against an Azure SQL database named **AppDB**. The table **dbo.Customers** has a nonclustered index on the **LastName** column.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous examinez le code Transact-SQL qu'une application exécute sur une base de données Azure SQL nommée **AppDB**. La table **dbo.Customers** a un index non cluster sur la colonne **LastName**.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          Replacing a single `DELETE` statement that removes 40 million rows with a loop of `DELETE TOP (5000)` statements shortens the time each transaction holds its locks.
        fr: |
          Remplacer une instruction `DELETE` unique qui supprime 40 millions de lignes par une boucle d'instructions `DELETE TOP (5000)` réduit la durée pendant laquelle chaque transaction détient ses verrous.
    - id: s2
      text:
        en: |
          The predicate `WHERE LastName LIKE '%son'` lets the optimizer seek on the LastName index.
        fr: |
          Le prédicat `WHERE LastName LIKE '%son'` permet à l'optimiseur d'effectuer une recherche (seek) dans l'index de LastName.
    - id: s3
      text:
        en: |
          Rewriting a cursor that updates rows one at a time as a single set-based `UPDATE` statement usually reduces CPU time and duration.
        fr: |
          Réécrire un curseur qui met à jour les lignes une par une sous forme d'une seule instruction `UPDATE` ensembliste réduit en général le temps processeur et la durée.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |
      Deleting in small batches keeps each transaction short, which releases locks sooner, limits lock escalation and keeps the log from growing in one huge transaction. A leading wildcard means the beginning of the value is unknown, so the index can't be sought and is scanned. Set-based statements process all the rows in one operation and avoid the per-row overhead of cursors and loops.
    fr: |
      Supprimer par petits lots garde chaque transaction courte, ce qui libère les verrous plus tôt, limite l'escalade de verrous et évite que le journal grossisse dans une énorme transaction unique. Un caractère générique en tête signifie que le début de la valeur est inconnu : l'index ne peut pas faire l'objet d'une recherche et il est analysé. Les instructions ensemblistes traitent toutes les lignes en une seule opération et évitent le coût par ligne des curseurs et des boucles.
references:
  - title: Understand and resolve blocking problems
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/understand-resolve-blocking
