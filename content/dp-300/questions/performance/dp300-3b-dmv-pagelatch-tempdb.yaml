id: dp300-3b-dmv-pagelatch-tempdb
objective: "3.2.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have an Azure SQL database named **BookingDB**. Hundreds of concurrent sessions run a stored procedure that creates, fills and drops small temporary tables.

    During peaks, `sys.dm_exec_requests` shows many requests waiting on `PAGELATCH_EX`. You need to confirm that the waits are caused by `tempdb` contention rather than by contention on pages of user tables.

    What should you check?
  fr: |
    Vous disposez d'une base de données Azure SQL nommée **BookingDB**. Des centaines de sessions simultanées exécutent une procédure stockée qui crée, remplit et supprime de petites tables temporaires.

    Pendant les pics, `sys.dm_exec_requests` montre de nombreuses requêtes en attente sur `PAGELATCH_EX`. Vous devez confirmer que ces attentes sont dues à une contention de `tempdb` et non à une contention sur des pages de tables utilisateur.

    Que devez-vous vérifier ?
body:
  options:
    - { id: a, text: { en: "Whether the `avg_data_io_percent` column of `sys.dm_db_resource_stats` is above 80 percent", fr: "Si la colonne `avg_data_io_percent` de `sys.dm_db_resource_stats` dépasse 80 %" } }
    - { id: b, text: { en: "Whether the `blocking_session_id` column of `sys.dm_exec_requests` is different from 0", fr: "Si la colonne `blocking_session_id` de `sys.dm_exec_requests` est différente de 0" } }
    - { id: c, text: { en: "Whether the `avg_fragmentation_in_percent` column of `sys.dm_db_index_physical_stats` is above 30 percent", fr: "Si la colonne `avg_fragmentation_in_percent` de `sys.dm_db_index_physical_stats` dépasse 30 %" } }
    - { id: d, text: { en: "Whether the `wait_resource` column of `sys.dm_exec_requests` starts with `2:`", fr: "Si la colonne `wait_resource` de `sys.dm_exec_requests` commence par `2:`" } }
answer: { optionId: d }
explanation:
  correct:
    en: "`PAGELATCH_*` waits are in-memory page latch waits that can concern `tempdb` or user objects. For a page, `wait_resource` has the format `database_id:file_id:page_id`; `tempdb` always has database ID 2, so a value that starts with `2:` confirms `tempdb` contention."
    fr: "Les attentes `PAGELATCH_*` sont des attentes de verrous internes sur des pages en mémoire qui peuvent concerner `tempdb` ou des objets utilisateur. Pour une page, `wait_resource` a le format `database_id:file_id:page_id` ; `tempdb` a toujours l'ID de base de données 2 : une valeur qui commence par `2:` confirme une contention de `tempdb`."
  options:
    a: { en: "Data I/O shows `PAGEIOLATCH_*` waits; `PAGELATCH_*` waits don't involve reading from storage.", fr: "Les E/S de données se traduisent par des attentes `PAGEIOLATCH_*` ; les attentes `PAGELATCH_*` n'impliquent pas de lecture depuis le stockage." }
    b: { en: "Latch waits are not lock blocking, and a blocking session ID doesn't tell which database the page belongs to.", fr: "Les attentes de verrous internes ne sont pas du blocage par verrous, et un ID de session bloquante n'indique pas à quelle base appartient la page." }
    c: { en: "Fragmentation of user indexes has nothing to do with latch contention on `tempdb` allocation pages.", fr: "La fragmentation des index utilisateur n'a aucun rapport avec la contention de verrous internes sur les pages d'allocation de `tempdb`." }
references:
  - title: Monitor performance using dynamic management views
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/monitoring-with-dmvs
