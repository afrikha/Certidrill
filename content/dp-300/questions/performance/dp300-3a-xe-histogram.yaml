id: dp300-3a-xe-histogram
objective: "3.1.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have an Azure SQL managed instance named **MI1**. Applications receive various errors during the day.

    You need an event session that reports, for each error number, how many times the `error_reported` event occurred. The individual events don't need to be kept. The solution must minimize the memory and storage used by the session.

    Which target should you use?
  fr: |
    Vous disposez d'une instance managée Azure SQL nommée **MI1**. Les applications reçoivent diverses erreurs au cours de la journée.

    Vous avez besoin d'une session d'événements qui indique, pour chaque numéro d'erreur, combien de fois l'événement `error_reported` s'est produit. Les événements individuels n'ont pas besoin d'être conservés. La solution doit réduire au minimum la mémoire et le stockage utilisés par la session.

    Quelle cible devez-vous utiliser ?
body:
  options:
    - { id: a, text: event_counter }
    - { id: b, text: ring_buffer }
    - { id: c, text: histogram }
    - { id: d, text: event_file }
answer: { optionId: c }
explanation:
  correct:
    en: |
      The histogram target counts the occurrences of an event for each distinct value of an event field or action, here the error number field (SOURCE_TYPE = 0). It keeps only the counts in its slots, not the events themselves.
    fr: |
      La cible histogram compte les occurrences d'un événement pour chaque valeur distincte d'un champ ou d'une action de l'événement, ici le champ du numéro d'erreur (SOURCE_TYPE = 0). Elle ne conserve que les nombres dans ses emplacements, pas les événements eux-mêmes.
  options:
    a: { en: "event_counter counts the occurrences of each event, not of each value of a field, so all errors would be counted together.", fr: "event_counter compte les occurrences de chaque événement, pas de chaque valeur d'un champ : toutes les erreurs seraient comptées ensemble." }
    b: { en: "ring_buffer keeps the individual events in memory, which uses more memory and requires you to aggregate them yourself.", fr: "ring_buffer conserve les événements individuels en mémoire, ce qui consomme plus de mémoire et vous oblige à les agréger vous-même." }
    d: { en: "event_file writes every event to blob storage, which uses storage you don't need.", fr: "event_file écrit chaque événement dans le stockage blob, ce qui consomme un stockage inutile." }
references:
  - title: Targets for Extended Events
    url: https://learn.microsoft.com/en-us/sql/relational-databases/extended-events/targets-for-extended-events-in-sql-server
