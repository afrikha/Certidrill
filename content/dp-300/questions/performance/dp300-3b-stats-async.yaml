id: dp300-3b-stats-async
objective: "3.3.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have an Azure SQL database named **CheckoutDB** that uses the default statistics options. Several large tables receive frequent modifications.

    Occasionally, an application request times out. You discover that the affected queries were waiting for the synchronous update of out-of-date statistics before they could compile.

    You need to provide more predictable query response times. Statistics must continue to be updated automatically.

    Which statement should you run?
  fr: |
    Vous disposez d'une base de données Azure SQL nommée **CheckoutDB** qui utilise les options de statistiques par défaut. Plusieurs grandes tables subissent des modifications fréquentes.

    De temps en temps, une requête de l'application dépasse son délai d'attente. Vous découvrez que les requêtes concernées attendaient la mise à jour synchrone de statistiques obsolètes avant de pouvoir être compilées.

    Vous devez obtenir des temps de réponse des requêtes plus prévisibles. Les statistiques doivent continuer à être mises à jour automatiquement.

    Quelle instruction devez-vous exécuter ?
body:
  options:
    - { id: a, text: "ALTER DATABASE CURRENT SET AUTO_UPDATE_STATISTICS OFF;" }
    - { id: b, text: "ALTER DATABASE CURRENT SET AUTO_CREATE_STATISTICS OFF;" }
    - { id: c, text: "ALTER DATABASE CURRENT SET AUTO_UPDATE_STATISTICS_ASYNC ON;" }
    - { id: d, text: "UPDATE STATISTICS dbo.Orders WITH FULLSCAN, NORECOMPUTE;" }
answer: { optionId: c }
explanation:
  correct:
    en: "`AUTO_UPDATE_STATISTICS_ASYNC` is off by default, so a query that needs out-of-date statistics waits while they are updated. With the option on, the query compiles with the existing statistics and the update runs in the background, which removes the compile wait; later queries use the refreshed statistics. The option works only while `AUTO_UPDATE_STATISTICS` stays on."
    fr: "`AUTO_UPDATE_STATISTICS_ASYNC` est désactivé par défaut : une requête qui a besoin de statistiques obsolètes attend pendant leur mise à jour. Avec l'option activée, la requête est compilée avec les statistiques existantes et la mise à jour s'exécute en arrière-plan, ce qui supprime l'attente à la compilation ; les requêtes suivantes utilisent les statistiques actualisées. L'option ne fonctionne que si `AUTO_UPDATE_STATISTICS` reste activé."
  options:
    a: { en: "Turning off automatic updates stops refreshing statistics, which leads to stale statistics and poor plans.", fr: "Désactiver les mises à jour automatiques arrête l'actualisation des statistiques, ce qui produit des statistiques obsolètes et de mauvais plans." }
    b: { en: "Automatic creation of statistics isn't the cause of the wait, and turning it off deprives the optimizer of single-column statistics.", fr: "La création automatique des statistiques n'est pas la cause de l'attente, et la désactiver prive l'optimiseur de statistiques sur une seule colonne." }
    d: { en: "`NORECOMPUTE` disables automatic updates for those statistics, which breaks the requirement, and it covers only one table.", fr: "`NORECOMPUTE` désactive les mises à jour automatiques de ces statistiques, ce qui enfreint l'exigence, et ne concerne qu'une seule table." }
references:
  - title: Statistics
    url: https://learn.microsoft.com/en-us/sql/relational-databases/statistics/statistics
  - title: ALTER DATABASE SET options (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/statements/alter-database-transact-sql-set-options
