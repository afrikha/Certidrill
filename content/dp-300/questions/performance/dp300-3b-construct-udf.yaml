id: dp300-3b-construct-udf
objective: "3.2.6"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    You have an Azure SQL database named **PricingDB** that uses compatibility level 140. A reporting query calls a scalar user-defined function named **dbo.fn_NetPrice** for each of several million rows. The query has high CPU time and a long duration, and its plan runs serially.

    You plan to let the database engine transform the function automatically into a scalar expression, without rewriting the query or the function.

    How should you complete the sentences? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'une base de données Azure SQL nommée **PricingDB** qui utilise le niveau de compatibilité 140. Une requête de création de rapports appelle une fonction scalaire définie par l'utilisateur nommée **dbo.fn_NetPrice** pour chacune de plusieurs millions de lignes. La requête a un temps processeur élevé et une longue durée, et son plan s'exécute en série.

    Vous prévoyez de laisser le moteur de base de données transformer automatiquement la fonction en expression scalaire, sans réécrire la requête ni la fonction.

    Comment devez-vous compléter les phrases ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      The lowest database compatibility level that enables this behavior is [[level]].

      To check whether dbo.fn_NetPrice is eligible, query the [[column]] column of the sys.sql_modules catalog view.

      To turn off the behavior for one query only, add the [[hint]] query hint.
    fr: |
      Le niveau de compatibilité de base de données le plus bas qui active ce comportement est [[level]].

      Pour vérifier si dbo.fn_NetPrice est éligible, interrogez la colonne [[column]] de l'affichage catalogue sys.sql_modules.

      Pour désactiver ce comportement pour une seule requête, ajoutez l'indicateur de requête [[hint]].
  slots:
    - id: level
      options:
        - { id: l130, text: "130" }
        - { id: l150, text: "150" }
        - { id: l160, text: "160" }
        - { id: l170, text: "170" }
    - id: column
      options:
        - { id: inl, text: is_inlineable }
        - { id: sb, text: is_schema_bound }
        - { id: nat, text: uses_native_compilation }
    - id: hint
      options:
        - { id: dis, text: "USE HINT('DISABLE_TSQL_SCALAR_UDF_INLINING')" }
        - { id: psp, text: "USE HINT('DISABLE_PARAMETER_SENSITIVE_PLAN')" }
        - { id: rec, text: "RECOMPILE" }
answer:
  values: { level: l150, column: inl, hint: dis }
explanation:
  correct:
    en: |
      Scalar UDF inlining replaces the iterative call of the function with a scalar expression or subquery in the plan, which allows set-based and parallel execution. Workloads become eligible at compatibility level 150, with no change to the function or the query. `sys.sql_modules.is_inlineable` returns 1 when the definition can be inlined, and `USE HINT('DISABLE_TSQL_SCALAR_UDF_INLINING')` turns it off for a single query.
    fr: |
      L'incorporation des UDF scalaires remplace l'appel itératif de la fonction par une expression scalaire ou une sous-requête dans le plan, ce qui permet une exécution ensembliste et parallèle. Les charges de travail deviennent éligibles au niveau de compatibilité 150, sans modification de la fonction ni de la requête. `sys.sql_modules.is_inlineable` renvoie 1 quand la définition peut être incorporée, et `USE HINT('DISABLE_TSQL_SCALAR_UDF_INLINING')` la désactive pour une seule requête.
  options:
    l130: { en: "Compatibility level 130 doesn't enable scalar UDF inlining.", fr: "Le niveau de compatibilité 130 n'active pas l'incorporation des UDF scalaires." }
    l160: { en: "Level 160 also enables it, but it isn't the lowest level; it adds features such as Parameter Sensitive Plan optimization.", fr: "Le niveau 160 l'active aussi, mais ce n'est pas le plus bas ; il ajoute des fonctionnalités comme l'optimisation du plan sensible aux paramètres." }
    l170: { en: "Level 170 enables it too, but 150 is the lowest level required.", fr: "Le niveau 170 l'active aussi, mais 150 est le niveau minimal requis." }
    psp: { en: "This hint disables Parameter Sensitive Plan optimization, not UDF inlining.", fr: "Cet indicateur désactive l'optimisation du plan sensible aux paramètres, pas l'incorporation des UDF." }
    rec: { en: "RECOMPILE forces a new compilation; the function would still be inlined.", fr: "RECOMPILE force une nouvelle compilation ; la fonction serait toujours incorporée." }
references:
  - title: Scalar UDF inlining
    url: https://learn.microsoft.com/en-us/sql/relational-databases/user-defined-functions/scalar-udf-inlining
