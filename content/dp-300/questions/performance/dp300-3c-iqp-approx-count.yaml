id: dp300-3c-iqp-approx-count
objective: "3.3.9"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have an Azure SQL database named ClickDB. A dashboard query counts the distinct visitors per day in a table that contains four billion rows. The query uses `COUNT(DISTINCT VisitorID)`, requests large memory grants and spills to tempdb.

    The dashboard users accept a result that is accurate within a few percent.

    You need to minimize the memory used by the query.

    What should you use?
  fr: |
    Vous disposez d'une base de données Azure SQL nommée ClickDB. Une requête de tableau de bord compte les visiteurs distincts par jour dans une table de quatre milliards de lignes. La requête utilise `COUNT(DISTINCT VisitorID)`, demande de grandes allocations de mémoire et déborde dans tempdb.

    Les utilisateurs du tableau de bord acceptent un résultat précis à quelques pour cent près.

    Vous devez réduire au minimum la mémoire utilisée par la requête.

    Que devez-vous utiliser ?
body:
  options:
    - { id: a, text: "APPROX_PERCENTILE_CONT(0.5) WITHIN GROUP (ORDER BY VisitorID)" }
    - { id: b, text: "COUNT(DISTINCT VisitorID) with the query hint OPTION (MAXDOP 1)" }
    - { id: c, text: "ALTER DATABASE CURRENT SET COMPATIBILITY_LEVEL = 160" }
    - { id: d, text: "APPROX_COUNT_DISTINCT(VisitorID)" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      `APPROX_COUNT_DISTINCT` is an approximate query processing function of the intelligent query processing family. It returns the approximate number of unique non-null values with a much smaller memory footprint than `COUNT(DISTINCT)`, which suits big data sets where a small error is acceptable.
    fr: |
      `APPROX_COUNT_DISTINCT` est une fonction de traitement approximatif des requêtes de la famille du traitement intelligent des requêtes. Elle renvoie le nombre approximatif de valeurs uniques non nulles avec une empreinte mémoire bien inférieure à `COUNT(DISTINCT)`, ce qui convient aux grands jeux de données lorsqu'une petite erreur est acceptable.
  options:
    a: { en: "APPROX_PERCENTILE_CONT computes an approximate percentile, not a count of distinct values.", fr: "APPROX_PERCENTILE_CONT calcule un centile approximatif, pas un nombre de valeurs distinctes." }
    b: { en: "A serial plan still computes an exact distinct count and needs a large memory grant.", fr: "Un plan en série calcule toujours un nombre distinct exact et a besoin d'une grande allocation de mémoire." }
    c: { en: "Level 160 enables features such as Parameter Sensitive Plan optimization, but the exact distinct count still needs the same memory.", fr: "Le niveau 160 active des fonctionnalités comme l'optimisation du plan sensible aux paramètres, mais le décompte distinct exact a toujours besoin de la même mémoire." }
references:
  - title: Intelligent query processing in SQL databases
    url: https://learn.microsoft.com/en-us/sql/relational-databases/performance/intelligent-query-processing
