id: dp300-3b-blocking-statements
objective: "3.2.3"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    You create an Azure SQL database named **HRDB** with the default settings. An application connects to HRDB with `SET XACT_ABORT OFF`, the default.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous créez une base de données Azure SQL nommée **HRDB** avec les paramètres par défaut. Une application se connecte à HRDB avec `SET XACT_ABORT OFF`, la valeur par défaut.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          In HRDB, `SELECT` statements that run at the read committed isolation level don't take shared locks on the rows they read.
        fr: |
          Dans HRDB, les instructions `SELECT` exécutées au niveau d'isolation read committed ne prennent pas de verrous partagés sur les lignes qu'elles lisent.
    - id: s2
      text:
        en: |
          To benefit from optimized locking in HRDB, you must first run `ALTER DATABASE HRDB SET OPTIMIZED_LOCKING = ON`.
        fr: |
          Pour bénéficier du verrouillage optimisé dans HRDB, vous devez d'abord exécuter `ALTER DATABASE HRDB SET OPTIMIZED_LOCKING = ON`.
    - id: s3
      text:
        en: |
          When the application cancels a query that runs inside an explicit transaction because of a command timeout, the database engine rolls back the transaction automatically.
        fr: |
          Quand l'application annule, à cause d'un délai d'expiration de commande, une requête exécutée dans une transaction explicite, le moteur de base de données restaure automatiquement la transaction.
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: |
      Every new database in Azure SQL Database has read committed snapshot isolation (RCSI) enabled, so read committed readers use row versions instead of shared locks. Optimized locking is always enabled in Azure SQL Database and needs no configuration; the `OPTIMIZED_LOCKING` option is for SQL Server 2025, where it is off by default. A timeout or cancel ends the batch but leaves the transaction open; the application must roll it back.
    fr: |
      Chaque nouvelle base de données Azure SQL Database a l'isolation de capture instantanée read committed (RCSI) activée ; les lecteurs en read committed utilisent donc des versions de ligne au lieu de verrous partagés. Le verrouillage optimisé est toujours activé dans Azure SQL Database et ne demande aucune configuration ; l'option `OPTIMIZED_LOCKING` concerne SQL Server 2025, où il est désactivé par défaut. Un dépassement de délai ou une annulation termine le lot mais laisse la transaction ouverte : l'application doit la restaurer.
references:
  - title: Understand and resolve blocking problems
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/understand-resolve-blocking
  - title: Optimized locking
    url: https://learn.microsoft.com/en-us/sql/relational-databases/performance/optimized-locking
