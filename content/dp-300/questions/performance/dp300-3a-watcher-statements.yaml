id: dp300-3a-watcher-statements
objective: "3.1.5"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Adatum monitors its Azure SQL databases with a watcher named **wch-adatum**. The watcher stores its data in a free Azure Data Explorer cluster. Adatum has two Azure subscriptions in the same Microsoft Entra tenant.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum surveille ses bases de données Azure SQL avec un observateur nommé **wch-adatum**. L'observateur stocke ses données dans un cluster Azure Data Explorer gratuit. Adatum dispose de deux abonnements Azure dans le même locataire Microsoft Entra.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: Adatum pays for the watcher resource and its dashboards in addition to the data store.
        fr: Adatum paie la ressource observateur et ses tableaux de bord en plus du magasin de données.
    - id: s2
      text:
        en: Adatum can use the alert rule templates of wch-adatum to create Azure Monitor alerts.
        fr: Adatum peut utiliser les modèles de règles d'alerte de wch-adatum pour créer des alertes Azure Monitor.
    - id: s3
      text:
        en: wch-adatum can collect data from databases in both subscriptions.
        fr: wch-adatum peut collecter les données de bases de données des deux abonnements.
answer:
  values: { s1: false, s2: false, s3: true }
explanation:
  correct:
    en: |
      Watchers and dashboards are free; you pay for the data store, the alerts and any cross-region bandwidth. Alert rule templates create log search alerts, which aren't available when the data store is a free Azure Data Explorer cluster or Real-Time Analytics in Microsoft Fabric. The SQL targets of a watcher can be in any subscription of the same Microsoft Entra tenant.
    fr: |
      Les observateurs et les tableaux de bord sont gratuits ; vous payez le magasin de données, les alertes et l'éventuelle bande passante entre régions. Les modèles de règles d'alerte créent des alertes de recherche dans les journaux, qui ne sont pas disponibles quand le magasin de données est un cluster Azure Data Explorer gratuit ou Real-Time Analytics dans Microsoft Fabric. Les cibles SQL d'un observateur peuvent se trouver dans n'importe quel abonnement du même locataire Microsoft Entra.
references:
  - title: Monitor Azure SQL workloads with database watcher (preview)
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database-watcher-overview
