id: dp300-3a-interpret-statements
objective: "3.1.3"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    You have an Azure SQL database named **DB1** that uses the vCore purchasing model with 4 vCores in the General Purpose service tier. You are interpreting the performance metrics of DB1.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'une base de données Azure SQL nommée **DB1** qui utilise le modèle d'achat vCore avec 4 vCores dans le niveau de service General Purpose. Vous interprétez les métriques de performances de DB1.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: An avg_cpu_percent value of 100 in sys.dm_db_resource_stats means that DB1 uses all the CPU of the physical host.
        fr: Une valeur avg_cpu_percent de 100 dans sys.dm_db_resource_stats signifie que DB1 utilise tout le processeur de l'hôte physique.
    - id: s2
      text:
        en: The avg_instance_cpu_percent column of sys.dm_db_resource_stats reports the CPU usage of the SQL instance that hosts DB1, including internal workloads.
        fr: La colonne avg_instance_cpu_percent de sys.dm_db_resource_stats indique l'utilisation du processeur de l'instance SQL qui héberge DB1, y compris les charges de travail internes.
    - id: s3
      text:
        en: A CPU percentage that reaches 100 % for two minutes once a day justifies scaling DB1 to 8 vCores.
        fr: Un pourcentage de processeur qui atteint 100 % pendant deux minutes une fois par jour justifie la mise à l'échelle de DB1 vers 8 vCores.
answer:
  values: { s1: false, s2: true, s3: false }
explanation:
  correct:
    en: |
      The percentages of sys.dm_db_resource_stats are relative to the limits of the service objective (here 4 vCores), not to the host hardware. avg_instance_cpu_percent measures the CPU of the hosting SQL instance, which also runs internal workloads. A short daily spike isn't a sustained limit: compare with the baseline and look for queries waiting on CPU before you pay for a larger compute size.
    fr: |
      Les pourcentages de sys.dm_db_resource_stats sont relatifs aux limites de l'objectif de service (ici 4 vCores), pas au matériel de l'hôte. avg_instance_cpu_percent mesure le processeur de l'instance SQL d'hébergement, qui exécute aussi des charges de travail internes. Un pic court quotidien n'est pas une limite soutenue : comparez avec la base de référence et recherchez des requêtes qui attendent le processeur avant de payer une taille de calcul supérieure.
references:
  - title: sys.dm_db_resource_stats (Azure SQL Database)
    url: https://learn.microsoft.com/en-us/sql/relational-databases/system-dynamic-management-views/sys-dm-db-resource-stats-azure-sql-database
  - title: Monitor Microsoft Azure SQL performance using dynamic management views
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/monitoring-with-dmvs
