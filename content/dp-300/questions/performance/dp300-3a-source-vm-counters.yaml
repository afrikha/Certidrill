id: dp300-3a-source-vm-counters
objective: "3.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have an Azure virtual machine named **SQLVM1** that runs SQL Server 2022 on Windows Server 2022, and a Log Analytics workspace named **LAW1**.

    You need to collect the SQL Server counters **Batch Requests/sec** and **Page life expectancy** of SQLVM1 every minute in LAW1, so that you can create log search alerts on them.

    What should you do?
  fr: |
    Vous disposez d'une machine virtuelle Azure nommée **SQLVM1** qui exécute SQL Server 2022 sous Windows Server 2022, et d'un espace de travail Log Analytics nommé **LAW1**.

    Vous devez collecter chaque minute dans LAW1 les compteurs SQL Server **Batch Requests/sec** et **Page life expectancy** de SQLVM1, afin de créer des alertes de recherche dans les journaux sur ces compteurs.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Create a diagnostic setting on SQLVM1 that sends all metrics to LAW1.", fr: "Créer sur SQLVM1 un paramètre de diagnostic qui envoie toutes les métriques vers LAW1." } }
    - { id: b, text: { en: "Add SQLVM1 as a SQL target of a database watcher that uses LAW1.", fr: "Ajouter SQLVM1 comme cible SQL d'un observateur de base de données qui utilise LAW1." } }
    - { id: c, text: { en: "Install the Log Analytics agent on SQLVM1 and connect it to LAW1.", fr: "Installer l'agent Log Analytics sur SQLVM1 et le connecter à LAW1." } }
    - { id: d, text: { en: "Install the Azure Monitor Agent on SQLVM1 and associate a data collection rule that collects the two counters.", fr: "Installer l'agent Azure Monitor sur SQLVM1 et associer une règle de collecte de données qui collecte les deux compteurs." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      SQL Server counters are guest performance counters of the virtual machine. The Azure Monitor Agent collects them through a data collection rule (custom counters can be added to the Basic list) and sends them to the Perf table of a Log Analytics workspace, where log search alerts can query them.
    fr: |
      Les compteurs SQL Server sont des compteurs de performances invités de la machine virtuelle. L'agent Azure Monitor les collecte par une règle de collecte de données (des compteurs personnalisés peuvent s'ajouter à la liste Basic) et les envoie dans la table Perf d'un espace de travail Log Analytics, où des alertes de recherche dans les journaux peuvent les interroger.
  options:
    a: { en: "The diagnostic setting of a VM resource exports its host platform metrics only, not the SQL Server counters of the guest.", fr: "Le paramètre de diagnostic d'une ressource de machine virtuelle n'exporte que ses métriques de plateforme de l'hôte, pas les compteurs SQL Server de l'invité." }
    b: { en: "Database watcher monitors Azure SQL Database and SQL Managed Instance only, and it stores data in Azure Data Explorer or Fabric, not in Log Analytics.", fr: "L'observateur de base de données ne surveille qu'Azure SQL Database et SQL Managed Instance, et il stocke les données dans Azure Data Explorer ou Fabric, pas dans Log Analytics." }
    c: { en: "The Log Analytics agent (MMA) is retired; the Azure Monitor Agent replaces it.", fr: "L'agent Log Analytics (MMA) est mis hors service ; l'agent Azure Monitor le remplace." }
references:
  - title: Collect performance counters from virtual machines with Azure Monitor
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/vm/data-collection-performance
