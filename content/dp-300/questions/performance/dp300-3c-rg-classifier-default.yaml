id: dp300-3c-rg-classifier-default
objective: "3.3.6"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    You have an Azure virtual machine named SQLVM7 that runs SQL Server 2022 Enterprise. Resource Governor is enabled with a registered classifier function in the master database and several user-defined workload groups.

    Which two situations result in a new session being assigned to the default workload group?

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'une machine virtuelle Azure nommée SQLVM7 qui exécute SQL Server 2022 Enterprise. Resource Governor est activé avec une fonction de classification inscrite dans la base master et plusieurs groupes de charges de travail définis par l'utilisateur.

    Quelles sont les deux situations dans lesquelles une nouvelle session est affectée au groupe de charges de travail default ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "The classifier function returns NULL for the session.", fr: "La fonction de classification renvoie NULL pour la session." } }
    - { id: b, text: { en: "The session is a dedicated administrator connection (DAC).", fr: "La session est une connexion administrateur dédiée (DAC)." } }
    - { id: c, text: { en: "The classifier function returns the name of a workload group that doesn't exist.", fr: "La fonction de classification renvoie le nom d'un groupe de charges de travail qui n'existe pas." } }
    - { id: d, text: { en: "The login of the session is a member of the sysadmin fixed server role.", fr: "La connexion de la session est membre du rôle serveur fixe sysadmin." } }
    - { id: e, text: { en: "The application opens the session from a client connection pool.", fr: "L'application ouvre la session depuis un pool de connexions client." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |
      A session goes to the default workload group when the classifier function returns NULL, returns `default`, returns the name of a group that doesn't exist, or fails. Otherwise, it goes to the group that the function returns.
    fr: |
      Une session est affectée au groupe de charges de travail default quand la fonction de classification renvoie NULL, renvoie `default`, renvoie le nom d'un groupe qui n'existe pas ou échoue. Sinon, elle est affectée au groupe renvoyé par la fonction.
  options:
    b: { en: "The DAC isn't subject to classification; it always runs in the internal workload group and resource pool.", fr: "La DAC n'est pas soumise à la classification ; elle s'exécute toujours dans le groupe de charges de travail et le pool de ressources internal." }
    d: { en: "Membership in sysadmin doesn't bypass classification; the session gets the group that the function returns.", fr: "L'appartenance à sysadmin ne contourne pas la classification ; la session obtient le groupe renvoyé par la fonction." }
    e: { en: "The classifier function runs for every new session, even with connection pooling, so the session gets the group that the function returns.", fr: "La fonction de classification s'exécute pour chaque nouvelle session, même avec le regroupement de connexions : la session obtient le groupe renvoyé par la fonction." }
references:
  - title: Resource governor classifier function
    url: https://learn.microsoft.com/en-us/sql/relational-databases/resource-governor/resource-governor-classifier-function
