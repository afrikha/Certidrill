id: dp300-3a-config-active-sessions
objective: "3.1.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have an Azure SQL managed instance named **MI1**.

    You need to list, for each user session that is currently running a request, the login name, the host name, the current wait type and the text of the running statement. You must use Transact-SQL.

    What should you query?
  fr: |
    Vous disposez d'une instance managée Azure SQL nommée **MI1**.

    Vous devez lister, pour chaque session utilisateur qui exécute actuellement une requête, le nom de connexion, le nom d'hôte, le type d'attente actuel et le texte de l'instruction en cours. Vous devez utiliser Transact-SQL.

    Que devez-vous interroger ?
body:
  options:
    - { id: a, text: { en: "sys.dm_exec_sessions joined to sys.dm_exec_requests, with CROSS APPLY sys.dm_exec_sql_text on the sql_handle", fr: "sys.dm_exec_sessions joint à sys.dm_exec_requests, avec CROSS APPLY sys.dm_exec_sql_text sur le sql_handle" } }
    - { id: b, text: { en: "sys.dm_exec_query_stats with CROSS APPLY sys.dm_exec_sql_text on the sql_handle", fr: "sys.dm_exec_query_stats avec CROSS APPLY sys.dm_exec_sql_text sur le sql_handle" } }
    - { id: c, text: { en: "sys.dm_exec_connections joined to sys.dm_os_wait_stats", fr: "sys.dm_exec_connections joint à sys.dm_os_wait_stats" } }
    - { id: d, text: { en: "sys.query_store_runtime_stats joined to sys.query_store_query_text", fr: "sys.query_store_runtime_stats joint à sys.query_store_query_text" } }
answer: { optionId: a }
explanation:
  correct:
    en: "`sys.dm_exec_sessions` gives the login and host name of each session, `sys.dm_exec_requests` gives the requests that are running now with their wait type, and `sys.dm_exec_sql_text` returns the text of the batch from the request's `sql_handle`."
    fr: "`sys.dm_exec_sessions` fournit le nom de connexion et le nom d'hôte de chaque session, `sys.dm_exec_requests` fournit les requêtes en cours d'exécution avec leur type d'attente, et `sys.dm_exec_sql_text` renvoie le texte du lot à partir du `sql_handle` de la requête."
  options:
    b: { en: "sys.dm_exec_query_stats aggregates statistics of cached plans; it doesn't show sessions, logins or current waits.", fr: "sys.dm_exec_query_stats agrège les statistiques des plans en cache ; il n'affiche ni les sessions, ni les connexions, ni les attentes actuelles." }
    c: { en: "sys.dm_os_wait_stats contains cumulative waits of the instance, not the current wait of each session, and neither view returns the statement text.", fr: "sys.dm_os_wait_stats contient les attentes cumulées de l'instance, pas l'attente actuelle de chaque session, et aucune des deux vues ne renvoie le texte de l'instruction." }
    d: { en: "Query Store views hold aggregated history per query and plan, not the sessions running now.", fr: "Les vues du Magasin des requêtes contiennent un historique agrégé par requête et par plan, pas les sessions en cours d'exécution." }
references:
  - title: Monitor Microsoft Azure SQL performance using dynamic management views
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/monitoring-with-dmvs
