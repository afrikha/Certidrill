id: dp300-cs2c-scoped-config
objective: "3.3.7"
type: dropdown
caseStudy: dp300-cs2c-adatum-learning
difficulty: 3
status: draft
stem:
  en: |
    Enrollment has been migrated, and its geo-secondary on sql-adl-neu has been created. You need to configure Enrollment to meet the performance requirements.

    How should you complete the Transact-SQL script? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Enrollment a été migrée et son géo-secondaire sur sql-adl-neu a été créé. Vous devez configurer Enrollment pour satisfaire les exigences de performances.

    Comment devez-vous compléter le script Transact-SQL ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: sql
  template:
    en: |
      -- Run the script while connected to: [[target]]
      ALTER DATABASE SCOPED CONFIGURATION SET MAXDOP = 2;
      ALTER DATABASE SCOPED CONFIGURATION FOR SECONDARY SET MAXDOP = [[dop]];
      ALTER DATABASE SCOPED CONFIGURATION SET [[option]] = ON;
    fr: |
      -- Exécuter le script en étant connecté à : [[target]]
      ALTER DATABASE SCOPED CONFIGURATION SET MAXDOP = 2;
      ALTER DATABASE SCOPED CONFIGURATION FOR SECONDARY SET MAXDOP = [[dop]];
      ALTER DATABASE SCOPED CONFIGURATION SET [[option]] = ON;
  slots:
    - id: target
      options:
        - { id: tg_master, text: { en: "the master database of sql-adl-weu", fr: "la base de données master de sql-adl-weu" } }
        - { id: tg_primary, text: { en: "the Enrollment database on sql-adl-weu", fr: "la base de données Enrollment sur sql-adl-weu" } }
        - { id: tg_secondary, text: { en: "the Enrollment database on sql-adl-neu", fr: "la base de données Enrollment sur sql-adl-neu" } }
    - id: dop
      options:
        - { id: d_0, text: "0" }
        - { id: d_8, text: "8" }
        - { id: d_primary, text: PRIMARY }
    - id: option
      options:
        - { id: o_adhoc, text: OPTIMIZE_FOR_AD_HOC_WORKLOADS }
        - { id: o_lqps, text: LAST_QUERY_PLAN_STATS }
        - { id: o_lce, text: LEGACY_CARDINALITY_ESTIMATION }
answer:
  values: { target: tg_primary, dop: d_8, option: o_adhoc }
explanation:
  correct:
    en: |
      Database scoped configurations are set in the user database, and the geo-secondary is read-only, so the script runs in Enrollment on the primary server; `FOR SECONDARY` stores the value that the readable secondaries use. MAXDOP 2 limits the queries on the primary, and `FOR SECONDARY SET MAXDOP = 8` lets the reports on the geo-secondary use up to eight processors. `OPTIMIZE_FOR_AD_HOC_WORKLOADS = ON` caches only a small plan stub the first time a batch is compiled and a full plan only if it runs again.
    fr: |
      Les configurations délimitées à la base de données se définissent dans la base utilisateur, et le géo-secondaire est en lecture seule : le script s'exécute donc dans Enrollment sur le serveur primaire ; `FOR SECONDARY` stocke la valeur utilisée par les secondaires accessibles en lecture. MAXDOP 2 limite les requêtes sur le primaire, et `FOR SECONDARY SET MAXDOP = 8` permet aux rapports du géo-secondaire d'utiliser jusqu'à huit processeurs. `OPTIMIZE_FOR_AD_HOC_WORKLOADS = ON` ne met en cache qu'un petit stub de plan à la première compilation d'un lot, et un plan complet seulement s'il s'exécute de nouveau.
  options:
    tg_master: { en: "ALTER DATABASE SCOPED CONFIGURATION applies to the current database; run in master it would not configure Enrollment.", fr: "ALTER DATABASE SCOPED CONFIGURATION s'applique à la base de données active ; exécutée dans master, elle ne configurerait pas Enrollment." }
    tg_secondary: { en: "The geo-secondary is read-only; the secondary values are set from the primary with FOR SECONDARY.", fr: "Le géo-secondaire est en lecture seule ; les valeurs des secondaires se définissent depuis le primaire avec FOR SECONDARY." }
    d_0: { en: "MAXDOP 0 lets a query use all 16 processors, more than the eight that the reports need.", fr: "MAXDOP 0 permet à une requête d'utiliser les 16 processeurs, plus que les huit nécessaires aux rapports." }
    d_primary: { en: "PRIMARY makes the secondary use the value of the primary, two processors.", fr: "PRIMARY fait utiliser au secondaire la valeur du primaire, soit deux processeurs." }
    o_lqps: { en: "LAST_QUERY_PLAN_STATS collects the last actual plan of each query; it adds information instead of saving plan cache memory.", fr: "LAST_QUERY_PLAN_STATS collecte le dernier plan réel de chaque requête ; il ajoute des informations au lieu d'économiser la mémoire du cache des plans." }
    o_lce: { en: "LEGACY_CARDINALITY_ESTIMATION changes the cardinality estimation model, not how plans are cached.", fr: "LEGACY_CARDINALITY_ESTIMATION change le modèle d'estimation de la cardinalité, pas la mise en cache des plans." }
references:
  - title: ALTER DATABASE SCOPED CONFIGURATION - SQL Server (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/statements/alter-database-scoped-configuration-transact-sql
