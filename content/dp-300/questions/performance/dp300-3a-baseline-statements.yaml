id: dp300-3a-baseline-statements
objective: "3.1.1"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    You are preparing an operational performance baseline for an Azure SQL database named **DB1** that is part of an auto-failover group.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous préparez une base de référence des performances opérationnelles pour une base de données Azure SQL nommée **DB1** qui fait partie d'un groupe de basculement.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: If DB1 failed over 20 minutes ago, sys.dm_db_resource_stats returns only the data collected since the failover.
        fr: Si DB1 a basculé il y a 20 minutes, sys.dm_db_resource_stats ne renvoie que les données collectées depuis le basculement.
    - id: s2
      text:
        en: A single Metrics Explorer chart can display the CPU percentage of DB1 for the last 90 days.
        fr: Un seul graphique de Metrics Explorer peut afficher le pourcentage de processeur de DB1 pour les 90 derniers jours.
    - id: s3
      text:
        en: In an elastic pool, the percentages returned by sys.dm_db_resource_stats are relative to the limits set in the pool configuration.
        fr: Dans un pool élastique, les pourcentages renvoyés par sys.dm_db_resource_stats sont relatifs aux limites définies dans la configuration du pool.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: "`sys.dm_db_resource_stats` keeps about one hour of 15-second rows, and after a failover in the last 60 minutes it returns data only since that failover. Platform metrics are kept 93 days, but a single Metrics Explorer chart queries at most 30 days: you pan the chart to see older data. For a database in an elastic pool, the view reports percentages of the maximum limits of the pool configuration."
    fr: "`sys.dm_db_resource_stats` conserve environ une heure de lignes à 15 secondes, et après un basculement au cours des 60 dernières minutes, il ne renvoie que les données postérieures à ce basculement. Les métriques de plateforme sont conservées 93 jours, mais un graphique de Metrics Explorer interroge au plus 30 jours : vous faites défiler le graphique pour voir les données plus anciennes. Pour une base d'un pool élastique, la vue indique des pourcentages des limites maximales de la configuration du pool."
references:
  - title: sys.dm_db_resource_stats (Azure SQL Database)
    url: https://learn.microsoft.com/en-us/sql/relational-databases/system-dynamic-management-views/sys-dm-db-resource-stats-azure-sql-database
  - title: Azure Monitor Metrics overview
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/metrics/data-platform-metrics
