id: dp300-cs3c-site-visits-index
objective: "3.2.5"
type: single
caseStudy: dp300-cs3c-trey-research
difficulty: 2
status: draft
stem:
  en: |
    You need to meet the performance requirements for the query of the site coordinators' portal.

    Which statement should you run in SiteMonitoring?
  fr: |
    Vous devez satisfaire les exigences de performances concernant la requête du portail des coordinateurs de sites.

    Quelle instruction devez-vous exécuter dans SiteMonitoring ?
body:
  options:
    - { id: a, text: "CREATE NONCLUSTERED INDEX IX_SiteVisits ON dbo.SiteVisits (VisitDate, SiteId, StudyId) INCLUDE (Status, MonitorId);" }
    - { id: b, text: "CREATE NONCLUSTERED INDEX IX_SiteVisits ON dbo.SiteVisits (SiteId, StudyId) INCLUDE (VisitDate, Status, MonitorId);" }
    - { id: c, text: "CREATE NONCLUSTERED INDEX IX_SiteVisits ON dbo.SiteVisits (SiteId, StudyId, VisitDate, Status, MonitorId);" }
    - { id: d, text: "CREATE NONCLUSTERED INDEX IX_SiteVisits ON dbo.SiteVisits (SiteId, StudyId, VisitDate) INCLUDE (Status, MonitorId);" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      The guidance for missing index suggestions is to place the equality columns before the inequality columns, together forming the index key, and to add the included columns with INCLUDE. Equality columns are ordered from the most selective: SiteId (1,800 values) comes before StudyId (40 values), and VisitDate follows for the range predicate. VisitId does not need to be included, because the clustered index key is stored in every nonclustered index row.
    fr: |
      Les recommandations pour les suggestions d'index manquants consistent à placer les colonnes d'égalité avant les colonnes d'inégalité, qui forment ensemble la clé de l'index, et à ajouter les colonnes incluses avec INCLUDE. Les colonnes d'égalité sont classées de la plus sélective à la moins sélective : SiteId (1 800 valeurs) précède StudyId (40 valeurs), et VisitDate suit pour le prédicat de plage. VisitId n'a pas besoin d'être inclus, car la clé de l'index cluster est stockée dans chaque ligne d'un index non cluster.
  options:
    a: { en: "Putting the inequality column first lets the index seek only on the date range, not on the two equality predicates.", fr: "Placer la colonne d'inégalité en premier ne permet à l'index de rechercher que sur la plage de dates, pas sur les deux prédicats d'égalité." }
    b: { en: "VisitDate is a search column; as an included column it cannot be used to seek the range, which the guidance places in the key.", fr: "VisitDate est une colonne de recherche ; comme colonne incluse, elle ne peut pas servir à rechercher la plage, que les recommandations placent dans la clé." }
    c: { en: "Status and MonitorId are only returned by the query; putting them in the key widens it, against the requirement that the key contain only search columns.", fr: "Status et MonitorId sont uniquement renvoyées par la requête ; les placer dans la clé l'élargit, contrairement à l'exigence d'une clé limitée aux colonnes de recherche." }
references:
  - title: Tune nonclustered indexes with missing index suggestions
    url: https://learn.microsoft.com/en-us/sql/relational-databases/indexes/tune-nonclustered-missing-index-suggestions
