id: dp300-3c-adhoc-workloads
objective: "3.3.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have an Azure virtual machine that runs SQL Server 2022 and hosts 15 databases. A third-party application that you can't modify sends many ad hoc queries that run only once. Single-use plans use most of the plan cache memory.

    You need to reduce the memory used by single-use plans for all the databases on the instance. The solution must not remove the plans that are already cached.

    What should you do?
  fr: |
    Vous disposez d'une machine virtuelle Azure qui exécute SQL Server 2022 et héberge 15 bases de données. Une application tierce que vous ne pouvez pas modifier envoie de nombreuses requêtes ad hoc qui ne s'exécutent qu'une seule fois. Les plans à usage unique occupent la majeure partie de la mémoire du cache des plans.

    Vous devez réduire la mémoire utilisée par les plans à usage unique pour toutes les bases de données de l'instance. La solution ne doit pas supprimer les plans déjà en cache.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Schedule a SQL Server Agent job that runs DBCC FREEPROCCACHE every hour.", fr: "Planifier un travail SQL Server Agent qui exécute DBCC FREEPROCCACHE toutes les heures." } }
    - { id: b, text: { en: "Set the optimize for ad hoc workloads option to 1 by using sp_configure, and then run RECONFIGURE.", fr: "Définir l'option optimize for ad hoc workloads sur 1 avec sp_configure, puis exécuter RECONFIGURE." } }
    - { id: c, text: { en: "Lower the max server memory (MB) option by using sp_configure, and then run RECONFIGURE.", fr: "Diminuer l'option max server memory (MB) avec sp_configure, puis exécuter RECONFIGURE." } }
    - { id: d, text: { en: "Set the cost threshold for parallelism option to 50 by using sp_configure, and then run RECONFIGURE.", fr: "Définir l'option cost threshold for parallelism sur 50 avec sp_configure, puis exécuter RECONFIGURE." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      With `optimize for ad hoc workloads` enabled, the instance caches only a small compiled plan stub the first time a batch runs, and caches the full plan only if the batch runs again. The server-level option applies to every database on the instance and takes effect without clearing the existing cache.
    fr: |
      Avec `optimize for ad hoc workloads` activée, l'instance ne met en cache qu'un petit stub de plan compilé à la première exécution d'un lot, et ne met en cache le plan complet que si le lot s'exécute de nouveau. L'option au niveau du serveur s'applique à toutes les bases de l'instance et prend effet sans vider le cache existant.
  options:
    a: { en: "DBCC FREEPROCCACHE removes every cached plan, including the reused ones, which the requirements forbid and which causes recompilations.", fr: "DBCC FREEPROCCACHE supprime tous les plans en cache, y compris ceux qui sont réutilisés, ce que les exigences interdisent et qui provoque des recompilations." }
    c: { en: "Lowering max server memory shrinks the memory of the whole instance, including the buffer pool, without targeting single-use plans.", fr: "Diminuer max server memory réduit la mémoire de toute l'instance, y compris le pool de mémoires tampons, sans cibler les plans à usage unique." }
    d: { en: "The cost threshold for parallelism decides which queries can use parallel plans; it doesn't change plan caching.", fr: "Le cost threshold for parallelism détermine quelles requêtes peuvent utiliser des plans parallèles ; il ne change pas la mise en cache des plans." }
references:
