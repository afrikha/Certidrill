id: dp300-3c-scale-mi
objective: "3.3.8"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have an Azure SQL managed instance named MI4 in the Business Critical service tier with 8 vCores. You plan to scale MI4 to 16 vCores during business hours.

    The application owners ask how the scaling operation will affect the availability of MI4.

    What should you tell them?
  fr: |
    Vous disposez d'une instance managée Azure SQL nommée MI4 dans le niveau de service Business Critical avec 8 vCores. Vous prévoyez de mettre MI4 à l'échelle vers 16 vCores pendant les heures ouvrées.

    Les propriétaires des applications demandent comment l'opération de mise à l'échelle affectera la disponibilité de MI4.

    Que devez-vous leur répondre ?
body:
  options:
    - { id: a, text: { en: "MI4 is unavailable for the whole duration of the operation.", fr: "MI4 est indisponible pendant toute la durée de l'opération." } }
    - { id: b, text: { en: "MI4 stays available, then is unavailable for up to 10 minutes at the end.", fr: "MI4 reste disponible, puis est indisponible jusqu'à 10 minutes à la fin." } }
    - { id: c, text: { en: "MI4 stays available, then is unavailable for up to 20 seconds at the end.", fr: "MI4 reste disponible, puis est indisponible jusqu'à 20 secondes à la fin." } }
    - { id: d, text: { en: "MI4 stays available for the whole operation, with no interruption.", fr: "MI4 reste disponible pendant toute l'opération, sans aucune interruption." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Scaling a managed instance is an update management operation that runs online. In Business Critical, the new replicas are seeded in the background, and the instance is unavailable only during the final failover, which lasts up to 20 seconds. Applications should use retry logic to reconnect.
    fr: |
      La mise à l'échelle d'une instance managée est une opération de gestion de mise à jour qui s'exécute en ligne. En Business Critical, les nouveaux réplicas sont amorcés en arrière-plan, et l'instance n'est indisponible que pendant le basculement final, qui dure jusqu'à 20 secondes. Les applications doivent utiliser une logique de nouvelle tentative pour se reconnecter.
  options:
    a: { en: "The instance stays available while the new compute is prepared; only the final failover interrupts it.", fr: "L'instance reste disponible pendant la préparation du nouveau calcul ; seul le basculement final l'interrompt." }
    b: { en: "Up to 10 minutes applies to Next-gen General Purpose instances with many databases, not to Business Critical.", fr: "Jusqu'à 10 minutes s'applique aux instances Next-gen General Purpose comportant de nombreuses bases, pas à Business Critical." }
    d: { en: "The final failover causes a short interruption that applications must handle.", fr: "Le basculement final provoque une courte interruption que les applications doivent gérer." }
references:
  - title: Overview of management operations in Azure SQL Managed Instance
    url: https://learn.microsoft.com/en-us/azure/azure-sql/managed-instance/management-operations-overview
