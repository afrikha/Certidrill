id: dp300-3b-plan-showplan-permission
objective: "3.2.7"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have an Azure SQL database named **FinanceDB**. A developer named **Dev1** has a database user in FinanceDB and is a member of the **db_datareader** role.

    Dev1 can run `SELECT` queries but receives an error when trying to display the execution plan of a query in SQL Server Management Studio (SSMS).

    You need to allow Dev1 to display execution plans in FinanceDB. The solution must follow the principle of least privilege.

    Which statement should you run in FinanceDB?
  fr: |
    Vous disposez d'une base de données Azure SQL nommée **FinanceDB**. Un développeur nommé **Dev1** a un utilisateur de base de données dans FinanceDB et est membre du rôle **db_datareader**.

    Dev1 peut exécuter des requêtes `SELECT`, mais reçoit une erreur quand il essaie d'afficher le plan d'exécution d'une requête dans SQL Server Management Studio (SSMS).

    Vous devez permettre à Dev1 d'afficher les plans d'exécution dans FinanceDB. La solution doit respecter le principe du moindre privilège.

    Quelle instruction devez-vous exécuter dans FinanceDB ?
body:
  options:
    - { id: a, text: "GRANT VIEW DATABASE STATE TO Dev1;" }
    - { id: b, text: "ALTER ROLE db_owner ADD MEMBER Dev1;" }
    - { id: c, text: "GRANT ALTER ON SCHEMA::dbo TO Dev1;" }
    - { id: d, text: "GRANT SHOWPLAN TO Dev1;" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Displaying an execution plan requires the permissions to run the query plus the `SHOWPLAN` permission on every database referenced by the query. Granting `SHOWPLAN` in FinanceDB adds only that capability to Dev1's existing read access.
    fr: |
      Afficher un plan d'exécution exige les autorisations nécessaires pour exécuter la requête, plus l'autorisation `SHOWPLAN` sur chaque base de données référencée par la requête. Accorder `SHOWPLAN` dans FinanceDB ajoute uniquement cette capacité à l'accès en lecture existant de Dev1.
  options:
    a: { en: "`VIEW DATABASE STATE` lets Dev1 query database-scoped DMVs, but it isn't the permission that displaying a plan requires.", fr: "`VIEW DATABASE STATE` permet à Dev1 d'interroger les DMV de niveau base, mais ce n'est pas l'autorisation qu'exige l'affichage d'un plan." }
    b: { en: "db_owner would include the permission but grants full control of the database, which violates least privilege.", fr: "db_owner inclurait l'autorisation, mais accorde le contrôle total de la base, ce qui ne respecte pas le moindre privilège." }
    c: { en: "`ALTER` on the schema lets Dev1 change objects; it doesn't grant `SHOWPLAN`.", fr: "`ALTER` sur le schéma permet à Dev1 de modifier des objets ; cela n'accorde pas `SHOWPLAN`." }
references:
  - title: Display an actual execution plan
    url: https://learn.microsoft.com/en-us/sql/relational-databases/performance/display-an-actual-execution-plan
