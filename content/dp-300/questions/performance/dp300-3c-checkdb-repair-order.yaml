id: dp300-3c-checkdb-repair-order
objective: "3.3.3"
type: ordering
difficulty: 1
status: draft
stem:
  en: |
    You have an Azure virtual machine that runs SQL Server 2019 and hosts a database named InventoryDB.

    `DBCC CHECKDB` reports consistency errors in InventoryDB, and the minimum repair level it reports is `repair_allow_data_loss`. No backup taken before the corruption exists, and the business accepts the possible loss of data. A copy of the database files has already been taken.

    You need to repair InventoryDB and make it available to users again.

    Which three actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Vous disposez d'une machine virtuelle Azure qui exécute SQL Server 2019 et héberge une base de données nommée InventoryDB.

    `DBCC CHECKDB` signale des erreurs de cohérence dans InventoryDB, et le niveau de réparation minimal qu'il indique est `repair_allow_data_loss`. Aucune sauvegarde antérieure à la corruption n'existe, et l'entreprise accepte une éventuelle perte de données. Une copie des fichiers de la base de données a déjà été effectuée.

    Vous devez réparer InventoryDB et la rendre de nouveau disponible pour les utilisateurs.

    Quelles sont les trois actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - { id: single, text: { en: "Run `ALTER DATABASE InventoryDB SET SINGLE_USER WITH ROLLBACK IMMEDIATE;`", fr: "Exécuter `ALTER DATABASE InventoryDB SET SINGLE_USER WITH ROLLBACK IMMEDIATE;`" } }
    - { id: repair, text: { en: "Run `DBCC CHECKDB (InventoryDB, REPAIR_ALLOW_DATA_LOSS);`", fr: "Exécuter `DBCC CHECKDB (InventoryDB, REPAIR_ALLOW_DATA_LOSS);`" } }
    - { id: multi, text: { en: "Run `ALTER DATABASE InventoryDB SET MULTI_USER;`", fr: "Exécuter `ALTER DATABASE InventoryDB SET MULTI_USER;`" } }
    - { id: fast, text: { en: "Run `DBCC CHECKDB (InventoryDB, REPAIR_FAST);`", fr: "Exécuter `DBCC CHECKDB (InventoryDB, REPAIR_FAST);`" } }
    - { id: readonly, text: { en: "Run `ALTER DATABASE InventoryDB SET READ_ONLY;`", fr: "Exécuter `ALTER DATABASE InventoryDB SET READ_ONLY;`" } }
    - { id: physical, text: { en: "Run `DBCC CHECKDB (InventoryDB) WITH PHYSICAL_ONLY;`", fr: "Exécuter `DBCC CHECKDB (InventoryDB) WITH PHYSICAL_ONLY;`" } }
answer:
  sequence: [ single, repair, multi ]
explanation:
  correct:
    en: |
      Every `REPAIR_*` option of `DBCC CHECKDB` requires the database to be in single-user mode, so you first switch InventoryDB to `SINGLE_USER` and roll back the open transactions. You then run the repair at the level that `DBCC CHECKDB` reported, `REPAIR_ALLOW_DATA_LOSS`, and finally return the database to `MULTI_USER` so that users can connect again. Restoring a good backup is always preferred, but none exists here.
    fr: |
      Toutes les options `REPAIR_*` de `DBCC CHECKDB` exigent que la base de données soit en mode mono-utilisateur : vous passez d'abord InventoryDB en `SINGLE_USER` en annulant les transactions ouvertes. Vous exécutez ensuite la réparation au niveau indiqué par `DBCC CHECKDB`, `REPAIR_ALLOW_DATA_LOSS`, puis vous remettez la base en `MULTI_USER` pour que les utilisateurs puissent de nouveau se connecter. La restauration d'une sauvegarde saine est toujours préférable, mais il n'en existe aucune ici.
  options:
    fast: { en: "REPAIR_FAST is kept only for backward compatibility and performs no repair.", fr: "REPAIR_FAST n'est conservée que pour la compatibilité descendante et n'effectue aucune réparation." }
    readonly: { en: "Repair options require single-user mode, not read-only mode, because the repair writes to the database.", fr: "Les options de réparation exigent le mode mono-utilisateur, pas le mode lecture seule, car la réparation écrit dans la base de données." }
    physical: { en: "PHYSICAL_ONLY performs a lighter check and can't be combined with repair options; the errors are already known.", fr: "PHYSICAL_ONLY effectue une vérification allégée et ne peut pas être combinée avec les options de réparation ; les erreurs sont déjà connues." }
references:
  - title: DBCC CHECKDB (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/database-console-commands/dbcc-checkdb-transact-sql
