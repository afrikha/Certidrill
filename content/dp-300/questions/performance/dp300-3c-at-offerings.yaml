id: dp300-3c-at-offerings
objective: "3.3.4"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Litware has the following databases. Query Store is enabled in `READ_WRITE` mode on each database.

    - SalesDB: a single database in Azure SQL Database
    - HRDB: a database on an Azure SQL managed instance
    - OpsDB: a database on SQL Server 2022 that runs on an Azure virtual machine

    You need to identify which automatic tuning options you can enable on each database.

    Which options should you identify for each database? To answer, drag the appropriate option sets to the correct databases. Each option set may be used once, more than once, or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware dispose des bases de données suivantes. Le Magasin des requêtes est activé en mode `READ_WRITE` sur chaque base.

    - SalesDB : une base de données unique dans Azure SQL Database
    - HRDB : une base de données sur une instance managée Azure SQL
    - OpsDB : une base de données sur SQL Server 2022 qui s'exécute sur une machine virtuelle Azure

    Vous devez identifier les options de réglage automatique que vous pouvez activer sur chaque base de données.

    Quelles options devez-vous identifier pour chaque base de données ? Pour répondre, faites glisser les ensembles d'options appropriés vers les bases de données correspondantes. Chaque ensemble d'options peut être utilisé une fois, plusieurs fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: true
  items:
    - { id: flgp, text: { en: "FORCE_LAST_GOOD_PLAN only", fr: "FORCE_LAST_GOOD_PLAN uniquement" } }
    - { id: all, text: { en: "FORCE_LAST_GOOD_PLAN, CREATE_INDEX and DROP_INDEX", fr: "FORCE_LAST_GOOD_PLAN, CREATE_INDEX et DROP_INDEX" } }
    - { id: idx, text: { en: "CREATE_INDEX and DROP_INDEX only", fr: "CREATE_INDEX et DROP_INDEX uniquement" } }
    - { id: none, text: { en: "No automatic tuning option", fr: "Aucune option de réglage automatique" } }
  targets:
    - { id: db, text: SalesDB }
    - { id: mi, text: HRDB }
    - { id: vm, text: OpsDB }
answer:
  mapping: { db: all, mi: flgp, vm: flgp }
explanation:
  correct:
    en: |
      Azure SQL Database supports the three automatic tuning options, including automatic index management (CREATE_INDEX and DROP_INDEX). Azure SQL Managed Instance supports only FORCE_LAST_GOOD_PLAN, and so does SQL Server 2017 and later, where automatic plan correction relies on Query Store. Automatic index management exists only in Azure SQL Database and SQL database in Microsoft Fabric.
    fr: |
      Azure SQL Database prend en charge les trois options de réglage automatique, y compris la gestion automatique des index (CREATE_INDEX et DROP_INDEX). Azure SQL Managed Instance ne prend en charge que FORCE_LAST_GOOD_PLAN, comme SQL Server 2017 et versions ultérieures, où la correction automatique des plans repose sur le Magasin des requêtes. La gestion automatique des index n'existe que dans Azure SQL Database et dans SQL database dans Microsoft Fabric.
references:
  - title: Automatic database tuning
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/automatic-tuning-overview
  - title: Automatic tuning
    url: https://learn.microsoft.com/en-us/sql/relational-databases/automatic-tuning/automatic-tuning
