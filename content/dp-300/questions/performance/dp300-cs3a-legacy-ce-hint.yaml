id: dp300-cs3a-legacy-ce-hint
objective: "3.2.2"
type: ordering
caseStudy: dp300-cs3a-lamna-insurance
difficulty: 2
status: draft
stem:
  en: |
    The compatibility level of PolicyDB has been raised to 160. You need to meet the performance requirements for the statement of the quoting application that runs slower.

    Which three actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Le niveau de compatibilité de PolicyDB a été porté à 160. Vous devez satisfaire les exigences de performances concernant l'instruction de l'application de devis qui s'exécute plus lentement.

    Quelles sont les trois actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - { id: find, text: { en: "Query sys.query_store_query_text joined to sys.query_store_query to obtain the query_id of the statement.", fr: "Interroger sys.query_store_query_text jointe à sys.query_store_query pour obtenir le query_id de l'instruction." } }
    - { id: sethint, text: { en: "Run sys.sp_query_store_set_hints with the query_id and N'OPTION(USE HINT(''FORCE_LEGACY_CARDINALITY_ESTIMATION''))'.", fr: "Exécuter sys.sp_query_store_set_hints avec le query_id et N'OPTION(USE HINT(''FORCE_LEGACY_CARDINALITY_ESTIMATION''))'." } }
    - { id: verify, text: { en: "Query sys.query_store_query_hints to confirm that the hint is stored and has no failure reason.", fr: "Interroger sys.query_store_query_hints pour vérifier que l'indicateur est enregistré et n'a pas de motif d'échec." } }
    - { id: enable, text: { en: "Run ALTER DATABASE PolicyDB SET QUERY_STORE = ON.", fr: "Exécuter ALTER DATABASE PolicyDB SET QUERY_STORE = ON." } }
    - { id: dsc, text: { en: "Run ALTER DATABASE SCOPED CONFIGURATION SET LEGACY_CARDINALITY_ESTIMATION = ON.", fr: "Exécuter ALTER DATABASE SCOPED CONFIGURATION SET LEGACY_CARDINALITY_ESTIMATION = ON." } }
    - { id: compat, text: { en: "Run ALTER DATABASE PolicyDB SET COMPATIBILITY_LEVEL = 150.", fr: "Exécuter ALTER DATABASE PolicyDB SET COMPATIBILITY_LEVEL = 150." } }
answer:
  sequence: [ find, sethint, verify ]
explanation:
  correct:
    en: |
      Query Store hints change how one query is compiled without changing the application code. You first find the query_id in the Query Store catalog views, then attach the `FORCE_LEGACY_CARDINALITY_ESTIMATION` hint to that query only with `sys.sp_query_store_set_hints`, and finally check `sys.query_store_query_hints`, which shows the hint text and the reason of any failure to apply it.
    fr: |
      Les indicateurs du Magasin des requêtes modifient la compilation d'une requête sans modifier le code de l'application. Vous trouvez d'abord le query_id dans les vues de catalogue du Magasin des requêtes, puis vous associez l'indicateur `FORCE_LEGACY_CARDINALITY_ESTIMATION` à cette seule requête avec `sys.sp_query_store_set_hints`, et vous vérifiez enfin `sys.query_store_query_hints`, qui affiche le texte de l'indicateur et le motif d'un éventuel échec d'application.
  options:
    enable: { en: "Query Store is enabled by default in Azure SQL Database, and PolicyDB keeps the default settings.", fr: "Le Magasin des requêtes est activé par défaut dans Azure SQL Database, et PolicyDB conserve les paramètres par défaut." }
    dsc: { en: "This database scoped configuration makes every query of PolicyDB use the legacy cardinality estimator, not only this statement.", fr: "Cette configuration délimitée à la base de données fait utiliser l'estimateur de cardinalité hérité par toutes les requêtes de PolicyDB, pas seulement par cette instruction." }
    compat: { en: "Lowering the compatibility level affects every query of the database and removes the benefits of level 160.", fr: "Abaisser le niveau de compatibilité affecte toutes les requêtes de la base de données et supprime les avantages du niveau 160." }
references:
  - title: Query Store hints
    url: https://learn.microsoft.com/en-us/sql/relational-databases/performance/query-store-hints
