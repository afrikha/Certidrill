id: dp300-3b-ii-log-analytics
objective: "3.2.8"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have an Azure SQL database named **TradeDB** on a logical server in the East US 2 region.

    You need to use Intelligent Insights to detect performance degradation in TradeDB. The administrators must be able to query the detected issues by using Kusto Query Language (KQL) and create log alerts on them.

    What should you configure?
  fr: |
    Vous disposez d'une base de données Azure SQL nommée **TradeDB** sur un serveur logique de la région East US 2.

    Vous devez utiliser Intelligent Insights pour détecter les dégradations de performances de TradeDB. Les administrateurs doivent pouvoir interroger les problèmes détectés en langage KQL (Kusto Query Language) et créer des alertes de journal sur ces problèmes.

    Que devez-vous configurer ?
body:
  options:
    - { id: a, text: { en: "A diagnostic setting on TradeDB that sends the SQLInsights category to a Log Analytics workspace", fr: "Un paramètre de diagnostic sur TradeDB qui envoie la catégorie SQLInsights vers un espace de travail Log Analytics" } }
    - { id: b, text: { en: "A diagnostic setting on TradeDB that sends the SQLInsights category to an Azure Storage account", fr: "Un paramètre de diagnostic sur TradeDB qui envoie la catégorie SQLInsights vers un compte Stockage Azure" } }
    - { id: c, text: { en: "Automatic tuning on TradeDB with the FORCE_LAST_GOOD_PLAN option set to ON", fr: "Le réglage automatique sur TradeDB avec l'option FORCE_LAST_GOOD_PLAN définie sur ON" } }
    - { id: d, text: { en: "Query Store on TradeDB in READ_WRITE operation mode", fr: "Le Magasin des requêtes sur TradeDB en mode de fonctionnement READ_WRITE" } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Intelligent Insights writes each detected issue, with its root cause analysis, to the SQLInsights resource log. You enable this log on the database's Diagnostic settings page and choose a destination; a Log Analytics workspace is the destination that supports KQL queries and log alerts.
    fr: |
      Intelligent Insights écrit chaque problème détecté, avec son analyse de la cause racine, dans le journal de ressources SQLInsights. Vous activez ce journal dans la page Paramètres de diagnostic de la base et choisissez une destination ; un espace de travail Log Analytics est la destination qui prend en charge les requêtes KQL et les alertes de journal.
  options:
    b: { en: "A storage account suits archiving and custom reporting, but you can't run KQL queries or log alerts on it.", fr: "Un compte de stockage convient à l'archivage et aux rapports personnalisés, mais il ne permet ni requêtes KQL ni alertes de journal." }
    c: { en: "Automatic tuning corrects plan regressions automatically; it doesn't send Intelligent Insights results anywhere.", fr: "Le réglage automatique corrige automatiquement les régressions de plan ; il n'envoie les résultats d'Intelligent Insights nulle part." }
    d: { en: "Query Store keeps query history in the database; it doesn't export the SQLInsights log for KQL queries.", fr: "Le Magasin des requêtes conserve l'historique des requêtes dans la base ; il n'exporte pas le journal SQLInsights pour des requêtes KQL." }
references:
  - title: Intelligent Insights to monitor and troubleshoot database performance (preview)
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/intelligent-insights-overview
