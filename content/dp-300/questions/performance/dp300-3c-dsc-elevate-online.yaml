id: dp300-3c-dsc-elevate-online
objective: "3.3.7"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have an Azure SQL database named InventoryDB. Deployment scripts run `CREATE INDEX` and `ALTER INDEX ... REBUILD` statements without the `ONLINE` option, which blocks users during deployments. You can't modify the scripts.

    You need index operations that support online execution to run online by default. Operations that can't run online must still complete instead of failing.

    Which statement should you run in InventoryDB?
  fr: |
    Vous disposez d'une base de données Azure SQL nommée InventoryDB. Des scripts de déploiement exécutent des instructions `CREATE INDEX` et `ALTER INDEX ... REBUILD` sans l'option `ONLINE`, ce qui bloque les utilisateurs pendant les déploiements. Vous ne pouvez pas modifier les scripts.

    Les opérations d'index qui prennent en charge l'exécution en ligne doivent s'exécuter en ligne par défaut. Les opérations qui ne peuvent pas s'exécuter en ligne doivent quand même se terminer au lieu d'échouer.

    Quelle instruction devez-vous exécuter dans InventoryDB ?
body:
  options:
    - { id: a, text: "ALTER DATABASE SCOPED CONFIGURATION SET ELEVATE_ONLINE = WHEN_SUPPORTED;" }
    - { id: b, text: "ALTER DATABASE SCOPED CONFIGURATION SET ELEVATE_ONLINE = FAIL_UNSUPPORTED;" }
    - { id: c, text: "ALTER DATABASE SCOPED CONFIGURATION SET PAUSED_RESUMABLE_INDEX_ABORT_DURATION_MINUTES = 0;" }
    - { id: d, text: "ALTER DATABASE CURRENT SET ALLOW_SNAPSHOT_ISOLATION ON;" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      `ELEVATE_ONLINE = WHEN_SUPPORTED` makes the engine run supported DDL operations online even when the statement doesn't specify `ONLINE`, and runs unsupported operations offline. The option applies only to statements that support `WITH (ONLINE = ...)`.
    fr: |
      `ELEVATE_ONLINE = WHEN_SUPPORTED` fait exécuter en ligne par le moteur les opérations DDL prises en charge, même quand l'instruction ne précise pas `ONLINE`, et exécute hors connexion les opérations non prises en charge. L'option ne s'applique qu'aux instructions qui prennent en charge `WITH (ONLINE = ...)`.
  options:
    b: { en: "FAIL_UNSUPPORTED makes operations that can't run online fail with an error, which violates the second requirement.", fr: "FAIL_UNSUPPORTED fait échouer avec une erreur les opérations qui ne peuvent pas s'exécuter en ligne, ce qui enfreint la seconde exigence." }
    c: { en: "This option controls how long a paused resumable index operation waits before it's aborted; it doesn't make operations online.", fr: "Cette option contrôle la durée d'attente d'une opération d'index pouvant être reprise mise en pause avant son abandon ; elle ne rend pas les opérations en ligne." }
    d: { en: "Snapshot isolation lets readers use row versions, but an offline index build still takes locks that block users.", fr: "L'isolement de capture instantanée permet aux lecteurs d'utiliser des versions de lignes, mais une création d'index hors connexion prend toujours des verrous qui bloquent les utilisateurs." }
references:
  - title: ALTER DATABASE SCOPED CONFIGURATION (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/statements/alter-database-scoped-configuration-transact-sql
