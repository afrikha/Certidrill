id: dp300-3a-qs-enable-options
objective: "3.2.1"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    You have a SQL Server 2019 instance on an Azure virtual machine. Query Store is disabled on a database named **Inventory**.

    You need to enable Query Store on Inventory. The solution must meet the following requirements:

    - Capture new queries and their runtime statistics.
    - Ignore infrequent queries and queries with insignificant compile and execution cost, by using the default thresholds of the engine.
    - Aggregate the runtime statistics in 15-minute intervals.

    How should you complete the Transact-SQL statement? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'une instance SQL Server 2019 sur une machine virtuelle Azure. Le Magasin des requêtes est désactivé sur une base de données nommée **Inventory**.

    Vous devez activer le Magasin des requêtes sur Inventory. La solution doit satisfaire les exigences suivantes :

    - Capturer les nouvelles requêtes et leurs statistiques d'exécution.
    - Ignorer les requêtes peu fréquentes et celles dont le coût de compilation et d'exécution est négligeable, en utilisant les seuils par défaut du moteur.
    - Agréger les statistiques d'exécution par intervalles de 15 minutes.

    Comment devez-vous compléter l'instruction Transact-SQL ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: sql
  template: |
    ALTER DATABASE Inventory
    SET QUERY_STORE = ON (
        OPERATION_MODE = [[mode]],
        QUERY_CAPTURE_MODE = [[capture]],
        INTERVAL_LENGTH_MINUTES = [[interval]]
    );
  slots:
    - id: mode
      options:
        - { id: rw, text: READ_WRITE }
        - { id: ro, text: READ_ONLY }
        - { id: rcs, text: READ_CAPTURE_SECONDARY }
    - id: capture
      options:
        - { id: auto, text: AUTO }
        - { id: all, text: ALL }
        - { id: none, text: NONE }
        - { id: custom, text: CUSTOM }
    - id: interval
      options:
        - { id: i15, text: "15" }
        - { id: i900, text: "900" }
        - { id: i20, text: "20" }
answer:
  values: { mode: rw, capture: auto, interval: i15 }
explanation:
  correct:
    en: |
      READ_WRITE is the mode that captures new queries and statistics. QUERY_CAPTURE_MODE = AUTO skips infrequent and cheap queries by using thresholds managed by the engine; CUSTOM is needed only to set your own thresholds. INTERVAL_LENGTH_MINUTES is expressed in minutes and accepts only 1, 5, 10, 15, 30, 60 or 1440.
    fr: |
      READ_WRITE est le mode qui capture les nouvelles requêtes et statistiques. QUERY_CAPTURE_MODE = AUTO ignore les requêtes peu fréquentes et peu coûteuses grâce à des seuils gérés par le moteur ; CUSTOM ne sert qu'à définir vos propres seuils. INTERVAL_LENGTH_MINUTES s'exprime en minutes et n'accepte que 1, 5, 10, 15, 30, 60 ou 1440.
  options:
    ro: { en: "READ_ONLY keeps existing data readable but captures nothing new.", fr: "READ_ONLY garde les données existantes lisibles mais ne capture rien de nouveau." }
    rcs: { en: "READ_CAPTURE_SECONDARY relates to Query Store for secondary replicas, not to the capture of a primary database.", fr: "READ_CAPTURE_SECONDARY concerne le Magasin des requêtes pour les réplicas secondaires, pas la capture d'une base primaire." }
    all: { en: "ALL captures every query, including infrequent and cheap ones.", fr: "ALL capture toutes les requêtes, y compris les requêtes peu fréquentes et peu coûteuses." }
    none: { en: "NONE stops capturing new queries.", fr: "NONE arrête la capture des nouvelles requêtes." }
    custom: { en: "CUSTOM uses a QUERY_CAPTURE_POLICY that you define, not the engine defaults.", fr: "CUSTOM utilise une QUERY_CAPTURE_POLICY que vous définissez, pas les seuils par défaut du moteur." }
    i900: { en: "900 would be read as 900 minutes, which isn't an allowed value; 900 seconds is the default DATA_FLUSH_INTERVAL_SECONDS.", fr: "900 serait lu comme 900 minutes, valeur non autorisée ; 900 secondes est la valeur par défaut de DATA_FLUSH_INTERVAL_SECONDS." }
    i20: { en: "20 isn't an allowed interval length, and it doesn't match the requirement.", fr: "20 n'est pas une longueur d'intervalle autorisée, et il ne correspond pas à l'exigence." }
references:
  - title: ALTER DATABASE SET options (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/statements/alter-database-transact-sql-set-options
  - title: sys.database_query_store_options (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/relational-databases/system-catalog-views/sys-database-query-store-options-transact-sql
