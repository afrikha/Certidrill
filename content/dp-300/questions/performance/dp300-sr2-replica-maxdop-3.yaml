id: dp300-sr2-replica-maxdop-3
objective: "3.3.7"
type: series_yesno
series: dp300-sr2-replica-maxdop
seriesOrder: 3
difficulty: 2
status: draft
stem:
  en: |
    You change the max degree of parallelism server option.
  fr: |
    Vous modifiez l'option de serveur max degree of parallelism.
body:
  solution:
    en: |
      You connect to the master database of the logical server and run `EXEC sp_configure 'max degree of parallelism', 2; RECONFIGURE;`.
    fr: |
      Vous vous connectez à la base master du serveur logique et exécutez `EXEC sp_configure 'max degree of parallelism', 2; RECONFIGURE;`.
answer: { value: false }
explanation:
  correct:
    en: |
      `sp_configure` applies to SQL Server and Azure SQL Managed Instance, not to Azure SQL Database, where instance-level options such as MAXDOP are set per database with `ALTER DATABASE SCOPED CONFIGURATION`. Even on an instance, a server option would not target only the read-only replica.
    fr: |
      `sp_configure` s'applique à SQL Server et à Azure SQL Managed Instance, pas à Azure SQL Database, où les options de niveau instance comme MAXDOP se définissent par base avec `ALTER DATABASE SCOPED CONFIGURATION`. Même sur une instance, une option de serveur ne viserait pas uniquement le réplica en lecture seule.
references:
  - title: "sp_configure (Transact-SQL)"
    url: https://learn.microsoft.com/en-us/sql/relational-databases/system-stored-procedures/sp-configure-transact-sql
  - title: "Configure the max degree of parallelism (MAXDOP) in Azure SQL Database and SQL database in Fabric"
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/configure-max-degree-of-parallelism
