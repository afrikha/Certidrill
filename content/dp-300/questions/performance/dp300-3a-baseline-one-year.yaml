id: dp300-3a-baseline-one-year
objective: "3.1.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    You have an Azure SQL database named **DB1** that uses the vCore purchasing model. Month-end processing causes peaks of CPU and log write activity.

    You need to keep the CPU percentage and Log IO percentage metrics of DB1 for 13 months so that you can compare each month-end with the same month of the previous year. The solution must minimize administrative effort.

    What should you do?
  fr: |
    Vous disposez d'une base de données Azure SQL nommée **DB1** qui utilise le modèle d'achat vCore. Le traitement de fin de mois provoque des pics d'activité processeur et d'écriture dans le journal.

    Vous devez conserver les métriques CPU percentage et Log IO percentage de DB1 pendant 13 mois afin de comparer chaque fin de mois au même mois de l'année précédente. La solution doit réduire au minimum l'effort d'administration.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Open Metrics Explorer for DB1 and select a time range of 13 months.", fr: "Ouvrir Metrics Explorer pour DB1 et sélectionner une plage de temps de 13 mois." } }
    - { id: b, text: { en: "Schedule a monthly export of sys.resource_stats from the master database.", fr: "Planifier un export mensuel de sys.resource_stats depuis la base de données master." } }
    - { id: c, text: { en: "Send the Basic metrics of DB1 to a Log Analytics workspace that has a 13-month retention.", fr: "Envoyer les métriques Basic de DB1 vers un espace de travail Log Analytics dont la rétention est de 13 mois." } }
    - { id: d, text: { en: "Set STALE_QUERY_THRESHOLD_DAYS to 400 in the Query Store options of DB1.", fr: "Définir STALE_QUERY_THRESHOLD_DAYS sur 400 dans les options du Magasin des requêtes de DB1." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Platform metrics are kept for 93 days, which is too short for a year-over-year baseline. A diagnostic setting that streams the Basic metric category to a Log Analytics workspace stores the metrics for as long as the workspace retention allows, and you can query them with KQL without maintaining any job.
    fr: |
      Les métriques de plateforme sont conservées 93 jours, ce qui est trop court pour une base de référence d'une année sur l'autre. Un paramètre de diagnostic qui envoie la catégorie de métriques Basic vers un espace de travail Log Analytics conserve les métriques aussi longtemps que la rétention de l'espace de travail le permet, et vous les interrogez en KQL sans maintenir de travail planifié.
  options:
    a: { en: "Platform metrics are retained for 93 days, and a single Metrics Explorer chart covers at most 30 days.", fr: "Les métriques de plateforme sont conservées 93 jours, et un graphique de Metrics Explorer couvre au plus 30 jours." }
    b: { en: "A scheduled export could work, but it is a custom job to build and maintain, which does not minimize administrative effort.", fr: "Un export planifié pourrait fonctionner, mais c'est un travail personnalisé à créer et à maintenir, ce qui ne réduit pas l'effort d'administration." }
    d: { en: "Query Store keeps per-query statistics, not the CPU percentage and Log IO percentage metrics of the database.", fr: "Le Magasin des requêtes conserve des statistiques par requête, pas les métriques CPU percentage et Log IO percentage de la base de données." }
references:
  - title: Azure Monitor Metrics overview
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/metrics/data-platform-metrics
  - title: Configure streaming export of Azure SQL Database and SQL Managed Instance diagnostic telemetry
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/metrics-diagnostic-telemetry-logging-streaming-export-configure
