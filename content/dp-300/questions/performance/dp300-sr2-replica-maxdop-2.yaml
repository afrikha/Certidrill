id: dp300-sr2-replica-maxdop-2
objective: "3.3.7"
type: series_yesno
series: dp300-sr2-replica-maxdop
seriesOrder: 2
difficulty: 1
status: draft
stem:
  en: |
    You set the database scoped MAXDOP to 2.
  fr: |
    Vous définissez le MAXDOP à l'échelle de la base de données à 2.
body:
  solution:
    en: |
      You connect to SalesDb on the primary replica and run `ALTER DATABASE SCOPED CONFIGURATION SET MAXDOP = 2;`.
    fr: |
      Vous vous connectez à SalesDb sur le réplica principal et exécutez `ALTER DATABASE SCOPED CONFIGURATION SET MAXDOP = 2;`.
answer: { value: false }
explanation:
  correct:
    en: |
      Without `FOR SECONDARY`, the statement changes the value of the primary replica, so the order-processing queries would drop to a MAXDOP of 2. The requirement to keep 8 on the primary is not met.
    fr: |
      Sans `FOR SECONDARY`, l'instruction modifie la valeur du réplica principal : les requêtes de traitement des commandes passeraient à un MAXDOP de 2. L'exigence de conserver 8 sur le principal n'est pas respectée.
references:
  - title: "Configure the max degree of parallelism (MAXDOP) in Azure SQL Database and SQL database in Fabric"
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/configure-max-degree-of-parallelism
