id: dp300-3b-index-missing-create
objective: "3.2.5"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    You have an Azure SQL database named **LogisticsDB**. The table **dbo.Shipments** has a clustered primary key on **ShipmentID**.

    The missing index DMVs return the following suggestion for a frequent query on dbo.Shipments:

    | Column | Value |
    | --- | --- |
    | equality_columns | [Status] |
    | inequality_columns | [ShipDate] |
    | included_columns | [CarrierID], [Weight] |

    You need to create an index that implements the suggestion and covers the query. The table must remain available during the operation.

    How should you complete the Transact-SQL statement? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'une base de données Azure SQL nommée **LogisticsDB**. La table **dbo.Shipments** a une clé primaire cluster sur **ShipmentID**.

    Les DMV d'index manquants renvoient la suggestion suivante pour une requête fréquente sur dbo.Shipments :

    | Colonne | Valeur |
    | --- | --- |
    | equality_columns | [Status] |
    | inequality_columns | [ShipDate] |
    | included_columns | [CarrierID], [Weight] |

    Vous devez créer un index qui implémente la suggestion et couvre la requête. La table doit rester disponible pendant l'opération.

    Comment devez-vous compléter l'instruction Transact-SQL ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: sql
  template: |
    CREATE [[kind]] INDEX IX_Shipments_Status_ShipDate
    ON dbo.Shipments ([[key]])
    INCLUDE ([[incl]])
    WITH (ONLINE = ON);
  slots:
    - id: kind
      options:
        - { id: nc, text: NONCLUSTERED }
        - { id: cl, text: CLUSTERED }
        - { id: ncci, text: NONCLUSTERED COLUMNSTORE }
    - id: key
      options:
        - { id: sd, text: "Status, ShipDate" }
        - { id: ds, text: "ShipDate, Status" }
        - { id: s, text: "Status" }
        - { id: cw, text: "CarrierID, Weight" }
    - id: incl
      options:
        - { id: cw, text: "CarrierID, Weight" }
        - { id: c, text: "CarrierID" }
        - { id: w, text: "Weight" }
answer:
  values: { kind: nc, key: sd, incl: cw }
explanation:
  correct:
    en: |
      Missing index suggestions are always nonclustered rowstore indexes. Equality columns go first in the key, followed by the inequality columns, and the included columns go in `INCLUDE`, where their order doesn't matter. With both included columns, the index covers the query; `ONLINE = ON` keeps the table available while the index is built.
    fr: |
      Les suggestions d'index manquants sont toujours des index rowstore non cluster. Les colonnes d'égalité viennent en premier dans la clé, suivies des colonnes d'inégalité, et les colonnes incluses vont dans `INCLUDE`, où leur ordre est sans effet. Avec les deux colonnes incluses, l'index couvre la requête ; `ONLINE = ON` laisse la table disponible pendant la création de l'index.
  options:
    cl: { en: "The table already has a clustered index (the primary key), and a table can have only one; `INCLUDE` is also not allowed on a clustered index.", fr: "La table a déjà un index cluster (la clé primaire) et une table ne peut en avoir qu'un ; `INCLUDE` n'est d'ailleurs pas autorisé sur un index cluster." }
    ncci: { en: "A columnstore index has no key columns or INCLUDE clause, and the suggestion is for a rowstore index that supports a seek.", fr: "Un index columnstore n'a ni colonnes clés ni clause INCLUDE, et la suggestion porte sur un index rowstore qui permet une recherche (seek)." }
    ds: { en: "Putting the inequality column first lets the index seek on the ShipDate range only; equality columns should come before inequality columns.", fr: "Placer la colonne d'inégalité en premier ne permet la recherche que sur la plage de ShipDate ; les colonnes d'égalité doivent précéder les colonnes d'inégalité." }
    s: { en: "Without ShipDate in the key, the range predicate can't be resolved by the seek.", fr: "Sans ShipDate dans la clé, le prédicat de plage ne peut pas être résolu par la recherche (seek)." }
references:
  - title: Tune nonclustered indexes with missing index suggestions
    url: https://learn.microsoft.com/en-us/sql/relational-databases/indexes/tune-nonclustered-missing-index-suggestions
  - title: Create indexes with included columns
    url: https://learn.microsoft.com/en-us/sql/relational-databases/indexes/create-indexes-with-included-columns
