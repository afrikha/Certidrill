id: dp300-3a-qsm-report-matching
objective: "3.2.2"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    You have an Azure SQL database named **DB1**. Query Store is enabled with the default settings, and you use SQL Server Management Studio (SSMS) to review it.

    You need to choose the built-in Query Store report that answers each question.

    Which report should you use for each question? To answer, drag the appropriate reports to the correct questions. Each report may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'une base de données Azure SQL nommée **DB1**. Le Magasin des requêtes est activé avec les paramètres par défaut, et vous utilisez SQL Server Management Studio (SSMS) pour l'examiner.

    Vous devez choisir le rapport intégré du Magasin des requêtes qui répond à chaque question.

    Quel rapport devez-vous utiliser pour chaque question ? Pour répondre, faites glisser les rapports appropriés vers les questions correspondantes. Chaque rapport peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: regressed, text: Regressed Queries }
    - { id: top, text: Top Resource Consuming Queries }
    - { id: forced, text: Queries With Forced Plans }
    - { id: variation, text: Queries With High Variation }
    - { id: waits, text: Query Wait Statistics }
    - { id: overall, text: Overall Resource Consumption }
  targets:
    - id: t1
      text: { en: "Which plans are currently forced in DB1?", fr: "Quels plans sont actuellement forcés dans DB1 ?" }
    - id: t2
      text: { en: "Which queries have a duration that changes a lot from one execution to another?", fr: "Quelles requêtes ont une durée qui varie fortement d'une exécution à l'autre ?" }
    - id: t3
      text: { en: "In which wait categories did the queries of DB1 spend the most time?", fr: "Dans quelles catégories d'attente les requêtes de DB1 ont-elles passé le plus de temps ?" }
answer:
  mapping: { t1: forced, t2: variation, t3: waits }
explanation:
  correct:
    en: |
      Queries With Forced Plans lists every forced plan. Queries With High Variation shows queries with unstable performance, often a sign of parameter sensitivity. Query Wait Statistics charts the top wait categories (for example Memory, Lock, Buffer IO or CPU) and lets you drill down to the queries that contributed to each one.
    fr: |
      Queries With Forced Plans liste tous les plans forcés. Queries With High Variation affiche les requêtes dont les performances sont instables, souvent signe de sensibilité aux paramètres. Query Wait Statistics présente les principales catégories d'attente (par exemple Memory, Lock, Buffer IO ou CPU) et permet d'afficher les requêtes qui ont contribué à chacune.
  options:
    regressed: { en: "Regressed Queries compares a recent period with the history; it doesn't measure variation between executions.", fr: "Regressed Queries compare une période récente à l'historique ; il ne mesure pas la variation entre exécutions." }
    top: { en: "Top Resource Consuming Queries ranks queries by total or average consumption of a metric, not by variation or wait category.", fr: "Top Resource Consuming Queries classe les requêtes selon la consommation totale ou moyenne d'une métrique, pas selon la variation ou la catégorie d'attente." }
references:
  - title: Monitor performance by using the Query Store
    url: https://learn.microsoft.com/en-us/sql/relational-databases/performance/monitoring-performance-by-using-the-query-store
