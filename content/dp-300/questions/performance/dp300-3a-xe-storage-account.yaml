id: dp300-3a-xe-storage-account
objective: "3.1.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have an Azure SQL database named **DB1** in the West Europe region. DB1 is locally redundant. You plan to create an event session on DB1 that uses an event_file target.

    You have the following storage accounts:

    | Name | Region | Default access tier | Hierarchical namespace |
    | --- | --- | --- | --- |
    | stxe1 | West Europe | Hot | Enabled |
    | stxe2 | North Europe | Hot | Disabled |
    | stxe3 | West Europe | Cool | Disabled |
    | stxe4 | West Europe | Hot | Disabled |

    You need to choose the storage account for the event files. The solution must follow Microsoft recommendations.

    Which storage account should you use?
  fr: |
    Vous disposez d'une base de données Azure SQL nommée **DB1** dans la région West Europe. DB1 est localement redondante. Vous prévoyez de créer sur DB1 une session d'événements qui utilise une cible event_file.

    Vous disposez des comptes de stockage suivants :

    | Nom | Région | Niveau d'accès par défaut | Espace de noms hiérarchique |
    | --- | --- | --- | --- |
    | stxe1 | West Europe | Hot | Activé |
    | stxe2 | North Europe | Hot | Désactivé |
    | stxe3 | West Europe | Cool | Désactivé |
    | stxe4 | West Europe | Hot | Désactivé |

    Vous devez choisir le compte de stockage des fichiers d'événements. La solution doit respecter les recommandations de Microsoft.

    Quel compte de stockage devez-vous utiliser ?
body:
  shuffle: false
  options:
    - { id: a, text: stxe1 }
    - { id: b, text: stxe2 }
    - { id: c, text: stxe3 }
    - { id: d, text: stxe4 }
answer: { optionId: d }
explanation:
  correct:
    en: |
      For an event_file target, Microsoft recommends a storage account in the same region as the database, blobs in the Hot access tier, and no hierarchical namespace. stxe4 is the only account that meets the three recommendations.
    fr: |
      Pour une cible event_file, Microsoft recommande un compte de stockage dans la même région que la base de données, des blobs dans le niveau chaud (Hot) et aucun espace de noms hiérarchique. stxe4 est le seul compte qui respecte les trois recommandations.
  options:
    a: { en: "The hierarchical namespace must not be enabled on the storage account.", fr: "L'espace de noms hiérarchique ne doit pas être activé sur le compte de stockage." }
    b: { en: "The storage account should be in the same region as DB1.", fr: "Le compte de stockage doit se trouver dans la même région que DB1." }
    c: { en: "Only the Hot access tier is recommended for event files.", fr: "Seul le niveau chaud (Hot) est recommandé pour les fichiers d'événements." }
references:
  - title: Extended Events in Azure SQL
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/xevent-db-diff-from-svr
