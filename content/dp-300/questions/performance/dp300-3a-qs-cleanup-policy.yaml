id: dp300-3a-qs-cleanup-policy
objective: "3.2.1"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    You have a SQL Server 2022 instance on an Azure virtual machine. Query Store on a database named **Billing** regularly reaches its maximum size and switches to READ_ONLY.

    You need to configure Query Store to meet the following requirements:

    - Data older than 14 days is removed automatically.
    - When Query Store approaches its maximum size, the oldest and least expensive queries are removed automatically.

    Which two options should you set? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'une instance SQL Server 2022 sur une machine virtuelle Azure. Le Magasin des requêtes d'une base de données nommée **Billing** atteint régulièrement sa taille maximale et passe en READ_ONLY.

    Vous devez configurer le Magasin des requêtes pour satisfaire les exigences suivantes :

    - Les données de plus de 14 jours sont supprimées automatiquement.
    - Lorsque le Magasin des requêtes approche de sa taille maximale, les requêtes les plus anciennes et les moins coûteuses sont supprimées automatiquement.

    Quelles sont les deux options à définir ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: "SIZE_BASED_CLEANUP_MODE = AUTO" }
    - { id: b, text: "CLEANUP_POLICY = (STALE_QUERY_THRESHOLD_DAYS = 14)" }
    - { id: c, text: "DATA_FLUSH_INTERVAL_SECONDS = 1209600" }
    - { id: d, text: "MAX_PLANS_PER_QUERY = 14" }
    - { id: e, text: "OPERATION_MODE = READ_ONLY" }
answer: { optionIds: [ a, b ] }
explanation:
  correct:
    en: |
      STALE_QUERY_THRESHOLD_DAYS is the age-based cleanup policy: data older than the threshold is removed. SIZE_BASED_CLEANUP_MODE = AUTO starts cleanup at 90 % of MAX_STORAGE_SIZE_MB and stops at about 80 %, removing the least expensive and oldest queries first.
    fr: |
      STALE_QUERY_THRESHOLD_DAYS est la stratégie de nettoyage fondée sur l'âge : les données plus anciennes que le seuil sont supprimées. SIZE_BASED_CLEANUP_MODE = AUTO lance le nettoyage à 90 % de MAX_STORAGE_SIZE_MB et l'arrête vers 80 %, en supprimant d'abord les requêtes les moins coûteuses et les plus anciennes.
  options:
    c: { en: "DATA_FLUSH_INTERVAL_SECONDS controls how often in-memory data is written to disk, not how long it is kept.", fr: "DATA_FLUSH_INTERVAL_SECONDS contrôle la fréquence d'écriture sur disque des données en mémoire, pas leur durée de conservation." }
    d: { en: "MAX_PLANS_PER_QUERY limits the number of plans kept per query; it removes no old data.", fr: "MAX_PLANS_PER_QUERY limite le nombre de plans conservés par requête ; il ne supprime aucune donnée ancienne." }
    e: { en: "READ_ONLY stops capture; it doesn't clean up anything.", fr: "READ_ONLY arrête la capture ; il ne nettoie rien." }
references:
  - title: sys.database_query_store_options (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/relational-databases/system-catalog-views/sys-database-query-store-options-transact-sql
