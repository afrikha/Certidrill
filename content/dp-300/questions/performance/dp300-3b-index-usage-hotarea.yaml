id: dp300-3b-index-usage-hotarea
objective: "3.2.5"
type: hotarea
difficulty: 2
status: draft
stem:
  en: |
    You have an Azure SQL managed instance named **MI1** that has been running for 45 days, including a full month-end processing cycle. A database on MI1 contains a table named **dbo.Invoices** that receives a high volume of inserts and updates.

    You query `sys.dm_db_index_usage_stats` for dbo.Invoices and obtain the results shown in the following table.

    Answer each prompt by selecting the appropriate index.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'une instance managée Azure SQL nommée **MI1** qui fonctionne depuis 45 jours, y compris un cycle complet de traitement de fin de mois. Une base de données de MI1 contient une table nommée **dbo.Invoices** qui reçoit un volume élevé d'insertions et de mises à jour.

    Vous interrogez `sys.dm_db_index_usage_stats` pour dbo.Invoices et obtenez les résultats du tableau suivant.

    Répondez à chaque consigne en sélectionnant l'index approprié.

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
    - id: p1
      text: { en: "The index to drop to reduce write overhead without affecting any query", fr: "L'index à supprimer pour réduire la charge des écritures sans affecter aucune requête" }
    - id: p2
      text: { en: "The index that queries access to retrieve columns that the nonclustered indexes don't cover", fr: "L'index auquel les requêtes accèdent pour récupérer les colonnes que les index non cluster ne couvrent pas" }
  grid:
    header: [{ en: "Index", fr: "Index" }, Type, user_seeks, user_scans, user_lookups, user_updates]
    rows:
      - [{ text: PK_Invoices, area: pk }, { text: CLUSTERED }, { text: "120500" }, { text: "42" }, { text: "86300" }, { text: "312000" }]
      - [{ text: IX_Invoices_CustomerID, area: cust }, { text: NONCLUSTERED }, { text: "54200" }, { text: "0" }, { text: "0" }, { text: "312000" }]
      - [{ text: IX_Invoices_Status, area: status }, { text: NONCLUSTERED }, { text: "0" }, { text: "0" }, { text: "0" }, { text: "298000" }]
      - [{ text: IX_Invoices_DueDate, area: due }, { text: NONCLUSTERED }, { text: "0" }, { text: "1250" }, { text: "0" }, { text: "305000" }]
answer:
  values: { p1: status, p2: pk }
explanation:
  correct:
    en: |
      IX_Invoices_Status has no seeks, scans or lookups over a period that covers a full business cycle, but it is maintained by every write, so dropping it reduces overhead without affecting reads. IX_Invoices_DueDate is still scanned by some queries. Lookups are always performed on the clustered index (here PK_Invoices) to fetch the columns that a nonclustered index doesn't contain.
    fr: |
      IX_Invoices_Status n'a ni recherche, ni analyse, ni recherche de clé sur une période qui couvre un cycle métier complet, mais il est mis à jour par chaque écriture ; le supprimer réduit la charge sans affecter les lectures. IX_Invoices_DueDate est encore analysé par certaines requêtes. Les recherches de clés (lookups) s'effectuent toujours sur l'index cluster (ici PK_Invoices) pour récupérer les colonnes qu'un index non cluster ne contient pas.
  options:
    due: { en: "1,250 scans show that some queries still use IX_Invoices_DueDate; dropping it could slow them down.", fr: "1 250 analyses montrent que certaines requêtes utilisent encore IX_Invoices_DueDate ; le supprimer pourrait les ralentir." }
    cust: { en: "IX_Invoices_CustomerID is used for 54,200 seeks; the lookups it causes are counted on the clustered index.", fr: "IX_Invoices_CustomerID est utilisé pour 54 200 recherches ; les recherches de clés qu'il provoque sont comptées sur l'index cluster." }
references:
  - title: sys.dm_db_index_usage_stats (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/relational-databases/system-dynamic-management-views/sys-dm-db-index-usage-stats-transact-sql
