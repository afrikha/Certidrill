id: dp300-3a-interpret-wait-types
objective: "3.1.3"
type: hotarea
difficulty: 2
status: draft
stem:
  en: |
    You have an Azure SQL managed instance named **MI1**. The following table shows the top waits returned by `sys.dm_os_wait_stats` on MI1 since the last restart.

    Answer each prompt by selecting the wait type in the table.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'une instance managée Azure SQL nommée **MI1**. Le tableau suivant présente les principales attentes renvoyées par `sys.dm_os_wait_stats` sur MI1 depuis le dernier redémarrage.

    Répondez à chaque consigne en sélectionnant le type d'attente dans le tableau.

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
    - id: p1
      text: { en: "The wait type that shows queries waiting for a memory grant before they can start", fr: "Le type d'attente qui indique des requêtes attendant une allocation de mémoire avant de pouvoir démarrer" }
    - id: p2
      text: { en: "The wait type that shows queries waiting for data pages to be read from the data files", fr: "Le type d'attente qui indique des requêtes attendant la lecture de pages de données depuis les fichiers de données" }
  grid:
    header: [{ en: "Wait type", fr: "Type d'attente" }, { en: "Wait time (ms)", fr: "Temps d'attente (ms)" }, { en: "Waiting tasks", fr: "Tâches en attente" }]
    rows:
      - [{ text: CXPACKET, area: cx }, { text: "9812440" }, { text: "1204551" }]
      - [{ text: PAGEIOLATCH_SH, area: pio }, { text: "7420318" }, { text: "3381904" }]
      - [{ text: RESOURCE_SEMAPHORE, area: rs }, { text: "5106277" }, { text: "18320" }]
      - [{ text: LCK_M_X, area: lck }, { text: "3958120" }, { text: "40211" }]
      - [{ text: SOS_SCHEDULER_YIELD, area: sos }, { text: "2210985" }, { text: "8734012" }]
      - [{ text: PAGELATCH_EX, area: pl }, { text: "905113" }, { text: "611087" }]
answer:
  values: { p1: rs, p2: pio }
explanation:
  correct:
    en: "`RESOURCE_SEMAPHORE` means that queries wait for a memory grant; Query Store maps it to the Memory category. `PAGEIOLATCH_*` waits mean that pages are read from the data files into the buffer pool (Buffer IO category). `PAGELATCH_*` waits concern pages already in memory, often `tempdb` contention, `LCK_M_*` waits are lock blocking, and `SOS_SCHEDULER_YIELD` points to CPU pressure."
    fr: "`RESOURCE_SEMAPHORE` signifie que des requêtes attendent une allocation de mémoire ; le Magasin des requêtes la classe dans la catégorie Memory. Les attentes `PAGEIOLATCH_*` signifient que des pages sont lues depuis les fichiers de données vers le pool de mémoires tampons (catégorie Buffer IO). Les attentes `PAGELATCH_*` concernent des pages déjà en mémoire, souvent une contention de `tempdb`, les attentes `LCK_M_*` correspondent à un blocage par verrous, et `SOS_SCHEDULER_YIELD` indique une pression sur le processeur."
references:
  - title: Monitor performance by using the Query Store
    url: https://learn.microsoft.com/en-us/sql/relational-databases/performance/monitoring-performance-by-using-the-query-store
  - title: Monitor Microsoft Azure SQL performance using dynamic management views
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/monitoring-with-dmvs
