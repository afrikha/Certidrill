id: dp300-3b-construct-psp
objective: "3.2.6"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    You have an Azure SQL database named **OrdersDB** that uses compatibility level 150. A stored procedure named **dbo.GetOrdersByStatus** runs the following query a few hundred times per hour:

    ```text
    SELECT OrderID, CustomerID, TotalDue
    FROM dbo.Orders
    WHERE Status = @Status;
    ```

    Two status values match millions of rows, and the other values match a few hundred rows. The duration of the procedure varies widely depending on which value was used when the plan was compiled. Statistics on dbo.Orders are up to date.

    You need to provide consistent performance for all the parameter values.

    Which two actions should you recommend? Each correct answer presents a complete solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'une base de données Azure SQL nommée **OrdersDB** qui utilise le niveau de compatibilité 150. Une procédure stockée nommée **dbo.GetOrdersByStatus** exécute la requête suivante quelques centaines de fois par heure :

    ```text
    SELECT OrderID, CustomerID, TotalDue
    FROM dbo.Orders
    WHERE Status = @Status;
    ```

    Deux valeurs de statut correspondent à des millions de lignes, et les autres valeurs à quelques centaines de lignes. La durée de la procédure varie fortement selon la valeur utilisée lors de la compilation du plan. Les statistiques de dbo.Orders sont à jour.

    Vous devez obtenir des performances régulières pour toutes les valeurs de paramètre.

    Quelles sont les deux actions à recommander ? Chaque bonne réponse constitue une solution complète.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Set the compatibility level of OrdersDB to 160.", fr: "Définir le niveau de compatibilité d'OrdersDB sur 160." } }
    - { id: b, text: { en: "Add `OPTION (RECOMPILE)` to the query in the procedure.", fr: "Ajouter `OPTION (RECOMPILE)` à la requête de la procédure." } }
    - { id: c, text: { en: "Turn on `AUTO_UPDATE_STATISTICS_ASYNC` for OrdersDB.", fr: "Activer `AUTO_UPDATE_STATISTICS_ASYNC` pour OrdersDB." } }
    - { id: d, text: { en: "Rebuild all the indexes of dbo.Orders.", fr: "Reconstruire tous les index de dbo.Orders." } }
    - { id: e, text: { en: "Set the `TSQL_SCALAR_UDF_INLINING` database scoped configuration to ON.", fr: "Définir la configuration étendue à la base de données `TSQL_SCALAR_UDF_INLINING` sur ON." } }
answer: { optionIds: [ a, b ] }
explanation:
  correct:
    en: |
      This is a parameter-sensitive plan problem. At compatibility level 160, Parameter Sensitive Plan optimization caches a dispatcher plan for queries with equality predicates on skewed data and compiles separate query variants for different ranges of row counts. `OPTION (RECOMPILE)` compiles a plan for the actual value at every execution; it costs compilation CPU, which is acceptable at a few hundred executions per hour.
    fr: |
      Il s'agit d'un problème de plan sensible aux paramètres. Au niveau de compatibilité 160, l'optimisation du plan sensible aux paramètres met en cache un plan répartiteur pour les requêtes avec des prédicats d'égalité sur des données asymétriques et compile des variantes de requête distinctes selon les plages de nombres de lignes. `OPTION (RECOMPILE)` compile un plan pour la valeur réelle à chaque exécution ; cela coûte du processeur de compilation, ce qui est acceptable à quelques centaines d'exécutions par heure.
  options:
    c: { en: "Asynchronous statistics updates change when statistics are refreshed; the statistics are already current and the cached plan would still fit only one kind of value.", fr: "Les mises à jour asynchrones changent le moment où les statistiques sont actualisées ; elles sont déjà à jour, et le plan en cache resterait adapté à un seul type de valeur." }
    d: { en: "Rebuilding indexes recompiles plans once, but the next compilation still produces a plan for a single parameter value.", fr: "Reconstruire les index recompile les plans une fois, mais la compilation suivante produit encore un plan pour une seule valeur de paramètre." }
    e: { en: "Scalar UDF inlining concerns scalar user-defined functions, which the query doesn't use.", fr: "L'incorporation des UDF scalaires concerne les fonctions scalaires définies par l'utilisateur, que la requête n'utilise pas." }
references:
  - title: Parameter Sensitive Plan optimization
    url: https://learn.microsoft.com/en-us/sql/relational-databases/performance/parameter-sensitive-plan-optimization
  - title: Detect query performance bottlenecks
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/identify-query-performance-issues
