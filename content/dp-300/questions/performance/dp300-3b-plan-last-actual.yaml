id: dp300-3b-plan-last-actual
objective: "3.2.7"
type: ordering
difficulty: 3
status: draft
stem:
  en: |
    You have an Azure SQL database named **ShopDB** that uses the default database scoped configuration. A query that the application runs with parameter values you don't know is sometimes slow.

    You need to review the last actual execution plan of this query, including the actual number of rows of each operator, as the application executed it. The solution must minimize the performance overhead on ShopDB.

    Which three actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Vous disposez d'une base de données Azure SQL nommée **ShopDB** qui utilise la configuration étendue à la base de données par défaut. Une requête que l'application exécute avec des valeurs de paramètres que vous ne connaissez pas est parfois lente.

    Vous devez examiner le dernier plan d'exécution réel de cette requête, y compris le nombre réel de lignes de chaque opérateur, tel que l'application l'a exécutée. La solution doit réduire au minimum l'impact sur les performances de ShopDB.

    Quelles sont les trois actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - { id: enable, text: { en: "Run `ALTER DATABASE SCOPED CONFIGURATION SET LAST_QUERY_PLAN_STATS = ON`.", fr: "Exécuter `ALTER DATABASE SCOPED CONFIGURATION SET LAST_QUERY_PLAN_STATS = ON`." } }
    - { id: wait, text: { en: "Wait until the application runs the query again.", fr: "Attendre que l'application exécute de nouveau la requête." } }
    - { id: stats, text: { en: "Query `sys.dm_exec_query_stats` with `CROSS APPLY sys.dm_exec_query_plan_stats(plan_handle)` and filter on the text of the query.", fr: "Interroger `sys.dm_exec_query_stats` avec `CROSS APPLY sys.dm_exec_query_plan_stats(plan_handle)` et filtrer sur le texte de la requête." } }
    - { id: free, text: { en: "Run `ALTER DATABASE SCOPED CONFIGURATION CLEAR PROCEDURE_CACHE`.", fr: "Exécuter `ALTER DATABASE SCOPED CONFIGURATION CLEAR PROCEDURE_CACHE`." } }
    - { id: showplan, text: { en: "Run `SET SHOWPLAN_XML ON` in your session.", fr: "Exécuter `SET SHOWPLAN_XML ON` dans votre session." } }
    - { id: xe, text: { en: "Create an Extended Events session that captures the `query_post_execution_showplan` event for all queries.", fr: "Créer une session Événements étendus qui capture l'événement `query_post_execution_showplan` pour toutes les requêtes." } }
answer:
  sequence: [ enable, wait, stats ]
explanation:
  correct:
    en: "`LAST_QUERY_PLAN_STATS` is off by default; once enabled, the engine keeps the last known actual plan of each cached plan by using lightweight profiling, which is on by default in Azure SQL Database. After the application runs the query again, you pass its plan handle from the plan cache DMVs to `sys.dm_exec_query_plan_stats`, which returns the plan with the actual row counts."
    fr: "`LAST_QUERY_PLAN_STATS` est désactivé par défaut ; une fois activé, le moteur conserve le dernier plan réel connu de chaque plan en cache grâce au profilage léger, activé par défaut dans Azure SQL Database. Après une nouvelle exécution de la requête par l'application, vous transmettez son descripteur de plan, issu des DMV du cache de plans, à `sys.dm_exec_query_plan_stats`, qui renvoie le plan avec les nombres réels de lignes."
  options:
    showplan: { en: "`SHOWPLAN_XML` returns estimated plans for the statements of your own session only, without executing them.", fr: "`SHOWPLAN_XML` renvoie les plans estimés des instructions de votre propre session uniquement, sans les exécuter." }
    free: { en: "Clearing the plan cache removes the cached plans and their statistics; it adds recompilations and doesn't capture any actual plan.", fr: "Vider le cache de plans supprime les plans en cache et leurs statistiques ; cela ajoute des recompilations et ne capture aucun plan réel." }
    xe: { en: "`query_post_execution_showplan` uses standard profiling for every query, which has a high overhead.", fr: "`query_post_execution_showplan` utilise le profilage standard pour chaque requête, ce qui a un coût élevé." }
references:
  - title: Query Profiling Infrastructure
    url: https://learn.microsoft.com/en-us/sql/relational-databases/performance/query-profiling-infrastructure
