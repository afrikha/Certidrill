id: dp300-3a-interpret-workers
objective: "3.1.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    You have an Azure SQL database named **DB1** in the General Purpose service tier with 8 vCores.

    Users report that new requests fail intermittently with an error stating that the worker limit of the database has been reached. During these periods, `sys.dm_db_resource_stats` shows the following values:

    | Column | Value |
    | --- | --- |
    | avg_cpu_percent | 18 |
    | avg_data_io_percent | 9 |
    | avg_log_write_percent | 6 |
    | max_worker_percent | 100 |

    `sys.dm_exec_requests` shows hundreds of requests with a `LCK_M_U` wait type and a non-zero `blocking_session_id`.

    You need to resolve the issue. The solution must minimize cost.

    What should you do first?
  fr: |
    Vous disposez d'une base de données Azure SQL nommée **DB1** dans le niveau de service General Purpose avec 8 vCores.

    Les utilisateurs signalent que de nouvelles requêtes échouent par intermittence avec une erreur indiquant que la limite de workers de la base de données est atteinte. Pendant ces périodes, `sys.dm_db_resource_stats` affiche les valeurs suivantes :

    | Colonne | Valeur |
    | --- | --- |
    | avg_cpu_percent | 18 |
    | avg_data_io_percent | 9 |
    | avg_log_write_percent | 6 |
    | max_worker_percent | 100 |

    `sys.dm_exec_requests` affiche des centaines de requêtes avec un type d'attente `LCK_M_U` et une valeur `blocking_session_id` non nulle.

    Vous devez résoudre le problème. La solution doit réduire les coûts au minimum.

    Que devez-vous faire en premier ?
body:
  options:
    - { id: a, text: { en: "Scale DB1 to 16 vCores to raise the worker limit.", fr: "Mettre DB1 à l'échelle vers 16 vCores pour relever la limite de workers." } }
    - { id: b, text: { en: "Identify the head blocker and shorten the transaction that holds the locks.", fr: "Identifier le bloqueur de tête et raccourcir la transaction qui détient les verrous." } }
    - { id: c, text: { en: "Move DB1 to the Business Critical service tier.", fr: "Déplacer DB1 vers le niveau de service Business Critical." } }
    - { id: d, text: { en: "Set MAXDOP to 1 for DB1 to reduce the number of workers per query.", fr: "Définir MAXDOP sur 1 pour DB1 afin de réduire le nombre de workers par requête." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      CPU, data I/O and log write are low while workers are at 100 %, and the requests wait on locks behind a blocking session. The requests pile up because they are blocked, and each one holds a worker. Removing the cause of the blocking frees the workers without any extra cost.
    fr: |
      Le processeur, les E/S de données et l'écriture dans le journal sont faibles alors que les workers sont à 100 %, et les requêtes attendent des verrous derrière une session bloquante. Les requêtes s'accumulent parce qu'elles sont bloquées, et chacune occupe un worker. Supprimer la cause du blocage libère les workers sans coût supplémentaire.
  options:
    a: { en: "A larger compute size raises the worker limit and the cost, but the blocked requests would keep piling up behind the same blocker.", fr: "Une taille de calcul supérieure relève la limite de workers et le coût, mais les requêtes bloquées continueraient de s'accumuler derrière le même bloqueur." }
    c: { en: "Business Critical costs more and doesn't remove lock blocking.", fr: "Business Critical coûte plus cher et ne supprime pas le blocage par verrous." }
    d: { en: "The requests wait on locks, not on parallelism; limiting MAXDOP doesn't release the blocked workers.", fr: "Les requêtes attendent des verrous, pas le parallélisme ; limiter MAXDOP ne libère pas les workers bloqués." }
references:
  - title: Monitor Microsoft Azure SQL performance using dynamic management views
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/monitoring-with-dmvs
  - title: sys.dm_db_resource_stats (Azure SQL Database)
    url: https://learn.microsoft.com/en-us/sql/relational-databases/system-dynamic-management-views/sys-dm-db-resource-stats-azure-sql-database
