id: dp300-3b-ixm-resumable
objective: "3.3.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have an Azure SQL database named **TelemetryDB**. The clustered index **PK_Readings** of the table **dbo.Readings** must be rebuilt. A full rebuild takes about five hours, and the nightly maintenance window lasts two hours.

    You need to rebuild PK_Readings. The solution must meet the following requirements:

    - The table must remain available to queries during the rebuild.
    - The rebuild must stop automatically at the end of each maintenance window and continue from where it stopped during the next window.

    Which statement should you run at the start of the first maintenance window?
  fr: |
    Vous disposez d'une base de données Azure SQL nommée **TelemetryDB**. L'index cluster **PK_Readings** de la table **dbo.Readings** doit être reconstruit. Une reconstruction complète dure environ cinq heures, et la fenêtre de maintenance nocturne dure deux heures.

    Vous devez reconstruire PK_Readings. La solution doit répondre aux exigences suivantes :

    - La table doit rester disponible pour les requêtes pendant la reconstruction.
    - La reconstruction doit s'arrêter automatiquement à la fin de chaque fenêtre de maintenance et reprendre là où elle s'est arrêtée pendant la fenêtre suivante.

    Quelle instruction devez-vous exécuter au début de la première fenêtre de maintenance ?
body:
  options:
    - { id: a, text: "ALTER INDEX PK_Readings ON dbo.Readings REBUILD WITH (ONLINE = ON, MAXDOP = 1);" }
    - { id: b, text: "ALTER INDEX PK_Readings ON dbo.Readings REBUILD WITH (ONLINE = OFF, RESUMABLE = ON, MAX_DURATION = 120 MINUTES);" }
    - { id: c, text: "ALTER INDEX PK_Readings ON dbo.Readings REBUILD WITH (ONLINE = ON, SORT_IN_TEMPDB = ON, RESUMABLE = ON);" }
    - { id: d, text: "ALTER INDEX PK_Readings ON dbo.Readings REBUILD WITH (ONLINE = ON, RESUMABLE = ON, MAX_DURATION = 120 MINUTES);" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      An online rebuild keeps the table available, and `RESUMABLE = ON` makes the rebuild resumable. `MAX_DURATION` (in minutes) pauses the operation automatically when the time is up, keeping the progress made; re-running the statement or `ALTER INDEX ... RESUME` continues it during the next window.
    fr: |
      Une reconstruction en ligne laisse la table disponible, et `RESUMABLE = ON` permet de suspendre puis de reprendre la reconstruction. `MAX_DURATION` (en minutes) met automatiquement l'opération en pause à la fin du délai, en conservant la progression ; réexécuter l'instruction ou `ALTER INDEX ... RESUME` la poursuit pendant la fenêtre suivante.
  options:
    a: { en: "This online rebuild can't be paused or resumed; if it is stopped at the end of the window, all its progress is lost.", fr: "Cette reconstruction en ligne ne peut être ni suspendue ni reprise ; si elle est arrêtée à la fin de la fenêtre, toute sa progression est perdue." }
    b: { en: "`RESUMABLE = ON` requires `ONLINE = ON`; an offline rebuild would also block access to the table.", fr: "`RESUMABLE = ON` exige `ONLINE = ON` ; une reconstruction hors connexion bloquerait en outre l'accès à la table." }
    c: { en: "`SORT_IN_TEMPDB = ON` isn't supported with resumable operations, and without `MAX_DURATION` the rebuild wouldn't stop at the end of the window.", fr: "`SORT_IN_TEMPDB = ON` n'est pas pris en charge avec les opérations pouvant être reprises, et sans `MAX_DURATION` la reconstruction ne s'arrêterait pas à la fin de la fenêtre." }
references:
  - title: ALTER INDEX (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/statements/alter-index-transact-sql
