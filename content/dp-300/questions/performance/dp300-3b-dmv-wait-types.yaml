id: dp300-3b-dmv-wait-types
objective: "3.2.4"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    You have an Azure SQL managed instance named **MI1**. You query `sys.dm_os_wait_stats` on MI1 and find four wait types among the top waits.

    You need to identify the most likely cause of each wait type.

    Which cause should you identify for each wait type? To answer, drag the appropriate causes to the correct wait types. Each cause may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'une instance managée Azure SQL nommée **MI1**. Vous interrogez `sys.dm_os_wait_stats` sur MI1 et trouvez quatre types d'attente parmi les attentes principales.

    Vous devez identifier la cause la plus probable de chaque type d'attente.

    Quelle cause devez-vous identifier pour chaque type d'attente ? Pour répondre, faites glisser les causes appropriées vers les types d'attente correspondants. Chaque cause peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: dataio, text: { en: "Reads of data pages from the data files", fr: "Lectures de pages de données à partir des fichiers de données" } }
    - { id: logio, text: { en: "Writes to the transaction log", fr: "Écritures dans le journal des transactions" } }
    - { id: grant, text: { en: "Queries waiting for a memory grant", fr: "Requêtes en attente d'une allocation de mémoire" } }
    - { id: lock, text: { en: "Sessions waiting for locks held by other sessions", fr: "Sessions en attente de verrous détenus par d'autres sessions" } }
    - { id: cpu, text: { en: "Threads yielding the scheduler because of CPU pressure", fr: "Threads qui cèdent le planificateur en raison d'une sollicitation du processeur" } }
  targets:
    - { id: pageio, text: PAGEIOLATCH_SH }
    - { id: writelog, text: WRITELOG }
    - { id: semaphore, text: RESOURCE_SEMAPHORE }
    - { id: lckx, text: LCK_M_X }
answer:
  mapping: { pageio: dataio, writelog: logio, semaphore: grant, lckx: lock }
explanation:
  correct:
    en: "`PAGEIOLATCH_*` waits mean that tasks wait for data pages to be read from storage (missing indexes, large scans or too little memory). `WRITELOG` waits are transaction log writes. `RESOURCE_SEMAPHORE` means that queries are queued for a memory grant (`sys.dm_exec_query_memory_grants` shows them). `LCK_M_*` waits are lock waits, that is, blocking."
    fr: "Les attentes `PAGEIOLATCH_*` signifient que des tâches attendent la lecture de pages de données depuis le stockage (index manquants, grandes analyses ou mémoire insuffisante). Les attentes `WRITELOG` correspondent aux écritures du journal des transactions. `RESOURCE_SEMAPHORE` signifie que des requêtes attendent une allocation de mémoire (`sys.dm_exec_query_memory_grants` les montre). Les attentes `LCK_M_*` sont des attentes de verrous, c'est-à-dire du blocage."
  options:
    cpu: { en: "CPU pressure shows as `SOS_SCHEDULER_YIELD` waits and a high CPU percentage, not as any of the four listed wait types.", fr: "La sollicitation du processeur se traduit par des attentes `SOS_SCHEDULER_YIELD` et un pourcentage de processeur élevé, et par aucun des quatre types d'attente listés." }
references:
  - title: Monitor performance using dynamic management views
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/monitoring-with-dmvs
  - title: Detect query performance bottlenecks
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/identify-query-performance-issues
