id: dp300-3a-baseline-resource-stats
objective: "3.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have an Azure SQL database named **DB1** on a logical server named **sql-contoso**. No diagnostic setting is configured for DB1.

    You need to use Transact-SQL to retrieve the average CPU and data I/O usage of DB1 for each 5-minute interval of the last 10 days.

    Which object should you query?
  fr: |
    Vous disposez d'une base de données Azure SQL nommée **DB1** sur un serveur logique nommé **sql-contoso**. Aucun paramètre de diagnostic n'est configuré pour DB1.

    Vous devez utiliser Transact-SQL pour récupérer l'utilisation moyenne du processeur et des E/S de données de DB1 pour chaque intervalle de 5 minutes des 10 derniers jours.

    Quel objet devez-vous interroger ?
body:
  options:
    - { id: a, text: { en: "sys.dm_db_resource_stats in DB1", fr: "sys.dm_db_resource_stats dans DB1" } }
    - { id: b, text: { en: "sys.resource_stats in the master database", fr: "sys.resource_stats dans la base de données master" } }
    - { id: c, text: { en: "sys.dm_os_performance_counters in DB1", fr: "sys.dm_os_performance_counters dans DB1" } }
    - { id: d, text: { en: "sys.dm_exec_query_stats in the master database", fr: "sys.dm_exec_query_stats dans la base de données master" } }
answer: { optionId: b }
explanation:
  correct:
    en: "`sys.resource_stats`, queried from the `master` database of the logical server, aggregates the resource usage of each database in 5-minute intervals and keeps about 14 days of history. It is the T-SQL source for a two-week baseline when nothing else is configured."
    fr: "`sys.resource_stats`, interrogée depuis la base de données `master` du serveur logique, agrège l'utilisation des ressources de chaque base par intervalles de 5 minutes et conserve environ 14 jours d'historique. C'est la source T-SQL d'une base de référence sur deux semaines quand rien d'autre n'est configuré."
  options:
    a: { en: "sys.dm_db_resource_stats has 15-second rows but keeps only about one hour of data.", fr: "sys.dm_db_resource_stats fournit des lignes toutes les 15 secondes mais ne conserve qu'environ une heure de données." }
    c: { en: "sys.dm_os_performance_counters returns cumulative engine counters, not a 10-day history of CPU and I/O percentages.", fr: "sys.dm_os_performance_counters renvoie des compteurs cumulés du moteur, pas un historique de 10 jours des pourcentages de processeur et d'E/S." }
    d: { en: "sys.dm_exec_query_stats returns statistics of cached query plans, not the resource usage of the database over time.", fr: "sys.dm_exec_query_stats renvoie les statistiques des plans de requête en cache, pas l'utilisation des ressources de la base dans le temps." }
references:
  - title: Monitor Microsoft Azure SQL performance using dynamic management views
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/monitoring-with-dmvs
