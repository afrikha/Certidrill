id: dp300-3c-scale-serverless
objective: "3.3.8"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have an Azure SQL database named TestDB that uses the vCore purchasing model. Testers use TestDB for a few hours at unpredictable times each week, and TestDB is idle the rest of the time. The testers accept a short delay on their first connection after a period of inactivity.

    You need to minimize the compute cost of TestDB.

    Which configuration should you use?
  fr: |
    Vous disposez d'une base de données Azure SQL nommée TestDB qui utilise le modèle d'achat vCore. Des testeurs utilisent TestDB quelques heures par semaine à des moments imprévisibles, et TestDB est inactive le reste du temps. Les testeurs acceptent un court délai lors de leur première connexion après une période d'inactivité.

    Vous devez réduire au minimum le coût de calcul de TestDB.

    Quelle configuration devez-vous utiliser ?
body:
  options:
    - { id: a, text: { en: "General Purpose, provisioned compute with 2 vCores", fr: "General Purpose, calcul provisionné avec 2 vCores" } }
    - { id: b, text: { en: "Business Critical, provisioned compute with 2 vCores", fr: "Business Critical, calcul provisionné avec 2 vCores" } }
    - { id: c, text: { en: "General Purpose, serverless compute with auto-pause enabled", fr: "General Purpose, calcul serverless avec pause automatique activée" } }
    - { id: d, text: { en: "Hyperscale, provisioned compute with 2 vCores and no high-availability replica", fr: "Hyperscale, calcul provisionné avec 2 vCores et aucun réplica haute disponibilité" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Serverless compute scales automatically and is billed per second for the compute used. With auto-pause, the database pauses after the configured delay of inactivity, and only storage is billed while it's paused. It resumes on the next connection, with a short delay that the testers accept.
    fr: |
      Le calcul serverless s'adapte automatiquement et est facturé à la seconde pour le calcul utilisé. Avec la pause automatique, la base se met en pause après le délai d'inactivité configuré, et seul le stockage est facturé pendant la pause. Elle reprend à la connexion suivante, avec un court délai que les testeurs acceptent.
  options:
    a: { en: "Provisioned compute is billed per hour for the configured vCores even when the database is idle.", fr: "Le calcul provisionné est facturé à l'heure pour les vCores configurés, même quand la base est inactive." }
    b: { en: "Business Critical is the most expensive tier and doesn't support serverless or auto-pause.", fr: "Business Critical est le niveau le plus coûteux et ne prend pas en charge serverless ni la pause automatique." }
    d: { en: "Provisioned Hyperscale compute is billed continuously; it never pauses.", fr: "Le calcul Hyperscale provisionné est facturé en continu ; il ne se met jamais en pause." }
references:
  - title: Serverless compute tier for Azure SQL Database
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/serverless-tier-overview
