id: dp300-3c-integrity-platform
objective: "3.3.3"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Contoso has the following databases:

    - An Azure SQL database named SalesDB in the General Purpose service tier
    - A 2-TB database named ArchiveDB on an Azure SQL managed instance named MI1. Most of the space allocated to ArchiveDB is empty.

    You plan the integrity checks of both databases.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso dispose des bases de données suivantes :

    - Une base de données Azure SQL nommée SalesDB dans le niveau de service General Purpose
    - Une base de données de 2 To nommée ArchiveDB sur une instance managée Azure SQL nommée MI1. La majeure partie de l'espace alloué à ArchiveDB est vide.

    Vous planifiez les vérifications d'intégrité des deux bases de données.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          You can run `DBCC CHECKDB` against SalesDB.
        fr: |
          Vous pouvez exécuter `DBCC CHECKDB` sur SalesDB.
    - id: s2
      text:
        en: |
          On MI1, `DBCC CHECKDB` against ArchiveDB needs free instance storage only for the pages that ArchiveDB actually uses.
        fr: |
          Sur MI1, `DBCC CHECKDB` sur ArchiveDB n'a besoin d'espace de stockage libre sur l'instance que pour les pages réellement utilisées par ArchiveDB.
    - id: s3
      text:
        en: |
          When you run `DBCC CHECKDB` against ArchiveDB with the `TABLOCK` option, the check takes locks instead of using an internal database snapshot.
        fr: |
          Quand vous exécutez `DBCC CHECKDB` sur ArchiveDB avec l'option `TABLOCK`, la vérification prend des verrous au lieu d'utiliser une capture instantanée interne de la base de données.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |
      Azure SQL Database verifies pages during backups and restores, but you can still run `DBCC CHECKDB` on a General Purpose database (only Hyperscale doesn't support it). On a managed instance, the available storage must hold the entire internal snapshot file, whatever the amount of data in use, so a large, mostly empty database can make the check fail with error 1133. `TABLOCK` makes the check take locks, including a short exclusive database lock, instead of creating the internal snapshot.
    fr: |
      Azure SQL Database vérifie les pages pendant les sauvegardes et les restaurations, mais vous pouvez quand même exécuter `DBCC CHECKDB` sur une base General Purpose (seul Hyperscale ne le prend pas en charge). Sur une instance managée, le stockage disponible doit pouvoir contenir l'intégralité du fichier de capture instantanée interne, quelle que soit la quantité de données utilisée : une grande base presque vide peut faire échouer la vérification avec l'erreur 1133. `TABLOCK` fait prendre des verrous à la vérification, dont un verrou exclusif bref sur la base, au lieu de créer la capture instantanée interne.
references:
  - title: DBCC CHECKDB (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/database-console-commands/dbcc-checkdb-transact-sql
