id: dp300-2a-mi-directory-readers
objective: "2.1.2"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    You have an Azure SQL managed instance named **MI1** that has a system-assigned managed identity. You set a Microsoft Entra admin on MI1.

    You need to ensure that MI1 can resolve the Microsoft Entra users, groups and applications for which you will create logins. The solution must follow the principle of least privilege.

    How should you complete the configuration? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'une instance managée Azure SQL nommée **MI1** qui possède une identité managée affectée par le système. Vous définissez un administrateur Microsoft Entra sur MI1.

    Vous devez faire en sorte que MI1 puisse résoudre les utilisateurs, groupes et applications Microsoft Entra pour lesquels vous créerez des connexions. La solution doit respecter le principe des privilèges minimum.

    Comment devez-vous compléter la configuration ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Assign the Microsoft Entra role [[role]] to [[target]].

      The assignment must be performed by a user who holds the [[who]] role (or a higher role).
    fr: |
      Attribuer le rôle Microsoft Entra [[role]] à [[target]].

      L'attribution doit être effectuée par un utilisateur qui détient le rôle [[who]] (ou un rôle supérieur).
  slots:
    - id: role
      options:
        - { id: groups, text: Groups Administrator }
        - { id: readers, text: Directory Readers }
        - { id: users, text: User Administrator }
        - { id: apps, text: Application Administrator }
    - id: target
      options:
        - { id: admin, text: { en: "the Microsoft Entra admin of MI1", fr: "l'administrateur Microsoft Entra de MI1" } }
        - { id: sqladmin, text: { en: "the SQL admin login of MI1", fr: "la connexion d'administrateur SQL de MI1" } }
        - { id: identity, text: { en: "the system-assigned managed identity of MI1", fr: "l'identité managée affectée par le système de MI1" } }
    - id: who
      options:
        - { id: mic, text: SQL Managed Instance Contributor }
        - { id: uaa, text: User Access Administrator }
        - { id: ssm, text: SQL Security Manager }
        - { id: pra, text: Privileged Role Administrator }
answer:
  values: { role: readers, target: identity, who: pra }
explanation:
  correct:
    en: |
      SQL Managed Instance queries Microsoft Entra ID with its own managed identity, so that identity needs Directory Readers (or equivalent fine-grained Microsoft Graph permissions) for Microsoft Entra logins and groups to work. Directory Readers is a Microsoft Entra role, so it is granted by a Privileged Role Administrator or higher, for example from the banner on the Microsoft Entra ID page of the instance.
    fr: |
      SQL Managed Instance interroge Microsoft Entra ID avec sa propre identité managée : cette identité a donc besoin de Directory Readers (ou d'autorisations Microsoft Graph granulaires équivalentes) pour que les connexions et groupes Microsoft Entra fonctionnent. Directory Readers est un rôle Microsoft Entra : il est accordé par un Privileged Role Administrator ou un rôle supérieur, par exemple depuis la bannière de la page Microsoft Entra ID de l'instance.
  options:
    groups: { en: "Groups Administrator can manage groups, which is far more than reading the directory.", fr: "Groups Administrator peut gérer les groupes, ce qui dépasse largement la lecture de l'annuaire." }
    admin: { en: "The instance, not the admin, performs the directory lookups.", fr: "C'est l'instance, et non l'administrateur, qui effectue les recherches dans l'annuaire." }
    mic: { en: "Azure RBAC roles can't assign Microsoft Entra directory roles.", fr: "Les rôles Azure RBAC ne permettent pas d'attribuer des rôles d'annuaire Microsoft Entra." }
    uaa: { en: "User Access Administrator assigns Azure roles on resources, not Microsoft Entra roles.", fr: "User Access Administrator attribue des rôles Azure sur des ressources, pas des rôles Microsoft Entra." }
references:
  - title: Configure Microsoft Entra Authentication - Azure SQL Database & SQL Managed Instance
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/authentication-aad-configure
