id: dp300-2a-mi-legacy-winauth
objective: "2.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove Bank is migrating an on-premises line-of-business database to an Azure SQL managed instance named **MI1**. The application authenticates users with Windows authentication. The users have hybrid identities that are synchronized to Microsoft Entra ID, and their computers are hybrid Microsoft Entra joined.

    You need to ensure that the users can keep signing in to the application the same way after the migration. The application and its connection strings can't be modified, and no new domain infrastructure can be deployed.

    What should you configure?
  fr: |
    Woodgrove Bank migre une base de données métier locale vers une instance managée Azure SQL nommée **MI1**. L'application authentifie les utilisateurs avec l'authentification Windows. Les utilisateurs ont des identités hybrides synchronisées avec Microsoft Entra ID, et leurs ordinateurs sont joints hybrides à Microsoft Entra.

    Vous devez faire en sorte que les utilisateurs puissent continuer à se connecter à l'application de la même façon après la migration. L'application et ses chaînes de connexion ne peuvent pas être modifiées, et aucune nouvelle infrastructure de domaine ne peut être déployée.

    Que devez-vous configurer ?
body:
  options:
    - { id: a, text: { en: "Join MI1 to the on-premises AD DS domain over a site-to-site VPN.", fr: "Joindre MI1 au domaine AD DS local via un VPN site à site." } }
    - { id: b, text: { en: "Microsoft Entra Domain Services, with MI1 joined to the managed domain.", fr: "Microsoft Entra Domain Services, avec MI1 joint au domaine managé." } }
    - { id: c, text: { en: "Windows Authentication for Microsoft Entra principals on MI1.", fr: "L'authentification Windows pour les principaux Microsoft Entra sur MI1." } }
    - { id: d, text: { en: "Microsoft Entra Integrated authentication in the client connection strings.", fr: "L'authentification Microsoft Entra Integrated dans les chaînes de connexion des clients." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Windows Authentication for Microsoft Entra principals uses Microsoft Entra Kerberos to give Windows authentication access to SQL Managed Instance. It targets lift-and-shift scenarios: applications keep their authentication stack, and neither Microsoft Entra Domain Services nor new on-premises infrastructure is required.
    fr: |
      L'authentification Windows pour les principaux Microsoft Entra utilise Microsoft Entra Kerberos pour donner un accès par authentification Windows à SQL Managed Instance. Elle vise les scénarios de lift-and-shift : les applications conservent leur pile d'authentification, sans Microsoft Entra Domain Services ni nouvelle infrastructure locale.
  options:
    a:
      en: A managed instance can't be joined to an AD DS domain.
      fr: Une instance managée ne peut pas être jointe à un domaine AD DS.
    b:
      en: Microsoft Entra Domain Services is new domain infrastructure, which the requirements exclude, and SQL Managed Instance doesn't join a managed domain.
      fr: Microsoft Entra Domain Services est une nouvelle infrastructure de domaine, ce que les exigences excluent, et SQL Managed Instance ne rejoint pas de domaine managé.
    d:
      en: Switching to Microsoft Entra Integrated authentication means changing the connection strings, which isn't allowed.
      fr: Passer à l'authentification Microsoft Entra Integrated implique de modifier les chaînes de connexion, ce qui n'est pas autorisé.
references:
  - title: What is Windows Authentication for Microsoft Entra principals on Azure SQL Managed Instance?
    url: https://learn.microsoft.com/en-us/azure/azure-sql/managed-instance/winauth-azuread-overview
