id: dp300-cs4b-partner-access
objective: "2.1.8"
type: multi
caseStudy: dp300-cs4b-relecloud
difficulty: 3
status: draft
stem:
  en: |
    You create a named replica of TicketsDB named TicketsDB-PW on sql-rc-partner. Proseware must be able to read the tables of the **sales** schema.

    You need to configure pw-login to meet the data access requirement.

    Which three actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous créez un réplica nommé de TicketsDB nommé TicketsDB-PW sur sql-rc-partner. Proseware doit pouvoir lire les tables du schéma **sales**.

    Vous devez configurer pw-login pour satisfaire l'exigence d'accès aux données.

    Quelles sont les trois actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 3
  options:
    - id: a
      text: { en: "In master on sql-rc-prod, create pw-login, note its SID, and then disable pw-login.", fr: "Dans master sur sql-rc-prod, créer pw-login, noter son SID, puis désactiver pw-login." }
    - id: b
      text: { en: "In TicketsDB on sql-rc-prod, create a user for pw-login and grant it SELECT on the sales schema.", fr: "Dans TicketsDB sur sql-rc-prod, créer un utilisateur pour pw-login et lui accorder SELECT sur le schéma sales." }
    - id: c
      text: { en: "In master on sql-rc-partner, create pw-login with the SID that it has on sql-rc-prod.", fr: "Dans master sur sql-rc-partner, créer pw-login avec le SID qu'elle a sur sql-rc-prod." }
    - id: d
      text: { en: "In TicketsDB-PW on sql-rc-partner, create a user for pw-login and grant it SELECT on the sales schema.", fr: "Dans TicketsDB-PW sur sql-rc-partner, créer un utilisateur pour pw-login et lui accorder SELECT sur le schéma sales." }
    - id: e
      text: { en: "In master on sql-rc-partner, create a user for pw-login and add it to the loginmanager role.", fr: "Dans master sur sql-rc-partner, créer un utilisateur pour pw-login et l'ajouter au rôle loginmanager." }
    - id: f
      text: { en: "On sql-rc-prod, create a server-level firewall rule that blocks the IP addresses of Proseware.", fr: "Sur sql-rc-prod, créer une règle de pare-feu au niveau du serveur qui bloque les adresses IP de Proseware." }
answer:
  optionIds: [a, b, c]
explanation:
  correct:
    en: |
      A named replica is read-only, so its database users and permissions come from the primary database: you create the user and grant SELECT in TicketsDB on sql-rc-prod, which requires the login to exist in master of sql-rc-prod. Disabling that login (or dropping it after you note its SID) prevents any connection to the primary server. On sql-rc-partner, a login created with the same SID maps to the replicated user, so pw-login can connect to TicketsDB-PW only.
    fr: |
      Un réplica nommé est en lecture seule : ses utilisateurs de base de données et ses autorisations proviennent de la base de données primaire. Vous créez l'utilisateur et accordez SELECT dans TicketsDB sur sql-rc-prod, ce qui exige que la connexion existe dans master de sql-rc-prod. Désactiver cette connexion (ou la supprimer après avoir noté son SID) empêche toute connexion au serveur primaire. Sur sql-rc-partner, une connexion créée avec le même SID correspond à l'utilisateur répliqué : pw-login ne peut se connecter qu'à TicketsDB-PW.
  options:
    d: { en: "TicketsDB-PW is read-only: users and permissions can't be created in the replica and are replicated from the primary database.", fr: "TicketsDB-PW est en lecture seule : les utilisateurs et les autorisations ne peuvent pas y être créés et sont répliqués depuis la base de données primaire." }
    e: { en: "loginmanager lets a principal create and manage logins; Proseware only needs to read data.", fr: "loginmanager permet à un principal de créer et de gérer des connexions ; Proseware doit seulement lire des données." }
    f: { en: "Server-level IP firewall rules only allow address ranges; they can't block specific addresses, and pw-login could still connect from another address.", fr: "Les règles de pare-feu IP au niveau du serveur ne font qu'autoriser des plages d'adresses ; elles ne peuvent pas bloquer d'adresses précises, et pw-login pourrait toujours se connecter depuis une autre adresse." }
references:
  - title: Configure Hyperscale Named Replicas Security to Allow Isolated Access - Azure SQL Database
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/hyperscale-named-replica-security-configure
