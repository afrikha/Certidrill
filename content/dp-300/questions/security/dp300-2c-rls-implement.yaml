id: dp300-2c-rls-implement
objective: "2.3.6"
type: ordering
difficulty: 1
status: draft
stem:
  en: |
    You have an Azure SQL database named DB1 that contains a table named Sales.Orders. The SalesRep column of Sales.Orders contains the database user name of the sales representative who owns each order.

    You need to ensure that each sales representative can query only their own orders. The predicate function and the security policy must be in a schema that is separate from the application schemas.

    Which three actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Vous disposez d'une base de données Azure SQL nommée DB1 qui contient une table nommée Sales.Orders. La colonne SalesRep de Sales.Orders contient le nom d'utilisateur de base de données du commercial propriétaire de chaque commande.

    Vous devez vous assurer que chaque commercial ne peut interroger que ses propres commandes. La fonction de prédicat et la stratégie de sécurité doivent se trouver dans un schéma distinct des schémas de l'application.

    Quelles sont les trois actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - { id: schema, text: { en: "Create a schema named Security.", fr: "Créer un schéma nommé Security." } }
    - { id: fn, text: { en: "Create an inline table-valued function in the Security schema, WITH SCHEMABINDING, that returns a row when its parameter equals USER_NAME().", fr: "Créer dans le schéma Security une fonction table inline, WITH SCHEMABINDING, qui renvoie une ligne lorsque son paramètre est égal à USER_NAME()." } }
    - { id: policy, text: { en: "Create a security policy in the Security schema that adds a filter predicate calling the function on Sales.Orders(SalesRep), WITH (STATE = ON).", fr: "Créer dans le schéma Security une stratégie de sécurité qui ajoute un prédicat de filtre appelant la fonction sur Sales.Orders(SalesRep), WITH (STATE = ON)." } }
    - { id: mstvf, text: { en: "Create a multi-statement table-valued function in the Security schema that returns the allowed order IDs.", fr: "Créer dans le schéma Security une fonction table à instructions multiples qui renvoie les identifiants de commande autorisés." } }
    - { id: view, text: { en: "Create a view on Sales.Orders filtered on USER_NAME(), and grant the representatives SELECT on the view.", fr: "Créer une vue sur Sales.Orders filtrée sur USER_NAME() et accorder aux commerciaux SELECT sur la vue." } }
    - { id: unmask, text: { en: "Grant UNMASK on Sales.Orders to the representatives.", fr: "Accorder UNMASK sur Sales.Orders aux commerciaux." } }
answer:
  sequence: [schema, fn, policy]
explanation:
  correct:
    en: |
      Row-level security needs a predicate function and a security policy. Microsoft recommends a separate schema for both, so you create it first. The predicate must be an inline table-valued function; with SCHEMABINDING it is protected against changes to the objects it references. The security policy then binds the function to Sales.Orders as a filter predicate and is enabled with STATE = ON.
    fr: |
      La sécurité au niveau des lignes exige une fonction de prédicat et une stratégie de sécurité. Microsoft recommande un schéma distinct pour les deux : vous le créez donc en premier. Le prédicat doit être une fonction table inline ; avec SCHEMABINDING, elle est protégée contre la modification des objets qu'elle référence. La stratégie de sécurité lie ensuite la fonction à Sales.Orders comme prédicat de filtre et est activée avec STATE = ON.
  options:
    mstvf: { en: "Security predicates must be inline table-valued functions.", fr: "Les prédicats de sécurité doivent être des fonctions table inline." }
    view: { en: "A view only filters queries that use it; representatives who query Sales.Orders directly would still see every row.", fr: "Une vue ne filtre que les requêtes qui l'utilisent ; les commerciaux qui interrogent directement Sales.Orders verraient toujours toutes les lignes." }
    unmask: { en: "UNMASK is a dynamic data masking permission and doesn't filter rows.", fr: "UNMASK est une autorisation du masquage dynamique des données et ne filtre pas les lignes." }
references:
  - title: Row-level security
    url: https://learn.microsoft.com/en-us/sql/relational-databases/security/row-level-security
