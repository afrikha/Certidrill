id: dp300-2b-server-role-monitoring
objective: "2.1.8"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    You have an Azure SQL Database logical server named **sql-tailspin**. A monitoring tool must sign in with a new SQL login named **monitor_login** and read the dynamic management views that are covered by the VIEW SERVER STATE permission.

    The solution must follow the principle of least privilege: monitor_login must not be able to run operations that change server state, such as DBCC FREEPROCCACHE.

    How should you complete the Transact-SQL script? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un serveur logique Azure SQL Database nommé **sql-tailspin**. Un outil de supervision doit se connecter avec une nouvelle connexion SQL nommée **monitor_login** et lire les vues de gestion dynamique couvertes par l'autorisation VIEW SERVER STATE.

    La solution doit respecter le principe des privilèges minimum : monitor_login ne doit pas pouvoir exécuter des opérations qui modifient l'état du serveur, comme DBCC FREEPROCCACHE.

    Comment devez-vous compléter le script Transact-SQL ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: sql
  template:
    en: |
      -- Connect to the [[db]] database of sql-tailspin
      CREATE LOGIN monitor_login WITH PASSWORD = 'Str0ng!Monit0r#2026';
      [[stmt]] [[role]] ADD MEMBER monitor_login;
    fr: |
      -- Se connecter à la base de données [[db]] de sql-tailspin
      CREATE LOGIN monitor_login WITH PASSWORD = 'Str0ng!Monit0r#2026';
      [[stmt]] [[role]] ADD MEMBER monitor_login;
  slots:
    - id: db
      options:
        - { id: master, text: master }
        - { id: user, text: SalesDB }
        - { id: tempdb, text: tempdb }
    - id: stmt
      options:
        - { id: alterrole, text: ALTER ROLE }
        - { id: srvrole, text: ALTER SERVER ROLE }
        - { id: approle, text: ALTER APPLICATION ROLE }
    - id: role
      options:
        - { id: manager, text: "##MS_ServerStateManager##" }
        - { id: connector, text: "##MS_DatabaseConnector##" }
        - { id: reader, text: "##MS_ServerStateReader##" }
        - { id: dbmgr, text: "##MS_DatabaseManager##" }
answer:
  values: { db: master, stmt: srvrole, role: reader }
explanation:
  correct:
    en: "In Azure SQL Database, logins and server role memberships are managed in the virtual master database, and fixed server roles are changed with ALTER SERVER ROLE ... ADD MEMBER. ##MS_ServerStateReader## grants VIEW SERVER STATE (plus the performance and security state variants) without ALTER SERVER STATE."
    fr: "Dans Azure SQL Database, les connexions et l'appartenance aux rôles serveur se gèrent dans la base de données master virtuelle, et les rôles serveur fixes se modifient avec ALTER SERVER ROLE ... ADD MEMBER. ##MS_ServerStateReader## accorde VIEW SERVER STATE (ainsi que ses variantes pour l'état des performances et de la sécurité) sans ALTER SERVER STATE."
  options:
    user: { en: "CREATE LOGIN and server role membership must run in master; a user database cannot create logins.", fr: "CREATE LOGIN et l'appartenance aux rôles serveur doivent s'exécuter dans master ; une base de données utilisateur ne peut pas créer de connexions." }
    tempdb: { en: "tempdb is not where server principals are stored; logins live in master.", fr: "tempdb n'est pas l'emplacement des principaux de serveur ; les connexions se trouvent dans master." }
    alterrole: { en: "ALTER ROLE changes database role membership; fixed server roles need ALTER SERVER ROLE.", fr: "ALTER ROLE modifie l'appartenance à un rôle de base de données ; les rôles serveur fixes exigent ALTER SERVER ROLE." }
    approle: { en: "ALTER APPLICATION ROLE changes an application role (name, password, default schema); it has no ADD MEMBER clause.", fr: "ALTER APPLICATION ROLE modifie un rôle d'application (nom, mot de passe, schéma par défaut) ; il n'a pas de clause ADD MEMBER." }
    manager: { en: "##MS_ServerStateManager## adds ALTER SERVER STATE, which allows DBCC FREEPROCCACHE and violates least privilege.", fr: "##MS_ServerStateManager## ajoute ALTER SERVER STATE, qui permet DBCC FREEPROCCACHE et enfreint le principe des privilèges minimum." }
    connector: { en: "##MS_DatabaseConnector## only grants CONNECT ANY DATABASE; it does not grant VIEW SERVER STATE.", fr: "##MS_DatabaseConnector## accorde seulement CONNECT ANY DATABASE ; il n'accorde pas VIEW SERVER STATE." }
    dbmgr: { en: "##MS_DatabaseManager## lets members create and delete databases; it does not grant VIEW SERVER STATE.", fr: "##MS_DatabaseManager## permet de créer et de supprimer des bases de données ; il n'accorde pas VIEW SERVER STATE." }
references:
  - title: Azure SQL Database server roles for permission management
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/security-server-roles
