id: dp300-2b-fw-db-rule-tsql
objective: "2.2.3"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    You have an Azure SQL Database logical server named **sql-litware** that hosts databases named **Sales** and **Inventory**. A server-level IP firewall rule already exists for the administrators.

    A reporting application uses the public IP address 198.51.100.20. You need to allow the application to connect to Sales only, and then list the rules that apply to Sales.

    How should you complete the Transact-SQL script? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un serveur logique Azure SQL Database nommé **sql-litware** qui héberge des bases de données nommées **Sales** et **Inventory**. Une règle de pare-feu IP au niveau du serveur existe déjà pour les administrateurs.

    Une application de création de rapports utilise l'adresse IP publique 198.51.100.20. Vous devez autoriser l'application à se connecter uniquement à Sales, puis lister les règles qui s'appliquent à Sales.

    Comment devez-vous compléter le script Transact-SQL ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: sql
  template:
    en: |
      -- Connect to the [[db]] database
      EXECUTE [[proc]] @name = N'ReportingApp',
        @start_ip_address = '198.51.100.20',
        @end_ip_address = '198.51.100.20';

      SELECT name, start_ip_address, end_ip_address
      FROM [[view]];
    fr: |
      -- Se connecter à la base de données [[db]]
      EXECUTE [[proc]] @name = N'ReportingApp',
        @start_ip_address = '198.51.100.20',
        @end_ip_address = '198.51.100.20';

      SELECT name, start_ip_address, end_ip_address
      FROM [[view]];
  slots:
    - id: db
      options:
        - { id: master, text: master }
        - { id: sales, text: Sales }
        - { id: inventory, text: Inventory }
    - id: proc
      options:
        - { id: srv, text: sp_set_firewall_rule }
        - { id: dbrule, text: sp_set_database_firewall_rule }
        - { id: del, text: sp_delete_database_firewall_rule }
    - id: view
      options:
        - { id: dbview, text: sys.database_firewall_rules }
        - { id: srvview, text: sys.firewall_rules }
        - { id: cfg, text: sys.database_scoped_configurations }
answer:
  values: { db: sales, proc: dbrule, view: dbview }
explanation:
  correct:
    en: "A database-level IP firewall rule is created with sp_set_database_firewall_rule while connected to the database it protects, here Sales, and it grants access to that database only. The database-level rules are listed in sys.database_firewall_rules of the same database."
    fr: "Une règle de pare-feu IP au niveau de la base de données se crée avec sp_set_database_firewall_rule en étant connecté à la base qu'elle protège, ici Sales, et elle n'accorde l'accès qu'à cette base. Les règles au niveau de la base de données sont listées dans sys.database_firewall_rules de la même base."
  options:
    master: { en: "A database-level rule created in master applies to master, not to Sales.", fr: "Une règle au niveau de la base de données créée dans master s'applique à master, pas à Sales." }
    inventory: { en: "A rule created in Inventory would allow the application to reach Inventory, not Sales.", fr: "Une règle créée dans Inventory autoriserait l'application à atteindre Inventory, pas Sales." }
    srv: { en: "sp_set_firewall_rule creates a server-level rule, which would open every database of sql-litware.", fr: "sp_set_firewall_rule crée une règle au niveau du serveur, qui ouvrirait toutes les bases de sql-litware." }
    del: { en: "sp_delete_database_firewall_rule removes a rule; it does not create one.", fr: "sp_delete_database_firewall_rule supprime une règle ; il n'en crée pas." }
    srvview: { en: "sys.firewall_rules, in master, lists the server-level rules only.", fr: "sys.firewall_rules, dans master, ne liste que les règles au niveau du serveur." }
    cfg: { en: "sys.database_scoped_configurations lists database-scoped configuration settings, not firewall rules.", fr: "sys.database_scoped_configurations liste les paramètres de configuration délimités à la base de données, pas les règles de pare-feu." }
references:
  - title: Azure SQL Database IP firewall rules
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/firewall-configure
