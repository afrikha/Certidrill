id: dp300-2c-cdc-azure-facts
objective: "2.3.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    You have an Azure SQL database named DB1 that uses the General Purpose service tier (vCore). You plan to enable change data capture (CDC) on DB1 and on a table named dbo.Shipments. You will specify a gating role named CdcReaders when you enable CDC on the table.

    Which two statements are true?

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'une base de données Azure SQL nommée DB1 qui utilise le niveau de service General Purpose (vCore). Vous prévoyez d'activer la capture des changements de données (CDC) sur DB1 et sur une table nommée dbo.Shipments. Vous indiquerez un rôle de contrôle d'accès (gating role) nommé CdcReaders lors de l'activation de CDC sur la table.

    Quelles sont les deux affirmations vraies ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "You must create SQL Server Agent jobs to run the capture and cleanup processes.", fr: "Vous devez créer des travaux SQL Server Agent pour exécuter les processus de capture et de nettoyage." } }
    - { id: b, text: { en: "A user who isn't a member of db_owner needs SELECT on the captured columns and membership in CdcReaders to read the change data.", fr: "Un utilisateur qui n'est pas membre de db_owner a besoin de SELECT sur les colonnes capturées et de l'appartenance à CdcReaders pour lire les données modifiées." } }
    - { id: c, text: { en: "You can change the capture frequency to every five seconds by running sys.sp_cdc_change_job.", fr: "Vous pouvez faire passer la fréquence de capture à toutes les cinq secondes en exécutant sys.sp_cdc_change_job." } }
    - { id: d, text: { en: "Enabling CDC on DB1 requires membership in the db_owner role.", fr: "L'activation de CDC sur DB1 exige l'appartenance au rôle db_owner." } }
    - { id: e, text: { en: "CDC stores only the primary key values of the changed rows in the change tables.", fr: "CDC ne stocke que les valeurs de clé primaire des lignes modifiées dans les tables de modifications." } }
answer:
  optionIds: [b, d]
explanation:
  correct:
    en: |
      In Azure SQL Database, the db_owner role is required to enable CDC. When a gating role is specified, users who aren't sysadmin or db_owner members must belong to it and also need SELECT on the captured columns to read change data.
    fr: |
      Dans Azure SQL Database, le rôle db_owner est nécessaire pour activer CDC. Lorsqu'un rôle de contrôle d'accès est indiqué, les utilisateurs qui ne sont pas membres de sysadmin ou de db_owner doivent en faire partie et ont aussi besoin de SELECT sur les colonnes capturées pour lire les données modifiées.
  options:
    a: { en: "Azure SQL Database uses a built-in CDC scheduler that runs capture and cleanup; there is no SQL Server Agent.", fr: "Azure SQL Database utilise un planificateur CDC intégré qui exécute la capture et le nettoyage ; il n'y a pas de SQL Server Agent." }
    c: { en: "The scheduler runs capture every 20 seconds and cleanup every hour, and that frequency can't be changed; sp_cdc_change_job only adjusts settings such as maxtrans and maxscans.", fr: "Le planificateur exécute la capture toutes les 20 secondes et le nettoyage toutes les heures, et cette fréquence n'est pas modifiable ; sp_cdc_change_job n'ajuste que des paramètres comme maxtrans et maxscans." }
    e: { en: "Storing only the keys of changed rows describes change tracking; CDC stores the column values of each change.", fr: "Ne stocker que les clés des lignes modifiées correspond au suivi des modifications ; CDC stocke les valeurs des colonnes de chaque changement." }
references:
  - title: Change Data Capture (CDC) With Azure SQL Database
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/change-data-capture-overview
