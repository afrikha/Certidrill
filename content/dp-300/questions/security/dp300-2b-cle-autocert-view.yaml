id: dp300-2b-cle-autocert-view
objective: "2.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have a SQL Server 2022 database named **HR** on an Azure virtual machine. The EncryptedNationalID column of the HR.Employee table was encrypted with ENCRYPTBYKEY by using a symmetric key that is protected by a certificate named **HrCert**. The private key of HrCert is protected by the database master key.

    You need to create a view that returns the decrypted values in a single SELECT statement. Users of the view must not have to run OPEN SYMMETRIC KEY first.

    Which expression should you use in the view?
  fr: |
    Vous disposez d'une base de données SQL Server 2022 nommée **HR** sur une machine virtuelle Azure. La colonne EncryptedNationalID de la table HR.Employee a été chiffrée avec ENCRYPTBYKEY à l'aide d'une clé symétrique protégée par un certificat nommé **HrCert**. La clé privée de HrCert est protégée par la clé principale de base de données.

    Vous devez créer une vue qui renvoie les valeurs déchiffrées dans une seule instruction SELECT. Les utilisateurs de la vue ne doivent pas avoir à exécuter OPEN SYMMETRIC KEY au préalable.

    Quelle expression devez-vous utiliser dans la vue ?
body:
  options:
    - { id: a, text: "DECRYPTBYCERT(CERT_ID('HrCert'), EncryptedNationalID)" }
    - { id: b, text: "DECRYPTBYKEY(EncryptedNationalID)" }
    - { id: c, text: "DECRYPTBYPASSPHRASE('HrCert', EncryptedNationalID)" }
    - { id: d, text: "DECRYPTBYKEYAUTOCERT(CERT_ID('HrCert'), NULL, EncryptedNationalID)" }
answer: { optionId: d }
explanation:
  correct:
    en: "DECRYPTBYKEYAUTOCERT combines OPEN SYMMETRIC KEY and DECRYPTBYKEY: it decrypts the symmetric key with the certificate, then decrypts the ciphertext, in one operation. The password argument can be NULL because the database master key protects the private key of HrCert. Callers need VIEW DEFINITION on the symmetric key and CONTROL on the certificate."
    fr: "DECRYPTBYKEYAUTOCERT combine OPEN SYMMETRIC KEY et DECRYPTBYKEY : il déchiffre la clé symétrique avec le certificat, puis le texte chiffré, en une seule opération. L'argument du mot de passe peut être NULL, car la clé principale de base de données protège la clé privée de HrCert. Les appelants ont besoin de VIEW DEFINITION sur la clé symétrique et de CONTROL sur le certificat."
  options:
    a: { en: "DECRYPTBYCERT decrypts data that was encrypted directly with the certificate (ENCRYPTBYCERT), not data encrypted with a symmetric key.", fr: "DECRYPTBYCERT déchiffre des données chiffrées directement avec le certificat (ENCRYPTBYCERT), pas des données chiffrées avec une clé symétrique." }
    b: { en: "DECRYPTBYKEY returns NULL unless the symmetric key was opened earlier in the session.", fr: "DECRYPTBYKEY renvoie NULL si la clé symétrique n'a pas été ouverte auparavant dans la session." }
    c: { en: "DECRYPTBYPASSPHRASE decrypts data encrypted with ENCRYPTBYPASSPHRASE; a certificate name is not a passphrase.", fr: "DECRYPTBYPASSPHRASE déchiffre des données chiffrées avec ENCRYPTBYPASSPHRASE ; un nom de certificat n'est pas une phrase secrète." }
references:
  - title: DECRYPTBYKEYAUTOCERT (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/functions/decryptbykeyautocert-transact-sql
