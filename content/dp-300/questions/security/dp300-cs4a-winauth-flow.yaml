id: dp300-cs4a-winauth-flow
objective: "2.1.2"
type: single
caseStudy: dp300-cs4a-humongous-insurance
difficulty: 3
status: draft
stem:
  en: |
    You need to meet the security requirement for UWLegacy after Underwriting moves to MI-PROD.

    What should you configure?
  fr: |
    Vous devez satisfaire l'exigence de sécurité d'UWLegacy après le déplacement d'Underwriting vers MI-PROD.

    Que devez-vous configurer ?
body:
  options:
    - id: a
      text: { en: "Windows Authentication for Microsoft Entra principals by using the modern interactive flow", fr: "L'authentification Windows pour les principaux Microsoft Entra à l'aide du flux interactif moderne" }
    - id: b
      text: { en: "Microsoft Entra authentication by using the Active Directory Integrated authentication mode", fr: "L'authentification Microsoft Entra à l'aide du mode d'authentification Active Directory Integrated" }
    - id: c
      text: { en: "Windows Authentication for Microsoft Entra principals by using the incoming trust-based flow", fr: "L'authentification Windows pour les principaux Microsoft Entra à l'aide du flux entrant basé sur l'approbation" }
    - id: d
      text: { en: "A Microsoft Entra Domain Services managed domain to which MI-PROD is joined", fr: "Un domaine managé Microsoft Entra Domain Services auquel MI-PROD est joint" }
answer:
  optionId: c
explanation:
  correct:
    en: |
      Windows Authentication for Microsoft Entra principals lets clients use Kerberos against SQL Managed Instance without changing their connection strings. The incoming trust-based flow is the one for clients that are joined to AD DS only: it requires Windows 10 or Windows Server 2012 or later, a domain functional level of Windows Server 2012 or higher, Microsoft Entra Connect, and an incoming trust object created in AD DS and registered in Microsoft Entra ID. APP1 to APP4 meet these conditions and keep their current join state.
    fr: |
      L'authentification Windows pour les principaux Microsoft Entra permet aux clients d'utiliser Kerberos auprès de SQL Managed Instance sans modifier leurs chaînes de connexion. Le flux entrant basé sur l'approbation est celui des clients joints uniquement à AD DS : il exige Windows 10 ou Windows Server 2012 ou version ultérieure, un niveau fonctionnel de domaine Windows Server 2012 ou supérieur, Microsoft Entra Connect et un objet d'approbation entrante créé dans AD DS et inscrit dans Microsoft Entra ID. APP1 à APP4 remplissent ces conditions et conservent leur état de jonction actuel.
  options:
    a: { en: "The modern interactive flow requires Microsoft Entra joined or hybrid joined clients and works only for interactive sessions, not for a Windows service.", fr: "Le flux interactif moderne exige des clients joints à Microsoft Entra ou joints à Microsoft Entra hybride et ne fonctionne que pour les sessions interactives, pas pour un service Windows." }
    b: { en: "Active Directory Integrated is a Microsoft Entra authentication mode that requires a change of the connection string, which UWLegacy doesn't allow.", fr: "Active Directory Integrated est un mode d'authentification Microsoft Entra qui exige une modification de la chaîne de connexion, ce qu'UWLegacy ne permet pas." }
    d: { en: "A managed instance can't be joined to a domain; Windows authentication on SQL Managed Instance relies on Kerberos for Microsoft Entra ID.", fr: "Une instance managée ne peut pas être jointe à un domaine ; l'authentification Windows sur SQL Managed Instance repose sur Kerberos pour Microsoft Entra ID." }
references:
  - title: How to Set up Windows Authentication for Azure SQL Managed Instance Using Microsoft Entra ID and Kerberos - Azure SQL Managed Instance
    url: https://learn.microsoft.com/en-us/azure/azure-sql/managed-instance/winauth-azuread-setup
  - title: What Is Windows Authentication for Microsoft Entra Principals on Azure SQL Managed Instance? - Azure SQL Managed Instance
    url: https://learn.microsoft.com/en-us/azure/azure-sql/managed-instance/winauth-azuread-overview
