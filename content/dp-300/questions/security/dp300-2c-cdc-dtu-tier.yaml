id: dp300-2c-cdc-dtu-tier
objective: "2.3.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have an Azure SQL database named DB1 that uses the DTU purchasing model and the Standard S1 service objective. DB1 contains a table named Sales.Orders.

    An ETL process must load the values of every inserted, updated, and deleted row of Sales.Orders into a data warehouse, including the values before and after each update.

    You need to implement a solution that meets the requirement. The solution must minimize cost.

    What should you do?
  fr: |
    Vous disposez d'une base de données Azure SQL nommée DB1 qui utilise le modèle d'achat DTU et l'objectif de service Standard S1. DB1 contient une table nommée Sales.Orders.

    Un processus ETL doit charger dans un entrepôt de données les valeurs de chaque ligne insérée, mise à jour et supprimée de Sales.Orders, y compris les valeurs avant et après chaque mise à jour.

    Vous devez implémenter une solution qui répond à l'exigence. La solution doit réduire les coûts au minimum.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Scale DB1 to S2, and then enable change data capture on DB1 and on Sales.Orders.", fr: "Mettre DB1 à l'échelle vers S2, puis activer la capture des changements de données sur DB1 et sur Sales.Orders." } }
    - { id: b, text: { en: "Enable change tracking on DB1 and on Sales.Orders with TRACK_COLUMNS_UPDATED = ON.", fr: "Activer le suivi des modifications sur DB1 et sur Sales.Orders avec TRACK_COLUMNS_UPDATED = ON." } }
    - { id: c, text: { en: "Scale DB1 to S3, and then enable change data capture on DB1 and on Sales.Orders.", fr: "Mettre DB1 à l'échelle vers S3, puis activer la capture des changements de données sur DB1 et sur Sales.Orders." } }
    - { id: d, text: { en: "Enable change data capture on DB1 and on Sales.Orders, and then create SQL Server Agent capture and cleanup jobs.", fr: "Activer la capture des changements de données sur DB1 et sur Sales.Orders, puis créer des travaux SQL Server Agent de capture et de nettoyage." } }
answer:
  optionId: c
explanation:
  correct:
    en: |
      Only change data capture (CDC) records the column values of each change, including the before and after images of updates. In the DTU model, CDC requires S3 or higher (Basic, S0, S1 and S2 aren't supported), so the cheapest supported option is to scale DB1 to S3 and then run sys.sp_cdc_enable_db and sys.sp_cdc_enable_table. In Azure SQL Database, a built-in CDC scheduler runs capture and cleanup.
    fr: |
      Seule la capture des changements de données (CDC) enregistre les valeurs des colonnes de chaque changement, y compris les images avant et après des mises à jour. Dans le modèle DTU, CDC exige S3 ou supérieur (Basic, S0, S1 et S2 ne sont pas pris en charge) : l'option prise en charge la moins chère consiste donc à mettre DB1 à l'échelle vers S3, puis à exécuter sys.sp_cdc_enable_db et sys.sp_cdc_enable_table. Dans Azure SQL Database, un planificateur CDC intégré exécute la capture et le nettoyage.
  options:
    a: { en: "S2 is below the minimum DTU service objective that supports CDC.", fr: "S2 est en dessous de l'objectif de service DTU minimal qui prend en charge CDC." }
    b: { en: "Change tracking records which rows and columns changed, but not their values before and after the change.", fr: "Le suivi des modifications enregistre les lignes et colonnes modifiées, mais pas leurs valeurs avant et après le changement." }
    d: { en: "CDC isn't supported on S1, and Azure SQL Database has no SQL Server Agent: a built-in scheduler runs the CDC jobs.", fr: "CDC n'est pas pris en charge en S1, et Azure SQL Database n'a pas de SQL Server Agent : un planificateur intégré exécute les travaux CDC." }
references:
  - title: Change Data Capture (CDC) With Azure SQL Database
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/change-data-capture-overview
