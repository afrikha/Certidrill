id: dp300-2c-audit-server-db
objective: "2.3.2"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    You have an Azure SQL logical server named sql-adatum that hosts databases named DB1 and DB2.

    Server-level auditing is enabled on sql-adatum and writes to a storage account named stadataudit. Database-level auditing is enabled on DB1 and writes to a Log Analytics workspace named law-adatum. DB2 has no database-level auditing.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un serveur logique Azure SQL nommé sql-adatum qui héberge les bases de données DB1 et DB2.

    L'audit au niveau du serveur est activé sur sql-adatum et écrit vers un compte de stockage nommé stadataudit. L'audit au niveau de la base de données est activé sur DB1 et écrit vers un espace de travail Log Analytics nommé law-adatum. DB2 n'a pas d'audit au niveau de la base de données.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: The audit events of DB1 are written to both stadataudit and law-adatum.
        fr: Les événements d'audit de DB1 sont écrits à la fois vers stadataudit et vers law-adatum.
    - id: s2
      text:
        en: A database named DB3 that you create on sql-adatum next month will be audited to stadataudit.
        fr: Une base de données nommée DB3 que vous créerez le mois prochain sur sql-adatum sera auditée vers stadataudit.
    - id: s3
      text:
        en: If you disable database-level auditing on DB1, the events of DB1 stop being audited.
        fr: Si vous désactivez l'audit au niveau de la base de données sur DB1, les événements de DB1 cessent d'être audités.
answer:
  values: { s1: true, s2: true, s3: false }
explanation:
  correct:
    en: |
      A server auditing policy applies to all existing and newly created databases of the server, whatever their own settings. Database-level auditing does not override it: both audits run side by side, so DB1 is audited twice, once to each destination. Disabling the database-level policy leaves the server policy in place, so DB1 is still audited to stadataudit.
    fr: |
      Une stratégie d'audit du serveur s'applique à toutes les bases de données existantes et nouvelles du serveur, quels que soient leurs propres paramètres. L'audit au niveau de la base de données ne la remplace pas : les deux audits s'exécutent côte à côte, et DB1 est audité deux fois, une fois vers chaque destination. Désactiver la stratégie de la base laisse la stratégie du serveur en place : DB1 reste audité vers stadataudit.
references:
  - title: Auditing Policy at the Server and Database Level
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/auditing-server-level-database-level
