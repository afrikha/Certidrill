id: dp300-2b-tde-restore-other-server
objective: "2.2.1"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    You have two Azure virtual machines named **VM1** and **VM2** that run SQL Server 2022. On VM1, a database named **Sales** is encrypted by using transparent data encryption (TDE) with a certificate named **TdeCert** stored in master. You backed up TdeCert and its private key to files protected by a password.

    You copy a full backup of Sales, the certificate file, and the private key file to VM2. The master database of VM2 does not contain a database master key.

    You need to restore Sales on VM2.

    Which three actions should you perform on VM2 in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Vous disposez de deux machines virtuelles Azure nommées **VM1** et **VM2** qui exécutent SQL Server 2022. Sur VM1, une base de données nommée **Sales** est chiffrée à l'aide du chiffrement transparent des données (TDE) avec un certificat nommé **TdeCert** stocké dans master. Vous avez sauvegardé TdeCert et sa clé privée dans des fichiers protégés par un mot de passe.

    Vous copiez une sauvegarde complète de Sales, le fichier du certificat et le fichier de la clé privée sur VM2. La base de données master de VM2 ne contient pas de clé principale de base de données.

    Vous devez restaurer Sales sur VM2.

    Quelles sont les trois actions à effectuer sur VM2 dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - { id: dmk, text: { en: "Create a database master key in master.", fr: "Créer une clé principale de base de données dans master." } }
    - { id: cert, text: { en: "Create TdeCert in master from the certificate file, with the private key file and its decryption password.", fr: "Créer TdeCert dans master à partir du fichier du certificat, avec le fichier de la clé privée et son mot de passe de déchiffrement." } }
    - { id: restore, text: { en: "Restore the Sales backup.", fr: "Restaurer la sauvegarde de Sales." } }
    - { id: newcert, text: { en: "Create a new certificate named TdeCert in master by using WITH SUBJECT.", fr: "Créer un nouveau certificat nommé TdeCert dans master à l'aide de WITH SUBJECT." } }
    - { id: dek, text: { en: "Create a database encryption key in Sales that is protected by TdeCert.", fr: "Créer dans Sales une clé de chiffrement de base de données protégée par TdeCert." } }
    - { id: off, text: { en: "Run ALTER DATABASE Sales SET ENCRYPTION OFF.", fr: "Exécuter ALTER DATABASE Sales SET ENCRYPTION OFF." } }
answer:
  sequence: [ dmk, cert, restore ]
explanation:
  correct:
    en: "The backup is encrypted with the database encryption key, which is protected by TdeCert. The target instance needs a database master key in master to protect the certificate's private key, then the original certificate recreated from its backup files with CREATE CERTIFICATE ... FROM FILE ... WITH PRIVATE KEY (... DECRYPTION BY PASSWORD = ...). The restore can then open the database encryption key."
    fr: "La sauvegarde est chiffrée avec la clé de chiffrement de base de données, protégée par TdeCert. L'instance cible a besoin d'une clé principale de base de données dans master pour protéger la clé privée du certificat, puis du certificat d'origine recréé à partir de ses fichiers de sauvegarde avec CREATE CERTIFICATE ... FROM FILE ... WITH PRIVATE KEY (... DECRYPTION BY PASSWORD = ...). La restauration peut alors ouvrir la clé de chiffrement de base de données."
  options:
    newcert: { en: "A new certificate has a different key pair and thumbprint, so it cannot decrypt the database encryption key of the backup.", fr: "Un nouveau certificat possède une autre paire de clés et une autre empreinte : il ne peut pas déchiffrer la clé de chiffrement de base de données de la sauvegarde." }
    dek: { en: "The database encryption key is inside the backup; Sales does not exist on VM2 before the restore.", fr: "La clé de chiffrement de base de données se trouve dans la sauvegarde ; Sales n'existe pas sur VM2 avant la restauration." }
    off: { en: "The database does not exist on VM2 yet, and turning encryption off does not decrypt an existing backup file.", fr: "La base n'existe pas encore sur VM2, et désactiver le chiffrement ne déchiffre pas un fichier de sauvegarde existant." }
references:
  - title: Move a TDE protected database to another SQL Server
    url: https://learn.microsoft.com/en-us/sql/relational-databases/security/encryption/move-a-tde-protected-database-to-another-sql-server
  - title: Transparent data encryption (TDE)
    url: https://learn.microsoft.com/en-us/sql/relational-databases/security/encryption/transparent-data-encryption
