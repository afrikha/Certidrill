id: dp300-2a-deny-column
objective: "2.1.6"
type: yesno_statements
difficulty: 3
status: draft
stem:
  en: |
    You have an Azure virtual machine that runs SQL Server 2022. Common criteria compliance isn't enabled on the instance. A database named **DB1** contains a user named **Mia** who is a member of two database roles. The following permissions exist:

    | Principal | Permission |
    | --- | --- |
    | Role Analysts | GRANT SELECT ON SCHEMA::Sales |
    | Role Auditors | DENY SELECT ON OBJECT::Sales.Orders |
    | User Mia | GRANT SELECT (OrderID, OrderDate) ON Sales.Orders |

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'une machine virtuelle Azure qui exécute SQL Server 2022. La conformité aux critères communs n'est pas activée sur l'instance. Une base de données nommée **DB1** contient un utilisateur nommé **Mia**, membre de deux rôles de base de données. Les autorisations suivantes existent :

    | Principal | Autorisation |
    | --- | --- |
    | Rôle Analysts | GRANT SELECT ON SCHEMA::Sales |
    | Rôle Auditors | DENY SELECT ON OBJECT::Sales.Orders |
    | Utilisateur Mia | GRANT SELECT (OrderID, OrderDate) ON Sales.Orders |

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: Mia can run SELECT * FROM Sales.Orders.
        fr: Mia peut exécuter SELECT * FROM Sales.Orders.
    - id: s2
      text:
        en: Mia can run SELECT OrderID, OrderDate FROM Sales.Orders.
        fr: Mia peut exécuter SELECT OrderID, OrderDate FROM Sales.Orders.
    - id: s3
      text:
        en: Mia can read the table Sales.Customers.
        fr: Mia peut lire la table Sales.Customers.
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: |
      Permissions add up across Mia's roles, and a DENY overrides a GRANT at the same or a higher scope, so the table-level DENY blocks SELECT * on Sales.Orders despite the schema grant. A table-level DENY doesn't take precedence over a column-level GRANT (kept for backward compatibility when common criteria compliance is off), so Mia can still read OrderID and OrderDate. Sales.Customers is covered by the schema grant and isn't denied.
    fr: |
      Les autorisations s'additionnent entre les rôles de Mia, et un DENY l'emporte sur un GRANT de même portée ou de portée supérieure : le DENY au niveau de la table bloque SELECT * sur Sales.Orders malgré l'autorisation sur le schéma. Un DENY au niveau de la table ne l'emporte pas sur un GRANT au niveau des colonnes (comportement conservé pour la compatibilité descendante lorsque la conformité aux critères communs est désactivée) : Mia peut donc toujours lire OrderID et OrderDate. Sales.Customers est couverte par l'autorisation sur le schéma et n'est pas refusée.
references:
  - title: DENY Object Permissions (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/statements/deny-object-permissions-transact-sql
