id: dp300-2b-ae-view-key-permissions
objective: "2.2.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    You have an Azure SQL database named **Payroll**. The Salary column of the Employee table is encrypted by using Always Encrypted. The column master key is stored in Azure Key Vault.

    You create a contained database user named **hr_app** for a new application and grant it SELECT on the Employee table. The application connects with Column Encryption Setting=Enabled and has the required permissions on the key vault. The queries that read the Salary column fail.

    You need to ensure that hr_app can query the encrypted column. The solution must follow the principle of least privilege.

    What should you grant to hr_app?
  fr: |
    Vous disposez d'une base de données Azure SQL nommée **Payroll**. La colonne Salary de la table Employee est chiffrée à l'aide d'Always Encrypted. La clé principale de colonne est stockée dans Azure Key Vault.

    Vous créez un utilisateur de base de données autonome nommé **hr_app** pour une nouvelle application et lui accordez SELECT sur la table Employee. L'application se connecte avec Column Encryption Setting=Enabled et dispose des autorisations requises sur le coffre de clés. Les requêtes qui lisent la colonne Salary échouent.

    Vous devez vous assurer que hr_app peut interroger la colonne chiffrée. La solution doit respecter le principe des privilèges minimum.

    Qu'est-ce que vous devez accorder à hr_app ?
body:
  options:
    - { id: a, text: "ALTER ANY COLUMN MASTER KEY and ALTER ANY COLUMN ENCRYPTION KEY" }
    - { id: b, text: "VIEW ANY COLUMN MASTER KEY DEFINITION and VIEW ANY COLUMN ENCRYPTION KEY DEFINITION" }
    - { id: c, text: "UNMASK on the Employee table" }
    - { id: d, text: "Membership in the db_owner role" }
answer: { optionId: b }
explanation:
  correct:
    en: "To query encrypted columns, a user needs to read the key metadata, which requires VIEW ANY COLUMN MASTER KEY DEFINITION and VIEW ANY COLUMN ENCRYPTION KEY DEFINITION. In SQL Server the public role has them by default, but in Azure SQL Database it does not, so a database administrator must grant them explicitly."
    fr: "Pour interroger des colonnes chiffrées, un utilisateur doit lire les métadonnées des clés, ce qui exige VIEW ANY COLUMN MASTER KEY DEFINITION et VIEW ANY COLUMN ENCRYPTION KEY DEFINITION. Dans SQL Server, le rôle public en dispose par défaut, mais pas dans Azure SQL Database : un administrateur de base de données doit les accorder explicitement."
  options:
    a: { en: "The ALTER ANY permissions allow creating and deleting key metadata, which the application does not need.", fr: "Les autorisations ALTER ANY permettent de créer et de supprimer des métadonnées de clés, ce dont l'application n'a pas besoin." }
    c: { en: "UNMASK relates to dynamic data masking, not to Always Encrypted.", fr: "UNMASK concerne le masquage dynamique des données, pas Always Encrypted." }
    d: { en: "db_owner grants full control of the database and violates the principle of least privilege.", fr: "db_owner accorde le contrôle total de la base de données et enfreint le principe des privilèges minimum." }
references:
  - title: Always Encrypted
    url: https://learn.microsoft.com/en-us/sql/relational-databases/security/encryption/always-encrypted-database-engine
