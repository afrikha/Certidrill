id: dp300-2a-entra-sql2022-onprem
objective: "2.1.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Litware runs a standalone SQL Server 2022 instance on a physical Linux server in its own datacenter. The server can reach Azure over outbound HTTPS. Litware uses a Microsoft Entra tenant and has an Azure subscription.

    You need the database administrators to sign in to the instance by using Microsoft Entra accounts with multifactor authentication. The solution must minimize administrative effort.

    What should you do first?
  fr: |
    Litware exécute une instance SQL Server 2022 autonome sur un serveur Linux physique dans son propre centre de données. Le serveur peut joindre Azure en HTTPS sortant. Litware utilise un locataire Microsoft Entra et dispose d'un abonnement Azure.

    Vous devez permettre aux administrateurs de bases de données de se connecter à l'instance avec des comptes Microsoft Entra et l'authentification multifacteur. La solution doit réduire au minimum l'effort d'administration.

    Que devez-vous faire en premier ?
body:
  options:
    - { id: a, text: { en: "Register the server with the SQL IaaS Agent extension.", fr: "Inscrire le serveur auprès de l'extension SQL IaaS Agent." } }
    - { id: b, text: { en: "Join the server to a Microsoft Entra Domain Services managed domain.", fr: "Joindre le serveur à un domaine managé Microsoft Entra Domain Services." } }
    - { id: c, text: { en: "Install Microsoft Entra Connect and synchronize the SQL logins.", fr: "Installer Microsoft Entra Connect et synchroniser les connexions SQL." } }
    - { id: d, text: { en: "Connect the server and the instance to Azure Arc.", fr: "Connecter le serveur et l'instance à Azure Arc." } }
answer: { optionId: d }
explanation:
  correct:
    en: Microsoft Entra authentication works with SQL Server 2022 and later on Windows and Linux. Outside Azure, you register SQL Server and its host with Azure Arc (Azure Connected Machine agent and the Azure extension for SQL Server), and then set the Microsoft Entra admin and create logins FROM EXTERNAL PROVIDER.
    fr: L'authentification Microsoft Entra fonctionne avec SQL Server 2022 et versions ultérieures sous Windows et Linux. Hors d'Azure, vous inscrivez SQL Server et son hôte auprès d'Azure Arc (agent Azure Connected Machine et extension Azure pour SQL Server), puis vous définissez l'administrateur Microsoft Entra et créez des connexions FROM EXTERNAL PROVIDER.
  options:
    a:
      en: The SQL IaaS Agent extension is the prerequisite for SQL Server on Azure virtual machines, not for a server in a private datacenter.
      fr: L'extension SQL IaaS Agent est le prérequis pour SQL Server sur des machines virtuelles Azure, pas pour un serveur d'un centre de données privé.
    b:
      en: Microsoft Entra Domain Services provides Kerberos and NTLM for domain-joined machines; it isn't required for Microsoft Entra authentication to SQL Server.
      fr: Microsoft Entra Domain Services fournit Kerberos et NTLM aux machines jointes à un domaine ; il n'est pas nécessaire pour l'authentification Microsoft Entra auprès de SQL Server.
    c:
      en: Microsoft Entra Connect synchronizes AD DS identities; SQL logins aren't directory objects and can't be synchronized.
      fr: Microsoft Entra Connect synchronise des identités AD DS ; les connexions SQL ne sont pas des objets d'annuaire et ne peuvent pas être synchronisées.
references:
  - title: Microsoft Entra authentication for SQL Server
    url: https://learn.microsoft.com/en-us/sql/relational-databases/security/authentication-access/azure-ad-authentication-sql-server-overview
