id: dp300-cs3a-auditor-firewall
objective: "2.2.3"
type: single
caseStudy: dp300-cs3a-lamna-insurance
difficulty: 1
status: draft
stem:
  en: |
    PolicyDB has been migrated to sql-li-cac. You need to meet the security requirements for the external auditing firm.

    What should you do?
  fr: |
    PolicyDB a été migrée vers sql-li-cac. Vous devez satisfaire les exigences de sécurité concernant le cabinet d'audit externe.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Connect to the master database of sql-li-cac and run sp_set_firewall_rule for 203.0.113.40.", fr: "Se connecter à la base de données master de sql-li-cac et exécuter sp_set_firewall_rule pour 203.0.113.40." } }
    - { id: b, text: { en: "Run az sql server firewall-rule create for sql-li-cac with 203.0.113.40 as the start and end address.", fr: "Exécuter az sql server firewall-rule create pour sql-li-cac avec 203.0.113.40 comme adresse de début et de fin." } }
    - { id: c, text: { en: "In the Azure portal, open PolicyDB and add a database-level firewall rule for 203.0.113.40.", fr: "Dans le portail Azure, ouvrir PolicyDB et ajouter une règle de pare-feu au niveau de la base de données pour 203.0.113.40." } }
    - { id: d, text: { en: "Connect to PolicyDB and run sp_set_database_firewall_rule for 203.0.113.40.", fr: "Se connecter à PolicyDB et exécuter sp_set_database_firewall_rule pour 203.0.113.40." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      A database-level IP firewall rule is stored in one database and allows the address for that database only. The firewall checks the database-level rules of the requested database first, then the server-level rules, so 203.0.113.40 reaches PolicyDB but is refused by BrokerDB and BillingDB. Database-level rules are created with `sp_set_database_firewall_rule` while connected to the database, which is possible because sql-li-cac already has a server-level rule.
    fr: |
      Une règle de pare-feu IP au niveau de la base de données est stockée dans une seule base de données et n'autorise l'adresse que pour cette base. Le pare-feu vérifie d'abord les règles au niveau de la base de données demandée, puis les règles au niveau du serveur : 203.0.113.40 atteint donc PolicyDB mais est refusée par BrokerDB et BillingDB. Les règles au niveau de la base de données se créent avec `sp_set_database_firewall_rule` en étant connecté à la base, ce qui est possible car sql-li-cac a déjà une règle au niveau du serveur.
  options:
    a: { en: "sp_set_firewall_rule in master creates a server-level rule, which allows the address for every database of the server.", fr: "sp_set_firewall_rule dans master crée une règle au niveau du serveur, qui autorise l'adresse pour toutes les bases de données du serveur." }
    b: { en: "az sql server firewall-rule create also creates a server-level rule, which applies to BrokerDB and BillingDB too.", fr: "az sql server firewall-rule create crée aussi une règle au niveau du serveur, qui s'applique également à BrokerDB et BillingDB." }
    c: { en: "Database-level IP firewall rules can be created and managed only by using Transact-SQL, not in the Azure portal.", fr: "Les règles de pare-feu IP au niveau de la base de données ne peuvent être créées et gérées qu'avec Transact-SQL, pas dans le portail Azure." }
references:
  - title: Azure SQL Database IP firewall rules
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/firewall-configure
