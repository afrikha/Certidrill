id: dp300-2a-schema-deny-script
objective: "2.1.6"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    You have an Azure SQL database named **DB1**. A database user exists for the Microsoft Entra group **Analysts**. No permission is currently granted on the **Finance** schema.

    Members of Analysts must read every table in the Finance schema, including tables created later, except the table **Finance.Payroll**. You must use a custom database role, and the solution must follow the principle of least privilege.

    How should you complete the Transact-SQL script? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'une base de données Azure SQL nommée **DB1**. Un utilisateur de base de données existe pour le groupe Microsoft Entra **Analysts**. Aucune autorisation n'est accordée actuellement sur le schéma **Finance**.

    Les membres d'Analysts doivent lire toutes les tables du schéma Finance, y compris les tables créées ultérieurement, à l'exception de la table **Finance.Payroll**. Vous devez utiliser un rôle de base de données personnalisé, et la solution doit respecter le principe des privilèges minimum.

    Comment devez-vous compléter le script Transact-SQL ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: sql
  template: |
    CREATE ROLE FinanceReaders;

    [[a]] SELECT ON [[b]] TO FinanceReaders;
    [[c]] SELECT ON OBJECT::Finance.Payroll TO FinanceReaders;

    ALTER ROLE FinanceReaders ADD MEMBER [Analysts];
  slots:
    - id: a
      options:
        - { id: grant, text: GRANT }
        - { id: deny, text: DENY }
        - { id: revoke, text: REVOKE }
    - id: b
      options:
        - { id: db, text: "DATABASE::DB1" }
        - { id: dbo, text: "SCHEMA::dbo" }
        - { id: fin, text: "SCHEMA::Finance" }
    - id: c
      options:
        - { id: grant, text: GRANT }
        - { id: revoke, text: REVOKE }
        - { id: deny, text: DENY }
answer:
  values: { a: grant, b: fin, c: deny }
explanation:
  correct:
    en: |
      GRANT SELECT ON SCHEMA::Finance covers every current and future table of the schema and nothing else. An explicit DENY on Finance.Payroll then overrides the schema-level grant for that table.
    fr: |
      GRANT SELECT ON SCHEMA::Finance couvre toutes les tables actuelles et futures du schéma, et rien d'autre. Un DENY explicite sur Finance.Payroll l'emporte ensuite sur l'autorisation du schéma pour cette table.
  options:
    db: { en: "A database-scope grant would also cover the other schemas.", fr: "Une autorisation au niveau de la base couvrirait aussi les autres schémas." }
    revoke: { en: "REVOKE only removes a GRANT or DENY that exists at that scope; there is none on Finance.Payroll, so the schema grant would still apply.", fr: "REVOKE supprime seulement un GRANT ou un DENY existant à cette portée ; il n'y en a aucun sur Finance.Payroll, donc l'autorisation du schéma s'appliquerait toujours." }
references:
  - title: DENY Object Permissions (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/statements/deny-object-permissions-transact-sql
  - title: Authorize database access to Azure SQL Database
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/logins-create-manage
