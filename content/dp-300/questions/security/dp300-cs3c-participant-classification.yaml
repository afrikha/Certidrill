id: dp300-cs3c-participant-classification
objective: "2.3.1"
type: dropdown
caseStudy: dp300-cs3c-trey-research
difficulty: 1
status: draft
stem:
  en: |
    You need to meet the compliance requirements for the columns of dbo.Participants.

    What should you use? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez satisfaire les exigences de conformité concernant les colonnes de dbo.Participants.

    Que devez-vous utiliser ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      To classify the columns: [[classify]]

      To list the classified columns: [[list]]

      To record the classification of the returned data: [[record]]
    fr: |
      Pour classer les colonnes : [[classify]]

      Pour lister les colonnes classées : [[list]]

      Pour enregistrer la classification des données renvoyées : [[record]]
  slots:
    - id: classify
      options:
        - { id: extprop, text: "sp_addextendedproperty" }
        - { id: addsc, text: "ADD SENSITIVITY CLASSIFICATION" }
        - { id: masked, text: "ALTER TABLE ... ALTER COLUMN ... ADD MASKED WITH" }
    - id: list
      options:
        - { id: masked_v, text: "sys.masked_columns" }
        - { id: extprop_v, text: "sys.extended_properties" }
        - { id: sc_v, text: "sys.sensitivity_classifications" }
    - id: record
      options:
        - { id: audit, text: { en: "The data_sensitivity_information field of SQL Managed Instance auditing", fr: "Le champ data_sensitivity_information de l'audit SQL Managed Instance" } }
        - { id: qs, text: { en: "The Query Store runtime statistics of TrialData", fr: "Les statistiques d'exécution du Magasin des requêtes de TrialData" } }
        - { id: cdc, text: { en: "Change data capture on dbo.Participants", fr: "La capture des changements de données sur dbo.Participants" } }
answer:
  values: { classify: addsc, list: sc_v, record: audit }
explanation:
  correct:
    en: |
      `ADD SENSITIVITY CLASSIFICATION` sets the label and information type of columns with the built-in Data Discovery & Classification feature, and `sys.sensitivity_classifications` lists the classified columns. Auditing writes the classifications of the data that each query returns in the `data_sensitivity_information` field of the audit log.
    fr: |
      `ADD SENSITIVITY CLASSIFICATION` définit l'étiquette et le type d'informations de colonnes avec la fonctionnalité intégrée Découverte et classification des données, et `sys.sensitivity_classifications` liste les colonnes classées. L'audit écrit les classifications des données renvoyées par chaque requête dans le champ `data_sensitivity_information` du journal d'audit.
  options:
    extprop: { en: "Extended properties are free-form metadata that auditing does not recognize as sensitivity classifications.", fr: "Les propriétés étendues sont des métadonnées libres que l'audit ne reconnaît pas comme des classifications de sensibilité." }
    masked: { en: "Dynamic data masking hides values from non-privileged users; it does not classify the columns.", fr: "Le masquage dynamique des données masque les valeurs aux utilisateurs non privilégiés ; il ne classe pas les colonnes." }
    masked_v: { en: "sys.masked_columns lists the columns that have a dynamic data mask.", fr: "sys.masked_columns liste les colonnes qui ont un masque dynamique des données." }
    extprop_v: { en: "sys.extended_properties returns extended properties, not the built-in classifications.", fr: "sys.extended_properties renvoie les propriétés étendues, pas les classifications intégrées." }
    qs: { en: "Query Store keeps query texts, plans and runtime statistics, not the sensitivity of the returned data.", fr: "Le Magasin des requêtes conserve le texte des requêtes, les plans et les statistiques d'exécution, pas la sensibilité des données renvoyées." }
    cdc: { en: "Change data capture records the changes made to rows, not the data returned by queries.", fr: "La capture des changements de données enregistre les modifications apportées aux lignes, pas les données renvoyées par les requêtes." }
references:
  - title: ADD SENSITIVITY CLASSIFICATION (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/statements/add-sensitivity-classification-transact-sql
  - title: Data Discovery & Classification
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/data-discovery-and-classification-overview
