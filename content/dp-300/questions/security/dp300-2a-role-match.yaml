id: dp300-2a-role-match
objective: "2.1.6"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    You have an Azure SQL Database logical server named **sql1** that hosts a database named **DB1**. Four teams need access. Each team must receive only the permissions it needs.

    What should you grant to each team? To answer, drag the appropriate roles or permissions to the correct teams. Each role or permission may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un serveur logique Azure SQL Database nommé **sql1** qui héberge une base de données nommée **DB1**. Quatre équipes ont besoin d'accès. Chaque équipe ne doit recevoir que les autorisations dont elle a besoin.

    Que devez-vous accorder à chaque équipe ? Pour répondre, faites glisser les rôles ou autorisations appropriés vers les équipes correspondantes. Chaque rôle ou autorisation peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: ssm, text: { en: "Azure role SQL Security Manager", fr: "Rôle Azure SQL Security Manager" } }
    - { id: dbc, text: { en: "Azure role SQL DB Contributor", fr: "Rôle Azure SQL DB Contributor" } }
    - { id: owner, text: { en: "Azure role Owner", fr: "Rôle Azure Owner" } }
    - { id: vds, text: { en: "VIEW DATABASE STATE permission in DB1", fr: "Autorisation VIEW DATABASE STATE dans DB1" } }
    - { id: dr, text: { en: "db_datareader role in DB1", fr: "Rôle db_datareader dans DB1" } }
    - { id: dbo, text: { en: "db_owner role in DB1", fr: "Rôle db_owner dans DB1" } }
  targets:
    - id: t1
      text: { en: "Security: configure auditing and the firewall of sql1 in the Azure portal, without access to the data", fr: "Sécurité : configurer l'audit et le pare-feu de sql1 dans le portail Azure, sans accès aux données" }
    - id: t2
      text: { en: "Operations: scale, copy and restore DB1 in the Azure portal, without changing security policies", fr: "Exploitation : mettre à l'échelle, copier et restaurer DB1 dans le portail Azure, sans modifier les stratégies de sécurité" }
    - id: t3
      text: { en: "Performance: query the dynamic management views of DB1, without reading table data", fr: "Performances : interroger les vues de gestion dynamique de DB1, sans lire les données des tables" }
    - id: t4
      text: { en: "Reporting: read every table in DB1", fr: "Rapports : lire toutes les tables de DB1" }
answer:
  mapping: { t1: ssm, t2: dbc, t3: vds, t4: dr }
explanation:
  correct:
    en: |
      SQL Security Manager manages the security-related policies of SQL servers and databases, such as auditing and firewall rules. SQL DB Contributor manages databases but excludes their security-related policies. VIEW DATABASE STATE exposes the database DMVs without any SELECT on tables, and db_datareader reads every table. Owner and db_owner grant far more than any of the needs.
    fr: |
      SQL Security Manager gère les stratégies liées à la sécurité des serveurs et bases de données SQL, comme l'audit et les règles de pare-feu. SQL DB Contributor gère les bases de données mais exclut leurs stratégies de sécurité. VIEW DATABASE STATE expose les vues de gestion dynamique de la base sans aucun SELECT sur les tables, et db_datareader lit toutes les tables. Owner et db_owner accordent bien plus qu'aucun de ces besoins.
references:
  - title: Azure built-in roles for Databases
    url: https://learn.microsoft.com/en-us/azure/role-based-access-control/built-in-roles/databases
