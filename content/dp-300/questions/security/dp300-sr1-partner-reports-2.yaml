id: dp300-sr1-partner-reports-2
objective: "2.2.3"
type: series_yesno
series: dp300-sr1-partner-reports
seriesOrder: 2
difficulty: 3
status: draft
stem:
  en: |
    You create a database-level firewall rule in master.
  fr: |
    Vous créez une règle de pare-feu au niveau de la base de données dans master.
body:
  solution:
    en: |
      You connect to the **master** database of sql-wingtip-prod as the server admin and run the following statement:

      `EXECUTE sp_set_database_firewall_rule @name = N'PartnerReports', @start_ip_address = '198.51.100.25', @end_ip_address = '198.51.100.25';`
    fr: |
      Vous vous connectez à la base de données **master** de sql-wingtip-prod en tant qu'administrateur du serveur et exécutez l'instruction suivante :

      `EXECUTE sp_set_database_firewall_rule @name = N'PartnerReports', @start_ip_address = '198.51.100.25', @end_ip_address = '198.51.100.25';`
answer: { value: false }
explanation:
  correct:
    en: |
      A database-level rule applies only to the database in which it is created, here master. When the tool connects to Orders, the firewall checks the database-level rules of Orders, then the server-level rules; neither matches 198.51.100.25, so the connection is rejected.
    fr: |
      Une règle au niveau de la base de données s'applique uniquement à la base dans laquelle elle est créée, ici master. Quand l'outil se connecte à Orders, le pare-feu vérifie les règles au niveau de la base d'Orders, puis les règles au niveau du serveur ; aucune ne correspond à 198.51.100.25, donc la connexion est refusée.
references:
  - title: Azure SQL Database IP firewall rules
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/firewall-configure
