id: dp300-2b-enclave-attested-platform
objective: "2.2.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Contoso plans to host a new database that uses Always Encrypted with secure enclaves for range queries on encrypted columns. The security team has the following requirements:

    - Client applications must attest the enclave before they send column encryption keys to it.
    - The chosen enclave technology must remain supported after 2027.

    Which hosting option should you recommend?
  fr: |
    Contoso prévoit d'héberger une nouvelle base de données qui utilise Always Encrypted avec enclaves sécurisées pour des requêtes de plage sur des colonnes chiffrées. L'équipe de sécurité a les exigences suivantes :

    - Les applications clientes doivent attester l'enclave avant de lui envoyer les clés de chiffrement de colonne.
    - La technologie d'enclave choisie doit rester prise en charge après 2027.

    Quelle option d'hébergement devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "Azure SQL Database on standard-series hardware with VBS enclaves and Microsoft Azure Attestation", fr: "Azure SQL Database sur du matériel de série standard avec des enclaves VBS et Microsoft Azure Attestation" } }
    - { id: b, text: { en: "Azure SQL Database on DC-series hardware with Intel SGX enclaves and Microsoft Azure Attestation", fr: "Azure SQL Database sur du matériel de série DC avec des enclaves Intel SGX et Microsoft Azure Attestation" } }
    - { id: c, text: { en: "SQL Server 2022 on an Azure virtual machine with Intel SGX enclaves and Microsoft Azure Attestation", fr: "SQL Server 2022 sur une machine virtuelle Azure avec des enclaves Intel SGX et Microsoft Azure Attestation" } }
    - { id: d, text: { en: "SQL Server 2022 on an Azure virtual machine with VBS enclaves and Host Guardian Service attestation", fr: "SQL Server 2022 sur une machine virtuelle Azure avec des enclaves VBS et l'attestation par le Service Guardian hôte" } }
answer: { optionId: d }
explanation:
  correct:
    en: "SQL Server 2019 and later support VBS enclaves with Host Guardian Service (HGS) attestation or without attestation, so HGS meets the attestation requirement. In Azure SQL Database, VBS enclaves do not support attestation, and the only attested option, Intel SGX on DC-series hardware, reaches the end of support on October 31, 2027."
    fr: "SQL Server 2019 et versions ultérieures prennent en charge les enclaves VBS avec l'attestation par le Service Guardian hôte (HGS) ou sans attestation : HGS satisfait l'exigence d'attestation. Dans Azure SQL Database, les enclaves VBS ne prennent pas en charge l'attestation, et la seule option attestée, Intel SGX sur du matériel de série DC, arrive en fin de prise en charge le 31 octobre 2027."
  options:
    a: { en: "VBS enclaves in Azure SQL Database do not support attestation.", fr: "Les enclaves VBS d'Azure SQL Database ne prennent pas en charge l'attestation." }
    b: { en: "Intel SGX enclaves in Azure SQL Database reach the end of support on October 31, 2027.", fr: "Les enclaves Intel SGX d'Azure SQL Database arrivent en fin de prise en charge le 31 octobre 2027." }
    c: { en: "SQL Server supports VBS enclaves only; Intel SGX enclaves are not supported.", fr: "SQL Server ne prend en charge que les enclaves VBS ; les enclaves Intel SGX ne sont pas prises en charge." }
references:
  - title: Always Encrypted with secure enclaves
    url: https://learn.microsoft.com/en-us/sql/relational-databases/security/encryption/always-encrypted-enclaves
