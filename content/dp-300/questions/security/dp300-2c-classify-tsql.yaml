id: dp300-2c-classify-tsql
objective: "2.3.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have an Azure SQL database named DB1 that contains a table named Sales.Customer. The table contains columns named Email and Phone.

    A developer must classify both columns with the label Confidential and the information type Contact Info by using a Transact-SQL deployment script. The classification must appear in the Data Discovery & Classification dashboard of DB1, and the audit log must report the label when a query returns these columns.

    Which statement should the script contain?
  fr: |
    Vous disposez d'une base de données Azure SQL nommée DB1 qui contient une table nommée Sales.Customer. La table contient les colonnes Email et Phone.

    Un développeur doit classifier les deux colonnes avec l'étiquette Confidential et le type d'informations Contact Info au moyen d'un script de déploiement Transact-SQL. La classification doit apparaître dans le tableau de bord Découverte et classification des données de DB1, et le journal d'audit doit indiquer l'étiquette lorsqu'une requête renvoie ces colonnes.

    Quelle instruction le script doit-il contenir ?
body:
  options:
    - id: a
      text: "EXEC sp_addextendedproperty @name = N'sys_sensitivity_label_name', @value = N'Confidential', @level0type = N'SCHEMA', @level0name = N'Sales', @level1type = N'TABLE', @level1name = N'Customer', @level2type = N'COLUMN', @level2name = N'Email';"
    - id: b
      text: "GRANT ALTER ANY SENSITIVITY CLASSIFICATION TO Developers;"
    - id: c
      text: "SELECT * FROM sys.sensitivity_classifications WHERE label = 'Confidential';"
    - id: d
      text: "ADD SENSITIVITY CLASSIFICATION TO Sales.Customer.Email, Sales.Customer.Phone WITH (LABEL = 'Confidential', INFORMATION_TYPE = 'Contact Info');"
answer:
  optionId: d
explanation:
  correct:
    en: |
      ADD SENSITIVITY CLASSIFICATION adds or updates the classification of one or more columns in a single statement, with a label and an information type. The classification is stored as sensitivity metadata, visible in sys.sensitivity_classifications and in the portal, and auditing reports it in the data_sensitivity_information field. T-SQL does not validate the label against the policy, so the developer must use the exact label name.
    fr: |
      ADD SENSITIVITY CLASSIFICATION ajoute ou met à jour la classification d'une ou plusieurs colonnes en une seule instruction, avec une étiquette et un type d'informations. La classification est stockée comme métadonnée de sensibilité, visible dans sys.sensitivity_classifications et dans le portail, et l'audit l'indique dans le champ data_sensitivity_information. T-SQL ne valide pas l'étiquette par rapport à la stratégie : le développeur doit utiliser le nom exact de l'étiquette.
  options:
    a: { en: "Extended properties are how SSMS stored classifications for SQL Server 2017 and earlier; they are not the sensitivity classification metadata that the dashboard and auditing use.", fr: "Les propriétés étendues sont la façon dont SSMS stockait les classifications pour SQL Server 2017 et versions antérieures ; ce ne sont pas les métadonnées de classification de sensibilité qu'utilisent le tableau de bord et l'audit." }
    b: { en: "This grants the permission to manage classifications, but it does not classify any column.", fr: "Cette instruction accorde l'autorisation de gérer les classifications, mais elle ne classifie aucune colonne." }
    c: { en: "This query only lists existing classifications; it does not add any.", fr: "Cette requête liste seulement les classifications existantes ; elle n'en ajoute aucune." }
references:
  - title: ADD SENSITIVITY CLASSIFICATION (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/statements/add-sensitivity-classification-transact-sql
  - title: SQL Data Discovery and Classification
    url: https://learn.microsoft.com/en-us/sql/relational-databases/security/sql-data-discovery-and-classification
