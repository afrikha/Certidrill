id: dp300-2b-enclave-attestation-none
objective: "2.2.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have an Azure SQL database named **HR** that uses the vCore purchasing model with standard-series (Gen5) hardware. You enable secure enclaves for HR and encrypt the LastName column in place with an enclave-enabled column encryption key.

    An application must run queries that use LIKE on LastName. The application already uses Column Encryption Setting=Enabled.

    Which setting should you add to the connection string of the application?
  fr: |
    Vous disposez d'une base de données Azure SQL nommée **HR** qui utilise le modèle d'achat vCore avec du matériel de série standard (Gen5). Vous activez les enclaves sécurisées pour HR et chiffrez sur place la colonne LastName avec une clé de chiffrement de colonne compatible enclave.

    Une application doit exécuter des requêtes qui utilisent LIKE sur LastName. L'application utilise déjà Column Encryption Setting=Enabled.

    Quel paramètre devez-vous ajouter à la chaîne de connexion de l'application ?
body:
  options:
    - { id: a, text: "Attestation Protocol=HGS" }
    - { id: b, text: "Attestation Protocol=AAS" }
    - { id: c, text: "Attestation Protocol=None" }
    - { id: d, text: "Encrypt=Strict" }
answer: { optionId: c }
explanation:
  correct:
    en: "On standard-series hardware, Azure SQL Database uses VBS enclaves, and VBS enclaves in Azure SQL Database do not support attestation. The client therefore enables enclave computations with the attestation protocol None."
    fr: "Sur du matériel de série standard, Azure SQL Database utilise des enclaves VBS, et les enclaves VBS d'Azure SQL Database ne prennent pas en charge l'attestation. Le client active donc les calculs d'enclave avec le protocole d'attestation None."
  options:
    a: { en: "Host Guardian Service attestation is available for VBS enclaves in SQL Server, not in Azure SQL Database.", fr: "L'attestation par le Service Guardian hôte est disponible pour les enclaves VBS dans SQL Server, pas dans Azure SQL Database." }
    b: { en: "Microsoft Azure Attestation is used only with Intel SGX enclaves on DC-series hardware.", fr: "Microsoft Azure Attestation n'est utilisé qu'avec les enclaves Intel SGX sur du matériel de série DC." }
    d: { en: "Encrypt=Strict controls TLS for the connection; it does not enable enclave computations.", fr: "Encrypt=Strict contrôle le TLS de la connexion ; il n'active pas les calculs d'enclave." }
references:
  - title: Always Encrypted with secure enclaves
    url: https://learn.microsoft.com/en-us/sql/relational-databases/security/encryption/always-encrypted-enclaves
