id: dp300-cs1a-supervisor-access
objective: "2.1.4"
type: dropdown
caseStudy: dp300-cs1a-lucerne-logistics
difficulty: 2
status: draft
stem:
  en: |
    FreightOps has been migrated to MI1. You need to meet the security requirements for the warehouse supervisors. You sign in to MI1 as the Microsoft Entra admin.

    How should you complete the Transact-SQL script? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    FreightOps a été migrée vers MI1. Vous devez satisfaire les exigences de sécurité concernant les responsables d'entrepôt. Vous vous connectez à MI1 en tant qu'administrateur Microsoft Entra.

    Comment devez-vous compléter le script Transact-SQL ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: sql
  template: |
    USE master;
    CREATE LOGIN [SG-Freight-Ops] [[login]];
    GO
    USE FreightOps;
    CREATE USER [SG-Freight-Ops] [[user]];
    ALTER ROLE [[role]] ADD MEMBER [SG-Freight-Ops];
  slots:
    - id: login
      options:
        - { id: ext, text: "FROM EXTERNAL PROVIDER" }
        - { id: win, text: "FROM WINDOWS" }
        - { id: pwd, text: "WITH PASSWORD = 'P@ssw0rd-2026'" }
    - id: user
      options:
        - { id: nologin, text: "WITHOUT LOGIN" }
        - { id: fromlogin, text: "FROM LOGIN [SG-Freight-Ops]" }
        - { id: pwduser, text: "WITH PASSWORD = 'P@ssw0rd-2026'" }
    - id: role
      options:
        - { id: owner, text: db_owner }
        - { id: writer, text: db_datawriter }
        - { id: reader, text: db_datareader }
        - { id: ddl, text: db_ddladmin }
answer:
  values: { login: ext, user: fromlogin, role: reader }
explanation:
  correct:
    en: "`CREATE LOGIN ... FROM EXTERNAL PROVIDER`, run in master by the Microsoft Entra admin, creates a server principal for the Microsoft Entra group, so every member signs in with their own Microsoft Entra identity. `CREATE USER ... FROM LOGIN` maps the group login to a user in FreightOps, and membership in db_datareader grants read access to all tables and views, nothing more."
    fr: "`CREATE LOGIN ... FROM EXTERNAL PROVIDER`, exécuté dans master par l'administrateur Microsoft Entra, crée un principal de serveur pour le groupe Microsoft Entra : chaque membre se connecte avec sa propre identité Microsoft Entra. `CREATE USER ... FROM LOGIN` associe la connexion du groupe à un utilisateur de FreightOps, et l'appartenance à db_datareader accorde la lecture de toutes les tables et vues, sans plus."
  options:
    win: { en: "FROM WINDOWS creates a login for an AD DS account or group; SQL Managed Instance does not support Windows logins and uses Microsoft Entra logins instead.", fr: "FROM WINDOWS crée une connexion pour un compte ou un groupe AD DS ; SQL Managed Instance ne prend pas en charge les connexions Windows et utilise à la place des connexions Microsoft Entra." }
    pwd: { en: "WITH PASSWORD creates a SQL authentication login, which the requirements forbid.", fr: "WITH PASSWORD crée une connexion d'authentification SQL, ce que les exigences interdisent." }
    nologin: { en: "A user without login cannot be used to sign in; it is meant for impersonation inside the database.", fr: "Un utilisateur sans connexion ne permet pas de se connecter ; il sert à l'emprunt d'identité dans la base de données." }
    pwduser: { en: "A contained user with a password uses SQL authentication, not Microsoft Entra authentication.", fr: "Un utilisateur contenu avec mot de passe utilise l'authentification SQL, pas l'authentification Microsoft Entra." }
    owner: { en: "db_owner grants full control of the database, which violates least privilege.", fr: "db_owner accorde le contrôle total de la base de données, ce qui enfreint le principe des privilèges minimum." }
    writer: { en: "db_datawriter grants INSERT, UPDATE and DELETE but not SELECT.", fr: "db_datawriter accorde INSERT, UPDATE et DELETE, mais pas SELECT." }
    ddl: { en: "db_ddladmin allows schema changes and does not grant read access to the data.", fr: "db_ddladmin permet de modifier le schéma et n'accorde pas la lecture des données." }
references:
  - title: Microsoft Entra server principals
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/authentication-azure-ad-logins
