id: dp300-2a-entra-only-role
objective: "2.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have an Azure subscription that contains a resource group named **RG-Data**. RG-Data contains four Azure SQL Database logical servers. Each server already has a Microsoft Entra admin.

    A security engineer named **Ines** must be able to enable and disable Microsoft Entra-only authentication on the four servers. Ines must not be able to create, scale or delete databases. The solution must follow the principle of least privilege.

    Which Azure role should you assign to Ines on RG-Data?
  fr: |
    Vous disposez d'un abonnement Azure qui contient un groupe de ressources nommé **RG-Data**. RG-Data contient quatre serveurs logiques Azure SQL Database. Chaque serveur dispose déjà d'un administrateur Microsoft Entra.

    Une ingénieure sécurité nommée **Ines** doit pouvoir activer et désactiver l'authentification Microsoft Entra uniquement sur les quatre serveurs. Ines ne doit pas pouvoir créer, mettre à l'échelle ni supprimer des bases de données. La solution doit respecter le principe des privilèges minimum.

    Quel rôle Azure devez-vous attribuer à Ines sur RG-Data ?
body:
  options:
    - { id: a, text: SQL Server Contributor }
    - { id: b, text: Contributor }
    - { id: c, text: SQL Security Manager }
    - { id: d, text: SQL DB Contributor }
answer: { optionId: c }
explanation:
  correct:
    en: SQL Security Manager manages the security-related policies of SQL servers and databases, which includes the Microsoft Entra-only authentication setting, without managing the databases themselves or the access to their data. It is the narrowest built-in role that can change this setting.
    fr: SQL Security Manager gère les stratégies liées à la sécurité des serveurs et bases de données SQL, dont le paramètre d'authentification Microsoft Entra uniquement, sans gérer les bases elles-mêmes ni l'accès à leurs données. C'est le rôle intégré le plus restreint qui peut modifier ce paramètre.
  options:
    a:
      en: SQL Server Contributor can set or remove the Microsoft Entra admin but can't change the Microsoft Entra-only authentication setting, and it manages databases.
      fr: SQL Server Contributor peut définir ou supprimer l'administrateur Microsoft Entra, mais ne peut pas modifier le paramètre d'authentification Microsoft Entra uniquement, et il gère les bases de données.
    b:
      en: Contributor can change the setting, but it also lets Ines create, scale and delete databases and every other resource of the group.
      fr: Contributor peut modifier le paramètre, mais permet aussi à Ines de créer, mettre à l'échelle et supprimer des bases et toutes les autres ressources du groupe.
    d:
      en: SQL DB Contributor manages databases and excludes the security-related policies of the servers.
      fr: SQL DB Contributor gère les bases de données et exclut les stratégies liées à la sécurité des serveurs.
references:
  - title: Microsoft Entra-only authentication with Azure SQL
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/authentication-azure-ad-only-authentication
  - title: Azure built-in roles for Databases
    url: https://learn.microsoft.com/en-us/azure/role-based-access-control/built-in-roles/databases
