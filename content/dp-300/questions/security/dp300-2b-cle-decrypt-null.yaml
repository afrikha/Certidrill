id: dp300-2b-cle-decrypt-null
objective: "2.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have an Azure SQL database named **Billing**. The CardNumberEnc column of the Sales.Payment table was encrypted with ENCRYPTBYKEY by using a symmetric key named **CardKey** that is protected by a certificate named **CardCert**.

    A developer connects to Billing and runs the following query. The query returns NULL for every row and no error.

    ```sql
    SELECT CONVERT(nvarchar(25), DECRYPTBYKEY(CardNumberEnc)) AS CardNumber
    FROM Sales.Payment;
    ```

    You need to ensure that the query returns the card numbers.

    What should the developer do?
  fr: |
    Vous disposez d'une base de données Azure SQL nommée **Billing**. La colonne CardNumberEnc de la table Sales.Payment a été chiffrée avec ENCRYPTBYKEY à l'aide d'une clé symétrique nommée **CardKey** protégée par un certificat nommé **CardCert**.

    Un développeur se connecte à Billing et exécute la requête suivante. La requête renvoie NULL pour chaque ligne, sans erreur.

    ```sql
    SELECT CONVERT(nvarchar(25), DECRYPTBYKEY(CardNumberEnc)) AS CardNumber
    FROM Sales.Payment;
    ```

    Vous devez vous assurer que la requête renvoie les numéros de carte.

    Que doit faire le développeur ?
body:
  options:
    - { id: a, text: { en: "Pass KEY_GUID('CardKey') as the first argument of DECRYPTBYKEY.", fr: "Passer KEY_GUID('CardKey') comme premier argument de DECRYPTBYKEY." } }
    - { id: b, text: { en: "Run OPEN SYMMETRIC KEY CardKey DECRYPTION BY CERTIFICATE CardCert in the session first.", fr: "Exécuter d'abord OPEN SYMMETRIC KEY CardKey DECRYPTION BY CERTIFICATE CardCert dans la session." } }
    - { id: c, text: { en: "Add Column Encryption Setting=Enabled to the connection string of the session.", fr: "Ajouter Column Encryption Setting=Enabled à la chaîne de connexion de la session." } }
    - { id: d, text: { en: "Grant the UNMASK permission on the Sales.Payment table to the developer.", fr: "Accorder au développeur l'autorisation UNMASK sur la table Sales.Payment." } }
answer: { optionId: b }
explanation:
  correct:
    en: "DECRYPTBYKEY uses a symmetric key that must already be open in the current session, and it returns NULL when the key is not open. Opening CardKey with its protecting certificate makes the key available for the rest of the session; CLOSE SYMMETRIC KEY closes it when the work is done."
    fr: "DECRYPTBYKEY utilise une clé symétrique qui doit déjà être ouverte dans la session actuelle, et renvoie NULL lorsque la clé n'est pas ouverte. Ouvrir CardKey avec son certificat de protection rend la clé disponible pour le reste de la session ; CLOSE SYMMETRIC KEY la ferme une fois le travail terminé."
  options:
    a: { en: "DECRYPTBYKEY takes no key GUID: the ciphertext identifies the key. The key GUID is an argument of ENCRYPTBYKEY.", fr: "DECRYPTBYKEY ne prend pas de GUID de clé : le texte chiffré identifie la clé. Le GUID de la clé est un argument d'ENCRYPTBYKEY." }
    c: { en: "Column Encryption Setting enables Always Encrypted in the client driver; it has no effect on keys used by ENCRYPTBYKEY inside the database.", fr: "Column Encryption Setting active Always Encrypted dans le pilote client ; il n'a aucun effet sur les clés utilisées par ENCRYPTBYKEY dans la base." }
    d: { en: "UNMASK relates to dynamic data masking; the column is encrypted, not masked.", fr: "UNMASK concerne le masquage dynamique des données ; la colonne est chiffrée, pas masquée." }
references:
  - title: DECRYPTBYKEY (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/functions/decryptbykey-transact-sql
