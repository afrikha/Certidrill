id: dp300-cs3a-api-permissions
objective: "2.1.8"
type: dropdown
caseStudy: dp300-cs3a-lamna-insurance
difficulty: 2
status: draft
stem:
  en: |
    PolicyDB has been migrated to sql-li-cac. You connect to PolicyDB as a member of the Microsoft Entra admin group of sql-li-cac. You need to meet the security requirements for mi-quote-api.

    How should you complete the Transact-SQL script? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    PolicyDB a été migrée vers sql-li-cac. Vous vous connectez à PolicyDB en tant que membre du groupe administrateur Microsoft Entra de sql-li-cac. Vous devez satisfaire les exigences de sécurité concernant mi-quote-api.

    Comment devez-vous compléter le script Transact-SQL ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: sql
  template: |
    CREATE USER [mi-quote-api] [[create]];
    GO
    GRANT [[perm]] ON [[scope]] TO [mi-quote-api];
  slots:
    - id: create
      options:
        - { id: ext, text: "FROM EXTERNAL PROVIDER" }
        - { id: login, text: "FROM LOGIN [mi-quote-api]" }
        - { id: nologin, text: "WITHOUT LOGIN" }
    - id: perm
      options:
        - { id: select, text: SELECT }
        - { id: execute, text: EXECUTE }
        - { id: control, text: CONTROL }
        - { id: alter, text: ALTER }
    - id: scope
      options:
        - { id: schema, text: "SCHEMA::Quote" }
        - { id: database, text: "DATABASE::PolicyDB" }
        - { id: dbo, text: "SCHEMA::dbo" }
answer:
  values: { create: ext, perm: execute, scope: schema }
explanation:
  correct:
    en: |
      `CREATE USER ... FROM EXTERNAL PROVIDER`, run by a Microsoft Entra principal that has ALTER ANY USER, creates a contained database user for the managed identity, with no login in master. EXECUTE granted on the Quote schema covers every procedure in the schema, including the procedures created later. Ownership chaining lets the procedures read the tables that they use, while the identity has no SELECT permission on the tables.
    fr: |
      `CREATE USER ... FROM EXTERNAL PROVIDER`, exécuté par un principal Microsoft Entra qui dispose d'ALTER ANY USER, crée un utilisateur de base de données contenu pour l'identité managée, sans connexion dans master. L'autorisation EXECUTE accordée sur le schéma Quote couvre toutes les procédures du schéma, y compris celles créées plus tard. Le chaînage des propriétés permet aux procédures de lire les tables qu'elles utilisent, alors que l'identité n'a aucune autorisation SELECT sur les tables.
  options:
    login: { en: "FROM LOGIN maps the user to a server login, which would have to be created in master, against the requirements.", fr: "FROM LOGIN associe l'utilisateur à une connexion de serveur, qui devrait être créée dans master, contrairement aux exigences." }
    nologin: { en: "A user without login cannot authenticate; it is used only for impersonation inside the database.", fr: "Un utilisateur sans connexion ne peut pas s'authentifier ; il sert uniquement à l'emprunt d'identité dans la base de données." }
    select: { en: "SELECT lets the identity read tables and views directly and does not allow it to run procedures.", fr: "SELECT permet à l'identité de lire directement les tables et les vues, et ne lui permet pas d'exécuter des procédures." }
    control: { en: "CONTROL grants every permission on the securable, far more than running procedures.", fr: "CONTROL accorde toutes les autorisations sur l'élément sécurisable, bien plus que l'exécution de procédures." }
    alter: { en: "ALTER allows changing the objects of the securable, not running them.", fr: "ALTER permet de modifier les objets de l'élément sécurisable, pas de les exécuter." }
    database: { en: "EXECUTE at the database scope also covers the procedures of every other schema, which violates least privilege.", fr: "EXECUTE à l'étendue de la base de données couvre aussi les procédures de tous les autres schémas, ce qui enfreint le principe des privilèges minimum." }
    dbo: { en: "The procedures to run are in the Quote schema, not in dbo.", fr: "Les procédures à exécuter se trouvent dans le schéma Quote, pas dans dbo." }
references:
  - title: Configure and manage Microsoft Entra authentication with Azure SQL
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/authentication-aad-configure
  - title: GRANT Schema Permissions (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/statements/grant-schema-permissions-transact-sql
