id: dp300-2b-pe-dns-resolution
objective: "2.2.6"
type: single
difficulty: 3
status: draft
stem:
  en: |
    You have an Azure SQL Database logical server named **sql-adatum**. You create a private endpoint for sql-adatum in a subnet of a virtual network named **VNet-App**, and then you select **Deny public network access**.

    An application on a virtual machine in VNet-App connects to sql-adatum.database.windows.net and now fails. From the virtual machine, the name sql-adatum.database.windows.net resolves to a public IP address. A private DNS zone named privatelink.database.windows.net contains an A record for sql-adatum.

    You need to ensure that the application connects through the private endpoint.

    What should you do?
  fr: |
    Vous disposez d'un serveur logique Azure SQL Database nommé **sql-adatum**. Vous créez un point de terminaison privé pour sql-adatum dans un sous-réseau d'un réseau virtuel nommé **VNet-App**, puis vous sélectionnez **Deny public network access**.

    Une application sur une machine virtuelle de VNet-App se connecte à sql-adatum.database.windows.net et échoue désormais. Depuis la machine virtuelle, le nom sql-adatum.database.windows.net est résolu en une adresse IP publique. Une zone DNS privée nommée privatelink.database.windows.net contient un enregistrement A pour sql-adatum.

    Vous devez vous assurer que l'application se connecte par le point de terminaison privé.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Link the privatelink.database.windows.net private DNS zone to VNet-App.", fr: "Lier la zone DNS privée privatelink.database.windows.net à VNet-App." } }
    - { id: b, text: { en: "Change the connection string to use sql-adatum.privatelink.database.windows.net.", fr: "Modifier la chaîne de connexion pour utiliser sql-adatum.privatelink.database.windows.net." } }
    - { id: c, text: { en: "Change the connection string to use the private IP address of the endpoint.", fr: "Modifier la chaîne de connexion pour utiliser l'adresse IP privée du point de terminaison." } }
    - { id: d, text: { en: "Enable the Microsoft.Sql service endpoint on the subnet of the virtual machine.", fr: "Activer le point de terminaison de service Microsoft.Sql sur le sous-réseau de la machine virtuelle." } }
answer: { optionId: a }
explanation:
  correct:
    en: "Clients must keep using the server FQDN, which must resolve to the private IP address of the endpoint. The A record exists, but VNet-App only uses the private DNS zone once the zone is linked to it; after that, sql-adatum.database.windows.net resolves through the privatelink alias to the private IP address."
    fr: "Les clients doivent continuer à utiliser le nom de domaine complet du serveur, qui doit être résolu en l'adresse IP privée du point de terminaison. L'enregistrement A existe, mais VNet-App n'utilise la zone DNS privée qu'une fois la zone liée au réseau ; ensuite, sql-adatum.database.windows.net est résolu par l'alias privatelink en l'adresse IP privée."
  options:
    b: { en: "Logins that use the privatelink FQDN fail by design: the SQL gateway needs the server FQDN to route the login.", fr: "Les connexions qui utilisent le nom de domaine complet privatelink échouent par conception : la passerelle SQL a besoin du nom de domaine complet du serveur pour router la connexion." }
    c: { en: "Logins made directly to the private IP address also fail by design.", fr: "Les connexions établies directement vers l'adresse IP privée échouent elles aussi par conception." }
    d: { en: "A service endpoint sends traffic to the public endpoint, which is now denied; it does not use the private endpoint.", fr: "Un point de terminaison de service envoie le trafic vers le point de terminaison public, désormais refusé ; il n'utilise pas le point de terminaison privé." }
references:
  - title: Azure Private Link for Azure SQL Database
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/private-endpoint-overview
