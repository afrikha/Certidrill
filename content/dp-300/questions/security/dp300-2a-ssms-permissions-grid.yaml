id: dp300-2a-ssms-permissions-grid
objective: "2.1.5"
type: hotarea
difficulty: 2
status: draft
stem:
  en: |
    You have an Azure SQL database named **DB1**. A database user named **Rafael** is a member of **db_datawriter** and has no other permission.

    In SQL Server Management Studio, you open the properties of the table **dbo.Invoices**, select the **Permissions** page and add Rafael. The explicit permissions for Rafael are shown in the following table.

    You need to meet the following requirements:

    - Rafael must be able to read dbo.Invoices and to give read access on it to other users.
    - Rafael must not be able to delete rows from dbo.Invoices.

    Which check box should you select for each requirement?

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'une base de données Azure SQL nommée **DB1**. Un utilisateur de base de données nommé **Rafael** est membre de **db_datawriter** et n'a aucune autre autorisation.

    Dans SQL Server Management Studio, vous ouvrez les propriétés de la table **dbo.Invoices**, sélectionnez la page **Permissions** et ajoutez Rafael. Les autorisations explicites de Rafael figurent dans le tableau suivant.

    Vous devez satisfaire les exigences suivantes :

    - Rafael doit pouvoir lire dbo.Invoices et donner à d'autres utilisateurs l'accès en lecture à cette table.
    - Rafael ne doit pas pouvoir supprimer de lignes de dbo.Invoices.

    Quelle case devez-vous cocher pour chaque exigence ?

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
    - id: p1
      text: { en: "Read dbo.Invoices and give read access to other users", fr: "Lire dbo.Invoices et donner l'accès en lecture à d'autres utilisateurs" }
    - id: p2
      text: { en: "Prevent Rafael from deleting rows", fr: "Empêcher Rafael de supprimer des lignes" }
  grid:
    caption: { en: "Permissions for Rafael - Explicit", fr: "Autorisations de Rafael - Explicit" }
    header: [Permission, Grantor, Grant, With Grant, Deny]
    rows:
      - [{ text: Delete }, { text: dbo }, { text: "☐", area: del_g }, { text: "☐", area: del_wg }, { text: "☐", area: del_d }]
      - [{ text: Insert }, { text: dbo }, { text: "☐" }, { text: "☐" }, { text: "☐" }]
      - [{ text: Select }, { text: dbo }, { text: "☐", area: sel_g }, { text: "☐", area: sel_wg }, { text: "☐", area: sel_d }]
      - [{ text: Update }, { text: dbo }, { text: "☐", area: upd_g }, { text: "☐", area: upd_wg }, { text: "☐", area: upd_d }]
answer:
  values: { p1: sel_wg, p2: del_d }
explanation:
  correct:
    en: |
      With Grant on Select grants SELECT WITH GRANT OPTION, so Rafael can read the table and grant SELECT to others; Grant alone wouldn't let him pass it on. db_datawriter gives Rafael DELETE on every table, so only an explicit Deny on Delete for dbo.Invoices removes it, because DENY overrides the role's grant.
    fr: |
      With Grant sur Select accorde SELECT WITH GRANT OPTION : Rafael peut lire la table et accorder SELECT à d'autres ; Grant seul ne lui permettrait pas de le transmettre. db_datawriter donne à Rafael DELETE sur toutes les tables : seul un Deny explicite sur Delete pour dbo.Invoices le lui retire, car DENY l'emporte sur l'autorisation du rôle.
references:
  - title: Grant a Permission to a Principal
    url: https://learn.microsoft.com/en-us/sql/relational-databases/security/authentication-access/grant-a-permission-to-a-principal
  - title: DENY Object Permissions (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/statements/deny-object-permissions-transact-sql
