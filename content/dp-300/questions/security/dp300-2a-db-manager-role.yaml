id: dp300-2a-db-manager-role
objective: "2.1.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have an Azure SQL Database logical server named **sql-wingtip**. A deployment pipeline connects to the server by using a SQL login named **deploy_login**.

    The pipeline must be able to create new databases on the server. deploy_login must not get access to the existing databases. The solution must follow the principle of least privilege.

    What should you do?
  fr: |
    Vous disposez d'un serveur logique Azure SQL Database nommé **sql-wingtip**. Un pipeline de déploiement se connecte au serveur avec une connexion SQL nommée **deploy_login**.

    Le pipeline doit pouvoir créer de nouvelles bases de données sur le serveur. deploy_login ne doit pas obtenir d'accès aux bases existantes. La solution doit respecter le principe des privilèges minimum.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Add deploy_login to the dbcreator fixed server role.", fr: "Ajouter deploy_login au rôle serveur fixe dbcreator." } }
    - { id: b, text: { en: "Add deploy_login to the ##MS_DatabaseManager## fixed server role.", fr: "Ajouter deploy_login au rôle serveur fixe ##MS_DatabaseManager##." } }
    - { id: c, text: { en: "Add deploy_login to the ##MS_LoginManager## fixed server role.", fr: "Ajouter deploy_login au rôle serveur fixe ##MS_LoginManager##." } }
    - { id: d, text: { en: "Create a user for deploy_login in master and add it to db_owner.", fr: "Créer un utilisateur pour deploy_login dans master et l'ajouter à db_owner." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      In Azure SQL Database, members of ##MS_DatabaseManager## can create and delete databases. The creator becomes the owner (dbo) of the databases it creates, but the role doesn't give access to databases it doesn't own. Microsoft recommends this server role over the dbmanager database role in master.
    fr: |
      Dans Azure SQL Database, les membres de ##MS_DatabaseManager## peuvent créer et supprimer des bases de données. Le créateur devient propriétaire (dbo) des bases qu'il crée, mais le rôle ne donne pas accès aux bases dont il n'est pas propriétaire. Microsoft recommande ce rôle serveur plutôt que le rôle de base de données dbmanager de master.
  options:
    a:
      en: dbcreator is a fixed server role of SQL Server and SQL Managed Instance; it doesn't exist in Azure SQL Database.
      fr: dbcreator est un rôle serveur fixe de SQL Server et de SQL Managed Instance ; il n'existe pas dans Azure SQL Database.
    c:
      en: "##MS_LoginManager## creates and deletes logins, not databases."
      fr: "##MS_LoginManager## crée et supprime des connexions, pas des bases de données."
    d:
      en: db_owner in master doesn't allow creating databases, and permissions can't be granted in master that way.
      fr: db_owner dans master ne permet pas de créer des bases de données, et les autorisations ne peuvent pas être accordées ainsi dans master.
references:
  - title: Server Roles - Azure SQL Database
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/security-server-roles
