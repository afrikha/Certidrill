id: dp300-2c-ddm-unmasked-principals
objective: "2.3.4"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    You have an Azure SQL database named DB1 that contains tables with dynamic data masking rules. No principal has been granted the UNMASK permission, and no user is excluded from masking.

    Which two principals see the unmasked values when they query the masked columns?

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'une base de données Azure SQL nommée DB1 qui contient des tables avec des règles de masquage dynamique des données. Aucun principal n'a reçu l'autorisation UNMASK, et aucun utilisateur n'est exclu du masquage.

    Quels sont les deux principaux qui voient les valeurs non masquées lorsqu'ils interrogent les colonnes masquées ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "A member of the db_datareader role", fr: "Un membre du rôle db_datareader" } }
    - { id: b, text: { en: "The server admin login of the logical server", fr: "La connexion d'administrateur du serveur logique" } }
    - { id: c, text: { en: "A member of the db_ddladmin role", fr: "Un membre du rôle db_ddladmin" } }
    - { id: d, text: { en: "A member of the db_owner role", fr: "Un membre du rôle db_owner" } }
    - { id: e, text: { en: "A user who holds the SQL Security Manager Azure role on the server and has SELECT on the tables", fr: "Un utilisateur qui détient le rôle Azure SQL Security Manager sur le serveur et dispose de SELECT sur les tables" } }
answer:
  optionIds: [b, d]
explanation:
  correct:
    en: |
      Administrative users always see the original data: the server admin, the Microsoft Entra admin, and the members of the db_owner role. Every other user who can query the columns sees masked values unless granted UNMASK or excluded from masking.
    fr: |
      Les utilisateurs administratifs voient toujours les données d'origine : l'administrateur du serveur, l'administrateur Microsoft Entra et les membres du rôle db_owner. Tout autre utilisateur qui peut interroger les colonnes voit des valeurs masquées, sauf s'il a reçu UNMASK ou s'il est exclu du masquage.
  options:
    a: { en: "db_datareader grants SELECT, which returns masked values.", fr: "db_datareader accorde SELECT, qui renvoie des valeurs masquées." }
    c: { en: "db_ddladmin can run DDL statements but doesn't include UNMASK.", fr: "db_ddladmin peut exécuter des instructions DDL, mais n'inclut pas UNMASK." }
    e: { en: "SQL Security Manager lets a user configure masking policies in Azure; it doesn't grant UNMASK inside the database.", fr: "SQL Security Manager permet de configurer les stratégies de masquage dans Azure ; il n'accorde pas UNMASK dans la base de données." }
references:
  - title: Dynamic data masking
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/dynamic-data-masking-overview
