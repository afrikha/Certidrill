id: dp300-2a-entra-cli-admin
objective: "2.1.1"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    You have an Azure SQL Database logical server named **sql-tailspin** in a resource group named **RG1**. The server uses SQL authentication only.

    You need to use the Azure CLI to:

    - make the Microsoft Entra group **SQL Admins** the Microsoft Entra admin of the server;
    - then prevent any SQL authentication connection to the server.

    How should you complete the commands? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un serveur logique Azure SQL Database nommé **sql-tailspin** dans un groupe de ressources nommé **RG1**. Le serveur utilise uniquement l'authentification SQL.

    Vous devez utiliser Azure CLI pour :

    - faire du groupe Microsoft Entra **SQL Admins** l'administrateur Microsoft Entra du serveur ;
    - puis empêcher toute connexion par authentification SQL au serveur.

    Comment devez-vous compléter les commandes ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: bash
  template: |
    az sql server [[s1]] --resource-group RG1 --server-name sql-tailspin \
      --display-name "SQL Admins" --object-id 1b2c3d4e-0000-0000-0000-000000000000

    az sql server [[s2]] --resource-group RG1 --name sql-tailspin
  slots:
    - id: s1
      options:
        - { id: admin, text: ad-admin create }
        - { id: only, text: ad-only-auth enable }
        - { id: fw, text: firewall-rule create }
        - { id: audit, text: audit-policy update }
    - id: s2
      options:
        - { id: get, text: ad-only-auth get }
        - { id: enable, text: ad-only-auth enable }
        - { id: del, text: ad-admin delete }
        - { id: conn, text: conn-policy update }
answer:
  values: { s1: admin, s2: enable }
explanation:
  correct:
    en: "`az sql server ad-admin create` sets the Microsoft Entra admin of the logical server from the group's display name and object ID. `az sql server ad-only-auth enable` then turns on Microsoft Entra-only authentication, which requires an admin to be set first and blocks all SQL authentication connections."
    fr: "`az sql server ad-admin create` définit l'administrateur Microsoft Entra du serveur logique à partir du nom d'affichage et de l'ID d'objet du groupe. `az sql server ad-only-auth enable` active ensuite l'authentification Microsoft Entra uniquement, qui exige qu'un administrateur soit déjà défini et bloque toutes les connexions par authentification SQL."
  options:
    only: { en: "Microsoft Entra-only authentication can't be enabled before an admin exists, and it doesn't take a group.", fr: "L'authentification Microsoft Entra uniquement ne peut pas être activée avant qu'un administrateur existe, et elle ne prend pas de groupe." }
    get: { en: "ad-only-auth get only reads the current setting.", fr: "ad-only-auth get lit seulement le paramètre actuel." }
    del: { en: "Deleting the admin would disable all Microsoft Entra connections instead of blocking SQL authentication.", fr: "Supprimer l'administrateur désactiverait toutes les connexions Microsoft Entra au lieu de bloquer l'authentification SQL." }
    conn: { en: "The connection policy chooses Proxy or Redirect routing; it doesn't control the authentication type.", fr: "La stratégie de connexion choisit le routage Proxy ou Redirect ; elle ne contrôle pas le type d'authentification." }
references:
  - title: Microsoft Entra-only authentication with Azure SQL
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/authentication-azure-ad-only-authentication
  - title: Configure Microsoft Entra Authentication - Azure SQL Database & SQL Managed Instance
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/authentication-aad-configure
