id: dp300-2b-cle-authenticator-session
objective: "2.2.2"
type: yesno_statements
difficulty: 3
status: draft
stem:
  en: |
    You have a SQL Server 2022 instance on an Azure virtual machine. A database named **Retail** contains a symmetric key named **CardKey** protected by a certificate named **CardCert**. You encrypt a column by running the following statement after you open CardKey.

    ```sql
    UPDATE Sales.CreditCard
    SET CardNumberEnc = ENCRYPTBYKEY(KEY_GUID('CardKey'), CardNumber, 1,
        HASHBYTES('SHA2_256', CONVERT(varbinary, CreditCardID)));
    ```

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'une instance SQL Server 2022 sur une machine virtuelle Azure. Une base de données nommée **Retail** contient une clé symétrique nommée **CardKey** protégée par un certificat nommé **CardCert**. Vous chiffrez une colonne en exécutant l'instruction suivante après avoir ouvert CardKey.

    ```sql
    UPDATE Sales.CreditCard
    SET CardNumberEnc = ENCRYPTBYKEY(KEY_GUID('CardKey'), CardNumber, 1,
        HASHBYTES('SHA2_256', CONVERT(varbinary, CreditCardID)));
    ```

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: To return the card numbers, DECRYPTBYKEY must be called with the add_authenticator value 1 and the same HASHBYTES value of CreditCardID.
        fr: Pour renvoyer les numéros de carte, DECRYPTBYKEY doit être appelé avec la valeur add_authenticator 1 et la même valeur HASHBYTES de CreditCardID.
    - id: s2
      text:
        en: After CardKey is opened in a session, it must be opened again before each later query in the same session.
        fr: Une fois CardKey ouverte dans une session, elle doit être rouverte avant chaque requête ultérieure de la même session.
    - id: s3
      text:
        en: In a session where CardKey is open, a DECRYPTBYKEY query on Retail.Sales.CreditCard that runs while the database context is master returns the card numbers.
        fr: Dans une session où CardKey est ouverte, une requête DECRYPTBYKEY sur Retail.Sales.CreditCard exécutée alors que le contexte de base de données est master renvoie les numéros de carte.
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: "When an authenticator is added at encryption, DECRYPTBYKEY must receive the same authenticator to decrypt the value; this binds each ciphertext to its row. A symmetric key stays open for the rest of the session until CLOSE SYMMETRIC KEY or the end of the session. DECRYPTBYKEY must run in the context of the database that contains the key; called from master, it returns NULL."
    fr: "Lorsqu'un authentificateur est ajouté au chiffrement, DECRYPTBYKEY doit recevoir le même authentificateur pour déchiffrer la valeur ; cela lie chaque texte chiffré à sa ligne. Une clé symétrique reste ouverte pour le reste de la session, jusqu'à CLOSE SYMMETRIC KEY ou la fin de la session. DECRYPTBYKEY doit s'exécuter dans le contexte de la base qui contient la clé ; appelé depuis master, il renvoie NULL."
references:
  - title: DECRYPTBYKEY (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/functions/decryptbykey-transact-sql
  - title: Encrypt a column of data
    url: https://learn.microsoft.com/en-us/sql/relational-databases/security/encryption/encrypt-a-column-of-data
