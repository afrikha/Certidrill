id: dp300-2c-rls-session-readonly
objective: "2.3.6"
type: single
difficulty: 3
status: draft
stem:
  en: |
    You have an Azure SQL database named DB1 that is used by a multitenant web app named App1. App1 connects with a single database user and uses connection pooling.

    After it authenticates a customer, App1 runs sp_set_session_context to store the customer's TenantId. A row-level security filter predicate on every tenant table compares TenantId with SESSION_CONTEXT(N'TenantId').

    You need to ensure that no statement that runs later on the same connection, including injected SQL, can change the TenantId value for that session.

    What should you do?
  fr: |
    Vous disposez d'une base de données Azure SQL nommée DB1 utilisée par une application web multilocataire nommée App1. App1 se connecte avec un seul utilisateur de base de données et utilise le regroupement de connexions.

    Après avoir authentifié un client, App1 exécute sp_set_session_context pour stocker la valeur TenantId du client. Un prédicat de filtre de la sécurité au niveau des lignes, sur chaque table de locataire, compare TenantId à SESSION_CONTEXT(N'TenantId').

    Vous devez vous assurer qu'aucune instruction exécutée plus tard sur la même connexion, y compris du SQL injecté, ne peut modifier la valeur TenantId de cette session.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Store the TenantId value with SET CONTEXT_INFO instead of sp_set_session_context.", fr: "Stocker la valeur TenantId avec SET CONTEXT_INFO au lieu de sp_set_session_context." } }
    - { id: b, text: { en: "Re-create the predicate function with the WITH SCHEMABINDING option.", fr: "Recréer la fonction de prédicat avec l'option WITH SCHEMABINDING." } }
    - { id: c, text: { en: "Add an AFTER UPDATE block predicate to the security policy.", fr: "Ajouter un prédicat de blocage AFTER UPDATE à la stratégie de sécurité." } }
    - { id: d, text: { en: "Call sp_set_session_context with the @read_only parameter set to 1.", fr: "Appeler sp_set_session_context avec le paramètre @read_only défini sur 1." } }
answer:
  optionId: d
explanation:
  correct:
    en: |
      With @read_only = 1, the session context key can't be changed again until the connection is closed or returned to the connection pool. Any later attempt to overwrite TenantId on that connection fails, so the predicate keeps filtering on the tenant that App1 authenticated.
    fr: |
      Avec @read_only = 1, la clé du contexte de session ne peut plus être modifiée jusqu'à la fermeture de la connexion ou son retour dans le pool de connexions. Toute tentative ultérieure de remplacer TenantId sur cette connexion échoue : le prédicat continue de filtrer sur le locataire authentifié par App1.
  options:
    a: { en: "CONTEXT_INFO is a single binary value that any statement on the session can overwrite with another SET CONTEXT_INFO.", fr: "CONTEXT_INFO est une valeur binaire unique que n'importe quelle instruction de la session peut remplacer par un autre SET CONTEXT_INFO." }
    b: { en: "SCHEMABINDING protects the function and the objects it references from schema changes; it doesn't lock the session context.", fr: "SCHEMABINDING protège la fonction et les objets qu'elle référence contre les modifications de schéma ; il ne verrouille pas le contexte de session." }
    c: { en: "An AFTER UPDATE block predicate rejects row updates that violate the predicate; it doesn't stop the session context from being changed.", fr: "Un prédicat de blocage AFTER UPDATE rejette les mises à jour de lignes qui violent le prédicat ; il n'empêche pas de modifier le contexte de session." }
references:
  - title: Row-level security
    url: https://learn.microsoft.com/en-us/sql/relational-databases/security/row-level-security
