id: dp300-2c-rls-identity-functions
objective: "2.3.6"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    You are designing row-level security predicate functions for three Azure SQL databases. Each database has the requirement shown in the answer area.

    Which function should each predicate use to identify the caller? To answer, drag the appropriate functions to the correct requirements. Each function may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous concevez les fonctions de prédicat de la sécurité au niveau des lignes de trois bases de données Azure SQL. Chaque base a l'exigence présentée dans la zone de réponse.

    Quelle fonction chaque prédicat doit-il utiliser pour identifier l'appelant ? Pour répondre, faites glisser les fonctions appropriées vers les exigences correspondantes. Chaque fonction peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: username, text: "USER_NAME()" }
    - { id: sessionctx, text: "SESSION_CONTEXT(N'CustomerId')" }
    - { id: ismember, text: "IS_MEMBER('Auditors')" }
    - { id: appname, text: "APP_NAME()" }
    - { id: hostname, text: "HOST_NAME()" }
  targets:
    - { id: t_user, text: { en: "Each representative connects with their own database user, and the SalesRep column stores that database user name.", fr: "Chaque commercial se connecte avec son propre utilisateur de base de données, et la colonne SalesRep stocke ce nom d'utilisateur de base de données." } }
    - { id: t_app, text: { en: "A web app connects with one shared database user and calls sp_set_session_context to store the signed-in customer.", fr: "Une application web se connecte avec un seul utilisateur de base de données partagé et appelle sp_set_session_context pour stocker le client connecté." } }
    - { id: t_role, text: { en: "Members of the Auditors database role must see every row.", fr: "Les membres du rôle de base de données Auditors doivent voir toutes les lignes." } }
answer:
  mapping: { t_user: username, t_app: sessionctx, t_role: ismember }
explanation:
  correct:
    en: |
      USER_NAME() returns the database user of the session, which matches a column that stores database user names. When a middle-tier app shares one connection user, it passes the end user's identity with sp_set_session_context and the predicate reads it with SESSION_CONTEXT. IS_MEMBER returns 1 when the caller belongs to a database role, so an OR condition on it exempts the Auditors role, because RLS otherwise applies to every user.
    fr: |
      USER_NAME() renvoie l'utilisateur de base de données de la session, qui correspond à une colonne stockant des noms d'utilisateurs de base de données. Lorsqu'une application de niveau intermédiaire partage un même utilisateur de connexion, elle transmet l'identité de l'utilisateur final avec sp_set_session_context et le prédicat la lit avec SESSION_CONTEXT. IS_MEMBER renvoie 1 lorsque l'appelant appartient à un rôle de base de données : une condition OR sur cette fonction exempte le rôle Auditors, car la sécurité au niveau des lignes s'applique sinon à tous les utilisateurs.
  options:
    appname: { en: "APP_NAME returns the application name supplied by the client, which is the same for every user and can be set to any value.", fr: "APP_NAME renvoie le nom d'application fourni par le client, identique pour tous les utilisateurs et modifiable à volonté." }
    hostname: { en: "HOST_NAME returns the client workstation name, not the identity of the user.", fr: "HOST_NAME renvoie le nom du poste client, pas l'identité de l'utilisateur." }
references:
  - title: Row-level security
    url: https://learn.microsoft.com/en-us/sql/relational-databases/security/row-level-security
