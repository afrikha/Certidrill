id: dp300-2c-ct-cdc-temporal
objective: "2.3.3"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    You manage an Azure SQL database named DB1 for Northwind Traders. Three teams have the requirements shown in the answer area.

    Which feature should you use for each requirement? To answer, drag the appropriate features to the correct requirements. Each feature may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous gérez une base de données Azure SQL nommée DB1 pour Northwind Traders. Trois équipes ont les exigences présentées dans la zone de réponse.

    Quelle fonctionnalité devez-vous utiliser pour chaque exigence ? Pour répondre, faites glisser les fonctionnalités appropriées vers les exigences correspondantes. Chaque fonctionnalité peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: ct, text: { en: "Change tracking", fr: "Suivi des modifications" } }
    - { id: cdc, text: { en: "Change data capture", fr: "Capture des changements de données" } }
    - { id: temporal, text: { en: "Temporal table", fr: "Table temporelle" } }
    - { id: audit, text: { en: "Auditing", fr: "Audit" } }
    - { id: ddc, text: { en: "Data Discovery & Classification", fr: "Découverte et classification des données" } }
  targets:
    - { id: t_sync, text: { en: "Offline field devices download only the keys of the rows changed since their last synchronization.", fr: "Des appareils de terrain hors connexion ne téléchargent que les clés des lignes modifiées depuis leur dernière synchronisation." } }
    - { id: t_etl, text: { en: "An ETL pipeline reads every change, with the column values before and after each update, from the transaction log.", fr: "Un pipeline ETL lit chaque changement, avec les valeurs des colonnes avant et après chaque mise à jour, à partir du journal des transactions." } }
    - { id: t_asof, text: { en: "Analysts query the Prices table as it was at the end of each month.", fr: "Des analystes interrogent la table Prices telle qu'elle était à la fin de chaque mois." } }
answer:
  mapping: { t_sync: ct, t_etl: cdc, t_asof: temporal }
explanation:
  correct:
    en: |
      Change tracking returns the primary keys and operation types of the rows changed since a given version, which is what synchronizing clients need. Change data capture reads the transaction log asynchronously and stores every change with its column values, which suits ETL. A temporal table keeps every previous row version with its validity period and answers FOR SYSTEM_TIME AS OF queries.
    fr: |
      Le suivi des modifications renvoie les clés primaires et les types d'opération des lignes modifiées depuis une version donnée, ce dont ont besoin les clients qui se synchronisent. La capture des changements de données lit le journal des transactions de manière asynchrone et stocke chaque changement avec les valeurs des colonnes, ce qui convient à l'ETL. Une table temporelle conserve chaque version précédente des lignes avec sa période de validité et répond aux requêtes FOR SYSTEM_TIME AS OF.
  options:
    audit: { en: "Auditing records who ran which statements, not a queryable history of row values.", fr: "L'audit enregistre qui a exécuté quelles instructions, pas un historique interrogeable des valeurs des lignes." }
    ddc: { en: "Classification labels sensitive columns; it records no changes.", fr: "La classification étiquette les colonnes sensibles ; elle n'enregistre aucun changement." }
references:
  - title: Track data changes (SQL Server)
    url: https://learn.microsoft.com/en-us/sql/relational-databases/track-changes/track-data-changes-sql-server
