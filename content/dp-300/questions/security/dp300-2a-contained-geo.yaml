id: dp300-2a-contained-geo
objective: "2.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have an Azure SQL database named **DB1** on a logical server named **sql-east**. DB1 is in a failover group with a secondary server named **sql-west**.

    A new application will connect to DB1 by using SQL authentication. You need to ensure that the application can connect after a failover without any principal being created or synchronized on sql-west. The solution must minimize administrative effort.

    Which principal should you create for the application?
  fr: |
    Vous disposez d'une base de données Azure SQL nommée **DB1** sur un serveur logique nommé **sql-east**. DB1 fait partie d'un groupe de basculement avec un serveur secondaire nommé **sql-west**.

    Une nouvelle application se connectera à DB1 avec l'authentification SQL. Vous devez faire en sorte que l'application puisse se connecter après un basculement sans qu'aucun principal ne soit créé ni synchronisé sur sql-west. La solution doit réduire au minimum l'effort d'administration.

    Quel principal devez-vous créer pour l'application ?
body:
  options:
    - { id: a, text: { en: "A login in master of sql-east, and a user in DB1 created FROM LOGIN", fr: "Une connexion dans master de sql-east et un utilisateur de DB1 créé FROM LOGIN" } }
    - { id: b, text: { en: "An application role in DB1 that the application activates with sp_setapprole", fr: "Un rôle d'application dans DB1 que l'application active avec sp_setapprole" } }
    - { id: c, text: { en: "A user in DB1 created WITHOUT LOGIN and granted the required permissions", fr: "Un utilisateur de DB1 créé WITHOUT LOGIN et doté des autorisations requises" } }
    - { id: d, text: { en: "A contained database user in DB1 created WITH PASSWORD", fr: "Un utilisateur de base de données autonome de DB1 créé WITH PASSWORD" } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      A contained database user stores its authentication data in the user database, so it is replicated with DB1 to the geo-secondary and works after failover without any work on sql-west. A login lives in master of one server only and must be created on both servers.
    fr: |
      Un utilisateur de base de données autonome stocke ses données d'authentification dans la base utilisateur : il est répliqué avec DB1 vers le secondaire géographique et fonctionne après basculement sans aucune action sur sql-west. Une connexion réside dans master d'un seul serveur et doit être créée sur les deux serveurs.
  options:
    a:
      en: The login exists only in master of sql-east; it must be recreated on sql-west with the same SID or the user is orphaned after failover.
      fr: La connexion n'existe que dans master de sql-east ; elle doit être recréée sur sql-west avec le même SID, sinon l'utilisateur est orphelin après le basculement.
    b:
      en: An application role is activated inside an existing session; the application still needs another principal to connect.
      fr: Un rôle d'application s'active à l'intérieur d'une session existante ; l'application a toujours besoin d'un autre principal pour se connecter.
    c:
      en: A user without login can't authenticate; it is used for impersonation inside the database.
      fr: Un utilisateur sans connexion ne peut pas s'authentifier ; il sert à l'emprunt d'identité à l'intérieur de la base.
references:
  - title: Authorize database access to Azure SQL Database
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/logins-create-manage
