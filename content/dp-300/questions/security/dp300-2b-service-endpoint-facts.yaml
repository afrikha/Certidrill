id: dp300-2b-service-endpoint-facts
objective: "2.2.6"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    You have an Azure SQL Database logical server named **sql-fabrikam** in the North Europe region. The server hosts five databases. You plan to enable the Microsoft.Sql service endpoint on a subnet named **snet-app** and to add a virtual network rule for snet-app to sql-fabrikam.

    Which two statements are true?

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un serveur logique Azure SQL Database nommé **sql-fabrikam** dans la région North Europe. Le serveur héberge cinq bases de données. Vous prévoyez d'activer le point de terminaison de service Microsoft.Sql sur un sous-réseau nommé **snet-app** et d'ajouter à sql-fabrikam une règle de réseau virtuel pour snet-app.

    Quelles sont les deux affirmations vraies ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "The virtual network rule applies to all five databases of sql-fabrikam.", fr: "La règle de réseau virtuel s'applique aux cinq bases de sql-fabrikam." } }
    - { id: b, text: { en: "The virtual network rule can be scoped to a single database of sql-fabrikam.", fr: "La règle de réseau virtuel peut être limitée à une seule base de sql-fabrikam." } }
    - { id: c, text: { en: "On-premises clients connected over ExpressRoute can use the rule to reach sql-fabrikam.", fr: "Les clients locaux connectés par ExpressRoute peuvent utiliser la règle pour atteindre sql-fabrikam." } }
    - { id: d, text: { en: "snet-app must be in a virtual network in the North Europe region.", fr: "snet-app doit se trouver dans un réseau virtuel de la région North Europe." } }
    - { id: e, text: { en: "Adding the virtual network rule disables the public endpoint of sql-fabrikam.", fr: "L'ajout de la règle de réseau virtuel désactive le point de terminaison public de sql-fabrikam." } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: "Virtual network rules apply at the server level, to every database of the server, unlike IP rules, which can also be created at the database level. A service endpoint applies to one Azure region only, so the referenced subnets must be in the same region as the server."
    fr: "Les règles de réseau virtuel s'appliquent au niveau du serveur, à toutes ses bases, contrairement aux règles IP, qui peuvent aussi être créées au niveau de la base de données. Un point de terminaison de service ne s'applique qu'à une seule région Azure : les sous-réseaux référencés doivent se trouver dans la même région que le serveur."
  options:
    b: { en: "There are no database-level virtual network rules; only IP rules exist at the database level.", fr: "Il n'existe pas de règle de réseau virtuel au niveau de la base de données ; seules les règles IP existent à ce niveau." }
    c: { en: "Virtual network rules do not apply to on-premises traffic over ExpressRoute or site-to-site VPN; those clients need IP rules or a private endpoint.", fr: "Les règles de réseau virtuel ne s'appliquent pas au trafic local passant par ExpressRoute ou un VPN de site à site ; ces clients ont besoin de règles IP ou d'un point de terminaison privé." }
    e: { en: "The traffic from the subnet still reaches the public endpoint of the server, which stays enabled.", fr: "Le trafic du sous-réseau atteint toujours le point de terminaison public du serveur, qui reste activé." }
references:
  - title: Use virtual network service endpoints and rules for servers in Azure SQL Database
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/vnet-service-endpoint-rule-overview
