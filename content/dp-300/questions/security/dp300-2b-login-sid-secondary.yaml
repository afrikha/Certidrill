id: dp300-2b-login-sid-secondary
objective: "2.1.8"
type: single
difficulty: 3
status: draft
stem:
  en: |
    You have two Azure SQL Database logical servers named **sql-fab-weu** and **sql-fab-neu**. A database named **OrdersDB** on sql-fab-weu is geo-replicated to sql-fab-neu by using active geo-replication.

    An application connects to OrdersDB by using a SQL login named **app_login** that exists only in the master database of sql-fab-weu. OrdersDB contains a database user named **app_user** that is mapped to app_login.

    You need to ensure that the application can use app_login to access OrdersDB as app_user after a failover to sql-fab-neu.

    What should you do?
  fr: |
    Vous disposez de deux serveurs logiques Azure SQL Database nommés **sql-fab-weu** et **sql-fab-neu**. Une base de données nommée **OrdersDB** sur sql-fab-weu est géorépliquée vers sql-fab-neu à l'aide de la géoréplication active.

    Une application se connecte à OrdersDB avec une connexion SQL nommée **app_login** qui n'existe que dans la base de données master de sql-fab-weu. OrdersDB contient un utilisateur de base de données nommé **app_user** associé à app_login.

    Vous devez vous assurer que l'application peut utiliser app_login pour accéder à OrdersDB en tant qu'app_user après un basculement vers sql-fab-neu.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "In master on sql-fab-neu, run CREATE LOGIN app_login, and then run ALTER USER app_user WITH LOGIN = app_login in the secondary OrdersDB.", fr: "Dans master sur sql-fab-neu, exécuter CREATE LOGIN app_login, puis exécuter ALTER USER app_user WITH LOGIN = app_login dans la base OrdersDB secondaire." } }
    - { id: b, text: { en: "In master on sql-fab-neu, run CREATE LOGIN app_login WITH PASSWORD and SID set to the SID read from sys.sql_logins on sql-fab-weu.", fr: "Dans master sur sql-fab-neu, exécuter CREATE LOGIN app_login WITH PASSWORD avec SID égal au SID lu dans sys.sql_logins sur sql-fab-weu." } }
    - { id: c, text: { en: "In the secondary OrdersDB on sql-fab-neu, run CREATE USER app_user FROM LOGIN app_login after you create the login in master.", fr: "Dans la base OrdersDB secondaire sur sql-fab-neu, exécuter CREATE USER app_user FROM LOGIN app_login après avoir créé la connexion dans master." } }
    - { id: d, text: { en: "In master on sql-fab-neu, run CREATE USER app_user WITH PASSWORD, and then add the user to the ##MS_DatabaseConnector## role.", fr: "Dans master sur sql-fab-neu, exécuter CREATE USER app_user WITH PASSWORD, puis ajouter l'utilisateur au rôle ##MS_DatabaseConnector##." } }
answer: { optionId: b }
explanation:
  correct:
    en: "A database user is linked to a login by its SID. When the target server's master database contains a login with the same SID as the source login, the replicated app_user is mapped to it after failover. You read the SID from sys.sql_logins in master on the primary server and pass it to CREATE LOGIN ... WITH PASSWORD = '...', SID = 0x... on the secondary server."
    fr: "Un utilisateur de base de données est lié à une connexion par son SID. Lorsque la base master du serveur cible contient une connexion de même SID que la connexion source, l'utilisateur app_user répliqué y est associé après le basculement. Vous lisez le SID dans sys.sql_logins dans master sur le serveur primaire et le passez à CREATE LOGIN ... WITH PASSWORD = '...', SID = 0x... sur le serveur secondaire."
  options:
    a: { en: "The geo-secondary database is read-only, so ALTER USER cannot run in it, and a login created without the SID gets a new SID that does not match app_user.", fr: "La base géosecondaire est en lecture seule : ALTER USER ne peut pas s'y exécuter, et une connexion créée sans le SID reçoit un nouveau SID qui ne correspond pas à app_user." }
    c: { en: "app_user already exists in the replicated database, and the read-only geo-secondary does not accept CREATE USER.", fr: "app_user existe déjà dans la base répliquée, et la base géosecondaire en lecture seule n'accepte pas CREATE USER." }
    d: { en: "A user created in master is not app_user of OrdersDB; the application would not get the permissions of app_user.", fr: "Un utilisateur créé dans master n'est pas l'utilisateur app_user d'OrdersDB ; l'application n'obtiendrait pas les autorisations d'app_user." }
references:
  - title: Configure and manage Azure SQL Database security for geo-restore or failover
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/active-geo-replication-security-configure
