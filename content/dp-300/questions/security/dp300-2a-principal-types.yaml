id: dp300-2a-principal-types
objective: "2.1.3"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    You manage an Azure SQL managed instance named **MI1** that hosts a database named **Sales**. You need to choose the type of security principal for each requirement.

    Which principal type should you use for each requirement? To answer, drag the appropriate principal types to the correct requirements. Each principal type may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous gérez une instance managée Azure SQL nommée **MI1** qui héberge une base de données nommée **Sales**. Vous devez choisir le type de principal de sécurité pour chaque exigence.

    Quel type de principal devez-vous utiliser pour chaque exigence ? Pour répondre, faites glisser les types de principaux appropriés vers les exigences correspondantes. Chaque type de principal peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: approle, text: { en: "Application role", fr: "Rôle d'application" } }
    - { id: nologin, text: { en: "User without login", fr: "Utilisateur sans connexion" } }
    - { id: dbrole, text: { en: "Database role", fr: "Rôle de base de données" } }
    - { id: login, text: { en: "Login", fr: "Connexion" } }
    - { id: contained, text: { en: "Contained database user", fr: "Utilisateur de base de données autonome" } }
  targets:
    - id: t1
      text: { en: "Permissions that apply only while a specific application has run sp_setapprole with its password", fr: "Des autorisations qui ne s'appliquent que lorsqu'une application précise a exécuté sp_setapprole avec son mot de passe" }
    - id: t2
      text: { en: "A principal that can't connect and is used only as the EXECUTE AS context of a stored procedure", fr: "Un principal qui ne peut pas se connecter et sert seulement de contexte EXECUTE AS d'une procédure stockée" }
    - id: t3
      text: { en: "One set of permissions in Sales that you grant once and then give to many users", fr: "Un ensemble d'autorisations dans Sales accordé une seule fois puis donné à de nombreux utilisateurs" }
    - id: t4
      text: { en: "An identity that needs the VIEW SERVER STATE permission on MI1", fr: "Une identité qui a besoin de l'autorisation VIEW SERVER STATE sur MI1" }
answer:
  mapping: { t1: approle, t2: nologin, t3: dbrole, t4: login }
explanation:
  correct:
    en: |
      An application role has no members; its permissions are activated in a session by sp_setapprole and its password. A user without login can't authenticate, which makes it a safe EXECUTE AS context. A database role groups permissions for its members. VIEW SERVER STATE is a server-level permission, so it can only be granted to a server principal, that is, a login.
    fr: |
      Un rôle d'application n'a pas de membres ; ses autorisations sont activées dans une session par sp_setapprole et son mot de passe. Un utilisateur sans connexion ne peut pas s'authentifier, ce qui en fait un contexte EXECUTE AS sûr. Un rôle de base de données regroupe des autorisations pour ses membres. VIEW SERVER STATE est une autorisation de niveau serveur : elle ne peut être accordée qu'à un principal de serveur, c'est-à-dire une connexion.
  options:
    contained: { en: "A contained user is a database principal: it can't receive server-level permissions, and it can connect, which an EXECUTE AS-only principal must not do.", fr: "Un utilisateur autonome est un principal de base de données : il ne peut pas recevoir d'autorisations de niveau serveur, et il peut se connecter, ce qu'un principal réservé à EXECUTE AS ne doit pas pouvoir faire." }
references:
  - title: Create a database user
    url: https://learn.microsoft.com/en-us/sql/relational-databases/security/authentication-access/create-a-database-user
