id: dp300-2b-enclave-rich-query-reqs
objective: "2.2.5"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    You have an Azure SQL database named **Clinic** on standard-series hardware. The database has VBS secure enclaves enabled and a compatibility level of 150. The Patient table contains a BirthDate column of type date.

    You need to encrypt BirthDate by using Always Encrypted and allow applications to run queries such as WHERE BirthDate BETWEEN @start AND @end.

    Which two actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'une base de données Azure SQL nommée **Clinic** sur du matériel de série standard. Les enclaves sécurisées VBS sont activées pour la base, et son niveau de compatibilité est 150. La table Patient contient une colonne BirthDate de type date.

    Vous devez chiffrer BirthDate à l'aide d'Always Encrypted et permettre aux applications d'exécuter des requêtes comme WHERE BirthDate BETWEEN @start AND @end.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Create a clustered index on BirthDate after encryption.", fr: "Créer un index cluster sur BirthDate après le chiffrement." } }
    - { id: b, text: { en: "Encrypt BirthDate with deterministic encryption and an enclave-enabled column encryption key.", fr: "Chiffrer BirthDate avec un chiffrement déterministe et une clé de chiffrement de colonne compatible enclave." } }
    - { id: c, text: { en: "Set the compatibility level of Clinic to 160.", fr: "Définir le niveau de compatibilité de Clinic sur 160." } }
    - { id: d, text: { en: "Move Clinic to DC-series hardware.", fr: "Déplacer Clinic vers du matériel de série DC." } }
    - { id: e, text: { en: "Encrypt BirthDate with randomized encryption and an enclave-enabled column encryption key.", fr: "Chiffrer BirthDate avec un chiffrement aléatoire et une clé de chiffrement de colonne compatible enclave." } }
answer: { optionIds: [ c, e ] }
explanation:
  correct:
    en: "Comparison operators and BETWEEN inside a secure enclave require randomized encryption with enclave-enabled keys; deterministic encryption only supports equality. Confidential queries with enclaves also require the database compatibility level to be 160 (SQL Server 2022) or higher. A date column needs no special collation."
    fr: "Les opérateurs de comparaison et BETWEEN dans une enclave sécurisée exigent un chiffrement aléatoire avec des clés compatibles enclave ; le chiffrement déterministe ne prend en charge que l'égalité. Les requêtes confidentielles avec enclaves exigent aussi un niveau de compatibilité de base de données égal à 160 (SQL Server 2022) ou supérieur. Une colonne de type date ne nécessite aucun classement particulier."
  options:
    a: { en: "Clustered indexes cannot be created on enclave-enabled columns that use randomized encryption; only nonclustered indexes are supported.", fr: "Les index cluster ne peuvent pas être créés sur les colonnes compatibles enclave à chiffrement aléatoire ; seuls les index non cluster sont pris en charge." }
    b: { en: "Enclave computations are not supported on deterministically encrypted columns; equality remains the only operation available on them.", fr: "Les calculs d'enclave ne sont pas pris en charge sur les colonnes à chiffrement déterministe ; l'égalité reste la seule opération disponible sur ces colonnes." }
    d: { en: "DC-series hardware provides Intel SGX enclaves; VBS enclaves already work on standard-series hardware.", fr: "Le matériel de série DC fournit des enclaves Intel SGX ; les enclaves VBS fonctionnent déjà sur du matériel de série standard." }
references:
  - title: Always Encrypted with secure enclaves
    url: https://learn.microsoft.com/en-us/sql/relational-databases/security/encryption/always-encrypted-enclaves
