id: dp300-2a-create-proc-perms
objective: "2.1.6"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    You have an Azure SQL database named **DB1** that contains the schemas **dbo**, **Sales** and **Dev**. A developer connects as a user named **dev1**.

    dev1 must be able to create stored procedures in the Dev schema only. The solution must follow the principle of least privilege.

    Which two permissions should you grant to dev1? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'une base de données Azure SQL nommée **DB1** qui contient les schémas **dbo**, **Sales** et **Dev**. Un développeur se connecte en tant qu'utilisateur nommé **dev1**.

    dev1 doit pouvoir créer des procédures stockées dans le schéma Dev uniquement. La solution doit respecter le principe des privilèges minimum.

    Quelles sont les deux autorisations à accorder à dev1 ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: "GRANT ALTER ANY SCHEMA TO dev1;" }
    - { id: b, text: "GRANT CREATE PROCEDURE TO dev1;" }
    - { id: c, text: "ALTER ROLE db_ddladmin ADD MEMBER dev1;" }
    - { id: d, text: "GRANT CONTROL ON DATABASE::DB1 TO dev1;" }
    - { id: e, text: "GRANT ALTER ON SCHEMA::Dev TO dev1;" }
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: |
      Creating a procedure requires the CREATE PROCEDURE permission in the database and the ALTER permission on the schema that will contain it. Granting ALTER on the Dev schema only keeps dev1 out of dbo and Sales.
    fr: |
      La création d'une procédure exige l'autorisation CREATE PROCEDURE dans la base et l'autorisation ALTER sur le schéma qui la contiendra. Accorder ALTER sur le seul schéma Dev tient dev1 à l'écart de dbo et de Sales.
  options:
    a: { en: "ALTER ANY SCHEMA applies to every schema in the database.", fr: "ALTER ANY SCHEMA s'applique à tous les schémas de la base." }
    c: { en: "db_ddladmin can run any DDL in any schema of the database.", fr: "db_ddladmin peut exécuter n'importe quel DDL dans n'importe quel schéma de la base." }
    d: { en: "CONTROL on the database is equivalent to ownership permissions on all of it.", fr: "CONTROL sur la base équivaut à des autorisations de propriétaire sur l'ensemble de la base." }
references:
  - title: CREATE PROCEDURE (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/statements/create-procedure-transact-sql
