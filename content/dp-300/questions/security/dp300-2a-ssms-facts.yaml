id: dp300-2a-ssms-facts
objective: "2.1.5"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    You manage permissions for an Azure SQL database named **DB1**. Some administrators use SQL Server Management Studio and others use the Azure portal.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous gérez les autorisations d'une base de données Azure SQL nommée **DB1**. Certains administrateurs utilisent SQL Server Management Studio, d'autres le portail Azure.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: On the Permissions page of a table in SSMS, selecting With Grant for a permission lets the user grant that permission to other principals.
        fr: Dans la page Permissions d'une table dans SSMS, sélectionner With Grant pour une autorisation permet à l'utilisateur d'accorder cette autorisation à d'autres principaux.
    - id: s2
      text:
        en: You can add a user to the db_datareader role from the properties of the db_datareader role, by selecting Add on its General page.
        fr: Vous pouvez ajouter un utilisateur au rôle db_datareader depuis les propriétés du rôle db_datareader, en sélectionnant Add dans sa page General.
    - id: s3
      text:
        en: Assigning the Reader role to a user on the Access control (IAM) page of DB1 lets the user query the tables of DB1.
        fr: Attribuer le rôle Reader à un utilisateur dans la page Contrôle d'accès (IAM) de DB1 permet à l'utilisateur d'interroger les tables de DB1.
answer:
  values: { s1: true, s2: true, s3: false }
explanation:
  correct:
    en: |
      With Grant is the graphical form of GRANT ... WITH GRANT OPTION. Role membership can be managed from either side: the Membership page of the user, or the members list of the role's properties. Azure RBAC roles such as Reader apply to the Azure resource; querying data always requires a database principal with permissions inside DB1.
    fr: |
      With Grant est la forme graphique de GRANT ... WITH GRANT OPTION. L'appartenance à un rôle se gère des deux côtés : la page Membership de l'utilisateur, ou la liste des membres dans les propriétés du rôle. Les rôles Azure RBAC comme Reader s'appliquent à la ressource Azure ; interroger les données exige toujours un principal de base de données doté d'autorisations dans DB1.
references:
  - title: Microsoft Entra authentication for Azure SQL
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/authentication-aad-overview
  - title: Create a database user
    url: https://learn.microsoft.com/en-us/sql/relational-databases/security/authentication-access/create-a-database-user
