id: dp300-2b-fw-db-rules-geo
objective: "2.2.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have an Azure SQL Database logical server named **sql-proseware-1** that hosts three databases for three customers. Each database is geo-replicated to a logical server named **sql-proseware-2**.

    Each customer connects from its own public IP address range. You need to ensure that each customer can connect only to its own database, and that the allowed IP addresses remain in effect after a failover to sql-proseware-2 without any additional configuration.

    What should you configure?
  fr: |
    Vous disposez d'un serveur logique Azure SQL Database nommé **sql-proseware-1** qui héberge trois bases de données pour trois clients. Chaque base est géorépliquée vers un serveur logique nommé **sql-proseware-2**.

    Chaque client se connecte depuis sa propre plage d'adresses IP publiques. Vous devez vous assurer que chaque client ne peut se connecter qu'à sa propre base, et que les adresses IP autorisées restent en vigueur après un basculement vers sql-proseware-2, sans configuration supplémentaire.

    Que devez-vous configurer ?
body:
  options:
    - { id: a, text: { en: "Database-level IP firewall rules in each database", fr: "Des règles de pare-feu IP au niveau de la base de données dans chaque base" } }
    - { id: b, text: { en: "Server-level IP firewall rules on both logical servers", fr: "Des règles de pare-feu IP au niveau du serveur sur les deux serveurs logiques" } }
    - { id: c, text: { en: "Virtual network rules on both logical servers", fr: "Des règles de réseau virtuel sur les deux serveurs logiques" } }
    - { id: d, text: { en: "Network security group rules on the subnets of the customers", fr: "Des règles de groupe de sécurité réseau sur les sous-réseaux des clients" } }
answer: { optionId: a }
explanation:
  correct:
    en: "A database-level IP firewall rule grants access to one database only, and it is stored in that database, so it is replicated with it and still applies after a failover. Database-level rules are created with T-SQL (sp_set_database_firewall_rule) while connected to the database."
    fr: "Une règle de pare-feu IP au niveau de la base de données n'accorde l'accès qu'à une seule base, et elle est stockée dans cette base : elle est répliquée avec elle et s'applique toujours après un basculement. Les règles au niveau de la base de données se créent en T-SQL (sp_set_database_firewall_rule) en étant connecté à la base."
  options:
    b: { en: "Server-level rules apply to every database of the server, so a customer could reach the other databases, and they must be maintained on each server separately.", fr: "Les règles au niveau du serveur s'appliquent à toutes les bases du serveur : un client pourrait atteindre les autres bases. Elles doivent en outre être gérées séparément sur chaque serveur." }
    c: { en: "Virtual network rules allow subnets of Azure virtual networks, not public IP ranges of customers, and they apply to the whole server.", fr: "Les règles de réseau virtuel autorisent des sous-réseaux de réseaux virtuels Azure, pas les plages d'adresses IP publiques des clients, et elles s'appliquent à tout le serveur." }
    d: { en: "NSGs filter traffic in Azure virtual networks that you control; they do not control access to the public endpoint of a logical server.", fr: "Les NSG filtrent le trafic dans les réseaux virtuels Azure que vous contrôlez ; ils ne contrôlent pas l'accès au point de terminaison public d'un serveur logique." }
references:
  - title: Azure SQL Database IP firewall rules
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/firewall-configure
