id: dp300-sr2-tde-protector-2
objective: "2.2.1"
type: series_yesno
series: dp300-sr2-tde-protector
seriesOrder: 2
difficulty: 2
status: draft
stem:
  en: |
    You use a 3,072-bit RSA key with the Key Vault Crypto Service Encryption User role.
  fr: |
    Vous utilisez une clé RSA de 3 072 bits avec le rôle Key Vault Crypto Service Encryption User.
body:
  solution:
    en: |
      You create a **3,072-bit RSA** key in kv-wg1. You assign the **Key Vault Crypto Service Encryption User** role on kv-wg1 to the managed identity of sql-wg1. You then set the key as the TDE protector of sql-wg1.
    fr: |
      Vous créez une clé **RSA de 3 072 bits** dans kv-wg1. Vous attribuez le rôle **Key Vault Crypto Service Encryption User** sur kv-wg1 à l'identité managée de sql-wg1. Vous définissez ensuite la clé comme protecteur TDE de sql-wg1.
answer: { value: true }
explanation:
  correct:
    en: |
      With the Azure RBAC model, the server identity needs the Key Vault Crypto Service Encryption User role, which allows it to read the key and to wrap and unwrap the database encryption keys, and nothing more. A 3,072-bit RSA key is a supported TDE protector. Setting it at the server level applies it to every database of sql-wg1, which inherit the server's protector.
    fr: |
      Avec le modèle Azure RBAC, l'identité du serveur a besoin du rôle Key Vault Crypto Service Encryption User, qui lui permet de lire la clé et d'encapsuler et de désencapsuler les clés de chiffrement des bases, sans rien de plus. Une clé RSA de 3 072 bits est un protecteur TDE pris en charge. La définir au niveau du serveur l'applique à toutes les bases de sql-wg1, qui héritent du protecteur du serveur.
references:
  - title: "Customer-Managed Transparent Data Encryption (TDE), Azure SQL Database & Azure SQL Managed Instance"
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/transparent-data-encryption-byok-overview
