id: dp300-2b-fw-rule-evaluation
objective: "2.2.3"
type: hotarea
difficulty: 3
status: draft
stem:
  en: |
    You have an Azure SQL Database logical server named **sql-northwind** that hosts a database named **DB1**. The IP firewall rules that apply to DB1 are shown in the following table. The public network access of sql-northwind is enabled, and no virtual network rule exists.

    Answer each prompt by selecting the rule that allows the connection.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un serveur logique Azure SQL Database nommé **sql-northwind** qui héberge une base de données nommée **DB1**. Les règles de pare-feu IP qui s'appliquent à DB1 figurent dans le tableau suivant. L'accès au réseau public de sql-northwind est activé, et aucune règle de réseau virtuel n'existe.

    Répondez à chaque consigne en sélectionnant la règle qui autorise la connexion.

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
    - id: p1
      text: { en: "A client with the IP address 192.0.2.40 connects to DB1", fr: "Un client d'adresse IP 192.0.2.40 se connecte à DB1" }
    - id: p2
      text: { en: "A client with the IP address 192.0.2.10 connects to DB1", fr: "Un client d'adresse IP 192.0.2.10 se connecte à DB1" }
  grid:
    header: [{ en: "Level", fr: "Niveau" }, { en: Name, fr: Nom }, { en: "Start IP address", fr: "Adresse IP de début" }, { en: "End IP address", fr: "Adresse IP de fin" }]
    rows:
      - [{ text: { en: "Server", fr: "Serveur" } }, { text: HQ, area: hq }, { text: "203.0.113.0" }, { text: "203.0.113.255" }]
      - [{ text: { en: "Server", fr: "Serveur" } }, { text: Branch, area: branch }, { text: "192.0.2.0" }, { text: "192.0.2.63" }]
      - [{ text: { en: "Database (DB1)", fr: "Base de données (DB1)" } }, { text: Reporting, area: reporting }, { text: "198.51.100.20" }, { text: "198.51.100.20" }]
      - [{ text: { en: "Database (DB1)", fr: "Base de données (DB1)" } }, { text: Partners, area: partners }, { text: "192.0.2.32" }, { text: "192.0.2.47" }]
answer:
  values: { p1: partners, p2: branch }
explanation:
  correct:
    en: "For a connection to a database, the firewall first checks the database-level rules of that database; the server-level rules are checked only when no database-level rule matches. 192.0.2.40 matches the database-level rule Partners, so the server-level Branch rule is not evaluated. 192.0.2.10 matches no rule of DB1, so the server-level rule Branch (192.0.2.0 to 192.0.2.63) allows it."
    fr: "Pour une connexion à une base de données, le pare-feu vérifie d'abord les règles au niveau de cette base ; les règles au niveau du serveur ne sont vérifiées que si aucune règle au niveau de la base ne correspond. 192.0.2.40 correspond à la règle au niveau de la base Partners : la règle Branch au niveau du serveur n'est pas évaluée. 192.0.2.10 ne correspond à aucune règle de DB1 : c'est la règle Branch au niveau du serveur (192.0.2.0 à 192.0.2.63) qui l'autorise."
references:
  - title: Azure SQL Database IP firewall rules
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/firewall-configure
