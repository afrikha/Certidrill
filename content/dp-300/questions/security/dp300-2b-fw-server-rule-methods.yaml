id: dp300-2b-fw-server-rule-methods
objective: "2.2.3"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    You have an Azure SQL Database logical server named **sql-adventure** that hosts 12 databases. A new administration team connects from the public IP address range 203.0.113.0 to 203.0.113.31.

    You need to allow the team to connect to all the databases of sql-adventure, including databases created later.

    Which two actions can you perform? Each correct answer presents a complete solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un serveur logique Azure SQL Database nommé **sql-adventure** qui héberge 12 bases de données. Une nouvelle équipe d'administration se connecte depuis la plage d'adresses IP publiques 203.0.113.0 à 203.0.113.31.

    Vous devez autoriser l'équipe à se connecter à toutes les bases de sql-adventure, y compris les bases créées ultérieurement.

    Quelles sont les deux actions que vous pouvez effectuer ? Chaque bonne réponse constitue une solution complète.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Run az sql server firewall-rule create with the start and end IP addresses.", fr: "Exécuter az sql server firewall-rule create avec les adresses IP de début et de fin." } }
    - { id: b, text: { en: "Connect to each database and run sp_set_database_firewall_rule with the range.", fr: "Se connecter à chaque base et exécuter sp_set_database_firewall_rule avec la plage." } }
    - { id: c, text: { en: "Connect to master and run sp_set_firewall_rule with the range.", fr: "Se connecter à master et exécuter sp_set_firewall_rule avec la plage." } }
    - { id: d, text: { en: "Run az sql server vnet-rule create for the team's subnet.", fr: "Exécuter az sql server vnet-rule create pour le sous-réseau de l'équipe." } }
    - { id: e, text: { en: "Select Allow Azure services and resources to access this server.", fr: "Sélectionner Allow Azure services and resources to access this server." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: "A server-level IP firewall rule applies to every database of the logical server, including future databases. You can create it with the Azure CLI (az sql server firewall-rule create), PowerShell, the portal, the REST API, or T-SQL with sp_set_firewall_rule while connected to master."
    fr: "Une règle de pare-feu IP au niveau du serveur s'applique à toutes les bases du serveur logique, y compris les bases futures. Vous pouvez la créer avec Azure CLI (az sql server firewall-rule create), PowerShell, le portail, l'API REST ou en T-SQL avec sp_set_firewall_rule en étant connecté à master."
  options:
    b: { en: "Database-level rules cover only the databases where they exist; databases created later would not be covered.", fr: "Les règles au niveau de la base de données ne couvrent que les bases où elles existent ; les bases créées ultérieurement ne seraient pas couvertes." }
    d: { en: "A virtual network rule allows a subnet of an Azure virtual network, not a public IP range of an administration team.", fr: "Une règle de réseau virtuel autorise un sous-réseau d'un réseau virtuel Azure, pas une plage d'adresses IP publiques d'une équipe d'administration." }
    e: { en: "This setting allows Azure IP addresses only, and it allows all of them, including other customers' services.", fr: "Ce paramètre n'autorise que les adresses IP d'Azure, et il les autorise toutes, y compris les services d'autres clients." }
references:
  - title: Azure SQL Database IP firewall rules
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/firewall-configure
