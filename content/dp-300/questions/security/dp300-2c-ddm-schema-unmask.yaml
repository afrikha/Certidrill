id: dp300-2c-ddm-schema-unmask
objective: "2.3.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have an Azure SQL database named DB1 that contains two schemas named Sales and HR. Both schemas contain tables that have masked columns. Developers regularly add tables with masked columns to the Sales schema.

    You need to ensure that the members of a database role named Finance see the unmasked values of all the masked columns in the Sales schema, including those in tables added later. Finance members must continue to see masked values in the HR schema. The solution must follow the principle of least privilege.

    Which statement should you run?
  fr: |
    Vous disposez d'une base de données Azure SQL nommée DB1 qui contient deux schémas nommés Sales et HR. Les deux schémas contiennent des tables qui ont des colonnes masquées. Les développeurs ajoutent régulièrement au schéma Sales des tables qui ont des colonnes masquées.

    Vous devez vous assurer que les membres d'un rôle de base de données nommé Finance voient les valeurs non masquées de toutes les colonnes masquées du schéma Sales, y compris celles des tables ajoutées ultérieurement. Les membres de Finance doivent continuer à voir des valeurs masquées dans le schéma HR. La solution doit respecter le principe des privilèges minimum.

    Quelle instruction devez-vous exécuter ?
body:
  options:
    - { id: a, text: "GRANT UNMASK TO Finance;" }
    - { id: b, text: "GRANT UNMASK ON Sales.Customer TO Finance;" }
    - { id: c, text: "GRANT UNMASK ON SCHEMA::Sales TO Finance;" }
    - { id: d, text: "ALTER ROLE db_owner ADD MEMBER Finance;" }
answer:
  optionId: c
explanation:
  correct:
    en: |
      UNMASK can be granted at the database, schema, table, or column level. Granting it on the Sales schema covers every masked column of every table in that schema, including tables created later, while masked columns in HR stay masked for Finance.
    fr: |
      UNMASK peut être accordé au niveau de la base de données, du schéma, de la table ou de la colonne. L'accorder sur le schéma Sales couvre toutes les colonnes masquées de toutes les tables de ce schéma, y compris les tables créées ultérieurement, tandis que les colonnes masquées de HR restent masquées pour Finance.
  options:
    a: { en: "A database-level UNMASK also unmasks the HR schema.", fr: "Un UNMASK au niveau de la base de données démasque aussi le schéma HR." }
    b: { en: "A table-level grant covers one table only, not the other tables of Sales or the tables added later.", fr: "Une autorisation au niveau de la table ne couvre qu'une table, pas les autres tables de Sales ni celles ajoutées ultérieurement." }
    d: { en: "db_owner members see all data unmasked, including HR, and receive full control of the database.", fr: "Les membres de db_owner voient toutes les données non masquées, HR compris, et obtiennent le contrôle total de la base de données." }
references:
  - title: Dynamic data masking
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/dynamic-data-masking-overview
