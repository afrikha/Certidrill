id: dp300-2a-server-roles-facts
objective: "2.1.3"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    You manage an Azure SQL Database logical server named **sql-northwind**. You plan to use the fixed server-level roles of Azure SQL Database to delegate administration tasks.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous gérez un serveur logique Azure SQL Database nommé **sql-northwind**. Vous prévoyez d'utiliser les rôles serveur fixes d'Azure SQL Database pour déléguer des tâches d'administration.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "Members of ##MS_ServerStateReader## can read the DMVs covered by VIEW DATABASE STATE in every database where they have a user account."
        fr: "Les membres de ##MS_ServerStateReader## peuvent lire les vues de gestion dynamique couvertes par VIEW DATABASE STATE dans chaque base où ils ont un compte d'utilisateur."
    - id: s2
      text:
        en: "Members of ##MS_DatabaseManager## can query the data of every database on sql-northwind."
        fr: "Les membres de ##MS_DatabaseManager## peuvent interroger les données de toutes les bases de sql-northwind."
    - id: s3
      text:
        en: When you add a login to a server role, the new permissions apply immediately to the sessions that the login already has open.
        fr: Lorsque vous ajoutez une connexion à un rôle serveur, les nouvelles autorisations s'appliquent immédiatement aux sessions déjà ouvertes par cette connexion.
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: |
      ##MS_ServerStateReader## grants VIEW SERVER STATE, and VIEW DATABASE STATE in each database where the member has a user account. ##MS_DatabaseManager## creates and deletes databases and makes its member dbo of the databases it creates, but not of the others. Role changes can take up to 5 minutes and existing sessions keep the old permissions until they reconnect.
    fr: |
      ##MS_ServerStateReader## accorde VIEW SERVER STATE, et VIEW DATABASE STATE dans chaque base où le membre a un compte d'utilisateur. ##MS_DatabaseManager## crée et supprime des bases et rend son membre dbo des bases qu'il crée, mais pas des autres. Les modifications de rôle peuvent prendre jusqu'à 5 minutes, et les sessions existantes conservent les anciennes autorisations jusqu'à leur reconnexion.
references:
  - title: Server Roles - Azure SQL Database
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/security-server-roles
