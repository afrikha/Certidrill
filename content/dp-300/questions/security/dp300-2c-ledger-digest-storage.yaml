id: dp300-2c-ledger-digest-storage
objective: "2.3.5"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    You have an Azure SQL database named DB1 on a logical server named sql-litware. DB1 contains updatable ledger tables. sql-litware has a system-assigned managed identity.

    You plan to configure automatic digest storage for DB1 in a storage account named stledgerlit. Auditors require that nobody, including the storage administrators, can modify or delete the stored digests.

    Which two actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'une base de données Azure SQL nommée DB1 sur un serveur logique nommé sql-litware. DB1 contient des tables de registre modifiables. sql-litware possède une identité managée affectée par le système.

    Vous prévoyez de configurer le stockage automatique des synthèses de DB1 dans un compte de stockage nommé stledgerlit. Les auditeurs exigent que personne, y compris les administrateurs du stockage, ne puisse modifier ni supprimer les synthèses stockées.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Assign the Storage Blob Data Reader role on stledgerlit to the managed identity of sql-litware.", fr: "Attribuer le rôle Storage Blob Data Reader sur stledgerlit à l'identité managée de sql-litware." } }
    - { id: b, text: { en: "Create a credential in DB1 that uses a SAS token for the digest container.", fr: "Créer dans DB1 des informations d'identification qui utilisent un jeton SAS pour le conteneur des synthèses." } }
    - { id: c, text: { en: "Assign the Storage Blob Data Contributor role on stledgerlit to the managed identity of sql-litware.", fr: "Attribuer le rôle Storage Blob Data Contributor sur stledgerlit à l'identité managée de sql-litware." } }
    - { id: d, text: { en: "Configure the replication of stledgerlit as locally redundant storage (LRS).", fr: "Configurer la réplication de stledgerlit en stockage localement redondant (LRS)." } }
    - { id: e, text: { en: "Configure a locked immutability policy on the digest container that allows protected append writes to append blobs.", fr: "Configurer sur le conteneur des synthèses une stratégie d'immuabilité verrouillée qui autorise les écritures d'ajout protégées dans les objets blob d'ajout." } }
answer:
  optionIds: [c, e]
explanation:
  correct:
    en: |
      For Azure SQL Database, the system identity of the logical server must have the Storage Blob Data Contributor role on the storage account so that it can upload a digest every 30 seconds when there were transactions. The digest container must have an immutability policy that is locked and allows protected append writes to append blobs, so that the digests can be added but never modified or deleted.
    fr: |
      Pour Azure SQL Database, l'identité système du serveur logique doit avoir le rôle Storage Blob Data Contributor sur le compte de stockage afin de pouvoir charger une synthèse toutes les 30 secondes lorsqu'il y a eu des transactions. Le conteneur des synthèses doit avoir une stratégie d'immuabilité verrouillée qui autorise les écritures d'ajout protégées dans les objets blob d'ajout : les synthèses peuvent être ajoutées, mais jamais modifiées ni supprimées.
  options:
    a: { en: "A reader role can't write the digests to the container.", fr: "Un rôle de lecteur ne peut pas écrire les synthèses dans le conteneur." }
    b: { en: "A SAS credential is the method for SQL Server; Azure SQL Database uses the server's identity and an Azure role.", fr: "Des informations d'identification SAS sont la méthode pour SQL Server ; Azure SQL Database utilise l'identité du serveur et un rôle Azure." }
    d: { en: "Automatic digest management with immutable blobs doesn't support LRS accounts.", fr: "La gestion automatique des synthèses avec des objets blob immuables ne prend pas en charge les comptes LRS." }
references:
  - title: Digest management
    url: https://learn.microsoft.com/en-us/sql/relational-databases/security/ledger/ledger-digest-management
  - title: Ledger considerations and limitations
    url: https://learn.microsoft.com/en-us/sql/relational-databases/security/ledger/ledger-limits
