id: dp300-2b-tde-mi-copy-database
objective: "2.2.1"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    You have two Azure SQL managed instances named **MI1** and **MI2** in the same subscription and region. MI1 hosts a database named **Ledger** that is encrypted by using service-managed transparent data encryption (TDE).

    You need to create a copy of Ledger on MI2. The data must remain encrypted at all times outside the managed instances. MI2 can access any Azure key vault that MI1 uses.

    Which two actions can you perform? Each correct answer presents a complete solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez de deux instances managées Azure SQL nommées **MI1** et **MI2** dans le même abonnement et la même région. MI1 héberge une base de données nommée **Ledger** chiffrée à l'aide du chiffrement transparent des données (TDE) géré par le service.

    Vous devez créer une copie de Ledger sur MI2. Les données doivent rester chiffrées en permanence en dehors des instances managées. MI2 peut accéder à tout coffre de clés Azure qu'utilise MI1.

    Quelles sont les deux actions que vous pouvez effectuer ? Chaque bonne réponse constitue une solution complète.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Run BACKUP DATABASE Ledger TO URL WITH COPY_ONLY on MI1, and then restore the backup on MI2.", fr: "Exécuter BACKUP DATABASE Ledger TO URL WITH COPY_ONLY sur MI1, puis restaurer la sauvegarde sur MI2." } }
    - { id: b, text: { en: "Perform a point-in-time restore of Ledger from MI1 to MI2.", fr: "Effectuer une restauration à un point dans le temps de Ledger de MI1 vers MI2." } }
    - { id: c, text: { en: "Export Ledger to a BACPAC file in Azure Storage, and then import the file to MI2.", fr: "Exporter Ledger dans un fichier BACPAC dans Stockage Azure, puis importer le fichier dans MI2." } }
    - { id: d, text: { en: "Switch the TDE protector of MI1 to a customer-managed key, take a COPY_ONLY backup to URL, and restore it on MI2.", fr: "Basculer le protecteur TDE de MI1 vers une clé gérée par le client, effectuer une sauvegarde COPY_ONLY vers une URL et la restaurer sur MI2." } }
    - { id: e, text: { en: "Back up the TDE certificate of MI1 by using BACKUP CERTIFICATE, and create it on MI2 before you restore a COPY_ONLY backup.", fr: "Sauvegarder le certificat TDE de MI1 avec BACKUP CERTIFICATE et le créer sur MI2 avant de restaurer une sauvegarde COPY_ONLY." } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: "A manual COPY_ONLY backup of a database protected by service-managed TDE is not supported in SQL Managed Instance, because the certificate is not accessible. Microsoft recommends point-in-time restore to move such a database to another managed instance, or switching to a customer-managed key, after which the backup is encrypted with a key that MI2 can also use."
    fr: "Une sauvegarde manuelle COPY_ONLY d'une base protégée par TDE géré par le service n'est pas prise en charge dans SQL Managed Instance, car le certificat n'est pas accessible. Microsoft recommande la restauration à un point dans le temps pour déplacer une telle base vers une autre instance managée, ou le passage à une clé gérée par le client, après quoi la sauvegarde est chiffrée avec une clé que MI2 peut aussi utiliser."
  options:
    a: { en: "COPY_ONLY backups are not supported for databases protected by service-managed TDE in SQL Managed Instance.", fr: "Les sauvegardes COPY_ONLY ne sont pas prises en charge pour les bases protégées par TDE géré par le service dans SQL Managed Instance." }
    c: { en: "The content of a BACPAC exported from a TDE-protected database is not encrypted, which violates the requirement.", fr: "Le contenu d'un fichier BACPAC exporté depuis une base protégée par TDE n'est pas chiffré, ce qui enfreint l'exigence." }
    e: { en: "The service-managed TDE certificate is managed by Microsoft and cannot be exported.", fr: "Le certificat TDE géré par le service est géré par Microsoft et ne peut pas être exporté." }
references:
  - title: Transparent data encryption for SQL Database and SQL Managed Instance
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/transparent-data-encryption-tde-overview
