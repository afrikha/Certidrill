id: dp300-2c-classify-policy-mode
objective: "2.3.1"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Your company uses Data Discovery & Classification on several Azure SQL databases in one Microsoft Entra tenant. The databases currently use the SQL Information Protection policy.

    The security team plans to use the Microsoft 365 sensitivity labels defined in the Microsoft Purview portal instead.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Votre entreprise utilise la découverte et classification des données sur plusieurs bases de données Azure SQL d'un même locataire Microsoft Entra. Les bases utilisent actuellement la stratégie SQL Information Protection.

    L'équipe de sécurité prévoit d'utiliser à la place les étiquettes de sensibilité Microsoft 365 définies dans le portail Microsoft Purview.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: Switching to the Microsoft Purview Information Protection policy applies to all the databases in the tenant.
        fr: Le passage à la stratégie Microsoft Purview Information Protection s'applique à toutes les bases de données du locataire.
    - id: s2
      text:
        en: In Microsoft Purview Information Protection policy mode, the classification engine still recommends columns to classify.
        fr: En mode de stratégie Microsoft Purview Information Protection, le moteur de classification recommande toujours des colonnes à classifier.
    - id: s3
      text:
        en: Running ADD SENSITIVITY CLASSIFICATION on a column that is already classified replaces the existing classification.
        fr: L'exécution d'ADD SENSITIVITY CLASSIFICATION sur une colonne déjà classifiée remplace la classification existante.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |
      The information protection policy is a tenant-wide setting that a tenant-wide Security Admin switches, and it applies to every database of the tenant. In Microsoft Purview Information Protection mode, automatic discovery and recommendations are disabled and the information type shows [n/a]. A column can have only one classification, so adding a classification to a classified column overwrites it.
    fr: |
      La stratégie de protection des informations est un paramètre à l'échelle du locataire, modifié par un Security Admin du locataire, et elle s'applique à toutes les bases de données du locataire. En mode Microsoft Purview Information Protection, la découverte automatique et les recommandations sont désactivées et le type d'informations affiche [n/a]. Une colonne ne peut avoir qu'une seule classification : en ajouter une à une colonne déjà classifiée la remplace.
references:
  - title: Data Discovery & Classification
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/data-discovery-and-classification-overview
  - title: ADD SENSITIVITY CLASSIFICATION (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/statements/add-sensitivity-classification-transact-sql
