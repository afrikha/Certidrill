id: dp300-sr2-tde-protector-1
objective: "2.2.1"
type: series_yesno
series: dp300-sr2-tde-protector
seriesOrder: 1
difficulty: 3
status: draft
stem:
  en: |
    You use a 4,096-bit RSA key with the Key Vault Crypto Service Encryption User role.
  fr: |
    Vous utilisez une clé RSA de 4 096 bits avec le rôle Key Vault Crypto Service Encryption User.
body:
  solution:
    en: |
      You create a **4,096-bit RSA** key in kv-wg1. You assign the **Key Vault Crypto Service Encryption User** role on kv-wg1 to the managed identity of sql-wg1. You then set the key as the TDE protector of sql-wg1.
    fr: |
      Vous créez une clé **RSA de 4 096 bits** dans kv-wg1. Vous attribuez le rôle **Key Vault Crypto Service Encryption User** sur kv-wg1 à l'identité managée de sql-wg1. Vous définissez ensuite la clé comme protecteur TDE de sql-wg1.
answer: { value: false }
explanation:
  correct:
    en: |
      The role is the right one, but an RSA or RSA-HSM TDE protector must be 2,048 or 3,072 bits (symmetric AES keys, also supported in Azure SQL Database, are excluded here by the policy). A 4,096-bit RSA key can exist in Key Vault, yet it cannot be set as the TDE protector.
    fr: |
      Le rôle est le bon, mais un protecteur TDE RSA ou RSA-HSM doit faire 2 048 ou 3 072 bits (les clés symétriques AES, aussi prises en charge dans Azure SQL Database, sont exclues ici par la stratégie). Une clé RSA de 4 096 bits peut exister dans Key Vault, mais elle ne peut pas être définie comme protecteur TDE.
references:
  - title: "Customer-Managed Transparent Data Encryption (TDE), Azure SQL Database & Azure SQL Managed Instance"
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/transparent-data-encryption-byok-overview
