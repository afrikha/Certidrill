id: dp300-2b-ae-connection-setting
objective: "2.2.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have an Azure SQL database named **Clients**. You encrypt the Email column of the Customer table by using Always Encrypted with deterministic encryption. The column master key is stored in Azure Key Vault.

    A .NET application that uses Microsoft.Data.SqlClient runs under a managed identity that has the required permissions on the key vault. The application queries the table with parameterized queries. After the encryption, the application receives binary values instead of email addresses.

    You need to ensure that the application receives the email addresses in plaintext.

    What should you add to the connection string of the application?
  fr: |
    Vous disposez d'une base de données Azure SQL nommée **Clients**. Vous chiffrez la colonne Email de la table Customer à l'aide d'Always Encrypted avec chiffrement déterministe. La clé principale de colonne est stockée dans Azure Key Vault.

    Une application .NET qui utilise Microsoft.Data.SqlClient s'exécute sous une identité managée qui dispose des autorisations requises sur le coffre de clés. L'application interroge la table avec des requêtes paramétrées. Depuis le chiffrement, l'application reçoit des valeurs binaires au lieu d'adresses e-mail.

    Vous devez vous assurer que l'application reçoit les adresses e-mail en clair.

    Qu'est-ce que vous devez ajouter à la chaîne de connexion de l'application ?
body:
  options:
    - { id: a, text: "Encrypt=True" }
    - { id: b, text: "Attestation Protocol=None" }
    - { id: c, text: "TrustServerCertificate=True" }
    - { id: d, text: "Column Encryption Setting=Enabled" }
answer: { optionId: d }
explanation:
  correct:
    en: "The client driver encrypts and decrypts Always Encrypted columns only when the connection enables it with Column Encryption Setting=Enabled. Without this setting, the driver returns the ciphertext stored in the column. With it, the driver retrieves the column encryption key, unwraps it with the column master key in Key Vault, and decrypts the results."
    fr: "Le pilote client ne chiffre et ne déchiffre les colonnes Always Encrypted que si la connexion l'active avec Column Encryption Setting=Enabled. Sans ce paramètre, le pilote renvoie le texte chiffré stocké dans la colonne. Avec lui, le pilote récupère la clé de chiffrement de colonne, la déchiffre avec la clé principale de colonne dans Key Vault et déchiffre les résultats."
  options:
    a: { en: "Encrypt=True enforces TLS encryption of the connection; it does not decrypt Always Encrypted columns.", fr: "Encrypt=True impose le chiffrement TLS de la connexion ; il ne déchiffre pas les colonnes Always Encrypted." }
    b: { en: "Attestation Protocol is used only for Always Encrypted with secure enclaves, and it does not enable Always Encrypted by itself.", fr: "Attestation Protocol ne sert qu'à Always Encrypted avec enclaves sécurisées, et il n'active pas Always Encrypted à lui seul." }
    c: { en: "TrustServerCertificate controls validation of the server's TLS certificate; it has nothing to do with column decryption.", fr: "TrustServerCertificate contrôle la validation du certificat TLS du serveur ; il n'a aucun rapport avec le déchiffrement des colonnes." }
references:
  - title: Always Encrypted
    url: https://learn.microsoft.com/en-us/sql/relational-databases/security/encryption/always-encrypted-database-engine
