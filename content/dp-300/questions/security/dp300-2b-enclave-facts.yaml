id: dp300-2b-enclave-facts
objective: "2.2.5"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    You have an Azure SQL database named **Sales** on standard-series hardware with VBS secure enclaves enabled. The CustomerName column of the Customer table is encrypted with randomized encryption and an enclave-enabled column encryption key.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'une base de données Azure SQL nommée **Sales** sur du matériel de série standard, dans laquelle les enclaves sécurisées VBS sont activées. La colonne CustomerName de la table Customer est chiffrée avec un chiffrement aléatoire et une clé de chiffrement de colonne compatible enclave.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: Client applications must be configured to use Microsoft Azure Attestation to query CustomerName.
        fr: Les applications clientes doivent être configurées pour utiliser Microsoft Azure Attestation afin d'interroger CustomerName.
    - id: s2
      text:
        en: You can create a nonclustered index on CustomerName to speed up queries that use the enclave.
        fr: Vous pouvez créer un index non cluster sur CustomerName pour accélérer les requêtes qui utilisent l'enclave.
    - id: s3
      text:
        en: CustomerName can be used as the primary key of the Customer table.
        fr: CustomerName peut servir de clé primaire de la table Customer.
answer:
  values: { s1: false, s2: true, s3: false }
explanation:
  correct:
    en: "VBS enclaves in Azure SQL Database do not support attestation, so clients use the attestation protocol None. Nonclustered indexes can be created on enclave-enabled columns that use randomized encryption, and Microsoft recommends enabling accelerated database recovery first. Such columns cannot be primary keys or be referenced by foreign key or unique constraints."
    fr: "Les enclaves VBS d'Azure SQL Database ne prennent pas en charge l'attestation : les clients utilisent le protocole d'attestation None. Des index non cluster peuvent être créés sur les colonnes compatibles enclave à chiffrement aléatoire, et Microsoft recommande d'activer d'abord la récupération de base de données accélérée. Ces colonnes ne peuvent pas être des clés primaires ni être référencées par des contraintes de clé étrangère ou d'unicité."
references:
  - title: Always Encrypted with secure enclaves
    url: https://learn.microsoft.com/en-us/sql/relational-databases/security/encryption/always-encrypted-enclaves
