id: dp300-2a-auth-method-match
objective: "2.1.2"
type: dragdrop
difficulty: 3
status: draft
stem:
  en: |
    Proseware has the following SQL Server resources in Azure:

    | Name | Type | Details |
    | --- | --- | --- |
    | VM1 | Azure VM | SQL Server 2019, mixed mode, not joined to a domain |
    | VM2 | Azure VM | SQL Server 2022, joined to the proseware.local AD DS domain |
    | MI1 | Azure SQL Managed Instance | Microsoft Entra admin set |

    You need to choose an authentication method for each connection requirement.

    Which authentication method should you use for each requirement? To answer, drag the appropriate methods to the correct requirements. Each method may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware dispose des ressources SQL Server suivantes dans Azure :

    | Nom | Type | Détails |
    | --- | --- | --- |
    | VM1 | Machine virtuelle Azure | SQL Server 2019, mode mixte, non jointe à un domaine |
    | VM2 | Machine virtuelle Azure | SQL Server 2022, jointe au domaine AD DS proseware.local |
    | MI1 | Azure SQL Managed Instance | Administrateur Microsoft Entra défini |

    Vous devez choisir une méthode d'authentification pour chaque exigence de connexion.

    Quelle méthode d'authentification devez-vous utiliser pour chaque exigence ? Pour répondre, faites glisser les méthodes appropriées vers les exigences correspondantes. Chaque méthode peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: sql, text: { en: "SQL authentication", fr: "Authentification SQL" } }
    - { id: adds, text: { en: "Windows authentication with an AD DS account", fr: "Authentification Windows avec un compte AD DS" } }
    - { id: kerb, text: { en: "Windows Authentication for Microsoft Entra principals", fr: "Authentification Windows pour les principaux Microsoft Entra" } }
    - { id: mi, text: { en: "Microsoft Entra authentication with a managed identity", fr: "Authentification Microsoft Entra avec une identité managée" } }
    - { id: mfa, text: { en: "Microsoft Entra MFA", fr: "Microsoft Entra MFA" } }
  targets:
    - id: t1
      text: { en: "VM1: a vendor tool that can only send a user name and a password", fr: "VM1 : un outil d'éditeur qui ne peut envoyer qu'un nom d'utilisateur et un mot de passe" }
    - id: t2
      text: { en: "VM2: an on-premises Windows service that runs under an AD DS service account", fr: "VM2 : un service Windows local qui s'exécute sous un compte de service AD DS" }
    - id: t3
      text: { en: "MI1: a legacy desktop application that uses Windows authentication from hybrid joined computers and can't be modified", fr: "MI1 : une application de bureau héritée qui utilise l'authentification Windows depuis des ordinateurs joints hybrides et ne peut pas être modifiée" }
    - id: t4
      text: { en: "MI1: an Azure Functions app that must not store any secret", fr: "MI1 : une application Azure Functions qui ne doit stocker aucun secret" }
answer:
  mapping: { t1: sql, t2: adds, t3: kerb, t4: mi }
explanation:
  correct:
    en: |
      VM1 runs SQL Server 2019, which doesn't support Microsoft Entra authentication, and the tool can only send credentials, so a SQL login in mixed mode is the answer. VM2 is joined to AD DS, which handles service accounts; Microsoft Entra ID doesn't support them. Windows Authentication for Microsoft Entra principals keeps Windows authentication on SQL Managed Instance without changing the application, and a managed identity gives the Azure Functions app a token without any stored secret.
    fr: |
      VM1 exécute SQL Server 2019, qui ne prend pas en charge l'authentification Microsoft Entra, et l'outil ne peut envoyer que des identifiants : une connexion SQL en mode mixte est la réponse. VM2 est jointe à AD DS, qui gère les comptes de service ; Microsoft Entra ID ne les prend pas en charge. L'authentification Windows pour les principaux Microsoft Entra conserve l'authentification Windows sur SQL Managed Instance sans modifier l'application, et une identité managée fournit un jeton à l'application Azure Functions sans aucun secret stocké.
  options:
    mfa: { en: "MFA is interactive; none of the requirements is an interactive sign-in by a person.", fr: "MFA est interactif ; aucune des exigences n'est une connexion interactive par une personne." }
references:
  - title: What is Windows Authentication for Microsoft Entra principals on Azure SQL Managed Instance?
    url: https://learn.microsoft.com/en-us/azure/azure-sql/managed-instance/winauth-azuread-overview
  - title: Microsoft Entra authentication for SQL Server
    url: https://learn.microsoft.com/en-us/sql/relational-databases/security/authentication-access/azure-ad-authentication-sql-server-overview
