id: dp300-2a-login-central-disable
objective: "2.1.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    You have an Azure SQL Database logical server named **sql-northwind** that hosts 25 databases. A Microsoft Entra user account named **svc-etl@northwind.com** must read data in each of the 25 databases.

    The security team must be able to block the access of svc-etl to all 25 databases by running a single Transact-SQL statement, without dropping any principal.

    How should you create the principals for svc-etl?
  fr: |
    Vous disposez d'un serveur logique Azure SQL Database nommé **sql-northwind** qui héberge 25 bases de données. Un compte d'utilisateur Microsoft Entra nommé **svc-etl@northwind.com** doit lire des données dans chacune des 25 bases.

    L'équipe de sécurité doit pouvoir bloquer l'accès de svc-etl aux 25 bases en exécutant une seule instruction Transact-SQL, sans supprimer aucun principal.

    Comment devez-vous créer les principaux de svc-etl ?
body:
  options:
    - { id: a, text: { en: "Run CREATE LOGIN ... FROM EXTERNAL PROVIDER in master, and then CREATE USER ... FROM LOGIN in each database.", fr: "Exécuter CREATE LOGIN ... FROM EXTERNAL PROVIDER dans master, puis CREATE USER ... FROM LOGIN dans chaque base." } }
    - { id: b, text: { en: "Run CREATE USER ... FROM EXTERNAL PROVIDER in each database, and then add the user to db_datareader.", fr: "Exécuter CREATE USER ... FROM EXTERNAL PROVIDER dans chaque base, puis ajouter l'utilisateur à db_datareader." } }
    - { id: c, text: { en: "Add svc-etl to a group, run CREATE LOGIN for the group in master, and then CREATE USER ... FROM LOGIN in each database.", fr: "Ajouter svc-etl à un groupe, exécuter CREATE LOGIN pour le groupe dans master, puis CREATE USER ... FROM LOGIN dans chaque base." } }
    - { id: d, text: { en: "Set svc-etl as the Microsoft Entra admin of sql-northwind, and then grant it SELECT in each database.", fr: "Définir svc-etl comme administrateur Microsoft Entra de sql-northwind, puis lui accorder SELECT dans chaque base." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      A Microsoft Entra login in master with login-based users in each database can be blocked everywhere with ALTER LOGIN [svc-etl@northwind.com] DISABLE: disabling a login blocks the login and every database user created from it. You then clear the authentication caches so that the change applies immediately.
    fr: |
      Une connexion Microsoft Entra dans master avec des utilisateurs basés sur cette connexion dans chaque base peut être bloquée partout avec ALTER LOGIN [svc-etl@northwind.com] DISABLE : la désactivation d'une connexion bloque la connexion et tous les utilisateurs de base de données créés à partir d'elle. Vous videz ensuite les caches d'authentification pour que la modification s'applique immédiatement.
  options:
    b:
      en: Contained users aren't tied to a login, so ALTER LOGIN DISABLE doesn't affect them; you would need 25 statements.
      fr: "Les utilisateurs autonomes ne sont pas liés à une connexion : ALTER LOGIN DISABLE ne les affecte pas, et il faudrait 25 instructions."
    c:
      en: ALTER LOGIN ... DISABLE isn't supported for Microsoft Entra group logins.
      fr: ALTER LOGIN ... DISABLE n'est pas pris en charge pour les connexions de groupes Microsoft Entra.
    d:
      en: The Microsoft Entra admin is a full administrator, which violates least privilege, and blocking it by removing the admin would disable all Microsoft Entra connections.
      fr: L'administrateur Microsoft Entra est un administrateur complet, ce qui viole le privilège minimum, et le bloquer en supprimant l'administrateur désactiverait toutes les connexions Microsoft Entra.
references:
  - title: Microsoft Entra server principals
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/authentication-azure-ad-logins
