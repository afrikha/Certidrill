id: dp300-2b-block-contained-user
objective: "2.1.8"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    You have an Azure SQL database named **HRDB**. HRDB contains a contained database user named **audit_temp** that authenticates with a password. audit_temp is a member of the db_datareader role and owns no schemas or objects.

    An external audit has ended. You need to prevent audit_temp from connecting to HRDB.

    Which two Transact-SQL statements can you run in HRDB? Each correct answer presents a complete solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'une base de données Azure SQL nommée **HRDB**. HRDB contient un utilisateur de base de données autonome nommé **audit_temp** qui s'authentifie avec un mot de passe. audit_temp est membre du rôle db_datareader et ne possède aucun schéma ni aucun objet.

    Un audit externe est terminé. Vous devez empêcher audit_temp de se connecter à HRDB.

    Quelles sont les deux instructions Transact-SQL que vous pouvez exécuter dans HRDB ? Chaque bonne réponse constitue une solution complète.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: "ALTER LOGIN audit_temp DISABLE;" }
    - { id: b, text: "DENY CONNECT TO audit_temp;" }
    - { id: c, text: "ALTER ROLE db_datareader DROP MEMBER audit_temp;" }
    - { id: d, text: "DROP USER audit_temp;" }
    - { id: e, text: "REVOKE SELECT ON SCHEMA::dbo FROM audit_temp;" }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: "A contained user authenticates in the database itself, so access is controlled in HRDB. DENY CONNECT removes the right to connect to the database while keeping the user for later, and DROP USER deletes the principal, which is possible because audit_temp owns no schema or object."
    fr: "Un utilisateur autonome s'authentifie dans la base elle-même : l'accès se contrôle donc dans HRDB. DENY CONNECT retire le droit de se connecter à la base tout en conservant l'utilisateur pour plus tard, et DROP USER supprime le principal, ce qui est possible, car audit_temp ne possède ni schéma ni objet."
  options:
    a: { en: "audit_temp is a contained user, not a login: there is no server principal named audit_temp to disable.", fr: "audit_temp est un utilisateur autonome, pas une connexion : il n'existe aucun principal de serveur nommé audit_temp à désactiver." }
    c: { en: "Removing the role membership takes away read access, but the user can still connect to HRDB.", fr: "Retirer l'appartenance au rôle supprime l'accès en lecture, mais l'utilisateur peut toujours se connecter à HRDB." }
    e: { en: "audit_temp reads data through db_datareader, not through a schema grant, and REVOKE SELECT does not affect the CONNECT permission.", fr: "audit_temp lit les données grâce à db_datareader, pas grâce à une autorisation sur le schéma, et REVOKE SELECT n'a aucun effet sur l'autorisation CONNECT." }
references:
  - title: DENY Database Permissions (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/statements/deny-database-permissions-transact-sql
