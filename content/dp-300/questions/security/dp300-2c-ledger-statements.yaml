id: dp300-2c-ledger-statements
objective: "2.3.5"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    You have an Azure SQL database named DB1 that contains an updatable ledger table named Inventory.StockLevel. Automatic digest storage is configured for DB1.

    A database administrator named Admin1 is a member of the db_owner role in DB1.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'une base de données Azure SQL nommée DB1 qui contient une table de registre modifiable nommée Inventory.StockLevel. Le stockage automatique des synthèses est configuré pour DB1.

    Un administrateur de base de données nommé Admin1 est membre du rôle db_owner dans DB1.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: The ledger feature prevents Admin1 from updating rows in Inventory.StockLevel.
        fr: La fonctionnalité de registre empêche Admin1 de mettre à jour des lignes dans Inventory.StockLevel.
    - id: s2
      text:
        en: The previous versions of the rows updated in Inventory.StockLevel are stored in a history table.
        fr: Les versions précédentes des lignes mises à jour dans Inventory.StockLevel sont stockées dans une table d'historique.
    - id: s3
      text:
        en: If Admin1 drops Inventory.StockLevel, its data is permanently removed from DB1.
        fr: Si Admin1 supprime Inventory.StockLevel, ses données sont définitivement retirées de DB1.
answer:
  values: { s1: false, s2: true, s3: false }
explanation:
  correct:
    en: |
      Ledger makes tampering detectable, not impossible: a user with the right permissions can update an updatable ledger table, and each change is hashed into the ledger so that verification reveals it. An updatable ledger table keeps the earlier row versions in an automatically created history table. A dropped ledger table isn't deleted: it is renamed and hidden, and its data stays in the database for verification and auditing.
    fr: |
      Le registre rend la falsification détectable, pas impossible : un utilisateur disposant des autorisations nécessaires peut mettre à jour une table de registre modifiable, et chaque changement est haché dans le registre pour que la vérification le révèle. Une table de registre modifiable conserve les versions antérieures des lignes dans une table d'historique créée automatiquement. Une table de registre supprimée n'est pas effacée : elle est renommée et masquée, et ses données restent dans la base pour la vérification et l'audit.
references:
  - title: Ledger overview
    url: https://learn.microsoft.com/en-us/sql/relational-databases/security/ledger/ledger-overview
  - title: Ledger considerations and limitations
    url: https://learn.microsoft.com/en-us/sql/relational-databases/security/ledger/ledger-limits
