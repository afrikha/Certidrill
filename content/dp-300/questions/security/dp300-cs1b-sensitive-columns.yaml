id: dp300-cs1b-sensitive-columns
objective: "2.3.4"
type: dragdrop
caseStudy: dp300-cs1b-margies-travel
difficulty: 1
status: draft
stem:
  en: |
    You need to meet the security requirements for the tenant databases.

    Which feature should you use for each requirement? To answer, drag the appropriate features to the correct requirements. Each feature may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez satisfaire les exigences de sécurité concernant les bases de données de locataire.

    Quelle fonctionnalité devez-vous utiliser pour chaque exigence ? Pour répondre, faites glisser les fonctionnalités appropriées vers les exigences correspondantes. Chaque fonctionnalité peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: ddm, text: { en: "Dynamic data masking", fr: "Masquage dynamique des données" } }
    - { id: ae, text: Always Encrypted }
    - { id: ledger, text: { en: "Ledger tables", fr: "Tables de registre" } }
    - { id: tde, text: { en: "Transparent data encryption (TDE)", fr: "Chiffrement transparent des données (TDE)" } }
    - { id: rls, text: { en: "Row-level security", fr: "Sécurité au niveau des lignes" } }
  targets:
    - { id: phone, text: { en: "Phone numbers: support agents see only the last four digits", fr: "Numéros de téléphone : les agents du support ne voient que les quatre derniers chiffres" } }
    - { id: passport, text: { en: "Passport numbers: plaintext only for the booking application", fr: "Numéros de passeport : texte clair uniquement pour l'application de réservation" } }
    - { id: refunds, text: { en: "Refunds: changes detectable through cryptographic verification", fr: "Refunds : modifications détectables par vérification cryptographique" } }
answer:
  mapping: { phone: ddm, passport: ae, refunds: ledger }
explanation:
  correct:
    en: |
      Dynamic data masking with a partial function returns only the last four digits to users who lack the UNMASK permission, while the full value stays stored. Always Encrypted encrypts the passport column on the client side with keys that the database engine never holds, so DBAs and cloud operators cannot see the plaintext. Ledger tables keep a cryptographic history of row changes that an auditor can check by verifying the database digests.
    fr: |
      Le masquage dynamique des données avec une fonction partielle ne renvoie que les quatre derniers chiffres aux utilisateurs qui n'ont pas l'autorisation UNMASK, tandis que la valeur complète reste stockée. Always Encrypted chiffre la colonne des passeports côté client avec des clés que le moteur de base de données ne détient jamais : les DBA et les opérateurs cloud ne peuvent pas voir le texte clair. Les tables de registre conservent un historique cryptographique des modifications de lignes, qu'un auditeur peut contrôler en vérifiant les digests de la base de données.
  options:
    tde: { en: "TDE encrypts data files and backups at rest, but any user with SELECT permission, including DBAs, reads the plaintext.", fr: "TDE chiffre au repos les fichiers de données et les sauvegardes, mais tout utilisateur disposant de l'autorisation SELECT, DBA compris, lit le texte clair." }
    rls: { en: "Row-level security restricts which rows a user can access; it neither masks nor encrypts column values and does not record changes.", fr: "La sécurité au niveau des lignes limite les lignes accessibles à un utilisateur ; elle ne masque ni ne chiffre les valeurs des colonnes et n'enregistre pas les modifications." }
references:
  - title: Dynamic data masking
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/dynamic-data-masking-overview
  - title: Ledger overview
    url: https://learn.microsoft.com/en-us/sql/relational-databases/security/ledger/ledger-overview
