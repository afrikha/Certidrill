id: dp300-2b-enclave-in-place
objective: "2.2.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have an Azure SQL database named **Orders** with VBS secure enclaves enabled. The Customer table contains 80 million rows. Its Phone column is stored in plaintext.

    You need to encrypt the existing Phone values by using Always Encrypted. The data must not be moved out of the database to be encrypted, and the time needed for the operation must be minimized.

    What should you do?
  fr: |
    Vous disposez d'une base de données Azure SQL nommée **Orders** dans laquelle les enclaves sécurisées VBS sont activées. La table Customer contient 80 millions de lignes. Sa colonne Phone est stockée en clair.

    Vous devez chiffrer les valeurs Phone existantes à l'aide d'Always Encrypted. Les données ne doivent pas sortir de la base pour être chiffrées, et la durée de l'opération doit être réduite au minimum.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Create keys without Allow enclave computations, and run the SSMS Always Encrypted wizard.", fr: "Créer des clés sans Allow enclave computations, puis exécuter l'Assistant Always Encrypted de SSMS." } }
    - { id: b, text: { en: "Create enclave-enabled keys, and run ALTER TABLE ... ALTER COLUMN ... ENCRYPTED WITH.", fr: "Créer des clés compatibles enclave, puis exécuter ALTER TABLE ... ALTER COLUMN ... ENCRYPTED WITH." } }
    - { id: c, text: { en: "Create keys without Allow enclave computations, and run Set-SqlColumnEncryption.", fr: "Créer des clés sans Allow enclave computations, puis exécuter Set-SqlColumnEncryption." } }
    - { id: d, text: { en: "Create enclave-enabled keys, and export the table to a BACPAC file to encrypt it.", fr: "Créer des clés compatibles enclave, puis exporter la table dans un fichier BACPAC pour la chiffrer." } }
answer: { optionId: b }
explanation:
  correct:
    en: "With enclave-enabled keys, Always Encrypted supports in-place encryption: ALTER TABLE ... ALTER COLUMN ... ENCRYPTED WITH encrypts the column inside the secure enclave of the database engine, so the data never leaves the database. The statement runs from a session with Always Encrypted and secure enclaves enabled."
    fr: "Avec des clés compatibles enclave, Always Encrypted prend en charge le chiffrement sur place : ALTER TABLE ... ALTER COLUMN ... ENCRYPTED WITH chiffre la colonne dans l'enclave sécurisée du moteur de base de données, et les données ne quittent jamais la base. L'instruction s'exécute depuis une session où Always Encrypted et les enclaves sécurisées sont activés."
  options:
    a: { en: "Without enclave-enabled keys, the wizard moves the data to the client machine to encrypt it, which is slow for large tables and violates the requirement.", fr: "Sans clés compatibles enclave, l'Assistant déplace les données vers l'ordinateur client pour les chiffrer, ce qui est lent pour les grandes tables et enfreint l'exigence." }
    c: { en: "Without enclave-enabled keys, the PowerShell cmdlet also downloads, encrypts and uploads the data outside the database.", fr: "Sans clés compatibles enclave, l'applet de commande PowerShell télécharge, chiffre et renvoie elle aussi les données en dehors de la base." }
    d: { en: "A BACPAC export does not encrypt columns and moves the data out of the database.", fr: "Un export BACPAC ne chiffre pas les colonnes et fait sortir les données de la base." }
references:
  - title: Always Encrypted with secure enclaves
    url: https://learn.microsoft.com/en-us/sql/relational-databases/security/encryption/always-encrypted-enclaves
