id: dp300-2a-entra-group-admin
objective: "2.1.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    You have an Azure SQL Database logical server named **sql-adatum** that hosts three databases named DB1, DB2 and DB3. You set a Microsoft Entra security group named **DBA-Team** as the Microsoft Entra admin of sql-adatum.

    Which two statements are true?

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un serveur logique Azure SQL Database nommé **sql-adatum** qui héberge trois bases de données nommées DB1, DB2 et DB3. Vous définissez un groupe de sécurité Microsoft Entra nommé **DBA-Team** comme administrateur Microsoft Entra de sql-adatum.

    Quelles sont les deux affirmations vraies ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Every member of DBA-Team can sign in to the server as an administrator.", fr: "Chaque membre de DBA-Team peut se connecter au serveur en tant qu'administrateur." } }
    - { id: b, text: { en: "You can also set an individual user as a second Microsoft Entra admin of sql-adatum.", fr: "Vous pouvez aussi définir un utilisateur individuel comme second administrateur Microsoft Entra de sql-adatum." } }
    - { id: c, text: { en: "In DB1, DB2 and DB3, members of DBA-Team are mapped to the dbo user.", fr: "Dans DB1, DB2 et DB3, les membres de DBA-Team sont mappés sur l'utilisateur dbo." } }
    - { id: d, text: { en: "If you later remove the Microsoft Entra admin, Microsoft Entra users created in DB1 can still connect to DB1.", fr: "Si vous supprimez plus tard l'administrateur Microsoft Entra, les utilisateurs Microsoft Entra créés dans DB1 peuvent toujours se connecter à DB1." } }
    - { id: e, text: { en: "Members of DBA-Team receive the Contributor role on the sql-adatum resource.", fr: "Les membres de DBA-Team reçoivent le rôle Contributor sur la ressource sql-adatum." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: When a group is the Microsoft Entra admin, all its members inherit the admin role. The admin is a member of db_owner in every user database and is mapped as dbo.
    fr: Lorsqu'un groupe est l'administrateur Microsoft Entra, tous ses membres héritent du rôle d'administrateur. L'administrateur est membre de db_owner dans chaque base utilisateur et est mappé en tant que dbo.
  options:
    b: { en: "A server or managed instance has a single Microsoft Entra admin; use a group to give the role to several people.", fr: "Un serveur ou une instance managée n'a qu'un seul administrateur Microsoft Entra ; utilisez un groupe pour donner le rôle à plusieurs personnes." }
    d: { en: "Removing the Microsoft Entra admin disables all Microsoft Entra connections, even for users who have database permissions.", fr: "La suppression de l'administrateur Microsoft Entra désactive toutes les connexions Microsoft Entra, même pour les utilisateurs qui ont des autorisations dans la base." }
    e: { en: "The Microsoft Entra admin is a SQL principal; it doesn't grant any Azure RBAC role on the resource.", fr: "L'administrateur Microsoft Entra est un principal SQL ; il n'accorde aucun rôle Azure RBAC sur la ressource." }
references:
  - title: Microsoft Entra authentication for Azure SQL
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/authentication-aad-overview
