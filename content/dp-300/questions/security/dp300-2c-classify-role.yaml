id: dp300-2c-classify-role
objective: "2.3.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have an Azure SQL database named DB1 on a logical server named sql-fabrikam.

    A security officer named User1 must be able to review the classification recommendations for DB1 in the Azure portal, accept them, and change the labels of classified columns. User1 currently has no role assignments.

    You need to assign a role to User1 at the scope of DB1. The solution must follow the principle of least privilege.

    Which role should you assign?
  fr: |
    Vous disposez d'une base de données Azure SQL nommée DB1 sur un serveur logique nommé sql-fabrikam.

    Un responsable de la sécurité nommé User1 doit pouvoir examiner les recommandations de classification de DB1 dans le portail Azure, les accepter et modifier les étiquettes des colonnes classifiées. User1 n'a actuellement aucune attribution de rôle.

    Vous devez attribuer un rôle à User1 dans l'étendue de DB1. La solution doit respecter le principe des privilèges minimum.

    Quel rôle devez-vous attribuer ?
body:
  options:
    - { id: a, text: Reader }
    - { id: b, text: SQL Security Manager }
    - { id: c, text: Owner }
    - { id: d, text: User Access Administrator }
answer:
  optionId: b
explanation:
  correct:
    en: |
      Modifying classifications requires the sensitivity label write actions, which Owner, Contributor and SQL Security Manager include. SQL Security Manager is limited to security features of the server and databases, so it is the least privileged of the roles that can accept recommendations and change labels.
    fr: |
      La modification des classifications exige les actions d'écriture sur les étiquettes de sensibilité, que contiennent Owner, Contributor et SQL Security Manager. SQL Security Manager se limite aux fonctionnalités de sécurité du serveur et des bases de données : c'est le rôle le moins privilégié parmi ceux qui peuvent accepter les recommandations et modifier les étiquettes.
  options:
    a: { en: "Reader can view classifications but cannot accept recommendations or change labels.", fr: "Reader peut consulter les classifications, mais ne peut ni accepter les recommandations ni modifier les étiquettes." }
    c: { en: "Owner can modify classifications, but it grants full control of the resource, including access management, which exceeds the requirement.", fr: "Owner peut modifier les classifications, mais il donne le contrôle total de la ressource, y compris la gestion des accès, ce qui dépasse l'exigence." }
    d: { en: "User Access Administrator can read classifications and manage role assignments, but it cannot modify classifications.", fr: "User Access Administrator peut lire les classifications et gérer les attributions de rôles, mais il ne peut pas modifier les classifications." }
references:
  - title: Data Discovery & Classification
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/data-discovery-and-classification-overview
