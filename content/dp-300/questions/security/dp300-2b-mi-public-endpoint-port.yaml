id: dp300-2b-mi-public-endpoint-port
objective: "2.2.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have an Azure SQL managed instance named **MI1**. You enable the public endpoint of MI1 so that a partner's reporting tool can connect from the partner's static public IP address.

    You need to add an inbound rule to the network security group of the MI1 subnet that allows only this traffic.

    Which destination port should the rule allow?
  fr: |
    Vous disposez d'une instance managée Azure SQL nommée **MI1**. Vous activez le point de terminaison public de MI1 pour qu'un outil de création de rapports d'un partenaire puisse se connecter depuis l'adresse IP publique statique de ce partenaire.

    Vous devez ajouter au groupe de sécurité réseau du sous-réseau de MI1 une règle entrante qui autorise uniquement ce trafic.

    Quel port de destination la règle doit-elle autoriser ?
shuffle: false
body:
  options:
    - { id: a, text: "443" }
    - { id: b, text: "1433" }
    - { id: c, text: "3342" }
    - { id: d, text: "11000-11999" }
answer: { optionId: c }
explanation:
  correct:
    en: "The public endpoint of a managed instance listens on port 3342, and Microsoft recommends a network security group rule that allows only known source IP addresses on that port. The public endpoint always uses the proxy connection type."
    fr: "Le point de terminaison public d'une instance managée écoute sur le port 3342, et Microsoft recommande une règle de groupe de sécurité réseau qui n'autorise que des adresses IP sources connues sur ce port. Le point de terminaison public utilise toujours le type de connexion proxy."
  options:
    a: { en: "Port 443 is used for HTTPS, not for TDS connections to the managed instance.", fr: "Le port 443 sert à HTTPS, pas aux connexions TDS vers l'instance managée." }
    b: { en: "Port 1433 is used by the VNet-local endpoint, not by the public endpoint.", fr: "Le port 1433 est utilisé par le point de terminaison local du réseau virtuel, pas par le point de terminaison public." }
    d: { en: "The 11000-11999 range is used by the redirect connection type inside the virtual network; the public endpoint always uses the proxy type.", fr: "La plage 11000-11999 est utilisée par le type de connexion redirection au sein du réseau virtuel ; le point de terminaison public utilise toujours le type proxy." }
references:
  - title: Use Azure SQL Managed Instance Securely with Public Endpoints
    url: https://learn.microsoft.com/en-us/azure/azure-sql/managed-instance/public-endpoint-overview
