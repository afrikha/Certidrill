id: dp300-2c-ddm-feature
objective: "2.3.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have an Azure SQL database named DB1 that contains a table named dbo.Patient. Call center agents query dbo.Patient through an existing reporting tool.

    You need to ensure that the agents see the PhoneNumber column as a masked value in their query results, while supervisors see the full phone numbers. The stored data must not change, and the reporting tool must not be modified.

    What should you implement?
  fr: |
    Vous disposez d'une base de données Azure SQL nommée DB1 qui contient une table nommée dbo.Patient. Les agents du centre d'appels interrogent dbo.Patient au moyen d'un outil de création de rapports existant.

    Vous devez vous assurer que les agents voient la colonne PhoneNumber sous forme de valeur masquée dans les résultats de leurs requêtes, tandis que les superviseurs voient les numéros de téléphone complets. Les données stockées ne doivent pas changer et l'outil de création de rapports ne doit pas être modifié.

    Que devez-vous implémenter ?
body:
  options:
    - { id: a, text: { en: "Row-level security", fr: "La sécurité au niveau des lignes" } }
    - { id: b, text: Always Encrypted }
    - { id: c, text: { en: "Transparent data encryption (TDE)", fr: "Le chiffrement transparent des données (TDE)" } }
    - { id: d, text: { en: "Dynamic data masking", fr: "Le masquage dynamique des données" } }
answer:
  optionId: d
explanation:
  correct:
    en: |
      Dynamic data masking hides values in query results for users who lack the UNMASK permission, without changing the stored data or the application. You add a masking rule to PhoneNumber and grant UNMASK to the supervisors.
    fr: |
      Le masquage dynamique des données masque les valeurs dans les résultats des requêtes pour les utilisateurs qui n'ont pas l'autorisation UNMASK, sans modifier les données stockées ni l'application. Vous ajoutez une règle de masquage à PhoneNumber et accordez UNMASK aux superviseurs.
  options:
    a: { en: "Row-level security restricts which rows a user can access; it doesn't mask column values.", fr: "La sécurité au niveau des lignes limite les lignes accessibles à un utilisateur ; elle ne masque pas les valeurs des colonnes." }
    b: { en: "Always Encrypted changes the stored data into ciphertext and requires a client driver with access to the keys, which means changing the reporting tool's connection.", fr: "Always Encrypted transforme les données stockées en texte chiffré et exige un pilote client ayant accès aux clés, ce qui implique de modifier la connexion de l'outil de création de rapports." }
    c: { en: "TDE encrypts data at rest; every user with SELECT permission still sees the plaintext values.", fr: "TDE chiffre les données au repos ; tout utilisateur disposant de SELECT voit toujours les valeurs en clair." }
references:
  - title: Dynamic data masking
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/dynamic-data-masking-overview
