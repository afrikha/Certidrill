id: dp300-cs1c-iban-encryption
objective: "2.2.5"
type: single
caseStudy: dp300-cs1c-litware-energy
difficulty: 2
status: draft
stem:
  en: |
    You need to protect the IBAN column to meet the security requirements. What should you implement?
  fr: |
    Vous devez protéger la colonne IBAN pour satisfaire les exigences de sécurité. Que devez-vous implémenter ?
body:
  options:
    - { id: a, text: { en: "Always Encrypted with deterministic encryption and a column master key in Azure Key Vault", fr: "Always Encrypted avec chiffrement déterministe et une clé principale de colonne dans Azure Key Vault" } }
    - { id: b, text: { en: "Always Encrypted with VBS secure enclaves and randomized encryption with an enclave-enabled key", fr: "Always Encrypted avec enclaves sécurisées VBS et chiffrement aléatoire avec une clé compatible enclave" } }
    - { id: c, text: { en: "Transparent data encryption (TDE) with a customer-managed key in Azure Key Vault", fr: "Chiffrement transparent des données (TDE) avec une clé gérée par le client dans Azure Key Vault" } }
    - { id: d, text: { en: "Dynamic data masking with a partial() masking function on the IBAN column", fr: "Masquage dynamique des données avec une fonction de masquage partial() sur la colonne IBAN" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Always Encrypted keeps the keys outside the database engine, so the VM administrators and the DBAs never see the plaintext. Pattern matching with LIKE on an encrypted column is possible only inside a secure enclave, and it requires randomized encryption with an enclave-enabled column encryption key. SQL Server 2022 on Windows supports VBS enclaves, and the column can be encrypted in place with ALTER TABLE.
    fr: |
      Always Encrypted conserve les clés en dehors du moteur de base de données : les administrateurs des machines virtuelles et les DBA ne voient jamais le texte clair. La recherche de modèle avec LIKE sur une colonne chiffrée n'est possible que dans une enclave sécurisée, et elle exige un chiffrement aléatoire avec une clé de chiffrement de colonne compatible enclave. SQL Server 2022 sous Windows prend en charge les enclaves VBS, et la colonne peut être chiffrée sur place avec ALTER TABLE.
  options:
    a: { en: "Without an enclave, a deterministically encrypted column supports equality comparisons only, not LIKE.", fr: "Sans enclave, une colonne à chiffrement déterministe ne prend en charge que les comparaisons d'égalité, pas LIKE." }
    c: { en: "TDE encrypts data at rest only; the DBAs and anyone who can query the table read the plaintext.", fr: "TDE ne chiffre que les données au repos ; les DBA et toute personne qui peut interroger la table lisent le texte clair." }
    d: { en: "Dynamic data masking does not encrypt the data, and administrators who have the UNMASK or CONTROL permission see the real values.", fr: "Le masquage dynamique des données ne chiffre pas les données, et les administrateurs qui disposent de l'autorisation UNMASK ou CONTROL voient les valeurs réelles." }
references:
  - title: Always Encrypted with secure enclaves
    url: https://learn.microsoft.com/en-us/sql/relational-databases/security/encryption/always-encrypted-enclaves
