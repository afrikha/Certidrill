id: dp300-2a-entra-admin-first
objective: "2.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have an Azure SQL Database logical server named **sql-contoso-prod** that was deployed with SQL authentication only. The server admin login is **sqladmin**.

    The database administrators are members of a Microsoft Entra security group named **SQL-DBAs**. You need to ensure that the members of SQL-DBAs can sign in to sql-contoso-prod by using Microsoft Entra MFA and can then create other Microsoft Entra users in the databases.

    What should you do?
  fr: |
    Vous disposez d'un serveur logique Azure SQL Database nommé **sql-contoso-prod**, déployé avec l'authentification SQL uniquement. La connexion d'administrateur du serveur est **sqladmin**.

    Les administrateurs de bases de données sont membres d'un groupe de sécurité Microsoft Entra nommé **SQL-DBAs**. Vous devez faire en sorte que les membres de SQL-DBAs puissent se connecter à sql-contoso-prod avec Microsoft Entra MFA, puis créer d'autres utilisateurs Microsoft Entra dans les bases de données.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Assign the SQL Server Contributor role on sql-contoso-prod to SQL-DBAs.", fr: "Attribuer le rôle SQL Server Contributor sur sql-contoso-prod à SQL-DBAs." } }
    - { id: b, text: { en: "Set SQL-DBAs as the Microsoft Entra admin of sql-contoso-prod.", fr: "Définir SQL-DBAs comme administrateur Microsoft Entra de sql-contoso-prod." } }
    - { id: c, text: { en: "Enable Microsoft Entra-only authentication on sql-contoso-prod.", fr: "Activer l'authentification Microsoft Entra uniquement sur sql-contoso-prod." } }
    - { id: d, text: { en: "Connect as sqladmin and run CREATE LOGIN [SQL-DBAs] FROM EXTERNAL PROVIDER in master.", fr: "Se connecter en tant que sqladmin et exécuter CREATE LOGIN [SQL-DBAs] FROM EXTERNAL PROVIDER dans master." } }
answer: { optionId: b }
explanation:
  correct:
    en: No Microsoft Entra identity can connect until a Microsoft Entra admin is set on the logical server. When the admin is a group, every member of the group is an administrator, is mapped to dbo in the user databases and can create the other Microsoft Entra logins and users.
    fr: Aucune identité Microsoft Entra ne peut se connecter tant qu'un administrateur Microsoft Entra n'est pas défini sur le serveur logique. Lorsque l'administrateur est un groupe, chaque membre du groupe est administrateur, est mappé sur dbo dans les bases utilisateur et peut créer les autres connexions et utilisateurs Microsoft Entra.
  options:
    a:
      en: SQL Server Contributor manages the server resource in Azure; Azure RBAC roles don't grant any access inside the databases.
      fr: SQL Server Contributor gère la ressource serveur dans Azure ; les rôles Azure RBAC n'accordent aucun accès à l'intérieur des bases de données.
    c:
      en: Microsoft Entra-only authentication blocks SQL authentication, and it requires a Microsoft Entra admin to be set first; it doesn't let the group sign in.
      fr: L'authentification Microsoft Entra uniquement bloque l'authentification SQL et exige qu'un administrateur Microsoft Entra soit défini au préalable ; elle ne permet pas au groupe de se connecter.
    d:
      en: The SQL server admin can't create Microsoft Entra logins or users; only a Microsoft Entra principal, starting with the Microsoft Entra admin, can.
      fr: L'administrateur SQL du serveur ne peut pas créer de connexions ni d'utilisateurs Microsoft Entra ; seul un principal Microsoft Entra, à commencer par l'administrateur Microsoft Entra, le peut.
references:
  - title: Microsoft Entra authentication for Azure SQL
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/authentication-aad-overview
  - title: Microsoft Entra server principals
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/authentication-azure-ad-logins
