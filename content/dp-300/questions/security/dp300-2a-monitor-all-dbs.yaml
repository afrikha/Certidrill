id: dp300-2a-monitor-all-dbs
objective: "2.1.3"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    You have an Azure SQL Database logical server named **sql-fabrikam** that hosts 40 databases. Teams create new databases on the server every week.

    A monitoring tool connects by using a SQL login named **mon_login** in master. The tool must connect to every database, including the databases created later, and read the dynamic management views. You must not create a user for mon_login in each database. The solution must follow the principle of least privilege.

    To which two fixed server roles should you add mon_login? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un serveur logique Azure SQL Database nommé **sql-fabrikam** qui héberge 40 bases de données. Les équipes créent de nouvelles bases sur le serveur chaque semaine.

    Un outil de supervision se connecte avec une connexion SQL nommée **mon_login** dans master. L'outil doit se connecter à chaque base, y compris aux bases créées ultérieurement, et lire les vues de gestion dynamique. Vous ne devez pas créer d'utilisateur pour mon_login dans chaque base. La solution doit respecter le principe des privilèges minimum.

    À quels deux rôles serveur fixes devez-vous ajouter mon_login ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: "##MS_ServerStateManager##" }
    - { id: b, text: "##MS_DatabaseConnector##" }
    - { id: c, text: "##MS_DefinitionReader##" }
    - { id: d, text: "##MS_ServerStateReader##" }
    - { id: e, text: "##MS_DatabaseManager##" }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |
      ##MS_DatabaseConnector## lets its members connect to any database without a user account in it, which also covers future databases. ##MS_ServerStateReader## lets them read the DMVs covered by VIEW SERVER STATE and VIEW DATABASE STATE. Together they meet the need without a user per database.
    fr: |
      ##MS_DatabaseConnector## permet à ses membres de se connecter à n'importe quelle base sans y avoir de compte d'utilisateur, ce qui couvre aussi les futures bases. ##MS_ServerStateReader## leur permet de lire les vues de gestion dynamique couvertes par VIEW SERVER STATE et VIEW DATABASE STATE. Ensemble, ils répondent au besoin sans utilisateur par base.
  options:
    a: { en: "##MS_ServerStateManager## adds ALTER SERVER STATE (for example DBCC FREEPROCCACHE), which a read-only tool doesn't need.", fr: "##MS_ServerStateManager## ajoute ALTER SERVER STATE (par exemple DBCC FREEPROCCACHE), dont un outil en lecture seule n'a pas besoin." }
    c: { en: "##MS_DefinitionReader## reads catalog metadata (VIEW DEFINITION), not DMVs.", fr: "##MS_DefinitionReader## lit les métadonnées du catalogue (VIEW DEFINITION), pas les vues de gestion dynamique." }
    e: { en: "##MS_DatabaseManager## creates and deletes databases; it gives no access to databases it doesn't own.", fr: "##MS_DatabaseManager## crée et supprime des bases ; il ne donne aucun accès aux bases dont il n'est pas propriétaire." }
references:
  - title: Server Roles - Azure SQL Database
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/security-server-roles
