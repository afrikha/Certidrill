id: dp300-2a-vm-mixed-mode
objective: "2.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have an Azure virtual machine named **VM1** that runs SQL Server 2022. When VM1 was deployed, SQL authentication was left disabled, so the instance uses Windows Authentication mode.

    A third-party reporting tool supports only SQL logins. You need to ensure that SQL logins can connect to the instance.

    What should you do?
  fr: |
    Vous disposez d'une machine virtuelle Azure nommée **VM1** qui exécute SQL Server 2022. Lors du déploiement de VM1, l'authentification SQL a été laissée désactivée : l'instance utilise le mode d'authentification Windows.

    Un outil de création de rapports tiers ne prend en charge que les connexions SQL. Vous devez faire en sorte que les connexions SQL puissent se connecter à l'instance.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Change the server authentication to SQL Server and Windows Authentication mode, and then restart the SQL Server service.", fr: "Passer l'authentification du serveur en mode d'authentification SQL Server et Windows, puis redémarrer le service SQL Server." } }
    - { id: b, text: { en: "Enable contained database authentication by using sp_configure, and then run RECONFIGURE.", fr: "Activer l'authentification de base de données autonome avec sp_configure, puis exécuter RECONFIGURE." } }
    - { id: c, text: { en: "Enable Microsoft Entra authentication on the Security Configuration page of the SQL virtual machine.", fr: "Activer l'authentification Microsoft Entra dans la page Security Configuration de la machine virtuelle SQL." } }
    - { id: d, text: { en: "Enable the sa login by running ALTER LOGIN sa ENABLE, and then set a strong password for it.", fr: "Activer la connexion sa avec ALTER LOGIN sa ENABLE, puis lui définir un mot de passe fort." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      SQL logins can connect only when the instance runs in SQL Server and Windows Authentication mode (mixed mode). You change the mode on the Security page of the server properties in SSMS, and the change takes effect only after the SQL Server service restarts.
    fr: |
      Les connexions SQL ne peuvent se connecter que si l'instance fonctionne en mode d'authentification SQL Server et Windows (mode mixte). Vous changez le mode dans la page Security des propriétés du serveur dans SSMS, et la modification ne prend effet qu'après le redémarrage du service SQL Server.
  options:
    b:
      en: Contained database authentication enables contained database users; it doesn't let SQL logins connect to the instance.
      fr: L'authentification de base de données autonome active les utilisateurs de base de données autonomes ; elle ne permet pas aux connexions SQL de se connecter à l'instance.
    c:
      en: Microsoft Entra authentication adds Microsoft Entra logins; the tool needs SQL logins.
      fr: L'authentification Microsoft Entra ajoute des connexions Microsoft Entra ; l'outil a besoin de connexions SQL.
    d:
      en: In Windows Authentication mode, no SQL login can connect, sa included; enabling sa is also a security risk.
      fr: En mode d'authentification Windows, aucune connexion SQL ne peut se connecter, sa compris ; activer sa constitue en outre un risque de sécurité.
references:
  - title: Change server authentication mode
    url: https://learn.microsoft.com/en-us/sql/database-engine/configure-windows/change-server-authentication-mode
