id: dp300-2b-tde-cmk-statements
objective: "2.2.1"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    You have an Azure SQL Database logical server named **sql-adatum** that hosts a database named **DB1**. The TDE protector of sql-adatum is a customer-managed key stored in Azure Key Vault.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un serveur logique Azure SQL Database nommé **sql-adatum** qui héberge une base de données nommée **DB1**. Le protecteur TDE de sql-adatum est une clé gérée par le client stockée dans Azure Key Vault.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: When you export DB1 to a BACPAC file, the content of the BACPAC file is encrypted by the TDE protector.
        fr: Lorsque vous exportez DB1 dans un fichier BACPAC, le contenu du fichier BACPAC est chiffré par le protecteur TDE.
    - id: s2
      text:
        en: A copy of DB1 created on sql-adatum by using a database copy is encrypted by TDE.
        fr: Une copie de DB1 créée sur sql-adatum à l'aide d'une copie de base de données est chiffrée par TDE.
    - id: s3
      text:
        en: After you switch the TDE protector to a new key, you must keep the previous key to restore older backups of DB1.
        fr: Après avoir basculé le protecteur TDE vers une nouvelle clé, vous devez conserver la clé précédente pour restaurer les anciennes sauvegardes de DB1.
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: "A BACPAC exported from a TDE-protected database is not encrypted. A database copy inherits the TDE settings of its source, so the copy is encrypted. When the TDE protector changes, existing backups are not updated to the new protector, so every key that was used must stay in the key vault to restore them."
    fr: "Un fichier BACPAC exporté depuis une base protégée par TDE n'est pas chiffré. Une copie de base de données hérite des paramètres TDE de sa source : la copie est chiffrée. Lorsque le protecteur TDE change, les sauvegardes existantes ne sont pas mises à jour avec le nouveau protecteur : toutes les clés utilisées doivent rester dans le coffre de clés pour pouvoir les restaurer."
references:
  - title: Transparent data encryption for SQL Database and SQL Managed Instance
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/transparent-data-encryption-tde-overview
  - title: Azure SQL transparent data encryption with customer-managed key
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/transparent-data-encryption-byok-overview
