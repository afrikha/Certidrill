id: dp300-2c-audit-storage-firewall
objective: "2.3.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have an Azure SQL logical server named sql-proseware. You plan to enable server-level auditing to an existing storage account named stproseaudit.

    stproseaudit is a legacy Blob Storage account (account kind BlobStorage). Its firewall allows access from selected virtual networks only, and the security team requires that the firewall configuration remain unchanged.

    You need to ensure that sql-proseware can write audit logs to stproseaudit.

    What should you do first?
  fr: |
    Vous disposez d'un serveur logique Azure SQL nommé sql-proseware. Vous prévoyez d'activer l'audit au niveau du serveur vers un compte de stockage existant nommé stproseaudit.

    stproseaudit est un ancien compte Stockage Blob (type de compte BlobStorage). Son pare-feu n'autorise l'accès qu'à partir de réseaux virtuels sélectionnés, et l'équipe de sécurité exige que la configuration du pare-feu reste inchangée.

    Vous devez vous assurer que sql-proseware peut écrire les journaux d'audit dans stproseaudit.

    Que devez-vous faire en premier ?
body:
  options:
    - { id: a, text: { en: "Enable hierarchical namespace on stproseaudit.", fr: "Activer l'espace de noms hiérarchique sur stproseaudit." } }
    - { id: b, text: { en: "Configure a time-based immutability policy on the audit container.", fr: "Configurer une stratégie d'immuabilité basée sur le temps sur le conteneur d'audit." } }
    - { id: c, text: { en: "Change the redundancy of stproseaudit to geo-redundant storage (GRS).", fr: "Changer la redondance de stproseaudit en stockage géoredondant (GRS)." } }
    - { id: d, text: { en: "Upgrade stproseaudit to a general-purpose v2 account.", fr: "Mettre à niveau stproseaudit vers un compte v2 universel." } }
answer:
  optionId: d
explanation:
  correct:
    en: |
      Writing audit logs to a storage account that is behind a virtual network or firewall requires a general-purpose v2 account; general-purpose v1 and Blob Storage accounts must be upgraded first. After the upgrade, you configure auditing with the server's managed identity so that it can write through the firewall.
    fr: |
      L'écriture des journaux d'audit dans un compte de stockage situé derrière un réseau virtuel ou un pare-feu exige un compte v2 universel ; les comptes v1 universels et Stockage Blob doivent d'abord être mis à niveau. Après la mise à niveau, vous configurez l'audit avec l'identité managée du serveur pour qu'il puisse écrire à travers le pare-feu.
  options:
    a: { en: "Hierarchical namespace is supported for audit logs but is not required, and it does not lift the account-kind restriction.", fr: "L'espace de noms hiérarchique est pris en charge pour les journaux d'audit, mais il n'est pas obligatoire et ne lève pas la restriction sur le type de compte." }
    b: { en: "An immutability policy protects the logs against deletion; it does not allow writes through the firewall.", fr: "Une stratégie d'immuabilité protège les journaux contre la suppression ; elle ne permet pas d'écrire à travers le pare-feu." }
    c: { en: "Redundancy does not affect whether auditing can write to an account behind a firewall.", fr: "La redondance n'a pas d'effet sur la capacité de l'audit à écrire dans un compte situé derrière un pare-feu." }
references:
  - title: Auditing for Azure SQL Database
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/auditing-overview
