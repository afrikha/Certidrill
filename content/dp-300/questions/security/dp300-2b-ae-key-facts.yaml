id: dp300-2b-ae-key-facts
objective: "2.2.4"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    You have an Azure SQL database named **Claims**. You plan to encrypt several existing columns by using Always Encrypted without secure enclaves. The column master key will be stored in Azure Key Vault.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'une base de données Azure SQL nommée **Claims**. Vous prévoyez de chiffrer plusieurs colonnes existantes à l'aide d'Always Encrypted sans enclaves sécurisées. La clé principale de colonne sera stockée dans Azure Key Vault.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: Claims stores the column master key itself, protected by the database master key.
        fr: Claims stocke la clé principale de colonne elle-même, protégée par la clé principale de base de données.
    - id: s2
      text:
        en: Claims stores the encrypted value of each column encryption key in its metadata.
        fr: Claims stocke la valeur chiffrée de chaque clé de chiffrement de colonne dans ses métadonnées.
    - id: s3
      text:
        en: You can encrypt the existing data of a column by running an ALTER TABLE statement in Claims.
        fr: Vous pouvez chiffrer les données existantes d'une colonne en exécutant une instruction ALTER TABLE dans Claims.
answer:
  values: { s1: false, s2: true, s3: false }
explanation:
  correct:
    en: "The column master key stays in a trusted key store outside the database, here Azure Key Vault; the database stores only its metadata, including its location. The metadata of a column encryption key contains its encrypted value. T-SQL does not support key provisioning or cryptographic operations, so without an enclave existing data is encrypted outside the database, for example with the SSMS Always Encrypted wizard or PowerShell."
    fr: "La clé principale de colonne reste dans un magasin de clés approuvé en dehors de la base, ici Azure Key Vault ; la base ne stocke que ses métadonnées, dont son emplacement. Les métadonnées d'une clé de chiffrement de colonne contiennent sa valeur chiffrée. T-SQL ne prend pas en charge le provisionnement des clés ni les opérations de chiffrement : sans enclave, les données existantes sont chiffrées en dehors de la base, par exemple avec l'Assistant Always Encrypted de SSMS ou PowerShell."
references:
  - title: Always Encrypted
    url: https://learn.microsoft.com/en-us/sql/relational-databases/security/encryption/always-encrypted-database-engine
