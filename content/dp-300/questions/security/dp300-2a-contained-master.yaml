id: dp300-2a-contained-master
objective: "2.1.7"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have an Azure SQL database named **DB1**. You created a contained database user in DB1 by running CREATE USER report_user WITH PASSWORD = '...'.

    A report author opens SQL Server Management Studio, enters the server name, selects SQL Server Authentication, and enters report_user and the correct password. All other connection options keep their default values. The connection fails with error 18456. The client IP address is allowed by the firewall.

    What should you do?
  fr: |
    Vous disposez d'une base de données Azure SQL nommée **DB1**. Vous avez créé un utilisateur de base de données autonome dans DB1 en exécutant CREATE USER report_user WITH PASSWORD = '...'.

    Un auteur de rapports ouvre SQL Server Management Studio, saisit le nom du serveur, sélectionne SQL Server Authentication et entre report_user avec le mot de passe correct. Toutes les autres options de connexion conservent leurs valeurs par défaut. La connexion échoue avec l'erreur 18456. L'adresse IP du client est autorisée par le pare-feu.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Specify DB1 as the database in the connection options.", fr: "Spécifier DB1 comme base de données dans les options de connexion." } }
    - { id: b, text: { en: "Create a login named report_user in the master database.", fr: "Créer une connexion nommée report_user dans la base master." } }
    - { id: c, text: { en: "Run ALTER LOGIN report_user ENABLE in the master database.", fr: "Exécuter ALTER LOGIN report_user ENABLE dans la base master." } }
    - { id: d, text: { en: "Add a database-level firewall rule for the client in DB1.", fr: "Ajouter une règle de pare-feu au niveau de la base pour le client dans DB1." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      A contained database user exists only in its own database and authenticates there. Without a database in the connection options, SSMS connects to master, where report_user doesn't exist, so the login fails with 18456. Setting DB1 as the target database fixes it.
    fr: |
      Un utilisateur de base de données autonome n'existe que dans sa propre base et s'y authentifie. Sans base dans les options de connexion, SSMS se connecte à master, où report_user n'existe pas : la connexion échoue avec l'erreur 18456. Définir DB1 comme base cible résout le problème.
  options:
    b:
      en: A separate login with the same name isn't linked to the contained user and can cause undefined behavior.
      fr: Une connexion distincte portant le même nom n'est pas liée à l'utilisateur autonome et peut provoquer un comportement indéfini.
    c:
      en: report_user is a database user, not a login, so there is no login to enable.
      fr: "report_user est un utilisateur de base de données, pas une connexion : il n'y a aucune connexion à activer."
    d:
      en: The firewall already allows the client; a firewall block returns error 40615.
      fr: Le pare-feu autorise déjà le client ; un blocage par le pare-feu renvoie l'erreur 40615.
references:
  - title: Contained User Access to Contained Databases
    url: https://learn.microsoft.com/en-us/sql/relational-databases/security/contained-database-users-making-your-database-portable
