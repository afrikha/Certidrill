id: dp300-2a-schema-select
objective: "2.1.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have an Azure SQL database named **DB1** that contains the schemas **Sales**, **HR** and **Finance**. A reporting user named **rpt_user** must read every table in the Sales schema, including tables that will be added later. rpt_user must not read the other schemas.

    The solution must follow the principle of least privilege and minimize administrative effort.

    Which statement should you run?
  fr: |
    Vous disposez d'une base de données Azure SQL nommée **DB1** qui contient les schémas **Sales**, **HR** et **Finance**. Un utilisateur de création de rapports nommé **rpt_user** doit lire toutes les tables du schéma Sales, y compris les tables qui seront ajoutées ultérieurement. rpt_user ne doit pas lire les autres schémas.

    La solution doit respecter le principe des privilèges minimum et réduire au minimum l'effort d'administration.

    Quelle instruction devez-vous exécuter ?
body:
  options:
    - { id: a, text: "ALTER ROLE db_datareader ADD MEMBER rpt_user;" }
    - { id: b, text: "GRANT CONTROL ON SCHEMA::Sales TO rpt_user;" }
    - { id: c, text: "GRANT SELECT ON SCHEMA::Sales TO rpt_user;" }
    - { id: d, text: "GRANT SELECT ON DATABASE::DB1 TO rpt_user;" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      A permission granted on a schema applies to every object it contains, including objects created later. SELECT on SCHEMA::Sales gives read access to the Sales tables only, with a single statement to maintain.
    fr: |
      Une autorisation accordée sur un schéma s'applique à tous les objets qu'il contient, y compris ceux créés ultérieurement. SELECT sur SCHEMA::Sales donne l'accès en lecture aux seules tables de Sales, avec une seule instruction à maintenir.
  options:
    a:
      en: db_datareader reads every table of every schema, HR and Finance included.
      fr: db_datareader lit toutes les tables de tous les schémas, HR et Finance compris.
    b:
      en: CONTROL grants every permission on the schema, including changing and dropping its objects.
      fr: CONTROL accorde toutes les autorisations sur le schéma, y compris la modification et la suppression de ses objets.
    d:
      en: SELECT at database scope covers all schemas.
      fr: SELECT au niveau de la base couvre tous les schémas.
references:
  - title: Authorize database access to Azure SQL Database
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/logins-create-manage
