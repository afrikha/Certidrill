id: dp300-2c-ddm-behavior
objective: "2.3.4"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    You have an Azure SQL database that contains a table named HR.Employee. The Salary column of HR.Employee has a dynamic data masking rule that uses the default() function.

    A database user named User1 has the SELECT, INSERT, and UPDATE permissions on HR.Employee. User1 has no other permissions and isn't a member of any database role other than public.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'une base de données Azure SQL qui contient une table nommée HR.Employee. La colonne Salary de HR.Employee possède une règle de masquage dynamique des données qui utilise la fonction default().

    Un utilisateur de base de données nommé User1 dispose des autorisations SELECT, INSERT et UPDATE sur HR.Employee. User1 n'a aucune autre autorisation et n'est membre d'aucun rôle de base de données autre que public.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: If User1 runs SELECT * INTO #EmpCopy FROM HR.Employee, the Salary column of #EmpCopy contains masked values.
        fr: Si User1 exécute SELECT * INTO #EmpCopy FROM HR.Employee, la colonne Salary de #EmpCopy contient des valeurs masquées.
    - id: s2
      text:
        en: User1 can run an UPDATE statement that changes the Salary value of an employee.
        fr: User1 peut exécuter une instruction UPDATE qui modifie la valeur Salary d'un employé.
    - id: s3
      text:
        en: If User1 runs SELECT AVG(Salary) FROM HR.Employee, the query returns the real average salary.
        fr: Si User1 exécute SELECT AVG(Salary) FROM HR.Employee, la requête renvoie le vrai salaire moyen.
answer:
  values: { s1: true, s2: true, s3: false }
explanation:
  correct:
    en: |
      When a user without UNMASK copies data from a masked column with SELECT INTO or INSERT INTO, the target receives masked values. Masking doesn't prevent updates: a user with UPDATE permission can still change a masked column, so write access must be limited by permissions. Any expression that references a masked column is masked with the default function, so the aggregate returns 0 to User1.
    fr: |
      Lorsqu'un utilisateur sans UNMASK copie des données d'une colonne masquée avec SELECT INTO ou INSERT INTO, la cible reçoit des valeurs masquées. Le masquage n'empêche pas les mises à jour : un utilisateur disposant de UPDATE peut toujours modifier une colonne masquée, et l'accès en écriture doit donc être limité par les autorisations. Toute expression qui fait référence à une colonne masquée est masquée avec la fonction par défaut : l'agrégat renvoie 0 à User1.
references:
  - title: Dynamic Data Masking
    url: https://learn.microsoft.com/en-us/sql/relational-databases/security/dynamic-data-masking
