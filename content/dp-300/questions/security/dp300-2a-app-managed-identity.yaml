id: dp300-2a-app-managed-identity
objective: "2.1.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have an Azure App Service web app named **app-billing** that has a system-assigned managed identity. The app must connect to an Azure SQL database named **DB1** without storing any credential. No login exists for the app in master.

    You connect to DB1 as the Microsoft Entra admin. You will grant the permissions in a later step.

    Which statement should you run in DB1?
  fr: |
    Vous disposez d'une application web Azure App Service nommée **app-billing** qui possède une identité managée affectée par le système. L'application doit se connecter à une base de données Azure SQL nommée **DB1** sans stocker aucun identifiant. Aucune connexion n'existe pour l'application dans master.

    Vous vous connectez à DB1 en tant qu'administrateur Microsoft Entra. Vous accorderez les autorisations dans une étape ultérieure.

    Quelle instruction devez-vous exécuter dans DB1 ?
body:
  options:
    - { id: a, text: "CREATE USER [app-billing] WITH PASSWORD = 'Bill!ng#2026pass';" }
    - { id: b, text: "CREATE USER [app-billing] FROM LOGIN [app-billing];" }
    - { id: c, text: "CREATE USER [app-billing] FROM EXTERNAL PROVIDER;" }
    - { id: d, text: "CREATE USER [app-billing] WITHOUT LOGIN;" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      A managed identity is a Microsoft Entra service principal. CREATE USER ... FROM EXTERNAL PROVIDER, with the display name of the app (the name of a system-assigned identity), creates a contained user for it. The app then gets a token from its managed identity, so no secret is stored.
    fr: |
      Une identité managée est un principal de service Microsoft Entra. CREATE USER ... FROM EXTERNAL PROVIDER, avec le nom d'affichage de l'application (le nom d'une identité affectée par le système), crée pour elle un utilisateur autonome. L'application obtient ensuite un jeton auprès de son identité managée : aucun secret n'est stocké.
  options:
    a:
      en: A contained SQL user has a password that the app would have to store.
      fr: Un utilisateur SQL autonome a un mot de passe que l'application devrait stocker.
    b:
      en: FROM LOGIN requires an existing login in master, and none exists.
      fr: FROM LOGIN exige une connexion existante dans master, et il n'y en a aucune.
    d:
      en: A user without login can't authenticate, so the app couldn't connect.
      fr: "Un utilisateur sans connexion ne peut pas s'authentifier : l'application ne pourrait pas se connecter."
references:
  - title: Configure Microsoft Entra Authentication - Azure SQL Database & SQL Managed Instance
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/authentication-aad-configure
