id: dp300-2c-ct-feature
objective: "2.3.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have an Azure SQL database named DB1 that contains a table named dbo.Product. A mobile app keeps a local copy of dbo.Product and synchronizes it every few hours.

    At each synchronization, the app must identify the rows that were inserted, updated, or deleted since its previous synchronization, and then read the current values of those rows from dbo.Product. The app does not need the intermediate values of the rows. The solution must minimize storage overhead.

    What should you enable?
  fr: |
    Vous disposez d'une base de données Azure SQL nommée DB1 qui contient une table nommée dbo.Product. Une application mobile conserve une copie locale de dbo.Product et la synchronise toutes les quelques heures.

    À chaque synchronisation, l'application doit identifier les lignes insérées, mises à jour ou supprimées depuis la synchronisation précédente, puis lire les valeurs actuelles de ces lignes dans dbo.Product. L'application n'a pas besoin des valeurs intermédiaires des lignes. La solution doit réduire au minimum la surcharge de stockage.

    Que devez-vous activer ?
body:
  options:
    - { id: a, text: { en: "Change data capture", fr: "La capture des changements de données" } }
    - { id: b, text: { en: "Change tracking", fr: "Le suivi des modifications" } }
    - { id: c, text: { en: "System versioning (temporal table)", fr: "La gestion système des versions (table temporelle)" } }
    - { id: d, text: { en: "Database-level auditing", fr: "L'audit au niveau de la base de données" } }
answer:
  optionId: b
explanation:
  correct:
    en: |
      Change tracking records which rows changed (their primary key values and the type of operation), synchronously with each transaction, and the app reads the current data by joining the keys to the table. Because it doesn't store the changed values, it needs far less storage than change data capture, which suits one-way and two-way synchronization.
    fr: |
      Le suivi des modifications enregistre les lignes qui ont changé (leurs valeurs de clé primaire et le type d'opération), de manière synchrone avec chaque transaction, et l'application lit les données actuelles en joignant les clés à la table. Comme il ne stocke pas les valeurs modifiées, il demande beaucoup moins de stockage que la capture des changements de données, ce qui convient à la synchronisation unidirectionnelle et bidirectionnelle.
  options:
    a: { en: "Change data capture stores the column values of every change, which the app doesn't need and which uses more storage.", fr: "La capture des changements de données stocke les valeurs des colonnes de chaque changement, ce dont l'application n'a pas besoin et qui consomme plus de stockage." }
    c: { en: "A temporal table keeps every previous row version in a history table, which adds storage the app doesn't need.", fr: "Une table temporelle conserve chaque version précédente des lignes dans une table d'historique, ce qui ajoute un stockage inutile pour l'application." }
    d: { en: "Auditing logs statements and logins for security review; it doesn't give an app a queryable list of changed rows.", fr: "L'audit journalise les instructions et les connexions pour la revue de sécurité ; il ne fournit pas à une application une liste interrogeable des lignes modifiées." }
references:
  - title: About Change Tracking (SQL Server)
    url: https://learn.microsoft.com/en-us/sql/relational-databases/track-changes/about-change-tracking-sql-server
  - title: Track data changes (SQL Server)
    url: https://learn.microsoft.com/en-us/sql/relational-databases/track-changes/track-data-changes-sql-server
