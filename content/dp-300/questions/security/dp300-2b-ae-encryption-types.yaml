id: dp300-2b-ae-encryption-types
objective: "2.2.4"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    You have an Azure SQL database named **Staff** that contains a table named Employee. You plan to protect the table by using Always Encrypted. Secure enclaves are not available. The columns and their requirements are shown in the answer area.

    How should you configure each column? To answer, drag the appropriate configurations to the correct columns. Each configuration may be used once, more than once, or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'une base de données Azure SQL nommée **Staff** qui contient une table nommée Employee. Vous prévoyez de protéger la table à l'aide d'Always Encrypted. Les enclaves sécurisées ne sont pas disponibles. Les colonnes et leurs exigences figurent dans la zone de réponse.

    Comment devez-vous configurer chaque colonne ? Pour répondre, faites glisser les configurations appropriées vers les colonnes correspondantes. Chaque configuration peut être utilisée une fois, plusieurs fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: true
  items:
    - { id: det, text: { en: "Deterministic encryption", fr: "Chiffrement déterministe" } }
    - { id: rand, text: { en: "Randomized encryption", fr: "Chiffrement aléatoire" } }
    - { id: none, text: { en: "Leave the column unencrypted", fr: "Laisser la colonne non chiffrée" } }
    - { id: ddm, text: { en: "Dynamic data masking only", fr: "Masquage dynamique des données uniquement" } }
  targets:
    - id: t1
      text: { en: "BadgeNumber: sensitive, used in point lookups and equality joins", fr: "BadgeNumber : sensible, utilisée dans des recherches ponctuelles et des jointures d'égalité" }
    - id: t2
      text: { en: "Salary: sensitive, only displayed, never filtered or grouped", fr: "Salary : sensible, seulement affichée, jamais filtrée ni regroupée" }
    - id: t3
      text: { en: "HealthPlan: sensitive, three possible values, only displayed; the ciphertext must not reveal which rows share a value", fr: "HealthPlan : sensible, trois valeurs possibles, seulement affichée ; le texte chiffré ne doit pas révéler quelles lignes partagent une valeur" }
    - id: t4
      text: { en: "EmployeeID: IDENTITY primary key, not sensitive", fr: "EmployeeID : clé primaire IDENTITY, non sensible" }
answer:
  mapping: { t1: det, t2: rand, t3: rand, t4: none }
explanation:
  correct:
    en: "Deterministic encryption produces the same ciphertext for the same value, so it supports point lookups, equality joins, grouping and indexing. Randomized encryption is more secure and is the right choice when the column is never searched; it also prevents pattern inference on columns with few possible values, which deterministic encryption allows. Always Encrypted does not support IDENTITY columns, and a non-sensitive key column has no reason to be encrypted."
    fr: "Le chiffrement déterministe produit le même texte chiffré pour une même valeur : il prend en charge les recherches ponctuelles, les jointures d'égalité, le regroupement et l'indexation. Le chiffrement aléatoire est plus sûr et convient lorsque la colonne n'est jamais recherchée ; il empêche aussi de déduire des modèles sur les colonnes qui ont peu de valeurs possibles, ce que permet le chiffrement déterministe. Always Encrypted ne prend pas en charge les colonnes IDENTITY, et une colonne clé non sensible n'a aucune raison d'être chiffrée."
  options:
    ddm: { en: "Dynamic data masking only hides values in query results; it does not encrypt sensitive columns and is not an Always Encrypted configuration.", fr: "Le masquage dynamique des données masque seulement les valeurs dans les résultats des requêtes ; il ne chiffre pas les colonnes sensibles et n'est pas une configuration d'Always Encrypted." }
references:
  - title: Always Encrypted
    url: https://learn.microsoft.com/en-us/sql/relational-databases/security/encryption/always-encrypted-database-engine
