id: dp300-2c-rls-feature
objective: "2.3.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have an Azure SQL database named DB1 that contains a table named Sales.Orders. Each row has a Region column. Sales representatives connect to DB1 with their own database users and run existing reports against Sales.Orders.

    You need to ensure that each sales representative can read only the orders of their own region. The reports must not be modified.

    What should you implement?
  fr: |
    Vous disposez d'une base de données Azure SQL nommée DB1 qui contient une table nommée Sales.Orders. Chaque ligne possède une colonne Region. Les commerciaux se connectent à DB1 avec leurs propres utilisateurs de base de données et exécutent des rapports existants sur Sales.Orders.

    Vous devez vous assurer que chaque commercial ne peut lire que les commandes de sa propre région. Les rapports ne doivent pas être modifiés.

    Que devez-vous implémenter ?
body:
  options:
    - { id: a, text: { en: "Row-level security", fr: "La sécurité au niveau des lignes" } }
    - { id: b, text: { en: "Dynamic data masking", fr: "Le masquage dynamique des données" } }
    - { id: c, text: { en: "Column-level permissions", fr: "Des autorisations au niveau des colonnes" } }
    - { id: d, text: { en: "Data Discovery & Classification", fr: "La découverte et classification des données" } }
answer:
  optionId: a
explanation:
  correct:
    en: |
      Row-level security applies a predicate function to the table through a security policy, so every query against Sales.Orders returns only the rows that the predicate allows for the current user. The restriction is enforced in the database, so the existing reports work unchanged.
    fr: |
      La sécurité au niveau des lignes applique une fonction de prédicat à la table au moyen d'une stratégie de sécurité : chaque requête sur Sales.Orders ne renvoie que les lignes que le prédicat autorise pour l'utilisateur actuel. La restriction est appliquée dans la base de données, et les rapports existants fonctionnent donc sans modification.
  options:
    b: { en: "Masking hides column values but still returns every row.", fr: "Le masquage masque des valeurs de colonnes mais renvoie toujours toutes les lignes." }
    c: { en: "Column permissions control which columns a user can read, not which rows.", fr: "Les autorisations de colonnes contrôlent les colonnes qu'un utilisateur peut lire, pas les lignes." }
    d: { en: "Classification labels sensitive columns; it doesn't restrict access.", fr: "La classification étiquette les colonnes sensibles ; elle ne restreint pas l'accès." }
references:
  - title: Row-level security
    url: https://learn.microsoft.com/en-us/sql/relational-databases/security/row-level-security
