id: dp300-2b-cle-key-hierarchy-order
objective: "2.2.2"
type: ordering
difficulty: 1
status: draft
stem:
  en: |
    You have an Azure SQL managed instance that hosts a database named **Clinic**. Clinic does not contain a database master key. The Patient table already contains an empty column named SsnEnc of type varbinary(128).

    You need to encrypt the values of the Ssn column into SsnEnc by using column-level encryption with a symmetric key protected by a certificate.

    Which five actions should you perform in sequence in Clinic? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Vous disposez d'une instance managée Azure SQL qui héberge une base de données nommée **Clinic**. Clinic ne contient pas de clé principale de base de données. La table Patient contient déjà une colonne vide nommée SsnEnc de type varbinary(128).

    Vous devez chiffrer les valeurs de la colonne Ssn dans SsnEnc à l'aide du chiffrement au niveau des colonnes avec une clé symétrique protégée par un certificat.

    Quelles sont les cinq actions à effectuer dans l'ordre dans Clinic ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 5
  actions:
    - { id: dmk, text: { en: "Run CREATE MASTER KEY ENCRYPTION BY PASSWORD.", fr: "Exécuter CREATE MASTER KEY ENCRYPTION BY PASSWORD." } }
    - { id: cert, text: { en: "Run CREATE CERTIFICATE ... WITH SUBJECT.", fr: "Exécuter CREATE CERTIFICATE ... WITH SUBJECT." } }
    - { id: symkey, text: { en: "Run CREATE SYMMETRIC KEY ... ENCRYPTION BY CERTIFICATE.", fr: "Exécuter CREATE SYMMETRIC KEY ... ENCRYPTION BY CERTIFICATE." } }
    - { id: open, text: { en: "Run OPEN SYMMETRIC KEY ... DECRYPTION BY CERTIFICATE.", fr: "Exécuter OPEN SYMMETRIC KEY ... DECRYPTION BY CERTIFICATE." } }
    - { id: update, text: { en: "Run UPDATE ... SET SsnEnc = ENCRYPTBYKEY(KEY_GUID(...), Ssn).", fr: "Exécuter UPDATE ... SET SsnEnc = ENCRYPTBYKEY(KEY_GUID(...), Ssn)." } }
    - { id: dek, text: { en: "Run CREATE DATABASE ENCRYPTION KEY ... ENCRYPTION BY SERVER CERTIFICATE.", fr: "Exécuter CREATE DATABASE ENCRYPTION KEY ... ENCRYPTION BY SERVER CERTIFICATE." } }
    - { id: cmk, text: { en: "Run CREATE COLUMN MASTER KEY ... WITH (KEY_STORE_PROVIDER_NAME = ...).", fr: "Exécuter CREATE COLUMN MASTER KEY ... WITH (KEY_STORE_PROVIDER_NAME = ...)." } }
answer:
  sequence: [ dmk, cert, symkey, open, update ]
explanation:
  correct:
    en: "Column-level encryption uses the hierarchy database master key > certificate > symmetric key, so each level is created before the one it protects. The symmetric key must then be opened in the session before ENCRYPTBYKEY can use it; otherwise ENCRYPTBYKEY returns NULL."
    fr: "Le chiffrement au niveau des colonnes utilise la hiérarchie clé principale de base de données > certificat > clé symétrique : chaque niveau est créé avant celui qu'il protège. La clé symétrique doit ensuite être ouverte dans la session avant qu'ENCRYPTBYKEY puisse l'utiliser ; sinon, ENCRYPTBYKEY renvoie NULL."
  options:
    dek: { en: "A database encryption key is used by TDE to encrypt the whole database, not individual column values.", fr: "Une clé de chiffrement de base de données est utilisée par TDE pour chiffrer toute la base, pas des valeurs de colonne." }
    cmk: { en: "A column master key is Always Encrypted metadata; it is not part of the column-level encryption hierarchy.", fr: "Une clé principale de colonne est une métadonnée d'Always Encrypted ; elle ne fait pas partie de la hiérarchie du chiffrement au niveau des colonnes." }
references:
  - title: Encrypt a column of data
    url: https://learn.microsoft.com/en-us/sql/relational-databases/security/encryption/encrypt-a-column-of-data
