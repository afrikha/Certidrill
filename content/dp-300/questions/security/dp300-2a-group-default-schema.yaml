id: dp300-2a-group-default-schema
objective: "2.1.4"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    You have an Azure SQL database named **DB1**. No login exists in master for the Microsoft Entra group **Report Writers**.

    Members of Report Writers must connect to DB1 with their Microsoft Entra accounts and create views and stored procedures. Their scripts use unqualified names (for example, CREATE VIEW vSalesByRegion), and the objects must be created in the dbo schema. The solution must follow the principle of least privilege.

    You connect to DB1 as the Microsoft Entra admin. How should you complete the Transact-SQL script? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'une base de données Azure SQL nommée **DB1**. Aucune connexion n'existe dans master pour le groupe Microsoft Entra **Report Writers**.

    Les membres de Report Writers doivent se connecter à DB1 avec leurs comptes Microsoft Entra et créer des vues et des procédures stockées. Leurs scripts utilisent des noms non qualifiés (par exemple CREATE VIEW vSalesByRegion), et les objets doivent être créés dans le schéma dbo. La solution doit respecter le principe des privilèges minimum.

    Vous vous connectez à DB1 en tant qu'administrateur Microsoft Entra. Comment devez-vous compléter le script Transact-SQL ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: sql
  template: |
    CREATE USER [Report Writers] [[src]]
        WITH DEFAULT_SCHEMA = [[sch]];

    ALTER ROLE [[role]] ADD MEMBER [Report Writers];
  slots:
    - id: src
      options:
        - { id: login, text: "FROM LOGIN [Report Writers]" }
        - { id: ext, text: FROM EXTERNAL PROVIDER }
        - { id: nologin, text: WITHOUT LOGIN }
    - id: sch
      options:
        - { id: guest, text: guest }
        - { id: sys, text: sys }
        - { id: dbo, text: dbo }
    - id: role
      options:
        - { id: owner, text: db_owner }
        - { id: ddl, text: db_ddladmin }
        - { id: writer, text: db_datawriter }
        - { id: secadmin, text: db_securityadmin }
answer:
  values: { src: ext, sch: dbo, role: ddl }
explanation:
  correct:
    en: |
      FROM EXTERNAL PROVIDER creates a contained user for the Microsoft Entra group. Members of a group have no implicit user and therefore no default schema, so unqualified CREATE statements fail unless the group user gets DEFAULT_SCHEMA = dbo. db_ddladmin lets members run DDL such as CREATE VIEW and CREATE PROCEDURE without the full control of db_owner.
    fr: |
      FROM EXTERNAL PROVIDER crée un utilisateur autonome pour le groupe Microsoft Entra. Les membres d'un groupe n'ont pas d'utilisateur implicite et donc pas de schéma par défaut : les instructions CREATE non qualifiées échouent si l'utilisateur du groupe ne reçoit pas DEFAULT_SCHEMA = dbo. db_ddladmin permet aux membres d'exécuter du DDL comme CREATE VIEW et CREATE PROCEDURE sans le contrôle total de db_owner.
  options:
    login: { en: "No login exists in master for the group.", fr: "Aucune connexion n'existe dans master pour le groupe." }
    nologin: { en: "A user without login can't be used to connect.", fr: "Un utilisateur sans connexion ne permet pas de se connecter." }
    guest: { en: "Objects must be created in dbo, not in guest.", fr: "Les objets doivent être créés dans dbo, pas dans guest." }
    owner: { en: "db_owner grants every permission in the database, far beyond the need.", fr: "db_owner accorde toutes les autorisations de la base, bien au-delà du besoin." }
    writer: { en: "db_datawriter changes data; it can't create views or procedures.", fr: "db_datawriter modifie des données ; il ne peut pas créer de vues ni de procédures." }
references:
  - title: Microsoft Entra authentication for Azure SQL
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/authentication-aad-overview
