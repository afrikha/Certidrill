id: dp300-2a-proc-only-access
objective: "2.1.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have an Azure SQL database named **DB1**. The tables are in the **Sales** schema, and the stored procedures that the application calls are in the **Api** schema. Both schemas are owned by dbo, and the procedures use static Transact-SQL only.

    The application connects as a user named **app_user**. app_user must insert and update data only by running the procedures, and must not be able to query or modify the Sales tables directly. The solution must follow the principle of least privilege.

    What should you do?
  fr: |
    Vous disposez d'une base de données Azure SQL nommée **DB1**. Les tables se trouvent dans le schéma **Sales**, et les procédures stockées appelées par l'application dans le schéma **Api**. Les deux schémas appartiennent à dbo, et les procédures n'utilisent que du Transact-SQL statique.

    L'application se connecte en tant qu'utilisateur nommé **app_user**. app_user doit insérer et mettre à jour des données uniquement en exécutant les procédures, et ne doit pas pouvoir interroger ni modifier directement les tables de Sales. La solution doit respecter le principe des privilèges minimum.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Add app_user to db_datareader and db_datawriter, and grant EXECUTE on SCHEMA::Api.", fr: "Ajouter app_user à db_datareader et db_datawriter, et accorder EXECUTE sur SCHEMA::Api." } }
    - { id: b, text: { en: "Grant EXECUTE on SCHEMA::Api to app_user, and grant no permission on the Sales tables.", fr: "Accorder EXECUTE sur SCHEMA::Api à app_user, sans aucune autorisation sur les tables de Sales." } }
    - { id: c, text: { en: "Grant EXECUTE on SCHEMA::Api and INSERT, UPDATE on SCHEMA::Sales to app_user.", fr: "Accorder EXECUTE sur SCHEMA::Api et INSERT, UPDATE sur SCHEMA::Sales à app_user." } }
    - { id: d, text: { en: "Add app_user to db_owner, and deny SELECT on SCHEMA::Sales.", fr: "Ajouter app_user à db_owner, et refuser SELECT sur SCHEMA::Sales." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      When a procedure and the tables it references have the same owner, SQL checks only the EXECUTE permission on the procedure and skips the permission checks on the tables (ownership chaining). app_user can therefore change data through the procedures while every direct access to the tables is refused.
    fr: |
      Lorsqu'une procédure et les tables qu'elle référence ont le même propriétaire, SQL vérifie seulement l'autorisation EXECUTE sur la procédure et ignore les vérifications d'autorisations sur les tables (chaînage des propriétés). app_user peut donc modifier les données par les procédures, tandis que tout accès direct aux tables est refusé.
  options:
    a:
      en: The fixed roles let app_user read and change every table directly.
      fr: Les rôles fixes permettent à app_user de lire et de modifier directement toutes les tables.
    c:
      en: INSERT and UPDATE on the schema let app_user change the tables without the procedures, and ownership chaining makes them unnecessary.
      fr: INSERT et UPDATE sur le schéma permettent à app_user de modifier les tables sans passer par les procédures, et le chaînage des propriétés les rend inutiles.
    d:
      en: db_owner lets app_user alter the tables and manage permissions, so it could remove the DENY; it is the opposite of least privilege.
      fr: db_owner permet à app_user de modifier les tables et de gérer les autorisations, donc de retirer le DENY ; c'est l'opposé du privilège minimum.
references:
  - title: Managing Permissions with Stored Procedures in SQL Server
    url: https://learn.microsoft.com/en-us/dotnet/framework/data/adonet/sql/managing-permissions-with-stored-procedures-in-sql-server
