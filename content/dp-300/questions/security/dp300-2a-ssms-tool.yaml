id: dp300-2a-ssms-tool
objective: "2.1.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have an Azure SQL database named **DB1**. A contained database user named **lena@contoso.com** already exists in DB1.

    You need to grant Lena the SELECT permission on the table **Sales.Orders** by using a graphical tool.

    What should you use?
  fr: |
    Vous disposez d'une base de données Azure SQL nommée **DB1**. Un utilisateur de base de données autonome nommé **lena@contoso.com** existe déjà dans DB1.

    Vous devez accorder à Lena l'autorisation SELECT sur la table **Sales.Orders** à l'aide d'un outil graphique.

    Que devez-vous utiliser ?
body:
  options:
    - { id: a, text: { en: "SQL Server Management Studio: the Permissions page of the Sales.Orders table properties", fr: "SQL Server Management Studio : la page Permissions des propriétés de la table Sales.Orders" } }
    - { id: b, text: { en: "Azure portal: the Access control (IAM) page of DB1, with a role assignment for Lena", fr: "Portail Azure : la page Contrôle d'accès (IAM) de DB1, avec une attribution de rôle pour Lena" } }
    - { id: c, text: { en: "Azure portal: the Microsoft Entra ID page of the logical server, with Lena set as admin", fr: "Portail Azure : la page Microsoft Entra ID du serveur logique, avec Lena définie comme administrateur" } }
    - { id: d, text: { en: "Microsoft Entra admin center: the Users and groups page of an enterprise application", fr: "Centre d'administration Microsoft Entra : la page Utilisateurs et groupes d'une application d'entreprise" } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Database and object permissions are stored in the database engine, so you set them with a SQL client. In SSMS, the Permissions page of a table's properties lets you add a principal and select Grant, With Grant or Deny for each permission.
    fr: |
      Les autorisations de base de données et d'objet sont stockées dans le moteur de base de données : vous les définissez avec un client SQL. Dans SSMS, la page Permissions des propriétés d'une table permet d'ajouter un principal et de sélectionner Grant, With Grant ou Deny pour chaque autorisation.
  options:
    b:
      en: Access control (IAM) assigns Azure RBAC roles on the resource; they never grant permissions on tables.
      fr: Le Contrôle d'accès (IAM) attribue des rôles Azure RBAC sur la ressource ; ils n'accordent jamais d'autorisations sur des tables.
    c:
      en: Making Lena the Microsoft Entra admin gives her full control of every database, which is far more than SELECT on one table.
      fr: Faire de Lena l'administrateur Microsoft Entra lui donne le contrôle total de toutes les bases, bien plus que SELECT sur une table.
    d:
      en: Enterprise application assignments control sign-in to applications, not permissions inside a database.
      fr: Les attributions d'applications d'entreprise contrôlent la connexion aux applications, pas les autorisations à l'intérieur d'une base.
references:
  - title: Grant a Permission to a Principal
    url: https://learn.microsoft.com/en-us/sql/relational-databases/security/authentication-access/grant-a-permission-to-a-principal
