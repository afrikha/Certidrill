id: dp300-2c-audit-entra-failed
objective: "2.3.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have an Azure SQL database named DB1 that accepts both Microsoft Entra authentication and SQL authentication. Server-level auditing is enabled with the default action groups and writes to a Log Analytics workspace.

    The security team reports that failed SQL authentication attempts appear in the audit logs, but failed sign-in attempts by Microsoft Entra users do not.

    You need to review the failed sign-in attempts of the Microsoft Entra users.

    What should you use?
  fr: |
    Vous disposez d'une base de données Azure SQL nommée DB1 qui accepte l'authentification Microsoft Entra et l'authentification SQL. L'audit au niveau du serveur est activé avec les groupes d'actions par défaut et écrit vers un espace de travail Log Analytics.

    L'équipe de sécurité signale que les tentatives d'authentification SQL ayant échoué apparaissent dans les journaux d'audit, mais pas les tentatives de connexion ayant échoué des utilisateurs Microsoft Entra.

    Vous devez examiner les tentatives de connexion ayant échoué des utilisateurs Microsoft Entra.

    Que devez-vous utiliser ?
body:
  options:
    - { id: a, text: { en: "The Microsoft Entra sign-in logs", fr: "Les journaux de connexion Microsoft Entra" } }
    - { id: b, text: { en: "Database-level auditing on DB1 with the same action groups", fr: "L'audit au niveau de la base de données sur DB1 avec les mêmes groupes d'actions" } }
    - { id: c, text: { en: "The Azure activity log of the logical server", fr: "Le journal d'activité Azure du serveur logique" } }
    - { id: d, text: { en: "A server audit policy that adds DATABASE_PRINCIPAL_CHANGE_GROUP", fr: "Une stratégie d'audit du serveur qui ajoute DATABASE_PRINCIPAL_CHANGE_GROUP" } }
answer:
  optionId: a
explanation:
  correct:
    en: |
      Failed Microsoft Entra sign-ins are not recorded in the SQL audit log, because the credentials are verified by Microsoft Entra ID before the connection reaches the database. Those attempts are found in the Microsoft Entra sign-in logs. Failed SQL logins are audited because the database itself verifies the credentials.
    fr: |
      Les échecs de connexion Microsoft Entra ne sont pas enregistrés dans le journal d'audit SQL, car les informations d'identification sont vérifiées par Microsoft Entra ID avant que la connexion n'atteigne la base de données. Ces tentatives se trouvent dans les journaux de connexion Microsoft Entra. Les échecs de connexion SQL sont audités, car c'est la base qui vérifie les informations d'identification.
  options:
    b: { en: "A database-level policy captures the same SQL events as the server policy; Microsoft Entra sign-in failures still never reach the audit log.", fr: "Une stratégie au niveau de la base capture les mêmes événements SQL que la stratégie du serveur ; les échecs de connexion Microsoft Entra n'atteignent toujours pas le journal d'audit." }
    c: { en: "The activity log records control-plane operations on Azure resources, not sign-in attempts to a database.", fr: "Le journal d'activité enregistre les opérations du plan de contrôle sur les ressources Azure, pas les tentatives de connexion à une base de données." }
    d: { en: "DATABASE_PRINCIPAL_CHANGE_GROUP records the creation, change or deletion of database principals, not sign-in failures.", fr: "DATABASE_PRINCIPAL_CHANGE_GROUP enregistre la création, la modification ou la suppression de principaux de base de données, pas les échecs de connexion." }
references:
  - title: Auditing for Azure SQL Database
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/auditing-overview
