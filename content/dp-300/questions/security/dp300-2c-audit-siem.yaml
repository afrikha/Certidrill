id: dp300-2c-audit-siem
objective: "2.3.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have an Azure SQL logical server named sql-woodgrove that hosts 12 databases.

    You need to enable auditing for all the databases. The audit events must be streamed in near real time to a third-party security information and event management (SIEM) solution that consumes events from a streaming endpoint.

    Which audit destination should you configure?
  fr: |
    Vous disposez d'un serveur logique Azure SQL nommé sql-woodgrove qui héberge 12 bases de données.

    Vous devez activer l'audit pour toutes les bases de données. Les événements d'audit doivent être diffusés en quasi-temps réel vers une solution tierce de gestion des informations et des événements de sécurité (SIEM) qui consomme les événements depuis un point de terminaison de diffusion en continu.

    Quelle destination d'audit devez-vous configurer ?
body:
  options:
    - { id: a, text: { en: "An Azure Storage account", fr: "Un compte de stockage Azure" } }
    - { id: b, text: { en: "An event hub in Azure Event Hubs", fr: "Un hub d'événements dans Azure Event Hubs" } }
    - { id: c, text: { en: "A Log Analytics workspace", fr: "Un espace de travail Log Analytics" } }
    - { id: d, text: { en: "An Azure Data Explorer cluster", fr: "Un cluster Azure Data Explorer" } }
answer:
  optionId: b
explanation:
  correct:
    en: |
      Azure SQL auditing can write to a storage account, a Log Analytics workspace, Event Hubs, or any combination of them. Event Hubs is the destination for streaming audit events to external consumers such as a third-party SIEM. Configuring it on the server applies the policy to every database of sql-woodgrove.
    fr: |
      L'audit Azure SQL peut écrire vers un compte de stockage, un espace de travail Log Analytics, Event Hubs ou toute combinaison des trois. Event Hubs est la destination qui permet de diffuser les événements d'audit vers des consommateurs externes, comme un SIEM tiers. Le configurer sur le serveur applique la stratégie à toutes les bases de données de sql-woodgrove.
  options:
    a: { en: "A storage account keeps .xel files for retention and later analysis; it is not a streaming endpoint.", fr: "Un compte de stockage conserve des fichiers .xel pour la rétention et l'analyse ultérieure ; ce n'est pas un point de terminaison de diffusion en continu." }
    c: { en: "A Log Analytics workspace is for KQL queries, dashboards and alerts in Azure Monitor, not for streaming to a third-party SIEM.", fr: "Un espace de travail Log Analytics sert aux requêtes KQL, aux tableaux de bord et aux alertes dans Azure Monitor, pas à la diffusion vers un SIEM tiers." }
    d: { en: "Azure Data Explorer is not one of the audit destinations offered by Azure SQL auditing.", fr: "Azure Data Explorer ne fait pas partie des destinations proposées par l'audit Azure SQL." }
references:
  - title: Set up Auditing for Azure SQL Database
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/auditing-setup
