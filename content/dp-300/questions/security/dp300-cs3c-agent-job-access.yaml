id: dp300-cs3c-agent-job-access
objective: "2.1.7"
type: single
caseStudy: dp300-cs3c-trey-research
difficulty: 3
status: draft
stem:
  en: |
    You need to resolve the issue that Dana reports and meet the operations requirements.

    What should you do?
  fr: |
    Vous devez résoudre le problème signalé par Dana et satisfaire les exigences d'exploitation.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Add the msdb user of SG-Trial-Ops to SQLAgentOperatorRole.", fr: "Ajouter l'utilisateur msdb de SG-Trial-Ops à SQLAgentOperatorRole." } }
    - { id: b, text: { en: "Create a SQL Server Agent proxy for SG-Trial-Ops, and grant the proxy to the Transact-SQL subsystem.", fr: "Créer un proxy SQL Server Agent pour SG-Trial-Ops, et accorder le proxy au sous-système Transact-SQL." } }
    - { id: c, text: { en: "Create a Microsoft Entra login for each member of SG-Trial-Ops, and add their msdb users to SQLAgentUserRole.", fr: "Créer une connexion Microsoft Entra pour chaque membre de SG-Trial-Ops, et ajouter leurs utilisateurs msdb à SQLAgentUserRole." } }
    - { id: d, text: { en: "Re-create the msdb user of SG-Trial-Ops by using FROM EXTERNAL PROVIDER.", fr: "Recréer l'utilisateur msdb de SG-Trial-Ops à l'aide de FROM EXTERNAL PROVIDER." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      On SQL Managed Instance, a user must be mapped directly to a Microsoft Entra server login to create, modify or run SQL Server Agent jobs; membership in a Microsoft Entra group that has a login is not enough. Creating an individual login for each data manager with `FROM EXTERNAL PROVIDER`, mapping it to a user in msdb and adding the user to SQLAgentUserRole lets each one manage their own jobs, the least privileged SQL Server Agent role.
    fr: |
      Sur SQL Managed Instance, un utilisateur doit être mappé directement à une connexion de serveur Microsoft Entra pour créer, modifier ou exécuter des travaux SQL Server Agent ; l'appartenance à un groupe Microsoft Entra disposant d'une connexion ne suffit pas. Créer une connexion individuelle pour chaque gestionnaire de données avec `FROM EXTERNAL PROVIDER`, l'associer à un utilisateur dans msdb et ajouter celui-ci à SQLAgentUserRole permet à chacun de gérer ses propres travaux, avec le rôle SQL Server Agent le moins privilégié.
  options:
    a: { en: "The problem is not the role: group membership alone is not enough on SQL Managed Instance, and SQLAgentOperatorRole would also grant rights on the jobs of other users.", fr: "Le problème ne vient pas du rôle : l'appartenance à un groupe ne suffit pas sur SQL Managed Instance, et SQLAgentOperatorRole accorderait aussi des droits sur les travaux des autres utilisateurs." }
    b: { en: "SQL Managed Instance does not support SQL Server Agent proxies, and Transact-SQL job steps never use proxies.", fr: "SQL Managed Instance ne prend pas en charge les proxys SQL Server Agent, et les étapes de travail Transact-SQL n'utilisent jamais de proxy." }
    d: { en: "A user for the group, however it is created, still gives Dana access only through group membership, which is not enough for SQL Server Agent jobs.", fr: "Un utilisateur pour le groupe, quelle que soit la façon dont il est créé, ne donne toujours accès à Dana que par l'appartenance au groupe, ce qui ne suffit pas pour les travaux SQL Server Agent." }
references:
  - title: T-SQL differences between SQL Server and Azure SQL Managed Instance
    url: https://learn.microsoft.com/en-us/azure/azure-sql/managed-instance/transact-sql-tsql-differences-sql-server
