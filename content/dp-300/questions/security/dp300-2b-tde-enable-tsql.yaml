id: dp300-2b-tde-enable-tsql
objective: "2.2.1"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    You have an Azure virtual machine that runs SQL Server 2022 and hosts a database named **Payroll**. Transparent data encryption (TDE) is not configured on the instance.

    You need to enable TDE for Payroll by using a certificate stored in the master database.

    How should you complete the Transact-SQL script? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'une machine virtuelle Azure qui exécute SQL Server 2022 et héberge une base de données nommée **Payroll**. Le chiffrement transparent des données (TDE) n'est pas configuré sur l'instance.

    Vous devez activer TDE pour Payroll à l'aide d'un certificat stocké dans la base de données master.

    Comment devez-vous compléter le script Transact-SQL ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: sql
  template: |
    USE master;
    CREATE MASTER KEY ENCRYPTION BY PASSWORD = 'Str0ng!Master#Key26';
    CREATE [[obj]] PayrollTdeCert WITH SUBJECT = 'Payroll TDE';
    GO
    USE Payroll;
    CREATE DATABASE ENCRYPTION KEY WITH ALGORITHM = AES_256
      ENCRYPTION BY [[prot]] PayrollTdeCert;
    ALTER DATABASE Payroll SET [[opt]];
  slots:
    - id: obj
      options:
        - { id: symkey, text: SYMMETRIC KEY }
        - { id: cert, text: CERTIFICATE }
        - { id: cred, text: CREDENTIAL }
    - id: prot
      options:
        - { id: pcert, text: CERTIFICATE }
        - { id: srvcert, text: SERVER CERTIFICATE }
        - { id: pasym, text: ASYMMETRIC KEY }
    - id: opt
      options:
        - { id: suspend, text: ENCRYPTION SUSPEND }
        - { id: resume, text: ENCRYPTION RESUME }
        - { id: on, text: ENCRYPTION ON }
answer:
  values: { obj: cert, prot: srvcert, opt: on }
explanation:
  correct:
    en: "TDE needs a certificate in master protected by the database master key. The database encryption key is created in the user database with ENCRYPTION BY SERVER CERTIFICATE, because the certificate lives at the server level in master. ALTER DATABASE ... SET ENCRYPTION ON starts the encryption scan. Back up the certificate and its private key immediately afterward."
    fr: "TDE exige un certificat dans master protégé par la clé principale de base de données. La clé de chiffrement de base de données se crée dans la base utilisateur avec ENCRYPTION BY SERVER CERTIFICATE, car le certificat se trouve au niveau du serveur, dans master. ALTER DATABASE ... SET ENCRYPTION ON lance l'analyse de chiffrement. Sauvegardez ensuite immédiatement le certificat et sa clé privée."
  options:
    symkey: { en: "A symmetric key cannot protect a database encryption key (TDE uses a server certificate or an EKM asymmetric key), and CREATE SYMMETRIC KEY has no WITH SUBJECT option.", fr: "Une clé symétrique ne peut pas protéger une clé de chiffrement de base de données (TDE utilise un certificat de serveur ou une clé asymétrique EKM), et CREATE SYMMETRIC KEY n'a pas d'option WITH SUBJECT." }
    cred: { en: "A credential stores authentication information, such as for an EKM provider or backup to URL; it is not an encryption key.", fr: "Des informations d'identification stockent des données d'authentification, par exemple pour un fournisseur EKM ou une sauvegarde vers une URL ; ce n'est pas une clé de chiffrement." }
    pcert: { en: "CREATE DATABASE ENCRYPTION KEY accepts ENCRYPTION BY SERVER CERTIFICATE or SERVER ASYMMETRIC KEY; the keyword CERTIFICATE alone is not valid there.", fr: "CREATE DATABASE ENCRYPTION KEY accepte ENCRYPTION BY SERVER CERTIFICATE ou SERVER ASYMMETRIC KEY ; le mot clé CERTIFICATE seul n'y est pas valide." }
    pasym: { en: "PayrollTdeCert is a certificate, not an asymmetric key, and an asymmetric key would be referenced as SERVER ASYMMETRIC KEY.", fr: "PayrollTdeCert est un certificat, pas une clé asymétrique, et une clé asymétrique serait référencée par SERVER ASYMMETRIC KEY." }
    suspend: { en: "SET ENCRYPTION SUSPEND pauses an encryption scan that is already running; it does not enable TDE.", fr: "SET ENCRYPTION SUSPEND met en pause une analyse de chiffrement déjà en cours ; il n'active pas TDE." }
    resume: { en: "SET ENCRYPTION RESUME restarts a suspended encryption scan; it does not enable TDE.", fr: "SET ENCRYPTION RESUME reprend une analyse de chiffrement suspendue ; il n'active pas TDE." }
references:
  - title: Transparent data encryption (TDE)
    url: https://learn.microsoft.com/en-us/sql/relational-databases/security/encryption/transparent-data-encryption
