id: dp300-sr1-partner-reports-3
objective: "2.2.3"
type: series_yesno
series: dp300-sr1-partner-reports
seriesOrder: 3
difficulty: 2
status: draft
stem:
  en: |
    You create a database-level firewall rule in Orders.
  fr: |
    Vous créez une règle de pare-feu au niveau de la base de données dans Orders.
body:
  solution:
    en: |
      You connect to the **Orders** database of sql-wingtip-prod as the server admin and run the following statement:

      `EXECUTE sp_set_database_firewall_rule @name = N'PartnerReports', @start_ip_address = '198.51.100.25', @end_ip_address = '198.51.100.25';`
    fr: |
      Vous vous connectez à la base de données **Orders** de sql-wingtip-prod en tant qu'administrateur du serveur et exécutez l'instruction suivante :

      `EXECUTE sp_set_database_firewall_rule @name = N'PartnerReports', @start_ip_address = '198.51.100.25', @end_ip_address = '198.51.100.25';`
answer: { value: true }
explanation:
  correct:
    en: |
      A database-level IP firewall rule created in Orders is checked first when a client connects to Orders, so the tool is allowed, while Inventory and HR still rely only on the server-level rule that doesn't include its address. Database-level rules are stored in the database itself, so they follow Orders to its geo-secondary. A server-level rule already exists, which is the prerequisite for database-level rules.
    fr: |
      Une règle de pare-feu IP au niveau de la base créée dans Orders est vérifiée en premier quand un client se connecte à Orders : l'outil est autorisé, tandis qu'Inventory et HR ne dépendent que de la règle au niveau du serveur, qui n'inclut pas son adresse. Les règles au niveau de la base sont stockées dans la base elle-même : elles suivent Orders vers son géosecondaire. Une règle au niveau du serveur existe déjà, ce qui est le prérequis des règles au niveau de la base.
references:
  - title: Azure SQL Database IP firewall rules
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/firewall-configure
