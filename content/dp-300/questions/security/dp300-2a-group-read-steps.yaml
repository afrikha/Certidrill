id: dp300-2a-group-read-steps
objective: "2.1.4"
type: ordering
difficulty: 1
status: draft
stem:
  en: |
    You deploy a new Azure SQL Database logical server named **sql-proseware** with a database named **DB1**. Only the SQL server admin login exists, and a firewall rule already allows your client IP address.

    You need members of the Microsoft Entra group **Analysts** to read all the tables in DB1 by using their Microsoft Entra accounts.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Vous déployez un nouveau serveur logique Azure SQL Database nommé **sql-proseware** avec une base de données nommée **DB1**. Seule la connexion d'administrateur SQL du serveur existe, et une règle de pare-feu autorise déjà l'adresse IP de votre client.

    Vous devez permettre aux membres du groupe Microsoft Entra **Analysts** de lire toutes les tables de DB1 avec leurs comptes Microsoft Entra.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: admin, text: { en: "Set your Microsoft Entra account as the Microsoft Entra admin of sql-proseware.", fr: "Définir votre compte Microsoft Entra comme administrateur Microsoft Entra de sql-proseware." } }
    - { id: sqladm, text: { en: "Connect to DB1 as the SQL server admin.", fr: "Se connecter à DB1 en tant qu'administrateur SQL du serveur." } }
    - { id: connect, text: { en: "Connect to DB1 with your Microsoft Entra account by using Microsoft Entra MFA.", fr: "Se connecter à DB1 avec votre compte Microsoft Entra en utilisant Microsoft Entra MFA." } }
    - { id: user, text: { en: "Run CREATE USER [Analysts] FROM EXTERNAL PROVIDER.", fr: "Exécuter CREATE USER [Analysts] FROM EXTERNAL PROVIDER." } }
    - { id: rbac, text: { en: "Assign the SQL DB Contributor role on DB1 to Analysts.", fr: "Attribuer le rôle SQL DB Contributor sur DB1 à Analysts." } }
    - { id: role, text: { en: "Run ALTER ROLE db_datareader ADD MEMBER [Analysts].", fr: "Exécuter ALTER ROLE db_datareader ADD MEMBER [Analysts]." } }
answer:
  sequence: [ admin, connect, user, role ]
explanation:
  correct:
    en: |
      The first Microsoft Entra principal of a server is its Microsoft Entra admin, and only a Microsoft Entra identity can create Microsoft Entra users. You therefore set the admin, connect with that Microsoft Entra account, create the contained user for the group and add it to db_datareader.
    fr: |
      Le premier principal Microsoft Entra d'un serveur est son administrateur Microsoft Entra, et seule une identité Microsoft Entra peut créer des utilisateurs Microsoft Entra. Vous définissez donc l'administrateur, vous vous connectez avec ce compte Microsoft Entra, vous créez l'utilisateur autonome du groupe et vous l'ajoutez à db_datareader.
  options:
    sqladm: { en: "The SQL server admin can't create Microsoft Entra users.", fr: "L'administrateur SQL du serveur ne peut pas créer d'utilisateurs Microsoft Entra." }
    rbac: { en: "Azure RBAC roles manage the resource and don't grant access to the data.", fr: "Les rôles Azure RBAC gèrent la ressource et n'accordent pas d'accès aux données." }
references:
  - title: Configure Microsoft Entra Authentication - Azure SQL Database & SQL Managed Instance
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/authentication-aad-configure
