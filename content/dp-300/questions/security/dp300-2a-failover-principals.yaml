id: dp300-2a-failover-principals
objective: "2.1.7"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    You have an Azure SQL database named **DB1** on a logical server named **sql-paris**. DB1 is in a failover group with a secondary server named **sql-amsterdam**.

    DB1 contains contained users created FROM EXTERNAL PROVIDER for Microsoft Entra groups, and a user named **app_user** that is mapped to the SQL login **app_login** in master of sql-paris. A Microsoft Entra admin is set on sql-paris only.

    During a failover test, Microsoft Entra users receive a "Cannot connect" error, and the application fails with error 18456.

    Which two actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'une base de données Azure SQL nommée **DB1** sur un serveur logique nommé **sql-paris**. DB1 fait partie d'un groupe de basculement avec un serveur secondaire nommé **sql-amsterdam**.

    DB1 contient des utilisateurs autonomes créés FROM EXTERNAL PROVIDER pour des groupes Microsoft Entra, et un utilisateur nommé **app_user** mappé à la connexion SQL **app_login** dans master de sql-paris. Un administrateur Microsoft Entra est défini sur sql-paris uniquement.

    Lors d'un test de basculement, les utilisateurs Microsoft Entra reçoivent une erreur « Cannot connect », et l'application échoue avec l'erreur 18456.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Set a Microsoft Entra admin on sql-amsterdam.", fr: "Définir un administrateur Microsoft Entra sur sql-amsterdam." } }
    - { id: b, text: { en: "Re-create the Microsoft Entra group users in DB1 after each failover.", fr: "Recréer les utilisateurs des groupes Microsoft Entra dans DB1 après chaque basculement." } }
    - { id: c, text: { en: "On sql-amsterdam, create app_login with the same SID as on sql-paris.", fr: "Sur sql-amsterdam, créer app_login avec le même SID que sur sql-paris." } }
    - { id: d, text: { en: "On sql-amsterdam, create app_login with the same name and password and a new SID.", fr: "Sur sql-amsterdam, créer app_login avec le même nom et le même mot de passe et un nouveau SID." } }
    - { id: e, text: { en: "Enable Microsoft Entra-only authentication on sql-amsterdam.", fr: "Activer l'authentification Microsoft Entra uniquement sur sql-amsterdam." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |
      With geo-replication or failover groups, the Microsoft Entra admin must be set on both the primary and the secondary server, otherwise Microsoft Entra logins and users get a "Cannot connect" error. Logins live in master and aren't replicated: app_login must exist on sql-amsterdam with the SID that app_user references (CREATE LOGIN ... WITH PASSWORD = ..., SID = ...).
    fr: |
      Avec la géoréplication ou les groupes de basculement, l'administrateur Microsoft Entra doit être défini sur le serveur principal et sur le serveur secondaire, sinon les connexions et utilisateurs Microsoft Entra reçoivent une erreur « Cannot connect ». Les connexions résident dans master et ne sont pas répliquées : app_login doit exister sur sql-amsterdam avec le SID référencé par app_user (CREATE LOGIN ... WITH PASSWORD = ..., SID = ...).
  options:
    b: { en: "The contained users are replicated with DB1; the missing piece is the admin on the secondary server.", fr: "Les utilisateurs autonomes sont répliqués avec DB1 ; ce qui manque est l'administrateur sur le serveur secondaire." }
    d: { en: "A new SID doesn't match the SID stored for app_user, which stays orphaned.", fr: "Un nouveau SID ne correspond pas au SID enregistré pour app_user, qui reste orphelin." }
    e: { en: "Microsoft Entra-only authentication would also block app_login, and it requires an admin first.", fr: "L'authentification Microsoft Entra uniquement bloquerait aussi app_login, et elle exige d'abord un administrateur." }
references:
  - title: Microsoft Entra authentication for Azure SQL
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/authentication-aad-overview
  - title: Microsoft Entra server principals
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/authentication-azure-ad-logins
