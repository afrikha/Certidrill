id: dp300-2c-ledger-database
objective: "2.3.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You plan to deploy a new Azure SQL database named DB2 for the accounting application of Woodgrove Bank.

    Every table that is created in DB2, now and in the future, must be a ledger table so that auditors can detect any tampering with the data. Developers must not be able to create regular tables in DB2.

    What should you do?
  fr: |
    Vous prévoyez de déployer une nouvelle base de données Azure SQL nommée DB2 pour l'application de comptabilité de Woodgrove Bank.

    Chaque table créée dans DB2, maintenant et à l'avenir, doit être une table de registre afin que les auditeurs puissent détecter toute falsification des données. Les développeurs ne doivent pas pouvoir créer de tables ordinaires dans DB2.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Enable automatic digest storage on DB2 after you create it.", fr: "Activer le stockage automatique des synthèses sur DB2 après l'avoir créée." } }
    - { id: b, text: { en: "Configure DB2 as a ledger database when you create it.", fr: "Configurer DB2 comme base de données de registre lors de sa création." } }
    - { id: c, text: { en: "Create every table of DB2 with the LEDGER = ON (APPEND_ONLY = ON) option.", fr: "Créer chaque table de DB2 avec l'option LEDGER = ON (APPEND_ONLY = ON)." } }
    - { id: d, text: { en: "Enable system versioning on every table of DB2.", fr: "Activer la gestion système des versions sur chaque table de DB2." } }
answer:
  optionId: b
explanation:
  correct:
    en: |
      A ledger database can contain only ledger tables: regular tables aren't supported, and each new table is created as an updatable ledger table by default. The ledger property is set when the database is created, and the database can't be converted back to a regular database afterward.
    fr: |
      Une base de données de registre ne peut contenir que des tables de registre : les tables ordinaires n'y sont pas prises en charge, et chaque nouvelle table est créée par défaut comme table de registre modifiable. La propriété de registre est définie lors de la création de la base, qui ne peut plus ensuite être reconvertie en base ordinaire.
  options:
    a: { en: "Digest storage protects the digests of existing ledger tables; it doesn't turn tables into ledger tables.", fr: "Le stockage des synthèses protège les synthèses des tables de registre existantes ; il ne transforme pas les tables en tables de registre." }
    c: { en: "Creating append-only tables relies on developers' discipline, blocks all updates, and doesn't prevent regular tables from being created.", fr: "Créer des tables d'ajout uniquement dépend de la discipline des développeurs, bloque toutes les mises à jour et n'empêche pas la création de tables ordinaires." }
    d: { en: "System versioning creates temporal tables, which keep history but provide no cryptographic tamper evidence.", fr: "La gestion système des versions crée des tables temporelles, qui conservent un historique mais n'apportent aucune preuve cryptographique de falsification." }
references:
  - title: Ledger overview
    url: https://learn.microsoft.com/en-us/sql/relational-databases/security/ledger/ledger-overview
