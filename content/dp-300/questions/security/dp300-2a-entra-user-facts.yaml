id: dp300-2a-entra-user-facts
objective: "2.1.4"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Contoso has a Microsoft Entra tenant named contoso.com and an Azure SQL database named **DB1**. A partner, **alice@fabrikam.com**, was invited to contoso.com as a guest user. You connect to DB1 as the Microsoft Entra admin to create users.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso dispose d'un locataire Microsoft Entra nommé contoso.com et d'une base de données Azure SQL nommée **DB1**. Une partenaire, **alice@fabrikam.com**, a été invitée dans contoso.com en tant qu'utilisateur invité. Vous vous connectez à DB1 en tant qu'administrateur Microsoft Entra pour créer des utilisateurs.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: You can give Alice access by running CREATE USER [alice@fabrikam.com] FROM EXTERNAL PROVIDER in DB1.
        fr: Vous pouvez donner accès à Alice en exécutant CREATE USER [alice@fabrikam.com] FROM EXTERNAL PROVIDER dans DB1.
    - id: s2
      text:
        en: A user created FROM EXTERNAL PROVIDER is automatically a member of db_datareader.
        fr: Un utilisateur créé FROM EXTERNAL PROVIDER est automatiquement membre de db_datareader.
    - id: s3
      text:
        en: After you create a user for a Microsoft Entra security group, the members of the group can connect to DB1 without individual database users.
        fr: Après la création d'un utilisateur pour un groupe de sécurité Microsoft Entra, les membres du groupe peuvent se connecter à DB1 sans utilisateurs de base de données individuels.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |
      Once the external identity exists in the tenant as a guest, you create its contained user with its email address and FROM EXTERNAL PROVIDER. A new user gets only the CONNECT permission; you add it to roles to grant access. A user created for a group lets every member of the group connect, which is the recommended way to manage access.
    fr: |
      Une fois l'identité externe présente dans le locataire en tant qu'invitée, vous créez son utilisateur autonome avec son adresse e-mail et FROM EXTERNAL PROVIDER. Un nouvel utilisateur ne reçoit que l'autorisation CONNECT ; vous l'ajoutez à des rôles pour lui donner accès. Un utilisateur créé pour un groupe permet à chaque membre du groupe de se connecter, ce qui est la façon recommandée de gérer les accès.
references:
  - title: Configure Microsoft Entra Authentication - Azure SQL Database & SQL Managed Instance
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/authentication-aad-configure
