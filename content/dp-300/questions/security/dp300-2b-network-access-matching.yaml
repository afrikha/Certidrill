id: dp300-2b-network-access-matching
objective: "2.2.6"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    You have an Azure SQL Database logical server named **sql-contoso** in the West Europe region. You must configure network access for several clients. Each solution must meet the requirement and minimize cost and administrative effort.

    Which network access option should you use for each requirement? To answer, drag the appropriate options to the correct requirements. Each option may be used once, more than once, or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un serveur logique Azure SQL Database nommé **sql-contoso** dans la région West Europe. Vous devez configurer l'accès réseau de plusieurs clients. Chaque solution doit satisfaire l'exigence et réduire au minimum le coût et l'effort d'administration.

    Quelle option d'accès réseau devez-vous utiliser pour chaque exigence ? Pour répondre, faites glisser les options appropriées vers les exigences correspondantes. Chaque option peut être utilisée une fois, plusieurs fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: true
  items:
    - { id: se, text: { en: "Virtual network service endpoint and virtual network rule", fr: "Point de terminaison de service de réseau virtuel et règle de réseau virtuel" } }
    - { id: pe, text: { en: "Private endpoint", fr: "Point de terminaison privé" } }
    - { id: ip, text: { en: "Server-level IP firewall rule", fr: "Règle de pare-feu IP au niveau du serveur" } }
    - { id: azure, text: { en: "Allow Azure services and resources to access this server", fr: "Allow Azure services and resources to access this server" } }
  targets:
    - id: t1
      text: { en: "Virtual machines in a West Europe subnet must connect; the server keeps its public endpoint", fr: "Des machines virtuelles d'un sous-réseau de West Europe doivent se connecter ; le serveur conserve son point de terminaison public" }
    - id: t2
      text: { en: "Servers in the on-premises datacenter must connect over a site-to-site VPN by using a private IP address", fr: "Des serveurs du centre de données local doivent se connecter par un VPN de site à site avec une adresse IP privée" }
    - id: t3
      text: { en: "Workloads in a subnet must reach sql-contoso but no other logical server, to prevent data exfiltration", fr: "Des charges de travail d'un sous-réseau doivent atteindre sql-contoso mais aucun autre serveur logique, pour empêcher l'exfiltration de données" }
    - id: t4
      text: { en: "A partner's application must connect over the internet from a static public IP address", fr: "L'application d'un partenaire doit se connecter par Internet depuis une adresse IP publique statique" }
answer:
  mapping: { t1: se, t2: pe, t3: pe, t4: ip }
explanation:
  correct:
    en: "A service endpoint with a virtual network rule allows a subnet in the same region to reach the public endpoint at no extra cost. A private endpoint gives the server a private IP address that on-premises networks reach over VPN or ExpressRoute, and because it maps to one resource, it protects against data exfiltration. A known public IP address on the internet is allowed with an IP firewall rule."
    fr: "Un point de terminaison de service avec une règle de réseau virtuel permet à un sous-réseau de la même région d'atteindre le point de terminaison public sans coût supplémentaire. Un point de terminaison privé donne au serveur une adresse IP privée que les réseaux locaux atteignent par VPN ou ExpressRoute et, comme il correspond à une seule ressource, il protège contre l'exfiltration de données. Une adresse IP publique connue sur Internet s'autorise avec une règle de pare-feu IP."
  options:
    azure: { en: "This setting allows every Azure IP address, including other customers' services, and none of the requirements needs it.", fr: "Ce paramètre autorise toutes les adresses IP d'Azure, y compris les services d'autres clients, et aucune exigence n'en a besoin." }
references:
  - title: Azure Private Link for Azure SQL Database
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/private-endpoint-overview
  - title: Use virtual network service endpoints and rules for servers in Azure SQL Database
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/vnet-service-endpoint-rule-overview
