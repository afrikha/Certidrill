id: dp300-2a-vm-entra-steps
objective: "2.1.2"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    You have an Azure virtual machine named **VM1** that runs SQL Server 2022 on Windows Server. VM1 is registered with the SQL IaaS Agent extension and has no managed identity. The network security group of VM1 allows outbound traffic on ports 80 and 443 to the **AzureActiveDirectory** service tag.

    You need to allow the members of a Microsoft Entra group named **DB-Ops** to sign in to the instance by using their Microsoft Entra accounts.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Vous disposez d'une machine virtuelle Azure nommée **VM1** qui exécute SQL Server 2022 sous Windows Server. VM1 est inscrite auprès de l'extension SQL IaaS Agent et n'a pas d'identité managée. Le groupe de sécurité réseau de VM1 autorise le trafic sortant sur les ports 80 et 443 vers l'étiquette de service **AzureActiveDirectory**.

    Vous devez permettre aux membres d'un groupe Microsoft Entra nommé **DB-Ops** de se connecter à l'instance avec leurs comptes Microsoft Entra.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: mi, text: { en: "Enable a system-assigned managed identity on VM1.", fr: "Activer une identité managée affectée par le système sur VM1." } }
    - { id: arc, text: { en: "Connect VM1 to Azure Arc by installing the Azure Connected Machine agent.", fr: "Connecter VM1 à Azure Arc en installant l'agent Azure Connected Machine." } }
    - { id: dr, text: { en: "Assign the Directory Readers role in Microsoft Entra ID to the managed identity of VM1.", fr: "Attribuer le rôle Directory Readers dans Microsoft Entra ID à l'identité managée de VM1." } }
    - { id: eds, text: { en: "Join VM1 to a Microsoft Entra Domain Services managed domain.", fr: "Joindre VM1 à un domaine managé Microsoft Entra Domain Services." } }
    - { id: sec, text: { en: "On the Security Configuration page of the SQL virtual machine, enable Microsoft Entra authentication and select the system-assigned identity.", fr: "Dans la page Security Configuration de la machine virtuelle SQL, activer l'authentification Microsoft Entra et sélectionner l'identité affectée par le système." } }
    - { id: login, text: { en: "Connect to the instance as a sysadmin and run CREATE LOGIN [DB-Ops] FROM EXTERNAL PROVIDER.", fr: "Se connecter à l'instance en tant que sysadmin et exécuter CREATE LOGIN [DB-Ops] FROM EXTERNAL PROVIDER." } }
answer:
  sequence: [ mi, dr, sec, login ]
explanation:
  correct:
    en: |
      On an Azure VM, Microsoft Entra authentication relies on the SQL IaaS Agent extension and a managed identity of the VM. The identity must exist before it can receive Directory Readers (or the equivalent Microsoft Graph permissions), and the portal refuses to enable the feature with an identity that lacks those permissions. Once the feature is enabled, you create the Microsoft Entra logins with CREATE LOGIN ... FROM EXTERNAL PROVIDER.
    fr: |
      Sur une machine virtuelle Azure, l'authentification Microsoft Entra repose sur l'extension SQL IaaS Agent et une identité managée de la machine virtuelle. L'identité doit exister avant de recevoir Directory Readers (ou les autorisations Microsoft Graph équivalentes), et le portail refuse d'activer la fonctionnalité avec une identité qui n'a pas ces autorisations. Une fois la fonctionnalité activée, vous créez les connexions Microsoft Entra avec CREATE LOGIN ... FROM EXTERNAL PROVIDER.
  options:
    arc: { en: "Azure Arc is for SQL Server outside Azure; an Azure VM uses the SQL IaaS Agent extension instead.", fr: "Azure Arc concerne SQL Server hors d'Azure ; une machine virtuelle Azure utilise à la place l'extension SQL IaaS Agent." }
    eds: { en: "A managed domain isn't needed for Microsoft Entra authentication to SQL Server.", fr: "Un domaine managé n'est pas nécessaire pour l'authentification Microsoft Entra auprès de SQL Server." }
references:
  - title: Enable Microsoft Entra authentication - SQL Server on Azure VMs
    url: https://learn.microsoft.com/en-us/azure/azure-sql/virtual-machines/windows/configure-azure-ad-authentication-for-sql-vm
