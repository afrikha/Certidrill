id: dp300-2c-classify-feature
objective: "2.3.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have an Azure SQL database named DB1 that contains customer and employee data.

    The compliance team requires the following:

    - Identify the columns that potentially contain sensitive data, such as national ID numbers.
    - Apply a sensitivity label and an information type to each of those columns.
    - View a dashboard that shows the sensitivity state of DB1.

    What should you use?
  fr: |
    Vous disposez d'une base de données Azure SQL nommée DB1 qui contient des données sur les clients et les employés.

    L'équipe de conformité exige ce qui suit :

    - Identifier les colonnes qui contiennent potentiellement des données sensibles, comme des numéros d'identification nationaux.
    - Appliquer une étiquette de sensibilité et un type d'informations à chacune de ces colonnes.
    - Afficher un tableau de bord qui présente l'état de sensibilité de DB1.

    Que devez-vous utiliser ?
body:
  options:
    - { id: a, text: { en: "Dynamic data masking", fr: "Masquage dynamique des données" } }
    - { id: b, text: { en: "SQL vulnerability assessment", fr: "Évaluation des vulnérabilités SQL" } }
    - { id: c, text: { en: "Data Discovery & Classification", fr: "Découverte et classification des données" } }
    - { id: d, text: Always Encrypted }
answer:
  optionId: c
explanation:
  correct:
    en: |
      Data Discovery & Classification is built into Azure SQL Database. Its classification engine scans the database and recommends columns that potentially contain sensitive data, stores the accepted labels and information types as column metadata, and shows an overview dashboard that can be exported for compliance reporting.
    fr: |
      La découverte et classification des données est intégrée à Azure SQL Database. Son moteur de classification analyse la base de données et recommande les colonnes qui contiennent potentiellement des données sensibles, stocke les étiquettes et les types d'informations acceptés comme métadonnées des colonnes, et affiche un tableau de bord de vue d'ensemble exportable pour les rapports de conformité.
  options:
    a: { en: "Dynamic data masking hides values in query results; it does not label columns or report on their sensitivity.", fr: "Le masquage dynamique des données masque des valeurs dans les résultats des requêtes ; il n'étiquette pas les colonnes et ne produit pas de rapport sur leur sensibilité." }
    b: { en: "Vulnerability assessment scans for security misconfigurations against a baseline; it does not apply sensitivity labels to columns.", fr: "L'évaluation des vulnérabilités recherche des erreurs de configuration de sécurité par rapport à une ligne de base ; elle n'applique pas d'étiquettes de sensibilité aux colonnes." }
    d: { en: "Always Encrypted encrypts column values on the client side; it neither discovers nor labels sensitive columns.", fr: "Always Encrypted chiffre les valeurs des colonnes côté client ; il ne découvre ni n'étiquette les colonnes sensibles." }
references:
  - title: Data Discovery & Classification
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/data-discovery-and-classification-overview
