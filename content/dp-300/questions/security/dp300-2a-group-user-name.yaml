id: dp300-2a-group-user-name
objective: "2.1.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Your Microsoft Entra tenant contains a security group that has the following properties:

    | Property | Value |
    | --- | --- |
    | Display name | Finance Analysts |
    | Mail nickname | fin-analysts |
    | Object ID | 5f1c2a7e-3b4d-4e8f-9a10-2b3c4d5e6f70 |

    You need to create a contained database user for the group in an Azure SQL database named **DB1**. The display name is unique in the tenant.

    Which statement should you run?
  fr: |
    Votre locataire Microsoft Entra contient un groupe de sécurité qui a les propriétés suivantes :

    | Propriété | Valeur |
    | --- | --- |
    | Nom d'affichage | Finance Analysts |
    | Alias de messagerie | fin-analysts |
    | ID d'objet | 5f1c2a7e-3b4d-4e8f-9a10-2b3c4d5e6f70 |

    Vous devez créer un utilisateur de base de données autonome pour le groupe dans une base de données Azure SQL nommée **DB1**. Le nom d'affichage est unique dans le locataire.

    Quelle instruction devez-vous exécuter ?
body:
  options:
    - { id: a, text: "CREATE USER [5f1c2a7e-3b4d-4e8f-9a10-2b3c4d5e6f70] FROM EXTERNAL PROVIDER;" }
    - { id: b, text: "CREATE USER [fin-analysts] FROM EXTERNAL PROVIDER;" }
    - { id: c, text: "CREATE USER [Finance Analysts] FROM LOGIN [Finance Analysts];" }
    - { id: d, text: "CREATE USER [Finance Analysts] FROM EXTERNAL PROVIDER;" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      A Microsoft Entra group is identified by its display name in CREATE USER ... FROM EXTERNAL PROVIDER, as are applications and managed identities; individual users are identified by their user principal name. The statement creates a contained user that isn't linked to any login.
    fr: |
      Un groupe Microsoft Entra est identifié par son nom d'affichage dans CREATE USER ... FROM EXTERNAL PROVIDER, comme les applications et les identités managées ; les utilisateurs individuels sont identifiés par leur nom d'utilisateur principal (UPN). L'instruction crée un utilisateur autonome qui n'est lié à aucune connexion.
  options:
    a:
      en: The object ID isn't used as the user name; it can only be supplied with the separate WITH OBJECT_ID option to resolve duplicate display names.
      fr: L'ID d'objet ne sert pas de nom d'utilisateur ; il ne peut être fourni qu'avec l'option distincte WITH OBJECT_ID pour lever l'ambiguïté entre des noms d'affichage en double.
    b:
      en: The mail nickname isn't used to resolve the group; the display name is.
      fr: L'alias de messagerie ne sert pas à résoudre le groupe ; c'est le nom d'affichage qui est utilisé.
    c:
      en: FROM LOGIN creates a login-based user, not a contained user, and needs an existing login in master.
      fr: FROM LOGIN crée un utilisateur basé sur une connexion, pas un utilisateur autonome, et exige une connexion existante dans master.
references:
  - title: Configure Microsoft Entra Authentication - Azure SQL Database & SQL Managed Instance
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/authentication-aad-configure
