id: dp300-cs2a-private-access
objective: "2.2.6"
type: multi
caseStudy: dp300-cs2a-proseware-market
difficulty: 1
status: draft
stem:
  en: |
    You need to configure network access to sql-pw-prod to meet the network requirements.

    Which two actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez configurer l'accès réseau à sql-pw-prod pour satisfaire les exigences réseau.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Enable the Microsoft.Sql service endpoint on snet-app, and add a virtual network rule for snet-app to sql-pw-prod.", fr: "Activer le point de terminaison de service Microsoft.Sql sur snet-app, et ajouter à sql-pw-prod une règle de réseau virtuel pour snet-app." } }
    - { id: b, text: { en: "Create a private endpoint for sql-pw-prod in snet-data, integrated with the privatelink.database.windows.net private DNS zone.", fr: "Créer un point de terminaison privé pour sql-pw-prod dans snet-data, intégré à la zone DNS privée privatelink.database.windows.net." } }
    - { id: c, text: { en: "Add a database-level IP firewall rule to Orders for the outbound IP addresses of the web application.", fr: "Ajouter à Orders une règle de pare-feu IP au niveau de la base de données pour les adresses IP sortantes de l'application web." } }
    - { id: d, text: { en: "Set the connection policy of sql-pw-prod to Proxy so that every connection goes through the gateway.", fr: "Définir la stratégie de connexion de sql-pw-prod sur Proxy afin que chaque connexion passe par la passerelle." } }
    - { id: e, text: { en: "Set Public network access of sql-pw-prod to Disable.", fr: "Définir l'accès au réseau public de sql-pw-prod sur Disable." } }
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: |
      A private endpoint gives sql-pw-prod a private IP address in snet-data; with the private DNS zone linked to vnet-pw-prod, the server name resolves to that address for the integrated web application. Setting Public network access to Disable then denies every connection that does not come through a private endpoint, whatever the IP firewall rules and the Allow Azure services setting say.
    fr: |
      Un point de terminaison privé donne à sql-pw-prod une adresse IP privée dans snet-data ; avec la zone DNS privée liée à vnet-pw-prod, le nom du serveur se résout vers cette adresse pour l'application web intégrée. Définir ensuite l'accès au réseau public sur Disable refuse toute connexion qui ne passe pas par un point de terminaison privé, quels que soient les règles de pare-feu IP et le paramètre Allow Azure services.
  options:
    a: { en: "With a service endpoint, the traffic stays on the Azure backbone but still targets the public endpoint of the server, not a private IP address of vnet-pw-prod.", fr: "Avec un point de terminaison de service, le trafic reste sur le réseau principal Azure mais cible toujours le point de terminaison public du serveur, pas une adresse IP privée de vnet-pw-prod." }
    c: { en: "An IP firewall rule allows connections from public IP addresses, which the requirements forbid.", fr: "Une règle de pare-feu IP autorise des connexions depuis des adresses IP publiques, ce que les exigences interdisent." }
    d: { en: "The connection policy (Proxy or Redirect) controls how clients reach the database nodes; it neither provides a private IP address nor blocks public access.", fr: "La stratégie de connexion (Proxy ou Redirect) détermine comment les clients atteignent les nœuds de la base ; elle ne fournit pas d'adresse IP privée et ne bloque pas l'accès public." }
references:
  - title: Connectivity settings for Azure SQL Database and SQL database in Fabric
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/connectivity-settings
