id: dp300-2b-cle-characteristics
objective: "2.2.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    You have an Azure SQL database named **Payments**. You plan to protect a column that stores card numbers by using column-level encryption with ENCRYPTBYKEY and a symmetric key protected by a certificate in Payments.

    Which two statements are true?

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'une base de données Azure SQL nommée **Payments**. Vous prévoyez de protéger une colonne qui stocke des numéros de carte à l'aide du chiffrement au niveau des colonnes avec ENCRYPTBYKEY et une clé symétrique protégée par un certificat dans Payments.

    Quelles sont les deux affirmations vraies ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "The encryption and decryption are performed by the database engine.", fr: "Le chiffrement et le déchiffrement sont effectués par le moteur de base de données." } }
    - { id: b, text: { en: "The encryption and decryption are performed by the client driver.", fr: "Le chiffrement et le déchiffrement sont effectués par le pilote client." } }
    - { id: c, text: { en: "A user who has CONTROL permission on Payments can decrypt the card numbers.", fr: "Un utilisateur qui dispose de l'autorisation CONTROL sur Payments peut déchiffrer les numéros de carte." } }
    - { id: d, text: { en: "The symmetric key must be stored in Azure Key Vault.", fr: "La clé symétrique doit être stockée dans Azure Key Vault." } }
    - { id: e, text: { en: "Existing queries return the plaintext without any change.", fr: "Les requêtes existantes renvoient le texte clair sans aucune modification." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: "With column-level encryption, the keys live in the database and the engine encrypts and decrypts the values when T-SQL calls ENCRYPTBYKEY and DECRYPTBYKEY. A principal with CONTROL on the database controls the keys and the certificate, so it can open the key and read the plaintext: this method does not protect data from database administrators."
    fr: "Avec le chiffrement au niveau des colonnes, les clés se trouvent dans la base et le moteur chiffre et déchiffre les valeurs lorsque le code T-SQL appelle ENCRYPTBYKEY et DECRYPTBYKEY. Un principal qui dispose de CONTROL sur la base contrôle les clés et le certificat : il peut ouvrir la clé et lire le texte clair. Cette méthode ne protège donc pas les données contre les administrateurs de base de données."
  options:
    b: { en: "Client-side encryption in the driver is how Always Encrypted works, not ENCRYPTBYKEY.", fr: "Le chiffrement côté client dans le pilote correspond au fonctionnement d'Always Encrypted, pas d'ENCRYPTBYKEY." }
    d: { en: "The symmetric key is stored in the database, protected by the certificate and the database master key.", fr: "La clé symétrique est stockée dans la base, protégée par le certificat et la clé principale de base de données." }
    e: { en: "Queries must open the key and call DECRYPTBYKEY (or DECRYPTBYKEYAUTOCERT) to read the plaintext.", fr: "Les requêtes doivent ouvrir la clé et appeler DECRYPTBYKEY (ou DECRYPTBYKEYAUTOCERT) pour lire le texte clair." }
references:
  - title: Encrypt a column of data
    url: https://learn.microsoft.com/en-us/sql/relational-databases/security/encryption/encrypt-a-column-of-data
