id: dp300-2b-ae-dba-equality
objective: "2.2.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have an Azure SQL database named **Benefits** that contains a table named Member. The NationalID column stores national identification numbers.

    You need to meet the following requirements:

    - The database administrators and Azure operators must never see the NationalID values in plaintext.
    - A client application must look up members by using WHERE NationalID = @id.
    - Secure enclaves must not be used.

    What should you implement?
  fr: |
    Vous disposez d'une base de données Azure SQL nommée **Benefits** qui contient une table nommée Member. La colonne NationalID stocke des numéros d'identification nationaux.

    Vous devez satisfaire les exigences suivantes :

    - Les administrateurs de base de données et les opérateurs Azure ne doivent jamais voir les valeurs NationalID en clair.
    - Une application cliente doit rechercher des membres avec WHERE NationalID = @id.
    - Les enclaves sécurisées ne doivent pas être utilisées.

    Que devez-vous implémenter ?
body:
  options:
    - { id: a, text: { en: "Always Encrypted with deterministic encryption on NationalID", fr: "Always Encrypted avec chiffrement déterministe sur NationalID" } }
    - { id: b, text: { en: "Always Encrypted with randomized encryption on NationalID", fr: "Always Encrypted avec chiffrement aléatoire sur NationalID" } }
    - { id: c, text: { en: "Dynamic data masking with the default() function on NationalID", fr: "Le masquage dynamique des données avec la fonction default() sur NationalID" } }
    - { id: d, text: { en: "Transparent data encryption with a customer-managed key", fr: "Le chiffrement transparent des données avec une clé gérée par le client" } }
answer: { optionId: a }
explanation:
  correct:
    en: "Always Encrypted encrypts the column in the client driver, and the database engine never sees the keys in plaintext, so administrators who have no access to the column master key cannot read the values. Deterministic encryption always produces the same ciphertext for the same value, which supports point lookups with = on a parameter."
    fr: "Always Encrypted chiffre la colonne dans le pilote client, et le moteur de base de données ne voit jamais les clés en clair : les administrateurs qui n'ont pas accès à la clé principale de colonne ne peuvent pas lire les valeurs. Le chiffrement déterministe produit toujours le même texte chiffré pour une même valeur, ce qui permet les recherches ponctuelles avec = sur un paramètre."
  options:
    b: { en: "Without a secure enclave, randomized encryption does not support searching, so the WHERE NationalID = @id lookup would fail.", fr: "Sans enclave sécurisée, le chiffrement aléatoire ne prend pas en charge la recherche : la recherche WHERE NationalID = @id échouerait." }
    c: { en: "Dynamic data masking does not encrypt data, and administrators with UNMASK or CONTROL see the real values.", fr: "Le masquage dynamique des données ne chiffre pas les données, et les administrateurs qui disposent d'UNMASK ou de CONTROL voient les valeurs réelles." }
    d: { en: "TDE protects data at rest only; anyone who can query the table reads the plaintext.", fr: "TDE ne protège que les données au repos ; toute personne qui peut interroger la table lit le texte clair." }
references:
  - title: Always Encrypted
    url: https://learn.microsoft.com/en-us/sql/relational-databases/security/encryption/always-encrypted-database-engine
