id: dp300-2a-entra-only-facts
objective: "2.1.1"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    You have an Azure SQL Database logical server named **sql-fabrikam**. A Microsoft Entra group named **SQL Admins** is the Microsoft Entra admin of the server. A legacy application connects to a database on the server by using a SQL login named **app_login**.

    You plan to enable Microsoft Entra-only authentication on sql-fabrikam.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un serveur logique Azure SQL Database nommé **sql-fabrikam**. Un groupe Microsoft Entra nommé **SQL Admins** est l'administrateur Microsoft Entra du serveur. Une application héritée se connecte à une base du serveur avec une connexion SQL nommée **app_login**.

    Vous prévoyez d'activer l'authentification Microsoft Entra uniquement sur sql-fabrikam.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: When you enable the feature, app_login is deleted from the master database.
        fr: Lorsque vous activez la fonctionnalité, app_login est supprimée de la base de données master.
    - id: s2
      text:
        en: After you enable the feature, SELECT SERVERPROPERTY('IsExternalAuthenticationOnly') returns 1.
        fr: Une fois la fonctionnalité activée, SELECT SERVERPROPERTY('IsExternalAuthenticationOnly') renvoie 1.
    - id: s3
      text:
        en: While the feature is enabled, you can remove SQL Admins as the Microsoft Entra admin of the server.
        fr: Tant que la fonctionnalité est activée, vous pouvez retirer SQL Admins en tant qu'administrateur Microsoft Entra du serveur.
answer:
  values: { s1: false, s2: true, s3: false }
explanation:
  correct:
    en: |
      Microsoft Entra-only authentication blocks every SQL authentication connection, but existing SQL logins and users are kept; they just can't connect. SERVERPROPERTY('IsExternalAuthenticationOnly') returns 1 when the feature is enabled. Removing the Microsoft Entra admin isn't supported while the feature is on: you must disable the feature first.
    fr: |
      L'authentification Microsoft Entra uniquement bloque toute connexion par authentification SQL, mais les connexions et utilisateurs SQL existants sont conservés ; ils ne peuvent simplement plus se connecter. SERVERPROPERTY('IsExternalAuthenticationOnly') renvoie 1 lorsque la fonctionnalité est activée. La suppression de l'administrateur Microsoft Entra n'est pas prise en charge tant que la fonctionnalité est active : il faut d'abord la désactiver.
references:
  - title: Microsoft Entra-only authentication with Azure SQL
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/authentication-azure-ad-only-authentication
