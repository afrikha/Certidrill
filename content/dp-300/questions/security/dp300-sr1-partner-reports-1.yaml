id: dp300-sr1-partner-reports-1
objective: "2.2.3"
type: series_yesno
series: dp300-sr1-partner-reports
seriesOrder: 1
difficulty: 1
status: draft
stem:
  en: |
    You add a firewall rule on the Networking page of sql-wingtip-prod.
  fr: |
    Vous ajoutez une règle de pare-feu dans la page Networking de sql-wingtip-prod.
body:
  solution:
    en: |
      In the Azure portal, on the **Networking** page of sql-wingtip-prod, you add a firewall rule named **PartnerReports** with a start and end IP address of **198.51.100.25**.
    fr: |
      Dans le portail Azure, dans la page **Networking** de sql-wingtip-prod, vous ajoutez une règle de pare-feu nommée **PartnerReports** avec une adresse IP de début et de fin de **198.51.100.25**.
answer: { value: false }
explanation:
  correct:
    en: |
      The portal creates server-level IP firewall rules, which allow the address to reach every database of the server, including Inventory and HR. Server-level rules are stored in master of sql-wingtip-prod, so they aren't replicated with Orders to sql-wingtip-dr.
    fr: |
      Le portail crée des règles de pare-feu IP au niveau du serveur, qui autorisent l'adresse à atteindre toutes les bases du serveur, y compris Inventory et HR. Les règles au niveau du serveur sont stockées dans master de sql-wingtip-prod : elles ne sont pas répliquées avec Orders vers sql-wingtip-dr.
references:
  - title: Azure SQL Database IP firewall rules
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/firewall-configure
