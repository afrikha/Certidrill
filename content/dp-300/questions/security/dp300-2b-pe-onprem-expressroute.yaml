id: dp300-2b-pe-onprem-expressroute
objective: "2.2.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have an Azure SQL Database logical server named **sql-tailspin**. Your on-premises network is connected to an Azure virtual network named **VNet1** by using ExpressRoute private peering.

    You need to ensure that on-premises applications connect to the databases of sql-tailspin by using a private IP address, and that sql-tailspin cannot be reached from the internet.

    What should you do?
  fr: |
    Vous disposez d'un serveur logique Azure SQL Database nommé **sql-tailspin**. Votre réseau local est connecté à un réseau virtuel Azure nommé **VNet1** à l'aide du peering privé ExpressRoute.

    Vous devez vous assurer que les applications locales se connectent aux bases de sql-tailspin avec une adresse IP privée, et que sql-tailspin n'est pas accessible depuis Internet.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Enable the Microsoft.Sql service endpoint on a subnet of VNet1, add a virtual network rule, and select Deny public network access.", fr: "Activer le point de terminaison de service Microsoft.Sql sur un sous-réseau de VNet1, ajouter une règle de réseau virtuel et sélectionner Deny public network access." } }
    - { id: b, text: { en: "Create a server-level IP firewall rule for the public NAT addresses of the on-premises network, and turn off Allow Azure services.", fr: "Créer une règle de pare-feu IP au niveau du serveur pour les adresses NAT publiques du réseau local, et désactiver Allow Azure services." } }
    - { id: c, text: { en: "Create a private endpoint for sql-tailspin in a subnet of VNet1, and select Deny public network access.", fr: "Créer un point de terminaison privé pour sql-tailspin dans un sous-réseau de VNet1, et sélectionner Deny public network access." } }
    - { id: d, text: { en: "Create a private endpoint for sql-tailspin in a subnet of VNet1, and keep the existing IP firewall rules.", fr: "Créer un point de terminaison privé pour sql-tailspin dans un sous-réseau de VNet1, et conserver les règles de pare-feu IP existantes." } }
answer: { optionId: c }
explanation:
  correct:
    en: "A private endpoint gives sql-tailspin a private IP address in VNet1, which on-premises clients reach over ExpressRoute private peering or VPN. Adding a private endpoint does not block public routing by default, so you also select Deny public network access to stop all connections through the public endpoint."
    fr: "Un point de terminaison privé donne à sql-tailspin une adresse IP privée dans VNet1, que les clients locaux atteignent par le peering privé ExpressRoute ou un VPN. L'ajout d'un point de terminaison privé ne bloque pas le routage public par défaut : vous sélectionnez aussi Deny public network access pour arrêter toutes les connexions par le point de terminaison public."
  options:
    a: { en: "Virtual network rules do not apply to on-premises traffic over ExpressRoute or site-to-site VPN, and a service endpoint keeps the traffic on the public endpoint of the server.", fr: "Les règles de réseau virtuel ne s'appliquent pas au trafic local passant par ExpressRoute ou un VPN de site à site, et un point de terminaison de service garde le trafic sur le point de terminaison public du serveur." }
    b: { en: "IP firewall rules allow connections to the public endpoint, so the clients would not use a private IP address and the server stays reachable from the internet.", fr: "Les règles de pare-feu IP autorisent les connexions au point de terminaison public : les clients n'utiliseraient pas d'adresse IP privée et le serveur resterait accessible depuis Internet." }
    d: { en: "The public endpoint remains open as long as public network access is not denied.", fr: "Le point de terminaison public reste ouvert tant que l'accès au réseau public n'est pas refusé." }
references:
  - title: Azure Private Link for Azure SQL Database
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/private-endpoint-overview
