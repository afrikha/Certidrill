id: dp300-2b-execute-as-user
objective: "2.1.8"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have an Azure SQL database named **SalesDB**. SalesDB contains a contained database user named **report_user** that authenticates with a password. A reporting application uses report_user.

    You are connected to SalesDB as a member of the db_owner role. You need to verify which tables report_user can read. The solution must not change the credentials of report_user and must run in your current session.

    What should you do?
  fr: |
    Vous disposez d'une base de données Azure SQL nommée **SalesDB**. SalesDB contient un utilisateur de base de données autonome nommé **report_user** qui s'authentifie avec un mot de passe. Une application de création de rapports utilise report_user.

    Vous êtes connecté à SalesDB en tant que membre du rôle db_owner. Vous devez vérifier les tables que report_user peut lire. La solution ne doit pas modifier les informations d'identification de report_user et doit s'exécuter dans votre session actuelle.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Run EXECUTE AS LOGIN = 'report_user', query the tables, and then run REVERT.", fr: "Exécuter EXECUTE AS LOGIN = 'report_user', interroger les tables, puis exécuter REVERT." } }
    - { id: b, text: { en: "Run SELECT * FROM sys.fn_my_permissions(NULL, 'DATABASE') and review the result.", fr: "Exécuter SELECT * FROM sys.fn_my_permissions(NULL, 'DATABASE') et examiner le résultat." } }
    - { id: c, text: { en: "Run EXECUTE AS USER = 'report_user', query the tables, and then run REVERT.", fr: "Exécuter EXECUTE AS USER = 'report_user', interroger les tables, puis exécuter REVERT." } }
    - { id: d, text: { en: "Run ALTER USER report_user WITH PASSWORD, and then sign in as report_user.", fr: "Exécuter ALTER USER report_user WITH PASSWORD, puis se connecter en tant que report_user." } }
answer: { optionId: c }
explanation:
  correct:
    en: "EXECUTE AS USER switches the execution context of the session to a database user, so every query runs with the permissions of report_user. The caller needs IMPERSONATE on the user, which db_owner members have. REVERT returns the session to your own context."
    fr: "EXECUTE AS USER bascule le contexte d'exécution de la session vers un utilisateur de base de données : chaque requête s'exécute avec les autorisations de report_user. L'appelant doit disposer de IMPERSONATE sur l'utilisateur, ce qui est le cas des membres de db_owner. REVERT rend à la session votre propre contexte."
  options:
    a: { en: "The LOGIN option of EXECUTE AS is not available in Azure SQL Database or in a contained database, and report_user has no login.", fr: "L'option LOGIN d'EXECUTE AS n'est pas disponible dans Azure SQL Database ni dans une base de données autonome, et report_user n'a pas de connexion." }
    b: { en: "sys.fn_my_permissions returns the permissions of the current execution context, which is your own, not those of report_user.", fr: "sys.fn_my_permissions renvoie les autorisations du contexte d'exécution actuel, c'est-à-dire les vôtres, pas celles de report_user." }
    d: { en: "Resetting the password changes the credentials of report_user and breaks the reporting application.", fr: "Réinitialiser le mot de passe modifie les informations d'identification de report_user et casse l'application de création de rapports." }
references:
  - title: EXECUTE AS (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/statements/execute-as-transact-sql
