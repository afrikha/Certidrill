id: dp300-2b-tde-sqlvm-files-backups
objective: "2.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have an Azure virtual machine named **VM1** that runs SQL Server 2022. VM1 hosts a database named **Claims**.

    You need to ensure that the data files, the transaction log files, and the backup files of Claims are unreadable if they are copied to another server. The solution must not require any change to the applications that query Claims.

    What should you implement?
  fr: |
    Vous disposez d'une machine virtuelle Azure nommée **VM1** qui exécute SQL Server 2022. VM1 héberge une base de données nommée **Claims**.

    Vous devez vous assurer que les fichiers de données, les fichiers journaux des transactions et les fichiers de sauvegarde de Claims sont illisibles s'ils sont copiés vers un autre serveur. La solution ne doit nécessiter aucune modification des applications qui interrogent Claims.

    Que devez-vous implémenter ?
body:
  options:
    - { id: a, text: { en: "Always Encrypted on the sensitive columns", fr: "Always Encrypted sur les colonnes sensibles" } }
    - { id: b, text: { en: "Dynamic data masking on the sensitive columns", fr: "Le masquage dynamique des données sur les colonnes sensibles" } }
    - { id: c, text: { en: "Column-level encryption with ENCRYPTBYKEY", fr: "Le chiffrement au niveau des colonnes avec ENCRYPTBYKEY" } }
    - { id: d, text: { en: "Transparent data encryption (TDE) on the database", fr: "Le chiffrement transparent des données (TDE) sur la base de données" } }
answer: { optionId: d }
explanation:
  correct:
    en: "TDE encrypts the data and log files at the page level in real time, and the backups of a TDE-enabled database are encrypted with the same database encryption key. Encryption and decryption happen in the engine, so applications need no change. Without the protecting certificate, the files cannot be opened on another server."
    fr: "TDE chiffre les fichiers de données et les fichiers journaux au niveau des pages, en temps réel, et les sauvegardes d'une base protégée par TDE sont chiffrées avec la même clé de chiffrement de base de données. Le chiffrement et le déchiffrement ont lieu dans le moteur : les applications n'ont pas à être modifiées. Sans le certificat de protection, les fichiers ne peuvent pas être ouverts sur un autre serveur."
  options:
    a: { en: "Always Encrypted protects only the selected columns and requires client driver configuration in the applications.", fr: "Always Encrypted ne protège que les colonnes choisies et exige une configuration du pilote client dans les applications." }
    b: { en: "Dynamic data masking hides values in query results only; the files and backups still contain the data in plaintext.", fr: "Le masquage dynamique des données masque les valeurs uniquement dans les résultats des requêtes ; les fichiers et les sauvegardes contiennent toujours les données en clair." }
    c: { en: "Column-level encryption requires the queries to call ENCRYPTBYKEY and DECRYPTBYKEY, and it protects only the encrypted columns.", fr: "Le chiffrement au niveau des colonnes exige que les requêtes appellent ENCRYPTBYKEY et DECRYPTBYKEY, et il ne protège que les colonnes chiffrées." }
references:
  - title: Transparent data encryption (TDE)
    url: https://learn.microsoft.com/en-us/sql/relational-databases/security/encryption/transparent-data-encryption
