id: dp300-2a-sqladmin-entra-user
objective: "2.1.7"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have an Azure SQL Database logical server named **sql-wingtip**. The SQL server admin login is **wtadmin**, and the Microsoft Entra group **DBA-Group** is the Microsoft Entra admin.

    You connect to a database named **DB1** as wtadmin and run CREATE USER [maria@wingtiptoys.com] FROM EXTERNAL PROVIDER. The statement fails.

    You need to create the user. What should you do?
  fr: |
    Vous disposez d'un serveur logique Azure SQL Database nommé **sql-wingtip**. La connexion d'administrateur SQL du serveur est **wtadmin**, et le groupe Microsoft Entra **DBA-Group** est l'administrateur Microsoft Entra.

    Vous vous connectez à une base de données nommée **DB1** en tant que wtadmin et exécutez CREATE USER [maria@wingtiptoys.com] FROM EXTERNAL PROVIDER. L'instruction échoue.

    Vous devez créer l'utilisateur. Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Grant the ALTER ANY USER permission in DB1 to wtadmin, and run the statement again.", fr: "Accorder l'autorisation ALTER ANY USER dans DB1 à wtadmin, puis exécuter à nouveau l'instruction." } }
    - { id: b, text: { en: "Add wtadmin to the ##MS_LoginManager## server role, and run the statement again.", fr: "Ajouter wtadmin au rôle serveur ##MS_LoginManager##, puis exécuter à nouveau l'instruction." } }
    - { id: c, text: { en: "Connect to DB1 with a Microsoft Entra account that is a member of DBA-Group, and run the statement.", fr: "Se connecter à DB1 avec un compte Microsoft Entra membre de DBA-Group, puis exécuter l'instruction." } }
    - { id: d, text: { en: "Assign the Directory Readers role to the server identity, and run the statement again as wtadmin.", fr: "Attribuer le rôle Directory Readers à l'identité du serveur, puis exécuter à nouveau l'instruction en tant que wtadmin." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      The SQL server admin and other SQL logins can't create Microsoft Entra logins or users, whatever their permissions, because the statement resolves the identity on behalf of the signed-in Microsoft Entra principal. A member of the Microsoft Entra admin group has that identity and full permissions in DB1.
    fr: |
      L'administrateur SQL du serveur et les autres connexions SQL ne peuvent pas créer de connexions ni d'utilisateurs Microsoft Entra, quelles que soient leurs autorisations, car l'instruction résout l'identité pour le compte du principal Microsoft Entra connecté. Un membre du groupe administrateur Microsoft Entra dispose de cette identité et de toutes les autorisations dans DB1.
  options:
    a:
      en: wtadmin already maps to dbo; the problem is the authentication type, not a missing permission.
      fr: wtadmin est déjà mappé sur dbo ; le problème est le type d'authentification, pas une autorisation manquante.
    b:
      en: The role is about logins, and a SQL login still can't create Microsoft Entra principals.
      fr: Le rôle concerne les connexions, et une connexion SQL ne peut toujours pas créer de principaux Microsoft Entra.
    d:
      en: Directory permissions for the server identity don't change the rule that a SQL login can't create Microsoft Entra principals.
      fr: Des autorisations d'annuaire pour l'identité du serveur ne changent pas la règle selon laquelle une connexion SQL ne peut pas créer de principaux Microsoft Entra.
references:
  - title: Microsoft Entra server principals
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/authentication-azure-ad-logins
