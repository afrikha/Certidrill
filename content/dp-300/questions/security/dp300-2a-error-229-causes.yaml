id: dp300-2a-error-229-causes
objective: "2.1.7"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    You have an Azure SQL database named **DB1**. A Microsoft Entra user named **Omar** accesses DB1 through the group **BI-Users**, whose database user is a member of **db_datareader**.

    Omar connects to DB1 successfully. When he runs SELECT * FROM Sales.Invoices, he receives error 229: "The SELECT permission was denied on the object 'Invoices'". Other tables can be queried.

    Which two issues could cause this error?

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'une base de données Azure SQL nommée **DB1**. Un utilisateur Microsoft Entra nommé **Omar** accède à DB1 par le groupe **BI-Users**, dont l'utilisateur de base de données est membre de **db_datareader**.

    Omar se connecte à DB1 sans problème. Lorsqu'il exécute SELECT * FROM Sales.Invoices, il reçoit l'erreur 229 : « The SELECT permission was denied on the object 'Invoices' ». Les autres tables peuvent être interrogées.

    Quels sont les deux problèmes qui peuvent provoquer cette erreur ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "A DENY SELECT on Sales.Invoices is granted to a database role whose members include BI-Users.", fr: "Un DENY SELECT sur Sales.Invoices est accordé à un rôle de base de données dont BI-Users est membre." } }
    - { id: b, text: { en: "A DENY CONNECT on DB1 is granted to the database user of BI-Users.", fr: "Un DENY CONNECT sur DB1 est accordé à l'utilisateur de base de données de BI-Users." } }
    - { id: c, text: { en: "The database user of BI-Users has no default schema.", fr: "L'utilisateur de base de données de BI-Users n'a pas de schéma par défaut." } }
    - { id: d, text: { en: "Microsoft Entra-only authentication is enabled on the server.", fr: "L'authentification Microsoft Entra uniquement est activée sur le serveur." } }
    - { id: e, text: { en: "A DENY SELECT on Sales.Invoices is granted to the database user of another group that Omar belongs to.", fr: "Un DENY SELECT sur Sales.Invoices est accordé à l'utilisateur de base de données d'un autre groupe dont Omar est membre." } }
answer: { optionIds: [ a, e ] }
explanation:
  correct:
    en: |
      Error 229 means that Omar is authenticated but not authorized on the object. Permissions add up across all the groups and roles of a user, and a DENY from any of them overrides the SELECT that db_datareader grants. A DENY on the table, received through a role of BI-Users or through another group, produces exactly this error on one table only.
    fr: |
      L'erreur 229 signifie qu'Omar est authentifié mais pas autorisé sur l'objet. Les autorisations s'additionnent entre tous les groupes et rôles d'un utilisateur, et un DENY venant de l'un d'eux l'emporte sur le SELECT accordé par db_datareader. Un DENY sur la table, reçu par un rôle de BI-Users ou par un autre groupe, produit exactement cette erreur sur une seule table.
  options:
    b: { en: "A DENY CONNECT would prevent Omar from connecting to DB1 at all, but he connected successfully and can query other tables.", fr: "Un DENY CONNECT empêcherait Omar de se connecter à DB1, or il s'est connecté et peut interroger d'autres tables." }
    c: { en: "A missing default schema affects unqualified object creation; the query uses a schema-qualified name.", fr: "L'absence de schéma par défaut affecte la création d'objets non qualifiés ; la requête utilise un nom qualifié par le schéma." }
    d: { en: "Omar uses a Microsoft Entra account, which Microsoft Entra-only authentication allows.", fr: "Omar utilise un compte Microsoft Entra, ce que l'authentification Microsoft Entra uniquement autorise." }
references:
  - title: DENY Object Permissions (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/statements/deny-object-permissions-transact-sql
  - title: Authorize database access to Azure SQL Database
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/logins-create-manage
