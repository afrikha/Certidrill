id: dp300-2b-fw-allow-azure-services
objective: "2.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have an Azure SQL Database logical server named **sql-wingtip**. The Networking page of sql-wingtip shows that **Allow Azure services and resources to access this server** is selected. A security review flags this setting.

    You run SELECT * FROM sys.firewall_rules in master and see a rule named AllowAllWindowsAzureIps with a start and end IP address of 0.0.0.0.

    Which connections does this rule allow through the firewall?
  fr: |
    Vous disposez d'un serveur logique Azure SQL Database nommé **sql-wingtip**. La page Networking de sql-wingtip indique que l'option **Allow Azure services and resources to access this server** est sélectionnée. Une revue de sécurité signale ce paramètre.

    Vous exécutez SELECT * FROM sys.firewall_rules dans master et voyez une règle nommée AllowAllWindowsAzureIps dont les adresses IP de début et de fin sont 0.0.0.0.

    Quelles connexions cette règle autorise-t-elle à travers le pare-feu ?
body:
  options:
    - { id: a, text: { en: "Connections from Azure services in subscriptions of the same Microsoft Entra tenant only", fr: "Les connexions depuis les services Azure des abonnements du même locataire Microsoft Entra uniquement" } }
    - { id: b, text: { en: "Connections from Azure virtual networks that have the Microsoft.Sql service endpoint only", fr: "Les connexions depuis les réseaux virtuels Azure dotés du point de terminaison de service Microsoft.Sql uniquement" } }
    - { id: c, text: { en: "Connections from any Azure service, including services in other customers' subscriptions", fr: "Les connexions depuis tout service Azure, y compris les services des abonnements d'autres clients" } }
    - { id: d, text: { en: "Connections from Azure services in the subscription that contains sql-wingtip only", fr: "Les connexions depuis les services Azure de l'abonnement qui contient sql-wingtip uniquement" } }
answer: { optionId: c }
explanation:
  correct:
    en: "The setting creates the server-level rule AllowAllWindowsAzureIps (0.0.0.0 to 0.0.0.0), which allows connections from all Azure IP addresses, including services running in other customers' subscriptions. Microsoft recommends replacing it with virtual network service endpoints or private endpoints when you need to limit access to your own resources."
    fr: "Ce paramètre crée la règle au niveau du serveur AllowAllWindowsAzureIps (0.0.0.0 à 0.0.0.0), qui autorise les connexions depuis toutes les adresses IP d'Azure, y compris les services exécutés dans les abonnements d'autres clients. Microsoft recommande de la remplacer par des points de terminaison de service de réseau virtuel ou des points de terminaison privés lorsque vous devez limiter l'accès à vos propres ressources."
  options:
    a: { en: "The rule is not scoped to a tenant: any Azure IP address matches it.", fr: "La règle n'est pas limitée à un locataire : toute adresse IP d'Azure y correspond." }
    b: { en: "Service endpoint traffic is allowed by virtual network rules, not by the AllowAllWindowsAzureIps rule.", fr: "Le trafic des points de terminaison de service est autorisé par des règles de réseau virtuel, pas par la règle AllowAllWindowsAzureIps." }
    d: { en: "The rule is not scoped to a subscription: services of other customers are allowed too.", fr: "La règle n'est pas limitée à un abonnement : les services d'autres clients sont aussi autorisés." }
references:
  - title: Azure SQL Database IP firewall rules
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/firewall-configure
