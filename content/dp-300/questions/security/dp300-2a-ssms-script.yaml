id: dp300-2a-ssms-script
objective: "2.1.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You use SQL Server Management Studio to prepare permission changes for an Azure SQL database named **DB1** in the Database User dialog box. Your change process requires the exact Transact-SQL of every permission change to be reviewed before it is applied.

    You need to obtain the Transact-SQL that corresponds to the changes you selected in the dialog box, without applying them.

    What should you use?
  fr: |
    Vous utilisez SQL Server Management Studio pour préparer des modifications d'autorisations sur une base de données Azure SQL nommée **DB1** dans la boîte de dialogue Database User. Votre processus de changement exige que le Transact-SQL exact de chaque modification d'autorisations soit revu avant d'être appliqué.

    Vous devez obtenir le Transact-SQL correspondant aux modifications sélectionnées dans la boîte de dialogue, sans les appliquer.

    Que devez-vous utiliser ?
body:
  options:
    - { id: a, text: Activity Monitor }
    - { id: b, text: Database Engine Tuning Advisor }
    - { id: c, text: { en: "The Script button of the dialog box", fr: "Le bouton Script de la boîte de dialogue" } }
    - { id: d, text: { en: "The Query Store reports of DB1", fr: "Les rapports du Magasin des requêtes de DB1" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Every SSMS dialog box that changes security settings has a Script button that writes the equivalent Transact-SQL to a new query window, the clipboard or a file. You can then cancel the dialog box and submit the script for review.
    fr: |
      Chaque boîte de dialogue SSMS qui modifie des paramètres de sécurité dispose d'un bouton Script qui écrit le Transact-SQL équivalent dans une nouvelle fenêtre de requête, le Presse-papiers ou un fichier. Vous pouvez ensuite annuler la boîte de dialogue et soumettre le script à la revue.
  options:
    a:
      en: Activity Monitor shows current processes, waits and expensive queries; it doesn't generate scripts.
      fr: Le Moniteur d'activité affiche les processus, attentes et requêtes coûteuses en cours ; il ne génère pas de scripts.
    b:
      en: Database Engine Tuning Advisor recommends indexes and partitions from a workload.
      fr: Database Engine Tuning Advisor recommande des index et des partitions à partir d'une charge de travail.
    d:
      en: Query Store records query plans and runtime statistics, not pending permission changes.
      fr: Le Magasin des requêtes enregistre les plans et statistiques d'exécution des requêtes, pas des modifications d'autorisations en attente.
references:
  - title: Create a database user
    url: https://learn.microsoft.com/en-us/sql/relational-databases/security/authentication-access/create-a-database-user
