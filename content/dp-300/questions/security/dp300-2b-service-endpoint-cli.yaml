id: dp300-2b-service-endpoint-cli
objective: "2.2.6"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    You have an Azure SQL Database logical server named **sql-wingtip** in a resource group named **RG1**. Virtual machines in a subnet named **snet-web** of a virtual network named **vnet-web** must connect to sql-wingtip. vnet-web is in the same region as sql-wingtip. The server must keep its public endpoint, and no private endpoint must be created.

    How should you complete the Azure CLI commands? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un serveur logique Azure SQL Database nommé **sql-wingtip** dans un groupe de ressources nommé **RG1**. Des machines virtuelles d'un sous-réseau nommé **snet-web** d'un réseau virtuel nommé **vnet-web** doivent se connecter à sql-wingtip. vnet-web se trouve dans la même région que sql-wingtip. Le serveur doit conserver son point de terminaison public, et aucun point de terminaison privé ne doit être créé.

    Comment devez-vous compléter les commandes Azure CLI ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: bash
  template: |
    az network vnet subnet update --resource-group RG1 \
      --vnet-name vnet-web --name snet-web \
      --service-endpoints [[se]]

    az sql server [[cmd]] create --resource-group RG1 \
      --server sql-wingtip --name allow-snet-web \
      --vnet-name vnet-web --subnet snet-web
  slots:
    - id: se
      options:
        - { id: sql, text: Microsoft.Sql }
        - { id: storage, text: Microsoft.Storage }
        - { id: kv, text: Microsoft.KeyVault }
    - id: cmd
      options:
        - { id: fw, text: firewall-rule }
        - { id: vnet, text: vnet-rule }
        - { id: conn, text: conn-policy }
answer:
  values: { se: sql, cmd: vnet }
explanation:
  correct:
    en: "A virtual network rule references a subnet that has a service endpoint, so the subnet is first tagged with the Microsoft.Sql endpoint type. The rule itself is added to the logical server with az sql server vnet-rule create, and it applies to all the databases of the server."
    fr: "Une règle de réseau virtuel référence un sous-réseau doté d'un point de terminaison de service : le sous-réseau est d'abord marqué avec le type de point de terminaison Microsoft.Sql. La règle elle-même est ajoutée au serveur logique avec az sql server vnet-rule create, et elle s'applique à toutes les bases du serveur."
  options:
    storage: { en: "Microsoft.Storage is the service endpoint for Azure Storage, not for Azure SQL Database.", fr: "Microsoft.Storage est le point de terminaison de service de Stockage Azure, pas d'Azure SQL Database." }
    kv: { en: "Microsoft.KeyVault is the service endpoint for Azure Key Vault.", fr: "Microsoft.KeyVault est le point de terminaison de service d'Azure Key Vault." }
    fw: { en: "firewall-rule creates an IP firewall rule with start and end IP addresses; it does not accept a subnet.", fr: "firewall-rule crée une règle de pare-feu IP avec des adresses IP de début et de fin ; il n'accepte pas de sous-réseau." }
    conn: { en: "conn-policy manages the connection policy (Default, Redirect, Proxy) of the server, not access from a subnet.", fr: "conn-policy gère la stratégie de connexion (Default, Redirect, Proxy) du serveur, pas l'accès depuis un sous-réseau." }
references:
  - title: Use virtual network service endpoints and rules for servers in Azure SQL Database
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/vnet-service-endpoint-rule-overview
