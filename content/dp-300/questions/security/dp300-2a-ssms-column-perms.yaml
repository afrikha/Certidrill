id: dp300-2a-ssms-column-perms
objective: "2.1.5"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    You have an Azure SQL database named **DB1** that contains a table named **dbo.Products**. A database user named **Kai** has no permission on the table.

    You need to allow Kai to read only the **ProductID** and **ListPrice** columns of dbo.Products by using SQL Server Management Studio.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Vous disposez d'une base de données Azure SQL nommée **DB1** qui contient une table nommée **dbo.Products**. Un utilisateur de base de données nommé **Kai** n'a aucune autorisation sur la table.

    Vous devez permettre à Kai de lire uniquement les colonnes **ProductID** et **ListPrice** de dbo.Products à l'aide de SQL Server Management Studio.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: dbprops, text: { en: "Right-click DB1, select Properties, and open the Permissions page.", fr: "Cliquer avec le bouton droit sur DB1, sélectionner Properties et ouvrir la page Permissions." } }
    - { id: open, text: { en: "In Object Explorer, right-click dbo.Products and select Properties.", fr: "Dans l'Explorateur d'objets, cliquer avec le bouton droit sur dbo.Products et sélectionner Properties." } }
    - { id: perm, text: { en: "On the Permissions page, select Search and add Kai.", fr: "Dans la page Permissions, sélectionner Search et ajouter Kai." } }
    - { id: member, text: { en: "On the Membership page of Kai's properties, select db_datareader.", fr: "Dans la page Membership des propriétés de Kai, sélectionner db_datareader." } }
    - { id: col, text: { en: "Select the Select permission for Kai, and then select Column Permissions.", fr: "Sélectionner l'autorisation Select pour Kai, puis sélectionner Column Permissions." } }
    - { id: grant, text: { en: "Select Grant for ProductID and ListPrice, and then select OK in each dialog box.", fr: "Sélectionner Grant pour ProductID et ListPrice, puis sélectionner OK dans chaque boîte de dialogue." } }
answer:
  sequence: [ open, perm, col, grant ]
explanation:
  correct:
    en: |
      Object permissions are set from the object's own properties: open the table properties, add the principal on the Permissions page, then use Column Permissions on the Select permission to grant it on the two columns only. The result is the same as GRANT SELECT (ProductID, ListPrice) ON dbo.Products TO Kai.
    fr: |
      Les autorisations d'objet se définissent depuis les propriétés de l'objet : ouvrez les propriétés de la table, ajoutez le principal dans la page Permissions, puis utilisez Column Permissions sur l'autorisation Select pour l'accorder sur les deux colonnes uniquement. Le résultat équivaut à GRANT SELECT (ProductID, ListPrice) ON dbo.Products TO Kai.
  options:
    dbprops: { en: "The database Permissions page grants database-wide permissions, not column permissions on one table.", fr: "La page Permissions de la base accorde des autorisations sur toute la base, pas des autorisations de colonnes sur une table." }
    member: { en: "db_datareader grants SELECT on every table and column of the database.", fr: "db_datareader accorde SELECT sur toutes les tables et colonnes de la base." }
references:
  - title: Grant a Permission to a Principal
    url: https://learn.microsoft.com/en-us/sql/relational-databases/security/authentication-access/grant-a-permission-to-a-principal
