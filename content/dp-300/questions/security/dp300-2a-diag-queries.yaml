id: dp300-2a-diag-queries
objective: "2.1.7"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    You are troubleshooting access problems on an Azure SQL Database logical server that hosts a database named **DB1**. You need to answer three questions:

    1. Is the SQL login **app_login** disabled? (run in master)
    2. Is Microsoft Entra-only authentication enabled on the server?
    3. Which permissions does your own connection have on DB1? (run in DB1)

    How should you complete the Transact-SQL queries? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous diagnostiquez des problèmes d'accès sur un serveur logique Azure SQL Database qui héberge une base de données nommée **DB1**. Vous devez répondre à trois questions :

    1. La connexion SQL **app_login** est-elle désactivée ? (exécutée dans master)
    2. L'authentification Microsoft Entra uniquement est-elle activée sur le serveur ?
    3. Quelles autorisations votre propre connexion a-t-elle sur DB1 ? (exécutée dans DB1)

    Comment devez-vous compléter les requêtes Transact-SQL ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: sql
  template: |
    -- 1
    SELECT name, is_disabled FROM [[v]] WHERE name = 'app_login';

    -- 2
    SELECT SERVERPROPERTY('[[p]]');

    -- 3
    SELECT * FROM [[f]](NULL, 'DATABASE');
  slots:
    - id: v
      options:
        - { id: princ, text: sys.database_principals }
        - { id: logins, text: sys.sql_logins }
        - { id: sessions, text: sys.dm_exec_sessions }
        - { id: members, text: sys.server_role_members }
    - id: p
      options:
        - { id: integ, text: IsIntegratedSecurityOnly }
        - { id: single, text: IsSingleUser }
        - { id: ext, text: IsExternalAuthenticationOnly }
        - { id: edition, text: EngineEdition }
    - id: f
      options:
        - { id: builtin, text: sys.fn_builtin_permissions }
        - { id: hasperms, text: HAS_PERMS_BY_NAME }
        - { id: rolemember, text: IS_ROLEMEMBER }
        - { id: my, text: sys.fn_my_permissions }
answer:
  values: { v: logins, p: ext, f: my }
explanation:
  correct:
    en: |
      sys.sql_logins lists the SQL logins with their is_disabled flag; a disabled login causes error 18456. SERVERPROPERTY('IsExternalAuthenticationOnly') returns 1 when Microsoft Entra-only authentication is enabled. sys.fn_my_permissions(NULL, 'DATABASE') returns the effective permissions of the current connection on the database.
    fr: |
      sys.sql_logins liste les connexions SQL avec leur indicateur is_disabled ; une connexion désactivée provoque l'erreur 18456. SERVERPROPERTY('IsExternalAuthenticationOnly') renvoie 1 lorsque l'authentification Microsoft Entra uniquement est activée. sys.fn_my_permissions(NULL, 'DATABASE') renvoie les autorisations effectives de la connexion actuelle sur la base.
  options:
    princ: { en: "sys.database_principals lists database users and roles and has no is_disabled column for logins.", fr: "sys.database_principals liste les utilisateurs et rôles de la base et n'a pas de colonne is_disabled pour les connexions." }
    integ: { en: "IsIntegratedSecurityOnly reports Windows Authentication mode on SQL Server, not Microsoft Entra-only authentication.", fr: "IsIntegratedSecurityOnly indique le mode d'authentification Windows sur SQL Server, pas l'authentification Microsoft Entra uniquement." }
    hasperms: { en: "HAS_PERMS_BY_NAME checks one named permission and returns 1 or 0, not the list of permissions.", fr: "HAS_PERMS_BY_NAME vérifie une autorisation nommée et renvoie 1 ou 0, pas la liste des autorisations." }
    builtin: { en: "sys.fn_builtin_permissions lists the permissions that exist in the engine, not the ones you hold.", fr: "sys.fn_builtin_permissions liste les autorisations qui existent dans le moteur, pas celles que vous détenez." }
references:
  - title: Troubleshoot Common Connection Issues - Azure SQL & SQL database in Fabric
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/troubleshoot-common-errors-issues
  - title: Microsoft Entra-only authentication with Azure SQL
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/authentication-azure-ad-only-authentication
