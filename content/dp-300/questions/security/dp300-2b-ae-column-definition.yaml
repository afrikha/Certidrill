id: dp300-2b-ae-column-definition
objective: "2.2.4"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    You have an Azure SQL database named **Fleet**. The column master key CMK1 and the column encryption key CEK1 are already provisioned for Always Encrypted. The default collation of Fleet is SQL_Latin1_General_CP1_CI_AS.

    You need to create a table that stores driver license numbers in an encrypted column. Applications must be able to find a driver by using WHERE LicenseNumber = @license. Secure enclaves are not used.

    How should you complete the Transact-SQL statement? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'une base de données Azure SQL nommée **Fleet**. La clé principale de colonne CMK1 et la clé de chiffrement de colonne CEK1 sont déjà provisionnées pour Always Encrypted. Le classement par défaut de Fleet est SQL_Latin1_General_CP1_CI_AS.

    Vous devez créer une table qui stocke des numéros de permis de conduire dans une colonne chiffrée. Les applications doivent pouvoir trouver un conducteur avec WHERE LicenseNumber = @license. Les enclaves sécurisées ne sont pas utilisées.

    Comment devez-vous compléter l'instruction Transact-SQL ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: sql
  template: |
    CREATE TABLE dbo.Driver (
      DriverID int IDENTITY(1,1) PRIMARY KEY,
      LicenseNumber char(15) COLLATE [[coll]]
        ENCRYPTED WITH (COLUMN_ENCRYPTION_KEY = CEK1,
          ENCRYPTION_TYPE = [[type]],
          ALGORITHM = '[[alg]]') NOT NULL
    );
  slots:
    - id: coll
      options:
        - { id: ci, text: SQL_Latin1_General_CP1_CI_AS }
        - { id: bin2, text: Latin1_General_BIN2 }
        - { id: cs, text: Latin1_General_CS_AS }
    - id: type
      options:
        - { id: rand, text: RANDOMIZED }
        - { id: det, text: DETERMINISTIC }
    - id: alg
      options:
        - { id: aead, text: AEAD_AES_256_CBC_HMAC_SHA_256 }
        - { id: aes, text: AES_256 }
        - { id: rsa, text: RSA_OAEP }
answer:
  values: { coll: bin2, type: det, alg: aead }
explanation:
  correct:
    en: "Encrypted string columns must use a _BIN2 collation. DETERMINISTIC encryption is needed for equality lookups without an enclave. AEAD_AES_256_CBC_HMAC_SHA_256 is the algorithm that Always Encrypted uses to encrypt column data with the column encryption key."
    fr: "Les colonnes de chaînes chiffrées doivent utiliser un classement _BIN2. Le chiffrement DETERMINISTIC est nécessaire pour les recherches d'égalité sans enclave. AEAD_AES_256_CBC_HMAC_SHA_256 est l'algorithme qu'Always Encrypted utilise pour chiffrer les données de colonne avec la clé de chiffrement de colonne."
  options:
    ci: { en: "A case-insensitive collation is not supported on an encrypted string column; a _BIN2 collation is required.", fr: "Un classement insensible à la casse n'est pas pris en charge sur une colonne de chaîne chiffrée ; un classement _BIN2 est requis." }
    cs: { en: "A case-sensitive collation is still not a binary _BIN2 collation, which encrypted string columns require.", fr: "Un classement sensible à la casse n'est toujours pas un classement binaire _BIN2, qu'exigent les colonnes de chaîne chiffrées." }
    rand: { en: "Randomized encryption does not support equality searches without a secure enclave.", fr: "Le chiffrement aléatoire ne prend pas en charge les recherches d'égalité sans enclave sécurisée." }
    aes: { en: "AES_256 is an algorithm name for symmetric keys and TDE, not for Always Encrypted column definitions.", fr: "AES_256 est un nom d'algorithme pour les clés symétriques et TDE, pas pour les définitions de colonnes Always Encrypted." }
    rsa: { en: "RSA_OAEP is the algorithm used by the column master key to encrypt the column encryption key, not to encrypt column data.", fr: "RSA_OAEP est l'algorithme utilisé par la clé principale de colonne pour chiffrer la clé de chiffrement de colonne, pas pour chiffrer les données de colonne." }
references:
  - title: Always Encrypted
    url: https://learn.microsoft.com/en-us/sql/relational-databases/security/encryption/always-encrypted-database-engine
