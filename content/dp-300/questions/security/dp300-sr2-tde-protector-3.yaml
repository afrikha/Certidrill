id: dp300-sr2-tde-protector-3
objective: "2.2.1"
type: series_yesno
series: dp300-sr2-tde-protector
seriesOrder: 3
difficulty: 1
status: draft
stem:
  en: |
    You use a 3,072-bit RSA key with the Key Vault Secrets User role.
  fr: |
    Vous utilisez une clé RSA de 3 072 bits avec le rôle Key Vault Secrets User.
body:
  solution:
    en: |
      You create a **3,072-bit RSA** key in kv-wg1. You assign the **Key Vault Secrets User** role on kv-wg1 to the managed identity of sql-wg1. You then set the key as the TDE protector of sql-wg1.
    fr: |
      Vous créez une clé **RSA de 3 072 bits** dans kv-wg1. Vous attribuez le rôle **Key Vault Secrets User** sur kv-wg1 à l'identité managée de sql-wg1. Vous définissez ensuite la clé comme protecteur TDE de sql-wg1.
answer: { value: false }
explanation:
  correct:
    en: |
      Key Vault Secrets User grants read access to secrets, not the get, wrap key and unwrap key operations on keys that TDE needs. Without those key permissions, sql-wg1 cannot use the key, so it cannot become the TDE protector.
    fr: |
      Key Vault Secrets User accorde la lecture des secrets, pas les opérations get, wrap key et unwrap key sur les clés dont le TDE a besoin. Sans ces autorisations sur la clé, sql-wg1 ne peut pas utiliser la clé, qui ne peut donc pas devenir le protecteur TDE.
references:
  - title: "Customer-Managed Transparent Data Encryption (TDE), Azure SQL Database & Azure SQL Managed Instance"
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/transparent-data-encryption-byok-overview
