id: dp300-cs4b-private-access
objective: "2.2.6"
type: single
caseStudy: dp300-cs4b-relecloud
difficulty: 1
status: draft
stem:
  en: |
    You need to meet the network requirement.

    What should you do?
  fr: |
    Vous devez satisfaire l'exigence réseau.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Add a Microsoft.Sql service endpoint to snet-apps, create a virtual network rule for snet-apps, and delete the IP firewall rules.", fr: "Ajouter un point de terminaison de service Microsoft.Sql à snet-apps, créer une règle de réseau virtuel pour snet-apps et supprimer les règles de pare-feu IP." }
    - id: b
      text: { en: "Create a private endpoint for sql-rc-prod in vnet-rc that is integrated with a private DNS zone, and select Deny public network access.", fr: "Créer un point de terminaison privé pour sql-rc-prod dans vnet-rc, intégré à une zone DNS privée, et sélectionner Refuser l'accès au réseau public." }
    - id: c
      text: { en: "Create a private endpoint for sql-rc-prod in vnet-rc that is integrated with a private DNS zone, and delete the IP firewall rules.", fr: "Créer un point de terminaison privé pour sql-rc-prod dans vnet-rc, intégré à une zone DNS privée, et supprimer les règles de pare-feu IP." }
    - id: d
      text: { en: "Create a private endpoint for sql-rc-prod in vnet-rc, and change the connection string to the private IP address of the endpoint.", fr: "Créer un point de terminaison privé pour sql-rc-prod dans vnet-rc et remplacer la chaîne de connexion par l'adresse IP privée du point de terminaison." }
answer:
  optionId: b
explanation:
  correct:
    en: |
      A private endpoint gives sql-rc-prod a private IP address in vnet-rc, and the private DNS zone makes `sql-rc-prod.database.windows.net` resolve to that address, so the connection strings don't change. Adding a private endpoint doesn't block public routing: Deny public network access must be selected, and it then rejects public connections whatever firewall rules exist or are added later.
    fr: |
      Un point de terminaison privé donne à sql-rc-prod une adresse IP privée dans vnet-rc, et la zone DNS privée fait résoudre `sql-rc-prod.database.windows.net` vers cette adresse : les chaînes de connexion ne changent pas. L'ajout d'un point de terminaison privé ne bloque pas le routage public : il faut sélectionner Refuser l'accès au réseau public, qui rejette alors les connexions publiques quelles que soient les règles de pare-feu existantes ou ajoutées plus tard.
  options:
    a: { en: "With a service endpoint, the application still connects to the public endpoint of the server, and any IP firewall rule added later would open it again.", fr: "Avec un point de terminaison de service, l'application se connecte toujours au point de terminaison public du serveur, et toute règle de pare-feu IP ajoutée plus tard le rouvrirait." }
    c: { en: "Deleting the current firewall rules leaves public network access enabled, so a rule added later by mistake would allow public connections.", fr: "Supprimer les règles de pare-feu actuelles laisse l'accès au réseau public activé : une règle ajoutée plus tard par erreur autoriserait des connexions publiques." }
    d: { en: "Connections made directly to the private IP address fail; clients must use the server FQDN, and public access remains enabled.", fr: "Les connexions effectuées directement vers l'adresse IP privée échouent ; les clients doivent utiliser le nom de domaine complet du serveur, et l'accès public reste activé." }
references:
  - title: Azure Private Link - Azure SQL Database
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/private-endpoint-overview
