id: dp300-2b-tde-cmk-purge-protection
objective: "2.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have an Azure SQL Database logical server named **sql-woodgrove** in the West Europe region. sql-woodgrove uses service-managed transparent data encryption (TDE) and has a system-assigned managed identity.

    You plan to use a key in an Azure key vault named **kv-woodgrove** as the TDE protector. kv-woodgrove has the following configuration.

    | Setting | Value |
    | --- | --- |
    | Region | North Europe |
    | Permission model | Azure role-based access control |
    | Soft delete | Enabled, 90 days |
    | Purge protection | Disabled |
    | Key | RSA, 2,048 bits, enabled, no expiration date |

    The managed identity of sql-woodgrove has the Key Vault Crypto Service Encryption User role on kv-woodgrove. When you select the key as the TDE protector, the operation fails.

    What should you do first?
  fr: |
    Vous disposez d'un serveur logique Azure SQL Database nommé **sql-woodgrove** dans la région West Europe. sql-woodgrove utilise le chiffrement transparent des données (TDE) géré par le service et possède une identité managée affectée par le système.

    Vous prévoyez d'utiliser une clé d'un coffre de clés Azure nommé **kv-woodgrove** comme protecteur TDE. kv-woodgrove a la configuration suivante.

    | Paramètre | Valeur |
    | --- | --- |
    | Région | North Europe |
    | Modèle d'autorisation | Contrôle d'accès en fonction du rôle Azure |
    | Suppression réversible | Activée, 90 jours |
    | Protection contre le vidage | Désactivée |
    | Clé | RSA, 2 048 bits, activée, sans date d'expiration |

    L'identité managée de sql-woodgrove dispose du rôle Key Vault Crypto Service Encryption User sur kv-woodgrove. Lorsque vous sélectionnez la clé comme protecteur TDE, l'opération échoue.

    Que devez-vous faire en premier ?
body:
  options:
    - { id: a, text: { en: "Create a new key vault in West Europe and move the key to it.", fr: "Créer un coffre de clés dans West Europe et y déplacer la clé." } }
    - { id: b, text: { en: "Assign the Key Vault Crypto Officer role to the managed identity.", fr: "Attribuer le rôle Key Vault Crypto Officer à l'identité managée." } }
    - { id: c, text: { en: "Enable purge protection on kv-woodgrove.", fr: "Activer la protection contre le vidage sur kv-woodgrove." } }
    - { id: d, text: { en: "Replace the key with an RSA key of 4,096 bits.", fr: "Remplacer la clé par une clé RSA de 4 096 bits." } }
answer: { optionId: c }
explanation:
  correct:
    en: "Customer-managed TDE requires both soft delete and purge protection on the key vault; if they are not enabled, the TDE protector setup fails with an error. Purge protection prevents the key from being permanently deleted during the retention period, which would make the databases unrecoverable."
    fr: "TDE géré par le client exige à la fois la suppression réversible et la protection contre le vidage sur le coffre de clés ; si elles ne sont pas activées, la configuration du protecteur TDE échoue avec une erreur. La protection contre le vidage empêche la suppression définitive de la clé pendant la période de rétention, ce qui rendrait les bases irrécupérables."
  options:
    a: { en: "The server and the key vault do not have to be in the same region.", fr: "Le serveur et le coffre de clés n'ont pas besoin d'être dans la même région." }
    b: { en: "Key Vault Crypto Service Encryption User already grants the key operations that TDE needs; a broader role would not fix the missing purge protection.", fr: "Key Vault Crypto Service Encryption User accorde déjà les opérations de clé dont TDE a besoin ; un rôle plus large ne corrigerait pas l'absence de protection contre le vidage." }
    d: { en: "An RSA TDE protector must be 2,048 or 3,072 bits, so a 4,096-bit key is not supported; the current 2,048-bit key is valid.", fr: "Un protecteur TDE RSA doit faire 2 048 ou 3 072 bits : une clé de 4 096 bits n'est pas prise en charge ; la clé actuelle de 2 048 bits est valide." }
references:
  - title: Azure SQL transparent data encryption with customer-managed key
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/transparent-data-encryption-byok-overview
