id: dp300-2a-error-40615
objective: "2.1.7"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have an Azure SQL Database logical server named **sql-adatum**. Developers in the office connect to the databases without issues.

    A developer who works from home receives error **40615** ("Cannot connect to sql-adatum") when connecting with valid credentials.

    What should you do to allow the developer to connect?
  fr: |
    Vous disposez d'un serveur logique Azure SQL Database nommé **sql-adatum**. Les développeurs du bureau se connectent aux bases de données sans problème.

    Un développeur en télétravail reçoit l'erreur **40615** (« Cannot connect to sql-adatum ») lorsqu'il se connecte avec des identifiants valides.

    Que devez-vous faire pour permettre au développeur de se connecter ?
body:
  options:
    - { id: a, text: { en: "Reset the password of the developer's SQL login.", fr: "Réinitialiser le mot de passe de la connexion SQL du développeur." } }
    - { id: b, text: { en: "Create a database user for the developer in each database.", fr: "Créer un utilisateur de base de données pour le développeur dans chaque base." } }
    - { id: c, text: { en: "Set the developer as the Microsoft Entra admin of sql-adatum.", fr: "Définir le développeur comme administrateur Microsoft Entra de sql-adatum." } }
    - { id: d, text: { en: "Add an IP firewall rule for the developer's public IP address.", fr: "Ajouter une règle de pare-feu IP pour l'adresse IP publique du développeur." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Error 40615 means that the server firewall blocks the client IP address, before any authentication happens. Adding a server-level (or database-level) IP firewall rule for the developer's public address lets the connection reach the authentication step.
    fr: |
      L'erreur 40615 signifie que le pare-feu du serveur bloque l'adresse IP du client, avant toute authentification. Ajouter une règle de pare-feu IP au niveau du serveur (ou de la base) pour l'adresse publique du développeur permet à la connexion d'atteindre l'étape d'authentification.
  options:
    a:
      en: A wrong password returns error 18456 (login failed), not a firewall error.
      fr: Un mot de passe incorrect renvoie l'erreur 18456 (échec de connexion), pas une erreur de pare-feu.
    b:
      en: The credentials work from the office, so the principals exist; the problem is the network origin.
      fr: "Les identifiants fonctionnent depuis le bureau : les principaux existent, le problème vient de l'origine réseau."
    c:
      en: Authentication settings don't bypass the firewall, and the admin role grants far too much.
      fr: Les paramètres d'authentification ne contournent pas le pare-feu, et le rôle d'administrateur accorde beaucoup trop.
references:
  - title: Troubleshoot Common Connection Issues - Azure SQL & SQL database in Fabric
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/troubleshoot-common-errors-issues
