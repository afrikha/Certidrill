id: dp300-2c-classify-audit-report
objective: "2.3.1"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    You have an Azure SQL database named DB1 on a logical server named sql-tailspin. DB1 contains several tables that store passport numbers in columns with different names.

    The compliance team requires a weekly report that lists the users who ran queries whose results included passport numbers. The report must be produced by querying a single data source and must not depend on the column names.

    Which two actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'une base de données Azure SQL nommée DB1 sur un serveur logique nommé sql-tailspin. DB1 contient plusieurs tables qui stockent des numéros de passeport dans des colonnes de noms différents.

    L'équipe de conformité exige un rapport hebdomadaire qui liste les utilisateurs ayant exécuté des requêtes dont les résultats contenaient des numéros de passeport. Le rapport doit être produit en interrogeant une seule source de données et ne doit pas dépendre des noms des colonnes.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Classify the passport columns by using Data Discovery & Classification.", fr: "Classifier les colonnes de passeport à l'aide de la découverte et classification des données." } }
    - { id: b, text: { en: "Apply a dynamic data masking rule to the passport columns.", fr: "Appliquer une règle de masquage dynamique des données aux colonnes de passeport." } }
    - { id: c, text: { en: "Enable change tracking on the tables that contain passport columns.", fr: "Activer le suivi des modifications sur les tables qui contiennent des colonnes de passeport." } }
    - { id: d, text: { en: "Enable auditing on sql-tailspin with a Log Analytics workspace as the destination.", fr: "Activer l'audit sur sql-tailspin avec un espace de travail Log Analytics comme destination." } }
    - { id: e, text: { en: "Run a SQL vulnerability assessment scan on DB1 every week.", fr: "Exécuter chaque semaine une analyse d'évaluation des vulnérabilités SQL sur DB1." } }
answer:
  optionIds: [a, d]
explanation:
  correct:
    en: |
      Auditing records the queries run against DB1 and, for each query, fills the data_sensitivity_information field with the sensitivity labels of the columns that the query returned. That field is populated only for classified columns, so you classify the passport columns with the same information type, then query the single audit destination, such as a Log Analytics workspace, and filter on the label or information type.
    fr: |
      L'audit enregistre les requêtes exécutées sur DB1 et, pour chacune, remplit le champ data_sensitivity_information avec les étiquettes de sensibilité des colonnes renvoyées par la requête. Ce champ n'est rempli que pour les colonnes classifiées : vous classifiez donc les colonnes de passeport avec le même type d'informations, puis vous interrogez la destination d'audit unique, comme un espace de travail Log Analytics, en filtrant sur l'étiquette ou le type d'informations.
  options:
    b: { en: "Masking changes what non-privileged users see but records nothing about who queried the columns.", fr: "Le masquage modifie ce que voient les utilisateurs non privilégiés, mais n'enregistre rien sur les auteurs des requêtes." }
    c: { en: "Change tracking records which rows were modified, not who read them.", fr: "Le suivi des modifications enregistre les lignes modifiées, pas les utilisateurs qui les ont lues." }
    e: { en: "Vulnerability assessment reports configuration risks; it does not log user queries.", fr: "L'évaluation des vulnérabilités signale des risques de configuration ; elle ne journalise pas les requêtes des utilisateurs." }
references:
  - title: Data Discovery & Classification
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/data-discovery-and-classification-overview
  - title: Auditing for Azure SQL Database
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/auditing-overview
