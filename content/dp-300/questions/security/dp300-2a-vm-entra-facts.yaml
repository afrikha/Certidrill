id: dp300-2a-vm-entra-facts
objective: "2.1.2"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    You plan to enable Microsoft Entra authentication for several SQL Server instances that run on Azure virtual machines. The virtual machines are registered with the SQL IaaS Agent extension.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous prévoyez d'activer l'authentification Microsoft Entra pour plusieurs instances SQL Server qui s'exécutent sur des machines virtuelles Azure. Les machines virtuelles sont inscrites auprès de l'extension SQL IaaS Agent.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: After you enable Microsoft Entra authentication on an instance, you can disable it again from the Security Configuration page.
        fr: Après avoir activé l'authentification Microsoft Entra sur une instance, vous pouvez la désactiver à nouveau depuis la page Security Configuration.
    - id: s2
      text:
        en: Instead of the Directory Readers role, the managed identity of the virtual machine can hold the Microsoft Graph application permissions User.Read.All, GroupMember.Read.All and Application.Read.All.
        fr: À la place du rôle Directory Readers, l'identité managée de la machine virtuelle peut détenir les autorisations d'application Microsoft Graph User.Read.All, GroupMember.Read.All et Application.Read.All.
    - id: s3
      text:
        en: An instance that runs SQL Server 2019 must be upgraded to SQL Server 2022 or later before you can enable Microsoft Entra authentication on it.
        fr: Une instance qui exécute SQL Server 2019 doit être mise à niveau vers SQL Server 2022 ou ultérieur avant que vous puissiez y activer l'authentification Microsoft Entra.
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: |
      Once Microsoft Entra authentication is enabled on a SQL Server VM, it can't be disabled; you can only switch to another managed identity. The identity needs either Directory Readers or the three Microsoft Graph application permissions User.Read.All, GroupMember.Read.All and Application.Read.All. The feature requires SQL Server 2022 or later.
    fr: |
      Une fois l'authentification Microsoft Entra activée sur une machine virtuelle SQL Server, elle ne peut pas être désactivée ; vous pouvez seulement changer d'identité managée. L'identité a besoin soit de Directory Readers, soit des trois autorisations d'application Microsoft Graph User.Read.All, GroupMember.Read.All et Application.Read.All. La fonctionnalité exige SQL Server 2022 ou ultérieur.
references:
  - title: Enable Microsoft Entra authentication - SQL Server on Azure VMs
    url: https://learn.microsoft.com/en-us/azure/azure-sql/virtual-machines/windows/configure-azure-ad-authentication-for-sql-vm
