id: dp300-2b-tsql-permission-statements
objective: "2.1.8"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    You manage permissions in an Azure SQL database named **FinanceDB** by using Transact-SQL. FinanceDB contains a custom database role named **finance_read** that has SELECT permission on the Finance schema.

    Which Transact-SQL statement should you use for each task? To answer, drag the appropriate statements to the correct tasks. Each statement may be used once, more than once, or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous gérez les autorisations d'une base de données Azure SQL nommée **FinanceDB** à l'aide de Transact-SQL. FinanceDB contient un rôle de base de données personnalisé nommé **finance_read** qui dispose de l'autorisation SELECT sur le schéma Finance.

    Quelle instruction Transact-SQL devez-vous utiliser pour chaque tâche ? Pour répondre, faites glisser les instructions appropriées vers les tâches correspondantes. Chaque instruction peut être utilisée une fois, plusieurs fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: true
  items:
    - { id: grantopt, text: "GRANT ... WITH GRANT OPTION" }
    - { id: revoke, text: "REVOKE" }
    - { id: deny, text: "DENY" }
    - { id: addmember, text: "ALTER ROLE ... ADD MEMBER" }
    - { id: srvrole, text: "ALTER SERVER ROLE ... ADD MEMBER" }
    - { id: schema, text: "ALTER USER ... WITH DEFAULT_SCHEMA" }
  targets:
    - id: t1
      text: { en: "Give a new analyst the permissions of finance_read", fr: "Donner à un nouvel analyste les autorisations de finance_read" }
    - id: t2
      text: { en: "Prevent members of finance_read from reading the Finance.Payroll table while they keep access to the rest of the schema", fr: "Empêcher les membres de finance_read de lire la table Finance.Payroll tout en conservant l'accès au reste du schéma" }
    - id: t3
      text: { en: "Let a team lead give a permission that she holds to other users", fr: "Permettre à une responsable d'équipe d'accorder à d'autres utilisateurs une autorisation qu'elle détient" }
    - id: t4
      text: { en: "Remove a permission that was granted by mistake, without blocking the same permission inherited from a role", fr: "Supprimer une autorisation accordée par erreur, sans bloquer la même autorisation héritée d'un rôle" }
answer:
  mapping: { t1: addmember, t2: deny, t3: grantopt, t4: revoke }
explanation:
  correct:
    en: "ALTER ROLE ... ADD MEMBER adds a database user to a database role, so the analyst inherits its permissions. DENY on one table overrides the SELECT granted on the schema. WITH GRANT OPTION lets the grantee grant the permission to others. REVOKE only removes a previous GRANT or DENY; unlike DENY, it does not block a permission obtained through a role."
    fr: "ALTER ROLE ... ADD MEMBER ajoute un utilisateur de base de données à un rôle de base de données : l'analyste hérite de ses autorisations. Un DENY sur une table l'emporte sur le SELECT accordé sur le schéma. WITH GRANT OPTION permet au bénéficiaire d'accorder l'autorisation à d'autres. REVOKE ne fait que supprimer un GRANT ou un DENY précédent ; contrairement à DENY, il ne bloque pas une autorisation obtenue par un rôle."
  options:
    srvrole: { en: "ALTER SERVER ROLE manages server role membership for logins, not database roles such as finance_read.", fr: "ALTER SERVER ROLE gère l'appartenance des connexions aux rôles serveur, pas aux rôles de base de données comme finance_read." }
    schema: { en: "A default schema only changes how unqualified object names are resolved; it grants no permission.", fr: "Un schéma par défaut ne change que la résolution des noms d'objets non qualifiés ; il n'accorde aucune autorisation." }
references:
  - title: REVOKE (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/statements/revoke-transact-sql
  - title: ALTER ROLE (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/statements/alter-role-transact-sql
