id: dp300-2b-fw-rule-facts
objective: "2.2.3"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    You have an Azure SQL Database logical server named **sql-fabrikam** that hosts databases named **DB1** and **DB2**. You manage the IP firewall rules of sql-fabrikam.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un serveur logique Azure SQL Database nommé **sql-fabrikam** qui héberge des bases de données nommées **DB1** et **DB2**. Vous gérez les règles de pare-feu IP de sql-fabrikam.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: A database-level IP firewall rule created in DB1 also allows the client to connect to DB2.
        fr: Une règle de pare-feu IP au niveau de la base de données créée dans DB1 autorise aussi le client à se connecter à DB2.
    - id: s2
      text:
        en: A user who has the SQL Server Contributor role on sql-fabrikam can create server-level IP firewall rules in the Azure portal.
        fr: Un utilisateur qui dispose du rôle SQL Server Contributor sur sql-fabrikam peut créer des règles de pare-feu IP au niveau du serveur dans le portail Azure.
    - id: s3
      text:
        en: The server-level IP firewall rules of sql-fabrikam are stored in its master database.
        fr: Les règles de pare-feu IP au niveau du serveur de sql-fabrikam sont stockées dans sa base de données master.
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: "A database-level rule is stored in its database and grants access to that database only. Server-level rules can be managed by the SQL Server Contributor or SQL Security Manager roles, or the owner of the resource that contains the server. Server-level rules are stored in the master database and apply to all the databases of the server."
    fr: "Une règle au niveau de la base de données est stockée dans sa base et n'accorde l'accès qu'à cette base. Les règles au niveau du serveur peuvent être gérées par les rôles SQL Server Contributor ou SQL Security Manager, ou par le propriétaire de la ressource qui contient le serveur. Les règles au niveau du serveur sont stockées dans la base de données master et s'appliquent à toutes les bases du serveur."
references:
  - title: Azure SQL Database IP firewall rules
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/firewall-configure
