id: dp300-2a-ssms-pages
objective: "2.1.5"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    You manage an Azure SQL managed instance that hosts a database named **DB1**. In SQL Server Management Studio, you open **DB1 > Security > Users**, right-click the user **Lena**, and select **Properties**.

    You need to perform three tasks from the Database User dialog box.

    Which page should you use for each task? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous gérez une instance managée Azure SQL qui héberge une base de données nommée **DB1**. Dans SQL Server Management Studio, vous ouvrez **DB1 > Security > Users**, cliquez avec le bouton droit sur l'utilisateur **Lena** et sélectionnez **Properties**.

    Vous devez effectuer trois tâches depuis la boîte de dialogue Database User.

    Quelle page devez-vous utiliser pour chaque tâche ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Add Lena to the db_datareader role: [[p1]] page.

      Grant Lena EXECUTE on the procedure dbo.usp_CloseMonth by searching for the object: [[p2]] page.

      Make Lena the owner of the Staging schema: [[p3]] page.
    fr: |
      Ajouter Lena au rôle db_datareader : page [[p1]].

      Accorder à Lena EXECUTE sur la procédure dbo.usp_CloseMonth en recherchant l'objet : page [[p2]].

      Faire de Lena la propriétaire du schéma Staging : page [[p3]].
  slots:
    - id: p1
      options:
        - { id: gen, text: General }
        - { id: own, text: Owned Schemas }
        - { id: mem, text: Membership }
        - { id: sec, text: Securables }
    - id: p2
      options:
        - { id: gen, text: General }
        - { id: own, text: Owned Schemas }
        - { id: mem, text: Membership }
        - { id: sec, text: Securables }
    - id: p3
      options:
        - { id: gen, text: General }
        - { id: own, text: Owned Schemas }
        - { id: mem, text: Membership }
        - { id: sec, text: Securables }
answer:
  values: { p1: mem, p2: sec, p3: own }
explanation:
  correct:
    en: |
      In the Database User dialog box, the Membership page lists the database roles the user can belong to, the Securables page lets you search for objects and grant permissions on them, and the Owned Schemas page sets the schemas owned by the user. The General page holds the user type, login, password and default schema.
    fr: |
      Dans la boîte de dialogue Database User, la page Membership liste les rôles de base de données auxquels l'utilisateur peut appartenir, la page Securables permet de rechercher des objets et d'y accorder des autorisations, et la page Owned Schemas définit les schémas détenus par l'utilisateur. La page General contient le type d'utilisateur, la connexion, le mot de passe et le schéma par défaut.
references:
  - title: Create a database user
    url: https://learn.microsoft.com/en-us/sql/relational-databases/security/authentication-access/create-a-database-user
