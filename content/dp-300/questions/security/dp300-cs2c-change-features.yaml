id: dp300-cs2c-change-features
objective: "2.3.3"
type: dragdrop
caseStudy: dp300-cs2c-adatum-learning
difficulty: 1
status: draft
stem:
  en: |
    You need to recommend a feature for each table to meet the data change requirements.

    Which feature should you recommend for each table? To answer, drag the appropriate features to the correct tables. Each feature may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez recommander une fonctionnalité pour chaque table afin de satisfaire les exigences relatives aux modifications de données.

    Quelle fonctionnalité devez-vous recommander pour chaque table ? Pour répondre, faites glisser les fonctionnalités appropriées vers les tables correspondantes. Chaque fonctionnalité peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: i_ct, text: { en: "Change tracking", fr: "Suivi des modifications (change tracking)" } }
    - { id: i_cdc, text: { en: "Change data capture", fr: "Capture des données modifiées (CDC)" } }
    - { id: i_temporal, text: { en: "System-versioned temporal table", fr: "Table temporelle avec version système" } }
    - { id: i_ledger, text: { en: "Updatable ledger table", fr: "Table de registre modifiable" } }
    - { id: i_audit, text: { en: "Azure SQL auditing", fr: "Audit Azure SQL" } }
  targets:
    - { id: t_progress, text: dbo.CourseProgress }
    - { id: t_transcripts, text: dbo.Transcripts }
    - { id: t_payments, text: dbo.Payments }
answer:
  mapping: { t_progress: i_ct, t_transcripts: i_temporal, t_payments: i_cdc }
explanation:
  correct:
    en: |
      Change tracking records synchronously which rows changed, without storing the changed values: the back end reads the keys changed since its last sync version and joins them to the table for the current values. A system-versioned temporal table keeps each earlier row version in a history table, can be queried with `FOR SYSTEM_TIME AS OF`, and supports a history retention period with automatic cleanup. Change data capture reads the transaction log asynchronously and stores each insert, update and delete with the before and after values in change tables.
    fr: |
      Le suivi des modifications enregistre de façon synchrone les lignes modifiées, sans stocker les valeurs modifiées : le back-end lit les clés modifiées depuis sa dernière version de synchronisation et les joint à la table pour obtenir les valeurs actuelles. Une table temporelle avec version système conserve chaque version antérieure des lignes dans une table d'historique, s'interroge avec `FOR SYSTEM_TIME AS OF` et prend en charge une période de rétention de l'historique avec nettoyage automatique. La capture des données modifiées lit le journal des transactions de façon asynchrone et stocke chaque insertion, mise à jour et suppression, avec les valeurs avant et après, dans des tables de modifications.
  options:
    i_ledger: { en: "An updatable ledger table keeps the history for tamper evidence, but this history cannot be removed automatically after seven years.", fr: "Une table de registre modifiable conserve l'historique pour la preuve d'inviolabilité, mais cet historique ne peut pas être supprimé automatiquement après sept ans." }
    i_audit: { en: "Auditing records the statements that were run, not the row values that an application or a committee can query.", fr: "L'audit enregistre les instructions exécutées, pas les valeurs de lignes qu'une application ou une commission peut interroger." }
references:
  - title: Track data changes (SQL Server)
    url: https://learn.microsoft.com/en-us/sql/relational-databases/track-changes/track-data-changes-sql-server
