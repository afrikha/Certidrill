id: dp300-2a-vm-contained-setup
objective: "2.1.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    You have an Azure virtual machine that runs SQL Server 2022 in SQL Server and Windows Authentication mode. The instance hosts a database named **DB1** that you will regularly move to other instances.

    You need to create users that have a password in DB1 and that don't depend on any login in master.

    Which two actions should you perform before you create the users? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'une machine virtuelle Azure qui exécute SQL Server 2022 en mode d'authentification SQL Server et Windows. L'instance héberge une base de données nommée **DB1** que vous déplacerez régulièrement vers d'autres instances.

    Vous devez créer dans DB1 des utilisateurs qui ont un mot de passe et qui ne dépendent d'aucune connexion de master.

    Quelles sont les deux actions à effectuer avant de créer les utilisateurs ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Run ALTER DATABASE DB1 SET TRUSTWORTHY ON.", fr: "Exécuter ALTER DATABASE DB1 SET TRUSTWORTHY ON." } }
    - { id: b, text: { en: "Run sp_configure 'contained database authentication', 1, and then RECONFIGURE.", fr: "Exécuter sp_configure 'contained database authentication', 1, puis RECONFIGURE." } }
    - { id: c, text: { en: "Create a login in master for each user, and then map it with CREATE USER ... FROM LOGIN.", fr: "Créer une connexion dans master pour chaque utilisateur, puis la mapper avec CREATE USER ... FROM LOGIN." } }
    - { id: d, text: { en: "Run ALTER DATABASE DB1 SET CONTAINMENT = PARTIAL.", fr: "Exécuter ALTER DATABASE DB1 SET CONTAINMENT = PARTIAL." } }
    - { id: e, text: { en: "Enable Microsoft Entra authentication on the Security Configuration page of the SQL virtual machine.", fr: "Activer l'authentification Microsoft Entra dans la page Security Configuration de la machine virtuelle SQL." } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |
      On SQL Server, contained database users require contained database authentication to be enabled on the instance with sp_configure, and the database to be partially contained (CONTAINMENT = PARTIAL). You can then run CREATE USER ... WITH PASSWORD in DB1, and the users move with the database.
    fr: |
      Sur SQL Server, les utilisateurs de base de données autonomes exigent que l'authentification de base de données autonome soit activée sur l'instance avec sp_configure, et que la base soit partiellement autonome (CONTAINMENT = PARTIAL). Vous pouvez ensuite exécuter CREATE USER ... WITH PASSWORD dans DB1, et les utilisateurs suivent la base.
  options:
    a: { en: "TRUSTWORTHY controls whether code in the database can reach instance-level resources; it isn't needed and widens the attack surface.", fr: "TRUSTWORTHY détermine si le code de la base peut atteindre des ressources de l'instance ; il n'est pas nécessaire et élargit la surface d'attaque." }
    c: { en: "Login-based users depend on master, which is what the requirement excludes.", fr: "Les utilisateurs basés sur une connexion dépendent de master, ce que l'exigence exclut." }
    e: { en: "Microsoft Entra authentication doesn't create users that have a password.", fr: "L'authentification Microsoft Entra ne crée pas d'utilisateurs dotés d'un mot de passe." }
references:
  - title: Contained User Access to Contained Databases
    url: https://learn.microsoft.com/en-us/sql/relational-databases/security/contained-database-users-making-your-database-portable
