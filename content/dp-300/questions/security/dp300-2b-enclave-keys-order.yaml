id: dp300-2b-enclave-keys-order
objective: "2.2.5"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    You have an Azure SQL database named **ContosoHR** on standard-series hardware. Secure enclaves are already enabled for the database. The HR.Employees table contains a plaintext Salary column. No Always Encrypted keys exist.

    You are connected to ContosoHR in SQL Server Management Studio with Always Encrypted enabled, secure enclaves enabled, and the attestation protocol set to None.

    You need to encrypt Salary in place with randomized encryption so that applications can run range queries on it.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Vous disposez d'une base de données Azure SQL nommée **ContosoHR** sur du matériel de série standard. Les enclaves sécurisées sont déjà activées pour la base. La table HR.Employees contient une colonne Salary en clair. Aucune clé Always Encrypted n'existe.

    Vous êtes connecté à ContosoHR dans SQL Server Management Studio avec Always Encrypted activé, les enclaves sécurisées activées et le protocole d'attestation défini sur None.

    Vous devez chiffrer Salary sur place avec un chiffrement aléatoire pour que les applications puissent exécuter des requêtes de plage sur cette colonne.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: cmk, text: { en: "Create a column master key in Azure Key Vault with Allow enclave computations selected.", fr: "Créer une clé principale de colonne dans Azure Key Vault avec Allow enclave computations sélectionné." } }
    - { id: cek, text: { en: "Create a column encryption key protected by the new column master key.", fr: "Créer une clé de chiffrement de colonne protégée par la nouvelle clé principale de colonne." } }
    - { id: alter, text: { en: "Run ALTER TABLE ... ALTER COLUMN Salary ... ENCRYPTED WITH (ENCRYPTION_TYPE = Randomized ...).", fr: "Exécuter ALTER TABLE ... ALTER COLUMN Salary ... ENCRYPTED WITH (ENCRYPTION_TYPE = Randomized ...)." } }
    - { id: cache, text: { en: "Run ALTER DATABASE SCOPED CONFIGURATION CLEAR PROCEDURE_CACHE.", fr: "Exécuter ALTER DATABASE SCOPED CONFIGURATION CLEAR PROCEDURE_CACHE." } }
    - { id: cmknoenc, text: { en: "Create a column master key with Allow enclave computations cleared.", fr: "Créer une clé principale de colonne avec Allow enclave computations désélectionné." } }
    - { id: maa, text: { en: "Configure an attestation policy in Microsoft Azure Attestation.", fr: "Configurer une stratégie d'attestation dans Microsoft Azure Attestation." } }
    - { id: dc, text: { en: "Change the hardware configuration of ContosoHR to DC-series.", fr: "Changer la configuration matérielle de ContosoHR pour la série DC." } }
answer:
  sequence: [ cmk, cek, alter, cache ]
explanation:
  correct:
    en: "Enclave computations need an enclave-enabled column master key and a column encryption key encrypted with it. The in-place ALTER TABLE then encrypts Salary inside the enclave. After the table is altered, the plans of the batches and procedures that access it must be cleared so that the parameter encryption metadata is refreshed."
    fr: "Les calculs d'enclave exigent une clé principale de colonne compatible enclave et une clé de chiffrement de colonne chiffrée avec elle. L'instruction ALTER TABLE sur place chiffre ensuite Salary dans l'enclave. Une fois la table modifiée, les plans des lots et des procédures qui y accèdent doivent être effacés pour actualiser les métadonnées de chiffrement des paramètres."
  options:
    cmknoenc: { en: "A key created without Allow enclave computations cannot be used inside the enclave, so in-place encryption and range queries would fail.", fr: "Une clé créée sans Allow enclave computations ne peut pas être utilisée dans l'enclave : le chiffrement sur place et les requêtes de plage échoueraient." }
    maa: { en: "VBS enclaves in Azure SQL Database do not use attestation; Microsoft Azure Attestation is for Intel SGX enclaves.", fr: "Les enclaves VBS d'Azure SQL Database n'utilisent pas d'attestation ; Microsoft Azure Attestation sert aux enclaves Intel SGX." }
    dc: { en: "DC-series is needed only for Intel SGX enclaves; standard-series hardware already supports VBS enclaves.", fr: "La série DC n'est nécessaire que pour les enclaves Intel SGX ; le matériel de série standard prend déjà en charge les enclaves VBS." }
references:
  - title: "Tutorial: Getting Started Using Always Encrypted with VBS Enclaves in Azure SQL Database"
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/always-encrypted-enclaves-getting-started-vbs
