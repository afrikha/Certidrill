id: dp300-2b-deny-revoke-grant-option
objective: "2.1.8"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    You have an Azure SQL database named **SalesDB** that contains the Sales schema. The schema includes the Sales.Orders and Sales.Commission tables. You run the following statements in SalesDB.

    ```sql
    CREATE ROLE sales_reader;
    GRANT SELECT ON SCHEMA::Sales TO sales_reader;
    DENY SELECT ON OBJECT::Sales.Commission TO sales_reader;
    ALTER ROLE sales_reader ADD MEMBER Ana;
    GRANT SELECT ON SCHEMA::Sales TO Luis WITH GRANT OPTION;
    ```

    Ana and Luis are database users that have no other permissions and are not members of any other role.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'une base de données Azure SQL nommée **SalesDB** qui contient le schéma Sales. Le schéma comprend les tables Sales.Orders et Sales.Commission. Vous exécutez les instructions suivantes dans SalesDB.

    ```sql
    CREATE ROLE sales_reader;
    GRANT SELECT ON SCHEMA::Sales TO sales_reader;
    DENY SELECT ON OBJECT::Sales.Commission TO sales_reader;
    ALTER ROLE sales_reader ADD MEMBER Ana;
    GRANT SELECT ON SCHEMA::Sales TO Luis WITH GRANT OPTION;
    ```

    Ana et Luis sont des utilisateurs de base de données qui n'ont aucune autre autorisation et ne sont membres d'aucun autre rôle.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: Ana can query the Sales.Commission table.
        fr: Ana peut interroger la table Sales.Commission.
    - id: s2
      text:
        en: If you run REVOKE SELECT ON OBJECT::Sales.Commission FROM sales_reader, Ana can query the Sales.Commission table.
        fr: Si vous exécutez REVOKE SELECT ON OBJECT::Sales.Commission FROM sales_reader, Ana peut interroger la table Sales.Commission.
    - id: s3
      text:
        en: Luis can grant SELECT on the Sales schema to another database user.
        fr: Luis peut accorder SELECT sur le schéma Sales à un autre utilisateur de base de données.
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: "The DENY on Sales.Commission takes precedence over the SELECT granted on the schema, so Ana cannot read that table. REVOKE removes a previously granted or denied permission: once the DENY is removed, the schema-level grant applies to Sales.Commission again. WITH GRANT OPTION lets Luis grant the permission he received to other principals."
    fr: "Le DENY sur Sales.Commission l'emporte sur le SELECT accordé sur le schéma : Ana ne peut pas lire cette table. REVOKE supprime une autorisation précédemment accordée ou refusée : une fois le DENY supprimé, l'autorisation au niveau du schéma s'applique de nouveau à Sales.Commission. WITH GRANT OPTION permet à Luis d'accorder l'autorisation reçue à d'autres principaux."
references:
  - title: REVOKE (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/statements/revoke-transact-sql
