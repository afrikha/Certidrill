id: dp300-4a-failsafe-operator
objective: "4.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have SQL Server 2022 on an Azure virtual machine. SQL Server Agent is configured to use Database Mail. Several SQL Server Agent alerts notify an operator named **Ops-Primary**.

    An operator named **Ops-Backup** must receive an alert notification only when the designated operator cannot be reached.

    What should you configure?
  fr: |
    Vous disposez de SQL Server 2022 sur une machine virtuelle Azure. SQL Server Agent est configuré pour utiliser Database Mail. Plusieurs alertes SQL Server Agent avertissent un opérateur nommé **Ops-Primary**.

    Un opérateur nommé **Ops-Backup** doit recevoir une notification d'alerte uniquement quand l'opérateur désigné ne peut pas être joint.

    Que devez-vous configurer ?
body:
  options:
    - { id: a, text: { en: "Ops-Backup as the fail-safe operator in the SQL Server Agent properties", fr: "Ops-Backup comme opérateur de prévention de défaillance dans les propriétés de SQL Server Agent" } }
    - { id: b, text: { en: "Ops-Backup as an additional operator in the response of each alert", fr: "Ops-Backup comme opérateur supplémentaire dans la réponse de chaque alerte" } }
    - { id: c, text: { en: "A second Database Mail account in the profile used by SQL Server Agent", fr: "Un second compte Database Mail dans le profil utilisé par SQL Server Agent" } }
    - { id: d, text: { en: "A job notification that emails Ops-Backup when each job fails", fr: "Une notification de travail qui envoie un e-mail à Ops-Backup en cas d'échec de chaque travail" } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      A fail-safe operator receives the alert when the designated operator cannot be reached. You set it on the Alert System page of the SQL Server Agent properties (Enable fail-safe operator), and only members of sysadmin can designate it.
    fr: |
      Un opérateur de prévention de défaillance reçoit l'alerte quand l'opérateur désigné ne peut pas être joint. Vous le définissez dans la page Système d'alerte des propriétés de SQL Server Agent (Activer l'opérateur de prévention de défaillance), et seuls les membres de sysadmin peuvent le désigner.
  options:
    b: { en: "Ops-Backup would then be notified every time, not only when Ops-Primary cannot be reached.", fr: "Ops-Backup serait alors averti à chaque fois, pas seulement quand Ops-Primary est injoignable." }
    c: { en: "A second account provides SMTP failover for sending mail; it does not change who is notified.", fr: "Un second compte assure le basculement SMTP pour l'envoi ; il ne change pas qui est averti." }
    d: { en: "Job notifications report job outcomes, not alerts, and would always reach Ops-Backup.", fr: "Les notifications de travail signalent le résultat des travaux, pas les alertes, et atteindraient toujours Ops-Backup." }
references:
  - title: Designate a Fail-Safe Operator
    url: https://learn.microsoft.com/en-us/ssms/agent/designate-a-fail-safe-operator
