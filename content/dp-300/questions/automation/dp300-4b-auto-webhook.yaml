id: dp300-4b-auto-webhook
objective: "4.3.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An Azure Automation account named **aa-ops** contains a published PowerShell runbook named **rb-scale** that scales an Azure SQL database.

    An external ticketing system must start rb-scale by sending an HTTP POST request when a change ticket is approved. The solution must minimize development effort.

    What should you create?
  fr: |
    Un compte Automation nommé **aa-ops** contient un runbook PowerShell publié nommé **rb-scale** qui met à l'échelle une base de données Azure SQL.

    Un système de tickets externe doit démarrer rb-scale en envoyant une requête HTTP POST lorsqu'un ticket de changement est approuvé. La solution doit réduire au minimum l'effort de développement.

    Que devez-vous créer ?
body:
  options:
    - { id: a, text: { en: "A schedule linked to rb-scale", fr: "Une planification liée à rb-scale" } }
    - { id: b, text: { en: "A Hybrid Runbook Worker group", fr: "Un groupe Runbook Worker hybride" } }
    - { id: c, text: { en: "An Automation variable read by rb-scale", fr: "Une variable Automation lue par rb-scale" } }
    - { id: d, text: { en: "A webhook for rb-scale", fr: "Un webhook pour rb-scale" } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      A webhook lets an external service start a published runbook with a single HTTP POST request to its URL, without calling the full Automation API. The request body is passed to the runbook in the WebhookData parameter. Copy the URL when you create the webhook, because it can't be retrieved later.
    fr: |
      Un webhook permet à un service externe de démarrer un runbook publié par une simple requête HTTP POST vers son URL, sans appeler toute l'API Automation. Le corps de la requête est transmis au runbook dans le paramètre WebhookData. Copiez l'URL lors de la création du webhook, car elle ne peut pas être récupérée ensuite.
  options:
    a: { en: "A schedule starts the runbook at fixed times, not when a ticket is approved.", fr: "Une planification démarre le runbook à heures fixes, pas lorsqu'un ticket est approuvé." }
    b: { en: "A Hybrid Runbook Worker runs jobs on your own machines; it doesn't expose an HTTP endpoint that starts the runbook.", fr: "Un Runbook Worker hybride exécute les travaux sur vos propres machines ; il n'expose pas de point de terminaison HTTP qui démarre le runbook." }
    c: { en: "A variable stores a value for runbooks; it can't start a job.", fr: "Une variable stocke une valeur pour les runbooks ; elle ne peut pas démarrer un travail." }
references:
  - title: Start an Azure Automation runbook from a webhook
    url: https://learn.microsoft.com/en-us/azure/automation/automation-webhooks
