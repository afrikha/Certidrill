id: dp300-4a-resource-types
objective: "4.2.1"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    You are writing Bicep files for the Azure SQL resources of Northwind Traders.

    Which resource type should you declare for each requirement? To answer, drag the appropriate resource types to the correct requirements. Each resource type may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous écrivez des fichiers Bicep pour les ressources Azure SQL de Northwind Traders.

    Quel type de ressource devez-vous déclarer pour chaque exigence ? Pour répondre, faites glisser les types de ressources appropriés vers les exigences correspondantes. Chaque type de ressource peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: servers, text: Microsoft.Sql/servers }
    - { id: dbs, text: Microsoft.Sql/servers/databases }
    - { id: pools, text: Microsoft.Sql/servers/elasticPools }
    - { id: fw, text: Microsoft.Sql/servers/firewallRules }
    - { id: mi, text: Microsoft.Sql/managedInstances }
    - { id: sqlvm, text: Microsoft.SqlVirtualMachine/sqlVirtualMachines }
  targets:
    - { id: t1, text: { en: "Allow the public IP range of the head office to reach the logical server", fr: "Autoriser la plage d'adresses IP publiques du siège à joindre le serveur logique" } }
    - { id: t2, text: { en: "Share 8 vCores among 30 tenant databases with unpredictable usage", fr: "Partager 8 vCores entre 30 bases de données de locataire à l'utilisation imprévisible" } }
    - { id: t3, text: { en: "Register an existing SQL Server virtual machine with the SQL IaaS Agent extension and set its license type", fr: "Inscrire une machine virtuelle SQL Server existante auprès de l'extension SQL IaaS Agent et définir son type de licence" } }
    - { id: t4, text: { en: "Deploy a PaaS instance that runs SQL Server Agent in a delegated subnet", fr: "Déployer une instance PaaS qui exécute SQL Server Agent dans un sous-réseau délégué" } }
answer:
  mapping: { t1: fw, t2: pools, t3: sqlvm, t4: mi }
explanation:
  correct:
    en: |
      Server-level IP rules are child resources `Microsoft.Sql/servers/firewallRules`. An elastic pool (`Microsoft.Sql/servers/elasticPools`) shares compute among databases. `Microsoft.SqlVirtualMachine/sqlVirtualMachines` represents the SQL IaaS Agent extension registration of a VM, including its license type. A managed instance (`Microsoft.Sql/managedInstances`) is deployed into a delegated subnet and includes SQL Server Agent.
    fr: |
      Les règles IP de niveau serveur sont des ressources enfants `Microsoft.Sql/servers/firewallRules`. Un pool élastique (`Microsoft.Sql/servers/elasticPools`) partage le calcul entre des bases de données. `Microsoft.SqlVirtualMachine/sqlVirtualMachines` représente l'inscription d'une machine virtuelle auprès de l'extension SQL IaaS Agent, y compris son type de licence. Une instance managée (`Microsoft.Sql/managedInstances`) est déployée dans un sous-réseau délégué et inclut SQL Server Agent.
references:
  - title: Microsoft.Sql servers
    url: https://learn.microsoft.com/en-us/azure/templates/microsoft.sql/servers
