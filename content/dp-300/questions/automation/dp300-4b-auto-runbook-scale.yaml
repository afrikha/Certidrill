id: dp300-4b-auto-runbook-scale
objective: "4.3.2"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove Bank has an Azure Automation account named **aa-ops** that has a system-assigned managed identity. The identity has the required Azure role on a logical server named **srv-sales**. A database named **SalesDb** on srv-sales uses the S1 service objective.

    You are writing a PowerShell runbook that must change SalesDb to the S3 service objective every Friday evening. The runbook must authenticate by using the managed identity of aa-ops.

    How should you complete the runbook? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove Bank dispose d'un compte Automation nommé **aa-ops** doté d'une identité managée affectée par le système. L'identité dispose du rôle Azure nécessaire sur un serveur logique nommé **srv-sales**. Une base de données nommée **SalesDb** sur srv-sales utilise l'objectif de service S1.

    Vous écrivez un runbook PowerShell qui doit faire passer SalesDb à l'objectif de service S3 chaque vendredi soir. Le runbook doit s'authentifier avec l'identité managée d'aa-ops.

    Comment devez-vous compléter le runbook ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: powershell
  template: |
    Disable-AzContextAutosave -Scope Process
    [[auth]]
    [[cmdlet]] -ResourceGroupName "rg-sales" -ServerName "srv-sales" `
      -DatabaseName "SalesDb" [[param]] "S3"
  slots:
    - id: auth
      options:
        - { id: identity, text: "Connect-AzAccount -Identity" }
        - { id: device, text: "Connect-AzAccount -UseDeviceAuthentication" }
        - { id: runas, text: "Get-AutomationConnection -Name 'AzureRunAsConnection'" }
    - id: cmdlet
      options:
        - { id: set, text: Set-AzSqlDatabase }
        - { id: new, text: New-AzSqlDatabase }
        - { id: copy, text: New-AzSqlDatabaseCopy }
    - id: param
      options:
        - { id: so, text: "-RequestedServiceObjectiveName" }
        - { id: edition, text: "-Edition" }
        - { id: pool, text: "-ElasticPoolName" }
answer:
  values: { auth: identity, cmdlet: set, param: so }
explanation:
  correct:
    en: |
      `Connect-AzAccount -Identity` signs the runbook in with the managed identity of the Automation account. `Set-AzSqlDatabase` changes the properties of an existing database, and `-RequestedServiceObjectiveName "S3"` sets its new service objective.
    fr: |
      `Connect-AzAccount -Identity` connecte le runbook avec l'identité managée du compte Automation. `Set-AzSqlDatabase` modifie les propriétés d'une base de données existante, et `-RequestedServiceObjectiveName "S3"` définit son nouvel objectif de service.
  options:
    device: { en: "Device authentication needs a user to enter a code interactively, which a scheduled runbook can't do.", fr: "L'authentification par appareil exige qu'un utilisateur saisisse un code de façon interactive, ce qu'un runbook planifié ne peut pas faire." }
    runas: { en: "Run As accounts are retired; runbooks authenticate with managed identities.", fr: "Les comptes d'identification (Run As) sont retirés ; les runbooks s'authentifient avec des identités managées." }
    new: { en: "New-AzSqlDatabase creates a database; SalesDb already exists.", fr: "New-AzSqlDatabase crée une base de données ; SalesDb existe déjà." }
    copy: { en: "New-AzSqlDatabaseCopy creates a copy of the database instead of scaling it.", fr: "New-AzSqlDatabaseCopy crée une copie de la base de données au lieu de la mettre à l'échelle." }
    edition: { en: "-Edition takes an edition such as Standard or Premium, not a service objective.", fr: "-Edition attend une édition comme Standard ou Premium, pas un objectif de service." }
    pool: { en: "-ElasticPoolName moves the database into an elastic pool.", fr: "-ElasticPoolName déplace la base de données dans un pool élastique." }
references:
  - title: Using a system-assigned managed identity for an Azure Automation account
    url: https://learn.microsoft.com/en-us/azure/automation/enable-managed-identity-for-automation
