id: dp300-4b-alert-ej-failed
objective: "4.3.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An elastic job agent named **agent1** runs maintenance jobs against 80 databases of Azure SQL Database.

    You need the database team to receive an email whenever a job execution of agent1 fails. The solution must minimize administrative effort.

    What should you configure?
  fr: |
    Un agent de travail élastique nommé **agent1** exécute des travaux de maintenance sur 80 bases de données Azure SQL Database.

    L'équipe des bases de données doit recevoir un e-mail chaque fois qu'une exécution de travail d'agent1 échoue. La solution doit réduire au minimum l'effort d'administration.

    Que devez-vous configurer ?
body:
  options:
    - { id: a, text: { en: "Database Mail in the job database of agent1", fr: "Database Mail dans la base de données de travaux d'agent1" } }
    - { id: b, text: { en: "A metric alert rule on agent1 for the Elastic Jobs Executions Failed metric, with an action group", fr: "Une règle d'alerte de métrique sur agent1 pour la métrique Elastic Jobs Executions Failed, avec un groupe d'actions" } }
    - { id: c, text: { en: "A metric alert rule on the job database for the Failed Connections metric, with an action group", fr: "Une règle d'alerte de métrique sur la base de données de travaux pour la métrique Failed Connections, avec un groupe d'actions" } }
    - { id: d, text: { en: "A Service Health alert for Azure SQL Database in the region of agent1", fr: "Une alerte Service Health pour Azure SQL Database dans la région d'agent1" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      The elastic job agent exposes Azure Monitor metrics such as Elastic Jobs Executions Failed, Successful and Timed Out. A metric alert rule on the agent with a threshold above 0 and an action group that sends email notifies the team of every failed execution.
    fr: |
      L'agent de travail élastique expose des métriques Azure Monitor comme Elastic Jobs Executions Failed, Successful et Timed Out. Une règle d'alerte de métrique sur l'agent avec un seuil supérieur à 0 et un groupe d'actions qui envoie un e-mail avertit l'équipe de chaque exécution en échec.
  options:
    a: { en: "Azure SQL Database doesn't support Database Mail, and elastic jobs have no operator notification.", fr: "Azure SQL Database ne prend pas en charge Database Mail, et les travaux élastiques n'ont pas de notification d'opérateur." }
    c: { en: "Failed connections to the job database don't reflect job steps that fail on the targets.", fr: "Les connexions en échec à la base de données de travaux ne reflètent pas les étapes de travail qui échouent sur les cibles." }
    d: { en: "Service Health reports Azure incidents, not the outcome of your jobs.", fr: "Service Health signale les incidents Azure, pas le résultat de vos travaux." }
references:
  - title: Create, configure, and manage elastic jobs
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/elastic-jobs-tutorial
