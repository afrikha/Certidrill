id: dp300-sr1-weekly-purge-1
objective: "4.3.2"
type: series_yesno
series: dp300-sr1-weekly-purge
seriesOrder: 1
difficulty: 1
status: draft
stem:
  en: |
    You create a SQL Server Agent job for SalesOps.
  fr: |
    Vous créez un travail SQL Server Agent pour SalesOps.
body:
  solution:
    en: |
      You connect to sql-nw-sales by using SSMS and create a **SQL Server Agent** job that has a Transact-SQL step running `EXEC dbo.usp_PurgeAudit;` in SalesOps and a weekly schedule on Sunday at 02:00. The job runs under a Microsoft Entra login that is mapped to a SalesOps user granted EXECUTE on the procedure.
    fr: |
      Vous vous connectez à sql-nw-sales à l'aide de SSMS et créez un travail **SQL Server Agent** qui comporte une étape Transact-SQL exécutant `EXEC dbo.usp_PurgeAudit;` dans SalesOps et une planification hebdomadaire le dimanche à 02:00. Le travail s'exécute sous une connexion Microsoft Entra mappée à un utilisateur de SalesOps auquel EXECUTE est accordé sur la procédure.
answer: { value: false }
explanation:
  correct:
    en: |
      Azure SQL Database has no SQL Server Agent, so the job can't be created on sql-nw-sales. SQL Server Agent is available on SQL Managed Instance and on SQL Server, including SQL Server on Azure VMs, which the requirements exclude. For Azure SQL Database, scheduled T-SQL runs through an elastic job agent or an external scheduler such as Azure Automation.
    fr: |
      Azure SQL Database ne dispose pas de SQL Server Agent : le travail ne peut pas être créé sur sql-nw-sales. SQL Server Agent existe sur SQL Managed Instance et sur SQL Server, y compris SQL Server sur des machines virtuelles Azure, que les exigences excluent. Pour Azure SQL Database, le T-SQL planifié s'exécute avec un agent de travail élastique ou un planificateur externe comme Azure Automation.
references:
  - title: Manage databases in Azure SQL Database by using Azure Automation
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/automation-manage
