id: dp300-4b-ej-agent-tier
objective: "4.3.1"
type: single
difficulty: 2
status: draft
shuffle: false
stem:
  en: |
    Wingtip Toys hosts 350 tenant databases of Azure SQL Database on four logical servers. You create an elastic job agent to run a weekly script against all the tenant databases.

    The script must start on every tenant database at the same time, with no database waiting for another to finish. The solution must minimize cost.

    Which service tier should you select for the elastic job agent?
  fr: |
    Wingtip Toys héberge 350 bases de données de locataire Azure SQL Database sur quatre serveurs logiques. Vous créez un agent de travail élastique pour exécuter un script hebdomadaire sur toutes les bases de données de locataire.

    Le script doit démarrer sur chaque base de données de locataire en même temps, sans qu'aucune base n'attende la fin d'une autre. La solution doit réduire les coûts au minimum.

    Quel niveau de service devez-vous sélectionner pour l'agent de travail élastique ?
body:
  options:
    - { id: a, text: JA100 }
    - { id: b, text: JA200 }
    - { id: c, text: JA400 }
    - { id: d, text: JA800 }
answer: { optionId: c }
explanation:
  correct:
    en: |
      The service tier of an elastic job agent sets its maximum number of concurrent target connections - 100, 200, 400 or 800 for JA100 to JA800. With 350 targets, JA400 is the smallest tier that connects to all of them at once.
    fr: |
      Le niveau de service d'un agent de travail élastique fixe son nombre maximal de connexions simultanées aux cibles - 100, 200, 400 ou 800 pour JA100 à JA800. Avec 350 cibles, JA400 est le plus petit niveau qui se connecte à toutes en même temps.
  options:
    a: { en: "JA100 allows 100 concurrent targets; the other 250 databases would be queued until connections become free.", fr: "JA100 autorise 100 cibles simultanées ; les 250 autres bases de données seraient mises en file d'attente jusqu'à la libération de connexions." }
    b: { en: "JA200 allows 200 concurrent targets, which is fewer than 350.", fr: "JA200 autorise 200 cibles simultanées, ce qui est inférieur à 350." }
    d: { en: "JA800 meets the requirement but costs more than JA400, which is enough.", fr: "JA800 satisfait l'exigence mais coûte plus cher que JA400, qui suffit." }
references:
  - title: Elastic jobs in Azure SQL Database
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/elastic-jobs-overview
