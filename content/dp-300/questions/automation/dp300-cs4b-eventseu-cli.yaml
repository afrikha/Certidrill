id: dp300-cs4b-eventseu-cli
objective: "4.2.3"
type: dropdown
caseStudy: dp300-cs4b-relecloud
difficulty: 2
status: draft
shuffle: false
stem:
  en: |
    You need to complete the Azure CLI script that deploys EventsEU to meet the new database requirement.

    How should you complete the command? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez compléter le script Azure CLI qui déploie EventsEU pour satisfaire l'exigence relative à la nouvelle base de données.

    Comment devez-vous compléter la commande ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: bash
  template: |
    az sql db create \
      --resource-group rg-rc-prod \
      --server sql-rc-prod \
      --name EventsEU \
      --edition [[edition]] \
      --family Gen5 \
      --capacity 8 \
      --ha-replicas [[ha]] \
      --zone-redundant true \
      --backup-storage-redundancy [[bsr]]
  slots:
    - id: edition
      options:
        - { id: e_gp, text: GeneralPurpose }
        - { id: e_bc, text: BusinessCritical }
        - { id: e_hs, text: Hyperscale }
    - id: ha
      options:
        - { id: ha0, text: "0" }
        - { id: ha1, text: "1" }
        - { id: ha2, text: "2" }
        - { id: ha4, text: "4" }
    - id: bsr
      options:
        - { id: b_local, text: Local }
        - { id: b_zone, text: Zone }
        - { id: b_geo, text: Geo }
        - { id: b_geozone, text: GeoZone }
answer:
  values: { edition: e_hs, ha: ha1, bsr: b_geozone }
explanation:
  correct:
    en: |
      Named replicas exist only in the Hyperscale service tier, and `--ha-replicas` can be set only for Hyperscale. A zone-redundant Hyperscale database requires at least one high availability replica and zone-redundant or geo-zone-redundant backup storage; one replica is the cheapest valid value. Of those two backup options, only GeoZone keeps backups in the paired region, which geo-restore to West Europe needs; like zone redundancy, it can be set only when the Hyperscale database is created.
    fr: |
      Les réplicas nommés n'existent qu'au niveau de service Hyperscale, et `--ha-replicas` ne peut être défini que pour Hyperscale. Une base de données Hyperscale redondante interzone exige au moins un réplica de haute disponibilité et un stockage de sauvegarde redondant interzone ou géoredondant interzone ; un réplica est la valeur valide la moins coûteuse. De ces deux options de sauvegarde, seule GeoZone conserve les sauvegardes dans la région jumelée, ce que la géorestauration vers West Europe exige ; comme la redondance interzone, ce paramètre ne peut être défini qu'à la création de la base de données Hyperscale.
  options:
    e_gp: { en: "General Purpose doesn't support named replicas or the --ha-replicas parameter.", fr: "General Purpose ne prend en charge ni les réplicas nommés ni le paramètre --ha-replicas." }
    e_bc: { en: "Business Critical has built-in replicas but no named replicas, and --ha-replicas is settable only for Hyperscale.", fr: "Business Critical dispose de réplicas intégrés mais pas de réplicas nommés, et --ha-replicas n'est définissable que pour Hyperscale." }
    ha0: { en: "Zone redundancy for Hyperscale requires at least one high availability replica.", fr: "La redondance interzone pour Hyperscale exige au moins un réplica de haute disponibilité." }
    ha2: { en: "Two replicas also work but cost more than the single replica that zone redundancy requires.", fr: "Deux réplicas fonctionnent aussi, mais coûtent plus cher que le réplica unique exigé par la redondance interzone." }
    ha4: { en: "Four replicas are the maximum and add compute cost that the requirement doesn't justify.", fr: "Quatre réplicas constituent le maximum et ajoutent un coût de calcul que l'exigence ne justifie pas." }
    b_local: { en: "Locally redundant backup storage isn't allowed with a zone-redundant Hyperscale database and doesn't allow geo-restore.", fr: "Le stockage de sauvegarde localement redondant n'est pas autorisé avec une base Hyperscale redondante interzone et ne permet pas la géorestauration." }
    b_zone: { en: "Zone-redundant backup storage stays in North Europe, so geo-restore isn't possible.", fr: "Le stockage de sauvegarde redondant interzone reste dans North Europe : la géorestauration n'est pas possible." }
    b_geo: { en: "Geo-redundant backup storage allows geo-restore but doesn't meet the zone-redundant or geo-zone-redundant requirement of a zone-redundant Hyperscale database.", fr: "Le stockage de sauvegarde géoredondant permet la géorestauration, mais ne satisfait pas l'obligation d'un stockage redondant interzone ou géoredondant interzone pour une base Hyperscale redondante interzone." }
references:
  - title: Availability through redundancy - Azure SQL Database
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/high-availability-sla-local-zone-redundancy
  - title: "az sql db"
    url: https://learn.microsoft.com/en-us/cli/azure/sql/db
