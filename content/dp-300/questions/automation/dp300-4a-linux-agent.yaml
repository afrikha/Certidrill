id: dp300-4a-linux-agent
objective: "4.1.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You deploy SQL Server 2022 on an Ubuntu Azure virtual machine and keep the default configuration. You create SQL Server Agent jobs by running a Transact-SQL script, but the jobs never run, and SQL Server Management Studio shows no content under the SQL Server Agent node.

    You need the jobs to run on their schedules.

    What should you do?
  fr: |
    Vous déployez SQL Server 2022 sur une machine virtuelle Azure Ubuntu en conservant la configuration par défaut. Vous créez des travaux SQL Server Agent en exécutant un script Transact-SQL, mais les travaux ne s'exécutent jamais et SQL Server Management Studio n'affiche aucun contenu sous le nœud SQL Server Agent.

    Les travaux doivent s'exécuter selon leurs planifications.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: "Run sudo /opt/mssql/bin/mssql-conf set sqlagent.enabled true, and then run sudo systemctl restart mssql-server." }
    - { id: b, text: "Run sudo apt-get install mssql-server-agent, and then run sudo systemctl restart mssql-server." }
    - { id: c, text: "Run sudo systemctl restart mssql-server without changing the configuration." }
    - { id: d, text: "Run sudo /opt/mssql/bin/mssql-conf set hadr.hadrenabled 1, and then run sudo systemctl restart mssql-server." }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Since SQL Server 2017 CU 4, SQL Server Agent is included in the mssql-server package on Linux but is disabled by default. You enable it with `mssql-conf set sqlagent.enabled true` and restart the mssql-server service.
    fr: |
      Depuis SQL Server 2017 CU 4, SQL Server Agent est inclus dans le package mssql-server sous Linux, mais il est désactivé par défaut. Vous l'activez avec `mssql-conf set sqlagent.enabled true` puis redémarrez le service mssql-server.
  options:
    b: { en: "A separate Agent package was only needed before SQL Server 2017 CU 4; SQL Server 2022 already includes the Agent.", fr: "Un package distinct pour l'Agent n'était nécessaire qu'avant SQL Server 2017 CU 4 ; SQL Server 2022 inclut déjà l'Agent." }
    c: { en: "A restart keeps the Agent disabled.", fr: "Un redémarrage laisse l'Agent désactivé." }
    d: { en: "hadr.hadrenabled enables availability groups, not SQL Server Agent.", fr: "hadr.hadrenabled active les groupes de disponibilité, pas SQL Server Agent." }
references:
  - title: Install SQL Server Agent on Linux
    url: https://learn.microsoft.com/en-us/sql/linux/sql-server-linux-setup-sql-agent
