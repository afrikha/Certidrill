id: dp300-4b-deploy-debug-sequence
objective: "4.2.4"
type: ordering
difficulty: 3
status: draft
stem:
  en: |
    A deployment named **sqldeploy** of a Bicep file named **main.bicep** to a resource group named **rg-sales** fails. The error message doesn't explain why the resource provider rejected the request for a database named **DB1**. The file contains a secure parameter for the server administrator password.

    You need to inspect the request and response content exchanged with the resource provider for DB1. When you finish, the password must not remain in the deployment history.

    Which three actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Un déploiement nommé **sqldeploy** d'un fichier Bicep nommé **main.bicep** dans un groupe de ressources nommé **rg-sales** échoue. Le message d'erreur n'explique pas pourquoi le fournisseur de ressources a rejeté la demande concernant une base de données nommée **DB1**. Le fichier contient un paramètre sécurisé pour le mot de passe de l'administrateur du serveur.

    Vous devez examiner le contenu de la demande et de la réponse échangées avec le fournisseur de ressources pour DB1. Une fois l'analyse terminée, le mot de passe ne doit pas rester dans l'historique de déploiement.

    Quelles sont les trois actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - { id: dbg, text: { en: "Deploy main.bicep again as sqldeploy by running New-AzResourceGroupDeployment with -DeploymentDebugLogLevel All.", fr: "Redéployer main.bicep sous le nom sqldeploy en exécutant New-AzResourceGroupDeployment avec -DeploymentDebugLogLevel All." } }
    - { id: cli, text: { en: "Run az deployment operation group list for sqldeploy and read the request and response properties.", fr: "Exécuter az deployment operation group list pour sqldeploy et lire les propriétés request et response." } }
    - { id: rm, text: { en: "Run Remove-AzResourceGroupDeployment for sqldeploy.", fr: "Exécuter Remove-AzResourceGroupDeployment pour sqldeploy." } }
    - { id: whatif, text: { en: "Run az deployment group what-if for main.bicep.", fr: "Exécuter az deployment group what-if pour main.bicep." } }
    - { id: export, text: { en: "Run az deployment group export for sqldeploy.", fr: "Exécuter az deployment group export pour sqldeploy." } }
    - { id: diag, text: { en: "Create a diagnostic setting that sends the activity log of the subscription to a Log Analytics workspace.", fr: "Créer un paramètre de diagnostic qui envoie le journal d'activité de l'abonnement vers un espace de travail Log Analytics." } }
answer:
  sequence: [ dbg, cli, rm ]
explanation:
  correct:
    en: |
      Debug logging must be requested when the deployment runs, and only Azure PowerShell can enable it (`-DeploymentDebugLogLevel All`, `RequestContent` or `ResponseContent`). Azure CLI then returns the logged request and response properties of each operation. Because debug logging can record secrets such as passwords, you remove the deployment from the history with `Remove-AzResourceGroupDeployment` once you are done.
    fr: |
      La journalisation de débogage doit être demandée au moment du déploiement, et seul Azure PowerShell peut l'activer (`-DeploymentDebugLogLevel All`, `RequestContent` ou `ResponseContent`). Azure CLI renvoie ensuite les propriétés request et response journalisées de chaque opération. Comme la journalisation de débogage peut enregistrer des secrets tels que des mots de passe, vous supprimez le déploiement de l'historique avec `Remove-AzResourceGroupDeployment` une fois l'analyse terminée.
  options:
    whatif: { en: "What-if predicts the changes of a deployment; it doesn't show what the resource provider received or returned.", fr: "What-if prédit les modifications d'un déploiement ; il n'affiche pas ce que le fournisseur de ressources a reçu ou renvoyé." }
    export: { en: "Export returns the template of the deployment, not the request and response content.", fr: "Export renvoie le modèle du déploiement, pas le contenu des demandes et des réponses." }
    diag: { en: "The activity log records the operations and their status, not the request and response bodies of a deployment.", fr: "Le journal d'activité enregistre les opérations et leur état, pas le corps des demandes et des réponses d'un déploiement." }
references:
  - title: Enable debug logging
    url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/troubleshooting/enable-debug-logging
