id: dp300-4a-alert-mechanisms
objective: "4.1.2"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    You have SQL Server 2022 on an Azure virtual machine. SQL Server Agent is configured to send email through Database Mail.

    Which SQL Server Agent feature should you configure for each requirement? To answer, drag the appropriate features to the correct requirements. Each feature may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez de SQL Server 2022 sur une machine virtuelle Azure. SQL Server Agent est configuré pour envoyer des e-mails via Database Mail.

    Quelle fonctionnalité de SQL Server Agent devez-vous configurer pour chaque exigence ? Pour répondre, faites glisser les fonctionnalités appropriées vers les exigences correspondantes. Chaque fonctionnalité peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: jobnotif, text: { en: "Job notification", fr: "Notification de travail" } }
    - { id: errnum, text: { en: "SQL Server event alert on an error number", fr: "Alerte d'événement SQL Server sur un numéro d'erreur" } }
    - { id: sev, text: { en: "SQL Server event alert on a severity level", fr: "Alerte d'événement SQL Server sur un niveau de gravité" } }
    - { id: perf, text: { en: "SQL Server performance condition alert", fr: "Alerte de condition de performances SQL Server" } }
    - { id: wmi, text: { en: "WMI event alert", fr: "Alerte d'événement WMI" } }
    - { id: failsafe, text: { en: "Fail-safe operator", fr: "Opérateur de prévention de défaillance" } }
  targets:
    - { id: t1, text: { en: "Email the DBA team when the NightlyETL job fails", fr: "Envoyer un e-mail à l'équipe DBA quand le travail NightlyETL échoue" } }
    - { id: t2, text: { en: "Email the DBA team when an application raises error 50010 by using RAISERROR WITH LOG", fr: "Envoyer un e-mail à l'équipe DBA quand une application lève l'erreur 50010 avec RAISERROR WITH LOG" } }
    - { id: t3, text: { en: "Email the DBA team when any error of severity 21 occurs", fr: "Envoyer un e-mail à l'équipe DBA quand une erreur de gravité 21 se produit" } }
    - { id: t4, text: { en: "Start a log backup job when the percentage of log used in SalesDB exceeds 85", fr: "Démarrer un travail de sauvegarde du journal quand le pourcentage de journal utilisé dans SalesDB dépasse 85" } }
    - { id: t5, text: { en: "Respond to an ALTER_TABLE server event captured through the WMI Provider for Server Events", fr: "Réagir à un événement serveur ALTER_TABLE capturé via le fournisseur WMI pour les événements de serveur" } }
answer:
  mapping: { t1: jobnotif, t2: errnum, t3: sev, t4: perf, t5: wmi }
explanation:
  correct:
    en: |
      A job notification reports the outcome of a job (success, failure or completion). Event alerts fire on a logged error number or on a severity level; errors raised WITH LOG and severities of 19 or higher are written to the application log. A performance condition alert compares a counter, such as Percent Log Used, with a threshold and can run a job. A WMI event alert reacts to WMI events such as DDL events.
    fr: |
      Une notification de travail signale le résultat d'un travail (réussite, échec ou fin d'exécution). Les alertes d'événement se déclenchent sur un numéro d'erreur journalisé ou sur un niveau de gravité ; les erreurs levées WITH LOG et les gravités 19 et plus sont écrites dans le journal des applications. Une alerte de condition de performances compare un compteur, comme Percent Log Used, à un seuil et peut exécuter un travail. Une alerte d'événement WMI réagit à des événements WMI comme les événements DDL.
  options:
    failsafe: { en: "A fail-safe operator is a fallback recipient for alerts, not a trigger.", fr: "Un opérateur de prévention de défaillance est un destinataire de secours pour les alertes, pas un déclencheur." }
references:
  - title: sp_add_alert (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/relational-databases/system-stored-procedures/sp-add-alert-transact-sql
  - title: sp_update_job (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/relational-databases/system-stored-procedures/sp-update-job-transact-sql
