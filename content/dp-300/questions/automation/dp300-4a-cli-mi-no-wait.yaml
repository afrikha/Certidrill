id: dp300-4a-cli-mi-no-wait
objective: "4.2.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A pipeline runs an Azure CLI script that creates a managed instance by using `az sql mi create`. The creation can take several hours, and the pipeline step times out while the command waits.

    You need the command to return as soon as Azure accepts the request, so that a later step can check the provisioning state.

    Which parameter should you add to `az sql mi create`?
  fr: |
    Un pipeline exécute un script Azure CLI qui crée une instance managée avec `az sql mi create`. La création peut prendre plusieurs heures, et l'étape du pipeline expire pendant que la commande attend.

    La commande doit rendre la main dès qu'Azure accepte la demande, afin qu'une étape ultérieure vérifie l'état d'approvisionnement.

    Quel paramètre devez-vous ajouter à `az sql mi create` ?
body:
  options:
    - { id: a, text: "--only-show-errors" }
    - { id: b, text: "--output none" }
    - { id: c, text: "--no-wait" }
    - { id: d, text: "--verbose" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      `--no-wait` tells Azure CLI not to wait for the long-running operation to finish: the command returns once the request is accepted, and the instance continues to be created.
    fr: |
      `--no-wait` indique à Azure CLI de ne pas attendre la fin de l'opération de longue durée : la commande rend la main dès que la demande est acceptée, et la création de l'instance se poursuit.
  options:
    a: { en: "This only hides warnings; the command still waits.", fr: "Cela masque seulement les avertissements ; la commande attend toujours." }
    b: { en: "This suppresses the output, not the wait.", fr: "Cela supprime la sortie, pas l'attente." }
    d: { en: "This adds logging and still waits for the operation.", fr: "Cela ajoute de la journalisation et attend toujours la fin de l'opération." }
references:
  - title: az sql mi
    url: https://learn.microsoft.com/en-us/cli/azure/sql/mi
