id: dp300-4a-cli-bc-options
objective: "4.2.3"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    You are writing an Azure CLI script that creates a Business Critical database named **OrdersDB** on a logical server named **sql-sales-01** in a region that supports availability zones.

    OrdersDB must meet the following requirements:

    - Remain available if one availability zone of the region fails.
    - Route connections that specify `ApplicationIntent=ReadOnly` to a built-in read-only replica.
    - Store backups in storage that is replicated across availability zones and never leaves the region.

    How should you complete the command? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous écrivez un script Azure CLI qui crée une base de données Business Critical nommée **OrdersDB** sur un serveur logique nommé **sql-sales-01** dans une région qui prend en charge les zones de disponibilité.

    OrdersDB doit répondre aux exigences suivantes :

    - Rester disponible en cas de défaillance d'une zone de disponibilité de la région.
    - Router les connexions qui indiquent `ApplicationIntent=ReadOnly` vers un réplica intégré en lecture seule.
    - Stocker les sauvegardes dans un stockage répliqué entre les zones de disponibilité qui ne quitte jamais la région.

    Comment devez-vous compléter la commande ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: bash
  template: |
    az sql db create --resource-group rg-sales --server sql-sales-01 --name OrdersDB \
      --edition BusinessCritical --family Gen5 --capacity 4 \
      [[zone]] \
      [[read]] \
      [[bsr]]
  slots:
    - id: zone
      options:
        - { id: zr, text: "--zone-redundant true" }
        - { id: ha, text: "--ha-replicas 2" }
        - { id: zrf, text: "--zone-redundant false" }
    - id: read
      options:
        - { id: rsoff, text: "--read-scale Disabled" }
        - { id: rson, text: "--read-scale Enabled" }
        - { id: rr, text: "--read-replicas 1" }
    - id: bsr
      options:
        - { id: local, text: "--backup-storage-redundancy Local" }
        - { id: zone, text: "--backup-storage-redundancy Zone" }
        - { id: geo, text: "--backup-storage-redundancy Geo" }
        - { id: geozone, text: "--backup-storage-redundancy GeoZone" }
answer:
  values: { zone: zr, read: rson, bsr: zone }
explanation:
  correct:
    en: |
      `--zone-redundant true` spreads the replicas of the database across availability zones. `--read-scale Enabled`, settable for Premium and Business Critical, routes read-only connections to a built-in secondary replica. `--backup-storage-redundancy Zone` stores backups in zone-redundant storage in the same region.
    fr: |
      `--zone-redundant true` répartit les réplicas de la base de données entre les zones de disponibilité. `--read-scale Enabled`, disponible pour Premium et Business Critical, route les connexions en lecture seule vers un réplica secondaire intégré. `--backup-storage-redundancy Zone` stocke les sauvegardes dans un stockage redondant interzone de la même région.
  options:
    ha: { en: "--ha-replicas is settable only for Hyperscale.", fr: "--ha-replicas n'est disponible que pour Hyperscale." }
    zrf: { en: "Without zone redundancy, all replicas can be in the same zone.", fr: "Sans redondance de zone, tous les réplicas peuvent se trouver dans la même zone." }
    rsoff: { en: "Disabled sends read-only connections to the primary replica.", fr: "Disabled envoie les connexions en lecture seule vers le réplica primaire." }
    rr: { en: "--read-replicas is an alias of --ha-replicas, which applies to Hyperscale only.", fr: "--read-replicas est un alias de --ha-replicas, qui ne s'applique qu'à Hyperscale." }
    local: { en: "Local keeps backups in a single datacenter, not across zones.", fr: "Local conserve les sauvegardes dans un seul centre de données, pas entre les zones." }
    geo: { en: "Geo replicates backups to the paired region, which leaves the region.", fr: "Geo réplique les sauvegardes dans la région jumelée, ce qui quitte la région." }
    geozone: { en: "GeoZone also replicates backups to the paired region.", fr: "GeoZone réplique aussi les sauvegardes dans la région jumelée." }
references:
  - title: az sql db
    url: https://learn.microsoft.com/en-us/cli/azure/sql/db
