id: dp300-4b-ts-executions-grid
objective: "4.3.4"
type: hotarea
difficulty: 2
status: draft
stem:
  en: |
    An elastic job named **TenantPatch** runs one job step against five tenant databases. The step uses the default retry policy. While the job is running, you query `jobs.job_executions` in the job database and get the results shown in the following table.

    Answer each prompt by selecting the target database.

    NOTE: Each correct selection is worth one point.
  fr: |
    Un travail élastique nommé **TenantPatch** exécute une étape de travail sur cinq bases de données de locataire. L'étape utilise la stratégie de nouvelle tentative par défaut. Pendant l'exécution du travail, vous interrogez `jobs.job_executions` dans la base de données de travaux et obtenez les résultats du tableau suivant.

    Répondez à chaque consigne en sélectionnant la base de données cible.

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
    - id: p1
      text: { en: "The database on which the step will run again automatically, without any action from you", fr: "La base de données sur laquelle l'étape s'exécutera de nouveau automatiquement, sans aucune action de votre part" }
    - id: p2
      text: { en: "The database on which the step used all its retry attempts and needs you to fix the cause and rerun the job", fr: "La base de données sur laquelle l'étape a épuisé toutes ses nouvelles tentatives et exige que vous corrigiez la cause puis réexécutiez le travail" }
  grid:
    header: [step_id, target_database_name, lifecycle]
    rows:
      - [{ text: "NULL" }, { text: "NULL" }, { text: InProgress }]
      - [{ text: "1" }, { text: Tenant01, area: d1 }, { text: Succeeded }]
      - [{ text: "1" }, { text: Tenant02, area: d2 }, { text: TimedOut }]
      - [{ text: "1" }, { text: Tenant03, area: d3 }, { text: WaitingForRetry }]
      - [{ text: "1" }, { text: Tenant04, area: d4 }, { text: Failed }]
      - [{ text: "1" }, { text: Tenant05, area: d5 }, { text: InProgress }]
answer:
  values: { p1: d3, p2: d4 }
explanation:
  correct:
    en: |
      The row with a NULL step_id is the parent job execution. WaitingForRetry means the step failed on that target and waits for its next attempt, which follows the retry policy (10 retries by default, with exponential backoff). Failed means the last retry also failed. TimedOut means the step exceeded `@step_timeout_seconds` (12 hours by default), which is a different cause than exhausted retries.
    fr: |
      La ligne dont step_id vaut NULL est l'exécution parente du travail. WaitingForRetry signifie que l'étape a échoué sur cette cible et attend sa prochaine tentative, qui suit la stratégie de nouvelle tentative (10 par défaut, avec un intervalle exponentiel). Failed signifie que la dernière tentative a elle aussi échoué. TimedOut signifie que l'étape a dépassé `@step_timeout_seconds` (12 heures par défaut), ce qui est une autre cause que l'épuisement des tentatives.
references:
  - title: jobs.sp_add_jobstep (Azure Elastic Jobs) (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/relational-databases/system-stored-procedures/sp-add-jobstep-elastic-jobs-transact-sql
  - title: Create and manage elastic jobs by using T-SQL
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/elastic-jobs-tsql-create-manage
