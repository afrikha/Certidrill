id: dp300-4a-cli-list-editions
objective: "4.2.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Before you run a script that creates Azure SQL databases in the **westeurope** region, you need to check which editions, service objectives and storage limits are available for your subscription in that region.

    Which Azure CLI command should you run?
  fr: |
    Avant d'exécuter un script qui crée des bases Azure SQL Database dans la région **westeurope**, vous devez vérifier quelles éditions, quels objectifs de service et quelles limites de stockage sont disponibles pour votre abonnement dans cette région.

    Quelle commande Azure CLI devez-vous exécuter ?
body:
  options:
    - { id: a, text: "az sql db list-editions --location westeurope -o table" }
    - { id: b, text: "az sql db list-usages --location westeurope -o table" }
    - { id: c, text: "az vm list-skus --location westeurope -o table" }
    - { id: d, text: "az sql db list --location westeurope -o table" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      `az sql db list-editions` shows the database editions available to the active subscription in a location (`--location` is required), including the service objectives and storage limits.
    fr: |
      `az sql db list-editions` affiche les éditions de base de données disponibles pour l'abonnement actif dans un emplacement (`--location` est obligatoire), y compris les objectifs de service et les limites de stockage.
  options:
    b: { en: "list-usages returns the usage of a given database, not the available editions.", fr: "list-usages renvoie l'utilisation d'une base de données donnée, pas les éditions disponibles." }
    c: { en: "This lists virtual machine sizes, not Azure SQL Database service objectives.", fr: "Cette commande liste les tailles de machines virtuelles, pas les objectifs de service d'Azure SQL Database." }
    d: { en: "az sql db list lists the existing databases of a server.", fr: "az sql db list liste les bases de données existantes d'un serveur." }
references:
  - title: az sql db
    url: https://learn.microsoft.com/en-us/cli/azure/sql/db
