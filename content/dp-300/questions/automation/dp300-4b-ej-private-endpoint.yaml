id: dp300-4b-ej-private-endpoint
objective: "4.3.1"
type: ordering
difficulty: 3
status: draft
stem:
  en: |
    An elastic job agent named **agent1** authenticates by using a user-assigned managed identity named **umi-jobs**. Users for umi-jobs exist in all the databases of a logical server named **srv-fin**. A job named **FinMaint** targets the databases of srv-fin.

    The **Public network access** setting of srv-fin is set to **Disable**, and every execution of FinMaint fails to connect to srv-fin.

    You need FinMaint to run against the databases of srv-fin. Public network access must stay disabled.

    Which three actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Un agent de travail élastique nommé **agent1** s'authentifie avec une identité managée affectée par l'utilisateur nommée **umi-jobs**. Des utilisateurs pour umi-jobs existent dans toutes les bases de données d'un serveur logique nommé **srv-fin**. Un travail nommé **FinMaint** cible les bases de données de srv-fin.

    Le paramètre **Public network access** de srv-fin a la valeur **Disable**, et chaque exécution de FinMaint échoue à se connecter à srv-fin.

    FinMaint doit s'exécuter sur les bases de données de srv-fin. L'accès réseau public doit rester désactivé.

    Quelles sont les trois actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - { id: pe, text: { en: "From the Private endpoints page of agent1, add a private endpoint for srv-fin.", fr: "Depuis la page Private endpoints d'agent1, ajouter un point de terminaison privé pour srv-fin." } }
    - { id: approve, text: { en: "On the Networking page of srv-fin, approve the pending private endpoint connection.", fr: "Dans la page Networking de srv-fin, approuver la connexion de point de terminaison privé en attente." } }
    - { id: start, text: { en: "Start FinMaint by running jobs.sp_start_job in the job database.", fr: "Démarrer FinMaint en exécutant jobs.sp_start_job dans la base de données de travaux." } }
    - { id: allow, text: { en: "On srv-fin, enable Allow Azure services and resources to access this server.", fr: "Sur srv-fin, activer Allow Azure services and resources to access this server." } }
    - { id: plink, text: { en: "Create a private endpoint for srv-fin in a virtual network of the subscription by using Private Link Center.", fr: "Créer un point de terminaison privé pour srv-fin dans un réseau virtuel de l'abonnement à l'aide de Private Link Center." } }
    - { id: fw, text: { en: "Add a server-level firewall rule on srv-fin for the outbound IP address of agent1.", fr: "Ajouter sur srv-fin une règle de pare-feu au niveau du serveur pour l'adresse IP sortante d'agent1." } }
answer:
  sequence: [ pe, approve, start ]
explanation:
  correct:
    en: |
      Elastic job private endpoints are service-managed private endpoints that only the job agent uses to reach a target server, and they work when public access is denied. You create one per target server from the agent, the request stays Pending until it is approved on the target server's Networking page, and then the job can connect.
    fr: |
      Les points de terminaison privés des travaux élastiques sont des points de terminaison privés managés par le service, que seul l'agent de travail utilise pour joindre un serveur cible, et ils fonctionnent lorsque l'accès public est refusé. Vous en créez un par serveur cible depuis l'agent ; la demande reste à l'état Pending jusqu'à son approbation dans la page Networking du serveur cible, puis le travail peut se connecter.
  options:
    allow: { en: "This setting only applies to public connections, which stay blocked while public network access is disabled.", fr: "Ce paramètre ne s'applique qu'aux connexions publiques, qui restent bloquées tant que l'accès réseau public est désactivé." }
    plink: { en: "A private endpoint in your own virtual network serves your clients; the job agent can't use it.", fr: "Un point de terminaison privé dans votre propre réseau virtuel sert vos clients ; l'agent de travail ne peut pas l'utiliser." }
    fw: { en: "Firewall rules apply to public connections, which are disabled on srv-fin.", fr: "Les règles de pare-feu s'appliquent aux connexions publiques, désactivées sur srv-fin." }
references:
  - title: Elastic jobs in Azure SQL Database
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/elastic-jobs-overview
  - title: Create, configure, and manage elastic jobs
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/elastic-jobs-tutorial
