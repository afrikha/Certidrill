id: dp300-4a-try-catch-step
objective: "4.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have an Azure SQL managed instance named **MI1**. A SQL Server Agent job named **LoadSales** has a Transact-SQL step that runs a stored procedure named **dbo.LoadDailySales**. The job is configured to email an operator when it fails.

    dbo.LoadDailySales uses a TRY...CATCH block. The CATCH block inserts the error details into a table named **dbo.LoadErrors** and ends.

    Last night, no rows were loaded and dbo.LoadErrors contains a new error, but the job history shows that the step succeeded and no email was sent.

    You need the job to report a failure whenever dbo.LoadDailySales hits an error.

    What should you do?
  fr: |
    Vous disposez d'une instance managée Azure SQL nommée **MI1**. Un travail SQL Server Agent nommé **LoadSales** comporte une étape Transact-SQL qui exécute une procédure stockée nommée **dbo.LoadDailySales**. Le travail est configuré pour envoyer un e-mail à un opérateur en cas d'échec.

    dbo.LoadDailySales utilise un bloc TRY...CATCH. Le bloc CATCH insère les détails de l'erreur dans une table nommée **dbo.LoadErrors**, puis se termine.

    La nuit dernière, aucune ligne n'a été chargée et dbo.LoadErrors contient une nouvelle erreur, mais l'historique du travail indique que l'étape a réussi et aucun e-mail n'a été envoyé.

    Le travail doit signaler un échec chaque fois que dbo.LoadDailySales rencontre une erreur.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Set @on_fail_action = 2 on the job step.", fr: "Définir @on_fail_action = 2 sur l'étape de travail." } }
    - { id: b, text: { en: "Add THROW at the end of the CATCH block of dbo.LoadDailySales.", fr: "Ajouter THROW à la fin du bloc CATCH de dbo.LoadDailySales." } }
    - { id: c, text: { en: "Set @retry_attempts = 2 on the job step.", fr: "Définir @retry_attempts = 2 sur l'étape de travail." } }
    - { id: d, text: { en: "Change the notification of the job to email the operator when the job completes.", fr: "Modifier la notification du travail pour envoyer un e-mail à l'opérateur à la fin de l'exécution du travail." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Errors trapped by a CATCH block aren't returned to the caller unless the CATCH block raises them again. The step therefore ends without an error and SQL Server Agent records a success. Re-raising the error with THROW makes the step, and then the job, fail, which triggers the failure notification.
    fr: |
      Les erreurs interceptées par un bloc CATCH ne sont pas renvoyées à l'appelant, sauf si le bloc CATCH les lève à nouveau. L'étape se termine donc sans erreur et SQL Server Agent enregistre une réussite. Relever l'erreur avec THROW fait échouer l'étape, puis le travail, ce qui déclenche la notification d'échec.
  options:
    a: { en: "The flow-control action on failure never applies, because the step does not fail.", fr: "L'action de contrôle du flux en cas d'échec ne s'applique jamais, car l'étape n'échoue pas." }
    c: { en: "Retries happen only after a failed step.", fr: "Les nouvelles tentatives n'ont lieu qu'après l'échec d'une étape." }
    d: { en: "An email on every completion does not make the job report a failure.", fr: "Un e-mail à chaque fin d'exécution ne fait pas signaler un échec par le travail." }
references:
  - title: TRY...CATCH (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/language-elements/try-catch-transact-sql
