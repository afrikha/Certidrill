id: dp300-4a-keyvault-password
objective: "4.2.1"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    You deploy a logical server by using an ARM template named **sqlserver.json** and a parameter file named **sqlserver.parameters.json**. The template declares the administrator password as a `securestring` parameter named **adminPassword**.

    The password is stored as a secret named **SqlAdminPwd** in a key vault named **KV1**. KV1 is in a different resource group of the same subscription. You have the Owner role on both resource groups.

    You need to deploy the template without storing the password in the template, in the parameter file or in the deployment pipeline.

    Which two actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous déployez un serveur logique à l'aide d'un modèle ARM nommé **sqlserver.json** et d'un fichier de paramètres nommé **sqlserver.parameters.json**. Le modèle déclare le mot de passe administrateur comme paramètre `securestring` nommé **adminPassword**.

    Le mot de passe est stocké comme secret nommé **SqlAdminPwd** dans un coffre de clés nommé **KV1**. KV1 se trouve dans un autre groupe de ressources du même abonnement. Vous disposez du rôle Owner sur les deux groupes de ressources.

    Vous devez déployer le modèle sans stocker le mot de passe dans le modèle, dans le fichier de paramètres ni dans le pipeline de déploiement.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Set enabledForTemplateDeployment to true on the KV1 key vault.", fr: "Définir enabledForTemplateDeployment sur true sur le coffre de clés KV1." } }
    - { id: b, text: { en: "In the parameter file, reference KV1 by its resource ID and the secret name.", fr: "Dans le fichier de paramètres, référencer KV1 par son ID de ressource et le nom du secret." } }
    - { id: c, text: { en: "In sqlserver.json, set the defaultValue of adminPassword to the URI of the SqlAdminPwd secret.", fr: "Dans sqlserver.json, définir la defaultValue de adminPassword sur l'URI du secret SqlAdminPwd." } }
    - { id: d, text: { en: "Grant the Key Vault Secrets User role on KV1 to the system-assigned managed identity of the logical server.", fr: "Attribuer le rôle Key Vault Secrets User sur KV1 à l'identité managée affectée par le système du serveur logique." } }
    - { id: e, text: { en: "Move KV1 to the resource group that contains the deployment.", fr: "Déplacer KV1 dans le groupe de ressources qui contient le déploiement." } }
answer: { optionIds: [ a, b ] }
explanation:
  correct:
    en: |
      Resource Manager reads the secret during the deployment when the key vault has `enabledForTemplateDeployment` set to true and the deploying user has `Microsoft.KeyVault/vaults/deploy/action` (included in Owner and Contributor). The secret is referenced from the parameter file with a `reference` object that contains `keyVault.id` and `secretName`, so the password value never appears in your files.
    fr: |
      Resource Manager lit le secret pendant le déploiement quand le coffre de clés a `enabledForTemplateDeployment` défini sur true et que l'utilisateur qui déploie dispose de `Microsoft.KeyVault/vaults/deploy/action` (inclus dans Owner et Contributor). Le secret est référencé dans le fichier de paramètres par un objet `reference` qui contient `keyVault.id` et `secretName` : la valeur du mot de passe n'apparaît jamais dans vos fichiers.
  options:
    c: { en: "A template parameter default can't reference a Key Vault secret; the reference belongs in the parameter file.", fr: "La valeur par défaut d'un paramètre de modèle ne peut pas référencer un secret Key Vault ; la référence doit figurer dans le fichier de paramètres." }
    d: { en: "Resource Manager retrieves the secret on behalf of the deploying user; the server's identity is not involved.", fr: "Resource Manager récupère le secret pour le compte de l'utilisateur qui déploie ; l'identité du serveur n'intervient pas." }
    e: { en: "The key vault can be in another resource group, or even another subscription.", fr: "Le coffre de clés peut se trouver dans un autre groupe de ressources, voire dans un autre abonnement." }
references:
  - title: Use Azure Key Vault to pass secure parameter value during deployment
    url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/templates/key-vault-parameter
