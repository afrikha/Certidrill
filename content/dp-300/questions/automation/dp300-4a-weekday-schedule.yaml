id: dp300-4a-weekday-schedule
objective: "4.1.1"
type: dropdown
difficulty: 2
status: draft
shuffle: false
stem:
  en: |
    You have SQL Server 2022 on an Azure virtual machine. A SQL Server Agent job named **StatsRefresh** updates statistics in a database named SalesDB.

    You need StatsRefresh to run every Monday, Tuesday, Wednesday, Thursday and Friday at 22:30.

    How should you complete the Transact-SQL script? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez de SQL Server 2022 sur une machine virtuelle Azure. Un travail SQL Server Agent nommé **StatsRefresh** met à jour les statistiques d'une base de données nommée SalesDB.

    StatsRefresh doit s'exécuter chaque lundi, mardi, mercredi, jeudi et vendredi à 22:30.

    Comment devez-vous compléter le script Transact-SQL ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: sql
  template: |
    USE msdb;
    EXEC sp_add_schedule
        @schedule_name = N'Weekdays 22:30',
        @freq_type = [[type]],
        @freq_interval = [[days]],
        @freq_recurrence_factor = 1,
        @active_start_time = [[time]];
    EXEC sp_attach_schedule
        @job_name = N'StatsRefresh',
        @schedule_name = N'Weekdays 22:30';
  slots:
    - id: type
      options:
        - { id: t4, text: "4" }
        - { id: t8, text: "8" }
        - { id: t16, text: "16" }
        - { id: t32, text: "32" }
    - id: days
      options:
        - { id: d31, text: "31" }
        - { id: d62, text: "62" }
        - { id: d65, text: "65" }
        - { id: d124, text: "124" }
    - id: time
      options:
        - { id: h2230, text: "2230" }
        - { id: h22300, text: "22300" }
        - { id: h103000, text: "103000" }
        - { id: h223000, text: "223000" }
answer:
  values: { type: t8, days: d62, time: h223000 }
explanation:
  correct:
    en: "`@freq_type = 8` creates a weekly schedule, and for a weekly schedule `@freq_interval` is a bit mask of days: Monday 2 + Tuesday 4 + Wednesday 8 + Thursday 16 + Friday 32 = 62. `@active_start_time` uses the HHmmss format on a 24-hour clock, so 22:30 is 223000."
    fr: "`@freq_type = 8` crée une planification hebdomadaire, et pour une planification hebdomadaire `@freq_interval` est un masque de bits des jours : lundi 2 + mardi 4 + mercredi 8 + jeudi 16 + vendredi 32 = 62. `@active_start_time` utilise le format HHmmss sur 24 heures : 22:30 s'écrit 223000."
  options:
    t4: { en: "4 is a daily schedule; it would also run on Saturday and Sunday.", fr: "4 correspond à une planification quotidienne ; elle s'exécuterait aussi le samedi et le dimanche." }
    t16: { en: "16 is a monthly schedule on a given day of the month.", fr: "16 correspond à une planification mensuelle un jour donné du mois." }
    t32: { en: "32 is a monthly relative schedule, such as the first Monday of the month.", fr: "32 correspond à une planification mensuelle relative, comme le premier lundi du mois." }
    d31: { en: "31 = Sunday to Thursday (1 + 2 + 4 + 8 + 16).", fr: "31 = du dimanche au jeudi (1 + 2 + 4 + 8 + 16)." }
    d65: { en: "65 = Saturday and Sunday (64 + 1).", fr: "65 = samedi et dimanche (64 + 1)." }
    d124: { en: "124 = Tuesday to Saturday (4 + 8 + 16 + 32 + 64).", fr: "124 = du mardi au samedi (4 + 8 + 16 + 32 + 64)." }
    h2230: { en: "In HHmmss format, 2230 means 00:22:30.", fr: "Au format HHmmss, 2230 signifie 00:22:30." }
    h22300: { en: "In HHmmss format, 22300 means 02:23:00.", fr: "Au format HHmmss, 22300 signifie 02:23:00." }
    h103000: { en: "103000 is 10:30 in the morning; the format is a 24-hour clock.", fr: "103000 correspond à 10:30 le matin ; le format est sur 24 heures." }
references:
  - title: sp_add_schedule (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/relational-databases/system-stored-procedures/sp-add-schedule-transact-sql
