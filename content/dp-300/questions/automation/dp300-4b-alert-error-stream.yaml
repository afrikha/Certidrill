id: dp300-4b-alert-error-stream
objective: "4.3.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A runbook named **rb-export** in an Azure Automation account exports Azure SQL databases to BACPAC files. When an export fails, the runbook catches the exception, writes it by using `Write-Error`, and continues with the next database. The jobs of rb-export therefore end with the Completed status even when an export fails.

    A diagnostic setting sends the Job Logs and Job Streams categories of the account to a Log Analytics workspace.

    You need an alert when a job of rb-export reports an export error. What should you create?
  fr: |
    Un runbook nommé **rb-export** dans un compte Automation exporte des bases de données Azure SQL vers des fichiers BACPAC. Lorsqu'une exportation échoue, le runbook intercepte l'exception, l'écrit avec `Write-Error` et passe à la base suivante. Les travaux de rb-export se terminent donc avec l'état Completed même lorsqu'une exportation échoue.

    Un paramètre de diagnostic envoie les catégories Job Logs et Job Streams du compte vers un espace de travail Log Analytics.

    Vous avez besoin d'une alerte lorsqu'un travail de rb-export signale une erreur d'exportation. Que devez-vous créer ?
body:
  options:
    - { id: a, text: { en: "A log search alert rule on the JobStreams records whose StreamType_s is Error", fr: "Une règle d'alerte de recherche dans les journaux sur les enregistrements JobStreams dont StreamType_s vaut Error" } }
    - { id: b, text: { en: "A log search alert rule on the JobLogs records whose ResultType is Failed", fr: "Une règle d'alerte de recherche dans les journaux sur les enregistrements JobLogs dont ResultType vaut Failed" } }
    - { id: c, text: { en: "A metric alert rule on the Total Jobs metric with the Status dimension set to Failed", fr: "Une règle d'alerte de métrique sur la métrique Total Jobs avec la dimension Status définie sur Failed" } }
    - { id: d, text: { en: "A metric alert rule on the Total Jobs metric with the Status dimension set to Completed", fr: "Une règle d'alerte de métrique sur la métrique Total Jobs avec la dimension Status définie sur Completed" } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      A non-terminating error doesn't change the job status, but `Write-Error` writes a record to the Error stream. With Job Streams sent to Log Analytics, a log search alert on JobStreams records whose `StreamType_s` is Error detects jobs that completed with errors.
    fr: |
      Une erreur sans fin d'exécution ne modifie pas l'état du travail, mais `Write-Error` écrit un enregistrement dans le flux Error. Avec Job Streams envoyé vers Log Analytics, une alerte de recherche dans les journaux sur les enregistrements JobStreams dont `StreamType_s` vaut Error détecte les travaux terminés avec des erreurs.
  options:
    b: { en: "The jobs end as Completed, so no JobLogs record has the Failed status.", fr: "Les travaux se terminent avec l'état Completed : aucun enregistrement JobLogs n'a l'état Failed." }
    c: { en: "The Failed status never occurs for these jobs, so the alert never fires.", fr: "L'état Failed ne se produit jamais pour ces travaux : l'alerte ne se déclencherait jamais." }
    d: { en: "Every successful job is also Completed, so this alert would fire after each run.", fr: "Chaque travail réussi a aussi l'état Completed : cette alerte se déclencherait après chaque exécution." }
references:
  - title: Forward Azure Automation diagnostic logs to Azure Monitor
    url: https://learn.microsoft.com/en-us/azure/automation/automation-manage-send-joblogs-log-analytics
