id: dp300-4b-ts-login-failed
objective: "4.3.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An elastic job agent named **agent1** authenticates by using a user-assigned managed identity named **umi-jobs**. Its target group contains a logical server named **srv-saas**. Last month, you created users for umi-jobs in `master` and in every database of srv-saas.

    Yesterday, a database named **Tenant42** was created on srv-saas. During the last run, the job step succeeded on every database of srv-saas except Tenant42, where the login failed for umi-jobs.

    You need the job to succeed on Tenant42. What should you do?
  fr: |
    Un agent de travail élastique nommé **agent1** s'authentifie avec une identité managée affectée par l'utilisateur nommée **umi-jobs**. Son groupe cible contient un serveur logique nommé **srv-saas**. Le mois dernier, vous avez créé des utilisateurs pour umi-jobs dans `master` et dans chaque base de données de srv-saas.

    Hier, une base de données nommée **Tenant42** a été créée sur srv-saas. Lors de la dernière exécution, l'étape de travail a réussi sur toutes les bases de srv-saas sauf Tenant42, où la connexion a échoué pour umi-jobs.

    Le travail doit réussir sur Tenant42. Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Add Tenant42 to the target group as a SqlDatabase member.", fr: "Ajouter Tenant42 au groupe cible en tant que membre SqlDatabase." } }
    - { id: b, text: { en: "In Tenant42, create a user for umi-jobs FROM EXTERNAL PROVIDER and grant it the required permissions.", fr: "Dans Tenant42, créer un utilisateur pour umi-jobs FROM EXTERNAL PROVIDER et lui accorder les autorisations nécessaires." } }
    - { id: c, text: { en: "Create a database-level firewall rule in Tenant42 for agent1.", fr: "Créer dans Tenant42 une règle de pare-feu au niveau de la base de données pour agent1." } }
    - { id: d, text: { en: "Change the service tier of agent1 to a higher tier.", fr: "Passer agent1 à un niveau de service supérieur." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      The server member was enumerated at run time, so Tenant42 was already a target, and the connection reached it. The login failed because the managed identity needs a user in every target database, and Tenant42 was created after the users. Create the user and grant the permissions the script needs.
    fr: |
      Le membre serveur a été énuméré au moment de l'exécution : Tenant42 était donc déjà une cible, et la connexion l'a atteinte. La connexion a échoué car l'identité managée a besoin d'un utilisateur dans chaque base de données cible, et Tenant42 a été créée après les utilisateurs. Créez l'utilisateur et accordez-lui les autorisations nécessaires au script.
  options:
    a: { en: "Tenant42 is already included through the server member, which is enumerated at each run.", fr: "Tenant42 est déjà incluse via le membre serveur, énuméré à chaque exécution." }
    c: { en: "The other databases of the same server are reachable, and the error is an authentication failure, not a blocked connection.", fr: "Les autres bases du même serveur sont joignables, et l'erreur est un échec d'authentification, pas une connexion bloquée." }
    d: { en: "The agent tier only sets the number of concurrent target connections.", fr: "Le niveau de l'agent ne fixe que le nombre de connexions simultanées aux cibles." }
references:
  - title: Elastic jobs in Azure SQL Database
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/elastic-jobs-overview
