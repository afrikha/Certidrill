id: dp300-4b-ts-symptom-fix
objective: "4.3.4"
type: dragdrop
difficulty: 3
status: draft
stem:
  en: |
    Adatum uses an elastic job agent named **agent1** whose job database is on a logical server named **srv-jobs**. You investigate four problems.

    Which action should you take for each problem? To answer, drag the appropriate actions to the correct problems. Each action may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum utilise un agent de travail élastique nommé **agent1** dont la base de données de travaux se trouve sur un serveur logique nommé **srv-jobs**. Vous examinez quatre problèmes.

    Quelle action devez-vous effectuer pour chaque problème ? Pour répondre, faites glisser les actions appropriées vers les problèmes correspondants. Chaque action peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: future, text: { en: "Set the schedule start time to a future time before enabling the job.", fr: "Définir l'heure de début de la planification à une heure future avant d'activer le travail." } }
    - { id: recreate, text: { en: "Re-create and start the job agent in the new region.", fr: "Recréer et démarrer l'agent de travail dans la nouvelle région." } }
    - { id: predicate, text: { en: "Add an audit predicate that excludes the elastic jobs application name.", fr: "Ajouter un prédicat d'audit qui exclut le nom d'application des travaux élastiques." } }
    - { id: scaledb, text: { en: "Scale up the job database.", fr: "Augmenter la taille de la base de données de travaux." } }
    - { id: tier, text: { en: "Change agent1 to a higher service tier.", fr: "Passer agent1 à un niveau de service supérieur." } }
    - { id: timeout, text: { en: "Increase @step_timeout_seconds of the job steps.", fr: "Augmenter @step_timeout_seconds des étapes de travail." } }
  targets:
    - id: t1
      text: { en: "A daily job scheduled at 22:00 UTC was disabled for a week. It runs immediately when you enable it at 09:00 UTC.", fr: "Un travail quotidien planifié à 22:00 UTC a été désactivé pendant une semaine. Il s'exécute immédiatement lorsque vous l'activez à 09:00 UTC." }
    - id: t2
      text: { en: "After srv-jobs fails over to another region, no job runs.", fr: "Après le basculement de srv-jobs vers une autre région, aucun travail ne s'exécute." }
    - id: t3
      text: { en: "Server auditing on srv-jobs writes a very large number of records about the job database.", fr: "L'audit du serveur srv-jobs écrit un très grand nombre d'enregistrements concernant la base de données de travaux." }
    - id: t4
      text: { en: "Jobs start late, and the CPU and log write utilization of the job database stay close to 100%.", fr: "Les travaux démarrent en retard, et l'utilisation du processeur et de l'écriture de journal de la base de données de travaux reste proche de 100 %." }
answer:
  mapping: { t1: future, t2: recreate, t3: predicate, t4: scaledb }
explanation:
  correct:
    en: |
      A schedule that starts in the past makes a job run immediately when it is enabled, to catch up on the missed event. After a regional failover, the job database and definitions move, but the agent is compute only and must be re-created and started in the new region. The agent polls the job database constantly, so auditing generates many records; filter them with a predicate on the elastic jobs application name. When the job database's CPU, data IO or log write nears 100%, scale it up.
    fr: |
      Une planification qui commence dans le passé fait s'exécuter le travail dès son activation, pour rattraper l'événement manqué. Après un basculement régional, la base de données de travaux et les définitions sont déplacées, mais l'agent n'est qu'une ressource de calcul et doit être recréé et démarré dans la nouvelle région. L'agent interroge la base de données de travaux en permanence : l'audit génère donc de nombreux enregistrements, que vous filtrez avec un prédicat sur le nom d'application des travaux élastiques. Lorsque le processeur, les E/S de données ou l'écriture de journal de la base de travaux approchent 100 %, augmentez sa taille.
  options:
    tier: { en: "The agent tier raises the number of concurrent target connections; it doesn't relieve a saturated job database.", fr: "Le niveau de l'agent augmente le nombre de connexions simultanées aux cibles ; il ne soulage pas une base de travaux saturée." }
    timeout: { en: "The step timeout limits how long a step runs on a target; none of the problems is a timeout.", fr: "Le délai d'expiration d'étape limite la durée d'exécution d'une étape sur une cible ; aucun des problèmes n'est un dépassement de délai." }
references:
  - title: Elastic jobs in Azure SQL Database
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/elastic-jobs-overview
