id: dp300-4a-business-hours-schedule
objective: "4.1.1"
type: dropdown
difficulty: 3
status: draft
shuffle: false
stem:
  en: |
    You have an Azure SQL managed instance named **MI1**. A SQL Server Agent job named **SyncPrices** copies price changes into a reporting table.

    SyncPrices must run every day, every 15 minutes, from 07:00 until 19:00. No run may start after 19:00.

    How should you complete the Transact-SQL script? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'une instance managée Azure SQL nommée **MI1**. Un travail SQL Server Agent nommé **SyncPrices** copie les modifications de prix dans une table de reporting.

    SyncPrices doit s'exécuter chaque jour, toutes les 15 minutes, de 07:00 à 19:00. Aucune exécution ne doit démarrer après 19:00.

    Comment devez-vous compléter le script Transact-SQL ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: sql
  template: |
    EXEC msdb.dbo.sp_add_schedule
        @schedule_name = N'Every 15 minutes 07-19',
        @freq_type = 4,
        @freq_interval = 1,
        @freq_subday_type = [[unit]],
        @freq_subday_interval = [[interval]],
        @active_start_time = 070000,
        @active_end_time = [[endtime]];
    EXEC msdb.dbo.sp_attach_schedule
        @job_name = N'SyncPrices',
        @schedule_name = N'Every 15 minutes 07-19';
  slots:
    - id: unit
      options:
        - { id: u1, text: "1" }
        - { id: u2, text: "2" }
        - { id: u4, text: "4" }
        - { id: u8, text: "8" }
    - id: interval
      options:
        - { id: i4, text: "4" }
        - { id: i15, text: "15" }
        - { id: i900, text: "900" }
    - id: endtime
      options:
        - { id: e1900, text: "1900" }
        - { id: e120000, text: "120000" }
        - { id: e190000, text: "190000" }
        - { id: e235959, text: "235959" }
answer:
  values: { unit: u4, interval: i15, endtime: e190000 }
explanation:
  correct:
    en: |
      `@freq_subday_type = 4` sets the unit to minutes, and `@freq_subday_interval = 15` repeats the job every 15 minutes within the day. `@active_start_time` and `@active_end_time` (HHmmss) bound the daily window, so 190000 stops new runs after 19:00.
    fr: |
      `@freq_subday_type = 4` définit l'unité en minutes, et `@freq_subday_interval = 15` répète le travail toutes les 15 minutes au cours de la journée. `@active_start_time` et `@active_end_time` (HHmmss) délimitent la fenêtre quotidienne : 190000 empêche les nouvelles exécutions après 19:00.
  options:
    u1: { en: "1 means at the specified time only; the interval would be ignored.", fr: "1 signifie uniquement à l'heure indiquée ; l'intervalle serait ignoré." }
    u2: { en: "2 is seconds: with 15, the job would start every 15 seconds.", fr: "2 correspond aux secondes : avec 15, le travail démarrerait toutes les 15 secondes." }
    u8: { en: "8 is hours: with 15, the job would run every 15 hours.", fr: "8 correspond aux heures : avec 15, le travail s'exécuterait toutes les 15 heures." }
    i4: { en: "The interval is a number of units; 4 would mean every 4 minutes.", fr: "L'intervalle est un nombre d'unités ; 4 signifierait toutes les 4 minutes." }
    i900: { en: "900 minutes is 15 hours, not 15 minutes.", fr: "900 minutes font 15 heures, pas 15 minutes." }
    e1900: { en: "In HHmmss format, 1900 means 00:19:00.", fr: "Au format HHmmss, 1900 signifie 00:19:00." }
    e120000: { en: "120000 is noon, which ends the window too early.", fr: "120000 correspond à midi, ce qui termine la fenêtre trop tôt." }
    e235959: { en: "235959 is the default end time; runs would continue until midnight.", fr: "235959 est l'heure de fin par défaut ; les exécutions continueraient jusqu'à minuit." }
references:
  - title: sp_add_schedule (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/relational-databases/system-stored-procedures/sp-add-schedule-transact-sql
