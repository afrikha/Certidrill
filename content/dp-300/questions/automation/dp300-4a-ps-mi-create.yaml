id: dp300-4a-ps-mi-create
objective: "4.2.2"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    You are writing an Azure PowerShell script that creates a Business Critical managed instance named **sqlmi-contoso** in an existing subnet that is prepared for SQL Managed Instance.

    The solution must meet the following requirements:

    - Contoso's existing SQL Server licenses with Software Assurance must be used to reduce the price of the instance.
    - The script must continue to the next commands without waiting for the instance creation, which can take several hours.

    How should you complete the script? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous écrivez un script Azure PowerShell qui crée une instance managée Business Critical nommée **sqlmi-contoso** dans un sous-réseau existant préparé pour SQL Managed Instance.

    La solution doit répondre aux exigences suivantes :

    - Les licences SQL Server existantes de Contoso avec Software Assurance doivent être utilisées pour réduire le prix de l'instance.
    - Le script doit passer aux commandes suivantes sans attendre la création de l'instance, qui peut prendre plusieurs heures.

    Comment devez-vous compléter le script ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: powershell
  template: |
    $vnet = Get-AzVirtualNetwork -Name vnet-data -ResourceGroupName rg-data
    $subnet = Get-AzVirtualNetworkSubnetConfig -Name snet-mi -VirtualNetwork $vnet
    New-AzSqlInstance -Name sqlmi-contoso -ResourceGroupName rg-data -Location westeurope `
      -SubnetId $subnet.Id -AdministratorCredential (Get-Credential) `
      -Edition BusinessCritical -ComputeGeneration Gen5 -VCore 8 -StorageSizeInGB 256 `
      -LicenseType [[lic]] [[async]]
  slots:
    - id: lic
      options:
        - { id: base, text: BasePrice }
        - { id: incl, text: LicenseIncluded }
        - { id: ahub, text: AHUB }
        - { id: dr, text: DR }
    - id: async
      options:
        - { id: asjob, text: "-AsJob" }
        - { id: force, text: "-Force" }
        - { id: whatif, text: "-WhatIf" }
answer:
  values: { lic: base, async: asjob }
explanation:
  correct:
    en: |
      For a managed instance, `-LicenseType BasePrice` applies the Azure Hybrid Benefit discount for existing SQL Server licenses, whereas `LicenseIncluded` includes a new SQL Server license in the price. `-AsJob` runs the cmdlet in the background and returns a job object immediately.
    fr: |
      Pour une instance managée, `-LicenseType BasePrice` applique la remise Azure Hybrid Benefit pour les licences SQL Server existantes, alors que `LicenseIncluded` inclut une nouvelle licence SQL Server dans le prix. `-AsJob` exécute l'applet de commande en arrière-plan et renvoie immédiatement un objet de travail.
  options:
    incl: { en: "LicenseIncluded charges for a new SQL Server license.", fr: "LicenseIncluded facture une nouvelle licence SQL Server." }
    ahub: { en: "AHUB is the license type value of SQL Server on Azure VMs, not of managed instances.", fr: "AHUB est la valeur de type de licence de SQL Server sur machines virtuelles Azure, pas des instances managées." }
    dr: { en: "DR is the free HA/DR replica license type for SQL Server on Azure VMs.", fr: "DR est le type de licence de réplica HA/DR gratuit pour SQL Server sur machines virtuelles Azure." }
    force: { en: "-Force skips the confirmation message; the cmdlet still waits for the operation.", fr: "-Force ignore le message de confirmation ; l'applet de commande attend toujours la fin de l'opération." }
    whatif: { en: "-WhatIf only shows what would happen and creates nothing.", fr: "-WhatIf montre seulement ce qui se passerait et ne crée rien." }
references:
  - title: New-AzSqlInstance
    url: https://learn.microsoft.com/en-us/powershell/module/az.sql/new-azsqlinstance
