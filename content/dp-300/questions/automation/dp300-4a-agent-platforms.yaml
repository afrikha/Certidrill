id: dp300-4a-agent-platforms
objective: "4.1.1"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    Fabrikam has the following database resources:

    | Name | Type |
    | --- | --- |
    | SQLVM1 | SQL Server 2022 Enterprise on a Windows Azure virtual machine |
    | MI1 | Azure SQL Managed Instance |
    | DB1 | Azure SQL Database single database (General Purpose) |
    | DB2 | Azure SQL Database (Hyperscale) |

    You need to run a weekly Transact-SQL index maintenance script on a schedule by using SQL Server Agent.

    On which two resources can you create the SQL Server Agent job?

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam dispose des ressources de base de données suivantes :

    | Nom | Type |
    | --- | --- |
    | SQLVM1 | SQL Server 2022 Enterprise sur une machine virtuelle Azure Windows |
    | MI1 | Azure SQL Managed Instance |
    | DB1 | Base de données unique Azure SQL Database (General Purpose) |
    | DB2 | Azure SQL Database (Hyperscale) |

    Vous devez exécuter selon une planification un script Transact-SQL hebdomadaire de maintenance des index à l'aide de SQL Server Agent.

    Sur quelles deux ressources pouvez-vous créer le travail SQL Server Agent ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: SQLVM1 }
    - { id: b, text: MI1 }
    - { id: c, text: DB1 }
    - { id: d, text: DB2 }
answer: { optionIds: [ a, b ] }
explanation:
  correct:
    en: |
      SQL Server Agent is part of SQL Server, including SQL Server on Azure virtual machines, and Azure SQL Managed Instance runs SQL Server Agent permanently. Azure SQL Database has no SQL Server Agent, whatever its service tier: scheduled T-SQL on Azure SQL Database uses elastic jobs instead.
    fr: |
      SQL Server Agent fait partie de SQL Server, y compris SQL Server sur des machines virtuelles Azure, et Azure SQL Managed Instance exécute SQL Server Agent en permanence. Azure SQL Database n'a pas de SQL Server Agent, quel que soit son niveau de service : le T-SQL planifié sur Azure SQL Database utilise à la place les travaux élastiques.
  options:
    c: { en: "Azure SQL Database (General Purpose) has no SQL Server Agent; use an elastic job.", fr: "Azure SQL Database (General Purpose) n'a pas de SQL Server Agent ; utilisez un travail élastique." }
    d: { en: "Hyperscale is a service tier of Azure SQL Database, which has no SQL Server Agent.", fr: "Hyperscale est un niveau de service d'Azure SQL Database, qui n'a pas de SQL Server Agent." }
references:
  - title: Automate management tasks using SQL Agent jobs in Azure SQL Managed Instance
    url: https://learn.microsoft.com/en-us/azure/azure-sql/managed-instance/job-automation-managed-instance
