id: dp300-4b-alert-mi-operator
objective: "4.3.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    An Azure SQL managed instance named **MI1** has Database Mail enabled with a profile named **AzureManagedInstance_dbmail_profile**. A SQL Server Agent job named **NightlyLoad** runs on MI1.

    You need an email to be sent to dba@contoso.com when NightlyLoad fails, and only then.

    Which two actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Une instance managée Azure SQL nommée **MI1** dispose de Database Mail activé avec un profil nommé **AzureManagedInstance_dbmail_profile**. Un travail SQL Server Agent nommé **NightlyLoad** s'exécute sur MI1.

    Un e-mail doit être envoyé à dba@contoso.com lorsque NightlyLoad échoue, et uniquement dans ce cas.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Run msdb.dbo.sp_add_alert to create an alert for the failures of NightlyLoad.", fr: "Exécuter msdb.dbo.sp_add_alert pour créer une alerte sur les échecs de NightlyLoad." } }
    - { id: b, text: { en: "Run msdb.dbo.sp_add_operator to create an operator whose email address is dba@contoso.com.", fr: "Exécuter msdb.dbo.sp_add_operator pour créer un opérateur dont l'adresse e-mail est dba@contoso.com." } }
    - { id: c, text: { en: "Enable the mail profile on the Alert System page of the SQL Server Agent properties.", fr: "Activer le profil de messagerie dans la page Alert System des propriétés de SQL Server Agent." } }
    - { id: d, text: { en: "Set the pager email name of the operator to dba@contoso.com.", fr: "Définir dba@contoso.com comme nom de messagerie de radiomessagerie de l'opérateur." } }
    - { id: e, text: { en: "Run msdb.dbo.sp_update_job for NightlyLoad with @notify_level_email = 2 and the operator.", fr: "Exécuter msdb.dbo.sp_update_job pour NightlyLoad avec @notify_level_email = 2 et l'opérateur." } }
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: |
      On SQL Managed Instance, SQL Server Agent sends email notifications to operators through the AzureManagedInstance_dbmail_profile profile. You create the operator with its email address, then set the job notification with `@notify_level_email = 2` (on failure) and `@notify_email_operator_name`.
    fr: |
      Sur SQL Managed Instance, SQL Server Agent envoie les notifications par e-mail aux opérateurs via le profil AzureManagedInstance_dbmail_profile. Vous créez l'opérateur avec son adresse e-mail, puis vous définissez la notification du travail avec `@notify_level_email = 2` (en cas d'échec) et `@notify_email_operator_name`.
  options:
    a: { en: "SQL Server Agent alerts aren't supported on SQL Managed Instance.", fr: "Les alertes SQL Server Agent ne sont pas prises en charge sur SQL Managed Instance." }
    c: { en: "SQL Server Agent settings are read-only on SQL Managed Instance; the profile name alone is what Agent uses.", fr: "Les paramètres de SQL Server Agent sont en lecture seule sur SQL Managed Instance ; seul le nom du profil compte pour Agent." }
    d: { en: "Pager notifications aren't supported on SQL Managed Instance.", fr: "Les notifications par radiomessagerie ne sont pas prises en charge sur SQL Managed Instance." }
references:
  - title: Automate management tasks using SQL Agent jobs in Azure SQL Managed Instance
    url: https://learn.microsoft.com/en-us/azure/azure-sql/managed-instance/job-automation-managed-instance
