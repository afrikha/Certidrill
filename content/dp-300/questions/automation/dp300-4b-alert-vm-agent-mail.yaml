id: dp300-4b-alert-vm-agent-mail
objective: "4.3.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    An Azure virtual machine named **VM1** runs SQL Server 2022. You perform the following actions on the instance:

    - Enable Database Mail and create a profile named **DbaMail**. A test email sent from SQL Server Management Studio by using DbaMail is received.
    - Create an operator named **DBA-Team**.
    - Configure a job named **Nightly** to send an email to DBA-Team when the job fails.

    Nightly fails, but DBA-Team receives no email.

    You need the notifications to be sent. What should you do?
  fr: |
    Une machine virtuelle Azure nommée **VM1** exécute SQL Server 2022. Vous effectuez les actions suivantes sur l'instance :

    - Activer Database Mail et créer un profil nommé **DbaMail**. Un e-mail de test envoyé depuis SQL Server Management Studio avec DbaMail est bien reçu.
    - Créer un opérateur nommé **DBA-Team**.
    - Configurer un travail nommé **Nightly** pour qu'il envoie un e-mail à DBA-Team en cas d'échec.

    Nightly échoue, mais DBA-Team ne reçoit aucun e-mail.

    Vous devez faire en sorte que les notifications soient envoyées. Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Run sp_configure to enable the Database Mail XPs option, and then run RECONFIGURE.", fr: "Exécuter sp_configure pour activer l'option Database Mail XPs, puis exécuter RECONFIGURE." } }
    - { id: b, text: { en: "Rename the DbaMail profile to AzureManagedInstance_dbmail_profile.", fr: "Renommer le profil DbaMail en AzureManagedInstance_dbmail_profile." } }
    - { id: c, text: { en: "Add an outbound rule for the SMTP port to the network security group of VM1.", fr: "Ajouter une règle sortante pour le port SMTP au groupe de sécurité réseau de VM1." } }
    - { id: d, text: { en: "Select DbaMail as the mail profile of SQL Server Agent, and then restart SQL Server Agent.", fr: "Sélectionner DbaMail comme profil de messagerie de SQL Server Agent, puis redémarrer SQL Server Agent." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      On SQL Server, SQL Server Agent sends notifications only after you enable a mail profile on the Alert System page of its properties, select Database Mail and the profile, and restart SQL Server Agent. Database Mail itself already works, as the test email proves.
    fr: |
      Sur SQL Server, SQL Server Agent n'envoie de notifications qu'après l'activation d'un profil de messagerie dans la page Alert System de ses propriétés, la sélection de Database Mail et du profil, puis le redémarrage de SQL Server Agent. Database Mail fonctionne déjà, comme le prouve l'e-mail de test.
  options:
    a: { en: "The test email succeeded, so Database Mail is already enabled.", fr: "L'e-mail de test a réussi : Database Mail est donc déjà activé." }
    b: { en: "That profile name is required only on Azure SQL Managed Instance.", fr: "Ce nom de profil n'est exigé que sur Azure SQL Managed Instance." }
    c: { en: "The test email reached its recipient, so the SMTP traffic isn't blocked.", fr: "L'e-mail de test est arrivé à destination : le trafic SMTP n'est donc pas bloqué." }
references:
  - title: Configure SQL Server Agent Mail to Use Database Mail
    url: https://learn.microsoft.com/en-us/sql/relational-databases/database-mail/configure-sql-server-agent-mail-to-use-database-mail
