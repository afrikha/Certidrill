id: dp300-4b-ts-history-facts
objective: "4.3.4"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    You troubleshoot the jobs of an elastic job agent named **agent1**, whose job database is named **JobsDb**. The jobs run against 120 databases of Azure SQL Database.

    Which two statements about the execution history of agent1's jobs are true?

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous diagnostiquez les travaux d'un agent de travail élastique nommé **agent1**, dont la base de données de travaux s'appelle **JobsDb**. Les travaux s'exécutent sur 120 bases de données Azure SQL Database.

    Quelles sont les deux affirmations vraies concernant l'historique d'exécution des travaux d'agent1 ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Each target database stores its own execution history in msdb.dbo.sysjobhistory.", fr: "Chaque base de données cible stocke son propre historique d'exécution dans msdb.dbo.sysjobhistory." } }
    - { id: b, text: { en: "You can query the history in the jobs.job_executions view of JobsDb.", fr: "Vous pouvez interroger l'historique dans la vue jobs.job_executions de JobsDb." } }
    - { id: c, text: { en: "The history is limited to 1,000 rows in total and 100 rows per job.", fr: "L'historique est limité à 1 000 lignes au total et à 100 lignes par travail." } }
    - { id: d, text: { en: "History older than 45 days is purged automatically.", fr: "L'historique de plus de 45 jours est purgé automatiquement." } }
    - { id: e, text: { en: "Members of the jobs_reader role in JobsDb can change job definitions.", fr: "Les membres du rôle jobs_reader de JobsDb peuvent modifier les définitions des travaux." } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |
      Elastic job history is kept in the job database and exposed by `jobs.job_executions`, with one parent row per execution and child rows per step and target. A system cleanup removes history older than 45 days; `jobs.sp_purge_jobhistory` removes newer history on demand.
    fr: |
      L'historique des travaux élastiques est conservé dans la base de données de travaux et exposé par `jobs.job_executions`, avec une ligne parente par exécution et des lignes enfants par étape et par cible. Un nettoyage système supprime l'historique de plus de 45 jours ; `jobs.sp_purge_jobhistory` supprime à la demande un historique plus récent.
  options:
    a: { en: "Azure SQL Database has no SQL Server Agent history; elastic job history is central in the job database.", fr: "Azure SQL Database n'a pas d'historique SQL Server Agent ; l'historique des travaux élastiques est centralisé dans la base de travaux." }
    c: { en: "That fixed limit applies to SQL Server Agent on SQL Managed Instance, not to elastic jobs.", fr: "Cette limite fixe s'applique à SQL Server Agent sur SQL Managed Instance, pas aux travaux élastiques." }
    e: { en: "jobs_reader only has SELECT on the jobs schema; it is meant for monitoring.", fr: "jobs_reader n'a que SELECT sur le schéma jobs ; il sert à la supervision." }
references:
  - title: Elastic jobs in Azure SQL Database
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/elastic-jobs-overview
