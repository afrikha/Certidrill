id: dp300-4b-alert-statements
objective: "4.3.3"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    An Azure SQL managed instance named **MI1** has Database Mail configured with a profile named **AzureManagedInstance_dbmail_profile**. You also use Azure Monitor alerts for your Azure resources.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Une instance managée Azure SQL nommée **MI1** dispose de Database Mail configuré avec un profil nommé **AzureManagedInstance_dbmail_profile**. Vous utilisez aussi les alertes Azure Monitor pour vos ressources Azure.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: On MI1, you can create a SQL Server Agent alert that responds to errors of severity 20 and higher.
        fr: Sur MI1, vous pouvez créer une alerte SQL Server Agent qui répond aux erreurs de gravité 20 et plus.
    - id: s2
      text:
        en: On MI1, a SQL Server Agent job can send an email to an operator when the job fails.
        fr: Sur MI1, un travail SQL Server Agent peut envoyer un e-mail à un opérateur lorsque le travail échoue.
    - id: s3
      text:
        en: An Azure Monitor action group can start an Azure Automation runbook when an alert fires.
        fr: Un groupe d'actions Azure Monitor peut démarrer un runbook Azure Automation lorsqu'une alerte se déclenche.
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: |
      SQL Server Agent alerts aren't supported on SQL Managed Instance, nor are pager and net send notifications. Email notifications to operators work through the AzureManagedInstance_dbmail_profile profile. Automation Runbook is one of the action types of an action group, next to Functions, Logic Apps, webhooks, ITSM and Event Hubs.
    fr: |
      Les alertes SQL Server Agent ne sont pas prises en charge sur SQL Managed Instance, pas plus que les notifications par radiomessagerie et net send. Les notifications par e-mail aux opérateurs fonctionnent avec le profil AzureManagedInstance_dbmail_profile. Automation Runbook fait partie des types d'action d'un groupe d'actions, avec Functions, Logic Apps, les webhooks, ITSM et Event Hubs.
references:
  - title: Automate management tasks using SQL Agent jobs in Azure SQL Managed Instance
    url: https://learn.microsoft.com/en-us/azure/azure-sql/managed-instance/job-automation-managed-instance
  - title: Create and manage action groups in Azure Monitor
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/alerts/action-groups
