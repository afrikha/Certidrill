id: dp300-4a-redundancy-properties
objective: "4.2.1"
type: hotarea
difficulty: 3
status: draft
stem:
  en: |
    A Bicep file deploys a General Purpose database named **OrdersDB** in the West Europe region. The table shows properties of the `Microsoft.Sql/servers/databases` resource and their current values.

    You need to change the file to meet the following requirements:

    - OrdersDB must remain available if one availability zone in West Europe fails.
    - Backups of OrdersDB must be restorable in the paired region if West Europe becomes unavailable.

    Which property should you change for each requirement? To answer, select the appropriate property in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Un fichier Bicep déploie une base de données General Purpose nommée **OrdersDB** dans la région West Europe. Le tableau présente des propriétés de la ressource `Microsoft.Sql/servers/databases` et leurs valeurs actuelles.

    Vous devez modifier le fichier pour satisfaire les exigences suivantes :

    - OrdersDB doit rester disponible en cas de défaillance d'une zone de disponibilité de West Europe.
    - Les sauvegardes d'OrdersDB doivent pouvoir être restaurées dans la région jumelée si West Europe devient indisponible.

    Quelle propriété devez-vous modifier pour chaque exigence ? Pour répondre, sélectionnez la propriété appropriée dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
    - { id: p1, text: { en: "Remain available if one availability zone fails", fr: "Rester disponible en cas de défaillance d'une zone de disponibilité" } }
    - { id: p2, text: { en: "Restore backups in the paired region", fr: "Restaurer les sauvegardes dans la région jumelée" } }
  grid:
    header: [{ en: Property, fr: Propriété }, { en: Current value, fr: Valeur actuelle }]
    rows:
      - [{ text: sku.name }, { text: "'GP_Gen5'" }]
      - [{ text: properties.zoneRedundant, area: zr }, { text: "false" }]
      - [{ text: properties.requestedBackupStorageRedundancy, area: bsr }, { text: "'Local'" }]
      - [{ text: properties.readScale, area: rs }, { text: "'Disabled'" }]
      - [{ text: properties.licenseType, area: lt }, { text: "'LicenseIncluded'" }]
      - [{ text: properties.maxSizeBytes, area: max }, { text: "34359738368" }]
answer:
  values: { p1: zr, p2: bsr }
explanation:
  correct:
    en: |
      `zoneRedundant: true` spreads the database replicas across availability zones of the region, which protects compute and data against a zone failure. `requestedBackupStorageRedundancy` controls where backups are stored: `Geo` or `GeoZone` replicates them to the paired region so that geo-restore is possible, whereas `Local` and `Zone` keep them in the primary region.
    fr: |
      `zoneRedundant: true` répartit les réplicas de la base de données entre les zones de disponibilité de la région, ce qui protège le calcul et les données contre la défaillance d'une zone. `requestedBackupStorageRedundancy` détermine où sont stockées les sauvegardes : `Geo` ou `GeoZone` les réplique dans la région jumelée pour permettre la géorestauration, alors que `Local` et `Zone` les gardent dans la région primaire.
  options:
    rs: { en: "readScale routes read-only connections to a secondary replica; it does not apply to General Purpose and does not add zone resilience.", fr: "readScale route les connexions en lecture seule vers un réplica secondaire ; il ne s'applique pas à General Purpose et n'apporte pas de résilience de zone." }
    lt: { en: "licenseType only controls Azure Hybrid Benefit pricing.", fr: "licenseType ne contrôle que la tarification Azure Hybrid Benefit." }
    max: { en: "maxSizeBytes sets the maximum data size.", fr: "maxSizeBytes définit la taille maximale des données." }
references:
  - title: Microsoft.Sql servers/databases
    url: https://learn.microsoft.com/en-us/azure/templates/microsoft.sql/servers/databases
