id: dp300-4a-mi-entra-group
objective: "4.1.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    You have an Azure SQL managed instance named **MI1**. A Microsoft Entra group named **DBA-Ops** has a server login on MI1 that was created by using `CREATE LOGIN [DBA-Ops] FROM EXTERNAL PROVIDER`. The msdb user mapped to that login is a member of SQLAgentOperatorRole.

    A member of DBA-Ops named **Ana** cannot create, modify or start SQL Server Agent jobs on MI1. Ana must be able to manage the jobs. The solution must follow the principle of least privilege.

    What should you do?
  fr: |
    Vous disposez d'une instance managée Azure SQL nommée **MI1**. Un groupe Microsoft Entra nommé **DBA-Ops** possède une connexion serveur sur MI1, créée avec `CREATE LOGIN [DBA-Ops] FROM EXTERNAL PROVIDER`. L'utilisateur msdb mappé à cette connexion est membre de SQLAgentOperatorRole.

    Un membre de DBA-Ops nommé **Ana** ne peut pas créer, modifier ni démarrer de travaux SQL Server Agent sur MI1. Ana doit pouvoir gérer les travaux. La solution doit respecter le principe du moindre privilège.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Add the DBA-Ops login to the sysadmin fixed server role on MI1.", fr: "Ajouter la connexion DBA-Ops au rôle serveur fixe sysadmin sur MI1." } }
    - { id: b, text: { en: "Add the msdb user of DBA-Ops to SQLAgentUserRole and SQLAgentReaderRole.", fr: "Ajouter l'utilisateur msdb de DBA-Ops à SQLAgentUserRole et à SQLAgentReaderRole." } }
    - { id: c, text: { en: "Create a Microsoft Entra login for Ana, and add her msdb user to SQLAgentOperatorRole.", fr: "Créer une connexion Microsoft Entra pour Ana, et ajouter son utilisateur msdb à SQLAgentOperatorRole." } }
    - { id: d, text: { en: "Enable SQL Server Agent for DBA-Ops on MI1 by running sp_set_agent_properties.", fr: "Activer SQL Server Agent pour DBA-Ops sur MI1 en exécutant sp_set_agent_properties." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      On SQL Managed Instance, a user must be directly mapped to a Microsoft Entra server login to create, modify or run SQL Server Agent jobs. Rights received only through a Microsoft Entra group are not effective, because of impersonation and EXECUTE AS limitations. A login for Ana mapped to an msdb user in SQLAgentOperatorRole gives her the job rights without sysadmin.
    fr: |
      Sur SQL Managed Instance, un utilisateur doit être mappé directement à une connexion serveur Microsoft Entra pour créer, modifier ou exécuter des travaux SQL Server Agent. Les droits reçus uniquement via un groupe Microsoft Entra ne sont pas effectifs, en raison des limites de l'emprunt d'identité et de EXECUTE AS. Une connexion pour Ana mappée à un utilisateur msdb membre de SQLAgentOperatorRole lui donne les droits sur les travaux sans sysadmin.
  options:
    a: { en: "This violates least privilege, and Ana would still receive the rights through the group.", fr: "Cela enfreint le moindre privilège, et Ana recevrait toujours les droits via le groupe." }
    b: { en: "More roles granted to the group do not help: group-based rights are not effective for SQL Server Agent jobs on SQL Managed Instance.", fr: "Accorder plus de rôles au groupe n'aide pas : les droits obtenus via un groupe ne sont pas effectifs pour les travaux SQL Server Agent sur SQL Managed Instance." }
    d: { en: "SQL Server Agent always runs on SQL Managed Instance, and sp_set_agent_properties isn't supported there.", fr: "SQL Server Agent s'exécute toujours sur SQL Managed Instance, et sp_set_agent_properties n'y est pas pris en charge." }
references:
  - title: T-SQL differences between SQL Server and Azure SQL Managed Instance
    url: https://learn.microsoft.com/en-us/azure/azure-sql/managed-instance/transact-sql-tsql-differences-sql-server
