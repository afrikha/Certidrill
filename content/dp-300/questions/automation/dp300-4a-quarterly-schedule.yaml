id: dp300-4a-quarterly-schedule
objective: "4.1.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    You have SQL Server 2022 on an Azure virtual machine. A SQL Server Agent job named **QuarterClose** must run at 03:00 on the first day of January, April, July and October, starting on January 1, 2027.

    You create the schedule by running `sp_add_schedule` with `@active_start_date = 20270101` and `@active_start_time = 030000`.

    Which additional parameter values should you use?
  fr: |
    Vous disposez de SQL Server 2022 sur une machine virtuelle Azure. Un travail SQL Server Agent nommé **QuarterClose** doit s'exécuter à 03:00 le premier jour de janvier, avril, juillet et octobre, à partir du 1er janvier 2027.

    Vous créez la planification en exécutant `sp_add_schedule` avec `@active_start_date = 20270101` et `@active_start_time = 030000`.

    Quelles valeurs de paramètres supplémentaires devez-vous utiliser ?
body:
  options:
    - { id: a, text: "@freq_type = 16, @freq_interval = 3, @freq_recurrence_factor = 1" }
    - { id: b, text: "@freq_type = 32, @freq_interval = 1, @freq_recurrence_factor = 3" }
    - { id: c, text: "@freq_type = 8, @freq_interval = 1, @freq_recurrence_factor = 13" }
    - { id: d, text: "@freq_type = 16, @freq_interval = 1, @freq_recurrence_factor = 3" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      `@freq_type = 16` is a monthly schedule on a day number, `@freq_interval = 1` selects the first day of the month, and `@freq_recurrence_factor = 3` runs it every three months. With a start date of January 1, 2027, the runs fall on January 1, April 1, July 1 and October 1.
    fr: |
      `@freq_type = 16` est une planification mensuelle sur un numéro de jour, `@freq_interval = 1` choisit le premier jour du mois et `@freq_recurrence_factor = 3` l'exécute tous les trois mois. Avec une date de début au 1er janvier 2027, les exécutions tombent le 1er janvier, le 1er avril, le 1er juillet et le 1er octobre.
  options:
    a: { en: "This runs on the third day of every month.", fr: "Cela s'exécute le troisième jour de chaque mois." }
    b: { en: "Type 32 is monthly relative: @freq_interval = 1 means Sunday, and it needs @freq_relative_interval (first, second... last), not a day number.", fr: "Le type 32 est mensuel relatif : @freq_interval = 1 signifie dimanche, et il nécessite @freq_relative_interval (premier, deuxième... dernier), pas un numéro de jour." }
    c: { en: "This runs on a Sunday every 13 weeks, which does not stay on the first day of the month.", fr: "Cela s'exécute un dimanche toutes les 13 semaines, ce qui ne reste pas sur le premier jour du mois." }
references:
  - title: sp_add_schedule (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/relational-databases/system-stored-procedures/sp-add-schedule-transact-sql
