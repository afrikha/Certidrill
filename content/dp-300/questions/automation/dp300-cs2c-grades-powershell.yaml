id: dp300-cs2c-grades-powershell
objective: "4.2.2"
type: dropdown
caseStudy: dp300-cs2c-adatum-learning
difficulty: 2
status: draft
shuffle: false
stem:
  en: |
    You need to create Grades to meet the Grades requirements.

    How should you complete the Azure PowerShell command? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez créer Grades pour satisfaire les exigences relatives à Grades.

    Comment devez-vous compléter la commande Azure PowerShell ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: powershell
  template: |
    New-AzSqlDatabase -ResourceGroupName "rg-adl-data" -ServerName "sql-adl-weu" `
        -DatabaseName "Grades" -Edition "GeneralPurpose" -ComputeGeneration "Gen5" `
        -VCore 4 -ComputeModel [[model]] -MinimumCapacity 0.5 `
        -AutoPauseDelayInMinutes [[pause]] `
        -BackupStorageRedundancy [[bsr]]
  slots:
    - id: model
      options:
        - { id: m_prov, text: Provisioned }
        - { id: m_srv, text: Serverless }
    - id: pause
      options:
        - { id: p_neg, text: "-1" }
        - { id: p_1, text: "1" }
        - { id: p_60, text: "60" }
        - { id: p_3600, text: "3600" }
    - id: bsr
      options:
        - { id: b_local, text: Local }
        - { id: b_zone, text: Zone }
        - { id: b_geo, text: Geo }
        - { id: b_geozone, text: GeoZone }
answer:
  values: { model: m_srv, pause: p_60, bsr: b_zone }
explanation:
  correct:
    en: |
      The serverless compute model bills compute per second of use between the minimum and maximum capacity and can pause the database when it is idle. `-AutoPauseDelayInMinutes` is expressed in minutes, so 60 pauses Grades after one hour of inactivity; -1 disables auto-pause. Zone-redundant backup storage keeps copies of the backups in several availability zones of West Europe and never replicates them to another region.
    fr: |
      Le modèle de calcul serverless facture le calcul à la seconde d'utilisation entre la capacité minimale et la capacité maximale, et peut mettre la base en pause quand elle est inactive. `-AutoPauseDelayInMinutes` s'exprime en minutes : 60 met Grades en pause après une heure d'inactivité ; -1 désactive la pause automatique. Le stockage de sauvegarde redondant interzone conserve des copies des sauvegardes dans plusieurs zones de disponibilité de la région West Europe et ne les réplique jamais vers une autre région.
  options:
    m_prov: { en: "Provisioned compute is billed per hour whether or not the database is used, and it never pauses.", fr: "Le calcul provisionné est facturé à l'heure, que la base soit utilisée ou non, et ne se met jamais en pause." }
    p_neg: { en: "-1 opts out of auto-pause, so compute would be billed continuously.", fr: "-1 désactive la pause automatique : le calcul serait facturé en continu." }
    p_1: { en: "The value is in minutes; 1 does not match the one-hour delay.", fr: "La valeur est en minutes ; 1 ne correspond pas au délai d'une heure." }
    p_3600: { en: "The value is in minutes, not seconds; 3600 would mean 60 hours.", fr: "La valeur est en minutes, pas en secondes ; 3600 correspondrait à 60 heures." }
    b_local: { en: "Locally redundant storage keeps the copies in a single datacenter and does not protect against a zone failure.", fr: "Le stockage localement redondant conserve les copies dans un seul centre de données et ne protège pas contre la défaillance d'une zone." }
    b_geo: { en: "Geo-redundant storage copies the backups to the paired region, outside West Europe.", fr: "Le stockage géoredondant copie les sauvegardes vers la région jumelée, hors de West Europe." }
    b_geozone: { en: "Geo-zone-redundant storage also copies the backups to the paired region.", fr: "Le stockage géoredondant interzone copie lui aussi les sauvegardes vers la région jumelée." }
references:
  - title: New-AzSqlDatabase (Az.Sql)
    url: https://learn.microsoft.com/en-us/powershell/module/az.sql/new-azsqldatabase
