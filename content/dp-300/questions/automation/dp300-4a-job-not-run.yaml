id: dp300-4a-job-not-run
objective: "4.1.3"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    You have SQL Server 2022 on an Azure virtual machine. A SQL Server Agent job named **PurgeAudit** has one schedule that should have started it at 02:00 last night. The SQL Server Agent service was running all night, but `sysjobhistory` contains no row for PurgeAudit since yesterday.

    Which two issues could cause this behavior?

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez de SQL Server 2022 sur une machine virtuelle Azure. Un travail SQL Server Agent nommé **PurgeAudit** a une planification qui aurait dû le démarrer à 02:00 la nuit dernière. Le service SQL Server Agent a fonctionné toute la nuit, mais `sysjobhistory` ne contient aucune ligne pour PurgeAudit depuis hier.

    Quels sont les deux problèmes qui pourraient expliquer ce comportement ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "PurgeAudit is disabled.", fr: "PurgeAudit est désactivé." } }
    - { id: b, text: { en: "PurgeAudit has no email notification to an operator.", fr: "PurgeAudit n'a pas de notification par e-mail vers un opérateur." } }
    - { id: c, text: { en: "The end date of the schedule is in the past.", fr: "La date de fin de la planification est dépassée." } }
    - { id: d, text: { en: "The mail profile is not enabled for SQL Server Agent.", fr: "Le profil de messagerie n'est pas activé pour SQL Server Agent." } }
    - { id: e, text: { en: "The job step has @retry_attempts = 0.", fr: "L'étape du travail a @retry_attempts = 0." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |
      A scheduled job does not start when the job is disabled, or when its schedule is disabled or outside its active dates (`@active_end_date` already passed). Because the job never started, no history row was written.
    fr: |
      Un travail planifié ne démarre pas quand le travail est désactivé, ou quand sa planification est désactivée ou hors de ses dates d'activité (`@active_end_date` dépassée). Comme le travail n'a jamais démarré, aucune ligne d'historique n'a été écrite.
  options:
    b: { en: "Notifications only report the outcome; a job without notification still runs.", fr: "Les notifications ne font que signaler le résultat ; un travail sans notification s'exécute quand même." }
    d: { en: "Without Agent mail, the job still runs; only emails are not sent.", fr: "Sans messagerie de l'Agent, le travail s'exécute quand même ; seuls les e-mails ne partent pas." }
    e: { en: "Retries apply after a step fails; they don't prevent the job from starting.", fr: "Les nouvelles tentatives s'appliquent après l'échec d'une étape ; elles n'empêchent pas le travail de démarrer." }
references:
  - title: Create and Attach Schedules to Jobs
    url: https://learn.microsoft.com/en-us/ssms/agent/create-and-attach-schedules-to-jobs
  - title: sp_add_schedule (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/relational-databases/system-stored-procedures/sp-add-schedule-transact-sql
