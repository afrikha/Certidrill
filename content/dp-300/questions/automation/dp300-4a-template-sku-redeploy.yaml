id: dp300-4a-template-sku-redeploy
objective: "4.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You deployed a logical server and a database named **SalesDB** to a resource group named **rg-sales** by running `az deployment group create` with a Bicep file. In the file, SalesDB uses the `S0` SKU.

    You change the SKU of SalesDB to `S3` in the Bicep file and run the same command again. You do not specify a deployment mode.

    What is the result?
  fr: |
    Vous avez déployé un serveur logique et une base de données nommée **SalesDB** dans un groupe de ressources nommé **rg-sales** en exécutant `az deployment group create` avec un fichier Bicep. Dans le fichier, SalesDB utilise la référence SKU `S0`.

    Vous changez la référence SKU de SalesDB en `S3` dans le fichier Bicep et exécutez de nouveau la même commande. Vous n'indiquez pas de mode de déploiement.

    Quel est le résultat ?
body:
  options:
    - { id: a, text: { en: "The deployment fails because SalesDB already exists.", fr: "Le déploiement échoue, car SalesDB existe déjà." } }
    - { id: b, text: { en: "A second database is created with the S3 SKU.", fr: "Une seconde base de données est créée avec la référence SKU S3." } }
    - { id: c, text: { en: "The existing SalesDB database is scaled to S3.", fr: "La base de données SalesDB existante passe à S3." } }
    - { id: d, text: { en: "SalesDB is deleted and re-created empty with the S3 SKU.", fr: "SalesDB est supprimée puis recréée vide avec la référence SKU S3." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Templates are declarative and the default mode is incremental: Resource Manager updates a resource that already exists in the resource group to match the template. Because the name is the same, SalesDB is updated to the S3 service objective and its data is kept.
    fr: |
      Les modèles sont déclaratifs et le mode par défaut est incrémentiel : Resource Manager met à jour une ressource qui existe déjà dans le groupe de ressources pour qu'elle corresponde au modèle. Comme le nom est identique, SalesDB est mise à jour vers l'objectif de service S3 et ses données sont conservées.
  options:
    a: { en: "Redeploying a template is idempotent; an existing resource is updated, not rejected.", fr: "Le redéploiement d'un modèle est idempotent ; une ressource existante est mise à jour, pas rejetée." }
    b: { en: "The resource name identifies the database, so no second database is created.", fr: "Le nom de la ressource identifie la base de données : aucune seconde base n'est créée." }
    d: { en: "An SKU change is an update of the existing database; Resource Manager doesn't delete and re-create it.", fr: "Un changement de référence SKU est une mise à jour de la base existante ; Resource Manager ne la supprime pas pour la recréer." }
references:
  - title: Azure Resource Manager deployment modes
    url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/templates/deployment-modes
