id: dp300-4a-deployment-modes
objective: "4.2.1"
type: yesno_statements
difficulty: 3
status: draft
stem:
  en: |
    A resource group named **rg-data** contains a logical server named **sql1**, a database named **db1** and a storage account named **stexports**. No lock is applied to rg-data.

    An ARM template named **main.json** defines only sql1 and db1. In main.json, you remove from db1 a property that is currently set to a non-default value, and then you deploy main.json to rg-data by running `az deployment group create`.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Un groupe de ressources nommé **rg-data** contient un serveur logique nommé **sql1**, une base de données nommée **db1** et un compte de stockage nommé **stexports**. Aucun verrou n'est appliqué à rg-data.

    Un modèle ARM nommé **main.json** définit uniquement sql1 et db1. Dans main.json, vous retirez de db1 une propriété actuellement définie sur une valeur autre que la valeur par défaut, puis vous déployez main.json dans rg-data en exécutant `az deployment group create`.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: If you add --mode Complete to the command, stexports is deleted.
        fr: Si vous ajoutez --mode Complete à la commande, stexports est supprimé.
    - id: s2
      text:
        en: If you run the command without --mode, stexports is deleted.
        fr: Si vous exécutez la commande sans --mode, stexports est supprimé.
    - id: s3
      text:
        en: If you run the command without --mode, Resource Manager keeps the current value of the property that you removed from db1.
        fr: Si vous exécutez la commande sans --mode, Resource Manager conserve la valeur actuelle de la propriété que vous avez retirée de db1.
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: |
      Complete mode deletes the resources of the resource group that aren't in the template (unless a lock prevents it), so stexports would be deleted; Microsoft recommends incremental mode and deployment stacks instead. Incremental mode, the default, leaves stexports unchanged. In incremental mode, all the properties of an existing resource are reapplied: a property missing from the template is reset to its default value, not kept, so specify every non-default value.
    fr: |
      Le mode complet supprime les ressources du groupe de ressources qui ne figurent pas dans le modèle (sauf si un verrou l'empêche) : stexports serait supprimé ; Microsoft recommande plutôt le mode incrémentiel et les piles de déploiement. Le mode incrémentiel, par défaut, laisse stexports inchangé. En mode incrémentiel, toutes les propriétés d'une ressource existante sont réappliquées : une propriété absente du modèle est réinitialisée à sa valeur par défaut, elle n'est pas conservée ; indiquez donc toutes les valeurs non par défaut.
references:
  - title: Azure Resource Manager deployment modes
    url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/templates/deployment-modes
