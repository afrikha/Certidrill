id: dp300-4a-job-owner-disabled
objective: "4.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have SQL Server 2022 on an Azure virtual machine that is joined to an Active Directory domain. Several SQL Server Agent jobs that contain Transact-SQL steps were created by a DBA who left the company. The DBA's domain account was disabled yesterday.

    Since then, the jobs fail before their first step with an error stating that SQL Server Agent cannot determine whether the job owner has server access.

    You need the jobs to run again. The solution must not depend on the account of any individual employee.

    What should you do?
  fr: |
    Vous disposez de SQL Server 2022 sur une machine virtuelle Azure jointe à un domaine Active Directory. Plusieurs travaux SQL Server Agent contenant des étapes Transact-SQL ont été créés par un administrateur de base de données qui a quitté l'entreprise. Le compte de domaine de cet administrateur a été désactivé hier.

    Depuis, les travaux échouent avant leur première étape avec une erreur indiquant que SQL Server Agent ne peut pas déterminer si le propriétaire du travail a accès au serveur.

    Les travaux doivent s'exécuter de nouveau. La solution ne doit dépendre du compte d'aucun employé.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Run sp_update_job with @enabled = 1 for each job.", fr: "Exécuter sp_update_job avec @enabled = 1 pour chaque travail." } }
    - { id: b, text: { en: "Add the SQL Server Agent service account to the sysadmin fixed server role.", fr: "Ajouter le compte de service SQL Server Agent au rôle serveur fixe sysadmin." } }
    - { id: c, text: { en: "Set @retry_attempts = 3 on the first step of each job.", fr: "Définir @retry_attempts = 3 sur la première étape de chaque travail." } }
    - { id: d, text: { en: "Run sp_update_job with @owner_login_name set to a dedicated, valid login for each job.", fr: "Exécuter sp_update_job avec @owner_login_name défini sur une connexion dédiée et valide pour chaque travail." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      SQL Server Agent checks the job owner before it runs a job, and T-SQL steps run in the owner's security context. When the owner's Windows account is disabled or deleted, the check fails. Changing the owner with `sp_update_job @owner_login_name` (which requires sysadmin) to a dedicated login fixes the jobs; the steps then run with the new owner's permissions.
    fr: |
      SQL Server Agent vérifie le propriétaire du travail avant de l'exécuter, et les étapes T-SQL s'exécutent dans le contexte de sécurité du propriétaire. Quand le compte Windows du propriétaire est désactivé ou supprimé, la vérification échoue. Changer le propriétaire avec `sp_update_job @owner_login_name` (qui nécessite sysadmin) pour une connexion dédiée corrige les travaux ; les étapes s'exécutent alors avec les autorisations du nouveau propriétaire.
  options:
    a: { en: "The jobs are enabled; they start and fail on the owner check.", fr: "Les travaux sont activés ; ils démarrent puis échouent sur la vérification du propriétaire." }
    b: { en: "The failure concerns the job owner, not the service account; it also grants excessive rights.", fr: "L'échec concerne le propriétaire du travail, pas le compte de service ; cela accorde en outre des droits excessifs." }
    c: { en: "Retries repeat the same failure because the owner is still invalid.", fr: "Les nouvelles tentatives répètent le même échec, car le propriétaire reste invalide." }
references:
  - title: sp_update_job (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/relational-databases/system-stored-procedures/sp-update-job-transact-sql
