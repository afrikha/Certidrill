id: dp300-4b-deploy-what-if
objective: "4.2.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You manage the Azure SQL databases of Tailspin Toys with a Bicep file named **main.bicep** that is deployed to a resource group named **rg-prod**.

    You change the SKU of a database named **DB1** from S2 to S3 and add a database named **DB2** to the file.

    Before you deploy the file, you need to see which resources will be created or modified. The solution must not change any resource.

    Which command should you run?
  fr: |
    Vous gérez les bases de données Azure SQL de Tailspin Toys avec un fichier Bicep nommé **main.bicep** déployé dans un groupe de ressources nommé **rg-prod**.

    Vous changez la référence SKU d'une base de données nommée **DB1** de S2 à S3 et vous ajoutez au fichier une base de données nommée **DB2**.

    Avant de déployer le fichier, vous devez voir quelles ressources seront créées ou modifiées. La solution ne doit modifier aucune ressource.

    Quelle commande devez-vous exécuter ?
body:
  options:
    - { id: a, text: "az deployment group validate --resource-group rg-prod --template-file main.bicep" }
    - { id: b, text: "az deployment group what-if --resource-group rg-prod --template-file main.bicep" }
    - { id: c, text: "az deployment group export --resource-group rg-prod --name main" }
    - { id: d, text: "az deployment group create --resource-group rg-prod --template-file main.bicep --mode Complete" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      The what-if operation predicts the changes of a deployment without modifying any existing resource. Its output marks DB2 as Create and DB1 as Modify, with the changed SKU properties.
    fr: |
      L'opération what-if prédit les modifications d'un déploiement sans modifier aucune ressource existante. Sa sortie indique Create pour DB2 et Modify pour DB1, avec les propriétés de référence SKU modifiées.
  options:
    a: { en: "validate checks that the template is valid and deployable, but it doesn't list the resources that would change.", fr: "validate vérifie que le modèle est valide et déployable, mais ne liste pas les ressources qui seraient modifiées." }
    c: { en: "export returns the template used by a past deployment; it doesn't compare the new file with the current resources.", fr: "export renvoie le modèle utilisé par un déploiement passé ; il ne compare pas le nouveau fichier aux ressources actuelles." }
    d: { en: "create deploys the file, and complete mode would also delete the resources of rg-prod that aren't in the file.", fr: "create déploie le fichier, et le mode complet supprimerait en plus les ressources de rg-prod absentes du fichier." }
references:
  - title: ARM template deployment what-if operation
    url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/templates/deploy-what-if
