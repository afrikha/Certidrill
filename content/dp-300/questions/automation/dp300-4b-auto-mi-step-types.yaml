id: dp300-4b-auto-mi-step-types
objective: "4.3.2"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    Contoso migrates an on-premises SQL Server instance to an Azure SQL managed instance named **MI1**. You plan to re-create the SQL Server Agent jobs of the instance on MI1. Each job has one job step.

    Which two job step types are supported on MI1?

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso migre une instance SQL Server locale vers une instance managée Azure SQL nommée **MI1**. Vous prévoyez de recréer sur MI1 les travaux SQL Server Agent de l'instance. Chaque travail comporte une étape de travail.

    Quels sont les deux types d'étape de travail pris en charge sur MI1 ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "SQL Server Analysis Services command", fr: "Commande SQL Server Analysis Services" } }
    - { id: b, text: { en: "Replication Merge", fr: "Réplication de fusion (Replication Merge)" } }
    - { id: c, text: { en: "Transact-SQL script", fr: "Script Transact-SQL" } }
    - { id: d, text: { en: "Replication Queue Reader", fr: "Lecteur de file d'attente de réplication (Replication Queue Reader)" } }
    - { id: e, text: { en: "SQL Server Integration Services package", fr: "Package SQL Server Integration Services" } }
answer: { optionIds: [ c, e ] }
explanation:
  correct:
    en: |
      SQL Server Agent on SQL Managed Instance supports Transact-SQL, SSIS, operating system command or PowerShell, and transactional replication job steps.
    fr: |
      SQL Server Agent sur SQL Managed Instance prend en charge les étapes de travail Transact-SQL, SSIS, commande du système d'exploitation ou PowerShell, et réplication transactionnelle.
  options:
    a: { en: "Analysis Services steps aren't supported on SQL Managed Instance.", fr: "Les étapes Analysis Services ne sont pas prises en charge sur SQL Managed Instance." }
    b: { en: "Merge replication steps aren't supported on SQL Managed Instance.", fr: "Les étapes de réplication de fusion ne sont pas prises en charge sur SQL Managed Instance." }
    d: { en: "Queue Reader steps aren't supported on SQL Managed Instance.", fr: "Les étapes Queue Reader ne sont pas prises en charge sur SQL Managed Instance." }
references:
  - title: Automate management tasks using SQL Agent jobs in Azure SQL Managed Instance
    url: https://learn.microsoft.com/en-us/azure/azure-sql/managed-instance/job-automation-managed-instance
