id: dp300-4b-deploy-statements
objective: "4.2.4"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    You deploy logical servers and databases to a resource group named **rg-sales** by using Bicep files. You troubleshoot the deployments when they fail.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous déployez des serveurs logiques et des bases de données dans un groupe de ressources nommé **rg-sales** à l'aide de fichiers Bicep. Vous diagnostiquez les déploiements lorsqu'ils échouent.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: You can enable debug logging for a deployment of rg-sales by using an Azure CLI deployment command.
        fr: Vous pouvez activer la journalisation de débogage d'un déploiement de rg-sales avec une commande de déploiement Azure CLI.
    - id: s2
      text:
        en: Running az deployment group what-if against rg-sales leaves the existing resources of rg-sales unchanged.
        fr: L'exécution de az deployment group what-if sur rg-sales laisse inchangées les ressources existantes de rg-sales.
    - id: s3
      text:
        en: When the deployment history of rg-sales approaches 800 deployments, Azure deletes older deployments from the history automatically.
        fr: Lorsque l'historique de déploiement de rg-sales approche de 800 déploiements, Azure supprime automatiquement de l'historique les déploiements les plus anciens.
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: |
      Debug logging can only be enabled from Azure PowerShell (`-DeploymentDebugLogLevel`); Azure CLI can read the logged data but can't turn it on. What-if is a read-only preview that doesn't modify existing resources. A resource group keeps up to 800 deployments in its history, and older deployments are deleted automatically as the limit approaches.
    fr: |
      La journalisation de débogage ne peut être activée que depuis Azure PowerShell (`-DeploymentDebugLogLevel`) ; Azure CLI peut lire les données journalisées mais pas l'activer. What-if est un aperçu en lecture seule qui ne modifie pas les ressources existantes. Un groupe de ressources conserve jusqu'à 800 déploiements dans son historique, et les plus anciens sont supprimés automatiquement à l'approche de la limite.
references:
  - title: Enable debug logging
    url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/troubleshooting/enable-debug-logging
  - title: View deployment history with Azure Resource Manager
    url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/templates/deployment-history
