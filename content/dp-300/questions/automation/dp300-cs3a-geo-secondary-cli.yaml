id: dp300-cs3a-geo-secondary-cli
objective: "4.2.3"
type: dropdown
caseStudy: dp300-cs3a-lamna-insurance
difficulty: 2
status: draft
shuffle: false
stem:
  en: |
    PolicyDB has been migrated to sql-li-cac. You need to create the copy of PolicyDB that meets the business continuity requirements by using the Azure CLI.

    How should you complete the command? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    PolicyDB a été migrée vers sql-li-cac. Vous devez créer la copie de PolicyDB qui respecte les exigences de continuité d'activité à l'aide d'Azure CLI.

    Comment devez-vous compléter la commande ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: bash
  template: |
    az sql db [[cmd]] \
      --resource-group rg-li-data \
      --server sql-li-cac \
      --name PolicyDB \
      --partner-server sql-li-cae \
      [[type]] \
      [[slo]]
  slots:
    - id: cmd
      options:
        - { id: copy, text: "copy" }
        - { id: create, text: "replica create" }
        - { id: setprimary, text: "replica set-primary" }
    - id: type
      options:
        - { id: readscale, text: "--read-scale Enabled" }
        - { id: named, text: "--secondary-type Named" }
        - { id: geo, text: "--secondary-type Geo" }
    - id: slo
      options:
        - { id: gp, text: "--service-objective GP_Gen5_8" }
        - { id: gps, text: "--service-objective GP_S_Gen5_8" }
        - { id: hs, text: "--service-objective HS_Gen5_8" }
        - { id: bc, text: "--service-objective BC_Gen5_8" }
answer:
  values: { cmd: create, type: geo, slo: gp }
explanation:
  correct:
    en: |
      `az sql db replica create` creates a readable secondary that is continuously and asynchronously replicated from the primary, on the server given by `--partner-server`. `--secondary-type Geo` creates an active geo-replication secondary, which can be in another region and supports a manual failover. A geo-secondary must use the same service tier as the primary, and the requirements ask for the same compute size, so the service objective is GP_Gen5_8 (General Purpose, provisioned, standard-series, 8 vCores).
    fr: |
      `az sql db replica create` crée un secondaire accessible en lecture, répliqué en continu et de façon asynchrone depuis le primaire, sur le serveur indiqué par `--partner-server`. `--secondary-type Geo` crée un secondaire de géoréplication active, qui peut se trouver dans une autre région et prend en charge un basculement manuel. Un géo-secondaire doit utiliser le même niveau de service que le primaire, et les exigences demandent la même taille de calcul : l'objectif de service est donc GP_Gen5_8 (General Purpose, provisionné, série Standard, 8 vCores).
  options:
    copy: { en: "A database copy is a transactionally consistent snapshot that is not kept up to date after the copy completes.", fr: "Une copie de base de données est un instantané cohérent sur le plan transactionnel qui n'est plus mis à jour une fois la copie terminée." }
    setprimary: { en: "replica set-primary performs a failover to an existing secondary; it does not create one.", fr: "replica set-primary effectue un basculement vers un secondaire existant ; il n'en crée pas." }
    readscale: { en: "Read scale-out routes read-only connections to a replica in the same region, only in Premium and Business Critical.", fr: "Le scale-out en lecture redirige les connexions en lecture seule vers un réplica de la même région, uniquement en Premium et Business Critical." }
    named: { en: "Named replicas exist only in the Hyperscale tier and must be in the same region as the primary.", fr: "Les réplicas nommés n'existent qu'au niveau Hyperscale et doivent se trouver dans la même région que le primaire." }
    gps: { en: "GP_S_Gen5_8 is the serverless compute tier, not the provisioned compute of PolicyDB.", fr: "GP_S_Gen5_8 correspond au niveau de calcul serverless, pas au calcul provisionné de PolicyDB." }
    hs: { en: "A geo-secondary must use the same service tier as the primary, which is General Purpose.", fr: "Un géo-secondaire doit utiliser le même niveau de service que le primaire, à savoir General Purpose." }
    bc: { en: "A geo-secondary must use the same service tier as the primary, which is General Purpose.", fr: "Un géo-secondaire doit utiliser le même niveau de service que le primaire, à savoir General Purpose." }
references:
  - title: az sql db replica
    url: https://learn.microsoft.com/en-us/cli/azure/sql/db/replica
  - title: Active geo-replication
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/active-geo-replication-overview
